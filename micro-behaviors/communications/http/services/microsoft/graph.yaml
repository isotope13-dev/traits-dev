---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: graph-service-host-source-literal
  desc: Microsoft Graph host string literal
  crit: notable
  conf: 0.9
  for:
  - scripts
  - source
  if:
    type: literal
    kind: string
    regex: "(?i)graph\\.microsoft\\.(com|us|de)|microsoftgraph\\.chinacloudapi\\.cn"
- id: graph-service-host-text
  desc: Microsoft Graph host in text data
  crit: notable
  conf: 0.9
  for:
  - binaries
  - json
  - text
  if:
    type: text
    regex: "(?i)graph\\.microsoft\\.(com|us|de)|microsoftgraph\\.chinacloudapi\\.cn"
- id: graph-drive-api-source-literal
  desc: Graph drive path string literal
  crit: notable
  conf: 0.9
  for:
  - scripts
  - csharp
  if:
    type: literal
    kind: string
    regex: "(?i)/(v[0-9]+\\.[0-9]+|beta)/(me|users/.{1,64})/drive\\b"
- id: graph-drive-api-binary-text
  desc: Graph drive path in binary strings
  crit: notable
  conf: 0.9
  for:
  - binaries
  if:
    type: text
    regex: "(?i)/(v[0-9]+\\.[0-9]+|beta)/(me|users/.{1,64})/drive\\b"
- id: graph-sharepoint-drive-api-source-literal
  desc: SharePoint site drive path string literal
  crit: notable
  conf: 0.9
  for:
  - scripts
  if:
    type: literal
    kind: string
    regex: (?i)/(v[0-9]+\.[0-9]+|beta)/sites/[^"'\r\n]{1,220}/drive\b
- id: graph-sharepoint-drive-api-binary-text
  desc: SharePoint site drive path in binary strings
  crit: notable
  conf: 0.9
  for:
  - binaries
  if:
    type: text
    regex: (?i)/(v[0-9]+\.[0-9]+|beta)/sites/[^"'\r\n]{1,220}/drive\b
- id: graph-drive-collection-path
  desc: Graph drive-collection path fragment
  crit: notable
  conf: 0.94
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(^|[/"'])drives/[^/?&\r\n]{1,160}/(root|items)\b
- id: graph-site-search-path
  desc: Graph SharePoint site-search endpoint
  crit: notable
  conf: 0.95
  for:
  - scripts
  - binaries
  if:
    type: literal
    kind: string
    regex: (?i)^/sites\?[^\r\n"']{0,160}\bsearch=
- id: graph-site-drives-path
  desc: Graph SharePoint site drive-collection endpoint
  crit: notable
  conf: 0.95
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(^|[/"'])sites/[^/?&\r\n]{1,160}/drives\b
- id: graph-message-attachments-path
  desc: Graph mailbox message-attachments endpoint
  crit: notable
  conf: 0.95
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(^|[/"'])(me|users/[^/?&\r\n]{1,160})/messages/[^/?&\r\n]{1,160}/attachments\b
- id: graph-drive-file-content-source-literal
  desc: Graph file-content path string literal
  crit: notable
  conf: 0.9
  for:
  - scripts
  if:
    type: literal
    kind: string
    regex: (?i)(^|[/"'])(drive/)?(root:/|root%3a%2f).{1,120}(:/|%3a%2f)content\b
- id: graph-drive-file-content-binary-text
  desc: Graph file-content path in binary strings
  crit: notable
  conf: 0.9
  for:
  - binaries
  if:
    type: text
    regex: (?i)(^|[/"'])(drive/)?(root:/|root%3a%2f).{1,120}(:/|%3a%2f)content\b
- id: graph-drive-root-colon-source-literal
  desc: Graph drive root path-style source fragment
  crit: notable
  conf: 0.92
  for:
  - scripts
  if:
    type: literal
    kind: string
    regex: "(?i)/drive/root(:|%3a)(/|%2f|$)"
- id: graph-path-style-content-source-literal
  desc: Graph path-style content source fragment
  crit: notable
  conf: 0.92
  for:
  - scripts
  - csharp
  if:
    type: literal
    kind: string
    regex: "(?i)(:/|%3a%2f)content\\b"
- id: graph-drive-root-colon-prefix
  desc: Graph drive root path-style prefix
  crit: notable
  conf: 0.94
  for:
  - binaries
  if:
    type: text
    substr: "/drive/root:/"
- id: graph-path-style-content-suffix
  desc: Graph path-style :/content suffix
  crit: notable
  conf: 0.9
  for:
  - pe
  - dll
  if:
    type: hex
    section: ".rdata"
    pattern: 3a 2f 63 6f 6e 74 65 6e 74
- id: graph-drive-item-content-source-literal
  desc: Graph item-content path string literal
  crit: notable
  conf: 0.9
  for:
  - scripts
  - csharp
  if:
    type: literal
    kind: string
    regex: (?i)(^|[/"'])items/.{1,120}/content\b
- id: graph-drive-item-content-binary-text
  desc: Graph item-content path in binary strings
  crit: notable
  conf: 0.9
  for:
  - binaries
  if:
    type: text
    regex: (?i)(^|[/"'])items/.{1,120}/content\b
- id: graph-drive-children-listing
  desc: Graph drive root children endpoint
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)(^|[/"'])drive/root(/|%2f)children\b
- id: graph-drive-item-children
  desc: Graph drive item children endpoint
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)(^|[/"'])items/.{1,120}/(children)\b
- id: graph-mail-folder-recon-path
  desc: Microsoft Graph mail-folder path
  crit: baseline
  conf: 0.92
  for:
  - scripts
  if:
    type: text
    regex: "(/|me/)mailFolders\\b"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: graph-contact-recon-path
  desc: Microsoft Graph contacts path
  crit: baseline
  conf: 0.92
  for:
  - scripts
  if:
    type: text
    regex: "(/|me/)contacts\\b"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: graph-calendar-recon-path
  desc: Microsoft Graph calendar events path
  crit: baseline
  conf: 0.92
  for:
  - scripts
  if:
    type: literal
    regex: "(^|/)me/(calendar/)?events([/?#]|$)"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: graph-target-user-mailbox-token
  desc: Microsoft Graph user-mailbox endpoint reference
  crit: notable
  for:
  - scripts
  - binaries
  - json
  - text
  if:
    type: text
    regex: graph\.microsoft\.(com|us|de)/\S{1,8}/users/\S{1,64}/(messages|mailFolders)\b
- id: graph-mail-received-date-filter
  desc: Graph mail received-date filter comparison
  crit: notable
  conf: 0.94
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: receivedDateTime\s+(ge|gt|le|lt|eq)\b
composite_rules:
- id: graph-service-host
  desc: Microsoft Graph API service host
  crit: notable
  conf: 0.9
  for:
  - scripts
  - source
  - binaries
  - json
  - text
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-service-host-source-literal
  - id: micro-behaviors/communications/http/services/microsoft::graph-service-host-text
- id: graph-drive-api
  desc: Graph drive API path
  crit: notable
  conf: 0.9
  for:
  - scripts
  - csharp
  - binaries
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-api-source-literal
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-api-binary-text
  - id: micro-behaviors/communications/http/services/microsoft::graph-sharepoint-drive-api-source-literal
  - id: micro-behaviors/communications/http/services/microsoft::graph-sharepoint-drive-api-binary-text
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-collection-path
- id: graph-drive-file-content
  desc: Graph drive file-content path
  crit: notable
  conf: 0.9
  for:
  - scripts
  - csharp
  - binaries
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-file-content-source-literal
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-file-content-binary-text
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-split-path-content
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-split-path-content-source
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-path-style-content-csharp
- id: graph-drive-split-path-content-source
  desc: Graph source constructs a path-style file-content endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  all:
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-root-colon-source-literal
  - id: micro-behaviors/communications/http/services/microsoft::graph-path-style-content-source-literal
  near_bytes: 8192
- id: graph-drive-path-style-content-csharp
  desc: C# Graph drive root with path-style content suffix
  crit: notable
  conf: 0.92
  for:
  - csharp
  all:
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-api-source-literal
  - id: micro-behaviors/communications/http/services/microsoft::graph-path-style-content-source-literal
  near_bytes: 8192
- id: graph-drive-split-path-content
  desc: Graph root path prefix with content suffix
  crit: notable
  conf: 0.92
  for:
  - pe
  all:
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-root-colon-prefix
  - id: micro-behaviors/communications/http/services/microsoft::graph-path-style-content-suffix
- id: graph-drive-item-content
  desc: Graph drive item-content path
  crit: notable
  conf: 0.9
  for:
  - scripts
  - csharp
  - binaries
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-item-content-source-literal
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-item-content-binary-text
- id: graph-target-user-mailbox-path
  desc: Graph other-user mailbox path
  crit: notable
  conf: 0.95
  for:
  - scripts
  - binaries
  - json
  - text
  all:
  - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
  - id: micro-behaviors/communications/http/services/microsoft::graph-target-user-mailbox-token
  near_bytes: 240
- id: graph-drive-file-sync
  desc: Graph file-content endpoints with fetch calls
  crit: notable
  conf: 0.95
  near_lines: 100
  all:
  - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-api
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-file-content
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-item-content
- id: graph-account-recon-path-set
  desc: Microsoft Graph mailbox and identity reconnaissance paths
  crit: notable
  conf: 0.96
  for:
  - scripts
  all:
  - id: micro-behaviors/communications/http/services/microsoft::microsoft-graph-domain
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-mail-folder-recon-path
  - id: micro-behaviors/communications/http/services/microsoft::graph-contact-recon-path
  - id: micro-behaviors/communications/http/services/microsoft::graph-calendar-recon-path
  - id: micro-behaviors/communications/http/services/entra-directory::graph-manager-recon-path
  - id: micro-behaviors/communications/http/services/entra-directory::graph-direct-reports-recon-path
  needs: 3
  near_bytes: 8192
- id: graph-paginated-result-reader
  desc: References paginated Microsoft Graph results
  crit: notable
  conf: 0.97
  for:
  - scripts
  all:
  - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
  - id: micro-behaviors/communications/http/query::odata-next-page-link
  near_bytes: 8192
- id: graph-repository-enumeration
  desc: Graph site and drive enumeration endpoints
  crit: notable
  conf: 0.97
  for:
  - scripts
  - binaries
  all:
  - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
  any:
  - id: micro-behaviors/communications/http/services/microsoft::graph-site-search-path
  - id: micro-behaviors/communications/http/services/microsoft::graph-site-drives-path
  - id: micro-behaviors/communications/http/services/microsoft::graph-drive-children-listing
  needs: 2
  near_bytes: 8192
- id: graph-drive-read-request
  desc: Graph drive endpoints with HTTP read APIs
  crit: notable
  conf: 0.92
  for:
  - scripts
  - csharp
  - binaries
  attack: T1071.001
