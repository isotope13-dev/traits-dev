defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: graph-service-host
    desc: Microsoft Graph API service host
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)graph\.microsoft\.(com|us|de)|microsoftgraph\.chinacloudapi\.cn'

  - id: graph-drive-api
    desc: Graph drive API path
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)/(v[0-9]+\.[0-9]+|beta)/(me|users/.{1,64})/drive\b'

  - id: graph-drive-file-content
    desc: Graph drive file-content path
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])(drive/)?(root:/|root%3a%2f).{1,120}(:/|%3a%2f)content\b'

  - id: graph-drive-item-content
    desc: Graph drive item-content path
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])items/.{1,120}/content\b'

  - id: graph-drive-children-listing
    desc: Graph drive children endpoint
    for: [scripts, binaries]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[/"''])(drive/)?root(/|%2f)children\b'

  - id: graph-drive-item-children
    desc: Graph drive item children endpoint
    for: [scripts, binaries]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[/"''])items/.{1,120}/(children)\b'

  # Graph clients often keep the service root in a variable and concatenate
  # resource paths at runtime.  Keep these path atoms provider-neutral and
  # reusable; the objective tier decides when the collection set is hostile.
  - id: graph-mail-folder-recon-path
    desc: Microsoft Graph mail-folder path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)mailFolders\b'

  - id: graph-contact-recon-path
    desc: Microsoft Graph contacts path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)contacts\b'

  - id: graph-calendar-recon-path
    desc: Microsoft Graph calendar events path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)events\b'

  - id: graph-manager-recon-path
    desc: Microsoft Graph manager path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)manager\b'

  - id: graph-direct-reports-recon-path
    desc: Microsoft Graph direct-reports path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)directReports\b'

  - id: graph-service-principal-role-assignment-path
    desc: Microsoft Graph role-assignment endpoint
    for: [scripts]
    if:
      type: text
      regex: '(?i)(graph\.microsoft\.com/v[0-9.]+/)?servicePrincipals/.{0,80}/appRoleAssignedTo\b'

  # Listing the whole directory rather than reading one account. The OData
  # `$select`/`$filter` query form is what a caller uses to page every user in
  # the tenant, and it is the step that turns a per-mailbox action into a
  # tenant-wide one.
  - id: graph-user-directory-listing
    desc: Graph tenant user directory listing
    for: [scripts]
    if:
      type: text
      regex: '(?i)/users\?\$(select|filter|top|expand)\b'

  - id: graph-target-user-mailbox-path
    desc: Graph other-user mailbox path
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])(users/[^/?&"'']{1,128}/(mailFolders|messages))\b'

  - id: graph-service-principals-path
    desc: Graph service-principal collection path
    crit: notable
    conf: 0.94
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])servicePrincipals([/\?]|$)'

  - id: graph-directory-roles-path
    desc: Graph directory-roles collection path
    crit: notable
    conf: 0.94
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])directoryRoles\b'

  - id: graph-role-management-path
    desc: Graph directory role-management path
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])roleManagement/directory/(roleAssignments|roleDefinitions)\b'

  - id: graph-application-credential-add-path
    desc: Graph application credential-add path
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])applications/[^/?&"'']{1,128}/(addPassword|addKey)\b'

  - id: graph-service-principal-credential-add-path
    desc: Graph service-principal credential-add path
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])servicePrincipals/[^/?&"'']{1,128}/(addPassword|addKey)\b'

  - id: graph-mg-credential-add-cmdlet
    desc: Adds Graph identity credential via SDK
    crit: notable
    conf: 0.94
    for: [scripts]
    if:
      type: text
      regex: '(?i)\b(New|Add)-Mg(Application|ServicePrincipal)(Password|Key)\b'

  - id: graph-azuread-credential-add-cmdlet
    desc: Adds Azure AD identity credential
    crit: notable
    conf: 0.94
    for: [scripts]
    if:
      type: text
      regex: '(?i)\b(New|Add)-AzureADServicePrincipal(Key|Password)Credential\b'

composite_rules:
  - id: graph-identity-credential-add
    desc: Adds an Entra identity credential
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    any:
      - id: graph-application-credential-add-path
      - id: graph-service-principal-credential-add-path
      - id: graph-mg-credential-add-cmdlet
      - id: graph-azuread-credential-add-cmdlet

  - id: graph-drive-file-sync
    desc: Microsoft Graph drive file synchronization
    crit: notable
    conf: 0.95
    all:
      - id: graph-service-host
      - id: graph-drive-api
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: graph-drive-file-content
      - id: graph-drive-item-content

  - id: graph-account-recon-path-set
    desc: Microsoft Graph mailbox and identity reconnaissance paths
    crit: notable
    conf: 0.96
    for: [scripts]
    all:
      - id: micro-behaviors/communications/http/oauth::microsoft-graph
    any:
      - id: graph-mail-folder-recon-path
      - id: graph-contact-recon-path
      - id: graph-calendar-recon-path
      - id: graph-manager-recon-path
      - id: graph-direct-reports-recon-path
    needs: 3
    near_bytes: 8192
