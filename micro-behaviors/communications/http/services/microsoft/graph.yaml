defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # Source comments are not behavior. Keep source-code matches on parsed
  # string literals, while retaining text scans for opaque binaries and data.
  - id: graph-service-host-source-literal
    desc: Microsoft Graph host string literal
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: literal
      kind: string
      regex: '(?i)graph\.microsoft\.(com|us|de)|microsoftgraph\.chinacloudapi\.cn'

  - id: graph-service-host-text
    desc: Microsoft Graph host in text data
    crit: component
    conf: 0.9
    for: [binaries, json, text]
    if:
      type: text
      regex: '(?i)graph\.microsoft\.(com|us|de)|microsoftgraph\.chinacloudapi\.cn'

  - id: graph-drive-api-source-literal
    desc: Graph drive path string literal
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: literal
      kind: string
      regex: '(?i)/(v[0-9]+\.[0-9]+|beta)/(me|users/.{1,64})/drive\b'

  - id: graph-drive-api-binary-text
    desc: Graph drive path in binary strings
    crit: component
    conf: 0.9
    for: [binaries]
    if:
      type: text
      regex: '(?i)/(v[0-9]+\.[0-9]+|beta)/(me|users/.{1,64})/drive\b'

  - id: graph-sharepoint-drive-api-source-literal
    desc: SharePoint site drive path string literal
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: literal
      kind: string
      regex: '(?i)/(v[0-9]+\.[0-9]+|beta)/sites/[^"''\r\n]{1,220}/drive\b'

  - id: graph-sharepoint-drive-api-binary-text
    desc: SharePoint site drive path in binary strings
    crit: component
    conf: 0.9
    for: [binaries]
    if:
      type: text
      regex: '(?i)/(v[0-9]+\.[0-9]+|beta)/sites/[^"''\r\n]{1,220}/drive\b'

  - id: graph-drive-file-content-source-literal
    desc: Graph file-content path string literal
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[/"''])(drive/)?(root:/|root%3a%2f).{1,120}(:/|%3a%2f)content\b'

  - id: graph-drive-file-content-binary-text
    desc: Graph file-content path in binary strings
    crit: component
    conf: 0.9
    for: [binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])(drive/)?(root:/|root%3a%2f).{1,120}(:/|%3a%2f)content\b'

  # Source clients commonly keep the drive root in one constant and append a
  # filename plus `:/content` in another interpolated string. These are only
  # fragments; the composite below requires both halves before reporting a
  # Graph file-content path.
  - id: graph-drive-root-colon-source-literal
    desc: Graph drive root path-style source fragment
    crit: component
    conf: 0.92
    for: [scripts]
    if:
      type: literal
      kind: string
      regex: '(?i)/drive/root(:|%3a)(/|%2f)'

  - id: graph-path-style-content-source-literal
    desc: Graph path-style content source fragment
    crit: component
    conf: 0.92
    for: [scripts]
    if:
      type: literal
      kind: string
      regex: '(?i)(:/|%3a%2f)content\b'

  # Native Graph clients often keep the path-style root prefix and the
  # `:/content` suffix in separate literals and concatenate at runtime.
  - id: graph-drive-root-colon-prefix
    desc: Graph drive root path-style prefix
    crit: notable
    conf: 0.94
    for: [binaries]
    if:
      type: text
      substr: '/drive/root:/'

  - id: graph-path-style-content-suffix
    desc: Graph path-style :/content suffix
    crit: component
    conf: 0.9
    for: [pe, dll]
    # Leading ':' is dropped by the PE string extractor, so match raw bytes.
    if:
      type: hex
      section: .rdata
      pattern: '3a 2f 63 6f 6e 74 65 6e 74'

  - id: graph-drive-item-content-source-literal
    desc: Graph item-content path string literal
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[/"''])items/.{1,120}/content\b'

  - id: graph-drive-item-content-binary-text
    desc: Graph item-content path in binary strings
    crit: component
    conf: 0.9
    for: [binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])items/.{1,120}/content\b'

  - id: graph-drive-children-listing
    desc: Graph drive children endpoint
    for: [scripts, binaries]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[/"''])(drive/)?root(/|%2f)children\b'

  - id: graph-drive-item-children
    desc: Graph drive item children endpoint
    for: [scripts, binaries]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[/"''])items/.{1,120}/(children)\b'

  # Graph clients often keep the service root in a variable and concatenate
  # resource paths at runtime.  Keep these path atoms provider-neutral and
  # reusable; the objective tier decides when the collection set is hostile.
  - id: graph-mail-folder-recon-path
    desc: Microsoft Graph mail-folder path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)mailFolders\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: graph-contact-recon-path
    desc: Microsoft Graph contacts path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)contacts\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: graph-calendar-recon-path
    desc: Microsoft Graph calendar events path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)events\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: graph-manager-recon-path
    desc: Microsoft Graph manager path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)manager\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: graph-direct-reports-recon-path
    desc: Microsoft Graph direct-reports path
    crit: baseline
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(/|me/)directReports\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: graph-service-principal-role-assignment-path
    desc: Microsoft Graph role-assignment endpoint
    for: [scripts]
    if:
      type: text
      regex: '(?i)(graph\.microsoft\.com/v[0-9.]+/)?servicePrincipals/.{0,80}/appRoleAssignedTo\b'

  # Listing the whole directory rather than reading one account. The OData
  # `$select`/`$filter` query form is what a caller uses to page every user in
  # the tenant, and it is the step that turns a per-mailbox action into a
  # tenant-wide one.
  - id: graph-user-directory-listing
    desc: Graph tenant user directory listing
    for: [scripts]
    if:
      type: text
      regex: '(?i)/users?\$(select|filter|top|expand)\b'

  # A large page size is the concrete bulk-harvesting shape documented for
  # Payroll Pirate Graph reconnaissance.  Keep the endpoint and OData field
  # together so a prose mention of `$top` is not enough to match.
  - id: graph-user-directory-bulk-page
    desc: Graph user directory bulk page request
    crit: notable
    conf: 0.95
    for: [scripts, binaries, json, text]
    if:
      type: text
      regex: '(?i)/users\?.{0,80}\$top=[1-9][0-9]{2,}\b'

  - id: graph-user-directory-finance-search
    desc: Graph payroll or finance user search
    crit: notable
    conf: 0.96
    for: [scripts, binaries, json, text]
    if:
      type: text
      regex: '(?i)/users\?.{0,100}\$search.{0,100}\b(payroll|finance)\b'

  - id: graph-user-directory-hr-search
    desc: Graph HR user search
    crit: notable
    conf: 0.95
    for: [scripts, binaries, json, text]
    if:
      type: text
      regex: '(?i)/users\?.{0,100}\$search.{0,100}\bhr\b'

  - id: graph-user-directory-skiptoken
    desc: Graph user directory skiptoken pagination
    crit: notable
    conf: 0.94
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)/users\?.{0,160}\$skiptoken='

  - id: graph-target-user-mailbox-token
    desc: Graph other-user mailbox endpoint
    crit: component
    for: [scripts, binaries, json, text]
    if:
      type: text
      regex: '/users/[A-Za-z0-9._~%@-]{1,128}/(mailFolders|messages)\b'

  - id: graph-service-principals-path
    desc: Graph service-principal collection path
    crit: notable
    conf: 0.94
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])servicePrincipals([/\?]|$)'

  - id: graph-directory-roles-path
    desc: Graph directory-roles collection path
    crit: notable
    conf: 0.94
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])directoryRoles\b'

  # "applications" is not a Graph-unique word, so unlike the sibling resource
  # paths this one stays anchored to the Graph service host.
  - id: graph-applications-path
    desc: Graph application-registration collection path
    crit: notable
    conf: 0.92
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)graph\.microsoft\.com.{0,80}/applications\b'

  - id: delegated-permission-schema-field
    desc: References delegated permission schema
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(delegatedPermissions?|requiredResourceAccess)'

  - id: graph-role-management-path
    desc: Graph directory role-management path
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])roleManagement/directory/(roleAssignments|roleDefinitions)\b'

  - id: graph-application-credential-add-path
    desc: Graph application credential-add path
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])applications/[^/?&"'']{1,128}/(addPassword|addKey)\b'

  - id: graph-service-principal-credential-add-path
    desc: Graph service-principal credential-add path
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[/"''])servicePrincipals/[^/?&"'']{1,128}/(addPassword|addKey)\b'

  - id: graph-mg-credential-add-cmdlet
    desc: Adds Graph identity credential via SDK
    crit: notable
    conf: 0.94
    for: [scripts]
    if:
      type: text
      regex: '(?i)\b(New|Add)-Mg(Application|ServicePrincipal)(Password|Key)\b'

  - id: graph-azuread-credential-add-cmdlet
    desc: Adds Azure AD identity credential
    crit: notable
    conf: 0.94
    for: [scripts]
    if:
      type: text
      regex: '(?i)\b(New|Add)-AzureADServicePrincipal(Key|Password)Credential\b'

composite_rules:
  - id: graph-service-host
    desc: Microsoft Graph API service host
    crit: notable
    conf: 0.9
    for: [scripts, binaries, json, text]
    any:
      - id: graph-service-host-source-literal
      - id: graph-service-host-text

  - id: graph-drive-api
    desc: Graph drive API path
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    any:
      - id: graph-drive-api-source-literal
      - id: graph-drive-api-binary-text
      - id: graph-sharepoint-drive-api-source-literal
      - id: graph-sharepoint-drive-api-binary-text

  - id: graph-drive-file-content
    desc: Graph drive file-content path
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    any:
      - id: graph-drive-file-content-source-literal
      - id: graph-drive-file-content-binary-text
      - id: graph-drive-split-path-content
      - id: graph-drive-split-path-content-source

  - id: graph-drive-split-path-content-source
    desc: Graph source constructs a path-style file-content endpoint
    crit: notable
    conf: 0.94
    for: [scripts]
    all:
      - id: graph-drive-root-colon-source-literal
      - id: graph-path-style-content-source-literal
    near_bytes: 8192

  - id: graph-drive-split-path-content
    desc: Graph root path prefix with content suffix
    crit: notable
    conf: 0.92
    for: [binaries]
    all:
      - id: graph-drive-root-colon-prefix
      - id: graph-path-style-content-suffix

  - id: graph-drive-item-content
    desc: Graph drive item-content path
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    any:
      - id: graph-drive-item-content-source-literal
      - id: graph-drive-item-content-binary-text

  # The two Graph resources that describe who can grant what: app
  # registrations and the directory role assignment/definition surface.
  - id: graph-app-authority-path
    desc: Graph application or role-authority path
    crit: notable
    conf: 0.93
    for: [scripts, binaries]
    any:
      - id: graph-applications-path
      - id: graph-role-management-path

  - id: graph-target-user-mailbox-path
    desc: Graph other-user mailbox path
    crit: notable
    conf: 0.95
    for: [scripts, binaries, json, text]
    all:
      - id: graph-service-host
      - id: graph-target-user-mailbox-token
    near_bytes: 240

  - id: graph-identity-credential-add
    desc: Adds an Entra identity credential
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    any:
      - id: graph-application-credential-add-path
      - id: graph-service-principal-credential-add-path
      - id: graph-mg-credential-add-cmdlet
      - id: graph-azuread-credential-add-cmdlet

  - id: graph-drive-file-sync
    desc: Microsoft Graph drive file synchronization
    crit: notable
    conf: 0.95
    # A source file can implement multiple cloud providers. Keep the fetch
    # call correlated with the Graph path instead of pairing a Google Drive
    # fetch with a later Microsoft Graph constant in the same file.
    near_lines: 100
    all:
      - id: graph-service-host
      - id: graph-drive-api
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: graph-drive-file-content
      - id: graph-drive-item-content

  - id: graph-account-recon-path-set
    desc: Microsoft Graph mailbox and identity reconnaissance paths
    crit: notable
    conf: 0.96
    for: [scripts]
    all:
      - id: micro-behaviors/communications/http/oauth::microsoft-graph
    any:
      - id: graph-mail-folder-recon-path
      - id: graph-contact-recon-path
      - id: graph-calendar-recon-path
      - id: graph-manager-recon-path
      - id: graph-direct-reports-recon-path
    needs: 3
    near_bytes: 8192
