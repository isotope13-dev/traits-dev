# SharePoint document-resource endpoints. These are protocol mechanics; an
# objective composite supplies the captured-session and forwarding context.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: sharepoint-rest-file-content-endpoint
    desc: SharePoint REST file-content endpoint
    if:
      type: text
      # Match the protocol method itself so URLs split across adjacent Python
      # literals and PowerShell's escaped `$value` form are both covered.
      regex: '(?i)\bGetFileByServerRelative(Url|Path)\b'

  - id: sharepoint-current-user-endpoint
    desc: SharePoint REST current-user endpoint
    crit: notable
    conf: 0.97
    if:
      type: string_literal
      exact: /_api/web/currentuser

  - id: sharepoint-site-admin-result-field
    desc: SharePoint current-user site-admin result field
    crit: notable
    conf: 0.93
    if:
      type: string_literal
      exact: IsSiteAdmin

  - id: sharepoint-s2s-jwt-handler-v2
    desc: SharePoint S2S JWT token-handler class
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bSPJsonWebSecurity(Base)?TokenHandlerV2\b'

  - id: sharepoint-upn-identity-claim
    desc: SharePoint JWT UPN claim
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']upn["'']\s*[:=]'
