# SharePoint document-resource endpoints. These are protocol mechanics; an
# objective composite supplies the captured-session and forwarding context.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: sharepoint-rest-search-endpoint-source
    desc: SharePoint REST search endpoint string literal
    conf: 0.97
    if:
      type: string_literal
      regex: '(?i)(^|/)_api/search/(query|postquery)([/?#]|$)'

  - id: sharepoint-rest-search-endpoint-binary
    desc: SharePoint REST search endpoint in binary
    for: [binaries]
    conf: 0.97
    if:
      type: text
      regex: '(?i)(^|/)_api/search/(query|postquery)([/?#]|$)'

  - id: sharepoint-site-contentclass-source
    desc: SharePoint site content-class literal
    conf: 0.98
    if:
      type: string_literal
      regex: '(?i)\bcontentclass\s*:\s*STS_Site\b'

  - id: sharepoint-site-contentclass-binary
    desc: SharePoint site content-class in binary
    for: [binaries]
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bcontentclass\s*:\s*STS_Site\b'

  - id: sharepoint-web-contentclass-source
    desc: SharePoint web content-class literal
    conf: 0.98
    if:
      type: string_literal
      regex: '(?i)\bcontentclass\s*:\s*STS_Web\b'

  - id: sharepoint-web-contentclass-binary
    desc: SharePoint web content-class in binary
    for: [binaries]
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bcontentclass\s*:\s*STS_Web\b'

  - id: sharepoint-indexdocid-wildcard-source
    desc: SharePoint wildcard IndexDocId literal
    conf: 0.98
    if:
      type: string_literal
      regex: '(?i)\*[^*\r\n"'']{0,80}\bIndexDocId\s*>\s*\S{1,80}'

  - id: sharepoint-indexdocid-wildcard-binary
    desc: SharePoint wildcard IndexDocId in binary
    for: [binaries]
    conf: 0.98
    if:
      type: text
      regex: '(?i)\*[^*\x00\r\n]{0,80}\bIndexDocId\s*>\s*[^\s\x00]{1,80}'

  - id: sharepoint-rest-file-content-endpoint
    desc: SharePoint REST file-content endpoint
    if:
      type: text
      # Match the protocol method itself so URLs split across adjacent Python
      # literals and PowerShell's escaped `$value` form are both covered.
      regex: '(?i)\bGetFileByServerRelative(Url|Path)\b'

  - id: sharepoint-current-user-endpoint
    desc: SharePoint REST current-user endpoint
    crit: notable
    conf: 0.97
    if:
      type: string_literal
      exact: /_api/web/currentuser

  - id: sharepoint-site-admin-result-field
    desc: SharePoint current-user site-admin result field
    crit: notable
    conf: 0.93
    if:
      type: string_literal
      exact: IsSiteAdmin

  - id: sharepoint-s2s-jwt-handler-v2
    desc: SharePoint S2S JWT token-handler class
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bSPJsonWebSecurity(Base)?TokenHandlerV2\b'

  - id: sharepoint-upn-identity-claim
    desc: SharePoint JWT UPN claim
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']upn["'']\s*[:=]'

composite_rules:
  - id: sharepoint-rest-search-endpoint
    desc: SharePoint REST search API endpoint
    for: [scripts, source, binaries]
    crit: notable
    conf: 0.97
    any:
      - id: sharepoint-rest-search-endpoint-source
      - id: sharepoint-rest-search-endpoint-binary

  - id: sharepoint-site-contentclass-selector
    desc: SharePoint search selects site containers
    for: [scripts, source, binaries]
    crit: notable
    conf: 0.98
    any:
      - id: sharepoint-site-contentclass-source
      - id: sharepoint-site-contentclass-binary

  - id: sharepoint-web-contentclass-selector
    desc: SharePoint search selects web containers
    for: [scripts, source, binaries]
    crit: notable
    conf: 0.98
    any:
      - id: sharepoint-web-contentclass-source
      - id: sharepoint-web-contentclass-binary

  - id: sharepoint-indexdocid-wildcard-pagination
    desc: SharePoint search pages wildcard results by IndexDocId
    for: [scripts, source, binaries]
    crit: notable
    conf: 0.98
    any:
      - id: sharepoint-indexdocid-wildcard-source
      - id: sharepoint-indexdocid-wildcard-binary
