# Hostname references establish service context, independently of OAuth use.
# Matchers, scope, severity and exclusions are preserved from the OAuth leaf.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: microsoft-login-domain
    desc: References a Microsoft login domain
    crit: notable
    conf: 0.6
    # A cloned or relay sign-in page names the real endpoint in page markup, not
    # only in script, so this marker has to be visible on html as well.
    for: [scripts, binaries, html, csharp, typescript, go]
    if:
      type: text
      regex: '\blogin\.microsoft(online)?\.com\b'
    unless:
    - id: metadata/build/minifier::js-minified-template-guard
  - id: microsoft-graph-domain
    desc: References Microsoft Graph hostname text
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: graph.microsoft.com
    unless:
    - id: metadata/build/minifier::js-minified-template-guard

composite_rules:
  - id: identity-or-graph-domain
    desc: Microsoft identity or Graph domain reference
    crit: notable
    conf: 0.66
    any:
    - id: microsoft-login-domain
    - id: microsoft-graph-domain
