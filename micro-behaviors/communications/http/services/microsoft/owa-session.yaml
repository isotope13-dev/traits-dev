defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, ruby, csharp, go, java]
  crit: notable
  conf: 0.95

traits:
  - id: owa-token-session-endpoint
    desc: Calls Outlook Web Access token exchange endpoint
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(post(async)?|loadURL|fetch)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^https://outlook\.office(365)?\.com/owa/auth\.owa([?#]|$)'
