defaults:
  crit: exception
  conf: 0.95
  platforms: [windows, unix]
  for: [scripts, source, binaries]

composite_rules:
  - id: google-apps-script-extension-install-startup-telemetry
    for: [javascript]
    desc: Extension install-startup telemetry context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-extension-install-startup-telemetry
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-apps-script-extension-ad-fetch-context
    for: [javascript]
    desc: Extension ad configuration context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-extension-ad-fetch-context
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-apps-script-telemetry-context
    desc: Apps Script telemetry logging context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-telemetry-context
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-apps-script-license-validation-context
    for: [javascript]
    desc: Apps Script license validation context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-license-validation-context
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-slides-merge-client
    for: [python]
    desc: Google Slides merge client context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-slides-merge-client
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-apps-script-extension-lifecycle-telemetry
    for: [javascript]
    desc: Extension lifecycle telemetry context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-extension-lifecycle-telemetry
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-apps-script-extension-analytics-context
    for: [javascript]
    desc: Extension analytics context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-extension-analytics-context
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-apps-script-extension-installation-analytics
    for: [javascript]
    desc: Extension installation analytics context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-extension-installation-analytics
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-apps-script-login-validation-context
    for: [javascript]
    desc: Extension login validation context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-login-validation-context
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path

  - id: google-apps-script-extension-feedback-context
    for: [javascript]
    desc: Extension feedback form context
    all:
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-extension-feedback-context
      - id: micro-behaviors/communications/http/services/apps-script-google::google-apps-script-macros-path
