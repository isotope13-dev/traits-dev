# Zeit Now (now Vercel) cloud platform API service endpoints.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell, go, rust]
  crit: notable
  conf: 0.88
  mbc: C0002

traits:
  - id: zeit-api-host
    desc: Zeit Now API host reference
    if:
      type: text
      substr: api.zeit.co

  - id: vercel-api-host
    desc: Vercel API host reference
    if:
      type: text
      substr: api.vercel.com
