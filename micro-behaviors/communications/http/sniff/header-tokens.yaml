# Header tokens searched when scraping HTTP credentials from local traffic
# or connection tables (Basic Authorization and Cookie request lines).
defaults:
  platforms: [unix, android]
  for: [c, cpp, rust, go, elf, shell, python]
  attack: T1040
  mbc: C0002

traits:
  - id: authorization-basic-header-token
    desc: HTTP Basic Authorization header token
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "Authorization: Basic"

  - id: cookie-request-header-token
    desc: HTTP Cookie request header token
    crit: notable
    conf: 0.9
    if:
      type: text
      # Require HTTP cookie-value syntax.  A bare "Cookie: " also occurs in
      # unrelated diagnostics such as X11's XInputWireToCookie errors.
      regex: 'Cookie:\s(%[-+.#0-9]*s|[!#$%&''*+.^_`A-Za-z0-9|~-]{1,64}=)'
