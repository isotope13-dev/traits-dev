# Request shapes used by the article's browser-proxy and form-capture channel.
# The endpoint names and parameter relationships are structural protocol
# evidence; the suspicious/hostile interpretations live in objective traits.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  mbc: C0002
  attack: T1041

traits:
  - id: browser-url-relay-path
    desc: Browser URL relay endpoint path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '/churl\?'

  - id: browser-url-relay-pcid
    desc: Browser relay device identifier parameter
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bpcid=[A-Za-z0-9]{8,96}\b'

  - id: browser-url-relay-target
    desc: Browser relay target URL parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(url|uri|target)=https?://'

  - id: browser-form-save-path
    desc: Browser form-save endpoint path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '/fsave\?'

  - id: browser-form-save-name
    desc: Browser form credential field name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bname=(Password|Pass|Username)\b'

  # The relay sends the captured field as a query parameter, so the `?`/`&`
  # (or start of the request line) is what makes this a submitted value. A bare
  # `\bvalue=` matched every keyword argument, HTML attribute and config
  # assignment in any language — loguru's `logger.opt(...).info("...",
  # value=123)` docstring among them.
  - id: browser-form-save-value
    desc: Browser form submitted value parameter
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(^|[?&])value=[^ \t&]{1,160}'

composite_rules:
  - id: browser-url-relay-endpoint
    desc: Browser URL relay request shape
    crit: suspicious
    conf: 0.96
    near_bytes: 256
    all:
      - id: browser-url-relay-path
      - id: browser-url-relay-pcid
      - id: browser-url-relay-target

  - id: browser-form-save-endpoint
    desc: Browser form credential request shape
    crit: suspicious
    conf: 0.97
    near_bytes: 256
    all:
      - id: browser-form-save-path
      - id: browser-form-save-name
      - id: browser-form-save-value
