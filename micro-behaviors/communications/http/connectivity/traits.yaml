defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]

traits:
  # These are well-known operating-system connectivity checks. They are
  # neutral endpoint observations; captive-portal intent needs more context.
  - id: generate-204-connectivity-probe
    desc: Generate-204 connectivity endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /generate_204

  - id: hotspot-detect-connectivity-probe
    desc: Hotspot-detect connectivity endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /hotspot-detect.html

  - id: connecttest-connectivity-probe
    desc: Connecttest connectivity endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)/connecttest\.(txt|com|html)'

  - id: ncsi-connectivity-probe
    desc: NCSI status connectivity endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /ncsi.txt

composite_rules:
  - id: connectivity-probe-url
    desc: Known OS connectivity probe endpoint
    crit: notable
    conf: 0.92
    any:
      - id: generate-204-connectivity-probe
      - id: hotspot-detect-connectivity-probe
      - id: connecttest-connectivity-probe
      - id: ncsi-connectivity-probe
