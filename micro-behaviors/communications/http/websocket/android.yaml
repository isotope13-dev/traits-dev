defaults:
  crit: notable
  platforms: [android]
  for: [android_apk, binaries, xml]
  attack: T1071.001

traits:
  - id: android-okhttp-websocket-client
    desc: Android OkHttp WebSocket client API reference
    conf: 0.96
    if:
      type: text
      regex: 'Lokhttp3/WebSocket;|Lokhttp3/WebSocketListener;|newWebSocket'

  - id: android-source-okhttp-websocket-client
    desc: Android source OkHttp WebSocket connection
    conf: 0.95
    for: [java, kotlin]
    if:
      type: text
      regex: '\bnewWebSocket\s*\('

  - id: android-source-websocket-send-call
    desc: Sends data through socket-like channel
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      regex: '\b\w*(Socket|socket|WebSocket|websocket|WS|ws)\s*\.\s*send\s*\('

composite_rules:
  - id: android-source-okhttp-websocket-send
    desc: Android source sends data over an OkHttp WebSocket
    crit: notable
    conf: 0.97
    for: [java, kotlin]
    all:
      - id: android-source-okhttp-websocket-client
      - id: android-source-websocket-send-call
