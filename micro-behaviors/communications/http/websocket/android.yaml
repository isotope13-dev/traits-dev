defaults:
  crit: notable
  platforms: [android]
  for: [android_apk, binaries, xml]
  attack: T1071.001

traits:
  - id: android-okhttp-websocket-client
    desc: Android OkHttp WebSocket client API reference
    conf: 0.96
    if:
      type: text
      regex: 'Lokhttp3/WebSocket;|Lokhttp3/WebSocketListener;|newWebSocket'

  - id: android-source-okhttp-websocket-client
    desc: Android source OkHttp WebSocket connection
    conf: 0.95
    for: [java, kotlin]
    if:
      type: text
      regex: '\bnewWebSocket\s*\('
