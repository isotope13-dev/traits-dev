defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: nostr-simplepool-symbol
    desc: SimplePool symbol reference
    if:
      type: symbol
      exact: SimplePool
  - id: nostr-subscribe-many-call
    desc: Calls the subscribeMany method
    if:
      type: text
      regex: '\bpool\.subscribeMany\s*\('
  - id: nostr-relay-publish-call
    desc: Calls the publish method
    if:
      type: text
      regex: '\bpool\.publish\s*\('
  - id: nostr-public-relay-url-reference
    desc: Known public Nostr relay URL reference
    crit: baseline
    if:
      type: text
      regex: 'wss://(relay\.damus\.io|nos\.lol)'
  - id: nostr-url-prefix
    desc: Nostr address URL syntax
    crit: baseline
    if:
      type: text
      regex: 'nostr:(npub1|nsec1|[0-9a-f]{64})'
composite_rules:
  - id: nostr-simplepool
    desc: Imports SimplePool from nostr-tools
    crit: notable
    conf: 0.98
    all:
      - id: metadata/import/npm/nostr-tools::nostr-tools
      - id: nostr-simplepool-symbol
  - id: nostr-subscribe-many
    desc: Subscribes to Nostr relays through nostr-tools
    crit: notable
    conf: 0.96
    mbc: C0002
    all:
      - id: nostr-simplepool
      - id: nostr-subscribe-many-call
  - id: nostr-relay-publish
    desc: Publishes to Nostr relays through nostr-tools
    crit: notable
    conf: 0.96
    mbc: C0002
    all:
      - id: nostr-simplepool
      - id: nostr-relay-publish-call
  - id: nostr-relay-client
    desc: Nostr relay client behavior
    crit: notable
    conf: 0.95
    all:
      - id: nostr-simplepool
    any:
      - id: nostr-subscribe-many
      - id: nostr-relay-publish
