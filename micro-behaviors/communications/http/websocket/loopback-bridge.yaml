# An extension driven by a desktop client over the loopback interface. Not a
# product fact: it is the WebSocket capability pair that decides it.
defaults:
  platforms: [windows, unix]
  for: [javascript, text, chrome-manifest, crx, xpi]
  size_max: 120000000
composite_rules:
  - id: loopback-bridge-driven-extension
    desc: Extension driven by a loopback desktop bridge
    crit: exception
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/communications/websocket/endpoints::loopback-websocket-endpoint
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
