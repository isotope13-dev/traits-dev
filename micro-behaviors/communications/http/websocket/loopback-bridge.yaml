# An extension driven by a desktop client over the loopback interface. Not a
# product fact: it is the websocket capability pair that decides it, and both
# legs live here.
defaults:
  platforms: [windows, unix]
  for: [javascript, text, chrome-manifest, crx, xpi]
  size_max: 120000000
composite_rules:
  - id: loopback-bridge-driven-extension
    desc: Extension driven by a loopback desktop bridge
    crit: exception
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/communications/http/websocket::loopback-websocket-endpoint
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
