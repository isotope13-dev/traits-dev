# A header name alone does not identify a malware family.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]
  size_min: 64
  crit: notable
traits:
  - id: x-gate-token-header-reference
    desc: X-Gate-Token HTTP header-name reference
    conf: 0.94
    if:
      type: text
      word: X-Gate-Token
      case_insensitive: true
