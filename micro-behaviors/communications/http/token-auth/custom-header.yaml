defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]

traits:
  - id: custom-token-header
    desc: X-prefixed token header field or assignment
    for: [scripts, source]
    if:
      type: text
      # Header values are scalars; an array or object value is a schema
      # extension key such as OpenAPI's "x-sap-odm-semantic-key": [...].
      regex: '(?i)["'']X-[\w-]{2,24}(Token|Key|Auth)["'']\s*(:\s*[^\s\[{]|=[^=\[{])'
