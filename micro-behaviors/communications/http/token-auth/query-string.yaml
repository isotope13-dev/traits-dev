# An access token interpolated into a query parameter other than the
# parameter name access_token/token itself. Legacy API clients still pass
# ?access_token=; those spans are filtered. A different parameter name whose
# value is the token is how a page beacons a stolen grant.
defaults:
  platforms: [windows, unix]
  for: [html, scripts, typescript]
  crit: suspicious
  conf: 0.94

traits:
  - id: access-token-query-interpolation
    desc: Interpolates access_token into a URL query
    if:
      type: text
      regex: '(?i)[?&][A-Za-z_]\w{0,24}=(["'']\s*\+|\$\{)[^&\n;{}]{0,80}access_token\b'
    not:
      - regex: '(?i)[?&]access[-_]?token='
      - regex: '(?i)[?&]token='
