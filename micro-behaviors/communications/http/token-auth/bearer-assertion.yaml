# OAuth form fields are neutral protocol evidence, irrespective of whether
# a phishing operator or a legitimate client supplies the credential.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html]
  crit: notable
  conf: 0.95

traits:
  - id: urlencoded-access-token-parameter
    desc: access_token parameter in URL or form
    if:
      type: literal
      regex: '(?i)(^|[?&])access_token='
      kind: string
      exclude_docstrings: true

  - id: bearer-token-type-field
    desc: Form token_type field set to Bearer
    if:
      type: text
      regex: '(?i)\btoken_type["''\]\s]{0,8}[:=,]\s*["'']?Bearer\b'

composite_rules:
  - id: bearer-access-token-form-fields
    desc: Bearer token type and access token form fields
    all:
      - id: bearer-token-type-field
    any:
      - id: micro-behaviors/data/serialize/schema-credential::access-token-field-name
      - id: urlencoded-access-token-parameter
    near_bytes: 256
