defaults:
  platforms: [unix, windows]
  for: [github-actions]
traits:
  - id: workflow-github-token-auth-header
    desc: Workflow token in Authorization header
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'Authorization:\s*(Bearer|token)\s*\$\{\{\s*(secrets|env)\.GITHUB_TOKEN\s*\}\}'
