defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-appends-refresh-token-credential-record
    desc: Appends credentials and returned refresh token
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement (assignment left: (identifier) @result
            right: (call function: (identifier)
              arguments: (argument_list . (identifier) @user
                (identifier) @password))))
          . (if_statement condition: (identifier) @guard
            consequence: (block
              . (expression_statement (call function: (identifier) @announce))?
              .
              (expression_statement (call
                function: (attribute attribute: (identifier) @append)
                arguments: (argument_list . (tuple
                  (identifier) @record_user (identifier) @record_password
                  (subscript value: (identifier) @record_result
                    subscript: (string) @token)) .))) .)))
          (#eq? @result @guard) (#eq? @result @record_result)
          (#eq? @user @record_user) (#eq? @password @record_password)
          (#eq? @append "append")
          (#eq? @announce "print")
          (#match? @token "^['\"]refresh_token['\"]$"))
