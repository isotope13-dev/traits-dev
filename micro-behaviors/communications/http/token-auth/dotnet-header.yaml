defaults:
  platforms: [unix, windows]
  for: [csharp]
traits:
  - id: dotnet-bearer-auth-header
    desc: Constructs .NET Bearer authentication header
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: AuthenticationHeaderValue
      arg:
        index: 0
        kind: string
        exact: Bearer
