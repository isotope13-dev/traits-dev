# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
traits:
- id: wildcard-scope-literal
  desc: Triple-wildcard scope-like string literal
  conf: 0.86
  if:
    type: literal
    kind: string
    exact: "*:*:*"
composite_rules:
- id: wildcard-oauth-scope
  desc: OAuth token flow uses a triple-wildcard scope
  conf: 0.88
  all:
  - id: micro-behaviors/communications/http/token-auth::wildcard-scope-literal
  - id: micro-behaviors/communications/http/token-auth::access-token
- id: browser-storage-oauth-token-access
  desc: Reads an OAuth token from browser storage
  conf: 0.95
  all:
  - id: micro-behaviors/data/db/read::window-localstorage-getitem
  - id: micro-behaviors/communications/http/token-auth::access-token
  any:
  - id: micro-behaviors/process/create/script/automation::playwright-page-evaluate
  - id: micro-behaviors/communications/http/token-auth::wildcard-oauth-scope
- id: browser-profile-jwt-token-access
  for:
  - python
  desc: Reads compact JWTs from a Chromium profile's Local Storage
  conf: 0.94
  all:
  - id: micro-behaviors/data/string/search::jwt-compact-regex
  - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
  any:
  - id: micro-behaviors/fs/read/file/full::python-pathlib-read-bytes
  - id: micro-behaviors/fs/directory/readdir/profile::directory-listing-evidence
- id: browser-token-access
  desc: Reads an OAuth or session token from browser state
  conf: 0.95
  any:
  - id: micro-behaviors/communications/http/token-auth::browser-storage-oauth-token-access
  - id: micro-behaviors/communications/http/token-auth::browser-profile-jwt-token-access
