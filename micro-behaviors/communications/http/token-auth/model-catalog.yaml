defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-model-catalog-api-key-request
    desc: Model catalog fetch includes API key
    conf: 0.98
    # Bind the endpoint and credential header to the same fetch call.
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @fetch
          arguments: (arguments
            . [(string) (template_string)] @url
            . (object
                (pair
                  key: (property_identifier) @headers
                  value: (object
                    (pair
                      key: (string (string_fragment) @header)
                      value: (identifier))))))) @request
          (#eq? @fetch "fetch")
          (#eq? @headers "headers")
          (#eq? @header "x-api-key")
          (#match? @url "/v1/models[`'\"]$"))
