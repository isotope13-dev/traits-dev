# OAuth token fields are independent of the device authorization grant.
# The Python composite establishes proximity, not that tokens enter the body.
defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.93

traits:
  - id: token-object-field
    desc: OAuth token object member
    if:
      type: text
      regex: '(?i)["''](access|refresh|id)[_-]token["'']\s*:'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: indexed-oauth-token-field
    desc: Indexed OAuth token field reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[[''](access[_-]?token|refresh[_-]?token|id[_-]?token)['']\]'

composite_rules:
  - id: python-json-post-near-oauth-token-fields
    desc: OAuth token fields near Python JSON POST
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
      - id: micro-behaviors/communications/http/token-auth::access-refresh-token-pair
    near_lines: 12
  - id: oauth-token-post-evidence
    desc: OAuth token body or nearby JSON POST evidence
    any:
      - id: micro-behaviors/communications/http/token-auth::oauth-token-body-variable-post
      - id: python-json-post-near-oauth-token-fields
