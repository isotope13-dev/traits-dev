# Bulk handling of refresh tokens.
#
# A first-party client redeems its own user's one refresh token.  Walking a
# collection of records and pulling a refresh_token out of each is the
# mechanical core of token spraying (Huntress, token-replay-spray) and of
# token-vault migration tooling alike, so this composite names only the
# iteration; the replay objective supplies the Microsoft endpoint and
# first-party client impersonation legs.
#
# The protocol field name is fixed by RFC 6749; loop keywords and field
# access spellings are matched structurally, never on variable names.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.93

traits:
  - id: member-refresh-token-access
    desc: Reads a refresh_token member value
    if:
      type: text
      regex: '(\[["'']refresh_token["'']\]|\.refresh_token\b)'

composite_rules:
  - id: refresh-token-record-iteration
    desc: Iterates records extracting refresh_token values
    crit: notable
    conf: 0.94
    all:
      - id: member-refresh-token-access
    any:
      - id: micro-behaviors/data/control-flow/iteration::record-loop-header
      - id: micro-behaviors/data/control-flow/iteration::collection-callback-header
    near_lines: 25
    near_bytes: 1200
