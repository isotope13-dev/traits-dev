defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: js-token-header-from-variable
  desc: Builds Token auth header from JS variable
  conf: 0.95
  if:
    type: text
    regex: (?i)authorization\s*:\s*`token\s+\$\{[A-Za-z_$][\w$]*\}`
- id: js-bearer-header-from-secret-variable
  desc: Uses a credential variable in Bearer header
  conf: 0.94
  if:
    type: text
    regex: Authorization\s*:\s*`Bearer\s+\$\{[^}]{0,120}\b(apiKey|keySecret|secret|token)\b
- id: js-bearer-header-from-auth-token
  desc: Uses an auth token in Bearer header
  conf: 0.94
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: authorization\s*:\s*`Bearer\s+\$\{[^}\n]{0,120}\b(accessToken|auth\.token|token)\b
    case_insensitive: true
- id: js-bearer-header-concatenated-token
  desc: Builds Bearer header by concatenating a token
  conf: 0.92
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: (?i)authorization["']?\s*:\s*["']Bearer\s+["']\s*\+\s*\w{0,40}token
- id: js-profile-rest-api-fetch-path
  desc: Profile REST path in JS fetch URL
  conf: 0.9
  if:
    type: text
    substr: /api/profile${
