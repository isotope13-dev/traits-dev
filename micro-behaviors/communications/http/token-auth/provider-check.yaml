defaults:
  platforms: [unix, windows]
  for: [scripts, source]
composite_rules:
  - id: github-api-token-live-check
    desc: GitHub user endpoint and bearer-header clues
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/services/github::github-authenticated-user-endpoint
      - id: micro-behaviors/communications/http/token-auth::bearer-header-from-variable

  - id: sendgrid-api-token-live-check
    desc: SendGrid profile endpoint and bearer-header clues
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/sendgrid::user-profile-endpoint
      - id: micro-behaviors/communications/http/token-auth::bearer-header-from-variable

  - id: openai-api-token-live-check
    desc: OpenAI models endpoint and bearer-header clues
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/services/openai::models-list-endpoint
      - id: micro-behaviors/communications/http/token-auth::bearer-header-from-variable

  - id: aws-access-key-live-check
    for: [python]
    desc: AWS explicit credentials and STS identity call
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-sdk-client-supplied-credentials
      - id: micro-behaviors/communications/http/services/aws-iam::sts-caller-identity-operation

