# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - binaries
  crit: notable
  conf: 0.96
traits:
- id: access-token-field-reference
  desc: Access-token field reference
  if:
    type: literal
    kind: string
    regex: "(?i)([A-Z][A-Z0-9]*[_-])?access[_-]?token"
- id: refresh-token-field-reference
  desc: Refresh-token field reference
  if:
    type: literal
    kind: string
    regex: "(?i)([A-Z][A-Z0-9]*[_-])?refresh[_-]?token"
composite_rules:
- id: oauth-access-refresh-token-fields
  desc: Access and refresh token fields
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/token-auth::access-token-field-reference
  - id: micro-behaviors/communications/http/token-auth::refresh-token-field-reference
  near_bytes: 600
- id: oauth-account-import-token-pair
  desc: Account import carries OAuth token pair
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/auth::account-credential-store-identifier
  - id: micro-behaviors/communications/http/token-auth::oauth-access-refresh-token-fields
  near_bytes: 800
