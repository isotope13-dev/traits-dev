# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - scripts
traits:
- id: antibot-token-header-assignment
  desc: Assigns an X-Antibot-Token header
  crit: notable
  conf: 0.97
  if:
    type: text
    # Keep the observed literal token form and accept runtime token values.
    # This is header construction, not evidence that the gate is hostile.
    regex: (?i)["']X-Antibot-Token["']\s*:\s*(["'][0-9a-f]{64}["']|[a-z_$][\w$]*)
