# Access tokens also belong to ordinary API login flows, independently of
# OAuth device authorization. Keep their wire/schema evidence neutral.
defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.93
traits:
  - id: access-token-camel-field
    desc: Camel-case access token field reference
    if:
      type: text
      regex: '(?i)(["'']accessToken["'']\s*([:=]|=>)|\[\s*["'']accessToken["'']\s*\])'
