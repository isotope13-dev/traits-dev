defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.92

traits:
  # Bare "token" is too common to be notable on its own. These component
  # atoms preserve weak evidence for the access/refresh composite without
  # labeling parser tokens, design tokens, or unrelated state as auth.
  - id: access-token-field-source
    desc: Access token field in source
    if:
      type: text
      regex: '(?i)(["'']access[_-]?token["'']\s*([:=]|=>)|\[\s*["'']access[_-]?token["'']\s*\])'
  - id: token-variable-declaration
    desc: Token-named variable (weak auth signal)
    crit: component
    conf: 0.65
    if:
      type: text
      regex: '(?i)\b(const|let|var)\s+token\b'
  - id: token-field-assignment
    desc: Token-named field assignment (weak auth signal)
    crit: component
    conf: 0.65
    if:
      type: text
      # Exclude TypeScript parameter annotations (`token: string`).
      regex: '(?i)(^|[^(])\btoken\s*[:=]'
  - id: indexed-token-property
    desc: Indexed token property (weak auth signal)
    crit: component
    conf: 0.65
    if:
      type: text
      regex: '(?i)\[[''"]token[''"]\]'
  - id: token-member-property
    desc: Token member property (weak auth signal)
    crit: component
    conf: 0.65
    if:
      type: text
      regex: '(?i)\.token\b'
  - id: refresh-token-field-source
    desc: Refresh token field in source
    if:
      type: text
      regex: '(?i)(["'']refresh[_-]?token["'']\s*([:=]|=>)|\[\s*["'']refresh[_-]?token["'']\s*\])'

  - id: authentication-token-name-literal
    desc: Authentication token name literal
    conf: 0.9
    for: [javascript, typescript, python, java, csharp, ruby, php]
    if:
      type: literal
      kind: string
      regex: '(?i)^[A-Za-z0-9_.-]{0,24}(oauth|auth|access|session)[_-]?token$'

composite_rules:
  - id: access-refresh-token-pair
    desc: Access and refresh token pair
    crit: notable
    conf: 0.94
    any:
      - id: access-token-field-source
      - id: token-variable-declaration
      - id: token-field-assignment
      - id: indexed-token-property
      - id: token-member-property
    all:
      - id: refresh-token-field-source

  - id: oauth-token-body-variable-post
    desc: Posts OAuth token body variable
    conf: 0.93
    for: [shell, python, javascript, ruby, php, perl, powershell, html]
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/request/body::oauth-token-field-in-body
    any:
      - id: micro-behaviors/communications/http/request/body::python-requests-post-body-variable
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
