defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]

composite_rules:
  - id: claude-key-access-with-lookalike-client
    desc: Claude key access with lookalike API client
    crit: notable
    conf: 0.9
    scope: archive
    # This is neutral context, not cross-module data flow or intent. An
    # origin-guarded client can legitimately read its gateway-specific key.
    # A package reads an existing provider-key property and local files while
    # providing an authenticated model-catalog client plus a vendor-lookalike
    # origin. None of those observations alone establishes credential theft.
    # Deliberately omit package names and exact attacker-controlled domains.
    all:
      - id: micro-behaviors/data/property/access::js-anthropic-key-value-read
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/communications/http/llm::javascript-model-catalog-fetch
      - id: micro-behaviors/communications/http/authorization-header::x-api-key-header-map-entry
      - id: micro-behaviors/communications/http/url/domain::javascript-anthropic-branded-off-vendor-api-host
