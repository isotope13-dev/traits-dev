# Zero means non-expiring only in specific APIs. Elsewhere it may mean expired.
# Require the complete expires_in name: refresh_token_expires_in is a different field.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: zero-token-expiry-field
    desc: Token expires_in field set to zero
    if:
      type: text
      regex: '(?i)\bexpires_in["'']?\s*[:=]\s*(0([,}&\s)]|$)|["'']0["''])'
