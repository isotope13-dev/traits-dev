# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: access-token
  desc: access_token symbol reference
  crit: notable
  conf: 0.5
  if:
    type: symbol
    exact: access_token
  for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  - java
- id: access-token-presence-check
  desc: Checks OAuth access token presence
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: access_token["'][\s\S]{0,120}(has_token|looks_like_success)
- id: refresh-token
  desc: refresh_token field reference
  crit: notable
  conf: 0.75
  count_min: 1
  for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  - java
  if:
    type: symbol
    exact: refresh_token
- id: refresh-token-snake-assign
  desc: Snake-case OAuth refresh_token field assign
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\brefresh[_-]token\\b\\s*:"
- id: refresh-token-url-literal
  desc: URL literal names a refresh-token endpoint
  crit: notable
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: "(?i)https?://.{0,200}refresh[_-]?token"
