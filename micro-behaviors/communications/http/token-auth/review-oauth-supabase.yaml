# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: oauth-provider-token-field
  desc: OAuth provider token session field
  conf: 0.94
  if:
    type: text
    regex: "\\bprovider_(refresh_)?token\\b"
  unless:
  - id: well-known/lib/cloud/supabase::auth-js-web3-module
