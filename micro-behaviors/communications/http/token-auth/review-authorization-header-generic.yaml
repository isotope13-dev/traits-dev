# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - windows
  - unix
traits:
- id: hardcoded-token-config-field
  desc: Hardcoded token-bearing configuration field
  crit: notable
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \b[A-Za-z_][A-Za-z0-9_]*Token\s*:\s*["'][A-Za-z0-9._~-]{16,}["']
  not:
  - regex: \b[A-Za-z_][A-Za-z0-9_]*Token\s*:\s*["'][A-Za-z_][A-Za-z0-9_]*Token["']
  - regex: Token\s*:\s*["'][a-z]+(\.[a-z0-9-]+)+["']
  - regex: Token\s*:\s*["'][a-z]+(?:-[a-z]+)*-token["']
- id: x-admin-token-header
  desc: x-admin-token request header
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '["'']x-admin-token["'']\s*:'
- id: python-x-session-token-header-access
  mbc: C0002
  attack: T1071.001
  desc: Reads X-Session-Token request header
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)headers\\.get$"
    arg:
      kind: string
      exact: X-Session-Token
