composite_rules:
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: arena-apexfdn-bearer-fetch
  desc: Arena domain, fetch and bearer-header co-occurrence
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/url/host/name::arena-apexfdn-host
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/credentials::js-bearer-header-from-auth-token
