defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: shell-http-rejection-eval-handler
    desc: Evaluates handler after HTTP auth rejection
    crit: suspicious
    conf: 0.98
    if:
      type: text
      # Covers ^40[13]$ and explicit 401/403 comparisons. The boundary after
      # the status rejects longer numbers such as 4010 and identifiers.
      regex: '(?s)if\s+\[\[.{0,80}40(\[13\]|[13])[$"''\s].{0,180}\beval\s+["'']?\$'
