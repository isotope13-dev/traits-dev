# Code-forge subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-python-client-token
  desc: PyGithub client initialized with token
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: Github\s*\(\s*[A-Za-z_][A-Za-z0-9_.]*token[A-Za-z0-9_.]*\s*\)
composite_rules:
- id: github-python-token-client
  desc: Python configures an authenticated PyGithub client
  crit: notable
  conf: 0.92
  for:
  - python
  all:
  - id: well-known/lib/network/code-forge/pygithub::github-python-client-import
  - id: micro-behaviors/communications/http/token-auth::github-python-client-token
