# Codec-specific ciphertext of the escaped API token below, split only at
# carrier boundaries. Key: ASCII hex MD5 of the encoder default password.
# \115\151\143\162\157\163\157\146\164\56\170\155\154\110\124\124\120
# These signatures describe encoded tokens, not observed API execution.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: md5-xor-xmlhttp-progid-part-1
    desc: "MD5-XOR fragment of Microsoft XMLHTTP ProgID"
    crit: component
    if:
      type: text
      substr: "n%02%08W9%08T%08o%03QQi%00%06S%3A%01T%01n%09%01Vj%03"
  - id: md5-xor-xmlhttp-progid-part-2
    desc: "MD5-XOR fragment of Microsoft XMLHTTP ProgID"
    crit: component
    if:
      type: text
      substr: "%07Qd%09Q%00n%02%0FV9%0CWe%02%05U%3E%04%04%05%3DW%05Uj%03%09%079%07%00"
  - id: md5-xor-xmlhttp-progid-part-3
    desc: "MD5-XOR fragment of Microsoft XMLHTTP ProgID"
    crit: component
    if:
      type: text
      substr: "%06%3A%09%0AQj%03%01%09"
composite_rules:
  - id: md5-xor-xmlhttp-progid
    desc: "Default MD5-XOR encoding of Microsoft XMLHTTP ProgID"
    crit: notable
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::md5-xor-xmlhttp-progid-part-1
      - id: micro-behaviors/communications/http/client/xmlhttp::md5-xor-xmlhttp-progid-part-2
      - id: micro-behaviors/communications/http/client/xmlhttp::md5-xor-xmlhttp-progid-part-3
      - id: micro-behaviors/crypto/key/representation::md5-browser-default-passphrase
      - id: micro-behaviors/data/decode/custom::unescape-input-md5-argument-call
      - id: micro-behaviors/data/decode/xor::js-repeating-key-charcode-xor-decoder
