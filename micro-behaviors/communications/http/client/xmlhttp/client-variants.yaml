defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.85

composite_rules:
  # One HTTP-client role for HTA fetch composites: the ProgID may appear as
  # an explicit string (Msxml2.XMLHTTP, Microsoft.XMLHTTP, ServerXMLHTTP) or
  # as a character-code array hiding the "XMLHTTP" name.
  - id: xmlhttp-client-literal-or-charcode
    desc: XMLHTTP client, explicit ProgID or character-code form
    any:
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
      - id: micro-behaviors/communications/http/client/xmlhttp::activex-http-progid
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
      - id: micro-behaviors/communications/http/client/xmlhttp::charcode-xmlhttp-name
