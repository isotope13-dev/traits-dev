defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, xml]
traits:
  - id: clsid-xmlhttp-b64-unicode
    desc: "Msxml2.XMLHTTP CLSID (b64 + Unicode encoded)"
    crit: suspicious
    conf: 1.0
    if:
      type: text
      substr: RgA1ADAANwA4AEYAMwA1AC0AQwA1ADUAMQAtADEAMQBEADMALQA4ADkAQgA5AC0AMAAwADAAMABGADgAMQBGAEUAMgAyADEA
  - id: activex-http-progid
    desc: Creates legacy ActiveX HTTP object
    crit: notable
    conf: 0.9
    if:
      type: text
      # Bundled browser clients also use JavaScript template quotes for the
      # legacy IE fallback (for example `Microsoft.XMLHTTP`).  It is still a
      # concrete HTTP ProgID, not evidence of a dropper by itself.
      regex: '(?i)(ActiveX|Create)Object\s*\(\s*["''`](MSXML2?\.XMLHTTP|Microsoft\.XMLHTTP)'
    unless:
      - id: well-known/lib/web/authoring/syntaxhighlighter::codepress-snippet-template-context
  - id: xmlhttp-join-fragments
    desc: Fragmented MSXML2 XMLHTTP ProgID
    crit: suspicious
    conf: 0.94
    for: [powershell]
    if:
      type: text
      substr: 'MSX", "ML2.", "XMLHTTP'
  - id: clsid-xmlhttp-raw
    desc: Msxml2.XMLHTTP CLSID (Raw string)
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: F5078F35-C551-11D3-89B9-0000F81FE221
    unless:
      - id: well-known/lib/platform/wine/

  # Numeric-array API encodings are used when the source has a high-bit mask.
  - id: numeric-array-high-bit-get-request
    desc: Numeric array encodes HTTP GET request
    crit: notable
    conf: 0.93
    for: [html]
    platforms: [windows]
    if:
      type: hex
      pattern: "B1 B2 B0 AC B8 B0 AC B1 B1 B1 AC B1 B1 B5 AC B1 B1 B6 AC B4 B6 AC B7 B9 AC B1 B1 B2 AC B1 B0 B1 AC B1 B1 B0 AC B4 B0 AC B3 B9 AC B7 B1 AC B6 B9 AC B8 B4 AC B3 B9"
  - id: numeric-array-high-bit-http-send
    desc: Numeric array encodes HTTP Send call
    crit: notable
    conf: 0.93
    for: [html]
    platforms: [windows]
    if:
      type: hex
      pattern: "B9 B2 AC B1 B2 B0 AC B5 B5 AC B5 B6 AC B9 B2 AC B1 B2 B0 AC B5 B3 AC B4 B8 AC B9 B2 AC B1 B2 B0 AC B5 B4 AC B7 B0 AC B9 B2 AC B1 B2 B0 AC B5 B5 AC B5 B1 AC B9 B2 AC B1 B2 B0 AC B5 B5 AC B5 B2 AC B9 B2 AC B1 B2 B0 AC B5 B0 AC B6 B9 AC B9 B2 AC B1 B2 B0 AC B5 B3 AC B5 B1 AC B9 B2 AC B1 B2 B0 AC B5 B4 AC B5 B3 AC B9 B2 AC B1 B2 B0 AC B5 B4 AC B6 B9 AC B9 B2 AC B1 B2 B0 AC B5 B4 AC B5 B2 AC B9 B2 AC B1 B2 B0 AC B5 B0 AC B5 B6 AC B9 B2 AC B1 B2 B0 AC B5 B0 AC B5 B7"

composite_rules:
  - id: msxml-http-variable-progid
    desc: Indexed MSXML HTTP ProgID selection
    crit: notable
    conf: 0.9
    all:
      - id: msxml-xmlhttp-progid-text
      - id: micro-behaviors/os/com/automation::computed-activex-progid
  # Only MSXML-family ProgIDs belong here: WinHttpRequest is a different
  # COM HTTP stack, and an obfuscated ActiveX ProgID expression is not by
  # itself an HTTP client. Consumers that accept any COM HTTP client list
  # winhttp-request-com beside this composite instead.
  - id: msxml-http-variants
    desc: MSXML HTTP request object variants
    crit: notable
    conf: 0.7
    any:
      - id: msxml-xmlhttp-progid-text
      - id: activex-http-progid
      - id: msxml-http-variable-progid
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: activex-network-access
    desc: ActiveX network access
    crit: notable
    conf: 0.8
    for: [javascript]
    platforms: [windows]
    attack: T1071
    mbc: C0005
    any:
      - id: msxml-xmlhttp-progid-text
      - id: activex-http-progid
