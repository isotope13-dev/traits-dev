defaults:
  platforms: [unix, windows, ios]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: xhr-sync-get
    desc: Opens a synchronous XMLHttpRequest GET request
    if:
      type: text
      regex: '\.open\s*\(\s*["'']GET["''][^;\n]{0,180},\s*false\s*\)'
    unless:
      - id: well-known/lib/web/authoring/syntaxhighlighter::codepress-snippet-template-context
