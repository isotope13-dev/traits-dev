defaults:
  platforms: [windows]
  for: [javascript, vbs, html]

composite_rules:
# Either Windows COM HTTP-client ProgID used by WSH downloaders. Each ProgID
# has one atomic trait; browser XMLHttpRequest and the generic ActiveXObject
# constructor stay with their neutral traits.
- id: xmlhttp-winhttp-com-progid-text
  desc: XMLHTTP/WinHTTP COM ProgID reference
  crit: notable
  conf: 0.9
  size_max: 50000
  any:
  - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
