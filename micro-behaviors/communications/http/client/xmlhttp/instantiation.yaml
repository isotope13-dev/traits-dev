defaults:
  platforms: [windows]
  crit: notable
  conf: 0.88
traits:
  - id: xmlhttp-object
    desc: XMLHTTP COM object instantiation
    for: [oledoc, ooxml, vbs, asp]
    if:
      # VB/VBS source is exposed as text when its parser cannot build literals.
      type: text
      regex: '(?i)(CreateObject|ActiveXObject)\s*\(\s*["''](M(SXML2?|icrosoft)|ServerXML)(\.XML)?HTTP'
