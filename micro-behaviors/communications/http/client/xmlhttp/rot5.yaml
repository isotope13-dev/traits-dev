# Character codes shifted by +5, with nested percent-escaped punctuation.
defaults:
  platforms: [windows]
  for: [html, javascript, data]
  conf: 0.95

traits:
  - id: rot5-xmlhttp-progid
    desc: ROT5 percent-encoded Microsoft.XMLHTTP ProgID
    crit: notable
    if:
      type: text
      regex: 'Rnhwtxtky3%(25){0,4}5DRQMYYU'

