defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts]
traits:
  # Canonical ServerXMLHTTP ProgID atom. A second copy named `http-client-any`
  # ("Any HTTP client usage") used to sit here matching the same ProgID
  # case-sensitively and without the version suffix; it claimed far more than
  # it detected, and every caller referenced it instead of this one.
  - id: http-client-msxml-serverxmlhttp-progid
    desc: MSXML ServerXMLHTTP client ProgID
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)MSXML2\.ServerXMLHTTP(\.[0-9]+\.[0-9]+)?'
  - id: http-client-msxml2-fragment
    crit: notable
    desc: Obfuscated MSXML HTTP fragments
    platforms:
      - windows
    if:
      type: text
      exact: MSXML2
  - id: http-client-mlhttp-fragment
    crit: notable
    desc: Obfuscated MSXML HTTP fragments
    platforms:
      - windows
    if:
      type: text
      exact: MLHTTP
  - id: http-client-msxm-fragment
    crit: notable
    desc: Obfuscated MSXML HTTP fragments
    platforms:
      - windows
    if:
      type: text
      exact: MSXM
  - id: http-client-xml2-fragment
    crit: notable
    desc: Obfuscated MSXML HTTP fragments
    platforms:
      - windows
    if:
      type: text
      exact: XML2
composite_rules:
  - id: http-client-any-obfuscated
    crit: notable
    conf: 0.9
    desc: COM HTTP client, explicit or obfuscated
    any:
      - id: http-client-msxml-serverxmlhttp-progid
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: http-client-msxml-fragment
  - id: http-client-msxml-fragment
    crit: notable
    conf: 0.8
    desc: Obfuscated MSXML HTTP fragments
    platforms:
      - windows
    any:
      - id: http-client-msxml2-fragment
      - id: http-client-mlhttp-fragment
      - id: http-client-msxm-fragment
      - id: http-client-xml2-fragment
