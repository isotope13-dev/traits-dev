defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
traits:
  - id: js-xmlhttp-progid
    desc: References an XMLHTTP COM client
    crit: notable
    conf: 0.9
    for:
      - javascript
    if:
      type: string_literal
      regex: '(?i)MSXML2\.XMLHTTP|Microsoft\.XMLHTTP|ServerXMLHTTP'
  - id: js-xmlhttp-open
    desc: Opens an XMLHttpRequest connection
    crit: notable
    conf: 0.8
    for:
      - javascript
    unless:
      - id: metadata/package/documentation/
      - id: metadata/file/format::sourcemap-sources-content
    # The call must carry an HTTP method as XMLHttpRequest.open(method, url)
    # does. A bare `\.open$` matched every `.open()` in JavaScript —
    # fs.promises.open, serialPort.open, db.open, window.open — and reported
    # each as an HTTP request. Concatenated/obfuscated methods are covered by
    # js-xmlhttp-open-obfuscated-method below.
    if:
      type: symbol
      kind: call
      regex: '\.open$'
      arg:
        kind: string
        regex: '(?i)^(get|post|head|put|delete|patch|options)$'

  - id: js-xmlhttp-open-obfuscated-method
    desc: XMLHTTP.open with concatenated HTTP method
    crit: suspicious
    conf: 0.9
    for:
      - javascript
    if:
      type: text
      regex: \.open\s*\(\s*["'][A-Z]{1,4}["']\s*\+\s*["'][A-Z]{1,4}["']\s*,
  - id: js-xmlhttp-send
    desc: Sends an XMLHttpRequest
    crit: notable
    conf: 0.8
    for:
      - javascript
    unless:
      - id: metadata/package/documentation/
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/file/format::sourcemap-sources-content
    if:
      type: symbol
      kind: call
      regex: '\.send$'
  - id: ps-xmlhttp-open-get
    desc: PowerShell XMLHTTP GET open
    crit: notable
    conf: 0.86
    for:
      - powershell
    if:
      type: text
      regex: '\.open\("GET",\s*\$[A-Za-z_][A-Za-z0-9_]*,\s*\$false\)'
  - id: ps-xmlhttp-send
    desc: PowerShell XMLHTTP send call
    crit: notable
    conf: 0.82
    for:
      - powershell
    if:
      type: text
      regex: '\.send\(\)'
