defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  - source
traits:
- id: userscript-gm-xmlhttp-request
  desc: Sends privileged userscript HTTP request
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    exact: GM_xmlhttpRequest
- id: native-xhr-activex-fallback
  desc: Native XHR constructor with ActiveX fallback
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: 'XMLHttpRequest\s*\?\s*new\s+XMLHttpRequest\s*\(\s*\)\s*:'
- id: native-xhr-typeof-construction
  desc: Native XMLHttpRequest feature detection
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: typeof\s+XMLHttpRequest[\s\S]{0,120}new\s+XMLHttpRequest\s*\(\s*\)
- id: js-request-object-open-call
  desc: Calls open on a JavaScript request-like object
  crit: notable
  conf: 0.88
  for:
  - javascript
  if:
    type: symbol
    kind: call
    regex: (?i)^(req|xhr|request)\.open$
- id: xhr-readystatechange-handler
  desc: Assigns an XHR readystatechange handler
  crit: notable
  conf: 0.7
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: bind
    regex: ^[A-Za-z_$][A-Za-z0-9_$.]*\.onreadystatechange$
- id: httpclient-wrapper-over-xmlhttprequest
  desc: HttpClient wrapper builds an XMLHttpRequest
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  - text
  - makefile
  if:
    type: text
    regex: HttpClient\s*=\s*function[\s\S]{0,900}new XMLHttpRequest\(
- id: js-xmlhttp-progid
  desc: References an XMLHTTP COM client
  crit: notable
  conf: 0.9
  for:
  - javascript
  - vbs
  if:
    type: string_literal
    regex: (?i)MSXML2\.XMLHTTP|Microsoft\.XMLHTTP|ServerXMLHTTP
- id: msxml-xmlhttp-progid-text
  desc: References an MSXML HTTP client ProgID
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - xml
  - text
  - html
  if:
    type: text
    regex: (?i)Msxml2\.XMLHTTP|Microsoft\.XMLHTTP
  unless:
  - id: js-xmlhttp-progid
- id: js-xmlhttp-open
  desc: Opens a JavaScript HTTP-client request
  crit: notable
  conf: 0.8
  for:
  - javascript
  unless:
  - id: metadata/package/documentation
  - id: metadata/document/html::html-root-at-start
  - id: metadata/file/format/source-map::sourcemap-sources-content
  if:
    type: symbol
    kind: call
    regex: \.open$
    arg:
      kind: string
      regex: (?i)^(get|post|head|put|delete|patch|options)$
- id: js-xhr-root-relative-get
  desc: XHR-like client opens root-relative GET
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: (?i)\b(req|xhr|request)\.open\s*\(\s*["']GET["']\s*,\s*["']/
- id: js-xmlhttp-open-obfuscated-method
  desc: XMLHTTP.open with concatenated HTTP method
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  if:
    type: text
    regex: \.open\s*\(\s*["'][A-Z]{1,4}["']\s*\+\s*["'][A-Z]{1,4}["']\s*,
- id: js-xmlhttp-json-content-type
  desc: Sets XMLHttpRequest JSON content type
  crit: notable
  conf: 0.9
  for:
  - javascript
  if:
    type: symbol
    kind: call
    regex: \.setRequestHeader$
    arg:
      kind: string
      substr: application/json
- id: js-xmlhttp-send
  desc: Sends an XMLHttpRequest
  crit: notable
  conf: 0.85
  for:
  - javascript
  unless:
  - id: metadata/package/documentation
  - id: metadata/document/html::html-root-at-start
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/file/format/source-map::sourcemap-sources-content
  if:
    type: symbol
    kind: call
    regex: (?i)(xhr|xmlhttp)[^.]*\.send$
- id: ps-xmlhttp-open-get
  desc: PowerShell XMLHTTP GET open
  crit: notable
  conf: 0.86
  for:
  - powershell
  if:
    type: text
    regex: \.open\("GET",\s*\$[A-Za-z_][A-Za-z0-9_]*,\s*\$false\)
- id: ps-xmlhttp-send
  desc: PowerShell XMLHTTP send call
  crit: notable
  conf: 0.82
  for:
  - powershell
  if:
    type: text
    substr: .send()
composite_rules:
- id: jquery-legacy-activex-xhr-path
  desc: Legacy IE ActiveX XHR path in jQuery
  crit: baseline
  conf: 0.9
  for:
  - javascript
  all:
  - id: well-known/lib/web/client-side/jquery
  - id: js-xmlhttp-progid
  any:
  - id: well-known/lib/web/client-side/jquery::header-prefix
  - id: well-known/lib/web/client-side/jquery::license-url
  - id: well-known/lib/web/client-side/jquery::fn-extend
- id: xhr-json-post
  desc: Sends JSON through XMLHttpRequest
  crit: notable
  conf: 0.92
  for:
  - javascript
  near_bytes: 1024
  all:
  - id: js-xmlhttp-open
  - id: js-xmlhttp-json-content-type
  - id: micro-behaviors/communications/http/request/json::request-send-json-body
- id: xhr-sync-response-text
  desc: Synchronous XMLHttpRequest reads response text
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: xhr-sync-get
  - id: micro-behaviors/communications/http/client/response-body::response-text
  near_bytes: 600
