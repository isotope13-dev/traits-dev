defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
traits:
  - id: js-request-object-open-call
    desc: Calls open on a JavaScript request-like object
    crit: notable
    conf: 0.88
    for:
      - javascript
    if:
      type: symbol
      kind: call
      regex: '(?i)^(req|xhr|request)\.open$'

  # Relocated from micro-behaviors/process/hook/event, where assigning the
  # completion callback on your own XHR was filed as an API hook. It intercepts
  # nothing — jQuery's ajax transport, and every hand-rolled XHR wrapper, set
  # this to learn when the response arrived.
  - id: xhr-readystatechange-handler
    desc: Assigns an XHR readystatechange handler
    crit: notable
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: symbol
      kind: bind
      regex: '^[A-Za-z_$][A-Za-z0-9_$.]*\.onreadystatechange$'

  - id: js-xmlhttp-progid
    desc: References an XMLHTTP COM client
    crit: notable
    conf: 0.9
    for:
      - javascript
    if:
      type: string_literal
      regex: '(?i)MSXML2\.XMLHTTP|Microsoft\.XMLHTTP|ServerXMLHTTP'
  - id: js-xmlhttp-open
    desc: Opens an XMLHttpRequest connection
    crit: notable
    conf: 0.8
    for:
      - javascript
    unless:
      - id: metadata/package/documentation/
      - id: metadata/file/format/structured::sourcemap-sources-content
    # The call must carry an HTTP method as XMLHttpRequest.open(method, url)
    # does. A bare `\.open$` matched every `.open()` in JavaScript —
    # fs.promises.open, serialPort.open, db.open, window.open — and reported
    # each as an HTTP request. Concatenated/obfuscated methods are covered by
    # js-xmlhttp-open-obfuscated-method below.
    if:
      type: symbol
      kind: call
      regex: '\.open$'
      arg:
        kind: string
        regex: '(?i)^(get|post|head|put|delete|patch|options)$'

  - id: js-xmlhttp-open-obfuscated-method
    desc: XMLHTTP.open with concatenated HTTP method
    crit: suspicious
    conf: 0.9
    for:
      - javascript
    if:
      type: text
      regex: \.open\s*\(\s*["'][A-Z]{1,4}["']\s*\+\s*["'][A-Z]{1,4}["']\s*,
  - id: js-xmlhttp-json-content-type
    desc: Sets XMLHttpRequest JSON content type
    crit: notable
    conf: 0.9
    for:
      - javascript
    if:
      type: symbol
      kind: call
      regex: '\.setRequestHeader$'
      arg:
        kind: string
        substr: application/json
  # The receiver has to look like an XHR object. A bare `\.send$` matched every
  # `.send()` in JavaScript -- `ws.send`/`socket.send` on a WebSocket, Express
  # `res.send`, socket.io, nodemailer `transporter.send` -- and reported each
  # as an XMLHttpRequest. Socket sends are reported by their own trait,
  # micro-behaviors/communications/socket/send::javascript-socket-send.
  # `[^.]*` (not `[a-z0-9_]*`) so `new XMLHttpRequest().send(...)`, whose call
  # target records as `XMLHttpRequest().send`, still matches.
  - id: js-xmlhttp-send
    desc: Sends an XMLHttpRequest
    crit: notable
    conf: 0.85
    for:
      - javascript
    unless:
      - id: metadata/package/documentation/
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/file/format/structured::sourcemap-sources-content
    if:
      type: symbol
      kind: call
      regex: '(?i)(xhr|xmlhttp)[^.]*\.send$'

  - id: ps-xmlhttp-open-get
    desc: PowerShell XMLHTTP GET open
    crit: notable
    conf: 0.86
    for:
      - powershell
    if:
      type: text
      regex: '\.open\("GET",\s*\$[A-Za-z_][A-Za-z0-9_]*,\s*\$false\)'
  - id: ps-xmlhttp-send
    desc: PowerShell XMLHTTP send call
    crit: notable
    conf: 0.82
    for:
      - powershell
    if:
      type: text
      regex: '\.send\(\)'

composite_rules:
  # Stock jQuery 1.x/2.x carries an IE-only ActiveXObject("Microsoft.XMLHTTP")
  # branch.  Relocated here from objectives/supply-chain/trojanized/library/:
  # nothing references it, so its only effect was to tag every unmodified
  # legacy jQuery — i.e. most WordPress plugins and CMS themes — with a
  # trojanized-library finding.  The compatibility path is a version-identity
  # fact, so it sits with the XHR client behaviors it describes; the hostile
  # trojanized-activex rule keys on WSH/FSO/Shell ProgIDs instead.
  - id: jquery-legacy-activex-xhr-path
    desc: Legacy IE ActiveX XHR path in jQuery
    crit: baseline
    conf: 0.9
    for: [javascript]
    all:
      - id: well-known/lib/web/jquery
      - id: js-xmlhttp-progid
    any:
      - id: well-known/lib/web/jquery::header-prefix
      - id: well-known/lib/web/jquery::license-url
      - id: well-known/lib/web/jquery::fn-extend
  - id: xhr-json-post
    desc: Sends JSON through XMLHttpRequest
    crit: notable
    conf: 0.92
    for: [javascript]
    near_bytes: 1024
    all:
      - id: js-xmlhttp-open
      - id: js-xmlhttp-json-content-type
      - id: micro-behaviors/communications/http/request/json::request-send-json-body

  # Synchronous XHR is also used by browser applications to load their own
  # packaged resources. The response-read fact belongs with the HTTP client;
  # remote-stage intent requires a separate execution or DOM sink.
  - id: xhr-sync-response-text
    desc: Synchronous XMLHttpRequest reads response text
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: xhr-sync-get
      - id: micro-behaviors/communications/http/client/response-body::response-text
    near_bytes: 600
