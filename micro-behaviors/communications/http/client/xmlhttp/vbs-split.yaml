defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: vbs-split-microsoft-xmlhttp
    desc: Concatenated Microsoft.XMLHTTP ProgID literal
    if:
      type: text
      regex: "(?i)[\"']M[\"' +&]*icro[\"' +&]*soft[\"' +&]*\\.XMLHTTP[\"']"
composite_rules:
  - id: rds-xmlhttp-progid-observed
    desc: Microsoft or MSXML2 XMLHTTP ProgID reference
    any:
      - id: msxml-xmlhttp-progid-text
      - id: vbs-split-microsoft-xmlhttp
