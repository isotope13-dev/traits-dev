defaults:
  platforms: [windows, unix]
  attack: T1105
traits:
  - id: php-base64-client-ip-fopen-clues
    desc: Base64, client address and fopen clues
    crit: notable
    conf: 0.9
    for: [html, php]
    if:
      type: text
      regex: '(?s)base64_decode.{0,400}REMOTE_ADDR.{0,200}fopen'

  # The same gate waits until a cookie is absent, then stores one after the
  # fetch and echoes the body (or a decoded fallback).
