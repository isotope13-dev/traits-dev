# PHP HTTP Client Traits
defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: file-get-contents-url
    desc: HTTP request via file_get_contents
    crit: notable
    conf: 0.8
    # `file_get_contents("http(s)://…")`. PHP string-arg values aren't cached
    # facts, so this matches the source text directly — specific enough
    # (the function name plus an inline URL) to stay FP-safe.
    if:
      type: text
      regex: 'file_get_contents\s*\([^)]{0,200}https?://'
  - id: file-get-contents-url-interpolation
    desc: HTTP request with interpolated URL
    crit: notable
    conf: 0.9
    # `file_get_contents("https://…$var…")` — a URL string built with a `$`
    # interpolation (the captured arg value preserves the `$`). Matched on the
    # cached call fact plus an arg-value filter, no live query.
    if:
      type: symbol
      kind: call
      exact: file_get_contents
      arg:
        kind: string
        regex: 'https?://.*\$'
  - id: php-file-get-dynamic-host-label
    desc: PHP requests variable-label hostname
    crit: notable
    conf: 0.95
    # A variable is placed in the URL authority before a fixed domain suffix,
    # rather than in the path/query. This is the source shape used for
    # per-victim callbacks and DNS-label transport; intent is established by
    # objective composites that pair it with the transmitted data and target.
    if:
      type: text
      regex: 'file_get_contents\s*\(\s*[''"]https?://[''"]\s*\.\s*\$'
  - id: php-http-url-prefix-test
    desc: PHP tests an HTTP URL prefix
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(str_starts_with|preg_match|parse_url)\s*\([^)]{0,80}https?://'
  - id: php-file-get-variable-source
    desc: PHP reads content from a variable source
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: file_get_contents
      arg:
        kind: identifier
  - id: php-file-get-url-variable
    desc: PHP reads content from a URL-named variable
    crit: notable
    conf: 0.95
    # A variable named URL/URI/endpoint is materially stronger remote-source
    # evidence than an arbitrary file_get_contents($value), while remaining
    # independent of how the URL was assembled elsewhere in the function or
    # object. This covers update/C2 clients that avoid an inline URL literal.
    if:
      type: text
      regex: '(?i)file_get_contents\s*\(\s*\$(url|uri|endpoint)\b'

composite_rules:
  - id: php-http-file-request
    desc: Reads a remote URL with file_get_contents
    crit: notable
    conf: 0.9
    any:
      - id: file-get-contents-url
      - id: file-get-contents-url-interpolation
      - id: php-file-get-dynamic-host-label
      - id: php-file-get-url-variable
  - id: php-http-variable-source-read
    desc: Reads HTTP-selected variable source
    crit: notable
    conf: 0.9
    near_lines: 24
    all:
      - id: php-http-url-prefix-test
      - id: php-file-get-variable-source
