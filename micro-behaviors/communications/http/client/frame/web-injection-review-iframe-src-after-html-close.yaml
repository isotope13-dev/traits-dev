defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
traits:
  - id: iframe-src-after-html-close
    desc: Iframe source follows closing html
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)</html>\s{0,80}<iframe\b[^>]{0,40}\bsrc\s*=\s*["'']https?://'
      exclude_html_comments: true
