# A frameset whose second row has zero height loads a page that stays invisible
# beside the visible one. Embedded in compiled code it is a response template.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: native-hidden-row-frameset-template
    desc: Embedded frameset with a zero-height row
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '<frameset[^>]{0,80}rows="?\*,0"?'
