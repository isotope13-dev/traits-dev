defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
composite_rules:
  - id: trailing-html-hidden-iframe
    desc: Hidden iframe after closing HTML clues
    crit: suspicious
    conf: 0.96
    near_bytes: 400
    unless:
      - id: metadata/path/directory::example-directory-component
    all:
      - id: micro-behaviors/communications/http/client/frame::iframe-src-after-html-close
      - id: micro-behaviors/ui/window/style::css-visibility-hidden
