defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: repeated-tiny-frame-write-and-remote-load
    desc: Repeated tiny-frame writes and remote load
    crit: suspicious
    conf: 0.95
    attack: T1189,T1105
    for: [html]
    near_bytes: 800
    all:
      - id: micro-behaviors/ui/window/insert-html::repeated-concealed-iframe-write
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
