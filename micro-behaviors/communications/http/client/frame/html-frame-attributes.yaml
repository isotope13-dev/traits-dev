defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php, binaries]
  crit: notable
  conf: 0.88
traits:
  - id: external-iframe-element-load
    desc: Loads external iframe content
    conf: 0.92
    for: [html, javascript, typescript, php, scala, elixir, asp, text]
    if:
      type: text
      regex: '(?i)<iframe[^>]{0,240}\bsrc\s*=\s*["'']?https?://'
      exclude_html_comments: true
  - id: relative-php-iframe-endpoint
    desc: Iframe loads a relative PHP endpoint
    conf: 0.9
    for: [html, javascript, typescript, php, scala, elixir, asp]
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,160}\bsrc\s*=\s*["'']?/?[\w./%-]{1,100}\.php\b'
      exclude_html_comments: true
  - id: external-frame-element-load
    desc: Loads external frame content
    conf: 0.92
    for: [html, javascript, typescript, php, scala, elixir, asp]
    if:
      type: text
      regex: '(?i)<frame[^>]{0,240}\bsrc\s*=\s*["'']?https?://'
      exclude_html_comments: true
  # Framing a page hosted on someone else's deployment slot -- a Vercel or
  # Netlify subdomain, or a published Google Sites view URL. Loading the frame
  # is neutral; kits use the hop so the framed content inherits the platform's
  # reputation, and the landing composites under
  # objectives/credential-access/phishing/landing/ pair these atoms with luring
  # evidence. Structured after external-iframe-element-load above, restricted to
  # the hosting-platform suffixes; one atom per family to stay under the
  # pattern-length budget.
  - id: vercel-netlify-iframe-attribute
    desc: Iframe sources a Vercel or Netlify page
    conf: 0.9
    for: [html, php, scala, elixir]
    if:
      type: text
      regex: '<iframe[^>]{0,150}src\s*=\s*["'']?https?://[\w-]+\.(vercel|netlify)\.app'
  - id: sites-view-iframe-attribute
    desc: Iframe sources a Google Sites view page
    conf: 0.9
    for: [html, php, scala, elixir]
    if:
      type: text
      regex: '<iframe[^>]{0,150}src\s*=\s*["'']?https?://sites\.google\.com/view/'
