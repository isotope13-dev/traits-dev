# An iframe that loads a remote origin and is delegated clipboard-read via
# the Permissions Policy `allow` attribute: the framed site may read what
# the user copied once permission is granted to the embedding page.
defaults:
  platforms: [unix, windows]
  for: [html]

traits:
  - id: iframe-clipboard-read-before-remote-src
    desc: iframe allow clipboard-read before remote src
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,300}clipboard-read[^>]{0,300}src=["'']?https?://'
      exclude_html_comments: true
  - id: iframe-remote-src-before-clipboard-read
    desc: iframe remote src before clipboard-read
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,300}src=["'']?https?://[^>]{0,300}clipboard-read'
      exclude_html_comments: true
composite_rules:
  - id: remote-iframe-delegated-clipboard-read
    desc: Remote iframe is delegated clipboard-read
    crit: notable
    conf: 0.9
    any:
      - id: iframe-clipboard-read-before-remote-src
      - id: iframe-remote-src-before-clipboard-read
