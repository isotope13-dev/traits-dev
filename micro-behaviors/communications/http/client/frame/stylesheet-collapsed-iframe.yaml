# The page sizes its frames to zero through an element-wide stylesheet rule
# instead of tag attributes, then loads an absolute remote document in one.
# The visitor never sees the frame while its document runs: the same
# concealed-load shape as the zero-height attribute rules beside this file.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1564
composite_rules:
  - id: stylesheet-collapsed-remote-iframe
    desc: Zero-size iframe stylesheet hides a remote document load
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/style::iframe-element-zero-size-rule
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
