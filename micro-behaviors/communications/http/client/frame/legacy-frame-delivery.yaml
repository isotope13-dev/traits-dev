defaults:
  platforms: [unix, windows, ios]
  for: [html, javascript, elixir, scala]
  attack: T1189
  mbc: B0031
composite_rules:
  - id: browser-gated-tiny-iframe-delivery
    for: [html]
    desc: Browser-targeted minimal-size iframe loads a remote document
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
      - id: micro-behaviors/ui/window/visibility::tiny-iframe
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
    near_bytes: 700
    # The standard Tag Manager <noscript> fallback is a zero-size iframe to
    # Google by design; it runs only when scripts do not, and sits beside the
    # page's own user-agent branching on any ordinary site.
    unless:
      - id: well-known/lib/web/authoring/google-runtime::google-tag-manager-noscript-iframe
  - id: offscreen-parked-iframe-remote-delivery
    for: [javascript]
    desc: Off-screen iframe loads a remote document
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/ui/window/dom/create::iframe-create
      - id: micro-behaviors/ui/window/visibility::offscreen-negative-offset-style
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    # The whole injected block is one script tag a few hundred bytes long; the
    # window keeps the URL tied to THIS frame rather than to any remote URL
    # elsewhere on the page.
    near_bytes: 400
    # The Ledger wallet bridge parks its own proxy iframe off-screen
    # and postMessages account and payment commands to that host.
    # The Portis wallet SDK parks a pre-cache iframe at its own widget
    # host on window load, then removes it once the visible Penpal widget
    # connects to that same host: a first-party warm-up, not a delivery.
    # A frame whose contentDocument is read is same-origin: the browser
    # does not expose a third-party document that way.
    # Headless YouTube iframe player embeds use off-screen positioning
    # to query duration or control playback without visual interference.
    unless:
      - id: well-known/app/finance/ledger-wallet::ledger-wallet-proxy-url
      - id: well-known/app/finance/portis::portis-wallet-widget-url
      - id: micro-behaviors/communications/http/services/google::youtube-embed-url-reference
      - id: same-origin-offscreen-iframe-document-read
  - id: same-origin-offscreen-iframe-document-read
    desc: Off-screen iframe is read as a same-origin document
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    near_bytes: 1024
    all:
      - id: micro-behaviors/ui/window/dom/create::iframe-create
      - id: micro-behaviors/ui/window/visibility::offscreen-negative-offset-style
      - id: micro-behaviors/ui/window/dom/access::iframe-content-document-read
  - id: service-named-concealed-iframe-delivery
    for: [html]
    desc: Service-named small frame loads remote content
    crit: suspicious
    conf: 0.96
    attack: T1189,T1036
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/client/frame::service-named-remote-frame
      - id: micro-behaviors/ui/window/visibility::few-pixel-remote-frame
