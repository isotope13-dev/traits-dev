# A script builds an iframe that is both zero-sized and parked off-screen.
# Either trick alone hides a frame; doing both, from script, is the
# exploit-kit and injector way of loading a document nobody should see.
# Unlike offscreen-parked-iframe-remote-delivery this does not require a
# remote URL: kit landings load the next stage from a relative path.
defaults:
  platforms: [windows, unix, ios]
  for: [html, javascript, typescript]
  attack: T1189
  mbc: B0031

composite_rules:
  - id: scripted-zero-size-offscreen-iframe
    desc: Script creates zero-size off-screen iframe
    crit: suspicious
    conf: 0.92
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/dom/create::iframe-create
      - id: micro-behaviors/ui/window/visibility::offscreen-negative-offset-style
      - id: micro-behaviors/ui/window/style::zero-width-element-style
      - id: micro-behaviors/ui/window/style::zero-height-element-style
    # A frame whose contentDocument is read is same-origin plumbing, and YUI
    # parks its transport frame the same way.
    unless:
      - id: micro-behaviors/communications/http/client/frame::same-origin-offscreen-iframe-document-read
      - id: micro-behaviors/communications/http/client/frame::extension-packaged-page-bridge-iframe
      - id: well-known/lib/ui/yui/

  # A browser extension parks a hidden frame that loads one of its own packaged
  # pages (chrome.runtime.getURL) as a messaging bridge. The frame cannot carry
  # a remote document, so the concealment hides plumbing, not a landing page.
  - id: extension-packaged-page-bridge-iframe
    desc: Hidden iframe loads a packaged extension page
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    near_bytes: 300
    all:
      - id: micro-behaviors/ui/window/dom/create::iframe-create
      - id: micro-behaviors/browser-extension/lifecycle::element-src-extension-packaged-page

  # One role for consumers counting distinct techniques: the two concealed
  # iframe composites can fire on the same frame.
  - id: concealed-scripted-iframe
    desc: Script creates a concealed iframe
    crit: component
    conf: 1.0
    any:
      - id: scripted-zero-size-offscreen-iframe
      - id: offscreen-parked-iframe-remote-delivery
