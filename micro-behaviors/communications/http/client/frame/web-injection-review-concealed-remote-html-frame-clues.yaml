defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: concealed-remote-html-frame-clues
    desc: Concealed remote HTML frame clues
    crit: suspicious
    conf: 0.95
    attack: T1189,T1105
    for: [html]
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/client/frame::concealed-remote-document-frame
      - id: micro-behaviors/ui/window/html::frame-src-html-document
    any:
      - id: micro-behaviors/ui/window/visibility::few-pixel-remote-frame
      - id: micro-behaviors/ui/window/html::service-named-frame
