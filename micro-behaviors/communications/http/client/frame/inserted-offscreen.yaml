# Literal markup supplied to insertAdjacentHTML loads the framed origin.
# CSS-only concealment is suspicious even when compatibility code explains it;
# this does not establish exploitation or a device takeover.
defaults:
  platforms: [windows, unix, ios]
  for: [javascript]
  conf: 0.95
traits:
  - id: insert-adjacent-remote-iframe
    desc: Inserts remote iframe markup into the DOM
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '\.insertAdjacentHTML\s*\([^,]{1,24},\s*[''"]<iframe\b[^>]{0,200}src\s*=\s*[''"]https?://'
composite_rules:
  - id: inserted-zero-size-offscreen-remote-iframe
    desc: Inserts zero-size off-screen remote iframe
    crit: suspicious
    near_bytes: 350
    all:
      - id: insert-adjacent-remote-iframe
      - id: micro-behaviors/ui/window/style::iframe-inline-offscreen-style
      - id: micro-behaviors/ui/window/style::zero-width-element-style
      - id: micro-behaviors/ui/window/style::zero-height-element-style
