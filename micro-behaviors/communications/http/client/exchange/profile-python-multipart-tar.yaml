defaults:
  platforms: [windows, linux, macos]
  for: [python]

composite_rules:
  - id: python-multipart-server-script-cooccurrence
    desc: Python multipart POST near server-script literal
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/request/multipart::python-multipart-files-map
      - id: micro-behaviors/fs/path/extension::python-server-script-literal
    near_bytes: 512

  - id: python-targz-requests-post
    desc: Python tar creation and POST clues
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/post::requests-post
    any:
      - id: micro-behaviors/data/archive/create/tar::python-tar-write-mode
      - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
      - id: micro-behaviors/data/archive/create/tar::python-gzip-tar-archive
