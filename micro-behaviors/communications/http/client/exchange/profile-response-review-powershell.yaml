---
defaults:
  platforms:
  - windows
  for:
  - powershell
traits:
- id: irm-opaque-path-reference
  desc: IRM fetch targets opaque URL path token
  crit: notable
  conf: 0.85
  for:
  - powershell
  - batch
  if:
    type: text
    regex: (?i)\birm\s+['"]?(https?://)?[a-z0-9.-]+/[a-z]{0,12}\d[a-z0-9]{3,18}([\s'";|)]|$)
