defaults:
  crit: notable
  platforms: [unix, windows]
traits:
  - id: java-httpclient-handler-send
    desc: Java sends HTTP request with handler
    for: [java]
    if:
      type: text
      regex: '\b\w+\.send(Async)?\s*\([^;\r\n]{1,160}HttpResponse\.BodyHandlers\.'
      exclude_comments: true
composite_rules:
  - id: jdk-httpclient-exchange
    desc: JDK HTTP request exchange interface
    for: [java, class]
    any:
      - id: java-httpclient-handler-send
      - id: micro-behaviors/communications/http/client/library::java-httpclient-send-source
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
