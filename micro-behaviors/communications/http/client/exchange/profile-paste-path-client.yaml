defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, php, ruby, powershell, shell]
composite_rules:
  - id: paste-path-http-client-clues
    desc: Paste raw path and HTTP client clues
    crit: suspicious
    conf: 0.92
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/exchange::http-client-markers-or-response-stream
    any:
      - id: micro-behaviors/communications/http/services/file-hosting::paste-service-raw-path
      - id: micro-behaviors/communications/http/services/file-hosting::paste-host-and-raw-path-clues
    unless:
      - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls
      - id: well-known/tool/detection/trustsight::trustsight-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::verified-python-test-file
