defaults:
  for: [ruby]
  platforms: [unix]

composite_rules:
  - id: homebrew-file-gated-curl-context
    desc: Homebrew formula file gate controls curl
    crit: notable
    conf: 0.99
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/communications/http/curl::ruby-file-gated-curl-command
      - id: micro-behaviors/process/create/system::system-process-call

  - id: homebrew-remote-curl-context
    desc: Formula curl invocation and remote URL
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/process/create/system::system-process-call
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      # Added alongside, not instead of: the URL leg keeps the "remote"
      # requirement, this one requires curl to actually be the program being
      # run. Without it the rule fired on comments and on a make target named
      # `install-curl`.
      - id: micro-behaviors/communications/http/curl::ruby-curl-program-invocation
    unless:
      # `test do` is not a lifecycle phase. Without this the three legs are
      # satisfied by any formula for a network tool, including Homebrew's own
      # curl, privoxy, microsocks, gost, glider and poppler formulas.
      - id: metadata/package/manager::homebrew-test-block-curl

