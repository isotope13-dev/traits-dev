defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: rex-http-request-call
    desc: Ruby invokes Rex HTTP request API
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^send_request_(cgi|raw)$'

  - id: rex-http-request-text
    desc: References Rex HTTP request API
    for: [makefile]
    if:
      type: text
      regex: '\bsend_request_(cgi|raw)\s*\('
