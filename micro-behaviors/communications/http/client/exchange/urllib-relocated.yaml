# Capability placement: retained urllib matchers and scope.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: urllib-word
  desc: References Python urllib HTTP client
  crit: notable
  conf: 0.75
  for:
  - python
  - makefile
  if:
    type: text
    regex: \burllib(\.\w{1,30}){0,2}\.(urlopen|urlretrieve)\b|\burllib\.(request|urlrequest)\b
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: well-known/tool/detection/scarno::scarno-defensive-scanner-context
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
- id: urllib-urlopen
  desc: References urllib.request.urlopen
  crit: notable
  conf: 0.7
  for:
  - python
  - shell
  - ruby
  if:
    type: text
    substr: urllib.request.urlopen
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
- id: urllib-urlopen-call-symbol
  desc: Calls function named urlopen
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: (^|\.)urlopen$
composite_rules:
- id: urllib-urlopen-call
  desc: Python urllib urlopen reference or call
  crit: notable
  conf: 0.82
  for:
  - python
  - pyc
  any:
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/communications/http/lib/urllib::urllib-request-alias-urlopen
  - id: micro-behaviors/communications/http/lib/urllib::urllib-import-alias-urlopen
  - id: micro-behaviors/communications/http/lib/urllib::urllib-named-import-urlopen
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-py2
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-pyc-symbol
  - id: micro-behaviors/communications/http/lib/urllib::urlopen-variable-argument
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: well-known/tool/detection/scarno::scarno-defensive-scanner-context
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
