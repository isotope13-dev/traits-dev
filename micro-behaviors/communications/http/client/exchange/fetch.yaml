# A generic direct fetch call does not establish script loading. Retain the
# original call-expression matcher and parent HTTP-client selector coverage.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.94
traits:
  - id: fetch-call
    desc: Calls fetch
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: (identifier) @function)
          (#eq? @function "fetch"))
