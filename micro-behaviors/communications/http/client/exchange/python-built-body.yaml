defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-send-built-request-data
    desc: Sends builder output as request data
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.(send|post|request)$'
      arg:
        from:
          field: data
          call: '\.build(_raw)?$'
