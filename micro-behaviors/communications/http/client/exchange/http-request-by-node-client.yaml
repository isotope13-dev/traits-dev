defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  size_max: 2000000
traits:
  - id: http-request-by-node-client
    desc: Uses the Node HTTP request client
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |-
        ((call_expression function: (member_expression
          object: (call_expression arguments: (arguments (string (string_fragment) @http)))
          property: (property_identifier) @request)
          arguments: (arguments (_)*))
          (#eq? @request "request")
          (#eq? @http "http"))
