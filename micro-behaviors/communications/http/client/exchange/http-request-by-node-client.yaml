defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  size_max: 2000000
traits:
  - id: http-request-by-node-client
    desc: Uses the Node HTTP request client
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |-
        ((call_expression function: (member_expression
          object: (call_expression arguments: (arguments (string (string_fragment) @http)))
          property: (property_identifier) @request)
          arguments: (arguments (_)*))
          (#eq? @request "request")
          (#eq? @http "http"))

  # Call facts cover bound and injected clients without the inline loader AST.
  - id: node-http-request-call
    desc: Calls a Node HTTP request method
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^https?(_\d+\.default)?\.request$'

composite_rules:
  - id: node-or-source-http-client-call
    desc: Source invokes an HTTP client API
    crit: notable
    conf: 0.92
    any:
      - id: source-http-client-call
      - id: node-http-request-call
