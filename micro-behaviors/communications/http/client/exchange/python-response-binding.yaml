# Binding an HTTP response does not establish a saved download. Preserve the
# response observation independently of consumers requiring a file write.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: urllib-urlopen-bound-as-response
    desc: Binds a urlopen response object
    if:
      type: text
      regex: 'urlopen\([^)]{0,120}\)\s+as\s+response'
