defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: requests-get-near-os-system
    desc: HTTP GET and os.system calls nearby
    crit: component
    conf: 0.9
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
