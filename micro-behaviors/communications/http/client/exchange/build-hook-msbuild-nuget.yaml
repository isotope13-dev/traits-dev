defaults:
  platforms: [windows, unix]
  for: [xml]
composite_rules:
  - id: nuget-targets-restore-data-exfil
    desc: MSBuild project, curl flags and UTF-8 clues
    crit: suspicious
    conf: 0.99
    # One MSBuild project file: the .targets that runs on restore is also the
    # thing that curls the data out. `archives` leaves the `for:` list with
    # the archive scope, or the container node rolls its members' traits back
    # up and pools them again -- TeXLive's build tarball scored hostile with
    # the three legs coming from three unrelated places.
    for: [nupkg, xml, csharp]
    scope: package
    all:
      - id: metadata/build/msbuild::msbuild-project-root
      - id: micro-behaviors/communications/http/download/curl::curl-silent-fail-flags-embedded-text
      - id: micro-behaviors/data/encode/charset::dotnet-utf8-getbytes

  # A NuGet package whose restored .targets hook runs before every Build
  # and downloads a URL carrying the consuming machine's hostname. The
  # package needs no compiled code: restoring it is enough to execute the
  # hook on every consuming build, and the hostname in the query proves
  # the request profiles the build machine. Disclosure wording in the
  # nuspec is a claim, not consent from whoever resolves the package, so
  # no description leg is required or excepted here.
