defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

composite_rules:
  - id: source-http-client-call
    desc: Source calls an HTTP client API
    any:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
      - id: micro-behaviors/communications/http/client/library::go-http-newrequest
      - id: micro-behaviors/communications/http/client/library::irm-name
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/communications/http/lib/requests::requests-put
      - id: micro-behaviors/communications/http/put::axios-put-call
      - id: micro-behaviors/communications/http/put::csharp-httpclient-putasync-call
      - id: micro-behaviors/communications/http/put::rust-reqwest-client-put

  - id: outbound-http-request-source
    desc: Source constructs or sends HTTP request
    crit: component
    any:
      - id: source-http-client-call
      - id: micro-behaviors/communications/http/request/client/call::http-get-or-post-operation
      - id: micro-behaviors/communications/http/client/library::python-session-method-call
      - id: micro-behaviors/communications/http/client/exchange::rex-http-request-call
      - id: micro-behaviors/communications/http/client/exchange::java-okhttp-call-construction
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
