defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

composite_rules:
  - id: source-http-client-call
    desc: Source calls an HTTP client API
    any:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
      - id: micro-behaviors/communications/http/client/library::go-http-newrequest
      - id: micro-behaviors/communications/http/client/library::irm-name
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/communications/http/lib/requests::requests-put
      - id: micro-behaviors/communications/http/put::axios-put-call
      - id: micro-behaviors/communications/http/put::csharp-httpclient-putasync-call
      - id: micro-behaviors/communications/http/put::rust-reqwest-client-put
