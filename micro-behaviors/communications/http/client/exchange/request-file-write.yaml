defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
composite_rules:
- id: python-http-request-file-write
  desc: Python HTTP request with file write
  conf: 0.9
  size_max: 50000
  all:
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/fs/write/file/handle/unspecified::python-binary-write-pattern
  unless:
  - id: micro-behaviors/communications/http/download/write::official-sandbox-agent-release-url
