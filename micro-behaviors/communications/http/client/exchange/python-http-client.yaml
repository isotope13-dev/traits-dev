defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-http-client-request
    desc: Sends request through Python http.client
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)request$'
      receiver:
        from:
          call: '^http\.client\.HTTPS?Connection$'
