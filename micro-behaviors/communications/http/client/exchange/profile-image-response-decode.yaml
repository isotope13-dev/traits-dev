defaults:
  platforms: [windows, unix]
  for: [python]

traits:
- id: image-url-base64-or-zip
  desc: Image response passed to Base64 or ZIP
  crit: suspicious
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (^|\.)(b64decode|urlsafe_b64decode|ZipFile)$
    arg:
      index: 0
      from:
        call: (^|\.)(urlopen|get)$
        argument: 0
        literal: (?i)^https?://[^\s?#]{1,220}\.(jpe?g|png|gif|webp)([?#]|$)
        through:
        - call: (^|\.)(read|decode)$
          receiver: true
        - call: (^|\.)BytesIO$
          arguments:
          - 0
