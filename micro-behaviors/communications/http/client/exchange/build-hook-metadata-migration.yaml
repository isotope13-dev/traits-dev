defaults:
  platforms:
  - unix
  - windows
  crit: suspicious

traits:
- id: rust-build-rs-network
  desc: Rust build marker and HTTP GET call
  crit: suspicious
  conf: 0.8
  for:
  - rust
  if:
    type: text
    regex: (build\.rs|build script)[\s\S]{0,500}(reqwest|hyper|curl)::get

composite_rules:
- id: setup-py-requests-ossystem
  desc: Setup HTTP GET and shell clues
  crit: suspicious
  conf: 0.95
  for:
  - python
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/communications/http/client/exchange::requests-get-near-os-system
