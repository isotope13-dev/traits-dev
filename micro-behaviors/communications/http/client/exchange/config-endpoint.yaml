# URL/CLI syntax is method-unspecified; it does not establish probing intent.
traits:
- conf: 0.8
  crit: notable
  desc: CLI syntax references a /config URL
  for:
  - shell
  id: cli-config-url-reference
  if:
    not:
    - regex: (?i)\s-X\s+(POST|PUT|PATCH|DELETE)\b
    - regex: (?i)\s--request[=\s]+(POST|PUT|PATCH|DELETE)\b
    - regex: (?i)\s(-d|--data[^ ]*)[=\s]
    regex: (curl|wget|fetch).{0,80}/config([?#\s"'<>]|$).{0,80}
    type: text
  platforms:
  - unix
