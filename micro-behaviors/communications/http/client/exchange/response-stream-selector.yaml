# Preserve the exact observation sets of legacy directory selectors when
# the response-stream atom moves home. Each union adds only that moved atom;
# selecting the whole response-body leaf would broaden existing consumers.
# These are alternatives, not thresholds or data-flow claims.
defaults:
  platforms: [windows, unix, linux, macos, android, ios]
  for: [scripts, source, binaries, documents, manifests, data]
  crit: notable
  conf: 0.85
composite_rules:
  - id: http-request-markers-or-response-stream
    desc: HTTP request markers or Python response streaming syntax
    any:
      - id: micro-behaviors/communications/http/request/
      - id: micro-behaviors/communications/http/client/response-body::response-stream-python
  - id: http-client-markers-or-response-stream
    desc: HTTP client markers or Python response streaming syntax
    any:
      - id: micro-behaviors/communications/http/request/client/
      - id: micro-behaviors/communications/http/client/response-body::response-stream-python
