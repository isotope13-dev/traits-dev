defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-urllib-json-host-identity-send
    desc: Load-time urllib sends JSON host identity
    if:
      # Request keyword maps are opaque to transfer models. Bind the record,
      # JSON body, Request and send structurally; require module-level code
      # or a module-level invocation of the containing sender function.
      type: tree-sitter
      language: python
      query: |
        ((module (try_statement body: (block
        (expression_statement (assignment
              left: (identifier) @record
              right: (dictionary (pair value: (call
                function: (attribute) @source)))))
            . (import_statement)*
            . (expression_statement (assignment
              left: (identifier) @request_var
              right: (call function: (attribute) @constructor
                arguments: (argument_list (keyword_argument
                  name: (identifier) @data
                  value: (call function: (attribute
                    object: (call function: (attribute) @serializer
                      arguments: (argument_list . (identifier) @serialized .))
                    attribute: (identifier) @encode)))))))
            . (expression_statement (call function: (attribute
              object: (call function: (attribute) @urlopen
                arguments: (argument_list . (identifier) @sent))
              attribute: (identifier) @read)))
        )))
        (#match? @source "^(socket\\.gethostname|getpass\\.getuser)$")
          (#eq? @constructor "urllib.request.Request")
          (#eq? @serializer "json.dumps")
          (#eq? @data "data") (#eq? @encode "encode")
          (#eq? @urlopen "urllib.request.urlopen") (#eq? @read "read")
          (#eq? @record @serialized) (#eq? @request_var @sent))

        ((module (function_definition
         name: (identifier) @defined
         body: (block (try_statement body: (block
        (expression_statement (assignment
              left: (identifier) @record
              right: (dictionary (pair value: (call
                function: (attribute) @source)))))
            . (import_statement)*
            . (expression_statement (assignment
              left: (identifier) @request_var
              right: (call function: (attribute) @constructor
                arguments: (argument_list (keyword_argument
                  name: (identifier) @data
                  value: (call function: (attribute
                    object: (call function: (attribute) @serializer
                      arguments: (argument_list . (identifier) @serialized .))
                    attribute: (identifier) @encode)))))))
            . (expression_statement (call function: (attribute
              object: (call function: (attribute) @urlopen
                arguments: (argument_list . (identifier) @sent))
              attribute: (identifier) @read)))
        ))))
         (expression_statement (call function: (identifier) @invoked)))
        (#match? @source "^(socket\\.gethostname|getpass\\.getuser)$")
          (#eq? @constructor "urllib.request.Request")
          (#eq? @serializer "json.dumps")
          (#eq? @data "data") (#eq? @encode "encode")
          (#eq? @urlopen "urllib.request.urlopen") (#eq? @read "read")
          (#eq? @record @serialized) (#eq? @request_var @sent)
         (#eq? @defined @invoked))
