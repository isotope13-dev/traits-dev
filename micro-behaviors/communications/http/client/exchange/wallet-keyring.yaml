# Wallet keyring exfiltration before local encryption.
#
# Malicious wallet extensions have patched otherwise legitimate persistence
# routines so the complete serialized keyring is uploaded before the original
# encryption-and-storage path continues.  Match the data flow rather than a
# campaign hostname, request field name, or wallet-specific function name so
# the same technique remains visible across source languages and platforms.
defaults:
  platforms: [unix, windows]
  # The structural forms below cover JavaScript/TypeScript object bodies and
  # Python requests keyword arguments without relying on wallet vendor names.
  for: [javascript, typescript, python]
composite_rules:
- id: script-http-client-send
  desc: References an HTTP client send operation
  crit: notable
  conf: 0.98
  scope: file
  near_bytes: 1800
  all:
  - id: micro-behaviors/communications/http/request/body::serialized-wallet-keyring-payload-field
  any:
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/communications/http/post::client-wrapper-post-call
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/lib/requests::requests-request
