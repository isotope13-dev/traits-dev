traits:
- platforms:
  - android
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.86
  id: js-relative-route-fetch
  desc: JavaScript fetches a relative application route
  if:
    type: symbol
    kind: call
    exact: fetch
    arg:
      kind: string
      regex: ^/[A-Za-z0-9._~!$&'()*+,;=:@/-]{1,120}$
