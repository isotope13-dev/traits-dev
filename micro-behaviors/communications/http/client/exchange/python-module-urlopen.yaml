defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-module-invoked-urlopen-function
    desc: Module invokes urllib sender function
    crit: notable
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition name: (identifier) @sender
            body: (block
              (expression_statement (assignment
                left: (identifier) @request
                right: (call function: (attribute) @constructor)))
              (expression_statement (call
                function: (attribute) @open
                arguments: (argument_list . (identifier) @sent)))))
          (expression_statement (call function: (identifier) @invoked)))
          (#eq? @constructor "urllib.request.Request")
          (#eq? @request @sent)
          (#eq? @open "urllib.request.urlopen")
          (#eq? @sender @invoked))
