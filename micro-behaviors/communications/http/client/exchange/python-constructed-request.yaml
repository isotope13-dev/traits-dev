defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-urlopen-constructed-request
    desc: urlopen consumes constructed urllib Request
    if:
      type: symbol
      kind: call
      exact: urllib.request.urlopen
      arg:
        index: 0
        from:
          call: '^urllib\.request\.Request$'
