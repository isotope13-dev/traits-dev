defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
traits:
  - id: setup-py-curl-exec-call
    desc: Setup, curl and exec text
    crit: suspicious
    conf: 0.95
    for:
      - python
    if:
      type: text
    # Anchor setup.py against longer installer names (litex_setup.py): the
    # hook claim is about setup.py itself. The linear-time engine has no
    # lookaround, so the boundary char is consumed per-match instead.
      regex: ((^|[^-\w.])setup\.py|cmdclass)[\s\S]{0,500}(curl|wget)[\s\S]{0,200}exec
  - id: setup-py-curl-eval-call
    desc: Setup, curl and eval text
    crit: suspicious
    conf: 0.95
    for:
      - python
    if:
      type: text
      regex: (setup\.py|cmdclass)[\s\S]{0,500}(curl|wget)[\s\S]{0,200}eval
  - id: setup-py-urlopen-exec-call
    desc: Setup, urlopen and exec text
    crit: suspicious
    conf: 0.95
    for:
      - python
    if:
      type: text
      regex: (setup\.py|cmdclass)[\s\S]{0,500}urlopen[\s\S]{0,200}exec
    unless:
      - id: well-known/tool/detection/pipguard::pipguard-defensive-scanner-source
  - id: setup-py-urlopen-eval-call
    desc: Setup, urlopen and eval text
    crit: suspicious
    conf: 0.95
    for:
      - python
    if:
      type: text
      regex: (setup\.py|cmdclass)[\s\S]{0,500}urlopen[\s\S]{0,200}eval
  - id: setup-py-urlopen-ossystem-call
    desc: Setup, urlopen and os.system text
    crit: suspicious
    conf: 0.95
    for:
      - python
    if:
      type: text
      regex: (setup\.py|cmdclass)[\s\S]{0,500}urlopen[\s\S]{0,200}os\.system
  - id: setup-py-requests-exec
    desc: Setup, requests.get and exec text
    crit: suspicious
    conf: 0.95
    for:
      - python
    if:
      type: text
      regex: (setup\.py|cmdclass)[\s\S]{0,500}requests\.get[\s\S]{0,200}exec
  - id: setup-py-requests-eval
    desc: Setup, requests.get and eval text
    crit: suspicious
    conf: 0.95
    for:
      - python
    if:
      type: text
      regex: (setup\.py|cmdclass)[\s\S]{0,500}requests\.get[\s\S]{0,200}eval
  - id: makefile-curl-pipe-eval
    desc: Network command piped toward eval text
    crit: suspicious
    conf: 0.9
    for:
      - shell
    if:
      type: text
      regex: (^|\n)\t(curl|wget).{0,50}\|.{0,20}eval
    unless:
      - type: text
        regex: ^#!
      - type: basename
        regex: .*\.(ya?ml|json|toml)$
        case_insensitive: true
      - id: well-known/tool/development/aube::aube-node-platform-package-loader

composite_rules:
  - id: python-packaging-curl-download-execute
    desc: Setup, remote curl and process clues
    crit: suspicious
    conf: 0.98
    for:
      - python
    scope: file
  # Illustrative install-hook examples in defensive reviews show the same
  # setup.py shape without installing anything; the agent-safety context
  # marks them inert.
    unless:
      - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
      - id: metadata/package/documentation/security-testing::defensive-review-documentation
      - id: metadata/path/directory::test-directory-component
    all:
      - id: metadata/build/pip::packaging-setuptools-imported-setup-call
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/path-execution::local-execution
      - id: micro-behaviors/process/create/subprocess/launch::python-exec-capability
  - id: setup-py-curl-exec
    desc: Setup curl and execution text
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/client/exchange::setup-py-curl-exec-call
      - id: micro-behaviors/communications/http/client/exchange::setup-py-curl-eval-call
  - id: setup-py-urlopen-exec
    desc: Setup urlopen and execution text
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::oxc-vscode-package-name
      - id: metadata/package/testing/presence/manifest::has-karma
    any:
      - id: micro-behaviors/communications/http/client/exchange::setup-py-urlopen-exec-call
      - id: micro-behaviors/communications/http/client/exchange::setup-py-urlopen-eval-call
      - id: micro-behaviors/communications/http/client/exchange::setup-py-urlopen-ossystem-call
