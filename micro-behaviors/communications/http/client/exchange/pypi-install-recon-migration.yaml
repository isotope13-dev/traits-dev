defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: pypi-probe-package
  desc: Setup file has test string and request
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: metadata/lang/source/literal/fragment/message::probe-print-test
