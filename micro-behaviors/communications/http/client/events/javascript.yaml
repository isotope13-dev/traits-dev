defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
  - id: eventsource-client
    desc: JavaScript Server-Sent Events client
    if:
      type: symbol
      kind: call
      exact: EventSource

  # A hand-rolled Server-Sent Events consumer: the code splits a kept-open
  # HTTP response body into `event:` / `data:` line blocks itself instead of
  # going through the EventSource constructor the sibling atom matches.
  # Both field prefixes are the SSE wire format, so the matcher survives
  # variable and function renames; parsing the framing stays a neutral
  # protocol capability.
  - id: sse-frame-line-parse
    desc: Parses SSE event and data line frames
    conf: 0.92
    if:
      type: text
      regex: "startsWith\\(['\\\"]event:['\\\"]\\)[\\s\\S]{0,600}startsWith\\(['\\\"]data:['\\\"]\\)"
