defaults:
  platforms: [windows, unix]
  for: [svg, html, javascript]

composite_rules:
  - id: svg-html-blob-computed-source-clues
    desc: SVG script, HTML Blob and computed-source clues
    crit: suspicious
    conf: 0.95
    for: [svg]
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/data/format/html::blob-html-document
      - id: micro-behaviors/communications/http/client/resource::svg-element-src-computed-assignment
