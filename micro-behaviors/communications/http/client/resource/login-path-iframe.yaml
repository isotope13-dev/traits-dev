# An iframe whose absolute http(s) src path is a login, auth or sign-in
# route. Forums, SSO widgets and account menus embed their own login form
# this way; the observation is only that an authentication page is framed.
# Browser-in-the-browser composites add the fake window chrome that makes a
# framed login deceptive.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.92
traits:
  - id: absolute-login-path-iframe
    desc: Iframe loads absolute login or auth path
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,160}\bsrc\s*=\s*["'']https?://[^"''\s>]{1,120}/(login|auth)\b'
  - id: absolute-signin-path-iframe
    desc: Iframe loads absolute sign-in URL path
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,160}\bsrc\s*=\s*["'']https?://[^"''\s>]{1,120}/sign[-_]?in\b'
