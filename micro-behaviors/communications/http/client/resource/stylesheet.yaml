# Stylesheet-side resource loads. `.css` files are classified as `text`, so the
# markup/script resource-load atoms in javascript.yaml never see them; these are
# the `url()` / `@import` counterparts a stylesheet uses to fetch remote bytes.
# Ordinary use is common in web fonts, CDN icon sets, and background imagery —
# the intent
# comes from what selects the rule (see the CSS keylogger composite in
# objectives/collection/keylog/css-selector/).
defaults:
  platforms: [unix, windows]
  # Inline <style> blocks are classified as HTML, while standalone
  # stylesheets are classified as text. Both use this resource syntax.
  for: [text, html]
  crit: notable
  conf: 0.9

traits:
  - id: stylesheet-remote-url-value
    desc: Stylesheet property loads a remote http URL
    if:
      type: text
      # Keep this on declaration values (`background: url(...)`, etc.).  A
      # remote `@import url(...)` is a stylesheet import, not a property load,
      # and is already covered by the sibling atom below.
      regex: '(?i)[;{]\s*-?[a-z][\w-]*\s*:[^;{}]{0,300}url\(["'']?https?://'

  - id: stylesheet-font-face-remote-url
    desc: Font face declaration references remote http URL
    if:
      type: text
      regex: '(?i)@font-face[^}]{0,300}src\s*:[^}]{0,100}url\(["'']?https?://'

  - id: stylesheet-remote-import
    desc: Stylesheet imports a remote stylesheet
    if:
      type: text
      regex: '@import\s+(url\(\s*)?["'']https?://'

  - id: stylesheet-image-set-external-fallback
    desc: CSS image-set external URL fallback
    if:
      type: text
      regex: '(?i)\bimage-set\s*\([^)]{0,240}(https?://|//)'
