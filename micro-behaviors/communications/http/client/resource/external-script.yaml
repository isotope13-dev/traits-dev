defaults:
  platforms: [windows, unix]
  for: [html, php]
  crit: notable
  conf: 0.88

traits:
  - id: external-script-element-load
    desc: Loads external script element
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<script\b[^>]{0,160}\bsrc\s*=\s*["'']?(https?:)?//[^/"''\s>]'
