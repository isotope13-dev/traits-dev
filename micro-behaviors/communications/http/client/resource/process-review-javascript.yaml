defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1105
  crit: notable
traits:
- id: js-computed-remote-src-assignment
  desc: Assigns external URL to computed src
  conf: 0.92
  if:
    type: text
    regex: \[\s*["']src["']\s*\]\s*=\s*["']https?://[^"'\s]{1,512}
composite_rules:
- id: js-computed-external-script-loader
  desc: Creates a script and assigns it an external URL through computed syntax
  conf: 0.94
  all:
  - id: micro-behaviors/data/collection/dom::js-computed-script-assignment
  - id: micro-behaviors/communications/http/client/resource::js-computed-remote-src-assignment
- id: js-external-script-loader
  desc: Creates a script element and gives it an external URL
  conf: 0.94
  any:
  - id: micro-behaviors/communications/http/client/resource::js-computed-external-script-loader
  - id: micro-behaviors/communications/http/client/resource::js-remote-script-element
- id: js-dynamic-script-loader
  desc: Creates and appends a browser script element
  conf: 0.86
  all:
  - id: micro-behaviors/data/collection/dom::script-element-create
  - id: metadata/lang/source/literal/string::js-dom-script-literal
  - id: metadata/lang/source/naming/function/runtime::append-child-literal
  - id: metadata/lang/source/literal/string::src-string-literal
- id: js-remote-script-element
  desc: Creates script element with remote src
  conf: 0.92
  all:
  - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
  - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
  near_bytes: 4096
