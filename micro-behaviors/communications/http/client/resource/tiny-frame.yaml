defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  # A one-pixel frame is normal in analytics, cookie sync, and bot detection.
  # Dimensions and an external URL establish no injection or drive-by attack.
  - id: one-pixel-external-frame
    desc: External iframe with one-pixel dimensions
    crit: notable
    conf: 0.95
    near_bytes: 300
    all:
      - id: micro-behaviors/ui/window/visibility::iframe-width-at-most-one
      - id: micro-behaviors/ui/window/visibility::iframe-height-at-most-one
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
    unless:
      - id: metadata/document/html::body-opens-with-iframe
      - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
