defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1105

traits:
  # `el.src = decoded + '?u=' + ...` — a computed (non-literal) value on a DOM
  # element's src inside an SVG's inline script. Voicemail-lure SVGs build the
  # injected element through a concealed string table, so only this assignment
  # and the decode call remain visible to static inspection; the SVG phishing
  # composites in objectives/credential-access/phishing/credential/svg.yaml
  # pair the two.
  - id: svg-element-src-computed-assignment
    desc: SVG script assigns computed element source
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]{0,24}\.src\s*=\s*[^''"`\s]'
