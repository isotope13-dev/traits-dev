# Zero dimensions and an external source establish hidden resource loading,
# not an exploit, executable download, or attacker command channel.
defaults:
  platforms: [windows, unix]
  for: [html, scala, elixir, asp]
composite_rules:
  - id: zero-size-remote-iframe-load
    desc: Zero-size iframe loads a remote document
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-unquoted-zero
      - id: external-iframe-element-load
    near_bytes: 400
