# Minimal dimensions and an external source establish concealed resource loading,
# not an exploit, executable download, or attacker command channel.
defaults:
  platforms: [windows, unix]
  for: [html, scala, elixir, asp]
composite_rules:
  - id: small-remote-iframe-load
    desc: Minimal-size iframe loads a remote document
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-unquoted-small
      - id: external-iframe-element-load
    near_bytes: 400
  # Small but nonzero frames (badges, counters, share buttons) also load
  # remotely, so concealment alone never convicts; paired with a remote
  # document on an otherwise static page it marks the injected-frame
  # pattern, hence suspicious rather than hostile.
  - id: concealed-remote-document-frame
    desc: Small iframe loads a remote document
    crit: suspicious
    conf: 0.9
    for: [html]
    all:
      - id: external-iframe-element-load
    any:
      - id: micro-behaviors/ui/window/visibility::small-iframe-width-height
      - id: micro-behaviors/ui/window/visibility::small-iframe-height-width
    near_bytes: 400
  # A frame named for a service or sign-in flow that pulls a remote
  # document: legitimate login widgets share the shape, so this stays
  # suspicious; the name is the deception marker, not a conviction.
  - id: service-named-remote-frame
    desc: Service-named iframe loads a remote document
    crit: suspicious
    conf: 0.88
    for: [html]
    all:
      - id: external-iframe-element-load
      - id: micro-behaviors/ui/window/html::service-named-frame
    near_bytes: 400
