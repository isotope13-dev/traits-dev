defaults:
  for:
  - html
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.9
traits:
- id: head-leading-remote-script
  desc: Head begins with external script source
  if:
    type: text
    regex: (?is)<head>\s*<script\b[^>]{0,300}?\bsrc=["']https?://
- for:
  - html
  - javascript
  - text
  id: rar-url-reference
  desc: References HTTP URL ending in RAR
  conf: 0.88
  if:
    type: text
    regex: (?im)https?://.{0,96}\.rar(/file)?([?#"'\s<>)]|$)
