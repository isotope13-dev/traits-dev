defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.92

traits:
  - id: relative-script-element-source
    desc: Script element uses a relative source URL
    if:
      type: text
      regex: '<script[^>]{0,160}\bsrc\s*=\s*["''](\.{1,2}/|/[^/])[./A-Za-z0-9_-]{0,158}["'']'
