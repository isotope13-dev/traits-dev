traits:
- id: css-url-before-fetch
  desc: CSS URL precedes a JavaScript fetch call
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: (?is)https?://[^"'`\s]{1,240}\.css(\?[^"'`\s]{0,120})?["'`][\s\S]{0,900}\bfetch\s*\(
  unless:
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/fixture::snapshot-file
  platforms:
  - unix
  - windows
