defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php, binaries]
  crit: notable
  conf: 0.88
traits:
  # These three carry php as well as html: server-rendered templates (Blade,
  # Twig, plain PHP) emit the same markup but are typed php, so a template
  # pulling a third-party CDN script or framing a remote origin was invisible
  # here. The remote <script>/<iframe> include is the load-bearing observation
  # for injected-tag and web-skimmer review, and it is what moves in a diff.
  - id: external-iframe-element-load
    desc: Loads external iframe content
    conf: 0.92
    for: [html, javascript, typescript, php, scala, elixir, asp, text]
    if:
      type: text
      regex: '(?i)<iframe[^>]{0,240}\bsrc\s*=\s*["'']?https?://'
      exclude_html_comments: true
  - id: relative-php-iframe-endpoint
    desc: Iframe loads a relative PHP endpoint
    conf: 0.9
    for: [html, javascript, typescript, php, scala, elixir, asp]
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,160}\bsrc\s*=\s*["'']?/?[\w./%-]{1,100}\.php\b'
      exclude_html_comments: true
  - id: external-frame-element-load
    desc: Loads external frame content
    conf: 0.92
    for: [html, javascript, typescript, php, scala, elixir, asp]
    if:
      type: text
      regex: '(?i)<frame[^>]{0,240}\bsrc\s*=\s*["'']?https?://'
      exclude_html_comments: true
  # Framing a page hosted on someone else's deployment slot -- a Vercel or
  # Netlify subdomain, or a published Google Sites view URL. Loading the frame
  # is neutral; kits use the hop so the framed content inherits the platform's
  # reputation, and the landing composites under
  # objectives/credential-access/phishing/landing/ pair these atoms with luring
  # evidence. Structured after external-iframe-element-load above, restricted to
  # the hosting-platform suffixes; one atom per family to stay under the
  # pattern-length budget.
  - id: vercel-netlify-iframe-attribute
    desc: Iframe sources a Vercel or Netlify page
    conf: 0.9
    for: [html, php, scala, elixir]
    if:
      type: text
      regex: '<iframe[^>]{0,150}src\s*=\s*["'']?https?://[\w-]+\.(vercel|netlify)\.app'
  - id: sites-view-iframe-attribute
    desc: Iframe sources a Google Sites view page
    conf: 0.9
    for: [html, php, scala, elixir]
    if:
      type: text
      regex: '<iframe[^>]{0,150}src\s*=\s*["'']?https?://sites\.google\.com/view/'
  - id: vercel-netlify-src-assignment
    desc: Element src targets Vercel or Netlify
    conf: 0.9
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: '\.\s*src\s*=\s*["'']https?://[\w-]+\.(vercel|netlify)\.app'
  - id: element-src-reversed-value-assignment
    desc: Assigns reversed string to element src
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\.src\s*=\s*(reverse|[a-zA-Z0-9_$]*rev[a-zA-Z0-9_$]*)\s*\('
  - id: sites-view-src-assignment
    desc: Element src targets a Google Sites view
    conf: 0.9
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: '\.\s*src\s*=\s*["'']https?://sites\.google\.com/view/'
  - id: external-href-url-assignment
    desc: Assigns external URL to non-location href
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\b[\w$]+\.href\s*=\s*["'']https?://'
    not:
      - regex: '(?i)(window\.)?location\.href\s*='
  # This matcher does not know which DOM element owns `src`: it can be a
  # script, iframe, image, video, or audio element. Keep the atomic under HTTP
  # resource loading; code-loading composites add a script/iframe creation leg.
  - id: js-remote-src-assignment
    desc: Assigns external HTTP URL to element src
    conf: 0.92
    for: [javascript, typescript, html, text]
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\s*\.\s*src\s*=\s*["'']https?://[^"''\s]{1,512}'
  - id: variable-element-src-assignment
    desc: Assigns variable to element src
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.src\s*=\s*[A-Za-z_$][\w$]*'
  - id: script-protocol-relative-src-assignment
    desc: Assigns protocol-relative script source
    conf: 0.94
    for: [scripts, html]
    if:
      type: text
      regex: '\.src\s*=\s*["'']//[^"''\s>]{1,200}/[^"''\s>]{1,160}\.js\b'
  - id: create-link-resource-element
    desc: Creates a link resource element
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      substr: createElement
      arg:
        kind: string
        exact: link
  - id: stylesheet-rel-assignment
    desc: Marks a link element as a stylesheet
    conf: 0.92
    for: [javascript, typescript, html, package.json, chrome-manifest]
    if:
      type: text
      regex: \.rel\s*=\s*['"]stylesheet['"]
  - id: element-src-query-parameter
    desc: Element src assigned a query URL
    crit: notable
    conf: 0.82
    for: [javascript, typescript, html, text]
    if:
      type: text
      regex: '\.src\s*=\s*[^;\n]{0,100}[?&]([A-Za-z_][\w-]{0,24}=|\$\{)'
  # `unix-timestamp-expression` moved to
  # micro-behaviors/time/query::unix-timestamp-expression — reading the clock is
  # a time query, not a resource-loading behaviour. The cache-bust composite
  # below references it cross-directory.
  - id: svg-script-namespace-element
    desc: Creates an SVG namespace script element
    crit: notable
    conf: 0.92
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: 'createElementNS\(\s*[''"]http://www\.w3\.org/2000/svg[''"]\s*,\s*[''"]script[''"]'
  # Dropcatch TDS error callbacks and visitor IP/UA pixels commonly construct
  # an Image and assign an HTTP(S) src, often with a status query.
  - id: browser-image-http-beacon
    desc: Constructs Image beacon with HTTP source
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'new\s+Image\s*\(\s*\)[\s\S]{0,160}\.src\s*=\s*[^;\n]{0,200}https?://'
  - id: dynamic-external-element-src-assignment
    desc: Assigns an external URL to element source
    conf: 0.92
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: 'setAttribute\(\s*[''"]src[''"]\s*,\s*[''"]https?://'

  - id: remote-script-element-source
    desc: Embeds a remote script element
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      # Template literals embedded in extension source are not always exposed
      # as string-literal facts; the HTML shape remains unambiguous in text.
      type: text
      regex: '(?i)<script[^>]{0,220}\bsrc\s*=\s*\\*["'']https?://'

  - id: opaque-token-script-element-source
    desc: Embeds remote script with opaque token path
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      exclude_html_comments: true
      # Require a script tag. Image and source URLs use the same opaque
      # media-id shape and are not a script gate.
      regex: '(?i)<script[^>]{0,120}\bsrc\s*=\s*[''"]https?://[^/''"\s]{1,80}/[\w-]{35,64}[''"]'
    not:
      # Content-addressed storage paths use cryptographic hash digests (e.g. 64-hex SHA-256),
      # not opaque TDS routing tokens.
      - regex: '(?i)/[0-9a-f]{35,64}[''"]'

  # This is a transport observation, including ordinary legacy web pages.
  # Plain HTTP alone establishes neither concealment nor hostile delivery.
  - id: plaintext-http-script-element-source
    desc: Loads remote script over plaintext HTTP
    crit: notable
    conf: 0.85
    for: [html]
    if:
      type: text
      regex: "<script[^>]{0,240}\\bsrc\\s*=\\s*[\"']http://[^\\s\"'<>]{1,80}"
      exclude_html_comments: true
    not:
      - regex: 'http://localhost\b'
      - regex: 'http://127\.'
      - regex: 'http://\[::1\]'
  - id: wsf-remote-script-src-hex
    desc: WSF script references encoded HTTP URL
    crit: suspicious
    conf: 0.94
    for: [vbs]
    if:
      type: text
      # XML-hex-encoded `http://` in a WSF script src attribute. The encoded
      # URL is invisible to ordinary clear-text URL extraction.
      regex: '(?i)<script\b[^>]{0,500}\bsrc\s*=\s*["'']&#x68;&#x74;&#x74;&#x70;&#x3a;&#x2f;&#x2f;'

  - id: elem-src-member-access
    desc: Accesses the src property of elem
    conf: 0.85
    for: [javascript]
    if:
      type: symbol
      kind: member
      exact: elem.src
  # A script tag whose source is a bare random lowercase token with a PHP
  # extension (/sbgzihwmtz.php): rotating server-side gates hide the next
  # stage behind an unattributable name. Versioned bundles and vendor
  # files carry structured names, so the bare-token shape stays notable;
  # it convicts beside runtime injection.
  - id: random-php-script-src
    desc: Script tag loads a random-named PHP endpoint
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,200}\bsrc\s*=\s*["'']?/?[a-z]{8,12}\.php\b'

  - id: image-extension-script-source
    desc: Script source uses an image extension
    crit: suspicious
    conf: 0.94
    for: [html, javascript, php]
    unless:
      # Cheat-sheet lines such as ha.ckers.org/xss.jpg sit in alert() probe
      # lists. Ten or more of those calls mark a corpus, not a page that
      # loads its own script from an image.
      - id: metadata/lang/source/syntax/call/relationship::markup-or-decoded-alert-calls
      - id: metadata/path::test-directory-component
      - id: metadata/package/testing/presence/
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,80}\bsrc\s*=\s*[''"][^''"\s>]{1,48}\.(jpe?g|gif|png)[''"]'
      exclude_html_comments: true
  # A DNS root dot (host ending in `.`) defeats exact-match domain
  # blocklists while resolving identically. Hand-written markup never
  # spells the root; kits add it when a loader domain gets blocked.
  - id: dotted-root-script-src
    desc: Script src host has root dot
    conf: 0.88
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,200}\bsrc\s*=\s*["'']https?://[^"''<>\s]{1,120}\./'
      exclude_html_comments: true
  # A script tag pulling a library from a jsDelivr lookalike
  # (`cdn.jsdelivr.cc` instead of `cdn.jsdelivr.net`). The mirror proxies
  # genuine files but appends executable kit payloads to some, so pages
  # referencing it load trojanized dependencies. The genuine CDN stays
  # out via the `not:` filter; composites convict the kit around it.
  - id: jsdelivr-lookalike-cdn-script
    desc: Script loads from jsDelivr lookalike host
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,200}\bsrc\s*=\s*["'']https?://cdn\.jsdelivr\.[a-z]{2,}\b'
      exclude_html_comments: true
    not:
      - regex: 'cdn\.jsdelivr\.net\b'
  # A script element smuggled inside an attribute value: the attribute
  # (alt, title) carries markup instead of text so the injected tag lands
  # wherever the template prints the field. Stored-injection kits wrap the
  # tag in closers (`</title><script ...>`) to escape the attribute first.
  - id: attribute-value-script-tag
    desc: Script element smuggled in an attribute value
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)(alt|title)\s*=\s*["''][^"'']{0,300}<script\b'
      exclude_html_comments: true
  # The script URL names a bare directory, not a file: the server decides
  # per visitor what JavaScript a directory URL returns. Hand-written tags
  # point at files; injector-built tags point at endpoints.
  - id: directory-endpoint-script-src
    desc: Script src points at a bare directory
    conf: 0.88
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)<script\s+src\s*=\s*[^"''<>\s][^"''<>\s]{0,120}/[\s>]'
      exclude_html_comments: true
  # jQuery .load(url) GETs an HTML fragment and inserts it. An absolute URL
  # alone does not establish whether it is cross-origin.
  # A bare <script> fragment is sniffed as text, so text is in scope.
  - id: jquery-load-absolute-url
    desc: jQuery load fetches an absolute HTTP URL
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, php, text]
    if:
      type: text
      regex: '\$\(\s*["''][^"''\r\n]{1,80}["'']\s*\)\s*\.\s*load\s*\(\s*["'']https?://[^"''\s]{1,200}["'']'

composite_rules:
  - id: unix-timestamp-src-cache-bust
    desc: Assigns a Unix-timestamp cache-busted element source URL
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    all:
      - id: element-src-query-parameter
      - id: micro-behaviors/time/query::unix-timestamp-expression
    near_bytes: 512
  - id: dynamic-stylesheet-element-load
    desc: Creates a stylesheet link element dynamically
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: create-link-resource-element
      - id: stylesheet-rel-assignment
    near_bytes: 260
  - id: dynamic-external-stylesheet-load
    desc: Dynamically loads external stylesheet
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: dynamic-stylesheet-element-load
      - id: external-href-url-assignment
    near_bytes: 512
