defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php, binaries]
  crit: notable
  conf: 0.88
traits:
  # These three carry php as well as html: server-rendered templates (Blade,
  # Twig, plain PHP) emit the same markup but are typed php, so a template
  # pulling a third-party CDN script or framing a remote origin was invisible
  # here. The remote <script>/<iframe> include is the load-bearing observation
  # for injected-tag and web-skimmer review, and it is what moves in a diff.
  - id: async-external-script-element
    desc: Loads asynchronous external script
    conf: 0.92
    for: [html, php]
    if:
      type: text
      regex: '<script[^>]{0,160}\basync\b[^>]{0,160}\bsrc\s*=\s*["'']https?://'
  - id: external-script-element-load
    desc: Loads external script element
    conf: 0.92
    for: [html, php]
    if:
      type: text
      regex: '<script[^>]{0,160}\bsrc\s*=\s*["'']https?://'
  - id: jquery-getscript-load
    desc: Loads script through jQuery getScript
    crit: notable
    conf: 0.9
    for: [javascript, html]
    if:
      type: text
      regex: '\$\s*\.\s*getScript\s*\('
  - id: local-script-element-load
    desc: Loads local script element
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '<script[^>]{0,160}\bsrc\s*=\s*["''](\.{1,2}/|/[^/])[./A-Za-z0-9_-]{0,158}["'']'
  - id: external-iframe-element-load
    desc: Loads external iframe content
    conf: 0.92
    for: [html, php]
    if:
      type: text
      regex: '<iframe[^>]{0,240}\bsrc\s*=\s*["'']https?://'
  - id: external-href-url-assignment
    desc: Assigns external URL to non-location href
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: \.href\s*=\s*['"]https?://
    not:
      - regex: '(?i)(window\.)?location\.href\s*='
  - id: create-link-resource-element
    desc: Creates a link resource element
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      substr: createElement
      arg:
        kind: string
        exact: link
  - id: stylesheet-rel-assignment
    desc: Marks a link element as a stylesheet
    conf: 0.92
    for: [javascript, typescript, html, package.json, chrome-manifest]
    if:
      type: text
      regex: \.rel\s*=\s*['"]stylesheet['"]
  - id: dynamic-script-element-load
    desc: Dynamically loads script element
    conf: 0.9
    unless:
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb
    if:
      type: text
      regex: 'createElement\(\s*[''"]script[''"]\s*\)[\s\S]{0,260}[A-Za-z_$][A-Za-z0-9_$]*\.src\s*='
  # Matches a `.src =` assignment on ANY element (script, iframe, img, video,
  # audio); the script context comes from the composite's other leg, not here.
  # The query separator must be followed by a parameter name or a template
  # placeholder: a bare `?`/`&` also matches the ternary and logical-and
  # operators, which made `el.src = cond ? a : b` read as a parameterized URL.
  - id: element-src-query-parameter
    desc: Element src assigned a query URL
    crit: notable
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.src\s*=\s*[^;\n]{0,100}[?&]([A-Za-z_][\w-]{0,24}=|\$\{)'
  # `unix-timestamp-expression` moved to
  # micro-behaviors/time/query::unix-timestamp-expression — reading the clock is
  # a time query, not a resource-loading behaviour. The cache-bust composite
  # below references it cross-directory.
  - id: svg-script-namespace-element
    desc: Creates an SVG namespace script element
    crit: component
    conf: 0.92
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: 'createElementNS\(\s*[''"]http://www\.w3\.org/2000/svg[''"]\s*,\s*[''"]script[''"]'
  # Dropcatch TDS error callbacks and visitor IP/UA pixels commonly construct
  # an Image and assign an HTTP(S) src, often with a status query.
  - id: browser-image-http-beacon
    desc: Constructs Image beacon with HTTP source
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'new\s+Image\s*\(\s*\)[\s\S]{0,160}\.src\s*=\s*[^;\n]{0,200}https?://'
  # Generic `setAttribute('href', <var>)` — a dynamic href assignment on any
  # element. The SVG-<script> context comes from the svg-script-namespace-element
  # leg in the composite below, not from this matcher; named/described for what
  # it actually finds so it does not read as SVG-script injection on its own.
  - id: href-attribute-variable-assignment
    desc: Assigns a variable to an href attribute
    conf: 0.92
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: 'setAttribute\(\s*[''"]href[''"]\s*,\s*[A-Za-z_$][\w$]*'
  - id: dynamic-external-iframe-url-assignment
    desc: Assigns an external URL to iframe source
    conf: 0.92
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: 'setAttribute\(\s*[''"]src[''"]\s*,\s*[''"]https?://'

  - id: inline-base64-script-resource
    desc: Loads JavaScript from a Base64 data URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'data:text/javascript;base64,[A-Za-z0-9+/]{32,}={0,2}'

  - id: inline-percent-encoded-script-resource
    desc: Loads JavaScript from a percent-encoded data URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'data:(text|application)/javascript,[^"`'']{16,}'

  - id: remote-script-element-source
    desc: JavaScript embeds a remote script element
    crit: component
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '<script[^>]{0,220}\bsrc\s*=\s*["'']https?://'

  - id: vscode-webview-api-bridge
    desc: VS Code webview API bridge marker
    crit: component
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: 'window\.acquireVsCodeApi\s*='

composite_rules:
  - id: unix-timestamp-src-cache-bust
    desc: Assigns a Unix-timestamp cache-busted element source URL
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    all:
      - id: element-src-query-parameter
      - id: micro-behaviors/time/query::unix-timestamp-expression
    near_bytes: 512
  - id: dynamic-svg-script-element-load
    desc: Dynamically loads an SVG script by variable URL
    conf: 0.92
    for: [javascript, typescript, svg, html]
    all:
      - id: svg-script-namespace-element
      - id: href-attribute-variable-assignment
    near_bytes: 260
  - id: dynamic-stylesheet-element-load
    desc: Creates a stylesheet link element dynamically
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: create-link-resource-element
      - id: stylesheet-rel-assignment
    near_bytes: 260
  - id: dynamic-external-stylesheet-load
    desc: Dynamically loads external stylesheet
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: dynamic-stylesheet-element-load
      - id: external-href-url-assignment
    near_bytes: 512

  - id: vscode-webview-remote-script-load
    desc: VS Code webview loads a remote script resource
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: vscode-webview-api-bridge
      - id: remote-script-element-source
    near_bytes: 4096
