defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php, binaries]
  crit: notable
  conf: 0.88
traits:
  # These three carry php as well as html: server-rendered templates (Blade,
  # Twig, plain PHP) emit the same markup but are typed php, so a template
  # pulling a third-party CDN script or framing a remote origin was invisible
  # here. The remote <script>/<iframe> include is the load-bearing observation
  # for injected-tag and web-skimmer review, and it is what moves in a diff.
  - id: vercel-netlify-src-assignment
    desc: Element src targets Vercel or Netlify
    conf: 0.9
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: '\.\s*src\s*=\s*["'']https?://[\w-]+\.(vercel|netlify)\.app'
  - id: element-src-reversed-value-assignment
    desc: Assigns reversed string to element src
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\.src\s*=\s*(reverse|[a-zA-Z0-9_$]*rev[a-zA-Z0-9_$]*)\s*\('
  - id: sites-view-src-assignment
    desc: Element src targets a Google Sites view
    conf: 0.9
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: '\.\s*src\s*=\s*["'']https?://sites\.google\.com/view/'
  - id: external-href-url-assignment
    desc: Assigns external URL to non-location href
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\b[\w$]+\.href\s*=\s*["'']https?://'
    not:
      - regex: '(?i)(window\.)?location\.href\s*='
  # This matcher does not know which DOM element owns `src`: it can be a
  # script, iframe, image, video, or audio element. Keep the atomic under HTTP
  # resource loading; code-loading composites add a script/iframe creation leg.
  - id: js-remote-src-assignment
    desc: Assigns external HTTP URL to element src
    conf: 0.92
    for: [javascript, typescript, html, text]
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\s*\.\s*src\s*=\s*["'']https?://[^"''\s]{1,512}'
  - id: variable-element-src-assignment
    desc: Assigns variable to element src
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.src\s*=\s*[A-Za-z_$][\w$]*'
  - id: create-link-resource-element
    desc: Creates a link resource element
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      substr: createElement
      arg:
        kind: string
        exact: link
  - id: stylesheet-rel-assignment
    desc: Marks a link element as a stylesheet
    conf: 0.92
    for: [javascript, typescript, html, package.json, chrome-manifest]
    if:
      type: text
      regex: \.rel\s*=\s*['"]stylesheet['"]
  - id: element-src-query-parameter
    desc: Element src assigned a query URL
    crit: notable
    conf: 0.82
    for: [javascript, typescript, html, text]
    if:
      type: text
      regex: '\.src\s*=\s*[^;\n]{0,100}[?&]([A-Za-z_][\w-]{0,24}=|\$\{)'
  # `unix-timestamp-expression` moved to
  # micro-behaviors/time/query::unix-timestamp-expression — reading the clock is
  # a time query, not a resource-loading behaviour. The cache-bust composite
  # below references it cross-directory.
  - id: svg-script-namespace-element
    desc: Creates an SVG namespace script element
    crit: notable
    conf: 0.92
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: 'createElementNS\(\s*[''"]http://www\.w3\.org/2000/svg[''"]\s*,\s*[''"]script[''"]'
  # Dropcatch TDS error callbacks and visitor IP/UA pixels commonly construct
  # an Image and assign an HTTP(S) src, often with a status query.
  - id: browser-image-http-beacon
    desc: Constructs Image beacon with HTTP source
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'new\s+Image\s*\(\s*\)[\s\S]{0,160}\.src\s*=\s*[^;\n]{0,200}https?://'
  - id: dynamic-external-element-src-assignment
    desc: Assigns an external URL to element source
    conf: 0.92
    for: [javascript, typescript, svg, html]
    if:
      type: text
      regex: 'setAttribute\(\s*[''"]src[''"]\s*,\s*[''"]https?://'

  - id: elem-src-member-access
    desc: Accesses the src property of elem
    conf: 0.85
    for: [javascript]
    if:
      type: symbol
      kind: member
      exact: elem.src
  # A script tag whose source is a bare random lowercase token with a PHP
  # extension (/sbgzihwmtz.php): rotating server-side gates hide the next
  # stage behind an unattributable name. Versioned bundles and vendor
  # files carry structured names, so the bare-token shape stays notable;
  # it convicts beside runtime injection.
  - id: attribute-value-script-tag
    desc: Script element smuggled in an attribute value
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)(alt|title)\s*=\s*["''][^"'']{0,300}<script\b'
      exclude_html_comments: true
  # Stored-injection kits wrap the smuggled tag in element closers
  # (`</title><script ...>...</script><title>`) so the payload first escapes
  # whatever element or attribute context the template prints it into.
  # Hand-written markup never nests an element closer plus a new element
  # inside an attribute value; escaped documentation (`&lt;script`) and
  # markup comments do not match. The remote load stays a separate leg in
  # consuming composites.
  - id: attribute-value-breakout-script-tag
    desc: Breakout script tag in attribute value
    conf: 0.92
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)(alt|title)\s*=\s*["''][^"'']{0,300}["'']\s*>\s*</[a-z]{1,20}\s*>\s*<script\b'
      exclude_html_comments: true
  # Stored-payload breakout sandwich, first half: a quoted attribute value
  # carries an element closer followed by a script element
  # (`alt="</title><script ...`). The closer directly inside the quoted
  # value proves the string was built to escape its reflection context —
  # injector framing, never hand-written attribute text. Escaped
  # documentation (`&lt;script`) and markup comments do not match. The
  # reopening tag and the remote load stay separate legs in the sandwich
  # composite and consuming composites.
  - id: attribute-value-quoted-closer-script
    desc: Quoted attribute contains closer and script text
    conf: 0.93
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)(alt|title)\s*=\s*["''][^"'']{0,200}</[a-z]+\s*>\s*<script\b'
      exclude_html_comments: true
  # Second half, a fragment: a script closer followed by an element opener
  # (`</script><title>`). Alone this also matches ordinary inline scripts
  # followed by markup, so it stays a component: only the sandwich composite
  # may use it, bound by proximity to the quoted-closer leg.
  - id: script-close-reopen-element
    desc: Script close followed by element open
    crit: component
    conf: 0.6
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)</script\s*>\s*<[a-z]+[\s>/]'
      exclude_html_comments: true
  # The script URL names a bare directory, not a file: the server decides
  # per visitor what JavaScript a directory URL returns. Hand-written tags
  # point at files; injector-built tags point at endpoints.
  - id: jquery-load-absolute-url
    desc: jQuery load fetches an absolute HTTP URL
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, php, text]
    if:
      type: text
      regex: '\$\(\s*["''][^"''\r\n]{1,80}["'']\s*\)\s*\.\s*load\s*\(\s*["'']https?://[^"''\s]{1,200}["'']'

composite_rules:
  # Stored-payload breakout sandwich: the quoted-closer script leg plus the
  # close/reopen fragment, proximity-bound to the one injected tag. The
  # complete framing — escape the reflection context, plant the script,
  # repair the surrounding markup — is injector-built with no legitimate
  # authoring use. A quoted breakout without the reopening tag does not
  # satisfy the second leg and stays below this observation.
  - id: attribute-value-breakout-sandwich-script
    desc: Breakout sandwich wraps script in attribute
    conf: 0.93
    for: [html, javascript]
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/client/resource::attribute-value-quoted-closer-script
      - id: micro-behaviors/communications/http/client/resource::script-close-reopen-element
  - id: unix-timestamp-src-cache-bust
    desc: Assigns a Unix-timestamp cache-busted element source URL
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    all:
      - id: element-src-query-parameter
      - id: micro-behaviors/time/query::unix-timestamp-expression
    near_bytes: 512
  - id: dynamic-stylesheet-element-load
    desc: Creates a stylesheet link element dynamically
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: create-link-resource-element
      - id: stylesheet-rel-assignment
    near_bytes: 260
  - id: dynamic-external-stylesheet-load
    desc: Dynamically loads external stylesheet
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: dynamic-stylesheet-element-load
      - id: external-href-url-assignment
    near_bytes: 512
  - id: script-element-near-variable-src
    desc: Script element near variable src assignment
    conf: 0.92
    for: [javascript, typescript]
    near_bytes: 450
    all:
      - id: micro-behaviors/data/collection/dom::script-element-create
      - id: variable-element-src-assignment
  - id: dynamic-script-element-src-bind
    desc: Creates script element with dynamic src
    conf: 0.92
    for: [javascript, typescript, html]
    any:
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: script-element-near-variable-src
