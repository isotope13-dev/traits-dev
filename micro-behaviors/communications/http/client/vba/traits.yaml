defaults:
  for:
    - oledoc
    - ooxml
    - vbs
  platforms:
    - windows
  crit: notable
  conf: 0.88
traits:
  # A macro-enabled Office document URL is a transport capability, not a
  # verdict by itself: legitimate VBA automation can open a remote template.
  # Keep this at notable and let objective rules require an auto-trigger and
  # macro dispatch before inferring delivery intent.
  - id: vba-remote-office-macro-url
    desc: Remote Office macro document URL
    crit: notable
    conf: 0.95
    for: [oledoc, ooxml]
    if:
      type: raw
      regex: '(?i)https?://[^\x00\r\n"''<>/]{1,160}\.(docm|dotm|xlsm|xltm|pptm|potm)'

  - id: xmlhttp-object
    desc: XMLHTTP COM object instantiation
    if:
      # VB/VBS source is exposed as text when its parser cannot build literals.
      type: text
      regex: '(?i)(CreateObject|ActiveXObject)\s*\(\s*["''](M(SXML2?|icrosoft)|ServerXML)HTTP'
  - id: urldownloadtofile-api
    desc: Downloads remote file to disk
    crit: suspicious
    conf: 0.93
    if:
      type: string_literal
      regex: (?i)URLDownloadToFile
  - id: internetopen-api
    desc: Opens WinInet HTTP session handle
    if:
      type: string_literal
      regex: (?i)InternetOpen
  - id: http-open-send
    desc: HTTP Open and Send method sequence
    conf: 0.85
    if:
      type: text
      # Covers VB/VBS statement-form methods (`obj.open "GET"` and `obj.send`).
      regex: '(?is)\b[A-Za-z_]\w*\s*\.\s*Open\s+["''](GET|POST)["''].{0,240}\b[A-Za-z_]\w*\s*\.\s*Send\b'
composite_rules:
  - id: vba-http-download-to-file
    desc: VBA HTTP download to local file
    crit: suspicious
    conf: 0.95
    all:
      - id: xmlhttp-object
    any:
      - id: metadata/lang/scripted::adodb-stream
      - id: micro-behaviors/fs/write/vba::vba-open-for-output
  - id: office-vba-http-stream-object-pair
    desc: Office VBA HTTP and ADODB stream objects
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/macro/office::createobject-http-fetcher
      - id: micro-behaviors/process/create/macro/office::createobject-adodb-stream
