defaults:
  platforms: [linux]
  for: [javascript]
  crit: notable
  conf: 0.9

traits:
  - id: soup-session-or-message-reference
    desc: References Soup session or message APIs
    if:
      type: text
      regex: '\bSoup\.Session\b|Soup\.Message\.new'

  - id: soup-http-request-construction
    desc: Configures a Soup HTTP request
    if:
      type: symbol
      kind: call
      exact: Soup.Message.new
      args:
        - {index: 0, kind: string, regex: '^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$'}
        - {index: 1, kind: string, regex: '^https?://'}
