defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-urlmon-exe-reference
    desc: VB6 URLMon name with executable suffix clue
    crit: notable
    conf: 0.94
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: url-download-to-file-str
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
      - id: metadata/file/extension/typelib::winmd-basename
      - id: metadata/lang/upstream::windows-system-implementer-dll

  - id: vb6-urlmon-write-cooccurrence
    desc: VB6 URLMon name and binary file-write capability
    crit: notable
    conf: 0.94
    all:
      - id: url-download-to-file-str
      - id: micro-behaviors/fs/write/file/handle::vb6-binary-file-write
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
