defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: resource-entropy-certificate-urlmon-clues
    desc: PE resource entropy, certificate and URLMon clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: metadata/binary/layout/checksum::cert-table-truncated
      - id: micro-behaviors/communications/http/client/urlmon::url-open-stream-import
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
