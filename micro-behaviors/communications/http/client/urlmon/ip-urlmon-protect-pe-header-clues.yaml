defaults:
  platforms:
    - windows
  for:
    - pe
    - dll

composite_rules:
  - id: ip-urlmon-protect-pe-header-clues
    crit: suspicious
    desc: IP URLMon, memory protection and PE clues
    conf: 0.98
    scope: leaf
    all:
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-port-binary
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
    unless:
      - id: metadata/installer/product/
