defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  crit: notable
composite_rules:
- id: ini-urlmon-winexec-api-set
  desc: INI read, URLMon download and WinExec API references
  conf: 0.99
  size_max: 131072
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/process/create/native-symbol::winexec
  - id: micro-behaviors/fs/config/system::read-private-profile-ansi
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: metadata/installer/product/
- id: ini-download-shell-api-set
  desc: INI read, URLMon download and ShellExecuteEx APIs
  conf: 0.97
  size_min: 131072
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/fs/config/system::read-private-profile-ansi
  - id: micro-behaviors/process/create/native-symbol::shell-execute-ex-a
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: metadata/installer/product/
