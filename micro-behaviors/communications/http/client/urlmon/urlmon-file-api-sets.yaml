# API co-imports indicate downloader capabilities but not data flow.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105
  crit: notable
  conf: 0.9

composite_rules:
  - id: urlmon-temp-path-import-set
    desc: URLMon download and temp-path APIs imported together
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: micro-behaviors/fs/temp/directory::get-temp-path-import

  - id: urlmon-delete-file-import-set
    desc: URLMon download and file-delete APIs imported together
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
