defaults:
  for: [javascript, html, text]
  platforms: [windows]
traits:
  - id: packed-urldownloadtofile-word-table
    desc: Packed words encode URLDownloadToFileA API name
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'u6c6e|u776f|u444c|u616f|u5464|u4165|u6c69|u466f|u5255'
  - id: packed-urldownloadtofile-name-words
    desc: URLDownloadToFileA dictionary word fragment
    crit: component
    if:
      type: text
      substr: 'u6e6f|u6c69|u466f|u5464|u4165'
  - id: packed-urlmon-download-name-tail
    desc: URLMon download dictionary word-table tail
    crit: component
    if:
      type: text
      substr: 'u642e|u616f|uffae|u6c6c|u444c|u5255|u776f|u6c6e'
composite_rules:
  - id: packed-urldownloadtofile-permuted-words
    desc: Packed URLDownloadToFileA dictionary variant
    crit: notable
    conf: 0.99
    all:
      - id: packed-urldownloadtofile-name-words
      - id: packed-urlmon-download-name-tail
