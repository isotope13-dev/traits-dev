defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: urlmon-memory-api-cooccurrence
    desc: URLMon download APIs co-occur with memory allocation/protection APIs
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-file-and-stream-api-references
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: unsigned-urlmon-run-key-file-api-profile
    desc: Unsigned URLMon and ShellExecute APIs with Run-key/file-operation clues
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/autostart/write::run-key-file-operation-api-profile
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: metadata/binary/symbols/name/process::shell-execute-ex-a
      - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: urlmon-shellexecute-api-profile
    desc: URLMon and ShellExecute APIs with process or memory context
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/os/handler/open::win-shellexecute
    any:
      - id: micro-behaviors/time/sleep/interval::sleep-dup
      - id: metadata/build/manifest::require-administrator
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: metadata/binary/section/permission::wx-section
    needs: 2
