defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: urlmon-memory-api-cooccurrence
  desc: URLMon download APIs co-occur with memory allocation/protection APIs
  crit: notable
  conf: 0.9
  size_max: 524288
  unless:
  - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
  - id: metadata/binary/installer/family/
  all:
  - id: micro-behaviors/communications/http/client/urlmon::urlmon-dynamic-load
  any:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::virtual-protect
- id: unsigned-urlmon-run-key-file-api-profile
  desc: Unsigned URLMon and ShellExecute APIs with Run-key/file-operation clues
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex-a
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: urlmon-shellexecute-api-profile
  desc: URLMon and ShellExecute APIs with process or memory context
  crit: notable
  conf: 0.94
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
  any:
  - id: micro-behaviors/time/sleep/interval::sleep-dup
  - id: micro-behaviors/os/privilege/manifest::require-administrator
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
  - id: metadata/binary/section/permission::wx-section
  needs: 2
  unless:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
