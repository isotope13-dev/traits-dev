# URLMon import in a low-string-count binary; no payload execution is implied.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.94

composite_rules:
  - id: sparse-urlmon-import-profile
    desc: URLMon download import with at most 40 strings
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: metadata/binary/section/prose::strings-at-most-40
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
