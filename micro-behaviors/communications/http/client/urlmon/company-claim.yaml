# CompanyName is a claim, not evidence of deception; MFC runtimes satisfy this.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: urlmon-reference-with-microsoft-company-claim
  desc: URLMon reference with Microsoft CompanyName claim
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  - id: metadata/binary/provenance/version-info::microsoft-company-name-claim
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: notable
