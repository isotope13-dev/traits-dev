# URLMon and process APIs coexist in these native binaries; no download
# target path is bound to the process or ShellExecute argument.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: urlmon-download-process-fileio-profile
    desc: URLMon, process and file I/O clues
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity

  - id: urlmon-image-url-shell-execute-profile
    desc: URLMon image URL near ShellExecute
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/media::pe-cleartext-image-url
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: urlmon-xor-url-process-profile
    desc: XOR URL with URLMon and process clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
