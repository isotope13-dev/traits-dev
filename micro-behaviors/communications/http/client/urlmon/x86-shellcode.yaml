defaults:
  platforms: [windows]
  for: [html, javascript, text, data]
  crit: notable
  conf: 0.98

traits:
  - id: x86-urlmon-hash-fetch-executable
    desc: Hash-resolved URLMon fetches executable
    if:
      type: yara
      source: |
        rule x86_urlmon_hash_fetch_executable {
          strings:
            $peb_export_walk = { 64 8B 71 30 8B 76 0C 8B 76 1C 8B 5E 08 8B 56 20 8B 36 }
            $urlmon_download_hash = { BA 36 1A 2F 70 }
            $urlmon = "urlmon.dll" nocase
            $url = /https?:\/\/[a-z0-9.-]+/ nocase
            $exe = /[a-z0-9_.-]{1,32}\.exe/ nocase
          condition:
            all of them
        }
