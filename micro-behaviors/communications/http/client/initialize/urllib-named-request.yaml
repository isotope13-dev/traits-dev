traits:
- platforms:
  - windows
  - unix
  for:
  - python
  id: urllib-imported-request-object-call
  desc: Calls an imported urllib Request object
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (?m)^\s*from\s+urllib\.request\s+import[^\n]{0,120}\bRequest\b[\s\S]{0,800}\bRequest\s*\(
