defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # Resolve literal origins through local assignments; a documentation URL
  # elsewhere in the file is not a configured request destination.
  - id: python-urllib-oob-request-target
    desc: urllib Request targets an OOB callback host
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?Request$'
      arg:
        index: 0
        from:
          value: '^https?://([a-z0-9-]+\.)?(webhook\.site|oastify\.com|interact\.sh)/'
