# Capability placement: retained urllib matchers and scope.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: urllib-request-symbol
  desc: urllib.request.Request symbol
  crit: notable
  conf: 0.82
  if:
    type: symbol
    exact: urllib.request.Request
- id: urllib-request-data-body
  desc: urllib Request initialized with body
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    kind: call
    regex: (?is)\burllib\.request\.Request\s*\([^)]{0,240}\bdata\s*=
