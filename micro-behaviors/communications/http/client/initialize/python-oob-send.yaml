defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.98
traits:
- id: python-urlopen-oob-target
  desc: urlopen sends to an OOB callback URL
  if:
    type: symbol
    kind: call
    regex: ^(urllib\.request\.)?urlopen$
    arg:
      index: 0
      from:
        value: ^https?://([a-z0-9-]+\.)?(webhook\.site|oastify\.com|interact\.sh)/
        through:
        - call: ^(urllib\.request\.)?Request$
          arguments:
          - 0
