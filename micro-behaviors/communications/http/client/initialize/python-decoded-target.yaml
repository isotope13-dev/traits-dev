defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-urllib-base64-decoded-target
    desc: urllib Request URL derives from Base64 decoding
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 0
        from:
          call: '^base64\.b64decode$'
          through:
            - call: '\.decode$'
              receiver: true
