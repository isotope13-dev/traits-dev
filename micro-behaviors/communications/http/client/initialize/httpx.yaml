defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: httpx-client
    desc: Constructs an httpx HTTP client
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: httpx.Client
  - id: httpx-async-client
    desc: Creates an asynchronous HTTP client with httpx
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: httpx.AsyncClient
