defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  # Resolve literal origins through local assignments; a policy or documentation
  # mention elsewhere in the file is not a configured request destination.
  - id: node-http-get-oastify-target
    desc: Node HTTP GET targets an OASTify host
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(https?\.)?get$'
      arg:
        index: 0
        from:
          value: '(?i)(^https?://|\.)oastify\.com([/:?#]|$)'
