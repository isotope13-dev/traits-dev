  - id: browser-beacon-navigator-binding
    desc: sendBeacon with navigator binding
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '\.sendBeacon\b.{0,100}\.bind\(navigator\)'
