defaults:
  platforms:
  - macos
  - ios
  for:
  - macho
  crit: notable
  conf: 0.95
traits:
- id: cfhttp-create-request
  desc: CoreFoundation HTTP request-construction API
  if:
    type: symbol
    exact: CFHTTPMessageCreateRequest
- id: cfhttp-response-stream
  desc: CoreFoundation HTTP request-stream constructor
  if:
    type: symbol
    exact: CFReadStreamCreateForHTTPRequest
