defaults:
  platforms: [windows, unix, android]
  for: [class, jar, zip]

traits:
  - id: jvm-urlconnection-open-java-source
    desc: Java opens an HTTP connection object
    crit: notable
    conf: 0.88
    for: [java, jsp]
    if:
      type: text
      regex: 'Https?URLConnection[^;]{0,160}openConnection\s*\('
  - id: jvm-urlconnection-open-kotlin-source
    desc: Kotlin opens URLConnection
    crit: notable
    conf: 0.88
    for: [kotlin]
    if:
      type: text
      regex: 'openConnection\s*\(\)\s+as\s+(java\.net\.)?Https?URLConnection'
composite_rules:
  - id: jvm-urlconnection-open-source
    desc: Java/Kotlin opens an HTTP connection object
    crit: notable
    conf: 0.89
    for: [java, kotlin, jsp]
    any:
      - id: jvm-urlconnection-open-java-source
      - id: jvm-urlconnection-open-kotlin-source
