defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.92
composite_rules:
- id: setup-py-dns-http-cooccurrence
  desc: setup.py has DNS and HTTP calls
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-capability
  - id: micro-behaviors/communications/http/request/client::request-python
