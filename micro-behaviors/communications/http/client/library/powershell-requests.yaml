defaults:
  platforms:
  - windows
  for:
  - powershell
  crit: notable
  mbc: C0002
traits:
- id: iwr-name
  desc: Invokes PowerShell HTTP request cmdlet
  if:
    type: symbol
    kind: call
    exact: Invoke-WebRequest
  unless:
  - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
- id: iwr-uri
  desc: References Invoke-WebRequest URI parameter
  conf: 0.82
  for:
  - powershell
  - pe
  - batch
  - text
  if:
    type: text
    substr: Invoke-WebRequest -Uri
- id: irm-name
  desc: Invokes PowerShell REST request cmdlet
  if:
    type: symbol
    kind: call
    exact: Invoke-RestMethod
- id: irm-alias
  desc: irm alias for Invoke-RestMethod
  size_min: 1
  if:
    type: symbol
    kind: call
    exact: irm
composite_rules:
- id: powershell-rest-request
  desc: PowerShell performs an Invoke-RestMethod request (irm alias)
  conf: 0.8
  any:
  - id: micro-behaviors/communications/http/client/library::irm-name
  - id: micro-behaviors/communications/http/client/library::irm-alias
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-bare-domain
- id: powershell-http-observations
  desc: PowerShell HTTP client observations
  conf: 0.9
  for:
  - powershell
  - pe
  - batch
  - text
  any:
  - id: micro-behaviors/communications/http/lib/invoke-webrequest
  - id: micro-behaviors/communications/http/client/managed::webclient-download-method-text
  - id: micro-behaviors/communications/http/client/library::iwr-name-reference
  - id: micro-behaviors/communications/http/client/library::useb-flag
  - id: metadata/lang/source/syntax/command::powershell-iwr-post-command-text
  - id: metadata/lang/source/syntax/argument::powershell-post-method-option
  - id: micro-behaviors/communications/http/request/payload::powershell-http-body-value
  - id: micro-behaviors/communications/http/request/payload::powershell-http-post-body
  - id: micro-behaviors/communications/http/request/payload::powershell-body-or-upload
  - id: iwr-name
  - id: iwr-uri
  - id: powershell-rest-request
