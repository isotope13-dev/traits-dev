defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  mbc: C0002
traits:
  - id: iwr-name
    desc: Invokes PowerShell HTTP request cmdlet
    crit: notable
    if:
      type: symbol
      kind: call
      exact: Invoke-WebRequest
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  # `batch` and `text` alongside `pe`: a batch script that runs
  # `powershell -command "Invoke-WebRequest ..."` is PowerShell content in a
  # `.bat`, and the cmdlet name means the same thing wherever it is written.
  # Scoped to powershell alone, none of these atoms could see the batch
  # droppers that invoke it -- which is most of them.
  - id: iwr-uri
    desc: References Invoke-WebRequest URI parameter
    crit: notable
    conf: 0.82
    for: [powershell, pe, batch, text]
    if:
      type: text
      substr: "Invoke-WebRequest -Uri"
  - id: irm-name
    desc: Invokes PowerShell REST request cmdlet
    crit: notable
    if:
      type: symbol
      kind: call
      exact: Invoke-RestMethod
  - id: irm-alias
    desc: irm alias for Invoke-RestMethod
    crit: notable
    size_min: 1
    if:
      type: symbol
      kind: call
      exact: irm

composite_rules:
  - id: powershell-rest-request
    desc: PowerShell performs an Invoke-RestMethod request (irm alias)
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/communications/http/client/library::irm-name
      - id: micro-behaviors/communications/http/client/library::irm-alias
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-bare-domain

  - id: powershell-http-observations
    desc: PowerShell HTTP client observations
    crit: notable
    conf: 0.9
    for: [powershell, pe, batch, text]
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest
      - id: iwr-name
      - id: iwr-uri
      - id: powershell-rest-request
