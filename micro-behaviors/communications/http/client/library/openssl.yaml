defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: openssl-http-routines-diagnostic
    desc: OpenSSL HTTP routines diagnostic string
    crit: component
    conf: 0.9
    if:
      type: text
      exact: 'HTTP routines'
      section: rdata

  - id: openssl-https-proxy-diagnostic
    desc: OpenSSL HTTPS proxy-request diagnostic string
    crit: component
    conf: 0.95
    if:
      type: text
      exact: 'https proxy request'
      section: rdata

  - id: openssl-redirect-https-http-diagnostic
    desc: OpenSSL HTTPS-to-HTTP redirect diagnostic string
    crit: component
    conf: 0.95
    if:
      type: text
      exact: 'redirection from https to http'
      section: rdata

  - id: openssl-wrong-http-version-diagnostic
    desc: OpenSSL wrong-HTTP-version diagnostic string
    crit: component
    conf: 0.95
    if:
      type: text
      exact: 'received wrong http version'
      section: rdata

composite_rules:
  # Multiple exact diagnostics establish that the PE embeds OpenSSL's
  # OSSL_HTTP client implementation. This is a network capability, not C2.
  - id: openssl-http-client-diagnostics
    desc: Embedded OpenSSL OSSL_HTTP client implementation
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: openssl-http-routines-diagnostic
      - id: openssl-https-proxy-diagnostic
      - id: openssl-redirect-https-http-diagnostic
      - id: openssl-wrong-http-version-diagnostic
