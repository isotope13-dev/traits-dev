defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: C0002
  attack: T1071.001

traits:
  # Laravel's fluent HTTP facade does not use PHP's stream-context option
  # array.  Keep this as a neutral client-library atom; exfiltration rules
  # must add payload and host-profile evidence.
  - id: php-laravel-http-facade-post
    desc: Laravel HTTP facade sends a POST
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'use\s+Illuminate\\Support\\Facades\\Http[\s\S]{0,900}->post\s*\('
