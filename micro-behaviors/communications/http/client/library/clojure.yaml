# Clojure can reach the JVM networking APIs through direct interop. Keep this
# separate from the Java rule so the language and matcher remain truthful.
defaults:
  platforms: [unix, windows]
  for: [clojure]

traits:
  - id: clojure-http-urlconnection
    desc: Clojure references Java URLConnection
    crit: notable
    conf: 0.88
    if:
      type: text
      word: URLConnection
