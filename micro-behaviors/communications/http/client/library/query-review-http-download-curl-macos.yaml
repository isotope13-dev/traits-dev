defaults:
  crit: notable
  platforms:
  - macos
  for:
  - macho

traits:
  - id: macos-curl-easy-init
    desc: Mach-O imports curl_easy_init
    conf: 0.9
    if:
      type: import
      regex: curl_easy_init

  - id: macos-curl-easy-perform
    desc: Mach-O imports curl_easy_perform
    conf: 0.9
    if:
      type: import
      regex: curl_easy_perform

  - id: xor-decoded-curl-easy-perform
    desc: XOR-decoded curl_easy_perform API name
    conf: 0.98
    if:
      type: encoded
      encoding: xor
      exact: curl_easy_perform


composite_rules:
  - id: macos-libcurl-http
    desc: Mach-O initializes and performs libcurl requests
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/client/library::macos-curl-easy-init
      - id: micro-behaviors/communications/http/client/library::macos-curl-easy-perform

