defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp]
traits:
  - id: powershell-http-command-text
    desc: References PowerShell HTTP request cmdlet syntax
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(\bInvoke-WebRequest\b|\biwr[ \t]+(https?://|-(Uri|UseBasicParsing)\b))'
