# nghttp2 is a neutral HTTP/2 implementation surface.  Abuse as a flood
# transport is inferred by objectives that add browser spoofing and repetition.
defaults:
  platforms: [unix, windows, android]
  for: [source, binaries]
  crit: notable
  conf: 0.9
  attack: T1071.001

traits:
  - id: nghttp2-api-reference
    desc: References the nghttp2 HTTP/2 request API
    for: [c, cpp, go, elf, pe, macho]
    if:
      type: symbol
      kind: call
      regex: '^nghttp2_(session|submit|submit_request|submit_headers)'

  - id: nghttp2-library-reference
    desc: References the nghttp2 HTTP/2 library
    if:
      type: string_literal
      regex: '(?i)\bnghttp2\b'

composite_rules:
  - id: nghttp2-client-api
    desc: Native nghttp2 HTTP/2 client surface
    any:
      - id: nghttp2-api-reference
      - id: nghttp2-library-reference
