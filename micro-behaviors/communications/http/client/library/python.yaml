defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: hyper-h2-import
    desc: Imports the Python hyper-h2 library
    conf: 0.96
    if:
      type: import
      exact: h2.connection

  - id: hyper-h2-send-headers
    desc: Sends headers with Python hyper-h2
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_]\w*\.send_headers$'

  - id: hyper-h2-send-data
    desc: Sends data with Python hyper-h2
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_]\w*\.send_data$'

  - id: aiohttp-import
    desc: Imports the aiohttp Python HTTP client
    conf: 0.9
    if:
      type: import
      regex: '^(aiohttp$|aiohttp\.)'
  - id: reykit-rnet-http-client-import
    desc: Imports the reykit.rnet Python HTTP client
    conf: 0.92
    if:
      type: import
      exact: reykit.rnet

  - id: huggingface-hub-download-call
    desc: Hugging Face Hub model download call
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: hf_hub_download

  - id: openai-client-import
    desc: Python OpenAI API client import
    conf: 0.9
    if:
      type: text
      regex: '(?i)(from\s+openai\s+import|import\s+openai\b)'

  - id: anthropic-sdk-import
    desc: Imports the Anthropic Python API client
    conf: 0.95
    if:
      type: import
      exact: anthropic

  - id: anthropic-client-constructor
    desc: Constructs an Anthropic API client
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: anthropic.Anthropic

  - id: anthropic-messages-create
    desc: Sends an Anthropic Messages API request
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: client.messages.create

  - id: openai-client-constructor
    desc: Constructs an OpenAI-compatible API client
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: OpenAI

  - id: bitwarden-sdk-client
    desc: Python Bitwarden SDK client
    conf: 0.95
    if:
      type: import
      exact: bitwarden_sdk

composite_rules:
  - id: hyper-h2-request-send
    desc: Sends HTTP/2 request headers and data with Python hyper-h2
    conf: 0.98
    all:
      - id: hyper-h2-import
      - id: hyper-h2-send-headers
      - id: hyper-h2-send-data

  - id: aiohttp-session-request
    desc: Sends HTTP through an aiohttp session
    conf: 0.85
    all:
      - id: aiohttp-import
      - id: micro-behaviors/communications/http/client/library::python-session-method-call
  - id: bitwarden-secret-service-call
    desc: Bitwarden SDK secret service API call
    conf: 0.95
    all:
      - id: bitwarden-sdk-client
      - id: micro-behaviors/data/source/function/names::python-secrets-receiver-method-call
