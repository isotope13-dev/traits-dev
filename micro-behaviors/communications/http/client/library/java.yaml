defaults:
  platforms: [unix, windows]
  for: [java, kotlin]
traits:
  - id: java-http-url-connection
    desc: Java/Kotlin source HttpURLConnection usage
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bHttps?URLConnection\b'

  - id: android-okhttp-client-reference
    desc: Android OkHttp HTTP client reference
    crit: notable
    conf: 0.84
    for: [apk, zip, java, kotlin]
    if:
      type: text
      regex: 'okhttp3|Lokhttp3/'

  - id: ktor-http-client-import
    desc: Kotlin Ktor HTTP client import
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    if:
      type: import
      regex: '^io\.ktor\.client(\.|$)'

  - id: java-httpclient-send-source
    desc: Java HttpClient sends an HTTP request
    crit: notable
    conf: 0.96
    for: [java]
    if:
      type: text
      regex: 'HttpClient\.newHttpClient\(\)\.send\s*\('

  - id: java-httpclient-post-string-source
    desc: Java HttpClient builds a string POST body
    crit: notable
    conf: 0.96
    for: [java]
    if:
      type: text
      regex: '\.POST\s*\(\s*HttpRequest\.BodyPublishers\.ofString\s*\('
