# HTTP client use and a packaging command class in the same setup file.
# This does not bind the request to the class or infer a supply-chain attack.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: setup-command-http-api-cooccurrence
  desc: Setup command subclass co-occurs with HTTP client API
  crit: notable
  conf: 0.9
  scope: leaf
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setup-command-subclass
  any:
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/lib/requests::requests-request
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
