defaults:
  platforms: [unix, windows]
  crit: notable
  for: [python]

composite_rules:
  - id: setup-command-http-body-cooccurrence
    desc: Setup command and HTTP body co-occur
    crit: notable
    conf: 0.95
    scope: archive
    for:
    - python
    - package.json
    - tar
    - zip
    - whl
    all:
    - id: micro-behaviors/communications/http/client/library::setup-command-http-api-cooccurrence
    any:
    - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
    - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
    - id: micro-behaviors/communications/http/post::requests-post
    unless:
    - id: metadata/build/recognized-contexts::python-setup-network-benign-context
