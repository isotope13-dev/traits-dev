defaults:
  platforms: [unix, windows]
  for: [scripts, json]
traits:
  - id: n8n-http-request-node
    desc: n8n outbound HTTP Request node
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)n8n-nodes-base\.httpRequest\b'

    unless:
          - id: metadata/file/format/structured::serialized-news-article-catalog
