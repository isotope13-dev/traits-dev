defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96

traits:
  - id: aioquic-http3-import
    desc: Imports the aioquic HTTP/3 client
    if:
      type: import
      regex: '^aioquic\.h3(\.|$)'

  - id: pylsqpack-import
    desc: Imports the pylsqpack QPACK library
    if:
      type: import
      exact: pylsqpack

  - id: quic-high-stream-loop
    desc: Allocates 32+ QUIC request streams
    if:
      type: text
      regex: '(?s)\brange\s*\(\s*(3[2-9]|[4-9]\d|\d{3,})\s*\).{0,160}get_next_available_stream_id'

  - id: http3-open-headers-call
    desc: Sends an incomplete HTTP/3 HEADERS frame
    if:
      type: text
      regex: '(?s)\b(h3|http3)\w*\.send_headers\s*\(.{0,180}end_stream\s*=\s*False'

  - id: http3-open-data-call
    desc: Sends an incomplete HTTP/3 DATA frame
    if:
      type: text
      regex: '(?s)\b(h3|http3)\w*\.send_data\s*\(.{0,180}end_stream\s*=\s*False'

  - id: quic-send-stream-data-call
    desc: Sends data on a QUIC stream
    if:
      type: symbol
      kind: call
      regex: '(^|\.)send_stream_data$'
