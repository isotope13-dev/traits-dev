defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105
traits:
  - id: fetch-cmd
    desc: fetch command (FreeBSD/AIX)
    crit: notable
    conf: 0.7
    # The FreeBSD/AIX `fetch` CLI is invoked as `fetch <url>` or `fetch -o`.
    # Bind the command name, including across shell line continuations:
    # `git -c ... \\` followed by `fetch --tags` is still a git command.
    # A URL or option distinguishes downloader use from a bare mention.
    if:
      type: tree-sitter
      kind: call
      regex: '^fetch\s+(-|https?://|ftp://)'
