defaults:
  platforms: [windows, unix]
  for: [elf, pe, so, dll, c, cpp, objc]
  crit: notable

traits:

  # Binaries usually carry it as the "curl_easy_perform() failed:" error
  # prefix; headers and sources name it in comments or calls. The matcher
  # only shows the libcurl transfer function is named.
  - id: curl-easy-perform-name-reference
    desc: Names libcurl curl_easy_perform()
    conf: 0.82
    if:
      type: text
      substr: "curl_easy_perform()"
