defaults:
  platforms: [windows, unix]
  for: [scripts, source, pe, dll, elf, macho]
  crit: notable
  conf: 0.94
  attack: T1071.001

traits:
  - id: chromium-command-remote-url
    desc: Browser command opens remote URL
    # Keep the browser token adjacent to command-line-shaped arguments. A
    # loose 240-byte window also matched prose such as core-js's
    # "Chrome 38 ... https://bugs.chromium.org" compatibility comment.
    if:
      type: text
      regex: '\b(chrom(e|ium)|msedge)(\.exe)?["'']?\s+(https?://|["''-][^\r\n]{0,80}https?://)\w'
      case_insensitive: true

  - id: chromium-command-local-html
    desc: Browser command opens local HTML
    if:
      type: text
      regex: '(?i)\b(chrome|msedge)(\.exe)?\b[^\r\n]{0,180}file:///[^\r\n]{1,160}\.x?html?\b'
