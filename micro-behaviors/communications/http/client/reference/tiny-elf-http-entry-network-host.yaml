---
defaults:
  conf: 0.96
  platforms:
  - linux
  - android
  for:
  - elf
composite_rules:
- id: tiny-elf-http-entry-linking-clues
  desc: Tiny ELF with HTTP and entry clues
  size_max: 4096
  all:
  - id: micro-behaviors/communications/http/client/reference::direct-ip-tiny-elf-http-text
  - id: metadata/binary/header/program::elf-entry-in-last-segment
  - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
  any:
  - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty
  - id: metadata/binary/section/header::elf-no-section-headers
  crit: suspicious
- id: sectionless-tiny-elf-http-entry-clues
  desc: Sectionless ELF with HTTP and entry clues
  size_max: 512
  all:
  - id: micro-behaviors/communications/http/client/reference::sectionless-elf-http-entry-clues
  - id: metadata/binary/header/program::elf-entry-in-last-segment
  - id: metadata/binary/section/header::elf-no-section-headers
  crit: suspicious
