defaults:
  platforms: [unix, windows]

composite_rules:
- id: curl-client-reference
  desc: curl command, library or option references
  crit: notable
  conf: 0.66
  for: [scripts, source, binaries]
  any:
  - id: micro-behaviors/communications/http/curl/command::curl-command-url-or-option
  - id: micro-behaviors/communications/http/client/reference::libcurl-ref
  - id: micro-behaviors/communications/http/client/curl::curlopt-ref
  - id: micro-behaviors/communications/http/client/reference::curl-fail-silent-url-reference
