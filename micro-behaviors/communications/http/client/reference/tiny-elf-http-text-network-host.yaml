---
defaults:
  platforms:
  - linux
  - android
  for:
  - elf
composite_rules:
- id: direct-ip-tiny-elf-http-text
  desc: Tiny ELF with IP and HTTP text
  crit: suspicious
  conf: 0.97
  size_max: 4096
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
  - id: micro-behaviors/communications/http/message::http-version
  any:
  - id: metadata/binary/header/program::elf-entry-in-last-segment
  - id: metadata/binary/section/header::elf-no-section-headers
- id: sectionless-tiny-elf-http-text
  desc: Sectionless tiny ELF with HTTP text
  crit: suspicious
  conf: 0.92
  size_max: 2048
  all:
  - id: metadata/binary/section/header::elf-no-section-headers
  - id: micro-behaviors/communications/http/message::http-version
- id: sectionless-elf-http-entry-clues
  desc: Sectionless ELF with HTTP and entry clues
  crit: suspicious
  conf: 0.96
  size_max: 512
  all:
  - id: metadata/binary/section/header::elf-no-section-headers
  - id: metadata/binary/header/program::elf-entry-in-last-segment
  - id: micro-behaviors/communications/http/message::http-version
