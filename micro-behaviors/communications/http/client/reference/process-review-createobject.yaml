defaults:
  for: [oledoc, ooxml, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.92

traits:
  - id: createobject-http-fetcher
    desc: VBA CreateObject HTTP/XML fetcher object
    crit: suspicious
    conf: 0.93
    if:
      type: import
      regex: '^(MSXML2|Microsoft|WinHttp)\.'
    unless:
      # xlwings' add-in is an HTTP client (WinHttp / MSXML2).
      - id: metadata/document/office/macro::xlwings-package-path

