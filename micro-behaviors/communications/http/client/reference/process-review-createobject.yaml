defaults:
  for: [oledoc, ooxml, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.92

traits:
  - id: http-client-com-class-reference
    desc: HTTP client COM class reference
    conf: 0.93
    if:
      # Standalone VBS exposes neither COM imports nor parsed literals in the
      # current fact producer. Match the quoted class reference, not XML DOM.
      type: text
      regex: '(?i)["''](MSXML2|Microsoft|WinHttp)\.(XMLHTTP|ServerXMLHTTP|WinHttpRequest)\b'
    unless:
      # xlwings' add-in is an HTTP client (WinHttp / MSXML2).
      - id: metadata/document/office/macro::xlwings-package-path

