---
defaults:
  platforms:
  - linux
  - unix
  - android
  for:
  - elf
  crit: hostile
  mbc: B0024
  attack: T1105
composite_rules:
- id: tiny-superh-http-syscall-clues
  desc: Tiny stripped SuperH ELF with HTTP and syscall references
  crit: suspicious
  conf: 0.97
  attack: T1071.001,T1105
  all:
  - id: metadata/binary/layout/size::tiny-elf
  - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty-flag
  - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
  - id: micro-behaviors/os/syscall/raw::sh-trapa-syscall
  - id: micro-behaviors/communications/http/get::get
