defaults:
  platforms: [macos, windows]
  for: [asp, javascript]
  crit: notable
  conf: 0.97
traits:
  - id: jxa-curl-post-shell
    desc: JXA shell and curl POST command clues
    if:
      type: yara
      source: |
        rule jxa_curl_post_shell {
          strings:
            $post = "'POST'" ascii
            $curl = "curl -s -N --fail-early -X " ascii
            $shell = ".doShellScript(" ascii
            $jxa = "ObjC.import('Foundation')" ascii
          condition:
            all of them
        }
