---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  attack: T1071.001
traits:
- id: request-header-token-density
  desc: HTTP header-token density in small binary
  crit: notable
  conf: 0.88
  for:
  - pe
  - elf
  - macho
  size_max: 100000
  per_kb_min: 0.3
  unless:
  - type: text
    substr: "->read_response_header"
  - type: text
    substr: Django's URL keyword arguments to determine the version.
  - id: well-known/lib/crypto/oauth::oauthlib-rfc6749-source
  if:
    type: text
    regex: "(?i)(User-Agent:\\s|Host:\\s)"
