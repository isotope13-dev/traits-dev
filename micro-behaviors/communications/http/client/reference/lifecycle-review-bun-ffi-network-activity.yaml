defaults:
  platforms: [windows]
  for: [pe, javascript]
composite_rules:
  - id: bun-ffi-http-unwrap-clues
    for: [pe]
    desc: Bun FFI, httpGet and unwrapAsset clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/application/interpreter::bun-vfs-loader-entry
      - id: micro-behaviors/dylib/load/ffi::bun-ffi-module
      - id: metadata/lang/source/naming/function/transform::unwrap-asset-call-text
      - id: metadata/lang/source/naming/function/communication::httpget-call-text

