---
defaults:
  platforms:
  - unix
  - windows
  - macos
  for:
  - vsix-archive
  - javascript
  - typescript
  - package.json
composite_rules:
- id: vscode-extension-source-hardcoded-post
  desc: Extension source POSTs to a hardcoded host
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  all:
  - id: well-known/lib/development/vscode::require-vscode
  - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  any:
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-error-handler
  - id: micro-behaviors/data/control-flow/error-handling/suppress::empty-named-catch-text
  - id: micro-behaviors/data/control-flow/error-handling/suppress::empty-optional-catch-text
