---
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
composite_rules:
- id: depconf-beacon-package
  desc: Tiny module, HTTPS and package-shape clues
  crit: suspicious
  conf: 0.92
  for:
  - javascript
  all:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: metadata/file/size::javascript-small-file-5k
  any:
  - id: micro-behaviors/data/control-flow/module-exec::module-empty-export
  - id: metadata/package/dependencies/presence::npm-no-deps-at-all
  - id: metadata/package/description/disclosure::description-placeholder-poc-or-squat-claim
  needs: 2
