defaults:
  platforms:
  - windows
  for:
  - lnk
  crit: notable
traits:
- id: lnk-curl-command-reference
  desc: LNK arguments contain curl
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    regex: (?i)\bcurl\b
- id: lnk-serverxmlhttp-reference
  desc: LNK uses ServerXMLHTTP
  conf: 0.9
  if:
    type: text
    substr: ServerXMLHTTP
    case_insensitive: true
- id: lnk-wget-command-reference
  desc: LNK arguments reference wget
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    regex: (?i)\bwget\b
composite_rules:
- id: lnk-http-client-references
  desc: LNK references an HTTP client or transfer command
  conf: 0.85
  any:
  - id: micro-behaviors/communications/http/client/reference::lnk-serverxmlhttp-reference
  - id: micro-behaviors/communications/http/client/reference::lnk-curl-command-reference
  - id: micro-behaviors/communications/http/client/reference::lnk-wget-command-reference
  - id: micro-behaviors/communications/http/download/manager::lnk-bits-transfer-argument
