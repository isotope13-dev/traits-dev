# Same-file request/host-API inventory; independent APIs are not an upload flow.
# Benign control: backup software providing support uploads and network setup.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: multipart-wininet-api-inventory
    desc: Multipart and WinInet API references
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
      - id: micro-behaviors/communications/http/form::multipart-header-context
    any:
      - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
      - id: micro-behaviors/network/interface/query::get-adapters-info
      - id: micro-behaviors/process/create/shell/reference::cmd-command-and-createprocess-references
      - id: micro-behaviors/communications/http/request/reference::native-post-method-token
    needs: 2
