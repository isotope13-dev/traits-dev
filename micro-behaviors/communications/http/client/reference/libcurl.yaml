defaults:
  crit: notable
  platforms: [windows, unix, openwrt]
  attack: T1071.001
  mbc: C0002
  for: [elf, pe, so, dll, c, cpp, objc]
traits:
  - id: curl-easy-init
    desc: References libcurl easy-session initialization
    conf: 0.75
    if:
      type: import
      regex: curl_easy_init
  - id: curl-easy-setopt
    desc: References libcurl option-setting API
    conf: 0.7
    if:
      type: import
      regex: curl_easy_setopt
  - id: curl-easy-perform
    desc: References libcurl request execution API
    conf: 0.75
    if:
      type: import
      regex: curl_easy_perform
  - id: curl-easy-perform-error-string
    desc: libcurl perform failure format string
    conf: 0.86
    if:
      type: text
      exact: "curl_easy_perform() failed: %s"
  - id: curl-easy-cleanup
    desc: References libcurl session cleanup API
    conf: 0.6
    if:
      type: import
      regex: curl_easy_cleanup
  - id: curl-slist-append
    desc: References libcurl string-list append API
    conf: 0.7
    if:
      type: import
      regex: curl_slist_append
  - id: curl-slist-free
    desc: References libcurl string-list cleanup API
    conf: 0.5
    if:
      type: import
      regex: curl_slist_free_all
composite_rules:
  - id: libcurl-http
    desc: libcurl session and request API references
    conf: 0.8
    all:
      - id: curl-easy-init
      - id: curl-easy-perform
  - id: libcurl-custom-headers
    desc: libcurl request and string-list API references
    conf: 0.85
    all:
      - id: curl-easy-init
      - id: curl-slist-append
      - id: curl-easy-perform
