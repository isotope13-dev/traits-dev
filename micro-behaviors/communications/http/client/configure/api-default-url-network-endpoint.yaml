---
traits:
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: api-default-url-outside-social-provider-hosts
  desc: API default URL excludes known social hosts
  conf: 0.95
  if:
    type: text
    regex: config\.apiServer\s*\|\|\s*["']https?://[A-Za-z0-9.-]+
    not:
    - regex: https?://([A-Za-z0-9-]+\.)*(facebook\.com|fb\.com|meta\.com|instagram\.com|twitter\.com|x\.com)$
