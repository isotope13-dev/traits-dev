defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # Provenance of the urllib Request URL, traced through resolver returns,
  # tuple unpacking and helper parameters by the value-flow graph.
  - id: python-urllib-request-literal-url-origin
    desc: urllib Request URL from a URL literal
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 0
        from:
          value: '^https?://'
  - id: python-urllib-request-configured-url-origin
    desc: urllib Request URL from configuration
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 0
        from:
          call: '^(getattr|os\.environ\.get|os\.getenv)$|\.get$'
          through:
            - call: '^str$'
              arguments: [0]
composite_rules:
  # A configured endpoint that falls back to a built-in URL: the operator's
  # collector is used whenever the user sets nothing.
  - id: python-fixed-http-url-default-return
    desc: Hardcoded URL fallback reaches request helper
    conf: 0.95
    near_lines: 1
    all:
      - id: python-urllib-request-literal-url-origin
      - id: python-urllib-request-configured-url-origin
