defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-fixed-http-url-default-return
    desc: Hardcoded URL fallback reaches request helper
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((module (expression_statement (assignment left: (identifier) @configured right: (string (string_content) @url))) (function_definition name: (identifier) @resolver body: (block (if_statement consequence: (block (return_statement (expression_list (identifier) @returned (true))))))) (function_definition name: (identifier) @publisher parameters: (parameters . [(identifier) @param (typed_parameter (identifier) @param)]) body: (block (expression_statement (assignment right: (call function: (attribute object: (attribute object: (identifier) @urllib attribute: (identifier) @module) attribute: (identifier) @request_method) arguments: (argument_list . (identifier) @request_destination)))))) (function_definition body: (block (expression_statement (assignment left: (pattern_list . (identifier) @resolved) right: (call function: (identifier) @resolve_call))) (try_statement body: (block (if_statement consequence: (block (try_statement body: (block (expression_statement (call function: (identifier) @publish_call arguments: (argument_list . (identifier) @sent_destination))))))))))))
         (#eq? @configured @returned) (#match? @url "^https?://")
         (#eq? @resolver @resolve_call) (#eq? @publisher @publish_call)
         (#eq? @resolved @sent_destination) (#eq? @param @request_destination)
         (#eq? @urllib "urllib") (#eq? @module "request") (#eq? @request_method "Request"))
