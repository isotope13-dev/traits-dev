defaults:
  for: [powershell]
  platforms: [windows]
traits:
- id: add-cookie-header
  desc: Adds HTTP Cookie header
  crit: notable
  conf: 0.9
  attack: T1071.001
  if:
    type: text
    regex: 'Headers\.Add\("Cookie",\s*\$'
- id: read-set-cookie-header
  desc: Reads Set-Cookie response header
  crit: notable
  conf: 0.92
  attack: T1071.001
  if:
    type: text
    substr: ResponseHeaders.Get("Set-Cookie")
- id: urlmon-user-agent
  desc: Obtains browser User-Agent via urlmon
  crit: suspicious
  conf: 0.9
  attack: T1036.005
  if:
    type: text
    substr: ObtainUserAgentString
composite_rules:
- id: cookie-auth-http-client
  desc: Cookie-authenticated HTTP client flow
  crit: suspicious
  conf: 0.94
  attack: T1071.001
  all:
  - id: micro-behaviors/communications/http/client/initialize::powershell-system-webclient-construction
  - id: add-cookie-header
  - id: read-set-cookie-header
  - id: webclient-download-data
  any:
  - id: micro-behaviors/communications/http/user-agent::powershell-add-user-agent-header
  - id: urlmon-user-agent
