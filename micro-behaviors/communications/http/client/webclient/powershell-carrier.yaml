defaults:
  platforms: [windows]
  for: [png, text]

traits:
  - id: downloadstring-text
    desc: DownloadString text in PNG or text carrier
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/tool/offensive/decepticon::package-tree-member
    if:
      type: text
      regex: '(?i)^([^-\\r\\n].{0,200}\\bDownloadString\\b|\\bDownloadString\\b)'
