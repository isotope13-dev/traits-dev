defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.86

traits:
  - id: upload-data-method-name
    desc: References an UploadData method
    if:
      type: text
      word: UploadData
  # Bare upload-method words relocated from the Telegram objective: the
  # matcher only proves the word, not the uploader's language or endpoint.
  - id: upload-files-method-name
    desc: References an UploadFiles method
    if:
      type: text
      word: UploadFiles
  - id: needs-upload-method-name
    desc: References a NeedsUpload method
    if:
      type: text
      word: NeedsUpload
composite_rules:
  # Component fragment for upload-capable callers; the consuming objective
  # pairs it with endpoint and library evidence.
  - id: upload-method-word-cluster
    desc: Upload method word references
    crit: component
    any:
      - id: upload-data-method-name
      - id: upload-files-method-name
      - id: needs-upload-method-name
