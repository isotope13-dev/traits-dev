defaults:
  crit: notable
  platforms: [windows, unix, openwrt]
  for: [elf, pe, so, dll, c, cpp, objc]
traits:
  - id: curl-easy-init
    desc: libcurl easy initialization import
    conf: 0.75
    if:
      type: import
      regex: curl_easy_init
  - id: curl-easy-setopt
    desc: libcurl request-option import
    conf: 0.7
    if:
      type: import
      regex: curl_easy_setopt
  - id: curl-easy-perform
    desc: libcurl request-perform import
    conf: 0.75
    if:
      type: import
      regex: curl_easy_perform
  - id: curl-easy-perform-error-string
    desc: libcurl perform failure format string
    conf: 0.86
    if:
      type: text
      exact: "curl_easy_perform() failed: %s"
  - id: curl-easy-cleanup
    desc: libcurl session-cleanup import
    conf: 0.6
    if:
      type: import
      regex: curl_easy_cleanup
  - id: curl-slist-append
    desc: libcurl list-append import
    conf: 0.7
    if:
      type: import
      regex: curl_slist_append
  - id: curl-slist-free
    desc: libcurl list-free import
    conf: 0.5
    if:
      type: import
      regex: curl_slist_free_all
composite_rules:
  - id: libcurl-http
    desc: libcurl initialization and perform imports
    conf: 0.8
    all:
      - id: curl-easy-init
      - id: curl-easy-perform
  - id: libcurl-custom-headers
    desc: libcurl perform and list-append imports
    conf: 0.85
    all:
      - id: curl-easy-init
      - id: curl-slist-append
      - id: curl-easy-perform
