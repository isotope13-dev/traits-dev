defaults:
  platforms: [unix]
  for: [lua]
traits:
  - id: lua-shell-curl-text
    desc: Lua shell expression mentions curl
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.execute\s*\([^)]{0,180}\bcurl\b[^)]{0,160}\)'
    not:
      - substr: ' > '
      - substr: '--head'
      - substr: '-I'
      # A bare `curl` identifier (`os.execute(curl)`) is a variable holding
      # an unknown command built elsewhere -- often a download helper -- not
      # evidence that curl runs here, let alone uploads. Only literal curl
      # command text in the call keeps the finding.
      - regex: '\bcurl\s*\)'
      - regex: '\s(-[A-Za-z]*[oO]\b|--output\b)'
    unless:
      - type: text
        regex: 'https?://(127\.0\.0\.1|localhost|\[::1\])(?::[0-9]+)?/'
