defaults:
  platforms: [unix]
  for: [scripts, -php, -perl, -lua, rust, groovy, kotlin, makefile, dockerfile, text, pbxproj]
  crit: notable
  conf: 0.95
traits:
  - id: encoded-fetch-command-substitution
    desc: Encoded fetch in command substitution
    if:
      type: encoded
      regex: '(eval|echo)\s+["'']?\$\((curl|wget)\s'
    unless:
      # Command-risk policies in coding agents cite placeholder examples like `eval "$(curl …)"`
      - type: text
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026}|\\x[eE]2\\u20[aA][cC]\\x[aA]6)'
      - type: encoded
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026})'

# Preserve consumers that selected download/ when it also held response
# capture. Capturing stdout does not establish that an artifact was saved.
composite_rules:
  - id: http-response-acquisition
    desc: HTTP download or response-retrieval context
    for: [scripts, source, build, binaries, text]
    platforms: [unix, windows]
    any:
      - id: micro-behaviors/communications/http/download/
      - id: micro-behaviors/communications/http/client/service::github-raw-python-client-cooccurrence
      - id: micro-behaviors/communications/http/request/client::curl-wget-command-position
      - id: micro-behaviors/communications/http/curl::curl-s-flag
      - id: micro-behaviors/communications/http/curl::curl-command-call
      - id: micro-behaviors/communications/http/url/external-ip::curl-wget-ipv4-url
      - id: micro-behaviors/communications/http/curl::curl-silent-short-flag-url
      - id: micro-behaviors/communications/http/curl::curl-silent-long-flag-url
      - id: micro-behaviors/communications/http/curl::curl-silent-stdout
      - id: micro-behaviors/communications/http/curl::shell-curl-url-call
      - id: micro-behaviors/communications/http/request/client::fetch-command-with-var
      - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
      - id: micro-behaviors/communications/http/curl::curl-silent-fail-flags-text
      - id: micro-behaviors/communications/http/curl::curl-silent
      - id: encoded-fetch-command-substitution

