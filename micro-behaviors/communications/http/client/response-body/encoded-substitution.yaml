defaults:
  platforms: [unix]
  for: [scripts, -php, -perl, -lua, rust, groovy, kotlin, makefile, dockerfile, text, pbxproj]
  crit: notable
  conf: 0.95
traits:
  - id: encoded-fetch-command-substitution
    desc: Encoded fetch in command substitution
    if:
      type: encoded
      regex: '(eval|echo)\s+["'']?\$\((curl|wget)\s'
    unless:
      # Command-risk policies in coding agents cite placeholder examples like `eval "$(curl …)"`
      - type: text
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026}|\\x[eE]2\\u20[aA][cC]\\x[aA]6)'
      - type: encoded
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026})'

