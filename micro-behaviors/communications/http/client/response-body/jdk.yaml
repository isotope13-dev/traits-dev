defaults:
  crit: notable
  platforms: [unix, windows]
traits:
  - id: java-http-byte-response
    desc: Java HTTP byte response handler
    for: [java]
    if:
      type: text
      regex: '\bHttpResponse\.BodyHandlers\.ofByteArray\s*\('
      exclude_comments: true
composite_rules:
  - id: jdk-http-byte-response
    desc: JDK HTTP byte response handling
    for: [java, class]
    any:
      - id: java-http-byte-response
      - id: micro-behaviors/communications/http/lib/httpclient::java-byte-array-response-handler
