defaults:
  platforms: [android]
  for: [dex]
  crit: component
  conf: 0.88

traits:
  - id: android-urlconnection-get-method-token
    desc: Android DEX HTTP GET method token
    if:
      type: hex
      pattern: 47 45 54

  - id: android-urlconnection-response-stream-method-token
    desc: Android DEX response stream method token
    if:
      type: text
      exact: getInputStream

composite_rules:
  - id: android-urlconnection-get-response-vocabulary
    desc: Android DEX URLConnection GET response vocabulary co-occurs
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/symbols/descriptor::dex-httpurlconnection-type
      - id: android-urlconnection-get-method-token
      - id: android-urlconnection-response-stream-method-token
