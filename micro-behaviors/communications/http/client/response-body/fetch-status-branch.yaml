defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: fetch-response-text-in-status-branch
    desc: Fetch response text after status check
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @response
            value: (await_expression (call_expression function: (identifier) @fetch))))
          (if_statement
            condition: (parenthesized_expression (binary_expression
              left: (member_expression object: (identifier) @checked property: (property_identifier) @status)))
            consequence: (statement_block
              (lexical_declaration (variable_declarator
                value: (await_expression (call_expression
                  function: (member_expression object: (identifier) @read property: (property_identifier) @text))))))))
          (#eq? @fetch "fetch")
          (#eq? @response @checked)
          (#eq? @response @read)
          (#eq? @status "status")
          (#eq? @text "text"))
