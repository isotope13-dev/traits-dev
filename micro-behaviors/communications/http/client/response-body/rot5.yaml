# Character codes shifted by +5, with nested percent-escaped punctuation.
defaults:
  platforms: [windows]
  for: [html, javascript, data]
  conf: 0.95

traits:
  - id: rot5-response-body
    desc: ROT5 and percent-encoded responseBody property
    crit: notable
    if:
      type: text
      regex: '3wjxutsxjGti%(25){0,4}7E'

