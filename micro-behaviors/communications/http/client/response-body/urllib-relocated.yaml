# Capability placement: retained urllib matchers and scope.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: urlopen-response-body-read
  desc: Reads urllib response body
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)\burlopen\b.{0,140}\.read\s*\(
  unless:
  - id: well-known/tool/detection/agentskillmap/
