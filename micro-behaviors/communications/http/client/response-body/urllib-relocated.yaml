# Capability placement: retained urllib matchers and scope.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: urlopen-response-body-read
  desc: Reads urllib response body
  crit: notable
  conf: 0.9
  if:
    # The read receiver must be the response, not a file inside data=.
    type: symbol
    kind: call
    regex: '(^|\.)read$'
    receiver:
      from:
        call: '(^|\.)urlopen$'
