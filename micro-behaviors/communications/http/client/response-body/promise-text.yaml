# HTML analysis does not project script calls into the symbol view. Preserve
# text evidence for the promise chain without claiming a global fetch hook.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
traits:
  - id: response-text-then-callback
    desc: Chains callback onto response text promise
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: response.text().then
