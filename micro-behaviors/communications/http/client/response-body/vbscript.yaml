# VBScript statement form: an HTTP client's text body copied into a variable
# (`body = http.responseText`), the hand-off a later statement consumes.
defaults:
  platforms: [windows]
  for: [vbs, asp]

traits:
  - id: vbs-response-text-assignment
    desc: Assigns HTTP responseText to a variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\.responseText[ \t\r]*$'
