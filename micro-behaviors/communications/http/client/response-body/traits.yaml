defaults:
  platforms: [windows, unix]
traits:
  - id: fetch-response-text-to-link-variable
    desc: Assigns fetch response text to link variable
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '\blink\s*=\s*await\s+response\.text\s*\(\s*\)'

  - id: fetch-response-clone-json
    desc: Clones fetch response and parses JSON
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'response\.clone\(\)[\s\S]{0,160}\b(await\s+)?[A-Za-z_$][A-Za-z0-9_$]*\.json\(\)'
  - id: fetch-response-stream-reader
    desc: Reads fetch response as a stream
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.body\??\.getReader\s*\('
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
  - id: response-text
    desc: Reads an XMLHttpRequest response body
    crit: notable
    conf: 0.7
    for: [powershell, javascript, xml, vbs]
    if:
      type: text
      regex: '(?i)\.responseText'
    unless:
      - id: metadata/lang/javascript-features::closure-externs-annotation
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure::js-emscripten-preamble-marker
      - id: metadata/library/axios::axios-class
      - id: metadata/library/axios::axios-version
      - id: well-known/lib/web/jquery/
  - id: js-response-text-read
    desc: JavaScript reads HTTP response text
    crit: notable
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      # Restrict this to conventional response objects.  A generic `.text()`
      # call also describes jQuery/DOM setters and unrelated object methods.
      regex: '^(response|resp|res|xhr)\.text$'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: response-body
    desc: Access to HTTP response body
    crit: notable
    conf: 0.82
    for: [powershell]
    if:
      type: text
      regex: '(?i)\.responseBody'
  - id: javascript-response-body
    desc: JavaScript reads a binary HTTP response body
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '(?i)\.responseBody'
  - id: fetch-html-innerhtml
    desc: Fetch response HTML written to DOM
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\([^)]{1,300}\)[\s\S]{0,900}\.innerHTML\s*=\s*html\b'
  - id: fetch-html-document-write
    desc: Writes fetched HTML into a browser document
    crit: notable
    conf: 0.96
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\([^)]{1,300}\)[\s\S]{0,900}document\.write\s*\(\s*html\b'
  # This is a proximity observation, not data-flow proof: the dynamic RHS may
  # use an unrelated local value. A constant literal assignment (`sel.innerHTML
  # = '<option>Loading…</option>'`) is only a static UI reset and is excluded.
  - id: fetch-json-before-dynamic-innerhtml
    desc: Fetch JSON precedes dynamic innerHTML write
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)[\w$]+\.json\s*\(\s*\)[\s\S]{0,900}\.innerHTML\s*=\s*(["''][^;\n]{0,60}\+|[`\w$])'
    not:
      # …and the two must sit in the SAME function. Minified code has no line
      # breaks, so 900 characters routinely span several unrelated methods:
      # Otter Blocks' Google-Fonts helper closes its promise chain and its
      # `load()` method, then opens `updateCSSNode(){this.node.innerHTML=…}`,
      # 150 characters later. `}` immediately followed by a name and a
      # parameter list is that boundary — a promise chain never produces it,
      # because `}` there is followed by `)` or `.`, never by an identifier.
      - regex: '\}\s*[\w$]+\s*\([^)]{0,80}\)\s*\{'

  # Reading the body of a fetch/http.Get response is ordinary client work.
  # These two used to live in objectives/command-and-control/channel/deaddrop/
  # under a dead-drop name their matchers never established, so any module that
  # read a response body picked up a C2-channel finding — and satisfied every
  # composite that folds that directory in by name.
  - id: fetch-response-body-read
    desc: JavaScript fetch reads response body
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\bfetch\b.{0,140}\.(text|arrayBuffer)\s*\('

  - id: go-http-get-response-body-read
    desc: Go HTTP response body read
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\bhttp\.Get\b.{0,140}(ReadAll|\.Body)'

composite_rules:
  - id: remote-response-body-read
    desc: Reads a remote HTTP response body
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: micro-behaviors/communications/http/lib/requests::requests-response-body-access
      - id: fetch-response-body-read
      - id: go-http-get-response-body-read

  - id: powershell-http-response-retrieval
    desc: PowerShell retrieves an HTTP response body
    crit: notable
    conf: 0.9
    for: [powershell]
    any:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/communications/http/client/managed::uploadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
