defaults:
  platforms: [windows, unix]
traits:
  - id: response-data-property-assignment
    desc: Assigns an HTTP response data property
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\s*=\s*(response|resp|res)\.data\.[A-Za-z_$][\w$]*\s*;'

  - id: python-response-json-call
    desc: Python parses HTTP response body as JSON
    crit: component
    conf: 0.85
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.json$'

  - id: python-response-body-member-reference
    desc: Python response body member access
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        (attribute
          object: (identifier) @object
          attribute: (identifier) @member
          (#match? @object "^(r|resp|response)$")
          (#match? @member "^(content|text)$"))
        (attribute
          object: (call
            function: (attribute
              object: (identifier) @client
              attribute: (identifier) @method))
          attribute: (identifier) @member
          (#eq? @client "requests")
          (#match? @method "^(get|post|put|patch|delete|request)$")
          (#match? @member "^(content|text)$"))

  - id: fetch-response-text-to-link-variable
    desc: Assigns fetch response text to link variable
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '\blink\s*=\s*await\s+response\.text\s*\(\s*\)'

  - id: fetch-response-clone-json
    desc: Clones fetch response and parses JSON
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'response\.clone\(\)[\s\S]{0,160}\b(await\s+)?[A-Za-z_$][A-Za-z0-9_$]*\.json\(\)'
  - id: fetch-response-stream-reader
    desc: Reads fetch response as a stream
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.body\??\.getReader\s*\('
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
  - id: response-text
    desc: References a script HTTP response body
    crit: notable
    conf: 0.7
    for: [powershell, javascript, xml, vbs, html]
    if:
      type: text
      regex: '(?i)\.responseText'
    unless:
      - id: metadata/lang/javascript-features::closure-externs-annotation
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
      - id: well-known/lib/network/axios-legacy::axios-class
      - id: well-known/lib/network/axios-legacy::axios-version
      - id: well-known/lib/web/client-side/jquery/
  - id: js-response-text-read
    desc: JavaScript reads HTTP response text
    crit: notable
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      # Restrict this to conventional response objects.  A generic `.text()`
      # call also describes jQuery/DOM setters and unrelated object methods.
      regex: '^(response|resp|res|xhr)\.text$'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: response-body
    desc: Access to HTTP response body
    crit: notable
    conf: 0.82
    for: [powershell]
    if:
      type: text
      regex: '(?i)\.responseBody'
  - id: javascript-response-body
    desc: References HTTP responseBody property
    crit: notable
    conf: 0.9
    for: [javascript, typescript, vbs, html]
    if:
      type: text
      regex: '(?i)\.responseBody'
  # The same property with the name itself fragmented so no literal
  # `responseBody` exists in the file: "re" + "sponseBody",
  # "response" + "Body". Downloaders split it to hide the exfiltration read
  # from string signatures; the fragments only reassemble to this one API.
  - id: vbs-split-responsebody-reference
    desc: responseBody built from split string fragments
    crit: notable
    conf: 0.93
    for: [vbs]
    if:
      type: text
      regex: '(?i)"[A-Za-z]{1,12}"\s*\+\s*"[A-Za-z]{0,12}sponseBody"|"response"\s*\+\s*"Body"'
  - id: fetch-html-innerhtml
    desc: Fetch response HTML written to DOM
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\([^)]{1,300}\)[\s\S]{0,900}\.innerHTML\s*=\s*html\b'
  - id: fetch-html-document-write
    desc: Writes fetched HTML into a browser document
    crit: notable
    conf: 0.96
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\([^)]{1,300}\)[\s\S]{0,900}document\.write\s*\(\s*html\b'
  # This is a proximity observation, not data-flow proof: the dynamic RHS may
  # use an unrelated local value. A constant literal assignment (`sel.innerHTML
  # = '<option>Loading…</option>'`) is only a static UI reset and is excluded.
  - id: fetch-json-before-dynamic-innerhtml
    desc: Fetch JSON precedes dynamic innerHTML write
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)[\w$]+\.json\s*\(\s*\)[\s\S]{0,900}\.innerHTML\s*=\s*(["''][^;\n]{0,60}\+|[`\w$])'
    not:
      # …and the two must sit in the SAME function. Minified code has no line
      # breaks, so 900 characters routinely span several unrelated methods:
      # Otter Blocks' Google-Fonts helper closes its promise chain and its
      # `load()` method, then opens `updateCSSNode(){this.node.innerHTML=…}`,
      # 150 characters later. `}` immediately followed by a name and a
      # parameter list is that boundary — a promise chain never produces it,
      # because `}` there is followed by `)` or `.`, never by an identifier.
      - regex: '\}\s*[\w$]+\s*\([^)]{0,80}\)\s*\{'

  # Reading the body of a fetch/http.Get response is ordinary client work.
  # These two used to live in objectives/command-and-control/channel/deaddrop/
  # under a dead-drop name their matchers never established, so any module that
  # read a response body picked up a C2-channel finding — and satisfied every
  # composite that folds that directory in by name.
  - id: fetch-response-body-read
    desc: JavaScript fetch reads response body
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?is)\bfetch\b.{0,140}\.(text|arrayBuffer)\s*\('

  - id: go-http-get-response-body-read
    desc: Go HTTP response body read
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\bhttp\.Get\b.{0,140}(ReadAll|\.Body)'
  - id: unicode-escaped-response-body
    desc: responseBody in a unicode-escaped string
    for: [javascript, vbs]
    platforms: [windows]
    conf: 0.8
    crit: notable
    if:
      type: encoded
      encoding: unicode-escape
      word: responseBody
      case_insensitive: true

  # Relocated from objectives/command-and-control/beacon/network/periodic
  # (c2-response-check-loop): a response status-code check beside a `while`
  # loop. The matcher sees an HTTP status poll, not its purpose -- every
  # retry helper reads status codes -- so it lives here as a neutral
  # capability; the beacon composites add the timer legs that make the
  # C2 claim.
  - id: http-response-status-check-loop
    desc: HTTP response status checked in a loop
    conf: 0.75
    for: [scripts, binaries]
    if:
      type: string_literal
      regex: if.{0,50}response\.status_code.{0,50}while|while.{0,50}status_code

composite_rules:
  - id: python-client-response-body-cooccurrence
    desc: Python HTTP client and response-body access coexist
    crit: notable
    conf: 0.9
    for: [python]
    all:
      - id: python-response-body-member-reference
    any:
      - id: micro-behaviors/communications/http/lib/requests
      - id: micro-behaviors/communications/http/response::raise-for-status
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/post::requests-post
      - id: metadata/import/python/requests
  - id: remote-response-body-read
    desc: Reads a remote HTTP response body
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: python-client-response-body-cooccurrence
      - id: fetch-response-body-read
      - id: go-http-get-response-body-read

  - id: powershell-http-response-retrieval
    desc: PowerShell retrieves an HTTP response body
    crit: notable
    conf: 0.9
    for: [powershell]
    any:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/communications/http/client/managed::uploadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
