traits:
- crit: notable
  conf: 0.8
  id: wsh-response-body-hex
  desc: Accesses responseBody hex-escaped form
  if:
    type: string_literal
    substr: \\\\x72\\\\x65\\\\x73\\\\x70\\\\x6F\\\\x6E\\\\x73\\\\x65\\\\x42\\\\x6F\\\\x64\\\\x79
    case_insensitive: true
composite_rules:
- crit: notable
  conf: 0.8
  id: wsh-response-body
  desc: Accesses responseBody (XMLHTTP)
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/build/bundler/runtime::closure-compiler-css-renaming
  any:
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body-wscript
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body-xmlhttp
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body-adodb
- crit: notable
  conf: 0.8
  id: wsh-response-body-wscript
  desc: Accesses responseBody with WScript.Shell context
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  any:
  - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
  - id: micro-behaviors/communications/http/client/response-body::unicode-escaped-response-body
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body-hex
- crit: notable
  conf: 0.8
  id: wsh-response-body-xmlhttp
  desc: Accesses responseBody with XMLHTTP COM context
  all:
  - id: micro-behaviors/communications/http/client/xmlhttp::activex-http-progid
  any:
  - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
  - id: micro-behaviors/communications/http/client/response-body::unicode-escaped-response-body
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body-hex
- crit: notable
  conf: 0.8
  id: wsh-response-body-adodb
  desc: Accesses responseBody with ADODB.Stream context
  all:
  - id: micro-behaviors/fs/write/file/stream::adodb-stream
  any:
  - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
  - id: micro-behaviors/communications/http/client/response-body::unicode-escaped-response-body
  - id: micro-behaviors/communications/http/client/response-body::wsh-response-body-hex
defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
