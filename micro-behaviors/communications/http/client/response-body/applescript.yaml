# Capturing stdout differs from curl's file-output operation. Match the
# assignment and the HTTP curl command together, including escaped source
# recovered from native string decoders. This does not establish execution
# of the response or successful communication.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.95

traits:
  - id: applescript-curl-http-output-assignment
    desc: AppleScript assigns quiet HTTP curl output
    if:
      type: text
      regex: '\bset\s+\w+\s+to\s+\(?do shell script [\\]*"curl -sS? https?://'
