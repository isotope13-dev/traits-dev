defaults:
  for: [html, javascript, typescript]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: fetch-promise-returns-text
    desc: Fetch callback returns response text
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?s)fetch\([^;]{1,300}\.then\(.{0,80}\breturn\s+\w+\.text\(\)'
composite_rules:
  - id: fetch-text-near-command-assignment
    desc: Fetch text near command variable assignment
    conf: 0.9
    near_bytes: 320
    all:
      - id: fetch-promise-returns-text
      - id: metadata/lang/source/syntax/assignment::payload-variable-from-identifier
