defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: await-response-json
    desc: Calls JSON parsing on a response object
    crit: notable
    conf: 0.92
    # Declaration files quote this in API examples; they do not parse a body.
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: symbol
      kind: call
      regex: '^(res|response)\.json$'

