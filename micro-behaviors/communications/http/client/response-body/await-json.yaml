defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: response-json-no-argument-call
    desc: Calls response.json() without a body argument
    crit: notable
    conf: 0.92
    # Fetch body readers take no arguments; Express json(body) sends JSON.
    # Declaration files quote this in API examples; they do not parse a body.
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: tree-sitter
      kind: call
      regex: '^(res|response)\.json\s*\(\s*\)$'

