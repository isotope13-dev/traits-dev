defaults:
  platforms: [windows]
  for: [lnk]

traits:
- id: lnk-arg-responsebody
  desc: LNK arg reads HTTP responseBody
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: 'responseBody'
    case_insensitive: true

  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/cleave::cleave-traits-package-identity
