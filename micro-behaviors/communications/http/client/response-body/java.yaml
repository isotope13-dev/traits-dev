# Java opens a URLConnection and reads its response stream. The bounded
# span binds the read to the opened connection, unlike the generic
# getInputStream accessor, which Process, sockets, and servlet requests
# also expose. A saved destination or a purpose remains separate evidence.
defaults:
  platforms: [android, unix, windows]
  for: [java, jsp, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: java-urlconnection-response-stream-read
    desc: Reads an opened URL connection response stream
    if:
      type: text
      regex: '(?s)openConnection\s*\(\).{0,300}?(getInputStream\s*\(|\.inputStream\b)'
