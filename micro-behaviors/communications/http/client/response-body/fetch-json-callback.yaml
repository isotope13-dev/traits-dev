defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: fetch-json-tab-injection-callback-profile
    desc: Fetch JSON callback mentions tabs.executeScript
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression
                object: (call_expression function: (identifier) @fetch)
                property: (property_identifier) @then1)
              arguments: (arguments
                (arrow_function
                  parameter: (identifier) @reply
                  body: (call_expression
                    function: (member_expression
                      object: (identifier) @reply_use
                      property: (property_identifier) @json)
                    arguments: (arguments)))))
            property: (property_identifier) @then2)
          arguments: (arguments
            (arrow_function body: (statement_block) @task_body))) @chain
          (#eq? @fetch "fetch")
          (#eq? @then1 "then")
          (#eq? @then2 "then")
          (#eq? @reply @reply_use)
          (#eq? @json "json")
          (#match? @task_body "\\.tabs\\.executeScript\\s*\\("))
