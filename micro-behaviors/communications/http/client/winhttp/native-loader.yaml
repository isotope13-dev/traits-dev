defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
  attack: T1071.001
  mbc: C0002

traits:
  - id: native-winhttp-user-agent-host-cluster
    desc: Native WinHTTP user-agent and Host-header string
    if:
      type: raw
      regex: 'WinHttpAddRequestHeadersMozilla/5\.0.{0,80}GET.{0,8}Host:'
      case_insensitive: true

  - id: native-winsock-api-cluster
    desc: Native binary embeds a Winsock API table
    if:
      type: raw
      regex: 'ws2_32\.dllWSAStartup.{0,64}socket'
      case_insensitive: true

  - id: native-winsock-transfer-api-cluster
    desc: Native binary embeds Winsock transfer APIs
    if:
      type: raw
      regex: 'sendto.{0,64}recvfrom.{0,64}closesocket'
      case_insensitive: true

composite_rules:
  - id: native-winsock-transport-cluster
    desc: Native binary embeds a Winsock transport API set
    crit: notable
    conf: 0.98
    all:
      - id: native-winsock-api-cluster
      - id: native-winsock-transfer-api-cluster
