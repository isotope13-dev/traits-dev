---
defaults:
  for:
  - pe
  platforms:
  - windows
  conf: 0.99
composite_rules:
- id: url-regex-winhttp-wmi-clues
  desc: URL regex, WinHTTP and WMI clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/communications/url/parse::escaped-http-url-regex-text
  - id: micro-behaviors/os/wmi/query::query-computer-system-product
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-dll-name-text
  any:
  - id: metadata/binary/code/complexity::extreme-max-complexity
  - id: metadata/file/entropy::high-overall-entropy-70
