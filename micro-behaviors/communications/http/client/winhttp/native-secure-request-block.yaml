defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.94
traits:
  # WinHttpOpenRequest-shaped native argument block: null version/referrer/
  # accept-types and WINHTTP_FLAG_SECURE in stack argument 7, followed by
  # the indirect call. Records a probable call shape, not a decoded API name,
  # HTTP method, destination, transfer or confirmed execution.
  - id: indirect-winhttp-secure-request-shape-x64
    desc: Indirect secure HTTP request argument block
    if:
      type: hex
      section: .text
      pattern: >-
        (0F 57 ?? | 45 0F 57 ??) [0-8]
        (0F 11 ?? 24 20 | 44 0F 11 ?? 24 20)
        C7 44 24 30 00 00 80 00
        45 31 C9 [0-16] FF (54 24 ?? | 94 24 ?? ?? 00 00)
