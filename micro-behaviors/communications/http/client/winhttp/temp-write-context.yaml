defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: winhttp-temp-write-api-cluster
    desc: WinHTTP, temporary-file and file-write API cluster
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/fs/temp/directory::get-temp-file-name
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/
        - id: well-known/tool/sysadmin/disk-utility::winhex-xways
    unless:
      - id: well-known/app/storage/syncback/
      - id: well-known/app/security/bitdefender/
      - id: metadata/binary/installer/family::inno-uninstaller-runtime
      - id: well-known/app/utility/vovsoft::ai-requester-known-app-context
      - id: well-known/app/utility/vovsoft::filename-lister-known-app-context
      - id: well-known/lib/ai/tesseract/
