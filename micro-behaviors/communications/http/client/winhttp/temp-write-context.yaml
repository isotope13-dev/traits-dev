defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: winhttp-temp-write-api-cluster
    desc: WinHTTP, temporary-file and file-write API cluster
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
