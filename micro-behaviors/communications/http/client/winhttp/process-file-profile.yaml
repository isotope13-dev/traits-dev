# An API co-occurrence profile; does not establish download-to-execution flow.
defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
composite_rules:
  - id: winhttp-process-registry-api-profile
    desc: WinHTTP, process and registry API references
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/os/registry/access::registry-read-api-chain
      - id: metadata/file/profile/string-population::large-pe-many-strings
    any:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-loader-api-chain
      - id: micro-behaviors/fs/file/copy/call::copyfile-w
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/fs/directory/create::create-directory-w
      - id: micro-behaviors/fs/path/basename::updater-name-reference
    needs: 2
