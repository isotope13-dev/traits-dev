# An API co-occurrence profile; does not establish download-to-execution flow.
defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
composite_rules:
  - id: winhttp-process-registry-api-profile
    desc: WinHTTP, process and registry API references
    crit: notable
    conf: 0.93
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/vendor::microsoft-corp-marker
      - id: metadata/signed/unknown::ip-zinukhov-stanislav-igorevich
      # SyncBack's serial/upgrade helper uses WinHTTP, registry settings and
      # temporary installer files as a normal vendor update workflow.
      - id: well-known/app/storage/syncback/
      - id: well-known/dual-use/transfer/winscp/
      # A compiled Chromium/Electron engine binary uses WinHTTP for system
      # proxy resolution, spawns child processes, reads registry settings,
      # and stages files from ordinary framework behavior (including the
      # legitimate electron-updater workflow). Key on the multi-marker
      # engine context, not on any single string, so one embedded marker
      # cannot grant the exemption.
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
      # TWinHttpLib plus the VCL file and registry imports is a desktop HTTP
      # component, not an obfuscated updater.
      - id: metadata/lang/compiler/managed::embarcadero-vcl-runtime
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/os/registry/access::registry-read-api-chain
      - id: metadata/file/profile/string-population::large-pe-many-strings
    any:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-loader-api-chain
      - id: micro-behaviors/fs/file/copy::copyfile-w
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/fs/directory/mkdir::create-directory-w
      - id: micro-behaviors/fs/path/basename::updater-name-reference
    needs: 2
