defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: winhttp-file-folder-com-api-set
  desc: WinHTTP, file I/O, folder and COM APIs co-occur
  crit: notable
  conf: 0.96
  size_max: 5242880
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/wine/
  - id: well-known/app
  all:
  - id: winhttp-request-response-flow
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/fs/path/location::shell-get-folder-path-a
  - id: micro-behaviors/os/com/invoke::co-create-instance
