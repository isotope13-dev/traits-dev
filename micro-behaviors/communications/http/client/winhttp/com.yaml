# WinHttp.WinHttpRequest.5.1 — the scriptable COM face of WinHTTP.
#
# This is a distinct stack from MSXML2.XMLHTTP/ServerXMLHTTP (the xmlhttp/
# sibling): different DLL, different ProgID, and it honours WinHTTP proxy
# configuration rather than WinINet's. Script-based droppers reach for it
# because it works from VBS/JS/VBA and from PE binaries via IDispatch, with no
# dependency on Internet Explorer components.
defaults:
  platforms:
    - windows
  for: [binaries, scripts]
traits:
  - id: winhttp-request-com
    desc: WinHttpRequest scriptable COM HTTP client
    crit: notable
    conf: 0.8
    attack: T1071.001
    mbc: C0002
    if:
      type: text
      regex: (?i)WinHttp\.WinHttpRequest
