defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: github-raw-winhttp-imgui-clues
    desc: WinHTTP, GitHub raw content and Dear ImGui references
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: well-known/app/development/code-forge/github::raw-githubusercontent-host-string
    any:
      - id: well-known/lib/ui/dear-imgui::dear-imgui-library
    needs: 1
