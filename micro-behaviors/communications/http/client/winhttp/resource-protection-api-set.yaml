# These independent matches establish co-occurrence, not payload data flow,
# encryption, execution of resource bytes, or malware identity.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: winhttp-resource-protection-api-set
  desc: WinHTTP and memory-protection APIs with high-entropy resources
  crit: notable
  conf: 0.97
  all:
  - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/game/online::bolacga-launcher-game-context

