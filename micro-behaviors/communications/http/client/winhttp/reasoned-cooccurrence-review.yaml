# References and API co-occurrence do not establish bound data flow.
composite_rules:
- for:
  - pe
  - dll
  platforms:
  - windows
  id: winhttp-mutex-host-api-cooccurrence
  desc: WinHTTP and mutex APIs beside host-integration APIs
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/process/sync/mutex::mutex-instance-check
  any:
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: micro-behaviors/process/terminate/kill::security-name-enumeration-termination-api-profile
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/crypto/library/cryptoapi::capi-keyed-buffer-crypto-chain
  - id: micro-behaviors/fs/path/autostart::startup-folder-composition-api-cooccurrence
  needs: 3
