defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: mingw-winhttp-proxy-memory-overlay-profile
    desc: MinGW WinHTTP proxy, memory and overlay APIs
    crit: suspicious
    conf: 0.95
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-proxy-aware-resolution
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
      - id: metadata/binary/layout/overlay::has-overlay
    unless:
      - id: metadata/installer/product/
      - id: well-known/tool/sysadmin/busybox::mingit-busybox-basename
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
        - id: well-known/lib/runtime/managed/jvm::jli-symbol-set
        - id: well-known/tool/packaging/jsmooth::jsmooth-java-launcher
        - id: well-known/lib/ui/flutter::flutter-windows-desktop-runner
        - id: well-known/lib/runtime/compiled/unity-il2cpp::unity-il2cpp-graphics-reference
