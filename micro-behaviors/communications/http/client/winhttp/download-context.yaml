defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  crit: notable
composite_rules:
- id: winhttp-dynamic-download-capability
  desc: WinHTTP request and response API profile
  conf: 0.93
  any:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow-text
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
- id: winhttp-download-context
  desc: WinHTTP with temp or native API context
  conf: 0.92
  all:
  - id: winhttp-dynamic-download-capability
  any:
  - id: metadata/signed/trust-level::unsigned
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
  - id: metadata/binary/symbols/name/process::create-process-w
  needs: 2
