defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
traits:
  - id: node-gh-contents-put
    desc: GitHub CLI writes repository contents
    # Bind the executable, route and PUT option to one argv array.
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @exec
          arguments: (arguments
            . (string (string_fragment) @exe)
            . (array
              . (string (string_fragment) @api)
              . [(template_string) (string)] @route
              (string (string_fragment) @option)
              . (string (string_fragment) @verb)))) @evidence
        (#eq? @exec "execFileSync")
        (#eq? @exe "gh")
        (#eq? @api "api")
        (#match? @route "^[\"'`]/?repos/.{1,160}/contents/")
        (#eq? @option "-X")
        (#eq? @verb "PUT"))
