defaults:
  for: [html, javascript, typescript]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: fetch-payload-action-query
    desc: Fetch requests a payload or command action
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bfetch\s*\(\s*["''][^"'']{0,256}[?&](api|action)=(get_payload|get_command)\b'
