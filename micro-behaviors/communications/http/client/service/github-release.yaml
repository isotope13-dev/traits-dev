defaults:
  platforms: [windows, unix]
  for: [shell]
traits:
- id: shell-curl-github-release-api-reference
  desc: curl command references GitHub releases API
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'curl.{0,99}https://api\.github\.com/repos/[^/\s]{1,100}/[^/\s]{1,100}/releases\b'
