# Co-occurrence does not bind the URL to a call, or prove an artifact is saved.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  mbc: C0002
  attack: T1071.001
composite_rules:
- id: github-raw-python-client-cooccurrence
  desc: Python HTTP client beside raw GitHub URL
  conf: 0.85
  all:
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-any
  any:
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/http/get::requests-get
