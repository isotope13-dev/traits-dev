defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  mbc: C0002
  attack: T1071.001
traits:
- id: github-raw-browser-fetch
  desc: Fetch targets a GitHub raw URL
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: fetch
    arg:
      index: 0
      regex: '^https://raw\.githubusercontent\.com/'
