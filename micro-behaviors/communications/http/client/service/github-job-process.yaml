# These are co-occurring observations, not a request-to-command relationship.
# Retain the original neutral evidence when the hostile consumer is tightened.
defaults:
  platforms: [windows, unix]
  for: [rust, go, python, javascript, typescript, shell, c, cpp]

composite_rules:
  - id: contents-job-process-cooccurrence
    desc: GitHub Contents, job-state and process clues
    crit: notable
    conf: 0.9
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
      - id: micro-behaviors/fs/path/reference::job-state-json-filename
    any:
      - id: micro-behaviors/process/create
      - id: metadata/lang/source/syntax/command::rundll32-command-syntax-reference
    unless:
      - id: metadata/build/ci/step::actions-checkout-step
