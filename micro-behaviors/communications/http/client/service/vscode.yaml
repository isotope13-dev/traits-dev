defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

composite_rules:
  - id: vscode-extension-http-request
    desc: VS Code extension HTTP request
    crit: notable
    conf: 0.9
    all:
      - id: metadata/permission/activation::vscode-context
    any:
      - id: micro-behaviors/communications/http/request/client
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
