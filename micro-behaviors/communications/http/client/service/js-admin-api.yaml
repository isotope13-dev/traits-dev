# Typed JS API clients generated against a service's own admin endpoints.
# The binding shape — `getSystemInfo:(t={})=>this.request({path:"/admin/..."})`
# — and its call sites (`T.admin.getSystemInfo()`) are plumbing of a frontend
# talking to its own backend. Go servers that embed such UIs otherwise trip
# source-level recon words for every scan.
defaults:
  platforms: [unix, windows]
  # The same generated client is embedded in Go/Rust server binaries, not
  # only shipped as a .js file. Text matchers apply to both.
  for: [javascript, typescript, pe, elf, macho]
  crit: notable
  conf: 0.9

traits:
  - id: js-admin-api-client-call
    desc: Admin API client method invocation
    if:
      type: text
      regex: '[\w.$]{1,80}\.getSystemInfo\('

  - id: js-api-client-endpoint-binding
    desc: API client endpoint binding to backend request
    if:
      type: text
      regex: 'getSystemInfo\s*:\s*\(?[^)]{0,40}\)?\s*=>\s*this\.request'
