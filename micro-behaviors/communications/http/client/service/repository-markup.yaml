defaults:
  platforms: [unix, windows]
  for: [text, data, source]

traits:
  - id: repository-markup-render-url
    desc: Repository markup-rendering HTTP URL
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)https?://[.\w:-]+/[\w.-]+/[\w.-]+/markup\b'

  - id: repository-markup-render-request
    desc: Repository markup-rendering HTTP request
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)(GET|POST)\s+/[\w.-]+/[\w.-]+/markup\b'

composite_rules:
  - id: repository-markup-render-http-route
    desc: HTTP repository markup-rendering route
    crit: notable
    conf: 0.96
    any:
      - id: repository-markup-render-url
      - id: repository-markup-render-request
