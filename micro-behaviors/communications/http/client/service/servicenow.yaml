# ServiceNow platform HTTP client capability.
#
# Glide scripts make outbound HTTP requests through the sn_ws.RESTMessageV2
# object (Rhino-based server-side JavaScript inside the ServiceNow SaaS
# layer). The constructor call is the canonical marker of tenant-side
# outbound HTTP, whether used for integrations, credential retrieval, or
# script-tasking C2 (e.g. the SnowFall technique described by MDSec,
# "When it Snows it Pours", 2026).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data, python]

traits:
  - id: servicenow-restmessagev2-request
    desc: ServiceNow RESTMessageV2 outbound HTTP request
    crit: notable
    conf: 0.97
    attack: T1071.001
    if:
      type: text
      regex: 'new\s+sn_ws\.RESTMessageV2\s*\('

  - id: servicenow-restmessage-body-capture
    desc: Captures ServiceNow REST message response body
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '=\s*\w+\.getBody\s*\(\s*\)'

  - id: servicenow-xmlhttp-endpoint
    desc: Calls ServiceNow xmlhttp.do AJAX endpoint
    crit: notable
    conf: 0.92
    attack: T1071.001
    if:
      type: text
      regex: '/xmlhttp\.do'

  - id: servicenow-sysparm-processor-param
    desc: ServiceNow AJAX processor parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: sysparm_processor
