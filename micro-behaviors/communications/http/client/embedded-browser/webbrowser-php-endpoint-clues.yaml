  - windows
  for:
  - pe
  - dll
composite_rules:
- id: webbrowser-clsid-php-endpoint
  desc: WebBrowser class and PHP endpoint references in a PE
  crit: notable
  conf: 0.94
  scope: file
  all:
  - id: micro-behaviors/os/com/automation::webbrowser-activex-clsid
  - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-binary
  unless:
  - id: metadata/installer/product/
  - id: well-known/app/system/winutilities::winutilities-process-security-identity
