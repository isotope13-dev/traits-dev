# A PHP endpoint in a WinInet-capable binary is a useful triage lead.
# The API and URL may be used independently, so this is not a C2 verdict.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  crit: notable
  conf: 0.8

composite_rules:
  - id: wininet-php-url-combination
    desc: WinInet HTTP client embeds a cleartext PHP URL
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
