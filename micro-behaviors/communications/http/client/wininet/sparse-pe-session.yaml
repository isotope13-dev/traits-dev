defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: sparse-session-entropy-or-upx
  desc: Sparse WinINet PE with entropy/UPX markers
  crit: notable
  conf: 0.88
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
  any:
  - id: metadata/binary/section/label::upx-section
  - id: metadata/file/entropy::high-overall-entropy-70
  - id: metadata/binary/code/entropy::high-code-entropy
