defaults:
  for: [pe, dll]
  platforms: [windows]
  mbc: C0002
  attack: T1071.001

traits:
  # These APIs complete requests opened with HttpSendRequestEx. They do not
  # identify the HTTP method, so they belong to the client layer rather than
  # the POST-method directory.
  - id: http-send-request-ex-a-string
    desc: HttpSendRequestExA client API name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: HttpSendRequestExA

  - id: http-end-request-a-string
    desc: HttpEndRequestA client API name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: HttpEndRequestA
