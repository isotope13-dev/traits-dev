defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: wininet-file-process-api-profile
    desc: WinInet read, file write and process APIs
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/binary/vendor/
      - id: well-known/tool/reverse-engineering/x64dbg/
      - id: metadata/binary/framework/
    downgrade:
      any:
        - id: metadata/signed/certificate/signature::pe-signature-verified
  - id: unsigned-wininet-file-process-api-profile
    desc: Unsigned WinInet file and process API profile
    crit: notable
    conf: 0.94
    all:
      - id: wininet-file-process-api-profile
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: micro-behaviors/process/sync/mutex::global-mutex-single-instance
      - id: micro-behaviors/time/sleep/interval::sleep-dup
    unless:
      - id: metadata/binary/framework/
