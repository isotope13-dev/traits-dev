defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nsis-admin-inetc-network-context
  desc: Elevated NSIS with INetC WinINet flow
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/binary/installer/script::nsis
  - id: micro-behaviors/os/privilege/manifest::require-administrator
  - id: metadata/binary/installer/plugin::nsis-inetc-plugin
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
  any:
  - id: micro-behaviors/communications/http/post::wininet-post
  - id: micro-behaviors/communications/ftp/client::wininet-ftp-api
  - id: micro-behaviors/communications/http/authorization-header::auth-header
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/certificate/subject::glarysoft-ltd
