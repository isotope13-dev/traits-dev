defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: unsigned-wininet-file-process-create-api-profile
  desc: Unsigned WinInet, file and CreateProcess API references co-occur
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/wininet::unsigned-wininet-file-process-api-profile
  - id: micro-behaviors/process/create/exec::create-process-a
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
- id: unsigned-wininet-file-run-key-api-profile
  desc: Unsigned WinInet and file/process APIs co-occur with a Run-key path
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/wininet::unsigned-wininet-file-process-api-profile
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
