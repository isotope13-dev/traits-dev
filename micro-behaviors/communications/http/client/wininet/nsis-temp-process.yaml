# An elevated NSIS INetC flow and TEMP/process APIs are present, but no
# fetched path is bound to the process argument.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: nsis-inetc-temp-process-profile
    desc: Elevated NSIS INetC and TEMP/process clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/wininet::nsis-admin-inetc-network-context
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
    any:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/exec::shell-execute-a
      - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
    unless:
      - id: metadata/signed/platform/
