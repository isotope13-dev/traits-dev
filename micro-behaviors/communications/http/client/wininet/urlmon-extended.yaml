composite_rules:
- id: compact-urlmon-extended-api-set
  desc: Compact PE references URLMon and extended WinInet APIs
  crit: notable
  conf: 0.97
  size_min: 30000
  size_max: 90000
  all:
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
  - id: micro-behaviors/communications/http/client/urlmon::urlmon-dll-reference
  any:
  - id: micro-behaviors/communications/http/client/wininet::http-send-request-ex-a-string
  - id: micro-behaviors/communications/http/client/wininet::http-end-request-a-string
  - id: micro-behaviors/communications/http/client/wininet::obtain-user-agent-str
  needs: 2
  for:
  - pe
  platforms:
  - windows
