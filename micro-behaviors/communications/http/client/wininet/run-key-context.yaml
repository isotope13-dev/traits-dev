defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: wininet-openurl-with-run-key-reference
    desc: WinInet URL API with Run key path reference
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/communications/http/client/wininet::dynamic-wininet-api-set--internetopenurla
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/vendor/
      - id: metadata/build/generated::winmd-metadata

