defaults:
  for: [lua]
  platforms: [windows]
  crit: notable
traits:
  - id: lua-wininet-url-opener
    desc: Lua references WinInet URL opening
    conf: 0.95
    if:
      type: text
      regex: '\bInternetOpenUrl[AW]?\b'
  - id: lua-wininet-request-sender
    desc: Lua references WinInet HTTP request sending
    conf: 0.95
    if:
      type: text
      regex: '\bHttpSendRequest[AW]?\b'
