# No payload fetch or response-to-process handoff is required. This preserves
# the branch of the old rule satisfied by at least two neutral corroborators.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: wininet-temp-cmd-profile
    desc: WinINet, TEMP and CMD process clues
    crit: suspicious
    conf: 0.95
    size_max: 262144
    all:
      - id: micro-behaviors/process/create/exec::cmd-shell-via-createprocess
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
    any:
      - id: micro-behaviors/communications/http/header/custom::file-upload-headers
      - id: micro-behaviors/communications/http/post::post-string-pe
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
      - id: metadata/binary/section/ratio::compact-loader-like-layout
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
