defaults:
  for: [pe, dll]
  platforms: [windows]

# API/layout co-occurrence does not establish download, mapping of a PE,
# or execution of received bytes. Code-specific loader rules cover those.
composite_rules:
  - id: unsigned-rwx-reloc-wininet-api-profile
    desc: Unsigned RWX relocation section with WinInet APIs
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    any:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/overlay::high-entropy-overlay
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: unsigned-reloc-wininet-file-mapping-api-profile
    desc: RWX relocation section with WinInet and file-mapping APIs
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: micro-behaviors/mem/map::win32-file-mapping
      - id: metadata/binary/section/header::unsigned-writable-entry-multi-rwx-high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
