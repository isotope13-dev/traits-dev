# WinInet HTTP Client
# Low-level Windows networking capabilities
defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: internet-open
    desc: Initialize WinInet session
    conf: 0.95
    if:
      type: symbol
      regex: "^InternetOpen[AW]$"
  - id: wininet-dll-name-reference
    desc: WinInet DLL name reference
    conf: 0.72
    if:
      type: text
      exact: WININET.dll
      case_insensitive: true
    downgrade:
      any:
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: metadata/binary/vendor::is-microsoft-named
  - id: internet-connect
    desc: Connect to HTTP/FTP server via WinInet
    conf: 0.95
    if:
      type: symbol
      regex: "^InternetConnect[AW]$"
  - id: http-open-request
    desc: Open HTTP request via WinInet
    conf: 0.95
    if:
      type: symbol
      regex: "^HttpOpenRequest[AW]$"
  - id: internet-open-url
    desc: Open URL via WinInet
    conf: 0.9
    if:
      type: symbol
      regex: "^InternetOpenUrl[AW]$"
  - id: internet-check-connection
    desc: Check internet connectivity state
    conf: 0.85
    if:
      type: symbol
      regex: "^InternetCheckConnection[AW]$"
  - id: http-query-info
    desc: Query HTTP response metadata
    conf: 0.88
    if:
      type: symbol
      exact: "HttpQueryInfoW"
  - id: http-query-info-str
    desc: HttpQueryInfo API name as string
    conf: 0.9
    if:
      type: text
      regex: "^HttpQueryInfo[AW]$"
  - id: internet-read-file
    desc: Read data from internet handle
    conf: 0.95
    mbc: C0002
    attack: T1071.001
    if:
      type: symbol
      exact: "InternetReadFile"
  # Drops a URL's entry from the WinInet download cache. Updaters call it to
  # force a fresh fetch; loaders call it after staging a payload so the URL
  # leaves no record in the local cache. Either way it is a complete, named
  # cache operation an analyst wants in a diff, not a fragment — notable.
  - id: delete-url-cache-entry
    desc: Deletes a WinInet URL cache entry
    conf: 0.9
    if:
      # `type: symbol` like its Find* siblings below, and the A/W suffix is
      # optional: wininet exports a plain `DeleteUrlCacheEntry` alongside the
      # decorated pair, and it is the plain one import tables carry — the old
      # anchored text form matched neither the import nor the sibling style.
      type: symbol
      regex: "^DeleteUrlCacheEntry[AW]?$"
  - id: find-first-url-cache-entry
    desc: Begin WinInet URL cache enumeration
    conf: 0.9
    if:
      type: symbol
      regex: "^FindFirstUrlCacheEntry[AW]$"
  - id: find-next-url-cache-entry
    desc: Continue WinInet URL cache enumeration
    conf: 0.9
    if:
      type: symbol
      regex: "^FindNextUrlCacheEntry[AW]$"
  - id: http-send-request
    desc: Send HTTP request via WinInet
    conf: 0.95
    if:
      type: symbol
      regex: "^HttpSendRequest[AW]$"
  - id: internet-close-handle-str
    desc: InternetCloseHandle API name
    conf: 0.9
    if:
      type: text
      exact: InternetCloseHandle
  - id: internet-set-option
    desc: Adjust WinInet session or request options
    conf: 0.9
    if:
      type: symbol
      regex: "^InternetSetOption[AW]$"
  - id: obtain-user-agent-str
    desc: ObtainUserAgentString API name
    conf: 0.85
    if:
      type: text
      exact: ObtainUserAgentString
  - id: wininet-library-encoded-reference
    desc: Encoded WinInet library reference
    conf: 0.95
    if:
      type: encoded
      encoding: [xor, stack]
      exact: wininet
composite_rules:
  - id: wininet-http-api-cluster
    desc: WinInet session and request API cluster
    conf: 0.9
    all:
      - id: internet-open
    any:
      - id: http-send-request
      - id: http-open-request
      - id: internet-connect
      - id: internet-read-file
      - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
      - id: internet-close-handle-str
      - id: http-query-info-str
      - id: internet-set-option
      - id: obtain-user-agent-str
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: well-known/tool/development/toolchain/microsoft-csharp-compiler/
        - id: metadata/package/versioning/scheme::pe-companyname-field
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: wininet-http-request-strings
    desc: WinInet HTTP request APIs as strings
    conf: 0.9
    all:
      - id: wininet-dll-name-reference
      - id: http-open-request
      - id: http-send-request
    any:
      - id: http-query-info-str
      - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
      - id: internet-connect
      - id: internet-close-handle-str
    downgrade:
      any:
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: metadata/binary/symbols/count::many-imports
  - id: wininet-http-flow
    desc: WinInet request and response workflow
    conf: 0.9
    all:
      - id: internet-open
    any:
      - id: http-open-request
      - id: internet-open-url
      - id: internet-connect
      - id: http-send-request
      - id: internet-read-file
      - id: http-query-info
    needs: 2
  - id: wininet-cache-cleanup-after-fetch
    desc: WinInet download with cache cleanup
    conf: 0.92
    all:
      - id: delete-url-cache-entry
    any:
      - id: internet-open-url
      - id: internet-read-file
  - id: url-cache-enumeration
    desc: WinInet URL cache enumeration workflow
    conf: 0.91
    all:
      - id: find-first-url-cache-entry
      - id: find-next-url-cache-entry
