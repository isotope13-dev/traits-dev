defaults:
  crit: notable
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: internet-open
  desc: Initialize WinInet session
  conf: 0.95
  if:
    type: symbol
    regex: ^InternetOpen[AW]$
- id: internet-connect
  desc: Connect to HTTP/FTP server via WinInet
  conf: 0.95
  if:
    type: symbol
    regex: ^InternetConnect[AW]$
- id: http-open-request
  desc: Open HTTP request via WinInet
  conf: 0.95
  if:
    type: symbol
    regex: ^HttpOpenRequest[AW]$
- id: internet-open-or-request
  desc: InternetOpen or HttpOpenRequest API use
  conf: 0.8
  if:
    type: symbol
    regex: ^(HttpOpenRequest[AW]|InternetOpen[AW])$
- id: internet-open-url
  desc: Open URL via WinInet
  conf: 0.9
  if:
    type: symbol
    regex: ^InternetOpenUrl[AW]$
- id: internet-check-connection
  desc: Check internet connectivity state
  conf: 0.85
  if:
    type: symbol
    regex: ^InternetCheckConnection[AW]$
- id: http-query-info
  desc: Query HTTP response metadata
  conf: 0.88
  if:
    type: symbol
    exact: HttpQueryInfoW
- id: http-query-info-str
  desc: HttpQueryInfo API name as string
  conf: 0.9
  if:
    type: text
    regex: ^HttpQueryInfo[AW]$
- id: internet-read-file
  desc: Read data from internet handle
  conf: 0.95
  mbc: C0002
  attack: T1071.001
  if:
    type: symbol
    exact: InternetReadFile
- id: delete-url-cache-entry
  desc: Deletes a WinInet URL cache entry
  conf: 0.9
  if:
    type: symbol
    regex: ^DeleteUrlCacheEntry[AW]?$
- id: find-first-url-cache-entry
  desc: Begin WinInet URL cache enumeration
  conf: 0.9
  if:
    type: symbol
    regex: ^FindFirstUrlCacheEntry[AW]$
- id: find-next-url-cache-entry
  desc: Continue WinInet URL cache enumeration
  conf: 0.9
  if:
    type: symbol
    regex: ^FindNextUrlCacheEntry[AW]$
- id: http-send-request
  desc: Send HTTP request via WinInet
  conf: 0.95
  if:
    type: symbol
    regex: ^HttpSendRequest[AW]$
- id: internet-close-handle-str
  desc: InternetCloseHandle API name
  conf: 0.9
  if:
    type: text
    exact: InternetCloseHandle
- id: internet-set-option
  desc: Adjust WinInet session or request options
  conf: 0.9
  if:
    type: symbol
    regex: ^InternetSetOption[AW]$
- id: obtain-user-agent-str
  desc: ObtainUserAgentString API name
  conf: 0.85
  if:
    type: text
    exact: ObtainUserAgentString
- id: wininet-library-encoded-reference
  desc: Encoded WinInet library reference
  conf: 0.95
  if:
    type: encoded
    encoding:
    - xor
    - stack
    exact: wininet
composite_rules:
- id: wininet-session-initiation
  desc: WinInet session initialized directly or by resolved API name
  conf: 0.93
  any:
  - id: internet-open
  - id: micro-behaviors/communications/http/dynamic::internet-open-ansi-string
- id: wininet-http-api-cluster
  desc: WinInet session and request API cluster
  conf: 0.9
  all:
  - id: wininet-session-initiation
  any:
  - id: http-send-request
  - id: http-open-request
  - id: internet-connect
  - id: internet-read-file
  - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
  - id: internet-close-handle-str
  - id: http-query-info-str
  - id: internet-set-option
  - id: obtain-user-agent-str
  needs: 2
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: wininet-http-request-strings
  desc: WinInet request API and DLL references
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/library::wininet-dll-name-reference
  - id: http-open-request
  - id: http-send-request
  any:
  - id: http-query-info-str
  - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
  - id: internet-connect
  - id: internet-close-handle-str
- id: wininet-session-request-api-set
  desc: WinInet session and request API references
  conf: 0.9
  all:
  - id: internet-open
  any:
  - id: http-open-request
  - id: internet-open-url
  - id: internet-connect
  - id: http-send-request
  - id: internet-read-file
  - id: http-query-info
  needs: 2
- id: wininet-cache-cleanup-after-fetch
  desc: WinInet download with cache cleanup
  conf: 0.92
  all:
  - id: delete-url-cache-entry
  any:
  - id: internet-open-url
  - id: internet-read-file
- id: url-cache-enumeration
  desc: WinInet URL cache enumeration workflow
  conf: 0.91
  all:
  - id: find-first-url-cache-entry
  - id: find-next-url-cache-entry
- id: internet-open-url-php-endpoint-reference
  desc: WinInet URL API and PHP endpoint reference co-occur
  conf: 0.9
  all:
  - id: internet-open-url
  - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
