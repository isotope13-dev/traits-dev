defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: unsigned-wininet-process-api-profile
  desc: Unsigned PE with WinInet and process-creation APIs
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
  - id: metadata/signature/absent::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/process/create/exec::child-process-creation-evidence
  - id: micro-behaviors/process/create/exec::create-process-api-name
  unless:
  - id: metadata/installer/product/
  - id: metadata/lang/compiled::autoit-compiled-script
