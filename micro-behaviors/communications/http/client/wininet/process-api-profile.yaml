defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: unsigned-wininet-process-api-profile
  desc: Unsigned PE with WinInet and process-creation APIs
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/process/create/spawn::child-process-creation-api
  - id: micro-behaviors/process/create/launch::create-process-api-name
  unless:
  - id: metadata/binary/installer/family/
  - id: well-known/app/
  - id: well-known/tool/
  - id: well-known/lib/
  # The AutoIt interpreter stub imports WinInet and CreateProcess for every
  # compiled script, so these imports say nothing about the script's intent.
  - id: metadata/lang/compiled::autoit-compiled-script
