defaults:
  platforms: [windows]
  for: [pe]


composite_rules:
  - id: wininet-com-sparse-import-profile
    desc: WinInet, COM and sparse import clues
    crit: suspicious
    conf: 0.96
    size_min: 32768
    size_max: 49152
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/os/com/runtime::co-initialize
    any:
      - id: micro-behaviors/dylib/lookup::get-module-handle-ansi
      - id: micro-behaviors/os/registry/close::reg-close-key
      - id: micro-behaviors/fs/path/location::shell-get-folder-path
      - id: micro-behaviors/ui/window/control::set-parent-api
    needs: 3
    unless:
      - id: metadata/binary/symbols/count::many-imports-20
