# Imports and embedded bytes do not bind an HTTP response to a staged image.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: unsigned-wininet-embedded-header-api-profile
  desc: Unsigned WinInet APIs beside DOS-header bytes
  crit: notable
  conf: 0.97
  size_min: 200000
  size_max: 800000
  all:
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/communications/http/client/wininet::internet-open-url
  - id: micro-behaviors/communications/http/client/wininet::internet-read-file
  - id: micro-behaviors/process/create/thread::create-thread
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
