defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.94
traits:
  - id: remote-manifest-json-url
    desc: Remote manifest JSON URL
    if:
      type: text
      regex: 'https://[^"''\s]{1,100}/manifest[-\w]*\.json'
  - id: manifest-designer-url-field
    desc: Reads designer URL from manifest-like object
    if:
      type: text
      substr: '?.designer?.url'
  - id: fetch-call
    desc: Calls fetch
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: (identifier) @function)
          (#eq? @function "fetch"))
composite_rules:
  - id: manifest-script-loader-cooccurrence
    desc: Remote manifest and dynamic script loader
    crit: suspicious
    scope: file
    all:
      - id: remote-manifest-json-url
      - id: manifest-designer-url-field
      - id: fetch-call
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
