# statdynamic.com/lib/crypta.js is a documented drive-by Monero miner
# library: Symantec (Jan 2019) traced Microsoft Store cryptojacking apps to
# this exact URL, decoded the encrypted library, and found a CoinHive
# variant mining with a hardcoded attacker key; the MinerAlert study likewise
# cites this script tag as a CryptoLoot drive-by indicator. The distributor
# host is the IOC axis (it generalizes across future path changes on the
# same host); the /lib/crypta.js library identity is the sibling
# crypta-lib-script-src atom. Neither alone convicts: the objectives
# composite requires both.
defaults:
  platforms: [windows, unix]
  attack: T1105
traits:
  - id: statdynamic-script-src
    desc: Script source hosted on statdynamic distributor
    crit: notable
    conf: 0.97
    for: [html]
    if:
      type: text
      regex: '(?i)<script[^>]{0,40}\bsrc\s*=\s*["'']?(https?:)?//statdynamic\.com/'
      exclude_html_comments: true
