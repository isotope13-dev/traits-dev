defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: crypta-lib-on-scripted-page
    desc: Page loads crypta.js alongside a relative script
    crit: notable
    conf: 0.95
    for: [html]
    all:
      - id: micro-behaviors/communications/http/client/script::crypta-lib-script-src
      - id: micro-behaviors/communications/http/client/script::relative-script-element-source
