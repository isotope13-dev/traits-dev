defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189
  crit: notable
traits:
  # A quoted attribute value that closes a raw-text or RCDATA element
  # (title, textarea, style, xmp) and then opens a script element. Markup
  # inside those elements is inert in the HTML tokenizer, so a matching end
  # tag is the exact parser transition a stored value needs before its script
  # tag can execute wherever a template interpolates it inside such an
  # element (store names in <title>, comments in <textarea>). Any attribute
  # name: templates echo the same stored value into alt, title, value, or
  # content. Escaped (&lt;) and commented text does not match. Quoted here,
  # the text is inert; it records the raw-text escape payload.
  - id: attribute-value-rawtext-closer-script
    desc: Attribute value escapes raw-text to script
    conf: 0.94
    if:
      type: text
      regex: '(?i)\s[\w-]{2,20}\s*=\s*["''][^"'']{0,200}</(title|textarea|style|xmp)\s*>\s*<script\b'
      exclude_html_comments: true
  # Second half of the same payload: the script closer reopens a raw-text or
  # RCDATA element and the attribute quote closes right after it. Reopening
  # the escaped element repairs the host markup so the page keeps rendering
  # after the injected tag; the quote that ends the attribute right after
  # it pins the text inside the value, so title text that merely starts
  # with a quote in an ordinary head does not match.
  - id: attribute-value-script-rawtext-reopen
    desc: Script closer reopens raw-text element in value
    conf: 0.9
    if:
      type: text
      regex: '(?i)</script\s*>\s*<(title|textarea|style|xmp)\s*>\s*["''][\s/>]'
      exclude_html_comments: true
