defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1105
composite_rules:
  # The first leg already implies the second, so this adds no evidence over
  # one remote <script> placed straight after </head> -- a layout real sites
  # ship (gumbo-parser's xinhua.html benchmark snapshot). Injection needs
  # more than placement; it stays notable until a composite supplies it.
  - id: post-head-remote-script-clues
    desc: Post-head remote script source clues
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/script::post-head-remote-script-source
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
