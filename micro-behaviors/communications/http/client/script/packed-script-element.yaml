# Dean Edwards Packer replaces every identifier with a base-N index and keeps
# the words in a pipe-separated table, so the packed `createElement('script')`
# and `.src=` exist only as table entries. Requiring all three words in one
# table ending in `.split('|')` keeps the claim to packed script loading.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1105
traits:
  - id: packer-table-script-element-source
    desc: Packer table names script element and src
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\|createElement\|[\w|]{0,40}\bscript\|[\w|]{0,40}\bsrc\|[^'']{0,600}''\.split'
