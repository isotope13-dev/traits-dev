defaults:
  for: [javascript, typescript, html]
  platforms: [unix, windows]
  conf: 0.95
traits:
  - id: jsdelivr-floating-major-script
    desc: Script loads floating jsDelivr npm version
    crit: suspicious
    if:
      type: text
      regex: '<script\b[^>]{0,99}src=["'']https://cdn\.jsdelivr\.net/npm/[^"'' ]{1,99}@(latest|[0-9]+)["'']'
