defaults:
  for: [javascript, typescript, html]
  platforms: [unix, windows]
  conf: 0.95
traits:
  - id: jsdelivr-floating-major-script
    desc: Script loads floating jsDelivr npm version
    # Webviews and HTML exports routinely pin only the major (chart.js@4,
    # tailwind@3); an unpinned CDN tag is a hygiene gap, not intent.
    crit: notable
    if:
      type: text
      regex: '<script\b[^>]{0,99}src=["'']https://cdn\.jsdelivr\.net/npm/[^"'' ]{1,99}@(latest|[0-9]+)["'']'
