defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: opaque-token-remote-script-clues
    desc: External script uses an opaque token path
    crit: notable
    conf: 0.96
    attack: T1105,T1189
    for: [html]
    all:
      - id: micro-behaviors/communications/http/client/script::opaque-token-script-element-source
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
  # A Base64 script element plus dynamic dispatch indicates concealed script
  # markup, but does not establish remote loading or malicious injection: sites
  # also store consent-blocked scripts this way.
