defaults:
  platforms: [windows, unix]
  for: [html, php]
  crit: notable
  conf: 0.88

traits:
  - id: script-src-ad-label
    desc: Script source contains an advertising label
    conf: 0.88
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<script\b[^>]{0,160}\bsrc\s*=\s*["''][^"'']{0,200}\b(showAd|ads)\b'
  - id: external-script-element-load
    desc: Loads external script element
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<script\b[^>]{0,160}\bsrc\s*=\s*["'']?(https?:)?//[^/"''\s>]'
  - id: remote-script-hidden-dot-directory
    desc: Script loads JS from a remote dot-folder
    crit: notable
    conf: 0.85
    for: [html]
    if:
      type: text
      regex: '<script\b[^>]{0,200}\bsrc\s*=\s*["'']https?://[^"''\s]{1,200}/\.[\w-]+/[^"''\s]{0,200}\.js'
    unless:
      - id: remote-script-framework-dot-directory
      - id: remote-script-hosting-dot-directory

  # Dot-folders that site generators, hosting platforms and RUM agents
  # publish under by design.
  - id: remote-script-framework-dot-directory
    desc: Script loads from a framework build dot-folder
    crit: component
    for: [html]
    if:
      type: text
      regex: '\bsrc\s*=\s*["'']https?://[^"''\s]{1,200}/\.(next|nuxt|vuepress|output)/'

  - id: remote-script-hosting-dot-directory
    desc: Script loads from a hosting-platform dot-folder
    crit: component
    for: [html]
    if:
      type: text
      regex: '\bsrc\s*=\s*["'']https?://[^"''\s]{1,200}/\.(well-known|rum|netlify|vercel)/'
  - id: base64-encoded-script-element
    desc: Base64 string encodes an HTML script element
    conf: 0.94
    for: [html, php, javascript, typescript]
    if:
      type: text
      regex: '["''](PHNjcmlwd[CD]|xzY3JpcHQ|8c2NyaXB0)[A-Za-z0-9+/=]{16,}={0,2}["'']'
