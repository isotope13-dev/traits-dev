defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
composite_rules:
  - id: remote-script-vbscript-block-clues
    desc: VBScript block and remote script source clues
    crit: notable
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/communications/http/client/script::remote-script-element-source
    unless:
      - id: metadata/path/directory::example-directory-component
