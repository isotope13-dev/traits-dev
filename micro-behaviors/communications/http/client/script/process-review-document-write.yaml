defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, text]
traits:
  - id: document-write-remote-script
    desc: Writes remote script tag into document
    crit: notable
    conf: 0.98
    if:
      type: text
      case_insensitive: true
      regex: 'document\.write\s*\(["'']<script\s+src=["'']https?://'
