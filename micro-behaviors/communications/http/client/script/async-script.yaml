defaults:
  platforms: [windows, unix]
  for: [html, php]
  crit: notable
  conf: 0.88

traits:
  - id: async-external-script-element
    desc: Loads asynchronous external script
    conf: 0.92
    if:
      type: text
      regex: '<script[^>]{0,160}\basync\b[^>]{0,160}\bsrc\s*=\s*["'']https?://'
  - id: async-after-src-script-element
    desc: Async attribute follows remote script src
    conf: 0.92
    # Attribute-order twin of async-external-script-element: `<script
    # src="..." async>` is the same non-blocking load with the attributes
    # swapped. Mass injectors emit this order; the async-first spelling
    # misses them entirely.
    if:
      type: text
      regex: '<script[^>]{0,120}\bsrc\s*=\s*["'']https?://[^>]{0,120}\basync\b'
