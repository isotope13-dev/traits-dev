# A page reads the iOS version from the User-Agent and, nearby, injects a
# script element. Exploit-kit landings pick a chain this way; a compat shim
# that loads a polyfill for old iOS looks the same, so it is suspicious, not
# hostile. Proximity shows co-location, not that the version gates the load.
# The window is lines, not bytes: a landing's UA parse and its stage
# injection are often a few hundred lines apart in one inline script.
defaults:
  platforms: [ios]
  for: [html, javascript, typescript]
  attack: T1189

composite_rules:
  - id: ios-version-parse-script-injection
    desc: Injects a script near iOS version parsing
    crit: suspicious
    conf: 0.85
    near_lines: 300
    all:
      - id: micro-behaviors/os/sysinfo/platform/version::ios-user-agent-version-parse
    any:
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/communications/http/client/script::js-remote-script-element
      - id: public-ipv4-script-src-assignment
