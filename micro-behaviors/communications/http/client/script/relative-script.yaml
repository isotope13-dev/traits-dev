defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.92

traits:
  - id: relative-script-element-source
    desc: Script element references a local path
    if:
      type: text
      # Bare paths such as _static/theme.js are relative too. Requiring a
      # non-slash after the optional root slash excludes //remote/script.js.
      regex: '(?i)<script\b[^>]{0,160}\ssrc\s*=\s*["'']/?[.\w-][./\w?=&%#-]{0,158}["'']'
      exclude_html_comments: true
