# Script code fetched from a literal public IPv4 host. Sites serve script from
# named origins and CDNs; a bare routable address is how injected implants and
# exploit-kit stages are usually hosted. Dev servers and appliances do it too,
# so this stays a capability. Private, loopback, link-local and CGNAT ranges
# are excluded: an intranet dashboard loading from 192.168.x is ordinary.
defaults:
  platforms: [windows, unix, ios]
  for: [html, javascript, typescript]
  attack: T1189
  crit: suspicious
  conf: 0.9

traits:
  - id: public-ipv4-script-element-source
    desc: Loads script tag from public IPv4 host
    for: [html]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<script[^>]{0,200}\bsrc\s*=\s*["'']?https?://([0-9]{1,3}\.){3}[0-9]{1,3}[:/"''\s>]'
    not:
      - regex: '//(0|10|127)\.'
      - regex: '//192\.168\.'
      - regex: '//172\.(1[6-9]|2[0-9]|3[01])\.'
      - regex: '//169\.254\.'
      - regex: '//100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.'

  # A `.js` path keeps image and media `src` assignments out.
  - id: public-ipv4-script-src-assignment
    desc: Assigns public IPv4 .js URL to src
    if:
      type: text
      regex: '\.src\s*=\s*["'']https?://([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]+)?/[^"'']{0,160}\.js\b'
    not:
      - regex: '//(0|10|127)\.'
      - regex: '//192\.168\.'
      - regex: '//172\.(1[6-9]|2[0-9]|3[01])\.'
      - regex: '//169\.254\.'
      - regex: '//100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.'

composite_rules:
  # One role for consumers counting distinct techniques: a page with both a
  # static and a scripted public-IP load is still one observation.
  - id: public-ipv4-script-source
    desc: Script source is a public IPv4 host
    crit: component
    conf: 1.0
    any:
      - id: public-ipv4-script-element-source
      - id: public-ipv4-script-src-assignment
