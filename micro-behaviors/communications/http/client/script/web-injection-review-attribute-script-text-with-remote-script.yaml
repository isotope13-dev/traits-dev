defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: attribute-script-text-with-remote-script
    desc: Attribute script text and remote script clues
    crit: suspicious
    conf: 0.97
    attack: T1189,T1105
    for: [html]
    all:
      - id: micro-behaviors/communications/http/client/resource::attribute-value-script-tag
      - id: micro-behaviors/communications/http/client/script::external-script-element-load
