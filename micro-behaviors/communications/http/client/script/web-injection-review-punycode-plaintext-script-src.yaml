defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
composite_rules:
  - id: punycode-plaintext-script-src
    desc: Cleartext and punycode script source clues
    crit: notable
    conf: 0.96
    near_bytes: 200
    all:
      - id: micro-behaviors/communications/http/client/script::punycode-script-src
      - id: micro-behaviors/communications/http/client/script::plaintext-http-script-element-source
  # The frame sits outside the document and is visibility:hidden, so the
  # visitor never sees the remote document the browser still loads.
