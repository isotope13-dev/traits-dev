defaults:
  for: [html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.92

traits:
  - id: remote-script-floating-git-branch
    desc: Loads script from mutable Git branch
    if:
      type: text
      exclude_html_comments: true
      regex: '<script\b[^>]{0,180}\bsrc\s*=\s*["''][^"'']{0,120}@(main|master)/'
