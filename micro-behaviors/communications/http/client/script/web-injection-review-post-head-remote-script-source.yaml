defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1105
traits:
  - id: post-head-remote-script-source
    desc: Remote script source follows HTML head
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)</head>\s*<script\b[^>]{0,300}?\bsrc\s*=\s*["'']?https?://'
      exclude_html_comments: true
