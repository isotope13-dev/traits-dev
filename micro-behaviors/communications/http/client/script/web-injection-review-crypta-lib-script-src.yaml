defaults:
  platforms: [windows, unix]
  attack: T1105
traits:
  - id: crypta-lib-script-src
    desc: Script src loads lib crypta.js
    crit: notable
    conf: 0.96
    for: [html]
    if:
      type: text
      regex: '(?i)<script[^>]{0,40}\bsrc\s*=\s*["'']?(https?:)?//[^"''>\s]{1,60}/lib/crypta\.js'
      exclude_html_comments: true
