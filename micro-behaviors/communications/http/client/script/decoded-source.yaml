# Bind the decoded variable to the actual script source, rather than pooling
# an unrelated binary-text decoder with a normal loader elsewhere in a bundle.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.96
traits:
  - id: decoded-url-array-script-source
    desc: Script source indexes decoded URL candidates
    if:
      type: tree-sitter
      query: |
        ((_ (variable_declarator name: (identifier) @url
              value: (call_expression) @decode)
            (variable_declarator name: (identifier) @urls
              value: (array . (identifier) @first))
            (variable_declarator value: (function_expression
              body: (statement_block
                (try_statement body: (statement_block
                  (variable_declaration
                    (variable_declarator name: (identifier) @script
                      value: (call_expression function: (member_expression
                        property: (property_identifier) @create)
                        arguments: (arguments . (string) @kind .))))
                  (expression_statement (assignment_expression
                    left: (member_expression object: (identifier) @target
                      property: (property_identifier) @src)
                    right: (subscript_expression object: (identifier) @sources)))))))))
          (#eq? @url @first) (#eq? @urls @sources) (#eq? @script @target)
          (#eq? @create "createElement") (#match? @kind "^['\"]script['\"]$")
          (#eq? @src "src")
          (#match? @decode "^new\\s+TextDecoder\\(")
          (#match? @decode "\\.decode\\("))
  - id: decoded-variable-script-source
    desc: Script source uses decoded text variable
    if:
      type: tree-sitter
      query: |
        ((_ (_ (variable_declarator name: (identifier) @url
              value: (call_expression) @decode))
            (_ (variable_declarator name: (identifier) @script
              value: (call_expression function: (member_expression
                property: (property_identifier) @create)
                arguments: (arguments . (string) @kind .))))
            (expression_statement (assignment_expression
              left: (member_expression object: (identifier) @target
                property: (property_identifier) @src)
              right: (identifier) @value)))
          (#eq? @url @value) (#eq? @script @target)
          (#eq? @create "createElement") (#match? @kind "^['\"]script['\"]$")
          (#eq? @src "src")
          (#match? @decode "^new\\s+TextDecoder\\(")
          (#match? @decode "\\.decode\\("))
composite_rules:
  - id: decoded-text-script-source
    desc: Assigns decoded text to a script source
    any:
      - id: decoded-url-array-script-source
      - id: decoded-variable-script-source
