defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
composite_rules:
  - id: authenticated-periodic-http-profile
    desc: HTTP authentication, scheduling, and serialization references
    crit: notable
    conf: 0.7
    all:
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
      - id: micro-behaviors/time/schedule/interval::go-time-ticker-symbol
      - id: micro-behaviors/communications/http/authorization-header::binary-auth-header-references
    any:
      - id: metadata/import/go/encoding/base64
      - id: micro-behaviors/data/serialize/json::encoding-json-import
    unless:
      - id: metadata/binary/layout/size::massive-executable
      - id: metadata/package/testing/harness/unit/
