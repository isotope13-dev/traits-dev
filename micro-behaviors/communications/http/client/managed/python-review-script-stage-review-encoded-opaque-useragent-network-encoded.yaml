---
defaults:
  platforms:
  - windows
  for:
  - powershell
traits:
- id: encoded-stage-webclient-constructor
  desc: Encoded source constructs a .NET WebClient
  crit: notable
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: "(?i)New-Object\\s+System\\.Net\\.WebClient"
- id: encoded-stage-useragent-header-use
  desc: Encoded source uses $userAgent as HTTP header
  crit: notable
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: (?i)Headers\.Add\(\s*["']User-Agent["']\s*,\s*\$userAgent\s*\)
