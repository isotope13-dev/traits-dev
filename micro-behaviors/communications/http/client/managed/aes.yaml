defaults:
  platforms: [windows]
  for: [pe, dll]
  mbc: B0025
composite_rules:
  # Crypto leg: RijndaelManaged atoms sometimes miss obfuscated #Strings heaps
  # even when CreateEncryptor/CreateDecryptor fire; accept those as AES evidence.
  - id: dotnet-aes-crypto-evidence
    desc: .NET AES/Rijndael crypto evidence
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-create-encryptor-raw
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
    needs: 1
  - id: dotnet-http-client-with-aes
    desc: .NET HTTP client with AES/Rijndael
    crit: notable
    conf: 0.9
    all:
      - id: dotnet-aes-crypto-evidence
    any:
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::soap-http-client-protocol
    needs: 1
