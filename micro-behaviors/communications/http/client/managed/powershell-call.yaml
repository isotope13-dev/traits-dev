defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.95

traits:
  - id: powershell-downloadstring-call
    desc: PowerShell calls a DownloadString method
    size_max: 262144
    if:
      type: tree-sitter
      query: |
        ((invokation_expression (member_name) @method)
        (#match? @method "(?i)^DownloadString$"))
