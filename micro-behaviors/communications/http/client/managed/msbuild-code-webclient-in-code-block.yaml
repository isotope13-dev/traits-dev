defaults:
  platforms: [windows]
  for: [xml]
traits:
  - id: msbuild-code-webclient-single
    desc: Inline MSBuild code references WebClient
    crit: notable
    if:
      type: value
      path: Project.UsingTask.Task.Code
      regex: '(?i)\bWebClient\b'
  - id: msbuild-code-webclient-array
    desc: Inline MSBuild code references WebClient
    crit: notable
    if:
      type: value
      path: Project.UsingTask[*].Task.Code
      regex: '(?i)\bWebClient\b'
composite_rules:
  - id: msbuild-code-webclient-in-code-block
    desc: MSBuild code block references WebClient
    crit: notable
    any:
      - id: msbuild-code-webclient-single
      - id: msbuild-code-webclient-array
