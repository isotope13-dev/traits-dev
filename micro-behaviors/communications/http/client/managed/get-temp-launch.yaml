# These API references do not link an HTTP response to a file or launch.
# Reviewed GetAsync results are discarded; launch settings serve other actions.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: httpclient-get-temp-launch-references
  desc: HttpClient GET, temp and launch-setting refs
  crit: notable
  conf: 0.98
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/communications/http/client/managed::httpclient
  - id: micro-behaviors/communications/http/get::getasync
  - id: micro-behaviors/fs/path/temp::dotnet-gettemppath-token
  - id: metadata/binary/symbols/name/token::dotnet-processstartinfo-name
  - id: micro-behaviors/process/create/flags::use-shell-execute-property
  any:
  - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
  - id: micro-behaviors/fs/file/handle::dotnet-filestream-type-reference

