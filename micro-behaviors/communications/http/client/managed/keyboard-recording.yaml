# These file-scoped references do not bind recorded input to an HTTP send.
# In particular, placeholder builds can disable every upload path.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-keyboard-recording-webclient-references
    desc: Keyboard record and WebClient upload API co-occurrence
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/symbols/name/token::dotnet-append-method-name
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-low-level-keyboard-hook-const
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/window/hook::windows-hook-chain-api-cluster
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
      - id: micro-behaviors/hardware/input/keyboard/label::keylog-record-label
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
      - id: webclient
      - id: uploadstring
    unless:
      - id: metadata/signed/platform/
