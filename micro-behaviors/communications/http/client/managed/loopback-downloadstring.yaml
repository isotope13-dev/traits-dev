defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: loopback-downloadstring-url
    desc: DownloadString call text with loopback HTTP URL
    crit: notable
    conf: 0.94
    size_min: 512
    size_max: 50000000
    if:
      type: text
      regex: '(?i)downloadstring\s*\(\s*[''"]https?://(127\.0\.0\.1|localhost)[/:''"]'
