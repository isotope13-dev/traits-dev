defaults:
  platforms: [windows]
  for: [xml]
traits:
  - id: msbuild-code-httpclient-single
    desc: Inline MSBuild code references HttpClient
    crit: notable
    if:
      type: value
      path: Project.UsingTask.Task.Code
      regex: '(?i)\bHttpClient\b'
  - id: msbuild-code-httpclient-array
    desc: Inline MSBuild code references HttpClient
    crit: notable
    if:
      type: value
      path: Project.UsingTask[*].Task.Code
      regex: '(?i)\bHttpClient\b'
composite_rules:
  - id: msbuild-code-httpclient-in-code-block
    desc: MSBuild code block references HttpClient
    crit: notable
    any:
      - id: msbuild-code-httpclient-single
      - id: msbuild-code-httpclient-array
