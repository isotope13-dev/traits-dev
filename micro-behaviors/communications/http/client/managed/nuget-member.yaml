# A package member with HTTP and launch API references is not a hidden payload.
defaults:
  platforms: [windows]
  for: [nupkg, pe, dll]

composite_rules:
  - id: nuget-member-httpclient-temp-launch-references
    desc: NuGet library HTTP and launch-setting refs
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
      - id: micro-behaviors/communications/http/client/managed::httpclient-get-temp-launch-references
