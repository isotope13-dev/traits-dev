# Managed HTTP upload references used when structured code-call facts are not
# available for a compiled PE. This describes the client and payload scaffold;
# source-to-send objectives provide the theft context.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  crit: notable
  conf: 0.9

composite_rules:
  - id: dotnet-multipart-archive-post
    desc: Multipart archive POST client references
    all:
      - id: httpclient
      - id: multipart-form-data-content
      - id: micro-behaviors/communications/http/post::postasync
      - id: micro-behaviors/data/archive/create/zip::dotnet-create-from-directory

  # Preserve the existing HttpWebRequest branch while accepting the more
  # explicit HttpClient multipart archive path used by managed binaries.
  - id: dotnet-http-request-or-multipart-archive-post
    desc: Http request or multipart archive POST references
    any:
      - id: httpwebrequest
      - id: dotnet-multipart-archive-post
