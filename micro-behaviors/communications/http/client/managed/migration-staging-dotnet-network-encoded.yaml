---
defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - pe
  - dll
composite_rules:
- id: dotnet-encoded-url-xor-system-profile
  desc: Encoded URL, XOR and system indicators
  crit: suspicious
  conf: 0.96
  for:
  - dll
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/communications/url/encoded::binary-base64-http-url
  - id: micro-behaviors/communications/http/client/managed::httpclient
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::native-byte-xor-loop
  any:
  - id: micro-behaviors/process/fd/stdio::dotnet-child-stdio-config-references
  - id: micro-behaviors/process/fd/stdio::dotnet-stdout-redirection-reference
  - id: micro-behaviors/process/identity/query/reference::user-info
  unless:
  - id: metadata/signature/verified/platform::microsoft
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
  downgrade:
    any:
    - id: well-known/dual-use/tunnel/netch::netch-executable
    - id: well-known/app/media/subtitleedit/
