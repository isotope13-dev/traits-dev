defaults:
  crit: notable
  conf: 0.8
  for:
  - pe
  - dll
  - csharp
  - powershell
  platforms:
  - windows
traits:
- id: httpclient
  desc: System.Net.Http.HttpClient type reference
  conf: 0.82
  if:
    type: text
    # Require the qualified .NET type or an extracted standalone type token.
    # Native clients also use HttpClient in diagnostic prose.
    regex: '\bSystem\.Net\.Http\.HttpClient\b|^HttpClient$'
  unless:
  - id: well-known/game/mod::bedrockboot-source-repository
- id: multipart-form-data-content
  desc: .NET multipart form-data content type reference
  conf: 0.9
  if:
    type: text
    word: MultipartFormDataContent
- id: readasbytearrayasync
  desc: HttpClient reads an HTTP response as bytes
  crit: notable
  conf: 0.88
  attack: T1105
  if:
    type: text
    word: ReadAsByteArrayAsync
  unless:
  - id: well-known/game/mod::bedrockboot-source-repository
- id: server-certificate-validation-callback-accept-all
  desc: .NET client accepts every server certificate
  crit: suspicious
  conf: 0.97
  attack: T1553
  if:
    type: text
    regex: '(?is)ServerCertificateCustomValidationCallback\s*=\s*\{\s*\$?true\s*;?\s*\}'
- id: readasstringasync
  desc: .NET asynchronous HTTP response body read
  crit: notable
  conf: 0.84
  if:
    type: text
    word: ReadAsStringAsync
  unless:
  - id: well-known/game/mod::bedrockboot-source-repository
- id: default-request-headers
  desc: DefaultRequestHeaders accessor
  crit: notable
  conf: 0.8
  if:
    type: text
    word: get_DefaultRequestHeaders
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: user-agent-accessor
  desc: HttpClient UserAgent accessor
  crit: notable
  conf: 0.8
  if:
    type: text
    word: get_UserAgent
- id: httpwebrequest
  desc: References the .NET HttpWebRequest class
  conf: 0.82
  if:
    type: text
    substr: HttpWebRequest
- id: unicode-delimited-httpweb-prefix
  desc: Unicode-delimited Htt prefix fragment
  crit: component
  conf: 0.96
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'H\P{ASCII}[\P{ASCII}A-Za-z]{7,23}t\P{ASCII}[\P{ASCII}A-Za-z]{7,23}t'
- id: unicode-delimited-request-prefix
  desc: Unicode-delimited Req prefix fragment
  crit: component
  conf: 0.96
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'R\P{ASCII}[\P{ASCII}A-Za-z]{7,23}e\P{ASCII}[\P{ASCII}A-Za-z]{7,23}q'
- id: unicode-delimited-getresponse-prefix
  desc: Unicode-delimited Get prefix fragment
  crit: component
  conf: 0.94
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'G\P{ASCII}[\P{ASCII}A-Za-z]{7,23}e\P{ASCII}[\P{ASCII}A-Za-z]{7,23}t'
- id: unicode-delimited-getresponse-suffix
  desc: Unicode-delimited pon fragment
  crit: component
  conf: 0.94
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'p\P{ASCII}[\P{ASCII}A-Za-z]{7,23}o\P{ASCII}[\P{ASCII}A-Za-z]{7,23}n'
- id: unicode-delimited-range-prefix
  desc: Unicode-delimited Range prefix fragment
  crit: component
  conf: 0.94
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'R\P{ASCII}[\P{ASCII}A-Za-z]{7,23}a\P{ASCII}[\P{ASCII}A-Za-z]{7,23}n'
- id: unicode-delimited-header-prefix
  desc: Unicode-delimited Header prefix fragment
  crit: component
  conf: 0.94
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'H\P{ASCII}[\P{ASCII}A-Za-z]{7,23}e\P{ASCII}[\P{ASCII}A-Za-z]{7,23}a'
- id: unicode-delimited-value-prefix
  desc: Unicode-delimited Value prefix fragment
  crit: component
  conf: 0.94
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'V\P{ASCII}[\P{ASCII}A-Za-z]{7,23}a\P{ASCII}[\P{ASCII}A-Za-z]{7,23}l'
- id: unicode-delimited-send-prefix
  desc: Unicode-delimited Send prefix fragment
  crit: component
  conf: 0.94
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'S\P{ASCII}[\P{ASCII}A-Za-z]{7,23}e\P{ASCII}[\P{ASCII}A-Za-z]{7,23}n'
- id: unicode-delimited-async-prefix
  desc: Unicode-delimited Async prefix fragment
  crit: component
  conf: 0.94
  for: [javascript, html, vbs, powershell]
  if:
    type: text
    regex: 'A\P{ASCII}[\P{ASCII}A-Za-z]{7,23}s\P{ASCII}[\P{ASCII}A-Za-z]{7,23}y'
- id: webrequest-create
  desc: .NET WebRequest Create method reference
  conf: 0.78
  for: [pe, dll, csharp, powershell, asp, text]
  if:
    type: text
    regex: (System\.Net\.)?WebRequest.{0,32}Create
- id: webrequest-create-data
  desc: WebRequest create in data
  conf: 0.78
  for:
  - data
  if:
    type: text
    regex: '(?i)(System\.Net\.)?WebRequest.{0,64}Crea.{0,4}te'
- id: webrequest-post-method
  desc: Sets a .NET WebRequest method to POST
  conf: 0.9
  for: [csharp, asp, html]
  if:
    type: text
    regex: '(?is)WebRequest\.Create\s*\([^)]{0,200}\).{0,240}\.Method\s*=\s*["'']POST["'']'
- id: request-stream-write
  desc: Writes a .NET HTTP request body stream
  conf: 0.9
  for: [csharp, asp, html]
  if:
    type: text
    regex: '(?is)GetRequestStream\s*\(\).{0,200}\.Write\s*\('
- id: getresponse
  desc: WebRequest type beside GetResponse method
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: '\b(HttpWebRequest|WebRequest)\b.{0,96}\bGetResponse\b'
- id: getresponsestream
  for: [pe, dll, csharp, powershell, data, asp, text]
  desc: Reads HTTP response body stream
  crit: notable
  conf: 0.86
  if:
    type: text
    word: GetResponseStream
- id: getresponse-data
  desc: GetResponse method call in data
  crit: notable
  conf: 0.72
  for:
  - data
  if:
    type: text
    regex: '(?i)\.GetResponse\s*\('
- id: getresponseasync
  desc: Async HTTP response retrieval
  crit: notable
  conf: 0.72
  if:
    type: text
    word: GetResponseAsync
- id: webclient
  for: [pe, dll, csharp, powershell, data]
  desc: System.Net.WebClient type reference
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\b(System\.Net\.)?WebClient\b'
  unless:
  - id: "metadata/lang/source/shape::yara-rule-source"
- id: soap-http-client-protocol
  desc: .NET SOAP client class reference
  conf: 0.78
  if:
    type: text
    substr: System.Web.Services.Protocols.SoapHttpClientProtocol
- id: downloadstring
  desc: WebClient.DownloadString method
  if:
    type: text
    substr: DownloadString
    # PowerShell method names are case-insensitive; cradles routinely use a
    # lowercase spelling ($client.downloadstring($url)).
    case_insensitive: true
  unless:
  - id: "metadata/lang/source/shape::yara-rule-source"
- id: downloadfile
  desc: WebClient.DownloadFile method
  if:
    type: text
    regex: (?i)(System\.Net\.)?WebClient.{0,80}DownloadFile(\w+)?
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: "metadata/lang/source/shape::yara-rule-source"
- id: dotnet-downloadfile-token
  desc: .NET DownloadFile method token
  crit: notable
  conf: 0.72
  for:
  - pe
  if:
    type: text
    exact: DownloadFile
- id: downloaddata
  desc: WebClient.DownloadData method
  if:
    type: text
    # A token boundary excludes generated properties such as
    # DisableDownloadDataAcl while retaining the actual method name.
    word: DownloadData
  unless:
  - id: "metadata/lang/source/shape::yara-rule-source"
- id: webclient-openread-data
  desc: WebClient near OpenRead-style method
  crit: notable
  conf: 0.82
  for:
  - data
  if:
    type: text
    # A source-map names array contained Open","unreadCount. Require the
    # networking type and keep gaps inside one method-like token. A bare
    # OpenRead is also a filesystem API and does not establish HTTP.
    regex: '(?i)WebClient.{0,40}Op[^\s",]{0,8}nRea[^\s",]{0,4}d'
- id: uploadstring
  desc: UploadString method-name reference
  if:
    type: text
    substr: UploadString
  unless:
  - id: "metadata/lang/source/shape::yara-rule-source"
- id: uploadvalues
  desc: WebClient.UploadValues method
  if:
    type: text
    substr: UploadValues
  unless:
  - id: "metadata/lang/source/shape::yara-rule-source"
composite_rules:
- id: request
  desc: References a .NET HTTP client API
  crit: notable
  conf: 0.86
  any:
  - id: httpclient
  - id: httpwebrequest
  - id: webrequest-create
  - id: webrequest-create-data
  - id: webclient
  - id: soap-http-client-protocol
- id: custom-user-agent-headers
  desc: Default request headers include User-Agent access
  crit: notable
  conf: 0.85
  all:
  - id: default-request-headers
  - id: user-agent-accessor
- id: unicode-delimited-httpwebrequest-download
  desc: Unicode-delimited HttpWebRequest response download
  crit: notable
  conf: 0.98
  attack: T1105
  for: [javascript, html, vbs, powershell]
  all:
  - id: unicode-delimited-httpweb-prefix
  - id: unicode-delimited-request-prefix
  - id: unicode-delimited-getresponse-prefix
  - id: unicode-delimited-getresponse-suffix
- id: unicode-delimited-http-range-request
  desc: Unicode-delimited .NET HTTP range request
  crit: notable
  conf: 0.98
  attack: T1105
  for: [javascript, html, vbs, powershell]
  all:
  - id: unicode-delimited-range-prefix
  - id: unicode-delimited-header-prefix
  - id: unicode-delimited-value-prefix
  - id: unicode-delimited-send-prefix
  - id: unicode-delimited-async-prefix
