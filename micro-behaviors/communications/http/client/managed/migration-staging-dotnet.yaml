defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - pe
  - dll
traits:
- id: dotnet-beacon-exfil-named-http-calls
  desc: Named beacon GET and exfil POST calls
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (?is)\bGetAsync\s*\(\s*_pBeaconUrl\b[\s\S]{0,300}\bPostAsync\s*\(\s*_pExfilUrl\b
