defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-http-request-configured
    desc: Node HTTP request has hostname and port
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\.request\s*\(\s*\{[^}]{0,220}\bhostname\b[^}]{0,180}\bport\b'
  - id: node-http-options-object
    desc: Declares a Node HTTP options object
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(const|let|var)\s+[A-Za-z_$][A-Za-z0-9_$]*\s*=\s*\{'
  - id: node-http-options-host-port
    desc: HTTP options contain hostname and port
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\bhostname\b[\s\S]{0,300}\bport\b'
  - id: node-http-options-request-call
    desc: HTTP request consumes an options identifier
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(http|https)\.request\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*'
  - id: remote-extension-config-path
    desc: References a remote extension config file
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '/ext-config\.json(\?|$)'
  - id: extension-config-cache-write
    desc: Caches extension config in local storage
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'storage\.local\.set\(\{\s*ext_config:'
  - id: configured-api-endpoint-fetch
    desc: Fetches a configured API endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'fetch\(\s*[A-Za-z_$][\w$]*\.api_endpoint\s*,'

composite_rules:
  - id: node-http-request-configured-variable
    desc: Node HTTP request uses options object
    crit: notable
    conf: 0.86
    near_bytes: 1000
    all:
      - id: node-http-options-object
      - id: node-http-options-host-port
      - id: node-http-options-request-call
  - id: remote-extension-config-cache
    desc: Fetches and caches remote extension config
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: remote-extension-config-path
      - id: extension-config-cache-write
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: remote-configured-api-request
    desc: Extension calls a remotely configured API
    crit: notable
    conf: 0.95
    for: [crx, xpi, zip]
    scope: archive
    all:
      - id: remote-extension-config-cache
      - id: configured-api-endpoint-fetch
