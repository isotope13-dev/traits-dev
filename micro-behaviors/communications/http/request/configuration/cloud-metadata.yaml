defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.92

traits:
  # Azure IMDS requires this opt-in header. Keep it as neutral HTTP request
  # configuration; the credential-access objective pairs it with the managed
  # identity token path. Requiring a headers object prevents properties such
  # as OpenTelemetry's providerMetadata: true from impersonating this header.
  - id: azure-imds-object-header
    desc: Request headers enable Azure IMDS metadata
    if:
      type: text
      regex: '(?is)\bheaders?\s*:\s*\{[^}]{0,160}["'']?Metadata["'']?\s*:\s*["'']?true'

  - id: azure-imds-cli-header
    desc: Command sets Azure IMDS Metadata header
    for: [shell]
    if:
      type: text
      regex: '(?i)(-H|--header)\s+["'']?Metadata\s*:\s*true'
