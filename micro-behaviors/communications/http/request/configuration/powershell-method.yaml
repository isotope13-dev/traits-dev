defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
  - id: powershell-webrequest-post-method-assignment
    desc: Web request method set to POST
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\$[A-Za-z_]\w*(request|client)\w*\.Method\s*=\s*["'']POST["'']'
