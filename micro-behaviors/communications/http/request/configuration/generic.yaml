# Request-configuration object fields (method/body/headers). These describe
# how a request is configured, independent of which client sends it, so they
# are baseline on their own -- a JSON document with a "method" key matches.
defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [binaries, scripts]
  attack: T1071.001
  mbc: C0002

traits:
  - id: http-config-method
    desc: HTTP configuration field (method)
    conf: 0.3
    if:
      type: text
      regex: '["'']method["'']\s*:\s*["''][A-Z]{3,7}["'']'
      case_insensitive: true
  - id: http-config-body
    desc: HTTP configuration field (body)
    conf: 0.3
    if:
      type: text
      regex: 'fetch\s*\([^)]{0,240}["'']body["'']\s*:'
      case_insensitive: true
  - id: http-config-headers
    desc: Configures HTTP request headers
    conf: 0.3
    if:
      type: text
      regex: '(?s)(fetch\s*\(|XMLHttpRequest|httpRequest).{0,160}"?headers"?\s*:'

composite_rules:
  - id: http-config-fields
    desc: HTTP configuration fields (method/body/headers)
    conf: 0.5
    needs: 2
    any:
      - id: http-config-method
      - id: http-config-body
      - id: http-config-headers
