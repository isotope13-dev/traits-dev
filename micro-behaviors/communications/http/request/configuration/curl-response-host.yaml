defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-post-host-from-curl-response
    desc: HTTP POST host comes from curl response
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'
      args:
        - index: 0
          from:
            field: hostname
            call: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?execSync$'
            literal: '^curl\s+[^;\r\n]{0,100}https?://'
            through:
              - call: '(^|\.)(toString|trim)$'
                receiver: true
        - index: 0
          from:
            field: method
            whole_value: '^POST$'
