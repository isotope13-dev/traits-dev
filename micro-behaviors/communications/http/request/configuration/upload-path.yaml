defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8
  mbc: C0002

traits:
  - id: upload-path-transfer
    desc: Named upload transfer path constant
    if:
      type: text
      regex: \bconst\s+UPLOAD_PATH\s*=\s*["']/(upload|submit|collect|report)["']

  - id: upload-path-telemetry
    desc: Named telemetry upload path constant
    if:
      type: text
      regex: \bconst\s+UPLOAD_PATH\s*=\s*["']/(stats|telemetry|beacon|sync)["']

  - id: upload-path-api
    desc: Named API upload path constant
    if:
      type: text
      regex: \bconst\s+UPLOAD_PATH\s*=\s*["']/api(/[A-Za-z0-9._-]+)?["']
