defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-request-host-from-shell-output
    desc: HTTP request hostname comes from shell output
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'
      arg:
        index: 0
        from:
          field: hostname
          call: '^execSync(\.toString)?(\.trim)?$'
