defaults:
  platforms: ["unix", "windows"]
  for: ["javascript"]

composite_rules:
  - id: node-execsync-curl-json-post-clues
    desc: Node execSync and curl JSON POST clues
    crit: notable
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/curl/body::curl-json-post-command
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/communications/http/curl/body::curl-post-flag
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/url/host/domain-http::js-insecure-remote-http-url
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
