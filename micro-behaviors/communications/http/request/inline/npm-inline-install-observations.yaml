defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  attack: T1071.001

traits:
- id: js-https-request
  desc: Preinstall script references HTTPS request
  crit: notable
  conf: 0.92
  if:
    type: value
    path: "scripts.preinstall"
    substr: "https.request"
- id: js-https-request-postinstall
  desc: Postinstall script references HTTPS request
  crit: notable
  conf: 0.92
  if:
    type: value
    path: "scripts.postinstall"
    substr: "https.request"
