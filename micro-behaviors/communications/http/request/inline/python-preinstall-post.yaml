defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-preinstall-python-http-post
    desc: Inline preinstall Python posts to HTTP URL
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: '(httpx|requests)\.post\s*\(\s*[''"]https?://'
