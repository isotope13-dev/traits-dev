defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]
composite_rules:
  - id: npm-provenance-ip-callback
    for: [packagejson]
    desc: Preinstall IP and curl with no source repository
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/url/host/port-http::preinstall-ip-port-url
      - id: metadata/package/scripts/reference::npm-preinstall-curl-reference
      - id: metadata/package/scripts/lifecycle::versioned-install-hook-without-source-repository
