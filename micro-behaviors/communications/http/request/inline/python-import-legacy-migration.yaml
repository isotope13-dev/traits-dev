defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: init-external-post-beacon
  desc: Init module POST and endpoint clues
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/http/post::python-module-post-url-body
  - id: micro-behaviors/communications/http/post::python-post-url-literal
  any:
  - id: metadata/lang/source/literal/fragment/single::import-time-hello-beacon
  - id: micro-behaviors/communications/http/user-agent::user-agent-header
- id: init-literal-beacon-post
  desc: Init POST and HelloBeacon string
  crit: suspicious
  conf: 0.96
  all:
  - id: init-external-post-beacon
  - id: metadata/lang/source/literal/fragment/single::import-time-hello-beacon
- id: init-hello-beacon-post
  desc: Init POST with HelloBeacon string
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/file/size::init-py-file
  - id: metadata/lang/source/literal/fragment/single::import-time-hello-beacon
  - id: micro-behaviors/communications/http/post::python-module-post-url-body
