defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-http-client-charat-scheme-selection
    desc: Selects HTTP client from URL character
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\.charAt\(\s*4\s*\)\s*===\s*["'']s["'']'
  - id: node-http-client-get-options
    desc: Node HTTP GET receives request options
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\.get\s*\(.{1,300},\s*\{.{0,500}\b(timeout|headers)\s*:'
  - id: node-computed-get-call
    desc: Calls a computed get method
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\["get"\]\s*\('
  - id: node-request-headers-object
    desc: Object literal leading with headers
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\{\s*headers\s*:'
  - id: node-http-response-pipe
    desc: Uses computed stream piping
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '["pipe"]'
  - id: node-http-module-get-url-call
    desc: Variable HTTP module GET passes URL variable
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      substr: .get
      arg:
        kind: identifier
        name: url

composite_rules:
  - id: node-http-client-computed-get-options
    desc: Computed HTTP GET uses request headers
    crit: notable
    conf: 0.9
    near_lines: 5
    all:
      - id: node-computed-get-call
      - id: node-request-headers-object

  - id: node-scheme-selected-http-get
    desc: Scheme-selected Node client performs GET
    crit: notable
    conf: 0.9
    any:
      - id: node-scheme-selected-http-get-with-options
      - id: node-scheme-selected-http-get-url-variable
  - id: node-scheme-selected-http-get-with-options
    desc: Scheme-selected Node client GET with options
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
      - id: node-http-client-get-options
  - id: node-scheme-selected-http-get-url-variable
    desc: Scheme-selected Node client GET with URL variable
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
      - id: node-http-module-get-url-call
