# Require query results in the request body. A schema name elsewhere in the
# file, a local backup, or an overwritten result does not provide this fact.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: python-litellm-credentials-json-body
    desc: LiteLLM credentials enter HTTP JSON body
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(post|put)$'
      arg:
        from:
          field: json
          call: '(?i)(^|[._$])(execute(query)?|(raw)?query)(_?raw)?$'
          literal: '(?i)(\*\s|credential_values\b)[^();]{0,64}FROM\s+.?LiteLLM_CredentialsTable\b'
          through:
            - call: '(^|\.)fetchall$'
              receiver: true

    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source

  - id: python-litellm-credentials-data-body
    desc: LiteLLM credentials enter serialized HTTP body
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(post|put)$'
      arg:
        from:
          field: data
          call: '(?i)(^|[._$])(execute(query)?|(raw)?query)(_?raw)?$'
          literal: '(?i)(\*\s|credential_values\b)[^();]{0,64}FROM\s+.?LiteLLM_CredentialsTable\b'
          through:
            - call: '(^|\.)fetchall$'
              receiver: true
            - call: '^json\.dumps$'
              arguments: [0]
            - call: '(^|\.)encode$'
              receiver: true
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source

  - id: node-litellm-credentials-axios-body
    desc: LiteLLM credentials enter Axios request body
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^axios\.(post|put)$'
      arg:
        index: 1
        from:
          call: '(?i)(^|[._$])(execute(query)?|(raw)?query)(_?raw)?$'
          literal: '(?i)(\*\s|credential_values\b)[^();]{0,64}FROM\s+.?LiteLLM_CredentialsTable\b'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source

  - id: node-litellm-credentials-fetch-body
    desc: LiteLLM credentials enter fetch body
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 1
        from:
          field: body
          call: '(?i)(^|[._$])(execute(query)?|(raw)?query)(_?raw)?$'
          literal: '(?i)(\*\s|credential_values\b)[^();]{0,64}FROM\s+.?LiteLLM_CredentialsTable\b'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
