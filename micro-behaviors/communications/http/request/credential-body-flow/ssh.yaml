# Follow the opened private-key file through explicit byte-preserving
# transformations into a request body. Key names elsewhere are insufficient.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: python-ssh-key-requests-data-body
    desc: SSH private-key file enters HTTP body
    if:
      type: symbol
      kind: call
      exact: requests.post
      arg:
        from:
          field: data
          call: '^open$'
          literal: '[./\\]\.ssh[/\\]id_(rsa|dsa|ecdsa|ed25519)$'
          through:
            - call: '(^|\.)read$'
              receiver: true
            - call: '^gzip\.compress$'
              arguments: [0]
            - call: '(^|\.)encrypt$'
              arguments: [0]
            - call: '^pad$'
              arguments: [0]
            - call: '(^|\.)b64encode$'
              arguments: [0]
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
  - id: python-ssh-key-httpx-data-body
    desc: SSH private-key file enters HTTP body
    if:
      type: symbol
      kind: call
      exact: httpx.post
      arg:
        from:
          field: data
          call: '^open$'
          literal: '[./\\]\.ssh[/\\]id_(rsa|dsa|ecdsa|ed25519)$'
          through:
            - call: '(^|\.)read$'
              receiver: true
            - call: '^gzip\.compress$'
              arguments: [0]
            - call: '(^|\.)encrypt$'
              arguments: [0]
            - call: '^pad$'
              arguments: [0]
            - call: '(^|\.)b64encode$'
              arguments: [0]
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
