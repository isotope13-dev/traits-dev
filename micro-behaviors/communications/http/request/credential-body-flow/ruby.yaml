defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.95
traits:
  - id: ruby-sensitive-env-json-net-http-post-body
    desc: Credential-filtered ENV JSON POST
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (call
          receiver: (scope_resolution) @http_receiver
          method: (identifier) @http_method
          arguments: (argument_list
            (_)
            (call
              receiver: (constant) @json_receiver
              method: (identifier) @json_method
              arguments: (argument_list
                (call
                  receiver: (call
                    receiver: (constant) @env_receiver
                    method: (identifier) @env_method)
                  method: (identifier) @selection_method
                  block: (block
                    parameters: (block_parameters (identifier) @env_key)
                    body: (block_body
                      (binary
                        left: (identifier) @predicate_key
                        operator: "=~"
                        right: (regex) @secret_filter)))))))
          (#eq? @http_receiver "Net::HTTP")
          (#eq? @http_method "post")
          (#eq? @json_receiver "JSON")
          (#eq? @json_method "generate")
          (#eq? @env_receiver "ENV")
          (#eq? @env_method "to_h")
          (#eq? @selection_method "select")
          (#eq? @env_key @predicate_key)
          (#match? @secret_filter "(?i)(TOKEN|SECRET|PASSWORD|PRIVATE[_ -]?KEY|API[_ -]?KEY|AUTH|GEM)"))
  - id: ruby-filtered-env-json-net-http-request-body
    desc: Filtered ENV JSON reaches Net::HTTP request
    if:
      type: tree-sitter
      query: |
        (method
          body: (body_statement
            (assignment
              left: (identifier) @blob_var
              right: (hash
                (pair value: (call
                  receiver: (call
                    receiver: (constant) @env_receiver
                    method: (identifier) @env_method)
                  method: (identifier) @selection_method
                  block: (block
                    parameters: (block_parameters (identifier) @env_key)
                    body: (block_body
                      (binary
                        left: (identifier) @predicate_key
                        operator: "=~"
                        right: (regex) @secret_filter)))))))
            (_)*
            (call
              receiver: (scope_resolution) @net_receiver
              method: (identifier) @start_method
              block: (do_block
                parameters: (block_parameters (identifier) @http_var)
                body: (body_statement
                  (_)*
                  (assignment
                    left: (identifier) @request_var
                    right: (call
                      receiver: (scope_resolution) @post_class
                      method: (identifier) @post_constructor))
                  (_)*
                  (assignment
                    left: (call
                      receiver: (identifier) @request_body_owner
                      method: (identifier) @request_field)
                    right: (call
                      receiver: (constant) @json_receiver
                      method: (identifier) @json_method
                      arguments: (argument_list (identifier) @json_input)))
                  (_)*
                  (call
                    receiver: (identifier) @send_receiver
                    method: (identifier) @send_method
                    arguments: (argument_list (identifier) @sent_request))))))
          (#eq? @env_receiver "ENV")
          (#eq? @env_method "to_h")
          (#eq? @selection_method "select")
          (#eq? @env_key @predicate_key)
          (#match? @secret_filter "(?i)(TOKEN|SECRET|PASSWORD|PRIVATE[_ -]?KEY|API[_ -]?KEY|AUTH|GEM)")
          (#eq? @net_receiver "Net::HTTP")
          (#eq? @start_method "start")
          (#eq? @post_class "Net::HTTP::Post")
          (#eq? @post_constructor "new")
          (#eq? @request_body_owner @request_var)
          (#eq? @request_field "body")
          (#eq? @json_receiver "JSON")
          (#eq? @json_method "generate")
          (#eq? @json_input @blob_var)
          (#eq? @send_receiver @http_var)
          (#eq? @send_method "request")
          (#eq? @sent_request @request_var))
  - id: ruby-marker-filtered-env-json-net-http-post-body
    desc: Marker-filtered ENV reaches JSON POST body
    if:
      type: tree-sitter
      query: |
        ((method
          body: (body_statement
          (assignment
            left: (identifier) @secrets_var
            right: (call
              receiver: (constant) @env_receiver
              method: (identifier) @env_method
              block: (block
                parameters: (block_parameters (identifier) @env_key (_))
                body: (block_body
                  (call
                  receiver: (string_array) @marker_list
                    method: (identifier) @any_method
                    block: (block
                      parameters: (block_parameters (identifier) @marker_var)
                      body: (block_body
                        (call
                          receiver: (identifier) @predicate_key
                          method: (identifier) @include_method
                          arguments: (argument_list (identifier) @predicate_marker)))))))))
          (_)*
          (assignment
            left: (identifier) @body_var
            right: (call
              receiver: (hash
                (pair key: (hash_key_symbol) @env_key_capture value: (identifier) @embedded_secret))
              method: (identifier) @json_method))
          (_)*
          (call
            receiver: (scope_resolution) @http_receiver
            method: (identifier) @http_method
            arguments: (argument_list (_) (identifier) @sent_body)))) @flow
        (#eq? @env_receiver "ENV")
        (#eq? @env_method "select")
        (#eq? @any_method "any?")
        (#eq? @include_method "include?")
        (#eq? @env_key @predicate_key)
        (#eq? @marker_var @predicate_marker)
        (#eq? @env_key_capture "env")
        (#eq? @secrets_var @embedded_secret)
        (#eq? @json_method "to_json")
        (#eq? @body_var @sent_body)
        (#eq? @http_receiver "Net::HTTP")
        (#eq? @http_method "post")
        (#match? @marker_list "TOKEN|SECRET|PASSWORD|PRIVATE_KEY|API_KEY|AUTH|GEM"))
