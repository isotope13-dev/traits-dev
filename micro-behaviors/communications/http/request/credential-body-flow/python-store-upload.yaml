# Bind the browser-store path to the exact open() used as a multipart upload
# value. Adjacent statements avoid following a stale binding across reassignment.
# Endpoint, variable name, multipart field and client-object name may vary.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1555.003,T1041
traits:
  - id: python-browser-store-multipart-upload
    desc: Browser store bound to multipart HTTP upload
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (expression_statement (assignment
              left: (identifier) @store_variable
              right: (string (string_content) @store_path)))
            . (expression_statement (call
              function: (attribute object: (identifier) @client attribute: (identifier) @method)
              arguments: (argument_list
                (string (string_content) @destination)
                (keyword_argument name: (identifier) @files
                  value: (dictionary (pair value: (call
                    function: (identifier) @open
                    arguments: (argument_list . (identifier) @used
                      . (string (string_content) @mode) .)))))))))
          (#eq? @store_variable @used) (#eq? @open "open")
          (#match? @client "^(requests|httpx)$") (#eq? @files "files") (#match? @method "^(post|put)$")
          (#match? @mode "^(r|rb|rt)$")
          (#match? @store_path "(?i)(^|[/\\\\])(logins\\.json|Login Data|Cookies)$")
          (#match? @destination "(?i)^https?://")
          (#not-match? @destination "(?i)^https?://(localhost|127\\.0\\.0\\.1|\\[::1\\])([:/]|$)"))
