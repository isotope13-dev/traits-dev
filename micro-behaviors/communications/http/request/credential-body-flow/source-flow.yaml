defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: fetch-options-db-result-json-body
    desc: Database result reaches fetch body
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 1
        from:
          call: '\.all$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
  - id: npm-env-token-json-body-to-request-end
    desc: NPM token reaches request end
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        (program
          (lexical_declaration
            "const"
            (variable_declarator
              name: (identifier) @token_src
              value: (member_expression
                object: (member_expression
                  object: (identifier) @process
                  property: (property_identifier) @env)
                property: (property_identifier) @credential)))
          (_)*
          (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @req
                property: (property_identifier) @end)
              arguments: (arguments
                (call_expression
                  function: (member_expression
                    object: (identifier) @json
                    property: (property_identifier) @stringify)
                  arguments: (arguments
                    (object
                      (shorthand_property_identifier) @token_body))))))
          (#eq? @process "process")
          (#eq? @env "env")
          (#eq? @credential "NPM_TOKEN")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @end "end")
          (#eq? @token_src @token_body))
  - id: npmrc-read-json-body-to-request-end
    desc: npmrc read reaches request end
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.end$'
      arg:
        index: 0
        from:
          call: '(^|\.)readFileSync$'
          literal: '(^|[/\\])\.npmrc$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
  # Co-occurrence is not data flow: a secret prompt beside an unrelated API
  # POST (device authorization, config lookup, a signed transaction) is an
  # ordinary CLI loop. Only the prompted answer reaching the request body
  # establishes transmission.
  - id: question-answer-json-body-to-fetch
    desc: Question-call answer reaches fetch JSON body
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 1
        from:
          call: '(^|\.)question$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
  - id: question-answer-json-body-to-axios
    desc: Question-call answer reaches axios JSON body
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: axios.post
      arg:
        index: 1
        from:
          call: '(^|\.)question$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
  - id: npmrc-read-body-to-request-end
    desc: npmrc read reaches request end
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.end$'
      arg:
        index: 0
        from:
          call: '(^|\.)readFileSync$'
          literal: '(^|[/\\])\.npmrc$'
