# Callback mutations are opaque in the source-local flow graph. Require the
# selected environment keys to index both sides of the copy, and the same map
# in fetch's JSON body. A nearby inventory or an unrelated POST is insufficient.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: filtered-env-map-to-fetch-json-body
    desc: Filtered env values reach fetch JSON body
    if:
      type: tree-sitter
      language: javascript
      # One pattern per statement-list parent rather than a wildcard parent:
      # a wildcard parent with a concrete first child starts at every
      # declaration in a bundle, while a typed parent lets the query run
      # only where its literals (`forEach`, `stringify`, ...) occur.
      query: |
        ((program
          (lexical_declaration "const" (variable_declarator
            name: (identifier) @map value: (object)))
          (expression_statement (call_expression
            function: (member_expression
              object: (call_expression function: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @object
                    property: (property_identifier) @keys)
                  arguments: (arguments . (member_expression
                    object: (identifier) @process
                    property: (property_identifier) @env) .))
                property: (property_identifier) @filter))
              property: (property_identifier) @each)
            arguments: (arguments . (arrow_function
              [(identifier) @entry (formal_parameters . (identifier) @entry .)]
              body: (statement_block . (expression_statement
                (assignment_expression
                  left: (subscript_expression object: (identifier) @destination
                    index: (identifier) @copied_key)
                  right: (subscript_expression
                    object: (member_expression object: (identifier) @read_process
                      property: (property_identifier) @read_env)
                    index: (identifier) @read_key))) .)) .)))
          (expression_statement (call_expression function: (identifier) @fetch
            arguments: (arguments . (_) . (object (pair
              key: [(property_identifier) (string)] @body
              value: (call_expression function: (member_expression
                object: (identifier) @json property: (property_identifier) @stringify)
                arguments: (arguments . (identifier) @sent_map .)))))))) @transfer
          (#eq? @object "Object") (#eq? @keys "keys")
          (#eq? @process "process") (#eq? @env "env")
          (#eq? @filter "filter") (#eq? @each "forEach")
          (#eq? @read_process "process") (#eq? @read_env "env")
          (#eq? @map @destination) (#eq? @map @sent_map)
          (#eq? @entry @copied_key) (#eq? @entry @read_key)
          (#eq? @fetch "fetch") (#match? @body "^['\"]?body['\"]?$")
          (#eq? @json "JSON") (#eq? @stringify "stringify"))
        ((statement_block
          (lexical_declaration "const" (variable_declarator
            name: (identifier) @map value: (object)))
          (expression_statement (call_expression
            function: (member_expression
              object: (call_expression function: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @object
                    property: (property_identifier) @keys)
                  arguments: (arguments . (member_expression
                    object: (identifier) @process
                    property: (property_identifier) @env) .))
                property: (property_identifier) @filter))
              property: (property_identifier) @each)
            arguments: (arguments . (arrow_function
              [(identifier) @entry (formal_parameters . (identifier) @entry .)]
              body: (statement_block . (expression_statement
                (assignment_expression
                  left: (subscript_expression object: (identifier) @destination
                    index: (identifier) @copied_key)
                  right: (subscript_expression
                    object: (member_expression object: (identifier) @read_process
                      property: (property_identifier) @read_env)
                    index: (identifier) @read_key))) .)) .)))
          (expression_statement (call_expression function: (identifier) @fetch
            arguments: (arguments . (_) . (object (pair
              key: [(property_identifier) (string)] @body
              value: (call_expression function: (member_expression
                object: (identifier) @json property: (property_identifier) @stringify)
                arguments: (arguments . (identifier) @sent_map .)))))))) @transfer
          (#eq? @object "Object") (#eq? @keys "keys")
          (#eq? @process "process") (#eq? @env "env")
          (#eq? @filter "filter") (#eq? @each "forEach")
          (#eq? @read_process "process") (#eq? @read_env "env")
          (#eq? @map @destination) (#eq? @map @sent_map)
          (#eq? @entry @copied_key) (#eq? @entry @read_key)
          (#eq? @fetch "fetch") (#match? @body "^['\"]?body['\"]?$")
          (#eq? @json "JSON") (#eq? @stringify "stringify"))
        ((switch_case
          (lexical_declaration "const" (variable_declarator
            name: (identifier) @map value: (object)))
          (expression_statement (call_expression
            function: (member_expression
              object: (call_expression function: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @object
                    property: (property_identifier) @keys)
                  arguments: (arguments . (member_expression
                    object: (identifier) @process
                    property: (property_identifier) @env) .))
                property: (property_identifier) @filter))
              property: (property_identifier) @each)
            arguments: (arguments . (arrow_function
              [(identifier) @entry (formal_parameters . (identifier) @entry .)]
              body: (statement_block . (expression_statement
                (assignment_expression
                  left: (subscript_expression object: (identifier) @destination
                    index: (identifier) @copied_key)
                  right: (subscript_expression
                    object: (member_expression object: (identifier) @read_process
                      property: (property_identifier) @read_env)
                    index: (identifier) @read_key))) .)) .)))
          (expression_statement (call_expression function: (identifier) @fetch
            arguments: (arguments . (_) . (object (pair
              key: [(property_identifier) (string)] @body
              value: (call_expression function: (member_expression
                object: (identifier) @json property: (property_identifier) @stringify)
                arguments: (arguments . (identifier) @sent_map .)))))))) @transfer
          (#eq? @object "Object") (#eq? @keys "keys")
          (#eq? @process "process") (#eq? @env "env")
          (#eq? @filter "filter") (#eq? @each "forEach")
          (#eq? @read_process "process") (#eq? @read_env "env")
          (#eq? @map @destination) (#eq? @map @sent_map)
          (#eq? @entry @copied_key) (#eq? @entry @read_key)
          (#eq? @fetch "fetch") (#match? @body "^['\"]?body['\"]?$")
          (#eq? @json "JSON") (#eq? @stringify "stringify"))