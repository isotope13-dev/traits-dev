defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-vote-json-post-clues
    desc: Install filename, JSON POST and vote path clues
    crit: notable
    conf: 0.96
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/route::node-vote-path-property
      - id: micro-behaviors/communications/http/request/verb::post-method-text

  - id: node-vote-json-xor-clues
    desc: Install filename, JSON, vote path and XOR clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/communications/http/request/route::node-vote-path-property
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
    any:
      - id: micro-behaviors/data/decode/xor/reconstruction::fromcharcode-xor-rebuild
      - id: micro-behaviors/data/string/access::js-charcode-length-modulo-index
      - id: micro-behaviors/data/string/conversion::js-xor-character-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text

