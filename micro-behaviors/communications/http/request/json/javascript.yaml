defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: request-send-json-body
    desc: Sends JSON body through request-like client
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b(request|xhr|xmlhttp)\.send\s*\(\s*JSON\.stringify\s*\('
  - id: json-response-call
    desc: Calls a response JSON parser
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)json$'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context

composite_rules:
  - id: fetch-json-response
    desc: Fetches and parses a JSON response
    crit: notable
    conf: 0.94
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: json-response-call
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
