defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: hardcoded-json-url-fetch
    desc: Fetches hardcoded remote JSON URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '^fetch\s*\(\s*["'']https?://[^"'']{1,200}\.json["'']'
    unless:
      - id: well-known/app/ai/mastra::models-dev-catalog-json-fetch

  # Inline `<script>` in an HTML page reaches an absolute URL the same way, and
  # a page-embedded collector is exactly what a credential relay uses, so this
  # atom covers html too; the `js-` id prefix it used to carry claimed less than
  # the matcher sees.
  - id: fetch-external-url
    desc: Fetches hardcoded external HTTP(S) URL
    crit: notable
    conf: 0.92
    for: [javascript, html]
    if:
      type: text
      regex: '\bfetch\s*\(\s*["'']https?://[a-zA-Z0-9.-]*\.[a-zA-Z]{2,}'
    not:
      - regex: '\bfetch\s*\(\s*["'']https?://(localhost|[^/"'']*\.local\b)'
      - regex: '\bfetch\s*\(\s*["'']https?://[a-z0-9.-]*example\.(com|org|net)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: request-send-json-body
    desc: Sends JSON body through request-like client
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      kind: call
      regex: '\b(request|xhr|xmlhttp)\.send\s*\(\s*JSON\.stringify\s*\('
composite_rules:
  # This is a risky cross-boundary dataflow, but it does not by itself prove an
  # exploit: extension notification and changelog panels can deliberately use
  # the same pattern. Keep the mechanic here; XSS objectives add payload
  # evidence such as an attribute breakout or executable event handler.
  - id: external-json-to-dynamic-innerhtml
    desc: External JSON reaches dynamic innerHTML
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    near_bytes: 1800
    all:
      - id: fetch-json-response
      - id: micro-behaviors/communications/http/client/response-body::fetch-json-before-dynamic-innerhtml

  - id: fetch-json-response
    desc: Fetches and parses a JSON response
    crit: notable
    conf: 0.94
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: fetch-external-url
      - id: micro-behaviors/communications/http/message::http-message-json-call
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
