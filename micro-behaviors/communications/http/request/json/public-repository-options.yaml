defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: user-repos-public-post-options
    desc: Passes public repository POST options
    # A wrapper call with token preceding a relative endpoint; no assumed
    # resolution of an arbitrary callee to a particular network library.
    if:
      type: tree-sitter
      query: |
        (call_expression
          arguments: (arguments
            (string (string_fragment) @url)
            . (object
              (pair key: [(property_identifier) @method (string (string_fragment) @method)] value: (string (string_fragment) @verb))
              (pair key: [(property_identifier) @body (string (string_fragment) @body)] value: (call_expression
                arguments: (arguments . (object
                  (pair key: [(property_identifier) @visibility (string (string_fragment) @visibility)] value: (unary_expression
                    operator: "!" argument: (number) @truthy))))))))
          (#eq? @url "/user/repos") (#eq? @method "method")
          (#eq? @verb "POST") (#eq? @body "body")
          (#eq? @visibility "private") (#match? @truthy "^(0x)?1$")) @match
