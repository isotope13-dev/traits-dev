defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: trycloudflare-near-json-email-post
    desc: Tunnel domain near email JSON POST
    crit: notable
    conf: 0.97
    near_bytes: 2048
    all:
      - id: well-known/dual-use/tunnel/cloudflared::trycloudflare-domain
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/data/serialize/schema-object::json-stringify-email-field
