defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]

composite_rules:
  - id: http-post-json-small-script
    desc: JSON HTTP POST from a small script file
    crit: notable
    conf: 0.8
    size_max: 5000
    unless:
      - id: metadata/package/testing/harness/runtime/
    any:
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
