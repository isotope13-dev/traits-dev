defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

composite_rules:
  - id: node-host-profile-hardcoded-post-script
    desc: Host profile and JSON POST to fixed host
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/data/source/syntax/schema::host-system-metric-schema
      - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/data/serialize/json::json-stringify-identifier
    any:
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
      - id: micro-behaviors/communications/http/request/configuration::request-timeout-destroys-request
      - id: micro-behaviors/os/env/package-manager::npm-lifecycle
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
  - id: node-host-profile-workers-post-script
    desc: Host profile and JSON POST to workers.dev
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/data/source/syntax/schema::host-system-metric-schema
      - id: micro-behaviors/communications/http/url/domain::workers-dev-url
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/data/serialize/json::json-stringify-identifier
    any:
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
      - id: micro-behaviors/communications/http/request/configuration::request-timeout-destroys-request
      - id: micro-behaviors/os/env/package-manager::npm-lifecycle
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
