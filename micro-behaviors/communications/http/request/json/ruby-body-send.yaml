defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-json-body-request-send
    desc: JSON value sent through constructed HTTP POST
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @request
              right: (call receiver: (scope_resolution) @post method: (identifier) @new))
            (assignment left: (call receiver: (identifier) @body_owner method: (identifier) @field)
              right: [(call method: (identifier) @json) (call receiver: (constant) @json_module method: (identifier) @json_function)])
            [(call method: (identifier) @send arguments: (argument_list (identifier) @sent)) (begin (call method: (identifier) @send arguments: (argument_list (identifier) @sent)))])
          (#eq? @post "Net::HTTP::Post") (#eq? @new "new")
          (#eq? @request @body_owner) (#eq? @field "body") (#eq? @json "to_json") (#eq? @json_module "JSON") (#match? @json_function "^(generate|dump)$")
          (#eq? @send "request") (#eq? @request @sent))
        ((_ (assignment left: (identifier) @body_value
              right: [(call method: (identifier) @json) (call receiver: (constant) @json_module method: (identifier) @json_function)])
            (assignment left: (identifier) @request
              right: (call receiver: (scope_resolution) @post method: (identifier) @new))
            (assignment left: (call receiver: (identifier) @body_owner method: (identifier) @field)
              right: (identifier) @assigned_body)
            [(call method: (identifier) @send arguments: (argument_list (identifier) @sent)) (begin (call method: (identifier) @send arguments: (argument_list (identifier) @sent)))])
          (#eq? @json "to_json") (#eq? @json_module "JSON") (#match? @json_function "^(generate|dump)$") (#eq? @post "Net::HTTP::Post") (#eq? @new "new")
          (#eq? @request @body_owner) (#eq? @field "body")
          (#eq? @body_value @assigned_body) (#eq? @send "request") (#eq? @request @sent))
        ((_ (assignment left: (identifier) @request
              right: (call receiver: (scope_resolution) @post method: (identifier) @new))
            [(call method: (identifier) @send arguments: (argument_list (identifier) @sent
                [(call method: (identifier) @json) (call receiver: (constant) @json_module method: (identifier) @json_function)]))
             (assignment right: (call method: (identifier) @send arguments: (argument_list (identifier) @sent
                [(call method: (identifier) @json) (call receiver: (constant) @json_module method: (identifier) @json_function)])))
             (begin (call method: (identifier) @send arguments: (argument_list (identifier) @sent
                [(call method: (identifier) @json) (call receiver: (constant) @json_module method: (identifier) @json_function)])))
             (begin (assignment right: (call method: (identifier) @send arguments: (argument_list (identifier) @sent
                [(call method: (identifier) @json) (call receiver: (constant) @json_module method: (identifier) @json_function)]))))])
          (#eq? @post "Net::HTTP::Post") (#eq? @new "new") (#eq? @send "request")
          (#eq? @request @sent) (#eq? @json "to_json")
          (#eq? @json_module "JSON") (#match? @json_function "^(generate|dump)$"))
