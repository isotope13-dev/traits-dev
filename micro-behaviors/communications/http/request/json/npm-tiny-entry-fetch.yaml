defaults:
  platforms: [unix, windows]
composite_rules:
  - id: tiny-root-module-remote-fetch
    desc: Tiny npm root module fetches external URL
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/request/json::tiny-module-external-url-fetch
      - id: micro-behaviors/communications/http/request/client::module-execution-http-call
      - id: metadata/package/entrypoint/module::npm-root-javascript-source-member

