defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
  - id: go-post-json-content-type
    desc: Go HTTP POST specifies JSON content type
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: http.Post
      arg:
        index: 1
        kind: string
        exact: application/json
