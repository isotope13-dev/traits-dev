# Generic JSON request mechanics, independent of the body's data source.
defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: html-fetch-json-stringify-body
    for: [html]
    desc: Inline request body serializes JSON
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '\bbody\s*:\s*JSON\.stringify\s*\('

composite_rules:
  - id: js-non-loopback-json-post
    desc: JavaScript POSTs JSON to non-loopback URL
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-direct-json-post-body
      - id: micro-behaviors/communications/http/request/client::fetch-http-scheme-url
    unless:
      - id: micro-behaviors/communications/ip/endpoint::fetch-loopback-http-url
      - id: micro-behaviors/communications/http/request/url::fetch-invalid-domain-literal

  - id: html-non-loopback-json-post
    for: [html]
    desc: HTML script POSTs JSON to non-loopback URL
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/request/target::html-fetch-non-loopback-http-url
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/request/json::html-fetch-json-stringify-body

  - id: non-loopback-json-post
    for: [javascript, typescript, html]
    desc: POSTs JSON body to non-loopback HTTP(S) URL
    any:
      - id: micro-behaviors/communications/http/request/json::js-non-loopback-json-post
      - id: micro-behaviors/communications/http/request/json::html-non-loopback-json-post

