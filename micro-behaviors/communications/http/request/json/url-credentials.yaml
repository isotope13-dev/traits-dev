defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  # Bind the dictionary to json.dumps and the resulting Request to urlopen.
  # Mere credential fields next to an unrelated request are insufficient.
  - id: python-url-credentials-json-send
    desc: urllib sends URL and credential dictionary
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @record
            right: (dictionary) @fields))
          . (if_statement
            consequence: (block
              (expression_statement (assignment
                left: (identifier) @request
                right: (call
                  function: (attribute
                    object: (attribute object: (identifier) @module
                      attribute: (identifier) @submodule)
                    attribute: (identifier) @constructor)
                  arguments: (argument_list
                    (keyword_argument name: (identifier) @data
                      value: (call
                        function: (attribute
                          object: (call
                            function: (attribute object: (identifier) @json
                              attribute: (identifier) @dumps)
                            arguments: (argument_list (identifier) @serialized))
                          attribute: (identifier) @encode)))))))
              . (expression_statement (call
                function: (attribute
                  object: (attribute object: (identifier) @send_module
                    attribute: (identifier) @send_submodule)
                  attribute: (identifier) @send)
                arguments: (argument_list (identifier) @sent))))))
          (#eq? @module "urllib")
          (#eq? @submodule "request")
          (#eq? @constructor "Request")
          (#eq? @data "data")
          (#eq? @json "json")
          (#eq? @dumps "dumps")
          (#eq? @encode "encode")
          (#eq? @record @serialized)
          (#eq? @send_module "urllib")
          (#eq? @send_submodule "request")
          (#eq? @send "urlopen")
          (#eq? @request @sent)
          (#match? @fields "[\"']url[\"']\\s*:")
          (#match? @fields "[\"']user(name)?[\"']\\s*:")
          (#match? @fields "[\"']password[\"']\\s*:")) @transfer
