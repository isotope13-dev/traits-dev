defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.98
traits:
- id: python-urllib-hostname-json-oob-send
  desc: urllib sends hostname JSON to OOB
  # The parser accepts a string-wrapped source buffer as Python. A module
  # consisting solely of one triple-quoted literal cannot send a request.
  # Reject inner triple quotes, so executable code after a docstring remains.
  unless:
  - id: metadata/lang/source/origin::heuristic-quoted-source
  - id: metadata/file/profile/source-indications::python-triple-quoted-module
  if:
    type: tree-sitter
    language: python
    query: |
      ((module
          (expression_statement (assignment
              left: (identifier) @endpoint
              right: (string (string_content) @url)))
          . (comment)* . (class_definition body: (block
              (function_definition parameters: (parameters . (identifier) .) body: (block
                  (try_statement body: (block
                      (expression_statement (assignment
                          left: (identifier) @host
                          right: (call function: (attribute
                              object: (identifier) @socket
                              attribute: (identifier) @gethostname))))
                      . (comment)* . (expression_statement (assignment
                          right: (call function: (attribute
                              object: (identifier) @socket2
                              attribute: (identifier) @resolve)
                            arguments: (argument_list (identifier) @resolve_host))))
                      . (comment)* . (expression_statement (assignment
                          left: (identifier) @record
                          right: (dictionary (pair value: (identifier) @record_host))))
                      . (comment)* . (expression_statement (assignment
                          left: (identifier) @body
                          right: (call function: (attribute
                              object: (call function: (attribute
                                  object: (identifier) @json
                                  attribute: (identifier) @dumps)
                                arguments: (argument_list (identifier) @serialized))
                              attribute: (identifier) @encode))))
                      . (comment)* . (expression_statement (assignment
                          left: (identifier) @request_var
                          right: (call function: (attribute
                              object: (attribute object: (identifier) @urllib
                                attribute: (identifier) @request_module)
                              attribute: (identifier) @request)
                            arguments: (argument_list . (identifier) @destination
                              (keyword_argument
                                name: (identifier) @data
                                value: (identifier) @request_body)))))
                      . (comment)* . (expression_statement (call function: (attribute
                            object: (attribute object: (identifier) @urllib2
                              attribute: (identifier) @request_module2)
                            attribute: (identifier) @urlopen)
                          arguments: (argument_list . (identifier) @sent))))))))))
        (#eq? @endpoint @destination)
        (#match? @url "^https?://([a-z0-9-]+\\.)?(webhook\\.site|oastify\\.com|interact\\.sh)/")
        (#eq? @socket "socket") (#eq? @gethostname "gethostname")
        (#eq? @socket2 "socket") (#eq? @resolve "gethostbyname")
        (#eq? @host @resolve_host) (#eq? @host @record_host)
        (#eq? @json "json") (#eq? @dumps "dumps")
        (#eq? @encode "encode") (#eq? @record @serialized)
        (#eq? @urllib "urllib") (#eq? @request_module "request")
        (#eq? @request "Request") (#eq? @data "data")
        (#eq? @body @request_body) (#eq? @urllib2 "urllib")
        (#eq? @request_module2 "request") (#eq? @urlopen "urlopen")
        (#eq? @request_var @sent))

      ((module
          (expression_statement (assignment
              left: (identifier) @endpoint
              right: (string (string_content) @url)))
          . (comment)* . (class_definition body: (block
              (function_definition parameters: (parameters . (identifier) .) body: (block
                  (try_statement body: (block
                      (expression_statement (assignment
                          left: (identifier) @host
                          right: (call function: (attribute
                              object: (identifier) @socket
                              attribute: (identifier) @gethostname))))
                      . (comment)* . (expression_statement (assignment
                          left: (identifier) @record
                          right: (dictionary (pair value: (identifier) @record_host))))
                      . (comment)* . (expression_statement (assignment
                          left: (identifier) @body
                          right: (call function: (attribute
                              object: (call function: (attribute
                                  object: (identifier) @json
                                  attribute: (identifier) @dumps)
                                arguments: (argument_list (identifier) @serialized))
                              attribute: (identifier) @encode))))
                      . (comment)* . (expression_statement (assignment
                          left: (identifier) @request_var
                          right: (call function: (attribute
                              object: (attribute object: (identifier) @urllib
                                attribute: (identifier) @request_module)
                              attribute: (identifier) @request)
                            arguments: (argument_list . (identifier) @destination
                              (keyword_argument
                                name: (identifier) @data
                                value: (identifier) @request_body)))))
                      . (comment)* . (expression_statement (call function: (attribute
                            object: (attribute object: (identifier) @urllib2
                              attribute: (identifier) @request_module2)
                            attribute: (identifier) @urlopen)
                          arguments: (argument_list . (identifier) @sent))))))))))
        (#eq? @endpoint @destination)
        (#match? @url "^https?://([a-z0-9-]+\\.)?(webhook\\.site|oastify\\.com|interact\\.sh)/")
        (#eq? @socket "socket") (#eq? @gethostname "gethostname")
        (#eq? @host @record_host)
        (#eq? @json "json") (#eq? @dumps "dumps")
        (#eq? @encode "encode") (#eq? @record @serialized)
        (#eq? @urllib "urllib") (#eq? @request_module "request")
        (#eq? @request "Request") (#eq? @data "data")
        (#eq? @body @request_body) (#eq? @urllib2 "urllib")
        (#eq? @request_module2 "request") (#eq? @urlopen "urlopen")
        (#eq? @request_var @sent))
