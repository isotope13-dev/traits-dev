defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: fetch-json-stringify-body
    desc: Fetch request uses JSON.stringify body
    conf: 0.94
    if:
      type: text
      regex: '\bfetch\([^;]{1,500}\bbody\s*:\s*JSON\.stringify\('
  # Separately built request init. Wrappers that assemble the init object
  # across statements (`const init = { method, ... }; init.body =
  # JSON.stringify(x); fetch(url, init)`) dodge the inline `body:`
  # matchers above while transmitting the same JSON body over fetch.
  - id: fetch-variable-options-call
    desc: fetch called with variable request options
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @fetch
          arguments: (arguments
            . (_)
            . (identifier) @opts)) @call
          (#eq? @fetch "fetch"))
  - id: json-stringify-body-assignment
    desc: Assigns JSON.stringify result to body member
    conf: 0.9
    if:
      type: text
      regex: \.body\s*=\s*JSON\.stringify\s*\(

composite_rules:
  - id: fetch-deferred-json-body
    desc: fetch sends JSON body assembled across statements
    conf: 0.9
    near_bytes: 1000
    all:
      - id: fetch-variable-options-call
      - id: json-stringify-body-assignment
