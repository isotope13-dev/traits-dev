defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - python

traits:
  - id: requests-post-json-payload
    desc: Sends JSON with Python requests.post()
    conf: 0.85
    if:
      type: text
      regex: "requests\\.post\\([^)]{0,120}json\\s*="
    unless:
      - type: basename
        regex: ^test_.{0,120}\.py$
      - type: basename
        exact: conftest.py
      - type: basename
        regex: ^.{0,120}\.ipynb$
      - id: micro-behaviors/communications/ip/endpoint::localhost-hostname-text
      - id: micro-behaviors/communications/ip/endpoint::loopback-ipv4-text
composite_rules:
  - id: urllib-json-request-body
    desc: urllib JSON request with body
    conf: 0.9
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/client/library::urllib-request-client-import
      - id: micro-behaviors/data/serialize/json::json-dumps-call
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
  - id: python-structured-post-transport
    desc: Python sends a JSON body over HTTP POST
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
