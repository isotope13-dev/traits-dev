defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - python

traits:
  - id: urllib-request-json-dumps-body
    desc: urllib Request body from json.dumps
    conf: 0.9
    if:
      type: text
      regex: urllib\.request\.Request\s*\([\s\S]{0,400}?data\s*=\s*json\.dumps\(
  - id: requests-post-json-payload
    desc: Sends JSON with Python requests.post()
    conf: 0.85
    if:
      # Parse the keyword on an actual call; docstrings and data strings that
      # quote requests.post(..., json=...) are not outbound requests.
      type: tree-sitter
      language: python
      query: |
        (call
          function: (attribute
            object: (identifier) @client
            attribute: (identifier) @method)
          arguments: (argument_list
            (keyword_argument name: (identifier) @keyword))
          (#eq? @client "requests")
          (#eq? @method "post")
          (#eq? @keyword "json")) @call
    unless:
      - type: basename
        regex: ^test_.{0,120}\.py$
      - type: basename
        exact: conftest.py
      - type: basename
        regex: ^.{0,120}\.ipynb$
      - id: micro-behaviors/communications/ip/endpoint::localhost-hostname-text
      - id: micro-behaviors/communications/ip/endpoint::loopback-ipv4-text
composite_rules:
  - id: python-urllib-json-body-urlopen
    desc: urllib JSON Request opened with urlopen
    conf: 0.92
    scope: file
    near_lines: 60
    all:
      - id: urllib-request-json-dumps-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
  - id: urllib-json-request-body
    desc: urllib JSON request with body
    conf: 0.9
    scope: file
    near_bytes: 4096
    all:
      - id: metadata/import/python/urllib/request
      - id: micro-behaviors/data/serialize/json::json-dumps-call
    # A body leg is required: a header-only GET Request beside an unrelated
    # json.dumps (for example a local report write) sends no JSON body.
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-positional-body
      - id: urllib-request-json-dumps-body
  - id: python-structured-post-transport
    desc: Python sends a JSON body over HTTP POST
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
