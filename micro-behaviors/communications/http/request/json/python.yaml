defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - python

traits:
  - id: urllib-request-json-dumps-body
    desc: urllib Request body from json.dumps
    conf: 0.9
    if:
      type: text
      regex: urllib\.request\.Request\s*\([\s\S]{0,400}?data\s*=\s*json\.dumps\(
  - id: requests-post-json-payload
    desc: Sends JSON with Python requests.post()
    conf: 0.85
    if:
      # Parse the keyword on an actual call; docstrings and data strings that
      # quote requests.post(..., json=...) are not outbound requests.
      type: tree-sitter
      language: python
      query: |
        (call
          function: (attribute
            object: (identifier) @client
            attribute: (identifier) @method)
          arguments: (argument_list
            (keyword_argument name: (identifier) @keyword))
          (#eq? @client "requests")
          (#eq? @method "post")
          (#eq? @keyword "json")) @call
    unless:
      - type: basename
        regex: ^test_.{0,120}\.py$
      - type: basename
        exact: conftest.py
      - type: basename
        regex: ^.{0,120}\.ipynb$
      - id: micro-behaviors/communications/ip/endpoint::localhost-hostname-text
      - id: micro-behaviors/communications/ip/endpoint::loopback-ipv4-text
  - id: urllib-request-json-keyword-body
    desc: urllib Request carries serialized JSON data
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        from:
          field: data
          call: '^json\.dumps$'
          through:
            - call: '\.encode$'
              receiver: true
  - id: urllib-request-json-positional-body
    desc: urllib Request carries serialized JSON argument
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 1
        from:
          call: '^json\.dumps$'
          through:
            - call: '\.encode$'
              receiver: true
  - id: urllib-urlopen-json-keyword-body
    desc: urllib urlopen carries serialized JSON data
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: urllib.request.urlopen
      arg:
        from:
          field: data
          call: '^json\.dumps$'
          through:
            - call: '\.encode$'
              receiver: true
  - id: urllib-urlopen-json-positional-body
    desc: urllib urlopen carries serialized JSON argument
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: urllib.request.urlopen
      arg:
        index: 1
        from:
          call: '^json\.dumps$'
          through:
            - call: '\.encode$'
              receiver: true
composite_rules:
  - id: python-urllib-json-body-urlopen
    desc: urllib JSON Request opened with urlopen
    conf: 0.92
    scope: file
    near_lines: 60
    all:
      - id: urllib-request-json-dumps-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
  # The body must derive from JSON serialization, not merely occur nearby.
  - id: urllib-json-request-body
    desc: urllib body derives from JSON serialization
    conf: 0.97
    any:
      - id: urllib-request-json-keyword-body
      - id: urllib-request-json-positional-body
      - id: urllib-urlopen-json-keyword-body
      - id: urllib-urlopen-json-positional-body
  - id: python-json-body-transport
    desc: Python HTTP body carries serialized JSON
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
