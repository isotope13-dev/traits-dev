defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: urllib-json-body-environment-names
    desc: urllib JSON body carries environment names
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        from:
          field: data
          call: '^os\.environ\.keys$'
          through:
            - call: '^sorted$'
              arguments: [0]
            - call: '^json\.dumps$'
              arguments: [0]
            - call: '\.encode$'
              receiver: true
