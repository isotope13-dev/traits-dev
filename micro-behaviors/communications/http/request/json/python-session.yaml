# A parsed method/keyword shape, not proof of a trusted HTTP client binding.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-post-json-method
    desc: Post method receives a JSON argument
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute attribute: (identifier) @method)
          arguments: (argument_list (keyword_argument name: (identifier) @keyword)))
          (#eq? @method "post") (#eq? @keyword "json"))
