# A public-IP URL is not evidence of attacker ownership. The match does not
# bind the JSON request or URL to the module-level urlopen call.
defaults:
  crit: notable
  conf: 0.96
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: module-urlopen-json-external-ip-cooccurrence
    desc: Module-body urlopen, JSON request and external-IP URL co-occur
    all:
      - id: micro-behaviors/data/control-flow/module-exec::python-module-level-urlopen-call
      - id: urllib-json-request-body
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
