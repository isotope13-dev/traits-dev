defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # The flow producer currently represents os.environ as an unknown merge.
  # Inspect the actual data keyword rather than an unrelated JSON dump nearby.
  - id: python-environ-json-request-send
    desc: urllib opens full-environment JSON request
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((_ (expression_statement (assignment
          left: (identifier) @request_var
          right: (call
            function: (attribute
              object: (attribute object: (identifier) @module
                attribute: (identifier) @submodule)
              attribute: (identifier) @method)
            arguments: (argument_list
              (keyword_argument name: (identifier) @keyword value: (_) @body)))))
          . (expression_statement (call
            function: (attribute
              object: (attribute object: (identifier) @send_module
                attribute: (identifier) @send_submodule)
              attribute: (identifier) @send_method)
            arguments: (argument_list (identifier) @sent))))
        (#eq? @module "urllib")
        (#eq? @submodule "request")
        (#eq? @method "Request")
        (#eq? @send_module "urllib")
        (#eq? @send_submodule "request")
        (#eq? @send_method "urlopen")
        (#eq? @request_var @sent)
        (#eq? @keyword "data")
        (#match? @body "^json\\.dumps\\(\\s*dict\\(\\s*os\\.environ\\s*\\)\\s*\\)"))
        ((_ (expression_statement (assignment
          left: (identifier) @request_var
          right: (call
            function: (attribute
              object: (attribute object: (identifier) @module
                attribute: (identifier) @submodule)
              attribute: (identifier) @method)
            arguments: (argument_list
              (keyword_argument name: (identifier) @keyword value: (_) @body)))))
          . (expression_statement (call
            function: (attribute
              object: (identifier) @header_request
              attribute: (identifier) @header_method)))
          . (expression_statement (call
            function: (attribute
              object: (attribute object: (identifier) @send_module
                attribute: (identifier) @send_submodule)
              attribute: (identifier) @send_method)
            arguments: (argument_list (identifier) @sent))))
        (#eq? @module "urllib")
        (#eq? @submodule "request")
        (#eq? @method "Request")
        (#eq? @header_request @request_var)
        (#eq? @header_method "add_header")
        (#eq? @send_module "urllib")
        (#eq? @send_submodule "request")
        (#eq? @send_method "urlopen")
        (#eq? @request_var @sent)
        (#eq? @keyword "data")
        (#match? @body "^json\\.dumps\\(\\s*dict\\(\\s*os\\.environ\\s*\\)\\s*\\)"))
