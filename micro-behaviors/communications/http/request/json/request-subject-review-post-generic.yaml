defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - php
  - html
  - shell
  mbc: C0002
  crit: notable
traits:
- id: fetch-flow-json-post-body
  desc: fetch POST sends a JSON.stringify body
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    exact: fetch
    args:
    - index: 1
      from:
        field: method
        value: ^POST$
    - index: 1
      from:
        field: body
        call: ^JSON\.stringify$
