defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
traits:
  - id: json-chat-id-and-text-body
    desc: JSON body includes chat ID and text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'body\s*:\s*JSON\.stringify\(\s*\{\s*chat_id\s*:[^,]{1,100},\s*text\s*:'
