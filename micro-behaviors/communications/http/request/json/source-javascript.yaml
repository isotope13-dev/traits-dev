defaults:
  platforms:
    - unix
    - windows
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: fetch-json-body
    desc: fetch() sends JSON body
    crit: notable
    conf: 0.82
    count_min: 2
    if:
      type: text
      regex: "fetch\\(.{0,220}'body':JSON\\["
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
composite_rules:
  - id: node-http-post-json-body
    desc: Node HTTP request posts a JSON body
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/request/body::node-http-bound-or-named-request-body
      - id: micro-behaviors/communications/http/request/json::http-post-json
  - id: http-post-json
    desc: HTTP POST request with JSON content
    crit: notable
    conf: 0.75
    all:
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/header/content-type::application-json
