defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: visible-conversation-reader-call
    desc: Calls a visible conversation text reader
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bgetVisible(Conversation|Chat)Text\s*\('

composite_rules:
  - id: conversation-reader-and-json-post
    desc: Visible conversation reader and JSON POST co-occur
    crit: notable
    conf: 0.9
    all:
      - id: visible-conversation-reader-call
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
