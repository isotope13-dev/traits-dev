defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: urllib-json-body-host-identity
    desc: urllib body contains serialized host identity
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        from:
          field: data
          call: '^(socket\.gethostname|getpass\.getuser)$'
          through:
            - call: '^json\.dumps$'
              arguments: [0]
            - call: '\.encode$'
              receiver: true
  # NOTE (2026-11-02): an alias-tolerant sibling (regex callee plus
  # unanchored provenance calls) was tried here and reverted after it
  # matched nothing in testing: a file using only import urllib.request
  # as _u yields no symbol-call record the matcher can see (cleave facts
  # lists the call solely under python.module_alias_calls), so neither
  # exact nor regex call matchers observe it. Alias-evasive beacons remain
  # a coverage gap; see the consuming composite's header comment.
