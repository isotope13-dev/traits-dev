defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: urllib-json-body-host-identity
    desc: urllib body contains serialized host identity
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        from:
          field: data
          call: '^(socket\.gethostname|getpass\.getuser)$'
          through:
            - call: '^json\.dumps$'
              arguments: [0]
            - call: '\.encode$'
              receiver: true
