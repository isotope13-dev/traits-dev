traits:
- id: go-host-user-json-body
  desc: Go HTTP body includes hostname and username
  if:
    type: tree-sitter
    query: |
      ((block (statement_list
        (short_var_declaration
          left: (expression_list (identifier) @host (identifier))
          right: (expression_list (call_expression function: (selector_expression
            operand: (identifier) @os field: (field_identifier) @hostname))))
        . (short_var_declaration
          left: (expression_list (identifier) @user (identifier))
          right: (expression_list (call_expression function: (selector_expression
            operand: (identifier) @users field: (field_identifier) @current))))
        . (short_var_declaration
          left: (expression_list (identifier) @data (identifier))
          right: (expression_list (call_expression
            function: (selector_expression operand: (identifier) @json field: (field_identifier) @marshal)
            arguments: (argument_list (composite_literal body: (literal_value
              (keyed_element value: (literal_element (call_expression
                function: (selector_expression operand: (identifier) @fmt field: (field_identifier) @sprintf)
                arguments: (argument_list
                  (identifier) @host_use
                  (selector_expression operand: (identifier) @user_use field: (field_identifier) @username)))))))))))
        . (short_var_declaration
          left: (expression_list (identifier) @req (identifier))
          right: (expression_list (call_expression
            function: (selector_expression operand: (identifier) @http field: (field_identifier) @newrequest)
            arguments: (argument_list
              . (interpreted_string_literal) @method . (_)
              . (call_expression
                function: (selector_expression operand: (identifier) @bytes field: (field_identifier) @reader)
                arguments: (argument_list . (identifier) @body .)) .))))
        . (expression_statement (call_expression))*
        . (short_var_declaration right: (expression_list (call_expression
          function: (selector_expression field: (field_identifier) @do)
          arguments: (argument_list . (identifier) @sent .)))))) @report
        (#eq? @os "os") (#eq? @hostname "Hostname")
        (#eq? @users "user") (#eq? @current "Current")
        (#eq? @json "json") (#eq? @marshal "Marshal")
        (#eq? @fmt "fmt") (#eq? @sprintf "Sprintf")
        (#eq? @host @host_use) (#eq? @user @user_use) (#eq? @username "Username")
        (#eq? @http "http") (#eq? @newrequest "NewRequest")
        (#eq? @bytes "bytes") (#eq? @reader "NewReader")
        (#eq? @data @body) (#eq? @req @sent) (#eq? @do "Do"))
