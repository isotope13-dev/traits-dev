defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable

traits:
  - id: powershell-http-body-parameter
    desc: PowerShell HTTP call specifies a request body
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((command
          command_name: [(command_name) (command_name_expr)] @client
          command_elements: (command_elements
            (command_parameter) @parameter)) @call
          (#match? @client "(?i)^(Invoke-WebRequest|Invoke-RestMethod|iwr|irm)$")
          (#match? @parameter "(?i)^-Body:?$"))
