# Binding CI secret interpolations to a request payload is not authentication.
defaults:
  for: [github-actions]
  platforms: [unix, windows]
traits:
- id: multiple-secrets-in-curl-body
  desc: Multiple Actions secrets in quoted curl body
  crit: notable
  conf: 0.98
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '(?m)^\s*curl\b.{0,80}(-d|--data\S*)\s*[''"]([^''"\n]*\$\{\{\s*secrets\.){2}'
