# HTTP observations relocated from the legacy Invoke-WebRequest catalog.
# Matchers, file types, platforms, confidence and criticality are preserved.
defaults:
  platforms: [windows]
  for: [powershell]
  mbc: C0002

traits:
- id: powershell-http-body-value
  desc: PowerShell HTTP call supplies a body value
  crit: notable
  conf: 0.6
  if:
    type: tree-sitter
    query: |
      ((command
          command_name: [(command_name) (command_name_expr)] @client
          command_elements: (command_elements
            (command_parameter) @body_parameter
            . (command_argument_sep)
            . [(generic_token) (array_literal_expression)] @body_value)) @call
        (#match? @client "(?i)^(Invoke-WebRequest|Invoke-RestMethod|iwr|irm|'Invoke-WebRequest'|'Invoke-RestMethod'|'iwr'|'irm'|\"Invoke-WebRequest\"|\"Invoke-RestMethod\"|\"iwr\"|\"irm\")$")
        (#match? @body_parameter "(?i)^-Body:?$"))

composite_rules:
- id: powershell-body-or-upload
  desc: HTTP body or upload with corroborating syntax
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-upload
  - id: metadata/lang/source/syntax/command::powershell-post-method-option
  - id: micro-behaviors/communications/http/request/payload::powershell-http-body-value

- id: powershell-http-post-body
  desc: PowerShell HTTP request specifies POST and a body
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/post::powershell-post-method
  - id: micro-behaviors/communications/http/request/payload::powershell-http-body-value

