defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.98

composite_rules:
  # A configurable webhook carrying a self-contained browser-session share URL
  # is a transfer capability.  Theft requires separate evidence that the
  # destination is attacker-controlled or that sharing occurs without consent.
  - id: python-browser-session-share-webhook-delivery
    desc: Posts browser-session share link to webhook
    all:
      - id: micro-behaviors/communications/http/url/build::share-link-creation-call
      - id: micro-behaviors/data/collection/map::mapping-get-cookies-key
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
