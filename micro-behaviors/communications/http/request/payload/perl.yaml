defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [perl]

traits:
  # A hand-written HTTP request over a raw socket carrying a binary body.
  # Server test suites and minimal clients do this against their own
  # listener; it reports nothing by itself.
  - id: perl-raw-socket-octet-stream-request
    desc: Perl raw socket sends octet-stream body
    if:
      type: text
      regex: 'IO::Socket::INET->new[\s\S]{0,420}application/octet-stream'
