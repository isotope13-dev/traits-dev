defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: function-input-spread-json-post
    desc: Function input spread into JSON POST body
    if:
      # Bind the incoming object to the serialized request payload. A nearby
      # JSON.stringify of unrelated state cannot satisfy this observation.
      type: tree-sitter
      query: |
        ((function_declaration
          parameters: (formal_parameters (identifier) @input)
          body: (statement_block
            (try_statement
              body: (statement_block
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @payload
                    value: (object
                      (spread_element (identifier) @spread))))
                (lexical_declaration
                  (variable_declarator
                    value: (await_expression
                      (call_expression
                        function: (identifier) @fetch
                        arguments: (arguments
                          (_)
                          (object
                            (pair key: (property_identifier) @method
                              value: (string) @verb)
                            (pair key: (property_identifier) @body
                              value: (call_expression
                                function: (member_expression
                                  object: (identifier) @json
                                  property: (property_identifier) @stringify)
                                arguments: (arguments (identifier) @serialized))))))))))))) @handler
          (#eq? @input @spread)
          (#eq? @payload @serialized)
          (#eq? @fetch "fetch")
          (#eq? @method "method")
          (#match? @verb "^['\"]POST['\"]$")
          (#eq? @body "body")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify"))
