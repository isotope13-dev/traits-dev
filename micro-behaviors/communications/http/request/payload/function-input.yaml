defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: function-input-spread-json-post
    desc: Function input spread into JSON POST body
    if:
      # Bind the incoming object to the serialized request payload. A nearby
      # JSON.stringify of unrelated state cannot satisfy this observation.
      type: tree-sitter
      query: |
        ((function_declaration
          parameters: (formal_parameters (identifier) @input)
          body: (statement_block
            (try_statement
              body: (statement_block
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @payload
                    value: (object
                      (spread_element (identifier) @spread))))
                (lexical_declaration
                  (variable_declarator
                    value: (await_expression
                      (call_expression
                        function: (identifier) @fetch
                        arguments: (arguments
                          (_)
                          (object
                            (pair key: [(property_identifier) (string)] @method
                              value: (string) @verb)
                            (pair key: [(property_identifier) (string)] @body
                              value: (call_expression
                                function: [(member_expression
                                  object: (identifier) @json
                                  property: (property_identifier) @stringify)
                                  (subscript_expression
                                    object: (identifier) @json
                                    index: (string) @stringify)]
                                arguments: (arguments (identifier) @serialized))))))))))))) @handler
          (#eq? @input @spread)
          (#eq? @payload @serialized)
          (#eq? @fetch "fetch")
          (#any-of? @method "method" "\"method\"" "\"\\u006D\\u0065\\u0074\\u0068\\u006F\\u0064\"" "\"\\u006d\\u0065\\u0074\\u0068\\u006f\\u0064\"" "'method'" "'\\u006D\\u0065\\u0074\\u0068\\u006F\\u0064'" "'\\u006d\\u0065\\u0074\\u0068\\u006f\\u0064'")
          (#any-of? @verb "\"POST\"" "\"\\u0050\\u004F\\u0053\\u0054\"" "\"\\u0050\\u004f\\u0053\\u0054\"" "'POST'" "'\\u0050\\u004F\\u0053\\u0054'" "'\\u0050\\u004f\\u0053\\u0054'")
          (#any-of? @body "body" "\"body\"" "\"\\u0062\\u006F\\u0064\\u0079\"" "\"\\u0062\\u006f\\u0064\\u0079\"" "'body'" "'\\u0062\\u006F\\u0064\\u0079'" "'\\u0062\\u006f\\u0064\\u0079'")
          (#eq? @json "JSON")
          (#any-of? @stringify "stringify" "\"stringify\"" "\"\\u0073\\u0074\\u0072\\u0069\\u006E\\u0067\\u0069\\u0066\\u0079\"" "\"\\u0073\\u0074\\u0072\\u0069\\u006e\\u0067\\u0069\\u0066\\u0079\"" "'stringify'" "'\\u0073\\u0074\\u0072\\u0069\\u006E\\u0067\\u0069\\u0066\\u0079'" "'\\u0073\\u0074\\u0072\\u0069\\u006e\\u0067\\u0069\\u0066\\u0079'"))
