defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: fetch-post-json-body
    desc: fetch POST serializes a JSON request body
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments) @args)
         (#eq? @fn "fetch")
         (#match? @args "method\\s*:\\s*['\"]POST['\"]")
         (#match? @args "body\\s*:\\s*JSON\\.stringify\\s*\\("))
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/harness/runtime/

