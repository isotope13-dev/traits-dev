defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: post-chunking-marker
    desc: HTTP POST carries a chunking marker
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      regex: '(?s)POST.{0,240}(cat=|chunk=|part=|fragment=|Transfer-Encoding: chunked)'

  - id: fetch-post-json-body
    desc: fetch POST serializes a JSON request body
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments) @args)
         (#eq? @fn "fetch")
         (#match? @args "method\\s*:\\s*['\"]POST['\"]")
         (#match? @args "body\\s*:\\s*JSON\\.stringify\\s*\\("))
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/harness/runtime/

  - id: fetch-endpoint-post-json-body
    desc: fetch posts JSON to endpoint variable
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments) @args)
         (#eq? @fn "fetch")
         (#match? @args "^\\(\\s*(endpoint|url|target)\\s*,")
         (#match? @args "method\\s*:\\s*['\"]POST['\"]")
         (#match? @args "body\\s*:\\s*JSON\\.stringify\\s*\\("))
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/harness/runtime/

  - id: html-json-request-body
    desc: Script serializes JSON request body
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '\bbody\s*:\s*JSON\.stringify\(\s*\{'

  - id: html-json-message-field
    desc: HTML script serializes a message field
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '\b(text|caption)\s*:\s*JSON\.stringify\('

composite_rules:
  - id: html-nested-json-message-body
    desc: HTML request wraps a serialized JSON message
    crit: notable
    conf: 0.95
    for: [html, javascript, typescript, php]
    near_bytes: 400
    all:
      - id: html-json-request-body
      - id: html-json-message-field
