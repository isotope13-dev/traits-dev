defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: post-chunking-marker
    desc: HTTP POST carries a chunking marker
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      regex: '(?s)POST.{0,240}\b(cat=|chunk=|part=|fragment=|Transfer-Encoding: chunked)'

  - id: fetch-endpoint-post-json-body
    desc: fetch posts JSON to endpoint variable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: fetch
      args:
        - index: 0
          kind: identifier
          name_regex: '^(endpoint|url|target)$'
        - index: 1
          kind: object
          from:
            field: method
            whole_value: '^POST$'
        - index: 1
          kind: object
          from:
            field: body
            call: '^JSON\.stringify$'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/harness/runtime/
