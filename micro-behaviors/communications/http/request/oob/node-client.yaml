defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: node-oob-http-client
    desc: OOB endpoint near a JavaScript HTTP client
    crit: component
    conf: 0.93
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
