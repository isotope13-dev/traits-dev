# Composer post-install URL and quiet curl clues.
defaults:
  platforms: [unix, windows]
  for: [composer.json]

composite_rules:
  - id: composer-silent-post-install-oob-callback
    desc: Composer post-install URL and quiet curl clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/package/scripts/lifecycle::composer-post-install-webhook-site
      - id: micro-behaviors/communications/http/download/curl::curl-silent-fail-flags-embedded-text
