defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: pypi-wheel-runtime-oob-exfiltration
    for: [whl]
    desc: PyPI wheel with OOB JSON callback clues
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/http/webhook::python-oob-json-callback-context
      - id: metadata/package/files/wheel-sdist::wheel-dist-info-member
