defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: init-oob-callback
  desc: Init file with HTTP and CanaryTokens clues
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/http/request/client::request-python
  any:
  - id: micro-behaviors/communications/url/host/oob/endpoint::canarytokens-com
  - id: micro-behaviors/communications/url/host/oob/endpoint::canarytokens-traffic-path
- id: init-canarytokens-traffic-callback
  desc: Init file with CanaryTokens traffic clues
  crit: suspicious
  conf: 0.98
  all:
  - id: init-oob-callback
  - id: micro-behaviors/communications/url/host/oob/endpoint::canarytokens-traffic-path
