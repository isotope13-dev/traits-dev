# Ruby call facts retain identifier arguments, but do not resolve the URI
# assignment through the intervening form hash. Bind the URI to the POST;
# an unused webhook URL beside an unrelated request is insufficient.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.99
traits:
  - id: ruby-form-post-webhook-destination
    desc: Ruby form POST targets webhook.site
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @uri right:
              [(call method: (constant) @uri_class arguments: (argument_list . (string (string_content) @destination) .))
               ((call receiver: (constant) @uri_class method: (identifier) @uri_method
                 arguments: (argument_list . (string (string_content) @destination) .))
                 (#eq? @uri_method "parse"))])
            . (assignment left: (identifier) @form right: (hash))
            . [(call receiver: (scope_resolution) @http method: (identifier) @post
              arguments: (argument_list . (identifier) @sent_uri . (identifier) @sent_form .)) @evidence
               (assignment right: (call receiver: (scope_resolution) @http method: (identifier) @post
              arguments: (argument_list . (identifier) @sent_uri . (identifier) @sent_form .)) @evidence)])
          (#eq? @uri_class "URI")
          (#match? @destination "(?i)^https?://webhook\\.site/[0-9a-f-]{36}([/?#]|$)")
          (#eq? @http "Net::HTTP") (#eq? @post "post_form")
          (#eq? @uri @sent_uri) (#eq? @form @sent_form)
          (#set! cleave.ignore-comments "true"))
