defaults:
  platforms: [unix, windows]
  for: [package.json, shell]
traits:
  - id: preinstall-gh-token-webhook-post
    desc: Preinstall curl token-to-webhook command
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts.preinstall
      regex: 'curl\s+(-d|--data)\s+["'']?\$\(gh\s+auth\s+token\)["'']?\s+https?://webhook\.site/'

  - id: curl-webhook-post
    desc: curl post to webhook.site
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: curl\s+-d.{0,200}webhook\.site/[0-9a-f-]{36}
