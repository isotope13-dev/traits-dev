defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
composite_rules:
- for:
  - python
  id: init-network-pingback
  desc: Import time network pingback
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/url/host/oob/endpoint::interact-sh-me-fun
  any:
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
  - id: micro-behaviors/communications/http/request/client::url-literal

