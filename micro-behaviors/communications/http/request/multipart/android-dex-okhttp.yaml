defaults:
  platforms: [android]
  for: [dex]
  attack: T1071.001

traits:
  - id: android-dex-okhttp-request-builder
    desc: DEX references OkHttp Request.Builder
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Lokhttp3/Request$Builder;'

  - id: android-dex-okhttp-multipart-builder
    desc: DEX references OkHttp multipart request builder
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Lokhttp3/MultipartBody$Builder;'


composite_rules:
  - id: android-dex-okhttp-multipart-post
    desc: Android DEX constructs an OkHttp multipart POST request
    crit: notable
    conf: 0.96
    for: [android_apk, zip, dex]
    scope: archive
    all:
      - id: android-dex-okhttp-request-builder
      - id: android-dex-okhttp-multipart-builder
      - id: micro-behaviors/communications/http/post::native-post-method-token

