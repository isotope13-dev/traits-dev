defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: multipart-parent-path-filename
    desc: Multipart filename contains parent traversal
    if:
      type: text
      regex: '(?i);\s*filename\s*=\s*"[^"\r\n]{0,80}(\.\.[/\\]){2,12}[^"\r\n]{1,180}"'

  - id: python-files-parent-path-filename
    desc: Python multipart tuple has traversal filename
    for: [python]
    if:
      type: text
      regex: '\bfiles\s*=\s*\{[^\r\n]{0,120}:\s*\(\s*["''](\.\.[/\\]){2,12}[^"''\r\n]{1,180}["'']\s*,'

  - id: formdata-parent-path-filename
    desc: FormData append supplies a traversal filename
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '\.append\s*\([^,\n]{1,100},[^,\n]{1,120},\s*["''](\.\.[/\\]){2,12}'

composite_rules:
  - id: multipart-traversal-filename
    desc: Multipart filename escapes upload directory
    any:
      - id: multipart-parent-path-filename
      - id: python-files-parent-path-filename
      - id: formdata-parent-path-filename
