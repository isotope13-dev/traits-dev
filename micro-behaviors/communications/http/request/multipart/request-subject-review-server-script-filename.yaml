defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
  - id: multipart-server-script-filename
    desc: Multipart filename has a server-script suffix
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/form::multipart-php-script-filename
      - id: micro-behaviors/communications/http/form::multipart-managed-script-filename
      - id: micro-behaviors/communications/http/form::multipart-cgi-script-filename
