defaults:
  crit: notable
  platforms:
  - macos
  for:
  - macho

traits:
  - id: macos-curl-mime-init
    desc: Mach-O imports curl_mime_init
    conf: 0.92
    if:
      type: import
      regex: curl_mime_init

  - id: macos-curl-mime-addpart
    desc: Mach-O imports curl_mime_addpart
    conf: 0.9
    if:
      type: import
      regex: curl_mime_addpart

  - id: macos-curl-mime-filename
    desc: Mach-O imports curl_mime_filename
    conf: 0.9
    if:
      type: import
      regex: curl_mime_filename


composite_rules:
  - id: macos-libcurl-mime-upload
    desc: Mach-O libcurl MIME multipart upload
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/library::macos-curl-easy-init
      - id: micro-behaviors/communications/http/client/library::macos-curl-easy-perform
      - id: micro-behaviors/communications/http/request/multipart::macos-curl-mime-init
      - id: micro-behaviors/communications/http/request/multipart::macos-curl-mime-addpart
