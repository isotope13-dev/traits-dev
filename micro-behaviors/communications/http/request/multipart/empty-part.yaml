# An optional empty file control beside a script upload does not establish
# parser disagreement. The functional payload is detected by webshell/upload.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
  - id: empty-and-server-script-parts
    desc: Empty and server-script multipart parts
    crit: notable
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/form::multipart-empty-filename
      - id: micro-behaviors/communications/http/request/multipart::multipart-server-script-filename
