defaults:
  platforms: [windows, unix, android]
  for:
    - java
    - class
    - jar
    - zip

traits:
  - id: jvm-multipart-form-disposition
    desc: JVM multipart form disposition
    crit: notable
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)Content-Disposition: form-data;'
