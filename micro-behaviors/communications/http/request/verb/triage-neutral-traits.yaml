---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
  conf: 0.96
traits:
- id: javascript-curl-post-command
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: JavaScript shell curl POST command
  if:
    type: string_literal
    regex: "\\bcurl(\\s+-[a-zA-Z]+){0,4}\\s+-X\\s+POST\\b"
