defaults:
  platforms:
  - windows
  - unix
  for:
  - rust
  - go
  - c
  - cpp
  - python
  - powershell
  - javascript
  - typescript
  - shell
traits:
- id: post-command-line-option
  desc: POST method command-line option
  crit: notable
  conf: 0.8
  for:
  - shell
  - powershell
  - batch
  if:
    type: text
    regex: '(?i)(-X\s*POST|--request\s+POST)'
