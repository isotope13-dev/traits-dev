  - windows
  - unix
  for:
  - rust
  - go
  - c
  - cpp
  - python
  - powershell
  - javascript
  - typescript
  - shell
composite_rules:
- id: http-write-request-method
  desc: Uses an HTTP write request method
  crit: notable
  conf: 0.92
  any:
