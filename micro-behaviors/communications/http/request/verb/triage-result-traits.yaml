  - id: micro-behaviors/communications/http/post::http-post-client-call
  - id: micro-behaviors/communications/http/curl::curl-post-flag
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/lib/requests::requests-put
