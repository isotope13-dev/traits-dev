defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: urllib-request-implicit-post
    desc: urllib body selects default POST method
    crit: notable
    conf: 0.95
    # urllib selects POST when data is supplied and method is omitted.
    # Keep explicit methods (including GET with a body) out of this rule.
    # The call/keyword relationship needs AST structure, not file proximity.
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute object: (attribute object: (identifier) @root
            attribute: (identifier) @module) attribute: (identifier) @ctor)
          arguments: (argument_list
            (keyword_argument name: (identifier) @keyword value: (_) @body)) @args)
          (#eq? @root "urllib")
          (#eq? @module "request")
          (#eq? @ctor "Request")
          (#eq? @keyword "data")
          (#not-match? @body "^None$")
          (#not-match? @args "\\bmethod\\s*=|\\*"))
