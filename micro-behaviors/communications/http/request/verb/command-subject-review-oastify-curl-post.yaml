defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  - id: npm-curl-post-text
    desc: Curl command specifies POST
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: "curl\\s+(-[a-zA-Z]+\\s+){0,4}-X\\s+POST\\b"
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
