defaults:
  platforms:
  - unix
  - windows
  for:
  - rust
composite_rules:
- crit: notable
  id: cargo-build-post-arguments
  desc: Build script uses HTTP POST/data arguments
  conf: 0.9
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  any:
  - id: micro-behaviors/communications/http/post::rust-curl-post-argument
  - id: micro-behaviors/communications/http/post::rust-curl-data-argument
