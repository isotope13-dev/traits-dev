# HEAD option or split text reference.
defaults:
  platforms:
  - windows
  for:
  - data
traits:
- id: powershell-head-method-text
  desc: PowerShell HEAD method or fragments
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)(-Method\s+["']?HEAD\b|["']D["'].{0,16}["']HEA["'])
  unless:
  - id: metadata/file/magic/identity::kdt1-geospatial-tree
