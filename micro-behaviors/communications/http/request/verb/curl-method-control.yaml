defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell]
  crit: notable
  conf: 0.98
traits:
  - id: curl-method-control-option
    desc: curl explicitly controls HTTP request method
    if:
      type: symbol
      kind: call
      regex: '(?i)^curl(\.exe)?$'
      arg:
        kind: identifier
        name_regex: '^(-[a-zA-Z]*[GIX][a-zA-Z]*|--get|--head|--request.*)$'

composite_rules:
  - id: curl-method-control-without-post
    desc: curl method control without explicit POST
    # File-scoped exclusion: conservative around multiple curl invocations.
    all:
      - id: curl-method-control-option
    unless:
      - id: micro-behaviors/communications/http/request/verb::post-command-line-option
