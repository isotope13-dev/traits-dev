defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-json-post-clues
    desc: Install-named script has JSON serialization and HTTP POST clues
    crit: notable
    conf: 0.94
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/lang/source/naming/function/communication::http-post-name-reference
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    any:
      - id: micro-behaviors/communications/http/header/content-type::application-json
      - id: micro-behaviors/communications/http/request/verb::post-method-text
