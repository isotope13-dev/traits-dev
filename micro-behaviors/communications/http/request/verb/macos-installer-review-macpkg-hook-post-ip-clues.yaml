defaults:
  platforms: [macos]
  for: [pkg]
composite_rules:
- id: macpkg-hook-post-ip-clues
  desc: Installer hook has curl POST and external IP clues
  crit: suspicious
  conf: 0.98
  platforms: [macos, windows, linux]
  for: [pkg, shell, batch, powershell]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/communications/http/request/verb::curl-post-custom-header
    - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url

