defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: mutating-method-option
    desc: Method option selects POST, PUT or PATCH
    crit: notable
    conf: 0.85
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)\bmethod["'']?\s*:\s*["''](POST|PUT|PATCH)["'']'
