defaults:
  platforms: [ios]
  for: [swift]
  attack: T1041

composite_rules: []

traits:
  - id: swift-urlsession-post-method-reference
    desc: "URLSession and HTTP POST method references"
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'URLSession\.shared[\s\S]{0,220}httpMethod = "POST"'
