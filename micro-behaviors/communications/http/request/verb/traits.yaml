defaults:
  platforms: [windows, unix]
  mbc: C0002
  attack: T1071.001
traits:
  - id: get-method-literal
    desc: Uppercase GET string literal
    crit: component
    conf: 0.9
    for: [scripts, source]
    if:
      type: string_literal
      exact: GET

  - id: put-method-literal
    desc: Uppercase PUT string literal
    crit: component
    conf: 0.9
    for: [scripts, source]
    if:
      type: string_literal
      exact: PUT

  - id: javascript-mutating-method-branch-cluster
    desc: Branches on mutating HTTP request methods
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    count_min: 3
    if:
      type: text
      regex: '\bmethod\s*===\s*["''][PDU][A-Z]{2,5}["'']'

  - id: urllib-request-post
    desc: Python urllib POST request construction
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'urllib\.request\.Request\([\s\S]{0,260}\bmethod\s*=\s*["'']POST["'']'

  - id: http-request-message-post
    desc: .NET HttpRequestMessage POST construction
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: 'HttpRequestMessage\s*\(\s*HttpMethod\.Post'

  # Some web frameworks accept a query parameter that turns a navigational
  # GET into a state-changing request.  This is a neutral protocol mechanic;
  # exploit composites supply the privileged target and payload context.
  - id: query-method-override-write
    desc: Query overrides HTTP method to write
    crit: notable
    conf: 0.96
    for: [scripts, source, html, text]
    if:
      type: text
      regex: '(?i)([?&]|&amp;)_method=(POST|PUT|PATCH|DELETE)([&#"''\s]|$)'
