defaults:
  platforms: [windows, unix]
  mbc: C0002
  attack: T1071.001
traits:
  - id: javascript-mutating-method-branch-cluster
    desc: Branches on mutating HTTP request methods
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    count_min: 3
    if:
      type: text
      regex: '\bmethod\s*===\s*["''][PDU][A-Z]{2,5}["'']'

  - id: urllib-request-post
    desc: Python urllib POST request construction
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'urllib\.request\.Request\([\s\S]{0,260}\bmethod\s*=\s*["'']POST["'']'

  - id: http-request-message-post
    desc: .NET HttpRequestMessage POST construction
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: 'HttpRequestMessage\s*\(\s*HttpMethod\.Post'
