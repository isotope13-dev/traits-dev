defaults:
  platforms: [windows, unix]
  mbc: C0002
  attack: T1071.001
traits:
  - id: javascript-mutating-method-branch-cluster
    desc: Branches on mutating HTTP request methods
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    count_min: 3
    if:
      type: text
      regex: '\bmethod\s*===\s*["''][PDU][A-Z]{2,5}["'']'

  - id: urllib-request-post
    desc: Python urllib POST request construction
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        from:
          field: method
          whole_value: '^POST$'

  - id: http-request-message-post
    desc: .NET HttpRequestMessage POST construction
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: 'HttpRequestMessage\s*\(\s*HttpMethod\.Post'

  # Some web frameworks accept a query parameter that turns a navigational
  # GET into a state-changing request.  This is a neutral protocol mechanic;
  # exploit composites supply the privileged target and payload context.
  - id: query-method-override-write
    desc: Query overrides HTTP method to write
    crit: notable
    conf: 0.96
    for: [scripts, source, html, text]
    if:
      type: text
      regex: '(?i)([?&]|&amp;)_method=(POST|PUT|PATCH|DELETE)([&#"''\s]|$)'

  # The X-HTTP-Method-Override request header is the same neutral mechanic
  # as the query form above, expressed as a header instead of a parameter.
  # A framework rejecting the overridden verb is a timing/behavior gadget,
  # not an attack by itself; exploit composites supply the target and intent.
  - id: header-method-override-get
    desc: Overrides HTTP method via header to GET
    crit: notable
    conf: 0.94
    for: [python, shell, text]
    if:
      type: text
      regex: '(?i)X-HTTP-Method-Override.{0,6}GET\b'
