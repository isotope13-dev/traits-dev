defaults:
  platforms: [esxi, unix, windows]
  for: [c, cpp, elf, lua, perl, powershell]
  attack: T1041

composite_rules: []

traits:
  - id: c-ssl-write-http-post
    desc: "TLS write near HTTP POST request text"
    crit: suspicious
    conf: 0.92
    for: [c, cpp, elf]
    platforms: [esxi, unix]
    if:
      type: text
      regex: 'SSL_write[\s\S]{0,260}POST /'
  - id: lua-https-post-request
    desc: "HTTPS request with POST method"
    crit: suspicious
    conf: 0.92
    for: [lua]
    platforms: [esxi, unix]
    if:
      type: text
      regex: 'https\.request[\s\S]{0,220}method\s*=\s*"POST"'
