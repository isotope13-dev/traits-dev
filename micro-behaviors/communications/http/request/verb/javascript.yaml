# Taxonomy-only migration of the legacy HTTPS/POST source observation. Keep the
# matcher unchanged here; this is neither a call-ownership nor a body-flow proof.
# Call facts expose an object argument but not its method field. A future
# structured replacement must account for unsupported callback flow and test
# disconnected options, quoted examples, aliases and computed methods first.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: https-post-option-source
    desc: HTTPS request near a POST method option
    if:
      type: text
      regex: 'https\.request\([\s\S]{0,160}method:\s*"POST"'
