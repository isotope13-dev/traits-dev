defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - python

traits:
  - id: python-explicit-http-method-call
    desc: Python request call uses explicit HTTP method
    conf: 0.85
    if:
      type: text
      regex: '\.request\s*\(\s*["''][A-Z]{3,7}["'']'
    unless:
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
