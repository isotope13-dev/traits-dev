---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
composite_rules:
- id: python-http-post-any
  desc: Python HTTP POST method usage
  conf: 0.8
  any:
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/post::http-post-client-call
  - id: micro-behaviors/communications/http/request/verb::httpx-client-post-request
  - id: micro-behaviors/communications/http/request/httpx::httpx-async-client-post
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
- id: httpx-client-post-request
  desc: httpx Client POST request
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/client/initialize::httpx-client
  - id: micro-behaviors/communications/http/post::http-post-client-call
  near_bytes: 2048
