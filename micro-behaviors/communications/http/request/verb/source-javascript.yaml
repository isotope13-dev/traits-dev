defaults:
  platforms:
    - unix
    - windows
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: post-method-text
    desc: Configures an HTTP POST request
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        ((pair
          key: (property_identifier) @key
          value: (string) @value)
         (#eq? @key "method")
         (#match? @value "^['\"]POST['\"]$"))
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
