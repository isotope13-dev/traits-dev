defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body--rx-1
  desc: Python/PowerShell Base64 before POST or upload
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(b64encode|ToBase64String)\b.{0,300}(post|upload)
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body--rx-2
  desc: Python/PowerShell Base64 before HTTP send
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(b64encode|ToBase64String)\b.{0,300}(send|UploadData)
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body--rx-3
  desc: Python/PowerShell Base64 before request
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(b64encode|ToBase64String)\b.{0,300}(request)
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body--rx-4
  desc: Go/JavaScript Base64 before POST or upload
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(base64\.StdEncoding\.EncodeToString|btoa)\b.{0,300}\b(post|upload)\b
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body--rx-5
  desc: Go/JavaScript Base64 before HTTP send
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(base64\.StdEncoding\.EncodeToString|btoa)\b.{0,300}(send|UploadData)
- for:
  - javascript
  - typescript
  id: js-request-base64-body
  desc: Request sends a body derived from btoa
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: ^(request|req|xhr)\.(send|write|end)$
    arg:
      index: 0
      from:
        call: ^btoa$
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body--rx-7
  desc: PHP Base64 before POST or upload
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(base64_encode)\b.{0,300}([^A-Za-z0-9_$]|^)(post|upload)\b
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body--rx-8
  desc: PHP Base64 before HTTP send
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(base64_encode)\b.{0,300}(send|UploadData)
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body--rx-9
  desc: PHP Base64 before request
  crit: component
  conf: 0.8
  if:
    type: text
    regex: (?i)(base64_encode)\b.{0,300}([^A-Za-z0-9_$]|^)(request)\b
composite_rules:
- for:
  - python
  - javascript
  - go
  - php
  - powershell
  id: base64-encoded-post-body
  desc: Base64 encoding near HTTP POST
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-1
  - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-2
  - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-3
  - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-4
  - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-5
  - id: micro-behaviors/communications/http/request/encoded::js-request-base64-body
  - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-7
  - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-8
  - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body--rx-9
  not:
  - regex: Authorization\s*:\s*`Basic\s+\$\{[^}]+\}`
  - substr: api.mailgun.net
  - regex: (?i)base64_encode\s*\(\s*\$_POST
  - regex: (?i)Authorization['"]?\s*=>\s*.{0,80}Basic.{0,120}base64_encode
  unless:
  - id: micro-behaviors/communications/http/request/body::mailgun-urlencoded-basic-auth
  - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
  - id: micro-behaviors/communications/http/basic-auth::js-basic-auth-btoa-template
