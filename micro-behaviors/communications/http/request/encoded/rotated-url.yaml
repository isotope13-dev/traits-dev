defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: rotated-http-url-prefix
    desc: Bit-rotated HTTP URL prefix
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule rotated_http_url_prefix {
          strings:
            $url1 = { d0 e8 e8 e0 74 5e 5e }
            $url2 = { a1 d1 d1 c1 e8 bc bc }
            $url3 = { 43 a3 a3 83 d1 79 79 }
            $url4 = { 86 47 47 07 a3 f2 f2 }
            $url5 = { 0d 8e 8e 0e 47 e5 e5 }
            $url6 = { 1a 1d 1d 1c 8e cb cb }
            $url7 = { 34 3a 3a 38 1d 97 97 }
          condition:
            any of them
        }
