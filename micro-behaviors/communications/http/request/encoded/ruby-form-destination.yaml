# Extensionless Rakefiles require engine recognition as Ruby.
# This matches the request destination expression, not an arbitrary decode.
defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-form-post-base64-destination
    desc: Ruby form POST decodes its destination
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call receiver: (scope_resolution) @http
          method: (identifier) @post
          arguments: (argument_list
            . (call receiver: (constant) @uri
              method: (identifier) @parse
              arguments: (argument_list
                . (call receiver: (constant) @base64
                  method: (identifier) @decode))))) @evidence
          (#eq? @http "Net::HTTP")
          (#eq? @post "post_form")
          (#eq? @uri "URI")
          (#eq? @parse "parse")
          (#eq? @base64 "Base64")
          (#eq? @decode "decode64"))
