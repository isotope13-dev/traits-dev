defaults:
  platforms: [unix, windows]
composite_rules:
- id: ruby-encoded-post-raw-ip-staging
  desc: Encoded POST body with raw IP URL
  crit: suspicious
  conf: 0.94
  near_lines: 12
  for:
  - ruby
  - scripts
  - source
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/data/property/assign::ruby-body-field-assignment
  - id: micro-behaviors/communications/http/post::net-http-post
  - id: micro-behaviors/data/encode/base64::ruby-base64-urlsafe-encode
