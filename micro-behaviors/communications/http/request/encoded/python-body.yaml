defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  - id: urllib-encoded-data-argument
    desc: urllib data argument is encoded or compressed
    if:
      type: symbol
      kind: call
      regex: '^((urllib\.)?request\.)?(Request|urlopen)$'
      arg:
        from:
          field: data
          call: '^((base64\.)?(b64encode|urlsafe_b64encode)|(gzip|zlib)\.compress)$'

  - id: urllib-positional-encoded-body
    desc: urllib receives a positional encoded body
    if:
      type: symbol
      kind: call
      regex: '^((urllib\.)?request\.)?(Request|urlopen)$'
      arg:
        index: 1
        from:
          call: '^((base64\.)?(b64encode|urlsafe_b64encode)|(gzip|zlib)\.compress)$'

  - id: python-client-sends-encoded-data
    desc: Python client sends encoded body data
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)(\.[A-Za-z_]+)*\.(post|put|patch)$'
      arg:
        from:
          field: data
          call: '^((base64\.)?(b64encode|urlsafe_b64encode)|(gzip|zlib)\.compress)$'

  - id: httpx-sends-encoded-content
    desc: HTTPX sends encoded body content
    if:
      type: symbol
      kind: call
      regex: '^httpx(\.[A-Za-z_]+)*\.(post|put|patch)$'
      arg:
        from:
          field: content
          call: '^((base64\.)?(b64encode|urlsafe_b64encode)|(gzip|zlib)\.compress)$'

  - id: httpx-encoded-target-and-content
    desc: HTTPX sends packed data to decoded URL
    if:
      type: symbol
      kind: call
      regex: '^httpx(\.[A-Za-z_]+)*\.(post|put|patch)$'
      args:
        - index: 0
          from:
            call: '^base64\.(b64decode|urlsafe_b64decode)$'
            through:
              - call: '\.decode$'
                receiver: true
        - from:
            field: content
            call: '^(base64\.(b64encode|urlsafe_b64encode)|(gzip|zlib)\.compress)$'

  - id: python-client-encoded-target-and-data
    desc: Sends packed form data to decoded URL
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(post|put|patch)$'
      args:
        - index: 0
          from:
            call: '^base64\.(b64decode|urlsafe_b64decode)$'
            through:
              - call: '\.decode$'
                receiver: true
        - from:
            field: data
            call: '^(base64\.(b64encode|urlsafe_b64encode)|(gzip|zlib)\.compress)$'

composite_rules:
  - id: urllib-encoded-body-near-send
    desc: Encoded urllib body near a send call
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
    any:
      - id: urllib-encoded-data-argument
      - id: urllib-positional-encoded-body
