# Recovered from static string-decoder review. This matches an API name,
# not an invocation; the objective consumer supplies the attack context.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: xor-numbered-password-query
    desc: XOR HTTP query with second login field
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule xor_numbered_password_query {
          strings:
            $name = "\x3f\x6b\x3d\x32\x26\x62\x31\x3d" xor(0-255)
          condition:
            $name
        }
