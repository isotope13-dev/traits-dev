defaults:
  platforms: [windows, unix]
  for: [python, javascript, php, powershell]
composite_rules:
- id: form-mime-base64-post-proximity
  desc: Form MIME and Base64 POST code nearby
  crit: notable
  conf: 0.92
  near_bytes: 2000
  all:
    - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
    - id: micro-behaviors/communications/http/request/encoded::base64-encoded-post-body
  unless:
    - id: well-known/lib/cloud/botocore::sigv4-auth-import
    - id: micro-behaviors/communications/http/request/body/credential::mailgun-urlencoded-basic-auth
    - id: metadata/lang/source/naming/interface/network::swagger-ui-api-reference
    - id: metadata/file/format/source-map::sourcemap
    - id: well-known/lib/ui/ckeditor/distribution/
    - id: metadata/lang/encoding/unicode-escape::unicode-escape-unicode-escape-js-basename
