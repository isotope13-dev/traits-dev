# Outbound HTTP POST transmission of a Base64-encoded JSON payload across
# helper functions or modules.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: json-base64-envelope-post
    desc: POSTs Base64-encoded JSON request payload
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/serialize/json
      - id: micro-behaviors/data/encode/base64
    any:
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/post::session-post
      - id: micro-behaviors/communications/http/post::python-httpclient-post-transport
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::node-http-request-post
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
      - id: micro-behaviors/communications/http/curl/binding::post-data
      - id: micro-behaviors/communications/http/curl/binding::post-data-array
