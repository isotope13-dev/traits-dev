# Require identity interpolation -> Base64 result -> the same POST object's
# body. Unrelated identity logging, encoding and HTTP operations cannot join.
# Request construction does not establish that a request was sent.
# The destination accepts both URI("...") and URI.parse("...") spellings;
# any other URI.* constructor around an http(s) literal is the same shape.
defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-base64-user-platform-post-body-flow
    desc: Base64 user/platform feeds POST body
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @encoded
              right: (call receiver: (constant) @base64 method: (identifier) @encode
                arguments: (argument_list (string
                  (interpolation (constant) @platform)
                  (interpolation (element_reference object: (constant) @environment
                    (string (string_content) @user)))))))
            [(assignment left: (identifier) @request
              right: (call receiver: (scope_resolution) @post method: (identifier) @new
                arguments: (argument_list (call method: (constant) @uri
                  arguments: (argument_list (string (string_content) @endpoint))))))
             (assignment left: (identifier) @request
              right: (call receiver: (scope_resolution) @post method: (identifier) @new
                arguments: (argument_list (call receiver: (constant) @uri method: (identifier)
                  arguments: (argument_list (string (string_content) @endpoint))))))]
            (assignment left: (call receiver: (identifier) @body_request method: (identifier) @body)
              right: (identifier) @body_source))
          (#eq? @base64 "Base64") (#match? @encode "^(urlsafe_encode64|strict_encode64|encode64)$")
          (#eq? @platform "RUBY_PLATFORM") (#eq? @environment "ENV")
          (#match? @user "^(USER|USERNAME)$") (#eq? @post "Net::HTTP::Post")
          (#eq? @new "new") (#eq? @uri "URI") (#match? @endpoint "^https?://")
          (#eq? @request @body_request) (#eq? @body "body") (#eq? @encoded @body_source))
