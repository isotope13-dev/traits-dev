defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, text]

composite_rules:
  - id: method-override-admin-account-clues
    desc: Cross-route administrator account URL clues
    crit: suspicious
    conf: 0.98
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/verb::query-method-override-write
      - id: micro-behaviors/communications/http/request/params::account-credential-query-triplet
      - id: micro-behaviors/communications/http/request/params::namespaced-route-query-value
      - id: micro-behaviors/communications/url/query/selection::administrator-role-query-parameter

  - id: wordpress-rest-admin-method-override-clues
    desc: WordPress admin REST method-override clues
    crit: suspicious
    conf: 0.99
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: micro-behaviors/communications/http/request/verb::query-method-override-write
      - id: micro-behaviors/communications/http/request/params::account-credential-query-triplet
      - id: micro-behaviors/communications/url/query/selection::administrator-role-query-parameter

  - id: wordpress-cross-route-admin-method-clues
    desc: WordPress cross-route administrator URL clues
    crit: suspicious
    conf: 0.995
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: micro-behaviors/communications/http/request/verb::query-method-override-write
      - id: micro-behaviors/communications/http/request/params::account-credential-query-triplet
      - id: micro-behaviors/communications/http/request/params::namespaced-route-query-value
      - id: micro-behaviors/communications/url/query/selection::administrator-role-query-parameter
