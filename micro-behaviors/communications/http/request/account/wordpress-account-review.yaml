defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: wp-admin-user-new-form-endpoint
    desc: WordPress new-user admin form endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)/wp-admin/user-new\.php\b'

  - id: wp-create-user-form-action
    desc: WordPress user-creation form action
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[&?"''])action=createuser([&"'']|$)'

  - id: wp-form-administrator-role
    desc: WordPress user form assigns administrator role
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(^|[&?])role=administrator([&"'']|$)'

  - id: wp-formdata-user-login-append
    desc: Form data appends WordPress username
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.append\s*\(\s*["'']user_login["'']\s*,'
  - id: wp-formdata-administrator-role-append
    desc: Form data assigns administrator role
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.append\s*\(\s*["'']role["'']\s*,\s*["'']administrator["'']'

composite_rules:
  - id: js-wordpress-admin-create-clues
    desc: WordPress admin REST and credential clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: metadata/lang/source/syntax/identity-field::administrator-role-field
      - id: metadata/lang/source/naming/function/account::hardcoded-account-credential-triplet
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1200

  - id: js-wordpress-admin-form-clues
    desc: WordPress admin form and fetch clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/account::wp-admin-user-new-form-endpoint
      - id: micro-behaviors/communications/http/request/account::wp-create-user-form-action
      - id: micro-behaviors/communications/http/request/account::wp-form-administrator-role
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1800

  - id: js-wordpress-hostname-admin-clues
    desc: WordPress hostname and admin creation clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: metadata/lang/source/syntax/identity-field::administrator-role-field
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::hostname-hash-account-field-clues
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 3500

  - id: js-wordpress-formdata-admin-clues
    desc: WordPress admin FormData and fetch clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/account::wp-admin-user-new-form-endpoint
      - id: micro-behaviors/communications/http/request/account::wp-formdata-user-login-append
      - id: micro-behaviors/communications/http/request/account::wp-formdata-administrator-role-append
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 2048

