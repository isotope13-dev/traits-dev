defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: dahua-account-config-request
    desc: Requests Dahua account configuration over HTTP
    crit: notable
    conf: 0.97
    if:
      type: literal
      regex: '^GET /cgi-bin/configManager\.cgi\?action=getConfig&name=Account HTTP/1\.[01]'

