defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: dahua-add-user-endpoint
    desc: User-add endpoint path and action text
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'userManager.cgi?action=addUser'


composite_rules:
  - id: dahua-admin-user-add
    desc: User-add endpoint and admin-group clues
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/account::dahua-add-user-endpoint
    any:
      - id: metadata/lang/source/syntax/identity-field::admin-group-selection
      - id: metadata/lang/source/syntax/identity-field::primary-admin-group-selection


