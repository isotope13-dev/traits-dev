defaults:
  platforms: [windows, unix]
  for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]
  attack: T1071.001
  mbc: C0002

# A result observation is only complete when a request method, a payload
# carrier, and a structured result field occur together.  Response parsing or
# a callback passed to send() is deliberately insufficient.
traits:
  - id: http-result-field
    desc: Structured result field
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)["''](result|output|stdout|stderr)["'']\s*:\s*["'']'

  - id: http-result-payload-field
    desc: Named payload field
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)["''](json|data|body|payload)["'']\s*:\s*["'']'

  - id: http-put-client-call
    desc: HTTP PUT client call
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(requests|httpx|axios)\s*\.\s*put\s*\('

  - id: http-post-client-call
    desc: HTTP POST client call
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(requests|httpx|axios)\s*\.\s*post\s*\('

  - id: http-put-method
    desc: HTTP PUT method field
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)["'']method["'']\s*:\s*["'']PUT["'']'

  - id: http-post-method
    desc: HTTP POST method field
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)["'']method["'']\s*:\s*["'']POST["'']'

  - id: http-curl-call
    desc: curl HTTP client call
    crit: notable
    conf: 0.85
    for: [shell, powershell]
    if:
      type: text
      regex: '(?im)(^|[;&|`$({])\s*(/usr/bin/)?curl\b'
    unless:
      - id: well-known/tool/detection/agentskillmap/

  - id: http-put-option
    desc: curl PUT method option
    crit: component
    conf: 0.8
    for: [shell, powershell]
    if:
      type: text
      regex: '(?i)(-X\s*PUT|--request\s+PUT)'

  - id: http-post-option
    desc: curl POST method option
    crit: component
    conf: 0.8
    for: [shell, powershell]
    if:
      type: text
      regex: '(?i)(-X\s*POST|--request\s+POST)'

  - id: http-curl-data-option
    desc: curl data option
    crit: component
    conf: 0.8
    for: [shell, powershell]
    if:
      type: text
      # Bind the option to the curl command on the same shell command span.
      # A standalone `-d` is also a common history/delete flag and must not
      # be reported as an HTTP payload option.
      regex: '(?im)(^|[;&|`$({])\s*(/usr/bin/)?curl\b[^\n;&|]{0,160}\s(-d|--data(-raw)?)\s+'

  - id: http-send-object
    desc: Send call has object payload
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bsend\s*\(\s*(JSON\.stringify\s*\(\s*)?[\[{]'

composite_rules:
  - id: process-stream-result-post
    desc: HTTP POST returns captured process output streams
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/io/stream::mapped-stdout-stderr-result-fields
      - id: http-write-request-method

  - id: http-write-request-method
    desc: Uses an HTTP write request method
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/patch::patch-method-detection
      - id: micro-behaviors/communications/http/post::post-method-detection
      - id: http-put-client-call
      - id: http-post-client-call
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/lib/requests::requests-put

  - id: http-result-put-request
    desc: HTTP PUT result payload
    crit: notable
    conf: 0.9
    near_bytes: 256
    all:
      - id: http-result-payload-field
      - id: http-result-field
    any:
      - id: http-put-client-call
      - id: http-fetch-put-request
      - id: http-curl-put-request

  - id: http-fetch-put-request
    desc: fetch configures PUT
    crit: component
    conf: 0.8
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: http-put-method

  - id: http-curl-put-request
    desc: curl sends PUT data
    crit: component
    conf: 0.8
    near_bytes: 256
    all:
      - id: http-curl-call
      - id: http-put-option
      - id: http-curl-data-option

  - id: http-result-post-request
    desc: HTTP POST result payload
    crit: notable
    conf: 0.9
    near_bytes: 256
    all:
      - id: http-result-payload-field
      - id: http-result-field
    any:
      - id: http-post-client-call
      - id: http-fetch-post-request
      - id: http-curl-post-request

  - id: http-fetch-post-request
    desc: fetch configures POST
    crit: component
    conf: 0.8
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: http-post-method

  - id: http-curl-post-request
    desc: curl sends POST data
    crit: component
    conf: 0.8
    near_bytes: 256
    all:
      - id: http-curl-call
      - id: http-post-option
      - id: http-curl-data-option

  - id: http-result-send-request
    desc: XMLHttpRequest result payload
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    near_bytes: 256
    all:
      - id: http-send-object
      - id: http-result-field
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-send
