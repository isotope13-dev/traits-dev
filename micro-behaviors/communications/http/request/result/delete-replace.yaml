defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-fetch-delete-put-same-url
    desc: Fetch DELETE and PUT share URL variable
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator value: (await_expression
            (call_expression function: (identifier) @fetch1
              arguments: (arguments . (identifier) @url1 . (object
                (pair key: [(property_identifier) @key1 (string (string_fragment) @key1)] value: (string (string_fragment) @verb1))))))))
          (lexical_declaration (variable_declarator value: (await_expression
            (call_expression function: (identifier) @fetch2
              arguments: (arguments . (identifier) @url2 . (object
                (pair key: [(property_identifier) @key2 (string (string_fragment) @key2)] value: (string (string_fragment) @verb2))))))))) @match
          (#eq? @fetch1 "fetch") (#eq? @fetch2 "fetch")
          (#eq? @url1 @url2) (#eq? @key1 "method") (#eq? @key2 "method")
          (#eq? @verb1 "DELETE") (#eq? @verb2 "PUT"))
