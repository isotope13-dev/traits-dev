defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  # The helper's own name is the author's choice (`request` here); the
  # matcher binds the POST carrying a handler-result lookup instead.
  - id: python-handler-result-post
    desc: Request helper posts a handler result object
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\w+\(["'']POST["''],[\s\S]{0,260}["'']result["'']:\s*\w+\.get\(["'']result["'']\)'
