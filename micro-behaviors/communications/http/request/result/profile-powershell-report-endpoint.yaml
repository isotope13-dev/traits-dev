---
defaults:
  platforms:
  - windows
  for:
  - powershell
traits:
- id: powershell-http-report-endpoint
  desc: PowerShell HTTP report endpoint text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?i)\\b(Invoke-RestMethod|Invoke-WebRequest|curl(\\.exe)?)\\b[^\\r\\n]{0,180}/report\\b"
