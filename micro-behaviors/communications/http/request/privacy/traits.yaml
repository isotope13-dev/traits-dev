# Request options that suppress the traces a browser request normally leaves.
# `referrerPolicy: "no-referrer"` strips the originating page from the
# receiver's logs; paired with an opaque `no-cors` GET or a beacon, it
# describes a transmission whose only purpose is the side effect of being
# sent. Fire-and-forget telemetry looks like this — and so does a page-
# resident collector that wants its exfil to be unattributable to the page it
# ran on. Neutral on its own; the pairing carries the signal.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]

traits:
  - id: no-referrer-request-policy
    desc: Request strips the referrer header
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'referrerPolicy\s*[:=]\s*[''"]no-referrer'

composite_rules:
  - id: untraceable-opaque-browser-request
    desc: Opaque request sent with no referrer
    crit: suspicious
    conf: 0.88
    all:
      - id: no-referrer-request-policy
    any:
      - id: micro-behaviors/communications/http/get::get-before-no-cors
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
