# A request parameter that records the user's consent decision with the
# vendor. Consent banners legitimately report the click; the variant below
# sends it from a file that has no click or submit handler, so the code path
# that reports "accepted" is not driven by any UI the user touched.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: consent-accept-event-parameter
    desc: Reports a consent-accepted event parameter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)["''](action|event)["'']\s*,\s*["'']consent_?accept'

  - id: consent-accept-event-without-ui-handler
    desc: Consent-accepted report outside any UI handler
    crit: notable
    conf: 0.8
    if:
      id: consent-accept-event-parameter
    unless:
      - type: text
        regex: 'addEventListener\(\s*["''](click|submit)|onclick\s*=|\.on\(\s*["'']click'
