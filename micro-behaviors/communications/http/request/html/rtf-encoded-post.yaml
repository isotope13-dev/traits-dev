defaults:
  platforms: [windows, unix]
  for: [rtf]

traits:
  - id: rtf-url-encoded-script-post
    desc: Encoded script issues an HTTP POST
    crit: notable
    conf: 0.85
    if:
      # `$.ajax({...type:"POST"` or `fetch(url,{method: "POST"`.
      type: encoded
      encoding: url
      regex: '(?i)\b(method|type)\s{0,3}:\s{0,3}["'']POST["'']'
