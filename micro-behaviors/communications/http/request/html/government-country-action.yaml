defaults:
  platforms: [windows, unix]
  for: [html, php, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: government-country-form-action
    desc: Form action uses government-country host
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<form\b[^>]{0,180}\baction\s*=\s*["'']https?://[\w.-]+-gov-[a-z]{2}\.[\w.-]+'
    not:
      # A government-owned suffix is not a commercial-host lookalike.
      - regex: '(?i)\.gov(\.[a-z]{2})?$'
