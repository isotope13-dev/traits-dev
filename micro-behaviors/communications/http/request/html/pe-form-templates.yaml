defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96
traits:
  - id: native-html-post-form-template
    desc: Native HTML POST-form generation template
    if:
      type: text
      regex: '<form action="[^"]{1,64}" method="POST"'
  - id: native-html-script-form-submit-template
    desc: Native HTML scripted form-submission template
    if:
      type: text
      regex: 'document\.[^.;]{1,64}\.submit\(\)'
