# Filter the matched authority, never unrelated provider links elsewhere on a page.
defaults:
  platforms: [unix, windows]
  for: [html, php]
  crit: notable
  conf: 0.95

traits:
  - id: html-form-non-microsoft-action
    desc: Form action outside Microsoft auth domains
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<form\b[^>]{0,250}\baction\s*=\s*["''](https?:)?//[^/"''\s>]{1,253}'
    not:
      - regex: '(?i)//([\w-]+\.)*microsoft(online)?\.com(:[0-9]+)?$'
      - regex: '(?i)//([\w-]+\.)*(live\.com|windows\.net)(:[0-9]+)?$'
      - regex: '(?i)//([\w-]+\.)*(b2clogin|onmicrosoft)\.com(:[0-9]+)?$'
      - regex: '(?i)//([\w-]+\.)*microsoftonline\.(us|cn)(:[0-9]+)?$'

