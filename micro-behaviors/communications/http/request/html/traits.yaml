defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1071.001
  mbc: C0002

traits:
  # "The form submits to another origin" is neutral markup: newsletter signup
  # forms, payment-processor checkouts, and site search boxes all declare an
  # absolute action URL. This was defined as `external-form-action` under
  # objectives/credential-access/phishing/captive-portal/, where the placement
  # alone read as credential phishing for every one of them and needed a
  # growing allowlist of ordinary web forms; the phishing composites now
  # reference this atom cross-directory and add the credential evidence.
  - id: html-form-external-action
    desc: HTML form action targets an absolute URL
    crit: notable
    conf: 0.96
    # JavaScript bundles can carry decoded HTML corpora; require an actual page,
    # server template, or script that emits the form markup.
    for: [html, php, batch]
    if:
      type: text
      regex: '<form\b[^>]{0,180}action\s*=\s*["'']https?://'

  - id: batch-html-onload-form-submit
    desc: Auto-submits generated HTML form
    crit: notable
    conf: 0.96
    for: [batch]
    if:
      type: text
      regex: '(?i)<body\b[^>\r\n]{0,200}\bonload\s*=\s*["''][^\r\n]{0,240}\.submit\s*\('

  - id: html-fetch-call
    desc: Calls fetch API from HTML script
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bfetch\s*\('

  - id: html-fetch-post-call
    desc: HTML script sends a fetch POST request
    crit: notable
    conf: 0.9
    if:
      type: text
      # Inline JavaScript in an HTML document is not represented by the
      # JavaScript tree-sitter facts, so keep this structural HTTP matcher
      # beside html-fetch-call. The method field makes this a POST capability
      # rather than a generic fetch reference.
      regex: '(?is)\bfetch\s*\([^)]{0,600}\bmethod\s*:\s*["'']POST["'']'

  - id: html-control-form-field
    desc: HTML form supplies a control field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,140}\bname\s*=\s*["'']?(command|cmd|scriptpath|seqfile)\b'
