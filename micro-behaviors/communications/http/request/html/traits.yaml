defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1071.001
  mbc: C0002

traits:
  - id: html-fetch-call
    desc: Calls fetch API from HTML script
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bfetch\s*\('

  - id: html-fetch-post-call
    desc: HTML script sends a fetch POST request
    crit: notable
    conf: 0.9
    if:
      type: text
      # Inline JavaScript in an HTML document is not represented by the
      # JavaScript tree-sitter facts, so keep this structural HTTP matcher
      # beside html-fetch-call. The method field makes this a POST capability
      # rather than a generic fetch reference.
      regex: '(?is)\bfetch\s*\([^)]{0,600}\bmethod\s*:\s*["'']POST["'']'
