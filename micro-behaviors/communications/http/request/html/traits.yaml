defaults:
  crit: notable
  platforms: [windows, unix]
  for: [html]
  attack: T1071.001
  mbc: C0002

traits:
  # "The form submits to another origin" is neutral markup: newsletter signup
  # forms, payment-processor checkouts, and site search boxes all declare an
  # absolute action URL. This was defined as `external-form-action` under
  # objectives/credential-access/phishing/captive-portal/, where the placement
  # alone read as credential phishing for every one of them and needed a
  # growing allowlist of ordinary web forms; the phishing composites now
  # reference this atom cross-directory and add the credential evidence.
  - id: html-form-external-action
    desc: HTML form action targets an absolute URL
    conf: 0.96
    # JavaScript bundles can carry decoded HTML corpora; require an actual page,
    # server template, or script that emits the form markup.
    for: [html, php, batch]
    if:
      type: text
      regex: '(?i)<form\b[^>]{0,180}action\s*=\s*["'']https?://'

  - id: html-form-actionless-post
    desc: Form self-posts without an action
    conf: 0.9
    # An action-less POST form submits to its own URL. Ordinary settings and
    # search forms do this, so this stays notable; the phishing and webshell
    # composites reference it and add the credential context. Scoped to forms
    # whose only attribute is the POST method so styled multi-attribute
    # benign forms stay out.
    for: [html, php]
    if:
      type: text
      regex: '(?i)<form\s+method\s*=\s*[''"]post[''"]\s*>'

  - id: batch-html-onload-form-submit
    desc: Auto-submits generated HTML form
    conf: 0.96
    for: [batch]
    if:
      type: text
      regex: '(?i)<body\b[^>\r\n]{0,200}\bonload\s*=\s*["''][^\r\n]{0,240}\.submit\s*\('

  - id: html-fetch-call
    desc: Calls fetch API from inline script
    conf: 0.8
    for: [html, php]
    if:
      type: text
      # No dot receiver: carousel and video plugins ship same-named
      # `this.fetch(...)` helpers, which are not the Fetch API. The
      # linear-time engine has no lookbehind, so the guard consumes the
      # preceding character instead. Accept an opening script tag too,
      # while excluding the > in a PHP ->fetch() method call.
      # Consume a named declaration as one match so not: can reject it without
      # losing real calls elsewhere in the same PHP template or HTML script.
      regex: '(?i)(^|[^.>\w]|<script\b[^>]{0,80}>)(function\s*&?\s*)?fetch\s*\('
    not:
      - regex: '(?i)\bfunction\s*&?\s*fetch\s*\('

  - id: html-fetch-absolute-url
    desc: Inline script fetches an absolute URL
    conf: 0.9
    if:
      type: text
      # Absolute or protocol-relative destination: the fetch twin of the
      # jQuery absolute-URL atom below. Same-origin application code fetches
      # rooted paths ("/api/...") or computed values; a scheme or a leading
      # "//" points the request off-origin.
      regex: '(?is)(^|[^.>\w])fetch\s*\(\s*["''](https?:)?//'

  - id: html-fetch-args-carry-cookie
    desc: Fetch call arguments carry document.cookie
    conf: 0.92
    if:
      type: text
      # The cookie access sits inside the fetch call itself, so the harvested
      # value is the query, path or body of that one request — data flow in a
      # single expression, not a page-wide coincidence between a cookie
      # helper and the app's fetch wrapper. Require the cookie reference before
      # a closing parenthesis: semicolon-free code can otherwise let the window
      # run past a completed fetch call to a later cookie display.
      regex: '(?is)\bfetch\s*\(\s*[^)]{0,240}document\s*\.\s*cookie'

  - id: html-jquery-ajax-absolute-url
    desc: jQuery ajax call specifies an absolute URL
    conf: 0.9
    if:
      type: text
      # The fetch twin above misses the jQuery spelling that phishing kits
      # favour (`$.ajax({url: "...", type: "POST", ...})`): same POST-to-URL
      # capability through the library call. The absolute URL keeps this a
      # submission target rather than a same-origin endpoint reference.
      regex: '(?is)\$\.ajax\s*\(\s*\{[^}]{0,400}\burl\s*:\s*[\"'']https?://'
  - id: html-jquery-ajax-relative-php-url
    desc: jQuery ajax targets relative PHP script
    conf: 0.9
    if:
      type: text
      # Same-origin twin of the absolute-URL atom above: standalone phishing
      # pages POST harvested credentials to a co-hosted collector
      # (`connect.php`) instead of an absolute endpoint, so the absolute
      # spelling misses the whole kit. The bare filename admits no scheme
      # colon and no slash, so absolute, protocol-relative, rooted and
      # subdirectory targets cannot match; only a sibling collector script
      # does. Data fetches (`data.json`) miss on the extension.
      regex: '(?is)\$\.ajax\s*\(\s*\{[^}]{0,300}\burl\s*:\s*["''][A-Za-z0-9_~.-]+\.php["'']'

  - id: html-control-form-field
    desc: HTML form supplies a control field
    conf: 0.96
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,140}\bname\s*=\s*["'']?(command|cmd|scriptpath|seqfile)\b'

composite_rules:
  - id: html-jquery-ajax-post-call
    desc: jQuery ajax call with absolute URL and POST option
    crit: notable
    all:
      - id: html-jquery-ajax-absolute-url
      - id: micro-behaviors/communications/http/post::request-options-post-method
    near_bytes: 400
