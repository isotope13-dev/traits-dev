# Requests issued to several interchangeable endpoints at once, keeping
# whichever answers first. Distinct from ordinary retry (same endpoint, later)
# and from parallel fan-out (different endpoints, all results wanted): here the
# endpoints are redundant copies of one service and the extra requests are
# discarded. Legitimate in CDN and RPC mirror clients; what the endpoints are,
# and whether they were concealed, is left to composites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: promise-any-fetch-race
    desc: Races several fetch requests, first success wins
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Promise\.any\([\s\S]{0,200}fetch\('
