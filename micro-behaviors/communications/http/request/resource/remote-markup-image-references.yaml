defaults:
  platforms: [unix, windows]
  for: [html, markdown]
traits:
- id: markdown-remote-image-source
  desc: Markdown references a remote image
  for: [markdown]
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)!\[[^\]]{0,120}\]\(\s*https?://[^)\s]{1,220}\.(jpe?g|png|gif|webp)\b'


composite_rules:
- id: remote-image-source
  desc: Markup references a remote image
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/request/resource::html-remote-image-source
  - id: micro-behaviors/communications/http/request/resource::markdown-remote-image-source
