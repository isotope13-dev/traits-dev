defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript]

traits:
  - id: js-fetch-script-url-literal
    desc: Fetches a literal JavaScript resource URL
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bfetch\s*\(\s*["'']https?://[^"'']{1,120}\.m?js([?#][A-Za-z0-9_&=%+./~-]{0,80})?["'']'
