defaults:
  platforms: [unix, windows]
  for: [html]
traits:
- id: html-remote-image-source
  desc: HTML references a remote image
  crit: notable
  conf: 0.9
  if:
    type: text
    # Protocol-relative sources use the page's HTTP(S) scheme too.
    regex: '(?i)<img\b[^>]{0,240}\bsrc\s*=\s*["''](https?:)?//'

