defaults:
  for: [ruby]
  platforms: [unix, windows]

composite_rules:
  - id: ruby-http-api-reference-group
    desc: Ruby HTTP client or message API in use
    crit: component
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/message/
      - id: metadata/lang/source/syntax::ruby-net-http-reference
      - id: micro-behaviors/communications/http/lib/netlib::request-ruby
