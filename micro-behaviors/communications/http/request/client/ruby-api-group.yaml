defaults:
  for: [ruby]
  platforms: [unix, windows]

composite_rules:
  - id: ruby-http-api-reference-group
    desc: Ruby HTTP URL prefix or client reference
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/message/
      - id: micro-behaviors/communications/http/lib/netlib::ruby-net-http-reference
      - id: micro-behaviors/communications/http/lib/netlib::request-ruby
      - id: micro-behaviors/communications/http/client/exchange::ruby-http-request-call
