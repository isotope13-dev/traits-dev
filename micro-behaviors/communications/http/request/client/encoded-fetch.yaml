defaults:
  platforms: [windows, unix]
  for: [scripts, pe, elf, macho, html, -ruby, -php, -perl, -lua, -applescript, -mirc, -ircii]
  crit: notable
  conf: 0.96

traits:
  - id: encoded-javascript-http-fetch
    desc: Encoded JavaScript fetches an HTTP URL
    if:
      type: encoded
      regex: '\bfetch\s*\(\s*["'']https?://'
