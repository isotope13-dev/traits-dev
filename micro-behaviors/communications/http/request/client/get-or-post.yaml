defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: http-client-get-or-post
    desc: HTTP GET or POST client capability
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::http-get-dup
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-https-get
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
