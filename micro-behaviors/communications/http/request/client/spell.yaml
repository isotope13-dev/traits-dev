defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: spell-run-url-sync-call
    desc: HTTP call targets Spell run-sync endpoint
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      substr: 'env.get("SPELL_API_URL", "https://api.spell.run") + "/wandb_url"'
