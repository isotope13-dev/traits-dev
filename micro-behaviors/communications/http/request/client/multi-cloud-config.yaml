defaults:
  platforms: [windows, macos, linux]
  for: [binaries, scripts]

composite_rules:
  - id: http-post-upload-or-curl
    desc: "HTTP POST, upload, or curl capability"
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/request/client::python-post-transport
      - id: micro-behaviors/communications/http/post::browser-http-post-call
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
      - id: micro-behaviors/communications/http/upload::curl-upload
      - id: micro-behaviors/communications/http/upload::requests-post-files-parameter
      - id: micro-behaviors/communications/http/curl/
