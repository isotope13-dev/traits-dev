composite_rules:
- platforms:
  - windows
  - macos
  - linux
  for:
  - binaries
  - scripts
  id: http-client-capability
  desc: HTTP client capability via POST, upload or curl evidence
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/communications/http/post::js-fetch-post-request
  - id: micro-behaviors/communications/http/post::php-stream-context-http-post
  - id: micro-behaviors/communications/http/upload::requests-post-files-parameter
  - id: micro-behaviors/communications/http/curl/
