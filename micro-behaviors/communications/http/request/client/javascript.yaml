defaults:
  platforms:
    - unix
    - windows
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002
traits:
  - id: invoke-endpoint-call
    desc: Calls an automation endpoint API
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: invokeEndpoint

  - id: axios-request-call
    desc: Calls axios.request() to send an HTTP request
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: axios.request
  - id: axios-direct-call
    desc: Calls axios() to send an HTTP request
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: axios
  - id: http-request
    desc: Node.js http.request
    crit: notable
    conf: 0.7
    if:
      type: symbol
      regex: '^http(_\d+\.default)?\.request$'
  - id: https-request
    desc: Node.js https.request
    crit: notable
    conf: 0.7
    if:
      type: symbol
      regex: '^https(_\d+\.default)?\.request$'
  - id: http-get-dup
    desc: JavaScript HTTP client get member reference
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: http.get
  - id: node-http-get-destructured
    desc: Node.js http.get destructured alias
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: 'get\s*:\s*\w+\s*\}\s*=\s*require\(["'']node:http'
  - id: node-https-get-destructured
    desc: Node.js https.get destructured alias
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: '\b(const|let|var)\s*\{\s*get\s*\}\s*=\s*require\(["''](node:)?https["'']\)'
  - id: https-get
    desc: Node.js https.get
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: https.get
  - id: node-https-get-dynamic
    desc: Node.js https.get dynamic call
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '["'']https["'']\)\s*\.get'
  - id: h-require-https
    desc: https module assigned h
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: '\b(const|let|var)\s+h\s*=\s*require\(["'']https["'']\)'
  - id: node-https-alias-binding
    desc: Binds Node HTTPS to alias h
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\b(const|let|var)\s+h\s*=\s*(__)?require\(["''](node:)?https["'']\)'
  - id: h-request-call
    desc: JavaScript opens HTTP request stream
    crit: notable
    conf: 0.74
    if:
      type: symbol
      exact: h.request
  - id: lib-request-call
    desc: HTTP request via lib module alias
    crit: notable
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: lib.request
  - id: node-http-get-dynamic
    desc: Node.js http.get dynamic call
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '["'']http["'']\)\s*\.get'
  - id: js-fetch-call
    desc: Calls JavaScript fetch API
    crit: notable
    conf: 0.8
    if:
      # Bind a call expression (not a function declaration) to a URL-like
      # first argument. A bare name also matches Git helpers named `fetch`.
      type: tree-sitter
      kind: call
      # A leading parenthesis covers computed URL builders such as
      # `fetch((makeBase()) + path)` while still requiring a parsed fetch call.
      # Buffer.from(..., "base64") URL builders are a common npm-loader shape.
      regex: '^fetch\s*\(\s*(["''`]|\(|[A-Za-z_$][\w$]*(\s*\+|url|uri|endpoint)|Buffer)'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      # Scanner regression tests embed fetch syntax in strings passed to the
      # scanner; this is not a live network call in the test harness.
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      # Julia source can be content-typed as JavaScript by its eval/fetch
      # vocabulary; a `.jl` basename identifies the real source language.
      - id: metadata/file/extension/identity::julia-source-basename
  # Installers and SDK adapters often accept an injected fetch implementation
  # (fetchImpl) for tests or alternate runtimes. It is still a concrete
  # HTTP-client call, but the name is not the global fetch call above.
  - id: js-fetch-implementation-call
    desc: Calls an injected JavaScript fetch
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      exact: fetchImpl
  - id: js-fetcher-fallback-call
    desc: Calls configurable JavaScript fetch fallback
    crit: notable
    conf: 0.94
    if:
      # Dependency-injected clients commonly fall back to the global fetch.
      # The closing call parenthesis proves this is invocation, not selection.
      type: text
      regex: '\(\s*[A-Za-z_$][\w$]*\.fetcher\s*\|\|\s*fetch\s*\)\s*\('
  - id: jquery-ajax-call
    desc: Calls jQuery.ajax() to send an HTTP request
    crit: notable
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '^(\$|jQuery)\.ajax$'
  - id: fetch-literal-https-url
    desc: fetch() called with literal HTTPS URL
    crit: notable
    conf: 0.88
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bfetch\s*\(\s*["'']https://'

  - id: js-fetch-buffer-from-decoded-url
    desc: fetch() called with Buffer.from decoded URL
    crit: notable
    conf: 0.94
    attack: T1105
    if:
      type: text
      regex: 'fetch\s*\(\s*Buffer\.from\([^)]{1,120}["'']base64["'']\)'

  - id: stringified-fetch-call
    desc: String literal begins with fetch(
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: ^["']?fetch\s*\(\s*[^)\s]
    unless:
      # Next.js's own dynamicIO/PPR bailout diagnostic quotes "fetch(...)" as
      # example API usage inside an escaped-backtick error-message template,
      # not a constructed fetch call. This exact framework string ships
      # verbatim in every Next.js app-router build that reaches the warning.
      - type: text
        substr: nextjs.org/docs/messages/next-prerender-dynamic-viewport
  - id: fetch-then-json
    desc: fetch() response JSON parse
    crit: notable
    conf: 0.74
    if:
      type: text
      regex: fetch\(.{0,80}\.then\(.{0,80}\.json\(
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture/
      - id: "metadata/file/naming::test-directory-component"
  - id: xmlhttprequest-new
    desc: Invokes the XMLHttpRequest constructor
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: XMLHttpRequest
  - id: node-fetch-import
    desc: Imports the node-fetch HTTP client
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: node-fetch
  - id: generic-request-method-call
    desc: Generic .request() method call
    crit: notable
    conf: 0.4
    if:
      type: text
      regex: '\b(axios|http|https)\.request\s*\('
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: micro-behaviors/data/llm/agent::agent-identity-set
  - id: got-import
    desc: got HTTP client import
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: got
  - id: superagent-import
    desc: superagent HTTP client import
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (import|require).{0,50}['"]superagent['"]
  - id: needle-import
    desc: needle HTTP client import
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (import|require).{0,50}['"]needle['"]
  - id: request-import
    desc: request HTTP client import
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (import|require).{0,50}['"]request['"]

  - id: sms-api-otp-polling
    desc: Polls SMS or OTP API with Axios
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'axios\.(get|post)\s*\([^)]{0,160}/api/(sms|otp)'
      case_insensitive: true

  - id: node-http-client-scheme-selection
    desc: Selects an HTTP client by URL scheme
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\s*=\s*[A-Za-z_$][\w$]*\.startsWith\(\s*["'']https'
  - id: fetch-http-scheme-url
    desc: Fetches an HTTP(S)-scheme URL
    crit: notable
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        kind: string
        regex: '^https?://'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context

composite_rules:
  # Creating an Image and assigning `.src` also decodes data: and object URLs.
  # Only report an HTTP request when the assigned source is explicitly remote
  # or contains a query expression, the common browser-beacon form.
  - id: image-src-network-request
    desc: Creates a network-backed Image request
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html, text]
    all:
      - id: micro-behaviors/ui/graphics/image::js-image-src-assignment
    any:
      - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
      - id: micro-behaviors/communications/http/client/resource::element-src-query-parameter
  - id: fetch-post-pattern
    desc: JavaScript file uses fetch and configures an HTTP POST
    crit: notable
    conf: 0.9
    all:
      - id: js-fetch-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: node-https-request-h-alias
    desc: Node.js https.request via alias
    crit: notable
    conf: 0.86
    all:
      - id: h-require-https
      - id: h-request-call
  - id: script-http-client
    desc: Uses a script HTTP client
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: js-fetch-call
      - id: http-request
  - id: node-http
    desc: Node.js built-in http/https module usage
    crit: notable
    conf: 0.7
    any:
      - id: http-request
      - id: https-request
      - id: micro-behaviors/communications/http/request/client::http-get-dup
      - id: https-get
      - id: node-http-get-dynamic
      - id: node-https-get-dynamic
      - id: node-https-request-h-alias
      - id: lib-request-call
      - id: node-scheme-selected-http-client
  - id: http-client-usage
    desc: Uses HTTP client APIs
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/communications/http/lib/axios::request-axios
      - id: node-http
      - id: js-fetch-call
      - id: xmlhttprequest-new
      - id: node-fetch-import
      - id: got-import
      - id: superagent-import
      - id: needle-import
      - id: request-import
      - id: node-https-request-h-alias
  - id: http-method-calls
    desc: Calls an HTTP request method
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: https-request
      - id: http-request
      - id: node-https-request-h-alias
      - id: js-fetch-call
      - id: micro-behaviors/communications/http/post::axios-with-data
      - id: fetch-post-pattern
      - id: micro-behaviors/communications/http/request/params::get-with-params
  - id: node-scheme-selected-http-client
    desc: Node HTTP client selected by URL scheme
    crit: notable
    conf: 0.92
    all:
      - id: metadata/import/builtin::require-http
      - id: metadata/import/builtin::require-https
    any:
      - id: node-http-client-scheme-selection
      - id: micro-behaviors/communications/url/scheme::url-https-protocol-ternary-test
      - id: micro-behaviors/communications/http/request/dynamic::node-http-client-charat-scheme-selection

  - id: js-http-get-or-fetch
    desc: JavaScript performs an HTTP GET or fetch request
    crit: notable
    conf: 0.9
    any:
      - id: http-get-dup
      - id: https-get
      - id: js-fetch-call

  - id: node-http-client-imports
    desc: Imports a Node.js HTTP client library
    crit: notable
    conf: 0.8
    any:
      - id: metadata/import/npm/axios
      - id: metadata/import/npm/node-fetch
      - id: metadata/import/npm/got
      - id: metadata/import/npm/request
      - id: metadata/import/builtin::require-https
