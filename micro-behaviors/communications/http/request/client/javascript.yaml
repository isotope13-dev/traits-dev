---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1071.001
  mbc: C0002
traits:
- id: invoke-endpoint-call
  desc: Calls an automation endpoint API
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: invokeEndpoint
- id: axios-request-call
  desc: Calls axios.request() to send an HTTP request
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    exact: axios.request
- id: axios-direct-call
  desc: Calls axios() to send an HTTP request
  crit: notable
  conf: 0.75
  if:
    type: symbol
    kind: call
    exact: axios
- id: http-request
  desc: Node.js http.request
  crit: notable
  conf: 0.7
  if:
    type: symbol
    regex: "^http(_\\d+\\.default)?\\.request$"
- id: https-request
  desc: Node.js https.request
  crit: notable
  conf: 0.7
  if:
    type: symbol
    regex: "^https(_\\d+\\.default)?\\.request$"
- id: node-https-get-dynamic
  desc: Node.js https.get dynamic call
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '["'']https["'']\)\s*\.get'
- id: h-request-call
  desc: JavaScript opens HTTP request stream
  crit: notable
  conf: 0.74
  if:
    type: symbol
    exact: h.request
- id: node-http-get-dynamic
  desc: Node.js http.get dynamic call
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '["'']http["'']\)\s*\.get'
- id: js-fetch-call
  desc: Calls JavaScript fetch API
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    regex: "^_?fetch$"
  unless:
  - type: function
    exact: _fetch
  - id: micro-behaviors/data/collection/dom::local-dom-fetch-helper-context
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
  - id: metadata/file/extension/identity::julia-source-basename
- id: js-fetch-implementation-call
  desc: Calls an injected JavaScript fetch
  crit: notable
  conf: 0.84
  if:
    type: tree-sitter
    kind: call
    regex: "(^|\\.)fetchImpl\\s*\\("
- id: js-fetcher-fallback-call
  desc: Calls configurable JavaScript fetch fallback
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: "\\(\\s*[A-Za-z_$][\\w$]*\\.fetcher\\s*\\|\\|\\s*fetch\\s*\\)\\s*\\("
- id: jquery-ajax-call
  desc: Calls jQuery.ajax() to send an HTTP request
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: call
    regex: "^(\\$|jQuery)\\.ajax$"
- id: js-fetch-buffer-from-decoded-url
  desc: fetch() called with Buffer.from decoded URL
  crit: notable
  conf: 0.94
  attack: T1105
  if:
    type: text
    regex: fetch\s*\(\s*Buffer\.from\([^)]{1,120}["']base64["']\)
- id: fetch-then-json
  desc: fetch() response JSON parse
  crit: notable
  conf: 0.74
  if:
    type: text
    regex: fetch\(.{0,80}\.then\(.{0,80}\.json\(
- id: xmlhttprequest-new
  desc: Invokes the XMLHttpRequest constructor
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: XMLHttpRequest
- id: node-fetch-import
  desc: Imports the node-fetch HTTP client
  crit: notable
  conf: 0.95
  if:
    type: import
    exact: node-fetch
- id: generic-request-method-call
  desc: Calls an HTTP client request method
  crit: notable
  conf: 0.4
  if:
    type: text
    regex: "\\b(axios|http|https)\\.request\\s*\\("
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/lang/natural/vocabulary/ai-assistant::agent-identity-set
- id: got-import
  desc: got HTTP client import
  crit: notable
  conf: 0.95
  if:
    type: import
    exact: got
- id: superagent-import
  desc: superagent HTTP client import
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (import|require).{0,50}['"]superagent['"]
- id: needle-import
  desc: needle HTTP client import
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (import|require).{0,50}['"]needle['"]
- id: request-import
  desc: request HTTP client import
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (import|require).{0,50}['"]request['"]
- id: sms-api-otp-polling
  desc: Polls SMS or OTP API with Axios
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: axios\.(get|post)\s*\([^)]{0,160}/api/(sms|otp)
    case_insensitive: true
- id: fetch-http-scheme-url
  desc: Fetches an HTTP(S)-scheme URL
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: call
    exact: fetch
    arg:
      kind: string
      regex: "^https?://"
  unless:
  - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
- id: js-https-fetch-literal-call
  desc: Fetch call targets a literal HTTPS URL
  crit: notable
  conf: 0.88
  if:
    type: symbol
    kind: call
    regex: "^((window|globalThis)\\.)?fetch$"
    arg:
      index: 0
      kind: string
      regex: "^https://"
composite_rules:
- id: fetch-literal-https-url
  desc: Fetch call targets a literal HTTPS URL
  crit: notable
  conf: 0.88
  for:
  - html
  - javascript
  - typescript
  any:
  - id: micro-behaviors/communications/http/request/client::js-https-fetch-literal-call
  - id: metadata/lang/source/syntax/call/arguments::html-https-fetch-call-syntax
- id: image-src-network-request
  desc: Creates a network-backed Image request
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  - html
  - text
  all:
  - id: micro-behaviors/ui/graphics/image::js-image-src-assignment
  any:
  - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
  - id: micro-behaviors/communications/http/client/resource::element-src-query-parameter
- id: fetch-post-pattern
  desc: JavaScript fetch call near an HTTP POST method
  crit: notable
  conf: 0.9
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
- id: node-https-request-h-alias
  desc: Node.js http(s).request via h alias
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/communications/http/request/client::h-request-call
  any:
  - id: metadata/import/builtin::node-https-h-binding-syntax
  - id: metadata/import/builtin::require-http
- id: script-http-client
  desc: Uses a script HTTP client
  crit: notable
  conf: 0.75
  any:
  - id: micro-behaviors/communications/http/request/client::http-client
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/client::http-request
- id: node-http
  desc: Node.js built-in http/https module usage
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/client::node-http-get-dynamic
  - id: micro-behaviors/communications/http/request/client::node-https-get-dynamic
  - id: micro-behaviors/communications/http/request/client::node-https-request-h-alias
  - id: micro-behaviors/communications/http/request/client::node-http-alias-request-call
  - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
- id: http-client-usage
  desc: Uses HTTP client APIs
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/communications/http/lib/axios::request-axios
  - id: micro-behaviors/communications/http/request/client::node-http
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  - id: micro-behaviors/communications/http/request/client::node-fetch-import
  - id: micro-behaviors/communications/http/client/library::umi-request-import
  - id: micro-behaviors/communications/http/request/client::got-import
  - id: micro-behaviors/communications/http/request/client::superagent-import
  - id: micro-behaviors/communications/http/request/client::needle-import
  - id: micro-behaviors/communications/http/request/client::request-import
  - id: micro-behaviors/communications/http/request/client::node-https-request-h-alias
- id: http-method-calls
  desc: Calls an HTTP request method
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/communications/http/request/client::jquery-ajax-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/request/client::node-https-request-h-alias
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: metadata/lang/source/literal/string::axios-data-request-literal
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: micro-behaviors/communications/http/request/params::get-with-params
- id: node-scheme-selected-http-client
  desc: Node HTTP client selected by URL scheme
  crit: notable
  conf: 0.92
  all:
  - id: metadata/import/builtin::require-http
  - id: metadata/import/builtin::require-https
  any:
  - id: micro-behaviors/communications/url/scheme::https-prefix-test-assignment
  - id: micro-behaviors/communications/url/scheme::url-protocol-scheme-ternary-test
  - id: micro-behaviors/communications/http/request/dynamic::node-http-client-charat-scheme-selection
- id: js-http-get-or-fetch
  desc: JavaScript performs an HTTP GET or fetch request
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
- id: node-http-client-imports
  desc: Imports a Node.js HTTP client library
  crit: notable
  conf: 0.8
  any:
  - id: metadata/import/npm/axios
  - id: metadata/import/npm/node-fetch
  - id: metadata/import/npm/got
  - id: metadata/import/npm/request
  - id: metadata/import/builtin::require-https
