traits:
- id: module-execution-http-call
  desc: Module initialization calls an HTTP client
  conf: 0.95
  if:
    type: value
    path: source.execution.module_http
    exact: 'true'
  unless:
  - type: text
    regex: ^\s*export\s+default\s+class\b
- id: axios-client-reference
  mbc: C0002
  desc: References the Axios HTTP client
  conf: 0.85
  if:
    type: text
    regex: \baxios\.|\bfrom\s+["']axios["']|\brequire\(["']axios["']\)
- id: axios-module-import
  attack: T1071.001
  mbc: C0002
  desc: Imports the Axios HTTP client
  conf: 0.7
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: import
    exact: axios
defaults:
  for:
  - javascript
  - typescript
  crit: notable
  platforms:
  - unix
  - windows
