traits:
- id: module-execution-http-call
  desc: Module initialization calls an HTTP client
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      ((program
        [
          (expression_statement (await_expression (call_expression
            function: (identifier) @client)))
          (expression_statement (call_expression function: (identifier) @client))
          (lexical_declaration (variable_declarator value: (await_expression
            (call_expression function: (identifier) @client))))
          (lexical_declaration (variable_declarator value:
            (call_expression function: (identifier) @client)))
        ])
       (#match? @client "^(fetch|axios)$"))
- id: axios-client-reference
  mbc: C0002
  desc: References the Axios HTTP client
  conf: 0.85
  if:
    type: text
    regex: \baxios\.|\bfrom\s+["']axios["']|\brequire\(["']axios["']\)
- id: axios-module-import
  attack: T1071.001
  mbc: C0002
  desc: Imports the Axios HTTP client
  conf: 0.7
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: import
    exact: axios
defaults:
  for:
  - javascript
  - typescript
  crit: notable
  platforms:
  - unix
  - windows
