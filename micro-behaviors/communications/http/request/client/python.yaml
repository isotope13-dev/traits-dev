---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: python-browser-context-request
  desc: Sends HTTP through a browser context
  conf: 0.96
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)request_context\\.request$"
- id: python-http-client-connection
  desc: Creates an http.client HTTP or HTTPS connection
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: "^http\\.client\\.HTTPS?Connection$"
- id: urllib3-poolmanager
  desc: urllib3 PoolManager client
  conf: 0.86
  if:
    type: text
    regex: urllib3\.PoolManager\s*\(
composite_rules:
- id: python-post-transport
  desc: Python sends an outbound POST request
  conf: 0.88
  any:
  - id: micro-behaviors/communications/http/request/verb::python-http-post-any
  - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
- id: urllib3-explicit-method-request
  desc: urllib3 sends explicit-method HTTP request
  conf: 0.94
  near_lines: 8
  all:
  - id: micro-behaviors/communications/http/request/client::urllib3-poolmanager
  - id: micro-behaviors/communications/http/request/verb::python-explicit-http-method-call
- id: url-literal
  desc: Uses a literal URL in an HTTP request
  conf: 0.8
  for:
  - python
  - makefile
  any:
  - id: micro-behaviors/communications/http/request/url::requests-get-url-literal
  - id: micro-behaviors/communications/http/post::python-post-url-literal
  - id: micro-behaviors/communications/http/request/url::urllib-url-literal
  - id: micro-behaviors/communications/http/request/executable-resource::python-http-executable-url
- id: request-python
  desc: Sends an HTTP request with a Python client library
  conf: 0.9
  for:
  - python
  - makefile
  any:
  - id: micro-behaviors/communications/http/get::requests-get
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/lib/requests::requests-put
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
  - id: micro-behaviors/communications/http/request/client::url-literal
  - id: micro-behaviors/communications/http/lib/aiohttp::aiohttp-session
  - id: micro-behaviors/communications/http/request/httpx
  - id: micro-behaviors/communications/http/request/verb::httpx-client-post-request
  - id: micro-behaviors/communications/http/request/client::urllib3-explicit-method-request
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
