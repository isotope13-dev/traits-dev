defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - python
traits:
  # Covers both the bare `request_context.request` call and receiver-qualified
  # forms such as `page.request_context.request` (formerly a separate,
  # redundant `playwright-browser-context-request` atom with the same meaning).
  - id: python-browser-context-request
    desc: Sends HTTP through a browser context
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)request_context\.request$'

  - id: python-http-client-connection
    desc: Creates an http.client HTTP or HTTPS connection
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^http\.client\.HTTPS?Connection$'

  - id: requests-get-url-literal
    desc: Literal URL passed to requests.get/httpx.get
    conf: 0.8
    if:
      type: text
      regex: '(requests|httpx|session|r)\.get\s*\(\s*["'']https?://'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: requests-post-url-literal
    desc: requests/httpx post URL literal
    conf: 0.8
    if:
      type: text
      regex: '(requests|httpx|session|r)\.post\s*\(\s*["'']https?://'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: requests-post-metadata-url
    desc: requests.post URL from __url__ metadata
    conf: 0.92
    if:
      type: text
      regex: 'requests\.post\(\s*[A-Za-z_]\w*\[[''"]__url__[''"]\]'
  - id: urllib-url-literal
    desc: urllib URL literal in HTTP
    conf: 0.8
    if:
      type: text
      regex: 'urllib2?\.(urlopen|urlretrieve|request)\s*\(\s*["'']https?://'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: python-urlopen-agent-endpoint
    desc: Python urlopen requests singular agent endpoint
    conf: 0.9
    if:
      type: text
      regex: 'urlopen\s*\([^\r\n)]{0,160}/agent["''?#]'
  - id: requests-get-binary-url
    desc: requests.get URL targets binary
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: requests.get
      arg:
        kind: string
        regex: '(?i)^https?://[^"'' ]+\.(exe|dll|jar)([?#]|$)'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: requests-get-native-url
    desc: requests.get URL targets native lib
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: requests.get
      arg:
        kind: string
        regex: '(?i)^https?://[^"'' ]+\.(so|dylib|bin)([?#]|$)'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: requests-get-script-url
    desc: requests.get URL targets script
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: requests.get
      arg:
        kind: string
        regex: '(?i)^https?://[^"'' ]+\.(sh|py|js|ps1)([?#]|$)'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: requests-get-windows-script-url
    desc: requests.get URL targets Windows script
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: requests.get
      arg:
        kind: string
        regex: '(?i)^https?://[^"'' ]+\.(bat|cmd|vbs)([?#]|$)'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: urlretrieve-binary-url
    desc: urlretrieve URL targets binary
    conf: 0.86
    for: [python, makefile]
    if:
      type: text
      regex: '(?i)\burlretrieve\s*\(\s*["'']https?://[^"''\s]{1,200}\.(exe|dll|jar)'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: urlretrieve-native-url
    desc: urlretrieve URL targets native lib
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: urllib.request.urlretrieve
      arg:
        kind: string
        regex: '(?i)^https?://[^"'' ]+\.(so|dylib|bin)([?#]|$)'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: urlretrieve-script-url
    desc: urlretrieve URL targets script
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: urllib.request.urlretrieve
      arg:
        kind: string
        regex: '(?i)^https?://[^"'' ]+\.(sh|py|js|ps1)([?#]|$)'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: urlretrieve-windows-script-url
    desc: urlretrieve URL targets Windows script
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: urllib.request.urlretrieve
      arg:
        kind: string
        regex: '(?i)^https?://[^"'' ]+\.(bat|cmd|vbs)([?#]|$)'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
  - id: response-stream-python
    desc: Python HTTP response streaming
    conf: 0.85
    if:
      type: text
      regex: 'requests\.\w{1,24}\(.{0,120}\bstream\s*=\s*True|iter_content\s*\('
  - id: async-response-stream-python
    desc: Async Python response streaming
    conf: 0.85
    if:
      type: text
      regex: \.(aiter_bytes|aread)\s*\(
  - id: urllib3-poolmanager
    desc: urllib3 PoolManager client
    conf: 0.86
    if:
      type: text
      regex: 'urllib3\.PoolManager\s*\('
  - id: python-column0-requests-get
    desc: Module assigns requests.get of a URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[A-Za-z_]\w*\s*=\s*requests\.get\(\s*["'']https?://'

  - id: python-fstring-url-get
    desc: GET interpolates a value into the URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.get\(\s*f["'']https?://[^"''\n]{0,180}\{'

  - id: python-request-error-returns-none
    desc: Request error returns None
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?m)^[ \t]*except\s+requests\.\w+\s+as\s+\w+\s*:\s*\n[ \t]*return None\b'

  # Relocated from objectives/credential-access/cloud/token/files
  # (python-client-https-literal): any `*Client("https://...")` constructor
  # given a URL literal -- an API client bound to a hard-coded endpoint.
  - id: python-client-url-literal
    desc: Client constructor takes a URL literal
    conf: 0.86
    if:
      type: text
      regex: 'Client\(\s*["'']https?://'

composite_rules:
  - id: urllib-executable-request-download
    desc: Python urllib opens a request for an executable URL
    conf: 0.94
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-variable-argument
      - id: micro-behaviors/communications/http/download/url::executable-url-reference
  - id: python-http-executable-url
    desc: Python HTTP URL targets executable
    conf: 0.86
    for: [python, makefile]
    any:
      - id: requests-get-binary-url
      - id: requests-get-native-url
      - id: urlretrieve-binary-url
      - id: urlretrieve-native-url
      - id: urllib-executable-request-download
  - id: python-http-post-any
    desc: Python HTTP POST method usage
    conf: 0.8
    any:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/request/httpx::httpx-post
      - id: httpx-client-post-request
      - id: micro-behaviors/communications/http/request/httpx::httpx-async-client-post
  - id: python-post-transport
    desc: Python sends an outbound POST request
    conf: 0.88
    any:
      - id: python-http-post-any
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
  - id: urllib3-explicit-method-request
    desc: urllib3 sends explicit-method HTTP request
    conf: 0.94
    near_lines: 8
    all:
      - id: urllib3-poolmanager
      - id: micro-behaviors/communications/http/request/verb::python-explicit-http-method-call
  - id: httpx-client-post-request
    desc: httpx Client POST request
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/client/httpx::httpx-client
      - id: micro-behaviors/communications/http/post::http-post-client-call
    near_bytes: 2048
  - id: url-literal
    desc: Uses a literal URL in an HTTP request
    conf: 0.8
    for: [python, makefile]
    any:
      - id: requests-get-url-literal
      - id: requests-post-url-literal
      - id: urllib-url-literal
      - id: python-http-executable-url
  - id: request-python
    desc: Sends an HTTP request with a Python client library
    conf: 0.9
    for: [python, makefile]
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/lib/requests::requests-put
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: url-literal
      - id: micro-behaviors/communications/http/lib/aiohttp::aiohttp-session
      - id: micro-behaviors/communications/http/request/httpx
      - id: httpx-client-post-request
      - id: urllib3-explicit-method-request
    unless:
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
