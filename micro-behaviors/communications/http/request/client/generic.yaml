defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
traits:
  - id: http-request-func
    desc: Calls a function named httpRequest
    crit: notable
    conf: 0.5
    mbc: C0002
    attack: T1071.001
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)httpRequest$'
  - id: xmlhttprequest-word
    desc: References the XMLHttpRequest HTTP client
    crit: notable
    conf: 0.4
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/
      - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
    if:
      type: text
      substr: XMLHttpRequest
composite_rules:
  # Size-gated variant of the plain JSON POST: a small script whose whole job
  # is posting a JSON body. Neutral on its own — beacon/exfiltration intent is
  # supplied by the objectives composites that pair it with payload signals.
  - id: http-client
    desc: Uses common HTTP client APIs
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/lib/urllib::urllib-word
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
  # Neutral transport evidence.  The source may use a POST, XHR, image
  # request, or sendBeacon; the data source and intent belong in objectives.
    unless:
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: javascript-http-request-channel
    desc: Uses a JavaScript HTTP request channel
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-send
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/communications/http/post::xhr-post-open
  # Every way browser JS can push data to a server, for exfiltration
  # composites: the channel above (POST/XHR/image/navigator.sendBeacon) plus
  # bare fetch() GETs and unqualified sendBeacon() calls. A stealer that swaps
  # fetch for sendBeacon must not fall out of detection. Kept separate from
  # javascript-http-request-channel so that rule's consumers keep their scope.
  - id: browser-outbound-request
    desc: Browser script sends data to a server
    crit: notable
    conf: 0.85
    for: [javascript, typescript, html]
    any:
      - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::fetch-get-call
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
    unless:
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
      - id: micro-behaviors/communications/http/request/client::node-http-client-imports
      - id: micro-behaviors/communications/http/request/client::lib-request-call
  # Neutral transport evidence for composites that must show the file can
  # actually issue the request they describe (e.g. a cloud-metadata sweep).
  # Named and filed for the capability alone: intent belongs in the
  # objectives composite that references it, never in this description.
  - id: http-request-capability
    desc: File can issue HTTP requests
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: micro-behaviors/communications/http/post::http-post-call
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
      - id: micro-behaviors/communications/http/request/dynamic::http-client-get-options
      - id: micro-behaviors/communications/http/request/json::http-post-json
