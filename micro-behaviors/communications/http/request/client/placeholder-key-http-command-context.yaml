# Placeholder keys and constructor references do not establish HTTP C2.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]
composite_rules:
  - id: placeholder-key-http-command-context
    desc: Placeholder-key, HTTP and command API refs
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/crypto/key/representation/material::change-this-key-placeholder
    any:
      - id: micro-behaviors/process/create/shell/variable-command::node-exec-command-variable
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
    near_bytes: 12000
