defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1071.001
  mbc: C0002
traits:
- id: invoke-endpoint-call
  desc: Calls an automation endpoint API
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: invokeEndpoint
- id: axios-request-call
  desc: Calls axios.request() to send an HTTP request
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    exact: axios.request
- id: axios-direct-call
  desc: Calls axios() to send an HTTP request
  crit: notable
  conf: 0.75
  if:
    type: symbol
    kind: call
    exact: axios
- id: http-request
  desc: Node.js http.request
  crit: notable
  conf: 0.7
  if:
    type: symbol
    regex: ^http(_\d+\.default)?\.request$
- id: https-request
  desc: References the https.request client method
  crit: notable
  conf: 0.7
  if:
    type: symbol
    regex: ^https(_\d+\.default)?\.request$
- id: node-https-get-dynamic
  desc: Node.js https.get dynamic call
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '["'']https["'']\)\s*\.get'
- id: h-request-call
  desc: JavaScript opens HTTP request stream
  crit: notable
  conf: 0.74
  if:
    type: symbol
    exact: h.request
- id: node-http-get-dynamic
  desc: Node.js http.get dynamic call
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '["'']http["'']\)\s*\.get'
- id: js-fetch-call
  desc: Calls JavaScript fetch API
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    regex: ^_?fetch$
  unless:
  - type: function
    exact: _fetch
  - id: micro-behaviors/data/collection/dom::local-dom-fetch-helper-context
  - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
  - id: metadata/file/extension/identity::julia-source-basename
- id: js-fetch-implementation-call
  desc: Calls an injected JavaScript fetch
  crit: notable
  conf: 0.84
  if:
    type: tree-sitter
    kind: call
    regex: (^|\.)fetchImpl\s*\(
- id: js-fetcher-fallback-call
  desc: Calls configurable JavaScript fetch fallback
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \(\s*[A-Za-z_$][\w$]*\.fetcher\s*\|\|\s*fetch\s*\)\s*\(
- id: jquery-ajax-call
  desc: Calls jQuery.ajax() to send an HTTP request
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: call
    regex: ^(\$|jQuery)\.ajax$
- id: generic-request-method-call
  desc: Calls an HTTP client request method
  crit: notable
  conf: 0.4
  if:
    type: text
    regex: \b(axios|http|https)\.request\s*\(
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/lang/natural/vocabulary/ai-assistant::agent-identity-set
composite_rules:
- id: node-https-request-h-alias
  desc: Node.js http(s).request via h alias
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/communications/http/request/client/call::h-request-call
  any:
  - id: metadata/import/builtin::node-https-h-binding-syntax
  - id: metadata/import/builtin::require-http
- id: script-http-client
  desc: Uses a script HTTP client
  crit: notable
  conf: 0.75
  any:
  - id: micro-behaviors/communications/http/request/client/call::http-client
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
  - id: micro-behaviors/communications/http/request/client/call::http-request
- id: node-http
  desc: Node.js built-in http/https module usage
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/communications/http/request/client/call::http-request
  - id: micro-behaviors/communications/http/request/client/call::https-request
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/client/call::node-http-get-dynamic
  - id: micro-behaviors/communications/http/request/client/call::node-https-get-dynamic
  - id: micro-behaviors/communications/http/request/client/call::node-https-request-h-alias
  - id: micro-behaviors/communications/http/request/client/call::node-http-alias-request-call
  - id: micro-behaviors/communications/http/request/client/initialize::node-scheme-selected-http-client
- id: http-client-usage
  desc: Uses HTTP client APIs
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/communications/http/lib/axios::request-axios
  - id: micro-behaviors/communications/http/request/client/call::node-http
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
  - id: micro-behaviors/communications/http/request/client/initialize::xmlhttprequest-new
  - id: micro-behaviors/communications/http/request/client/initialize::node-fetch-import
  - id: micro-behaviors/communications/http/client/library::umi-request-import
  - id: micro-behaviors/communications/http/request/client/initialize::got-import
  - id: micro-behaviors/communications/http/request/client/initialize::superagent-import
  - id: micro-behaviors/communications/http/request/client/initialize::needle-import
  - id: micro-behaviors/communications/http/request/client/initialize::request-import
  - id: micro-behaviors/communications/http/request/client/call::node-https-request-h-alias
- id: http-method-calls
  desc: Calls an HTTP request method
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/communications/http/request/client/call::jquery-ajax-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/request/client/call::https-request
  - id: micro-behaviors/communications/http/request/client/call::http-request
  - id: micro-behaviors/communications/http/request/client/call::node-https-request-h-alias
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
  - id: metadata/lang/source/literal/string/property::axios-data-request-literal
  - id: micro-behaviors/communications/http/request/client/exchange::fetch-post-pattern
  - id: micro-behaviors/communications/http/request/params::get-with-params
- id: js-http-get-or-fetch
  desc: JavaScript performs an HTTP GET or fetch request
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
