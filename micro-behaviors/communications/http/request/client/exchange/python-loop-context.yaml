defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

composite_rules:
  # Proximity does not establish that the request occurs inside the loop.
  # SDK multipart response readers can supply the same evidence as flooders.
  - id: aiohttp-client-near-unconditional-loop
    desc: aiohttp client evidence near unconditional loop
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-unbounded-loop
      - id: micro-behaviors/communications/http/client/library::aiohttp-session-request
