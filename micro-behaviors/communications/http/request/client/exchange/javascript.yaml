defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1071.001
  mbc: C0002
traits:
- id: google-apps-script-exec-url
  desc: References a Google Apps Script endpoint
  crit: component
  conf: 0.98
  if:
    type: text
    regex: https://script\.google\.com/macros/s/[\w-]{10,120}/exec
- id: runtime-message-data-json-body
  desc: Serializes extension message data as JSON
  crit: component
  conf: 0.98
  if:
    type: text
    regex: body\s*:\s*JSON\.stringify\([\w$]+\.data\)
- id: fetch-then-json
  desc: fetch() response JSON parse
  crit: notable
  conf: 0.74
  if:
    type: text
    regex: fetch\(.{0,80}\.then\(.{0,80}\.json\(
- id: fetch-post-pattern
  desc: Fetch call specifies an HTTP POST method
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: fetch
    arg:
      index: 1
      from:
        field: method
        whole_value: ^POST$
- id: ajax-success-handler-opening
  desc: Request success handler opens
  crit: component
  conf: 0.8
  for:
  - html
  - javascript
  if:
    type: text
    regex: success\s*:\s*function\s*\([^)]{0,60}\)\s*\{
- id: jquery-field-value-cleared
  desc: jQuery empties a form field by id
  crit: component
  conf: 0.8
  for:
  - html
  - javascript
  if:
    type: text
    regex: \$\(\s*["']#[\w-]+["']\s*\)\.val\(\s*(""|'')\s*\)
composite_rules:
- id: fetch-posts-runtime-message-to-google-script
  desc: POSTs runtime message data to a Google Apps Script endpoint
  crit: notable
  conf: 0.98
  all:
  - id: google-apps-script-exec-url
  - id: runtime-message-data-json-body
  - id: micro-behaviors/communications/http/request/client/exchange::fetch-post-pattern
  - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-on-message
- id: ajax-success-handler-clears-field
  desc: Success handler empties a form field
  crit: notable
  conf: 0.8
  for:
  - html
  - javascript
  near_bytes: 1000
  all:
  - id: ajax-success-handler-opening
  - id: jquery-field-value-cleared
- id: image-src-network-request
  desc: Creates a network-backed Image request
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  - html
  - text
  all:
  - id: micro-behaviors/ui/graphics/image::js-image-src-assignment
  any:
  - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
  - id: micro-behaviors/communications/http/client/resource::element-src-query-parameter
