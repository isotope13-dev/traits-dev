defaults:
  crit: notable
traits:
- id: webhook-site-source-call
  platforms:
  - unix
  - windows
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  desc: Source call passes a webhook.site URL
  if:
    type: symbol
    kind: call
    regex: ^[A-Za-z_][A-Za-z0-9_.]*$
    arg:
      kind: string
      substr: webhook.site
  unless:
  - id: metadata/package/testing/harness/runtime/
