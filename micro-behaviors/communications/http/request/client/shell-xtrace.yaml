defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: curl-variable-authorization-header
    desc: curl uses variable Authorization header
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @curl
          argument: (word) @flag . argument: (string) @header)
          (#match? @curl "(^|/)curl$")
          (#match? @flag "^(-H|--header)$")
          (#match? @header "^\\\"[Aa]uthorization:[ \\t]*\\$"))

composite_rules:
  - id: shell-xtrace-authorization-header
    desc: Shell tracing and variable authorization header
    crit: suspicious
    conf: 0.9
    all:
      - id: curl-variable-authorization-header
      - id: micro-behaviors/os/console/control::shell-xtrace-enable
    unless:
      - id: micro-behaviors/os/console/control::shell-xtrace-disable
