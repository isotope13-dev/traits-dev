defaults:
  platforms: [unix, windows]
  for: [scripts, source]
composite_rules:
  - id: http-get-or-post-operation
    desc: HTTP GET or POST operation
    crit: notable
    conf: 0.9
    any:
      # Require client operations, not form markup or method vocabulary.
      - id: micro-behaviors/communications/http/post::post-method-detection
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
      - id: micro-behaviors/communications/http/post::http-request-post
      - id: micro-behaviors/communications/http/post::node-https-request-post
      - id: micro-behaviors/communications/http/post::post-ast
      - id: micro-behaviors/communications/http/post::client-wrapper-post-call
      - id: micro-behaviors/communications/http/post::javascript-http-request-post
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/post::php-stream-context-http-post
      - id: micro-behaviors/communications/http/post::session-post
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/post::go-url-encoded-form-post
      - id: micro-behaviors/communications/http/post::rust-reqwest-post-call
      - id: micro-behaviors/communications/http/post::rust-ureq-post-call
      - id: micro-behaviors/communications/http/post::rust-agent-post-call
      - id: micro-behaviors/communications/http/post::elixir-httpc-post
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/request/client::http-get-dup
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-https-get
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
