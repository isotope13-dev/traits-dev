# .invalid is guaranteed nonexistent (RFC 6761 section 6.4).
# Unlike .test or .localhost, it is not a local service namespace.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
- id: fetch-invalid-domain-literal
  desc: Fetch targets a literal .invalid domain
  conf: 0.99
  if:
    type: symbol
    kind: call
    exact: fetch
    arg:
      index: 0
      kind: string
      regex: '^https?://[A-Za-z0-9.-]+\.invalid(/[^\s]*)?$'
# Count parsed call expressions, including dynamic arguments.
- id: single-fetch-call
  desc: Source contains exactly one parsed fetch call
  conf: 0.99
  count_min: 1
  count_max: 1
  if:
    type: tree-sitter
    query: |
      ((call_expression function: (identifier) @fn)
       (#eq? @fn "fetch"))
