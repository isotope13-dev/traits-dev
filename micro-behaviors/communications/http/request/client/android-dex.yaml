defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-http-input-call
    desc: DEX opens HTTP response stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/HttpURLConnection;->getInputStream'
  - id: dex-url-open-connection-call
    desc: DEX opens URL connection
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/URL;->openConnection'
