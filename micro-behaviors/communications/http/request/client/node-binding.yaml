# A module binding and same-name receiver syntax support a probable HTTP capability.
# This AST rule does not prove runtime resolution or account for intervening reassignment.
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: node-http-alias-request-call
  desc: Node HTTP binding and request-call syntax
  crit: notable
  conf: 0.92
  if:
    type: tree-sitter
    query: "(_\n  [(variable_declaration\n    (variable_declarator\n      name: (identifier)\
      \ @binding\n      value: [\n        (call_expression\n          function: (identifier)\
      \ @loader\n          arguments: (arguments (string (string_fragment) @module)))\n\
      \        (ternary_expression\n          consequence: (call_expression\n    \
      \        function: (identifier) @loader\n            arguments: (arguments (string\
      \ (string_fragment) @module))))]))\n   (lexical_declaration\n    (variable_declarator\n\
      \      name: (identifier) @binding\n      value: (call_expression\n        function:\
      \ (identifier) @loader\n        arguments: (arguments (string (string_fragment)\
      \ @module)))))]\n  [(variable_declaration\n    (variable_declarator\n      value:\
      \ (call_expression\n        function: (member_expression\n          object:\
      \ (identifier) @receiver\n          property: (property_identifier) @method))\
      \ @request))\n   (expression_statement\n    (call_expression\n      function:\
      \ (member_expression\n        object: (identifier) @receiver\n        property:\
      \ (property_identifier) @method)) @request)]\n  (#eq? @loader \"require\")\n\
      \  (#match? @module \"^(node:)?https?$\")\n  (#eq? @receiver @binding)\n  (#eq?\
      \ @method \"request\"))\n"
