defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-http-alias-request-call
    desc: Node HTTP binding and request-call syntax
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        (_
        [(variable_declaration
          (variable_declarator name: (identifier) @binding value: [
            (call_expression function: (identifier) @loader
              arguments: (arguments (string (string_fragment) @module)))
            (ternary_expression consequence: (call_expression function: (identifier) @loader
              arguments: (arguments (string (string_fragment) @module))))]))
         (lexical_declaration
          (variable_declarator name: (identifier) @binding
            value: (call_expression function: (identifier) @loader
              arguments: (arguments (string (string_fragment) @module)))))]
        [(variable_declaration
          (variable_declarator value: (call_expression function: (member_expression
            object: (identifier) @receiver property: (property_identifier) @method)) @request))
         (lexical_declaration
          (variable_declarator value: (call_expression function: (member_expression
            object: (identifier) @receiver property: (property_identifier) @method)) @request))
         (expression_statement (call_expression function: (member_expression
           object: (identifier) @receiver property: (property_identifier) @method)) @request)]
        (#eq? @loader "require")
        (#match? @module "^(node:)?https?$")
        (#eq? @receiver @binding)
        (#eq? @method "request"))

        (_
        [(variable_declaration
          (variable_declarator name: (identifier) @binding value: [
            (call_expression function: (identifier) @loader
              arguments: (arguments (string (string_fragment) @module)))
            (ternary_expression consequence: (call_expression function: (identifier) @loader
              arguments: (arguments (string (string_fragment) @module))))]))
         (lexical_declaration
          (variable_declarator name: (identifier) @binding
            value: (call_expression function: (identifier) @loader
              arguments: (arguments (string (string_fragment) @module)))))]
        (function_declaration body: (statement_block
        [(variable_declaration
          (variable_declarator value: (call_expression function: (member_expression
            object: (identifier) @receiver property: (property_identifier) @method)) @request))
         (lexical_declaration
          (variable_declarator value: (call_expression function: (member_expression
            object: (identifier) @receiver property: (property_identifier) @method)) @request))
         (expression_statement (call_expression function: (member_expression
           object: (identifier) @receiver property: (property_identifier) @method)) @request)]))
        (#eq? @loader "require")
        (#match? @module "^(node:)?https?$")
        (#eq? @receiver @binding)
        (#eq? @method "request"))
