  crit: baseline
traits:
- id: curl-wget-command-position
  desc: curl/wget in shell command position
  crit: notable
  conf: 0.9
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  - python
  - ruby
  - perl
  - javascript
  - typescript
  - applescript
  - vbs
  if:
    type: text
    # The command name must be followed by whitespace, `;`, or end of line.
    # That keeps this off regex alternations such as
    # `/\b(npm|...|curl|...)\b/` in intent classifiers, where `|curl|` is a
    # pattern branch, not a piped shell command. (The linear-time engine
    # supports no lookaround, so the follow set carries the distinction.)
    regex: (?m)(^|[;&|])[ \t]*\$?(curl|wget)(\.exe)?([ \t]+|$|;)
