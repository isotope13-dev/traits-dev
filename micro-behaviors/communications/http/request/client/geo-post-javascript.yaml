defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: fetch-json-geo-text-post
    desc: Fetch POST serializes location and text
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @fetch
          arguments: (arguments (_)
            (object
              (pair key: (property_identifier) @method value: (_) @verb)
              (pair)*
              (pair key: (property_identifier) @body value:
                (call_expression function: (member_expression
                  object: (identifier) @json property: (property_identifier) @stringify)
                  arguments: (arguments (object
                    (pair key: (property_identifier) @ip)
                    (pair key: (property_identifier) @country)
                    (pair key: (property_identifier) @city)
                    (pair key: (property_identifier) @text)))))))) @post
          (#eq? @fetch "fetch")
          (#eq? @method "method")
          (#match? @verb "POST")
          (#eq? @body "body")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @ip "ip")
          (#eq? @country "country")
          (#eq? @city "city")
          (#eq? @text "text"))
