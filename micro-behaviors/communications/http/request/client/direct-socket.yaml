# Building an HTTP request directly on a connected socket is legitimate in
# protocol tooling, but notable because it bypasses the platform HTTP client.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: direct-socket-http-request-script
    desc: Script sends raw HTTP over direct socket
    crit: notable
    conf: 0.94
    for: [scripts]
    all:
      - id: micro-behaviors/communications/socket/connect
    any:
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line

  - id: direct-socket-http-request-source
    desc: Source sends raw HTTP over direct socket
    crit: notable
    conf: 0.94
    for: [source]
    all:
      - id: micro-behaviors/communications/socket/connect
    any:
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line-source
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line-source
