defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-module-level-http-request
    desc: HTTP request created at module load
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'
