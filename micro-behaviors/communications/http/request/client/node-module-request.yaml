defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-module-level-http-request
    desc: HTTP request created at module load
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'

composite_rules:
  # A short script (the load-call atom is capped at 8 KiB) both calls one of
  # its own functions from module scope and issues a request whose destination
  # is a literal remote host. Same-file co-occurrence, not traced flow: the
  # request is likely, not proven, to be the code the load-time call reaches.
  - id: small-script-load-call-with-fixed-host-request
    desc: Small script load-calls code beside fixed-host request
    crit: notable
    conf: 0.82
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-scope-calls-declared-function
    any:
      - id: micro-behaviors/communications/http/request/configuration::node-request-options-literal-hostname
      - id: micro-behaviors/communications/http/request/configuration::node-request-options-near-literal-hostname
      - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
      - id: micro-behaviors/communications/http/request/client::js-https-fetch-literal-call

  # The request call itself sits at module scope and names a literal host.
  - id: module-level-fixed-host-request
    desc: Module-load request names a literal host
    crit: notable
    conf: 0.92
    all:
      - id: node-module-level-http-request
    any:
      - id: micro-behaviors/communications/http/request/configuration::node-request-options-literal-hostname
      - id: micro-behaviors/communications/http/request/configuration::node-request-hardcoded-remote-host
