# Request operations, rather than URL strings, imports or protocol vocabulary.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

composite_rules:
  - id: http-request-operation
    desc: References HTTP client request operations
    any:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::http-get
      - id: micro-behaviors/communications/http/get::getasync
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url
      - id: micro-behaviors/communications/http/client/library::iwr-name
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/post::requests-post
