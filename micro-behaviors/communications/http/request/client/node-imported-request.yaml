defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-http-imported-request-stream
    desc: Writes to an imported Node HTTP request stream
    crit: notable
    conf: 0.92
    near_bytes: 2048
    all:
      - id: metadata/import/npm/http
      - id: metadata/lang/source/syntax/object::http-request-options-object-shape
      - id: micro-behaviors/communications/http/request/body/construction::request-write-call
      - id: micro-behaviors/communications/http/request/body/construction::request-end-call
