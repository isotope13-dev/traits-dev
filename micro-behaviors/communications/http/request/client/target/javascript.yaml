defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1071.001
  mbc: C0002
traits:
- id: js-fetch-buffer-from-decoded-url
  desc: fetch() called with Buffer.from decoded URL
  crit: notable
  conf: 0.94
  attack: T1105
  if:
    type: text
    regex: fetch\s*\(\s*Buffer\.from\([^)]{1,120}["']base64["']\)
- id: sms-api-otp-polling
  desc: Polls SMS or OTP API with Axios
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: axios\.(get|post)\s*\([^)]{0,160}/api/(sms|otp)
    case_insensitive: true
- id: fetch-http-scheme-url
  desc: Fetches an HTTP(S)-scheme URL
  crit: notable
  conf: 0.82
  if:
    type: symbol
    kind: call
    exact: fetch
    arg:
      kind: string
      regex: ^https?://
  unless:
  - id: well-known/tool/detection/agent/skill-scanner::typescript-test-context
- id: js-https-fetch-literal-call
  desc: Fetch call targets a literal HTTPS URL
  crit: notable
  conf: 0.88
  if:
    type: symbol
    kind: call
    regex: ^((window|globalThis)\.)?fetch$
    arg:
      index: 0
      kind: string
      regex: ^https://
- id: fetch-package-homepage-value
  desc: Fetch call uses a package homepage value
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \b(fetch|axios\.get|got|https\.get)\s*\(\s*[A-Za-z_$][\w$]*\.homepage\b
- id: ajax-url-atob-decoded
  desc: Request URL comes from base64 decode
  crit: notable
  conf: 0.88
  for:
  - html
  - javascript
  if:
    type: text
    regex: \burl\s*:\s*(window\.)?atob\s*\(
composite_rules:
- id: fetch-literal-https-url
  desc: Fetch call targets a literal HTTPS URL
  crit: notable
  conf: 0.88
  for:
  - html
  - javascript
  - typescript
  any:
  - id: micro-behaviors/communications/http/request/client/target::js-https-fetch-literal-call
  - id: micro-behaviors/communications/http/request/html::html-fetch-absolute-url
