# A fetch to a loopback health endpoint polls a local service, such as an
# installer waiting for its own daemon before a sign-in step. It is not a
# remote payload fetch. Suppressor-only, so it lives outside objectives/.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: js-fetch-loopback-health-probe
  desc: fetch() polls a loopback service health endpoint
  if:
    type: text
    substr: 'fetch(`http://127.0.0.1:'
