defaults:
  for: [javascript]
  platforms: [unix, windows]

traits:
- id: fetch-dynamic-url-argument
  desc: Fetch call with dynamic URL argument
  crit: notable
  if:
    type: text
    regex: 'fetch\s*\(\s*(url[A-Za-z0-9_$]{0,100}\s*[,)]|["'']https?://[^"''\r\n]{1,200}["'']\s*\+)'
    exclude_comments: true
composite_rules:
- id: fetch-url-variable-or-literal
  desc: Fetches URL variable or HTTP literal
  crit: notable
  conf: 0.95
  any:
  - id: fetch-dynamic-url-argument
  - id: micro-behaviors/communications/http/request/client/target::js-https-fetch-literal-call
  - id: micro-behaviors/communications/http/request/client/target::fetch-http-scheme-url
