defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: single-requests-httpx-call
    desc: Exactly one requests or httpx method call
    crit: notable
    conf: 0.99
    count_max: 1
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.[a-z_]+$'

  - id: taskcluster-secret-resource-get
    desc: Requests a Taskcluster secret resource
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: requests.get
      arg:
        index: 0
        from:
          value: '^http://taskcluster/secrets/v1/secret/$'
