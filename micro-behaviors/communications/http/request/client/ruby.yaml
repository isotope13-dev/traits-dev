defaults:
  crit: notable
  for:
    - ruby
  attack: T1071.001
  mbc: C0002
  platforms:
    - unix
    - windows
traits:
  - id: httparty-get
    desc: HTTParty GET request invocation
    conf: 0.9
    if:
      type: symbol
      kind: member
      exact: 'HTTParty.get'
  - id: net-http-new
    desc: Net::HTTP.new() instantiation
    conf: 0.7
    count_min: 1
    if:
      id: micro-behaviors/communications/http/request/netlib::net-http-new
