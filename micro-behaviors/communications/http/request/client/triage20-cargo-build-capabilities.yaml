defaults:
  platforms:
  - unix
  - windows
  for:
  - rust
composite_rules:
- crit: notable
  id: cargo-build-http-client-reference
  desc: Build script references Rust HTTP clients
  conf: 0.88
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  any:
  - id: micro-behaviors/communications/http/lib/reqwest::rust-reqwest
  - id: micro-behaviors/communications/http/lib/reqwest::rust-reqwest-get-fn
  - id: metadata/lang/source/syntax/member::rust-ureq-namespace
- crit: notable
  id: cargo-build-http-capable-client-profile
  desc: Build script references HTTP-capable clients
  conf: 0.9
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  any:
  - id: micro-behaviors/process/create/direct::cargo-build-curl-wget-command
  - id: micro-behaviors/communications/http/request/client::cargo-build-http-client-reference
