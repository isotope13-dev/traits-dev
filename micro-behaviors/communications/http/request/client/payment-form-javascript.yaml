defaults:
  platforms: [windows, unix]

# Proximity alone does not prove the serialized fields are sent by AJAX.
composite_rules:
  - id: payment-form-json-ajax-context
    desc: Payment serialization with JSON, AJAX and URL
    crit: notable
    conf: 0.99
    for: [javascript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/serialize/object::payment-context-serialize-array
      - id: micro-behaviors/communications/http/request/client::jquery-ajax-call
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/data/serialize/json::json-stringify-identifier

