# Node beacon source is often staged as a string by a package written in
# another language. These atoms intentionally inspect the cached source text,
# not a language-specific AST, because the inner JavaScript is data to the
# outer parser.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1071.001

traits:
  - id: embedded-node-https-get
    desc: Embeds Node HTTPS GET call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bhttps[.]get\s*\('

  - id: embedded-node-recurring-timer
    desc: Embeds recurring Node timer callback
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'setTimeout\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*,\s*[0-9]{4,}\s*\)'

composite_rules:
  - id: embedded-node-periodic-https-beacon
    desc: Embeds periodic Node HTTPS beacon
    crit: suspicious
    conf: 0.98
    near_bytes: 1200
    all:
      - id: embedded-node-https-get
      - id: embedded-node-recurring-timer
