defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: browser-send-beacon
    desc: Calls the browser navigator.sendBeacon API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: navigator.sendBeacon
  - id: browser-send-beacon-call
    desc: Calls the browser sendBeacon method
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\\bsendBeacon\\s*\\('
