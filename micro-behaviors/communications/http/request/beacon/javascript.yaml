defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: browser-send-beacon
    desc: Calls the browser navigator.sendBeacon API
    if:
      type: symbol
      kind: call
      exact: navigator.sendBeacon
  - id: browser-send-beacon-call
    desc: Calls a sendBeacon-named function or method
    for: [html, javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)sendBeacon$'
  - id: sendbeacon-http-target
    desc: Calls sendBeacon with URL or identifier
    for: [html, javascript, typescript]
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\.sendBeacon\s*\(\s*([A-Za-z_$][\w$]*|["'']https?://)'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
  - id: x-beacon-package-request-header
    desc: HTTP request names x-beacon-package header
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: "'x-beacon-package'"
