defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: browser-send-beacon
    desc: Calls the browser navigator.sendBeacon API
    if:
      type: symbol
      exact: navigator.sendBeacon
  - id: browser-send-beacon-call
    desc: Calls the browser sendBeacon method
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bsendBeacon\s*\('
