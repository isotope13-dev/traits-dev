# Endpoint, urllib reference and error suppression are co-occurring facts.
# This does not bind the endpoint to the call or establish unauthorized export.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-urlopen-oob-suppressed-errors
    desc: Python urlopen near OOB URL and suppressed errors
    crit: notable
    conf: 0.95
    scope: file
    near_lines: 10
    all:
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/

