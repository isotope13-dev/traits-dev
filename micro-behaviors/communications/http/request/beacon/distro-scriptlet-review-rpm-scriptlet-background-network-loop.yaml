defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: rpm-scriptlet-background-network-loop
    desc: RPM scriptlet has detached network loop clues
    crit: suspicious
    conf: 0.98
    scope: leaf
    all:
      - id: metadata/build/package/maintainer-scripts::rpm-install-scriptlet-body
      - id: micro-behaviors/communications/http/request/beacon::shell-network-sleep-loop
      - id: micro-behaviors/process/daemonize/detach::detached-background-command

