defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: cvv-width-guarded-params-beacon
    desc: Beacon sender validates 3-4 digit values
    crit: notable
    conf: 0.96
    if:
      # Require the width guard in a direct if condition of the sender.
      # A nested validator inside an IIFE must not supply the guard for
      # an unrelated telemetry beacon in a different nested function.
      type: tree-sitter
      query: |
        ([(function_declaration body: (statement_block (if_statement condition: (_) @guard)) @body)
          (function_expression body: (statement_block (if_statement condition: (_) @guard)) @body)
          (arrow_function body: (statement_block (if_statement condition: (_) @guard)) @body)] @sender
          (#match? @body "navigator[.]sendBeacon")
          (#match? @body "new URLSearchParams")
          (#match? @guard "\\\\d\\{3,4\\}"))
