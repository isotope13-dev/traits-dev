defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: cvv-width-guarded-params-beacon
    desc: Beacon sender validates 3-4 digit values
    crit: notable
    conf: 0.96
    if:
      # Function scope keeps a checkout validator elsewhere in a bundle from
      # supplying the guard for an unrelated telemetry beacon.
      type: tree-sitter
      query: |
        ([ (function_declaration body: (statement_block) @body)
           (function_expression body: (statement_block) @body)
           (arrow_function body: (statement_block) @body) ] @sender
          (#match? @body "navigator[.]sendBeacon")
          (#match? @body "new URLSearchParams")
          (#match? @body "\\\\d\\{3,4\\}"))
