# Bind the serialized value to the beacon body; proximity alone would
# confuse local validation with an unrelated telemetry request.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
traits:
  - id: json-event-value-beacon
    desc: Beacons JSON containing an input event value
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @nav property: (property_identifier) @send)
          arguments: (arguments . (_) .
            (call_expression function: (member_expression object: (identifier) @json property: (property_identifier) @serialize)
              arguments: (arguments . (object
                (pair value: (member_expression
                  object: (member_expression object: (identifier) property: (property_identifier) @target)
                  property: (property_identifier) @value))))))) @beacon
          (#eq? @nav "navigator") (#eq? @send "sendBeacon")
          (#eq? @json "JSON") (#eq? @serialize "stringify")
          (#match? @target "^(target|currentTarget)$") (#eq? @value "value"))
