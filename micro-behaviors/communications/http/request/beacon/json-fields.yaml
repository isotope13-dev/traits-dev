defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: json-fields-http-beacon
    desc: HTTP beacon serializes a fields member
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (identifier) @nav
            property: (property_identifier) @send)
          arguments: (arguments .
            (string) @url .
            (call_expression
              function: (member_expression
                object: (identifier) @json
                property: (property_identifier) @stringify)
              arguments: (arguments .
                (member_expression
                  object: (identifier)
                  property: (property_identifier) @fields))))) @beacon
          (#eq? @nav "navigator")
          (#eq? @send "sendBeacon")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @fields "fields")
          (#match? @url "^[\"']https?://"))
