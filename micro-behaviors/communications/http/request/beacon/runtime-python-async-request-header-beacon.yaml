defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-async-request-header-beacon
    desc: Python header, POST and daemon-thread clues
    conf: 0.98
    # Installed app bundles ship normal site-packages modules that copy
    # headers, POST data, and run daemon workers independently. Require the
    # complete beacon in one package-root source file, not across dependencies.
    # Archive reports aggregate child evidence, so admitting archive types here
    # would reconstruct the four legs from unrelated package members.
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/configuration::python-request-header-map-copy
      - id: micro-behaviors/communications/http/request/body/construction::http-post-with-body-argument
      - id: micro-behaviors/process/thread/create::python-thread-create
      - id: micro-behaviors/process/thread/create::python-thread-daemon-assignment
