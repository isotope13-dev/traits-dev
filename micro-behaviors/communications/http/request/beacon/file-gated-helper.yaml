defaults:
  for: [shell]
  platforms: [linux]
traits:
  - id: file-gated-http-helper-write
    desc: File-test branch writes an HTTP callback helper
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (test_command) @test
          (redirected_statement
            body: (command name: (command_name) @writer argument: (raw_string) @payload)
            redirect: (file_redirect ">" destination: (_) @destination)))
          (#match? @test "^\\[\\s+-[ef]\\s+")
          (#eq? @writer "printf")
          (#match? @payload "^'#!/bin/sh\\\\ncurl\\s+-[fsSL]+\\s+https?://")
          (#match? @destination "^/usr/lib/[^/]+/[^/]+$"))
