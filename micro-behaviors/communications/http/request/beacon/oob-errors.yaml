defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: fetch-oob-suppressed-errors
    desc: Fetch with OOB reference suppresses errors
    crit: notable
    conf: 0.96
    near_lines: 12
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
    any:
      - id: micro-behaviors/data/control-flow/error-handling/suppress::fetch-empty-catch-handler
      - id: micro-behaviors/data/control-flow/error-handling/suppress::fetch-function-empty-catch-handler
    needs: 1
  - id: oob-json-post-suppressed-errors
    desc: JSON POST with OOB reference suppresses errors
    crit: notable
    conf: 0.97
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/json::http-post-json
    any:
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-error-handler
      - id: micro-behaviors/data/control-flow/error-handling/suppress::empty-catch-block
    unless:
      - id: metadata/file/catalog/network::embedded-domain-blocklist-context
  - id: oob-plaintext-post-suppressed-errors
    desc: Plaintext POST with OOB reference suppresses errors
    crit: notable
    conf: 0.97
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: micro-behaviors/communications/http/post::request-post-option
    any:
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-error-handler
      - id: micro-behaviors/data/control-flow/error-handling/suppress::resolve-as-error-handler
    unless:
      - id: metadata/file/catalog/network::embedded-domain-blocklist-context
