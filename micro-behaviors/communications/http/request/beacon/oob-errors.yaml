defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: fetch-oob-suppressed-errors
    desc: Fetch with OOB reference suppresses errors
    crit: notable
    conf: 0.96
    near_lines: 12
    all:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    any:
      - id: micro-behaviors/data/control-flow/error-handling::fetch-empty-catch-handler
      - id: micro-behaviors/data/control-flow/error-handling::fetch-function-empty-catch-handler
    needs: 1
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: oob-json-post-suppressed-errors
    desc: JSON POST with OOB reference suppresses errors
    crit: notable
    conf: 0.97
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/communications/http/request/json::http-post-json
    any:
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
      - id: micro-behaviors/data/control-flow/error-handling::empty-catch-block
    unless:
      - id: metadata/package/testing/harness/runtime/
      # Hostname-shaped strings inside an embedded domain blocklist are
      # data to be blocked, not a callback endpoint the program contacts.
      - id: metadata/file/catalog/identity::embedded-domain-blocklist-context
