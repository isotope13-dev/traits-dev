defaults:
  platforms: [unix]
  for: [shell]
  attack: T1071.001
  mbc: B0030

traits:
  - id: shell-network-sleep-loop
    desc: Shell network loop sleeps between requests
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'while true; do[\s\S]{0,240}((curl|wget|nc)|/dev/tcp)[\s\S]{0,240}\bsleep\b'
