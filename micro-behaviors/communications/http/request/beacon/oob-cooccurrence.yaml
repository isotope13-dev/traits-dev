# Co-occurrence does not establish data flow or unauthorized disclosure.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: node-oob-get-hostname-cooccurrence
  desc: HTTP GET and hostname query beside an OOB endpoint
  crit: notable
  conf: 0.95
  all:
    - id: micro-behaviors/communications/url/host::oob-endpoint-any
    - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  any:
    - id: micro-behaviors/communications/http/request/client::https-get
    - id: micro-behaviors/communications/http/request/client::http-get-dup
    - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
    - id: micro-behaviors/communications/http/query::url-derived-http-get
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: well-known/tool/detection/security-scanner/
    - id: well-known/tool/detection/opena2a-arp/
    - id: metadata/file/catalog/identity::embedded-domain-blocklist-context


- id: npm-postinstall-oob-http-cooccurrence
  desc: npm postinstall hook bundled with OOB HTTP GET code
  crit: notable
  conf: 0.98
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  any:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/communications/http/request/client::http-get-dup
  needs: 1
  unless:
  - id: metadata/package/testing/presence/harness/

  - id: "metadata/file/naming::test-directory-component"

- id: npm-hook-oob-get-hostname-cooccurrence
  desc: Install hook bundled with OOB GET and hostname queries
  crit: notable
  conf: 0.98
  for: [package.json, javascript, npm, tar, zip]
  scope: archive
  all:
  - id: micro-behaviors/communications/http/request/beacon::node-oob-get-hostname-cooccurrence
  any:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: metadata/package/scripts/lifecycle::has-install-script
  needs: 1

- id: npm-preinstall-oob-identity-cooccurrence
  desc: npm preinstall bundled with OOB host and user queries
  crit: notable
  conf: 0.96
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/user/query::os-userinfo-call
  unless:
  - id: well-known/app/ai/coding-agent/omnius/
  # A request body upgrades this preparatory callback shape to the bundled
  # install-hook host-profile beacon.
  - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body


- id: oob-http-identity-query-cooccurrence
  for: [shell, python, javascript, rust, ruby, go, php, powershell]
  desc: HTTP and identity queries beside an OOB endpoint
  crit: notable
  conf: 0.95
  all:
    - id: micro-behaviors/communications/url/host::oob-endpoint-any
    - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
  any:
    - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
    - id: micro-behaviors/os/env/read::ci-env-reference-set
    - id: micro-behaviors/communications/http/ip-discovery/
    - id: micro-behaviors/os/user/lookup::user-query-api-set
  needs: 1
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: well-known/tool/detection/security-scanner/
    - id: well-known/tool/detection/opena2a-arp/
    # Hostname-shaped strings inside an embedded domain blocklist are
    # data to be blocked, not a callback endpoint the program contacts.
    - id: metadata/file/catalog/identity::embedded-domain-blocklist-context


