defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
composite_rules:
- id: node-oob-get-hostname-cooccurrence
  desc: HTTP GET and hostname query beside an OOB endpoint
  conf: 0.95
  all:
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  any:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-get
  - id: metadata/file/profile/network::url-derived-http-get
- id: npm-postinstall-oob-http-cooccurrence
  desc: npm postinstall hook bundled with OOB HTTP GET code
  conf: 0.98
  for:
  - npm
  - tar
  - package.json
  - javascript
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  any:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/get::node-http-get-reference
  needs: 1
- id: npm-hook-oob-get-hostname-cooccurrence
  desc: Install hook bundled with OOB GET and hostname queries
  conf: 0.98
  for:
  - package.json
  - javascript
  - npm
  - tar
  - zip
  scope: archive
  all:
  - id: micro-behaviors/communications/http/request/beacon::node-oob-get-hostname-cooccurrence
  any:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: metadata/package/scripts/lifecycle::has-install-script
  needs: 1
- id: npm-preinstall-oob-identity-cooccurrence
  desc: npm preinstall bundled with OOB host and user queries
  conf: 0.96
  for:
  - npm
  - package.json
  - javascript
  scope: archive
  all:
  - id: metadata/package/scripts/command::preinstall-runs-node-local-script
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/process/identity/query::os-userinfo-call
- id: oob-http-identity-query-cooccurrence
  for:
  - shell
  - python
  - javascript
  - rust
  - ruby
  - go
  - php
  - powershell
  desc: HTTP and identity queries beside an OOB endpoint
  conf: 0.95
  all:
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
  any:
  - id: micro-behaviors/os/sysinfo/hostname::host-identity-query
  - id: micro-behaviors/os/env/read::ci-env-reference-set
  - id: micro-behaviors/communications/http/ip-discovery/
  - id: micro-behaviors/process/identity/query::process-user-identity-api-set
  needs: 1
