defaults:
  platforms: [unix]
  for: [go, elf]
composite_rules:
  - id: go-package-hook-beacon-clues
    desc: Package hook and beacon command clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/package-manager::pkg-hooks-directory-go
      - id: micro-behaviors/fs/path/script::go-beacon-script-name
      - id: micro-behaviors/communications/http/curl/command::curl-ping-or-beacon-path

