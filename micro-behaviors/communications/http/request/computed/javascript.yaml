defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-computed-http-object-call
    desc: Computed call through http-named object
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bhttps?\s*\[.{1,80}\]\s*\('

  # Obfuscators commonly route global APIs through an operator table, yielding
  # calls such as `ops[key](fetch, url, options)` instead of `fetch(...)`.
  # This atom records only that neutral source shape; loader intent is supplied
  # by composites that also require an executable response sink.
  - id: js-fetch-computed-helper-argument
    desc: Fetch API passed to computed helper
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      kind: call
      regex: '\]\(\s*fetch\s*,'
