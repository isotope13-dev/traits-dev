# Structured API actions that mutate a named resource.  These are neutral
# capabilities; authorization abuse is inferred by objective-level composites.
defaults:
  platforms: [windows, unix]
  for: [json, javascript, typescript, python, go, rust, java, shell, powershell]

traits:
  - id: destructive-resource-action-call
    desc: Calls a destructive resource method
    crit: notable
    conf: 0.96
    for: [javascript, typescript, python, go, rust, java, shell]
    if:
      type: symbol
      kind: call
      # Require a receiver/member separator and a resource noun. Do not treat
      # generic local helpers such as remove_entry as resource API calls.
      regex: '(?i)\.(cancel|delete|remove|void)\w*(reservation|booking|waitlist|member)\w*$'

  - id: destructive-account-api-call
    desc: Calls an account deletion API method
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, go, rust, java]
    if:
      type: symbol
      kind: call
      regex: '(?i)(api|client)\w*\.(cancel|delete|remove|void)\w*account\w*$'

  - id: method-cancel-reservation
    desc: cancelReservation API method field
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)["'']method["'']\s*:\s*["'']cancelReservation["'']'

  - id: method-destructive-booking
    desc: Destructive booking method field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']method["'']\s*:\s*["''](cancel|void)\w*(booking|reservation)'

  - id: foreign-principal-id-field
    desc: Other-principal identity field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](other|foreign|victim|target)[_-](user|member|account)[_-]?id["'']\s*:'

  - id: principal-id-value
    desc: Principal-scoped resource identifier
    crit: component
    conf: 0.94
    if:
      type: text
      # Require an opaque, digit-bearing identifier. Human-readable slugs such
      # as "account-password-policy" are resource names, not principal IDs.
      regex: '(?i)["''](usr|member|acc(oun)?t)[_-](\d\w{7,}|\w{3,}\d\w{3,})["'']'

  - id: http-authorization-denial-status
    desc: References HTTP 403 denial status
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)status_code\s*==\s*403|["'']status["'']\s*:\s*403|["'']403 Forbidden["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: role-permission-enforcement-call
    desc: Enforces role or permission check
    crit: notable
    conf: 0.92
    if:
      type: text
      # `_require_admin_or_owner`, `require_permission`, `require_member`:
      # an explicit gate before acting, not an unchecked cross-principal
      # call. No leading boundary: gates are usually snake_case suffixed
      # (`_require_admin`), where `\b` never holds after the underscore.
      regex: '(?i)require[_-]?(admin|owner|permission|member)\b'

  - id: permission-denial-raise
    desc: Raises a permission denial exception
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\braise\s+([\w.]+\.)?Permission(Error|Denied)\b'

  - id: check-permission-or-role-call
    desc: Checks role or permission
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)[_]?(check|verify)[_-]?(permission|role)s?\b'

  - id: has-role-or-permission-check
    desc: Checks has_role or has_permission
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)[_]?has[_-]?(role|permission)s?\b'

  - id: permission-denial-error
    desc: Returns permission denial error
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(AuthError|Error)::(forbidden|unauthorized)\b'

composite_rules:
  - id: destructive-resource-action
    desc: Destructive resource API action
    crit: notable
    conf: 0.96
    any:
      - id: destructive-resource-action-call
      - id: destructive-account-api-call
      - id: method-cancel-reservation
      - id: method-destructive-booking

  - id: cross-principal-resource-target
    desc: Cross-principal resource target
    crit: suspicious
    conf: 0.95
    all:
      - id: destructive-resource-action
    any:
      - id: foreign-principal-id-field
      - id: principal-id-value
      - id: metadata/lang/source/naming/target::named-other-principal
    near_bytes: 512
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: micro-behaviors/communications/http/server/framework::python-http-method-route
      - id: micro-behaviors/communications/http/server/framework::server-python
      # Explicit enforcement (`_require_admin_or_owner`, `PermissionError`,
      # `check_permission`, `has_role`, `AuthError::forbidden`)
      # marks authorized moderation; file-scoped, so pervasive checks
      # anywhere in the file stand the file down.
      - id: micro-behaviors/communications/http/request/action-resource::role-permission-enforcement-call
      - id: micro-behaviors/communications/http/request/action-resource::permission-denial-raise
      - id: micro-behaviors/communications/http/request/action-resource::check-permission-or-role-call
      - id: micro-behaviors/communications/http/request/action-resource::has-role-or-permission-check
      - id: micro-behaviors/communications/http/request/action-resource::permission-denial-error
  - id: destructive-action-success
    desc: Destructive API action succeeds
    crit: notable
    conf: 0.96
    all:
      - id: destructive-resource-action
      - id: micro-behaviors/data/serialize/schema-object::object-success-field
    near_bytes: 512
