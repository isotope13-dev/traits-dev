defaults:
  platforms: [windows, unix]
  for:
    - php
  crit: notable
traits:
  - id: php-input-stream-reference
    desc: References PHP raw input stream wrapper
    conf: 0.95
    unless:
      - id: metadata/library/generated::php-empty-function-declarations
      - id: metadata/library/generated::php-manual-empty-function-stubs
    if:
      type: literal
      kind: string
      substr: php://input
