defaults:
  platforms: [windows]
  for: [powershell, batch, javascript, typescript, python, vbs, lnk, pe]
traits:
  # Require the reporting source inside an actual encoded layer. Cleartext
  # deployment telemetry and arbitrary environment reads do not qualify.
  - id: encoded-downloadstring-domain-url
    desc: Encoded DownloadString URL uses logon domain
    crit: notable
    conf: 0.97
    if:
      type: encoded
      regex: '(?i)\.DownloadString\s*\(\s*["'']https?://[^;\r\n]{1,200}\$env:userdomain\b'
