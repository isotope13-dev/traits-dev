defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: qihoo-report-endpoint-url
    desc: Qihoo 360 first-party report endpoint URL
    attack: T1071.001
    if:
      type: text
      regex: '(?i)^https://open\.soft\.360\.cn/report\.php$'

composite_rules:
  - id: wininet-host-profile-api-profile
    desc: Host-profile form and report templates with HTTP
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/report::client-report-query-template
      - id: micro-behaviors/communications/http/request/report::host-profile-form-template
    any:
      - id: micro-behaviors/communications/http/client/wininet::http-open-request
      - id: micro-behaviors/communications/http/client/wininet::http-send-request
      - id: micro-behaviors/communications/http/client/wininet::internet-connect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

