defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: managed-identity-report-field-handoff
    desc: Identity getters with CIL field handoff
    crit: notable
    conf: 0.95
    # A pair of getters separated by a string is concatenated into a field;
    # that same field is immediately passed to a managed helper. Getter names
    # and HTTP APIs remain co-occurring evidence, not resolved call operands.
    # No mutable endpoint, report label or malware method name is required.
    if:
      type: yara
      source: |
        import "pe"
        rule managed_identity_report_field_handoff {
          strings:
            $machine = "get_MachineName\x00"
            $user = "get_UserName\x00"
            $client = "WebClient\x00"
            $upload = "UploadString\x00"
            $handoff = { 72 ?? ?? ?? 70 28 ?? ?? ?? 0A
                         72 ?? ?? ?? 70 28 ?? ?? ?? 0A
                         28 ?? ?? ?? 0A 7D ?? ?? ?? 04
                         02 7B ?? ?? ?? 04 28 ?? ?? ?? 06 }
          condition:
            all of them and
            for any i in (1..#handoff) : (
              uint32(@handoff[i] + 26) == uint32(@handoff[i] + 32) and
              for any s in pe.sections : (
                s.name == ".text" and
                @handoff[i] >= s.raw_data_offset and
                @handoff[i] + !handoff[i] <= s.raw_data_offset + s.raw_data_size and
                $machine in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1) and
                $user in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1) and
                $client in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1) and
                $upload in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              )
            )
        }
