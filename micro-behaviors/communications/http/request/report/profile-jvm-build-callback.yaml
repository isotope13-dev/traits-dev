---
defaults:
  platforms:
  - unix
  - windows
  for:
  - jar
traits:
- id: jvm-do-report-name
  desc: doReport text
  crit: component
  conf: 0.95
  if:
    type: text
    exact: doReport
- id: diagnostics-endpoint-name
  desc: Diagnostics endpoint name
  crit: component
  conf: 0.96
  if:
    type: text
    exact: DIAGNOSTICS_ENDPOINT
composite_rules:
- id: build-reporting-name-clues
  desc: Build callback and reporting-name clues
  crit: notable
  conf: 0.985
  all:
  - id: micro-behaviors/process/lifecycle/initialize::callback-helper-class
  - id: metadata/lang/natural/vocabulary/action::reported-word-text
  - id: micro-behaviors/communications/http/request/report::jvm-do-report-name
  - id: micro-behaviors/communications/http/request/report::diagnostics-endpoint-name
  - id: micro-behaviors/communications/url/query/endpoint::callback-status-none
