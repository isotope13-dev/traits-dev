defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: script-client-send-user-domain
    desc: Script client sends logon domain and username
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @send)
          arguments: (arguments (binary_expression
            left: (binary_expression
              left: (binary_expression
                left: (binary_expression
                  left: (member_expression object: (identifier) @domainObject
                    property: (property_identifier) @domain))
              right: (member_expression object: (identifier) @userObject
                property: (property_identifier) @user)))))) @report
          (#eq? @send "send")
          (#eq? @domain "UserDomain")
          (#eq? @user "UserName")
          (#eq? @domainObject @userObject))
