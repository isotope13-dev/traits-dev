defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001

traits:
  - id: client-report-query-template
    desc: PHP client-report query template
    conf: 0.96
    if:
      type: text
      regex: '^/?report\.php\?type=client&data=%s$'

  - id: host-profile-form-template
    desc: Username and MAC address form template
    conf: 0.98
    if:
      type: text
      regex: '(?i)^username=%s\$&\$mac=%s\$&\$'
