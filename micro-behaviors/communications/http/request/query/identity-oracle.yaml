# Evidence: https://www.sysdig.com/blog/llmjacking-evolved-attackers-are-using-stolen-ai-compute-to-build-offensive-agentic-tools
# A query value carries an identity command bracketed by echo markers. Bind
# the payload to the request; a local diagnostic or a nearby quoted probe is
# insufficient. This also covers renamed markers used by similar scanners.
defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: requests-bracketed-identity-query
    desc: Submits bracketed identity command query
    crit: suspicious
    conf: 0.97
    attack: T1190,T1059.004
    if:
      type: symbol
      kind: call
      regex: '^requests\.(get|post)$'
      arg:
        from:
          field: params
          value: '\becho[ \t]+[\w-]{3,32};[ \t]*id;[ \t]*echo[ \t]+[\w-]{3,32}\b'
