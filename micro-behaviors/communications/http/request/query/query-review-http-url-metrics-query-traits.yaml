defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -static-lib
  crit: notable
  conf: 0.94

composite_rules:
  - id: metrics-pasted-event-marker
    desc: Metrics pasted-event query near curl references
    crit: notable
    conf: 0.97
    near_bytes: 240
    all:
      - id: micro-behaviors/communications/url/resource-path/collection::metrics-run-api-path
      - id: micro-behaviors/communications/url/query/tracking::pasted-event-query
    any:
      - id: micro-behaviors/communications/http/curl/command::curl-command-url-or-option
      - id: micro-behaviors/communications/http/curl/command::curl-silent-or-fail

