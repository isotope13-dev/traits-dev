defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: phone-number-in-http-query
    desc: Fetch call contains phone-query interpolation
    conf: 0.95
    if:
      type: text
      regex: 'fetch\s*\([^;]{0,300}[?&]phone=\$\{.{1,40}\}'

  - id: phone-json-account-probe-body
    desc: JSON body contains phone field
    crit: notable
    conf: 0.9
    for: [go, python, javascript, typescript, scripts]
    if:
      type: text
      # Require a phone-shaped value (leading +, digit, or printf digit verb).
      # Bare `"phone": "` also appears in emoji name tables and unrelated JSON.
      regex: '"phone"\s*:\s*"?\+(\d|%s|%d)|"phone"\s*:\s*"\+\d|"phone"\s*:\s*%[sd]\b'
