defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: fixed-width-regex-chunking
    desc: Splits string into fixed-width regex chunks
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '\.match\(\s*/\.\{1,\d{2,5}\}/g\s*\)'

  - id: indexed-query-chunk-url
    desc: Indexed chunk parameter in HTTP query URL
    conf: 0.93
    if:
      type: text
      exclude_comments: true
      regex: '\?[A-Za-z]\w*=[^\r\n;]{1,60}&[A-Za-z]\w*=(["''`]?\s*\+\s*|\$\{\s*)\w+\['

composite_rules:
  - id: node-base64-json-chunked-query-beacon
    desc: Encodes JSON as Base64 query chunks
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/data/encode/base64/primitive::tostring-base64
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: indexed-query-chunk-url
