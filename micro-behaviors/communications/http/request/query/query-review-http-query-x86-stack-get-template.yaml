defaults:
  crit: notable
  conf: 0.92
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]

traits:
  # The GET request line and its query path are built from dword immediates
  # on the stack, so text extractors see no "GET /?a=" string. The two legs
  # are the "GET " and "/?a\0" stores in order. Adding the =%s& and p=%d
  # stores pushed precision above the calibrated range. A stack-built
  # /?a= query line is a check-in template, not generic HTTP.
  - id: x86-stack-get-query-beacon-template
    desc: x86 stack-built GET query beacon template
    if:
      type: hex
      section: .text
      pattern: "C7 84 24 ?? ?? ?? ?? 47 45 54 20 [0-12] C7 84 24 ?? ?? ?? ?? 2F 3F 61 00"
