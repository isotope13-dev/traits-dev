defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts

composite_rules:
  - id: http-quote-breakout-log-probe
    desc: HTTP client near quote-breakout log probes
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/url/query/command::query-quote-breakout-echo
      - id: micro-behaviors/communications/url/query/command::query-substitution-log-append
    any:
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: micro-behaviors/communications/http/get::http-get
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/post::fetch-post-call
    near_bytes: 2048
