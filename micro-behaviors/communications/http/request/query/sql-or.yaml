# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
traits:
- id: sql-or-comparison-query-value
  desc: URL query contains an SQL OR comparison
  crit: notable
  conf: 0.94
  unless:
  - type: text
    regex: (?i)\b(alert|attempt)\b[^\n]{0,60}\?[\w.-]+=\d+\sOR\s
  - type: text
    regex: (?i)\b(sample|example|demo)\b[^\n]{0,60}\?[\w.-]+=\d+\sOR\s
  - type: path
    regex: (^|[/\\])tests[/\\]
  if:
    type: literal
    kind: string
    regex: (?i)[?&][\w.-]+=\d+(\s|\+|%20)+OR(\s|\+|%20)+\d+(=|%3d)\d+(&|#|$)
