defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # arg.from does not propagate searchParams.set's side effect into a later
  # URL.toString(). Bind the immutable payload, URL and HTTP clients here.
  # Adjacent statements prevent an intervening query overwrite. Emit only the
  # bound default URL so the public-IP refinement can join that exact literal.
  - id: node-hostname-json-base64-query-get
    desc: Hostname JSON sent through Base64 GET query
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            "const"
            (variable_declarator name: (identifier) @os
              value: (call_expression function: (identifier) @require_os
                arguments: (arguments . (string (string_fragment) @os_module) .))))
          (lexical_declaration
            "const"
            (variable_declarator name: (identifier) @http
              value: (call_expression function: (identifier) @require_http
                arguments: (arguments . (string (string_fragment) @http_module) .))))
          (lexical_declaration
            "const"
            (variable_declarator name: (identifier) @https
              value: (call_expression function: (identifier) @require_https
                arguments: (arguments . (string (string_fragment) @https_module) .))))
          (lexical_declaration
            "const"
            (variable_declarator name: (identifier) @endpoint
              value: [
                (string (string_fragment) @remote @evidence)
                (binary_expression operator: "||"
                  right: (string (string_fragment) @remote @evidence))]))
          (lexical_declaration
            "const"
            (variable_declarator name: (identifier) @payload
              value: (call_expression
                function: (member_expression
                  object: (call_expression
                    function: (member_expression
                      object: (identifier) @buffer
                      property: (property_identifier) @from)
                    arguments: (arguments . (call_expression
                      function: (member_expression
                        object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments . (object
                        (pair value: (call_expression
                          function: (member_expression object: (identifier) @os_use
                            property: (property_identifier) @hostname)
                          arguments: (arguments)))) .)) .))
                  property: (property_identifier) @encode)
                arguments: (arguments . (string (string_fragment) @encoding) .))))
          .
          (try_statement body: (statement_block
            (lexical_declaration
              "const"
              (variable_declarator name: (identifier) @url
                value: (new_expression constructor: (identifier) @url_constructor
                  arguments: (arguments . (identifier) @endpoint_use .))))
            .
            (expression_statement (call_expression
              function: (member_expression
                object: (member_expression object: (identifier) @query_url
                  property: (property_identifier) @params)
                property: (property_identifier) @set)
              arguments: (arguments . (string) . (identifier) @sent_payload .)))
            .
            (lexical_declaration
              "const"
              (variable_declarator name: (identifier) @client
                value: (ternary_expression
                  condition: (binary_expression
                    left: (member_expression object: (identifier) @protocol_url
                      property: (property_identifier) @protocol)
                    operator: "==="
                    right: (string (string_fragment) @https_scheme))
                  consequence: (identifier) @https_use
                  alternative: (identifier) @http_use)))
            .
            (expression_statement (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @client_use
                    property: (property_identifier) @get)
                  arguments: (arguments . (call_expression
                    function: (member_expression object: (identifier) @request_url
                      property: (property_identifier) @serialize)
                    arguments: (arguments))))
                property: (property_identifier) @on))))))
          (#eq? @require_os "require")
          (#eq? @require_http "require")
          (#eq? @require_https "require")
          (#match? @os_module "^(node:)?os$")
          (#match? @http_module "^(node:)?http$")
          (#match? @https_module "^(node:)?https$")
          (#eq? @os @os_use)
          (#eq? @http @http_use)
          (#eq? @https @https_use)
          (#match? @remote "^https?://")
          (#eq? @endpoint @endpoint_use)
          (#eq? @buffer "Buffer")
          (#eq? @from "from")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @hostname "hostname")
          (#eq? @encode "toString")
          (#eq? @encoding "base64")
          (#eq? @payload @sent_payload)
          (#eq? @url_constructor "URL")
          (#eq? @url @query_url)
          (#eq? @url @protocol_url)
          (#eq? @url @request_url)
          (#eq? @protocol "protocol")
          (#eq? @https_scheme "https:")
          (#eq? @params "searchParams")
          (#eq? @set "set")
          (#eq? @client @client_use)
          (#eq? @get "get")
          (#eq? @serialize "toString")
          (#eq? @on "on"))

composite_rules:
  # Both facts must identify the same literal, not two URLs in one script.
  - id: node-hostname-base64-get-public-ip-default
    desc: Hostname query GET has public-IP default
    crit: notable
    conf: 0.98
    near_bytes: 0
    all:
      - id: node-hostname-json-base64-query-get
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
