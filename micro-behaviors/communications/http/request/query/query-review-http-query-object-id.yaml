defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - '!jcl'
  crit: notable
  conf: 0.95

composite_rules:
  - id: object-id-query-iteration-context
    desc: ID query near HTTP and iteration primitives
    all:
      - id: micro-behaviors/communications/url/construction/query::dynamic-object-id-query
      - id: micro-behaviors/communications/http/request/client::http-client
    any:
      - id: micro-behaviors/data/control-flow/loop
      - id: micro-behaviors/data/collection/create::python-itertools-cycle-call
    near_bytes: 1024

  - id: concatenated-object-id-query-iteration-context
    desc: Concatenated ID query near HTTP and iteration
    all:
      - id: micro-behaviors/communications/url/construction/query::dynamic-object-id-query-concat
      - id: micro-behaviors/communications/http/request/client::http-client
    any:
      - id: micro-behaviors/data/control-flow/loop
      - id: micro-behaviors/data/collection/create::python-itertools-cycle-call
    near_bytes: 1024
