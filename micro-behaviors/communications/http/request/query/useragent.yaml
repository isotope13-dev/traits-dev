# Query encoding does not turn the routinely sent User-Agent into a secret.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: fetch-useragent-query
  desc: Fetch near User-Agent query construction
  crit: notable
  conf: 0.98
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/url/construction/query::useragent-query-value-concatenation
  - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
