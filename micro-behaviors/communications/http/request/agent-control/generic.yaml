# HTTP surfaces that drive a local AI-agent harness. These paths and managed
# environment variables are neutral on their own: the harness UI, integration
# clients, and administrative tools may legitimately use them. Objective rules
# combine them with self-escalating permission or approval payloads.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.96
  attack: T1071.001

traits:
  - id: agent-command-execution-endpoint
    desc: Agent command-execution API endpoint
    if:
      type: text
      regex: '/api/commands/execute\b'

  - id: agent-approval-response-endpoint
    desc: Agent approval-response API endpoint
    if:
      type: text
      regex: '/api/respond\b'

  - id: agent-approval-event-stream-endpoint
    desc: Agent approval event-stream endpoint
    if:
      type: text
      regex: '/api/events\.mux\b'

  - id: agent-control-url-environment
    desc: Agent control URL environment variable
    if:
      type: text
      regex: '\b(DSH_WEB_URL|(AI_?)?AGENT_(WEB|CONTROL|API)_URL|HARNESS_(WEB|CONTROL|API)_URL)\b'

  - id: agent-session-id-environment
    desc: Agent session ID environment variable
    if:
      type: text
      regex: '\b(DSH_SESSION_ID|(AI_?)?AGENT_SESSION_ID|HARNESS_SESSION_ID)\b'

  - id: agent-approval-request-event
    desc: References an agent approval-request event
    if:
      type: literal
      kind: string
      exact: approval/requested
