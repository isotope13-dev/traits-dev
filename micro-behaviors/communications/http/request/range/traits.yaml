defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: C0002
  attack: T1071.001

traits:
  - id: source-range-header-access
    desc: Source reads the HTTP Range request header
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(headers|request|req)\s*\.\s*get\s*\(\s*["''`]Range["''`]'
