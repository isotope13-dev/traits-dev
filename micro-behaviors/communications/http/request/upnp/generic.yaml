# UPnP Internet Gateway Device control: asking the router to forward an
# external port to this host.
#
# These were scoped to Linux ELF and to the scripting languages IoT botnets are
# written in. Nothing about the protocol is platform-specific -- it is SSDP over
# UDP and SOAP over HTTP, and the SOAP action names below are the same bytes in
# any implementation. Windows malware has used the same three calls for as long
# as the IoT families have; leaving `pe` out of `for:` meant a PE calling
# AddPortMapping against an InternetGatewayDevice matched none of this file.
defaults:
  platforms: [linux, windows]
  for: [elf, pe, dll, c, cpp, go, rust, python, javascript, typescript]
  crit: notable
  conf: 0.88
  mbc: C0002

traits:
  - id: add-port-mapping-soap
    desc: UPnP AddPortMapping SOAP action
    attack: T1105
    if:
      type: text
      substr: AddPortMapping

  - id: internet-gateway-service
    desc: UPnP InternetGatewayDevice service discovery
    conf: 0.86
    if:
      type: text
      regex: 'urn:schemas-upnp-org:device:InternetGatewayDevice:[12]'

  - id: wan-connection-service
    desc: UPnP WAN connection service reference
    conf: 0.86
    if:
      type: text
      regex: 'WAN(IP|PPP)Connection'

  - id: relay-port-mapping-body
    desc: UPnP relay port mapping body
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: NewPortMappingDescription>RELAY

  # The device-type token on its own. `internet-gateway-service` above expects
  # the whole URN as one literal, which only survives when the client hardcodes
  # it; clients that build the URN at runtime -- printf over a schema prefix, a
  # device type and a version -- leave the pieces in separate strings and match
  # nothing. These two atoms are the pieces, and the composite below pairs them
  # so neither counts alone: the schema prefix appears in any UPnP participant
  # including pure responders, and "InternetGatewayDevice" is a word.
  - id: upnp-device-schema-urn-prefix
    desc: UPnP device schema URN prefix
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '^urn:schemas-upnp-org:'

  - id: internet-gateway-device-type-token
    desc: UPnP InternetGatewayDevice type token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: InternetGatewayDevice

composite_rules:
  - id: split-internet-gateway-device-urn
    desc: UPnP gateway URN assembled from parts
    crit: notable
    conf: 0.9
    all:
      - id: upnp-device-schema-urn-prefix
      - id: internet-gateway-device-type-token

  - id: internet-gateway-service-reference
    desc: References the UPnP InternetGatewayDevice
    crit: notable
    conf: 0.9
    any:
      - id: internet-gateway-service
      - id: split-internet-gateway-device-urn

  - id: internet-gateway-port-mapping
    desc: UPnP gateway port mapping request
    crit: notable
    conf: 0.92
    all:
      - id: add-port-mapping-soap
      - id: internet-gateway-service-reference
    any:
      - id: wan-connection-service
      - id: relay-port-mapping-body
