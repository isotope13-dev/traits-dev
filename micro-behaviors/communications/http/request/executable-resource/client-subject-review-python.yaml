---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
composite_rules:
- id: urllib-executable-request-download
  desc: Python urllib opens a request for an executable URL
  conf: 0.94
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
  - id: micro-behaviors/communications/http/lib/urllib::urlopen-variable-argument
  - id: micro-behaviors/communications/http/download/url::executable-url-reference
- id: python-http-executable-url
  desc: Python HTTP URL targets executable
  conf: 0.86
  for:
  - python
  - makefile
  any:
  - id: micro-behaviors/communications/http/request/executable-resource::requests-get-binary-url
  - id: micro-behaviors/communications/http/request/executable-resource::requests-get-native-url
  - id: micro-behaviors/communications/http/request/executable-resource::urlretrieve-binary-url
  - id: micro-behaviors/communications/http/request/executable-resource::urlretrieve-native-url
  - id: micro-behaviors/communications/http/request/executable-resource::urllib-executable-request-download
