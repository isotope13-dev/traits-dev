defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: http-path-b-payload-suffix
    desc: HTTP path has payload suffix
    conf: 0.8
    if:
      type: string_literal
      regex: '(GET|POST|PUT) +/[^ ]+\.(dll|so|dat|payload)'
# A /captcha or /recaptcha path segment: every sign-up form that embeds
# reCAPTCHA or serves its own challenge (Element's registration flow). The
# router-relay phishing composite adds the numeric-host request. The segment
# must end there (slash, query, fragment, quote, .php or end of text): a bare
# word boundary also accepted file names such as captcha-typing-job.jpg.
