defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: node-bound-request-write-end
    desc: Writes and ends a bound HTTP request
    if:
      type: tree-sitter
      query: |
        (statement_block
          [
            (variable_declaration (variable_declarator
              name: (identifier) @request
              value: (call_expression function: (member_expression
                object: (identifier) @client property: (property_identifier) @method))))
            (lexical_declaration (variable_declarator
              name: (identifier) @request
              value: (call_expression function: (member_expression
                object: (identifier) @client property: (property_identifier) @method))))
          ]
          (expression_statement (call_expression
            function: (member_expression object: (identifier) @writer property: (property_identifier) @write)
            arguments: (arguments . (_) .))) @body
          (expression_statement (call_expression
            function: (member_expression object: (identifier) @closer property: (property_identifier) @end)))
          (#match? @client "^https?$")
          (#eq? @method "request")
          (#eq? @write "write")
          (#eq? @end "end")
          (#eq? @request @writer)
          (#eq? @request @closer))
