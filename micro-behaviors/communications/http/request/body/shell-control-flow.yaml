defaults:
  for: [python, javascript, typescript]
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.95

traits:
  - id: python-form-shell-control-value
    desc: HTTP form value contains shell control text
    for: [python]
    if:
      type: symbol
      kind: call
      exact: requests.post
      arg:
        from:
          field: data
          value: '(;|&&|\|)\s*[A-Za-z/]'
  - id: fetch-shell-control-body-value
    desc: Fetch body contains shell control text
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 1
        from:
          field: body
          value: '(;|&&|\|)\s*[A-Za-z/]'

composite_rules:
  - id: http-shell-control-body-value
    desc: HTTP body value contains shell control text
    any:
      - id: python-form-shell-control-value
      - id: fetch-shell-control-body-value
