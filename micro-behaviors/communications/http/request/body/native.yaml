defaults:
  crit: notable
  conf: 0.95
  platforms: [unix]
  for: [elf]
  attack: T1071.001
  mbc: C0002

traits:
  - id: fixed-random-data-form-body
    desc: HTTP form body sends fixed random_data
    if:
      type: text
      exact: data=random_data
      section: .rodata

  - id: rand-parameter-form-body
    desc: HTTP form body includes rand parameter
    if:
      type: text
      exact: data=1&rand=
