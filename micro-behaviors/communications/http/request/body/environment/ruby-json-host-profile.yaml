defaults:
  platforms:
  - unix
  - windows
  for:
  - ruby
traits:
- id: ruby-json-hostname-path-form-post
  desc: Posts hostname JSON and source path
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((_ (assignment left: (identifier) @profile
              right: (hash (pair value: [(call receiver: (constant) @socket method: (identifier) @hostname)
                (parenthesized_statements (rescue_modifier body: (call receiver: (constant) @socket method: (identifier) @hostname)))])))
          . (assignment left: (identifier) @uri right:
            [(call method: (constant) @uri_class arguments: (argument_list . (string (string_content) @destination) .))
             ((call receiver: (constant) @uri_class method: (identifier) @uri_method
               arguments: (argument_list . (string (string_content) @destination) .))
               (#eq? @uri_method "parse"))])
          . (assignment left: (identifier) @form right:
            [(hash (pair value: (call receiver: (constant) @json method: (identifier) @serialize
        arguments: (argument_list . (identifier) @serialized_profile .))) (pair value: (call receiver: (constant) @file method: (identifier) @expand
        arguments: (argument_list . (identifier) @self .))))
             (hash (pair value: (call receiver: (constant) @file method: (identifier) @expand
        arguments: (argument_list . (identifier) @self .))) (pair value: (call receiver: (constant) @json method: (identifier) @serialize
        arguments: (argument_list . (identifier) @serialized_profile .))))])
          . [(call receiver: (scope_resolution) @http method: (identifier) @post
        arguments: (argument_list . (identifier) @sent_uri . (identifier) @sent_form .)) @evidence (assignment right: (call receiver: (scope_resolution) @http method: (identifier) @post
        arguments: (argument_list . (identifier) @sent_uri . (identifier) @sent_form .)) @evidence)])
        (#eq? @socket "Socket") (#eq? @hostname "gethostname")
        (#eq? @uri_class "URI") (#match? @destination "^https?://")
        (#not-match? @destination "^https?://(localhost[:/]|127\\.|0\\.0\\.0\\.0[:/]|\\[::1\\])")
        (#eq? @json "JSON") (#match? @serialize "^(generate|dump)$")
        (#eq? @profile @serialized_profile) (#eq? @file "File")
        (#eq? @expand "expand_path") (#eq? @self "__FILE__")
        (#eq? @http "Net::HTTP") (#eq? @post "post_form")
        (#eq? @uri @sent_uri) (#eq? @form @sent_form)
        (#set! cleave.ignore-comments "true"))
