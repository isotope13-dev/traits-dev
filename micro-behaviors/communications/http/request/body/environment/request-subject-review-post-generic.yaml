defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - php
  - html
  - shell
  mbc: C0002
  crit: notable
traits:
- id: axios-post-env-body
  desc: Axios POST uses env-named body variable
  conf: 0.86
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: axios\.post\s*\([^,]{0,260},\s*(env|envToSave|environment|envData)\b
