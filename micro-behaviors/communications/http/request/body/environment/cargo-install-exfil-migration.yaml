defaults:
  for: [rust]
  platforms:
  - unix
  - windows
  crit: suspicious
composite_rules:
- id: rust-build-rs-env-http-post
  desc: build.rs posts environment data
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
  unless:
  - id: metadata/package/files/system-package::debian-missing-sources-vendored-crate
- id: rust-proc-macro-env-http-post
  desc: Rust proc macro posts environment data
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/lang/source/declaration::rust-proc-macro-entrypoint
  - id: micro-behaviors/communications/http/request/body/environment::environment-http-body-flow
