# Each CargoTarget object has exactly one phase and one events key. Two
# matches require both keys within the same target object.
defaults:
  crit: suspicious
  conf: 0.95
  platforms: [unix, windows]
  for: [crate, tar, zip]

traits:
  - id: cargo-build-module-environment-upload
    desc: Cargo build modules upload environment data
    if:
      type: value
      path: cargo_context.targets[*]
      regex: '(("phase":"build"|"events":\[[^]]*"environment-http-body").*){2}'
    unless:
      - id: micro-behaviors/data/control-flow/branch::cargo-credential-http-false-branch
  - id: cargo-proc-macro-module-environment-upload
    desc: Procedural macro uploads environment data
    if:
      type: value
      path: cargo_context.targets[*]
      regex: '(("phase":"proc-macro"|"events":\[[^]]*"environment-http-body").*){2}'
    unless:
      - id: micro-behaviors/data/control-flow/branch::cargo-credential-http-false-branch
