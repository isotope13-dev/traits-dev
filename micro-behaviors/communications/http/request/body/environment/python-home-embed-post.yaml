defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-home-embed-json-post
    desc: Posts JSON embed with home directory
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment left: (identifier) @embed right: (dictionary
            (pair value: (call function: (identifier) @str arguments: (argument_list
              (call function: (attribute object: (identifier) @path attribute: (identifier) @home))))))))
          (expression_statement (assignment left: (identifier) @body right: (dictionary
            (pair value: (list (identifier) @embed_use)))))
          (try_statement body: (block (expression_statement (call
            function: (attribute object: (identifier) @requests attribute: (identifier) @post)
            arguments: (argument_list (keyword_argument name: (identifier) @json value: (identifier) @body_use))))))))
          (#eq? @str "str") (#eq? @path "Path") (#eq? @home "home")
          (#eq? @embed @embed_use) (#eq? @body @body_use)
          (#eq? @requests "requests") (#eq? @post "post") (#eq? @json "json"))
