defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-inline-environ-http-body
    desc: HTTP body receives inline environment mapping
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((call
          function: [(attribute attribute: (identifier) @_method) (identifier) @_method]
          arguments: (argument_list
            (keyword_argument
              name: (identifier) @_kw
              value: [
                (attribute object: (identifier) @_os attribute: (identifier) @_env)
                (dictionary (pair value: (attribute object: (identifier) @_os attribute: (identifier) @_env)))
              ]))) @call
          (#match? @_method "^(post|put|patch|request)$")
          (#match? @_kw "^(json|data|content)$")
          (#eq? @_os "os")
          (#eq? @_env "environ"))
        ((call
          function: [(attribute attribute: (identifier) @_method) (identifier) @_method]
          arguments: (argument_list
            (keyword_argument
              name: (identifier) @_kw
              value: [
                (call) @env_expr
                (dictionary_comprehension) @env_expr
                (dictionary (pair value: [(call) @env_expr (dictionary_comprehension) @env_expr]))
              ]))) @call
          (#match? @_method "^(post|put|patch|request)$")
          (#match? @_kw "^(json|data|content)$")
          (#match? @env_expr "^(dict\\(\\s*(os\\.)?environ\\s*\\)|(os\\.)?environ\\.copy\\(\\s*\\)|json\\.dumps\\(\\s*(dict\\(\\s*)?(os\\.)?environ(\\s*\\))?[^)]*\\)(\\.encode\\([^)]*\\))?|\\{[^{}]+\\bfor\\b[^{}]+\\bin\\s+(os\\.)?environ(\\.(items|keys|values)\\(\\s*\\))?[^{}]*\\})$"))

  - id: python-bound-environ-http-body
    desc: HTTP body sends bound environment mapping
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (([
          (module
            (expression_statement (assignment left: (identifier) @env_var right: [(_) @env_rhs (dictionary (pair value: (_) @env_rhs))]))
            [
              (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))])
              (if_statement consequence: (block (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))])))
              (try_statement body: (block (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))])))
            ])
          (block
            (expression_statement (assignment left: (identifier) @env_var right: [(_) @env_rhs (dictionary (pair value: (_) @env_rhs))]))
            [
              (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))])
              (return_statement (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))
              (if_statement consequence: (block (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))])))
              (try_statement body: (block (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))])))
            ])
        ])
          (#match? @_method "^(post|put|patch|request)$")
          (#match? @_kw "^(json|data|content)$")
          (#eq? @env_var @sent_var)
          (#match? @env_rhs "^(os\\.environ|dict\\(\\s*(os\\.)?environ\\s*\\)|(os\\.)?environ\\.copy\\(\\s*\\)|json\\.dumps\\(\\s*(dict\\(\\s*)?(os\\.)?environ(\\s*\\))?[^)]*\\)(\\.encode\\([^)]*\\))?|\\{[^{}]+\\bfor\\b[^{}]+\\bin\\s+(os\\.)?environ(\\.(items|keys|values)\\(\\s*\\))?[^{}]*\\})$"))
        (([
          (module
            (expression_statement (assignment left: (identifier) @env_var right: [(_) @env_rhs (dictionary (pair value: (_) @env_rhs))]))
            (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(call function: (_) @_ser arguments: (argument_list (identifier) @sent_var)) (call function: (attribute object: (identifier) @sent_var attribute: (identifier) @_ser)) (call function: (attribute object: (call function: (_) @_ser arguments: (argument_list (identifier) @sent_var)) attribute: (identifier) @_enc))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(call function: (_) @_ser arguments: (argument_list (identifier) @sent_var)) (call function: (attribute object: (identifier) @sent_var attribute: (identifier) @_ser)) (call function: (attribute object: (call function: (_) @_ser arguments: (argument_list (identifier) @sent_var)) attribute: (identifier) @_enc))]))))]))
          (block
            (expression_statement (assignment left: (identifier) @env_var right: [(_) @env_rhs (dictionary (pair value: (_) @env_rhs))]))
            (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(call function: (_) @_ser arguments: (argument_list (identifier) @sent_var)) (call function: (attribute object: (identifier) @sent_var attribute: (identifier) @_ser)) (call function: (attribute object: (call function: (_) @_ser arguments: (argument_list (identifier) @sent_var)) attribute: (identifier) @_enc))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(call function: (_) @_ser arguments: (argument_list (identifier) @sent_var)) (call function: (attribute object: (identifier) @sent_var attribute: (identifier) @_ser)) (call function: (attribute object: (call function: (_) @_ser arguments: (argument_list (identifier) @sent_var)) attribute: (identifier) @_enc))]))))]))
        ])
          (#match? @_method "^(post|put|patch|request)$")
          (#match? @_kw "^(json|data|content)$")
          (#match? @_ser "^(json\\.dumps|dict|str|encode)$")
          (#eq? @env_var @sent_var)
          (#match? @env_rhs "^(os\\.environ|dict\\(\\s*(os\\.)?environ\\s*\\)|(os\\.)?environ\\.copy\\(\\s*\\)|json\\.dumps\\(\\s*(dict\\(\\s*)?(os\\.)?environ(\\s*\\))?[^)]*\\)(\\.encode\\([^)]*\\))?|\\{[^{}]+\\bfor\\b[^{}]+\\bin\\s+(os\\.)?environ(\\.(items|keys|values)\\(\\s*\\))?[^{}]*\\})$"))

  - id: python-iterated-environ-http-body
    desc: HTTP body sends loop-collected environment
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (([
          (module
            (for_statement
              right: (_) @iter_src
              body: (block [
                (expression_statement (assignment left: (subscript value: (identifier) @harvest_var)))
                (if_statement consequence: (block (expression_statement (assignment left: (subscript value: (identifier) @harvest_var)))))
              ]))
            [
              (expression_statement (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))
              (if_statement consequence: (block (expression_statement (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))))
              (try_statement body: (block (expression_statement (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))))
            ])
          (block
            (for_statement
              right: (_) @iter_src
              body: (block [
                (expression_statement (assignment left: (subscript value: (identifier) @harvest_var)))
                (if_statement consequence: (block (expression_statement (assignment left: (subscript value: (identifier) @harvest_var)))))
              ]))
            [
              (expression_statement (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))
              (if_statement consequence: (block (expression_statement (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))))
              (try_statement body: (block (expression_statement (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))))
            ])
        ])
          (#match? @iter_src "^(os\\.)?environ(\\.(items|keys|values)\\(\\s*\\))?$")
          (#match? @_method "^(post|put|patch|request)$")
          (#match? @_kw "^(json|data|content)$")
          (#eq? @harvest_var @sent_var))

  - id: python-helper-environ-http-body
    desc: HTTP body sends environment helper result
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition
            name: (identifier) @helper
            body: (block (return_statement (_) @ret_expr)))
          (function_definition
            body: (block
              (expression_statement (assignment left: (identifier) @var right: (call function: (identifier) @helper_call)))
              (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))]))))
          (#match? @ret_expr "^(os\\.environ|dict\\(\\s*(os\\.)?environ\\s*\\)|(os\\.)?environ\\.copy\\(\\s*\\)|json\\.dumps\\(\\s*(dict\\(\\s*)?(os\\.)?environ(\\s*\\))?[^)]*\\)|\\{[^{}]+\\bfor\\b[^{}]+\\bin\\s+(os\\.)?environ(\\.(items|keys|values)\\(\\s*\\))?[^{}]*\\})$")
          (#eq? @helper @helper_call)
          (#eq? @var @sent_var)
          (#match? @_method "^(post|put|patch|request)$")
          (#match? @_kw "^(json|data|content)$"))
        ((module
          (function_definition
            name: (identifier) @helper
            body: (block (return_statement (_) @ret_expr)))
          (expression_statement (assignment left: (identifier) @var right: (call function: (identifier) @helper_call)))
          (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(identifier) @sent_var (dictionary (pair value: (identifier) @sent_var))]))))]))
          (#match? @ret_expr "^(os\\.environ|dict\\(\\s*(os\\.)?environ\\s*\\)|(os\\.)?environ\\.copy\\(\\s*\\)|json\\.dumps\\(\\s*(dict\\(\\s*)?(os\\.)?environ(\\s*\\))?[^)]*\\)|\\{[^{}]+\\bfor\\b[^{}]+\\bin\\s+(os\\.)?environ(\\.(items|keys|values)\\(\\s*\\))?[^{}]*\\})$")
          (#eq? @helper @helper_call)
          (#eq? @var @sent_var)
          (#match? @_method "^(post|put|patch|request)$")
          (#match? @_kw "^(json|data|content)$"))
        ((module
          (function_definition
            name: (identifier) @helper
            body: (block (return_statement (_) @ret_expr)))
          [
            (function_definition
              body: (block
                (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(call function: (identifier) @helper_call) (dictionary (pair value: (call function: (identifier) @helper_call)))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(call function: (identifier) @helper_call) (dictionary (pair value: (call function: (identifier) @helper_call)))]))))])))
            (expression_statement [(call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(call function: (identifier) @helper_call) (dictionary (pair value: (call function: (identifier) @helper_call)))]))) (assignment right: (call function: [(attribute attribute: (identifier) @_method) (identifier) @_method] arguments: (argument_list (keyword_argument name: (identifier) @_kw value: [(call function: (identifier) @helper_call) (dictionary (pair value: (call function: (identifier) @helper_call)))]))))])
          ])
          (#match? @ret_expr "^(os\\.environ|dict\\(\\s*(os\\.)?environ\\s*\\)|(os\\.)?environ\\.copy\\(\\s*\\)|json\\.dumps\\(\\s*(dict\\(\\s*)?(os\\.)?environ(\\s*\\))?[^)]*\\)|\\{[^{}]+\\bfor\\b[^{}]+\\bin\\s+(os\\.)?environ(\\.(items|keys|values)\\(\\s*\\))?[^{}]*\\})$")
          (#eq? @helper @helper_call)
          (#match? @_method "^(post|put|patch|request)$")
          (#match? @_kw "^(json|data|content)$"))

composite_rules:
  - id: python-harvested-environment-http-body
    desc: Python HTTP body carries harvested environment
    conf: 0.95
    any:
      - id: python-inline-environ-http-body
      - id: python-bound-environ-http-body
      - id: python-iterated-environ-http-body
      - id: python-helper-environ-http-body
