# Telemetry is not theft. Require the hostname query inside the actual POST
# body's interpolation, rather than unrelated hostname and HTTP references.
defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-post-hostname-body
    desc: Ruby POST body interpolates the hostname
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call receiver: (scope_resolution) @http
          method: (identifier) @post
          arguments: (argument_list
            . (_)
            . (string
              (interpolation
                (call receiver: (constant) @socket
                  method: (identifier) @hostname))))) @send
          (#eq? @http "Net::HTTP")
          (#eq? @post "post")
          (#eq? @socket "Socket")
          (#eq? @hostname "gethostname"))
