# The flow producer resolves requests aliases but currently represents
# os.environ as an unknown merge. A body-flow event alone does not distinguish
# a complete snapshot from one selected setting. Bind both imports and the
# snapshot expression structurally until member-read provenance is available.
# Consecutive module-start imports and a following call exclude intervening
# rebinding, local lookalikes, quoted examples and separately logged snapshots.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-import-bound-environment-json-body
    desc: Requests JSON sends full environment
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module
          . (import_statement name: [
            (dotted_name (identifier) @os)
            (aliased_import name: (dotted_name) alias: (identifier) @os)
          ]) @os_import
          . (import_statement name: [
            (dotted_name (identifier) @http)
            (aliased_import name: (dotted_name) alias: (identifier) @http)
          ]) @http_import
          . (expression_statement (call
            function: (attribute object: (identifier) @client attribute: (identifier) @post)
            arguments: (argument_list
              (keyword_argument name: (identifier) @json value: (call
                function: (identifier) @dict
                arguments: (argument_list . (attribute
                  object: (identifier) @source attribute: (identifier) @environ) .)))))) @evidence)
          (#match? @os_import "^import\\s+os(\\s+as\\s+\\w+)?\\s*$")
          (#match? @http_import "^import\\s+requests(\\s+as\\s+\\w+)?\\s*$")
          (#eq? @os @source) (#eq? @http @client)
          (#not-eq? @os @http) (#not-eq? @os "dict") (#not-eq? @http "dict")
          (#eq? @post "post") (#eq? @json "json")
          (#eq? @dict "dict") (#eq? @environ "environ"))
        ((module
          . (import_statement name: [
            (dotted_name (identifier) @http)
            (aliased_import name: (dotted_name) alias: (identifier) @http)
          ]) @http_import
          . (import_statement name: [
            (dotted_name (identifier) @os)
            (aliased_import name: (dotted_name) alias: (identifier) @os)
          ]) @os_import
          . (expression_statement (call
            function: (attribute object: (identifier) @client attribute: (identifier) @post)
            arguments: (argument_list
              (keyword_argument name: (identifier) @json value: (call
                function: (identifier) @dict
                arguments: (argument_list . (attribute
                  object: (identifier) @source attribute: (identifier) @environ) .)))))) @evidence)
          (#match? @os_import "^import\\s+os(\\s+as\\s+\\w+)?\\s*$")
          (#match? @http_import "^import\\s+requests(\\s+as\\s+\\w+)?\\s*$")
          (#eq? @os @source) (#eq? @http @client)
          (#not-eq? @os @http) (#not-eq? @os "dict") (#not-eq? @http "dict")
          (#eq? @post "post") (#eq? @json "json")
          (#eq? @dict "dict") (#eq? @environ "environ"))
