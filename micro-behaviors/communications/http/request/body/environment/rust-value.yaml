# A selected environment value is not necessarily a bulk environment dump.
# Preserve the relationship as a neutral capability; objectives add context.
defaults:
  for: [rust]
  platforms: [unix, windows]
traits:
  - id: rust-environment-value-http-body-flow
    desc: Rust environment values form HTTP body
    crit: notable
    conf: 0.96
    if:
      type: value
      path: source.payload_flow.events[*].kind
      regex: '^environment(-value)?-http-body$'
