defaults:
  platforms: [unix]
  for: [objc, elf]
  attack: T1041

traits:
  - id: objc-curlopt-postfields
    desc: "libcurl POST body option reference"
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: CURLOPT_POSTFIELDS
    unless:
      - id: well-known/app/data/ucsc-kent::ucsc-kent-twobitinfo-context
composite_rules:
  - id: objc-libcurl-postfields
    desc: "libcurl body option with Objective-C runtime"
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/request/body::objc-curlopt-postfields
      - id: micro-behaviors/process/interpreter/runtime/dynamic::objc-runtime-msgsend
