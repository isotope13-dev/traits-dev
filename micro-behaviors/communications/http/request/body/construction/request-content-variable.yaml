defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: request-write-post-content-variable
    desc: Request write/post takes content/file variable
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '\b(req|request)\.(write|post)\s*\(\s*(content|file)\b'
