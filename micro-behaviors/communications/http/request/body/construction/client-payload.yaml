defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.86

traits:
  - id: client-payload-argument
    desc: HTTP client call supplies a payload argument
    for: [python, javascript]
    if:
      type: text
      regex: '(?i)\b(requests|httpx|axios)\.\w+\([^)]{0,300}\b(body|data|json|payload)\s*='
    unless:
      - id: well-known/lib/network/requests::module-banner

  - id: urllib-payload-argument
    desc: urllib call supplies a payload argument
    for: [python]
    if:
      type: text
      regex: '(?i)\burllib\.request\.\w+\([^)]{0,300}\b(body|data)\s*='
  - id: python-encoded-body-request-with-headers
    desc: Python passes encoded request body and headers
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: data\s*=\s*\w+\.encode\(\)\s*,\s*headers\s*=
