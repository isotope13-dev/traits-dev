defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - ruby
  - perl
  - php
  crit: notable
traits:
- id: streaming-messages-request-payload
  desc: Request includes messages with streaming enabled
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '(?is)messages\s*,.{0,80}stream\s*:\s*true'
- id: request-body-property-access
  desc: Accesses a request body property
  conf: 0.84
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \b(req|request)\s*\.\s*body\s*\.\s*[A-Za-z_$][\w$]*
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
- id: fetch-options-json-body
  desc: fetch sends options JSON request body
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '\bfetch\s*\([\s\S]{0,900}\bbody\s*:\s*JSON\.stringify\s*\(\s*\{\s*options\s*:'
- id: http-post-with-body-argument
  desc: HTTP POST supplies a body argument
  conf: 0.82
  for:
  - python
  if:
    type: tree-sitter
    kind: call
    regex: \.post\s*\([^)]{0,120}\b(data|json|files)\s*=
- id: python-requests-post-body-variable
  desc: Python requests POST passes a body variable
  conf: 0.9
  for:
  - python
  if:
    type: tree-sitter
    kind: call
    regex: requests\.post\([^)]{0,120}\b(data|json)\s*=\s*body\b
- id: python-encrypt-result-requests-post-body
  desc: Encrypt result enters requests POST body
  conf: 0.97
  for:
  - python
  if:
    type: symbol
    kind: call
    exact: requests.post
    arg:
      from:
        field: data
        call: (^|\.)encrypt$
  unless:
  - id: metadata/lang/source/origin::heuristic-quoted-source
- id: python-encrypt-result-httpx-post-body
  desc: Encrypt result enters httpx POST body
  conf: 0.97
  for:
  - python
  if:
    type: symbol
    kind: call
    exact: httpx.post
    arg:
      from:
        field: data
        call: (^|\.)encrypt$
  unless:
  - id: metadata/lang/source/origin::heuristic-quoted-source
composite_rules:
- id: python-encrypted-post
  for:
  - python
  desc: Python POST body contains encrypt results
  conf: 0.94
  any:
  - id: python-encrypt-result-requests-post-body
  - id: python-encrypt-result-httpx-post-body
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
- id: http-upload-or-body-sink
  desc: HTTP upload, POST, or request-body evidence
  conf: 0.86
  any:
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/communications/http/post::js-fetch-post-request
  - id: micro-behaviors/communications/http/post::php-stream-context-http-post
  - id: micro-behaviors/communications/http/curl::curl-body-or-upload-option
  - id: micro-behaviors/communications/http/upload::python-http-files-parameter
  - id: micro-behaviors/communications/http/request/body/construction::request-write-call
  - id: micro-behaviors/communications/http/request/json::http-post-json
