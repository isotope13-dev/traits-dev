defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, text]
traits:
- id: fetch-json-bracket-body-text
  desc: Fetch call text with JSON-serialized body
  crit: notable
  if:
    type: text
    # Dotted or obfuscator-bracketed JSON access: JSON.stringify( / JSON['..'](.
    regex: '(?s)fetch.{0,700}body.{0,100}JSON(\[|\.stringify\s*\()'
