defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  attack: T1071.001
  mbc: C0002

traits:
  - id: request-end-body-call
    desc: Ends request-like object with a body argument
    conf: 0.92
    if:
      type: text
      regex: '\b(req|request)\.end\s*\(\s*[^)\s]'
  - id: bound-request-end-identifier-body
    desc: Ends request result with body variable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '\.end$'
      receiver:
        from:
          call: '\.request$'
      arg:
        index: 0
        kind: identifier
        name_regex: '.'
