defaults:
  for: [groovy]
  platforms: [unix, windows]
  attack: T1041

traits:
  - id: groovy-http-post-output
    desc: "HTTP POST method followed by output stream"
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'setRequestMethod\s*\(\s*["'']POST["'']\s*\)[\s\S]{0,240}outputStream'
