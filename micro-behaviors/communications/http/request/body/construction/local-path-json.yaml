defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-request-writes-local-path-json
    desc: HTTP request writes JSON containing local paths
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      receiver:
        from:
          call: '^(http|https)\.request$'
      arg:
        index: 0
        from:
          call: '^(os\.homedir|process\.cwd)$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
            - call: '^Buffer\.from$'
              arguments: [0]
