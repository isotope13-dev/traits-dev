defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1071.001

traits:
  - id: python-post-content-field
    desc: POST call includes a content field
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\.post\([^)]{0,120}["'']content["'']'
  - id: python-post-text-json-body
    desc: POST JSON body includes a text key
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.post\([^)]{0,120}json\s*=\s*\{["'']text["'']\s*:'
  - id: python-wrapper-post-json-content
    desc: POST wrapper sends JSON content argument
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '_request\(\s*["'']POST["''][\s\S]{0,220}json=\{"content":\s*\w+'
  - id: python-direct-post-json-content
    desc: POST call sends JSON content argument
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.post\([^)]{0,120}json=\{"content":\s*\w+'

composite_rules:
  - id: python-post-json-content
    desc: Python POST sends a JSON content argument
    crit: notable
    conf: 0.95
    any:
      - id: python-wrapper-post-json-content
      - id: python-direct-post-json-content
