defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1071.001

traits:
  - id: python-post-content-field
    desc: POST call includes a content field
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\.post\([^)]{0,120}["'']content["'']'
  - id: python-wrapper-post-json-content
    desc: POST wrapper sends JSON content argument
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '_request\(\s*["'']POST["''][\s\S]{0,220}json=\{"content":\s*\w+'
