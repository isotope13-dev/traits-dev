defaults:
  crit: notable
  conf: 0.94
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-http-module-require
    desc: Requires the Node HTTP module
    if:
      type: text
      regex: "require\\s*\\(\\s*['\"]http['\"]\\s*\\)"

  - id: node-https-module-require
    desc: Requires the Node HTTPS module
    if:
      type: text
      regex: "require\\s*\\(\\s*['\"]https['\"]\\s*\\)"

  - id: node-request-result-write-end
    desc: Node request result writes and ends body
    size_max: 262144
    if:
      type: tree-sitter
      language: javascript
      query: |
        (statement_block
          [(variable_declaration (variable_declarator
            name: (identifier) @request
            value: (call_expression function: (member_expression
              property: (property_identifier) @method))))
           (lexical_declaration (variable_declarator
            name: (identifier) @request
            value: (call_expression function: (member_expression
              property: (property_identifier) @method))))]
          (expression_statement (call_expression
            function: (member_expression object: (identifier) @writer property: (property_identifier) @write)
            arguments: (arguments . (_))))
          (expression_statement (call_expression
            function: (member_expression object: (identifier) @closer property: (property_identifier) @end)))
          (#eq? @method "request")
          (#eq? @write "write")
          (#eq? @end "end")
          (#eq? @request @writer)
          (#eq? @request @closer))

composite_rules:
  - id: node-conditional-module-request-write-end
    desc: Conditional HTTP module streams request body
    crit: notable
    conf: 0.93
    all:
      - id: node-http-module-require
      - id: node-https-module-require
      - id: node-request-result-write-end
    near_lines: 24
