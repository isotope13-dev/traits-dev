defaults:
  crit: notable
  for: [shell, c, cpp]
  platforms: [unix]
traits:
  - id: shell-curl-data-binary-variable
    desc: curl sends shell variable as request body
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '\bcurl\b[^\n;|]{0,160}--data-binary[ \t]+"?\$\{?[A-Za-z_]\w*'
  - id: curl-data-binary-stdin
    desc: curl uploads stdin as raw body
    conf: 0.86
    for: [scripts, binaries, shell, batch, powershell, groovy, python, javascript, ruby]
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,160}--data-binary\s+@-'
