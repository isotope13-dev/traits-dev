defaults:
  crit: notable
  for: [shell, c, cpp]
  platforms: [unix]
traits:
  - id: shell-curl-data-binary-variable
    desc: curl sends shell variable as request body
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '\bcurl\b[^\n;|]{0,160}--data-binary[ \t]+"?\$\{?[A-Za-z_]\w*'
  - id: curl-data-binary-stdin
    desc: curl uploads stdin as raw body
    conf: 0.86
    for: [scripts, binaries, shell, batch, powershell, groovy, python, javascript, ruby]
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,160}--data-binary\s+@-'
    unless:
      - type: text
        regex: 'shell.{0,30}/bin/echo.{0,20}\}\);'
  - id: c-curl-data-binary-stdin
    desc: C uploads piped input with curl
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)"[^"\n]{0,300}\bcurl\b[^"\n]{0,160}--data-binary\s+@-'
  - id: perl-curl-data-binary-stdin
    desc: Perl curl stdin body
    crit: notable
    conf: 0.96
    for: [perl]
    if:
      type: text
      regex: '[''"]--data-binary[''"]\s*,\s*[''"]@-[''"]'
