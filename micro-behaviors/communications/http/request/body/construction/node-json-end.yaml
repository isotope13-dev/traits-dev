defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-http-json-end-body
    desc: Node HTTP end() sends JSON
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.end$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'
          through:
            - call: '\.request$'
              receiver: true
      arg:
        index: 0
        from:
          call: '^JSON\.stringify$'
