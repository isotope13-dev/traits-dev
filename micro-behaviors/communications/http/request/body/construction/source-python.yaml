defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - python

traits:
  - id: python-request-data-argument
    desc: Python Request call passes a body argument
    conf: 0.84
    if:
      # `urlencode()` also builds ordinary GET query strings.  Match the
      # parsed Request call's data= shape instead of treating every urlencode
      # call as a form POST.
      type: tree-sitter
      query: |
        (call
          function: [
            (identifier) @callee
            (attribute attribute: (identifier) @callee)]
          arguments: (argument_list
            (keyword_argument name: (identifier) @keyword))
          (#eq? @callee "Request")
          (#eq? @keyword "data")) @request
    unless:
      - id: well-known/app/development/jennifer/
      - type: path
        regex: '(?i)\\.j$'
      - type: basename
        regex: '^test_.{0,120}\.py$'
      - type: path
        regex: '(^|[\\/])flask_api[\\/]'
