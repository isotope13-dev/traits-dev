defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-query-body-url-helper
    desc: Passes query body with URL-labelled input
    conf: 0.95
    if:
      # PHP flow retains the URL subscript's literal key and a query-builder
      # result passed as the second argument. It does not model the external
      # helper's implementation, so this is preparation, not a proven send.
      type: symbol
      kind: call
      regex: '^[A-Za-z_][A-Za-z0-9_]*$'
      args:
        - index: 0
          from:
            value: '^url$'
        - index: 1
          from:
            call: '^http_build_query$'
