defaults:
  crit: notable
  conf: 0.95
  for: [scripts, source, github-actions]
  platforms: [unix, windows]
traits:
  - id: curl-at-source-body-command
    desc: curl sends file or stdin body
    if:
      type: text
      regex: '(?m)^\s*curl\s+[^\n]{0,180}--data-binary\s+["'']?@[^\n\s"'']{1,180}["'']?\s+https?://'
