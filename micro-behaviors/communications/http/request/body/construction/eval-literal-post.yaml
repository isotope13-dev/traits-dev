# Relocated from micro-behaviors/communications/http/request/body/application-state:
# these rules inspect JSON request-body construction inside string literals (used in
# `eval(...)`, `Function(...)`, or `popup.document.write("<script>…</script>")`),
# without verifying any specific application-state source.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: literal-json-variable-record-body
    desc: String literal builds JSON variable body
    if:
      type: literal
      regex: '\bbody\s*:\s*JSON\.stringify\s*\(\s*\{\s*[\w$]+\s*:\s*[\w$]+\s*\}'

composite_rules:
  - id: literal-fetch-post-json-variable-record
    desc: String literal posts variable JSON record
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/request/target::literal-fetch-http-url
      - id: micro-behaviors/communications/http/request/reference::literal-post-method
      - id: literal-json-variable-record-body
