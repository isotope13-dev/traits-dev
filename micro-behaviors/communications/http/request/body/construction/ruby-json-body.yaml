defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-net-http-json-body-assignment
    desc: Assigns a Ruby object's JSON request body
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*\w+\.body\s*=\s*\w+\.to_json\b'

  - id: ruby-json-body-through-local-variable
    desc: Ruby sends a serialized local JSON value
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((method body: (body_statement
          (assignment
            left: (identifier) @serialized
            right: (call method: (identifier) @to_json))
          (assignment
            left: (call method: (identifier) @body)
            right: (identifier) @assigned)))
          (#eq? @to_json "to_json")
          (#eq? @body "body")
          (#eq? @serialized @assigned))
