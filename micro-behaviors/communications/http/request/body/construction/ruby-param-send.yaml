defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-parameter-body-http-post-sender
    desc: Sends parameter as constructed HTTP POST body
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((method parameters: (method_parameters (_) (identifier) @body)
          body: (body_statement
            (assignment left: (identifier) @request right: (call receiver: (scope_resolution) @post method: (identifier) @new))
            (assignment left: (call receiver: (identifier) @owner method: (identifier) @field) right: (identifier) @value)
            (call method: (identifier) @send arguments: (argument_list (identifier) @sent))))
          (#eq? @post "Net::HTTP::Post") (#eq? @new "new")
          (#eq? @request @owner) (#eq? @field "body") (#eq? @body @value)
          (#eq? @send "request") (#eq? @request @sent))
