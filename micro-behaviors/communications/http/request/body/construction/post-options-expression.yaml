defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, rtf]
  crit: notable
  conf: 0.95

traits:
  - id: post-options-named-expression-body
    desc: POST options with a named body expression
    if:
      type: text
      regex: 'method:\s*["'']POST["''],\s*body:\s*[A-Za-z_$][\w$]*'
