# Static receiver correlation; this does not prove runtime resolution or execution.
# The query enumerates the placements that keep the require binding and the
# request stream correlated while staying compact enough for large bundles:
# one same-scope pattern plus four cross-scope patterns (declared handler,
# handler bound in a declaration, assigned, or passed inline), each with
# plain sibling legs instead of nested per-leg alternations. A declared handler
# may share a local block with its module binding inside a wrapper.
