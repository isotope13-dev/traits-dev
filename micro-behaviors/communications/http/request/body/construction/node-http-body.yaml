defaults:
  platforms: [unix]
  for: [javascript]
traits:
  - id: req-write-postdata
    desc: Request write with postData reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: req.write(postData)

composite_rules:
  - id: node-http-body-write
    desc: Node HTTP request writes a body
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/client::http-request
      - id: metadata/lang/source/literal/string::quoted-post-token
      - id: metadata/lang/source/syntax/call/invocation::req-write-call-prefix-text-reference
    any:
      - id: micro-behaviors/communications/http/header/content-type::plain-text-body-header
      - id: micro-behaviors/communications/http/request/body/construction::req-write-postdata

  - id: node-direct-ip-http-body
    desc: Node HTTP request to a direct IP
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/client::http-request
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: metadata/lang/source/syntax/call/invocation::req-write-call-prefix-text-reference
    any:
      - id: micro-behaviors/communications/url/host/port-http::http-url-port-8009-reference
      - id: micro-behaviors/communications/http/header/content-type::plain-text-body-header

