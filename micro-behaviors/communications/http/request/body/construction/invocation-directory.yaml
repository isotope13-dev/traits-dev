defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-request-writes-directory-basename
    desc: Module-load POST includes invocation folder name
    crit: notable
    conf: 0.98
    size_max: 20000
    if:
      type: tree-sitter
      language: javascript
      query: |
        (program
          (_ (variable_declarator
            name: (identifier) @directory
            value: (_) @directory_source))
          (_ (variable_declarator
            name: (identifier) @base
            value: (call_expression function: (member_expression
              property: (property_identifier) @basename)
              arguments: (arguments (identifier) @directory_value))))
          (_ (variable_declarator
            name: (identifier) @record
            value: (object (pair value: (identifier) @base_value))))
          (_ (variable_declarator
            name: (identifier) @destination
            value: (string (string_fragment) @destination_url)))
          (function_declaration name: (identifier) @sender body: (statement_block
            (_ (variable_declarator
              name: (identifier) @encoded
              value: (call_expression function: (member_expression
                object: (identifier) @json property: (property_identifier) @stringify)
                arguments: (arguments (identifier) @record_value))))
            (_ (variable_declarator
              name: (identifier) @request
              value: (call_expression function: (member_expression
                property: (property_identifier) @request_method)
                arguments: (arguments (identifier) @destination_value
                  (object (pair key: (property_identifier) @method_key
                    value: (string (string_fragment) @method_value)))))))
            (expression_statement (call_expression
              function: (member_expression object: (identifier) @request_value
                property: (property_identifier) @write)
              arguments: (arguments (identifier) @encoded_value)))))
          (expression_statement (call_expression
            function: (identifier) @invoked arguments: (arguments)))
          (#eq? @sender @invoked)
          (#eq? @directory @directory_value)
          (#match? @directory_source "^process\\s*\\.\\s*env\\s*\\.\\s*INIT_CWD(\\s*\\|\\|\\s*process\\s*\\.\\s*cwd\\s*\\(\\s*\\))?$")
          (#eq? @destination @destination_value)
          (#match? @destination_url "^https?://")
          (#not-match? @destination_url "(?i)^https?://(localhost|127\\.[0-9.]+|0\\.0\\.0\\.0|\\[::1\\])([:/]|$)")
          (#eq? @basename "basename") (#eq? @base @base_value)
          (#eq? @json "JSON") (#eq? @stringify "stringify")
          (#eq? @record @record_value) (#eq? @encoded @encoded_value)
          (#eq? @request_method "request") (#eq? @request @request_value)
          (#eq? @method_key "method") (#match? @method_value "(?i)^POST$")
          (#eq? @write "write"))
