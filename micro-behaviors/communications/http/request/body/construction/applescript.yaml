defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1041

traits:
  - id: applescript-message-curl-post
    desc: Curl posts a constructed message
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'curl\s+-fksL\s+-m\s+\d+\s+-d\s+"\s*&\s*message\s*&\s*"\s+https://"\s*&\s*domain\s*&\s*"/j'
