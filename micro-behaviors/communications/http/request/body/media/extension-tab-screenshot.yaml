traits:
  - id: extension-tab-screenshot-fetch-body
    desc: Posts visible tab screenshot as JSON
    crit: notable
    conf: 0.96
    platforms: [unix, windows]
    for: [javascript]
    if:
      # Follow the callback result through the Promise and into the request.
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration "const" (variable_declarator name: (identifier) @image
            value: (await_expression (new_expression constructor: (identifier) @promise
              arguments: (arguments (arrow_function
                parameters: (formal_parameters . (identifier) @resolve)
                body: (statement_block (expression_statement (call_expression
                  function: (member_expression) @capture
                  arguments: (arguments (arrow_function
                    parameters: (formal_parameters . (identifier) @frame)
                    body: (statement_block (expression_statement (call_expression
                      function: (identifier) @done
                      arguments: (arguments . (identifier) @result)))))))))))))))
          . (try_statement body: (statement_block
            (lexical_declaration (variable_declarator
              value: (await_expression (call_expression function: (identifier) @fetch
                arguments: (arguments . (_) . (object
                  (pair key: (property_identifier) @method value: (string) @verb)
                  (pair key: (property_identifier) @body
                    value: (call_expression function: (member_expression) @stringify
                      arguments: (arguments . (object
                        (pair key: (property_identifier) @screenshot
                          value: (identifier) @uploaded)))))))))) @evidence))))
          (#eq? @promise "Promise")
          (#match? @capture "^(chrome|browser)\\.tabs\\.captureVisibleTab$")
          (#eq? @resolve @done)
          (#eq? @frame @result)
          (#eq? @fetch "fetch")
          (#eq? @method "method")
          (#match? @verb "^[\"']POST[\"']$")
          (#eq? @body "body")
          (#eq? @stringify "JSON.stringify")
          (#eq? @screenshot "screenshot")
          (#eq? @image @uploaded))
