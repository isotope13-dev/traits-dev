defaults:
  platforms: [windows, unix, android]
  for:
    - java
    - class
    - jar
    - zip

composite_rules:
  - id: jvm-multipart-image-form-field
    desc: JVM multipart image file field
    crit: notable
    conf: 0.94
    for: [class, jar, zip]
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/multipart::jvm-multipart-form-disposition
      - id: micro-behaviors/communications/http/request/body/media::jvm-multipart-image-filename
