defaults:
  platforms:
    - windows
    - unix
  for:
    - python
  crit: notable
traits:
  - id: python-post-screenshot-body
    desc: HTTP POST body from screen capture
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: (^|\.)(post|request)$
      arg:
        from:
          field: data
          call: (^|\.)(ImageGrab\.grab|pyautogui\.screenshot|screenshot)$
  - id: python-post-image-json-body
    desc: POST JSON body includes image key
    if:
      type: text
      regex: '\.post.{0,100}json=\{.{0,40}[\x27\x22]image[\x27\x22]\s*:'
