defaults:
  platforms: [windows, unix, android]
  for:
    - java
    - class
    - jar
    - zip

traits:
  - id: jvm-multipart-image-filename
    desc: JVM multipart image filename
    crit: notable
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)filename="[^"]{1,120}\.(jpe?g|png|bmp)"'
