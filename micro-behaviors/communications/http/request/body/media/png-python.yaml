defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: urllib-png-body
    desc: urllib request body starts with PNG
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        from:
          field: data
          whole_value: '^\x{89}PNG\r\n\x{1a}\n'
