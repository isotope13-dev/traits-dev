defaults:
  platforms: [unix, windows]
  for: [java]
traits:
  - id: java-urlconnection-body-stream-write
    desc: Writes a URLConnection request body
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((block
          (local_variable_declaration type: (type_identifier) @type
            declarator: (variable_declarator name: (identifier) @channel))
          (expression_statement (method_invocation
            object: (method_invocation object: (identifier) @used
              name: (identifier) @stream)
            name: (identifier) @write)))
          (#match? @type "^(HttpURLConnection|HttpsURLConnection|URLConnection)$")
          (#eq? @channel @used)
          (#eq? @stream "getOutputStream")
          (#eq? @write "write"))
