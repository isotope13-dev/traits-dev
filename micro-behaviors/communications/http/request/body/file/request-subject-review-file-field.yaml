defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: append-file-field-variable
    desc: Appends a variable to file field
    crit: notable
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '\.append$'
      args:
        - index: 0
          kind: string
          exact: file
        - index: 1
          kind: identifier
