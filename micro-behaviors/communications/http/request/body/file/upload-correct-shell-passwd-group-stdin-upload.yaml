defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.96
traits:
  - id: shell-passwd-group-stdin-upload
    desc: Pipes grouped passwd read into curl body
    if:
      type: tree-sitter
      language: shell
      query: |
        ((pipeline !redirect
          . (compound_statement
              (command !redirect
                . name: (command_name) @cat
                . argument: (word) @path .))
          . "|"
          . (command !redirect
              name: (command_name) @curl
              argument: (word) @flag .
              argument: (word) @stdin
              argument: (word) @url) @sink .) @upload
         (#eq? @cat "cat")
         (#eq? @path "/etc/passwd")
         (#eq? @curl "curl")
         (#match? @flag "^(-d|--data(-binary)?)$")
         (#eq? @stdin "@-")
         (#match? @url "^https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
         (#not-match? @sink "(^|[[:space:]])(-o|--output)[[:space:]]+--data")
         (#not-match? @sink "(^|[[:space:]])(-H|--header)[[:space:]]+--data")
         (#not-match? @upload "<"))
    unless:
      - type: symbol
        kind: function
        exact: cat
      - type: symbol
        kind: function
        exact: curl
