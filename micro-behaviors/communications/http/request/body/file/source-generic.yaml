defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, javascript, powershell, php, html, shell]
  mbc: C0002
  attack: T1071.001

traits:
  - id: request-write-file-data-variable
    desc: HTTP request sends file data variable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^r(equest|eq)?\.(write|post|send)$'
      arg:
        kind: identifier
        name: fileData
