defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-file-bytes-as-gzip-post-body
    desc: File bytes become gzip HTTP request body
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @bytes
            value: (yield_expression (call_expression
              function: (member_expression property: (property_identifier) @read)
              arguments: (arguments . (identifier) .)))))
          (lexical_declaration (variable_declarator value:
            (yield_expression (call_expression function: (identifier) @fetch
              arguments: (arguments (_)
                (object
                  (pair key: (property_identifier) @method value: (string (string_fragment) @post))
                  (pair key: (property_identifier) @headers value: (object
                    (pair key: (string (string_fragment) @contenttype)
                      value: (string (string_fragment) @gzip))))
                  (pair key: (property_identifier) @body value: (identifier) @sent))))))))
          (#eq? @read "readFile") (#eq? @fetch "fetch")
          (#eq? @method "method") (#eq? @post "POST")
          (#eq? @headers "headers") (#eq? @contenttype "Content-Type")
          (#eq? @gzip "application/gzip") (#eq? @body "body") (#eq? @bytes @sent))