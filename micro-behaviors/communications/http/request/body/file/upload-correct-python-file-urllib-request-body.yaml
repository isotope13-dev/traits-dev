defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-file-urllib-request-body
    desc: File contents enter urllib request body
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?Request$'
      arg:
        from:
          field: data
          call: '^open$'
          through:
            - call: '(^|\.)read$'
              receiver: true
