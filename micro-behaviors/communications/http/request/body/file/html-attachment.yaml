defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: append-html-filename-argument
  desc: Append call supplies an HTML filename
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: '\.append$'
    arg:
      index: 2
      kind: string
      regex: '(?i)\.html?$'
