defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.97

traits:
  # A multipart CLI argument names the attached file itself. These facts
  # describe body construction; the consumer requires the curl operation.
  - id: asterisk-config-form-file-field
    desc: Asterisk config in multipart file argument
    if:
      type: text
      regex: '(-F|--form) +["'']?\w+=@/etc/asterisk/[\w.-]+\.conf'
  - id: encoded-asterisk-config-form-file-field
    desc: Encoded Asterisk multipart file argument
    for: [shell, python, javascript, typescript, php, ruby, perl, powershell]
    if:
      type: encoded
      regex: '(-F|--form) +["'']?\w+=@/etc/asterisk/[\w.-]+\.conf'
