defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: code-context-in-report-payload
    desc: Places code context into report payload
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @diagnostics
              value: (call_expression function: (member_expression
                object: (call_expression function: (member_expression
                  object: (array
                    (ternary_expression condition: (identifier) @context
                      consequence: (template_string (template_substitution (identifier) @context2))))))))))
          (lexical_declaration
            (variable_declarator name: (identifier) @payload
              value: (object (shorthand_property_identifier) @member))))
          (#eq? @context "code_context")
          (#eq? @context @context2)
          (#eq? @diagnostics @member)
          (#eq? @payload "payload"))

  - id: serialized-payload-post-write
    desc: Writes serialized report payload to POST
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @body
              value: (call_expression function: (member_expression object: (identifier) @json
                property: (property_identifier) @stringify)
                arguments: (arguments . (identifier) @payload .))))
          (lexical_declaration
            (variable_declarator name: (identifier) @request
              value: (call_expression function: (member_expression property: (property_identifier) @requestfn)
                arguments: (arguments (object
                  (pair key: (property_identifier) @method value: (string (string_fragment) @post)))))))
          (expression_statement (call_expression function: (member_expression object: (identifier) @request2
            property: (property_identifier) @write)
            arguments: (arguments . (identifier) @body2 .))))
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @payload "payload")
          (#eq? @requestfn "request")
          (#eq? @method "method")
          (#eq? @post "POST")
          (#eq? @write "write")
          (#eq? @request @request2)
          (#eq? @body @body2))
