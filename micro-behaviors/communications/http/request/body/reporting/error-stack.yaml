defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: error-stack-json-post
    desc: Posts error stack in JSON report
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @body
              value: (call_expression function: (member_expression object: (identifier) @json
                property: (property_identifier) @stringify)
                arguments: (arguments (object
                  (pair value: (binary_expression left: (member_expression
                    property: (property_identifier) @stack))))))))
          (lexical_declaration
            (variable_declarator name: (identifier) @request
              value: (call_expression function: (member_expression property: (property_identifier) @requestfn)
                arguments: (arguments (object
                  (pair key: (property_identifier) @method value: (string (string_fragment) @post)))))))
          (expression_statement (call_expression function: (member_expression object: (identifier) @request2
            property: (property_identifier) @write)
            arguments: (arguments . (identifier) @body2 .))))
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @stack "stack")
          (#eq? @requestfn "request")
          (#eq? @method "method")
          (#eq? @post "POST")
          (#eq? @write "write")
          (#eq? @request @request2)
          (#eq? @body @body2))
