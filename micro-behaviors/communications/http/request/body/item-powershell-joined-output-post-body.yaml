defaults:
  platforms: [windows]
  for: [powershell]

traits:
  # A report caption is context, not proof that a beacon ran or data left.
- id: powershell-joined-output-post-body
  desc: Passes joined output to a POST helper
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?i)\bpost\s*\(\s*\$o\s*-join\b'

