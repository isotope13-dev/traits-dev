# Bind the encoded result to the immediately following POST's argument.
# A later overwrite of body must not count as sending the encoded data.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.97

traits:
  - id: npm-preinstall-httpx-base64-results-body
    desc: Preinstall HTTPX POST takes Base64 results
    if:
      type: value
      path: scripts.preinstall
      regex: '\bbody=base64\.b64encode\(str\(results\)[^;]+;\s*httpx\.post\([^;]+=\s*body\b'
  - id: npm-preinstall-requests-base64-results-body
    desc: Preinstall Requests POST takes Base64 results
    if:
      type: value
      path: scripts.preinstall
      regex: '\bbody=base64\.b64encode\(str\(results\)[^;]+;\s*requests\.post\([^;]+=\s*body\b'
