defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-form-post-identity-command
    desc: Ruby form POST includes identity command output
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call receiver: (scope_resolution) @http
          method: (identifier) @post
          arguments: (argument_list
            . (_)
            . (hash (pair value: (string
              (interpolation (subshell) @command)))))) @evidence
          (#eq? @http "Net::HTTP")
          (#eq? @post "post_form")
          (#match? @command "^`(whoami|id)`$"))
