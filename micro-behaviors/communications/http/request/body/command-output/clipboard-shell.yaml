# Inline command substitution binds the clipboard result to the form field.
defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.98
traits:
  - id: shell-clipboard-http-form-body
    desc: curl form field contains pbpaste output
    unless:
      - id: micro-behaviors/data/source/function/names::shell-curl-function-definition
      - type: symbol
        kind: function
        exact: pbpaste
    if:
      type: tree-sitter
      language: shell
      query: |
        (command name: (command_name (word) @curl)
          argument: (word) @option
          . argument: (string
            . (string_content) @field
            . (command_substitution
              . (command name: (command_name (word) @clipboard) !redirect .) .) .)
          (#match? @curl "^(/usr/bin/)?curl$")
          (#eq? @option "--data-urlencode")
          (#match? @field "^[A-Za-z_][A-Za-z0-9_-]*=$")
          (#match? @clipboard "^(/usr/bin/)?pbpaste$"))
