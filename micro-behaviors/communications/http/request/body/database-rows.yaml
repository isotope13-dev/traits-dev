defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97
traits:
  - id: python-post-whatsapp-query-results
    desc: HTTP POST data derives from WhatsApp query
    if:
      type: symbol
      kind: call
      exact: requests.post
      arg:
        index: 1
        from:
          field: data
          call: '(^|\.)execute$'
          literal: 'ZWAMESSAGE'
          through:
            - call: '(^|\.)fetchall$'
              receiver: true
            - call: '^str$'
              arguments: [0]
