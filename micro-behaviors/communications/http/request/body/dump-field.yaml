defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, xpi]
  attack: T1041

traits:
  - id: session-dump-request-body
    desc: Places a session dump in HTTP body
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bbody\s*:\s*\{[^}]{0,120}\bdump\b'
    unless:
      - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
