defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: request-end-body-call
    desc: Ends request-like object with a body argument
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(req|request)\.end\s*\(\s*[^)\s]'
  - id: process-env-in-body-field
    desc: process.env value in a body/data field
    for: [javascript]
    crit: notable
    conf: 0.94
    if:
      type: text
      # The value must reach process.env within the same expression: `.{0,60}`
      # spanned statements (`body = document.body; !body ? process.env...`).
      regex: '\b(body|data|payload|report)\s*[:=]\s*[^;\n?]{0,40}process\.env\b'
