# Source-local may-flow: the bytes read, not merely a nearby history path,
# contribute to the POST body. External calls remain opaque unless modeled.
defaults:
  for: [go]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: go-shell-history-http-body
    desc: Shell history contents enter HTTP body
    if:
      type: symbol
      kind: call
      exact: net/http.Post
      arg:
        index: 2
        from:
          call: '^os\.ReadFile$'
          literal: '(^|/)(\.(bash|zsh)_history|fish_history)$'
          through:
            - call: '^(strings|bytes)\.NewReader$'
              arguments: [0]
            - call: '^string$'
              arguments: [0]
            - call: '^path/filepath\.Join$'
              arguments: [0, 1, 2, 3, 4]
