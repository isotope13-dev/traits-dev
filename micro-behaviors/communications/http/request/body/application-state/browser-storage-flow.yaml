# Source-to-body provenance survives local aliases, object fields and JSON serialization.
defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: fetch-web-storage-json-body
    desc: Fetch JSON body contains Web Storage data
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(window\.)?fetch$'
      arg:
        index: 1
        from:
          field: body
          call: '^(window\.)?(localStorage|sessionStorage)\.getItem$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]

composite_rules:
  - id: js-non-loopback-web-storage-json-post
    desc: JavaScript POSTs Web Storage JSON to non-loopback URL
    all:
      - id: micro-behaviors/communications/http/request/json::js-non-loopback-json-post
      - id: fetch-web-storage-json-body

  - id: html-non-loopback-web-storage-json-post
    for: [html]
    desc: HTML script POSTs Web Storage JSON to non-loopback URL
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/request/json::html-non-loopback-json-post
      - id: micro-behaviors/data/db/read/key-value::dom-storage-getitem

  - id: non-loopback-web-storage-json-post
    for: [javascript, typescript, html]
    desc: POSTs Web Storage JSON to non-loopback URL
    any:
      - id: js-non-loopback-web-storage-json-post
      - id: html-non-loopback-web-storage-json-post
