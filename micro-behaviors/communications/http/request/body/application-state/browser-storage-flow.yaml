# Source-to-body provenance survives local aliases, object fields and JSON serialization.
defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: fetch-web-storage-json-body
    desc: Fetch JSON body contains Web Storage data
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(window\.)?fetch$'
      arg:
        index: 1
        from:
          field: body
          call: '^(window\.)?(localStorage|sessionStorage)\.getItem$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]

  - id: html-fetch-non-loopback-http-url
    for: [html]
    desc: HTML script fetches non-loopback HTTP URL
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)\bfetch\s*\(\s*["'']https?://[^/"''\s]{1,128}'
    not:
      - regex: '(?i)//(localhost|127\.0\.0\.1)\b'
      - regex: '(?i)\.invalid\b'

  - id: html-fetch-json-stringify-body
    for: [html]
    desc: Inline request body serializes JSON
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '\bbody\s*:\s*JSON\.stringify\s*\('

composite_rules:
  - id: js-off-origin-http-json-post
    desc: JavaScript POSTs JSON to non-loopback URL
    all:
      - id: micro-behaviors/communications/http/post::fetch-direct-json-post-body
      - id: micro-behaviors/communications/http/request/client::fetch-http-scheme-url
    unless:
      - id: micro-behaviors/communications/ip/endpoint::fetch-loopback-http-url
      - id: micro-behaviors/communications/http/request/client::fetch-invalid-domain-literal

  - id: html-off-origin-http-json-post
    for: [html]
    desc: HTML script POSTs JSON to non-loopback URL
    near_lines: 20
    all:
      - id: html-fetch-non-loopback-http-url
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: html-fetch-json-stringify-body

  - id: off-origin-http-json-post
    for: [javascript, typescript, html]
    desc: POSTs JSON body to non-loopback HTTP URL
    any:
      - id: js-off-origin-http-json-post
      - id: html-off-origin-http-json-post

  - id: js-off-origin-web-storage-json-post
    desc: JavaScript POSTs Web Storage JSON off-origin
    all:
      - id: js-off-origin-http-json-post
      - id: fetch-web-storage-json-body

  - id: html-off-origin-web-storage-json-post
    for: [html]
    desc: HTML script POSTs Web Storage JSON off-origin
    near_lines: 20
    all:
      - id: html-off-origin-http-json-post
      - id: micro-behaviors/data/db/read::dom-storage-getitem

  - id: off-origin-web-storage-json-post
    for: [javascript, typescript, html]
    desc: POSTs Web Storage JSON to non-loopback URL
    any:
      - id: js-off-origin-web-storage-json-post
      - id: html-off-origin-web-storage-json-post
