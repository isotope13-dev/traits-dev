# Preserve the existing synchronous collection/upload profile separately from
# the structural callback case, which also covers async reads and tsc output.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable

composite_rules:
  - id: node-sync-history-upload-profile
    desc: Synchronous history read and HTTP body APIs coexist
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/activity-history::shell-history-file-path
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/fs/read/file/content/whole::readfilesync-call
    any:
      - id: micro-behaviors/communications/http/request/json::http-post-json
      - id: micro-behaviors/communications/http/request/body/construction::request-write-call
      - id: micro-behaviors/communications/http/upload/file::node-local-file-formdata-stream
