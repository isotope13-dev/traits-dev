defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: bookmark-ai-page-content-and-folder-request
    desc: Shares page and bookmark paths with AI
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule bookmark_ai_page_content_and_folder_request {
          strings:
            $folders = "async function getAllFolders()"
            $generate = "function generatePayload(config, folderPaths, title, pageContent"
            $prompt = "pageContent ?"
            $paths = "enum: allowNewPath ? undefined : folderPaths"
            $body = "body: JSON.stringify(body)"
            $send = "fetch(config.chatUrl, payload)"
          condition:
            all of them
        }
