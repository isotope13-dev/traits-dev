defaults:
  platforms:
  - ios
  - macos
  crit: notable
traits:
- for:
  - javascript
  - typescript
  conf: 0.95
  id: wallet-files-helper-result-http-body
  desc: WalletFiles-named result in JSON HTTP body
  if:
    type: tree-sitter
    query: |
      (statement_block
        (_ (variable_declarator
          name: (identifier) @collected
          value: (call_expression
            function: (identifier) @reader
            arguments: (arguments))))
        . (expression_statement
            (binary_expression
              operator: "&&"
              right: (call_expression
                function: (member_expression property: (property_identifier) @log))))?
        . (expression_statement
            [(call_expression
        function: (identifier) @fetch
        arguments: (arguments
          . (string (string_fragment) @url)
          . (object
            (pair key: (property_identifier) @body
              value: (call_expression
                function: (member_expression
                  object: (identifier) @json
                  property: (property_identifier) @stringify)
                arguments: (arguments . (object
                  (pair value: (identifier) @uploaded)) .))))))
             (call_expression
               function: (member_expression
                 object: (call_expression
        function: (identifier) @fetch
        arguments: (arguments
          . (string (string_fragment) @url)
          . (object
            (pair key: (property_identifier) @body
              value: (call_expression
                function: (member_expression
                  object: (identifier) @json
                  property: (property_identifier) @stringify)
                arguments: (arguments . (object
                  (pair value: (identifier) @uploaded)) .))))))
                 property: (property_identifier) @catch))])
        (#match? @reader "(?i)^(get|read|collect)(Crypto)?WalletFiles$")
        (#eq? @collected @uploaded)
        (#eq? @fetch "fetch")
        (#match? @url "^https?://")
        (#eq? @body "body")
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#eq? @log "log")
        (#eq? @catch "catch"))
composite_rules:
- for:
  - html
  conf: 0.9
  id: html-wallet-dump-near-http-post
  desc: Wallet-labeled JSON fields co-occur with an HTTP POST
  near_bytes: 1024
  all:
  - id: micro-behaviors/data/serialize/schema-credential::html-wallet-dump-body
  - id: micro-behaviors/communications/http/post::html-fetch-post-call
  - id: micro-behaviors/communications/http/request/client::fetch-literal-https-url
