defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: literal-fetch-http-url
    desc: String contains fetch of HTTP URL
    if:
      type: literal
      regex: '\bfetch\s*\(\s*["'']https?://'
  - id: literal-post-method
    desc: String contains POST method property
    if:
      type: literal
      regex: '\bmethod\s*:\s*["'']POST["'']'
  - id: literal-json-variable-record-body
    desc: String contains variable-record JSON body
    if:
      type: literal
      regex: '\bbody\s*:\s*JSON\.stringify\s*\(\s*\{\s*[\w$]+\s*:\s*[\w$]+\s*\}'
composite_rules:
  - id: literal-fetch-post-json-variable-record
    desc: String contains POST with JSON record
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: literal-fetch-http-url
      - id: literal-post-method
      - id: literal-json-variable-record-body
