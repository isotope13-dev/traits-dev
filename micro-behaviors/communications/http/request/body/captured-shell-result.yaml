defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: python-shell-result-http-body
    desc: Python shell output enters HTTP body
    crit: notable
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment left: (identifier) @output right: (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @exec))))
          . (expression_statement (call function: (attribute object: (identifier) @requests attribute: (identifier) @put) arguments: (argument_list (keyword_argument name: (identifier) @data value: (identifier) @sent)))))
          (#eq? @output @sent) (#eq? @subprocess "subprocess") (#eq? @exec "check_output")
          (#eq? @requests "requests") (#eq? @put "put") (#eq? @data "data"))

  - id: javascript-shell-result-http-body
    desc: JavaScript shell output enters HTTP body
    crit: notable
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @output value: (call_expression function: (identifier) @exec)))
          . (expression_statement (await_expression (call_expression function: (identifier) @fetch arguments: (arguments (object (pair key: (property_identifier) @body value: (identifier) @sent)))))))
          (#eq? @output @sent) (#eq? @exec "execSync") (#eq? @fetch "fetch") (#eq? @body "body"))

composite_rules:
  - id: captured-shell-result-http-body
    desc: Captured shell output enters HTTP body
    any:
      - id: python-shell-result-http-body
      - id: javascript-shell-result-http-body
