defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Each leg requires the axios call prefix. A bare `url:` or `data:` key is
  # ordinary JavaScript, so the field atoms must not match on their own. The
  # field window stops at `;` rather than `}` because real configs nest
  # objects such as `headers: {...}` before `data:`.
  - id: axios-config-post-method
    desc: Axios config declares POST method
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\baxios(Base)?[0-9]*\s*\(\s*\{[^}]{0,350}method\s*:\s*["'']POST'
      exclude_comments: true

  - id: axios-config-url-field
    desc: Axios config call assigns a url field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\baxios(Base)?[0-9]*\s*\(\s*\{[^;]{0,350}\burl\s*:\s*[^,}]{1,120}'
      exclude_comments: true

  - id: axios-config-data-field
    desc: Axios config call assigns a data field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\baxios(Base)?[0-9]*\s*\(\s*\{[^;]{0,350}\bdata\s*:\s*[^,}]{1,120}'
      exclude_comments: true

composite_rules:
  - id: axios-config-post-with-body
    desc: Axios POST configuration supplies body and URL
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: axios-config-post-method
    any:
      - id: axios-config-url-field
      - id: axios-config-data-field
    needs: 2
