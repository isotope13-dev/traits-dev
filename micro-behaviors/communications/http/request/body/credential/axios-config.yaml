defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: axios-config-post-with-body
    desc: Axios POST configuration supplies body and URL
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^(axios|axiosBase)$'
      args:
        - index: 0
          from:
            field: method
            whole_value: '(?i)^POST$'
        - index: 0
          from:
            field: data
            field_exists: true
        - index: 0
          from:
            field: url
            field_exists: true
