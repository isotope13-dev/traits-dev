# An off-provider password relay crosses a trust boundary. The client can
# intentionally delegate authentication and consume the returned session, so
# this evidence alone does not establish credential theft or session hijacking.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: social-login-secrets-third-party-relay
    desc: Possible third-party login credential relay
    crit: suspicious
    conf: 0.97
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/url/api-path/route::social-network-login-api-path
      - id: micro-behaviors/data/serialize/schema-credential::js-identity-password-object-fields
      - id: micro-behaviors/communications/http/client/configure::api-default-url-outside-social-provider-hosts
      - id: axios-config-post-with-body
