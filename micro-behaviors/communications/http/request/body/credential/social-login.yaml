# Client-side request shapes used by unofficial social-network login helpers.
# A login endpoint plus email/password/two-factor fields describes authentication
# transport, not credential theft: intent and ownership of the destination are
# not observable from these strings alone.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-login-body-twofactor-assignment
    desc: Assigns twoFactor on a request body
    conf: 0.94
    if:
      # The field may carry a seed, a one-time code, or another 2FA value.
      # A parsed binding excludes quoted examples, comments and comparisons.
      type: symbol
      kind: bind
      exact: body.twoFactor

composite_rules:
  - id: js-social-login-secret-request
    desc: Social-login POST near password and 2FA fields
    conf: 0.97
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/url/api-path/route::social-network-login-api-path
      - id: js-login-body-twofactor-assignment
      - id: micro-behaviors/data/serialize/schema-credential::js-identity-password-object-fields
      - id: axios-config-post-with-body
