defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: php-body-file-content-post-flow
    desc: PHP posts accumulated file content
    if:
      type: text
      regex: '(?is)\$body\s*\.\=.{0,120}file_get_contents[\s\S]{0,400}content.{0,24}\$body'

  - id: php-payload-file-content-post-flow
    desc: PHP posts accumulated file content
    if:
      type: text
      regex: '(?is)\$payload\s*\.\=.{0,120}file_get_contents[\s\S]{0,400}content.{0,24}\$payload'

  - id: php-data-file-content-post-flow
    desc: PHP posts accumulated file content
    if:
      type: text
      regex: '(?is)\$data\s*\.\=.{0,120}file_get_contents[\s\S]{0,400}content.{0,24}\$data'

  - id: php-request-body-file-content-post-flow
    desc: PHP posts accumulated file content
    if:
      type: text
      regex: '(?is)\$requestBody\s*\.\=.{0,120}file_get_contents[\s\S]{0,400}content.{0,24}\$requestBody'

  - id: php-post-data-file-content-post-flow
    desc: PHP posts accumulated file content
    if:
      type: text
      regex: '(?is)\$postData\s*\.\=.{0,120}file_get_contents[\s\S]{0,400}content.{0,24}\$postData'

  - id: php-report-file-content-post-flow
    desc: PHP posts accumulated file content
    if:
      type: text
      regex: '(?is)\$report\s*\.\=.{0,120}file_get_contents[\s\S]{0,400}content.{0,24}\$report'
