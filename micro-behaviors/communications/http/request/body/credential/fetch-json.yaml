# Transport of credential fields does not establish theft or extension identity.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: fetch-token-json-body
    desc: Fetch POST near JSON serialization of token or secret fields
    crit: notable
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/data/serialize/json::json-stringify-token-secret-body

  - id: fetch-api-key-json-body
    desc: Fetch JSON POST near an API-key variable field
    crit: notable
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: metadata/lang/source/syntax/credential-field::js-api-key-variable-field
