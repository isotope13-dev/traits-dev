defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.98
traits:
- id: post-inbound-password-absolute-url
  desc: POST forwards inbound password to URL
  if:
    type: tree-sitter
    query: '((call_expression function: (member_expression property: (property_identifier) @method) arguments: (arguments . (string (string_fragment) @url) . (object (pair key: (property_identifier) @field value: (member_expression object: (member_expression object: (identifier) @request property: (property_identifier) @body) property: (property_identifier) @secret))))) @call (#eq? @method "post") (#match? @url "^https?://") (#eq? @field "password") (#eq? @body "body") (#eq? @secret "password"))'
