traits:
  - id: jquery-password-value-absolute-post
    desc: Posts a page password field via jQuery
    crit: notable
    conf: 0.97
    platforms: [unix, windows]
    for: [javascript]
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (_ (variable_declarator name: (identifier) @password
            value: (call_expression
              function: (member_expression
                object: (call_expression function: (identifier) @select
                  arguments: (arguments . (string) @selector))
                property: (property_identifier) @val))))
          (_ (variable_declarator name: (identifier) @payload
            value: (object (pair key: [(property_identifier) (string)] @password_key
              value: (identifier) @password_used))))
          (expression_statement (call_expression function: (member_expression) @ajax
            arguments: (arguments . (object
              (pair key: (property_identifier) @url value: (string) @destination)
              (pair key: (property_identifier) @method value: (string) @verb)
              (pair key: (property_identifier) @data value: (identifier) @payload_used)))) @evidence))
          (#eq? @select "$")
          (#eq? @val "val")
          (#match? @selector "(?i)password|passwd")
          (#match? @password_key "(?i)^[\"']?(password|passwd|pwd)[\"']?$")
          (#eq? @password @password_used)
          (#eq? @payload @payload_used)
          (#eq? @ajax "$.ajax")
          (#eq? @url "url")
          (#match? @destination "^[\"']https?://")
          (#match? @method "^(type|method)$")
          (#match? @verb "^[\"']POST[\"']$")
          (#eq? @data "data"))
