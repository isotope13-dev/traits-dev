defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - ruby
  - perl
  - php
  crit: notable
traits:
- id: oauth-token-reference-in-body
  desc: OAuth token reference in body object
  conf: 0.92
  for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - ruby
  - perl
  - php
  - html
  if:
    type: text
    regex: \b(body|payload)\s*[:=][\w.(\s]{0,24}\{[^}]{0,100}\b(access|refresh|id)_?token\b
    case_insensitive: true
- id: post-body-code-field
  desc: HTTP POST body contains a code field
  conf: 0.97
  if:
    type: text
    regex: (?is)\b(requests|httpx)\.(post|request)\s*\([^)]{0,420}["']code["']\s*[:=]
- id: otp-field-value-binding
  desc: OTP field binds an OTP-named value
  conf: 0.94
  for:
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)["']?(code|otp|mfa[_-]?code|verification[_-]?code)["']?\s*:\s*\w*(otp|mfa)\w*
- id: js-body-shorthand-email-password
  for:
  - javascript
  - typescript
  desc: JS body object shorthand email and password
  conf: 0.94
  if:
    type: text
    regex: \bbody\s*=\s*\{\s*(email|username)\s*,\s*password\s*[,}]
composite_rules:
- id: http-post-body-otp-value
  for:
  - python
  - javascript
  desc: HTTP POST submits an OTP-named value
  conf: 0.94
  all:
  - id: otp-field-value-binding
  any:
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/communications/http/post::js-fetch-post-request
  - id: micro-behaviors/communications/http/post::axios-post-call
  near_lines: 30
