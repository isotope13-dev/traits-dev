defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: password-input-value-json-post
    desc: Password input value enters fetch JSON POST
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator name: (identifier) @captured
              value: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @document
                    property: (property_identifier) @select)
                  arguments: (arguments (string) @selector))
                property: (property_identifier) @value))) @binding
          (expression_statement
            (call_expression function: (identifier) @fetch
              arguments: (arguments
                (string) @destination
                (object
                  (pair key: [(property_identifier) (string)] @method_key
                    value: (string) @method)
                  (pair key: [(property_identifier) (string)] @body_key
                    value: (call_expression
                      function: (member_expression object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments (object [
                        (shorthand_property_identifier) @sent
                        (pair value: (identifier) @sent)
                      ])))))))) @post)
          (#match? @binding "^const\\s")
          (#eq? @document "document")
          (#eq? @select "querySelector")
          (#match? @selector "input\\[type\\s*=\\s*[\"']password[\"']\\]")
          (#eq? @value "value")
          (#eq? @fetch "fetch")
          (#match? @destination "^[\"']https?://([a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}")
          (#not-match? @destination "(?i)https?://[^/\"']+\\.(invalid|test|localhost|example|local)([:/\"']|$)")
          (#not-match? @destination "(?i)https?://([a-z0-9-]+\\.)*example\\.(com|org|net)([:/\"']|$)")
          (#match? @method_key "^[\"']?method[\"']?$")
          (#match? @method "^[\"']POST[\"']$")
          (#match? @body_key "^[\"']?body[\"']?$")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @captured @sent))

  # A page's password field sent in a fetch body. Each atom is one leg of the
  # proof: the dataflow carries the field's element into the body (it cannot
  # tell the element from its value), and a separate read shows the value is
  # what is taken. JSON.stringify of the element alone serializes to `{}`.
  - id: password-field-absolute-fetch-body
    desc: Password field flows into absolute fetch body
    if:
      type: symbol
      kind: call
      exact: fetch
      args:
        - index: 0
          regex: ^https?://
        - index: 1
          from:
            field: body
            call: ^document\.querySelector(All)?$
            literal: type=["']?password\b
            through:
              - call: ^JSON\.stringify$
                arguments: [0]
  # The same flow to a reserved test host (RFC 2606/6761): fixture code.
  - id: password-field-reserved-fetch-body
    desc: Password field flows into reserved-host fetch
    if:
      type: symbol
      kind: call
      exact: fetch
      args:
        - index: 0
          regex: ^https?://([^/:?#]*\.)?(invalid|test|example|localhost|local)([:/?#]|$)
        - index: 1
          from:
            field: body
            call: ^document\.querySelector(All)?$
            literal: type=["']?password\b
            through:
              - call: ^JSON\.stringify$
                arguments: [0]
  - id: password-field-value-inline-read
    desc: Reads a password field's value inline
    if:
      type: text
      regex: querySelector\(\s*["'][^()\n]{0,80}type=["']?password\b[^()\n]{0,40}\)\.value\b
  - id: password-field-value-serialized
    desc: Serializes a bound password field's value
    if:
      type: tree-sitter
      query: |
        ((_
          (lexical_declaration (variable_declarator name: (identifier) @el
            value: (call_expression
              function: (member_expression property: (property_identifier) @qs)
              arguments: (arguments (string) @sel))))
          (lexical_declaration (variable_declarator
            value: (call_expression
              function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
              arguments: (arguments (object (pair value: (member_expression
                object: (identifier) @use property: (property_identifier) @value))))))))
          (#eq? @qs "querySelector")
          (#match? @sel "type\\s*=\\s*[\"']?password")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @use @el)
          (#eq? @value "value"))
  - id: password-field-value-fetch-serialized
    desc: fetch body serializes a password field's value
    if:
      type: tree-sitter
      query: |
        ((_
          (lexical_declaration (variable_declarator name: (identifier) @el
            value: (call_expression
              function: (member_expression property: (property_identifier) @qs)
              arguments: (arguments (string) @sel))))
          (_ (call_expression function: (identifier) @fetch
            arguments: (arguments (_) (object (pair
              value: (call_expression
                function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
                arguments: (arguments (object (pair value: (member_expression
                  object: (identifier) @use property: (property_identifier) @value)))))))))))
          (#eq? @qs "querySelector")
          (#match? @sel "type\\s*=\\s*[\"']?password")
          (#eq? @fetch "fetch")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @use @el)
          (#eq? @value "value"))
