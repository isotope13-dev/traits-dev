defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: password-input-value-json-post
    desc: Password input value enters fetch JSON POST
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator name: (identifier) @captured
              value: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @document
                    property: (property_identifier) @select)
                  arguments: (arguments (string) @selector))
                property: (property_identifier) @value))) @binding
          (expression_statement
            (call_expression function: (identifier) @fetch
              arguments: (arguments
                (string) @destination
                (object
                  (pair key: [(property_identifier) (string)] @method_key
                    value: (string) @method)
                  (pair key: [(property_identifier) (string)] @body_key
                    value: (call_expression
                      function: (member_expression object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments (object [
                        (shorthand_property_identifier) @sent
                        (pair value: (identifier) @sent)
                      ])))))))) @post)
          (#match? @binding "^const\\s")
          (#eq? @document "document")
          (#eq? @select "querySelector")
          (#match? @selector "input\\[type\\s*=\\s*[\"']password[\"']\\]")
          (#eq? @value "value")
          (#eq? @fetch "fetch")
          (#match? @destination "^[\"']https?://([a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}")
          (#not-match? @destination "(?i)https?://[^/\"']+\\.(invalid|test|localhost|example|local)([:/\"']|$)")
          (#not-match? @destination "(?i)https?://([a-z0-9-]+\\.)*example\\.(com|org|net)([:/\"']|$)")
          (#match? @method_key "^[\"']?method[\"']?$")
          (#match? @method "^[\"']POST[\"']$")
          (#match? @body_key "^[\"']?body[\"']?$")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @captured @sent))

  # A page's password field's value sent in a fetch body to an absolute URL:
  # a `.value` read of the element the password selector returned, carried
  # into the body through JSON.stringify. Stringifying the element itself
  # sends `{}`, and another field's value is not the password.
  - id: password-field-absolute-fetch-body
    desc: Password value flows into absolute fetch body
    if:
      type: symbol
      kind: call
      exact: fetch
      args:
        - index: 0
          regex: ^https?://
        - index: 1
          from:
            field: body
            member: '\.value$'
            call: ^document\.querySelector(All)?$
            literal: type=["']?password\b
            through:
              - call: ^JSON\.stringify$
                arguments: [0]
  # The same flow to a reserved test host (RFC 2606/6761): fixture code.
  - id: password-field-reserved-fetch-body
    desc: Password field flows into reserved-host fetch
    if:
      type: symbol
      kind: call
      exact: fetch
      args:
        - index: 0
          regex: ^https?://([^/:?#]*\.)?(invalid|test|example|localhost|local)([:/?#]|$)
        - index: 1
          from:
            field: body
            call: ^document\.querySelector(All)?$
            literal: type=["']?password\b
            through:
              - call: ^JSON\.stringify$
                arguments: [0]
