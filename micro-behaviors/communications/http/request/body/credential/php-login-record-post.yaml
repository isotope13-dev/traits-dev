# A PHP map naming a login URL, username and password next to a POST transport.
# Proximity, not data flow: the record and the request are co-located, which is
# how account hand-off callbacks are written, but this alone does not say whose
# account it is or where the request goes.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.92

composite_rules:
  - id: php-login-record-post
    desc: PHP posts login URL and password fields
    near_bytes: 1500
    all:
      - id: metadata/lang/source/syntax/credential-field::login-url-account-record-fields
    any:
      - id: micro-behaviors/communications/http/curl/binding::post-data
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-post
      - id: micro-behaviors/communications/http/post::php-request-options-post-method
