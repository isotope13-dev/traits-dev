# Recognized third-party provider keys are submitted to an application's
# credential vault for later use. This is a sensitive transfer capability;
# the specific UI disclosure and user-triggered path determine intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: recognized-provider-key-patterns
    desc: Recognizes a third-party provider API key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'sk-(ant|or-v1|proj)-'

  - id: secret-vault-store-call
    desc: Calls a secret-vault storage method
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.storeSecret\s*\('

composite_rules:
  - id: provider-key-stored-in-vault
    desc: Recognized provider key is passed to vault storage
    crit: suspicious
    conf: 0.88
    scope: file
    all:
      - id: recognized-provider-key-patterns
      - id: secret-vault-store-call
