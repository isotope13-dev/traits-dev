# A credential broker and a stealer can both implement this transfer.
# Keep the sensitive boundary visible without inferring a trojanized library
# from a CLI's authenticated, operator-invoked account-sync implementation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: coding-agent-auth-json-http-upload
    desc: Agent-auth reads near JSON credential POST
    crit: suspicious
    conf: 0.94
    near_bytes: 12000
    all:
      - id: micro-behaviors/fs/read/file/target::agent-auth-json-raw-read
      - id: micro-behaviors/data/serialize/schema-credential::credentials-call-json-payload-context
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
    unless:
      - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
      - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
