defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: listed-env-values-http-body
  desc: Listed secret env values enter HTTP body
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((program
      (lexical_declaration (variable_declarator name: (identifier) @collected value: (object)))
      (for_in_statement left: (identifier) @key right: (array) @keys
        body: (statement_block (if_statement
          consequence: (expression_statement (assignment_expression
            left: (subscript_expression object: (identifier) @destination index: (identifier) @index)
            right: (subscript_expression
              object: (member_expression object: (identifier) @process property: (property_identifier) @env)
              index: (identifier) @read_key))))))

      (lexical_declaration (variable_declarator name: (identifier) @request
        value: (call_expression
          function: (member_expression object: (identifier) @http property: (property_identifier) @request_method))))
      (expression_statement (call_expression
        function: (member_expression object: (identifier) @receiver property: (property_identifier) @write)
        arguments: (arguments (call_expression
          function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
          arguments: (arguments (identifier) @serialized)))))
      ) @export
      (#eq? @collected @destination) (#eq? @collected @serialized)
      (#eq? @key @index) (#eq? @key @read_key)
      (#match? @keys "API_KEY") (#match? @keys "SECRET") (#match? @keys "TOKEN")
      (#eq? @process "process") (#eq? @env "env")
      (#match? @http "^https?$") (#eq? @request_method "request")
      (#eq? @request @receiver) (#match? @write "^(write|end)$")
      (#eq? @json "JSON") (#eq? @stringify "stringify")
      )

      ((program
      (lexical_declaration (variable_declarator name: (identifier) @collected value: (object)))
      (for_in_statement left: (identifier) @key right: (array) @keys
        body: (statement_block (if_statement
          consequence: (expression_statement (assignment_expression
            left: (subscript_expression object: (identifier) @destination index: (identifier) @index)
            right: (subscript_expression
              object: (member_expression object: (identifier) @process property: (property_identifier) @env)
              index: (identifier) @read_key))))))

      (expression_statement (call_expression arguments: (arguments
        (identifier) (object)
        (arrow_function body: (statement_block
          (expression_statement (call_expression arguments: (arguments
            (string (string_fragment) @event)
            (arrow_function body: (statement_block
      (lexical_declaration (variable_declarator name: (identifier) @request
        value: (call_expression
          function: (member_expression object: (identifier) @http property: (property_identifier) @request_method))))
      (expression_statement (call_expression
        function: (member_expression object: (identifier) @receiver property: (property_identifier) @write)
        arguments: (arguments (call_expression
          function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
          arguments: (arguments (identifier) @serialized)))))
      ))))))))))
      ) @export
      (#eq? @collected @destination) (#eq? @collected @serialized)
      (#eq? @key @index) (#eq? @key @read_key)
      (#match? @keys "API_KEY") (#match? @keys "SECRET") (#match? @keys "TOKEN")
      (#eq? @process "process") (#eq? @env "env")
      (#match? @http "^https?$") (#eq? @request_method "request")
      (#eq? @request @receiver) (#match? @write "^(write|end)$")
      (#eq? @json "JSON") (#eq? @stringify "stringify")
       (#eq? @event "end"))
