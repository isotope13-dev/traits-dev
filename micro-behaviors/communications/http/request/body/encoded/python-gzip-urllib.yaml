defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-gzip-urllib-request-body
    desc: Gzip output supplies urllib request data
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment
            left: (identifier) @compressed
            right: (call function: (attribute object: (identifier) @gzip attribute: (identifier) @compress))))
          (expression_statement (assignment
            left: (identifier) @request
            right: (call function: (attribute attribute: (identifier) @request_ctor)
              arguments: (argument_list (keyword_argument name: (identifier) @data_key value: (identifier) @data_use)))))
          (expression_statement (assignment right: (call
            function: (attribute attribute: (identifier) @urlopen)
            arguments: (argument_list (identifier) @request_use))))))
          (#eq? @gzip "gzip") (#eq? @compress "compress") (#eq? @request_ctor "Request")
          (#eq? @urlopen "urlopen") (#eq? @request @request_use)
          (#eq? @data_key "data") (#eq? @compressed @data_use))
