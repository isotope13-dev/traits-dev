traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: node-aes-gcm-json-fetch-post
  desc: Posts AES-GCM ciphertext as JSON
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((program
        (function_declaration name: (identifier) @encrypt_def body: (statement_block) @encoder)
        (function_declaration
        parameters: (formal_parameters (identifier) @data)
        body: (statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @blob
              value: (call_expression function: (identifier) @encrypt arguments: (arguments (identifier) @data_use))))
          (for_in_statement
            body: (statement_block
              (try_statement
                body: (statement_block
                  (lexical_declaration
                    (variable_declarator
                      value: (await_expression
                        (call_expression function: (identifier) @fetch
                          arguments: (arguments _
                            (object
                              (pair key: (property_identifier) @method_key value: (string (string_fragment) @method))
                              (pair key: (property_identifier) @body_key
                                value: (call_expression
                                  function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
                                  arguments: (arguments (object (pair value: (identifier) @blob_use))))))))))))))))))
        (#eq? @encrypt @encrypt_def)
        (#match? @encoder "createCipheriv")
        (#match? @encoder "aes-256-gcm")
        (#eq? @data @data_use)
        (#eq? @blob @blob_use)
        (#eq? @fetch "fetch")
        (#eq? @method_key "method")
        (#eq? @method "POST")
        (#eq? @body_key "body")
        (#eq? @json "JSON")
        (#eq? @stringify "stringify"))
