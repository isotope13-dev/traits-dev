defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, ruby, perl, php]

traits:
  - id: oauth-token-in-request-body
    desc: OAuth token in HTTP request body
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bbody\b.{0,96}\b(access_token|refresh_token|id_token)\b'

  - id: http-post-with-body-argument
    desc: HTTP POST supplies a body argument
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bpost\s*\([^)]{0,120}\b(data|json|files)\s*='
