defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, ruby, perl, php]

traits:
  # The variable name alone does not distinguish an inbound server request
  # from an outbound client request.  Keep the atomic observation neutral;
  # server/backdoor composites supply direction and execution context.
  - id: request-body-property-access
    desc: Accesses a request body property
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(req|request)\s*\.\s*body\s*\.\s*[A-Za-z_$][\w$]*'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: fetch-options-json-body
    desc: fetch sends options JSON request body
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bfetch\s*\([\s\S]{0,900}\bbody\s*:\s*JSON\.stringify\s*\(\s*\{\s*options\s*:'

  - id: oauth-token-reference-in-body
    desc: OAuth token reference in body object
    crit: notable
    conf: 0.92
    for: [python, javascript, typescript, shell, powershell, ruby, perl, php, html]
    # Require object construction (possibly wrapped in JSON.stringify/dumps),
    # rather than logging strings that mention req.body and a token variable.
    if:
      type: text
      regex: '\b(body|payload)\s*[:=][\w.(\s]{0,24}\{[^}]{0,100}\b(access|refresh|id)_?token\b'
      case_insensitive: true

  # Relocated from objectives/execution/exploit/code-validation (2026-08).
  # The matcher only sees "a POST body carries a field named `code`", which is
  # the wire shape of OAuth authorization-code exchange, e-mail/OTP
  # verification, coupon redemption, and invite acceptance. The intent that
  # makes a `code` field dangerous -- a /validate/code endpoint evaluating
  # submitted source -- lives in the composites there, which reference this.
  - id: post-body-code-field
    desc: HTTP POST body contains a code field
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\b(requests|httpx)\.(post|request)\s*\([^)]{0,420}["'']code["'']\s*[:=]'

  - id: otp-field-value-binding
    desc: OTP field binds an OTP-named value
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?i)["'']?(code|otp|mfa[_-]?code|verification[_-]?code)["'']?\s*:\s*\w*(otp|mfa)\w*'

  - id: http-post-with-body-argument
    desc: HTTP POST supplies a body argument
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\.post\s*\([^)]{0,120}\b(data|json|files)\s*='

  - id: python-requests-post-body-variable
    desc: Python requests POST passes a body variable
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: 'requests\.post\([^)]{0,120}\b(data|json)\s*=\s*body\b'

  # Bind the request's data field to the encrypt call's return value.
  # Encryption elsewhere in the file, discarded ciphertext and overwritten
  # body variables do not establish an encrypted request body.
  - id: python-encrypt-result-requests-post-body
    desc: Encrypt result enters requests POST body
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: symbol
      kind: call
      exact: requests.post
      arg:
        from:
          field: data
          call: '(^|\.)encrypt$'
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path

  - id: python-encrypt-result-httpx-post-body
    desc: Encrypt result enters httpx POST body
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: symbol
      kind: call
      exact: httpx.post
      arg:
        from:
          field: data
          call: '(^|\.)encrypt$'
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path

  # ES6 shorthand assigned to a request body: `body = { email, password }`.
  # Bare `{ email, password }` also matches destructuring and is too common.
  - id: js-body-shorthand-email-password
    for: [javascript, typescript]
    desc: JS body object shorthand email and password
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bbody\s*=\s*\{\s*(email|username)\s*,\s*password\s*[,}]'

composite_rules:

  - id: http-post-body-otp-value
    for: [python, javascript]
    desc: HTTP POST submits an OTP-named value
    crit: notable
    conf: 0.94
    all:
      - id: otp-field-value-binding
    any:
      - id: micro-behaviors/communications/http/request/client::python-post-transport
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
      - id: micro-behaviors/communications/http/post::axios-post-call
    near_lines: 30

  - id: python-encrypted-post
    for: [python]
    desc: Python POST body contains encrypt results
    crit: notable
    conf: 0.94
    any:
      - id: python-encrypt-result-requests-post-body
      - id: python-encrypt-result-httpx-post-body
    unless:
      - id: metadata/package/testing/presence/harness/

  # Any way a client puts bytes on the wire: a multipart upload, a POST, a
  # request-body write.  This is a neutral transport union, but it lived in
  # objectives/exfiltration/sensitive-data/ as `js-http-upload-or-body-sink`,
  # where a directory reference to that objective picked it up as exfiltration
  # evidence — enough on its own to make any module that POSTs and opens a
  # WebSocket look like a redundant C2 channel.  The exfiltration composites
  # that consume it supply the sensitive source separately.
      - id: "metadata/file/naming::test-directory-component"
  - id: http-upload-or-body-sink
    desc: HTTP upload, POST, or request-body evidence
    crit: notable
    conf: 0.86
    any:
    - id: micro-behaviors/communications/http/request/client::python-post-transport
    - id: micro-behaviors/communications/http/post::js-fetch-post-request
    - id: micro-behaviors/communications/http/post::php-stream-context-http-post
    - id: micro-behaviors/communications/http/curl::curl-body-or-upload-option
    - id: micro-behaviors/communications/http/upload::python-http-files-parameter
    - id: micro-behaviors/communications/http/request/body::request-write-call
    - id: micro-behaviors/communications/http/request/json::http-post-json
