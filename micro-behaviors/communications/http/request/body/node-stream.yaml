# Writing and terminating a Node-style outbound request stream. These are body
# transmission operations on a request object, not client identification; the
# client itself is named by the atoms under request/client/.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: request-write-call
    desc: JavaScript writes HTTP request body
    conf: 0.72
    if:
      type: symbol
      regex: ^(req|request)\.write$
  - id: request-end-call
    desc: Ends a request-like object with .end()
    conf: 0.72
    if:
      type: symbol
      regex: ^(req|request)\.end$
  - id: req-write
    desc: Write data to HTTP request stream
    conf: 0.8
    if:
      type: text
      substr: 'req.write('
