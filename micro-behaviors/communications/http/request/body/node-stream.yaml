# Node-style request stream writes. The request client is classified separately.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
- id: request-write-call
  desc: JavaScript writes to an HTTP request stream
  conf: 0.72
  if:
    type: symbol
    regex: '^(req|request)\.write$'
- id: request-end-call
  desc: JavaScript ends an HTTP request stream
  conf: 0.72
  if:
    type: symbol
    regex: '^(req|request)\.end$'
