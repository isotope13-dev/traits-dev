# Request-body fields that carry a *collection* of contact identifiers.
#
# A singular `email` field is one user submitting their own address. A plural
# `emails` / `contacts` / `email_hashes` field is a batch of addresses being
# submitted at once, which is the wire shape of contact-import and address-book
# sync APIs. The field name alone says nothing about who owns those addresses,
# so this is a component; the objective tier pairs it with the endpoint the
# batch is sent to.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
  attack: T1589.002
  mbc: E1589

traits:
  - id: email-collection-body-field
    desc: Body field naming email contact collection
    crit: component
    conf: 0.85
    if:
      # Quoted (`"emails":`) and bare (`emails:`, Go `Emails:`) object keys,
      # followed by a collection literal or the variable holding one.
      type: text
      regex: '(?i)["'']?\b(emails|contacts|email_hashes)["'']?\s*:\s*[\[\w]'
