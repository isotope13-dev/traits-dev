# Client-side request shapes used by unofficial social-network login helpers.
# A login endpoint plus an email/password/TOTP body describes authentication
# transport, not credential theft: intent and ownership of the destination are
# not observable from these strings alone.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: social-network-login-api-path
    desc: Social-network login API endpoint path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '/api/v\d+/(facebook|instagram|twitter)/login'

  - id: js-login-body-totp-secret
    desc: JS assigns TOTP secret onto login body
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bbody\.twoFactor\s*='

composite_rules:
  - id: js-social-login-secret-request
    desc: JavaScript posts social-login secrets to API
    crit: notable
    conf: 0.97
    all:
      - id: social-network-login-api-path
      - id: js-login-body-totp-secret
      - id: micro-behaviors/communications/http/request/body::js-email-password-request-object
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/request/client::post-method-text
