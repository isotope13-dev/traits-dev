defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: body-field-path-traversal
    desc: Body field value has directory traversal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bbody["'']?\s*:\s*["''][^"'']{0,160}(\.\.[\\/]){2,}'

composite_rules:
  - id: mutating-method-traversal-body
    desc: Request method and traversal body co-occur
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/verb::mutating-method-option
      - id: body-field-path-traversal
    near_bytes: 200
