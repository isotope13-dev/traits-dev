defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  crit: hostile
composite_rules:
  - id: node-http-php-rc4-clues
    desc: Node HTTP POST, PHP endpoint and RC4 call clues
    conf: 0.97
    attack: T1105,T1573,T1071.001
    mbc: B0024,C0027
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
      - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-script
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::js-rc4-two-arg-call
    unless:
      - id: metadata/path/directory::test-directory-component
    crit: suspicious
