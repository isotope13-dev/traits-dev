defaults:
  platforms: [unix]
  for: [javascript, typescript]
composite_rules:
- id: node-body-with-export-endpoint
  desc: Request body syntax accompanies an export-like HTTP path
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/url/endpoint::node-exfil-endpoint
  any:
  - id: micro-behaviors/data/encode/base64::node-base64-json-data-field
  - id: micro-behaviors/communications/http/request/body::node-upload-sink
  - id: micro-behaviors/communications/http/request/body::request-write-call
  downgrade:
      # A package that declares itself a benign attack simulator ships the mock
      # payloads and the lab-local sink they post to in the same bundle.
    scope: archive
    any:
    - id: metadata/package/description/disclosure::desc-declares-benign-simulation
