defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: node-request-write-file-content
    desc: HTTP request write receives readFileSync content
    if:
      type: symbol
      kind: call
      regex: '^(req|request)\.write$'
      arg:
        index: 0
        from:
          call: '(^|\.)readFileSync$'
composite_rules:
  - id: file-content-http-body
    desc: File content contributes to HTTP request body
    for: [javascript, typescript, python]
    any:
      - id: node-request-write-file-content
      - id: micro-behaviors/communications/http/request/body::python-post-path-read-bytes
