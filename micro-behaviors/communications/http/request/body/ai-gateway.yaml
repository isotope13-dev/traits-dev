# Executable policy-selection fields carried in HTTP request bodies. Selecting
# custom code is an analyst-relevant capability; execution intent is supplied
# only when an objective composite also sees a process primitive.
defaults:
  platforms: [unix, windows]
  for: [text, data, scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: custom-code-guardrail-selection
    desc: Request selects a custom-code guardrail
    if:
      type: text
      regex: '["'']guardrail["'']\s*:\s*["'']custom_code["'']'
