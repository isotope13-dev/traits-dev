defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

composite_rules:
  - id: urllib-body-near-json-serialization
    desc: urllib body and JSON serialization co-occur
    conf: 0.9
    scope: file
    near_bytes: 4096
    all:
      - id: metadata/import/python/urllib/request
      - id: micro-behaviors/data/serialize/json::json-dumps-call
    # A body leg is required: a header-only GET Request beside an unrelated
    # json.dumps (for example a local report write) supplies no request body.
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-positional-body
      - id: micro-behaviors/communications/http/request/json::urllib-request-json-dumps-body
