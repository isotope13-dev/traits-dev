defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: offsite-fetch-indexeddb-json-body
    desc: Off-site fetch body derives from IndexedDB
    if:
      type: symbol
      kind: call
      exact: fetch
      args:
        - index: 0
          from:
            value: '^https?://[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}(?::[0-9]+)?/'
        - index: 1
          from:
            field: body
            call: '\.toArray$'
            through:
              - call: '^JSON\.stringify$'
                arguments: [0]
