defaults:
  platforms: [unix, windows]
  for: [rust, python, javascript, typescript, go]
  conf: 0.94
traits:
  - id: environment-http-body-flow
    desc: Environment values enter HTTP request body
    crit: suspicious
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: environment-http-body
    unless:
    # Apply the same provider-authentication context as the filtered view in
    # request/credentials. Source-local may-flow can carry an environment key
    # used in Authorization into a chat request's otherwise ordinary body.
    - id: selected-provider-authentication-context
    - id: metadata/file/profile/test-indications/
    - id: micro-behaviors/os/env/package-manager::selective-npm-agent-telemetry
    - id: micro-behaviors/communications/http/oauth/
    - id: micro-behaviors/communications/http/login/
    - id: micro-behaviors/communications/http/request/route/
    - id: well-known/app/ai/agent-runtime/
    - id: well-known/lib/ai/langsmith::langsmith-tracing-context
    - id: well-known/app/ai/gateway/phaseo::phaseo-source-path
  - id: python-environment-http-body-flow
    desc: Python environment values enter HTTP body
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: trait
      id: micro-behaviors/communications/http/request/body::environment-http-body-flow
    unless:
      - id: selected-provider-authentication-context
      # Detection regression tests intentionally carry the complete hostile
      # source snippet as inert string data. Require a real tests/ path rather
      # than trusting an attacker-controlled test_ filename alone.
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/tool/detection/llm-scanner::ai-skill-scanner-report-doc
      - id: micro-behaviors/communications/http/services/github::github-api-host
      - id: well-known/tool/offensive/sic-security/
      - id: metadata/package/files/ecosystem::openclaw-weiyun-safe-uploader

  - id: spell-access-token-run-url-body
    desc: HTTP body has access token and URL
    crit: notable
    for: [python]
    if:
      type: text
      substr: 'json={"access_token": env.get("WANDB_ACCESS_TOKEN"), "url": url}'

composite_rules:
  - id: selected-provider-authentication-context
    desc: Selected provider API authentication context
    crit: exception
    any:
      - id: spell-selected-token-exchange
      - id: micro-behaviors/communications/http/request/credentials::byok-llm-chat-client-context

  - id: spell-selected-token-exchange
    for: [python]
    desc: Spell run URL sync with selected access token
    crit: exception
    all:
      - id: spell-access-token-run-url-body
      - id: micro-behaviors/communications/http/request/client::spell-run-url-sync-call
