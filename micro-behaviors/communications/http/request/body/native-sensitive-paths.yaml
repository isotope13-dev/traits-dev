defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  # Paths and helper names do not bind file contents to the HTTP body.
  # Record the co-occurrence as a neutral reporting capability, not theft.
  - id: native-sensitive-path-report-context
    desc: Sensitive paths with reporting clues and POST
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/credential::private-key-sensitive-path-cluster
      - id: micro-behaviors/communications/http/message::printf-http-post-body
    any:
      - id: metadata/binary/symbols/name::file-to-loot-helper-name-pair
      - id: metadata/binary/instruction/sequence::x64-sized-buffer-call-forward-layout
