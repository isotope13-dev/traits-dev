defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, javascript, powershell, php, html, shell]
  mbc: C0002
  attack: T1071.001

traits:
  - id: fetch-post-b64encode-body
    desc: Fetch POST body passed through b64encode
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'method:\s*["'']POST["'']\s*,\s*body:\s*b64encode\s*\('
  - id: js-fetch-body-variable
    desc: Fetch call passes a variable request body
    conf: 0.86
    for: [javascript, typescript]
    if:
      # Restrict the text shape to parsed call expressions. Documentation in
      # generated JavaScript and declaration files often includes this exact
      # fetch example without executing it.
      type: tree-sitter
      kind: call
      regex: '\bfetch\s*\([^)]{0,100}\bbody\s*:\s*[A-Za-z_$][A-Za-z0-9_$]*\s*[,}]'
  - id: request-write-payload-variable
    desc: HTTP request sends payload variable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^r(equest|eq)?\.(write|post|send)$'
      arg:
        kind: identifier
        name: payload
  - id: request-write-file-data-variable
    desc: HTTP request sends file data variable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^r(equest|eq)?\.(write|post|send)$'
      arg:
        kind: identifier
        name: fileData
  - id: request-write-raw-data-variable
    desc: HTTP request writes a raw data variable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(req|request)\s*\.\s*write\s*\(\s*([^\r\n,]{1,100},\s*)?(raw|data)\b'
composite_rules:
  - id: js-fetch-post-body-variable
    desc: Fetch POST body uses a variable
    conf: 0.86
    for: [javascript, typescript]
    near_lines: 8
    all:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/body::js-fetch-body-variable
