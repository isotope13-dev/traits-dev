# The value sent in the HTTP body must originate at a clipboard read.
# Export alone can implement synchronization; malicious context belongs in
# the objective that consumes these neutral source-to-body observations.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.98

traits:
  - id: python-post-clipboard-body
    desc: HTTP POST body from clipboard text
    for: [python]
    if:
      type: symbol
      kind: call
      exact: requests.post
      arg:
        from:
          field: data
          call: '^(pyperclip|clipboard)\.paste$'

  - id: browser-fetch-clipboard-body
    desc: Fetch request body from clipboard text
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 1
        from:
          field: body
          call: '^navigator\.clipboard\.readText$'
