# Neutral HTTP-body encoding primitives. Masquerade objectives combine these
# with a contradictory application/x-www-form-urlencoded Content-Type.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, go, php, powershell]
traits:
- id: json-field-btoa-value
  desc: JSON request field contains Base64 value
  crit: notable
  conf: 0.93
  for: [javascript]
  if:
    type: text
    regex: 'JSON\.stringify\s*\(\s*\{[^}]{0,180}:\s*btoa\s*\('
- id: base64-encoded-post-body--rx-1
  desc: Python/PowerShell Base64 before POST or upload
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(b64encode|ToBase64String)\b.{0,300}(post|upload)'
- id: base64-encoded-post-body--rx-2
  desc: Python/PowerShell Base64 before HTTP send
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(b64encode|ToBase64String)\b.{0,300}(send|UploadData)'
- id: base64-encoded-post-body--rx-3
  desc: Python/PowerShell Base64 before request
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(b64encode|ToBase64String)\b.{0,300}(request)'
- id: base64-encoded-post-body--rx-4
  desc: Go/JavaScript Base64 before POST or upload
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64\.StdEncoding\.EncodeToString|btoa)\b.{0,300}(post|upload)'
- id: base64-encoded-post-body--rx-5
  desc: Go/JavaScript Base64 before HTTP send
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64\.StdEncoding\.EncodeToString|btoa)\b.{0,300}(send|UploadData)'
- id: js-request-base64-body
  desc: Request sends a body derived from btoa
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    regex: '^(request|req|xhr)\.(send|write|end)$'
    arg:
      index: 0
      from:
        call: '^btoa$'
- id: base64-encoded-post-body--rx-7
  desc: PHP Base64 before POST or upload
  crit: notable
  conf: 0.8
  if:
    type: text
    # Require a non-identifier boundary before post/upload so `$_POST` /
    # `$post_data` cannot satisfy the token (HTTP Basic auth FP).
    regex: '(?i)(base64_encode)\b.{0,300}([^A-Za-z0-9_$]|^)(post|upload)\b'
- id: base64-encoded-post-body--rx-8
  desc: PHP Base64 before HTTP send
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64_encode)\b.{0,300}(send|UploadData)'
- id: base64-encoded-post-body--rx-9
  desc: PHP Base64 before request
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64_encode)\b.{0,300}([^A-Za-z0-9_$]|^)(request)\b'
composite_rules:
- id: base64-encoded-post-body
  desc: Base64 encoding near HTTP POST
  crit: notable
  conf: 0.8
  any:
  - id: base64-encoded-post-body--rx-1
  - id: base64-encoded-post-body--rx-2
  - id: base64-encoded-post-body--rx-3
  - id: base64-encoded-post-body--rx-4
  - id: base64-encoded-post-body--rx-5
  - id: js-request-base64-body
  - id: base64-encoded-post-body--rx-7
  - id: base64-encoded-post-body--rx-8
  - id: base64-encoded-post-body--rx-9
  not:
  - regex: 'Authorization\s*:\s*`Basic\s+\$\{[^}]+\}`'
  - substr: api.mailgun.net
  # PHP Basic auth builds `Authorization => Basic ` + base64_encode($_POST...)
  # — credential encoding, not a masqueraded form body. Also drop the common
  # false hit where `(post|upload)` matches inside `$_POST`.
  - regex: '(?i)base64_encode\s*\(\s*\$_POST'
  - regex: "(?i)Authorization['\"]?\\s*=>\\s*.{0,80}Basic.{0,120}base64_encode"
  unless:
  - id: mailgun-urlencoded-basic-auth
  - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
  # Indirect form of the Authorization-header exclusion above: the credential
  # is base64-encoded into a `Basic ${...}` template literal assigned to a
  # variable (e.g. `this.auth = \`Basic ${btoa(session)}\``) with the
  # Authorization header set from that variable elsewhere, so the literal
  # word "Authorization" never sits next to the btoa() call itself.
  - id: micro-behaviors/communications/http/basic-auth::js-basic-auth-btoa-template
- id: mailgun-urlencoded-basic-auth
  for: [python, javascript, php, powershell]
  desc: Mailgun urlencoded Basic auth post
  crit: notable
  conf: 0.9
  near_bytes: 2400
  all:
  - type: trait
    id: micro-behaviors/communications/http/services/mailgun::mailgun-api-domain
  - type: trait
    id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
