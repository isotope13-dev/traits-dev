defaults:
  for: [pyc]
  platforms: [unix, windows]
  crit: notable
  conf: 0.97

traits:
  - id: pyc-multipart-encoder-reference
    desc: MultipartEncoder name in Python bytecode
    # The public API name remains in co_names for both root and submodule
    # imports, including aliased imports. Do not require one import path.
    # A name reference does not prove a call or a network send.
    if:
      type: symbol
      kind: identifier
      exact: MultipartEncoder
