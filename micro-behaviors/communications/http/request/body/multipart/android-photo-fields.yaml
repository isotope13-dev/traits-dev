defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
traits:
  - id: dex-form-ocr-text-field
    desc: Adds recognized text to multipart form
    if:
      type: symbol
      kind: call
      regex: ';->addFormField$'
      arg: {index: 0, kind: string, exact: RECOGNIZED_TEXT}
  - id: dex-form-device-id-field
    desc: Adds device identifier to multipart form
    if:
      type: symbol
      kind: call
      regex: ';->addFormField$'
      arg: {index: 0, kind: string, exact: DEVICEID}
  - id: dex-form-photo-attachment
    desc: Attaches photo to multipart form
    if:
      type: symbol
      kind: call
      regex: ';->addFilePart$'
      arg: {index: 0, kind: string, exact: PHOTO_INFO}
