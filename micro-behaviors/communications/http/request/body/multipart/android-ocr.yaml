defaults:
  platforms: [android]
  for: [dex]
composite_rules:
  - id: android-photo-ocr-device-upload
    desc: Photo, OCR and device multipart fields
    crit: notable
    conf: 0.98
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/body/multipart::dex-form-ocr-text-field
      - id: micro-behaviors/communications/http/request/body/multipart::dex-form-device-id-field
      - id: micro-behaviors/communications/http/request/body/multipart::dex-form-photo-attachment
