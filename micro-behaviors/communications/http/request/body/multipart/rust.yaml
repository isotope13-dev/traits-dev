defaults:
  for: [rust]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: rust-multipart-file-field
    desc: Rust multipart form attaches a document file
    if:
      type: symbol
      kind: call
      regex: '^reqwest::(blocking::)?multipart::Form::new(\.[A-Za-z_]+)*\.file$'
      arg:
        kind: string
        exact: document
