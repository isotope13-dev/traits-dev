# Neutral browser observation primitive. Its source, storage, and transfer
# context are assembled independently by collection/export consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

traits:
  - id: visited-url-before-request-body
    desc: Visited URL/host reaches request body
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)(details\.url|tab\.url|url\.hostname)[\s\S]{0,80}body\s*:'
  - id: request-body-before-visited-url
    desc: Request body carries visited URL/host
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)body\s*:[\s\S]{0,80}(details\.url|tab\.url|url\.hostname)'
