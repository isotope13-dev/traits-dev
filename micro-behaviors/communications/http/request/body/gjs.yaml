defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: glib-command-pipeline-upload
    desc: Uploads shell pipeline output with curl
    conf: 0.96
    if:
      # Cached calls expose this concatenation as an expression. Operand
      # provenance identifies contributing literals but not their order.
      # The tree query proves adjacent producer/consumer literal operands;
      # the producer permits simple argv plus optional stderr suppression.
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            property: (property_identifier) @method)
          arguments: (arguments .
            (binary_expression
              left: (string (string_fragment) @producer)
              operator: "+"
              right: (string (string_fragment) @consumer)) .)) @upload
          (#match? @method "^spawn_command_line_(a)?sync$")
          (#match? @producer "^/bin/(ba)?sh -c '[\\w :./-]+(2>/dev/null )?\\| *$")
          (#match? @consumer "^curl (-[fsSLk]+ )?(-m [0-9]+ )?--data(-binary)? @- https?://[^'\\s;&|]+'$"))
