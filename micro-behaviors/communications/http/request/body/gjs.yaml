defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: glib-command-pipeline-upload
    desc: Uploads shell pipeline output with curl
    conf: 0.96
    if:
      # The entire argument is now recovered from bounded literal additions.
      # Producer and consumer order belong to one command, not loose fragments.
      type: symbol
      kind: call
      regex: '^(GLib|imports\.gi\.GLib)\.spawn_command_line_(a)?sync$'
      arg:
        index: 0
        kind: string
        regex: "^/bin/(ba)?sh -c '[\\w :./>-]+\\| *curl .{0,80}--data(-binary)? @- https?://[^'\\s;&|]+'$"
