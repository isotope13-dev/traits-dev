defaults:
  platforms:
    - unix
    - windows
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

composite_rules:
  - id: node-http-request-stream-body
    desc: Node HTTP request writes body
    crit: notable
    conf: 0.84
    all:
      - id: micro-behaviors/communications/http/request/body::request-write-call
      - id: micro-behaviors/communications/http/request/body::request-end-call
    any:
      - id: micro-behaviors/communications/http/request/client::node-http
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
      - id: micro-behaviors/communications/http/request/client::lib-request-call
  - id: js-http-post-body
    desc: JavaScript sends an HTTP POST body
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/request/json::node-http-post-json-body
      - id: micro-behaviors/communications/http/request/body::js-fetch-post-body-variable
  - id: node-http-request-end-body
    desc: Node HTTP request sends a body with end()
    crit: notable
    conf: 0.84
    all:
      - id: micro-behaviors/communications/http/request/client::node-http
      - id: micro-behaviors/communications/http/request/body::request-end-body-call
  # Neutral request-body groupings used by credential-exfiltration composites.
  # JSON.stringify() alone is not a request-body operation: many modules
  # serialize return values, cache records, or generated source.
  - id: node-request-payload-serialization
    desc: Node serializes or prepares an HTTP request body
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/communications/http/request/json::fetch-json-body
      - id: micro-behaviors/communications/http/post::axios-with-data
      - id: micro-behaviors/communications/http/request/body::request-write-payload-variable
  - id: node-http-request-body
    desc: Node sends an HTTP request body
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/communications/http/request/body::node-http-request-end-body
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/communications/http/request/json::fetch-json-body
      - id: micro-behaviors/communications/http/post::axios-with-data
      - id: micro-behaviors/communications/http/request/body::request-write-payload-variable

  - id: node-http-bound-or-named-request-body
    desc: Writes a body to a Node HTTP request
    crit: notable
    conf: 0.94
    any:
      - id: node-http-request-stream-body
      - id: node-bound-request-write-end
