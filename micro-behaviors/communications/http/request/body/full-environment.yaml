defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - javascript
  - typescript
  id: fetch-full-environment-json-body
  desc: Fetch body contains full Node environment
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      (
      [
      (call_expression
       function: (identifier) @_fetch
       arguments: (arguments (_) (object
        (pair key: (property_identifier) @_body value: (call_expression
         function: (member_expression object: (identifier) @_json property: (property_identifier) @_stringify)
         arguments: (arguments (object (pair value: (member_expression
          object: (identifier) @_process property: (property_identifier) @_env)))))))))
      (call_expression
       function: (identifier) @_fetch
       arguments: (arguments (_) (object
        (pair key: (property_identifier) @_body value: (call_expression
         function: (member_expression object: (identifier) @_json property: (property_identifier) @_stringify)
         arguments: (arguments (member_expression
          object: (identifier) @_process property: (property_identifier) @_env)))))))
      ] @sink
       (#eq? @_fetch "fetch") (#eq? @_body "body")
       (#eq? @_json "JSON") (#eq? @_stringify "stringify")
       (#eq? @_process "process") (#eq? @_env "env")
      )
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/package/testing/presence/fixture::json-attack-payload-catalog-context
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
