defaults:
  platforms: [unix]
  for: [perl]
traits:
  - id: module
    desc: Perl CGI module import
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?m)^\s*use\s+CGI\s*;'
  - id: param
    desc: CGI request parameter access
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '->param\s*\('
  - id: cookie
    desc: CGI cookie access
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '->cookie\s*\('
  - id: cookie-header
    desc: CGI response sets cookies
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '->header\s*\(\s*-cookie\s*=>'
  - id: url
    desc: CGI request URL access
    crit: notable
    conf: 0.85
    if:
      # Anchor on the CGI.pm query object. A bare `->url\b` matched every Perl
      # `url()` accessor in the language — `$self->url`, `$mirror->url()` in
      # CPAN::Mirrors — and reported plain URL getters as CGI request handling.
      type: text
      regex: '\$(cgi|q|query|CGI)\s*->\s*url\b'
composite_rules:
  - id: request-handling
    desc: Perl CGI request handling
    crit: notable
    conf: 0.84
    all:
      - id: module
      - id: param
  - id: cookie-session
    desc: Perl CGI cookie session handling
    crit: suspicious
    conf: 0.9
    all:
      - id: module
      - id: cookie
      - id: cookie-header
