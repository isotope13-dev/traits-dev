# CGI/SAPI server variables carry the inbound request's metadata (user agent,
# referer, query string, negotiated language, target URI, virtual host). Any
# server-side handler may read them, so each name is a neutral capability here
# and the intent — cloaking prefilters, user-agent routing, fingerprinting —
# lives in the objective composites that reference them.
#
# Word-boundary matching is deliberate: a plain substring for SERVER_NAME also
# fires inside unrelated identifiers such as an ISBL keyword list's
# SYSRES_CONST_GROUP_SERVER_NAME_REQUISITE_CODE.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.85

traits:
  - id: http-user-agent-server-var
    desc: Names the CGI HTTP_USER_AGENT variable
    if:
      type: text
      word: HTTP_USER_AGENT

  - id: http-referer-server-var
    desc: Names the CGI HTTP_REFERER variable
    if:
      type: text
      word: HTTP_REFERER

  - id: query-string-server-var
    desc: Names the CGI QUERY_STRING variable
    if:
      type: text
      word: QUERY_STRING

  - id: http-accept-language-server-var
    desc: Names the CGI HTTP_ACCEPT_LANGUAGE variable
    if:
      type: text
      word: HTTP_ACCEPT_LANGUAGE

  - id: request-uri-server-var
    desc: Names the CGI REQUEST_URI variable
    if:
      type: text
      word: REQUEST_URI

  - id: server-name-server-var
    desc: Names the CGI SERVER_NAME variable
    if:
      type: text
      # Bare SERVER_NAME is a common C process-name macro (e.g. Shizuku).
      regex: '(\$_SERVER\[.SERVER_NAME.\]|getenv\(.SERVER_NAME)'

composite_rules:
  # Reading one server variable is routine; harvesting the whole visitor
  # profile in one place is the shape traffic-cloaking prefilters use before
  # deciding which page a visitor gets.
  - id: request-metadata-sweep
    desc: Names four or more CGI request variables
    crit: notable
    conf: 0.88
    needs: 4
    any:
      - id: http-user-agent-server-var
      - id: http-referer-server-var
      - id: query-string-server-var
      - id: http-accept-language-server-var
      - id: request-uri-server-var
      - id: server-name-server-var
