composite_rules:
- id: npm-postinstall-oob-get-cooccurrence
  platforms: [unix, windows]
  desc: Postinstall hook beside OOB endpoint and GET call
  crit: notable
  conf: 0.98
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/communications/url/host::oob-endpoint-any
  any:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  needs: 1
  unless:
  - id: metadata/package/testing/presence/harness/

  - id: "metadata/file/naming::test-directory-component"
