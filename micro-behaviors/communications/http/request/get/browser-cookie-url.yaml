# Bind the cookie read to an actual call, not text inside a command catalog.
# A test probe still implements cookie theft; test labels do not suppress it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
traits:
  - id: fetch-url-appends-member-value
    desc: Fetch URL appends a property value
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments
            (binary_expression
              left: (string) @url
              operator: "+"
              right: (member_expression
                object: (identifier) @obj
                property: (property_identifier) @prop) @evidence)))
          (#eq? @fn "fetch")
          (#match? @url "^[\\\"']https?://")
          )
