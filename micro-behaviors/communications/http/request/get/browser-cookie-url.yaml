# Bind the cookie read to an actual call, not text inside a command catalog.
# A test probe still implements cookie theft; test labels do not suppress it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
traits:
  - id: fetch-url-appends-member-value
    desc: Fetch URL appends document cookies
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments
            (binary_expression
              left: (string) @url
              operator: "+"
              right: (member_expression
                object: (identifier) @obj
                property: (property_identifier) @prop) @evidence)))
          (#eq? @fn "fetch")
          (#eq? @obj "document")
          (#eq? @prop "cookie")
          (#match? @url "^[\\\"']https?://")
          )
  # Documentation and security-example corpora use evil.com/evil.example
  # placeholders for cookie-exfiltration illustrations; live stealers never
  # target those placeholder hosts.
  - id: fetch-cookie-evil-placeholder
    desc: Fetch cookie URL names evil.com placeholder
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'fetch\(\s*["'']https?://evil\.(com|example)\b[^"'']{0,60}["'']\s*\+\s*document\.cookie'
