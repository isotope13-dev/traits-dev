# The article's get() wrapper is not a requests.get import. Require an HTTP
# URL origin in its first argument rather than treating every get() as HTTP.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-get-http-url-argument
    desc: GET-style helper receives an HTTP URL
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: get
      arg:
        index: 0
        from:
          value: '^https?://'
