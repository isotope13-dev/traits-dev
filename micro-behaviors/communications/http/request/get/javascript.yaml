defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-http-client-get
    desc: Node HTTP client makes a GET request
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      regex: '\.get$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'

  - id: node-helper-module-bracket-get
    desc: HTTP module helper result invokes get
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b[\w$]+\(["''](node:)?https?["'']\)\s*\[["'']get["'']\]\s*\('

  - id: node-dynamic-import-http-module
    desc: Dynamic import of Node HTTP client module
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bimport\s*\(\s*["\x27](node:)?https?["\x27]\s*\)'

  - id: node-http-client-invokes-get
    desc: Node script invokes HTTP get method
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bhttps?\s*\.get\s*\('

  - id: chained-result-invokes-get
    desc: Call result invokes get method
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '\)\s*\.get\s*\('

composite_rules:
  - id: node-dynamic-import-http-get
    desc: Dynamic import of HTTP client module invokes get
    crit: notable
    conf: 0.95
    near_lines: 10
    all:
      - id: micro-behaviors/communications/http/request/get::node-dynamic-import-http-module
    any:
      - id: micro-behaviors/communications/http/request/get::node-http-client-invokes-get
      - id: micro-behaviors/communications/http/request/get::chained-result-invokes-get

  - id: node-http-client-get-operation
    desc: Node HTTP client GET request via require or dynamic import
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: micro-behaviors/communications/http/request/get::node-helper-module-bracket-get
      - id: micro-behaviors/communications/http/request/get::node-dynamic-import-http-get

