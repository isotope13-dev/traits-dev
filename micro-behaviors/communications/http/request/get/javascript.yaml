defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-http-client-get
    desc: Node HTTP client makes a GET request
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      regex: '\.get$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'

  - id: node-helper-module-bracket-get
    desc: HTTP module helper result invokes get
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b[\w$]+\(["''](node:)?https?["'']\)\s*\[["'']get["'']\]\s*\('
