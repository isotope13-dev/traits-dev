defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: program-scope-fetch-appends-property
    desc: Root script fetch appends a property
    crit: notable
    conf: 0.98
    if:
      # The reviewed 334KB UI exhausts source-flow work before its final call.
      # Bind only direct program children instead of inferring reachability
      # through the unrelated, much larger initializer body.
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (expression_statement (call_expression
            function: (identifier) @fetch
            arguments: (arguments (binary_expression
              right: (member_expression) @evidence)))))
          (#eq? @fetch "fetch"))
