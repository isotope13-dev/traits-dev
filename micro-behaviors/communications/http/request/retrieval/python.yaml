# Preserves the retrieval alternatives used by the service-swap composite.
# GET alone establishes no service replacement or supply-chain objective.
composite_rules:
  - id: python-get-or-download
    desc: Python HTTP GET or download capability
    crit: notable
    platforms: [unix, windows]
    for: [python]
    any:
      - id: micro-behaviors/communications/http/download/
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/request/get/
