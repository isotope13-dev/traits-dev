defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
- id: axios-computed-url-call
  desc: Axios call concatenates variable URL parts
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'axios\s*\[[^]]+\]\s*\([^)]{0,80}\+[^)]{0,80}\+'

- id: node-https-get-concatenated-url
  desc: Node HTTPS GET builds URL by concatenation
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    kind: call
    regex: 'https\.get\(\s*[A-Za-z_$][\w$]*\s*\+\s*[A-Za-z_$][\w$]*'

# The sibling above covers the URL-string call form, `https.get(base + path)`.
# This is the options-object form, `https.get({hostname: h, path: '/' + data})`,
# which the string matcher cannot see. Worth having as its own atom because a
# request path assembled from a runtime value is how a GET-shaped beacon carries
# its payload -- the collected data rides in the path instead of a POST body, so
# none of the body-oriented exfil transports match it.
- id: node-request-options-computed-path
  desc: Node request options build path by concatenation
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'https?\.(get|request)\s*\(\s*\{[^}]{0,240}path\s*:[^,}]{0,60}\+'
