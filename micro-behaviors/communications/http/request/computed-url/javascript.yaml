defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
- id: axios-computed-url-call
  desc: Axios call concatenates variable URL parts
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'axios\s*\[[^]]+\]\s*\([^)]{0,80}\+[^)]{0,80}\+'

- id: node-https-get-concatenated-url
  desc: Node HTTPS GET builds URL by concatenation
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    kind: call
    regex: 'https\.get\(\s*[A-Za-z_$][\w$]*\s*\+\s*[A-Za-z_$][\w$]*'
