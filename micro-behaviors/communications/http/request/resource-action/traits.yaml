# Structured API actions that mutate a named resource.  These are neutral
# capabilities; authorization abuse is inferred by objective-level composites.
defaults:
  platforms: [windows, unix]
  for: [json, javascript, typescript, python, go, rust, java, shell, powershell]

traits:
  - id: destructive-resource-action-call
    desc: Calls a destructive resource method
    crit: notable
    conf: 0.96
    for: [javascript, typescript, python, go, rust, java, shell]
    if:
      type: symbol
      kind: call
      # Require a receiver/member separator and a resource noun. Do not treat
      # generic local helpers such as remove_entry as resource API calls.
      regex: '(?i)\.(cancel|delete|remove|void)\w*(reservation|booking|waitlist|member|account)\w*$'

  - id: method-cancel-reservation
    desc: cancelReservation API method field
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)["'']method["'']\s*:\s*["'']cancelReservation["'']'

  - id: method-destructive-booking
    desc: Destructive booking method field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']method["'']\s*:\s*["''](cancel|void)\w*(booking|reservation)'

  - id: foreign-principal-id-field
    desc: Other-principal identity field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](target|other|foreign|victim|user|member)[_-]?id["'']\s*:'

  - id: principal-id-value
    desc: Principal-scoped resource identifier
    crit: component
    conf: 0.94
    if:
      type: text
      # Require an opaque, digit-bearing identifier. Human-readable slugs such
      # as "account-password-policy" are resource names, not principal IDs.
      regex: '(?i)["''](usr|member|acc(oun)?t)[_-](\d\w{7,}|\w{3,}\d\w{3,})["'']'

  - id: named-other-principal
    desc: Named other-principal variable
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(other|foreign|target|victim)[_-](user|member|account|id)\b'

  - id: http-authorization-denial-status
    desc: References HTTP 403 denial status
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)status_code\s*==\s*403|["'']status["'']\s*:\s*403|["'']403 Forbidden["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
  - id: destructive-resource-action
    desc: Destructive resource API action
    crit: notable
    conf: 0.96
    any:
      - id: destructive-resource-action-call
      - id: method-cancel-reservation
      - id: method-destructive-booking

  - id: cross-principal-resource-target
    desc: Cross-principal resource target
    crit: suspicious
    conf: 0.95
    all:
      - id: destructive-resource-action
    any:
      - id: foreign-principal-id-field
      - id: principal-id-value
      - id: named-other-principal
    near_bytes: 512

  - id: destructive-action-success
    desc: Destructive API action succeeds
    crit: notable
    conf: 0.96
    all:
      - id: destructive-resource-action
      - id: micro-behaviors/communications/http/response::response-success-field
    near_bytes: 512
