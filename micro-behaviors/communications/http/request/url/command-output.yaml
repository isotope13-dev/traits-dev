# These are data transfers, not a verdict on what a local command does.
# Explicit transfer models preserve command results through common encoders.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: python-command-output-request-url
    desc: Process output contributes to HTTP request URL
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^((requests|httpx)\.get|urllib\.request\.urlopen)$'
      arg:
        index: 0
        from:
          call: '^subprocess\.check_output$'
          through:
            - call: '^base64\.b64encode$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
            - call: '^json\.dumps$'
              arguments: [0]
            - call: '^urllib\.parse\.quote$'
              arguments: [0]

  - id: node-execsync-result-request-url
    desc: execSync result contributes to HTTP URL
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^(axios\.get|fetch)$'
      arg:
        index: 0
        from:
          call: '(^|\.)execSync$'
          through:
            - call: '\.toString$'
              receiver: true
            - call: '^JSON\.stringify$'
              arguments: [0]
            - call: '^encodeURIComponent$'
              arguments: [0]
