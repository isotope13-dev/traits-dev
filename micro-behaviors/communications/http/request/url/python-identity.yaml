# Local host or user identity interpolated into an outbound Python HTTP URL.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-host-identity-in-client-url
    desc: Host identity enters Python HTTP URL
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(get|post|put)$'
      arg:
        index: 0
        from:
          call: '^(socket\.gethostname|platform\.node|getpass\.getuser)$'
          through: &url_pass
            - call: '^\.format$'
              arguments: [0, 1, 2, 3]
            - call: '(^|\.)quote(_plus)?$'
              arguments: [0]
            - call: '(^|\.)Request$'
              arguments: [0]

  - id: python-host-identity-in-urlopen-url
    desc: Host identity enters Python urlopen URL
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?urlopen$'
      arg:
        index: 0
        from:
          call: '^(socket\.gethostname|platform\.node|getpass\.getuser)$'
          through: *url_pass

composite_rules:
  - id: python-host-identity-in-url
    desc: Python includes host identity in HTTP URL
    crit: component
    conf: 1.0
    any:
      - id: python-host-identity-in-client-url
      - id: python-host-identity-in-urlopen-url
