# Bound command result reaches the hostname in the next request.
traits:
- id: shell-identity-hex-hostname-request
  desc: Requests hostname containing hex host identity
  crit: notable
  conf: 0.98
  for:
  - shell
  platforms:
  - unix
  - android
  - ios
  unless:
  - id: micro-behaviors/data/source/function/names::shell-curl-function-definition
  - type: symbol
    kind: function
    exact: xxd
  - type: symbol
    kind: function
    exact: hostname
  - type: symbol
    kind: function
    exact: whoami
  - type: symbol
    kind: function
    exact: pwd
  - type: tree-sitter
    language: shell
    query: (program (variable_assignment) . "&") @background
  - type: tree-sitter
    language: shell
    query: |-
      (command name: (command_name (word) @alias)
        argument: [(concatenation . (word) @assignment) (word) @assignment]
        (#eq? @alias "alias")
        (#match? @assignment "^(curl|xxd|hostname|whoami|pwd)="))
  if:
    type: tree-sitter
    language: shell
    query: |
      (program
        (variable_assignment
          name: (variable_name) @binding
          value: (command_substitution .
            (pipeline .
              (command name: (command_name (word) @producer) !redirect .)
              . (command name: (command_name (word) @hex) !redirect
                . argument: (word) @plain .) .) .))
        . (command name: (command_name (word) @curl) !redirect
          . argument: (word)* @flags
          . argument: (string
            . (string_content) @scheme
            . [(simple_expansion (variable_name) @used)
               (expansion . (variable_name) @used .)]
            . (string_content) @suffix .) .)
        (#match? @producer "^(hostname|whoami|pwd)$")
        (#eq? @hex "xxd")
        (#eq? @plain "-p")
        (#match? @curl "^(/usr/bin/)?curl$")
        (#match? @flags "^-[fsSLsv]+$")
        (#eq? @used @binding)
        (#match? @scheme "^https?://$")
        (#match? @suffix "^\\.[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}/"))
