defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: python-get-whole-environment-url
  desc: HTTP GET URL includes entire process environment
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(requests|httpx)\.get\(\s*["']https?:\/\/[^"'\s]+["']\s*\+\s*os\.environ\.__str__\(\)/
        condition:
          (
            $b0_0
          )
      }
- id: python-requests-get-environment-url-to-ngrok
  desc: GET appends process environment to ngrok URL
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: ngrok-free\.(app|dev)/["']\s*\+\s*os\.environ\.__str__
- id: requests-get-url-literal
  desc: Literal URL passed to requests.get/httpx.get
  conf: 0.8
  if:
    type: symbol
    kind: call
    regex: ^(requests|httpx|session|r)\.get$
    arg:
      kind: string
      regex: ^https?://
  unless:
  - type: basename
    regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
- id: urllib-url-literal
  desc: urllib URL literal in HTTP
  conf: 0.8
  if:
    type: text
    regex: urllib2?\.(urlopen|urlretrieve|request)\s*\(\s*["']https?://
  unless:
  - type: basename
    regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
- id: python-column0-requests-get
  desc: Module assigns requests.get of a URL
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?m)^[A-Za-z_]\w*\s*=\s*requests\.get\(\s*["']https?://
- id: python-client-url-literal
  desc: Client constructor takes a URL literal
  conf: 0.86
  if:
    type: text
    regex: Client\(\s*["']https?://
