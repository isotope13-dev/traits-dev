defaults:
  platforms: [unix, windows]
  for: [python, pkginfo]
composite_rules:
- id: init-encoded-url-callback
  for:
  - python
  desc: Python init file requests an encoded HTTP URL
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  - id: micro-behaviors/communications/http/request/client::request-python
  any:
  - id: micro-behaviors/communications/url/encoded::https-b64-protocol-fragment
  - id: micro-behaviors/communications/url/encoded::encoded-http-url
