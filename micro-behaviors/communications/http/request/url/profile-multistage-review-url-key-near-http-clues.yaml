defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
- id: url-key-near-http-clues
  desc: URL key near HTTP request references
  crit: notable
  conf: 0.85
  near_lines: 80
  all:
  - id: metadata/lang/source/literal/string/label::remote-url-key
  any:
  - id: metadata/import/python/urllib/request
  - id: micro-behaviors/communications/http/request/url::urllib-url-literal
  - id: micro-behaviors/communications/http/request/url::requests-get-url-literal
  - id: micro-behaviors/communications/http/post::python-post-url-literal
  unless:
  - id: well-known/app/infrastructure/pulumi::pulumi-python-provider-generated
