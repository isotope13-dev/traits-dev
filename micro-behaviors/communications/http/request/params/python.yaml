defaults:
  crit: notable
  conf: 0.85
  platforms:
    - windows
    - unix
  for:
    - python
traits:
  - id: django-request-get
    desc: Django request GET parameter access
    if:
      type: symbol
      exact: request.GET
  - id: django-request-post
    desc: Django request POST parameter access
    if:
      type: symbol
      exact: request.POST
