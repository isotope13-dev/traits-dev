defaults:
  crit: notable
  conf: 0.85
  platforms:
    - windows
    - unix
  for:
    - python
traits:
  - id: urllib-urlopen-b64-login-query
    desc: urlopen query contains Base64 login
    conf: 0.96
    if:
      type: text
      regex: 'urlopen\(f["''][^"'']{1,100}["'']\+base64\.b64encode\(os\.getlogin\(\)\)'
  - id: django-request-get
    desc: Django request GET parameter access
    if:
      type: symbol
      exact: request.GET
  - id: django-request-post
    desc: Django request POST parameter access
    if:
      type: symbol
      exact: request.POST
