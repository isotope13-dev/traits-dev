# Query-value construction remains a neutral observation, including when the
# same PowerShell command is embedded by another Windows scripting host.
defaults:
  platforms: [windows]
  for: [scripts, source, lnk, pe, dll]
  crit: notable
  conf: 0.96
traits:
  - id: powershell-domain-query-value
    desc: URL query value uses logon domain
    if:
      type: text
      regex: '(?i)[?&][^=\s"'']{1,40}=["'']\s*\+\s*\$env:userdomain\b'
  - id: powershell-username-query-value
    desc: URL query value uses username
    if:
      type: text
      regex: '(?i)[?&][^=\s"'']{1,40}=["'']\s*\+\s*\$env:username\b'
