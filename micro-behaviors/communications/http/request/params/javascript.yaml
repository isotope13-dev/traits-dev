defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

traits:
  - id: js-axios-request-phone-variable
    desc: Axios request includes phone variable
    crit: notable
    conf: 0.93
    # Covers the common TypeScript/CommonJS output form.  The phone-number
    # value is still only a capability; exfiltration is inferred by objective
    # composites that add an external endpoint and sink context.
    if:
      type: text
      regex: 'axios_\d+\.default\.(get|post)\([^;\n]{0,180}phone(Number|_number)'
