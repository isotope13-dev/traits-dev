defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

traits:
  - id: browser-device-profile-request-fields--display
    desc: Browser device display request field
    crit: component
    conf: 0.93
    if:
      type: literal
      kind: string
      regex: '^&?(location|screen|webgl|webrtc)='
  - id: browser-device-profile-request-fields--network
    desc: Browser device network request field
    crit: component
    conf: 0.93
    if:
      type: literal
      kind: string
      regex: '^&?(battery|network|wifi)='
  - id: browser-device-profile-request-fields--identity
    desc: Browser device identity request field
    crit: component
    conf: 0.93
    if:
      type: literal
      kind: string
      regex: '^&?(image|uri|ck)='

  - id: js-axios-request-phone-variable
    desc: Axios request includes phone variable
    crit: notable
    conf: 0.93
    # Covers the common TypeScript/CommonJS output form.  The phone-number
    # value is still only a capability; exfiltration is inferred by objective
    # composites that add an external endpoint and sink context.
    if:
      type: text
      regex: 'axios_\d+\.default\.(get|post)\([^;\n]{0,180}phone(Number|_number)'
composite_rules:
  - id: browser-device-profile-request-fields
    desc: Multiple browser profile request fields
    crit: notable
    conf: 0.93
    any:
      - id: browser-device-profile-request-fields--display
      - id: browser-device-profile-request-fields--network
      - id: browser-device-profile-request-fields--identity
