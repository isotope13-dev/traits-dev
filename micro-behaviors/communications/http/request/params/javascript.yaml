defaults:
  crit: notable
  conf: 0.93
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: location-rendering-query-field
    desc: Location or rendering query field prefix
    if:
      type: literal
      kind: string
      regex: '^&?(location|screen|webgl|webrtc)='
  - id: power-connectivity-query-field
    desc: Power or connectivity query field prefix
    if:
      type: literal
      kind: string
      regex: '^&?(battery|network|wifi)='
  - id: resource-state-query-field
    desc: Resource or cookie query field prefix
    if:
      type: literal
      kind: string
      regex: '^&?(image|uri|ck)='

  - id: js-axios-request-phone-variable
    desc: Axios request includes phone variable
    # Covers the common TypeScript/CommonJS output form.  The phone-number
    # value is still only a capability; exfiltration is inferred by objective
    # composites that add an external endpoint and sink context.
    if:
      type: text
      regex: 'axios_\d+\.default\.(get|post)\([^;\n]{0,180}phone(Number|_number)'

  - id: js-fetch-number-query-variable
    desc: Fetch appends a number query variable
    conf: 0.96
    if:
      type: text
      regex: '\bfetch\s*\(\s*["''][^"''\n]{1,180}[?&]number=["'']?\s*\+\s*\w*[Nn]umber'
composite_rules:
  - id: client-query-field-prefix
    desc: Client query field prefix
    any:
      - id: location-rendering-query-field
      - id: power-connectivity-query-field
      - id: resource-state-query-field
