defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: get-with-params
    desc: Axios GET config includes params
    conf: 0.8
    if:
      # A path field inside a source-generation string proves neither HTTP
      # nor GET. Bind the params option to an actual Axios GET call.
      type: symbol
      kind: call
      exact: axios.get
      arg:
        index: 1
        from:
          field: params
          field_exists: true
  - id: fetch-token-query-parameter
    desc: Fetch call with token query parameter
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bfetch\s*\([^)]{0,600}\?token='
