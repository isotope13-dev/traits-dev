defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: C0002
traits:
- id: payload-param
  desc: HTTP query parameter named payload
  crit: component
  conf: 0.7
  if:
    type: text
    regex: '[?&]payload='
- id: vid-param
  desc: vid= HTTP request parameter marker
  crit: component
  conf: 0.85
  for: [scripts]
  if:
    type: string_literal
    exact: vid=
# `request.getParameter` is a servlet-API spelling with no counterpart in the
# script languages listed here; the extra carrier types exist because a JSP page
# has no `jsp` file type in cleave and is classified by content, landing on
# python/javascript/vbs/html (see metadata/lang/scripted::jsp-page-directive).
# Java source uses the structured call atom below, so it is excluded here to
# avoid reporting the same request read twice.
- id: java-servlet-get-parameter
  desc: Java servlet request parameter access
  crit: notable
  conf: 0.78
  for: [html, javascript, python, vbs]
  if:
    type: text
    substr: request.getParameter
# The text form above only sees a receiver literally named `request`; the call
# projection catches the same read through any receiver (`req`, `httpRequest`,
# a field), which is what generated JSP classes and hand-written servlets use.
- id: servlet-get-parameter-call
  desc: Java servlet request parameter read
  crit: notable
  conf: 0.82
  for: [java, kotlin, groovy, scala]
  if:
    type: symbol
    kind: call
    exact: getParameter
- id: login-action-parameter
  desc: HTTP action=login query parameter
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    substr: action=login
- id: invalid-scope-query-parameter-text
  desc: Invalid scope query-parameter text
  crit: component
  conf: 0.97
  for: [scripts, source, html]
  if:
    type: text
    regex: '(?i)[?&](amp;)?scope=(invalid|nonexistent)([_-]?scope)?\b'
- id: invalid-scope-mapping-text
  desc: Invalid scope parameter mapping text
  crit: component
  conf: 0.97
  for: [scripts, source, html]
  if:
    type: text
    regex: '(?i)["'']scope["'']?\s*[:=]\s*["''](invalid|nonexistent)([_-]?scope)?["'']'
