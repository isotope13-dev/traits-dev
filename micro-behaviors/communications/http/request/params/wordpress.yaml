defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: wordpress-registration-password-pair
    desc: WordPress registration password pair
    if:
      type: text
      regex: '(?is)(["'']?passw1["'']?.{0,240}["'']?passw2["'']?|["'']?passw2["'']?.{0,240}["'']?passw1["'']?)'

  - id: profile-builder-registration-nonce-field
    desc: Sends a Profile Builder registration nonce field
    if:
      type: text
      regex: '\bregister_[A-Za-z0-9_-]{1,80}_nonce_field\b'

  - id: wordpress-autologin-true-parameter
    desc: Sends a WordPress autologin=true parameter
    if:
      type: text
      regex: '(?i)\bautologin\s*["'']?\s*(=>|:|=)\s*["'']?true'

  - id: wordpress-nonce-parameter
    desc: Handles a WordPress nonce parameter
    if:
      type: text
      word: _wpnonce

  - id: wordpress-setup-dbname-param
    desc: WordPress setup-config dbname form field
    crit: component
    if:
      type: text
      regex: '(?i)(["''&?]|\b)dbname(["'']?\s*(=>|:|=))'

  - id: wordpress-setup-uname-param
    desc: WordPress setup-config uname form field
    crit: component
    if:
      type: text
      regex: '(?i)(["''&?]|\b)uname(["'']?\s*(=>|:|=))'

  - id: wordpress-setup-dbhost-param
    desc: WordPress setup-config dbhost form field
    crit: component
    if:
      type: text
      regex: '(?i)(["''&?]|\b)dbhost(["'']?\s*(=>|:|=))'

  - id: wordpress-install-username-param
    desc: WordPress install.php user_name form field
    crit: component
    if:
      type: text
      regex: '(?i)(["''&?]|\b)user_name(["'']?\s*(=>|:|=))'

  - id: wordpress-install-password-param
    desc: WordPress install.php admin_password form field
    crit: component
    if:
      type: text
      regex: '(?i)(["''&?]|\b)admin_password(["'']?\s*(=>|:|=))'

  - id: wordpress-install-email-param
    desc: WordPress install.php admin_email form field
    crit: component
    if:
      type: text
      regex: '(?i)(["''&?]|\b)admin_email(["'']?\s*(=>|:|=))'

  - id: wordpress-login-credentials-fields
    desc: WordPress wp-login log and pwd fields
    crit: notable
    if:
      type: text
      regex: '(?is)(["''&?]|\b)log(["'']?\s*(=>|:|=))[\s\S]{1,180}(["''&?]|\b)pwd(["'']?\s*(=>|:|=))'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap

  - id: wordpress-editor-newcontent-field
    desc: Supplies WordPress code-editor newcontent field
    crit: notable
    if:
      type: text
      regex: '(?i)(["''&?]|\b)newcontent(["'']?\s*(=>|:|=))'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap

composite_rules:
  - id: profile-builder-registration-request-fields
    desc: Sends Profile Builder registration form fields
    crit: notable
    conf: 0.97
    all:
      - id: wordpress-registration-password-pair
      - id: profile-builder-registration-nonce-field
    near_bytes: 1024

  - id: wordpress-autologin-nonce-parameters
    desc: Handles WordPress autologin nonce parameters
    crit: notable
    conf: 0.97
    all:
      - id: wordpress-autologin-true-parameter
      - id: wordpress-nonce-parameter
    near_bytes: 256

  - id: wordpress-setup-config-db-fields
    desc: Supplies WordPress setup-config database form parameters
    crit: notable
    conf: 0.97
    all:
      - id: wordpress-setup-dbname-param
      - id: wordpress-setup-uname-param
      - id: wordpress-setup-dbhost-param
    near_bytes: 512
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case

  - id: wordpress-install-admin-fields
    desc: Supplies WordPress install.php administrator bootstrap fields
    crit: notable
    conf: 0.97
    all:
      - id: wordpress-install-username-param
      - id: wordpress-install-password-param
      - id: wordpress-install-email-param
    near_bytes: 512
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case
