defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: wordpress-registration-password-pair
    desc: WordPress registration password pair
    if:
      type: text
      regex: '(?is)(["'']?passw1["'']?.{0,240}["'']?passw2["'']?|["'']?passw2["'']?.{0,240}["'']?passw1["'']?)'

  - id: profile-builder-registration-nonce-field
    desc: Sends a Profile Builder registration nonce field
    if:
      type: text
      regex: '\bregister_[A-Za-z0-9_-]{1,80}_nonce_field\b'

  - id: wordpress-autologin-true-parameter
    desc: Sends a WordPress autologin=true parameter
    if:
      type: text
      regex: '(?i)\bautologin\s*["'']?\s*(=>|:|=)\s*["'']?true'

  - id: wordpress-nonce-parameter
    desc: Handles a WordPress nonce parameter
    if:
      type: text
      word: _wpnonce

composite_rules:
  - id: profile-builder-registration-request-fields
    desc: Sends Profile Builder registration form fields
    crit: notable
    conf: 0.97
    all:
      - id: wordpress-registration-password-pair
      - id: profile-builder-registration-nonce-field
    near_bytes: 1024

  - id: wordpress-autologin-nonce-parameters
    desc: Handles WordPress autologin nonce parameters
    crit: notable
    conf: 0.97
    all:
      - id: wordpress-autologin-true-parameter
      - id: wordpress-nonce-parameter
    near_bytes: 256
