# A hand-rolled HttpClient wrapper invoked with a freshly generated token()
# appended to the request: a per-visit nonce that defeats caching of the reply.
traits:
  - id: httpclient-token-request
    desc: Custom HttpClient request carries random token
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: 'new HttpClient\(\)[^;]{0,240}\btoken\(\)'
