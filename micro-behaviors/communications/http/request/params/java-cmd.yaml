defaults:
  platforms: [unix, windows]
  for: [jsp, java, class, html, javascript, python, vbs]
traits:
  - id: servlet-cmd-parameter-read
    desc: Servlet reads the cmd request parameter
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'getParameter("cmd")'

  # The two-step webshell idiom: the cmd parameter lands in a variable
  # named after it, and that variable (usually concatenated onto a shell
  # prefix) is the exec argument. Requiring the variable inside the exec
  # call separates request-driven execution from a page that merely echoes
  # the parameter while exec runs a fixed command.
  - id: runtime-exec-cmd-variable-argument
    desc: exec argument references the cmd variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'exec\s*\([^;]{0,80}\bcmd\b'
