defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.84

traits:
  - id: python-token-request-parameter
    desc: Reads Python token request parameter
    for: [python]
    if:
      type: text
      regex: '(?i)request\.(args|form|values)\.get\([''\"]token'

  - id: python-auth-request-parameter
    desc: Reads Python auth request parameter
    for: [python]
    if:
      type: text
      regex: '(?i)request\.(args|form|values)\.get\([''\"](auth|login)'

  - id: javascript-token-request-parameter
    desc: Reads JavaScript token parameter
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(req|request)\.(query|body|params)\[[^\]]{0,28}token'

  - id: javascript-auth-request-parameter
    desc: Reads JavaScript auth request parameter
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(req|request)\.(query|body|params)\[[^\]]{0,28}auth'

  - id: javascript-login-request-parameter
    desc: Reads JavaScript login parameter
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(req|request)\.(query|body|params)\[[^\]]{0,28}login'

  - id: ruby-auth-token-parameter
    desc: Reads Ruby authentication request parameter
    for: [ruby]
    if:
      type: text
      regex: '(?i)params\[[^\]]{0,28}(token|auth|login)'

  - id: java-auth-token-parameter
    desc: Reads Java authentication request parameter
    for: [java]
    if:
      type: text
      regex: '(?i)request\.getParameter\([''\"][^''\"]{0,28}(token|auth|login)'

  - id: csharp-auth-token-parameter
    desc: Reads C# authentication request parameter
    for: [csharp]
    if:
      type: text
      regex: '(?i)Request\.Query\[[^\]]{0,28}(token|auth|login)'

composite_rules:
  - id: source-authentication-token-parameter
    desc: Reads authentication-like web request parameter
    crit: notable
    conf: 0.88
    any:
      - id: python-token-request-parameter
      - id: python-auth-request-parameter
      - id: javascript-token-request-parameter
      - id: javascript-auth-request-parameter
      - id: javascript-login-request-parameter
      - id: ruby-auth-token-parameter
      - id: java-auth-token-parameter
      - id: csharp-auth-token-parameter
