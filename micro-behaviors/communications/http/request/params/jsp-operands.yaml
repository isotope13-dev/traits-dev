defaults:
  platforms: [unix, windows]
  for: [jsp]
  crit: notable
  conf: 0.98
traits:
  - id: jsp-request-ec-z1-binding
    desc: JSP assigns request EC result to z1
    if:
      type: text
      regex: '\bz1\s*=\s*EC\(request\.getParameter\("[^"]{1,64}"\)\s*\+\s*"",\s*cs\)'
      exclude_html_comments: true
  - id: jsp-request-ec-z2-binding
    desc: JSP assigns request EC result to z2
    if:
      type: text
      regex: '\bz2\s*=\s*EC\(request\.getParameter\("[^"]{1,64}"\)\s*\+\s*"",\s*cs\)'
      exclude_html_comments: true
