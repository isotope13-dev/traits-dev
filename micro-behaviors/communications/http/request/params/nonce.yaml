defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # A nonce key in a JavaScript object is ordinary request-integrity metadata:
  # WordPress AJAX uses it for CSRF protection, while attestation relays use it
  # for a challenge. Intent belongs to composites that add the surrounding API,
  # endpoint, and instrumentation evidence.
  - id: javascript-nonce-field
    desc: JavaScript request nonce field
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)["'']nonce["'']\s*:'
    unless:
      # AES-GCM and other crypto metadata label the IV as a nonce but do not
      # describe an HTTP request parameter.
      - type: text
        substr: '"algorithm"'
      - type: text
        substr: 'AESGCM'
      - type: text
        substr: 'AES-GCM'
      - type: text
        substr: 'encryption_meta'
