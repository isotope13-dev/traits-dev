defaults:
  platforms: [windows]
  for: [vbs, html, javascript, lua]

traits:
  # Classic ASP accepts both the collection form (`Request.Form("x")`) and the
  # bare collection default (`Request("x")` → Form/QueryString). Webshells and
  # site-packers overwhelmingly use the bare form; requiring only `.Form` /
  # `.QueryString` missed ASPWebPack-style tools that drive every action
  # through `Request("Action")` / `Request("Path")`.
  - id: classic-asp-bare-request-field
    desc: Classic ASP bare Request field call
    crit: component
    conf: 0.9
    if:
      type: text
      # PascalCase bare `Request(...)` stays case-sensitive so JS `request(` /
      # `this.request(` stay out. Collection forms (`request.Form` /
      # `request.QueryString`) may be any case — common in Classic ASP shells —
      # and the `.Form`/`.QueryString` member keeps Fetch/`request(` FPs away.
      # Skip whole file when Fetch API `new Request(` is present (lookaround
      # unsupported; `not:` only sees the matched span, not the `new ` prefix).
      # Do not treat a namespaced class constructor such as `new d.Request(`
      # as Classic ASP's global Request object.
      # The argument must be a quoted field name: without it, every language
      # keyword list that contains `Request(Experience)?Permission` (Highlight.js
      # ships LSL among ~200 grammars) read as an ASP request field read.
      regex: '(^|[^\w$.])Request\s*\(\s*["'']'
    unless:
      - type: text
        regex: '\bnew\s+Request\s*\('
      - id: well-known/lib/ui/highlight-js::bundled-library

  - id: classic-asp-collection-request-field
    desc: Classic ASP request collection field call
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[^\w$.])request\s*\.\s*(Form|QueryString)\s*\('
    unless:
      - id: well-known/lib/ui/highlight-js::bundled-library

  - id: classic-asp-request-sql-field
    desc: Reads a SQL statement from a request
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\brequest\s*\(\s*["'']sql["'']\s*\)'

composite_rules:
  - id: classic-asp-request-field
    desc: Reads a field through the Classic ASP Request object
    crit: notable
    conf: 0.9
    any:
      - id: classic-asp-bare-request-field
      - id: classic-asp-collection-request-field
    # Repeat the members' exclusion here: a composite is re-evaluated against
    # its legs' conditions, so an `unless:` on the atoms alone did not stop
    # this from firing on a Highlight.js bundle.
    unless:
      - id: well-known/lib/ui/highlight-js::bundled-library
