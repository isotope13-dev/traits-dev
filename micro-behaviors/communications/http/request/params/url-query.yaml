defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, text]

traits:
  - id: username-query-parameter
    desc: URL username query parameter
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)([?&]|&amp;)username='

  - id: email-query-parameter
    desc: URL email query parameter
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)([?&]|&amp;)email='

  # A route-looking path placed in a query value is structurally distinct
  # from the request's actual path. Frameworks sometimes use this normally,
  # so attack intent is assigned only by composites with a privileged target.
  - id: namespaced-route-query-value
    desc: Query carries a namespaced route path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)([?&]|&amp;)([a-z][\w.-]{0,40}=)?/?[a-z][\w.-]{1,50}/v[0-9]+/[a-z0-9_./-]+'

composite_rules:
  - id: account-credential-query-triplet
    desc: URL query carries account credentials
    crit: notable
    conf: 0.96
    near_bytes: 1024
    all:
      - id: username-query-parameter
      - id: email-query-parameter
      - id: micro-behaviors/communications/http/url/query::password-query-parameter
