# Metabase route observations used by the SQL-injection exploit sequence.
# Wire, source-call, and structured-event forms are composed into neutral
# request capabilities; the objective tier infers the exploit from their
# relationship to response codes and request order.
defaults:
  platforms: [unix, windows]
  for: [scripts, json, typescript, rust, java, go, csharp]
  attack: T1190
  mbc: C0002

traits:
  - id: reset-password-post-call
    desc: HTTP client call to password-reset route
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(post|fetch|request)\s*\([^)]{0,120}/api/session/reset_password\b'

  - id: reset-password-post-wire
    desc: POST request to password-reset route
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bPOST\s+/api/session/reset_password\b'

  - id: reset-password-post-event
    desc: Structured POST password-reset event
    crit: notable
    conf: 0.96
    for: [json]
    if:
      type: text
      regex: '(?i)method["'']?\s*:\s*["'']?POST["'']?.{0,100}/api/session/reset_password\b'

  - id: current-user-get-call
    desc: HTTP client call to current-user route
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(get|fetch|request)\s*\([^)]{0,120}/api/user/current\b'

  - id: current-user-get-wire
    desc: GET request to current-user route
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bGET\s+/api/user/current\b'

  - id: current-user-get-event
    desc: Structured GET current-user event
    crit: notable
    conf: 0.96
    for: [json]
    if:
      type: text
      regex: '(?i)method["'']?\s*:\s*["'']?GET["'']?.{0,100}/api/user/current\b'

composite_rules:
  - id: reset-password-request
    desc: HTTP request to password-reset route
    crit: notable
    conf: 0.97
    any:
      - id: reset-password-post-call
      - id: reset-password-post-wire
      - id: reset-password-post-event

  - id: current-user-request
    desc: HTTP request to current-user route
    crit: notable
    conf: 0.97
    any:
      - id: current-user-get-call
      - id: current-user-get-wire
      - id: current-user-get-event
