# Neutral route observations used by clustered remote agents. Objective rules
# add a command schema, process execution, and channel context before inferring
# backdoor tasking.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, pe, elf, macho, dll]
  crit: notable
  conf: 0.92
  attack: T1071.001
  mbc: C0002

traits:
  - id: command-request-route
    desc: HTTP route requests a command task
    conf: 0.97
    if:
      type: string_literal
      regex: '/cmd/(req|request)$'

  - id: status-checkin-route
    desc: HTTP status, check-in, or heartbeat route
    if:
      type: string_literal
      regex: '/(status|checkin|heartbeat)$'

  - id: numbered-metrics-route
    desc: HTTP numbered metrics route
    if:
      type: string_literal
      regex: '/metrics[0-9]*$'

composite_rules:
  - id: paired-status-metrics-routes
    desc: Paired HTTP status and metrics routes
    conf: 0.96
    all:
      - id: status-checkin-route
      - id: numbered-metrics-route
