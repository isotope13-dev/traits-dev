# Forwarding-object fields, shared by wire JSON and source-language maps.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data, json]
  crit: notable
  conf: 0.95

traits:
  - id: forwarding-dns-base-host-field
    desc: HTTP base-host field uses a DNS hostname
    if:
      type: text
      regex: '(?i)\bhost["'']?\s*:\s*["'']https?://[a-z0-9.-]+\.[a-z]{2,63}[:/]'

  - id: forwarding-uppercase-scheme-url-field
    desc: Forwarded URL field uses uppercase HTTP scheme
    if:
      type: text
      regex: '\burl["'']?\s*:\s*["'']((H[tT][tT][pP]|hT[tT][pP]|htT[pP]|httP)[sS]?|httpS)://'
