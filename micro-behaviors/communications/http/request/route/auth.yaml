# Generic authentication-surface route observations. A password-reset /
# forgot-password / reset-token endpoint accepts an unauthenticated,
# attacker-supplied token that applications frequently concatenate into a
# database query (the Metabase CVSS-10 reset_password SQLi is one instance).
# These atoms are neutral route capabilities; the objective tier infers the
# pre-auth SQL-injection exploit from a reset endpoint appearing alongside an
# injection payload. Each matches the endpoint path substring anywhere in a URL
# string, so it covers `base + "/api/session/reset_password"`, a curl
# `"$H/reset-password"` argument, and framework routes alike -- forms the
# Metabase-specific wire/call atoms miss.
defaults:
  platforms: [unix, windows]
  for: [scripts, json, typescript, rust, java, go, csharp]
  attack: T1190
  mbc: C0002

traits:
  - id: reset-password-path
    desc: HTTP path contains a reset-password route
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/[\w./-]*reset[_/-]?password\b'
      case_insensitive: true

  - id: password-reset-path
    desc: HTTP path contains a password-reset route
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/[\w./-]*password[_/-]?reset\b'
      case_insensitive: true

  - id: reset-token-path
    desc: HTTP path contains a reset-token route
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/[\w./-]*reset[_/-]?token\b'
      case_insensitive: true

  - id: forgot-password-path
    desc: HTTP path contains a forgot-password route
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/[\w./-]*forgot[_/-]?password\b'
      case_insensitive: true

composite_rules:
  - id: password-reset-endpoint
    desc: HTTP path targets a password-reset endpoint
    crit: notable
    conf: 0.92
    any:
      - id: reset-password-path
      - id: password-reset-path
      - id: reset-token-path
      - id: forgot-password-path
