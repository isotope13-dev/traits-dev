---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: mcp-http-post-route
  desc: HTTP POST request line naming MCP route
  crit: notable
  conf: 0.96
  for:
  - text
  - data
  - scripts
  - source
  if:
    type: text
    regex: "(?im)^POST\\s+/mcp/?[?[:space:]]"
