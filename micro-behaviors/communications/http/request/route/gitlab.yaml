# GitLab repository-commits API routes. This is a neutral product API surface;
# exploit intent is inferred only when a request also carries path traversal.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, data]

traits:
  - id: gitlab-repository-commits-api-route
    desc: GitLab repository commits API route
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)/api/v4/projects/[^/\s"'']{1,128}/repository/commits/?'
