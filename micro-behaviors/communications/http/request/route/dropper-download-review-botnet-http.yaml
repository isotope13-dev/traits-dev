defaults:
  platforms: [linux]
  for: [elf]


traits:
  - id: get-botnet-path
    desc: HTTP GET path includes Botnet
    crit: notable
    conf: 0.95
    size_max: 8192
    if:
      type: text
      regex: 'GET\s+/[A-Za-z0-9._/-]{0,80}Botnet/[A-Za-z0-9._/-]{1,80}\s+HTTP/1\.[01]'
      case_insensitive: true
