# HTTP management-route observations used by AI gateways. These are neutral
# wire artifacts; objective composites add executable policy or cloud metadata
# targets before inferring API abuse.
defaults:
  platforms: [unix, windows]
  for: [text, data, scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: guardrail-registration-post-request
    desc: POST request targets guardrail registration
    if:
      type: text
      regex: '(?im)^POST\s+/guardrails[?[:space:]]'

  - id: pass-through-registration-post-request
    desc: POST request registers pass-through endpoint
    if:
      type: text
      regex: '(?im)^POST\s+/config/pass_through_endpoint[?[:space:]]'
