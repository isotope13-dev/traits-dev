# A /poll request alone is a route observation, not C2 tasking.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
- id: powershell-poll-route-request
  desc: PowerShell HTTP request to a /poll endpoint
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\b(Invoke-RestMethod|Invoke-WebRequest|curl(\.exe)?)\b[^\r\n]{0,180}/poll\b'
  not:
    - regex: '(?i)/(auth|oauth)/poll\b'
  unless:
    - id: well-known/app/ai/coding-agent/byteask::byteask-windows-installer-context
