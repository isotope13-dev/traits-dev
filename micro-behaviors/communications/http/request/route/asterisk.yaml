# Asterisk-compatible PBX management clients use this route to originate a
# channel. The endpoint is neutral by itself; execution objectives add the
# application and authentication-bypass context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: pbx-manager-originate-endpoint
    desc: Calls the PBX manager originate endpoint
    if:
      type: literal
      kind: string
      regex: '/pbxapi/manager/originate($|[?&#])'
