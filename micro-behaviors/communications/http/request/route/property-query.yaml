defaults:
  platforms: [windows, unix]
  for: [scripts, source, pe, elf, macho]
  crit: component
  conf: 0.94

traits:
  - id: properties-query-literal
    desc: Properties query string literal
    if:
      type: text
      regex: '\?properties([=&]|$)'

  - id: properties-assignment-query-literal
    desc: Properties assignment query string literal
    if:
      type: text
      regex: '\?properties='
