# WordPress installation, login, and built-in code editor HTTP endpoints.
# These observe endpoint targeting across script and compiled clients; intent
# comes from the exploit or webshell-deployment composites that combine them.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  mbc: "E1071"
  attack: "T1071.001"

traits:
  - id: setup-config-endpoint
    desc: Targets WordPress setup-config.php endpoint
    conf: 0.96
    if:
      type: text
      regex: '(?i)(^|/|["''])wp-admin/setup-config\.php([?#"''\s}]|$)|\bsetup-config\.php\?step=[12]\b'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case

  - id: install-endpoint
    desc: Targets WordPress install.php setup endpoint
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|/|["''])wp-admin/install\.php([?#"''\s}]|$)|\binstall\.php\?step=[12]\b'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case

  - id: login-endpoint
    desc: Targets WordPress wp-login.php endpoint
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|/|["''])wp-login\.php([?#"''\s}]|$)'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case

  - id: code-editor-endpoint
    desc: Targets WordPress file editor endpoint
    conf: 0.96
    if:
      type: text
      regex: '(?i)(^|/|["''])wp-admin/(theme|plugin)-editor\.php([?#"''\s}]|$)'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case
