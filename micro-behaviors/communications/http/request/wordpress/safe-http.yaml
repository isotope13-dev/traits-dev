defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: wp-safe-remote-post
    desc: WordPress POST with unsafe URL rejection
    if:
      type: symbol
      kind: call
      exact: wp_safe_remote_post
  # The call projection does not resolve this conditional function alias.
  - id: wp-selected-remote-get
    desc: Invokes selected WordPress HTTP getter
    if:
      type: tree-sitter
      language: php
      query: |
        ((compound_statement
          (expression_statement (assignment_expression
            left: (variable_name) @selected
            right: (conditional_expression
              condition: (function_call_expression function: (name) @check
                arguments: (arguments . (argument [(string . (string_content) @tested .) (encapsed_string . (string_content) @tested .)])))
              body: [(string . (string_content) @safe .) (encapsed_string . (string_content) @safe .)]
              alternative: [(string . (string_content) @fallback .) (encapsed_string . (string_content) @fallback .)])))
          . (foreach_statement (variable_name) @loop_value . body: (compound_statement
            . (expression_statement (assignment_expression
              right: (function_call_expression function: (variable_name) @called)))))) @get
          (#eq? @check "function_exists")
          (#eq? @tested "wp_safe_remote_get")
          (#eq? @safe "wp_safe_remote_get")
          (#eq? @fallback "wp_remote_get")
          (#not-eq? @selected @loop_value)
          (#eq? @selected @called))
