defaults:
  platforms: [unix, windows]
  for: [scripts, html]

traits:
  - id: wordpress-pages-rest-endpoint
    desc: WordPress pages REST endpoint reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)/wp-json/wp/v2/pages\b'

  - id: wordpress-color-picker-id
    desc: WordPress color-picker element id
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bid\s*=\s*(["\x27])?color-picker\b'

  - id: wordpress-reset-password-class
    desc: WordPress reset-password CSS class
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bclass\s*=\s*(["\x27])?reset-pass-submit\b'

  - id: wordpress-generate-password-button
    desc: WordPress password-generator button
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)wp-generate-pw\b.{0,80}\bcolor-option\b'

  - id: wordpress-publish-status
    desc: WordPress publish status field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bstatus\s*:\s*["\x27]publish["\x27]'
