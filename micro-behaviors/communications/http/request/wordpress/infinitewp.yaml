# InfiniteWP Client wire-protocol framing and management action parameters.
# Server-side plugin files are excluded on client-action traits via the
# InfiniteWP Client server class/constant marker so only client payloads match.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  mbc: E1071
  attack: T1071.001

traits:
  - id: iwp-json-envelope-prefix
    desc: Uses InfiniteWP _IWP_JSON_PREFIX_ marker
    conf: 0.99
    for: [scripts, source, elf, macho, pe]
    if:
      type: text
      exclude_comments: true
      substr: "_IWP_JSON_PREFIX_"

  - id: iwp-response-header-delimiter
    desc: Parses InfiniteWP IWPHEADER delimiter
    conf: 0.98
    for: [scripts, source, elf, macho, pe]
    if:
      type: text
      exclude_comments: true
      regex: '<(END)?IWPHEADER>'

  - id: iwp-add-site-action-field
    desc: Sets InfiniteWP add_site request action
    conf: 0.98
    if:
      type: text
      exclude_comments: true
      regex: '\biwp_action["'']?\s*(=>|:|,)\s*["''](re)?add_site["'']'

  - id: iwp-nossl-downgrade-parameter
    desc: Enables InfiniteWP NOSSL key-signing fallback
    conf: 0.99
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\buser_random_key_signing["'']?\s*(=>|:|,)\s*["'']?(1|true)\b'

  - id: iwp-state-changing-action-value
    desc: References state-changing InfiniteWP action
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '["''](maintain_site|install_addon|edit_plugins_themes|do_upgrade)["'']'
    unless:
      - id: well-known/app/publishing/wordpress-plugins/site-admin::iwp-client-server-class

  - id: iwp-action-envelope-key
    desc: Sets InfiniteWP iwp_action envelope key
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '["'']iwp_action["'']\s*(=>|:)'
    unless:
      - id: well-known/app/publishing/wordpress-plugins/site-admin::iwp-client-server-class
