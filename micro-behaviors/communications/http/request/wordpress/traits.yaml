# WordPress HTTP API Traits
# MBC: E1071 (Standard Application Layer Protocol)
# ATT&CK: T1071.001 (Web Service)
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  mbc: "E1071"
  attack: "T1071.001"
traits:
  - id: admin-ajax-endpoint
    desc: Targets WordPress admin AJAX endpoint
    crit: notable
    conf: 0.97
    for: [scripts, source]
    if:
      type: literal
      regex: '(?i)/wp-admin/admin-ajax\.php([?#]|$)'

  - id: wpmudev-sso-step1-action
    desc: Selects WPMU DEV SSO first-step action
    crit: notable
    conf: 0.99
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)["'']action["'']\s*(:|=>|=)\s*["'']wdpsso_step1["'']'

  - id: wpmudev-sso-step2-action
    desc: Selects WPMU DEV SSO second-step action
    crit: notable
    conf: 0.99
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)["'']action["'']\s*(:|=>|=)\s*["'']wdpsso_step2["'']'

  - id: pods-admin-action-field
    desc: Sets Pods admin AJAX action
    crit: notable
    conf: 0.99
    for: [scripts, source]
    if:
      type: text
      regex: '\baction["'']?\s*[:=]\s*["'']?pods_admin\b'

  - id: pods-save-user-method-field
    desc: Selects Pods save_user method
    crit: notable
    conf: 0.99
    for: [scripts, source]
    if:
      type: text
      regex: '\bmethod["'']?\s*[:=]\s*["'']?save_user\b'

  - id: meta-box-loader-enabled-field
    desc: Enables meta-box-loader compatibility mode
    crit: notable
    conf: 0.98
    for: [scripts, source]
    if:
      type: text
      regex: '\bmeta-box-loader["'']?\s*[:=]\s*["'']?1\b'

  - id: wordpress-user-password-field
    desc: Maps WordPress user password field
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '\buser_pass["'']?\s*[:=]'

  - id: wp-remote-post
    desc: WordPress remote POST request (wp_remote_post)
    conf: 0.95
    if:
      type: symbol
      exact: "wp_remote_post"

  - id: wp-telemetry-endpoint-post
    desc: WordPress posts to a telemetry endpoint
    conf: 0.86
    if:
      type: text
      regex: 'wp_remote_post\s*\([^;]{0,240}/api/v1/telemetry\b'

  - id: wp-remote-get
    desc: WordPress remote GET request (wp_remote_get)
    conf: 0.95
    if:
      type: symbol
      exact: "wp_remote_get"
  - id: wp-tls-verification-disabled
    desc: WordPress HTTP request disables TLS verification
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sslverify.{0,30}(false|0)'
  - id: wp-remote-request
    desc: WordPress remote HTTP request
    conf: 0.95
    if:
      type: symbol
      exact: "wp_remote_request"
  - id: wp-remote-request-site-url
    desc: WP remote request includes site URL
    conf: 0.9
    if:
      # Match the call node so a URL helper mentioned in a comment does not
      # look like data sent by the request.
      type: tree-sitter
      kind: call
      regex: '(?is)\bwp_remote_\w{3,7}\(.{0,600}\b(home_url|site_url|admin_url)\s*\('
  - id: wp-remote-request-admin-fields
    desc: WP remote request includes admin fields
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\bwp_remote_\w{3,7}\(.{0,600}\b(user_login|user_email|administrator)\b'
  - id: wp-remote-response-code
    desc: WordPress HTTP response code read
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "wp_remote_retrieve_response_code"
  - id: wp-remote-response-body
    desc: WordPress HTTP response body read
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "wp_remote_retrieve_body"
  - id: wp-fetch-feed
    desc: WordPress fetches remote feed
    conf: 0.92
    if:
      type: symbol
      exact: "fetch_feed"
  - id: wp-enqueue-script
    desc: WordPress enqueue script call
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      exact: "wp_enqueue_script"
  - id: wp-dequeue-script-call
    desc: Calls the WordPress script dequeue API
    crit: component
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: wp_dequeue_script
  - id: wp-deregister-script-call
    desc: Calls the WordPress script deregistration API
    crit: component
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: wp_deregister_script
  - id: wp-enqueue-remote-script
    desc: WordPress enqueues remote script
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'wp_enqueue_script\s*\([^;]{0,240}https?://'
    unless:
      - type: text
        regex: 'wp_enqueue_script\s*\([^;]{0,240}[A-Z0-9_]*PLUGIN_URL'
  - id: wp-enqueue-configured-script-url
    desc: WordPress enqueues configured script URL
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'wp_enqueue_script\s*\([^;]{0,240}\$[A-Za-z_][A-Za-z0-9_]*(_url|URL|Url)\b'
  - id: register-rest-route
    desc: WordPress REST route registration
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "register_rest_route"
  - id: rest-username-param-read
    desc: Reads REST username parameter
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '->get_param\s*\(\s*["''](user|username|login)["'']\s*\)'
  - id: rest-password-param-read
    desc: Reads REST password parameter
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '->get_param\s*\(\s*["''](pass|password|key|token)["'']\s*\)'
  # A `/wp-json/` or `?rest_route=/` URL is just the address of the WordPress
  # REST API; plugins call their own vendor endpoints this way.  It was filed
  # under objectives/execution/exploit/chain, where its name promised an
  # exploit marker the regex never checks; that chain now references it here.
  - id: rest-endpoint-url
    desc: References a WordPress REST API endpoint URL
    crit: notable
    conf: 0.95
    for: [scripts, html]
    if:
      type: text
      regex: '(?i)rest_route=/|/wp-json/'
  - id: rest-users-endpoint-url
    desc: References WordPress REST users endpoint
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: 'wp-json/wp/v2/users'
  - id: plugin-upload-action-endpoint
    desc: References WordPress plugin upload endpoint
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: 'action=upload-plugin'
  - id: rest-api-init-hook
    desc: WordPress rest_api_init hook
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      exact: "rest_api_init"
  - id: rest-route-get-method
    desc: WordPress REST route uses GET method
    crit: component
    conf: 0.86
    if:
      type: text
      regex: "['\"]methods['\"]\\s*=>\\s*(['\"]GET['\"]|WP_REST_Server::READABLE)"
  - id: rest-response-builder
    desc: WordPress REST response builder
    crit: component
    conf: 0.9
    if:
      type: symbol
      exact: rest_ensure_response
  - id: rest-response-credential-key
    desc: REST response includes credential key
    crit: component
    conf: 0.92
    if:
      type: text
      regex: "['\"]consumer_key['\"]\\s*=>"
  - id: rest-response-credential-secret
    desc: REST response includes credential secret
    crit: component
    conf: 0.92
    if:
      type: text
      regex: "['\"]consumer_secret['\"]\\s*=>"
  - id: rest-route-public-query-context
    desc: WordPress REST route queries public posts
    crit: component
    conf: 0.88
    if:
      type: text
      regex: "post_status['\"]?\\s*=>\\s*['\"]publish['\"]"
  - id: rest-route-public-post-types-context
    desc: WordPress REST public post types
    crit: component
    conf: 0.86
    if:
      type: text
      regex: "['\"]public['\"]\\s*=>\\s*true"
  - id: rest-route-wp-query-context
    desc: WordPress REST route uses WP_Query
    crit: component
    conf: 0.84
    if:
      type: text
      regex: "new\\s+\\\\?WP_Query"
  - id: permission-callback-true
    desc: REST permission callback allows all
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: permission_callback\s*['"]?\s*=>\s*['"]__return_true['"]
    unless:
      - id: well-known/app/finance/ovas-connector::ovas-payment-webhook-route
  - id: permission-callback-returns-true
    desc: REST permission callback returns true
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '(?is)function\s+\w*permissions?_check\w*\s*\([^)]{0,40}\)\s*\{.{0,200}?return\s+true\s*;'
  - id: permission-callback-arrow-true
    desc: Arrow REST permission callback allows all
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?is)permission_callback.{0,12}=>\s*fn\s*\([^)]{0,40}\)\s*=>\s*true'
composite_rules:
  - id: wp-removes-registered-scripts
    desc: Removes registered WordPress frontend scripts
    crit: notable
    conf: 0.97
    all:
      - id: wp-dequeue-script-call
      - id: wp-deregister-script-call

  - id: programmatic-plugin-upload-request
    desc: Client JS drives WordPress plugin upload endpoint
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: plugin-upload-action-endpoint
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1500

  - id: rest-permission-allows-all
    desc: WordPress REST permission callback allows all requests
    crit: notable
    conf: 0.93
    any:
      - id: permission-callback-true
      - id: permission-callback-returns-true
      - id: permission-callback-arrow-true

  - id: rest-response-api-credentials
    desc: REST response returns API credentials
    crit: notable
    conf: 0.94
    all:
      - id: rest-response-builder
      - id: rest-response-credential-key
      - id: rest-response-credential-secret
  - id: wp-remote-http-request
    desc: WordPress sends a remote HTTP request
    crit: notable
    conf: 0.95
    any:
      - id: wp-remote-post
      - id: wp-remote-get
      - id: wp-remote-request

  - id: public-readonly-rest-route-context
    desc: WordPress public read-only REST route context
    crit: component
    conf: 0.9
    all:
      - id: register-rest-route
      - id: rest-route-get-method
    any:
      - id: rest-route-public-query-context
      - id: rest-route-public-post-types-context
      - id: rest-route-wp-query-context
  - id: unauthenticated-rest-route
    desc: WordPress unauthenticated REST route
    crit: suspicious
    conf: 0.96
    all:
      - id: register-rest-route
      - id: rest-api-init-hook
      - id: rest-permission-allows-all
    unless:
      - id: well-known/app/publishing/wordpress-plugins::vision-rest-namespace
    downgrade:
      any:
        - id: micro-behaviors/communications/http/request/wordpress/
