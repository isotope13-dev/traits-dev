# REST paths are protocol data, independent of the language of the client.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json, text]
  crit: notable
  conf: 0.97

traits:
  - id: rest-batch-endpoint-path
    desc: References WordPress REST batch endpoint
    if:
      type: text
      regex: '/(wp-json/)?batch/v1\b'

  - id: rest-content-endpoint-path
    desc: References WordPress REST posts or widgets path
    if:
      type: text
      regex: '/wp/v2/(posts|widgets)\b'
