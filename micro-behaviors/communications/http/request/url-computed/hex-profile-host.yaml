defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: node-hex-profile-label-http-host
    desc: Hex host-user fields prefix OOB hostname
    if:
      type: tree-sitter
      query: |
        (program
          (_ (variable_declarator name: (identifier) @zone
            value: [
              (string (string_fragment) @zone_literal)
              (binary_expression right: (string (string_fragment) @zone_literal))
            ]))
          (_ (variable_declarator
            name: (identifier) @profile
            value: (object
              (pair key: (property_identifier) @hostname_key
                value: (call_expression arguments: (arguments
                  (function_expression body: (statement_block
                    (return_statement (call_expression function: (member_expression
                      property: (property_identifier) @hostname))))))))
              (pair key: (property_identifier) @user_key
                value: (call_expression arguments: (arguments
                  (function_expression body: (statement_block
                    (return_statement (member_expression
                      object: (call_expression function: (member_expression
                        property: (property_identifier) @userinfo))
                      property: (property_identifier) @username))))))))))
          (_ (variable_declarator name: (identifier) @label
            value: (call_expression arguments: (arguments
              (function_expression body: (statement_block
                (_ (variable_declarator name: (identifier) @raw
                  value: (call_expression function: (member_expression
                    object: (parenthesized_expression (binary_expression
                      left: (binary_expression left: (binary_expression
                        left: (binary_expression
                          left: (member_expression object: (identifier) @profile_host
                            property: (property_identifier) @host_field))
                        right: (member_expression object: (identifier) @profile_user
                          property: (property_identifier) @user_field)))))))))
                (return_statement (call_expression function: (member_expression
                  object: (call_expression function: (member_expression
                    object: (call_expression function: (member_expression
                      object: (call_expression function: (member_expression
                        object: (identifier) @buffer property: (property_identifier) @from)
                        arguments: (arguments (identifier) @raw_buffer))
                      property: (property_identifier) @to_string)
                      arguments: (arguments (string (string_fragment) @encoding)))
                    property: (property_identifier) @slice))
                  property: (property_identifier) @replace)))))))))
          (function_declaration name: (identifier) @sender
            parameters: (formal_parameters (identifier) @host_parameter)
            body: (statement_block (try_statement body: (statement_block
              (_ (variable_declarator value: (call_expression
                function: (member_expression property: (property_identifier) @get)
                arguments: (arguments (object
                  (pair key: (property_identifier) @host_option
                    value: (identifier) @host_argument))))))))))
          (expression_statement (call_expression function: (identifier) @sender_use
            arguments: (arguments (binary_expression
              left: (binary_expression left: (identifier) @label_use
                right: (string (string_fragment) @dot))
              right: (identifier) @zone_use))))
          (#eq? @hostname "hostname")
          (#eq? @userinfo "userInfo")
          (#eq? @username "username")
          (#eq? @profile @profile_host)
          (#eq? @profile @profile_user)
          (#eq? @hostname_key @host_field)
          (#eq? @user_key @user_field)
          (#eq? @buffer "Buffer")
          (#eq? @from "from")
          (#eq? @raw @raw_buffer)
          (#eq? @to_string "toString")
          (#eq? @encoding "hex")
          (#match? @slice "^(slice|substring)$")
          (#eq? @replace "replace")
          (#match? @get "^(get|request)$")
          (#match? @host_option "^(host|hostname)$")
          (#eq? @host_parameter @host_argument)
          (#eq? @sender @sender_use)
          (#eq? @label @label_use)
          (#eq? @zone @zone_use)
          (#match? @zone_literal "(^|\\.)(oob\\.[A-Za-z0-9.-]+|oast\\.(fun|me|pro|live|online|site))$")
          (#eq? @dot "."))
