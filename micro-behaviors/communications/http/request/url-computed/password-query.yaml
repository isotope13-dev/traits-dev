traits:
  - id: fetch-encoded-password-query
    desc: Fetch sends URL with encoded password field
    crit: notable
    for: [javascript]
    platforms: [unix, windows]
    size_max: 524288
    if:
      # Source flow may not track bindings in anonymous extension callbacks.
      # Join the const and its use in the next statement within the same block.
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @binding
              value: [(binary_expression) (template_string)] @evidence))
          . (_ [
            (call_expression function: (identifier) @fetch
              arguments: (arguments . (identifier) @used))
            (await_expression (call_expression function: (identifier) @fetch
              arguments: (arguments . (identifier) @used)))
            (sequence_expression . (call_expression
              function: (member_expression object: (call_expression
                function: (member_expression object: (call_expression
                  function: (member_expression object: (call_expression
                    function: (identifier) @fetch
                    arguments: (arguments . (identifier) @used)))))))))
          ]))
          (#eq? @fetch "fetch")
          (#eq? @binding @used)
          (#match? @evidence "^[\"'`]https?://")
          (#match? @evidence "(?i)[?&](pass(word|wd)?|pwd|flicapwd)=([\"']\\s*\\+|\\$\\{)\\s*encodeURIComponent\\("))
