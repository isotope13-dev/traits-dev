composite_rules:
- id: node-shell-uri-http-cooccurrence
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
  desc: Shell execution, URI encoding, and HTTP client co-occur
  conf: 0.99
  attack: T1041,T1059.004
  scope: file
  near_bytes: 1024
  all:
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  - id: micro-behaviors/data/encode/url::encode-uri-component-call
  any:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/client::node-http
  needs: 1
