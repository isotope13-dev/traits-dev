defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: node-request-options-object-query-path
    desc: HTTP path derives from object-key query
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(get|request)$'
      arg:
        index: 0
        from:
          field: path
          call: '^Object\.keys\.map\.join$'
          literal: '^&$'
