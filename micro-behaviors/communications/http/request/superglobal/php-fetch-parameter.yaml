traits:
- id: php-request-selected-resource-open
  desc: PHP opens a GET/POST-selected resource
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (curl_init|file_get_contents|fopen)\s*\(.{0,50}\$_(GET|POST)
  unless:
  - id: well-known/app/enterprise/egroupware/
  - id: well-known/tool/development/observability/datadog-system-tests::system-tests-path
  - id: metadata/lang/source/syntax::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: well-known/app/publishing/wordpress-plugins/security::bitfire-plugin-path
  - id: well-known/tool/packaging/composer::composer-phar-cli
  - id: well-known/lib/development/psalm::psalm-phar-tool
  - id: well-known/tool/development/editor/ghostwriter-collection::ghostwriter-collection-package
  - id: metadata/package/testing/presence/path::vuln-samples-directory-path
  platforms:
  - linux
  - macos
  - windows
  for:
  - php

