defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: php-request-fixed-token-comparison
    desc: Compares request parameter with embedded token
    # A URL/POST parameter and a literal token must be arguments of the SAME
    # comparison. No parameter name, plugin identity, or isset prelude required.
    # hash_equals compares strings; it does not itself compute a hash.
    if:
      type: tree-sitter
      language: php
      query: |
        ((function_call_expression
          function: (name) @callee
          arguments: (arguments
            . (argument [(string) (encapsed_string)] @token)
            . (argument [
              (subscript_expression (variable_name (name) @source))
              (cast_expression (subscript_expression (variable_name (name) @source)))
            ]))) @comparison
          (#eq? @callee "hash_equals")
          (#match? @token "^[\"'][A-Za-z0-9_-]{20,}[\"']$")
          (#match? @source "^_(GET|POST|REQUEST)$"))
        ((function_call_expression
          function: (name) @callee
          arguments: (arguments
            . (argument [
              (subscript_expression (variable_name (name) @source))
              (cast_expression (subscript_expression (variable_name (name) @source)))
            ])
            . (argument [(string) (encapsed_string)] @token))) @comparison
          (#eq? @callee "hash_equals")
          (#match? @token "^[\"'][A-Za-z0-9_-]{20,}[\"']$")
          (#match? @source "^_(GET|POST|REQUEST)$"))
