defaults:
  platforms: [unix, windows]
  for: [php]

traits:
- id: php-basename-server-path
  desc: Basename of PHP server script path
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: basename($_SERVER[
- id: php-server-script-path
  desc: Reads PHP request script path
  unless:
  - id: metadata/file/extension/identity::yara-extension
  if:
    type: text
    regex: \$_SERVER\s*\[\s*['"](SCRIPT_NAME|PHP_SELF)['"]\s*\]
  crit: notable
  conf: 0.85
