# A bare $_GET['p']/$_GET['q'] subscript is a request-parameter access; the
# parameter names alone establish no routing, file manager, or webshell
# behavior (search forms use ?q= the same way file managers use ?p=). The
# webshell composite that consumes this atom supplies the file-manager
# context through its scandir/upload/delete legs.
defaults:
  platforms: [linux, windows, macos]
  for: [php, html, data, text]
  crit: notable
  conf: 0.9

traits:
  - id: php-get-p-q-parameter-access
    desc: PHP GET p/q parameter-access expression
    if:
      type: text
      regex: \$_GET\s*\[\s*["'](p|q)["']\s*\]
