# PHP source quoted in Markdown guides reads named upload fields. The PHP
# superglobal atom covers .php files; this records the same access in docs.
defaults:
  platforms: [unix, windows]
  for: [markdown]
traits:
  - id: markdown-php-upload-field-access
    desc: Markdown quotes PHP upload-field access
    crit: notable
    conf: 0.95
    attack: T1105
    if:
      type: text
      regex: '\$_FILES\s*\[\s*["''][^"''\n]{1,40}["'']\s*\]'
