defaults:
  crit: notable
  for:
    - ruby
  attack: T1071.001
  mbc: C0002
  platforms:
    - unix
    - windows
traits:
  # Binding a GET response to a variable, rather than discarding it: the shape
  # that matters when a later rule asks what the program did with the body.
  # Relocated from objectives/command-and-control/channel/deaddrop/url/, where
  # a neutral HTTP mechanic carried a dead-drop label it could not support on
  # its own; the dead-drop composite there references it across directories.
  - id: ruby-http-get-assign
    desc: Net::HTTP.get response assigned to a variable
    conf: 0.8
    if:
      type: text
      regex: '[a-z_]\w*\s*=\s*Net::HTTP\.get'

  - id: net-http-post
    desc: Net::HTTP.post() method call
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        (call receiver: (scope_resolution) @receiver
          method: (identifier) @method
          (#eq? @receiver "Net::HTTP")
          (#eq? @method "post"))
  - id: net-http-write-request
    desc: Net::HTTP write request method
    conf: 0.86
    if:
      type: tree-sitter
      query: |
        (call receiver: (scope_resolution) @receiver
          method: (identifier) @method
          (#eq? @receiver "Net::HTTP")
          (#match? @method "^(post|put|request)$"))
  - id: net-http-get-dup
    desc: Net::HTTP.get() method call
    conf: 0.8
    if:
      type: tree-sitter
      query: |
        (call receiver: (scope_resolution) @receiver
          method: (identifier) @method
          (#eq? @receiver "Net::HTTP")
          (#eq? @method "get"))
  - id: net-http-new
    desc: Net::HTTP.new() instantiation
    conf: 0.7
    if:
      type: tree-sitter
      query: |
        (call receiver: (scope_resolution) @receiver
          method: (identifier) @method
          (#eq? @receiver "Net::HTTP")
          (#eq? @method "new"))
  - id: ruby-http-request-call
    desc: Ruby HTTP request call
    conf: 0.86
    if:
      type: text
      regex: '\bhttp\.request\s*\('
  - id: open-uri-http-fetch
    desc: open-uri HTTP fetch call
    conf: 0.72
    if:
      type: text
      regex: 'open\s*\(.{0,30}https?://'
