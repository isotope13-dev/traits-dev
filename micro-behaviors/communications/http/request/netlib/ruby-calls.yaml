# AST-backed Ruby Net::HTTP call observations. The call matcher does not
# establish the enclosing method, a fetched payload, or a download result.
defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  - id: ruby-net-http-get-response-call
    desc: Ruby Net::HTTP.get_response call
    crit: notable
    conf: 0.88
    attack: T1071
    if:
      type: tree-sitter
      query: |
        (call receiver: (scope_resolution) @receiver
          method: (identifier) @method
          (#eq? @receiver "Net::HTTP")
          (#eq? @method "get_response"))

  - id: ruby-net-http-method-call
    desc: Ruby Net::HTTP method call
    crit: notable
    conf: 0.85
    if:
      type: tree-sitter
      query: |
        (call receiver: (scope_resolution) @receiver
          method: (identifier) @method
          (#eq? @receiver "Net::HTTP"))
