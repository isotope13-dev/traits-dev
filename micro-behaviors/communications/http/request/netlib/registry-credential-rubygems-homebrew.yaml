# RubyGems Supply Chain Credential Theft
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
# Detects malicious patterns in gemspec and Ruby packages
# Covers rest-client hijacking style attacks
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: suspicious
composite_rules:
  - id: rubygems-credential-theft
    desc: RubyGems context and HTTP write clues
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/secret-config::gem-credentials-file
      - id: metadata/lang/source/literal/fragment/env-variable::gem-host-api-key-var
      - id: micro-behaviors/communications/http/services/registry::rubygems-api-domain
      - id: micro-behaviors/data/serialize/schema-credential::rubygems-api-key-name
    all:
      - id: micro-behaviors/communications/http/request/netlib::net-http-write-request
  # === Gemspec Trojan ===
  - id: gemspec-trojan
    desc: Ruby network write and extension clues
    crit: suspicious
    conf: 0.9
    any:
      - id: metadata/package/files/rubygems::gemspec-native-extension-declaration
      - id: micro-behaviors/os/package-manager/hook-install::extconf-shell-command
      - id: micro-behaviors/communications/http/request/netlib::open-uri-http-fetch
    all:
      - id: micro-behaviors/communications/http/request/netlib::net-http-write-request
  # Formula downloads, environment references and lifecycle commands are
  # neutral observations in their canonical metadata/micro-behavior paths.
  # Public hosting plus an install command does not establish an attack or
  # registry credential theft; require behavior-specific objectives instead.
  # === Ruby Supply Chain Attack ===
  - id: ruby-supply-chain-attack
    desc: Ruby network and package credential clues
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/request/netlib::rubygems-credential-theft
      - id: micro-behaviors/communications/http/request/netlib::gemspec-trojan
