# CLI registration clues can occur in ordinary enrollment flows.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python, whl]
composite_rules:
  - id: pip-cli-first-run-registration-beacon
    desc: CLI init POST and API-key config clues
    conf: 0.95
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/url/api-path/route::python-cli-init-api-path
      - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
      - id: micro-behaviors/communications/http/request/verb::python-post-method-keyword
      - id: micro-behaviors/data/serialize/schema-credential::api-key-field-name
      - id: micro-behaviors/data/serialize/object::json-dump
      - id: micro-behaviors/fs/path/config/app::hidden-app-config-json
    unless:
      - id: metadata/path/directory::test-directory-component
