defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

traits:
  - id: python-discord-token-json-store
    desc: Python saves token and refresh_token pair
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: '(?i)["'']token["'']\s*:\s*token.{0,400}["'']refresh_token["'']\s*:\s*refresh_token'
