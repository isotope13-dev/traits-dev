defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-credential-file-http-content
    desc: Credential file enters HTTP content argument
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^httpx\.(post|put)$'
      arg:
        from:
          field: content
          call: '^(open|(pathlib\.)?Path(\.home)?(\.joinpath)?)$'
          literal: '(^|[/\\])(\.git-credentials|\.netrc|\.pypirc|\.aws[/\\]credentials)$'
          through:
            - call: '(^|\.)(read|read_text|read_bytes|encode)$'
              receiver: true
