# The legacy payload-flow event misses renamed fs/os bindings. Bind the
# immutable fs require to the actual inline read supplying the fetch body.
# Ordinary file upload, local key reads and same-named application helpers
# cannot satisfy this relationship. Supports literal and concatenated paths.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-import-bound-ssh-key-fetch-body
    desc: Fetch sends imported fs SSH-key bytes
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator
            name: (identifier) @fs
            value: (call_expression function: (identifier) @require
              arguments: (arguments . (string (string_fragment) @module) .)))) @binding
          (expression_statement (call_expression function: (identifier) @fetch
            arguments: (arguments (_) (object
              (pair key: (property_identifier) @method value: (string (string_fragment) @verb))
                  (pair key: (property_identifier) @body value: (call_expression
                    function: (member_expression object: (identifier) @reader property: (property_identifier) @read)
                    arguments: (arguments . [
                      (string) @path
                      (binary_expression operator: "+" right: (string) @path)
                    ]))))))) @evidence)
          (#match? @binding "^const\\s")
          (#eq? @require "require") (#match? @module "^(node:)?fs$")
          (#eq? @fs @reader) (#eq? @read "readFileSync") (#eq? @fetch "fetch")
          (#eq? @method "method") (#match? @verb "^(POST|PUT|PATCH)$")
          (#eq? @body "body")
          (#match? @path "(^['\"]|/)[.]ssh/id_(rsa|dsa|ecdsa|ed25519)['\"]$"))
        ((program
          (lexical_declaration (variable_declarator
            name: (identifier) @fs
            value: (call_expression function: (identifier) @require
              arguments: (arguments . (string (string_fragment) @module) .)))) @binding
          (expression_statement (call_expression function: (identifier) @fetch
            arguments: (arguments (_) (object
              (pair key: (property_identifier) @body value: (call_expression
                    function: (member_expression object: (identifier) @reader property: (property_identifier) @read)
                    arguments: (arguments . [
                      (string) @path
                      (binary_expression operator: "+" right: (string) @path)
                    ])))
                  (pair key: (property_identifier) @method value: (string (string_fragment) @verb)))))) @evidence)
          (#match? @binding "^const\\s")
          (#eq? @require "require") (#match? @module "^(node:)?fs$")
          (#eq? @fs @reader) (#eq? @read "readFileSync") (#eq? @fetch "fetch")
          (#eq? @method "method") (#match? @verb "^(POST|PUT|PATCH)$")
          (#eq? @body "body")
          (#match? @path "(^['\"]|/)[.]ssh/id_(rsa|dsa|ecdsa|ed25519)['\"]$"))
