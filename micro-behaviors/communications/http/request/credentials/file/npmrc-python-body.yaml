defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  # The engine's credential-file event currently misses from-import requests
  # aliases and some Windows path spellings. Use the indexed call/flow facts
  # instead of duplicating the file-read and body binding with a live AST query.
  - id: python-npmrc-data-body-argument
    desc: .npmrc data supplied as request body
    if:
      type: symbol
      kind: call
      regex: '^(requests\.)?(post|put|patch)$'
      args:
        - index: 0
          kind: string
          regex: '^https?://'
        - index: 1
          from:
            field: data
            call: '^open$'
            literal: '(^|[/\\])\.npmrc$'
            through:
              - call: '^os\.path\.expanduser$'
                arguments: [0]
              - call: '\.(read|encode|hex|decode)$'
                receiver: true
              - call: '^(base64\.)?(b64encode|urlsafe_b64encode|b32encode)$'
                arguments: [0]

composite_rules:
  - id: python-npmrc-requests-body
    desc: Python requests body includes .npmrc data
    all:
      - id: python-npmrc-data-body-argument
      - id: metadata/import/python/requests
