defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
- id: npmrc-path-near-fetch
  desc: JS references an npm credentials file near fetch
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  unless:
  - id: well-known/tool/detection/
  - id: well-known/tool/development/aube::aube-package-test-fixture
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
  all:
  - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  near_bytes: 300
