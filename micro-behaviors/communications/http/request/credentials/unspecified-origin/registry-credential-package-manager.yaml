defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
composite_rules:
- id: js-creds-to-axios
  desc: JS credential path with axios
  crit: suspicious
  conf: 0.9
  unless:
  - id: micro-behaviors/data/control-flow/dispatch/named::js-credential-path-guard
  all:
  - id: micro-behaviors/fs/path/developer-credential::package-manager-credential-path
  - id: micro-behaviors/communications/http/lib/axios::request-axios
  any:
  - id: metadata/import/builtin::require-fs
  - id: micro-behaviors/fs/read/file/content/unspecified::read-node
  - id: micro-behaviors/fs/read/file/content/unspecified::read-text-utf8
  - id: micro-behaviors/fs/read/file/content/unspecified::file-content-read-operation
