defaults:
  for: [xml]
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.97
traits:
  - id: msbuild-stdin-token-upload-1
    desc: MSBuild command posts token-named property
    if:
      type: value
      path: Project.Target.Exec.@Command
      regex: '^curl .*--data-binary @-.*https?://.*<<.*\$\(\w*(TOKEN|SECRET|PASSWORD)\w*\)'
  - id: msbuild-stdin-token-upload-2
    desc: MSBuild command posts token-named property
    if:
      type: value
      path: Project.Target[*].Exec.@Command
      regex: '^curl .*--data-binary @-.*https?://.*<<.*\$\(\w*(TOKEN|SECRET|PASSWORD)\w*\)'
  - id: msbuild-stdin-token-upload-3
    desc: MSBuild command posts token-named property
