defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: encoded-api-key-in-url-variable
    desc: URL variable includes encoded API key query
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'const\s+url\s*=\s*`https?://[^`\n]{0,180}[?&]key=\$\{encodeURIComponent\(apiKey\)\}'
  - id: fetch-url-variable
    desc: Fetch call uses url variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bfetch\(\s*url\s*[,)]'

composite_rules:
  - id: fetch-url-with-encoded-api-key
    desc: API key URL and fetch(url) nearby
    crit: suspicious
    conf: 0.95
    near_lines: 3
    all:
      - id: encoded-api-key-in-url-variable
      - id: fetch-url-variable
