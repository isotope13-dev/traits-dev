defaults:
  for: [tar, zip]
  platforms: [unix, windows]
  crit: notable
  conf: 0.94

traits:
  - id: go-package-credential-file-body
    desc: Go credential files flow to HTTP bodies
    if:
      type: value
      path: go_context.packages[*].behaviors[*]
      # Generic `secret-http-body` currently also covers API tokens assigned
      # to Authorization headers across helper boundaries. Credential-file
      # flows retain the precision needed by the hostile upload composite.
      regex: '^runtime-(credential-file|cargo-credential)-http-body$'
  - id: go-package-secret-http-flow
    desc: Go secret-derived HTTP request flow
    if:
      type: value
      path: go_context.packages[*].behaviors[*]
      exact: runtime-secret-http-body
  - id: go-package-environment-body
    desc: Go helpers upload environment collection
    crit: suspicious
    if:
      type: value
      path: go_context.packages[*].behaviors[*]
      exact: runtime-environment-http-body
