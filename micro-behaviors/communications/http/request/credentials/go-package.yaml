defaults:
  for: [tar, zip]
  platforms: [unix, windows]
  crit: notable
  conf: 0.94

traits:
  - id: go-package-secret-body
    desc: Go helpers send secrets in HTTP bodies
    if:
      type: value
      path: go_context.packages[*].behaviors[*]
      regex: '^runtime-(secret|credential-file|cargo-credential)-http-body$'
  - id: go-package-environment-body
    desc: Go helpers upload environment collection
    crit: suspicious
    if:
      type: value
      path: go_context.packages[*].behaviors[*]
      exact: runtime-environment-http-body
