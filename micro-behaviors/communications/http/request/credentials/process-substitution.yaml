defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.85

traits:
  # Stop at the substitution boundary: uploader arguments after ')' are
  # arguments to the shell, not curl. Secret names do not prove theft.
  - id: curl-process-substitution-secret-argument
    desc: curl substitution uses secret-named variable
    if:
      type: text
      regex: '\b(ba)?sh\s+<\(curl\b[^)\r\n;|]{0,200}\$[A-Z_]*(TOKEN|KEY|SECRET)[A-Z_]*'
  - id: curl-process-substitution-credential-argument
    desc: curl substitution uses credential-named variable
    if:
      type: text
      regex: '\b(ba)?sh\s+<\(curl\b[^)\r\n;|]{0,200}\$[A-Z_]*(PASS|CRED|AUTH|PAT)[A-Z_]*'
