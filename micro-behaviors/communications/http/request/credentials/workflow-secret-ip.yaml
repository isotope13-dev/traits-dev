defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.98
traits:
  - id: workflow-secret-curl-public-ip
    desc: Curl line references secret and public-IP URL
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,80}secrets\.[^\n]{0,200}https?://[0-9.]+'
      is: external_ip
