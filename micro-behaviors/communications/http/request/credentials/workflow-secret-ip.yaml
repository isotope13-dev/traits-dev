defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.98
traits:
  - id: workflow-secret-curl-public-ip
    desc: Curl line references secret and public-IP URL
    # The gap after `secrets.` is wide (512): a single curl can concatenate a
    # whole catalog of secrets into one `-d` body before the destination URL,
    # as the GhostAction `github_actions_security.yml` payload does. A 200-char
    # window silently missed those multi-secret dumps.
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,80}secrets\.[^\n]{0,512}https?://[0-9.]+'
      is: external_ip
