defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
composite_rules:
  - id: vault-token-read-with-file-upload
    desc: Vault token read beside file upload
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/read/file/target::vault-token-file-read
      - id: micro-behaviors/communications/http/request/credentials::file-http-body-flow

  - id: credential-file-upload-evidence
    desc: Credential body flow or Vault read with file upload
    crit: notable
    conf: 0.9
    for: [scripts, source]
    any:
      - id: credential-file-http-body-flow
      - id: vault-token-read-with-file-upload
