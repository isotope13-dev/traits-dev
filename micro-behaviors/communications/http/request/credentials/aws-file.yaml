defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-aws-file-http-data
    desc: AWS credential file enters HTTP data
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^((requests|httpx)\.(post|put)|(urllib\.request\.)?Request)$'
      arg:
        from:
          field: data
          call: '^open$'
          literal: '(^|[/\\])\.aws[/\\]credentials$'
          through:
            - call: '(^|\.)read$'
              receiver: true
            - call: '(^|\.)encode$'
              receiver: true
            - call: '^os\.path\.expanduser$'
              arguments: [0]
