defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: shell-env-stdin-curl-upload
    desc: Pipes process environment into curl stdin body
    if:
      type: tree-sitter
      query: |
        ((pipeline
           . (command name: (command_name (word) @env) !argument !redirect)
           . (command name: (command_name (word) @curl) !redirect) @request .)
         (#match? @env "^(env|printenv)$")
         (#eq? @curl "curl")
         (#match? @request "@-")
         (#match? @request "^curl(?:(?:\\\\\\r?\\n|[ \\t\\r\\n])+(?:-[fsSLsv]+|-XPOST|--request=POST|(?:-X|--request)(?:\\\\\\r?\\n|[ \\t\\r\\n])+POST))*(?:\\\\\\r?\\n|[ \\t\\r\\n])+(?:-d|--data(?:-binary)?)(?:\\\\\\r?\\n|[ \\t\\r\\n]+)['\"]?@-['\"]?(?:\\\\\\r?\\n|[ \\t\\r\\n])+https?://[^\\s'\"]+$"))
    unless:
      - id: metadata/file/function::shell-env-function-name-symbol
      - id: micro-behaviors/data/source/function/names::shell-curl-function-definition
      - id: metadata/file/function::shell-printenv-function-name-symbol
