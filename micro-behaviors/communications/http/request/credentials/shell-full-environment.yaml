defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: shell-env-stdin-curl-upload
    desc: Pipes process environment into curl stdin body
    if:
      type: tree-sitter
      query: |
        ((pipeline
           . (command name: (command_name (word) @env) !argument !redirect)
           . (command name: (command_name (word) @curl) !redirect
               . argument: (word)* @switches
               . ((word) @method_flag . (word) @method)?
               . argument: (word)* @switches
               . argument: (word) @data
               . argument: [(word) (raw_string) (string)] @stdin
               . argument: [(word) (raw_string) (string)] @url .) .) @upload
         (#match? @env "^(env|printenv)$")
         (#eq? @curl "curl")
         (#match? @switches "^(-[fsSLsv]+|-XPOST|--request=POST)$")
         (#match? @method_flag "^(-X|--request)$")
         (#eq? @method "POST")
         (#match? @data "^(-d|--data(-binary)?)$")
         (#match? @stdin "^['\"]?@-['\"]?$"))
    unless:
      - id: metadata/file/function::shell-env-function-name-symbol
      - id: micro-behaviors/data/source/function/names::shell-curl-function-definition
      - id: metadata/file/function::shell-printenv-function-name-symbol
