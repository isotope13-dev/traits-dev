defaults:
  platforms: [unix, windows]
  for: [github-actions]
traits:
- id: secrets-in-curl
  desc: Actions secret sent in unquoted curl data
  crit: notable
  conf: 0.95
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '\bcurl\b.{0,120}(-d|--data\S*)[ \t]*=?[ \t]*[^\s''"]*\$\{\{\s*secrets\.'
  unless:
  - type: text
    substr: "scan.coverity.com/"
  - type: text
    substr: "tone.openanolis.cn"
  - type: text
    substr: "DEPLOY_HOOK"
  - id: micro-behaviors/communications/http/auth::workflow-secret-bearer-auth
  - type: text
    substr: 'curl -d "coq:coq:${{ secrets.'
  # A secret may be the destination webhook URL after POST data
  # (quoted body or stdin `-d @-`), not the stolen payload.
  - type: text
    regex: '(-d|--data\S*)\s+(@-|[''\"][^\n]{1,200}[''\"])\s+[^\n]{0,80}\$\{\{\s*secrets\.[^}]+\}\}'
- id: secrets-in-http-body
  desc: Actions secret sent in quoted curl data
  crit: notable
  conf: 0.95
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '\bcurl\b.{0,80}(-d|--data\S*)\s*=?\s*[''"][^\n]{0,100}\$\{\{\s*secrets\.'
  unless:
  - type: text
    substr: 'curl -d "coq:coq:${{ secrets.'
  - id: well-known/lib/native/hpc
  - id: micro-behaviors/communications/http/auth::workflow-secret-bearer-auth
  - type: text
    substr: scan.coverity.com
  - type: text
    substr: tone.openanolis.cn
  - type: text
    regex: '(-d|--data\S*)\s+(@-|[''\"][^\n]{1,200}[''\"])\s+[^\n]{0,80}\$\{\{\s*secrets\.[^}]+\}\}'
