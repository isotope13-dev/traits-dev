defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: curl-ci-token-body-command
    desc: curl request body references CI token
    crit: notable
    conf: 0.95
    for: [text, scripts, source]
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,80}(-d|--data(-binary)?)\s+["'']?\$\{?CI_\w*TOKEN'
  # GitLab's job-token header. Its name is also the one a request uses to
  # call GitLab's own API, so this is a review item, not a verdict on its own.
  - id: js-job-token-header-name
    desc: References GitLab JOB-TOKEN header name
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: JOB-TOKEN["']
