defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.98
traits:
  - id: workflow-secret-curl-public-ip
    desc: Curl line references secret and public-IP URL
    # The gap after `secrets.` is wide (512): a single curl can concatenate a
    # whole catalog of secrets into one `-d` body before the destination URL,
    # as the GhostAction `github_actions_security.yml` payload does. A 200-char
    # window silently missed those multi-secret dumps.
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?m)^\s*curl\b[^\n]{0,80}secrets\.[^\n]{0,512}https?://[0-9.]+'
      is: external_ip

  # Covers the indirect form: `${{ toJSON(secrets) }}` bound to an env var
  # upstream, then that secret-named shell variable curled to a bare IP —
  # the shape GhostAction/wfx workflows use instead of a literal secrets.NAME.
  - id: workflow-secret-env-var-curl-public-ip
    desc: Curl sends secret variable to public IP
    crit: notable
    conf: 0.93
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?mi)^\s*curl\b.{0,80}\$\{?\w*(?:secret|token)\w*.{0,200}https?://[0-9.]+'
      is: external_ip
