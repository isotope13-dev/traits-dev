defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: fetch-body-bound-ci-token
    desc: Bound CI token enters fetch JSON body
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        (statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @source
            value: (member_expression
              object: (member_expression object: (identifier) @process
                property: (property_identifier) @env)
              property: (property_identifier) @credential)))
          (_)*
          (expression_statement (await_expression
            (call_expression function: (identifier) @fetch
              arguments: (arguments (_) (object
                (pair key: (property_identifier) @body
                  value: (call_expression function: (member_expression
                    object: (identifier) @json property: (property_identifier) @stringify)
                    arguments: (arguments (object
                      (shorthand_property_identifier) @sent)))))))))
          (#eq? @process "process") (#eq? @env "env")
          (#match? @credential "^(ACTIONS_ID_TOKEN_REQUEST_TOKEN|NPM_TOKEN|GITHUB_TOKEN)$")
          (#eq? @fetch "fetch") (#eq? @body "body")
          (#eq? @json "JSON") (#eq? @stringify "stringify")
          (#eq? @source @sent))
