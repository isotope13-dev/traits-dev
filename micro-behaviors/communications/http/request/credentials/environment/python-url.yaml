# Environment credentials bound into a Python HTTP request URL, excluding
# credentials passed only in request headers or HMAC-derived signatures.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96

traits:
  - id: python-signing-secret-getenv-url-pos
    desc: Signing secret getenv enters HTTP URL
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(get|post|put)$'
      arg:
        index: 0
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '^(AWS_SECRET_ACCESS_KEY|([A-Z0-9]+_)*PRIVATE_KEY)$'
          through: &url_pass
            - call: '^\.format$'
              arguments: [0, 1, 2, 3]
            - call: '(^|\.)quote(_plus)?$'
              arguments: [0]
            - call: '(^|\.)Request$'
              arguments: [0]

  - id: python-signing-secret-getenv-urlopen
    desc: Signing secret getenv enters urlopen URL
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?urlopen$'
      arg:
        index: 0
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '^(AWS_SECRET_ACCESS_KEY|([A-Z0-9]+_)*PRIVATE_KEY)$'
          through: *url_pass

  - id: python-signing-secret-getenv-request-method
    desc: Signing secret getenv enters request URL
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.request$'
      arg:
        index: 1
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '^(AWS_SECRET_ACCESS_KEY|([A-Z0-9]+_)*PRIVATE_KEY)$'
          through: *url_pass

  - id: python-signing-secret-getenv-url-kwarg
    desc: Signing secret getenv enters url kwarg
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(get|post|put)$'
      arg:
        from:
          field: url
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '^(AWS_SECRET_ACCESS_KEY|([A-Z0-9]+_)*PRIVATE_KEY)$'
          through: *url_pass

  - id: python-signing-secret-environ-subscript
    desc: Python indexes signing secret in environ
    if:
      type: tree-sitter
      language: python
      query: |
        ([
          (subscript
            value: (attribute
              object: (identifier) @mod
              attribute: (identifier) @env)
            subscript: (string (string_content) @key))
          (subscript
            value: (identifier) @env
            subscript: (string (string_content) @key))
        ]
        (#any-of? @env "environ")
        (#match? @key "^(AWS_SECRET_ACCESS_KEY|([A-Z0-9]+_)*PRIVATE_KEY)$"))

  - id: python-signing-secret-key-in-url-pos
    desc: Signing secret key name reaches HTTP URL
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(get|post|put)$'
      arg:
        index: 0
        from:
          value: '^(AWS_SECRET_ACCESS_KEY|([A-Z0-9]+_)*PRIVATE_KEY)$'
          through: *url_pass

  - id: python-signing-secret-key-in-urlopen
    desc: Signing secret key name reaches urlopen
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?urlopen$'
      arg:
        index: 0
        from:
          value: '^(AWS_SECRET_ACCESS_KEY|([A-Z0-9]+_)*PRIVATE_KEY)$'
          through: *url_pass

  - id: python-auth-cred-getenv-url-pos
    desc: Credential getenv enters Python HTTP URL
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(get|post|put)$'
      arg:
        index: 0
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '(?i)^([A-Z0-9]+_)*(TOKEN|PASSWORD|SECRET|API_KEY)$'
          through: *url_pass

  - id: python-auth-cred-getenv-urlopen
    desc: Credential getenv enters Python urlopen
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?urlopen$'
      arg:
        index: 0
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '(?i)^([A-Z0-9]+_)*(TOKEN|PASSWORD|SECRET|API_KEY)$'
          through: *url_pass

  - id: python-auth-cred-getenv-url-kwarg
    desc: Credential getenv enters Python url kwarg
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(get|post|put)$'
      arg:
        from:
          field: url
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '(?i)^([A-Z0-9]+_)*(TOKEN|PASSWORD|SECRET|API_KEY)$'
          through: *url_pass

  - id: python-auth-cred-environ-subscript
    desc: Python indexes credential key in environ
    conf: 0.94
    if:
      type: tree-sitter
      language: python
      query: |
        ([
          (subscript
            value: (attribute
              object: (identifier) @mod
              attribute: (identifier) @env)
            subscript: (string (string_content) @key))
          (subscript
            value: (identifier) @env
            subscript: (string (string_content) @key))
        ]
        (#any-of? @env "environ")
        (#match? @key "^(?i)([A-Z0-9]+_)*(TOKEN|PASSWORD|SECRET|API_KEY)$"))

  - id: python-auth-cred-key-in-url-pos
    desc: Credential key name reaches HTTP URL
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(get|post|put)$'
      arg:
        index: 0
        from:
          value: '(?i)^([A-Z0-9]+_)*(TOKEN|PASSWORD|SECRET|API_KEY)$'
          through: *url_pass

  - id: python-auth-cred-key-in-urlopen
    desc: Credential key name reaches urlopen URL
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?urlopen$'
      arg:
        index: 0
        from:
          value: '(?i)^([A-Z0-9]+_)*(TOKEN|PASSWORD|SECRET|API_KEY)$'
          through: *url_pass

composite_rules:
  - id: python-signing-secret-subscript-in-url
    desc: Signing secret environ index enters URL
    all:
      - id: python-signing-secret-environ-subscript
    any:
      - id: python-signing-secret-key-in-url-pos
      - id: python-signing-secret-key-in-urlopen

  - id: python-signing-secret-env-in-url
    desc: Raw signing secret env enters HTTP URL
    crit: component
    conf: 1.0
    any:
      - id: python-signing-secret-getenv-url-pos
      - id: python-signing-secret-getenv-urlopen
      - id: python-signing-secret-getenv-request-method
      - id: python-signing-secret-getenv-url-kwarg
      - id: python-signing-secret-subscript-in-url

  - id: python-auth-cred-subscript-in-url
    desc: Credential environ index enters HTTP URL
    conf: 0.94
    all:
      - id: python-auth-cred-environ-subscript
    any:
      - id: python-auth-cred-key-in-url-pos
      - id: python-auth-cred-key-in-urlopen

  - id: python-auth-credential-env-in-url
    desc: Auth credential env enters Python URL
    crit: component
    conf: 1.0
    any:
      - id: python-auth-cred-getenv-url-pos
      - id: python-auth-cred-getenv-urlopen
      - id: python-auth-cred-getenv-url-kwarg
      - id: python-auth-cred-subscript-in-url

  - id: python-credential-env-in-url
    desc: Credential env value enters Python URL
    conf: 0.96
    all:
      - id: micro-behaviors/communications/url/scheme::http-url-literal
    any:
      - id: python-signing-secret-env-in-url
      - id: python-auth-credential-env-in-url
