# curl -d "$(env | base64)": the request body is the encoded environment,
# so every variable leaves the host in one POST.
defaults:
  platforms: [unix]
  for: [scripts]
  crit: notable
  conf: 0.95
  attack: T1552.001
traits:
  - id: curl-body-encoded-environment
    desc: curl body is the encoded environment
    if:
      type: text
      regex: 'curl\s[^\r\n]{0,200}\s(-d|--data(-\w+)?)[\s=]*["'']?\$\(\s*(print)?env\s*\|\s*base'
