defaults:
  for: [javascript]
  platforms: [unix]
  crit: notable

traits:
  - id: execfile-env-upload-in-file-guard
    desc: File guard encloses environment-upload argv
    # Source structure is needed: a file check elsewhere does not gate a send.
    # The existing argv rule validates the complete upload command and binding.
    if:
      type: tree-sitter
      language: javascript
      query: |
        (if_statement
          condition: (parenthesized_expression
            (call_expression
              function: (member_expression
                object: (identifier) @fs property: (property_identifier) @check)))
          consequence: (statement_block
            (expression_statement
              (call_expression function: (identifier) @launch
                arguments: (arguments
                  . (string (string_fragment) @shell)
                  . (array
                    . (string (string_fragment) @mode)
                    . [
                      (string (string_fragment) @body)
                      (binary_expression
                        left: (string (string_fragment) @body)
                        operator: "+"
                        right: (string))
                    ] .))) @evidence))
          (#eq? @fs "fs") (#eq? @check "existsSync")
          (#eq? @launch "execFile")
          (#match? @shell "^(/bin/)?(sh|bash|zsh)$")
          (#eq? @mode "-c")
          (#match? @body "^(env|printenv)\\s*\\|\\s*grep\\s+-[iE]+\\s+'[A-Za-z_|]+'\\s*\\|\\s*curl\\s+")
          (#match? @body "(?i)'[A-Za-z_|]*(TOKEN|SECRET|PASSWORD|API_KEY)[A-Za-z_|]*'")
          (#match? @body "(-d|--data(-binary)?)\\s+@-\\s+"))
