defaults:
  platforms: [linux, macos]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: shell-secret-env-curl-body
    desc: Curl body expands secret-named environment var
    # Adjacency ties the expansion to the body argument, not a later header.
    if:
      type: tree-sitter
      language: shell
      query: |
        (command
          name: (command_name (word) @client)
          argument: (word) @flag
          . argument: [(string) (concatenation) (simple_expansion) (expansion)] @body
          (#eq? @client "curl")
          (#match? @flag "^(-d|--data(-binary|-raw|-urlencode)?)$")
          (#match? @body "\\$\\{?\\w*(TOKEN|KEY|PASS|SECRET)\\w*\\b")) @evidence
        (command
          name: (command_name (word) @client)
          argument: (concatenation (word) @flag) @body
          (#eq? @client "curl")
          (#match? @flag "^(-d|--data(-binary|-raw|-urlencode)?=)")
          (#match? @body "\\$\\{?\\w*(TOKEN|KEY|PASS|SECRET)\\w*\\b")) @evidence
  - id: shell-sensitive-tar-curl-pipeline
    desc: Uploads archive of developer credential files
    if:
      type: tree-sitter
      language: shell
      query: |
        (pipeline
          (command name: (command_name (word) @producer)) @bundle
          (command name: (command_name (word) @client)) @upload
          (#eq? @producer "tar")
          (#eq? @client "curl")
          (#match? @bundle "czf\\s+-")
          (#match? @bundle "(\\.aws/credentials|\\.npmrc|\\.pypirc|\\.ssh/id_rsa)")
          (#match? @upload "--data-binary\\s+@-"))
