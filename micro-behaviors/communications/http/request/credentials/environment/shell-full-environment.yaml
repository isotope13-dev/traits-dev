defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: shell-env-stdin-curl-upload
    desc: Pipes process environment into curl stdin body
    if:
      type: tree-sitter
      query: |
        ((pipeline
           . (command name: (command_name (word) @env) !argument !redirect)
           (command)*
           . (command name: (command_name (word) @curl) !redirect) @request .) @pipe
         (#match? @env "^(env|printenv)$")
         (#eq? @curl "curl")
         (#match? @pipe "^(env|printenv)[ \\t]*\\|[ \\t]*(?:(?:sort|jq[ \\t]+(?:-R|--raw-input|-s|--slurp)[ \\t]+['\"]?\\.['\"]?)[ \\t]*\\|[ \\t]*){0,3}curl\\b")
         (#match? @request "(?:^|[ \\t])(?:-d|--data(?:-binary)?)[ \\t]+['\"]?@-['\"]?(?:$|[ \\t])")
         (#match? @request "https?://")
         (#not-match? @request "(?:^|[ \\t])(?:-o|--output)[ \\t]+-d[ \\t]+@-"))
    unless:
      - id: metadata/lang/source/naming/function/command::shell-env-function-name-symbol
      - id: metadata/lang/source/naming/function/command::shell-curl-function-definition
      - id: metadata/lang/source/naming/function/command::shell-printenv-function-name-symbol
