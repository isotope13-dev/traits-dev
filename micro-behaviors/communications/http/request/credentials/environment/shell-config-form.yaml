defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-env-config-result-curl-form
    desc: Env and config results enter curl form
    conf: 0.99
    unless:
      - id: metadata/file/function::shell-printenv-function-name-symbol
      - id: metadata/file/function::shell-grep-function-name-symbol
      - id: metadata/lang/source/naming/action/function-name::shell-curl-function-definition
    if:
      type: tree-sitter
      language: shell
      query: |
        ((program
          (variable_assignment name: (variable_name) @result
            value: (command_substitution
              (for_statement body: (do_group
                (command name: (command_name) @env)))
              (redirected_statement body: (command
                name: (command_name) @grep
                argument: (word) @flags
                argument: (raw_string) @selection
                argument: (word) @config))) @scan)
          . (redirected_statement body: (command
            name: (command_name) @client
            argument: (word) @option
            . argument: (string (simple_expansion (variable_name) @sent))) @upload))
         (#eq? @client "curl")
         (#eq? @option "--data-urlencode")
         (#eq? @result @sent)
         (#eq? @env "printenv")
         (#eq? @grep "grep")
         (#match? @flags "^-[A-Za-z]*r[A-Za-z]*o[A-Za-z]*$")
         (#match? @selection "(sk-|xox)")
         (#match? @config "^/(root|home)/[^\\n]{0,80}\\.config$")
         (#match? @upload "https?://"))
