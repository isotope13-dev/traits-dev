# Provenance includes keys as well as values; this does not prove theft.
defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-environ-request-body
    desc: Environment-derived HTTP request body
    crit: notable
    conf: 0.98
    attack: T1041
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      args:
        - index: 0
          from:
            value: "^https?://"
      arg:
        from:
          field: data
          call: '^os\.environ\.items$'
          through:
            - call: '^json\.dumps$'
              arguments: [0]
            - call: '(^|\.)encode$'
              receiver: true
            - call: '^zlib\.compress$'
              arguments: [0]
            - call: '^base64\.(b64encode|urlsafe_b64encode)$'
              arguments: [0]
