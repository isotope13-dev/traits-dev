defaults:
  platforms: [unix, windows]
  for: [python, go]
  crit: notable
  conf: 0.97
traits:
- id: python-secret-env-json-body
  desc: Environment secret enters Python HTTP body
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '^(requests|httpx)\.(post|put)$'
    arg:
      from:
        field: json
        call: '^os\.(getenv|environ\.get)$'
        literal: '(?i)(SECRET|TOKEN|PASSWORD|ACCESS_KEY)'
- id: go-secret-env-reader-body
  desc: Environment secret enters Go HTTP body
  for: [go]
  if:
    type: symbol
    kind: call
    exact: http.Post
    arg:
      index: 2
      from:
        call: '^os\.Getenv$'
        literal: '(?i)(SECRET|TOKEN|PASSWORD|ACCESS_KEY)'
        through:
        - call: '^bytes\.NewReader$'
          arguments: [0]
        - call: '^\[\]byte$'
          arguments: [0]
