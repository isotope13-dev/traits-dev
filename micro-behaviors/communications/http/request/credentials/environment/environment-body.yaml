defaults:
  platforms: [unix, windows]
  for: [python, go]
  crit: notable
  conf: 0.97
traits:
- id: python-secret-env-form-body
  desc: Environment secret enters Python form body
  for: [python]
  # Flow facts represent os.environ[key] as a merge of the member and key;
  # the syntax relationship binds the credential key to this body value.
  if:
    type: tree-sitter
    language: python
    query: |
      ((call
        function: (attribute object: (identifier) @client attribute: (identifier) @method)
        arguments: (argument_list
          (keyword_argument name: (identifier) @field
            value: (dictionary (pair value: (subscript
              value: (attribute object: (identifier) @os attribute: (identifier) @env)
              subscript: (string (string_content) @key))))))) @evidence
        (#match? @client "^(requests|httpx)$")
        (#match? @method "^(post|put)$")
        (#eq? @field "data")
        (#eq? @os "os") (#eq? @env "environ")
        (#match? @key "^[_A-Z]{0,60}(API_KEY|SECRET|TOKEN|PASSWORD)$"))
- id: python-secret-env-json-body
  desc: Environment secret enters Python HTTP body
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '^(requests|httpx)\.(post|put)$'
    arg:
      from:
        field: json
        call: '^os\.(getenv|environ\.get)$'
        literal: '(?i)(SECRET|TOKEN|PASSWORD|ACCESS_KEY)'
- id: go-secret-env-reader-body
  desc: Environment secret enters Go HTTP body
  for: [go]
  if:
    type: symbol
    kind: call
    exact: http.Post
    arg:
      index: 2
      from:
        call: '^os\.Getenv$'
        literal: '(?i)(SECRET|TOKEN|PASSWORD|ACCESS_KEY)'
        through:
        - call: '^bytes\.NewReader$'
          arguments: [0]
        - call: '^\[\]byte$'
          arguments: [0]
