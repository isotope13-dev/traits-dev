# Complete stdout relationship. Only known option shapes are accepted so a
# header argument cannot masquerade as -d. Host selection is syntactic, not DNS.
# An optional argument-free base64 stage encodes the same stream. Decoders,
# file inputs, redirects and arbitrary intermediary commands are not modeled.
defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: shell-filtered-env-stdin-http-upload
    desc: Posts filtered environment to HTTP domain
    unless:
      - {type: symbol, kind: function, exact: env}
      - {type: symbol, kind: function, exact: printenv}
      - {type: symbol, kind: function, exact: grep}
      - {type: symbol, kind: function, exact: curl}
      - {type: symbol, kind: function, exact: base64}
    if:
      type: tree-sitter
      language: shell
      # A named child beneath a wildcard root makes the current tree-sitter
      # optimizer skip the root's !redirect check. Keep the child wildcard,
      # requiring literal pipe tokens to establish its pipeline structure.
      query: |
        (_ !redirect [
          (_
            . (command name: (command_name (word) @env) !argument !redirect)
            . "|"
            . (command name: (command_name (word) @grep) !redirect
                . argument: (word) @grep_option
                . argument: [(raw_string) (string . (string_content) .)] @selection .)
            . ("|" . (command name: (command_name (word) @encoder)
                !argument !redirect))?
            . "|"
            . (command name: (command_name (word) @curl) !redirect
                . argument: (word)* @switches
                . ((word) @timeout . (number) @seconds)?
                . argument: (word) @data
                . argument: [(word) (raw_string) (string . (string_content) .)] @stdin
                . argument: [(word) (raw_string) (string . (string_content) .)] @url .) .)
          (_
            . (compound_statement
                (pipeline
                  . (command name: (command_name (word) @env) !argument !redirect)
                  . (command name: (command_name (word) @grep) !redirect
                      . argument: (word) @grep_option
                      . argument: [(raw_string) (string . (string_content) .)] @selection .)))
            . ("|" . (command name: (command_name (word) @encoder)
                !argument !redirect))?
            . "|"
            . (command name: (command_name (word) @curl) !redirect
                . argument: (word)* @switches
                . ((word) @timeout . (number) @seconds)?
                . argument: (word) @data
                . argument: [(word) (raw_string) (string . (string_content) .)] @stdin
                . argument: [(word) (raw_string) (string . (string_content) .)] @url .) .)
        ] @upload
          (#match? @env "^(env|printenv)$")
          (#eq? @grep "grep")
          (#match? @grep_option "^(-E|-iE|-Ei)$")
          (#eq? @curl "curl")
          (#eq? @encoder "base64")
          (#match? @switches "^-[fsSLsv]+$")
          (#match? @timeout "^(-m|--max-time)$")
          (#match? @data "^(-d|--data(-binary)?)$")
          (#match? @stdin "^['\"]?@-['\"]?$")
          (#match? @url "^['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
          (#not-match? @url "(?i)\\.localhost[:/]")
          (#not-match? @upload "\\$\\{\\{"))
