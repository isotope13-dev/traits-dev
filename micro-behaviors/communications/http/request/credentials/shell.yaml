defaults:
  for:
  - shell
  platforms:
  - unix
  crit: notable
  conf: 0.96
traits:
- id: shell-filtered-env-stdin-http-upload
  desc: Posts filtered environment to HTTP domain
  unless:
  - id: metadata/file/function::shell-env-function-name-symbol
  - type: symbol
    kind: function
    exact: printenv
  - id: metadata/file/function::shell-grep-function-name-symbol
  - id: micro-behaviors/data/source/function/names::shell-curl-function-definition
  - type: symbol
    kind: function
    exact: base64
  - type: tree-sitter
    language: shell
    query: "((command\n  name: (command_name) @alias\n  argument: [\n    (concatenation\
      \ . (word) @binding)\n    (word) @binding\n    (raw_string) @binding\n    (string\
      \ . (string_content) @binding)\n  ])\n  (#match? @alias \"^[\\\"']?alias[\\\"\
      ']?$\")\n  (#match? @binding \"^[\\\"']?(env|printenv|grep|curl|base64)=\"))"
  if:
    type: tree-sitter
    language: shell
    query: "(_ !redirect [\n  (_\n    . (command name: (command_name (word) @env)\
      \ !argument !redirect)\n    . \"|\"\n    . (command name: (command_name (word)\
      \ @grep) !redirect\n        . argument: (word) @grep_option\n        . argument:\
      \ [(raw_string) (string . (string_content) .)] @selection .)\n    . (\"|\" .\
      \ (command name: (command_name (word) @encoder)\n        !argument !redirect))?\n\
      \    . \"|\"\n    . (command name: (command_name (word) @curl) !redirect\n \
      \       . argument: (word)* @switches\n        . ((word) @timeout . (number)\
      \ @seconds)?\n        . argument: (word)* @switches\n        . argument: (word)\
      \ @data\n        . argument: [(word) (raw_string) (string . (string_content)\
      \ .)] @stdin\n        . argument: [(word) (raw_string) (string . (string_content)\
      \ .)] @url .) .)\n  (_\n    . (compound_statement\n        (pipeline\n     \
      \     . (command name: (command_name (word) @env) !argument !redirect)\n   \
      \       . (command name: (command_name (word) @grep) !redirect\n           \
      \   . argument: (word) @grep_option\n              . argument: [(raw_string)\
      \ (string . (string_content) .)] @selection .)))\n    . (\"|\" . (command name:\
      \ (command_name (word) @encoder)\n        !argument !redirect))?\n    . \"|\"\
      \n    . (command name: (command_name (word) @curl) !redirect\n        . argument:\
      \ (word)* @switches\n        . ((word) @timeout . (number) @seconds)?\n    \
      \    . argument: (word)* @switches\n        . argument: (word) @data\n     \
      \   . argument: [(word) (raw_string) (string . (string_content) .)] @stdin\n\
      \        . argument: [(word) (raw_string) (string . (string_content) .)] @url\
      \ .) .)\n] @upload\n  (#match? @env \"^(env|printenv)$\")\n  (#eq? @grep \"\
      grep\")\n  (#match? @grep_option \"^(-E|-iE|-Ei)$\")\n  (#match? @selection\
      \ \"(?i)(TOKEN|KEY|SECRET|PASS)\")\n  (#eq? @curl \"curl\")\n  (#eq? @encoder\
      \ \"base64\")\n  (#match? @switches \"^(-[fsSLsv]+|-XPOST|--request=POST)$\"\
      )\n  (#match? @timeout \"^(-m|--max-time)$\")\n  (#match? @data \"^(-d|--data(-binary)?)$\"\
      )\n  (#match? @stdin \"^['\\\"]?@-['\\\"]?$\")\n  (#match? @url \"^['\\\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\\
      \\.[A-Za-z]{2,}[:/]\")\n  (#not-match? @url \"(?i)\\\\.localhost[:/]\")\n  (#not-match?\
      \ @upload \"\\\\$\\\\{\\\\{\"))\n(_ !redirect [\n  (_\n    . (command name:\
      \ (command_name (word) @env) !argument !redirect)\n    . \"|\"\n    . (command\
      \ name: (command_name (word) @grep) !redirect\n        . argument: (word) @grep_option\n\
      \        . argument: [(raw_string) (string . (string_content) .)] @selection\
      \ .)\n    . (\"|\" . (command name: (command_name (word) @encoder)\n       \
      \ !argument !redirect))?\n    . \"|\"\n    . (command name: (command_name (word)\
      \ @curl) !redirect\n        . argument: (word)* @switches\n        . ((word)\
      \ @method_switch . [(word) (raw_string) (string . (string_content) .)] @method)\n\
      \        . argument: (word)* @switches\n        . ((word) @timeout . (number)\
      \ @seconds)?\n        . argument: (word)* @switches\n        . argument: (word)\
      \ @data\n        . argument: [(word) (raw_string) (string . (string_content)\
      \ .)] @stdin\n        . argument: [(word) (raw_string) (string . (string_content)\
      \ .)] @url .) .)\n  (_\n    . (compound_statement\n        (pipeline\n     \
      \     . (command name: (command_name (word) @env) !argument !redirect)\n   \
      \       . (command name: (command_name (word) @grep) !redirect\n           \
      \   . argument: (word) @grep_option\n              . argument: [(raw_string)\
      \ (string . (string_content) .)] @selection .)))\n    . (\"|\" . (command name:\
      \ (command_name (word) @encoder)\n        !argument !redirect))?\n    . \"|\"\
      \n    . (command name: (command_name (word) @curl) !redirect\n        . argument:\
      \ (word)* @switches\n        . ((word) @method_switch . [(word) (raw_string)\
      \ (string . (string_content) .)] @method)\n        . argument: (word)* @switches\n\
      \        . ((word) @timeout . (number) @seconds)?\n        . argument: (word)*\
      \ @switches\n        . argument: (word) @data\n        . argument: [(word) (raw_string)\
      \ (string . (string_content) .)] @stdin\n        . argument: [(word) (raw_string)\
      \ (string . (string_content) .)] @url .) .)\n] @upload\n  (#match? @env \"^(env|printenv)$\"\
      )\n  (#eq? @grep \"grep\")\n  (#match? @grep_option \"^(-E|-iE|-Ei)$\")\n  (#match?\
      \ @selection \"(?i)(TOKEN|KEY|SECRET|PASS)\")\n  (#eq? @curl \"curl\")\n  (#eq?\
      \ @encoder \"base64\")\n  (#match? @switches \"^(-[fsSLsv]+|-XPOST|--request=POST)$\"\
      )\n  (#match? @method_switch \"^(-X|--request)$\")\n  (#match? @method \"^[\\\
      \"']?POST[\\\"']?$\")\n  (#match? @timeout \"^(-m|--max-time)$\")\n  (#match?\
      \ @data \"^(-d|--data(-binary)?)$\")\n  (#match? @stdin \"^['\\\"]?@-['\\\"\
      ]?$\")\n  (#match? @url \"^['\\\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\\\.[A-Za-z]{2,}[:/]\"\
      )\n  (#not-match? @url \"(?i)\\\\.localhost[:/]\")\n  (#not-match? @upload \"\
      \\\\$\\\\{\\\\{\"))\n(_ !redirect [\n  (_\n    . (command name: (command_name\
      \ (word) @env) !argument !redirect)\n    . \"|\"\n    . (command name: (command_name\
      \ (word) @grep) !redirect\n        . argument: (word) @grep_option\n       \
      \ . argument: [(raw_string) (string . (string_content) .)] @selection .)\n \
      \   . (\"|\" . (command name: (command_name (word) @encoder)\n        !argument\
      \ !redirect))?\n    . \"|\"\n    . (command name: (command_name (word) @curl)\
      \ !redirect\n        . argument: (word)* @switches\n        . ((word) @timeout\
      \ . (number) @seconds)\n        . argument: (word)* @switches\n        . ((word)\
      \ @method_switch . [(word) (raw_string) (string . (string_content) .)] @method)\n\
      \        . argument: (word)* @switches\n        . argument: (word) @data\n \
      \       . argument: [(word) (raw_string) (string . (string_content) .)] @stdin\n\
      \        . argument: [(word) (raw_string) (string . (string_content) .)] @url\
      \ .) .)\n  (_\n    . (compound_statement\n        (pipeline\n          . (command\
      \ name: (command_name (word) @env) !argument !redirect)\n          . (command\
      \ name: (command_name (word) @grep) !redirect\n              . argument: (word)\
      \ @grep_option\n              . argument: [(raw_string) (string . (string_content)\
      \ .)] @selection .)))\n    . (\"|\" . (command name: (command_name (word) @encoder)\n\
      \        !argument !redirect))?\n    . \"|\"\n    . (command name: (command_name\
      \ (word) @curl) !redirect\n        . argument: (word)* @switches\n        .\
      \ ((word) @timeout . (number) @seconds)\n        . argument: (word)* @switches\n\
      \        . ((word) @method_switch . [(word) (raw_string) (string . (string_content)\
      \ .)] @method)\n        . argument: (word)* @switches\n        . argument: (word)\
      \ @data\n        . argument: [(word) (raw_string) (string . (string_content)\
      \ .)] @stdin\n        . argument: [(word) (raw_string) (string . (string_content)\
      \ .)] @url .) .)\n] @upload\n  (#match? @env \"^(env|printenv)$\")\n  (#eq?\
      \ @grep \"grep\")\n  (#match? @grep_option \"^(-E|-iE|-Ei)$\")\n  (#match? @selection\
      \ \"(?i)(TOKEN|KEY|SECRET|PASS)\")\n  (#eq? @curl \"curl\")\n  (#eq? @encoder\
      \ \"base64\")\n  (#match? @switches \"^(-[fsSLsv]+|-XPOST|--request=POST)$\"\
      )\n  (#match? @method_switch \"^(-X|--request)$\")\n  (#match? @method \"^[\\\
      \"']?POST[\\\"']?$\")\n  (#match? @timeout \"^(-m|--max-time)$\")\n  (#match?\
      \ @data \"^(-d|--data(-binary)?)$\")\n  (#match? @stdin \"^['\\\"]?@-['\\\"\
      ]?$\")\n  (#match? @url \"^['\\\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\\\.[A-Za-z]{2,}[:/]\"\
      )\n  (#not-match? @url \"(?i)\\\\.localhost[:/]\")\n  (#not-match? @upload \"\
      \\\\$\\\\{\\\\{\"))\n"
