defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: shell-filtered-env-stdin-http-upload
    desc: Posts filtered environment to HTTP domain
    unless:
      - id: metadata/file/function::shell-env-function-name-symbol
      - id: metadata/file/function::shell-printenv-function-name-symbol
      - id: metadata/file/function::shell-grep-function-name-symbol
      - id: micro-behaviors/data/source/function/names::shell-curl-function-definition
      - type: symbol
        kind: function
        exact: base64
      - type: text
        regex: 'curl[^\n]{0,100}<\s*/dev/null'
      - type: tree-sitter
        language: shell
        query: |
          ((redirected_statement
             body: (_) @body
             redirect: (file_redirect) @redirect)
           (#match? @body "\\bcurl\\b")
           (#match? @redirect "^<"))
      - type: text
        regex: '(?m)^\s*base64\s*\(\s*\)'
    if:
      type: tree-sitter
      language: shell
      query: |
        ([
          (pipeline !redirect
           . (command name: (command_name) @env !argument !redirect)
           . "|"
           . (command name: (command_name) @grep !redirect
               . argument: (word) @grep_option
               . argument: [(raw_string) (string . (string_content) .)] @selection .)
           . ("|" . (command name: (command_name) @encoder !argument !redirect))?
           . "|"
           . (command
               name: (command_name) @curl !redirect
               argument: (word) @data_flag
               argument: (word) @data_source
               argument: [(word) (raw_string) (string)] @url) @curl_command .)
          (pipeline !redirect
           . (compound_statement
               (pipeline
                . (command name: (command_name) @env !argument !redirect)
                . "|"
                . (command name: (command_name) @grep !redirect
                    . argument: (word) @grep_option
                    . argument: [(raw_string) (string . (string_content) .)] @selection .)))
           . ("|" . (command name: (command_name) @encoder !argument !redirect))?
           . "|"
           . (command
               name: (command_name) @curl !redirect
               argument: (word) @data_flag
               argument: (word) @data_source
               argument: [(word) (raw_string) (string)] @url) @curl_command .)
        ] @upload
         (#match? @env "^(env|printenv)$")
         (#eq? @grep "grep")
         (#match? @grep_option "^(-E|-iE|-Ei)$")
         (#match? @selection "(?i)(TOKEN|KEY|SECRET|PASS)")
         (#eq? @curl "curl")
         (#not-match? @upload "<\\s*/dev/null")
         (#match? @data_flag "^(-d|--data(-binary)?)$")
         (#eq? @data_source "@-")
         (#match? @url "^https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
         (#not-match? @curl_command "(?i)\\.localhost[:/]")
         (#not-match? @curl_command "(^|\\s)-H\\s+--data(-binary)?\\s+@-")
         (#not-match? @curl_command "\\$\\{\\{"))
