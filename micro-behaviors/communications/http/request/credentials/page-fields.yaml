defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
composite_rules:
  - id: page-password-fields-remote-json-post
    desc: Page credential fields accompany remote JSON POST
    # Keep acquisition, body and destination in one source file. This is
    # co-occurrence evidence; archive-level login and example code cannot
    # establish a credential-forwarding channel by being pooled together.
    scope: file
    all:
      - id: micro-behaviors/ui/window/password-field::browser-credential-field-pair
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/payload::fetch-post-json-body
      - id: micro-behaviors/data/serialize/json::json-stringify-key-password-body
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: micro-behaviors/communications/http/url/tld::single-nonexistent-fetch-example
      - id: metadata/package/documentation/security-testing::authorized-fenced-testing-skill
