defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go, rust, perl, powershell]
  crit: notable
  conf: 0.95
traits:
  - id: javascript-credential-file-alias-http-body
    for: [javascript, typescript]
    desc: Credential file alias enters HTTP body
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator name: (identifier) @data
              value: (call_expression
                function: (member_expression property: (property_identifier) @read)
                arguments: (arguments) @path))) @binding
          (expression_statement
            (call_expression
              function: (member_expression object: (identifier) @client property: (property_identifier) @verb)
              arguments: (arguments
                [
                  (identifier) @sent
                  (object (pair key: (property_identifier) @field
                    value: [
                      (identifier) @sent
                      (call_expression function: (member_expression object: (identifier) @sent))
                      (call_expression function: (member_expression object: (call_expression function: (member_expression object: (identifier) @sent))))
                    ]))
                ])))) @send
          (#match? @binding "^const\\s")
          (#eq? @read "readFileSync")
          (#match? @path "(\\.npmrc|\\.netrc|\\.git-credentials|\\.ssh|\\.aws|\\.kube|\\.docker|application_default_credentials|\\.azure|\\.vault-token)")
          (#match? @client "^(axios|req|request)$")
          (#match? @verb "^(post|write|end)$")
          (#eq? @data @sent))
  - id: powershell-file-body-variable-upload
    for: [powershell]
    desc: PowerShell file bytes sent as HTTP body
    if:
      type: text
      regex: '\$body = (Get-Content|\[IO.File]::ReadAllBytes).{0,90}\n.{0,200}-Body \$body'
  - id: perl-file-body-variable-upload
    for: [perl]
    desc: Perl file handle content enters POST body
    if:
      type: text
      regex: 'my \$body\s*=\s*<\$fh>;\s*[^;]{0,300}Content\s*=>\s*\$body'
  - id: python-file-alias-http-content
    for: [python]
    desc: Python file alias enters HTTP content
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @data
            right: (call function: (attribute attribute: (identifier) @read)) @source))
          . (expression_statement (call function: (attribute object: (identifier) @client attribute: (identifier) @verb)
            arguments: (argument_list (keyword_argument name: (identifier) @field value: [
              (identifier) @sent
              (dictionary (pair value: (subscript value: (call function: (attribute object: (identifier) @sent)))))
            ]))))) @send
          (#match? @source "(\\.git-credentials|\\.netrc|\\.npmrc|\\.aws|\\.ssh|\\.docker|application_default_credentials)")
          (#match? @read "^(read_text|read_bytes)$")
          (#match? @client "^(requests|httpx)$")
          (#match? @verb "^(post|put)$")
          (#match? @field "^(data|content)$")
          (#eq? @data @sent))
  - id: javascript-file-array-request-body
    for: [javascript, typescript]
    desc: Read-file array enters Node request body
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @parts value: (array)))
          (for_in_statement body: (statement_block
            (try_statement body: (statement_block
              (expression_statement (call_expression
                function: (member_expression object: (identifier) @filled property: (property_identifier) @push)
                arguments: (arguments (call_expression function: (member_expression
                  object: (call_expression function: (member_expression property: (property_identifier) @read)))))))))))
          (lexical_declaration (variable_declarator name: (identifier) @body
            value: (call_expression function: (member_expression object: (identifier) @buffer property: (property_identifier) @concat)
              arguments: (arguments (identifier) @serialized))))
          (lexical_declaration (variable_declarator name: (identifier) @request
            value: (call_expression function: (member_expression property: (property_identifier) @request_method))))
          (expression_statement (call_expression function: (member_expression object: (identifier) @receiver property: (property_identifier) @end)
            arguments: (arguments (identifier) @sent)))) @send
          (#eq? @parts @filled)
          (#eq? @parts @serialized)
          (#eq? @body @sent)
          (#eq? @request @receiver)
          (#eq? @push "push")
          (#eq? @read "readFileSync")
          (#eq? @buffer "Buffer")
          (#eq? @concat "concat")
          (#eq? @request_method "request")
          (#eq? @end "end"))
  - id: javascript-file-map-request-body
    for: [javascript, typescript]
    desc: Read-file map enters Node request body
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @map value: (object)))
          (for_in_statement body: (statement_block
            (if_statement consequence: (expression_statement
              (assignment_expression
                left: (subscript_expression object: [
                  (identifier) @filled
                  (member_expression object: (identifier) @filled)
                ])
                right: (call_expression function: (member_expression
                  object: (call_expression function: (member_expression property: (property_identifier) @read)))))))))
          (lexical_declaration (variable_declarator name: (identifier) @body
            value: (call_expression function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
              arguments: (arguments (identifier) @serialized))))
          (lexical_declaration (variable_declarator name: (identifier) @request
            value: (call_expression function: (member_expression property: (property_identifier) @request_method))))
          (expression_statement (call_expression function: (member_expression object: (identifier) @receiver property: (property_identifier) @end)
            arguments: (arguments (identifier) @sent)))) @send
          (#eq? @map @filled)
          (#eq? @map @serialized)
          (#eq? @body @sent)
          (#eq? @request @receiver)
          (#eq? @read "readFileSync")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @request_method "request")
          (#eq? @end "end"))
  - id: go-credential-path-http-reader-body
    for: [go]
    desc: Go credential file supplies HTTP reader body
    if:
      type: tree-sitter
      query: |
        ((block (statement_list
          (short_var_declaration
            left: (expression_list (identifier) @data)
            right: (expression_list (call_expression
              function: (selector_expression operand: (identifier) @os field: (field_identifier) @read)
              arguments: (argument_list) @path)))
          . (expression_statement (call_expression
            function: (selector_expression operand: (identifier) @http field: (field_identifier) @post)
            arguments: (argument_list
              (call_expression function: (selector_expression operand: (identifier) @bytes field: (field_identifier) @reader)
                arguments: (argument_list (identifier) @sent))))))) @send
          (#eq? @data @sent)
          (#eq? @os "os")
          (#eq? @read "ReadFile")
          (#match? @path "(\\.docker/config\\.json|\\.azure/credentials|\\.vault-token)")
          (#eq? @http "http")
          (#eq? @post "Post")
          (#eq? @bytes "bytes")
          (#eq? @reader "NewReader"))
        ((block (statement_list
          (short_var_declaration
            left: (expression_list (identifier) @data)
            right: (expression_list (call_expression
              function: (selector_expression operand: (identifier) @os field: (field_identifier) @read)
              arguments: (argument_list) @path)))
          . (short_var_declaration left: (expression_list (identifier) @other)
            right: (expression_list (call_expression function: (selector_expression operand: (identifier) @other_os field: (field_identifier) @other_read)
              arguments: (argument_list) @other_path)))
          . (expression_statement (call_expression
            function: (selector_expression operand: (identifier) @http field: (field_identifier) @post)
            arguments: (argument_list
              (call_expression function: (selector_expression operand: (identifier) @bytes field: (field_identifier) @reader)
                arguments: (argument_list (call_expression function: (identifier) @append
                  arguments: (argument_list (identifier) @sent (variadic_argument (identifier) @sent_other)))))))))) @send
          (#eq? @data @sent)
          (#eq? @other @sent_other)
          (#eq? @os "os")
          (#eq? @other_os "os")
          (#eq? @read "ReadFile")
          (#eq? @other_read "ReadFile")
          (#match? @path "(\\.azure/credentials|\\.vault-token)")
          (#match? @other_path "(\\.azure/credentials|\\.vault-token)")
          (#eq? @http "http")
          (#eq? @post "Post")
          (#eq? @bytes "bytes")
          (#eq? @reader "NewReader")
          (#eq? @append "append"))
  - id: rust-credential-file-http-body
    for: [rust]
    desc: Rust credential file supplies HTTP body
    if:
      type: tree-sitter
      query: |
        ((block
          (let_declaration pattern: (identifier) @data
            value: (call_expression function: (field_expression
              value: (call_expression function: (scoped_identifier) @read arguments: (arguments) @path)
              field: (field_identifier) @unwrap)))
          (let_declaration value: (call_expression function: (field_expression
            value: (call_expression function: (field_expression
              value: (call_expression function: (field_expression field: (field_identifier) @post))
              field: (field_identifier) @body)
              arguments: (arguments (identifier) @sent))
            field: (field_identifier) @send)))) @upload
          (#eq? @data @sent)
          (#eq? @read "fs::read")
          (#match? @path "\\.docker/config\\.json")
          (#eq? @unwrap "unwrap_or_default")
          (#eq? @post "post")
          (#eq? @body "body")
          (#eq? @send "send"))
  - id: perl-file-hash-content-map
    for: [perl]
    desc: Perl file handle populates upload hash
    if:
      type: text
      regex: '\$interesting\{\$f\}\s*=\s*substr\(<\$fh>'
  - id: perl-hash-post-content
    for: [perl]
    desc: Perl hash serialized as POST content
    if:
      type: text
      regex: '(?s)content\s*=>\s*join\(.{0,60}map\s*\{"\$_=\$interesting\{\$_\}"\}'
  - id: javascript-env-token-native-chat-body
    for: [javascript, typescript]
    desc: Environment token enters Node chat request body
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @token
            value: (binary_expression left: (binary_expression
              left: (member_expression object: (member_expression object: (identifier) @process property: (property_identifier) @env) property: (property_identifier) @secret)
              right: (member_expression object: (member_expression object: (identifier) @fallback_process property: (property_identifier) @fallback_env) property: (property_identifier) @fallback)))) ) @binding
          . (lexical_declaration (variable_declarator name: (identifier) @body
            value: (call_expression function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
              arguments: (arguments (object (pair key: (property_identifier) @field value: (identifier) @serialized))))))
          . (lexical_declaration (variable_declarator name: (identifier) @request
            value: (call_expression function: (member_expression object: (identifier) @http property: (property_identifier) @request_method)
              arguments: (arguments (object) @destination))))
          . (expression_statement (call_expression function: (member_expression object: (identifier) @receiver property: (property_identifier) @write)
            arguments: (arguments (identifier) @sent)))) @upload
          (#match? @binding "^const\\s")
          (#eq? @process "process")
          (#eq? @fallback_process "process")
          (#eq? @env "env")
          (#eq? @fallback_env "env")
          (#match? @secret "^(NPM_TOKEN|NODE_AUTH_TOKEN)$")
          (#match? @fallback "^(NPM_TOKEN|NODE_AUTH_TOKEN)$")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#match? @field "^(text|content)$")
          (#eq? @token @serialized)
          (#eq? @body @sent)
          (#eq? @request @receiver)
          (#match? @http "^https?$")
          (#eq? @request_method "request")
          (#match? @destination "(api\\.telegram\\.org|discord\\.com)")
          (#eq? @write "write"))
  - id: javascript-two-credential-files-chat-body
    for: [javascript, typescript]
    desc: Two credential files enter chat request body
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @first
            value: (call_expression function: (member_expression property: (property_identifier) @read1)
              arguments: (arguments) @path1))) @binding1
          . (lexical_declaration (variable_declarator name: (identifier) @second
            value: (call_expression function: (member_expression property: (property_identifier) @read2)
              arguments: (arguments) @path2))) @binding2
          . (expression_statement (call_expression function: (identifier) @fetch
            arguments: (arguments (string (string_fragment) @destination)
              (object (pair key: (property_identifier) @body
                value: (call_expression function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
                  arguments: (arguments (object (pair key: (property_identifier) @text
                    value: (binary_expression left: (identifier) @sent1 operator: "+" right: (identifier) @sent2))))))))))) @send
          (#match? @binding1 "^const\\s")
          (#match? @binding2 "^const\\s")
          (#match? @path1 "(\\.azure/credentials|\\.vault-token|\\.aws|\\.npmrc)")
          (#match? @path2 "(\\.azure/credentials|\\.vault-token|\\.aws|\\.npmrc)")
          (#eq? @read1 "readFileSync")
          (#eq? @read2 "readFileSync")
          (#eq? @first @sent1)
          (#eq? @second @sent2)
          (#eq? @fetch "fetch")
          (#match? @destination "^https://hooks\\.slack\\.com/services/")
          (#eq? @body "body")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @text "text"))
composite_rules:
  - id: perl-file-hash-post-body
    for: [perl]
    desc: Perl file hash sent as POST content
    near_lines: 20
    all:
      - id: perl-file-hash-content-map
      - id: perl-hash-post-content

  - id: credential-content-http-send
    desc: Credential-derived content in HTTP sends
    any:
      - id: javascript-two-credential-files-chat-body
      - id: javascript-env-token-native-chat-body
      - id: micro-behaviors/communications/http/request/credentials::perl-file-hash-post-body
      - id: micro-behaviors/communications/http/request/credentials::javascript-file-array-request-body
      - id: micro-behaviors/communications/http/request/credentials::javascript-file-map-request-body
      - id: micro-behaviors/communications/http/request/credentials::javascript-credential-file-alias-http-body
      - id: micro-behaviors/communications/http/request/credentials::powershell-file-body-variable-upload
      - id: micro-behaviors/communications/http/request/credentials::perl-file-body-variable-upload
      - id: micro-behaviors/communications/http/request/credentials::python-file-alias-http-content
      - id: micro-behaviors/communications/http/request/credentials::credential-file-http-body-flow
      - id: micro-behaviors/communications/http/request/credentials::go-credential-path-http-reader-body
      - id: micro-behaviors/communications/http/request/credentials::rust-credential-file-http-body
      - id: micro-behaviors/communications/http/request/credentials::rust-reqwest-post-exfil
      - id: micro-behaviors/communications/http/request/credentials::secret-http-request-flow
