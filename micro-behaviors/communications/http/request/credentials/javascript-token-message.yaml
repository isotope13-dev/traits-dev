defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: javascript-env-token-message-flow
    desc: Environment token enters Discord webhook content
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @client
              value: (call_expression
                function: (identifier) @require
                arguments: (arguments (string (string_fragment) @module))))) @binding
          . (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @post)
              arguments: (arguments
                (string (string_fragment) @destination)
                (object
                  (pair
                    key: (property_identifier) @content
                    value: (member_expression
                      object: (member_expression
                        object: (identifier) @process
                        property: (property_identifier) @env)
                      property: (property_identifier) @secret))))) @send))
          (#match? @binding "^const\\s")
          (#eq? @require "require")
          (#eq? @module "axios")
          (#eq? @client @receiver)
          (#eq? @post "post")
          (#match? @destination "^https://discord(app)?\\.com/api/webhooks/")
          (#eq? @content "content")
          (#eq? @process "process")
          (#eq? @env "env")
          (#match? @secret "^(GITHUB_TOKEN|GH_TOKEN)$"))
  # The flow engine leaves fallback expressions opaque. Match an immutable
  # const, an Axios require binding, and the immediately following send.
  # Bind the token alias to the template substitution; unrelated status
  # notifications next to a token read must not match.
  - id: javascript-fallback-token-message-body
    desc: GitHub fallback token sent as webhook content
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @token
              value: (binary_expression
                left: (member_expression
                  object: (member_expression
                    object: (identifier) @process
                    property: (property_identifier) @env)
                  property: (property_identifier) @primary)
                operator: "||"
                right: (member_expression
                  object: (member_expression
                    object: (identifier) @fallback_process
                    property: (property_identifier) @fallback_env)
                  property: (property_identifier) @fallback)))) @binding
          . (lexical_declaration
            (variable_declarator
              name: (identifier) @client
              value: (call_expression
                function: (identifier) @require
                arguments: (arguments (string (string_fragment) @module)))))
          . (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @post)
              arguments: (arguments
                (string (string_fragment) @destination)
                (object
                  (pair
                    key: (property_identifier) @content
                    value: (template_string
                      (template_substitution (identifier) @sent)))))) @send))
          (#match? @binding "^const\\s")
          (#eq? @process "process")
          (#eq? @fallback_process "process")
          (#eq? @env "env")
          (#eq? @fallback_env "env")
          (#match? @primary "^(GITHUB_TOKEN|GH_TOKEN)$")
          (#match? @fallback "^(GITHUB_TOKEN|GH_TOKEN)$")
          (#eq? @require "require")
          (#eq? @module "axios")
          (#eq? @client @receiver)
          (#eq? @post "post")
          (#match? @destination "^https://discord(app)?\\.com/api/webhooks/")
          (#eq? @content "content")
          (#eq? @token @sent))
  - id: javascript-fallback-token-axios-data
    desc: GitHub token enters Axios webhook data
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @token
              value: (binary_expression
                left: (member_expression
                  object: (member_expression
                    object: (identifier) @process
                    property: (property_identifier) @env)
                  property: (property_identifier) @primary)
                operator: "||"
                right: (member_expression
                  object: (member_expression
                    object: (identifier) @fallback_process
                    property: (property_identifier) @fallback_env)
                  property: (property_identifier) @fallback)))) @binding
          . (lexical_declaration
            (variable_declarator
              name: (identifier) @client
              value: (call_expression
                function: (identifier) @require
                arguments: (arguments (string (string_fragment) @module)))))
          . (expression_statement
            (call_expression
              function: (identifier) @receiver
              arguments: (arguments
                (string (string_fragment) @destination)
                (object
                  (pair
                    key: (property_identifier) @data
                    value: (object
                  (pair
                    key: (property_identifier) @content
                    value: (template_string
                      (template_substitution (identifier) @sent)))))))) @send))
          (#match? @binding "^const\\s")
          (#eq? @process "process")
          (#eq? @fallback_process "process")
          (#eq? @env "env")
          (#eq? @fallback_env "env")
          (#match? @primary "^(GITHUB_TOKEN|GH_TOKEN)$")
          (#match? @fallback "^(GITHUB_TOKEN|GH_TOKEN)$")
          (#eq? @require "require")
          (#eq? @module "axios")
          (#eq? @client @receiver)
          (#eq? @data "data")
          (#match? @destination "^https://discord(app)?\\.com/api/webhooks/")
          (#eq? @content "content")
          (#eq? @token @sent))
  - id: javascript-file-credential-webhook-content
    desc: Credential file enters Discord webhook content
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @fs
              value: (call_expression
                function: (identifier) @fs_require
                arguments: (arguments (string (string_fragment) @fs_module))))) @fs_binding
          . (lexical_declaration
            (variable_declarator
              name: (identifier) @client
              value: (call_expression
                function: (identifier) @require
                arguments: (arguments (string (string_fragment) @module))))) @client_binding
          . (lexical_declaration
            (variable_declarator
              name: (identifier) @secret
              value: (call_expression
                function: (member_expression
                  object: (identifier) @reader
                  property: (property_identifier) @read)
                arguments: (arguments (string (string_fragment) @path))))) @secret_binding
          . (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @post)
              arguments: (arguments
                (string (string_fragment) @destination)
                (object
                  (pair key: (property_identifier) @content value: (identifier) @sent)))) @send))
          (#match? @fs_binding "^const\\s")
          (#match? @client_binding "^const\\s")
          (#match? @secret_binding "^const\\s")
          (#eq? @fs_require "require")
          (#eq? @fs_module "fs")
          (#eq? @fs @reader)
          (#eq? @read "readFileSync")
          (#match? @path "(\\.npmrc|\\.git-credentials|credentials)$")
          (#eq? @require "require")
          (#eq? @module "axios")
          (#eq? @client @receiver)
          (#eq? @post "post")
          (#match? @destination "^https://discord(app)?\\.com/api/webhooks/")
          (#eq? @content "content")
          (#eq? @secret @sent))
composite_rules:
  - id: javascript-env-token-message-body
    desc: Environment token enters Discord webhook content
    any:
      - id: javascript-env-token-message-flow
      - id: javascript-fallback-token-message-body
      - id: javascript-fallback-token-axios-data

  - id: bound-credential-webhook-content
    desc: Credential source enters webhook content
    any:
      - id: javascript-env-token-message-body
      - id: javascript-file-credential-webhook-content
