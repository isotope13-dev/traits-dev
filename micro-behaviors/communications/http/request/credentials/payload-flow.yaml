# Bounded source-local provenance, including assignments and local helpers.
# These facts describe payload construction, not proven runtime reachability.
defaults:
  platforms: [unix, windows]
  for: [rust, python, javascript, typescript, go]
  crit: notable
  conf: 0.94

traits:
  - id: environment-http-body-flow
    desc: Environment collection enters HTTP request body
    crit: suspicious
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: environment-http-body
    unless:
      # Scanner regression fixtures intentionally POST environ to a reserved
      # documentation host as inert test data. Require a real tests/ path
      # rather than trusting an attacker-controlled test_ filename alone.
      - id: metadata/package/testing/presence/harness::test-directory-path
      # CLI telemetry senders thread the whole process.env object into an
      # event builder that extracts only npm_config_user_agent. The flow
      # engine reports the object pass as an environment flow, but no bulk
      # collection is serialized.
      - id: micro-behaviors/os/env/package-manager::selective-npm-agent-telemetry
  - id: secret-http-body-flow
    desc: Secret value enters HTTP request body
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: secret-http-body
    unless:
      # Same selective-telemetry shape as above: only the non-secret npm
      # user-agent field is serialized, so there is no secret exfiltration.
      - id: micro-behaviors/os/env/package-manager::selective-npm-agent-telemetry
  - id: cargo-credential-http-body-flow
    desc: Cargo credentials enter HTTP request body
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: cargo-credential-http-body
  - id: credential-file-http-body-flow
    desc: Credential file enters HTTP request body
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: credential-file-http-body
  - id: file-http-body-flow
    desc: File contents enter HTTP request body
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: file-http-body
