# Bounded source-local provenance, including assignments and local helpers.
# These facts describe payload construction, not proven runtime reachability.
defaults:
  platforms: [unix, windows]
  for: [rust, python, javascript, typescript, go]
  crit: notable
  conf: 0.94

traits:
  - id: secret-http-request-flow
    desc: Secret-derived value reaches HTTP request
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: secret-http-body
    unless:
      # Same selective-telemetry shape as above: only the non-secret npm
      # user-agent field is serialized, so there is no secret exfiltration.
      - id: micro-behaviors/os/env/package-manager::selective-npm-agent-telemetry
      - id: micro-behaviors/communications/http/oauth::oauth-pkce-flow-context
      - id: micro-behaviors/communications/http/oauth::oauth-refresh-token-flow-context
      # Same first-party login exchange as above: the secret enters the
      # login POST body, then the issued token is reused as an
      # Authorization header rather than exfiltrated.
      - id: micro-behaviors/communications/http/login::login-token-exchange-context
      - id: well-known/app/development/cloudflare::cloudflare-github-jira-sync-context
      - id: well-known/app/ai/agent-runtime/
      - id: well-known/lib/ai/langsmith::langsmith-tracing-context
      - id: well-known/lib/web/farming-labs::farming-labs-docs-telemetry-context
  - id: cargo-credential-http-body-flow
    desc: Cargo credentials enter HTTP request body
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: cargo-credential-http-body
  - id: credential-file-http-body-flow
    desc: Credential file enters HTTP request body
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: credential-file-http-body
  # NOTE: this generic leg intentionally stays out of
  # communications/http/request/body/. The go-history-http-* benign family
  # forbids that whole hierarchy on lookalike variants where the coarse
  # file-http-body flow fact still fires by engine design; no YAML matcher
  # distinguishes them, so housing the leg here keeps that contract green.
  - id: file-http-body-flow
    desc: Static file-to-HTTP body flow candidate
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: file-http-body

composite_rules:
  # Not install-hook specific: any script that reads a credential-named
  # variable and calls out at import time. API clients sending their own key
  # as auth do this too; the hook composites in objectives/supply-chain add
  # the lifecycle-script context that makes it exfiltration.
  - id: credential-env-read-http-at-load
    desc: Reads credential env var, calls HTTP at load
    crit: notable
    conf: 0.9
    # Script file types only: on the `npm`/`package.json` container the member
    # findings are pooled, so a file-scoped composite there would be satisfied
    # by two different members and the same-file guarantee would be lost.
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/env/secret-name::javascript-credential-env-read
      - id: micro-behaviors/communications/http/request/client::module-execution-http-call

  # Benign shape behind most environment→HTTP-body flow events in AI tooling:
  # a bring-your-own-key chat client. Both legs are individually notable
  # provider integrations; together they say the env material in play is the
  # provider key used to authenticate chat-completions traffic, not harvested
  # environment data serialized into a request body.
  - id: byok-llm-chat-client-context
    desc: BYOK LLM chat client authenticating to its provider
    crit: exception
    conf: 0.93
    # Intersection of this file's flow languages and the provider-key
    # reference leg's supported types.
    for: [python, javascript, typescript, shell, powershell]
    all:
      - id: micro-behaviors/os/env/ai-provider::ai-provider-key-env-reference
      - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
