# Bounded source-local relationship using existing AST nodes. The keychain
# result is consumed by the POST body, not merely present elsewhere in a file.
# Only the optional require and a distinct URI assignment may intervene.
defaults:
  for: [ruby]
  platforms: [macos]
  crit: notable
  conf: 0.95

traits:
  - id: ruby-browser-keychain-post-body
    desc: Ruby posts browser-keychain query result
    if:
      type: tree-sitter
      query: |
        (_
          (assignment left: (identifier) @secret
            right: (call
              receiver: (call receiver: (constant) @reader
                method: (identifier) @read !block
                arguments: (argument_list
                  . [(string . (string_content) .)
                     (chained_string (string . (string_content) .)+)] @command .))
              method: (identifier) @trim !arguments !block))
          . (call !receiver !block method: (identifier) @require
              arguments: (argument_list . (string) @library .))?
          . (assignment left: (identifier) @uri_binding
              right: (call !receiver !block method: (constant) @uri
                arguments: (argument_list . (string . (string_content) .) @endpoint .)))
          . (call receiver: (scope_resolution) @client
              method: (identifier) @post !block
              arguments: (argument_list
                . (identifier) @url_use
                . [(string . (interpolation . (identifier) @body_use .) .)
                   (string . (string_content)
                     . (interpolation . (identifier) @body_use .) .)
                   (string . (interpolation . (identifier) @body_use .)
                     . (string_content) .)
                   (string . (string_content)
                     . (interpolation . (identifier) @body_use .)
                     . (string_content) .)] .))
          (#eq? @reader "Utils")
          (#eq? @read "popen_read")
          (#match? @trim "^(strip|chomp)$")
          (#not-match? @command "#[{$@]")
          (#match? @command "^['\"]security\\s+find-generic-password\\b")
          (#match? @command "[\\s\"']-w\\b")
          (#match? @command "[\\s\"']-s\\s+'[A-Z][A-Za-z ]{2,40} Safe Storage'")
          (#eq? @require "require")
          (#match? @library "^['\"]net/http['\"]$")
          (#eq? @uri "URI")
          (#match? @endpoint "^['\"]https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}(:[0-9]+)?/")
          (#not-match? @endpoint "(?i)\\.localhost[:/]")
          (#not-eq? @secret @uri_binding)
          (#eq? @client "Net::HTTP")
          (#eq? @post "post")
          (#eq? @url_use @uri_binding)
          (#eq? @body_use @secret))
