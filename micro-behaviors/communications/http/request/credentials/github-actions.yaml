defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.95

traits:
  - id: curl-secret-reference
    desc: Workflow curl references a secret URL
    crit: notable
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '\bcurl\b.{0,120}\$\{\{\s*secrets\.[A-Za-z0-9_]+\s*\}\}'

  # These bounded forms cover an entire run scalar. Merely piping to curl
  # does not upload stdin. Do not match examples in comments, heredocs,
  # descriptions, separate steps, or curl's --data-raw literal body.
  # Other commands, options, filters and compound shell syntax need separate
  # relationship evidence; this is deliberately not a shell parser.
  - id: workflow-env-stdin-post-short
    desc: Workflow posts process environment from stdin
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: &env_stdin_short '\A *(print)?env *[|]\s*curl +-d +@- +https?://[^\s"''<>|;]+ *\s*\z'

  - id: workflow-env-stdin-post-long
    desc: Workflow posts process environment from stdin
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: &env_stdin_long '\A *(print)?env *[|]\s*curl +--data(-binary)? +@- +https?://[^\s"''<>|;]+ *\s*\z'

  - id: action-env-stdin-post-short
    desc: Composite action posts environment from stdin
    if:
      type: value
      path: runs.steps[*].run
      regex: *env_stdin_short

  - id: action-env-stdin-post-long
    desc: Composite action posts environment from stdin
    if:
      type: value
      path: runs.steps[*].run
      regex: *env_stdin_long

  # A run block that pipes grep-filtered environment into a curl stdin upload,
  # tolerating the filter stages and compound shell syntax the bounded forms
  # above exclude. The whole pipeline must sit inside one run scalar: a
  # download in one step and an `env SECRET=` prefix in another step never
  # match, however close the steps are. The credential reading comes from the
  # secret-presence leg these feed in the workflow-env-http-upload hostile
  # composite, not from this atom: any grep stage qualifies here, so a
  # `--data-raw` literal body stays out (it never reads stdin) while plain
  # `env | curl` without a filter stage does too (nothing was selected).
  - id: workflow-env-filtered-upload
    desc: Workflow posts filtered environment to upload
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: &env_filtered_upload '(print)?env\s*\|\s*grep[\s\S]{0,400}?\bcurl\b[^|]*?-d(ata(-binary)?)?\s*@-\s*https?://\S'

  - id: action-env-filtered-upload
    desc: Action uploads filtered environment
    if:
      type: value
      path: runs.steps[*].run
      regex: *env_filtered_upload
