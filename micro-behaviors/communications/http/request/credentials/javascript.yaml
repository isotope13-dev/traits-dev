defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1071.001
  mbc: C0002
traits:
- id: api-key-query-parameter
  desc: HTTP query includes an API key
  conf: 0.9
  if:
    type: text
    substr: ?api_key=${
- id: token-variable-in-fetch-query
  desc: Fetch URL query interpolates a token variable
  conf: 0.96
  if:
    type: text
    regex: (?i)fetch\s*\(\s*`[^`]{0,300}\?[^`]{0,150}\$\{[^}]{0,60}token[^}]{0,60}\}
- id: fetch-credentials-include
  desc: Fetch sends browser credentials
  conf: 0.86
  if:
    type: text
    regex: credentials\s*:\s*["']include["']
- id: fetch-credentials-include-unicode
  desc: Escaped fetch credentials option
  conf: 0.95
  if:
    type: encoded
    encoding: unicode-escape
    regex: credentials.{0,80}include
- id: js-json-payload-source-field
  desc: JSON payload contains source-code field
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(frontend|backend)_code\b\s*:'
composite_rules:
- id: fetch-credentials-include-any
  desc: Fetch sends browser credentials
  conf: 0.95
  any:
  - id: fetch-credentials-include
  - id: fetch-credentials-include-unicode
  unless:
  - id: well-known/lib
- id: js-api-key-source-json-request
  desc: JavaScript prepares API key and source in an HTTP JSON request
  conf: 0.96
  all:
  - id: metadata/lang/source/syntax/key-value::js-api-key-variable-field
  - id: js-json-payload-source-field
  - id: micro-behaviors/communications/http/request/body::request-write-call
