defaults:
  platforms:
    - unix
    - windows
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002
traits:
  - id: js-api-key-url-encoding
    desc: JavaScript URL-encodes an API-key identifier
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'encodeURIComponent\s*\(\s*[^()\n]{0,120}\bapiKey\b\s*\)'
  - id: api-key-query-parameter
    desc: HTTP query includes an API key
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '?api_key=${'
  - id: token-variable-in-fetch-query
    desc: Fetch URL query interpolates a token variable
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)fetch\s*\(\s*`[^`]{0,300}\?[^`]{0,150}\$\{[^}]{0,60}token[^}]{0,60}\}'
  - id: fetch-credentials-include
    desc: Fetch sends browser credentials
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'credentials\s*:\s*["'']include["'']'
    unless:
      - id: metadata/library/runtime/
  - id: js-bearer-header-from-secret-variable
    desc: Uses a credential variable in Bearer header
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Authorization\s*:\s*`Bearer\s+\$\{[^}]{0,120}\b(apiKey|keySecret|secret|token)\b'
  - id: js-bearer-header-from-auth-token
    desc: Uses an auth token in Bearer header
    crit: notable
    conf: 0.94
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'authorization\s*:\s*`Bearer\s+\$\{[^}\n]{0,120}\b(accessToken|auth\.token|token)\b'
      case_insensitive: true

  # The concatenation spelling of the same thing. Phishing kits and older
  # scripts build the header with `"Bearer " + tok` rather than a template
  # literal, which the backtick pattern above cannot see.
  - id: js-bearer-header-concatenated-token
    desc: Builds Bearer header by concatenating a token
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?i)authorization["'']?\s*:\s*["'']Bearer\s+["'']\s*\+\s*\w{0,40}token'

  - id: js-json-payload-api-key-field
    desc: JSON payload contains API-key field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bapi[_-]?key\b\s*:\s*\bapiKey\b'

  - id: js-json-payload-source-field
    desc: JSON payload contains source-code field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(frontend|backend)_code\b\s*:'

composite_rules:
  - id: js-api-key-source-json-request
    desc: JavaScript prepares API key and source in an HTTP JSON request
    crit: notable
    conf: 0.96
    all:
      - id: js-json-payload-api-key-field
      - id: js-json-payload-source-field
      - id: micro-behaviors/communications/http/request/client::request-write-call
