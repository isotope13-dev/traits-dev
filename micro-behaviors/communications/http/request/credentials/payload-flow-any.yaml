defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
  attack: "T1552.001,T1041"
  mbc: E1552

traits:
  - id: rust-reqwest-post-exfil
    desc: Rust credentials enter HTTP request body
    crit: notable
    conf: 0.8
    for: [rust]
    if:
      type: value
      path: source.payload_flow.events[*].kind
      regex: '^(secret|credential-file|cargo-credential)-http-body$'
