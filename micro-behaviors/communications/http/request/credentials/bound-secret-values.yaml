defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  conf: 0.97
traits:
- id: raw-aws-keypair-native-http-body
  desc: AWS keypair serialized into HTTP request body
  if:
    type: tree-sitter
    query: |
      ((_
        (lexical_declaration (variable_declarator name: (identifier) @body
          value: (call_expression
            function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
            arguments: (arguments (object
              (pair value: (member_expression
                object: (member_expression object: (identifier) @process1 property: (property_identifier) @env1)
                property: (property_identifier) @access))
              (pair value: (member_expression
                object: (member_expression object: (identifier) @process2 property: (property_identifier) @env2)
                property: (property_identifier) @secret)))))))
        (lexical_declaration (variable_declarator name: (identifier) @request
          value: (call_expression function: (member_expression object: (identifier) @http property: (property_identifier) @request_method))))
        (expression_statement (call_expression function: (member_expression object: (identifier) @receiver property: (property_identifier) @write)
          arguments: (arguments (identifier) @sent)))) @export
        (#eq? @json "JSON") (#eq? @stringify "stringify")
        (#eq? @process1 "process") (#eq? @env1 "env")
        (#eq? @process2 "process") (#eq? @env2 "env")
        (#eq? @access "AWS_ACCESS_KEY_ID") (#eq? @secret "AWS_SECRET_ACCESS_KEY")
        (#match? @http "^https?$") (#eq? @request_method "request")
        (#eq? @body @sent) (#eq? @request @receiver) (#match? @write "^(write|end)$"))
  crit: notable
- id: filtered-env-dictionary-http-body
  desc: Filtered secret env dictionary sent over HTTP
  if:
    type: tree-sitter
    query: |
      ((statement_block
        (lexical_declaration (variable_declarator name: (identifier) @collected value: (object)))
        (for_in_statement left: (array_pattern (identifier) @key (identifier) @value)
          right: (call_expression
            function: (member_expression object: (identifier) @object property: (property_identifier) @entries)
            arguments: (arguments (member_expression object: (identifier) @process property: (property_identifier) @env)))
          body: (statement_block (if_statement
            condition: (parenthesized_expression (call_expression
              function: (member_expression object: (regex) @filter property: (property_identifier) @test)
              arguments: (arguments (identifier) @tested)))
            consequence: (statement_block (expression_statement (assignment_expression
              left: (subscript_expression object: (identifier) @destination index: (identifier) @index)
              right: (call_expression function: (identifier) @string arguments: (arguments (identifier) @copied))))))))
        (lexical_declaration (variable_declarator name: (identifier) @body
          value: (call_expression
            function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
            arguments: (arguments (object (pair key: (property_identifier) @field value: (identifier) @serialized))))))
        (expression_statement (await_expression (new_expression constructor: (identifier) @promise
          arguments: (arguments (arrow_function body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @request
              value: (call_expression function: (member_expression object: (identifier) @http property: (property_identifier) @request_method))))
            (expression_statement (call_expression function: (member_expression object: (identifier) @receiver property: (property_identifier) @end)
              arguments: (arguments (identifier) @sent)))))))))) @export
        (#eq? @object "Object") (#eq? @entries "entries")
        (#eq? @process "process") (#eq? @env "env")
        (#eq? @test "test") (#eq? @key @tested) (#eq? @key @index)
        (#match? @filter "TOKEN") (#match? @filter "SECRET")
        (#eq? @collected @destination) (#eq? @value @copied) (#eq? @string "String")
        (#eq? @json "JSON") (#eq? @stringify "stringify") (#eq? @field "env")
        (#eq? @collected @serialized) (#eq? @body @sent)
        (#eq? @promise "Promise") (#match? @http "^https?$")
        (#eq? @request_method "request") (#eq? @request @receiver) (#eq? @end "end"))
  crit: notable
- id: rust-developer-token-chat-body
  desc: Developer token enters chat request body
  for:
  - rust
  if:
    type: tree-sitter
    query: |
      ((block
        (let_declaration pattern: (identifier) @token value: (_) @origin)
        (let_declaration value: (call_expression function: (field_expression
          value: (call_expression function: (field_expression
            value: (call_expression function: (field_expression field: (field_identifier) @post)
              arguments: (arguments (string_literal) @destination))
            field: (field_identifier) @body)
            arguments: (arguments (identifier) @sent))
          field: (field_identifier) @send)))) @export
        (#match? @origin "^std::env::var")
        (#match? @origin "var[(].(GITHUB_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN).[)]")
        (#eq? @token @sent) (#eq? @post "post") (#eq? @body "body") (#eq? @send "send")
        (#match? @destination "https://(api[.]telegram[.]org|discord(app)?[.]com)/"))
  crit: notable
