defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.9


traits:
  - id: environment-stdin-curl-command-text
    desc: Environment-to-curl stdin upload command text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(env|printenv)\s*\|\s*curl\b[^\r\n|;]{0,120}(-d|--data(-binary)?)\s+@-\s+https?://'
