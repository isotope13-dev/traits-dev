defaults:
  platforms: [linux, macos]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: shell-secret-env-curl-body
    desc: Curl body contains developer credential variable
    if:
      type: tree-sitter
      kind: call
      regex: '\bcurl[^\n]{0,80}(-d|--data(-binary)?)\s+"[^"\n]{0,60}\$\{?\w*(TOKEN|KEY)\b' 
  - id: shell-sensitive-tar-curl-pipeline
    desc: Uploads archive of developer credential files
    if:
      type: tree-sitter
      language: shell
      query: |
        (pipeline
          (command name: (command_name (word) @producer)) @bundle
          (command name: (command_name (word) @client)) @upload
          (#eq? @producer "tar")
          (#eq? @client "curl")
          (#match? @bundle "czf\\s+-")
          (#match? @bundle "(\\.aws/credentials|\\.npmrc|\\.pypirc|\\.ssh/id_rsa)")
          (#match? @upload "--data-binary\\s+@-"))
