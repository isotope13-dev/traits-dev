defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: node-request-credential-file-body
    desc: req/request sends credential file bytes
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(req|request)\.(write|end)$'
      arg:
        index: 0
        from:
          call: '(^|\.)readFileSync$'
          literal: '(^|[/\\])(\.cargo[/\\]credentials(\.toml)?|\.gem[/\\]credentials|\.git-credentials)$'
