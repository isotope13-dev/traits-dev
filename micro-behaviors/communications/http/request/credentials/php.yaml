defaults:
  crit: suspicious
  conf: 0.92
  platforms: [unix, windows]
  for: [php]
  attack: T1071.001
  mbc: C0002

traits:
  - id: php-hardcoded-authorization-field
    desc: PHP hardcoded authorization field
    if:
      type: text
      regex: "(?i)['\"](authorization|proxy-authorization|x-api-key)['\"]\\s*=>\\s*['\"][^'\"]{8,128}['\"]"
    unless:
      # A test asserting that the auth manager sets the header uses a
      # placeholder: apimatic core's AuthenticationTest.php expects
      # `'authorization' => 'accessToken'`.
      - id: metadata/package/testing/
      - id: well-known/app/publishing/wordpress-plugins/performance::wordpress-plugin-path-imagify
      # OAuth/API clients interpolate Bearer/token at runtime, not as literals.
      - type: text
        regex: "(?i)['\"]authorization['\"]\\s*=>\\s*['\"](bearer|token) \\{\\$"
      - type: text
        regex: "(?i)['\"]authorization['\"]\\s*=>\\s*['\"](bearer|token) \\$"
      # Tokens or schemes concatenated at runtime with . (single-quote equivalent of interpolation).
      - type: text
        regex: "(?i)['\"](authorization|proxy-authorization|x-api-key)['\"]\\s*=>\\s*['\"][^'\"]*['\"]\\s*\\."
      - id: "metadata/file/naming::test-directory-component"
  - id: php-hardcoded-token-field
    desc: PHP hardcoded API token field
    # Token values are contiguous ASCII; translated UI labels contain spaces.
    if:
      type: text
      regex: "(?i)['\"](x-auth-token|api[_-]?key)['\"]\\s*=>\\s*['\"][A-Za-z0-9_./+=:-]{8,128}['\"]"
    not:
      # Translation keys / localization strings (e.g. 'apikey' => 'mautic.integration.fullcontact.apikey')
      - regex: "['\"][a-z0-9_-]+(\\.[a-z0-9_-]+){2,}['\"]"
      # Attribute casting / hashing directives (e.g. 'api_key' => 'encrypted')
      - regex: "['\"](encrypted|hashed)['\"]"
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/publishing/wordpress-plugins/commerce::event-tickets-plugin-path

      - id: "metadata/file/naming::test-directory-component"
composite_rules:
  - id: php-hardcoded-http-credential-field
    desc: Hardcoded PHP HTTP credential
    any:
      - id: php-hardcoded-authorization-field
      - id: php-hardcoded-token-field
