defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001
  mbc: C0002

# Credential-bearing URLs are an HTTP authentication capability.  Theft or
# exfiltration intent requires a separate source/collection context.
traits:
  - id: python-credentialed-url
    desc: Python credentialed HTTP URL
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/app/development/jennifer/
      - type: path
        regex: '(?i)\\.j$'
    if:
      type: text
      regex: '(?i)https?://[^/\s:@]{1,120}:[^@\s]{1,160}@'

  - id: python-credential-file-near-http-upload
    desc: Python HTTP upload near credential file
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(\.pypirc|\.netrc|\.aws/credentials)[\s\S]{0,300}requests\.(post|put)'

  - id: python-auth-credential-parser-function
    desc: Defines auth credential header parser
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'def\s+auth_credential\s*\([^)]{0,120}\bheaders\b'

  - id: python-header-name-value-return
    desc: Returns header name and credential value
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'return\s+\{["'']headerName["'']:\s*\w+,\s*["'']value["'']:\s*\w+\}'

  - id: python-credential-payload-header-call
    desc: Maps credential payload into request headers
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '_credential_headers\(payload\.get\(["'']agent_auth_credential["'']\)\)'

  - id: python-post-method-keyword
    desc: Sets Python request method to POST
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bmethod\s*=\s*["'']POST["'']'

composite_rules:
  - id: python-request-auth-credential-extractor
    desc: Extracts credential from request headers
    crit: notable
    conf: 0.98
    scope: file
    near_bytes: 1200
    all:
      - id: python-auth-credential-parser-function
      - id: python-header-name-value-return

  - id: python-credential-payload-request-forwarding
    desc: Forwards credential payload by HTTP POST
    crit: notable
    conf: 0.98
    scope: file
    near_bytes: 1400
    all:
      - id: python-credential-payload-header-call
      - id: python-post-method-keyword
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
