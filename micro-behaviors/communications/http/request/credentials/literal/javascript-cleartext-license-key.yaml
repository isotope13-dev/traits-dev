# Browser extensions can put their license API base URL in a separate config
# asset and submit the entered key through a shared fetch wrapper.
defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip, javascript, typescript]

traits:
  - id: javascript-cleartext-ip-api-base
    desc: JavaScript config sets cleartext IP API base
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: 'http://([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?'
    not:
      - substr: 'http://127.0.0.1'

  - id: javascript-license-key-field
    desc: JavaScript request names a license key
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '\blicense[_-]?key\s*:'

  - id: javascript-license-activation-path
    desc: JavaScript references license activation path
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: /api/activate

  - id: javascript-license-api-config-use
    desc: Reads the license API configuration
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'window\.LICENSE_CONFIG[\s\S]{0,500}API_BASE'

composite_rules:
  - id: javascript-cleartext-license-key-submission
    desc: Sends license key to cleartext HTTP endpoint
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: javascript-cleartext-ip-api-base
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: javascript-license-key-field
      - id: javascript-license-activation-path
      - id: javascript-license-api-config-use
