defaults:
  crit: suspicious
  conf: 0.92
  platforms: [unix, windows]
  for: [php]
  attack: T1071.001
  mbc: C0002

traits:
  - id: php-hardcoded-authorization-field
    desc: PHP hardcoded authorization field
    # Token values are contiguous ASCII; error messages and UI text contain spaces.
    if:
      type: text
      regex: "(?i)['\"](proxy-)?authorization['\"]\\s*=>\\s*['\"][A-Za-z0-9_./+=:-]{8,128}['\"]"
    not:
      # Self-referential property map (e.g. 'authorization' => 'authorization')
      - regex: "(?i)['\"](proxy-)?authorization['\"]\\s*=>\\s*['\"](proxy-)?authorization['\"]"
      # OpenAPI examples use short Auth_123-style referral values; these are
      # placeholders, not HTTP credentials.
      - regex: "(?i)=>\\s*['\"]auth_[0-9]{1,6}['\"]"
      # Getter or setter method names (e.g. 'authorization' => 'setAuthorization')
      - regex: "(?i)=>\\s*['\"](get|set|is)[A-Z]"
      # Option, field, or constant names, not secrets: snake_case or CONSTANT_CASE
      - regex: "(?i)=>\\s*['\"][a-z]+(_[a-z]+)+['\"]"
    unless:
      # A test asserting that the auth manager sets the header uses a
      # placeholder: apimatic core's AuthenticationTest.php expects
      # `'authorization' => 'accessToken'`.
      - id: metadata/package/testing/
      - id: well-known/app/publishing/wordpress-plugins/performance::wordpress-plugin-path-imagify
      # OAuth/API clients interpolate Bearer/token at runtime, not as literals.
      - type: text
        regex: "(?i)['\"]authorization['\"]\\s*=>\\s*['\"](bearer|token) \\{\\$"
      - type: text
        regex: "(?i)['\"]authorization['\"]\\s*=>\\s*['\"](bearer|token) \\$"
      # Tokens or schemes concatenated at runtime with . (single-quote equivalent of interpolation).
      - type: text
        regex: "(?i)['\"](authorization|proxy-authorization|x-api-key)['\"]\\s*=>\\s*['\"][^'\"]*['\"]\\s*\\."
      - id: metadata/path::test-directory-component
  - id: php-hardcoded-token-field
    desc: PHP hardcoded API token field
    # Token values are contiguous ASCII; translated UI labels contain spaces.
    if:
      type: text
      regex: "(?i)['\"](x-auth-token|api[_-]?key)['\"]\\s*=>\\s*['\"][A-Za-z0-9_./+=:-]{8,128}['\"]"
    not:
      # Translation keys / localization strings (e.g. 'apikey' => 'mautic.integration.fullcontact.apikey')
      - regex: "['\"][a-z0-9_-]+(\\.[a-z0-9_-]+){2,}['\"]"
      # Attribute casting / hashing directives (e.g. 'api_key' => 'encrypted')
      - regex: "['\"](encrypted|hashed)['\"]"
      # Getter or setter method names (e.g. 'apiKey' => 'setApiKey')
      - regex: "(?i)=>\\s*['\"](get|set|is)[A-Z]"
      # Self-referential property map (e.g. 'x-auth-token' => 'x-auth-token')
      - regex: "(?i)['\"](x-auth-token|api[_-]?key)['\"]\\s*=>\\s*['\"](x-auth-token|api[_-]?key)['\"]"
      # Option, field, or constant names, not secrets: snake_case or
      # CONSTANT_CASE identifiers (a settings-migration map
      # 'api_key' => 'ovas_api_key', or a field-to-constant map
      # 'api_key' => 'WORDPLUS_BUNNY_API_KEY' whose value deployment
      # configuration supplies through that named constant).
      - regex: "(?i)=>\\s*['\"][a-z]+(_[a-z]+)+['\"]"
      # Google API keys identify a project and are designed for public client
      # configuration. The Google-key trait records these as notable service
      # metadata instead of suspicious hardcoded credentials.
      - regex: "(?i)['\"]api[_-]?key['\"]\\s*=>\\s*['\"]AIza[0-9A-Za-z_-]{35}['\"]"
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/publishing/wordpress-plugins/commerce::event-tickets-plugin-path
      - id: well-known/app/publishing/wordpress-plugins/site-admin::wordpress-plugin-path-atarim
      - id: well-known/lib/cloud/rackspace-opencloud::rackspace-opencloud-sdk
      # Documentation pages quote <?php usage examples that the type sniffer
      # reports as PHP; an apiKey shown in a fenced example is not a
      # hardcoded runtime credential (e.g. Gaufrette's open-cloud.md
      # Rackspace example).
      - id: metadata/file/extension/identity::markdown-file-basename

      - id: metadata/path::test-directory-component
composite_rules:
  - id: php-hardcoded-http-credential-field
    desc: Hardcoded PHP HTTP credential
    any:
      - id: php-hardcoded-authorization-field
      - id: php-hardcoded-token-field
