defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
traits:
  - id: python-cleartext-http-url-literal
    desc: Python source contains an HTTP URL literal
    if:
      type: string_literal
      regex: '(?i)^http://[^\s"''<>]{1,180}$'
  - id: python-license-key-payload-field
    desc: Names license key in Python payload
    if:
      type: text
      regex: '["''](card_key|license_key)["'']\s*:'
composite_rules:
  - id: python-license-key-cleartext-http-post
    desc: Sends license key to cleartext HTTP
    crit: suspicious
    conf: 0.93
    scope: file
    near_bytes: 4000
    all:
      - id: python-cleartext-http-url-literal
      - id: python-license-key-payload-field
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
