# Secret HTTP may-flow is required; authorization remains unproven.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: javascript-credential-env-http-candidate
  desc: Credential env access with secret HTTP flow
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/credentials::javascript-secret-http-content-candidate
  - id: micro-behaviors/communications/http/request/credentials::secret-http-request-flow
  any:
  - id: micro-behaviors/os/env/secret-name::javascript-credential-env-read
  - id: micro-behaviors/os/env/secret-name::javascript-cloud-creds
  - id: micro-behaviors/os/env/read::js-env-index-copy-to-object
  - id: micro-behaviors/os/env/enumeration::js-process-env-spread
  unless:
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-aws-runtime-context
  - id: micro-behaviors/communications/http/services/aws::sts-web-identity-exchange-context
  - id: well-known/tool/development/aube::aube-external-tools-download-context
  - id: well-known/tool/development/vscode-extension/jinicode::provider-user-agent
  - id: micro-behaviors/communications/http/services/deepseek::deepseek-chat-api-client
  - id: micro-behaviors/communications/http/request/oauth2::oauth2-client-provisioning-context
  - id: first-party-provider-endpoint-context
- id: first-party-provider-endpoint-context
  desc: First-party provider API endpoint context
  crit: exception
  any:
  - id: micro-behaviors/communications/http/services/github::github-api-host
  - id: micro-behaviors/communications/http/services/zeit::zeit-api-host
  - id: micro-behaviors/communications/http/services/cloudflare::cloudflare-api-host
  - id: micro-behaviors/communications/http/services/google::google-api-host-reference
