defaults:
  platforms: [unix]
  for: [python]
  crit: notable
traits:
  - id: python-serviceaccount-token-oob-request
    desc: Kubernetes token enters OOB request body
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?Request$'
      args:
      - index: 0
        from:
          value: '^https?://([a-z0-9-]+\.)?(webhook\.site|oastify\.com|interact\.sh)/'
      - from:
          field: data
          call: '^open$'
          literal: '(^|/)secrets/kubernetes\.io/serviceaccount/token$'
          through:
            - call: '(^|\.)read$'
              receiver: true
