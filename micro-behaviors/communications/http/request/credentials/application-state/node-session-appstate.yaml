defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-session-create-appstate-body
    desc: Serializes appState for session creation
    if:
      type: text
      regex: 'JSON\.stringify\s*\(\s*\{[^}]{1,180}\bappState\b'

  - id: node-session-create-post-route
    desc: Posts to a session creation route
    if:
      type: text
      regex: 'request\s*\(\s*["\x27]POST["\x27]\s*,\s*["\x27]/v1/sessions["\x27]\s*,\s*body'

composite_rules:
  - id: node-session-create-appstate-post
    desc: Posts appState in a session creation request
    all:
      - id: node-session-create-appstate-body
      - id: node-session-create-post-route

