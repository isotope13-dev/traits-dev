defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: authenticated-streaming-history-request
    desc: Requests authenticated streaming viewing history
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (identifier) @fetch
          arguments: (arguments . (_) @url
            . (object (pair key: (property_identifier) @key
              value: (string (string_fragment) @value))))) @request
          (#eq? @fetch "fetch")
          (#eq? @key "credentials")
          (#eq? @value "include")
          (#match? @url "https://(www\\.)?netflix\\.com/api/[^ ]{0,240}viewingActivity"))
