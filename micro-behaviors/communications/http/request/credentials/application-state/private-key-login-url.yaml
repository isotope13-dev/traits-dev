defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]

traits:
  - id: private-key-input-dom-lookup
    desc: Looks up privateKeyInput DOM field
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'getElementById("privateKeyInput")'
  - id: key-input-value-trim
    desc: Reads trimmed keyInput value into key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bkey\s*=\s*keyInput\.value\.trim\(\)'
  - id: fetch-login-key-template
    desc: Fetch login URL interpolates key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'fetch\([^;\nf]{0,160}/login/\\?\$\{key\}'

composite_rules:
  - id: private-key-input-login-url
    desc: Private-key input value sent in login URL path
    crit: suspicious
    conf: 0.97
    near_lines: 10
    all:
      - id: private-key-input-dom-lookup
      - id: key-input-value-trim
      - id: fetch-login-key-template
