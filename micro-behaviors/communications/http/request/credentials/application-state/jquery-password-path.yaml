defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.95
traits:
  - id: jquery-getjson-password-path
    desc: jQuery URL contains encoded password path
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @library
            property: (property_identifier) @method)
          arguments: (arguments . (_) @url))
          (#match? @library "^(\\$|jQuery)$")
          (#eq? @method "getJSON")
          (#match? @url "(?i)/password/[\"']\\s*\\+\\s*encodeURIComponent\\s*\\("))
