defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
composite_rules:
  - id: page-password-fields-remote-json-post
    desc: Page password value sent in remote JSON POST
    # Require a const-bound password .value in the same fetch body. UI,
    # serialization and a network client elsewhere in the file are insufficient.
    scope: file
    all:
      - id: micro-behaviors/ui/controls/credential::browser-credential-field-pair
      - id: micro-behaviors/communications/http/post::password-input-value-json-post
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::single-nonexistent-fetch-example
      - id: metadata/package/documentation/security-testing::authorized-fenced-testing-skill
