defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text]

composite_rules:
  # Fetch may be called directly with a JSON body or routed through an
  # obfuscator operator table (`ops[k](fetch, url, opts)`).
  - id: browser-token-snapshot-beside-authenticated-fetch
    desc: Browser token snapshot beside authenticated fetch
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/db/read/key-value::oauth-token-field-from-local-storage
      - id: micro-behaviors/data/db/access::both-web-stores-in-snapshot-object
      - id: micro-behaviors/data/serialize/schema-credential::api-key-field-name
    any:
      - id: micro-behaviors/communications/http/request/computed::js-fetch-computed-helper-argument
      - id: micro-behaviors/communications/http/request/body/construction::fetch-json-bracket-body-text
    near_bytes: 4096
