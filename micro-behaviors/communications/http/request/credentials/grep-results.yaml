# Structural binding, not file-wide co-occurrence. A grep command's output
# must be included in the aggregate passed to curl --data-binary. This is
# source-local evidence; it does not model arbitrary reassignment or execution.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: shell-credential-grep-result-curl-body
    desc: Credential grep results enter curl body
    if:
      type: tree-sitter
      language: shell
      query: |
        (program
         (variable_assignment name: (variable_name) @result value: (command_substitution) @scan)
         (variable_assignment name: (variable_name) @body value: (string (simple_expansion (variable_name) @included)))
         (list (command name: (command_name (word) @client) argument: (word) @option argument: (string (simple_expansion (variable_name) @sent))) @upload)
         (#match? @scan "\\bgrep\\b")
         (#match? @scan "AKIA\\[")
         (#eq? @result @included)
         (#eq? @body @sent)
         (#eq? @client "curl")
         (#eq? @option "--data-binary")
         (#match? @scan "grep[ \\t]+-[A-Za-z]*o[A-Za-z]*")
         (#match? @upload "https?://[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+"))
  - id: shell-aws-context-result-curl-body
    desc: AWS grep context enters curl body
    if:
      type: tree-sitter
      language: shell
      query: |
        (program
         (variable_assignment name: (variable_name) @result value: (command_substitution) @scan)
         (variable_assignment name: (variable_name) @body value: (string (simple_expansion (variable_name) @included)))
         (list (command name: (command_name (word) @client) argument: (word) @option argument: (string (simple_expansion (variable_name) @sent))) @upload)
         (#match? @scan "\\bgrep\\b")
         (#match? @scan "AKIA\\[")
         (#eq? @result @included)
         (#eq? @body @sent)
         (#eq? @client "curl")
         (#eq? @option "--data-binary")
         (#match? @scan "grep[^\\n]{0,32}-[ABC][ \\t]*[1-9]")
         (#match? @upload "https?://[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+"))
