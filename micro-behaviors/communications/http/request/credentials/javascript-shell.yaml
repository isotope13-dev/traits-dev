defaults:
  for: [javascript]
  platforms: [unix]
  crit: notable
  conf: 0.97

traits:
  - id: execfile-env-upload-shell-argv
    desc: execFile receives environment-upload shell argv
    # Reject possible lexical replacements anywhere in this bounded form.
    # These guards deliberately favor omissions over assuming a local function
    # is Node's API. They are not general JavaScript binding resolution.
    unless:
      - type: tree-sitter
        language: javascript
        query: |
          ([
            (formal_parameters) @binding
            (variable_declarator name: (identifier) @binding)
            (function_declaration name: (identifier) @binding)
            (function_expression name: (identifier) @binding)
            (generator_function_declaration name: (identifier) @binding)
            (generator_function name: (identifier) @binding)
            (class_declaration name: (identifier) @binding)
            (assignment_expression left: (_) @binding)
            (augmented_assignment_expression left: (_) @binding)
            (arrow_function parameter: (identifier) @binding)
            (catch_clause parameter: (_) @binding)
            (for_in_statement left: (_) @binding)
            (import_statement) @binding
          ] (#match? @binding "\\b(execFile|require)\\b"))
      - type: tree-sitter
        language: javascript
        query: |
          (variable_declarator name: [(object_pattern) (array_pattern)] @binding
            value: (_) @value
            (#match? @binding "\\b(execFile|require)\\b")
            (#not-match? @value "^require\\([\"'](node:)?child_process[\"']\\)$"))
          (variable_declarator name: [(object_pattern) (array_pattern)] @binding
            (#match? @binding "\\b(execFile|require)\\b")
            (#not-match? @binding "^\\{\\s*execFile\\s*\\}$"))
      - type: tree-sitter
        language: javascript
        query: |
          [(with_statement) @scope
           (call_expression function: (identifier) @dynamic
             (#match? @dynamic "^(eval|Function)$"))]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression function: (identifier) @exec
          arguments: [(arguments
            . (string . (string_fragment) @shell .)
            . (array
              . (string . (string_fragment) @mode .)
              . [
                (string . (string_fragment) @body @url .)
                (binary_expression
                  left: (string . (string_fragment) @body .)
                  operator: "+"
                  right: (string . (string_fragment) @url .))
              ] .) .)
            (arguments
              . (string . (string_fragment) @shell .)
              . (array
                . (string . (string_fragment) @mode .)
                . [
                  (string . (string_fragment) @body @url .)
                  (binary_expression
                    left: (string . (string_fragment) @body .)
                    operator: "+"
                    right: (string . (string_fragment) @url .))
                ] .)
              . [(arrow_function) (function_expression)] .)]
          (#eq? @exec "execFile")
          (#match? @shell "^(/bin/)?(sh|bash|zsh)$")
          (#eq? @mode "-c")
          (#match? @body "^(env|printenv)\\s*\\|\\s*grep\\s+-[iE]+\\s+'[A-Za-z_|]+'\\s*\\|\\s*curl\\s+((-[fsSLv]+|--silent|--fail|--location|--show-error)\\s+)*(-m\\s+[0-9]+\\s+)?(-d|--data(-binary)?)\\s+@-\\s+(https?://[^ ]+)?$")
          (#match? @body "(?i)grep\\s+-[iE]*E[iE]*\\s+'[^']*(TOKEN|SECRET|PASSWORD|API_KEY)[^']*'")
          (#match? @url "(^|@-\\s+)https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}(:[0-9]+)?/[-A-Za-z0-9_./%]*$")
          (#not-match? @url "(?i)\\.localhost[:/]"))
