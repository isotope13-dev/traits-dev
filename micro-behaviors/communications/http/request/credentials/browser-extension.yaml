defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, crx, xpi, zip]

composite_rules:
  # An extension login may legitimately serialize the user's own credentials
  # to its declared service. Keep this as analyst-visible capability evidence;
  # page credential theft requires separate page-read and collection legs.
  - id: extension-login-credential-remote-post
    desc: Extension login sends email and password remotely
    crit: notable
    conf: 0.96
    scope: archive
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/active-tab::permission-active-tab
      - id: micro-behaviors/data/serialize/json::email-password-json-body
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
