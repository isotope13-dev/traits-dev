defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: curl-ci-token-body-command
    desc: curl request body references CI token
    crit: notable
    conf: 0.95
    for: [text, scripts, source]
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,80}(-d|--data(-binary)?)\s+["'']?\$\{?CI_\w*TOKEN'
