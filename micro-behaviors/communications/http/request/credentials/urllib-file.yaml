defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-file-urllib-request-body
    desc: File contents enter urllib request body
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?Request$'
      arg:
        from:
          field: data
          call: '^open$'
          through:
            - call: '(^|\.)read$'
              receiver: true
composite_rules:
  - id: python-urllib-file-upload
    desc: Sends urllib request with file contents
    conf: 0.95
    all:
      - id: python-file-urllib-request-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
