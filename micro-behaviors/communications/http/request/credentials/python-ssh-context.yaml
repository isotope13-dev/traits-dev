defaults:
  platforms: [linux, macos, windows]
  for: [python]


composite_rules:
- id: python-ssh-listing-upload-context
  desc: SSH listing and HTTP upload code co-occur
  crit: notable
  conf: 0.97
  # Proximity does not bind file contents to the request body.
  near_lines: 60
  all:
  - id: micro-behaviors/fs/directory/readdir::python-ssh-directory-listing-context
  any:
  - id: micro-behaviors/communications/http/request/body::http-upload-or-body-sink
  - id: micro-behaviors/communications/http/post::source-post-method-literal
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
