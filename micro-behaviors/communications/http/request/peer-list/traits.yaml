# HTTP requests for a keyed node/peer/relay list.  The URL shape is a
# protocol artifact; C2 intent is inferred only when it is combined with a
# blockchain name-service pointer or a transparent relay.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, javascript, typescript, java, ruby]
  attack: T1071.001
  mbc: C0002
  crit: notable
  conf: 0.9

traits:
  - id: keyed-peer-list-url
    desc: HTTP keyed peer or relay list URL
    if:
      type: string_literal
      regex: '(?i)https?://[^"\s]{1,160}/(nodes|peers|relays)\?[^"\s]{1,160}[a-z][a-z0-9_-]{0,32}='

  - id: parsed-peer-list-response
    desc: Parses peer list JSON
    if:
      type: text
      regex: '(?is)json\.(loads|parse).{0,160}\b(peers|relays)\b'

composite_rules:
  - id: keyed-peer-list-discovery
    desc: Fetches a keyed HTTP peer or relay list
    crit: notable
    conf: 0.94
    all:
      - id: keyed-peer-list-url
    any:
      - id: micro-behaviors/data/format/json::peer-list-json-field
      - id: parsed-peer-list-response
