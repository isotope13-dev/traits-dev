defaults:
  platforms: [unix]
  for: [javascript, typescript]

composite_rules:
  # Proximity records co-occurrence; it does not bind the POST target to the host.
  - id: node-collect-post-and-remote-host
    desc: Collection POST and remote host references
    crit: notable
    conf: 0.94
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/collect::node-http-collect-post
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
