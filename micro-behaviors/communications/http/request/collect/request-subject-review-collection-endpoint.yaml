# An endpoint named collect/capture/harvest does not establish a file upload.
# Keep the precise request/argument match as a POST observation.
defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1071.001

traits:
  - id: python-collect-post
    desc: Python requests POST to collection endpoint
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: requests.post
      arg:
        kind: string
        regex: '(?i)/(collect(ion)?|captur(e|ed)|harvest)(/|$)|/panel/[^/?#]{0,40}(captur(e|ed)|collect|token)(/|$)'

