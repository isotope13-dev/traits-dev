defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - json
traits:
- id: python-workflow-create-request
  desc: Python workflow creation request
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: (?i)requests\.post\s*\(.{0,300}/api/v1/workflows\b
- id: javascript-workflow-create-request
  desc: JavaScript workflow creation request
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?is)fetch\s*\(.{0,300}/api/v1/workflows\b.{0,180}method\s*:\s*["']POST
- id: curl-workflow-create-request
  desc: curl workflow creation request
  crit: notable
  conf: 0.9
  for:
  - shell
  - powershell
  if:
    type: text
    regex: (?is)curl\b[^b\n]{0,160}(-X|--request)\s+POST[^T\n]{0,160}/api/v1/workflows\b
- id: python-workflow-delete-request
  desc: Python workflow deletion request
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: (?i)requests\.delete\s*\(.{0,300}/api/v1/workflows\b
- id: javascript-workflow-delete-request
  desc: JavaScript workflow deletion request
  crit: notable
  conf: 0.93
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?is)fetch\s*\(.{0,300}/api/v1/workflows\b.{0,180}method\s*:\s*["']DELETE
- id: curl-workflow-delete-request
  desc: curl workflow deletion request
  crit: notable
  conf: 0.93
  for:
  - shell
  - powershell
  if:
    type: text
    regex: (?is)curl\b[^b\n]{0,160}(-X|--request)\s+DELETE[^E\n]{0,160}/api/v1/workflows\b
composite_rules:
- id: workflow-create-request
  desc: Workflow creation request
  crit: notable
  conf: 0.94
  any:
  - id: micro-behaviors/communications/http/request/automation-management::python-workflow-create-request
  - id: micro-behaviors/communications/http/request/automation-management::javascript-workflow-create-request
  - id: micro-behaviors/communications/http/request/automation-management::curl-workflow-create-request
- id: workflow-delete-request
  desc: Workflow deletion request
  crit: notable
  conf: 0.96
  any:
  - id: micro-behaviors/communications/http/request/automation-management::python-workflow-delete-request
  - id: micro-behaviors/communications/http/request/automation-management::javascript-workflow-delete-request
  - id: micro-behaviors/communications/http/request/automation-management::curl-workflow-delete-request
