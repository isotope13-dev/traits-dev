# Drupal's /core/install.php exposes the active database driver and a
# site-name field as plain installer form fields. Neither is suspicious
# alone: a stock SQLite installer legitimately names its own database file,
# and a site name is free text. The exploit composite in
# objectives/execution/exploit/chain/web-application requires the SQLite
# driver to be paired with a database path under the web root ending in
# .php, and the site-name field to carry a PHP opening tag.
defaults:
  platforms: [unix, windows]
  for: [python, shell, text]
  attack: T1190

traits:
  - id: install-sqlite-driver-class-param
    desc: References Drupal SQLite driver class
    crit: component
    conf: 0.9
    if:
      type: text
      # Tolerate the literal PHP namespace separator, a source-escaped
      # double backslash, and the URL-encoded wire form (%5C) between
      # each segment.
      regex: 'Driver[\\%][0-9A-Za-z\\]{0,2}Database[\\%][0-9A-Za-z\\]{0,2}sqlite'

  - id: install-database-path-php-extension
    desc: Sets install database path to .php file
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)database[^\n]{0,12}=[^\s&]{1,160}\.php\b'

  - id: install-configure-site-name-php-open-tag
    desc: Writes PHP tag into site_name field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)site_name\s*[:=]\s*.{0,24}(<\?php|%3C%3Fphp)'

  - id: authorize-endpoint-target
    desc: Targets Drupal authorize.php endpoint
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)/core/authorize\.php\b'
