defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: httpx-get
    desc: httpx.get call
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: httpx.get
  - id: npm-postinstall-httpx-oast-body-post
    desc: HTTPX POST sends body to OAST
    conf: 0.96
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: 'httpx\.post\([^)]{0,160}oastify\.com[^)]{0,160}content\s*=\s*body'
  - id: httpx-client-get
    desc: httpx Client GET request
    conf: 0.9
    if:
      type: tree-sitter
      language: python
      query: |
        (with_statement
          (with_clause
            (with_item
              value: (as_pattern
                (call
                  function: (attribute
                    object: (identifier) @module
                    attribute: (identifier) @constructor))
                alias: (as_pattern_target) @client)))
          body: (block
            (expression_statement
              (call
                function: (attribute
                  object: (identifier) @bound
                  attribute: (identifier) @method))))
          (#eq? @module "httpx")
          (#eq? @constructor "Client")
          (#eq? @method "get")
          (#eq? @client @bound))
composite_rules:
  - id: httpx-async-client-post
    desc: httpx AsyncClient POST request
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/client/initialize::httpx-async-client
      - id: micro-behaviors/communications/http/post::http-post-client-call
