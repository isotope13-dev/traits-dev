defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text]

traits:
- id: aws-lambda-runtime-api-environment-key
  desc: Reads AWS Lambda runtime API address
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: AWS_LAMBDA_RUNTIME_API
- id: aws-lambda-runtime-invocation-next-route
  desc: Calls Lambda runtime invocation next route
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: /2018-06-01/runtime/invocation/next
- id: aws-lambda-runtime-request-id-header
  desc: Reads Lambda runtime request identifier
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: lambda-runtime-aws-request-id
