# A User-Agent header whose entire value is the host OS identifier tells the
# server which platform-specific response to return. Browsers and HTTP
# libraries send product tokens; a bare `linux`/`darwin`/`win32` string is a
# host report that lets the remote end choose a per-OS payload.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-user-agent-host-platform
    desc: Sends host OS platform as User-Agent
    crit: notable
    conf: 0.93
    attack: T1082
    if:
      type: text
      regex: '(?i)[''"]?user-agent[''"]?\s*:\s*(process\.platform|os\.(platform|type)\(\))\s*[,}]'
