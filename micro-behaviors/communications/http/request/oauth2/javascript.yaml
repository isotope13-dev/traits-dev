# OAuth2/OIDC provisioning requests: first-party tooling that registers an
# OAuth2 client with its own authorization server (Hydra, Keycloak, ORY
# Auditor-style bootstraps). The request destination is the operator's own
# service (its host read from the environment), and the body is an RFC 7591
# dynamic client registration. A stealer posts secrets to infrastructure it
# chose; this posts registration data to the service that requires it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: js-request-hostname-from-env
    desc: JS request to an env-configured host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'hostname\s*:\s*process\.env\.[A-Z_]+'
  - id: oauth2-client-registration-body
    desc: OAuth2 dynamic client registration body
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'grant_types[\s\S]{0,200}token_endpoint_auth_method'

composite_rules:
  - id: oauth2-client-provisioning-context
    desc: OAuth2 client provisioning request context
    crit: exception
    all:
      - id: js-request-hostname-from-env
      - id: oauth2-client-registration-body
