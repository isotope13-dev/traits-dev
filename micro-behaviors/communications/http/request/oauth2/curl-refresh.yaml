# A parsed request ties the refresh grant to the identity-provider URL.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: curl-microsoft-refresh-grant-quoted
    desc: curl requests a Microsoft OAuth refresh grant
    if:
      type: symbol
      kind: call
      exact: curl
      args:
        - substr: grant_type=refresh_token
        - substr: https://login.microsoftonline.com/

  - id: curl-microsoft-refresh-grant-unquoted
    desc: curl has unquoted Microsoft refresh URL
    if:
      type: symbol
      kind: call
      exact: curl
      args:
        - substr: grant_type=refresh_token
        - name_regex: '^https://login[.]microsoftonline[.]com/'

composite_rules:
  - id: curl-microsoft-refresh-grant
    desc: curl requests a Microsoft OAuth refresh grant
    any:
      - id: curl-microsoft-refresh-grant-quoted
      - id: curl-microsoft-refresh-grant-unquoted
