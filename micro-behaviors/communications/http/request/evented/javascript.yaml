# Evented HTTP request/response handoff
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: node-evented-get-response
    desc: Node get call receives an evented response
    crit: notable
    conf: 0.9
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      # A callback alone also matches chrome.storage.local.get. Require
      # a data-event handler inside the callback body. Keep receiver and
      # parameter names free so bundled/aliased HTTP clients still match.
      regex: '\.get\s*\([^(]{0,400},\s*\(?\s*[\w$]+\s*\)?\s*=>\s*\{?[^{}]{0,240}\.on\s*\(\s*["'']data["'']'
  - id: node-aliased-get-response-cycle
    desc: Aliased get drives evented response handlers
    crit: notable
    conf: 0.85
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      # Companion to node-evented-get-response for clients whose event
      # names are computed (decoder-built 'data'/'end'/'error'): instead of
      # a literal 'data' string, require two response handlers inside the
      # callback body so a lone .get( plus an unrelated .on( cannot supply
      # the cycle. (The engine's regex flavor has no backreferences, so the
      # two handlers are not bound to the same receiver by name.)
      regex: '\.get\([^()]{0,40},[^;]{0,40}=>\s*\{?[^{}]{0,120}\.on\([\s\S]{0,150}?\.on\s*\('
