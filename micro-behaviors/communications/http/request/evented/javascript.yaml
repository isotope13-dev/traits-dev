# Evented HTTP request/response handoff
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: node-evented-get-response
    desc: Node get call receives an evented response
    crit: notable
    conf: 0.9
    if:
      type: text
      # The callback parameter name is the attacker's to choose (eslint-scope
      # used `r`), so bind on the arrow shape rather than a name whitelist.
      # The callback parameter name is the attacker's to choose (eslint-scope
      # used `r`), and the request options object is routinely spread over
      # many lines, so bind on the arrow shape and let the gap cross newlines.
      regex: '\.get\s*\([^(]{0,400}?,\s*\(?\s*[A-Za-z_$][\w$]*\s*\)?\s*=>'
