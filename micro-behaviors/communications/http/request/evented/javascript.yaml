# Evented HTTP request/response handoff
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: node-evented-get-response
    desc: Node get call receives an evented response
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.get\s*\([^;\n]{0,260},\s*(res|response|resp|r2)\s*=>'
