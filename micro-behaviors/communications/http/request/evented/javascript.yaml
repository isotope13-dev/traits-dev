# Evented HTTP request/response handoff
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: node-evented-get-response
    desc: Node get call receives an evented response
    crit: notable
    conf: 0.9
    if:
      type: text
      # A callback alone also matches chrome.storage.local.get. Require
      # a data-event handler inside the callback body. Keep receiver and
      # parameter names free so bundled/aliased HTTP clients still match.
      regex: '\.get\s*\([^(]{0,400},\s*\(?\s*[\w$]+\s*\)?\s*=>\s*\{?[^{}]{0,240}\.on\s*\(\s*["'']data["'']'
