composite_rules:
- id: exploit-endpoint
  desc: Admin/CGI endpoint with scanner context
  conf: 0.85
  size_max: 5000
  all:
  - id: micro-behaviors/communications/url/resource-path/administration::admin-cgi-path-reference
  any:
  - id: micro-behaviors/fs/read/file/target::ip-list-var
  - id: micro-behaviors/fs/read/file/target::targets-word
  - id: metadata/package/documentation/security-advisory::cve-reference
  - id: metadata/lang/source/literal/embedded-source::for-loop-iteration
  - id: micro-behaviors/communications/http/request/url-computed::python-post-fstring-url
  - id: micro-behaviors/communications/url/resource-path/administration::shell-script-filename-reference
  - id: metadata/lang/source/literal/string/shape::dollar-number-path-reference
  - id: metadata/lang/source/syntax/call/invocation::shell-exec-pattern
- id: scanner-marker-strong
  desc: Scanner or exploit context marker
  conf: 0.75
  any:
  - id: micro-behaviors/data/parse/vocabulary::pawn-keyword
  - id: micro-behaviors/fs/read/file/target::host-or-target-named-file-read
  - id: micro-behaviors/fs/read/file/target::ip-list-var
  - id: micro-behaviors/fs/read/file/target::targets-word
  - id: metadata/package/documentation/security-advisory::cve-reference
  - id: micro-behaviors/communications/http/request/scanner::exploit-endpoint
  - id: micro-behaviors/communications/http/request/url-computed::python-post-fstring-url
- id: scanner-marker
  desc: Scanner or exploit marker
  conf: 0.8
  any:
  - id: micro-behaviors/data/parse/vocabulary::pawn-keyword
  - id: micro-behaviors/fs/read/file/target::host-or-target-named-file-read
  - id: micro-behaviors/fs/read/file/target::ip-list-var
  - id: micro-behaviors/fs/read/file/target::targets-word
  - id: metadata/lang/source/literal/embedded-source::for-loop-iteration
  - id: metadata/package/documentation/security-advisory::cve-reference
  - id: micro-behaviors/communications/http/request/scanner::exploit-endpoint
  - id: micro-behaviors/communications/http/request/url-computed::python-post-fstring-url
- id: network-request-target-loop
  desc: HTTP POST over target loop
  conf: 0.72
  near_lines: 30
  all:
  - id: metadata/lang/source/literal/embedded-source::for-loop-iteration
  - id: micro-behaviors/communications/http/request/scanner::scanner-marker-strong
  - id: micro-behaviors/communications/http/request/verb::python-http-post-any
- id: file-upload-exploit
  desc: File upload exploitation tool
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/request/multipart::files-dict
  - id: micro-behaviors/fs/read/file/content/unspecified::file-read-content
  - id: micro-behaviors/communications/http/request/verb::python-http-post-any
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
- id: cve-admin-endpoint-http-post
  desc: HTTP POST with CVE and admin endpoint context
  crit: notable
  conf: 0.95
  mbc: B0030
  all:
  - id: micro-behaviors/communications/http/request/verb::python-http-post-any
  - id: micro-behaviors/communications/url/resource-path/administration::admin-cgi-path-reference
  any:
  - id: micro-behaviors/fs/read/file/target::host-or-target-named-file-read
  - id: metadata/package/documentation/security-advisory::cve-reference
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
