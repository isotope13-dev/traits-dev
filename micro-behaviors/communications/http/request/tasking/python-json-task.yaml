defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-post-json-response-assignment
    desc: Assigns HTTP POST JSON response
    if:
      type: tree-sitter
      kind: assignment
      regex: '^[A-Za-z_][A-Za-z_0-9]*\s*=\s*(requests|httpx)\.post\([^\n]{0,400}\)\.json\(\)'
