defaults:
  platforms: [windows, unix]
  # The syntax parser also extracts Python from source files shipped under a
  # text extension (for example a .txt staged script), so keep this narrow
  # behavior profile available on those files too.
  for: [python, text]
traits:
  - id: python-get-poll-request
    desc: GET request helper targets poll URL
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: request
      args:
        - index: 0
          kind: string
          exact: GET
        - index: 1
          kind: string
          substr: /poll
composite_rules:
  - id: python-poll-shell-handler-result-profile
    desc: HTTP polling with shell handlers and postback
    crit: notable
    conf: 0.98
    for: [python]
    all:
      - id: micro-behaviors/data/property/access::mapping-command-key-access
      - id: python-get-poll-request
      - id: micro-behaviors/data/control-flow/dispatch/selector::python-command-record-handler-dispatch
      - id: micro-behaviors/communications/http/request/result::python-handler-result-post
      - id: micro-behaviors/process/create/shell-subprocess::python-parameter-command-shell
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/data/control-flow/loop::python-unconditional-while-header
