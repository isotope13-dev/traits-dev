defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-get-poll-request
    desc: GET request helper targets poll URL
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: request
      args:
        - index: 0
          kind: string
          exact: GET
        - index: 1
          kind: string
          substr: /poll
composite_rules:
  - id: python-poll-shell-handler-result-profile
    desc: HTTP polling with shell handlers and postback
    crit: notable
    conf: 0.98
    all:
      - id: http-task-command-field-read
      - id: python-get-poll-request
      - id: micro-behaviors/data/control-flow/dispatch::python-command-record-handler-dispatch
      - id: micro-behaviors/communications/http/request/result::python-handler-result-post
      - id: micro-behaviors/process/create/shell-subprocess::python-parameter-command-shell
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/data/control-flow/loop::python-while-true
