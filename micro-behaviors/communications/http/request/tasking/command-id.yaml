# A task identifier field is protocol data. It needs a command/task consumer
# before it supports remote-control intent.
defaults:
  platforms: [windows, unix]
  for: [shell, javascript, java, go, csharp, kotlin, pe, dll]

traits:
  - id: command-id-camel-object-property
    desc: Command ID object field
    crit: component
    conf: 0.99
    for: [javascript, typescript]
    if:
      # An unquoted object key after "{" or ",".  A text match replaces the
      # tree-sitter pair query, whose full-tree walk was a rule-perf outlier
      # on 340 KB minified bundles; comments are masked.
      type: text
      regex: '(^|[{,])\s*commandId\s*:'
      exclude_comments: true

  - id: command-id-field-name
    desc: command_id task field name
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(["'']command_id["'']\s*[:,)]|(^|[,{]\s*)command_id\s*:)'
