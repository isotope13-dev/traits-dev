# Neutral structured-request observations. Objective composites add process
# execution and a result payload before inferring command tasking.
#
# The field matchers are intentionally case-sensitive: lower-case keys are
# wire/schema evidence, while exported Go fields such as `Command:` and
# `Sequence:` are ordinary local structs and are not HTTP tasking.
defaults:
  platforms: [windows, unix]
  for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]
  attack: T1071.001
  mbc: C0002

traits:
  - id: http-task-command-field
    desc: Structured object contains a command field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(^|[,{]\s*)["''](cmd|command)["'']\s*:'

  - id: http-task-command-field-read
    desc: Reads structured task command field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(\.get\(\s*["''](cmd|command)["'']\s*\)|\[\s*["''](cmd|command)["'']\s*\])'

  - id: python-json-response-command-read
    desc: Reads command from Python JSON response
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '\.json\(\)\.get\(\s*["'']command["'']'

  - id: structured-task-id-field
    desc: Structured task identifier field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["''](cmd|command|task)_id["'']\s*[:),\]]'

  - id: structured-task-timeout-seconds-field
    desc: Structured task timeout-seconds field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["''](timeout|timeout_secs|timeout_seconds)["'']\s*[:),\]]'

  - id: http-task-liveness-field
    desc: Structured object contains a liveness field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(ping|heartbeat|alive)\b["'']?\s*:'

  # http-task-sequence-field relocated to
  # micro-behaviors/data/serialize/schema-object/traits.yaml: a field named
  # seq/sequence/task_id is a generic schema observation, present in journal
  # structs and ordering fields everywhere; only the composites add the
  # C2-tasking context.

composite_rules:
  - id: http-command-argument-fields
    desc: Structured object has command and argument fields
    crit: component
    conf: 0.9
    near_bytes: 512
    all:
      - id: http-task-command-field
      - id: micro-behaviors/data/source/syntax/schema::object-arguments-field

  - id: http-liveness-sequence-fields
    desc: Structured object has liveness and sequence fields
    crit: component
    conf: 0.9
    near_bytes: 512
    all:
      - id: http-task-liveness-field
      - id: micro-behaviors/data/serialize/schema-object::structured-sequence-field
