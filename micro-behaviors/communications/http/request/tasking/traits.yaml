# Neutral HTTP request-schema observations.  Objective composites add process
# execution and result-upload context before inferring command tasking.
defaults:
  platforms: [windows, unix]
  for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]
  attack: T1071.001
  mbc: C0002

traits:
  - id: http-task-command-field
    desc: HTTP request contains a command field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?(cmd|command)["'']?\s*[:=]'

  - id: http-task-argument-field
    desc: HTTP request contains an argument field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?(arg|args|argument)["'']?\s*[:=]'

  - id: http-task-liveness-field
    desc: HTTP request contains a liveness field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?(ping|heartbeat|alive)["'']?\s*[:=]'

  - id: http-task-sequence-field
    desc: HTTP request contains a task sequence field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?(seq|sequence|task_id)["'']?\s*[:=]'

composite_rules:
  - id: http-command-argument-fields
    desc: HTTP request has command arguments
    crit: component
    conf: 0.9
    all:
      - id: http-task-command-field
      - id: http-task-argument-field

  - id: http-liveness-sequence-fields
    desc: HTTP request has liveness sequencing
    crit: component
    conf: 0.9
    all:
      - id: http-task-liveness-field
      - id: http-task-sequence-field
