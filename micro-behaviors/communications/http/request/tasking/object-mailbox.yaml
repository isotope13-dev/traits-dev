# Go method names that build inbox/outbox object keys or write a liveness
# object: the vocabulary of a store-and-forward message queue layered over a
# shared bucket or file store. Neutral by itself (sync agents and job queues
# use the same layout); objective composites add a storage client, process
# execution and an embedding context before inferring tasking.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.88
  attack: T1102.002
  size_min: 1000000

traits:
  - id: go-inbox-key-method
    desc: Go method builds inbox item keys
    if:
      type: text
      regex: '\)\.\w{0,24}[Ii]nbox(Prefix|Item\w{0,8}|Key)\b'
  - id: go-outbox-key-method
    desc: Go method builds outbox result keys
    if:
      type: text
      regex: '\)\.\w{0,24}[Oo]utbox(Prefix|Result\w{0,8}|Item\w{0,8}|Key)\b'
  - id: go-liveness-object-method
    desc: Go method writes a liveness object
    if:
      type: text
      regex: '\)\.([Pp]ut|key|[Ww]rite)Liveness\b'

composite_rules:
  - id: go-inbox-outbox-key-methods
    desc: Go methods build inbox and outbox object keys
    all:
      - id: go-inbox-key-method
      - id: go-outbox-key-method
