defaults:
  crit: notable
  platforms: [windows, unix]
  for: [binaries, scripts]
traits:
  - id: m-search
    desc: SSDP M-SEARCH discovery request
    conf: 0.9
    mbc: C0002
    attack: T1046
    if:
      type: text
      substr: M-SEARCH * HTTP/1.1
  - id: discover-header
    desc: SSDP discover MAN header
    conf: 0.88
    mbc: C0002
    attack: T1046
    if:
      type: text
      exact: 'MAN: "ssdp:discover"'
  - id: broadcast-host
    desc: SSDP broadcast host header
    conf: 0.9
    mbc: C0002
    attack: T1046
    if:
      type: text
      regex: '(HOST: 255\.255\.255\.255:1900)'
  - id: upnp-dial-service-urn
    desc: UPnP DIAL service URN
    conf: 0.82
    mbc: C0002
    attack: T1046
    if:
      type: text
      exact: "ST: urn:dial-multiscreen-org:service:dial:1"
  - id: chrome60-windows-ua
    desc: Chrome 60 Windows User-Agent
    conf: 0.78
    mbc: C0002
    attack: T1071.001
    if:
      type: text
      exact: "USER-AGENT: Google Chrome/60.0.3112.90 Windows"
  - id: snquery-loopback-probe
    desc: SNQUERY loopback probe string
    conf: 0.84
    mbc: C0002
    attack: T1046
    if:
      type: text
      exact: "SNQUERY: 127.0.0.1:AAAAAA:xsvr"
composite_rules:
  # SSDP discovery is the standard UPnP discovery mechanism (present in
  # minidlna, gupnp, cast/second-screen clients), so the neutral capability
  # stays notable here. The botnet/reflection interpretation lives in
  # objectives/impact/dos/amplification::ssdp-reflection-probe and friends.
  - id: ssdp-discovery
    for: [binaries, elf, javascript, pe, php, python, scripts]
    desc: SSDP discovery request sent to a broadcast address
    conf: 0.92
    attack: T1046
    all:
    - id: m-search
    - id: discover-header
    - id: broadcast-host
    downgrade:
      any:
      - id: metadata/package/testing/
    crit: notable
    for:
    - binaries
    - scripts
    - python
    - javascript
    - php
    - pe
    - elf
  - id: upnp-dial-discovery
    desc: UPnP DIAL discovery request
    conf: 0.9
    attack: T1046
    all:
      - id: ssdp-discovery
      - id: upnp-dial-service-urn
  - id: spoofed-browser-ssdp
    desc: SSDP discovery request with a Chrome 60 user agent
    conf: 0.88
    attack: T1036
    all:
      - id: ssdp-discovery
      - id: chrome60-windows-ua
