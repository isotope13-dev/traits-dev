defaults:
  crit: notable
  platforms: [windows, unix]
  for: [binaries, scripts]
traits:
  - id: m-search
    desc: SSDP M-SEARCH discovery request
    conf: 0.9
    mbc: C0002
    attack: T1046
    if:
      type: text
      substr: M-SEARCH * HTTP/1.1
  - id: discover-header
    desc: SSDP discover MAN header
    conf: 0.88
    mbc: C0002
    attack: T1046
    if:
      type: text
      exact: 'MAN: "ssdp:discover"'
  - id: broadcast-host
    desc: SSDP broadcast host header
    conf: 0.9
    mbc: C0002
    attack: T1046
    if:
      type: text
      regex: '(HOST: 255\.255\.255\.255:1900)'
  - id: upnp-dial-service-urn
    desc: UPnP DIAL service URN
    conf: 0.82
    mbc: C0002
    attack: T1046
    if:
      type: text
      exact: "ST: urn:dial-multiscreen-org:service:dial:1"
composite_rules:
  # SSDP discovery is the standard UPnP discovery mechanism (present in
  # minidlna, gupnp, cast/second-screen clients), so the neutral capability
  # stays notable here. The botnet/reflection interpretation lives in
  # objectives/impact/dos/amplification::ssdp-reflection-probe and friends.
  - id: ssdp-discovery
    for: [binaries, elf, javascript, pe, php, python, scripts]
    desc: SSDP request template with broadcast Host header
    conf: 0.92
    attack: T1046
    all:
    - id: m-search
    - id: discover-header
    - id: broadcast-host
    downgrade:
      any:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    crit: notable
  - id: upnp-dial-discovery
    desc: UPnP DIAL discovery request
    conf: 0.9
    attack: T1046
    all:
      - id: ssdp-discovery
      - id: upnp-dial-service-urn
  - id: browser-header-ssdp-template
    desc: SSDP request template and Chrome 60 header references
    conf: 0.88
    all:
      - id: ssdp-discovery
      - id: micro-behaviors/communications/http/user-agent::chrome60-windows-ua

  # This same template is sent through connected SOCK_DGRAM sockets by
  # Mirai forks. It does not bind IP_HDRINCL or a spoofed source to SSDP.
  - id: multiarch-ssdp-template-references
    desc: SSDP template with cross-architecture executable references
    crit: notable
    conf: 0.95
    for: [elf]
    platforms: [linux]
    all:
      - id: browser-header-ssdp-template
      - id: micro-behaviors/fs/path/binary::repeated-architecture-suffixed-executable-names
