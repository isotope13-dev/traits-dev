defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
traits:
- id: m-search
  desc: SSDP M-SEARCH discovery request
  conf: 0.9
  mbc: C0002
  attack: T1046
  if:
    type: text
    substr: M-SEARCH * HTTP/1.1
- id: discover-header
  desc: SSDP discover MAN header
  conf: 0.88
  mbc: C0002
  attack: T1046
  if:
    type: text
    exact: 'MAN: "ssdp:discover"'
- id: broadcast-host
  desc: SSDP broadcast host header
  conf: 0.9
  mbc: C0002
  attack: T1046
  if:
    type: text
    regex: '(HOST: 255\.255\.255\.255:1900)'
- id: upnp-dial-service-urn
  desc: UPnP DIAL service URN
  conf: 0.82
  mbc: C0002
  attack: T1046
  if:
    type: text
    exact: 'ST: urn:dial-multiscreen-org:service:dial:1'
composite_rules:
- id: ssdp-discovery
  for:
  - binaries
  - elf
  - javascript
  - pe
  - php
  - python
  - scripts
  desc: SSDP request template with broadcast Host header
  conf: 0.92
  attack: T1046
  all:
  - id: m-search
  - id: discover-header
  - id: broadcast-host
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/path::test-directory-component
- id: upnp-dial-discovery
  desc: UPnP DIAL discovery request
  conf: 0.9
  attack: T1046
  all:
  - id: ssdp-discovery
  - id: upnp-dial-service-urn
- id: browser-header-ssdp-template
  desc: SSDP request template and Chrome 60 header references
  conf: 0.88
  all:
  - id: ssdp-discovery
  - id: micro-behaviors/communications/http/user-agent::chrome60-windows-ua
- id: multiarch-ssdp-template-references
  desc: SSDP template with cross-architecture executable references
  conf: 0.95
  for:
  - elf
  platforms:
  - linux
  all:
  - id: browser-header-ssdp-template
  - id: micro-behaviors/fs/path/binary::repeated-architecture-suffixed-executable-names
