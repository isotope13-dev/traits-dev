defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - php
  - html
  - shell
  crit: notable

traits:
- id: native-post-method-token
  desc: HTTP POST method token in binary text
  conf: 0.72
  for:
  - class
  - dex
  - dll
  - elf
  - macho
  - pe
  platforms:
  - android
  - unix
  - windows
  if:
    type: text
    exact: POST
- id: supported-methods-post
  desc: Supported-methods list includes POST
  conf: 0.74
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \bmethods\s*:\s*\[[^\]]{0,220}["']POST["']
