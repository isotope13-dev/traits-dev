defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002
traits:
  - id: js-fetch-reference
    desc: Passes fetch as a call argument
    crit: notable
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$'
      arg:
        kind: identifier
        name: fetch

composite_rules:
  - id: js-fetch-invocation-surface
    desc: JavaScript fetch invocation surface
    crit: component
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: js-fetch-reference
      - id: micro-behaviors/communications/http/request/computed::js-fetch-computed-helper-argument
