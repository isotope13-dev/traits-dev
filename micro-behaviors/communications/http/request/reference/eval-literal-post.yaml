# Relocated from micro-behaviors/communications/http/request/body/application-state:
# the literal regex checks only `method: "POST"` inside a string literal.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: literal-post-method
    desc: String literal specifies HTTP POST method
    if:
      type: literal
      regex: '\bmethod\s*:\s*["'']POST["'']'
