defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - php
  - html
  - shell
  crit: notable

traits:
- id: quoted-post-token
  for:
  - python
  - javascript
  - powershell
  - php
  - html
  - shell
  - asp
  desc: Quoted HTTP POST method token
  conf: 0.7
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: '[\"\x27]POST[\"\x27]'
