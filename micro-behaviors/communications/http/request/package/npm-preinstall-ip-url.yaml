# Archive-level hook and URL observations do not bind the request to the hook.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]

composite_rules:
  - id: preinstall-node-script-php-ip-lookup-callback
    desc: Preinstall hook and PHP IP-query URL clues
    crit: notable
    conf: 0.88
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-node-index-hook
      - id: micro-behaviors/communications/http/telemetry::public-ip-report-parameter
      - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-script
