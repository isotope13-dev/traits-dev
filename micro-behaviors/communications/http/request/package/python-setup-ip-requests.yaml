defaults:
  platforms: [linux, macos, windows]
  for: [python]
composite_rules:
  - id: setup-py-shell-ip-request-clues
    desc: Setup file and curl-to-IP shell clues
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/build/pip::setup-py
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/communications/url/host/oob-http::curl-schemeless-external-ip-request
    # Directory evidence only. The `test-directory` umbrella also accepts the
    # test_*.py filename convention, and a setup.py dropper is free to name its
    # own files -- gating on that would let the hook evade by renaming.
    unless:
      - id: metadata/path/directory::test-directory-component

  - id: setup-py-module-ip-request-clues
    desc: Setup file with module and IP request clues
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/build/pip::setup-py
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
    unless:
      - id: metadata/path/directory::test-directory-component
