defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-install-hook-direct-ip-http
    desc: Install-hook code references direct-IP HTTP request
    crit: suspicious
    conf: 0.92
    scope: file
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
