# Read the decoded npm script value; raw JSON contains escaped quotes.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.96

traits:
  - id: npm-postinstall-node-http-get
    desc: Postinstall text calls HTTP module GET
    if:
      type: value
      path: scripts.postinstall
      regex: 'require\(\s*["''](node:)?https?["'']\s*\)\s*\.get\s*\('

  - id: npm-postinstall-hostname-oast-get-url
    desc: Postinstall GET embeds hostname in OAST host
    if:
      type: value
      path: scripts.postinstall
      regex: '\.get\(["'']https?://["'']\s*\+\s*\w+\.hostname\(\)\s*\+\s*["'']\.\w+\.oast\.fun\b'
