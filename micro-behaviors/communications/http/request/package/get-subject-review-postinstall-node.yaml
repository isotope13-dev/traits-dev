# Read the decoded npm script value; raw JSON contains escaped quotes.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.96

traits:
  - id: npm-postinstall-node-http-get
    desc: Postinstall text calls HTTP module GET
    if:
      type: value
      path: scripts.postinstall
      regex: 'require\(\s*["''](node:)?https?["'']\s*\)\s*\.get\s*\('

  - id: npm-postinstall-hostname-oast-get-url
    desc: Postinstall GET embeds hostname in OAST host
    if:
      type: value
      path: scripts.postinstall
      regex: '\.get\(["'']https?://["'']\s*\+\s*\w+\.hostname\(\)\s*\+\s*["'']\.\w+\.oast\.fun\b'

  - id: npm-preinstall-oastify-hostname-query-url
    desc: Preinstall GET sends OS hostname to OASTify
    crit: notable
    conf: 0.98
    attack: T1041,T1082
    if:
      type: value
      path: scripts.preinstall
      regex: 'oastify\.com/[^"'']{0,160}[?&]host=["'']\s*\+\s*require\(["'']os["'']\)\.hostname\(\)'

  - id: npm-preinstall-curl-oastify-hostname-query-url
    desc: Preinstall curl URL query includes OS hostname
    crit: notable
    conf: 0.98
    attack: T1041,T1082
    if:
      type: value
      path: scripts.preinstall
      regex: 'oastify\.com[^"'']{0,120}[?&][\w-]{1,32}=["'']\s*\+\s*require\(["'']os["'']\)\.hostname\(\)'
