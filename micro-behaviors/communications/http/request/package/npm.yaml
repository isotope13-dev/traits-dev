# HTTP request capability expressed in an npm package.json script.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85
  mbc: C0002
  attack: T1071.001
traits:
  - id: npm-script-fetch-request
    desc: npm script invokes fetch request
    if:
      type: value
      path: 'scripts[*]'
      regex: '\bfetch\s*\('
