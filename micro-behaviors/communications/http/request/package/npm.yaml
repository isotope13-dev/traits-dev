# HTTP request capability expressed in an npm package.json script.
defaults:
  for: [package.json]
  platforms: [unix, windows]
  crit: notable
  conf: 0.85
  mbc: C0002
  attack: T1071.001
traits:
  - id: npm-script-fetch-request
    desc: npm script invokes fetch request
    if:
      type: value
      path: 'scripts[*]'
      regex: '\bfetch\s*\('

  - id: preinstall-download-command-text
    desc: Manifest preinstall references curl or wget
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"preinstall"\s*:\s*"[^"]{0,200}\b(curl|wget)\b'
    unless:
    - id: well-known/tool/development/vscode-extension/vscode-marketplace::oxc-vscode-package-name
    - id: metadata/package/testing/presence/manifest::has-karma

  - id: preinstall-leading-curl-command
    desc: Manifest preinstall starts with curl command
    crit: notable
    conf: 0.9
    for: [manifests]
    if:
      type: text
      regex: "\"preinstall\"\\s*:\\s*\"curl\\s"

    # Removed duplicate wget traits and composites to avoid overlap with npm-registry-snapshot.yaml
composite_rules:
  - id: preinstall-curl-command
    desc: Preinstall script references curl command
    crit: notable
    conf: 0.95
    all:
    - id: micro-behaviors/communications/http/curl::npm-preinstall-curl
    unless:
    - id: metadata/package/scripts/lifecycle::preinstall-runtime-guard-help
