defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-install-hook-helper-http-get
    desc: Install hook requests hard-coded URL
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @helper body: (block
            (expression_statement (assignment left: (identifier) @url right: (string) @address))
            (try_statement body: (block (expression_statement (assignment right: (call
              function: (attribute object: (identifier) @requests attribute: (identifier) @get)
              arguments: (argument_list (identifier) @url2))))))))
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (call function: (identifier) @invoke))))))
          (expression_statement (call function: (identifier) @setup arguments: (argument_list
            (keyword_argument name: (identifier) @cmdclass value: (dictionary
              (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @helper @invoke) (#eq? @hook @registered) (#eq? @install "install") (#eq? @run "run")
          (#eq? @url @url2) (#eq? @requests "requests") (#eq? @get "get")
          (#eq? @setup "setup") (#eq? @cmdclass "cmdclass") (#match? @installkey "^.install.$")
          (#match? @address "https?://")
          (#not-match? @address "https?://(localhost|127[.]|10[.]|192[.]168[.])")
          (#not-match? @address "https?://172[.](1[6-9]|2[0-9]|3[01])[.]")
          (#not-match? @address "https?://(169[.]254[.]|0[.]0[.]0[.]0)")
          (#not-match? @address "[.](local|internal)(/|.)"))
  - id: python-install-hook-curl-command
    desc: Install hook runs curl to remote URL
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (try_statement body: (block (expression_statement (call
                function: (attribute object: (identifier) @os attribute: (identifier) @system)
                arguments: (argument_list (string) @command)))))))))
          (expression_statement (call function: (identifier) @setup arguments: (argument_list
            (keyword_argument name: (identifier) @cmdclass value: (dictionary
              (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @hook @registered) (#eq? @install "install") (#eq? @run "run")
          (#eq? @os "os") (#eq? @system "system") (#eq? @setup "setup")
          (#eq? @cmdclass "cmdclass") (#match? @installkey "^.install.$")
          (#match? @command "^.curl[[:space:]]+https?://")
          (#not-match? @command "https?://(localhost|127[.]|10[.]|192[.]168[.])")
          (#not-match? @command "https?://172[.](1[6-9]|2[0-9]|3[01])[.]")
          (#not-match? @command "https?://(169[.]254[.]|0[.]0[.]0[.]0)")
          (#not-match? @command "[.](local|internal)(/|.)"))
