# Existing observations, grouped by the behavior they establish.
defaults:
  conf: 0.95
  platforms:
  - windows
  - unix
  for:
  - php
  crit: notable
  mbc: E1071
  attack: T1071.001

traits:
  - id: plugin-upload-action-endpoint
    desc: References WordPress plugin upload endpoint
    crit: notable
    for: [scripts, source, binaries, -class, -pyc, -beam, -wasm, -static-lib]
    if:
      type: text
      substr: 'action=upload-plugin'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap

  - id: plugin-upload-form-endpoint
    desc: References WordPress plugin upload form endpoint
    crit: notable
    for: [scripts, source, binaries, -class, -pyc, -beam, -wasm, -static-lib]
    if:
      type: text
      substr: 'plugin-install.php?tab=upload'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap

  - id: plugin-archive-form-field
    desc: Appends WordPress plugin archive form field
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.append\s*\(\s*["'']pluginzip["'']\s*,'

  - id: python-plugin-archive-form-field
    desc: Adds WordPress plugin archive form field
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(?i)add_field\s*\(\s*["'']pluginzip["'']'

  - id: plugin-archive-multipart-field
    desc: Supplies WordPress pluginzip upload field
    crit: notable
    for: [scripts, source, binaries, -class, -pyc, -beam, -wasm, -static-lib]
    if:
      type: text
      regex: '(?i)(name=\\?["'']pluginzip\\?["'']|["'']pluginzip["'']\s*(=>|:|,)|\bpluginzip=@)'
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap

  - id: plugin-activation-action-endpoint
    desc: References WordPress plugin activation endpoint
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: 'plugins\.php\?action=activate(&|&amp;)plugin='

composite_rules:
  - id: programmatic-plugin-upload-request
    desc: Client JS drives WordPress plugin upload endpoint
    crit: notable
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/request/plugin-install::plugin-upload-action-endpoint
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1500

  - id: wordpress-plugin-zip-upload
    desc: Targets WordPress plugin upload action with pluginzip field
    crit: notable
    for: [scripts, source, binaries, -class, -pyc, -beam, -wasm, -static-lib]
    all:
      - id: plugin-upload-action-endpoint
    any:
      - id: plugin-archive-multipart-field
      - id: plugin-archive-form-field
      - id: python-plugin-archive-form-field
