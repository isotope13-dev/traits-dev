# Existing observations, grouped by the behavior they establish.
defaults:
  conf: 0.95
  platforms:
  - windows
  - unix
  for:
  - php
  crit: notable
  mbc: E1071
  attack: T1071.001

traits:
  - id: plugin-upload-action-endpoint
    desc: References WordPress plugin upload endpoint
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'action=upload-plugin'

  - id: plugin-upload-form-endpoint
    desc: References WordPress plugin upload form endpoint
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      substr: 'plugin-install.php?tab=upload'

  - id: plugin-archive-form-field
    desc: Appends WordPress plugin archive form field
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.append\s*\(\s*["'']pluginzip["'']\s*,'

  - id: plugin-activation-action-endpoint
    desc: References WordPress plugin activation endpoint
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: 'plugins\.php\?action=activate(&|&amp;)plugin='

composite_rules:
  - id: programmatic-plugin-upload-request
    desc: Client JS drives WordPress plugin upload endpoint
    crit: notable
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/request/plugin-install::plugin-upload-action-endpoint
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1500
