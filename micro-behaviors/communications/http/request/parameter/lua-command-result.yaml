defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-command-result-http-body"
    desc: "Lua HTTP body has command-id/output fields"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "http.request"
      arg:
        index: 1
        from:
          call: "^string\\.format$"
          argument: 0
          literal: "cmd_id=%s&output=%s"
  - id: "lua-command-route-http-request"
    desc: "Lua HTTP request targets a commands route"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "http.request"
      arg:
        index: 0
        from:
          call: "^string\\.format$"
          argument: 0
          literal: "/commands$"
