defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: cleartext-http-request-target
    desc: HTTP URL in request-like call text
    crit: notable
    conf: 0.9
    for: [scripts, source, -shell, -batch]
    if:
      type: text
      regex: '(?i)\.(get|post|put|head|request)\s*\(\s*["'']http://[a-z0-9]'

