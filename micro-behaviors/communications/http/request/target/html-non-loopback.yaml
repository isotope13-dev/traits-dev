defaults:
  platforms: [unix, windows, android]
  for: [html]
  crit: notable
  conf: 0.96
traits:
  - id: html-fetch-non-loopback-http-url
    desc: HTML script fetches non-loopback HTTP(S) URL
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)\bfetch\s*\(\s*["'']https?://[^/"''\s]{1,128}'
    not:
      - regex: '(?i)//(localhost|127\.0\.0\.1)\b'
      - regex: '(?i)\.invalid\b'

