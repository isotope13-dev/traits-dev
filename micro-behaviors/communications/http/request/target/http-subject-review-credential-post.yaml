# A login form's fields together with the request that carries them.
#
# Pairing a password or one-time-code box with a POST transport nearby is what
# every sign-in page does, so both composites are neutral capability
# observations: "this page submits a password" and "this page submits a
# verification code". They were defined under
# objectives/credential-access/phishing/mfa-relay/, where the directory alone
# labelled an ordinary authentication form a phishing kit. The relay composites
# there still reference them; the phishing inference comes from the legs they
# add — a lookalike domain, provider handoff, or post-auth redirect.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.94

composite_rules:
  - id: browser-absolute-submission-target
    desc: Page submits to a hardcoded absolute URL
    any:
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
      - id: micro-behaviors/communications/http/request/json::fetch-external-url
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

