# Outbound HTTP(S) client dispatch in browser scripts and inline/injected HTML,
# unifying `fetch(...)`, `navigator.sendBeacon(...)`, and `XMLHttpRequest.open(...)`.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]

composite_rules:
  - id: browser-outbound-http-client-call
    desc: Dispatches browser HTTP fetch, XHR, or beacon
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/communications/url/host/http::fetch-absolute-url-target
      - id: micro-behaviors/communications/http/request/target::literal-fetch-http-url
      - id: micro-behaviors/communications/http/request/target::html-fetch-non-loopback-http-url
      - id: micro-behaviors/communications/http/request/beacon::sendbeacon-http-target
