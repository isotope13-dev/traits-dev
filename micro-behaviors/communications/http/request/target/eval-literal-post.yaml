# Relocated from micro-behaviors/communications/http/request/body/application-state:
# the literal regex inspects only a stringified `fetch("https?://…")` target, not
# application state.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: literal-fetch-http-url
    desc: String literal calls fetch on HTTP URL
    if:
      type: literal
      regex: '\bfetch\s*\(\s*["'']https?://'
