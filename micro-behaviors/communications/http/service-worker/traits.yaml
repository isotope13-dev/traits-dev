defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - javascript
    - html
traits:
  - id: api-register
    desc: Registers a Service Worker
    if:
      type: symbol
      kind: call
      exact: navigator.serviceWorker.register
  - id: event-install
    desc: Service Worker install event listener
    # A flat parsed source tree has no executable expression.
    unless:
      - type: metrics
        field: ast.max_depth
        max: 1
    if:
      type: text
      regex: addEventListener\s*\(\s*["']install["']
  - id: event-activate
    desc: Service Worker activate event listener
    # A flat parsed source tree has no executable expression.
    unless:
      - type: metrics
        field: ast.max_depth
        max: 1
    if:
      type: text
      regex: addEventListener\s*\(\s*["']activate["']
  - id: event-fetch
    desc: 'Service Worker fetch event listener'
    # A flat parsed source tree has no executable expression.
    unless:
      - type: metrics
        field: ast.max_depth
        max: 1
    if:
      type: text
      regex: addEventListener\s*\(\s*["']fetch["']
  - id: control-claim
    desc: Calls Service Worker clients.claim
    # A flat parsed source tree has no executable expression.
    unless:
      - type: metrics
        field: ast.max_depth
        max: 1
    if:
      type: text
      regex: clients\.claim\s*\(\)
  - id: control-skip-waiting
    desc: Service Worker skips waiting phase
    if:
      type: text
      regex: skipWaiting\s*\(\)
    unless:
      - type: metrics
        field: ast.max_depth
        max: 1
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
  - id: api-respond-with
    desc: respondWith method call
    # A flat parsed source tree has no executable expression.
    unless:
      - type: metrics
        field: ast.max_depth
        max: 1
    if:
      type: text
      regex: \.respondWith\s*\(
  - id: push-subscribe
    desc: Browser Push API subscribe
    conf: 0.85
    if:
      type: text
      regex: '\.pushManager\.subscribe\s*\('
  - id: push-get-subscription
    desc: Browser Push API subscription read
    conf: 0.8
    if:
      type: text
      regex: '\.pushManager\.getSubscription\s*\('
  - id: notification-request-permission
    desc: Browser notification permission prompt
    conf: 0.85
    if:
      type: text
      regex: '\.Notification\.requestPermission\s*\('
