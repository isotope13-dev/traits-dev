defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: protocol-sync
    desc: Service Worker aligns request protocol with page
    if:
      type: text
      regex: '\.protocol\s*=\s*self\.location\.protocol'
  - id: cache-busting
    desc: "Service Worker implements cache busting"
    if:
      type: text
      substr: "cache-bust="
composite_rules:
  - id: request-interception-and-client-claim
    desc: Fetch response handler and client claim
    all:
      - id: micro-behaviors/communications/http/service-worker::event-fetch
      - id: micro-behaviors/communications/http/service-worker::control-claim
      - id: micro-behaviors/communications/http/service-worker::api-respond-with
