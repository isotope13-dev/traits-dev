defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: protocol-downgrade
    desc: 'Service Worker forces protocol synchronization'
    crit: suspicious
    if:
      type: text
      regex: '\.protocol\s*=\s*self\.location\.protocol'
  - id: cache-busting
    desc: "Service Worker implements cache busting"
    crit: notable
    if:
      type: text
      substr: "cache-bust="
  # URL substring tests inside a fetch handler. Split per RULES: each
  # token is an independent signal (token vs cookie vs auth).
  - id: fetch-url-token-substring
    desc: Fetch handler tests URL for token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'includes\s*\(\s*[''"]token[''"]'
  - id: fetch-url-cookie-substring
    desc: Fetch handler tests URL for cookie
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'includes\s*\(\s*[''"]cookie[''"]'
composite_rules:
  - id: intercept-all
    desc: Service Worker intercepts requests and claims clients immediately
    crit: notable
    all:
      - id: micro-behaviors/communications/http/service-worker::event-fetch
      - id: micro-behaviors/communications/http/service-worker::control-claim
      - id: micro-behaviors/communications/http/service-worker::api-respond-with
