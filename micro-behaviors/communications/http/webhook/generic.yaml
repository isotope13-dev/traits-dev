defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: run-webhook-url
    desc: GitHub Actions run contains a webhook URL
    crit: notable
    conf: 0.88
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)https?://[^ \t"\n]*webhook[^ \t"\n]*'
  - id: wbhk-studio-webhook
    desc: wbhk studio webhook endpoint
    crit: suspicious
    conf: 0.97
    if:
      type: string_literal
      regex: https?://hook\.wbhk\.studio/webhook/[0-9a-f-]{36}|hook\.wbhk\.studio/webhook/
  - id: fixed-webhook-endpoints-array
    desc: Fixed webhook endpoint array
    crit: suspicious
    conf: 0.9
    if:
      type: string_literal
      substr: FIXED_LOG_ENDPOINTS

  - id: curl-post-webhook-command
    desc: Curl command posts to webhook endpoint
    crit: notable
    conf: 0.85
    for: [shell, python, javascript, typescript, powershell]
    if:
      type: literal
      regex: 'curl.{0,50}-X POST.{0,50}webhook|webhook.{0,50}curl.{0,50}POST'

  # These are neutral webhook mechanics.  Keep the structural boundary so a
  # hostname such as `webhook.example` is not treated as a webhook handler.
  - id: webhook-configuration-key
    desc: Webhook configuration key
    crit: component
    conf: 0.86
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\bwebhooks?\s*[:=]'

  - id: webhook-registration-call
    desc: Webhook registration call
    crit: component
    conf: 0.86
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\b(register|set|create)\w*webhook\b'

  - id: webhook-route-declaration
    desc: Webhook route declaration
    crit: component
    conf: 0.86
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\b(post|get|put|route)\s*\([^)]{0,80}/?webhook\b'

  - id: javascript-axios-webhook-post
    desc: Axios POST targets webhook variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\baxios\.post\s*\(\s*(webhook\w*|[A-Za-z_$]\w*webhook\w*)\b'
      case_insensitive: true

composite_rules:
  - id: python-webhook-post
    desc: Python posts data to a webhook
    crit: notable
    conf: 0.88
    for: [python]
    unless:
      - id: well-known/app/jennifer/
      - id: metadata/file/extension/identity::j-source-extension
    mbc: C0002
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/keywords::webhook-service-word
      - id: micro-behaviors/communications/http/request/client::py-post-generic
