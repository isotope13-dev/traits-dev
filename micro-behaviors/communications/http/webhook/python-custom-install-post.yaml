defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-custom-install-webhook-post-clues
    desc: Custom setup POST and webhook references
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/keywords::webhook-service-word
