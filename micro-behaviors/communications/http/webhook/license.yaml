# A fixed webhook and a license-named value do not establish unauthorized use.
# Keep the address and the source mapping visible without asserting theft.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
traits:
- id: easypanel-node-meta-webhook
  desc: Easypanel node-meta webhook
  crit: notable
  conf: 0.98
  if:
    type: string_literal
    substr: easypanel.host/webhook/t/e/s/t/e/node-meta/ads
composite_rules:
- id: licensekey-body-at-fixed-webhook
  desc: License-key body mapping beside fixed webhook
  crit: notable
  conf: 0.98
  near_bytes: 1024
  all:
  - id: easypanel-node-meta-webhook
  - id: metadata/lang/source/naming/setting::licensekey-text
  - id: metadata/lang/source/syntax/key-value::licensekey-body-mapping-text
