defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: discord-webhook-configuration
    desc: Discord webhook configuration text
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\bdiscord\s+webhooks?\b|\bwebhooks?\s+to\s+discord\b'
    unless:
      # FluentSMTP (and similar mail plugins) expose Discord as a notification
      # channel for delivery failures — product UI copy, not C2 staging.
      - id: well-known/app/publishing/fluent-smtp::fluent-smtp-plugin
  - id: discord-webhook-path
    desc: Discord webhook URL with numeric ID
    crit: notable
    conf: 0.9
    for: [scripts, binaries, typescript, go, rust, c, cpp, markdown]
    if:
      type: text
      regex: discord(app)?\.com/api/webhooks/\d{10,}
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/system/remotepower::documented-rmm-release-context
      # A feedback form sends user-entered report fields to its configured
      # webhook; that is an application transport, not credential theft.
      - id: micro-behaviors/ui/window/form-input::feedback-form-submission
      - id: metadata/path::test-directory-component
  - id: discord-webhook-path-split
    desc: Discord webhook API path literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']?/api/webhooks/\d{10,}/[A-Za-z0-9_-]{50,}'
  # Stealers assign the host and the snowflake id on adjacent lines so a
  # single-line `webhooks/<id>` match never sees both halves.
  - id: discord-webhook-host-split-id
    desc: Discord webhook host split from its id
    crit: notable
    conf: 0.9
    for: [powershell, scripts]
    if:
      type: text
      regex: 'discord(app)?\.com/api/webhooks/[\s\S]{0,80}\d{17,}'
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/system/remotepower::documented-rmm-release-context
      - id: micro-behaviors/ui/window/form-input::feedback-form-submission
      - id: metadata/path::test-directory-component
  - id: discord-guild-invite-creation-source
    desc: JavaScript creates a Discord guild invite
    crit: notable
    conf: 0.95
    for: [scripts]
    if:
      type: text
      regex: '\bcreateInvite\s*\('
  - id: discord-permanent-invite-options
    desc: Discord invite sets zero expiry and uses
    crit: notable
    conf: 0.98
    for: [scripts]
    if:
      type: text
      regex: '(?is)\bcreateInvite\s*\(\s*\{[^}]{0,220}\bmaxAge\s*:\s*0[^}]{0,220}\bmaxUses\s*:\s*0'
  - id: discord-guild-collection-source
    desc: JavaScript enumerates or handles Discord guilds
    crit: notable
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '\bguilds\.cache\b|\bguildCreate\b'
  - id: webhook-name-check
    desc: Discord webhook name check (activation check)
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \.name\s*(!==|===)\s*['"]true['"]
  - id: discord-webhook-client-hardcoded
    desc: 'discord webhook client hardcoded'
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: WebhookClient\(['"]\d{18,20}['"],\s*['"][\w-]{60,80}['"]\)
  - id: python-discord-webhook-api-path
    desc: Python derives a Discord webhook API path
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)discord(app)?\.com/api/webhooks/|split\(["'']https?://discord(app)?\.com/?api/webhooks/'
  - id: python-xor-discord-webhook-decoder
    desc: Python XOR-decodes a webhook URL
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)(def get_webhook|_enc_hook)[\s\S]{0,400}chr\(\s*b\s*\^'
  # A bare Discord webhook URL is a neutral transport fact, not a
  # command-and-control claim: benign bots and notification integrations
  # carry one too. It lives here so objective composites (dropper, spam)
  # can reference it alongside their intent-specific legs.
  - id: discord-webhook-short-id-url
    desc: Discord webhook URL with short numeric ID
    crit: notable
    conf: 0.6
    for: [scripts, binaries, csharp]
    if:
      type: text
      regex: (?i)discord(app)?\.com/api/webhooks/\d{7,}
    not:
      - substr: "discord.com/api/webhooks/123456"
      - substr: "discord.com/api/webhooks/123456/"

  - id: python-discord-webhook-import
    desc: Imports the discord_webhook package
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)(from\s+discord_webhook\s+import|import\s+discord_webhook)\b'

  # A Discord webhook URL followed by a request-method object only
  # proves a webhook POST is being constructed. Legitimate bots,
  # notification integrations and documentation examples do this;
  # exfiltration requires a sensitive-data source leg, supplied by
  # the objective composites that reference this capability.
  - id: discord-webhook-request-builder
    desc: Discord webhook URL with request method
    crit: notable
    conf: 0.9
    for: [javascript, typescript, shell]
    if:
      type: text
      regex: "discord\\.com/api/webhooks[^'\"]{0,100}['\"]?\\s*,?\\s*\\{\\s*method"
composite_rules:
  - id: python-discord-webhook-add-file
    desc: Discord webhook import with add_file call text
    crit: notable
    conf: 0.92
    for: [python]
    all:
      - id: python-discord-webhook-import
      - id: metadata/lang/source/syntax/call/invocation::python-add-file-member-call
  - id: discord-webhook-path-any
    desc: Discord webhook API path detected
    crit: notable
    conf: 0.9
    any:
      - id: discord-webhook-path
      - id: discord-webhook-path-split
      - id: discord-webhook-host-split-id
