defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: discord-webhook-configuration
    desc: Discord webhook configuration text
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\bdiscord\s+webhooks?\b|\bwebhooks?\s+to\s+discord\b'
    unless:
      # FluentSMTP (and similar mail plugins) expose Discord as a notification
      # channel for delivery failures — product UI copy, not C2 staging.
      - id: well-known/app/publishing/fluent-smtp::fluent-smtp-plugin
  - id: discord-webhook-path
    desc: Discord webhook API path
    crit: notable
    conf: 0.9
    for: [scripts, binaries, python, javascript, typescript, go, rust, c, cpp, shell, perl, powershell]
    if:
      type: text
      regex: discord(app)?\.com/api/webhooks/\d{10,}
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/system/remotepower::documented-rmm-release-context
      # A feedback form sends user-entered report fields to its configured
      # webhook; that is an application transport, not credential theft.
      - type: text
        regex: '(?i)(submit|send)[-_ ]feedback.{0,700}(title|subject).{0,700}(body|message)'
  - id: discord-webhook-path-split
    desc: Discord webhook API path literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']?/api/webhooks/\d{10,}/[A-Za-z0-9_-]{50,}'
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/system/remotepower::documented-rmm-release-context
      - type: text
        regex: '(?i)(submit|send)[-_ ]feedback.{0,700}(title|subject).{0,700}(body|message)'
  - id: discord-guild-invite-creation-source
    desc: JavaScript creates a Discord guild invite
    crit: notable
    conf: 0.95
    for: [scripts]
    if:
      type: text
      regex: '\bcreateInvite\s*\('
  - id: discord-permanent-invite-options
    desc: Discord invite sets zero expiry and uses
    crit: notable
    conf: 0.98
    for: [scripts]
    if:
      type: text
      regex: '(?is)\bcreateInvite\s*\(\s*\{[^}]{0,220}\bmaxAge\s*:\s*0[^}]{0,220}\bmaxUses\s*:\s*0'
  - id: discord-guild-collection-source
    desc: JavaScript enumerates or handles Discord guilds
    crit: notable
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '\bguilds\.cache\b|\bguildCreate\b'
  - id: webhook-name-check
    desc: Discord webhook name check (activation check)
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \.name\s*(!==|===)\s*['"]true['"]
  - id: discord-webhook-client-hardcoded
    desc: 'discord webhook client hardcoded'
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: WebhookClient\(['"]\d{18,20}['"],\s*['"][\w-]{60,80}['"]\)
  - id: python-discord-webhook-api-path
    desc: Python derives a Discord webhook API path
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)discord(app)?\.com/api/webhooks/|split\(["'']https?://discord(app)?\.com/?api/webhooks/'
composite_rules:
  - id: discord-webhook-path-any
    desc: Discord webhook API path detected
    crit: notable
    conf: 0.9
    any:
      - id: discord-webhook-path
      - id: discord-webhook-path-split
