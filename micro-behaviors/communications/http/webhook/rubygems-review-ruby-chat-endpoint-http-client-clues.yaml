defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-chat-endpoint-http-client-clues
    desc: Ruby HTTP client and chat endpoint references
    crit: notable
    conf: 0.85
    all:
      - id: metadata/import/package::ruby-http-client-imports
    any:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
