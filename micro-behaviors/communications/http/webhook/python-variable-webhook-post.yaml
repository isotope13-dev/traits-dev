defaults:
  for: [python]
  platforms: [windows, unix]

traits:
  # Generic Python POST to a variable named webhook*. Lives here rather than
  # under exfiltration/stealer so directory references in stealer composites
  # do not convict ordinary notifiers (Discord, Telegram, WeCom) on this leg.
  - id: python-post-webhook-variable-text
    desc: Source posts to webhook variable
    crit: notable
    if:
      type: text
      regex: 'requests[.]post\((url=)?webhook[[:alnum:]_]*'
