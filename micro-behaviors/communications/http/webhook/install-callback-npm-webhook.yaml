defaults:
  platforms: ["unix", "windows"]
  for: ["javascript", "typescript"]

composite_rules:
  - id: install-hook-agent-config-webhook-clues
    crit: suspicious
    desc: Agent config, install hook and webhook clues
    conf: 0.95
    scope: archive
    for: [shell, javascript, tar, zip, npm, package.json]
    all:
      - id: micro-behaviors/fs/path/agent-config/file::openclaw-config-json-literal
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
    any:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
