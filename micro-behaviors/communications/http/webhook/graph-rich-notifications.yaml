# Evidence: https://www.netspi.com/blog/technical-blog/cloud-pentesting/leveraging-microsoft-graph-api-change-notifications-for-data-exfiltration/
# Dual-use content delivery, not proof of compromise or unauthorized consent.
# AST is needed to bind native resource fields and booleans to one object;
# independent facts plus proximity would mix separate subscription objects.
# Shell JSON captures require a flat object. Aliases remain unresolved.
# Encoded joins require one flat decoded JSON object and the same source byte.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 0.95
traits:
- id: graph-subscription-endpoint
  desc: Graph notification subscription endpoint
  if:
    type: literal
    regex: ^https://graph\.microsoft\.com/(beta|v1\.0)/subscriptions/?$
- id: graph-subscription-create-cmdlet
  desc: Calls Graph subscription creation cmdlet
  for:
  - powershell
  if:
    type: symbol
    kind: call
    regex: (?i)^New-MgSubscription$
- id: graph-rich-resource-data-enabled
  desc: Enables resource content in Graph notifications
  if:
    type: text
    regex: (?i)\bincludeResourceData["']?\s*[:=]\s*\$?true\b
- id: graph-notification-https-destination
  desc: Configures HTTPS notification destination
  if:
    type: text
    regex: \bnotificationUrl["']?\s*[:=]\s*["']https://[^"'\s]{1,512}["']
- id: graph-notification-encryption-certificate
  desc: Sets Graph notification encryption certificate
  if:
    type: text
    regex: \bencryptionCertificate["']?\s*[:=]\s*(["'][^"'\r\n]|\$?[A-Za-z_])
- id: graph-rich-mail-python
  desc: Rich mail fields in Python object
  for:
  - python
  if:
    type: tree-sitter
    language: python
    query: |
      ((dictionary (pair key: (string) @resource_key value: (string) @resource) (pair key: (string) @rich_key value: (true))) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @resource "^['\"]/?(me|users/[^/'\"\\s]{1,160})/(mailFolders(\\([^\\r\\n)]{1,120}\\)|/[^/'\"\\s]{1,120})/)?messages[?'\"]"))
      ((dictionary (pair key: (string) @rich_key value: (true)) (pair key: (string) @resource_key value: (string) @resource)) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @resource "^['\"]/?(me|users/[^/'\"\\s]{1,160})/(mailFolders(\\([^\\r\\n)]{1,120}\\)|/[^/'\"\\s]{1,120})/)?messages[?'\"]"))
- id: graph-rich-mail-javascript
  desc: Rich mail fields in JavaScript object
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |
      ((object (pair key: [(property_identifier) (string)] @resource_key value: (string) @resource) (pair key: [(property_identifier) (string)] @rich_key value: (true))) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @resource "^['\"]/?(me|users/[^/'\"\\s]{1,160})/(mailFolders(\\([^\\r\\n)]{1,120}\\)|/[^/'\"\\s]{1,120})/)?messages[?'\"]"))
      ((object (pair key: [(property_identifier) (string)] @rich_key value: (true)) (pair key: [(property_identifier) (string)] @resource_key value: (string) @resource)) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @resource "^['\"]/?(me|users/[^/'\"\\s]{1,160})/(mailFolders(\\([^\\r\\n)]{1,120}\\)|/[^/'\"\\s]{1,120})/)?messages[?'\"]"))
- id: graph-rich-mail-shell
  desc: Rich mail fields in shell JSON literal
  for:
  - shell
  if:
    type: tree-sitter
    language: shell
    query: |
      ((raw_string) @evidence
        (#match? @evidence "^'\\{[^{}]*\\}'$")
        (#match? @evidence "\\bresource[\"']?\\s*[:=]\\s*['\"]/?(me|users/[^/'\"\\s]{1,160})/(mailFolders(\\([^\\r\\n)]{1,120}\\)|/[^/'\"\\s]{1,120})/)?messages[?'\"]")
        (#match? @evidence "(?i)\\bincludeResourceData[\"']?\\s*[:=]\\s*\\$?true\\b"))
- id: graph-rich-mail-powershell
  desc: Rich mail fields in PowerShell hashtable
  for:
  - powershell
  if:
    type: tree-sitter
    language: powershell
    query: |
      ((hash_literal_expression (hash_literal_body (hash_entry (key_expression) @resource_key (_) @resource) (hash_entry (key_expression) @rich_key (_) @rich_value))) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @rich_value "(?i)^\\$true$")
        (#match? @resource "^['\"]/?(me|users/[^/'\"\\s]{1,160})/(mailFolders(\\([^\\r\\n)]{1,120}\\)|/[^/'\"\\s]{1,120})/)?messages[?'\"]"))
      ((hash_literal_expression (hash_literal_body (hash_entry (key_expression) @rich_key (_) @rich_value) (hash_entry (key_expression) @resource_key (_) @resource))) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @rich_value "(?i)^\\$true$")
        (#match? @resource "^['\"]/?(me|users/[^/'\"\\s]{1,160})/(mailFolders(\\([^\\r\\n)]{1,120}\\)|/[^/'\"\\s]{1,120})/)?messages[?'\"]"))
- id: graph-rich-chat-python
  desc: Rich chat fields in Python object
  for:
  - python
  if:
    type: tree-sitter
    language: python
    query: |
      ((dictionary (pair key: (string) @resource_key value: (string) @resource) (pair key: (string) @rich_key value: (true))) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @resource "^['\"]/?(me/|users/[^/'\"\\s]{1,160}/)?chats/getAllMessages['\"]$"))
      ((dictionary (pair key: (string) @rich_key value: (true)) (pair key: (string) @resource_key value: (string) @resource)) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @resource "^['\"]/?(me/|users/[^/'\"\\s]{1,160}/)?chats/getAllMessages['\"]$"))
- id: graph-rich-chat-javascript
  desc: Rich chat fields in JavaScript object
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |
      ((object (pair key: [(property_identifier) (string)] @resource_key value: (string) @resource) (pair key: [(property_identifier) (string)] @rich_key value: (true))) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @resource "^['\"]/?(me/|users/[^/'\"\\s]{1,160}/)?chats/getAllMessages['\"]$"))
      ((object (pair key: [(property_identifier) (string)] @rich_key value: (true)) (pair key: [(property_identifier) (string)] @resource_key value: (string) @resource)) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @resource "^['\"]/?(me/|users/[^/'\"\\s]{1,160}/)?chats/getAllMessages['\"]$"))
- id: graph-rich-chat-shell
  desc: Rich chat fields in shell JSON literal
  for:
  - shell
  if:
    type: tree-sitter
    language: shell
    query: |
      ((raw_string) @evidence
        (#match? @evidence "^'\\{[^{}]*\\}'$")
        (#match? @evidence "\\bresource[\"']?\\s*[:=]\\s*['\"]/?(me/|users/[^/'\"\\s]{1,160}/)?chats/getAllMessages['\"]")
        (#match? @evidence "(?i)\\bincludeResourceData[\"']?\\s*[:=]\\s*\\$?true\\b"))
- id: graph-rich-chat-powershell
  desc: Rich chat fields in PowerShell hashtable
  for:
  - powershell
  if:
    type: tree-sitter
    language: powershell
    query: |
      ((hash_literal_expression (hash_literal_body (hash_entry (key_expression) @resource_key (_) @resource) (hash_entry (key_expression) @rich_key (_) @rich_value))) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @rich_value "(?i)^\\$true$")
        (#match? @resource "^['\"]/?(me/|users/[^/'\"\\s]{1,160}/)?chats/getAllMessages['\"]$"))
      ((hash_literal_expression (hash_literal_body (hash_entry (key_expression) @rich_key (_) @rich_value) (hash_entry (key_expression) @resource_key (_) @resource))) @evidence
        (#match? @resource_key "^['\"]?resource['\"]?$")
        (#match? @rich_key "^['\"]?includeResourceData['\"]?$")
        (#match? @rich_value "(?i)^\\$true$")
        (#match? @resource "^['\"]/?(me/|users/[^/'\"\\s]{1,160}/)?chats/getAllMessages['\"]$"))
- id: graph-encoded-rich-flat-object
  desc: Decoded flat JSON enables rich notifications
  if:
    type: encoded
    regex: ^\{[^{}]{0,800}"includeResourceData"\s*:\s*true\b[^{}]{0,800}\}$
  for:
  - python
- id: graph-encoded-mail-resource
  desc: Decoded self-mailbox subscription resource
  if:
    type: encoded
    regex: '"resource"\s*:\s*"/?me/messages[?"]'
  for:
  - python
- id: graph-encoded-chat-resource
  desc: Decoded aggregate chat subscription resource
  if:
    type: encoded
    regex: '"resource"\s*:\s*"/?(me/)?chats/getAllMessages"'
  for:
  - python
composite_rules:
- id: graph-subscription-http-post
  desc: Graph subscription endpoint near HTTP POST operation
  all:
  - id: graph-subscription-endpoint
  any:
  - id: micro-behaviors/communications/http/curl/body::curl-json-post-command
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/request/payload::powershell-http-post-body
  near_bytes: 4096
- id: graph-rich-mail-webhook
  desc: Configures Graph webhook mailbox content
  crit: suspicious
  conf: 0.9
  all:
  - id: graph-rich-mail-resource-fields
  - id: graph-notification-https-destination
  - id: graph-notification-encryption-certificate
  near_bytes: 4096
  any:
  - id: graph-subscription-http-post
  - id: graph-subscription-create-cmdlet
- id: graph-rich-chat-webhook
  desc: Configures Graph webhook chat content
  crit: suspicious
  conf: 0.9
  all:
  - id: graph-rich-chat-resource-fields
  - id: graph-notification-https-destination
  - id: graph-notification-encryption-certificate
  near_bytes: 4096
  any:
  - id: graph-subscription-http-post
  - id: graph-subscription-create-cmdlet
- id: graph-encoded-rich-mail
  desc: Decoded rich mail notification object
  all:
  - id: graph-encoded-rich-flat-object
  - id: graph-encoded-mail-resource
  near_bytes: 1
- id: graph-rich-mail-resource-fields
  desc: Rich mail notification resource fields
  any:
  - id: graph-rich-mail-python
  - id: graph-rich-mail-javascript
  - id: graph-rich-mail-shell
  - id: graph-rich-mail-powershell
  - id: graph-encoded-rich-mail
- id: graph-encoded-rich-chat
  desc: Decoded rich chat notification object
  all:
  - id: graph-encoded-rich-flat-object
  - id: graph-encoded-chat-resource
  near_bytes: 1
- id: graph-rich-chat-resource-fields
  desc: Rich chat notification resource fields
  any:
  - id: graph-rich-chat-python
  - id: graph-rich-chat-javascript
  - id: graph-rich-chat-shell
  - id: graph-rich-chat-powershell
  - id: graph-encoded-rich-chat
