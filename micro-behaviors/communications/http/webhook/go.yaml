defaults:
  platforms: [windows, unix]
  for: [go]
  mbc: C0002

traits:
  - id: go-webhook-fire-call
    desc: Calls a Go Webhook Fire method
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.Webhook\.Fire$'
  - id: go-webhook-constructor
    desc: Defines a Go webhook constructor
    crit: notable
    conf: 0.95
    if:
      type: function
      regex: '^New[A-Za-z_$]*Webhook[A-Za-z0-9_$]*$'

composite_rules:
  - id: go-webhook-json-post
    desc: Go webhook posts a JSON payload
    crit: notable
    conf: 0.95
    near_bytes: 4096
    all:
      - id: go-webhook-constructor
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/lib/netlib::go-http-newrequest
      - id: micro-behaviors/data/serialize/json::go-json-marshal
