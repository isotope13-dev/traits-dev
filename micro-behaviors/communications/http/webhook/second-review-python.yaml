composite_rules:
- crit: notable
  for:
  - python
  - python-sdist
  id: python-setup-oob-json-post
  desc: Python setup file with OOB JSON POST
  conf: 0.99
  scope: outer
  all:
  - id: micro-behaviors/communications/http/webhook::python-oob-json-post-cooccurrence
  - id: metadata/build/pip::root-setup-py
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
  - id: well-known/tool/offensive/
  - id: metadata/file/naming::test-directory-component
- crit: notable
  for:
  - python
  - whl
  id: python-oob-json-callback-context
  desc: Python OOB JSON callback observations
  conf: 0.95
  scope: file
  any:
  - id: micro-behaviors/communications/http/webhook::python-oob-json-post-cooccurrence
  - id: micro-behaviors/communications/http/request/json::python-urllib-json-request-oob-reference
defaults:
  platforms:
  - unix
  - windows
