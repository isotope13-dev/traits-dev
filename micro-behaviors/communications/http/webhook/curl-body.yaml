defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: curl-webhook-site-body-command
    desc: Curl body flag targets webhook.site
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command
          name: (command_name (word) @curl)
          argument: [(word) (string) (raw_string)] @flag
          argument: [(word) (string) (raw_string) (concatenation)] @url) @send
          (#eq? @curl "curl")
          (#match? @flag "^[\"']?(-d|--data(-binary|-raw|-urlencode)?(=|[\"']?$))")
          (#match? @url "^[\"']?https?://webhook\\.site/"))
        ((command
          name: (command_name (word) @curl)
          argument: [(word) (string) (raw_string) (concatenation)] @url
          argument: [(word) (string) (raw_string)] @flag) @send
          (#eq? @curl "curl")
          (#match? @flag "^[\"']?(-d|--data(-binary|-raw|-urlencode)?(=|[\"']?$))")
          (#match? @url "^[\"']?https?://webhook\\.site/"))
