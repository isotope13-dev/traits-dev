defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: request-post-option
    desc: request() specifies a POST method
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments
            (object (pair key: (property_identifier) @key
              value: (string (string_fragment) @verb))))) @call
         (#eq? @method "request")
         (#eq? @key "method")
         (#eq? @verb "POST"))
