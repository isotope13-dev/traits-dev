defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, php, html, shell]
  mbc: C0002
  attack: T1071.001
traits:
  - id: post-request-line
    desc: HTTP POST request line
    crit: notable
    conf: 0.78
    for: [binaries, scripts]
    if:
      type: text
      regex: \bPOST\s+\S+\s+HTTP/1\.[01]\b
  - id: native-post-request-line
    desc: Native HTTP POST request line
    crit: notable
    conf: 0.82
    for: [pe, dll, c, cpp, rust, go]
    if:
      type: text
      regex: 'POST .{0,120} HTTP/1\.[01]'
  - id: post
    desc: HTTP POST method string literal
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\"\x27]POST[\"\x27]'
  - id: http-post-call
    desc: Calls an HTTP POST client method
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)_?https?\.(post|post_json)$'
  - id: powershell-post-method
    desc: PowerShell HTTP request uses the POST method
    crit: notable
    conf: 0.86
    for: [powershell]
    if:
      type: text
      regex: '(?i)-Method\s+["'']?POST\b'
  - id: fetch-post-call
    desc: Sends an HTTP POST request with fetch()
    crit: notable
    conf: 0.72
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\([\s\S]{0,180}method:\s*["'']POST'
    unless:
      - id: metadata/package/testing/harness/runtime/
  # Base64-wrapping a JSON POST body is a common exfil packing step in
  # browser extensions and page injectors; pair with cookie/storage sinks
  # in objectives rather than treating the encode alone as hostile.
  - id: fetch-post-b64encode-body
    desc: Fetch POST body passed through b64encode
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'method:\s*["'']POST["'']\s*,\s*body:\s*b64encode\s*\('
  - id: no-cors-before-post
    desc: No-cors mode before POST
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'mode:\s*["'']no-cors["''][\s\S]{0,120}method:\s*["'']POST["'']'
  - id: post-before-no-cors
    desc: POST method before no-cors
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'method:\s*["'']POST["''][\s\S]{0,120}mode:\s*["'']no-cors["'']'
  - id: http-request-post
    desc: http.request with POST
    crit: notable
    conf: 0.7
    for: [javascript, typescript]
    if:
      type: text
      regex: http\.request\(.{0,100}method:\s*["\']POST

  - id: node-https-request-post
    desc: https.request with POST
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: https\.request\(.{0,180}method:\s*["'']POST

  - id: request-options-post-method
    desc: Sets POST as an HTTP request method
    crit: component
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bmethod\s*:\s*["'']POST["'']'
  - id: js-fetch-body-variable
    desc: Fetch call passes a variable request body
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    if:
      # Restrict the text shape to parsed call expressions. Documentation in
      # generated JavaScript and declaration files often includes this exact
      # fetch example without executing it.
      type: tree-sitter
      kind: call
      regex: '\bfetch\s*\([^)]{0,100}\bbody\s*:\s*[A-Za-z_$][A-Za-z0-9_$]*\s*[,}]'
  - id: raw-content-length-header
    desc: Sets an HTTP Content-Length header
    crit: notable
    conf: 0.9
    for: [pe, dll, javascript, typescript]
    if:
      type: text
      regex: '(["'']Content-Length["'']\s*:|\.(set|append)\s*\(\s*["'']Content-Length["''])'
      case_insensitive: true
  - id: request-write-payload-variable
    desc: HTTP request sends payload variable
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^r(equest|eq)?\.(write|post|send)$'
      arg:
        kind: identifier
        name: payload
  - id: request-write-file-data-variable
    desc: HTTP request sends file data variable
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^r(equest|eq)?\.(write|post|send)$'
      arg:
        kind: identifier
        name: fileData
  - id: multipart-form
    desc: multipart/form-data content type
    crit: component
    conf: 0.6
    if:
      type: text
      substr: multipart/form-data
    unless:
      - id: metadata/file/string/identity::python3-interpreter-basename
      - id: metadata/library/runtime/
  - id: formdata-class
    desc: Constructs browser FormData
    crit: notable
    conf: 0.75
    # Inline `<script>` in an HTML page constructs FormData the same way; the
    # html spelling used to be a second copy of this matcher living under
    # objectives/credential-access/phishing/captive-portal, where the directory
    # asserted phishing for a neutral request-body constructor.
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bnew\s+FormData\s*\('
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/library/runtime/
      - id: metadata/library/axios::axios-class
      - id: metadata/library/axios::axios-version
      - id: metadata/package/testing/harness/runtime/
  - id: enctype-attr
    desc: HTML form encoding attribute
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: \benctype\s*=
    unless:
      - id: metadata/document/html/
  - id: url-encoded-content-type
    desc: Uses URL-encoded HTTP form content
    crit: component
    conf: 0.7
    unless:
      - type: text
        substr: google/protobuf/descriptor.proto
      - type: text
        substr: Vungle Third-Party MRAID Template
      - type: basename
        exact: System.Net.Http.dll
    if:
      type: text
      substr: application/x-www-form-urlencoded
  - id: post-ast
    desc: HTTP POST request via client call
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: ^((http|https)\.post|axios\.post)$
  - id: axios-post-env-body
    desc: Axios POST uses env-named body variable
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'axios\.post\s*\([^,]{0,260},\s*(env|envToSave|environment|envData)\b'
  - id: client-wrapper-post-call
    desc: HTTP client wrapper POST call
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(this\.)?(client|https?|request)\.post\s*\('
  - id: javascript-formdata-file-field
    desc: JavaScript FormData file field
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new\s+FormData\s*\(\s*\)[\s\S]{0,300}\.append\s*\(\s*["'']file["'']'
  - id: javascript-http-request-post
    desc: JavaScript HttpRequest POST call
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bnew\s+(http\.)?HttpRequest\s*\(\s*["'']POST["'']'
  - id: lua-http-request
    desc: Lua HTTP request call
    crit: notable
    conf: 0.82
    for: [lua]
    if:
      type: symbol
      exact: http.request
  - id: lua-post-method
    desc: Lua POST method literal
    crit: component
    conf: 0.78
    for: [lua]
    if:
      type: string_literal
      exact: POST
  - id: lua-lcurl-post-option
    desc: Lua libcurl POST option
    crit: notable
    conf: 0.88
    for: [lua]
    if:
      type: text
      substr: curl.OPT_POST
  - id: xhr-post-open
    desc: Opens an XMLHttpRequest with HTTP POST
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '\.open$'
      arg:
        kind: string
        exact: POST
  # Neutral transport mechanics.  These two were previously filed under
  # objectives/credential-access/phishing/, where their names asserted a
  # phishing page that neither matcher inspects; the phishing composites now
  # reference them cross-directory and supply the intent themselves.
  - id: xhr-post-open-send
    desc: Opens and sends an XMLHttpRequest POST
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '(?is)\.open\s*\(\s*["'']POST["''][\s\S]{0,220}\.send\s*\('
  - id: html-form-post-method
    desc: HTML form declares the POST method
    crit: notable
    conf: 0.96
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '<form\b[^>]{0,180}method\s*=\s*["'']?post\b'
      case_insensitive: true
  # The form's *destination* (an absolute action URL) is a request-target fact
  # and lives at micro-behaviors/communications/http/request/html; this file
  # keeps the method declaration.

composite_rules:
  - id: post-method-detection
    desc: Uses an HTTP POST request method
    crit: notable
    conf: 0.75
    any:
      - id: post-request-line
      - id: http-post-call
      - id: lua-http-post-request
      - id: powershell-post-method
  - id: post-form
    desc: HTTP form submission encoding
    crit: notable
    conf: 0.75
    any:
      - id: multipart-form
      - id: formdata-class
      - id: enctype-attr
      - id: url-encoded-content-type
  - id: javascript-formdata-file-upload-request
    desc: JavaScript multipart file upload request
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    near_lines: 12
    all:
      - id: javascript-formdata-file-field
      - id: javascript-http-request-post
  - id: lua-http-post-request
    desc: Lua HTTP POST request
    crit: notable
    conf: 0.86
    all:
      - id: lua-http-request
      - id: lua-post-method
  - id: no-cors-post-request
    desc: No-cors POST request
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    any:
      - id: no-cors-before-post
      - id: post-before-no-cors
  - id: js-fetch-post-body-variable
    desc: Fetch POST body uses a variable
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    near_lines: 8
    all:
      - id: fetch-post-call
      - id: js-fetch-body-variable
