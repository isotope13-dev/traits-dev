defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - php
  - html
  - shell
  mbc: C0002
  crit: notable
traits:
- id: post-request-line
  desc: HTTP POST request line
  conf: 0.78
  for:
  - binaries
  - scripts
  - rust
  - c
  - cpp
  - go
  - csharp
  - text
  - data
  if:
    type: text
    regex: \bPOST\s+\S+\s+HTTP/1\.[01]\b
- id: native-post-method-token
  desc: HTTP POST method token in binary text
  conf: 0.72
  for:
  - class
  - dex
  - dll
  - elf
  - macho
  - pe
  platforms:
  - android
  - unix
  - windows
  if:
    type: text
    exact: POST
- id: post
  for:
  - python
  - javascript
  - powershell
  - php
  - html
  - shell
  - asp
  desc: HTTP POST method string literal
  conf: 0.7
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: '[\"\x27]POST[\"\x27]'
- id: http-post-call
  desc: Calls an HTTP POST client method
  conf: 0.7
  for:
  - python
  - javascript
  - typescript
  - powershell
  - php
  - html
  - shell
  if:
    type: symbol
    kind: call
    regex: (^|\.)_?https?(Client)?\.post(_json)?$|(\.api\.post|^postJsonToApi)$
- id: powershell-post-method
  desc: PowerShell HTTP call with POST method argument
  conf: 0.86
  for:
  - powershell
  if:
    type: tree-sitter
    query: |
      ((command
          command_name: [(command_name) (command_name_expr)] @client
          command_elements: (command_elements
            (command_parameter) @parameter
            . (command_argument_sep)
            . [(generic_token) @method
               (array_literal_expression
                 . (unary_expression
                   . (string_literal
                     [(verbatim_string_characters) (expandable_string_literal)] @method)))])) @call
        (#match? @client "(?i)^(Invoke-WebRequest|Invoke-RestMethod|iwr|irm|'Invoke-WebRequest'|'Invoke-RestMethod'|'iwr'|'irm'|\"Invoke-WebRequest\"|\"Invoke-RestMethod\"|\"iwr\"|\"irm\")$")
        (#match? @parameter "(?i)^-Method:?$")
        (#match? @method "(?i)^(POST|'POST'|\"POST\")$"))
- id: fetch-post-call
  desc: Calls fetch with a POST method option
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (identifier) @fetch
        arguments: (arguments
          . (_)
          . (object (pair
            key: [(property_identifier) (string)] @key
            value: [(string) (template_string)] @method)))) @call
        (#eq? @fetch "fetch")
        (#match? @key "^['\"]?method['\"]?$")
        (#match? @method "^.POST.$"))
- id: node-http-request-post
  desc: Node HTTP(S) request specifies POST
  for:
  - javascript
  - typescript
  conf: 0.84
  if:
    type: text
    regex: https?\.request\(.{0,180}method:\s*["']POST
- id: request-options-post-method
  desc: Script request option specifies POST
  conf: 0.86
  for:
  - javascript
  - typescript
  - php
  - html
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: \b(method|type)\s*:\s*["']POST["']
- id: supported-methods-post
  desc: Supported-methods list includes POST
  conf: 0.74
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \bmethods\s*:\s*\[[^\]]{0,220}["']POST["']
- id: axios-post-env-body
  desc: Axios POST uses env-named body variable
  conf: 0.86
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: axios\.post\s*\([^,]{0,260},\s*(env|envToSave|environment|envData)\b
- id: client-wrapper-post-call
  desc: HTTP client wrapper POST call
  conf: 0.8
  for:
  - javascript
  - typescript
  - pe
  if:
    type: text
    regex: \b(this\.)?(client|https?|request)\.post\s*\(|\bhttpPost\s*\(
- id: javascript-http-request-post
  desc: JavaScript HttpRequest POST call
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \bnew\s+(http\.)?HttpRequest\s*\(\s*["']POST["']
- id: lua-lcurl-post-option
  desc: Lua libcurl POST option
  conf: 0.88
  for:
  - lua
  if:
    type: text
    substr: curl.OPT_POST
- id: xhr-post-open
  desc: Opens a script HTTP client with POST
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: \.open$
    arg:
      kind: string
      exact: POST
- id: xhr-post-open-send
  desc: HTTP POST open and send calls co-occur
  conf: 0.9
  for:
  - html
  - javascript
  - typescript
  - php
  - text
  if:
    type: text
    regex: (?is)\.open\s*\(\s*["']POST["'][\s\S]{0,220}\.send\s*\(
- id: fetch-flow-json-post-body
  desc: fetch POST sends a JSON.stringify body
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    exact: fetch
    args:
    - index: 1
      from:
        field: method
        value: ^POST$
    - index: 1
      from:
        field: body
        call: ^JSON\.stringify$
composite_rules:
- id: post-method-detection
  desc: Uses an HTTP POST request method
  conf: 0.75
  any:
  - id: post-request-line
  - id: http-post-call
  - id: lua-http-post-request
  - id: powershell-post-method
  - id: micro-behaviors/communications/http/post::requests-post
- id: lua-http-post-request
  for:
  - lua
  desc: Lua HTTP POST request
  conf: 0.86
  all:
  - id: micro-behaviors/communications/http/request/client::lua-http-request
  - id: script-post-method-literal
- id: js-fetch-post-request
  desc: fetch() call configured as an HTTP POST
  conf: 0.9
  for:
  - html
  - javascript
  - typescript
  any:
  - id: fetch-post-call
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: html-fetch-post-call
- id: fetch-computed-url-post-with-variable-body
  desc: Fetch POST sends a variable body to a computed URL
  conf: 0.86
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/request/url-computed::fetch-concatenated-url
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: metadata/lang/source/syntax/key-value::body-field-identifier
  near_bytes: 260
