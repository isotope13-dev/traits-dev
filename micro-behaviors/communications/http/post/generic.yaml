defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, php, html, shell]
  mbc: C0002
  attack: T1071.001
traits:
  - id: post-request-line
    desc: HTTP POST request line
    crit: notable
    conf: 0.78
    for: [binaries, scripts, rust, c, cpp, go]
    if:
      type: text
      regex: \bPOST\s+\S+\s+HTTP/1\.[01]\b
  - id: native-post-method-token
    desc: Native HTTP POST method token
    crit: component
    conf: 0.72
    for: [elf, macho]
    if:
      type: text
      exact: POST
  - id: post
    for: [python, javascript, powershell, php, html, shell, asp]
    desc: HTTP POST method string literal
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '[\"\x27]POST[\"\x27]'
  - id: http-post-call
    desc: Calls an HTTP POST client method
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)_?https?\.(post|post_json)$|^postJsonToApi$'
  - id: powershell-post-method
    desc: PowerShell HTTP call with POST method argument
    crit: notable
    conf: 0.86
    for: [powershell]
    if:
      type: tree-sitter
      query: |
        ((command
            command_name: [(command_name) (command_name_expr)] @client
            command_elements: (command_elements
              (command_parameter) @parameter
              . (command_argument_sep)
              . [(generic_token) @method
                 (array_literal_expression
                   . (unary_expression
                     . (string_literal
                       [(verbatim_string_characters) (expandable_string_literal)] @method)))])) @call
          (#match? @client "(?i)^(Invoke-WebRequest|Invoke-RestMethod|iwr|irm|'Invoke-WebRequest'|'Invoke-RestMethod'|'iwr'|'irm'|\"Invoke-WebRequest\"|\"Invoke-RestMethod\"|\"iwr\"|\"irm\")$")
          (#match? @parameter "(?i)^-Method:?$")
          (#match? @method "(?i)^(POST|'POST'|\"POST\")$"))
  - id: fetch-post-call
    desc: Calls fetch with a POST method option
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @fetch
          arguments: (arguments
            . (_)
            . (object (pair
              key: [(property_identifier) (string)] @key
              value: [(string) (template_string)] @method)))) @call
          (#eq? @fetch "fetch")
          (#match? @key "^['\"]?method['\"]?$")
          (#match? @method "^.POST.$"))
  - id: http-request-post
    desc: http.request with POST
    crit: notable
    conf: 0.7
    for: [javascript, typescript]
    if:
      type: text
      regex: http\.request\(.{0,100}method:\s*["\']POST
  - id: node-https-request-post
    desc: https.request with POST
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: https\.request\(.{0,180}method:\s*["'']POST
  - id: request-options-post-method
    desc: Sets POST as an HTTP request method
    crit: notable
    conf: 0.86
    for: [javascript, typescript, php]
    if:
      type: text
      regex: '\bmethod\s*:\s*["'']POST["'']'
  # The same declaration in its plural form: an options object enumerating the
  # methods a client or registry supports (`methods: ["GET", "POST", ...]`)
  # rather than configuring one request. Requires the `methods:` key so a bare
  # quoted verb elsewhere does not match.
  - id: supported-methods-post
    desc: Supported-methods list includes POST
    crit: notable
    conf: 0.74
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bmethods\s*:\s*\[[^\]]{0,220}["'']POST["'']'
  - id: post-ast
    desc: HTTP POST request via client call
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: ^((http|https)\.post|axios\.post)$
  - id: axios-post-env-body
    desc: Axios POST uses env-named body variable
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'axios\.post\s*\([^,]{0,260},\s*(env|envToSave|environment|envData)\b'
  - id: client-wrapper-post-call
    desc: HTTP client wrapper POST call
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(this\.)?(client|https?|request)\.post\s*\('
  - id: javascript-http-request-post
    desc: JavaScript HttpRequest POST call
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bnew\s+(http\.)?HttpRequest\s*\(\s*["'']POST["'']'
  - id: lua-lcurl-post-option
    desc: Lua libcurl POST option
    crit: notable
    conf: 0.88
    for: [lua]
    if:
      type: text
      substr: curl.OPT_POST
  - id: xhr-post-open
    desc: Opens an XMLHttpRequest with HTTP POST
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '\.open$'
      arg:
        kind: string
        exact: POST
  # Neutral transport mechanics.  These two were previously filed under
  # objectives/credential-access/phishing/, where their names asserted a
  # phishing page that neither matcher inspects; the phishing composites now
  # reference them cross-directory and supply the intent themselves.
  - id: xhr-post-open-send
    desc: Opens and sends an XMLHttpRequest POST
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php, text]
    if:
      type: text
      regex: '(?is)\.open\s*\(\s*["'']POST["''][\s\S]{0,220}\.send\s*\('
  - id: html-form-post-method
    desc: HTML form declares the POST method
    crit: notable
    conf: 0.96
    for: [html, javascript, typescript, php, batch, makefile, text]
    if:
      type: text
      regex: '<form\b[^>]{0,180}method\s*=\s*["'']?post\b'
      case_insensitive: true
  # The form's *destination* (an absolute action URL) is a request-target fact
  # and lives at micro-behaviors/communications/http/request/html; this file
  # keeps the method declaration.
  # Bind the serialized value to the POST body of the same fetch call.
  # File-wide serialization plus a POST token does not establish a JSON body.
  - id: fetch-flow-json-post-body
    desc: fetch POST sends a JSON.stringify body
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: fetch
      args:
        - index: 1
          from:
            field: method
            value: '^POST$'
        - index: 1
          from:
            field: body
            call: '^JSON\.stringify$'
composite_rules:
  - id: browser-http-post-call
    desc: Browser code sends an HTTP POST request
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    any:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call

  - id: post-method-detection
    desc: Uses an HTTP POST request method
    crit: notable
    conf: 0.75
    any:
      - id: post-request-line
      - id: http-post-call
      - id: lua-http-post-request
      - id: powershell-post-method
      - id: micro-behaviors/communications/http/post::requests-post
  - id: lua-http-post-request
    for: [lua]
    desc: Lua HTTP POST request
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/communications/http/request/client::lua-http-request
      - id: script-post-method-literal
  # The same fact -- a fetch() call configured as an HTTP POST -- reached
  # either through the parsed call shape (`fetch-post-pattern`, which needs the
  # first argument to look like a URL) or through the textual option form,
  # which still matches when the base URL sits in a plainly named constant
  # (`fetch(C2 + path, { method: "POST" })`). Composites that want "this code
  # POSTs with fetch" should reference this so the naming of one variable does
  # not decide whether they fire.
  - id: js-fetch-post-request
    desc: fetch() call configured as an HTTP POST
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: fetch-post-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: fetch-computed-url-post-with-variable-body
    desc: Fetch POST sends a variable body to a computed URL
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/request/url-computed::fetch-concatenated-url
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/request/body::options-body-from-variable
    near_bytes: 260
