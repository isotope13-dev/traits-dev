defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Flow projection omits anonymous callback bodies. Bind both options within
  # one parsed fetch call to preserve detection there without file-wide joins.
  - id: fetch-direct-json-post-body
    desc: fetch POST directly serializes JSON body
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments
            . (_)
            . (object
              (pair key: [(property_identifier) (string)] @method_key
                value: (string) @method)
              (pair key: [(property_identifier) (string)] @body_key
                value: (call_expression
                  function: (member_expression
                    object: (identifier) @json
                    property: (property_identifier) @serialize)))))) @call
          (#eq? @fn "fetch")
          (#match? @method_key "^['\"]?method['\"]?$")
          (#match? @method "^['\"]POST['\"]$")
          (#match? @body_key "^['\"]?body['\"]?$")
          (#eq? @json "JSON")
          (#eq? @serialize "stringify"))

composite_rules:
  - id: json-body-post
    desc: fetch POST sends a JSON.stringify body
    crit: notable
    conf: 0.98
    all:
      - id: fetch-post-call
    any:
      - id: fetch-direct-json-post-body
      - id: fetch-flow-json-post-body
