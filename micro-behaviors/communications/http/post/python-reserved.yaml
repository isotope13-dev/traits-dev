defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-reserved-url-post
    desc: Posts to a reserved example URL
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx|session|r)\.post$'
      arg:
        index: 0
        kind: string
        regex: '^https?://[a-zA-Z0-9.-]{1,120}\.(example|invalid|test)([:/]|$)'
  - id: python-example-domain-post
    desc: Posts to an example domain
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx|session|r)\.post$'
      arg:
        index: 0
        kind: string
        regex: '^https?://([a-zA-Z0-9-]{1,63}\.){0,4}example\.(com|org|net)([:/]|$)'
