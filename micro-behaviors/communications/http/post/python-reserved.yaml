defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-reserved-url-post
    desc: Posts to a reserved example URL
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.post$'
      arg:
        index: 0
        kind: string
        regex: '^https?://[a-zA-Z0-9.-]{1,120}\.(example|invalid|test)([:/]|$)'
