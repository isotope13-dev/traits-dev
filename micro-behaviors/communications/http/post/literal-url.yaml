defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-post-url-literal
    desc: Python POST call receives URL literal
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx|session|r)\.post$'
      arg:
        kind: string
        regex: '^https?://'
    unless:
      - type: basename
        regex: (test_|_test\.|\.test\.|\.spec\.).*\.(py)$
