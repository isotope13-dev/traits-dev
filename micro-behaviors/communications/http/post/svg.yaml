defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1071.001

traits:
  - id: svg-fetch-post-request
    desc: SVG fetch sends HTTP POST
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bfetch\s*\(\s*["'']https?://[^"'']{1,240}["''][^)]{0,400}\bmethod\s*:\s*["'']POST["'']'
