defaults:
  crit: notable
  conf: 0.88
  attack: T1071.001
  mbc: C0002
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-reqwest-post-call
    desc: Rust reqwest POST call
    if:
      type: tree-sitter
      query: |
        ((block
          (let_declaration pattern: (identifier) @client
            value: (call_expression function: (scoped_identifier) @factory)) @binding
          (let_declaration value: (call_expression function: (field_expression
            value: (call_expression function: (field_expression
              value: (call_expression function: (field_expression value: (identifier) @receiver field: (field_identifier) @post)))))))) @request
          (#eq? @client @receiver)
          (#match? @factory "^reqwest::(blocking::)?Client::new$")
          (#not-match? @binding "^let\\s+mut\\b")
          (#eq? @post "post"))
        ((call_expression function: (field_expression
          value: (call_expression function: (scoped_identifier) @factory)
          field: (field_identifier) @post)) @request
          (#match? @factory "^reqwest::(blocking::)?Client::new$")
          (#eq? @post "post"))
        ((block
          (let_declaration pattern: (identifier) @client
            value: (call_expression function: (scoped_identifier) @factory)) @binding
          [
            (expression_statement (call_expression function: (field_expression value: (identifier) @receiver field: (field_identifier) @post)))
            (let_declaration value: (call_expression function: (field_expression value: (identifier) @receiver field: (field_identifier) @post)))
          ]) @request
          (#eq? @client @receiver)
          (#match? @factory "^reqwest::(blocking::)?Client::new$")
          (#not-match? @binding "^let\\s+mut\\b")
          (#eq? @post "post"))

  - id: rust-ureq-post-call
    desc: Rust ureq POST call
    if:
      type: text
      regex: 'ureq(::|\.)post\s*\(|ureq.{0,120}(\.post\s*\(|\.call\s*\(\s*"POST")'

  - id: rust-agent-post-call
    desc: Rust agent HTTP POST call
    if:
      type: text
      substr: agent.post(&url)

  - id: rust-curl-post-argument
    desc: Rust curl POST argument
    if:
      type: text
      regex: 'Command::new\("curl"\)[\s\S]{0,300}\.(arg|args)\([^)]{0,140}"POST"'

  - id: rust-curl-data-argument
    desc: Rust curl data argument
    if:
      type: text
      regex: 'Command::new\("curl"\)[\s\S]{0,220}\.(arg|args)\([^)]{0,100}"(-d|--data(-raw)?)"'
