# A parent path can be unrelated to the outgoing request. This observation
# records bounded co-occurrence, not a file-upload exploit or filename flow.
# Objective consumers must supply an attack-specific target and payload.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: binary-post-parent-path-cooccurrence
    desc: Binary POST near parent-path construction
    crit: notable
    conf: 0.95
    near_bytes: 3072
    all:
      - id: micro-behaviors/fs/path/traversal::parent-directory-traversal-payload
      - id: micro-behaviors/data/format/mime::mime-octet-stream
    any:
      - id: micro-behaviors/communications/http/post::python-httpclient-post-transport
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: micro-behaviors/communications/http/post::net-http-post
      - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
      - id: micro-behaviors/communications/http/post::powershell-post-method
