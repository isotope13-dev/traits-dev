# Reviewed observations: capability, source shape, and intent stay distinct.
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-module-post-url-body
  desc: Top-level Python POST with URL and body
  crit: notable
  conf: 0.9
  if:
    # Extracted text runs can strip indentation and decode quoted source.
    # Require the call itself to be a direct module statement.
    type: tree-sitter
    query: |
      ((module
        (expression_statement (call
          function: (attribute object: (identifier) @client
            attribute: (identifier) @post)
          arguments: (argument_list . (string) @url
            (keyword_argument name: (identifier) @body))))) @operation
        (#match? @client "^(requests|httpx)$")
        (#eq? @post "post")
        (#match? @url "^['\"]https?://")
        (#match? @body "^(data|json)$"))
