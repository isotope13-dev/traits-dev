defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  - id: urllib-nested-request-body
    desc: urlopen submits Request with a data body
    if:
      type: tree-sitter
      query: |
        ((call
          function: (identifier) @open
          arguments: (argument_list
            (call function: (identifier) @request
              arguments: (argument_list
                . (_) .
                (keyword_argument name: (identifier) @data value: (identifier)) .
                (keyword_argument name: (identifier) @headers)? .) @request_args)))
          (#eq? @open "urlopen")
          (#eq? @request "Request")
          (#eq? @data "data")
          (#eq? @headers "headers")
          (#not-match? @request_args "\\bmethod\\s*="))
