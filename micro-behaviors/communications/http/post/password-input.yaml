defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: password-input-value-json-post
    desc: Password input value enters fetch JSON POST
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator name: (identifier) @captured
              value: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @document
                    property: (property_identifier) @select)
                  arguments: (arguments (string) @selector))
                property: (property_identifier) @value))) @binding
          (expression_statement
            (call_expression function: (identifier) @fetch
              arguments: (arguments
                (string) @destination
                (object
                  (pair key: [(property_identifier) (string)] @method_key
                    value: (string) @method)
                  (pair key: [(property_identifier) (string)] @body_key
                    value: (call_expression
                      function: (member_expression object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments (object [
                        (shorthand_property_identifier) @sent
                        (pair value: (identifier) @sent)
                      ])))))))) @post)
          (#match? @binding "^const\\s")
          (#eq? @document "document")
          (#eq? @select "querySelector")
          (#match? @selector "input\\[type\\s*=\\s*[\"']password[\"']\\]")
          (#eq? @value "value")
          (#eq? @fetch "fetch")
          (#match? @destination "^[\"']https?://([a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}")
          (#not-match? @destination "(?i)https?://[^/\"']+\\.(invalid|test|localhost|example|local)([:/\"']|$)")
          (#not-match? @destination "(?i)https?://([a-z0-9-]+\\.)*example\\.(com|org|net)([:/\"']|$)")
          (#match? @method_key "^[\"']?method[\"']?$")
          (#match? @method "^[\"']POST[\"']$")
          (#match? @body_key "^[\"']?body[\"']?$")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @captured @sent))
