defaults:
  crit: notable
  platforms: [windows, unix]
  for: [swift]
  mbc: C0002
  attack: T1071.001

traits:
  - id: swift-urlrequest-post-method
    desc: Swift URLRequest POST method
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        (_
          (property_declaration
            name: (pattern bound_identifier: (simple_identifier) @binding)
            value: (call_expression (simple_identifier) @constructor))
          (assignment
            target: (directly_assignable_expression
              (navigation_expression target: (simple_identifier) @receiver
                suffix: (navigation_suffix suffix: (simple_identifier) @property)))
            result: (line_string_literal) @verb)
          (#eq? @constructor "URLRequest")
          (#eq? @binding @receiver)
          (#eq? @property "httpMethod")
          (#eq? @verb "\"POST\""))
