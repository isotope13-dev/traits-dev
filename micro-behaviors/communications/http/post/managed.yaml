defaults:
  crit: notable
  conf: 0.8
  for: [pe, dll, csharp, powershell]
  platforms: [windows]

composite_rules:
- id: postasync
  desc: .NET HTTP client and async POST helper references
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/communications/http/client/managed::httpclient-reference-or-construction
  any:
  - id: metadata/binary/symbols/name/token::dotnet-postasync-method-name
  - id: metadata/binary/symbols/name/token::dotnet-postasjsonasync-method-name
  - id: metadata/file/function::postasync-name-reference
  unless:
  - id: well-known/game/mod::bedrockboot-source-repository
