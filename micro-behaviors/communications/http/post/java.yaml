defaults:
  platforms: [windows, unix, android]
  for: [class, jar, zip]
  mbc: C0002
  attack: T1071.001
traits:
  - id: airlift-prepare-post-bytecode
    desc: Airlift Java HTTP POST request
    crit: notable
    conf: 0.96
    for: [class]
    if:
      type: import
      exact: io/airlift/http/client/Request$Builder.preparePost
  # kotlin.io copyTo$default (the Kotlin stream/file copy bridge) moved to
  # micro-behaviors/data/buffer/transfer::kotlin-bytecode-copyto-default -- moving bytes
  # between two streams is not an HTTP POST, and every Kotlin app that copies a
  # stream emits the symbol. The exfil composites that pair it with a POST
  # supply the HTTP context from their other legs.
composite_rules:
  - id: java-urlconnection-post-source
    desc: Java URLConnection POST request
    crit: notable
    conf: 0.92
    for: [java]
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection
      - id: source-post-method-literal
      - id: metadata/lang/source/shape::jvm-do-output-configuration
  - id: jvm-urlconnection-post-source
    desc: Java/Kotlin URLConnection POST request
    crit: notable
    conf: 0.93
    for: [java, kotlin]
    all:
      - id: micro-behaviors/communications/http/client/initialize::jvm-urlconnection-open-source
      - id: metadata/lang/source/syntax/call/invocation::jvm-post-method-source
      - id: metadata/lang/source/shape::jvm-do-output-configuration
  - id: jvm-urlconnection-post-bytecode
    desc: Java bytecode URLConnection POST request
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
      - id: micro-behaviors/communications/http/post::jvm-post-token
      - id: metadata/binary/symbols/name/token::jvm-set-do-output-member
  # DEX is a separate scanner filetype from JVM class files. Its method and
  # constant-pool names are exposed as text, so give Android bytecode the same
  # HTTP POST coverage rather than relying on class-only import/string facts.
  - id: jvm-urlconnection-post-dex
    desc: Android DEX URLConnection POST request
    crit: notable
    conf: 0.92
    for: [dex]
    all:
      - id: metadata/binary/symbols/descriptor::dex-httpurlconnection-type
      - id: micro-behaviors/communications/http/post::native-post-method-token
      - id: metadata/binary/symbols/name/token::dex-set-do-output-name
  - id: java-json-post
    desc: Java JSON POST request
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/communications/http/post::native-post-method-token
      - id: micro-behaviors/communications/http/header/content-type::java-json-content-type
