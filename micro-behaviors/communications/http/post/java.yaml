defaults:
  platforms: [windows, unix, android]
  for: [class, jar, zip]
  mbc: C0002
  attack: T1071.001
traits:
  - id: java-post-method-source
    desc: Java HTTP POST request method
    crit: component
    conf: 0.9
    for: [java]
    if:
      type: text
      exact: 'setRequestMethod("POST")'
  - id: java-do-output-source
    desc: Java HTTP request body enabled
    crit: component
    conf: 0.86
    for: [java]
    if:
      type: text
      exact: setDoOutput(true)
  - id: java-post-method
    desc: Java HTTP POST method
    crit: component
    conf: 0.8
    if:
      type: text
      exact: POST
  - id: jvm-bytecode-do-output
    desc: Java bytecode HTTP output body enabled
    crit: notable
    conf: 0.86
    if:
      type: symbol
      exact: setDoOutput
  - id: airlift-prepare-post-bytecode
    desc: Airlift Java HTTP POST request
    crit: notable
    conf: 0.96
    if:
      type: import
      exact: io/airlift/http/client/Request$Builder.preparePost
  # kotlin.io copyTo$default (the Kotlin stream/file copy bridge) moved to
  # micro-behaviors/data/buffer::kotlin-bytecode-copyto-default -- moving bytes
  # between two streams is not an HTTP POST, and every Kotlin app that copies a
  # stream emits the symbol. The exfil composites that pair it with a POST
  # supply the HTTP context from their other legs.
  - id: java-json-content-type
    desc: Java JSON content type
    crit: component
    conf: 0.78
    if:
      type: value
      path: class.strings[*]
      exact: application/json
  - id: jvm-post-method-source
    desc: Java/Kotlin HTTP POST request method
    crit: component
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: 'setRequestMethod\s*\(\s*"POST"\s*\)|requestMethod\s*=\s*"POST"'
  - id: jvm-urlconnection-open-java-source
    desc: Java opens URLConnection
    crit: component
    conf: 0.88
    for: [java]
    if:
      type: text
      regex: 'Https?URLConnection.{0,80}openConnection\s*\('
  - id: jvm-urlconnection-open-kotlin-source
    desc: Kotlin opens URLConnection
    crit: component
    conf: 0.88
    for: [kotlin]
    if:
      type: text
      regex: 'openConnection\s*\(\)\s+as\s+Https?URLConnection'
  - id: jvm-do-output-source
    desc: Java/Kotlin HTTP request body enabled
    crit: component
    conf: 0.86
    for: [java, kotlin]
    if:
      type: text
      regex: 'setDoOutput\s*\(\s*true\s*\)|doOutput\s*=\s*true'
  - id: jvm-http-body-write-source
    desc: Java/Kotlin writes HTTP request body
    crit: notable
    conf: 0.88
    for: [java, kotlin]
    if:
      type: text
      # A bare getOutputStream().write() is equally common on sockets and
      # process pipes. Require the conventional HTTP connection receiver so
      # this remains an HTTP-body observation rather than a generic stream write.
      regex: '(?i)\b\w*conn\w*\.(getOutputStream\(\)|outputStream)[^\n;]{0,120}\.write\s*\('
  # The receiver has to be the connection. `outputStream { … copyTo(…) }` on
  # its own is the ordinary Kotlin file/resource copy idiom
  # (`File(x).outputStream().use { input.copyTo(it) }`) and says nothing
  # about HTTP; requiring `conn`/`connection` in front keeps this to the
  # HttpURLConnection request-body write it claims to detect.
  - id: kotlin-http-body-copy-source
    desc: Kotlin copies stream into a connection body
    crit: notable
    conf: 0.88
    for: [kotlin]
    if:
      type: text
      regex: '(?i)conn(ection)?\.outputStream[\s\S]{0,160}copyTo\s*\('
  # Setting an octet-stream Content-Type and writing the request body is the
  # ordinary way to PUT/POST arbitrary binary data over HttpURLConnection --
  # every raw-HTTP file upload (S3 pre-signed URL PUTs, WorkDocs uploads,
  # attachment APIs) looks exactly like this. It carries no exfil-specific
  # intent by itself; objectives/exfiltration composites add the destination
  # (a hardcoded collect endpoint, etc.) that makes the combination suspicious.
  - id: octet-stream-body-write
    desc: Sets octet-stream type and writes HTTP body
    crit: notable
    conf: 0.88
    for: [java, kotlin]
    if:
      type: text
      regex: 'Content-Type[\s\S]{0,120}application/octet-stream[\s\S]{0,260}getOutputStream'
composite_rules:
  - id: jvm-urlconnection-open-source
    desc: Java/Kotlin opens URLConnection
    crit: component
    conf: 0.89
    for: [java, kotlin]
    any:
      - id: jvm-urlconnection-open-java-source
      - id: jvm-urlconnection-open-kotlin-source
  - id: java-urlconnection-post-source
    desc: Java URLConnection POST request
    crit: notable
    conf: 0.92
    for: [java]
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection
      - id: java-post-method-source
      - id: java-do-output-source
  - id: jvm-urlconnection-post-source
    desc: Java/Kotlin URLConnection POST request
    crit: notable
    conf: 0.93
    for: [java, kotlin]
    all:
      - id: jvm-urlconnection-open-source
      - id: jvm-post-method-source
      - id: jvm-do-output-source
  - id: jvm-urlconnection-post-bytecode
    desc: Java bytecode URLConnection POST request
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
      - id: metadata/file/string/identity::jvm-post-token
      - id: jvm-bytecode-do-output
  - id: java-json-post
    desc: Java JSON POST request
    crit: notable
    conf: 0.86
    all:
      - id: java-post-method
      - id: java-json-content-type
