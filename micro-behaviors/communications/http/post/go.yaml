defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe]
  mbc: C0002
  attack: T1071.001
traits:
  - id: http-newrequest-post
    desc: Go HTTP POST request construction
    conf: 0.95
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '^http\.NewRequest(WithContext)?$'
      arg:
        kind: string
        exact: POST
  - id: http-newrequest-post-literal-url
    desc: Go HTTP POST to literal URL
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'http\.NewRequest\s*\(\s*"POST"\s*,\s*"https?://'
  - id: http-post
    desc: Go HTTP POST function reference
    conf: 0.85
    if:
      type: symbol
      regex: '(^http\.Post$|\.net_http\.(__Client_\.)?Post$)'
  - id: go-http-post-method
    desc: Go Post or PostForm call with arguments
    conf: 0.75
    for: [go]
    if:
      type: text
      # net/http Client.Post/PostForm take arguments. Empty `.Post()` is the
      # Kubernetes client-go REST verb builder (`RESTClient.Post().Prefix(...)`).
      regex: '\.(Post|PostForm)\s*\(\s*[^)\s]'
  - id: go-http-newrequest-post-constant
    desc: Go HTTP request uses POST method constant
    conf: 0.9
    for: [go]
    if:
      type: tree-sitter
      kind: call
      regex: 'http\.NewRequest(WithContext)?\([\s\S]{0,240}\bhttp\.MethodPost\b'
composite_rules:
  - id: http-post-methods
    desc: Go HTTP POST methods
    conf: 0.85
    any:
      - id: http-newrequest-post
      - id: http-newrequest-post-literal-url
      - id: http-post
      - id: micro-behaviors/communications/http/form::http-post-form
      - id: go-http-newrequest-post-constant
