# curl POST command with an octet-stream content-type header.
# This is ordinary upload capability; source-to-send consumers infer theft.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-curl-octet-post
    desc: curl POST with octet-stream Content-Type
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'curl -s .{0,80}-X POST[\s\S]{0,220}application/octet-stream'
    unless:
      - id: well-known/tool/detection/clawker::adversarial-payload-fixture
      # Publishing a release binary to uploads.github.com with the user's
      # own token is releasing software, not exfiltrating data.
      - id: micro-behaviors/communications/http/upload::github-uploads-api
