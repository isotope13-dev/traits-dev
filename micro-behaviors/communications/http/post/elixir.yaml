defaults:
  for: [elixir]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.95

traits:
  - id: elixir-httpc-post
    desc: Elixir HTTP client posts data
    if:
      type: symbol
      kind: call
      exact: :httpc.request
