traits:
- id: http-post-client-call
  platforms:
  - windows
  - unix
  for:
  - rust
  - go
  - c
  - cpp
  - python
  - powershell
  - javascript
  - typescript
  - shell
  attack: T1071.001
  mbc: C0002
  desc: HTTP POST client call
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    # The GitHub specialization also constrains arg[0]; it is not
    # redundant with this method-only observation.
    regex: '(?i)^(requests|httpx|axios|aiohttp)[.]post$'
  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
