# Text-form fallback for the structured powershell-post-method tree-sitter
# matcher: command text where the AST shape is unavailable, such as a
# PowerShell one-liner embedded in a string argument. Same subject as
# micro-behaviors/communications/http/post::powershell-post-method.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-post-method-option
    desc: PowerShell command text specifies -Method POST
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: -Method\s+POST|-Method\s+['"]POST['"]
      case_insensitive: true
