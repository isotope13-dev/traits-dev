# Extension-owned state can be synchronized legitimately. This rule binds the
# read to the sent body but makes no credential, browser-profile or theft claim.
# Adjacent statements and an equal identifier avoid unrelated read/POST pairs
# and intervening reassignment; no cross-function value flow is inferred.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: extension-storage-snapshot-json-post
    desc: Extension storage snapshot sent as JSON POST
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @stored
              value: (await_expression
                (call_expression function: (member_expression) @read
                  arguments: (arguments (null))))))
          . (expression_statement
            (await_expression
              (call_expression function: (identifier) @fetch
                arguments: (arguments . (_)
                  . (object
                    (pair key: [(property_identifier) (string)] @method_key
                      value: (string (string_fragment) @method))
                    (pair key: [(property_identifier) (string)] @body_key
                      value: (call_expression function: (member_expression) @json
                        arguments: (arguments . (identifier) @sent .))))))))) @transfer
          (#match? @read "^(browser|chrome)\\.storage\\.(local|sync|session|managed)\\.get$")
          (#eq? @fetch "fetch")
          (#match? @method_key "^[\"']?method[\"']?$")
          (#eq? @method "POST")
          (#match? @body_key "^[\"']?body[\"']?$")
          (#eq? @json "JSON.stringify")
          (#eq? @stored @sent))
