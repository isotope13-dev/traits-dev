# CFHTTP supports outbound requests from ColdFusion templates, including
# server-side callbacks and form posts.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
traits:
  - id: cfhttp-post-request
    desc: ColdFusion sends an HTTP POST
    if:
      type: text
      regex: '<\s*cfhttp\b[^>]*\bmethod\s*=\s*["'']post["'']'
      case_insensitive: true
  - id: cfml-encrypted-request-url
    desc: ColdFusion encrypts the request URL
    if:
      type: text
      regex: '(?is)\bencrypt\s*\(\s*getPageContext\s*\(\s*\)\s*\.\s*getRequest\s*\(\s*\)\s*\.\s*getRequestURL\s*\('
  - id: cfml-session-initialization-check
    desc: ColdFusion checks first session access
    if:
      type: text
      regex: '(?is)IsDefined\s*\(\s*["'']session\.[\w$]+["'']\s*\)\s*(?:eq\s*["'']No["'']|==?\s*(?:false|0))'
