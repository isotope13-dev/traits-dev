defaults:
  platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.9
traits:
- id: cfhttp-post-request
  desc: ColdFusion sends an HTTP POST
  if:
    type: symbol
    kind: call
    exact: cfhttp
    arg:
      index: 0
      from:
        field: method
        whole_value: (?i)^post$
- id: cfhttp-post-request-url-param
  desc: POST field derives from request URL
  conf: 0.99
  if:
    type: symbol
    kind: call
    exact: cfhttp:param
    args:
    - index: 0
      from:
        field: type
        whole_value: (?i)^formfield$
    - index: 0
      from:
        field: value
        call: ^getpagecontext\.getrequest\.getrequesturl(\.tostring)?$
        through:
        - call: ^encrypt$
          arguments:
          - 0
    - index: 1
      from:
        field: method
        whole_value: (?i)^post$
composite_rules:
- id: cfml-post-with-encrypted-request-url
  desc: CFML POST near URL encryption and session check
  conf: 0.85
  near_lines: 20
  all:
  - id: cfhttp-post-request
  - id: micro-behaviors/crypto/symmetric/encrypt::cfml-encrypted-request-url
  - id: micro-behaviors/os/security/auth/session::cfml-session-existence-check
