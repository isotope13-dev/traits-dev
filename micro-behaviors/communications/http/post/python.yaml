# HTTP POST - Python session and requests patterns
defaults:
  platforms: [windows, unix]
  for: [python]
  mbc: C0002
traits:
  - id: source-post-method-literal
    for: [python, lua, java]
    desc: Source HTTP POST method literal
    # Protocol token alone; no request or transfer is established.
    platforms: [windows, unix, android]
    crit: notable
    conf: 0.84
    if:
      type: string_literal
      exact: POST
  - id: session-post-call
    desc: Calls POST on session-named receiver
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '(^|\.)session\.post$'

  - id: python-file-post-wrapper-call
    desc: Calls a Python file POST wrapper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)_?send_post_file_req(_v[0-9]+)?$'

  - id: python-httpclient-post-method
    desc: Calls Python request with POST method
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      arg:
        index: 0
        kind: string
        exact: POST

composite_rules:
  - id: python-httpclient-post-transport
    desc: Python http.client POST transport
    crit: notable
    conf: 0.94
    near_bytes: 6000
    all:
      - id: micro-behaviors/communications/http/request/client::python-http-client-connection
      - id: python-httpclient-post-method
      - id: source-post-method-literal

  - id: session-post
    desc: Requests Session with session-named POST call
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-session
      - id: session-post-call
