defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: post-source-code-language-fields
    desc: POST body contains code and language fields
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments
            . (_)
            . (object
              [(shorthand_property_identifier) @first
               (pair key: (property_identifier) @first)]
              [(shorthand_property_identifier) @second
               (pair key: (property_identifier) @second)])))
          (#eq? @method "post")
          (#any-of? @first "code" "language")
          (#any-of? @second "code" "language")
          (#not-eq? @first @second))
