traits:
- id: request-a-path
  desc: POST request targets executable suffix
  if:
    type: text
    regex: \bPOST\s+/\S+\.(bin|exe|sh|elf)\b
- id: request-b-path
  desc: POST request targets payload suffix
  if:
    type: text
    regex: \bPOST\s+/\S+\.(dll|so|dat|payload)\b
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.8
