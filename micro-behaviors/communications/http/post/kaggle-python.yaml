defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: kaggle-api-key-secret-request-context
    desc: Kaggle secret-label RPC near Python POST
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'GetUserSecretByLabelRequest[\s\S]{0,1000}post\(url,[\s\S]{0,100}api-key'
