defaults:
  for:
    - javascript
    - typescript
  platforms:
    - unix
    - windows
  crit: notable
  attack: T1071.001
traits:
  - id: axios-post-call
    desc: Axios POST member or decoded call
    conf: 0.8
    # Preserve ordinary Axios POST member references, including normalized
    # string subscripts, and bind hex-decoded selectors to their call.
    # The member observation does not assert a request was transmitted.
    if:
      type: tree-sitter
      query: |
        ((member_expression object: (identifier) @client
            property: (property_identifier) @method) @reference
          (#eq? @client "axios") (#eq? @method "post"))
        ((subscript_expression object: (identifier) @client
            index: [(string) (template_string)] @method) @reference
          (#eq? @client "axios") (#match? @method "^[\"'`](p|\\\\x70|\\\\u0070|\\\\u[{]0{0,4}70[}])(o|\\\\x6[fF]|\\\\u006[fF]|\\\\u[{]0{0,4}6[fF][}])(s|\\\\x73|\\\\u0073|\\\\u[{]0{0,4}73[}])(t|\\\\x74|\\\\u0074|\\\\u[{]0{0,4}74[}])[\"'`]$"))
        ((program
          (function_declaration name: (identifier) @decoder
            parameters: (formal_parameters . (identifier) @hex .)
            body: (statement_block . (return_statement (call_expression
              function: (member_expression object: (identifier) @input
                property: (property_identifier) @replace)
              arguments: (arguments . (regex) @pairs . (arrow_function
                parameter: (identifier) @byte
                body: (call_expression function: (member_expression
                  object: (identifier) @String property: (property_identifier) @charcode)
                  arguments: (arguments . (call_expression function: (identifier) @parse
                    arguments: (arguments . (identifier) @parsed . (number) @radix .)) .))) .))) .))
          (lexical_declaration (variable_declarator name: (identifier) @table
            value: (array . (_)
              . (call_expression function: (identifier) @decode_module
                arguments: (arguments . (string) @axios .))
              . (call_expression function: (identifier) @decode_method
                arguments: (arguments . (string) @post .)))))
          (expression_statement (assignment_expression right: (arrow_function
            body: (call_expression function: (member_expression
              object: (call_expression function: (subscript_expression
                object: (call_expression function: (subscript_expression
                  object: (call_expression function: (identifier) @require
                    arguments: (arguments . (subscript_expression
                      object: (identifier) @module_table index: (number) @module_index) .))
                  index: [
                    (subscript_expression object: (identifier) @method_table index: (number) @method_index)
                    (array . (subscript_expression object: (identifier) @method_table index: (number) @method_index) .)])
                  arguments: (arguments . (_) (_)*))
                index: (_)) arguments: (arguments . (_) .))
              property: (property_identifier)) arguments: (arguments)))))) @request
          (#eq? @hex @input) (#eq? @replace "replace") (#eq? @pairs "/../g")
          (#eq? @String "String") (#eq? @charcode "fromCharCode")
          (#eq? @parse "parseInt") (#eq? @parsed @byte) (#eq? @radix "16")
          (#eq? @decoder @decode_module) (#eq? @decoder @decode_method)
          (#match? @axios "^[\"']6178696[fF]73[\"']$")
          (#match? @post "^[\"']706[fF]7374[\"']$")
          (#eq? @require "require")
          (#eq? @table @module_table) (#eq? @module_index "1")
          (#eq? @table @method_table) (#eq? @method_index "2"))
