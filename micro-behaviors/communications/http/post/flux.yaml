defaults:
  platforms: [unix, windows]
  for: [text]
  mbc: C0002
  crit: notable

traits:
  # Flux sources can be identified as plain text. The named argument
  # distinguishes this call syntax, and the line anchor skips // examples.
  - id: flux-http-post-call
    desc: HTTP POST call with Flux named arguments
    if:
      type: text
      regex: '(?m)^[ \t]*(return[ \t]+)?http\.post\s*\(\s*(url|headers|data)\s*:'
