defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-request-inline-post-option
    desc: request() has an inline POST option
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\.request\s*\(\s*\{[^}]{0,320}\bmethod\s*:\s*[''\"]POST[''\"]'
