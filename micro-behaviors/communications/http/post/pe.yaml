defaults:
  for: [pe, dll]
  platforms: [windows]
  mbc: C0002
  attack: T1071.001
traits:
  - id: post-string-pe
    desc: HTTP POST method string reference
    crit: baseline
    conf: 0.75
    if:
      type: text
      exact: POST
  - id: post-string-pe-wide
    desc: HTTP POST method string reference in UTF-16
    crit: baseline
    conf: 0.8
    if:
      type: encoded
      encoding: wide
      exact: POST
  - id: post-template-pe
    desc: HTTP POST request template
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "POST %s HTTP/1.1"
  - id: upx-post-format-prefix
    desc: UPX HTTP POST printf format prefix
    crit: notable
    conf: 0.94
    if:
      # A hacked UPX image may expose these bytes while the string decoder
      # retains only an XOR interpretation of the printf request line.
      type: hex
      pattern: 50 4F 53 54 20 25 73 20
      section: UPX0
  - id: form-urlencoded-header-pe
    desc: URL-encoded form content type
    crit: component
    conf: 0.85
    if:
      type: text
      substr: "Content-Type: application/x-www-form-urlencoded"
composite_rules:
  - id: wininet-post
    desc: WinInet HTTP POST request capability
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/communications/http/get::internet-open
      - id: micro-behaviors/communications/http/get::http-send-request
      # A bare POST verb is common in MFC's generic HTTP method table. Require
      # an explicit request-line template before inferring a POST request.
      - id: post-template-pe
  - id: form-urlencoded-post-template
    desc: URL-encoded HTTP POST template
    crit: notable
    conf: 0.9
    all:
      - id: form-urlencoded-header-pe
    any:
      - id: post-template-pe
      - id: upx-post-format-prefix
