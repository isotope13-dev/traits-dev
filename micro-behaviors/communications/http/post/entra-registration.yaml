# Bind the request method and registration target at the same call site.
# These APIs also serve ordinary administrators and device provisioning.
defaults:
  platforms:
  - windows
  - unix
traits:
- id: python-device-enrollment-post
  desc: Python POST targets device enrollment path
  crit: notable
  conf: 0.96
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(requests|httpx|session|r)\.post$
    arg:
      index: 0
      kind: string
      substr: /EnrollmentServer/device/
