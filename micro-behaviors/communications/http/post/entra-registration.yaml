# Bind the request method and registration target at the same call site.
# These APIs also serve ordinary administrators and device provisioning.
defaults:
  platforms:
  - windows
  - unix
traits:
- id: authenticator-registration-post-call
  desc: POST targets Microsoft Authenticator method path
  crit: notable
  conf: 0.96
  for:
  - python
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: ^(requests|httpx|axios)\.post$
    arg:
      index: 0
      kind: string
      substr: /authentication/microsoftAuthenticatorMethods
- id: fetch-authenticator-registration-post
  desc: fetch POST to Authenticator method path
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    exact: fetch
    args:
    - index: 0
      kind: string
      substr: /authentication/microsoftAuthenticatorMethods
    - index: 1
      from:
        field: method
        whole_value: ^POST$
- id: powershell-authenticator-registration-post
  desc: PowerShell Authenticator registration POST
  crit: notable
  conf: 0.96
  for:
  - powershell
  if:
    type: tree-sitter
    query: |
      ((command (command_name) @client) @request
        (#match? @client "(?i)^Invoke-RestMethod$")
        (#match? @request "(?i)^Invoke-RestMethod\\s+-Method\\s+POST\\s+-Uri\\s+['\"]https://graph\\.microsoft\\.com/")
        (#match? @request "/authentication/microsoftAuthenticatorMethods['\"]"))
- id: python-device-enrollment-post
  desc: Python POST targets device enrollment path
  crit: notable
  conf: 0.96
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(requests|httpx|session|r)\.post$
    arg:
      index: 0
      kind: string
      substr: /EnrollmentServer/device/
- id: fetch-graph-device-registration-post
  desc: fetch POST targets Graph devices collection
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    exact: fetch
    args:
    - index: 0
      from:
        whole_value: ^https://graph[.]microsoft[.]com/(v1[.]0|beta)/devices/?$
    - index: 1
      from:
        field: method
        whole_value: ^POST$
- id: powershell-device-enrollment-post
  desc: PowerShell POST targets Entra device enrollment
  crit: notable
  conf: 0.96
  for:
  - powershell
  if:
    type: tree-sitter
    query: |
      ((command (command_name) @client) @request
        (#match? @client "(?i)^Invoke-RestMethod$")
        (#match? @request "(?i)^Invoke-RestMethod\\s+-Method\\s+POST\\s+-Uri\\s+['\"]https://enterpriseregistration\\.windows\\.net/")
        (#match? @request "/EnrollmentServer/device/['\"]"))
