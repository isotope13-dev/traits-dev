defaults:
  platforms:
  - windows
  - unix
  for:
  - rust
  - go
  - c
  - cpp
  - python
  - powershell
  - javascript
  - typescript
  - shell
composite_rules:
- id: http-curl-post-request
  for:
  - shell
  - powershell
  desc: curl sends POST data
  crit: notable
  conf: 0.8
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/http/curl::curl-command-call
  - id: micro-behaviors/communications/http/request/verb::post-command-line-option
  - id: micro-behaviors/communications/http/curl::http-curl-data-option
