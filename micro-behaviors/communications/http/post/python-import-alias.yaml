defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-import-bound-requests-post
    desc: Calls requests.post through an imported module
    crit: notable
    conf: 0.98
    if:
      type: value
      path: source.python.module_alias_calls[*].resolved_callee
      exact: requests.post

composite_rules:
  - id: python-http-post-client-call
    desc: HTTP POST through named or imported client
    crit: notable
    conf: 0.98
    any:
      - id: http-post-client-call
      - id: python-import-bound-requests-post
