defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [perl]

traits:
  - id: perl-post-method-call
    desc: Calls a Perl post method
    if:
      type: symbol
      kind: call
      regex: '\.post$'

  - id: perl-post-http-url
    desc: Perl post method receives HTTP URL
    if:
      type: symbol
      kind: call
      regex: '\.post$'
      arg:
        index: 0
        kind: string
        regex: '^https?://'
