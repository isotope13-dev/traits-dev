# Language-level HTTP POST call, shared by composites in other namespaces.
defaults:
  platforms: [unix, windows]
  attack: T1071.001
  crit: notable

composite_rules:
  - id: python-http-post-request
    for: [python]
    desc: Python HTTP POST request call
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/post::urllib-nested-request-body
      - id: micro-behaviors/communications/http/post::python-httpclient-post-method
      - id: micro-behaviors/communications/http/post::session-post-call

  - id: js-http-post-request
    for: [javascript, typescript]
    desc: JavaScript HTTP POST request call
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::request-post-option
      - id: micro-behaviors/communications/http/post::node-http-request-post
      - id: micro-behaviors/communications/http/post::axios-post-call
