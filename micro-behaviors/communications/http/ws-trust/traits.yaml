# WS-Trust username-mixed authentication is a legacy SOAP protocol. The
# protocol atoms are useful capabilities on their own; password-spray intent
# is assembled in objectives/lateral-movement/brute-force/password/ws-trust.yaml.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: ws-security-username-token-element
    desc: WS-Security UsernameToken element
    if:
      type: text
      regex: '(?i)<[A-Za-z_][\w.-]*:UsernameToken\b|<UsernameToken\b'

  - id: ws-trust-username-field
    desc: WS-Trust username field
    if:
      type: text
      regex: '(?i)<(wsse:)?Username\b.{0,40}>.{1,120}</(wsse:)?Username>'

  - id: ws-trust-password-field
    desc: WS-Trust password field
    if:
      type: text
      regex: '(?i)<(wsse:)?Password\b.{0,40}>.{1,120}</(wsse:)?Password>'

  - id: ws-trust-security-token-element
    desc: WS-Trust security-token element
    if:
      type: text
      regex: '(?i)<[A-Za-z_][\w.-]*:RequestSecurityToken\b|<RequestSecurityToken\b'

  - id: aadsts-authentication-response-code
    desc: AADSTS authentication response code
    if:
      type: text
      regex: '\bAADSTS[0-9]{5}\b'

  - id: aadsts-valid-password-response-code
    desc: AADSTS valid-password response code
    if:
      type: text
      regex: '\bAADSTS(50055|50076|53003)\b'

  - id: aadsts-account-existence-response-code
    desc: AADSTS account-existence response code
    if:
      type: text
      word: AADSTS50034

  - id: credential-existence-result-field
    desc: Account-existence result field
    if:
      type: text
      word: IfExistsResult

  - id: microsoft-ws-trust-autologon-host
    desc: Microsoft WS-Trust autologon host
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bautologon\.microsoftazuread(-sso)?\.com\b'

  - id: ws-trust-usernamemixed-path
    desc: WS-Trust usernamemixed path
    if:
      type: text
      regex: '(?i)/winauth/trust/2005/usernamemixed\b'

composite_rules:
  - id: ws-trust-username-password-fields
    desc: WS-Trust username/password fields
    all:
      - id: ws-trust-username-field
      - id: ws-trust-password-field
    near_lines: 12

  - id: microsoft-ws-trust-autologon-endpoint
    desc: Microsoft WS-Trust autologon endpoint
    conf: 0.97
    all:
      - id: microsoft-ws-trust-autologon-host
      - id: ws-trust-usernamemixed-path
    near_bytes: 240

