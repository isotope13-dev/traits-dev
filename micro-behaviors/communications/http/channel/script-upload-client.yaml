# Script HTTP POST/form client constructors: `curl -F/--form`, a `Request`
# call carrying a `data` argument (without `data` the call is a GET download,
# not an upload; this covers both `urllib.request` and `requests` spellings),
# and `Net::HTTP::Post`.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  crit: notable
  conf: 0.85

traits:
  - id: script-http-upload-client
    desc: Script HTTP form or POST client
    if:
      type: text
      regex: '\s-(F|-form)\s+["'']?[A-Za-z_]\w*=|\bRequest\s*\([^()]{0,99}?\bdata\s*=|\bNet::HTTP::Post\b'
