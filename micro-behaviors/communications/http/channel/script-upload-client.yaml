# Generic script HTTP POST/form client constructors (`curl -F`, `urllib.request.Request`,
# `Net::HTTP::Post`).
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  crit: notable
  conf: 0.85

traits:
  - id: script-http-upload-client
    desc: Script HTTP form or POST client
    if:
      type: text
      regex: '\s-(F|-form)\s+["'']?[A-Za-z_]\w*=|\burllib\.request\.Request\s*\(|\bNet::HTTP::Post\b'
