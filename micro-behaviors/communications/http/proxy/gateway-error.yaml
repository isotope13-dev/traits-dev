# HTTP gateway behavior: an intermediary answers client requests with its own
# upstream-failure responses. "Bad Gateway" (502) means a gateway or proxy
# received an invalid upstream response; paired with "Service Unavailable" it
# marks a program that relays to an upstream. Forward proxies and fixed-
# upstream reverse proxies or mirrors emit the same pair, so it does not show
# that clients may choose arbitrary destinations.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.9

traits:
  - id: bad-gateway-response-text
    desc: HTTP Bad Gateway response text
    if:
      type: text
      substr: Bad Gateway
  - id: service-unavailable-response-text
    desc: HTTP Service Unavailable response text
    if:
      type: text
      substr: Service Unavailable

composite_rules:
  - id: gateway-error-response-pair
    desc: HTTP gateway upstream-failure response pair
    all:
      - id: bad-gateway-response-text
      - id: service-unavailable-response-text
