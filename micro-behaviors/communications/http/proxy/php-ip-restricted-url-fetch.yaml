defaults:
  for: [php]
  platforms: [unix, windows]
composite_rules:
  - id: php-allowed-ip-array-url-fetch
    desc: PHP request-URL fetch with allowed-IP array
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/cgi::php-allowed-ip-array-client-reference
      - id: micro-behaviors/communications/http/proxy::php-request-url-fetch

# The parameterized half of the same relay: the fetch URL arrives through a
# request field with an isset default, so each operator request can retarget
# the relay without touching the page.
