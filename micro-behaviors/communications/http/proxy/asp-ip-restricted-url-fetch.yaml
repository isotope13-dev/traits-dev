defaults:
  for: [asp]
  platforms: [windows]
composite_rules:
  - id: asp-ip-restricted-url-fetch
    desc: IP-restricted ASP page fetches request-selected URL
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/superglobal::asp-allowlist-remote-addr-gate
      - id: micro-behaviors/communications/http/proxy::asp-request-url-fetch

# The egress half of the ASP relay: the fetched body is written back as a
# binary response, completing the operator's tunnel through the page.
