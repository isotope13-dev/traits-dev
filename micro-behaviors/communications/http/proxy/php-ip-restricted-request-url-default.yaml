defaults:
  for: [php]
  platforms: [unix, windows]
composite_rules:
  - id: php-allowed-ip-array-request-url-default
    desc: PHP URL proxy with allowed-IP array and isset default
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/cgi::php-allowed-ip-array-client-reference
      - id: micro-behaviors/communications/http/proxy::php-request-url-fetch
      - id: micro-behaviors/communications/http/request/superglobal::request-isset-default-assignment

# These facts describe PHP proxy and client-filter configuration together;
# they do not prove that the configured filter actually rejects a client.
