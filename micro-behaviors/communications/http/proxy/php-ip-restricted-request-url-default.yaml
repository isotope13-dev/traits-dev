defaults:
  for: [php]
  platforms: [unix, windows]
composite_rules:
  - id: php-ip-restricted-request-url-default
    desc: IP-restricted PHP proxy accepts a URL with an isset default
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/cgi::ip-allowlist-remote-addr-gate
      - id: micro-behaviors/communications/http/proxy::php-request-url-fetch
      - id: micro-behaviors/communications/http/request/superglobal::request-isset-default-assignment

# Classic ASP mirror of the gated relay: an allowlisted page that pulls an
# operator-chosen URL over XMLHTTP and re-emits the body to the operator.
