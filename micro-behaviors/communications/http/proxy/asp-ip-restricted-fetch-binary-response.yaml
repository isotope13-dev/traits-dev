defaults:
  for: [asp]
  platforms: [windows]
composite_rules:
  - id: asp-ip-restricted-fetch-binary-response
    desc: IP-restricted ASP proxy emits a binary response
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/superglobal::asp-allowlist-remote-addr-gate
      - id: micro-behaviors/communications/http/proxy::asp-request-url-fetch
      - id: micro-behaviors/communications/http/server/managed::aspnet-response-binary-write
