# URL-path rewrites used by browser authentication relays.  The mechanic is
# neutral on its own: URL rewriters and reverse proxies can carry an upstream
# URL this way.  Credential-relay objectives add the browser and session
# context before assigning hostile intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, python, php, shell]
  attack: T1071.001
  mbc: C0002

traits:
  - id: microsoft-auth-path-rewrite
    desc: Rewrites Microsoft auth URL under another host
    crit: notable
    conf: 0.96
    if:
      type: string_literal
      regex: '(?i)https?://[A-Za-z0-9.-]{1,253}/https://login\.microsoftonline\.com/'
