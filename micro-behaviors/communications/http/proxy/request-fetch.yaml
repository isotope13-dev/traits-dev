defaults:
  platforms: [windows, unix]
composite_rules:
  - id: php-request-url-fetch
    desc: PHP request fields, named binding and fopen
    crit: notable
    conf: 0.92
    for: [php]
    all:
      - id: micro-behaviors/communications/http/request/superglobal::get-dup
      - id: metadata/lang/source/declaration::named-variable-call-assignment
      - id: micro-behaviors/fs/file/open::php-fopen-call
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
  - id: asp-request-url-fetch
    desc: ASP request fields, HTTP and binary response
    crit: notable
    conf: 0.93
    for: [asp]
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-object
      - id: micro-behaviors/communications/http/server/managed::aspnet-response-binary-write
    unless:
      - id: "metadata/file/naming::test-directory-component"
