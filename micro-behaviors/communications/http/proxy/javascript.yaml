defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: get-proxy-pool-call
    desc: Calls a proxy pool accessor
    if:
      type: symbol
      kind: call
      regex: '(^|\.)getProxyPool$'

  - id: resolve-extractor-proxy-call
    desc: Calls an extractor proxy resolver
    if:
      type: symbol
      kind: call
      regex: '(^|\.)resolveExtractorProxy$'

  # A forwarding proxy copies each inbound header, credentials included, into an
  # outbound request object. Keyed copy into a named headers object only.
  - id: inbound-header-copy-forward
    desc: Copies every inbound request header onward
    if:
      type: text
      regex: 'Object\.entries\(req\.headers\)[\s\S]{0,120}\[k\] = v'
