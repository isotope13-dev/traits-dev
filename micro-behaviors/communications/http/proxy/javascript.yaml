defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: get-proxy-pool-call
    desc: Calls a proxy pool accessor
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)getProxyPool$'

  - id: resolve-extractor-proxy-call
    desc: Calls an extractor proxy resolver
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)resolveExtractorProxy$'
