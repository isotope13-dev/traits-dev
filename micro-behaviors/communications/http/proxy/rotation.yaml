# Per-request egress rotation out of a proxy pool.
#
# Picking the outbound proxy for each request by index or at random from a list
# spreads one client's traffic over many source addresses. Load spreading and
# geo testing use the same construct, so this stays a capability observation;
# objectives supply what the rotated traffic is being used to reach.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
  attack: T1090.003
  mbc: E1090

traits:
  - id: proxy-pool-index-rotation
    desc: Selects egress proxy by pool index
    crit: notable
    conf: 0.9
    if:
      # `PROXY_POOL[n % len(PROXY_POOL)]`, `proxies[i % proxies.length]`,
      # `proxyList[n%len(proxyList)]` — the modulo is what makes it a rotation
      # rather than a single configured proxy.
      type: text
      regex: '(?i)\bprox(y|ies)[_a-z]{0,10}\s*\[[^\]\n]{0,16}%'

  - id: proxy-pool-random-choice
    desc: Picks random egress proxy from pool
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bchoice\s*\(\s*[a-z_]{0,8}prox(y|ies)[_a-z]{0,10}\s*[,)]'

composite_rules:
  - id: proxy-pool-rotation
    desc: Rotates outbound proxy across a pool
    crit: notable
    conf: 0.93
    any:
      - id: proxy-pool-index-rotation
      - id: proxy-pool-random-choice
      - id: micro-behaviors/communications/http/proxy::rotating-http-proxy-pool
