# HTTP forward-proxy server behavior: a proxy answers client requests with
# its own upstream-failure responses. "Bad Gateway" (502) means a gateway or
# proxy received an invalid upstream response, and paired with "Service
# Unavailable" it is the characteristic emission of a forward proxy whose
# upstream is down -- ordinary origin servers rarely serve the pair.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.9

traits:
  - id: bad-gateway-response-text
    desc: HTTP Bad Gateway response text
    if:
      type: text
      substr: Bad Gateway
  - id: service-unavailable-response-text
    desc: HTTP Service Unavailable response text
    if:
      type: text
      substr: Service Unavailable

composite_rules:
  - id: forward-proxy-error-response-pair
    desc: Forward-proxy upstream-failure response pair
    all:
      - id: bad-gateway-response-text
      - id: service-unavailable-response-text
