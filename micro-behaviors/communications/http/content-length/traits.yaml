# HTTP Content-Length header observations. Split out of http/headers so that
# directory stays within the ML size cap; PlugX C2 composites reference this.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, pe, dll, elf]
  mbc: C0002
  attack: T1071.001
  crit: notable
  conf: 0.9

traits:
  # Line- or quote-anchored so RFC prose ("than zero; Content-Length: 0")
  # is not treated as an HTTP header.
  - id: content-length-zero
    desc: HTTP Content-Length zero header
    if:
      type: text
      regex: '(?im)(^|["''\n\r])Content-Length\s*:\s*0\b'
