# Co-occurring HEAD and ContentLength text.
defaults:
  platforms:
  - windows
  for:
  - data
traits:
- id: powershell-head-contentlength-text
  desc: HEAD and ContentLength text references
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)(ContentLength.{0,160}\bHEAD\b|\bHEAD\b.{0,160}ContentLength)
