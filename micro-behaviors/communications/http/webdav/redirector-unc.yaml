# Any of the WebDAV-redirector UNC spellings: \\host@SSL\..., a
# \DavWWWRoot\ segment, or a UNC host on a public reverse-tunnel domain.
# These reach an HTTP(S) server through the Windows WebClient service rather
# than an SMB file server on the local network.
defaults:
  platforms: [windows]
  for: [scripts, xml, text]
  crit: notable
  conf: 0.95
  attack: T1105

composite_rules:
  - id: webdav-redirector-unc-reference
    desc: WebDAV redirector UNC path reference
    any:
      - id: webdav-ssl-unc-path
      - id: davwwwroot-path
      - id: webdav-unc-quick-tunnel-host
