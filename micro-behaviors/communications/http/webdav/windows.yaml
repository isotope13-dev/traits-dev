defaults:
  platforms: [windows]
  for: [scripts, binaries, lnk]
  crit: notable
  conf: 0.88
  attack: T1105
traits:
  - id: davwwwroot-path
    desc: Windows WebDAV redirector path
    if:
      type: text
      exact: DavWWWRoot
  - id: webdav-ssl-unc-argument
    desc: WebDAV SSL UNC path in LNK arguments
    crit: notable
    conf: 0.96
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)DavWWWRoot'
  - id: webdav-ssl-unc-path
    desc: WebDAV SSL UNC path
    crit: notable
    conf: 0.96
    if:
      type: text
      # WebDAV UNC mounts use two leading backslashes and an @SSL suffix;
      # \\x5c keeps the Windows separator unambiguous in the YAML/regex layers.
      regex: '(?i)(\x5c){2}[A-Za-z0-9.-]{1,253}@SSL(@443)?\x5c'
  - id: webdav-delayed-ssl-unc
    desc: Delayed-expansion WebDAV SSL UNC (!s!)
    crit: notable
    conf: 0.96
    for: [batch, powershell, javascript, html, vbs, text]
    if:
      type: text
      regex: '(?i)(\x5c){2}[A-Za-z0-9.-]{1,253}!s!\x5c'
  - id: delayed-ssl-share-var
    desc: Assigns delayed-expansion @SSL share suffix
    crit: notable
    conf: 0.95
    for: [batch, powershell, javascript, html, vbs, text]
    if:
      type: text
      regex: '(?i)set\s+s=@SSL'
  - id: webdav-ssl-unc-lnk-argument
    desc: LNK arguments reference SSL WebDAV
    crit: notable
    conf: 0.96
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)@SSL\\DavWWWRoot\\'
  - id: search-connector-description
    desc: Windows Search Connector XML
    crit: component
    conf: 0.95
    for: [documents, data]
    if:
      type: text
      substr: "<searchConnectorDescription"
  - id: search-connector-simple-location
    desc: Search Connector simple location
    crit: component
    conf: 0.95
    for: [documents, data]
    if:
      type: text
      substr: "<simpleLocation>"
  - id: search-connector-http-ip-url
    desc: Search Connector HTTP IP URL
    crit: notable
    conf: 0.96
    for: [documents, data]
    if:
      type: text
      regex: '<url>https?://[0-9]{1,3}(\.[0-9]{1,3}){3}/?'
      is: external_ip
composite_rules:
  - id: windows-webdav-unc
    desc: Windows WebDAV UNC path
    conf: 0.96
    all:
      - id: webdav-ssl-unc-path
      - id: micro-behaviors/os/network/share::unc-path-reference
