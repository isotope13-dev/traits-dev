# A script string literal holding a WebDAV redirector UNC path
# (\\host[@port|@SSL]\DavWWWRoot\...): file APIs given this path fetch it
# over HTTP through the WebClient service.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1105

traits:
  - id: wsh-davwwwroot-unc-string
    desc: Script string holds a WebDAV UNC path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)"\\\\[^"\\\s]{1,100}(@SSL|@\d{1,5}){0,2}\\DavWWWRoot\\'
