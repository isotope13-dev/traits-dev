defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: copy-move-method
    desc: WebDAV COPY or MOVE request method
    if:
      type: text
      regex: '(["''](COPY|MOVE)["'']|(COPY|MOVE)\s+/)'

  - id: destination-header
    desc: WebDAV Destination request header
    if:
      type: text
      regex: '["'']Destination["'']\s*:'

  - id: mkcol-method
    desc: WebDAV MKCOL request method
    if:
      type: text
      regex: '(["'']MKCOL["'']|MKCOL\s+/)'
