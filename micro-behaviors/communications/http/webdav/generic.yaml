defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  # The bare-verb branch has to look like a request LINE, not just the verb
  # followed by any whitespace and a slash. `\s` matches a newline, so
  # `(COPY|MOVE)\s+/` fired on ordinary English prose whose next line happened
  # to start a comment -- a Go file carrying `// DO NOT MODIFY OR MOVE` on one
  # line and `// It is used ...` on the next was reported as issuing a WebDAV
  # request. Requiring the request-target and the HTTP version keeps it to text
  # that really is a request line.
  # The quoted-token branch also needs HTTP method context: IMAP names the same
  # two commands, so a mail client's `this.capabilities.has("MOVE")` was
  # reported as a WebDAV request.
  - id: copy-move-method
    desc: WebDAV COPY or MOVE request method
    if:
      type: text
      regex: '(?i)(method["'']?\s*[:=]\s*["''](COPY|MOVE)["'']|(COPY|MOVE)[ \t]+/\S*[ \t]+HTTP/)'

  - id: destination-header
    desc: WebDAV Destination request header
    if:
      type: text
      regex: '["'']Destination["'']\s*:\s*["'']https?://'

  - id: mkcol-method
    desc: References the WebDAV MKCOL method
    if:
      type: text
      regex: '(["'']MKCOL["'']|MKCOL\s+/)'

  - id: propfind-method
    desc: References the WebDAV PROPFIND method
    if:
      type: text
      regex: '(["'']PROPFIND["'']|PROPFIND\s+/)'

  - id: depth-header
    desc: WebDAV Depth request header
    if:
      type: text
      regex: '(?im)(["'']Depth["'']\s*:\s*["''](0|1|infinity)["'']|^Depth:\s*(0|1|infinity)\s*$)'

  - id: dav-href-response-element
    desc: Namespaced WebDAV href response element
    if:
      type: text
      regex: '(["'']\.?//[A-Za-z_][\w.-]*:href["'']|\{DAV:\}href|<[A-Za-z_][\w.-]*:href\b)'

composite_rules:
  - id: mkcol-dynamic-path
    desc: WebDAV MKCOL request targets a dynamic path segment
    crit: notable
    conf: 0.96
    all:
      - id: mkcol-method
    any:
      - id: micro-behaviors/communications/http/url/build::python-fstring-url-path-segment
      - id: micro-behaviors/communications/http/url/path::fetch-dynamic-template-path
      - id: micro-behaviors/communications/http/download/cli::curl-variable-path-segment
    near_lines: 10
