# WebDAV locations named by Windows shell XML documents (.library-ms,
# .searchConnector-ms). The <url> of a library or search connector is a
# folder Explorer opens through the WebClient redirector: `\\host@SSL\...`
# selects HTTPS WebDAV and `DavWWWRoot` names the server root.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.95
  attack: T1105

traits:
  # SharePoint and OneDrive document libraries are mapped the same way by
  # enterprises; those hosts are excluded so the atom marks other servers.
  - id: shell-location-webdav-unc-url
    desc: Shell location is a WebDAV share
    if:
      type: text
      regex: '(?i)<url>\s*\\\\[A-Za-z0-9.-]{1,253}(@SSL|(@[0-9]{1,5})?\\DavWWWRoot)'
      not:
        - regex: '(?i)<url>\s*\\\\[A-Za-z0-9.-]{0,200}\.(sharepoint(-df)?\.com|docs\.live\.net)[@\\]'

  # Anonymous reverse-tunnel services hand out a throwaway hostname per run;
  # a WebDAV share served from one is a share that outlives no session.
  - id: webdav-unc-quick-tunnel-host
    desc: WebDAV UNC share on a quick-tunnel host
    crit: suspicious
    conf: 0.96
    for: [xml, text, scripts, html]
    attack: T1105,T1572
    if:
      type: text
      regex: '(?i)\\\\[a-z0-9.-]{1,200}\.(trycloudflare\.com|ngrok(-free)?\.(io|app)|loca\.lt)[@\\]'
      not:
        - substr: your-tunnel.trycloudflare.com
