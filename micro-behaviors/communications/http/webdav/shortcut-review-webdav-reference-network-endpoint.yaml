defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-webdav-segment
    desc: LNK references a WebDAV path segment
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)\\\\webdav\\\\'
composite_rules:
  - id: lnk-webdav-path
    desc: LNK references WebDAV path
    crit: suspicious
    conf: 0.85
    any:
      - id: lnk-webdav-segment
      - id: micro-behaviors/communications/http/webdav::davwwwroot-path
