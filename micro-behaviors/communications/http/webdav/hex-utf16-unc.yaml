# A WebDAV-redirector UNC path stored as hex-encoded UTF-16LE, as it appears
# inside RTF `\objdata` compound-file streams. Opening the path makes the
# Windows WebClient service fetch it over HTTPS.
defaults:
  platforms: [windows]
  for: [rtf]
  crit: notable
  conf: 0.92
  attack: T1105

traits:
  - id: hex-utf16-webdav-ssl-unc
    desc: Hex UTF-16 WebDAV SSL UNC path
    if:
      # `\\` host `@SSL\` with every character followed by a 00 byte.
      type: raw
      regex: '(?i)5c005c00([0-9a-f]{2}00){3,80}4000530053004c005c00'
