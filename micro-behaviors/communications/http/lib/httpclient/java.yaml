defaults:
  crit: notable
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
traits:
  - id: airlift-http-client-bytecode
    desc: Airlift Java HTTP client usage
    conf: 0.96
    for: [class]
    if:
      type: import
      exact: io/airlift/http/client/HttpClient

  - id: java-url-openconnection
    desc: Java source URL openConnection call
    conf: 0.85
    for: [java]
    if:
      type: text
      regex: new\s+URL\(.{0,80}\)\.openConnection\(\)
  - id: java-url-constructor-bytecode
    desc: Java bytecode URL construction
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/net/URL.<init>
  - id: java-httpclient-api
    desc: Java HttpClient API reference
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/net/http/HttpClient
  - id: java-byte-array-response-handler
    desc: Java HTTP byte-array response handler
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/net/http/HttpResponse$BodyHandlers.ofByteArray
  - id: java-httpclient-send
    desc: Java HttpClient sends an HTTP request
    conf: 0.94
    attack: T1071.001
    for: [class]
    if:
      type: import
      exact: java/net/http/HttpClient.send
  - id: java-http-request-post-bytecode
    desc: Java HttpRequest builds a POST
    conf: 0.9
    attack: T1071.001
    for: [class]
    if:
      type: import
      exact: java/net/http/HttpRequest$Builder.POST

  - id: apache-httpclient-api
    desc: Apache HttpClient 4 client type
    conf: 0.94
    attack: T1071.001
    for: [class]
    if:
      type: import
      exact: org/apache/http/client/HttpClient

  - id: apache-httpclient-execute
    desc: Apache HttpClient 4 execute call
    conf: 0.95
    attack: T1071.001
    for: [class]
    if:
      type: import
      exact: org/apache/http/client/HttpClient.execute
