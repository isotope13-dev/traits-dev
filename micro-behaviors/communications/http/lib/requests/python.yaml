defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [python]
traits:
  - id: requests-get
    desc: Calls requests.get in Python
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: requests.get
    unless:
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
      - id: well-known/tool/detection/agentskillmap/
  - id: requests-get-text
    desc: Text calls requests.get
    conf: 0.8
    if:
      type: text
      regex: 'requests\.get\s*\('
    unless:
      - id: requests-get
  - id: requests-request
    desc: Calls requests.request in Python
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: requests.request
    unless:
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - id: requests-head
    desc: requests.head call (Python)
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: requests.head
    unless:
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - id: requests-put
    desc: requests.put call (Python)
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: requests.put
    unless:
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - id: requests-delete
    desc: Calls requests.delete in Python
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: requests.delete
    unless:
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - id: requests-session
    desc: requests.Session() persistent HTTP session
    conf: 0.8
    if:
      type: symbol
      exact: requests.Session
  - id: gql-requests-transport
    desc: gql RequestsHTTPTransport client
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: RequestsHTTPTransport
  # Standard requests Response methods — neutral. Relocated from
  # objectives/command-and-control/dropper/delivery/fetch-eval: `.json()` and
  # `.raise_for_status()` are the ordinary way every requests-using program reads
  # an API response (e.g. cat-ademic fetching OpenAlex). The dropper composites
  # reference these cross-directory; the payload-extraction intent is the other
  # legs (`.get('message')`/`.get('cmd')` + base64-decode + exec).
  - id: response-json-code-field
    desc: Reads encoded or decoded JSON response field
    conf: 0.92
    if:
      type: text
      regex: 'response\.json\(\)\s*\[\s*[''\"](encoded|decoded)[''\"]\s*\]'
  - id: raise-for-status
    desc: requests raise_for_status response check
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '\.raise_for_status$'
  # Relocated from objectives/command-and-control/beacon/network/periodic
  # (c2-poll-loop): a `requests.get/post` call beside a `while` loop. The
  # matcher sees HTTP polling, not its purpose -- SDK retry loops and
  # status polls share the shape -- so it lives here as a neutral
  # capability; the beacon composites add the timer and error-handling
  # legs that make the C2 claim.
  - id: http-polling-request-loop
    desc: HTTP requests issued in a polling loop
    conf: 0.8
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: string_literal
      regex: while.{0,50}True.{0,50}requests\.(get|post)|requests\.(get|post).{0,50}while
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: metadata/file/profile/markup::assessment-playbook-examples
