defaults:
  platforms: [windows, linux, macos]
  mbc: C0002
  attack: T1071.001
traits:
  - id: go-http-client-do
    desc: Sends an HTTP request from Go
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      exact: http.DefaultClient.Do
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: go-http-client-do-request
    desc: Go HTTP client sends request literal
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: tree-sitter
      kind: call
      regex: '\.Do\(\s*&http\.Request\s*\{'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: go-http-header-auth
    desc: Sets Authorization header in Go
    crit: notable
    conf: 0.95
    for:
      - go
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Header\.Set$'
      arg:
        index: 0
        kind: string
        exact: Authorization
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: go-http-te-header-runtime-string
    desc: Go net/http TE header validation string
    crit: baseline
    conf: 0.8
    for: [go, elf, macho, pe]
    if:
      type: text
      substr: 'request header "TE" may only be'
  - id: go-http-trailer-eof-runtime-string
    desc: Go net/http trailer EOF runtime string
    crit: baseline
    conf: 0.8
    for: [go, elf, macho, pe]
    if:
      type: text
      substr: 'http: unexpected EOF reading trailer'
  - id: go-http-location-header-runtime-string
    desc: Go net/http Location header runtime string
    crit: baseline
    conf: 0.8
    for: [go, elf, macho, pe]
    if:
      type: text
      substr: 'http: no Location header in response'

composite_rules:
  - id: go-http-client-instance-do
    desc: Constructed Go HTTP client sends request
    crit: notable
    conf: 0.94
    for: [go]
    all:
      - id: micro-behaviors/communications/http/client/library::go-http-client-construction
      - id: micro-behaviors/data/control-flow/dispatch/named::go-variable-do-call
    near_bytes: 1200
