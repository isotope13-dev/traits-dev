defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: rex-http-request-call
    desc: Ruby invokes Rex HTTP request API
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^send_request_(cgi|raw)$'
  - id: rex-http-client-mixin
    desc: Ruby references the Metasploit HTTP client mixin
    conf: 0.98
    if:
      type: text
      substr: 'Msf::Exploit::Remote::HttpClient'
