defaults:
  platforms: [unix, windows]
  for: [font, data, text, javascript]
traits:
  - id: hex-axios-json-cookie-reference
    desc: Hex text contains Axios JSON field access
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: hex
      regex: 'axios\.get\(url,.{0,180}res\.data\.cookie'
