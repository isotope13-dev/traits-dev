---
defaults:
  platforms:
  - unix
  - windows
  for:
  - jar
traits:
- id: callback-open-connection
  desc: URL openConnection method name
  crit: component
  conf: 0.93
  if:
    type: text
    exact: openConnection
- id: callback-connect-timeout
  desc: Connect-timeout method name
  crit: component
  conf: 0.93
  if:
    type: text
    exact: setConnectTimeout
- id: callback-read-timeout
  desc: Read-timeout method name
  crit: component
  conf: 0.93
  if:
    type: text
    exact: setReadTimeout
- id: jvm-follow-redirects-method-name
  desc: Redirect-setting method name
  crit: component
  conf: 0.93
  if:
    type: text
    exact: setInstanceFollowRedirects
- id: callback-response-code
  desc: Response-code method name
  crit: component
  conf: 0.93
  if:
    type: text
    exact: getResponseCode
- id: callback-disconnect
  desc: Disconnect method name
  crit: component
  conf: 0.9
  if:
    type: text
    exact: disconnect
