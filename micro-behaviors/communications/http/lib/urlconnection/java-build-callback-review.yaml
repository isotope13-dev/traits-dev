defaults:
  platforms: [unix, windows]
  for: [jar]

composite_rules:
  - id: build-http-probe
    for: [jar, class]
    desc: Build callback performs HTTP probes
    crit: notable
    conf: 0.99
    all:
      - id: metadata/import/framework::jvm-url-class-ref
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
      - id: micro-behaviors/communications/http/lib/urlconnection::callback-open-connection
      - id: micro-behaviors/communications/http/lib/urlconnection::callback-connect-timeout
      - id: micro-behaviors/communications/http/lib/urlconnection::callback-read-timeout
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-follow-redirects-method-name
      - id: micro-behaviors/communications/http/lib/urlconnection::callback-response-code
      - id: micro-behaviors/communications/http/lib/urlconnection::callback-disconnect
  - id: build-google-endpoint-probe-context
    desc: Java HTTP and Google endpoint references
    crit: notable
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::build-http-probe
      - id: micro-behaviors/communications/http/services/google::callback-google-uberproxy
      - id: micro-behaviors/communications/http/services/google::callback-google-pack
      - id: micro-behaviors/communications/http/services/google::callback-google-sandbox
