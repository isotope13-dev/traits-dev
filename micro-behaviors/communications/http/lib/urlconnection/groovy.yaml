defaults:
  platforms: [unix, windows]
  for: [groovy]
  attack: T1041

traits:
  - id: groovy-urlconnection-post-body
    desc: Groovy writes a URLConnection POST body
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'requestMethod\s*=\s*["'']POST["''][\s\S]{0,240}doOutput\s*=\s*true[\s\S]{0,240}outputStream'
