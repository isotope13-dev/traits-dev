defaults:
  platforms: [macos, ios]
  for: [macho, dylib]

composite_rules:
  - id: nsurlsession-download-write-move-clues
    desc: NSURLSession download and file write/move clues
    crit: suspicious
    conf: 0.80
    all:
      - id: micro-behaviors/communications/http/lib/nsurlsession::nsurlsession-download-task
      - id: micro-behaviors/fs/write/file/handle/unspecified::nsfilehandle-write
      - id: micro-behaviors/fs/write/file/copy::nsfilemanager-move
