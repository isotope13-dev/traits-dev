defaults:
  platforms: [windows]
  for: [lnk]

traits:
- id: kv-powershell-download-command
  desc: LNK PowerShell arguments invoke a web downloader
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: lnk.arguments
    # The boundary class admits the quoted-command forms (-Command "irm ...")
    # and -c=irm that deno/runtime install stages use, not just separator-
    # delimited tokens.
    regex: '(^|[\s;&|"''=(])(iwr|irm|invoke-webrequest|invoke-restmethod)\b'
    case_insensitive: true
