defaults:
  platforms: [windows]
  for:
  - powershell
  mbc: C0002
  attack: T1071.001
traits:
- id: iwr-name-reference
  desc: References the Invoke-WebRequest command name
  crit: notable
  conf: 0.86
  for: [pe, batch, text]
  if:
    type: text
    word: Invoke-WebRequest
- id: useb-flag
  desc: UseBasicParsing flag (-useb)
  crit: notable
  conf: 0.75
  for: [powershell, batch, pe]
  if:
    type: text
    regex: "(?i)-useb\\b|-UseBasicParsing\\b"
- id: tls12-force-string
  desc: TLS12 SecurityProtocol string
  crit: notable
  conf: 0.82
  for: [powershell, pe]
  if:
    type: text
    exact: "[Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12;"
- id: iwr-localhost-uri
  desc: Invoke-WebRequest targets localhost
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)Invoke-WebRequest\s+-Uri\s+["'']?https?://(127\.0\.0\.1|localhost)\b'
- id: batch-powershell-iwr-uri
  desc: Batch launches PowerShell web request
  crit: notable
  conf: 0.86
  for: [batch]
  if:
    type: text
    regex: (?i)\bpowershell\b[^\r\n]{0,120}\bInvoke-WebRequest\s+-Uri\b
- id: batch-powershell-iwr-alias
  desc: Batch launches PowerShell iwr request
  crit: notable
  conf: 0.86
  for: [batch]
  if:
    type: text
    regex: (?i)\bpowershell\b[^\r\n]{0,120}\biwr\b
- id: batch-powershell-iwr-post
  desc: Batch PowerShell POST request
  crit: notable
  conf: 0.92
  for: [batch, powershell]
  if:
    type: text
    regex: '(?i)\bInvoke-WebRequest\b[^\r\n]{0,180}-Method\s+["'']?POST\b'
- id: batch-powershell-iwr-body
  desc: Batch PowerShell request body
  crit: notable
  conf: 0.92
  for: [batch]
  if:
    type: text
    regex: '(?i)\bInvoke-WebRequest\b[^\r\n]{0,220}-Body\b'
- id: iwr-alias
  desc: iwr alias for Invoke-WebRequest
  if:
    type: symbol
    kind: call
    exact: iwr
- id: embedded-irm-iex-pipeline
  desc: Embedded PowerShell fetch-and-evaluate
  crit: notable
  conf: 0.97
  for: [javascript, html, vbs, powershell, batch]
  if:
    type: text
    regex: '(?i)\b(irm|Invoke-RestMethod)\b[^\r\n|]{0,120}\|\s*(&\s*\(?\w+|iex\b)'
  unless:
  - id: well-known/tool/detection/agent-monitor::untrusted-input-data-guardrail
  - id: well-known/app/ai/coding-agent/grok-cli::official-installer-url
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::official-installer-url
  - id: well-known/app/ai/browser-agent/ai-helper::official-installer-url
  - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
  - id: metadata/build/recognized-contexts::checksummed-github-release-updater
- id: embedded-iex-irm-call
  desc: Embedded PowerShell evaluates fetched script
  crit: notable
  conf: 0.97
  for: [javascript, html, vbs]
  if:
    type: text
    regex: '(?i)\biex\s*\(\s*(irm|Invoke-RestMethod)\b'
  unless:
  - id: well-known/tool/detection/agent-monitor::untrusted-input-data-guardrail
  - id: well-known/app/ai/coding-agent/grok-cli::official-installer-url
  - id: well-known/app/ai/browser-agent/ai-helper::official-installer-url
  - id: metadata/build/recognized-contexts::checksummed-github-release-updater
- id: lnk-irm-alias-argument
  desc: LNK argument invokes irm network request
  crit: notable
  conf: 0.92
  for: [lnk]
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)(^|[\s;&|(\[])irm\s*\('
- id: irm-bare-domain
  desc: PowerShell web request omits the URL scheme
  crit: notable
  conf: 0.92
  size_min: 1
  if:
    type: text
    regex: '\b(irm|Invoke-RestMethod)\s+[a-z0-9][a-z0-9.-]*\.[a-z]{2,}\b'
    case_insensitive: true
- id: iwr-bare-domain
  desc: Invoke-WebRequest uses a protocol-less host/path
  crit: notable
  conf: 0.92
  size_min: 1
  if:
    type: text
    regex: '\b(iwr|Invoke-WebRequest)\s+[a-z0-9][a-z0-9.-]*\.[a-z]{2,}\b'
    case_insensitive: true
- id: irm-jsdelivr-github-cdn-path
  desc: PowerShell fetches from jsDelivr CDN
  crit: notable
  conf: 0.94
  attack: T1105
  for: [powershell, batch]
  if:
    type: text
      # GitHub-backed jsDelivr routes are legitimate distribution paths, but
      # a PowerShell downloader can use them as a disposable staging surface.
      # Keep this as an infrastructure atom; the fetch-and-evaluate objective
      # supplies the intent. The scheme is optional because PowerShell accepts
      # a bare host/path as the argument to Invoke-RestMethod.
    regex: '(?i)\b(irm|iwr)\s+(https?://)?cdn\.jsdelivr\.net/gh/\d{6,}/[A-Za-z0-9_-]{3,}'
- id: irm-jsonkeeper-path
  desc: PowerShell fetches JSONKeeper-hosted content
  crit: notable
  conf: 0.94
  attack: T1105
  for: [powershell, batch]
  if:
    type: text
    regex: '(?i)\b(irm|iwr)\s+(https?://)?jsonkeeper\.com/[A-Za-z0-9_-]{4,}'
- id: irm-github-gist-path
  desc: PowerShell fetches content from a GitHub Gist
  crit: notable
  conf: 0.94
  attack: T1105
  for: [powershell, batch]
  if:
    type: text
    regex: '(?i)\b(irm|iwr)\s+(https?://)?gist\.github\.com/[\w.-]{1,40}/[a-f0-9]{8,}'
- id: webclient-download
  desc: System.Net.WebClient Download* call
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: WebClient\)?\.Download
    case_insensitive: true
  unless:
  - id: "metadata/lang/source/syntax::yara-rule-source"
- id: webclient-downloadstring
  desc: WebClient DownloadString call
  crit: notable
  conf: 0.92
    # WSH/VBScript and OLE/MSI installers frequently embed the PowerShell
    # command as a string.
  for: [powershell, batch, vbs, text]
  if:
    type: text
    regex: '(?i)(Net\.WebClient|System\.Net\.WebClient).{0,80}DownloadString\s*\('
  unless:
  - id: "metadata/lang/source/syntax::yara-rule-source"
  # Cleartext http:// only. `https?` also matched the TLS bootstrap one-liner
  # that vendors publish as their documented install step -- Chocolatey's own
  # setup.ps1 runs
  # `Invoke-Expression((New-Object net.webclient).DownloadString("https://community.chocolatey.org/install.ps1"))`
  # -- so the hostile composites that consume this atom convicted ordinary
  # installers. Pulling a remote script over an unauthenticated channel is the
  # part that carries the intent.
- id: downloadstring-cleartext-http-url
  desc: DownloadString fetches a cleartext HTTP URL
  crit: notable
  conf: 0.9
  for: [powershell, batch, vbs, text]
  if:
    type: text
    regex: '(?i)DownloadString\s*\(\s*[''"]http://'
- id: webclient-upload
  desc: System.Net.WebClient UploadString/UploadFile
  crit: notable
  conf: 0.85
  for: [powershell, batch]
  if:
    type: text
    regex: WebClient\)?\.Upload|UploadString|UploadFile|UploadData
    case_insensitive: true
  unless:
  - id: "metadata/lang/source/syntax::yara-rule-source"
- id: http-post-method
  desc: HTTP POST method specification
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: -Method\s+POST|-Method\s+['"]POST['"]
    case_insensitive: true
- id: http-body-param
  desc: PowerShell HTTP call with body argument
  crit: notable
  conf: 0.6
  if:
    type: tree-sitter
    query: |
      ((command
          command_name: [(command_name) (command_name_expr)] @client
          command_elements: (command_elements
            (command_parameter) @body_parameter
            . (command_argument_sep)
            . [(generic_token) (array_literal_expression)] @body_value)) @call
        (#match? @client "(?i)^(Invoke-WebRequest|Invoke-RestMethod|iwr|irm|'Invoke-WebRequest'|'Invoke-RestMethod'|'iwr'|'irm'|\"Invoke-WebRequest\"|\"Invoke-RestMethod\"|\"iwr\"|\"irm\")$")
        (#match? @body_parameter "(?i)^-Body:?$"))
- id: powershell-put-client-call
  desc: PowerShell HTTP PUT client call
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\b(Invoke-RestMethod|Invoke-WebRequest)\b[^\r\n]{0,220}-Method\s+Put\b'
- id: httpwebrequest
  desc: System.Net.HttpWebRequest usage
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: HttpWebRequest|\[System\.Net\.HttpWebRequest\]
    case_insensitive: true
- id: microsoft-graph-request-context
  desc: Microsoft Graph API request helper context
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(Invoke-MgGraphRequest|graph\.microsoft\.com|Microsoft Graph API|\bGraphBaseUri\b)'
    case_insensitive: true
- id: posthog-telemetry-context
  desc: PostHog telemetry event submission context
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'posthog\.com/capture|api_key.{0,120}distinct_id.{0,120}event'
    case_insensitive: true
- id: teams-notification-context
  desc: Microsoft Teams notification webhook context
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'TeamChannelWebhookUri|application/vnd\.microsoft\.card\.adaptive|Send-MtTeamsMessage'
    case_insensitive: true
- id: webclient-eval-followon
  desc: WebClient download piped to PowerShell eval
  crit: suspicious
  conf: 0.92
  for: [powershell, batch, vbs, javascript, html]
  if:
    type: text
    regex: '(?is)WebClient\)?\.Download\w+\(.{0,120}\)\s*\|\s*(Invoke-Expression|iex)\b'
    case_insensitive: true
  unless:
  - id: "metadata/lang/source/syntax::yara-rule-source"
- id: webclient-process-followon
  desc: WebClient download followed by process launch
  crit: suspicious
  conf: 0.9
  for: [powershell, batch, vbs, javascript, html]
  if:
    type: text
    regex: (?is)WebClient\)?\.Download\w+.{0,240}\bStart-Process\b.{0,120}
    case_insensitive: true
  not:
    # The matched span names the AWS SSM Agent or Google Cloud SDK installer
    # output. Setup scripts launch that vendor setup; it is not a follow-on payload.
    - regex: '(?i)(SSMAgent|GoogleCloudSDKInstaller)[_a-z0-9.-]{0,40}\.exe'
  unless:
  - id: "metadata/file/naming::test-directory-component"
  - id: well-known/app/communication/thunderbird::firefox-source-tree-path
  - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: metadata/build/recognized-contexts::sysmanage-prerequisite-installer-context
  - id: metadata/build/scaffold::powershell-development-environment-installer
  - id: python-msi-prerequisite-installer
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
composite_rules:
- id: powershell-http-post-body
  desc: PowerShell HTTP request specifies POST and a body
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/post::powershell-post-method
  - id: http-body-param

- id: python-msi-prerequisite-installer
  desc: Official Python MSI prerequisite installer
  crit: exception
  all:
  - id: micro-behaviors/communications/http/download/helper::python-source-release-reference
  - id: micro-behaviors/process/create/start-process::start-process-msiexec
- id: windows-http-post-body
  desc: Windows script sends an HTTP POST body
  crit: notable
  conf: 0.92
  any:
  - id: powershell-http-post-body
  - id: batch-powershell-iwr-post-body

- id: batch-powershell-iwr-post-body
  desc: Batch PowerShell POST body
  crit: notable
  conf: 0.92
  for: [batch]
  all:
  - id: batch-powershell-iwr-uri
  - id: batch-powershell-iwr-post
  - id: batch-powershell-iwr-body
  near_lines: 1
- id: invoke-webrequest
  desc: Invoke-WebRequest cmdlet (iwr alias)
  crit: notable
  conf: 0.8
  for: [powershell, pe, batch, text]
  any:
  - id: micro-behaviors/communications/http/client/library::iwr-name
  - id: iwr-name-reference
  - id: micro-behaviors/communications/http/client/library::iwr-uri
  - id: iwr-alias
  unless:
  - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
- id: request-powershell
  desc: PowerShell performs an HTTP request
  crit: notable
  conf: 0.9
  for: [powershell, pe]
  any:
  - id: invoke-webrequest
  - id: micro-behaviors/communications/http/client/library::powershell-rest-request
  - id: webclient-download
  - id: webclient-upload
  - id: httpwebrequest
- id: download
  desc: Downloads content from URL
  crit: notable
  conf: 0.9
  for: [powershell, pe]
  any:
  - id: invoke-webrequest
  - id: micro-behaviors/communications/http/client/library::powershell-rest-request
  - id: webclient-download
  - id: micro-behaviors/communications/http/download/manager::bits-transfer-cmdlet
  - id: tls12-force-string
- id: download-execute
  desc: Downloads and potentially executes content
  crit: suspicious
  conf: 0.9
  attack: T1105
  any:
  - id: webclient-eval-followon
  - id: webclient-process-followon
- id: http-body-or-upload
  desc: HTTP request carries body or upload
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: webclient-upload
  - id: http-post-method
  - id: http-body-param
- id: exfil-benign-context
  desc: Invoke-WebRequest exfil benign context
  crit: baseline
  conf: 0.9
  any:
  - id: micro-behaviors/os/package-manager/installer-script::ci-cd-pipeline
  - id: micro-behaviors/os/package-manager/installer-script::health-check
  - id: micro-behaviors/os/package-manager/installer-script::installer-script
  - id: microsoft-graph-request-context
  - id: posthog-telemetry-context
  - id: teams-notification-context
  - id: well-known/lib/ai/coding-assistant::ai-coding-assistant-runtime
  - id: well-known/app/media/maester::module-context
