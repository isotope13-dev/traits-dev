defaults:
  platforms: [windows]
traits: []
composite_rules:
  - id: webclient-downloadstring-http
    desc: WebClient DownloadString of a cleartext HTTP URL
    crit: notable
    conf: 0.94
    for: [powershell, batch]
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
    unless:
      - id: metadata/package/testing/presence/harness/


  - id: typename-downloadstring-http
    desc: TypeName WebClient plus cleartext HTTP URL
    crit: notable
    conf: 0.94
    for: [powershell, text]
    all:
      - id: micro-behaviors/communications/http/client/webclient::typename-webclient
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
    unless:
      - id: metadata/package/testing/presence/harness/


  - id: typename-webclient-downloadstring
    desc: TypeName WebClient DownloadString call
    crit: notable
    conf: 0.93
    for: [powershell, text]
    all:
      - id: micro-behaviors/communications/http/client/webclient::typename-webclient
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
    unless:
      - id: metadata/package/testing/presence/harness/
