defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: irm-external-ipv4-host
  desc: IRM/RestMethod targets raw external IPv4 host
  crit: notable
  conf: 0.94
  for: [powershell, batch, pe]
  if:
    type: text
    regex: "(?i)\\b(irm|Invoke-RestMethod)\\b[^\\r\\n]{0,40}['\\\"]?\\d{1,3}(\\.\\d{1,3}){3}([:/]|\\s|$)"
    is: external_ip
# irm fetch whose URL terminates in an opaque alphanumeric token (digit
# inside, no extension) — attacker staging paths like /hex/32yuqy2dbk.
# Vendor install one-liners use meaningful, extension-bearing paths
# (starship.rs/install.ps1, aka.ms/installazurecli) or no path at all.
