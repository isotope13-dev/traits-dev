# clj-http is the de-facto HTTP client for Clojure — the JVM equivalent of
# requests or axios — and had no coverage at all, so a library whose whole job
# is issuing requests to a caller-supplied URL reported no network capability.
# Callers almost always alias the namespace (`[clj-http.client :as http]`), and
# the alias is arbitrary, so the require line is the reliable anchor; the
# fully-qualified call form is matched for code that skips the alias.
defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1071.001

traits:
  - id: clj-http-client-namespace
    desc: References the clj-http client namespace
    if:
      type: text
      substr: clj-http.client

  - id: clj-http-qualified-request-call
    desc: Calls a qualified clj-http request function
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^clj-http\.client/(get|post|put|patch|delete|head|request)$'
