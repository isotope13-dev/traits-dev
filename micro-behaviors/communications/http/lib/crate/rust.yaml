defaults:
  platforms: [windows, unix, openwrt]
  for: [binaries, rust]
  crit: notable
  conf: 0.7
traits:
  - id: reqwest-crate
    desc: References reqwest Rust HTTP library
    if:
      type: text
      word: reqwest
  - id: ureq-crate
    desc: Uses the Rust ureq HTTP client
    if:
      type: text
      word: ureq
  - id: ureq-user-agent
    desc: ureq Rust HTTP user agent
    if:
      type: text
      substr: ureq/
  - id: hyper-crate
    desc: hyper Rust HTTP library
    if:
      type: text
      regex: (hyper::|hyper-[0-9]|/hyper/)
  - id: surf-crate
    desc: surf Rust HTTP library
    if:
      type: text
      regex: (surf-\d+\.\d+|surf::)
  - id: curl-rust-crate
    # `curl-rust` is the GitHub repository name, never the crate name, so a
    # bare substring match reads issue links in comments
    # (`github.com/alexcrichton/curl-rust/issues/279`) as a dependency the
    # code does not have. Match how the crate is actually reached instead,
    # like the `surf::` and `hyper::` traits above.
    desc: References the curl Rust HTTP crate
    if:
      type: text
      regex: '(curl::|extern\s+crate\s+curl\b)'
