# HTTP Request Operations - Rust
# MBC: C0002 (HTTP Communication)
# ATT&CK: T1071.001
defaults:
  attack: T1071.001
  mbc: C0002
  platforms: [unix, windows]
  for: [rust]
traits:
  - id: rust-reqwest-get-fn
    desc: Direct reqwest get request
    crit: notable
    conf: 0.88
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime/
      - type: basename
        regex: '(_test|test)\.rs$'
    if:
      type: text
      regex: '\breqwest::(blocking::)?get\s*\('
  - id: rust-reqwest-client-builder
    desc: reqwest HTTP client builder
    crit: notable
    conf: 0.88
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime/
      - type: basename
        regex: '(_test|test)\.rs$'
    if:
      type: text
      substr: reqwest::Client::builder()
  - id: rust-reqwest-builder
    desc: HTTP client builder with invalid
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: "danger_accept_invalid_certs"

composite_rules:
  - id: rust-reqwest
    desc: Sends HTTP GET through a reqwest client
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/source/property/read::rust-client-get-call
    any:
      - id: metadata/import/rust/reqwest/client
      - id: metadata/import/rust/reqwest/blocking/client
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime/
