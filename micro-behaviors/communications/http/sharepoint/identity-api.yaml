# SharePoint identity-provider and authenticated API paths used by the
# documented JWT authentication-bypass flow.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: sharepoint-active-directory-identity-provider
    desc: SharePoint Active Directory identity provider
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      exact: urn:office:idp:activedirectory

  - id: sharepoint-current-user-api-endpoint
    desc: SharePoint current-user API endpoint
    crit: notable
    conf: 0.94
    if:
      type: string_literal
      regex: '/_api/web/currentuser\b'

  - id: sharepoint-context-info-api-endpoint
    desc: SharePoint context-info API endpoint
    crit: notable
    conf: 0.94
    if:
      type: string_literal
      regex: '/_api/contextinfo\b'
