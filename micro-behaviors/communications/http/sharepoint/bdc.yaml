# SharePoint BDC catalog REST and client-service operations. Uploading a model
# can be legitimate administration; exploit intent is established by objective
# composites that also inspect the model's type and method bindings.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data]
  crit: notable
  conf: 0.96

traits:
  - id: sharepoint-bdc-metadata-catalog-reference
    desc: SharePoint BDC metadata catalog
    if:
      type: string_literal
      exact: BusinessDataMetadataCatalog

  - id: sharepoint-bdcm-file-add-endpoint
    desc: Adds a BDC model file
    if:
      type: text
      regex: '(?i)/Files/add\(.{0,240}\.bdcm\b'

  - id: sharepoint-client-process-query-endpoint
    desc: SharePoint client ProcessQuery endpoint
    if:
      type: string_literal
      regex: '(?i)/_vti_bin/client\.svc/ProcessQuery\b'

composite_rules:
  - id: sharepoint-bdcm-catalog-upload-endpoint
    desc: Uploads BDC model into metadata catalog
    all:
      - id: sharepoint-bdc-metadata-catalog-reference
      - id: sharepoint-bdcm-file-add-endpoint
    near_bytes: 1024
