# Google's old translate endpoint is a URL feature (`translate_c?u=` plus a
# language pair), including the bare-IP form Chinese desktop apps embed.
# It is not a payload host.
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [binaries, scripts, source]

traits:
  - id: google-translate-endpoint
    desc: Google Translate HTTP endpoint
    if:
      type: text
      substr: "translate_c?u="
