defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: generate-shareable-url-function
    desc: Generates shareable URL with parameters
    conf: 0.95
    if:
      type: symbol
      exact: generateShareableUrl

  - id: current-access-key-getter
    desc: Reads currentAccessKey tracking property
    conf: 0.95
    if:
      type: symbol
      exact: getCurrentAccessKey

  - id: base-url-getter
    desc: Reads baseUrl tracking property
    conf: 0.95
    if:
      type: symbol
      exact: getBaseUrl

  - id: append-client-geo-url-function
    desc: Appends client geo params to URLs
    conf: 0.95
    if:
      type: symbol
      exact: appendClientGeoToUrl
