defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8

traits:
# Canonical remote-image-URL matcher. It previously existed twice: once as
# data/format/html::remote-image-extension and once as
# http/url/query::ai-prompt-image-extension ("Prompt URL names a remote
# image"), whose name claimed a prompt context the regex never inspects and
# which therefore fired on any plugin that documents an image URL. Naming a
# resource type is a neutral URL observation; objective composites supply
# the surrounding attack context. Require the image suffix to terminate the
# path: postcard.gif.exe is an executable, not an image. Split WebP from the
# JPEG/PNG/GIF spellings to stay within the regex alternation budget.
- id: jpeg-png-gif-file-url
  desc: HTTP URL targets JPEG, PNG or GIF
  crit: notable
  conf: 0.85
  for: [scripts, source, documents, data, markdown]
  if:
    type: text
    regex: '(?i)https?://[^\s"''<>?#]{1,220}\.(jpe?g|png|gif)([?#\s"''<>]|$)'
- id: webp-file-url
  desc: HTTP URL targets a WebP image
  crit: notable
  conf: 0.85
  for: [scripts, source, documents, data, markdown]
  if:
    type: text
    regex: '(?i)https?://[^\s"''<>?#]{1,220}\.webp([?#\s"''<>]|$)'
- id: pe-cleartext-image-url
  desc: PE embeds cleartext image URL
  crit: notable
  conf: 0.92
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)http://[^ \t\r\n"<>]{1,220}\.(jpe?g|png|gif|webp)\b'
- id: image-file-url-template
  desc: HTTP image URL contains a placeholder
  crit: notable
  conf: 0.9
  for: [scripts, source, documents, data, markdown]
  if:
    type: text
    regex: '(?i)https?://\S{0,160}<[^>\r\n]{1,40}>\S{0,80}\.(jpe?g|png|gif|webp)\b'
composite_rules:
- id: image-file-url
  desc: HTTP URL targets an image file
  crit: notable
  conf: 0.85
  for: [scripts, source, documents, data, markdown]
  any:
  - id: jpeg-png-gif-file-url
  - id: webp-file-url
