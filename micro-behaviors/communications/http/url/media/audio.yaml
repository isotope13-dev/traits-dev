defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: compressed-audio-file-url
    desc: HTTP URL targets compressed audio file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'https?://[^/\s"'']{1,100}/[^\s"''?]{1,160}\.(mp3|ogg)([?\s"'']|$)'
      case_insensitive: true
