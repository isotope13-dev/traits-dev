defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: compressed-audio-file-url
    desc: HTTP URL targets compressed audio file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'https?://[^\s"'']{1,200}\.(mp3|ogg)(\?[^\s"'']{0,80})?'
      case_insensitive: true
