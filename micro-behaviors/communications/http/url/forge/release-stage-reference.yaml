traits:
- id: github-latest-release-asset-url
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: GitHub latest-release asset URL
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/releases/latest/download/
  for:
  - scripts
  platforms:
  - linux
  - macos
  - windows
