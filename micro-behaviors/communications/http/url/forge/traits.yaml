# Public code-forge URL references are neutral endpoint facts.  Download and
# sandbox-evasion objectives add the command and artifact context.
defaults:
  platforms: [windows, unix]
  for: [scripts]
  crit: notable

traits:
  - id: public-code-forge-url
    desc: References a public code-forge URL
    conf: 0.9
    if:
      type: text
      regex: 'https?://(www\.)?(github|gitlab|codeberg|bitbucket)\.(com|org)/'

  - id: github-raw-url
    desc: GitHub raw-content URL
    conf: 0.92
    if:
      type: text
      regex: 'https?://raw\.githubusercontent\.com/'
