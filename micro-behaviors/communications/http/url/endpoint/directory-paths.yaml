defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.92

traits:
- id: organization-path-token
  desc: organization URL path segment
  crit: notable
  if:
    type: text
    # A dot before the slash is a relative module path (require("./groups")),
    # not a URL endpoint segment; the engine has no lookaround, so the
    # preceding character is consumed per-match instead.
    regex: '(^|[^.])/organization\b'
- id: user-collection-path-token
  desc: user collection URL path segment
  crit: notable
  if:
    type: literal
    regex: '^/users($|[/?#])'
- id: group-collection-path-token
  desc: group collection URL path segment
  crit: notable
  if:
    type: text
    regex: '(^|[^.])/groups($|[/?#\s"''])'
- id: domain-collection-path-token
  desc: domain collection URL path segment
  crit: notable
  if:
    type: text
    regex: '(^|[^.])/domains($|[/?#\s"''])'

