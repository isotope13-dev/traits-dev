defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  # Also covers a computed origin. A path proves neither a remote server nor
  # that its configuration controls executable code.
  - id: configuration-api-path
    desc: References an API configuration endpoint path
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '/api/(v[0-9]+/)?config([/?#]|$)'
  - id: remote-feature-config-url
    desc: Remote feature configuration URL
    conf: 0.93
    if:
      type: string_literal
      regex: '(?i)https?://.{0,160}(app[-_]?config|feature[-_]?flag|remote[-_]?config)'
