defaults:
  crit: notable
traits:
- id: xss-report-callback
  platforms:
  - unix
  - windows
  conf: 0.85
  for:
  - scripts
  - -batch
  - -jcl
  - -lua
  - -perl
  - -applescript
  - -vbs
  - pe
  - go
  - rust
  - package.json
  desc: xss.report callback collection path
  if:
    type: text
    regex: xss\.report/(c|r)/[A-Za-z0-9_-]{3,80}\b
