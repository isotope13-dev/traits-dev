# Stable service embedded in the malicious YanZhiTi PyPI repack. It remains a
# network IOC here; objective composites establish what data is sent to it.
# The companion plaintext http://IP:port activation endpoint is covered by the
# canonical IP-port URL trait, which consuming composites reference instead of
# a duplicate single-URL literal.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 1.0
traits:
  - id: replacement-telemetry-endpoint
    desc: YanZhiTi replacement telemetry endpoint
    if:
      type: literal
      kind: string
      exact: https://yanzhitielemetry-sukzkbfzhc.ap-southeast-1.fcapp.run
