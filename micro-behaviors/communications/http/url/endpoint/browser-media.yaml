# Browser recording applications can legitimately capture or upload media.
# Requiring the capture source, MediaRecorder output handler, WebM multipart
# field, and POST body in one local region identifies the surveillance-style
# capture-and-forward implementation without relying on lure prose or brands.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
  - id: media-recording-upload-route
    desc: "Upload or recording endpoint literal"
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '^/([A-Za-z0-9_-]+/){0,4}(upload|recording)$'
  - id: html-media-recording-upload-route
    desc: "HTML upload or recording route reference"
    crit: notable
    conf: 0.94
    for: [html]
    if:
      type: text
      regex: '["''`]/((\$\{[A-Za-z_$][\w$]*\}|[A-Za-z0-9_-]+)/){0,4}(upload|recording)["''`]'
