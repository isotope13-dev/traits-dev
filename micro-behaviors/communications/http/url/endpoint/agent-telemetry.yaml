defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: promptster-api-host
    desc: Promptster telemetry API host
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: https://api.promptster.ai

  - id: promptster-agent-ingest-route
    desc: Promptster agent telemetry ingest route
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: /v1/teams/ingest

composite_rules:
  - id: ai-session-http-telemetry-references
    desc: AI session watcher with HTTP telemetry references
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/fs/watch::go-multiple-ai-session-watchers
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
      - id: promptster-api-host

