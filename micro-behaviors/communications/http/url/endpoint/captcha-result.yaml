defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: captcha-result-poll-path
    desc: CAPTCHA task-result polling URL reference
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/lib/ai/mcp-python-sdk::mcp-python-sdk-library
    if:
      type: literal
      regex: '(?i)/(get[_-]?task[_-]?result|res\.php)([?/#]|$)'