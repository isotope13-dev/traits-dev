defaults:
  platforms: [macos]
  for: [macho, objc, swift, shell, applescript]

traits:
  - id: macos-interface-api-url
    desc: URL with macOS interface API path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: https?://api\.[A-Za-z0-9.-]+/interface/mac/
  - id: ppdserver-failure-endpoint
    desc: ppdserver failure tracking URL
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: https://api\.ppdserver\.com/(exception|failed)\.php
