traits:
- id: python-webhook-site-uuid-literal
  platforms:
  - unix
  - windows
  desc: Python literal holds webhook.site UUID URL
  crit: notable
  conf: 0.97
  for:
  - python
  if:
    type: literal
    kind: string
    regex: '^[^\n]{0,60}webhook\.site/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-'
  unless:
    - id: metadata/package/testing/presence/harness/
    - id: metadata/path::test-directory-component
