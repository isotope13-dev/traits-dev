defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-exfil-endpoint
    desc: Node exfil endpoint
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["''`]/exfil(["''`/?#]|$)'
    unless:
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
composite_rules:
  - id: node-collect-or-exfil-endpoint
    desc: Node collection POST or explicit exfiltration endpoint
    crit: suspicious
    conf: 0.94
    any:
      - id: micro-behaviors/communications/http/url/endpoint::node-http-collect-post
      - id: micro-behaviors/communications/http/url/endpoint::node-exfil-endpoint
