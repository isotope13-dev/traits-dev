defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-exfil-endpoint
    desc: Node exfil endpoint
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["''`]/exfil(["''`/?#]|$)'
    unless:
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
      - id: well-known/tool/detection/ai-guardrail/
composite_rules:
  # A collection POST is only exfil-shaped when the data leaves the origin: a
  # same-origin relative-URL call to the app's own backend (every web UI) must
  # not convict. The remote-host leg within a tight window binds the endpoint,
  # the POST, and the off-origin destination together. A literal /exfil path
  # keeps its own suspicious atom; this rule covers the collect-API shape.
  - id: node-collect-or-exfil-endpoint
    desc: Node collection POST to a remote host
    crit: suspicious
    conf: 0.94
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/url/endpoint::node-http-collect-post
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
