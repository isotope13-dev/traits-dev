defaults:
  platforms: [openbsd, bsd, unix]
  for: [ruby]
  attack: T1041

traits:
  - id: ruby-openbsd-collect-path
    desc: Ruby OpenBSD collect path
    crit: suspicious
    conf: 0.92
    for: [ruby, shell]
    if:
      type: text
      # Word-boundary guard (no lookaround support in this regex engine): an
      # unanchored substring also matched Mastodon's own /api/v1/collections
      # REST endpoint (collections_spec.rb), which merely shares the
      # "collect" prefix with the malware's fixed C2 check-in path.
      regex: '/api/v1/collect([^a-zA-Z]|$)'
