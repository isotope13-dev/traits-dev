defaults:
  platforms: [unix, windows]
  for: [source, markdown, html, text, binaries]
traits:
  - id: http-target-field
    desc: HTTP URL in target or URL field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(url|target)\s*:\s*["'']https?://[A-Za-z0-9._:/?=&%-]{1,160}["'']'
