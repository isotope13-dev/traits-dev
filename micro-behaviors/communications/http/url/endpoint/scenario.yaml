defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.98

traits:
  - id: scenario-api-path
    desc: References the scenario configuration API path
    if:
      type: literal
      exclude_docstrings: true
      regex: '(^|https?://[^/\s]{1,160})/api/v[0-9]+/scenario([/?#]|$)'
