defaults:
  platforms: [unix, appliance]
  for: [shell]
  attack: T1041

traits:
  - id: shell-http-collect-url
    desc: Shell references an HTTP collect endpoint
    crit: suspicious
    conf: 0.92
    if:
      type: text
      # Keep /collect distinct from ordinary paths such as /collections.
      regex: 'http://[^"'' ]{1,120}/collect([/?#[:space:]]|$)'
    unless:
    - id: metadata/package/testing/corpus/
