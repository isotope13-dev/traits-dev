traits:
- id: cgi-bin-endpoint-url
  desc: CGI endpoint path
  conf: 0.7
  if:
    type: string_literal
    substr: /cgi-bin/
  not:
  - regex: (?i)mitre\.org/cgi-bin/
  unless:
  - type: string_literal
    substr: postgresql/xa/RecoveredXid.java
  - id: well-known/lib/data/holidays::country-calendar-module
- id: wp-admin-endpoint-url
  desc: WordPress admin endpoint path
  conf: 0.7
  if:
    type: string_literal
    substr: /wp-admin
- id: admin-command-endpoint-url
  desc: Admin command endpoint path
  conf: 0.7
  if:
    type: string_literal
    regex: /admin/(cmd|shell|upload)
- id: admin-php-endpoint-url
  desc: Admin PHP endpoint path
  conf: 0.7
  if:
    type: string_literal
    substr: /admin.php
- id: exploit-endpoint-file
  desc: Shell/CMD endpoint filename token
  conf: 0.75
  if:
    type: string_literal
    regex: (shell\.php|cmd\.asp)
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: well-known/tool/offensive/payload-corpus/
  - id: well-known/tool/offensive/bingo::bingo-pentest-module-context
  - id: micro-behaviors/communications/http/url/endpoint::hard-blocked-api-paths
- id: hard-blocked-api-paths
  desc: Hard-blocked API path list
  conf: 0.9
  if:
    type: text
    substr: HARD_BLOCKED_PATHS
- id: exploit-endpoint-rpc
  desc: Dollar-prefixed RPC endpoint path
  conf: 0.6
  if:
    type: string_literal
    regex: /(\$[0-9]{4,5})\b([^.0-9]|$)
- id: shell-endpoint
  desc: Webshell path (shell.php/jsp) in URL
  conf: 0.6
  if:
    type: string_literal
    regex: shell\.(php|asp|jsp|aspx|ashx)|/shell\.(php|asp|jsp)
composite_rules:
- id: exploit-endpoint-url
  desc: Exploit-prone admin/CGI endpoint path
  conf: 0.7
  any:
  - id: micro-behaviors/communications/http/url/endpoint::cgi-bin-endpoint-url
  - id: micro-behaviors/communications/http/url/endpoint::wp-admin-endpoint-url
  - id: micro-behaviors/communications/http/url/endpoint::admin-command-endpoint-url
  - id: micro-behaviors/communications/http/url/endpoint::admin-php-endpoint-url
  - id: micro-behaviors/communications/http/url/endpoint::shell-endpoint
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
