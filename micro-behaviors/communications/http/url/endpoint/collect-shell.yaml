defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9


traits:
  - id: shell-nc-collect-post
    desc: Netcat pipeline contains HTTP POST to collect
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'POST /collect HTTP/1\.[01][\s\S]{0,360}\|\s*nc\b'

  - id: shell-wget-collect-post
    desc: wget POST command references a collect endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'wget\s+[^\\n]{0,180}--post-(data|file)[^\\n]{0,180}/collect\b'

  - id: shell-curl-collect-post
    desc: curl POST command references a collect endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'curl\s+[^\\n]{0,140}-X POST[^\\n]{0,180}/collect\b'


composite_rules:
  - id: shell-collect-post-command
    desc: HTTP POST command references a collect endpoint
    crit: notable
    conf: 0.9
    for: [shell]
    any:
      - id: shell-curl-collect-post
      - id: shell-wget-collect-post
      - id: shell-nc-collect-post
