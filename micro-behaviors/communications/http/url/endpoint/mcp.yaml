defaults:
  for: [scripts, source]
  platforms: [unix, windows]
traits:
  - id: mcp-connection-test-route
    desc: MCP connection-test HTTP route reference
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: /mcp-rest/test/connection

  # The connection-test route addressed by an RFC 5737 documentation-range
  # host (TEST-NET-1/2/3 are reserved for examples and never routed). Both
  # facts sit in the same URL literal, so the bounded window binds them.
  # This is the lab-fixture shape of the command-injection probe: security
  # test suites aim the identical request at routable addresses, so a probe
  # that points here is exercising server-side sanitization, not delivering
  # the stage. Referenced from the stage-delivery and download-profile
  # suppressor lists; kept notable because the target cannot be a real
  # endpoint and analysts should see the request at all.
  - id: mcp-connection-test-doc-range-target
    desc: Connection-test route on documentation IPv4
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)(192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}\b.{0,120}/mcp-rest/test/connection'
