defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.99

traits:
  - id: preinstall-archive-replay-url
    desc: Preinstall URL replays a third-party origin
    if:
      type: value
      path: scripts.preinstall
      regex: 'https?://web\.archive\.org/web/([0-9]{1,14}[a-z_]{0,4}/)?https?://'
