defaults:
  crit: notable
traits:
- id: canarytokens-traffic-path
  platforms: [unix, windows]
  conf: 0.95
  for: [scripts, -batch, -jcl, -lua, -perl, -applescript, -vbs, pe, go, rust, package.json]
  desc: CanaryTokens traffic callback path
  if:
    type: text
    regex: canarytokens\.com/tags/traffic/[A-Za-z0-9_-]{8,}
