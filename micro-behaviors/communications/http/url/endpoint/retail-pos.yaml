defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: retail-pos-transaction-path
    desc: Retail POS transaction API path
    conf: 0.94
    if:
      type: literal
      kind: string
      substr: /pos-transactions

  - id: retail-ejournal-api-path
    desc: Retail electronic journal API path
    conf: 0.94
    if:
      type: literal
      kind: string
      substr: /ejournals

  - id: retail-cashier-api-path-prefix
    desc: Retail cashier API path prefix
    conf: 0.92
    if:
      type: literal
      kind: string
      substr: /cashier-

composite_rules:
  - id: retail-pos-api-route-whitelist
    desc: Retail POS API route whitelist
    crit: suspicious
    conf: 0.94
    needs: 2
    any:
      - id: retail-pos-transaction-path
      - id: retail-ejournal-api-path
      - id: retail-cashier-api-path-prefix
