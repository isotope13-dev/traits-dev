defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

traits:
  - id: retail-pos-transaction-path
    desc: Retail POS transaction API path
    conf: 0.94
    if:
      type: literal
      kind: string
      substr: /pos-transactions

  - id: retail-ejournal-api-path
    desc: Retail electronic journal API path
    conf: 0.94
    if:
      type: literal
      kind: string
      substr: /ejournals

  - id: retail-cashier-api-path-prefix
    desc: Retail cashier API path prefix
    conf: 0.92
    if:
      type: literal
      kind: string
      substr: /cashier-


composite_rules:
  - id: retail-pos-route-cluster
    desc: Retail POS API route references
    crit: notable
    conf: 0.94
    needs: 2
    any:
      - id: micro-behaviors/communications/http/url/retail::retail-pos-transaction-path
      - id: micro-behaviors/communications/http/url/retail::retail-ejournal-api-path
      - id: micro-behaviors/communications/http/url/retail::retail-cashier-api-path-prefix
