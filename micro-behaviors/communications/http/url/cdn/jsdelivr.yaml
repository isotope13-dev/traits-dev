defaults:
  platforms: [unix, windows]
  for: [source, markdown, html, text, binaries]
traits:
  - id: jsdelivr-npm-script-url
    desc: References an npm JavaScript asset on jsDelivr
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'cdn\.jsdelivr\.net/npm/[^"''\s]{0,160}\.js([?#][^"''\s]{0,160})?'
