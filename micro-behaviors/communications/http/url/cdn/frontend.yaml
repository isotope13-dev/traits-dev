defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php, python]
  crit: notable
  conf: 0.82

traits:
- id: cdnjs-asset
  desc: References a cdnjs frontend asset URL
  if:
    type: text
    regex: 'https?://cdnjs\.cloudflare\.com/'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

# The cdnjs library path (/ajax/libs/<name>/<version>/...) served from
# a host that merely contains a CDN brand name. The genuine cdnjs host
# is cdnjs.cloudflare.com; a lookalike host borrowing the brand and
# the path layout is how injected WP scripts borrow CDN trust. The
# unless keeps pages that also load the real cdnjs out of this claim.
- id: cdnjs-path-lookalike-host
  desc: cdnjs-style path on a lookalike CDN host
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'src=[''"]https?://[a-z0-9.-]{0,60}cloudflare[a-z0-9.-]{0,40}/ajax/libs/'
  unless:
  - id: micro-behaviors/communications/http/url/cdn::cdnjs-asset

# A host whose registrable name borrows the Google brand without being a
# Google domain. Real Google script hosts are excluded per match below.
- id: google-lookalike-script-host
  desc: Script loads from a Google-brand lookalike host
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'src=["'']https?://[a-z0-9.-]*google[a-z0-9.-]*/'
  not:
  - regex: 'src=["'']https?://(www\.)?google\.com/'
  - regex: 'src=["'']https?://[a-z0-9.-]*\.googleapis\.com/'
  - regex: 'src=["'']https?://apis\.google\.com/'
  - regex: 'src=["'']https?://[a-z0-9.-]*\.googlesyndication\.com/'
  - regex: 'src=["'']https?://[a-z0-9.-]*\.google-analytics\.com/'
  - regex: 'src=["'']https?://[a-z0-9.-]*\.gstatic\.com/'
  - regex: 'src=["'']https?://[a-z0-9.-]*googlecode\.com/'

- id: jsdelivr-asset
  desc: References a jsDelivr frontend asset URL
  if:
    type: text
    regex: 'https?://cdn\.jsdelivr\.net/'
  unless:
    - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
    - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: jsdelivr-mirror-host-set
  desc: References multiple jsDelivr mirror hosts
  conf: 0.94
  if:
    type: text
    regex: 'quantil\.jsdelivr\.net[\s\S]{0,200}(gcore|testingcf)\.jsdelivr\.net'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
- id: tailwind-cdn-asset
  desc: References a Tailwind CDN asset URL
  if:
    type: text
    regex: 'https?://cdn\.tailwindcss\.com/'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: unpkg-asset
  desc: References an unpkg frontend asset URL
  if:
    type: text
    regex: 'https?://unpkg\.com/[A-Za-z0-9]'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: jquery-cdn-asset
  desc: References a jQuery CDN asset URL
  if:
    type: text
    regex: 'https?://code\.jquery\.com/jquery-'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: bootstrap-cdn-asset
  desc: References a Bootstrap CDN asset URL
  if:
    type: text
    regex: 'https?://cdn\.jsdelivr\.net/npm/bootstrap@'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: fontawesome-cdn-asset
  desc: References a Font Awesome CDN asset URL
  if:
    type: text
    regex: 'https?://cdnjs\.cloudflare\.com/ajax/libs/font-awesome/'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: cloudfront-asset-url
  desc: References a CloudFront-hosted asset URL
  if:
    type: text
    regex: '(https?:)?//[a-z0-9-]{12,64}\.cloudfront\.net/[A-Za-z0-9._~!$&()*+,;=:@/?%-]{12,}'

# `cdn.jsdelivr.net/npm/2e6d5f64604be31/2e6d5f64604be31.js` -- jsDelivr will
# serve any package on npm, so publishing a throwaway package under a random
# hex name gives an attacker a script URL on a CDN every corporate proxy
# already trusts. A real library is named for what it is; nothing legitimate
# ships from a 12-to-20 hex-digit package name.
- id: jsdelivr-hex-named-package
  desc: jsDelivr URL names a hex-named package
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'cdn\.jsdelivr\.net/npm/[0-9a-f]{12,20}[/@]'
composite_rules:
- id: multiple-frontend-cdn-hosts
  desc: References multiple frontend CDN providers
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: cdnjs-asset
  - id: jsdelivr-asset
  - id: tailwind-cdn-asset
  - id: unpkg-asset
  - id: jquery-cdn-asset
  # Bootstrap is already a jsDelivr URL; Font Awesome is already cdnjs.
  # Count providers once rather than counting two views of the same URL.
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-scanner-context
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
