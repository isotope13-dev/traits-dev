defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php, python]
  crit: notable
  conf: 0.82
  mbc: C0002
  attack: T1071.001

traits:
- id: cdnjs-asset
  desc: References a cdnjs frontend asset URL
  if:
    type: text
    regex: 'https?://cdnjs\.cloudflare\.com/'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: jsdelivr-asset
  desc: References a jsDelivr frontend asset URL
  if:
    type: text
    regex: 'https?://cdn\.jsdelivr\.net/'
  unless:
    - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: jsdelivr-mirror-host-set
  desc: References multiple jsDelivr mirror hosts
  conf: 0.94
  if:
    type: text
    regex: 'quantil\.jsdelivr\.net[\s\S]{0,200}(gcore|testingcf)\.jsdelivr\.net'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
- id: tailwind-cdn-asset
  desc: References a Tailwind CDN asset URL
  if:
    type: text
    regex: 'https?://cdn\.tailwindcss\.com/'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: unpkg-asset
  desc: References an unpkg frontend asset URL
  if:
    type: text
    regex: 'https?://unpkg\.com/[A-Za-z0-9]'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: jquery-cdn-asset
  desc: References a jQuery CDN asset URL
  if:
    type: text
    regex: 'https?://code\.jquery\.com/jquery-'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: bootstrap-cdn-asset
  desc: References a Bootstrap CDN asset URL
  if:
    type: text
    regex: 'https?://cdn\.jsdelivr\.net/npm/bootstrap@'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: fontawesome-cdn-asset
  desc: References a Font Awesome CDN asset URL
  if:
    type: text
    regex: 'https?://cdnjs\.cloudflare\.com/ajax/libs/font-awesome/'
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

- id: cloudfront-asset-url
  desc: References a CloudFront-hosted asset URL
  if:
    type: text
    regex: '(https?:)?//[a-z0-9-]{12,64}\.cloudfront\.net/[A-Za-z0-9._~!$&()*+,;=:@/?%-]{12,}'

composite_rules:
- id: multiple-frontend-cdn-assets
  desc: References multiple public frontend CDN assets
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: cdnjs-asset
  - id: jsdelivr-asset
  - id: tailwind-cdn-asset
  - id: unpkg-asset
  - id: jquery-cdn-asset
  - id: bootstrap-cdn-asset
  - id: fontawesome-cdn-asset
  unless:
  - id: well-known/tool/detection/scarno::scarno-defensive-scanner-context
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
