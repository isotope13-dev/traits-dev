defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: browser-location-search-read
    desc: Reads browser URL query string
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: window.location.search
  - id: encoded-query-parameter
    desc: Encodes a value into a query parameter
    crit: notable
    conf: 0.86
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\?data=[''"]?\s*\+\s*encodeURIComponent\('
  # Script/image beacons often smuggle a payload as `?key=' + btoa(secret)`.
  # Distinct from encodeURIComponent query encoding above.
  - id: btoa-query-parameter
    desc: Concatenates btoa() into a query parameter
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '[?&][A-Za-z_][\w-]{0,24}=[''"]?\s*\+\s*btoa\s*\('
  - id: btoa-json-stringify-call
    desc: Base64-encodes JSON.stringify output via btoa
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'btoa\s*\(\s*JSON\.stringify\s*\('
  - id: encoded-template-query-parameter
    desc: Encodes value in a URL query template
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[?&][A-Za-z][A-Za-z0-9_-]{0,40}=\$\{encodeURIComponent\('
  - id: function-encoded-template-query-parameter
    desc: Encodes query value with function
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[?&][A-Za-z][A-Za-z0-9_-]{0,40}=\$\{[A-Za-z_$][A-Za-z0-9_$]*\s*\([^}]{1,160}\)\}'
  - id: query-parameter-mutation
    desc: Mutates a URL query parameter collection
    crit: notable
    conf: 0.82
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\b(params|searchParams)\.(set|append)\s*\('

  - id: extension-campaign-identity-query-fields--user
    desc: Extension campaign user identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[?&](uid|user_id|cid)='
  - id: extension-campaign-identity-query-fields--offer
    desc: Extension campaign offer identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[?&](offer_id|i_id|implementation_id)='

  - id: js-email-parameter-mutation
    desc: JavaScript sets an email URL parameter
    crit: notable
    conf: 0.94
    for: [html, javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: params.set
      arg:
        kind: string
        exact: email
  - id: stored-email-url-query
    desc: Adds stored email to URL query
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[?&]mail=\$\{encodeURIComponent\([^)]{0,80}\.mail\)\}'
  - id: js-urlsearchparams-construction
    desc: Builds URL query parameters
    crit: notable
    conf: 0.95
    for: [html, javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: URLSearchParams
  - id: browser-url-query-enumeration
    desc: Enumerates URL query parameters
    crit: notable
    conf: 0.86
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'URLSearchParams[\s\S]{0,512}forEach'
  - id: browser-url-query-forwarding-loop
    desc: URL query is forwarded with append
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'URLSearchParams[\s\S]{0,400}\.forEach[\s\S]{0,300}\.append\s*\('
  - id: obfuscated-urlsearchparams-iteration
    desc: URLSearchParams iterated via obfuscated call
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'URLSearchParams\s*\([\s\S]{0,160}\)\s*\[[^\]]{1,100}\]\s*\(\s*function'
  - id: bracket-searchparams-append
    desc: Appends query via bracket searchParams access
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\[["'']searchParams["'']\]\[["'']append["'']\]\s*\('
  - id: computed-target-url-params-call
    desc: Computed targetUrl property ending ms invoked
    crit: component
    conf: 0.88
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'targetUrl\s*\[[^\]]{1,80}\+\s*["'']ms["'']\]\s*\[[^\]]{1,80}\]\s*\('
  - id: continue-redirect-param-read
    desc: Reads the continue= redirect parameter
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'location\.search\.split\(["'']continue='

  # Keitaro's JavaScript handoff asks the tracker to return executable client
  # code. Keep the protocol marker neutral here; compromised-page intent is
  # established by the remote-script injection composites under objectives/.
  - id: keitaro-js-client-return-mode
    desc: Requests Keitaro JavaScript client response mode
    crit: notable
    conf: 0.96
    for: [html, javascript, typescript, php]
    if:
      type: literal
      kind: string
      regex: '[?&]return=js\.client(&|$)'

  - id: keitaro-browser-context-query-fields
    desc: Builds Keitaro browser-context query fields
    crit: notable
    conf: 0.97
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '[?&]se_referrer=[\s\S]{0,600}[?&]default_keyword=[\s\S]{0,600}[?&]landing_url='

  # Two-part Keitaro handoffs stash tracker base and campaign TTL on a window
  # config object. Split into short atoms; the composite enforces co-occurrence.
  - id: keitaro-window-unique-field
    desc: Keitaro window config unique field
    crit: component
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bunique\s*:'

  - id: keitaro-window-ttl-field
    desc: Keitaro window config ttl field
    crit: component
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bttl\s*:'

  - id: keitaro-window-rpath-field
    desc: Keitaro window config R_PATH field
    crit: component
    conf: 0.94
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bR_PATH\s*:'
composite_rules:
  - id: keitaro-window-handoff-config
    desc: Keitaro unique ttl R_PATH config
    crit: notable
    conf: 0.97
    for: [html, javascript, typescript]
    all:
      - id: keitaro-window-unique-field
      - id: keitaro-window-ttl-field
      - id: keitaro-window-rpath-field
    near_bytes: 240
  - id: extension-campaign-identity-query-fields
    desc: URL carries multiple extension identity fields
    crit: notable
    conf: 0.9
    any:
      - id: extension-campaign-identity-query-fields--user
      - id: extension-campaign-identity-query-fields--offer
