defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: browser-location-search-read
    desc: Reads browser URL query string
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: window.location.search
  - id: encoded-query-parameter
    desc: Encodes a value into a query parameter
    crit: notable
    conf: 0.86
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\?data=[''"]?\s*\+\s*encodeURIComponent\('
  - id: encoded-template-query-parameter
    desc: Encodes value in a URL query template
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[?&][A-Za-z][A-Za-z0-9_-]{0,40}=\$\{encodeURIComponent\('
  - id: query-parameter-mutation
    desc: Mutates a URL query parameter collection
    crit: notable
    conf: 0.82
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\b(params|searchParams)\.(set|append)\s*\('

  - id: extension-campaign-identity-query-fields--user
    desc: Extension campaign user identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[?&](uid|user_id|cid)='
  - id: extension-campaign-identity-query-fields--offer
    desc: Extension campaign offer identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[?&](offer_id|i_id|implementation_id)='

  - id: js-email-parameter-mutation
    desc: JavaScript sets an email URL parameter
    crit: notable
    conf: 0.94
    for: [html, javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: params.set
      arg:
        kind: string
        exact: email
  - id: stored-email-url-query
    desc: Adds stored email to URL query
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[?&]mail=\$\{encodeURIComponent\([^)]{0,80}\.mail\)\}'
  - id: js-urlsearchparams-construction
    desc: Builds URL query parameters
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: URLSearchParams
  - id: browser-url-query-enumeration
    desc: Enumerates URL query parameters
    crit: notable
    conf: 0.86
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'URLSearchParams[\s\S]{0,512}forEach'
  - id: continue-redirect-param-read
    desc: Reads the continue= redirect parameter
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'location\.search\.split\(["'']continue='
composite_rules:
  - id: extension-campaign-identity-query-fields
    desc: URL carries multiple extension identity fields
    crit: notable
    conf: 0.9
    any:
      - id: extension-campaign-identity-query-fields--user
      - id: extension-campaign-identity-query-fields--offer
