defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, pe]
  crit: notable
  conf: 0.8
traits:
  - id: dynamic-object-id-query
    desc: URL interpolates an object-ID query value
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      # Require ${x} or {x} interpolation — static ?id=page URLs must not match.
      regex: 'https?://[^"''`\s]{1,160}[?&]([A-Za-z]+_)?id=(\$\{|\{)[A-Za-z_$][\w$]*'

  - id: dynamic-object-id-query-concat
    desc: Concatenates an object-ID into a query
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      # Require the bare `id` query key. Names like `feed_id` or `user_id`
      # are ordinary REST parameters, not generic object-ID enumeration.
      type: text
      regex: '[?&]id=["'']?\s*\+\s*[A-Za-z_$]'
    unless:
      # Yandex Translate widget session ids (...tr-url-widget&id="+c+"-0-0).
      - id: yandex-translate-widget-id-query
      # Google Tag Manager / gtag.js loader (...gtag/js?id="+measurementId).
      - id: gtag-js-measurement-id-query
      # Classic GTM snippet (...gtm.js?id='+i).
      - id: gtm-js-container-id-query

  - id: yandex-translate-widget-id-query
    desc: Yandex Translate widget session id query
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      substr: tr-url-widget&id=

  - id: gtag-js-measurement-id-query
    desc: Google gtag.js measurement id query
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      substr: googletagmanager.com/gtag/js?id=

  - id: gtm-js-container-id-query
    desc: Google Tag Manager container id query
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      substr: googletagmanager.com/gtm.js?id=


  - id: google-search-query-url
    desc: Google search query URL
    crit: notable
    conf: 0.95
    for: [javascript, typescript, html]
    if:
      type: text
      substr: https://www.google.com/search?q=

  - id: token-query-parameter
    desc: URL token query parameter
    crit: notable
    conf: 0.82
    for: [javascript, typescript, html, python, shell]
    if:
      type: text
      regex: '[?&]token=[A-Za-z0-9_-]{16,}'
      case_insensitive: true

  # ClickFix macOS delivery pings C2 with event=pasted after the victim
  # executes the Terminal one-liner. The query key/value is protocol, not prose.
  - id: pasted-event-query
    desc: event=pasted telemetry query parameter
    crit: notable
    conf: 0.94
    for: [shell, html, javascript, typescript]
    if:
      type: text
      regex: '(?i)[?&]event=pasted\b'

  - id: password-query-parameter
    desc: URL password query parameter
    crit: notable
    conf: 0.8
    for: [javascript, typescript, html, python, shell]
    if:
      type: literal
      regex: '[?&]password='
      case_insensitive: true

  # Callback and JSONP parameters are protocol markers.  They are neutral
  # here; exploit-chain composites must supply the browser and admin-action
  # context before assigning an exploit classification.
  - id: http-callback-query-parameter
    desc: HTTP callback query parameter
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, php, python, powershell, shell]
    if:
      type: text
      regex: '(?i)[?&]callback='

  - id: jsonp-query-parameter
    desc: JSONP-named query parameter
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html, php, python, powershell, shell]
    if:
      type: text
      regex: '(?i)[?&]_?jsonp='

  - id: search-source-query-parameter
    desc: Search URL source query parameter
    crit: notable
    conf: 0.86
    for: [javascript, typescript, html]
    if:
      type: literal
      kind: string
      regex: 'https?://[^"''\s]{0,80}(search|newtab)[^"''\s]{0,80}[?&]source='
      case_insensitive: true
  - id: utm-source-query-param
    desc: UTM source query parameter
    crit: component
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: '[?&]utm_source='
      case_insensitive: true
  - id: utm-medium-query-param
    desc: UTM medium query parameter
    crit: component
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: '[?&]utm_medium='
      case_insensitive: true
  - id: utm-campaign-query-param
    desc: UTM campaign query parameter
    crit: component
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: '[?&]utm_campaign='
      case_insensitive: true
  - id: dropper-common-params
    desc: Common dropper URL parameters (add, uuid)
    if:
      type: encoded
      regex: '[?&]add=[a-zA-Z0-9]{10,}'
  - id: dropper-uuid-param
    desc: UUID-like query parameter seen in droppers
    if:
      type: encoded
      regex: '[?&]uuid=[a-zA-Z0-9]{10,}'
  - id: dropper-obfuscated-add-param
    desc: Obfuscated add parameter construction
    if:
      type: encoded
      regex: '[?&]\{[^:]+:[''"]a[''"]\}\.[a-zA-Z0-9_$]+\+\{[^:]+:[''"]d[''"]\}\.[a-zA-Z0-9_$]+'
  - id: http-query-uids-list-param
    desc: HTTP query list parameter for UIDs
    crit: baseline
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: 'uids\[\]\s*='
  - id: mac-query-param-format
    desc: URL query includes formatted MAC address
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '[?&]mac=%02X-%02X-%02X-%02X-%02X-%02X'
  - id: yandex-installer-telemetry-query
    desc: Yandex installer telemetry query parameters
    crit: component
    conf: 0.95
    for: [pe]
    if:
      type: encoded
      regex: '[?&]yandexuid=\d{10,}.*[?&]mongoID=[0-9a-f]{16,}'
    not:
      - regex: '(?i)(docs|example|test|sample)'
  - id: url-query-type-data-exfil
    desc: URL query exfil with type/data params
    crit: notable
    conf: 0.92
    attack: T1041
    for: [javascript]
    if:
      type: text
      regex: '\?type=\$\{[^}]{1,80}\}&data=\$\{[^}]{1,80}\}'

  - id: url-query-type-data-literal
    desc: URL query with type and data params
    crit: notable
    conf: 0.88
    attack: T1041
    for: [javascript, python, shell]
    if:
      type: text
      regex: "[?&]type=[^&]{1,80}&data=[^&]{1,80}"
    unless:
      - type: text
        substr: "application/x-www-form-urlencoded"
      - id: metadata/package/testing/harness/runtime/

  - id: url-parameter-ignore-matcher
    desc: Service worker URL parameter ignore matcher
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      substr: ignoreURLParametersMatching

  - id: ai-chat-url-path-marker
    desc: URL path names an AI chat endpoint
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    # Monaco/Wallaby bundles contain links to product chat pages. Those are
    # documentation URLs, not programmatic chat endpoints; require an API-like
    # path segment so a product link alone is not enough.
    unless:
      - id: well-known/lib/ui/monaco-editor/
    if:
      type: text
      regex: '(?i)https?://[^/"''<>\s]{1,80}/(chat|assistant|agent|rovo)(/(api|v[0-9]+)|[?#])'

  # Microsoft Copilot Personal deep links use the web app host with a bare
  # `q=` prompt plus undocumented `autorun=` auto-execution (CoSnitch-class).
  # Keep `q=` as a component — alone it matches ordinary search URLs.
  - id: microsoft-copilot-web-host
    desc: Microsoft Copilot web app host
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown, html]
    if:
      type: text
      regex: '(?i)https?://copilot\.microsoft\.com\b'

  - id: ai-assistant-autorun-query-param
    desc: Assistant URL carries autorun query
    crit: notable
    conf: 0.92
    for: [scripts, source, documents, data, markdown, html]
    if:
      type: text
      regex: '(?i)[?&](amp;)?autorun=[0-9]'

  - id: short-q-query-param
    desc: URL carries a bare q= query value
    crit: component
    conf: 0.7
    for: [scripts, source, documents, data, markdown, html]
    if:
      type: text
      regex: '(?i)[?&](amp;)?q=[^&"''\s>]{8,}'

  # Plain message= is intentionally not included: it is a common parameter in
  # ordinary notification and messaging APIs (SMS gateways, status webhooks).
  # Keep each key atom under the regex-size budget; composites below OR them.
  - id: ai-prompt-query-key-basic
    desc: Prompt, task, or instruction query parameter
    crit: notable
    conf: 0.92
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      # Include the value in the match so OAuth's standardized UI prompt
      # values can be filtered from this AI/tasking-oriented observation.
      regex: '(?i)[?&](amp;)?(prompt|task|instruction)=[^&"''\s]{1,80}'
    not:
      - regex: '(?i)[?&](amp;)?prompt=(select_account|login|consent)\b'
      - regex: '(?i)[?&](amp;)?prompt=(none|create)\b'

  - id: ai-prompt-query-key-qualified
    desc: Qualified AI prompt query key
    crit: notable
    conf: 0.92
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      regex: '(?i)[?&](amp;)?(user|system|ai|chat|agent|assistant)[_-](prompt|message|query)='

  - id: ai-prompt-query-key-camel
    desc: Camel-case prompt query key
    crit: notable
    conf: 0.92
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      # Product integrations commonly concatenate a product or chat-surface
      # name with Prompt/Message/Query (for example, rovoChatPrompt). Keep
      # the capitalized suffix so ordinary `message=` fields do not match.
      regex: '(?i)[?&](chat|agent|assistant|ai)[A-Za-z0-9]{0,12}(prompt|task|instruction|message|query)='

  # Value-side fragments: incomplete alone, meaningful only with a prompt key.
  - id: ai-prompt-query-remote-url-value
    desc: Query value contains a remote URL
    crit: component
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      regex: '(?i)[?&][\w-]{1,32}=[^ \t\r\n]{0,600}https?://'

  - id: ai-prompt-query-encoded-url-value
    desc: Query value contains an encoded remote URL
    crit: component
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      regex: '[?&][\w-]{1,32}=[^ \t\r\n]{0,600}https?%3a%2f%2f'
      case_insensitive: true

  - id: ai-prompt-query-encoded-image-value
    desc: Encoded prompt image URL value
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      # The query value can encode the scheme and path separators while
      # leaving the image extension literal. The query-key and template
      # context are supplied by the composites below.
      regex: '(?i)[?&][\w-]{1,32}=\S{0,800}https?%3a%2f%2f\S{0,180}(%2f|/)\S{0,80}(%2e|\.)jpe?g\b'

  - id: ai-prompt-query-double-brace-value
    desc: Query value contains a double-brace template
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    if:
      type: text
      regex: '[?&][\w-]{1,32}=\S{0,60}\{\{[^}\r\n]{1,40}\}\}'
      case_insensitive: true

  - id: ai-prompt-query-dollar-value
    desc: Query value contains a dollar template
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    if:
      type: text
      regex: '[?&][\w-]{1,32}=\S{0,60}\$\{[^}\r\n]{1,40}\}'
      case_insensitive: true

  - id: ai-prompt-query-angle-value
    desc: Query value contains an angle template
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    if:
      type: text
      # Keep the value URL-shaped and placeholder-like.  A broad \S span
      # turns bitwise comparisons such as `&128===...d<55296||d>` in bundled
      # JavaScript into a query parameter with an angle value.
      regex: '[?&](amp;)?[\w-]{1,32}=[^&#<>\s]{0,60}<[\w$.:/-]{1,40}>'
      case_insensitive: true

  - id: ai-prompt-query-encoded-angle-value
    desc: Query value contains encoded angle data
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    if:
      type: text
      regex: '[?&][\w-]{1,32}=\S{0,60}%3c[^%\r\n]{1,40}%3e'
      case_insensitive: true

  # The remote-image-URL matcher is canonical at
  # micro-behaviors/communications/http/url/path::image-file-url; the
  # composites below reference it and supply the prompt context.

composite_rules:
  # OR of the two prompt-key atoms. Paired with an all: value leg so this is
  # not a low-value any-only composite filtered from findings.
  - id: ai-prompt-query-http-url
    desc: Prompt query carries a remote URL
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    near_bytes: 700
    all:
      - id: ai-prompt-query-remote-url-value
    any:
      - id: ai-prompt-query-key-basic
      - id: ai-prompt-query-key-qualified
      - id: ai-prompt-query-key-camel

  - id: ai-prompt-query-encoded-url
    desc: Prompt query carries an encoded URL
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    near_bytes: 700
    all:
      - id: ai-prompt-query-encoded-url-value
    any:
      - id: ai-prompt-query-key-basic
      - id: ai-prompt-query-key-qualified
      - id: ai-prompt-query-key-camel

  - id: ai-prompt-url-double-brace-data
    desc: Prompt query contains a double-brace value
    crit: suspicious
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 200
    all:
      - id: ai-prompt-query-double-brace-value
    any:
      - id: ai-prompt-query-key-basic
      - id: ai-prompt-query-key-qualified
      - id: ai-prompt-query-key-camel

  - id: ai-prompt-url-dollar-data
    desc: Prompt query contains a dollar template value
    crit: notable
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 200
    all:
      - id: ai-prompt-query-dollar-value
    any:
      - id: ai-prompt-query-key-basic
      - id: ai-prompt-query-key-qualified
      - id: ai-prompt-query-key-camel
    not:
      - regex: '(?i)(^|[?&])prompt=(consent|login|none|select_account)(?:[&#"\s]|$)'

  - id: ai-prompt-url-angle-data
    desc: Prompt query contains an angle value
    crit: suspicious
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 200
    all:
      - id: ai-prompt-query-angle-value
    any:
      - id: ai-prompt-query-key-basic
      - id: ai-prompt-query-key-qualified
      - id: ai-prompt-query-key-camel

  - id: ai-prompt-url-encoded-angle-data
    desc: Prompt query contains encoded angle data
    crit: suspicious
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 200
    all:
      - id: ai-prompt-query-encoded-angle-value
    any:
      - id: ai-prompt-query-key-basic
      - id: ai-prompt-query-key-qualified
      - id: ai-prompt-query-key-camel

  - id: ai-chat-prompt-query-parameter
    desc: AI chat URL carries a prompt query
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    near_bytes: 300
    all:
      - id: ai-chat-url-path-marker
    any:
      - id: ai-prompt-query-key-basic
      - id: ai-prompt-query-key-qualified
      - id: ai-prompt-query-key-camel

  # Copilot Personal deep-link shape (host + q= + autorun=). Escalation to
  # hostile lives in objectives/evasion/security-bypass/llm/prompt/.
  - id: microsoft-copilot-autorun-prompt-url
    desc: Copilot URL auto-runs a prompt query
    crit: suspicious
    conf: 0.98
    for: [scripts, source, documents, data, markdown, html]
    near_bytes: 400
    all:
      - id: microsoft-copilot-web-host
      - id: ai-assistant-autorun-query-param
      - id: short-q-query-param

  - id: ai-prompt-query-remote-url
    desc: Prompt query carries a remote URL
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    any:
      - id: ai-prompt-query-http-url
      - id: ai-prompt-query-encoded-url

  - id: ai-prompt-image-template-url
    desc: AI prompt carries a templated image URL
    crit: suspicious
    conf: 0.97
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 1400
    all:
      - id: ai-chat-prompt-query-parameter
      - id: ai-prompt-query-remote-url
      - id: micro-behaviors/communications/http/url/path::image-file-url
    any:
      - id: ai-prompt-url-double-brace-data
      - id: ai-prompt-url-dollar-data
      - id: ai-prompt-url-angle-data
      - id: ai-prompt-url-encoded-angle-data

  - id: ai-prompt-image-placeholder-url
    desc: AI prompt carries a placeholder image URL
    crit: suspicious
    conf: 0.97
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 1400
    all:
      - id: ai-chat-prompt-query-parameter
      - id: ai-prompt-query-remote-url
      - id: micro-behaviors/communications/http/url/path::image-file-url-template
    any:
      - id: ai-prompt-url-angle-data
      - id: ai-prompt-url-dollar-data

  - id: ai-prompt-query-encoded-image-template-url
    desc: Encoded prompt carries templated image URL
    crit: suspicious
    conf: 0.97
    for: [scripts, source, documents, data, markdown]
    near_bytes: 1600
    all:
      - id: ai-chat-prompt-query-parameter
      - id: ai-prompt-query-encoded-image-value
      - id: ai-prompt-query-encoded-angle-value

  - id: ai-prompt-image-template-url-markup
    desc: Markup prompt carries a templated image URL
    crit: suspicious
    conf: 0.97
    for: [html, markdown]
    near_bytes: 1400
    all:
      - id: ai-chat-prompt-query-parameter
      - id: ai-prompt-query-remote-url
      - id: micro-behaviors/communications/http/url/path::image-file-url
    any:
      - id: micro-behaviors/data/format/html::url-value-template

  - id: utm-source-medium-campaign-url
    desc: URL carries UTM source/medium/campaign triad
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    near_bytes: 256
    all:
      - id: utm-source-query-param
      - id: utm-medium-query-param
      - id: utm-campaign-query-param
  - id: dropper-common-params-any
    desc: Common dropper URL parameters (add, uuid)
    crit: notable
    conf: 0.8
    any:
      - id: dropper-common-params
      - id: dropper-uuid-param
      - id: dropper-obfuscated-add-param
      - id: mac-query-param-format
