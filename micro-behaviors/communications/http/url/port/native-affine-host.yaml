defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
  crit: notable

traits:
  - id: x86-affine-xor-selected-tld-https-custom-port
    desc: XOR-decoded HTTPS host uses a custom port
    conf: 0.99
    if:
      # Recover only the TLD relation used by this trait. The key, hostname,
      # affine constants, addresses and port come from the file's code/data.
      # Bind decoded host storage and formatted port buffer to URL assembly.
      type: yara
      source: |
        import "pe"
        rule x86_affine_xor_selected_tld_https_custom_port {
          strings:
            $scheme = "https://\x00" ascii
            $format = ":%d\x00" ascii
            $loop = { B0 ?? 8A 55 ?? 32 14 0F 0F AF C1 83 C0 ?? 31 C2 8B 03 88 14 08 41 39 CE 75 ?? }
            $host = { B9 ?? ?? ?? ?? BA ?? ?? ?? ?? B8 ?? ?? ?? ?? C7 04 24 ?? ?? ?? ?? E8 ?? ?? ?? ?? }
            $port = {
              8D 85 ?? ?? ?? ?? C7 44 24 0C ?? ?? ?? ??
              C7 44 24 08 ?? ?? ?? ?? C7 44 24 04 ?? ?? ?? ??
              89 04 24 FF 15 ?? ?? ?? ??
            }
            $assemble = {
              8D B5 ?? ?? ?? ?? C7 44 24 08 ?? ?? ?? ??
              C7 44 24 04 ?? ?? ?? ?? 89 34 24 E8 ?? ?? ?? ??
              8D 85 ?? ?? ?? ?? 89 F1 89 04 24 E8 ?? ?? ?? ??
            }
            // Alternate COW string ABI and EBX-indexed affine XOR loop.
            $loop_cow = { B1 ?? 8A 55 ?? 32 14 18 88 C8 0F AF C3 8D 48 ?? 8B 06 31 CA 88 14 18 43 EB ?? }
            $port_cow = {
              8D 45 ?? C7 44 24 0C ?? ?? ?? ??
              C7 44 24 08 ?? ?? ?? ?? C7 44 24 04 ?? ?? ?? ??
              89 04 24 FF 15 ?? ?? ?? ??
            }
            $assemble_cow = {
              8D 5D ?? C7 44 24 08 ?? ?? ?? ?? 8D 75 ??
              C7 44 24 04 ?? ?? ?? ?? 8D 7D ?? 89 1C 24 E8 ?? ?? ?? ??
              8D 45 ?? 89 44 24 08 89 5C 24 04 89 34 24 E8 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            (
            for any h in (1..#host) : (
              uint32(@host[h]+1) >= 4 and uint32(@host[h]+1) <= 253 and
              for any l in (1..#loop) : (
                @host[h]+27+int32(@host[h]+23) == @loop[l]-50 and
                for any p in (1..#port) : (
                  @port[p] < @host[h] and @host[h]-@port[p] < 512 and
                  uint32(@port[p]+10) > 0 and uint32(@port[p]+10) <= 65535 and
                  uint32(@port[p]+10) != 443 and
                  for any f in (1..#format) : (
                    pe.rva_to_offset(uint32(@port[p]+18)-pe.image_base) == @format[f]
                  ) and
                  for any u in (1..#assemble) : (
                    @assemble[u] > @host[h] and @assemble[u]-@host[h] < 256 and
                    uint32(@host[h]+11) == uint32(@assemble[u]+10) and
                    uint32(@port[p]+2) == uint32(@assemble[u]+32) and
                    for any s in (1..#scheme) : (
                      pe.rva_to_offset(uint32(@assemble[u]+18)-pe.image_base) == @scheme[s]
                    ) and
                    for any n in (uint32(@host[h]+1)..uint32(@host[h]+1)) : (
                      for any k in (uint8(@host[h]+18)..uint8(@host[h]+18)) : (
                        for any a in (uint8(@loop[l]+1)..uint8(@loop[l]+1)) : (
                          for any b in (uint8(@loop[l]+13)..uint8(@loop[l]+13)) : (
                            ((uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-3) ^ k ^ ((a*(n-3)+b)&255)) == 46 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-2) ^ k ^ ((a*(n-2)+b)&255)) == 109 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-1) ^ k ^ ((a*(n-1)+b)&255)) == 101) or
                            ((uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-4) ^ k ^ ((a*(n-4)+b)&255)) == 46 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-3) ^ k ^ ((a*(n-3)+b)&255)) == 120 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-2) ^ k ^ ((a*(n-2)+b)&255)) == 121 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-1) ^ k ^ ((a*(n-1)+b)&255)) == 122) or
                            ((uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-4) ^ k ^ ((a*(n-4)+b)&255)) == 46 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-3) ^ k ^ ((a*(n-3)+b)&255)) == 116 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-2) ^ k ^ ((a*(n-2)+b)&255)) == 111 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-1) ^ k ^ ((a*(n-1)+b)&255)) == 112) or
                            ((uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-4) ^ k ^ ((a*(n-4)+b)&255)) == 46 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-3) ^ k ^ ((a*(n-3)+b)&255)) == 105 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-2) ^ k ^ ((a*(n-2)+b)&255)) == 99 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-1) ^ k ^ ((a*(n-1)+b)&255)) == 117)
                          )
                        )
                      )
                    )
                  )
                )
              )
            ) or
            for any h in (1..#host) : (
              uint32(@host[h]+1) >= 4 and uint32(@host[h]+1) <= 253 and
              for any l in (1..#loop_cow) : (
                @host[h]+27+int32(@host[h]+23) == @loop_cow[l]-56 and
                for any p in (1..#port_cow) : (
                  @port_cow[p] < @host[h] and @host[h]-@port_cow[p] < 512 and
                  uint32(@port_cow[p]+7) > 0 and uint32(@port_cow[p]+7) <= 65535 and
                  uint32(@port_cow[p]+7) != 443 and
                  for any f in (1..#format) : (
                    pe.rva_to_offset(uint32(@port_cow[p]+15)-pe.image_base) == @format[f]
                  ) and
                  for any u in (1..#assemble_cow) : (
                    @assemble_cow[u] > @host[h] and @assemble_cow[u]-@host[h] < 256 and
                    uint32(@host[h]+11) == uint32(@assemble_cow[u]+7) and
                    uint8(@port_cow[p]+2) == uint8(@assemble_cow[u]+35) and
                    for any s in (1..#scheme) : (
                      pe.rva_to_offset(uint32(@assemble_cow[u]+18)-pe.image_base) == @scheme[s]
                    ) and
                    for any n in (uint32(@host[h]+1)..uint32(@host[h]+1)) : (
                      for any k in (uint8(@host[h]+18)..uint8(@host[h]+18)) : (
                        for any a in (uint8(@loop_cow[l]+1)..uint8(@loop_cow[l]+1)) : (
                          for any b in (uint8(@loop_cow[l]+15)..uint8(@loop_cow[l]+15)) : (
                            ((uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-3) ^ k ^ ((a*(n-3)+b)&255)) == 46 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-2) ^ k ^ ((a*(n-2)+b)&255)) == 109 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-1) ^ k ^ ((a*(n-1)+b)&255)) == 101) or
                            ((uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-4) ^ k ^ ((a*(n-4)+b)&255)) == 46 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-3) ^ k ^ ((a*(n-3)+b)&255)) == 120 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-2) ^ k ^ ((a*(n-2)+b)&255)) == 121 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-1) ^ k ^ ((a*(n-1)+b)&255)) == 122) or
                            ((uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-4) ^ k ^ ((a*(n-4)+b)&255)) == 46 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-3) ^ k ^ ((a*(n-3)+b)&255)) == 116 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-2) ^ k ^ ((a*(n-2)+b)&255)) == 111 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-1) ^ k ^ ((a*(n-1)+b)&255)) == 112) or
                            ((uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-4) ^ k ^ ((a*(n-4)+b)&255)) == 46 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-3) ^ k ^ ((a*(n-3)+b)&255)) == 105 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-2) ^ k ^ ((a*(n-2)+b)&255)) == 99 and
                            (uint8(pe.rva_to_offset(uint32(@host[h]+6)-pe.image_base)+n-1) ^ k ^ ((a*(n-1)+b)&255)) == 117)
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
            )
        }

