traits:
- id: pdf-msi-url
  desc: PDF links an MSI installer
  conf: 0.92
  if:
    type: value
    path: pdf.actions[*].snippet
    regex: (?i)https?://[^\s<>()"]{4,220}\.msi([?#]|$)
- id: pdf-executable-url
  desc: PDF links a Windows executable
  conf: 0.93
  if:
    type: value
    path: pdf.actions[*].snippet
    regex: (?i)https?://[^\s<>()"]{4,200}\.(exe|scr|bat)([?#]|$)
- id: pdf-macos-installer-url
  desc: PDF links a macOS installer
  conf: 0.9
  if:
    type: value
    path: pdf.actions[*].snippet
    regex: (?i)https?://[^\s<>()"]{4,200}\.(dmg|pkg)([?#]|$)
composite_rules:
- id: pdf-annotated-executable-link
  desc: PDF annotation links an executable
  conf: 0.95
  all:
  - id: metadata/document/pdf/action::pdf-annotation-object
  any:
  - id: micro-behaviors/communications/http/url/file-type::pdf-msi-url
  - id: micro-behaviors/communications/http/url/file-type::pdf-executable-url
  - id: micro-behaviors/communications/http/url/cloud::cloud-executable-url
defaults:
  for:
  - pdf
  platforms:
  - windows
  - unix
  crit: notable
