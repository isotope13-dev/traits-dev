# Route literals establish no request or telemetry purpose.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - elf
  - macho
  - -batch
  - -jcl
  - -perl
  - -lua
  - -applescript
  - -vbs
  - -c
  - -cpp
  - -csharp
  - -swift
  - -groovy
  - -kotlin
  - -scala
  - -zig
  - -elixir
traits:
- id: ingest-api-path
  desc: Ingest or upload API endpoint path
  crit: notable
  conf: 0.85
  if:
    type: literal
    regex: /(api/(v[0-9]+/)?)?ingest\b|/api/(v[0-9]+/)?upload\b
