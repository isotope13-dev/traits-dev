defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, scripts]
traits:
  # The `not:` clauses reject RFC1918, loopback and link-local, so lab and
  # intranet build scripts pointing at 10.x/192.168.x staging hosts do not
  # match — only genuinely public, unnamed hosts do.
  - id: public-ip-installer-url-reference
    desc: Installer URL references a bare public IP
    crit: notable
    conf: 0.93
    if:
      type: text
      is: external_ip
      regex: '(?i)https?://(\d{1,3}\.){3}\d{1,3}(:\d{2,5})?/[^\s"''<>]{0,120}\.(msi|exe|pkg|dmg)\b'
    not:
      - regex: '//(10|127|0|169)\.'
      - regex: '//192\.168\.'
      - regex: '//172\.(1[6-9]|2[0-9]|3[01])\.'
      # A 1990s HTML catalog can link cgi-win/amg.exe on a bare IP. That is a
      # CGI program name, not an installer the page serves.
      - regex: 'cgi-(win|bin)/'
      # All Music Guide's 1990s catalog links cgi programs named AMG.exe.
      - regex: 'AMG_?\.exe'
    unless:
      - id: well-known/tool/development/build/homebrew/
      - id: metadata/package/manager::homebrew-cask-class
      - id: metadata/package/manager::homebrew-formula-class

