traits:
  - id: external-ip-info-txt-url
    desc: External-IP HTTP URL names an info.txt file
    crit: notable
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{2,5}/[^\s''"]{0,120}info\.txt'
      is: external_ip

