defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: archive-url-reference-a
    desc: URL ends in .zip or .7z
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[^\s''"]{1,160}\.(zip|7z)([?#][^\s''"]{0,120})?$'
    unless:
      - id: metadata/document/html::doctype
  - id: executable-url-reference-b
    desc: URL ends in .cmd, .ps1 or .dll
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[^\s''"]{1,160}\.(cmd|ps1|dll)([?#][^\s''"]{0,120})?$'
    not:
      # IIS/ASP script endpoints named *.dll are HTTP handlers, not downloads.
      - regex: '(?i)/(scripts|cgi-bin)/[^\s''"]+\.dll'
    unless:
      - id: metadata/package/documentation/page::static-documentation-html-page
