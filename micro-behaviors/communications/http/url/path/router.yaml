# Neutral `/router` URL path. Relocated from objectives/exfiltration/http/
# upload, where it was called "HTTP client targets a router path" even though
# the matcher only sees a URL literal — lucide-react's per-icon JSDoc link
# (`https://lucide.dev/icons/router`) was reported under an exfiltration
# objective. The credential-exfil composite there still references this atom
# and supplies the credential-harvest leg itself.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.9

traits:
  - id: router-endpoint-url
    desc: HTTP URL path ends in /router
    if:
      type: text
      regex: 'https?://[^\s"''<>]{1,160}/router([/?#"'']|$)'
