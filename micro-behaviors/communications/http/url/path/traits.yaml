defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
- id: control-route-path
  desc: HTTP route uses control or execution
  # Workflow and task APIs commonly expose /run or /execute. Binding and
  # access-control composites determine whether the route is security-relevant.
  crit: component
  conf: 0.92
  if:
    type: literal
    regex: '(?i)^/(cmd|commands?|control|execute|exec|run|scripts?/run|sequences?|seq)([/?#]|$)'
- id: api-beacon-path
  # The path identifies a beacon-shaped API surface, but not the HTTP client
  # implementation or whether the traffic is hostile. Objective composites
  # add protocol and payload evidence before drawing those conclusions.
  desc: HTTP API beacon endpoint path
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)/api/beacon([/?#]|$)'
- id: values-path-segment
  desc: URL path contains a values segment
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: /values/
- id: code-transform-endpoint-path
  desc: HTTP encode/decode endpoint path
  crit: notable
  conf: 0.9
  for: [python, javascript, typescript]
  if:
    type: text
    regex: 'https?://[^\s"'']{1,200}/(encode|decode)\b'
- id: wav-file-url
  desc: HTTP URL targets WAV audio file
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'https?://[^\s"'']{1,200}\.wav(\?[^\s"'']{0,80})?$'
    case_insensitive: true
- id: remote-transfer-url-path
  desc: URL path names upload, backup or exfil
  crit: notable
  conf: 0.95
  for: [scripts, source, json, python, javascript, typescript, shell, powershell, ruby, perl, php]
  if:
    type: text
    regex: 'https?://[A-Za-z0-9._/-]{1,120}/(backup|upload|exfil)(/|["''])'
    case_insensitive: true
# Canonical remote-image-URL matcher. It previously existed twice: once as
# data/format/html::remote-image-extension and once as
# http/url/query::ai-prompt-image-extension ("Prompt URL names a remote
# image"), whose name claimed a prompt context the regex never inspects and
# which therefore fired on any plugin that documents an image URL. Naming a
# resource type is a refinement of a URL other atoms already report, so it
# stays component; the prompt-injection and hidden-markup composites supply
# the surrounding meaning.
- id: image-file-url
  desc: HTTP URL targets an image file
  crit: notable
  conf: 0.85
  for: [scripts, source, documents, data, markdown]
  if:
    type: text
    regex: '(?i)https?://[^ \t\r\n"<>]{1,220}\.(jpe?g|png|gif|webp)\b'
- id: pe-cleartext-image-url
  desc: PE embeds cleartext image URL
  crit: notable
  conf: 0.92
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)http://[^ \t\r\n"<>]{1,220}\.(jpe?g|png|gif|webp)\b'
- id: image-file-url-template
  desc: HTTP image URL contains a placeholder
  crit: notable
  conf: 0.9
  for: [scripts, source, documents, data, markdown]
  if:
    type: text
    regex: '(?i)https?://\S{0,160}<[^>\r\n]{1,40}>\S{0,80}\.(jpe?g|png|gif|webp)\b'
- id: mutable-branch-ref-path
  # A URL whose path selects a branch head (/branch/main, /refs/heads/master)
  # resolves to whatever that branch points at today, so the retrieved bytes
  # are not pinned. Neutral on its own — build scripts and docs link this way
  # constantly; supply-chain composites add the fetch-and-execute context.
  desc: URL path selects a mutable branch head
  crit: notable
  conf: 0.88
  for: [scripts, source, manifests]
  if:
    # Documentation links and comments are references, not runtime URL use.
    # Literal facts retain URLs actually embedded as program or manifest data.
    type: literal
    kind: string
    regex: 'https?://[^\s]{0,120}/(branch|heads)/(main|master)\b'
- id: mutable-raw-branch-path
  # Bitbucket and similar code forges expose branch-selected raw content as
  # `/raw/main/...`. Unlike a commit-addressed raw URL, its bytes can change
  # without the consuming artifact changing. Neutral on its own; objective
  # composites add the fetch-and-execute relationship.
  desc: Raw-content URL selects mutable branch
  crit: notable
  conf: 0.94
  for: [scripts, source]
  if:
    type: literal
    kind: string
    regex: 'https?://[^\s]{0,120}/raw/(main|master)(/|$)'
- id: telemetry-api-path
  desc: Telemetry endpoint URL path
  conf: 0.78
  if:
    type: text
    # Anchor on an actual URL: an absolute http(s) URL or an `/api` route
    # prefix. A bare `/telemetry` segment also matched module specifiers and
    # source paths (e.g. the Monaco/VS Code module id
    # `vs/platform/telemetry/common/telemetry`), which are not endpoints.
    regex: '(?i)(https?://[^\s"'']{0,100}|/api)/telemetry([/?#"'']|$)'
  unless:
    - id: well-known/lib/observability/sentry-js::sentry-develop-docs
    - id: well-known/lib/observability/sentry-js::sentry-core-package-path
- id: http-result-endpoint
  desc: HTTP URL uses a top-level result endpoint
  crit: notable
  conf: 0.88
  if:
    type: literal
    regex: "https?://[^\\s\"/]{1,120}/result([\"'?&\\s]|$)"
  unless:
    - id: metadata/package/documentation/page::static-html-shell
- id: analytics-collect-v2-path
  desc: Analytics collect API v2 path
  crit: notable
  conf: 0.9
  for: [javascript, typescript, shell, python]
  if:
    type: text
    substr: /v2/collect
- id: metrics-run-api-path
  desc: Metrics run API endpoint path
  crit: notable
  conf: 0.9
  for: [shell, html, javascript, typescript]
  if:
    type: text
    regex: '(?i)/api/metrics/run\b'
- id: email-subscription-endpoint
  desc: References remote email-subscription endpoint
  crit: notable
  conf: 0.94
  for: [scripts, source]
  if:
    type: literal
    kind: string
    regex: 'https?://[^/\s]+/[^\s]{0,160}\bemail-subscriptions?\b'
- id: session-refresh-endpoint
  desc: HTTP session refresh endpoint
  conf: 0.9
  if:
    type: literal
    regex: '\b(User|Auth)/RefreshToken\b'
- id: public-key-retrieval-endpoint
  desc: HTTP public key retrieval endpoint
  conf: 0.9
  if:
    type: literal
    regex: '\b(Visitor|User|Admin)/GetPublicKey\b'
- id: trade-order-history-endpoint
  desc: Trade order-history endpoint path
  conf: 0.88
  for: [javascript, typescript, html]
  if:
    type: literal
    regex: 'priapi/v\d+/trade/orders-history-archive|trade/orders-history'
- id: payload-path-a-get
  desc: HTTP GET executable path
  crit: notable
  attack: T1105
  if:
    type: text
    regex: \bGET\s+/\S+\.(bin|exe|sh|elf)\b
- id: payload-path-a-post
  desc: HTTP POST executable path
  crit: notable
  attack: T1105
  if:
    type: text
    regex: \bPOST\s+/\S+\.(bin|exe|sh|elf)\b
- id: payload-path-a-put
  desc: HTTP PUT executable path
  crit: notable
  attack: T1105
  if:
    type: text
    regex: \bPUT\s+/\S+\.(bin|exe|sh|elf)\b
- id: payload-path-b-get
  desc: HTTP GET payload path
  crit: notable
  attack: T1105
  if:
    type: text
    regex: \bGET\s+/\S+\.(dll|so|dat|payload)\b
- id: payload-path-b-post
  desc: HTTP POST payload path
  crit: notable
  attack: T1105
  if:
    type: text
    regex: \bPOST\s+/\S+\.(dll|so|dat|payload)\b
- id: payload-path-b-put
  desc: HTTP PUT payload path
  crit: notable
  attack: T1105
  if:
    type: text
    regex: \bPUT\s+/\S+\.(dll|so|dat|payload)\b
- id: office-macro-document-url
  desc: External Office macro document URL
  crit: suspicious
  conf: 0.95
  attack: T1105
  for: [html, javascript, typescript]
  if:
    type: text
    regex: https?://[^\s"'<>]{1,200}\.(docm|dotm)(\b|[?#])
    case_insensitive: true
- id: http-api-version-path
  desc: HTTP API version endpoint path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(^|https?://[^/\n]{0,200})?/v[0-9.]+/version($|[?#])'
- id: lnk-remote-pdf-url
  desc: LNK opens remote PDF URL
  crit: notable
  conf: 0.94
  attack: T1105
  for: [lnk]
  platforms: [windows]
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)\bstart\s+msedge(\.exe)?\s+"https?://[^"\s]{1,180}\.pdf([?#][^"\s]*)?"'
composite_rules:
- id: local-ip-or-localhost-literal
  desc: Contains a localhost or IP address literal
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/communications/ip/literal::localhost-source
  - id: micro-behaviors/communications/ip/literal::loopback-ipv6-literal
  - id: micro-behaviors/communications/ip/literal::ipv4-literal
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: payload-path-a
  desc: HTTP executable path
  crit: notable
  conf: 0.8
  attack: T1105
  any:
  - id: payload-path-a-get
  - id: payload-path-a-post
  - id: payload-path-a-put
- id: payload-path-b
  desc: HTTP payload path
  crit: notable
  conf: 0.8
  attack: T1105
  any:
  - id: payload-path-b-get
  - id: payload-path-b-post
  - id: payload-path-b-put
- id: payload-path
  desc: URL path suggesting payload download
  crit: notable
  conf: 0.8
  attack: T1105
  any:
  - id: payload-path-a
  - id: payload-path-b
- id: local-ip-or-localhost-guard
  desc: Skips localhost and IP literal hosts
  crit: notable
  conf: 0.9
  for: [javascript]
  near_bytes: 256
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/file/catalog/identity/
  - id: micro-behaviors/data/source/build::icon-registry-bundle
  all:
  - id: local-ip-or-localhost-literal
  # A host read beside an unrelated URL literal is not a guard. Require an
  # actual comparison involving the current browser host.
  - id: micro-behaviors/communications/http/url/navigation::browser-location-host-comparison
