defaults:
  platforms: [android, windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: js-relative-route-fetch
    desc: JavaScript fetches a relative application route
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        kind: string
        regex: '^/[A-Za-z0-9._~!$&''()*+,;=:@/-]{1,120}$'
  - id: fetch-encoded-template-path
    desc: Fetch embeds encoded data in URL path
    if:
      type: text
      regex: 'fetch\s*\(\s*`https?://[^`]{0,120}\$\{encodeURIComponent\('

  - id: browser-url-origin-read
    desc: Derives an origin from a URL
    if:
      type: text
      regex: 'new\s+URL\s*\([^)]{1,120}\)\s*\.\s*origin\b'

  - id: controller-pairing-api-route
    desc: Handles controller pairing API route
    crit: notable
    conf: 0.97
    platforms: [unix, windows]
    if:
      type: text
      regex: 'path\s*===\s*["'']/api/(master|controller)["'']'

  - id: fetch-encoded-log-path
    desc: Fetches encoded data to logging URL path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'fetch\s*\(\s*`https?://[^`]{0,160}/log(it|ger)?/[^`]{0,160}\$\{encodeURIComponent\('

  # The password identifier appears inside the value being URL-encoded, so the
  # credential demonstrably reaches the request -- as opposed to merely living
  # in the same file as a logger, which is true of every mail or FTP client.
  - id: url-encoded-password-value
    desc: Password value URL-encoded into a request
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'encodeURIComponent\([^)]{0,80}\bpass(word|wd)?\b'

  - id: remote-extension-catalog-url
    desc: Remote extension/shortcut listing URL path
    conf: 0.92
    if:
      type: text
      regex: 'https?://[A-Za-z0-9._:/-]{1,200}/(api/extensions(\.php)?|js/shortcuts\.json)'
      case_insensitive: true

  - id: js-interpreter-runtime-download-url
    desc: JavaScript Python runtime or pip URL
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)https?://[^"''\s]{1,220}(get-pip\.py|python(\.org/ftp/python|[-.]build-standalone))'
