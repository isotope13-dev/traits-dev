defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.96

traits:
  - id: buddypress-delete-account-route
    desc: BuddyPress member account-deletion route
    if:
      type: string_literal
      substr: '/settings/delete-account/'

  - id: buddypress-delete-account-route-unicode
    desc: Escaped BuddyPress account-deletion route
    if:
      type: encoded
      encoding: unicode-escape
      substr: '/settings/delete-account/'

  - id: wordpress-lost-password-route
    desc: WordPress lost-password action route
    if:
      type: string_literal
      regex: '/wp-login\.php\?action=lostpassword\b'

  - id: wordpress-lost-password-route-unicode
    desc: Escaped WordPress lost-password route
    if:
      type: encoded
      encoding: unicode-escape
      regex: '/wp-login\.php\?action=lostpassword\b'

composite_rules:
  - id: buddypress-delete-account-route-any
    desc: References BuddyPress account-deletion route
    any:
      - id: buddypress-delete-account-route
      - id: buddypress-delete-account-route-unicode

  - id: wordpress-lost-password-route-any
    desc: References WordPress lost-password action route
    any:
      - id: wordpress-lost-password-route
      - id: wordpress-lost-password-route-unicode
