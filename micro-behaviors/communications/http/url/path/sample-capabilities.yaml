traits:
- id: http-run-path
  desc: HTTP URL uses a /run path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)https?://[^\s"'`]{1,200}/run/?([?#\s"'`]|$)
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - markdown
  - text
  - documents
- id: python-report-heartbeat-beacon-url
  desc: HTTP report, heartbeat or beacon URL
  crit: notable
  conf: 0.88
  if:
    type: literal
    regex: (?i)^https?://[^\s"\x27]{1,160}/(report|heartbeat|beacon)([/?]|$)
    exclude_docstrings: true
  platforms:
  - unix
  for:
  - python
- id: python-switch-toggle-url
  desc: HTTP switch or toggle endpoint URL
  crit: notable
  conf: 0.75
  if:
    type: literal
    regex: ^https?://[^\s/]{1,160}/[^\s]{0,80}(switch|toggle)([/?#]|$)
    exclude_docstrings: true
  platforms:
  - windows
  - unix
  for:
  - python
- id: python-api-v1-beacon-agent-url
  desc: Python references an agent-specific beacon URL
  crit: suspicious
  conf: 0.94
  if:
    type: text
    substr: /api/v1/beacon/{AGENT_ID}
  platforms:
  - unix
  for:
  - python
  - pyc
