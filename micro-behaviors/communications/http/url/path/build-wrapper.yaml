defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  # Gradle (`distributionUrl=` in gradle-wrapper.properties) and Maven
  # (`wrapperUrl=` in maven-wrapper.properties) both point the build wrapper
  # at a remote distribution archive. One atom covers both spellings: the
  # key-name distinction carries no separate claim and no consumer, and the
  # union preserves every firing of the two atoms it replaces. The optional
  # backslash accepts the Gradle-escaped `https\://` as well as the plain
  # `https://` both tools also emit.
  - id: wrapper-remote-url
    desc: Build wrapper URL points at remote host
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^(distributionUrl|wrapperUrl)=https?\\?://[^\r\n]{1,200}'
