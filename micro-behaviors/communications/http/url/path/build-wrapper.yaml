defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: wrapper-distribution-url
    desc: Build wrapper HTTP distribution URL configured
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^distributionUrl=https?\\?://[^\r\n]{1,200}'
  - id: wrapper-bootstrap-url
    desc: Build wrapper HTTP bootstrap URL configured
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^wrapperUrl=https?\\?://[^\r\n]{1,200}'
