defaults:
  platforms: [windows]
  for: [powershell, batch, javascript, text, html]
  size_min: 8
  size_max: 500000000

traits:
  - id: polyfill-chunk-route-reference
    desc: References a polyfill JavaScript chunk route
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '/cdn/chunks/polyfill-[A-Za-z0-9_-]{1,40}\.min\.js\b'
