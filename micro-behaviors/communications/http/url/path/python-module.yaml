defaults:
  platforms: [windows, unix]
  for: [python]
traits:
- id: module-py-url-path
  desc: Absolute URL path to a module.py file
  # Anchored at the literal start: a relative source path such as
  # "ns/pkg/module.py" in a packaging test is not a URL path.
  crit: notable
  conf: 0.9
  if:
    type: literal
    regex: ^(https?://[^/\s]{1,80})?/[A-Za-z0-9_.~/-]{0,80}module\.py$
