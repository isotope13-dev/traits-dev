defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: code-entry-route
    desc: References code-entry tracking API route
    if:
      type: text
      regex: '["''`]/api/code/entered(["''`?])'

  - id: code-record-status-route
    desc: References code-record status API route
    if:
      type: text
      regex: '["''`]/api/code/status/'
