defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  # One matcher for the observation: the former metabase-question and
  # metabase-schema traits were strict subsets of this union and fired
  # alongside it, triple-counting one signal across two ML features.
  - id: database-indexing-endpoints
    desc: Database indexing endpoint paths
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: /indexing/(instance|database|tables|questions)
