defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: database-indexing-endpoints
    desc: Database indexing endpoint paths
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: /indexing/(instance|database|tables|questions)
  - id: metabase-question-indexing-endpoint
    desc: Metabase question indexing path
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      substr: /indexing/questions
  - id: metabase-schema-indexing-endpoints
    desc: Metabase schema indexing paths
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: /indexing/(instance|database|tables)
