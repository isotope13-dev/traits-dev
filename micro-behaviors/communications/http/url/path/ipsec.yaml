defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: ipsec-network-api-path
    desc: References IPsec network configuration API path
    if:
      type: literal
      exclude_docstrings: true
      regex: '/api/v[0-9]+/network/ipsec([?#]|$)'
