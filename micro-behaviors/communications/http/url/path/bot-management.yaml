# Console/dashboard routes for managing chat or agent "bots" as a server-side
# resource. A botnet implant only ever enrols itself and asks for work; a
# management UI issues the full lifecycle verb set against bots it owns, which
# is what separates a bot *operator console* from a bot.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  # A bot can be an ordinary chat or automation resource. The path alone
  # establishes only the HTTP API surface; polling/execution composites add
  # the controller relationship needed to infer botnet intent.
  - id: bot-task-api-path
    desc: Bot task resource API path
    if:
      type: text
      regex: '(?i)/bots?/(actions|tasks|commands)/'

  - id: bot-list-api-path
    desc: Bot list API path
    if:
      type: text
      regex: '(?i)/api/v[0-9]{1,2}/bots?/list\b'
  - id: bot-create-api-path
    desc: Bot create API path
    if:
      type: text
      regex: '(?i)/api/v[0-9]{1,2}/bots?/create\b'
  - id: bot-update-api-path
    desc: Bot update API path
    if:
      type: text
      regex: '(?i)/api/v[0-9]{1,2}/bots?/update\b'
  - id: bot-delete-api-path
    desc: Bot delete API path
    if:
      type: text
      regex: '(?i)/api/v[0-9]{1,2}/bots?/delete\b'

  # Nextcloud's OCS app API: /ocs/v2.php/apps/<app>/api/v<n>/... . The Talk
  # (spreed) app's bot endpoints land on it, so a chat integration that posts
  # messages as a bot reads like `/api/v1/bot/` polling unless the surrounding
  # namespace is recognised. Any OCS app route is a Nextcloud server API.
  - id: nextcloud-ocs-app-api-path
    desc: Nextcloud OCS app API path
    if:
      type: text
      regex: '(?i)/ocs/v[0-9][a-z.]{0,4}/apps/[a-z_-]{2,20}/api/v[0-9]'

composite_rules:
  # Three or more distinct lifecycle verbs on the same `/bot/` resource: a
  # client that can list, create and delete bots administers a fleet from the
  # outside rather than belonging to one.
  - id: bot-resource-crud-api-paths
    desc: Bot management CRUD API paths
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: bot-list-api-path
      - id: bot-create-api-path
      - id: bot-update-api-path
      - id: bot-delete-api-path
