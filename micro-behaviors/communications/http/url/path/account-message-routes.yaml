defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable

traits:
  - id: account-create-route
    desc: Account-creation route fragment
    crit: component
    if:
      type: text
      regex: '/accounts\b'

  - id: account-token-route
    desc: Account-token route fragment
    crit: component
    if:
      type: text
      regex: '/token\b'

  - id: message-list-route
    for: [scripts, source, binaries]
    desc: Message-list route fragment
    crit: component
    if:
      type: text
      regex: '/messages\b'

  - id: message-read-route
    desc: Individual-message route fragment
    crit: component
    if:
      type: text
      substr: /messages/

