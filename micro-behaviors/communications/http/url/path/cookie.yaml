# A cookie-related path says nothing about importing cookies, affiliate abuse,
# or even a request. Loopback probes are legitimate matches at this neutral tier.
defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: ipv4-cookie-path-url
    desc: IPv4 URL with cookie/logco path text
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: 'https?://[0-9.]+/[^"'']{0,80}(logco|cookie)'
      is: valid_ip
      case_insensitive: true
