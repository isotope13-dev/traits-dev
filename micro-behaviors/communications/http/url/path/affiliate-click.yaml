defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: affiliate-click-account-url
    desc: HTTP click.cgi URL carries an account parameter
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'https?://[^"''\s<>]{1,100}/click\.cgi\?account=[^"''\s<>]{1,40}'
