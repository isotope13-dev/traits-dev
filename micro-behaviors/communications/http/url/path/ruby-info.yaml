defaults:
  crit: notable
  conf: 0.8
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  - id: url-path-ruby-info
    desc: URL path /ruby/info
    if:
      type: string_literal
      substr: /ruby/info
  - id: hardcoded-port-31310
    desc: Hardcoded port 31310
    if:
      type: string_literal
      substr: :31310
  - id: url-param-info-base64
    desc: URL info parameter with Base64 encoding
    if:
      type: string_literal
      substr: 'info=#{Base64.encode'
