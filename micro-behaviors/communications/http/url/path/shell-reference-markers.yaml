defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: payload-url-arm-family
  desc: Architecture name after URL authority delimiter
  crit: component
  conf: 0.95
  count_min: 3
  if:
    type: text
    regex: '//arm[567]?\b'
- id: payload-url-mips-family
  desc: Architecture name after URL authority delimiter
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '//(mips64?|mpsl|m68k)\b'
- id: payload-url-x86-family
  desc: Architecture name after URL authority delimiter
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '//(x86_64|i686|x86)\b'
- id: payload-url-misc-iot-family
  desc: Architecture name after URL authority delimiter
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '//(ppc|sparc|sh4|arc)\b'
composite_rules:
- id: external-ip-arch-payload-url-list
  desc: External IP multi-architecture payload URL list
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  any:
  - id: micro-behaviors/communications/http/url/path::payload-url-arm-family
  - id: micro-behaviors/communications/http/url/path::payload-url-mips-family
  - id: micro-behaviors/communications/http/url/path::payload-url-x86-family
  - id: micro-behaviors/communications/http/url/path::payload-url-misc-iot-family
  needs: 3
