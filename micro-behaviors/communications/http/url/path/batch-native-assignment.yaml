defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.94
traits:
  - id: batch-assigned-exe-http-url
    desc: Batch variable stores an HTTP executable URL
    if:
      type: text
      regex: '(?im)^[ \t]*set[ \t]+"?[A-Za-z_][A-Za-z0-9_]{0,50}=https?://[^\s"\r\n]{1,160}\.exe([?#][^\s"\r\n]{0,80})?"?[ \t]*\r?$'
  - id: batch-assigned-dll-http-url
    desc: Batch variable stores an HTTP DLL URL
    if:
      type: text
      regex: '(?im)^[ \t]*set[ \t]+"?[A-Za-z_][A-Za-z0-9_]{0,50}=https?://[^\s"\r\n]{1,160}\.dll([?#][^\s"\r\n]{0,80})?"?[ \t]*\r?$'
