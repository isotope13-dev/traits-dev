defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -clojure, -applescript, -vbs, -beam, -static-lib]
traits:
  - id: empty-semicolon-path-parameter
    desc: URL-shaped path with empty semicolon parameter
    crit: notable
    conf: 0.97
    downgrade:
      any:
        - id: metadata/build/package/recipe/gentoo::gentoo-ebuild-recipe
        # PLUNGER ships this path as an operator-selected F5 exploit payload;
        # identify the behavior without treating the dual-use toolkit as an
        # unexplained parser-bypass artifact.
        - id: well-known/tool/offensive/plunger::framework-source-marker
    if:
      # Matches a URL-shaped /prefix;/protected value rather than ordinary
      # matrix parameters such as /items;color=blue. Quote/backtick and
      # semicolon boundaries may not occur inside either segment; this keeps a
      # minified expression from joining two unrelated JavaScript regexes.
      # The text corpus can contain heuristic decoder output, so restrict path
      # pieces to RFC 3986 unreserved characters and `/` separators. The prefix
      # may still be empty for the direct `/;/protected` wire shape. This
      # rejects regular-expression bodies such as Laravel's `/&...;/i`
      # HTML-entity cleanup while retaining `/api;/protected` path literals.
      #
      # The left boundary is a request method, a quote, or start of line -- not
      # bare whitespace. A lone space accepted any two adjacent JavaScript
      # regex literals, which is how the unreserved-character rule above still
      # let node-addon-api's `tools/conversion.js` through: its Nan-to-N-API
      # rewrite table is 60 lines of ` /.../g, '...'` pairs, and the trailing
      # `g` flag satisfies "starts with an unreserved character". `=` is
      # excluded for the same reason the Lua and Autoconf carve-outs below
      # exist: a semicolon-separated list of `old=>new` path
      # rewrite rules is configuration, not a request path (Go's
      # cmd/internal/objabi/line_test.go asserts on `"/d/f=>/h;/d/e=>/i"`).
      #
      # Start-of-line dropped from the boundary, and `:` excluded from both
      # segments. An extracted binary string begins wherever the string table
      # does, so `^` let raw byte noise qualify: Wine's D3D shader tables yield
      # `/lnetovv:;/lnes` in 34 members. A real request line still matches
      # through the method branch, and a literal through the quote branch.
      type: text
      regex: '(["''`]|[A-Z]{3,9}[ \t])/([\w./~-]+)?;/[\w./~-]+(["''`\s?#]|$)'
    unless:
      # A path canonicaliser proves it defuses this shape: OpenShell l7/path.rs asserts canon("/public/..;/secret") == "/secret".
      - id: metadata/package/testing/
      # Lua's package.path deliberately separates `?.lua` search templates
      # with semicolons; those are not HTTP matrix/path parameters.
      - type: text
        regex: '\?/?(\.lua|init\.lua);/'
      - id: well-known/lib/ui/cytoscape::cytoscape-stylesheet-runtime-marker
      # Autoconf and Libtool use semicolon-separated PATH values; `/bin;/bin`
      # is shell configuration, not an HTTP matrix parameter.
      - id: metadata/build/autotools::autotools-config-basename
      - id: metadata/build/autotools::libtool-generated-script
      - type: text
        regex: 'PATH=[''"]/bin;/bin[''"]'

      - id: "metadata/file/naming::test-directory-component"
