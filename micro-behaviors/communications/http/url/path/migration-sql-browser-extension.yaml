# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: generate-query-path-fragment
  desc: Path fragment /generate-query
  conf: 0.9
  if:
    type: text
    substr: /generate-query
- id: ai-debug-sql-endpoint
  desc: AI SQL debug endpoint
  conf: 0.9
  if:
    type: text
    substr: /debug-sql
- id: explain-path-fragment
  desc: Explain route path fragment
  conf: 0.86
  if:
    type: text
    substr: /explain
- id: ai-comment-sql-endpoint
  desc: AI SQL comment endpoint
  conf: 0.86
  if:
    type: text
    substr: /add-comments
composite_rules:
- id: ai-sql-generation-api-client
  desc: SQL generation and explanation route set
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/url/path::generate-query-path-fragment
  - id: micro-behaviors/communications/http/url/path::ai-debug-sql-endpoint
  any:
  - id: micro-behaviors/communications/http/url/path::explain-path-fragment
  - id: micro-behaviors/communications/http/url/path::ai-comment-sql-endpoint
