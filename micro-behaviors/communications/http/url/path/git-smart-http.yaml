# Git's smart-HTTP transport paths. These are protocol constants from git's own
# specification: any client, server, proxy or mirror that speaks git over HTTP
# names them, and a module that lists them alongside `/info/refs` is describing
# the transport, not attacking it.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable

traits:
  # Relocated from objectives/lateral-movement/exploit/git-hosting, where the
  # bare path sat at `notable` inside an exploit directory. The auth-confusion
  # attack that directory documents is the *rewrite* — receive-pack routed so
  # the auth middleware sees upload-pack — and the composite there still states
  # it by pairing this path with the rewrite and service-query legs. On its own
  # the constant only says "this code speaks git smart HTTP".
  - id: git-smart-http-receive-pack
    desc: Git smart-HTTP receive-pack path
    conf: 0.94
    if:
      type: text
      regex: '(?i)/git-receive-pack\b'
