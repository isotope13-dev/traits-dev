defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  conf: 0.94

traits:
  - id: vite-fs-route-reference
    desc: References Vite filesystem HTTP route
    crit: notable
    if:
      type: literal
      kind: string
      substr: /@fs/

  - id: vite-fs-raw-bypass-query
    desc: Vite filesystem URL uses raw bypass
    crit: suspicious
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?\s"'']{0,300}\?(raw(\?\?)?|raw\?import)$'

  - id: vite-fs-import-bypass-query
    desc: Vite filesystem URL uses import bypass
    crit: suspicious
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?\s"'']{0,300}\?(import&(raw(\?\?)?|url&inline)|inline&import)$'

  - id: vite-fs-double-encoded-traversal
    desc: Vite route uses double-encoded traversal
    crit: suspicious
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/(\.\.%25(2f|5c)){2,}'

composite_rules:
  - id: vite-fs-bypass-query-catalog
    desc: Constructs multiple Vite bypass queries
    crit: suspicious
    all:
      - id: vite-fs-route-reference
    needs: 2
    any:
      - id: vite-fs-raw-bypass-query
      - id: vite-fs-import-bypass-query
