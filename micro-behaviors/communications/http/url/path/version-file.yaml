# A URL whose path names a version file — `version.txt`, `latest.json`,
# `myapp_version.txt`. The word is matched anywhere in the final filename, not
# just at its start: publishers name these after the product
# (`cppplaygound_version.txt`), and anchoring on the segment start missed every
# one of them. Neutral: this is how installers, CLIs and update daemons have
# always published "what is current", and fetching one says nothing on its own.
#
# It earns a place in triage because it is the endpoint shape of an update
# channel, and which channel a shipped artifact consults is a supply-chain
# question. Objective composites pair it with who is asking.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  conf: 0.85

traits:
  - id: version-manifest-url
    desc: Fetches a bare version manifest URL
    crit: notable
    if:
      type: text
      regex: 'https?://[^"''\s]{4,90}(version|latest)[a-z_.-]{0,10}\.(txt|json)'
