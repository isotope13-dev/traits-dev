traits:
- platforms:
  - windows
  for:
  - pe
  - javascript
  id: api-update-path-reference
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: References the /api/update URL path
  conf: 0.94
  if:
    type: text
    regex: (/|%2f)api(/|%2f)update\b
- platforms:
  - unix
  - windows
  for:
  - html
  id: html-loopback-host-reference
  desc: HTML references a loopback HTTP(S) URL
  conf: 0.9
  if:
    type: text
    regex: (?i)https?://(127\.0\.0\.1|localhost|0\.0\.0\.0)(:\d+)?/
defaults:
  crit: notable
