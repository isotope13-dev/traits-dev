traits:
- platforms:
  - windows
  for:
  - pe
  - javascript
  id: api-update-path-reference
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: References the /api/update URL path
  conf: 0.94
  if:
    type: text
    regex: (/|%2f)api(/|%2f)update\b
- platforms:
  - unix
  - windows
  for:
  - html
  id: html-loopback-host-reference
  desc: HTML references a loopback HTTP(S) URL
  conf: 0.9
  if:
    type: text
    regex: (?i)https?://(127\.0\.0\.1|localhost|0\.0\.0\.0)(:\d+)?/
# Bare API paths are neutral transport facts, not loader identity: any web
# dashboard serves /api/status. Objective composites reference these legs
# alongside their intent-specific evidence.
- platforms:
  - windows
  for:
  - pe
  - javascript
  id: api-report-path-reference
  desc: References the /api/report URL path
  conf: 0.94
  if:
    type: text
    regex: (/|%2f)api(/|%2f)report\b
- platforms:
  - windows
  for:
  - pe
  - javascript
  id: api-status-path-reference
  unless:
  - id: well-known/tool/development/agent/agent-relay::agent-relay-harness-package
  - id: well-known/lib/ai/lmcache::wheel-member-context
  desc: References the /api/status URL path
  conf: 0.94
  if:
    type: text
    regex: (/|%2f)api(/|%2f)status\b
defaults:
  crit: notable
