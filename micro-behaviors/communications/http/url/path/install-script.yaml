defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, python, ruby, go, rust]
  crit: notable
  conf: 0.86

traits:
  - id: remote-install-sh-url-reference
    desc: References remote install.sh script URL
    if:
      type: text
      regex: 'https?://[^''"\s]{0,240}/install\.sh\b'
