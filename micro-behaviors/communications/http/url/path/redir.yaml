defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: redir-path-url
  desc: HTTP URL has a dotted redir path
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    regex: 'https?://[^\s"'']{0,80}\bredir\.[a-z]{2,6}\b'
    case_insensitive: true
  unless:
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
