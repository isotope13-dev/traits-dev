# Neutral route reference, retaining the existing context filters and scope.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: bot-api-versioned-path
    desc: References a versioned bot API path
    crit: notable
    conf: 0.9
    if:
      # A bot resource can serve notifications, automation or tasking.
      # This path alone proves no polling, fleet membership or execution.
      type: text
      regex: '(?i)/api/v[0-9]{1,2}/bots?/'
    unless:
      # Recognized benign bot-API contexts: an operator console managing the
      # fleet it owns, chat-platform bot endpoints, a distributed test-runner
      # API, a service's own swagger-documented bot routes, ops tooling
      # joined to its configured domain, and a versioned bots chat-completions
      # route (an LLM inference API, not a controller namespace).
      - id: micro-behaviors/communications/http/url/path::known-bot-api-context
      # A first-party product API where bot is one resource among several
      # (apps, skills, marketplace) is the vendor's own backend surface,
      # not a controller namespace.
      - type: text
        regex: '(?i)/api/v[0-9]{1,2}/(apps|skills|marketplace)/'
      # Discord bot-listing stats posters (server_count/guildCount beside
      # the listing routes) report to a listing service, not a controller.
      # A listing counter is context for stats-posting clients.
      - type: text
        regex: '(?i)\b(server_count|serverCount|guildCount)\b'
      - id: metadata/package/testing/presence/harness::test-directory
      - type: basename
        regex: '(?i)^sdk\.gen\.ts$'

composite_rules:
  # Referenced from bot-api-versioned-path's unless: recognized contexts
  # where /api/v*/bot*/ routes are benign.
  - id: known-bot-api-context
    desc: Recognized benign bot-API client contexts
    crit: exception
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/url/path::bot-resource-crud-api-paths
      - id: micro-behaviors/communications/http/url/path::nextcloud-ocs-app-api-path
      - id: micro-behaviors/communications/http/url/path::nextcloud-spreed-frontend-api-path
      - id: micro-behaviors/communications/http/url/path::swarming-bot-api-path
      - id: micro-behaviors/communications/http/llm::versioned-bot-chat-completions-path
      - id: metadata/lang/source/syntax/directive::documented-versioned-bot-route
      - id: micro-behaviors/communications/http/url/build::configurable-domain-bot-path

