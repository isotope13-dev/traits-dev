defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift, zig, elf]
traits:
- id: netscaler-collect-route-reference
  desc: References netscaler collect route reference
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'netscaler[\s\S]{0,220}/collect'

- id: exfil-api-agent-route-context
  desc: References exfil api agent route context
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '/api/v1/exfil[\s\S]{0,120}(AgentId|netscaler|NetScaler)'

