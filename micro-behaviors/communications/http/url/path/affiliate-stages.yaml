# Affiliate cloaker / relay stage paths used by dropcatch traffic scavengers
# (e.g. Swiping Squirrel): fingerprint POST → /s/index/ → /f/index relay.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php]
  crit: notable
  conf: 0.94

traits:
  - id: affiliate-cloak-stage-path
    desc: Affiliate cloaker stage path /s/index
    if:
      type: text
      regex: '(?i)/s/index(/|\b|[?"''#])'

  - id: affiliate-relay-stage-path
    desc: Affiliate relay stage path /f/index
    if:
      type: text
      regex: '(?i)/f/index(/|\b|[?"''#])'

  - id: affiliate-cloak-fw-field
    desc: Reads cloaker forward fw field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(\.\s*fw\b|\[[''"]fw[''"]\])'
