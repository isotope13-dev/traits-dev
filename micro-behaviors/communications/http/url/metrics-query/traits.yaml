# Metrics query labels record endpoint parameters only.  They do not establish
# that the named data was collected, that a request ran, or that the endpoint
# belongs to malware.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.94

traits:
  - id: init-event-id-data-query
    desc: Init query has encoded ID and data
    if:
      type: text
      regex: '(?i)[?&]event=init&id=[A-Za-z0-9+/]{4,}={0,2}&data='

  - id: stage-event-query-parameter
    desc: Query carries an event=stage parameter
    if:
      type: text
      regex: '(?i)[?&]event=stage&stage='
  - id: credential-category-stage-value
    desc: Stage query names the credentials category
    conf: 0.9
    if:
      type: text
      regex: '(?i)[?&]stage=credentials\b'
  - id: browser-category-stage-value
    desc: Stage query names the browsers category
    conf: 0.9
    if:
      type: text
      regex: '(?i)[?&]stage=browsers\b'
  - id: wallet-category-stage-value
    desc: Stage query names the wallets category
    conf: 0.9
    if:
      type: text
      regex: '(?i)[?&]stage=wallets\b'
  - id: messenger-category-stage-value
    desc: Stage query names the messengers category
    conf: 0.9
    if:
      type: text
      regex: '(?i)[?&]stage=messengers\b'

composite_rules:
  - id: metrics-pasted-event-marker
    desc: HTTP metrics request includes an event=pasted query parameter
    crit: notable
    conf: 0.97
    near_bytes: 240
    all:
      - id: micro-behaviors/communications/http/url/path::metrics-run-api-path
      - id: micro-behaviors/communications/http/url/query::pasted-event-query
    any:
      - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
      - id: micro-behaviors/communications/http/curl::curl-silent

  - id: metrics-sensitive-stage-query-labels
    desc: Metrics endpoint includes three or more named data-stage labels
    crit: notable
    conf: 0.94
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/url/path::metrics-run-api-path
      - id: stage-event-query-parameter
    any:
      - id: credential-category-stage-value
      - id: browser-category-stage-value
      - id: wallet-category-stage-value
      - id: messenger-category-stage-value
    needs: 3
