defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  crit: notable
  conf: 0.9

traits:
  - id: image-beacon-status-url
    desc: Image path carries operational status query
    conf: 0.86
    for: [scripts, source, text, html]
    if:
      type: text
      regex: '(?i)\.(gif|png|bmp|jpe?g)\?([^"''\s]{0,20}&)?(m|s|c|id|cmd|ctx|stage|status)='



composite_rules:
  - id: tracking-pixel-status-url
    desc: Image pixel carries status query
    crit: notable
    all:
      - id: micro-behaviors/communications/http/url/telemetry::tracking-pixel-path
      - id: micro-behaviors/communications/url/query/selection::tracking-pixel-status-query
    near_bytes: 120
