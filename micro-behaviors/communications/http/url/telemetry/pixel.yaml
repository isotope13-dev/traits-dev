defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.9
traits:
  - id: tracking-pixel-route
    desc: References the /t/pixel.gif HTTP route
    for: [powershell, batch, javascript, text, html]
    platforms: [windows]
    conf: 0.98
    if:
      type: text
      substr: /t/pixel.gif
  - id: tracking-pixel-path
    desc: Image-tracking pixel request path
    if:
      type: text
      regex: '(?i)/(t/)?pixel\.gif\?'
