defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.9
traits:
  - id: tracking-pixel-path
    desc: Image-tracking pixel request path
    if:
      type: text
      regex: '(?i)/(t/)?pixel\.gif\?'
  - id: tracking-pixel-status-query
    desc: Tracking pixel status parameter fragment
    crit: component
    if:
      type: text
      regex: '(?i)\?(m|s|status)='
  # Generalized image-beacon shape, independent of the exact `pixel.gif` name.
  # An HTTP(S) request for an image resource (.gif/.png/.bmp/.jpg) whose query
  # string carries a short operational parameter (stage/status/id/command).
  # Benign tracking and analytics pixels have this shape too, so this stays
  # notable on its own; the covert-channel verdict comes from a composite that
  # adds a non-analytics signal (a raw-IP host, below). The point is to catch
  # the next stager that renames pixel.gif to beacon.gif or p.png without
  # changing what it is doing.
  # Scheme-optional on purpose: stagers routinely build the URL from a base
  # variable ("$c2/t/pixel.gif?...") so the http(s):// lives in a separate
  # literal. Match the image-resource request path plus the operational query
  # parameter, which is the part that stays together.
  - id: image-beacon-status-url
    desc: Image path carries operational status query
    conf: 0.86
    for: [scripts, source, text, html]
    if:
      type: text
      regex: '(?i)\.(gif|png|bmp|jpe?g)\?([^"''\s]{0,20}&)?(m|s|c|id|cmd|ctx|stage|status)='
composite_rules:
  - id: tracking-pixel-status-url
    desc: Image pixel carries status query
    crit: notable
    all:
      - id: tracking-pixel-path
      - id: tracking-pixel-status-query
    near_bytes: 120
