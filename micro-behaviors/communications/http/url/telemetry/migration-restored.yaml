# Completes the existing consumer relocations; source matchers are from HEAD^.
defaults:
  crit: notable
traits:
- for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  conf: 0.98
  id: otlp-trace-endpoint-reference
  desc: References OTLP trace URL path
  if:
    type: literal
    substr: /v1/traces
- for:
  - elf
  - macho
  - pe
  - go
  - shell
  platforms:
  - linux
  - macos
  - windows
  id: provider-grpc-metrics-download-url
  desc: Provider gRPC schema metrics URL
  conf: 0.97
  if:
    type: text
    regex: https?://[A-Za-z0-9.-]{3,120}/plugins/grpc/v[0-9]+/schema/metrics/
