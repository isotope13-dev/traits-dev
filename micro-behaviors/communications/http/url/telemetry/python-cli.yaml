# Remote-operator CLI callback paths (`/api/cli/*`). Distinct from generic
# telemetry ingest routes; paired with host registration or folder upload in
# objectives composites.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-cli-init-api-path
    desc: Python REST path for remote CLI init
    if:
      type: text
      substr: "/api/cli/init"
  - id: python-cli-upload-api-path
    desc: Python REST path for remote CLI upload
    if:
      type: text
      substr: "/api/cli/upload"
