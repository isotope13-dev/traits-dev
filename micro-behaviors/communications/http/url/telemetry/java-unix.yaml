defaults:
  platforms: [unix]
  for: [java, class, jar]
  attack: T1041

traits:
  - id: java-collect-upload-path
    desc: "Collection API path bytes"
    crit: suspicious
    conf: 0.94
    for: [java, class]
    if:
      type: hex
      # Byte-anchor the terminator (quote/slash/query/null/newline) so this
      # doesn't also match "/api/v1/collections" (0x69 'i' next) -- a real
      # Mastodon REST endpoint whose spec files raw-byte-scanned as a hit
      # against the whole archive, since hex patterns scan container bytes
      # irrespective of the java/class `for:` restriction.
      pattern: 2F 61 70 69 2F 76 31 2F 63 6F 6C 6C 65 63 74 (22|27|2F|3F|00|0A|0D)
  - id: java-collect-chunk-parameter
    desc: "Collection chunk parameter with URL encoding"
    crit: suspicious
    conf: 0.92
    for: [java, class]
    if:
      type: text
      regex: 'collect\?chunk=[\s\S]{0,180}URLEncoder\.encode'
