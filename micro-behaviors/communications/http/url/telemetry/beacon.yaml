defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source, pe, dll, elf, macho]
  crit: component
  conf: 0.86
traits:
- id: beacon-path-token
  crit: notable
  desc: HTTP beacon endpoint path token
  if:
    type: text
    substr: /beacon

- id: install-status-endpoint-token
  desc: Install-status endpoint token
  crit: notable
  conf: 0.86
  for: [javascript, typescript]
  if:
    type: string_literal
    substr: set-install-status
