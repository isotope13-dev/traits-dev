defaults:
  platforms: [windows, unix]
  for: [scripts, html]
composite_rules:
  - id: task-control-list-path-clues
    for: [python, javascript, html]
    desc: Task-control and task-list paths
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/telemetry::task-list-api-path
      - id: micro-behaviors/communications/http/url/telemetry::task-control-api-paths
    any:
      - id: micro-behaviors/communications/http/url/telemetry::oss-config-api-path
