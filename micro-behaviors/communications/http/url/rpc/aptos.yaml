# Public Aptos JSON-RPC fullnode. Relocated from
# objectives/command-and-control/infrastructure/blockchain/multi-chain/, where a
# bare provider hostname was filed as C2 infrastructure: the matcher recognizes
# Aptos Labs' public mainnet fullnode and nothing about how it is used. Wallets,
# explorers and dApp SDKs embed the same host. Objectives that mean "this host is
# a dead drop" reference this atom and supply the payload-retrieval evidence.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.82

traits:
- id: aptos-fullnode-provider
  desc: Aptos fullnode mainnet endpoint
  if:
    type: string_literal
    substr: fullnode.mainnet.aptoslabs.com
