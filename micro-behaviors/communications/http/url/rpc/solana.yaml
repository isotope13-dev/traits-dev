defaults:
  platforms:
    - unix
    - windows
  # Solana RPC is also a common dead-drop surface for JavaScript package
  # loaders.  Keep the existing script/binary coverage and include source
  # forms so obfuscated npm hooks cannot hide behind split string literals.
  for: [scripts, binaries, javascript, typescript]
  crit: notable
traits:
  - id: solana-rpc-url
    desc: Solana RPC endpoint
    conf: 0.9
    if:
      type: string_literal
      regex: api\.(mainnet-beta|devnet|testnet)\.solana\.com
  - id: solana-rpc-method
    desc: Solana JSON-RPC method (signature/account)
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: ^get(SignaturesForAddress|SignFAddress|AccountInfo)$
  - id: solana-rpc-method-2
    desc: Solana JSON-RPC method (balance/tx/blockhash)
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: ^get(Balance|Transaction|LatestBlockhash)$
  # Field names of a Solana getParsedTransaction / getTransaction RPC
  # response. Individually common in web3.js; together they identify code
  # that parses full parsed-transaction payloads (Go struct tags
  # `json:"accountKeys"` survive into a compiled binary's strings, and the
  # bare identifiers appear in JS).
  - id: solana-tx-account-keys-field
    desc: Solana transaction accountKeys field
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: accountKeys
  - id: solana-tx-inner-instructions-field
    desc: Solana transaction innerInstructions field
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: innerInstructions
  - id: solana-tx-program-id-field
    desc: Solana transaction programId field
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: programId
  - id: solana-tx-log-messages-field
    desc: Solana transaction logMessages field
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: logMessages
  # Memo program IDs used when a loader reads a Base64 C2 pointer out of a
  # transaction memo instruction (GlassWorm-class Solana dead drops).
  - id: solana-memo-program-id
    desc: Solana Memo program address
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '^Memo(Sq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr|1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo)$'
  - id: solana-memo-program-id-check
    desc: Checks instruction programId for Memo
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(programId|program_id).{0,80}Memo|Memo.{0,80}(programId|program_id)'
  - id: solana-jsonparsed-encoding
    desc: Solana jsonParsed transaction encoding
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '["'']encoding["'']\s*:\s*["'']jsonParsed["'']'
  - id: solana-get-signatures-for-address
    desc: Solana getSignaturesForAddress RPC method
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      exact: getSignaturesForAddress
  - id: solana-get-transaction
    desc: Solana getTransaction RPC method
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      exact: getTransaction
  # Obfuscated loaders often split the provider and method strings across
  # concatenated literals.  These are deliberately components: the hostile
  # conclusion below requires the complete RPC/decode/install-hook shape.
  - id: solana-rpc-host-fragment
    desc: Obfuscated Solana RPC host fragment
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)(lana-rpc\.(p|com)|ocket\.network)'
  - id: solana-signature-method-fragment
    desc: Obfuscated Solana signature method fragment
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)getSignatu'
  - id: solana-transaction-method-fragment
    desc: Obfuscated Solana transaction method fragment
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)\.getblock\.'
composite_rules:
  - id: solana-wallet-rpc-observation
    desc: Queries Solana account or signature RPC data
    crit: notable
    conf: 0.9
    all:
      - id: solana-rpc-method
      - id: solana-rpc-url
  - id: solana-rpc-method-any
    desc: Solana JSON-RPC method
    crit: component
    any:
      - id: solana-rpc-method
      - id: solana-rpc-method-2
      - id: solana-get-signatures-for-address
      - id: solana-get-transaction
  - id: solana-parsed-transaction-schema
    desc: Parses Solana parsed-transaction schema
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: solana-tx-account-keys-field
      - id: solana-tx-inner-instructions-field
      - id: solana-tx-program-id-field
      - id: solana-tx-log-messages-field
  - id: solana-memo-instruction-parse
    desc: Parses Solana Memo program instruction
    crit: notable
    conf: 0.93
    any:
      - id: solana-memo-program-id
      - id: solana-memo-program-id-check
  - id: solana-signature-then-transaction
    desc: Fetches Solana signature then full transaction
    crit: notable
    conf: 0.94
    near_lines: 40
    all:
      - id: solana-get-signatures-for-address
      - id: solana-get-transaction
      - id: solana-rpc-url

  - id: solana-obfuscated-signature-dead-drop
    desc: Obfuscated Solana signature and transaction dead drop
    crit: suspicious
    conf: 0.96
    attack: T1102
    near_bytes: 12000
    all:
      - id: solana-rpc-host-fragment
      - id: solana-signature-method-fragment
      - id: solana-transaction-method-fragment
