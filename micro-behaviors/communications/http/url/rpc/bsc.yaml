# Public Binance Smart Chain JSON-RPC providers. These hosts are neutral
# infrastructure; objectives combine them with contract reads or execution.
defaults:
  platforms: [unix, windows]
  for: [pe, dll, csharp, binaries, scripts, source]
  crit: notable
  conf: 0.9

traits:
- id: bsc-bnbchain-provider
  desc: BNB Chain public JSON-RPC provider
  if:
    type: text
    substr: bnbchain.org
- id: bsc-subdomain-provider
  desc: BSC subdomain JSON-RPC provider
  conf: 0.88
  if:
    type: text
    regex: '(?i)https?://bsc\.[a-z0-9.-]{3,40}\.(org|io|xyz|com)\b'
- id: bsc-dataseed-provider
  desc: BSC dataseed JSON-RPC provider
  if:
    type: text
    regex: '(?i)https?://bsc-dataseed[a-z0-9.-]{0,40}\.(org|io|com)\b'
# Relocated from objectives/command-and-control/infrastructure/blockchain/, where
# a provider hostname was filed as C2 infrastructure. `bsc-dataseed-provider`
# above needs an explicit scheme, so these keep the bare-host spellings.
- id: bsc-publicnode-provider
  desc: BSC PublicNode JSON-RPC provider
  conf: 0.82
  if:
    type: string_literal
    substr: bsc-rpc.publicnode.com
- id: bsc-defibit-provider
  desc: BSC defibit JSON-RPC provider
  conf: 0.83
  if:
    type: text
    substr: bsc-dataseed1.defibit.io
- id: bsc-testnet-public-rpc
  desc: BSC testnet public JSON-RPC host
  if:
    type: text
    regex: '(?i)bsc-testnet[a-z0-9.-]*\.(publicnode\.com|drpc\.org|bnbchain\.org)'

composite_rules:
- id: bsc-public-rpc-provider
  desc: Binance Smart Chain public RPC provider
  conf: 0.88
  any:
  - id: bsc-bnbchain-provider
  - id: bsc-subdomain-provider
  - id: bsc-dataseed-provider
  - id: bsc-publicnode-provider
  - id: bsc-defibit-provider
  - id: bsc-testnet-public-rpc
