defaults:
  platforms: [unix, windows]
  for: [go, scripts, source]
traits:
- id: eth-call-method-field
  desc: JSON-RPC eth_call method field
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)["'']?method["'']?\s*(:|=>)\s*["'']eth_call["'']'
- id: eth-call-method-literal
  desc: Ethereum eth_call method literal
  crit: notable
  conf: 0.94
  if:
    type: string_literal
    regex: '(?i)^eth_call$'
- id: eth-get-logs-method-literal
  desc: Ethereum eth_getLogs method literal
  crit: notable
  conf: 0.94
  for: [python, javascript, typescript, go, scripts, source]
  if:
    type: string_literal
    regex: '(?i)^eth_getLogs$'
- id: eth-get-logs-method-field
  desc: JSON-RPC eth_getLogs method field
  crit: notable
  conf: 0.9
  for: [python, javascript, typescript, go, scripts, source]
  if:
    type: text
    regex: '(?i)["'']?method["'']?\s*(:|=>)\s*["'']eth_getLogs["'']'
- id: eth-get-storage-at-method-field
  desc: JSON-RPC eth_getStorageAt method field
  crit: notable
  conf: 0.96
  for: [binaries, scripts, source]
  if:
    type: text
    regex: '(?i)\\?["'']?method\\?["'']?\s*(:|=>)\s*\\?["'']eth_getStorageAt\\?["'']'
- id: eth-get-storage-at-method-literal
  desc: Ethereum eth_getStorageAt method literal
  crit: notable
  conf: 0.96
  for: [binaries, scripts, source]
  if:
    type: string_literal
    regex: '(?i)^eth_getStorageAt$'
- id: eth-call-binary-method-literal
  desc: Compiled artifact contains eth_call method
  crit: notable
  conf: 0.9
  for: [binaries]
  if:
    type: text
    exact: eth_call
- id: eth-call-contract-address
  desc: Ethereum call contract target
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '(?i)["'']?to["'']?\s*[:=]\s*["'']?0x[a-f0-9]{40}'
- id: ethereum-call-result-processing
  desc: Processes an Ethereum eth_call result
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?is)eth_call.{0,220}\b(result|response)\b'
- id: ethereum-binary-eth-call-request
  desc: Native Ethereum eth_call request
  crit: notable
  conf: 0.98
  for: [elf, pe, macho]
  if:
    type: text
    substr: '{"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":"'
- id: ethereum-binary-result-hex-parser
  desc: Native hexadecimal JSON-RPC result parser
  crit: notable
  conf: 0.96
  for: [elf, pe, macho]
  if:
    type: text
    exact: '"result":"0x'
# Public Ethereum JSON-RPC endpoint hostnames. Each is a neutral reference to
# a real, widely used provider -- a wallet, an indexer or a dApp bundle carries
# one or two of these legitimately, which is why they stay notable.
#
# `type: text` rather than `string_literal`: a compiled implant carries the
# same endpoint list in its string table, where there is no parser to attribute
# a literal to. `for:` therefore includes `binaries` on these host atoms only;
# the JSON-shaped `eth_call` atoms above stay on source, where their syntax
# exists.
- id: ethereum-llamarpc-provider
  desc: LlamaRPC Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: eth.llamarpc.com
- id: ethereum-getblock-provider
  desc: GetBlock Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: go.getblock.io
- id: ethereum-nodereal-provider
  desc: NodeReal Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: eth-mainnet.nodereal.io
- id: ethereum-publicnode-provider
  desc: PublicNode Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: ethereum.publicnode.com
- id: ethereum-ankr-provider
  desc: Ankr Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: rpc.ankr.com/eth
- id: ethereum-blastapi-provider
  desc: BlastAPI Ethereum JSON-RPC provider
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  if:
    type: text
    substr: eth-mainnet.public.blastapi.io
- id: ethereum-blastapi-provider-unicode
  desc: Unicode-escaped BlastAPI RPC provider
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: encoded
    encoding: unicode-escape
    substr: eth-mainnet.public.blastapi.io
- id: ethereum-drpc-provider
  desc: dRPC Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: eth.drpc.org
# Obfuscator string tables often split `https://eth.drpc.org` into
# `https://et` + `h.drpc.org`. The trailing host fragment is distinctive.
- id: ethereum-drpc-host-fragment
  desc: Split dRPC Ethereum host fragment
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  if:
    type: text
    substr: h.drpc.org
- id: ethereum-cloudflare-provider
  desc: Cloudflare Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: cloudflare-eth.com
- id: ethereum-1rpc-provider
  desc: 1RPC Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: 1rpc.io/eth
# Split form of `https://1rpc.io/eth` (`https://1r` + `pc.io/eth`).
- id: ethereum-1rpc-path-fragment
  desc: Split 1RPC Ethereum path fragment
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  if:
    type: text
    substr: pc.io/eth
- id: ethereum-mevblocker-provider
  desc: MEV Blocker Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: rpc.mevblocker.io
- id: ethereum-meowrpc-provider
  desc: MeowRPC Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: eth.meowrpc.com
- id: ethereum-blockpi-provider
  desc: BlockPi Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    substr: ethereum.blockpi.network/public
- id: ethereum-blxrbdn-provider
  desc: bloXroute Ethereum JSON-RPC provider
  crit: notable
  conf: 0.88
  for: [scripts, source, binaries]
  if:
    type: text
    regex: '(?i)(singapore|uk|virginia)\.rpc\.blxrbdn\.com'
composite_rules:
- id: eth-get-storage-at-method
  desc: Ethereum contract-storage JSON-RPC read
  crit: notable
  conf: 0.96
  for: [binaries, scripts, source]
  any:
    - id: eth-get-storage-at-method-field
    - id: eth-get-storage-at-method-literal
# Four or more unrelated providers hardcoded together is a failover pool: the
# caller wants the read to succeed even when individual endpoints rate-limit,
# block it, or disappear. Wallets and chain-list libraries do ship such pools,
# so this stays neutral on its own -- the objectives that consume it supply the
# reason the pool is there.
- id: ethereum-public-rpc-provider-pool
  desc: Failover pool of public Ethereum RPC endpoints
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  needs: 4
  any:
  - id: ethereum-llamarpc-provider
  - id: ethereum-getblock-provider
  - id: ethereum-nodereal-provider
  - id: ethereum-publicnode-provider
  - id: ethereum-ankr-provider
  - id: ethereum-blastapi-provider
  - id: ethereum-blastapi-provider-unicode
  - id: ethereum-drpc-provider
  - id: ethereum-cloudflare-provider
  - id: ethereum-1rpc-provider
  - id: ethereum-mevblocker-provider
  - id: ethereum-meowrpc-provider
  - id: ethereum-blockpi-provider
  - id: ethereum-blxrbdn-provider
