defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, php]
traits:
- id: eth-call-method-field
  desc: JSON-RPC eth_call method field
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)["'']?method["'']?\s*(:|=>)\s*["'']eth_call["'']'
- id: eth-call-contract-address
  desc: Ethereum contract address literal
  crit: component
  conf: 0.86
  if:
    type: literal
    regex: '^0x[a-fA-F0-9]{40}$'
