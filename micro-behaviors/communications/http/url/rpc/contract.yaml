# Contract lookup mechanics do not establish attacker control or theft.
# These composites describe co-occurrence, not proven source-to-sink flow.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: eth-call-fetch-hex-decode
    desc: Ethereum RPC fields near fetch and hex decoding
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 2048
    all:
    - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
    - id: micro-behaviors/communications/http/url/rpc::ethereum-public-rpc-host
    - id: micro-behaviors/data/format/crypto-address::ethereum-address-literal
    - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
    - id: micro-behaviors/communications/http/request/client::js-fetch-call
