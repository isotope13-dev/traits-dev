defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
traits:
- id: polygon-lava-build-encoded
  desc: Encoded Polygon lava endpoint
  crit: suspicious
  conf: 0.92
  for:
  - html
  - javascript
  - typescript
  if:
    type: encoded
    encoding: xor
    substr: polygon.lava.build
