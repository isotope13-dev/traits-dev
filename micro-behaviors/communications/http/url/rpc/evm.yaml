# Neutral EVM RPC fields, including compiled and escaped spellings.
defaults:
  platforms: [windows, unix]
  for: [binaries, python, php, javascript, typescript, c, cpp, csharp]

traits:
- id: evm-eth-call-method
  desc: EVM eth_call method field
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \\?["']?method\\?["']?\s*(:|=>)\s*\\?["']eth_call\\?["']
- id: evm-literal-contract-address-field
  desc: EVM literal contract address field
  crit: notable
  conf: 0.9
  unless:
    - id: well-known/lib/crypto/ethjs-format::ethjs-format-library
    - id: well-known/lib/crypto/ethjs-contract::ethjs-contract-library
    - id: well-known/lib/crypto/metamask-core::metamask-core-library
  if:
    type: text
    regex: (?i)["']to["']\s*(:|=>)\s*["']0x[a-f0-9]{40}["']
