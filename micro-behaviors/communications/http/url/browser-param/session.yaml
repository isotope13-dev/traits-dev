defaults:
  crit: notable
  platforms: [windows, unix]
  for: [html, javascript]

traits:
  - id: session-named-query-parameter
    desc: URL carries session-named query parameter
    conf: 0.88
    if:
      type: text
      regex: '[?&](sid|sessionid|session_id)=[A-Za-z0-9\-_]{8,64}'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
