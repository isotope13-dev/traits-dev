defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: parameter-manipulation-searchparams
    desc: Modifies tracked URL parameters
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'searchParams\.(set|append)\(\s*[''"](tag|affiliate|ref)[''"]'
  - id: parameter-manipulation-params
    desc: Modifies tracked URL parameters
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'params\.(set|append)\(\s*[''"](tag|affiliate|ref)[''"]'

composite_rules:
  - id: tracked-url-parameter-mutation
    desc: Mutates a tracked URL parameter
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/communications/http/url/query::query-parameter-mutation
    any:
      - id: parameter-manipulation-searchparams
      - id: parameter-manipulation-params
    near_bytes: 120
