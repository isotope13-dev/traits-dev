defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: parameter-manipulation-searchparams
    desc: Modifies tracked URL parameters
    conf: 0.9
    if:
      type: text
      regex: 'searchParams\.(set|append)\(\s*[''"](tag|affiliate|ref)[''"]'
  - id: parameter-manipulation-params
    desc: Modifies tracked URL parameters
    conf: 0.9
    if:
      type: text
      regex: 'params\.(set|append)\(\s*[''"](tag|affiliate|ref)[''"]'
  # Per-victim session tracking minted into a link (`?sid=<uuid>`): delivery
  # gates and TDS routers tag each visitor so the payload server can tell a
  # first open from a replay. Bare `id=`/`sid=1` counters stay out via the
  # value floor; short framework tokens (`token=abc`) stay out with it too.
  - id: session-id-query-param
    desc: URL carries a session tracking parameter
    conf: 0.88
    for: [html, javascript]
    if:
      type: text
      regex: '[?&](sid|sessionid|session_id|token)=[A-Za-z0-9\-_]{8,64}'
    # Badge URLs in Markdown (codecov `?token=`) are public image links,
    # and the sniffer types those files as JavaScript.
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename

composite_rules:
  - id: tracked-url-parameter-mutation
    desc: Mutates a tracked URL parameter
    conf: 0.88
    all:
      - id: micro-behaviors/communications/http/url/query::query-parameter-mutation
    any:
      - id: parameter-manipulation-searchparams
      - id: parameter-manipulation-params
    near_bytes: 120
