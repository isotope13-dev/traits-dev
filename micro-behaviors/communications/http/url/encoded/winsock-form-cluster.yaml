defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: encoded-url-form-winsock-import-cluster
  desc: Encoded HTTP URL, form content type and Winsock imports co-occur
  crit: notable
  conf: 0.9
  all:
  - id: base64-decoded-http-url
  - id: micro-behaviors/communications/http/header/content-type::form-urlencoded-header-pe
  - id: micro-behaviors/communications/socket/connect::connect-api-ordinal
  any:
  - id: micro-behaviors/communications/socket/send::send-api-ordinal
  - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe-with-networking
