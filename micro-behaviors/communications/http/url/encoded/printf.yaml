defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97
traits:
  - id: printf-http-url-format
    desc: printf constructs an HTTP URL
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '^(h|\\150|\\x68)(t|\\164|\\x74)(t|\\164|\\x74)(p|\\160|\\x70)(s|\\163|\\x73)?(:|\\072|\\x3a)(/|\\057|\\x2f)(/|\\057|\\x2f)'
  - id: printf-http-url-percent-b
    desc: printf constructs an HTTP URL
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '^(h|\\150|\\x68)(t|\\164|\\x74)(t|\\164|\\x74)(p|\\160|\\x70)(s|\\163|\\x73)?(:|\\072|\\x3a)(/|\\057|\\x2f)(/|\\057|\\x2f)'


composite_rules:
  - id: printf-http-url
    desc: printf constructs an HTTP URL
    conf: 0.97
    any:
      - id: printf-http-url-format
      - id: printf-http-url-percent-b
