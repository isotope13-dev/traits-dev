defaults:
  platforms: [linux, macos, windows]
  for: [python, shell, elf, macho, pe, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: base64-decoded-http-url
    desc: HTTP URL recovered from Base64 content
    if:
      type: encoded
      encoding: base64
      regex: "https?://[a-zA-Z0-9.-]+\\.[a-z]{2,}"
    not:
      - substr: '"file":"polyglot-no'
      # SVG resize handles commonly embed the W3C namespace in a base64 data
      # URI. That namespace is a benign decoded URL, not an HTTP endpoint.
      - substr: w3.org
      - substr: apple.com
      - substr: digicert.com
      - substr: entrust.net
      - substr: globalsign.com
      - substr: sectigo.com
      - substr: pki.goog
      - substr: microsoft.com
      - regex: 'crl\.|ocsp\.'
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/signed/platform/
      # URLs in inline source-map sourcesContent are build metadata, not
      # endpoints used by the shipped JavaScript.
      - id: metadata/file/format/structured::sourcemap-context
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-http-url-referrer-param
      - id: metadata/binary/section/name::bun-section-name
      # Generated browser bundles routinely carry base64 SVG data URLs. A
      # decoded URL in that context is weak evidence; objective rules need a
      # stronger endpoint or payload signal before escalating it.
      - id: metadata/library/structure::js-large-minified-bundle
