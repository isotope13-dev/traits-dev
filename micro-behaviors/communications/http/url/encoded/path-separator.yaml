# Explicit construction of an encoded path separator.  Matching the call
# syntax, rather than the bare `%2F` token, keeps prose and ordinary encoded
# query values from satisfying the trait.  The first shape covers receiver-
# style and replacement-first APIs (JavaScript, Python, Ruby, PHP, .NET); the
# second covers Go's source-first strings.Replace/ReplaceAll API.
defaults:
  platforms: [windows, unix, appliance]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: slash-to-percent-encoded-rewrite-replacement-first
    desc: Replacement-first call percent-encodes slashes
    if:
      type: text
      regex: '(?i)(replace(All)?|gsub|str_replace)\s*\(\s*["'']/["'']\s*,\s*["'']%2f["'']'

  - id: go-slash-to-percent-encoded-rewrite
    desc: Go call percent-encodes slash separators
    for: [go]
    if:
      type: tree-sitter
      kind: call
      regex: 'strings\.Replace(All)?\([^,\r\n]{1,80},\s*["`]/["`],\s*["`]%2[fF]["`]'

composite_rules:
  - id: slash-to-percent-encoded-rewrite
    desc: Rewrites slashes as percent-encoded separators
    crit: notable
    conf: 0.94
    any:
      - id: slash-to-percent-encoded-rewrite-replacement-first
      - id: go-slash-to-percent-encoded-rewrite
