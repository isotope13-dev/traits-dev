defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.9

traits:
  - id: ruby-base64-decoded-domain
    desc: Ruby recovers a multi-label domain from Base64
    attack: T1140
    if:
      type: encoded
      encoding: base64
      regex: '(?i)([a-z0-9-]{1,63}\.){2,4}[a-z]{2,63}'
