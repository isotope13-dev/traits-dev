# The packed code's identifiers live in Packer's `'...'.split('|')` token
# dictionary, so a `referrer` token there means the unpacked script reads
# document.referrer even though no `document.referrer` text is visible.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: packer-dictionary-referrer-token
    desc: Packer token dictionary includes referrer
    if:
      type: text
      exclude_html_comments: true
      regex: '\|referrer\|[^'']{0,600}''\.split\(''\|''\)'
