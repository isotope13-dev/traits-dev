defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
- id: browser-location-host-read
  desc: Reads current host from browser location
  crit: notable
  conf: 0.82
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '\b(window\.)?location\.(host|hostname)\b'
- id: browser-location-path-read
  desc: Reads current path from browser location
  crit: notable
  conf: 0.86
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '\b(window\.)?location\.pathname\b'
- id: browser-location-bracket-member-read
  desc: Reads location member through bracket notation
  crit: notable
  conf: 0.88
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '\bwindow\s*\[\s*[''\"]location[''\"]\s*\]\s*\[[^\]]{1,80}\]'
- id: browser-location-host-tld-match
  desc: Matches browser host against ccTLD set
  crit: notable
  conf: 0.82
  for: [javascript, typescript]
  if:
    type: text
    regex: 'location\.host\.match\s*\(\s*/\\\.\('
- id: browser-location-host-russian-tld-match
  desc: Matches browser host against Russian ccTLDs
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  # The previous form spelled one literal alternation, `/\.(ru|su|by|xn--p1ai)$/`,
  # copied from a single bundle. Protestware releases vary the set and the order
  # -- sweetalert2 11.7.3 ships `/\.(ru|su|xn--p1ai)$/`, with no `by` -- so the
  # literal form silently missed them. Anchor on the host-match call and require
  # a Russian-sphere ccTLD anywhere in the alternation instead: `.su` and the
  # Cyrillic IDN `xn--p1ai` (.рф) are the discriminators, since neither appears
  # in ordinary geo-routing checks.
  if:
    type: text
    regex: 'location\.host\.match\s*\([^)]{0,48}\b(su|xn--p1ai)\b'
- id: browser-page-url-href-comparison
  desc: Compares location.href to another value
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '(window\.)?location\.href\s*[=!]=='
- id: browser-page-url-href-rhs-read
  desc: Reads location.href into another binding
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '[^=!<>]=\s*(window\.)?location\.href[\s\);,;+\-\?]'
- id: browser-page-url-href-argument-read
  desc: Passes location.href as a call argument
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '[(,]\s*(window\.)?location\.href[\s\);,]'
- id: browser-page-url-href-return-read
  desc: Returns location.href from a function
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: 'return\s+(window\.)?location\.href'
- id: browser-document-referrer-read
  desc: Reads document referrer
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '\bdocument\.referrer\b'
- id: browser-document-referrer-conditional
  desc: Gates browser behavior on document referrer
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: tree-sitter
    kind: conditional
    regex: '\bdocument\.referrer\b'
- id: url-object-host-read
  desc: Extracts host from a constructed URL
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: 'new\s+URL\s*\([^)]{1,200}\)\.(host|hostname)\b'
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: js-url-host-read
  desc: Reads hostname from URL variable
  crit: notable
  conf: 0.8
  for: [javascript, typescript]
  unless:
    - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: '\burl\.hostname\b'
- id: browser-location-host-comparison
  desc: Compares the current browser host
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '\b(window\.)?location\.(host|hostname)\s*[!=]==?'
composite_rules:
- id: browser-location-host-ref
  desc: Reads a host value from a URL
  crit: component
  conf: 0.9
  for: [javascript, typescript, html]
  any:
  - id: micro-behaviors/communications/http/url/navigation::browser-location-host-read
  - id: url-object-host-read
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: browser-page-url-reference
  desc: Reads current page URL from location.href
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  any:
    - id: browser-page-url-href-comparison
    - id: browser-page-url-href-rhs-read
    - id: browser-page-url-href-argument-read
    - id: browser-page-url-href-return-read
- id: browser-page-url-referrer-read
  desc: Reads page URL and document referrer
  crit: notable
  conf: 0.95
  for: [javascript, typescript, html]
  all:
  - id: browser-page-url-reference
  - id: browser-document-referrer-read
