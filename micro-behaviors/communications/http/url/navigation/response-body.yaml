# Server-selected destinations occur in normal application and advertising flows.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: xhr-response-href-assignment
    desc: Assigns location href from response text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\blocation.{0,16}href\W{0,2}=\s*[\w$]+[.\["'']{1,2}responseText'
