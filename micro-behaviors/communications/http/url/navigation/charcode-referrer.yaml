# Hash-delimited charcode packing hides whole scripts the way Dean Edwards
# Packer hides token dictionaries: identifiers survive only as decimal runs.
# A `document.referrer` run inside the blob means the hidden code reads the
# referrer, usually to gate on search-engine traffic.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: charcode-concealed-referrer
    desc: Charcode payload conceals referrer
    if:
      type: text
      exclude_html_comments: true
      substr: 100#111#99#117#109#101#110#116#46#114#101#102#101#114#114#101#114
