defaults:
  platforms: [windows, macos, linux]
  for: [pdf]
  crit: notable
traits:
  - id: pdf-microsoft-forms-template-link
    desc: PDF action links to Microsoft Forms template
    conf: 0.99
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)^https://(forms\.cloud\.microsoft|forms\.office\.com)/Pages/ShareFormPage\.aspx\?'
