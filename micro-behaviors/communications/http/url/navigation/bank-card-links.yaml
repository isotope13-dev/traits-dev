defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.96

traits:
  - id: external-ip-bank-navigation-link
    desc: Bank hyperlink targets external IPv4
    if:
      type: text
      regex: '(?i)href=["'']https?://[0-9.]{7,15}/[^"'']{0,40}Bank/'
      is: external_ip
      exclude_html_comments: true
  - id: executable-html-hyperlink
    desc: HTML hyperlink targets a Windows executable
    if:
      type: text
      regex: '(?i)href\s*=\s*["'']https?://[^"''\s]{1,160}\.exe["'']'
      exclude_html_comments: true
