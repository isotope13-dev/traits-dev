defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.96

traits:
  - id: external-ip-bank-navigation-link
    desc: Bank hyperlink targets external IPv4
    if:
      type: text
      regex: '(?i)href=["'']https?://[0-9.]{7,15}/[^"'']{0,40}Bank/'
      is: external_ip
      exclude_html_comments: true
  - id: executable-html-hyperlink
    desc: HTML hyperlink targets a Windows executable
    if:
      type: text
      regex: '(?i)href\s*=\s*["'']https?://[^"''\s]{1,160}\.exe["'']'
      exclude_html_comments: true
  - id: subdomain-spoofed-bank-navigation-link
    desc: Hyperlink nests bank brand in external subdomain
    if:
      type: text
      regex: '(?i)href.{0,9}https?://[a-z0-9.-]{0,99}([a-z]+bank|nordea|suntrust)\.[a-z]{2,}\.[a-z]{2,}'
      exclude_html_comments: true
  - id: bbt-nested-host-link
    desc: BBT link uses a nested external host
    if:
      type: text
      regex: 'href=.{0,80}\bbbt\.com\.[a-z0-9_-]{2,}\.'
      case_insensitive: true
      exclude_html_comments: true

