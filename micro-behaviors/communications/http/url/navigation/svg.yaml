defaults:
  platforms: [windows, unix]
  for: [svg]
  crit: notable

traits:
  - id: svg-location-external-assignment
    desc: SVG script navigates to an external URL
    conf: 0.94
    if:
      type: text
      regex: '(?i)(\.location|location\.(href|replace))\s*(=|\()\s*["'']https?://'
  - id: svg-location-variable-assignment
    desc: SVG script navigates to a computed target
    conf: 0.9
    if:
      type: text
      regex: '(?i)(window\.location\s*=\s*|location\.(href|replace|assign)\s*[=(]\s*)[A-Za-z_$]'
