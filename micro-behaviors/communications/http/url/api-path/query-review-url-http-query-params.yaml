defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: chat-agent-api-path-reference
    desc: URL path names an AI chat endpoint
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    # Monaco/Wallaby bundles contain links to product chat pages. Those are
    # documentation URLs, not programmatic chat endpoints; require an API-like
    # path segment so a product link alone is not enough.
    unless:
      - id: well-known/lib/ui/monaco-editor/
    if:
      type: text
      regex: '(?i)https?://[^/"''<>\s]{1,80}/(chat|assistant|agent|rovo)/(api|v[0-9]+)'

  # Microsoft Copilot Personal deep links use the web app host with a bare
  # `q=` prompt plus undocumented `autorun=` auto-execution (CoSnitch-class).
  # Keep `q=` as a component — alone it matches ordinary search URLs.

