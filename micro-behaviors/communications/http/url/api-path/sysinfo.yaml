defaults:
  platforms: [routeros, appliance, unix]
  for: [ruby]
  attack: T1041

traits:
  - id: ruby-sysinfo-path
    desc: Ruby sysinfo path
    crit: suspicious
    conf: 0.9
    # Must be a request path that ENDS at /sysinfo. A bare substring also hit
    # `/sysinfo/` as an interior segment of documentation URLs -- Microsoft's
    # SysInfo API docs (msdn.microsoft.com/library/en-us/sysinfo/base/...) are
    # cited in Ruby's own stdlib win32/registry.rb -- and in any comment or
    # changelog quoting such a link.
    if:
      type: text
      regex: '/sysinfo(["''?\s]|$)'
    unless:
      - id: well-known/tool/development/build/homebrew::source-tree
