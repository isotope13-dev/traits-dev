defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  conf: 0.94

traits:
  - id: vite-fs-raw-bypass-query
    desc: References Vite filesystem raw-query form
    crit: suspicious
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?\s"'']{0,300}\?(raw(\?\?)?|raw\?import)$'

  - id: vite-fs-import-bypass-query
    desc: References Vite filesystem import-query form
    crit: suspicious
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?\s"'']{0,300}\?(import&(raw(\?\?)?|url&inline)|inline&import)$'




composite_rules:
  - id: vite-fs-bypass-query-catalog
    desc: Contains multiple Vite filesystem query forms
    crit: suspicious
    all:
      - id: micro-behaviors/communications/url/http-path::vite-fs-route-reference
    needs: 2
    any:
      - id: micro-behaviors/communications/http/url/api-path::vite-fs-raw-bypass-query
      - id: micro-behaviors/communications/http/url/api-path::vite-fs-import-bypass-query
