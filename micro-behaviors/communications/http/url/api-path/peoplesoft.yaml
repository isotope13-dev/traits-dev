defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]

traits:
  - id: peoplesoft-psemhub-endpoint
    desc: PeopleSoft PSEMHUB hub servlet endpoint
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      # Every PSEMHUB letter is required, plain or percent-encoded: partial
      # tokens such as /PHUB/hub are not the EMHub servlet, while any single
      # (or fully) encoded letter still routes there after server decoding.
      regex: '(?i)/([\w%.~-]+/)*(P|%50)(S|%53)(E|%45)(M|%4[Dd])(H|%48)(U|%55)(B|%42)/hub'

