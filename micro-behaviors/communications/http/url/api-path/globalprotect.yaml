# PAN-OS GlobalProtect SSL VPN login endpoint path.
defaults:
  platforms: [panos, unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: globalprotect-sslvpn-login-esp
    desc: GlobalProtect SSL VPN login.esp path
    if:
      type: text
      substr: /ssl-vpn/login.esp
