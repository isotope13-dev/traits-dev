---
defaults:
  platforms:
  - windows
  for:
  - pe
  - javascript
composite_rules:
- id: report-status-update-api-clues
  desc: Report, status and update API path clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/url/api-path/resource::api-report-path
  - id: micro-behaviors/communications/http/url/api-path/resource::api-status-path
  - id: micro-behaviors/communications/url/resource-path/administration::api-update-path-reference
  any:
  - id: metadata/build/config::build-id-identifier
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
  - id: micro-behaviors/crypto/symmetric/aes/mode::aes256cbc-nodash
