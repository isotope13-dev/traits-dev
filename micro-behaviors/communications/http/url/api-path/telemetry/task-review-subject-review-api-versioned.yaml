defaults:
  platforms:
    - macos
    - linux
    - openwrt
  for:
    - c
    - objc
    - elf
    - shell
  crit: notable
  conf: 0.9
traits:
  - id: api-v1-beacon-endpoint
    desc: References the /api/v1/beacon HTTP endpoint
    for:
      - c
      - objc
      - elf
      - shell
      - binaries
      - ruby
    platforms:
      - unix
      - routeros
      - appliance
    if:
      type: text
      substr: /api/v1/beacon
