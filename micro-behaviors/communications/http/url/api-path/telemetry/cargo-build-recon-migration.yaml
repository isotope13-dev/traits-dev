defaults:
  platforms: [unix, windows]

traits:
  - id: micro-behaviors/communications/http/url/api-path/telemetry::rust-build-sentry-envelope
    desc: Sentry envelope endpoint reference
    crit: suspicious
    conf: 0.94
    for: [rust]
    if:
      type: text
      regex: 'ingest\.[a-z0-9.-]*sentry\.io/.{0,160}/envelope/'
