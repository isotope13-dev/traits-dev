traits:
- platforms:
  - macos
  for:
  - macho
  - dylib
  - javascript
  - html
  id: polling-interval-api-path
  desc: HTTP path names polling interval configuration
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: (?i)/(api/)?(update|poll|refresh)[_-](delay|interval)\b
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: pending-command-stream-path-literal
  desc: HTTP literal names a pending-command stream
  crit: notable
  conf: 0.95
  if:
    type: literal
    exact: /api/commands/pending/stream
