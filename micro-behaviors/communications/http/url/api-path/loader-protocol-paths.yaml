# Report/status/update URL paths formerly matched by objectives
# backdoor/loader atoms (bun-loader-report-endpoint,
# bun-loader-status-endpoint), which were merged here: each path string is a
# neutral URL observation shared by loaders and ordinary dashboards alike,
# and the loader intent lives in the dropper composites that reference
# these traits.
defaults:
  platforms: [windows]
  for: [pe, javascript]
  crit: notable
  conf: 0.94

traits:
  - id: api-status-path-reference
    desc: References the /api/status URL path
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
      - id: well-known/tool/development/agent/agent-relay::agent-relay-harness-package
      - id: well-known/lib/ai/lmcache::wheel-member-context
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)status\b'

  - id: api-report-path-reference
    desc: References the /api/report URL path
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)report\b'
