# Remote-operator CLI callback paths (`/api/cli/*`). Distinct from generic
# telemetry ingest routes; paired with host registration or folder upload in
# objectives composites.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-cli-init-api-path
    desc: CLI initialization API path reference
    if:
      type: text
      substr: "/api/cli/init"
  - id: python-cli-upload-api-path
    desc: CLI upload API path reference
    if:
      type: text
      substr: "/api/cli/upload"
  - id: python-cli-payload-api-path
    desc: CLI payload API path reference
    if:
      type: text
      substr: "/api/cli/payload"
  - id: python-cli-unlock-api-path
    desc: CLI unlock API path reference
    if:
      type: text
      substr: "/api/cli/unlock"
