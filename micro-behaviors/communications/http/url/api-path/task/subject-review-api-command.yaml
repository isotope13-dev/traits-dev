defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.9
traits:
  - id: agent-register-path
    crit: notable
    desc: Agent registration endpoint path
    for: [javascript, typescript, powershell, java, kotlin, csharp, go, shell]
    if:
      type: text
      substr: /api/v1/agents/register
  - id: agent-beacon-path
    crit: notable
    desc: Agent beacon endpoint path
    for: [javascript, typescript, powershell, java, kotlin, csharp, go, shell]
    if:
      type: text
      regex: '/api/v1/agents/.{1,80}/beacon'
  - id: agent-task-result-path
    crit: notable
    desc: Agent task result endpoint path
    for: [javascript, typescript, powershell, java, kotlin, csharp, go, shell]
    if:
      type: text
      regex: '/api/v1/agents/.{1,80}/tasks/.{1,80}/result'
  - id: agent-api-path
    crit: notable
    desc: Agent API endpoint path
    for: [javascript, typescript, powershell, java, kotlin, csharp, go, shell]
    if:
      type: text
      substr: /api/v1/agents/
  - id: api-command-path
    desc: API command endpoint path
    if:
      type: text
      substr: /api/command
  - id: http-api-register-path
    crit: notable
    desc: HTTP API register endpoint path
    for: [javascript, typescript, python]
    if:
      type: text
      substr: /api/register
  # A bare endpoint-path reference: the matcher cannot tell a client-side URL
  # string from a server-side route definition, so this lives with the other
  # URL facts rather than under server/route (moved from
  # micro-behaviors/communications/http/server/route::python-heartbeat-route).
  - id: http-api-task-path
    crit: notable
    desc: HTTP API task endpoint path
    if:
      type: text
      substr: /api/task/
  - id: api-v1-checkin-path
    desc: Versioned HTTP check-in endpoint path
    crit: notable
    for: [python]
    if:
      type: text
      substr: /api/v1/checkin
  - id: api-commands-path
    crit: notable
    desc: API commands endpoint path
    if:
      type: text
      regex: '/api/(v[0-9]+/)?commands\b'
  - id: connector-agent-register-path
    crit: notable
    desc: Connector agent registration API path
    for: [javascript, typescript, python, go, shell]
    if:
      type: text
      substr: /api/agent/register
  - id: connector-agent-heartbeat-path
    crit: notable
    desc: Connector agent heartbeat API path
    for: [javascript, typescript, python, go, shell]
    if:
      type: text
      substr: /api/agent/heartbeat
  - id: connector-agent-signal-path
    crit: notable
    desc: Connector agent WebRTC signal API path
    for: [javascript, typescript, python, go, shell]
    if:
      type: text
      regex: '/api/agent/signal([/?#]|$)'
