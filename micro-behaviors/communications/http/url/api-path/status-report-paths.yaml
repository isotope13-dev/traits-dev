# Generic API status/report route paths.
#
# These matchers only see the URL path shape (`/api/status`, `/api/report`
# modulo URL-encoding) — the same routes every health-checked service and team
# task server exposes. They relocated here from the NWHStealer Bun-loader
# signature, where family names over-claimed them; the loader composite
# references them as neutral legs and supplies the malicious context.
# Canonical home for both atoms: the former loader-protocol-paths.yaml
# `-reference` copies were merged here, preserving their exclusions below.
defaults:
  platforms: [windows]
  for: [pe, javascript]
  crit: notable
  conf: 0.94

traits:
  - id: api-status-path
    desc: API status endpoint path
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)status\b'
    unless:
      - id: well-known/tool/development/agent/agent-relay::agent-relay-harness-package
      - id: well-known/lib/ai/lmcache::wheel-member-context
      - id: metadata/package/testing/corpus::inert-security-input-module

  - id: api-report-path
    desc: API report endpoint path
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)report\b'
