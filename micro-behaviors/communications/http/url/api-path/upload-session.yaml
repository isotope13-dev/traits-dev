defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: upload-handshake-route
    desc: HTTP handshake route suffix
    if:
      type: text
      regex: '/handshake\b'

  - id: upload-complete-route
    desc: HTTP completion route suffix
    if:
      type: text
      regex: '/complete\b'

  - id: upload-chunk-route
    desc: HTTP chunk-upload route suffix
    if:
      type: text
      regex: '/chunk\b'
