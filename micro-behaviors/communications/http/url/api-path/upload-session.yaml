defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: upload-handshake-route
    desc: HTTP handshake route suffix
    if:
      type: text
      # Require a quoted route literal. A path fragment in a source map such
      # as `../lib/handshake.ts` is a module filename, not an HTTP route.
      regex: '["\x27`]\/handshake\b'

  - id: upload-complete-route
    desc: HTTP completion route suffix
    if:
      type: text
      regex: '/complete\b'

  - id: upload-chunk-route
    desc: HTTP /chunk route reference
    if:
      type: text
      # Require a path/query terminator, not a bundler filename suffix.
      regex: '/chunk([/?#\s"\x27]|$)'
