defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: upload-handshake-route
    desc: HTTP handshake route suffix
    if:
      type: text
      # Accept prefixed routes and unquoted native strings as well as source
      # literals. Require a route terminator so handshake.ts and handshake
      # helper filenames in source maps do not qualify.
      regex: '/handshake([/?#\s"\x27`]|$)'

  - id: upload-complete-route
    desc: HTTP completion route suffix
    if:
      type: text
      regex: '(["\x27`}]|/[A-Za-z0-9_.-]+)/complete([/?#\s"\x27`]|$)'

  - id: upload-chunk-route
    desc: HTTP /chunk route reference
    if:
      type: text
      # Require a path/query terminator, not a bundler filename suffix.
      regex: '/chunk([/?#\s"\x27]|$)'
