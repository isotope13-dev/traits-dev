# Restore definitions omitted by the preceding taxonomy migration.
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: notable
traits:
- id: account-collection-route
  desc: Account-creation route fragment
  crit: notable
  if:
    type: text
    regex: /accounts\b
- id: account-token-route
  desc: Account-token route fragment
  crit: notable
  if:
    type: text
    regex: /token\b
- id: message-collection-route
  for:
  - scripts
  - source
  - binaries
  desc: Message-list route fragment
  crit: notable
  if:
    type: text
    regex: '(^|["'']|https?://[^/\s]{1,253})(/api)?(/v[0-9]+)?/messages\b'
- id: message-item-route
  desc: Individual-message route fragment
  crit: notable
  if:
    type: text
    substr: /messages/
