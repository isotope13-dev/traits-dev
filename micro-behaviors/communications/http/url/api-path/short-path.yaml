defaults:
  platforms: [unix]
  for: [github-actions]
traits:
  - id: short-two-segment-url
    desc: HTTP URL has two short lowercase segments
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'https?://[^\s"]{4,80}/[a-z]{1,3}/[a-z]{1,3}\b'
    unless:
      - type: text
        substr: git.kernel.org/pub/scm/
      - type: text
        regex: 'https?://([^\s"/]+\.)?intel\.com/content/'
      - type: text
        regex: 'https://[^/\s"]+\.codecov\.io/upload'
      - type: text
        regex: 'https://[^/\s"]+\.codeartifact\.[^/\s"]+/npm/'
      - type: text
        regex: 'https://download\.pytorch\.org/whl/[A-Za-z0-9._-]+'
      - type: text
        regex: 'https://buf\.build/'
      - type: text
        regex: 'https://([^/\s"]+\.)?github\.com/'
      - type: text
        regex: 'https://raw\.githubusercontent\.com/'
