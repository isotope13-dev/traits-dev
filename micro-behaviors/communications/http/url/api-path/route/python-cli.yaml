# These path strings identify CLI API subjects; they do not establish use.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-cli-init-api-path
    desc: CLI initialization API path reference
    if:
      type: text
      substr: "/api/cli/init"
  - id: python-cli-unlock-api-path
    desc: CLI unlock API path reference
    if:
      type: text
      substr: "/api/cli/unlock"
