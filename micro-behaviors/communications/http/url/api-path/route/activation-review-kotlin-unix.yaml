defaults:
  platforms: [unix]
  for: [kotlin, class, jar]

traits:
  - id: micro-behaviors/communications/http/url/api-path/route::kotlin-trigger-endpoint
    desc: Kotlin trigger path literal
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: string_literal
      # A bare SerialName "trigger" is a JSON field, not a route.
      regex: '^/([^/]+/)*trigger$'

  - id: micro-behaviors/communications/http/url/api-path/route::kotlin-commands-endpoint
    desc: Kotlin commands path literal
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: string_literal
      regex: '^/([^/]+/)*commands$'

