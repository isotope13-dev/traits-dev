defaults:
  platforms: [unix, windows]
  for: [json, chrome-manifest, javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: wim-gotohub-uninstall-endpoint
    desc: WIM gotohub or uninstall endpoint
    if:
      type: text
      regex: '/wim/(gotohub|uninstall)\?s='
  - id: wim-v1-sug-endpoint
    desc: WIM v1 autocomplete suggestion endpoint
    if:
      type: text
      regex: '/v1/sug/\?(yid|s)='
