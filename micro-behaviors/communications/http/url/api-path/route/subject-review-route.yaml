defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85
traits:
  - id: api-request-route
    desc: HTTP API request route literal
    crit: notable
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      exact: /api/req
  - id: api-response-route
    desc: HTTP API response route literal
    crit: notable
    conf: 0.92
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      exact: /api/req/res
