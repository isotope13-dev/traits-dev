defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.9
traits:
  - id: home-endpoint-path
    desc: /home HTTP endpoint path
    if:
      type: text
      exact: /home
      section: .rdata
  - id: index-php-endpoint-path
    crit: notable
    desc: /index.php HTTP endpoint path
    if:
      type: text
      exact: /index.php
      section: .rdata
  - id: profile-endpoint-path
    crit: notable
    desc: /profile HTTP endpoint path
    if:
      type: text
      exact: /profile
      section: .rdata
