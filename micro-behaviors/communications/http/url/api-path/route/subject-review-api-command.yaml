defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.9
traits:
  - id: api-response-path
    crit: notable
    desc: API response endpoint path
    if:
      type: text
      substr: /api/response
  - id: jvm-c2-command-path
    desc: JVM class /command endpoint path
    crit: notable
    conf: 0.94
    for: [class]
    unless:
      - id: well-known/lib/platform/eclipse-lemminx/
      - type: text
        substr: org/eclipse/core/commands/
      - type: text
        substr: org/eclipse/debug/internal/core/commands/
      - type: text
        substr: net/sourceforge/plantuml/command/
      - type: text
        substr: .claude/commands/
      - type: text
        substr: .atomcode/commands/
      - type: text
        substr: slash commands
      - type: text
        substr: /command/
    if:
      type: hex
      pattern: "2F 63 6F 6D 6D 61 6E 64"
