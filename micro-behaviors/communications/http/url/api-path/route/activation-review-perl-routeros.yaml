defaults:
  platforms: [routeros, appliance, unix]
  for: [perl]

traits:
  - id: micro-behaviors/communications/http/url/api-path/route::perl-trigger-check-path
    desc: Perl trigger-check URL path text
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /trigger/check?id=

  - id: micro-behaviors/communications/http/url/api-path/route::perl-trigger-result-path
    desc: Perl trigger-result URL path text
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /trigger/result

