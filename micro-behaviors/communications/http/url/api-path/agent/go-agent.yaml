defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96
traits:
  - id: agent-command-query-path
    desc: Agent command path with agent ID query
    if:
      type: text
      substr: /agent/command?agent_id=
  - id: agent-response-path
    desc: Agent response endpoint path
    if:
      type: text
      exact: /agent/response
