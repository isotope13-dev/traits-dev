defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.9
traits:
  - id: agent-register-path
    crit: notable
    desc: Agent registration endpoint path
    for: [javascript, typescript, powershell, java, kotlin, csharp, go, shell]
    if:
      type: text
      substr: /api/v1/agents/register
  - id: agent-beacon-path
    crit: notable
    desc: Agent beacon endpoint path
    for: [javascript, typescript, powershell, java, kotlin, csharp, go, shell]
    if:
      type: text
      regex: '/api/v1/agents/.{1,80}/beacon'
  - id: agent-task-result-path
    crit: notable
    desc: Agent task result endpoint path
    for: [javascript, typescript, powershell, java, kotlin, csharp, go, shell]
    if:
      type: text
      regex: '/api/v1/agents/.{1,80}/tasks/.{1,80}/result'
  - id: agent-api-path
    crit: notable
    desc: Agent API endpoint path
    for: [javascript, typescript, powershell, java, kotlin, csharp, go, shell]
    if:
      type: text
      substr: /api/v1/agents/
  - id: connector-agent-register-path
    crit: notable
    desc: Connector agent registration API path
    for: [javascript, typescript, python, go, shell]
    if:
      type: text
      substr: /api/agent/register
  - id: connector-agent-heartbeat-path
    crit: notable
    desc: Connector agent heartbeat API path
    for: [javascript, typescript, python, go, shell]
    if:
      type: text
      substr: /api/agent/heartbeat
  - id: connector-agent-signal-path
    crit: notable
    desc: Connector agent signal API path
    for: [javascript, typescript, python, go, shell]
    if:
      type: text
      regex: '/api/agent/signal([/?#]|$)'
