defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: suspicious-php-endpoint
  desc: PHP URL with live query parameter
  crit: suspicious
  conf: 0.85
  if:
    type: string_literal
    substr: .php?live=
  unless: null
- id: version-check-url
  desc: Version or check PHP endpoint URL
  crit: suspicious
  conf: 0.9
  if:
    type: string_literal
    regex: https?://[^/]{1,120}/[Vv]ersion\.php|https?://[^/]{1,120}/[Cc]heck\.php
- id: traktrain-req-endpoint
  desc: Traktrain req.php endpoint
  crit: suspicious
  conf: 0.99
  if:
    type: string_literal
    exact: http://pt.traktrain.com/req.php
