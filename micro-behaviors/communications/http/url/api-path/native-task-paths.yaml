# Length-prefixed Rust strings are absent from the text index, so these
# match the file bytes.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
traits:
  - id: http-tasks-path
    desc: HTTP tasks collection path
    conf: 0.9
    if:
      type: raw
      substr: /tasks/
      section: rdata
  - id: http-results-path
    desc: HTTP results collection path
    conf: 0.9
    if:
      type: raw
      substr: /results/
      section: rdata
