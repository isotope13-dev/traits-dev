defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.9
traits:
  - id: http-api-heartbeat-path
    crit: notable
    desc: HTTP API heartbeat endpoint path
    conf: 0.95
    for: [python, pyc]
    if:
      type: text
      substr: /api/heartbeat
  - id: http-api-result-path
    crit: notable
    desc: HTTP API result endpoint path
    if:
      type: text
      substr: /api/result/
  - id: api-v1-result-path
    desc: Versioned HTTP result endpoint path
    crit: notable
    for: [python]
    if:
      type: text
      substr: /api/v1/result
  - id: result-endpoint-path
    crit: notable
    desc: Rooted HTTP result endpoint path
    if:
      type: string_literal
      regex: '^/results?([/#?]|$)'
  # Bare /commands (no /api/ prefix) — used by compact HTTP tasking agents
  # that poll for shell jobs. Distinct from api-commands-path (/api/.../commands).
