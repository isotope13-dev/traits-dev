defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.9
traits:
  - id: http-api-result-path
    crit: notable
    desc: HTTP API result endpoint path
    if:
      type: text
      substr: /api/result/
  - id: api-v1-result-path
    desc: Versioned HTTP result endpoint path
    crit: notable
    for: [python]
    if:
      type: text
      substr: /api/v1/result
