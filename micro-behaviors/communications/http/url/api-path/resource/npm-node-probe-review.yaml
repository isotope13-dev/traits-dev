defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: sensitive-collection-api-path-text
    desc: SSH-key and scan-pattern API path references
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(/api/ssh-key|/api/scan-patterns|/api/block-patterns)([/?#"''`]|$)'
    unless:
      - id: well-known/app/security/bitwarden::bitwarden-app
      - id: metadata/file/catalog/service::bitwarden-text-marker
