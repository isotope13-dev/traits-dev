# These path strings identify CLI API subjects; they do not establish use.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-cli-upload-api-path
    desc: CLI upload API path reference
    if:
      type: text
      substr: "/api/cli/upload"
  - id: python-cli-payload-api-path
    desc: CLI payload API path reference
    if:
      type: text
      substr: "/api/cli/payload"
