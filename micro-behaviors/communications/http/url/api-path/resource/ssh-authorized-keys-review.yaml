defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
traits:
- id: js-ssh-key-api-path
  desc: Node SSH-key API path reference
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '/api/ssh-key([/?#"''`]|$)'
  unless:
  - id: well-known/app/security/bitwarden::bitwarden-app
  - id: metadata/file/catalog/service::bitwarden-text-marker
