# Generic /submit.php collection endpoint path reference in web code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
  crit: notable
  conf: 0.88

traits:
  - id: php-submit-endpoint-path
    desc: References submit.php API endpoint path
    if:
      type: text
      regex: '/submit\.php\b'
