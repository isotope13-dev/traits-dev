defaults:
  platforms: [windows]
  for: [pe, javascript]
  crit: notable
  conf: 0.94

traits:
  - id: api-status-path
    desc: API status endpoint path
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)status\b'
  - id: api-report-path
    desc: API report endpoint path
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)report\b'
