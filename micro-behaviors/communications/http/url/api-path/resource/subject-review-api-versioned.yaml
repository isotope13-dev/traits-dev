defaults:
  platforms:
    - macos
    - linux
    - openwrt
  for:
    - c
    - objc
    - elf
    - shell
  crit: notable
  conf: 0.9
traits:
  - id: api-v1-credentials-endpoint
    desc: References the /api/v1/credentials HTTP endpoint
    platforms:
      - unix
      - openbsd
      - bsd
      - windows
    for:
      - c
      - cpp
      - objc
      - elf
      - shell
      - ruby
    if:
      type: text
      substr: /api/v1/credentials
