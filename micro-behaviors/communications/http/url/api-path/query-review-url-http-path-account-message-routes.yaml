defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: notable

traits:
  - id: account-collection-route
    desc: Account collection route fragment
    crit: component
    if:
      type: text
      regex: '/accounts\b'

  - id: account-token-route
    desc: Account-token route fragment
    crit: component
    if:
      type: text
      regex: '/token\b'

  - id: message-collection-route
    for: [scripts, source, binaries]
    desc: Message collection route fragment
    crit: component
    if:
      type: text
      regex: '/messages\b'

  - id: message-item-route
    desc: Individual message route fragment
    crit: component
    if:
      type: text
      substr: /messages/

