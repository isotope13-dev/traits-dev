# Completes existing relocations; HTTP route boundaries exclude filesystem suffixes.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
traits:
- for:
  - scripts
  - source
  id: account-collection-route
  desc: Account-creation route fragment
  if:
    type: text
    regex: (^|["'`\s])(https?://[^/\s"']{1,253})?/accounts\b
- for:
  - scripts
  - source
  id: account-token-route
  desc: Account-token route fragment
  if:
    type: text
    regex: (^|["'`\s])(https?://[^/\s"']{1,253})?/token\b
- for:
  - scripts
  - source
  - binaries
  id: message-collection-route
  desc: Message-list route fragment
  if:
    type: text
    regex: (^|["'`\s])(https?://[^/\s"']{1,253})?/messages\b
- for:
  - scripts
  - source
  id: message-item-route
  desc: Individual-message route fragment
  if:
    type: text
    regex: (^|["'`\s])(https?://[^/\s"']{1,253})?/messages/
- for:
  - python
  id: screenshot-route-reference
  desc: Screenshot API route literal
  conf: 0.99
  if:
    type: literal
    exact: /screenshot
