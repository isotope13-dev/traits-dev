defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.88
traits:
  - id: login-page-ssl-session-token
    desc: Login.php SSL flag with opaque session token
    if:
      type: text
      regex: '(?i)login\.php\?[^"<>]{0,120}sslchannel=true[^"<>]{0,40}sessionid=[A-Za-z0-9_-]{48,}'
