# Generic script paths do not establish contact, collection or C2.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf, macho, xml]
traits:
- id: php-collect-script-path
  desc: References a PHP collect script path
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: /collect[_-]?(info|data|stats)?\.php
  unless:
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
    - id: metadata/file/format/markup::adblock-filter-list
    # The serialized adblocker engine lists these endpoints as BLOCK targets.
    - id: well-known/lib/data/easylist::engine-serialization

- id: php-beacon-script-path
  desc: References a PHP beacon script path
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: /beacon.php

composite_rules:
- id: php-reporting-script-reference
  desc: References PHP reporting or gateway scripts
  crit: notable
  conf: 0.85
  any:
  - id: php-collect-script-path
  - id: micro-behaviors/communications/http/url/php-endpoint::php-log-script-path
  - id: micro-behaviors/communications/http/url/php-endpoint::php-report-script-path
  - id: php-beacon-script-path
  - id: micro-behaviors/communications/http/url/php-endpoint::php-gate-path
