# A logging-script URL reference proves neither contact nor exfiltration.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf, macho, xml]
traits:
  - id: php-log-script-path
    desc: URL references a PHP logging script
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: /log[_-]?(info|data)?\.php
