defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.95
traits:
  - id: session-public-php-script-reference
    desc: References a session_public PHP script
    if:
      type: text
      regex: '(?i)\bsession_public\.php\b'
  - id: relative-php-script-path
    desc: Quoted relative PHP script URL
    if:
      type: text
      regex: '["'']/[A-Za-z0-9_./-]{1,160}\.php["'']'
