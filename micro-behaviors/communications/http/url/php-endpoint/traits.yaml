# URL path observations; a PHP endpoint alone does not establish C2.
defaults:
  platforms: [unix, windows]
traits:
  - id: php-upload-endpoint-url
    mbc: C0002
    attack: T1071.001
    size_max: 20000000
    desc: PHP upload endpoint URL
    crit: notable
    conf: 0.88
    for: [scripts, source, binaries]
    if:
      type: string_literal
      regex: '(?i)https?://[^\s"'']{1,180}/upload[^\s"'']{0,40}\.php([?#]|$)'
  - id: url-php-endpoint-script
    mbc: C0002
    size_max: 20000000
    desc: URL targets .php endpoint
    crit: notable
    conf: 0.8
    for: [scripts, source, javascript, typescript]
    if:
      type: string_literal
      regex: '(^|[^/])https?://[A-Za-z0-9._:\-]{1,253}/[A-Za-z0-9._/\-]{1,200}\.php(\?|$|/)'
  - id: url-php-endpoint-encoded
    mbc: C0002
    size_max: 20000000
    desc: Encoded URL targets .php endpoint
    # Notable alone: fixtures and GUIs often base64-encode .php URLs.
    # Dropper/C2 composites that combine this with fetch/eval stay suspicious.
    crit: notable
    conf: 0.9
    for: [php, javascript, python, shell, powershell]
    if:
      type: encoded
      encoding: [base64, hex, url, xor]
      regex: 'https?://[A-Za-z0-9._:\-]{1,253}/[A-Za-z0-9._/\-]{1,200}\.php(\?|$|/)'
  - id: url-php-query-script
    mbc: C0002
    attack: T1071.001
    size_max: 20000000
    desc: URL targets .php with query
    crit: notable
    conf: 0.85
    for: [scripts, source]
    if:
      type: string_literal
      regex: '(^|[^/])https?://[A-Za-z0-9._:\-]{1,253}/[A-Za-z0-9._/\-]{1,200}\.php\?'
    not:
      - regex: '(?i)/viewtopic\.php\?'
      - regex: '(?i)://jrsoftware\.org/ishelp/index\.php\?'
      - regex: '(?i)index\.php\?'
      - regex: '(?i)vim\.org/scripts/script\.php'
      - regex: '(?i)://en\.wikipedia\.org/w/api\.php'
      - regex: '(?i)://www\.albumart\.org/index_detail\.php'
      # Matomo and Piwik tracking endpoints are standard analytics API routes,
      # not operator-controlled PHP C2 endpoints.
      - regex: '(?i)/(matomo|piwik)\.php\?'
    unless:
      - id: metadata/document/html::html-root-at-start
      - id: well-known/lib/runtime/scripted/osano::osano-consent-manager
      - id: metadata/file/catalog/identity::ad-tracker-domain-catalog
  # Single-literal IP + .php combinations. The webshell drop-box shape is one
  # URL whose host is a literal external IP and whose path is a .php script;
  # pairing an IP URL from one literal with a .php URL from another (e.g.
  # adjacent rows of a registry-referral table) is not that shape, so these
  # atoms require both halves in the SAME literal and the composites below
  # reference them instead of pairing the generic legs by proximity.
  - id: url-ip-php-endpoint-script
    mbc: C0002
    attack: T1071.001
    size_max: 20000000
    desc: URL combines external IP and .php path
    crit: notable
    conf: 0.9
    for: [scripts, source, javascript, typescript]
    if:
      type: string_literal
      regex: 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?/[A-Za-z0-9._/\-]{1,200}\.php(/|$)'
      is: external_ip
    not:
      - regex: '(?i)/viewtopic\.php\?'
      - regex: '(?i)index\.php(\?|/)'
      - regex: 'https?://8\.8\.[84]\.[84](/|$)'
      - regex: 'https?://1\.1\.1\.1(/|$)'
      - regex: 'https?://9\.9\.9\.9(/|$)'
      - regex: 'https?://169\.254\.169\.254(/|$)'
      - regex: 'https?://100\.100\.100\.200(/|$)'
      - regex: 'https?://100\.(6[4-9]|[789][0-9]|1[01][0-9]|12[0-7])\.'
    unless:
      - id: metadata/document/html::html-root-at-start
      - id: well-known/lib/runtime/scripted/osano::osano-consent-manager
      - id: metadata/file/catalog/identity::ad-tracker-domain-catalog
      # Threat-intelligence clients retain known-bad URLs as lookup examples;
      # the literal is an indicator submitted to the service, not contacted.
      - id: well-known/tool/detection/virustotal::python-client-source
  - id: url-ip-php-query-script
    mbc: C0002
    attack: T1071.001
    size_max: 20000000
    desc: IP-hosted PHP URL with a query string
    crit: suspicious
    conf: 0.9
    for: [scripts, source]
    if:
      type: string_literal
      regex: 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?/[A-Za-z0-9._/\-]{1,200}\.php\?'
      is: external_ip
    not:
      - regex: '(?i)/viewtopic\.php\?'
      - regex: '(?i)index\.php\?'
      # A proxy interface uses the PHP query to forward an explicitly supplied
      # target URL; it is not evidence of a webshell by itself.
      - regex: '(?i)/proxy_url\.php\?'
      - regex: 'https?://8\.8\.[84]\.[84]/'
      - regex: 'https?://1\.1\.1\.1/'
      - regex: 'https?://9\.9\.9\.9/'
      - regex: 'https?://169\.254\.169\.254/'
      - regex: 'https?://100\.100\.100\.200/'
      - regex: 'https?://100\.(6[4-9]|[789][0-9]|1[01][0-9]|12[0-7])\.'
    unless:
      # A vendored upstream's own sample data. google-cloud-sdk ships
      # util/third_party/pyparsing/examples/httpServerLogParser.py, whose
      # fixture is an Apache log line carrying exactly this URL shape.
      - type: path
        regex: '(^|/)third_party/'
      # pyparsing's own example, also vendored outside a third_party/ directory
      # (Darling ships it under python_modules/Modules/pyparsing-*/examples/).
      - type: basename
        regex: '^httpServerLogParser\.py$'
      - id: well-known/lib/runtime/scripted/osano::osano-consent-manager
      - id: metadata/file/catalog/identity::ad-tracker-domain-catalog
  - id: url-ip-php-endpoint-encoded
    mbc: C0002
    attack: T1071.001
    size_max: 20000000
    desc: Encoded URL combines IP and .php
    crit: suspicious
    conf: 0.92
    for: [php, javascript, python, shell, powershell]
    if:
      type: encoded
      encoding: [base64, hex, url, xor]
      regex: 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?/[A-Za-z0-9._/\-]{1,200}\.php(\?|/|$)'
      is: external_ip
    not:
      - regex: '(?i)/viewtopic\.php\?'
      - regex: '(?i)index\.php(\?|/)'
      - regex: 'https?://169\.254\.169\.254(/|$)'
      - regex: 'https?://100\.(6[4-9]|[789][0-9]|1[01][0-9]|12[0-7])\.'
    unless:
      - type: basename
        regex: '(?i)(\.js\.map$|^public-suffix-list\.data\.js$)'
      - type: text
        regex: '(?i)sourceMappingURL\s*=\s*data:[^,]{0,120};base64,'
      - id: metadata/document/html::html-root-at-start
  - id: url-php-endpoint-binary
    mbc: C0002
    attack: T1071.001
    desc: URL targets .php endpoint
    crit: notable
    conf: 0.8
    for: [binaries]
    # Capture the query string too (tight URL-arg class, no \S, so binary noise
    # in concatenated strings is not absorbed) so the not: filters below can
    # inspect query params — `not:` matches the matched substring, which would
    # otherwise stop at `.php?` and never see `?title=`/`?search=` (see RULES.md).
    if:
      type: text
      regex: 'https?://[A-Za-z0-9._:\-]{1,253}/[A-Za-z0-9._/\-]{1,200}\.php(\?[\w%=&:/.\-]{0,200}|/|$)'
    not:
      - regex: '(?i)/viewtopic\.php\?'
      # Forum topic pages (SMF and similar), same class as phpBB viewtopic.
      - regex: '(?i)/topic\.php\?'
      - regex: '(?i)://jrsoftware\.org/ishelp/index\.php\?'
      # MediaWiki article/search URLs (Wikipedia, cppreference, dejavu, many
      # wikis) — index.php?title=/?search= or path-style index.php/ — are benign
      # documentation endpoints, not C2 panels.
      - regex: '(?i)index\.php(\?(title|search)=|/)'
      - regex: '(?i)://(www\.)?(wikibooks|wikipedia|wiktionary)\.org/w/index\.php\?'
      # vim.org script registry (legitimate plugin index).
      - regex: '(?i)vim\.org/scripts/script\.php'
      # Public service APIs used by benign album-art/media integrations.
      - regex: '(?i)://en\.wikipedia\.org/w/api\.php'
      - regex: '(?i)://www\.albumart\.org/index_detail\.php'
      # phpfever.com hosts documented ZIP/postal lookup web services used by
      # Delphi utilities; the hostname is not an operator-controlled gate.
      - regex: '(?i)://(www\.)?phpfever\.com/web-services/[^?\s]*\.php'
      # Hydrogen drum machine sound-library feed (first-party .php list endpoint).
      - regex: '(?i)://(www\.)?hydrogen-music\.org/feeds/[^?\s]*\.php'
      # Qihoo 360 first-party support and telemetry endpoints (help-forum
      # article links, error-report and proxy-error pages) carried by 360
      # desktop products; the hostname is vendor-controlled, not a C2 gate.
      - regex: '(?i)://bbs\.360\.cn/forum\.php'
      - regex: '(?i)://(doctor|profile)\.se\.360\.cn/'
    unless:
      - id: well-known/app/media/hydrogen-music::hydrogen-drum-machine
      - id: well-known/app/media/hydrogen-music::hydrogen-music-org-url
      # IObit's signed applications use PHP-backed update and telemetry
      # routes; the verified product identity explains these URLs.
      - id: well-known/app/system/iobit::iobit-signed-component-context
      # yt-dlp extractor bytecode carries legitimate site test/content URLs;
      # its extractor identity is already a stronger explanation than C2.
      - id: well-known/tool/media/youtube-dl::youtube-dl-package-context
      # Inno Setup embeds this public help URL in every standard installer;
      # it is documentation, not an operator-controlled PHP endpoint.
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      # GNU whois embeds registry referral URLs, including PHP web WHOIS
      # interfaces, as lookup data rather than an operator-controlled endpoint.
      - id: well-known/tool/sysadmin/whois::whois-utility
  - id: sms-api-pro-user-endpoint
    mbc: C0002
    attack: T1071.001
    size_max: 20000000
    desc: SMS API pro user endpoint
    crit: notable
    conf: 0.96
    for: [php]
    if:
      type: text
      substr: '/sms_api_pro/api_user.php'
  - id: php-collect
    for: [scripts, binaries]
    crit: notable
    conf: 0.8
    desc: PHP URL collect query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?collect(=|&|$)
  - id: php-data
    for: [scripts, binaries]
    crit: notable
    conf: 0.8
    desc: PHP URL data query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?data(=|&|$)
  - id: php-info
    for: [scripts, binaries]
    crit: notable
    conf: 0.8
    desc: PHP URL info query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?info(=|&|$)
  - id: php-log
    for: [scripts, binaries]
    crit: notable
    conf: 0.8
    desc: PHP URL log query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?log(=|&|$)
  - id: php-report
    for: [scripts, binaries]
    crit: notable
    conf: 0.8
    desc: PHP URL report query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?report(=|&|$)
  - id: php-report-script-path
    for: [scripts, binaries]
    desc: URL targets report.php script
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'https?://[^\s"''<>]{1,240}/report\.php([?#\s]|$)'
    unless:
    - id: well-known/app/ai/coding-agent/abacus-ai::abacus-ai-vscode-extension
    not:
    - regex: '(?i)https?://bugs\.php\.net/report\.php'
  - id: php-beacon
    for: [scripts, binaries]
    crit: notable
    conf: 0.8
    desc: PHP URL beacon query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?beacon(=|&|$)
  - id: php-endpoints-directory-script
    for: [javascript, typescript, html, php]
    crit: notable
    conf: 0.93
    desc: PHP script path under endpoints directory
    if:
      type: text
      regex: '(?i)/php/endpoints/[a-z0-9_-]{2,40}\.php\b'
  - id: php-license-validation-endpoint
    for: [html, javascript, typescript, php]
    crit: notable
    conf: 0.94
    desc: PHP license key validation endpoint
    if:
      type: text
      regex: '(?i)/endpoints/validate_license\.php\b'
  - id: php-password-change-endpoint
    for: [html, javascript, typescript, php]
    crit: notable
    conf: 0.93
    desc: PHP password_change endpoint path
    if:
      type: text
      regex: '(?i)/endpoints/password_change\.php\b'
  - id: php-telegram-mfa-page
    for: [html, javascript, typescript, php]
    crit: notable
    conf: 0.95
    desc: PHP Telegram MFA verification route
    if:
      type: text
      regex: '(?i)["'']telegram_mfa\.php["'']'
  - id: license-key-validate-payload
    for: [html, javascript, typescript, php]
    crit: notable
    conf: 0.95
    desc: JSON payload pairs verify and license_key
    if:
      type: text
      regex: '(?s)\baction\s*:\s*["'']verify["''][\s\S]{0,240}\blicense_key\s*:'
composite_rules:
- id: external-ip-php-init-query-correlation
  for: [scripts, source, '!jcl']
  desc: External IP PHP URL near init/ID/data query
  # The joint shape merits endpoint investigation even in a passive config.
  # This is bounded co-occurrence, not proof that a request or collection ran.
  crit: suspicious
  conf: 0.96
  near_bytes: 256
  all:
  - id: url-ip-php-query-script
  - id: micro-behaviors/communications/url/query/tracking::init-event-id-data-query
- id: php-collector
  for: [scripts, binaries]
  desc: PHP collection-related query parameters
  crit: notable
  conf: 0.85
  any:
  - id: php-collect
  - id: php-data
  - id: php-info
  - id: php-log
  - id: php-report
  - id: php-beacon
