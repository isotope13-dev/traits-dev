# Sign-in endpoint URL facts. The endpoint token alone is neutral (real
# sites have signin.php); redirect, stub and token scope in the phishing
# composites carry the intent.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html, python, php, shell]

traits:
  - id: signin-php-endpoint
    desc: Sign-in PHP endpoint reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)[\w.-]*sign[_-]?in[\w.-]*\.php'
