# Endpoint names alone establish neither C2 nor credential exfiltration.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf, macho, xml]
traits:
- id: php-gate-path
  desc: References a gate.php endpoint path
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: /gate.php
- id: php-command-script-url
  desc: Gate/cmd/shell/payload PHP URL path
  crit: notable
  unless:
    - id: metadata/file/profile/test-indications/
    - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
    - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
    - id: well-known/tool/offensive/pentestkit/
    - id: well-known/tool/offensive/bingo/
    - id: well-known/tool/offensive/bbot::package-tree-member
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  conf: 0.85
  if:
    type: text
    regex: 'https?://[^/]{1,120}/[^/\n]{0,120}(gate|cmd|shell|payload)\.php'
  not:
  - substr: https://video.sibnet.ru/shell.php
