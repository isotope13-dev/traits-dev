# URI vocabulary is useful evidence, but establishes neither a beacon nor theft.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.92
traits:
  - id: ilog-php-i-query-path
    desc: ilog.php path with i query parameter
    if:
      type: text
      substr: /ilog.php?i=
  - id: log-php-uid-query-path
    desc: log.php path with UID query parameter
    if:
      type: text
      substr: /log.php?uid=
  - id: fg-php-uid-query-path
    desc: fg.php path with UID query parameter
    if:
      type: text
      substr: fg.php?uid=
composite_rules:
  - id: multiple-php-query-paths
    desc: Multiple PHP query-path templates
    conf: 0.95
    needs: 2
    any:
      - id: ilog-php-i-query-path
      - id: log-php-uid-query-path
      - id: fg-php-uid-query-path
  - id: php-log-uid-http-vocabulary
    desc: PHP log and UID paths beside HTTP vocabulary
    conf: 0.98
    all:
      - id: fg-php-uid-query-path
      - id: php-log-script-path
      - id: micro-behaviors/communications/http/user-agent::user-agent-header
    any:
      - id: micro-behaviors/fs/path/application/executable::chrome-process-name
      - id: micro-behaviors/dylib/library/family::libcurl-ref
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
      - id: micro-behaviors/communications/http/post::native-post-method-token
    unless:
      - id: metadata/signed/platform::microsoft
