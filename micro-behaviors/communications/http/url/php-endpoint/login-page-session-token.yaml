defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.88
traits:
  - id: login-page-long-session-token
    desc: Login page URL carries long session token
    if:
      type: text
      regex: '(?i)login\.php\?[\w=&%.-]{0,40}session_?id=[A-Za-z0-9]{48,}'
  # PayPal's genuine login flow lives on paypal.com paths ending in
  # ?cmd=_login-run&dispatch=<hex>; credential kits copy that parameter
  # structure onto their own bare login.php. A 32+ hex-char dispatch token
  # on a relative login page is the kit shape, not an application route.
  - id: login-page-long-dispatch-token
    desc: Login page URL carries long dispatch token
    if:
      type: text
      regex: '(?i)login\.php\?[\w=&%.-]{0,40}dispatch=[0-9a-f]{32,}'
  - id: login-page-forged-login-run-params
    desc: Login page URL forges _login-run parameters
    if:
      type: text
      regex: '(?i)login\.php\?[\w=&%.-]{0,40}_login-run&dispatch=[0-9a-f]{16,}'
