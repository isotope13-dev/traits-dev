defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - markdown
  - text
  - package.json
  crit: notable
traits:
- id: arena-apexfdn-host-reference
  desc: References arena.apexfdn.xyz HTTP endpoint
  crit: notable
  conf: 1.0
  if:
    type: text
    regex: https?://arena\.apexfdn\.xyz([/:?#]|$)
- id: apex-arena-router-host-reference
  desc: References apex-arena-router.com HTTP endpoint
  crit: notable
  conf: 1.0
  if:
    type: text
    regex: https?://([a-z0-9-]{1,63}\.){0,5}apex-arena-router\.com([/:?#]|$)
