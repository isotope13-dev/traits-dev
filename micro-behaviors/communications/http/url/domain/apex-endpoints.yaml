defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - markdown
  - text
  - package.json
  crit: notable
traits:
- id: arena-apexfdn-host-reference
  desc: References arena.apexfdn.xyz HTTP endpoint
  crit: notable
  conf: 1.0
  if:
    type: text
    regex: https?://arena\.apexfdn\.xyz([/:?#]|$)
- id: apex-arena-router-host-reference
  desc: References apex-arena-router.com HTTP endpoint
  crit: notable
  conf: 1.0
  if:
    type: text
    regex: https?://([a-z0-9-]{1,63}\.){0,5}apex-arena-router\.com([/:?#]|$)
- id: apex-copilot-score-api-path
  desc: Apex Copilot scoring API path segment
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: /api/copilot/v1/score
- id: apexfdn-copilot-mcp-package-reference
  desc: References @apexfdn/copilot-mcp package name
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: '@apexfdn/copilot-mcp'
