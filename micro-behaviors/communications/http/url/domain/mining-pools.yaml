defaults:
  platforms: [windows, linux, macos]
  for: [scripts, pe, elf, macho]
  crit: notable
  conf: 0.9

composite_rules:
- id: known-mining-pool-reference
  desc: References a known mining pool
  any:
  - id: micro-behaviors/communications/http/url/domain::zerodaypool-ru
  - id: micro-behaviors/communications/http/url/domain::xmrpool-eu
  - id: micro-behaviors/communications/http/url/domain::minexmr-com
  - id: micro-behaviors/communications/http/url/domain::supportxmr-com
  - id: micro-behaviors/communications/http/url/domain::nanopool-org
  - id: micro-behaviors/communications/http/url/domain::f2pool-com
  - id: micro-behaviors/communications/http/url/domain::hashvault-pro
  - id: micro-behaviors/communications/http/url/domain::pool-minergate-com
  - id: micro-behaviors/communications/http/url/domain::moneroocean-stream
  - id: micro-behaviors/communications/http/url/domain::pool-minexmr
  - id: micro-behaviors/communications/http/url/domain::moneroocean-string
  - id: micro-behaviors/communications/http/url/domain::c3pool-domain
