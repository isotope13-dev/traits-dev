defaults:
  platforms: [windows]
  for: [pe]

traits:

  - id: wecan-hasthe-upload-endpoint
    desc: Wecan Hasthe VM-garden HTTP upload endpoint
    crit: notable
    conf: 0.98
    if:
      # UPX-packed builds interrupt the hostname with short runs of binary
      # sentinels. Preserve the complete fixed host and path on both sides so a
      # generic damaged URL cannot satisfy this endpoint observation.
      type: raw
      regex: 'http://wecan\.hasthe\.techno(logy|[^A-Za-z0-9.]{1,8}logy)/upload'

  - id: wecan-hasthe-upload-prefix--upx
    desc: Wecan Hasthe URL prefix in packed data
    crit: component
    conf: 0.99
    if:
      type: text
      substr: http://wecan.hasth
      section: UPX1

  - id: wecan-hasthe-upload-suffix--upx
    desc: Wecan Hasthe URL suffix in packed data
    crit: component
    conf: 0.96
    if:
      type: text
      exact: logy/upload
      section: UPX1
