traits:
- platforms:
  - unix
  - windows
  for:
  - python
  id: amazon-commerce-domain
  desc: Amazon commerce domain reference
  crit: notable
  if:
    type: text
    substr: amazon.com
  unless:
  - id: metadata/package/documentation/page::install-doc-basename
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/lib/cloud/botocore::aws-python-sdk-source
  - id: well-known/lib/cloud/botocore::amazon-sdk-copyright
  - id: well-known/lib/cloud/awscli::awscli-wheel-context
  - type: path
    regex: (?i)awscli
