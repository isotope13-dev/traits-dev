defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
- id: amazon-commerce-domain
  desc: Amazon commerce domain reference
  if:
    type: text
    substr: amazon.com
  unless:
  - id: "metadata/file/naming::readme-requirements-install-basename"
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/lib/cloud/botocore::aws-python-sdk-source
  - id: well-known/lib/cloud/botocore::amazon-sdk-copyright
  - type: path
    regex: (?i)awscli
- id: taobao-commerce-domain
  desc: Taobao commerce domain reference
  if:
    type: text
    substr: taobao.com
- id: sycm-taobao-domain
  desc: Sycm Taobao analytics domain reference
  if:
    type: text
    substr: sycm.taobao
