# Where a casual-game promotion sends the user, in either of the two forms it
# takes: a branded host in script, or a hyperlink catalog in markup. One
# umbrella over both so a rule that cares only about the destination has a
# single leg to name, and a sample that carries the destination reports it once.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.85

composite_rules:
  - id: game-promotion-destination
    desc: Casual-game promotion destination
    any:
      - id: js-game-label-promotion-url
      - id: js-unblocked-game-promotion-url
      - id: js-coolmath-game-promotion-url
      - id: js-solitaire-promotion-url
      - id: js-bowl-promotion-url
      - id: html-game-link-catalog
