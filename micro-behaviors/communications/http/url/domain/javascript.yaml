# Hardcoded remote host URLs in JavaScript / browser-extension code.
#
# In supply-chain and extension review, every remote host a script or extension
# contacts is a network IOC an analyst wants to see -- so a hardcoded http(s)
# URL to a named host is notable in this context. Notable, not suspicious: a
# hostname alone is not malicious, but it should never be invisible. Loopback,
# reserved example domains and schema/namespace URLs are excluded. Raw-IP URLs
# are handled (as suspicious) by ip/literal/browser.yaml, not here.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.75

traits:
  - id: pdfcompare-online-api-url
    desc: Connects to the pdfcompare.online API
    conf: 0.95
    if:
      type: string_literal
      exact: https://pdfcompare.online/api

  - id: js-remote-host-url
    desc: Contains a hardcoded remote HTTP(S) URL
    size_max: 4000000
    if:
      type: string_literal
      regex: 'https?://([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}'
    not:
      - regex: 'https?://(localhost|[^/"'']*\.local\b)'
      - regex: 'https?://([a-z0-9-]+\.)*example\.(com|org|net)'
      # Vocabulary/meta-schema hosts: w3.org, schema.org, and the JSON Schema
      # `$schema` identifier every zod/ajv bundle embeds. Never fetched.
      - regex: 'https?://(www\.)?(w3|schemas?\.[a-z]+|json-schema)\.org'
      # SemVer specification site referenced from CLI help / docs only.
      - regex: 'https?://(www\.)?semver\.org'
      # URI identifiers and documentation links are not network endpoints.
      - regex: 'https?://[^/"'']+/(types?|schemas?|issues?)(/|[?#]|$)'
      # Minified production bundles embed a link to the library's own error
      # documentation so a numbered error can be decoded (React's
      # reactjs.org/docs/error-decoder.html, MUI's mui.com/production-error/).
      # These ship in essentially every React/MUI build and are never fetched.
      # OpenAPI dialect identifiers are URI vocabulary constants, not
      # endpoints. The matcher above captures only scheme plus host.
      - regex: 'https?://(www\.)?spec\.openapis\.org'
      # Matched host-only: `if:` above captures just scheme+host, and `not:`
      # is applied to that matched span, so a path-based exclusion here would
      # never fire.
      - regex: 'https?://(www\.)?(reactjs|react)\.(org|dev)'
      - regex: 'https?://(www\.)?mui\.com'
      # Apple plist DTD identifiers are XML vocabulary, not fetched endpoints.
      - regex: 'https?://(www\.)?apple\.com'
      # Playwright Trace Viewer uses this synthetic origin while replaying
      # captured blob URLs. It is an internal document identity, not a host
      # the bundle contacts.
      - regex: 'https?://playwright\.bloburl'
    unless:
      - id: metadata/file/profile/locale::gettext-po-catalog
      # TeX sources can be misclassified as JavaScript because they contain
      # macro-like syntax; their documentation URLs are not JS endpoints.
      - type: basename
        regex: '\.tex$'
      - id: metadata/lang/source::linux-kernel-source-tree-path
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/package/testing/presence/harness/
      - id: metadata/document/html::doctype
      # Generated documentation chunks embed external links as page content;
      # those URLs are not endpoints contacted by the chunk.
      - id: metadata/file/profile/identity::docusaurus-docs-source
      # TextMate grammar modules quote URLs that their target languages can
      # recognize; the JavaScript module does not contact those hosts.
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: js-insecure-remote-http-url
    desc: Contains a hardcoded insecure HTTP URL
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: 'http://([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}'
    not:
      # XML/SVG namespace identifiers are URI constants, not insecure network
      # endpoints.  They are common in benign browser libraries.
      - regex: 'http://(www\.)?w3\.org'
      - regex: 'http://schemas?\.[^/"'']+'
      # JSON Schema `$schema` meta-schema identifiers; every zod/ajv bundle
      # embeds the draft-04/draft-07 pair and none of them is ever fetched.
      - regex: 'http://json-schema\.org'
      - regex: 'http://(www\.)?apple\.com'
      # SemVer specification site referenced from CLI help / docs only.
      - regex: 'http://(www\.)?semver\.org'
      # Same rationale, for the vocabulary hosts every RSS/Atom/RDF parser and
      # feed generator embeds: purl.org / purl.oclc.org are permanent-identifier
      # registries (Dublin Core, RSS 1.0, content module), my.netscape.com is
      # the RSS 0.9 namespace and prismstandard.org the PRISM one.  These name
      # vocabularies; nothing fetches them.  Host-anchored, since the evidence
      # string is only the scheme+host the matcher captured.
      - regex: 'http://(purl\.org|purl\.oclc\.org|my\.netscape\.com|prismstandard\.org)'
      # XML namespace and documentation URIs are not request endpoints.
      - regex: 'http://soap\.sforce\.com'
      - regex: 'http://(www\.)?momentjs\.com'
      # React/prop-types bundles embed this troubleshooting link in exception
      # text; it is documentation, not an endpoint contacted at runtime.
      # The string-literal matcher records the scheme and host as evidence,
      # so exclude the documentation host rather than its uncaptured path.
      - regex: 'http://fb\.me\b'
      # Synthetic origin used by Playwright Trace Viewer for captured blobs.
      - regex: 'http://playwright\.bloburl'
    unless:
      # TeX sources can be misclassified as JavaScript because they contain
      # macro-like syntax; their documentation URLs are not JS endpoints.
      - type: basename
        regex: '\.tex$'
      - id: metadata/lang/source::linux-kernel-source-tree-path
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/package/testing/presence/harness/
      - id: metadata/document/html::doctype
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  # Game-promotion / newtab-hijack adware carries a casual-game brand at the
  # start of a DNS label (gameograf.com, unblockedgames66.com,
  # coolmathgames.com, solitaire.org). Requiring a label boundary prevents
  # ordinary words such as boardgamearena.com from being treated as promotion
  # hosts.
  - id: js-game-label-promotion-url
    desc: Game-branded host URL in JS
    if:
      type: string_literal
      regex: 'https?://([\w-]+\.)*game[\w-]*\.[a-z]{2,}([/?#]|$)'
      case_insensitive: true
    unless:
      - id: metadata/document/html::doctype
  - id: js-unblocked-game-promotion-url
    desc: Unblocked-game host URL in JS
    if:
      type: string_literal
      regex: 'https?://([\w-]+\.)*unblockedgames[0-9]*\.[a-z]{2,}([/?#]|$)'
      case_insensitive: true
    unless:
      - id: metadata/document/html::doctype
  - id: js-coolmath-game-promotion-url
    desc: Coolmath game host URL in JS
    if:
      type: string_literal
      regex: 'https?://([\w-]+\.)*coolmathgames\.[a-z]{2,}([/?#]|$)'
      case_insensitive: true
    unless:
      - id: metadata/document/html::doctype
  - id: js-solitaire-promotion-url
    desc: Solitaire game host URL in JS
    if:
      type: string_literal
      regex: 'https?://([\w-]+\.)*solitaire\.[a-z]{2,}([/?#]|$)'
      case_insensitive: true
    unless:
      - id: metadata/document/html::doctype
  - id: js-bowl-promotion-url
    desc: Bowl game host URL in JS
    if:
      type: string_literal
      regex: 'https?://([\w-]+\.)*bowl\.[a-z]{2,}([/?#]|$)'
      case_insensitive: true
    unless:
      - id: metadata/document/html::doctype
  - id: chrome-webstore-detail-url
    desc: Chrome Web Store detail page URL
    conf: 0.9
    if:
      type: text
      regex: 'https?://(chrome\.google\.com/webstore/detail/|chromewebstore\.google\.com/detail/)'
      case_insensitive: true

  # Apex DNS suffix stored as a leading-dot string (e.g. '.callback.example.com')
  # so identity labels can be prepended into an FQDN for HTTPS/DNS beacons.
  # Require at least subdomain.domain.tld (two dotted labels before the TLD)
  # and a conventional two- or three-letter TLD. This rejects dotted CSS
  # selectors and minified property paths such as `.font.body.tracking.tight`.
  - id: js-leading-dot-dns-suffix
    desc: Leading-dot DNS suffix string literal
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '^\.([a-z0-9-]+\.){2,}[a-z]{2,3}$'
    unless:
      # Source-map filenames have the same dotted shape but are local paths.
      - type: string_literal
        regex: '\.(js|css)\.map$'

composite_rules:
  # `js-game-promotion-url` moved to game-promotion.yaml in this directory as
  # `game-promotion-destination`, which also takes in the HTML link-catalog
  # form. Two umbrellas over one destination — one per source language — meant
  # a promo host reported itself three times: the branded-host atom, the JS
  # umbrella, and the umbrella over that.
