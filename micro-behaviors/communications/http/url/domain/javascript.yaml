defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.75
traits:
- id: pdfcompare-online-api-url
  desc: Connects to the pdfcompare.online API
  conf: 0.95
  if:
    type: string_literal
    exact: https://pdfcompare.online/api
- id: js-http-url-literal-in-file-tail
  desc: HTTP(S) URL literal in file tail
  conf: 0.85
  size_min: 4096
  if:
    type: text
    regex: '["''`]https?://[A-Za-z0-9.-]{4,80}/[^"''`\s]{0,200}["''`]'
    offset_range:
    - -2048
    - null
  not:
  - regex: https?://(www\.)?(w3|schema)\.org/
  - regex: https?://images\.unsplash\.com/
- id: js-script-url-function-call-in-file-tail
  desc: Tail call passes remote script URL
  conf: 0.9
  size_min: 4096
  if:
    type: text
    regex: \b\w+\(\s*["']https?://[^"'\s]{4,160}\.js["']\s*\)
    offset_range:
    - -2048
    - null
- id: js-remote-host-url
  desc: Contains a hardcoded remote HTTP(S) URL
  size_max: 4000000
  if:
    type: string_literal
    regex: (^|["'(]|\b(curl|wget)[^\r\n]{0,160}[ \t])https?://([a-z0-9-]+\.)+[a-z]{2,}
    case_insensitive: true
  not:
  - regex: https?://[^/"']+\.(invalid|test|localhost|example)(/|$)
  - regex: https?://(localhost|[^/"']*\.local\b)
  - regex: https?://([a-z0-9-]+\.)*example\.(com|org|net)
  - regex: https?://(www\.)?(w3|schemas?\.[a-z]+|json-schema)\.org
  - regex: https?://(www\.)?semver\.org
  - regex: https?://[^/"']+/(types?|schemas?|issues?)(/|[?#]|$)
  - regex: https?://(www\.)?spec\.openapis\.org
  - regex: https?://(www\.)?(reactjs|react)\.(org|dev)
  - regex: https?://(www\.)?mui\.com
  - regex: https?://(www\.)?apple\.com
  - regex: https?://playwright\.bloburl
  unless:
  - id: metadata/lang/locale::gettext-po-catalog
  - type: basename
    regex: \.tex$
  - id: metadata/lang/upstream::linux-kernel-source-tree-path
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/package/testing/presence/harness/
  - id: metadata/document/html::doctype
  - id: metadata/package/documentation/page::docusaurus-docs-source
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: metadata/path::test-directory-component
- id: js-environment-url-fallback
  desc: Environment overrides an HTTP URL default
  conf: 0.9
  if:
    type: text
    regex: process\.env\.[A-Z0-9_]*(URL|ENDPOINT|SERVER)\s*\|\|\s*["']https?://
- id: js-insecure-remote-http-url
  desc: Contains a hardcoded insecure HTTP URL
  conf: 0.9
  if:
    type: string_literal
    regex: ^http://([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(/[^\s"']*)?
  not:
  - regex: http://(www\.)?w3\.org
  - regex: http://schemas?\.[^/"']+
  - regex: ^http://s3\.amazonaws\.com/doc/
  - regex: http://json-schema\.org
  - regex: http://(www\.)?apple\.com
  - regex: http://(www\.)?semver\.org
  - regex: http://(purl\.org|purl\.oclc\.org|my\.netscape\.com|prismstandard\.org)
  - regex: http://soap\.sforce\.com
  - regex: http://(www\.)?momentjs\.com
  - regex: http://fb\.me\b
  - regex: http://playwright\.bloburl
  unless:
  - type: basename
    regex: \.tex$
  - id: metadata/lang/upstream::linux-kernel-source-tree-path
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/package/testing/presence/harness/
  - id: metadata/document/html::doctype
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: metadata/path::test-directory-component
- id: js-game-label-promotion-url
  desc: Game-branded host URL in JS
  if:
    type: string_literal
    regex: https?://([\w-]+\.)*game[\w-]*\.[a-z]{2,}([/?#]|$)
    case_insensitive: true
  unless:
  - id: metadata/document/html::doctype
- id: js-unblocked-game-promotion-url
  desc: Unblocked-game host URL in JS
  if:
    type: string_literal
    regex: https?://([\w-]+\.)*unblockedgames[0-9]*\.[a-z]{2,}([/?#]|$)
    case_insensitive: true
  unless:
  - id: metadata/document/html::doctype
- id: js-coolmath-game-promotion-url
  desc: Coolmath game host URL in JS
  if:
    type: string_literal
    regex: https?://([\w-]+\.)*coolmathgames\.[a-z]{2,}([/?#]|$)
    case_insensitive: true
  unless:
  - id: metadata/document/html::doctype
- id: js-solitaire-promotion-url
  desc: Solitaire game host URL in JS
  if:
    type: string_literal
    regex: https?://([\w-]+\.)*solitaire\.[a-z]{2,}([/?#]|$)
    case_insensitive: true
  unless:
  - id: metadata/document/html::doctype
- id: js-bowl-promotion-url
  desc: Bowl game host URL in JS
  if:
    type: string_literal
    regex: https?://([\w-]+\.)*bowl\.[a-z]{2,}([/?#]|$)
    case_insensitive: true
  unless:
  - id: metadata/document/html::doctype
- id: chrome-webstore-detail-url
  desc: Chrome Web Store detail page URL
  conf: 0.9
  if:
    type: text
    regex: https?://(chrome\.google\.com/webstore/detail/|chromewebstore\.google\.com/detail/)
    case_insensitive: true
- id: chrome-webstore-listing-url
  desc: Chrome Web Store listing URL
  if:
    type: text
    regex: chromewebstore\.google\.com/|chrome\.google\.com/webstore
    case_insensitive: true
- id: google-gsi-client-script-url
  desc: Google Identity Services client script URL
  conf: 0.95
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    substr: accounts.google.com/gsi/client
- id: eloqua-tracking-script-url
  desc: Oracle Eloqua tracking script URL
  conf: 0.95
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    substr: img.en25.com/i/elqCfg
- id: js-leading-dot-dns-suffix
  desc: Leading-dot DNS suffix string literal
  conf: 0.9
  if:
    type: string_literal
    regex: ^\.([a-z0-9-]+\.){2,}[a-z]{2,3}$
  unless:
  - type: string_literal
    regex: \.(js|css)\.map$
- id: javascript-anthropic-branded-off-vendor-api-host
  desc: HTTPS URL uses non-vendor Anthropic-like host
  if:
    type: text
    regex: https://[\w.-]*anthropic[\w.-]*\.[a-z]{2,}
  not:
  - regex: ^https://([\w-]+\.)*anthropic\.com$
composite_rules:
- id: js-hardcoded-remote-endpoint
  desc: Hardcoded remote HTTP endpoint (host or IP)
  conf: 0.92
  any:
  - id: js-remote-host-url
  - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
