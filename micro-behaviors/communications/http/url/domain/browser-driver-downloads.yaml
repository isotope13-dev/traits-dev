defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  size_max: 5000000

traits:
- id: official-chromedriver-url
  desc: Official ChromeDriver URL
  crit: notable
  conf: 0.95
  if:
    type: literal
    regex: '^https?://chromedriver\.storage\.googleapis\.com(/|$)'
    exclude_docstrings: true
- id: official-chrome-for-testing-gcs-url
  desc: Official Chrome for Testing GCS URL
  crit: notable
  conf: 0.98
  if:
    type: literal
    regex: '^https?://storage\.googleapis\.com/chrome-for-testing-public(/|$)'
    exclude_docstrings: true
- id: official-chrome-for-testing-metadata-url
  desc: Chrome for Testing metadata JSON URL
  crit: notable
  conf: 0.98
  if:
    type: literal
    regex: '^https?://googlechromelabs\.github\.io/chrome-for-testing(/|$)'
    exclude_docstrings: true
- id: official-geckodriver-github-release-url
  desc: Official GeckoDriver GitHub release URL
  crit: notable
  conf: 0.98
  if:
    type: literal
    regex: '^https?://github\.com/mozilla/geckodriver/releases(/|$)'
    exclude_docstrings: true

composite_rules:
- id: official-browser-driver-download-urls
  desc: Official browser WebDriver download URLs
  crit: notable
  conf: 0.96
  any:
  - id: official-chrome-for-testing-gcs-url
  - id: official-chrome-for-testing-metadata-url
  - id: official-geckodriver-github-release-url
  - id: official-chromedriver-url
