defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: extension-external-url-literal
    desc: Extension contains external HTTP URL literal
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
      - id: micro-behaviors/browser-extension/lifecycle::browser-namespace
    unless:
      - id: well-known/lib/format/sheetjs-xlsx/

