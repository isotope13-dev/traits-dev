defaults:
  for: [binaries, scripts, source]
  platforms: [unix, windows]

traits:
  - id: workers-dev-domain
    desc: Cloudflare Workers domain reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)(^|[^\w.-])[\w.-]{1,253}\.workers\.dev([^\w.-]|$)'
    unless:
      - id: metadata/package/quality/
      - id: metadata/file/catalog/identity::ad-tracker-domain-catalog

  - id: workers-dev-url
    desc: HTTP(S) URL pointing to Cloudflare Workers
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)https?://[\w.-]{1,253}\.workers\.dev([^\w.-]|$)'
