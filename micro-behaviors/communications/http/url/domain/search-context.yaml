defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: search-engine-google-host
    desc: Google hostname text fragment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["''][^"'']{0,20}google\.'

  - id: search-engine-bing-host
    desc: Bing hostname text fragment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["''][^"'']{0,20}bing\.'

composite_rules:
  - id: search-engine-hostname-gate
    desc: Hostname search near a search-engine reference
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/string/search::hostname-includes-call
    any:
      - id: micro-behaviors/communications/http/url/domain::search-engine-google-host
      - id: micro-behaviors/communications/http/url/domain::search-engine-bing-host
    near_bytes: 120

