# Hostnames of public AI chat web apps. A single reference is ordinary (a
# new-tab shortcut tile, a docs link); automation composites under
# objectives/impact/ui/manipulation/automation/ pair it with input dispatch or
# anti-capture behavior. Moved from there: the matcher is one host literal,
# not an automation target set.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: ai-chat-web-host
    desc: References an AI chat web app host
    if:
      type: text
      regex: '(?i)(gemini\.google\.com|claude\.ai|huggingface\.co|chatgpt\.com)'
