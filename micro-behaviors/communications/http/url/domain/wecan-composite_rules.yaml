defaults:
  platforms: [windows]
  for: [pe]

composite_rules:

  - id: wecan-hasthe-upload-endpoint--upx-fragmented
    desc: Fragmented Wecan Hasthe upload endpoint in packed data
    crit: notable
    conf: 0.995
    all:
    - id: wecan-hasthe-upload-prefix--upx
    - id: wecan-hasthe-upload-suffix--upx
    # The complete endpoint atom already accepts the short binary interruption
    # observed in packed builds. Keep this fallback for more severely
    # split strings without reporting a second, misleading "fragmented" URL on
    # an intact endpoint.
    unless:
    - id: wecan-hasthe-upload-endpoint
