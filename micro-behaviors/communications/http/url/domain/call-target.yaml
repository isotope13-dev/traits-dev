defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go, rust, perl, powershell]
  crit: notable
  conf: 0.95
traits:
  - id: literal-http-call-target
    desc: HTTP call receives a literal URL
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(post|Post|fetch|Invoke-WebRequest)$'
      arg:
        kind: string
        regex: '^https?://'
  - id: javascript-request-explicit-destination
    for: [javascript, typescript]
    desc: Node request has an explicit destination
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @http property: (property_identifier) @request)
          arguments: (arguments (object (pair key: (property_identifier) @hostname value: (string) @target)))) @send
          (#match? @http "^https?$")
          (#eq? @request "request")
          (#eq? @hostname "hostname"))
        ((call_expression
          function: (member_expression object: (identifier) @http property: (property_identifier) @request)
          arguments: (arguments [(string) (template_string)] @target)) @send
          (#match? @http "^https?$")
          (#eq? @request "request")
          (#match? @target "https?://"))
composite_rules:
  - id: explicit-http-request-destination
    desc: Explicit URL or host in HTTP call
    any:
      - id: literal-http-call-target
      - id: javascript-request-explicit-destination
      - id: micro-behaviors/communications/http/message::powershell-http-url-literal
