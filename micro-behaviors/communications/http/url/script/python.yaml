# A script URL reference does not establish a download. Includes documentation.
defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: python-code-url-reference
    desc: Python script or bytecode URL literal
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[\w-]{1,40}(\.[\w-]{1,40})+/[^\s''"]{0,120}\.pyc?([?#][^\s''"]{0,120})?$'

