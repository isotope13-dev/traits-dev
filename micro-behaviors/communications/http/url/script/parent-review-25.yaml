traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  id: executable-url-reference-embedded
  desc: Executable URL inside a longer literal
  crit: notable
  conf: 0.88
  if:
    type: string_literal
    regex: https?://[^\s'"]{1,160}\.(exe|scr|msi|bat|cmd|ps1)([?#][^\s'"]{0,120})?["'\s]
  unless:
  - id: metadata/package/documentation/page::documentation-heading-html-page
