traits:
- platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  - typescript
  - scripts
  id: public-ip-installer-url-reference
  desc: Installer URL references a bare public IP
  crit: notable
  conf: 0.93
  if:
    type: text
    is: external_ip
    regex: (?i)https?://(\d{1,3}\.){3}\d{1,3}(:\d{2,5})?/[^\s"'<>]{0,120}\.(msi|exe|pkg|dmg)\b
  not:
  - regex: //(10|127|0|169)\.
  - regex: //192\.168\.
  - regex: //172\.(1[6-9]|2[0-9]|3[01])\.
  - regex: cgi-(win|bin)/
  - regex: AMG_?\.exe
  unless:
  - id: well-known/tool/development/build/homebrew/
  - id: metadata/package/manager::homebrew-cask-class
  - id: metadata/package/manager::homebrew-formula-class
