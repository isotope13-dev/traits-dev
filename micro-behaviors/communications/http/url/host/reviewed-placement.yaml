traits:
- for:
  - scripts
  - source
  - html
  - asp
  id: loopback-http-url-reference
  desc: References a loopback HTTP URL
  if:
    type: text
    regex: https?://(127\.0\.0\.1|localhost|0\.0\.0\.0)
  unless:
  - type: text
    regex: window\.location\.(origin|href)
  - id: metadata/package/testing/presence/harness::go-test-file
- for:
  - python
  id: loopback-https-url-or-proxy-text
  desc: Loopback HTTPS URL or proxy token
  if:
    type: text
    regex: PROXY_HTTPS|local_https_proxy|https://(127\.0\.0\.1|localhost)
- for:
  - html
  id: html-loopback-host-reference
  desc: HTML references a loopback HTTP(S) URL
  if:
    type: text
    regex: (?i)https?://(127\.0\.0\.1|localhost|0\.0\.0\.0)(:\d+)?/
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
