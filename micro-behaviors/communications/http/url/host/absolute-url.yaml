defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable

traits:
  - id: fetch-absolute-url-target
    desc: Fetch or XHR targets an absolute URL
    conf: 0.9
    if:
      type: text
      # An absolute http(s) target is the off-origin destination fact:
      # same-origin relative calls (every first-party web UI) do not match.
      regex: '(?is)(\bfetch\s*\(\s*["'']https?://|\bopen\s*\(\s*["''][A-Z]+["'']\s*,\s*["'']https?://)'
