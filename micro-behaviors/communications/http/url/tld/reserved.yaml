# RFC 2606 / RFC 6761 reserved TLDs used only in documentation, examples, and
# test fixtures.  URLs under these names are not reachable on the public
# Internet and must not drive hostile exfiltration conclusions by themselves.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, documents]
  crit: notable

traits:
  - id: reserved-documentation-tld-url
    desc: URL uses RFC 2606 reserved documentation TLD
    conf: 0.95
    if:
      type: text
      regex: 'https?://[A-Za-z0-9._\-]{1,80}\.(test|example|invalid|localhost)(/|:|$)'
