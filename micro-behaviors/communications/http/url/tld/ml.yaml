defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: notable
  conf: 0.8

traits:
  - id: ml-url-binary
    desc: Binary contains a .ml URL
    if:
      type: text
      regex: 'https?://[A-Za-z0-9.-]{1,120}\.ml([:/?#\s"''<>]|$)'
    not:
      - regex: '^\s*#'
      - regex: '^\s*!'
      - substr: https://clear.ml/
      - substr: https://api.bfl.ml/
    unless:
      - id: well-known/tool/offensive/projectdiscovery/
      - id: well-known/lib/core/youtube-dl/
      - id: well-known/lib/core/youtube-dl::youtube-dl-package-context
      - id: metadata/package/documentation/source-documentation::package-doc-reference-basename
      - id: metadata/file/format/markup::adblock-filter-list
      - type: path
        regex: '(^|[\\/])README\.(md|markdown|txt)$'

  - id: ml-url-python-request
    desc: Python HTTP call uses a .ml URL
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\b(requests|httpx)\.(get|post)\([^)]{0,240}https?://[^)]{1,120}\.ml'
    unless:
      - id: well-known/tool/offensive/projectdiscovery/
      - id: well-known/lib/core/youtube-dl/
      - id: well-known/lib/core/youtube-dl::youtube-dl-package-context
      - id: metadata/file/format/markup::adblock-filter-list

  - id: ml-url-requests-request
    desc: Python requests call uses a .ml URL
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\brequests\.request\([^)]{0,240}https?://[^)]{1,120}\.ml'
    unless:
      - id: well-known/tool/offensive/projectdiscovery/
      - id: well-known/lib/core/youtube-dl/
      - id: well-known/lib/core/youtube-dl::youtube-dl-package-context
      - id: metadata/file/format/markup::adblock-filter-list
