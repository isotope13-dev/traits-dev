defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  attack: T1071
traits:
  - id: tld-tk-url
    desc: URL uses .tk top-level domain
    crit: notable
    conf: 0.8
    for: [binaries, documents]
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.tk([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*!
      - regex: ^\s*//
      - regex: '(?i)^\s*[+\-]?\s*https?://[^/\s]*mirror[^/\s]*\.tk/ubuntu/'
      - substr: https://www.tcl.tk/
      - substr: http://www.tcl.tk/
      - substr: http://calimero.tk/
      - substr: tip.tcl.tk
      - substr: core.tcl.tk
    unless:
      - id: metadata/file/format/markup::unified-diff
      - type: basename
        regex: ^api-(temp|test)\.js$
      - id: metadata/package/documentation::package-doc-reference-basename
      - id: metadata/library/generated::sphinx-searchindex-js
      - id: metadata/package/documentation::documentation-dir-path
      - id: metadata/package/documentation::markdown-documentation-path
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/lib/data/easylist::bundle-marker
      - id: well-known/app/browser-extension/ublock-origin::filter-bundle
  - id: script-tld-tk-url
    desc: Script URL using .tk top-level domain
    crit: notable
    conf: 0.8
    for: [scripts]
    if:
      type: literal
      regex: https?://[A-Za-z0-9.-]{1,120}\.tk([:/?#\s"'<>]|$)
    not:
      - substr: https://www.tcl.tk/
      - substr: http://www.tcl.tk/
      - substr: http://calimero.tk/
      - substr: tip.tcl.tk
      - substr: core.tcl.tk
      - substr: paste.tclers.tk
  - id: tld-cc
    desc: Contains a URL with the .cc TLD
    conf: 0.75
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.cc(:[0-9]{1,5})?([/?#\s"'<>]|$)
    not:
      - substr: ghps.cc
    unless:
      - id: well-known/lib/ui/highlight-js::bundled-library
  # The line-shape guards below sit in `downgrade:`, not `not:`. A `not:` filter
  # is handed the matched string only — here just the URL — so a pattern
  # describing the line the URL sits on can never fire from there: the `^\s*#`
  # and `^\s*//` entries that used to live in this trait's `not:` list were
  # inert, and a .xyz link in a comment scored exactly like a contacted host.
  # The `*` form is the one that was missing entirely — JSDoc/KDoc continuation
  # lines carry documentation links (`* [Spec](https://docs.<vendor>.xyz/...)`),
  # a citation rather than infrastructure this file talks to.
  #
  # Downgrade rather than suppress, because the two readings are not exclusive:
  # a file may cite a .xyz in a comment *and* contact one from code. Dropping to
  # baseline de-emphasizes the comment-only case in triage while keeping the
  # observation in JSON, the web UI, and version-to-version diffs, where a
  # newly-appearing .xyz reference is worth seeing however it is spelled. In the
  # mixed case the live URL still reports at notable through the host/download
  # atoms that read string literals, so nothing is lost.
  #
  # Deliberately not the generic `communications/url/encoded::*-commented-url-
  # line-context` atoms: those match a comment line holding *any* URL, which
  # nearly every source file has, so downgrading on them would flatten real .xyz
  # findings. The `.xyz` has to be on the comment line itself.
  - id: tld-xyz
    desc: URL using .xyz top-level domain
    conf: 0.75
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.xyz([:/?#\s"'<>]|$)
    downgrade:
      any:
        - type: text
          regex: '(?m)^\s*#.{0,80}\.xyz'
        - type: text
          regex: '(?m)^\s*//.{0,80}\.xyz'
        - type: text
          regex: '(?m)^\s*\*.{0,80}\.xyz'
        - type: text
          regex: '(?m)^\s*Server\s*=.{0,60}\.xyz'
    not:
      - substr: https://ainodes.xyz
      - substr: https://ario.koltigin.xyz/graphql
      - substr: together.xyz
      - substr: cljdoc.xyz
      - substr: repo.shorin.xyz
      - substr: gh.api.99988866.xyz
      - substr: ghproxy.1888866.xyz
      - substr: github.moeyy.xyz
  - id: tld-su
    desc: URL using .su top-level domain
    conf: 0.85
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.su([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
  - id: tld-sbs
    desc: URL using .sbs top-level domain
    conf: 0.85
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.sbs([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
  - id: tld-online
    desc: Contains a URL using the .online TLD
    conf: 0.75
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.online([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
  - id: tld-life
    desc: URL using .life top-level domain
    conf: 0.75
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.life([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//

  # A .ga URL embedded in a source file is not, by itself, C2 evidence. Keep
  # the broad binary atom useful for endpoint triage, and use a call-scoped
  # source atom so registry/TLD tables and documentation do not look like
  # contacted infrastructure.
  - id: tld-ga-binary-url
    desc: Binary URL using .ga top-level domain
    crit: notable
    conf: 0.8
    for: [binaries]
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.ga([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*!
      - substr: https://educourse.ga/

  - id: tld-ga-source-request
    desc: Python call contains .ga URL
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: 'https?://[A-Za-z0-9.-]{1,120}\.ga([:/?#\s"''<>]|$)'
    unless:
      - id: well-known/tool/offensive/projectdiscovery/
