defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
traits:
- crit: notable
  id: tld-icu
  desc: HTTP URL with .icu hostname suffix
  conf: 0.85
  if:
    type: text
    regex: https?://[A-Za-z0-9.-]{1,120}\.icu([:/?#\s"'<>]|$)
  not:
  - regex: ^\s*#
  - regex: ^\s*//
  unless:
  - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
- crit: notable
  id: tld-pw
  desc: HTTP URL with .pw hostname suffix
  conf: 0.8
  if:
    type: text
    regex: https?://[A-Za-z0-9.-]{1,120}\.pw([:/?#\s"'<>]|$)
  unless:
  - id: well-known/lib/data/holidays::country-calendar-module
  - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
  not:
  - regex: ^\s*#
  - regex: ^\s*//
