defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - pyproject.toml
  - markdown
  - text
  conf: 0.97
  size_min: 32
  size_max: 500000000
  id: home-assistant-core-repository-reference
  desc: References Home Assistant core repository
  if:
    type: text
    substr: github.com/home-assistant/core
- for:
  - pkginfo
  - markdown
  conf: 0.99
  size_min: 1
  size_max: 50000000
  id: astral-ty-repository-reference
  desc: References Astral ty repository
  if:
    type: text
    substr: github.com/astral-sh/ty
