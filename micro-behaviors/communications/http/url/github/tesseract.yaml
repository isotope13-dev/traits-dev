# A model download reference does not identify the referencing binary as OCR.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, text]
  size_min: 1024
  size_max: 500000000
traits:
  - id: tesseract-upstream-model-url
    desc: Tesseract traineddata repository URL reference
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: github.com/tesseract-ocr/tessdata
