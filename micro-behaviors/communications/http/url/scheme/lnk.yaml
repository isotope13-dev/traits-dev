defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:

  - id: lnk-https-argument
    desc: LNK arguments contain HTTPS URL
    crit: notable
    conf: 0.75
    if:
      type: value
      path: lnk.arguments
      substr: 'https://'

  - id: lnk-http-url-reference
    desc: LNK arguments reference an HTTP URL
    crit: notable
    conf: 0.8
    if:
      type: value
      path: lnk.arguments
      substr: http://
