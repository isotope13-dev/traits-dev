defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: percent-u-little-endian-http-prefix
    desc: HTTP prefix in percent-u packed bytes
    if:
      type: text
      regex: "(?i)%u7474%u3a70%u2f2f"
  - id: percent-u-http-prefix-concat-words
    desc: HTTP prefix words joined across string concats
    if:
      type: text
      regex: "(?i)%u7468([\"' +]{0,12})%u7074([\"' +]{0,12})%u2f3a"
