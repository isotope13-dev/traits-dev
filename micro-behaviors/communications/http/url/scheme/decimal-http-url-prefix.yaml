# Exact character-code representation of a semantic token; not a filename IOC.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: decimal-http-url-prefix
    desc: "Decimal encoded HTTP URL prefix"
    crit: notable
    if:
      type: text
      substr: "104,116,116,112,58,47,47"
