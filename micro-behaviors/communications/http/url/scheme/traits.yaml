# Scheme-level HTTP observations (cleartext vs TLS), independent of host
# reputation. Stealers and droppers often hardcode http:// webhooks; benign
# bundles also embed documentation and XML namespace URIs that must be excluded.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1071.001

traits:
  - id: cleartext-http-url
    desc: Cleartext http:// URL
    # Raw text is necessary for binaries and languages where an endpoint may
    # be an unquoted command argument. Parsed languages use the literal rule
    # below so comments cannot masquerade as runtime URLs.
    for: [pe, shell, batch]
    if:
      type: text
      regex: '(?i)\bhttp://[a-z0-9][a-z0-9.-]{1,120}(/[a-zA-Z0-9._~!$&''()*+,;=:@%/-]{0,80})?'
    unless:
      - id: metadata/file/profile/locale::binary-lang-string-catalog
      # Unit/integration test trees commonly hardcode fixture hosts (xkcd,
      # httpbin, Betamax demos). Those are not C2 endpoints.
      - type: path
        regex: '(?i)(^|/)(src/)?test(s)?/'
      - type: path
        regex: '(?i)(^|/)\.buildscript/'
    not:
      # XML/SVG/namespace and documentation URIs are not client endpoints.
      - regex: '(?i)http://(www\.)?w3\.org'
      - regex: '(?i)http://(www\.)?iana\.org\b'
      - regex: '(?i)http://schemas?\.'
      - regex: '(?i)http://json-schema\.org'
      - regex: '(?i)http://(purl\.org|purl\.oclc\.org|fb\.me)\b'
      - regex: '(?i)http://(www\.)?apple\.com'
      # Loopback/test servers are covered by dedicated loopback traits.
      - regex: '(?i)http://(localhost|127\.0\.0\.1|\[::1\])(:|/|\b)'
      # GCP instance metadata is link-local and has dedicated cloud traits.
      - regex: '(?i)http://metadata\.google\.internal\b'
      # Authenticode embeds Microsoft PKI certificate and revocation URLs;
      # these are certificate metadata, not endpoints contacted by the file.
      # DER URL strings can surface with a trailing ASN.1 `0` delimiter.
      - regex: '(?i)^http://www\.microsoft\.com0?$'
      - regex: '(?i)http://(crl\.|www\.)?microsoft\.com/pki(ops)?/'
      - regex: '(?i)http://oneocsp\.microsoft\.com/ocsp'
      - regex: '(?i)http://(cacerts|crl[0-9]+|ocsp)\.digicert\.com(?:/|0|\b)'
      - regex: '(?i)http://www\.digicert\.com/CPS0?\b'
      # Certum Authenticode chains likewise embed CRL, OCSP, issuer-certificate
      # and policy URLs in the PKCS#7 certificate table.
      - regex: '(?i)http://[a-z0-9.-]*crl\.certum\.pl/.+\.crl'
      - regex: '(?i)http://[a-z0-9.-]*ocsp-certum\.com'
      - regex: '(?i)http://[a-z0-9.-]*repository\.certum\.pl/.+\.cer'
      - regex: '(?i)http://www\.certum\.pl/CPS'
      - regex: '(?i)http://(crl|crt|ocsp)\.sectigo\.com(?:/|0|\b)'
      - regex: '(?i)http://(crl|ocsp)\.comodoca\.com(?:/|0|\b)'
      # License texts and Q&A/doc links commonly appear in source manifests.
      - regex: '(?i)http://[a-z0-9][a-z0-9.-]+/licenses?/'
      # Apache project docs live on subdomains (kafka.apache.org, etc.).
      - regex: '(?i)http://([a-z0-9-]+\.)*apache\.org\b'
      - regex: '(?i)http://(www\.)?stackoverflow\.com/'
      - regex: '(?i)http://blog\.fogus\.me/'
      - regex: '(?i)http://scottlobdell\.me/'
      - regex: '(?i)http://mark\.koli\.ch/'
      - regex: '(?i)http://sneakycode\.net\b'
      - regex: '(?i)http://(www\.)?unicode\.org/'
      - regex: '(?i)http://(www\.)?openoffice\.org/'
      - regex: '(?i)http://[a-z0-9.-]+\.sourceforge\.net\b'
      # Project homepage strings in bundled zlib/TightVNC resources.
      - regex: '(?i)http://(www\.)?winimage\.com/zLibDll\b'
      - regex: '(?i)http://(www\.)?tightvnc\.com(?:/|\b)'
      - regex: '(?i)http://(www\.)?tug\.org/'
      # Clojure project wiki/JIRA documentation links.
      - regex: '(?i)http://([a-z0-9-]+\.)*clojure\.org\b'
      # Markdown/HTML/DTD documentation and vendor schema references.
      - regex: '(?i)http://(www\.)?daringfireball\.net/'
      - regex: '(?i)http://([a-z0-9-]+\.)*ibm\.com/'
      - regex: '(?i)http://blog\.tompawlak\.org/'
      - regex: '(?i)http://([a-z0-9-]+\.)*wikipedia\.org/'
      - regex: '(?i)http://([a-z0-9-]+\.)*whatwg\.org/'
      - regex: '(?i)http://dom\.spec\.whatwg\.org/'
      - regex: '(?i)http://tools\.ietf\.org/'
      - regex: '(?i)http://(www\.)?semver\.org/'
      - regex: '(?i)http://(spec\.)?commonmark\.org/'
      - regex: '(?i)http://jgm\.github\.io/'
      - regex: '(?i)http://(www\.)?lesscss\.org/'
      - regex: '(?i)http://sass-lang\.com/'
      - regex: '(?i)http://([a-z0-9-]+\.)*stackexchange\.com/'
      - regex: '(?i)http://(www\.)?serverfault\.com/'
      - regex: '(?i)http://(www\.)?fileformat\.info/'
      - regex: '(?i)http://mathiasbynens\.be/'
      - regex: '(?i)http://jsperf\.com/'
      - regex: '(?i)http://dev\.w3\.org/'
      # Placeholder / example hosts used in parsers and unit tests.
      - regex: '(?i)http://(foo|host|server|test\d*|example\.(com|org)|www\.example\.com|www\.msft\.com)\b'
      # HTTP recording / VCR test fixtures (OkReplay, Betamax, WireMock samples).
      - regex: '(?i)http://(www\.)?(xkcd|qwantz|httpbin|icanhascheezburger)\.(com|org)\b'
      - regex: '(?i)http://(www\.)?freeside\.co\b'
      - regex: '(?i)http://(www\.)?google\.com\b'
      - regex: '(?i)http://mths\.be/'
      - regex: '(?i)http://(www\.)?tunnckocore\.tk\b'
      - regex: '(?i)http://(www\.)?innovation\.ch/'
      # WordPress / PHP plugin headers, manuals, and editor license banners.
      - regex: '(?i)http://(www\.)?wordpress\.org\b'
      - regex: '(?i)http://(www\.)?publishpress\.com\b'
      - regex: '(?i)http://(www\.)?php\.net\b'
      - regex: '(?i)http://(www\.)?eclipse\.org\b'
      - regex: '(?i)http://(www\.)?underscorejs\.org\b'
      # Common library docs, GitHub Pages demos, and vendor comment links.
      - regex: '(?i)http://(www\.)?github\.com\b'
      - regex: '(?i)http://[a-z0-9.-]+\.github\.io\b'
      - regex: '(?i)http://(www\.)?jsonlogic\.com\b'
      - regex: '(?i)http://(www\.)?nonblocking\.io\b'
      - regex: '(?i)http://(www\.)?shakacode\.com\b'
      - regex: '(?i)http://(www\.)?chriskempson\.com\b'
      - regex: '(?i)http://(www\.)?ecma-international\.org\b'
      - regex: '(?i)http://(www\.)?ricostacruz\.com\b'
      # Ace/CodeMirror Base16 theme author credit URLs.
      - regex: '(?i)http://(www\.)?clrs\.cc\b'
      - regex: '(?i)http://(www\.)?sethawright\.com\b'
      - regex: '(?i)http://(www\.)?monokai\.nl\b'
      - regex: '(?i)http://(www\.)?railscasts\.com\b'
      - regex: '(?i)http://(www\.)?tybenz\.com\b'
      - regex: '(?i)http://(www\.)?ethanschoonover\.com\b'
      - regex: '(?i)http://(www\.)?hart-dev\.com\b'
      # Python docs / wiki references embedded in stdlib-adjacent comments.
      - regex: '(?i)http://(docs|wiki)\.python\.org\b'

  # Source text includes comments, so use parser-backed literals here. This
  # preserves real embedded endpoints without turning documentation links and
  # license comments into network behavior.
  - id: cleartext-http-url-code-literal
    desc: Code embeds cleartext HTTP URL literal
    for: [scripts, source, -shell, -batch]
    if:
      type: literal
      regex: '(?i)\bhttp://[a-z0-9][a-z0-9.-]{1,120}(/[a-zA-Z0-9._~!$&''()*+,;=:@%/-]{0,80})?'
    unless:
      - type: path
        regex: '(?i)(^|/)(src/)?test(s)?/'
      - type: basename
        regex: '(?i)_test\.[a-z0-9]+$'
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
    not:
      - regex: '(?i)http://(www\.)?(w3|iana)\.org\b'
      - regex: '(?i)http://schemas?\.'
      - regex: '(?i)http://json-schema\.org\b'
      - regex: '(?i)http://(purl\.org|purl\.oclc\.org)\b'
      - regex: '(?i)http://(www\.)?apple\.com\b'
      - regex: '(?i)http://(www\.)?idpf\.org\b'
      - regex: '(?i)http://(localhost|127\.0\.0\.1|\[::1\])(:|/|\b)'
      - regex: '(?i)http://[a-z0-9][a-z0-9.-]+/licenses?/'
      - regex: '(?i)http://([a-z0-9-]+\.)*apache\.org\b'
      - regex: '(?i)http://(foo|host|server|example\.(com|org))\b'
