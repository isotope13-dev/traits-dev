defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: baseline
  conf: 0.9
traits:
- crit: notable
  conf: 0.75
  id: http-url-literal
  desc: HTTP URL string literal
  if:
    type: string_literal
    regex: (?i)^https?://[\w.-]+(/[\w./?&=%:#@~+,;\-]{1,200})?
  not:
  - substr: www.w3.org
  - substr: purl.org
  - substr: ns.adobe.com
  - substr: apple.com/DTDs
  - substr: xmlns
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
    - id: metadata/binary/resource/identity::pe-version-resource
