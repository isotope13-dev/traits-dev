defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: artifactory-npm-reindex-path-assembly
    desc: Assembles Artifactory npm reindex path
    if:
      type: tree-sitter
      query: |
        (binary_expression
          left: (binary_expression left: (binary_expression
            right: (string (string_fragment) @api)))
          right: (string (string_fragment) @action)
          (#eq? @api "/api/npm/") (#eq? @action "/reindex/")) @match
