defaults:
  platforms: [unix, windows]
  for: [pyc]
composite_rules:
  - id: pyc-registry-audit-name-cooccurrence
    desc: PYC registry and audit name references
    crit: component
    conf: 0.96
    all:
      - id: metadata/binary/code/bytecode::pyc-audit-registration-name
      - id: metadata/binary/code/bytecode::pyc-low-level-read-flag
      - id: micro-behaviors/data/serialize/json::json-dumps-pyc-name
      - id: metadata/binary/code/bytecode::pyc-hex-encoder-name
      - id: metadata/binary/code/bytecode::pyc-basic-auth-handler-name
      - id: micro-behaviors/os/env/secret-name::pyc-registry-reader-user-suffix
      - id: micro-behaviors/os/env/secret-name::pyc-registry-reader-password-suffix
      - id: micro-behaviors/communications/http/services/artifactory::pyc-go-registry-api-route
      - id: micro-behaviors/communications/http/url/registry::pyc-go-version-list-route
