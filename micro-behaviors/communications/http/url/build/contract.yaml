# Contract lookup mechanics do not establish attacker control or theft.
# These composites describe co-occurrence, not proven source-to-sink flow.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: eth-call-destination-assignment
    desc: eth_call near a call-derived destination assignment
    crit: notable
    conf: 0.98
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/url/build::destination-from-call-or-hex
    # Source variants frequently pass the address through an identifier or use
    # object shorthand (`{to, data: selector}`), so the literal can sit beside
    # rather than inside the request object. The bounded resolver shape still
    # requires eth_call and a call-derived network destination.
    any:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-contract-address
      - id: micro-behaviors/data/format/crypto-address::ethereum-address-literal

