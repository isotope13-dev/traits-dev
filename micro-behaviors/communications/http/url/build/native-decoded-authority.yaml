defaults:
  platforms: [windows, unix]
  for: [c, cpp]
traits:
  - id: native-decoded-response-authority
    desc: Base64-XOR response supplies next request host
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((translation_unit
          (function_definition
            declarator: (pointer_declarator declarator: (function_declarator
              declarator: (identifier) @resolver))
            body: (compound_statement
              (declaration declarator: (init_declarator
                declarator: (pointer_declarator declarator: (identifier) @response)
                value: (call_expression function: (identifier) @post)))
              (declaration declarator: (init_declarator
                declarator: (pointer_declarator declarator: (identifier) @encoded)
                value: (call_expression function: (identifier) @extract
                  arguments: (argument_list . (identifier) @response_read))))
              (declaration declarator: (init_declarator
                declarator: (pointer_declarator declarator: (identifier) @decoded)
                value: (call_expression function: (identifier) @decode
                  arguments: (argument_list . (identifier) @encoded_read))))
              (for_statement body: (compound_statement
                (expression_statement (assignment_expression
                  left: (subscript_expression argument: (identifier) @xor_target)
                  operator: "^="))))
              (return_statement (cast_expression value: (identifier) @returned))))
          (function_definition body: (compound_statement
            (declaration declarator: (init_declarator
              declarator: (pointer_declarator declarator: (identifier) @server)
              value: (call_expression function: (identifier) @resolver_call)))
            (expression_statement (call_expression function: (identifier) @format
              arguments: (argument_list . (identifier) @url (_) (string_literal) @scheme
                (identifier) @authority)))
            (declaration declarator: (init_declarator
              value: (call_expression function: (identifier) @get
                arguments: (argument_list . (identifier) @url_read))))))) @chain
          (#eq? @post "http_post_json") (#eq? @extract "json_first_data_value")
          (#match? @decode "^(base64_|b64_?)decode$")
          (#eq? @response @response_read) (#eq? @encoded @encoded_read)
          (#eq? @decoded @xor_target) (#eq? @decoded @returned)
          (#eq? @resolver @resolver_call) (#eq? @server @authority)
          (#eq? @format "snprintf") (#match? @scheme "^\"https?://%s[/\"]")
          (#eq? @get "http_get_bytes") (#eq? @url @url_read))
