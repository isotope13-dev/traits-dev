defaults:
  platforms: [android, windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
traits:
  - id: fetch-encoded-template-path
    desc: Fetch embeds encoded data in URL path
    if:
      type: text
      # A query parameter or fragment is not a path segment.
      regex: 'fetch\s*\(\s*`https?://[^`/?#]{1,160}/[^`?#]{0,120}\$\{encodeURIComponent\('

  - id: fetch-dynamic-template-path
    desc: Fetch URL with dynamic path segment
    if:
      type: text
      regex: 'fetch\s*\(\s*`[^`\r\n]{0,120}/\$\{[A-Za-z_$][\w$]*\}`'


