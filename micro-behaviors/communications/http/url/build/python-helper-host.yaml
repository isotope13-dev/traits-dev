defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-helper-response-selects-host
    desc: HTTP response selects next request host
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @fetcher
            parameters: (parameters . (identifier) @url .)
            body: (block . (return_statement (attribute
              object: (call function: (attribute
                object: (identifier) @client attribute: (identifier) @get)
                arguments: (argument_list . (identifier) @requested .))
              attribute: (identifier) @text)) .))
          (function_definition body: (block
            (while_statement condition: (true) body: (block
              (try_statement body: (block
                (expression_statement (assignment
                  left: (identifier) @routing
                  right: (await (call function: (identifier) @reader))))
                . (expression_statement (assignment
                  left: (identifier) @host
                  right: (call function: (identifier) @next
                    arguments: (argument_list (generator_expression
                      body: (call function: (attribute
                        object: (identifier) @selected attribute: (identifier) @strip))
                      (for_in_clause left: (identifier) @line
                        right: (call function: (attribute
                          object: (identifier) @split attribute: (identifier) @splitlines))))))))
                . (if_statement condition: (not_operator argument: (identifier) @guard)
                  consequence: (block (continue_statement)))
                . (expression_statement (assignment
                  right: (await (call function: (identifier) @second_reader
                    arguments: (argument_list . (call function: (attribute
                      object: (string) @template attribute: (identifier) @format)
                      arguments: (argument_list . (identifier) @used_host))))))))))))))
          (#eq? @url @requested)
          (#match? @client "^(requests|httpx)$")
          (#eq? @get "get")
          (#eq? @text "text")
          (#eq? @fetcher @reader)
          (#eq? @fetcher @second_reader)
          (#eq? @routing @split)
          (#eq? @next "next")
          (#eq? @selected @line)
          (#eq? @strip "strip")
          (#eq? @splitlines "splitlines")
          (#eq? @host @guard)
          (#eq? @host @used_host)
          (#eq? @format "format")
          (#match? @template "^['\"]https?://\\{\\}\\{\\}['\"]$"))
