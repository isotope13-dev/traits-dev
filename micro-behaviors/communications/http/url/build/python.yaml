# Constructing an HTTP(S) URL from a variable — f-string interpolation of a
# host/domain/server/ip name, or "http://" + var concatenation. This is core
# HTTP-client behavior (every networked Python program builds request URLs this
# way, e.g. aiograpi's f"https://{domain}/graphql_www"), so per TAXONOMY it is a
# communications capability at `notable`, not a C2 signal. C2 intent comes from
# the target being a hardcoded external IP literal, which lives separately under
# objectives/command-and-control/infrastructure/ip and url/external-ip.
defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: C0002
  crit: notable
traits:
  # An API client that assigns `base_url = f"https://..."` is building request
  # URLs the ordinary way, so the f-string-URL atoms below treat it as benign
  # context. Named here rather than repeated inline in each of their `unless:`
  # clauses, where the copies were invisible to the duplicate checks and free
  # to drift apart.
  - id: python-api-client-base-url
    desc: Assigns an f-string base_url (API client shape)
    crit: component
    conf: 0.9
    if:
      type: text
      regex: base_url\s*=\s*f["']https?://

  - id: python-remote-asset-url-config
    desc: Assigns a remote HTTP asset URL
    conf: 0.94
    if:
      type: text
      regex: '(?i)\basset_url\b\s*(=|:)\s*["'']https?://'

  - id: python-conditional-endpoint-selection
    desc: Selects named HTTP endpoints conditionally
    conf: 0.9
    if:
      type: text
      regex: '(?i)\breturn\s+\w*(url|relay|endpoint)\w*\s+if\s+\w+.{0,48}else\s+\w+'

  - id: python-fstring-url-host
    desc: URL f-string from host
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{host\}["'?/#]
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url
  - id: python-fstring-url-ip
    desc: URL f-string from ip
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{ip\}["'?/#]
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url
  - id: python-fstring-url-server
    desc: URL f-string from server
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{server\}["'?/#]
    not:
      - regex: 'f?["'']?https://\{server\}/api/v4/projects/\{repo\}/(merge_requests/\{merge_request\}/notes|issues/\{issue\}/notes)'
      - regex: 'f?["'']?https://\{server\}/repos/\{repo\}/issues/\{issue\}/comments'
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url
      - type: text
        regex: 'api/v4/projects/\{repo\}/merge_requests/\{merge_request\}/notes'
      - type: text
        regex: 'api/v4/projects/\{repo\}/issues/\{issue\}/notes'
      - type: text
        regex: 'repos/\{repo\}/issues/\{issue\}/comments'
  - id: python-fstring-url-domain
    desc: URL f-string from domain
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{domain\}["'?/#]
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url
      - type: text
        substr: "MConstants.PROVER_DOTCOM"
  - id: python-fstring-url-with-port-host
    desc: URL f-string with host
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{host\}:\d+["'?/#]
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url
  - id: python-fstring-url-with-port-ip
    desc: URL f-string with ip
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{ip\}:\d+["'?/#]
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url
  - id: python-fstring-url-with-port-server
    desc: URL f-string with server
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{server\}:\d+["'?/#]
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url
  - id: python-fstring-url-with-port-domain
    desc: URL f-string with domain
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{domain\}:\d+["'?/#]
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url
  # The four atoms above key on the interpolated name being exactly `host`,
  # `ip`, `server` or `domain`. A destination constant is usually named for what
  # it is and then qualified -- `PROBE_HOST`, `api_server`, `c2_addr` -- and
  # none of those spellings is matched, so an f-string URL whose host comes from
  # a module constant reads as having no URL construction at all. Same
  # capability, one identifier wider: any identifier that *ends* in a
  # destination word (the bare four keep their own atoms, so this one requires
  # at least one leading character and does not duplicate them).
  - id: python-fstring-url-host-suffixed-name
    desc: URL f-string from host variable
    conf: 0.85
    if:
      type: string_literal
      regex: f["']https?://\{[A-Za-z_]\w*(host|ip|addr|address|server|domain|endpoint)\}
      case_insensitive: true
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
      - id: python-api-client-base-url

  - id: python-string-concat-url
    desc: URL constructed via string concatenation
    conf: 0.85
    if:
      type: string_literal
      regex: '["'']https?://["'']\s*\+\s*\w+'
    not:
      - regex: url

  - id: python-fstring-url-path-segment
    desc: URL f-string with dynamic path segment
    conf: 0.9
    if:
      type: text
      regex: '(?i)f["'']\{[A-Za-z_]\w*(URL|URI)\}/\{[A-Za-z_]\w*\}["'']'
  # `"https://host/path/" + a + "/" + b` -- a request URL whose literal prefix
  # is extended by concatenation. Neutral on its own (paging, ids); it is the
  # carrier when the concatenated values are secrets, which is what the
  # exfiltration composites add.
  - id: python-url-literal-concatenation
    desc: URL literal extended by concatenation
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '["'']https?://[^"''\n]{4,120}["'']\s*\+\s*[A-Za-z_]'
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/scripted/
composite_rules:
  - id: python-fstring-url
    desc: URL constructed with f-string variable
    crit: notable
    conf: 0.85
    any:
      - id: python-fstring-url-host
      - id: python-fstring-url-ip
      - id: python-fstring-url-server
      - id: python-fstring-url-domain
      - id: python-fstring-url-host-suffixed-name
  - id: python-fstring-url-with-port
    desc: URL f-string construction with port
    crit: notable
    conf: 0.85
    any:
      - id: python-fstring-url-with-port-host
      - id: python-fstring-url-with-port-ip
      - id: python-fstring-url-with-port-server
      - id: python-fstring-url-with-port-domain
  - id: python-url-construction
    desc: HTTP URL constructed from a variable
    crit: notable
    conf: 0.85
    any:
      - id: python-fstring-url
      - id: python-fstring-url-with-port
      - id: python-string-concat-url
