defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: configurable-domain-bot-path
    desc: Bot path joined to a configured domain
    # Ops tooling calls its own backend by joining a deployment-configured
    # domain variable with a relative bot path, not a hardcoded controller.
    crit: notable
    conf: 0.9
    for: [python, go]
    if:
      type: text
      regex: '(?i)(domain|base_?url|api_?host)\s*\+\s*f?["'']/api/v[0-9]{1,2}/bots?/'
