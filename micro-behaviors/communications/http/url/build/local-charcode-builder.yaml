defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: fetch-local-charcode-url-builder
    desc: Fetch calls a local charcode URL builder
    if:
      # The structured call facts preserve the callee but do not correlate it
      # with a sibling helper's body. Bind helper definition and invocation;
      # an unused numeric URL builder beside an ordinary POST is insufficient.
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @builder
              value: (arrow_function
                body: (statement_block) @construction)))
          (function_declaration
            body: (statement_block
              [
                (try_statement
                  body: (statement_block
                    (lexical_declaration
                      (variable_declarator
                        value: (await_expression
                          (call_expression
                            function: (identifier) @fetch
                            arguments: (arguments .
                              (call_expression
                                function: (identifier) @callee))))))))
                (expression_statement
                  (await_expression
                    (call_expression
                      function: (identifier) @fetch
                      arguments: (arguments .
                        (call_expression
                          function: (identifier) @callee)))))
              ]))) @request
          (#eq? @builder @callee)
          (#eq? @fetch "fetch")
          (#match? @construction "String\\.fromCharCode"))
