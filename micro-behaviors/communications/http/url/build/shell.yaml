# Shell command substitution can legitimately choose an artifact path from
# local platform data. Exfiltration requires additional evidence that the
# substituted command emits collected data for transport.
defaults:
  crit: notable
  conf: 0.9
  mbc: C0002

traits:
  # The normalized architecture token spliced into a release URL, as in
  # `.../cni-plugins-linux-${ARCH_CNI}-v1.6.2.tgz`. This is neutral URL
  # construction; dropper and host-discovery composites supply their own
  # execution or system-probe evidence.
  - id: arch-variable-in-url
    desc: Architecture variable appears in URL
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: 'https?://[^\s"]{0,150}\$\{?\w{0,12}(ARCH|arch)'

  - id: shell-command-substitution-url-path
    desc: Shell URL path includes command substitution
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: 'https?://[^/''"`\s]{1,120}/[^''"`\n]{0,100}\$\([^''"`\n]{0,100}'

  # PowerShell spells string interpolation with the same `$(...)`, where it is
  # usually a property read -- `"https://$tenant.sharepoint.com/$($lib.Url)"` is
  # ordinary Microsoft module code, and the shell rule above called it command
  # substitution. Require the subexpression to open with something other than a
  # variable, which is what a command invocation (`$(Get-Date)`, `$(whoami)`)
  # looks like and what an interpolated property access never does.
  - id: powershell-command-subexpression-url-path
    desc: PowerShell URL path runs a command
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: 'https?://[^/''"`\s]{1,120}/[^''"`\n]{0,100}\$\(\s*[A-Za-z]'
