# A request destination taken straight out of a call result, rather than from
# a literal or a configured base URL. Neutral on its own — service-discovery,
# redirect following, and proxy code all do it — but it is the leg that turns a
# remote lookup into the address the next request goes to, so composites that
# infer a resolver-style C2 (objectives/command-and-control/infrastructure/
# blockchain/contract/) reference it and supply the lookup context.
#
# `result` must terminate the expression: `host: result.host` /
# `isShadowRoot(x) ? result.host : result` are property reads on unrelated
# objects (URL, ShadowRoot) and must not match.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9
  mbc: C0002

traits:
  - id: host-field-from-call-result
    desc: Host field assigned from result
    if:
      type: text
      regex: '(?i)[{,\s]host\s*[:=]\s*(await\s+)?result\s*[;,)}]'

  - id: destination-field-from-call-result
    desc: Destination field assigned from result
    if:
      type: text
      regex: '(?i)[{,\s]destination\s*[:=]\s*(await\s+)?result\s*[;,)}]'

  - id: call-result-destination-field-read
    desc: Reads destination field off result
    if:
      type: text
      regex: '(?i)\bresult\.destination\b'

  # ABI/hex bytes from a prior call become the next HTTP host or URL. Common in
  # blockchain dead-drop resolvers that eth_call a contract string and then POST
  # to the decoded host; neutral without the surrounding RPC/request context.
  - id: host-from-hex-buffer-decode
    desc: Host assigned from hex Buffer decode
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(host|url|c2)\s*=\s*Buffer\.from\([^)]{0,40}["'']hex["'']\)'

  - id: host-from-hex-bytes-decode
    desc: Host assigned from bytes.fromhex
    for: [python, shell]
    if:
      type: text
      regex: '(?i)\b(host|url|c2)\s*=\s*bytes\.fromhex\b'

  - id: shell-host-from-xxd-hex-decode
    desc: Shell assigns host from xxd hex decode
    for: [shell]
    if:
      type: text
      # EVM ABI strings are often extracted with shell parameter slicing and
      # decoded inside command substitution. Bind xxd to a destination-shaped
      # assignment so ordinary file-format conversion remains neutral.
      regex: '(?i)\b(host|url|c2)\s*=\s*\$\([^\r\n]{0,200}\bxxd\s+-r\s+-p\b'

  - id: shell-post-to-variable-authority
    desc: Shell POSTs to variable URL authority
    for: [shell]
    if:
      type: text
      # Bind the POST verb and computed authority to the same curl command.
      # This excludes variables used only in a fixed service URL's path.
      regex: '\bcurl\b[^\r\n]{0,160}-X\s+POST[^\r\n]{0,160}["'']?https?://\$\{?[A-Za-z_]\w*\}?'

composite_rules:
  # Aggregates "destination came from a prior call/decode" atoms so consumers
  # can reference one id instead of enumerating every build/response variant.
  - id: destination-from-call-or-hex
    desc: Destination assigned from call result or hex decode
    conf: 0.9
    any:
      - id: host-field-from-call-result
      - id: destination-field-from-call-result
      - id: call-result-destination-field-read
      - id: host-from-hex-buffer-decode
      - id: host-from-hex-bytes-decode
      - id: shell-host-from-xxd-hex-decode
