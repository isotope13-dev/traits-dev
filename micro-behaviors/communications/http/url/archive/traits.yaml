# HTTP URLs whose path is a packaged archive. Fetching a .tgz over HTTP is a
# download capability; whether that tarball is then force-installed is an
# objective composite elsewhere.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.88
  attack: T1105

traits:
  # Relocated from objectives/execution/lure/document (2026-08). A hyperlink to
  # a .zip is a download capability, and technical documentation is full of
  # them -- Microsoft's WinDbg guide and Agner Fog's optimization manuals both
  # link their sample archives. The lure intent belongs to the composites.
  - id: pdf-action-archive-url
    desc: PDF action links to an archive
    for: [pdf]
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)https?://[^\s<>()"]{4,220}\.(zip|7z|rar)([?#]|$)'

  - id: remote-npm-tarball-url
    desc: HTTP URL for a remote tarball
    if:
      type: text
      regex: 'https?://.{0,80}\.tgz'
