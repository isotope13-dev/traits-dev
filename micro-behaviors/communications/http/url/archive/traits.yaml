# HTTP URLs whose path is a packaged archive. Fetching a .tgz over HTTP is a
# download capability; whether that tarball is then force-installed is an
# objective composite elsewhere.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.88
  attack: T1105

traits:
  - id: remote-npm-tarball-url
    desc: HTTP URL for a remote tarball
    if:
      type: text
      regex: 'https?://.{0,80}\.tgz'
