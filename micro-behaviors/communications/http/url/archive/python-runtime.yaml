defaults:
  platforms: [windows]
  for: [class]
  crit: notable
traits:
  - id: jvm-embedded-python-runtime-url
    desc: JVM Python embedded-runtime archive URL
    conf: 0.98
    if:
      type: value
      path: class.strings[*]
      regex: '^https://www\.python\.org/ftp/python/[\d.]+/python-[\d.]+-embed-(amd64|win32|arm64)\.zip$'
