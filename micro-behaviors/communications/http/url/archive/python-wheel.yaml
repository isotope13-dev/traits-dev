# A distribution URL reference alone proves neither a download nor abuse.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: python-wheel-url-reference
    desc: References an HTTP Python wheel URL
    if:
      type: text
      regex: 'https?://[^\s"''<>]{1,64}\.whl\b'
