# Co-occurrence does not prove that a fragment is persisted or relayed.
# PDF viewers, routers and OAuth clients use these operations legitimately.
defaults:
  platforms: [windows, unix]
  for: [javascript]

composite_rules:
  - id: fragment-operations-with-web-storage
    desc: URL fragment operations and storage co-occur
    crit: notable
    conf: 0.9
    all:
      - id: location-hash-read
      - id: fragment-append-encoded-value
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
    near_bytes: 32768
