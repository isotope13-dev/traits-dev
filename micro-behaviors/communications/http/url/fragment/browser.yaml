# Reading and constructing the URL fragment (the part after `#`).
#
# The fragment is the one part of a URL a browser never puts on the wire: it is
# not sent in the request line and never reaches the server or its logs. Hash
# routers, deep links, and the OAuth implicit flow all rely on that, so reading
# and building fragments is ordinary client-side work.
#
# The same property is why staged phishing carries the victim's identity there
# rather than in a query parameter — the value moves from page to page without
# the operator's host ever recording a request that contains it, and without a
# crawler or mail-security scanner that fetches the bare URL seeing anything.
# The relay interpretation lives in
# objectives/credential-access/phishing/workflow/.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.85
traits:
  - id: location-hash-read
    desc: Reads the URL fragment from location.hash
    if:
      type: text
      regex: '\blocation\.hash\b'

  - id: fragment-append-encoded-value
    desc: Appends an encoded value as fragment
    conf: 0.88
    if:
      type: text
      regex: '["'']#["'']\s*\+\s*(encodeURIComponent|btoa|escape)\s*\('
