# URL text is a reference, not evidence of a request or impersonation.
defaults:
  platforms: [windows, unix]
  for: [data]
traits:
- id: data-http-ip-port-reference
  desc: Data references public IPv4 HTTP URL/port
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "http://[0-9]{1,3}(\\.[0-9]{1,3}){3}:[0-9]{2,5}"
    is: external_ip
  not:
  - substr: http://192.99.219.222:82
  unless:
  - type: basename
    exact: api-test.js
  - type: basename
    regex: (?i)^(third-party-licenses|third_party_licenses|licenses?|notice)(\.[^.]+)?$
  - type: basename
    regex: (?i)^(Bundle|Observation|DiagnosticReport)-.*\.json$
  - type: basename
    regex: (?i)^(ValueSet|StructureDefinition)-.*\.json$
  - type: text
    regex: '"resourceType"\s*:\s*"(Bundle|Observation|DiagnosticReport)"'
  - type: text
    regex: '"resourceType"\s*:\s*"(ValueSet|StructureDefinition)"'
  - id: metadata/file/format/source-map::sourcemap-context

