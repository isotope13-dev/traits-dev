defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
traits:
- id: curl-wget-ipv4-url
  desc: Curl/wget command targets an IPv4 URL
  crit: notable
  conf: 0.95
  unless:
  - id: well-known/tool/sysadmin/spack::spack-package-context
  - id: micro-behaviors/communications/http/services/cloud::curl-aws-metadata-query
  - id: micro-behaviors/communications/http/header/custom::aws-imds-token-ttl-header
  - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
  - id: metadata/package/testing/
  - id: metadata/file/naming::test-directory-component
  if:
    type: text
    regex: (?im)(^|[;&|({]\s*)(curl|wget)\b[^\n;&|]{0,96}https?://\d{1,3}(\.\d{1,3}){3}(:\d{1,5})?/
    is: valid_ip
