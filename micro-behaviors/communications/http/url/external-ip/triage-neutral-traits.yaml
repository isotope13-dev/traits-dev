---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.85
traits:
- id: python-http-ip-port-url
  desc: HTTP URL with IP:port
  if:
    type: string_literal
    regex: http://[0-9]+(\.[0-9]+){3}:[0-9]+(/[^\s'"<>{}]{0,200})?
    is: external_ip
  not:
  - regex: "/thumb\\b"
  - substr: http://192.99.219.222:82
  unless:
  - id: metadata/package/testing/terminology::test-code-declaration-text
  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
