defaults:
  platforms: [unix, windows]
  for: [data, manifests]
traits:
  - id: preinstall-curl-exfil
    desc: Preinstall text includes curl and form encoding
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "preinstall.{0,80}curl.{0,80}--data-urlencode"

    unless:
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
