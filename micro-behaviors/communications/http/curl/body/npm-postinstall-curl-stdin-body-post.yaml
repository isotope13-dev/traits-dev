defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: curl-stdin-body-post
  desc: Postinstall curl reads request data from stdin
  crit: notable
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    # JSON escape decoding can place a literal newline inside an inline
    # `node -e` fragment before the shell pipeline reaches curl. Bound the
    # command by size rather than excluding newlines from the entire value.
    regex: "\\bcurl\\b[\\s\\S]{0,240}(-d|--data(-binary)?)\\s+@-"
