defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: prepare-curl-http-post
  desc: Prepare references curl POST options
  crit: suspicious
  conf: 0.8
  if:
    type: value
    path: scripts.prepare
    regex: \bcurl\b[^"\n]{0,200}((-X\s*|--request\s+)POST|--data[\w-]*|\s-d\b)
