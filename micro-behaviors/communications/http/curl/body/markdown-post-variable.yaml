# curl POST whose body is a shell variable, as written in agent-skill
# Markdown (fenced shell blocks). The data option often sits on a
# backslash-continued line below the curl word, so the legs are joined by
# proximity rather than one line-spanning pattern.
defaults:
  platforms: [unix, windows]
  for: [markdown, shell, text]
  conf: 0.88

traits:
  - id: curl-data-shell-variable-arg
    desc: Data option passes a quoted shell variable
    crit: component
    if:
      type: text
      regex: '((^|\n)\s*-d|\bcurl\b[^\n]{0,50}-d|--data(-\w+)?)\s+"\$\{?\w+\}?"'

  - id: curl-command-word
    desc: Text names the curl command
    crit: component
    for: [markdown, text]
    if:
      type: text
      word: curl

composite_rules:
  - id: curl-post-shell-variable-body
    desc: curl POSTs a shell variable remotely
    crit: notable
    near_lines: 6
    all:
      - id: curl-data-shell-variable-arg
    any:
      - id: curl-command-word
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
