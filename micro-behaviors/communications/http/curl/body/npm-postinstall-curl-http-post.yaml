defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: curl-http-post
  desc: Postinstall references curl POST options
  crit: suspicious
  conf: 0.8
  if:
    type: value
    path: scripts.postinstall
    regex: "\\bcurl\\b[^\"\\n]{0,200}((-X\\s*|--request\\s+)POST|--data[\\w-]*|\\s-d\\b)"
  unless:
  # RFC 2606 documentation domains are non-routable: a POST there reaches no
  # attacker, so the recon-exfil shape does not hold.
  - id: metadata/package/scripts/reference::reserved-docs-domain-npm-script
