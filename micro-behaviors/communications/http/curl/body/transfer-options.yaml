# Options describe request bodies; a multipart field need not contain a file.
# Require an argument boundary so Content-Type is not mistaken for -T.
defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  crit: notable
traits:
  - id: curl-multipart-form-option
    desc: curl multipart form submission option
    conf: 0.9
    for:
      - scripts
      - c
      - cpp
      - zig
      - binaries
    if:
      type: text
      regex: '(^|[;&][ \t]*|\|[ \t]+|")curl\b[^\n|;]{0,180}[ \t]+["'']?(-F|--form(-string)?([= \t"'']|$))'
