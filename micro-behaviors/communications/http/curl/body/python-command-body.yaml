# Relocated from TeamPCP identity: the command is generic HTTP behavior.
defaults:
  platforms: [unix, windows]
  for: [python]
  size_max: 5000000
traits:
- id: python-curl-data-binary-command
  desc: Python text contains curl --data-binary command
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '\bcurl\b[^\n]{0,500}--data-binary'
