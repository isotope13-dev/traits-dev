defaults:
  for: [manifests]
  platforms: [unix, windows]
composite_rules:
  - id: npm-preinstall-oast-probe
    desc: npm preinstall performs OAST callback during install
    crit: suspicious
    conf: 0.97
    all:
      - id: preinstall-curl-data-urlencode-info
      - id: micro-behaviors/communications/url/host/oob/endpoint::preinstall-oast-pro-http
      - id: micro-behaviors/communications/url/host/oob/execution::preinstall-shell-subst-oast-pro