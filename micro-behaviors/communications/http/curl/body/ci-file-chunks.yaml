defaults:
  platforms:
  - unix
  for:
  - shell
traits:
- id: shell-file-chunk-urlencoded-body
  desc: File chunk enters curl form body
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    language: shell
    query: "(do_group\n (variable_assignment name: (variable_name) @chunk\n   value: (command_substitution (pipeline\n     [\n      (command name: (command_name (word) @reader))\n      (redirected_statement body: (command name: (command_name (word) @reader)))\n     ]\n     (command name: (command_name (word) @limit)))))\n [\n (command\n name: (command_name (word) @client)\n argument: (word) @option\n . argument: (string (string_content) @field\n   (simple_expansion (variable_name) @sent))) @upload\n (redirected_statement body: (command\n name: (command_name (word) @client)\n argument: (word) @option\n . argument: (string (string_content) @field\n   (simple_expansion (variable_name) @sent))) @upload)\n (list (command\n name: (command_name (word) @client)\n argument: (word) @option\n . argument: (string (string_content) @field\n   (simple_expansion (variable_name) @sent))) @upload)\n (list (redirected_statement body: (command\n name: (command_name (word) @client)\n argument: (word) @option\n\
      \ . argument: (string (string_content) @field\n   (simple_expansion (variable_name) @sent))) @upload))\n ]\n (#eq? @chunk @sent)\n (#eq? @reader \"tail\")\n (#eq? @limit \"head\")\n (#eq? @client \"curl\")\n (#eq? @option \"--data-urlencode\")\n (#eq? @field \"content=\"))"
