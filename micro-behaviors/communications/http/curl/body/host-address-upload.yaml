defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
- id: preinstall-curl-host-address-body
  desc: curl sends queried host IPs in body
  crit: suspicious
  conf: 0.99
  if:
    type: value
    path: scripts.preinstall
    regex: '(?i)\bcurl\b.{0,100}(-d|--data).{0,120}\bhostname\s+-i{1,2}\b.{0,80}https?://'
