# Shell scripts that hide curl behind single-letter variable reconstruction.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: sh-letter-var-http-client-rebuild
    desc: Shell rebuilds HTTP client from letter variables
    crit: suspicious
    conf: 0.92
    attack: T1027
    if:
      type: text
      regex: '\$[a-z]\$[a-z]\$[a-z]\s+-[a-zA-Z]'

  - id: sh-curl-post-backtick-data
    desc: curl -d uses backtick command substitution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '-d\s+"`[^`]{1,120}`"'

  - id: sh-script-remote-https-url
    desc: Shell script names remote HTTPS URL
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'https?://[A-Za-z0-9][A-Za-z0-9._-]{1,80}/[A-Za-z0-9._~/-]{2,}'
