defaults:
  for:
    - applescript
  platforms:
    - macos
traits:
  - id: curl-cmd
    desc: curl command in AppleScript
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: \bcurl\s
  - id: curl-post
    desc: curl POST request in AppleScript
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: curl\s+.{0,120}-X\s*POST\b
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: curl-custom-header
    desc: curl custom header flag
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: 'curl\s+.{0,200}-H\s+\\?\"[A-Za-z0-9_-]+:'
composite_rules:
  - id: curl-post-upload
    desc: AppleScript curl POST upload
    crit: suspicious
    conf: 0.95
    all:
      - id: curl-post
      - id: "micro-behaviors/communications/http/curl::curl-data-binary-at-source"
