defaults:
  platforms: [unix]
  for: [shell, html, javascript, typescript, python, ruby, perl]
traits:
  - id: curl-command-substitution-argument
    desc: curl argument contains command substitution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bcurl\s+[^()\r\n|;]{0,60}\$\('
