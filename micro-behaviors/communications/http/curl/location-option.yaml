defaults:
  platforms: [windows, unix]
  for: [batch, powershell, shell]
traits:
  - id: curl-location-option-text
    desc: Curl command requests redirect following
    crit: notable
    conf: 0.96
    # markdown scope: agent-skill guidance embeds the same flag in fenced
    # install commands, and SKILL.md members are typed markdown or shell by
    # content heuristics.
    for: [batch, powershell, shell, markdown]
    if:
      type: text
      regex: '(?i:\bcurl(\.exe)?)\b[^;\r\n|&]{0,80}[ \t](-[a-zA-Z]*L[a-zA-Z]*|--location)\b'
