# The @ operand includes both filenames and '-' for standard input.
# This option alone proves neither a functioning transfer nor exfiltration.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
traits:
  - id: curl-data-binary-at-source
    desc: curl file or stdin body operand
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: --data-binary @
