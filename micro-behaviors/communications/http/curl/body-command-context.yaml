# Preserve curl-command coverage for callers of the curl category; the
# request-body option without a command remains separate evidence.
composite_rules:
  - id: curl-body-command-context
    desc: curl requests a body method or upload
    platforms: [unix, windows]
    for: [shell, batch, powershell]
    crit: notable
    any:
      - id: micro-behaviors/communications/http/upload/body/
