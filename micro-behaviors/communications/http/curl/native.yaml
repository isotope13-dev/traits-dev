# libcurl option identifiers as they appear in C/C++ source.  The PHP
# `curl_setopt` spellings of the same options live in php.yaml.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]

traits:
  - id: native-post-fields-option
    desc: Sets the libcurl POST body option
    crit: notable
    conf: 0.88
    mbc: C0002
    attack: T1071.001
    if:
      type: text
      # `word` and not `substr`: CURLOPT_POSTFIELDSIZE / _LARGE only declare a
      # body length, which every libcurl uploader sets, and matching those as
      # "sends a POST body" produced false positives in benign HTTP clients.
      word: CURLOPT_POSTFIELDS
