# Dynamic subdomain curl requests
defaults:
  platforms: [unix, android, ios]
  for: [shell]
  crit: notable
traits:
  # A curl command naming a routable URL proves only an HTTP client endpoint;
  # transfer direction depends on flags such as -O (download), -T, or -F.
  - id: curl-command-remote-url
    desc: curl command names a routable remote URL
    crit: notable
    conf: 0.85
    platforms: [windows, linux, macos]
    for: [markdown, shell, text, scripts]
    # Keep the host inside the match so documentation-only destinations can be
    # filtered without treating reserved examples as reachable endpoints.
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,140}https?://[\w.-]{1,60}'
      not:
        - regex: 'https?://(www\.)?example\.(com|org|net)\b'
        - regex: 'https?://[\w.-]{1,60}\.(test|example|invalid|localhost)\b'
        - regex: 'https?://(localhost|127\.0\.0\.1)\b'

  - id: curl-dynamic-subdomain
    desc: Curl to dynamic subdomain (DNS exfil)
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: 'curl\s+\\?["'']https?://\$[a-zA-Z0-9_]+\.[\w\.\-]+/\\?["'']'
      case_insensitive: true
  - id: shell-embedded-node-curl-exec
    desc: Embedded Node curl command
    crit: notable
    conf: 0.95
    attack: T1041
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.exec\(\s*["'']curl\s+-s\s+["'']'
