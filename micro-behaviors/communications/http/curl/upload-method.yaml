defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell]

traits:
  - id: curl-body-method-or-upload-file
    desc: curl with -X POST/PUT/PATCH or --upload-file
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)\bcurl\b[^\r\n]{0,200}(\s-X\s+(POST|PUT|PATCH)|\s--upload-file\b)
  - id: curl-upload-t-or-data-file
    desc: curl uploads a file (-T, -d @)
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)\bcurl\b[^\r\n]{0,200}(\s-T\s+|\s-d\s+@)

composite_rules:
  - id: curl-upload-command
    desc: curl sends a request body or file
    crit: notable
    conf: 0.7
    any:
      - id: curl-body-method-or-upload-file
      - id: curl-upload-t-or-data-file
      - id: micro-behaviors/communications/http/curl::curl-data-binary-file
