defaults:
  crit: notable
  for:
  - shell
  - c
  - cpp
  platforms:
  - unix
traits:
- id: curl-data-binary
  desc: curl binary request-body option
  conf: 0.7
  for:
  - scripts
  - source
  platforms:
  - unix
  - windows
  if:
    type: text
    substr: --data-binary
composite_rules:
- id: curl-body-or-upload-option
  desc: curl request-body or file-upload option
  conf: 0.82
  for:
  - scripts
  - binaries
  platforms:
  - windows
  - unix
  any:
  - id: micro-behaviors/communications/http/upload::curl-upload-or-form-option
  - id: micro-behaviors/communications/http/curl::curl-data-binary
  - id: micro-behaviors/communications/http/upload::curl-at-tmp
