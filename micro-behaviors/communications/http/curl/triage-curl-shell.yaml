defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - macho
traits:
- id: curl-command-url-or-option
  desc: curl command text includes URL or option
  crit: notable
  conf: 0.7
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: '(?i)(^|[\s;&({|])curl(\.exe)?\s+(https?://[^\s/]{1,80}|--?[\w-]+)'
- id: curl-silent-fail-flags-text
  desc: curl text contains silent or fail flags
  crit: notable
  conf: 0.86
  # markdown scope: agent-skill guidance embeds the same flags in fenced
  # install commands, so the text observation holds under either typing.
  for:
  - scripts
  - pe
  - markdown
  if:
    type: text
    regex: \bcurl(\.exe)?(\s+[^-\s][^\s]{0,120}){0,6}\s+(-[a-zA-Z]*[fs][a-zA-Z]*|--silent|--fail)\b
composite_rules:
- id: curl-silent
  desc: curl command uses silent or fail flags
  crit: notable
  conf: 0.92
  for:
  - shell
  - powershell
  - batch
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/http/curl::curl-command-call
  - id: micro-behaviors/communications/http/curl::curl-silent-fail-flags-text
