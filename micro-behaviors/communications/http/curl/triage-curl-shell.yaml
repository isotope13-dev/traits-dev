defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - macho
traits:
- id: curl-command-url-or-option
  desc: curl command includes URL or option
  crit: notable
  conf: 0.7
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(^|[\s;&({])curl(\.exe)?\s+(https?://[^\s/]{1,80}|--?[\w-]+)
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/detection/agentskillmap/
  - id: well-known/app/infrastructure/k9x-satan::attack-fixture-context
  - id: metadata/lang/generated::openapi-generator-source-banner
  - id: micro-behaviors/communications/http/download/curl::curlopt-ref
  - id: metadata/package/freeform::pkg-description-content-type-markdown
  - type: basename
    regex: (?i)\.(crt|cer|pem)$
  - id: well-known/tool/development/cli/fzf::fzf-binary
- id: curl-silent-fail-flags-text
  desc: curl text contains silent or fail flags
  crit: notable
  conf: 0.86
  for:
  - scripts
  - pe
  if:
    type: text
    regex: \bcurl(\.exe)?(\s+[^-\s][^\s]{0,120}){0,6}\s+(-[a-zA-Z]*[fs][a-zA-Z]*|--silent|--fail)\b
  unless:
  - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: well-known/tool/detection/agentskillmap/
composite_rules:
- id: curl-silent
  desc: curl command uses silent or fail flags
  crit: notable
  conf: 0.92
  for:
  - shell
  - powershell
  - batch
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/http/curl::curl-command-call
  - id: micro-behaviors/communications/http/curl::curl-silent-fail-flags-text
