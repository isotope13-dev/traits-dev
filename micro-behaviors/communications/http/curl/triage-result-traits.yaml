defaults:
  platforms:
  - windows
  - unix
  for:
  - rust
  - go
  - c
  - cpp
  - python
  - powershell
  - javascript
  - typescript
  - shell
traits:
- id: http-curl-data-option
  desc: curl data option
  crit: notable
  conf: 0.8
  for:
  - shell
  - powershell
  if:
    type: text
    regex: (?im)(^|[;&|`$({])\s*(/usr/bin/)?curl\b[^\n;&|]{0,160}\s(-d|--data(-raw)?)\s+
