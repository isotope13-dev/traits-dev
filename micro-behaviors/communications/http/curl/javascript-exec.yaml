# Source text can include an embedded command example; no download is required.
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: javascript-exec-curl-command-text
    desc: JavaScript exec curl command text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: \bexec\s*\(\s*['"]curl\b
