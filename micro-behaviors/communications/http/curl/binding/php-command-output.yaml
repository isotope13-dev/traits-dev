defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: command-output-post-body
    desc: PHP command output set as POST body
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: curl_setopt
      args:
        - index: 1
          kind: identifier
          name: CURLOPT_POSTFIELDS
        - index: 2
          from:
            call: '^shell_exec$'
