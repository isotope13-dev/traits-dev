# libcurl option-setting calls in C/C++ source. The PHP
# `curl_setopt` spellings of the same options live in php.yaml.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]

traits:
  - id: native-post-fields-option
    desc: Sets the libcurl POST body option
    crit: notable
    conf: 0.88
    mbc: C0002
    attack: T1071.001
    if:
      # Bind the option to the option-selector argument of a real call.
      # Header enums, comments, strings and POSTFIELDSIZE are not POST setup.
      type: symbol
      kind: call
      exact: curl_easy_setopt
      arg:
        index: 1
        kind: identifier
        name: CURLOPT_POSTFIELDS
