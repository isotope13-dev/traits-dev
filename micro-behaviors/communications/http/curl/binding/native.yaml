# libcurl option-setting calls in C/C++ source. The PHP
# `curl_setopt` spellings of the same options live in php.yaml.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  mbc: C0002
  attack: T1071.001

traits:
  - id: native-post-fields-option
    desc: Sets the libcurl POST body option
    conf: 0.88
    if:
      # Bind the option to the option-selector argument of a real call.
      # Header enums, comments, strings and POSTFIELDSIZE are not POST setup.
      type: symbol
      kind: call
      exact: curl_easy_setopt
      arg:
        index: 1
        kind: identifier
        name: CURLOPT_POSTFIELDS

  - id: native-httpheader-option
    desc: Sets the libcurl custom headers option
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: curl_easy_setopt
      arg:
        index: 1
        kind: identifier
        name: CURLOPT_HTTPHEADER

  - id: native-post-fieldsize-from-fread
    desc: Sets libcurl POST size from fread count
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: curl_easy_setopt
      args:
        - index: 1
          kind: identifier
          name: CURLOPT_POSTFIELDSIZE
        - index: 2
          from:
            call: '^fread$'
