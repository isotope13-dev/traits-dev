traits:
  - id: curl-variable-query-data
    desc: JavaScript invokes curl with variable query data
    crit: suspicious
    conf: 0.95
    platforms: [unix, windows]
    for: [javascript]
    attack: T1041
    if:
      # Restrict this to an actual call so documentation and embedded command
      # examples are not reported as network behavior.
      type: tree-sitter
      kind: call
      regex: 'curl\s+-s[\s\S]{0,120}[?&][A-Za-z_][A-Za-z0-9_]*=\$[A-Za-z_][A-Za-z0-9_]*'
