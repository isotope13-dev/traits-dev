defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, shell, batch, powershell, groovy, python, javascript, ruby]
  crit: notable
  mbc: C0002
  attack: T1071.001

traits:
  - id: curl-basic-auth-token
    desc: curl command hardcodes token credential
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,120}-u\s+[^:\s]{1,80}:token\b'
      # Documentation quotes the canonical GitHub API example with a
      # placeholder credential (`curl -u username:token`, also written
      # user:token, <username>:token, your-username:token); that shape
      # propagates through OpenAPI specs, generated clients and READMEs.
      # Require a non-placeholder account before the token. Filters the
      # matched span only, so quotes around the credential are tolerated.
      not:
        - regex: '(?i)-u\s+["'']?(?:<user(name)?>|user(name)?|your[-_\s]?user(name)?|login|account)["'']?\s*:'
    # Generated TypeScript declarations embed this exact command as GitHub
    # API documentation; declarations cannot execute it.
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/build/ci/github-actions::octokit-openapi-types-path

  # Bare `api-key:` header (not X-API-Key) used by MacSync-class C2/exfil curls.
  - id: curl-api-key-header
    desc: curl sets api-key request header
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcurl\b[^\n]{0,400}-H\s+["'']api-key\s*:'

  - id: curl-http-code-write-out
    desc: curl writes HTTP status via %{http_code}
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bcurl\b[^\n]{0,400}-w\s+["'']?%\{http_code\}'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
