defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
  - id: npm-preinstall-curl
    desc: Preinstall script references curl
    crit: notable
    conf: 0.8
    if:
      type: value
      path: "scripts.preinstall"
      regex: "\\bcurl\\b"
  - id: npm-install-curl
    desc: Install script references curl
    crit: notable
    conf: 0.8
    if:
      type: value
      path: "scripts.install"
      regex: "\\bcurl\\b"
