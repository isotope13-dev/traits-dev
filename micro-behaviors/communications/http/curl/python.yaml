# curl/wget invoked through a Python subprocess argv list. The shell-string
# curl atoms anchor on `curl <flags> URL` with whitespace, which the list form
# (`subprocess.check_call(["curl", "-o", ...])`, each token a separate quoted
# element) never presents. Neutral capability: example code and tooling
# download assets this way; supply-chain beacon composites reference this atom
# and supply the install/import context.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-curl-argv-list
    desc: Python runs curl or wget argv list
    conf: 0.85
    if:
      type: text
      regex: '\[\s*["''](curl|wget)["'']\s*,'
