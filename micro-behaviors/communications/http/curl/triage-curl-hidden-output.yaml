defaults:
  for:
  - shell
  platforms:
  - unix
  crit: notable
  conf: 0.96
traits:
# markdown scope: agent-skill files carry the same silent download command in
# fenced install guidance, and SKILL.md members are typed markdown or shell by
# content heuristics, so the instruction should surface under either typing.
- id: curl-silent-short-flag-url
  desc: Curl silent flag with a network URL
  conf: 0.9
  for:
  - shell
  - python
  - javascript
  - typescript
  - ruby
  - go
  - rust
  - dockerfile
  - markdown
  if:
    type: text
    regex: '\bcurl\b[^|&\n]{0,96}\s-[A-Za-z]*s[A-Za-z]*\b[^|&\n]{0,96}https?://'
  not:
  - substr: api.coingecko.com/api/v3/simple/price
  - substr: curl --unix-socket
  - regex: puts\s+["'][^"'\n]{0,120}curl\s+--unix-sock(et)?
- id: curl-silent-long-flag-url
  desc: Curl silent option with a network URL
  conf: 0.9
  for:
  - shell
  - python
  - javascript
  - typescript
  - ruby
  - go
  - rust
  - dockerfile
  - markdown
  if:
    type: text
    regex: curl(\.exe)?\s+[^|&\n]{0,120}--silent[^|&\n]{0,120}(https?://|ftp://)
  not:
  - substr: api.coingecko.com/api/v3/simple/price
  - substr: curl --unix-socket
  - regex: puts\s+["'][^"'\n]{0,120}curl\s+--unix-sock(et)?
composite_rules:
- id: curl-silent-stdout
  desc: Shell text contains a curl silent-output command
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1105
  size_max: 5000
  any:
  - id: micro-behaviors/communications/http/curl::curl-silent-short-flag-url
  - id: micro-behaviors/communications/http/curl::curl-silent-long-flag-url
  unless:
  - id: well-known/tool/packaging/composer::composer-installer-url
  - id: metadata/file/catalog/identity/
  - id: well-known/app/finance/coingecko::benign-coingecko-price-api
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: micro-behaviors/communications/http/download/curl::curl-output-redirect
  - id: metadata/build/docker::dockerfile-basename
