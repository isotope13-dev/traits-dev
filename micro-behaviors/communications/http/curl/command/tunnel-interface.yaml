# Transfers pinned to a VPN tunnel device.
#
# `curl --interface wg0` forces the request out of the tunnel rather than the
# host's default route. Operators reach for it when the payload host is only
# reachable from inside the VPN they just had the target join, which also
# keeps the fetch off whatever monitors the normal egress path. Neutral on its
# own — plenty of tooling pins a transfer to an interface deliberately — so
# the download/execute composites supply the intent.
defaults:
  platforms: [linux, macos]
  for: [scripts, binaries]
  crit: notable
  conf: 0.88
  mbc: C0002

traits:
  - id: curl-bound-to-tunnel-interface
    desc: curl pinned to a VPN tunnel device
    if:
      type: text
      regex: '--interface[= ]+["'']?(wg|tun|utun|nordlynx)\d'
