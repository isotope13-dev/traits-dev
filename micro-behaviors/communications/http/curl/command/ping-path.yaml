# Neutral observations relocated from attacker-objective rules.
traits:
  - id: curl-ping-or-beacon-path
    desc: Curl command targets ping or beacon path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: curl\s+.{0,80}/(ping|beacon)\b
    platforms:
    - openwrt
    - unix
    - windows
    for:
    - c
    - cpp
    - elf
    - go
    - php
    - shell
