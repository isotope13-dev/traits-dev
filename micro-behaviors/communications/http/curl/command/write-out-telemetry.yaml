defaults:
  platforms: [unix, windows]
  for: [shell, scripts, source]
  crit: notable
  conf: 0.93

traits:
  - id: curl-write-out-status-format
    desc: curl write-out status or size token
    if:
      type: text
      regex: '%\{(http_code|response_code|size_download)\}'

  - id: curl-output-null-sink
    desc: curl discards response to null device
    for: [shell, scripts]
    conf: 0.9
    if:
      type: text
      regex: '\bcurl\b[^\n;|&]{0,72}(-o|--output)[=\s]+(/dev/null|NUL)\b'

composite_rules:
  - id: curl-null-sink-status-probe
    desc: curl probes HTTP status without body
    for: [shell, scripts]
    conf: 0.95
    near_lines: 2
    all:
      - id: curl-write-out-status-format
      - id: curl-output-null-sink
