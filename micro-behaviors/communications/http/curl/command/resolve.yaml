defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: resolve-host-override-flag
    desc: curl --resolve host override flag
    if:
      # Literal facts exclude manpage links and explanatory comments.
      type: literal
      kind: string
      regex: '(^|[ \t])--resolve([ \t]|$)'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context

  # The literal-tier atoms above cannot see the flag in a shell script: there
  # `--resolve` is a bare word, not a quoted string, so the most common place
  # the option actually appears went unmatched. Anchor on a curl invocation in
  # the same command instead -- the shape the sibling `curl-insecure` atom
  # already uses -- which keeps prose and manpage references out.
  - id: shell-curl-host-resolution-override
    desc: Shell curl call overrides host resolution
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '\bcurl\b[^\n|;]{0,200}\s--(resolve|connect-to)[ \t=]'

  - id: connect-to-host-override-flag
    desc: curl --connect-to host override flag
    if:
      type: literal
      kind: string
      regex: '(^|[ \t])--connect-to([ \t]|$)'
