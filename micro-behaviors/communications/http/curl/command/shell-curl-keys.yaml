defaults:
  platforms: [openbsd, bsd, unix]
  for: [shell]

traits:
  # POST to a path ending in /keys. Git forge user-key APIs are how a
  # script registers a public key, and signing/KMS services create keys
  # the same way; the call alone is a network capability. Exfiltration
  # is the hostile composite that also requires a private-key path.
  - id: shell-curl-keys-endpoint
    desc: Shell curls keys endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'curl\s+[^#\n]{0,120}-X\s+POST\s+["''][^"'']{0,120}/keys\b'
    not:
      - regex: '(?i)/api/v[14]/user/keys|api\.github\.com/user/keys'
