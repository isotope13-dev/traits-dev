defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: python-curl-hostname-exfil-url
  desc: Curl URL contains hostname substitution
  conf: 0.97
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /curl\s+https?:\/\/[^\s"']+\/exfil\?host=\$\(hostname\)/
        condition:
          ($b0_0)
      }
- id: python-curl-quoted-secret-url
  desc: Quoted curl URL contains secret variable text
  conf: 0.95
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /curl\s+["']https?:\/\/[^"'\n]*\$\{?[A-Z0-9_]*(TOKEN|SECRET|PASSWORD)/
        condition:
          (
            $b0_0
          )
      }
- id: python-curl-url-host-user-substitution
  desc: Curl URL contains host and user syntax
  conf: 0.95
  if:
    type: text
    regex: curl[^\n]{0,200}\$\(hostname\)[^\n]{0,100}\$\(whoami\)
