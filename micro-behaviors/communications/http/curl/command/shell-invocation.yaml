# Shell scripts that hide curl behind single-letter variable reconstruction.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: sh-curl-letter-assignments
    desc: Shell assigns curl letters to variables
    crit: component
    if:
      type: text
      regex: '(^|[;\n])[ \t]*c=c;[ \t]*u=u;[ \t]*r=r;[ \t]*l=l([;\n]|$)'

  - id: sh-curl-letter-command
    desc: Shell invokes curl letter variables
    crit: component
    if:
      type: text
      regex: '(^|[;\n])[ \t]*\$c\$u\$r\$l[ \t]+-[a-zA-Z]'

  - id: sh-curl-post-backtick-data
    desc: curl -d uses backtick command substitution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '-d\s+"`[^`]{1,120}`"'

composite_rules:
  - id: sh-letter-var-http-client-rebuild
    desc: Shell rebuilds curl from letter variables
    crit: suspicious
    conf: 0.92
    attack: T1027
    near_lines: 10
    all:
      - id: sh-curl-letter-assignments
      - id: sh-curl-letter-command
