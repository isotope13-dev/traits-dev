defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
- id: postinstall-curl-command-text
  desc: Postinstall command starts with curl
  crit: notable
  conf: 0.9
  for: [manifests]
  if:
    type: text
    regex: "\"postinstall\"\\s*:\\s*\"curl\\s"
  unless:
  - id: well-known/tool/detection/agent/agent-audit-kit::scanner-context
- id: npm-postinstall-curl
  desc: Postinstall command invokes curl
  crit: notable
  conf: 0.85
  if:
    type: value
    path: scripts.postinstall
    regex: '(^|[;&|])\s*curl(\s|$)'
