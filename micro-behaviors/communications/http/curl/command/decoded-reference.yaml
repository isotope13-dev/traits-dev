defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.95
traits:
- id: decoded-curl-command
  desc: Base64 curl command text
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&|])\s*(/(usr/)?(bin|local/bin)/)?curl\b
    not:
    - regex: (?m)^#{1,6}\s
    - regex: '```'
  for:
  - python
  - shell
  - elf
  - macho
  - pe
  - text
