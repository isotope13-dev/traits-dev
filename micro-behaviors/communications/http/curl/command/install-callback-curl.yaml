defaults:
  platforms: ["unix", "windows"]
  for: ["javascript"]

traits:
  - id: npm-postinstall-piped-curl-http-url
    desc: Piped postinstall curl names HTTP endpoint
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\|\s*curl\b[\s\S]{0,500}https?://[^\s"'']+'
