# Neutral observations relocated from unsupported intent categories.
traits:
- platforms:
  - unix
  - windows
  for:
  - github-actions
  id: workflow-curl-delete-request
  desc: Workflow curl uses HTTP DELETE
  crit: notable
  conf: 0.95
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: (?i)\bcurl\b.{0,220}(--request\s+DELETE|-X\s*DELETE)
