defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [manifests]
traits:
  - id: msbuild-curl-whoami-callback
    desc: MSBuild prebuild contains curl and whoami
    conf: 0.98
    if:
      type: text
      regex: '(?is)<PreBuildEvent>.{0,240}(curl.{0,80}whoami|whoami.{0,80}curl)'
    unless:
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
