defaults:
  for: [ruby]
  platforms: [unix]

traits:
  # curl invoked as the PROGRAM, anchored to the first argument.
  #
  # The generic `curl-command-remote-url` leg is a text regex
  # (`\bcurl\b[^\n]{0,140}https?://`) and cannot tell a command from prose.
  # In homebrew-core it matched, variously: a TODO comment linking a GitHub
  # issue (julia), a trailing comment on `uses_from_macos "curl"` (poppler),
  # a maintainer note showing how a version was looked up (simdutf, dpp), and
  # `system "make", "-C", "deps", "install-curl"` -- a make TARGET whose name
  # merely contains the substring (julia again).
  #
  # Anchoring with `.` to the first argument of system/shell_output is what
  # distinguishes "runs curl" from "mentions curl".
  - id: ruby-curl-program-invocation
    desc: Ruby invokes curl through a process call
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        (call
          method: (identifier) @m
          arguments: (argument_list . (string) @prog)
          (#match? @m "^(system|shell_output)$")
          (#match? @prog "^\"(/[\\w/]*)?curl( |\"|$)"))

  - id: ruby-file-gated-curl-command
    desc: File-exists branch invokes curl through system
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((if
          condition: (call receiver: (constant) @receiver
            method: (identifier) @test)
          consequence: (then
            (call !receiver method: (identifier) @run
              arguments: (argument_list . (string (string_content) @command))))) @gate
          (#eq? @receiver "File")
          (#eq? @test "exist?")
          (#eq? @run "system")
          (#match? @command "^curl\\b"))
