defaults:
  for:
    - applescript
  platforms:
    - macos
traits:
  - id: curl-cmd
    desc: curl command in AppleScript
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: \bcurl\s
  - id: curl-custom-header
    desc: curl custom header flag
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: 'curl\s+.{0,200}-H\s+\\?\"[A-Za-z0-9_-]+:'
