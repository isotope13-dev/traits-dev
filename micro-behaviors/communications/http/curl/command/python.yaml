# A list head also occurs in mathematical __all__ exports. Require nearby
# subprocess invocation before treating the list as a curl command clue.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: curl-data-command-subst
    desc: curl body from command substitution
    conf: 0.9
    if:
      type: text
      regex: 'curl[^\n]{0,160}-d\s*\$\('

composite_rules:
  - id: python-curl-argv-list
    desc: Python subprocess call beside curl/wget list
    conf: 0.85
    near_bytes: 1024
    all:
      - id: metadata/lang/source/syntax/array::python-list-curl-wget-head
      - id: micro-behaviors/process/create/subprocess/launch::python-subprocess-launch-calls
