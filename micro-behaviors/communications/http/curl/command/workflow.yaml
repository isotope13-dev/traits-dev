defaults:
  platforms: [unix, windows]
  for: [github-actions]
traits:
- id: workflow-curl-http-request
  desc: Workflow text references curl HTTP request
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bcurl\b[^\n]{0,240}https?://'
- id: workflow-curl-remote-http-request
  desc: Workflow curl uses remote HTTP URL
  crit: notable
  conf: 0.9
  if:
    type: text
    # A DNS hostname excludes loopback and unqualified local service names.
    regex: '\bcurl\b[^\n]{0,240}https?://[A-Za-z0-9-]+\.[A-Za-z]{2,}'
