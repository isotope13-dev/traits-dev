composite_rules:
- platforms:
  - unix
  - windows
  crit: notable
  id: python-packaging-curl-process-context
  desc: Python packaging process calls beside curl URL
  conf: 0.98
  for:
  - python
  scope: file
  unless:
  - id: metadata/package/documentation/agent-safety::scoped-security-test-documentation
  - id: metadata/package/documentation/security-testing::defensive-review-documentation
  all:
  - id: metadata/build/pip::packaging-setuptools-imported-setup-call
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  any:
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/create/local-exec::local-execution
  - id: micro-behaviors/process/create/subprocess::python-exec-capability
