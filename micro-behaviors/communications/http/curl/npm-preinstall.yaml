defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
- id: npm-preinstall-curl-command
  desc: npm preinstall script references curl utility
  crit: notable
  conf: 0.95
  unless:
  - id: metadata/package/scripts/lifecycle::preinstall-runtime-guard-help
  if:
    type: value
    path: scripts.preinstall
    regex: '\bcurl\b'
