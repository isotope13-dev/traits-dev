# The public PHP2Shell chain pins prefork workers by sending a one-byte body
# with Content-Length: 1048576, then retaining the sockets. This observation
# deliberately stops at the short send: later writes may complete a request.
# Facts expose adjacent Python byte literals as an expression. Require a
# literal-only argument in the syntax tree so appending a computed body cannot
# be mistaken for an undersized request. No comments or docstrings qualify.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-undersized-literal-post-send
    desc: Sends undersized literal HTTP POST
    conf: 0.99
    ref: https://github.com/9bie/php2shell-bypass-aslr-exp/blob/main/exploit.py
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: (attribute attribute: (identifier) @method)
          arguments: (argument_list
            [(string) (concatenated_string)] @request)) @evidence
          (#eq? @method "sendall")
          (#match? @request "^[bB]?[\"']POST [^ ]{1,120} HTTP/1\\.[01]")
          (#match? @request "(?i)Content-Length:[ \\t]*[1-9][0-9]{2,8}\\\\r\\\\n\\\\r\\\\n[^\"'\\\\]{0,16}[\"']$"))
