# HTTP header text and a Winsock connect reference do not establish C2.
# Require both headers; task paths and browser identities are separate facts.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: winsock-json-close-header-references
    desc: Winsock connect with JSON and close headers
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/socket/connect::connect-api-name-reference
      - id: micro-behaviors/communications/http/header/content-type::native-json-content-type-line
      - id: micro-behaviors/communications/http/header/connection::http-connection-close-header
    unless:
      - id: metadata/binary/framework/
      - id: well-known/tool/media/youtube-dl/
