# Hand-built HTTP messages sent over a directly connected socket. HTTP
# semantics decide placement here; a generic socket connection remains under
# communications/socket, while use of an HTTP client API remains under
# communications/http/client.
defaults:
  crit: notable
  conf: 0.94
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: dev-tcp-http-get
    desc: GET token beside /dev/tcp
    crit: suspicious
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '(?is)/dev/tcp/.{0,160}\bGET\s+'
  - id: dev-tcp-http-host
    desc: Host header beside /dev/tcp
    crit: suspicious
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?is)/dev/tcp/.{0,160}Host:'

composite_rules:
  - id: direct-socket-http-request
    desc: Sends raw HTTP over direct socket
    for: [scripts, source, shell]
    any:
      - id: direct-socket-http-request-script
      - id: direct-socket-http-request-source
      - id: shell-dev-tcp-http

  - id: direct-socket-http-request-script
    desc: Script sends raw HTTP over direct socket
    for: [scripts]
    all:
      - id: micro-behaviors/communications/socket/connect
    any:
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line

  - id: direct-socket-http-request-source
    desc: Source sends raw HTTP over direct socket
    for: [source]
    all:
      - id: micro-behaviors/communications/socket/connect
    any:
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line-source
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line-source

  - id: shell-dev-tcp-http
    desc: Shell uses /dev/tcp and contains an HTTP request token
    crit: notable
    conf: 0.95
    for: [shell]
    all:
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-fd-redirect
    any:
      - id: dev-tcp-http-get
      - id: dev-tcp-http-host
