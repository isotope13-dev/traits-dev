defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
  crit: notable
traits:
  - id: xhr-prototype-access
    desc: Assigns an XMLHttpRequest prototype method
    conf: 0.6
    if:
      type: text
      regex: XMLHttpRequest\.prototype\.(open|send|setRequestHeader)\s*=[^=]
  - id: xhr-bracket-access
    desc: XMLHttpRequest bracket notation access
    conf: 0.6
    if:
      type: text
      regex: XMLHttpRequest\[.{1,50}\]\[.{1,50}\]
  - id: xhr-prototype-open-eq
    desc: XMLHttpRequest.prototype.open assignment
    conf: 0.7
    if:
      type: text
      regex: XMLHttpRequest\.prototype\.open\s*=[^=]
  - id: xhr-bracket-open-eq
    desc: XMLHttpRequest bracket open assignment
    conf: 0.7
    if:
      type: text
      regex: XMLHttpRequest\[.{1,50}\]\[.{1,50}open.{0,20}\]\s*=[^=]
  - id: xhr-prototype-send-eq
    desc: XMLHttpRequest.prototype.send assignment
    conf: 0.7
    if:
      type: text
      regex: XMLHttpRequest\.prototype\.send\s*=[^=]
  - id: xhr-bracket-send-eq
    desc: XMLHttpRequest bracket send assignment
    conf: 0.7
    if:
      type: text
      regex: XMLHttpRequest\[.{1,50}\]\[.{1,50}send.{0,20}\]\s*=[^=]
  - id: window-fetch-eq
    desc: window.fetch assignment
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: window\.fetch\s*=[^=]
    unless:
      - id: metadata/package/testing/
      - type: text
        substr: 'challengeType:'
      - id: metadata/path/directory::test-directory-component
  - id: fetch-login-route-intercept
    desc: Hooks fetch for login-link requests
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: window\.fetch\s*=\s*(async\s+)?function[\s\S]{0,420}\b(loginLink|login[_-]?link)\b
  - id: fetch-wrapper-original
    desc: Fetch wrapper preserves original implementation
    conf: 0.93
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: window\.fetch\s*=\s*(async\s+)?function[\s\S]{0,360}originalFetch
    unless:
      - id: micro-behaviors/data/string/redact::sensitive-data-js-scanner
  - id: global-fetch-function-assignment
    desc: Global fetch property assigned a function
    conf: 0.85
    for:
      - javascript
      - typescript
      - html
    if:
      type: text
      regex: (^|[^\w$.])(window|self|globalThis)\.fetch\s*=\s*function\b
  - id: globalthis-fetch-eq
    desc: globalThis.fetch assignment
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: tree-sitter
      kind: assignment
      regex: \bglobalThis\.fetch\s*=
    unless:
      - id: micro-behaviors/process/interpreter/vm/
      - id: well-known/lib/development/vscode-webview::acquire-vscode-api
      - id: metadata/build/bundler/asset::js-vite-rollup-vendor-chunk
      - id: metadata/package/testing/
      - id: metadata/lang/source/naming/function/communication::fetch-observability-instrumentation
      - id: metadata/path/directory::test-directory-component
  - id: self-fetch-eq
    desc: self.fetch assignment
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: self\.fetch\s*=[^=]
  - id: bare-fetch-eq
    desc: Direct fetch function assignment
    conf: 0.82
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: (^|[;{}\n])\s*fetch\s*=\s*(async\s+)?function\b
    unless:
      - id: metadata/package/testing/
      - id: metadata/path/directory::test-directory-component
  - id: globalthis-fetch-wrapper
    desc: Replaces global fetch with a wrapper
    conf: 0.92
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: \bglobalThis\.fetch\s*=\s*(\([^)]{1,120}\)|[A-Za-z_$][A-Za-z0-9_$]*)\s*=>
  - id: globalthis-xhr-wrapper
    desc: Replaces global XMLHttpRequest with a wrapper
    conf: 0.92
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: \bglobalThis\.XMLHttpRequest\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\b
  - id: xhr-response-json-intercept
    desc: Reads JSON from hooked XHR response
    conf: 0.94
    if:
      type: text
      regex: XMLHttpRequest\.prototype\.send\s*=[\s\S]{0,700}\bresponseText\b
  - id: fetch-response-body-record
    desc: Fetch wrapper records response bodies
    conf: 0.94
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: window\.fetch\s*=\s*(async\s*)?[^=]{0,120}\bclone\s*\(\s*\)[\s\S]{0,350}\.(text|json)\s*\(
  - id: window-bracket-fetch-hook
    desc: Hooks window fetch via bracket property access
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: 'window\[["'']fetch["'']\]\s*=\s*function'
composite_rules:
  - id: prototype-access
    desc: XMLHttpRequest prototype method assignment
    conf: 0.8
    any:
      - id: micro-behaviors/communications/http/intercept::xhr-prototype-access
      - id: micro-behaviors/communications/http/intercept::xhr-bracket-access
  - id: open-hook
    desc: XMLHttpRequest.open method hooking
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/intercept::xhr-prototype-open-eq
      - id: micro-behaviors/communications/http/intercept::xhr-bracket-open-eq
    downgrade:
      any:
        - id: metadata/file/format/browser-extension::is-chrome-manifest
        - id: metadata/permission/runtime::is-extension
        - id: metadata/build
  - id: send-hook
    desc: XMLHttpRequest.send method hooking
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/intercept::xhr-prototype-send-eq
      - id: micro-behaviors/communications/http/intercept::xhr-bracket-send-eq
  - id: fetch-hook
    desc: fetch API hooking
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/intercept::window-fetch-eq
      - id: micro-behaviors/communications/http/intercept::globalthis-fetch-eq
      - id: micro-behaviors/communications/http/intercept::self-fetch-eq
      - id: micro-behaviors/communications/http/intercept::bare-fetch-eq
    downgrade:
      any:
        - id: metadata/file/format/browser-extension::is-chrome-manifest
        - id: metadata/permission/runtime::is-extension
  - id: request-interceptor
    desc: XHR/Fetch request interceptor
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/intercept::open-hook
      - id: micro-behaviors/communications/http/intercept::send-hook
      - id: micro-behaviors/communications/http/intercept::fetch-hook
    unless:
    downgrade:
      any:
        - id: metadata/file/format/browser-extension::is-chrome-manifest
        - id: metadata/permission/runtime::is-extension
  - id: extension-bearer-request-interceptor
    for:
      - javascript
      - crx
      - xpi
      - zip
    desc: Browser extension intercepts bearer request headers
    conf: 0.95
    scope: archive
    all:
      - id: metadata/permission/runtime::is-extension
      - id: micro-behaviors/communications/http/intercept::request-interceptor
      - id: micro-behaviors/communications/http/token-auth::access-token
      - id: micro-behaviors/communications/http/authorization-header::bearer-authorization-prefix
