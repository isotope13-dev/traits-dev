defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - binaries
traits:
  - id: dnr-dynamic-rules-clear-map
    desc: DNR clears dynamic rule IDs
    crit: notable
    conf: 0.92
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: getDynamicRules[\s\S]{0,160}removeRuleIds\s*:\s*\w+\.map\s*\(
