# An extension webRequest handler that reads the request-header list and
# names Authorization. The handler sees the bearer tokens of every outgoing
# request in the browser, so the composite states that capability. Session
# bridges use it legitimately, and so does a token harvester, so it stays
# notable and does not claim theft.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.85

traits:
  - id: authorization-header-literal
    desc: Source names the Authorization header literal
    crit: component
    if:
      type: text
      regex: '(?i)["'']authorization["'']'

composite_rules:
  - id: webrequest-authorization-header-read
    desc: Extension webRequest handler reads Authorization headers
    crit: notable
    # The webRequest listener and the Authorization name can sit in different
    # modules of one package (a handler calling a helper that reads the header).
    for: [npm, javascript, typescript]
    scope: package
    all:
      - id: micro-behaviors/communications/http/intercept::webrequest-before-send-headers-listener
      - id: micro-behaviors/communications/http/header/value::request-headers-member-reference
      - id: authorization-header-literal
