defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: exception
  conf: 0.9

composite_rules:
- id: content-filter-request-blocking
  desc: Content blocker cancels/redirects requests
  all:
  - id: micro-behaviors/communications/http/intercept::chrome-webrequest-pre-request
  - id: micro-behaviors/communications/http/intercept::webrequest-block-or-redirect

  # Electron apps enforce their own session firewall the same way: a
  # session webRequest handler that answers {cancel:true} through the
  # blocking callback is a blocker, not a tap. Decrediton's session
  # intercept cancels every request outside the user's approved
  # external-request allowlist.
- id: electron-session-request-blocker
  desc: Electron session handler cancels requests
  all:
  - id: micro-behaviors/communications/http/intercept::electron-session-webrequest-hook
  - id: metadata/lang/source/syntax/call/arguments::call-with-cancel-option

  # Any channel through which the extension learns which pages the user visits.
