# Script that wraps the page's own fetch and XMLHttpRequest and reads the
# Authorization header of every request that passes through. Written against
# minified code, so XMLHttpRequest is matched by its `.prototype.setRequestHeader`
# assignment rather than by name, and fetch by either an assignment or a
# defineProperty on window.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: window-fetch-define-property
    desc: Redefines window.fetch through defineProperty
    if:
      type: text
      regex: 'Object\.defineProperty\(\s*window\s*,\s*["'']fetch["'']'

  - id: xhr-set-request-header-prototype-wrap
    desc: Replaces a prototype setRequestHeader method
    if:
      type: text
      regex: '\.prototype\.setRequestHeader\s*=\s*function'

  - id: authorization-header-name-compare
    desc: Compares a header name to authorization
    conf: 0.85
    if:
      type: text
      regex: '(?i)\.toLowerCase\(\)\s*===?\s*["'']authorization["'']'

  - id: authorization-header-get-call
    desc: Reads the authorization header with get
    conf: 0.85
    if:
      type: text
      regex: '(?i)\.get\(\s*["'']authorization["'']\s*(\|\||\))'

composite_rules:
  - id: authorization-header-name-read
    desc: Reads a request header named Authorization
    crit: notable
    conf: 0.85
    any:
      - id: authorization-header-name-compare
      - id: authorization-header-get-call

  - id: fetch-xhr-authorization-header-tap
    desc: Wraps fetch and XHR and reads Authorization headers
    crit: notable
    conf: 0.92
    all:
      - id: xhr-set-request-header-prototype-wrap
      - id: authorization-header-name-read
    any:
      - id: window-fetch-define-property
      - id: micro-behaviors/communications/http/intercept::window-fetch-eq
