defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  crit: notable
  conf: 0.9
traits:
  - id: dnr-block-request-rules
    desc: DNR rules block network requests
    for:
      - json
    conf: 0.95
    if:
      type: value
      path: root[*].action.type
      exact: block
  - id: chrome-webrequest-api
    desc: Uses the WebExtension webRequest API
    if:
      type: text
      regex: "(chrome|browser)\\.webRequest\\.[A-Za-z_]"
  - id: chrome-webrequest-pre-request
    desc: Accesses pre-request WebExtension hooks
    if:
      type: symbol
      kind: member
      regex: "(chrome|browser)\\.webRequest\\.onBeforeRequest|onBeforeSendHeaders"
  - id: extension-http-watcher-handler-enum
    desc: Declares HTTP request and response watchers
    conf: 0.96
    if:
      type: text
      regex: onHttpRequest[\s\S]{0,120}onHttpResponse
  - id: webrequest-all-url-filter
    desc: WebRequest listener covers all URLs
    crit: notable
    if:
      type: text
      regex: urls\s*:\s*\[\s*["']<all_urls>["']\s*\]
  - id: electron-session-webrequest-hook
    desc: Accesses Electron session request hooks
    if:
      type: symbol
      kind: member
      regex: "\\.session\\.([A-Za-z_$][\\w$]{0,24}\\.)?webRequest\\.on\\w+"
  - id: webrequest-before-request-listener
    desc: Accesses the WebRequest onBeforeRequest hook
    if:
      type: symbol
      kind: member
      regex: webRequest\.onBeforeRequest$
  - id: webrequest-before-send-headers-listener
    desc: Accesses the WebRequest request-header hook
    if:
      type: symbol
      kind: member
      regex: webRequest\.onBeforeSendHeaders$
  - id: webrequest-completed-listener
    desc: References the WebRequest completion hook
    if:
      type: text
      regex: webRequest\.onCompleted\b
  - id: webrequest-filter-from-indexed-config
    desc: WebRequest URL filter comes from indexed config
    if:
      type: text
      regex: webRequest\.on\w+\.addListener\([\s\S]{0,900}\burls\s*:\s*\[\s*[\w$]+(\[[^\]]{1,12}\]){2}
  - id: chrome-webrequest-send-headers
    desc: Registers a WebRequest send-headers listener
    if:
      type: symbol
      kind: call
      regex: "(^|\\.)((chrome|browser)\\.webRequest\\.onSendHeaders\\.addListener)$"
  - id: webrequest-request-body-marker
    desc: WebRequest request body field marker
    if:
      type: literal
      kind: string
      exact: requestBody
  - id: webrequest-request-header-access
    desc: WebRequest request header access
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: webRequest.{0,80}requestHeaders|requestHeaders.{0,80}webRequest
  - id: chrome-declarative-net-request
    desc: WebExtension declarativeNetRequest API
    if:
      type: text
      regex: "(chrome|browser)\\.declarativeNetRequest\\b"
  - id: chrome-dnr-update-rulesets
    desc: Updates declarative network rulesets
    if:
      type: symbol
      kind: call
      regex: "(^|\\.)declarativeNetRequest\\.updateEnabledRulesets$"
  - id: chrome-dnr-update-dynamic-rules
    desc: Chrome updates dynamic DNR rules
    conf: 0.92
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: symbol
      kind: call
      exact: chrome.declarativeNetRequest.updateDynamicRules
  - id: dnr-query-parameter-transform
    desc: DNR query parameter transform
    conf: 0.9
    if:
      type: text
      word: addOrReplaceParams
  - id: dnr-subframe-resource-type
    desc: DNR rule targets subframe responses
    conf: 0.94
    if:
      type: text
      regex: resourceTypes\s*:\s*\[[^\]]{0,120}["']sub_frame["']
  - id: browser-dnr-update-dynamic-rules
    desc: Browser updates dynamic DNR rules
    conf: 0.92
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: symbol
      kind: call
      exact: browser.declarativeNetRequest.updateDynamicRules
  - id: bare-dnr-update-dynamic-rules
    desc: Updates dynamic DNR rules
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: declarativeNetRequest.updateDynamicRules
  - id: chrome-dnr-update-session-rules
    desc: Chrome updates session DNR rules
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: chrome.declarativeNetRequest.updateSessionRules
  - id: browser-dnr-update-session-rules
    desc: Browser updates session DNR rules
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: browser.declarativeNetRequest.updateSessionRules
  - id: bare-dnr-update-session-rules
    desc: Updates session DNR rules
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: declarativeNetRequest.updateSessionRules
  - id: webrequest-on-headers-received
    desc: Registers WebRequest response-header listener
    if:
      type: symbol
      kind: call
      regex: "(^|\\.)((chrome|browser)\\.webRequest\\.onHeadersReceived(\\.addListener)?)$"
  - id: dnr-rule-excludes-own-initiator
    desc: DNR rule excludes the extension's own requests
    conf: 0.95
    if:
      type: text
      regex: excludedInitiatorDomains[\s\S]{0,60}runtime\.id
composite_rules:
  - id: webrequest-block-or-redirect
    desc: WebRequest handler blocks or redirects traffic
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/intercept::chrome-webrequest-api
      - id: micro-behaviors/data/control-flow/return::cancel-or-redirect-response
  - id: webrequest-request-body-access
    desc: WebRequest request body access
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/intercept::chrome-webrequest-api
      - id: micro-behaviors/communications/http/intercept::webrequest-request-body-marker
  - id: webrequest-request-header-capture
    desc: WebRequest request-header capture
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/intercept::webrequest-request-header-access
    any:
      - id: micro-behaviors/communications/http/intercept::webrequest-before-send-headers-listener
      - id: micro-behaviors/communications/http/intercept::chrome-webrequest-send-headers
  - id: request-interception
    desc: Extension observes or modifies web requests
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/intercept::chrome-webrequest-pre-request
      - id: micro-behaviors/communications/proxy/config::browser-proxy-request-listener
      - id: micro-behaviors/communications/http/intercept::webrequest-before-send-headers-listener
      - id: micro-behaviors/communications/http/intercept::webrequest-on-headers-received
      - id: micro-behaviors/communications/http/intercept::declarative-net-request-update
  - id: declarative-net-request-update
    desc: Updates declarativeNetRequest rules
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/intercept::chrome-dnr-update-dynamic-rules
      - id: micro-behaviors/communications/http/intercept::browser-dnr-update-dynamic-rules
      - id: micro-behaviors/communications/http/intercept::bare-dnr-update-dynamic-rules
      - id: micro-behaviors/communications/http/intercept::chrome-dnr-update-session-rules
      - id: micro-behaviors/communications/http/intercept::browser-dnr-update-session-rules
      - id: micro-behaviors/communications/http/intercept::bare-dnr-update-session-rules
