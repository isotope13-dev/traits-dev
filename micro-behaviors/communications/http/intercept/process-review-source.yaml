defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.8

traits:
  - id: source-request-intercept-method
    desc: Calls request interception method
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(request|http|fetch)\s*\.\s*intercept\s*\('

