defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: bank-login-request-filter
  desc: Filters bank sign-in request URLs
  crit: notable
  conf: 0.96
  if:
    type: symbol
    kind: call
    regex: '\.url\.includes$'
    arg:
      index: 0
      regex: '(?i)(signin.{0,20}bank|bank.{0,20}signin)'
