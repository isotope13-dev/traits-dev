defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93
traits:
  - id: async-fetch-property-assignment
    desc: Assigns an async fetch function implementation
    if:
      # Covers dependency-injected globals as well as named global objects.
      # Assignment nodes exclude quoted examples and comparisons.
      type: tree-sitter
      kind: assignment
      regex: '\b[A-Za-z_$][\w$]*\.fetch\s*=\s*async\s+function\b'
