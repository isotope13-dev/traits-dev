# Clearing every existing dynamic declarativeNetRequest rule and adding a
# caller-supplied set in the same call: whoever supplies that set controls
# what the browser blocks, redirects or rewrites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: dnr-replace-all-dynamic-rules
    desc: Replaces all dynamic DNR rules
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'getDynamicRules[\s\S]{0,99}updateDynamicRules\(\{\s*removeRuleIds:\s*\w+,\s*addRules:'
