---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: webhook-service-word
  desc: Mentions 'webhook' (HTTP callback)
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\bwebhooks?\\b"
- id: icmp-keyword
  desc: 'Protocol keyword: icmp'
  crit: component
  conf: 0.3
  for:
  - binaries
  if:
    type: text
    exact: icmp
    section: rdata
