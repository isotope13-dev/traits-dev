# OpenID Connect provider metadata and authorization-request fields. These are
# ordinary protocol structures; objective rules add the credential-capture
# behavior that distinguishes a rogue provider from a legitimate one.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: oidc-provider-authorization-endpoint-field
    desc: Declares OIDC provider authorization endpoint
    if:
      type: text
      regex: '(?i)["'']?authorization_endpoint["'']?\s*[:=]'

  - id: oidc-provider-jwks-uri-field
    desc: Declares OIDC provider JWKS URI
    if:
      type: text
      regex: '(?i)["'']?jwks_uri["'']?\s*[:=]'

  - id: oidc-provider-signing-algorithms-field
    desc: Declares OIDC token-signing algorithms
    if:
      type: text
      regex: '(?i)["'']?id_token_signing_alg_values_supported["'']?\s*[:=]'

  - id: oidc-id-token-hint-field
    desc: Handles OIDC ID token hint
    if:
      type: text
      regex: '(?i)\bid_token_hint\b'

  - id: oidc-form-post-response-mode
    desc: Declares OIDC form_post response mode
    if:
      type: text
      regex: '(?i)response_modes_supported.{0,100}\bform_post\b'

composite_rules:
  - id: oidc-provider-discovery-metadata
    desc: Implements OIDC provider discovery metadata
    conf: 0.99
    near_bytes: 2048
    all:
      - id: oidc-provider-authorization-endpoint-field
      - id: oidc-provider-jwks-uri-field
      - id: oidc-provider-signing-algorithms-field

  - id: oidc-id-token-form-post-provider
    desc: OIDC provider handles form-post ID tokens
    conf: 0.98
    near_bytes: 8192
    all:
      - id: oidc-provider-discovery-metadata
      - id: oidc-id-token-hint-field
      - id: oidc-form-post-response-mode
