defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: wildcard-host-search-regex-literal
    desc: Wildcard-host search-query regex string
    conf: 0.96
    if:
      type: text
      regex: '["''`]\.\*\\{0,4}/search\\{0,4}\?q='

  - id: yahoo-affiliate-regex-substitution
    desc: Yahoo affiliate search regex substitution
    conf: 0.98
    for: [javascript, typescript, json]
    if:
      type: text
      regex: '(?is)regexSubstitution["'']?\s*:\s*["'']https://search\.yahoo\.com/yhs/search\?hspart='
