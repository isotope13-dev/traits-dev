defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: dnr-runtime-rule-install
    desc: Installs runtime DNR rules
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(addRules|updateDynamicRules)\s*:'
  - id: dnr-redirect-action
    desc: DNR redirect action
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'type\s*:\s*["'']redirect["'']'
  - id: dnr-search-query-param
    desc: Search query parameter
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(q|word|tn)='
  - id: dnr-main-frame-resource
    desc: DNR main-frame resource
    crit: component
    conf: 0.85
    if:
      type: text
      substr: main_frame

composite_rules:
  - id: dnr-main-frame-search-redirect
    desc: DNR main-frame search redirect
    crit: suspicious
    conf: 0.93
    all:
      - id: dnr-redirect-action
      - id: dnr-search-query-param
      - id: dnr-main-frame-resource
    near_bytes: 1200
