defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # A literal wildcard is a positive broad-scope observation. Missing
  # urlFilter is not treated as global because regexFilter may narrow it.
  - id: dnr-json-all-url-filter
    desc: DNR JSON condition has wildcard URL filter
    crit: notable
    conf: 0.95
    for: [json]
    if:
      type: value
      path: 'root[*].condition.urlFilter'
      exact: '*'

  # Suppress the broad-scope profile when any explicit site or tab bound
  # occurs in the rules file. This can miss a separate unbounded rule.
  - id: dnr-json-explicit-site-or-tab-scope
    desc: DNR JSON declares site or tab bounds
    crit: component
    conf: 0.98
    for: [json]
    if:
      type: text
      regex: '"((excluded)?(request|initiator)Domains|(excluded)?TabIds)"\s*:'

  # Static MV3 rulesets do not contain the declarativeNetRequest API name:
  # their JSON position is the protocol context. Keep these structured so an
  # arbitrary HTTP URL elsewhere in a JSON document cannot become a redirect.
  - id: dnr-json-http-redirect-url
    desc: DNR redirect targets an HTTP URL
    crit: notable
    conf: 0.97
    for: [json]
    if:
      type: value
      path: 'root[*].action.redirect.url'
      regex: '(?i)^https?://'

  - id: dnr-json-script-resource-type
    desc: DNR rule targets script resources
    crit: notable
    conf: 0.97
    for: [json]
    if:
      type: value
      path: 'root[*].condition.resourceTypes[*]'
      exact: script

  - id: dnr-search-query-param
    desc: Search query parameter
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(q|word|tn)='
  - id: dnr-search-path-filter
    desc: DNR rule filters a search URL path
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)regexFilter[\s\S]{0,240}/search/\(\.\*\)'
  - id: dnr-main-frame-resource
    desc: DNR main-frame resource
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: main_frame

  - id: dnr-external-url-target
    desc: DNR redirect uses an external URL target
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bdeclarativeNetRequest\b[\s\S]{0,800}\burl\s*:\s*["'']https?://[^/"'']{1,50}'
    not:
      - regex: '(?i)(google|youtube)\.com'

  # The field is only a partial observation until the surrounding object is
  # tied to the DNR API; the composite below supplies that context.
  - id: dnr-external-regex-substitution-url
    desc: External URL in regex substitution field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)regexSubstitution["'']?\s*:\s*["''`]https?://[^/"''`]{1,50}'
    not:
      - regex: '(?i)(google|youtube)\.com'



composite_rules:
  # Positive literal wildcard, absent explicit site/tab bounds. This is a
  # rules-file observation, not proof that every request class is covered.
  - id: dnr-json-all-site-url-filter
    desc: DNR ruleset contains an unbounded wildcard URL filter
    crit: notable
    conf: 0.96
    for: [json]
    scope: file
    all:
      - id: dnr-json-all-url-filter
    unless:
      - id: dnr-json-explicit-site-or-tab-scope

  - id: dnr-redirect-action
    desc: Redirect type field accompanies the DNR API
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/redirect::redirect-type-field
      - id: micro-behaviors/process/hook/webextension::chrome-declarative-net-request
    near_bytes: 1200

  - id: dnr-json-http-script-redirect
    desc: DNR ruleset redirects script loads to an HTTP URL
    crit: notable
    conf: 0.97
    for: [json]
    all:
      - id: dnr-json-http-redirect-url
      - id: dnr-json-script-resource-type

  - id: dnr-external-regex-substitution-target
    desc: DNR redirect uses an external regex target
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/hook/webextension::chrome-declarative-net-request
      - id: dnr-external-regex-substitution-url
    near_bytes: 800

  - id: dnr-external-redirect-target
    desc: DNR redirect uses an external HTTP target
    crit: notable
    conf: 0.92
    all:
      - id: dnr-redirect-action
    any:
      - id: dnr-external-url-target
      - id: dnr-external-regex-substitution-target
    near_bytes: 1200

  - id: dnr-main-frame-search-redirect
    desc: DNR main-frame search redirect
    crit: suspicious
    conf: 0.93
    all:
      - id: dnr-redirect-action
      - id: dnr-main-frame-resource
    any:
      - id: dnr-search-query-param
      - id: dnr-search-path-filter
    needs: 1
    near_bytes: 1200
