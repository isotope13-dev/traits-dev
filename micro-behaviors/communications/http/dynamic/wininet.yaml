# Dynamically linked clients keep API names as data and resolve them with
# GetProcAddress, so symbol-only matchers cannot see the request flow. Keep
# individual references as components; the workflow is the notable capability.
defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
  attack: T1071.001
  mbc: C0002

traits:
  - id: internet-connect-a-import
    desc: InternetConnectA import
    size_min: 1000000
    size_max: 1200000
    if:
      type: import
      exact: InternetConnectA
  - id: internet-open-a-import
    desc: InternetOpenA import
    size_min: 1000000
    size_max: 1200000
    if:
      type: import
      exact: InternetOpenA
  - id: internet-open-ansi-string
    desc: InternetOpenA named, not imported
    conf: 0.9
    if:
      type: text
      exact: InternetOpenA
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: internet-open-a-import
  - id: internet-connect-ansi-string
    desc: InternetConnectA named, not imported
    conf: 0.9
    if:
      type: text
      exact: InternetConnectA
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: internet-connect-a-import
  - id: http-open-request-ansi-string
    desc: HttpOpenRequestA API name reference
    conf: 0.9
    if:
      type: text
      exact: HttpOpenRequestA
  - id: http-send-request-ansi-string
    desc: HttpSendRequestA API name reference
    conf: 0.9
    if:
      type: text
      exact: HttpSendRequestA

composite_rules:
  - id: dynamic-wininet-http-api-cluster
    desc: Dynamically resolved WinInet request workflow
    conf: 0.94
    all:
      - id: internet-open-ansi-string
    any:
      - id: internet-connect-ansi-string
      - id: http-open-request-ansi-string
      - id: http-send-request-ansi-string
      - id: micro-behaviors/communications/http/client/wininet::internet-close-handle-str
    needs: 3
