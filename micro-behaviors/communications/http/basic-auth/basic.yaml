defaults:
  crit: notable
traits:
- platforms:
  - unix
  for:
  - shell
  conf: 0.85
  id: nginx-basic-auth-directive
  desc: nginx Basic Auth directive
  if:
    type: text
    regex: (?m)^[ \t]*auth_basic[ \t]+[^;\n]{1,100};
- platforms:
  - unix
  - windows
  for:
  - php
  conf: 0.9
  id: php-basic-auth-challenge
  desc: PHP Basic Auth challenge
  if:
    type: text
    regex: PHP_AUTH_USER[\s\S]{0,160}PHP_AUTH_PW[\s\S]{0,220}WWW-Authenticate
  unless:
  - id: well-known/app/enterprise/egroupware/
- platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  conf: 0.95
  id: basic-realm-challenge
  desc: HTTP Basic authentication realm challenge
  if:
    type: raw
    regex: (?i)\bBasic[ \t]+realm[ \t]*=
