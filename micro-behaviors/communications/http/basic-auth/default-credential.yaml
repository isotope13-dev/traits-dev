traits:
- platforms:
  - unix
  - windows
  for:
  - source
  - scripts
  - text
  - data
  id: basic-default-credential
  desc: HTTP Basic auth embeds default credentials
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: \bBasic[ \t]+(YWRtaW46YWRtaW4=|YWRtaW46cGFzc3dvcmQ=|cm9vdDpyb290)([^A-Za-z0-9+/=]|$)
