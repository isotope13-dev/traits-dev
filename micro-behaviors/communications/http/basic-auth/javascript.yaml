# Dynamic HTTP Basic Authorization header construction in JavaScript/TypeScript.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go, php]
  crit: notable
  conf: 0.93
  attack: "T1071.001"

traits:
  # `Basic ${btoa(user + ":" + pass)}` — the RFC 7617 Basic-auth scheme
  # literal built as a template literal around a base64 call. Written either
  # directly into an Authorization header or indirectly via an `auth`/
  # `authHeader` variable assigned first and referenced a few lines later
  # (e.g. Coinbase WalletLink's `this.auth = \`Basic ${btoa(session)}\``),
  # so the match anchors on the "Basic ${btoa(" shape itself rather than
  # requiring the literal word "Authorization" nearby.
  - id: js-basic-auth-btoa-template
    desc: Basic Auth header via btoa template
    if:
      type: text
      regex: '`Basic\s+\$\{\s*btoa\('
