defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-request-set-basic-auth
    desc: Go HTTP request sets Basic authentication
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.SetBasicAuth$'
      receiver:
        from:
          call: '^net/http\.NewRequest(WithContext)?$'
