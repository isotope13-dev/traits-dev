# Dynamic HTTP Basic Authorization header construction in Python.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.93
  attack: "T1071.001"

traits:
  # "Basic " + base64.b64encode(user + ":" + pass) — assembled at runtime
  # rather than a hardcoded Basic <literal> credential string.
  - id: python-basic-auth-b64-header
    desc: Builds Basic Auth header from base64
    if:
      type: text
      regex: '["'']Basic ["'']\s*\+\s*[^\n]{0,80}b64encode\s*\('
