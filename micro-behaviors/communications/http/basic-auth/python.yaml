# Dynamic HTTP Basic Authorization header construction in Python.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.93
  attack: "T1071.001"

traits:
  # "Basic " + base64.b64encode(user + ":" + pass) — assembled at runtime
  # rather than a hardcoded Basic <literal> credential string.
  - id: python-basic-auth-b64-header
    desc: Builds Basic Auth header from base64
    if:
      type: text
      regex: '["'']Basic ["'']\s*\+\s*[^\n]{0,80}b64encode\s*\('

  # urllib3's header builder: `make_headers(basic_auth="user:pass")` returns an
  # `Authorization: Basic <b64>` header. The keyword is what distinguishes it
  # from the same helper's user-agent/accept-encoding uses.
  - id: urllib3-make-headers-basic-auth
    desc: Builds Basic Auth header with urllib3
    if:
      type: text
      regex: 'make_headers\s*\([^)]{0,60}basic_auth\s*='
