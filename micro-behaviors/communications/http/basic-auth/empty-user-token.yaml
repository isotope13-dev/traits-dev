# Basic auth built as base64(":" + token): an empty username and a personal
# access token, the convention Azure DevOps and similar forges accept for
# API calls authenticated with a PAT.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: btoa-empty-user-token
    desc: Basic auth from empty user plus token
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'btoa\(\s*["'']:["'']\s*\+\s*[\w$.]+\s*\)'
