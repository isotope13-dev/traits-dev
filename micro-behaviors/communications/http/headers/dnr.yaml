defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: dnr-modify
    desc: DNR action uses modifyHeaders
    crit: notable
    conf: 0.9
    for: [javascript, typescript, json]
    if:
      type: text
      regex: '["'']?type["'']?\s*:\s*["'']modifyHeaders["'']'
      case_insensitive: true
  - id: dnr-remove
    desc: DNR operation remove
    crit: notable
    conf: 0.88
    for: [javascript, typescript, json]
    if:
      type: text
      regex: '["'']?(operation|headerOperation)["'']?\s*:\s*["'']remove["'']'
      case_insensitive: true
  - id: dnr-origin
    desc: DNR exact Origin header name
    crit: component
    conf: 0.6
    for: [javascript, typescript, json]
    if:
      type: text
      regex: '["'']?header["'']?\s*:\s*["'']?Origin["'']?'
      case_insensitive: true
  - id: access-control-allow-origin-header
    desc: Access-Control-Allow-Origin header name
    crit: component
    conf: 0.8
    for: [javascript, typescript, json]
    if:
      type: text
      substr: Access-Control-Allow-Origin
      case_insensitive: true
  - id: access-control-allow-methods-header
    desc: Access-Control-Allow-Methods header name
    crit: component
    conf: 0.8
    for: [javascript, typescript, json]
    if:
      type: text
      substr: Access-Control-Allow-Methods
      case_insensitive: true
  - id: access-control-allow-headers-header
    desc: Access-Control-Allow-Headers header name
    crit: component
    conf: 0.8
    for: [javascript, typescript, json]
    if:
      type: text
      substr: Access-Control-Allow-Headers
      case_insensitive: true
  - id: access-control-expose-headers-header
    desc: Access-Control-Expose-Headers header name
    crit: component
    conf: 0.8
    for: [javascript, typescript, json]
    if:
      type: text
      substr: Access-Control-Expose-Headers
      case_insensitive: true
  - id: dnr-set-operation
    desc: DNR operation set
    crit: component
    conf: 0.8
    for: [javascript, typescript, json]
    if:
      type: text
      regex: 'operation.{0,24}set'
  - id: dnr-access-control-credentials-set
    desc: DNR sets CORS credentials response header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"Access-Control-Allow-Credentials"[\s\S]{0,160}"operation"\s*:\s*"set"'
  - id: dnr-referer-header
    desc: DNR rule names Referer header
    crit: component
    conf: 0.8
    for: [javascript, typescript, json]
    if:
      type: text
      regex: 'header.{0,24}(Referer|Referrer)'
      case_insensitive: true
  - id: dnr-origin-empty-set
    desc: DNR clears Origin request header
    crit: notable
    conf: 0.85
    for: [javascript, typescript, json]
    if:
      type: text
      regex: '"Origin"[\s\S]{0,160}"value"\s*:\s*""'
  - id: dnr-client-hints-remove
    desc: DNR removes Sec-CH-UA headers
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"Sec-Ch-Ua(-Mobile|-Platform)?"[\s\S]{0,160}"operation"\s*:\s*"remove"'
  - id: client-identity-headers
    desc: Client identity HTTP headers
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: "X-Client-(OS|IP|User)"
composite_rules:
  - id: dnr-security-header-remove
    desc: DNR removes CSP or frame headers
    crit: notable
    conf: 0.96
    for: [javascript, typescript, json]
    all:
      - id: dnr-remove
    any:
      - id: micro-behaviors/communications/http/header/security::dnr-csp-header-field
      - id: micro-behaviors/communications/http/header/security::dnr-legacy-csp-header-field
      - id: micro-behaviors/communications/http/header/security::dnr-frame-options-header-field
    near_bytes: 120
  - id: dnr-sec-fetch-spoof
    desc: DNR modifies Sec-Fetch request header
    crit: notable
    conf: 0.85
    all:
      - id: dnr-modify
      - id: micro-behaviors/communications/http/headers::sec-fetch-request-header
  - id: dnr-origin-strip
    desc: DeclarativeNetRequest rule removes an Origin-named header
    crit: suspicious
    conf: 0.95
    all:
      - id: dnr-modify
      - id: dnr-remove
      - id: dnr-origin
    near_bytes: 120
    unless:
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
      # Translator extensions set Origin/Referer for CORS to their backend while
      # separately removing CSP; that is not Origin stripping.
      - id: metadata/package/quality/benign-context::translator-security-context
  - id: dnr-cors-origin-rewrite
    desc: DeclarativeNetRequest rule rewrites CORS allow-origin response header
    crit: notable
    conf: 0.9
    all:
      - id: dnr-modify
      - id: dnr-access-control-allow-origin-set
  - id: dnr-referer-header-set
    desc: DNR sets Referer header
    crit: notable
    conf: 0.8
    all:
      - id: dnr-referer-header
      - id: dnr-set-operation
    near_bytes: 240
  - id: dnr-origin-header-set
    desc: DNR sets Origin header
    crit: notable
    conf: 0.8
    all:
      - id: dnr-origin
      - id: dnr-set-operation
    near_bytes: 240
  - id: dnr-cors-credentials-rewrite
    desc: DeclarativeNetRequest rule rewrites credentialed CORS response headers
    crit: notable
    conf: 0.92
    all:
      - id: dnr-cors-origin-rewrite
      - id: dnr-access-control-credentials-set
  - id: dnr-access-control-allow-origin-set
    desc: DNR sets Access-Control-Allow-Origin response header
    crit: notable
    conf: 0.9
    all:
      - id: access-control-allow-origin-header
      - id: dnr-set-operation
    near_bytes: 240
  - id: dnr-access-control-allow-methods-set
    desc: DNR sets Access-Control-Allow-Methods response header
    crit: notable
    conf: 0.9
    all:
      - id: access-control-allow-methods-header
      - id: dnr-set-operation
    near_bytes: 240
  - id: dnr-access-control-allow-headers-set
    desc: DNR sets Access-Control-Allow-Headers response header
    crit: notable
    conf: 0.9
    all:
      - id: access-control-allow-headers-header
      - id: dnr-set-operation
    near_bytes: 240
  - id: dnr-access-control-expose-headers-set
    desc: DNR sets Access-Control-Expose-Headers response header
    crit: notable
    conf: 0.9
    all:
      - id: access-control-expose-headers-header
      - id: dnr-set-operation
    near_bytes: 240
  - id: dnr-cors-permissive-response
    desc: DNR sets multiple permissive CORS response headers
    crit: notable
    conf: 0.96
    all:
      - id: dnr-modify
    any:
      - id: dnr-access-control-allow-origin-set
      - id: dnr-access-control-allow-methods-set
      - id: dnr-access-control-allow-headers-set
      - id: dnr-access-control-expose-headers-set
    needs: 2
  - id: dnr-additional-security-header-modification
    desc: DNR adds an additional security-header modification
    crit: notable
    conf: 0.9
    any:
      - id: dnr-cors-credentials-rewrite
      - id: dnr-sec-fetch-spoof
      - id: dnr-client-hints-remove
      - id: dnr-cors-permissive-response
  - id: dnr-request-context-header-set
    desc: DNR sets Origin or Referer request header
    crit: notable
    conf: 0.9
    all:
      - id: dnr-modify
    any:
      - id: dnr-referer-header-set
      - id: dnr-origin-header-set
    unless:
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
      - id: dnr-origin-empty-set
