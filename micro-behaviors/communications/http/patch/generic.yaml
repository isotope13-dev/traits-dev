defaults:
  platforms: [unix, windows]
  for: [json, text, scripts, source]
  crit: notable
  conf: 0.88
  attack: T1071.001

traits:
  # A quoted token alone is commonly part of an HTTP library's supported-verb
  # table. Keep it as a composable fragment; request-shaped rules are notable.
  - id: quoted-patch-token
    desc: Quoted HTTP PATCH token
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '["'']PATCH["'']'

  - id: http-patch-method-field
    desc: HTTP PATCH method marker
    if:
      type: text
      regex: '(?i)\bmethod\s*[:=]\s*["'']PATCH["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: http-patch-option
    desc: HTTP PATCH request option
    if:
      type: text
      regex: '(?i)(-X\s*PATCH|--request\s+PATCH)'

  - id: http-patch-client-call
    desc: HTTP PATCH client call
    if:
      type: text
      regex: '(?i)\b(requests|httpx|axios)\s*\.\s*patch\s*\('

composite_rules:
  - id: patch-method-detection
    desc: Uses or defines an HTTP PATCH method
    crit: notable
    conf: 0.9
    any:
      - id: http-patch-method-field
      - id: http-patch-option
      - id: http-patch-client-call
