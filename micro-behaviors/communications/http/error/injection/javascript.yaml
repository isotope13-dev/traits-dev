defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: weighted-network-error-type-picker
    desc: Weighted network error type picker
    conf: 0.91
    if:
      type: text
      regex: 'errorTypes.{0,120}weight.{0,80}Timeout'

  - id: encoded-fault-config-url
    desc: Base64 decodes to fault-config URL
    conf: 0.93
    if:
      type: encoded
      substr: fault-config

  - id: fault-injector-config-update
    desc: Updates fault injector configuration
    conf: 0.92
    if:
      type: text
      regex: 'faultInjector.{0,40}updateConfig'

composite_rules:
  - id: remote-fault-config-fetch
    desc: Fetches remote fault configuration
    crit: suspicious
    conf: 0.94
    near_bytes: 4096
    all:
      - id: encoded-fault-config-url
      - id: micro-behaviors/communications/http/error/probabilistic::fault-injector-module
    any:
      - id: micro-behaviors/data/decode/symbol-base64::atob-decode
      - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64
      - id: micro-behaviors/data/decode/symbol-base64::buffer-from-base64-literal-to-text
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/communications/http/get::axios-require-get-call
      - id: micro-behaviors/communications/http/response::axios-client-reference
