defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: failure-rate-config-field
    desc: Config exposes a failureRate threshold
    conf: 0.88
    if:
      type: text
      word: failureRate

  - id: request-should-fail-gate
    desc: Defines a shouldFail request gate
    conf: 0.9
    if:
      type: text
      word: shouldFail

  - id: store-targeted-failure-rate
    desc: Store-scoped failure rate configuration
    conf: 0.92
    if:
      type: text
      word: storeAffectedRate

  - id: fault-injector-module
    desc: Exports or references a faultInjector module
    conf: 0.9
    if:
      type: text
      word: faultInjector

composite_rules:
  - id: probabilistic-request-failure-gate
    desc: Probabilistic request failure gate
    crit: suspicious
    conf: 0.93
    near_bytes: 4096
    all:
      - id: failure-rate-config-field
      - id: request-should-fail-gate
      - id: micro-behaviors/os/random/prng/stdlib::math-random-call
