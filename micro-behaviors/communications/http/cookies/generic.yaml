defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: cookie-header
    desc: HTTP Cookie request header string
    crit: notable
    conf: 0.7
    for: [scripts]
    if:
      type: string_literal
      regex: '^Cookie:[ \t]'
    unless:
      - id: micro-behaviors/data/source/build::icon-registry-bundle
      - id: metadata/lang/scripted::dts-declaration-file
  # The header LINE form only -- `Cookie:` followed by a space. Programs that
  # print their own session cookie with a `Cookie: %s` label match too, so the
  # description states the string that was found, not an HTTP role.
  - id: ascii-cookie-header-binary
    desc: Cookie header-form string in binary
    crit: notable
    conf: 0.75
    for: [binaries]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_:.-])Cookie:[ \t]'
  - id: utf16-cookie-header-pe
    desc: UTF-16 Cookie header in PE
    crit: notable
    conf: 0.75
    for: [pe, dll]
    if:
      type: hex
      section: .rdata
      pattern: 43 00 6F 00 6F 00 6B 00 69 00 65 00 3A 00
  - id: set-cookie-header
    desc: Set-Cookie header
    crit: notable
    conf: 0.5
    if:
      # A literal avoids treating protocol examples in comments as runtime
      # header handling.
      type: literal
      substr: 'Set-Cookie:'
  - id: javascript-response-set-cookie-header-read
    desc: Response object reads Set-Cookie header
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(response|resp|res|reply|upstream|proxied|rawResponse)\.headers\.get\(["'']set-cookie'
    not:
      - regex: '\b(t|test|assert)\.(ok|strictEqual|deepStrictEqual|equal)\s*\([^)]*headers\.get\(\s*[''"]set-cookie'
      - substr: getSetCookie
    unless:
      - id: well-known/app/publishing/decocms::decocms-package
      - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
      - id: well-known/lib/data/stacksjs-stx::stx-package-context
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - type: path
        regex: '[\\/]tests?[\\/]'
      - type: path
        regex: '(^|[\\/])node_modules[\\/]@?(better-auth|decocms|fetch-cookie)[\\/]'
      - type: text
        substr: parseSetCookieHeader
      - id: well-known/app/security/bitwarden::bitwarden-portable-context
      - id: well-known/app/security/bitwarden::bitwarden-app
  - id: python-response-set-cookie-header-read
    desc: Python response object reads Set-Cookie header
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)headers\.get$'
      arg:
        kind: string
        regex: '(?i)^Set-Cookie$'
    unless:
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - type: path
        regex: '[\\/]tests?[\\/]'
  - id: http-cookiejar
    desc: http.cookiejar module
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: http.cookiejar
  - id: package-session-cookie-handling-claim
    desc: Package claims session-cookie handling
    crit: component
    conf: 0.9
    for: [pkginfo]
    if:
      type: text
      regex: '(?i)\b(support|persist|preserv|reus|sav|load)\w{0,4}\s+(browser\s+)?session cookies?\b'
  - id: domain-attribute
    desc: Cookie Domain attribute
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: ; Domain
  - id: httponly-attribute
    desc: Cookie HttpOnly attribute
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: ; HttpOnL
  - id: ruby-cookie-scanner-call
    desc: Ruby cookie scanner call
    crit: notable
    conf: 0.8
    for: [ruby]
    ref: sha256:cb5a8b1ff089ddb098465519e2e382e012322fb4e8986fdc814f08410cedc339
    if:
      type: symbol
      kind: member
      regex: '(^|\.)scan_(set_)?cookie$'
composite_rules:
  - id: cookies
    desc: HTTP cookie handling
    crit: notable
    conf: 0.66
    any:
      - id: cookie-header
      - id: ascii-cookie-header-binary
      - id: utf16-cookie-header-pe
      - id: set-cookie-header
      - id: http-cookiejar
      - id: domain-attribute
      - id: httponly-attribute
      - id: ruby-cookie-scanner-call
