# WinINet Cookie Manipulation
# Symbol references can indicate cookie handling but do not establish intent.
defaults:
  crit: notable
  for: ["c", "cpp", "pe", "dll"]
  platforms: ["windows"]
traits:
  - id: internet-set-cookie
    desc: WinINet InternetSetCookie symbol
    conf: 0.9
    if:
      type: symbol
      regex: "^InternetSetCookie[AW]?$"
  - id: internet-get-cookie
    desc: WinINet InternetGetCookie symbol
    conf: 0.9
    if:
      type: symbol
      regex: "^InternetGetCookie[AW]?$"
composite_rules:
  - id: wininet-cookie-manipulation
    desc: WinINet cookie API and header references
    # Set+Get together is routine session management in download managers,
    # browsers, and installers — too common for suspicious on its own. Keep
    # notable so differentials still surface the capability; hostile/theft
    # composites that need cookie APIs should add their own intent legs.
    conf: 0.85
    all:
      - id: internet-set-cookie
    any:
      - id: internet-get-cookie
      - id: micro-behaviors/communications/http/cookies::set-cookie-header
