# Incomplete cookie-property vocabulary; actual property writes are separate.
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
traits:
  - id: cookie-property-expiry-strings
    desc: Cookie property and expiry strings nearby
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '"cookie".{0,240}expires='
