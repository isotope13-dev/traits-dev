defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
- id: cookie-json-request-body
  desc: JSON request body includes named cookie data
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: 'body\s*:\s*JSON\.stringify\s*\(\s*\{[^}\r\n]{0,240}\bcookies\b'
