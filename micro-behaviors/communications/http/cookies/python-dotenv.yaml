defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  # Bind the environment read to the outgoing Cookie header. A bare dotenv
  # load plus a Cookie header does not establish this data relationship.
  - id: python-env-value-in-cookie-header
    desc: Places environment value in Cookie header
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '["'']Cookie["'']\s*:\s*f["''][^\n]{0,180}\bos\.getenv\s*\('

