defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

composite_rules:
  # Configuration loading and authenticated requests are capabilities. These
  # conditions do not bind the loaded file to the Cookie or establish theft.
  - id: python-dotenv-cookie-get-context
    desc: Dotenv, environment reads, and Cookie GET
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/config::python-dotenv-load
      - id: micro-behaviors/communications/http/cookies::cookie-header-construction
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/os/env/read::python-os-getenv-call

