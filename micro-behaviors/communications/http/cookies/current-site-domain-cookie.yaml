# document.cookie written with Domain set to the current page's own host via a
# template (`domain=.${host}`): a script planting a cookie on whatever site it
# runs on, as affiliate/referral cookie stuffing does. A non-empty value is
# required so cookie-clearing helpers (`name=; expires=...1970`) do not match.
traits:
  - id: document-cookie-current-host-domain
    desc: Sets cookie domain to current page host
    crit: notable
    conf: 0.88
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: 'document\.cookie\s*=\s*`[^=`]{1,40}=[^;`]{1,80};[^`]{0,60}domain=\.?\$\{'
