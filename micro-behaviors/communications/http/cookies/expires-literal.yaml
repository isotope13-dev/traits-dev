# A string literal that is exactly the ";expires=" cookie attribute, as kept
# in a string table by hand-built document.cookie setters.
traits:
  - id: cookie-expires-attribute-literal
    desc: String literal is a cookie expires attribute
    crit: component
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: literal
      kind: string
      regex: '^;\s?expires=$'
