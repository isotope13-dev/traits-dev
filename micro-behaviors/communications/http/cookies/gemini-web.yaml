# A local cookie query and a first-party RPC endpoint establish a sensitive
# client capability, not stolen credentials, consent, or an exfiltration sink.
# Keep it visible in both gated and ungated clients. Redirect leakage is
# reported separately by communications/http/redirect.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]

composite_rules:
  - id: chromium-cookie-gemini-web-cooccurrence
    desc: Chromium cookie query co-occurs with Gemini Web RPC
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/communications/http/services/gemini::gemini-web-bard-stream-api
