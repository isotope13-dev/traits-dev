defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: uid-cookie-name-field
    desc: "Cookie name field specifies uid"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'name\s*:\s*["'']uid["'']'
  - id: extension-config-cookie-name
    desc: "Extension configuration cookie name"
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: ext_config
  - id: extension-cookie-expiration-field
    desc: "Cookie API with expiration field"
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bcookies\.(getAll|set)\s*\([\s\S]{0,400}\bexpirationDate\b'
  - id: extension-cookie-change-listener
    desc: Browser extension cookie change listener
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: cookies.onChanged.addListener
