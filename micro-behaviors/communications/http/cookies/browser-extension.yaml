defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: extension-cookie-expiration-field
    desc: "Cookie API with expiration field"
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bcookies\.(getAll|set)\s*\([\s\S]{0,400}\bexpirationDate\b'
