defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: extension-get-cookies-command
    desc: Extension exposes get_cookies command
    crit: notable
    conf: 0.92
    for: [javascript, typescript, chrome-manifest]
    if:
      type: text
      regex: '\bget[_-]?cookies\b|["'']get_cookies["'']'

  - id: extension-capture-cookies-action
    desc: Extension declares cookie-capture action
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']CAPTURE_COOKIES["'']|type\s*:\s*["'']CAPTURE_COOKIES["'']'


composite_rules:
  - id: extension-cookie-access-command
    desc: Extension exposes a cookie-access command
    crit: notable
    conf: 0.94
    any:
      - id: extension-get-cookies-command
      - id: micro-behaviors/communications/http/cookies::extension-capture-cookies-action

