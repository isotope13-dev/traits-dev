defaults:
  platforms: [windows]
  for: [scripts, binaries, source]

traits:
- id: chromium-app-bound-encrypted-key-field
  desc: References Chromium App-Bound key field
  crit: notable
  conf: 0.85
  attack: T1555.003
  if:
    type: text
    word: app_bound_encrypted_key

- id: system-browser-profile-cookie-import-helper
  desc: System browser cookie import helper reference
  crit: notable
  conf: 0.96
  for: [javascript, typescript]
  platforms: [macos, windows]
  if:
    # Text survives in generated bundles too large for syntax parsing.
    type: text
    substr: SystemProfileCookies

composite_rules:
- id: local-system-browser-cookie-import
  desc: Local system browser cookie import workflow
  crit: exception
  conf: 0.98
  for: [javascript, typescript]
  platforms: [macos]
  all:
    - id: system-browser-profile-cookie-import-helper
    - id: metadata/library/automation::browser-profile-chrome-key-material
