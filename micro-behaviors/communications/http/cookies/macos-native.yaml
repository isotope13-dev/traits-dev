defaults:
  platforms: [macos]
  for: [macho]
  attack: T1555.003
  mbc: B0028

traits:
  - id: cookiesnamed-symbol
    desc: "Cookie lookup method reference"
    crit: notable
    conf: 0.95
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.CookiesNamed$
  - id: setcookies-symbol
    desc: "Cookie setter method reference"
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.SetCookies$
