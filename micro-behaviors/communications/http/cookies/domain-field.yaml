# A JS object property `domain: "host.tld"` -- the shape of a cookie
# filter/record, but also of any config naming a host.
defaults:
  platforms: [unix, windows]
traits:
- id: domain-field-hostname-literal
  desc: domain field set to a hostname literal
  for: [javascript, typescript]
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: "domain\\s*:\\s*['\\\"][A-Za-z0-9._-]+\\.[A-Za-z]{2,}['\\\"]"
