defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-mcp-browser-context-cookie-tool
    desc: MCP tool reads browser-context cookies
    crit: suspicious
    conf: 0.96
    if:
      type: yara
      source: |
        rule python_mcp_browser_context_cookie_tool {
          strings:
            $tool = "@mcp.tool(name=\"browser_cookies_get\""
            $handler = "async def browser_cookies_get("
            $action = "action_name=\"browser_cookies_get\""
            $read = "operation=lambda browser: get_cookies("
          condition:
            all of them and @tool < @handler and @handler < @action and
            @action < @read and @read - @tool < 1024
        }
