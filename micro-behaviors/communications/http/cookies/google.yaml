# Google authentication-cookie names used by browser automation and HTTP
# clients. These protocol fields are language-neutral, so keep them outside the
# JavaScript-specific cookie API file and cover source/scripts across stacks.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1539
  mbc: C0002

traits:
  # Each short name is one fragment of Google's auth-cookie set and carries no
  # standalone meaning: "SSID" is also a Wi-Fi network name and "SID" is also
  # a Windows security identifier. The set composite requires two of three.
  - id: google-auth-cookie-sid
    desc: Quoted SID cookie name
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "['\\\"]SID['\\\"]"
    unless:
      - id: metadata/build/scaffold::antlr-generated-parser

  - id: google-auth-cookie-hsid
    desc: Quoted HSID cookie name
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "['\\\"]HSID['\\\"]"
    unless:
      - id: metadata/build/scaffold::antlr-generated-parser

  - id: google-auth-cookie-ssid
    desc: Quoted SSID cookie name
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "['\\\"]SSID['\\\"]"
    unless:
      - id: metadata/build/scaffold::antlr-generated-parser

  - id: google-auth-cookie-long-name
    desc: Google long authentication cookie name
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "['\\\"](APISID|SAPISID|__Secure-[13]PSID|__Host-GAPS)['\\\"]"

composite_rules:
  - id: google-auth-cookie-short-name
    desc: Google short auth cookie name pair
    crit: notable
    conf: 0.98
    any:
      - id: google-auth-cookie-sid
      - id: google-auth-cookie-hsid
      - id: google-auth-cookie-ssid
    needs: 2

  - id: google-auth-cookie-name
    desc: Google authentication cookie name
    crit: notable
    conf: 0.98
    any:
      - id: google-auth-cookie-short-name
      - id: google-auth-cookie-long-name
