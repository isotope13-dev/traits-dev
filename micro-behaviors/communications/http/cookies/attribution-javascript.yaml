# Captures nearby URL-query parsing and cookie assignment on one syntactic
# path. File-wide co-occurrence is insufficient: large web bundles routinely
# read location.search and write unrelated session or preference cookies.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: js-cookie-with-url-params
    desc: Writes URL query data to cookies
    if:
      type: text
      regex: 'URLSearchParams\(\s*\w*\.?location\.search\s*\)[\s\S]{0,512}document\.cookie\s*='
