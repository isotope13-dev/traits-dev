defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: cookie-helper-get-call
    desc: Calls Cookies.get or js_cookie.get helper
    if:
      type: symbol
      kind: call
      regex: '^(Cookies|js_cookie)\.get$'
  - id: cookie-helper-set-call
    desc: Calls a cookie-setting helper method
    for: [javascript, typescript, python]
    if:
      type: symbol
      kind: call
      regex: '^(Cookies|js_cookie)\.set$|(^|\.)set_cookies$'
