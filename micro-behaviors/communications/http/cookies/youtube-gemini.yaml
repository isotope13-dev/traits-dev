defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]

composite_rules:
  - id: youtube-cookie-auth-reference
    desc: YouTube URL and Google authentication cookie references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google::youtube-watch-url-reference
      - id: micro-behaviors/communications/http/cookie-name::google-auth-cookie-name

  # Reading an existing session for its own service can be legitimate.
  # The archive-wide conjunction cannot prove consent, a particular call path,
  # or theft. Keep the sensitive capability visible without those claims.
  - id: browser-cookie-youtube-gemini-auth-cooccurrence
    desc: Browser cookie query co-occurs with YouTube and Gemini authentication
    crit: notable
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/communications/http/services/gemini::gemini-web-bard-stream-api
      - id: youtube-cookie-auth-reference
    # These are first-party authentication indicators. Neither a missing
    # opt-in nor a YouTube URL establishes unauthorized use or a foreign sink.
    # Benign context does not suppress a correctly named neutral capability.
