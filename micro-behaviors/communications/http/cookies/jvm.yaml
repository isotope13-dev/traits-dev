# Server-side JVM cookie access is a neutral HTTP capability. JSP webshell
# composites combine it with process execution, decoding, and socket behavior.
defaults:
  platforms: [unix, windows]
  # JSP pages are content-classified because cleave has no jsp file type.
  for: [java, class, html, javascript, python, vbs]

traits:
  - id: servlet-request-cookie-read
    desc: Servlet reads request cookies
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: request.getCookies

  - id: servlet-cookie-helper-read
    desc: Servlet page calls a cookie lookup helper
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b([A-Za-z_$][\w$]*\.)?getCookie\s*\(\s*["''][A-Za-z][A-Za-z0-9_-]{1,40}["'']\s*\)'
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory
