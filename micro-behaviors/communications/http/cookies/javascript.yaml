# Browser Cookie Access - JavaScript/Browser-side
# Detects access to browser document.cookie DOM API and URL parameter harvesting
# ATT&CK: T1539 (Steal Web Session Cookie)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"
  mbc: "C0002"
traits:
  - id: cookie-helper-set-function
    desc: Defines setCookie helper
    crit: component
    if:
      type: symbol
      exact: setCookie
  - id: cookie-helper-clear-function
    desc: Defines clearCookie helper
    crit: component
    if:
      type: symbol
      exact: clearCookie
  - id: cookie-helper-get-function
    desc: Defines getCookie helper
    crit: component
    if:
      type: symbol
      exact: getCookie

  - id: linkedin-session-cookie-name
    desc: References LinkedIn li_at session cookie
    crit: notable
    conf: 0.99
    if:
      type: literal
      exact: li_at

  - id: instagram-session-cookie-name
    desc: References Instagram session cookie name
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: "['\\\"](sessionid|ds_user_id)['\\\"]"

  - id: instagram-session-cookie-check
    desc: Checks Instagram session cookie pair
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bds_user_id\b[\s\S]{0,120}\bsessionid\b'

  - id: cookie-value-json-payload
    desc: Serializes named cookie data in JSON
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      case_insensitive: true
      regex: 'JSON\.stringify\s*\([^)]{0,80}\b(li_at|JSESSIONID|cookies?)\b[^)]{0,80}\)'

  - id: cookie-value-body-field
    desc: Places named cookie data in request field
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      case_insensitive: true
      regex: '\b(body|data|payload)\s*:\s*[^,}\n]{0,60}\bcookies?\b'

  - id: cookie-json-send-call
    desc: Sends serialized JSON containing cookie data
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.send\s*\(\s*JSON\.stringify\s*\(\s*\{[\s\S]{0,240}\bcookies?\s*:'

  - id: cookie-backend-sync-function
    desc: Synchronizes cookies with remote backend
    crit: notable
    conf: 0.95
    if:
      type: function
      exact: syncCookieToBackend

  - id: session-cookie-name
    desc: References a named session cookie
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "['\\\"]__session['\\\"]"

  - id: cookiebot-consent-state
    desc: Reads Cookiebot consent state
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: Cookiebot(\?\.|\.)consent

  - id: document-cookie-read
    desc: Accesses browser document.cookie property
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: member
      exact: document.cookie
    unless:
      - id: metadata/library/axios::axios-class
      - id: metadata/library/axios::axios-version
      - id: metadata/document/html::doctype

  # Symbol extraction misses some compact phishing loaders; text fallback
  # covers inline HTML attachments and plain JS sources alike.
  - id: html-document-cookie-read
    desc: Script source reads document.cookie
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bdocument\s*\.\s*cookie\b'

  - id: parent-document-cookie-read
    desc: Reads parent frame document cookies
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: parent.document.cookie

  - id: document-cookie-split-iterate
    desc: Iterates all cookies via document.cookie.split
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: document.cookie.split
    unless:
      - id: metadata/library/axios::axios-class
      - id: metadata/library/axios::axios-version
      - id: metadata/document/html::doctype

  - id: document-cookie-match
    desc: "Regex scans cookies via document.cookie.match"
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: document.cookie.match
    unless:
      - id: metadata/library/axios::axios-class
      - id: metadata/library/axios::axios-version
      - id: metadata/document/html::doctype

  - id: tiktok-webid-cookie-match
    desc: Matches TikTok webid cookie
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'document\.cookie\.match\s*\([^)]{0,120}s_v_web_id'

  - id: document-cookie-write
    desc: "Sets browser cookie via document.cookie assign"
    crit: notable
    conf: 0.65
    if:
      type: symbol
      kind: bind
      exact: document.cookie
    unless:
      - id: metadata/library/axios::axios-class
      - id: metadata/library/axios::axios-version

  - id: browser-page-cookie-read
    desc: Reads browser cookies with Puppeteer
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: page.cookies

composite_rules:
  - id: cookie-helper-function-definitions
    desc: Defines set get and clear cookie helpers
    crit: notable
    conf: 0.8
    any:
      - id: cookie-helper-set-function
      - id: cookie-helper-clear-function
      - id: cookie-helper-get-function
  - id: cookie-value-request-payload
    desc: Includes named cookie data in request payload
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    any:
      - id: cookie-value-json-payload
      - id: cookie-value-body-field

  # Either spelling of the same read, for composites that must not care whether
  # the access was recovered as a member expression or as inline page markup.
  - id: browser-document-cookie-read
    desc: Browser code reads document.cookie
    crit: notable
    conf: 0.9
    any:
      - id: document-cookie-read
      - id: html-document-cookie-read

  # A cookie value leaving the browser is security-relevant even when it is
  # part of an explicitly authorized integration.  Cookie-presence checks used
  # to authenticate first-party requests do not establish this behavior.
  - id: linkedin-session-cookie-backend-sync
    desc: LinkedIn cookie value backend synchronization code
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: chrome-cookies-get-all
      - id: linkedin-session-cookie-name
      - id: cookie-value-request-payload
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
