defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-encrypted-browser-cookie-decryption-profile
    desc: Cookie queries accompany AES decryption
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/db/access::chromium-encrypted-cookie-sql
      - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-new
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
