defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-encrypted-browser-cookie-decryption-profile
    desc: Cookie queries accompany AES decryption
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/db/read/column::chromium-encrypted-cookie-sql
      - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
      - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-new-symbol-reference
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-method-call
  - id: python-cookie-decryption-without-login-query
    desc: Cookie decryption without login-table clues
    crit: notable
    conf: 0.95
    all:
      - id: python-encrypted-browser-cookie-decryption-profile
    unless:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
