defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1071.001

traits:
  - id: go-request-add-cookie
    desc: Attaches an HTTP cookie to Go request
    if:
      type: text
      # Cookies can also be supplied directly through the request header.
      regex: '\.AddCookie\s*\(\s*&?[A-Za-z_]\w*|\.Header\.Set\s*\(\s*"Cookie"\s*,'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: go-response-cookies-read
    desc: Reads cookies from Go HTTP response
    if:
      type: text
      regex: '\.Cookies\s*\(\s*\)'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
