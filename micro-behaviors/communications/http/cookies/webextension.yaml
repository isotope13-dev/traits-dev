# Browser-extension cookie store access (chrome.cookies / browser.cookies).
# Reads/writes cookies across sites; credential-adjacent, so notable.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: chrome-cookies-api
    desc: Uses extension cookies API
    if:
      type: text
      regex: '(^|\.)(chrome|browser)\.cookies\.[A-Za-z_]'
  - id: chrome-cookies-get-all
    desc: Enumerates extension-accessible cookies
    if:
      type: symbol
      kind: call
      regex: '(^|\.)cookies\.getAll$'
  # An EMPTY filter: every cookie for every domain in the profile. This is the
  # line between a stealer and a legitimate extension -- a cashback, dropship
  # or outreach extension always scopes its query (a domain, a url, or a name
  # list) because it only wants its own merchant's cookies. The
  # crx-yarrowguard-cookie-exfil fixture calls `cookies.getAll({}, cb)`;
  # Cuponomia, DSers and Sprouts all pass a filter.
  - id: chrome-cookies-get-all-unscoped
    desc: Enumerates every cookie in the profile
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\b(chrome|browser)\.cookies\.getAll\s*\(\s*\{\s*\}'
  - id: chrome-cookies-get-all-text
    desc: Enumerates cookies via extension API text
    if:
      type: text
      regex: '\b(chrome|browser)\.cookies\.getAll\s*\('
  - id: cookie-map-name-value
    desc: Maps cookie name and value fields
    conf: 0.92
    if:
      type: text
      regex: 'cookies\.map\s*\([^)]{0,80}\{[\s\S]{0,160}\bname\b[\s\S]{0,80}\bvalue\b'
  - id: extension-cookie-presence-message
    desc: Requests cookies through extension messaging
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'runtime\.sendMessage[\s\S]{0,64}getAllCookies?'
  - id: chrome-cookies-get
    desc: Reads a cookie through WebExtension API
    if:
      type: symbol
      kind: call
      regex: '^(chrome|browser)\.cookies\.get$'
  - id: chrome-cookies-set
    desc: Writes browser cookies
    if:
      type: symbol
      kind: member
      regex: '(^|\.)cookies\.set$'
  - id: chrome-cookies-on-changed-listener
    desc: Watches browser cookie changes
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)((chrome|browser)\.)?cookies\.onChanged\.addListener$'
  # The removal branch of a cookies.onChanged handler: the extension reads
  # whether the changed cookie was deleted. Benign cookie managers do this
  # to refresh their UI; paired with a rewrite it becomes cookie respawn.
  - id: cookies-removed-change-handler
    desc: Handles removed-cookie change event
    conf: 0.9
    if:
      type: text
      regex: 'cookies\.onChanged\.addListener[\s\S]{0,800}\.removed\b'
  - id: cookie-field-in-request-object
    desc: Places cookie data in request object
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']?cookie["'']?\s*:\s*[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)?'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: netscape-cookie-file-header
    desc: Formats Netscape cookie export data
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      substr: '# Netscape HTTP Cookie File'
  - id: same-origin-request-marker
    desc: HTTP request enables same-origin credentials
    crit: notable
    conf: 0.95
    if:
      # Match an actual request-options property, not generated enum tables
      # that merely enumerate "same-origin" as a possible value.
      type: tree-sitter
      language: javascript
      query: |
        (pair
          key: (property_identifier) @key
          value: (string (string_fragment) @value)
          (#eq? @key "credentials")
          (#eq? @value "same-origin"))
composite_rules:
  - id: same-origin-extension-cookie-request
    desc: Extension reuses cookies for same-origin request
    crit: exception
    conf: 0.98
    all:
      - id: same-origin-request-marker
      - id: chrome-cookies-get-all-text
      - id: cookie-field-in-request-object
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: webextension-cookie-export
    desc: Exports browser cookies in Netscape format
    crit: notable
    conf: 0.96
    all:
      - id: chrome-cookies-get-all
      - id: netscape-cookie-file-header
  # Every leg here is a JavaScript fact, so there is nothing to pool across
  # archive members -- and pooling made the description false: btoa in one
  # bundled module, atob in another and a clipboard write in a third are not a
  # cookie transfer. Keep them in one file and within a few hundred bytes of
  # each other, which is what an actual cookie-to-clipboard handler looks like.
  - id: webextension-cookie-clipboard-transfer
    desc: Transfers browser cookies through clipboard
    crit: notable
    conf: 0.96
    near_bytes: 1200
    all:
      - id: chrome-cookies-get-all
      - id: chrome-cookies-set
      - id: micro-behaviors/data/encode/base64::btoa-symbol
      - id: micro-behaviors/data/decode/symbol-base64::atob-decode
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  - id: all-url-service-worker-cookie-access
    desc: All-URL service worker enumerates cookies
    crit: notable
    conf: 0.9
    # is-chrome-manifest/broad-host-access/permission-cookies/background-
    # service-worker are chrome-manifest-only facts, while chrome-cookies-
    # get-all is javascript/typescript-only -- no single leaf node can ever
    # carry both, so this must pool across the extension's own members
    # (mirrors webextension-cookie-clipboard-transfer above).
    for: [chrome-manifest, javascript, typescript, crx, xpi, zip]
    scope: archive
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: metadata/permission/manifest::background-service-worker
      - id: chrome-cookies-get-all
    any:
      - id: metadata/permission/download::permission-downloads
      - id: metadata/permission/network::web-request
      - id: chrome-cookies-on-changed-listener
