defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: cookie-map-name-value
  desc: Maps cookie name and value fields
  conf: 0.92
  if:
    type: text
    regex: cookies\.map\s*\([^)]{0,80}\{[\s\S]{0,160}\bname\b[\s\S]{0,80}\bvalue\b
- id: cookie-object-field
  desc: Object field named cookie holds a variable
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '([{\n,]\s*["'']?cookie["'']?)\s*:\s*[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)?\s*[,}\n\r]'
  # CSS inlined into bundles: icon-font selectors such as `.ti-cookie:before`
  # read as a `cookie: before` object field.
  not:
  - regex: '^cookie:(before|after|hover|focus|active|not|first-child|last-child)$'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: netscape-cookie-file-header
  desc: Formats Netscape cookie export data
  crit: notable
  conf: 0.95
  if:
    type: literal
    kind: string
    substr: '# Netscape HTTP Cookie File'
- id: same-origin-request-marker
  desc: HTTP request enables same-origin credentials
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    language: javascript
    query: |
      (pair
        key: (property_identifier) @key
        value: (string (string_fragment) @value)
        (#eq? @key "credentials")
        (#eq? @value "same-origin"))
composite_rules:
- id: same-origin-extension-cookie-request
  desc: Extension reuses cookies for same-origin request
  crit: exception
  conf: 0.98
  all:
  - id: same-origin-request-marker
  - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all-text
  - id: cookie-object-field
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
