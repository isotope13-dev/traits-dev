defaults:
  for: [python, javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: signed-value-interpolation
    desc: Builds signed-cookie payload/signature format
    if:
      type: text
      regex: '(f["'']s:\{[^}]{1,80}\}\.\{[^}]{1,80}\}|`s:\$\{[^}]{1,80}\}\.\$\{[^}]{1,80}\})'

  - id: cookie-header-construction
    desc: Constructs an HTTP Cookie request header
    if:
      type: text
      regex: '["'']Cookie(: )?["'']\s*[:+]'

  - id: signed-value-concatenation
    desc: Joins cookie prefix, payload and signature
    if:
      type: text
      regex: '["'']s:["'']\s*\+\s*[\w.$]{1,80}\s*\+\s*["'']\.["'']\s*\+'

composite_rules:
  - id: unpadded-hmac-signed-value
    desc: Builds signed cookie using unpadded HMAC digest
    all:
      - id: signed-value-format
    any:
      - id: micro-behaviors/crypto/hash/hmac::python-base64-digest-unpadded
      - id: micro-behaviors/crypto/hash/hmac::node-base64-digest-unpadded
    near_bytes: 1024

  - id: signed-value-format
    desc: Constructs signed-cookie wire format
    any:
      - id: signed-value-interpolation
      - id: signed-value-concatenation
