# Identity claims carried by JWT authentication tokens. These are protocol
# observations; impersonation intent belongs in an objective composite.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: jwt-windows-sid-identity-claim
    desc: JWT names Windows SID identity
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b["'']?nameid["'']?\s*[:=]\s*["'']S-1-5-21-(\d+-){3}\d+["'']'

  - id: jwt-user-principal-name-claim
    desc: JWT carries user principal name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b["'']?upn["'']?\s*[:=]\s*["''][A-Za-z0-9._%+-]{1,80}@[A-Za-z0-9.-]{1,80}["'']'
