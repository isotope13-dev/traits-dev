# Identity claims carried by JWT authentication tokens. These are protocol
# observations; impersonation intent belongs in an objective composite.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: jwt-windows-sid-identity-claim
    desc: JWT names Windows SID identity
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b["'']?nameid["'']?\s*[:=]\s*["'']S-1-5-21-(\d+-){3}\d+["'']'

  - id: jwt-user-principal-name-claim
    desc: JWT carries user principal name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b["'']?upn["'']?\s*[:=]\s*["''][A-Za-z0-9._%+-]{1,80}@[A-Za-z0-9.-]{1,80}["'']'

  - id: jwt-hs256-algorithm-field
    desc: JWT selects HS256 for token signing
    conf: 0.97
    if:
      type: text
      # Accept both serialized JWT header fields and library keyword arguments
      # such as PyJWT's algorithm="HS256". The HS256 name keeps the broader
      # `algorithm` spelling specific to JWT rather than generic crypto code.
      regex: '(?i)["'']?(alg|algorithm)["'']?\s*[:=]\s*["'']HS256["'']'
