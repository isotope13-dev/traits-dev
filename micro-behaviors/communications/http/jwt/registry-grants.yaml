defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: registry-repository-grant
    desc: Defines repository type field
    crit: notable
    if:
      type: text
      regex: '["'']type["'']\s*:\s*["'']repository["'']'
      exclude_comments: true

  - id: registry-access-claim
    desc: Defines access array field
    crit: notable
    if:
      type: text
      regex: '["'']access["'']\s*:\s*\['
      exclude_comments: true

  - id: registry-action-grants
    desc: Defines actions array field
    crit: notable
    if:
      type: text
      regex: '["'']actions["'']\s*:\s*\['
      exclude_comments: true

