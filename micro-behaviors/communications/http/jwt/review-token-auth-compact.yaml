# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - text
  - data
  - json
  crit: notable
  conf: 0.94
traits:
- id: compact-jwt-token-literal
  desc: Contains compact three-segment JWT token
  if:
    type: raw
    regex: "\\beyJ[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{40,}\\.[A-Za-z0-9_-]{20,}\\b"
