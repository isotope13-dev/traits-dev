# JWT authentication-method claims. Legitimate identity providers can emit
# these values after a real hardware-backed ceremony, so the pair is a notable
# protocol observation rather than a malicious verdict by itself.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: jwt-possession-or-inherence-acr-claim
    desc: JWT ACR claim asserts possession or inherence
    if:
      type: text
      regex: '(?i)["'']?acr["'']?\s*[:=]\s*["'']possessionorinherence["'']'

  - id: jwt-hardware-key-amr-claim
    desc: JWT AMR asserts hardware-key authentication
    if:
      type: text
      regex: '(?i)["'']?amr["'']?\s*[:=]\s*\[[^\]]{0,80}["'']hwk["'']'

composite_rules:
  - id: jwt-hardware-mfa-claim-pair
    desc: JWT asserts hardware-backed possession or inherence MFA
    conf: 0.99
    near_bytes: 512
    all:
      - id: jwt-possession-or-inherence-acr-claim
      - id: jwt-hardware-key-amr-claim
