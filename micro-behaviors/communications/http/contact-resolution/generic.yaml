# Neutral contact-resolution and account-availability routes. First-party
# clients and CRM products legitimately expose these endpoints; objective
# composites add batching, identity rotation, throttling, or record export.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
  crit: notable
  conf: 0.9

traits:
  - id: find-friends-endpoint
    desc: Find-friends contact resolver endpoint
    if:
      type: text
      regex: '(?i)/(find[-_]?friends|friend[-_]?finder)\b'

  - id: contact-import-endpoint
    desc: Contact import or address-book sync endpoint
    if:
      type: text
      regex: '(?i)/contacts?[-_/](sync|import|upload)\b'

  - id: contact-lookup-endpoint
    desc: Contact-to-account lookup endpoint
    if:
      type: text
      regex: '(?i)/(contacts?|people)[-_/]lookup\b'

  - id: email-availability-oracle-endpoint
    desc: Account email availability endpoint
    if:
      type: text
      regex: '(?i)/(email[-_](available|exists|taken)|check[-_]email)\b'

  - id: teams-api-base-endpoint
    desc: Microsoft Teams regional API endpoint
    if:
      type: text
      substr: teams.microsoft.com/api/mt/

  - id: teams-external-user-search-endpoint
    desc: Teams external-user search endpoint
    conf: 0.97
    if:
      type: text
      substr: /externalsearchv3?includeTFLUsers=true
