# macOS App Transport Security (ATS) Manifest Signals
defaults:
  platforms: [macos]
  for: [plist]
traits:
- id: exception-domain-insecure-http
  desc: ATS exception allows insecure HTTP for domain
  crit: notable
  conf: 0.85
  attack: "T1071.001"
  if:
    type: value
    path: "NSAppTransportSecurity"
    regex: "NSExceptionAllowsInsecureHTTPLoads.{0,10}true"

  # Disabling forward secrecy allows weak cipher suites and session resumption attacks
- id: exception-domain-no-forward-secrecy
  desc: "ATS exception disables PFS for domain"
  crit: notable
  conf: 0.8
  attack: "T1573"
  if:
    type: value
    path: "NSAppTransportSecurity"
    regex: "NSExceptionRequiresForwardSecrecy.{0,10}false"

  # TLS 1.0 is deprecated; downgrading to it is a security weakening choice
- id: exception-domain-tls10
  desc: ATS exception downgrades minimum TLS to 1.0
  crit: notable
  conf: 0.85
  attack: "T1573"
  if:
    type: value
    path: "NSAppTransportSecurity"
    regex: "NSExceptionMinimumTLSVersion.{0,15}TLSv1\\.0"

  # Subdomains extension broadens the transport exception to child hosts.
- id: exception-domain-includes-subdomains
  desc: ATS exception applies to all subdomains
  crit: component
  conf: 0.7
  if:
    type: value
    path: "NSAppTransportSecurity"
    regex: "NSIncludesSubdomains.{0,10}true"

- id: allows-arbitrary-loads--true
  desc: ATS allows arbitrary HTTP loads (true)
  crit: notable
  conf: 0.8
  if:
    type: value
    path: "NSAppTransportSecurity.NSAllowsArbitraryLoads"
    exact: 'true'
- id: allows-arbitrary-loads--1
  desc: ATS allows arbitrary HTTP loads (1)
  crit: notable
  conf: 0.8
  if:
    type: value
    path: "NSAppTransportSecurity.NSAllowsArbitraryLoads"
    exact: '1'

# filefacts flattens plist dictionaries into leaf paths, so match loopback
# exceptions at those paths instead of searching the parent dictionary value.
- id: allows-local-networking
  desc: ATS permits local-network connections
  crit: component
  conf: 1.0
  if:
    type: value
    path: NSAppTransportSecurity.NSAllowsLocalNetworking
    exact: 'true'

- id: loopback-insecure-http-localhost
  desc: ATS permits insecure HTTP to localhost
  crit: component
  conf: 1.0
  if:
    type: value
    path: NSAppTransportSecurity.NSExceptionDomains.localhost.NSTemporaryExceptionAllowsInsecureHTTPLoads
    exact: 'true'

- id: loopback-insecure-http-ipv4
  desc: ATS permits insecure HTTP to 127.0.0.1
  crit: component
  conf: 1.0
  if:
    type: value
    path: NSAppTransportSecurity.NSExceptionDomains.127.0.0.1.NSTemporaryExceptionAllowsInsecureHTTPLoads
    exact: 'true'

- id: loopback-tls10-localhost
  desc: ATS permits TLS 1.0 connections to localhost
  crit: component
  conf: 1.0
  if:
    type: value
    path: NSAppTransportSecurity.NSExceptionDomains.localhost.NSTemporaryExceptionMinimumTLSVersion
    exact: '1.0'

- id: loopback-tls10-ipv4
  desc: ATS permits TLS 1.0 connections to 127.0.0.1
  crit: component
  conf: 1.0
  if:
    type: value
    path: NSAppTransportSecurity.NSExceptionDomains.127.0.0.1.NSTemporaryExceptionMinimumTLSVersion
    exact: '1.0'
composite_rules:
  # These are application transport settings, not evidence of C2 by
  # themselves. Keep the combined configuration visible as a notable
  # security weakness; an objective-level C2 trait must also establish
  # command-and-control intent.
- id: allows-arbitrary-loads
  desc: ATS allows arbitrary HTTP loads
  crit: notable
  conf: 0.8
  any:
  - id: allows-arbitrary-loads--true
  - id: allows-arbitrary-loads--1
- id: ats-weak-transport-exception
  desc: ATS domain exception permits insecure HTTP and weakens TLS
  crit: notable
  conf: 0.9
  all:
  - id: exception-domain-insecure-http
  - id: exception-domain-no-forward-secrecy
  - id: exception-domain-includes-subdomains

- id: loopback-insecure-http-exception
  desc: ATS allows cleartext HTTP to a loopback service
  crit: notable
  conf: 1.0
  all:
  - id: allows-local-networking
  any:
  - id: loopback-insecure-http-localhost
  - id: loopback-insecure-http-ipv4

- id: loopback-legacy-tls-exception
  desc: ATS permits legacy TLS 1.0 to a loopback service
  crit: notable
  conf: 1.0
  all:
  - id: allows-local-networking
  any:
  - id: loopback-tls10-localhost
  - id: loopback-tls10-ipv4
