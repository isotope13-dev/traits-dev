# Native C and C++ request helpers pass the PUT method as a string argument.
# A generic helper name is common, so the atom records only the method; the
# composites that cite it supply the destination and the execution evidence.
defaults:
  platforms:
    - unix
    - windows
  for: [c, cpp]
  crit: notable
  conf: 0.9
traits:
  - id: native-put-method-argument
    desc: Native call takes PUT as first argument
    if:
      type: text
      regex: '\w+\s*\(\s*"PUT"\s*,'
