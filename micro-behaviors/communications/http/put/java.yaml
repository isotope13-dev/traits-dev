defaults:
  crit: notable
  platforms: [unix, windows]
traits:
  - id: java-http-put-bytes
    desc: Java builds HTTP PUT byte body
    for: [java]
    if:
      type: text
      regex: '\.PUT\s*\(\s*HttpRequest\.BodyPublishers\.ofByteArray\s*\('
      exclude_comments: true
  - id: jvm-http-put-builder
    desc: JVM HTTP PUT builder reference
    for: [class]
    if:
      type: import
      exact: java/net/http/HttpRequest$Builder.PUT
  - id: jvm-http-byte-body
    desc: JVM HTTP byte body publisher
    for: [class]
    if:
      type: import
      exact: java/net/http/HttpRequest$BodyPublishers.ofByteArray
composite_rules:
  - id: jvm-http-put-byte-body
    desc: JVM HTTP PUT and byte body references
    for: [class]
    all:
      - id: jvm-http-put-builder
      - id: jvm-http-byte-body
  - id: jdk-http-put-bytes
    desc: JDK HTTP PUT with byte body
    for: [java, class]
    any:
      - id: java-http-put-bytes
      - id: jvm-http-put-byte-body
