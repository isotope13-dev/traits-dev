defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.7
  for: [scripts, binaries]
traits:
  - id: put
    desc: HTTP PUT method
    if:
      type: text
      regex: \bPUT\s+/\S+\s+HTTP/1\.[01]\b
  - id: javascript-put-request-body
    desc: JavaScript PUT request with body
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)method\s*:\s*["'']PUT["''][\s\S]{0,120}body\s*:'
  # Relocated from objectives/collection/monitor/telemetry, where "PUT to a
  # pre-signed URL" was filed as browser telemetry capture. It is the standard
  # object-storage upload handshake (S3, GCS, Supabase Storage) and the matcher
  # sees only the URL wording plus a PUT body; the extension-capture composite
  # there still references it and supplies the capture legs.
  - id: presigned-url-reference
    desc: References a pre-signed upload URL
    crit: component
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)upload-url|signed.?url'

composite_rules:
  - id: presigned-url-put-upload
    desc: Uploads a body to a pre-signed URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: presigned-url-reference
      - id: javascript-put-request-body
    near_bytes: 700
