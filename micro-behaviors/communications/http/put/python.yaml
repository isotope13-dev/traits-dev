defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  # Follow the data keyword into variables and concatenated literal origins.
  # This describes sent code text, not its execution on the receiving server.
  - id: python-put-runtime-exec-body
    desc: PUT body contains JVM process-execution syntax
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: requests.put
      arg:
        from:
          field: data
          value: 'Runtime\.getRuntime\(\)\.exec\('
