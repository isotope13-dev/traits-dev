defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: javascript-content-commit-put-options
    desc: Passes message and content PUT body
    if:
      type: tree-sitter
      query: |
        (call_expression
          arguments: (arguments (object
            (pair key: [(property_identifier) @method (string (string_fragment) @method)]
              value: (string (string_fragment) @verb))
            (pair key: [(property_identifier) @body (string (string_fragment) @body)]
              value: (call_expression arguments: (arguments (object
                (pair key: [(property_identifier) @message (string (string_fragment) @message)])
                (pair key: [(property_identifier) @content (string (string_fragment) @content)])))))))
          (#eq? @method "method") (#eq? @verb "PUT") (#eq? @body "body")
          (#eq? @message "message") (#eq? @content "content")) @match
