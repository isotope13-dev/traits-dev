# Bound source-to-PUT bodies. Argument positions and producer/result variables
# agree; no fixed entry-point, helper, variable or task-suffix spelling is required.
# The C# helper declaration and its calls must share a class.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - powershell
  - csharp
  crit: notable
  conf: 0.97
traits:
- id: python-urllib-reflected-result-upload
  desc: PUT sends a reflected method result
  for:
  - python
  if:
    type: tree-sitter
    query: |-
      ((block (expression_statement (assignment (identifier) @result (call (attribute) @invoke))) . (expression_statement (assignment (identifier) @request (call (attribute) @constructor (argument_list . (_) . (keyword_argument (identifier) @data (call (attribute (call (identifier) @str (argument_list . (identifier) @bodyresult .)) (identifier) @encode))) . (_) . (keyword_argument (identifier) @method (string) @verb) .)))) . (expression_statement (call (attribute (call (attribute) @open (argument_list . (identifier) @opened .))))))
      (#match? @invoke "^Assembly\\.Load\\(.*\\.GetMethod\\(.*\\.Invoke$")
      (#eq? @constructor "urllib.request.Request")
      (#eq? @str "str")
      (#eq? @encode "encode")
      (#eq? @data "data")
      (#eq? @method "method")
      (#match? @verb "^[\"']PUT[\"']$")
      (#eq? @open "urllib.request.urlopen")
      (#eq? @request @opened)
      (#eq? @result @bodyresult))
- id: powershell-reflected-result-upload
  desc: PUT sends an assembly invocation result
  for:
  - powershell
  if:
    type: tree-sitter
    query: |-
      ((statement_list (pipeline (assignment_expression (left_assignment_expression) @result (pipeline (pipeline_chain (logical_expression (bitwise_expression (comparison_expression (additive_expression (multiplicative_expression (format_expression (range_expression (array_literal_expression (unary_expression (invokation_expression (invokation_expression (invokation_expression (invokation_expression (type_literal) @assembly (member_name) @load (argument_list . (argument_expression_list . (argument_expression (logical_argument_expression (bitwise_argument_expression (comparison_argument_expression (additive_argument_expression (multiplicative_argument_expression (format_argument_expression (range_argument_expression (unary_expression (invokation_expression (member_name) @downloaddata)))))))))) .) .)) (member_name) @gettype) (member_name) @getmethod) (member_name) @invoke)))))))))))))) . (pipeline (assignment_expression (left_assignment_expression) @output) @path_assignment) . (pipeline (pipeline_chain (logical_expression (bitwise_expression (comparison_expression (additive_expression (multiplicative_expression (format_expression (range_expression (array_literal_expression (unary_expression (invokation_expression (member_name) @upload (argument_list . (argument_expression_list . (_) . (argument_expression) @verb . (argument_expression (logical_argument_expression (bitwise_argument_expression (comparison_argument_expression (additive_argument_expression (multiplicative_argument_expression (format_argument_expression (range_argument_expression (unary_expression (invokation_expression (member_access (type_literal) @encoding (member_name) @charset) (member_name) @getbytes (argument_list . (argument_expression_list . (argument_expression (logical_argument_expression (bitwise_argument_expression (comparison_argument_expression (additive_argument_expression (multiplicative_argument_expression (format_argument_expression (range_argument_expression (unary_expression (expression_with_unary_operator (cast_expression (unary_expression (variable) @sent)))))))))))) .) .))))))))))) .) .))))))))))))))
      (#match? @assembly "(?i)^\\[(System\\.)?Reflection\\.Assembly\\]$")
      (#match? @load "(?i)^Load$")
      (#match? @downloaddata "(?i)^DownloadData$")
      (#match? @gettype "(?i)^GetType$")
      (#match? @getmethod "(?i)^GetMethod$")
      (#match? @invoke "(?i)^Invoke$")
      (#match? @result "^\\$[A-Za-z_]\\w*$")
      (#match? @output "^\\$[A-Za-z_]\\w*$")
      (#not-eq? @result @output)
      (#eq? @result @sent)
      (#match? @getbytes "(?i)^GetBytes$")
      (#match? @upload "(?i)^UploadData$")
      (#match? @encoding "(?i)^\\[(System\\.)?Text\\.Encoding\\]$")
      (#match? @charset "(?i)^UTF8$")
      (#match? @verb "(?i)^[\"']PUT[\"']$"))
- id: csharp-helper-reflected-result-upload
  desc: PUT helper sends a reflected result
  for:
  - csharp
  if:
    type: tree-sitter
    query: |-
      ((class_declaration (declaration_list (method_declaration (identifier) @helper (parameter_list . (_) . (parameter (identifier) @parameter) .) (block (local_declaration_statement (variable_declaration (variable_declarator (await_expression (invocation_expression (member_access_expression (identifier) @put) (argument_list . (_) . (argument (object_creation_expression (identifier) @bodytype (argument_list . (argument (identifier) @bodybytes) .))) .)))))))) (method_declaration (block (while_statement (block (foreach_statement (block (if_statement (block (local_declaration_statement (variable_declaration (variable_declarator (identifier) @result (invocation_expression (member_access_expression (invocation_expression (member_access_expression (identifier) @lookup)) (identifier) @invoke))))) . (expression_statement (await_expression (invocation_expression (identifier) @upload (argument_list . (_) . (argument (invocation_expression (member_access_expression) @encode (argument_list . (argument (invocation_expression (member_access_expression) @convert (argument_list . (argument (identifier) @sent) .))) .))) .))))))))))))))
      (#eq? @put "PutAsync")
      (#eq? @bodytype "ByteArrayContent")
      (#eq? @parameter @bodybytes)
      (#eq? @invoke "Invoke")
      (#eq? @lookup "GetMethod")
      (#eq? @encode "Encoding.UTF8.GetBytes")
      (#eq? @convert "Convert.ToString")
      (#eq? @result @sent)
      (#eq? @helper @upload))
- id: csharp-helper-host-profile-upload
  desc: PUT helper sends hostname and OS
  for:
  - csharp
  if:
    type: tree-sitter
    query: |-
      ((class_declaration (declaration_list (method_declaration (identifier) @helper (parameter_list . (_) . (parameter (identifier) @parameter) .) (block (local_declaration_statement (variable_declaration (variable_declarator (await_expression (invocation_expression (member_access_expression (identifier) @put) (argument_list . (_) . (argument (object_creation_expression (identifier) @bodytype (argument_list . (argument (identifier) @bodybytes) .))) .)))))))) (method_declaration (block (expression_statement (await_expression (invocation_expression (identifier) @upload (argument_list . (_) . (argument (invocation_expression (member_access_expression) @encode (argument_list . (argument (binary_expression (binary_expression (member_access_expression) @machine) (member_access_expression) @os)) .))) .))))))))
      (#eq? @put "PutAsync")
      (#eq? @bodytype "ByteArrayContent")
      (#eq? @parameter @bodybytes)
      (#eq? @machine "Environment.MachineName")
      (#eq? @os "Environment.OSVersion")
      (#eq? @encode "Encoding.UTF8.GetBytes")
      (#eq? @helper @upload))
