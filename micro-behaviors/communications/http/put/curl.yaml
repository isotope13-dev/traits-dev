defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: curl-put-command
    desc: curl command selects HTTP PUT
    if:
      type: text
      # Only argument-free flag clusters may precede the method. For example,
      # curl -d -X PUT sends the data "-X" to URL "PUT"; it is not a PUT.
      regex: '\bcurl\s+(-[fsSLkqv]+\s+){0,4}(-X\s*|--request[= ]+)["'']?PUT(["''\s]|$)'
