defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1071.001
  mbc: C0002

composite_rules:
  - id: rust-reqwest-client-put
    desc: Sends HTTP PUT through a reqwest client
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/source/property/assignment::rust-put-method-call
    any:
      - id: metadata/import/rust/reqwest/client
      - id: metadata/import/rust/reqwest/blocking/client
