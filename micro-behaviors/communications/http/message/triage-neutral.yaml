composite_rules:
  - id: http-url-scheme-prefix
    desc: HTTP or HTTPS URL scheme prefix
    for: [binaries]
    platforms: [linux, macos, windows]
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/communications/http/message::http-prefix
      - id: micro-behaviors/communications/http/message::https-prefix
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
