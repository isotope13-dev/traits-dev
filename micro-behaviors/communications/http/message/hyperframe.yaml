defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: hyperframe-connection-window
    desc: Constructs HTTP/2 connection window updates
    if:
      type: symbol
      kind: call
      exact: WindowUpdateFrame
      arg: {index: 0, kind: number, value: 0}
  - id: hyperframe-stream-reset
    desc: Constructs HTTP/2 stream reset frames
    if:
      type: symbol
      kind: call
      exact: RstStreamFrame
  - id: hyperframe-ping
    desc: Constructs HTTP/2 PING frames
    if:
      type: symbol
      kind: call
      exact: PingFrame
  - id: hyperframe-zero-stream-window
    desc: Assigns zero to frame settings index four
    crit: component
    if:
      type: text
      regex: '\.settings\[[ \t]*(4|0x0?4)[ \t]*\][ \t]*=[ \t]*0\b'
  - id: hyperframe-max-window-increment-hex
    desc: Sets near-limit HTTP/2 credit in hexadecimal
    if:
      type: text
      regex: '\.window_increment[ \t]*=[ \t]*0[xX]7[fF]{7}[ \t]*-[ \t]*(65535|0[xX][fF]{4})\b'
  - id: hyperframe-max-window-increment-decimal
    desc: Sets near-limit HTTP/2 credit in decimal
    if:
      type: text
      regex: '\.window_increment[ \t]*=[ \t]*2147483647[ \t]*-[ \t]*(65535|0[xX][fF]{4})\b'

composite_rules:
  - id: hyperframe-max-window-increment
    desc: Sets HTTP/2 window increment near its limit
    any:
      - id: hyperframe-max-window-increment-hex
      - id: hyperframe-max-window-increment-decimal
