defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: python-bodyless-header-send
    desc: Sends headers with END_STREAM enabled
    if:
      type: text
      regex: '\.send_request_headers\([^\n]{1,100}end_stream\s*=\s*True\s*[,)]'
      exclude_comments: true

  - id: python-numbered-extension-header
    desc: Appends numbered extension header tuples
    crit: component
    if:
      type: text
      regex: '\.append\(\(["'']x-[a-z-]{1,24}%0?[0-9]{0,2}d["'']\s*%'
      exclude_comments: true

composite_rules:
  - id: python-numbered-bodyless-headers
    desc: Sends bodyless requests near numbered header construction
    near_lines: 8
    all:
      - id: python-numbered-extension-header
      - id: python-bodyless-header-send
