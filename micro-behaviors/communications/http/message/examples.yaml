# Request-line examples are neutral protocol observations, not C2 evidence.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  crit: notable
  conf: 0.7
traits:
  - id: node-http-example-request-line
    desc: Node HTTP example request line comment
    if:
      type: text
      regex: '(firstLine in the case of request is: ''GET /index\.html HTTP/1\.1)'
  - id: generic-index-request-line-raw
    desc: HTTP GET request line for index.html
    if:
      type: text
      regex: '(GET /index\.html HTTP/1\.1)'
  - id: fetch-header-example-request-line
    desc: Fetch header example request line comment
    if:
      type: text
      regex: '(must send HTTP headers \(e\.g\., "POST / HTTP/1\.1"\))'
composite_rules:
  - id: example-or-escaped-request-line
    desc: Example or escaped HTTP request line
    # Preserve the old union, but neither an ordinary GET line nor escaped
    # CRLF proves that it is documentation. Each leg is a complete observation.
    any:
      - id: generic-index-request-line-raw
      - id: node-http-example-request-line
      - id: fetch-header-example-request-line
      - id: micro-behaviors/communications/http/message::escaped-crlf-request-line
