# A single literal containing two request lines is stronger evidence of a
# pipelined request than separate fixtures elsewhere in the same source file.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe, -applescript, -jcl, -vbs]
traits:
  - id: two-request-lines-one-literal
    desc: Two HTTP request lines in one literal
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?s)[A-Z]{3,12}\s+\S+\s+HTTP/\d.{0,2048}[A-Z]{3,12}\s+\S+\s+HTTP/\d'
  - id: concatenated-values-sent-to-socket
    desc: Send call concatenates variable values
    for: [python, go]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(sendall|Write)\([^\r\n]{0,120}\w+\s*\+[^\r\n]{0,120}\w+'
composite_rules:
  - id: request-assembly-clues
    desc: Request literal or send assembly clues
    crit: notable
    conf: 0.9
    any:
      - id: two-request-lines-one-literal
      - id: concatenated-values-sent-to-socket
