# A single literal containing two request lines is stronger evidence of a
# pipelined request than separate fixtures elsewhere in the same source file.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe, -applescript, -jcl, -vbs]
traits:
  - id: two-request-lines-one-literal
    desc: Two HTTP request lines in one literal
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?s)[A-Z]{3,12}\s+\S+\s+HTTP/\d.{0,2048}[A-Z]{3,12}\s+\S+\s+HTTP/\d'
composite_rules:
  # A generic Write may target a file, and sendall may carry WHOIS. Keep the
  # text observation in string concatenation; HTTP requires framing evidence.
  - id: concatenated-values-sent-to-socket
    desc: HTTP request lines accompany concatenated sends
    for: [python, go]
    crit: notable
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/data/string/concat/expression::send-or-write-concatenated-values
    any:
      - id: multiple-raw-http-request-lines
      - id: multiple-raw-http-request-lines-source
  - id: request-assembly-clues
    desc: Request literal or send assembly clues
    crit: notable
    conf: 0.9
    any:
      - id: two-request-lines-one-literal
      - id: concatenated-values-sent-to-socket
