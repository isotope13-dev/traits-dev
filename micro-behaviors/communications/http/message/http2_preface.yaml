defaults:
  platforms:
    - windows
    - linux
    - macos
  for: [binaries, c, cpp, go, java]
  crit: notable
  conf: 0.75
traits:
  - id: http2-preface
    desc: HTTP/2 client connection preface
    if:
      type: text
      substr: PRI * HTTP/2.0
  # HPACK's static table spells this pseudo-header; real HTTP/2 clients and
  # servers carry it beside the other table entries.
  - id: hpack-authority-pseudo-header
    desc: HTTP/2 HPACK :authority pseudo-header name
    if:
      type: text
      substr: ":authority"
