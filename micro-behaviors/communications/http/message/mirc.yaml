defaults:
  platforms: [unix, windows]
  for: [mirc, text, data]
traits:
  - id: mirc-http-get-sockwrite
    desc: mIRC socket GET request syntax
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsockwrite\s+(-[a-z]+\s+)?(\$sockname|%?[A-Za-z][\w.]*)\s+GET\s+\S+(\s+HTTP/1\.[01])?'
