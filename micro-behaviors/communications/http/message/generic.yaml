defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: baseline
  conf: 0.9
traits:
  - id: http-header-field-delimiter
    desc: HTTP header field delimiter
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'HTTP/1\.[01]\r\n[A-Za-z-]+: '

  - id: raw-http-safe-request-line
    desc: Raw HTTP safe request line
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)\b(GET|HEAD|OPTIONS|TRACE)\s+\S+\s+HTTP/[0-9]+'

  - id: raw-http-body-request-line
    desc: Raw HTTP body-capable request line
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)(^|["''`])(POST|PUT|PATCH)\s+\S+\s+HTTP/[0-9]+'

  - id: raw-http-control-request-line
    desc: Raw HTTP control request line
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)(^|["''`])(DELETE|CONNECT)\s+\S+\s+HTTP/[0-9]+'

  - id: raw-http-safe-request-line-source
    desc: Raw HTTP safe-method request line in source
    crit: notable
    conf: 0.94
    for: [source]
    if:
      type: text
      regex: '(?im)["''`]\s*(GET|HEAD|OPTIONS|TRACE)\s+\S+\s+HTTP/[0-9]+'

  - id: raw-http-body-request-line-source
    desc: Raw HTTP body-capable request line in source
    crit: notable
    conf: 0.94
    for: [source]
    if:
      type: text
      regex: '(?im)["''`]\s*(POST|PUT|PATCH)\s+\S+\s+HTTP/[0-9]+'

  - id: raw-http-control-request-line-source
    desc: Raw HTTP control request line in source
    crit: notable
    conf: 0.94
    for: [source]
    if:
      type: text
      regex: '(?im)["''`]\s*(DELETE|CONNECT)\s+\S+\s+HTTP/[0-9]+'

  # Multiple request literals are a neutral protocol capability. HTTP
  # desynchronisation intent comes from the objective composites that combine
  # this atom with conflicting framing headers.
  - id: multiple-raw-http-request-lines
    desc: Multiple raw HTTP request lines
    crit: notable
    conf: 0.97
    for: [scripts, binaries, -jcl, -applescript, -vbs, -wasm, -static-lib]
    count_min: 2
    if:
      type: literal
      kind: string
      regex: '(?m)^[A-Z]{3,12}\s+\S+\s+HTTP/\d(\.\d)?'
    not:
      - substr: 'PRI * HTTP/2.0'
    unless:
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: metadata/package/testing/presence/harness::ruby-spec-file
      - id: metadata/package/testing/presence/harness::perl-test-file
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/lib/network/monolog::monolog-library-context
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
      - id: metadata/library/network::aiohttp-package-path
      - id: metadata/library/network::urllib3-package-path
      - id: well-known/app/development/jennifer/

  - id: multiple-raw-http-request-lines-source
    desc: Multiple standard HTTP request lines in source
    crit: notable
    conf: 0.97
    for: [source]
    count_min: 2
    if:
      type: literal
      kind: string
      regex: '(?m)^[A-BD-Z][A-Z]{2,7}[ \t]+\S+[ \t]+HTTP/\d(\.\d)?'
    not:
      - substr: 'PRI * HTTP/2.0'
    unless:
      # Zig keeps unit tests inline, so an HTTP server's own `test parse`
      # fixtures (std/http/Server.zig) look like production request strings.
      - id: metadata/package/testing/harness/unit::zig-inline-test-block
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: metadata/package/testing/presence/harness::ruby-spec-file
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/lib/network/monolog::monolog-library-context
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
      - id: metadata/library/network::aiohttp-package-path
      - id: metadata/library/network::urllib3-package-path
      - id: well-known/app/development/jennifer/
  # These two find the bare header-name token, nothing more: the value, the CRLF
  # and the request it belongs to are all in adjacent literals. `"Host: "` is
  # equally the prefix of a console line (`console.log(`Host: ${cfg.HOST}`)`),
  # and template chunks reach the literal projection the same way plain strings
  # do, so on its own the match says only that the word appears -- not that a
  # request header is being assembled. The composites that consume these supply
  # that context; keep the atoms as the fragments they are.
  - id: host-header-line-token
    desc: HTTP Host header name token
    crit: component
    conf: 0.85
    for: [go, javascript, typescript, ruby, python]
    if:
      type: string_literal
      regex: '(?i)^HOST\s*:\s*$'

  - id: user-agent-header-line-token
    desc: HTTP User-Agent header name token
    crit: component
    conf: 0.85
    for: [go, javascript, typescript, ruby, python]
    if:
      type: string_literal
      regex: '(?i)^USER-AGENT\s*:\s*$'

  - id: robots-txt-directive-marker
    desc: robots.txt directive line marker
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, ruby, go]
    if:
      # A directive is a LINE of robots.txt, so it must be carried in a string
      # constant and start its line. Matched as free text it also hit source
      # identifiers: `siteMap:` — an object key holding an SVG icon in Otter
      # Blocks' editor bundle — differs from `Sitemap:` only in case, and
      # `disallow:` is an ordinary config key too. The sibling User-Agent atom
      # above already keeps to string literals for the same reason.
      type: string_literal
      regex: '(?im)^\s{0,8}(Disallow|Crawl-delay|Sitemap)\s*:'
  - id: http-prefix
    desc: HTTP protocol prefix
    if:
      type: string_literal
      regex: ^http://
      case_insensitive: true
  - id: https-prefix
    desc: Contains an HTTPS URL prefix
    if:
      type: string_literal
      regex: ^https://
      case_insensitive: true
  - id: configured-https-endpoint
    desc: Embedded HTTPS endpoint configuration
    crit: notable
    conf: 0.88
    for: [binaries]
    if:
      type: text
      regex: '["'']?(api_url|endpoint|server_url|base_url)["'']?\s*:\s*["'']https?://[A-Za-z0-9.-]{3,253}'
  - id: http-1-0-header
    desc: HTTP/1.0 protocol version
    if:
      type: string_literal
      substr: HTTP/1.0
  - id: split-http10-get-template
    desc: Split HTTP/1.0 GET template
    crit: component
    conf: 0.88
    for: [pe, dll]
    platforms: [windows]
    if:
      type: hex
      section: .data
      pattern: "20 48 54 54 50 2F 31 2E 30 0D 0A 00 47 45 54 20 2F 00"
  - id: http-1-1-header
    desc: HTTP/1.1 protocol version
    if:
      type: string_literal
      substr: HTTP/1.1
  - id: http-2-0-header
    desc: HTTP/2.0 protocol version
    if:
      type: string_literal
      substr: HTTP/2.0
  - id: http-url-literal
    desc: HTTP URL string literal
    crit: baseline
    conf: 0.75
    if:
      type: string_literal
      regex: (?i)https?://[\w.-]+(/[\w./?&=%:#@~+,;\-]{1,200})?
    not:
      - substr: www.w3.org
      - substr: purl.org
      - substr: ns.adobe.com
      - substr: apple.com/DTDs
      - substr: xmlns
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: metadata/signed/issuer::apple
        - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
        - id: metadata/package/versioning::pe-version-resource
  - id: itms-services-manifest
    desc: iOS itms-services manifest URL
    crit: notable
    conf: 0.9
    if:
      # This scheme commonly appears in HTML attributes, plist/configuration
      # data, and shell heredocs rather than in a parser-extracted literal.
      # The protocol prefix is structural, so raw text matching remains
      # precise without relying on English installation wording.
      type: text
      substr: itms-services://?action=download-manifest&url=

composite_rules:
  - id: host-user-agent-header-pair
    desc: Co-located Host and User-Agent headers
    crit: notable
    conf: 0.94
    all:
      - id: host-header-line-token
      - id: user-agent-header-line-token
    near_bytes: 512
    unless:
      - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
      - id: well-known/lib/format/stacksjs-stacks::fetched-dependency-path
      - id: well-known/lib/data/stacksjs-stx::stx-package-context
      - id: well-known/lib/data/stacksjs-stx::stx-bun-framework-bundle
      - id: robots-txt-directive-marker
