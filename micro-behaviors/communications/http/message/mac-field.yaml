defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, c, cpp, elf, macho, pe]
traits:
  - id: urlencoded-mac-address-field
    desc: URL-encoded MAC address field reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)[?&](mac|mac_?address|device_?mac)='
