defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  # A request line whose CRLF is written out as backslash-r backslash-n text
  # is source code, not wire bytes: doc comments, tutorial strings and test
  # literals show the escapes, while a request actually put on the wire (or
  # built for one) carries real 0x0d 0x0a or a %s format template. Go
  # binaries are the recurring case -- the net and crypto/tls package docs
  # (fmt.Fprintf(conn, "GET / HTTP/1.0\r\n\r\n")) ship in every build that
  # keeps them.
  - id: escaped-crlf-request-line
    desc: Request line with escaped CRLF text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(GET|POST)\s+\S{1,140}\s+HTTP/1\.[01]\\r\\n'
composite_rules:
  # A URL prefix and a request line need not refer to the same connection.
  # This includes ordinary local OAuth callbacks and embedded protocol examples;
  # neither software identity nor resolver vocabulary supplies C2 intent.
  - id: request-line-and-url-vocabulary
    desc: HTTP request line and URL co-occurrence
    crit: notable
    conf: 0.7
    for: [pe, elf, macho]
    all:
      - id: micro-behaviors/communications/http/message::http-url-scheme-prefix
    any:
      - id: micro-behaviors/communications/http/get::get
      - id: micro-behaviors/communications/http/post::post-request-line
  - id: url-header-vocabulary
    desc: HTTP URL and header vocabulary co-occurrence
    crit: notable
    conf: 0.65
    all:
      - id: micro-behaviors/communications/http/message::http-url-scheme-prefix
      - id: micro-behaviors/communications/http/message::http-header-field-delimiter
    any:
      - id: micro-behaviors/communications/http/user-agent::user-agent-header
      - id: micro-behaviors/data/format/mime::content-type-header
    unless:
      - id: micro-behaviors/communications/http/header/content-type::ocsp-request-content-type
