# The URI and repetition must be adjacent source syntax. No route name or
# diagnostic prose is used; repetition alone is a neutral request mechanic.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: uri-plus-multiply
    desc: GET path with repeated plus bytes
    if:
      type: text
      regex: 'GET /[^"''\s]{0,64}["'']\s*\+\s*b?["'']\+["'']\s*\*'
  - id: uri-plus-repeat-call
    desc: GET path with plus repetition call
    if:
      type: text
      regex: 'GET /[^"''\s]{0,64}["'']\s*\+\s*["'']\+["'']\.repeat\('
composite_rules:
  - id: uri-plus-repetition
    desc: GET path with repeated plus bytes
    any:
      - id: uri-plus-multiply
      - id: uri-plus-repeat-call
