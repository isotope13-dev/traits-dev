defaults:
  platforms: [windows, unix]
  for: [scripts, source, text]

traits:
  # An empty upload followed by another part is ordinary multipart structure.
  # Exploit consumers must supply their own validation-bypass context.
  - id: empty-file-before-next-part
    desc: Empty file part precedes next form-data part
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)filename="".{0,700}?Content-Disposition\s*:\s*form-data\s*;'
