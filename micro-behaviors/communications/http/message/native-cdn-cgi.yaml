# A request template and header syntax do not identify a malware family.
defaults:
  for: [elf]
  platforms: [unix]
  size_max: 5000000
traits:
- id: cdn-cgi-request-template-fragment
  size_min: 512
  size_max: 500000000
  desc: cdn-cgi request-line suffix fragment
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: OST /cdn-cgi/
    section: ".rodata"
composite_rules:
- id: cdn-cgi-request-template-with-header-delimiter
  size_min: 512
  size_max: 500000000
  desc: cdn-cgi request suffix with HTTP header delimiter
  crit: notable
  conf: 0.9
  all:
  - id: cdn-cgi-request-template-fragment
  - id: micro-behaviors/communications/http/message::http-header-field-delimiter
