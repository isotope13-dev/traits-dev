# HTTP protocol text assembled inside JVM bytecode.
#
# The JDK ships two HTTP clients (HttpURLConnection and java.net.http), so a
# class that spells out the request line and Host header itself is writing
# bytes straight onto a socket. That is legitimate in protocol tooling and
# tests, and it is also how a stager sidesteps the JVM's proxy settings,
# hostname resolution and instrumentation hooks -- which is why this records
# the capability and leaves intent to composites.
#
# The template survives javac's string-concatenation lowering: the constant
# parts land in the constant pool as one makeConcatWithConstants recipe, so a
# raw byte match sees them even though the host and path are runtime values.
defaults:
  platforms: [windows, linux, macos]
  for: [class, java_class]

traits:
  - id: jvm-handwritten-request-line
    desc: Hand-built HTTP request line and Host header
    crit: notable
    conf: 0.93
    if:
      type: raw
      regex: 'HTTP/1\.[01]\r\nHost: '
