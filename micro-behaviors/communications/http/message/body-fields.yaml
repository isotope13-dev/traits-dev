# Field co-occurrence alone establishes neither LLM use nor interception.
# Preserve the observation and let consumers supply their own context.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.82

traits:
  - id: request-response-body-fields
    desc: Nearby HTTP request and response body fields
    if:
      type: text
      regex: request_body.{0,80}response_body
