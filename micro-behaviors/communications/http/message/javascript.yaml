defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: http-message-json-call
    desc: Calls JSON method on HTTP-style object
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(c\.)?(req(uest)?|res(p(onse)?)?|reply)(\.[\w$]+(\(\))?)*\.json$'
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
