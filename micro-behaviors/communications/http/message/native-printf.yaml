defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.95

traits:
  - id: printf-http-post-body
    desc: Printf HTTP POST body template
    if:
      type: raw
      regex: 'POST /[^\s\x00]{0,120} HTTP/1\.[01]\r\n[^\x00]{0,512}\r\n\r\n%s'

  - id: urlencoded-host-user-registry-form
    desc: URL-encoded h u p r form fields
    if:
      type: raw
      regex: 'h=%\.\d+s&u=%\.\d+s&p=%\.\d+s&r=%\.\d+s'
