# A file stream and upload APIs in one region establish a capability context,
# not unauthorized collection. No file-to-request data flow is claimed.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: file-stream-and-upload-methods
  desc: File stream and upload methods co-occur
  crit: notable
  conf: 0.98
  attack: T1041
  mbc: B0024
  all:
  - id: micro-behaviors/fs/read/stream::create-read-stream
  any:
  - id: micro-behaviors/communications/http/post::client-wrapper-post-call
  - id: micro-behaviors/communications/http/form::form-data-append
  - id: micro-behaviors/communications/http/request/client::fetch-http-scheme-url
  needs: 2
  scope: file
  near_bytes: 4096
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent/
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-vscode-extension
  - id: well-known/app/ai/media/pinokio::app-bundle
  - id: metadata/build/bundler/vscode::standalone-webapp-output
  - id: well-known/tool/development/build/projen::package-context
