defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
traits:
- id: python-post-screenshot-body
  desc: HTTP POST body from screen capture
  conf: 0.96
  if:
    type: symbol
    kind: call
    regex: (^|\.)(post|request)$
    arg:
      from:
        field: data
        call: (^|\.)(ImageGrab\.grab|pyautogui\.screenshot|screenshot)$
