# Explicit body input distinguishes an upload from a method/type declaration.
# This is ordinary transport; consuming objectives must establish intent.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable

composite_rules:
  - id: powershell-binary-body-post
    desc: PowerShell binary POST with request body
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/post::powershell-post-method
      - id: micro-behaviors/communications/http/request/payload::powershell-http-body-parameter
      - id: micro-behaviors/data/format/mime::mime-octet-stream
