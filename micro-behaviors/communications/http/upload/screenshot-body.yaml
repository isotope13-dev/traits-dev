# Screenshot APIs and HTTP POSTs can serve unrelated features in a bundle.
# Require the capture result in the body of the same request. Even a bound
# upload is a neutral capability: remote support and testing use it too.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: axios-screenshot-body
    desc: Axios POST body from a screenshot call
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^axios[0-9]*\.post$'
      arg:
        index: 1
        from:
          call: '(^|\.)(screenshot|captureScreenshots)$'
