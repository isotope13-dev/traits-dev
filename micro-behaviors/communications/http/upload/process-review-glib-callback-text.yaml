defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.96

traits:
  - id: glib-callback-get-text-upload-command
    desc: Getter text enters GLib curl upload command
    # The flow producer explicitly omits anonymous functions. Match this
    # callback's immutable local binding and its actual insertion instead.
    if:
      type: tree-sitter
      query: |
        ((arrow_function
          parameters: (formal_parameters . (identifier) @receiver .)
          body: (statement_block
            . (lexical_declaration "const"
                (variable_declarator
                  name: (identifier) @result
                  value: (call_expression
                    function: (member_expression
                      object: (identifier) @read_receiver
                      property: (property_identifier) @getter)
                    arguments: (arguments))))
            . (if_statement
                consequence: (statement_block
                  . (expression_statement
                    (call_expression
                      function: (member_expression
                        object: (identifier) @api
                        property: (property_identifier) @spawn)
                      arguments: (arguments .
                        (binary_expression
                          left: (binary_expression
                            left: (binary_expression
                              left: (binary_expression
                                left: (string) @prefix
                                right: (identifier) @inserted)
                              right: (string) @pipe)
                            right: (string) @curl)
                          right: (string) @url) .))) .)) .)) @callback
          (#eq? @receiver @read_receiver)
          (#eq? @result @inserted)
          (#eq? @getter "get_text")
          (#eq? @api "GLib")
          (#eq? @spawn "spawn_command_line_async")
          (#match? @prefix "^./bin/(ba)?sh -c 'printf ")
          (#match? @pipe "\\| .?$")
          (#match? @curl "^.curl .{0,60}--data-binary @- .$")
          (#match? @url "^.https?://"))
