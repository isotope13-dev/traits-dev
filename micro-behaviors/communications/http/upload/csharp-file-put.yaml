# Adjacent statements bind the bytes read from a local file to the PUT body.
# The path can be fixed or supplied by a caller; this does not imply theft or
# remote path selection. Adjacency excludes intervening reassignment.
defaults:
  platforms: [unix, windows]
  for: [csharp]
  crit: notable
  conf: 0.97

traits:
  - id: csharp-file-bytes-put
    desc: File bytes supply a PUT request body
    if:
      type: tree-sitter
      query: |
        (block
        (local_declaration_statement (variable_declaration (variable_declarator name: (identifier) @file_data (invocation_expression function: (member_access_expression expression: (identifier) @file name: (identifier) @read) arguments: (argument_list (argument (_)))))))
        .
        (expression_statement (await_expression (invocation_expression function: (member_access_expression expression: (identifier) @put_client name: (identifier) @put) arguments: (argument_list (argument (_)) (argument (object_creation_expression type: (identifier) @body_type arguments: (argument_list (argument (identifier) @sent))))))))
        (#eq? @file "File")
        (#eq? @read "ReadAllBytes")
        (#eq? @put "PutAsync")
        (#eq? @body_type "ByteArrayContent")
        (#eq? @file_data @sent)
        )
