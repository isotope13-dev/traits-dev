defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: heredoc-python-multipart-file-upload
    desc: Python file upload embedded in heredoc
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((heredoc_body) @body
         (#match? @body "with[ \\t]+open\\(file_path[ \\t]*,[ \\t]*['\"]rb['\"]")
         (#match? @body "requests\\.post\\([^\\n]{0,220}files[ \\t]*=[ \\t]*files"))
