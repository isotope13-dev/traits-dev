defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: xhr-formdata-send
    desc: Sends FormData through XMLHttpRequest
    crit: notable
    if:
      type: tree-sitter
      # Bind both objects so nearby requests and unused forms cannot satisfy
      # the rule. The form may be initialized in an upload-mode branch.
      query: |
        ((statement_block
          (_ (variable_declarator
            name: (identifier) @request
            value: (new_expression constructor: (identifier) @_xhr)))
          [
            (_ (variable_declarator
              name: (identifier) @form
              value: (new_expression constructor: (identifier) @_formdata)))
            (if_statement consequence: (statement_block
              (expression_statement (assignment_expression
                left: (identifier) @form
                right: (new_expression constructor: (identifier) @_formdata)))))
          ]
          (expression_statement (call_expression
            function: (member_expression
              object: (identifier) @sender
              property: (property_identifier) @_send)
            arguments: (arguments . (identifier) @body .))))
          (#eq? @_xhr "XMLHttpRequest")
          (#eq? @_formdata "FormData")
          (#eq? @_send "send")
          (#eq? @request @sender)
          (#eq? @form @body))
