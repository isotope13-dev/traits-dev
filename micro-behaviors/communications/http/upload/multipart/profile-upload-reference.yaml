---
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  crit: notable
composite_rules:
- id: multipart-form-data-upload
  desc: Multipart header and HTTP operation clues
  conf: 0.82
  all:
  - id: micro-behaviors/communications/http/form::form-data-header
  any:
  - id: micro-behaviors/communications/url/resource-path/file::http-upload-url-path
  - id: micro-behaviors/communications/http/request/reference::native-post-method-token
  - id: micro-behaviors/communications/http/client/curl::curl-easy-perform-error-string
- id: multipart-http-upload
  desc: Multipart and HTTP upload evidence
  conf: 0.94
  for:
  - binaries
  - scripts
  - source
  any:
  - id: micro-behaviors/communications/http/upload/file::python-http-files-parameter
  - id: micro-behaviors/communications/http/upload/file::node-local-file-formdata-stream
  - id: micro-behaviors/communications/http/form::javascript-formdata-file-upload-request
  - id: micro-behaviors/communications/http/upload/multipart::multipart-form-data-upload
