defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: html-blob-attachment-near-post
  desc: HTML Blob and file attachment near POST
  crit: notable
  conf: 0.94
  near_bytes: 800
  all:
  - id: micro-behaviors/data/format/html::blob-html-document
  - id: micro-behaviors/communications/http/form::formdata-class
  - id: micro-behaviors/communications/http/request/body/file::append-html-filename-argument
  - id: micro-behaviors/communications/http/post::fetch-post-call
