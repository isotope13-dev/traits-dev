defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Co-occurrence of module-path lookup, curl diagnostics and form fields
  # does not bind a file source to an upload sink or prove exfiltration.
  - id: module-path-multipart-upload-references
    desc: Module-path and multipart upload references coexist
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/info/current::get-module-filename-a-text-no-import
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/scheme::http-url-shaped-text
    any:
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker-rdata
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker-rsrc
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
    needs: 1
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: metadata/signed/platform/
