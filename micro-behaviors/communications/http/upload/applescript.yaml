defaults:
  platforms: [macos]
  for: [applescript]

traits:
  # Decoded command fragments retain the attachment directive even when the
  # archive path is dynamic. This alone proves neither curl use nor upload.
  - id: multipart-file-prefix
    desc: Multipart file attachment prefix
    crit: component
    conf: 0.95
    if:
      type: literal
      kind: string
      substr: '-F "file=@'
