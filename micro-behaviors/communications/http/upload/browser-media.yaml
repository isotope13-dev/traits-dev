# Browser recording applications can legitimately capture or upload media.
# Requiring the capture source, MediaRecorder output handler, WebM multipart
# field, and POST body in one local region identifies the surveillance-style
# capture-and-forward implementation without relying on lure prose or brands.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
  - id: mediarecorder-before-network-sink
    desc: "MediaRecorder near a network API reference"
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'MediaRecorder[\s\S]{0,700}(fetch|XMLHttpRequest|WebSocket)'
composite_rules:
  - id: mediarecorder-upload-endpoint-context
    desc: "MediaRecorder with upload endpoint context"
    crit: suspicious
    conf: 0.94
    attack: T1041
    mbc: B0028
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/upload::mediarecorder-before-network-sink
    any:
      - id: micro-behaviors/communications/http/url/endpoint::media-recording-upload-route
      - id: micro-behaviors/communications/http/url/endpoint::html-media-recording-upload-route
