defaults:
  for:
    - applescript
  platforms:
    - macos
composite_rules:
  - id: curl-post-upload
    desc: AppleScript curl POST upload
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/verb::curl-post
      - id: "micro-behaviors/communications/http/request/body/source::curl-data-binary-at-source"
