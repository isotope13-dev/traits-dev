defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1071.001

traits:
  - id: upload-blob-method-call
    desc: Calls Python upload_blob method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_blob$'

  - id: upload-transcript-method-call
    desc: Calls agent transcript upload method
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_transcript$'

  - id: upload-session-artifact-method-call
    desc: Calls session artifact upload method
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_session_artifact$'
