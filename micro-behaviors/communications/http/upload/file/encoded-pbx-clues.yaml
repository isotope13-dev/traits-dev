# Preserve decoded clues without asserting that an unexecuted blob steals data.
defaults:
  platforms: [unix]
  for: [scripts, source, binaries]

composite_rules:
  - id: encoded-asterisk-upload-clues
    desc: Encoded file-upload, PBX authentication path and IP URL clues
    crit: suspicious
    conf: 0.99
    near_bytes: 4096
    all:
      - id: encoded-curl-form-file-attachment
      - id: micro-behaviors/fs/path/secret-config::encoded-asterisk-auth-config-path
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-encoded
