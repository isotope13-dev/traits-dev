# Require form-option/file adjacency and an HTTP argument on the same
# command. Projected call arguments do not express this adjacency; a same-call
# composite confuses --form-string with another --form option.
defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 0.98
traits:
- id: curl-pbx-auth-config-upload
  desc: curl uploads PBX authentication config
  if:
    type: tree-sitter
    language: shell
    query: |
      ((command
        name: (command_name) @tool
        argument: (word) @option
        . argument: [(string) (raw_string) (word)] @source
        argument: [(word) (string) (raw_string)] @url
      ) @evidence
        (#match? @tool "^(/usr/bin/)?curl$")
        (#match? @option "^(-F|--form)$")
        (#match? @source "^[\"']?[-\\w.]+=@/etc/asterisk/(manager|pjsip\\.auth|sip_registrations)\\.conf[\"']?$")
        (#match? @url "^[\"']?https?://[^ \"']+[\"']?$"))
      ((command
        name: (command_name) @tool
        argument: [(word) (string) (raw_string)] @url
        argument: (word) @option
        . argument: [(string) (raw_string) (word)] @source
      ) @evidence
        (#match? @tool "^(/usr/bin/)?curl$")
        (#match? @option "^(-F|--form)$")
        (#match? @source "^[\"']?[-\\w.]+=@/etc/asterisk/(manager|pjsip\\.auth|sip_registrations)\\.conf[\"']?$")
        (#match? @url "^[\"']?https?://[^ \"']+[\"']?$"))
- id: curl-postfix-password-map-upload
  desc: curl uploads Postfix relay password map
  if:
    type: tree-sitter
    language: shell
    query: |
      ((command
        name: (command_name) @tool
        argument: (word) @option
        . argument: [(string) (raw_string) (word)] @source
        argument: [(word) (string) (raw_string)] @url
      ) @evidence
        (#match? @tool "^(/usr/bin/)?curl$")
        (#match? @option "^(-F|--form)$")
        (#match? @source "^[\"']?[-\\w.]+=@/etc/postfix/sasl_passwd[\"']?$")
        (#match? @url "^[\"']?https?://[^ \"']+[\"']?$"))
      ((command
        name: (command_name) @tool
        argument: [(word) (string) (raw_string)] @url
        argument: (word) @option
        . argument: [(string) (raw_string) (word)] @source
      ) @evidence
        (#match? @tool "^(/usr/bin/)?curl$")
        (#match? @option "^(-F|--form)$")
        (#match? @source "^[\"']?[-\\w.]+=@/etc/postfix/sasl_passwd[\"']?$")
        (#match? @url "^[\"']?https?://[^ \"']+[\"']?$"))
