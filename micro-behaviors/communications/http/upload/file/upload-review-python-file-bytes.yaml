defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-post-path-read-bytes
    desc: HTTP POST body reads Path bytes
    if:
      type: tree-sitter
      kind: call
      regex: '^(requests|httpx)\.post\([^\n]{0,240}\bdata\s*=\s*[A-Za-z_][A-Za-z_0-9]*\.read_bytes\(\)'
