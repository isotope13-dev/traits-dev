# Asterisk configurations include ordinary logging and routing settings.
# An attached configuration alone does not establish credential acquisition
# or theft; retain the attachment observation as a neutral upload capability.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: curl-asterisk-config-upload
    desc: curl attaches an Asterisk configuration file
    if:
      type: text
      regex: '\bcurl\b[^\n;|]{0,40}(-F|--form)[ =]+["'']?[\w.-]+=@/etc/asterisk/[\w.]+\.conf'

