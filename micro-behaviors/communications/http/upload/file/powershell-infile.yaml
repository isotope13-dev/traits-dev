defaults:
  for: [powershell]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: powershell-http-file-body
    desc: Sends file content as HTTP request body
    if:
      # Facts project parameters as opaque positional arguments, losing the
      # association between -InFile and its value. Match one actual command.
      type: tree-sitter
      query: |
        ((command
          command_name: [(command_name) (command_name_expr)] @client
          command_elements: (command_elements
            (command_parameter) @parameter
            . (command_argument_sep)
            . [(generic_token) (array_literal_expression)] @file))
          (#match? @client "(?i)^['\"]?(Invoke-WebRequest|Invoke-RestMethod|iwr|irm)['\"]?$")
          (#match? @parameter "(?i)^-InFile:?$"))
