defaults:
  for: [shell]
  platforms: [unix, windows]
traits:
  - id: curl-explicit-file-http-body
    desc: curl sends a file as HTTP body
    crit: notable
    conf: 0.95
    if:
      type: text
      # A lone @- is stdin; require an explicit nonempty file path and URL.
      regex: '(?m)^[ \t]*curl\b[^\n;|]{0,100}--data-binary\s+@[./\w][^\s;|]{0,120}\s+https?://'
