defaults:
  platforms: [unix, windows]
  for: [cmake]
  crit: notable
traits:
  - id: cmake-registry-credential-body
    desc: Curl body names registry credential file
    if:
      type: text
      regex: '(--data[-a-z]*\s+@|-d\s+@|--upload-file\s+)\S{0,60}/\.(netrc|docker/config\.json)\b'
  - id: cmake-cloud-ssh-credential-body
    desc: Curl body names cloud or SSH credentials
    if:
      type: text
      regex: '(--data[-a-z]*\s+@|-d\s+@|--upload-file\s+)\S{0,60}/\.(aws/credentials|ssh/id_rsa)\b'
