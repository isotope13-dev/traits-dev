---
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  crit: notable
traits:
- id: upload-extension-allowlist-key
  desc: Upload-prefixed file-extension allowlist field
  conf: 0.94
  for:
  - scripts
  - source
  - text
  if:
    type: text
    regex: "(?i)\\bupload[_-]?(allowed|permitted)[_-]?(file[_-]?)?ext(ension)?s?\\b"
- id: accepted-file-types-field
  desc: acceptedFiles or allowed_file_types field
  conf: 0.94
  for:
  - scripts
  - source
  - text
  if:
    type: text
    regex: "(?i)(accepted[_-]?files?(_types)?|allowed[_-]?file[_-]?types)"
composite_rules:
- id: upload-or-file-type-allowlist
  desc: Upload or file-type allowlist field
  conf: 0.94
  for:
  - scripts
  - source
  - text
  any:
  - id: micro-behaviors/communications/http/upload/file::upload-extension-allowlist-key
  - id: micro-behaviors/communications/http/upload/file::accepted-file-types-field
- id: server-script-extension-allowlist
  desc: File-type allowlist and script extension clues
  conf: 0.96
  for:
  - scripts
  - source
  - text
  all:
  - id: micro-behaviors/communications/http/upload/file::upload-or-file-type-allowlist
  any:
  - id: micro-behaviors/fs/path/extension::php-script-extension-token
  - id: micro-behaviors/fs/path/extension::managed-script-extension-token
  - id: micro-behaviors/fs/path/extension::cgi-script-extension-token
  near_bytes: 512
