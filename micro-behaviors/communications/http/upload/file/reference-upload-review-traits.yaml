defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  crit: notable
traits:
- id: rust-curl-upload-args
  desc: Rust curl command and upload arguments
  conf: 0.94
  for:
  - rust
  if:
    type: text
    regex: Command::new\s*\(\s*"curl"\s*\)[\s\S]{0,180}"-T"
- id: node-local-file-formdata-stream
  desc: File stream and FormData append text
  conf: 0.94
  for:
  - javascript
  - typescript
  unless:
  - id: metadata/file/extension/mismatch::script-content-extension-mismatch
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  if:
    type: text
    regex: \.append\([^\r\n]{0,80}createReadStream\(|createReadStream\([^\r\n]{0,200}\.append\(
- id: dotnet-webclient-uploadfile
  desc: client.UploadFile call text
  conf: 0.85
  for:
  - csharp
  if:
    type: text
    regex: client\.UploadFile\s*\(
- id: curl-upload-file-option
  desc: curl selects file upload option
  conf: 0.9
  for:
  - scripts
  - c
  - cpp
  - zig
  - binaries
  if:
    type: text
    regex: \bcurl\b[^\n|;]{0,180}[ \t]+["']?(-T|--upload-file([= \t"']|$))
- id: curl-file-form-option
  desc: curl multipart option names file source
  conf: 0.9
  for:
  - scripts
  - c
  - cpp
  - zig
  - binaries
  if:
    type: text
    regex: \bcurl\b[^\n|;]{0,180}[ \t]+["']?(-F|--form[= \t"'])[^\n|;]{0,120}=@
composite_rules:
- id: curl-file-upload-option
  desc: curl file upload or file-backed form
  conf: 0.9
  for:
  - scripts
  - c
  - cpp
  - zig
  - binaries
  any:
  - id: curl-upload-file-option
  - id: curl-file-form-option
