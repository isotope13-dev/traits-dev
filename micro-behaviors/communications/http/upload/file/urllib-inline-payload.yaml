defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-urllib-inline-file-payload
    desc: urlopen payload reads a local file
    conf: 0.95
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: [(identifier) @send
                     (attribute attribute: (identifier) @send)]
          arguments: (argument_list
            (keyword_argument name: (identifier) @data
              value: (call
                function: (attribute
                  object: (call function: (identifier) @open)
                  attribute: (identifier) @read)))))
         (#eq? @send "urlopen") (#eq? @data "data")
         (#eq? @open "open") (#eq? @read "read"))
