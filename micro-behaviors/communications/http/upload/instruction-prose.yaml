# Natural-language instructions (skill/README/script prose) telling the
# reader or agent to send or upload content to an http(s) URL.
defaults:
  platforms: [unix, windows]
traits:
- id: prose-local-media-reference
  desc: Prose references local media
  crit: component
  conf: 0.88
  for: [markdown, shell, powershell, text]
  if:
    type: text
    regex: '本地.{0,20}(图片|图像|素材|文件)'
- id: prose-local-media-upload-guidance
  desc: Prose references uploading media
  crit: component
  conf: 0.88
  for: [markdown, shell, powershell, text]
  if:
    type: text
    regex: '(?i)\b(upload|uploads|uploading)\b|上传'
- id: prose-upload-content-to-url
  desc: Instruction to upload content to a URL
  crit: notable
  conf: 0.96
  for: [markdown, shell, powershell]
  unless:
    - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  if:
    type: text
    regex: '(?is)\b(contents?|data|files?)\b.{0,30}\b(send|upload)\b.{0,30}https?://'
  not:
    - substr: aui-agent-builder

composite_rules:
- id: prose-cli-uploads-local-media
  desc: Skill says CLI uploads local media
  crit: notable
  conf: 0.91
  for: [markdown, shell, powershell, text]
  near_lines: 1
  all:
  - id: prose-local-media-reference
  - id: prose-local-media-upload-guidance
