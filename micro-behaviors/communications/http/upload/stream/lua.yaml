defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-http-body-from-read"
    desc: "Lua HTTP body receives method-read result"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "http.request"
      arg:
        index: 1
        from:
          call: "(^|\\.)read$"
          argument: 0
          literal: "^\\*a$"
