defaults:
  platforms: [unix, windows]
  for: [class]

traits:
  - id: jvm-okhttp-multipart-builder-class-ref
    desc: JVM bytecode builds an OkHttp multipart request
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.class_refs[*]
      exact: okhttp3/MultipartBody$Builder
