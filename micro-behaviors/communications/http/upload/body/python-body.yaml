# Call facts identify the client, but currently omit Python keyword names.
# Require an actual data/json argument in syntax; POST with only headers or
# params supplies no request-body evidence. Module position is irrelevant.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-http-post-body
    desc: Python HTTP POST sets a body argument
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: (attribute object: (identifier) @client
            attribute: (identifier) @post)
          arguments: (argument_list
            (keyword_argument name: (identifier) @body value: (_) @payload))) @operation
          (#match? @client "^(requests|httpx)$")
          (#eq? @post "post")
          (#match? @body "^(data|json)$")
          (#not-match? @payload "^None$"))
