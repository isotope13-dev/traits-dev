defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - batch
  - powershell

traits:
  - id: curl-body-method-or-upload-file
    desc: curl with -X POST/PUT/PATCH or --upload-file
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: \bcurl\b[^)\r\n|;]{0,200}(\s-X\s+(POST|PUT|PATCH)|\s--upload-file\b)
  - id: curl-upload-file-or-stdin
    desc: curl upload option uses file or stdin
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: \bcurl\b[^)\r\n|;]{0,200}(\s-T\s+|\s-d\s+@)


composite_rules:
  - id: curl-upload-command
    desc: curl requests a body method or upload
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/communications/http/upload/body::curl-body-method-or-upload-file
      - id: micro-behaviors/communications/http/upload/body::curl-upload-file-or-stdin
      - id: "micro-behaviors/communications/http/request/body/source::curl-data-binary-at-source"
