defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - batch
  - powershell

traits:
  - id: curl-long-upload-file
    desc: curl text uses --upload-file option
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: \bcurl\b[^)\r\n|;]{0,200}\s--upload-file(\s+|=)\S
  - id: curl-upload-file-or-stdin
    desc: curl upload option uses file or stdin
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: \bcurl\b[^)\r\n|;]{0,200}(\s-T\s+|\s-d\s+@)


composite_rules:
  - id: curl-upload-command
    desc: curl specifies request body or upload
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/communications/http/upload/body::curl-long-upload-file
      - id: micro-behaviors/communications/http/upload/body::curl-upload-file-or-stdin
      - id: "micro-behaviors/communications/http/request/body/source::curl-data-binary-at-source"
      - id: micro-behaviors/communications/http/curl/body::curl-short-data-option
      - id: micro-behaviors/communications/http/curl/body::curl-data-option
