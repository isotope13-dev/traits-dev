defaults:
  platforms: [linux, macos]
  for: [python]
  crit: notable

traits:
  - id: vllm-usage-stats-json-post
    desc: Posts vLLM usage statistics as JSON
    # Python call facts omit keyword names, so match the JSON argument in the call.
    if:
      type: tree-sitter
      kind: call
      regex: '^global_http_client\.post\(\s*_USAGE_STATS_SERVER\s*,\s*json\s*='
