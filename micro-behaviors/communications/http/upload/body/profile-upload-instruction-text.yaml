---
defaults:
  platforms:
  - unix
  - windows
traits:
- id: prose-upload-content-to-url
  desc: Content, upload and URL text
  crit: component
  conf: 0.96
  for:
  - markdown
  - shell
  - powershell
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  if:
    type: text
    regex: "(?is)\\b(contents?|data|files?)\\b.{0,30}\\b(send|upload)\\b.{0,30}https?://"
  not:
  - substr: aui-agent-builder
