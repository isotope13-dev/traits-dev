defaults:
  platforms: [unix, windows]
  for: [c, cpp, javascript, typescript, python, go]
  crit: notable
  conf: 0.95

composite_rules:
  - id: native-libcurl-post-body
    desc: libcurl POST body setup near request execution
    for: [c, cpp]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/curl/binding::native-post-fields-option
      - id: micro-behaviors/communications/http/client/curl::curl-easy-perform

  - id: native-libcurl-fread-post-upload
    desc: libcurl POST body sized from fread with headers
    for: [c, cpp]
    near_bytes: 1024
    all:
      - id: native-libcurl-post-body
      - id: micro-behaviors/communications/http/curl/binding::native-post-fieldsize-from-fread
      - id: micro-behaviors/communications/http/curl/binding::native-httpheader-option

  - id: source-http-body-send
    desc: HTTP request with a body or POST data option
    any:
      - id: native-libcurl-post-body
      - id: native-libcurl-fread-post-upload
      - id: micro-behaviors/communications/http/request/json::fetch-direct-json-post-body
      - id: python-http-post-body
      - id: micro-behaviors/communications/http/post::http-post
