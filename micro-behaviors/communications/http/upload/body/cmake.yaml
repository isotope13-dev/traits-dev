defaults:
  platforms: [unix, windows]
  for: [cmake]
  crit: notable
traits:
  - id: cmake-credential-upload-command
    desc: CMake command specifies curl upload
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bcurl\b[^\n]{0,80}\s(--data\b|--upload-file\b|-d\s)'
    unless:
      - id: metadata/build/cmake::find-curl-module-basename
  - id: cmake-piped-curl-stdin
    desc: CMake pipes data into curl upload
    if:
      type: text
      regex: '\|\s*curl\s+[^;|\n]{0,80}(--data(-binary)?|-d)\s+@-'
  - id: cmake-cat-curl-pipeline
    desc: CMake pipes file contents to curl
    if:
      type: text
      regex: '\bcat\s+[^;|\n]{1,160}\|(\s*(head|base64)\b[^;|\n]{0,40}\|){0,2}\s*curl\b'
