# BITS uploads may publish legitimate diagnostics. No theft inference.
# The upload direction must occur within the same command as the BITS tool.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  crit: notable
  conf: 0.95
  attack: T1197

traits:
  - id: bitsadmin-upload-transfer
    desc: BITSAdmin file upload command
    if:
      type: text
      exclude_comments: true
      case_insensitive: true
      regex: '\bbitsadmin(\.exe)?"?\s+/transfer\b[^;\r\n|&]{0,160}\s/upload(-reply)?\s'
  - id: bitsadmin-upload-job
    desc: BITSAdmin creates an upload job
    if:
      type: text
      exclude_comments: true
      case_insensitive: true
      regex: '\bbitsadmin(\.exe)?"?\s+/create\s+/upload(-reply)?\s'
  - id: powershell-bits-upload
    desc: PowerShell BITS upload command
    if:
      type: text
      exclude_comments: true
      case_insensitive: true
      regex: '\bStart-BitsTransfer\b[^;\r\n|]{0,240}-TransferType[:\s]+[\''\"]?Upload(Reply)?\b'
