# wget sends a local file as the request body with --post-file (POST) or
# --body-file (any --method). Both name a file to transmit, not a download.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: wget-post-file-upload
    desc: wget sends local file as request body
    crit: notable
    conf: 0.95
    attack: T1048
    if:
      type: text
      exclude_comments: true
      regex: '\bwget\b[^\n|;&]{0,120}\s--(post|body)-file(=|\s+)["'']?[^\s"''-]'
