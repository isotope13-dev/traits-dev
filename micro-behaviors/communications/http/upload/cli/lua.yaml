defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-shell-archive-form-upload"
    desc: "Lua executes a multipart archive-upload command"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "os.execute"
      arg:
        from:
          value: "(?i)-F\\s+\\w+=@[^\\s]+\\.(tar\\.gz|tgz|zip)\\s+https?://"
