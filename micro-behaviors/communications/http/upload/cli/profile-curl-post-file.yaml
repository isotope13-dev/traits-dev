defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: curl-post-file-body-clues
    for: [shell, python]
    desc: curl POST and file-body option clues
    crit: notable
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/curl/body::curl-post-flag
      - id: micro-behaviors/communications/http/upload/file::curl-post-binary-upload
    any:
      - id: micro-behaviors/communications/http/header/custom::curl-filename-header-option
      - id: micro-behaviors/communications/http/curl/command::curl-s-flag
      - id: micro-behaviors/os/console/io::stderr-to-dev-null
