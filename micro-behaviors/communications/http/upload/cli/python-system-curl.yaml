defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-system-curl-file-upload-binding
    desc: Python runs a constructed curl file upload
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: os.system
      arg:
        index: 0
        from:
          value: '^curl -F "file=@'
