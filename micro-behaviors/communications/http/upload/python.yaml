defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1071.001

traits:
  - id: python-collect-post
    desc: Python requests POST to a collect endpoint
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: requests.post
      arg:
        kind: string
        substr: /collect

  - id: upload-file-method-call
    desc: Calls file upload method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_file$'

  - id: upload-blob-method-call
    desc: Calls Python upload_blob method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_blob$'

  - id: upload-transcript-method-call
    desc: Calls agent transcript upload method
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_transcript$'

  - id: upload-session-artifact-method-call
    desc: Calls session artifact upload method
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_session_artifact$'

  - id: requests-post-files-parameter
    desc: requests multipart file upload
    crit: notable
    conf: 0.9
    ref: sha256:c32ab210c704a33aa44c0d7319ee854303abcd0ac41434f5710f91b390cd1e80
    if:
      # Restrict this to an actual call node so examples in comments and
      # docstrings do not look like uploads.
      type: tree-sitter
      kind: call
      regex: 'requests\.post\s*\([\s\S]{0,420}\bfiles\s*='

  # vt-py submits the opened file handle to VirusTotal's scanning API.  The
  # import-plus-call shape avoids treating an unrelated method named
  # `scan_file` as a remote upload.
  - id: virustotal-python-file-upload
    desc: Submits a file through VirusTotal Python API
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bfrom\s+vt\s+import\s+Client\b[\s\S]{0,900}\bclient\.scan_file\s*\('
