defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1071.001

traits:
  - id: python-collect-post
    desc: Python requests POST to collection endpoint
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: requests.post
      arg:
        kind: string
        regex: '(?i)/(collect(ion)?|captur(e|ed)|harvest)(/|$)|/panel/[^/?#]{0,40}(captur(e|ed)|collect|token)(/|$)'

  - id: upload-blob-method-call
    desc: Calls Python upload_blob method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_blob$'

  - id: upload-transcript-method-call
    desc: Calls agent transcript upload method
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_transcript$'

  - id: upload-session-artifact-method-call
    desc: Calls session artifact upload method
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_session_artifact$'

  - id: requests-post-files-parameter
    desc: requests multipart file upload
    crit: notable
    conf: 0.9
    ref: sha256:c32ab210c704a33aa44c0d7319ee854303abcd0ac41434f5710f91b390cd1e80
    if:
      # Restrict this to an actual call node so examples in comments and
      # docstrings do not look like uploads.
      type: tree-sitter
      kind: call
      regex: 'requests\.post\s*\([\s\S]{0,420}\bfiles\s*='

  - id: python-http-files-parameter
    desc: Python multipart HTTP files argument
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(post|put|send[_-]?http)\s*\([\s\S]{0,420}\bfiles\s*='

  - id: python-multipart-files-map
    desc: Python multipart files-map assignment
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\bfiles\s*=\s*\{'

  - id: python-server-script-literal
    desc: Python server-script path literal
    crit: component
    conf: 0.97
    if:
      type: string_literal
      regex: '(?i)\.(php[3-8]?|phtml|pht|phar|jspx?|aspx?|ashx|asmx|cfm|cfc|cgi|pl|shtml)$'

  # vt-py submits the opened file handle to VirusTotal's scanning API.  The
  # import-plus-call shape avoids treating an unrelated method named
  # `scan_file` as a remote upload.
  - id: virustotal-python-file-upload
    desc: Submits a file through VirusTotal Python API
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bfrom\s+vt\s+import\s+Client\b[\s\S]{0,900}\bclient\.scan_file\s*\('

  # A requests `files` list or dict holding a tuple with an empty filename
  # (""). This is the desync primitive, not the bypass verdict: servers that
  # validate and move array entries in separate passes can stop validating at
  # the empty part while still writing a later part. The bypass reading comes
  # from the objectives composite that pairs this with a server-script
  # filename and the requests-post call. Anchored on the `files` container so
  # an empty-string argument elsewhere (assertEqual("", x), a URL three lines
  # down) does not match.
  - id: python-multipart-empty-name-tuple
    desc: Multipart files list has empty-name tuple
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bfiles\s*=\s*[\[{].{0,500}?\(\s*(""|'''')\s*,'

composite_rules:
  - id: python-multipart-server-script-filename
    desc: Python multipart server-script upload
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: python-multipart-files-map
      - id: python-server-script-literal
    near_bytes: 512
