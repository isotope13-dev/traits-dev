defaults:
  platforms: [macos]
  for: [applescript, php]
  attack: T1041

composite_rules:
  - id: macos-curl-tmp-upload-signal
    desc: curl uploads a file staged in macOS temporary storage
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/upload::curl-upload-or-form-option
      - id: micro-behaviors/communications/http/upload::curl-at-tmp
