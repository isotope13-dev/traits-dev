defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: fetch-eval-result-body
    desc: Fetch request body contains an eval result
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 1
        from:
          field: body
          call: '^eval$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
