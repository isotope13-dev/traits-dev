defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: upload-session-file-path-call
    desc: Upload helper receives a session file path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bupload\w*\s*\)?\s*\(\s*\w+\.filePath\s*,'
  - id: node-upload-handler
    desc: JavaScript upload-handler identifier
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: '(?i)^(handle|process)[A-Za-z0-9_]*upload[A-Za-z0-9_]*$'
  - id: formdata-blob-file-fetch-upload
    desc: Uploads Blob file through fetch FormData
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\.append\(\s*["'']file["'']\s*,\s*new Blob\([\s\S]{0,220}fetch\('
  - id: extension-attachment-reupload-call
    desc: Extension attachment reupload call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: reuploadAttachment

  - id: upload-file-js-method-call
    desc: Calls JavaScript uploadFile method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)uploadFile$'
composite_rules:
  - id: transcript-session-file-upload-coordinator
    desc: Reads transcripts and uploads session file paths
    crit: notable
    conf: 0.94
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/os/telemetry/logging/llm::read-transcripts-call
      - id: upload-session-file-path-call

  - id: browser-pdf-multipart-upload
    desc: Sends two PDF fields in a multipart POST
    crit: notable
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/form::pdf-formdata-fields
      - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: pdfcompare-online-document-upload
    desc: Uploads selected PDFs to pdfcompare.online
    crit: notable
    conf: 0.98
    for: [javascript, typescript, crx, xpi, zip]
    scope: archive
    all:
      - id: browser-pdf-multipart-upload
      - id: micro-behaviors/communications/http/url/domain::pdfcompare-online-api-url

  - id: form-data-blob-upload
    desc: Uploads compressed Blob via FormData and fetch
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/form::form-data-append
      - id: micro-behaviors/data/buffer/alloc::blob-with-gzip-media-type
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: extension-trade-order-history-reupload
    desc: Extension reuploads trade order-history attachment
    crit: notable
    conf: 0.97
    scope: archive
    for: [javascript, chrome-manifest, xpi, crx]
    all:
      - id: micro-behaviors/process/hook/xhr::fetch-wrapper-original
      - id: micro-behaviors/communications/http/url/path::trade-order-history-endpoint
      - id: extension-attachment-reupload-call
    any:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/manifest::privacy-sensitive-data-permissions
      - id: metadata/permission/cookie::permission-cookies
