defaults:
  platforms: [unix, windows]
  for: [python, whl]
  crit: notable
composite_rules:
  - id: python-task-api-archive-upload-context
    desc: Task API, ZIP and multipart upload clues coexist
    conf: 0.98
    scope: archive
    all:
      - id: metadata/lang/source/naming/interface::python-task-api-state-names
      - id: metadata/lang/source/naming/interface::python-task-notify-name
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/communications/http/upload::multipart-http-upload
