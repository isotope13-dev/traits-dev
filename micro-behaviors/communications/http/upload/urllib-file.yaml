defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-file-urllib-request-body
    desc: File contents enter urllib request body
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.)?Request$'
      arg:
        from:
          field: data
          call: '^open$'
          through:
            - call: '(^|\.)read$'
              receiver: true
  - id: python-urllib-file-upload
    desc: Sends urllib request with file contents
    conf: 0.95
    if:
      # Named keyword maps are not transparent through a Request transfer in
      # the current flow producer. Bind the adjacent request/send statements
      # structurally; an unrelated urlopen cannot establish this upload.
      type: tree-sitter
      language: python
      query: |
        ((_ (expression_statement (assignment
          left: (identifier) @request_var
          right: (call
            function: [(attribute attribute: (identifier) @request)
                       (identifier) @request]
            arguments: (argument_list (keyword_argument
              name: (identifier) @data
              value: (call function: (attribute
                object: (call function: (identifier) @open)
                attribute: (identifier) @read)))))))
          . (expression_statement (call
            function: [(attribute attribute: (identifier) @urlopen)
                       (identifier) @urlopen]
            arguments: (argument_list (identifier) @sent))))
          (#eq? @request "Request") (#eq? @urlopen "urlopen")
          (#eq? @open "open") (#eq? @read "read")
          (#eq? @data "data") (#eq? @request_var @sent))
