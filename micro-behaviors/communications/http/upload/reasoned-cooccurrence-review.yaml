# References and API co-occurrence do not establish bound data flow.
composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: firefox-cookie-path-multipart-api-cooccurrence
  desc: Firefox cookie paths beside multipart HTTP APIs
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
  any:
  - id: micro-behaviors/communications/http/cookies::domain-attribute
  - id: micro-behaviors/communications/socket/send::send-api-ordinal
  - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/communication/thunderbird/
  - id: metadata/binary/installer/family/
