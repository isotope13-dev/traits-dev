defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: token-upload-operation
    desc: Authentication token upload operation
    if:
      type: text
      regex: '(?i)(admin(LoginAndUpload|UploadLocalToken)|upload token|uploadToken)'

  - id: remote-token-pool-context
    desc: Tenant and client token routing fields
    if:
      type: text
      regex: '(?is)(tenantSlug.{0,220}clientKey|clientKey.{0,220}tenantSlug)'
