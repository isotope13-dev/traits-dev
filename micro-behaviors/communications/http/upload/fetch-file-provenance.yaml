defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: fetch-file-read-body
    desc: Fetch request body contains local file contents
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 1
        from:
          field: body
          call: '(^|\.)readFileSync$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]

