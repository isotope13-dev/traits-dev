defaults:
  crit: notable
  conf: 0.95
  for: [scripts, source]
  platforms: [unix, windows]
traits:
  - id: curl-file-binary-body-command
    desc: curl sends local file as request body
    if:
      type: text
      regex: '(?m)^\s*curl\s+[^\n]{0,180}--data-binary\s+["'']?@[^\n\s"'']{1,180}["'']?\s+https?://'
