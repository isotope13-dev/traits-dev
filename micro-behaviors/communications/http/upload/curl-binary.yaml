# Curl binary data upload
defaults:
  for: [shell, c, cpp]
  platforms: [unix]
traits:
  - id: curl-data-binary
    desc: curl uploads raw binary body
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: --data-binary
  - id: curl-data-binary-stdin
    desc: curl uploads stdin as raw body
    crit: notable
    conf: 0.86
    for: [scripts, binaries, shell, batch, powershell, groovy, python, javascript, ruby]
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,120}--data-binary\s+@-'
  - id: curl-at-tmp
    desc: curl uploads a file from /tmp
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    platforms: [windows, unix]
    if:
      type: text
      regex: '\bcurl(\.exe)?[^\n]{0,80}@/tmp/'
  - id: curl-post-upload-endpoint
    desc: curl POST to upload endpoint
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'curl\s+[^#\n]{0,120}-X\s+POST\s+["''][^"'']{0,120}/upload'
  - id: github-uploads-api
    desc: GitHub release asset upload endpoint path
    crit: notable
    conf: 0.8
    for: [shell, python, javascript, typescript, github-actions]
    platforms: [unix, windows]
    if:
      type: string_literal
      substr: uploads.github.com
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
  - id: curl-upload
    desc: curl uploads a file or raw body
    crit: notable
    conf: 0.82
    for: [scripts, binaries]
    platforms: [windows, unix]
    any:
      - id: micro-behaviors/communications/http/upload::curl-upload-file
      - id: curl-data-binary
      - id: curl-at-tmp

  - id: github-release-asset-publisher
    desc: Publishes an asset to a GitHub release
    crit: notable
    conf: 0.88
    for: [shell, python, javascript, typescript, github-actions]
    platforms: [unix, windows]
    all:
      - id: github-uploads-api
    any:
      - id: micro-behaviors/communications/http/services/github::github-create-release-api
      - id: curl-data-binary
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
