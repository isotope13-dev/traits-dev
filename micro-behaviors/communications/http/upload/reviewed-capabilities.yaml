traits:
- platforms:
  - windows
  - unix
  for:
  - php
  id: php-move-uploaded-temp-file
  desc: PHP moves an uploaded temporary file
  crit: notable
  conf: 0.92
  if:
    type: tree-sitter
    language: php
    query: |
      ((function_call_expression
        function: (name) @function
        arguments: (arguments . (argument
          (subscript_expression
            (subscript_expression (variable_name) @source)
            (string (string_content) @key))))) @upload
        (#eq? @function "move_uploaded_file")
        (#match? @source "^\\$(_FILES|HTTP_POST_FILES)$")
        (#eq? @key "tmp_name"))
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
