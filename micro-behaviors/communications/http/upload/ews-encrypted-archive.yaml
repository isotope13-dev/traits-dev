# The endpoints and credentials may be explicitly supplied by an operator.
# No unauthorized destination or mailbox-to-upload provenance is inferred.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
composite_rules:
  - id: python-ews-zip-aes-file-post-capabilities
    desc: EWS ZIP, AES and file-to-HTTP body capabilities
    all:
      - id: micro-behaviors/communications/email/access/exchange::python-ews-hidden-zip-capabilities
      - id: micro-behaviors/crypto/encrypt::python-aes-encrypt-call
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/upload::file-http-body-flow
