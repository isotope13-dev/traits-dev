# Bind the tar fileobj to the buffer passed to a local HTTP helper, then bind
# that helper's second parameter to the urllib Request data keyword. Names,
# URLs, archive members, encryption keys and campaign tokens are unconstrained.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-tar-buffer-http-helper
    desc: Tar buffer enters HTTP helper request body
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition body: (block
            (with_statement (with_clause (with_item value: (as_pattern
              (call function: (attribute) @archive_open
                arguments: (argument_list (keyword_argument
                  name: (identifier) @fileobj value: (identifier) @buffer)))))))
            . (expression_statement (call function: (identifier) @helper_call
              arguments: (argument_list . (_)
                . (call function: (attribute object: (identifier) @sent_buffer
                  attribute: (identifier) @getvalue)))))))
          (function_definition name: (identifier) @helper
            parameters: (parameters . (identifier) @url . (identifier) @body)
            body: (block . (expression_statement (assignment
              right: (call function: (attribute) @request
                arguments: (argument_list . (identifier) @endpoint
                  (keyword_argument name: (identifier) @data
                    value: (identifier) @payload))))))))
          (#eq? @archive_open "tarfile.open")
          (#eq? @fileobj "fileobj")
          (#eq? @buffer @sent_buffer)
          (#eq? @getvalue "getvalue")
          (#eq? @helper_call @helper)
          (#eq? @request "urllib.request.Request")
          (#eq? @data "data")
          (#eq? @body @payload)
          (#eq? @url @endpoint))

