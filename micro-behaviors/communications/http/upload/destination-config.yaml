defaults:
  crit: notable
  conf: 0.98
  for: [source, scripts, text]
  platforms: [windows, unix]

traits:
  - id: copy-to-destination-field
    desc: Upload destination supplied through copyTo field
    if:
      type: text
      regex: '["'']copyTo["'']\s*:'

  - id: file-upload-api-path
    desc: FileUpload HTTP API path reference
    if:
      type: string_literal
      regex: '/FileUpload($|[?"''\s])'

