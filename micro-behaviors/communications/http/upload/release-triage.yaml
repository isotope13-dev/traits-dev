defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
- id: object-file-upload-api-reference
  desc: Object or file upload API references
  crit: notable
  conf: 0.88
  unless:
    - id: well-known/lib/web/stacksjs/stx::stacksjs-stx-framework-context
    - id: well-known/app/publishing/sphinxcontrib-osint::sphinxcontrib-osint-package
    - id: well-known/app/publishing/sphinxcontrib-osint::owebuil-api-class
    - id: well-known/app/publishing/sphinxcontrib-osint::bsky-story-class
  any:
    - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object-python
    - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object-typescript
    - id: micro-behaviors/communications/http/services/aws-s3::s3-put-object
    - id: micro-behaviors/fs/file/read-write::python-upload-file-call
    - id: micro-behaviors/communications/http/upload::upload-blob-method-call
    - id: micro-behaviors/communications/http/upload::upload-file-js-method-call

