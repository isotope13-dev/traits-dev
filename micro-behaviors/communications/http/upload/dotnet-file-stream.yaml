defaults:
  platforms: [unix, windows]
  for: [csharp]

composite_rules:
  - id: dotnet-file-openread-post-cooccurrence
    desc: File.OpenRead co-occurs with an HTTP POST StreamContent body
    crit: notable
    conf: 0.96
    near_lines: 5
    all:
      - id: micro-behaviors/fs/file/open::dotnet-file-openread-call
      - id: micro-behaviors/communications/http/client/managed::dotnet-streamcontent
      - id: micro-behaviors/communications/http/client/managed::postasync
