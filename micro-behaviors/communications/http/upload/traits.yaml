defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
traits:
  - id: http-upload-symbol-a
    desc: HTTP file upload symbol family A
    crit: notable
    conf: 0.6
    if:
      type: symbol
      regex: (^|_)http[_-]?upload|curl_easy_upload
  - id: http-upload-symbol-b
    desc: HTTP file upload symbol family B
    crit: notable
    conf: 0.6
    if:
      type: symbol
      substr: http_put
  - id: curl-zip
    desc: curl with .zip
    crit: notable
    conf: 0.6
    for: [elf, macho, pe, c, cpp, python, rust]
    if:
      type: text
      regex: curl.{0,50}\.zip
  - id: post-zip
    desc: POST with .zip
    crit: notable
    conf: 0.6
    for: [elf, macho, pe, c, cpp, python, rust]
    if:
      type: text
      regex: POST.{0,50}\.zip
  - id: upload-zip
    desc: upload .zip
    crit: notable
    conf: 0.6
    for: [elf, macho, pe, c, cpp, python, rust]
    if:
      type: text
      regex: upload.{0,50}\.zip
  # Every curl flag that attaches a file to the request body, not just one:
  # -T/--upload-file (PUT a file) and -F/--form (multipart part, `-F f=@path`).
  # Naming the trait after a single spelling made an ordinary `-F` upload read
  # back as a --upload-file the script does not contain.
  - id: curl-upload-file
    desc: curl file-upload flag (-T/-F/--upload-file)
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: '\bcurl\b[\s\S]{0,180}(--upload-file\b|--form([ =])|[ \t](-T|-F)([ \t=]))'
  # `-F field=@path` names a local file as the multipart part source, which is
  # narrower than the flag alone (a `-F key=value` form post carries no file).
  # This is a neutral transfer capability -- `curl -X POST -F "file=@x" $URL` is
  # how any upload endpoint is exercised -- so it lives here; the exfiltration
  # and C2 composites that need it supply the destination evidence themselves.
  - id: curl-form-file-attachment
    desc: curl -F attaches a local file
    crit: notable
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: text
      regex: \bcurl(\.exe)?\s+.{0,160}-F\s+["']?[\w.-]{1,40}=@
    unless:
    - id: well-known/app/system/omarchy::source-tree
  - id: gitlab-generic-package-upload
    desc: GitLab Generic Package Registry upload
    crit: notable
    conf: 0.86
    for: [scripts, binaries]
    if:
      type: text
      regex: /api/v4/projects/.{0,160}/packages/generic/
  - id: http-upload-url-path
    desc: HTTP URL with upload endpoint
    crit: notable
    conf: 0.76
    if:
      type: text
      regex: 'https?://[A-Za-z0-9.-]{3,253}/[A-Za-z0-9._~:/?#\[\]@!$&''()*+,;=-]{0,80}upload\b'
  - id: upload-path-fragment
    desc: /upload URL path fragment
    crit: baseline
    conf: 0.9
    platforms: [windows]
    for: [pe]
    if:
      type: text
      section: .text
      substr: /upload
  - id: data-collection-upload-path
    desc: References a collection or upload endpoint
    crit: notable
    conf: 0.9
    for: [binaries, scripts]
    if:
      type: text
      regex: '["'']/(collect|upload|exfil)["'']|["'']/api/v1/exfil["'']'
    unless:
      - id: well-known/lib/core/htmlforgex/
      - id: metadata/package/documentation::package-doc-reference-basename

  - id: node-local-file-formdata-stream
    desc: Node local file stream in FormData
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    unless:
      - id: metadata/file/extension/identity::script-content-extension-mismatch
      - id: well-known/app/ai/aui-agent-builder/
    if:
      type: text
      # This is a local-file multipart capability, not an exfiltration
      # verdict.  Intent belongs in composites that add collection context.
      # The form object is matched by its .append() call rather than by the
      # name `form`, so bundled/minified callers (`x.append("file",
      # o.createReadStream(p))`) are still covered.
      regex: '\.append\([^\r\n]{0,80}createReadStream\(|createReadStream\([^\r\n]{0,200}\.append\('

  - id: multipart-file-array-field
    desc: Multipart file array field
    crit: component
    conf: 0.82
    if:
      type: text
      exact: file[]
  - id: multipart-empty-filename
    desc: Multipart file part has an empty filename
    crit: component
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?im)filename\s*=\s*""\s*$'

  # Server-executable extensions are useful structure for triage, but uploads
  # of deployment artifacts can be legitimate. The atoms remain separated by
  # runtime family to keep each pattern small and reusable.
  - id: multipart-php-script-filename
    desc: Multipart part names a PHP script
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)filename\s*=\s*"[^"\r\n]{1,160}\.(php[3-8]?|phtml|pht|phar)"'
  - id: multipart-managed-script-filename
    desc: Multipart part names a managed web script
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)filename\s*=\s*"[^"\r\n]{1,160}\.(jspx?|aspx?|ashx|asmx|cfm|cfc)"'
  - id: multipart-cgi-script-filename
    desc: Multipart part names a CGI script
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)filename\s*=\s*"[^"\r\n]{1,160}\.(cgi|pl)"'
  - id: dotnet-webclient-uploadfile
    desc: .NET WebClient UploadFile call
    crit: notable
    conf: 0.85
    for: [csharp]
    if:
      type: text
      regex: client\.UploadFile\s*\(
  - id: dotnet-webclient-uploadvalues
    desc: .NET WebClient.UploadValues form post
    crit: notable
    conf: 0.8
    for: [csharp]
    if:
      type: text
      regex: client\.UploadValues\s*\(
composite_rules:
  - id: browser-multi-channel-upload-fallback
    desc: Uses beacon fetch and image upload fallbacks
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    needs: 3
    any:
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::image-src-network-request

  - id: http-upload-symbol
    desc: HTTP file upload symbol
    crit: notable
    conf: 0.6
    any:
      - id: http-upload-symbol-a
      - id: http-upload-symbol-b
  - id: zip-upload
    desc: ZIP archive upload
    crit: notable
    conf: 0.75
    for: [elf, macho, pe, c, cpp, python, rust]
    any:
      - id: curl-zip
      - id: post-zip
      - id: upload-zip
      - id: curl-upload-file
  # The legs establish multipart body construction plus an upload-shaped
  # request; nothing here identifies the destination, so the description does
  # not claim a remote endpoint.
  - id: multipart-form-data-upload
    desc: Multipart form-data HTTP upload capability
    crit: notable
    conf: 0.82
    all:
      - id: micro-behaviors/communications/http/headers::form-data-header
    any:
      - id: http-upload-url-path
      - id: micro-behaviors/communications/http/post::post-string-pe
      - id: micro-behaviors/communications/http/download/curl::curl-easy-perform-error-string
