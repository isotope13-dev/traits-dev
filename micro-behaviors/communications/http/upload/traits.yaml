defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - elf
  - macho
  - pe
  crit: notable
traits:
- id: http-upload-symbol
  desc: HTTP upload or PUT symbol
  conf: 0.6
  if:
    type: symbol
    regex: (^|_)http[_-]?upload|curl_easy_upload|http_put
- id: curl-upload-or-form-option
  desc: curl upload or multipart form option
  conf: 0.9
  for:
  - scripts
  - c
  - cpp
  - zig
  - binaries
  if:
    type: text
    regex: \bcurl\b[^\n|;]{0,180}(--upload-file\b|--form([ =])|[ \t](-T|-F)([ \t=]))
- id: rust-curl-upload-args
  desc: Rust curl command uses file upload
  conf: 0.94
  for:
  - rust
  if:
    type: text
    regex: Command::new\s*\(\s*"curl"\s*\)[\s\S]{0,180}"-T"
- id: curl-form-file-attachment
  desc: curl -F attaches a local file
  conf: 0.7
  for:
  - scripts
  - binaries
  - github-actions
  platforms:
  - unix
  - windows
  if:
    type: text
    regex: \bcurl(\.exe)?\b[^\n]{0,180}-F\b.{0,80}=@
- id: encoded-curl-form-file-attachment
  desc: Encoded curl attaches a local file
  conf: 0.9
  for: [scripts, go, typescript, -mirc, -ircii]
  if:
    type: encoded
    regex: \bcurl\b[^\r\n;|]{0,80}(-F|--form)[ =]+["']?[\w.-]{1,40}=@
- id: gitlab-generic-package-upload
  desc: GitLab Generic Package Registry upload
  conf: 0.86
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: /api/v4/projects/.{0,160}/packages/generic/
- id: node-local-file-formdata-stream
  desc: Node local file stream in FormData
  conf: 0.94
  for:
  - javascript
  - typescript
  unless:
  - id: metadata/file/extension/identity::script-content-extension-mismatch
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  if:
    type: text
    regex: \.append\([^\r\n]{0,80}createReadStream\(|createReadStream\([^\r\n]{0,200}\.append\(
- id: upload-extension-allowlist-key
  desc: Upload-prefixed file-extension allowlist field
  conf: 0.94
  for:
  - scripts
  - source
  - text
  if:
    type: text
    regex: (?i)\bupload[_-]?(allowed|permitted)[_-]?(file[_-]?)?ext(ension)?s?\b
- id: upload-accepted-files-key
  desc: acceptedFiles or allowed_file_types field
  conf: 0.94
  for:
  - scripts
  - source
  - text
  if:
    type: text
    regex: (?i)(accepted[_-]?files?(_types)?|allowed[_-]?file[_-]?types)
- id: dotnet-webclient-uploadfile
  desc: .NET WebClient UploadFile call
  conf: 0.85
  for:
  - csharp
  if:
    type: text
    regex: client\.UploadFile\s*\(
- id: curl-data-binary-file-body
  desc: curl sends named file as request body
  conf: 0.9
  for:
  - markdown
  - shell
  - powershell
  - text
  - javascript
  - typescript
  - python
  if:
    type: text
    regex: \bcurl\b[^\n]{0,160}--data-binary\s+@["']?[$%~\w./\\][^\s;&|"'<>]{0,199}
- id: curl-post-temp-json-file
  desc: curl POST sends temporary JSON file
  conf: 0.94
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: \bcurl\b.{0,120}-X\s+POST.{0,120}-d\s+@(/tmp|/var/tmp)/[^ \t\r\n;|]{1,80}\.json
composite_rules:
- id: curl-named-file-body-upload-command
  desc: curl command sends a named local file as request body
  conf: 0.96
  for:
  - shell
  - powershell
  near_lines: 1
  all:
  - id: curl-data-binary-file-body
  - id: micro-behaviors/communications/http/curl::curl-command-call
- id: upload-file-type-allowlist
  desc: Upload file-type allowlist field
  conf: 0.94
  for:
  - scripts
  - source
  - text
  any:
  - id: upload-extension-allowlist-key
  - id: upload-accepted-files-key
- id: server-script-extension-allowlist
  desc: Upload allowlist accepts server scripts
  conf: 0.96
  for:
  - scripts
  - source
  - text
  all:
  - id: upload-file-type-allowlist
  any:
  - id: micro-behaviors/fs/path/extension::php-script-extension-token
  - id: micro-behaviors/fs/path/extension::managed-script-extension-token
  - id: micro-behaviors/fs/path/extension::cgi-script-extension-token
  near_bytes: 512
- id: browser-multi-channel-upload-fallback
  desc: Uses beacon fetch and image upload fallbacks
  conf: 0.95
  for:
  - javascript
  - typescript
  needs: 3
  any:
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/request/client::image-src-network-request
- id: multipart-form-data-upload
  desc: Multipart form-data HTTP upload capability
  conf: 0.82
  all:
  - id: micro-behaviors/communications/http/form::form-data-header
  any:
  - id: micro-behaviors/communications/http/url/api-path::http-upload-url-path
  - id: micro-behaviors/communications/http/post::native-post-method-token
  - id: micro-behaviors/communications/http/download/curl::curl-easy-perform-error-string
- id: multipart-http-upload
  desc: Sends data through multipart HTTP upload
  conf: 0.94
  for:
  - binaries
  - scripts
  - source
  any:
  - id: python-http-files-parameter
  - id: node-local-file-formdata-stream
  - id: micro-behaviors/communications/http/form::javascript-formdata-file-upload-request
  - id: multipart-form-data-upload
