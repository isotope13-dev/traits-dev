# A remote response selects the path, and that file supplies the upload body.
# Adjacent C# statements exclude intervening reassignment of captured variables.
# ReadAllBytes in the Python transfer model represents path-to-content dependence.
defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - python
  crit: notable
  conf: 0.97
traits:
- id: csharp-http-selected-file-upload
  desc: Uploads file bytes selected by HTTP response
  for:
  - csharp
  if:
    type: tree-sitter
    query: |
      (block
      (local_declaration_statement (variable_declaration (variable_declarator name: (identifier) @remote_path (await_expression (invocation_expression function: (member_access_expression expression: (identifier) @get_client name: (identifier) @get) arguments: (argument_list (argument (_))))))))
      .
      (local_declaration_statement (variable_declaration (variable_declarator name: (identifier) @file_data (invocation_expression function: (member_access_expression expression: (identifier) @file name: (identifier) @read) arguments: (argument_list (argument (identifier) @path_read))))))
      .
      (expression_statement (await_expression (invocation_expression function: (member_access_expression expression: (identifier) @put_client name: (identifier) @put) arguments: (argument_list (argument (_)) (argument (object_creation_expression type: (identifier) @body_type arguments: (argument_list (argument (identifier) @sent))))))))
      (#eq? @get "GetStringAsync")
      (#eq? @file "File")
      (#eq? @read "ReadAllBytes")
      (#eq? @put "PutAsync")
      (#eq? @body_type "ByteArrayContent")
      (#eq? @remote_path @path_read)
      (#eq? @file_data @sent)
      (#eq? @get_client @put_client))
      ((class_declaration (declaration_list (method_declaration (identifier) @helper (parameter_list . (_) . (parameter (identifier) @parameter) .) (block (local_declaration_statement (variable_declaration (variable_declarator (await_expression (invocation_expression (member_access_expression (identifier) @put) (argument_list . (_) . (argument (object_creation_expression (identifier) @bodytype (argument_list . (argument (identifier) @bodybytes) .))) .)))))))) (method_declaration (block (while_statement (block (foreach_statement (block (if_statement (if_statement (block (local_declaration_statement (variable_declaration (variable_declarator (identifier) @path (await_expression (invocation_expression (member_access_expression) @get))))) . (expression_statement (await_expression (invocation_expression (identifier) @upload (argument_list . (_) . (argument (await_expression (invocation_expression (member_access_expression) @read (argument_list . (argument (identifier) @readpath) .)))) .)))))))))))))))
      (#eq? @put "PutAsync")
      (#eq? @bodytype "ByteArrayContent")
      (#eq? @parameter @bodybytes)
      (#match? @get "^[A-Za-z_]\\w*\\.GetStringAsync$")
      (#eq? @read "File.ReadAllBytesAsync")
      (#eq? @path @readpath)
      (#eq? @helper @upload))
- id: managed-http-selected-file-upload-flow
  desc: HTTP path selects file bytes for upload
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: \.UploadData$
    arg:
      index: 2
      from:
        call: \.DownloadString$
        through:
        - call: (^|\.)File\.ReadAllBytes$
          arguments:
          - 0

composite_rules:
- id: managed-http-selected-file-upload
  desc: Uploads local file bytes selected by HTTP response
  any:
  - id: csharp-http-selected-file-upload
  - id: managed-http-selected-file-upload-flow
