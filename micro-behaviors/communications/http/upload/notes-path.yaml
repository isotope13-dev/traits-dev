defaults:
  platforms: [ios, macos]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: python-ios-notes-path-byte-post
    desc: Posts bytes from iOS Notes database path
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @path
            right: (call function: (identifier) @constructor
              arguments: (argument_list (string) @database))))
          . (expression_statement (call
            function: (attribute object: (identifier) @client attribute: (identifier) @post)
            arguments: (argument_list
              (keyword_argument name: (identifier) @data
                value: (call function: (attribute
                  object: (identifier) @read_path attribute: (identifier) @read)))))))
         (#eq? @constructor "Path")
         (#match? @database "/private/var/mobile/Library/Notes/notes\\.sqlite")
         (#eq? @path @read_path)
         (#match? @client "^(requests|httpx)$")
         (#eq? @post "post")
         (#eq? @data "data")
         (#eq? @read "read_bytes"))
