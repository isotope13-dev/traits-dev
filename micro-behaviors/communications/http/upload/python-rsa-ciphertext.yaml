# Bind the loaded key, chunk encryption, joined ciphertext and POST data.
# Direct RSA encryption is distinct from an AES body with an RSA-wrapped key.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-rsa-oaep-ciphertext-post
    desc: Sends joined RSA-OAEP ciphertext as HTTP body
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @loaded_key
            right: (call function: (attribute
              object: (identifier) @serialization
              attribute: (identifier) @load_key))))
          . (expression_statement (assignment
            left: (identifier) @ciphertext
            right: (call function: (attribute
              object: (string) @separator attribute: (identifier) @join)
              arguments: (generator_expression
                body: (call function: (attribute
                  object: (identifier) @used_key
                  attribute: (identifier) @encrypt)
                  arguments: (argument_list
                    . (subscript)
                    . (call function: (attribute
                      object: (identifier) @padding
                      attribute: (identifier) @oaep))))
                (for_in_clause left: (identifier) @index)))))
          . (expression_statement (call
            function: (attribute object: (identifier) @client
              attribute: (identifier) @post)
            arguments: (argument_list
              (keyword_argument name: (identifier) @data
                value: (identifier) @sent))))) @transfer
          (#eq? @serialization "serialization")
          (#eq? @load_key "load_pem_public_key")
          (#eq? @loaded_key @used_key)
          (#not-eq? @index @used_key)
          (#eq? @join "join")
          (#match? @separator "^b['\"]{2}$")
          (#eq? @encrypt "encrypt")
          (#eq? @padding "padding")
          (#eq? @oaep "OAEP")
          (#match? @client "^(requests|httpx)$")
          (#eq? @post "post")
          (#eq? @data "data")
          (#eq? @ciphertext @sent))
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
