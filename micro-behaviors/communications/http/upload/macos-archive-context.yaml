composite_rules:
- id: macos-archive-curl-upload-context
  desc: Temporary archive creation with curl upload references
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/data/archive/create/utility::tmp-archive
  any:
  - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
  - id: micro-behaviors/communications/http/upload::encoded-curl-form-file-attachment
  - id: micro-behaviors/communications/http/curl::curl-data-binary-at-source
  platforms:
  - macos
  for:
  - shell
  - applescript
  - javascript
  - typescript
  - python
