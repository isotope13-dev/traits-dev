defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: pgadmin-csrf-token-read
  desc: pgAdmin client CSRF-token reference
  conf: 0.9
  if:
    type: text
    substr: window.pgAdmin.csrf_token
- id: antiforgery-token-formdata-append
  desc: Appends an anti-forgery token to FormData
  conf: 0.96
  if:
    type: text
    regex: '(?is)(anti.?forgery|csrf|xsrf)[\s\S]{0,600}FormData[\s\S]{0,250}\.append\s*\('
- id: token-formdata-post-construction
  desc: Creates a POST form from FormData
  conf: 0.9
  if:
    type: text
    regex: '(?is)create\w*form\s*\(\s*\{[^}]{0,240}method\s*:\s*["'']POST["''][^}]{0,160}formData'

composite_rules:
- id: anti-forgery-token-form-post
  desc: Anti-forgery token is posted in a browser form
  conf: 0.96
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/http/form::formdata-class
  - id: antiforgery-token-formdata-append
  - id: token-formdata-post-construction
