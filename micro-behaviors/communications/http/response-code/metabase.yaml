# Response-code observations for Metabase's disclosed exploitation sequence.
defaults:
  platforms: [unix, windows]
  for: [scripts, json, typescript, rust, java, go, csharp]
  attack: T1190
  mbc: C0002

traits:
  - id: reset-password-source-400
    desc: Checks HTTP 400 for reset request
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bstatus(_code)?\s*={1,3}\s*400\b'

  - id: reset-password-json-400
    desc: JSON event records HTTP 400 for reset
    crit: notable
    conf: 0.9
    for: [json]
    if:
      type: text
      regex: '(?i)"status"\s*:\s*400\b'

  - id: reset-password-wire-400
    desc: HTTP response line returns status 400
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)HTTP/1\.[01]\s+400\b'

  - id: current-user-source-200
    desc: Source checks HTTP 200 for current-user request
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bstatus(_code)?\s*={1,3}\s*200\b'

  - id: current-user-json-200
    desc: JSON event has HTTP 200 current-user
    crit: notable
    conf: 0.9
    for: [json]
    if:
      type: text
      regex: '(?i)"status"\s*:\s*200\b'

  - id: current-user-wire-200
    desc: HTTP response line returns status 200
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)HTTP/1\.[01]\s+200\b'

composite_rules:
  - id: reset-password-400-response
    desc: Metabase password-reset request returns HTTP 400
    crit: suspicious
    conf: 0.98
    any:
      - id: reset-password-source-400
      - id: reset-password-json-400
      - id: reset-password-wire-400

  - id: current-user-200-response
    desc: Metabase current-user request returns HTTP 200
    crit: notable
    conf: 0.96
    any:
      - id: current-user-source-200
      - id: current-user-json-200
      - id: current-user-wire-200
