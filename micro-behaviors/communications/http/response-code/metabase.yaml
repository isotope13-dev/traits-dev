# HTTP response-code observations used by the Metabase exploitation sequence.
# These atoms describe the response syntax only; the objective tier supplies
# the endpoint context and exploit interpretation.
defaults:
  platforms: [unix, windows]
  for: [scripts, json, typescript, rust, java, go, csharp]
  attack: T1190
  mbc: C0002

traits:
  - id: source-http-400-status
    desc: Source compares HTTP status to 400
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: binary_op
      regex: '(?i)\bstatus(_code)?\s*={2,3}\s*400\b'

  - id: source-http-400-status-assignment
    desc: Source assigns HTTP status 400
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)\bstatus(_code)?\s*=\s*400\b'

  - id: json-http-400-status
    desc: JSON event records HTTP 400 response
    crit: notable
    conf: 0.9
    for: [json]
    if:
      type: text
      regex: '(?i)"status"\s*:\s*400\b'

  - id: wire-http-400-status
    desc: HTTP response line returns status 400
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)HTTP/1\.[01]\s+400\b'

  - id: source-http-200-status
    desc: Source compares HTTP status to 200
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: binary_op
      regex: '(?i)\bstatus(_code)?\s*={2,3}\s*200\b'

  - id: source-http-200-status-assignment
    desc: Source assigns HTTP status 200
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)\bstatus(_code)?\s*=\s*200\b'

  - id: json-http-200-status
    desc: JSON event records HTTP 200 response
    crit: notable
    conf: 0.9
    for: [json]
    if:
      type: text
      regex: '(?i)"status"\s*:\s*200\b'

  - id: wire-http-200-status
    desc: HTTP response line returns status 200
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)HTTP/1\.[01]\s+200\b'

  - id: source-http-206-partial-content
    desc: Source returns HTTP 206 content
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)send_response\s*\(\s*206\b'

composite_rules:
  - id: http-400-response
    desc: HTTP response returns status 400
    crit: notable
    conf: 0.93
    any:
      - id: source-http-400-status
      - id: source-http-400-status-assignment
      - id: json-http-400-status
      - id: wire-http-400-status

  - id: http-200-response
    desc: References HTTP 200 response status
    crit: notable
    conf: 0.93
    any:
      - id: source-http-200-status
      - id: source-http-200-status-assignment
      - id: json-http-200-status
      - id: wire-http-200-status
