# HTTP 429 rate-limit handling.
#
# A client that tests for the 429 status and waits out the server's Retry-After
# hint is built to keep issuing requests through a rate limiter rather than to
# stop at one. Well-behaved API clients do this too, so these stay neutral
# capability observations; the objective tier supplies what is being requested
# at that rate and from how many source addresses.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
  attack: T1590
  mbc: C0002

traits:
  - id: source-http-429-status
    desc: Source checks for HTTP 429 rate-limit response
    crit: notable
    conf: 0.9
    if:
      # Covers `status_code == 429` (Python), `status === 429` (JS),
      # `StatusCode != 429` (Go) — the comparison, not a bare literal 429,
      # which also appears in port numbers and offsets.
      type: text
      regex: '(?i)\bstatus[_a-z]{0,10}\s*[=!]={1,2}\s*429\b'

composite_rules:
  # A 429 check next to a Retry-After name shows rate-limit header handling;
  # the header-name atom intentionally does not claim that a delay occurs.
  - id: rate-limit-header-handling
    desc: Recognizes HTTP 429 and Retry-After
    crit: notable
    conf: 0.93
    all:
      - id: source-http-429-status
      - id: micro-behaviors/communications/http/header/retry-after::retry-after-header-name-reference
    near_bytes: 512
