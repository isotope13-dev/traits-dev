defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll]
  crit: notable

traits:
  - id: dotnet-hardcoded-default-log-endpoint
    desc: Embeds default remote logging endpoint
    conf: 0.94
    if:
      type: text
      regex: 'https://[A-Za-z0-9.-]{4,160}/logs$'

  - id: dotnet-embedded-default-api-key
    desc: Embeds default API key credential
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)^[A-Za-z0-9._-]{2,40}-default-api-key$'

  - id: dotnet-http-log-entry-sender
    desc: Implements HTTP log-entry sender
    conf: 0.92
    if:
      type: text
      exact: HttpSinkLoggerProvider

