# Chromium's in-process DevTools server surface.
#
# These are internal Chromium routine names, not product or incident markers.
# A browser build may legitimately contain them; the objective-level rules
# combine the routines with a browser target and credential access before
# making an attack assessment.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [pe, dll, c, cpp, csharp, rust, go, python, javascript, typescript, powershell]
  attack: T1106

traits:
  - id: chromium-start-remote-debugging-server-reference
    desc: Chromium remote-debugging routine
    conf: 0.96
    if:
      type: text
      word: StartRemoteDebuggingServer

  - id: chromium-tcp-server-socket-factory-reference
    desc: Chromium TCP server socket factory
    conf: 0.96
    if:
      type: text
      word: TCPServerSocketFactory

composite_rules:
  - id: chromium-internal-devtools-server-routine
    desc: Chromium internal DevTools server routine references
    conf: 0.97
    any:
      - id: chromium-start-remote-debugging-server-reference
      - id: chromium-tcp-server-socket-factory-reference
