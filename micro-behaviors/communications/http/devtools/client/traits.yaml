# Chromium DevTools Protocol (CDP) client surface.
#
# CDP is the low-level protocol used by Chrome/Edge/Electron for headless
# automation, debugging, and (when reachable) remote inspection. The atoms
# below identify code that *speaks* CDP — both legitimate clients (puppeteer,
# playwright, chromium-recorder wrappers) and post-exploitation frameworks
# that abuse a reachable debug interface to drive a running browser/Electron
# app.
#
# These are micro-behaviors — they fire broadly and the analyst decides intent
# from context (paired traits, deployment, etc.). The composite at the bottom
# requires multiple signals before claiming "this is a CDP client."
defaults:
  # Mach-O belongs here: the browser-session-hijack modules that speak CDP now
  # ship as compiled macOS binaries (AmnesiaStealer's Rust stream_module among
  # them), and the protocol method names survive compilation as ordinary
  # string literals. `unix` already covers macOS, so only `for:` needed
  # widening. The exclusions drop formats that cannot host a WebSocket client
  # (JCL, batch, VBScript) and compiled intermediates whose source form is
  # already covered (bytecode, static libraries).
  for: [binaries, scripts, source, -jcl, -batch, -vbs, -beam, -pyc, -class, -staticlib, -wasm]
  platforms: [windows, unix]
  attack: T1106
traits:
  - id: cdp-debugger-url-key
    desc: Chrome DevTools webSocketDebuggerUrl JSON key
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: webSocketDebuggerUrl

  - id: cdp-http-json-version
    desc: CDP /json/version discovery endpoint
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: /json/version

  - id: cdp-http-json-list
    desc: "CDP /json/list HTTP discovery endpoint"
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: /json/list

  - id: cdp-http-json-protocol
    desc: 'cdp http json protocol'
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: /json/protocol

  - id: cdp-loopback-endpoint
    desc: Loopback CDP WebSocket endpoint
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(ws|wss)://(localhost|127\.0\.0\.1):[0-9]{2,5}/devtools/'

  - id: cdp-method-runtime-evaluate
    desc: CDP Runtime.evaluate arbitrary-JS dispatch
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Runtime.evaluate

  - id: cdp-method-runtime-add-binding
    desc: CDP registers browser-to-client binding
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Runtime.addBinding

  - id: cdp-method-page-bypass-csp
    desc: CDP disables browser content security policy
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Page.setBypassCSP

  # Storage.getCookies takes no URL filter — it returns every cookie in the
  # browser context, so it is the whole-jar read.
  - id: cdp-method-storage-get-cookies
    desc: CDP Storage domain whole-cookie-jar read
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Storage.getCookies

  # Network.getCookies vs Network.getAllCookies are different reads and are
  # split into their own atoms: getCookies takes a `urls` filter and is what
  # ordinary automation calls to build a request header for the page it is
  # already driving; getAllCookies takes no filter and dumps every cookie the
  # browser holds. Only the second is theft-shaped, so the credential-access
  # composite keys on it rather than on the merged pattern.
  - id: cdp-method-network-get-cookies
    desc: CDP scoped cookie retrieval via Network domain
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bNetwork\.getCookies\b'

  - id: cdp-method-network-get-all-cookies
    desc: CDP dumps every cookie via Network domain
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bNetwork\.getAllCookies\b'

  - id: cdp-method-network-set-cookies
    desc: CDP writes browser cookies via Network domain
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bNetwork\.setCookies\b'

  - id: cdp-method-runtime-enable
    desc: CDP Runtime.enable method
    crit: component
    conf: 0.75
    if:
      type: text
      substr: Runtime.enable

  - id: cdp-method-page-navigate
    desc: CDP Page.navigate method
    crit: notable
    conf: 0.78
    if:
      type: text
      substr: Page.navigate

  - id: cdp-method-network-user-agent-override
    desc: CDP browser User-Agent override method
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Network.setUserAgentOverride

  - id: cdp-method-emulation-timezone-override
    desc: CDP browser timezone override method
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Emulation.setTimezoneOverride

  - id: cdp-method-performance-disable
    desc: CDP browser performance disable method
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Performance.disable

  - id: cdp-method-page-add-script
    desc: CDP injects script on new documents
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: Page.addScriptToEvaluateOnNewDocument

  # --- Interactive control surface -----------------------------------------
  #
  # The Input domain synthesizes user input inside the target: the page cannot
  # tell a dispatched event from a real keystroke or click. Page.startScreencast
  # streams rendered frames back out. Together they are the two halves of
  # "operate this browser remotely" — which is what separates a live
  # session-hijack module from an automation client that only scripts
  # navigation and scraping.
  #
  # Restricted to source and script carriers: a Chromium/Electron *binary*
  # embeds the whole CDP method-name table, so matching these against
  # `binaries` would fire on every browser build rather than on code that
  # speaks the protocol.
  - id: cdp-method-input-dispatch-key-event
    desc: CDP synthesizes browser keyboard input
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      substr: Input.dispatchKeyEvent

  - id: cdp-method-input-dispatch-mouse-event
    desc: CDP synthesizes browser mouse input
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      substr: Input.dispatchMouseEvent

  - id: cdp-method-input-dispatch-touch-event
    desc: CDP synthesizes browser touch input
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      substr: Input.dispatchTouchEvent

  - id: cdp-method-input-insert-text
    desc: CDP types text into the browser
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      substr: Input.insertText

  - id: cdp-method-page-start-screencast
    desc: CDP streams rendered browser frames
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      substr: Page.startScreencast

  - id: cdp-method-page-screencast-frame-ack
    desc: CDP acknowledges a streamed frame
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      substr: Page.screencastFrameAck

  - id: cdp-method-target-create-target
    desc: CDP opens a browser tab
    crit: notable
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      substr: Target.createTarget

  - id: playwright-connect-over-cdp
    desc: Playwright connects to a browser over CDP
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: call
      substr: connect_over_cdp

  - id: cdp-execution-context-event
    desc: "CDP executionContextCreated event tracking"
    crit: component
    conf: 0.82
    if:
      type: text
      substr: Runtime.executionContextCreated
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

composite_rules:
  # Synthetic user input driven into a browser over CDP, in any of the four
  # spellings. Neutral on its own — this is how puppeteer/playwright type into
  # a form — so the objective composites add the intent-bearing context.
  - id: cdp-input-event-injection
    desc: CDP injects synthetic browser input
    crit: notable
    conf: 0.92
    for: [scripts, source]
    any:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-dispatch-key-event
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-dispatch-mouse-event
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-dispatch-touch-event
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-insert-text

  - id: cdp-protocol-surface
    desc: Chrome DevTools Protocol surface
    crit: notable
    conf: 0.9
    # Two distinct CDP surfaces identify an implementation, but do not by
    # themselves distinguish a client from a server.
    # `id:` directory reference covers every atom in this leaf — see
    # `reuse/many-dir-refs` policy.
    any:
      - id: micro-behaviors/communications/http/devtools/client::cdp-debugger-url-key
      - id: micro-behaviors/communications/http/devtools/client::cdp-execution-context-event
      - id: micro-behaviors/communications/http/devtools/client::cdp-http-json-list
      - id: micro-behaviors/communications/http/devtools/client::cdp-http-json-protocol
      - id: micro-behaviors/communications/http/devtools/client::cdp-http-json-version
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-emulation-timezone-override
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-navigate
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-add-script
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-user-agent-override
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-performance-disable
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-cookies
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-all-cookies
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-set-cookies
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-enable
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
    needs: 2
