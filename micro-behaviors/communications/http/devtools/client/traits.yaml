defaults:
  crit: notable
  for:
  - binaries
  - scripts
  - source
  - -jcl
  - -batch
  - -vbs
  - -beam
  - -pyc
  - -class
  - -staticlib
  - -wasm
  platforms:
  - windows
  - unix
  attack: T1106
traits:
- id: cdp-debugger-url-key
  desc: Chrome DevTools webSocketDebuggerUrl JSON key
  conf: 0.92
  if:
    type: text
    substr: webSocketDebuggerUrl
- id: cdp-http-json-version
  desc: CDP /json/version discovery endpoint
  conf: 0.88
  if:
    type: text
    substr: /json/version
- id: cdp-http-json-list
  desc: CDP /json/list HTTP discovery endpoint
  conf: 0.88
  if:
    type: text
    substr: /json/list
- id: cdp-http-json-protocol
  desc: CDP /json/protocol schema endpoint
  conf: 0.85
  if:
    type: text
    substr: /json/protocol
- id: cdp-http-json-tab-control
  desc: CDP HTTP endpoint opens or closes tabs
  conf: 0.9
  if:
    type: text
    regex: /json/(new|activate|close)\b
- id: cdp-default-debug-port-url
  desc: URL targets the default CDP debug port
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(https?|wss?)://(localhost|127\.0\.0\.1|\[::1\]):9222\b
- id: cdp-loopback-endpoint
  desc: Loopback CDP WebSocket endpoint
  conf: 0.94
  if:
    type: text
    regex: (?i)\b(ws|wss)://(localhost|127\.0\.0\.1):[0-9]{2,5}/devtools/
- id: cdp-method-runtime-evaluate
  desc: CDP Runtime.evaluate method token
  conf: 0.9
  if:
    type: text
    regex: \bRuntime\.evaluate\b
- id: cdp-method-runtime-add-binding
  desc: CDP registers browser-to-client binding
  conf: 0.94
  if:
    type: text
    substr: Runtime.addBinding
- id: cdp-method-page-bypass-csp
  desc: CDP disables browser content security policy
  conf: 0.94
  if:
    type: text
    substr: Page.setBypassCSP
- id: cdp-method-storage-get-cookies
  desc: CDP Storage domain whole-cookie-jar read
  conf: 0.94
  if:
    type: text
    substr: Storage.getCookies
- id: cdp-method-network-get-cookies
  desc: CDP scoped cookie retrieval method
  conf: 0.94
  if:
    type: text
    substr: Network.getCookies
- id: cdp-method-network-get-all-cookies
  desc: CDP whole-cookie-jar retrieval method
  conf: 0.94
  if:
    type: text
    substr: Network.getAllCookies
- id: cdp-method-network-set-cookies
  desc: CDP bulk cookie-write method
  conf: 0.94
  if:
    type: text
    substr: Network.setCookies
- id: cdp-get-all-cookies-native-bytes
  desc: CDP whole-cookie method bytes
  conf: 0.96
  for:
  - elf
  - macho
  - pe
  - dll
  if:
    type: hex
    offset_range:
    - 0
    - 16777216
    pattern: 4E 65 74 77 6F 72 6B 2E 67 65 74 41 6C 6C 43 6F 6F 6B 69 65 73
- id: cdp-start-screencast-native-bytes
  desc: CDP screencast method bytes
  conf: 0.94
  for:
  - elf
  - macho
  - pe
  - dll
  if:
    type: hex
    offset_range:
    - 0
    - 16777216
    pattern: 50 61 67 65 2E 73 74 61 72 74 53 63 72 65 65 6E 63 61 73 74
- id: cdp-input-dispatch-native-bytes
  desc: CDP input-dispatch method bytes
  conf: 0.92
  for:
  - elf
  - macho
  - pe
  - dll
  if:
    type: hex
    offset_range:
    - 0
    - 16777216
    pattern: 49 6E 70 75 74 2E 64 69 73 70 61 74 63 68
- id: cdp-method-runtime-enable
  desc: CDP Runtime.enable method
  conf: 0.75
  if:
    type: text
    substr: Runtime.enable
- id: cdp-method-page-navigate
  desc: CDP Page.navigate method
  conf: 0.78
  if:
    type: text
    substr: Page.navigate
- id: cdp-method-network-user-agent-override
  desc: CDP browser User-Agent override method
  conf: 0.9
  if:
    type: text
    substr: Network.setUserAgentOverride
- id: cdp-method-emulation-timezone-override
  desc: CDP browser timezone override method
  conf: 0.9
  if:
    type: text
    substr: Emulation.setTimezoneOverride
- id: cdp-method-performance-disable
  desc: CDP browser performance disable method
  conf: 0.9
  if:
    type: text
    substr: Performance.disable
- id: cdp-method-page-add-script
  desc: CDP injects script on new documents
  conf: 0.92
  if:
    type: text
    substr: Page.addScriptToEvaluateOnNewDocument
- id: cdp-method-fetch-enable
  desc: CDP enables fetch request interception
  conf: 0.92
  for:
  - scripts
  - source
  if:
    type: text
    substr: Fetch.enable
- id: cdp-method-fetch-fulfill-request
  desc: CDP fulfills an intercepted fetch request
  conf: 0.94
  for:
  - scripts
  - source
  if:
    type: text
    substr: Fetch.fulfillRequest
- id: cdp-protocol-command-parameters-type-map
  desc: CDP commands mapped to Parameters types
  conf: 0.96
  count_min: 12
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '["''][A-Za-z]{2,20}\.[A-Za-z]{2,40}["'']:\s*[\w.]{1,60}Parameters'
- id: cdp-protocol-command-params-type-map
  desc: CDP commands mapped to paramsType entries
  conf: 0.96
  count_min: 12
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '["''][A-Za-z]{2,20}\.[A-Za-z]{2,40}["'']:\s*\{\s*paramsType\s*:'
- id: cdp-method-input-dispatch-key-event
  desc: CDP synthesizes browser keyboard input
  conf: 0.92
  for:
  - scripts
  - source
  if:
    type: text
    substr: Input.dispatchKeyEvent
- id: cdp-method-input-dispatch-mouse-event
  desc: CDP synthesizes browser mouse input
  conf: 0.92
  for:
  - scripts
  - source
  if:
    type: text
    substr: Input.dispatchMouseEvent
- id: cdp-method-input-dispatch-touch-event
  desc: CDP synthesizes browser touch input
  conf: 0.92
  for:
  - scripts
  - source
  if:
    type: text
    substr: Input.dispatchTouchEvent
- id: cdp-method-input-insert-text
  desc: CDP types text into the browser
  conf: 0.92
  for:
  - scripts
  - source
  if:
    type: text
    substr: Input.insertText
- id: cdp-method-page-start-screencast
  desc: CDP streams rendered browser frames
  conf: 0.94
  for:
  - scripts
  - source
  if:
    type: text
    substr: Page.startScreencast
- id: cdp-method-page-screencast-frame-ack
  desc: CDP acknowledges a streamed frame
  conf: 0.92
  for:
  - scripts
  - source
  if:
    type: text
    substr: Page.screencastFrameAck
- id: cdp-method-target-create-target
  desc: CDP opens a browser tab
  conf: 0.85
  for:
  - scripts
  - source
  if:
    type: text
    substr: Target.createTarget
- id: playwright-connect-over-cdp
  desc: Playwright connects to a browser over CDP
  conf: 0.94
  for:
  - python
  if:
    type: symbol
    kind: call
    substr: connect_over_cdp
- id: cdp-execution-context-event
  desc: CDP executionContextCreated event tracking
  conf: 0.82
  if:
    type: text
    substr: Runtime.executionContextCreated
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
composite_rules:
- id: cdp-protocol-command-parameter-map
  desc: CDP protocol command parameter map
  conf: 0.96
  for:
  - javascript
  - typescript
  any:
  - id: cdp-protocol-command-parameters-type-map
  - id: cdp-protocol-command-params-type-map
- id: cdp-http-discovery-surface
  desc: CDP discovery key and endpoints co-occur
  conf: 0.92
  all:
  - id: cdp-debugger-url-key
  any:
  - id: cdp-default-debug-port-url
  - id: cdp-http-json-tab-control
  - id: cdp-http-json-list
  - id: cdp-http-json-version
  - id: cdp-loopback-endpoint
- id: cdp-pre-document-script-automation
  desc: CDP installs evaluated scripts before page load
  conf: 0.98
  for:
  - pe
  - dll
  - csharp
  - go
  - javascript
  - typescript
  - python
  all:
  - id: micro-behaviors/process/create/flags::chromium-remote-debugging-port
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-add-script
- id: cdp-screencast-input-native-cluster
  desc: Native CDP screencast/input cluster
  conf: 0.94
  for:
  - elf
  - macho
  - pe
  - dll
  all:
  - id: cdp-start-screencast-native-bytes
  - id: cdp-input-dispatch-native-bytes
  near_bytes: 32768
- id: cdp-cookie-control-native-cluster
  desc: Native CDP cookie/control cluster
  conf: 0.95
  for:
  - elf
  - macho
  - pe
  - dll
  all:
  - id: cdp-get-all-cookies-native-bytes
  - id: cdp-start-screencast-native-bytes
  near_bytes: 32768
- id: cdp-input-event-injection
  desc: CDP injects synthetic browser input
  conf: 0.92
  for:
  - scripts
  - source
  any:
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-dispatch-key-event
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-dispatch-mouse-event
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-dispatch-touch-event
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-input-insert-text
- id: cdp-protocol-surface
  desc: Chrome DevTools Protocol surface
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/devtools/client::cdp-debugger-url-key
  - id: micro-behaviors/communications/http/devtools/client::cdp-execution-context-event
  - id: micro-behaviors/communications/http/devtools/client::cdp-http-json-list
  - id: micro-behaviors/communications/http/devtools/client::cdp-http-json-protocol
  - id: micro-behaviors/communications/http/devtools/client::cdp-http-json-version
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-emulation-timezone-override
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-navigate
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-add-script
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-user-agent-override
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-performance-disable
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-cookies
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-all-cookies
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-set-cookies
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-enable
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
  needs: 2
