defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - source
composite_rules:
- id: cdp-fetch-interception-csp-bypass
  desc: CDP response interception with CSP bypass and script evaluation
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-fetch-enable
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-fetch-fulfill-request
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-bypass-csp
  any:
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-add-script
  - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
