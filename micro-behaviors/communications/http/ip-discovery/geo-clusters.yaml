# Service references occur in callers, blocklists and ranking tables alike.
# Preserve the original populations, exclusions and proximity constraint;
# neither multiple providers nor their proximity establishes API calls or
# analysis-targeted gating. The geofencing consumer supplies region context.
defaults:
  platforms: [windows, linux, macos]
  for: [scripts, binaries, source]
  crit: notable

composite_rules:
  - id: ip-api-ipwho-ipinfo-cluster
    desc: Multiple ip-api/ipwho/ipinfo service references
    conf: 0.9
    needs: 2
    any:
      - id: ip-api-com
      - id: ipwho-is
      - id: ipinfo-io
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
      - id: well-known/app/publishing/wordpress::php-wordpress-geoip-api-list
      - id: well-known/app/publishing/wordpress::wordpress-plugin-geolocation-lookup
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: ipapi-geoplugin-pair
    desc: ipapi.co and geoplugin.net service references
    conf: 0.9
    all:
      - id: ipapi-co
      - id: geoplugin-net
  - id: multi-public-geo-api-references
    desc: Multiple public geolocation service references
    conf: 0.94
    near_bytes: 2000
    all:
      - id: ip-api-ipwho-ipinfo-cluster
      - id: ipapi-geoplugin-pair
