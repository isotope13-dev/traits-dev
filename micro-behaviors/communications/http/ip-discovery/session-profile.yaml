defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

composite_rules:
  # These observations do not require a region denylist or credentials.
  # Keep geography helpers separate from geofencing and phishing intent.
  - id: geo-cookie-url-helpers
    desc: Geolocation cookie and URL helpers co-occur
    all:
      - id: micro-behaviors/communications/http/cookie-store::client-geo-cookie-helper-reference
      - id: micro-behaviors/communications/http/url/construction::append-client-geo-url-function
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction

  - id: geo-helper-country-code-fetch
    desc: Geolocation helper and country-code fetch co-occur
    all:
      - id: geo-provider-helper-definition
      - id: micro-behaviors/data/serialize/schema-object::country-code-snake
      - id: micro-behaviors/communications/http/request/computed::js-fetch-computed-helper-argument

  - id: geo-cookie-php-json-post
    desc: Geolocation cookie helpers accompany PHP JSON POST
    all:
      - id: multi-ip-discovery
      - id: micro-behaviors/communications/http/cookie-store::client-geo-cookie-helper-reference
      - id: micro-behaviors/communications/http/post::fetch-flow-json-post-body
      - id: micro-behaviors/communications/http/url/php-endpoint::php-endpoints-directory-script
