defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, pe, elf, rust]
traits:
  - id: api-db-ip
    desc: api.db-ip.com endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: api.db-ip.com
  - id: db-ip-v2
    desc: db-ip.com/v2 endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: db-ip.com/v2
  # A bare public geo-API host reference is a dual-use capability marker (weather
  # widgets, CDNs, VPNs showing your location, and privacy blocklists all name
  # these hosts). Kept notable, consistent with the maxmind/ipify/freegeoip-generic
  # siblings; the `ip-geolocation-lookup` composite (endpoint + response-field parsing)
  # carries the actual host-profiling intent.
  - id: ipgeolocation-api
    desc: ipgeolocation.io API
    crit: notable
    conf: 0.85
    for: [python, javascript, powershell]
    if:
      type: text
      substr: ipgeolocation.io
  - id: geoip-maxmind
    desc: geoip.maxmind.com endpoint
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: geoip.maxmind.com
  - id: maxmind-geoip
    desc: maxmind.com/geoip endpoint
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: maxmind.com/geoip
  - id: freegeoip-app
    desc: freegeoip.app geolocation endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: freegeoip.app
    unless:
      - id: metadata/build/recognized-contexts/
  - id: freegeoip-net
    desc: freegeoip.net geolocation endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: freegeoip.net
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: freegeoip-io
    desc: freegeoip.io geolocation endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: freegeoip.io
  # ip-address-camel / ip-json-field relocated to
  # micro-behaviors/communications/ip/parse (neutral IP-data field references);
  # a bare ipAddress/"ip": field is not geo profiling. Referenced cross-directory
  # by the ip-address-field composite below.
  - id: freegeoip-generic
    desc: freegeoip geolocation service name, any domain
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: freegeoip
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: ip-api-response-field-cluster
    desc: Cluster of Rust IP geolocation fields
    crit: notable
    conf: 0.82
    for: [rust]
    if:
      type: text
      regex: '"query".{0,120}"city".{0,120}"country".{0,120}"regionName"'
composite_rules:
  - id: db-ip-api
    desc: db-ip.com geolocation API
    crit: notable
    conf: 0.85
    any:
      - id: api-db-ip
      - id: db-ip-v2
  - id: maxmind-api
    desc: MaxMind GeoIP API
    crit: notable
    conf: 0.7
    any:
      - id: geoip-maxmind
      - id: maxmind-geoip
      - id: micro-behaviors/communications/http/ip-discovery::maxmind-locate-my-ip
  - id: freegeoip-api
    desc: freegeoip geolocation service endpoint
    crit: notable
    conf: 0.85
    any:
      - id: freegeoip-app
      - id: freegeoip-net
      - id: freegeoip-io
  - id: country-code-field
    desc: Country code geolocation field
    crit: component
    conf: 0.6
    any:
      - id: micro-behaviors/data/serialize/schema-object::country-code-camel
      - id: micro-behaviors/data/serialize/schema-object::country-code-snake
  - id: ip-address-field
    desc: IP address data field
    crit: component
    conf: 0.5
    any:
      - id: micro-behaviors/communications/ip/parse::ip-address-camel
      - id: micro-behaviors/communications/ip/parse::ip-json-field
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: geo-api
    desc: Geolocation API endpoint
    crit: notable
    conf: 0.7
    any:
      - id: db-ip-api
      - id: micro-behaviors/communications/http/ip-discovery::ipinfo-io
      - id: micro-behaviors/communications/http/ip-discovery::ip-api-com
      - id: micro-behaviors/communications/http/ip-discovery::ipapi-co
      - id: ipgeolocation-api
      - id: freegeoip-api
      - id: freegeoip-generic
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: geo-response-field
    desc: Geo endpoint with response-field vocabulary
    crit: notable
    conf: 0.5
    all:
      - id: geo-api
    any:
      - id: country-code-field
      - id: micro-behaviors/data/serialize/schema-object::country-name
      - id: ip-address-field
      - id: micro-behaviors/data/serialize/schema-object::city-field-key
      - id: micro-behaviors/data/serialize/schema-object::region-field-key
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: geo-endpoint-with-fields
    desc: Geo endpoint and response fields co-occur
    crit: notable
    conf: 0.85
    all:
      - id: geo-api
    any:
      - id: geo-response-field
      - id: ip-api-response-field-cluster
    unless:
      # Bingo geolocates the operator's public egress IP to build pentest
      # session context; this is not victim profiling.
      - id: well-known/tool/offensive/bingo::bingo-terminal-context
      # Lighthouse ships an ad/URL catalog containing geo service names; it
      # does not perform an IP lookup on the host.
      - id: well-known/lib/platform/browser-automation/automation-context::chrome-devtools-ad-catalog-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
