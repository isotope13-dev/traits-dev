defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: npm-public-ip-profiling
    desc: NPM package resolves public IP and geolocation
    crit: suspicious
    conf: 0.97
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ip/resolve::public-ip-module-ref
      - id: micro-behaviors/communications/ip/resolve::public-ipv4-lookup-call
      - id: metadata/lang/source/literal/fragment/url::ipapi-prefix-fragment
      - id: metadata/lang/source/literal/fragment/url::ipapi-domain-fragment
      - id: micro-behaviors/communications/url/resource-path/content::json-route-path
