# Browser client-hint and fetch-metadata names are protocol fields, not prose.
# Keep the profile together so DDoS objectives can require several categories.
defaults:
  platforms: [unix, windows, android]
  for: [source]
  crit: notable
  conf: 0.88
  attack: T1071.001

traits:
  - id: browser-client-hint-header
    desc: Browser Sec-CH client-hint header
    if:
      type: string_literal
      regex: '(?i)^sec-ch-ua(-mobile|-platform)?$'

  - id: browser-fetch-metadata-header
    desc: Browser Sec-Fetch metadata header
    if:
      type: string_literal
      regex: '(?i)^sec-fetch-(site|mode|user|dest)$'

  - id: browser-user-agent-string
    desc: Hardcoded browser User-Agent string
    if:
      type: string_literal
      regex: '(?i)^Mozilla/5\.0 \('

  - id: browser-priority-u0-header
    desc: Browser Priority u=0 request value
    if:
      type: string_literal
      regex: '^u=0,\s*i$'

  # Native traffic generators often carry a rotation pool rather than one
  # identification string. This remains a neutral fingerprint until an
  # objective supplies bot/flood context.
  - id: native-browser-user-agent-pool
    desc: Native browser User-Agent rotation pool
    crit: notable
    conf: 0.97
    for: [elf, pe, macho]
    count_min: 8
    if:
      type: text
      regex: '^Mozilla/5\.0 \(.{10,100}\) AppleWebKit/[0-9.]+ \('

  - id: synthetic-browser-tracking-cookie
    desc: Synthetic browser tracking cookie template
    crit: notable
    conf: 0.98
    for: [elf, pe, macho]
    if:
      type: text
      exact: 'SESSIONID=%d; TRACKING=%d; PREF=hl=en'

  - id: browser-navigation-destination-header
    desc: Browser document navigation destination header
    crit: component
    conf: 0.96
    for: [elf, pe, macho]
    if:
      type: text
      exact: 'Sec-Fetch-Dest: document'

  - id: browser-navigation-mode-header
    desc: Browser navigation mode header
    crit: component
    conf: 0.96
    for: [elf, pe, macho]
    if:
      type: text
      exact: 'Sec-Fetch-Mode: navigate'

  - id: browser-navigation-site-header
    desc: Browser navigation origin header
    crit: component
    conf: 0.96
    for: [elf, pe, macho]
    if:
      type: text
      exact: 'Sec-Fetch-Site: none'

  - id: browser-insecure-upgrade-header
    desc: Browser insecure-request upgrade header
    crit: component
    conf: 0.96
    for: [elf, pe, macho]
    if:
      type: text
      exact: 'Upgrade-Insecure-Requests: 1'

composite_rules:
  - id: browser-fingerprint-header-set
    desc: Browser client-hint and fetch header set
    conf: 0.94
    near_bytes: 1024
    all:
      - id: browser-client-hint-header
      - id: browser-fetch-metadata-header
      - id: browser-user-agent-string

  - id: native-browser-navigation-header-set
    desc: Native binary emulates browser navigation request headers
    crit: notable
    conf: 0.97
    for: [elf, pe, macho]
    all:
      - id: browser-navigation-destination-header
      - id: browser-navigation-mode-header
      - id: browser-navigation-site-header
      - id: browser-insecure-upgrade-header
