defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-ip-user-agent-md5
    desc: MD5 fingerprint of client IP and User-Agent
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: php
      query: |
        ((function_call_expression
          function: (name) @hash
          arguments: (arguments . (argument
            (binary_expression
              left: (function_call_expression
                function: (name) @get_left
                arguments: (arguments . (argument [
                  (string (string_content) @left)
                  (encapsed_string (string_content) @left)]) .))
              operator: "."
              right: (function_call_expression
                function: (name) @get_right
                arguments: (arguments . (argument [
                  (string (string_content) @right)
                  (encapsed_string (string_content) @right)]) .)))) .))
          (#match? @hash "(?i)^md5$")
          (#match? @get_left "(?i)^getenv$")
          (#match? @get_right "(?i)^getenv$")
          (#match? @left "^(REMOTE_ADDR|HTTP_USER_AGENT)$")
          (#match? @right "^(REMOTE_ADDR|HTTP_USER_AGENT)$")
          (#not-eq? @left @right))
