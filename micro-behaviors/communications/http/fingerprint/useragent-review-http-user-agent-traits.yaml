defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.7

traits:
  - id: navigator-useragent-substring-branch
    desc: Branches on a browser User-Agent substring
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bif\s*\(\s*navigator\.userAgent\.(includes|indexOf)\s*\('
  - id: navigator-useragent-match-branch
    desc: Branches on a User-Agent regular expression
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bif\s*\(\s*navigator\.userAgent\.match\s*\('
  - id: navigator-useragent-regex-test-branch
    desc: Tests browser User-Agent with a regex
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '/[^/\r\n]{1,48}/[gimuy]*\.test\s*\(\s*navigator\.userAgent'
  - id: apple-user-agent-branch
    desc: Tests iPhone or iPad in browser User-Agent
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, php, html]
    platforms: [android, unix, windows]
    if:
      type: text
      regex: '\bif[^\n]{0,40}userAgent\.(match|includes|indexOf)\(.{0,24}iP(hone|ad)'

