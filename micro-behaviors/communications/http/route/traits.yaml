# The routing table of a running HTTP front end, and the surfaces used to
# change it while it is serving. NGINX Unit keeps its live configuration in
# /var/lib/unit/conf.json and accepts replacements over a local control socket,
# so a program that touches either is reconfiguring a live listener rather than
# shipping a static config. The route actions here — proxy to loopback, rewrite
# to a server-side page, match on an authentication URI — are the individual
# pieces such a routing rule is built from.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85

traits:
  - id: unit-runtime-config-file
    desc: NGINX Unit live configuration file
    conf: 0.9
    if:
      type: text
      substr: /var/lib/unit/conf.json

  - id: unit-control-socket
    desc: NGINX Unit control socket path
    conf: 0.9
    if:
      type: text
      regex: 'control\.unit\.sock'

  - id: http-route-loopback-proxy-action
    desc: Route action proxies to loopback
    conf: 0.86
    if:
      type: text
      regex: '"proxy"\s*:\s*"https?://(127\.0\.0\.1|localhost|\[::1\])'

  - id: http-route-server-page-rewrite
    desc: Route action rewrites to server page
    conf: 0.86
    if:
      type: text
      regex: '"rewrite"\s*:\s*"/[^"]{0,64}\.(jspx?|php|aspx)"'

  - id: http-route-auth-uri-match
    desc: Route matches an authentication URI
    conf: 0.8
    if:
      type: text
      regex: '"uri"\s*:\s*"/[^"]{0,48}(login|logout|signin|auth)'

composite_rules:
  - id: unit-live-config-surface
    desc: NGINX Unit live configuration surface
    crit: notable
    conf: 0.9
    any:
      - id: unit-runtime-config-file
      - id: unit-control-socket
