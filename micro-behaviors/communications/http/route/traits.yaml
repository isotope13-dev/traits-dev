# The routing table of a running HTTP front end, and the surfaces used to
# change it while it is serving. NGINX Unit keeps its live configuration in
# /var/lib/unit/conf.json and accepts replacements over a local control socket,
# so a program that touches either is reconfiguring a live listener rather than
# shipping a static config. The route actions here — proxy to loopback, rewrite
# to a server-side page, match on an authentication URI — are the individual
# pieces such a routing rule is built from.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85

traits:
  - id: api-attach-route
    desc: HTTP API attach route literal
    crit: component
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      exact: /api/attach

  - id: api-request-route
    desc: HTTP API request route literal
    crit: component
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      exact: /api/req

  - id: api-response-route
    desc: HTTP API response route literal
    crit: component
    conf: 0.92
    platforms: [linux, macos, windows]
    for: [elf, macho, pe]
    if:
      type: text
      exact: /api/req/res

  # Numbered subdomains are the stable router marker described in the
  # FakeCaptcha campaign. Match the URL shape, not a campaign domain, so
  # rotated buyer/lure infrastructure remains visible.
  - id: numbered-traffic-router-url
    desc: Numbered traffic-router hostname in URL
    crit: notable
    conf: 0.96
    platforms: [windows, unix]
    for: [source, data, html]
    if:
      type: text
      regex: '(?i)\bhttps?://ww[0-9]{2}\.[a-z0-9.-]{3,253}([/?#]|$)'

  - id: numbered-router-search-term-parameter
    desc: Numbered traffic router carries search term
    crit: notable
    conf: 0.96
    platforms: [windows, unix]
    for: [source, data, html]
    if:
      type: text
      regex: '(?i)\bww[0-9]{2}\.[a-z0-9.-]{3,80}/[^\s<>"'']{0,80}(\?|&|&amp;)utm_term='

  - id: pdf-numbered-traffic-router-url
    desc: PDF action uses numbered TDS hostname
    crit: notable
    conf: 0.96
    for: [pdf]
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)^https?://ww[0-9]{2}\.[a-z0-9.-]{3,253}[/#?]'

  - id: pdf-numbered-router-search-term-parameter
    desc: PDF TDS action carries search term
    crit: notable
    conf: 0.96
    for: [pdf]
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)^https?://ww[0-9]{2}\.[a-z0-9.-]{3,80}/[^?]{0,80}[?&]utm_term='

  - id: unit-runtime-config-file
    desc: NGINX Unit live configuration file
    conf: 0.9
    if:
      type: text
      substr: /var/lib/unit/conf.json

  - id: unit-control-socket
    desc: NGINX Unit control socket path
    conf: 0.9
    if:
      type: text
      regex: 'control\.unit\.sock'

  - id: http-route-loopback-proxy-action
    desc: Route action proxies to loopback
    conf: 0.86
    if:
      type: text
      regex: '"proxy"\s*:\s*"https?://(127\.0\.0\.1|localhost|\[::1\])'

  - id: http-route-server-page-rewrite
    desc: Route action rewrites to server page
    conf: 0.86
    if:
      type: text
      regex: '"rewrite"\s*:\s*"/[^"]{0,64}\.(jspx?|php|aspx)"'

  - id: http-route-auth-uri-match
    desc: Route matches an authentication URI
    conf: 0.8
    if:
      type: text
      regex: '"uri"\s*:\s*"/[^"]{0,48}(login|logout|signin|auth)'

composite_rules:
  - id: unit-live-config-surface
    desc: NGINX Unit live configuration surface
    crit: notable
    conf: 0.9
    any:
      - id: unit-runtime-config-file
      - id: unit-control-socket
