# Original matchers and effective scopes are retained.
traits:
- platforms:
  - windows
  for:
  - c
  - cpp
  id: location-or-raw-header-query-text
  desc: Location or raw HTTP header query text
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: (?i)\b(Location:|HTTP_QUERY_LOCATION|HTTP_QUERY_RAW_HEADERS_CRLF)\b
  unless:
  - id: metadata/file/profile/source-indications/
