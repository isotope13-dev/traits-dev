defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, php, ruby, java]

traits:
  - id: http-redirect-helper-call
    desc: Calls HTTP response redirect method
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(?i)^(res|response|reply|ctx)\.redirect$'
