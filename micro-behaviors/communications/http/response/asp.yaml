defaults:
  platforms: [windows]
  for: [asp, vbs]
  crit: notable
  conf: 0.9
traits:
  - id: asp-404-status-response
    desc: ASP sets a 404 response status
    if:
      type: text
      regex: '(?i)response.Status *= *"404[^"]{0,24}"'

  - id: asp-binary-write-statement
    desc: Classic ASP writes a binary response
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*Response[.]BinaryWrite[ \t]+\S'

  - id: asp-response-write
    desc: ASP writes text through Response.Write
    conf: 0.94
    for: [csharp, asp, html]
    if:
      type: text
      substr: Response.Write
