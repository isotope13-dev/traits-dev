defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
  crit: notable

traits:
  - id: x86-signed-suffix-404-response
    desc: Native .signed suffix returns HTTP 404
    conf: 0.99
    if:
      # Resolve the instruction's VA through the PE section table. A spare
      # .signed string plus an unrelated 404 handler does not satisfy this.
      type: yara
      source: |
        import "pe"
        rule x86_signed_suffix_404_response {
          strings:
            $suffix = ".signed\x00" ascii
            $notfound = "Not Found\x00" ascii
            // Alternate MinGW string ABI: lengths stored before string data,
            // two stack pops after construction, and a dword boolean spill.
            $reject_cow = {
              C7 04 24 ?? ?? ?? ?? E8 ?? ?? ?? ??
              8B 95 ?? ?? ?? ?? 8B 85 ?? ?? ?? ?? 56 56
              8B 4A F4 31 D2 8B 40 F4 8D B5 ?? ?? ?? ?? 39 C8 77 ??
              29 C1 89 0C 24 89 F1 89 7C 24 08 89 44 24 04
              E8 ?? ?? ?? ?? 83 EC 0C 85 C0 0F 94 C2
              8D 8D ?? ?? ?? ?? 89 95 ?? ?? ?? ?? E8 ?? ?? ?? ??
              8B 95 ?? ?? ?? ?? 84 D2 0F 84 ?? ?? ?? ??
              B9 ?? ?? ?? ?? BA 94 01 00 00 89 D8 E8 ?? ?? ?? ??
            }
            $reject = {
              C7 04 24 ?? ?? ?? ??
              8D BD ?? ?? ?? ?? 8D B5 ?? ?? ?? ?? 89 F9 E8 ?? ?? ?? ??
              8B 8D ?? ?? ?? ?? 31 D2 50 8B 85 ?? ?? ?? ?? 39 C1 77 ??
              29 C8 89 4C 24 04 89 F1 89 7C 24 08 89 04 24 E8 ?? ?? ?? ??
              83 EC 0C 85 C0 0F 94 C2 8D 8D ?? ?? ?? ??
              88 95 ?? ?? ?? ?? E8 ?? ?? ?? ?? 8A 95 ?? ?? ?? ??
              84 D2 0F 84 ?? ?? ?? ?? B9 ?? ?? ?? ?? BA 94 01 00 00
              89 D8 E8 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            (for any c in (1..#reject) : (
              for any s in (1..#suffix) : (
                pe.rva_to_offset(uint32(@reject[c]+3)-pe.image_base) == @suffix[s]
              )
            ) or for any c in (1..#reject_cow) : (
              for any s in (1..#suffix) : (
                pe.rva_to_offset(uint32(@reject_cow[c]+3)-pe.image_base) == @suffix[s]
              ) and for any n in (1..#notfound) : (
                pe.rva_to_offset(uint32(@reject_cow[c]+104)-pe.image_base) == @notfound[n]
              )
            ))
        }
