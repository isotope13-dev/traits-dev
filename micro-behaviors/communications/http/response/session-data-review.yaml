traits:
- id: python-forbidden-status-argument
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Python source specifies HTTP status 403
  conf: 0.85
  if:
    type: text
    regex: status\s*=\s*(status|drf_status)\.HTTP_403_FORBIDDEN|status\s*=\s*403
composite_rules:
- id: drf-authorization-response
  desc: Django REST response import and HTTP 403 status co-occur
  conf: 0.9
  all:
  - id: metadata/import/package::python-drf-response-import
  - id: micro-behaviors/communications/http/response::python-forbidden-status-argument
defaults:
  for:
  - python
  platforms:
  - windows
  - unix
  crit: notable
