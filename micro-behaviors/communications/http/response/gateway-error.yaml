# HTTP response vocabulary. These strings may describe errors in an SDK or
# client; neither their presence nor their pair proves a proxy implementation.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.9

traits:
  - id: bad-gateway-response-text
    desc: HTTP Bad Gateway response text
    if:
      type: text
      substr: Bad Gateway
  - id: service-unavailable-response-text
    desc: HTTP Service Unavailable response text
    if:
      type: text
      substr: Service Unavailable

