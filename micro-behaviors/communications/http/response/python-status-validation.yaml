# Response validation is independent of the Python HTTP-client backend.
# Preserve the call matcher and scope formerly under http/lib/requests.
defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [python]
traits:
  - id: raise-for-status
    desc: Calls raise_for_status response validation
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '\.raise_for_status$'

  - id: http-json-code-field-read
    desc: Reads code field from HTTP JSON response
    conf: 0.93
    if:
      type: text
      regex: >-
        \b\w+\s*=\s*\w+\.json\(\)[\s\S]{0,120}\.get\(["']code["']
