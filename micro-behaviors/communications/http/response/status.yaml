defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

traits:
  - id: response-success-field
    desc: JSON response success field
    crit: component
    conf: 0.86
    platforms: [unix, windows]
    for: [json, javascript, typescript, python, go, rust, java, shell, powershell, source]
    if:
      type: text
      regex: '(?i)["''](status|success|ok)["'']\s*:\s*(2\d\d|true)\b'

  - id: native-status-field-pair
    desc: Native service status field pair
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'status=active.{0,160}service_target=|service_target=.{0,160}status=active'

  # Protocol-level status lines also occur in hand-built proxy responses, so
  # keep these independent of any one web framework or language.
  - id: http-204-protocol-status
    desc: HTTP 204 No Content status line
    crit: notable
    conf: 0.9
    for: [python, shell, source, text]
    if:
      type: text
      regex: '(?i)HTTP/1\.[01]\s+204\s+No\s+Content'

  - id: http-204-framework-status
    desc: Framework emits HTTP status 204
    crit: notable
    conf: 0.9
    for: [python, shell, source, text]
    if:
      type: text
      regex: '(?i)\b(send_response|writeHead|http_response_code|status)\s*\(\s*204\b'

  - id: http-204-nginx-return
    desc: Nginx returns HTTP status 204
    crit: notable
    conf: 0.9
    for: [shell, text]
    if:
      type: text
      regex: '(?i)\breturn\s+204\s*;'

  - id: http-307-protocol-status
    desc: HTTP 307 Temporary Redirect status line
    crit: notable
    conf: 0.9
    for: [python, shell, source, text]
    if:
      type: text
      regex: '(?i)HTTP/1\.[01]\s+307\s+Temporary\s+Redirect'

  - id: http-307-framework-status
    desc: Framework emits HTTP status 307
    crit: notable
    conf: 0.9
    for: [python, shell, source, text]
    if:
      type: text
      regex: '(?i)\b(send_response|writeHead|http_response_code|status)\s*\(\s*307\b'

  - id: http-external-location-header
    desc: Emits external HTTP Location header
    crit: notable
    conf: 0.88
    for: [python, shell, source, text]
    if:
      type: string_literal
      regex: '(?i)^Location:\s*https?://'

  - id: python-location-header-call
    desc: Python emits an HTTP Location response header
    crit: notable
    conf: 0.92
    platforms: [unix, windows]
    for: [python]
    if:
      type: text
      regex: '(?i)\bsend_header\s*\(\s*["'']Location["'']\s*,'

  - id: via-middlebox-response-header
    desc: Emits an HTTP Via middlebox header
    crit: notable
    conf: 0.92
    for: [python, shell, source, text]
    if:
      type: string_literal
      regex: '(?i)^Via:\s*[0-9]+\.[0-9]+\s+middlebox'

composite_rules:
  - id: http-204-no-content-status
    desc: Emits an HTTP 204 response
    crit: notable
    conf: 0.9
    for: [python, shell, source, text]
    any:
      - id: http-204-protocol-status
      - id: http-204-framework-status
      - id: http-204-nginx-return

  - id: http-307-temporary-redirect-status
    desc: Emits an HTTP 307 redirect
    crit: notable
    conf: 0.9
    for: [python, shell, source, text]
    any:
      - id: http-307-protocol-status
      - id: http-307-framework-status
