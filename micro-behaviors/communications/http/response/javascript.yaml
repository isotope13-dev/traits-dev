defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: "C0002"
traits:
  - id: response-status-body-copy
    desc: Copies HTTP response status and text body
    crit: notable
    conf: 0.9
    for: [javascript, typescript, text]
    if:
      type: text
      regex: '\.status\s*=\s*\w+\.status.{0,120}\.data\s*=\s*await\s+\w+\.text\('

  - id: server-response-send-end
    desc: Calls server response send/end method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(res|response|resp)\.(send|end)$'

  - id: server-response-redirect
    desc: Calls server response redirect method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(res|response|resp)\.redirect$'

  - id: server-response-status
    desc: Calls server response status method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(res|response|resp)\.status$'

  - id: javascript-response-redirect-call
    desc: Calls JavaScript response redirect method
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(res|resp|response|reply)\.redirect$'

  - id: server-response-not-found-status
    desc: Server response emits HTTP 404 status
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(res|response|resp)\.status\s*\(\s*404\b'

  - id: node-response-data-event
    desc: Node response data event handler
    crit: notable
    conf: 0.88
    if:
      type: text
      # Any receiver identifier, not a fixed list of callback names: the
      # eslint-scope 2018 compromise named its response `r`, which a
      # `res|response|resp|r2` alternation misses outright.
      regex: '\b[A-Za-z_$][\w$]{0,24}\.on\s*\(\s*[''"]data[''"]'
  # Keep this distinct from the generic data-event atom: the response callback
  # must directly register the `data` handler, and that handler must convert
  # chunks to text. A nested arrow expression that is never registered must not
  # be described as an active stream.
  - id: node-http-get-data-handler
    desc: Node HTTP GET registers data handler directly
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'https?\.get\([^;]{0,120},\s*\(?res\)?\s*=>\s*\{?\s*res\.on\(\s*[''\"]data[''\"]'

  - id: node-response-end-event
    desc: Node response end event handler
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]{0,24}\.on\s*\(\s*[''"]end[''"]'

  - id: node-response-pipe
    desc: Pipes a Node HTTP response stream
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(response|res|reply)\.pipe\s*\('
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: http-response-data-eval
    desc: Evaluates an HTTP response body field directly
    crit: notable
    conf: 0.85
    attack: "T1059.007"
    if:
      type: text
      regex: 'eval\s*\(\s*(responseText|res(ponse)?\.(data|responseText)|data\.response)\b'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/web-frameworks/
      - id: well-known/lib/runtime/pyodide/
      - id: well-known/app/publishing/civicrm/
      - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
      - type: text
        substr: "setSettingsHtml"
      - type: text
        substr: "settingsJs"
  - id: response-data-property-access
    desc: Reads a response body from response.data
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '\b(res|response|req)\.data\b'

  - id: response-payload-base64-header
    desc: Reads base64 payload header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bheaders\s*\[[^\]]{0,80}(payload|content|body).{0,40}(base64|b64)'

  # EtherHiding second stages commonly return the next blob in an
  # `x-payload-b64` response header. String-array obfuscation often leaves the
  # `x-payload-` prefix as its own table entry.
  - id: x-payload-header-prefix
    desc: HTTP x-payload response header prefix
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)x-payload(-b64)?\b'

  - id: axios-client-reference
    desc: References the Axios HTTP client
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\baxios\.|\bfrom\s+["'']axios["'']|\brequire\(["'']axios["'']\)'
composite_rules:
  - id: server-response-method
    desc: Calls a server response method
    crit: notable
    conf: 0.88
    any:
      - id: server-response-send-end
      - id: server-response-redirect
      - id: server-response-status

  - id: node-response-to-file
    desc: Writes an evented Node response to a file
    crit: notable
    conf: 0.93
    attack: T1105
    near_bytes: 1600
    all:
      - id: node-response-data-event
      - id: node-response-end-event
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync-call
  - id: axios-response-data-access
    desc: Reads an Axios response body from response.data
    crit: notable
    conf: 0.8
    all:
      - id: response-data-property-access
      - id: axios-client-reference
    unless:
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
