defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: "C0002"
traits:
  - id: server-response-json-body
    desc: Calls HTTP response json with body argument
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^(res|response|resp)(\.status)?\.json$'
      arg:
        index: 0
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: javascript-synthetic-no-content-response
    desc: Constructs a synthetic HTTP 204 response
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bnew\s+Response\([^;\n]{0,120}\bstatus\s*:\s*204\b'

  - id: response-status-body-copy
    desc: Copies HTTP response status and text body
    crit: notable
    conf: 0.9
    for: [javascript, typescript, text]
    if:
      type: text
      regex: '\.status\s*=\s*\w+\.status.{0,120}\.data\s*=\s*await\s+\w+\.text\('

  - id: server-response-send-end
    desc: Calls server response send/end method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(res|response|resp)\.(send|end)$'

  - id: server-response-status
    desc: Calls server response status method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(res|response|resp)\.status$'

  - id: javascript-response-redirect-call
    desc: Calls JavaScript response redirect method
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(res|resp|response|reply)\.redirect$'

  - id: server-response-not-found-status
    desc: Server response emits HTTP 404 status
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(res|response|resp)\.status\s*\(\s*404\b'

  - id: server-response-statuscode-not-found
    desc: Server response assigns HTTP 404 status
    crit: notable
    conf: 0.94
    # ASP.NET uses the same Response.StatusCode assignment as Node handlers.
    for: [javascript, typescript, asp, csharp]
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)\b(res|response|resp)\.statusCode\s*=\s*404\b'

  # Keep this distinct from the generic data-event atom: the response callback
  # must directly register the `data` handler, and that handler must convert
  # chunks to text. A nested arrow expression that is never registered must not
  # be described as an active stream.
  - id: node-http-get-data-handler
    desc: Node HTTP GET registers data handler directly
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'https?\.get\([^;]{0,120},\s*\(?res\)?\s*=>\s*\{?\s*res\.on\(\s*[''\"]data[''\"]'

  - id: node-response-pipe
    desc: Pipes a Node HTTP response stream
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(response|res|reply)\.pipe\s*\('
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: http-response-data-eval
    desc: Evaluates an HTTP response body field directly
    crit: notable
    conf: 0.85
    attack: "T1059.007"
    if:
      type: text
      regex: 'eval\s*\(\s*(responseText|res(ponse)?\.(data|responseText)|data\.response)\b'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/web/
      - id: well-known/lib/ui/ckeditor/distribution/
      - id: well-known/lib/runtime/scripted/pyodide/
      - id: well-known/app/publishing/civicrm/
      - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  # An accumulated response body parsed as JSON. Downloaders and updaters do
  # this routinely; the tasking shape pairs it with command-member reads
  # below, composed in objectives/command-and-control/backdoor/tasking/http/.
  # Fragment of the tasking signature: two command-shaped member reads
  # (`cmd`, `args`) with no standalone meaning outside the parse above.
  - id: response-command-member-pair
    desc: Paired command member reads
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.(cmd|args)\b[\s\S]{0,200}\.(cmd|args)\b'
  - id: response-payload-base64-header
    desc: Reads base64 payload header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bheaders\s*\[[^\]]{0,80}(payload|content|body).{0,40}(base64|b64)'

  # EtherHiding second stages commonly return the next blob in an
  # `x-payload-b64` response header. String-array obfuscation often leaves the
  # `x-payload-` prefix as its own table entry.
  - id: x-payload-header-prefix
    desc: HTTP x-payload response header prefix
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)x-payload(-b64)?\b'

  - id: fetch-text-commonjs-function-constructor
    desc: Fetched text compiled as CommonJS Function
    crit: notable
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: '\.text\(\)[\s\S]{0,200}new Function\(\s*["'']require["'']\s*,\s*["'']module["'']'
    unless:
      - id: well-known/lib/ui/monaco-editor/
      - id: metadata/package/testing/

      - id: metadata/path::test-directory-component
  - id: axios-response-data-access
    desc: Axios promise callback reads response data
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: [(identifier) @client
                (member_expression object: (identifier) @client)])
            property: (property_identifier) @then)
          arguments: (arguments
            (arrow_function
              parameter: (identifier) @param
              body: (member_expression
                object: (identifier) @obj
                property: (property_identifier) @data)))) @call
          (#eq? @client "axios")
          (#eq? @then "then")
          (#eq? @param @obj)
          (#eq? @data "data"))

composite_rules:
  - id: server-response-method
    desc: Calls a server response method
    crit: notable
    conf: 0.88
    any:
      - id: server-response-send-end
      - id: javascript-response-redirect-call
      - id: server-response-status
