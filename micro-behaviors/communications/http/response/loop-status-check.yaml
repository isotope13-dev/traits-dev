# Loop-guarded response-status handling, relocated from
# objectives/command-and-control/beacon/network/periodic (c2-response-check-loop).
# The old matcher only saw string literals, so it could never match beacon
# code itself — only prose *about* status codes (docstrings, comments) — while
# carrying a C2 verdict in its name, description and directory. This atom keeps
# the neutral observation (a loop that tests an HTTP response status, the
# retry/poll shape shared by SDKs and beacons alike); the beacon composites
# reference it and supply the periodicity context that earns the C2 claim.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8

traits:
  - id: http-loop-status-code-check
    desc: Loop tests HTTP response status code
    if:
      # Require a real comparison on status_code: bare proximity of the words
      # `while` and `status_code` also matches documentation prose describing
      # exception plumbing (including `status_code=None` default arguments).
      # `type: text` (not string_literal) so actual polling code matches,
      # not just quoted prose.
      type: text
      regex: '(?i)\bwhile\b[\s\S]{0,200}status_code\s*(==|!=|>=|<=|>|<)'
