defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
traits:
  - id: http-version
    desc: HTTP/1.x version string
    crit: baseline
    conf: 0.5
    mbc: C0002
    attack: T1071.001
    if:
      type: text
      substr: HTTP/1.
  - id: http-versions
    desc: HTTP protocol version strings
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: HTTP/(1\.0|1\.1|2\.0)
  - id: http2-version
    desc: HTTP/2 protocol version string
    crit: notable
    conf: 0.75
    mbc: C0002
    attack: T1071.001
    if:
      type: text
      substr: HTTP/2
  - id: http-response
    desc: HTTP response reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)http_response|response_body
