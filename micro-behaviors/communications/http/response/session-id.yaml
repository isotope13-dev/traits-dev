defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: http-400-session-id-clues
    desc: HTTP 400 and session-ID member clues
    crit: notable
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/response::http-400-response
      - id: micro-behaviors/data/property/access::socket-session-id-member
    unless:
      - id: micro-behaviors/communications/http/device-code::authorization-pending-status
      - id: micro-behaviors/communications/http/device-code::device-code-poll-status

