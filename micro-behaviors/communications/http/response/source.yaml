defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.82

traits:
  - id: source-http-404-assignment
    desc: Source assigns HTTP 404 status
    crit: notable
    conf: 0.9
    for: [python, ruby, java, csharp, go]
    if:
      type: text
      regex: '(?i)\b(status_code|status)\s*=\s*404\b'

  - id: source-http-404-call
    desc: Source calls HTTP 404 response
    crit: notable
    conf: 0.9
    for: [python, ruby, java, csharp, go]
    if:
      type: text
      regex: '(?i)\b(abort|send_response|Response)\s*\(.{0,80}\b404\b'

  - id: source-redirect-admin-path
    desc: Redirects request to admin path
    crit: notable
    if:
      type: text
      regex: '(?i)redirect\s*\([^;\n]{0,100}(admin|dashboard)'

  - id: source-redirect-to-admin-path
    desc: Redirects request to admin path
    crit: notable
    if:
      type: text
      regex: '(?i)redirect_to\s+[^;\n]{0,100}(admin|dashboard)'

  - id: source-send-redirect-admin-path
    desc: Sends redirect to admin path
    crit: notable
    if:
      type: text
      regex: '(?i)sendRedirect\s*\([^;\n]{0,100}(admin|dashboard)'

  - id: go-http-redirect-symbol-call
    desc: Calls Go HTTP redirect response
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: symbol
      kind: call
      exact: http.Redirect

composite_rules:
  - id: source-http-404-status
    desc: Source server emits HTTP 404 status
    crit: notable
    conf: 0.9
    any:
      - id: source-http-404-assignment
      - id: source-http-404-call

  - id: source-admin-redirect
    desc: Redirects request to an admin area
    crit: notable
    conf: 0.84
    any:
      - id: source-redirect-admin-path
      - id: source-redirect-to-admin-path
      - id: source-send-redirect-admin-path
