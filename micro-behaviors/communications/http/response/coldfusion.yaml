defaults:
  for:
  - cfml
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.92
traits:
- id: cfml-output-file-read
  desc: CFML output uses a file-read result
  if:
    type: symbol
    kind: call
    exact: cfoutput:expression
    arg:
      index: 0
      from:
        call: ^cffile:read-result$
        through:
        - call: ^(htmlcodeformat|htmleditformat)$
          arguments:
          - 0
- id: cfcontent-file-response
  desc: CFCONTENT specifies a response file
  if:
    type: symbol
    kind: call
    exact: cfcontent
    arg:
      index: 0
      from:
        field: file
        field_exists: true
- id: cfcontent-read-result-response
  desc: CFCONTENT uses a file-read result
  if:
    type: symbol
    kind: call
    exact: cfcontent
    arg:
      index: 0
      from:
        field: variable
        call: ^cffile:read-result$
- id: cfcontent-octet-stream
  desc: CFML sets octet-stream response type
  if:
    type: symbol
    kind: call
    exact: cfcontent
    arg:
      index: 0
      from:
        field: type
        whole_value: (?i)^application/octet-stream$
- id: cfheader-content-disposition
  desc: CFML sets Content-Disposition response header
  if:
    type: symbol
    kind: call
    exact: cfheader
    arg:
      index: 0
      from:
        field: name
        whole_value: (?i)^Content-Disposition$
- id: cfml-output-decrypt-result
  desc: CFML output uses a Decrypt result
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: ^(writeoutput|cfoutput:expression)$
    arg:
      index: 0
      from:
        call: ^decrypt$
- id: cftextarea-file-read-value
  desc: CF textarea uses a file-read result
  if:
    type: symbol
    kind: call
    exact: cftextarea
    arg:
      index: 0
      from:
        field: value
        call: ^cffile:read-result$
        through:
        - call: ^(htmlcodeformat|htmleditformat)$
          arguments:
          - 0
