defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: php-404-response
    desc: Sets HTTP 404 through PHP response APIs
    crit: notable
    conf: 0.99
    any:
      - id: micro-behaviors/communications/http/response/call::php-http-response-code-404
      - id: micro-behaviors/communications/http/response/call::php-header-status-404
