defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: C0002
  crit: notable
  conf: 0.85
traits:
  - id: wordpress-json-response
    desc: Sends a WordPress JSON response
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: wp_send_json

  - id: php-http-response-code-404
    desc: Sets HTTP 404 response code
    if:
      type: symbol
      kind: call
      regex: '(?i)^http_response_code$'
      arg:
        index: 0
        kind: number
        value: 404
  - id: php-header-status-404
    desc: Sends HTTP 404 status with PHP header()
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bheader\s*\(\s*["'']HTTP/[0-9.]+[ \t]+404\b'
  - id: php-http-response-code-403
    desc: Sets HTTP 403 response code
    if:
      type: text
      regex: http_response_code\s*\(\s*403
