defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: C0002
  crit: notable
  conf: 0.85
traits:
  - id: wordpress-json-response
    desc: Sends a WordPress JSON response
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: wp_send_json

  - id: wordpress-redirect
    desc: Sends a WordPress HTTP redirect
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: wp_redirect

  - id: wordpress-safe-redirect
    desc: Sends a validated WordPress redirect
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: wp_safe_redirect

  - id: wordpress-admin-redirect
    desc: Redirects to WordPress admin URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'wp_(safe_)?redirect\s*\([^)]{0,160}\badmin_url\s*\('

  - id: php-location-redirect
    desc: Sends HTTP Location redirect
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)header\s*\(\s*["'']Location:\s*https?://'

  - id: php-inline-external-javascript-redirect
    desc: PHP emits external JavaScript redirect
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?is)<script\b[^<]{0,240}(window\.)?location\.(replace|assign)\s*\(\s*["'']https?://'
  - id: php-http-response-code-404
    desc: Sets HTTP 404 response code
    if:
      type: text
      regex: http_response_code\s*\(\s*404
  - id: php-http-response-code-403
    desc: Sets HTTP 403 response code
    if:
      type: text
      regex: http_response_code\s*\(\s*403
