# Neutral HTTP response mechanics for Android APK delivery.  Mobile-targeting
# intent belongs in objective composites that combine these atoms with
# user-agent routing and denial/credential branches.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, php, python]
  crit: notable
  conf: 0.94

traits:
  - id: res-apk-content-type
    desc: Express response sets Android APK MIME type
    if:
      type: text
      regex: '(?is)\bres\.set\w*\([^)]{0,80}application/vnd\.android\.package-archive'

  - id: response-apk-content-type
    desc: Response object sets Android APK MIME type
    if:
      type: text
      regex: '(?is)\bresponse\.set\w*\([^)]{0,80}application/vnd\.android\.package-archive'

  - id: res-write-head-apk-content-type
    desc: Express response writes Android APK MIME type
    if:
      type: text
      regex: '(?is)\bres\.writeHead\([^)]{0,80}application/vnd\.android\.package-archive'

  - id: apk-response-navigation
    desc: Navigates to or returns an APK response
    if:
      type: text
      regex: '(?is)\.apk\b.{0,180}(location\.href|window\.location|res\.send|redirect\b)'

  - id: apk-response-navigation-reverse
    desc: Navigation returns an APK artifact
    if:
      type: text
      regex: '(?is)(location\.href|window\.location|res\.send|redirect\b).{0,180}\.apk\b'

composite_rules:
  - id: android-apk-response-content-type
    desc: Server sets Android APK response MIME type
    any:
      - id: res-apk-content-type
      - id: response-apk-content-type
      - id: res-write-head-apk-content-type
