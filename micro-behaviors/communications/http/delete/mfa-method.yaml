# Bind the DELETE verb and method target in one parsed request. A nearby
# Graph GET or an unrelated device DELETE cannot establish MFA removal.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.97

traits:
  - id: mfa-method-delete-call
    desc: DELETE targets MFA authentication-method path
    for: [python, javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx|axios)\.delete$'
      arg:
        index: 0
        kind: string
        regex: '/authentication/(microsoftAuthenticatorMethods|phoneMethods)/'

  - id: powershell-mfa-method-delete
    desc: PowerShell DELETE targets MFA method path
    for: [powershell]
    if:
      type: tree-sitter
      query: |
        ((command (command_name) @client) @request
          (#match? @client "(?i)^Invoke-RestMethod$")
          (#match? @request "(?i)^Invoke-RestMethod\\s+-Method\\s+DELETE\\s+-Uri\\s+['\"]https://graph\\.microsoft\\.com/")
          (#match? @request "/authentication/(microsoftAuthenticatorMethods|phoneMethods)/"))

composite_rules:
  - id: mfa-method-delete-request
    desc: DELETE request targets an MFA method
    for: [python, javascript, typescript, powershell]
    any:
      - id: mfa-method-delete-call
      - id: powershell-mfa-method-delete
