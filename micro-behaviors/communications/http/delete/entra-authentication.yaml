# Endpoint and DELETE evidence co-occur; proximity does not prove data flow.
# Moved from services/entra-directory because this observation requires a verb.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.93

composite_rules:
  - id: graph-authentication-method-delete-cooccurrence
    desc: Graph auth-method endpoint near HTTP DELETE
    crit: notable
    conf: 0.95
    attack: T1556.006
    all:
      - id: micro-behaviors/communications/http/services/entra-directory::graph-authentication-methods-endpoint
    any:
      - id: micro-behaviors/communications/http/delete::requests-delete
      - id: micro-behaviors/communications/http/delete::axios-delete-call
      - id: micro-behaviors/communications/http/delete::javascript-http-client-delete-call
      - id: micro-behaviors/communications/http/delete::method-constant
      - id: micro-behaviors/communications/http/delete::http-delete-method-field
    near_lines: 12
