# go2rtc's DELETE /api/log resets its in-memory log buffer. Clearing a
# buffer can be ordinary maintenance; attacker intent belongs to consumers.
# https://github.com/AlexxIT/go2rtc/blob/master/internal/api/api.go
defaults:
  platforms: [unix, windows]
  for: [scripts, source, -wasm]
  crit: notable
  conf: 0.95

traits:
  - id: go2rtc-log-delete-curl
    desc: HTTP DELETE targets go2rtc log buffer
    for: [shell]
    if:
      # Bind real method and URL arguments in one parsed command. This
      # handles quotes and option order without mistaking a POST body that
      # mentions a DELETE command for the request being performed.
      type: tree-sitter
      query: |
        ((command name: (command_name) @client
          argument: (_) @flag
          . argument: (_) @method
          argument: (_) @url) @request
          (#match? @request ":1984/api/log")
          (#match? @client "(^|/)curl$")
          (#match? @flag "^(-[a-zA-Z]*X|--request)$")
          (#match? @method "^[\"']?DELETE[\"']?$")
          (#match? @url "^[\"']?https?://[^/ \\t\"']{1,200}:1984/api/log([\"']?$|[?#])"))
        ((command name: (command_name) @client
          argument: (_) @url
          argument: (_) @flag
          . argument: (_) @method) @request
          (#match? @request ":1984/api/log")
          (#match? @client "(^|/)curl$")
          (#match? @flag "^(-[a-zA-Z]*X|--request)$")
          (#match? @method "^[\"']?DELETE[\"']?$")
          (#match? @url "^[\"']?https?://[^/ \\t\"']{1,200}:1984/api/log([\"']?$|[?#])"))
        ((command name: (command_name) @client
          argument: (_) @method
          argument: (_) @url) @request
          (#match? @request ":1984/api/log")
          (#match? @client "(^|/)curl$")
          (#match? @method "^(-[a-zA-Z]*X|--request=)[\"']?DELETE[\"']?$")
          (#match? @url "^[\"']?https?://[^/ \\t\"']{1,200}:1984/api/log([\"']?$|[?#])"))
        ((command name: (command_name) @client
          argument: (_) @url
          argument: (_) @method) @request
          (#match? @request ":1984/api/log")
          (#match? @client "(^|/)curl$")
          (#match? @method "^(-[a-zA-Z]*X|--request=)[\"']?DELETE[\"']?$")
          (#match? @url "^[\"']?https?://[^/ \\t\"']{1,200}:1984/api/log([\"']?$|[?#])"))

  - id: go2rtc-log-delete-call
    desc: HTTP client deletes go2rtc log buffer
    for: [python, javascript, typescript, ruby, go, rust]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(delete|Delete)$'
      arg:
        index: 0
        from:
          value: '^https?://[^/]{1,200}:1984/api/log([?#]|$)'

composite_rules:
  - id: go2rtc-log-buffer-clear
    desc: Clears go2rtc logs through HTTP API
    any:
      - id: go2rtc-log-delete-curl
      - id: go2rtc-log-delete-call
