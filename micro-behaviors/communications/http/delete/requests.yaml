# Preserve the requests call matcher and its original effective scope.
defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [python]
traits:
  - id: requests-delete
    desc: Calls requests.delete in Python
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: requests.delete
    unless:
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
