defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
traits:
  - id: wget-shell-script-to-tmp
    desc: wget downloads a shell script into /tmp
    crit: notable
    conf: 0.9
    for:
      - python
      - shell
      - text
    if:
      type: text
      regex: wget\s+https?://.{1,80}\.sh\s+-O\s+/tmp/.{1,40}\.sh
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog

composite_rules:
  - id: setup-py-wget-tmp-sh
    desc: setup.py wget downloads shell script to /tmp
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/communications/http/download/wget::wget-shell-script-to-tmp
