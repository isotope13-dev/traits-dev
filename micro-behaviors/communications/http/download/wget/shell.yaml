# Wget file downloads in shell scripts
defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1105
traits:
  - id: wget-output-file
    desc: Uses wget output-document option
    crit: notable
    conf: 0.7
    if:
      type: text
      # Do not classify a shell prompt/example inside a warning or heredoc as a
      # downloader invocation.
      regex: '(?m)(^|[;&|]\s*)\$?\s*(busybox\s+)?wget\s+(.{0,50}\s+)?(-O|--output-document)\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/build/docker::buildkit-dockerfile-frontend
      - id: metadata/package/manifest/freeform::pkg-description-content-type-markdown
    not:
      - substr: apt.u.doover.com/install.sh
  - id: wget-output-stdout
    desc: wget writes downloaded content to stdout
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bwget(\.exe)?\b[^\n]{0,160}\s-O\s*-(\s|$)'

composite_rules:
  - id: wget-silent-stdout
    desc: wget quietly downloads to stdout
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/download/curl::wget-cmd
      - id: micro-behaviors/communications/http/download/cli::wget-q-flag
      - id: wget-output-stdout
    unless:
      - id: micro-behaviors/os/package-manager/apt::gpg-import-pipe
      - id: micro-behaviors/os/package-manager/apt::apt-key-add-pipe
      - id: micro-behaviors/os/package-manager/apt::gpg-dearmor-pipe
      - id: micro-behaviors/os/package-manager/apt::tee-keyring-pipe
