# Wget file downloads in shell scripts
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [shell, lua]
  attack: T1105
traits:
  - id: wget-cmd
    desc: Wget downloads from an HTTP URL
    conf: 0.7
    for: [scripts, binaries, text]
    if:
      type: text
      regex: '(?i)(^|[\s;&({])wget(\.exe)?\s+(-\S*\s+){0,6}https?://[^\s/]{1,80}'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: metadata/package/freeform::pkg-description-content-type-markdown
    not:
      - substr: apt.u.doover.com/install.sh

  - id: wget-output-file
    desc: Uses wget output-document option
    conf: 0.7
    if:
      type: text
      # Do not classify a shell prompt/example inside a warning or heredoc as a
      # downloader invocation.
      regex: '(?m)(^|[;&|]\s*)\$?\s*(busybox\s+)?wget\s+([^;&|\n]{0,50}\s+)?(-O|--output-document)\b'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/build/docker::buildkit-dockerfile-frontend
      - id: metadata/package/freeform::pkg-description-content-type-markdown
    not:
      - substr: apt.u.doover.com/install.sh
  # A workflow that saves wget output under cargo's target/debug or
  # target/release and keys the URL with github.sha is restoring this
  # commit's own build, not swapping in an outside artifact.
  - id: wget-commit-sha-cargo-target
    desc: wget saves the commit build under target
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'wget\b[^\n]{0,40}-O\s+target/(debug|release)/[^\n]{0,120}github\.sha'
  # Composite-action steps are matched after ${{ }} expressions are removed.
  # The S3 host of the workflow's own artifact URL remains.
  - id: wget-stripped-sha-cargo-target
    desc: wget saves a cargo target from S3
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'wget[^\n]{0,12}-O target/(debug|release)/\S{1,12} \S{0,40}\.s3\.\S{1,20}amazonaws\.com'
  - id: wget-output-stdout
    desc: wget writes downloaded content to stdout
    conf: 0.9
    if:
      type: text
      regex: '\bwget(\.exe)?\b[^\n]{0,160}\s-O\s*-(\s|$)'

composite_rules:
  - id: wget-cargo-target-commit-fetch
    desc: wget restores a commit cargo target
    conf: 0.9
    for: [shell]
    any:
      - id: wget-commit-sha-cargo-target
      - id: wget-stripped-sha-cargo-target
  # `busybox wget http://...` satisfies both `wget-cmd` (the wget token with
  # a URL) and `download/busybox::wget` (the BusyBox applet call) from one
  # invocation. Count the client once, so thresholds that need two distinct
  # downloaders cannot be met twice by that single command.
  - id: wget-client
    desc: Wget download client in any invocation form
    conf: 0.9
    any:
      - id: wget-cmd
      - id: micro-behaviors/communications/http/download/busybox::wget
  - id: wget-silent-stdout
    for: [shell]
    desc: wget quietly downloads to stdout
    conf: 0.9
    all:
      - id: wget-cmd
      - id: micro-behaviors/communications/http/download/cli::wget-q-flag
      - id: wget-output-stdout
    unless:
      - id: micro-behaviors/os/package-manager/apt::gpg-import-pipe
      - id: micro-behaviors/os/package-manager/apt::apt-key-add-pipe
      - id: micro-behaviors/os/package-manager/apt::gpg-dearmor-pipe
      - id: micro-behaviors/os/package-manager/apt::tee-keyring-pipe
