defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1564.001
traits:
  # Same hidden-name staging as the curl sibling: the output token must end at
  # the argument boundary, so `-O .github/x.yml` (a directory path) and the
  # tool-config dotfiles below do not count.
  - id: wget-relative-dotfile-output
    desc: wget command names relative dotfile output
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: '\bwget\b[^\n;|&]{0,160}\s(-O|--output-document[= ])\s*\.\w[^\s/]{0,80}([\s;&|]|$)'
    not:
      - regex: '\s(-O|--output-document[= ])\s*\.(yamllint|eslintrc|prettierrc|stylelintrc|markdownlint|editorconfig|clang-format|clang-tidy|flake8|pylintrc|hadolint|yarnrc|codespellrc|htmlhintrc|jscpd|goreleaser|golangci|env|build-harness|bashrc|profile|gitconfig)([\s;&|.]|$)'
      - regex: '\s(-O|--output-document[= ])\s*\.[A-Za-z0-9_][^\s/]{0,75}\.(html?|xml|csv|md|pdf|json|ya?ml|txt)([\s;&|]|$)'
