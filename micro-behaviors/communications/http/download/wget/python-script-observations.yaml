defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: wget-url-followon-command-text
    desc: wget URL with follow-on command text
    crit: notable
    conf: 0.9
    platforms: [unix]
    if:
      type: string_literal
      regex: 'wget\s+https?://.{10,300}&&.{0,50}(tar|chmod|\./)'
    unless:
      - id: well-known/app/infrastructure/mgmt
