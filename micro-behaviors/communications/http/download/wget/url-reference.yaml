defaults:
  crit: notable
  platforms: [unix, android]
  for: [elf, shell, c, cpp]
traits:
  - id: wget-http-url-reference
    desc: wget HTTP URL download reference
    conf: 0.9
    if:
      type: text
      # The flag cluster accepts short-option bundles with an attached output
      # dash (`-qO-`) and a bare `-` stdout placeholder (`-O -`), the
      # canonical forms that stream a download to another process.
      regex: '\bwget\b\s+((-[a-zA-Z]{1,8}-?|-)\s+){0,4}https?://[^\s/]{1,80}'
