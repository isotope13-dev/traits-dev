---
defaults:
  platforms:
  - android
  for:
  - dex
  crit: notable
  conf: 0.95
traits:
- id: dex-wget-http-url
  desc: DEX text contains a wget HTTP command
  if:
    type: text
    substr: wget http://
- id: dex-busybox-wget
  desc: DEX text contains busybox wget
  if:
    type: text
    substr: busybox wget
- id: dex-toybox-wget
  desc: DEX text contains toybox wget
  if:
    type: text
    substr: toybox wget
