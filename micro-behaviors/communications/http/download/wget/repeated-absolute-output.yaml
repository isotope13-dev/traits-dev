defaults:
  platforms: [unix, android]
  for: [shell, text]
  crit: notable
  conf: 0.94

traits:
  - id: repeated-wget-absolute-output
    desc: Repeated wget outputs to absolute paths
    count_min: 3
    if:
      type: text
      regex: '(?m)^[ \t]*wget\s+-[\w]*O\s+["'']?/[\w/-]+/'

  - id: repeated-wget-output-document-absolute
    desc: Repeated wget outputs to absolute paths
    count_min: 3
    if:
      type: text
      regex: '(?m)^[ \t]*wget\s+--output-document[= ]\s*["'']?/[\w/-]+/'
