defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: webclient-temp-exe-delete-shell-profile
  desc: WebClient, temp EXE, delete and shell clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/download/webclient::downloadfile-method-name-batch
  - id: micro-behaviors/fs/path/temp::batch-exe-path-reference
  - id: micro-behaviors/fs/delete/file/command::del-command
  any:
  - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
  - id: micro-behaviors/process/create/shell/lang::powershell-invocation
- id: webclient-temp-exe-data-profile
  desc: WebClient and temp EXE/data path clues
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/webclient::downloadfile-method-name-batch
  - id: micro-behaviors/fs/path/temp::batch-exe-path-reference
  - id: micro-behaviors/fs/path/temp::batch-data-path-reference
