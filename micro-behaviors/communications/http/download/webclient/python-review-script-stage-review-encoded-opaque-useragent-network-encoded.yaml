---
defaults:
  platforms:
  - windows
  for:
  - powershell
traits:
- id: encoded-stage-downloadstring-into-script
  desc: Encoded source assigns DownloadString to $script
  crit: notable
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: "(?i)\\$script\\s*=\\s*\\$[A-Za-z_]\\w*\\.DownloadString\\s*\\(\\s*\\$[A-Za-z_]\\w*\\s*\\)"
