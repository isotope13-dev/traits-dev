# FishHub's documented first stage saves an HTTP response as a VBE in TEMP.
# Match the destination argument, not a nearby unrelated script filename.
defaults:
  for: [scripts, source]
  platforms: [windows]
traits:
  - id: downloadfile-temp-encoded-script
    desc: DownloadFile stages encoded script in TEMP
    crit: suspicious
    conf: 0.95
    attack: T1105
    if:
      type: text
      regex: '(?i)\bDownloadFile\s*\([^,)\r\n]{1,99},\s*["'']%t(emp|mp)%[/\\][^"'']{1,99}\.(vbe|jse)["'']'
