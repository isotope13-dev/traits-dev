defaults:
  platforms: [windows]
  for: [png, text]

traits:
  - id: downloadfile-exe-windows-tasks-text
    desc: DownloadFile, EXE and Windows Tasks path text
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)DownloadFile.{0,64}\.exe.{0,64}windows\\\\tasks'

composite_rules:
  - id: png-text-webclient-decode-context
    desc: PNG or text carrier with WebClient download and decode clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-text
      - id: micro-behaviors/data/decode/base64::frombase64string-text
      - id: downloadfile-exe-windows-tasks-text
      - id: micro-behaviors/communications/http/client/webclient::downloadstring-text
