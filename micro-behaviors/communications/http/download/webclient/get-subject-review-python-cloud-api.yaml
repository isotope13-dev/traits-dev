# Provider-host alternatives qualify one operation: a cloud API GET. The URL
# must contribute to the request argument; a returned/dead reference does not.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97
traits:
  - id: python-webclient-cloud-api-get
    desc: WebClient retrieves a cloud provider API URL
    if:
      type: symbol
      kind: call
      regex: '\.Download(Data|String)$'
      receiver:
        from:
          call: '(^|\.)WebClient$'
      arg:
        index: 0
        from:
          value: '^https://(graph\.microsoft\.com|www\.googleapis\.com|cloud-api\.yandex\.net)/'
