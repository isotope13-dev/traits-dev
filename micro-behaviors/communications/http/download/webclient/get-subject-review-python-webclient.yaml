# Bind the receiver to WebClient construction and the URL argument to an
# HTTP(S) literal origin. WebClient also supports file and FTP URIs, so a bare
# DownloadString/DownloadData spelling does not by itself establish HTTP GET.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-webclient-http-get
    desc: Python WebClient retrieves an HTTP URL
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.Download(Data|String)$'
      receiver:
        from:
          call: '(^|\.)WebClient$'
      arg:
        index: 0
        from:
          value: '^https?://'
