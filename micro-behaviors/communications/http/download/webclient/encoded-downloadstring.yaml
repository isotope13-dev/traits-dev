defaults:
  for: [batch, powershell]
  platforms: [windows]
traits:
  - id: base64-downloadstring-http
    desc: Encoded DownloadString HTTP request
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\.downloadstring\s*\(\s*["'']https?://'
  - id: base64-download-xor-iex-sequence
    desc: Encoded download XOR and IEX sequence
    crit: notable
    if:
      type: encoded
      encoding: base64
      regex: '(?i)downloadstring\([^)]{1,200}\)[^;]{0,100}-bxor[^;]{1,100};\s*iex\s*\('
