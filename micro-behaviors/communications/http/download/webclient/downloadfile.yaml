defaults:
  for:
    - documents
    - pe
  crit: notable
  conf: 0.8
  platforms:
    - windows
traits:
  - id: webclient-downloads-js-to-exe
    desc: WebClient saves JavaScript as EXE
    crit: suspicious
    conf: 0.96
    attack: T1105
    for: [powershell, batch, pe]
    if:
      type: text
      regex: (?is)DownloadFile\s*\(\s*['"]https?://[^'"]{1,220}\.js['"]\s*,\s*['"][^'"]{1,220}\.exe['"]
  - id: webclient-downloadfile-exe-url
    desc: WebClient fetches EXE URL
    for: [powershell, batch, pe]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: (?is)DownloadFile\s*\(\s*['"]https?://[^'"]{1,220}\.exe['"]
  - id: webclient-download-call
    desc: WebClient download operation text
    for:
      - batch
      - powershell
      - javascript
      - vbs
    if:
      type: text
      regex: (?i)w\^?e\^?b\^?c\^?l.{0,40}d\^?o\^?w\^?n\^?l\^?o\^?a\^?d
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: webclient-downloadfile-tokenized
    desc: Tokenized WebClient DownloadFile sequence
    crit: suspicious
    conf: 0.88
    for:
      - javascript
      - vbs
    if:
      type: text
      regex: (?is)sv3qs9Wibn4e8b.{0,120}oWnlOna2u2.{0,80}FIl8y7ll
    unless:
      - id: metadata/lang/source::yara-rule-source
  # Matches a clean (non-^-obfuscated) .NET/PowerShell `WebClient.DownloadFile`
  # call. This is a neutral HTTP file-download capability and also the canonical
  # documented way to fetch installers on Windows (e.g. rustup-init, get-pip).
  # The macro-dropper intent comes from the VBA/Office composites that reference
  # this atom (office-vba-powershell, execution/trigger/document/vba), not from
  # the download call alone — so it stays notable here.
  - id: webclient-downloadfile-call
    desc: "WebClient.DownloadFile call"
    crit: notable
    conf: 0.9
    for: [documents, pe, python, powershell, batch]
    if:
      type: text
      regex: (?is)(net.?we.?b.?client|we.?client).{0,512}(down.?load.?file|d.?wnl.?ad.?ile)
    unless:
      - id: metadata/lang/source::yara-rule-source
  # MSI-specific variant of the call above. Fetching an installer package over
  # HTTP is what Windows bootstrap scripts do (rustup, CoApp tooling, CI
  # installers); the install intent comes from composites such as
  # powershell-msi-programdata-install, which pair this with the staging
  # location and msiexec invocation -- not from the download itself.
  - id: webclient-downloadfile-msi-url
    desc: WebClient downloads MSI URL
    crit: notable
    conf: 0.9
    for: [documents, pe, powershell, batch]
    if:
      type: text
      regex: (?is)DownloadFile\s*\(\s*['"]https?://[^'"]{1,220}\.msi['"]
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: decoded-webclient-downloadstring-script
    desc: Encoded script has WebClient DownloadString
    crit: notable
    conf: 0.96
    for: [scripts]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)New-Object\s+Net[.]WebClient.{0,80}DownloadString\s*\('
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: decoded-webclient-downloadstring-source
    desc: Encoded source has WebClient DownloadString
    crit: notable
    conf: 0.96
    platforms: [windows, unix]
    for: [c, csharp, elixir, go, kotlin, rust, swift, zig]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)Net[.]WebClient.{0,80}DownloadString\s*\('
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: decoded-webclient-downloadstring-jvm
    desc: Encoded JVM stage has WebClient downloader
    crit: notable
    conf: 0.97
    for: [class, java_class]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)Net[.]WebClient;iex.{0,40}DownloadString\s*\('

composite_rules:
  - id: decoded-webclient-downloadstring
    desc: Encoded payload has WebClient DownloadString
    crit: notable
    conf: 0.96
    for: [scripts, source, class, java_class]
    any:
      - id: decoded-webclient-downloadstring-script
      - id: decoded-webclient-downloadstring-source
      - id: decoded-webclient-downloadstring-jvm
  - id: webclient-downloadfile-exe
    desc: WebClient stages EXE in writable path
    crit: notable
    conf: 0.94
    for: [powershell, batch, pe]
    near_lines: 3
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-exe-url
    any:
      - id: micro-behaviors/fs/path/temp::win-temp-env
      - id: micro-behaviors/fs/path/temp::win-temp-path
      - id: micro-behaviors/fs/path/location/
      - id: micro-behaviors/fs/write/file/target::users-public-path

  - id: powershell-encoded-downloadstring-fetch
    desc: Encoded PowerShell command fetches script text
    crit: notable
    conf: 0.9
    attack: T1027,T1059.001,T1105,T1564.003
    for: [scripts, documents, binaries, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    all:
      - id: micro-behaviors/process/create/hidden::powershell-hidden-bypass-encoded-command
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
    near_bytes: 4096
