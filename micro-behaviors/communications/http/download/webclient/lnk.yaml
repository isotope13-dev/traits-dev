defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-download-method
  desc: LNK arguments contain a download-method call
  crit: notable
  conf: 0.95
  attack: T1105
  if:
    type: value
    path: lnk.arguments
    regex: (?i)(WebClient\b[^\r\n]{0,60}\.Download|Download(File|String)\s*\()
