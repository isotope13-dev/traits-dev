defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: downloadfile-method-name-batch
  desc: DownloadFile method name in batch
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: (?i)DownloadFile
  unless:
  - id: metadata/package/manager::maven-wrapper-script
# `for:` reaches documents as well as batch scripts. A command line does not
# stop being one because of the file it arrives in: the RTF wave in this corpus
# carries `CmD /C cErTuTiL -uRlCAchE -sPlIT -f http://…` hex-encoded inside
# `\objdata`, which filefacts now decodes, and the atom written for exactly
# that string could not see it while it was scoped to batch.
- id: obfuscated-powershell-webclient-downloadfile
  desc: Mixed-case WebClient DownloadFile
  crit: suspicious
  conf: 0.95
  attack: T1105
  if:
    type: text
    regex: '(?s)Down.{0,40}loAdFi.{0,40}le.{0,180}Update-KB.{0,40}\.ps1'
- id: obfuscated-webclient-downloadfile-ps1
  desc: Obfuscated DownloadFile near PS1 path
  crit: suspicious
  conf: 0.95
  attack: T1105
  if:
    type: text
    regex: '(?s)Down.{0,40}loAdFi.{0,40}le.{0,240}\.ps1'
