defaults:
  platforms: [windows]
traits:
- id: downloadfile-executable-destination
  desc: DownloadFile executable destination
  crit: suspicious
  conf: 0.9
  attack: T1105
  for: [powershell, pe, batch, documents]
  if:
    type: text
    regex: '(?is)\.DownloadFile\([^,\r\n]{1,240},\s*[^)\r\n]{0,160}\.(exe|dll)\b'
  unless:
  - id: micro-behaviors/communications/http/url/forge::public-code-forge-url
