# Baileys version-check update endpoints.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious

traits:
  # Upstream Baileys fetches its version manifest from a raw content URL.
  # A fork that repoints `fetchLatestBaileysVersion` at a browsable
  # `github.com/<owner>/<repo>/...` page URL fetches HTML instead of JSON,
  # so the check silently falls back while looking maintained. The function
  # name is the library's own stable API, not attacker wording; only the
  # HTML-page endpoint is the tamper signal.
  - id: baileys-version-check-github-page-url
    desc: Baileys version check fetches GitHub page URL
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: 'fetchLatestBaileysVersion[\s\S]{0,800}https://github\.com/'

  # Upstream Baileys fetches a static version JSON; a fork that repoints
  # `fetchLatestBaileysVersion` to fetch a JavaScript script from GitHub
  # at runtime creates an unpinned, operator-controlled update channel.
  - id: baileys-version-check-remote-script-fetch
    desc: Baileys version check fetches remote script
    crit: suspicious
    conf: 0.88
    attack: T1195.002
    if:
      type: text
      regex: 'fetchLatestBaileysVersion[\s\S]{0,500}raw\.githubusercontent\.com/[^\s''"`]{1,80}\.js\b'

