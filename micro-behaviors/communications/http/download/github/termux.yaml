defaults:
  platforms: [android, unix]
  for: [javascript, typescript]
  attack: T1105

composite_rules:
  - id: github-raw-runtime-self-update
    desc: Replaces runtime script from GitHub raw content
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-scripting-lang
      - id: micro-behaviors/fs/write/file/direct::write-file-sync
      - id: micro-behaviors/fs/chmod/modify::node-chmod
    unless:
      - id: well-known/tool/development/docker-actions-toolkit::docker-actions-toolkit-context

  - id: termux-missing-core-github-reinstall
    desc: Reinstalls missing Termux core from GitHub raw
    crit: notable
    conf: 0.94
    all:
      - id: github-raw-runtime-self-update
      - id: micro-behaviors/process/lifecycle/self-repair::termux-utils-missing-core-reinstall
      - id: micro-behaviors/fs/path/application/prefix::termux-prefix-bin-construction
