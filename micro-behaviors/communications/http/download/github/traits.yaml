defaults:
  platforms: [windows, unix]
  for: [shell, python, javascript, typescript]
  crit: notable
  mbc: C0002
  attack: T1071.001

traits:
- id: github-release-api-download
  desc: Curl fetches GitHub release metadata
  crit: notable
  conf: 0.92
  for: [shell]
  if:
    type: text
    regex: 'curl[^\n]{0,240}https://api\.github\.com/'
- id: python-github-release-api-url
  desc: Python GitHub release API reference
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: 'https?://api\.github\.com/repos/[^\s''"]{1,180}/releases'
- id: python-release-asset-darwin
  desc: Python Darwin release asset marker
  crit: component
  conf: 0.86
  for: [python]
  if:
    type: text
    substr: darwin-arm64
- id: python-release-asset-linux
  desc: Python Linux release asset marker
  crit: component
  conf: 0.86
  for: [python]
  if:
    type: text
    substr: linux-x64
- id: python-release-asset-windows
  desc: Python Windows release asset marker
  crit: component
  conf: 0.86
  for: [python]
  if:
    type: text
    substr: win32-x64
- id: bun-release-archive-url
  desc: Bun release archive URL reference
  crit: notable
  conf: 0.94
  for: [python, javascript, typescript]
  if:
    type: text
    substr: github.com/oven-sh/bun/releases/download/bun-v
# The sibling above needs the URL as one contiguous string. Droppers assemble it
# from parts (`https://github.com/${a}/${b}/releases/download/${rel}/${asset}`,
# often with the org and repo held as \xNN-escaped array entries), which leaves
# no matchable URL run at all. The per-platform asset filenames survive that:
# whoever fetches the archive must still name the exact files the vendor
# publishes, and droppers carry the whole platform->asset map so one build runs
# everywhere.
- id: bun-release-asset-filename
  desc: Bun release asset filename
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bbun-(linux|darwin|windows)-[a-z0-9_]{3,8}\.zip\b'
# Deno ships the same way Bun does — one signed release archive per platform on
# the project's GitHub releases. A dropper that wants a JavaScript engine other
# than the `node` it was started under has exactly these two vendors to pick
# from, so the Deno forms are carried alongside the Bun ones above rather than
# leaving the technique matchable for only one runtime.
- id: deno-release-archive-url
  desc: Deno release archive URL reference
  crit: notable
  conf: 0.94
  for: [python, javascript, typescript]
  if:
    type: text
    substr: github.com/denoland/deno/releases/download
- id: deno-release-asset-filename
  desc: Deno release asset filename
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bdeno-(x86_64|aarch64)-(unknown-linux-gnu|apple-darwin|pc-windows-msvc)\.zip\b'
- id: github-raw-curl-fetch
  desc: Curl fetches GitHub raw content
  conf: 0.85
  if:
    type: text
    regex: '\bcurl\b.{0,50}raw\.githubusercontent\.com'
  not:
  - substr: /home/build/melange-out/
  - substr: docker-library/
- id: github-raw-wget-fetch
  desc: Wget fetches GitHub raw content
  conf: 0.85
  if:
    type: text
    regex: '\bwget\b.{0,50}raw\.githubusercontent\.com'
  not:
  - substr: /home/build/melange-out/
  - substr: docker-library/
composite_rules:
# One handle for "this code pulls a standalone JavaScript engine off a vendor's
# release page", whichever engine it is. Composites that care about a program
# bringing its own interpreter reference this rather than naming Bun.
- id: js-runtime-release-archive-url
  desc: References a standalone JavaScript runtime release archive
  crit: notable
  conf: 0.92
  for: [python, javascript, typescript]
  any:
  - id: bun-release-archive-url
  - id: bun-release-asset-filename
  - id: deno-release-archive-url
  - id: deno-release-asset-filename
- id: github-raw-browser-fetch
  desc: Fetch API reads GitHub raw content
  conf: 0.85
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-any
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
- id: github-raw-fetch
  desc: Fetches content from GitHub raw endpoint
  conf: 0.85
  any:
  - id: github-raw-curl-fetch
  - id: github-raw-wget-fetch
  - id: github-raw-browser-fetch
- id: github-raw-mutable-fetch
  desc: Fetches GitHub raw content from mutable ref
  conf: 0.88
  all:
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-refs
  - id: github-raw-fetch
