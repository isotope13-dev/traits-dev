defaults:
  for: [pe, batch, powershell, javascript, vbs, python, csharp, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.88
  attack: T1105
  mbc: E1105

traits:
  - id: bits-transfer-powershell-call
    desc: PowerShell BITS transfer cmdlet
    conf: 0.9
    attack: T1197
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: Start-BitsTransfer

  - id: bits-transfer-command-text
    desc: BITS transfer command text
    conf: 0.86
    attack: T1197
    for: [batch, pe]
    if:
      type: text
      regex: Start-BitsTransfer|Import-Module\s+BitsTransfer

  - id: bitsadmin-job-lifecycle
    desc: BITSAdmin job lifecycle command
    conf: 0.9
    attack: T1197
    if:
      type: text
      regex: '(?i)bitsadmin\s+/(create|resume|complete)\b'
    unless:
      - id: well-known/lib/ui/ace-editor

  - id: lnk-bitsadmin-transfer-download
    desc: LNK invokes BITSAdmin remote download
    crit: notable
    conf: 0.96
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bbitsadmin(\.exe)?\s+/transfer\b.{0,120}\s+/download\b'

  - id: bits-manager-interface
    desc: Windows BITS manager COM interface
    crit: notable
    conf: 0.92
    for: [pe, dll]
    if:
      type: text
      exact: IBackgroundCopyManager
      section: rdata
  - id: download-url-field-set--download
    desc: Download manager URL field (DownloadURL)
    crit: component
    if:
      type: text
      word: DownloadURL
  - id: download-url-field-set--source
    desc: Download manager URL field (SrcURL)
    crit: component
    if:
      type: text
      word: SrcURL
  - id: download-url-field-set--csr
    desc: Download manager URL field (CsrURL)
    crit: component
    if:
      type: text
      word: CsrURL
  - id: download-url-field-set--buy
    desc: Download manager URL field (BuyURL)
    crit: component
    if:
      type: text
      word: BuyURL

  - id: webpage-url-extraction
    desc: Webpage URL extraction messages
    if:
      type: text
      regex: 'Extracted new URL from (data|web page)'

  - id: mirror-url-discovery
    desc: Mirror URL discovery headers
    if:
      type: text
      regex: '(?i)(mirror_url=|mirror-url=|X-Mirror-URL)'

composite_rules:
  - id: bits-transfer-cmdlet
    desc: Uses a PowerShell BITS transfer command
    crit: notable
    conf: 0.9
    any:
      - id: bits-transfer-powershell-call
      - id: bits-transfer-command-text

  - id: download-url-field-set
    desc: Download manager URL fields
    crit: notable
    conf: 0.88
    any:
      - id: download-url-field-set--download
      - id: download-url-field-set--source
      - id: download-url-field-set--csr
      - id: download-url-field-set--buy
  - id: url-intake-and-extraction
    desc: Download manager URL intake extraction
    crit: notable
    conf: 0.9
    all:
      - id: download-url-field-set
    any:
      - id: webpage-url-extraction
      - id: mirror-url-discovery
