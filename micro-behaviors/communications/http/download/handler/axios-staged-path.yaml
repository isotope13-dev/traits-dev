defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
traits:
- id: axios-await-stream-shell-path
  desc: Awaited Axios stream shares shell destination
  if:
    type: tree-sitter
    query: "((statement_block (lexical_declaration (variable_declarator name: (identifier) @response value: (await_expression (call_expression function: (member_expression) @http))) (variable_declarator name: (identifier) @writer value: (call_expression function: (member_expression) @write arguments: (arguments (identifier) @dest)))) (expression_statement (sequence_expression (await_expression (new_expression arguments: (arguments (arrow_function body: (statement_block (expression_statement (sequence_expression (call_expression function: (member_expression object: (member_expression object: (identifier) @response2 property: (property_identifier) @data) property: (property_identifier) @pipe) arguments: (arguments (identifier) @writer2))))))))) (await_expression (new_expression arguments: (arguments (arrow_function body: (statement_block (expression_statement (call_expression function: (identifier) @exec arguments: (arguments (template_string (template_substitution (identifier) @dest2)))))))))))))\n\
      \ (#eq? @write \"fs.createWriteStream\")\n (#eq? @pipe \"pipe\")\n (#eq? @data \"data\")\n (#eq? @exec \"exec\")\n (#eq? @http \"axios.get\")\n (#eq? @dest @dest2)\n (#eq? @writer @writer2)\n (#eq? @response @response2))"
- id: axios-finish-stream-shell-path
  desc: Axios stream completion launches its staged path
  if:
    type: tree-sitter
    query: "((call_expression function: (member_expression object: (call_expression function: (identifier) @http)) arguments: (arguments (arrow_function parameter: (identifier) @response body: (statement_block (lexical_declaration (variable_declarator name: (identifier) @writer value: (call_expression function: (member_expression) @write arguments: (arguments (identifier) @dest)))) (expression_statement (call_expression function: (member_expression object: (member_expression object: (identifier) @response2 property: (property_identifier) @data) property: (property_identifier) @pipe) arguments: (arguments (identifier) @writer2))) (expression_statement (call_expression function: (member_expression object: (identifier) @writer3 property: (property_identifier) @on) arguments: (arguments (string) @finish (arrow_function body: (statement_block (expression_statement (call_expression function: (identifier) @exec arguments: (arguments (template_string (template_substitution (identifier) @dest2))))))))))))))\n\
      \ (#eq? @write \"fs.createWriteStream\")\n (#eq? @pipe \"pipe\")\n (#eq? @data \"data\")\n (#eq? @exec \"exec\")\n (#eq? @http \"axios\")\n (#eq? @on \"on\")\n (#match? @finish \"finish\")\n (#eq? @writer @writer3)\n (#eq? @dest @dest2)\n (#eq? @writer @writer2)\n (#eq? @response @response2))"
composite_rules:
- id: axios-stream-shell-path
  desc: Axios response stream and shell share destination
  any:
  - id: axios-await-stream-shell-path
  - id: axios-finish-stream-shell-path
