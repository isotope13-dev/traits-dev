# The response alias, chunk and output file must belong to the same nested
# with/for chain. Merely having requests.get and a local write is insufficient.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-requests-stream-to-file
    desc: Streams HTTP response chunks to binary file
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((with_statement
          (with_clause (with_item value: (as_pattern
            (call function: (attribute object: (identifier) @requests
              attribute: (identifier) @get))
            alias: (as_pattern_target (identifier) @response))))
          body: (block
            (with_statement
              (with_clause (with_item value: (as_pattern
                (call function: (identifier) @open
                  arguments: (argument_list . (_) . (string) @mode .))
                alias: (as_pattern_target (identifier) @file))))
              body: (block
                (for_statement left: (identifier) @chunk
                  right: (call function: (attribute object: (identifier) @stream
                    attribute: (identifier) @iter))
                  body: (block (expression_statement
                    (call function: (attribute object: (identifier) @output
                      attribute: (identifier) @write)
                      arguments: (argument_list . (identifier) @written .))))))))) @download
          (#eq? @requests "requests") (#eq? @get "get")
          (#eq? @response @stream) (#eq? @open "open")
          (#match? @mode "^[\"']wb[\"']$") (#eq? @iter "iter_content")
          (#eq? @file @output) (#eq? @write "write") (#eq? @chunk @written))
