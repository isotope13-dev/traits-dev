defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.95
traits:
  - id: msbuild-downloadfile-http-source
    desc: MSBuild DownloadFile HTTP source URL
    if:
      type: text
      exclude_html_comments: true
      regex: '<DownloadFile\b[^>]{0,160}\bSourceUrl\s*=\s*["'']https?://'
composite_rules:
  - id: msbuild-prebuild-hostname-download
    desc: MSBuild pre-build download URL includes the machine hostname
    all:
      - id: metadata/build/manifest::msbuild-before-build-target
      - id: msbuild-downloadfile-http-source
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-computername-source
    near_lines: 3
  - id: nuget-msbuild-precompile-webhook-download
    desc: NuGet archive contains a pre-build DownloadFile task and webhook URL
    for: [nupkg, xml]
    platforms: [windows, unix]
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-targets-file
      - id: metadata/build/manifest::msbuild-before-compile-target
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-task
      - id: micro-behaviors/communications/url/host/oob::webhook-site-reference
