defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-format-browser-data-download
    desc: Formats a browser binary-data download template
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: string.format
      arg:
        kind: string
        substr: data:application/octet-stream;base64,
  - id: lua-format-browser-download-click
    desc: Formats a browser download-and-click template
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: string.format
      arg:
        kind: string
        regex: '\.download\s*=[\s\S]{0,100}\.click\(\)'
  - id: lua-format-browser-download-name
    desc: Formats a browser download filename
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: string.format
      arg:
        kind: string
        regex: '\.download\s*='
