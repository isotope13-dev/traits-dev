defaults:
  platforms: [unix, windows]
  for: [lua]
  crit: notable
  conf: 0.98
traits:
  - id: lua-format-browser-data-download
    desc: Formats a browser binary-data download template
    if:
      type: tree-sitter
      language: lua
      query: |
        ((function_call
          name: (dot_index_expression table: (identifier) @lib field: (identifier) @fn)
          arguments: (arguments . (string) @template))
          (#eq? @lib "string") (#eq? @fn "format")
          (#match? @template "data:application/octet-stream;base64,"))
  - id: lua-format-browser-download-click
    desc: Formats a browser download-and-click template
    if:
      type: tree-sitter
      language: lua
      query: |
        ((function_call
          name: (dot_index_expression table: (identifier) @lib field: (identifier) @fn)
          arguments: (arguments . (string) @template))
          (#eq? @lib "string") (#eq? @fn "format")
          (#match? @template "(?s)\\.download\\s*=[\\s\\S]{0,100}\\.click\\(\\)"))
  - id: lua-format-browser-download-name
    desc: Formats a browser download filename
    if:
      type: tree-sitter
      language: lua
      query: |
        ((function_call
          name: (dot_index_expression table: (identifier) @lib field: (identifier) @fn)
          arguments: (arguments . (string) @template))
          (#eq? @lib "string") (#eq? @fn "format")
          (#match? @template "\\.download\\s*="))
