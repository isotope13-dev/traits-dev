# ureq exposes response bodies as readers. Copying that reader into a newly
# created file proves materialization of the HTTP response, rather than merely
# importing or configuring an HTTP client.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1105

traits:
  - id: rust-response-reader-copy
    desc: Rust response reader copied to output
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\bio::copy\s*\([^,\n]{1,120}\.into_reader\s*\(\s*\)\s*,\s*&mut\s+\w+'

composite_rules:
  - id: rust-ureq-response-to-file
    desc: Rust writes ureq response to file
    crit: notable
    conf: 0.95
    near_bytes: 2600
    all:
      - id: micro-behaviors/communications/http/get::rust-ureq-get-request
      - id: micro-behaviors/fs/file/create::rust-file-create
      - id: rust-response-reader-copy
