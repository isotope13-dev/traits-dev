defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: javascript-download-helper-call
    desc: Calls JavaScript data download helper
    crit: component
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^download(Payload|File|Code|Data)$'
    unless:
      - id: micro-behaviors/communications/http/download/webextension::chrome-downloads-api

  - id: javascript-fetch-helper-call
    desc: Calls JavaScript data fetch helper
    crit: component
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^fetch(Payload|File|Code|Data)$'
    unless:
      - type: text
        regex: 'https://(www|data)\.sec\.gov/'

  - id: node-tar-extractor-reference
    desc: Node source references a tar archive extractor
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\btar\b'
  # Handler names that explicitly identify a payload/file transfer.  Keep the
  # vocabulary narrow: UI actions such as handleDownloadEvents are not network
  # download behavior and belong nowhere in a dropper signature.
  - id: node-payload-download-handler
    desc: Node handler named for payload download
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(handle|process)[A-Za-z0-9_]*download(File|Payload|Module)s?\b'
  - id: node-payload-upload-handler
    desc: Node handler named for payload upload
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(handle|process)[A-Za-z0-9_]*upload(File|Payload|Module)s?\b'
  - id: browser-forced-download
    desc: Browser creates forced download link
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'createObjectURL[\s\S]{0,300}(\.click\(|download\s*=)|downloadElement\.download\s*='
    not:
      - substr: duplicati-config.
      - substr: downloadFile(o,e){let t=window.URL.createObjectURL(o)
  # Object-URL creation is a neutral URL capability, not proof of an HTTP
  # download. The canonical atom lives under communications/url/object-url;
  # the download composites reference it alongside their actual download sink.
  - id: browser-ms-save-or-open-blob
    desc: Uses legacy browser Blob save API
    crit: notable
    conf: 0.94
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\bmsSaveOrOpenBlob\s*\('
  - id: api-download-route
    desc: HTTP download API route
    crit: notable
    conf: 0.84
    if:
      type: text
      exact: /api/download

  - id: api-file-share-upload-route
    desc: HTTP file-share upload API route
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: /api/file-share/upload

  - id: api-file-share-download-route
    desc: HTTP file-share download API route
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'file-share.{0,40}download'
  - id: php-content-disposition-readfile
    desc: PHP readfile download response
    crit: notable
    conf: 0.88
    for: [php]
    if:
      type: text
      regex: 'Content-Disposition[\s\S]{0,220}readfile\s*\('

  - id: caller-url-binary-fetch
    desc: Fetches binary response from caller-provided URL
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetchImpl\s*\(\s*url\s*\)[\s\S]{0,500}\.arrayBuffer\s*\('

  - id: node-http-stream-to-file-text
    desc: HTTP response streamed to file through aliases
    crit: notable
    conf: 0.9
    attack: T1105
    for: [javascript, typescript]
    if:
      type: text
      regex: 'createWriteStream\s*\([^)]{1,120}\)[\s\S]{0,900}\.get\s*\([\s\S]{0,500}\.pipe\s*\('

  # Node download helpers often put headers and redirect hops between https.get
  # and the pipe-to-file, so require the GET to precede the write-stream rather
  # than the reverse order the alias matcher above expects.
  - id: node-https-get-write-stream-pipe
    desc: HTTPS GET piped to write stream
    crit: notable
    conf: 0.92
    attack: T1105
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bhttps\.get\s*\([\s\S]{0,999}createWriteStream\s*\([\s\S]{0,400}\.pipe\s*\('

composite_rules:
  - id: node-http-stream-to-archive
    desc: Node HTTP response streamed into an archive extractor
    crit: notable
    conf: 0.9
    attack: T1105
    for: [javascript, typescript]
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/response::node-response-pipe
      - id: node-tar-extractor-reference
    any:
      - id: micro-behaviors/fs/write/file/direct::create-write-stream
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: node-http-stream-to-file
    desc: Node HTTP response streamed to a file
    crit: notable
    conf: 0.92
    attack: T1105
    for: [javascript, typescript]
    # Header objects and a redirect hop routinely push https.get 14+ lines above
    # createWriteStream/pipe; 12 lines missed real download helpers.
    near_lines: 20
    all:
      - id: micro-behaviors/fs/write/file/direct::create-write-stream
      - id: micro-behaviors/communications/http/response::node-response-pipe
      - id: micro-behaviors/communications/http/request/client::node-http
