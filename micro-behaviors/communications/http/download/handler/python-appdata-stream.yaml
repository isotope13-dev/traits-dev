# Bind the caller's APPDATA argument to the helper's destination parameter,
# saved path, HTTP stream, and output handle. An APPDATA read beside an
# unrelated download is insufficient. This is neutral staging, not persistence.
defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-streamed-download-appdata
    desc: Streams HTTP response into APPDATA file
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition name: (identifier) @helper
            parameters: (parameters . (identifier) @url . (identifier) @directory .)
            body: (block
              (expression_statement (assignment left: (identifier) @saved
                right: (call function: (attribute) @join
                  arguments: (argument_list . (identifier) @destination . (_) .))))
              (with_statement
                (with_clause (with_item value: (as_pattern
                  (call function: (attribute) @get
                    arguments: (argument_list . (identifier) @requested (_)*))
                  alias: (as_pattern_target (identifier) @response))))
                body: (block
                  (with_statement
                    (with_clause (with_item value: (as_pattern
                      (call function: (identifier) @open
                        arguments: (argument_list . (identifier) @opened . (string) @mode .))
                      alias: (as_pattern_target (identifier) @file))))
                    body: (block
                      (for_statement left: (identifier) @chunk
                        right: (call function: (attribute object: (identifier) @stream
                          attribute: (identifier) @iter))
                        body: (block (expression_statement
                          (call function: (attribute object: (identifier) @output
                            attribute: (identifier) @write)
                            arguments: (argument_list . (identifier) @written .)))))))))))
          (function_definition body: (block
            (expression_statement (assignment left: (identifier) @appdata
              right: (call function: (attribute) @getenv
                arguments: (argument_list . (string) @environment .))))
            (if_statement condition: (identifier) @guard
              consequence: (block
                (expression_statement (assignment right: (call
                  function: (identifier) @invoked
                  arguments: (argument_list . (_) . (identifier) @supplied .))))))))) @download
          (#eq? @join "os.path.join") (#eq? @directory @destination)
          (#eq? @saved @opened) (#eq? @get "requests.get") (#eq? @url @requested)
          (#eq? @open "open") (#match? @mode "^[\"']wb[\"']$")
          (#eq? @response @stream) (#eq? @iter "iter_content")
          (#eq? @file @output) (#eq? @write "write") (#eq? @chunk @written)
          (#eq? @getenv "os.getenv") (#match? @environment "^[\"']APPDATA[\"']$")
          (#eq? @appdata @guard) (#eq? @appdata @supplied) (#eq? @helper @invoked))
