defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, markdown, javascript]

# These facts establish an install-hook download/chmod context and documented
# setup prompts, not password capture, concealment, or malicious next stages.
composite_rules:
  - id: install-download-password-dialog-documentation
    desc: Install download and chmod beside password-dialog docs
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/documentation/claims::setup-password-dialog-claim
      - id: metadata/package/documentation/claims::silent-background-setup-claim
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
