defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: powershell-download-xor-temp-write
    desc: PowerShell download, XOR and temp write text
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'DownloadData\(\$url\)[\s\S]{0,220}-bxor[\s\S]{0,220}WriteAllBytes\(\$tmp'
