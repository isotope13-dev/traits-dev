defaults:
  for: [asp]
  platforms: [windows]
composite_rules:
  - id: asp-ip-restricted-binary-file-response
    desc: IP-restricted ASP page returns request-selected binary data
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/superglobal::asp-allowlist-remote-addr-gate
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/communications/http/server/request::classic-asp-collection-request-field
      - id: micro-behaviors/communications/http/server/managed::aspnet-response-binary-write

# The listing half of the same tool shape: a gated page that resolves a
# request-chosen folder through FileSystemObject exposes the server layout
# to the operator for follow-on reads through the file endpoint.
