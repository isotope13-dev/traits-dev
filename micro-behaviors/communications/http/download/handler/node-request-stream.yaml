defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-request-response-to-file
    desc: Pipes Node response stream into file
    crit: notable
    conf: 0.95
    # Bind the request object, filesystem stream, and pipe destination in one
    # statement block. Imports or nearby file writes alone are insufficient.
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration kind: "const"
            (variable_declarator name: (identifier) @file
              value: (call_expression
                function: (member_expression
                  object: (identifier) @fs
                  property: (property_identifier) @create)
                arguments: (arguments (_) .))))
          (lexical_declaration kind: "const"
            (variable_declarator name: (identifier) @response
              value: (call_expression
                function: (identifier) @request
                arguments: (arguments (object
                  (pair key: (property_identifier) @url value: (_))) .))))
          (expression_statement (call_expression
            function: (member_expression
              object: (identifier) @piped
              property: (property_identifier) @pipe)
            arguments: (arguments . (identifier) @destination .)))) @download
          (#eq? @fs "fs")
          (#eq? @create "createWriteStream")
          (#eq? @request "request")
          (#eq? @url "url")
          (#eq? @pipe "pipe")
          (#eq? @file @destination)
          (#eq? @response @piped))
