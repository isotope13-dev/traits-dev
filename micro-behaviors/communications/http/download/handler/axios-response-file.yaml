defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: axios-response-data-file-write
    desc: Axios promise response body written to file
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression function: (identifier) @http)
            property: (property_identifier) @then)
          arguments: (arguments
            (arrow_function
              [(identifier) @response
               (formal_parameters . (identifier) @response .)]
              body: (statement_block
                (expression_statement
                  (call_expression
                    function: (member_expression
                      object: (identifier) @fs
                      property: (property_identifier) @write)
                    arguments: (arguments
                      (_) . (member_expression
                        object: (identifier) @body
                        property: (property_identifier) @data) .))))))) @download
          (#eq? @http "axios")
          (#eq? @then "then")
          (#eq? @response @body)
          (#eq? @fs "fs")
          (#eq? @write "writeFileSync")
          (#eq? @data "data"))
