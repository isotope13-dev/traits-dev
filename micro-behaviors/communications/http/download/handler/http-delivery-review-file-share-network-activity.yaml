defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]


composite_rules:
  - id: file-share-pe-mime-password-api-clues
    desc: PE MIME, password and file-share API clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/header/content-type::pe-portable-executable-media-type
      - id: micro-behaviors/communications/http/download/handler::api-file-share-upload-route
      - id: micro-behaviors/communications/http/download/handler::api-file-share-download-route
      - id: micro-behaviors/communications/http/token-auth::x-download-password-header
