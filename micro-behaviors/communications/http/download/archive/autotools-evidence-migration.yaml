defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
composite_rules:
  - id: configure-irssi-remote-glib-stage
    desc: Configure fetch and unpack GLib clues
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: metadata/build/autotools::configure-marker
      - id: micro-behaviors/communications/http/download/wget::configure-irssi-glib-wget-command
      - id: micro-behaviors/process/interpreter/eval/direct::configure-irssi-glib-eval-download
      - id: micro-behaviors/data/archive/extract/tar::configure-irssi-glib-unpack
