defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
composite_rules:
  - id: rust-build-verified-native-source-download
    desc: Cargo source archive and checksum clues
    crit: component
    conf: 0.94
    for:
      - rust
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/process/create/subprocess/configure::rust-command-curl-wget
      - id: micro-behaviors/communications/url/external/github::github-archive-ref-download
      - id: metadata/build/compiler::cmake-build-ref
      - id: metadata/lang/source/shape::rust-sha256-hex-binding
      - id: metadata/lang/source/shape::rust-hash-comparison-text
      - id: micro-behaviors/process/create/subprocess/configure::rust-build-tar-extract-command
