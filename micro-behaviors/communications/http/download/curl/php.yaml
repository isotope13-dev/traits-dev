defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1105

traits:
  - id: php-curl-variable-file-write
    desc: PHP cURL precedes variable file write
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'curl_exec\s*\([^;]{0,40};[\s\S]{0,180}file_put_contents\s*\([^,]{1,60},\s*\$'

  - id: php-curl-variable-fwrite
    desc: PHP cURL precedes variable fwrite
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'curl_exec\s*\([^;]{0,40};[\s\S]{0,360}fwrite\s*\([^,]{1,60},\s*\$'

composite_rules:
  - id: php-curl-response-file-write
    desc: PHP writes a cURL response to file
    crit: notable
    conf: 0.94
    any:
      - id: php-curl-variable-file-write
      - id: php-curl-variable-fwrite
