composite_rules:
- id: shell-silent-ip-download
  crit: notable
  desc: Silent curl output beside IPv4 download URL
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/download/curl::curl-silent-output
  - id: micro-behaviors/communications/http/download/cli::curl-wget-ipv4-url
  unless:
  - id: micro-behaviors/communications/http/header/custom::aws-imds-token-ttl-header
  - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
traits: []
defaults:
  platforms:
  - windows
  - unix
  for:
  - shell
