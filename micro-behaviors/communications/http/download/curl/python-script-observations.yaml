defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: curl-slo-variable-output
    desc: curl -sLo variable output
    crit: notable
    conf: 0.9
    platforms: [unix]
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
    if:
      type: text
      regex: 'curl\s+-sLo\s+\{?[A-Za-z_][A-Za-z0-9_]*\}?'
  - id: python-argv-curl-silent-url
    desc: Python argv curl -sL URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?s)["'']curl["'']\s*,\s*["'']-sL["'']\s*,\s*["'']https?://'
