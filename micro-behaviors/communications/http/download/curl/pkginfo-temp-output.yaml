# Command text in package metadata may be documentation, not an install hook.
# Keep the download observation neutral; consumers must establish execution.
defaults:
  platforms: [unix, windows]
  for: [pkginfo]
traits:
- id: curl-url-temp-output-reference
  desc: Curl command references URL and /tmp output
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: "curl\\s+(-[A-Za-z]{1,8}\\s+){0,4}https?://[^\"\\s]{1,220}\\s+-o\\s+/tmp/[^\"\\s&;]{1,80}"
