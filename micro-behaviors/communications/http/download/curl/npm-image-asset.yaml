defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-script-curl-image-output
    desc: npm curl writes an image-named file
    crit: notable
    conf: 0.94
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)(^|[|;&])\s*curl\s+https?://\S+\s+(--output|-o)\s+\S+\.(png|jpe?g|gif|webp)(\s|$)'
