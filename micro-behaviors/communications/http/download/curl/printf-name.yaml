defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97
traits:
  - id: printf-curl-name-format
    desc: printf constructs a curl command name
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '^(c|\\143|\\x63)(u|\\165|\\x75)(r|\\162|\\x72)(l|\\154|\\x6c)$'
  - id: printf-curl-name-percent-b
    desc: printf constructs a curl command name
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '^(c|\\143|\\x63)(u|\\165|\\x75)(r|\\162|\\x72)(l|\\154|\\x6c)$'


composite_rules:
  - id: printf-curl-name
    desc: printf constructs a curl command name
    conf: 0.97
    any:
      - id: printf-curl-name-format
      - id: printf-curl-name-percent-b
