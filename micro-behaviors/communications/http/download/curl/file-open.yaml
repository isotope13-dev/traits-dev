defaults:
  platforms: [unix, macos]
  for: [shell]

composite_rules:
  - id: curl-output-and-opener
    desc: Curl output option near system opener invocation
    crit: notable
    conf: 0.9
    scope: file
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/process/create/shellexec::open-file-command
