defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  # Overlaps the canonical `curl-cmd` in ../curl/shell.yaml, which anchors on a
  # command-start boundary and also covers `curl.exe` and `-d`. Kept separate
  # only because six composites are calibrated against this looser form; the
  # two should be consolidated onto `curl-cmd` in a deliberate pass.
  - id: curl-invoked-with-url-or-option
    desc: curl invoked with URL or option
    crit: component
    conf: 0.3
    if:
      type: text
      regex: \bcurl(\s+http|\s+--|\s+-[A-CE-Za-ce-z])
    not:
      - substr: curl --help
      - exact: "curl http://npmjs.org/install.sh | sh"
    unless:
      # Docusaurus page chunks preserve curl examples in code blocks; they do
      # not invoke curl at runtime.
      - id: metadata/file/profile/identity::docusaurus-docs-bundle
  - id: kubectl-manifest-curl-install-example
    desc: Documented curl fetch for kubectl apply
    crit: baseline
    conf: 0.95
    for: [javascript, typescript, html, markdown, shell]
    if:
      type: text
      regex: 'curl -k -L[^\n]{0,240}\| kubectl apply'
  - id: source-curl-insecure-option
    desc: curl disables TLS certificate verification
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    attack: T1553.004
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?\b.{0,120}\s(-[A-Za-z]*k[A-Za-z]*|--insecure)\b'
    unless:
      - id: kubectl-manifest-curl-install-example
      - id: well-known/lib/ui/swagger-ui::swagger-ui-bundle-marker
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: micro-behaviors/communications/http/tls::curl-insecure
  - id: source-curl-output-option
    desc: curl output file source
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    attack: T1105
    if:
      type: text
      # CMD permits carets inside command names, and curl permits short options
      # to be clustered (for example, `c^u^r^l -sLko output`).  Both forms
      # still express the same output-file behavior as plain `curl -o`.
      # `[A-Za-z]*o[A-Za-z]*` let any option cluster merely CONTAINING an `o`
      # qualify, so `curl -XPOST -d"$body" http://...` reported an output file.
      # curl's short options are single letters, so the cluster ends at the
      # `o` -- anchor the boundary there.
      regex: '(?i)\bc\^?u\^?r\^?l(\.exe)?\b.{0,180}\s(-[A-Za-z]*o\b|--output\b)\s.{1,120}'
  - id: source-curl-archive-file
    desc: curl archive filename source
    crit: component
    conf: 0.9
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    if:
      type: text
      regex: '(?i)\bcurl\b.{0,260}\.(zip|update|7z|rar)\b'
  - id: source-curl-script-url
    desc: curl script payload URL
    crit: component
    conf: 0.95
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?\b.{0,160}https?://[^\s"'']{1,80}\.(bat|cmd|scr)\b'
  - id: source-curl-binary-url
    desc: curl binary payload URL
    crit: component
    conf: 0.95
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?\b.{0,160}https?://[^\s"'']{1,80}\.(exe|msi)\b'
  - id: curl-in-js-exec
    desc: JavaScript exec() invokes curl command
    crit: notable
    conf: 0.92
    for: [javascript]
    if:
      type: text
      regex: \bexec\s*\(\s*['"]curl\b
  - id: js-obfuscator-curl-output-literal
    desc: Obfuscator embeds curl -o in string table
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    attack: T1105
    if:
      type: text
      substr: 'curl\x20-L\x20-o'
  - id: curl-pipe-shell-in-js-exec
    desc: JavaScript exec runs curl output through shell
    crit: notable
    conf: 0.95
    for: [javascript]
    attack: T1059.004
    if:
      type: tree-sitter
      kind: call
      regex: '\bexec\s*\(\s*["''](/bin/(ba)?sh\s+-c\s+["'']?)?curl\s+.{0,200}\|\s*(/bin/)?(sh|bash)\b'
  - id: node-execsync-curl-download
    desc: Node execSync invokes curl download
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    attack: T1105
    if:
      type: symbol
      kind: call
      exact: execSync
      arg:
        kind: string
        substr: curl
  - id: http-download-shell-launch-literal
    desc: HTTP download followed by shell launcher literal
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    attack: T1105,T1059
    if:
      type: text
      regex: '\bcurl\b.{0,120}https?://.{0,120}[;&|].{0,40}\b(start|sh|bash)\b'
    unless:
      # Test suites often assert that an unsafe installer string is absent;
      # the literal is not an executed download in that context.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context

composite_rules:
  - id: source-curl-executable-url
    desc: curl executable payload URL
    crit: component
    conf: 0.95
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    any:
      - id: source-curl-script-url
      - id: source-curl-binary-url
  - id: source-curl-insecure-executable-download
    desc: curl insecure executable download source
    crit: notable
    conf: 0.97
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    attack: T1105,T1553.004
    near_bytes: 512
    all:
      - id: source-curl-insecure-option
      - id: source-curl-output-option
      - id: source-curl-executable-url
  - id: source-curl-archive-output
    desc: curl archive download source
    crit: notable
    conf: 0.94
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    attack: T1105
    near_bytes: 512
    all:
      - id: source-curl-output-option
      - id: source-curl-archive-file
