defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - -clojure
  - -mirc
  - -ircii
  crit: notable
traits:
- id: curl-hidden-scratch-output
  desc: Curl writes to hidden scratch path
  conf: 0.9
  if:
    type: text
    regex: \bcurl\s+-o[^\n]{0,120}(/dev/shm/|/tmp/)\.[a-zA-Z0-9][\w.-]{2,120}\b
