defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - -clojure
  - -mirc
  - -ircii
  crit: suspicious
traits:
- id: curl-hidden-scratch-output
  desc: Curl writes to hidden scratch path
  conf: 0.9
  if:
    type: text
    regex: \bcurl\s+-o[^\n]{0,120}(/dev/shm/|/tmp/)\.[a-zA-Z0-9][\w.-]{2,120}\b
  not:
    - substr: statSync("/run/.containerenv
    - regex: /(tmp|var/tmp|run|dev/shm)/\.(netdata|X11|ICE|Test|cache|gnupg|config)[a-zA-Z0-9._-]*
    - regex: mktemp\s+-d\s+/(tmp|var/tmp|run|dev/shm)/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\.X{3,}
    - regex: /(tmp|var/tmp|run|dev/shm)/\.spinner\.pid\b
    - regex: /tmp/\.[A-Za-z0-9._-]*(check|probe|test)[A-Za-z0-9._-]*
  downgrade:
    any:
      - id: metadata/package/testing/compiled::go-compiled-test-binary
