# CALL commands lack command_sites facts in the installed parser.
# Anchor to executable batch lines, excluding rem and echo examples.
defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.98

traits:
  - id: batch-curl-ipv4-url
    desc: Batch curl command targets an IPv4 URL
    if:
      type: text
      exclude_comments: true
      regex: '(?im)^[ \t]*@?(call[ \t]+)?curl(\.exe)?[ \t]+.{0,240}https?://\d{1,3}(\.\d{1,3}){3}\b'
