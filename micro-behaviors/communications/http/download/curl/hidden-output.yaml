defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: curl-silent-short-flag-url
    desc: Curl silent flag with remote URL
    conf: 0.9
    for: [shell, python, javascript, typescript, ruby, go, rust, dockerfile]
    if:
      type: text
      regex: 'curl(\.exe)?\s+[^|&\n]{0,120}-s[^|&\n]{0,120}(https?://|ftp://)'
    not:
      - substr: api.coingecko.com/api/v3/simple/price
      - substr: curl --unix-socket
      - regex: 'puts\s+["''][^"''\n]{0,120}curl\s+--unix-sock(et)?'

  - id: curl-silent-long-flag-url
    desc: Curl silent option with remote URL
    conf: 0.9
    for: [shell, python, javascript, typescript, ruby, go, rust, dockerfile]
    if:
      type: text
      regex: 'curl(\.exe)?\s+[^|&\n]{0,120}--silent[^|&\n]{0,120}(https?://|ftp://)'
    not:
      - substr: api.coingecko.com/api/v3/simple/price
      - substr: curl --unix-socket
      - regex: 'puts\s+["''][^"''\n]{0,120}curl\s+--unix-sock(et)?'

  - id: shell-curl-hidden-output
    desc: Curl downloads to a hidden temporary path
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @client) !redirect
          . argument: (word)* @flags
          . argument: [(word) (raw_string) (string . (string_content) .)] @url
          . argument: (word) @output
          . argument: [(word) (raw_string) (string . (string_content) .)] @destination .)
         (#eq? @client "curl")
        (#match? @flags "^(-[fsSLv]+|--silent|--show-error|--fail|--location)$")
        (#match? @url "^['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
        (#match? @output "^(-o|--output)$")
         (#match? @destination "^['\"]?/(tmp|var/tmp|dev/shm)/\\.[A-Za-z0-9_.-]+['\"]?$"))

composite_rules:
  - id: curl-silent-stdout
    desc: Shell text contains a curl silent-output command
    crit: notable
    conf: 0.9
    mbc: C0002
    attack: T1105
    size_max: 5000
    any:
      - id: curl-silent-short-flag-url
      - id: curl-silent-long-flag-url
    unless:
      - id: well-known/tool/packaging/composer::composer-installer-url
      - id: metadata/file/catalog/identity/
      - id: well-known/app/finance/coingecko::benign-coingecko-price-api
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/download/curl::curl-output-redirect
      - id: metadata/build/docker::dockerfile-basename
