defaults:
  for: [shell]
  platforms: [unix]
  crit: suspicious
  conf: 0.96

traits:
  # Tool configuration dotfiles (.yamllint.yml, .clang-format, .codespellrc,
  # Yarn's .yarnrc.yml) are named by the tool that reads them. Super-linter
  # reads that same set from .github/linters/, a GitHub-required path.
  # GoReleaser and golangci-lint also expect conventional root dotfiles.
  # Exclude their exact output arguments, never a filename in the URL or
  # a hidden /tmp path; those do not establish a conventional config fetch.
  - id: shell-curl-hidden-output
    desc: Curl downloads to a hidden file
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @client)
          argument: (word) @output_flag
          argument: (word) @output_path) @download
        (#eq? @client "curl")
        (#match? @output_flag "^(?:-[fsSLvk]*o|--output)$")
        (#match? @download "(?:^|[[:space:]'\"])https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
        (#match? @output_path "^(?:[^'\"\\s]*/)?\\.[A-Za-z0-9_][A-Za-z0-9_.-]*['\"]?$")
        (#not-match? @output_path "^(?:[^'\"\\s]*/)?\\.(?:yamllint|eslintrc|prettierrc|stylelintrc|markdownlint|editorconfig|clang-format|clang-tidy|flake8|pylintrc|codespellrc|htmlhintrc|hadolint|yarnrc|jscpd|goreleaser|golangci)(?:[._-][A-Za-z0-9_.-]*)?['\"]?$")
        (#not-match? @output_path "^(?:[^'\"\\s]*/)?\\.github/linters/"))

composite_rules:
