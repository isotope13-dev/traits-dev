defaults:
  for: [shell]
  platforms: [unix]
  crit: suspicious
  conf: 0.96

traits:
  # Tool configuration dotfiles (`.yamllint.yml`, `.clang-format`,
  # `.codespellrc`) are named by the linter that reads them. Super-linter
  # reads that same set from `.github/linters/`, a path GitHub requires.
  - id: shell-curl-hidden-output
    desc: Curl downloads to a hidden file
    if:
      type: tree-sitter
      language: shell
      query: |
        ([
          (command name: (command_name (word) @client) !redirect
            . argument: (word)* @flags
            . argument: [(word) (raw_string) (string . (string_content) .)] @url
            . argument: (word) @output
            . argument: [(word) (raw_string) (string)] @destination .)
          (command name: (command_name (word) @client) !redirect
            . argument: (word)* @flags
            . argument: (word) @output
            . argument: [(word) (raw_string) (string)] @destination
            . argument: [(word) (raw_string) (string . (string_content) .)] @url .)
        ] @download
         (#eq? @client "curl")
        (#match? @flags "^(-[fsSLvk]+|--silent|--show-error|--fail|--location)$")
        (#match? @url "^['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
        (#match? @output "^(-[fsSLvk]*o|--output)$")
        (#match? @destination "^['\"]?([^'\"\\r\\n]*/)?\\.[A-Za-z0-9_][A-Za-z0-9_.-]*['\"]?$")
        (#not-match? @destination "^['\"]?([^'\"\\r\\n]*/)?\\.(yamllint|eslintrc|prettierrc|stylelintrc|markdownlint)(\\.(ya?ml|json))?['\"]?$")
        (#not-match? @destination "^['\"]?([^'\"\\r\\n]*/)?\\.(editorconfig|clang-format|clang-tidy|flake8|pylintrc|hadolint\\.ya?ml)['\"]?$")
        (#not-match? @destination "^['\"]?([^'\"\\r\\n]*/)?\\.(codespellrc|htmlhintrc|jscpd\\.json)['\"]?$")
        (#not-match? @destination "^['\"]?\\.github/linters/"))

composite_rules:
