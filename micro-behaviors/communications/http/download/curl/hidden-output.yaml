defaults:
  for: [shell]
  platforms: [unix]
  crit: suspicious
  conf: 0.96

traits:
  - id: shell-curl-hidden-output
    desc: Curl downloads to a hidden file
    if:
      type: tree-sitter
      language: shell
      query: |
        ([
          (command name: (command_name (word) @client) !redirect
            . argument: (word)* @flags
            . argument: [(word) (raw_string) (string . (string_content) .)] @url
            . argument: (word) @output
            . argument: [(word) (raw_string) (string)] @destination .)
          (command name: (command_name (word) @client) !redirect
            . argument: (word)* @flags
            . argument: (word) @output
            . argument: [(word) (raw_string) (string)] @destination
            . argument: [(word) (raw_string) (string . (string_content) .)] @url .)
        ] @download
         (#eq? @client "curl")
        (#match? @flags "^(-[fsSLvk]+|--silent|--show-error|--fail|--location)$")
        (#match? @url "^['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
        (#match? @output "^(-[fsSLvk]*o|--output)$")
        (#match? @destination "^['\"]?([^'\"\\r\\n]*/)?\\.[A-Za-z0-9_][A-Za-z0-9_.-]*['\"]?$"))

composite_rules:
