defaults:
  for: [shell]
  platforms: [unix]
  crit: suspicious
  conf: 0.96

traits:
  # Tool configuration dotfiles (.yamllint.yml, .clang-format, .codespellrc,
  # Yarn's .yarnrc.yml) are named by the tool that reads them. Super-linter
  # reads that same set from .github/linters/, a GitHub-required path.
  # GoReleaser and golangci-lint also expect conventional root dotfiles.
  # Exclude their exact output arguments, never a filename in the URL or
  # a hidden /tmp path; those do not establish a conventional config fetch.
  - id: shell-curl-hidden-output
    desc: Curl downloads to a hidden file
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @client) !redirect) @download
        (#eq? @client "curl")
        (#match? @download "(?s)^curl\\s+(?:(?:-[fsSLvk]+|--silent|--show-error|--fail|--location)\\s+)*(?:['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/][^'\"\\s]*['\"]?\\s+(-[fsSLvk]*o|--output)\\s+['\"]?([^'\"\\s]*/)?\\.[A-Za-z0-9_][A-Za-z0-9_.-]*['\"]?|(-[fsSLvk]*o|--output)\\s+['\"]?([^'\"\\s]*/)?\\.[A-Za-z0-9_][A-Za-z0-9_.-]*['\"]?\\s+['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/][^'\"\\s]*['\"]?)$")
        (#not-match? @download "(?:(?:['\"]?([^'\"\\r\\n]*/)?\\.(yamllint|eslintrc|prettierrc|stylelintrc|markdownlint)(\\.(ya?ml|json))?['\"]?)|(?:['\"]?([^'\"\\r\\n]*/)?\\.(editorconfig|clang-format|clang-tidy|flake8|pylintrc|hadolint\\.ya?ml|yarnrc(\\.yml)?)['\"]?)|(?:['\"]?([^'\"\\r\\n]*/)?\\.(codespellrc|htmlhintrc|jscpd\\.json)['\"]?)|(?:['\"]?\\.github/linters/))")
        (#not-match? @download "(?:-[fsSLvk]*o|--output)\\s+['\"]?\\.(goreleaser|golangci)\\.ya?ml['\"]?(?:\\s|$)"))

composite_rules:
