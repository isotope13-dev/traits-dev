defaults:
  platforms: [unix]
  for: [shell, python, javascript, elf]
traits:
# Linters and formatters look their configuration up under a fixed dotfile
# name (`yamllint` reads `.yamllint.yml`, clang-format `.clang-format`), so
# fetching a shared org config to that name follows the tool's convention
# rather than hiding the download.
- id: curl-relative-dotfile-output
  desc: curl command names relative dotfile output
  crit: suspicious
  conf: 0.7
  if:
    type: text
    regex: '\bcurl\b[^\n;|&]{0,160}\s-o\s+\.[A-Za-z0-9_][^\s/]{0,80}'
  not:
  - regex: '\s-o\s+\.(yamllint|eslintrc|prettierrc|stylelintrc|markdownlint)(\.(ya?ml|json))?$'
  - regex: '\s-o\s+\.(editorconfig|clang-format|clang-tidy|flake8|pylintrc|hadolint\.ya?ml)$'
