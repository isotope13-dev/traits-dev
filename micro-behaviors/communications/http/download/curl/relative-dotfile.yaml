defaults:
  platforms: [unix]
  for: [shell, python, javascript, elf]
traits:
# Linters, formatters, and Yarn look their configuration up under a fixed
# dotfile name (`yamllint` reads `.yamllint.yml`, Yarn reads `.yarnrc.yml`),
# GoReleaser and golangci-lint likewise use .goreleaser.yaml / .golangci.yml;
# fetching a shared config to that name follows the tool's convention
# rather than hiding the download. The same holds for `.env`, the fixed
# name docker compose and dotenv loaders read in a project directory.
- id: curl-relative-dotfile-output
  desc: curl command names relative dotfile output
  crit: suspicious
  conf: 0.7
  if:
    type: text
    # The output token has to end at the argument boundary. `-o .github/linters/...`
    # is a path that starts with a directory, not a relative dotfile name.
    regex: '\bcurl\b[^\n;|&]{0,160}\s-o\s+\.[A-Za-z0-9_][^\s/]{0,80}([\s;&|]|$)'
  not:
  - regex: '\s-o\s+\.(yamllint|eslintrc|prettierrc|stylelintrc|markdownlint)(\.(ya?ml|json))?([\s;&|]|$)'
  - regex: '\s-o\s+\.(editorconfig|clang-format|clang-tidy|flake8|pylintrc|hadolint\.ya?ml)([\s;&|]|$)'
  - regex: '\s-o\s+\.yarnrc(\.yml)?([\s;&|]|$)'
  - regex: '\s-o\s+\.(codespellrc|htmlhintrc|jscpd\.json)([\s;&|]|$)'
  - regex: '\s-o\s+\.(goreleaser|golangci)\.ya?ml([\s;&|]|$)'
  - regex: '\s-o\s+\.env([\s;&|]|$)'
