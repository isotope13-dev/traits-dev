defaults:
  platforms: [unix, windows]
  crit: notable
traits:
  - id: js-memdump-download-exec-argument
    desc: JavaScript exec argument curls memdump.py
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        index: 0
        kind: string
        regex: 'curl.{0,150}memdump\.py'
  - id: shell-memdump-download-pipeline
    desc: Shell pipeline curls memdump.py
    conf: 0.97
    for: [shell]
    if:
      type: tree-sitter
      query: |
        ((pipeline
          (command name: (command_name (word) @client) @download))
          (#eq? @client "curl")
          (#match? @download "memdump\\.py"))
composite_rules:
  - id: memdump-script-download-command
    desc: Shell or exec argument curls memdump.py
    conf: 0.97
    for: [shell, javascript, typescript]
    any:
      - id: shell-memdump-download-pipeline
      - id: js-memdump-download-exec-argument
