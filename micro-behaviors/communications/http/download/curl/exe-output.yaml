defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: curl-output-to-exe-path
  desc: curl -o writes to an executable-file path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bcurl(\.exe)?\s+[^\r\n]{0,240}\s+-o\s+[^&|\r\n]{1,180}\.(exe|dll)\b'
# `curl ... -o %TEMP%\name.exe`: the download target is an executable in
# the per-user temp directory.
- id: curl-output-to-temp-exe
  desc: curl -o writes an EXE into TEMP
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bcurl(\.exe)?\s[^\r\n]{0,240}\s-o\s+"?[%!](TEMP|TMP)[%!]\\[^\s"&|]{1,80}\.exe'
- id: curl-txt-redirect-exe
  desc: curl output redirected to executable path
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bcurl(\.exe)?\b[^>\r\n]{0,240}>\s*[^&|\r\n]{1,180}\.(exe|dll)\b'
