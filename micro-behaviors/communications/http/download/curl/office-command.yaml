# The document's macro carries a shell curl command that saves a remote file.
# No matcher leg requires launching that saved file.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: office-macro-shell-curl-download
    desc: Document carries shell curl download command
    crit: suspicious
    conf: 0.95
    attack: T1105
    mbc: C0002
    all:
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
