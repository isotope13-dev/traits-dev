defaults:
  for: [scripts, macho]
  platforms: [unix]
traits:
- id: quiet-domain-download-exec
  desc: Curl output targets a temporary path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\bcurl\s+-\S{1,8}[fkLsS]{2,}\S*\s+https?://\S{1,80}\s*[|>]\s*\S{0,40}/tmp/\S+'
  not:
  - regex: 'https?://(127\.0\.0\.1|localhost|::1|0\.0\.0\.0)\b'
  unless:
  - id: well-known/tool/sysadmin/kubernetes
- id: ai-workflow-update-download
  desc: Curl command references an AI helper path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'curl\b.{0,120}/(n8n|workflow|agent)/(update|helper)\b'
- id: curl-output-quoted
  desc: Curl command prefix with quoted output
  crit: notable
  conf: 0.88
  for: [macho]
  if:
    type: text
    exact: 'curl -f -L -s -o "'
