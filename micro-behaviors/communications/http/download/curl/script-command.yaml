# Script text carries a shell curl command that saves a remote file.
# No matcher leg requires launching that saved file.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: script-shell-curl-file-download
    desc: Script carries shell curl file-download command
    crit: notable
    conf: 0.95
    mbc: C0002
    all:
      - id: micro-behaviors/process/argument/option::windows-interpreter-command-syntax
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
