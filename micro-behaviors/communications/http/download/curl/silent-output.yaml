defaults:
  platforms: [windows, unix]
  for: [python, shell]
traits:
  - id: curl-silent-output
    desc: Silent curl with output path
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: 'curl\b[^\n]{0,50}(--silent[^\n]{0,50}--output|-s[^\n]{0,50}-o)\s*\S+'
      not:
        - regex: '(?i)(--output\s+|-o\s*)(/dev/null|NUL\b)'
