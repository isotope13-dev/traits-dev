defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: curl-programdata-batch-output
  desc: curl writes batch file to ProgramData
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: (?i)\bcurl(\.exe)?\b[^\r\n]{0,180}\s-o\s+"?C:\\ProgramData\\.{1,60}\.(bat|cmd)"?
composite_rules:
- id: curl-programdata-temp-script-profile
  desc: curl ProgramData and temp-script clues
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/download/curl::batch-curl-call
  - id: micro-behaviors/communications/http/download/curl::curl-programdata-batch-output
  - id: micro-behaviors/fs/path/script::batch-temp-script-line-path
  any:
  - id: micro-behaviors/fs/path/check::batch-temp-script-existence-check
  - id: micro-behaviors/communications/http/download/curl::curl-cmd
