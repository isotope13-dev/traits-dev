defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class]
  crit: notable

traits:
  - id: curl-fail-silent-url-reference
    desc: References curl flags and HTTP URL
    # markdown scope: agent-skill guidance embeds the same flags and URL in
    # fenced install commands, so the text observation holds under either
    # typing.
    for: [scripts, source, class, java_class, markdown]
    if:
      type: text
      regex: 'curl\s+-fsSL\s+https?://'
