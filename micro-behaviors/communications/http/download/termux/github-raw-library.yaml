defaults:
  platforms: [android, unix]
  for: [shell]

composite_rules:
- id: termux-github-raw-library-download
  desc: Termux installer downloads GitHub raw library
  crit: notable
  conf: 0.94
  all:
  - id: well-known/app/development/code-forge/github::shell-raw-github-base-url
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: micro-behaviors/fs/path/application/prefix::termux-usr-prefix
