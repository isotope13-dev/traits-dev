defaults:
  crit: notable
  for:
    - shell
  platforms:
    - linux
  attack: T1105
traits:
  - id: wget
    desc: BusyBox wget applet invocation
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: busybox
      arg:
        kind: identifier
        name: wget
  - id: busybox-wget-http-script
    desc: BusyBox wget downloads shell script
    conf: 0.9
    platforms: [unix, android]
    for: [elf, shell, c, cpp]
    if:
      type: text
      regex: '\bbusybox wget\s+https?://.{0,50}\.sh\b'
  - id: busybox-wget-http-reference
    desc: BusyBox wget HTTP download reference
    conf: 0.9
    for: [elf, shell, c, cpp]
    platforms: [unix, android]
    if:
      type: text
      regex: '\bbusybox\s+wget\s+https?://'
  - id: wget-http-url-reference
    desc: wget HTTP URL download reference
    conf: 0.9
    for: [elf, shell, c, cpp]
    platforms: [unix, android]
    if:
      type: text
      regex: '\bwget\b\s+(-[a-zA-Z]{1,8}\s+){0,4}https?://'
