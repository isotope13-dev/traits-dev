defaults:
  platforms: [linux]
  for: [elf]
traits:
- id: arch-suffixed-temp-fetch-options
  size_min: 512
  size_max: 500000000
  desc: BusyBox temp output and remote suffix options
  crit: notable
  conf: 0.99
  attack: T1105
  if:
    type: text
    # BusyBox fetch-to-/tmp loader grammar: the drop filename is
    # attacker-chosen per build (/tmp/kh here), so match the flag shape
    # and the arch-suffixed remote payload instead of the literal name.
    regex: '-l /tmp/[A-Za-z0-9._-]+ -r /[A-Za-z0-9._/-]+\.[a-z0-9]+\b'
    section: ".rodata"
