# Runtime installers and SDK sidecars commonly fetch a platform binary, set
# its execute bit, and launch it after an explicit API call. This records the
# complete behavior without inferring that the downloaded program is hostile.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  crit: notable
  conf: 0.95

composite_rules:
  - id: download-chmod-launch
    desc: Downloads, chmods, and launches a file
    near_lines: 80
    all:
      - id: micro-behaviors/fs/chmod/executable/mode
      - id: micro-behaviors/process/create/subprocess::process-execution
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/request/client::http-response
