# Two nearby download methods are common in installers. Neither the source
# URL nor the downloaded file is bound across these observations, so this
# records CLI co-occurrence without claiming fallback order or execution.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp]
composite_rules:
  - id: multiple-download-methods
    desc: Multiple file-download methods appear nearby
    crit: notable
    conf: 0.95
    needs: 2
    near_bytes: 8192
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file-command
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-call
      - id: micro-behaviors/communications/http/download/cli::bitsadmin-transfer-invocation
