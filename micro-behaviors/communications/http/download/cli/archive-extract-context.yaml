defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: hidden-archive-download-extract-context
    desc: Hidden PowerShell and archive extraction near an HTTP file download
    crit: suspicious
    conf: 0.98
    attack: T1105
    all:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/data/archive/extract/capability::powershell-archive-extract
