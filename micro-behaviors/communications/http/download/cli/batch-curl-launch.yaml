defaults:
  platforms: [windows]
composite_rules:
- id: batch-curl-output-launch-profile
  desc: Batch curl output beside program-launch clues
  crit: notable
  conf: 0.95
  for:
  - batch
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/download/cli::batch-download-tool-group
  - id: micro-behaviors/process/create/shell/batch::batch-program-launch-group
  - id: micro-behaviors/communications/http/download/curl::batch-curl-output-flag
  unless:
  - id: well-known/tool/development/cli/batch-scripts::pytorch-ci-sevenzip-installer
  - id: well-known/tool/development/cli/batch-scripts::intel-dle-official-installer
  - id: well-known/tool/development/cli/batch-scripts::protobuf-kokoro-wheel-builder
  - id: well-known/tool/development/cli/batch-scripts::appveyor-pypy-ci-installer
  - id: well-known/tool/development/cli/batch-scripts::appveyor-ci-batch-script
  # Empty-machine front door fetching its own bootstrap from the vendor repo
  # plus its companion service helper: the vendor's installer, not a dropper.
  - id: well-known/tool/development/cli/batch-scripts::mill-official-installer
  # CI worker setup that installs its own build tools (Kokoro job scripts).
  - id: metadata/build/ci/step::batch-kokoro-job-variable-test
