# A command reference is interesting but does not prove payload execution.
# Interpreter launching is already reported by the Python/bash capabilities.
# Combining those ordinary launches does not establish LOLBin abuse.
defaults:
  platforms: [unix]
  for: [java, class]
  crit: suspicious
traits:
  - id: java-curl-hidden-script-reference
    desc: JVM curl command names hidden shell script
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'curl[^\n]{0,180}/payload\.sh[^\n]{0,180}/tmp/\.callback\.sh'

