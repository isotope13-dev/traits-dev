defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-lolbin-download-launch-profile
  desc: Batch download tool near launch-command clues
  crit: suspicious
  conf: 0.9
  mbc: "C0002"
  all:
  - id: micro-behaviors/communications/http/download/cli::batch-download-tool-group
  - id: micro-behaviors/process/create/shell/batch::batch-program-launch-group
  any:
  - id: micro-behaviors/communications/http/download/cli::certutil-urlcache
  - id: micro-behaviors/communications/http/download/cli::bitsadmin-transfer-invocation
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-download
  - id: micro-behaviors/communications/http/download/curl::curl-output-to-exe-path
  - id: micro-behaviors/communications/http/download/curl::curl-txt-redirect-exe
  unless:
  - id: well-known/tool/development/cli/batch-scripts::pytorch-ci-sevenzip-installer
  - id: well-known/tool/development/cli/batch-scripts::appveyor-pypy-ci-installer
  # A CI job installs the services its test suite needs, which is genuinely
  # "download an executable and run it": PHP's
  # .github/scripts/windows/test_task.bat does `curl -sLo hMailServer.exe ...`
  # then `hMailServer.exe /verysilent` to set up the mail tests. The script
  # refuses to run outside GitHub Actions, and the official composer image
  # ships the PHP source, so it scored hostile.
  - id: metadata/build/ci/step::batch-github-actions-only-guard
