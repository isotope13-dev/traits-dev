composite_rules:
- for:
  - scripts
  - manifests
  - html
  - xml
  - dockerfile
  - package-lock.json
  - groovy
  platforms:
  - linux
  - macos
  - windows
  id: public-ip-fetch-hidden-chmod
  desc: Public-IP fetch beside hidden executable chmod
  crit: suspicious
  conf: 0.98
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/url/external-ip::curl-external-ip-request
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-path-command-container
- for:
  - shell
  platforms:
  - linux
  - macos
  - unix
  id: multiarch-ip-hidden-output-chmod
  desc: Arch-aware IP fetch with hidden-output chmod
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/url/external-ip::curl-external-ip-request
  - id: micro-behaviors/communications/http/download/cli::fetch-output-hidden-path-script
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-tmp-executable
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-aware-curl-download
  - id: micro-behaviors/communications/http/download/fallback::downloader-curl-wget-fallback
