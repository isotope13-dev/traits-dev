# Download Tool CLI Flags
# Neutral command-line flags for curl and wget
defaults:
  platforms: [unix]
  for: [shell, python, ruby, perl, javascript, typescript]
  crit: baseline
traits:
  - id: fetch-command-position-script
    desc: curl/wget in shell command position
    crit: component
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [shell, python, ruby, perl, javascript, typescript, applescript, vbs]
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*\$?(curl|wget)(\.exe)?\b'

  # Chaining or substitution operators make the downloader part of a larger
  # shell expression. Bare backticks and "$ curl" are deliberately excluded:
  # both are common Markdown command formatting, not execution evidence.
  - id: shell-chained-downloader-command
    desc: Shell operator precedes HTTP downloader command
    crit: notable
    conf: 0.93
    platforms: [linux, macos, windows]
    for: [shell, elf]
    if:
      type: text
      regex: '(;|&&|\|\||\$\()\s{0,4}(wget|curl|tftp)\s[^\n]{0,60}http://'

  - id: source-chained-downloader-command
    desc: HTTP downloader follows shell operator
    crit: notable
    conf: 0.93
    platforms: [linux, macos, windows]
    for: [source, python, javascript, perl]
    if:
      type: literal
      regex: '(;|&&|\|\||\$\()\s{0,4}(wget|curl|tftp)\s[^\n]{0,60}http://'

  - id: fetch-if-command-position-script
    desc: Shell condition invokes curl or wget
    crit: component
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [shell, python, ruby, perl, javascript, typescript, applescript, vbs]
    if:
      type: text
      # Covers `if curl`, `then if wget`, and `if $(curl ...)` without making
      # the output-option matcher borrow an option from a later command.
      regex: '(?m)(^|[;&|])[ \t]*(then[ \t]+)?if[ \t]+(\$\([ \t]*)?\$?(curl|wget)(\.exe)?\b'

  - id: fetch-output-option-script
    desc: curl/wget text includes output option
    crit: component
    conf: 0.85
    platforms: [linux, macos, windows]
    for: [shell, python, ruby, perl, javascript, typescript, applescript, vbs]
    if:
      type: text
      # Stop at shell separators so a later command's `-o` cannot be borrowed.
      regex: '\b(curl|wget)(\.exe)?\b[^\n;&|]{0,160}(-[A-Za-z]*[oO]|--output)\s+\S+'
    not:
      - regex: '(-[A-Za-z]*[oO]|--output)[ \t]+/dev/null\b'
      - regex: '(-[A-Za-z]*[oO]|--output)[ \t]+os\.devnull\b'
      - regex: '\b(curl|wget)(\.exe)?\b[^\n]{0,240}>[ \t]*[^=]'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  # Same downloader command, written inside a string literal instead of at the
  # start of a shell line: os.system("curl ... -o /tmp/x"), execSync('wget -O
  # ...'), %x{curl ... -o ...}. The sibling above anchors on `^\s*` to keep
  # prose and heredoc examples out, which is right for a shell script but blind
  # to every dropper that wraps the command in its host language's exec call --
  # the opening quote is the command position there.
  #
  # The quote is what keeps prose out here too: documentation writes `$ curl`,
  # not `"curl`.
  - id: fetch-output-flag-embedded-command
    desc: String literal sets curl/wget output file
    crit: notable
    conf: 0.85
    for: [python, ruby, javascript, typescript, perl, lua, php]
    # Whitespace before the short-flag cluster, for the same reason as the
    # structured-file sibling below: otherwise `--proto`, `--info` or any other
    # long flag ending in `o` reads as the output-file flag.
    if:
      type: text
      regex: '[''"]\s*(curl|wget)\b[^\n;&|]{0,160}(\s-[A-Za-z]{0,6}[oO]|--output)\s+\S+'
    not:
      - regex: '(-[A-Za-z]*[oO]|--output)[ \t]+/dev/null\b'

  - id: fetch-output-flag-structured-file
    desc: Structured file has curl/wget output path
    crit: notable
    conf: 0.84
    platforms: [linux, macos, windows]
    # npm manifests have a structural script matcher in
    # communications/http/download/package; keeping them out of this broad
    # text rule prevents a later build-tool `-o` from being attributed to curl.
    #
    # The short-flag cluster must be preceded by whitespace, so a *long* flag
    # that merely ends in the letter o is not read as `-o`. Without that,
    # `--proto '=https'` matched: `-` + `prot` + `o` + a following value. Every
    # cargo-dist release workflow hardens its installer download exactly that
    # way (`curl --proto '=https' --tlsv1.2 -LsSf … | sh`) and was reported as
    # writing the download to the path `'=https'`.
    for: [pyproject.toml, package-lock.json, groovy, plist, composer.json, github-actions, dockerfile]
    if:
      type: text
      regex: '\b(curl|wget)(\.exe)?\b[^\n]{0,240}(\s-[A-Za-z]{0,6}[oO]|--output)[ \t]+[^ \t\n]{1,200}'
    not:
      - regex: '(-[A-Za-z]*[oO]|--output)[ \t]+/dev/null\b'
      - regex: '(-[A-Za-z]*[oO]|--output)[ \t]+os\.devnull\b'
  - id: hidden-writable-output-path-script--temporary
    desc: Hidden writable temporary output path
    crit: component
    platforms: [linux, macos, windows]
    # Script bodies are directly executable; this is stronger evidence than
    # the same string occurring in a structured build/configuration file.
    conf: 0.9
    for: [shell, python, ruby, perl, javascript, typescript, applescript, vbs]
    if:
      type: text
      regex: '/(tmp|var/tmp|dev/shm)/\.[A-Za-z0-9_.-]+'

  - id: hidden-writable-output-path-script--home
    desc: Hidden writable home output path
    crit: component
    platforms: [linux, macos, windows]
    conf: 0.9
    for: [shell, python, ruby, perl, javascript, typescript, applescript, vbs]
    if:
      type: text
      regex: '(~|\$HOME)/\.[A-Za-z0-9_.-]+'

  - id: hidden-writable-output-path-structured--temporary
    desc: Hidden writable temporary output path
    crit: component
    conf: 0.8
    platforms: [linux, macos, windows]
    for: [pyproject.toml, package-lock.json, groovy, plist, composer.json, github-actions, dockerfile]
    if:
      type: text
      regex: '/(tmp|var/tmp|dev/shm)/\.[A-Za-z0-9_.-]+'

  - id: hidden-writable-output-path-structured--home
    desc: Hidden writable home output path
    crit: component
    platforms: [linux, macos, windows]
    conf: 0.8
    for: [pyproject.toml, package-lock.json, groovy, plist, composer.json, github-actions, dockerfile]
    if:
      type: text
      regex: '(~|\$HOME)/\.[A-Za-z0-9_.-]+'

  - id: curl-s-flag
    desc: curl silent flag (-s)
    conf: 0.6
    if:
      type: text
      regex: 'curl\s+-[a-zA-Z]*s[a-zA-Z]*\b'
  - id: wget-q-flag
    desc: wget quiet flag (-q)
    conf: 0.6
    if:
      type: text
      regex: 'wget\s+-[a-zA-Z]*q[a-zA-Z]*\b'
  - id: wget-stdout-flag
    desc: wget stdout output flag (-O -)
    conf: 0.6
    if:
      type: text
      regex: 'wget\s+[^\n]{0,40}-O\s+-'
  - id: android-tmp-output-download
    desc: Android downloads payload to temp directory
    crit: notable
    conf: 0.9
    platforms: [unix, android]
    for: [elf, shell, c, cpp]
    if:
      type: text
      regex: '-O\s+/data/local/tmp/[A-Za-z0-9._-]+'
composite_rules:
  - id: fetch-output-flag-script
    desc: Script sets curl or wget output file
    crit: notable
    conf: 0.85
    platforms: [linux, macos, windows]
    for: [shell, python, ruby, perl, javascript, typescript, applescript, vbs]
    all:
      - id: fetch-output-option-script
    any:
      - id: fetch-command-position-script
      - id: fetch-if-command-position-script
    near_lines: 1
    near_bytes: 224
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path

  - id: hidden-writable-output-path-script
    desc: Hidden writable output path
    crit: component
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [shell, python, ruby, perl, javascript, typescript, applescript, vbs]
    any:
      - id: hidden-writable-output-path-script--temporary
      - id: hidden-writable-output-path-script--home
  - id: hidden-writable-output-path-structured
    desc: Hidden writable output path
    crit: component
    conf: 0.8
    platforms: [linux, macos, windows]
    for: [pyproject.toml, package-lock.json, groovy, plist, composer.json, github-actions, dockerfile]
    any:
      - id: hidden-writable-output-path-structured--temporary
      - id: hidden-writable-output-path-structured--home
  - id: fetch-output-flag
    desc: curl/wget output file option
    crit: notable
    conf: 0.85
    any:
      - id: fetch-output-flag-script
      - id: fetch-output-flag-structured-file

  - id: fetch-output-hidden-path-script
    desc: Script fetches into a hidden writable path
    crit: notable
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [shell, python, ruby, perl, javascript, typescript, applescript, vbs]
    all:
      - id: fetch-output-flag-script
      - id: hidden-writable-output-path-script
    near_bytes: 192
    near_lines: 1

  - id: fetch-output-hidden-path-structured
    desc: Structured file fetches to hidden path
    crit: notable
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [pyproject.toml, package-lock.json, groovy, plist, composer.json, github-actions, dockerfile]
    all:
      - id: fetch-output-flag-structured-file
      - id: hidden-writable-output-path-structured
    near_bytes: 272
    near_lines: 1
