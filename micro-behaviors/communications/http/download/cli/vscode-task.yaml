defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [json]
  attack: T1105

traits:
  # Read the parsed task command rather than the text after the `command` key:
  # malicious workspace files may add hundreds of spaces before the value.
  - id: vscode-task-curl-wget-url
    desc: VS Code task fetches URL via curl/wget
    if:
      type: value
      path: tasks[*].command
      regex: '(?i)^\s*(curl|wget)(\.exe)?\s[^\r\n]{0,200}https?://'

  # The same command under a per-platform block: VS Code lets a task carry
  # `"osx": {"command": ...}`, `"linux": {...}`, `"windows": {...}` instead
  # of (or beside) a top-level command, and a cross-platform bootstrap task
  # uses exactly that so each OS pipes its own fetch into its own shell.
  # `.*.` iterates the task's object-valued keys; only the OS blocks hold a
  # `command`.
  - id: vscode-task-os-curl-wget-url
    desc: Per-OS task command fetches URL via curl
    if:
      type: value
      path: tasks[*].*.command
      regex: '(?i)^\s*(curl|wget)(\.exe)?\s[^\r\n]{0,200}https?://'

  - id: vscode-task-powershell-web-request
    desc: VS Code task invokes PowerShell web request
    if:
      type: value
      path: tasks[*].command
      regex: '\b(iwr|invoke-webrequest)\b'
      case_insensitive: true

composite_rules:
  # One id for "a task fetches a URL" whichever slot the command sits in, so
  # the IDE-trigger composites need not enumerate the per-OS shape.
  - id: vscode-task-fetches-url-any-os
    desc: VS Code task fetches URL on any OS
    any:
      - id: vscode-task-curl-wget-url
      - id: vscode-task-os-curl-wget-url
