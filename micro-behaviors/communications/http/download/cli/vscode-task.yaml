defaults:
  platforms: [windows, unix]
  for: [json]
  attack: T1105

traits:
  # Read the parsed task command rather than the text after the `command` key:
  # malicious workspace files may add hundreds of spaces before the value.
  - id: vscode-task-curl-wget-url
    desc: VS Code task fetches URL via curl/wget
    crit: notable
    conf: 0.9
    if:
      type: value
      path: tasks[*].command
      regex: '(?i)^\s*(curl|wget)(\.exe)?\s[^\r\n]{0,200}https?://'

  - id: vscode-task-powershell-web-request
    desc: VS Code task invokes PowerShell web request
    crit: notable
    conf: 0.9
    if:
      type: value
      path: tasks[*].command
      regex: '\b(iwr|invoke-webrequest)\b'
      case_insensitive: true
