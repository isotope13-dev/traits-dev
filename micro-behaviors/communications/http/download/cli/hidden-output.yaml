# Command-text context, not proof of payload execution or attacker intent.
# Structured parsers may put tokens in one literal on nearby logical lines.
defaults:
  for: [scripts, source, manifests, html, xml, dockerfile, package-lock.json]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.92

composite_rules:
  - id: hidden-output-download-context
    desc: Download output and hidden-path command text
    near_lines: 3
    all:
      - id: micro-behaviors/fs/path/location::hidden-writable-path
    any:
      - id: micro-behaviors/communications/http/download/cli::fetch-output-hidden-path-script
      - id: micro-behaviors/communications/http/download/cli::fetch-output-hidden-path-structured
      - id: micro-behaviors/communications/http/download/curl::curl-hidden-tmp-output-file
