defaults:
  platforms:
  - windows
composite_rules:
- id: batch-download-tool-group
  desc: Batch download-tool invocation
  crit: notable
  conf: 0.7
  for:
  - batch
  any:
  - id: micro-behaviors/communications/http/curl/command::curl-command-url-or-option
  - id: micro-behaviors/communications/http/download/wget::wget-path
  - id: micro-behaviors/communications/http/download/cli/multi-tool::curl-remote-exe-url
  - id: micro-behaviors/communications/http/download/webclient::downloadfile-method-name-batch
  - id: micro-behaviors/communications/http/download/cli/multi-tool::certutil-urlcache
  - id: micro-behaviors/communications/http/download/cli/utility::bitsadmin-cmd
