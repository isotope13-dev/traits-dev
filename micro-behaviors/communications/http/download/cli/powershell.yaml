defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp]
  attack: T1105
  mbc: E1105
traits:
  - id: iwr-outfile-download
    desc: Downloads a file with PowerShell
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)(Invoke-WebRequest|iwr)[^\r\n]{0,160}-(OutFile|o)\b'
  - id: embedded-iwr-outfile-download
    desc: Embedded IWR command downloads a file
    crit: notable
    conf: 0.95
    for: [vbs, javascript, html]
    if:
      type: text
      regex: '(?i)\b(Invoke-WebRequest|iwr)\b[^\r\n]{0,160}-(OutFile|o)\b'
  - id: iwr-response-content-access
    desc: PowerShell reads HTTP response content
    crit: notable
    conf: 0.88
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$[A-Za-z_]\w*\.(Content|RawContent)\b'
  - id: iwr-archive-url-download
    desc: PowerShell IWR references an archive URL
    crit: notable
    conf: 0.93
    for: [powershell, batch, pe, csharp, javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(iwr|invoke-webrequest)\b.{0,120}\bhttps?://.{1,120}\.(zip|7z|rar)\b'
  - id: iwr-exe-url
    desc: PowerShell iwr downloads a URL EXE
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?im)(^|["'';&|][ \t]*)iwr\b.{0,100}https?://.{0,120}\.exe\b'
