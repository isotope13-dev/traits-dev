defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: batch-download-path-launch-profile
  desc: Batch download with path or launch clues
  all:
  - id: micro-behaviors/communications/http/download/cli::batch-download-tool-group
  - id: micro-behaviors/process/create/shell/batch::batch-program-launch-group
  any:
  - id: micro-behaviors/fs/write/file/target::users-public-path
  - id: micro-behaviors/process/create/shell/batch::run-from-temp
  crit: suspicious
  conf: 0.9
- id: batch-arch-download-profile
  desc: Batch download with architecture clues
  mbc: C0002
  all:
  - id: micro-behaviors/communications/http/download/cli::batch-download-tool-group
  - id: micro-behaviors/os/sysinfo/platform/arch::wmic-os-architecture
  any:
  - id: micro-behaviors/process/create/shell/batch::batch-program-launch-group
  - id: micro-behaviors/fs/write/file/target::users-public-path
  crit: suspicious
  conf: 0.9
