# bitsadmin.exe is the Windows Background Intelligent Transfer Service CLI.
# The bare invocation is a neutral transfer capability; /transfer against a
# remote URL is the dropper signal and lives in objectives/.
defaults:
  platforms: [windows]
  for: [scripts]
  attack: T1197
traits:
  - id: bitsadmin-cmd
    desc: bitsadmin command
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?i)\bbitsadmin(\.exe)?\s+[\w-]+'
    unless:
    - id: metadata/build/bundler/asset::js-vite-rollup-vendor-chunk
    - id: well-known/lib/development/vscode-webview::acquire-vscode-api
    - id: micro-behaviors/process/interpreter/vm/
