defaults:
  platforms: [windows]

traits:
- id: curl-wget-near-temp-path
  desc: Curl or wget near TEMP path
  crit: notable
  conf: 0.9
  for:
  - batch
  if:
    type: text
    regex: (?i)(curl|wget).{0,120}(\\Temp\\|%TMP%)
- id: bitsadmin-transfer-command
  desc: BITSAdmin transfer command text
  crit: notable
  conf: 0.99
  for: [batch]
  if:
    type: text
    substr: 'bitsadmin.exe /transfer'
    case_insensitive: true
- id: certutil-urlcache
  desc: certutil urlcache
  crit: suspicious
  conf: 0.95
  for: [batch, rtf, oledoc, ooxml, lnk]
  unless:
  - type: text
    substr: CONTOOLS_BUILD_TOOLS_ROOT
  - id: well-known/tool/development/build/conda-smithy::conda-smithy-generator-notice
  - id: well-known/tool/development/build/conda-smithy::conda-smithy-rerender-reference
  if:
    type: text
    regex: (?i)certutil[^\n]{0,220}-urlcache
- id: certutil-urlcache-split-force
  desc: certutil urlcache with split force
  crit: suspicious
  conf: 0.98
  for: [batch, rtf, oledoc, ooxml, lnk]
  unless:
  - type: text
    substr: CONTOOLS_BUILD_TOOLS_ROOT
  - id: well-known/tool/development/build/conda-smithy::conda-smithy-generator-notice
  - id: well-known/tool/development/build/conda-smithy::conda-smithy-rerender-reference
  if:
    type: text
    regex: (?i)certutil(\.exe)?\s+[^\n]{0,120}-urlcache[^\n]{0,60}-split[^\n]{0,60}-f
- id: curl-remote-exe-url
  desc: Curl references a remote EXE URL
  crit: notable
  conf: 0.9
  for:
  - batch
  if:
    type: text
    regex: (?i)\bcurl(\.exe)?\s+[^\n]{0,120}https?://[^\s&|"]{1,200}\.exe\b
