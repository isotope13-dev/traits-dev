defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
traits:
- id: hidden-scratch-curl-output-text-11
  desc: Curl output text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: curl\s+-o[^\n]{0,120}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,120}\b
- id: hidden-scratch-curl-output-text-12
  desc: Curl output text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: curl\s+-o[^\n]{0,120}(/run/|/mnt/)\.[a-zA-Z0-9][\w.-]{2,120}\b
- id: hidden-scratch-wget-output-text
  desc: Wget output text names hidden temporary path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: wget\s+-O[^\n]{0,120}(/dev/shm/|/tmp/)\.[a-zA-Z0-9][\w.-]{2,120}\b
  not:
  - substr: /tmp/.spinner.pid
- id: hidden-scratch-wget-output-text-14
  desc: Wget output text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: wget\s+-O[^\n]{0,120}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,120}\b
- id: hidden-scratch-wget-output-text-15
  desc: Wget output text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: wget\s+-O[^\n]{0,80}/(run|mnt)/\.[\w.-]+
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
