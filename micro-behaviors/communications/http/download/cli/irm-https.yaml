# IRM/IEX cradles that fetch a remote HTTPS script rather than a public
# CDN bootstrap. The existing public-code pipeline requires gist/jsDelivr
# hosts; commodity droppers use throwaway HTTPS URLs instead.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1059.001,T1105
  mbc: B0030

traits:
  - id: irm-https-url
    desc: IRM fetches a remote HTTPS URL
    crit: notable
    conf: 0.9
    if:
      type: text
      # Allow cmdlet arguments between the command and the URL: droppers
      # use the long form (Invoke-RestMethod -Uri 'https://...').
      regex: '(?i)\b(irm|Invoke-RestMethod)\b[^|\r\n]{0,80}https://'
  - id: irm-https-ps1-url
    desc: IRM fetches a remote HTTPS script
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(irm|Invoke-RestMethod)\b[^|\r\n]{0,80}https://[^\s|]{1,80}\.ps1\b'
