defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: bitsadmin-transfer-download-template
    desc: bitsadmin transfer download template
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: (?i)bitsadmin(\.exe)?"?\s+/transfer\s+\S+\s+/download
  - id: certutil-urlcache-download-template
    for: [pe, dll, powershell]
    desc: certutil urlcache download template
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: (?i)certutil(\.exe)?"?\s+-urlcache\s+-split\s+-f\s
  # certutil invoked through a Python subprocess argv list never presents the
  # whitespace-separated command template above: each token is a separately
  # quoted element (`["certutil", "-urlcache", "-split", "-f", url, dest]`).
  # The urlcache flag sequence is the download signal; plain `certutil` alone
  # also encodes, decodes and dumps certificates. Neutral capability on its
  # own; LOLBIN-download composites supply the staging context.
  - id: python-certutil-urlcache-argv
    for: [python]
    desc: Python stages certutil urlcache download
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)certutil(\.exe)?["']?\s*(,\s*["']\s*|\s+)-urlcache
