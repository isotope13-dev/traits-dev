# bitsadmin.exe is the Windows Background Intelligent Transfer Service CLI.
# The bare invocation is a neutral transfer capability; /transfer against a
# remote URL is the dropper signal and lives in objectives/.
defaults:
  platforms: [windows]
  for: [scripts]
traits:
  - id: bitsadmin-cmd
    desc: bitsadmin command text
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?i)\bbitsadmin(\.exe)?\s+[\w-]+'
