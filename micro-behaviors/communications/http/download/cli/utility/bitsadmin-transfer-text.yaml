# A fallback transfer is still a download capability; no objective-tier exclusion.
defaults:
  platforms:
  - windows
  for:
  - scripts
traits:
- id: bitsadmin-transfer-invocation
  desc: BITSAdmin /transfer invocation
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: bitsadmin\s+.{0,50}\/transfer
