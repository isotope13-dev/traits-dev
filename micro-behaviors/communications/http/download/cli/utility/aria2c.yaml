# aria2c is the third downloader shell stagers probe for after curl and wget,
# so a payload fetch written for all three is not missed on the one path the
# host happens to have.
defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  attack: T1105
  mbc: B0024

traits:
  - id: aria2c-output-file
    desc: aria2c downloads to a named output file
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*|\$\()aria2c\s+([^;&|\n]{0,80}\s)?(-o|--out)[\s=]'
