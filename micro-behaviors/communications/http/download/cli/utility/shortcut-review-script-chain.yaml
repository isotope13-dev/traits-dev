defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-arg-fetch-to-temp
    desc: LNK arg downloads a URL into TEMP
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '\s-[a-z]{0,4}o\s+%TEMP%\\?\S{1,40}\s+https?://'
      case_insensitive: true
