# curl -L -o <archive> is the ordinary "follow redirects, save to a named
# file" idiom used by essentially every CI/install script that fetches a
# release tarball or installer (protoc, flatc, and countless other tool
# installers all shell out to exactly this). The extension alone says
# nothing about intent; it becomes evidence of a stealer workflow only when
# paired with the rest of that kill chain (staging dirs, app-bundle
# substitution, sudo delete/copy) in objectives/collection/stealer/workflow.
defaults:
  platforms: [linux, macos, windows]
  for: [applescript, shell]
  conf: 0.85

traits:
  - id: curl-download-archive-zip-dmg-pkg
    desc: curl downloads a zip/dmg/pkg archive
    crit: baseline
    if:
      type: text
      regex: "curl\\s+-L\\s+-o\\s+[^\\s]{1,160}\\.(zip|dmg|pkg)(\\s|$)"
  - id: curl-download-archive-tarball
    desc: curl downloads a tarball archive
    crit: baseline
    if:
      type: text
      regex: "curl\\s+-L\\s+-o\\s+[^\\s]{1,160}\\.(tgz|tar\\.gz)(\\s|$)"
  - id: curl-download-app-bundle
    desc: curl downloads a macOS app bundle path
    crit: baseline
    platforms: [macos]
    if:
      type: text
      regex: "curl\\s+-L\\s+-o\\s+[^\\s]{1,160}/[^/\\s]{1,80}\\.app(\\s|$)"

composite_rules:
  - id: curl-download-l-o
    desc: curl -L -o downloads an archive or app bundle
    crit: baseline
    any:
      - id: curl-download-archive-zip-dmg-pkg
      - id: curl-download-archive-tarball
      - id: curl-download-app-bundle
