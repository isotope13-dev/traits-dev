defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-powershell-iwr-outfile-command
  desc: Batch downloads a file through PowerShell
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    language: batch
    query: |
      (cmd (command_name) @ps
        (argument_list
          . (argument_value) @download . (argument_value) @url
          . (argument_value) @option . (argument_value) @path .)
        (#match? @ps "(?i)^powershell([.]exe)?$")
        (#match? @download "(?i)^(Invoke-WebRequest|iwr)$")
        (#match? @url "(?i)^https?://")
        (#match? @option "(?i)^-OutFile$"))
