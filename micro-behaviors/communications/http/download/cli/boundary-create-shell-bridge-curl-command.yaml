defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-execsync-curl-command
    desc: execSync command starts with curl
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: symbol
      kind: call
      exact: execSync
      arg:
        kind: string
        regex: '^\s*curl\s+'
