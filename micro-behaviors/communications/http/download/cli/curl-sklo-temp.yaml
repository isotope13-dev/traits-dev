defaults:
  platforms:
  - windows
traits:
- id: curl-insecure-temp-single-letter
  desc: curl writes temp file with insecure TLS
  crit: suspicious
  conf: 0.88
  for:
  - batch
  - powershell
  - text
  if:
    type: text
    regex: (?i)\bcurl(\.exe)?\s+-[a-z]*sklo[a-z]*\s+%TMP%\\x\\[a-z]\s+https?://
