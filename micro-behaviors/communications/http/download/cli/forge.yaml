# Fetching content from a public code forge is neutral network activity.  The
# sandbox-egress objective correlates this capability with environment probes
# and reads of answer/ground-truth artifacts.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts]
  attack: T1105

traits:
  - id: wget-command-call
    desc: Shell invokes the wget command
    conf: 0.96
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: wget

  - id: curl-wget-bare-domain
    desc: Curl or wget uses a protocol-less host/path
    conf: 0.9
    for: [shell, powershell, batch]
    if:
      type: text
      regex: '(?i)\b(curl|wget)(\.exe)?\s+[a-z0-9][a-z0-9.-]*\.[a-z]{2,}\b'

  - id: curl-wget-argv
    desc: Curl or wget argv invocation
    conf: 0.88
    if:
      type: text
      regex: '["''](curl|wget)["'']\s*,\s*\[\s*["''][-/]'
  # The forge URL must be the fetch command's own argument on the same
  # line. A forge host named elsewhere in the file (a git config scope,
  # a comment, another command's target) is a reference, not a download:
  # co-occurrence within a few lines does not bind the URL to the curl.
  - id: public-forge-http-download
    desc: Fetches content from a public code forge
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(curl|wget)\b.{0,120}?https?://(github|gitlab|codeberg|bitbucket)\.(com|org)/'
  - id: github-raw-http-source
    desc: Fetches GitHub raw content
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(curl|wget)\b.{0,120}?https?://raw\.githubusercontent\.com/'

composite_rules:
  - id: curl-wget-command
    desc: Shell invokes curl or wget
    conf: 0.96
    for: [shell, powershell, batch]
    any:
      - id: micro-behaviors/communications/http/curl::curl-command-call

      - id: wget-command-call

  - id: public-forge-http-source
    desc: Fetches content from a public code forge
    conf: 0.9
    any:
      - id: public-forge-http-download
      - id: github-raw-http-source
