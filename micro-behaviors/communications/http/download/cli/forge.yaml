# Fetching content from a public code forge is neutral network activity.  The
# sandbox-egress objective correlates this capability with environment probes
# and reads of answer/ground-truth artifacts.
defaults:
  platforms: [windows, unix]
  for: [scripts]
  attack: T1105

traits:
  - id: curl-command-call
    desc: Shell invokes the curl command
    crit: notable
    conf: 0.96
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: curl

  - id: wget-command-call
    desc: Shell invokes the wget command
    crit: notable
    conf: 0.96
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: wget

  - id: curl-wget-argv
    desc: Curl or wget argv invocation
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '["''](curl|wget)["'']\s*,\s*\[\s*["''][-/]'

composite_rules:
  - id: curl-wget-command
    desc: Shell invokes curl or wget
    crit: notable
    conf: 0.96
    for: [shell, powershell, batch]
    any:
      - id: curl-command-call
      - id: wget-command-call

  - id: public-forge-http-download
    desc: Fetches content from a public code forge
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/url/forge::public-code-forge-url
    any:
      - id: curl-wget-command
      - id: curl-wget-argv
    near_lines: 8

  - id: github-raw-http-source
    desc: Fetches GitHub raw content
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/url/forge::github-raw-url
    any:
      - id: curl-wget-command
      - id: curl-wget-argv
    near_lines: 8

  - id: public-forge-http-source
    desc: Fetches content from a public code forge
    crit: notable
    conf: 0.9
    any:
      - id: public-forge-http-download
      - id: github-raw-http-source
