defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9
traits:
  - id: curl-output-dist-build
    desc: curl output names dist or build path
    if:
      type: text
      regex: 'curl\b.{0,160}(\s-o\s*|\s--output\s+)(dist|build)/\S.{0,80}'
  - id: curl-output-out-target
    desc: curl output names out or target path
    if:
      type: text
      regex: 'curl\b.{0,160}(\s-o\s*|\s--output\s+)(out|target)/\S.{0,80}'
  - id: curl-redirect-dist-build
    desc: curl output redirected into dist or build
    if:
      type: text
      regex: 'curl\b.{0,160}>\s*(dist|build)/\S.{0,80}'
  - id: curl-redirect-out-target
    desc: curl output redirected into out or target
    if:
      type: text
      regex: 'curl\b.{0,160}>\s*(out|target)/'
  - id: curl-tee-artifact
    desc: curl text piped to artifact tee
    if:
      type: text
      regex: 'curl\b.{0,160}\|\s*tee\s+(dist|build|out|target)/'
