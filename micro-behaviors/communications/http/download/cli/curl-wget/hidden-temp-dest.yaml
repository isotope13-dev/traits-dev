defaults:
  platforms: [unix]
  for: [shell, python, ruby, perl, javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: short-flag-hidden-temp-dotfile
    desc: Short output flag writes hidden temp file
    for: [shell, scripts, source]
    if:
      type: text
      regex: '-[fsSLkvq]*[oO]\s+["'']?/((var/)?tmp|dev/shm)/\.[A-Za-z0-9_]'
    not:
      - substr: /tmp/.X11-unix
      - substr: /tmp/.ICE-unix
      - substr: /tmp/.font-unix

  - id: long-flag-hidden-temp-dotfile
    desc: Long output flag writes hidden temp file
    for: [shell, scripts, source]
    if:
      type: text
      regex: '--output(-document)?[=\s]+["'']?/((var/)?tmp|dev/shm)/\.[A-Za-z0-9_]'
    not:
      - substr: /tmp/.X11-unix
      - substr: /tmp/.ICE-unix

  - id: quoted-hidden-temp-dotfile-literal
    desc: Script literal names hidden temp dotfile
    for: [python, javascript, typescript, ruby, perl]
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']/((var/)?tmp|dev/shm)/\.[A-Za-z0-9_][A-Za-z0-9._-]{0,48}["'']'
    not:
      - substr: /tmp/.X11-unix
      - substr: /tmp/.ICE-unix
      - substr: /tmp/.font-unix
      - substr: /tmp/.Test-unix

composite_rules:
  - id: download-to-hidden-temp-dotfile
    desc: Downloads payload into hidden temp dotfile
    crit: notable
    conf: 0.95
    any:
      - id: short-flag-hidden-temp-dotfile
      - id: long-flag-hidden-temp-dotfile
      - id: script-http-fetch-hidden-temp-dotfile

  - id: script-http-fetch-hidden-temp-dotfile
    desc: Script HTTP client uses hidden temp dotfile
    for: [python, javascript, typescript, ruby, perl]
    crit: notable
    conf: 0.94
    all:
      - id: quoted-hidden-temp-dotfile-literal
    any:
      - id: micro-behaviors/communications/http/request/client::http-request-operation
      - id: micro-behaviors/communications/http/lib/urllib/
      - id: micro-behaviors/communications/http/client/
