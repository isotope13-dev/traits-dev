defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: scripts-preinstall-pipe-1
  desc: Preinstall curl or wget with shell separator
  crit: suspicious
  conf: 0.9
  # A command mentioned inside console output is not a pipeline execution.
  # The context rule is scoped to the printed suggestion and is disabled if
  # another script stage or process-launch API supplies an execution path.
  unless:
  - id: metadata/package/scripts/interpreter-pipe::npm-preinstall-printed-curl-pipe-guidance-context
  # The exact curl-to-Node form has its own more specific observation in
  # remote-execution/npm.yaml. Keep this general import-chain atom for other
  # installer pipelines without emitting a second finding for that same pipe.
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::preinstall-curl-piped-node
  if:
    type: value
    path: scripts.preinstall
    regex: (curl|wget).{0,50}(\||;|&&)
