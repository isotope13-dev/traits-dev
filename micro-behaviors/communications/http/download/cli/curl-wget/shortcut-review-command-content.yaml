defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
- id: lnk-hidden-cmd-curl-download
  desc: LNK hidden command downloads via curl
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/client/reference::lnk-curl-command-reference
  - id: micro-behaviors/communications/http/download/cli/curl-wget::lnk-arg-curl-output-download
  - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
  any:
  - id: micro-behaviors/ui/window/state::hidden-or-minimized-window
  - id: micro-behaviors/process/config/target::lnk-conhost-target
- id: lnk-conhost-curl-download
  desc: LNK conhost proxies curl download
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/download/cli/curl-wget::lnk-hidden-cmd-curl-download
  - id: micro-behaviors/process/config/target::lnk-conhost-target
