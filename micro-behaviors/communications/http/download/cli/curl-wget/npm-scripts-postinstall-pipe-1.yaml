defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: scripts-postinstall-pipe-1
  desc: Postinstall curl or wget with shell separator
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: scripts.postinstall
    regex: (curl|wget).{0,50}(\||;|&&)
  unless:
  - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
  - id: metadata/package/testing/presence/fixture::test-components-package-json-path
