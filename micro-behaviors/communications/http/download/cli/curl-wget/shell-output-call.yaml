defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: shell-wget-output-document-call
    desc: Shell wget call selects an output file
    if:
      type: symbol
      kind: call
      regex: '(^|/)wget(\.exe)?$'
      arg:
        kind: identifier
        name_regex: '^(-O|--output-document)$'

composite_rules:
  - id: shell-download-output-call
    desc: Shell downloader call selects file output
    any:
      - id: micro-behaviors/communications/http/download/curl::shell-curl-output-option-call
      - id: shell-wget-output-document-call
