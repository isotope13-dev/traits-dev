defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: notable
  conf: 0.95
  attack: T1105

traits:
  - id: desktop-exec-curl
    desc: Desktop Exec invokes curl
    if:
      type: value
      path: desktop_entry.exec
      regex: '\bcurl\b'

  - id: desktop-decoded-curl-download
    desc: Desktop decodes to curl download command
    conf: 0.98
    if:
      type: text
      regex: '\bcurl\b.{0,320}https?://.{1,240}'

  - id: desktop-exec-wget
    desc: Desktop Exec invokes wget
    if:
      type: text
      regex: '(?m)^Exec=[^\r\n]{0,999}\bwget\b'

composite_rules:
  - id: desktop-exec-download-tool
    desc: Desktop Exec invokes download utility
    crit: notable
    conf: 0.95
    any:
      - id: desktop-exec-curl
      - id: desktop-decoded-curl-download
      - id: desktop-exec-wget
