# A command-line HTTP client targeting an IPv4 literal is a neutral download
# capability. Dropper rules may use it as evidence, but the matcher alone does
# not establish that the fetched content is a payload.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1105

traits:
  - id: curl-wget-ipv4-url
    desc: Curl/wget command targets an IPv4 URL
    crit: notable
    conf: 0.95
    unless:
      - id: well-known/tool/sysadmin/spack::spack-package-context
      - id: micro-behaviors/communications/http/services/cloud::curl-aws-metadata-query
      - id: metadata/package/testing/
    if:
      type: text
      regex: '(?im)(^|[;&|({]\s*)(curl|wget)\b[^\n;&|]{0,96}https?://\d{1,3}(\.\d{1,3}){3}/'
      is: valid_ip
