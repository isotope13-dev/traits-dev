# IWR saves an executable-named URL under TEMP. Window hiding is context;
# neither composite requires activation of the downloaded file.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-iwr-exe-to-temp
    desc: PowerShell IWR saves URL EXE under TEMP
    crit: suspicious
    conf: 0.97
    near_lines: 1
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-exe-url
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/temp::env-temp

  - id: powershell-hidden-url-exe-stager
    desc: Hidden PowerShell saves URL EXE under TEMP
    crit: suspicious
    conf: 0.98
    all:
      - id: powershell-iwr-exe-to-temp
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window
