defaults:
  for: [package.json]
  platforms: [unix, windows]
composite_rules:
  - id: npm-preinstall-download-command
    desc: Preinstall script references a downloader
    crit: notable
    conf: 0.6
    any:
    - id: micro-behaviors/communications/http/download/curl::npm-preinstall-curl
    - id: micro-behaviors/communications/http/download/wget::npm-preinstall-wget
