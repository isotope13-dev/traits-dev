defaults:
  platforms:
  - windows
composite_rules:
- id: batch-download-tool-group
  desc: Batch download-tool invocation
  crit: notable
  conf: 0.7
  for:
  - batch
  any:
  - id: micro-behaviors/communications/http/download/curl::curl-invoked-with-url-or-option
  - id: micro-behaviors/communications/http/download/curl::wget-path
  - id: micro-behaviors/communications/http/download/cli::curl-remote-exe-url
  - id: micro-behaviors/communications/http/download/webclient::downloadfile-method-name-batch
  - id: micro-behaviors/communications/http/download/cli::certutil-urlcache
  - id: micro-behaviors/communications/http/download/cli::bitsadmin-cmd
