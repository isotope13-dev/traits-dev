# Architecture selection and app hosting also occur in legitimate installers.
defaults:
  platforms:
  - linux
  - macos
  for:
  - shell
composite_rules:
- id: shell-fetch-output-option
  desc: Shell downloader specifies an output destination
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
  - id: micro-behaviors/communications/http/download/cli::aria2c-output-file
- id: shell-arch-hosted-executable-download
  desc: Architecture-aware hosted download with chmod
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/os/sysinfo/platform/arch::shell-cpu-arch-fingerprint
  - id: micro-behaviors/communications/http/services/cloud::app-platform-host
  - id: shell-fetch-output-option
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
