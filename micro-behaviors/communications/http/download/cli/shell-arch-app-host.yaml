# Architecture selection and app hosting also occur in legitimate installers.
defaults:
  platforms:
  - linux
  - macos
  for:
  - shell
composite_rules:
- id: shell-cpu-arch-fingerprint
  desc: Shell reads architecture for a download
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
  - id: micro-behaviors/os/sysinfo/platform/arch::sh-arch-query
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-aware-curl-download
- id: app-platform-host
  desc: References a hosted app or quick tunnel
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/services/cloud::netlify-app
  - id: micro-behaviors/communications/http/services/file-hosting::herokuapp-com
  - id: micro-behaviors/communications/proxy/tunnel::trycloudflare-domain
- id: shell-fetch-to-file
  desc: Shell downloads to a named file
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: micro-behaviors/communications/http/download/wget::wget-output-file
  - id: micro-behaviors/communications/http/download/cli::aria2c-output-file
- id: shell-arch-hosted-executable-download
  desc: Architecture-aware hosted download with chmod
  crit: notable
  conf: 0.93
  all:
  - id: shell-cpu-arch-fingerprint
  - id: app-platform-host
  - id: shell-fetch-to-file
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
