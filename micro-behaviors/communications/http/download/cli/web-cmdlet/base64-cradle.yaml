defaults:
  platforms: [windows]
  for: [text, batch, powershell]
  attack: T1105,T1059.001

traits:
  - id: base64-powershell-web-cradle-call
    desc: Base64 PowerShell web download cradle
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\b(iwr|irm|Invoke-WebRequest|DownloadString)\b'
