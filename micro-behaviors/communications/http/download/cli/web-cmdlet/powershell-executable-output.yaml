defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-download-executable-output
    desc: Downloads to an EXE or DLL file
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)Invoke-WebRequest.{0,300}-OutFile\s+"[^"\r\n]{1,180}\.(exe|dll)"'
