# The PowerShell REST cmdlet saving its response to a file (-OutFile), carried
# inside a script-host or HTML source as part of a command line it hands to a
# shell. Sibling of powershell.yaml::embedded-iwr-outfile-download for irm.
defaults:
  for: [vbs, javascript, html]
  platforms: [windows]
  crit: notable
  conf: 0.93
  attack: T1105

traits:
  - id: embedded-irm-outfile-download
    desc: Embedded IRM command downloads a file
    if:
      type: text
      regex: '(?i)\b(Invoke-RestMethod|irm)\s[^\r\n;|]{0,160}\s-OutFile\b'

composite_rules:
  - id: embedded-powershell-outfile-download
    desc: Embedded PowerShell cmdlet downloads a file
    any:
      - id: embedded-irm-outfile-download
      - id: embedded-iwr-outfile-download
