defaults:
  for: [html, vbs, powershell, javascript]
  platforms: [windows]
traits:
  - id: encoded-appdata-script-output
    desc: Encoded download targets an AppData script
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '(?i)-outfile\s+["”'']\$env:appdata\\[^"”'']+\.(js|vbs|ps1)["”'']'
  - id: encoded-iwr-outfile-command
    for: [javascript, typescript, vbs, powershell, batch, python, rust, go]
    platforms: [unix, windows]
    desc: Decoded PowerShell command downloads a file
    crit: notable
    conf: 0.94
    if:
      type: encoded
      regex: '(?i)\b(Invoke-WebRequest|iwr)\b[^\r\n;]{0,160}-(OutFile|o)\b'
