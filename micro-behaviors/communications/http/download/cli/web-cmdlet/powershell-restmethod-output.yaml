defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp, python]
traits:
  - id: powershell-restmethod-outfile
    desc: REST request cmdlet specifies an output file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(Invoke-RestMethod|irm)\b[^\r\n;|]{0,160}-OutFile\b'
