# Perl flow retains contributing literals but cannot prove a complete value
# for concatenation. Keep the command prefix and evaluation suffix separate.
defaults:
  platforms: [windows]
  for: [perl]
  crit: notable
  conf: 0.98
  attack: T1105,T1059.001

traits:
  - id: perl-process-powershell-fetch
    desc: Perl passes PowerShell fetch command
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        from:
          value: '(?i)^(powershell|pwsh)\b.{0,100}\b(iwr|irm)\s'
