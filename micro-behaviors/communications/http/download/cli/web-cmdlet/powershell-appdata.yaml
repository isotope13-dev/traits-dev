defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-web-appdata-script-output
    desc: PowerShell downloads a script into AppData
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: powershell
      query: |
        ((command command_name: (command_name) @name
                  command_elements: (command_elements) @args) @download
          (#match? @name "(?i)^(wget|iwr|invoke-webrequest)$")
          (#match? @args "(?i)https?://")
          (#match? @args "(?i)-outfile\\s+[\"“”]\\$env:(local)?appdata[\\\\/][^\"“”\\r\\n]+\\.(js|vbs|ps1)[\"“”]"))
