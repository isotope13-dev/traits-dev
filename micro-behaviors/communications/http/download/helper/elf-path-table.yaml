# Adjacent basename path table used by IoT bots to locate download helpers
# on the target filesystem (/echo, /wget, /curl).
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable

traits:
  - id: echo-wget-curl-path-table
    desc: Adjacent /echo /wget /curl path table
    conf: 0.92
    if:
      type: raw
      regex: '/echo[\x00]{1,4}/wget[\x00]{1,4}/curl'
