defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  mbc: C0002

traits:
  # The official python-build-standalone project is also a normal way for an
  # IDE or extension to obtain a private interpreter. Keep this as a
  # capability; downloader/stager intent belongs in composites that add
  # payload execution and obfuscation evidence.
  - id: python-standalone-repository-reference
    desc: References Python standalone release repository
    crit: notable
    conf: 0.92
    for: [scripts, binaries, javascript, typescript]
    if:
      type: text
      regex: 'indygreg/python-build-standalone|python-build-standalone/releases'

  - id: python-standalone-artifact-reference
    desc: References Python standalone release artifact
    crit: notable
    conf: 0.9
    for: [scripts, binaries, javascript, typescript]
    if:
      type: string_literal
      substr: -install_only.tar.gz

  - id: python-source-release-reference
    desc: References official Python source release
    crit: notable
    conf: 0.82
    for: [scripts, binaries, javascript, typescript]
    if:
      type: string_literal
      substr: python.org/ftp/python

  - id: download-file-method-call
    desc: Calls file download method
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)download_file$'
    unless:
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
  - id: safe-download-import
    desc: safe_download function import
    conf: 0.7
    if:
      type: text
      substr: import safe_download
  - id: python-string-powershell-webrequest
    desc: Python string contains PowerShell web request
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)\b(powershell(\.exe)?\b.{0,80})?(Invoke-WebRequest|iwr)\b\s+(-|https?://)'
  - id: ps-download-cmdlet-string
    desc: PowerShell download cmdlet in string
    crit: component
    conf: 0.9
    if:
      type: string_literal
      regex: '(?i)\b(Invoke-WebRequest|iwr|Start-BitsTransfer)\b'
  - id: ps-env-var-string
    desc: PowerShell env-var reference in string
    crit: component
    conf: 0.9
    if:
      type: string_literal
      regex: '\$env:'

composite_rules:
  # Both in one embedded string, either order — replaces the former
  # `(?=.*A)(?=.*B)` lookahead the linear-time engine could not compile.
  - id: python-string-powershell-download-cradle
    desc: PowerShell download cradle in Python string
    crit: notable
    conf: 0.9
    all:
      - id: ps-download-cmdlet-string
      - id: ps-env-var-string
    near_bytes: 400
  - id: python-standalone-release-reference
    desc: References Python standalone release files
    crit: notable
    conf: 0.92
    for: [scripts, binaries, javascript, typescript]
    any:
      - id: python-standalone-repository-reference
      - id: python-standalone-artifact-reference
      - id: python-source-release-reference
