defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  mbc: C0002

traits:
  # The official python-build-standalone project is also a normal way for an
  # IDE or extension to obtain a private interpreter. Keep this as a
  # capability; downloader/stager intent belongs in composites that add
  # payload execution and obfuscation evidence.
  - id: python-standalone-repository-reference
    desc: References Python standalone release repository
    crit: notable
    conf: 0.92
    for: [scripts, binaries, javascript, typescript]
    if:
      type: text
      regex: 'indygreg/python-build-standalone|python-build-standalone/releases'

  - id: python-standalone-artifact-reference
    desc: References Python standalone release artifact
    crit: notable
    conf: 0.9
    for: [scripts, binaries, javascript, typescript]
    if:
      type: string_literal
      substr: -install_only.tar.gz

  - id: python-source-release-reference
    desc: References official Python source release
    crit: notable
    conf: 0.82
    for: [scripts, binaries, javascript, typescript]
    if:
      type: string_literal
      substr: python.org/ftp/python

  - id: pypy-release-download-url
    desc: References official PyPy release download URL
    crit: notable
    conf: 0.92
    for: [scripts, binaries, javascript, typescript]
    if:
      type: text
      substr: downloads.python.org/pypy

  - id: safe-download-import
    desc: safe_download function import
    conf: 0.7
    if:
      type: text
      substr: import safe_download
  - id: python-string-powershell-webrequest
    desc: Python string contains PowerShell web request
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)\b(powershell(\.exe)?\b.{0,80})?(Invoke-WebRequest|iwr)\b\s+(-|https?://)'
  - id: ps-download-cmdlet-string
    desc: PowerShell download cmdlet in string
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '(?i)\b(Invoke-WebRequest|iwr|Start-BitsTransfer)\b'

  - id: python-github-branch-zip-url
    desc: GitHub branch zip URL
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?s)https://github\.com/.{1,160}/archive/refs/heads/[^\s"'']{1,80}\.zip'

  - id: python-memory-zip-reader
    desc: Reads zip from memory
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'zipfile.ZipFile(io.BytesIO(content))'

  - id: python-model-validator-hook-quarry-buffer
    desc: Hooks model validation with buffer call
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?s)from\s+\.validation_toolkit\.quarry\s+import\s+buffer\s+buffer\(str\(data\)\.replace\('

  # Zip archive opened and extracted to disk. A leg of the self-update
  # shape below; the extraction alone is an ordinary download operation.
  - id: python-zipfile-extract-call
    desc: ZipFile archive extraction call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)zipfile\.ZipFile[\s\S]{0,400}\.extract\('

composite_rules:
  - id: python-github-branch-zip-package-dir-extract
    desc: GitHub branch zip and package directory
    crit: notable
    conf: 0.96
    scope: file
    all:
      - id: python-github-branch-zip-url
      - id: micro-behaviors/fs/path/self::python-pathlib-module-dir
      - id: python-memory-zip-reader
      - id: micro-behaviors/fs/directory/copy::shutil-copytree
  # Both in one embedded string, either order — replaces the former
  # `(?=.*A)(?=.*B)` lookahead the linear-time engine could not compile.
  - id: python-string-powershell-download-cradle
    desc: PowerShell download cradle in Python string
    crit: notable
    conf: 0.9
    all:
      - id: ps-download-cmdlet-string
      - id: metadata/lang/source/syntax/member::powershell-env-prefix-in-python-string
    near_bytes: 400
  - id: python-standalone-release-reference
    desc: References Python standalone release files
    crit: notable
    conf: 0.92
    for: [scripts, binaries, javascript, typescript]
    any:
      - id: python-standalone-repository-reference
      - id: python-standalone-artifact-reference
      - id: python-source-release-reference
  # Proximity must use the call site. urllib-urlretrieve-dup also records the
  # import line, so a near_lines window can pair `import urllib.request` with
  # an unrelated subprocess (nvcc -V, git submodule) while the urlretrieve
  # call itself only stores a wheel.
  - id: urlretrieve-call-near-process-launch
    desc: urlretrieve call near a process launch
    crit: notable
    conf: 0.88
    for: [python, makefile]
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urlretrieve-call-name
      - id: micro-behaviors/process/create/subprocess/launch::python-command-exec-any

  # Self-update shape: the program downloads an archive and extracts it
  # over a directory after deleting files. It replaces its own code; it
  # does not execute the downloaded content as a staged script. Used to
  # distinguish self-updaters from download-execute task patterns.
  - id: python-download-archive-extract-replace
    desc: Downloads archive and extracts over directory
    crit: notable
    conf: 0.88
    scope: file
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urlretrieve-call-name
      - id: python-zipfile-extract-call
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree

  - id: setup-executable-url-retrieval-attempt
    desc: Setup contains an executable URL retrieval attempt
    crit: notable
    conf: 0.9
    for: [python, makefile]
    all:
      - id: metadata/build/pip::root-setup-py
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/communications/http/request/executable-resource::python-http-executable-url
    near_lines: 40
