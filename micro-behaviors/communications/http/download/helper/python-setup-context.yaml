defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: setup-urlretrieve-process-proximity
  desc: Setup download call near process launch
  crit: notable
  conf: 0.96
  scope: file
  unless:
  # Opt-in precompiled-wheel repackaging: the urlretrieve fetches the
  # project's own wheel and zipfile extracts its libraries; the file is
  # never run by the setup script, and the exec leg is the CMake build.
  - id: metadata/build/recognized-contexts::setup-precompiled-wheel-repackage-context
  - id: metadata/build/recognized-contexts::setup-cached-wheel-rename
  # Checksum-verified native-library fetch: the urlretrieve downloads a
  # release tarball plus its .sha256 sidecar, verifies the digest, and
  # extracts only shared-library members; nothing downloaded is run.
  - id: micro-behaviors/crypto/hash/file::python-sha256-sidecar-verified-download
  # Precompiled release asset download: the setup script downloads a prebuilt
  # release archive from a forge release, extracts it, and delegates the native
  # build to setuptools build_ext.
  - id: metadata/build/recognized-contexts::setup-precompiled-release-asset-download
  all:
  - id: micro-behaviors/communications/http/download/helper::download-call-or-setuptools-entry-context
  # File-level urllib context. Proximity lives on the call-site composite:
  # this dup also matches the import line, which is not a download.
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
  - id: micro-behaviors/communications/http/download/helper::urlretrieve-call-near-process-launch
  any:
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: metadata/build/pip::root-setup-py
  needs: 1
- id: setup-download-process-context
  desc: Setup download with process-launch context
  crit: notable
  conf: 0.92
  all:
    - id: micro-behaviors/communications/http/download/helper::download-call-or-setuptools-entry-context
    - id: metadata/build/pip::root-setup-py
    - id: micro-behaviors/process/create/launch::python-command-exec-any
  any:
    # Executable-suffixed download URLs (classic PyPI droppers).
    - id: setup-executable-url-retrieval-attempt
    # Extensionless payloads staged under temp then Popen'd (same file).
    - id: micro-behaviors/communications/http/download/helper::urlretrieve-call-near-process-launch
  needs: 1
  unless:
    - id: metadata/build/recognized-contexts::setup-precompiled-wheel-repackage-context
    - id: metadata/build/recognized-contexts::setup-cached-wheel-rename
    - id: micro-behaviors/crypto/hash/file::python-sha256-sidecar-verified-download
    - id: metadata/build/recognized-contexts::setup-precompiled-release-asset-download
- id: setup-urlretrieve-tempfile-popen-cooccurrence
  desc: Setup download, tempfile and Popen co-occur
  crit: notable
  conf: 0.98
  for: [python, python-sdist]
  scope: file
  near_lines: 25
  all:
    - id: micro-behaviors/communications/http/download/helper::download-call-or-setuptools-entry-context
    - id: metadata/build/pip::root-setup-py
    - id: micro-behaviors/communications/http/lib/urllib::python-urlretrieve-qualified
    - id: micro-behaviors/fs/temp/reference::tempfile-ref
    - id: micro-behaviors/process/create/subprocess::popen-ast
