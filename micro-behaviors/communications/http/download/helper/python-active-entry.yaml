defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: module-scope-urlretrieve-call
    desc: Python module directly calls urlretrieve
    if:
      type: symbol
      kind: call
      module_level: true
      regex: '(^|[.])urlretrieve$'
  # Statement starts at column 0, so a urlopen call made inside a function a
  # caller invokes does not match. Same column-0 test as python-module-os-system-background.
  - id: module-scope-urlopen-call
    desc: Python module directly calls urlopen
    if:
      type: text
      regex: '(?m)^([^\s#][^\n]{0,160})?\burlopen\('
  # requests/httpx fetch on a column-0 statement; same module-scope test as
  # urlopen above, so a fetch inside a function body does not match.
  - id: module-scope-requests-get-call
    desc: Python module directly calls requests.get
    if:
      type: text
      regex: '(?m)^([^\s#][^\n]{0,160})?\b(requests|httpx)\.get\('
  - id: module-scope-wget-download-call
    desc: Python module directly calls wget.download
    if:
      type: symbol
      kind: call
      module_level: true
      exact: wget.download
  - id: module-invokes-download-process-helper
    desc: Module invokes download-and-process helper
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @defined body: (block) @body)
          (expression_statement (call function: (identifier) @called)))
          (#eq? @defined @called)
          (#match? @body "urlretrieve\\s*\\(")
          (#match? @body "(Popen|run|call|check_call|check_output)\\s*\\("))
composite_rules:
  - id: download-call-or-setuptools-entry-context
    desc: Module download call or setuptools run override
    any:
      - id: module-scope-urlretrieve-call
      - id: module-invokes-download-process-helper
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
