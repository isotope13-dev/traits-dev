defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: module-scope-urlretrieve-call
    desc: Python module directly calls urlretrieve
    if:
      type: tree-sitter
      query: |
        ((module (expression_statement
          (call function: (attribute attribute: (identifier) @name))))
          (#eq? @name "urlretrieve"))
        ((module (expression_statement (assignment right:
          (call function: (attribute attribute: (identifier) @name)))))
          (#eq? @name "urlretrieve"))
  - id: module-invokes-download-process-helper
    desc: Module invokes download-and-process helper
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @defined body: (block) @body)
          (expression_statement (call function: (identifier) @called)))
          (#eq? @defined @called)
          (#match? @body "urlretrieve\\s*\\(")
          (#match? @body "(Popen|run|call|check_call|check_output)\\s*\\("))
composite_rules:
  - id: setup-active-urlretrieve-entry
    desc: Setup has an active download entry path
    any:
      - id: module-scope-urlretrieve-call
      - id: module-invokes-download-process-helper
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
