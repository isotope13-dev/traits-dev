defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: shell-download-client
    desc: Shell contains HTTP download client evidence
    crit: notable
    any:
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
      - id: micro-behaviors/communications/http/download/cli/curl-wget::wget-command-call
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve
