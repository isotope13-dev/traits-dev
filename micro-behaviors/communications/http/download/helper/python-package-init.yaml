defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  # Generic platform queries, temporary paths and shell calls do not prove a
  # platform-targeted download. The specific init staging signals remain below.
  - id: init-download-staging-clues
    desc: Python package init with download staging clues
    crit: suspicious
    conf: 0.95
    near_lines: 120
    needs: 2
    all:
      - id: metadata/file/size::init-py-file
    any:
      - id: micro-behaviors/communications/http/download/helper::download-with-delete-param
      - id: micro-behaviors/communications/http/download/helper::safe-download-import
      - id: micro-behaviors/communications/http/download/wget::wget-url-followon-command-text
      - id: micro-behaviors/process/daemonize/detach::nohup-string-command
    unless:
      - id: metadata/filename/name-form::configure-script
