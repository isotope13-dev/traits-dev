defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1105
  mbc: B0024

traits:
  - id: downloader-curl-wget-fallback
    desc: Curl falls back to wget
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)(^|[;&(]\s*)curl\b[^\n]{0,180}\|\|\s*wget\b'
  - id: downloader-wget-lwp-fallback
    desc: Wget falls back to lwp-download
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bwget\b[^\n]{0,180}\|\|\s*lwp-download\b'

composite_rules:
  - id: downloader-fallback-chain
    desc: Downloader fallback chain
    crit: suspicious
    conf: 0.95
    all:
      - id: downloader-curl-wget-fallback
      - id: downloader-wget-lwp-fallback
