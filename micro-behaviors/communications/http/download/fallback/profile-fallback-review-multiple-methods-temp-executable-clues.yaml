defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp]

composite_rules:
- id: multiple-methods-temp-executable-clues
  for: [pe, batch, powershell]
  desc: Multiple download methods and temp EXE clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/download/cli/multi-tool::multiple-download-methods
  - id: micro-behaviors/fs/path/temporary-artifact::windows-temp-executable-path
  any:
  - id: micro-behaviors/communications/url/host/name::cloudflare-tunnel-host-reference
  - id: micro-behaviors/communications/http/client/library::iwr-name
  - id: micro-behaviors/communications/http/download/cli/utility::bitsadmin-transfer-invocation
