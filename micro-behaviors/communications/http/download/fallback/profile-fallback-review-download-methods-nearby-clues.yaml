defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp]

composite_rules:
- id: download-methods-nearby-clues
  desc: Nearby download method references
  crit: suspicious
  conf: 0.96
  needs: 2
  # Bundled runtimes and command analyzers can carry unrelated downloader
  # vocabulary megabytes apart. A real fallback keeps its methods local.
  near_bytes: 8192
  any:
  - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/communications/tls/verify/callback::powershell-tls-callback-iwr-clues
  - id: micro-behaviors/communications/http/download/fallback::python-downloader-user-agent
  unless:
  - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-windows-agent-installer-context
  - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
  - id: well-known/app/infrastructure/tracebloc::tracebloc-client-context
  - id: well-known/app/infrastructure/pbs-plus::pbs-plus-agent-installer-context
  downgrade:
    any:
    - id: well-known/app/browser/internet-explorer/
