defaults:
  crit: notable
  platforms: [linux]
  attack: T1105

traits:
  - id: http-tftp-download-fallback
    desc: HTTP download falls back to TFTP
    for: [shell]
    if:
      type: text
      # A generic `curl ... || echo "FAILED"` is ordinary error handling, not a
      # transfer fallback. Require the distinct TFTP retrieval mechanism.
      regex: '(?i)(wget|curl).{0,80}\|\|.{0,80}tftp'
    unless:
      - type: text
        substr: command -v curl >/dev/null 2>&1 || command -v wget

composite_rules:
  # Multiple download clients are a resilience mechanism, not evidence of a
  # payload or attacker objective by themselves. Botnet/dropper objectives add
  # architecture selection, execution, raw endpoints, or persistence context.
  - id: multi-client-download-fallback
    desc: Uses multiple command-line download clients
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-cmd
      - id: micro-behaviors/communications/http/download/wget::wget-cmd
      - id: micro-behaviors/communications/http/download/busybox::wget
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget
      - id: micro-behaviors/communications/ftp/download/tftp::command
  - id: multi-client-multi-arch-download
    desc: Download fallback with multi-architecture targeting
    conf: 0.93
    near_lines: 80
    all:
      - id: multi-client-download-fallback
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
