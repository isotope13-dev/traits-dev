defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-latest-native-addon-stage
    desc: Latest release download stages beside native addon names
    crit: notable
    conf: 0.9
    scope: leaf
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/url/forge::github-latest-release-asset-url
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/path/library::node-native-addon-basename-reference
