# A URL to an XMRig release asset: the stock Monero miner fetched at run time
# rather than shipped. Neutral on its own -- setup guides and pool docs link
# the same assets; objectives pair it with a hardcoded pool and wallet.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1105

traits:
  - id: xmrig-release-download-url
    desc: XMRig release asset download URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)github\.com/xmrig/xmrig/releases/download/'
