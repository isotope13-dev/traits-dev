# The shape of a script that fetches a published release asset and installs it:
# a forge release-download URL, or a PowerShell installer function that wraps
# one. Neutral -- this is how nearly every "curl | install" project ships, and
# the objectives that care about it use it as benign context, not as evidence.
#
# It lived in well-known/tool/sysadmin/microsoft-powershell as
# `powershell-release-installer`, but `releases/download` names no product: it
# is in the URL of every GitHub release asset ever published. Every other
# well-known/ rule using that path anchors it to a specific repository
# (astral-sh/uv, github/codeql-action, ...); this one did not, so any ordinary
# project's install.ps1 was attributed to Microsoft PowerShell and keyed that
# vendor's ML feature. The matcher is unchanged -- only its name and home are.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.95

traits:
  - id: forge-release-download-url
    desc: References a release download URL path
    for: [scripts]
    if:
      type: text
      substr: releases/download

  - id: powershell-installer-function
    desc: PowerShell defines an installer function
    for: [powershell]
    if:
      type: text
      regex: '(?i)function\s+(Get-Installer|Invoke-Installer)'

composite_rules:
  - id: powershell-release-installer
    desc: PowerShell release installer source
    for: [powershell]
    any:
      - id: forge-release-download-url
      - id: powershell-installer-function
