defaults:
  platforms: [windows, unix]
  crit: suspicious
  for: [python, shell]

composite_rules:
  - id: shell-home-silent-ip-download
    desc: Silent IP download to a home path
    crit: suspicious
    conf: 0.96
    for: [shell]
    near_bytes: 80
    all:
      - id: micro-behaviors/communications/http/download/shell::download-to-home
      - id: micro-behaviors/communications/http/download/curl::curl-silent-output
      - id: micro-behaviors/communications/url/host/oob-http::curl-wget-ipv4-url
    unless:
      - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
