defaults:
  platforms: [windows, unix]

composite_rules:
- id: silent-ipv4-url-download
  desc: Silent curl saves a literal IPv4 URL
  crit: notable
  conf: 0.92
  for: [shell]
  all:
  - id: micro-behaviors/communications/http/curl::curl-silent
  - id: micro-behaviors/communications/url/host/oob-http::curl-external-ip-request
  - id: micro-behaviors/communications/http/download/curl::curl-output-staging-path
