defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

traits:
- id: workflow-curl-hidden-tmp-output
  desc: Workflow curl writes a hidden temp path
  crit: notable
  conf: 0.94
  for:
    - github-actions
  unless:
    - id: metadata/build/ci/github-actions::action-testdata-path
  if:
    type: text
    regex: \bcurl\b[^\n]{0,120}-o\s+/tmp/\.
