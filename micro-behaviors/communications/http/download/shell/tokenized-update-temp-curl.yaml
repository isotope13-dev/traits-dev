defaults:
  platforms: [macos]
  for: [shell]
composite_rules:
  - id: tokenized-update-temp-curl
    desc: Tokenized update path with temp curl output
    crit: suspicious
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/url/resource-path/administration::tokenized-product-update-path
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/fs/path/temp::unix-temp
