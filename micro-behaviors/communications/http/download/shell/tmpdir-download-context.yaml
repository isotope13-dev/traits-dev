defaults:
  for: [scripts, macho]
  platforms: [unix]
traits:
- id: localbin-download-stage
  desc: Download command targets a local-bin path
  crit: notable
  conf: 0.92
  for: [macho]
  if:
    type: text
    regex: '(curl -f -L -s -o "|wget -q -O ").{0,120}/\.local/bin/'
composite_rules:
- id: localbin-download-stage-composite
  for: [macho]
  desc: Quoted download output and local-bin reference
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/fs/path/location::local-bin-path-reference
  any:
  - id: micro-behaviors/communications/http/download/curl::curl-output-quoted
  - id: micro-behaviors/communications/http/download/wget::wget-output-quoted
