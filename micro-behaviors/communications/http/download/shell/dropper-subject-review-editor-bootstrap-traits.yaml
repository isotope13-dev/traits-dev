defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: script-download
    desc: Downloads script into editor config
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)curl.{0,160}-o.{0,80}\$HOME/[.]?(vscode|cursor|windsurf).{0,80}\.sh'
  - id: js-download
    desc: Downloads JavaScript into editor config dir
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(curl|wget)\b.{0,160}-o\s*"?\$HOME/[.]?(vscode|cursor|windsurf)/[\w.-]{1,60}\.[cm]?js'
