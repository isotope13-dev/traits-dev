defaults:
  platforms: [unix]
  for: [shell, text]

composite_rules:
- id: http-wget-near-executable-chmod
  for: [shell]
  desc: HTTP wget near executable chmod
  crit: notable
  conf: 0.96
  attack: T1105
  mbc: E1105
  near_lines: 10
  all:
    - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download
    - id: micro-behaviors/communications/url/scheme::http-url-shaped-text
    - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
