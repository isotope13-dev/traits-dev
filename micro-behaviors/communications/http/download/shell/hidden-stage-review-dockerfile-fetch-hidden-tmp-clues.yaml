defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: dockerfile-fetch-hidden-tmp-clues
  desc: Dockerfile fetch and hidden temp path clues
  crit: suspicious
  conf: 0.97
  for:
    - dockerfile
  near_lines: 1
  all:
    - id: micro-behaviors/fs/path/hidden::tmp-hidden-file
  any:
    - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-script
    - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-structured-file
