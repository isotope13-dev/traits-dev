defaults:
  platforms: [routeros, appliance, unix]
  for: [text, shell, python, pyc, javascript]
  attack: T1105
  mbc: C0002

traits:
  - id: routeros-fetch-command
    desc: RouterOS tool fetch network request
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: /tool fetch

  # A scheduled `upload=yes` fetch pushes a local file (the stock backup
  # recipe) and pulls nothing; only a download supplies remote content.
  - id: routeros-fetch-download
    desc: RouterOS tool fetch downloads content
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '/tool fetch[^\r\n]{0,300}'
    not:
      - regex: 'upload=(yes|true)'

  - id: routeros-fetch-upload
    desc: RouterOS tool fetch uploads a local file
    crit: notable
    conf: 0.88
    attack: T1048
    if:
      type: text
      regex: '/tool fetch[^\r\n]{0,300}upload=(yes|true)'

