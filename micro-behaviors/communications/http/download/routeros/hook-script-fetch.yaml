defaults:
  platforms: [routeros, appliance, unix]
  for: [text, shell, python, javascript]
traits:
  - id: routeros-hook-script-fetch
    desc: RouterOS fetch references hooks script
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '/tool fetch[\s\S]{0,260}/hooks/[A-Za-z0-9_.-]+\.rsc'

