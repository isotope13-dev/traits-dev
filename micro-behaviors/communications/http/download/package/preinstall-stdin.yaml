defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
traits:
  - id: preinstall-http-node-pipeline
    desc: Preinstall curl response piped into Node
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: '\bcurl\s+(-[fLsSk]+\s+)*https?://[^\s|;&]+\s*\|\s*node\s*(;|$)'
  - id: preinstall-wayback-url
    desc: Preinstall references Wayback archived URL
    conf: 0.98
    if:
      type: value
      path: scripts.preinstall
      substr: https://web.archive.org/web/
