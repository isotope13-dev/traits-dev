defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
composite_rules:
  - id: rust-build-rs-external-artifact-download
    desc: Cargo HTTP client and artifact URL clues
    crit: suspicious
    conf: 0.9
    for:
      - rust
    all:
      - id: micro-behaviors/communications/http/request/client::cargo-build-http-capable-client-profile
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/url/external/github::github-archive-ref-download
    unless:
      - id: metadata/build/wasi::conditional-wasi-sdk-bootstrap
      - id: well-known/lib/data/duckdb::libduckdb-download-build-marker
      - id:
          micro-behaviors/crypto/hash/digest/unnamed-algorithm::rust-build-rs-pinned-artifact-verify
      - id: well-known/lib/runtime/compiled/wasmer/
      - id: well-known/lib/ai/sherpa-onnx/
      - id: well-known/lib/ai/lindera::official-project-context
      - id: well-known/lib/runtime/rust-portaudio::rust-portaudio-library-context
