# The extractor resolves local MSBuild aliases and binds the hostname value
# to this DownloadFile task's query inside a pre-compilation target.
defaults:
  platforms: [windows, unix]
  for: [xml]
traits:
  - id: msbuild-precompile-hostname-query
    desc: Build download sends hostname in HTTP query
    crit: notable
    conf: 0.99
    if:
      type: value
      path: msbuild.downloads[*].precompile_hostname_query
      exact: 'true'

  - id: msbuild-precompile-hostname-webhook-query
    desc: Build hostname query targets webhook.site
    crit: notable
    conf: 0.99
    if:
      type: value
      path: msbuild.downloads[*].precompile_hostname_query_authority
      regex: '(?i)^webhook\.site(:[0-9]{1,5})?$'
