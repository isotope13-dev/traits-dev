defaults:
  platforms: [windows, unix]
composite_rules:
  - id: msbuild-host-read-query-clues
    desc: Build hook reads hostname beside download query
    crit: notable
    conf: 0.93
    for: [xml]
    scope: file
    near_bytes: 2048
    all:
      - id: metadata/build/msbuild::msbuild-before-compile-target
      - id: micro-behaviors/communications/http/download/package::msbuild-downloadfile-task
      - id: micro-behaviors/os/sysinfo/hostname/query::dotnet-machine-name-read
      - id: micro-behaviors/communications/url/query/profile::msbuild-query-property
