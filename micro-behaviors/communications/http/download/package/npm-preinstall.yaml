defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
- id: preinstall-download-tool
  desc: Preinstall script references curl or wget
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/communications/http/curl::npm-preinstall-curl
  - id: micro-behaviors/communications/http/download/wget::npm-preinstall-wget
