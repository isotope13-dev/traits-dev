# Source-level helpers that retrieve package archives. The call is a neutral
# download capability; supply-chain objectives add publication and hook-rewrite
# evidence before inferring propagation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.92
  mbc: C0002

traits:
  - id: package-tarball-download-call
    desc: Calls package tarball download helper
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(download|fetch|retrieve)[A-Za-z0-9_]*tarball$'
