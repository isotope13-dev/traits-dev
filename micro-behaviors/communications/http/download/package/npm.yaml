# HTTP GET / download capability expressed in an npm package.json script
# (curl / wget a URL). scripts[*] matches any script value. An outbound
# POST is a different capability (data going OUT, not a download) and lives in
# communications/http/post. Keep the curl/wget forms deliberately narrow so a
# POST flag with an attached argument cannot be mistaken for a download.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85
  mbc: C0002
  attack: T1071.001
traits:
  - id: npm-node-pre-gyp-install
    desc: npm install hook fetches prebuilt native binary
    conf: 0.96
    if:
      type: value
      path: scripts.install
      # prebuild-install honours the same `binary.host` field node-pre-gyp does.
      regex: '(^|[;&|]{1,2})\s*(node-pre-gyp\s+install|node\s+install|prebuild-install)(\s|$)'
  - id: npm-script-curl-download
    desc: npm script invokes curl URL
    # Command position only: a bare `\bcurl` also matched help text quoting
    # a fallback command (e.g. a version-gate preinstall whose error message
    # suggests `curl ... | bash`), which invokes nothing.
    if:
      type: value
      path: 'scripts[*]'
      regex: '(^|[;&|]{1,2})\s*curl\s+(-[fsSLOJkIiNg64vq#]+\s+)*https?://'
  - id: npm-script-wget-download
    desc: npm script invokes wget URL
    # Same command-position constraint as the curl form above.
    if:
      type: value
      path: 'scripts[*]'
      regex: '(^|[;&|]{1,2})\s*wget\s+(-[qv]+\s+)*https?://'
composite_rules:
  - id: npm-script-download
    desc: npm script fetches an HTTP URL
    any:
      - id: npm-script-curl-download
      - id: npm-script-wget-download
    unless:
      - id: metadata/package/files/dependency::node-modules-nested-package-json
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-langfuse-package
