# Prisma's fetch-engine packages download platform-native engines at runtime.
# These are neutral network capabilities; the supply-chain composites under
# objectives add package-identity and source-substitution context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
  attack: T1105

traits:
  - id: prisma-engine-mirror-env
    desc: Prisma engine mirror environment variable
    if:
      type: text
      regex: 'process\.env\.PRISMA_(BINARIES|ENGINES)_MIRROR'

  - id: prisma-engine-asset-template
    desc: Prisma engine binary-target URL layout
    if:
      type: text
      regex: '\$\{baseUrl\}/\$\{binaryTarget\}__\$\{binaryName\}\$\{finalExtension\}'

composite_rules:
  - id: prisma-engine-github-mirror
    desc: Prisma mirror defaults to GitHub release
    crit: notable
    conf: 0.96
    all:
      - id: prisma-engine-mirror-env
      - id: prisma-engine-asset-template
    near_bytes: 1024
