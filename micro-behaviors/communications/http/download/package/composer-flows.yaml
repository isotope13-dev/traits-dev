defaults:
  for: [composer.json]
  platforms: [windows, unix]
  crit: notable
  conf: 1.0

traits:
  - id: lifecycle-download-chmod-exec-flow
    desc: Composer hook fetch/chmod/exec path matches
    if:
      type: value
      path: composer.install_hook_flows[*].kind
      regex: '^(download-chmod-exec|hidden-temporary-download-chmod-background-exec)$'

  - id: lifecycle-download-insecure-tls
    desc: Composer download flow disables TLS checks
    if:
      type: value
      path: composer.install_hook_flows[*].curl_options[*]
      regex: '^(-[a-zA-Z]*k[a-zA-Z]*|--insecure)$'

  - id: lifecycle-download-stderr-discarded
    desc: Composer download flow discards stderr
    if:
      type: value
      path: composer.install_hook_flows[*].download_stderr_target
      exact: /dev/null
