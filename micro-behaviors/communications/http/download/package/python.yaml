# A URL that resolves to a Python distribution artifact — a wheel or an sdist.
#
# Neutral on its own: requirements files, lock files, CI scripts, vendoring
# helpers and offline-install bundles all name artifact URLs, and the great
# majority point at PyPI or a corporate index. It records only "this file names
# a URL that downloads an installable Python package". Objective composites
# supply the intent — see
# objectives/supply-chain/impersonation/dependency-override/, which pairs this
# with an ephemeral file-hosting host to catch a dependency served from outside
# any package index.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1071.001

traits:
  - id: python-wheel-download-url
    desc: URL that downloads a Python wheel
    if:
      type: text
      regex: 'https?://[^\s"''<>]{1,64}\.whl\b'
