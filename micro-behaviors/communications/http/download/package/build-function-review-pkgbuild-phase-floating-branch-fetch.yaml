defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pkgbuild-phase-floating-branch-fetch
    desc: PKGBUILD phase fetches mutable branch content
    crit: suspicious
    conf: 0.92
    near_lines: 25
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: micro-behaviors/communications/http/download/package::pkgbuild-build-phase-fetch
      - id: micro-behaviors/communications/url/path::mutable-branch-ref-path
    unless:
      - id: well-known/app/infrastructure/openshift::openshift-vale-download-context
      - id: well-known/app/infrastructure/openshift::openshift-istio-download-context
      - id: micro-behaviors/communications/http/download/shell::curl-wget-onnx-asset
      - id: micro-behaviors/communications/http/download/shell::curl-wget-image-asset
      - id: micro-behaviors/communications/http/download/shell::curl-wget-audio-asset

