defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
  conf: 0.96
  mbc: C0002
  attack: T1071.001
traits:
  - id: msbuild-downloadfile-task
    desc: MSBuild DownloadFile task element
    if:
      type: text
      exclude_html_comments: true
      substr: '<DownloadFile'
  - id: msbuild-downloadfile-computername-source
    desc: MSBuild source URL contains host name
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: 'SourceUrl\s*=\s*["'']https?://[^"'']{0,512}\$\(COMPUTERNAME\)'
      case_insensitive: true
