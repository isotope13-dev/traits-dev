defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
  conf: 0.96
  mbc: C0002
  attack: T1071.001
traits:
  - id: msbuild-downloadfile-task
    desc: MSBuild DownloadFile HTTP task
    if:
      type: text
      substr: '<DownloadFile'
  - id: msbuild-downloadfile-computername-source
    desc: MSBuild source URL contains host name
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)SourceUrl=["'']https?://[^"'']{0,40}(\$\(COMPUTERNAME\)|%COMPUTERNAME%)'
