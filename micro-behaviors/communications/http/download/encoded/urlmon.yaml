defaults:
  platforms: [windows]
  for: [html, vbs, powershell, batch]
  crit: notable
  conf: 0.97
traits:
  - id: encoded-urlmon-file-download-call
    desc: Decoded URLMon call downloads an HTTP URL
    if:
      type: encoded
      regex: '(?i)::URLDownloadToFile[AW]?\(\s*0\s*,\s*"https?://'
  - id: encoded-urlmon-appdata-script-download
    desc: Decoded URLMon saves an AppData WSH script
    if:
      type: encoded
      regex: '(?i)::URLDownloadToFile\(0,"https?://[^"]{1,300}","\$env:APPDATA\\[^"]{1,200}\.vb[se]"'
