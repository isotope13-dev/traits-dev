# Download-and-execute one-liners recovered from decoded data.
#
# These search the *decoded* string corpus, so they see through whatever
# encoding hid the command -- hex, base64, or a chain of both -- and are
# indifferent to the language that carried it. The same decoded pipeline turns
# up inside a Makefile recipe, a Gradle task, `build.rs` and an Xcode build
# setting; it is the payload that travels between build systems.
#
# Suspicious rather than hostile here: the matcher establishes the capability
# ("this decodes to a fetch that feeds a shell"), and the objectives that
# reference it supply the intent. Kept out of the plaintext `curl-pipe-shell`
# rule next door because a documented `curl … | sh` install line is ordinary,
# while an *encoded* one has gone out of its way not to be read.
# Typed for executable build ecosystems supported by the legacy analyzer.
# These match the *decoded* string corpus, so the host language is an accident
# of which build system the attacker chose -- the identical payload has been
# recovered from a Gradle Kotlin task, an Xcode build setting, a Makefile
# recipe, `build.rs` and a `setup.py`.
defaults:
  platforms: [unix]
  # `text` carries the build systems that have no file type of their own --
  # CMakeLists.txt above all, which is a build script by any measure but reaches
  # the engine as plain text.
  for: [scripts, -php, -perl, -lua, rust, groovy, kotlin, makefile, dockerfile, text]
  crit: suspicious
  conf: 0.95
  attack: T1105,T1059.004
  mbc: E1105

traits:
  - id: encoded-remote-shell-fetch
    desc: Encoded fetch piped into a shell
    if:
      type: encoded
      # Unicode/URL/wide decoders can re-emit cleartext surrounding an escape.
      # A minified line containing an unrelated \u2014 must not turn a readable
      # installer hint into an obfuscated command. Require a hiding encoding.
      encoding: [base64, base64-obf, hex, base32, base85, xor, stack]
      regex: '(curl|wget)\s[^\n]{0,200}\|\s*(sh|bash|zsh|dash)\b'
    unless:
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/
      - id: metadata/file/format/source-map::sourcemap-inline-base64
      # Agent products ship the model a command-risk policy that names this
      # exact pipeline as the thing to refuse. Two shapes appear:
      #   * a placeholder with no URL to fetch -- CodeGPT's TUI policy writes
      #     "Remote Code Execution From Untrusted Source: `curl ... | sh`";
      #   * a runnable-looking example carrying its own risk verdict -- VS
      #     Code's classifier prompt scores `curl -fsSL https://x.sh | bash
      #     -> red` beside `npm publish -> red` and `git push --force -> red`.
      - type: text
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026})\s{0,4}\\?\|\s{0,4}(sh|bash)'
      - type: text
        regex: '\|\s{0,4}[a-z]{2,4}sh\b[^\n]{0,40}->\s{0,4}red\b'

  # Command substitution captures a fetch response; echo alone does not execute it.
  - id: encoded-remote-command-substitution
    desc: Encoded curl or wget command substitution
    crit: notable
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, base32, base85, xor, stack]
      regex: '(eval|echo)\s+["'']?\$\((curl|wget)\s'
    unless:
      # Command-risk policies in coding agents cite placeholder examples like `eval "$(curl …)"`
      - type: text
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026}|\\x[eE]2\\u20[aA][cC]\\x[aA]6)'
      - type: encoded
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026})'
