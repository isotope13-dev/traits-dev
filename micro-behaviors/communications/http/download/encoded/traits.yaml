# Encoded command substitution captures a fetch response. Shell pipeline
# execution is defined in process/create/shell/pipeline instead.
defaults:
  platforms: [unix]
  # `text` carries the build systems that have no file type of their own --
  # CMakeLists.txt above all, which is a build script by any measure but reaches
  # the engine as plain text.
  for: [scripts, -php, -perl, -lua, rust, groovy, kotlin, makefile, dockerfile, text]
  crit: suspicious
  conf: 0.95
  attack: T1105,T1059.004
  mbc: E1105

traits:
  # Command substitution captures a fetch response; echo alone does not execute it.
  - id: encoded-remote-command-substitution
    desc: Encoded curl or wget command substitution
    crit: notable
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, base32, base85, xor, stack]
      regex: '(eval|echo)\s+["'']?\$\((curl|wget)\s'
    unless:
      # Command-risk policies in coding agents cite placeholder examples like `eval "$(curl …)"`
      - type: text
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026}|\\x[eE]2\\u20[aA][cC]\\x[aA]6)'
      - type: encoded
        regex: '(curl|wget)\s{0,4}(\.\.\.|\x{2026})'
