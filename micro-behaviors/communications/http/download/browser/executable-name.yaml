# HTML `download="…"` attributes naming executable, installer, or script
# extensions are neutral browser-download markup primitives, independent of
# how the user reached the page (captive portal, BitB lure, or software release).
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.96

traits:
  - id: download-executable-link
    desc: Download attribute names an executable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(exe|scr|com)["'']'

  - id: download-installer-link
    desc: Download attribute names an installer
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(msi|pkg|dmg)["'']'

  - id: download-command-link
    desc: Download attribute names command script
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(bat|cmd|ps1)["'']'

  - id: download-wsh-link
    desc: Download attribute names a WSH script
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(vbs|hta)["'']'

composite_rules:
  - id: installer-download-link
    desc: Download attribute names installer or script
    any:
      - id: download-executable-link
      - id: download-installer-link
      - id: download-command-link
      - id: download-wsh-link
      - id: browser-compressed-archive-download-name
