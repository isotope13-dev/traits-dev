defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.96
traits:
  - id: browser-compressed-archive-download-name
    desc: Browser download names archive
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(zip|7z|rar)["'']'

  - id: browser-disk-image-download-name
    desc: Browser download filename names a disk image
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''][^"'']{1,80}\.(iso|img|vhd)["'']'
composite_rules:
  - id: browser-archive-download-name
    desc: Browser download names archive or disk image
    any:
      - id: browser-compressed-archive-download-name
      - id: browser-disk-image-download-name
