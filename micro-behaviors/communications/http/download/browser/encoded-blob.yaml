defaults:
  platforms: [windows, unix]
  for: [batch, powershell, html, javascript, pe, elf, macho]
  crit: notable
  conf: 0.96

traits:
  - id: encoded-response-blob-download
    desc: Encoded script prepares response Blob download
    if:
      type: encoded
      regex: '(?s)\.blob\(\).{0,160}createObjectURL\(.{0,80}\.download\s*='
