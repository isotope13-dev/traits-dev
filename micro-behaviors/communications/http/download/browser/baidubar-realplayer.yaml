defaults:
  for:
  - html
  platforms:
  - windows
traits:
- id: baidubar-dloadds-method
  desc: DloadDS method name or hex spelling
  if:
    type: text
    regex: DloadDS|\\x44\\x6c\\x6f\\x61\\x64\\x44\\x53
  crit: notable
  conf: 0.98
  for:
  - javascript
  - html
  - text
- id: percent-hex-dloadds-name
  desc: Percent-wrapped hex DloadDS method name
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: '%5Cx44%5Cx6c%5Cx6f%5Cx61%5Cx64%5Cx44%5Cx53'
