defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  - id: base64-archive-download-cooccurrence
    desc: Base64 archive download APIs occur nearby
    crit: notable
    conf: 0.95
    all:
    - id: micro-behaviors/data/decode/base64::base64-to-blob-text-sequence
    - id: micro-behaviors/communications/http/header/content-type::archive-media-type-reference
    - id: micro-behaviors/communications/http/download/browser::browser-archive-download-name
    any:
    - id: micro-behaviors/ui/window/click::programmatic-element-click
    - id: micro-behaviors/communications/url/object::browser-object-url
    - id: micro-behaviors/ui/window/dom/tree::dom-blob-download-link
    near_bytes: 1024
    unless:
    - id: metadata/build/minifier::js-large-minified-bundle
