defaults:
  platforms: [windows]
  for: [html]


composite_rules:
  - id: html-forced-script-download-clues
    desc: HTML forced download and script filename clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/dom/tree::object-url-click-or-download-attribute
      - id: metadata/document/html/markup::html-script-download-file
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
      - id: micro-behaviors/ui/help/interaction::html-double-click-script-instruction
  - id: html-wsf-download-data-uri-clues
    desc: HTML WSF filename and data URI clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/document/html/markup::html-downloads-wsf
      - id: micro-behaviors/communications/url/encoded::inline-application-or-font-data-uri
  - id: html-js-download-data-uri-clues
    desc: HTML JS filename and data URI clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/document/html/markup::html-downloads-js
      - id: micro-behaviors/communications/url/encoded::inline-application-or-font-data-uri
