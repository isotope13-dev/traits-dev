# Browser download plumbing as written inside an SVG's own <script> block:
# a Blob wrapped in an object URL, and a script-set download attribute
# followed by a programmatic click. Matched on the SVG itself so SVG-scoped
# composites can require them alongside the SVG container facts.
defaults:
  for: [svg]
  platforms: [windows, unix]
  crit: notable
  conf: 0.93

traits:
  - id: svg-script-blob-object-url
    desc: SVG script makes object URL from Blob
    if:
      type: text
      regex: '(?s)new\s+Blob\s*\(.{0,600}?\.createObjectURL\s*\('
  - id: svg-script-download-click
    desc: SVG script sets download name and clicks
    if:
      type: text
      regex: '(?s)\.download\s*=.{0,400}?\.click\s*\(\s*\)'
  - id: svg-script-long-base64-literal
    desc: SVG script holds long Base64 literal
    if:
      type: text
      regex: '["''][A-Za-z0-9+/]{900}'
