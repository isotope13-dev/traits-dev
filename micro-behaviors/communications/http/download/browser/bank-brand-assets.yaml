defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.94

traits:
  - id: bank-domain-image-source
    desc: HTML image source uses a bank-named domain
    if:
      type: text
      regex: '(?i)<img\s+src=["'']https?://[a-z.-]{0,60}bank\.[a-z.]{2,20}/'
      exclude_html_comments: true
