# Browsers cannot render an archive, so an iframe whose src is an archive
# data: URI is saved to disk as soon as the page loads, without a click or
# any script. Legitimate pages link archives; they do not frame them.
defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: iframe-archive-data-uri
    desc: Iframe loads an inline archive data URI
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,200}\bsrc\s*=\s*["'']?data:application/(x-)?(zip|rar|7z)'
