# Browser-side download triggering from script.
#
# A page can start a file download without the user clicking anything: build an
# anchor, set its `download` attribute, append it and call `.click()`. This is
# ordinary web-app behavior used by export buttons and similar pages, so it
# stays a neutral capability. The delivery objectives decide when the thing
# being fetched and the place it comes from make it a drive-by.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: js-anchor-download-attribute
    desc: Script sets the anchor download attribute
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.download\s*=\s*["'']'

  - id: browser-iframe-installer-source
    desc: Iframe points to installer
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\biframe\.src\s*=\s*["''][^"''\r\n]{0,160}\.(exe|msi|zip)\b'

  # Android payload push: an anchor or location that hands the browser an
  # .apk. Neutral for app-download pages; distribution objectives pair it with
  # UA gating and backend beacons to mark malware landing pages.
  - id: js-apk-download-attr-assign
    desc: Sets the download attribute to an APK
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.download\s*=\s*["''][^'']{0,80}\.apk'

  - id: js-apk-download-attr-setattribute
    desc: setAttribute names an APK download
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)setAttribute\s*\(\s*["'']download["'']\s*,\s*["''][^'']{0,80}\.apk'

  - id: js-apk-location-href
    desc: location.href navigates to an APK
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)location\.href\s*=\s*["''][^'']{0,120}\.apk'

  # `js-programmatic-element-click` was a second copy of the canonical
  # metadata/lang/source/syntax/call/invocation::click-call matcher, filed here as
  # if a bare `.click()` meant a download. It does not — jQuery datepickers,
  # radio groups and tab strips all trigger it — and the duplicate hid the
  # canonical atom whenever it matched first. The composite below now references
  # the canonical trait; the `download` attribute leg supplies the download
  # meaning.

  # `fetch(url).then(r => r.blob())` -- reads a response body as a Blob. File
  # exports and media viewers do this; the drive-by objectives add the save
  # or launch step.
  - id: fetch-response-blob
    desc: Reads a fetch() response as a Blob
    conf: 0.7
    for: [html, javascript]
    if:
      type: text
      regex: 'fetch\s*\([^)]{0,200}\)[^.]{0,40}\.then\s*\([^)]{0,80}\.blob\s*\(\s*\)'

  - id: js-executable-download-filename
    desc: Sets Windows executable/script download name
    crit: notable
    conf: 0.95
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)\.download\s*=\s*["''][^"'']{1,80}\.(exe|msi|hta|jse|wsf)["'']'

  # Obfuscated downloaders stage the anchor idiom as decoder-table strings,
  # so no call shape survives static matching; the co-occurrence composite
  # below references the quoted-word fragments that live with the other
  # string-literal fragments. Ordinary prose ("click to download") rarely
  # quotes both words, and dot-form export code is covered by the attribute
  # atoms above.
composite_rules:
  # A Base64 ZIP can be a legitimate client-side export. Keep this as a
  # browser capability; objective rules add obfuscation or deceptive delivery.
  - id: base64-zip-browser-download
    desc: Reconstructs an embedded Base64 ZIP and starts a browser download
    crit: notable
    conf: 0.96
    all:
      - id: metadata/file/encoding/compression::base64-zip-inline-archive
      - id: micro-behaviors/data/decode/base64/unspecified::base64-to-blob-text-sequence
      - id: micro-behaviors/data/buffer/alloc::blob-construction
    any:
      - id: micro-behaviors/ui/window/dom/tree::object-url-click-or-download-attribute
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob
      - id: micro-behaviors/ui/window/dom/tree::dom-blob-object-url-download

  - id: js-apk-download-trigger
    desc: Triggers an APK file download
    crit: notable
    conf: 0.94
    any:
      - id: js-apk-download-attr-assign
      - id: js-apk-download-attr-setattribute
      - id: js-apk-location-href

  # The synthesised-anchor download idiom: element built in code, marked as a
  # download, and clicked without the user touching it.
  - id: js-scripted-anchor-download
    desc: Script clicks a synthesised download link
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/collection/dom::dom-anchor-element-creation
      - id: js-anchor-download-attribute
      - id: micro-behaviors/data/control-flow/dispatch/named::click-call
    near_bytes: 1024
  # Table-driven spelling of the same idiom: decoder-table strings carry the
  # anchor vocabulary as bare quoted entries, so the quoted-word fragments
  # (kept with the other string-literal fragments) stand in for the call
  # shapes above.
  - id: quoted-download-click-strings
    desc: Quoted download and click strings co-occur
    crit: notable
    conf: 0.8
    all:
      - id: metadata/lang/source/literal/string/fragment::quoted-download-string
      - id: metadata/lang/source/literal/string/fragment::quoted-click-string
