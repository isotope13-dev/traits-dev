defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.82

traits:
  - id: html-anchor-download-attribute
    desc: HTML anchor download attribute
    if:
      type: text
      regex: '<a\b([^>"'']|"[^"]{0,99}"|''[^'']{0,99}'')*\sdownload\s*(=|/?>)'
      case_insensitive: true
  - id: html-element-data-archive-download-url
    desc: Data attribute stages archive download URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bdata-[a-z0-9_-]{1,16}\s*=\s*["''][^"''\n]{1,80}\.(zip|7z|rar|iso|exe)\b'
