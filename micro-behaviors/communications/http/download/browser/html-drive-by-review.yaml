defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
- id: download-attribute-appref
  desc: Download attribute names ClickOnce appref-ms
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '\.download\s*=\s*[''"][^''"]{1,80}\.appref-ms[''"]'
    case_insensitive: true
- id: download-attribute-document
  desc: Download attribute names a document
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\.download\s*=\s*[''"][^''"]{1,80}\.(pdf|docx?|xlsx?|pptx?)[''"]'
    case_insensitive: true
- id: download-attribute-shortcut
  desc: Download attribute names a shortcut
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '\.download\s*=\s*[''"][^''"]{1,80}\.lnk[''"]'
    case_insensitive: true
- id: iso-blob-mime
  desc: Disk-image MIME marker in browser Blob
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?is)new\s+Blob\s*\([\s\S]{0,700}application/(x-cd-image|x-iso9660-image)'
- id: download-attribute-iso
  desc: Download attribute names a disk image
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: (?i)\.download\s*=\s*["'][^"']{1,100}\.iso["']
  unless:
  - id: metadata/package/documentation/security-exercise::assessment-playbook-examples
  - id: metadata/package/agent-skill::agent-skill-directory-member
  - id: micro-behaviors/communications/url/host/tld-http::reserved-documentation-tld-url
