defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-executable-url-except-ssm
    desc: Executable URL besides AWS SSM setup
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
    unless:
      - id: micro-behaviors/communications/http/download/url::aws-ssm-agent-setup-url
