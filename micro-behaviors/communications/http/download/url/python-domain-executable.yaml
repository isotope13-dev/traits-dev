defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: python-named-domain-binary-url
  desc: Python-named domain URL with executable suffix
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    regex: https?://[a-z0-9-]*python[a-z0-9-]*\.[a-z]+/[^\s]{0,50}\.(exe|scr|msi)
- id: python-named-domain-script-url
  desc: Python-named domain URL with script suffix
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    regex: https?://[a-z0-9-]*python[a-z0-9-]*\.[a-z]+/[^\s]{0,50}\.(bat|cmd)
