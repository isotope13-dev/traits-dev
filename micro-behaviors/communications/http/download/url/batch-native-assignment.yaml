defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.94
traits:
  - id: batch-assigned-exe-http-url
    desc: Batch variable stores an HTTP executable URL
    if:
      type: text
      regex: '(?im)^\s*set\s+"?\w{1,51}=https?://[^\s"]{1,160}\.exe([?#"\s]|$)'
  - id: batch-assigned-dll-http-url
    desc: Batch variable stores an HTTP DLL URL
    if:
      type: text
      regex: '(?im)^\s*set\s+"?\w{1,51}=https?://[^\s"]{1,160}\.dll([?#"\s]|$)'
