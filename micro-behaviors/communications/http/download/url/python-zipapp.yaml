traits:
- platforms:
  - unix
  - windows
  for:
  - python
  - text
  id: python-remote-zipapp-url
  desc: Remote Python zipapp URL reference
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: https?://[^\s"']{1,240}\.pyz($|[?#\s"'])
  unless:
  - id: metadata/package/testing/harness/unit::go-test-source-file
  # PyPA publishes virtualenv's own zipapp here; Poetry's stock installer
  # fetches it when venv is unavailable.
  not:
  - substr: bootstrap.pypa.io/virtualenv/
