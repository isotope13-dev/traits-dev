defaults:
  for: [data]
  platforms: [windows, unix]
  attack: T1105
  mbc: E1105

traits:
  - id: flash-geturl2-http-stage
    desc: Flash GetURL2 loads HTTP stage
    crit: notable
    conf: 0.99
    # The HTTP constant precedes the stable GetURL2 stack program. Mutable
    # host and payload-name bytes are intentionally excluded from both spans.
    if:
      type: hex
      pattern: >-
        43 57 53 [59]
        8C 92 92 02 2B 7D [41]
        20 06 13 07 83 8C FB 34 26 06 0E 66 30 C9 22 33 8B 91 C1
      offset: 0
  - id: swf-geturl2-movie-load
    desc: Flash GetURL2 movie-load opcode
    crit: notable
    conf: 0.95
    # GetVariable (1C) feeding GetURL2 (9A, length 1) whose flags byte 0x40
    # selects the load-target (movie) form over the variable-loading form.
    # Unanchored so it matches uncompressed (FWS) movies at any offset; CWS
    # compression hides this bytecode, which the packed matcher above covers.
    if:
      type: hex
      pattern: "1C 9A 01 00 40"
