traits:
- platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - text
  id: service-prefixed-executable-url
  desc: Service-prefixed executable URL reference
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: https?://(git|npm|pypi)-[a-z0-9-]+\.[a-z]+/[^\s"']{0,50}\.(pyz|exe)($|[?#\s"'])
