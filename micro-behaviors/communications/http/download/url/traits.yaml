defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: executable-url-reference-a
    desc: URL path ends in a Windows executable
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[^\s''"]{1,160}\.(exe|scr|msi|bat)([?#][^\s''"]{0,120})?$'
    unless:
      # Static documentation commonly links to encyclopedia entries whose
      # titles end in .exe; that is not an executable download behavior.
      - id: metadata/file/profile/identity::static-documentation-html-page
  - id: executable-url-reference-b
    desc: URL ends in .cmd, .ps1 or .dll
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[^\s''"]{1,160}\.(cmd|ps1|dll)([?#][^\s''"]{0,120})?$'
    not:
      # IIS/ASP script endpoints named *.dll are HTTP handlers, not downloads.
      - regex: '(?i)/(scripts|cgi-bin)/[^\s''"]+\.dll'
    unless:
      - id: metadata/file/profile/identity::static-documentation-html-page

  # Native binaries do not expose AST-backed string literals. Keep the same
  # URL identity visible for PE downloaders through the binary text index.
  - id: executable-url-reference-pe
    desc: PE contains executable download URL
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      regex: 'https?://[^\s''"]{1,160}\.(exe|scr|msi|bat|cmd|ps1|dll)([?#][^\s''"]{0,120})?$'

  - id: script-url-reference-pe
    desc: PE contains Windows script download URL
    crit: notable
    conf: 0.92
    for: [pe, dll]
    platforms: [windows]
    if:
      # The host has to look like a host. Without that anchor the pattern read
      # any `http://` followed by anything ending in a script extension, and
      # matched `http://.jpg|right|thumb|.js` — a fragment of the Brotli static
      # dictionary, which every .NET binary that references System.IO
      # .Compression carries verbatim. There is no URL there and no download.
      type: text
      regex: 'https?://[\w-]{1,40}(\.[\w-]{1,40})+/[^\s''"]{0,120}\.(vbs|jse?|wsf|hta)\b'
      case_insensitive: true

  - id: os-package-url-reference
    desc: HTTP URL ending in package extension
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[^\s''"]{1,160}\.(pkg|deb|rpm)([?#][^\s''"]{0,120})?$'
    unless:
      - id: metadata/file/profile/identity::static-documentation-html-page

  - id: archive-url-reference-a
    desc: URL ends in .zip or .7z
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[^\s''"]{1,160}\.(zip|7z)([?#][^\s''"]{0,120})?$'
    unless:
      - id: metadata/document/html::doctype

  - id: archive-url-reference-b
    desc: URL ends in .rar, .tar or .gz
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[^\s''"]{1,160}\.(rar|tar|gz)([?#][^\s''"]{0,120})?$'
  # GitHub's public source-archive endpoints (/archive/, /tarball/, /zipball/,
  # codeload) serve a repository's own source, not attacker-staged payloads — the
  # canonical "fetch an action/tool's source" pattern used by CI action wrappers
  # and installers. Deliberately NOT github /releases/, which can host arbitrary
  # payload assets. Used as a benign-context gate on dropper/staging composites.
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/document/html::doctype
  - id: archive-url-reference-text
    desc: References an HTTP(S) archive URL in text
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: 'https?://[^\s''"]{1,160}\.(zip|7z|rar|tar|gz)([?#][^\s''"]{0,120})?'
    unless:
      - id: metadata/document/html::doctype
  - id: unicode-archive-url-reference
    desc: Unicode-decoded HTTP(S) archive URL
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: encoded
      encoding: unicode-escape
      regex: 'https?://[^\s''"]{1,160}\.(zip|7z|rar|tar|gz)([?#][^\s''"]{0,120})?'
    unless:
      - id: metadata/document/html::doctype
  - id: github-repo-source-archive-url
    desc: github.com repository source-archive URL
    crit: baseline
    conf: 0.9
    if:
      type: string_literal
      regex: 'github\.com/[^/\s''"]{1,80}/[^/\s''"]{1,80}/(archive|tarball|zipball)/'
  - id: github-codeload-source-url
    desc: codeload.github.com source-archive URL
    crit: baseline
    conf: 0.9
    if:
      type: string_literal
      regex: 'codeload\.github\.com/'

  # The same URL, quoted inside a longer command rather than standing alone.
  #
  # The `-a`/`-b` forms anchor on `$`, so they only see a literal that *is* the
  # URL. A dropper usually builds one command string --
  # `os.system('powershell -Uri "https://host/x.exe?dl=0" -OutFile ...')` --
  # and the URL sits in the middle of it, followed by a quote. Requiring a
  # quote or whitespace after the extension keeps the same precision as the
  # end-anchor without demanding the URL be the whole literal.
  - id: executable-url-reference-embedded
    desc: Executable URL quoted inside a command
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: 'https?://[^\s''"]{1,160}\.(exe|scr|msi|bat)([?#][^\s''"]{0,120})?["''\s]'
    unless:
      - id: metadata/file/profile/identity::static-documentation-html-page

composite_rules:
  - id: executable-url-reference
    desc: HTTP URL ending in executable extension
    crit: notable
    conf: 0.88
    any:
      - id: executable-url-reference-a
      - id: executable-url-reference-b
      - id: executable-url-reference-pe
      - id: executable-url-reference-embedded

  - id: archive-url-reference
    desc: References an HTTP(S) archive URL
    crit: notable
    conf: 0.88
    any:
      - id: archive-url-reference-a
      - id: archive-url-reference-b
      - id: archive-url-reference-text
      - id: unicode-archive-url-reference

  - id: github-source-archive-url
    desc: References a GitHub repository source archive
    crit: baseline
    conf: 0.9
    any:
      - id: github-repo-source-archive-url
      - id: github-codeload-source-url

