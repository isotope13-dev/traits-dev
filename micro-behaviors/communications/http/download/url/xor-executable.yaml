defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1105

traits:
  # Installer URLs kept as a XOR-masked config (key=value lines) rather than
  # plain strings, so static URL scans of the binary see nothing.
  - id: xor-decoded-executable-url
    desc: XOR-decoded executable download URL
    if:
      type: encoded
      encoding: xor
      regex: '(?i)/[^\s"''<>/]{1,100}\.exe\b'

composite_rules:
  - id: xor-decoded-download-url
    desc: XOR-decoded download or executable URL
    crit: notable
    conf: 0.9
    any:
      - id: xor-decoded-executable-url
      - id: micro-behaviors/communications/url/host/domain-http::xor-decoded-http-url
