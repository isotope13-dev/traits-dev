defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1105

traits:
  # Installer URLs kept as a XOR-masked config (key=value lines) rather than
  # plain strings, so static URL scans of the binary see nothing.
  - id: xor-decoded-executable-url
    desc: XOR-decoded executable download URL
    if:
      type: encoded
      encoding: xor
      regex: '(?i)https?://[^\s"''<>]{4,100}\.exe\b'
