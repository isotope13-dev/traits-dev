defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: cleartext-external-ip-fetch-context
    desc: Cleartext IP URL and HTTP client APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    any:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: micro-behaviors/communications/socket/init::winsock-client-symbol-lifecycle

  - id: custom-port-selected-tld-https-fetch-context
    desc: Custom-port HTTPS URL and HTTP client APIs
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
    any:
      - id: micro-behaviors/communications/http/url/port::https-selected-tld-four-digit-port-url
      - id: micro-behaviors/communications/http/url/port::x86-affine-xor-selected-tld-https-custom-port
