defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  - typescript
  - scripts
traits:
- id: public-ip-executable-url
  desc: Executable URL references a public IPv4 host
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: (?i)https?://(\d+\.){3}\d+[^\s"'<>]{1,120}\.(exe|msi|pkg|dmg)\b
    is: external_ip
  not:
  - regex: //(10|127|0|169)\.
  - regex: //192\.168\.
  - regex: //172\.(1[6-9]|2[0-9]|3[01])\.
  - regex: cgi-(win|bin)/
  - regex: AMG_?\.exe
