defaults:
  for: [xml, python, javascript, java, go, rust, ruby, csharp]
  platforms: [windows, linux, macos]
traits:
  - id: remote-database
    desc: ODF database source names an HTTP URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'table:database-name=["\x27]https?://'
  - id: refresh-delay
    desc: ODF database range sets automatic refresh
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '<table:database-range\b[^>]{0,160}table:refresh-delay='
composite_rules:
  - id: refresh-remote-database
    desc: ODF auto-refresh range links a remote database
    crit: notable
    conf: 0.96
    all:
      - id: remote-database
      - id: refresh-delay
    near_lines: 3
