# Both predicates concern retrieval/write; neither requires execution.
defaults:
  platforms: [windows]
  for: [ruby]

composite_rules:
  - id: ruby-http-temp-exe-write-profile
    desc: Ruby temp EXE and HTTP response write clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/netlib::ruby-nethttp-get-temp-exe-context
      - id: micro-behaviors/fs/write/file/response-body::ruby-file-write-binary-response
