# Adjacent statements bind HTTP JSON fields to the selected cloud item and
# local destination. Downloading a file does not establish its execution.
defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  crit: notable
  conf: 0.97
traits:
- id: csharp-http-task-selected-file-write
  desc: HTTP task selects file download destination
  if:
    type: tree-sitter
    query: |-
      ((block (local_declaration_statement (variable_declaration (variable_declarator (identifier) @task (invocation_expression (member_access_expression) @parse (argument_list . (argument (await_expression (invocation_expression (member_access_expression) @task_get))) .))))) . (local_declaration_statement (variable_declaration (variable_declarator (identifier) @selector (invocation_expression (member_access_expression (invocation_expression (member_access_expression (member_access_expression (identifier) @source_task) (identifier) @source_property))))))) . (local_declaration_statement (variable_declaration (variable_declarator (identifier) @destination (invocation_expression (member_access_expression (invocation_expression (member_access_expression (member_access_expression (identifier) @destination_task) (identifier) @destination_property))))))) . (expression_statement (await_expression (invocation_expression (member_access_expression) @write (argument_list . (argument (identifier) @written_path) . (argument (await_expression (invocation_expression (member_access_expression) @bytes_get (argument_list . (argument (binary_expression (binary_expression (identifier) @selected_item))) .)))) .)))))
      (#eq? @parse "JsonDocument.Parse")
      (#match? @task_get "^[A-Za-z_]\\w*\\.GetStringAsync$")
      (#eq? @source_property "GetProperty")
      (#eq? @destination_property "GetProperty")
      (#eq? @write "File.WriteAllBytesAsync")
      (#match? @bytes_get "^[A-Za-z_]\\w*\\.GetByteArrayAsync$")
      (#eq? @task @source_task)
      (#eq? @task @destination_task)
      (#eq? @selector @selected_item)
      (#eq? @destination @written_path))
