defaults:
  platforms: [unix]
  for: [markdown, shell]

traits:
  - id: curl-command-saves-skill-document
    desc: curl command saves an agent skill document
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bcurl\b[^\n]{1,180}( -o |> ?)["'']?([^\s"'']{0,80}/)?SKILL\.md(["''\s]|$)'
