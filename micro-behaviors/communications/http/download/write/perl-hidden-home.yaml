# LWP retrieval, a hidden HOME path and chmod coexist; the matcher does not
# require launching that path or bind the HTTP response to it.
defaults:
  platforms: [unix]
  for: [perl]

composite_rules:
  - id: perl-lwp-hidden-home-write-profile
    desc: Perl LWP and hidden HOME chmod clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-get-call
      - id: micro-behaviors/fs/path/location::perl-hidden-home-path
      - id: micro-behaviors/fs/chmod/executable/mode::perl-chmod-hidden-home-executable
    any:
      - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-content-file-option
      - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-content-file-hex
