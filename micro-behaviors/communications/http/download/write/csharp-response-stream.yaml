defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
traits:
  - id: csharp-response-content-copy
    desc: Copies HTTP content to a stream
    if:
      type: symbol
      kind: call
      regex: '\.Content\.CopyToAsync$'
composite_rules:
  - id: csharp-http-response-file-stream
    desc: HTTP GET with nearby file stream and content copy
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/get::getasync
      - id: micro-behaviors/fs/write/file/stream::filestream-write-access
      - id: csharp-response-content-copy

  - id: csharp-file-download-clues
    desc: C# file download API or HTTP stream staging
    any:
      - id: micro-behaviors/communications/http/client/managed::downloadfile
      - id: csharp-http-response-file-stream
