defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
  # A downloader declares its URL near the top of the module and streams the
  # response into a file further down. In observed builds the URL constant and
  # the write stream sit about 5-6.5 KB apart, so the window must cover that.
  - id: node-response-stream-to-file
    desc: Node HTTP response streamed into a file
    crit: notable
    conf: 0.9
    near_bytes: 8000
    all:
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/communications/http/response::node-response-pipe
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
