defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - package.json
  crit: notable
composite_rules:
- id: hook-named-script-fetch-write-profile
  desc: Hook-named script has fetch and write calls
  conf: 0.94
  for:
  - javascript
  - typescript
  scope: file
  all:
  - id: micro-behaviors/communications/http/download/write::fetch-read-with-body-reader-file-write
  - id: metadata/package/files/included::install-or-beacon-js-basename
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/package/files/dependency::vendored-source-path
- id: npm-install-hook-fetch-write-profile
  desc: npm hook declaration with fetch/write sidecar
  conf: 0.95
  for:
  - javascript
  - typescript
  - package.json
  - zip
  - jar
  - tar
  - npm
  - whl
  scope: archive
  all:
  - id: hook-named-script-fetch-write-profile
  any:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: metadata/package/scripts/lifecycle::has-install-script
  unless:
  - id: metadata/package/scripts/lifecycle::package-manager-bootstrap-hook
  - id: metadata/archive/member/path::macos-app-bundle-member
- id: npm-install-hook-github-web-fetch-write-profile
  desc: npm hook fetch/write with raw GitHub web URL
  conf: 0.96
  scope: archive
  for:
  - javascript
  - typescript
  - package.json
  - zip
  - jar
  - tar
  - npm
  - whl
  all:
  - id: hook-named-script-fetch-write-profile
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-web-file
  any:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: metadata/package/scripts/lifecycle::has-install-script
