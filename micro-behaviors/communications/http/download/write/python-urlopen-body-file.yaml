# A file write whose data is a urlopen response body, proven by dataflow:
# the download lands on disk, whatever the file name.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-copyfileobj-response-handle
    desc: Copies response-named object to handle
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: (attribute object: (identifier) @shutil
            attribute: (identifier) @copy)
          arguments: (argument_list (identifier) @source (identifier) @target))
          (#eq? @shutil "shutil") (#eq? @copy "copyfileobj")
          (#eq? @source "response") (#eq? @target "handle"))

  - id: python-urlopen-body-written-to-file
    desc: Writes urlopen response body to file
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)write$'
      arg:
        index: 0
        from:
          call: '^(urllib\.request\.|urllib2\.)?urlopen$'
          through:
            - call: '\.read$'
              receiver: true
