defaults:
  crit: notable
  mbc: C0016
  platforms: [windows, unix]
  for: [python]
traits:
  - id: official-sandbox-agent-release-url
    desc: Official sandbox-agent release URL
    conf: 0.95
    if:
      type: text
      substr: "releases.rivet.dev/sandbox-agent/"
composite_rules:
  # The required legs establish an HTTP request plus a file write, not the
  # transfer direction: upload tooling (a registry publish CLI posting an
  # artifact, then writing a keypair) satisfies both. The description claims
  # only the co-occurrence the evidence supports.
  - id: python-http-request-file-write
    desc: Python HTTP request with file write
    conf: 0.9
    size_max: 50000
    attack: T1105
    all:
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/fs/write/file/handle::python-binary-write-pattern
    unless:
      - id: official-sandbox-agent-release-url
