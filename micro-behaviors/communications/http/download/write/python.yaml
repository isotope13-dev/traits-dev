defaults:
  crit: notable
  mbc: C0016
  platforms: [windows, unix]
  for: [python]
traits:
  - id: official-sandbox-agent-release-url
    desc: Official sandbox-agent release URL
    conf: 0.95
    if:
      type: text
      substr: "releases.rivet.dev/sandbox-agent/"

  - id: python-response-content-binary-write
    desc: Writes Python HTTP response bytes to file
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement
            (assignment
              left: (identifier) @resp
              right: (call
                function: (attribute
                  object: (identifier) @client
                  attribute: (identifier) @get))))
          (_)*
          (with_statement
            (with_clause
              (with_item
                value: (as_pattern
                  (call
                    function: (identifier) @open
                    arguments: (argument_list . (_) . (string) @mode))
                  alias: (as_pattern_target (identifier) @file))))
            body: (block
              (_)*
              (expression_statement
                (call
                  function: (attribute
                    object: (identifier) @writer
                    attribute: (identifier) @write)
                  arguments: (argument_list
                    . (attribute
                        object: (identifier) @body_obj
                        attribute: (identifier) @content) .))))))
          (#match? @client "^(requests|httpx)$")
          (#eq? @get "get")
          (#eq? @open "open")
          (#match? @mode "^[\"'][wax]b[\"']$")
          (#eq? @resp @body_obj)
          (#eq? @file @writer)
          (#eq? @write "write")
          (#eq? @content "content"))
