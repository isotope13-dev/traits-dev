# Persisting an HTTP response is a neutral download capability. Install-hook,
# payload and execution objectives add lifecycle or content-use evidence before
# assigning intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105

composite_rules:
  - id: script-fetches-and-writes-remote-content
    desc: JavaScript saves fetched remote content
    crit: notable
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
    any:
      - id: micro-behaviors/fs/file/write/async
      - id: micro-behaviors/fs/file/write/direct
