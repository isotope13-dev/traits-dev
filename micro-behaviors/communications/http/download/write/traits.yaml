# The write data comes from a body-reader call; this does not establish
# that the reader belongs to the same HTTP request elsewhere in the file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: fetch-read-with-body-reader-file-write
  desc: HTTP body read and body-reader file write
  crit: notable
  conf: 0.94
  scope: file
  all:
  - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
  - id: micro-behaviors/fs/write/file/response-body::node-write-body-reader-result
