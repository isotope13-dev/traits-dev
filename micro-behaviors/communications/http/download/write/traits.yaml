# Persisting an HTTP response is a neutral download capability. Install-hook,
# payload and execution objectives add lifecycle or content-use evidence before
# assigning intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105

composite_rules:
  - id: node-archive-download-to-file
    desc: JavaScript downloads a remote archive to a local file
    crit: notable
    conf: 0.85
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/request/
      - id: micro-behaviors/communications/http/download/url::archive-url-reference
      - id: micro-behaviors/fs/write/file/full::js-file-write
    unless:
      - id: metadata/build/bundler/asset::js-vite-rollup-vendor-chunk
      - id: metadata/build/minifier::js-medium-minified-line
      - id: well-known/tool/development/ci/action-download-artifact::source-tree
      - id: well-known/app/ai/media/comfy-desktop::comfy-bootstrap-fetch-path
      - id: micro-behaviors/communications/http/download/url::github-source-archive-url
      - id: well-known/tool/sysadmin/ripgrep::repository-marker
      - id: well-known/app/data/opensearch::tesseract-model-download-url
      - id: well-known/dual-use/transfer/rclone::rclone-official-release-downloader

  - id: script-fetches-and-writes-remote-content
    desc: JavaScript saves fetched remote content
    crit: notable
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
    any:
      - id: micro-behaviors/fs/write/file/
