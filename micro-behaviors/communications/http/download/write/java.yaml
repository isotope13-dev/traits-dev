# Java saves an HTTP response body into a newly created file: the
# download-to-disk half of a dropper pipeline and an ordinary updater
# capability alike. The FileOutputStream leg binds a destination; the
# fetched file's execution and purpose stay in their own homes.
defaults:
  platforms: [android, unix, windows]
  for: [java, jsp, kotlin]
  crit: notable
  conf: 0.9

composite_rules:
  - id: java-http-response-file-write
    desc: Java saves an HTTP response body to a file
    scope: file
    near_bytes: 500
    all:
      - id: micro-behaviors/communications/http/client/response-body::java-urlconnection-response-stream-read
    any:
      - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
      - id: micro-behaviors/fs/write/file/stream::kotlin-fileoutputstream-source
