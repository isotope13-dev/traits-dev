# Adjacent statements bind a newline-delimited HTTP task to both the local
# destination (field 1) and remote item selector (field 0). No execution claim.
defaults:
  platforms: [unix, windows]
  for: [csharp]
  crit: notable
  conf: 0.97
traits:
  - id: csharp-http-line-task-selected-file-write
    desc: HTTP line task selects download and destination
    if:
      type: tree-sitter
      query: |-
        ((block
          (local_declaration_statement
            (variable_declaration (variable_declarator
              (identifier) @task
              (invocation_expression) @split)))
          .
          (expression_statement
            (invocation_expression
              (member_access_expression) @write
              (argument_list
                . (argument (element_access_expression
                  (identifier) @destination
                  (bracketed_argument_list (argument (integer_literal) @destination_index))))
                . (argument (await_expression (invocation_expression
                  (member_access_expression) @get
                  (argument_list . (argument (binary_expression
                    (binary_expression (element_access_expression
                      (identifier) @source
                      (bracketed_argument_list (argument (integer_literal) @source_index)))))) .)))) .))))
          (#match? @split "^\\(await [A-Za-z_]\\w*\\.GetStringAsync\\([^;]{1,512}\\)\\)\\.Split")
          (#match? @split "\\.Split\\('\\\\n'\\)$")
          (#eq? @write "File.WriteAllBytes")
          (#match? @get "^[A-Za-z_]\\w*\\.GetByteArrayAsync$")
          (#eq? @task @destination)
          (#eq? @task @source)
          (#eq? @destination_index "1")
          (#eq? @source_index "0"))
