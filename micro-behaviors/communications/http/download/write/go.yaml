# Go copies an HTTP response body into a newly created file: the
# download-to-disk half of a dropper pipeline and an ordinary updater
# capability alike.
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.85

traits:
  - id: go-http-response-file-copy
    desc: Go copies HTTP data into a file
    if:
      type: text
      regex: '(?s)os\.Create\s*\(.{0,120}?\).{0,300}?io\.Copy\s*\('
