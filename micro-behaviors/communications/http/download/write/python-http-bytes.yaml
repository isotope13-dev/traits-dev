defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  - id: python-http-task-selected-file-write
    desc: Writes HTTP bytes to task path
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute object: (identifier) @file attribute: (identifier) @write)
          arguments: (argument_list
            . (subscript subscript: (string) @key)
            . (call function: (attribute attribute: (identifier) @fetch)) .))
          (#eq? @file "File")
          (#eq? @write "WriteAllBytes")
          (#match? @key "^[\"']path[\"']$")
          (#eq? @fetch "DownloadData"))
