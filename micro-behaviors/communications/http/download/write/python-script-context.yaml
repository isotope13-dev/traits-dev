# Source retrieval, a write-mode open and a script path appear nearby. The
# matcher does not establish that the response is written to that path.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-urlopen-script-write-profile
    desc: Python URL read near script-path write clues
    crit: suspicious
    conf: 0.96
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: micro-behaviors/fs/file/open::write-append-create-mode
      - id: micro-behaviors/fs/write/file/target::py-open-script-path
    unless:
      - id: metadata/package/testing/
