# The urlopen response body is written to a Python source file. Separate URL
# reads and local script-file writes do not establish this download behavior.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

traits:
  - id: response-read-to-python-file
    desc: Writes read() data to a Python file
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    if:
      type: text
      regex: 'open\([^)]{0,80}\.py[^)]{0,80}\)[\s\S]{0,160}\.write\(\s*response\.read\('

composite_rules:
  - id: python-urlopen-script-write-profile
    desc: Writes Python source from a urlopen response
    crit: suspicious
    conf: 0.96
    scope: file
    near_bytes: 1000
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-bound-as-response
      - id: response-read-to-python-file
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      # Credential bootstrap writes a source-able environment-export fragment
      # (`export KEY="value"` lines for later pipeline steps), not a payload.
      - id: micro-behaviors/os/env/write::shell-export-assignment-text
      # Maintainer bootstrap scripts inside library trees (scapy's
      # generate_ethertypes fetches the IANA registry and writes
      # ethertypes.py) are update tooling, not dropped payloads.
      - id: well-known/lib/network/scapy::scapy-library-context
