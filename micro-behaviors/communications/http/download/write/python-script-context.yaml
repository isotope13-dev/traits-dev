# Source retrieval, a write-mode open and a script path appear nearby. The
# matcher does not establish that the response is written to that path.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

traits:
  # A source-able environment-export fragment: `export KEY="value"` lines
  # appended for later pipeline steps to `source`. Credential bootstrap
  # tooling writes these; droppers write payloads.
  - id: shell-env-export-fragment
    desc: Shell environment-export fragment writer
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    if:
      type: text
      # No leading \b: the word often follows a literal `\n` escape inside a
      # string, whose trailing `n` is a word character.
      regex: 'export\s+[A-Za-z_]\w*\s*='

composite_rules:
  - id: python-urlopen-script-write-profile
    desc: Python URL read near script-path write clues
    crit: suspicious
    conf: 0.96
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: micro-behaviors/fs/file/open::write-append-create-mode
      - id: micro-behaviors/fs/write/file/target::py-open-script-path
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      # Credential bootstrap writes a source-able environment-export fragment
      # (`export KEY="value"` lines for later pipeline steps), not a payload.
      - id: shell-env-export-fragment
      # Maintainer bootstrap scripts inside library trees (scapy's
      # generate_ethertypes fetches the IANA registry and writes
      # ethertypes.py) are update tooling, not dropped payloads.
      - id: well-known/lib/network/scapy::scapy-library-context
