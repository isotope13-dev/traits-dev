defaults:
  platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.95
traits:
- id: cfhttp-get-path-file-download
  desc: HTTP GET specifies output path and file
  if:
    type: symbol
    kind: call
    exact: cfhttp
    args:
    - index: 0
      from:
        field: method
        whole_value: (?i)^get$
    - index: 0
      from:
        field: path
        field_exists: true
    - index: 0
      from:
        field: file
        field_exists: true
