defaults:
  platforms: [windows]
traits:
  - id: adodb-stream-object
    desc: Creates an ADODB.Stream COM object
    crit: notable
    conf: 0.9
    size_max: 300000
    for:
      - javascript
      - vbs
    if:
      type: text
      regex: (?i)(ActiveXObject|CreateObject)\s*\(\s*["']ADODB\.Stream["']\s*\)
    unless:
      - id: metadata/build/transpiler/typescript-web::typescript-webtsc-namespace
    attack: T1106
