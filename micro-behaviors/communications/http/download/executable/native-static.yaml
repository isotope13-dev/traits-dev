# This co-occurrence is useful capability evidence, not attack admission.
# A tiny static downloader can be legitimate, even if its file mode is 0777.
defaults:
  platforms: [linux, unix, android]
  for: [elf]

composite_rules:
  - id: tiny-static-http-world-executable-file
    desc: Tiny static HTTP and mode-0777 file creation
    crit: notable
    conf: 0.98
    size_max: 4096
    all:
      - id: metadata/binary/layout/size::tiny-elf
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty-flag"
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/communications/http/get::binary-get-path
      - id: micro-behaviors/fs/file/open::native-open-create-mode-0777
    any:
      - id: micro-behaviors/communications/socket/syscall::arm-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-literal-pool-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::mips-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::x86-64-direct-network-syscalls
