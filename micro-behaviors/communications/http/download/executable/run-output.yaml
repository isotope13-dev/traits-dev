# A string constant that downloads with curl into a PowerShell variable and
# immediately invokes that same kind of variable: `curl ... -o $o; & $o`.
# A literal matcher sees the decoded string, so \x20/\x22 escapes in an
# obfuscator string array do not hide it.
defaults:
  platforms: [windows]
  for: [scripts, source]
traits:
  - id: embedded-curl-output-variable-invoke
    desc: Embedded curl saves then invokes output
    crit: notable
    conf: 0.95
    attack: T1105,T1059.001
    if:
      type: literal
      kind: string
      regex: (?i)\bcurl(\.exe)?\s[^\r\n;]{0,200}\s-o\s+\$\w+\s*;\s*&\s*\$\w+
