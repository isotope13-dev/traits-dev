traits:
- id: embedded-download-chmod-command
  desc: Embedded command downloads then applies chmod
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  if:
    type: literal
    kind: string
    regex: (?i)\b(curl|wget|fetch)\b[^\r\n]{0,320}[;&|]\s*chmod\s+\+x\b
  platforms:
  - windows
  - unix
