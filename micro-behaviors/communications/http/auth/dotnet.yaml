# .NET NetworkCredential assignment — used by HttpClient, WebProxy, SmtpClient, etc.
defaults:
  for: [csharp, powershell]
  platforms: [windows, unix]
traits:
  # Relocated from micro-behaviors/communications/email/send/exchange, where it
  # was named and described as an Exchange behaviour. It is not one:
  # `CredentialCache.DefaultNetworkCredentials` is the general System.Net
  # property that runs a request as the logged-in Windows user, and HTTP, FTP
  # and SMTP clients all read it — as does the BCL itself, so every
  # self-contained .NET publish carries `get_DefaultNetworkCredentials` in its
  # string heap. Reporting "uses ambient Windows credentials for Exchange" on a
  # graph-database CLI sent the reader looking for mail code that isn't there.
  # The EWS mailbox-export composite still references this and supplies the
  # Exchange legs that make it mean something.
  - id: dotnet-default-network-credentials
    desc: Uses the logged-in Windows user's credentials
    crit: notable
    conf: 0.94
    for: [csharp, powershell, pe, dll]
    platforms: [windows]
    if:
      # `get_DefaultNetworkCredentials` is how the property reader appears in a
      # .NET assembly's #Strings heap, and `_` is a word character, so a
      # leading \b would never match there.
      type: text
      regex: '(?i)(^|[^A-Za-z0-9])(get_|CredentialCache\.)?DefaultNetworkCredentials'

  - id: dotnet-network-credential-assign
    desc: Assigns .NET NetworkCredential to Credentials
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: '(?i)\b(Credentials|UseDefaultCredentials)\s*=\s*new\s+NetworkCredential\b'
  - id: powershell-network-credential-assign
    desc: PowerShell NetworkCredential assignment
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bCredentials\s*=\s*New-Object\s+System\.Net\.NetworkCredential'
