# A large Bearer-adjacent repeat can construct a mock response challenge.
# It supplies neutral size/construction evidence; exploit intent requires the
# F5 endpoint and TLS context in the objective composite.
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  - shell
  - javascript
  - go
  - ruby
  - perl
  - java
  id: bearer-large-repetition
  desc: Bearer text near oversized repetition
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)bearer.{0,30}(\.repeat\s*\(|['"]\s*\*\s*)(0x[0-9a-f]{4,}|[0-9]{5,})
