defaults:
  platforms: [windows, unix]
  for: [html, scripts]
traits:
  - id: antibot-token-header-assignment
    desc: Assigns a 64-hex X-Antibot-Token header
    crit: notable
    conf: 0.97
    if:
      type: text
      # An assigned token is an authentication header observation, not kit identity.
      regex: '(?i)["'']X-Antibot-Token["'']\s*:\s*["''][0-9a-f]{64}["'']'

