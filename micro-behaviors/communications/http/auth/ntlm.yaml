defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.92

traits:
  - id: requests-ntlm-auth-class
    desc: requests-ntlm authentication class reference
    platforms: [windows, linux, macos]
    for: [python, pyc]
    conf: 0.98
    if:
      type: text
      substr: HttpNtlmAuth
  - id: http-ntlm-auth-header
    desc: HTTP NTLM authentication header
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(WWW-Authenticate|Authorization)\b[^\n]{0,100}\bNTLM\b'
