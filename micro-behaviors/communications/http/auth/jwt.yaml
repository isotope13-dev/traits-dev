# JWT authentication mechanics.  These atoms describe token structure; the
# authentication-bypass objective combines them with an outbound Bearer use.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: jwt-unsecured-algorithm
    desc: Unsecured alg none setting
    # This atom recognizes token syntax in source, fixtures, and tests.  An
    # active bypass requires the credential-access objective's usage context.
    # The separator is `[:=]` so JSON/dict (`"alg": "none"`), Go map literals,
    # and PowerShell/Ruby hashtable (`alg = 'none'`) forms all match.
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)["'']?alg["'']?\s*[:=]\s*["'']none["'']'

  - id: jwt-actor-token-claim
    desc: Nested actor token field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)["'']?actortoken["'']?\s*[:=]'

  - id: jwt-x5t-key-identifier-field
    desc: x5t key identifier field
    crit: notable
    conf: 0.92
    if:
      type: text
      # Require a quoted claim name — bare `X5t=` is a common minified
      # identifier (e.g. mermaid bundles), not a JWT x5t header field.
      regex: '(?i)["'']x5t["'']\s*[:=]'

  - id: jwt-rsa-algorithm-field
    desc: RSA algorithm field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?alg["'']?\s*[:=]\s*["'']?RS(256|384|512)["'']?'

  - id: jwt-delegation-trust-claim
    desc: Token asserts trusted-for-delegation claim
    # SharePoint server-to-server / ACS high-trust tokens carry this claim so
    # the bearer may act on behalf of another principal.  A forged actor token
    # sets it to unlock delegated impersonation.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?trustedfordelegation["'']?\s*[:=]'

  - id: jwt-array-segment-join
    desc: Joins encoded JWT segments with dots
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b(b64url|base64url)\b[\s\S]{0,260}\.join\s*\(\s*["'']\.["'']'

  - id: jwt-python-segment-join
    desc: Python joins JWT segments with dots
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      # Require a JWT/base64url cue nearby — bare `'.'.join((` is routine for
      # dotted module paths and other non-token joins (e.g. google-pasta scope).
      regex: '(?is)\b(jwt|b64url|base64url)\b[\s\S]{0,260}["'']\.["'']\s*\.join\s*\(\s*[\(\[]'

  - id: bearer-header-from-variable
    desc: Builds Bearer authorization header from variable
    # Accepts the header/value separators (`:` map entry, `=` assignment,
    # `,` positional call argument) and the value forms used to splice a token
    # variable in: `"Bearer " +` concatenation, `"Bearer $var"` interpolation,
    # and `` `Bearer ${var}` `` templates.  Covers Python, JS/TS, Go, PowerShell.
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)Authorization["''`]?\s*[:=,]\s*[fFrRuUbB]?["''`]Bearer\s+(["''`]\s*\+|\$|\{)'

  - id: jwt-placeholder-signature-literal
    desc: JWT placeholder signature literal
    # The SharePoint PoC uses a non-empty `AAAA` actor-token signature that is
    # carried through the vulnerable validation path without verification.
    # Keep this as a neutral token artifact; the exploit composites supply the
    # SharePoint and nested-token context.
    crit: notable
    conf: 0.96
    if:
      type: string_literal
      exact: .AAAA
