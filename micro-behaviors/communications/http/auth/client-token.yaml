defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: hardcoded-client-token-field
    desc: Hardcoded client/API/auth token field
    conf: 0.82
    if:
      # The symbol projection does not expose object-field literal values.
      # A parsed pair excludes comments and strings quoting example code.
      type: tree-sitter
      query: |
        ((pair key: (_) @key value: (string) @value) @field
          (#match? @key "(?i)^[\"']?(client|api|auth)[-_]?token[\"']?$")
          (#match? @value "^[\"'][A-Za-z0-9][A-Za-z0-9_-]{11,}[\"']$")
          (#not-match? @value "(?i)^[\"'](STRING_VALUE|YOUR[_-].*)[\"']$"))
