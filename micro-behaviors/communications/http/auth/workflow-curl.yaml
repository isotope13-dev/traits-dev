defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001,T1041"
  mbc: E1020

traits:
  # The secret as *credential*, not as payload. `--oauth2-bearer $TOKEN`,
  # `-u`/`--user` and an Authorization header are how a workflow authenticates
  # to a service it is allowed to use; exfiltration is when the secret is the
  # thing being sent. Bevy's send-screenshots-to-pixeleagle.yml curls its own
  # pixel-eagle instance with `--oauth2-bearer ${{ secrets.PIXELEAGLE_TOKEN }}`
  # to upload screenshots, and gates the job on `env.PIXELEAGLE_TOKEN_EXISTS`.
  - id: workflow-curl-credential-auth
    desc: Workflow curl authenticates with a token
    crit: notable
    conf: 0.94
    for: [github-actions]
    if:
      type: text
      regex: '(?i)(--oauth2-bearer|--user\b|-H\s+["'']?Authorization:)'
