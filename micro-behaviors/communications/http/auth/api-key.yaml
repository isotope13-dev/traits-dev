defaults:
  platforms:
  - macos
  - linux
  - windows
  for:
  - scripts
  - source
  crit: notable
traits:
  - id: api-key-header-map-entry
    desc: Configures a bare api-key request header
    conf: 0.9
    if:
      type: text
      regex: '[{,]\s*["'']api-key["'']\s*:'
      case_insensitive: true
