defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  crit: notable
  conf: 0.95
traits:
  - id: auth-credentials-response
    desc: Returns web-request authentication credentials
    if:
      type: text
      regex: "\\breturn\\s*\\{\\s*authCredentials\\s*:\\s*\\{"
  - id: webrequest-auth-callback-credentials
    desc: Sends credentials through auth callback
    if:
      type: text
      regex: "(asyncCallback|callback)\\s*\\(\\s*\\{\\s*authCredentials\\s*:"
composite_rules:
  - id: webrequest-credential-provider
    desc: Browser request authentication credential provider
    all:
      - id: micro-behaviors/communications/http/auth::webrequest-auth-required-listener
    any:
      - id: micro-behaviors/communications/http/auth::auth-credentials-response
      - id: micro-behaviors/communications/http/auth::webrequest-auth-callback-credentials
