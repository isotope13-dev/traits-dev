defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: ide-oauth-token-info-api
    desc: IDE OAuth token information API
    if:
      type: text
      regex: '(?i)\b(getOAuthTokenInfo|OAuthPreferences)\b'

  - id: oauth-access-token-field
    desc: OAuth access token field
    if:
      type: text
      regex: '(?i)(access[_-]?token|accessToken)'

  - id: oauth-refresh-token-field
    desc: OAuth refresh token field
    if:
      type: text
      regex: '(?i)(refresh[_-]?token|refreshToken)'

  # Identifier-shaped and case-sensitive on purpose. The earlier spelling was a
  # free-text `(import|save|store|persist).{0,80}(account|credential)`, which
  # matched any prose or symbol within 80 characters of the word "account" —
  # a 2FA add-on's `normalizeImportedAccountRecord()` and a webpack bundle's
  # English comments both hit it, neither having anything to do with an
  # account credential store.
  - id: account-credential-store-identifier
    desc: Account credential store identifier
    if:
      type: text
      regex: '\b(import|save|store)\w{0,8}(Account|Credential)s?\b'

composite_rules:
  - id: oauth-access-refresh-token-fields
    desc: OAuth access and refresh token fields
    crit: notable
    conf: 0.96
    all:
      - id: oauth-access-token-field
      - id: oauth-refresh-token-field
    near_bytes: 600

  - id: oauth-account-import-token-pair
    desc: Account import carries OAuth token pair
    crit: notable
    conf: 0.96
    all:
      - id: account-credential-store-identifier
      - id: oauth-access-refresh-token-fields
    near_bytes: 800
