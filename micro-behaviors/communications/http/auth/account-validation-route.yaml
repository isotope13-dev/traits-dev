defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: email-validation-route
    desc: HTTP email validation route
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '/(validation|validate)[_/-]?email\b|/email[_/-]?(validation|validate)\b'
      case_insensitive: true

  - id: account-existence-route
    desc: HTTP account existence route
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/(account|user)[_/-]?(exists|lookup)\b'
      case_insensitive: true

composite_rules:
  - id: email-account-validation-route
    desc: Email or account validation route
    crit: notable
    conf: 0.92
    any:
      - id: email-validation-route
      - id: account-existence-route
