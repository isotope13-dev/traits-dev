defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92
traits:
  - id: presigned-url-reference
    desc: References a pre-signed HTTP URL
    if:
      # Signing vocabulary alone establishes neither PUT nor upload; a signed
      # URL may authorize downloads as well. The PUT composite adds its method.
      type: text
      regex: '(?i)signed[\s._-]?url|presigned'
