# Neutral observation; attack context belongs in the consuming objectives.
traits:
- platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  - rust
  - html
  - php
  - typescript
  id: telegram-bot-api-path-token
  desc: Telegram Bot API path with token-shaped literal
  crit: suspicious
  conf: 0.95
  unless:
  - id: metadata/package/testing/
  if:
    type: literal
    regex: api\.telegram\.org/bot\d{8,12}:[A-Za-z0-9_-]{30,}
  not:
  - substr: api.telegram.org/bot0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefgh
  - substr: api.telegram.org/bot01234567:abcdefghijklmn_ABCDEFGH
  - substr: api.telegram.org/bot123456789:ABCdefGHIjklMNOpqrSTUvwxyz
  - substr: FakeToken
  - substr: FakeFake
  - substr: UseSTD3RulesAccept-
  - regex: api\.telegram\.org/bot\d+:\d+$
  - regex: api\.telegram\.org/bot\d{8}:[0-9a-f]{24,35}
