defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go, java, rust, php]
traits:
  - id: prefixed-hmac-sha256-scheme
    desc: Named HMAC-SHA256 authentication scheme
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '^[A-Z][A-Z0-9]{1,3}-HMAC-SHA256$'
