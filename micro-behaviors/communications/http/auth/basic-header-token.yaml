defaults:
  crit: notable
  platforms: [unix, windows, android]
  for: [binaries, scripts, c, cpp, rust, go]
  mbc: C0002
traits:
  - id: authorization-basic-header-token
    desc: HTTP Basic Authorization header string
    conf: 0.92
    if:
      type: text
      substr: "Authorization: Basic"
      case_insensitive: true
