defaults:
  platforms: [unix, windows]
traits:
  - id: hardcoded-telegram-bot-token-literal
    desc: Telegram-shaped bot token literal
    crit: notable
    conf: 0.96
    for: [javascript, typescript, rust, go]
    if:
      type: literal
      kind: string
      # Match a complete standalone token literal.  Unanchored matching made
      # AWS ARN account IDs plus queue names look like Telegram tokens.
      regex: '^\d{8,12}:[A-Za-z0-9_-]{30,60}$'
    not:
      - substr: 0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefgh

  # Bytecode/python twin: Telegram RATs written in Python keep the token as a
  # module constant, and PyInstaller bundles surface it inside the bytecode
  # member, where a text run -- not a parser literal -- carries it.
  # Bytecode/python twin: Telegram RATs written in Python keep the token as a
  # module constant, and PyInstaller bundles surface it inside the bytecode
  # member, where marshal packs neighbouring constants into one text run --
  # so the shape cannot be end-anchored. The 30-60 char no-colon tail and
  # the alphabet exclusion keep ARN-style account prefixes out.
  - id: hardcoded-telegram-bot-token-bytecode
    desc: Telegram-shaped bot token in bundled bytecode
    crit: notable
    conf: 0.93
    for: [python, pyc]
    if:
      type: text
      regex: '\b\d{8,12}:[A-Za-z0-9_-]{30,60}'
    not:
      - substr: 0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefgh
      - regex: '\b\d{8,12}:[0-9a-f]{24,35}\b'
      - regex: '\b\d{8,12}:0x[0-9a-f]{30,60}\b'
      - regex: '^arn:[a-z0-9-]+:[a-z0-9-]+:'
    unless:
      - id: metadata/package/testing/
      - type: text
        substr: TELEGRAM_BUG_REPORTER_API_ENDPOINT
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: well-known/tool/detection/sast::trufflehog-package-context
      - id: well-known/tool/detection/sast::trufflehog-package-exception
      - id: well-known/tool/detection/sast::trufflehog-detector-source-path
      - type: text
        regex: '(?is)placeholder\s*=\s*["''][^"'']*\d{8,12}:[A-Za-z0-9_-]{30,60}'
      - id: well-known/lib/network/go-telegram-bot-api::library-source-context
      - id: "metadata/file/naming::test-directory-component"

  # PE and ELF string tables are text runs, not parser literals, so the
  # source token rule never sees api.telegram.org/bot<id>:<secret> there.
  - id: hardcoded-telegram-bot-url-token
    desc: Telegram bot token embedded in API URL
    crit: suspicious
    conf: 0.95
    for: [binaries]
    if:
      type: text
      regex: 'api\.telegram\.org/bot\d{8,12}:[A-Za-z0-9_-]{30,60}'
    not:
      - substr: api.telegram.org/bot0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefgh
      - substr: api.telegram.org/bot01234567:abcdefghijklmn_ABCDEFGH
      - substr: api.telegram.org/bot123456789:ABCdefGHIjklMNOpqrSTUvwxyz
      - substr: FakeToken
