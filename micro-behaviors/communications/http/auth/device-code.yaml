defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.93

traits:
  - id: microsoft-device-login-url
    desc: Microsoft device-login URL
    if:
      type: text
      regex: '(?i)microsoft\.com/devicelogin'

  - id: microsoft-deviceauth-path
    desc: Microsoft OAuth deviceauth path
    if:
      type: text
      regex: '(?i)login\.microsoftonline\.com.{0,80}deviceauth'

  - id: microsoft-devicecode-path
    desc: Microsoft OAuth devicecode path
    if:
      type: text
      regex: '(?i)login\.microsoftonline\.com.{0,80}devicecode'

  - id: microsoft-credential-type-endpoint
    desc: Microsoft account validation endpoint
    crit: notable
    conf: 0.92
    for: [html, scripts, binaries]
    if:
      type: text
      # GetCredentialType is a Microsoft identity-provider endpoint used to
      # validate whether a target account exists before a sign-in flow. Keep
      # the URL path boundary so prose mentioning the API name does not match.
      regex: '(?i)/(common/)?GetCredentialType\b'

  - id: device-code-start-route
    desc: Device authorization start route
    if:
      type: text
      regex: '(?i)/(api/)?device/(start|authorize|code)\b'

  - id: device-code-status-route
    desc: Device authorization status route
    if:
      type: text
      regex: '(?i)/(api/)?device/(status|state|poll)([/?!#"'']|\b)'

  - id: device-code-entry-verb
    desc: Tells user to enter device code
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(enter|type|paste|use)\b.{0,80}\bdevice\s+code\b'

  - id: device-code-entry-reversed
    desc: Device code followed by entry instruction
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bdevice\s+code\b.{0,80}\b(enter|type|paste)\b'

  # These fields and response markers are provider-neutral parts of the OAuth
  # 2.0 device authorization grant.  They deliberately avoid kit names,
  # domains, and provider-specific endpoint strings.
  # Second alternation covers ES6 property shorthand and destructuring —
  # `const { device_code, user_code } = await r.json()` — which is how modern
  # JS actually names these fields and carries no `:`/`=` next to the key.
  # It requires a `{`/`,` before the token so the English phrase
  # "device-code" in prose and comments still does not match.
  - id: device-code-response-field
    desc: OAuth device code response field
    if:
      type: text
      regex: '(?i)\b(device|user)[_-]?code\b\s*[:=]|[{,]\s*(device|user)[_-]?code\s*[,}]'

  - id: indexed-device-code-response-field
    desc: Indexed OAuth device code response field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[\s*['']?(device|user)[_-]?code['']?\s*\]'

  # verification_uri/_url is an identifier rather than an English phrase, so
  # the shorthand forms need no brace guard.
  - id: device-code-verification-uri-field
    desc: OAuth device verification URI field
    if:
      type: text
      regex: '(?i)\bverification[_-]?(uri|url)\w*\s*[:=,}]'

  - id: pending-status-field
    desc: Pending status field
    crit: component
    if:
      type: text
      regex: '(?i)\b(status|state|error)\b\s*[:=].{0,40}\b(pending|slow[_-]?down)\b'

  - id: completed-status-field
    desc: Completed status field
    crit: component
    if:
      type: text
      regex: '(?i)\b(status|state|result)\b\s*[:=].{0,40}\bcompleted\b'

  - id: approved-status-field
    desc: Approved status field
    crit: component
    if:
      type: text
      regex: '(?i)\b(status|state|result)\b\s*[:=].{0,40}\bapproved\b'

  - id: authorized-status-field
    desc: Authorized status field
    crit: component
    if:
      type: text
      regex: '(?i)\b(status|state|result)\b\s*[:=].{0,40}\bauthorized\b'

  - id: success-status-field
    desc: Success status field
    crit: component
    if:
      type: text
      regex: '(?i)\b(status|state|result)\b\s*[:=].{0,40}\bsuccess\b'

  - id: device-code-loop-timer
    desc: Repeating timer marker
    crit: component
    if:
      type: text
      regex: '(?i)\b(setInterval|setTimeout)\b'

  - id: device-code-loop-sleep
    desc: Calls a sleep function
    crit: component
    if:
      type: text
      regex: '(?i)\b(time\.sleep|Thread\.sleep)\b'

  - id: device-code-while-condition
    desc: Device authorization while condition
    crit: component
    if:
      type: text
      regex: '(?i)\bwhile\b.{0,120}\b(pending|approved|authorized|completed)\b'

  - id: device-code-for-condition
    desc: Device authorization for condition
    crit: component
    if:
      type: text
      regex: '(?i)\bfor\b.{0,120}\b(pending|approved|authorized|completed)\b'

  # Require an object member rather than matching Python/RST `:param
  # access_token:` documentation. Response intent comes from composites.
  - id: token-object-field
    desc: OAuth token object member
    if:
      type: text
      regex: '(?i)["''](access|refresh|id)[_-]token["'']\s*:'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: indexed-oauth-token-field
    desc: Indexed OAuth token field reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[[''](access[_-]?token|refresh[_-]?token|id[_-]?token)['']\]'

  - id: access-token-camel-field
    desc: Camel-case OAuth access token field
    if:
      type: text
      regex: '(?i)(["'']accessToken["'']\s*([:=]|=>)|\[\s*["'']accessToken["'']\s*\])'

  - id: refresh-token-camel-field
    desc: Camel-case OAuth refresh token field
    if:
      type: text
      regex: '(?i)(["'']refreshToken["'']\s*([:=]|=>)|\[\s*["'']refreshToken["'']\s*\])'

  - id: id-token-camel-field
    desc: Camel-case OAuth identity token field
    if:
      type: text
      regex: '(?i)(["'']idToken["'']\s*([:=]|=>)|\[\s*["'']idToken["'']\s*\])'

composite_rules:
  - id: device-code-response-fields
    desc: OAuth device code response field forms
    crit: component
    any:
      - id: device-code-response-field
      - id: indexed-device-code-response-field

  - id: device-code-loop-condition
    desc: Device authorization condition loop
    crit: component
    any:
      - id: device-code-while-condition
      - id: device-code-for-condition

  - id: device-code-flow-marker
    desc: Device authorization flow marker
    crit: component
    any:
      - id: oauth-device-login-endpoint
      - id: device-code-response-fields
      - id: device-code-verification-uri-field
      - id: device-code-entry-instruction
      - id: device-code-start-route

  - id: refresh-token-field
    desc: OAuth refresh token field reference
    conf: 0.9
    any:
      - id: refresh-token-camel-field
      - id: micro-behaviors/communications/http/oauth::refresh-token-snake-assign
      - id: micro-behaviors/communications/http/oauth::refresh-token

  - id: oauth-device-login-endpoint
    desc: OAuth device-login endpoint
    any:
      - id: microsoft-device-login-url
      - id: microsoft-deviceauth-path
      - id: microsoft-devicecode-path

  - id: device-code-entry-instruction
    desc: Instructs user to enter device code
    any:
      - id: device-code-entry-verb
      - id: device-code-entry-reversed

  - id: oauth-device-login-flow
    desc: OAuth device-code sign-in flow
    conf: 0.94
    all:
      - id: oauth-device-login-endpoint
      - id: device-code-entry-instruction
    near_lines: 20

  - id: device-code-user-handoff
    desc: Presents a device code with a provider verification URI
    conf: 0.95
    all:
      - id: device-code-response-fields
    any:
      - id: micro-behaviors/communications/http/oauth::oauth-device-authorization-path
      - id: micro-behaviors/communications/http/oauth::oauth-device-code-path
      - id: micro-behaviors/communications/http/oauth::oauth-device-grant-type
      - id: device-code-start-route
      - id: device-code-verification-uri-field
      - id: device-code-entry-instruction
      - id: oauth-device-login-endpoint
    near_lines: 80

  - id: device-code-poll-status
    desc: Device authorization pending or completion status
    all:
      - id: device-code-flow-marker
    any:
      - id: pending-status-field
      - id: device-code-terminal-status
      - id: device-code-status-route

  - id: device-code-poll-identifier
    desc: Device authorization polling identifier
    all:
      - id: device-code-flow-marker
    any:
      - id: micro-behaviors/communications/http/auth::session-identifier-field
      - id: micro-behaviors/communications/http/auth::poll-token-field
      # OAuth device_code is the standard poll key; kits also embed a session
      # handle in /device/status/<id> rather than a JSON field.
      - id: device-code-response-fields
      - id: micro-behaviors/communications/http/auth::device-status-session-path

  - id: device-code-terminal-status
    desc: OAuth device authorization completion status
    all:
      - id: device-code-flow-marker
    any:
      - id: completed-status-field
      - id: approved-status-field
      - id: authorized-status-field
      - id: success-status-field

  - id: device-code-polling-loop
    desc: Polls device authorization state
    all:
      - id: device-code-poll-identifier
      - id: device-code-poll-status
    any:
      - id: device-code-loop-timer
      - id: device-code-loop-sleep
      - id: device-code-loop-condition
    near_lines: 80

  - id: oauth-token-body-post
    desc: Posts body containing OAuth token fields
    all:
      - id: micro-behaviors/communications/http/request/body::oauth-token-field-in-body
    any:
      - id: micro-behaviors/communications/http/request/body::python-requests-post-body-variable
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    near_lines: 12

  - id: device-code-token-request
    desc: Completes device authorization and sends its OAuth token
    crit: notable
    conf: 0.95
    all:
      - id: device-code-user-handoff
      - id: device-code-polling-loop
    any:
      - id: oauth-token-body-post
      - id: micro-behaviors/communications/http/request/credentials::js-bearer-header-from-auth-token
      - id: micro-behaviors/communications/http/request/credentials::js-bearer-header-concatenated-token
      - id: micro-behaviors/communications/http/request/credentials::js-bearer-header-from-secret-variable
    near_lines: 80
