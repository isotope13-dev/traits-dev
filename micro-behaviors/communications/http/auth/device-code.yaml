defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.93

traits:
  - id: microsoft-device-login-url
    desc: Microsoft device-login URL
    if:
      type: text
      regex: '(?i)microsoft\.com/devicelogin'

  - id: microsoft-deviceauth-path
    desc: Microsoft OAuth deviceauth path
    if:
      type: text
      regex: '(?i)login\.microsoftonline\.com.{0,80}deviceauth'

  - id: microsoft-devicecode-path
    desc: Microsoft OAuth devicecode path
    if:
      type: text
      regex: '(?i)login\.microsoftonline\.com.{0,80}devicecode'

  - id: device-code-start-route
    desc: Device authorization start route
    if:
      type: text
      regex: '(?i)/(api/)?device/(start|authorize|code)\b'

  - id: device-code-status-route
    desc: Device authorization status route
    if:
      type: text
      regex: '(?i)/(api/)?device/(status|state|poll)([/?!#"'']|\b)'

  - id: device-code-entry-verb
    desc: Tells user to enter device code
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(enter|type|paste|use)\b.{0,80}\bdevice\s+code\b'

  - id: device-code-entry-reversed
    desc: Device code followed by entry instruction
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bdevice\s+code\b.{0,80}\b(enter|type|paste)\b'

  # These fields and response markers are provider-neutral parts of the OAuth
  # 2.0 device authorization grant.  They deliberately avoid kit names,
  # domains, and provider-specific endpoint strings.
  - id: device-code-response-field
    desc: OAuth device authorization code response field
    if:
      type: text
      regex: '(?i)\b(device[_-]?code|user[_-]?code)\b'

  - id: device-code-verification-uri-field
    desc: OAuth device verification URI field
    if:
      type: text
      regex: '(?i)\bverification[_-]?(uri|url|uri_complete)\b'

  - id: device-code-pending-status
    desc: OAuth device authorization pending status
    if:
      type: text
      regex: '(?i)\b(status|state|error)\b.{0,40}(pending|slow[_-]?down)\b'

  - id: device-code-completed-status
    desc: OAuth device authorization completed status
    if:
      type: text
      regex: '(?i)\b(status|state|result)\b.{0,40}\bcompleted\b'

  - id: device-code-approved-status
    desc: OAuth device authorization approved status
    if:
      type: text
      regex: '(?i)\b(status|state|result)\b.{0,40}\bapproved\b'

  - id: device-code-authorized-status
    desc: OAuth device authorization authorized status
    if:
      type: text
      regex: '(?i)\b(status|state|result)\b.{0,40}\bauthorized\b'

  - id: device-code-success-status
    desc: OAuth device authorization success status
    if:
      type: text
      regex: '(?i)\b(status|state|result)\b.{0,40}\bsuccess\b'

  - id: device-code-session-identifier
    desc: Device authorization session identifier field
    if:
      type: text
      regex: '(?i)\b(session[_-]?(id|identifier)|poll[_-]?token)\b'

  - id: device-code-loop-timer
    desc: Repeating timer marker
    crit: component
    if:
      type: text
      regex: '(?i)\b(setInterval|setTimeout)\b'

  - id: device-code-loop-sleep
    desc: Repeating sleep marker
    crit: component
    if:
      type: text
      regex: '(?i)\b(time\.sleep|Thread\.sleep)\b'

  - id: device-code-loop-condition
    desc: Device authorization condition loop
    crit: component
    if:
      type: text
      regex: '(?i)\b(while|for)\b.{0,80}(:|\()'

  - id: device-code-token-snake-field
    desc: OAuth token response field
    if:
      type: text
      regex: '(?i)\b(access[_-]?token|refresh[_-]?token|id[_-]?token)\b'

  - id: device-code-access-token-camel
    desc: OAuth access token response field
    if:
      type: text
      word: accessToken

  - id: device-code-refresh-token-camel
    desc: OAuth refresh token response field
    if:
      type: text
      word: refreshToken

  - id: device-code-id-token-camel
    desc: OAuth identity token response field
    if:
      type: text
      word: idToken

composite_rules:
  - id: oauth-device-login-endpoint
    desc: OAuth device-login endpoint
    any:
      - id: microsoft-device-login-url
      - id: microsoft-deviceauth-path
      - id: microsoft-devicecode-path

  - id: device-code-entry-instruction
    desc: Instructs user to enter device code
    any:
      - id: device-code-entry-verb
      - id: device-code-entry-reversed

  - id: oauth-device-login-flow
    desc: OAuth device-code sign-in flow
    conf: 0.94
    all:
      - id: oauth-device-login-endpoint
      - id: device-code-entry-instruction
    near_lines: 20

  - id: device-code-user-handoff
    desc: Presents a device code with a provider verification URI
    conf: 0.95
    all:
      - id: device-code-response-field
    any:
      - id: micro-behaviors/communications/http/oauth::oauth-device-authorization-path
      - id: micro-behaviors/communications/http/oauth::oauth-device-code-path
      - id: micro-behaviors/communications/http/oauth::oauth-device-grant-type
      - id: device-code-start-route
      - id: device-code-verification-uri-field
      - id: device-code-entry-instruction
      - id: oauth-device-login-endpoint
    near_lines: 80

  - id: device-code-poll-status
    desc: Device authorization pending or completion status
    any:
      - id: device-code-pending-status
      - id: device-code-terminal-status
      - id: device-code-status-route

  - id: device-code-terminal-status
    desc: OAuth device authorization completion status
    any:
      - id: device-code-completed-status
      - id: device-code-approved-status
      - id: device-code-authorized-status
      - id: device-code-success-status

  - id: device-code-polling-loop
    desc: Polls device authorization state
    all:
      - id: device-code-session-identifier
      - id: device-code-poll-status
    any:
      - id: device-code-loop-timer
      - id: device-code-loop-sleep
      - id: device-code-loop-condition
    near_lines: 80

  - id: device-code-token-forward
    desc: Forwards an OAuth token
    all:
      - id: device-code-outbound-request
    any:
      - id: device-code-token-snake-field
      - id: device-code-token-camel-field
    near_lines: 80

  - id: device-code-token-camel-field
    desc: OAuth camel-case token field
    any:
      - id: device-code-access-token-camel
      - id: device-code-refresh-token-camel
      - id: device-code-id-token-camel

  - id: device-code-outbound-request
    desc: Outbound device-flow request
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/curl::exec
      - id: micro-behaviors/communications/http/curl::init
