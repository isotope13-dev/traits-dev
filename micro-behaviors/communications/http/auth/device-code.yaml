defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: microsoft-device-login-url
    desc: Microsoft device-login URL
    if:
      type: text
      regex: '(?i)microsoft\.com/devicelogin'

  - id: microsoft-deviceauth-path
    desc: Microsoft OAuth deviceauth path
    if:
      type: text
      regex: '(?i)login\.microsoftonline\.com.{0,80}deviceauth'

  - id: microsoft-devicecode-path
    desc: Microsoft OAuth devicecode path
    if:
      type: text
      regex: '(?i)login\.microsoftonline\.com.{0,80}devicecode'

  - id: device-code-entry-verb
    desc: Tells user to enter device code
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(enter|type|paste|use)\b.{0,80}\bdevice\s+code\b'

  - id: device-code-entry-reversed
    desc: Device code followed by entry instruction
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bdevice\s+code\b.{0,80}\b(enter|type|paste)\b'

composite_rules:
  - id: oauth-device-login-endpoint
    desc: OAuth device-login endpoint
    any:
      - id: microsoft-device-login-url
      - id: microsoft-deviceauth-path
      - id: microsoft-devicecode-path

  - id: device-code-entry-instruction
    desc: Instructs user to enter device code
    any:
      - id: device-code-entry-verb
      - id: device-code-entry-reversed

  - id: oauth-device-login-flow
    desc: OAuth device-code sign-in flow
    conf: 0.94
    all:
      - id: oauth-device-login-endpoint
      - id: device-code-entry-instruction
    near_lines: 20
