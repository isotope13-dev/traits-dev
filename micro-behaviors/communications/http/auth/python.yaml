defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.92
traits:
- id: python-application-token-request
  desc: Calls an application token acquisition method
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: (^|\.)acquire_token_for_client$
- id: python-auth-endpoint-url
  desc: Python auth endpoint HTTP call
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: ^(requests|httpx|session|r)\.
    arg:
      kind: string
      regex: (?i)^https?://[A-Za-z0-9._-]{1,120}/[^"'\s]{0,80}/(login|auth|signin)\b
composite_rules:
- id: python-authenticated-session-client
  desc: Python authenticated HTTP session client
  all:
  - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
  - id: micro-behaviors/communications/http/lib/requests::requests-session
- id: python-dual-token-authentication-flow
  desc: Application token method and password-grant fields
  conf: 0.97
  all:
  - id: python-application-token-request
  - id: micro-behaviors/communications/http/oauth::password-grant-type
