# Textual authentication-input markers are transport capabilities.  Remote
# tasking intent is inferred only by the objective composite that combines
# them with an endpoint, executable program fields, and a WebSocket message.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text, documents]
  crit: component
  conf: 0.92

traits:
  - id: email-password-input-marker
    desc: Text names email-password credential input
    if:
      type: text
      regex: '(?i)\b(input|context|credentials?)\b.{0,80}\bemail:password\b'

  - id: existing-bearer-token-input
    desc: Text names existing bearer-token input
    if:
      type: text
      regex: '(?i)\b(input|context)\b.{0,60}\b(existing|bearer)\s+token\b'
