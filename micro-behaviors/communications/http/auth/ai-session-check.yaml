defaults:
  platforms: [unix, windows]
  for: [source, scripts, pe, dll]
  crit: notable
traits:
  - id: chatgpt-session-cookie-endpoint-pair
    desc: ChatGPT session cookie beside account endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)__Secure-next-auth\.session-token\.0.{0,240}chatgpt\.com.{0,120}/api/auth/session'

  - id: claude-session-cookie-endpoint-pair
    desc: Claude session cookie beside account endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bsessionKey=.{0,240}claude\.ai.{0,120}/api/auth/current_account'

  - id: cursor-session-cookie-endpoint-pair
    desc: Cursor session cookie beside account endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bWorkosCursorSessionToken=.{0,240}cursor\.com.{0,120}/api/auth/me'
composite_rules:
  - id: multi-ai-session-cookie-requests
    desc: AI session cookies with HTTP requests
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/cookie-name::cookie-request-header-token
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
    any:
      - id: chatgpt-session-cookie-endpoint-pair
      - id: claude-session-cookie-endpoint-pair
      - id: cursor-session-cookie-endpoint-pair
    needs: 2
