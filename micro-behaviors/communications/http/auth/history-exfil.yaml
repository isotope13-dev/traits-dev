# Neutral browser observation primitive. Its source, storage, and transfer
# context are assembled independently by collection/export consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

traits:
  - id: hardcoded-bearer-token
    desc: Hardcoded JWT-like Bearer credential
    crit: notable
    conf: 0.9
    attack: T1071.001
    if:
      type: text
      regex: '(?i)Bearer\s+[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'
