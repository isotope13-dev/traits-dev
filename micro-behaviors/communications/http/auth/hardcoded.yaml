defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.88

traits:
  - id: hardcoded-api-key-config
    desc: Hardcoded API key configuration value
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)["'']api[_-]?key["'']\s*:\s*["''][A-Za-z0-9_-]{32,}["'']'
  - id: encoded-builtin-api-keys
    desc: Base64-encoded built-in API keys
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, shell, powershell, ruby, php, perl]
    if:
      type: text
      regex: '(?is)builtin[_-]?keys?.{0,300}["''][A-Za-z0-9+/]{48,}={0,2}["'']'
  - id: nvidia-cloud-api-key-literal
    desc: NVIDIA cloud API key literal
    crit: suspicious
    conf: 0.96
    for: [python, javascript, typescript, text]
    if:
      type: text
      regex: '["'']nvapi-[A-Za-z0-9_-]{20,}["'']'
    unless:
      # Redaction tests use self-describing sentinels (nvapi-*-test-secret,
      # nvapi-must-not-appear-*) and assert they never reach egress; those
      # names cannot be live credentials.
      - id: well-known/tool/detection/
      - id: metadata/package/testing/harness/unit::vitest-import
      - id: metadata/package/testing/harness/runtime::test-basename-suffix
      - type: text
        regex: '(?i)(test-secret|must-not-appear|not-a-real)'
      - type: text
        regex: '(?i)should-not'
  - id: javascript-hardcoded-api-key-field
    desc: Hard-coded API key field
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bapi[_-]?key\s*:\s*["''][A-Za-z0-9_-]{24,}["'']'
  - id: javascript-hardcoded-api-secret-field
    desc: Hard-coded API secret field
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bsecret\s*:\s*["''][A-Za-z0-9_+/=-]{32,}["'']'
  - id: javascript-hardcoded-api-passphrase-field
    desc: Hard-coded API passphrase field
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bpassphrase\s*:\s*["''][A-Za-z0-9_+/=-]{24,}["'']'
  - id: polymarket-create-or-derive-api-key
    desc: Creates or derives exchange API credentials
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.createOrDeriveApiKey\s*\('

  # A literal assigned to a *GATEWAY_TOKEN name: a bearer token for an API
  # gateway shipped in source. Worth review as exposed secret material; the
  # assignment alone acquires nothing.
  - id: hardcoded-gateway-token-assignment
    desc: Hardcoded gateway bearer token literal
    crit: notable
    conf: 0.86
    for: [python, json]
    if:
      type: text
      regex: '(?i)\b[A-Z0-9_]*GATEWAY_TOKEN\s*[:=]\s*["''][A-Za-z0-9._~+\-/=]{32,}'
    unless:
      - id: well-known/tool/detection/
      - type: text
        regex: '(?i)(example|sample|placeholder)'

composite_rules:
  - id: javascript-hardcoded-api-credential-set
    desc: Hard-coded API key, secret, and passphrase
    crit: suspicious
    conf: 0.98
    attack: T1552.001
    for: [javascript, typescript]
    near_lines: 20
    all:
      - id: javascript-hardcoded-api-key-field
      - id: javascript-hardcoded-api-secret-field
      - id: javascript-hardcoded-api-passphrase-field
  # The same file carries a gateway token and a PEM private key, as a client
  # that signs its own device handshake does. Both secrets ship to every
  # installer; nothing here shows them being taken from someone else.
  - id: embedded-gateway-token-with-signing-key
    desc: Gateway token shipped with a PEM private key
    crit: notable
    conf: 0.98
    for: [python]
    near_lines: 200
    all:
      - id: hardcoded-gateway-token-assignment
      - id: micro-behaviors/crypto/key/representation::embedded-pem-private-key
