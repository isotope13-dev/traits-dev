defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.88

traits:
  - id: hardcoded-api-key-config
    desc: Hardcoded API key configuration value
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)["'']api[_-]?key["'']\s*:\s*["''][A-Za-z0-9_-]{32,}["'']'
  - id: encoded-builtin-api-keys
    desc: Base64-encoded built-in API keys
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, shell, powershell, ruby, php, perl]
    if:
      type: text
      regex: '(?is)builtin[_-]?keys?.{0,300}["''][A-Za-z0-9+/]{48,}={0,2}["'']'
