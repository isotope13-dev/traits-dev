defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.93

traits:
  - id: authentication-token-member
    desc: References an authentication-token member field
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      regex: '(^|\.)authToken$'

  - id: session-identifier-field
    desc: Serialized session identifier field
    crit: notable
    for: [html, scripts, source]
    if:
      type: text
      # Require a quoted mapping key, not source parameters such as
      # `session_id: int` used by unrelated local process APIs.
      regex: '(?i)["'']session[_-]+(id|identifier)["'']\s*:'

  - id: poll-token-field
    desc: HTTP polling token field
    if:
      type: text
      regex: '(?i)\bpoll[_-]?token\b\s*[:=]'

  # Device-code phishing kits poll a status route whose path carries the
  # session handle (/api/device/status/<id>), rather than a JSON field.
  - id: device-status-session-path
    desc: Device status URL embeds session path
    if:
      type: text
      regex: '(?i)/(api/)?device/(status|state|poll)/[`$\{A-Za-z0-9_-]'

  - id: relative-state-route
    desc: Quoted relative state endpoint route
    crit: component
    conf: 0.9
    for: [html, scripts, source]
    if:
      type: text
      regex: '["'']/state/?["'']'

  # Member access rather than a serialized key: the client side of the same
  # handle, read off a parsed response body (`reg.socketId`). Kept as a
  # component for the same reason as session-identifier-field -- one field
  # name says nothing on its own about how the handle is obtained or used.
  - id: socket-session-id-member
    desc: References a socket or session id member
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      regex: '(^|\.)(socketId|sessionId|session_id)$'

composite_rules:
  # EvilTokens-style front ends poll a root /state route and send the opaque
  # session handle in the request body. Pairing both wire fields keeps this
  # structural and useful across browser, server, and native implementations;
  # a bare /state path would be far too common to report on its own.
  - id: state-route-session-field
    desc: State route carries session identifier
    crit: notable
    conf: 0.96
    for: [html, scripts, source]
    all:
      - id: relative-state-route
      - id: session-identifier-field
    near_bytes: 1024
