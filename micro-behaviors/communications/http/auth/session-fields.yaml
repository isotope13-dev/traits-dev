defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: notable
  conf: 0.93

traits:
  - id: session-identifier-field
    desc: HTTP session identifier field
    if:
      type: text
      # Require a separator so camelCase UI ids (sessionId) do not match.
      regex: '(?i)\bsession[_-]+(id|identifier)\b\s*[:=]'

  - id: poll-token-field
    desc: HTTP polling token field
    if:
      type: text
      regex: '(?i)\bpoll[_-]?token\b\s*[:=]'
