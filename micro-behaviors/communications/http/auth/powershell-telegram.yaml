defaults:
  platforms:
  - windows
traits:
- id: powershell-telegram-bot-token-literal
  desc: Hardcoded Telegram-format bot token literal
  crit: notable
  conf: 0.95
  for:
  - powershell
  if:
    type: text
    regex: '["'']\d{8,12}:[A-Za-z0-9_-]{30,60}["'']'
  not:
  - substr: 123456789:AAHdqTcvCH1vGWJxfSeofSAs0K5PALDsaw
