defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: auth-token-buffer-batch
    desc: Auth result encoded into token batch field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "\\['auth'\\]\\(\\);[\\w$]+\\['token'\\]\\s*=\\s*Buffer"

  - id: token-conditional-commit-message
    desc: Commit message selected by batch token field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "['\"]message['\"]\\s*:\\s*![\\w$]+\\[['\"]token['\"]\\]\\s*\\?"
