# Authentication clients sometimes forward signed response material into a
# subsequent request.  Keep the individual field operations neutral here; the
# credential-access objective combines the unusual origin-to-redirect remap,
# token/state forwarding, and signature reuse to identify canonicalization
# confusion attacks across implementation languages.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  mbc: C0002

traits:
  - id: empty-redirect-field-assignment
    desc: Assigns an empty redirect or callback field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](redirect|return[_-]?url|callback)["'']\s*(:|=>|=)\s*["'']{2}'

  - id: signature-field-to-field-assignment
    desc: Copies signature between structured fields
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''][\w-]*(hmac|signature)["'']\s*[:=]>?\s*\$?\w+[.\[]["'']?(hmac|signature)'

  - id: token-field-to-field-assignment
    desc: Copies token between structured fields
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''][\w-]*token["'']\s*[:=]>?\s*\$?\w+[.\[]["'']?[\w-]*token'

  - id: state-field-to-field-assignment
    desc: Copies state between structured fields
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''][\w-]*state["'']\s*[:=]>?\s*\$?\w+[.\[]["'']?[\w-]*state'

  - id: origin-to-redirect-field-assignment
    desc: Assigns origin field into redirect field
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)["''](redirect|return[-_]?url)["'']\s*[:=]>?\s*\$?\w+[.\[]["'']?(domain|origin|host)'
