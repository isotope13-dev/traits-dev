# Authentication clients sometimes forward signed response material into a
# subsequent request.  Keep the individual field operations neutral here; the
# credential-access objective combines the unusual origin-to-redirect remap,
# token/state forwarding, and signature reuse to identify canonicalization
# confusion attacks across implementation languages.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  mbc: C0002

traits:
  - id: empty-authentication-redirect-field
    desc: Assigns an empty authentication redirect field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](redirect|return[_-]?url|callback)["'']\s*(:|=>|=)\s*["'']{2}'

  - id: response-signature-forwarding
    desc: Forwards response signature into request field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)["''](incoming_)?(hmac|signature)["'']\s*(:|=>)\s*\w+\[["''](hmac|signature)["'']\]'

  - id: response-token-forwarding
    desc: Forwards response token into request field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](auth[_-]?)?token["'']\s*(:|=>)\s*\w+\[["''](auth[_-]?)?token["'']\]'

  - id: response-state-forwarding
    desc: Forwards response state into a request field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](pre_sso_)?state["'']\s*(:|=>)\s*\w+\[["''](pre_sso_)?state["'']\]'

  - id: response-origin-as-redirect
    desc: Maps response origin into redirect field
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)["''](redirect|return[_-]?url)["'']\s*(:|=>)\s*\w+\[["''](domain|origin|host)["'']\]'
