# A dynamically built credential is still HTTP Basic authentication. Require
# the header name and its value together, rather than a standalone Basic word
# or a Base64 operation elsewhere in the file.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: basic-authorization-concatenated-value
    desc: Concatenates a Basic Authorization value
    if:
      type: text
      regex: '(?i)\bAuthorization["'']?\s*[:,]\s*["'']Basic\s+["'']\s*\+'
