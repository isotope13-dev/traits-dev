# A client credential flag is neutral; upload and CSRF require other evidence.
defaults:
  platforms: [windows, unix]
  for: [html, php, javascript]
  crit: notable
  conf: 0.95
traits:
  - id: xhr-with-credentials-enabled
    desc: Enables the HTTP client withCredentials flag
    if:
      type: text
      regex: 'withCredentials\s*=\s*true'
