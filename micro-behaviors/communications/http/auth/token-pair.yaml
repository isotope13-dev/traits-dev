defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.92

traits:
  # Bare "token" is too common; require an access/auth-shaped field name or an
  # explicit token JSON/property assignment paired later with refresh_token.
  - id: access-token-field-source
    desc: Access token field in source
    if:
      type: text
      regex: '(?i)\b(access[_-]?token)\b'
  - id: auth-token-property-source
    desc: Auth token property assignment
    if:
      type: text
      regex: '(?i)(\b(const|let|var)\s+token\b|\btoken\s*[:=]|\[[''"]token[''"]\]|\.token\b)'
  - id: refresh-token-field-source
    desc: Refresh token field in source
    if:
      type: text
      regex: '(?i)\brefresh[_-]?token\b'

composite_rules:
  - id: access-refresh-token-pair
    desc: Access and refresh token pair
    crit: notable
    conf: 0.94
    any:
      - id: access-token-field-source
      - id: auth-token-property-source
    all:
      - id: refresh-token-field-source
