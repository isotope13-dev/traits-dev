defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.92

traits:
  # Bare "token" is too common; require an access field or a token property
  # paired with refresh_token.
  - id: access-token-field-source
    desc: Access token field in source
    if:
      type: text
      regex: '(?i)\b(access[_-]?token)\b'
  - id: token-variable-declaration
    desc: Token variable declaration
    if:
      type: text
      regex: '(?i)\b(const|let|var)\s+token\b'
  - id: token-field-assignment
    desc: Token field assignment
    if:
      type: text
      regex: '(?i)\btoken\s*[:=]'
  - id: indexed-token-property
    desc: Indexed token property
    if:
      type: text
      regex: '(?i)\[[''"]token[''"]\]'
  - id: token-member-property
    desc: Token member property
    if:
      type: text
      regex: '(?i)\.token\b'
  - id: refresh-token-field-source
    desc: Refresh token field in source
    if:
      type: text
      regex: '(?i)\brefresh[_-]?token\b'

composite_rules:
  - id: access-refresh-token-pair
    desc: Access and refresh token pair
    crit: notable
    conf: 0.94
    any:
      - id: access-token-field-source
      - id: token-variable-declaration
      - id: token-field-assignment
      - id: indexed-token-property
      - id: token-member-property
    all:
      - id: refresh-token-field-source
