# SharePoint WS-Federation authentication fields and trust endpoint. These are
# protocol mechanics; exploit intent is assembled by objective composites.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: sharepoint-sts-metadata-endpoint
    desc: SharePoint STS metadata endpoint
    if:
      type: string_literal
      regex: '(?i)/_layouts/15/metadata/json/1\b'

  - id: sharepoint-principal-app-id
    desc: SharePoint service principal app identifier
    # The well-known SharePoint principal GUID (00000003-0000-0ff1-ce00-...).
    # Legitimate in ACS/app-only OAuth flows, so notable on its own; forged
    # actor tokens carry it as the issuer/audience/nameid of the inner token.
    if:
      type: string_literal
      regex: '(?i)\b00000003-0000-0ff1-ce00-000000000000\b'

  - id: sharepoint-wsfed-trust-endpoint
    desc: SharePoint WS-Federation trust endpoint
    if:
      type: text
      regex: '(?i)/_trust/default\.aspx\b'

  - id: sharepoint-security-context-token
    desc: SharePoint SecurityContextToken field
    if:
      type: text
      regex: '(?i)\bSecurityContextToken\b'

  - id: sharepoint-auth-session-cookie
    desc: SharePoint or ASP.NET auth session cookie
    if:
      type: text
      regex: '(?i)\b(FedAuth|ASP\.NET_SessionId)\b'

  - id: sharepoint-auth-cookie-header
    desc: Sends SharePoint auth cookie in HTTP headers
    crit: notable
    conf: 0.97
    if:
      type: text
      # Match a concrete header/map entry, not a comment that merely names
      # FedAuth. Python, PowerShell, JavaScript and other web clients use
      # the same Cookie: FedAuth= structure.
      regex: '(?is)["'']?Cookie["'']?\s*[:=]\s*[^}\n]{0,180}\bFedAuth\s*='

  - id: sharepoint-machine-key-material
    desc: .NET machine-key material
    if:
      type: text
      regex: '(?i)\b(machineKey|MachineKeySection)\b|<machineKey\b'

  # A machine-key name near words such as "forge" or "mint" is not proof of
  # signing: comments, helper names, and configuration examples use that
  # vocabulary too. Require the concrete ASP.NET protection API instead.
  - id: sharepoint-machine-key-protection-api
    desc: ASP.NET machine-key protection API call
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(MachineKey|MachineKeySection)\s*(\]::|::|\.)\s*(Protect|Unprotect|Sign|Verify)\s*\('
