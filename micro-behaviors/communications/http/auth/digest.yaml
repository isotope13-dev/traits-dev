# HTTP Digest authentication challenge-response (RFC 7616). A client may probe
# without credentials, read WWW-Authenticate, then retry with Authorization.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: www-authenticate-header-read
    desc: Reads WWW-Authenticate response header
    if:
      type: text
      regex: '\.get\([''"]www-authenticate[''"]\)|headers\.get\([''"]www-authenticate[''"]\)'

  - id: digest-challenge-prefix
    desc: Digest WWW-Authenticate challenge prefix
    if:
      type: text
      regex: 'startsWith\([''"]Digest\s|return `Digest '

composite_rules:
  - id: http-digest-auth-challenge-retry
    desc: HTTP Digest auth challenge-response retry
    crit: exception
    conf: 0.97
    all:
      - id: www-authenticate-header-read
      - id: digest-challenge-prefix
      - id: micro-behaviors/communications/http/headers::authorization-header-index-assignment
