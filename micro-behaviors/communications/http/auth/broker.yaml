# Microsoft Nested App Authentication / BroCI request mechanics. These fields
# identify a broker and nested client on the wire; objective rules add the
# credential source and targeted resource before inferring abuse.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: microsoft-broker-client-id-field
    desc: Microsoft BroCI broker client ID field
    if:
      type: literal
      kind: string
      exact: brk_client_id

  - id: microsoft-broker-redirect-field
    desc: Microsoft BroCI broker redirect URI field
    if:
      type: literal
      kind: string
      exact: brk_redirect_uri

  - id: microsoft-broker-redirect-scheme
    desc: Microsoft BroCI broker redirect URI scheme
    if:
      type: literal
      kind: string
      regex: '(?i)^brk-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}://'

composite_rules:
  - id: microsoft-brokered-client-request
    desc: Microsoft BroCI nested-application request
    crit: notable
    conf: 0.98
    any:
      - id: microsoft-broker-client-id-field
      - id: microsoft-broker-redirect-field
      - id: microsoft-broker-redirect-scheme
