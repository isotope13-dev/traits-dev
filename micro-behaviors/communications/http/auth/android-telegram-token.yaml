defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-telegram-bot-token-shape
    desc: DEX contains Telegram-shaped bot token
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '^\d{8,12}:[A-Za-z0-9_-]{30,60}$'
    not:
      - substr: 0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefgh
