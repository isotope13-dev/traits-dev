# Integrated HTTP proxy authentication is a neutral transport capability.
# Objective composites add the WebSocket relay context before treating it as
# hostile.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, pe, dll]
  attack: T1071.001
  mbc: C0002

traits:
  - id: winhttp-query-auth-schemes
    desc: Queries proxy authentication schemes
    crit: notable
    conf: 0.94
    for: [c, pe, dll]
    if:
      type: symbol
      kind: call
      exact: WinHttpQueryAuthSchemes

  - id: winhttp-set-credentials
    desc: Sets WinHTTP proxy credentials
    crit: notable
    conf: 0.94
    for: [c, pe, dll]
    if:
      type: symbol
      kind: call
      exact: WinHttpSetCredentials

  - id: winhttp-proxy-auth-407-branch
    desc: Handles an HTTP 407 proxy response
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bif\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*==\s*407\s*\)'

  - id: winhttp-negotiate-ntlm-fallback
    desc: Negotiate-to-NTLM proxy fallback
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)WINHTTP_AUTH_SCHEME_NEGOTIATE.{0,240}WINHTTP_AUTH_SCHEME_NTLM'

composite_rules:
  - id: winhttp-proxy-authentication
    desc: WinHTTP integrated proxy-authentication flow
    crit: notable
    conf: 0.96
    all:
      - id: winhttp-query-auth-schemes
      - id: winhttp-set-credentials
    any:
      - id: winhttp-proxy-auth-407-branch
      - id: winhttp-negotiate-ntlm-fallback
