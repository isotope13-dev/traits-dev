# --user also authenticates non-HTTP protocols. Bind it to curl's HTTP
# form-encoding option in the same call; unrelated commands cannot supply it.
# This does not infer Basic versus Digest/NTLM or hardcoded credentials.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: curl-form-user-auth-option
    desc: curl form request sets user authentication
    if:
      type: symbol
      kind: call
      regex: '(^|/)curl$'
      args:
        - kind: identifier
          name_regex: '^(-u|--user)$'
        - kind: identifier
          name: --data-urlencode
