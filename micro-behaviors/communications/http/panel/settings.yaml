# Operator-panel HTTP settings routes used by C2 UIs to persist
# Telegram inbox, implant-builder quotas, and client-roster wipes.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: api-settings-telegram-path
    desc: Telegram settings API route
    if:
      type: text
      substr: /api/settings/telegram

  - id: api-settings-build-rate-limit-path
    desc: Build rate-limit settings API route
    if:
      type: text
      substr: /api/settings/build-rate-limit

  - id: api-clients-offline-path
    desc: Offline clients API route
    if:
      type: text
      substr: /api/clients/offline

  - id: api-clients-banned-ips-path
    desc: Banned client IPs API route
    if:
      type: text
      substr: /api/clients/banned-ips
