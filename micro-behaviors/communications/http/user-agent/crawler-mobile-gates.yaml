# Browser-side User-Agent gates seen in hacked-page redirectors. Each is a
# neutral UA check on its own: sites legitimately special-case crawlers and
# use the public detectmobilebrowsers.com regex for mobile layouts.
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
  crit: notable
  conf: 0.9
traits:
  # `ua.indexOf("ooglebot")==-1`: the code runs only when the visitor is
  # not Googlebot. The leading "G" is dropped so either capitalisation
  # matches and the literal "Googlebot" never appears in the source.
  - id: googlebot-absent-ua-check
    desc: Branches when User-Agent lacks Googlebot
    if:
      type: text
      regex: 'indexOf\(\s*["'']ooglebot["'']\s*\)\s*===?\s*-1'
  # The detectmobilebrowsers.com UA regex (android|bb\d+|meego).+mobile|...
  - id: detectmobilebrowsers-ua-regex
    desc: detectmobilebrowsers mobile User-Agent regex
    if:
      type: text
      substr: '(android|bb\d+|meego).+mobile|avantgo|bada'
  - id: googlebot-string-table-token
    crit: component
    desc: Googlebot token in JavaScript string table
    if:
      type: text
      substr: '"googlebot"'
