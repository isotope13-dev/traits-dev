# Boto3 records the credential-provider mode and client OS in its CloudTrail
# User-Agent/additionalEventData. These are neutral log facts; the
# instance-role reuse objective combines them with an assumed-role session.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.96

traits:
  - id: boto3-cloudtrail-user-agent
    desc: Boto3 CloudTrail user agent
    if:
      type: text
      regex: '(?i)"userAgent"\s*:\s*"[^\"]{0,200}\bBoto3/[0-9][^\"]{0,200}"'

  - id: boto3-cloudtrail-windows-os-marker
    desc: Boto3 Windows OS user-agent marker
    if:
      type: text
      regex: '(?i)"userAgent"\s*:\s*"[^\"]{0,200}\bos/windows\b[^\"]{0,200}"'

  - id: boto3-explicit-credentials-code
    desc: Boto3 explicit credential mode marker
    if:
      type: text
      regex: '(?i)"CREDENTIALS_CODE"\s*:\s*"m/e"'

  - id: cloudtrail-assumed-role-session
    desc: CloudTrail assumed-role session issuer
    if:
      type: text
      regex: '(?is)"sessionIssuer"\s*:\s*\{[^\}]{0,240}"type"\s*:\s*"Role"'

  # GitHub Secret Protection identifies its AWS access-key validity probes in
  # the CloudTrail user agent. Keep the version flexible so future revisions
  # of the scanner retain coverage without matching a bare marker in prose.
  - id: github-aws-key-validation-user-agent
    desc: GitHub AWS access-key validation user agent
    if:
      type: text
      regex: '(?i)"userAgent"\s*:\s*"[^\"]{0,400}\bGHAS-AWS_KEYID-validation-[0-9][^\"]{0,400}"'
