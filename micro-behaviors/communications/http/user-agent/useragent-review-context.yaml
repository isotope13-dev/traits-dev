defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.7

composite_rules:
  - id: navigator-useragent-conditional
    desc: Browser User-Agent checks or nearby conditional syntax
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    any:
      - id: micro-behaviors/communications/http/fingerprint::navigator-useragent-substring-branch
      - id: micro-behaviors/communications/http/fingerprint::navigator-useragent-match-branch
      - id: micro-behaviors/communications/http/fingerprint::navigator-useragent-regex-test-branch
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-variable-conditional
  - id: navigator-useragent-variable-conditional
    desc: Saved User-Agent near conditional call syntax
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    all:
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-assigned
      - id: micro-behaviors/data/control-flow/branch::js-conditional-matcher-call
    near_bytes: 512
