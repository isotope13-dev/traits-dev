defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]
  attack: T1041

traits:
  - id: rust-routeros-healthmonitor-agent
    desc: Rust RouterOS health agent
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: RouterOS-HealthMonitor
  - id: rust-routeros-http-agent
    desc: Rust RouterOS HTTP agent
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: RouterOS-HTTP-Agent
  - id: rust-mikrotik-routeros-agent
    desc: Rust MikroTik RouterOS UA
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: MikroTik/RouterOS
composite_rules:
  - id: rust-routeros-agent-header
    desc: Rust RouterOS agent header
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/user-agent::rust-routeros-healthmonitor-agent
      - id: micro-behaviors/communications/http/user-agent::rust-routeros-http-agent
      - id: micro-behaviors/communications/http/user-agent::rust-mikrotik-routeros-agent
