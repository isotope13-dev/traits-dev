defaults:
  platforms: [unix, windows]
  for: [python]
  # Browser/TLS impersonation is a normal HTTP-client capability.  Anti-bot
  # intent belongs in composites that also show challenge bypass or stealth.
  crit: notable
  conf: 0.96

traits:
  - id: curl-cffi-chrome-impersonation
    desc: Sets a Chrome browser impersonation profile
    if:
      type: text
      regex: 'impersonate\s*=\s*["'']chrome(\d{2,3})?["'']'
  - id: curl-cffi-chrome-profile-reference
    desc: References a Chrome impersonation profile
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '["'']chrome\d{2,3}["'']'
  - id: curl-cffi-safari-profile-reference
    desc: References a Safari impersonation profile
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '["'']safari\d{2,3}["'']'
  - id: curl-cffi-firefox-profile-reference
    desc: References a Firefox impersonation profile
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '["'']firefox\d{2,3}["'']'
  - id: curl-cffi-edge-profile-reference
    desc: References an Edge impersonation profile
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '["'']edge\d{2,3}["'']'

  # Selecting a browser target changes the TLS ClientHello and HTTP/2
  # fingerprint presented by the HTTP client.  The choice alone is a
  # neutral capability; anti-bot intent belongs in composites.
  - id: python-tls-fingerprint-impersonation-target
    desc: Selects a browser TLS fingerprint to mimic
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)impersonate\s*=\s*["''](chrome|safari|edge|firefox)'

composite_rules:
  - id: curl-cffi-browser-profile-rotation
    desc: References multiple browser profile families
    crit: notable
    conf: 0.97
    needs: 2
    any:
      - id: curl-cffi-chrome-profile-reference
      - id: curl-cffi-safari-profile-reference
      - id: curl-cffi-firefox-profile-reference
      - id: curl-cffi-edge-profile-reference
