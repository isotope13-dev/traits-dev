defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.7
traits:
  - id: navigator-useragent-read
    desc: Reads browser User-Agent string
    crit: notable
    conf: 0.75
    for: [javascript, typescript, html]
    attack: T1082
    if:
      # Structured member facts exclude documentation and comments.
      type: symbol
      kind: member
      exact: navigator.userAgent
    unless:
      - id: well-known/lib/network/axios::axios-class
      - id: well-known/lib/network/axios::axios-version
  # includes() and indexOf() are equivalent spellings of substring lookup here.
  - id: navigator-useragent-assigned
    desc: Saves the browser User-Agent value
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?i)\b(const|let|var)\s+[A-Za-z_$][A-Za-z0-9_$]*\s*=\s*navigator\.userAgent\b'
  - id: android-user-agent-branch
    desc: Tests Android User-Agent token
    crit: notable
    conf: 0.9
    for: [javascript]
    platforms: [android, unix, windows]
    if:
      type: tree-sitter
      kind: conditional
      regex: '(?s)Android.{0,120}(test|match|includes|indexOf)\s*\('
  - id: android-user-agent-branch-text
    desc: Tests Android User-Agent outside JavaScript
    crit: notable
    conf: 0.9
    for: [python, php, html]
    platforms: [android, unix, windows]
    if:
      type: text
      regex: '(?is)(user.?agent|\bua\b).{0,80}Android.{0,60}(includes\(|test\(|\bin\b)'
  - id: mobile-user-agent-read
    desc: Reads a mobile User-Agent value
    crit: notable
    conf: 0.94
    for: [javascript, typescript, python, php, html]
    if:
      type: text
      regex: '(?s)(navigator\.userAgent|HTTP_USER_AGENT).{0,120}(Android|iPhone|iPad)'
  # Matches both reads and assignments; neither a mobile client nor a read
  # is required. Preserve the reference population used by routing consumers.
  - id: user-agent-header-map-reference
    desc: References User-Agent in a header map
    crit: notable
    conf: 0.94
    for: [javascript, typescript, python, php]
    if:
      type: text
      regex: '(?s)headers\[[^]]{0,80}[Uu]ser-[Aa]gent'
  - id: ipad-user-agent-branch
    desc: Tests iPad User-Agent token
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, php, html]
    platforms: [android, unix, windows]
    if:
      type: text
      regex: '(?i)user.?agent.{0,90}iPad|iPad.{0,90}user.?agent'
  - id: read-server-ua-php
    desc: Reads inbound PHP User-Agent request header
    crit: notable
    conf: 0.95
    for: [php]
    if:
      type: symbol
      kind: member
      regex: '(?i)^\$_SERVER\.HTTP_USER_AGENT$'
  - id: ua-windows-os-check-php
    desc: Inbound User-Agent Windows OS token check
    crit: notable
    conf: 0.7
    for: [php]
    if:
      type: text
      regex: '(?i)\$_SERVER.{0,40}HTTP_USER_AGENT.{0,40}(Windows|Win32|Win64)'
  - id: bot-user-agent-list--rx-1
    desc: Contains a crawler User-Agent string
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(googlebot|bingbot)'
  - id: bot-user-agent-list--rx-2
    desc: Search-engine crawler User-Agent marker
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(baiduspider|yandexbot)'
  - id: bot-user-agent-list--rx-3
    desc: Social crawler User-Agent marker
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(facebot|facebookexternalhit)'
  - id: bot-user-agent-list--rx-4
    desc: Social or archive crawler User-Agent marker
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_-])(twitterbot|ia_archiver)($|[^A-Za-z0-9_-])'
  - id: bot-user-agent-list--rx-5
    desc: Google verification crawler User-Agent marker
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(Google-Site-Verification|Google-InspectionTool)/[0-9]'
  - id: bot-user-agent-list--rx-6
    desc: Google service crawler User-Agent marker
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(APIs-Google\s*\(\+https?://|AdsBot-Google(-[A-Za-z]+)?(/[0-9]|\s*\())'
  # AI-service crawlers. These are the forged User-Agent tokens the GreyNoise
  # "posing as AI crawlers" campaign abused: the real crawler and the impostor
  # both send the identical string, so a match here is a notable impersonation
  # capability, not proof of malice — the hostile escalation comes from
  # composites that pair the token with a credential-path request.
  - id: ai-crawler-user-agent--anthropic
    desc: Anthropic crawler User-Agent token (ClaudeBot)
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(claudebot|claude-web|claudeweb)(/|\b|;)'
  - id: ai-crawler-user-agent--openai
    desc: OpenAI crawler User-Agent token
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(gptbot|oai-searchbot|chatgpt-user)(/|\b|;)'
  - id: ai-crawler-user-agent--other
    desc: Other AI-service crawler User-Agent token
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(google-extended|perplexitybot|perplexity-user|amazonbot)(/|\b|;)'
  # Mobile-malware distribution gates. A literal `/Android/` regex test is the
  # idiom these landing pages use to serve the APK only to phones; the
  # in-app-browser tokens distinguish which social app opened the page so the
  # victim gets per-app install instructions.
  - id: android-useragent-regex-gate
    desc: Tests User-Agent with a literal /Android/ regex
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [android, unix, windows]
    if:
      type: text
      regex: '/Android[^/\n]{0,40}/[gimuy]*\s*\.\s*test\s*\('
  - id: inapp-browser-ua-fingerprint
    desc: Tests in-app browser User-Agent tokens
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [android, unix, windows]
    if:
      type: text
      regex: '/(FBAN|FBAV|musical_?ly|Tik ?Tok|Instagram)[^/\n]{0,60}/[gimuy]*\s*\.\s*test\s*\('
  # The same test written as a substring search on the User-Agent
  # (`navigator.userAgent.includes('FBAN')`). Script files carry call facts,
  # so the call and its literal argument are matched directly; inline page
  # script has none, so HTML falls back to the call's text. The receiver must
  # be User-Agent-shaped: an "FBA" search elsewhere is Amazon fulfilment.
  - id: inapp-browser-ua-substring-check
    desc: Checks User-Agent for Facebook app tokens
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    platforms: [android, unix, windows]
    if:
      type: symbol
      kind: call
      regex: '(?i)(useragent|^ua)\.(includes|indexOf)$'
      arg:
        kind: string
        substr: FBA
  - id: inapp-browser-ua-substring-check-text
    desc: Inline script checks User-Agent for app tokens
    crit: notable
    conf: 0.9
    for: [html]
    platforms: [android, unix, windows]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)(userAgent|\bua)\.(includes|indexOf)\(\s*["''](FBA[NV]|Instagram)'
composite_rules:
  - id: user-agent-header-or-mobile-context
    desc: User-Agent header or mobile-token context
    crit: notable
    conf: 0.94
    any:
      - id: mobile-user-agent-read
      - id: user-agent-header-map-reference
  - id: android-user-agent-branch-any
    desc: Branches on an Android User-Agent
    crit: component
    conf: 0.92
    any:
      - id: android-user-agent-branch
      - id: android-user-agent-branch-text
    unless:
      - id: well-known/app/publishing/propertyhive::propertyhive-plugin-context
  - id: hardcoded-user-agent-list
    desc: Contains multiple hardcoded User-Agent strings
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/header/value::hardcoded-mozilla-user-agent-list
      - id: micro-behaviors/communications/http/header/value::hardcoded-python-requests-user-agent-list
      - id: micro-behaviors/communications/http/header/value::hardcoded-curl-user-agent-list
      - id: micro-behaviors/communications/http/header/value::hardcoded-wget-user-agent-list
  - id: bot-user-agent-list
    desc: List of search-engine or social crawler User-Agents
    crit: notable
    conf: 1.0
    any:
      - id: bot-user-agent-list--rx-1
      - id: bot-user-agent-list--rx-2
      - id: bot-user-agent-list--rx-3
      - id: bot-user-agent-list--rx-4
      - id: bot-user-agent-list--rx-5
      - id: bot-user-agent-list--rx-6
  - id: ai-crawler-user-agent
    desc: AI-service crawler User-Agent reference
    crit: notable
    # Lists, genuine crawlers and impostors contain the same tokens.
    # This observes a reference; request context belongs to its consumers.
    conf: 0.92
    any:
      - id: ai-crawler-user-agent--anthropic
      - id: ai-crawler-user-agent--openai
      - id: ai-crawler-user-agent--other
  - id: bot-user-agent-detection
    for: [php]
    desc: Detects crawler requests from the inbound User-Agent header
    crit: notable
    conf: 0.85
    all:
      - id: read-server-ua-php
      - id: bot-user-agent-list
