# Browser client-hint and fetch-metadata names are protocol fields, not prose.
# Keep the profile together so DDoS objectives can require several categories.
defaults:
  platforms: [unix, windows, android]
  for: [source]
  crit: notable
  conf: 0.88
  attack: T1071.001

traits:
  - id: msapphost-user-agent
    desc: Windows AppX web-host User-Agent token
    crit: notable
    conf: 0.99
    for: [text, json, powershell, python, javascript, typescript, csharp, pe, dll, shell]
    if:
      type: text
      substr: MSAppHost/3.0
  - id: browser-user-agent-string
    desc: Hardcoded browser User-Agent string
    if:
      type: string_literal
      regex: '(?i)^Mozilla/5\.0 \('
  - id: chrome-user-agent-literal
    desc: Chrome-flavoured User-Agent literal
    crit: notable
    conf: 0.7
    for: [powershell, csharp]
    platforms: [windows, unix]
    if:
      type: text
      regex: Mozilla/5\.0[^\n]{0,80}Windows NT 10\.0[^\n]{0,80}Chrome/\d+[^\n]{0,40}Safari/
  - id: native-browser-user-agent-pool
    desc: Native browser User-Agent rotation pool
    crit: notable
    conf: 0.97
    for: [elf, pe, macho]
    count_min: 8
    if:
      type: text
      regex: '^Mozilla/5\.0 \(.{10,100}\) AppleWebKit/[0-9.]+ \('
