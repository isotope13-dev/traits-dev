# Go HTTP User-Agent and browser-profile header handling.
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.9
  attack: T1071.001
  mbc: C0002

traits:
  - id: go-user-agent-set
    desc: Sets HTTP User-Agent header
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Header|header|headers)\.Set$'
      arg:
        kind: string
        exact: User-Agent

  - id: go-client-hint-header-assignment
    desc: Sets browser client-hint headers
    if:
      type: text
      regex: '"Sec-CH-UA(-[A-Za-z]+)?"\s*\]\s*='

  - id: go-fetch-metadata-header-set
    desc: Sets browser fetch metadata headers
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Header|header|headers)\.Set$'
      arg:
        kind: string
        substr: Sec-Fetch-

composite_rules:
  - id: go-browser-header-profile
    desc: Sets browser fingerprint HTTP headers
    crit: notable
    conf: 0.92
    all:
      - id: go-user-agent-set
      - id: go-client-hint-header-assignment
      - id: go-fetch-metadata-header-set
