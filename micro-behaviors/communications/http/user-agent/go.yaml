# Go HTTP User-Agent and browser-profile header handling.
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.9
  attack: T1071.001
  mbc: C0002

traits:
  - id: go-user-agent-set
    desc: Sets HTTP User-Agent header
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Header|header|headers)\.Set$'
      arg:
        kind: string
        exact: User-Agent
