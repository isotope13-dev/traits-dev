# Header setter spellings share one capability across Go and JavaScript.
defaults:
  platforms: [windows, unix]
  for: [go, javascript, typescript]
  crit: notable
  conf: 0.9
  attack: T1071.001
  mbc: C0002

traits:
  - id: headers-set-user-agent
    desc: Header setter references User-Agent
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Header|header|headers)\.[Ss]et$'
      arg:
        kind: string
        exact: User-Agent
