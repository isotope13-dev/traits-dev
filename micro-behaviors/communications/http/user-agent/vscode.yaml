defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: vscode-ext-metrics-user-agent
    desc: vscode-ext-metrics HTTP User-Agent
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']User-Agent["'']\s*:\s*["'']vscode-ext-metrics/[0-9.]+["'']'
