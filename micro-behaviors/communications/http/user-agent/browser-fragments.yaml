# Fixed fragments of a desktop browser User-Agent string. Every browser UA
# carries them, so they appear in browsers, web bundles, scrapers and HTTP
# clients alike. Relocated from objectives/command-and-control/channel/
# http-beacon, where they were chrome-spoof-user-agent-pe--rx-1/-rx-2/-rx-4;
# the objective composites there add the WinInet client and the non-Chrome
# binary context that make a hardcoded Chrome UA a spoof.
defaults:
  platforms: [unix, windows]
  for: [pe, dll, powershell, python, javascript, vbs, batch]
  conf: 0.9
  size_max: 5242880
  attack: T1071.001

traits:
  - id: chrome-gecko-ua-fragment
    desc: Chrome User-Agent fragment (like Gecko)
    crit: notable
    if:
      type: text
      substr: like Gecko) Chrome
  - id: applewebkit-ua-fragment
    desc: WebKit User-Agent fragment
    crit: notable
    if:
      type: text
      substr: ) AppleWebKit
  - id: khtml-ua-fragment
    desc: KHTML User-Agent fragment
    crit: component
    if:
      type: text
      substr: (KHTML
