defaults:
  platforms: [windows, unix]
  mbc: C0002
  attack: T1071.001
traits:
  - id: user-agent-header
    for: [binaries, scripts]
    desc: User-Agent header
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: '(["'']User-Agent["'']\s*:|User-Agent:)'
      not:
        - substr: libcurl/
  - id: chrome-121-user-agent
    for: [binaries, scripts]
    desc: Chrome 121 browser User-Agent string
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: 'Chrome/121.0.0.0 Safari/537.36'
  - id: ua-mozilla-old
    for: [python, javascript, powershell, rust, pe, elf]
    desc: Old Mozilla 4.0 User-Agent
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: Mozilla/4.0
  - id: ua-curl
    for: [python, javascript, powershell, rust, pe, elf]
    desc: curl User-Agent
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \bcurl/
  - id: ua-wget
    for: [python, javascript, powershell, rust, pe, elf]
    desc: wget User-Agent
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \bWget/
  - id: ua-python-urllib
    for: [python, javascript, powershell, rust, pe, elf]
    desc: Python urllib User-Agent
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Python-urllib
composite_rules:
  - id: scripted-user-agent-values
    for: [python, javascript, powershell, rust, pe, elf]
    desc: Scripted HTTP User-Agent values
    crit: notable
    conf: 0.66
    any:
      - id: ua-mozilla-old
      - id: ua-curl
      - id: ua-wget
      - id: ua-python-urllib
