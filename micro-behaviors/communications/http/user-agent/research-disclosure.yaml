# A User-Agent that introduces the sender as a research study and offers a way
# to opt out. The wording exists for one reason: whoever wrote it expects the
# request to arrive unsolicited and to draw complaints, so the header doubles as
# an advance answer to the recipient. That is a property of the sender's posture,
# not proof of intent -- a published crawler carries the same courtesy string --
# so it stays a neutral communications capability here and composites supply the
# context (who is being contacted, and whether anyone asked for it).
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  mbc: C0002
  attack: T1071.001
traits:
  - id: research-optout-user-agent
    desc: Request identifies itself as opt-out research
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      # Both halves on one literal: the research/survey self-description and
      # the opt-out offer. Either alone is ordinary prose -- a docstring
      # mentioning research, a settings page offering an opt-out -- and the
      # pairing inside a single sent string is what makes it a sender
      # disclosure.
      regex: '(?i)\b(academic|research|study|survey)\b[^"'']{0,80}\bopt[- ]?out\b'
