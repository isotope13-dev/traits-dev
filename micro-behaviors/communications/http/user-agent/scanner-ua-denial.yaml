# Webshells and cloaked pages classify clients by User-Agent against
# shell/scanner tool vocabulary: crawler tokens (spider, slurp), download
# and interpreter tools (wget, curl, python), and legacy clients (libwww,
# lwp, snoopy, teoma). b374k's block_bot() regex is the canonical example.
# Requiring tokens from all three families separates a denial list from
# code that merely mentions a single tool; the deny decision belongs to
# consuming composites.
defaults:
  platforms: [windows, unix]
  for: [php, javascript]
  crit: component
  conf: 0.9

traits:
  - id: ua-crawler-token
    desc: Crawler User-Agent vocabulary token
    if:
      type: text
      regex: '(?i)\b(spider|crawler|slurp)\b'
  - id: ua-shell-tool-token
    desc: Shell-tool User-Agent vocabulary token
    if:
      type: text
      regex: '(?i)\b(wget|curl|python)\b'
  - id: ua-legacy-client-token
    desc: Legacy client User-Agent vocabulary token
    if:
      type: text
      regex: '(?i)\b(libwww|lwp|snoopy|teoma)\b'

composite_rules:
  - id: scanner-tool-ua-denial-list
    desc: Lists shell-tool and crawler User-Agent tokens
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: ua-crawler-token
      - id: ua-shell-tool-token
      - id: ua-legacy-client-token
