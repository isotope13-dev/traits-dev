composite_rules:
- platforms:
  - linux
  - macos
  - windows
  for:
  - batch
  - javascript
  - powershell
  - python
  - vbs
  id: chrome-user-agent-script
  desc: Chrome User-Agent fragments in script source
  crit: notable
  conf: 0.75
  all:
  - id: metadata/file/profile/user-agent::chrome-gecko-ua-fragment
  - id: metadata/file/profile/user-agent::applewebkit-ua-fragment
  - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
  - id: metadata/file/profile/user-agent::khtml-ua-fragment
  near_bytes: 4096
  unless:
  - id: well-known/app/media/svtplay-dl
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: well-known/lib/vendor-sdk/tscircuit-eval/
