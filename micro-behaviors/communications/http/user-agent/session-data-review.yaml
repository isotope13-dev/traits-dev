composite_rules:
- platforms:
  - linux
  - macos
  - windows
  for:
  - batch
  - javascript
  - powershell
  - python
  - vbs
  id: chrome-user-agent-script
  desc: Chrome User-Agent fragments in script source
  crit: notable
  conf: 0.75
  all:
  - id: micro-behaviors/communications/http/header/value::chrome-gecko-ua-fragment
  - id: micro-behaviors/communications/http/header/value::applewebkit-ua-fragment
  - id: micro-behaviors/communications/http/header/value::browser-mozilla-5-0
  - id: micro-behaviors/communications/http/header/value::khtml-ua-fragment
  near_bytes: 4096
