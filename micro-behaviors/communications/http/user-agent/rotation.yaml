# Per-request client-identity rotation out of a User-Agent pool.
#
# Existing traits in this directory record that several browser User-Agent
# literals are present. These record the step after that: the code picks a
# different one per request, so consecutive requests present as different
# clients. Scraping libraries ship this as a feature, so it stays a capability
# observation.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
  attack: T1036.005
  mbc: E1036

traits:
  - id: useragent-pool-symbol
    desc: User-Agent pool symbol
    conf: 0.8
    for: [elf]
    platforms: [unix, android]
    if:
      type: symbol
      exact: useragents

  - id: user-agent-pool-index-rotation
    desc: Selects User-Agent from a pool by index
    conf: 0.9
    if:
      # `UA_POOL[n % UA_POOL.length]`, `uaPool[n%len(uaPool)]`,
      # `USER_AGENTS[i % len(USER_AGENTS)]`. Require an index token before
      # `%` and a length operation after it. The old prefix-only expression
      # also matched random bytes in encoded payload strings.
      type: text
      regex: '(?i)\b(ua|user_?agents?)\w*\[[^\]\n]{1,16}%[^\]\n]{0,20}(len|length)\b'

  - id: user-agent-pool-random-choice
    desc: Picks User-Agent at random from a pool
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bchoice\s*\(\s*[a-z_]{0,8}(ua|user[_-]?agent)[_a-z]{0,8}\s*[,)]'

composite_rules:
  - id: user-agent-pool-rotation
    desc: Rotates client User-Agent across a pool
    conf: 0.93
    any:
      - id: user-agent-pool-index-rotation
      - id: user-agent-pool-random-choice
