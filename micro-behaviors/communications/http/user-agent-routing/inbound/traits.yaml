defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, php]
  crit: notable
  conf: 0.9

traits:
  - id: node-user-agent-read
    desc: Node handler reads User-Agent header
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(req|request)\s*\.\s*headers\s*\[\s*["'']user-agent["'']'

  - id: node-user-agent-get
    desc: Node handler gets User-Agent header
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(req|request)\s*\.\s*headers\s*\.\s*get\s*\(\s*["'']user-agent["'']'

  - id: php-user-agent-read
    desc: PHP handler reads User-Agent header
    for: [php]
    if:
      type: text
      regex: '(?i)\$_SERVER\s*\[\s*["'']HTTP_USER_AGENT["'']'
    unless:
      - id: objectives/discovery/system/fingerprint/info::rendered-phpinfo-dump

  - id: python-user-agent-read
    desc: Python handler reads User-Agent header
    for: [python]
    if:
      type: text
      regex: '(?i)\b(os\.environ|environ)\s*\[?\s*["'']HTTP_USER_AGENT["'']'
