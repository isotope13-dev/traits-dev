defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
  crit: notable
  conf: 0.92

traits:
  - id: js-crawler-user-agent-test
    desc: JavaScript tests crawler User-Agent token
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?is)/[^/]{0,40}\b(bot|crawler|spider)\b.{0,40}/[gimuy]*\s*\.\s*(test|exec)'

  - id: js-automation-user-agent-test
    desc: JavaScript tests automation User-Agent token
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?is)/[^/\n]{0,50}\b(headless|scanner)\b[^b\n]{0,50}/[gimuy]*\s*\.\s*(test|exec)'

  - id: php-crawler-user-agent-test
    desc: PHP tests crawler User-Agent token
    for: [php]
    if:
      type: text
      regex: '(?is)preg_match\s*\(\s*["''].{0,60}\bbot\b.{0,60}["'']\s*,'

  - id: php-automation-user-agent-test
    desc: PHP tests automation User-Agent token
    for: [php]
    if:
      type: text
      regex: '(?is)preg_match\s*\(\s*["''].{0,60}\b(headless|scanner)\b.{0,60}["'']\s*,'
