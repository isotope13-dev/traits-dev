# UsernameToken is WS-Security authentication, also used outside WS-Trust.
# Keep matchers, scopes and proximity unchanged on relocation.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: ws-security-username-token-element
    desc: WS-Security UsernameToken element
    if:
      type: text
      regex: '(?i)<[A-Za-z_][\w.-]*:UsernameToken\b|<UsernameToken\b'

  - id: ws-security-username-field
    desc: WS-Security token username field
    if:
      type: text
      # A naked <Username> element is generic application XML. Require the
      # enclosing WS-Security UsernameToken so this atom actually identifies
      # the protocol named by the trait.
      regex: '(?is)<(\w+:)?UsernameToken\b.{0,800}<(\w+:)?Username\b'

  - id: ws-security-password-field
    desc: WS-Security token password field
    if:
      type: text
      # See ws-security-username-field: the UsernameToken context prevents
      # arbitrary account/configuration XML from being labeled WS-Security.
      regex: '(?is)<(\w+:)?UsernameToken\b.{0,900}<(\w+:)?Password\b'

composite_rules:
  - id: ws-security-username-password-fields
    desc: WS-Security username/password token fields
    all:
      - id: ws-security-username-field
      - id: ws-security-password-field
    near_lines: 12

