# Model API endpoint references are neutral communications capabilities.  The
# automation objective composes these with UI-tree input, action parsing, and
# accessibility gestures before making a hostile determination.
defaults:
  platforms: [unix, windows, android]
  for: [java, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: chat-completions-endpoint
    desc: Chat completions model endpoint reference
    if:
      type: text
      regex: '(?i)\bchat/completions\b'

  - id: generate-content-endpoint
    desc: Generate-content model endpoint reference
    if:
      type: text
      regex: '(?i)\bgenerateContent\b'

  - id: responses-endpoint
    desc: Responses model endpoint reference
    if:
      type: text
      regex: '(?i)/(v[0-9]+/)?responses\b'

composite_rules:
  - id: model-generation-request
    desc: References a generative model endpoint
    any:
      - id: chat-completions-endpoint
      - id: generate-content-endpoint
      - id: responses-endpoint
