defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]

composite_rules:
  # The redirect atom binds the URL assignment to the next request. Pairing
  # it with local cookie access exposes sensitive forwarding capability, but
  # does not establish an attacker destination or bind the selected cookies
  # to that particular header. A cookie-read opt-in alone cannot validate
  # redirects, so this warning also applies to legitimate clients. The
  # Pi-extension context excludes unchecked cookie redirects itself; an
  # opt-in setting must never suppress a redirect boundary violation.
  - id: local-google-cookie-unchecked-redirect-cooccurrence
    desc: Local Google cookie access co-occurs with unchecked cookie redirects
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/communications/http/cookie-name::google-auth-cookie-name
      - id: micro-behaviors/communications/http/services/gemini::gemini-web-bard-stream-api
      - id: manual-redirect-cookie-forwarding
    unless:
      - id: well-known/app/ai/browser-agent/pi-web-access::pi-extension-gated-cookie-reader
