defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: referrer-regex-rejection-location-replace
    desc: Redirects visitors failing referrer regex
    if:
      type: text
      # A JavaScript regex literal may carry flags ("i", "gi") between the
      # closing slash and .test; requiring the flagless spelling missed
      # otherwise identical gates.
      regex: 'if\s*\(!/[^/\n]{1,99}/[dgimsuvy]{0,7}\.test\(document\.referrer\)\)\s*location\.replace\('
