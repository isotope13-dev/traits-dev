defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: referrer-regex-rejection-location-replace
    desc: Redirects visitors failing referrer regex
    if:
      type: text
      regex: 'if\s*\(!/[^/\n]{1,99}/\.test\(document\.referrer\)\)\s*location\.replace\('
