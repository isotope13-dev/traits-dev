defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: C0002
  crit: notable
  conf: 0.85

traits:
  - id: wordpress-redirect
    desc: Sends a WordPress HTTP redirect
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: wp_redirect

  - id: wordpress-safe-redirect
    desc: Calls WordPress safe-redirect API
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: wp_safe_redirect

  - id: wordpress-admin-redirect
    desc: WordPress redirect-call text includes admin_url
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'wp_(safe_)?redirect\s*\([^)]{0,160}\badmin_url\s*\('

  - id: php-location-redirect
    desc: PHP header-call text names an external Location
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)header\s*\(\s*["'']Location:\s*https?://'

  - id: php-inline-external-javascript-redirect
    desc: Inline script contains external location call
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?is)<script\b[^<]{0,240}(window\.)?location\.(replace|assign)\s*\(\s*["'']https?://'
  - id: php-javascript-redirect-variable
    desc: Location-call text contains a PHP variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)location\.(replace|assign)\s*\([^)]{0,260}\$[A-Za-z_][A-Za-z0-9_]*'
