# Compiled code that carries a ready-made HTTP redirect response. Whether the
# response is sent to a client is established by the consuming composite.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: native-http-redirect-status-template
    desc: Embedded HTTP 302/307 redirect status line
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'HTTP/1\.[01] 30[27] [A-Za-z ]{1,20}'

  - id: native-location-header-template
    desc: Embedded Location response header prefix
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'Location:'

composite_rules:
  - id: native-http-redirect-response-builder
    desc: Embedded redirect status line and Location header
    crit: notable
    conf: 0.9
    all:
      - id: native-http-redirect-status-template
      - id: native-location-header-template
