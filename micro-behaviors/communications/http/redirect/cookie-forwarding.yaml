defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: manual-redirect-cookie-forwarding
    desc: Reuses Cookie header across unchecked redirects
    if:
      type: tree-sitter
      query: |
        ((for_statement
          body: (statement_block
            (lexical_declaration
              (variable_declarator name: (identifier) @response
                value: (await_expression
                  (call_expression
                    arguments: (arguments (identifier) @url
                      (object
                        (pair key: (property_identifier) @headers
                          value: (object
                            (pair key: (property_identifier) @cookie
                              value: (identifier))))
                        (pair key: (property_identifier) @redirect
                          value: (string (string_fragment) @manual))))))))
            (if_statement
              consequence: (statement_block
                (lexical_declaration
                  (variable_declarator name: (identifier) @location
                    value: (call_expression
                      function: (member_expression
                        object: (member_expression object: (identifier) @read_response
                          property: (property_identifier) @response_headers)
                        property: (property_identifier) @get)
                      arguments: (arguments (string (string_fragment) @location_header)))))
                (if_statement
                  condition: (parenthesized_expression (identifier) @checked_location)
                  consequence: (statement_block
                    . (expression_statement
                      (assignment_expression left: (identifier) @updated_url
                        right: (call_expression
                          function: (member_expression
                            object: (new_expression constructor: (identifier) @constructor
                              arguments: (arguments (identifier) @target (identifier) @base))
                            property: (property_identifier) @to_string))))
                    . (continue_statement) .)))))) @loop
          (#eq? @headers "headers")
          (#eq? @cookie "cookie")
          (#eq? @redirect "redirect")
          (#eq? @manual "manual")
          (#eq? @response @read_response)
          (#eq? @response_headers "headers")
          (#eq? @get "get")
          (#eq? @location_header "location")
          (#eq? @location @checked_location)
          (#eq? @location @target)
          (#eq? @url @updated_url)
          (#eq? @url @base)
          (#eq? @constructor "URL")
          (#eq? @to_string "toString"))
