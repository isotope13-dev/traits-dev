defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: host-header-middlebox-redirect-clues
    desc: Host, agent and middlebox redirect clues
    crit: suspicious
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: micro-behaviors/communications/http/message::host-user-agent-header-pair
      - id: micro-behaviors/communications/http/redirect::via-middlebox-redirect
    near_bytes: 4096
