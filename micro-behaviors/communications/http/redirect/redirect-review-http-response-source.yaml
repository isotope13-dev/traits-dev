defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - javascript
  - typescript
  - ruby
  - java
  - csharp
  - go
  crit: notable
  conf: 0.82

traits:
  - id: go-http-redirect-symbol-call
    desc: Calls Go HTTP redirect response
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: symbol
      kind: call
      exact: http.Redirect

