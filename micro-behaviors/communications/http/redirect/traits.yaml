# Provider URL shapes used in multi-hop phishing redirect chains.  These are
# individual endpoint capabilities; the landing objective combines them with
# an authentication relay before assigning hostile intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, python, php, shell]
  attack: T1071.001
  mbc: C0002

traits:
  - id: google-meet-linkredirect
    desc: Google Meet linkredirect URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)https?://meet\.google\.com/linkredirect\?'

  - id: google-ads-ddm-click-tracker
    desc: Google Ads DDM click tracker
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(https?://|/)(amp/)?adservice\.google\.[a-z.]{2,20}/ddm/clk/'

  - id: s3-regional-path-style-url
    desc: AWS S3 regional path URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(https?:)?//s3\.[a-z0-9-]{2,32}\.amazonaws\.com/'
