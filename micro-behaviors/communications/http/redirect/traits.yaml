# Provider URL shapes used in multi-hop phishing redirect chains.  These are
# individual endpoint capabilities; the landing objective combines them with
# an authentication relay before assigning hostile intent.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, html, python, php, shell]
  attack: T1071.001
  mbc: C0002

traits:
  - id: redirect-url-object-field
    desc: Contains a redirectUrl object field
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bredirectUrl\s*:'
  # The field alone is not an external destination. Age-gate bypasses return
  # {redirectUrl: new URL(details.url).searchParams.get("returnto")} beside
  # the https URL they intercept. That filter URL is not the redirect target.
  - id: redirect-url-http-literal
    desc: redirectUrl set to an HTTP URL
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'redirectUrl\s*:\s*["'']https?://'
  - id: redirect-url-ident-from-http
    desc: HTTP assignment used as redirectUrl
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '=\s*["'']https?://[^"'']{4,80}["''][\s\S]{0,90}\bredirectUrl\s*:\s*[A-Za-z_$][\w$]*'

  # Same-site Shorts rewrite: the target is a youtube.com/watch URL and the
  # listener filter is youtube.com/shorts. An off-site target does not match.
  - id: youtube-shorts-to-watch-redirect
    desc: YouTube Shorts rewritten to watch URL
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'https?://(www\.)?youtube\.com/watch[\s\S]{0,240}urls:\s*\[[^\]]{0,160}youtube\.com/shorts'
      case_insensitive: true

  - id: ruffle-rs-package-redirect-target
    desc: Redirect target specifies @ruffle-rs package
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: 'npm/@ruffle-rs/ruffle'

  - id: webrequest-filter-ruffle-path
    desc: WebRequest filter matches ruffle path
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'urls:\s*\[[^\]]{0,80}/ruffle/'

  - id: response-redirect-member-access
    desc: References response redirect member
    conf: 0.94
    if:
      type: text
      regex: '\b(response|result)\s*(\.\s*redirect|\[\s*["'']redirect["'']\s*\])'

  - id: google-meet-linkredirect
    desc: Google Meet linkredirect URL
    conf: 0.95
    if:
      type: text
      regex: '(?i)https?://meet\.google\.com/linkredirect\?'

  - id: google-ads-ddm-click-tracker
    desc: Google Ads DDM click tracker
    conf: 0.95
    if:
      type: text
      regex: '(?i)(https?://|/)(amp/)?adservice\.google\.[a-z.]{2,20}/ddm/clk/'

  - id: s3-regional-path-style-url
    desc: AWS S3 regional path URL
    conf: 0.92
    if:
      type: text
      regex: '(?i)(https?:)?//s3\.[a-z0-9-]{2,32}\.amazonaws\.com/'

composite_rules:
  - id: response-driven-browser-navigation
    for: [javascript, html]
    desc: Navigates browser using response redirect target
    conf: 0.95
    near_bytes: 160
    all:
      - id: response-redirect-member-access
      - id: micro-behaviors/data/property/assign::location-href-write-text

  - id: external-redirect-target
    for: [javascript, typescript]
    desc: Redirect target is an external HTTP URL
    conf: 0.95
    any:
      - id: redirect-url-http-literal
      - id: redirect-url-ident-from-http

  - id: ruffle-player-cdn-redirect
    for: [javascript, typescript]
    desc: Ruffle player assets redirected to CDN
    conf: 0.92
    near_bytes: 512
    all:
      - id: redirect-url-object-field
      - id: ruffle-rs-package-redirect-target
      - id: webrequest-filter-ruffle-path
