defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf

composite_rules:
  - id: http-307-temporary-redirect-status
    desc: HTTP 307 response status line or framework status
    crit: notable
    conf: 0.9
    for: [python, shell, source, text]
    any:
      - id: micro-behaviors/communications/http/response::http-307-protocol-status
      - id: micro-behaviors/communications/http/response::http-307-framework-status

