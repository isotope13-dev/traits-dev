# The setter name records redirect-policy configuration, not whether redirects
# are enabled. In the reviewed launcher every call passes false.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: dotnet-allow-auto-redirect-setter-reference
    desc: HTTP automatic-redirect policy setter reference
    if:
      type: text
      exact: set_AllowAutoRedirect
      section: text
