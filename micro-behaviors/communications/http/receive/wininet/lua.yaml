defaults:
  for: [lua]
  platforms: [windows]
  crit: notable
traits:
  - id: lua-wininet-response-reader
    desc: Lua references WinInet response reading
    conf: 0.95
    if:
      type: text
      word: InternetReadFile
  - id: lua-wininet-url-opener
    desc: Lua references WinInet URL opening
    conf: 0.95
    if:
      type: text
      regex: '\bInternetOpenUrl[AW]?\b'
