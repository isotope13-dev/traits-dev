defaults:
  platforms:
  - unix
  - windows
  for:
  - java
  crit: notable
traits:
- id: java-response-output-accessor
  desc: Java response output accessor reference
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(response|resp|res)\s*\.\s*(getWriter|getOutputStream)\b
- id: java-response-writer-output
  desc: Java response writer output call
  conf: 0.85
  if:
    type: text
    regex: \b(response|resp|res)\s*\.getWriter\(\)\s*\.(write|print|println)\(
- id: java-writer-chained-write
  desc: Java getWriter chained write syntax
  conf: 0.9
  if:
    type: text
    regex: getWriter\s*\(\s*\)\s*\.write\s*\(
