defaults:
  platforms: [windows]
  for: [csharp]
  crit: notable
  conf: 0.96

traits:
  - id: csharp-httplistener-construction
    desc: Constructs a .NET HTTP listener
    if:
      type: text
      regex: '\bnew\s+(System\.Net\.)?HttpListener\s*\('

  - id: csharp-loopback-http-prefix
    desc: Adds a loopback HTTP listener prefix
    if:
      type: symbol
      kind: call
      regex: '\.Prefixes\.Add$'
      arg:
        index: 0
        kind: string
        regex: '^http://(localhost|127\.0\.0\.1|\[::1\]):[0-9]{1,5}/$'

composite_rules:
  - id: csharp-loopback-httplistener
    desc: HTTP listener construction with loopback prefix
    all:
      - id: csharp-httplistener-construction
      - id: csharp-loopback-http-prefix
