defaults:
  platforms:
  - windows
  for:
  - asp
  - jsp
traits:
- id: aspnet-request-indexer-syntax
  desc: ASP/JSP source contains Request indexer syntax
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)Request\s*\[
- id: aspnet-request-collection-indexer
  for: [asp, jsp, csharp, html]
  desc: Reads an ASP.NET request collection item
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)Request\s*\.\s*(Item|Form|QueryString)\s*\['
