# PowerShell can host HTTP directly through System.Net.HttpListener. The
# listener is a legitimate administration primitive; webshell objectives add
# request-controlled execution or file operations before assigning intent.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
  attack: T1071.001

traits:
  - id: powershell-httplistener-new-object
    desc: PowerShell creates a .NET HttpListener server
    conf: 0.96
    if:
      type: text
      regex: '(?i)New-Object\s+(-TypeName\s+)?(System\.Net\.)?HttpListener\b'

  - id: powershell-httplistener-constructor
    desc: PowerShell invokes HttpListener constructor
    conf: 0.97
    if:
      type: text
      regex: '(?i)\[(System\.)?Net\.HttpListener\]::new\s*\('

  - id: csharp-httplistener-constructor
    desc: C# invokes HttpListener constructor
    for: [csharp]
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)HttpListener$'

  - id: loopback-httplistener-prefix-add
    desc: Adds a loopback HTTP listener prefix
    for: [powershell, csharp]
    conf: 0.95
    if:
      type: text
      regex: '\.Prefixes\.Add\(\s*["'']https?://(localhost|127\.0\.0\.1|\[::1\]):\d{1,5}/'
      case_insensitive: true

  - id: powershell-http-request-stream
    desc: PowerShell reads HTTP request stream
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$REQUEST\.InputStream\b'

  - id: powershell-http-response-stream-write
    desc: PowerShell writes an HttpListener response body
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$RESPONSE\.OutputStream\.Write\s*\('

composite_rules:
  - id: powershell-httplistener
    desc: PowerShell constructs a .NET HttpListener
    conf: 0.97
    any:
      - id: powershell-httplistener-new-object
      - id: powershell-httplistener-constructor

  - id: loopback-httplistener
    desc: HttpListener construction with loopback prefix configuration
    for: [powershell, csharp]
    conf: 0.97
    near_lines: 20
    all:
      - id: loopback-httplistener-prefix-add
    any:
      - id: powershell-httplistener
      - id: csharp-httplistener-constructor
