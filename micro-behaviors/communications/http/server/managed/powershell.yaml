# PowerShell can host HTTP directly through System.Net.HttpListener. The
# listener is a legitimate administration primitive; webshell objectives add
# request-controlled execution or file operations before assigning intent.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1071.001

traits:
  - id: powershell-httplistener
    desc: PowerShell creates a .NET HttpListener server
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)New-Object\s+(System\.Net\.)?HttpListener\b'

  - id: powershell-loopback-http-prefix
    desc: PowerShell HTTP listener uses a loopback prefix
    crit: component
    conf: 0.95
    if:
      type: string_literal
      regex: '(?i)^https?://127\.0\.0\.1:[0-9]{2,5}/$'

  - id: powershell-http-request-stream
    desc: PowerShell reads HTTP request stream
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$REQUEST\.InputStream\b'

  - id: powershell-http-response-stream-write
    desc: PowerShell writes an HttpListener response body
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$RESPONSE\.OutputStream\.Write\s*\('

composite_rules:
  - id: powershell-loopback-httplistener
    desc: PowerShell hosts a loopback-only HTTP server
    crit: notable
    conf: 0.97
    all:
      - id: powershell-httplistener
      - id: powershell-loopback-http-prefix
