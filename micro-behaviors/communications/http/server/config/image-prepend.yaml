defaults:
  platforms: [unix, windows]
  for: [gif, text]
  crit: notable
traits:
  - id: image-marked-php-prepend-directive
    desc: Image bytes contain PHP image-preload directive
    conf: 0.98
    if:
      type: raw
      regex: '(?im)(^|[\r\n])[ \t]*auto_prepend_file\s*=\s*.{1,200}\.(png|gif|jpe?g|webp)\b'
