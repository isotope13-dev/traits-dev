traits:
- id: ini-auto-prepend-file
  desc: Nonempty PHP prepend directive assignment
  if:
    type: text
    regex: (?im)^[ \t]*auto_prepend_file[ \t]*=[ \t]*("[^"\r\n]{1,256}"|'[^'\r\n]{1,256}'|[^;#"'\s])
- id: ini-auto-append-file
  desc: Nonempty PHP append directive assignment
  if:
    type: text
    regex: (?im)^[ \t]*auto_append_file[ \t]*=[ \t]*("[^"\r\n]{1,256}"|'[^'\r\n]{1,256}'|[^;#"'\s])
defaults:
  for:
  - php
  - text
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.92
