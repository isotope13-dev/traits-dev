defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85
traits:
  - id: server-page-rewrite-field
    desc: Rewrite field references a server page
    conf: 0.86
    if:
      type: text
      regex: '"rewrite"\s*:\s*"/[^"]{0,64}\.(jspx?|php|aspx)"'
