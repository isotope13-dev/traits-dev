# Configuration carried by FastCGI clients is meaningful before delivery.
# Keep the backend parameter and the dangerous settings as separate roles.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: fastcgi-php-admin-parameter
    desc: Names FastCGI PHP administrator settings
    if:
      type: literal
      exact: PHP_ADMIN_VALUE

  - id: php-enable-url-includes-directive
    desc: Enables PHP URL inclusion directive
    if:
      type: literal
      regex: '(?m)(^|\\[nr])[ \t]*allow_url_include[ \t]*=[ \t]*(1|on|true)\b'

  - id: php-prepend-request-body-directive
    desc: PHP request-body prepend directive
    crit: suspicious
    if:
      type: literal
      regex: '(?m)(^|\\[nr])[ \t]*auto_prepend_file[ \t]*=[ \t]*["'']?php://input([\s;"'']|$)'
