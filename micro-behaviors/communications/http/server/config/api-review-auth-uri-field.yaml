defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85
traits:
  - id: auth-uri-field
    desc: URI field references an authentication path
    conf: 0.8
    if:
      type: text
      regex: '"uri"\s*:\s*"/[^"]{0,48}(login|logout|signin|auth)'
