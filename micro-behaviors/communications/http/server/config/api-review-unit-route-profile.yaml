defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php]

composite_rules:
  - id: unit-loopback-proxy-config-profile
    desc: NGINX Unit and loopback proxy references
    crit: notable
    conf: 0.9
    all:
      - id: well-known/app/infrastructure/nginx-unit::unit-live-config-surface
      - id: micro-behaviors/communications/proxy/config::loopback-proxy-url-field

  - id: unit-auth-rewrite-config-profile
    desc: NGINX Unit auth, rewrite and proxy clues
    crit: notable
    conf: 0.93
    all:
      - id: unit-loopback-proxy-config-profile
      - id: micro-behaviors/communications/http/server/config::server-page-rewrite-field
      - id: micro-behaviors/communications/http/server/config::auth-uri-field
