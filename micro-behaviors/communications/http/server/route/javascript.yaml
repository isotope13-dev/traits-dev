defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86
  attack: T1071.001
  mbc: C0002

traits:
  - id: javascript-server-route-registration
    desc: JavaScript HTTP server registers a route
    if:
      type: symbol
      kind: call
      exact: server.route

  - id: javascript-server-post-route
    desc: JavaScript HTTP server registers a POST route
    if:
      type: text
      regex: '(?is)\bserver\.route\s*\(\s*\{[\s\S]{0,320}\bmethod\s*:\s*["'']POST["'']'

  - id: hapi-route-script-payload
    desc: Hapi route reads a caller-supplied script field
    if:
      type: text
      regex: '(?is)\bserver\.route\s*\([\s\S]{0,900}\b[A-Za-z_$][A-Za-z0-9_$]*\s*\.\s*script\b'

  - id: javascript-get-route-condition-cluster
    desc: Server defines several HTTP GET routes
    crit: component
    conf: 0.94
    count_min: 2
    if:
      type: text
      regex: '\bmethod\s*===\s*["'']GET["'']'

  - id: status-route-path
    desc: Status management route path
    crit: component
    if:
      type: string_literal
      exact: /status

  - id: projects-route-path
    desc: Projects management route path
    crit: component
    if:
      type: string_literal
      exact: /projects

  - id: events-route-path
    desc: Events management route path
    crit: component
    if:
      type: string_literal
      exact: /events

  - id: jobs-route-path
    desc: Jobs management route path
    crit: component
    if:
      type: string_literal
      exact: /jobs

  - id: queue-status-route-path
    desc: Queue status management route path
    crit: component
    if:
      type: string_literal
      exact: /queue-status

  - id: health-route-path
    desc: Health management route path
    crit: component
    if:
      type: string_literal
      exact: /health

composite_rules:
  - id: management-route-path-cluster
    desc: Server exposes several management paths
    crit: component
    conf: 0.96
    needs: 2
    any:
      - id: status-route-path
      - id: projects-route-path
      - id: events-route-path
      - id: jobs-route-path
      - id: queue-status-route-path
      - id: health-route-path

  - id: javascript-management-get-route-cluster
    desc: Server exposes management GET routes
    conf: 0.96
    all:
      - id: javascript-get-route-condition-cluster
      - id: management-route-path-cluster
