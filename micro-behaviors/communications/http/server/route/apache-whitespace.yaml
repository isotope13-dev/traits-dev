defaults:
  platforms: [unix, windows]
  for: [text, scripts, source]

traits:
  # Apache routing syntax alone does not establish a webshell or log erasure.
  # Match the whitespace selector and PHP destination, regardless of basename.
  - id: apache-whitespace-php-rewrite
    desc: Apache rewrites whitespace paths to PHP
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)RewriteRule[ \t]+\^\\s\+[ \t]+\S+\.php[ \t]+\[L\]'
