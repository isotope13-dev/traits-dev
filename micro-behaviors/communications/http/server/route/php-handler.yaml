defaults:
  platforms: [unix, windows]
  for: [php, text]
traits:
- id: apache-php-handler-directive
  desc: Adds a PHP handler directive
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bAdd(Type|Handler|OutputFilter)[ \t]+[^\n]{0,80}(x-httpd-php|\.php)
- id: apache-nonstandard-php-suffix
  desc: AddType maps non-PHP extension to PHP
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: AddType\s+application/x-httpd-php\s+\.[A-Za-z0-9_]+
  not:
  - regex: \.(php[0-9]?|phtml|phps)$
  unless:
  - id: metadata/package/documentation/security-testing::authorized-fenced-testing-skill
  - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
  - type: text
    regex: (?i)\b(ServerRoot|LoadModule)\b
  - type: path
    regex: (?i)(^|[/\\])(httpd|apache2?)\.conf$
  - id: metadata/file/format/structured::serialized-skill-documentation-catalog
  - id: metadata/file/profile/markup::assessment-playbook-examples
