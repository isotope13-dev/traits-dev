defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - xml
  - text
  crit: notable
  conf: 0.95
traits:
- id: unix-shell-interpreter-setting
  desc: Interpreter field names a Unix shell
  if:
    type: text
    regex: '["'']interpreter["'']\s*:\s*["'']/(usr/)?bin/(ba|z|k|c)?sh["'']'
- id: python-shell-log-extension-mapping
  desc: Configures log extension with Unix shell
  crit: suspicious
  for:
  - python
  if:
    type: tree-sitter
    query: |-
      ((call arguments: (argument_list
        (string) @route
        (dictionary
        (pair key: (string) @ik value: (string) @shell)
        (pair key: (string) @ek value: (string) @ext)))) @mapping
        (#match? @route "/scripting/interpreters/")
        (#match? @ik "^[\"']interpreter[\"']$")
        (#match? @shell "^[\"']/(usr/)?bin/(ba|z|k|c)?sh[\"']$")
        (#match? @ek "^[\"']extension[\"']$")
        (#match? @ext "^[\"']\\.?log[\"']$"))
- id: python-combined-log-webroot-setting
  desc: Configures combined log under web root
  for:
  - python
  if:
    type: tree-sitter
    query: |-
      ((call arguments: (argument_list
        (string) @route
        (dictionary
        (pair key: (string) @fk value: (string) @path)
        (pair key: (string) @mk value: (string) @format)))) @log
        (#match? @route "/edit/log")
        (#match? @fk "^[\"']file[\"']$")
        (#match? @path "/(htdocs|wwwroot|public_html)/[^\"']+\\.log[\"']$")
        (#match? @mk "^[\"']format[\"']$")
        (#match? @format "^[\"']combined[\"']$"))
- id: javascript-shell-log-extension-mapping
  desc: Call configures log extension with Unix shell
  crit: suspicious
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    regex: '.+'
    arg:
      index: 1
      kind: string
      regex: '^/hosts/host@[0-9]+/edit/scripting/interpreters/'
    args:
    - index: 2
      from:
        field: interpreter
        whole_value: '^/(usr/)?bin/(ba|z|k|c)?sh$'
    - index: 2
      from:
        field: extension
        whole_value: '^\.?log$'
- id: javascript-combined-log-webroot-setting
  desc: Call configures combined log under webroot
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    regex: '.+'
    arg:
      index: 1
      kind: string
      regex: '^/hosts/host@[0-9]+/edit/log$'
    args:
    - index: 2
      from:
        field: file
        whole_value: '/(htdocs|wwwroot|public_html)/[^/]+\.log$'
    - index: 2
      from:
        field: format
        whole_value: '^combined$'
composite_rules:
- id: shell-interpreter-binding
  desc: Configures a shell as script interpreter
  any:
  - id: unix-shell-interpreter-setting
  - id: abyss-interpreter-unix-shell
  - id: abyss-interpreter-windows-shell
- id: root-vpath-with-shell-interpreter
  desc: Root vpath beside shell interpreter setting
  all:
  - id: micro-behaviors/data/config/schema::root-vpath-field
  - id: shell-interpreter-binding
