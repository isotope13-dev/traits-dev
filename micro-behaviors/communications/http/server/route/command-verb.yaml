# A server route whose path is a command verb (/exec, /api/run, /cmd,
# /shell): the endpoint is named for running something. Covers the
# decorator/router forms of Flask, FastAPI, Express and Go net/http.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, go, ruby, php]
  attack: T1071.001
traits:
  - id: command-verb-route-path
    desc: Server route named for running commands
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\.(post|get|route|HandleFunc)\(\s*["''`]/(api/)?(exec|execute|run|cmd|command|shell)["''`]'
  - id: process-execution-route-path
    desc: Server route named for process execution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.(post|get|route|HandleFunc)\(\s*["''`]/(api/)?(exec|execute|run|cmd|shell)["''`]'
  - id: quoted-command-route-sample
    desc: Command route quoted as a source sample
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']{3}[\s\S]{0,200}\.route\(\s*["'']/(run|exec|cmd)["'']'
  # A markdown fence around a FastAPI sample is documentation of the route,
  # the same way a triple-quoted string is. The route is not a handler this
  # file serves.
  - id: fenced-command-route-sample
    desc: Fenced sample shows a command route
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '```[a-z]*\n[\s\S]{0,240}@app\.get\(\s*["'']/execute["'']'
