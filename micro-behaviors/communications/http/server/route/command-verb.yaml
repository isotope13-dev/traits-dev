# A server route whose path is a command verb (/exec, /api/run, /cmd,
# /shell): the endpoint is named for running something. Covers the
# decorator/router forms of Flask, FastAPI, Express and Go net/http.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, go, ruby, php]
  attack: T1071.001
traits:
  - id: command-verb-route-path
    desc: Server route named for running commands
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\.(post|get|route|HandleFunc)\(\s*["''`]/(api/)?(exec|execute|run|cmd|command|shell)["''`]'
