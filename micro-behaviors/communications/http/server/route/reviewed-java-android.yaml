defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- for:
  - java
  - class
  id: java-add-mapping-method-reference
  desc: Java references addMapping method
  conf: 0.88
  if:
    type: text
    regex: getMethod\s*\(\s*["\x27]addMapping["\x27]
- id: java-post-mapping
  desc: Java POST mapping annotation
  conf: 0.94
  for:
  - java
  if:
    type: text
    regex: (?m)^\s*@PostMapping\b
- id: java-request-mapping-post
  desc: Java request mapping declares POST
  conf: 0.94
  for:
  - java
  if:
    type: text
    regex: (?is)@RequestMapping\([^)]{0,70}RequestMethod\.POST
composite_rules:
- id: java-post-handler
  desc: Java POST handler annotation
  conf: 0.95
  for:
  - java
  any:
  - id: micro-behaviors/communications/http/server/route::java-post-mapping
  - id: micro-behaviors/communications/http/server/route::java-request-mapping-post
