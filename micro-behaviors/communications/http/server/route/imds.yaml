# A route declaration is a server capability, not IMDS credential theft.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: node-imds-credential-get-route
  desc: App GET route targets IMDS credentials
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    regex: '^(app|router)\.get$'
    arg:
      index: 0
      kind: string
      regex: '^/latest/meta-data/iam/security-credentials(/.*)?$'
