defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98
traits:
  - id: apache-php-file-handler
    desc: Apache Files block enables PHP execution
    if:
      type: text
      regex: '(?is)<Files\s+[^>\n]{1,160}>\s*SetHandler\s+application/x-httpd-php\b'
  - id: apache-static-asset-alias
    desc: Apache aliases static asset URLs
    if:
      type: text
      regex: '\bAlias\s+["'']?/[^\s"'']{1,220}\.(css|js)["'']?\s+["'']?/[^\s"'']{1,220}'
  - id: apache-static-asset-regex-alias
    desc: Apache regex aliases static asset URLs
    if:
      type: text
      regex: '\bAliasMatch\s+["'']?\^?/[^\s"'']{1,220}\.(css|js)\$?["'']?\s+["'']?/[^\s"'']{1,220}'
