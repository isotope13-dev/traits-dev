defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98
traits:
  - id: apache-php-file-handler
    desc: Apache Files block enables PHP execution
    if:
      type: text
      regex: '(?is)<Files\s+[^>\n]{1,160}>[\s\S]{0,30}?SetHandler\s+application/x-httpd-php\b'
  - id: apache-static-asset-alias
    desc: Apache aliases static asset URLs
    if:
      type: text
      regex: '(\b|\\n)Alias\s+["'']?/\S{1,99}\.(css|js)["'']?\s+["'']?/\S{1,99}'
  - id: apache-static-asset-regex-alias
    desc: Apache regex aliases static asset URLs
    if:
      type: text
      regex: '(\b|\\n)AliasMatch\s+["'']?\^?/\S{1,99}\.(css|js)\$?["'']?\s+["'']?/\S{1,99}'
