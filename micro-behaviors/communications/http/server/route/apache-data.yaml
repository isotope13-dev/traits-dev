defaults:
  for: [text, scripts, source]
  platforms: [unix, windows]
  conf: 0.98

traits:
  # Match the handler configuration, including when an installer emits it.
  # No dependency on Rank Math, a campaign key, or a chosen backdoor name.
  - id: apache-data-suffix-php-handler
    desc: Apache executes data-file suffixes as PHP
    crit: notable
    if:
      type: text
      regex: '(?i)Add(Handler|Type)\s+application/x-httpd-php\d?\s+\.(cache|dat|log)\b'

