defaults:
  for: [text, scripts, source]
  platforms: [unix, windows]
  conf: 0.98

traits:
  # Match the handler configuration, including when an installer emits it.
  # No dependency on Rank Math, a campaign key, or a chosen backdoor name.
  - id: apache-addhandler-data-suffix-php
    desc: AddHandler/AddType maps data suffixes to PHP
    crit: notable
    if:
      type: text
      case_insensitive: true
      regex: 'Add(Handler|Type)\s+application/x-httpd-php\d*[^\n]{0,60}?\.(cache|dat|log)\b'

  - id: apache-filesmatch-data-suffix-php
    desc: Apache FilesMatch maps data suffixes to PHP
    crit: notable
    if:
      type: text
      case_insensitive: true
      regex: '<FilesMatch\s+.{1,16}\.\(?(cache|dat|log).{0,16}>\s*SetHandler\s+application/x-httpd-php'

composite_rules:
  - id: apache-data-suffix-php-handler
    desc: Apache maps data-file suffixes to PHP
    crit: notable
    any:
      - id: apache-addhandler-data-suffix-php
      - id: apache-filesmatch-data-suffix-php

