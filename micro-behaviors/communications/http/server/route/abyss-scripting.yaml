# Abyss Web Server keeps its host configuration in an XML abyss.conf:
# <scripting><interpreters><interpreter> binds an executable (<file>) to the
# URL extensions it handles, and <log><accesslog> names the request log.
defaults:
  platforms: [unix, windows]
  for: [xml, text]
  crit: notable
  conf: 0.95
traits:
  - id: abyss-interpreter-unix-shell
    desc: Abyss scripting interpreter is a Unix shell
    if:
      type: text
      regex: '<interpreter>\s*(<!--[^>]{0,160}-->\s*)?<file>\s*(/usr)?/bin/(ba|z)?sh\s*</file>'
  - id: abyss-interpreter-windows-shell
    desc: Abyss scripting interpreter is cmd/PowerShell
    if:
      type: text
      regex: '(?i)<interpreter>\s*<file>[^<]{0,200}\\(cmd|powershell)\.exe\s*</file>'
  - id: abyss-interpreter-data-extension
    desc: Abyss interpreter claims a log/text/image ext
    if:
      type: text
      regex: '(?i)</?extensions?>\s*<extension>(log|txt|jpe?g|png)</extension>'
  - id: abyss-access-log-in-htdocs
    desc: Abyss access log written inside htdocs
    if:
      type: text
      regex: '(?i)<accesslog>[^<]{0,200}[/\\]htdocs[/\\][^<]{1,200}</accesslog>'
