# Abyss Web Server keeps its host configuration in an XML abyss.conf:
# <scripting><interpreters><interpreter> binds an executable (<file>) to the
# URL extensions it handles, and <log><accesslog> names the request log.
defaults:
  platforms: [unix, windows]
  for: [xml, text]
  crit: notable
  conf: 0.95
traits:
  - id: abyss-interpreter-unix-shell
    desc: Abyss scripting interpreter is a Unix shell
    if:
      type: text
      regex: '<interpreter>\s*(<!--[^>]{0,160}-->\s*)?<file>\s*(/usr)?/bin/(ba|z)?sh\s*</file>'
  - id: abyss-interpreter-windows-shell
    desc: Abyss scripting interpreter is cmd/PowerShell
    if:
      type: text
      regex: '(?i)<interpreter>\s*<file>[^<]{0,200}\\(cmd|powershell)\.exe\s*</file>'
  # Adjacent fields must belong to one handler, with no intervening closing
  # interpreter tag. Do not infer a binding from file-wide co-occurrence.
  - id: xml-unix-shell-log-extension-mapping
    desc: XML handler maps log extension to shell
    crit: suspicious
    if:
      type: text
      exclude_html_comments: true
      regex: '<file>\s*(/usr)?/bin/(ba|z)?sh\s*</file>\s*<extensions>\s*<extension>\.?log</'
  # The paths may be in separate hosts, or htdocs may differ from documentroot.
  # This is a configuration co-occurrence, not proof of a reachable webshell.
composite_rules:
  - id: xml-shell-log-handler-and-htdocs-access-log
    desc: Shell log handler beside htdocs access-log setting
    crit: suspicious
    all:
      - id: xml-unix-shell-log-extension-mapping
      - id: micro-behaviors/fs/path/log/application::xml-access-log-htdocs-path
