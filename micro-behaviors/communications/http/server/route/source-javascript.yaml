defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1056.001

traits:
  - id: character-log-route
    desc: "Parameterized character-log route"
    crit: suspicious
    conf: 0.95
    for: [javascript]
    if:
      type: string_literal
      exact: /log/:char
  - id: field-focus-route
    desc: "Parameterized field-focus route"
    crit: suspicious
    conf: 0.9
    for: [javascript]
    if:
      type: string_literal
      exact: /focus/:field
