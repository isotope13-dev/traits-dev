defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1071.001
  mbc: C0002

traits:
  - id: python-heartbeat-route
    desc: Python HTTP heartbeat route reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /api/heartbeat

composite_rules:
  # notable, not suspicious (2026-09): both legs are neutral -- a route
  # decorator, and a parameter *named* `cmd`/`command` on the handler it
  # decorates. Nothing here observes execution, a shell, or a request-derived
  # value reaching either, so the pair states a capability ("this endpoint
  # takes a command-shaped argument"), not hidden intent. As `suspicious` it
  # fired on ordinary admin and task-runner endpoints and on deliberately
  # vulnerable IAST/DAST test applications (ddtrace ships one). The webshell
  # shape it was reaching for -- a request value reaching a process-execution
  # sink -- is detected directly by
  # `objectives/command-and-control/backdoor/webshell/exec::python-request-process-execution`.
  - id: python-http-command-route
    for: [python]
    desc: Route handler declares a command parameter
    crit: notable
    conf: 0.88
    attack: T1059.004,T1059.006
    # Keep the command-shaped parameter on the decorated handler signature.
    # A broad window joins ordinary routes to unrelated command helpers in
    # package managers and administrative services.
    near_lines: 3
    all:
      - id: micro-behaviors/communications/http/server/framework::python-http-route-basic-method
      - id: micro-behaviors/data/source/syntax/keyword::function-command-parameter
