defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1071.001
  mbc: C0002

traits:
  - id: python-heartbeat-route
    desc: Python HTTP heartbeat route reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /api/heartbeat

composite_rules:
  - id: python-http-command-route
    desc: HTTP route accepts a command
    crit: suspicious
    conf: 0.88
    attack: T1059.004,T1059.006
    # A route exposing a command-shaped parameter is a security-relevant
    # surface, while admin terminals can legitimately implement it.
    # Keep the command-shaped parameter on the decorated handler signature.
    # A broad window joins ordinary routes to unrelated command helpers in
    # package managers and administrative services.
    near_lines: 3
    all:
      - id: micro-behaviors/communications/http/server/framework::python-http-route-basic-method
      - id: micro-behaviors/data/source/syntax/keyword::function-command-parameter
