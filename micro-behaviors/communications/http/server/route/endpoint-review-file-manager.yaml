defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1071.001
  mbc: C0002
  crit: component
  conf: 0.86
traits:
  - id: rest-file-tree-endpoints
    crit: notable
    desc: REST file tree endpoints
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    if:
      type: text
      regex: '(?i)\b(get|post|put|patch|delete|route)\s*\(\s*["'']/(public/)?(tree|files|metadata)\b'
  - id: rest-admin-config-user-endpoints
    crit: notable
    desc: Registers config or user HTTP routes
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    if:
      type: text
      # Root filesystem staging directories (/config/, /users/) do not
      # establish HTTP endpoints. Require route-registration syntax.
      regex: '(?i)\b(get|post|route)\s*\(\s*["'']/(api/)?(config|users)\b'
composite_rules:
  - id: micro-behaviors/communications/http/server/route::rest-file-manager-endpoint-matrix
    desc: REST file manager endpoint matrix
    crit: notable
    conf: 0.94
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    all:
      - id: micro-behaviors/communications/http/server/route::rest-file-tree-endpoints
      - id: micro-behaviors/communications/url/resource-path/file::rest-file-mutation-endpoints
    any:
      - id: micro-behaviors/communications/url/resource-path/file::rest-archive-file-endpoints
      - id: micro-behaviors/communications/http/server/route::rest-admin-config-user-endpoints
    needs: 1
