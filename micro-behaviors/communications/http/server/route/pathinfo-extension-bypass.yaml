# An extension-anchored deny rule such as Apache's
# "RewriteRule ^(.+/.*|autoload)\.php($|/) - [F]" only inspects the end of
# the request URI. PATH_INFO lets a client append a second path segment
# after an allow-listed script, so a request URI ending in another .php
# path satisfies an allow-list condition anchored the same way while the
# server still executes the first, attacker-controlled .php file. This is
# a generic Apache/PHP routing quirk, not unique to any one application; a
# specific attack composite supplies the uploaded/written file context.
defaults:
  platforms: [unix, windows]
  for: [python, shell]
  attack: T1190

traits:
  - id: nested-php-pathinfo-extension-bypass
    desc: Nests .php path before trailing .php route
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: '(?i)\.php/[^\s?]{1,64}\.php(\?|\s|$)'
