# Configuration is a capability; webshell consumers supply the abuse context.
defaults:
  for: [text, scripts, source]
  platforms: [unix, windows]
  conf: 0.98
traits:
  - id: apache-package-signature-php-handler
    desc: Apache maps package/signature suffixes to PHP
    crit: notable
    if:
      type: text
      regex: '(?i)Add(Handler|Type)\s+application/x-httpd-php\s+\.(deb|sig|rpm)\b'
