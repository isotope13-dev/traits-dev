defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-request-code-to-strategy-helper
    desc: Request code name used in strategy helper
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (object_pattern (shorthand_property_identifier_pattern) @field)
              value: (member_expression object: (identifier) @request
                property: (property_identifier) @body)))
          (lexical_declaration
            (variable_declarator value: (await_expression
              (call_expression function: (member_expression property: (property_identifier) @method)
                arguments: (arguments . (identifier) @argument))))))
          (#eq? @request "req")
          (#eq? @body "body")
          (#eq? @field "code")
          (#eq? @field @argument)
          (#eq? @method "executeStrategy"))
