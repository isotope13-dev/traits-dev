defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
traits:
  - id: request-query-url-field
    desc: Reads URL from request query
    if:
      type: text
      regex: '\b(req|request)\.query\.url\b'
  - id: parsed-url-request-host
    desc: HTTP request host derives from parsed URL
    if:
      type: text
      regex: 'hostname\s*:\s*\w+\.hostname(\s*\()?'
    not:
      - substr: "("
      - regex: ':\s*os\.hostname$'
composite_rules:
  - id: cors-loopback-query-url-proxy
    desc: Loopback URL proxy emits wildcard CORS
    # A loopback webview API relay with ACAO * is an SSRF-style weakness in
    # the tool itself, not attacker behavior.
    crit: notable
    scope: file
    all:
      - id: request-query-url-field
      - id: parsed-url-request-host
      - id: set-wildcard-cors-origin-header
      - id: micro-behaviors/communications/socket/listen::node-server-listens-on-loopback
