# Jenkins server-side CSRF protection exposes its token issuer as crumbIssuer.
# Referencing the issuer does not establish disabling or bypassing protection.
defaults:
  for: [groovy]
  platforms: [unix, windows]
traits:
  - id: jenkins-crumb-issuer-reference
    desc: References Jenkins CSRF token issuer
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: crumbIssuer
