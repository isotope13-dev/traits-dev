defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: python-wsgi-asgi-access-logger-get
    desc: Queries Python HTTP access logger
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: 'getLogger\s*\(\s*["\x27](werkzeug|uvicorn\.access|gunicorn\.access)["\x27]'

  - id: python-logger-suppress-mutation
    desc: Disables or filters Python logger
    crit: component
    conf: 0.85
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '\.(disabled\s*=\s*True|setLevel\s*\(|addFilter\s*\()'

  - id: python-basehttp-log-message-override
    desc: Overrides BaseHTTPRequestHandler log_message
    conf: 0.88
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '\bdef\s+log_message\s*\(\s*self\s*,'

  - id: js-http-logger-header-skip
    desc: Skips Node HTTP log by header
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      exclude_comments: true
      regex: '\bskip\s*:\s*\(\s*(req|request)\b[^\n]{0,50}\.(headers|get|header)\b'

composite_rules:
  - id: python-http-access-logger-disable
    desc: Disables or filters Python HTTP server access logger
    conf: 0.93
    for: [python]
    near_lines: 8
    all:
      - id: python-wsgi-asgi-access-logger-get
      - id: python-logger-suppress-mutation
