# Servlet class/method references are neutral even when an agent uses them as
# patch targets. The webshell consumer must establish the injected behavior.
defaults:
  platforms: [windows, unix]
  for: [java, class]
  crit: notable
  conf: 0.86

traits:
  - id: tomcat-application-filter-chain
    desc: Tomcat ApplicationFilterChain class reference
    if:
      type: text
      substr: ApplicationFilterChain

  - id: servlet-internal-dofilter
    desc: Servlet internalDoFilter method reference
    if:
      type: text
      substr: internalDoFilter

composite_rules:
  - id: jvm-servlet-filterchain-reference
    desc: Servlet request filter chain reference
    any:
      - id: tomcat-application-filter-chain
      - id: servlet-internal-dofilter
