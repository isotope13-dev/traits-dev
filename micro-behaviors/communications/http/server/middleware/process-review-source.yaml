defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.8

traits:
- id: python-before-request-hook
  desc: Python before-request hook
  for: [python]
  if:
    type: symbol
    kind: call
    exact: before_request

- id: ruby-before-action-hook
  desc: Ruby before-action hook
  for: [ruby]
  if:
    type: text
    word: before_action

composite_rules:
- id: source-web-request-hook
  desc: Registers or defines a web-request hook
  conf: 0.82
  any:
  - id: micro-behaviors/communications/http/server/middleware::python-before-request-hook
  - id: micro-behaviors/communications/http/server/middleware::ruby-before-action-hook
  - id: micro-behaviors/communications/http/server/middleware::app-router-use-middleware-registration
  - id: micro-behaviors/communications/http/server/middleware::request-response-middleware-definition
  - id: micro-behaviors/communications/http/intercept::source-request-intercept-method
