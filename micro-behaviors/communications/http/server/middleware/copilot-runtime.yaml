defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
traits:
  - id: copilot-runtime-cors-enabled
    desc: Copilot runtime listener enables CORS
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @function
          arguments: (arguments (object
            (pair key: (property_identifier) @key value: (true)))))
          (#eq? @function "createCopilotNodeListener")
          (#eq? @key "cors"))
  - id: copilot-builtin-agent-construction
    desc: Constructs Copilot runtime built-in agent
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((new_expression constructor: (identifier) @constructor)
          (#eq? @constructor "BuiltInAgent"))
