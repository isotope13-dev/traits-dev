defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: wildcard-cors-set-header
    desc: JavaScript sets wildcard CORS response header
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)setHeader\s*\([^)]{0,100}Access-Control-Allow-Origin[^)]{0,40}\*'

  - id: wildcard-cors-map-entry
    desc: JavaScript defines wildcard CORS map entry
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Access-Control-Allow-Origin["'']?\s*:\s*["'']\*'

  - id: all-get-route-guard
    desc: Applies a response rule to every GET
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\bif\s*\(\s*method\s*===\s*["'']GET["'']\s*\)'

  - id: app-router-use-middleware-registration
    desc: JavaScript app or router registers middleware
    if:
      type: symbol
      kind: call
      regex: '^(app|router)\.use$'
    unless:
      # Vue 3 bootstraps plugins (router, pinia, i18n) through the identical
      # `app.use(...)` shape; createApp() marks it as a client app, not an
      # Express server. Without this every Vue SPA bundle reports middleware.
      - type: text
        regex: '\bcreateApp\s*\('

  - id: request-response-middleware-definition
    desc: Defines request-response middleware function
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(declare\s+)?function\s+\w*middleware\s*\(\s*req\b[^,]{0,40},\s*res\b'

  - id: returns-request-middleware-function
    desc: JavaScript returns request middleware function
    if:
      type: text
      regex: 'return\s*\(?\s*_?req\w*\s*,\s*_?res\w*\s*,\s*_?next\b'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record

composite_rules:
  - id: wildcard-cors-response
    desc: JavaScript wildcard CORS response
    crit: notable
    conf: 0.95
    any:
      - id: wildcard-cors-set-header
      - id: wildcard-cors-map-entry

  - id: all-get-routes-wildcard-cors
    desc: Allows wildcard CORS on every GET route
    crit: notable
    conf: 0.99
    near_bytes: 256
    all:
      - id: all-get-route-guard
      - id: wildcard-cors-set-header
