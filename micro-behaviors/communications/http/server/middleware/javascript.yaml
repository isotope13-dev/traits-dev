defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: wildcard-cors-set-header
    desc: JavaScript sets wildcard CORS response header
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)setHeader\s*\([^)]{0,100}Access-Control-Allow-Origin[^)]{0,40}\*'

  - id: wildcard-cors-map-entry
    desc: JavaScript defines wildcard CORS map entry
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Access-Control-Allow-Origin["'']?\s*:\s*["'']\*'

  - id: set-wildcard-cors-origin-header
    desc: Sets Access-Control-Allow-Origin to a wildcard
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][\w$]*\.setHeader$'
      args:
        - index: 0
          kind: string
          exact: Access-Control-Allow-Origin
        - index: 1
          kind: string
          exact: '*'

  - id: all-get-route-guard
    desc: Applies a response rule to every GET
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bif\s*\(\s*method\s*===\s*["'']GET["'']\s*\)'

  - id: app-router-use-middleware-registration
    desc: Express factory result registers middleware
    if:
      type: symbol
      kind: call
      regex: '^(app|router)\.use$'
      receiver:
        from:
          call: '^(express|express\.Router)$'

  - id: request-response-middleware-definition
    desc: Defines request-response middleware function
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(declare\s+)?function\s+\w*middleware\s*\(\s*req\b[^,]{0,40},\s*res\b'


composite_rules:
  - id: wildcard-cors-response
    desc: JavaScript wildcard CORS response
    crit: notable
    conf: 0.95
    any:
      - id: wildcard-cors-set-header
      - id: wildcard-cors-map-entry
      - id: set-wildcard-cors-origin-header

  # A CORS-enabled loopback server that launches a child process is an
  # especially useful review signal: a web origin may be able to drive a local
  # process-backed API. Keep the result notable because legitimate local tools
  # use this pattern too, and require facts from the actual call sites.
  - id: loopback-cors-post-child-process-server
    desc: Loopback server allows cross-origin POSTs and launches a child process
    crit: notable
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/socket/listen::node-server-listens-on-loopback
      - id: set-wildcard-cors-origin-header
      - id: micro-behaviors/communications/http/request/verb::http-post-method-condition
      - id: micro-behaviors/process/create/spawn::spawn-call

  - id: all-get-routes-wildcard-cors
    desc: Allows wildcard CORS on every GET route
    crit: notable
    conf: 0.99
    near_bytes: 256
    all:
      - id: all-get-route-guard
      - id: wildcard-cors-set-header
