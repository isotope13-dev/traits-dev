defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: express-middleware-registration
    desc: Express app or router middleware registration
    if:
      type: symbol
      kind: call
      regex: '^(app|router)\.use$'

  - id: returns-request-middleware-function
    desc: JavaScript returns request middleware function
    if:
      type: text
      regex: 'return\s*\(?\s*_?req\w*\s*,\s*_?res\w*\s*,\s*_?next\b'
    unless:
      - id: metadata/package/quality/recognized-contexts-extra::hashed-text-record
