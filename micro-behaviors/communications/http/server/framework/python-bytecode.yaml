defaults:
  platforms: [unix, windows]
  for: [pyc]
  crit: notable
  conf: 0.9
traits:
  - id: fastapi-bytecode-api-reference
    desc: Python bytecode references fastapi name
    if:
      type: symbol
      kind: identifier
      exact: fastapi
  - id: uvicorn-bytecode-api-reference
    desc: Python bytecode references uvicorn name
    if:
      type: symbol
      kind: identifier
      exact: uvicorn
