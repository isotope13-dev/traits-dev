# HTTP Server Operations - JavaScript/Node.js
# MBC: C0002 (HTTP Communication)
# ATT&CK: T1071.001
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript]
  mbc: "C0002"
  attack: "T1071.001"
traits:
  - id: server-express
    desc: Calls Express server application factory
    conf: 0.66
    unless:
      - id: metadata/package/documentation/
      - id: metadata/document/html::html-root-at-start
    if:
      type: symbol
      kind: call
      exact: express
  - id: server-restify-orator
    desc: Orator/Restify HTTP service server
    conf: 0.86
    if:
      type: text
      regex: "(orator-serviceserver-restify|require\\(['\"]restify['\"]\\))"
  - id: server-hapi
    desc: Hapi HTTP server
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: Hapi.server
  - id: server-hapi-permissive-cors
    desc: Hapi server permits cross-origin requests
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bHapi\.server\s*\(\s*\{[\s\S]{0,700}\bcors\s*:\s*true\b'
