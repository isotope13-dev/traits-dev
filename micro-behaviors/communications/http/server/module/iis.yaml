# IIS / ISAPI extension entry-point symbols. Legitimate IIS extension DLLs
# export these; hostility comes from packing them inside MSI droppers.
defaults:
  platforms: [windows]
  for: [pe, dll, oledoc, ole]
  crit: notable
  conf: 0.92

traits:
  - id: http-extension-proc-export
    desc: IIS ISAPI HttpExtensionProc export
    attack: T1505.004
    if:
      type: text
      substr: HttpExtensionProc

  - id: get-extension-version-export
    desc: IIS ISAPI GetExtensionVersion export
    attack: T1505.004
    if:
      type: text
      substr: GetExtensionVersion

  - id: http-filter-proc-export
    desc: IIS ISAPI HttpFilterProc export
    attack: T1505.004
    if:
      type: text
      substr: HttpFilterProc

  # The IIS metabase reached over ADSI. `IIS://<host>/w3svc` is the site tree;
  # every site node under it carries the identity IIS runs anonymous requests
  # as, password included and in the clear. Enumerating the tree is
  # administration; reading that one property is not.
  - id: iis-metabase-adsi-path
    desc: IIS metabase ADSI provider path
    crit: notable
    conf: 0.95
    for: [scripts, source, binaries]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)IIS://[\w.]{1,40}/w3svc'

  - id: iis-anonymous-user-password-property
    desc: Reads the IIS anonymous user password
    crit: suspicious
    conf: 0.95
    for: [scripts, source, binaries]
    platforms: [windows]
    if:
      type: text
      substr: AnonymousUserPass
      case_insensitive: true

composite_rules:
  - id: iis-isapi-extension-exports
    desc: IIS ISAPI extension export set
    conf: 0.94
    all:
      - id: http-extension-proc-export
    any:
      - id: get-extension-version-export
      - id: http-filter-proc-export
