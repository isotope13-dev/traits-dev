defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, c, cpp]
  crit: notable
  conf: 0.94

traits:
  - id: nginx-modules-registry-symbol
    desc: Nginx module registry or count symbol
    if:
      type: symbol
      regex: '^_?ngx_(modules|http_max_module)$'

  - id: nginx-http-log-module-ref
    desc: References Nginx ngx_http_log_module
    if:
      type: text
      substr: ngx_http_log_module

  - id: nginx-pool-alloc-symbol
    desc: Nginx memory pool allocation symbol
    if:
      type: symbol
      regex: '^_?ngx_p[nc]?alloc$'
