defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, c, cpp]
  crit: notable
  conf: 0.94

traits:
  - id: nginx-modules-registry-symbol
    desc: Nginx module registry or count symbol
    if:
      type: symbol
      regex: '^_?ngx_(modules|http_max_module)$'

  - id: nginx-http-log-module-ref
    desc: References Nginx ngx_http_log_module
    if:
      type: text
      substr: ngx_http_log_module

  - id: nginx-pool-alloc-symbol
    desc: Nginx memory pool allocation symbol
    if:
      type: symbol
      regex: '^_?ngx_p[nc]?alloc$'

  - id: nginx-version-banner-text
    desc: Nginx version banner format string
    if:
      type: text
      substr: "nginx version:"

  - id: nginx-worker-proctitle-format
    desc: Nginx or cwpsrv process-title string
    if:
      type: text
      regex: '\b(nginx|cwpsrv):\s*(%s|helper|worker|master)\b'

  - id: nginx-module-definition-source
    desc: Defines an Nginx module structure
    for: [c, cpp]
    if:
      type: text
      exclude_comments: true
      regex: '\bngx_module_t\s+ngx_\w+_module\s*=\s*\{'
