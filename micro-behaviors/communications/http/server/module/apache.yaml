defaults:
  crit: notable
  for:
    - c
    - cpp
  platforms:
    - unix
traits:
  - id: apache-httpd-include
    desc: Apache httpd.h header include
    conf: 0.95
    if:
      type: string_literal
      exact: httpd.h
  - id: apache-http-config-include
    desc: Apache http_config.h header include
    conf: 0.95
    if:
      type: string_literal
      exact: http_config.h
  - id: apache-module-declaration
    desc: Apache module declaration macro
    conf: 0.95
    if:
      type: string_literal
      substr: AP_MODULE_DECLARE_DATA
  - id: apache-hook-handler
    desc: Apache request handler hook registration
    conf: 0.95
    if:
      type: symbol
      exact: ap_hook_handler
  - id: apache-query-args-table
    desc: Parses Apache query arguments into table
    conf: 0.95
    if:
      type: symbol
      exact: ap_args_to_table
  - id: apache-form-data-parser
    desc: Parses Apache request form data
    conf: 0.95
    if:
      type: symbol
      exact: ap_parse_form_data
  - id: apache-hook-log-transaction
    desc: Apache log transaction hook
    conf: 0.9
    for: [c, cpp, elf, macho, so, dylib]
    if:
      type: symbol
      regex: '^_?ap_hook_log_transaction$'

  - id: apache-table-get-symbol
    desc: Apache APR table lookup symbol
    conf: 0.9
    for: [c, cpp, elf, macho, so, dylib]
    if:
      type: symbol
      regex: '^_?apr_table_get$'

  - id: apache-table-set-symbol
    desc: Apache APR table write symbol
    conf: 0.9
    for: [c, cpp, elf, macho, so, dylib]
    if:
      type: symbol
      regex: '^_?apr_table_setn?$'

  - id: apache-dontlog-token
    desc: Apache dontlog environment variable token
    crit: component
    conf: 0.85
    for: [c, cpp, elf, macho, so, dylib]
    if:
      type: text
      exact: dontlog

  - id: php-apache-setenv-dontlog
    desc: PHP sets Apache dontlog request variable
    conf: 0.95
    for: [php]
    if:
      type: text
      exclude_comments: true
      regex: '\bapache_setenv\s*\(\s*["\x27]dontlog["\x27]'
composite_rules:
  - id: apache-subprocess-env-dontlog
    desc: Sets Apache dontlog variable via APR table
    conf: 0.94
    for: [c, cpp, elf, macho, so, dylib]
    all:
      - id: apache-table-set-symbol
      - id: apache-dontlog-token
  - id: apache-module
    desc: Apache HTTPD loadable module
    conf: 0.95
    all:
      - id: apache-httpd-include
      - id: apache-hook-handler
    any:
      - id: apache-http-config-include
      - id: apache-module-declaration
  - id: apache-request-parameter-parser
    desc: Parses Apache HTTP request parameters
    conf: 0.95
    any:
      - id: apache-query-args-table
      - id: apache-form-data-parser
