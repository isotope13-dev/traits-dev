defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-start-python-file-server
    desc: Lua shell call starts Python HTTP server
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: os.execute
      arg:
        kind: string
        regex: '\bpython[23]?\s+-m\s+http\.server\b'
