# Loopback application ports are common development and reverse-proxy
# configuration. Backdoor intent requires separate route and execution evidence.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.78

traits:
  - id: loopback-app-port-after-host
    desc: Loopback host near application port
    if:
      type: text
      regex: '(localhost|127\.0\.0\.1).{0,80}(8000|8001|8002)'

  - id: loopback-app-port-before-host
    desc: Application port near loopback host
    if:
      type: text
      regex: '(8000|8001|8002).{0,80}(localhost|127\.0\.0\.1)'
