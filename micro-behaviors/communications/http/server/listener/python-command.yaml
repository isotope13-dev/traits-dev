# The built-in Python HTTP server is a neutral file-serving capability.  Keep
# the command form separate from the Python module/import atoms: an operator
# can launch it from a shell, another language, or an agent subprocess without
# importing http.server in the analyzed file.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1071.001
  mbc: C0002
  crit: notable
  conf: 0.92

traits:
  - id: python-built-in-http-server-command
    desc: Python built-in HTTP file-server command
    if:
      # Boundary also accepts a quote: the command usually appears as a
      # string literal when an operator launches it from another language
      # (os.system("python3 -m http.server")) rather than a shell script.
      type: text
      regex: '(?im)(^|[\s;&"''])[ \t]*(python[0-9.]*|py)[ \t]+-m[ \t]+http\.server\b'
  # Range-aware third-party file servers (RangeHTTPServer) are launched the
  # same one-liner way to serve local file trees — extension-repo and local
  # mirror tooling exposes prebuilt binaries to test suites this way.
  - id: python-range-file-server-command
    desc: Python range-aware HTTP file-server command
    if:
      type: text
      regex: '(?im)(^|[\s;&"''])[ \t]*(python[0-9.]*|py)[ \t]+-m[ \t]+RangeHTTPServer\b'
