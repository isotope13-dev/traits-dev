# Text co-occurrence: does not prove the service runs or is reachable.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: node-cwd-static-middleware
    desc: Static middleware points at current directory
    crit: component
    if:
      type: text
      regex: '\b(serveStatic|express[.]static)\s*\(\s*process[.]cwd\s*\(\s*\)\s*\)'
  - id: node-create-server-port-only-listen
    desc: HTTP server listen call supplies port only
    crit: component
    if:
      type: text
      regex: '\bhttp[.]createServer\s*\(\s*[\w$]+\s*\)[.]listen\s*\(\s*[\w$]+\s*\)'
composite_rules:
  - id: node-cwd-static-and-port-listener
    desc: CWD static serving and port-only HTTP listen co-occur
    crit: notable
    conf: 0.9
    all:
      - id: node-cwd-static-middleware
      - id: node-create-server-port-only-listen
