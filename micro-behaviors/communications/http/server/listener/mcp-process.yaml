defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: mcp-http-process-noauth-cooccurrence
    desc: HTTP MCP listener with execution/noauth fields
    # Co-occurrence does not bind a request to execution, prove public
    # exposure, or establish unauthorized access. Local tools also match.
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ipc/mcp::mcp-tools-list-method
      - id: micro-behaviors/communications/ipc/mcp::mcp-tools-call-method
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: metadata/package/config/runtime::javascript-noauth-declaration
      - id: micro-behaviors/communications/socket/listen::node-server-listen
      - id: micro-behaviors/communications/http/server/listener::http-createserver-call
