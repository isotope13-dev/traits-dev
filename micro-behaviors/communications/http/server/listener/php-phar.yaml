# Phar::webPhar() turns a .phar archive into its own front controller: it
# rewrites every request under a mount point to a rewrite callback that maps
# request paths to internal archive entries, then serves them. Legitimate
# tools (box, phpdoc, some CLI apps) use it to ship a self-contained web app
# in one file; attackers use the same mechanism to build a single-file
# web shell that intercepts and serves arbitrary content. The bare call is a
# neutral capability — objectives/command-and-control/backdoor/webshell/
# composites should combine it with dispatch/obfuscation evidence for intent.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1071.001
  mbc: C0002
  crit: notable
  conf: 0.9

traits:
  - id: phar-web-phar-front-controller
    desc: Registers Phar as HTTP front controller
    if:
      type: text
      regex: 'Phar\s*::\s*webPhar\s*\('
