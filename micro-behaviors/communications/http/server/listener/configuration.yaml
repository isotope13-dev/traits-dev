defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8
  mbc: C0002

traits:
  - id: hardcoded-server-host
    desc: Hardcoded HTTP server host constant
    if:
      type: text
      regex: \bconst\s+SERVER_HOST\s*=\s*["'][A-Za-z0-9.-]+\.[A-Za-z]{2,}["']
    not:
      - substr: localhost
      - substr: example.com
      - regex: '\.(local|lan|internal|home|example|invalid)["'']'
      - regex: '["''](0\.0\.0\.0|127(\.\d{1,3}){3})["'']'

  - id: http-port-literal
    desc: Named HTTP port constant
    if:
      type: text
      regex: \bconst\s+HTTP_PORT\s*=\s*\d{2,5}\s*;

  - id: https-port-literal
    desc: Named HTTPS port constant
    if:
      type: text
      regex: \bconst\s+HTTPS_PORT\s*=\s*\d{2,5}\s*;

composite_rules:
  - id: dedicated-http-https-ports
    desc: Separate HTTP and HTTPS constants
    crit: notable
    conf: 0.85
    all:
      - id: http-port-literal
      - id: https-port-literal
