# A Go net/http handler signature is ordinary server code; objectives that
# need a request handler cite it as one leg of a composite.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: go-http-handler-signature
    desc: Go HTTP handler function signature
    if:
      type: text
      regex: 'func\s+\w+\(\s*\w+\s+http\.ResponseWriter,\s*\w+\s+\*http\.Request\s*\)'
