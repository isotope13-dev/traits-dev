defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, python]
  attack: T1129

traits:
  - id: servicenow-ajax-processor-define
    desc: Defines ServiceNow AJAX script processor
    conf: 0.9
    if:
      type: text
      # Client-callable server-side handler: Object.extendsObject(
      # AbstractAjaxProcessor, { ajaxFunction_x: ... }) — reachable from
      # the client through /xmlhttp.do.
      regex: 'extendsObject\s*\(\s*AbstractAjaxProcessor'
