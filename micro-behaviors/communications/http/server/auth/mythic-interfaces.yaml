defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-jwt-auth-middleware-symbol
    crit: notable
    conf: 0.9
    desc: Go JWT auth middleware symbol reference
    if:
      type: symbol
      kind: identifier
      exact: JwtAuthMiddleware
  - id: go-cookie-auth-middleware-symbol
    crit: notable
    conf: 0.9
    desc: Go cookie auth middleware symbol reference
    if:
      type: symbol
      kind: identifier
      exact: CookieAuthMiddleware

