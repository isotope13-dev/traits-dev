defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: http-response-serializes-data
    desc: Response-named object sends serialized data
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(res|response)(\.[^;\r\n]{1,60}\))?\.(send|json)\s*\([\s\S]{0,250}JSON\.stringify\s*\('
      exclude_comments: true
