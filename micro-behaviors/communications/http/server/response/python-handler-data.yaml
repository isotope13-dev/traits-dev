defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-get-handler-oauth-command-data
  desc: GET handler passes an OAuth command URL
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((function_definition name: (identifier) @handler
       body: (block (if_statement alternative: (elif_clause consequence: (block
       (expression_statement (call arguments: (argument_list (dictionary (pair
       key: (string (string_content) @key) value: (string (string_content) @url))))))))))) @evidence
       (#eq? @handler "do_GET") (#eq? @key "authorization_endpoint")
       (#match? @url "\\$\\(\\[[A-Za-z.]+\\]::"))
