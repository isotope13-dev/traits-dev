defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: cookie-gated-decoded-client-fetch-clues
    desc: Cookie and decoded client-fetch clues
    crit: suspicious
    conf: 0.97
    attack: T1189,T1105
    for: [html, php]
    near_bytes: 800
    all:
      - id: micro-behaviors/communications/http/client/file-read::php-base64-client-ip-fopen-clues
      - id: micro-behaviors/communications/http/server/response::php-cookie-fopen-setcookie-echo

  # Repeated XOR decode-unescape-write loops replicated across a page:
  # each block rebuilds the same hidden script stage and writes it into
  # the document, which is how this injector family stamps its loader
  # into every compromised page template.
