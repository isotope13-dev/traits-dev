defaults:
  for: [class]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: jvm-servlet-output-write
    desc: JVM references servlet response byte writes
    if:
      type: import
      exact: javax/servlet/ServletOutputStream.write

  - id: jvm-jsp-writer-clear
    desc: JVM references clearing JSP output buffer
    if:
      type: import
      exact: javax/servlet/jsp/JspWriter.clear
