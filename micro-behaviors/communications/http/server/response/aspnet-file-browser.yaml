# Response-side evidence of a server file browser. A page that writes a
# file system entry's full path back into its own query links lets the next
# request select that path; the links alone establish no access control state.
defaults:
  platforms: [windows]
  for: [asp, csharp]
  crit: notable

traits:
  - id: aspnet-response-transmitfile
    desc: ASP.NET streams server file content
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)Response\s*\.\s*(TransmitFile|BinaryWrite\s*\(\s*File\.ReadAllBytes)\s*\('
  - id: aspnet-query-link-full-path
    desc: Query link carries a filesystem path
    conf: 0.93
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)[?&]\w{1,30}=\\?["'']?\s*(\+|\{)\s*((Server|HttpUtility)\.UrlEncode\()?\w+\.FullName\b'

composite_rules:
  - id: aspnet-file-content-response
    desc: ASP.NET returns server file content
    conf: 0.96
    any:
      - id: micro-behaviors/communications/http/response::aspnet-response-writefile
      - id: aspnet-response-transmitfile
