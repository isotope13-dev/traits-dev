defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  mbc: C0002
  attack: T1071.001

composite_rules:
  - id: range-aware-http-file-server
    desc: HTTP server implements byte-range file delivery
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/server/framework::http-server-import
      - id: micro-behaviors/communications/http/request/range::source-range-header-access
      - id: micro-behaviors/data/string/format::source-bytes-equals-literal
      - id: micro-behaviors/communications/http/header/content-range::source-content-range-send-header
      - id: micro-behaviors/communications/http/header/accept-ranges::source-accept-ranges-bytes-header
      - id: micro-behaviors/communications/http/response-code::source-http-206-partial-content
