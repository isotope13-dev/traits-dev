# HTTP Server Request Handling
# Micro-behaviors for extracting data from HTTP requests and writing to files
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
  conf: 0.75
traits:
  - id: extract-from-request-json
    desc: Extract data from JSON request body
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: "(request|req)\\.json|(request|req)\\.get_json"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/file/string/corpus::hashed-text-record
      - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
  - id: extract-from-request-form
    desc: Extracts a request form field
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(request|req)\.form\.get$'
  - id: extract-from-request-query
    desc: Extracts a request query field
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(request|req)\.args\.get$'
    unless:
      - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
  - id: extract-from-request-data
    desc: Extract data from request data field
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: request.data
  - id: file-store-variable
    desc: Store data to file variable
    conf: 0.5
    if:
      type: text
      regex: "(file|f)\\.write\\(\\s*(request\\.data)"
  - id: http-post-endpoint
    desc: HTTP POST method handler
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: "@app\\.post\\(|@route.{0,30}POST"
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
  - id: python-route-post-method
    desc: Python route declares POST method
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)@[A-Za-z_][\w.]*\.route\([^)]{0,80}methods\s*=\s*\[[^]]*POST'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
  - id: http-root-endpoint
    desc: HTTP endpoint at root path
    conf: 0.7
    if:
      type: text
      regex: '@.{0,30}(route|post).{0,20}[''\"]/?[''\"]'
  - id: express-json-body-parser
    desc: Configures Express JSON body parser
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: express.json
  - id: javascript-request-body-command-field
    desc: Request body supplies command field
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\{\s*(type\s*,\s*)?command\b.{0,100}\}\s*=\s*(req|request)\.body\b'
  - id: python-http-request-body-read
    desc: Reads raw Python HTTP request body
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: self.rfile.read
  - id: go-http-read-request
    desc: Go parses an incoming HTTP request
    crit: notable
    conf: 0.92
    for: [go]
    mbc: C0002
    attack: T1071.001
    if:
      type: symbol
      kind: call
      exact: http.ReadRequest
  - id: python-request-auth-field
    desc: Reads auth field from Python request
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '\b(request|req)\.get\s*\(\s*["''](token|secret|password)["'']'
  - id: python-request-key-field
    desc: Reads key field from Python request
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '\b(request|req)\.get\s*\(\s*["''](api[_-]?key|credential)["'']'
  - id: python-http-request-path-strip
    desc: Strips HTTP request path for a file
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: self.path.lstrip
  - id: python-http-response-body-write
    desc: Writes an HTTP handler response body
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: self.wfile.write

  # Operator-facing network tools commonly accept their destination and run
  # controls through an HTTP request.  Keep these atoms neutral: proxy panels,
  # load generators, and malicious booters can all expose the same fields.
  # The DDoS objective combines the complete field set with explicit flood
  # vectors; none of these generic request reads implies an attack by itself.
  - id: request-network-target-field
    desc: HTTP request selects a network target
    crit: notable
    conf: 0.9
    for: [javascript, typescript, php, python, ruby]
    if:
      type: symbol
      kind: member
      regex: '(?i)(POST|REQUEST|body|form|args|json|params)\.(target|host|url|ip(_address)?)$'

  - id: request-network-port-field
    desc: HTTP request selects a network port
    crit: notable
    conf: 0.9
    for: [javascript, typescript, php, python, ruby]
    if:
      type: symbol
      kind: member
      regex: '(?i)(POST|REQUEST|body|form|args|json|params)\.(port|target_port)$'

  - id: request-run-duration-field
    desc: HTTP request selects a run duration
    crit: component
    conf: 0.85
    for: [javascript, typescript, php, python, ruby]
    if:
      type: symbol
      kind: member
      regex: '(?i)(POST|REQUEST|body|form|args|json|params)\.(duration|attack_time)$'

  - id: request-concurrency-field
    desc: HTTP request selects a concurrency level
    crit: component
    conf: 0.85
    for: [javascript, typescript, php, python, ruby]
    if:
      type: symbol
      kind: member
      regex: '(?i)(POST|REQUEST|body|form|params)\.(concurrency|concurrent_attacks|workers|threads)$'

  - id: request-operation-method-field
    desc: HTTP request selects an operation method
    crit: component
    conf: 0.8
    for: [javascript, typescript, php, python, ruby]
    if:
      type: symbol
      kind: member
      regex: '(?i)(POST|REQUEST|body|form|args|json|params)\.(method|attack_method)$'

composite_rules:
  - id: http-post-method-handler
    desc: HTTP POST method handler variant
    crit: notable
    conf: 0.9
    any:
      - id: http-post-endpoint
      - id: python-route-post-method

  - id: http-request-input
    desc: HTTP handler reads request input
    crit: notable
    conf: 0.9
    any:
      - id: extract-from-request-json
      - id: extract-from-request-form
      - id: extract-from-request-query
      - id: extract-from-request-data

  - id: request-selected-network-destination
    desc: HTTP request selects a target host and port
    crit: notable
    conf: 0.93
    for: [javascript, typescript, php, python, ruby]
    all:
      - id: request-network-target-field
      - id: request-network-port-field
    near_bytes: 4096

  - id: request-selected-parallel-run
    desc: HTTP request selects method, duration, and concurrency
    crit: notable
    conf: 0.9
    for: [javascript, typescript, php, python, ruby]
    all:
      - id: request-run-duration-field
      - id: request-concurrency-field
      - id: request-operation-method-field
    near_bytes: 4096
