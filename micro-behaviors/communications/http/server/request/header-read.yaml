defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: go-http-request-header-read
    desc: Go handler reads HTTP header
    conf: 0.9
    for: [go]
    if:
      type: text
      exclude_comments: true
      regex: '\.Header\.(Get|Values)\s*\(\s*["`][A-Za-z0-9-]+["`]\s*\)'

  - id: python-request-headers-lookup
    desc: Python handler reads HTTP header
    conf: 0.9
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '(^|[^\w.])(request|req|self)\.headers\s*(\.get\s*\(|\[)\s*["\x27][A-Za-z0-9-]+'

  - id: python-wsgi-http-header-lookup
    desc: Python WSGI reads HTTP_ header
    conf: 0.9
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '\b(environ|META)\s*(\.get\s*\(|\[)\s*["\x27]HTTP_[A-Z0-9_]+'

  - id: js-request-headers-lookup
    desc: JS handler reads HTTP header
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      exclude_comments: true
      regex: '(^|[^\w$.])(req|request)\.(headers\s*\[\s*|(get|header)\s*\(\s*)["\x27`][A-Za-z0-9-]+'

  - id: php-server-http-header-lookup
    desc: PHP reads $_SERVER HTTP header
    conf: 0.9
    for: [php]
    if:
      type: text
      exclude_comments: true
      regex: '\$_SERVER\s*\[\s*["\x27]HTTP_[A-Z0-9_]+["\x27]\s*\]'

  - id: php-request-headers-call
    desc: PHP calls HTTP headers accessor
    conf: 0.9
    for: [php]
    if:
      type: symbol
      kind: call
      regex: '^(getallheaders|apache_request_headers)$'

  - id: rust-request-headers-lookup
    desc: Rust handler reads HTTP header
    conf: 0.9
    for: [rust]
    if:
      type: text
      exclude_comments: true
      regex: '\.headers\(\)\s*\.\s*get\s*\(\s*["A-Za-z0-9_:-]+'

  - id: native-http-header-token-candidate
    desc: Native HTTP request header token
    crit: component
    conf: 0.8
    for: [elf, macho, pe, dll, so, dylib, c, cpp]
    if:
      type: text
      regex: '\b(Authorization|If-None-Match|If-Match|X-[A-Z][A-Za-z0-9-]{2,24})\b'
    not:
      - substr: X-Forwarded-
      - substr: X-Frame-Options
      - substr: X-Content-Type-Options
      - substr: X-XSS-Protection
      - substr: X-Powered-By
      - substr: X-UA-Compatible
      - substr: X-Permitted-Cross-Domain
      - substr: X-Download-Options
      - substr: X-DNS-Prefetch-Control
      - substr: X-Robots-Tag

  - id: native-http-server-wire-marker
    desc: HTTP server response wire string
    crit: component
    conf: 0.8
    for: [elf, macho, pe, dll, so, dylib, c, cpp]
    if:
      type: text
      regex: '\b(HTTP/1\.[01] 200|application/octet-stream|Content-Type:)\b'

  - id: embedded-c-http-header-lookup-symbol
    desc: C HTTP server header-lookup API
    conf: 0.92
    for: [elf, macho, pe, dll, so, dylib, c, cpp]
    if:
      type: symbol
      regex: '^_?(MHD_lookup_connection_value|mg_get_header|evhttp_find_header)$'

composite_rules:
  - id: server-request-header-read
    desc: HTTP server handler reads an incoming request header
    conf: 0.9
    for: [binaries, scripts, source]
    any:
      - id: go-http-request-header-read
      - id: python-request-headers-lookup
      - id: python-wsgi-http-header-lookup
      - id: js-request-headers-lookup
      - id: php-server-http-header-lookup
      - id: php-request-headers-call
      - id: rust-request-headers-lookup
      - id: embedded-c-http-header-lookup-symbol
      - id: micro-behaviors/communications/http/header/custom::binary-custom-x-header-name
      - id: micro-behaviors/communications/http/server/module::apache-table-get-symbol
      - id: native-http-server-header-surface

  - id: native-http-server-header-surface
    desc: Native HTTP server references request header and response wire markers
    conf: 0.88
    for: [elf, macho, pe, dll, so, dylib, c, cpp]
    all:
      - id: native-http-header-token-candidate
    any:
      - id: native-http-server-wire-marker
      - id: micro-behaviors/communications/http/server/module::nginx-version-banner-text
      - id: micro-behaviors/communications/http/server/module::nginx-http-log-module-ref
      - id: micro-behaviors/communications/http/server/module::http-extension-proc-export
      - id: micro-behaviors/communications/http/server/module::iis-native-module-pipeline-diagnostic
