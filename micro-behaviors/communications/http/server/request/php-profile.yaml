defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: laravel-request-input-read
    desc: Reads a Laravel request input field
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\$request->input\(\s*[''"][A-Za-z_]{1,20}[''"]\s*\)'

composite_rules:
  - id: php-host-profile-upload-handler
    desc: PHP upload handler with host-profile queries
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::php-uname-call
      - id: metadata/lang/source/syntax/attribute::html-multipart-enctype-attribute
    any:
      - id: micro-behaviors/fs/file/copy/call::php-copy-uploaded-temp-file
      - id: micro-behaviors/fs/file/move::php-move-uploaded-temp-file
      - id: micro-behaviors/fs/write/file/stream::write-uploaded-temp-stream
    near_bytes: 4096
