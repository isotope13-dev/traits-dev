# Hand-rolled multipart/form-data parsing in Classic ASP: the raw body from
# Request.BinaryRead is searched for each part's `filename="` field. Upload
# handlers in ordinary ASP applications do this too.
defaults:
  platforms: [windows]
  for: [asp, vbs]
  crit: notable
  conf: 0.9

traits:
  - id: asp-multipart-filename-scan
    desc: Searches request body for multipart filename
    if:
      type: text
      regex: '(?i)[(,]\s*"filename=("")?"\s*[,)]'
