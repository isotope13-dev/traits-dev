defaults:
  for: [class]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: jvm-jsp-request-accessor
    desc: JVM references JSP request accessor
    if:
      type: import
      exact: javax/servlet/jsp/PageContext.getRequest

  - id: jvm-session-attribute-read
    desc: JVM references HTTP session attribute lookup
    if:
      type: import
      exact: javax/servlet/http/HttpSession.getAttribute
