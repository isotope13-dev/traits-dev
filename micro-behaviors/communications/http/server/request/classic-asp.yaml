defaults:
  crit: notable
  platforms: [windows]
  for: [vbs, html, javascript, lua, asp]
traits:
  - id: classic-asp-collection-request-field
    desc: "Request.Form/QueryString call prefix"
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[^\w$.])request\s*\.\s*(Form|QueryString)\s*\('
