# Request-handler context only: proximity does not prove parameter-to-file flow.
# Preserve the legacy matcher and JSP scope; the consuming objective supplies
# the class-loading behavior. Plain Files.write lives under fs/write/file/full.
defaults:
  platforms: [unix, windows]
  for: [jsp]
traits:
- id: jsp-parameter-file-write-cooccurrence
  desc: JSP parameter access beside Files.write
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?is)request\s*\.\s*getParameter\s*\([^)]{1,80}\)[\s\S]{0,800}Files\.write\s*\('
