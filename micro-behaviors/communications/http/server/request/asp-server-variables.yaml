defaults:
  platforms: [windows]
  for: [asp, vbs]
  crit: notable
  conf: 0.98

traits:
  - id: asp-forwarded-for-read
    desc: ASP reads forwarded client address header
    if:
      type: text
      regex: '(?i)Request\.ServerVariables\("HTTP_X_FORWARDED_FOR"\)'
  - id: asp-script-name-read
    desc: ASP reads current script URL path
    if:
      type: text
      regex: '(?i)Request\.ServerVariables\("SCRIPT_NAME"\)'
  - id: asp-remote-addr-read
    desc: ASP reads remote client address
    if:
      type: text
      regex: '(?i)Request\.ServerVariables\("REMOTE_ADDR"\)'
