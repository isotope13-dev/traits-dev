defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.96
composite_rules:
- for:
  - jsp
  - java
  - kotlin
  - groovy
  - html
  - javascript
  - python
  - vbs
  id: java-servlet-base64-decoder-cooccurrence
  desc: Servlet request access beside Base64 decoding
  all:
  - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
  any:
  - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/communications/http/header/custom::servlet-get-header-call
  needs: 1
- for:
  - jsp
  - java
  - kotlin
  - groovy
  - scala
  id: java-servlet-reflective-base64-cooccurrence
  desc: Servlet request access beside reflective Base64 resolution
  all:
  - id: micro-behaviors/data/decode/reflection-base64::java-reflective-base64-decoder
  any:
  - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/communications/http/header/custom::servlet-get-header-call
  needs: 1
- id: java-servlet-codec-context
  desc: Servlet access beside Base64 decoder resolution
  for:
  - source
  - scripts
  - jsp
  - html
  any:
  - id: java-servlet-base64-decoder-cooccurrence
  - id: java-servlet-reflective-base64-cooccurrence
