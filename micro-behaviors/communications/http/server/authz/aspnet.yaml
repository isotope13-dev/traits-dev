defaults:
  platforms: [windows]
  for: [asp, csharp]
  crit: notable
  conf: 0.92

traits:
  - id: aspnet-authenticated-user-check
    desc: ASP.NET checks the authenticated user or role
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bUser\s*\.\s*(Identity\s*\.\s*IsAuthenticated|IsInRole\s*\()|\[\s*Authorize\b'
