# The directive is Apache configuration syntax. A command overwriting its
# policy file is a capability; tampering and scheduled restoration add intent.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: htaccess-grant-command-literal
    desc: Command string grants all htaccess access
    for: [scripts, source, -shell]
    if:
      type: literal
      regex: '(?i)Require\s+all\s+granted.{0,12}>[^;\r\n]{0,96}\.htaccess(["''\s]|$)'
      exclude_docstrings: true

  - id: shell-htaccess-cron-grant-string
    desc: Shell emits cron command opening htaccess
    for: [shell]
    platforms: [unix]
    if:
      type: tree-sitter
      query: |
        ((command name: (command_name) @emitter argument: (string) @job)
        (#match? @emitter "^(echo|printf)$")
        (#match? @job "^[\"]([0-9*/,\\-]+[ \\t]+){5}")
        (#match? @job "(?i)Require\\s+all\\s+granted.{0,12}>[^;\\r\\n]{0,96}\\.htaccess([\"'\\s]|$)"))

  - id: shell-htaccess-universal-grant-write
    desc: Shell writes permissive htaccess policy
    for: [shell]
    platforms: [unix]
    if:
      type: tree-sitter
      query: |
        ((redirected_statement
          body: (command name: (command_name) @writer
            argument: [(string) (raw_string)] @directive)
          redirect: (file_redirect ">" destination: (_) @policy))
        (#match? @writer "^(echo|printf)$")
        (#match? @directive "(?i)^['\"]Require\\s+all\\s+granted(\\\\n)?['\"]$")
        (#match? @policy "\\.htaccess['\"]?$"))

composite_rules:
  - id: htaccess-universal-grant-command-string
    desc: Command string grants all htaccess access
    for: [scripts, source]
    any:
      - id: htaccess-grant-command-literal
      - id: shell-htaccess-cron-grant-string

  - id: htaccess-universal-grant-write
    desc: Overwrites htaccess with universal access policy
    for: [scripts, source]
    any:
      - id: htaccess-universal-grant-command-string
      - id: shell-htaccess-universal-grant-write
