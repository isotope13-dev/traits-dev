# Power Pages web-role and table-permission identifiers. The strings are
# structured configuration values, not prose claims about access control.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, json]

traits:
  - id: power-pages-anonymous-users-role
    desc: Power Pages Anonymous Users web role
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: Anonymous Users

  - id: power-pages-read-table-permission
    desc: Power Pages table permission grants read
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)["''](privileges?|permissions?)["'']\s*[:=]\s*(\[[^\]]{0,120}\s*)?["'']Read["'']'
