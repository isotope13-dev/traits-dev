defaults:
  for:
  - scripts
  - binaries
  - source
  - -mirc
  - -ircii
  - -beam
  platforms:
  - linux
  - macos
  - windows
traits:
# The union spans 36 types; each scanner stays below the text-matcher cap.
# The disjoint branches preserve identical token semantics and safeguards.
- id: chromium-os-crypt-common-formats
  desc: References Chromium os_crypt structure
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bos_crypt\s*(::|\.|\()
  unless: &os-crypt-exclusions
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  downgrade: &os-crypt-downgrade
    any:
    - id: metadata/signed/platform::apple
- id: chromium-os-crypt-additional-formats
  for: [beam, mirc, ircii]
  desc: References Chromium os_crypt structure
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bos_crypt\s*(\(|\.|::)
  unless: *os-crypt-exclusions
  downgrade: *os-crypt-downgrade
- id: chromium-os-crypt-field
  desc: References bare Chromium os_crypt field
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: os_crypt
  unless:
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
composite_rules:
- id: chromium-os-crypt-reference
  for: [scripts, binaries, source]
  desc: References Chromium os_crypt structure
  crit: notable
  conf: 0.85
  any:
  - id: chromium-os-crypt-common-formats
  - id: chromium-os-crypt-additional-formats
  unless:
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  downgrade:
    any:
    - id: metadata/signed/platform::apple
