defaults:
  for:
  - scripts
  - binaries
  - source
  - -mirc
  - -ircii
  - -beam
  platforms:
  - linux
  - macos
  - windows
traits:
- id: chromium-encrypted-key-field
  desc: References Chromium encrypted_key field
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?m)(^|[\x00"'`.])encrypted_key\b
  unless:
  - type: text
    substr: JWE Compact Serialization
  - type: text
    substr: Unsupported JWE alg requested
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: metadata/lang/scripted::dts-declaration-file
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: chromium-os-crypt-reference
  desc: References Chromium os_crypt structure
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bos_crypt\s*(::|\.|\()
  unless:
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: chromium-os-crypt-field
  desc: References bare Chromium os_crypt field
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: os_crypt
  unless:
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
