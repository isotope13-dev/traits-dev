defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]
  crit: notable
  conf: 0.95

traits:
  # The cookie's chosen name and attribute order carry no behavioral meaning.
  # Require a flag value and a positive lifetime below 1000 seconds. This is
  # ordinary cookie handling until paired with inspection countermeasures.
  - id: browser-short-lived-flag-cookie
    desc: Writes a short-lived browser flag cookie
    if:
      type: text
      regex: '(?i)document\.cookie\s*=\s*["''][\w-]+=1;[^"'']{0,120}max-age=[1-9]\d{0,2}[;"'']'
