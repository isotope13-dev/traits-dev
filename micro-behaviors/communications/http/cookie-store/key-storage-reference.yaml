# These tokens describe Chromium key storage; they do not identify Selenium
# or establish that this file imports a browser profile. Preserve the former
# browser-profile-chrome-key-material matcher's effective scope.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: chromium-key-storage-reference
    desc: References Chromium cookie key storage
    crit: notable
    conf: 0.98
    size_max: 100000000
    if:
      type: text
      regex: '(?i)(Chrome Safe Storage|os_crypt)'
