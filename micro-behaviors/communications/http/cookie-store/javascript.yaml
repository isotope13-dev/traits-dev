# Browser Cookie Access - JavaScript/Browser-side
# Detects access to browser document.cookie DOM API and URL parameter harvesting
# ATT&CK: T1539 (Steal Web Session Cookie)
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  mbc: C0002
traits:
  - id: document-cookie-reference
    desc: Accesses browser document.cookie property
    conf: 0.75
    if:
      type: symbol
      kind: member
      exact: document.cookie
    unless:
      - id: well-known/lib/network/axios-legacy::axios-class
      - id: well-known/lib/network/axios-legacy::axios-version
      - id: metadata/document/html::doctype
  # Symbol extraction misses some compact phishing loaders; text fallback
  # covers inline HTML attachments and plain JS sources alike.
  - id: html-document-cookie-reference
    desc: Script source references document.cookie
    conf: 0.9
    for: [javascript, typescript, html, text]
    if:
      type: text
      regex: '\bdocument\s*\.\s*cookie\b'
    unless:
      # Text fallback for compact or embedded scripts where member extraction
      # failed; do not emit it beside the structured member finding.
      - id: document-cookie-reference
  - id: parent-document-cookie-read
    desc: "Matches 'document.cookie.matchs'"
    conf: 0.92
    if:
      type: text
      substr: parent.document.cookie
  - id: document-cookie-split-iterate
    desc: Iterates all cookies via document.cookie.split
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: document.cookie.split
    unless:
      - id: well-known/lib/network/axios-legacy::axios-class
      - id: well-known/lib/network/axios-legacy::axios-version
      - id: metadata/document/html::doctype
  - id: document-cookie-match
    desc: "Regex scans cookies via document.cookie.match"
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: document.cookie.match
    unless:
      - id: well-known/lib/network/axios-legacy::axios-class
      - id: well-known/lib/network/axios-legacy::axios-version
      - id: metadata/document/html::doctype
  # Replacing the cookie accessor intercepts every later read and write by
  # page scripts. Privacy blockers use it to suppress cookies and skimmers
  # use it to observe them, so the interception itself is the observable;
  # intent comes from what the replacement getter/setter does with values.
  - id: document-cookie-property-redefinition
    desc: Redefines document.cookie accessor
    conf: 0.92
    if:
      type: text
      regex: 'Object\.defineProperty\s*\(\s*document\s*,\s*[''"]cookie[''"]'
  - id: document-cookie-write
    desc: "Sets browser cookie via document.cookie assign"
    conf: 0.65
    if:
      type: symbol
      kind: bind
      exact: document.cookie
    unless:
      - id: well-known/lib/network/axios-legacy::axios-class
      - id: well-known/lib/network/axios-legacy::axios-version
  - id: browser-page-cookie-read
    desc: Reads browser cookies with Puppeteer
    conf: 0.92
    if:
      type: text
      substr: page.cookies
  - id: cookie-helper-set-function
    desc: Defines setCookie helper
    if:
      type: symbol
      exact: setCookie
  - id: cookie-helper-clear-function
    desc: Defines clearCookie helper
    if:
      type: symbol
      exact: clearCookie
  - id: cookie-helper-get-function
    desc: Defines getCookie helper
    if:
      type: symbol
      exact: getCookie
  - id: document-cookie-expire-directive
    desc: Assigns cookie with expiration directive
    conf: 0.9
    for:
    - javascript
    - typescript
    - html
    - text
    if:
      type: text
      regex: (?i)\.cookie\s*=[^\n]{0,240}(max-age\s*=\s*(0|-\d+)\b|expires\s*=)
  - id: client-geo-cookie-persistence
    desc: Persists visitor geolocation in cookie
    conf: 0.95
    if:
      type: text
      regex: '\b(sw_client_geo|readClientGeoCookie|saveClientGeoToCookies|clientGeoParamsFromCookies)\b'
composite_rules:
  # Either spelling of the same property reference, for composites that must not care whether
  # the access was recovered as a member expression or as inline page markup.
  - id: browser-document-cookie-reference
    desc: References browser document.cookie property
    conf: 0.9
    any:
      - id: document-cookie-reference
      - id: html-document-cookie-reference
  - id: cookie-helper-function-definitions
    desc: Defines set get and clear cookie helpers
    conf: 0.8
    any:
      - id: cookie-helper-set-function
      - id: cookie-helper-clear-function
      - id: cookie-helper-get-function
