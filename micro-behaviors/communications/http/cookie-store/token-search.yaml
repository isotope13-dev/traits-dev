# Lookup in a cookie collection is a store operation. Proximity is co-occurrence,
# not a local browser-profile read or session theft.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, java, ruby, php, csharp]

composite_rules:
  - id: cookie-search-near-auth-token-name
    desc: Cookie search near authentication-token name
    crit: notable
    conf: 0.97
    near_bytes: 200
    all:
      - id: micro-behaviors/data/collection/filter::named-cookie-collection-search
      - id: micro-behaviors/communications/http/token-auth::authentication-token-name-literal
    unless:
      - id: well-known/app/storage/bruno::app-bundle
