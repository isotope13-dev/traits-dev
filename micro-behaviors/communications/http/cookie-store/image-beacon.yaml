defaults:
  platforms: [windows, unix]
  for: [javascript, html, text]
  attack: T1539,T1041
  mbc: C0002

traits:
  - id: image-src-then-cookie
    desc: Image src assignment then cookie
    crit: notable
    if:
      type: text
      regex: '(?s)Image\)\.src=.{0,240}document\.cookie'
  - id: cookie-then-image-src
    desc: Cookie read then image src
    crit: notable
    if:
      type: text
      regex: '(?s)document\.cookie.{0,240}Image\)\.src'
