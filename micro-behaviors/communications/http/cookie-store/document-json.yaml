defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: document-cookie-json-object
    desc: Serializes document cookie in JSON object
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_comments: true
      regex: 'JSON\.stringify\s*\(\s*\{[^}]{0,300}\bdocument\.cookie\b'
