defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

traits:
- id: recognized-minified-cookie-helper-functions
  desc: Defines compact JavaScript cookie helpers
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: "(setCookie|getCookie|clearCookie)=function"
