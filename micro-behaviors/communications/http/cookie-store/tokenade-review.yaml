composite_rules:
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
  id: chromium-cookie-query-with-browser-path
  desc: Chromium path and cookie-table query co-occur
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/application/browser/storage::chrome-path
  - id: micro-behaviors/data/db/read/column::chromium-cookie-select-query
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  id: browser-cookie-store-query
  desc: Cookie-store SQL query reference
  conf: 0.95
  any:
  - id: micro-behaviors/data/db/read/column::chromium-cookie-select-query
  - id: micro-behaviors/data/db/read/records::powershell-cookie-table-select
  - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
defaults:
  crit: notable
