composite_rules:
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
  id: chromium-cookie-query-with-browser-path
  desc: Chromium path and cookie-table query co-occur
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/application/browser::chrome-path
  - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  id: browser-cookie-store-query
  desc: Queries a browser cookie store
  conf: 0.95
  any:
  - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
  - id: micro-behaviors/data/db/sql::powershell-cookie-table-select
  - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
  unless:
  - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context
  - id: well-known/tool/media/gallery-dl::package-context
defaults:
  crit: notable
