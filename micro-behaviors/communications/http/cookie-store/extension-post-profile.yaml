# Archive-wide authority/API co-occurrence, not proof that any cookie is
# transmitted or that all sites are read. Controller intent belongs in the
# objective consumer. This observation also applies to explicit export tools.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: extension-cookie-access-post-profile
    desc: Broad cookie authority and remote POST channel
    crit: notable
    conf: 0.90
    scope: archive
    for: [crx, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
    any:
      - id: micro-behaviors/communications/url/host/domain-http::js-hardcoded-remote-endpoint
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    needs: 1
