defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: passes-document-cookie-record
    desc: Passes document cookies in an object
    if:
      type: tree-sitter
      query: |
        ((function_declaration body: (statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @cookie
            value: (member_expression object: (identifier) @document
              property: (property_identifier) @property)))
          (return_statement (call_expression arguments: (arguments
            (object [(shorthand_property_identifier) @value
              (pair value: (identifier) @value)])))))) @call
          (#eq? @document "document")
          (#eq? @property "cookie")
          (#eq? @cookie @value))
