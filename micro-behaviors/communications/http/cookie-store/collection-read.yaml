# Neutral observations recovered from the Web3 / MPP sample review.
defaults:
  platforms: [windows, unix]

traits:
- crit: notable
  for:
  - javascript
  - typescript
  - python
  - java
  - csharp
  - ruby
  - php
  id: cookie-collection-read
  desc: Calls a cookie collection retrieval API
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: '(^|\.)([Gg]et[Cc]ookies|get_cookies|cookies\.get)$'

# Retrieval alone establishes neither browser access nor credential theft.
# Keep the same JS/TS alternatives used by the Steam cookie POST objective.
composite_rules:
  - id: cookie-retrieval-api
    desc: Calls a cookie retrieval API
    crit: notable
    for: [javascript, typescript]
    any:
      - id: cookie-collection-read
      - id: chrome-cookies-get-all
