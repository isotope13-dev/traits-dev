# These capabilities can be unrelated. Source-to-request binding is detected separately.
defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - class
  - java_class
  - jar
composite_rules:
- id: macos-cookie-read-upload-cooccurrence
  desc: Cookie paths with HTTP and read/upload APIs
  crit: suspicious
  conf: 0.97
  scope: archive
  all:
  - id: micro-behaviors/communications/http/cookie-store::macos-cookie-path-http-client
  - id: micro-behaviors/communications/url/host/name::dynamic-routing-host-reference
  any:
  - id: metadata/lang/source/syntax/call/arguments::cookie-blob-call-argument
  - id: micro-behaviors/data/encode/base64::cookie-store-base64-pipe
  - id: micro-behaviors/communications/http/upload
  - id: micro-behaviors/fs/read/file/
  - id: micro-behaviors/communications/http/request/body::urllib-payload-argument
  - id: micro-behaviors/data/buffer/transfer::go-io-copy
  - id: micro-behaviors/communications/http/curl::file-upload
