defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9

traits:
- id: cookie-store-flush
  desc: Flushes browser cookie store
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)cookies\\.flushStore$"
- id: chrome-cookies-api
  desc: Uses extension cookies API
  if:
    type: text
    regex: (^|\.)(chrome|browser)\.cookies\.[A-Za-z_]
- id: chrome-cookies-get-all
  desc: Enumerates extension-accessible cookies
  if:
    type: symbol
    kind: call
    regex: (^|\.)cookies\.getAll$
- id: chrome-cookies-get-all-unscoped
  desc: Requests cookies with an empty filter
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: \b(chrome|browser)\.cookies\.getAll\s*\(\s*\{\s*\}
- id: chrome-cookies-get-all-text
  desc: Enumerates cookies via extension API text
  if:
    type: text
    regex: \b(chrome|browser)\.cookies\.getAll\s*\(
- id: extension-cookie-presence-message
  desc: Requests cookies through extension messaging
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: runtime\.sendMessage[\s\S]{0,64}getAllCookies?
- id: chrome-cookies-get
  desc: Reads a cookie through WebExtension API
  if:
    type: symbol
    kind: call
    regex: ^(chrome|browser)\.cookies\.get$
- id: chrome-cookies-set
  desc: References browser cookie setter
  if:
    type: symbol
    kind: member
    regex: (^|\.)cookies\.set$
- id: chrome-cookies-on-changed-listener
  desc: Watches browser cookie changes
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (^|\.)((chrome|browser)\.)?cookies\.onChanged\.addListener$
- id: cookies-removed-change-handler
  desc: Handles removed-cookie change event
  conf: 0.9
  if:
    type: text
    regex: cookies\.onChanged\.addListener[\s\S]{0,800}\.removed\b

composite_rules:
- id: webextension-cookie-export
  desc: Exports browser cookies in Netscape format
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
  - id: micro-behaviors/communications/http/cookies::netscape-cookie-file-header
- id: webextension-cookie-clipboard-transfer
  desc: Transfers browser cookies through clipboard
  crit: notable
  conf: 0.96
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
  - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-set
  - id: micro-behaviors/data/encode/base64::btoa-symbol
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
- id: broad-host-extension-cookie-enumeration
  desc: Broad-host extension enumerates cookies
  crit: notable
  conf: 0.9
  for:
  - chrome-manifest
  - javascript
  - typescript
  - crx
  - xpi
  - zip
  scope: archive
  all:
  - id: metadata/file/format/browser-extension::is-chrome-manifest
  - id: metadata/permission/host::broad-host-access
  - id: metadata/permission/cookie::permission-cookies
  - id: metadata/package/entrypoint/extension::background-service-worker
  - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
  any:
  - id: metadata/permission/download::permission-downloads
  - id: metadata/permission/network::web-request
  - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-on-changed-listener
