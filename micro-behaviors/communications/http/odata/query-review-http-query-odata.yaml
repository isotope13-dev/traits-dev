defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - html
  - json
  crit: notable
  conf: 0.72

traits:
  - id: odata-next-page-link
    desc: References the OData next-page link field
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: '@odata.nextLink'

  - id: odata-filter-or-select-query
    desc: OData filter or select query field
    if:
      type: text
      regex: '[?&]\$(filter|select)='

  - id: odata-top-or-orderby-query
    desc: OData top or orderby query field
    if:
      type: text
      regex: '[?&]\$(top|orderby)='

  - id: odata-expand-query
    desc: OData expand query field
    if:
      type: text
      regex: '[?&]\$expand='




composite_rules:
  - id: odata-query-marker
    desc: References OData query parameters
    any:
      - id: micro-behaviors/communications/http/odata::odata-filter-or-select-query
      - id: micro-behaviors/communications/http/odata::odata-top-or-orderby-query
      - id: micro-behaviors/communications/http/odata::odata-expand-query
