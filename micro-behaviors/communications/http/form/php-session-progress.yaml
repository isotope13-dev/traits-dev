defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, data]

traits:
  - id: php-session-upload-progress-field
    desc: PHP session upload progress form field
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'name\s*=\s*\\?"PHP_SESSION_UPLOAD_PROGRESS\\?"'

  # The multipart name above matches only the wire form. Exploit tools and
  # scanners in any language carry the PHP-mandated field name as a bare token
  # (dict key, constant, header literal), which the request serializer later
  # emits. The name is fixed by the engine, so this generalizes across variants.
  - id: php-session-upload-progress-token
    desc: PHP session upload progress field name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: PHP_SESSION_UPLOAD_PROGRESS
