defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1071.001

traits:
  - id: python-multipart-files-map
    desc: Python multipart files-map assignment
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\bfiles\s*=\s*\{'
  - id: python-multipart-empty-name-tuple
    desc: Multipart files list has empty-name tuple
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bfiles\s*=\s*[\[{].{0,500}?\(\s*(""|'''')\s*,'
