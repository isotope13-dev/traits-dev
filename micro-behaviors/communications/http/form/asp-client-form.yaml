defaults:
  platforms: [windows]
  for: [html]
  crit: notable
  conf: 0.97
traits:
  - id: html-form-action-from-input
    desc: Sets form action from operator-supplied input
    if:
      type: text
      regex: 'this\.form\.action\s*=\s*this\.form\.[A-Za-z_]\w*\.value'
  - id: html-form-field-name-from-password
    desc: Names submitted form field from password input
    if:
      type: text
      regex: 'this\.form\.[A-Za-z_]\w*\.name=this\.form\.password\.value'
  - id: html-asp-session-execute-expression
    desc: HTML carries ASP session Execute expression
    conf: 0.98
    if:
      type: text
      regex: '(?i)Execute\(Session\("{2}[^"\r\n]{1,32}"{2}\)\)'
