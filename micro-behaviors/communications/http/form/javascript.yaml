defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: form-data-append
    desc: Appends data to FormData
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\b(FormData|formData|fd)\b[\s\S]{0,120}\.append\('
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: media-webm-form-field
    desc: Appends WebM media to a form field
    crit: notable
    conf: 0.92
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\.append\s*\(\s*["''][^"'']{1,80}["'']\s*,\s*[A-Za-z_$][\w$]*\s*,[\s\S]{0,180}\.webm\b'
  - id: pdf-formdata-fields
    desc: Adds pdf1 and pdf2 fields to FormData
    crit: notable
    conf: 0.95
    count_min: 2
    if:
      type: text
      regex: '\.append\s*\(\s*["'']pdf[12]["'']'
  - id: node-manual-multipart-body
    desc: Builds Node multipart form-data body
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'Content-Disposition: form-data[\s\S]{0,900}multipart/form-data; boundary='
  # A username field in an upload form: login and profile forms do this, and so
  # do stealers tagging an upload with the victim account. Neutral capability
  # on its own; exfiltration composites pair it with a sensitive source.
  - id: form-data-username-field
    desc: Appends username field to FormData
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'FormData[\s\S]{0,80}append\(\s*["'']username["'']'
composite_rules:
  - id: formdata-file-stream
    desc: Attaches a file stream to FormData
    # Notable, matching `form-data-blob-upload` below, which is the same shape
    # with a Blob instead of a stream. The legs prove only that the file builds
    # a multipart upload from a read stream -- the ordinary way any upload
    # client works, and per TAXONOMY.md a transport mechanism on its own is a
    # micro-behavior, not an objective. Pairing it with a sensitive source is
    # what the exfiltration composites do.
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/form::form-data-append
      - id: micro-behaviors/fs/read/stream::create-read-stream
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/runtime::js-webpack-bundle
