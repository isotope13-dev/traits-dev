defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe]
  mbc: C0002
  attack: T1071.001
composite_rules:
  - id: go-url-encoded-form-post
    desc: Go URL-encoded form POST
    conf: 0.88
    # Every leg here is a Go-source matcher (url-values-encode/-form are
    # symbol calls, go-content-type-set is call syntax), so the file's
    # elf/macho/pe default does not apply.
    for: [go]
    all:
      - id: micro-behaviors/communications/http/post::http-post-methods
      - id: metadata/lang/source/syntax/member::go-data-encode-symbol
      - id: micro-behaviors/communications/http/header/content-type::go-content-type-set
    any:
      - id: metadata/lang/source/syntax/member::go-data-set-symbol
      - id: micro-behaviors/communications/http/client/library::go-http-newrequest
