# File-path form and query fields used by HTTP clients. The field alone does
# not prove abuse; exploit composites add traversal and request context.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, data]

traits:
  - id: file-path-field-syntax
    desc: File-path HTTP field syntax
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bfile[._-]?path["'']?\s*[:=]'

  # An upload form that asks the uploader where on the server to write, with a
  # drive root prefilled, is a path chosen by the client rather than the app.
  - id: upload-form-server-path-drive-default
    desc: Upload form with server drive-path field
    crit: notable
    conf: 0.9
    for: [asp, html, vbs]
    if:
      type: text
      regex: '(?i)name="path"\s+value="[a-z]:\\'
