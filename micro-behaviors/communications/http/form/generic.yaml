defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - php
  - html
  - shell
  mbc: C0002
  attack: T1071.001
traits:
- id: multipart-form
  desc: multipart/form-data content type
  conf: 0.6
  for:
  - scripts
  - binaries
  # Preserve existing types and broaden source coverage within the 33-type cap.
  - source
  - -groovy
  - -kotlin
  - -scala
  - -zig
  - -elixir
  - text
  - data
  if:
    type: text
    case_insensitive: true
    substr: multipart/form-data
  unless:
  - id: metadata/file/string/identity::python3-interpreter-basename
  - id: well-known/lib
- id: formdata-class
  desc: Constructs a FormData request body
  conf: 0.75
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: \bnew\s+FormData\s*\(
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/lib
  - id: metadata/package/testing/harness/runtime/
- id: javascript-formdata-file-field
  desc: JavaScript FormData file field
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: new\s+FormData\s*\(\s*\)[\s\S]{0,300}\.append\s*\(\s*["']file["']
composite_rules:
- id: javascript-formdata-file-upload-request
  desc: JavaScript multipart file upload request
  conf: 0.9
  for:
  - javascript
  - typescript
  near_lines: 12
  all:
  - id: javascript-formdata-file-field
  - id: micro-behaviors/communications/http/post::javascript-http-request-post
