defaults:
  platforms: [windows, unix]
composite_rules:
  # Field acquisition, serialization, and POST must co-occur in the same
  # script file. Pooling across archive members causes false positives on
  # extensions that declare an account settings form in one file and a sync client
  # in another.
  - id: script-dom-credential-post
    desc: Credential fields co-occur with JSON POST
    crit: notable
    conf: 0.95
    scope: file
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/ui/window/password-field::browser-credential-field-pair
      - id: micro-behaviors/data/serialize/json::json-stringify-key-password-body
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
