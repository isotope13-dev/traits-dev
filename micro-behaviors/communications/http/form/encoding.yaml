# Form encoding evidence requires no POST method; keep it with HTTP forms.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, php, html, shell]
  mbc: C0002

traits:
  - id: enctype-attr
    desc: HTML form encoding attribute
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: \benctype\s*=
composite_rules:
  - id: form-submission-encoding
    desc: HTTP form encoding references
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: enctype-attr
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
