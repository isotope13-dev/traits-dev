# Form encoding evidence requires no POST method; keep it with HTTP forms.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, php, html, shell]
  mbc: C0002

traits:
  - id: enctype-attr
    desc: HTML form encoding attribute
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: \benctype\s*=
    unless:
      - id: metadata/document/html/
  # The attribute spelling, not the bare media type. File-manager webshell
  # composites need this on plugin PHP that also matches a known library.
  - id: html-multipart-enctype
    desc: HTML form sets multipart encoding
    crit: notable
    conf: 0.9
    for: [php, html, data, text]
    if:
      type: text
      substr: enctype="multipart/form-data"
composite_rules:
  - id: form-submission-encoding
    desc: HTTP form submission encoding
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: enctype-attr
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
    unless:
      # Declaration comments describe accepted wire formats but cannot submit.
      - id: metadata/lang/scripted::dts-declaration-file
      # Ace mode bundles contain syntax tables, not an HTTP client.
      - id: well-known/lib/ui/ace-editor::ace-mode-module
