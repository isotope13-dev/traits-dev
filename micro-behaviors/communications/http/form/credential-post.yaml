# A login form's fields together with the request that carries them.
#
# Pairing a password or one-time-code box with a POST transport nearby is what
# every sign-in page does, so both composites are neutral capability
# observations: "this page submits a password" and "this page submits a
# verification code". They were defined under
# objectives/credential-access/phishing/mfa-relay/, where the directory alone
# labelled an ordinary authentication form a phishing kit. The relay composites
# there still reference them; the phishing inference comes from the legs they
# add — an off-origin collector, a lookalike domain, or a post-auth redirect.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.94

composite_rules:
  - id: browser-credential-post
    desc: Browser password POST
    all:
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-reference
    any:
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    near_bytes: 900

  - id: browser-mfa-post
    desc: Browser MFA POST
    all:
      - id: micro-behaviors/ui/window/form-input::browser-mfa-field-reference
    any:
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    near_bytes: 900

  # Both factors submitted from one page. Ordinary: this is what a sign-in page
  # that prompts for a password and a one-time code looks like.
  - id: browser-two-factor-form-post
    desc: Page submits both password and MFA code fields
    all:
      - id: browser-credential-post
      - id: browser-mfa-post
    near_lines: 180

  # Where a page sends what its form collected. A hardcoded absolute URL means
  # the submission leaves the origin that served the page; a first-party sign-in
  # form posts to a site-relative path instead. Neutral on its own — plenty of
  # applications post to their own API host — but it is the leg that separates a
  # relay from an ordinary login page.
  - id: browser-off-origin-submission-target
    desc: Page submits to a hardcoded absolute URL
    any:
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
      - id: micro-behaviors/communications/http/request/json::fetch-external-url
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
