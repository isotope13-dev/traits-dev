# A login form's fields together with the request that carries them.
#
# Pairing a password or one-time-code box with a POST transport nearby is what
# every sign-in page does, so both composites are neutral capability
# observations: "this page submits a password" and "this page submits a
# verification code". They were defined under
# objectives/credential-access/phishing/mfa-relay/, where the directory alone
# labelled an ordinary authentication form a phishing kit. The relay composites
# there still reference them; the phishing inference comes from the legs they
# add — a lookalike domain, provider handoff, or post-auth redirect.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.94

composite_rules:
  - id: browser-credential-post
    desc: Browser password POST
    all:
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-reference
    any:
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    near_bytes: 900

  - id: browser-mfa-post
    desc: Browser MFA POST
    all:
      - id: micro-behaviors/ui/window/form-input::browser-mfa-field-reference
    any:
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    near_bytes: 900

  # Both factors submitted from one page. Ordinary: this is what a sign-in page
  # that prompts for a password and a one-time code looks like.
  - id: browser-two-factor-form-post
    desc: Page submits both password and MFA code fields
    all:
      - id: browser-credential-post
      - id: browser-mfa-post
    near_lines: 180

  # Where a page sends what its form collected. Source text alone cannot prove
  # that an absolute URL is off-origin: a page may spell out its own origin.
  # Record only the observable hardcoded absolute target here; objectives must
  # supply the context that makes the submission suspicious.
  - id: browser-absolute-submission-target
    desc: Page submits to a hardcoded absolute URL
    any:
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
      - id: micro-behaviors/communications/http/request/json::fetch-external-url
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: browser-login-absolute-form-action
    desc: Login form action targets an absolute URL
    all:
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/ui/window/form-input::browser-password-input-marker
    near_bytes: 900

  - id: browser-two-factor-absolute-post
    desc: Password and MFA form submits to an absolute URL
    all:
      - id: browser-two-factor-form-post
      - id: browser-absolute-submission-target
    near_lines: 180

  - id: browser-credential-absolute-fetch-js
    desc: JavaScript submits login fields to an absolute URL
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
      - id: browser-absolute-submission-target
    any:
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    near_bytes: 500

  - id: browser-credential-absolute-fetch-html
    desc: HTML script submits login fields to an absolute URL
    for: [html]
    all:
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
      - id: browser-absolute-submission-target
    any:
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    near_bytes: 500
