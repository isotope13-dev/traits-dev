defaults:
  for: [html, php]
  platforms: [windows, unix]
  crit: notable
  conf: 0.94
traits:
  # The static-markup twin of the mail-script atom: the form submits to a
  # same-directory PHP receiver (`action="index.php"`) instead of an
  # absolute endpoint. Shared-hosting kits exfiltrate to a sibling script
  # this way, but so do ordinary contact and comment forms, so the
  # receiver alone stays notable and the phishing composites add the
  # credential evidence that convicts the harvest. The `not:` filters drop
  # absolute and root-relative receivers from the match.
  - id: relative-php-form-action
    desc: Form action names a relative PHP receiver
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\baction\s*=\s*["'']?[^"''<>\s]{0,80}\.php\b'
    not:
      # A scheme remains absolute with a malformed single slash (http:/),
      # and non-HTTP schemes must not be labeled relative either.
      - regex: '(?i)=\s*["'']?[a-z][a-z0-9+.-]*:'
      - regex: '=\s*["'']?/'
      # Percent-encoded markup fed to unescape() (`https%3A%2F%2F...`)
      # decodes to an absolute or root-relative receiver.
      - regex: '(?i)=\s*["'']?([a-z][a-z0-9+.-]*%3A|%2F)'
