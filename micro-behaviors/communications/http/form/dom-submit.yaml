defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.85

traits:
  # One signal, not two: the previous pair differed only in quote style and
  # carried the same description, splitting one behaviour across two ML
  # features. Anchoring on `document.` also missed `form.addEventListener(
  # 'submit', ...)`, which is how most pages — and most form grabbers — hook
  # a submission.
  - id: form-submit-listener
    desc: Registers a form submit event listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: submit
