# Paired `new_password` and `retype_password` form fields appear in HTTP
# password-change submissions and clients. Neutral on their own; CVE-2026-116606
# abuses password-change error handling to reach unauthenticated CGI handlers.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]

traits:
  - id: new-password-form-field
    desc: Form field token new_password
    crit: component
    conf: 0.7
    if:
      type: text
      word: new_password

  - id: retype-password-form-field
    desc: Form field token retype_password
    crit: component
    conf: 0.85
    if:
      type: text
      word: retype_password

composite_rules:
  - id: password-retype-form-fields
    desc: Pairs new_password and retype_password fields
    crit: notable
    conf: 0.92
    near_bytes: 320
    all:
      - id: new-password-form-field
      - id: retype-password-form-field
