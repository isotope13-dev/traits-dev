defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # This is a browser FormData shape, not evidence that the destination is
  # Google Apps Script.  Service-specific endpoint evidence belongs with the
  # Apps Script traits; this capability is useful independently for ordinary
  # application forms and feedback flows.
  - id: formdata-user-submission-fields
    desc: FormData carries name/email or rating fields
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)FormData.{0,300}(name.{0,150}email|rating)'
