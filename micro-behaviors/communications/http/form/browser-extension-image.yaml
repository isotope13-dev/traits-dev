defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1041

traits:
- id: image-formdata-fields
  desc: "Image-named FormData fields"
  crit: notable
  conf: 0.9
  ref: sha256:4fcdbf8912196b7e1541615dc3c51b0715aa125d1a223387055231551d255e70
  for: [javascript, typescript]
  if:
    type: text
    regex: '\.append\(["''](selfieImage|clothingImage)["'']'
- id: upload-user-id-fields
  desc: "Identifier-named FormData fields"
  crit: notable
  conf: 0.9
  ref: sha256:4fcdbf8912196b7e1541615dc3c51b0715aa125d1a223387055231551d255e70
  for: [javascript, typescript]
  if:
    type: text
    regex: '\.append\(["''](uid|blobId)["'']'
composite_rules:
- id: image-formdata-with-user-id
  desc: "Image and identifier FormData fields"
  crit: suspicious
  conf: 0.93
  ref: sha256:4fcdbf8912196b7e1541615dc3c51b0715aa125d1a223387055231551d255e70
  near_bytes: 1800
  all:
  - id: micro-behaviors/communications/http/form::formdata-class
  - id: micro-behaviors/communications/http/form::image-formdata-fields
  - id: micro-behaviors/communications/http/form::upload-user-id-fields
