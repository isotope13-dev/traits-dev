defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.97
traits:
  - id: wordpress-admin-php-form-action
    desc: Form action targets WordPress admin PHP
    if:
      type: text
      regex: '\baction=["'']https?://[^/"'']{1,120}/wp-admin/[^"'']{1,120}\.php["'']'
    not:
      # These are WordPress's ordinary plugin form and AJAX dispatchers.
      - regex: '/wp-admin/admin-(ajax|post)\.php'
