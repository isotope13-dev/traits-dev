defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: native-generated-file-multipart-submit
    desc: Submits a newly written file through multipart
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule native_generated_file_multipart_submit {
          strings:
            $mut = { 8B 1D ?? ?? ?? ?? BE 01 00 00 00 03 1D ?? ?? ?? ?? 83 C4 10 E8 ?? ?? ?? ?? 88 44 1E FF 46 83 FE ?? 75 ?? 8D 75 ?? 51 51 68 ?? ?? ?? ?? 56 E8 ?? ?? ?? ?? 89 C3 83 C4 10 B8 01 00 00 00 85 DB 0F 84 ?? ?? ?? ?? 53 FF 35 ?? ?? ?? ?? 6A 01 FF 35 ?? ?? ?? ?? E8 ?? ?? ?? ?? }
            $form = { 6A 11 56 8D 75 ?? 6A 0A 68 ?? ?? ?? ?? 6A 01 56 53 E8 ?? ?? ?? ?? }
            $post = { FF 75 ?? 68 28 27 00 00 53 E8 ?? ?? ?? ?? 83 C4 0C 6A 01 6A 29 53 E8 ?? ?? ?? ?? 89 1C 24 E8 ?? ?? ?? ?? }
          condition:
            pe.is_pe and pe.machine == pe.MACHINE_I386 and
            all of them and
            @mut < @form and @form < @post and
            @post - @mut < 512 and
            int8(@form+5) + 4 == int8(@post+2) and
            @form+22+int32(@form+18) == pe.export_details[pe.exports_index("curl_formadd")].offset and
            @post+14+int32(@post+10) == pe.export_details[pe.exports_index("curl_easy_setopt")].offset and
            @post+27+int32(@post+23) == pe.export_details[pe.exports_index("curl_easy_setopt")].offset and
            @post+35+int32(@post+31) == pe.export_details[pe.exports_index("curl_easy_perform")].offset
        }
