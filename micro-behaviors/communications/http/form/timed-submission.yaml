defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: timer-adjacent-submit-call
    desc: Timer followed by object submit invocation
    if:
      type: text
      exclude_html_comments: true
      regex: "(?s)setTimeout\\([^;]{1,100}\\);\\s*[\\w$]+\\.submit\\s*\\("
  - id: email-field-generator-assignment
    desc: Assigns generated email form value
    if:
      type: text
      exclude_html_comments: true
      regex: "(?i)\\.(mailaddr|email)\\.value\\s*=\\s*[\\w$]+\\(\\)"
  - id: named-form-target-assignment
    desc: Assigns named browsing context as form target
    if:
      type: text
      exclude_html_comments: true
      regex: "\\.target\\s*=\\s*[\"\\x27][\\w-]{1,40}[\"\\x27]"
