defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.96

traits:
  - id: buddypress-delete-confirm-field
    desc: BuddyPress account-deletion confirmation field
    if:
      type: string_literal
      exact: delete-account-understand

  - id: buddypress-delete-confirm-field-unicode
    desc: Escaped BuddyPress deletion field
    if:
      type: encoded
      encoding: unicode-escape
      substr: delete-account-understand

  - id: wordpress-account-email-field
    desc: WordPress account email form field
    if:
      type: string_literal
      exact: account_email

  - id: wordpress-account-email-field-unicode
    desc: Unicode-escaped WordPress account email field
    if:
      type: encoded
      encoding: unicode-escape
      substr: account_email

  - id: wordpress-account-details-nonce-field
    desc: WordPress account-details nonce field
    if:
      type: string_literal
      exact: save-account-details-nonce

  - id: wordpress-account-details-nonce-field-unicode
    desc: Escaped WordPress account nonce field
    if:
      type: encoded
      encoding: unicode-escape
      substr: save-account-details-nonce

composite_rules:
  - id: buddypress-delete-confirm-field-any
    desc: Uses BuddyPress account-deletion confirmation field
    any:
      - id: buddypress-delete-confirm-field
      - id: buddypress-delete-confirm-field-unicode

  - id: wordpress-account-email-field-any
    desc: Uses WordPress account email form field
    any:
      - id: wordpress-account-email-field
      - id: wordpress-account-email-field-unicode

  - id: wordpress-account-details-nonce-field-any
    desc: Uses WordPress account-details nonce field
    any:
      - id: wordpress-account-details-nonce-field
      - id: wordpress-account-details-nonce-field-unicode
