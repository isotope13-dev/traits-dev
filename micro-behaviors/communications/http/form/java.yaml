defaults:
  platforms: [unix, windows]
  for: [class]

traits:
  - id: jvm-okhttp-multipart-builder-class-ref
    desc: JVM multipart body builder reference
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.class_refs[*]
      exact: okhttp3/MultipartBody$Builder

composite_rules:
  - id: jvm-json-multipart-post-references
    desc: JVM JSON serialization and multipart POST references
    crit: notable
    conf: 0.96
    all:
      - id: jvm-okhttp-multipart-builder-class-ref
      - id: micro-behaviors/communications/http/post::jvm-okhttp-post-method-reference
      - id: micro-behaviors/data/serialize/json::jvm-gson-serialization-method-reference
