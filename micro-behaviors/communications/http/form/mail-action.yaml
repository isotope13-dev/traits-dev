defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: mail-send-form-action
    desc: Assigns send-mail URL to form action
    if:
      type: text
      exclude_html_comments: true
      regex: "(?i)\\.action\\s*=\\s*[\"\\x27]https?://[^\"\\s]{1,120}/send[_-]?mail\\.(asp|php)"
