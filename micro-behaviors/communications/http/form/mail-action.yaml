defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: mail-send-form-action
    desc: Assigns send-mail URL to form action
    if:
      type: text
      exclude_html_comments: true
      regex: "(?i)\\.action\\s*=\\s*[\"\\x27]https?://[^\"\\s]{1,120}/send[_-]?mail\\.(asp|php)"
  # The sibling above owns script-assigned absolute send-mail URLs. This
  # owns the static markup form: `action="mail.php"`. Phish kits exfiltrate
  # to a sibling mailer script, but so do ordinary contact forms, so the
  # endpoint alone stays notable and composites convict the harvest.
  - id: mail-php-form-action
    desc: Form action posts to a mail script
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\baction\s*=\s*["'']?[^"''<>\s]{0,120}mail\.php["''\s>]'
