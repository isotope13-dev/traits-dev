defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]

traits:
  - id: multipart-file-array-field
    desc: Form file-array field name
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: file[]
  - id: multipart-empty-filename
    desc: Multipart file part has an empty filename
    crit: component
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?im)filename\s*=\s*""\s*$'

  # Server-executable extensions are useful structure for triage, but uploads
  # of deployment artifacts can be legitimate. The atoms remain separated by
  # runtime family to keep each pattern small and reusable.
  - id: multipart-php-script-filename
    desc: Multipart part names a PHP script
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i);\s*filename\s*=\s*"[^"\r\n]{1,160}\.(php[3-8]?|phtml|pht|phar)"'
  - id: multipart-managed-script-filename
    desc: Multipart part names a managed web script
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i);\s*filename\s*=\s*"[^"\r\n]{1,160}\.(jspx?|aspx?|ashx|asmx|cfm|cfc)"'
  - id: multipart-cgi-script-filename
    desc: Multipart part names a CGI script
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i);\s*filename\s*=\s*"[^"\r\n]{1,160}\.(cgi|pl)"'

  # An upload policy that accepts a server-executable script extension is a
  # concrete, risky capability. It becomes exploitation evidence only when a
  # client also sends a script under that caller-supplied policy.
  - id: dotnet-webclient-uploadvalues
    desc: .NET WebClient.UploadValues form post
    crit: notable
    conf: 0.8
    for: [csharp]
    if:
      type: text
      regex: client\.UploadValues\s*\(

  # `curl -X POST --data-binary @a` -- the request body IS a named local
  # file. Distinct from -F/-T upload flags: this is "send this file's bytes
  # as the payload", the instruction form agent skills use to exfiltrate a
  # bundled or harvested file to an arbitrary endpoint.
