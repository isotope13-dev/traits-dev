defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable

traits:
  - id: plain-text-form-encoding
    desc: Form uses plain text encoding
    if:
      type: text
      regex: '(?i)<form\b[^>]{0,240}\benctype\s*=\s*["'']text/plain["'']'
      exclude_html_comments: true

  - id: json-object-input-name
    desc: Input name begins a JSON object
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,160}\bname\s*=\s*''\{\s*"[^"\r\n]{1,60}"\s*:'
      exclude_html_comments: true
