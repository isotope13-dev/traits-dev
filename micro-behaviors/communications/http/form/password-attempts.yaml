defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: xhr-send-password-attempt-pair
    desc: Script sends numbered password attempt pair
    if:
      type: text
      regex: '\.send\([^;]{0,100}&pass(word)?1=[^;]{0,100}&pass(word)?2='
  - id: xhr-send-then-display-error
    desc: XHR send followed by forced error display
    if:
      type: text
      regex: '\.send\([^;]{1,160}\);[^{}]{0,240}\.className\s*=\s*["'']error active["'']'
