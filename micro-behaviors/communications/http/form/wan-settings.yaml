# Real protocol fields described in the setWAN advisory. These observations
# identify settings-form structure; neither one establishes exploitation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: wan-mode-form-field
    desc: WAN mode configuration field
    if:
      type: text
      regex: '\bwanMode["'']?\s*[:=]\s*["'']?[0-9]{1,2}\b'

  - id: submit-url-return-path-field
    desc: Form submit-url field contains return path
    if:
      type: text
      regex: '\bsubmit-url["'']?\s*[:=]\s*["'']?/[A-Za-z0-9_./-]{1,64}'
