defaults:
  platforms: [windows, unix, android]
  for:
    - java
    - class
    - jar
    - zip

traits:
  - id: jvm-multipart-form-disposition
    desc: JVM multipart form disposition
    crit: notable
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)Content-Disposition: form-data;'
  - id: jvm-multipart-image-filename
    desc: JVM multipart image filename
    crit: notable
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)filename="[^"]{1,120}\.(jpe?g|png|bmp)"'
composite_rules:
  - id: jvm-multipart-image-form-field
    desc: JVM multipart image file field
    crit: notable
    conf: 0.94
    for: [class, jar, zip]
    scope: file
    all:
      - id: micro-behaviors/communications/http/form::jvm-multipart-form-disposition
      - id: micro-behaviors/communications/http/form::jvm-multipart-image-filename
