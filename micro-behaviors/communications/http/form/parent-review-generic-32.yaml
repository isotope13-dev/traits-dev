traits:
- platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  - typescript
  - php
  - batch
  - makefile
  - text
  id: html-form-post-method
  desc: HTML form declares the POST method
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: <form\b[^>]{0,180}method\s*=\s*["']?post\b
    case_insensitive: true
