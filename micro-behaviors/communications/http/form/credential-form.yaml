defaults:
  platforms: [windows, unix]
  for: [python, powershell]
  crit: notable
  conf: 0.92
  attack: T1071.001

composite_rules:
  - id: python-variable-credential-form-post
    desc: Python posts variable username and password fields
    for: [python]
    near_lines: 30
    all:
      - id: micro-behaviors/data/serialize/object::python-variable-credential-object
      - id: micro-behaviors/communications/http/lib/requests::requests-post

  - id: powershell-variable-credential-form-post
    desc: PowerShell posts variable username and password fields
    for: [powershell]
    near_lines: 30
    all:
      - id: micro-behaviors/data/serialize/object::powershell-variable-credential-object
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::ps-post
