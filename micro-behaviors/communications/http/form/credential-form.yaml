defaults:
  platforms: [windows, unix]
  for: [python, powershell]
  crit: notable
  conf: 0.92
  attack: T1071.001

traits:
  - id: python-username-variable-form-field
    desc: Python username field uses a variable
    for: [python]
    if:
      type: text
      regex: '["'']user(name)?["'']\s*:\s*(user|username)\b'

  - id: python-password-variable-form-field
    desc: Python password field uses a variable
    for: [python]
    if:
      type: text
      regex: '["'']password["'']\s*:\s*(password|passwd|pwd)\b'

  - id: powershell-username-variable-form-field
    desc: PowerShell username field uses a variable
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*user(name)?\s*=\s*\$(user|username)\b'

  - id: powershell-password-variable-form-field
    desc: PowerShell password field uses a variable
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*password\s*=\s*\$(password|passwd|pwd)\b'

composite_rules:
  - id: python-variable-username-password-form
    desc: Python form maps credential variables
    for: [python]
    near_bytes: 240
    all:
      - id: python-username-variable-form-field
      - id: python-password-variable-form-field

  - id: powershell-variable-username-password-form
    desc: PowerShell form maps credential variables
    for: [powershell]
    near_bytes: 240
    all:
      - id: powershell-username-variable-form-field
      - id: powershell-password-variable-form-field

  - id: python-variable-credential-form-post
    desc: Python posts variable username and password fields
    for: [python]
    near_lines: 30
    all:
      - id: python-variable-username-password-form
      - id: micro-behaviors/communications/http/lib/requests::requests-post

  - id: powershell-variable-credential-form-post
    desc: PowerShell posts variable username and password fields
    for: [powershell]
    near_lines: 30
    all:
      - id: powershell-variable-username-password-form
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::ps-post
