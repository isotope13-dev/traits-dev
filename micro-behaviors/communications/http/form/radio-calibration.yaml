# Calibration form schema, shared by the manufacturing-test handler's fields.
# These are real ATE / EEPROM field names, not evidence of an exploit alone.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: radio-calibration-form-field
    desc: Radio calibration count or EEPROM power field
    if:
      type: text
      regex: '\b(ateTxCount|e2pTx2?Power[1-7])["'']?\s*[:=]'

  - id: eeprom-read-selector-field
    desc: EEPROM read selector form field
    if:
      type: text
      regex: '\breadE2P["'']?\s*[:=]'
