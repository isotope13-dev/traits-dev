# HTML forms whose submission target is an absolute URL ending in a server
# script. Common on the web; a local document that carries one submits to a
# host the document does not belong to.
defaults:
  platforms: [windows, unix]
  for: [rtf, html, text]
  crit: notable
  conf: 0.85

traits:
  - id: form-action-absolute-script-url
    desc: HTML form posts to absolute script URL
    if:
      type: text
      regex: '(?i)<form\b[^>]{0,160}\baction\s?=\s?["'']?https?://[^"''\s>]{3,160}\.(php|aspx?|cgi)\b'

  - id: input-prefilled-email-address
    desc: HTML input prefilled with an email address
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,160}\bvalue\s?=\s?["'']?[\w.+-]{1,64}@[a-z0-9-]{1,63}\.[a-z.]{2,24}\b'
