defaults:
  for: [javascript, html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.85

traits:
  # Any `form.submit()` / `form['submit']()` call on a receiver expression.
  # Nothing here shows the form was built by script or where it posts; pages of
  # every kind submit forms.
  - id: form-submit-method-call
    desc: Calls a form submit method
    if:
      type: text
      regex: '[\w$)\]]\s*(\.submit|\[[''"]submit[''"]\])\s*\(\s*\)'
