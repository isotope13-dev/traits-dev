# Upload-metadata destination fields used by form-upload handlers that store
# a validated temporary file and then place it at a client-supplied
# destination (for example a "file" path paired with a "url" inside one
# metadata object). The fields alone do not prove abuse; exploit
# composites add the validated-image/executable-destination pairing and
# the upload context.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, json, data]

traits:
  - id: temporary-file-uploads-field
    desc: Temporary-file-upload metadata field
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: temporaryFileUploads

  - id: upload-image-file-member
    desc: Upload metadata names an image file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']file["'']\s*:\s*["''][^"'']{1,120}\.(gif|png|jpe?g)["'']'

  - id: upload-php-url-member
    desc: Upload metadata URL has PHP-family suffix
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']url["'']\s*:\s*["''][^"'']{1,120}(\.|%2e)(php[0-9s]?|pht(ml|m)?)["''?#]'

  - id: upload-encoded-php-url-member
    desc: Upload URL carries percent-encoded PHP suffix
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']url["'']\s*:\s*["''][^"'']{1,120}\.%70(hp|%68%70)["''?#]'

  - id: upload-double-encoded-php-url-member
    desc: Upload URL carries double-encoded PHP suffix
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']url["'']\s*:\s*["''][^"'']{1,120}\.%2570%2568%2570["''?#]'

composite_rules:
  - id: upload-executable-url-member
    desc: Upload metadata URL has PHP-family suffix
    crit: notable
    conf: 0.92
    any:
      - id: upload-php-url-member
      - id: upload-encoded-php-url-member
      - id: upload-double-encoded-php-url-member

