# Upload-metadata destination fields used by form-upload handlers that store
# a validated temporary file and then place it at a client-supplied
# destination (for example a "file" path paired with a "url" inside one
# metadata object). The fields alone do not prove abuse; exploit
# composites add the validated-image/executable-destination pairing and
# the upload context.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, json, data]

traits:
  - id: temporary-file-uploads-field
    desc: Temporary-file-upload metadata field
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: temporaryFileUploads

  - id: upload-image-file-member
    desc: Upload metadata names an image file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']file["'']\s*:\s*["''][^"'']{1,120}\.(gif|png|jpe?g)["'']'

  - id: upload-executable-url-member
    desc: Upload metadata URL ends executable
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']url["'']\s*:\s*["''][^"'']{1,120}(\.|%2e)(php[0-9]?|phtml|%70hp)["''?#]'

composite_rules:
  # The trust-boundary violation at the heart of validated-upload RCE: the
  # server checks one member (an image path that passed MIME validation)
  # while the co-submitted destination member carries a server-executable
  # extension, so the validated bytes land at an executable path. Match the
  # paired wire structure, never a product route or parameter name.
  - id: image-file-with-executable-url
    desc: Image file paired with executable URL
    crit: suspicious
    conf: 0.95
    all:
      - id: upload-image-file-member
      - id: upload-executable-url-member
    near_bytes: 600
