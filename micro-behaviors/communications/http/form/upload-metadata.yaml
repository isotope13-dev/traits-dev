# Upload metadata is declarative; suffixes do not prove storage or execution.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, json, data]

traits:
  - id: temporary-file-uploads-field
    desc: Temporary-file-upload metadata field
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: temporaryFileUploads

  - id: upload-image-file-member
    desc: File member names an image-suffixed path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']file["'']\s*:\s*["''][^"'']{1,120}\.(gif|png|jpe?g)["'']'

  - id: upload-php-url-member
    desc: URL member has potential PHP script suffix
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']url["'']\s*:\s*["''][^"'']{1,120}(\.|%2e)(php[0-9]?|pht(ml|m)?)["''?#]'

  - id: upload-encoded-php-url-member
    desc: URL member carries percent-encoded PHP suffix
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']url["'']\s*:\s*["''][^"'']{1,120}\.%70(hp|%68%70)["''?#]'

  - id: upload-double-encoded-php-url-member
    desc: URL member carries double-encoded PHP suffix
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']url["'']\s*:\s*["''][^"'']{1,120}\.%2570%2568%2570["''?#]'

  - id: upload-php-source-url-member
    desc: URL member has PHP source-display suffix
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)["'']url["'']\s*:\s*["''][^"'']{1,120}\.phps["''?#]'

composite_rules:
  - id: upload-php-script-url-member
    desc: URL member has potential PHP script suffix
    crit: notable
    conf: 0.92
    any:
      - id: upload-php-url-member
      - id: upload-encoded-php-url-member
      - id: upload-double-encoded-php-url-member


  # Nearby members are co-occurrence evidence, not a proven source/sink flow.
  - id: image-file-with-php-script-url
    desc: Upload metadata co-occurs with image/PHP paths
    crit: suspicious
    conf: 0.9
    all:
      - id: temporary-file-uploads-field
      - id: upload-image-file-member
      - id: upload-php-script-url-member
    near_bytes: 600
