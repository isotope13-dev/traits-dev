defaults:
  platforms: [unix, windows]
  mbc: C0002
  attack: T1071.001

traits:
  - id: form-data-header
    desc: HTTP multipart form-data header
    crit: notable
    conf: 0.5
    for: [binaries, c, cpp, csharp, rust, go, python, php]
    if:
      type: text
      substr: 'Content-Disposition: form-data'

  - id: multipart-file-field-disposition
    desc: Multipart file-upload field disposition
    crit: notable
    conf: 0.92
    for: [python, go, rust, javascript, typescript, csharp]
    not:
      - regex: '^\s*(//|/\*|\*|#)'
    if:
      type: text
      regex: '(?i)(form-data;\s*name="file"|files\s*=\s*\{[''"]file[''"])'
