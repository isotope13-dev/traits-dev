# Client-supplied upload identifier fields used by form-upload handlers to
# build per-submission temporary directories (for example Grav's
# tmp/forms/<session_id>/<__unique_form_id__>). The field alone does not
# prove abuse; exploit composites add traversal and upload context.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, data]

traits:
  - id: form-upload-identifier-field
    desc: Form upload identifier field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)unique[_-]*form[_-]*id'
