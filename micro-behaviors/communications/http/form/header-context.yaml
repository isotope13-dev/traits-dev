# Multipart syntax does not establish upload direction or a file transfer.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, rust, pe, elf]
  mbc: C0002
  attack: T1071.001
composite_rules:
  - id: multipart-header-syntax
    desc: Multipart content or boundary header syntax
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/data/format/mime::boundary-param
      - id: micro-behaviors/communications/http/header/custom::form-data-header
  - id: multipart-header-context
    desc: Multipart syntax with HTTP header context
    crit: notable
    conf: 0.78
    all:
      - id: multipart-header-syntax
    any:
      - id: micro-behaviors/communications/http/header/custom::content-length-template
      - id: micro-behaviors/data/format/mime::mime-octet-stream
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
    needs: 2
