# Windows WebAuthenticationBroker exposes an OAuth callback to the calling
# AppX host. These are neutral API/protocol observations; credential-access
# composites add the first-party client impersonation and forwarding context.
defaults:
  platforms: [windows]
  for: [powershell, javascript, typescript, html, csharp, cpp, pe, dll]
  crit: notable
  conf: 0.97

traits:
  - id: web-authentication-broker-class
    desc: Windows WebAuthenticationBroker class reference
    if:
      type: text
      substr: Windows.Security.Authentication.Web.WebAuthenticationBroker

  - id: authenticate-async-method-call
    desc: Calls authenticateAsync object method
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\.authenticateAsync\s*\('

  - id: oauth-native-oob-redirect-uri
    desc: Uses OAuth native out-of-band redirect
    if:
      type: text
      substr: urn:ietf:wg:oauth:2.0:oob

  - id: response-data-member-read
    desc: Reads responseData object member
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.[ \t]*responseData\b'

composite_rules:
  - id: winrt-web-authentication-broker-call
    desc: Invokes Windows WebAuthenticationBroker
    crit: notable
    conf: 0.99
    near_bytes: 1400
    all:
      - id: web-authentication-broker-class
      - id: authenticate-async-method-call

  - id: web-auth-broker-response-data-read
    desc: Reads WebAuthenticationBroker callback
    crit: notable
    conf: 0.98
    near_bytes: 1800
    all:
      - id: winrt-web-authentication-broker-call
      - id: response-data-member-read
