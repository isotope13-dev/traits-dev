# Microsoft Power Pages / Dataverse portal API mechanics.
# These are neutral protocol and configuration observations; abuse intent is
# inferred by composites under objectives/exfiltration/http/query.
defaults:
  platforms: [windows, unix]
  for: [scripts, html, json]
  attack: T1071.001

traits:
  - id: power-pages-web-api-entity-route
    desc: Power Pages Dataverse Web API entity route
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '/_api/([A-Za-z][A-Za-z0-9_]*|\$\{[^}]{1,80}\})'

  - id: power-pages-legacy-odata-route
    desc: Power Pages legacy OData route
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '/_odata\b'

  - id: power-pages-web-api-site-setting
    desc: Power Pages Web API table site setting
    crit: notable
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '^Webapi/[A-Za-z][A-Za-z0-9_]*/(enabled|fields)$'
      case_insensitive: true

  - id: dataverse-odata-etag-annotation
    desc: Dataverse OData ETag annotation
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: '@odata.etag'

  - id: dataverse-odata-formatted-value-annotation
    desc: Dataverse OData formatted-value annotation
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: '@OData.Community.Display.V1.FormattedValue'

  - id: dataverse-odata-lookup-annotation
    desc: Dataverse OData lookup annotation
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: '@Microsoft.Dynamics.CRM.lookuplogicalname'

  - id: dataverse-odata-pagination-link
    desc: Dataverse OData pagination link
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: '@odata.nextLink'

composite_rules:
  - id: dataverse-odata-annotation
    desc: Dataverse OData response annotation
    crit: notable
    conf: 0.98
    any:
      - id: dataverse-odata-etag-annotation
      - id: dataverse-odata-formatted-value-annotation
      - id: dataverse-odata-lookup-annotation
