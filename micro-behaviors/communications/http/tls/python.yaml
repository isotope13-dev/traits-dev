# A selectable insecure option does not establish that it was selected.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.95
traits:
- id: explicit-insecure-tls-option
  desc: Exposes explicit insecure TLS option
  conf: 0.95
  if:
    type: text
    regex: '--ssl-insecure|if\s+not\s+(self\.)?verify\s*:'
