# Warning filters do not change certificate or hostname verification.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: urllib3-disable-warnings-call
    desc: Suppresses urllib3 warning messages
    if:
      type: symbol
      kind: call
      regex: '^(requests\.packages\.)?urllib3\.disable_warnings$'

  - id: insecure-request-warning-filter
    desc: Suppresses insecure request warning messages
    if:
      type: symbol
      kind: call
      exact: disable_warnings
      arg:
        kind: identifier
        name: InsecureRequestWarning

composite_rules:
  - id: urllib3-warning-suppression
    desc: Suppresses urllib3 request warning messages
    any:
      - id: urllib3-disable-warnings-call
      - id: insecure-request-warning-filter
