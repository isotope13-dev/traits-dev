# Warning filters do not change certificate or hostname verification.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: explicit-insecure-tls-option
    desc: Exposes explicit insecure TLS option
    conf: 0.95
    if:
      # Two shapes of "the caller asked for this": the CLI switch, and a
      # transport backend disabling verification inside a guard on its own
      # verify flag. Implementing the option does not select insecure mode.
      type: text
      regex: '--ssl-insecure|if\s+not\s+(self\.)?verify\s*:'

  - id: urllib3-disable-warnings-call
    desc: Suppresses urllib3 warning messages
    if:
      type: symbol
      kind: call
      regex: '^(requests\.packages\.)?urllib3\.disable_warnings$'

  - id: insecure-request-warning-filter
    desc: Suppresses insecure request warning messages
    if:
      type: symbol
      kind: call
      exact: disable_warnings
      arg:
        kind: identifier
        name: InsecureRequestWarning

composite_rules:
  - id: urllib3-warning-suppression
    desc: Suppresses urllib3 request warning messages
    any:
      - id: urllib3-disable-warnings-call
      - id: insecure-request-warning-filter
