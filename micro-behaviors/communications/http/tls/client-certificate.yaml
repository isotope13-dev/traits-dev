defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  # Relocated unchanged from the device-adoption objective. This is a generic
  # option-setting observation; the structured Python rule below is required
  # for the AIA objective so comments and cert=None cannot supply its send leg.
  - id: client-certificate-option-text
    desc: HTTP-style call sets certificate option
    for: [python, javascript, typescript, go, rust, c, cpp, java]
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b[a-z_]\w*\.(get|post|put|patch)\s*\([^)]{0,180}\bcert\s*='

  - id: python-requests-client-certificate
    desc: Requests call supplies client certificate
    if:
      type: symbol
      kind: call
      regex: '^requests\.(get|post|request)$'
      arg:
        from:
          field: cert
          value: '\S'

composite_rules:
  - id: client-certificate-request
    desc: HTTP request supplies client certificate
    for: [python, shell]
    any:
      - id: python-requests-client-certificate
      - id: curl-client-cert-key
