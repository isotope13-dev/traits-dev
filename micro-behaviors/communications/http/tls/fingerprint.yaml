# JA3/JA4 TLS client fingerprints. Anti-bot clients, scrapers, and stealer
# loaders alike embed these to reproduce a browser's ClientHello and defeat
# JA3/JA4-based network detection (curl-impersonate, curl_cffi, tls-client,
# wreq/rnet, uTLS). The literal is the capability; intent belongs to the
# composites that pair it with evasion or exfiltration.
defaults:
  platforms: [unix, windows]
  for: [python, go, rust, javascript, typescript]
  attack: T1001
traits:
  - id: ja4-fingerprint-literal
    desc: JA4 TLS client fingerprint literal
    crit: notable
    conf: 0.95
    # JA4_a_b_c: transport+TLS version+SNI flag, cipher/extension counts, an
    # optional ALPN marker, then two 12-hex truncated hashes.
    if:
      type: text
      regex: '\b[tq]1[23][di]\d{4}(h[12])?_[0-9a-f]{12}_[0-9a-f]{12}\b'
  - id: ja3-fingerprint-hash
    desc: Labeled JA3 TLS fingerprint hash
    crit: notable
    conf: 0.9
    # A JA3 hash is a bare MD5, so the `JA3` label nearby is what makes the
    # constant identifiable rather than any 32-hex digest.
    if:
      type: text
      regex: '(?i)\bja3\b[\s:=]{1,3}(hash[\s:=]{1,3})?[0-9a-f]{32}\b'
