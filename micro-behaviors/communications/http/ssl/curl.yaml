defaults:
  platforms: [windows, unix]
  mbc: C0005
  for: [c, cpp]

traits:
  - id: curl-tls-peer-verification-disabled
    desc: libcurl disables TLS peer verification
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'curl_easy_setopt\s*\([^;\n]{0,140}CURLOPT_SSL_VERIFYPEER\s*,\s*0L'
  - id: curl-tls-host-verification-disabled
    desc: libcurl disables TLS host verification
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'curl_easy_setopt\s*\([^;\n]{0,140}CURLOPT_SSL_VERIFYHOST\s*,\s*0L'
