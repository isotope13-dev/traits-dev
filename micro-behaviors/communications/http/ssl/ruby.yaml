# Ruby OpenSSL TLS verification bypass
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 0.9
  attack: T1553

traits:
- id: openssl-verify-none
  desc: Ruby OpenSSL VERIFY_NONE assignment
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'verify_mode\s*=\s*OpenSSL::SSL::VERIFY_NONE'
