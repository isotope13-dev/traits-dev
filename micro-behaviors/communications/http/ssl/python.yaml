defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  # Everything below disables certificate or hostname verification. Two neutral
  # context-creation traits used to live here too; objectives/evasion/
  # security-bypass/tls references this directory wholesale, so their presence
  # made `ssl.create_default_context()` — the idiom that verifies — report as
  # "TLS validation disabled". They now live in communications/socket/ssl.
  - id: requests-verify-false
    desc: Requests GET/POST/PUT TLS verification off
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: requests\.(get|post|put)\s*\([^\n]{0,200}verify\s*=\s*False

  - id: requests-verify-false-delete
    desc: Requests DELETE/HEAD/PATCH TLS verification off
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: requests\.(delete|head|patch)\s*\([^\n]{0,200}verify\s*=\s*False

  - id: requests-session-verify-false
    desc: Requests session TLS verification off
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*(Session\(\)|session)\.verify\s*=\s*False[ \t]*$'

  - id: unverified-ssl-context
    desc: Disables SSL certificate verification
    crit: notable
    conf: 0.9
    mbc: C0005
    # A transport-security detector compares against "ssl._create_unverified_context"
    # to flag callers; naming the API is not disabling verification.
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
    if:
      type: text
      substr: "_create_unverified_context"
  - id: httpx-verify-false
    desc: httpx client disables TLS verification
    crit: notable
    conf: 0.9
    mbc: C0005
    if:
      type: text
      regex: 'httpx\.(Client|AsyncClient)\s*\([^\n]{0,200}\bverify\s*=\s*False'

  - id: aiohttp-tcpconnector-ssl-false
    desc: aiohttp connector disables TLS verification
    crit: notable
    conf: 0.9
    mbc: C0005
    if:
      type: text
      regex: 'aiohttp\.TCPConnector\s*\([^\n]{0,160}\bssl\s*=\s*False'

  # These are transport mechanics, not attacker intent.  Keep them notable
  # here so an explicit user-selected insecure mode in a legitimate client is
  # visible without becoming an evasion finding by itself.
  - id: pycurl-verify-peer-disabled
    desc: pycurl disables TLS peer verification
    crit: notable
    conf: 0.92
    mbc: C0005
    if:
      type: text
      regex: setopt\s*\([^,)]{0,40}SSL_VERIFYPEER[^,)]{0,40},\s*0\b

  - id: pycurl-verify-host-disabled
    desc: pycurl disables TLS host verification
    crit: notable
    conf: 0.92
    mbc: C0005
    if:
      type: text
      regex: setopt\s*\([^,)]{0,40}SSL_VERIFYHOST[^,)]{0,40},\s*0\b

  - id: explicit-insecure-tls-option
    desc: Exposes explicit insecure TLS option
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: --ssl-insecure
