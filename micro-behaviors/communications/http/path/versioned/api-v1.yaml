defaults:
  platforms: [macos, linux]
  for: [c, objc, elf]
  crit: notable
  conf: 0.9

traits:
  - id: api-v1-beacon-endpoint
    desc: References the /api/v1/beacon HTTP endpoint
    if:
      type: text
      substr: /api/v1/beacon

  - id: api-v1-payload-endpoint
    desc: References the /api/v1/payload HTTP endpoint
    if:
      type: text
      substr: /api/v1/payload

  - id: api-v1-exfil-endpoint
    desc: References the /api/v1/exfil HTTP endpoint
    if:
      type: text
      substr: /api/v1/exfil
