defaults:
  for:
  - cfml
  platforms:
  - unix
  - windows
traits:
- crit: notable
  conf: 0.92
  id: cfml-output-file-read
  desc: CFML output uses a file-read result
  if:
    type: symbol
    kind: call
    exact: cfoutput:expression
    arg:
      index: 0
      from:
        call: ^cffile:read-result$
        through:
        - call: ^(htmlcodeformat|htmleditformat)$
          arguments:
          - 0
- crit: notable
  conf: 0.92
  id: cfcontent-read-result-response
  desc: CFCONTENT uses a file-read result
  if:
    type: symbol
    kind: call
    exact: cfcontent
    arg:
      index: 0
      from:
        field: variable
        call: ^cffile:read-result$
- crit: notable
  conf: 0.92
  id: cftextarea-file-read-value
  desc: CF textarea uses a file-read result
  if:
    type: symbol
    kind: call
    exact: cftextarea
    arg:
      index: 0
      from:
        field: value
        call: ^cffile:read-result$
        through:
        - call: ^(htmlcodeformat|htmleditformat)$
          arguments:
          - 0
