# GraphQL request structure used by GitLab's multi-version compatibility
# feature. These atoms are neutral protocol/schema observations; exploit intent
# is inferred only when the GitLab selector, endpoint, and injected fallback
# field shapes are combined under objectives/execution/exploit/.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]

traits:
  - id: api-route
    desc: GraphQL API route request
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)/api/graphql\b'

  - id: project-full-path-selector
    desc: GraphQL project fullPath selector
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bproject\s*\(\s*fullPath\s*:'

  - id: user-username-selector
    desc: GraphQL user username selector
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\buser\s*\(\s*username\s*:'

  - id: gl-introduced-field
    desc: GitLab version directive applied to field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z0-9_]*\s+@gl_introduced\s*\('

  - id: far-future-version-argument
    desc: Implausibly future semantic version argument
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bversion\s*:\s*["'']([5-9][0-9]|[1-9][0-9]{2,})\.[0-9]+\.[0-9]+["'']'

  - id: destructive-gl-introduced-field
    desc: Destructive method named GitLab version field
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\b(destroy|delete)\s+@gl_introduced\s*\(\s*version\s*:'

  - id: account-state-gl-introduced-field
    desc: Account state method named GitLab version field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\b(deactivate|block|ban)\s+@gl_introduced\s*\(\s*version\s*:'

composite_rules:
  - id: far-future-gl-introduced-field
    desc: Field declares implausibly future GitLab version
    crit: suspicious
    conf: 0.94
    all:
      - id: gl-introduced-field
      - id: far-future-version-argument
    near_bytes: 160
