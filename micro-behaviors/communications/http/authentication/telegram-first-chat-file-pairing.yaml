defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: telegram-first-chat-pairing-and-file-receive
    desc: Telegram bot pairs and accepts files
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule telegram_first_chat_pairing_and_file_receive {
          strings:
            $conditional = "if self.allowed_chat_id and str(self.allowed_chat_id) != chat_id:"
            $receive = "self._handle_incoming_file(chat_id, message)"
            $unpaired = "if not self.allowed_chat_id:"
            $pair = "if text.startswith(\"/start\") or text.startswith(\"/pair\"):"
            $assign = "self.allowed_chat_id = chat_id"
            $path = "save_dest = UPLOAD_DIR / orig_name"
            $write = "save_dest.write_bytes(r.content)"
          condition:
            all of them and @conditional < @receive and @receive < @unpaired and
            @unpaired < @pair and @pair < @assign and @path < @write
        }
