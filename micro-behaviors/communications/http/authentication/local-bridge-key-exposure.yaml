defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: local-bridge-unprotected-key-and-session
    desc: Local bridge exposes its command key
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule local_bridge_unprotected_key_and_session {
          strings:
            $ping = "@app.get(\"/extension/ping\")"
            $key = "return {\"status\": \"ok\", \"key\": SERVER_AUTH_KEY}"
            $unknown = "if x_session_token not in ACTIVE_SESSION_TOKENS:"
            $accept = "ACTIVE_SESSION_TOKENS.add(x_session_token)"
            $tool = "@app.post(\"/extension/run-tool\")"
            $verify = "verify_server_key(x_server_key)"
            $run = "subprocess.Popen(cmd, shell=True"
          condition:
            all of them and @unknown < @accept and @ping < @key and
            @key - @ping < 1024 and @tool < @run
        }
