defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.9
traits:
  - id: go-tls-client-helper-call
    desc: Constructs a client with a TLS helper
    # NewTLSClient's arguments do not establish verification disabling.
    if:
      type: symbol
      kind: call
      regex: '\.NewTLSClient$'
