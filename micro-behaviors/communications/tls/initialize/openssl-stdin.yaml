# TLS client invocation with piped input; no shell execution or successful
# connection is established by this observation alone.
defaults:
  for: [scripts, source]
  platforms: [unix]
  crit: notable
  conf: 0.98
traits:
  - id: pipe-to-openssl-client
    desc: Pipes output into OpenSSL TLS client
    if:
      type: text
      regex: '\|\s*(/usr/bin/)?openssl\s+s_client\b'
