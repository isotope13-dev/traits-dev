# TLS initialization does not establish a connection or disable verification.
defaults:
  platforms:
  - windows
  - linux
  - macos
  crit: notable
  conf: 0.66
  for:
  - elf
  - macho
  - pe
  - c
  - cpp
traits:
- id: tls-prf-master-secret-label
  desc: TLS PRF master secret label
  if:
    type: text
    exact: master secret
- id: tls-prf-key-expansion-label
  desc: TLS PRF key expansion label
  if:
    type: text
    exact: key expansion
- id: tls-handshake-client-finished-label
  desc: TLS handshake client finished label
  if:
    type: text
    exact: client finished
- id: ssl-ctx-new-symbol
  desc: SSL context creation API
  if:
    type: symbol
    exact: SSL_CTX_new
- id: tls-client-method-symbol
  desc: TLS client method API
  if:
    type: symbol
    exact: TLS_client_method
- id: ssl-new-symbol
  desc: SSL object creation API
  if:
    type: symbol
    exact: SSL_new

composite_rules:
- id: native-tls-prf-handshake-label-cluster
  desc: Native TLS PRF and handshake label set
  crit: notable
  conf: 0.98
  platforms: [linux, unix]
  for: [elf]
  all:
  - id: tls-prf-master-secret-label
  - id: tls-prf-key-expansion-label
  - id: tls-handshake-client-finished-label
