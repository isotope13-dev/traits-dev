traits:
- crit: notable
  size_max: 52428800
  id: go-tls-ciphersuites-reference
  desc: Go TLS CipherSuites routine reference
  conf: 0.9
  if:
    type: text
    regex: crypto/tls[./]CipherSuites\b
  unless:
  - id: micro-behaviors/crypto/library/provider::rustls-crate-path
composite_rules:
- crit: component
  size_max: 52428800
  id: go-tls-internals-present
  desc: Go TLS type and routine references
  conf: 0.8
  any:
  - id: metadata/binary/symbols/descriptor::go-tls-internal-serverhello
  - id: metadata/binary/symbols/descriptor::go-tls-internal-peercertificates
  - id: micro-behaviors/communications/tls/initialize::go-handshake-context-reference
  - id: micro-behaviors/communications/tls/initialize::go-tls-ciphersuites-reference
  - id: metadata/lang/runtime::go-runtime-crypto-tls-fragment
defaults:
  for:
  - binaries
  platforms:
  - windows
  - unix
