# SNI selects server certificates; it does not establish proxying or interception.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9

traits:
  - id: javascript-sni-callback-option
    desc: JavaScript configures an SNI callback
    if:
      type: text
      regex: 'SNICallback\s*:'
