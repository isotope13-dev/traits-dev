# TLS setup and socket connection retain their operation-specific homes.
defaults:
  for:
  - python
  crit: notable
  conf: 0.85
traits:
- id: python-ssl-context-wrap-socket
  desc: Wraps a socket in Python TLS context
  platforms:
  - windows
  - unix
  if:
    type: symbol
    kind: call
    regex: (^|\.)(context|ssl_context)\.wrap_socket$
- id: python-wrap-socket-server-hostname
  desc: Python TLS socket server_hostname
  platforms:
  - windows
  - linux
  - macos
  if:
    type: text
    regex: wrap_socket\s*\([^)\n]{0,160}\bserver_hostname\s*=
