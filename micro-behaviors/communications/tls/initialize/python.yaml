# TLS setup does not establish a connection or disabled verification.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  conf: 0.85
traits:
- id: python-ssl-default-context
  desc: Python creates a default TLS context
  if:
    type: symbol
    kind: call
    exact: ssl.create_default_context
