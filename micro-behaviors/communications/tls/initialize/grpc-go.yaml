defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: grpc-go-client-tls-from-file
    desc: Constructs gRPC TLS credentials from CA file
    if:
      type: symbol
      kind: call
      exact: credentials.NewClientTLSFromFile

  - id: grpc-go-server-tls-from-file
    desc: Builds gRPC TLS credentials from keypair files
    if:
      type: symbol
      kind: call
      exact: credentials.NewServerTLSFromFile
