# Node.js TLS pre-shared-key (PSK) setup. PSK ciphersuites authenticate the
# peer by proof of the shared key; no certificate is exchanged, so X.509
# hostname validation is inapplicable. A no-op checkServerIdentity beside a
# pskCallback (typically TLS over an already-connected socket) is required
# plumbing for that mode, not a validation bypass.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
  mbc: C0001
traits:
- id: node-tls-psk-callback
  desc: Node TLS connect supplies a PSK callback
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    substr: pskCallback
composite_rules:
- id: tls-psk-certificate-free-context
  desc: Certificate-free TLS-PSK connection setup
  crit: exception
  conf: 0.9
  all:
  - id: node-tls-psk-callback
  - id: micro-behaviors/communications/socket/ssl::node-check-server-identity-callback
