defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  # Relocated from communications/socket/ssl with matcher and scope intact.
  - id: go-tls-client
    desc: Go crypto/tls client connection wrapper
    if:
      type: symbol
      exact: tls.Client

  - id: go-tls-listener
    desc: Go wraps a listener with TLS
    if:
      type: symbol
      kind: call
      exact: tls.NewListener
