defaults:
  platforms: [windows]
traits:
  - id: powershell-tls12-enum-reference
    desc: PowerShell TLS 1.2 protocol enum reference
    crit: notable
    conf: 0.7
    for: [powershell, pe]
    if:
      type: text
      substr: "[Net.SecurityProtocolType]::Tls12"
  - id: lnk-powershell-tls12-enum-reference
    desc: LNK references TLS 1.2 protocol enum
    crit: notable
    conf: 0.98
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      substr: "[Net.SecurityProtocolType]::Tls12"
