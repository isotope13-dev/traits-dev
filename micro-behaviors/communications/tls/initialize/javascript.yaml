# TLS setup does not establish a connection or disabled verification.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.88
  mbc: C0001
traits:
- id: node-tls-create-secure-context
  desc: Node TLS secure-context creation
  if:
    type: symbol
    kind: call
    regex: ^(tls|Tls|import_tls[0-9]*\.default)\.createSecureContext$
