# Require TLS socket context; startHandshake is not unique to TLS.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin]
  crit: notable
  conf: 0.92

traits:
  - id: java-sslsocket-handshake-source
    desc: Calls handshake on an SSLSocket local
    for: [java]
    if:
      type: tree-sitter
      query: |
        ((program
          (import_declaration (scoped_identifier) @tls)
          (class_declaration body: (class_body
            (method_declaration body: (block
              (local_variable_declaration
                type: (type_identifier) @socket_type
                declarator: (variable_declarator name: (identifier) @socket))
              (expression_statement (method_invocation
                object: (identifier) @receiver
                name: (identifier) @method) @capture))))))
          (#eq? @tls "javax.net.ssl.SSLSocket")
          (#eq? @socket_type "SSLSocket")
          (#eq? @receiver @socket)
          (#eq? @method "startHandshake"))

  # Kotlin's call projection omits receiver calls. Anchor the fallback to a
  # standalone source statement rather than matching quoted API mentions.
  # This only establishes co-occurrence with an SSLSocket reference.
  - id: kotlin-sslsocket-handshake-source
    desc: SSLSocket reference with handshake statement
    for: [kotlin]
    if:
      type: text
      regex: '(?s)SSLSocket\b.{0,800}\n[ \t]*\w+\.startHandshake\s*\(\s*\)'
