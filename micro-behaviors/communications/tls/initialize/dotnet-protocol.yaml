# The setter configures TLS protocol selection. Its name does not establish
# the chosen version or disabled certificate verification.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: dotnet-security-protocol-setter-reference
    desc: .NET TLS protocol-selection setter reference
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: set_SecurityProtocol
      section: .text
