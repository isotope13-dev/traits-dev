defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  # A connection-pool agent is TLS setup, regardless of verification options
  # or the HTTP library that eventually uses it. No fetch data flow is claimed.
  - id: node-https-agent-construction
    desc: Constructs a Node HTTPS connection-pool agent
    if:
      type: symbol
      kind: call
      exact: https.Agent
