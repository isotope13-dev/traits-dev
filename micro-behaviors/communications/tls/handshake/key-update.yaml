defaults:
  for: [python]
  platforms: [linux, macos, windows]
  crit: notable
traits:
  - id: python-openssl-request-key-update
    desc: Requests an OpenSSL peer key update
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SSL_key_update$'
      arg: {index: 1, kind: number, value: 1}

# A large loop near KeyUpdate can be a protocol stress test or an exploit's
# synchronization barrier. Proximity alone establishes neither a TLS flaw nor
# that the call executes inside the loop. Keep that observation as a capability.
composite_rules:
  - id: python-key-update-large-loop
    desc: TLS KeyUpdate call beside a large range loop
    crit: notable
    conf: 0.95
    near_lines: 4
    all:
      - id: python-openssl-request-key-update
      - id: micro-behaviors/data/control-flow/loop/counted::python-range-loop-large-bound
