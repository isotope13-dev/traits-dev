# ServicePointManager / HttpWebRequest certificate-validation callback property.
# Naming the property does not show that validation is disabled -- System.dll
# defines it, and clients install pinning callbacks through it. The accept-all
# forms live in objectives/evasion/security-bypass/tls. Relocated (2026-09)
# from objectives/command-and-control/dropper/delivery/fallback-download.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp]
  crit: notable

traits:
  - id: server-certificate-validation-callback-reference
    desc: References ServerCertificateValidationCallback
    conf: 0.85
    if:
      type: text
      substr: ServerCertificateValidationCallback
