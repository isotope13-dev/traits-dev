# Exchange Web Services email operations. These are capabilities, so the
# malicious interpretation is assembled by objective composites that add
# credential interception or bulk file collection.
defaults:
  for: [csharp, powershell, pe, dll]
  platforms: [windows]

traits:
  - id: certificate-validation-callback-setter
    desc: "Certificate-validation callback setter"
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: set_ServerCertificateValidationCallback
  # RestSharp exposes the same hook as RestClient.RemoteCertificateValidationCallback
  # (no "Server" in the setter name), so the ServicePointManager trait above
  # never sees it. The setter string alone is also the property definition in
  # RestSharp.dll itself; the backing-field atom below marks that definition,
  # and the assignment composite requires a setter with no such field.
  - id: restsharp-remote-certificate-validation-callback-setter
    desc: "RestSharp certificate-validation callback setter"
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: set_RemoteCertificateValidationCallback
  - id: remote-certificate-validation-callback-backing-field
    desc: "Certificate-validation callback backing field"
    crit: component
    conf: 0.95
    if:
      type: text
      exact: "<RemoteCertificateValidationCallback>k__BackingField"
composite_rules:
  # Assignment, not the bypass itself: the handler body (pinning vs accept-all)
  # is not visible to a text matcher in a compiled assembly, so this stays
  # notable like the ServicePointManager reference. It is suppressed in the
  # assembly that defines the property (RestSharp.dll carries the backing
  # field); a caller assembly only references the setter it assigns.
  - id: restsharp-certificate-validation-callback-assignment
    desc: "Assigns RestSharp certificate-validation callback"
    crit: notable
    conf: 0.9
    all:
      - id: restsharp-remote-certificate-validation-callback-setter
    unless:
      - id: remote-certificate-validation-callback-backing-field
  - id: exchange-client-certificate-validation-callback
    desc: "Exchange client certificate-validation callback"
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/tls/verify/callback::certificate-validation-callback-setter
      - id: micro-behaviors/communications/email/access/exchange::exchange-web-services-client
