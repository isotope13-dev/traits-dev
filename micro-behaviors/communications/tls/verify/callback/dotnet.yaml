# Exchange Web Services email operations. These are capabilities, so the
# malicious interpretation is assembled by objective composites that add
# credential interception or bulk file collection.
defaults:
  for: [csharp, powershell, pe, dll]
  platforms: [windows]

traits:
  - id: certificate-validation-callback-setter
    desc: "Certificate-validation callback setter"
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: set_ServerCertificateValidationCallback
composite_rules:
  - id: exchange-client-certificate-validation-callback
    desc: "Exchange client certificate-validation callback"
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/tls/verify/callback::certificate-validation-callback-setter
      - id: micro-behaviors/communications/email/access/exchange::exchange-web-services-client
