defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
- id: powershell-insecure-switch-guard
  desc: Certificate bypass behind an insecure switch
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?is)if\s*\(\s*\$\w*insecure\w*\s*\)[^}]{0,200}ServerCertificateValidationCallback'
- id: powershell-peer-certificate-read
  desc: Reads the request's ServicePoint certificate
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: .ServicePoint.Certificate
- id: powershell-callback-cleared
  desc: Clears the certificate validation callback
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)ServerCertificateValidationCallback\s*=\s*\$null'
composite_rules:
- id: powershell-certificate-inspection-probe
  desc: Certificate inspection with temporary trust-all
  crit: exception
  all:
  - id: powershell-peer-certificate-read
  - id: powershell-callback-cleared
