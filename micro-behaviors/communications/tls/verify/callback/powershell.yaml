defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
- id: powershell-callback-accepts-all-certificates
  desc: PowerShell accepts every server certificate
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?is)ServerCertificateValidationCallback\s*=\s*\{\s*\$?true\s*\}'
  unless:
    # Ansible's win_get_url/win_package modules gate this behind a documented
    # `validate_certs: no` parameter the operator must opt into.
    - id: well-known/app/infrastructure/ansible::ansible-module-source-context
    - id: well-known/app/infrastructure/ansible::ansible-powershell-webrequest-context
    # An installer that skips certificate checks only inside `if ($insecure)`
    # is exposing a documented opt-in switch (default off) to its operator.
    - id: powershell-insecure-switch-guard
    # A probe that accepts every certificate long enough to read the peer's
    # certificate, then clears the callback, is a certificate inspector.
    - id: powershell-certificate-inspection-probe
- id: powershell-insecure-switch-guard
  desc: Certificate bypass behind an insecure switch
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?is)if\s*\(\s*\$\w*insecure\w*\s*\)[^}]{0,200}ServerCertificateValidationCallback'
- id: powershell-peer-certificate-read
  desc: Reads the request's ServicePoint certificate
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: .ServicePoint.Certificate
- id: powershell-callback-cleared
  desc: Clears the certificate validation callback
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)ServerCertificateValidationCallback\s*=\s*\$null'
composite_rules:
- id: powershell-certificate-inspection-probe
  desc: Certificate inspection with temporary trust-all
  crit: exception
  all:
  - id: powershell-peer-certificate-read
  - id: powershell-callback-cleared
