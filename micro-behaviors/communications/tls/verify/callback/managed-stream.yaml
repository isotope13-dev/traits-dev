defaults:
  platforms:
  - windows
  for:
  - csharp
  - pe
  - dll
traits:
- crit: notable
  id: dotnet-server-certificate-validator
  desc: .NET server certificate validator callback
  conf: 0.94
  if:
    type: text
    exact: ValidateServerCertificate
composite_rules:
- crit: notable
  id: dotnet-custom-tls-certificate-validation
  desc: Custom .NET TLS certificate validation
  conf: 0.97
  all:
  - id: micro-behaviors/communications/tls/initialize::dotnet-sslstream-type
  - id: micro-behaviors/communications/tls/verify/callback::dotnet-server-certificate-validator
