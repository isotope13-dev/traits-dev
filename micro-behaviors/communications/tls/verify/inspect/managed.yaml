defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99

traits:
  - id: managed-certificate-raw-data-call
    desc: Reads raw X509 certificate data
    if:
      type: symbol
      kind: call
      exact: System.Security.Cryptography.X509Certificates.X509Certificate.GetRawCertData
