# A connection opened with verification relaxed so the peer certificate can be
# read and reported (expiry, subject names, chain trust) is an inspection probe,
# not a client that talks to the peer over an unverified channel: it waits for
# `secureConnect`, reads the certificate and closes the socket.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: tls-peer-certificate-probe
    desc: Reads peer certificate after secureConnect
    if:
      type: text
      regex: 'secureConnect[\s\S]{0,80}getPeerCertificate\('
