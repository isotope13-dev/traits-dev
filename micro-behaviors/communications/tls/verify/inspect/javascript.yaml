# A connection opened with verification relaxed so the peer certificate can be
# read and reported (expiry, subject names, chain trust) is an inspection probe,
# not a client that talks to the peer over an unverified channel: it waits for
# `secureConnect`, reads the certificate and closes the socket.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: tls-peer-certificate-probe
    desc: Reads peer certificate after secureConnect
    if:
      type: text
      regex: 'secureConnect[\s\S]{0,80}getPeerCertificate\('
  - id: tls-peer-certificate-chain-walk
    desc: Walks peer certificate issuer chain
    if:
      type: text
      regex: 'getPeerCertificate\(true\)[\s\S]{0,900}\.issuerCertificate'

# A certificate-chain downloader (like `openssl s_client -showcerts`) disables
# verification on purpose so it can capture whatever chain the peer presents,
# then writes it out as PEM. The relaxed channel is the point of the tool, but
# the request still goes to the peer, so the TLS finding steps down, not away.
composite_rules:
  - id: tls-peer-certificate-chain-export
    desc: Exports peer certificate chain as PEM
    near_lines: 40
    all:
      - id: tls-peer-certificate-chain-walk
      - id: micro-behaviors/crypto/certificate/usage::pem-begin
