# WinINet security option writes configure connection verification policy.
defaults:
  crit: notable
  conf: 0.94
  platforms: [windows]
  for: [source]

traits:
  - id: wininet-security-flags-option-set
    desc: Sets WinINet INTERNET_OPTION_SECURITY_FLAGS
    if:
      type: text
      regex: '(?i)Internet_?SetOption\w*\s*\([^)]{0,160}Internet_?Option_?Security_?Flags'
