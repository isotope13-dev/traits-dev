defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-session-request-verify-false
    desc: Session request disables TLS verification
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute object: (identifier) @receiver
            attribute: (identifier) @method)
          arguments: (argument_list
            (keyword_argument name: (identifier) @keyword value: (false)))) @request
        (#eq? @receiver "session")
        (#match? @method "^(get|post|put|patch|delete|head|options|request)$")
        (#eq? @keyword "verify"))
    unless:
      - type: function
        exact: session
