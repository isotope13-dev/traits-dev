defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - shell
  - powershell
  - batch
  - pe
  - github-actions
  mbc: C0005
  conf: 0.95
traits:
- id: curl-insecure
  desc: curl disables TLS certificate verification
  if:
    type: text
    regex: \bcurl\b[^\n|;]{0,240}\s(-[A-Za-z]*k[A-Za-z]*\b|--insecure\b)
