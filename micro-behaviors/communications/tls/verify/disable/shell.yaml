defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for: [scripts, source, pe, github-actions]
  mbc: C0005
  conf: 0.95
traits:
- id: curl-insecure
  desc: curl disables TLS certificate verification
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: \bcurl\b[^\n|;&]{0,240}\s(-[A-Za-z]*k[A-Za-z]*\b|--insecure\b)
