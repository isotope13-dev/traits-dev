defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  # Resolve the RIP-relative load to WinHttpSetOption's IAT slot. The
  # nearby R12 call passes option 31 and the same four-byte local initialized
  # with certificate-ignore bits. Option 84 (TLS protocols) alone cannot match.
  - id: x64-winhttp-certificate-ignore-call-setup
    desc: WinHTTP certificate-ignore call setup
    crit: notable
    conf: 0.98
    mbc: C0005
    if:
      type: yara
      source: |
        import "pe"
        rule x64_winhttp_certificate_ignore_call_setup {
          strings:
            $load = { 4C 8B 25 ?? ?? ?? ?? 41 FF D4 }
            $relax = {
              41 B9 04 00 00 00 4C 8D 44 24 ??
              BA 1F 00 00 00 48 89 D9
              C7 44 24 ?? ?? ?? ?? ?? 41 FF D4
            }
          condition:
            pe.is_64bit() and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any l in (1..#load) : (
                @load[l] >= pe.sections[s].raw_data_offset and
                @load[l]+!load[l] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
                for any c in (1..#relax) : (
                  @relax[c] >= @load[l]+!load[l] and @relax[c] <= @load[l]+256 and
                  @relax[c]+!relax[c] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
                  uint8(@relax[c]+10) == uint8(@relax[c]+22) and
                  (uint32(@relax[c]+23)&0x3300) != 0
                ) and
                for any i in (0..pe.number_of_imports-1) : (
                  for any f in (0..pe.import_details[i].number_of_functions-1) : (
                    pe.import_details[i].functions[f].name == "WinHttpSetOption" and
                    pe.sections[s].virtual_address+@load[l]-pe.sections[s].raw_data_offset+
                      7+int32(@load[l]+3) == pe.import_details[i].functions[f].rva
                  )
                )
              )
            )
        }
