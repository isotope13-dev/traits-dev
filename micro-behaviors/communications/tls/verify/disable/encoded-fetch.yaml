defaults:
  platforms: [unix]
  for: [scripts, -php, -perl, -lua, rust, groovy, kotlin, makefile, dockerfile, text, pbxproj]
traits:
  - id: encoded-curl-insecure-tls
    desc: Encoded curl or wget disables TLS verification
    crit: notable
    conf: 0.85
    if:
      type: encoded
      # wget -k converts links; only this option disables certificate checking.
      # The -k cluster must follow whitespace: a bare `-[A-Za-z]*k` also
      # matches long options that merely contain a k (`serve --token ...`
      # after a pipe-to-shell installer reference), which disables nothing.
      # `--insecure` keeps its own alternative.
      regex: '(curl\b.{0,120}\s-([A-Za-z]*k\w*|-insecure)|wget\s.{0,120}--no-check-certificate)\b'
    unless:
      # Minified library bundles can decode to accidental curl -k substrings.
      - id: metadata/file/extension/identity::js-min-or-map-basename
      - id: well-known/lib/format/zip-js::zip-js-library-marker
      - id: metadata/file/format/source-map::sourcemap-inline-base64

