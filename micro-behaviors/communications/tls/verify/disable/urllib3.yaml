defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: urllib3-pool-cert-none
    desc: urllib3 disables TLS certificate checks
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        (call
          function: (attribute
            object: (identifier) @module
            attribute: (identifier) @constructor)
          arguments: (argument_list
            (keyword_argument
              name: (identifier) @keyword
              value: (string) @setting))
          (#eq? @module "urllib3")
          (#match? @constructor "^(PoolManager|ProxyManager)$")
          (#eq? @keyword "cert_reqs")
          (#match? @setting "^[\"']CERT_NONE[\"']$")) @call
