# Explicit Apple stream policy, not a bare constant or a server URL.
# The applied-policy composite is suspicious; the setting alone is notable.
defaults:
  platforms: [ios, macos]
  for: [objectivec, swift, javascript, typescript, python]
  crit: notable
  conf: 0.96

traits:
  - id: cfstream-chain-validation-disabled-setting
    desc: CFStream chain validation set to false
    for: [objectivec]
    if:
      type: tree-sitter
      query: |
        ((dictionary_pair . (_) @key . (_) @value .) @setting
          (#match? @key "kCFStreamSSLValidatesCertificateChain$" )
          (#match? @value "^@?(NO|false|kCFBooleanFalse)$"))

  - id: cfstream-ssl-settings-install
    desc: Applies SSL settings to an Apple stream
    if:
      type: symbol
      kind: call
      regex: '^CF(Read|Write)StreamSetProperty$'
      arg:
        index: 1
        kind: identifier
        name: kCFStreamPropertySSLSettings

composite_rules:
  - id: cfstream-insecure-stream-policy
    desc: CFStream settings near disabled TLS checks
    crit: suspicious
    for: [objectivec]
    # Proximity supports a policy-bypass inference, not variable identity,
    # execution, a C2 channel, or malicious server attribution.
    near_bytes: 400
    all:
      - id: cfstream-chain-validation-disabled-setting
      - id: cfstream-ssl-settings-install
