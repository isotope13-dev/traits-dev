# WinINet/WinHTTP option flags that relax server certificate validation.
defaults:
  crit: notable
  conf: 0.94
  platforms: [windows]
  mbc: C0005
  for: [source]

traits:
  # Relocated from objectives/command-and-control/backdoor/rat/tasking, where
  # it was `shad0w-ignore-certificate-validation`. The flag name also appears
  # in TLS client libraries that map or document it (MariaDB Connector/C's
  # schannel code), so it is a capability, not a Shad0w marker.
  - id: ignore-unknown-ca-security-flag
    desc: References SECURITY_FLAG_IGNORE_UNKNOWN_CA
    if:
      type: text
      substr: SECURITY_FLAG_IGNORE_UNKNOWN_CA
