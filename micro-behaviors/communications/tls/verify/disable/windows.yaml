# WinINet/WinHTTP option flags that relax server certificate validation.
defaults:
  crit: notable
  conf: 0.94
  platforms: [windows]
  mbc: C0005
  for: [source]

traits:
  # Relocated from objectives/command-and-control/backdoor/rat/tasking, where
  # it was `shad0w-ignore-certificate-validation`. The flag name also appears
  # in TLS client libraries that map or document it (MariaDB Connector/C's
  # schannel code), so it is a capability, not a Shad0w marker.
  - id: ignore-unknown-ca-security-flag
    desc: References SECURITY_FLAG_IGNORE_UNKNOWN_CA
    if:
      type: text
      substr: SECURITY_FLAG_IGNORE_UNKNOWN_CA
  # This mask explicitly collects flags that ignore certificate checks. The
  # option write is catalogued separately under verify/configure; the composite
  # below requires both pieces before inferring the validation bypass.
  - id: wininet-certificate-ignore-mask
    desc: References WinINet certificate-ignore mask
    crit: suspicious
    if:
      type: text
      regex: '(?i)\b(SecuritySetMask|SECURITY_FLAG_IGNORE_[A-Z_]+)\b'

  # Match the branch that applies the caller-controlled setting, rather than
  # merely a struct field declaration.
  - id: go-insecure-skip-verify-config
    desc: Branches on Go insecure TLS option
    for: [go]
    crit: notable
    if:
      type: text
      regex: '\bif\s+c\.TLSClientConfig\.InsecureSkipVerify\s*\{'

composite_rules:
  - id: go-wininet-configurable-tls-bypass
    desc: Go WinINet client configures TLS verification bypass
    for: [go]
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/tls/verify/configure::wininet-security-flags-option-set
      - id: wininet-certificate-ignore-mask
      - id: go-insecure-skip-verify-config
    near_bytes: 3000
