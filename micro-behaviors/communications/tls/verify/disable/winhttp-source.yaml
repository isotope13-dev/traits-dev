defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
traits:
  - id: winhttp-source-certificate-ignore-mask
    desc: WinHTTP applies certificate-ignore flag mask
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((compound_statement
          (declaration declarator: (init_declarator
            declarator: (identifier) @mask
            value: (_) @flags))
          (expression_statement
            (call_expression
              function: (identifier) @api
              arguments: (argument_list
                (_)
                (identifier) @option
                (pointer_expression argument: (identifier) @used)
                (_))))) @setting
          (#eq? @api "WinHttpSetOption")
          (#eq? @option "WINHTTP_OPTION_SECURITY_FLAGS")
          (#eq? @mask @used)
          (#match? @flags "\\bSECURITY_FLAG_IGNORE_[A-Z_]+\\b"))
