defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: shell-python-unverified-context
    desc: Python command creates unverified TLS context
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^python[23]?$'
      args:
        - index: 0
          kind: identifier
          name: -c
        - index: 1
          kind: string
          substr: ssl._create_unverified_context(
