traits:
- id: ssl-verify-ssl-false
  desc: verify_ssl=False configuration
  if:
    type: string_literal
    substr: verify_ssl=False
- id: ssl-insecure-warning
  desc: Suppresses InsecureRequestWarning
  if:
    type: string_literal
    substr: InsecureRequestWarning
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.6
