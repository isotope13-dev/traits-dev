defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: python-check-hostname-false
    desc: Python sets check_hostname=False
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        (assignment
          left: (attribute attribute: (identifier) @property)
          right: (false)
          (#eq? @property "check_hostname")) @assignment
