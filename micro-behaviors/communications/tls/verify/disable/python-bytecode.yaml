defaults:
  platforms: [windows, unix]
  for: [pyc]
traits:
  - id: pyc-cert-none-verify-mode-names
    desc: Bytecode groups CERT_NONE and verify_mode names
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: '(DA|FA) 09 43 45 52 54 5F 4E 4F 4E 45 (DA|FA) 0B 76 65 72 69 66 79 5F 6D 6F 64 65'
