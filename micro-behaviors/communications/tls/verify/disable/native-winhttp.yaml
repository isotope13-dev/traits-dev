defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]

traits:
  - id: x86-winhttp-ignore-certificate-errors
    desc: Relaxes WinHTTP server certificate checks
    crit: suspicious
    conf: 0.99
    mbc: C0005
    if:
      # Bind the API-name resolution to its pointer slot and the indirect
      # call. Option 31 is SECURITY_FLAGS; 84 only selects TLS protocols.
      # Bits in 0x3300 ignore CA, name, date or certificate usage errors.
      type: yara
      source: |
        import "pe"
        rule x86_winhttp_ignore_certificate_errors {
          strings:
            $api = "WinHttpSetOption\x00" ascii
            $resolve = {
              C7 44 24 04 ?? ?? ?? ?? 89 04 24 FF D3
              8B 15 ?? ?? ?? ??
              ( 85 D2 51 51 A3 ?? ?? ?? ?? | A3 ?? ?? ?? ?? 51 51 85 D2 )
            }
            $relax = {
              8D 45 ?? C7 45 ?? ?? ?? ?? ??
              C7 44 24 0C 04 00 00 00 89 44 24 08
              C7 44 24 04 1F 00 00 00 89 3C 24 FF 15 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            pe.imports("KERNEL32.dll", "GetProcAddress") and
            for any r in (1..#resolve) : (
              for any a in (1..#api) : (
                pe.rva_to_offset(uint32(@resolve[r]+4)-pe.image_base) == @api[a]
              ) and for any c in (1..#relax) : (
                // Equivalent instruction schedules store EAX before or
                // after the flag test and stack cleanup. Bind either store
                // to the called slot; never infer the API from its name alone.
                ((uint8(@resolve[r]+19) == 0xA3 and
                  uint32(@resolve[r]+20) == uint32(@relax[c]+35)) or
                 (uint8(@resolve[r]+23) == 0xA3 and
                  uint32(@resolve[r]+24) == uint32(@relax[c]+35))) and
                uint8(@relax[c]+2) == uint8(@relax[c]+5) and
                (uint32(@relax[c]+6) & 0x3300) != 0
              )
            )
        }
