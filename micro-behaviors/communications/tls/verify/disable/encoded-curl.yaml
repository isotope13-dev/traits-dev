defaults:
  platforms: [unix]
  for: [cmake]
traits:
  - id: cmake-encoded-curl-insecure-tls
    desc: Encoded curl disables TLS verification
    crit: notable
    conf: 0.85
    if:
      type: encoded
      # The -k cluster must follow whitespace: a bare `-[A-Za-z]*k` also
      # matches long options that merely contain a k (`--token`, `--check`),
      # which disable nothing. `--insecure` keeps its own alternative.
      regex: 'curl\b.{0,120}\s-([A-Za-z]*k[A-Za-z]*|-insecure)\b'
    unless:
      # Minified library bundles can decode to accidental curl -k substrings.
      - id: metadata/file/extension/identity::js-min-or-map-basename
      - id: well-known/lib/format/zip-js::zip-js-library-marker
      - id: metadata/file/format/source-map::sourcemap-inline-base64
