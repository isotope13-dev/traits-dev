defaults:
  platforms: [unix]
  for: [cmake]
traits:
  - id: cmake-encoded-curl-insecure-tls
    desc: Encoded curl disables TLS verification
    crit: notable
    conf: 0.85
    if:
      type: encoded
      regex: 'curl\s[^\n]{0,120}(-[A-Za-z]*k[A-Za-z]*|--insecure)\b'
    unless:
      # Minified library bundles can decode to accidental curl -k substrings.
      - id: metadata/build/minifier::js-min-or-map-basename
      - id: well-known/lib/format/zip-js::zip-js-library-marker
      - id: metadata/file/format/source-map::sourcemap-inline-base64
