# PHP option forms that disable TLS verification. Certificate diagnostics
# also use these options; they do not establish an evasion objective.
defaults:
  crit: notable
  conf: 0.95
  platforms: [windows, unix]
  for: [php]
  mbc: C0005
  attack: T1553

traits:
  - id: stream-context-verify-peer-disabled
    desc: Stream context skips TLS peer verification
    if:
      type: text
      regex: '["'']verify_peer["'']\s*=>\s*false'
  - id: stream-context-verify-peer-name-disabled
    desc: Stream context skips TLS host verification
    if:
      type: text
      regex: '["'']verify_peer_name["'']\s*=>\s*false'
  # curl_setopt_array([...]) form; the curl_setopt() form lives in
  # micro-behaviors/communications/http/curl/php.yaml.
  - id: curl-option-array-verifypeer-disabled
    desc: cURL option array skips peer verification
    if:
      type: text
      regex: '(^|[^/])CURLOPT_SSL_VERIFYPEER\s*=>\s*(false|0)\b'
  - id: curl-option-array-verifyhost-disabled
    desc: cURL option array skips host verification
    if:
      type: text
      regex: '(^|[^/])CURLOPT_SSL_VERIFYHOST\s*=>\s*(false|0)\b'
  - id: wordpress-sslverify-disabled
    desc: WordPress HTTP options disable TLS verification
    if:
      type: text
      regex: '["'']sslverify["'']\s*=>\s*(false|0)\b'
