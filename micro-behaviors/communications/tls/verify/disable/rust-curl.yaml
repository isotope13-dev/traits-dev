defaults:
  for: [rust]
  platforms: [unix, windows]

traits:
  - id: rust-curl-insecure-setup
    desc: Rust curl setup skips TLS verification
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: 'Command::new\s*\(\s*"curl"\s*\)(;\s*\w{1,32})?\s*\.arg\(\s*"(-k|--insecure)"\s*\)'
