defaults:
  platforms: [windows, unix]
  for: [ruby, gem]

composite_rules:
  - id: rubygems-token-tls-disabled-fetch
    desc: RubyGems token and TLS-disabled HTTP fetch
    crit: suspicious
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
      - id: micro-behaviors/data/format/credentials::rubygems-api-token-shaped-text
      - id: micro-behaviors/communications/http/lib/netlib::net-http-get
