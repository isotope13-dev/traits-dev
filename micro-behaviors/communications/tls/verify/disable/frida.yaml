defaults:
  platforms: [android, unix]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: frida-permissive-hostname-verifier
    desc: Frida SSLSession verifier hook returns true
    if:
      type: text
      regex: '\.verify\.overload\([^)]{0,100}ssl\.SSLSession[^}]{0,250}return\s+true'
