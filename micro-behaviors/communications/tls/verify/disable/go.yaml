defaults:
  platforms:
  - windows
  - linux
  - macos
  crit: notable
  conf: 0.8
  for:
  - go
  - pe
traits:
- id: insecure-skip-verify
  desc: TLS verification bypass configuration
  if:
    type: text
    regex: (?m)^[[:space:]]*(InsecureSkipVerify|skip_tls_verify)\s*[:=]\s*true\b
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
