defaults:
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.95
  for: [go]
traits:
  - id: insecure-skip-verify
    desc: Go TLS verification disabled in configuration
    if:
      type: tree-sitter
      query: |
        ((keyed_element
          key: (literal_element (identifier) @field)
          value: (literal_element (true))) @config
          (#match? @field "^(InsecureSkipVerify|skip_tls_verify)$"))
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
