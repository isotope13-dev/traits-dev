defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: node-https-get-verification-disabled
  desc: HTTPS GET disables certificate verification
  crit: suspicious
  conf: 0.98
  # Bind the option to a direct get() argument. The URL may be a concatenated
  # expression; comments and objects inside callbacks are not request options.
  if:
    type: tree-sitter
    query: |
      (
        (call_expression
          function: (member_expression
            object: (identifier) @client
            property: (property_identifier) @method)
          arguments: (arguments
            (object
              (pair
                key: [(property_identifier) @key
                      (string (string_fragment) @key)]
                value: (false))) @options)) @request
        (#eq? @client "https")
        (#eq? @method "get")
        (#eq? @key "rejectUnauthorized")
        (#not-match? @options "hostname:\\s*[\"']127\\.0\\.0\\.1[\"']")
        (#not-match? @options "hostname:\\s*[\"']localhost[\"']")
        (#not-match? @options "hostname:\\s*[\"']::1[\"']")
        (#not-match? @request "(?i)[\"']https?://(?:[a-z0-9-]+\\.)?example\\.com")
      )
  # Apply endpoint exclusions to complete AST nodes above. Trait-level not:
  # filters each captured evidence fragment separately, including identifiers,
  # and cannot exclude a whole structural match based on its options object.
  unless:
  - type: text
    regex: hostname:\s*["']localhost["']
  - id: well-known/tool/development/toolchain/deno::source-archive-context
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
