defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: node-https-get-verification-disabled
  desc: HTTPS GET disables certificate verification
  crit: suspicious
  conf: 0.98
  # Node accepts both https.get(options[, cb]) and https.get(url, options[, cb]);
  # the first argument may be a URL string or variable before the options object.
  if:
    type: text
    regex: https\.get\s*\(\s*(\{|\S{1,80}\s*,\s*\{)[\s\S]{0,240}?rejectUnauthorized\s*:\s*false
  # A loopback health check of a local proxy often skips cert verification
  # because the certificate is self-signed. That is not a remote dropper.
  # `not:` applies to the matched get() span; a different get() to a public
  # host in the same file still matches.
  not:
  - regex: 'hostname:\s*["'']127\.0\.0\.1["'']'
  - regex: 'hostname:\s*["'']localhost["'']'
  - regex: 'hostname:\s*["'']::1["'']'
  - regex: '(?i)["'']https?://(?:[a-z0-9-]+\.)?example\.com'
  unless:
  - type: text
    regex: hostname:\s*["']localhost["']
  - id: well-known/tool/development/toolchain/deno::source-archive-context
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
