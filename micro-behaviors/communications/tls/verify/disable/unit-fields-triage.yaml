traits:
- id: unit-ignore-cert-argument
  desc: Unit command disables certificate verification
  crit: notable
  if:
    type: value
    path: service.exec_start
    regex: (^|\s)--?ignore-cert(\s|$)
  for:
  - systemd
- id: ignore-cert-option-reference
  desc: Reference to the ignore-cert option
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: ignore-cert
  for:
  - shell
  - systemd
  - scripts
- id: unit-curl-insecure-command
  desc: Unit curl command disables TLS verification
  crit: notable
  conf: 0.95
  for:
  - systemd
  if:
    type: value
    path: service.exec_start
    regex: \bcurl\b[^\n|;]{0,240}\s(-[A-Za-z]*k[A-Za-z]*\b|--insecure\b)
- id: desktop-curl-insecure-command
  desc: Desktop curl disables TLS verification
  crit: notable
  conf: 0.95
  for:
  - desktop
  if:
    type: value
    path: desktop_entry.exec
    regex: \bcurl\b[^\n|;]{0,240}\s(-[A-Za-z]*k[A-Za-z]*\b|--insecure\b)
defaults:
  platforms:
  - linux
