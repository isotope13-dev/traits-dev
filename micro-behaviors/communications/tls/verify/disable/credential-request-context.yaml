defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: tls-disabled-credential-env-read-with-https
    desc: Credential env read beside TLS-disabled HTTPS
    crit: suspicious
    conf: 0.93
    scope: leaf
    near_bytes: 2048
    all:
      - id: node-tls-verification-env-disable
      - id: micro-behaviors/os/env/secret-name::credential-env-read
    any:
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/http/request/client::https-request
