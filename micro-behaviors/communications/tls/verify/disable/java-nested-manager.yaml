defaults:
  platforms: [windows, unix]
  for: [class, jar, zip]
composite_rules:
  - id: java-tls-client-own-trust-all-manager
    desc: TLS client uses own trust-all inner manager
    crit: notable
    conf: 0.95
    for: [jar, zip, class, java_class]
    scope: nest
    all:
      - id: metadata/file/profile/tls::x509-manager-and-trust-all-name
      - id: micro-behaviors/communications/socket/ssl::jvm-sslcontext-trustmanager-init-call
      - id: micro-behaviors/communications/socket/ssl::jvm-sslsocket-handshake-call

