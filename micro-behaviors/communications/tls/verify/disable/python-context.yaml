defaults:
  platforms: [windows, linux, macos]
  for: [python]

traits:
  - id: verify-mode-none
    desc: Python disables TLS certificate verification
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^[ \t]{0,40}([A-Za-z_][A-Za-z0-9_]*\.)?verify_mode\s*=\s*(ssl\.)?CERT_NONE\b'

composite_rules:
  - id: tls-validation-fully-disabled
    desc: TLS hostname and certificate validation both disabled
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/tls/verify/disable::python-check-hostname-false
      - id: verify-mode-none
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/network/websocket-client::websocket-client-source
      - id: well-known/app/system/kagent::kagent-source-path
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/app/ai/gateway/litellm::litellm-package-path
      - id: well-known/tool/development/mobile/pymobiledevice3
      - id: well-known/lib/crypto/cheroot::cheroot-ssl-module
      - id: well-known/tool/development/lacelang-executor::http-timing-module
      - id: "metadata/file/naming::test-directory-component"
