defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  crit: notable
traits:
- id: verify-mode-none
  desc: Python disables TLS certificate verification
  conf: 0.85
  if:
    type: text
    regex: (?m)^[ \t]{0,40}([A-Za-z_][A-Za-z0-9_]*\.)?verify_mode\s*=\s*(ssl\.)?CERT_NONE\b
composite_rules:
- id: tls-validation-fully-disabled
  desc: TLS hostname and certificate validation both disabled
  conf: 0.95
  all:
  - id: micro-behaviors/communications/tls/verify/disable::python-check-hostname-false
  - id: verify-mode-none
