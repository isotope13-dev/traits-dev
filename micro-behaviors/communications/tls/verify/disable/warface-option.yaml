# Private-server launchers use this CryOnline option. Its presence does not
# establish malicious intent or show that the enclosing process bypasses TLS.
# https://github.com/IvanyGames/IgEmulator (client launch instructions)
defaults:
  platforms: [windows]
  for: [pe, batch, csharp]
  crit: notable
  conf: 0.99

traits:
  - id: warface-certificate-check-disabled-option
    desc: Warface certificate-check disabling option
    if:
      type: text
      regex: '\+online_check_certificate[ =]{1,3}0\b'
