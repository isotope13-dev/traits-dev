defaults:
  platforms: [windows, unix]
  for: [powershell]
traits:
- id: powershell-callback-accepts-all-certificates
  desc: PowerShell accepts every server certificate
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?is)ServerCertificateValidationCallback\s*=\s*\{\s*\$true\s*\}'
  unless:
    # Ansible's win_get_url/win_package modules gate this behind a documented
    # `validate_certs: no` parameter the operator must opt into.
    - id: well-known/app/infrastructure/ansible::ansible-module-source-context
    - id: well-known/app/infrastructure/ansible::ansible-powershell-webrequest-context
    # An installer that skips certificate checks only inside `if ($insecure)`
    # is exposing a documented opt-in switch (default off) to its operator.
    - id: micro-behaviors/communications/tls/verify/callback::powershell-insecure-switch-guard
    # A probe that accepts every certificate long enough to read the peer's
    # certificate, then clears the callback, is a certificate inspector.
    - id: micro-behaviors/communications/tls/verify/callback::powershell-certificate-inspection-probe
