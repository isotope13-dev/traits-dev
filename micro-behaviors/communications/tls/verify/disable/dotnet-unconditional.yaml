# Unconditional .NET certificate-validation callbacks in source. The lambda
# and delegate spellings prove the handler accepts every peer certificate;
# test scaffolding for local mock servers and opt-in library options share the
# shape, so the mechanic stays a capability here and hostile composites add
# the bypass objective. The binary-level counterpart is dotnet.yaml's CIL
# trust-all-callback install.
defaults:
  platforms: [windows, unix]
  for: [csharp]
  attack: T1553
traits:
  - id: dotnet-cert-callback-lambda-accepts-all
    desc: .NET SSL callback always returns true
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: ServerCertificateValidationCallback\s*\+?=\s*\([^)]{0,60}\)\s*=>\s*true
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/corpus/security-tests::static-analyzer-project-declaration
  - id: dotnet-cert-callback-delegate-accepts-all
    desc: .NET SSL callback body returns true only
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: ServerCertificateValidationCallback[^{]{0,100}\{\s*return\s+true\s*;\s*\}
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/corpus/security-tests::static-analyzer-project-declaration
