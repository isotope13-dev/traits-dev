# Unconditional .NET certificate-validation callbacks in source. The lambda
# and delegate spellings prove the handler accepts every peer certificate;
# test scaffolding for local mock servers and opt-in library options share the
# shape, so the mechanic stays a capability here and the bypass objective composite
# (objectives/evasion/security-bypass/tls) reports it. The binary-level counterpart is dotnet.yaml's CIL
# trust-all-callback install.
defaults:
  platforms: [windows, unix]
  for: [csharp]
  attack: T1553
traits:
  - id: dotnet-accept-invalid-cert-opt-in-setting
    desc: Default-off accept-invalid-certs setting
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Accept\w{0,40}Cert\w{0,30}\s*\{\s*get;\s*set;\s*\}\s*=\s*false\b'
  - id: dotnet-cert-callback-lambda-accepts-all
    desc: .NET SSL callback always returns true
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: ServerCertificateValidationCallback\s*\+?=\s*\([^)]{0,60}\)\s*=>\s*true
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/corpus/security-tests/declaration::static-analyzer-project-declaration
        - id: well-known/tool/development/vcs/git-credential-manager::gcm-tls-verification-opt-in
        - id: micro-behaviors/communications/tls/verify/disable::dotnet-accept-invalid-cert-opt-in-setting
  - id: dotnet-cert-callback-delegate-accepts-all
    desc: .NET SSL callback body returns true only
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: ServerCertificateValidationCallback[^{]{0,100}\{\s*return\s+true\s*;\s*\}
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/corpus/security-tests/declaration::static-analyzer-project-declaration
        - id: well-known/tool/development/vcs/git-credential-manager::gcm-tls-verification-opt-in
        - id: micro-behaviors/communications/tls/verify/disable::dotnet-accept-invalid-cert-opt-in-setting
