defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
composite_rules:
- id: node-tls-disable-write-shell-profile
  desc: TLS disable, file write and shell exec clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
  - id: micro-behaviors/fs/write/file/full::write-file-sync
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  any:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/http/url/cloud::alibaba-oss-executable-url
  unless:
  - id: well-known/app/media/mastergo::mastergo-application-context
  - id: well-known/tool/development/agent/codewhale::codewhale-application-context
