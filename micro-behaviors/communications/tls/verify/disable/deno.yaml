defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: deno-ignore-cert-errors-flag
    desc: Deno TLS certificate-bypass flag reference
    if:
      type: literal
      exact: --unsafely-ignore-certificate-errors
  - id: deno-child-cert-verification-disabled
    desc: Deno child disables certificate verification
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: Deno.run
      arg:
        index: 0
        from:
          field: cmd
          value: '^--unsafely-ignore-certificate-errors$'
