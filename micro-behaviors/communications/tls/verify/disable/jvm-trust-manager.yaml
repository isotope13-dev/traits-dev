defaults:
  platforms: [unix, windows]
  for: [java, class]
traits:
- id: java-trust-all-type-name
  desc: JVM type named trust-all or accept-all
  crit: notable
  conf: 0.92
  for: [class]
  if:
    type: value
    path: class.strings[*]
    # Require a token boundary so JavaMail isTrustAllHosts / trustAllHosts
    # API names do not count as a trust-all manager type.
    regex: '(?i)(^|[^A-Za-z])(trust|accept)[-_]?all([^A-Za-z]|$)'
- id: java-inert-trustmanager-name
  desc: JVM trust manager named insecure or null
  crit: notable
  conf: 0.92
  for: [class]
  if:
    type: value
    path: class.strings[*]
    regex: '(?i)(insecure|null|dummy)_?trustmanager'
- id: java-trust-all-name-text
  desc: JVM trust manager uses trust-all naming
  crit: notable
  conf: 0.92
  if:
    type: text
    # Same token-boundary requirement as java-trust-all-type-name above:
    # JavaMail's opt-in isTrustAllHosts / trustAllHosts / setTrustAllHosts
    # API names are not trust-all manager types.
    regex: '(?i)(^|[^A-Za-z])(trust|accept)[-_]?all([^A-Za-z]|$)'
- id: java-inert-trustmanager-text
  desc: JVM trust manager uses insecure naming
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)(insecure|null|dummy)[-_]?trustmanager'
- id: java-sslcontext-no-validation-name
  desc: JVM SSL context named for disabled validation
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)SSLContext[-_]?(No[-_]?Validation|No[-_]?Verify)'
composite_rules:
  - id: java-trust-all-x509trustmanager
    desc: Java trust manager accepts every certificate
    crit: notable
    conf: 0.93
    scope: file
    for: [class]
    all:
      - id: micro-behaviors/communications/socket/ssl::jvm-custom-x509trustmanager
    any:
      - id: java-trust-all-type-name
      - id: java-inert-trustmanager-name
      - id: metadata/file/function::jvm-class-calls-no-methods
    unless:
      # These are documented opt-in helpers in identified JVM runtime
      # libraries; an application still reports its own trust-manager classes.
      - id: well-known/lib/runtime/managed/
      - id: well-known/lib/testing/testcontainers::testcontainers-package-path
      - id: well-known/tool/development/vscode-extension/vscode-tlaplus::extension-archive-context
      - id: well-known/app/ai/tool-server/quarkus-agent-mcp::quarkus-agent-mcp-package
      - id: well-known/lib/ai/ray/
      - id: well-known/lib/data/cloud-jdbc::jdbc-sdk-bundle-context
  - id: java-tls-validation-bypass
    desc: Java trust-all TLS manager configuration
    crit: notable
    conf: 0.96
    for: [class, jar, zip]
    # Do not combine an SSLContext.init call in one class with a permissive
    # trust-manager name from another class in the same package or JAR.
    scope: leaf
    all:
      - id: micro-behaviors/communications/socket/ssl::jvm-sslcontext-trustmanager-init-call
      - id: micro-behaviors/communications/socket/ssl::jvm-trustmanager-class-ref
    any:
      - id: java-trust-all-type-name
      - id: java-inert-trustmanager-name
      - id: java-trust-all-name-text
      - id: java-inert-trustmanager-text
      - id: java-sslcontext-no-validation-name
    unless:
    # pywebview's Android WebView client intentionally supports an
    # ignoreSslErrors custom-request path; its class is bundled library code,
    # not sample-specific TLS bypass logic.
    - id: well-known/lib/ui/pywebview::android-client-class
    - id: well-known/app/media/cloudstream::cloudstream-apk
    - id: well-known/app/system/maestro::android-test-app-path
    - id: metadata/package/testing/presence/harness::example-directory
    # Yonyou MCP server disables TLS validation for internal dev-community HTTPS.
    - id: well-known/tool/development/vscode-extension/yonbip-devtool::yonyou-mcp-jar-path
    # jsoup ships optional insecure TLS helpers for HTML scraping.
    - id: well-known/lib/web/jsoup::jsoup-library-context
    # The shared semantic behind four separate carve-outs that used to be
    # listed here one by one: a managed-runtime library that ships a
    # documented opt-in trust-all helper is implementing the option its
    # callers ask for, not disabling validation on its own account. OpenJDK's
    # source tree, Netty's InsecureTrustManagerFactory, Apache HttpClient's
    # TrustAllStrategy, Quarkus' TLS registry and Swagger Parser's opt-in
    # RemoteUrl helper all fit that pattern. The directory's other members are
    # narrow runtime-library or runtime-binary identities (libjvm.so, coreclr,
    # mono exports), so the reference does not widen to applications.
    - id: well-known/lib/runtime/managed/
