defaults:
  platforms: [unix, windows]
  for: [java, class]
traits:
- id: java-trust-all-type-name
  desc: JVM type named trust-all or accept-all
  crit: notable
  conf: 0.92
  for: [class]
  if:
    type: value
    path: class.strings[*]
    # Require a token boundary so JavaMail isTrustAllHosts / trustAllHosts
    # API names do not count as a trust-all manager type.
    regex: '(?i)(^|[^A-Za-z])(trust|accept)[-_]?all([^A-Za-z]|$)'
- id: java-inert-trustmanager-name
  desc: JVM trust manager named insecure or null
  crit: notable
  conf: 0.92
  for: [class]
  if:
    type: value
    path: class.strings[*]
    regex: '(?i)(insecure|null|dummy)_?trustmanager'
- id: java-trust-all-name-text
  desc: JVM trust manager uses trust-all naming
  crit: notable
  conf: 0.92
  if:
    type: text
    # Same token-boundary requirement as java-trust-all-type-name above:
    # JavaMail's opt-in isTrustAllHosts / trustAllHosts / setTrustAllHosts
    # API names are not trust-all manager types.
    regex: '(?i)(^|[^A-Za-z])(trust|accept)[-_]?all([^A-Za-z]|$)'
- id: java-inert-trustmanager-text
  desc: JVM trust manager uses insecure naming
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)(insecure|null|dummy)[-_]?trustmanager'
- id: java-sslcontext-no-validation-name
  desc: JVM SSL context named for disabled validation
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)SSLContext[-_]?(No[-_]?Validation|No[-_]?Verify)'
composite_rules:
  - id: java-tls-validation-bypass
    desc: Java trust-all TLS manager configuration
    crit: notable
    conf: 0.96
    for: [class, jar, zip]
    # Do not combine an SSLContext.init call in one class with a permissive
    # trust-manager name from another class in the same package or JAR.
    scope: leaf
    all:
      - id: micro-behaviors/communications/socket/ssl::jvm-sslcontext-trustmanager-init-call
      - id: micro-behaviors/communications/socket/ssl::jvm-trustmanager-class-ref
    any:
      - id: java-trust-all-type-name
      - id: java-inert-trustmanager-name
      - id: java-trust-all-name-text
      - id: java-inert-trustmanager-text
      - id: java-sslcontext-no-validation-name
