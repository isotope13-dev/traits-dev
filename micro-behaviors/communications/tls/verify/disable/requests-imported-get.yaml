defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-get-verify-false-call
    desc: Bare get() call specifies verify=False
    crit: component
    conf: 0.9
    unless:
      - type: function
        exact: get
    if:
      type: tree-sitter
      query: |
        (call
          function: (identifier) @callee
          arguments: (argument_list
            (keyword_argument name: (identifier) @keyword value: (false)))
          (#eq? @callee "get")
          (#eq? @keyword "verify")) @call

composite_rules:
  - id: requests-imported-get-verify-false
    desc: Unaliased imported Requests get call sets verify=False
    crit: notable
    conf: 0.94
    all:
      - id: metadata/import/python/requests/get
      - id: python-get-verify-false-call
