defaults:
  platforms:
  - windows
  - linux
  - macos
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
traits:
- id: playwright-ignore-https-errors
  desc: Accepts HTTPS with invalid certificates
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'ignoreHTTPSErrors\s*:\s*true'
- id: reject-unauthorized-false
  size_max: 262144
  desc: Node TLS verification disabled by option
  if:
    type: tree-sitter
    query: |
      [
        (pair
          key: [(property_identifier) @key (string (string_fragment) @key)]
          value: (false)
          (#eq? @key "rejectUnauthorized")) @option
        (pair
          key: [(property_identifier) @key (string (string_fragment) @key)]
          value: (unary_expression operator: "!" argument: (number) @one)
          (#eq? @key "rejectUnauthorized")
          (#eq? @one "1")) @option
        (assignment_expression
          left: [
            (member_expression property: (property_identifier) @key)
            (subscript_expression index: (string (string_fragment) @key))
          ]
          right: (false)
          (#eq? @key "rejectUnauthorized")) @option
        (assignment_expression
          left: [
            (member_expression property: (property_identifier) @key)
            (subscript_expression index: (string (string_fragment) @key))
          ]
          right: (unary_expression operator: "!" argument: (number) @one)
          (#eq? @key "rejectUnauthorized")
          (#eq? @one "1")) @option
      ]
- id: node-tls-verification-env-disable
  desc: Node TLS verification-disable assignment text
  crit: notable
  for:
  - scripts
  - binaries
  - typescript
  if:
    type: text
    regex: process\.env.{0,40}NODE_TLS_REJECT_UNAUTHORIZED["'\]]{0,2}\s*=\s*["']?0
  unless:
  - id: metadata/package/testing/presence/path::test-fixture-directory-path
  - type: text
    regex: NODE_ENV\s*={2,3}\s*["']production["'][\s\S]{0,900}?\b(return|throw)\b
  - id: metadata/package/testing/presence/fixture::semgrep-rule-fixture
  - id: metadata/package/testing/corpus/security-tests::labeled-tls-query-test
  - id: well-known/tool/detection/pattern-catalog::js-exported-severity-rule-module
  - id: well-known/tool/detection/xgrep::xgrep-scanner-context
  - type: text
    regex: (?i)(insecure|isTlsVerificationDisabled)[^;]{0,50}process\.env\S{0,25}NODE_TLS_REJ
  - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context

- id: node-tls-verification-env-disable-code
  desc: Node TLS verification disabled by assignment
  if:
    type: tree-sitter
    query: |
      (assignment_expression
        left: [
          (member_expression
            object: (member_expression object: (identifier) @process property: (property_identifier) @env)
            property: (property_identifier) @key)
          (subscript_expression
            object: (member_expression object: (identifier) @process property: (property_identifier) @env)
            index: (string (string_fragment) @key))
        ]
        right: [(string (string_fragment) @zero) (number) @zero]
        (#eq? @process "process")
        (#eq? @env "env")
        (#eq? @key "NODE_TLS_REJECT_UNAUTHORIZED")
        (#eq? @zero "0")) @assignment

# Keep the assignment observable in test setup and available to consumers.
# Only the standalone risk interpretation depends on the test harness.
composite_rules:
- id: node-tls-verification-env-disable-outside-tests
  desc: Node TLS verification disabled outside test hooks
  crit: suspicious
  all:
  - id: node-tls-verification-env-disable-code
  - id: node-tls-verification-env-disable
  unless:
  - id: metadata/package/testing/presence/scripted::javascript-hook-test-context
  - id: metadata/package/testing/corpus/security-tests::intentional-security-demo
  # Cypress's own runtime sets this at module load so the test runner reaches
  # self-signed apps under test (documented in agent.ts and start-cypress.js).
  # Its cypress:<ns> debug namespace is the identity leg; other tools keep S.
  - id: well-known/lib/platform/browser-automation/frameworks::cypress-debug-namespace
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/corpus/security-tests::static-analyzer-project-declaration
    - id: metadata/package/testing/harness/unit::node-certificate-test-context

- id: node-tls-verification-env-disable-non-js-outside-tests
  desc: Node TLS verification disabled outside test hooks
  crit: suspicious
  for: [scripts, binaries, -javascript]
  all:
  - id: node-tls-verification-env-disable
  unless:
  - id: metadata/package/testing/presence/scripted::javascript-hook-test-context
  - id: metadata/package/testing/corpus/security-tests::intentional-security-demo
  # Cypress's own runtime sets this at module load so the test runner reaches
  # self-signed apps under test (documented in agent.ts and start-cypress.js).
  # Its cypress:<ns> debug namespace is the identity leg; other tools keep S.
  - id: well-known/lib/platform/browser-automation/frameworks::cypress-debug-namespace
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/corpus/security-tests::static-analyzer-project-declaration
    - id: metadata/package/testing/harness/unit::node-certificate-test-context
