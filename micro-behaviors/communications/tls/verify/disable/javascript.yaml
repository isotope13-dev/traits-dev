defaults:
  platforms:
  - windows
  - linux
  - macos
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
traits:
- id: reject-unauthorized-false
  desc: Node TLS verification disabled by option
  if:
    type: tree-sitter
    query: |
      [
        (pair
          key: [(property_identifier) @key (string (string_fragment) @key)]
          value: (false)
          (#eq? @key "rejectUnauthorized")) @option
        (pair
          key: [(property_identifier) @key (string (string_fragment) @key)]
          value: (unary_expression operator: "!" argument: (number) @one)
          (#eq? @key "rejectUnauthorized")
          (#eq? @one "1")) @option
        (assignment_expression
          left: [
            (member_expression property: (property_identifier) @key)
            (subscript_expression index: (string (string_fragment) @key))
          ]
          right: (false)
          (#eq? @key "rejectUnauthorized")) @option
        (assignment_expression
          left: [
            (member_expression property: (property_identifier) @key)
            (subscript_expression index: (string (string_fragment) @key))
          ]
          right: (unary_expression operator: "!" argument: (number) @one)
          (#eq? @key "rejectUnauthorized")
          (#eq? @one "1")) @option
      ]
- id: node-tls-verification-env-disable
  desc: Node TLS verification disabled via environment
  crit: suspicious
  if:
    type: text
    # Assignment only: the bracket/quote tail must reach a single `=`, so a
    # `process.env.NODE_TLS_REJECT_UNAUTHORIZED === '0'` comparison that
    # merely reads (and propagates) an existing disable does not match.
    regex: process\.env.{0,40}NODE_TLS_REJECT_UNAUTHORIZED["'\]]{0,2}\s*=\s*["']?0
  unless:
    # The security regression fixture exercises this exact unsafe setting;
    # it does not disable TLS validation for the package's own traffic.
    - id: metadata/package/testing/presence/path::test-fixture-directory-path
    # A disable that is refused in production — a NODE_ENV=production check
    # that returns or throws before the assignment can take effect — is a
    # user-selected self-signed/dev mode with the dangerous case fenced
    # off, not a silent bypass. The unguarded assignment still fires.
    - type: text
      regex: 'NODE_ENV\s*={2,3}\s*["'']production["''][\s\S]{0,900}?\b(return|throw)\b'
    # Semgrep rule test fixtures demonstrate the vulnerable pattern under
    # `// ruleid:` annotations; the assignment is example data for the
    # detector, not a live bypass.
    - id: metadata/package/testing/presence/fixture::semgrep-rule-fixture
    - id: well-known/tool/detection/pattern-catalog::js-exported-severity-rule-module
    # The assignment is the body of an explicit opt-in branch the user turns
    # on (`if (config.insecure) { ... }` from KIBANA_INSECURE=true, the
    # `--insecure` / `-k` convention), not a silent bypass.
    - type: text
      regex: '(?i)if\s*\([^)]{0,60}insecure[^)]{0,40}\)\s*\{?\s*process\.env\S{0,30}NODE_TLS_REJ'
    # A Vitest case that assigns the variable is exercising a local fixture.
    # It is not the program disabling verification for its own traffic.
    - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
    # Integration-test trees (`test/integration/`, `tests/integration/`,
    # and `integration_test/`) assign the variable while talking to a local
    # test server or emulator. Example scripts outside those trees still match.
    - type: path
      regex: '(^|[\\/])tests?[\\/]integration[\\/]|(^|[\\/])integration_test[\\/]'
