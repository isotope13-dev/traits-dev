defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
  crit: notable
  conf: 0.95
traits:
- id: go-x64-http-transport-skip-verify
  desc: Go x64 HTTP transport disables TLS verification
  if:
    type: hex
    section: .text
    pattern: E8 [4] C6 80 A0 00 00 00 01 [0-64] 48 89 81 D8 00 00 00
  unless:
  - type: value
    path: pe.go.version
    exists: false
