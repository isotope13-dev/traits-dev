defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-client-conditional-verify-false
    desc: HTTP client conditionally disables TLS checks
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: (attribute object: (identifier) @module
            attribute: (identifier) @constructor)
          arguments: (argument_list
            (keyword_argument name: (identifier) @keyword
              value: (conditional_expression (_) (_) (false) .)))) @client
         (#match? @module "^(httpx|primp)$")
         (#match? @constructor "^(Client|AsyncClient)$")
         (#eq? @keyword "verify"))
