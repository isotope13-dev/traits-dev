# Endpoint text establishes a reference, not network traffic or C2.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: loopback-websocket-endpoint
    desc: References a loopback WebSocket endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bws://(localhost|127\.0\.0\.1)(:[^/?"''\s]{1,40})?([/?"'']|$)'
