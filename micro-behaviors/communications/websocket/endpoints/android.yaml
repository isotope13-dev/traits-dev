defaults:
  crit: notable
  conf: 0.9
  platforms: [android]
  for: [android_apk, java, kotlin, xml]

traits:
  - id: local-websocket-endpoint
    desc: Local WebSocket endpoint reference
    for: [java, kotlin, xml]
    if:
      type: text
      regex: 'wss?://(127\.0\.0\.1|localhost)(:[0-9]{1,5})?'

  - id: android-wss-endpoint
    desc: Android encrypted WebSocket endpoint
    for: [java, kotlin, xml]
    if:
      type: text
      substr: wss://
