# WebSocket endpoint paths named in JavaScript source.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]

traits:
  # `/ws` is the single most common WebSocket mount path, and the bare literal
  # also turns up as an ordinary route: an OpenAPI `callbacks` path, an Express
  # route table, a proxy rule. On its own the string names a path and nothing
  # more -- it establishes no connection and no destination -- so it is a
  # component that composites join to an actual WebSocket construction.
  - id: relative-ws-endpoint-path
    desc: Relative "/ws" endpoint path literal
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(new\s+WebSocket\s*\([^)]{0,120}|["''`])/ws["''`]'
    unless:
      - id: well-known/app/development/vscode-extension/event-horizon::event-horizon-vscode-extension
      - id: well-known/app/development/vscode-extension/gti-vscode::graphite-gt-auth-server-chunk
