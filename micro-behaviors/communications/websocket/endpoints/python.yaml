defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1071.001
  mbc: C0002

traits:
  - id: terminal-ws-path
    desc: Terminal WebSocket endpoint path
    crit: notable
    conf: 0.82
    if:
      type: text
      substr: "/terminal/ws"
  # A WebSocket URL (or endpoint-path constant) whose route is literally
  # "/tunnel" — the mount point reverse-tunnel implants (TerminalFix-style
  # pivots and lookalikes) upgrade to after dialing the C2 over TLS/443.
  - id: tunnel-ws-endpoint-path
    desc: WebSocket /tunnel endpoint URL or constant
    crit: notable
    conf: 0.85
    for: [python, javascript, typescript, powershell, shell]
    if:
      type: text
      regex: '(?i)\bwss?://[^"''\s]{1,200}/tunnel\b|\btunnel[_a-z]{0,8}path\s*=\s*["'']/tunnel["'']'
