# Literal facts retain template interpolation and decode ASCII escapes.
# A token-bearing ws:// template exposes credentials if connected. We report
# the construction, without asserting a connection or malicious destination.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: plaintext-websocket-token-template
    desc: Plaintext WebSocket URL includes auth token
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      regex: '^ws://[^\s"<>]{1,500}[?&](access_token|token|auth_token|api_key)=\$\{[^}]{1,160}\}'
    # Loopback daemons (local terminal/agent servers) never leave the host,
    # so the token is not exposed on the network.
    not:
      - regex: '^ws://(localhost|127\.0\.0\.1|\[::1\])[:/?]'
