traits:
  - id: python-websocket-mask-key
    desc: Python WebSocket frame mask-key handling
    platforms: [linux, macos, windows]
    crit: notable
    conf: 0.8
    for: [python]
    # A bare `mask_key` identifier also names pandas boolean-mask lookups;
    # require the RFC 6455 4-byte key generation or its `key[i % 4]` XOR.
    if:
      type: text
      regex: '\bmask_key\b[^\n]{0,40}(urandom|randbytes|getrandbits|\[\s*i\s*%\s*4\])|\bget_mask_key\b'
