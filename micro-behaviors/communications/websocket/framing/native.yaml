# Fixed binary tunnel framing in native source.  The fields are protocol
# structure, not incident-specific strings: a message type, connection ID,
# flags, and payload length are the wire shape described in the report.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, pe, dll]
  attack: T1090
  mbc: C0003

traits:
  - id: native-frame-type-field
    desc: Native frame type field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(uint8_t|BYTE)\s+\w*type\b'
      case_insensitive: true

  - id: native-frame-connection-id-field
    desc: Native frame connection ID field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(uint32_t|DWORD)\s+\w*(conn_?id|connection_?id|id)\b'
      case_insensitive: true

  - id: native-frame-flags-field
    desc: Native frame flags field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(uint8_t|BYTE)\s+\w*flags\b'
      case_insensitive: true

  - id: native-frame-length-field
    desc: Native frame payload length field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(uint16_t|WORD)\s+\w*(data_?len|length)\b'
      case_insensitive: true

  - id: native-frame-switch
    desc: Native frame type switch
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bswitch\s*\(\s*\w{1,32}\.type\s*\)'

  - id: native-frame-open-case
    desc: Native frame open case
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '\bcase\s+1\s*:'

  - id: native-frame-data-case
    desc: Native frame data case
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '\bcase\s+3\s*:'

  - id: native-frame-keepalive-case
    desc: Native frame keepalive case
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '\bcase\s+5\s*:'

composite_rules:
  - id: native-fixed-frame-fields
    desc: Native fixed tunnel frame fields
    crit: notable
    conf: 0.96
    all:
      - id: native-frame-type-field
      - id: native-frame-connection-id-field
      - id: native-frame-flags-field
      - id: native-frame-length-field
    near_lines: 12

  - id: native-fixed-frame-dispatch
    desc: Native tunnel frame dispatch
    crit: notable
    conf: 0.94
    all:
      - id: native-frame-switch
      - id: native-frame-open-case
      - id: native-frame-data-case
      - id: native-frame-keepalive-case
    near_lines: 20

  - id: native-fixed-tunnel-frame
    desc: Native fixed binary tunnel frame and control dispatch
    crit: suspicious
    conf: 0.96
    all:
      - id: native-fixed-frame-fields
      - id: native-fixed-frame-dispatch
