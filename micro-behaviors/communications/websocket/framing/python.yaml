defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1090
  mbc: C0003

traits:
  - id: python-tunnel-frame-unpack
    desc: Python unpacks a fixed tunnel frame header
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: struct.unpack
      arg:
        kind: string
        regex: '^[<>=!]B[Ii]B[Hh]$'

  - id: python-frame-open-case
    desc: Python tunnel open case
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_type|frame_kind|message_type)\s*==\s*1'

  - id: python-frame-data-case
    desc: Python tunnel data case
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_type|frame_kind|message_type)\s*==\s*3'

  - id: python-frame-keepalive-case
    desc: Python tunnel keepalive case
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_type|frame_kind|message_type)\s*==\s*5'

  - id: python-tunnel-frame-length-receive
    desc: Receives payload by tunnel length
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '\.recv\s*\(\s*(data_length|payload_length|length)\s*\)'

composite_rules:
  - id: python-fixed-frame-dispatch
    desc: Python tunnel frame dispatch
    crit: notable
    conf: 0.95
    all:
      - id: python-frame-open-case
      - id: python-frame-data-case
      - id: python-frame-keepalive-case
    near_lines: 10

  - id: python-fixed-tunnel-frame
    desc: Python fixed binary tunnel frame and control dispatch
    crit: suspicious
    conf: 0.96
    all:
      - id: python-tunnel-frame-unpack
      - id: python-fixed-frame-dispatch
      - id: python-tunnel-frame-length-receive
