defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1090
  mbc: C0003

traits:
  - id: python-tunnel-frame-unpack
    desc: Python unpacks a fixed tunnel frame header
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: struct.unpack
      arg:
        kind: string
        regex: '^[<>=!]B[Ii](B)?[Hh]$'

  - id: python-tunnel-frame-struct
    desc: Python defines a fixed tunnel frame header
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: struct.Struct
      arg:
        kind: string
        regex: '^[<>=!]B[Ii](B)?[Hh]$'

  # 7-byte multiplexing header: 1-byte message type, 2-byte stream ID,
  # 4-byte payload length — the minimal frame relays use to carry many
  # tunneled connections over one WebSocket (TerminalFix-style tunnels).
  - id: python-type-stream-length-header
    desc: Packs type, stream ID, length header
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^struct\.(pack|unpack)$'
      arg:
        kind: string
        regex: '^[<>=!]?B[Hh][Ii]$'

  # C2-side remote termination ordered through the relay protocol itself
  # (TerminalFix-style tunnels exit via os._exit on MSG_SHUTDOWN).
  - id: relay-remote-shutdown-constant
    desc: Relay remote-shutdown message constant
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bMSG_(SHUTDOWN|TERMINATE)\b'

  - id: python-frame-open-case
    desc: Python tunnel open case
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_(type|kind)|message_type|\w*msg_type)\s*==\s*(1|MSG_(OPEN|CONNECT))\b'

  - id: python-frame-data-case
    desc: Python tunnel data case
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_(type|kind)|message_type|\w*msg_type)\s*==\s*(3|MSG_DATA)\b'

  - id: python-frame-keepalive-case
    desc: Python tunnel keepalive case
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_(type|kind)|message_type|\w*msg_type)\s*==\s*(5|MSG_PING)\b'

  - id: python-tunnel-frame-length-receive
    desc: Receives payload by tunnel length
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '\.recv\s*\(\s*(data_length|payload_length|length)\s*\)'

  - id: python-tunnel-frame-length-slice
    desc: Extracts payload using tunnel frame length
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bpayload\s*=\s*\w+\[[^\]\n]{1,60}:[^\]\n]{0,60}\w*(data|payload)_len(gth)?\s*\]'

composite_rules:
  - id: python-fixed-frame-dispatch
    desc: Python tunnel frame dispatch
    crit: notable
    conf: 0.95
    all:
      - id: python-frame-open-case
      - id: python-frame-data-case
      - id: python-frame-keepalive-case
    near_lines: 30

  - id: python-fixed-frame-header
    desc: Python fixed tunnel frame header
    crit: notable
    conf: 0.96
    any:
      - id: python-tunnel-frame-unpack
      - id: python-tunnel-frame-struct

  - id: python-framed-payload-extraction
    desc: Python extracts a length-framed payload
    crit: notable
    conf: 0.94
    any:
      - id: python-tunnel-frame-length-receive
      - id: python-tunnel-frame-length-slice

  - id: python-fixed-tunnel-frame
    desc: Python fixed binary tunnel frame and control dispatch
    crit: suspicious
    conf: 0.96
    all:
      - id: python-fixed-frame-header
      - id: python-fixed-frame-dispatch
      - id: python-framed-payload-extraction
