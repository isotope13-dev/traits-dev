defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: visible-tab-image-json-send
    desc: Visible-tab image passed to JSON send
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression function: (member_expression) @capture)
            property: (property_identifier) @then)
          arguments: (arguments (arrow_function
            parameter: (identifier) @frame
            body: (statement_block (expression_statement
              (binary_expression right: (call_expression
                function: (member_expression property: (property_identifier) @send)
                arguments: (arguments (call_expression
                  function: (member_expression) @json
                  arguments: (arguments (object (pair
                    key: (property_identifier) @field
                    value: (identifier) @sent)))))))))))) @relay
          (#match? @capture "^(chrome|browser)\\.tabs\\.captureVisibleTab$")
          (#eq? @then "then") (#eq? @send "send")
          (#eq? @json "JSON.stringify") (#eq? @field "data")
          (#eq? @frame @sent))
