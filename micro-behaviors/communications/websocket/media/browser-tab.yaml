defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: capture-visible-tab-to-send
    desc: Tab capture near socket send
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'captureVisibleTab\s*\([\s\S]{0,320}\.send\s*\('

  - id: capture-visible-tab-to-json
    desc: Tab capture near JSON.stringify
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'captureVisibleTab\s*\([\s\S]{0,320}JSON\.stringify\s*\('

composite_rules:
  # Binds WebExtension visible-tab capture directly to a JSON-serialized
  # WebSocket send in the same handler, covering Promise .then(), async/await,
  # and callback forms regardless of the JSON field name.
  - id: visible-tab-image-json-send
    desc: Visible-tab image passed to JSON send
    crit: notable
    conf: 0.96
    all:
      - id: capture-visible-tab-to-send
      - id: capture-visible-tab-to-json
    any:
      - id: micro-behaviors/communications/websocket/send::websocket-instance-send-call
      - id: micro-behaviors/communications/websocket/send::websocket-named-receiver-send
      - id: micro-behaviors/communications/websocket/send::member-ws-send-call
