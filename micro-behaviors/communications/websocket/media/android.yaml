# Android WebRTC screen streaming capability.  The API references are neutral
# on their own; the collection objective composes them with a remote endpoint
# and identity spoofing when the article's abuse pattern is present.
defaults:
  crit: notable
  platforms: [android]
  for: [java, kotlin, android_apk, zip]

traits:
  - id: android-webrtc-api-reference
    desc: Android WebRTC API reference
    conf: 0.92
    for: [java, kotlin]
    if:
      type: text
      regex: '(?i)\b(org\.webrtc|PeerConnectionFactory|PeerConnection|RTCPeerConnection)\b'

  - id: android-webrtc-screen-source-media
    desc: WebRTC Android screen-capturer API
    conf: 0.92
    for: [java, kotlin]
    if:
      type: text
      word: ScreenCapturerAndroid

  # `SurfaceTextureHelper` is org.webrtc's own capture-thread helper. The
  # alternation used to also accept a bare `ImageReader`, which names
  # `javax.imageio.ImageReader` on the JVM and so labelled ordinary server-side
  # image utilities as WebRTC screen sources; that generic frame surface now
  # lives package-qualified in hardware/display/camera/.
  - id: android-webrtc-surface-texture-helper
    desc: WebRTC SurfaceTextureHelper capture surface
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      word: SurfaceTextureHelper

  - id: android-webrtc-video-track-type
    desc: Android WebRTC video-track type
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: '\borg\.webrtc\.(VideoTrack|VideoSource|CapturerObserver)\b'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

  - id: android-webrtc-video-track-operation
    desc: WebRTC-named receiver adds track or sink
    conf: 0.9
    for: [java, kotlin]
    if:
      type: tree-sitter
      kind: call
      regex: '\b(peerConnection|videoTrack)\.add(Sink|Track)\s*\('
      case_insensitive: true

composite_rules:
  - id: android-webrtc-video-track-api
    desc: Android WebRTC video-track API
    conf: 0.9
    any:
      - id: android-webrtc-video-track-type
      - id: android-webrtc-video-track-operation

  - id: android-webrtc-screen-media-api-profile
    desc: WebRTC screen-capture and video-track APIs
    conf: 0.96
    all:
      - id: android-webrtc-api-reference
      - id: android-webrtc-screen-source-media
      - id: android-webrtc-video-track-api
    near_lines: 36

  # Endpoint co-occurrence does not bind media to the WebSocket or imply theft.
  - id: android-webrtc-screen-websocket-api-profile
    desc: Screen-media APIs beside WebSocket endpoint
    conf: 0.96
    all:
      - id: android-webrtc-screen-media-api-profile
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint
