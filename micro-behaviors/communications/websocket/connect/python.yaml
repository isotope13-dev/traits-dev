# The directly imported factory is recorded as create_connection, without its
# module receiver. Require a WebSocket URL at this call site; an import or an
# unrelated socket.create_connection call does not establish this operation.
defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: python-create-connection-ws-url
    desc: create_connection call targets a WebSocket URL
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: create_connection
      arg:
        index: 0
        kind: string
        regex: '^wss?://'
