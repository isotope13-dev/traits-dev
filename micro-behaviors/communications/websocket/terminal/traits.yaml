# The ttyd / GoTTY web-terminal wire protocol.
#
# These servers hand a browser a real PTY over a WebSocket: the client requests
# the `tty` subprotocol, sends a small JSON handshake carrying the credential,
# then writes keystrokes as opcode-prefixed frames — '0' is ttyd's INPUT
# opcode, '1' is GoTTY's. All three are neutral protocol mechanics, the same
# way a SOCKS greeting or an HTTP verb is; a terminal-sharing client, a test
# harness, and an exploitation script all speak them.
#
# Intent lives in objectives/execution/exploit/network-service/, which pairs the
# empty-credential handshake with hand-built input frames to describe a client
# driving somebody else's unauthenticated console.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, powershell, go, rust, java]
  mbc: C0002
  crit: notable
  conf: 0.9

traits:
  - id: web-terminal-tty-subprotocol
    desc: Requests the ttyd tty WebSocket subprotocol
    if:
      type: text
      regex: '(?i)\bsub[_-]?protocols?\b["'']?\s*[=:]\s*\[?\s*["'']tty["'']'

  # An empty AuthToken is the unauthenticated case: the server was published
  # without a credential, so the field is sent blank.
  - id: web-terminal-empty-auth-handshake
    desc: Web-terminal handshake sends empty auth token
    conf: 0.93
    if:
      type: text
      regex: '["'']AuthToken["'']\s*:\s*(""|'''')'

  # Hand-built frames: an opcode literal concatenated or interpolated onto the
  # command text. The vendors' own clients encode through a command enum
  # instead, so this distinguishes a client that drives the terminal from one
  # that renders it.
  - id: web-terminal-input-frame-concat
    desc: Concatenated ttyd terminal-input frame
    for: [python, javascript, typescript, shell, powershell, go, rust]
    if:
      type: text
      regex: '\b(send|write|WriteMessage)\s*\(\s*b?["''][01]["'']\s*\+\s*[^(]'

  - id: web-terminal-input-frame-format
    desc: Formatted ttyd terminal-input frame
    if:
      type: text
      regex: '\b(send|write|WriteMessage)\s*\(\s*f["''][01]\{'

composite_rules:
  - id: web-terminal-input-opcode-frame
    desc: Writes a raw ttyd/GoTTY terminal-input frame
    crit: notable
    conf: 0.9
    any:
      - id: web-terminal-input-frame-concat
      - id: web-terminal-input-frame-format
