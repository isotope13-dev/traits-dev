defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, java, javascript, typescript, go]
  attack: T1071.001
  mbc: C0002

traits:
  - id: websocket-java-type
    desc: Java WebSocket type reference
    conf: 0.86
    for: [java]
    if:
      type: text
      regex: '\b(import|extends|implements|new)\s+WebSocket(Session)?\b'

  - id: websocket-java-endpoint
    desc: WebSocket endpoint annotation
    conf: 0.86
    if:
      type: text
      substr: '@ServerEndpoint'

  - id: node-runtime-websocket-api-exposure
    desc: Exposes WebSocket through runtime object
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[[''\"]WebSocket[''\"]\]\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\s*(,|;)'

  - id: websocket-javascript-constructor
    desc: Calls a JavaScript WebSocket constructor
    conf: 0.86
    for: [javascript, typescript, html, php]
    if:
      type: text
      regex: '\bnew\s+([\w$]{1,40}\.){0,3}(WebSocket|ws(_[0-9]+)?\.default)\s*\('
      exclude_html_comments: true

  # Taking the endpoint host from `location` connects back to the serving
  # origin. This is shared by preview/HMR clients and malicious pages such
  # as AdFection stagers; it establishes neither benign nor malicious intent.
  - id: websocket-location-host-constructor
    desc: WebSocket constructed from the page's own origin
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new\s+WebSocket\s*\([^)\n]{0,120}\blocation\.(host|origin)\b'

  # Require a complete endpoint literal. An opening quote alone also matches
  # computed endpoints such as "wss://" + location.host, which do not embed a
  # peer. Interpolated templates likewise do not establish a literal endpoint.
  - id: websocket-literal-endpoint-constructor
    desc: Constructs a WebSocket from a literal endpoint
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new\s+WebSocket\s*\(\s*[''`"]wss?://[^''`"\s$]{1,512}[''`"]\s*[,)]'

  # Any emitter can take an open listener; the Baileys socket client drives
  # its post-connect side effects (including injected channel follows) from
  # `ws.on('open', ...)`, so the autonomous-trigger composites pair this
  # neutral registration with the protocol operations it dispatches.
  - id: ws-open-event-handler
    desc: Registers a WebSocket open event handler
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.(on|once)\s*\(\s*["'']open["'']'

composite_rules:
  - id: websocket-library-api-reference
    desc: WebSocket library or handler API reference
    conf: 0.88
    any:
      # A Python package import identifies a library dependency, not a C2
      # transport API reference. Require a connection operation for Python;
      # the import remains visible on its own through library/import traits.
      - id: micro-behaviors/communications/websocket/library::python-websocket-client
      - id: micro-behaviors/communications/websocket/library::python-websockets-client
      - id: micro-behaviors/communications/websocket/library::python-websocket-class-client
      - id: websocket-java-type
      - id: websocket-java-endpoint
      - id: websocket-javascript-constructor
