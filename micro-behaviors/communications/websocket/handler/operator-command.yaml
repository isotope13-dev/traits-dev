defaults:
  for: [javascript, typescript, html, python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: operator-command-event-handler
    desc: Operator command socket event handler
    if:
      type: text
      regex: '\.on\s*\(\s*["''](operator|telegram)[_-]command["'']\s*,'
  - id: update-user-record-emission
    desc: Socket user-record emission
    if:
      type: text
      regex: '\.emit\s*\(\s*["''](add|update)[_-]user["'']\s*,'
