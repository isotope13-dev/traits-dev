# Socket.IO client session registration and command-dispatch primitives.
# Neutral transport observations; phishing or C2 intent belongs in objectives/.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.92
  attack: T1071.001
  mbc: C0002

traits:
  - id: socketio-command-listener
    desc: Listens for Socket.IO command events
    if:
      type: text
      regex: '\.on\s*\(\s*["'']command["'']\s*,'

  - id: socketio-client-register-emit
    desc: Emits Socket.IO client register payload
    if:
      type: text
      regex: '\.emit\s*\(\s*["'']register["'']\s*,\s*\{'

  - id: socketio-window-io-call
    desc: Invokes global Socket.IO io client
    if:
      type: text
      regex: '\bwindow\.io(\.connect)?\s*\('

composite_rules:
  - id: socketio-register-command-loop
    desc: Socket.IO registers session and listens for commands
    conf: 0.94
    near_bytes: 1200
    all:
      - id: socketio-client-register-emit
      - id: socketio-command-listener

  - id: socketio-client-relay-channel
    desc: Socket.IO client registers and receives remote commands
    conf: 0.96
    all:
      - id: socketio-register-command-loop
    any:
      - id: micro-behaviors/communications/websocket/handler::socketio-url-connect
      - id: socketio-window-io-call
      - id: metadata/import/package::socketio-client-literal
