# Sending JSON task responses over a Go WebSocket connection is a neutral
# communication capability. Remote-control intent is inferred by objective
# composites that add file-task and execution evidence.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1071.001
  mbc: C0002

traits:
  - id: go-websocket-write-message
    desc: Go writes a WebSocket message
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.WriteMessage$'

composite_rules:
  - id: go-websocket-json-write-call
    desc: Go writes a JSON WebSocket message
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/serialize/json-write::go-write-json-method-call
      - id: micro-behaviors/communications/websocket/library::gorilla-websocket
