# A WebSocket agent can legitimately expose proxy or VPN handlers. These are
# communication capabilities; remote-control intent belongs in objective
# composites that add code execution, theft, or another hostile action.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1071.001
  mbc: C0002

traits:
  - id: python-agent-handler-registration
    desc: Python registers WebSocket message handlers
    conf: 0.95
    if:
      type: text
      regex: '\b(agent\.(on|register_handler)|@agent\.on)\s*\('

  - id: python-agent-tunnel-capability
    desc: Python agent registers tunnel capability
    conf: 0.95
    if:
      type: text
      regex: '(?i)capability\s*=\s*["''](proxy|tun|socks)["'']'

  - id: python-agent-tunnel-message-type
    desc: Python handles tunnel message types
    conf: 0.95
    if:
      type: text
      regex: '["'']type["'']\s*:\s*["''](tcp|udp|tun)_'

  - id: python-websocket-command-message-type
    desc: Python checks a WebSocket command message type
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'msg_type\s*==\s*["''](exec_command|execute_command|commands)["'']'

  - id: python-command-handler-call
    desc: Python calls a command handler
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'handle_commands?\s*\('

composite_rules:
  - id: python-websocket-command-dispatch
    desc: WebSocket agent routes command messages
    crit: notable
    conf: 0.95
    scope: file
    near_lines: 12
    all:
      - id: python-websocket-command-message-type
      - id: python-command-handler-call

  - id: python-websocket-tunnel-agent
    desc: Python WebSocket agent handles tunnel messages
    conf: 0.99
    scope: file
    all:
      - id: python-agent-handler-registration
      - id: python-agent-tunnel-message-type
