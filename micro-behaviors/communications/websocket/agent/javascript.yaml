# A WebSocket agent can legitimately expose proxy or automation handlers. These
# are communication capabilities; hostile intent belongs in objective rules
# that add concealment and a remote-capable action.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: websocket-pairing-code-session
    desc: WebSocket endpoint uses a pairing code
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '/ws/daemon/\$\{code\}'

  - id: js-gateway-url-config-fields
    desc: Gateway config contains a URL field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']gateway["'']\s*:\s*\{[\s\S]{0,120}["'']url["'']\s*:'

  - id: js-agent-upgrade-handler
    desc: JavaScript agent defines upgrade handler
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(["'']onUpgrade["'']|upgradeWhalentAgent)\s*\('
