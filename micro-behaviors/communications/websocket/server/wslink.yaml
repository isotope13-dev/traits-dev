defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: python-wslink-start-webserver
    desc: wslink server startup call
    conf: 0.95
    if:
      # Require the wslink import and its conventional server receiver.
      # A method named start_webserver on an unrelated object is insufficient.
      type: tree-sitter
      language: python
      query: |
        ((module
           (import_from_statement
             module_name: (dotted_name) @module
             name: (dotted_name) @server)
           [
             (expression_statement
               (call function: (attribute
                 object: (identifier) @receiver
                 attribute: (identifier) @method)) @evidence)
             (function_definition body: (block
               (expression_statement
                 (call function: (attribute
                   object: (identifier) @receiver
                   attribute: (identifier) @method)) @evidence)))
           ])
          (#eq? @module "wslink")
          (#eq? @server "server")
          (#eq? @receiver "server")
          (#eq? @method "start_webserver"))
