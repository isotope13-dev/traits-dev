# Node.js WebSocket Server-Side Patterns
# Detects faye-websocket and other server-side WebSocket libraries
# MBC: C0002 (Communication)
# ATT&CK: T1071.001 (Web Protocols)
defaults:
  platforms: [windows, unix]
  for: [javascript]
  mbc: C0002
  attack: T1071.001

traits:
  - id: faye-websocket-require
    desc: faye-websocket module import
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: require\(\s*['"]faye-websocket['"]\s*\)

  - id: websocket-is-websocket
    desc: WebSocket.isWebSocket() check
    crit: component
    conf: 0.85
    if:
      type: text
      substr: isWebSocket

  - id: upgrade-handler
    desc: HTTP upgrade event handler
    crit: component
    conf: 0.7
    if:
      type: text
      regex: \.on\(\s*['"]upgrade['"]

  - id: new-websocket-server
    desc: WebSocket server instance creation
    crit: component
    conf: 0.8
    if:
      type: text
      regex: new\s+WebSocket\s*\(request

  - id: websocket-message-handler
    desc: WebSocket message event handler
    crit: component
    conf: 0.7
    if:
      type: text
      regex: \b(ws|websocket|wsserver|wss)\.on\(\s*['"]message['"]
      case_insensitive: true

  - id: websocket-send
    desc: WebSocket send() call
    crit: component
    conf: 0.6
    if:
      type: text
      regex: \b(ws|websocket|wsserver|wss)\.send\s*\(
      case_insensitive: true

  - id: ws-handle-upgrade-call
    desc: ws library completes the WebSocket handshake
    crit: component
    conf: 0.75
    if:
      type: text
      regex: \.handleUpgrade\s*\(

  - id: upgrade-401-response
    desc: HTTP 401 written to upgrade socket
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'HTTP/1\.\d\s+401\b'

composite_rules:
  # A real HTTP 401 written to the raw socket, before the handshake completes
  # (`handleUpgrade`), is a server rejecting an unauthenticated upgrade
  # attempt -- the concrete implementation of "log in before you get a
  # terminal" that distinguishes an authenticated remote-terminal product
  # (ttyd/code-server/termdock style, password- or cookie-gated) from a
  # WebSocket-PTY backdoor, which never checks anything before spawning a
  # shell. Package-wide: the gate usually lives in the server bootstrap file,
  # not the route module that spawns the PTY.
  - id: authenticated-websocket-upgrade-gate
    desc: WebSocket upgrade rejects unauthenticated clients
    crit: notable
    conf: 0.95
    scope: archive
    near_lines: 60
    all:
      - id: upgrade-401-response
      - id: ws-handle-upgrade-call

  - id: node-websocket-server
    desc: Node.js WebSocket server implementation
    crit: notable
    conf: 0.9
    all:
      - id: faye-websocket-require
      - id: websocket-is-websocket
    any:
      - id: upgrade-handler
      - id: new-websocket-server
      - id: websocket-message-handler
      - id: websocket-send
