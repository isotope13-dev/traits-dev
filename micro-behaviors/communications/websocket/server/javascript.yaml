# Socket.IO server usage is a neutral realtime-web capability.  C2 and RAT
# objectives must add command, collection, or other intent-specific evidence.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: socketio-server-import
    desc: Imports the Socket.IO server library
    if:
      type: text
      regex: 'require\s*\(\s*["'']socket\.io["'']\s*\)'
