# Loopback WebSocket use is neutral by itself.  These atoms make the local
# service targeting and binary-stage shape available to an exploit objective.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  attack: T1071.001

traits:
  - id: loopback-websocket-service-url
    desc: WebSocket connection to a loopback service
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bwss?://(localhost|127(\.\d{1,3}){3}|\[?::1\]?)(:\d{1,5})?([/''"?#]|$)'

  - id: websocket-version-method
    desc: WebSocket calls a service version method
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'wss?://(localhost|127\.0\.0\.1|\[?::1\]?)[\s\S]{0,128}\bgetVersion\b'
      case_insensitive: true

  - id: websocket-check-version-method
    desc: WebSocket checks a service version
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'wss?://(localhost|127\.0\.0\.1|\[?::1\]?)[\s\S]{0,128}\bcheckVersion\b'
      case_insensitive: true

  - id: websocket-version-info-method
    desc: WebSocket reads service version information
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'wss?://(localhost|127\.0\.0\.1|\[?::1\]?)[\s\S]{0,128}\bversionInfo\b'
      case_insensitive: true

  - id: websocket-version-field
    desc: WebSocket reads an installed version field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'wss?://(localhost|127\.0\.0\.1|\[?::1\]?)[\s\S]{0,128}\binstalledVersion\b'
      case_insensitive: true

  - id: websocket-product-version-field
    desc: WebSocket reads a product version field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'wss?://(localhost|127\.0\.0\.1|\[?::1\]?)[\s\S]{0,128}\bproductVersion\b'
      case_insensitive: true

  # The receiver has to look like a socket. A bare `.send(<typed array>)`
  # matched emscripten's `xhr.send(null); return new Uint8Array(b.response)`
  # -- an XMLHttpRequest *receiving* bytes, with no WebSocket anywhere.
  - id: websocket-typed-buffer-send
    desc: WebSocket sends a typed binary buffer
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b(ws|socket|sock)\w{0,8}\.send\s*\([\s\S]{0,60}(Uint8Array|ArrayBuffer)\b'

  - id: websocket-shellcode-send
    desc: WebSocket sends a shellcode buffer
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)\b(ws|socket|sock)\w{0,8}\.send\s*\([\s\S]{0,60}\bshellcode\b'

composite_rules:
  - id: websocket-version-probe
    desc: WebSocket probes a service version
    crit: notable
    conf: 0.92
    any:
      - id: websocket-version-method
      - id: websocket-check-version-method
      - id: websocket-version-info-method
      - id: websocket-version-field
      - id: websocket-product-version-field

  - id: websocket-binary-stage-send
    desc: WebSocket sends a binary stage
    crit: notable
    conf: 0.95
    any:
      - id: websocket-typed-buffer-send
      - id: websocket-shellcode-send
