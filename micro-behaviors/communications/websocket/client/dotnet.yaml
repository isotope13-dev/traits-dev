traits:
- conf: 0.82
  id: client-websocket
  desc: .NET ClientWebSocket class usage
  if:
    type: text
    word: ClientWebSocket
  unless:
  - type: basename
    regex: \.winmd$
  - type: basename
    regex: ^System\.Net\.WebSockets(\.Client)?\.dll$
  - id: metadata/file/extension/identity::netstandard-dll-basename
composite_rules:
- conf: 0.86
  id: websocket-connect-async
  desc: .NET ClientWebSocket ConnectAsync usage
  all:
  - id: micro-behaviors/communications/websocket/client::client-websocket
  - id: micro-behaviors/communications/socket/connect::dotnet-connect-async-method-token
- conf: 0.9
  id: dotnet-client-websocket
  desc: .NET ClientWebSocket API cluster
  all:
  - id: micro-behaviors/communications/websocket/client::client-websocket
  any:
  - id: micro-behaviors/communications/websocket/client::websocket-connect-async
  - id: micro-behaviors/communications/websocket/send::websocket-send-async
  - id: micro-behaviors/communications/websocket/receive::websocket-receive-async
  - id: micro-behaviors/communications/websocket/framing::websocket-message-type
  - id: micro-behaviors/communications/websocket/library::websocket-state
  needs: 2
defaults:
  platforms:
  - windows
  for:
  - pe
  - csharp
  mbc: C0002
  crit: notable
