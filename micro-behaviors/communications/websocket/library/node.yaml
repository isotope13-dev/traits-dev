defaults:
  platforms:
    - unix
    - windows
  for: [javascript, typescript, scripts, binaries]
traits:
  - id: ws
    desc: Node.js uses the ws WebSocket library
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(node_modules/.{0,30}/ws/index\.js|(from|require\s*\()\s*["'']ws["''])'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: socketio-reconnect-attempts
    desc: Socket.IO reconnection attempts config
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: reconnectionAttempts
  - id: socketio-reconnect-delay
    desc: Socket.IO reconnection delay config
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: reconnectionDelay
