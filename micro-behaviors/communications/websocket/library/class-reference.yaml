defaults:
  platforms: [unix, windows]
traits:
  - id: websocket-class-reference
    desc: WebSocket class reference
    crit: notable
    conf: 0.5
    for: [scripts, "!shell", binaries, pe, dll]
    if:
      type: text
      regex: '(?i)\b(class\s+WebSocket|WebSocket(App|Server)?\s*(\(|\.))'
    not:
      - regex: (?i)disabled-by-default
    unless:
      - id: metadata/lang/javascript-features::closure-externs-annotation
      - id: metadata/lang/scripted::dts-declaration-file
