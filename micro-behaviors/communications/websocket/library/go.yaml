defaults:
  platforms:
    - windows
    - unix
  for:
    - binaries
    - go
    - go.mod
  attack: T1071.001
  mbc: C0002
traits:
  - id: gorilla-websocket
    desc: Imports the Gorilla WebSocket library
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: import
      exact: github.com/gorilla/websocket
  - id: nhooyr-websocket
    desc: Imports the nhooyr WebSocket library
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: import
      exact: nhooyr.io/websocket
  - id: golang-websocket
    desc: Imports the x/net WebSocket library
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: import
      exact: golang.org/x/net/websocket
  - id: gorilla-websocket-module-marker
    desc: Gorilla WebSocket dependency path marker
    crit: notable
    conf: 0.9
    for: [go.mod, binaries]
    if:
      type: text
      substr: github.com/gorilla/websocket
  - id: nhooyr-websocket-module-marker
    desc: nhooyr WebSocket dependency path marker
    crit: notable
    conf: 0.9
    for: [go.mod, binaries]
    if:
      type: text
      substr: nhooyr.io/websocket
  - id: golang-websocket-module-marker
    desc: x/net WebSocket dependency path marker
    crit: notable
    conf: 0.9
    for: [go.mod, binaries]
    if:
      type: text
      substr: golang.org/x/net/websocket
  - id: go-websocket-conn-type
    desc: References a Go WebSocket connection type
    crit: notable
    conf: 0.7
    for: [go, binaries]
    if:
      type: text
      regex: '\*websocket\.(Conn|Dialer|proxy_Dialer|proxy_socks5)\b'
composite_rules:
  - id: go-websocket-library
    desc: Uses a WebSocket library in Go
    crit: notable
    conf: 0.8
    any:
      - id: gorilla-websocket
      - id: nhooyr-websocket
      - id: golang-websocket
      - id: gorilla-websocket-module-marker
      - id: nhooyr-websocket-module-marker
      - id: golang-websocket-module-marker
