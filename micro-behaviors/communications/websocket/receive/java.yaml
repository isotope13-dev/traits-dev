# JVM WebSocket callbacks are shared across desktop Java and Android/Kotlin.
# The generic callback stays a component; pairing it with the OkHttp listener
# import identifies a concrete client-side WebSocket receive surface.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin]
  crit: notable
  conf: 0.96
  attack: T1071.001

traits:
  - id: okhttp-websocket-listener-import
    desc: Imports OkHttp WebSocket listener
    if:
      type: symbol
      kind: import
      exact: okhttp3.WebSocketListener

  - id: jvm-onmessage-function
    desc: JVM onMessage callback
    crit: component
    for: [class, java, kotlin]
    if:
      type: symbol
      kind: function
      exact: onMessage

composite_rules:
  - id: okhttp-message-handler-source
    desc: Receives an OkHttp WebSocket message
    crit: notable
    conf: 0.98
    all:
      - id: okhttp-websocket-listener-import
      - id: jvm-onmessage-function
