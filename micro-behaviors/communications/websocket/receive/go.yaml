defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1071.001
  mbc: C0002

traits:
  - id: go-websocket-read-message
    desc: Go reads a WebSocket message
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.ReadMessage$'
