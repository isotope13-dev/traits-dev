defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  attack: T1071.001

traits:
  - id: websocket-message-event-handler
    desc: WebSocket or tunnel message event handler
    if:
      type: text
      # `tunnel` is the conventional receiver name for controller-backed
      # WebSocket relays; the other names cover the hand-written forms.  Keep
      # this receiver list narrow so generic EventEmitter handlers do not
      # become WebSocket traits.
      regex: '\b(ws(server)?|websocket|wss|tunnel)\s*\.\s*on\s*\(\s*["'']message["'']'

  - id: websocket-registered-handler
    desc: Registers WebSocket event handler
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(client|socket|connection)\.registerHandler\s*\('

  - id: terminal-input-event-marker
    desc: Terminal-input event marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'event\.type\s*===\s*["'']terminal_input["'']'

  - id: terminal-input-handler-call
    desc: Terminal-input handler receives event payload
    crit: notable
    conf: 0.96
    attack: T1059.007
    if:
      type: text
      regex: 'handleTerminalInput\s*\(\s*event\.payload'

  - id: create-pty-task-event-marker
    desc: Create-PTY task event marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'event\.type\s*===\s*["'']create_pty_task["'']'

  - id: create-pty-task-handler-call
    desc: Create-PTY handler receives event payload
    crit: notable
    conf: 0.96
    attack: T1059.007
    if:
      type: text
      regex: 'handleCreatePtyTask\s*\(\s*event\.payload'

composite_rules:
  - id: terminal-input-event-dispatch
    desc: Dispatches terminal input event
    crit: notable
    conf: 0.98
    attack: T1059.007
    all:
      - id: terminal-input-event-marker
      - id: terminal-input-handler-call
    near_bytes: 256

  - id: create-pty-task-event-dispatch
    desc: Dispatches create-PTY task event
    crit: notable
    conf: 0.98
    attack: T1059.007
    all:
      - id: create-pty-task-event-marker
      - id: create-pty-task-handler-call
    # The daemon validates the same event once during shutdown and once during
    # normal dispatch, so its two markers are separated by that guard branch.
    near_bytes: 2048
