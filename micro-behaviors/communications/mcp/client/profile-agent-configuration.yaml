defaults:
  for: [javascript, typescript, python, lua, markdown]
  platforms: [unix, windows]
  crit: notable
composite_rules:
  - id: mcp-package-launcher-configuration
    desc: MCP configuration names a package launcher
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/mcp/client::mcp-client-config-key--mcpservers
    any:
      - id: well-known/lib/development/npx::config-command-npx
      - id: well-known/tool/development/cli/npm-cli::config-command-npm-exec
  - id: claude-mcp-api-user-scope-registration
    desc: Claude MCP user-scope command arguments
    crit: notable
    conf: 0.95
    for: [python]
    near_bytes: 200
    all:
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::claude-mcp-api-command
      - id: micro-behaviors/process/argument/option::user-scope-argument-text
  - id: claude-mcp-user-scope-registration
    desc: Claude MCP user-scope command text or arguments
    crit: notable
    conf: 0.95
    for: [python, shell]
    any:
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::claude-mcp-cli-add-user-scope
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::claude-mcp-cli-remove-user-scope
      - id: micro-behaviors/communications/mcp/client::claude-mcp-api-user-scope-registration
