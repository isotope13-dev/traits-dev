# Configuration references and command schemas do not by themselves establish a client connection.
---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: mcp-client-config-doc
  desc: MCP client config documentation
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: mcp\.json\.example|MCP config examples?
- id: mcp-client-config-key--mcpservers
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  - shell
  - json
  - yaml
  desc: MCP client config key (mcpServers)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: mcpServers
- id: mcp-client-config-key--mcp-servers-toml
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  - shell
  - json
  - yaml
  desc: MCP server configuration key syntax
  crit: notable
  conf: 0.9
  ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
  if:
    type: text
    regex: (\[mcp_servers[.\]]|["']mcp_servers["']\s*[:=]\s*\{)
- id: mcp-client-config-key--modelcontextprotocolservers
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  - shell
  - json
  - yaml
  desc: MCP client config (modelContextProtocolServers)
  crit: notable
  conf: 0.9
  if:
    type: text
    word: modelContextProtocolServers
- id: mcp-server-command-args-fields
  desc: MCP server command and argument fields
  conf: 0.88
  ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
  if:
    type: text
    regex: (?i)(mcpServers|\bmcp\b).{0,300}\bcommand["']?\s*:.{0,200}\bargs\b
- id: mcp-toml-stdio-command-field
  desc: MCP server TOML command field
  crit: notable
  conf: 0.93
  for:
  - python
  - text
  - c
  - javascript
  - typescript
  - markdown
  if:
    type: text
    regex: mcpServers\.[A-Za-z0-9_.-]{1,64}\][\s\S]{0,240}\bcommand\s*=
- id: mcp-toml-stdio-args-field
  desc: MCP server TOML args field
  crit: notable
  conf: 0.92
  for:
  - python
  - text
  - c
  - javascript
  - typescript
  - markdown
  if:
    type: text
    regex: mcpServers\.[A-Za-z0-9_.-]{1,64}\][\s\S]{0,320}\bargs\s*=
- id: mcp-toml-http-url-field
  desc: MCP server TOML HTTP URL field
  crit: notable
  conf: 0.93
  for:
  - python
  - text
  - c
  - javascript
  - typescript
  - markdown
  if:
    type: text
    regex: mcpServers\.[A-Za-z0-9_.-]{1,64}\][\s\S]{0,240}\burl\s*=\s*["']https?://
- id: python-mcp-server-env-config-reference
  desc: References MCP server environment configuration
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: mcp_servers\.[A-Za-z0-9_.-]+\.env|mcpServers[\s\S]{0,160}["']env["']
- id: mcp-serve-args-field
  desc: MCP serve argument field
  conf: 0.9
  ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
  if:
    type: text
    regex: '["'']mcp["''][\s\S]{0,80}["'']serve["'']'
- id: mcp-servers-config-key-access
  desc: mcpServers key or property text
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    regex: '["'']mcpServers["'']\s*:|\.mcpServers\b'
composite_rules:
- id: mcp-client-config-key
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  - shell
  - json
  - yaml
  desc: MCP client config key
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/communications/mcp/client::mcp-client-config-key--mcpservers
  - id: micro-behaviors/communications/mcp/client::mcp-client-config-key--mcp-servers-toml
  - id: micro-behaviors/communications/mcp/client::mcp-client-config-key--modelcontextprotocolservers
- id: mcp-client-config-reference
  desc: MCP client configuration reference
  crit: component
  conf: 0.92
  any:
  - id: micro-behaviors/communications/mcp/client::mcp-client-config-key
  - id: micro-behaviors/communications/mcp/client::mcp-client-config-doc
  - id: micro-behaviors/communications/mcp/client::mcp-client-package-registry
- id: mcp-server-command-schema
  desc: MCP server command schema
  crit: notable
  conf: 0.91
  ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
  near_lines: 30
  all:
  - id: micro-behaviors/communications/mcp/client::mcp-server-command-args-fields
  - id: micro-behaviors/communications/mcp/client::mcp-serve-args-field
