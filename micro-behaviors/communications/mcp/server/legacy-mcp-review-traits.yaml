---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: mcp-or-stdio-server-constructor
  desc: MCP server or stdio transport constructor text
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: new\s+[^\n=;]{0,40}(McpServer|StdioServerTransport)(\s*\(|['"]\])
- id: mcp-sdk-server-module-import
  desc: MCP server SDK module path literal
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    exact: "@modelcontextprotocol/sdk/server/mcp.js"
- id: fastmcp-import
  desc: Imports FastMCP server API
  conf: 0.85
  for:
  - python
  if:
    type: symbol
    kind: import
    regex: "^(FastMCP|mcp\\.server\\.fastmcp)$"
- id: fastmcp-stdio-transport
  desc: mcp.run stdio transport call text
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: mcp\.run\([^)]{0,80}transport\s*=\s*["']stdio["']
- id: python-mcp-server-call-tool
  desc: mcp_server.call_tool call
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: symbol
    kind: call
    exact: mcp_server.call_tool
composite_rules:
- id: tool-registration-mcp-or-stdio-clues
  desc: Tool registration and MCP or stdio server clues
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  all:
  - id: metadata/lang/source/syntax/call/invocation::tool-method-call-syntax
  any:
  - id: micro-behaviors/communications/mcp/server::mcp-or-stdio-server-constructor
  - id: micro-behaviors/communications/mcp/server::mcp-sdk-server-module-import
- id: python-mcp-shell-file-http-tool-surface
  desc: MCP server call and shell, file and HTTP tool-name evidence
  crit: suspicious
  conf: 0.99
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/communications/mcp/server::python-mcp-server-call-tool
  - id: metadata/lang/source/naming/action/process::python-shell-exec-tool-name
  - id: micro-behaviors/fs/write/file/unspecified::python-file-write-tool-name
  - id: micro-behaviors/communications/http/client/reference::python-http-request-tool-name
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
- id: python-mcp-interpreter-tool
  desc: MCP import, tool decorator and Python interpreter evidence
  crit: notable
  conf: 0.98
  for:
  - python
  all:
  - id: micro-behaviors/communications/mcp/server::fastmcp-import
  - id: micro-behaviors/data/control-flow/dispatch/tool-call::python-tool-decorator
  - id: micro-behaviors/process/argument/interpreter::python-interpreter-code-argument
- id: python-mcp-file-interpreter-tool
  desc: MCP import, tool decorator and interpreter file argument evidence
  crit: notable
  conf: 0.96
  for:
  - python
  all:
  - id: micro-behaviors/communications/mcp/server::fastmcp-import
  - id: micro-behaviors/data/control-flow/dispatch/tool-call::python-tool-decorator
  - id: metadata/lang/source/syntax/argument::python-interpreter-file-argv-fragment
- id: python-mcp-http-shell-dispatch
  desc: HTTP endpoint and shell server call references
  crit: notable
  conf: 0.98
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/server/request::http-post-endpoint
  - id: micro-behaviors/communications/http/server/framework::fastapi-import
  - id: micro-behaviors/communications/mcp/server::python-mcp-server-call-tool
  - id: metadata/import/module::python-shell-server-import
