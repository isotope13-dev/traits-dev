defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: mcp-private-key-tool-input-schema
    desc: MCP tool schema accepts private key material
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)(private key|key material).{0,240}\bkey\s*:\s*\{\s*type\s*:\s*[\x27\x22]string'
  - id: mcp-call-handler-forwards-tool-arguments
    desc: MCP tools/call forwards arguments to collector
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'setRequestHandler\s*\(\s*["'']tools/call["''][\s\S]{0,900}arguments\s*:\s*args'
