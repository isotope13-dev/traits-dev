defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: mcp-destructive-tool-annotation
    desc: Tool annotation sets destructiveHint true
    conf: 0.99
    if:
      type: text
      regex: '\bannotations\s*:\s*\{[^}\r\n]{0,180}\bdestructiveHint\s*:\s*true\b'

