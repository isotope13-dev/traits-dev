defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: nping
    desc: nping packet generator
    if:
      type: text
      word: nping
  - id: tcp-mode
    desc: nping TCP packet mode
    if:
      type: text
      substr: --tcp -p
  - id: flags-option
    desc: nping TCP flags option
    # Require actual TCP-flag values after --flags; a bare `--flags` token is a
    # generic CLI option (arg-parsers, help text) and not nping-specific.
    for: [scripts]
    if:
      type: text
      case_insensitive: true
      regex: '--flags[ =]+(SYN|ACK|RST|FIN)'
  - id: source-port
    desc: nping spoofed source port
    crit: component
    conf: 0.85
    if:
      type: text
      substr: --source-port
  - id: payload-data
    desc: nping packet data payload
    crit: component
    conf: 0.85
    if:
      type: text
      substr: --data=

  # Three or more TCP flags asserted on one packet. The pairs that show up this
  # way -- RST with PSH, FIN with RST, anything carrying URG or CWR -- are
  # combinations no TCP stack produces, so the packet exists to be recognised
  # rather than to be answered. Two flags is still ordinary (SYN,ACK and
  # FIN,ACK are how TCP works); three is where the crafting starts.
  - id: multi-flag-option
    desc: nping sets three or more TCP flags
    conf: 0.92
    for: [scripts]
    if:
      type: text
      case_insensitive: true
      regex: '--flags[ =]+[a-z]{2,3},[a-z]{2,3},[a-z]{2,3}'

  # One packet, carrying a payload, on a single invocation. This is what
  # separates a knock from a scan: a scan sweeps and has nothing to say, while
  # a knock says one specific thing once. Matched as a single expression so the
  # count and the payload have to belong to the same command line rather than
  # merely appear in the same file.
  - id: single-packet-payload
    desc: nping sends one packet carrying a payload
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '--data=\S+\s+-c\s+1\b'
