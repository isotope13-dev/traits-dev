defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: speedtest
    desc: speedtest utility
    if:
      type: text
      substr: speedtest
  - id: ookla-config-endpoint
    desc: Speedtest client configuration endpoint
    if:
      type: text
      substr: /speedtest-config.php
  - id: ookla-server-list-endpoint
    desc: Speedtest server list endpoint
    if:
      type: text
      substr: /speedtest-servers-static.php
  - id: network-speed-download-check
    desc: Calls network speed download check
    for: [javascript, typescript]
    conf: 0.95
    if:
      type: symbol
      kind: call
      substr: .checkDownloadSpeed
  # NOTE: `large-speedtest-upload` (`Content-Length:\s*[0-9]{8,}`) moved to
  # micro-behaviors/communications/http/header/content-length::large-content-length-header.
  # The matcher only reads an HTTP Content-Length value; nothing about it is
  # Speedtest-specific, so it labelled any captured HTTP response with a large
  # body (a 94 MB download logged in the CPAN.pm changelog) a bandwidth probe.
  # The Speedtest composite still consumes it as one leg beside the Ookla
  # endpoint atoms above.
