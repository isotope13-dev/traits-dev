defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]

traits:
  - id: network-flood-status-marker
    desc: Network flood operation status string
    crit: notable
    conf: 0.85
    for: [scripts, c, cpp]
    if:
      type: text
      regex: (?i)starting flood

  - id: udp-flood-function
    desc: UDP flood function name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: udp_flood
