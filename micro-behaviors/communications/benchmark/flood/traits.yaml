defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]

traits:
  - id: network-flood-status-marker
    desc: Network flood operation status string
    crit: notable
    conf: 0.85
    for: [scripts, c, cpp]
    if:
      type: text
      regex: (?i)starting flood

  - id: udp-flood-function
    desc: UDP flood function name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: udp_flood

  - id: go-connection-dropper-symbol
    desc: Go connection-dropper routine symbol
    crit: notable
    conf: 0.96
    platforms: [linux]
    for: [elf]
    if:
      type: text
      exact: main.connectionDropper
      section: .gopclntab

  - id: go-flood-rate-statistics
    desc: Go flood request-rate statistics format
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [elf]
    if:
      type: raw
      regex: 'STATS: sent=%d\(\+%d\)( killed=%d)? err=%d(\(\+%d\))? rps=%.0f'
      section: .rodata

  - id: go-reset-flood-rate-statistics
    desc: Go reset-flood request-rate statistics format
    crit: notable
    conf: 0.99
    platforms: [linux]
    for: [elf]
    if:
      type: raw
      substr: 'STATS: resets=%d(+%d) err=%d rps=%.0f'
      section: .rodata
