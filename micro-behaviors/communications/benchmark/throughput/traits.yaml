# Throughput-rate figures in text (pps/bps/qps). Network performance
# vocabulary shared by benchmark tooling, serving frameworks, observability
# configs and DDoS flood engines alike; the impact/dos composites reference
# these atoms and supply the attack context.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  crit: component

traits:
  - id: throughput-rate-figure-text
    desc: Throughput rate figure in text
    conf: 0.7
    if:
      type: text
      case_insensitive: true
      regex: \b[0-9]+(\.[0-9]+)?(\s+|[=:]\s*)(pps|bps|qps)\b
    unless:
      # In an H.264/AVC video codec, "PPS" is a Picture Parameter Set, not
      # packets-per-second — e.g. openh264's "Cannot write more than 255 PPS
      # into avcC box". Any binary bundling a video decoder (ImageMagick,
      # ffmpeg) has these strings.
      - type: text
        word: baudrate
      # Modem/telephony tables commonly enumerate V-series baud rates beside
      # values such as "300 bps (V.21)"; these are protocol metadata, not
      # packet-rate telemetry.
      - type: text
        regex: '\bV\.[0-9]{2}\b'
      - id: metadata/library/structure::js-emscripten-generated-bundle
      - id: brave-free-provider-marker
      - id: well-known/lib/media/sharp-libvips/
  - id: brave-free-provider-marker
    desc: Brave provider performance metric marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: brave_free
  - id: throughput-rate-assignment-text
    desc: Throughput rate assignment in text
    conf: 0.7
    if:
      type: text
      case_insensitive: true
      regex: \b(pps|bps|qps)\s*[=:]\s*[0-9]+
    unless:
      # Modem/telephony tables commonly enumerate V-series baud rates beside
      # values such as "300 bps (V.21)"; these are protocol metadata, not
      # packet-rate telemetry.
      - type: text
        regex: '\bV\.[0-9]{2}\b'

composite_rules:
  - id: throughput-rate-figure
    desc: Throughput rate figure for pps, bps, or qps
    crit: notable
    conf: 0.7
    any:
      - id: throughput-rate-figure-text
      - id: throughput-rate-assignment-text
    unless:
      - id: metadata/library/finance
      - id: brave-free-provider-marker
      - id: well-known/lib/media/sharp-libvips/
      - id: metadata/library/structure::js-emscripten-generated-bundle
      - id: well-known/tool/development/anthropic-claude-agent/
      - id: well-known/app/data/mysqltuner::mysqltuner-source-path
