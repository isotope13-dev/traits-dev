# Anchored to command/argv position rather than a bare `\biperf\b` token. The
# unanchored form claimed "runs a bandwidth test" for any file that merely
# named the tool in prose — docs, comments, or an LLM prompt template listing
# benchmarking utilities — none of which invoke it.
# The trailing argument requirement closes the same class one level deeper:
# NEC's ground card writes `IPERF=0`, and an indented docstring line beginning
# with that token matched the `^`-anchored bare-word form. A real run always
# carries an argument (`iperf -s`, `iperf -c host`); `IPERF=0` assigns rather
# than invokes, so the argument position rejects `=`.
defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: iperf
    desc: iperf bandwidth test invocation
    if:
      type: text
      regex: '(?im)(^|[;&|"''\[])\s*(sudo\s+)?iperf\s+[^\s=]'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: iperf3
    desc: iperf3 bandwidth test invocation
    if:
      type: text
      regex: '(?im)(^|[;&|"''\[])\s*(sudo\s+)?iperf3\s+[^\s=]'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
