defaults:
  platforms: [windows, unix]
  for: [zip, tar, python, markdown]
  crit: component
  conf: 0.9
composite_rules:
  - id: agent-skill-multi-host-sensitive-collection
    desc: Agent skill, SCP and sensitive path clues
    crit: suspicious
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-root-manifest-member
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
      - id: micro-behaviors/os/sysinfo/profile::python-platform-query-combination
      - id: micro-behaviors/communications/ssh/transfer::scp-command
    any:
      - id: micro-behaviors/fs/path/token::claude-directory-token-reference
      - id: micro-behaviors/fs/path/credential::claude-directory-credential-reference
      - id: micro-behaviors/fs/path/secret-config::aws-config-directory-literal

