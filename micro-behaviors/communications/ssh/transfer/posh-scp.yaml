defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: posh-scp-upload-command
    desc: Posh-SSH SCP upload command
    if:
      type: text
      regex: '(?i)(\b|\\[nr])Set-SCPItem[ \t]+-'

  # Native carriers may omit long scripts from extracted strings. Require
  # the concrete command/parameter structure on that byte-scan surface.
  - id: native-posh-scp-upload-command
    desc: Posh-SSH SCP upload command with host
    for: [pe, elf, macho]
    if:
      type: raw
      regex: '(?i)\bSet-SCPItem[ \t]+-ComputerName\b'

composite_rules:
  - id: posh-scp-upload
    desc: Posh-SSH SCP upload command
    for: [scripts, source, binaries]
    any:
      - id: posh-scp-upload-command
      - id: native-posh-scp-upload-command
