defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: bun-scp-stdin-source
    desc: Bun invokes SCP with stdin as source
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      kind: call
      regex: 'Bun(\.spawnSync|\["spawnSync"\])\(\["scp",.{0,80}"/dev/stdin"'

  - id: bun-scp-stdin-transfer
    desc: Bun invokes scp with stdin source
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (subscript_expression object: (identifier) @runtime
              index: (string (string_fragment) @method))
            (member_expression object: (identifier) @runtime
              property: (property_identifier) @method)]
          arguments: (arguments . (array . (string (string_fragment) @command)
            (string (string_fragment) @source)))
          (#eq? @runtime "Bun")
          (#match? @method "^spawn(Sync)?$")
          (#eq? @command "scp")
          (#eq? @source "/dev/stdin")) @match
  - id: bun-ssh-bash-command
    desc: Bun invokes SSH with Bash command
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (subscript_expression object: (identifier) @runtime
              index: (string (string_fragment) @method))
            (member_expression object: (identifier) @runtime
              property: (property_identifier) @method)]
          arguments: (arguments . (array . (string (string_fragment) @command)
            (binary_expression left: (binary_expression
              right: (string (string_fragment) @shell)))))
          (#eq? @runtime "Bun")
          (#match? @method "^spawn(Sync)?$")
          (#eq? @command "ssh")
          (#match? @shell "&& bash ")) @match
