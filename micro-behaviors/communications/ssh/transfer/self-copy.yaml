defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: scp-variable-temp-upload
    desc: SCP uploads variable source to remote temp
    conf: 0.97
    if:
      type: text
      regex: '\bscp\s[^\n]{0,260}\s\$\w+\s+\w+@\$\w+:/tmp/\$\w+'
  - id: ssh-temp-execute
    desc: SSH executes variable payload in temp
    conf: 0.97
    if:
      type: text
      regex: 'ssh\s[^\n]{0,300}"cd /tmp && chmod \+x \$\w+ && bash -c ./\$\w+'
