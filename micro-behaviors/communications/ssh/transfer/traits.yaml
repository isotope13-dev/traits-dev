defaults:
  platforms: [unix, windows]
  for: [python, shell]
  crit: notable
  conf: 0.85

traits:
  - id: sftp-open
    desc: Opens an SFTP transfer session
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open_sftp$'

  - id: sftp-put
    desc: Uploads a file over SFTP
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      exact: sftp.put

  - id: sftp-get
    desc: Downloads a file over SFTP
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      exact: sftp.get

  - id: scp-command
    desc: scp command invocation
    if:
      type: text
      regex: '(?i)(^|[\s"''\[;&|])scp(\.exe)?([\s"''`,;]|$)'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context

  - id: scp-remote-temp-upload
    desc: SCP uploads file to remote temp
    crit: notable
    conf: 0.92
    attack: T1021.004,T1105
    platforms: [unix]
    for: [shell, python, rust, go, c, cpp, elf]
    if:
      type: text
      regex: '(?im)^\s*scp\s+\S+\s+\S+:/((var/)?tmp|dev/shm)/\S+'

  - id: scp-remote-temp-download
    desc: SCP downloads file from remote temp
    crit: notable
    conf: 0.92
    attack: T1021.004,T1105
    platforms: [unix]
    for: [shell, python, rust, go, c, cpp, elf]
    if:
      type: text
      regex: '(?im)^\s*scp\s+\S+:/((var/)?tmp|dev/shm)/\S+\s+\S+'

  - id: python-subprocess-scp-temp-upload
    desc: Python subprocess uploads via SCP to temp
    crit: notable
    conf: 0.94
    attack: T1021.004,T1105
    platforms: [unix]
    for: [python]
    if:
      type: text
      regex: '(?s)subprocess\.\w+\([^)]{0,80}["'']scp["''][^)]{0,160}:/(tmp|var/tmp|dev/shm)/'

  - id: tar-sync-fallback
    desc: Shell tar extract
    # Building block for scp-tar-sync. The Python `tarfile.open` form lives in its
    # honest archive-operation home and is referenced by scp-tar-sync
    # cross-directory.
    crit: component
    conf: 0.82
    for: [shell]
    if:
      type: text
      substr: 'tar xzf'

composite_rules:
  - id: scp-tar-sync
    desc: scp tar synchronization
    crit: notable
    conf: 0.9
    near_lines: 20
    all:
      - id: scp-command
    any:
      - id: tar-sync-fallback
      - id: micro-behaviors/data/archive/open/tar::python-tarfile-open
