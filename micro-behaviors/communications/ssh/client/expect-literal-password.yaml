defaults:
  platforms: [unix, windows]
  for: [text, shell]

traits:
  - id: expect-interpreter-shebang
    desc: Expect interpreter shebang
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '^#![^\n]{0,80}/expect(\s|$)'
  - id: expect-ssh-literal-password-sequence
    desc: SSH and literal password send sequence
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'set\s+password\s+"[^"$\n]{6,100}"[\s\S]{0,500}spawn\s+ssh[\s\S]{0,500}send\s+"?\$password'

composite_rules:
  - id: expect-literal-password-ssh
    desc: Expect SSH and literal password send clues
    crit: suspicious
    conf: 0.96
    all:
      - id: expect-interpreter-shebang
      - id: expect-ssh-literal-password-sequence
