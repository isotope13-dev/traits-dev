# OpenSSH client invocations from JavaScript / TypeScript.
#
# Deploy CLIs, device tooling, and fleet scripts routinely shell out to the
# system ssh client (Node execSync/spawn, Electron helpers). Attackers use the
# identical primitive for lateral movement with a staged or bundled key, so an
# ssh command line that names an explicit identity file is a network IOC an
# analyst wants to see. Notable, not suspicious: `-i` is normal deploy-tooling
# behavior (every CI deploy script does this); the finding records the
# capability without asserting intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  attack: T1021.004

traits:
  - id: js-ssh-identity-command
    desc: SSH invoked with identity file
    if:
      type: text
      regex: '\bssh(\.exe)?\s+[^\n]{0,200}\s-i\s+\S+'
