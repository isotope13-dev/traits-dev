# Command/history text alone proves neither harvesting nor lateral movement.
# Exclude quotes so `grep -oE 'ssh ...' /root/.bash_history` is not
# misrepresented as an SSH command that accesses a remote history file.
defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
traits:
  - id: ssh-command-history-reference
    desc: SSH command references bash history
    conf: 0.7
    if:
      type: text
      regex: '(?m)\bssh\s+[^''"\r\n]{2,64}\bbash_history\b'
    unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
    - id: metadata/package/documentation/agent-safety::security-example-documentation
  - id: scp-command-history-reference
    desc: SCP command references bash history
    conf: 0.7
    if:
      type: text
      regex: '(?m)\bscp\s+[^''"\r\n]{2,64}\bbash_history\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: ssh-scp-history-command-reference
    desc: SSH or SCP command text names shell history
    conf: 0.85
    any:
      - id: ssh-command-history-reference
      - id: scp-command-history-reference
