defaults:
  platforms: [unix, fortios]
  for: [lua]

traits:
  - id: lua-unverified-privileged-ssh-command
    desc: Lua SSH text disables host-key checks
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'ssh -o StrictHostKeyChecking=no[\s\S]{0,220}(root|admin|fortinet|fortios)@'
