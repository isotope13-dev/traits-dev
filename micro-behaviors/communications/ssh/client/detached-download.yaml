# Embedded remote-command text; neither file identity nor authorization is inferred.
defaults:
  platforms: [linux, macos]
  for: [elf, shell]
  crit: notable
  conf: 0.95
traits:
  - id: ssh-key-detached-shell-command
    desc: Key SSH starts a background shell script
    if:
      type: text
      regex: '\bssh\b[^\r\n]{0,180} -i \S{1,64} [^ ]{1,64} ''[^''\r\n]{0,200};sh [^ ]{1,64} &'
  - id: ssh-remote-download-command
    desc: SSH remote command includes an HTTP downloader
    if:
      type: text
      regex: '\bssh\b[^''\r\n]{0,200}''[^''\r\n]{0,200}\b(wget|curl)\b[^'']{0,60}http'
