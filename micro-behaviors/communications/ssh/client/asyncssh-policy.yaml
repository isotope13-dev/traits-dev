defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: asyncssh-connect-without-known-hosts
    desc: AsyncSSH connects without host-key verification
    conf: 0.99
    if:
      type: tree-sitter
      language: python
      query: |
        ((call function: (attribute object: (identifier) @lib attribute: (identifier) @method)
          arguments: (argument_list (keyword_argument name: (identifier) @key value: (none))))
          (#eq? @lib "asyncssh") (#eq? @method "connect") (#eq? @key "known_hosts"))
