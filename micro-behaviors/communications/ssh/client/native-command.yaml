defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

traits:
  - id: native-ssh-timeout-no-hostcheck
    desc: SSH batch/timeout disables host checking
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'ssh -o StrictHostKeyChecking=no[\s\S]{0,120}(BatchMode=yes|ConnectTimeout=)'

