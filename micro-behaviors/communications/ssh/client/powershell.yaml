defaults:
  platforms: [unix, windows]
  for: [powershell]
  crit: notable
  conf: 0.97

traits:
  # The call-fact projection loses the target of `& ssh ...`. Match the
  # command-name field instead; comments, strings and arguments are not calls.
  - id: powershell-ssh-client-command
    desc: PowerShell invokes SSH client command
    if:
      type: tree-sitter
      query: |
        ((command
          command_name: [(command_name) (command_name_expr)] @target) @call
          (#match? @target "(?i)^[\"']?ssh(\\.exe)?[\"']?$"))
