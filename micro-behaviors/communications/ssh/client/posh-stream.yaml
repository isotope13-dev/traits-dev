defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: posh-ssh-shell-stream-command
    desc: Posh-SSH remote shell-stream command
    if:
      type: text
      regex: '(?i)(\b|\\[nr])New-SSHShellStream[ \t]+-'

  # Native carriers may omit long scripts from extracted strings. Require
  # the concrete command/parameter structure on that byte-scan surface.
  - id: native-posh-ssh-shell-stream-command
    desc: Posh-SSH shell-stream command with index
    for: [pe, elf, macho]
    if:
      type: raw
      regex: '(?i)\bNew-SSHShellStream[ \t]+-Index\b'

composite_rules:
  - id: posh-ssh-shell-stream
    desc: Posh-SSH remote shell-stream command
    for: [scripts, source, binaries]
    any:
      - id: posh-ssh-shell-stream-command
      - id: native-posh-ssh-shell-stream-command
