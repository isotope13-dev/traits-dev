defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: password-auth-negative-descriptor-user
  desc: SSH auth uses negative numeric username
  crit: suspicious
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: \.auth_password$
    arg:
      index: 0
      from:
        value: ^-[0-9]+$
