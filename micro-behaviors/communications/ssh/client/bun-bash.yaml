defaults:
  platforms: [unix]
  for: [javascript, typescript]
traits:
  - id: bun-ssh-remote-bash-command
    desc: Bun invokes SSH with a Bash command
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      kind: call
      regex: 'Bun(\.spawnSync|\["spawnSync"\])\(\["ssh",.{0,120}" && bash "'
