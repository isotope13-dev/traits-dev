defaults:
  for: [groovy]
  platforms: [unix, windows]
traits:
  - id: groovy-ssh-command-text
    desc: Embeds an SSH command string
    crit: notable
    conf: 0.9
    if:
      type: text
      # Quoted command text, rather than an SSH executor's prose/API names.
      # Actual command execution remains a separate required composite leg.
      regex: '["'']ssh[ \t]+[^"''\r\n]{1,180}'
