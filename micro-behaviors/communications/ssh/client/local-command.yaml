defaults:
  for: [scripts, source, lnk]
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
traits:
  - id: local-command-shell
    desc: SSH LocalCommand invokes a shell
    if:
      type: text
      regex: '(?i)\bLocalCommand=["\x27]?(cmd(\.exe)? +/|(ba)?sh +-c\b|powershell(\.exe)? +-)'
  - id: local-command-enabled
    desc: Enables SSH local command execution
    if:
      type: text
      regex: '(?i)\bPermitLocalCommand[ \t]*=[ \t]*yes\b'
