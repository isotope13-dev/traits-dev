defaults:
  for: [scripts, source]
  platforms: [unix, windows]
traits:
  - id: ssh-identity-argv
    desc: OpenSSH identity-file argument array
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '["'']ssh["'']\s*,\s*\[?\s*["'']-i["'']\s*,'
  # CLI-text twin of the argv form above: `ssh -i key ...` in shell or
  # embedded command strings. An explicit identity file is ordinary SSH
  # authentication, not key reuse or discovery on its own; intent comes
  # from the composites that reference this atom.
  - id: ssh-identity-file-flag
    desc: SSH explicit identity-file flag
    crit: notable
    conf: 0.8
    platforms: [unix, android, ios]
    for: [elf, shell]
    if:
      type: text
      regex: (ssh -i|-i /root/\.ssh|ssh\s+.{0,50}-i\s+)
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: well-known/tool/development/vcs/github-cli/
      - id: metadata/package/testing/presence/platform_suites::qemu-examples-tests
      - id: "metadata/file/naming::test-directory-component"
    attack: T1021.004
