traits:
  - id: compiled-ssh-identity-option-reference
    desc: Compiled Python SSH identity option reference
    crit: notable
    conf: 0.84
    platforms: [openwrt]
    for: [pyc]
    if:
      type: text
      regex: '(?i)(ssh.{0,40}-i|-i.{0,40}ssh)'
  - id: library
    for: [text]
    desc: compat placeholder
    crit: baseline
    conf: 0.1
    if:
      type: text
      exact: __cleave_missing_012a32f2683d__
defaults:
  platforms:
    - unix
    - windows
  crit: component
  conf: 0.1
  for: [scripts, binaries]

composite_rules:
  - id: python-ssh-identity-option-on-openwrt
    desc: OpenWrt Python SSH identity option
    crit: notable
    conf: 0.86
    platforms: [openwrt]
    for: [python, pyc]
    any:
      - id: python-ssh-identity-option
      - id: compiled-ssh-identity-option-reference
