defaults:
  platforms: [unix]
  for: [shell, python, rust, go, c, cpp, objc, elf, javascript, typescript]
traits:
  - id: password-ssh-without-host-key-verification
    desc: Password SSH with host-key checking disabled
    crit: notable
    conf: 0.95
    # Neither passwords nor a disabled host check establish propagation.
    # The remote-payload objective separately requires an inline payload.
    if:
      type: text
      regex: 'sshpass -p .{0,60}StrictHostKeyChecking=no'
    unless:
      - id: metadata/package/testing/
