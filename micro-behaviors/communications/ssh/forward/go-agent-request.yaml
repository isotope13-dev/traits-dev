defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
  - id: go-ssh-agent-forwarding-request
    desc: Requests SSH agent forwarding
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SendRequest$'
      arg:
        index: 0
        kind: string
        exact: auth-agent-req@openssh.com
