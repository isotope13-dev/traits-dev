defaults:
  platforms: [unix]
  crit: notable
  conf: 0.9
traits:
  # A public key needs no secrecy. Base64-wrapping one only hides the
  # operator's login key from a reviewer grepping for "ssh-ed25519".
  - id: encoded-ssh-public-key
    desc: Base64-concealed SSH public key
    for: [shell, go, python]
    if:
      type: encoded
      regex: '(^|\s)(ssh-(ed25519|rsa|dss)|ecdsa-sha2-nistp\d{3}) AAAA[0-9A-Za-z+/]{40}'
