defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.94

traits:
  - id: python-authorized-keys-direct-write
    desc: Python opens or writes authorized_keys
    for: [python]
    if:
      type: text
      regex: '(open|Path)\([^;\n]{0,90}authorized_keys[^;\n]{0,40}([''"][wax]|\.write_text)'

  - id: powershell-authorized-keys-write
    desc: PowerShell writes SSH authorized_keys
    for: [powershell]
    if:
      type: text
      regex: '(?i)(Add-Content|Set-Content|Out-File)\b[^\r\n]{0,120}authorized_keys'

  # Installing a prepared key file replaces the login trust list outright,
  # with no echo/redirect for the shell-write atoms to see.
  - id: shell-copy-into-authorized-keys
    desc: Shell copies a file onto authorized_keys
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*(cp|mv)\s[^\n;&|]{1,200}[\s"''/]authorized_keys2?["'']?\s*$'

composite_rules:
  - id: powershell-bound-authorized-keys-write
    desc: PowerShell appends bound authorized_keys
    platforms: [windows]
    for: [powershell]
    near_lines: 6
    all:
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
    any:
      - id: micro-behaviors/fs/write/file/append::add-content
      - id: micro-behaviors/fs/write/file/append::powershell-dotnet-append-text

  - id: source-constructed-authorized-keys-write
    desc: Writes constructed authorized_keys path
    for: [python, ruby, go]
    near_lines: 8
    all:
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-path-construction
    any:
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/fs/file/io-mode::ruby-write-append-mode
      - id: micro-behaviors/fs/write/file/full/unspecified::ruby-file-write-call
      - id: micro-behaviors/fs/write/file/unspecified::go-write-api-or-writable-open
  - id: authorized-keys-write-operation
    desc: Writes or appends SSH authorized_keys
    for: [scripts, source]
    any:
      - id: micro-behaviors/fs/write/file/target::node-bound-authorized-keys-write
      - id: micro-behaviors/fs/write/file/target::node-writes-authorized-keys
      - id: micro-behaviors/communications/ssh/keys::node-authorized-keys-variable-write
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-shell-write
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-append-redirect
      - id: micro-behaviors/fs/write/file/target::rust-authorized-keys-write
      - id: micro-behaviors/fs/write/file/append::append-ssh-authorized-keys
      - id: micro-behaviors/fs/write/file/target::powershell-admin-authorized-key-append
      - id: powershell-authorized-keys-write
      - id: powershell-bound-authorized-keys-write
      - id: python-authorized-keys-direct-write
      - id: source-constructed-authorized-keys-write
      - id: shell-copy-into-authorized-keys
