defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: shell-echo-authorized-key
  desc: Shell appends a literal authorized key
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: '(?m)^ *echo ["'']ssh-\S+ [A-Za-z0-9+/=]{40,800}.{0,120}>> *\S*authorized_keys'

- id: root-authorized-keys-echo-append
  desc: Shell appends root SSH authorized_keys
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?m)^ *echo[^\n]{0,900}>> */root/\.ssh/authorized_keys\b'
