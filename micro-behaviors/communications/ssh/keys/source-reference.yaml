# References, not proof of writes, valid key material, or unauthorized access.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class]
  crit: notable

traits:
  - id: authorized-keys-ed25519-reference-pair
    desc: References authorized_keys near Ed25519 text
    if:
      type: text
      regex: '(?is)(authorized_keys.{0,600}ssh-ed25519|ssh-ed25519.{0,600}authorized_keys)'

  - id: ed25519-key-text-fragment
    desc: Contains SSH Ed25519 key-like text
    if:
      type: text
      regex: 'ssh-ed25519\s+AAAA[A-Za-z0-9+/]{20,}'
