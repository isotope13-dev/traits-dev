traits:
  - id: openwrt-pyc-ssh-identity-option
    desc: Compiled Python SSH identity option
    crit: notable
    conf: 0.84
    platforms: [openwrt]
    for: [pyc]
    if:
      type: text
      regex: '(?i)(ssh.{0,40}-i|-i.{0,40}ssh)'
defaults:
  platforms:
    - unix
    - windows
  crit: component
  conf: 0.1
  for: [scripts, binaries]

composite_rules:
  - id: python-ssh-identity-option-on-openwrt
    desc: OpenWrt Python SSH identity option
    crit: notable
    conf: 0.86
    platforms: [openwrt]
    for: [python, pyc]
    any:
      - id: micro-behaviors/communications/ssh/client::python-ssh-identity-option
      - id: openwrt-pyc-ssh-identity-option
