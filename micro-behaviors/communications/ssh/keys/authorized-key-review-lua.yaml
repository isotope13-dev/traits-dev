defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-password-ssh-authorized-key-command"
    desc: "Lua formats remote SSH key append command"
    crit: "suspicious"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "string.format"
      arg:
        index: 0
        kind: "string"
        regex: "sshpass -p.{1,180}echo.{1,60}>>\\s*~?/\\.ssh/authorized_keys"
