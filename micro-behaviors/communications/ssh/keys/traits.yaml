defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: authorized-keys-append-redirect
    desc: SSH authorized_keys append redirect
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '>>\s*(~/?\.ssh/)?authorized_keys'
  - id: authorized-keys-append-operation
    desc: SSH authorized_keys append operation
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'authorized_keys[\s\S]{0,260}(>>|append|echo\b)'

composite_rules:
  - id: authorized-keys-append-command
    desc: Appends a public key to SSH authorized_keys
    crit: notable
    conf: 0.9
    all:
      - id: authorized-keys-append-redirect
      - id: authorized-keys-append-operation
