defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, github-actions]

traits:
  - id: ssh-copy-id-root-target
    desc: Provisions root account SSH key
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [scripts, binaries]
    if:
      type: text
      regex: 'ssh-copy-id[^"''\n]{0,120}root@'

  - id: authorized-keys-append-redirect
    desc: SSH authorized_keys append redirect
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '>>\s*[^\s;|&]{0,60}authorized_keys'
  - id: authorized-keys-append-operation
    desc: SSH authorized_keys append operation
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'authorized_keys[\s\S]{0,260}(>>|append|echo\b)'

  # Path construction, not the write itself. An implant that builds the
  # authorized_keys path from the home directory looks nothing like the shell
  # `echo >> authorized_keys` idiom the sibling matchers cover, so a
  # library-driven variant of the same technique would otherwise go unseen.
  - id: authorized-keys-path-construction
    desc: Builds an authorized_keys path
    crit: notable
    conf: 0.9
    for: [python, ruby, perl, go, javascript, typescript]
    if:
      type: text
      regex: '(join|expanduser|expand_path|Join)\([^)\n]{0,60}authorized_keys'

composite_rules:
  - id: authorized-keys-append-command
    desc: Appends a public key to SSH authorized_keys
    crit: notable
    conf: 0.9
    all:
      - id: authorized-keys-append-redirect
      - id: authorized-keys-append-operation
