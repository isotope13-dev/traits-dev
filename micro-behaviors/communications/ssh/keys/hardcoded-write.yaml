defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

composite_rules:
  - id: hardcoded-authorized-key-write
    desc: Writes a hardcoded SSH authorized key
    crit: notable
    conf: 0.95
    mbc: E1098
    near_lines: 10
    all:
    - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
    any:
    - id: micro-behaviors/communications/ssh/keys::authorized-keys-shell-write
