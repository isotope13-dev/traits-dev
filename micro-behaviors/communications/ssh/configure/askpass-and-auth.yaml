# SSH client authentication, askpass helper, and multi-prompt retry configuration.
# Headless deploy tooling and authentication-bypass exploits share SSH_ASKPASS and
# password-auth client flags; stateful prompt switching across attempts is anomalous.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.94
  attack: T1021.004

traits:
  - id: ssh-askpass-env
    desc: Sets SSH_ASKPASS helper environment variable
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bSSH_ASKPASS\s*=|["'']SSH_ASKPASS["'']\s*[,:=]|env\(\s*["'']SSH_ASKPASS["'']'

  - id: ssh-askpass-require-force
    desc: Forces headless SSH_ASKPASS without TTY
    conf: 0.97
    if:
      type: text
      exclude_comments: true
      regex: '(?i)SSH_ASKPASS_REQUIRE["'']?\s*[:=]\s*["'']?(force|prefer)\b'

  - id: ssh-dummy-display-env
    desc: Sets dummy DISPLAY=:0 environment variable
    crit: component
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '\bDISPLAY\s*=\s*["'']?:0(\.0)?\b|["'']DISPLAY["'']\s*[,:=]\s*["'']:0'

  - id: ssh-ignore-config-devnull
    desc: Ignores local SSH config via null device
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\bssh(\.exe)?\b[^\r\n]{0,160}\s-F\s*["'']?(/dev/null|NUL)\b'

  - id: ssh-preferred-auth-password
    desc: Enables SSH PreferredAuthentications password
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)PreferredAuthentications[=\s]+["'']?[\w,-]{0,28}(password|keyboard-inter)'

  - id: ssh-client-disable-pubkey-auth
    desc: Disables SSH client public-key authentication
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(-o\s*["'']?PubkeyAuthentication[=\s]+no\b|\bPubkeyAuthentication=no\b)'

  - id: ssh-multiple-password-prompts
    desc: Sets SSH NumberOfPasswordPrompts above one
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bNumberOfPasswordPrompts[=\s]+["'']?([2-9]|[1-9]\d+)\b'

  - id: shell-else-state-file-create
    desc: Shell else branch creates state file
    crit: component
    platforms: [unix]
    for: [shell]
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '\belse\b[^\r\n]{1,64}(:\s*>\s*["'']?\$|\btouch\s+["'']?\$)'

  - id: sshpass-password-flag-or-env
    desc: Supplies sshpass password flag or SSHPASS
    platforms: [unix]
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\b(sshpass\s+-[pefd]\b|SSHPASS\s*=)'

  - id: cli-ssh-argv-or-cmd-exec
    desc: Invokes SSH client binary with user@host
    for: [scripts, source]
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(["'']ssh(\.exe)?["'']\s*,|\bssh\.exe\s+-)[^\r\n]{8,360}@'

  - id: expect-spawn-ssh-multi-send
    desc: Expect spawns ssh and sends multiple inputs
    platforms: [unix]
    for: [shell, text]
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\bspawn\s+ssh\b.{1,480}\bsend\b.{1,320}\bsend\b'

  - id: go-ssh-password-auth-method
    desc: Configures Go SSH password auth method
    for: [go]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '\bssh\.(Password|PasswordCallback|RetryableAuthMethod)\s*\('

  - id: go-ssh-multi-attempt-auth-config
    desc: Configures multi-attempt Go SSH auth methods
    for: [go]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?s)(\bssh\.RetryableAuthMethod\s*\(|\[\]ssh\.AuthMethod\s*\{[^}]{4,160},)'

  - id: go-bin-ssh-password-symbol
    desc: Go binary links x/crypto/ssh password auth
    for: [elf, macho, pe]
    conf: 0.97
    if:
      type: symbol
      kind: function
      regex: 'golang\.org/x/crypto/ssh\.(Password|PasswordCallback|RetryableAuthMethod)$'

  - id: go-bin-ssh-session-exec-symbol
    desc: Go binary links x/crypto/ssh session exec
    for: [elf, macho, pe]
    conf: 0.97
    if:
      type: symbol
      kind: function
      regex: 'golang\.org/x/crypto/ssh\.\(\*Session\)\.(Run|CombinedOutput|Output|Start)$'

  - id: c-ssh-lib-password-auth-call
    desc: Calls libssh or libssh2 password auth API
    for: [c, cpp, rust]
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(ssh_userauth_password|libssh2_userauth_password(_ex)?)$'

  - id: c-ssh-lib-exec-call
    desc: Calls libssh or libssh2 channel exec API
    for: [c, cpp, rust]
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(ssh_channel_request_exec|libssh2_channel_process_startup)$'

  - id: native-ssh-lib-password-import
    desc: Binary imports libssh/libssh2 password auth
    for: [elf, macho, pe]
    conf: 0.97
    if:
      type: symbol
      kind: import
      regex: '^_?(ssh_userauth_password|libssh2_userauth_password(_ex)?)$'

  - id: native-ssh-lib-exec-import
    desc: Binary imports libssh/libssh2 channel exec
    for: [elf, macho, pe]
    conf: 0.97
    if:
      type: symbol
      kind: import
      regex: '^_?(ssh_channel_request_exec|libssh2_channel_process_startup)$'

  - id: rust-ssh-password-auth
    desc: Rust SSH client authenticates with password
    for: [rust]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '\.(userauth_password|authenticate_password)\s*\('

  - id: rust-multiple-ssh-password-auth
    desc: Repeated Rust SSH password auth calls
    for: [rust]
    conf: 0.95
    if:
      type: symbol
      kind: call
      substr: .userauth_password
    count_min: 2

  - id: rust-ssh-channel-exec
    desc: Rust SSH client opens session channel
    for: [rust]
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\.(channel_session|channel_open_session)\s*\('

  - id: php-ssh-password-auth
    desc: PHP ssh2 or phpseclib password auth
    for: [php]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '\bssh2_auth_password\s*\(|\\?phpseclib[23]?\\Net\\SSH2\b'

  - id: php-ssh-remote-exec
    desc: PHP SSH session executes remote command
    for: [php]
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\bssh2_exec\s*\(|\$\w+->exec\s*\('

  - id: jvm-ssh-client-library
    desc: Imports JSch or SSHJ client package
    for: [java, kotlin]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '\b(com\.jcraft\.jsch|net\.schmizz\.sshj)\b'

  - id: jvm-ssh-password-auth
    desc: Java or Kotlin SSH password auth call
    for: [java, kotlin]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '\.(setPassword|authPassword)\s*\('

  - id: jvm-ssh-exec-channel
    desc: Java or Kotlin opens SSH exec session
    for: [java, kotlin]
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: 'openChannel\s*\(\s*"exec"|\.startSession\s*\(\s*\)'

  - id: csharp-sshnet-password-client
    desc: C# SSH.NET password authentication client
    for: [csharp]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '\b(Renci\.SshNet|new\s+(SshClient|PasswordAuthenticationMethod)\s*\()'

  - id: csharp-sshnet-exec-command
    desc: C# SSH.NET executes remote SSH command
    for: [csharp]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '\.(RunCommand|CreateCommand)\s*\('

  - id: posh-ssh-invoke-command
    desc: PowerShell Posh-SSH invokes remote command
    for: [powershell, scripts, source]
    conf: 0.97
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bInvoke-SSHCommand\s+-'

  - id: js-ssh2-multi-auth-handler
    desc: Configures Node ssh2 multi-step auth handler
    for: [javascript, typescript]
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '\bauthHandler\s*[:(]|keyboard-interactive[''"]\s*,\s*(\([^)\n]{0,44}\)|\w+)\s*=>'

  - id: js-ssh2-password-property
    desc: Configures JS connect or auth password option
    for: [javascript, typescript]
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\.connect\s*\(\s*\{[^}]{0,160}\bpassword\s*:|\btype\s*:\s*[''"]password[''"]'

  - id: js-node-ssh-exec-command
    desc: Node-SSH client calls execCommand
    for: [javascript, typescript]
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\.execCommand\s*\('

  - id: python-ssh-connect-password-arg
    desc: Python SSH connect call passes password
    for: [python]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\b(ssh_client|ssh|client|asyncssh)\.connect\s*\([^)]{0,240}\bpassword\s*='

  - id: python-fabric-connect-kwargs-password
    desc: Fabric connect_kwargs passes password
    for: [python]
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\bconnect_kwargs\s*=\s*\{[^}]{0,160}[''"]password[''"]'

  - id: paramiko-disable-key-or-agent
    desc: Disables Paramiko key or agent lookup
    for: [python]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\.connect\s*\([^)]{0,400}\b(look_for_keys|allow_agent)\s*=\s*False\b'

  - id: asyncssh-disable-client-keys
    desc: Disables AsyncSSH client key lookup
    for: [python]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\.connect\s*\([^)]{0,400}\bclient_keys\s*=\s*None\b'

  - id: python-two-password-connect-calls
    desc: Two connect calls pass password argument
    crit: component
    for: [python]
    conf: 0.94
    count_min: 2
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\b[A-Za-z_]\w*\.connect\s*\([^)]{0,360}\bpassword\s*='

  - id: ruby-net-ssh-password-auth
    desc: Configures Ruby Net::SSH password auth
    for: [ruby]
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\bNet::SSH\.start\s*\([^)]{0,180}(:?password\s*(:|=>)|\bauth_methods\s*:)'

  - id: ruby-net-ssh-exec
    desc: Ruby Net::SSH executes remote command
    for: [ruby]
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\b(ssh|session|conn)\.(exec!?|open_channel)\b'

composite_rules:
  - id: ssh-askpass-headless-display
    desc: Headless SSH_ASKPASS with dummy DISPLAY=:0
    conf: 0.95
    all:
      - id: ssh-askpass-env
      - id: ssh-dummy-display-env
    near_bytes: 512

  - id: sshpass-password-auth
    desc: Non-interactive sshpass password authentication
    platforms: [unix]
    conf: 0.94
    any:
      - id: micro-behaviors/communications/ssh/client::sshpass-tool-reference
      - id: sshpass-password-flag-or-env

  - id: python-ssh-disable-key-agent-auth
    desc: Disables SSH key or agent lookup
    for: [python]
    conf: 0.96
    any:
      - id: paramiko-disable-key-or-agent
      - id: asyncssh-disable-client-keys

  - id: python-multiple-ssh-password-connects
    desc: Calls Python SSH password connect twice
    for: [python]
    conf: 0.96
    all:
      - id: python-ssh-connect-password-arg
      - id: python-two-password-connect-calls

  - id: python-ssh-password-auth-or-connect
    desc: Python SSH client authenticates with password
    for: [python]
    conf: 0.96
    any:
      - id: micro-behaviors/communications/ssh/client::paramiko-password-auth-call
      - id: micro-behaviors/communications/ssh/client::paramiko-password-connect-call
      - id: python-ssh-connect-password-arg
      - id: python-fabric-connect-kwargs-password

  - id: js-ssh2-password-auth
    desc: Configures Node SSH password authentication
    for: [javascript, typescript]
    conf: 0.95
    all:
      - id: js-ssh2-password-property
    any:
      - id: micro-behaviors/communications/ssh/client::ssh2-js
      - id: micro-behaviors/communications/ssh/client::node-ssh

  - id: ssh-askpass-multi-prompt-password-only
    desc: SSH_ASKPASS forces multi-prompt password auth
    for: [scripts, source]
    conf: 0.96
    all:
      - id: ssh-askpass-env
      - id: ssh-multiple-password-prompts
    any:
      - id: ssh-client-disable-pubkey-auth
      - id: ssh-preferred-auth-password
      - id: ssh-askpass-require-force
      - id: ssh-askpass-headless-display
    near_bytes: 1024

  - id: ssh-staged-askpass-helper
    desc: Stages executable SSH_ASKPASS helper script
    for: [scripts, source]
    conf: 0.96
    all:
      - id: ssh-askpass-env
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/fs/chmod/modify::chmod-command
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/fs/chmod/modify::node-chmod
    near_bytes: 1024

  - id: ssh-stateful-askpass-prompt-switch
    desc: SSH_ASKPASS switches state file across prompts
    crit: suspicious
    conf: 0.96
    attack: T1190,T1021.004
    for: [shell]
    platforms: [unix]
    all:
      - id: ssh-askpass-env
      - id: micro-behaviors/fs/file/stat::shell-variable-file-existence-test
      - id: shell-else-state-file-create
    any:
      - id: micro-behaviors/fs/write/file/redirect::shell-cat-heredoc-file-write
      - id: micro-behaviors/fs/temp/file::shell-mktemp-file-call
      - id: micro-behaviors/fs/temp/mktemp::shell-mktemp-dry-run
    near_bytes: 1024
