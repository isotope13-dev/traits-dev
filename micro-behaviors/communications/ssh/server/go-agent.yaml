defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-serve-agent-call
    desc: Calls Go agent ServeAgent
    crit: component
    if:
      type: symbol
      kind: call
      regex: '^(agent|ssh[aA]gent)\.ServeAgent$'

  - id: go-ssh-agent-import
    desc: Imports Go SSH agent library
    crit: component
    if:
      type: import
      exact: golang.org/x/crypto/ssh/agent

composite_rules:
  - id: go-serve-ssh-agent-protocol
    desc: Serves SSH agent protocol requests
    crit: notable
    all:
      - id: go-serve-agent-call
      - id: go-ssh-agent-import
