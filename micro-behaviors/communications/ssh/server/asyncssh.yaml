defaults:
  platforms: [unix]
  for: [python]
  crit: notable
traits:
  - id: asyncssh-server-base
    desc: Implements an AsyncSSH server class
    conf: 0.98
    if:
      type: symbol
      kind: member
      exact: asyncssh.SSHServer
  - id: asyncssh-begin-auth-disabled-branch
    desc: SSH callback permits authentication-free access
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((class_definition superclasses: (argument_list
          (attribute object: (identifier) @lib attribute: (identifier) @base))
          body: (block (function_definition name: (identifier) @name body: (block
            (if_statement consequence: (block (return_statement (false)) @policy))))))
          (#eq? @lib "asyncssh") (#eq? @base "SSHServer")
          (#eq? @name "begin_auth"))
  - id: asyncssh-create-server-call
    desc: Starts an AsyncSSH server listener
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: asyncssh.create_server
  - id: asyncssh-sftp-without-chroot
    desc: Initializes SFTP server without chroot
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((class_definition superclasses: (argument_list
          (attribute object: (identifier) @lib attribute: (identifier) @base))
          body: (block (function_definition body: (block
            (expression_statement (call function: (attribute
              attribute: (identifier) @init)
              arguments: (argument_list (keyword_argument
                name: (identifier) @key value: (none)))))))))
          (#eq? @lib "asyncssh") (#eq? @base "SFTPServer")
          (#eq? @init "__init__") (#eq? @key "chroot"))
  - id: asyncssh-configured-tcp-forwarding
    desc: SSH forwarding callback returns policy
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition name: (identifier) @name body: (block
          (return_statement (attribute attribute: (identifier) @policy))))
          (#eq? @name "connection_requested")
          (#match? @policy "^(allow_)?tcp_forwarding$"))
