defaults:
  for: [shell]
  platforms: [linux]
traits:
  - id: sshd-service-alternate-key-override
    desc: Overrides sshd with an alternate key store
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((redirected_statement
          body: (command name: (command_name) @writer argument: (raw_string) @unit)
          redirect: (file_redirect ">" destination: (_) @path))
          (#eq? @writer "printf")
          (#match? @path "^/etc/systemd/system/sshd?\\.service\\.d/[^/]+\\.conf$")
          (#match? @unit "ExecStart=\\\\nExecStart=/(usr/)?s?bin/sshd\\s+-D\\s+-o\\s+AuthorizedKeysFile=/var/lib/"))
