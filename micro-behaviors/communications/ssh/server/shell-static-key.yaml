defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-embedded-key-redirect
    desc: Shell writes embedded SSH public key
    crit: suspicious
    conf: 0.95
    attack: T1098.004
    if:
      type: tree-sitter
      language: shell
      query: |
        ((redirected_statement
          body: (command name: (command_name) @command
            . argument: (_) @key .)
          redirect: (file_redirect [">" ">>"] destination: (_) @path))
          (#eq? @command "echo")
          (#match? @key "^[\"']?ssh-(ed25519|rsa)[ \\t]+[A-Za-z0-9+/=]{40,}")
          (#match? @path "(^|/)\\.ssh/authorized_keys[\"']?$"))
