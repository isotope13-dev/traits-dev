defaults:
  for: [shell]
  platforms: [unix]
traits:
  - id: shell-mktemp-config-directory
    desc: SSH daemon config uses a mktemp variable
    crit: notable
    conf: 0.96
    # Facts expose the call arguments but flatten expansions into strings.
    # A proximity composite cannot bind the mktemp variable to the config
    # operand or distinguish a literal dollar sign. Use syntax for that join.
    if:
      type: tree-sitter
      language: shell
      query: |
        ((program
          (variable_assignment
            name: (variable_name) @directory
            value: (command_substitution
              (command name: (command_name (word) @temp)
                argument: (word) @mode)))
          (command name: (command_name (word) @server)
            argument: (word) @flag
            . argument: (string
              . [(simple_expansion (variable_name) @used)
                 (expansion (variable_name) @used)]
              . (string_content) @suffix .)) @evidence)
          (#eq? @temp "mktemp") (#eq? @mode "-d")
          (#match? @server "(^|/)sshd$") (#eq? @flag "-f")
          (#eq? @directory @used) (#match? @suffix "^/[^/]+$"))
