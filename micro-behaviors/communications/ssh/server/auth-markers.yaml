# Authentication symbols/references do not establish an SSH hook.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
- id: mm-answer-keyallowed
  desc: mm_answer_keyallowed SSH function
  crit: notable
  conf: 0.8
  if:
    type: symbol
    exact: mm_answer_keyallowed
  for: [elf, macho, so]
  unless:
  - type: basename
    regex: '\.o$'
- id: mm-answer-authpassword
  desc: mm_answer_authpassword SSH function
  crit: notable
  conf: 0.8
  if:
    type: symbol
    exact: mm_answer_authpassword
  for: [elf, macho, so]
  unless:
  - type: basename
    regex: '\.o$'
- id: pubkey-auth-ref
  desc: pubkey_auth reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: pubkey_auth
  unless:
  - type: basename
    regex: '\.o$'
