# The OpenSSH client shipped in-box under %SystemRoot%\System32\OpenSSH\.
# Windows itself never runs this binary on the user's behalf outside of
# documented remoting scenarios, so malware spelling out the full path is
# deliberately borrowing a signed, allow-listed OS binary as its tunnel
# transport (observed with the Tortoiseshell wtsapi32.dll reverse tunnel and
# the UNC1549 tooling it aligns with).
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

traits:
  - id: windows-openssh-client-invocation
    desc: Windows in-box OpenSSH client invoked
    crit: notable
    conf: 0.9
    attack: T1021.004
    if:
      type: text
      regex: '(?i)System32\\+OpenSSH\\+ssh(\.exe)?\b'
