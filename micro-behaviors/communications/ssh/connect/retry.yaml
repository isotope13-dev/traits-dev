# Generated commands have the same meaning in every carrier language.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: shell-ssh-retry-loop
    desc: Shell loop retries SSH after sleep
    if:
      type: text
      regex: '(?s)\bwhile\s+(true|:)[;\s]+do\b.{0,280}\b(auto)?ssh\b.{0,700}\bsleep\s+\d+'

  - id: powershell-ssh-retry-loop
    desc: PowerShell loop retries SSH after sleep
    if:
      type: text
      regex: '(?is)while\s*\(\s*\$true\s*\)\s*\{.{0,280}\bssh\b.{0,280}Start-Sleep\s+\d+'

  - id: batch-ssh-retry-loop
    desc: Batch loop retries SSH connection
    if:
      type: text
      regex: '(?i):[\w-]{1,8}[\s\x5c\w]{1,8}ssh\s+[^\r\n\x5c]{5,80}[\s\x5c\w]{1,8}goto\s+[\w-]{1,8}'

composite_rules:
  - id: ssh-retry-loop
    desc: Repeated SSH connection with retry delay
    any:
      - id: shell-ssh-retry-loop
      - id: powershell-ssh-retry-loop
      - id: batch-ssh-retry-loop
