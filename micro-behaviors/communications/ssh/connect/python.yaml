defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1021.004

traits:
  - id: paramiko-sshclient-connect
    desc: Python Paramiko SSHClient connection call
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bparamiko\.SSHClient\s*\(\s*\).{0,240}\b[A-Za-z_]\w*\.connect\s*\('
  - id: paramiko-exec-command
    desc: Paramiko SSH remote command execution
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: ssh.exec_command
  - id: paramiko-auth-publickey-call
    desc: Paramiko authenticates with a public key
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_]\w*\.auth_publickey$'
  - id: paramiko-channel-exec-command
    desc: Paramiko channel executes remote command
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(ch|chan|channel|sess|session)\.exec_command$'
  - id: asyncssh-connect-call
    desc: AsyncSSH connection call
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: asyncssh.connect
  - id: ssh-client-run-call
    desc: SSH client remote command run call
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(ssh|_?conn(ection)?|client)\.run$'
  - id: ssh-client-exec-command-call
    desc: SSH client remote command execution call
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(ssh|ssh_client|client)\.exec_command$'
  - id: ssh-run-helper-call
    desc: Python SSH helper runs a remote command
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: ssh_run
  - id: ssh-client-create-process-call
    desc: SSH client remote process creation call
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(ssh|_?conn(ection)?|client)\.create_process$'
  - id: paramiko-start-client-call
    desc: Paramiko Transport starts SSH client handshake
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)start_client$'
  - id: paramiko-open-session-call
    desc: Paramiko opens SSH session channel
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open_session$'
  - id: paramiko-session-exec-command
    desc: Paramiko session executes remote command
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec_command$'
      receiver:
        from:
          call: '(^|\.)open_session$'
  - id: paramiko-multiple-password-auth-calls
    desc: Calls Paramiko auth_password multiple times
    conf: 0.96
    count_min: 2
    if:
      type: symbol
      kind: call
      substr: .auth_password
  - id: python-loop-over-ssh-password-auth
    desc: Loops over passwords calling auth_password
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?s)\bfor\s+\w+\s+in\s+[^\r\n:]{2,120}:[\s\S]{1,200}\.auth_password\s*\('

composite_rules:
  - id: asyncssh-run-call
    desc: AsyncSSH connection runs remote command
    conf: 0.96
    near_bytes: 4096
    all:
      - id: asyncssh-connect-call
    any:
      - id: micro-behaviors/data/control-flow/dispatch/named::connection-run-method-call
      - id: ssh-client-run-call
