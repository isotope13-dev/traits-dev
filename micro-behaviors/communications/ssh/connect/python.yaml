defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1021.004

traits:
  - id: paramiko-sshclient-connect
    desc: Python Paramiko SSHClient connection call
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bparamiko\.SSHClient\s*\(\s*\).{0,240}\b[A-Za-z_]\w*\.connect\s*\('
  - id: paramiko-exec-command
    desc: Paramiko SSH remote command execution
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: ssh.exec_command
  - id: asyncssh-connect-call
    desc: AsyncSSH connection call
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: asyncssh.connect
  - id: ssh-client-run-call
    desc: SSH client remote command run call
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(ssh|_?conn(ection)?|client)\.run$'
  - id: ssh-client-exec-command-call
    desc: SSH client remote command execution call
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(ssh|ssh_client|client)\.exec_command$'
  - id: ssh-run-helper-call
    desc: Python SSH helper runs a remote command
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: ssh_run
  - id: ssh-client-create-process-call
    desc: SSH client remote process creation call
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(ssh|_?conn(ection)?|client)\.create_process$'

composite_rules:
  - id: asyncssh-run-call
    desc: AsyncSSH connection runs remote command
    crit: notable
    conf: 0.96
    near_bytes: 4096
    all:
      - id: asyncssh-connect-call
    any:
      - id: micro-behaviors/process/create/wrapper::connection-run-method-call
      - id: ssh-client-run-call
