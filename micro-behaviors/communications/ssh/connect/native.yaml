# Native SSH forwarding APIs exposed by compiled macOS clients.
# These are neutral tunnel capabilities; intent is supplied by composites
# that correlate them with process launch, persistence, or other behavior.
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.9
  attack: T1090,T1021.004

traits:
  - id: objc-ssh-tunnel
    desc: Objective-C SSH tunnel connection method
    if:
      type: text
      substr: "sshTunnelWithHostname:port:username:password:"
  - id: objc-ssh-local-forward
    desc: Objective-C SSH local port forwarding method
    if:
      type: text
      substr: "addLocalForwardWithBindAddress:bindPort:host:hostPort:"
  - id: objc-ssh-remote-forward
    desc: Objective-C SSH remote port forwarding method
    if:
      type: text
      substr: "addRemoteForwardWithBindAddress:bindPort:host:hostPort:"
  - id: objc-ssh-dynamic-forward
    desc: Objective-C SSH dynamic SOCKS forwarding method
    if:
      type: text
      substr: "addDynamicForwardWithBindAddress:bindPort:"

composite_rules:
  - id: objc-ssh-forwarding
    desc: Objective-C SSH port-forwarding capability
    crit: notable
    conf: 0.95
    any:
      - id: objc-ssh-tunnel
      - id: objc-ssh-local-forward
      - id: objc-ssh-remote-forward
      - id: objc-ssh-dynamic-forward
