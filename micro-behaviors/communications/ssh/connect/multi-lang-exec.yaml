# Remote command and shell execution across Shell, Go, and Node.js SSH clients.
defaults:
  crit: notable
  platforms: [unix, windows]
  attack: T1021.004

traits:
  - id: shell-ssh-target-remote-command
    desc: Shell SSH client runs remote command
    platforms: [unix]
    for: [shell]
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '\bssh\s+([^;|&\n]|\\\r?\n){0,320}["''\w.${}-]+@["''\w.${}-]+( |\\\r?\n)+[''"\w/]'

  - id: go-ssh-session-exec
    desc: Go SSH session executes remote command
    for: [go]
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Run|CombinedOutput|Output|Shell|Start)$'
      receiver:
        from:
          call: '(^|\.)NewSession$'

  - id: go-ssh-dial
    desc: Go SSH client dials a connection
    for: [go]
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: ssh.Dial

  - id: js-ssh2-client-exec-or-shell
    desc: Node SSH client invokes exec or shell
    for: [javascript, typescript]
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(conn|client|ssh)\.(exec|shell)$'
