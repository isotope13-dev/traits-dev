defaults:
  platforms: [linux, macos, windows]
traits:
  - id: python-ssh-request-port-forward
    desc: Python SSH remote port-forward request
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      exact: transport.request_port_forward
  - id: ssh2-forward-out-call
    desc: Node.js ssh2 outbound TCP forwarding call
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)forwardOut$'
  - id: ssh-local-forward-command
    desc: Uses SSH local port forwarding
    crit: notable
    conf: 0.86
    for: [scripts, binaries]
    if:
      type: text
      regex: '\bssh\b[^\n]{0,120}\s-L\s*'
  - id: ssh-local-forward-call
    desc: Source call launches SSH local port forwarding
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(run|popen|call|command|exec|spawn)\s*\([^)]{0,200}\bssh\b[^)]{0,120}-L\b'
  - id: ssh-background-no-command
    desc: SSH background tunnel mode
    crit: notable
    conf: 0.82
    for: [shell]
    if:
      type: text
      regex: '(?m)^ *ssh +.{0,120}-[fN] +.{0,120}-[fN]\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: ssh-remote-forward-command
    desc: SSH remote port forwarding command
    crit: notable
    conf: 0.9
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [binaries, scripts, systemd-service]
    if:
      type: text
      regex: '\bssh\b[^\n]{0,140}\s-R\s+[0-9]{2,5}(:|\b)'
  - id: ssh-port-443-command
    desc: SSH client connects to TCP port 443
    crit: notable
    conf: 0.94
    attack: T1572,T1021.004
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bssh(\.exe)?\b[^\n]{0,220}\s-p\s+443\b'

  - id: ssh-root-login-command
    desc: SSH client logs in as root
    crit: notable
    conf: 0.94
    attack: T1078,T1021.004
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bssh(\.exe)?\b[^\n]{0,160}\broot@[A-Za-z0-9_.:-]{3,255}'
  # PuTTY's plink accepts an uppercase -P for the server port and -pw for a
  # non-interactive password. The executable may be renamed or supplied via a
  # variable, so the option grammar is a more durable identifier than its
  # basename. This is still a dual-use tunnel primitive on its own.
  - id: putty-port-compress-forward-flags
    desc: PuTTY port, compression, and forward options
    crit: component
    conf: 0.97
    for: [powershell, batch, shell, scripts]
    if:
      type: text
      regex: '(?i)\s-P\s+[0-9]{2,5}\s+-C\s+-R\s+'
  - id: putty-loopback-remote-forward
    desc: PuTTY loopback remote-forward option
    crit: component
    conf: 0.97
    for: [powershell, batch, shell, scripts]
    if:
      type: text
      regex: '(?i)\s-R\s+(127\.0\.0\.1:)?[0-9]{2,5}:127\.0\.0\.1:[0-9]{2,5}\b'
  - id: putty-login-password-flags
    desc: PuTTY login and password options
    crit: component
    conf: 0.97
    for: [powershell, batch, shell, scripts]
    if:
      type: text
      regex: '(?i)\s-l\s+\S+.{0,60}\s-pw\s+\S+'
  - id: ssh-remote-forward-request-field
    desc: SSH remote TCP-forward request field
    crit: notable
    conf: 0.9
    attack: T1090
    for: [binaries, source]
    if:
      type: text
      exact: tcpip-forward
  - id: ssh-forwarded-tcpip-channel-field
    desc: SSH forwarded TCP channel field
    crit: notable
    conf: 0.9
    attack: T1090
    for: [binaries, source]
    if:
      type: text
      exact: forwarded-tcpip
  # NHAS reverse_ssh and compatible clients use a positional remote host and
  # TCP port; the command is a useful SSH capability, but the tool is also
  # used for legitimate remote support, so intent belongs in composites that
  # add persistence or exploit context.
  - id: reverse-ssh-client-command
    desc: reverse_ssh host and port command
    crit: suspicious
    conf: 0.94
    attack: T1572,T1021.004
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\breverse_ssh\b[^\n]{0,100}\s[0-9]{2,5}\b'
  - id: ssh-dynamic-socks-command
    desc: SSH dynamic SOCKS proxy command
    crit: notable
    conf: 0.9
    ref: sha256:d36e54ddd109a0f85879c3add5b334f4ba718c873d19cf783926a527b1b7ba24
    for: [scripts, binaries]
    if:
      type: text
      regex: '\bssh\b[^\n]{0,140}\s-D\s+[0-9]{2,5}\b'
  - id: python-ssh-binary-lookup
    desc: Python searches for an SSH client binary
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'shutil\.which\(["''](auto)?ssh["'']\)'
  - id: python-ssh-dynamic-forward-flag
    desc: Python SSH dynamic-forward flag
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '["'']-D["'']\s*,'

composite_rules:
  - id: putty-password-remote-forward-command
    desc: Passworded PuTTY remote port forward
    crit: notable
    conf: 0.98
    attack: T1572,T1021.004
    for: [powershell, batch, shell, scripts]
    near_bytes: 384
    all:
      - id: putty-port-compress-forward-flags
      - id: putty-loopback-remote-forward
      - id: putty-login-password-flags

  - id: python-ssh-dynamic-socks-argv
    desc: Builds SSH dynamic SOCKS forwarding argv
    crit: notable
    conf: 0.96
    for: [python]
    near_bytes: 4096
    all:
      - id: python-ssh-binary-lookup
      - id: python-ssh-dynamic-forward-flag
