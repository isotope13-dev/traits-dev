# Streamlocal forwarding is also legitimate administration. Socket names and
# client implementation are deliberately not identities or conviction gates.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: ssh-local-unix-socket-forward-command
    desc: SSH local forward targets a Unix socket
    if:
      type: text
      # Accept attached/quoted -L arguments and serialized argv in any source
      # language. The local endpoint can be a TCP port (including on Windows)
      # or a socket path; require an absolute Unix socket as the destination.
      regex: '\bssh(\.exe)?\b[^\n;]{0,99}[\s"'',]-L[\s"'',]*[^\s"'',]{1,99}:/[^\s;"'']{1,99}'
