defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: posh-ssh-session-command
    desc: Posh-SSH connection command with arguments
    if:
      type: text
      regex: '(?i)(\b|\\[nr])New-SSHSession[ \t]+-'

  # Native carriers may omit long scripts from extracted strings. Require
  # the concrete command/parameter structure on that byte-scan surface.
  - id: native-posh-ssh-session-command
    desc: Posh-SSH connection command with host
    for: [pe, elf, macho]
    if:
      type: raw
      regex: '(?i)\bNew-SSHSession[ \t]+-ComputerName\b'

composite_rules:
  - id: posh-ssh-session
    desc: Posh-SSH connection command
    for: [scripts, source, binaries]
    any:
      - id: posh-ssh-session-command
      - id: native-posh-ssh-session-command
