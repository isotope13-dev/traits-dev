# ProxyJump is an OpenSSH protocol feature, not a tool or campaign identity.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
traits:
  - id: shell-multiple-jump-hosts
    desc: SSH command routes through multiple jump hosts
    for: [shell]
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @client)) @evidence
          (#match? @client "(^|/)ssh(\\.exe)?$")
          (#match? @evidence "[ \\t](-J[ \\t]*|-o[ \\t]*[\"']?ProxyJump[= \\t]+)[\"']?[^, \\t\"';]+,[^, \\t\"';]+"))
  - id: multiple-jump-hosts-command-literal
    desc: Command string specifies multiple SSH jump hosts
    for: [python, javascript, typescript, ruby, perl, powershell, java, csharp]
    if:
      type: literal
      exclude_docstrings: true
      regex: '(^|/)ssh(\.exe)?\s+[^\r\n;]{0,240}(-J\s*|-o\s*ProxyJump=)[^,\s]+,[^,\s]+'
composite_rules:
  - id: multiple-jump-hosts
    desc: SSH routing specifies multiple jump hosts
    for: [scripts, java, csharp]
    any:
      - id: shell-multiple-jump-hosts
      - id: multiple-jump-hosts-command-literal
