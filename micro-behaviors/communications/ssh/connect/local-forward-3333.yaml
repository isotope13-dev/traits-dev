defaults:
  platforms:
  - unix
  for:
  - shell
  - text
  - python
  - javascript
composite_rules:
- id: ssh-local-forward-3333-context
  for:
  - shell
  - python
  - javascript
  desc: SSH local forward uses port 3333
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/communications/ssh/connect::ssh-local-forward-command
  - id: micro-behaviors/communications/ssh/connect::ssh-local-forward-port-3333
  any:
  - id: micro-behaviors/communications/ssh/connect::ssh-background-no-command
  - id: micro-behaviors/communications/ip/literal::loopback-port-3333-reference
  - id: micro-behaviors/communications/socket/tcp::stratum-port-3333
