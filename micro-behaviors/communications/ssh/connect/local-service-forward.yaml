defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.97

traits:
  # Command builders frequently store the options separately from the client
  # executable. Match the forwarding grammar, including quoted wildcard binds.
  - id: remote-forward-to-local-sshd-option
    desc: Remote forward exposes local SSH service
    if:
      type: text
      # Accept command strings and argv lists, wildcard/IPv6 bind addresses,
      # and either IP family for the loopback SSH destination.
      regex: '-R[\\\s"'',]+([\w.*:\[\]-]{1,80}:)?\d{1,5}:(localhost|127\.0\.0\.1|\[::1\]):22\b'
