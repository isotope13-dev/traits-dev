defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.97

traits:
  # Command builders frequently store the options separately from the client
  # executable. Match the forwarding grammar, including quoted wildcard binds.
  - id: remote-forward-to-local-sshd-flag
    desc: SSH reverse-forward flag targets local sshd
    if:
      type: text
      # Accept command strings and argv lists, wildcard/IPv6 bind addresses,
      # and either IP family for the loopback SSH destination.
      regex: '-R[\\\s"'',]*([\w.*:\[\]-]{1,80}:)?\d{1,5}:(localhost|127\.0\.0\.1|\[::1\]):22\b'

  # OpenSSH accepts the same forwarding through -o RemoteForward or its
  # configuration file. These use whitespace between listener and target,
  # unlike -R's colon-delimited argument. Neither syntax establishes intent.
  - id: remoteforward-to-local-sshd-config
    desc: SSH RemoteForward option targets local sshd
    if:
      type: text
      regex: '(?i)\bRemoteForward[=\t ]+(\S+:)?\d+[\t ]+(localhost|127\.0\.0\.1|\[::1\]):22\b'

  # A reverse forward whose target is a loopback listener publishes a
  # host-local service on the remote side. Ports are often variables.
  - id: remote-forward-to-loopback-service
    desc: SSH reverse forward targets a loopback service
    if:
      type: text
      regex: '\s-R\s*["'']?([\w.*$\[\]-]{1,60}:)?[\w${}]{1,40}:(localhost|127\.0\.0\.1):[\w${}]{1,40}'

composite_rules:
  - id: remote-forward-to-local-sshd-option
    desc: Remote forward exposes local SSH service
    any:
      - id: remote-forward-to-local-sshd-flag
      - id: remoteforward-to-local-sshd-config
