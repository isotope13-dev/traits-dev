# EtherNet/IP + CIP Industrial Protocol (TCP port 44818)
# Neutral protocol references — intent inferred at objectives tier.
defaults:
  for: [binaries, scripts]
  platforms: [windows, linux]
  crit: notable
  conf: 0.85

traits:
  - id: keyword
    desc: EtherNet/IP or CIP protocol reference
    for: [binaries, scripts, go, powershell]
    if:
      type: text
      regex: (?i)\b(EtherNet[/_-]?IP|CIP\s+protocol)\b

  - id: library
    desc: EtherNet/IP library or module reference
    conf: 0.88
    for: [binaries, scripts, powershell]
    if:
      type: text
      regex: \b(pycomm3|cpppo|ethernet[-_]?ip([-_]?client)?)\b

  - id: port-44818
    desc: EtherNet/IP TCP port 44818 context
    crit: component
    conf: 0.82
    for: [binaries, scripts, go, powershell]
    if:
      type: text
      regex: (?i)(EtherNet[/ -]?IP|CIP(\s+protocol)?|port|tcp)[^0-9]{0,30}44818\b

composite_rules:
  - id: protocol-port-context
    desc: EtherNet/IP or CIP with TCP port 44818
    crit: notable
    conf: 0.92
    for: [binaries, scripts, go, powershell]
    all:
      - id: port-44818
    any:
      - id: keyword
      - id: library
