defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, pe, elf, macho]

traits:
- id: ethereum-transaction-by-hash-literal
  desc: eth_getTransactionByHash RPC method literal
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    substr: eth_getTransactionByHash

- id: ethereum-storage-at-literal
  desc: eth_getStorageAt RPC method literal
  crit: notable
  conf: 0.6
  for: [javascript, typescript]
  if:
    type: string_literal
    substr: eth_getStorageAt

- id: eth-jsonrpc-b64xor-method
  desc: Base64-XOR encoded Ethereum JSON-RPC method
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: text
    regex: '(orOvmKWrqKSsibKqpaK1|orOvmKCis4WrqKSshb6JsqqlorU|orOvmKCis5O1pqm0pqSzrqiphb6PprSv)'
