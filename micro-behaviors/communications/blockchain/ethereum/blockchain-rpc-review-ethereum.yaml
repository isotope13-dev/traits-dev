defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, scripts, source]

traits:
- id: ethereum-explorer-transaction-url
  desc: Ethereum-compatible explorer transaction URL
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)(basescan\.org|optimistic\.etherscan\.io|polygonscan\.com|arbiscan\.io)/tx/'
- id: eth-call-method-field
  desc: JSON-RPC eth_call method field
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)["'']?method["'']?\s*(:|=>?)\s*["'']eth_call["'']'
- id: eth-call-method-literal
  desc: Ethereum eth_call method literal
  crit: notable
  conf: 0.94
  if:
    type: string_literal
    regex: '(?i)^eth_call$'
- id: eth-get-logs-method-literal
  desc: Ethereum eth_getLogs method literal
  crit: notable
  conf: 0.94
  for: [python, javascript, typescript, go, scripts, source]
  if:
    type: string_literal
    regex: '(?i)^eth_getLogs$'
- id: eth-get-logs-method-field
  desc: JSON-RPC eth_getLogs method field
  crit: notable
  conf: 0.9
  for: [python, javascript, typescript, go, scripts, source]
  if:
    type: text
    regex: '(?i)["'']?method["'']?\s*(:|=>)\s*["'']eth_getLogs["'']'
- id: eth-get-storage-at-method-field
  desc: JSON-RPC eth_getStorageAt method field
  crit: notable
  conf: 0.96
  for: [elf, macho, pe, wasm, class, scripts, source]
  if:
    type: text
    regex: '(?i)\\?["'']?method\\?["'']?\s*(:|=>)\s*\\?["'']eth_getStorageAt\\?["'']'
- id: eth-get-storage-at-method-literal
  desc: Ethereum eth_getStorageAt method literal
  crit: notable
  conf: 0.96
  for: [elf, macho, pe, wasm, class, scripts, source]
  if:
    type: string_literal
    regex: '(?i)^eth_getStorageAt$'
- id: eth-get-block-by-number-method-literal
  desc: Ethereum block lookup method literal
  crit: notable
  conf: 0.94
  for: [source, class, java_class, jar, csharp, java, kotlin, elixir, powershell]
  if:
    type: string_literal
    regex: '(?i)^eth_getBlockByNumber$'
- id: eth-call-binary-method-literal
  desc: Compiled artifact contains eth_call method
  crit: notable
  conf: 0.9
  for: [pe, elf, macho]
  if:
    type: raw
    regex: '(?i)eth_call'
- id: eth-call-contract-address
  desc: Ethereum-format contract address field
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)["'']?to["'']?\s*[:=]\s*["'']?0x[a-f0-9]{40}'
- id: eth-call-result-reference
  desc: Ethereum eth_call and result references
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?is)eth_call.{0,220}\b(result|response)\b'
- id: ethereum-binary-eth-call-request
  desc: Native Ethereum eth_call request
  crit: notable
  conf: 0.98
  for: [elf, pe, macho]
  if:
    type: text
    substr: '{"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":"'
- id: jsonrpc-hex-result-prefix
  desc: JSON-RPC hexadecimal result prefix
  crit: notable
  conf: 0.96
  for: [elf, pe, macho]
  if:
    type: text
    exact: '"result":"0x'

composite_rules:
- id: eth-get-storage-at-method
  desc: Ethereum contract-storage RPC method reference
  crit: notable
  conf: 0.96
  for: [binaries, scripts, source]
  any:
    - id: micro-behaviors/communications/blockchain/ethereum::eth-get-storage-at-method-field
    - id: micro-behaviors/communications/blockchain/ethereum::eth-get-storage-at-method-literal
- id: ethereum-public-rpc-provider-set
  desc: Multiple public Ethereum RPC providers
  crit: notable
  conf: 0.9
  for: [scripts, source, binaries]
  needs: 4
  any:
  - id: micro-behaviors/communications/http/services/llamarpc::ethereum-llamarpc-provider
  - id: micro-behaviors/communications/http/services/getblock::ethereum-getblock-provider
  - id: micro-behaviors/communications/http/services/nodereal::ethereum-nodereal-provider
  - id: micro-behaviors/communications/http/services/publicnode::ethereum-publicnode-provider
  - id: micro-behaviors/communications/http/services/ankr::ethereum-ankr-provider
  - id: well-known/app/finance/blastapi::ethereum-blastapi-provider
  - id: well-known/app/finance/blastapi::ethereum-blastapi-provider-unicode
  - id: well-known/app/finance/drpc::ethereum-drpc-provider
  - id: micro-behaviors/communications/http/services/cloudflare::ethereum-cloudflare-provider
  - id: well-known/app/finance/1rpc::ethereum-1rpc-provider
  - id: micro-behaviors/communications/http/services/mev-blocker::ethereum-mevblocker-provider
  - id: micro-behaviors/communications/http/services/meowrpc::ethereum-meowrpc-provider
  - id: micro-behaviors/communications/http/services/blockpi::ethereum-blockpi-provider
  - id: micro-behaviors/communications/http/services/bloxroute::ethereum-blxrbdn-provider
- id: ethereum-public-rpc-host
  desc: Known public Ethereum RPC host
  crit: notable
  conf: 0.88
  any:
  - id: well-known/app/finance/infura::ethereum-infura-provider
  - id: well-known/app/finance/alchemy::ethereum-alchemy-provider
  - id: micro-behaviors/communications/http/services/publicnode::ethereum-publicnode-provider
  - id: micro-behaviors/communications/http/services/cloudflare::ethereum-cloudflare-provider
  - id: well-known/app/finance/flashbots::ethereum-flashbots-provider
  - id: well-known/app/finance/1rpc::ethereum-1rpc-provider
  - id: well-known/app/finance/drpc::ethereum-drpc-provider
- id: ethereum-drpc-1rpc-marker
  desc: dRPC or 1RPC Ethereum provider marker
  crit: notable
  conf: 0.9
  any:
  - id: well-known/app/finance/drpc::ethereum-drpc-host-fragment
  - id: well-known/app/finance/1rpc::ethereum-1rpc-path-fragment
  - id: well-known/app/finance/drpc::ethereum-drpc-provider
  - id: well-known/app/finance/1rpc::ethereum-1rpc-provider
