defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
composite_rules:
- id: evm-contract-data-value
  desc: Hex data field or calldata encoder reference
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/source/literal/hex::quoted-hex-data-field
  - id: micro-behaviors/data/transaction/construct::evm-calldata-encoder-field
- id: evm-contract-target-field
  desc: Literal or named transaction target field
  crit: notable
  conf: 0.9
  for:
  - binaries
  - python
  - php
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  any:
  - id: micro-behaviors/communications/blockchain/ethereum::evm-literal-contract-address-field
  - id: metadata/lang/source/syntax/key-value::named-target-to-field
- id: evm-jsonrpc-contract-call
  desc: JSON-RPC eth_call, target and data references
  crit: notable
  conf: 0.97
  for:
  - binaries
  - '!dex'
  - javascript
  - python
  - php
  near_bytes: 1024
  all:
  - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
  - id: micro-behaviors/communications/blockchain/ethereum::evm-eth-call-method
  - id: micro-behaviors/communications/blockchain/ethereum::evm-contract-target-field
  - id: micro-behaviors/communications/blockchain/ethereum::evm-contract-data-value
