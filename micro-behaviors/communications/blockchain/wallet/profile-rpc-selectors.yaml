# These are co-occurring text and package observations. They do not bind a
# transaction, demonstrate recipient modification, or prove a compromise.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  - id: wallet-rpc-fragment-pair
    desc: Quoted wallet RPC name fragments
    conf: 0.9
    any:
      - id: metadata/lang/source/literal/string/expression::wallet-provider-eth-send-transaction-fragment
      - id: metadata/lang/source/literal/string/expression::wallet-provider-eth-accounts-fragment
      - id: metadata/lang/source/literal/string/expression::wallet-provider-solana-send-transaction-fragment
    needs: 2

