defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  # A transfer, payout, or disbursement request carrying a wallet-destination
  # field: the request names an external blockchain wallet as the recipient.
  # The field name alone does not establish that funds move, or to whom; the
  # transfer route and authenticated transport are separate legs.
  - id: transfer-wallet-destination-field
    desc: Transfer carries wallet destination field
    if:
      type: text
      regex: '(?i)["'']wallet[a-z_]*address["'']\s*:|json:"wallet[a-z_]*address"'
