# Runtime shape tests are API discovery, not order placement. A normal SDK
# exposes the same methods; the React-internal search context lives in the
# session-hijack objective rather than in these neutral observations.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: post-order-method-type-test
    desc: Tests whether postOrder is callable
    if:
      type: tree-sitter
      query: |
        ((binary_expression
          left: (unary_expression
            operator: "typeof"
            argument: [(member_expression property: (property_identifier) @method)
                       (subscript_expression index: (string (string_fragment) @method))])
          operator: ["==" "==="]
          right: (string (string_fragment) @type)) @evidence
        (#eq? @method "postOrder")
        (#eq? @type "function"))

  - id: create-order-method-type-test
    size_max: 262144
    desc: Tests whether an order builder is callable
    if:
      type: tree-sitter
      query: |
        ((binary_expression
          left: (unary_expression
            operator: "typeof"
            argument: [(member_expression property: (property_identifier) @method)
                       (subscript_expression index: (string (string_fragment) @method))])
          operator: ["==" "==="]
          right: (string (string_fragment) @type)) @evidence
        (#any-of? @method "createOrder" "createMarketOrder")
        (#eq? @type "function"))
