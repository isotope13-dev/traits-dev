defaults:
  platforms: [windows, linux, macos]
  for: [scripts, pe, elf, macho]
  crit: notable
  conf: 0.9

# A standard Monero mainnet address is 95 base58 characters beginning with
# "4" (subaddresses begin with "8"). The literal names a payout identity;
# it does not prove mining by itself. Consumers combine it with pool or
# miner-configuration evidence.
traits:
  - id: monero-wallet-address-literal
    desc: Embedded Monero wallet address literal
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])4[0-9AB][1-9A-HJ-NP-Za-km-z]{93}([^A-Za-z0-9]|$)'
