defaults:
  platforms: [windows, linux, macos]
  for: [scripts, pe, elf, macho]
  crit: notable
  conf: 0.9

composite_rules:
# A stock miner includes algorithm implementations, Stratum, and developer
# donation pools. These references establish mining capability, not hijacking.
- id: algorithm-stratum-known-pool
  desc: Mining algorithm, Stratum and pool references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/blockchain/mining::algorithm-stratum-miner
  - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
  unless:
  - id: well-known/tool/detection/security-scanner
  - id: well-known/tool/detection/clawmetry/
  - id: well-known/app/ai/knowledge/animica::source-member-context

- id: mining-protocol-known-pool
  desc: Mining protocol and known pool markers
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/blockchain/mining::miner-type
  - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/clawmetry/
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/app/ai/knowledge/animica/
  - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
