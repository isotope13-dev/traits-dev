# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - elf
  - pe
  - macho
traits:
- id: cryptonight-json-algorithm
  desc: Embedded JSON names a cn/* mining algorithm
  crit: notable
  conf: 0.88
  if:
    type: raw
    regex: '"algo"\s*:\s*"cn/'
composite_rules:
- id: wallet-json-donations-disabled
  desc: Wallet-shaped JSON user and disabled donations co-occur
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/blockchain/wallet::monero-shaped-json-user-field
  - id: micro-behaviors/communications/blockchain/mining::xmrig-donate-level-zero-config
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: cryptonight-pool-json
  desc: Embedded pool array and CryptoNight algorithm JSON
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/data/config/syntax::embedded-pool-array-config
  - id: micro-behaviors/communications/blockchain/mining::cryptonight-json-algorithm
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
