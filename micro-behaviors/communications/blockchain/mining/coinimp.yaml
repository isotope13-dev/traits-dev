# Client.Anonymous/User is CoinIMP's API, not AuthedMine's.
# https://www.coinimp.com/documentation/reference
# After blocklisting of coinimp.com/scripts/min.js, kits rotated the loader
# across hostingcloud domains (racing, science, ...) with short opaque token
# filenames (MKmX.js, M5q5.js, gA51.js, ...), often spelled with a DNS root
# dot to defeat exact-match blocklists. Match the loader-host family plus the
# rotating token shape, not one specimen filename.
# Capability facts do not establish consent or the contents of a remote library.
defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: coinimp-script-reference
    desc: References CoinIMP miner script URL
    if:
      type: text
      regex: '(?i)(hashing\.win|coinimp\.com|mineralt\.io)\.?/scripts/min\.js'
      exclude_html_comments: true

  - id: coinimp-rotated-loader-reference
    desc: References CoinIMP rotated loader script URL
    if:
      type: text
      regex: '(?i)hostingcloud\.\w+\.?/\w+\.js'
      exclude_html_comments: true

  - id: coinimp-client-construct
    desc: Constructs CoinIMP-compatible mining client
    if:
      type: text
      regex: 'new\s+Client\.(Anonymous|User)\s*\('
      exclude_html_comments: true

  - id: coinimp-anonymous-site-key
    desc: CoinIMP Anonymous call with literal key
    if:
      type: text
      regex: 'new\s+Client\.(Anonymous|User)\s*\(\s*[''"][A-Za-z0-9]{32,}[''"]'
      exclude_html_comments: true

  - id: coinimp-anonymous-default-options
    desc: CoinIMP literal-key constructor omits options
    if:
      type: text
      regex: 'new\s+Client\.Anonymous\s*\(\s*[''"][a-fA-F0-9]{64}[''"]\s*\)'
      exclude_html_comments: true

  # The assignment and immediate start use the same receiver. This is a
  # conventional bootstrap spelling, not a campaign identifier or site key.
  - id: coinimp-miner-assignment-start
    desc: Assigns CoinIMP miner then immediately starts it
    if:
      type: text
      regex: 'miner\s*=\s*new\s+Client\.Anonymous\([^;<>]{1,180};\s*miner\.start\(\s*\)'
      exclude_html_comments: true

composite_rules:
  # Either the documented /scripts/min.js URL or a rotated hostingcloud
  # loader URL identifies the CoinIMP miner library. Consumers decide what
  # the surrounding bootstrap proves.
  - id: coinimp-loader-script-reference
    desc: References a CoinIMP miner loader script URL
    any:
      - id: coinimp-script-reference
      - id: coinimp-rotated-loader-reference
  # Preserve the former throttled startup observation as a capability:
  # co-occurrence alone proves neither data flow nor unauthorized mining.
  - id: coinimp-throttled-bootstrap-cooccurrence
    desc: CoinIMP construction throttle and start co-occur
    near_bytes: 4096
    all:
      - id: coinimp-client-construct
      - id: "metadata/lang/source/syntax/key-value::fractional-throttle-option"
      - id: micro-behaviors/data/control-flow/dispatch/named::miner-or-client-start-call
