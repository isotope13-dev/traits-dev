defaults:
  platforms: [linux, macos, windows]
  for: [shell, text, batch]
  crit: notable
  conf: 0.96

traits:
  - id: shell-xmrig-invocation
    desc: Command script invokes the XMRig miner
    if:
      type: text
      regex: '(?m)(^|[;&`(])\s*((nohup|sudo|nice|env)\s+)?(\./|/[\w./-]*/)?xmrig\s+-'
