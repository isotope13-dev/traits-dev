defaults:
  platforms:
  - unix
  - appliance
  for:
  - rust
  - elf

traits:
  - id: rust-mining-engine-struct
    desc: Rust mining engine struct
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "struct MiningEngine"

  - id: rust-share-hash-telemetry
    desc: Rust share hash telemetry
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '"shares"[\s\S]{0,120}"hashes"'

  - id: rust-share-counter-fields
    desc: Rust share counter fields
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: 'shares_found[\s\S]{0,160}total_hashes'

  - id: rust-mining-share-post
    desc: Rust mining share POST
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "POST /api/v1/share HTTP/1.1"


composite_rules:
  - id: rust-custom-mining-share
    desc: Rust custom mining share
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/blockchain/mining::rust-mining-engine-struct
      - id: micro-behaviors/communications/blockchain/mining::rust-mining-share-post
    any:
      - id: micro-behaviors/communications/blockchain/mining::rust-share-hash-telemetry
      - id: micro-behaviors/communications/blockchain/mining::rust-share-counter-fields
