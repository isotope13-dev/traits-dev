# Solidity is currently extracted as text (and sometimes JavaScript).
# These are source operations, not evidence that the contract was deployed.
defaults:
  platforms: [unix, windows]
  for: [text, javascript]
  crit: notable
  conf: 0.97

traits:
  - id: payable-receive-withdraw-call
    desc: Payment callback calls external withdrawal
    if:
      type: text
      regex: 'receive\s*\(\s*\)\s+external\s+payable\s*\{[^}]{0,512}\.withdraw\s*\('

  - id: deposit-then-withdraw-call
    desc: Deposit call followed by withdrawal
    if:
      type: text
      regex: '\.deposit\s*\{[^}]{1,80}\}\s*\([^;]{0,80}\);\s*\w+\.withdraw\s*\('

  - id: contract-balance-threshold-guard
    desc: Guards on a contract balance
    if:
      type: text
      regex: 'if\s*\(\s*address\s*\(\s*\w+\s*\)\s*\.balance\s*>=\s*[1-9][0-9]*\s+ether\s*\)'

composite_rules:
  - id: seeded-recursive-withdrawal-calls
    desc: Seeded withdrawal with balance-gated callback withdrawal
    near_lines: 40
    all:
      - id: deposit-then-withdraw-call
      - id: payable-receive-withdraw-call
      - id: contract-balance-threshold-guard
