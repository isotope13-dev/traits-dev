defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, pe, elf, macho]

traits:
- id: ethereum-transaction-by-hash-literal
  desc: eth_getTransactionByHash RPC method
  crit: notable
  conf: 0.7
  unless:
    - id: well-known/lib/crypto/ethjs-format::ethjs-format-library
    - id: well-known/lib/crypto/ethjs-contract::ethjs-contract-library
    - id: well-known/lib/crypto/metamask-core::metamask-core-library
  if:
    type: string_literal
    substr: eth_getTransactionByHash

- id: ethereum-storage-at-literal
  desc: eth_getStorageAt RPC method
  crit: notable
  conf: 0.6
  for: [javascript, typescript]
  unless:
    - id: well-known/lib/crypto/ethjs-format::ethjs-format-library
    - id: well-known/lib/crypto/ethjs-contract::ethjs-contract-library
    - id: well-known/lib/crypto/metamask-core::metamask-core-library
  if:
    type: string_literal
    substr: eth_getStorageAt
