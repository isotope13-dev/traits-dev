# Direct CALL edges in a Go 1.20+ x86 pclntab; names alone do not match.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  size_max: 30000000
traits:
  - id: go-ton-endpoint-refresh-call-chain
    desc: Go endpoint refresh calls TON resolver fallback
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule go_ton_endpoint_refresh_call_chain {
          strings:
            $header = { F1 FF FF FF 00 00 01 04 }
            $caller0 = "main.changeEndpoint\x00"
            $callee0 = "main.getBC\x00"
            $caller1 = "main.getBC\x00"
            $callee1 = "main.tryTonResolve\x00"
            $caller2 = "main.tryTonResolve\x00"
            $callee2 = "main.tonResolve\x00"
          condition:
            pe.machine == pe.MACHINE_I386 and all of them and
            with h = @header, n = uint32(h+8),
                 table = h+uint32(h+36), names = h+uint32(h+20),
                 text = uint32(h+16) : (
              n > 0 and n < 50000 and table+n*8+8 < filesize and
              for any caller_i in (0..n-1) : (
                names+uint32(table+uint32(table+caller_i*8+4)+4) == @caller0 and
                with start = pe.rva_to_offset(text+uint32(table+caller_i*8)-pe.image_base),
                     end = pe.rva_to_offset(text+uint32(table+(caller_i+1)*8)-pe.image_base) : (
                  end > start and end-start < 50000 and
                  pe.sections[pe.section_index(start)].characteristics & 0x20000000 != 0 and
                  for any target_i in (0..n-1) : (
                    names+uint32(table+uint32(table+target_i*8+4)+4) == @callee0 and
                    with target = pe.rva_to_offset(text+uint32(table+target_i*8)-pe.image_base) : (
                      for any c in (start..end-5) : (
                        uint8(c) == 0xe8 and c+5+int32(c+1) == target
                      )
                    )
                  )
                )
              ) and
              for any caller_i in (0..n-1) : (
                names+uint32(table+uint32(table+caller_i*8+4)+4) == @caller1 and
                with start = pe.rva_to_offset(text+uint32(table+caller_i*8)-pe.image_base),
                     end = pe.rva_to_offset(text+uint32(table+(caller_i+1)*8)-pe.image_base) : (
                  end > start and end-start < 50000 and
                  pe.sections[pe.section_index(start)].characteristics & 0x20000000 != 0 and
                  for any target_i in (0..n-1) : (
                    names+uint32(table+uint32(table+target_i*8+4)+4) == @callee1 and
                    with target = pe.rva_to_offset(text+uint32(table+target_i*8)-pe.image_base) : (
                      for any c in (start..end-5) : (
                        uint8(c) == 0xe8 and c+5+int32(c+1) == target
                      )
                    )
                  )
                )
              ) and
              for any caller_i in (0..n-1) : (
                names+uint32(table+uint32(table+caller_i*8+4)+4) == @caller2 and
                with start = pe.rva_to_offset(text+uint32(table+caller_i*8)-pe.image_base),
                     end = pe.rva_to_offset(text+uint32(table+(caller_i+1)*8)-pe.image_base) : (
                  end > start and end-start < 50000 and
                  pe.sections[pe.section_index(start)].characteristics & 0x20000000 != 0 and
                  for any target_i in (0..n-1) : (
                    names+uint32(table+uint32(table+target_i*8+4)+4) == @callee2 and
                    with target = pe.rva_to_offset(text+uint32(table+target_i*8)-pe.image_base) : (
                      for any c in (start..end-5) : (
                        uint8(c) == 0xe8 and c+5+int32(c+1) == target
                      )
                    )
                  )
                )
              )
            )
        }
