# Neutral behavioral observations for actual blockchain-client operations.
# Each rule names a concrete protocol operation; the directory's ML feature
# aggregates these without requiring composites to reference other composites.
defaults:
  platforms: [windows, unix, android]
  for: [source, javascript, typescript, python, go, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: web3-contract-read-call
    desc: Reads a Web3 contract method
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\.functions\.[A-Za-z_]\w*\s*\(\s*\)\.call\s*\(\s*\)'

  - id: web3-contract-event-query
    desc: Reads smart-contract event logs through Web3
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)\b(eth|w3|web3)\.get_logs\s*\(|\.events\.[A-Za-z_]\w*\.get_logs\s*\('

  # EIP-6963 wallet-discovery tables declare several providers' self-reported
  # rdns names so a dApp can enumerate injected wallets. A stealer enumerates
  # installed packages or data directories instead; it never declares rdns
  # names, so a table of them marks a provider directory, not a target list.
  - id: wallet-provider-rdns-table
    desc: Declares multiple wallet provider RDNS names
    crit: notable
    conf: 0.92
    count_min: 3
    if:
      type: text
      regex: '(?i)\brdns\s*:\s*["'']'

composite_rules:
  - id: ethereum-jsonrpc-client-query
    desc: Queries an Ethereum JSON-RPC method
    crit: notable
    conf: 0.94
    for: [javascript, typescript, go]
    near_lines: 40
    all:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
    any:
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-block-number-method
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-block-by-number-method
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-transaction-count-method

  - id: ethereum-blockchain-history-query
    desc: Queries Ethereum block and account nonce state
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-block-by-number-method
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-transaction-count-method

  - id: ethereum-wallet-transaction-request
    desc: Requests an Ethereum transaction through a wallet RPC provider
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/rpc::object-method-rpc-request
      - id: micro-behaviors/communications/rpc::wallet-provider-eth-send-transaction
