defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
- id: x402-stablecoin-balance-query
  desc: x402 stablecoin balance query
  if:
    type: symbol
    kind: call
    exact: usdcBalance
- id: web3-balance-read
  desc: Web3 account balance query
  if:
    type: text
    regex: '\b(this\.)?web3(_\d+)?\.eth\.getBalance\s*\('
- id: blockchain-client-balance-query
  desc: Blockchain client queries account balance
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(client|[A-Za-z_$][A-Za-z0-9_$]*Client)\.getBalance\s*\(\s*\{\s*address\b'
