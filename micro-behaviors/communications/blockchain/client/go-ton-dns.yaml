# Go pclntab records locate routines; actual direct CALL edges are required.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  size_max: 30000000
traits:
  - id: go-ton-dns-http-resolver-calls
    desc: Go TON DNS resolver calls HTTP
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule go_ton_dns_http_resolver_calls {
          strings:
            $header = { F1 FF FF FF 00 00 01 04 }
            $reader = "main.tonResolve\x00"
            $read = "net/http.NewRequestWithContext\x00"
            $parse = "net/http.(*Client).do\x00"
            $decrypt = "github.com/xssnick/tonutils-go/tvm/cell.FromBOCMultiRoot\x00"
            $method = "dnsresolve"
          condition:
            pe.machine == pe.MACHINE_I386 and all of them and
            with h = @header, n = uint32(h+8),
                 table = h+uint32(h+36), names = h+uint32(h+20),
                 text = uint32(h+16) : (
              n > 0 and n < 50000 and table+n*8+8 < filesize and
              for any reader_i in (0..n-1) : (
                names+uint32(table+uint32(table+reader_i*8+4)+4) == @reader and
                with start = pe.rva_to_offset(text+uint32(table+reader_i*8)-pe.image_base),
                     end = pe.rva_to_offset(text+uint32(table+(reader_i+1)*8)-pe.image_base) : (
                  end > start and end-start < 50000 and
                  pe.sections[pe.section_index(start)].characteristics & 0x20000000 != 0 and
                  for any target_i in (0..n-1) : (
                    names+uint32(table+uint32(table+target_i*8+4)+4) == @read and
                    with target = pe.rva_to_offset(text+uint32(table+target_i*8)-pe.image_base) : (
                      for any c in (start..end-5) : (
                        uint8(c) == 0xe8 and c+5+int32(c+1) == target
                      )
                    )
                  ) and
                  for any target_i in (0..n-1) : (
                    names+uint32(table+uint32(table+target_i*8+4)+4) == @parse and
                    with target = pe.rva_to_offset(text+uint32(table+target_i*8)-pe.image_base) : (
                      for any c in (start..end-5) : (
                        uint8(c) == 0xe8 and c+5+int32(c+1) == target
                      )
                    )
                  ) and
                  for any target_i in (0..n-1) : (
                    names+uint32(table+uint32(table+target_i*8+4)+4) == @decrypt and
                    with target = pe.rva_to_offset(text+uint32(table+target_i*8)-pe.image_base) : (
                      for any c in (start..end-5) : (
                        uint8(c) == 0xe8 and c+5+int32(c+1) == target
                      )
                    )
                  )
                )
              )
            )
        }
