# OP_RETURN data and a curl client do not establish attacker control.
defaults:
  platforms: [unix, windows]
  crit: notable
composite_rules:
  - id: opreturn-curl-client-references
    desc: Source references OP_RETURN data and a curl client
    conf: 0.96
    for: [scripts, source, class]
    scope: file
    all:
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/client/reference::curl-client-reference
    unless:
      - id: well-known/app/finance/pyblock::pyblock-source-tree-member
