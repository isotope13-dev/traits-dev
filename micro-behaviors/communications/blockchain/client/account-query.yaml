# Account enumeration is ordinary wallet RPC, not transfer manipulation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
- id: provider-eth-accounts-request
  desc: Provider request with eth_accounts method
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression
          object: (identifier) @receiver
          property: (property_identifier) @method)
        arguments: (arguments
          (object (pair
            key: (property_identifier) @key
            value: (string (string_fragment) @rpc))))) @call
      (#match? @receiver "^(ethereum|provider)$")
      (#eq? @method "request")
      (#eq? @key "method")
      (#eq? @rpc "eth_accounts"))
- id: direct-eth-accounts-request
  desc: Direct eth_accounts RPC request call
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: '\.(request|send|sendAsync)$'
    arg:
      index: 0
      kind: string
      exact: eth_accounts

composite_rules:
- id: wallet-account-query
  desc: Requests the wallet account list
  crit: notable
  conf: 0.9
  any:
  - id: provider-eth-accounts-request
  - id: direct-eth-accounts-request
  unless:
  - id: metadata/package/testing/harness/runtime/
