defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]

composite_rules:
  - id: solana-signature-provider-fragments
    desc: Solana signature and RPC provider fragments
    crit: notable
    conf: 0.96
    near_bytes: 12000
    # GetBlock is a provider, not a transaction retrieval method. Retain the
    # three-observation conjunction while stating the neutral evidence.
    all:
      - id: micro-behaviors/communications/http/services/blockchain::solana-pocket-rpc-host-fragment
      - id: metadata/lang/source/naming::solana-signature-method-fragment
      - id: micro-behaviors/communications/http/services/blockchain::getblock-host-fragment
