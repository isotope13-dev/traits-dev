# Wallet-provider access and request syntax do not establish theft or diversion.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]

traits:
  - id: window-bracket-ethereum
    desc: window["ethereum"] access
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: window\[['"]ethereum['"]\]
  - id: ethereum-request-call
    desc: ethereum.request() call
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: ethereum\.request\s*\(
  - id: ethereum-request-bracket-call
    desc: Ethereum bracket-form request call syntax
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'ethereum\[["'']request["'']\]\s*\('
  - id: wallet-provider-request-reference
    desc: References a wallet provider request member
    for: [javascript, typescript]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \b(ethereum|solana|tronWeb)\.request\b

composite_rules:
  - id: ethereum-provider
    desc: Web3 wallet provider access (window.ethereum)
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/communications/blockchain/client::window-ethereum-reference
      - id: micro-behaviors/communications/blockchain/client::window-bracket-ethereum
  - id: ethereum-request
    desc: Ethereum wallet request API
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/communications/blockchain/client::ethereum-request-call
      - id: micro-behaviors/communications/blockchain/client::ethereum-request-bracket-call
  - id: ethereum-provider-or-request
    desc: Ethereum provider access or request
    crit: notable
    conf: 0.75
    any:
      - id: ethereum-provider
      - id: ethereum-request
