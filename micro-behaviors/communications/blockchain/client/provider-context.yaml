defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
composite_rules:
- id: blockchain-provider-reference-cluster
  desc: Multiple blockchain provider references
  crit: notable
  conf: 0.95
  needs: 2
  any:
  - id: micro-behaviors/communications/http/services/blockchain::trongrid-api
  - id: well-known/app/finance/trongrid::trongrid-api-encoded
  - id: micro-behaviors/communications/http/services/aptos::aptos-fullnode-provider
  - id: well-known/app/finance/aptos::aptos-fullnode-encoded
  - id: micro-behaviors/communications/http/services/blockchain::bsc-public-rpc-provider
  - id: well-known/app/finance/binance::bsc-dataseed-encoded
  - id: well-known/app/finance/defibit::bsc-defibit-jshex
  - id: well-known/app/finance/publicnode::bsc-publicnode-encoded
  - id: micro-behaviors/communications/blockchain/client::polygon-rpc-host-cluster
- id: transaction-hex-public-provider-context
  desc: Transaction hex near public blockchain providers
  crit: notable
  conf: 0.97
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/blockchain/ethereum::ethereum-transaction-by-hash-literal
  - id: micro-behaviors/data/decode/hex::transaction-input-hex
  any:
  - id: micro-behaviors/communications/http/services/blockchain::trongrid-api
  - id: micro-behaviors/communications/http/services/aptos::aptos-fullnode-provider
  - id: micro-behaviors/communications/http/services/blockchain::bsc-public-rpc-provider
  - id: micro-behaviors/communications/blockchain/ethereum::ethereum-public-rpc-host
- id: polygon-rpc-host-cluster
  desc: Multiple public Polygon RPC endpoints
  crit: notable
  conf: 0.93
  for:
  - html
  - javascript
  - typescript
  any:
  - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-host
  - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-hosts-2
  - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-hosts-3
  - id: well-known/app/finance/lava-network::polygon-lava-build-encoded
  - id: well-known/app/finance/publicnode::polygon-publicnode-encoded
  - id: well-known/app/finance/nodies::polygon-nodies-encoded
  - id: well-known/app/finance/drpc::polygon-drpc-encoded
  - id: well-known/app/finance/subquery::polygon-subquery-encoded
  - id: well-known/app/finance/nodies::polygon-pokt-encoded
  - id: well-known/app/finance/tenderly::polygon-tenderly-encoded
  - id: well-known/app/finance/tenderly::polygon-tenderly-public-encoded
  - id: well-known/app/finance/zan::polygon-zan-encoded
  - id: well-known/app/finance/polygon-rpc::polygon-rpc-com-b64xor255
  - id: well-known/app/finance/quicknode::polygon-matic-quiknode-b64xor255
  - id: well-known/app/finance/ankr::polygon-ankr-b64xor255
  - id: well-known/app/finance/blastapi::polygon-blastapi-b64xor255
  - id: well-known/app/finance/polygon-rpc::polygon-rpc-pair-b64xor255
  needs: 3
