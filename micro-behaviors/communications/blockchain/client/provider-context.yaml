defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
composite_rules:
- id: blockchain-provider-reference-cluster
  desc: Multiple blockchain provider references
  crit: notable
  conf: 0.95
  needs: 2
  any:
  - id: micro-behaviors/communications/http/services/blockchain::trongrid-api
  - id: micro-behaviors/communications/http/url/rpc::trongrid-api-encoded
  - id: micro-behaviors/communications/http/url/rpc::aptos-fullnode-provider
  - id: micro-behaviors/communications/http/url/rpc::aptos-fullnode-encoded
  - id: micro-behaviors/communications/http/url/rpc::bsc-public-rpc-provider
  - id: micro-behaviors/communications/http/url/rpc::bsc-dataseed-encoded
  - id: micro-behaviors/communications/http/url/rpc::bsc-defibit-jshex
  - id: micro-behaviors/communications/http/url/rpc::bsc-publicnode-encoded
  - id: micro-behaviors/communications/blockchain/client::polygon-rpc-host-cluster
  unless:
  - id: well-known/lib/crypto/bitgo-js::bitgo-js-archive-context
  - id: well-known/lib/crypto/defillama-adapters/
- id: transaction-hex-public-provider-context
  desc: Transaction hex near public blockchain providers
  crit: notable
  conf: 0.97
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/blockchain/client::ethereum-transaction-by-hash-literal
  - id: micro-behaviors/data/decode/hex::transaction-input-hex
  any:
  - id: micro-behaviors/communications/http/services/blockchain::trongrid-api
  - id: micro-behaviors/communications/http/url/rpc::aptos-fullnode-provider
  - id: micro-behaviors/communications/http/url/rpc::bsc-public-rpc-provider
  - id: micro-behaviors/communications/http/url/rpc::ethereum-public-rpc-host
- id: polygon-rpc-host-cluster
  desc: Multiple public Polygon RPC endpoints
  crit: notable
  conf: 0.93
  for:
  - html
  - javascript
  - typescript
  any:
  - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-host
  - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-hosts-2
  - id: micro-behaviors/communications/http/services/blockchain::polygon-public-rpc-hosts-3
  - id: micro-behaviors/communications/http/url/rpc::polygon-lava-build-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-publicnode-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-nodies-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-drpc-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-subquery-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-pokt-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-tenderly-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-tenderly-public-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-zan-encoded
  - id: micro-behaviors/communications/http/url/rpc::polygon-rpc-com-b64xor255
  - id: micro-behaviors/communications/http/url/rpc::polygon-matic-quiknode-b64xor255
  - id: micro-behaviors/communications/http/url/rpc::polygon-ankr-b64xor255
  - id: micro-behaviors/communications/http/url/rpc::polygon-blastapi-b64xor255
  - id: micro-behaviors/communications/http/url/rpc::polygon-rpc-pair-b64xor255
  needs: 3
