defaults:
  platforms: [windows, unix]
  for: [lua]
composite_rules:
  # Public RPC fallbacks are ordinary wallet behavior. They do not establish
  # that the contract response supplies an attacker-controlled endpoint.
  - id: lua-polygon-contract-call-fallbacks
    desc: Lua eth_call with multiple Polygon RPC hosts
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/rpc::ethereum-contract-call-method
    any:
      - id: micro-behaviors/communications/http/services/blockchain::polygon-drpc
      - id: micro-behaviors/communications/http/services/blockchain::polygon-nodies
      - id: micro-behaviors/communications/http/services/blockchain::polygon-publicnode-host
      - id: micro-behaviors/communications/http/services/blockchain::polygon-quiknode
      - id: micro-behaviors/communications/http/services/blockchain::polygon-tatum
    needs: 2
