defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  crit: notable
traits:
- for:
  - scripts
  - source
  id: solana-rpc-method-source
  desc: Solana account or signature RPC method literal
  conf: 0.8
  if:
    type: string_literal
    regex: ^get(SignaturesForAddress|SignFAddress|AccountInfo)$
- for:
  - binaries
  id: solana-rpc-method-binary
  desc: Solana account or signature RPC method reference
  conf: 0.8
  if:
    type: text
    regex: ^get(SignaturesForAddress|SignFAddress|AccountInfo)$
- for:
  - scripts
  - source
  id: solana-memo-program-id-source
  desc: Solana Memo program address
  conf: 0.92
  if:
    type: string_literal
    regex: ^Memo(Sq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr|1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo)$
- for:
  - binaries
  id: solana-memo-program-id-binary
  desc: Solana Memo program address
  conf: 0.92
  if:
    type: text
    regex: ^Memo(Sq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr|1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo)$
- for:
  - scripts
  - source
  id: solana-get-signatures-for-address-source
  desc: getSignaturesForAddress method-name literal
  conf: 0.9
  if:
    type: string_literal
    exact: getSignaturesForAddress
- for:
  - binaries
  id: solana-get-signatures-for-address-binary
  desc: getSignaturesForAddress method-name reference
  conf: 0.9
  if:
    type: text
    exact: getSignaturesForAddress
composite_rules:
- id: solana-account-signature-rpc-references
  desc: Solana account or signature methods and endpoint
  conf: 0.9
  all:
  - id: micro-behaviors/communications/blockchain/client::solana-rpc-method
  - id: micro-behaviors/communications/http/url/rpc::solana-rpc-url
- id: solana-rpc-method-any
  desc: Solana JSON-RPC method
  any:
  - id: micro-behaviors/communications/blockchain/client::solana-rpc-method
  - id: micro-behaviors/communications/blockchain/client::solana-rpc-method-2
  - id: micro-behaviors/communications/blockchain/client::solana-get-signatures-for-address
  - id: micro-behaviors/communications/blockchain/client::solana-get-transaction
- id: solana-memo-program-references
  desc: Solana Memo program or instruction references
  conf: 0.93
  any:
  - id: micro-behaviors/communications/blockchain/client::solana-memo-program-id
  - id: micro-behaviors/data/parse/vocabulary::memo-program-id-name-proximity
- id: solana-signature-transaction-rpc-references
  desc: Signature and transaction RPC endpoint references
  conf: 0.94
  near_lines: 40
  all:
  - id: micro-behaviors/communications/blockchain/client::solana-get-signatures-for-address
  - id: micro-behaviors/communications/blockchain/client::solana-get-transaction
  - id: micro-behaviors/communications/http/url/rpc::solana-rpc-url
- id: solana-rpc-method-2
  desc: Balance or transaction method with Solana references
  conf: 0.9
  all:
  - id: micro-behaviors/communications/rpc::balance-transaction-blockhash-method-literal
  any:
  - id: micro-behaviors/communications/http/url/rpc::solana-rpc-url
  - id: micro-behaviors/communications/blockchain/client::solana-get-signatures-for-address
  - id: micro-behaviors/data/parse/vocabulary::account-keys-field-name
- id: solana-get-transaction
  desc: getTransaction method literal with Solana references
  conf: 0.9
  all:
  - id: micro-behaviors/communications/rpc::get-transaction-method-literal
  any:
  - id: micro-behaviors/communications/http/url/rpc::solana-rpc-url
  - id: micro-behaviors/communications/blockchain/client::solana-get-signatures-for-address
  - id: micro-behaviors/data/parse/vocabulary::account-keys-field-name
- id: solana-rpc-method
  desc: Solana account or signature RPC method literal
  conf: 0.8
  any:
  - id: solana-rpc-method-source
  - id: solana-rpc-method-binary
- id: solana-memo-program-id
  desc: Solana Memo program address
  conf: 0.92
  any:
  - id: solana-memo-program-id-source
  - id: solana-memo-program-id-binary
- id: solana-get-signatures-for-address
  desc: getSignaturesForAddress method-name literal
  conf: 0.9
  any:
  - id: solana-get-signatures-for-address-source
  - id: solana-get-signatures-for-address-binary
