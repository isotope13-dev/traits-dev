defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - pe
  - macho
traits:
- id: jsonrpc-mining-login
  desc: JSON-RPC mining login request template
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: '"jsonrpc":"2.0","method":"login","params":{"login":'
    section: any
- id: jsonrpc-mining-submit
  desc: JSON-RPC mining share submission template
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '"jsonrpc"\s*:\s*"2\.0"\s*,\s*"method"\s*:\s*"submit"\s*,\s*"params"\s*:\s*\{'
    section: any
