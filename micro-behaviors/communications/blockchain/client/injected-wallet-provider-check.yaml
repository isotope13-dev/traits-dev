# dApps and wallet SDKs detect the wallet extension's injected provider
# before asking it for accounts: the provider object carries branded flag
# properties (`isPhantom`, `isMetaMask`, `isCoinbaseWallet`, ...) that the
# extension sets on `window.solana` / `window.ethereum`. Checking these
# flags is the first step of the wallet-connection handshake — the user
# approves the connection in the wallet UI — not wallet targeting.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: injected-wallet-provider-check
    desc: Checks the injected wallet provider flag
    if:
      type: text
      regex: 'is(Phantom|MetaMask|CoinbaseWallet|Solflare|Backpack)\b'
