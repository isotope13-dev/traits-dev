defaults:
  crit: notable
  for:
    - pe
  platforms:
    - windows
traits:
  - id: rpc-server-protseq-endpoint
    desc: RPC server endpoint API name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '^RpcServerUseProtseqEp[AW]$'
  - id: rpc-server-register-interface
    desc: RPC register-interface symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: RpcServerRegisterIfEx
  - id: rpc-server-unregister-interface
    desc: RPC unregister-interface symbol reference
    crit: notable
    conf: 0.82
    if:
      type: symbol
      exact: RpcServerUnregisterIf
  - id: rpc-server-dispatch-stub
    desc: RPC dispatch-stub symbol reference
    crit: notable
    conf: 0.86
    if:
      type: symbol
      exact: NdrServerCall2
  - id: rpc-server-listen
    desc: RPC server-listen symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: RpcServerListen
  - id: rpc-local-protseq
    desc: Local RPC protocol sequence
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: ncalrpc
  - id: rpc-tcp-protseq
    desc: TCP RPC protocol sequence
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: ncacn_ip_tcp
  - id: rpc-impersonate-client
    desc: RPC client-impersonation symbol reference
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: RpcImpersonateClient
  - id: rpc-revert-to-self
    desc: RPC revert-to-self symbol reference
    crit: notable
    conf: 0.84
    if:
      type: symbol
      exact: RpcRevertToSelf
  - id: rpc-binding-inq-object
    desc: RPC binding object inquiry import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: RpcBindingInqObject
composite_rules:
  - id: local-rpc-server
    desc: Local RPC server API references
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/rpc::rpc-server-protseq-endpoint
      - id: micro-behaviors/communications/rpc::rpc-server-register-interface
      - id: micro-behaviors/communications/rpc::rpc-local-protseq
    any:
      - id: micro-behaviors/communications/rpc::rpc-server-dispatch-stub
      - id: micro-behaviors/communications/rpc::rpc-server-listen
  - id: tcp-rpc-server
    desc: TCP RPC server API references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/rpc::rpc-server-protseq-endpoint
      - id: micro-behaviors/communications/rpc::rpc-server-register-interface
      - id: micro-behaviors/communications/rpc::rpc-tcp-protseq
    any:
      - id: micro-behaviors/communications/rpc::rpc-server-dispatch-stub
      - id: micro-behaviors/communications/rpc::rpc-server-listen
  - id: rpc-client-impersonation-flow
    desc: RPC impersonation API references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/rpc::rpc-impersonate-client
      - id: micro-behaviors/communications/rpc::rpc-revert-to-self
  - id: local-rpc-impersonation-server
    desc: Local RPC and impersonation references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/rpc::local-rpc-server
      - id: micro-behaviors/communications/rpc::rpc-client-impersonation-flow
