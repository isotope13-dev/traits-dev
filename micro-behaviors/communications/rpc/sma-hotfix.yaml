    desc: SMA hotfix removal RPC method reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: sysCtrl.execRemoveHotfix

composite_rules:
  - id: sma-hotfix-removal-interface
    desc: SMA hotfix removal interface reference
    crit: notable
    conf: 0.94
    any:
      - id: sma-hotfix-removal-rpc
      - id: micro-behaviors/communications/http/url/endpoint::sma-rollback-endpoint
