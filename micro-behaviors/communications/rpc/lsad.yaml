defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  # Follow the request object into the dispatch call. A class declaration,
  # constructor alone, or a method named request with unrelated data is not
  # an LSAD RPC transmission. The receiver's variable name is unrestricted.
  - id: lsad-request-dispatch
    desc: Dispatches a constructed LSAD RPC request
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      arg:
        index: 0
        from:
          call: '^Lsar[A-Za-z0-9]+$'
