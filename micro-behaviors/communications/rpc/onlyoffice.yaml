defaults:
  for: [python, javascript]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0
traits:
  - id: sendform-rpc-message
    desc: Construct sendForm RPC message
    if:
      type: text
      regex: '["\x27]type["\x27]\s*:\s*["\x27]sendForm["\x27]'
  - id: view-mode-auth-field
    desc: Authenticate document in view mode
    if:
      type: text
      regex: '["\x27]mode["\x27]\s*:\s*["\x27]view["\x27]'
  - id: callback-url-auth-field
    desc: Set document reconnect callback URL
    if:
      type: text
      regex: '["\x27]documentCallbackUrl["\x27]\s*:'
