# Serialized DWR calls and arguments, shared across exploit-client languages.
defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell, javascript, java, text, jsp]

traits:
  - id: dwr-multiple-call-count
    desc: DWR batch declares multiple RPC calls
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)\bcallCount=([2-9]|[1-9][0-9]+)\b.{1,160}scriptSessionId='

  - id: dwr-password-check-call
    desc: DWR invokes the SecurityService password check
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-scriptName=SecurityService\s+c\d+-methodName=isPasswordUppercase\b'

  - id: dwr-workflow-service-call
    desc: DWR invokes the workflow service
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-scriptName=workflow\s+c\d+-methodName=runWorkflowRule\b'

  - id: archibus-record-query-call
    desc: DWR selects the Archibus record-query workflow
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-param0=string:AbCommonResources-getDataRecords\b'

  - id: archibus-report-write-call
    desc: DWR selects the Archibus report-write workflow
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-param0=string:AbCommonResources-writeHTMLtoFile\b'

  # A JSP token supplied as a DWR argument is incomplete evidence: this alone
  # says neither that it selects a file extension nor that anything executes.
  - id: dwr-jsp-string-argument
    desc: DWR string argument names JSP format
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'c\d+-e\d+=string:jspx?\b'
