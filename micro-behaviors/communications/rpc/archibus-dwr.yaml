# Serialized DWR calls and arguments, shared across exploit-client languages.
defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell, javascript, java, text, jsp]

traits:
  - id: dwr-multiple-call-count
    desc: DWR batch declares multiple RPC calls
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)\bcallCount=([2-9]|[1-9][0-9]+)\b.{1,160}scriptSessionId='

  - id: dwr-password-check-call
    desc: DWR invokes the SecurityService password check
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-scriptName=SecurityService\s+c\d+-methodName=isPasswordUppercase\b'

  - id: dwr-workflow-service-call
    desc: DWR invokes the workflow service
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-scriptName=workflow\s+c\d+-methodName=runWorkflowRule\b'

  - id: archibus-record-query-call
    desc: DWR selects the Archibus record-query workflow
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-param0=string:AbCommonResources-getDataRecords\b'

  - id: archibus-report-write-call
    desc: DWR selects the Archibus report-write workflow
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'c\d+-param0=string:AbCommonResources-writeHTMLtoFile\b'

  # Match the actual reference, not an unrelated argument whose value is jsp.
  # The 24-byte prefix is "fileExtension:reference:"; compare the complete
  # c<call>-e<entry> identifier with the JSP-valued argument's identifier.
  - id: dwr-jsp-file-extension-argument
    for: [python, powershell, text, jsp]
    desc: DWR file-extension reference resolves to JSP
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dwr_jsp_file_extension_argument {
          strings:
            $ref = /\bfileExtension:reference:c[0-9]{1,6}-e[0-9]{1,6}\b/
            $arg = /\bc[0-9]{1,6}-e[0-9]{1,6}=string:jspx?(\r?\n|$)/
          condition:
            all of them and
            for any r in (1..#ref) : (
              for any a in (1..#arg) : (
                uint8(@arg[a]+!ref[r]-24) == 61 and
                for all b in (0..!ref[r]-25) : (
                  uint8(@ref[r]+24+b) == uint8(@arg[a]+b)
                )
              )
            )
        }
