defaults:
  platforms: [linux, macos, windows]
traits:
- id: jsonrpc-eth-call-body
  desc: JSON-RPC eth_call request body
  crit: notable
  conf: 0.95
  for: [html, scripts, binaries, javascript, typescript, rust, csharp]
  if:
    type: text
    regex: '"jsonrpc"\s*:\s*"2\.0"[\s\S]{0,160}"method"\s*:\s*"eth_call"[\s\S]{0,160}"params"'
