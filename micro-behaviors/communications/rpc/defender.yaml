# Defender update RPC identifiers are normal IPC references. Escalation
# requires the update-object alias and an oplock-controlled redirection.
defaults:
  platforms: [windows]
  for: [binaries, source, scripts]
  crit: notable
  conf: 0.99

traits:
  - id: defender-rpc-uuid
    desc: Defender definition-update RPC interface UUID
    if:
      type: text
      regex: '(?i)c503f532-443a-4c69-8300-ccd1fbdb3839'

  - id: defender-mpservice-alpc
    desc: Defender IMpService local RPC endpoint reference
    if:
      type: text
      substr: IMpService77BDAF73-B396-481F-9042-AD358843EC24
