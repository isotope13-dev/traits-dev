defaults:
  platforms: [windows, unix]
  for: [binaries, javascript, typescript, python, php, go, c, cpp, csharp, data, text]
  crit: notable
  conf: 0.9

traits:
  - id: jsonrpc-2-protocol-object
    desc: JSON-RPC 2.0 protocol object
    if:
      type: text
      regex: '(\\?["'']jsonrpc\\?["'']|\bjsonrpc)\s*(:|=>|=)\s*\\?["'']2\.0'

  # Serialized JSON-RPC requests always use double-quoted JSON field names.
  # Keeping both fields in one matcher distinguishes this wire artifact from
  # unrelated application objects whose method happens to be "initialize".
  - id: jsonrpc-initialize-request-body
    desc: JSON-RPC initialize request body
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '"jsonrpc"\s*:\s*"2\.0".{0,100}"method"\s*:\s*"initialize"'

  - id: jsonrpc-keepalive-request-body
    desc: JSON-RPC keepalived request body
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '"jsonrpc"\s*:\s*"2\.0".{0,100}"method"\s*:\s*"keepalived"'
