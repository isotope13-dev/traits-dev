defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -clojure, -applescript, -vbs, -beam, -static-lib]
  attack: T1071.001
  mbc: C0002

traits:
  - id: soap-action-header-line
    desc: SOAPAction HTTP header line
    crit: notable
    conf: 0.96
    if:
      # Header syntax rather than the word "SOAPAction" in prose. This covers
      # raw request templates and compiled clients without naming a service.
      type: text
      regex: '(?im)(^|["''`])SOAPAction\s*:'
