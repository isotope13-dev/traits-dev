defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
- id: zabbix-username-identifier-field
  desc: Username field carries an identifier value
  if:
    type: text
    regex: '["'']username["'']\s*:\s*[A-Za-z_]\w*'

- id: zabbix-password-identifier-field
  desc: Password field carries an identifier value
  if:
    type: text
    regex: '["'']password["'']\s*:\s*[A-Za-z_]\w*'

- id: zabbix-user-login-method-name-reference
  desc: References Zabbix user.login as an API method
  if:
    type: text
    regex: "call\\s*\\(\\s*[\"']user\\.login[\"']\\s*,"

- id: zabbix-host-delete-method-name-reference
  desc: References Zabbix host.delete as an API method
  if:
    type: text
    regex: "call\\s*\\(\\s*[\"']host\\.delete[\"']\\s*,"

composite_rules:
- id: python-zabbix-login-credential-fields
  desc: Zabbix login passes username/password values
  crit: notable
  conf: 0.98
  scope: file
  near_bytes: 256
  all:
  - id: zabbix-user-login-method-name-reference
  - id: zabbix-username-identifier-field
  - id: zabbix-password-identifier-field
