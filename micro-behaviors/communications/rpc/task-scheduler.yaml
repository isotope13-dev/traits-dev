# Windows Task Scheduler RPC client operations. These protocol-level method
# names are shared by Impacket and native TSCH implementations; objective
# rules supply the remote-execution interpretation.
defaults:
  for: [python, pyc, powershell, pe, dll, c, cpp, csharp]
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.96
  attack: T1053.005

traits:
  - id: tsch-register-task-call
    desc: Task Scheduler RPC task registration
    if:
      type: text
      regex: '\b(h)?SchRpcRegisterTask\s*\('

  - id: tsch-run-task-call
    desc: Task Scheduler RPC task execution
    if:
      type: text
      regex: '\b(h)?SchRpcRun\s*\('

  - id: tsch-delete-task-call
    desc: Task Scheduler RPC task deletion
    if:
      type: text
      regex: '\b(h)?SchRpcDelete\s*\('

  - id: tsch-last-run-query
    desc: Task Scheduler RPC completion query
    if:
      type: text
      regex: '\b(h)?SchRpcGetLastRunInfo\s*\('

  - id: atsvc-rpc-named-pipe-binding
    desc: Task Scheduler RPC named-pipe binding
    if:
      type: text
      regex: '(?i)\bncacn_np:[^\r\n]{1,160}\[\\{1,2}pipe\\{1,2}atsvc\]'
