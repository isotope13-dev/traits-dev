# vmdir's SRP verifier helper and database-copy RPC interfaces (CVE-2026-123890).
# Both interface UUIDs also appear in ordinary SRP logins and legitimate
# directory replication, so they carry no claim alone. The session-key getter
# name and the handle-guessing mechanism below supply the attack evidence.
defaults:
  platforms: [unix, windows]
  for: [python, go]
  crit: component
  conf: 0.9

traits:
  - id: vmdir-srp-verifier-interface-uuid
    desc: References vmdir SRP verifier RPC interface
    if:
      type: text
      case_insensitive: true
      substr: c7e94609-6ab0-4767-8e92-b6485bff1649

  - id: vmdir-dbcp-interface-uuid
    desc: References vmdir database-copy RPC interface
    if:
      type: text
      case_insensitive: true
      substr: 72c780fe-af6b-42ba-9b02-f61f4ccc98ed

  - id: vmdir-srp-session-key-getter-call
    desc: Calls vmdir SRP session-key getter
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: srp_verifier_get_session_key

  - id: vmdir-uuid1-fields-reconstruction-call
    desc: Rebuilds a UUID1 from explicit time fields
    if:
      type: text
      regex: 'uuid\.UUID\(\s*fields\s*='

  - id: vmdir-uuid1-clock-fields-reference
    desc: Reads UUID clock-sequence fields
    if:
      type: text
      regex: '\.clock_seq(_low|_hi_variant)?\b'

composite_rules:
  - id: vmdir-srp-handle-window-brute-force
    desc: Searches UUID1 handles by shared clock fields
    crit: suspicious
    conf: 0.95
    near_lines: 25
    all:
      - id: vmdir-uuid1-fields-reconstruction-call
      - id: vmdir-uuid1-clock-fields-reference
