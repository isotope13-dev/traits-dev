defaults:
  platforms: [windows, unix]
  for: [javascript, pe, dll]
  attack: T1219
  mbc: B0022

  crit: notable
traits:
- id: remote-pair-token-manager-cli
  desc: Remote pair-token manager CLI
  conf: 0.91
  if:
    type: text
    regex: "--manager <host:port>[\\s\\S]{0,240}--pair <token>|pairing token[\\s\\S]{0,160}Hub"
- id: dotnet-remote-agent-transport
  desc: .NET remote agent transport
  conf: 0.93
  for: [pe, dll]
  if:
    type: text
    regex: "RemoteAgent\\.Fast|TcpRemoteTransport|WebSocketRemoteTransport"
composite_rules:
- id: dotnet-remote-frame-agent
  desc: .NET remote frame agent capability
  conf: 0.97
  for: [pe, dll]
  all:
  - id: micro-behaviors/communications/rpc::dotnet-remote-agent-transport
  - id: micro-behaviors/data/parse/binary::dotnet-remote-binary-frame-stream
  any:
  - id: micro-behaviors/communications/websocket/client::dotnet-client-websocket
  - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
  - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name

