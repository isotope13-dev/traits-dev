defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-erpc-execute-call-terms
    desc: Constructs erpc execute_call terms
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          arguments: (argument_list
            (call function: (identifier) @encoder
              arguments: (argument_list (string) @module))
            . (call function: (identifier) @same_encoder
              arguments: (argument_list (string) @method)))) @evidence
        (#eq? @encoder @same_encoder)
        (#match? @module "^[\"']erpc[\"']$")
        (#match? @method "^[\"']execute_call[\"']$"))
