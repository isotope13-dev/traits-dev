defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: named-secret-read-rpc-reference
  desc: References named secret-read RPC
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(Get|Fetch|Read)[A-Za-z]{0,20}Secret[A-Za-z]{0,24}(Request|ByLabel|ByName)\b'


composite_rules:
- id: secret-read-rpc-session-token-context
  desc: Secret-read RPC near session-token name
  crit: notable
  conf: 0.95
  near_lines: 40
  all:
    - id: micro-behaviors/os/env/secret-name::platform-secret-store-session-token-name
    - id: micro-behaviors/communications/rpc::named-secret-read-rpc-reference
