# Ethereum JSON-RPC methods, batching and transport configuration.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.9

traits:
  - id: ethereum-contract-call-method
    desc: Ethereum contract-read RPC method
    for: [scripts, binaries]
    if:
      type: text
      word: eth_call

  - id: viem-http-rpc-transport
    desc: Viem HTTP transport uses configured RPC
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\btransport\s*:\s*http\s*\([^;\n]{0,160}\b(rpcUrl|endpoint|baseUrl)\b'

  - id: ethereum-jsonrpc-transaction-method
    desc: Ethereum JSON-RPC transaction lookup method
    for: [javascript, typescript]
    if:
      type: text
      regex: 'eth_(getLogs|getTransactionByHash|getTransactionReceipt)'

  - id: ethereum-jsonrpc-block-number-method
    desc: Ethereum JSON-RPC block-number lookup method
    crit: notable
    conf: 0.9
    for: [javascript, typescript, go]
    if:
      type: text
      word: eth_blockNumber

  - id: ethereum-jsonrpc-block-by-number-method
    desc: Ethereum JSON-RPC block lookup
    crit: notable
    conf: 0.9
    for: [javascript, typescript, go]
    if:
      type: text
      word: eth_getBlockByNumber

  - id: ethereum-jsonrpc-transaction-count-method
    desc: Ethereum transaction-count RPC
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      word: eth_getTransactionCount

  - id: ethereum-jsonrpc-method
    desc: Ethereum JSON-RPC method field
    if:
      type: text
      regex: '(["'']method["'']|\bmethod)\s*[:=]\s*["'']eth_[A-Za-z]+'

  - id: ethereum-jsonrpc-batch-array
    desc: Array includes JSON-RPC 2.0 objects
    if:
      type: text
      regex: '(?s)\[\s*\{.{0,240}\bjsonrpc\b.{0,40}2\.0.{0,240}\},\s*\{'

composite_rules:
  - id: ethereum-explorer-rpc-transaction-lookup
    desc: Looks up an Ethereum transaction through an explorer and JSON-RPC
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/url/rpc::ethereum-explorer-transaction-url
      - id: ethereum-jsonrpc-transaction-method

  - id: ethereum-jsonrpc-batch-request
    desc: Batches Ethereum JSON-RPC requests
    conf: 0.92
    near_lines: 12
    all:
      - id: ethereum-jsonrpc-batch-array
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: ethereum-jsonrpc-method

  - id: ethereum-rpc-provider-list
    for: [javascript]
    desc: Lists multiple Ethereum RPC providers
    conf: 0.92
    near_lines: 4
    all:
      - id: micro-behaviors/communications/rpc::rpc-endpoint-array
      - id: micro-behaviors/communications/rpc::multiple-rpc-provider-urls
    any:
      - id: ethereum-jsonrpc-method
      - id: micro-behaviors/communications/http/url/rpc::ethereum-public-rpc-host
