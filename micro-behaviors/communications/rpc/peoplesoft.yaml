# Protocol identifiers shared by clients in any implementation language.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, jsp, xml, text]
  crit: notable
  conf: 0.98

traits:
  - id: peoplesoft-http-target-connector
    desc: PeopleSoft request selects HTTP target connector
    if:
      type: text
      regex: '<ConnectorClassName>\s*HttpTargetConnector\s*</ConnectorClassName>'

  - id: peoplesoft-execute-process-activity-command
    desc: PeopleSoft activity log command reference
    if:
      type: text
      word: ExecuteProcessActivityCommand
