traits:
- platforms:
  - routeros
  - appliance
  - unix
  for:
  - python
  - pyc
  id: routeros-api-login-fields
  desc: RouterOS API login name/password fields
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (/login[\s\S]{0,160}=(name|password)=|=(name|password)=[\s\S]{0,160}/login)
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: well-known/tool/offensive/wirelessxpl::routeros-api-client-context
  - id: well-known/tool/offensive/wirelessxpl::authorized-framework-context
  - id: micro-behaviors/os/sysinfo/profile::routeros-api-system-profile-query
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - go
  - python
  - javascript
  - typescript
  id: dahua-passwd-find-descript
  desc: Dahua PasswdFind.getDescript RPC reference
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)PasswdFind\.getDescript
composite_rules:
- platforms:
  - routeros
  - appliance
  - unix
  for:
  - python
  id: routeros-api-socket-login
  desc: RouterOS API socket login and data transfer
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/communications/rpc::routeros-api-login-fields
  - id: micro-behaviors/communications/ip/endpoint::routeros-api-port-argument
  - id: micro-behaviors/communications/socket/connect::connect-python
  - id: micro-behaviors/communications/socket/receive::socket-data-transfer
