defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
  - id: go-dahua-login-call
    desc: Calls Dahua global.login RPC
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.(Call|CallT)$'
      arg:
        index: 0
        kind: string
        exact: global.login

  - id: go-dahua-console-run-command
    desc: Calls Dahua console command RPC
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.(Call|CallT)$'
      arg:
        index: 0
        kind: string
        exact: console.runCmd
