defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]

traits:
  - id: balance-transaction-blockhash-method-literal
    desc: Balance, transaction or blockhash method literal
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: ^get(Balance|Transaction|LatestBlockhash)$
  # Field names of a Solana getParsedTransaction / getTransaction RPC
  # response. Individually common in web3.js; together they identify code
  # that parses full parsed-transaction payloads (Go struct tags
  # `json:"accountKeys"` survive into a compiled binary's strings, and the
  # bare identifiers appear in JS).

  - id: get-transaction-method-literal
    desc: getTransaction method-name literal
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      exact: getTransaction
  # Obfuscated loaders often split the provider and method strings across
  # concatenated literals.  These are deliberately components: the hostile
  # conclusion below requires the complete RPC/decode/install-hook shape.
