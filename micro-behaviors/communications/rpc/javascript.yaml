defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: rpc-endpoint-array
    desc: Declares a JavaScript RPC endpoint array
    if:
      type: text
      regex: '\b(rpc|rpcProviders|rpc_providers|rpcEndpoints)\s*=\s*\['

  - id: object-method-rpc-request
    desc: RPC-style request call with leading method field
    # `method` must lead the options object: wallet providers call
    # `ethereum.request({method: ...})`, while Node's `https.request({`
    # carries hostname/port/path first with `method: 'POST'` later. The
    # unanchored form fired on every Node HTTPS POST (e.g. an npm stealer
    # exfiltrating to a hardcoded IP) and mislabeled it an RPC call.
    if:
      type: text
      regex: '\.request\s*\(\s*\{\s*method\s*:'

composite_rules: []
