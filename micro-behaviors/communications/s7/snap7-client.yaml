# Snap7 client API (python-snap7, libsnap7/Snap7 `Cli_*` C entry points).
#
# Common wrapper names such as db_write are not unique to Snap7. The method
# atoms below are therefore components; the emitted capabilities combine them
# with an explicit Snap7 library identity. Objectives infer intent from those
# neutral, library-backed operations.
defaults:
  for: [python, javascript, c, cpp, csharp, go, rust]
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.93

traits:
  - id: cpu-stop-method
    desc: Snap7-compatible CPU stop method name
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(plc_stop|cli_plcstop)$'

  - id: cpu-start-method
    desc: Snap7-compatible CPU start method name
    crit: component
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(plc_(hot|cold)_start|cli_plc(hot|cold)start)$'

  - id: session-password-method
    desc: Snap7-compatible session password method name
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)((set|clear)_session_password|cli_(set|clear)sessionpassword)$'

  - id: memory-write-method
    desc: Snap7 memory write method name
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(db_write|write_area|cli_(dbwrite|writearea))$'

  - id: memory-read-method
    desc: Snap7 memory read method name
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(db_read|read_area|cli_(dbread|readarea))$'

  - id: program-block-write-method
    desc: Snap7 program block write method name
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(as_download|download_block|cli_download)$'

  - id: program-block-read-method
    desc: Snap7 program block read method name
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(as_(full_)?upload|full_upload|upload_block|cli_(full)?upload)$'

  - id: cpu-runtime-property-method
    desc: Snap7 CPU state, info, or protection query
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(get_cpu_(state|info)|get_protection|cli_get(cpu(state|info)|protection))$'

  - id: cpu-identity-property-method
    desc: Snap7 CP info or order-code query
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(get_(cp_info|order_code)|cli_get(cpinfo|ordercode))$'

  # CPU family designators. A target table naming several Siemens CPU
  # generations is the shape an operator-wide sabotage script has and a
  # single-CPU driver or test harness does not.
  - id: s7-300-designator
    desc: Siemens S7-300 CPU family designator
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bS7[-_ ]?300\b'

  - id: s7-400-designator
    desc: Siemens S7-400 CPU family designator
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bS7[-_ ]?400\b'

  - id: s7-1200-designator
    desc: Siemens S7-1200 CPU family designator
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bS7[-_ ]?1200\b'

  - id: s7-1500-designator
    desc: Siemens S7-1500 CPU family designator
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bS7[-_ ]?1500\b'

composite_rules:
  - id: snap7-cpu-stop-call
    desc: Calls Snap7 plc_stop to halt a CPU
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/s7::library
      - id: cpu-stop-method
    near_lines: 96

  - id: snap7-cpu-start-call
    desc: Calls a Snap7 CPU hot/cold start
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/s7::library
      - id: cpu-start-method
    near_lines: 96

  - id: snap7-session-password-call
    desc: Sets a Snap7 S7 session password
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/s7::library
      - id: session-password-method
    near_lines: 96

  - id: snap7-memory-write-call
    desc: Writes a Siemens CPU memory area through Snap7
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/s7::library
      - id: memory-write-method
    near_lines: 96

  - id: snap7-memory-read-call
    desc: Reads a Siemens CPU memory area through Snap7
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/s7::library
      - id: memory-read-method
    near_lines: 96

  - id: snap7-program-block-write-call
    desc: Writes a Siemens CPU program block through Snap7
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/s7::library
      - id: program-block-write-method
    near_lines: 96

  - id: snap7-program-block-read-call
    desc: Reads a Siemens CPU program block through Snap7
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/s7::library
      - id: program-block-read-method
    near_lines: 96

  - id: snap7-cpu-property-read-call
    desc: Queries Siemens CPU properties through Snap7
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/s7::library
    any:
      - id: cpu-runtime-property-method
      - id: cpu-identity-property-method
    near_lines: 96

  - id: snap7-client-usage
    desc: Uses the Snap7 client API to operate a Siemens CPU
    crit: notable
    conf: 0.94
    any:
      - id: snap7-cpu-stop-call
      - id: snap7-cpu-start-call
      - id: snap7-session-password-call
      - id: snap7-memory-write-call
      - id: snap7-memory-read-call
      - id: snap7-program-block-write-call
      - id: snap7-program-block-read-call
      - id: snap7-cpu-property-read-call

  - id: s7-cpu-family-table
    desc: Names two or more Siemens CPU generations
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: s7-300-designator
      - id: s7-400-designator
      - id: s7-1200-designator
      - id: s7-1500-designator
