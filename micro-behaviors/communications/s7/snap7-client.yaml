# Snap7 client API (python-snap7, libsnap7/Snap7 `Cli_*` C entry points).
#
# The generic `set_operating_mode("stop")`-style names covered elsewhere are not
# what real S7comm tooling calls. Every Snap7-based client — engineering utility
# or sabotage script — reaches a Siemens CPU through these exact method names,
# so they are the durable anchor for S7 controller operations in any language
# that binds the library. Neutral capabilities: intent is inferred by
# objectives-tier composites that combine them.
defaults:
  for: [python, javascript, c, cpp, csharp, go]
  platforms: [windows, linux]
  crit: notable
  conf: 0.93

traits:
  - id: snap7-cpu-stop-call
    desc: Calls Snap7 plc_stop to halt a CPU
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(plc_stop|cli_plcstop)$'

  - id: snap7-cpu-start-call
    desc: Calls a Snap7 CPU hot/cold start
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(plc_(hot|cold)_start|cli_plc(hot|cold)start)$'

  - id: snap7-session-password-call
    desc: Sets a Snap7 S7 session password
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)((set|clear)_session_password|cli_(set|clear)sessionpassword)$'

  - id: snap7-memory-write-call
    desc: Writes a Siemens CPU memory area
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(db_write|write_area|write_multi_vars|[am]b_write)$'

  - id: snap7-cpu-state-read-call
    desc: Reads Siemens CPU state or protection
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(get_cpu_(state|info)|get_(pdu_length|protection))$'

  # CPU family designators. A target table naming several Siemens CPU
  # generations is the shape an operator-wide sabotage script has and a
  # single-CPU driver or test harness does not.
  - id: s7-300-designator
    desc: Siemens S7-300 CPU family designator
    crit: component
    for: [binaries, scripts]
    conf: 0.9
    if:
      type: text
      regex: '\bS7[-_ ]?300\b'

  - id: s7-400-designator
    desc: Siemens S7-400 CPU family designator
    crit: component
    for: [binaries, scripts]
    conf: 0.9
    if:
      type: text
      regex: '\bS7[-_ ]?400\b'

  - id: s7-1200-designator
    desc: Siemens S7-1200 CPU family designator
    crit: component
    for: [binaries, scripts]
    conf: 0.9
    if:
      type: text
      regex: '\bS7[-_ ]?1200\b'

  - id: s7-1500-designator
    desc: Siemens S7-1500 CPU family designator
    crit: component
    for: [binaries, scripts]
    conf: 0.9
    if:
      type: text
      regex: '\bS7[-_ ]?1500\b'

composite_rules:
  - id: snap7-client-usage
    desc: Uses the Snap7 client API to operate a Siemens CPU
    crit: notable
    conf: 0.94
    any:
      - id: snap7-cpu-stop-call
      - id: snap7-cpu-start-call
      - id: snap7-session-password-call
      - id: snap7-memory-write-call
      - id: snap7-cpu-state-read-call

  - id: s7-cpu-family-table
    desc: Names two or more Siemens CPU generations
    crit: notable
    conf: 0.92
    for: [binaries, scripts]
    needs: 2
    any:
      - id: s7-300-designator
      - id: s7-400-designator
      - id: s7-1200-designator
      - id: s7-1500-designator
