defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, data]
traits:
  - id: mirc-text-flood-command
    desc: mIRC trigger names a flood command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(:TEXT:|==\s*)[!.@]\w{0,12}flood'
  - id: mirc-load-event-handler
    desc: IRC script runs actions when loaded
    for: [mirc]
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)on\s+[0-9*]+:load:\s*\{'
