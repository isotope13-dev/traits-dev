defaults:
  for: [text]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: mirc-click-action-process-then-message
    desc: Click action launches process and sends
    count_min: 3
    if:
      type: text
      regex: '(?im)^[a-z]+=[./]{0,2}run +[^|\r\n]{1,160}\| *[./]{0,2}msg +[%#][^ \r\n]{1,40}'
