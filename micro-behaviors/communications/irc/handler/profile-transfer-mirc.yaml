---
defaults:
  platforms:
  - unix
  - windows
  for:
  - mirc
  - ircii
  - scripts
  - binaries
  - objectivec
  - lua
  - data
  - dos_com
traits:
- id: mirc-join-part-block-handler
  desc: mIRC JOIN/PART handler opens a block
  crit: notable
  if:
    type: text
    regex: "(?i)\\bon [^:\\r\\n]{1,12}:(join|part):[^\\r\\n{]{0,40}\\{\\s*$"
