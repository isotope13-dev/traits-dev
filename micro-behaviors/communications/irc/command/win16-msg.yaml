# An IRC client's /msg command written as a standalone string in a 16-bit
# program. A keystroke-driven script types this command into the client; the
# protocol-level PRIVMSG literal is covered by ipc-irc-traits.yaml.
defaults:
  for: [ne]
  platforms: [windows]
  crit: notable

traits:
  - id: win16-irc-msg-command
    desc: Win16 text carries IRC /msg command
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      exact: /msg
