defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: pe-irc-privmsg
    desc: IRC PRIVMSG command in binary
    crit: notable
    conf: 0.8
    if:
      type: text
      exact: PRIVMSG

  - id: pe-irc-nick
    desc: Bare NICK token
    crit: component
    conf: 0.7
    if:
      type: text
      exact: NICK

  - id: pe-irc-join
    desc: IRC channel JOIN command
    crit: notable
    conf: 0.65
    if:
      type: text
      regex: '\bJOIN\s+[#&+!][^\s,]{1,50}'

  - id: pe-irc-quit
    desc: Bare QUIT token
    crit: component
    conf: 0.5
    if:
      type: text
      exact: QUIT

  - id: pe-irc-motd
    desc: Bare MOTD token
    crit: component
    conf: 0.6
    if:
      type: text
      exact: MOTD

  - id: pe-irc-nick-collision
    desc: IRC nickname collision error string
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Nickname is already in use

composite_rules:
  - id: pe-irc-protocol
    desc: IRC protocol commands in PE binary
    crit: notable
    conf: 0.92
    all:
      - id: pe-irc-privmsg
    needs: 2
    any:
      - id: pe-irc-nick
      - id: pe-irc-join
      - id: micro-behaviors/communications/socket/tcp::pong-keepalive-token
      - id: pe-irc-quit
      - id: pe-irc-motd
      - id: pe-irc-nick-collision
