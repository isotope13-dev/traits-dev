defaults:
  platforms: [unix, windows]
  for: [text, mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-command-targets-nick
    desc: mIRC command targets nickname variable
    crit: notable
    if:
      type: text
      case_insensitive: true
      regex: '([/.](msg|notice|query|ignore|kick|ban|dcc)\s+\$nick\b|\.privmsg\s+\$nick\b)'
