defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
traits:
  - id: crypt-directional-channel-labels
    desc: IRC CRYPT token beside directional cipher labels
    conf: 0.98
    if:
      type: hex
      section: .rodata
      # Negotiation token followed by the send/receive derivation labels.
      # No server, pre-shared key or campaign identifier is pinned.
      pattern: '43 52 59 50 54 20 00 [0-16] 69 72 63 64 2D 74 78 00 69 72 63 64 2D 72 78 00'
