defaults:
  for:
    - c
    - cpp
  platforms:
    - windows

composite_rules:
  - id: irc-update-download-source-clues
    desc: IRC protocol and update/download source clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/irc/command::irc-protocol
    any:
      - id: metadata/lang/source/literal/string/label::update-token
      - id: metadata/lang/source/literal/string/label::download-token
      - id: micro-behaviors/communications/http/client/reference::wininet-read-process-xor-source-clues
    needs: 2
