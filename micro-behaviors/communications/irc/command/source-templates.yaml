# Command-shaped source literals identify IRC protocol operations. The
# argument and channel syntax keeps generic mentions of command names out.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, perl, c, cpp, go, java]
  crit: notable
  conf: 0.85

traits:
  - id: password-command-template
    desc: IRC PASS command template
    if:
      type: string_literal
      regex: '(?m)^PASS\s+\S'

  - id: notice-command-template
    desc: IRC NOTICE command template
    if:
      type: string_literal
      regex: '(?m)^NOTICE\s+\S'

  - id: mode-command-template
    desc: IRC MODE command template
    if:
      type: string_literal
      regex: '(?m)^MODE\s+\S'

  - id: part-command-template
    desc: IRC PART command template
    if:
      type: string_literal
      regex: '(?m)^PART\s+[#&+!]'

  - id: quit-command-template
    desc: IRC QUIT command template
    if:
      type: literal
      regex: ^QUIT([ \t]+:[^\r\n]*(\r?\n)?|\r?\n)$
  - id: topic-command-template
    desc: IRC TOPIC command template
    if:
      type: string_literal
      regex: '(?m)^TOPIC\s+[#&+!]'

  - id: kick-command-template
    desc: IRC KICK command template
    if:
      type: string_literal
      regex: '(?m)^KICK\s+[#&+!]\S*\s+\S'

  - id: names-command-template
    desc: IRC NAMES command template
    if:
      type: string_literal
      regex: '(?m)^NAMES\s+[#&+!]'

  - id: list-command-template
    desc: IRC LIST command template
    if:
      type: string_literal
      regex: '^LIST([ \t]+[#&+!]\S+|\r?\n$)'

  - id: ping-command-template
    desc: IRC PING command template
    if:
      type: string_literal
      regex: '(?m)^PING\s+\S'

  - id: capability-command-template
    desc: IRC CAP command template
    if:
      type: string_literal
      regex: '(?m)^CAP\s+\S'

  - id: authenticate-command-template
    desc: IRC AUTHENTICATE command template
    if:
      type: string_literal
      regex: '(?m)^AUTHENTICATE\s+\S'

  - id: whois-command-template
    desc: IRC WHOIS command template
    if:
      type: string_literal
      regex: '(?m)^WHOIS\s+\S'

  - id: who-command-template
    desc: IRC WHO command template
    if:
      type: string_literal
      regex: '(?m)^WHO\s+\S'

  - id: invite-command-template
    desc: IRC INVITE command template
    if:
      type: string_literal
      regex: '(?m)^INVITE\s+\S'

  - id: away-command-template
    desc: IRC AWAY command template
    if:
      type: string_literal
      regex: '(?m)^AWAY\s+\S'

  - id: ison-command-template
    desc: IRC ISON command template
    if:
      type: string_literal
      regex: '(?m)^ISON\s+\S'

  - id: userhost-command-template
    desc: IRC USERHOST command template
    if:
      type: string_literal
      regex: '(?m)^USERHOST\s+\S'

  - id: oper-command-template
    desc: IRC OPER command template
    if:
      type: string_literal
      regex: '(?m)^OPER\s+\S'

  - id: lusers-command-template
    desc: IRC LUSERS command template
    if:
      type: string_literal
      regex: '(?m)^LUSERS(\s|$)'
