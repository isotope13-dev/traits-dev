defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: privmsg-command-bytes
    desc: ELF contains an IRC PRIVMSG command
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "50 52 49 56 4D 53 47 20"
      offset_range: [4096, null]
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context


  - id: user-registration-template
    desc: IRC USER registration command template
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'USER %s 0 * :'
