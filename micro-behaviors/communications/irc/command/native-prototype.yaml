defaults:
  platforms: [windows, unix]
  for: [c, cpp]

# A native IRC client interface declares the channel, message, and registration
# operations as functions. Each prototype is one operation, so the composite
# needs two distinct operations rather than one shared name.
traits:
  - id: irc-join-prototype
    desc: IRC channel join function prototype
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: irc_join

  - id: irc-msg-prototype
    desc: IRC message send function prototype
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: irc_msg

  - id: irc-userinfo-prototype
    desc: IRC user info registration function prototype
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: irc_userinfo

composite_rules:
  - id: irc-native-client-api
    desc: C header declares IRC join, message, and registration prototypes
    crit: notable
    conf: 0.9
    any:
      - id: irc-join-prototype
      - id: irc-msg-prototype
      - id: irc-userinfo-prototype
    needs: 2
