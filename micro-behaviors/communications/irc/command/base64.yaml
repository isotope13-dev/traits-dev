defaults:
  for: [html, php]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: base64-privmsg-command
    desc: Base64-encoded IRC PRIVMSG token
    if:
      type: encoded
      encoding: base64
      exact: PRIVMSG
  - id: base64-join-command
    desc: Base64-encoded IRC JOIN token
    if:
      type: text
      regex: '["'']Sk9JTg==["'']'
      exclude_html_comments: true
  - id: base64-pong-command
    desc: Base64-encoded IRC PONG token
    if:
      type: text
      regex: '["'']UE9ORw==["'']'
      exclude_html_comments: true
