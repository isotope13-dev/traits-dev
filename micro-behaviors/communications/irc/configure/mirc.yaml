defaults:
  for: [text, mirc]
  platforms: [windows]
traits:
  - id: mirc-server-endpoint-declaration
    desc: mIRC INI declares server endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^host=.{1,100}SERVER:[^\s:]{1,100}:\d{1,5}(GROUP:.{1,100}|:.{1,100})?\r?$'
  - id: mirc-perform-autojoin-pwn-channel
    desc: mIRC Perform auto-joins a leetspeak pwn channel
    crit: notable
    conf: 0.9
    if:
      type: text
      # The Perform list runs at connect. A channel named for a takeover
      # ("0wn3d", "r00t3d") is a controller rendezvous, not a hangout. The
      # first Perform entry may contain "[", so the gap is bounded not walled.
      regex: '(?im)^\[perform\][^\[]{0,200}^n\d+=/join[ \t]+#\S{0,8}(0wn3d|pwn3d|r00t3d|h4ck3d)'
