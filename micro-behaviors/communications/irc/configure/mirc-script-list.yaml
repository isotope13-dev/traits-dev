defaults:
  platforms: [windows]
  for: [text, mirc]
traits:
  - id: mirc-remote-script-file-entry
    desc: mIRC config lists remote script files
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}^n[0-9]+=[^\r\n]{1,160}\.(mrc|ini)\r?$'
  - id: script-writes-mirc-script-line
    desc: Script writes mIRC script lines
    for: [html, javascript, vbs]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)writeline\s+"&\w+&"n\d+=(alias|on) '
  - id: script-writes-irc-sockwrite-bot
    desc: Script text carries mIRC bot socket writes
    for: [html, javascript, vbs]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.sockwrite\s+-nt?\s+\$sockname\s+(USER|NICK|privmsg)\b'
  - id: script-references-mirc-rfiles
    desc: Script references mIRC remote file list
    for: [html, javascript, vbs]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[rfiles\]'
