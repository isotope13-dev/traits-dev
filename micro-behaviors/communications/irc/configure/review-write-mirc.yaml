# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - mirc
  - ircii
  - scripts
  - binaries
  - objectivec
  - lua
  - data
  - dos_com
traits:
- id: mirc-enable-remote-scripts
  desc: mIRC command enables remote event scripts
  for:
  - text
  - mirc
  platforms:
  - windows
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^n\\d+=/\\.?remote[ \\t]+on[ \\t]*\\r?$"
- id: mirc-enable-flood-protection
  desc: mIRC enables message flood protection
  for:
  - text
  - mirc
  platforms:
  - windows
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^n\\d+=/flood[ \\t]+on[ \\t]*\\r?$"
