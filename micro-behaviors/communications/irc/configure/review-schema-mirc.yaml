# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  for:
  - text
  - mirc
  platforms:
  - windows
traits:
- id: mirc-dcc-warnings-disabled
  desc: mIRC config disables DCC warnings
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: "(?im)^\\[warn\\][^\\[]{0,160}^dcc=off\\r?$"
- id: mirc-scr-extension-script-entry
  desc: mIRC script list declares SCR-suffixed files
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[rfiles\\][^\\[]{0,900}\\bn[0-9]+=[^\\r\\n]{1,200}\\.scr\\r?$"
- id: mirc-dll-extension-script-entry
  desc: mIRC script list declares DLL-suffixed files
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[(rfiles|afiles)\\][^\\[]{0,900}\\bn[0-9]+=[^\\r\\n]{1,200}\\.dll\\r?$"
- id: mirc-bot-server-variable
  desc: Saved mIRC bot server and port
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%(bot[.]server|server_port[.]bot) [^\\s]{1,120} [0-9]{1,5}\\r?$"
- id: mirc-bot-channel-variable
  desc: Saved mIRC variable declares a bot channel
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%botchan #[^\\s]{1,80}\\r?$"
- id: mirc-image-extension-script-entry
  desc: mIRC script list declares image-suffixed files
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[rfiles\\][^\\[]{0,900}\\bn[0-9]+=[^\\r\\n]{1,200}\\.(jpe?g|png|gif)\\r?$"
- id: mirc-random-identity-expression
  desc: IRC identity declares random expression
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: "(?im)^\\[mirc\\][^\\[]{0,800}\\n(user|email|nick|anick)=\\$rand\\(a,z\\)"
- id: mirc-alphanumeric-nick-field
  desc: IRC nick field contains letter-digit token
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?ims)^\\[mirc\\].{0,800}\\nnick=([a-z][a-z\\d]{6,40}\\d|[a-z]{2,20}\\[[0-9]{4,20}\\])\\r?$"
- id: mirc-alphanumeric-anick-field
  desc: IRC anick field contains letter-digit token
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?ims)^\\[mirc\\].{0,800}\\nanick=([a-z][a-z\\d]{6,40}\\d|[a-z]{2,20}\\[[0-9]{4,20}\\])\\r?$"
- id: mirc-alphanumeric-user-field
  desc: IRC user field contains letter-digit token
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?ims)^\\[mirc\\].{0,800}\\nuser=[a-z][a-z\\d]{6,40}\\d\\r?$"
- id: mirc-alphanumeric-email-field
  desc: IRC email field contains letter-digit token
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?ims)^\\[mirc\\].{0,800}\\nemail=[a-z][a-z\\d]{6,40}\\d(@[a-z\\d.]{5,60})?\\r?$"
- id: mirc-sys-extension-script-entry
  desc: mIRC script list declares SYS-suffixed files
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[rfiles\\][^\\[]{0,900}\\bn[0-9]+=[^\\r\\n]{1,200}\\.sys\\r?$"
- id: mirc-ocx-extension-script-entry
  desc: mIRC script list declares OCX-suffixed files
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[rfiles\\][^\\[]{0,900}\\bn[0-9]+=[^\\r\\n]{1,200}\\.ocx\\r?$"
- id: mirc-exe-extension-script-entry
  desc: mIRC script list declares EXE-suffixed files
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[rfiles\\][^\\[]{0,900}\\bn[0-9]+=[^\\r\\n]{1,200}\\.exe\\r?$"
- id: mirc-channel-takeover-count-variable
  desc: Saved mIRC channel takeover counter
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%count[.]takeover [1-9][0-9]{0,5}\\r?$"
- id: mirc-clone-channel-variable
  desc: Saved mIRC clone target channel
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%clone[.]chan(el)? #[^\\s]{1,80}\\r?$"
- id: mirc-drv-extension-script-entry
  desc: mIRC script list declares DRV-suffixed files
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[rfiles\\][^\\[]{0,900}\\bn[0-9]+=[^\\r\\n]{1,200}\\.drv\\r?$"
- id: mirc-rfiles-flood-ini-entry
  desc: mIRC remote-script list names flood.ini
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[rfiles\\][^\\[]{0,900}\\bn[0-9]+=flood\\.ini\\r?$"
- id: mirc-findtext-bot-operator-marker
  desc: mIRC findtext lists bot-operator strings
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?im)^\[findtext\][^\[]{0,800}\bn[0-9]+="(addadmin|dialog newuser)"
- id: mirc-saved-server-variable
  desc: Saved mIRC variable declares IRC server
  for:
  - text
  - mirc
  - data
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^%server[0-9]{0,3} irc\\.[a-z0-9.-]{1,100}(:[0-9]{1,5})?\\r?$"
- id: mirc-configured-server-endpoint
  desc: mIRC config declares IRC server endpoint
  for:
  - text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?ims)^\\[mirc\\].{0,800}\\nhost=[^\\r\\n]{1,120}SERVER:[^\\s:]{1,120}:[0-9]{1,5}\\r?$"
composite_rules:
- id: mirc-dcc-executables-without-warning
  for:
  - text
  desc: mIRC permits executable DCC files without warnings
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/format/structured::mirc-client-config-section
  - id: micro-behaviors/communications/irc/configure::mirc-dcc-warnings-disabled
  - id: micro-behaviors/data/config/schema::ini-accept-executable-glob
- id: mirc-alphanumeric-identity-fields
  desc: Four IRC fields declare letter-digit identities
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/irc/configure::mirc-alphanumeric-nick-field
  - id: micro-behaviors/communications/irc/configure::mirc-alphanumeric-anick-field
  - id: micro-behaviors/communications/irc/configure::mirc-alphanumeric-user-field
  - id: micro-behaviors/communications/irc/configure::mirc-alphanumeric-email-field
