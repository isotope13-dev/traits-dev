# Saved mIRC variables (vars.ini, `nN=%name value`) of an IRC bot: flood
# tuning, clone counts and address ranges handed to its scanners.
defaults:
  platforms: [windows]
  for: [mirc, text]
traits:
  - id: mirc-saved-flood-tuning-variables
    desc: Saved variables tune channel flooding
    crit: notable
    conf: 0.85
    count_min: 6
    if:
      type: text
      regex: '(?m)^(n\d+=)?%fl\w* \S'
  - id: mirc-saved-clone-count
    desc: Saved variable sets a clone count
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^(n\d+=)?%clones \d+'
  - id: mirc-saved-scan-address-range
    desc: Saved variable holds a scan address range
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^(n\d+=)?%[\w.]*scan[\w.]* \d{1,3}(\.\d{1,3}){3}( -)? \d{1,3}(\.\d{1,3}){3}'
