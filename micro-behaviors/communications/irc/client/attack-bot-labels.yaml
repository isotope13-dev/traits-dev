# Windows UI labels that name IRC attack bots (nick-collide, flood, takeover).
# One label is weak -- "Flood Bot" can be a protection tool's heading -- so
# callers require several distinct bot roles together.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: irc-collide-bot-label
    desc: UI names an IRC nick-collide bot
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)multi.?collide.?bot|nick collide'
  - id: irc-sumo-bot-label
    desc: UI names an IRC SuMO takeover bot
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsumo b[o0]t\b'
  - id: irc-flood-bot-label
    desc: UI names an IRC flood bot
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bfl[o0]{2}d ?b[o0]t\b'
  - id: irc-takeover-guide-text
    desc: Embedded IRC channel takeover guide text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)hacking irc.{0,6}the definitive guide'
