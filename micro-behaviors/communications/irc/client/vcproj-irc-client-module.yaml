# Build manifest lists an IRC client source module. The XML project file is
# the only evidence, so the trait names what the project compiles.
defaults:
  for: [xml]
  platforms: [windows]
  crit: notable

traits:
  - id: vcproj-irc-client-module
    desc: Project builds an IRC client source module
    conf: 0.9
    if:
      type: text
      substr: 'irc\irc.cpp'
