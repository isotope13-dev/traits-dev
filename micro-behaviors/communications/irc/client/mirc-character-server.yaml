defaults:
  platforms: [windows, unix]
  for: [mirc]
traits:
  - id: mirc-character-built-server-command
    desc: mIRC constructs server command from characters
    crit: notable
    conf: 0.98
    if:
      type: text
      case_insensitive: true
      regex: '\$chr\(115\)\s*\$\+\s*\$chr\(101\)\s*\$\+\s*\$chr\(114\)'
