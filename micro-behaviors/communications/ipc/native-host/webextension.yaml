# Native messaging: a browser extension bridges to a native host process on
# the machine (stdio JSON protocol). This is IPC that crosses the browser
# sandbox into a local executable, so presence is notable.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
traits:
  - id: native-messaging-host-path
    desc: Browser native messaging host path
    for: [scripts, json]
    conf: 0.88
    if:
      type: text
      regex: 'NativeMessagingHosts|native-messaging-hosts'
    unless:
      - id: well-known/app/security/bitwarden::bitwarden-app
      - id: well-known/app/security/bitwarden::bitwarden-text-marker
  # The host manifest is the registration file the browser reads to learn which
  # local executable an extension may launch.  It is the same JSON on every
  # platform (Windows names it from a registry value, macOS/Linux from a
  # NativeMessagingHosts directory), so these fields survive a port of the
  # technique that a registry-only matcher would miss.
  - id: native-messaging-host-stdio-type
    desc: Native host manifest stdio type
    crit: component
    conf: 0.9
    for: [json, scripts, source, data]
    if:
      type: text
      regex: '"type"\s*:\s*"stdio"'
  - id: native-messaging-host-allowed-origins
    desc: Native host manifest allowed_origins
    crit: component
    conf: 0.9
    for: [json, scripts, source, data]
    if:
      type: text
      regex: '"allowed_origins"\s*:'
  - id: native-messaging-host-extension-origin
    desc: Native host grants an extension origin
    crit: notable
    conf: 0.92
    for: [json, scripts, source, data]
    if:
      # 32 characters over the a-p alphabet is the Chromium extension-id
      # encoding, so this is an actual extension origin rather than a mention
      # of the scheme.
      type: text
      regex: 'chrome-extension://[a-p]{32}'

  - id: browser-extension-native-connect
    desc: Browser extension native host connection
    if:
      type: symbol
      regex: '(^|\.)(connectNative)$'
    unless:
      - id: metadata/library/structure::js-webextension-polyfill-runtime-marker
  - id: browser-extension-native-message
    desc: Browser extension native host message
    if:
      type: symbol
      regex: '(^|\.)(sendNativeMessage)$'
    unless:
      - id: metadata/library/structure::js-webextension-polyfill-runtime-marker
  # Native-messaging RATs task the host with a JSON envelope whose action
  # field names command execution. The verb is structural (protocol field),
  # not English prose in a comment.
  - id: native-host-execute-action
    desc: Native host message requests command execution
    crit: notable
    conf: 0.94
    for: [javascript, typescript, json, scripts, source, data]
    if:
      type: text
      # Object-literal envelopes (`action: "execute"` / `"action":"execute"`)
      # and property checks (`msg.action === "execute"`) used by native-
      # messaging shells that run operator commands.
      regex: '(?i)(["'']action["'']|\baction)\s*:\s*["'']execute["'']|\.action\s*===\s*["'']execute["'']'

composite_rules:
  # Chromium's native-messaging wire format is a 32-bit length prefix followed
  # by that many bytes of JSON, exchanged over the host process's own
  # stdin/stdout. Code that frames messages that way on process stdio *is* a
  # native-messaging host regardless of what it is named and whether a host
  # manifest ships beside it. Text protocols that frame with a
  # `Content-Length:` header (LSP, DAP) do not match.
  - id: native-messaging-stdio-framing
    desc: Length-prefixed framing on process stdio
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/data/buffer::buffer-uint32-length-read
      - id: micro-behaviors/process/fd/stdio::js-stdin-read
      - id: micro-behaviors/process/io/stream::node-stdout-reference

  - id: native-messaging-host-manifest
    desc: Native host manifest grants extension IPC
    crit: notable
    conf: 0.95
    for: [json, scripts, source, data]
    all:
      - id: native-messaging-host-stdio-type
      - id: native-messaging-host-allowed-origins
    near_bytes: 512

  # Download managers may legitimately bridge browser requests to a local
  # helper, but forwarding cookies and captured headers crosses both the
  # browser and native-process trust boundaries and deserves one high-risk
  # finding for triage.  This is not evidence of remote exfiltration.
  - id: native-download-request-forwarding
    desc: Extension forwards cookie-backed downloads to native host
    crit: suspicious
    conf: 0.96
    for: [xpi, crx, zip, archives]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/process/hook/webextension::webrequest-request-header-capture
      - id: browser-extension-native-message
      - id: micro-behaviors/communications/http/download/webextension::chrome-downloads-cancel
    unless:
      - id: well-known/app/browser-extension/mini-downloader::extension-add-on-id
      - id: well-known/app/browser-extension/mini-downloader::mini-downloader-archive-context
      - id: well-known/app/browser-extension/mini-downloader::mini-downloader-outer-context
