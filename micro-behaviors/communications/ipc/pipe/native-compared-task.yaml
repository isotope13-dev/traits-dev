# The command prefix is unconstrained. The handler calls CreatePipe, launches
# a child with inheritance enabled, and reads the pipe's same output handle.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-compared-command-process-pipe-readback
    desc: Command handler creates process pipe and reads
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule x64_compared_command_piped_process_handler {
          strings:
            $dispatch = { 48 83 FB ?? 0F 85 ?? ?? ?? ?? 4C 8B C3 48 8D 15 ?? ?? ?? ?? E8 ?? ?? ?? ?? 85 C0 0F 85 ?? ?? ?? ?? 48 8D 55 ?? 48 8D 4D ?? E8 ?? ?? ?? ?? 90 4C 8B C0 48 8D 15 ?? ?? ?? ?? 48 8D 4D ?? E8 ?? ?? ?? ?? 90 48 8B D0 48 8D 4D ?? E8 ?? ?? ?? ?? }
            $pipe = { 45 33 C9 4C 8D 45 ?? 48 8D 54 24 ?? 48 8D 8D ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 85 C0 }
            $launch = { C7 44 24 20 01 00 00 00 45 33 C9 45 33 C0 33 C9 FF 15 ?? ?? ?? ?? }
            $read = { 41 B8 00 10 00 00 48 8D 55 ?? 48 8B 8D ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 85 C0 }
            $entry = { 48 89 5C 24 ?? 44 89 44 24 ?? 55 56 57 41 56 41 57 48 8D AC 24 ?? ?? ?? ?? B8 ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 2B E0 48 8B DA 48 8B F1 45 33 FF }
          condition:
            pe.is_pe and all of them and
            for any s in pe.sections : (
              s.name == ".text" and
              for any d in (1..#dispatch) : (
                @dispatch[d] >= s.raw_data_offset and
                @dispatch[d]+!dispatch[d] <= s.raw_data_offset+s.raw_data_size and
                @dispatch[d]+10+int32(@dispatch[d]+6) == @dispatch[d]+33+int32(@dispatch[d]+29) and
                @dispatch[d]+33+int32(@dispatch[d]+29) > @dispatch[d]+!dispatch[d] and
                for any e in (1..#entry) : (
                  @entry[e] == @dispatch[d]+79+int32(@dispatch[d]+75)
                ) and
                for any p in (1..#pipe) : (
                  @pipe[p] > @dispatch[d]+79+int32(@dispatch[d]+75) and
                  @pipe[p] < @dispatch[d]+79+int32(@dispatch[d]+75)+256 and
                  @pipe[p] >= s.raw_data_offset and
                  s.virtual_address+@pipe[p]-s.raw_data_offset+25+int32(@pipe[p]+21) == pe.import_rva("KERNEL32.dll", "CreatePipe") and
                  for any l in (1..#launch) : (
                    @launch[l] > @pipe[p] and @launch[l] < @pipe[p]+384 and
                    s.virtual_address+@launch[l]-s.raw_data_offset+22+int32(@launch[l]+18) == pe.import_rva("KERNEL32.dll", "CreateProcessW") and
                    for any r in (1..#read) : (
                      @read[r] > @launch[l] and @read[r]+!read[r] < @pipe[p]+640 and
                      @read[r]+!read[r] <= s.raw_data_offset+s.raw_data_size and
                      uint32(@pipe[p]+15) == uint32(@read[r]+13) and
                      s.virtual_address+@read[r]-s.raw_data_offset+23+int32(@read[r]+19) == pe.import_rva("KERNEL32.dll", "ReadFile")
                    )
                  )
                )
              )
            )
        }
