# Imports and a cipher constant can be unrelated and do not prove a relay.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
composite_rules:
  - id: pipe-process-network-chacha-api-clues
    desc: Pipe, process, network and ChaCha/Salsa references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
      - id: metadata/binary/symbols/name/process::create-process-a
