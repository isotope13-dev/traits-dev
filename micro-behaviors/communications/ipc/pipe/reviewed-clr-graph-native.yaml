# Evidence-only observations; family and intent require independent context.
composite_rules:
- for:
  - pe
  - dll
  platforms:
  - windows
  id: pipe-wininet-api-references
  desc: Pipe redirection and WinInet API references co-occur
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: well-known/tool/reverse-engineering/windows-debugger/
    - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
