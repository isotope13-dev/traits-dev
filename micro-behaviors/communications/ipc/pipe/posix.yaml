defaults:
  platforms: [unix, android, ios]
  for: [elf, macho, c]
traits:
- id: pipe-import
  desc: References POSIX pipe API
  crit: notable
  conf: 0.72
  if:
    type: symbol
    regex: '^_?pipe$'
- id: pipe2-import
  desc: References Linux pipe2 API
  crit: notable
  conf: 0.72
  if:
    type: symbol
    regex: '^_?pipe2$'
composite_rules:
- id: pipe-api-import
  desc: References a POSIX pipe API
  crit: notable
  conf: 0.72
  any:
  - id: pipe-import
  - id: pipe2-import
