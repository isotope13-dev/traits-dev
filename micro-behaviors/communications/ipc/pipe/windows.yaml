defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: create-pipe
    desc: Imports the anonymous-pipe creation API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: CreatePipe
  - id: peek-named-pipe
    desc: Peek at pipe data without reading
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: PeekNamedPipe
composite_rules:
  - id: pipe-io-redirect
    desc: Pipe creation with handle or pipe inspection APIs
    crit: notable
    conf: 0.9
    all:
      - id: create-pipe
    any:
      - id: micro-behaviors/fs/file/handle::set-std-handle
      - id: micro-behaviors/process/fd/dup::duplicate-handle-api
      - id: peek-named-pipe
