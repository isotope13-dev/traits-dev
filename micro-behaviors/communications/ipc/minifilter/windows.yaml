# User-mode Filter Manager requests, verified against the linked NeacController PoC.
defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: notable
traits:
  - id: connect-port
    desc: Connects to a minifilter communication port
    if:
      type: symbol
      kind: call
      exact: FilterConnectCommunicationPort
  - id: send-message
    desc: Sends a message to a minifilter
    if:
      type: symbol
      kind: call
      exact: FilterSendMessage
  - id: neac-client
    desc: Connects to the NeacSafe minifilter port
    ref: https://github.com/za233/NeacController
    if:
      type: symbol
      kind: call
      exact: FilterConnectCommunicationPort
      arg: {index: 0, kind: string, regex: '^\\{1,2}OWNeacSafePort$'}
  - id: neac-kernel-read-opcode
    desc: Assigns Neac kernel read opcode
    crit: component
    if:
      type: text
      regex: '(->|\.)\s*Opcode\s*=\s*(14|0x0*e)\s*;'
      case_insensitive: true
      exclude_comments: true
  - id: neac-kernel-write-opcode
    desc: Assigns Neac kernel write opcode
    crit: component
    if:
      type: text
      regex: '(->|\.)\s*Opcode\s*=\s*(70|0x0*46)\s*;'
      case_insensitive: true
      exclude_comments: true
  - id: neac-process-read-opcode
    desc: Assigns Neac process read opcode
    crit: component
    if:
      type: text
      regex: '(->|\.)\s*Opcode\s*=\s*(9|0x0*9)\s*;'
      case_insensitive: true
      exclude_comments: true
  - id: neac-process-write-opcode
    desc: Assigns Neac process write opcode
    crit: component
    if:
      type: text
      regex: '(->|\.)\s*Opcode\s*=\s*(61|0x0*3d)\s*;'
      case_insensitive: true
      exclude_comments: true
  - id: neac-process-protect-opcode
    desc: Assigns Neac process protect opcode
    crit: component
    if:
      type: text
      regex: '(->|\.)\s*Opcode\s*=\s*(60|0x0*3c)\s*;'
      case_insensitive: true
      exclude_comments: true
  - id: neac-process-kill-opcode
    desc: Assigns Neac process kill opcode
    crit: component
    if:
      type: text
      regex: '(->|\.)\s*Opcode\s*=\s*(20|0x0*14)\s*;'
      case_insensitive: true
      exclude_comments: true
  - id: neac-ssdt-query-opcode
    desc: Assigns Neac ssdt query opcode
    crit: component
    if:
      type: text
      regex: '(->|\.)\s*Opcode\s*=\s*(12|0x0*c)\s*;'
      case_insensitive: true
      exclude_comments: true
composite_rules:
  - id: neac-kernel-read-request
    desc: Opcode 14 assignment near minifilter send
    crit: component
    near_lines: 12
    all:
      - id: neac-kernel-read-opcode
      - id: send-message
  - id: neac-kernel-read
    crit: suspicious
    desc: Neac client requests kernel memory read
    all:
      - id: neac-client
      - id: neac-kernel-read-request
  - id: neac-kernel-write-request
    desc: Opcode 70 assignment near minifilter send
    crit: component
    near_lines: 12
    all:
      - id: neac-kernel-write-opcode
      - id: send-message
  - id: neac-kernel-write
    crit: suspicious
    desc: Neac client requests kernel memory write
    all:
      - id: neac-client
      - id: neac-kernel-write-request
  - id: neac-process-read-request
    desc: Opcode 9 assignment near minifilter send
    crit: component
    near_lines: 12
    all:
      - id: neac-process-read-opcode
      - id: send-message
  - id: neac-process-read
    desc: Neac client requests process memory read
    all:
      - id: neac-client
      - id: neac-process-read-request
  - id: neac-process-write-request
    desc: Opcode 61 assignment near minifilter send
    crit: component
    near_lines: 12
    all:
      - id: neac-process-write-opcode
      - id: send-message
  - id: neac-process-write
    desc: Neac client requests process memory write
    all:
      - id: neac-client
      - id: neac-process-write-request
  - id: neac-process-protect-request
    desc: Opcode 60 assignment near minifilter send
    crit: component
    near_lines: 12
    all:
      - id: neac-process-protect-opcode
      - id: send-message
  - id: neac-process-protect
    desc: Neac client requests process memory protection
    all:
      - id: neac-client
      - id: neac-process-protect-request
  - id: neac-process-kill-request
    desc: Opcode 20 assignment near minifilter send
    crit: component
    near_lines: 12
    all:
      - id: neac-process-kill-opcode
      - id: send-message
  - id: neac-process-kill
    desc: Neac client requests process termination
    all:
      - id: neac-client
      - id: neac-process-kill-request
  - id: neac-ssdt-query-request
    desc: Opcode 12 assignment near minifilter send
    crit: component
    near_lines: 12
    all:
      - id: neac-ssdt-query-opcode
      - id: send-message
  - id: neac-ssdt-query
    desc: Neac client requests SSDT address query
    all:
      - id: neac-client
      - id: neac-ssdt-query-request
