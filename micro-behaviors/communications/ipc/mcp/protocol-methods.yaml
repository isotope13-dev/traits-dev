defaults:
  for: [javascript, typescript, python, lua, markdown, swift]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: mcp-initialize-result
    desc: MCP initialization result fields
    crit: notable
    conf: 0.85
    # Other RPC systems use these field names. Require MCP's date-shaped
    # version value rather than a semver schema or arbitrary descriptor.
    if:
      type: text
      regex: 'protocolVersion["'']?\s*:\s*["'']20\d\d-\d\d-\d\d["''][\s\S]{0,300}?serverInfo'

  - id: mcp-tools-call-method
    desc: MCP tools/call method name
    conf: 0.85
    if:
      type: literal
      exact: tools/call

  - id: mcp-tools-list-method
    desc: MCP tools/list method name
    conf: 0.8
    if:
      type: literal
      exact: tools/list

  - id: mcp-resources-list-method
    desc: MCP resources/list method name
    conf: 0.86
    if:
      type: literal
      exact: resources/list

  - id: mcp-resources-read-method
    desc: MCP resources/read method name
    conf: 0.86
    if:
      type: literal
      exact: resources/read
