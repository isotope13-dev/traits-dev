# HTTP transport facts for MCP-style tool dispatch. Each atom is neutral on
# its own: local MCP bridges commonly use HTTP, may identify clients only for
# lifecycle tracking, and legitimately publish destructive tools. Objective
# rules add the exposure context before raising severity.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: mcp-http-rpc-route-path
    desc: MCP HTTP RPC route path
    crit: component
    conf: 0.97
    if:
      type: string_literal
      regex: '^/mcp/(rpc|call)$'

  - id: http-post-method-condition
    desc: Checks for an HTTP POST method
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\bmethod\s*===\s*["'']POST["'']'

  - id: mcp-caller-selected-tool-lookup
    desc: Looks up caller-selected MCP tool
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\bmcpTools\.find\s*\(.{0,360}\.spec\.name\s*===\s*method'

  - id: mcp-tool-handler-params-call
    desc: Calls MCP tool handler with parameters
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\btool\.handler\s*\(\s*params\s*\)'

  - id: mcp-anonymous-client-fallback
    desc: MCP client ID defaults to anonymous
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?is)function\s+getClientId\s*\(.{0,120}\)\s*\{[\s\S]{0,700}\breturn\s+["'']anon["'']'

  - id: mcp-destructive-tool-annotation
    desc: Declares a destructive MCP tool
    conf: 0.99
    if:
      type: text
      regex: '\bannotations\s*:\s*\{[^}\r\n]{0,180}\bdestructiveHint\s*:\s*true\b'

composite_rules:
  - id: mcp-http-rpc-post-route
    desc: Exposes MCP RPC over HTTP POST
    crit: component
    conf: 0.97
    near_bytes: 256
    all:
      - id: mcp-http-rpc-route-path
      - id: http-post-method-condition

  - id: mcp-caller-selected-tool-dispatch
    desc: Dispatches caller-selected MCP tool
    crit: notable
    conf: 0.98
    near_bytes: 2048
    all:
      - id: mcp-caller-selected-tool-lookup
      - id: mcp-tool-handler-params-call

  - id: anonymous-mcp-http-tool-rpc
    desc: HTTP MCP RPC accepts anonymous tool calls
    crit: notable
    conf: 0.99
    all:
      - id: mcp-http-rpc-post-route
      - id: mcp-caller-selected-tool-dispatch
      - id: mcp-anonymous-client-fallback
