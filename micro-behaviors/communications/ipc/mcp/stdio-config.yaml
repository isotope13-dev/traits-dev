defaults:
  for: [scripts, source]
  platforms: [unix, windows]
traits:
  - id: stdio-interpreter-command-field
    desc: Command field selects a script interpreter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']command["'']\s*:\s*["''](python[23]?|bash|sh|pwsh|powershell|node)["'']'
  - id: stdio-transport-field
    desc: Transport field selects stdio execution
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '["'']transport["'']\s*:\s*["'']stdio["'']'
  - id: inline-interpreter-args-field
    desc: Args field supplies inline interpreter code
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']args["'']\s*:\s*\[\s*["''](-c|-e|-Command)["'']'
