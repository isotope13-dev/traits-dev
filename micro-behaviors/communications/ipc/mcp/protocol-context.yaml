defaults:
  for: [javascript, typescript, python, lua, markdown, swift]
  platforms: [unix, windows]
  crit: notable
composite_rules:
  - id: mcp-resource-method-references
    desc: MCP resource list/read method references
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/ipc/mcp::mcp-resources-list-method
      - id: micro-behaviors/communications/ipc/mcp::mcp-resources-read-method

  - id: mcp-resource-authentication-references
    desc: MCP resource methods and bearer-header references
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ipc/mcp::mcp-resource-method-references
      - id: micro-behaviors/communications/http/authorization-header::js-bearer-header-from-auth-token

  - id: mcp-tool-method-version-references
    desc: MCP tool methods and protocol-version fields
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/ipc/mcp::mcp-tools-call-method
      - id: micro-behaviors/communications/ipc/mcp::mcp-tools-list-method
      - id: metadata/lang/source/literal/string/property::protocol-version-string-literal
