defaults:
  platforms: [android]
  for: [android_apk, binaries]
  crit: notable
  conf: 0.85
  attack: "T1411"

traits:
  - id: source-add-javascript-interface-call
    desc: Android source registers JavaScript bridge
    for: [kotlin, java]
    if:
      type: text
      word: addJavascriptInterface

  - id: add-javascript-interface
    desc: WebView addJavascriptInterface Java-JS bridge
    conf: 0.9
    mbc: "C0048"
    if:
      type: text
      exact: "addJavascriptInterface"

composite_rules:
  - id: source-webview-js-bridge
    desc: Android source registers WebView JavaScript bridge
    crit: notable
    conf: 0.96
    for: [java, kotlin]
    all:
      - id: metadata/import/library::source-webview-import
      - id: micro-behaviors/communications/ipc/bridge::source-add-javascript-interface-call

  - id: webview-js-bridge
    desc: Android WebView JavaScript-to-native bridge
    # This is a security-sensitive capability, but is also standard in ad
    # SDKs and hybrid UI. Keep it notable unless a higher-level objective
    # combines it with payload delivery or code execution.
    crit: notable
    conf: 0.88
    mbc: "C0048"
    all:
      - id: micro-behaviors/ui/window/webview::webview-class-reference
      - id: micro-behaviors/communications/ipc/bridge::add-javascript-interface
    unless:
      - id: well-known/app/system/ankidroid::package-member

