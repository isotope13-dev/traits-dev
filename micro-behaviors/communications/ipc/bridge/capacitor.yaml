# Capacitor JS-to-native WebView bridge observations across parsed JS/TS and inline HTML scripts.
defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: capacitor-plugin-registry-access
    desc: Accesses Capacitor's native plugin registry
    conf: 0.98
    if:
      type: symbol
      kind: member
      regex: '^(window\.|globalThis\.)?Capacitor\.Plugins(\.|$)'

  - id: capacitor-html-plugin-registry-access
    for: [html]
    desc: HTML script accesses Capacitor plugin registry
    if:
      type: text
      exclude_html_comments: true
      regex: '\bCapacitor\s*\.\s*Plugins\b'

  - id: capacitor-native-bridge-call
    desc: Invokes Capacitor native bridge method
    if:
      type: symbol
      kind: call
      regex: '^(window\.)?Capacitor\.(toNative|nativePromise|registerPlugin)$'

composite_rules:
  - id: capacitor-js-bridge-access
    for: [javascript, typescript, html]
    desc: Accesses Capacitor JavaScript-to-native bridge
    any:
      - id: capacitor-plugin-registry-access
      - id: capacitor-html-plugin-registry-access
      - id: capacitor-native-bridge-call

  # A page invokes one of Capacitor's standard data plugins, so host-native
  # location, device or app-file data is returned to the WebView. Union of the
  # subject-specific capabilities; intent is supplied by objective composites.
  - id: capacitor-native-data-plugin-call
    for: [javascript, typescript, html]
    desc: Calls Capacitor native data plugin
    any:
      - id: micro-behaviors/os/sysinfo/platform/mobile::capacitor-geolocation-plugin-call
      - id: micro-behaviors/os/sysinfo/platform/mobile::capacitor-device-plugin-query
      - id: micro-behaviors/os/sysinfo/platform/mobile::capacitor-html-geolocation-plugin-call
      - id: micro-behaviors/os/sysinfo/platform/mobile::capacitor-html-device-plugin-query
      - id: micro-behaviors/fs/read/file/full::capacitor-filesystem-read
      - id: micro-behaviors/fs/read/file/full::capacitor-html-filesystem-read
