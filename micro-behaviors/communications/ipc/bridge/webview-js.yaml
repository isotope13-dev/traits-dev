# JavaScript-side native host bridges exposed inside hybrid mobile/desktop WebViews.
defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: wkwebview-message-handlers-member
    desc: Accesses WKWebView messageHandlers bridge
    if:
      type: symbol
      kind: member
      regex: '^(window\.)?webkit\.messageHandlers(\.|$)'

  - id: wkwebview-html-message-handlers
    for: [html]
    desc: Inline script accesses webkit.messageHandlers
    if:
      type: text
      exclude_html_comments: true
      regex: '\bwebkit\s*\.\s*messageHandlers\b'

  - id: react-native-webview-bridge-member
    desc: Accesses ReactNativeWebView bridge object
    if:
      type: symbol
      kind: member
      regex: '^(window\.)?ReactNativeWebView\.postMessage$'

  - id: react-native-html-webview-bridge
    for: [html]
    desc: HTML script uses ReactNativeWebView bridge
    if:
      type: text
      exclude_html_comments: true
      regex: '\bReactNativeWebView\s*\.\s*postMessage\b'

  - id: cordova-exec-bridge-call
    desc: Calls Cordova native plugin exec bridge
    if:
      type: symbol
      kind: call
      regex: '^(window\.)?cordova\.exec$'

  - id: cordova-html-exec-bridge
    for: [html]
    desc: Inline script calls Cordova exec bridge
    if:
      type: text
      exclude_html_comments: true
      regex: '\bcordova\s*\.\s*exec\s*\('

  - id: webview2-host-bridge-member
    desc: Accesses WebView2 chrome.webview host bridge
    if:
      type: symbol
      kind: member
      regex: '^(window\.)?chrome\.webview\.(postMessage|hostObjects)(\.|$)'

  - id: webview2-html-host-bridge
    for: [html]
    desc: Inline script accesses WebView2 host bridge
    if:
      type: text
      exclude_html_comments: true
      regex: '\bchrome\s*\.\s*webview\s*\.\s*(postMessage|hostObjects)\b'

composite_rules:
  - id: hybrid-webview-js-bridge
    for: [javascript, typescript, html]
    desc: Accesses hybrid WebView native host bridge
    any:
      - id: micro-behaviors/communications/ipc/bridge::capacitor-js-bridge-access
      - id: wkwebview-message-handlers-member
      - id: wkwebview-html-message-handlers
      - id: react-native-webview-bridge-member
      - id: react-native-html-webview-bridge
      - id: cordova-exec-bridge-call
      - id: cordova-html-exec-bridge
      - id: webview2-host-bridge-member
      - id: webview2-html-host-bridge
      - id: metadata/lang/source/syntax/call/invocation::javascript-android-object-call
