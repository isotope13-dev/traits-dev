defaults:
  for: [lua]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95

traits:
  - id: lua-comm-center-lookup
    desc: Looks up launcher comm_center bridge
    if:
      type: symbol
      kind: call
      exact: rawget
      args:
        - {index: 0, kind: identifier, name: _G}
        - {index: 1, kind: string, exact: comm_center}

  # Lua's facts retain the call arguments but do not resolve a bracketed
  # string member as the call target. Text covers both member spellings.
  - id: lua-reg-service-call
    desc: Calls Lua service registration method
    if:
      type: text
      exclude_comments: true
      regex: '\b\w+(\.reg_service|\[\s*["'']reg_service["'']\s*\])\s*\('

composite_rules:
  - id: lua-launcher-service-registration
    desc: Launcher bridge lookup near Lua service registration
    near_bytes: 512
    all:
      - id: lua-comm-center-lookup
      - id: lua-reg-service-call
