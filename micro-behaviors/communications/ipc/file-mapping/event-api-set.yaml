defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: mapping-event-api-set
    desc: File mapping and named-event API references
    crit: notable
    conf: 0.9
    unless:
      # KernelBase legitimately exports the API surface represented by this
      # composite; it is an implementation DLL, not an injector.
      - id: metadata/lang/upstream::windows-system-implementer-dll
      # Adobe MediaCore uses the same event/file-mapping IPC primitives for
      # legitimate component coordination.  Its signed binaries should not
      # inherit this loader-fragment context.
      - id: metadata/signed/leaf::adobe-systems-incorporated
      - id: metadata/file/string/application-name::pe-product-name-7zip
      - id: well-known/lib/platform/microsoft-catsrv::microsoft-catsrvut-library-context
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
      # Catalogued apps (e.g. SDIO) use the same IPC for worker coordination.
      - id: well-known/app/
    all:
      - id: micro-behaviors/process/sync/event::open-event
      - id: micro-behaviors/communications/ipc/file-mapping::open-file-mapping-w
      - id: micro-behaviors/process/sync/event::set-event
