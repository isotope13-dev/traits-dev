# Android ContentProvider clients address another app through a content:// URI
# and invoke its call() RPC surface through ContentResolver. Keep the mechanics
# neutral here; credential-access intent is assembled from the returned fields
# under objectives/credential-access/memory/interprocess/.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.94
  mbc: C0003

traits:
  - id: android-content-provider-uri-source
    desc: Android source constructs a ContentProvider URI
    if:
      type: text
      regex: 'Uri\s*\.\s*parse\s*\(\s*["'']content://[A-Za-z0-9_.-]{3,200}'

  - id: android-content-resolver-reference-source
    desc: References Android ContentResolver
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: import
      exact: android.content.ContentResolver

  - id: android-content-provider-call-source
    desc: ContentProvider call method invocation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.\s*call\s*\('

  - id: android-content-query-sms-inbox
    desc: Android content query reads SMS inbox
    crit: notable
    conf: 0.96
    platforms: [android, unix]
    for: [shell, elf, dex]
    if:
      type: text
      regex: '(?i)\bcontent\s+query\s+--uri\s+content://sms/inbox\b'

  - id: android-sms-provider-uri
    desc: Android code references content://sms URI
    crit: notable
    conf: 0.94
    for: [java, kotlin, dex]
    if:
      type: text
      regex: 'content://sms(/|\b)'

  - id: android-sms-cursor-address-column
    desc: Reads SMS cursor address column
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'getColumnIndex(OrThrow)?\s*\(\s*["'']address["'']\s*\)'

  - id: android-sms-cursor-body-column
    desc: Reads SMS cursor body column
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'getColumnIndex(OrThrow)?\s*\(\s*["'']body["'']\s*\)'

composite_rules:
  - id: android-sms-cursor-body-address
    desc: Reads SMS address and body columns
    conf: 0.92
    all:
      - id: android-sms-cursor-address-column
      - id: android-sms-cursor-body-column

  - id: android-sms-content-provider-query
    desc: Queries SMS ContentProvider address and body
    conf: 0.96
    all:
      - id: android-sms-provider-uri
      - id: android-sms-cursor-body-address
      - id: micro-behaviors/data/db/access::jvm-cursor-move-to-next

  - id: android-content-resolver-call-source
    desc: Calls ContentProvider through Android resolver
    conf: 0.96
    near_lines: 20
    all:
      - id: android-content-resolver-reference-source
      - id: android-content-provider-call-source

  - id: android-content-provider-rpc-source
    desc: Android source calls a ContentProvider RPC endpoint
    conf: 0.97
    all:
      - id: android-content-provider-uri-source
      - id: android-content-resolver-call-source
