# Android Binder IPC: reaching and driving system/vendor services. Obtaining a
# raw binder from the hidden ServiceManager and issuing manual transact() calls
# is how code reaches privileged services that are not part of the public SDK.
# Neutral mechanics — intent (command injection, privilege escalation) lives in
# the objective composites that reference these.
defaults:
  platforms: [android]
  for: [java, kotlin, dex, class]

traits:
  - id: servicemanager-reflection
    desc: Reflectively resolves hidden ServiceManager
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: forName
      arg:
        kind: string
        substr: android.os.ServiceManager

  - id: binder-interface-token
    desc: Writes a binder interface token
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: writeInterfaceToken

  - id: binder-transact
    desc: Issues a raw binder transaction
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: transact
