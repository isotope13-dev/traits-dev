---
defaults:
  crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - javascript
traits:
- id: x11-sm-ref
  desc: X11 Session Management library
  crit: baseline
  conf: 0.6
  if:
    type: text
    regex: "(?i)(libSM\\.so|\\bSmc(Conn|OpenConnection|CloseConnection)\\b)"
  unless:
  - id: metadata/lang/source/literal/string/population::js-many-very-long-strings
- id: x11-auth-protocol
  desc: X11 MIT-MAGIC-COOKIE authentication
  crit: baseline
  conf: 0.5
  if:
    type: text
    substr: MIT-MAGIC-COOKIE-1
- id: x11-libice-ref
  desc: X11 libICE reference
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)libICE"
- id: x11-libsm-ref
  desc: X11 libSM reference
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)libSM"
- id: x11-smc-conn-ref
  desc: X11 SmcConn reference
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)SmcConn"
- id: x11-ice-conn
  desc: X11 ICE connection marker
  crit: baseline
  conf: 0.6
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)\\bIceConn\\b"
- id: x11-ice-process-message
  desc: X11 ICE process message marker
  crit: baseline
  conf: 0.6
  if:
    type: text
    regex: "(?i)IceProcessMessage"
- id: x11-ice-ioerror-handler
  desc: X11 ICE IO error handler marker
  crit: baseline
  conf: 0.6
  if:
    type: text
    regex: "(?i)IceSetIOErrorHandler"
- id: x11-ice-protocol-setup
  desc: X11 ICE protocol setup marker
  crit: baseline
  conf: 0.6
  if:
    type: text
    regex: "(?i)IceRegisterForProtocolSetup"
composite_rules:
- id: x11-ipc-lib-marker
  desc: X11 IPC library markers (ICE, SM)
  crit: baseline
  conf: 0.6
  any:
  - id: micro-behaviors/communications/ipc/x11::x11-libice-ref
  - id: micro-behaviors/communications/ipc/x11::x11-sm-ref
  - id: micro-behaviors/communications/ipc/x11::x11-auth-protocol
