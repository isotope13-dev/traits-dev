defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: rpc-endpoint-array
    desc: Declares a JavaScript RPC endpoint array
    if:
      type: text
      regex: '\b(rpc|rpcProviders|rpc_providers|rpcEndpoints)\s*=\s*\['

  - id: multiple-rpc-provider-urls
    desc: Lists multiple RPC provider URLs
    if:
      type: text
      regex: '(?i)\b(rpc|ethereum)\b.{0,120}https?://.{0,60},.{0,60}https?://'

  - id: ipc-object-method-call
    desc: Calls a JavaScript IPC object method
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^ipc(\(\))?\.[A-Za-z_$][A-Za-z0-9_$]*$'

  - id: wallet-provider-eth-send-transaction
    desc: Ethereum wallet transaction RPC method
    if:
      type: string_literal
      exact: eth_sendTransaction
  - id: wallet-provider-eth-sign-typed-data
    desc: Ethereum wallet typed-data signing RPC method
    if:
      type: string_literal
      exact: eth_signTypedData_v4
  - id: wallet-provider-personal-sign
    desc: Ethereum wallet personal-sign RPC method
    if:
      type: string_literal
      exact: personal_sign
  - id: wallet-provider-switch-chain
    desc: Ethereum wallet chain-switch RPC method
    if:
      type: string_literal
      exact: wallet_switchEthereumChain
  - id: wallet-provider-add-chain
    desc: Ethereum wallet add-chain RPC method
    if:
      type: string_literal
      exact: wallet_addEthereumChain
  - id: wallet-provider-wallet-send-transaction
    desc: Wallet transaction RPC method
    if:
      type: string_literal
      exact: wallet_sendTransaction
  - id: wallet-provider-solana-send-transaction
    desc: Solana wallet transaction RPC method
    if:
      type: string_literal
      exact: solana_signAndSendTransaction
  - id: wallet-provider-tron-send-transaction
    desc: Tron wallet transaction RPC method
    if:
      type: string_literal
      exact: tron_sendTransaction

composite_rules:
  - id: wallet-provider-send-method
    desc: Wallet provider transaction RPC method
    crit: notable
    conf: 0.9
    any:
      - id: wallet-provider-eth-send-transaction
      - id: wallet-provider-wallet-send-transaction
      - id: wallet-provider-solana-send-transaction
      - id: wallet-provider-tron-send-transaction
  - id: wallet-provider-sign-method
    desc: Wallet provider signing RPC method
    crit: notable
    conf: 0.9
    any:
      - id: wallet-provider-eth-sign-typed-data
      - id: wallet-provider-personal-sign
  - id: wallet-provider-chain-management
    desc: Wallet provider chain-management RPC method
    crit: notable
    conf: 0.9
    any:
      - id: wallet-provider-switch-chain
      - id: wallet-provider-add-chain
