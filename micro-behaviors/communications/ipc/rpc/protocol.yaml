defaults:
  platforms: [windows, unix]
  for: [binaries, javascript, typescript, python, go, c, cpp, csharp]
  crit: notable
  conf: 0.9

traits:
  # Canonical JSON-RPC 2.0 version marker.  This is the single definition of
  # the pattern: the blockchain dead-drop directory used to carry a private
  # copy named `evm-jsonrpc-protocol`, which claimed EVM intent the matcher
  # never established and fired on ordinary JSON-RPC transports (LSP, MCP,
  # Ethereum clients alike).  Native and C#/C++ clients build the body as an
  # escaped string constant, so the escapes are accepted here too.
  - id: jsonrpc-2-protocol-object
    desc: JSON-RPC 2.0 protocol object
    if:
      type: text
      regex: '(\\?["'']jsonrpc\\?["'']|\bjsonrpc)\s*[:=]\s*\\?["'']2\.0'
