defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: privmsg-tail-bytes
    desc: ELF contains IRC PRIVMSG tail bytes
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "52 49 56 4d 53 47"
      offset_range: [4096, null]
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

