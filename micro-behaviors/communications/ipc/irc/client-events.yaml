defaults:
  platforms: [windows, unix]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
- id: mirc-script-event-part
  desc: Detects mIRC PART event
  crit: notable
  if:
    type: text
    regex: 'ON\s*([*]|1):PART:'
    case_insensitive: true

- id: mirc-script-event-quit
  desc: Detects mIRC QUIT event
  crit: notable
  if:
    type: text
    regex: 'ON\s*([*]|1):QUIT:'
    case_insensitive: true

- id: mirc-script-event-input
  desc: Detects mIRC INPUT event
  crit: notable
  if:
    type: text
    regex: 'ON\s*([*]|1):INPUT:'
    case_insensitive: true

