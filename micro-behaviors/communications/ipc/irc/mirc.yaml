# mIRC remote-script event handling. Every mIRC script that reacts to other
# users -- quiz bots, auto-greeters, channel helpers, and flood/backdoor bots --
# is built from these, so they are protocol mechanics, not intent. Relocated
# from objectives/command-and-control/channel/irc/client/, where they sat at
# suspicious; the bot and worm composites there add the intent.
defaults:
  platforms: [unix, windows]
  crit: notable
  attack: T1546

traits:
  - id: mirc-on-text-handler
    desc: mIRC handler for channel or query TEXT
    conf: 0.9
    # mIRC samples are also typed by their vxheaven suffix (`.m` as
    # Objective-C, `.a` as static-lib) or by DOS COM droppers that embed the
    # remote script they write.
    for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
    if:
      type: text
      case_insensitive: true
      # Bare `:TEXT:` also sits in ODF namespace URNs (`xmlns:text:`)
      # embedded in Qt binaries such as cmake-gui.exe.
      # Event prefixes (`^`, `&`, `!`, `@`, `+`) may precede the level.
      regex: 'ON\s*[\^&!@+]{0,3}([*]|[0-9]+):TEXT:'

  - id: mirc-halt-default-processing
    desc: mIRC handler halts default event processing
    conf: 0.9
    # `| halt` ends remote processing and swallows the default event reply
    # (e.g. the CTCP response). mIRC/ircII only: in a shell script the same
    # text pipes into the `halt` command.
    for: [mirc, ircii]
    if:
      type: text
      case_insensitive: true
      regex: '\|\s*halt\b'
