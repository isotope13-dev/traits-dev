defaults:
  platforms: [unix, windows]
  # Keep the literal matcher below within the engine's parser-literal type cap
  # while covering the common source/script implementations.
  for: [python, javascript, typescript, perl, c, cpp, go, java]
  crit: notable
  conf: 0.85

traits:
  # These are protocol mechanics, not command-and-control intent.  Keep the
  # matchers on parser-extracted literals so ordinary prose about IRC does not
  # become a protocol finding.
  - id: irc-privmsg-literal
    desc: IRC PRIVMSG message literal
    if:
      type: string_literal
      regex: '(?i)\bPRIVMSG\s+(\{|\S)'

  - id: irc-registration-literal
    desc: IRC NICK and USER registration literals
    if:
      type: string_literal
      regex: '(?i)\bNICK\s+\{|\bUSER\s+\{'

  - id: irc-channel-join-literal
    desc: IRC JOIN channel literal
    if:
      type: string_literal
      regex: '\bJOIN\s+([#&+!]\S*|\{[^}]+\})'

  - id: irc-keepalive-literal
    desc: IRC PONG keepalive literal
    if:
      type: string_literal
      regex: '(?i)\bPONG\s+(\{|\S)'

  - id: irc-dcc-send-literal
    desc: IRC DCC SEND transfer literal
    if:
      type: string_literal
      regex: '(?i)\bDCC\s+SEND\b'

composite_rules:
  - id: irc-protocol
    desc: IRC protocol command set
    crit: notable
    conf: 0.9
    any:
      - id: irc-privmsg-literal
      - id: irc-registration-literal
      - id: irc-channel-join-literal
      - id: irc-keepalive-literal
