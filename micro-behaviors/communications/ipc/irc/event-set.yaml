defaults:
  platforms: [windows, unix]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
composite_rules:
- id: mirc-script-event
  desc: mIRC client lifecycle and input event handlers
  crit: notable
  any:
    - id: micro-behaviors/communications/ipc/irc::mirc-script-event-join
    - id: micro-behaviors/communications/ipc/irc::mirc-script-event-part
    - id: micro-behaviors/communications/ipc/irc::mirc-script-event-quit
    - id: micro-behaviors/communications/ipc/irc::mirc-script-event-start
    - id: micro-behaviors/communications/ipc/irc::mirc-script-event-connect
    - id: micro-behaviors/communications/ipc/irc::mirc-script-event-input
