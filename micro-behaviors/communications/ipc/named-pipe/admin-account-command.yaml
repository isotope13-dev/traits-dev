defaults:
  platforms: [windows]
  for: [scripts, pe, dll, source]
composite_rules:
  - id: named-pipe-admin-account-command
    desc: Named pipe and admin account creation commands
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/os/user/account::net-administrator-account-provisioning
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
      - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
    needs: 1
    near_bytes: 4096

