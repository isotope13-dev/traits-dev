# Chromium Native Messaging uses a named-pipe endpoint between the browser and
# its host process.  This is an IPC capability; the browser/child-process
# relationship is assessed by objective composites.
defaults:
  platforms: [windows]
  for: [scripts, source, data, pe, dll, elf]
  crit: notable
  conf: 0.95
  attack: T1559

traits:
  - id: chromium-native-messaging-pipe
    desc: Chromium Native Messaging pipe endpoint
    if:
      type: text
      regex: '(?i)(pipe[/\\]+)?(chrome|msedge)\.nativeMessaging\b'
