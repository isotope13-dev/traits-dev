defaults:
  platforms:
  - windows
  for:
  - pe
  - python
  - c
  - csharp

composite_rules:
  - id: named-pipe-file-write-token-profile
    desc: Named-pipe client with file-write token
    crit: notable
    conf: 0.94
    all:
    - id: micro-behaviors/fs/write/file/handle::file-write-request-token
    any:
    - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
    - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
    - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
    needs: 1
    near_bytes: 4096
    unless:
    - id: well-known/lib/platform/microsoft-detours/
