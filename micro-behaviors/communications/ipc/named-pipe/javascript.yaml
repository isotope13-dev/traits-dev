# JavaScript/TypeScript spelling of the Windows named-pipe path. Source escapes
# every backslash, so `\\.\pipe\name` is written `\\\\.\\pipe\\name` and the
# plain-text prefix atoms in windows.yaml never see it. Neutral: Node's
# net.connect, vscode-jsonrpc and every language-server client address a pipe
# this way on win32.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: js-named-pipe-path
    desc: JavaScript builds a Windows named-pipe path
    attack: T1559
    if:
      type: text
      regex: '\\{2,4}\.\\{1,2}pipe\\{1,2}'
