defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-net-kernel-term
    desc: Passes Erlang net_kernel term to call
    if:
      type: symbol
      kind: call
      regex: '.'
      arg: {index: 0, exact: net_kernel}

  - id: python-is-auth-term
    desc: Passes Erlang is_auth term to call
    if:
      type: symbol
      kind: call
      regex: '.'
      arg: {index: 0, exact: is_auth}

composite_rules:
  - id: python-net-kernel-auth-terms
    desc: Constructs nearby Erlang net_kernel authentication terms
    near_lines: 20
    all:
      - id: python-net-kernel-term
      - id: python-is-auth-term
