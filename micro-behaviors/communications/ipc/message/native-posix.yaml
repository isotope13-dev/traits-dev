# POSIX message queues are a neutral IPC mechanism. Content inspection near a
# send is recorded as a capability here; objectives add telemetry context and
# the success-without-forwarding control flow that establishes suppression.
defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: posix-message-queue-send
    desc: Sends data through a POSIX message queue
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: mq_send

composite_rules:
  - id: content-gated-posix-message-queue-send
    desc: Inspects message content before a POSIX queue send
    crit: notable
    conf: 0.96
    near_bytes: 180
    all:
      - id: micro-behaviors/data/string/search::native-string-search-call
      - id: posix-message-queue-send
