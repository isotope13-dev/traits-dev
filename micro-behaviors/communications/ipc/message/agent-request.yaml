defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: sidebar-message-request-type
    desc: Names a SEND_MESSAGE_REQUEST message type
    conf: 0.95
    if:
      type: literal
      kind: string
      exact: SEND_MESSAGE_REQUEST
  - id: postmessage-wildcard-target
    desc: Calls postMessage with wildcard target origin
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)postMessage$'
      arg:
        index: 1
        kind: string
        exact: '*'
