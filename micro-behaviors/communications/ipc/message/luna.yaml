defaults:
  for: [python, javascript, typescript, go, rust, java, c, cpp, shell]
  platforms: [linux, appliance]

traits:
  - id: luna-log-collection-method
    desc: References the Luna system log collection method
    crit: notable
    conf: 1.0
    if:
      type: string_literal
      substr: luna://com.webos.pmlogd/collectAllLog

  - id: palm-service-bridge-constructor
    desc: Constructs a Palm system service bridge
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '\bnew\s+PalmServiceBridge\s*\('
