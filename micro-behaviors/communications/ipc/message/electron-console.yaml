# Console events can relay renderer values without Electron's explicit IPC API.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, typescript, go, rust]
  crit: notable
  conf: 0.96

traits:
  - id: electron-console-message-listener
    desc: Registers Electron renderer console listener
    if:
      type: text
      regex: '\.webContents\.on\(\s*["'']console-message["'']\s*,'
