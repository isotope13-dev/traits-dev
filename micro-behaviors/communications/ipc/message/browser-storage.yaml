# Exporting a complete browser store through an unrestricted peer origin is
# a security-boundary observation. It does not establish theft or a C2 actor.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: wildcard-peer-browser-storage-export
    desc: Wildcard peer message exports browser storage
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @source)
            property: (property_identifier) @post)
          arguments: (arguments .
            (call_expression function: (member_expression) @serialize
              arguments: (arguments . (object (pair value: [
                (identifier) (member_expression)] @store)) .))
            (string (string_fragment) @origin) .)) @export
          (#eq? @source "source") (#eq? @post "postMessage")
          (#eq? @serialize "JSON.stringify") (#eq? @origin "*")
          (#match? @store "^(window[.])?(localStorage|sessionStorage)$"))
