defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: vscode-webview-host-api
    desc: Accesses VS Code webview host bridge
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(window\.acquireVsCodeApi\s*=|\bacquireVsCodeApi\s*\()'

  # `elem.src` -- the src property of an element held in a variable named
  # `elem`. The member access alone does not say which element or whether it
  # is read or written; the DOM script-loader composites add the rest.
