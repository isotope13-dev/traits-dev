defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: vscode-webview-host-api
    desc: Accesses VS Code webview host bridge
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(window\.acquireVsCodeApi\s*=|\bacquireVsCodeApi\s*\()'

  # Extension-host side of the bridge: the handler that receives every
  # message the webview posts. Present in every webview extension; on its
  # own it says nothing about what the messages can reach.
  - id: vscode-webview-message-handler
    desc: Registers VS Code webview message handler
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      substr: onDidReceiveMessage

  # A message dispatch labeled readFile whose body dereferences a path from
  # the message payload: the webview side picks the file the host reads.
  # Neutral in a fully trusted webview; the objective composites add the
  # remotely sourced content that makes the bridge an attack surface.
  - id: webview-readfile-message-path
    desc: readFile message handler uses payload path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]readFile[''"][\s\S]{0,140}(message|msg)\.(payload\.)?(path|filePath|file)'

  # `elem.src` -- the src property of an element held in a variable named
  # `elem`. The member access alone does not say which element or whether it
  # is read or written; the DOM script-loader composites add the rest.
