# These archive-wide observations do not bind a page password to a message
# or a request body. A settings-page selector and unrelated recording upload
# satisfy them in ordinary extensions. Keep the capabilities visible without
# claiming credential harvesting or that the literal host receives the POST.
defaults:
  platforms: [unix, windows]
  for: [npm, chrome-manifest, javascript, typescript, zip]

composite_rules:
  - id: extension-password-query-post-cooccurrence
    desc: Password query, extension IPC and POST co-occur
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/ui/controls/credential::password-input-query-selector
      - id: chrome-runtime-send-message
      - id: chrome-runtime-on-message
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
    any:
      - id: micro-behaviors/communications/http/url/domain::js-hardcoded-remote-endpoint
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
