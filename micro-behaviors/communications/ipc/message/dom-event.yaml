defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: parses-json-event-detail
    desc: Parses JSON from an event-detail field
    if:
      # Structured symbol arguments do not expose this member-access shape.
      type: tree-sitter
      node: call_expression
      regex: '^JSON\.parse\s*\(\s*[\w$]+\.detail\s*\)'

composite_rules:
  - id: dom-event-json-extension-messaging
    desc: DOM event JSON parsing with extension messaging
    # Co-occurrence describes the bridge surface, not an unchecked data flow.
    all:
      - id: parses-json-event-detail
      - id: chrome-runtime-send-message
