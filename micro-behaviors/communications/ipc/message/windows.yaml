defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
- id: pipe-delimited-transfer-token
  desc: Pipe-delimited file-transfer command token
  if:
    type: text
    regex: '(?i)\b(DOWNLOAD|UPLOAD)\|'
  unless:
  - id: well-known/tool/detection/agent/agentskillmap::cli-context

composite_rules:
- id: windows-native-channel-api
  desc: Uses a native Windows IPC channel
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-api-usage
  - id: micro-behaviors/communications/ipc/pipe::peek-named-pipe
  - id: micro-behaviors/communications/ipc/mailslot::create-mailslot
