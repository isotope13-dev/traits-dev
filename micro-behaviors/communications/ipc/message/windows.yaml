defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: pipe-delimited-transfer-token
    desc: Pipe-delimited file-transfer command token
    if:
      type: text
      regex: '(?i)\b(DOWNLOAD|UPLOAD)\|'
    unless:
      - id: well-known/tool/detection/agentskillmap/

  - id: add-atom-a
    desc: Add an ANSI Windows atom
    if:
      type: symbol
      exact: AddAtomA
  - id: find-atom-a
    desc: Find an ANSI Windows atom
    if:
      type: symbol
      exact: FindAtomA
  - id: get-atom-name-a
    desc: Read an ANSI Windows atom name
    if:
      type: symbol
      exact: GetAtomNameA
  - id: global-add-atom-a
    desc: Add an ANSI global Windows atom
    if:
      type: symbol
      exact: GlobalAddAtomA
  - id: global-get-atom-name-a
    desc: Read an ANSI global atom name
    if:
      type: symbol
      exact: GlobalGetAtomNameA

composite_rules:
  - id: windows-native-channel-api
    desc: Uses a native Windows IPC channel
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-api-usage
      - id: micro-behaviors/communications/ipc/pipe::peek-named-pipe
      - id: micro-behaviors/communications/ipc/mailslot::create-mailslot

  - id: local-atom-table-readback
    desc: Local atom-table write and readback
    crit: notable
    conf: 0.92
    all:
      - id: add-atom-a
      - id: get-atom-name-a

  - id: global-atom-table-readback
    desc: Global atom-table write and readback
    crit: notable
    conf: 0.92
    all:
      - id: global-add-atom-a
      - id: global-get-atom-name-a

  - id: atom-table-readback
    desc: Windows atom-table write and readback
    crit: notable
    conf: 0.92
    any:
      - id: local-atom-table-readback
      - id: global-atom-table-readback
