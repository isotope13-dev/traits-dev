# Window messaging observations.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
- id: extension-window-message-handler
  desc: Handles page window messages
  crit: notable
  if:
    type: text
    regex: 'window\.addEventListener\(\s*["'']message["'']'
- id: cancelled-event-url-runtime-message
  desc: Cancelled event forwards URL to extension
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'preventDefault\s*\(\s*\)[\s\S]{0,500}sendMessage\s*\(\s*\{[^}]{0,160}\burl\s*:'
