defaults:
  platforms: [unix]
  for: [python, shell, javascript, go, ruby, perl, java]

traits:
  - id: couchdb-node-reference
    desc: CouchDB Erlang distribution node reference
    crit: notable
    conf: 0.93
    unless:
      - id: well-known/app/infrastructure/couchdb::couchdb-package
    if:
      # Erlang distribution names are name@host. This is a CouchDB node
      # reference; the string alone does not identify an SMA appliance.
      type: text
      regex: '(?i)couchdb@[A-Za-z0-9._-]{1,64}'
