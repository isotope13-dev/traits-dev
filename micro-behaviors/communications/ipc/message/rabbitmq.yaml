# AMQP broker connectivity is a neutral communication capability. Offensive
# intent belongs in objective rules that combine it with the work being
# distributed, such as active network reconnaissance.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: amqp-broker-url
    desc: Remote AMQP message broker URL
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bamqps?://([^[:space:]"'']{1,64}@)?[A-Za-z0-9][A-Za-z0-9.-]{0,252}'
    unless:
      - type: text
        regex: '\bamqps?://([^[:space:]"'']{1,64}@)?localhost(:[0-9]{1,5})?'
      - type: text
        regex: '\bamqps?://([^[:space:]"'']{1,64}@)?127\.0\.0\.1(:[0-9]{1,5})?'

  - id: pika-import
    desc: Imports the Python Pika AMQP client
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: symbol
      kind: import
      exact: pika

  - id: pika-basic-consume-call
    desc: Calls the AMQP basic_consume channel method
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.basic_consume$'

  - id: go-amqp-consume-call
    desc: Calls a Go AMQP channel Consume method
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '\.Consume$'

composite_rules:
  - id: pika-amqp-consumer
    desc: Python process consumes jobs from an AMQP message broker
    crit: notable
    conf: 0.97
    for: [python]
    all:
      - id: pika-import
      - id: pika-basic-consume-call
      - id: amqp-broker-url

  - id: go-amqp-consumer
    desc: Go process consumes jobs from an AMQP message broker
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: well-known/lib/network/amqp091-go::amqp091-go-library
      - id: go-amqp-consume-call
