defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: ipc-object-method-call
    desc: Calls an IPC messaging method
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^ipc(\(\))?\.(send|sendSync|invoke|request|postMessage)$'
    unless:
      - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-bundle

