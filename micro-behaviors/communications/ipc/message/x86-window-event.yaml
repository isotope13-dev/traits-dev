# Disassembly: pushes callback arguments, custom message 0x1600 and an
# indirect window handle. The keyboard consumer separately requires a
# global WH_KEYBOARD installation, OpenFileMapping and PostMessage imports.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-indirect-window-event-message
    desc: x86 event message to indirect window handle
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: CODE
      pattern: '57 56 68 00 16 00 00 A1 [4] 8B 00 50 E8 [4] A1 [4] 50 E8'
