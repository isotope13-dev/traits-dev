defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: extension-message-carries-page-location
    desc: Sends page location in extension message
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (member_expression) @send
          arguments: (arguments (object
            (pair value: (member_expression
              object: (identifier) @location
              property: (property_identifier) @part))))) @message
          (#match? @send "^(chrome|browser)\\.runtime\\.sendMessage$")
          (#eq? @location "location")
          (#match? @part "^(hostname|host|href)$"))
