# The Erlang/OTP distribution cookie: the shared secret every BEAM node presents
# to join a cluster. `-setcookie` on the command line and an `erlang_cookie`
# config key are how every Erlang and Elixir release starts -- EMQX, RabbitMQ,
# Ejabberd, CouchDB and Phoenix all ship it.
#
# Relocated (2026-09-17) from objectives/execution/exploit/sonicwall-sma, where
# it was `sma-erlang-cookie-auth` at `suspicious`. Its own description was
# already neutral ("Erlang distribution cookie authentication") and the matcher
# names no appliance, so every Erlang application read as a SonicWall SMA
# exploit -- EMQX's container image tripped it on bin/emqx and releases/emqx_vars.
# The per-app `unless:` for CouchDB was the tell. The SMA hostile composite
# references this across directories; its appliance context comes from the
# wsproxy endpoint and the couchdb@ node legs, not from the cookie.
defaults:
  platforms: [unix, windows]
  # Same scope the SMA rule used, plus the config/manifest forms a release
  # actually ships the cookie in (vm.args, sys.config, env files).
  for: [python, shell, javascript, go, ruby, perl, java, data]
  crit: notable
  conf: 0.92

traits:
  - id: erlang-distribution-cookie
    desc: Erlang distribution cookie authentication
    if:
      type: text
      regex: '(?i)erlang[_-]?cookie|(^|\s)-setcookie\b'
