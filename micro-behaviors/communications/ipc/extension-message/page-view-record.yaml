# A runtime message carrying the page address together with its referrer:
# a page-view record (where the user is and where they came from), not just
# a URL lookup.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: runtime-message-page-url-and-referrer
    desc: Runtime message carries page URL and referrer
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bruntime\.sendMessage\(\s*\{[^}]{0,80}location\.href,\s*\w+:\s*[\w.]*document\.referrer'
