# A content script handing the current page address to the background
# worker. Run from an all-sites content script, it reports every page the
# user opens.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: runtime-message-page-url
    desc: Runtime message carries the page URL
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bruntime\.sendMessage\(\s*\{[^}]{0,80}:\s*(window\.|document\.)?location\.href\b'
