# The background side of a relay: an extension worker serializes the message
# it received straight into a request body. A worker that builds its body from
# its own state or from fields the user selected does not match, so this leg
# separates a passive forwarder from an on-demand request.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: message-payload-json-body
    desc: Request body serializes the received message
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'body\s*:\s*JSON\.stringify\(\s*(request|message|msg|req)\b'
