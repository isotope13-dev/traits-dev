# A message-named JSON body alone also occurs in ordinary HTTP clients.
# Require a nearby extension listener before reporting extension context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: message-payload-json-body
    desc: Runtime listener near message-named JSON body
    crit: notable
    conf: 0.85
    near_bytes: 3000
    all:
      - id: chrome-runtime-on-message
      - id: metadata/lang/source/syntax/call/arguments::json-body-message-identifier
