# Extension runtime messages that carry a `password` member. Content scripts
# use them to hand a page field's secret to the privileged background worker,
# which can then reach any origin.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: runtime-message-password-member
    desc: Runtime message carries a password member
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bruntime\.sendMessage\(\s*\{[^}]{0,160}\bpassword\s*:'
  # The background side: a request body built from the `password` member of
  # an incoming message object.
  - id: message-password-into-json-body
    desc: JSON body built from a message password
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'JSON\.stringify\(\{[^}]{0,80}\bpassword\s*:\s*(msg|message|request|req)\.password\b'
