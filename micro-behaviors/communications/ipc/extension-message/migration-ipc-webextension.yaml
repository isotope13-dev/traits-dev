defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
- id: chrome-runtime-send-message
  desc: Sends a browser extension runtime message
  crit: notable
  if:
    type: text
    regex: '\b(chrome|browser)\.runtime\.sendMessage\s*\('
- id: chrome-runtime-fixed-extension-message
  desc: Sends message to fixed Chromium extension
  crit: notable
  conf: 0.97
  if:
      # Chromium extension IDs are 32 characters in the a-p alphabet. Requiring
      # the ID as sendMessage's first argument distinguishes cross-extension
      # IPC from the overwhelmingly common messages to the caller's own worker.
    type: text
    regex: '(chrome|browser)\.runtime\.sendMessage\s*\(\s*["''][a-p]{32}["'']\s*,'
  # A content script that hands `event.data` from window.postMessage straight
  # to runtime.sendMessage lets the web page speak to the extension's
  # privileged background context. Wallet connectors do this with a schema;
  # the risk depends on what the background does with the message.
- id: page-message-relayed-to-runtime
  desc: Relays page postMessage data to the extension
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'addEventListener\(\s*[''"]message[''"][\s\S]{0,300}runtime\.sendMessage\(\s*[\w$]+\.data\b'
- id: chrome-runtime-on-message
  desc: Registers a browser runtime message listener
  crit: notable
  if:
    type: symbol
    kind: call
    regex: '(^|\.)runtime\.onMessage\.addListener$'
- id: chrome-runtime-on-message-external
  desc: References external extension messaging
  if:
    type: text
    regex: '(chrome\.|browser\.)?runtime\.onMessageExternal(\.addListener)?'
- id: chrome-runtime-external-token-field
  desc: External-message and token-field text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)onMessageExternal[\s\S]{0,800}[{,]\s*["'']?(jwt|token)["'']?\s*:'
- id: chrome-runtime-connect-port
  desc: WebExtension runtime port connection
  if:
    type: text
    regex: '(chrome|browser)\.runtime\.connect\b'
- id: chrome-runtime-port-name
  desc: Chrome runtime named port
  crit: baseline
  if:
    type: text
    regex: 'runtime\.connect\s*\(\s*\{\s*name\s*:'
- id: chrome-tabs-send-message
  desc: Tab content-script message send
  crit: baseline
  if:
    type: text
    regex: '(chrome|browser)\.tabs\.sendMessage\b'

composite_rules:
- id: webextension-page-event-command-bridge
  desc: Runtime listener with forwarding event creation
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/ui/window/event::construct-forwarding-custom-event
  - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-on-message
