# A content script that listens for window messages from the page, forwards
# them to the extension runtime, and posts the background's answer back to
# the page. This is the generic page<->extension RPC bridge: the web page can
# invoke whatever actions the background exposes.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: page-message-runtime-round-trip-bridge
    desc: Content script bridges page messages to runtime and back
    crit: notable
    conf: 0.88
    near_bytes: 2500
    all:
      - id: micro-behaviors/communications/ipc/message::extension-window-message-handler
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message
      - id: micro-behaviors/communications/ipc/message::postmessage-call

  # A runtime message listener next to a fetch that sends cookies: a
  # message-driven credentialed request, typically a fetch proxy for
  # content scripts.
  - id: runtime-message-near-credentialed-fetch
    desc: Message listener near a credentialed fetch
    crit: notable
    conf: 0.85
    near_bytes: 3000
    all:
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-on-message
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include
