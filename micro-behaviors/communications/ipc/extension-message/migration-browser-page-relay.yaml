defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
# Ties the page-content capture to the actual IPC hop that would carry it out
# of the content script, in one file. A <all_urls> extension is a big surface:
# it commonly has *some* runtime.sendMessage call for unrelated UI/settings
# traffic and, independently, a querySelectorAll('script') used for a totally
# unconnected feature (e.g. scraping a video site's embedded player-state
# JSON for captions). Without this proximity link, `scope: archive` treated
# those two coincidences anywhere in the package as if the scraped markup
# were what got sent -- e.g. Kitsumi's YouTube script scraper (content.js)
# and its opt-in, user-keyed Groq flashcard call (popup.js, unrelated file)
# collapsed into one false "sends page scripts to a remote LLM" verdict.
- id: page-content-message-relay
  desc: Captured page markup is handed to a runtime message
  crit: suspicious
  conf: 0.9
  near_bytes: 2000
  # The message has to actually carry the markup. page-script-element-
  # enumeration only says the script looked at <script> tags -- content scripts
  # do that to read a site's own inline configuration -- and combined with the
  # ubiquitous sendMessage call it reported ordinary extensions as relaying
  # captured page content.
  all:
  - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message
  - id: metadata/lang/source/naming/page-content::page-dom-payload-field

