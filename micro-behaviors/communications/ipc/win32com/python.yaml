defaults:
  crit: notable
  conf: 0.85
  for: [python]
  attack: T1559.001
  platforms:
    - windows
traits:
  - id: import-win32com
    desc: Python win32com module import
    if:
      type: text
      substr: import win32com
  - id: dispatch-call
    desc: COM Dispatch object creation
    if:
      type: symbol
      regex: '(^|\.)(DispatchEx?|EnsureDispatch|CoCreateInstance)$'
composite_rules: []
