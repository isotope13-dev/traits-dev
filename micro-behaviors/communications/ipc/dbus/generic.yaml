# D-Bus is the message bus every Linux desktop session runs on, and until now
# this directory held exactly one trait: a Python-only string for the Secret
# Service, in a subdirectory of its own. A compiled Linux sample that talks to
# the bus produced no IPC finding at all, which is a blind spot in both
# directions -- an analyst could not see that a binary was a bus client, and the
# objectives that want to reason about bus abuse had no atom to compose.
#
# These are neutral capabilities: a tray applet, a notification helper and a
# desktop updater all use them. They matter because the same calls are how a
# Linux implant avoids the surfaces defenders watch -- `gdbus call` to
# org.freedesktop.systemd1 starts a user unit without invoking systemctl,
# org.freedesktop.Notifications forges a system prompt, and ScreenSaver.Inhibit
# keeps a session from locking while work continues. Intent belongs to the
# objectives that combine these with what is being started, shown or inhibited.
defaults:
  # Linux rather than unix: D-Bus is the Linux/BSD desktop bus. AppleScript is
  # dropped only to stay inside the text-matcher file-type cap; it is the one
  # type in these groups that never carries D-Bus code.
  platforms: [linux]
  for: [binaries, scripts, source, -applescript]
  crit: notable
  conf: 0.85

traits:
  # Folded up from a `secret-service/` subdirectory that held it alone: a
  # one-trait directory is a weak ML feature, and it stopped dbus/ from being a
  # leaf. Widened from python-only at the same time -- a compiled sample that
  # names the keyring bus is exactly the case worth seeing.
  - id: freedesktop-secret-service-reference
    desc: Freedesktop Secret Service bus reference
    conf: 0.9
    if:
      type: text
      substr: org.freedesktop.secrets

  - id: dbus-session-bus-address-env
    desc: Reads the D-Bus session bus address
    conf: 0.9
    if:
      type: text
      substr: DBUS_SESSION_BUS_ADDRESS

  - id: dbus-core-interface
    desc: References the core D-Bus interface
    conf: 0.85
    if:
      type: text
      regex: 'org\.freedesktop\.DBus(\.(Properties|Introspectable|ObjectManager))?\b'

  - id: dbus-cli-invocation
    desc: Invokes a D-Bus command-line client
    conf: 0.88
    if:
      type: text
      regex: '(?m)(^|[;&|"''`\s])(dbus-send|gdbus|busctl|qdbus)([\s"''`]|$)'

  - id: dbus-systemd-manager-interface
    desc: Talks to the systemd D-Bus manager
    conf: 0.9
    if:
      type: text
      substr: org.freedesktop.systemd1

  - id: dbus-notification-interface
    desc: Uses the desktop notification bus
    conf: 0.85
    if:
      type: text
      substr: org.freedesktop.Notifications

  - id: dbus-screensaver-interface
    desc: Uses the screensaver idle-inhibit bus
    conf: 0.85
    if:
      type: text
      substr: org.freedesktop.ScreenSaver

  - id: dbus-status-notifier-item
    desc: Registers a StatusNotifierItem tray icon
    conf: 0.9
    if:
      type: text
      substr: StatusNotifierItem

# No `dbus-client` roll-up: a bare `any:` over these atoms is filtered from scan
# output as low-value, and each atom already names a specific bus surface an
# analyst can act on. An objective that wants the whole family can reference the
# directory.
