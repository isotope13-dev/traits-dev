# Go helpers for Unix-domain endpoint syntax. These functions normalize socket
# names and derive an HTTP URL; the dial-context atom also identifies the
# separate operation that opens the Unix-domain connection.
defaults:
  platforms: [unix]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: raw-sockaddr-unix-reference
    desc: References Go Unix socket address layout
    if:
      type: text
      substr: syscall.RawSockaddrUnix

  - id: unix-socket-path-resolver
    desc: Resolves abstract Unix socket paths
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ResolveSocketPath$'

  - id: http-unix-url-splitter
    desc: Parses HTTP over Unix socket endpoints
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SplitHTTPUnixURL$'

  - id: unix-dial-context
    desc: Go dials a Unix-domain socket
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.DialContext$'
      arg:
        kind: string
        exact: unix

  - id: go-daemon-socket-cli
    desc: Go daemon accepts a socket path
    for: [elf]
    if:
      type: raw
      substr: '--daemon <socket_path>'
      section: .rodata

  - id: go-daemon-listen-error-log
    desc: Daemon listener error format fragment
    crit: component
    for: [elf]
    if:
      type: raw
      substr: 'daemon listen error: %v'
      section: .rodata

  - id: go-daemon-ready-log
    desc: Daemon ready-message format fragment
    crit: component
    for: [elf]
    if:
      type: raw
      substr: 'daemon ready on %s'
      section: .rodata

  - id: go-main-daemon-mode-symbol
    desc: Go main package daemon-mode routine
    for: [elf]
    if:
      type: text
      exact: main.daemonMode
      section: .gopclntab

composite_rules:
  - id: unix-socket-path-normalization
    desc: Normalizes abstract Unix socket paths
    crit: notable
    conf: 0.92
    all:
      - id: raw-sockaddr-unix-reference
      - id: unix-socket-path-resolver

  - id: http-unix-endpoint-parser
    desc: Parses HTTP Unix socket endpoints
    crit: notable
    conf: 0.92
    all:
      - id: http-unix-url-splitter
      - id: unix-socket-path-resolver

  - id: go-http-unix-socket-transport
    desc: Go HTTP transport over Unix socket
    crit: notable
    conf: 0.95
    all:
      - id: http-unix-endpoint-parser
      - id: unix-dial-context

  - id: go-unix-socket-daemon-listener
    desc: Go daemon exposes a Unix socket listener
    crit: notable
    conf: 0.98
    for: [elf]
    all:
      - id: go-daemon-socket-cli
      - id: go-main-daemon-mode-symbol
      - id: go-daemon-listen-error-log
      - id: go-daemon-ready-log
