# Native Unix-domain socket endpoint references. Stock daemon defaults and
# RFC 2606 example names are config templates and documentation corpora, not
# an endpoint this program chose. A bind-shell objective treats a remaining
# path as that endpoint, so those defaults are excluded here. Attacker paths
# such as /run/bigtlog.pipe still match.
defaults:
  crit: notable
  platforms: [linux, macos]

traits:
  - id: non-stock-unix-socket-path
    desc: Names a non-stock Unix socket path
    conf: 0.9
    for: [elf, macho, so, dylib]
    if:
      type: text
      regex: '^/(run|var/run|tmp)/[^\r\n]{1,180}\.(sock(et)?|pipe)$'
    not:
      - substr: example.com
      - substr: example.org
      - substr: example.net
      - substr: mysqld.sock
      - substr: mysql.sock
      - substr: /haproxy/
      - substr: docker.sock
      - substr: containerd.sock

  - id: c-af-unix-stream-socket
    desc: C source creates a Unix-domain stream socket
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      regex: 'socket\s*\(\s*(AF_UNIX|AF_LOCAL)\s*,\s*SOCK_STREAM\s*,\s*0\s*\)'
