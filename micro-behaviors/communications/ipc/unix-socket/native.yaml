# Native Unix-domain socket endpoint references. The path is neutral: service
# managers, databases, container runtimes, and local backdoors all use these
# endpoints. Objective rules combine it with the operations performed through
# the socket.
defaults:
  platforms: [linux, macos]

traits:
  - id: native-binary-unix-socket-path
    desc: Native binary names a Unix-domain socket path
    crit: notable
    conf: 0.9
    for: [elf, macho, so, dylib]
    if:
      type: text
      regex: '^/(run|var/run|tmp)/[^\r\n]{1,180}\.(sock(et)?|pipe)$'

  - id: c-af-unix-stream-socket
    desc: C source creates a Unix-domain stream socket
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      regex: 'socket\s*\(\s*(AF_UNIX|AF_LOCAL)\s*,\s*SOCK_STREAM\s*,\s*0\s*\)'
