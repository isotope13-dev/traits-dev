# Native Unix-domain socket creation. Endpoint path references live in
# micro-behaviors/fs/path/socket; paths alone do not establish socket operations.
defaults:
  crit: notable
  platforms: [linux, macos]

traits:
  - id: c-af-unix-stream-socket
    desc: C source creates a Unix-domain stream socket
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      regex: 'socket\s*\(\s*(AF_UNIX|AF_LOCAL)\s*,\s*SOCK_STREAM\s*,\s*0\s*\)'

  # The kernel-reported UID of the process on the other end of a Unix socket.
  # Only a server that decides who may talk to it asks.
  - id: peer-credential-lookup
    desc: Binary reads the socket peer UID
    conf: 0.9
    for: [elf, macho]
    if:
      type: symbol
      regex: '^(getpeereid|getpeerucred)$'

composite_rules:
  # A terminal multiplexer's PTY host listens on a Unix socket, allocates a
  # pseudoterminal, execs a shell on its slave and hands the master to the
  # front end. Stdio, a listener, dup2 and execve are present exactly as in a
  # bind shell. What differs is a real PTY and an authorization check on the
  # connecting UID: a bind shell wires the accepted socket itself to the shell
  # and lets anyone who reaches it in.
  - id: unix-socket-pty-host
    desc: Unix-socket PTY host checking peer UID
    crit: exception
    for: [elf, macho]
    all:
      - id: micro-behaviors/process/tty/pty::posix-openpt
      - id: peer-credential-lookup
