defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

# Local IPC over a Unix domain socket (Node `net` module): a daemon listens on
# a filesystem socket path and clients connect to it. Distinguished from TCP by
# listen()/connect() taking a socket *path* (or a .sock file) rather than a
# numeric port. Capability, not intent: orchestrators use it to talk to a
# background daemon, but it is also how local malware brokers a private control
# channel between a resident agent and its launcher.
traits:
  - id: socket-path-listen
    desc: Server listens on a socket path
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\.listen\(\s*[A-Za-z_$][\w$]*(Path|Sock|Socket)'

  - id: socket-endpoint-path-listen
    desc: Node server listens on endpoint path
    crit: component
    conf: 0.86
    if:
      type: text
      # Node treats a string-valued endpoint.path/socketPath argument as a
      # Unix-domain socket path. Keep this as a component: the net import and
      # listener context in the composite establish the IPC capability.
      regex: '\.listen\(\s*(this\.)?[A-Za-z_$][\w$]*\.(path|socketPath|sockPath)\b'

  - id: socket-path-connect
    desc: Client connects to a socket path
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\.connect\(\s*(this\.)?[A-Za-z_$][\w$]*(Path|Sock|Socket)'

  - id: socket-file-path
    desc: Unix domain socket file path
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["''`][^"''`]{0,40}\.sock["''`]'

composite_rules:
  - id: unix-socket-ipc
    desc: Local IPC over a Unix domain socket
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/communications/socket/connect::node-net-commonjs-import
    any:
      - id: socket-path-listen
      - id: socket-endpoint-path-listen
      - id: socket-path-connect
      - id: socket-file-path
