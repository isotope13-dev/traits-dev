defaults:
  platforms: [windows, unix]
  for: [json]
traits:
  - id: agent-sessionstart-hook-command
    desc: Agent SessionStart hook declares a command
    crit: notable
    conf: 0.9
    if:
      type: value
      path: hooks.SessionStart[*].hooks[*].command
      regex: '\S'

  - id: session-command-config-directory
    desc: Session hook references tool config directory
    crit: notable
    conf: 0.94
    if:
      type: value
      path: hooks.SessionStart[*].hooks[*].command
      regex: '(?i)\.(vscode|idea|cursor|codex|gemini|windsurf)[\/]'
