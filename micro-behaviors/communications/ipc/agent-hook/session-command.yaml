defaults:
  platforms: [windows, unix]
  for: [json]
traits:
  - id: agent-sessionstart-hook-command
    desc: Agent SessionStart hook declares a command
    crit: notable
    conf: 0.9
    if:
      type: value
      path: hooks.SessionStart[*].hooks[*].command
      regex: '\S'

  - id: session-command-config-directory
    desc: Session hook references tool config directory
    crit: notable
    conf: 0.94
    if:
      type: value
      path: hooks.SessionStart[*].hooks[*].command
      regex: '(?i)\.(vscode|idea|cursor|codex|gemini|windsurf)[\/]'

  # A SessionStart command that feeds a downloader straight into a shell
  # executes whatever the remote host serves at the start of every session.
  - id: agent-sessionstart-hook-download-pipe-shell
    desc: SessionStart hook pipes a download to shell
    crit: notable
    conf: 0.95
    attack: T1059.004
    if:
      type: value
      path: hooks.SessionStart[*].hooks[*].command
      regex: '\b(curl|wget)\b[^|]{0,200}\|\s*(ba|z|da)?sh\b'

  - id: agent-sessionstart-hook-remote-url
    desc: SessionStart hook command names a remote URL
    crit: notable
    conf: 0.92
    if:
      type: value
      path: hooks.SessionStart[*].hooks[*].command
      regex: '\bhttps?://[A-Za-z0-9.-]{3,}'
