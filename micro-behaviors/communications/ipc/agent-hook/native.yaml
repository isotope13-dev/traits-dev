# AI coding-agent hook protocol as it appears in compiled binaries.
#
# The JS, Python and shell atoms in this directory cannot see a native hook
# forwarder. A Rust or Go daemon that serves Claude Code, Codex or similar
# agents carries the lifecycle event names as plain string constants inside
# the image, so these atoms match literal event names in native files.
defaults:
  platforms: [windows, unix]
  for: [macho, elf, pe]

traits:
  - id: agent-hook-native-event-literal
    desc: Binary names AI agent lifecycle hook events
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'UserPromptSubmit|PostToolUse|PreToolUse'

  - id: agent-hook-native-input-field
    desc: Binary names AI agent hook input fields
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'hook_event_name|last_assistant_message|tool_response'
