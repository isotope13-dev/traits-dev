composite_rules:
- id: claude-session-hook-updater-settings
  for:
  - javascript
  - typescript
  desc: Session hook co-occurs with updater and token settings
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart
  - id: micro-behaviors/data/config/write::claude-autoupdater-disabled
  - id: micro-behaviors/os/env/ai-provider::anthropic-auth-token-variable
  - id: micro-behaviors/data/config/write::claude-onboarding-complete
  unless:
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/presence/fixture::test-underscore-js-filename
  - id: metadata/package/testing/presence/path::test-fixture-directory-path
  - id: metadata/package/testing/presence/test-home::test-home-directory-path
- id: claude-session-hook-provider-settings
  for:
  - shell
  - python
  - javascript
  desc: Claude session hook co-occurs with provider settings
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart
  - id: micro-behaviors/os/env/ai-provider::anthropic-base-url-variable
  - id: micro-behaviors/os/env/ai-provider::anthropic-auth-token-variable
  - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/tooling::claude-agent-hook-env-integration-context
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/presence/fixture::test-underscore-js-filename
  - id: metadata/package/testing/presence/path::test-fixture-directory-path
  - id: metadata/package/testing/presence/test-home::test-home-directory-path
# Archive-wide coincidence supports a capability profile, not proof that the
# install hook reaches a settings writer. Legitimate agent frameworks ship
# lifecycle scripts, hook implementations and unrelated file writers together.
- id: npm-postinstall-agent-tool-hook-code
  for: [javascript, typescript, shell, python, package.json, npm]
  desc: npm postinstall co-occurs with file writes and agent tool hooks
  crit: notable
  conf: 0.96
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
  - id: agent-pretooluse-hook
  - id: agent-posttooluse-hook
traits: []
defaults:
  platforms:
  - windows
  - unix
