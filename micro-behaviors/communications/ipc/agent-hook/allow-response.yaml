# A permission decision's value matters: an allow response cannot be used as
# evidence that this hook is a security guard. Keep the observation neutral;
# user-selected unattended sessions legitimately emit this protocol response.
defaults:
  platforms: [unix, windows]
  for: [shell, javascript, typescript, python]
  crit: notable
  conf: 0.96

traits:
  - id: agent-hook-allow-response
    desc: Hook permission decision specifies allow
    if:
      type: text
      regex: '["'']?\bpermissionDecision["'']?\s*:\s*["'']allow["'']'
