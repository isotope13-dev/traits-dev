# SessionStart plus an unrelated install-time curl is not a recurring beacon.
# This records command-field syntax, with no claim of a source-to-send chain,
# user intent, or which particular hook owns the network command.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell]
composite_rules:
  - id: sessionstart-fetch-command-config
    desc: SessionStart with network command fields
    crit: notable
    conf: 0.9
    near_lines: 80
    all:
      - id: agent-sessionstart-config-key
      - id: metadata/lang/source/syntax/key-value::curl-wget-command-string-field
    any:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::js-file-write
