# WAP Push (WSP) over SMS: a Push PDU is transaction id, PDU type 0x06, then
# a header-length uintvar. Binary SMS to the WAP Push port is normal carrier
# provisioning traffic; an over-long uintvar whose value reaches 2^31 is not a
# real header length. These match wire bytes and the port, not a CVE or name.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: wap-push-port-data-send
    desc: Sends binary SMS to WAP port 2948
    if:
      type: text
      regex: '\.sendDataMessage\s*\([^;]{0,120}\b2948\b'

  - id: wsp-push-pdu-overlong-length
    desc: Byte array with Push PDU five-byte length
    if:
      type: text
      case_insensitive: true
      regex: '0x0[0-9a-f],\s*0x06,\s*(\(byte\)\s*)?0x8[0-9a-f],\s*(\(byte\)\s*)?0x80'

  - id: wsp-push-uintvar-int32-overflow
    desc: Five-byte WSP uintvar overflowing signed int32
    if:
      type: text
      case_insensitive: true
      exclude_comments: true
      regex: '0x0[0-9a-f],\s*0x06,\s*(\(byte\)\s*)?0x8[89a-f](,\s*(\(byte\)\s*)?0x[89a-f][0-9a-f]){3}'
