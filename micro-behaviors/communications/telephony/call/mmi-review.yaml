defaults:
  platforms: [android]
  for: [java, kotlin, csharp, javascript, typescript, dex]
  crit: notable
  conf: 0.9

traits:
  - id: android-action-call-dial
    desc: Android CALL action near activity launch
    conf: 0.9
    for: [java, kotlin, csharp, javascript, typescript]
    if:
      type: text
      regex: '(ACTION_CALL|ActionCall|action\.CALL)[\s\S]{0,400}[sS]tartActivity\s*\('

composite_rules:
  - id: android-value-derived-ussd-source
    desc: CALL activity near USSD name and tel URI
    crit: notable
    conf: 0.9
    for: [java, kotlin, csharp, javascript, typescript]
    all:
      - id: metadata/lang/source/naming/variable::android-ussd-variable-name
      - id: micro-behaviors/communications/telephony/call::android-action-call-dial
    any:
      - id: micro-behaviors/communications/url/construction/template::android-uri-parse-dynamic-tel
      - id: micro-behaviors/communications/url/construction/template::android-uri-fromparts-dynamic-tel
    near_bytes: 1600
