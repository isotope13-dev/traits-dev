defaults:
  platforms: [android, ios]
  for: [java, kotlin, swift]
  crit: notable
  conf: 0.98

traits:
  - id: ios-callkit-start-call-action
    desc: Creates a CallKit outbound-call action
    for: [swift]
    platforms: [ios]
    if:
      type: symbol
      kind: call
      exact: CXStartCallAction

  - id: ios-callkit-transaction-request
    desc: Requests a CallKit transaction
    for: [swift]
    platforms: [ios]
    if:
      type: text
      regex: '\.request\s*\(\s*CXTransaction\s*\('

composite_rules:
  - id: android-telecom-outbound-call
    desc: TelecomManager import with a placeCall-named call
    for: [java, kotlin]
    platforms: [android]
    all:
      - id: metadata/import/framework::android-telecom-manager-import
      - id: metadata/lang/source/naming/function/communication::android-telecom-place-call

  - id: ios-callkit-outbound-call
    desc: CallKit outbound-call action and transaction request
    for: [swift]
    platforms: [ios]
    all:
      - id: metadata/import/framework::ios-callkit-import
      - id: micro-behaviors/communications/telephony/call::ios-callkit-start-call-action
      - id: micro-behaviors/communications/telephony/call::ios-callkit-transaction-request
    near_bytes: 1400
