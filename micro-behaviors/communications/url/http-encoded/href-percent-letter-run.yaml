# An href path segment made only of percent-encoded ASCII letters.
# RFC 3986 leaves A-Z/a-z unreserved, so a run of letter escapes is
# over-encoding: the landing name is hidden from a reader and from a
# literal filter, and the browser decodes it before navigating.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: suspicious
  conf: 0.9

traits:
  - id: href-percent-encoded-letter-run
    desc: Href path hides a percent-encoded word
    if:
      type: text
      regex: '(?i)href=["'']https?://[^"''\s]{1,80}/(%([46][1-9a-f]|[57][0-9a])){8,}'
