defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97
traits:
  - id: printf-pasted-event-query-format
    desc: printf constructs a pasted-event query
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '(\?|&|\\077|\\046|\\x3f|\\x26)(e|\\145|\\x65)(v|\\166|\\x76)(e|\\145|\\x65)(n|\\156|\\x6e)(t|\\164|\\x74)(=|\\075|\\x3d)(p|\\160|\\x70)(a|\\141|\\x61)(s|\\163|\\x73)(t|\\164|\\x74)(e|\\145|\\x65)(d|\\144|\\x64)'
  - id: printf-pasted-event-query-percent-b
    desc: printf constructs a pasted-event query
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '(\?|&|\\077|\\046|\\x3f|\\x26)(e|\\145|\\x65)(v|\\166|\\x76)(e|\\145|\\x65)(n|\\156|\\x6e)(t|\\164|\\x74)(=|\\075|\\x3d)(p|\\160|\\x70)(a|\\141|\\x61)(s|\\163|\\x73)(t|\\164|\\x74)(e|\\145|\\x65)(d|\\144|\\x64)'
