defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: http-path-a-executable-suffix
    desc: HTTP path has executable suffix
    conf: 0.8
    if:
      type: string_literal
      regex: '(GET|POST|PUT) +/[^ ]+\.(bin|exe|sh|elf)'
  - id: http-path-b-payload-suffix
    desc: HTTP path has payload suffix
    conf: 0.8
    if:
      type: string_literal
      regex: '(GET|POST|PUT) +/[^ ]+\.(dll|so|dat|payload)'
# A /captcha or /recaptcha path segment: every sign-up form that embeds
# reCAPTCHA or serves its own challenge (Element's registration flow). The
# router-relay phishing composite adds the numeric-host request. The segment
# must end there (slash, query, fragment, quote, .php or end of text): a bare
# word boundary also accepted file names such as captcha-typing-job.jpg.
  - id: in-cgi-gateway-script-url
    desc: in.cgi TDS gateway URL with campaign parameter
    crit: notable
    conf: 0.93
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: 'https?://[^''">\s\\]{1,120}/in\.cgi\?[A-Za-z0-9_%.=-]{1,64}'
  - id: mutable-branch-ref-path
  # A URL whose path selects a branch head (/branch/main, /refs/heads/master)
  # resolves to whatever that branch points at today, so the retrieved bytes
  # are not pinned. Neutral on its own — build scripts and docs link this way
  # constantly; supply-chain composites add the fetch-and-execute context.
    desc: URL path selects a mutable branch head
    crit: notable
    conf: 0.88
    for: [scripts]
    if:
    # Documentation links and comments are references, not runtime URL use.
    # Literal facts retain URLs actually embedded as program or manifest data.
      type: literal
      kind: string
      regex: 'https?://[^\s]{0,120}/(branch|heads)/(main|master)\b'
  - id: mutable-raw-branch-path
  # Bitbucket and similar code forges expose branch-selected raw content as
  # `/raw/main/...`. Unlike a commit-addressed raw URL, its bytes can change
  # without the consuming artifact changing. Neutral on its own; objective
  # composites add the fetch-and-execute relationship.
    desc: Raw-content URL selects mutable branch
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: literal
      kind: string
      regex: 'https?://[^\s]{0,120}/raw/(main|master)(/|$)'
  - id: external-ip-info-txt-url
    desc: External IP-pinned info.txt URL
    crit: notable
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{2,5}/[^\s''"]{0,120}info\.txt'
      is: external_ip
