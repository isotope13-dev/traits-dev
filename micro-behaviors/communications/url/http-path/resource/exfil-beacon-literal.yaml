defaults:
  platforms: [android, unix]
  for: [shell, php, perl, c, cpp, elf, go, kotlin]

traits:
  - id: exfil-or-beacon-url-literal
    desc: HTTP URL names exfil or beacon
    crit: notable
    conf: 0.9
    if:
      # An endpoint name establishes neither a data transfer nor exfiltration.
      type: string_literal
      regex: 'https?://[^"''\s]{1,120}/(exfil(trate|tration)?|beacon)([/?#]|$)'
