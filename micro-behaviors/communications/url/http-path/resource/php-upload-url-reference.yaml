# Placement note: the reviewed cross-carrier scope of this literal (a hardcoded
# PHP-panel upload URL appears in source of every language and in compiled
# string tables) is preserved by the compiled-in validator entry
# `literal:micro-behaviors/communications/url/http-path/resource/php-upload-url-reference.yaml`,
# which lifts the text/literal file-type cap only at this exact path. The
# taxonomy retired the former `http-path` subtree, but the installed validator
# still keys the exemption to this filename; until its allowlist is repointed
# at the retirement target, the rule stays here so its reviewed scope survives
# (`for: [scripts, source, binaries]`) instead of being silently narrowed.
defaults:
  platforms: [unix, windows]
traits:
  - id: php-upload-endpoint-url
    desc: PHP upload endpoint URL
    crit: notable
    conf: 0.88
    for: [scripts, source, binaries]
    if:
      type: string_literal
      regex: '(?i)https?://[^\s"'']{1,180}/upload[^\s"'']{0,40}\.php([?#]|$)'
