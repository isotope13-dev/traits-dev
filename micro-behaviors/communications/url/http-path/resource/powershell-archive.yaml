# An archive URL is an endpoint reference; it does not imply a download.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, csharp, javascript, typescript]
  crit: notable
traits:
  - id: powershell-archive-url-reference
    desc: PowerShell HTTP command names an archive URL
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(iwr|invoke-webrequest)\b.{0,120}\bhttps?://.{1,120}\.(zip|7z|rar)\b'
    not:
      - regex: '[;&|\r\n]'
