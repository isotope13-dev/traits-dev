# Ivanti's public login route is context, not evidence of exploitation alone.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: ivanti-public-login-cgi
    desc: Ivanti public welcome CGI URL path
    if:
      type: literal
      exclude_docstrings: true
      regex: '/dana-na/auth/[^/\s"'']{1,80}/welcome\.cgi\b'
