defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, source, html, json]
traits:
  - id: api-entity-route
    desc: References an /_api/ entity route
    conf: 0.96
    if:
      type: text
      regex: '/_api/([A-Za-z][A-Za-z0-9_]*|\$\{[^}]{1,80}\})'
  # This route reference does not establish an HTTP request, SDK identity,
  # or a Chat operation.
  - id: stream-chat-api-v2-route-reference
    desc: References Stream Chat API v2 route
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: '/api/v2/chat/'
