defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
- id: external-ip-arch-payload-url-list
  desc: External IP multi-architecture payload URL list
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  any:
  - id: micro-behaviors/communications/url/host/http::payload-url-arm-family
  - id: micro-behaviors/communications/url/host/http::payload-url-mips-family
  - id: micro-behaviors/communications/url/host/http::payload-url-x86-family
  - id: micro-behaviors/communications/url/host/http::payload-url-misc-iot-family
  needs: 3
