defaults:
  platforms: [windows, unix]
  for: [html, text]

traits:
  - id: ring-named-offsite-path-link
    desc: HTTP link contains a ring-named path
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/tool/detection/malware-signature-table::antivirus-signature-database
      - id: metadata/file/format/structured::threat-indicator-data
    if:
      type: text
      regex: '(?i)href=.?https?://[a-z0-9.-]{1,80}/[^"''\s>]{0,40}\bring([/.]|doorbell)'
      exclude_html_comments: true
    not:
      - regex: '(?i)^href=.?https?://[^/]*ring\.com\b'

