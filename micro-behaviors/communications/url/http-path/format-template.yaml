# URL path templates filled in with printf-style formatting.
defaults:
  platforms: [windows, unix]
  for: [pe, dll, c, cpp, csharp]
traits:
  - id: api-path-printf-placeholder
    desc: /api/ URL path with a %s placeholder
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)/api/[^"''\s]{0,80}/%s|/%s[^"''\s]{0,80}/api/'
