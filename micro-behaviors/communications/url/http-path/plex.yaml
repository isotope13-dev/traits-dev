# Plex protocol paths are fixed application context, independent of client language.
defaults:
  for: [scripts, source, binaries, data, text]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: plex-timeline-subscribe-route
    desc: Plex timeline subscription route
    if:
      type: text
      substr: /player/timeline/subscribe
  - id: plex-loopback-agent-search-url
    desc: Loopback URL targets Plex agent search
    if:
      type: text
      regex: 'http://127\.0\.0\.1:[^/\s"'']{1,16}/system/agents/[^/?]{1,32}/searchOne'
  - id: plex-plugin-network-function-route
    desc: Plex plugin network-fetch function route
    if:
      type: text
      regex: 'com\.plexapp\.agents\.[\w.]+(/|%2[fF])function(/|%2[fF])GetResultFromNetwork'
  - id: plex-transcode-universal-route
    desc: Plex universal transcoder route
    if:
      type: text
      substr: /video/:/transcode/universal

