defaults:
  platforms: [windows, unix]
  for: [scripts, source]
traits:
  - id: bot-enrolment-path
    desc: Bot join or registration API path
    crit: notable
    conf: 0.9
    if:
      # The implant's first request: hand the controller this host's details
      # and be issued an identity.
      type: text
      regex: '(?i)/bots?/(join|register|checkin)(/|[\?"''`\s\)]|$)'
