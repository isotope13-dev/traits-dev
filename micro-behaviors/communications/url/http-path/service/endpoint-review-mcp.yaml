defaults:
  for: [scripts, source]
  platforms: [unix, windows]
traits:
  - id: mcp-connection-test-doc-range-url
    desc: Connection-test route on documentation IPv4
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'https?://(192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}(:\d+)?/mcp-rest/test/connection\b'
    not:
      - regex: '\.(25[6-9]|2[6-9][0-9]|[3-9][0-9]{2})(:|/)'
      - regex: ':(0+|6553[6-9]|655[4-9][0-9]|65[6-9][0-9]{2}|6[6-9][0-9]{3}|[7-9][0-9]{4}|[0-9]{6,})/'
