defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: crowd-administrator-group-membership-url
    desc: Crowd administrator-group membership URL
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      regex: '(?i)/usermanagement/\d+/group/user/direct\?groupname=(jira|confluence)-administrators$'
