defaults:
  platforms: [unix, windows]
  for: [javascript, crx, zip]

traits:
  - id: browser-anal-upload-path
    desc: Targets an /api/anal endpoint
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^https?://[^/]+/api/anal$'
