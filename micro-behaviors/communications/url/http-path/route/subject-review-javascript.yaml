defaults:
  platforms: [android, windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: fetch-encoded-log-path
    desc: Fetches encoded data to logging URL path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'fetch\s*\(\s*`https?://[^`]{0,160}/log(it|ger)?/[^`]{0,160}\$\{encodeURIComponent\('

  - id: unconditional-vlog-encoded-http-sink
    desc: Vlog directly calls fetch
    crit: notable
    conf: 0.94
    if:
      type: text
      # Requires fetch in the logger body itself, so an unrelated remote
      # request elsewhere cannot combine with a data-bearing logger call.
      regex: 'function\s+vlog\s*\([^)]{0,50}\).{0,30}\{.{0,180}?fetch\s*\('

  - id: remote-extension-catalog-url
    desc: Remote extension/shortcut listing URL path
    conf: 0.92
    if:
      type: text
      regex: 'https?://[A-Za-z0-9._:/-]{1,200}/(api/extensions(\.php)?|js/shortcuts\.json)'
      case_insensitive: true

