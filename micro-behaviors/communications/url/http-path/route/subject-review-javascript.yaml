defaults:
  platforms: [android, windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: fetch-encoded-log-path
    desc: Fetches encoded data to logging URL path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'fetch\s*\(\s*`https?://[^`]{0,160}/log(it|ger)?/[^`]{0,160}\$\{encodeURIComponent\('

  - id: unconditional-vlog-encoded-http-sink
    desc: Vlog fetches its encoded message
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((function_declaration
          name: (identifier) @name
          parameters: (formal_parameters . (identifier) @message .)
          body: (statement_block
            (try_statement body: (statement_block
              (expression_statement) @fetch))))
          (#eq? @name "vlog")
          (#eq? @message "msg")
          (#match? @fetch "^fetch\\s*\\([^}]{0,240}encodeURIComponent\\s*\\([^}]{0,120}\\bmsg\\b"))

  - id: remote-extension-catalog-url
    desc: Remote extension/shortcut listing URL path
    conf: 0.92
    if:
      type: text
      regex: 'https?://[A-Za-z0-9._:/-]{1,200}/(api/extensions(\.php)?|js/shortcuts\.json)'
      case_insensitive: true

