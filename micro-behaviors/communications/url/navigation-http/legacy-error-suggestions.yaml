defaults:
  platforms: [windows, unix]
  for: [javascript, xml, html]
traits:
  - id: toolbar-error-suggestions-enabled-config
    desc: Enables toolbar navigation-error suggestions
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'type:\s*"neterror",\s*attributes:\s*\{[^}]{0,800}"enabled":"true"'
