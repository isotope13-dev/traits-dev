defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - source
  - javascript
  - python
  - html
  - markdown
  - text

traits:
  - id: navigation-http-query-reference
    desc: Navigation-named call targets an HTTP query
    conf: 0.94
    if:
      type: text
      regex: '\b(navigate|open_url|openUrl)\s*\(\s*["'']https?://[^\r\n]{1,240}\?'




composite_rules:
  - id: navigation-query-serializer-context
    desc: Navigation query near a query serializer
    conf: 0.96
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/url/navigation-http::navigation-http-query-reference
    any:
      - id: micro-behaviors/communications/url/construction/query::query-serializer-call
      - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
