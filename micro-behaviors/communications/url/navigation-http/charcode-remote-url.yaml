# A `104#116#116#112#58#47#47` (`http://`) run inside a hash-delimited
# charcode blob means the concealed code references a remote address --
# usually the redirect or beacon destination the packed script sends the
# selected visitor to. Sibling atoms cover the referrer, engine-name, and
# location runs of the same packing idiom.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: charcode-concealed-remote-url
    desc: Charcode payload conceals remote URL
    if:
      type: text
      exclude_html_comments: true
      regex: '104#116#116#112#(115#)?58#47#47'
