# The current page's path or URL is tested for a checkout or payment step.
# Storefront code does this routinely (conversion tags, step-specific UI), so
# the gate is only a clue; composites supply what runs behind it. Kept apart
# from financial-page-gate, whose consumers treat any remote script behind the
# gate as hostile.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1185

traits:
  - id: location-checkout-method-test
    desc: Tests page location for a checkout path
    if:
      type: text
      regex: '(?i)location\.(pathname|href)\.\w{5,10}\(\s*["''`/][^"''`\n]{0,16}(checkout|payment|onepage)'

  - id: location-checkout-regex-test
    desc: Regex-tests page location for checkout path
    if:
      type: text
      regex: '(?i)/[^/\n]{0,30}(checkout|payment|onepage)[^/\n]{0,30}/i?\.test\(\s*(window\.)?location'

composite_rules:
  - id: checkout-path-gate
    desc: Checks for a payment-flow page
    crit: component
    any:
      - id: location-checkout-method-test
      - id: location-checkout-regex-test
      - id: location-indexof-financial-page
      - id: document-location-financial-page-alias
