# A PDF URI annotation is a document navigation capability. It is not process
# creation or code evaluation; intent comes from separate lure, download, or
# exploit context composites.
defaults:
  platforms: [windows, unix]
  for: [pdf]
  crit: notable
  conf: 0.94

traits:
  # Template sharing can act as a document-lure intermediary. The endpoint
  # alone is a neutral navigation capability, requiring downstream evidence
  # before assigning a hostile intent verdict.
  - id: pdf-forms-template-navigation
    desc: PDF opens Microsoft Forms shared template
    conf: 0.98
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)^https://forms\.(cloud\.microsoft|office\.com)/Pages/ShareFormPage\.aspx\?'
  - id: pdf-http-external-ip-uri
    desc: PDF URI action targets public IP
    conf: 0.94
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)^https?://(\d{1,3}\.){3}\d{1,3}([/:?#]|$)'
      not:
        - regex: '(?i)^https?://(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.)'
  - id: pdf-uri-index-php
    desc: PDF URI path is index.php
    conf: 0.9
    if:
      type: value
      path: pdf.actions[*].snippet
      regex: '(?i)/index\.php([?#]|$)'

composite_rules:
  - id: pdf-external-http-navigation
    desc: PDF link annotation opens HTTP(S) URL
    all:
      - id: metadata/document/pdf/action::pdf-link-annotation
      - id: metadata/document/pdf/action::pdf-action-uri
      - id: metadata/document/pdf/action::pdf-http-uri-action
