# macOS code reads the user's current browsing target by asking the browser
# over Apple Events. This is the idiom shared by employee-activity agents,
# adware attribution shims and macOS infostealers alike, so it is notable on
# its own; exfiltration intent comes from composites that pair it with a
# remote sink.
defaults:
  platforms: [macos]
  for: [macho, shell, applescript, c, objc, swift]
  attack: T1217

traits:
  - id: applescript-browser-active-tab-url
    desc: Reads a browser's active tab URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'get URL of (active|current) tab'
