defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: identified-page-referrer-access
    desc: "Page and referrer reads near identity"
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(userConfig|uid).{0,900}document\.referrer.{0,700}location\.href'
