defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1539
composite_rules:
- id: financial-page-gate
  desc: Financial-page location gate clues
  crit: component
  conf: 0.9
  any:
    - id: micro-behaviors/communications/url/navigation-http::location-indexof-financial-page
    - id: micro-behaviors/communications/url/navigation-http::document-location-financial-page-alias
    - id: micro-behaviors/communications/url/navigation-http::packed-financial-page-table
# Targeted injector: the script only fires on financial pages (location gate
# above) and pulls a remote script there. A generic loader has no page gate;
# a gated loader that only runs where money moves is a skimmer injector.
