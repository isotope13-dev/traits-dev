# Code that only proceeds when the visitor arrived with a referrer (and a
# page keyword): the usual gate of a search-traffic hijacker, which acts on
# visitors coming from a search engine and stays quiet for direct visits
# such as the site owner's.
traits:
  - id: nonempty-referrer-gate
    desc: Proceeds only when a referrer is present
    crit: notable
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '\w*referr?er\w*\s*!==?\s*null\s*&&\s*\w*referr?er\w*\s*!==?\s*'''''
