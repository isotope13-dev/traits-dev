defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.88

traits:
  # Call-site matching, not raw text: bundler libraries carry
  # `URL.createObjectURL(blob)` in JSDoc examples, and a text match turns
  # every bundle of them into an object-URL behavior.
  - id: browser-object-url
    desc: Browser creates an object URL
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: symbol
      kind: call
      substr: createObjectURL

  - id: browser-object-url-navigation
    desc: Navigates to a created browser object URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'URL\.createObjectURL\s*\([\s\S]{0,100}location\.assign\s*\('
