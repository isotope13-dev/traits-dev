# about:blank and blob are the two address-bar cloak schemes a tab launcher
# offers side by side. Naming them within a few characters is the mode pair;
# fetching and document.write of the chosen page is a separate objective.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.9

traits:
  - id: blank-and-blob-scheme-pair
    desc: Names about:blank beside blob
    if:
      type: text
      regex: 'about:blank.{0,16}\bblob\b|\bblob\b.{0,16}about:blank'
