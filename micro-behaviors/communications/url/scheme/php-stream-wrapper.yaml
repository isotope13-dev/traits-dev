defaults:
  platforms: [unix, windows]
  for: [php, shell, python, javascript, yaml, markdown, text]
  crit: notable
traits:
  - id: php-data-stream-base64-uri
    desc: PHP data:// Base64 stream-wrapper URI
    conf: 0.96
    if:
      type: text
      regex: 'data://(text|application)/[a-z0-9.+-]{1,32};base64,[A-Za-z0-9+/]{12,}={0,2}'
  - id: php-expect-stream-uri
    desc: PHP expect:// command stream-wrapper URI
    conf: 0.96
    if:
      type: text
      regex: 'expect://[A-Za-z0-9_./-]{2,64}'
