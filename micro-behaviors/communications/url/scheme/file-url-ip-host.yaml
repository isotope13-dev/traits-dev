# file://A.B.C.D/... names a remote machine by raw IP. On Windows it resolves
# as \\A.B.C.D\..., an SMB share, so opening it makes the client authenticate
# to that host.
traits:
  - id: file-url-raw-ip-host
    desc: File URL targets a raw IP host
    crit: suspicious
    conf: 0.93
    platforms: [windows, unix]
    for: [html]
    if:
      type: text
      regex: '(?i)file://\d{1,3}(\.\d{1,3}){3}/'
