defaults:
  platforms: [windows, unix]
  for:
    - rtf
  crit: suspicious

traits:
  - id: document-file-scheme-reference
    desc: 'File handler protocol detector: file://'
    if:
      type: text
      substr: file://
    conf: 0.85
    crit: notable
  - id: document-mhtml-scheme-reference
    desc: 'File handler protocol detector: mhtml:'
    if:
      type: text
      substr: 'mhtml:'
    conf: 0.85
    crit: notable
  - id: document-mk-scheme-reference
    desc: 'File handler protocol detector: mk:'
    if:
      type: text
      substr: 'mk:'
    conf: 0.85
    crit: notable
  - id: document-about-scheme-reference
    desc: 'File handler protocol detector: about:'
    if:
      type: text
      substr: 'about:'
    conf: 0.85
    crit: notable
  - id: document-data-scheme-reference
    desc: 'File handler protocol detector: data:'
    if:
      type: text
      substr: 'data:'
    conf: 0.85
    crit: notable
