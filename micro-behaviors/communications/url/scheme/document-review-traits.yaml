defaults:
  platforms: [windows, unix]
  for:
    - rtf
  crit: suspicious

traits:
  - id: document-file-scheme-reference
    desc: 'Document URL scheme reference: file://'
    if:
      type: text
      substr: file://
    conf: 0.85
    crit: notable
  - id: document-mhtml-scheme-reference
    desc: 'Document URL scheme reference: mhtml:'
    if:
      type: text
      substr: 'mhtml:'
    conf: 0.85
    crit: notable
  - id: document-mk-scheme-reference
    desc: 'Document URL scheme reference: mk:'
    if:
      type: text
      substr: 'mk:'
    conf: 0.85
    crit: notable
  - id: document-about-scheme-reference
    desc: 'Document URL scheme reference: about:'
    if:
      type: text
      substr: 'about:'
    conf: 0.85
    crit: notable
  - id: document-data-scheme-reference
    desc: 'Document URL scheme reference: data:'
    if:
      type: text
      substr: 'data:'
    conf: 0.85
    crit: notable
