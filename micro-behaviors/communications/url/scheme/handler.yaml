# Structure used by desktop custom-protocol handler URLs.
defaults:
  crit: notable
  conf: 0.96
  platforms: [linux, macos, windows]
  for: [scripts, source, html]

traits:
  - id: custom-uri-module-query
    desc: Custom URI carries module query
    if:
      type: text
      regex: '(?i)\b[a-z][a-z0-9+.-]{1,31}:[a-z_][a-z0-9_/-]{0,63}\?module='

  - id: uri-executable-module-query
    desc: URI module query names executable
    if:
      type: text
      regex: '(?i)[?&]module=[^&\s"''<>]{1,96}\.(exe|app|bin)\b'

  - id: uri-nested-url-argument
    desc: URI argument embeds navigation URL
    if:
      type: text
      regex: '(?i)[&](param|args?)=[^\s"''<>]{0,256}(-url(%3d|=)|https?(%25?3a|:))'

  - id: hcp-protocol-uri
    desc: Windows Help Center HCP protocol URI
    crit: notable
    conf: 0.96
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\bhcp://'

  - id: hcp-uplddrvinfo-file-query
    desc: Help Center uplddrvinfo file URI query
    crit: suspicious
    conf: 0.98
    platforms: [windows]
    attack: T1203
    if:
      type: text
      regex: '(?i)\bhcp://[^\r\n"''<>]{0,120}uplddrvinfo\.htm\?file://'
