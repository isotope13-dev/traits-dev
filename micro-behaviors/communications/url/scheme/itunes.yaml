defaults:
  platforms: [macos, ios, windows]
  for: [html]
  crit: notable
  conf: 0.96

traits:
  - id: itunes-anchor-uri
    desc: Anchor href uses the iTunes protocol
    if:
      type: text
      regex: '(?i)<a\s+href=["'']itunes:'
      exclude_html_comments: true
  - id: itunes-anchor-null-suffix
    desc: iTunes anchor has percent-encoded NUL suffix
    if:
      type: text
      regex: '(?i)<a\s+href=["'']itunes:[^\r\n]{0,100}%00'
      exclude_html_comments: true
