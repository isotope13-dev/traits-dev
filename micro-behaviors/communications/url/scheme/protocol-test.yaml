defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Either spelling selects by scheme: `=== 'https:' ? https : http` and
  # `=== 'http:' ? http : https` choose the same client. Matching only the
  # https spelling let carriers using the http test slip past
  # node-scheme-selected-http-client and everything built on it.
  - id: url-protocol-scheme-ternary-test
    desc: Tests URL.protocol scheme in a ternary
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.protocol\s*===\s*[''"]https?:[''"]\s*\?'

