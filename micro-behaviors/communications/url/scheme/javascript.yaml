# A document link whose href runs script that reassigns window.location.
# This is the bookmarklet idiom — a one-click navigation the user installs
# or clicks — and the common spelling of bookmarklet documentation on help
# pages. A runtime redirect assigns location from script flow instead, so
# affiliate-hijack and other redirect-hijack composites must not read this
# spelling as one.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: javascript-href-location-assignment
    desc: Link href script reassigns window.location
    conf: 0.85
    if:
      type: text
      regex: 'href\s*=\s*["''][^"'']{0,200}javascript:[^"'']{0,120}window\.location'
      case_insensitive: true
