# A quoted, complete protocol-relative URL ("//host.tld/"): the destination
# inherits the current page scheme. Browsers and redirect handlers treat it as
# an external absolute URL even though it does not start with a scheme.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, ruby, go]
  crit: notable

traits:
  - id: protocol-relative-url-literal
    desc: Quoted protocol-relative URL literal
    conf: 0.8
    if:
      type: text
      regex: '["'']//[a-z0-9][a-z0-9.-]{2,60}\.[a-z]{2,10}/?["'']'
