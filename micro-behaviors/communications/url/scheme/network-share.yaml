defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: smb-url-scheme
    desc: "References an smb:// URL"
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)smb://'
  - id: ldap-url-scheme
    desc: "References an ldap:// URL"
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)ldap://'
