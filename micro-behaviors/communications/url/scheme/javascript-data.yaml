defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
traits:
  - id: javascript-base64-data-url-text
    desc: References a Base64 JavaScript data URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'data:text/javascript;base64,[A-Za-z0-9+/]{32,}={0,2}'
  - id: javascript-data-url-text
    desc: References an inline JavaScript data URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'data:(text|application)/javascript,[^"`'']{16,}'
