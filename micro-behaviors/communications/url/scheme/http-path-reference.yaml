defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  # Exact observation moved from extension hidden-payload rules. An HTTP URL
  # reference alone establishes neither an extension nor payload loading.
  - id: plaintext-http-path-reference
    desc: Plaintext HTTP URL with path reference
    crit: notable
    if:
      type: text
      regex: '(?i)http://[a-z0-9.-]+/[^"''\s]{1,80}'
