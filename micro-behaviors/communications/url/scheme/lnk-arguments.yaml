defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:

  - id: lnk-https-scheme-argument
    desc: LNK arguments contain HTTPS scheme text
    crit: notable
    conf: 0.75
    if:
      type: value
      path: lnk.arguments
      substr: 'https://'

  - id: lnk-http-scheme-argument
    desc: LNK arguments contain HTTP scheme text
    crit: notable
    conf: 0.8
    if:
      type: value
      path: lnk.arguments
      substr: http://

composite_rules:
  # Consumers that need "a web URL is present" should reference this instead
  # of one scheme trait: staging shortcuts overwhelmingly use https, and an
  # http-only leg silently drops them.
  - id: lnk-web-scheme-argument
    desc: LNK arguments contain a web URL scheme
    crit: notable
    conf: 0.8
    any:
      - id: lnk-http-scheme-argument
      - id: lnk-https-scheme-argument
