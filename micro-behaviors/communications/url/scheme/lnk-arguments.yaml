defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:

  - id: lnk-https-scheme-argument
    desc: LNK arguments contain HTTPS scheme text
    crit: notable
    conf: 0.75
    if:
      type: value
      path: lnk.arguments
      substr: 'https://'

  - id: lnk-http-scheme-argument
    desc: LNK arguments contain HTTP scheme text
    crit: notable
    conf: 0.8
    if:
      type: value
      path: lnk.arguments
      substr: http://
