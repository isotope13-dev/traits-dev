defaults:
  platforms: [unix, windows]
  crit: notable
traits:
- id: wss-scheme
  desc: References an encrypted wss:// WebSocket URL
  crit: notable
  conf: 0.6
  # Node packages commonly embed their controller endpoint in bundled
  # JavaScript rather than a standalone script file.  The URL is still only
  # a communication capability; remote-agent intent belongs in composites.
  #
  # A URL needs a host: the scheme must be followed by something other than
  # whitespace or a sentence terminator. As a bare `substr: wss://` this also
  # matched prose, and because the `not:` filters below all need a host to
  # test, none of them could suppress it — a browser-automation extension
  # whose only WebSocket is `ws://127.0.0.1` earned two hostile findings off
  # one comment reading "Firefox's HTTPS-Only Mode upgrades ws://localhost to
  # wss:// (Bug 1670581)". Concatenated forms (`"wss://" + host`) keep
  # matching because the quote is not whitespace.
  #
  # The match deliberately runs to the end of the host so the `not:` filters
  # below still have a host to test — they are applied to the matched span,
  # so a pattern that stopped at the first host character would leave the
  # loopback and example.com carve-outs unable to fire.
  for: [scripts, binaries, javascript, typescript]
  if:
    type: text
    regex: 'wss://[^\s)\].,;!?][^\s''"`,;)\]}]{0,48}'
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
  not:
    - regex: '(?i)wss://([a-z0-9-]{1,63}\.)*example'
    - regex: (?i)wss://127.0.0.1
    - regex: (?i)wss://localhost
