# The `isolated-app://` origin scheme.  Chromium serves Isolated Web Apps from
# it, and only code running on such an origin may reach the privileged Direct
# Sockets and Controlled Frame APIs.  Naming the scheme is neutral on its own;
# objective composites decide intent.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
traits:
  - id: isolated-app-origin-scheme
    desc: isolated-app:// origin scheme reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'isolated-app://'
