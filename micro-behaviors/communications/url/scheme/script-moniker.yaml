defaults:
  platforms: [windows]
  for: [scripts, binaries]
traits:
  - id: script-moniker-url
    desc: 'String containing a script: URL moniker'
    crit: notable
    if:
      type: text
      # Require a word boundary so XSS fixtures like `javascript:http://…`
      # (which contain the substring `script:http://`) are not matched.
      regex: (?i)\bscript:https?://
    unless:
      - id: metadata/build/generated::generated-attack-map-context
