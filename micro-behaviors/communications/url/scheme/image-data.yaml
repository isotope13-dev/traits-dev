defaults:
  platforms: [unix, windows]
  for: [php, javascript, python, shell, powershell]
  size_max: 20000000

traits:
  - id: inline-image-data-uri-context
    desc: Contains an inline image data URI
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'data:image'
    unless:
      - id: metadata/package/repository::operato-package-context
