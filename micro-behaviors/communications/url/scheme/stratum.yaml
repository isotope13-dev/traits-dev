# These schemes identify URL syntax, not an observed TCP/TLS connection.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, binaries, json]

traits:
  - id: stratum-tcp-url
    desc: Stratum TCP URL scheme reference
    conf: 0.95
    if:
      type: text
      substr: stratum+tcp://
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - id: micro-behaviors/process/terminate/signal::procfs-miner-target-termination

  - id: stratum-ssl-url
    desc: Stratum TLS URL scheme reference
    conf: 0.95
    if:
      type: text
      substr: stratum+ssl://

