defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: sms-shortcode-message-uri
    desc: SMS URI uses shortcode message body
    crit: suspicious
    conf: 0.96
    for: [scripts, data, html]
    if:
      type: text
      regex: '(?i)\bsms:\s*[0-9]{4,8}(\?|&|&amp;)body=[a-z0-9%._~+-]{2,80}'

  # Apple Shortcuts app-invocation URL. `shortcuts://` and its deprecated
  # `workflow://` alias run a named shortcut/workflow; iOS treats both as a
  # trusted native handoff. Neutral on its own — apps legitimately launch
  # their own shortcuts — so intent lives in the composite.
  - id: apple-shortcuts-run-url
    desc: Apple Shortcuts run URL scheme
    conf: 0.92
    for: [scripts, data, html]
    if:
      type: text
      regex: '(?i)\b(shortcuts|workflow)://(x-callback-url/)?run-'

  # The x-callback-url error/success/cancel leg of a Shortcuts/workflow URL is
  # made to hand a URL-encoded tel:/facetime:/sms: scheme back to iOS. Because
  # the Shortcuts app performs the callback openURL itself, the browser's
  # call-initiation confirmation is never consulted (CVE-2026-13795 shape).
  - id: shortcuts-callback-to-dial-scheme
    desc: Shortcuts x-callback routes to a dial scheme
    crit: suspicious
    conf: 0.95
    for: [scripts, data, html]
    if:
      type: text
      regex: '(?i)x-(error|success|cancel)=(tel|facetime|sms)%3a'

  - id: android-view-intent-action
    desc: References Android VIEW intent action
    if:
      type: literal
      substr: "android.intent.action.VIEW"

  - id: android-deeplink-rewriter
    desc: Rewrites Android deep links
    if:
      type: symbol
      exact: applyAndroidDeepLinks

  - id: ios-deeplink-rewriter
    desc: Rewrites iOS deep links
    if:
      type: symbol
      exact: applyIosDeepLinks

composite_rules:
  - id: mobile-deeplink-config-rewrite
    desc: Rewrites mobile deep-link configuration
    crit: notable
    conf: 0.92
    needs: 3
    any:
      - id: metadata/file/policy/config/deeplink::android-autoverify-link
      - id: android-view-intent-action
      - id: android-deeplink-rewriter
      - id: metadata/file/policy/config/deeplink::apple-associated-domains
      - id: ios-deeplink-rewriter
      - id: metadata/file/policy/config/deeplink::ios-url-types-config
