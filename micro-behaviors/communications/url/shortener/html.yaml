# HTML attributes are text facts rather than parser-extracted string literals.
# A shortened URL alone establishes neither a malicious destination nor theft.
defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: html-bitly-url
    desc: HTML references bit.ly shortened URL
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(https?://|//)bit\.ly/[A-Za-z0-9_-]{2,}'
