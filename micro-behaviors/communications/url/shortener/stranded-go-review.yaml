# Observations retained with their supported subject and scope.
traits:
- platforms:
  - unix
  - windows
  for:
  - json
  id: json-shortener-url-text
  desc: JSON text references a URL shortener
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: https?://[^"\n]{0,60}(short\.gy|bit\.ly|tinyurl\.com)
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
