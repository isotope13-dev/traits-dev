defaults:
  platforms: [windows, unix]
  for: [batch, powershell, shell]
traits:
  - id: curl-shortener-url-command-text
    desc: Curl command names a shortened URL
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule curl_shortened_url_argument {
          strings:
            $cmd = /curl(\.exe)? [^;\r\n|&]{0,80}https?:\/\/(tinyurl\.com|bit\.ly|t\.co)\/[A-Za-z0-9_-]{2,32}([; \r\n]|$)/ nocase
          condition:
            $cmd
        }
