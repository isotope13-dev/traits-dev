traits:
- id: youlink-shortener-host
  desc: References youlink.biz
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z0-9.-])(www\.)?youlink\.biz([^A-Za-z0-9.-]|$)'
- id: cuttly-shortener-host
  desc: References cutt.ly
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z0-9.-])(www\.)?cutt\.ly([^A-Za-z0-9.-]|$)'
- id: bitly-shortener-host
  desc: References bit.ly
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z0-9.-])(www\.)?bit\.ly([^A-Za-z0-9.-]|$)'
- id: tinyurl-shortener-host
  desc: References tinyurl.com
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z0-9.-])(www\.)?tinyurl\.com([^A-Za-z0-9.-]|$)'
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.92
