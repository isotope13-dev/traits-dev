# Neutral query-building mechanics used by model navigation tools. Attack
# intent comes from objective composites that bind the query to sensitive data.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [source, javascript, python, html, markdown, text]

traits:
  - id: agent-navigation-http-query
    desc: Agent navigation call targets HTTP query
    conf: 0.94
    if:
      type: text
      regex: '\b(navigate|open_url|openUrl)\s*\(\s*["'']https?://[^\r\n]{1,240}\?'

  - id: query-serializer-call
    desc: Calls Python urlencode query serializer
    conf: 0.9
    # Python urlencode serializes key/value pairs. PHP's namesake encodes
    # one string; its canonical observation is data/encode/url::urlencode-call.
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)urlencode$'

composite_rules:
  - id: agent-navigation-query-call
    desc: Agent navigation builds an HTTP query
    conf: 0.96
    near_bytes: 600
    all:
      - id: agent-navigation-http-query
    any:
      - id: query-serializer-call
      - id: js-urlsearchparams-construction
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
