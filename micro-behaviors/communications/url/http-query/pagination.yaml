# URL query evidence only; a page-size parameter does not prove page traversal.
traits:
- id: per-page-query-parameter
  desc: HTTP URL per-page count
  platforms: [unix, windows]
  for: [scripts, source, binaries, github-actions]
  crit: component
  conf: 0.9
  if:
    type: text
    regex: 'https?://[^\s"''`]{1,256}[?&]per_page=[1-9][0-9]*\b'
