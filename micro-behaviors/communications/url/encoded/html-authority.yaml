defaults:
  for: [html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.97
traits:
  - id: html-href-percent-encoded-authority
    desc: HTML href has percent-encoded authority bytes
    if:
      # Raw bytes preserve escapes that the text extractor URL-decodes.
      type: raw
      offset_range: [0, null]
      regex: '(?i)\bhref\s*=\s*["'']https?://(%[0-9a-f]{2}){4,}'
