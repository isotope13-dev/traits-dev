# Encoded payload literals carried in YAML request definitions. Recorded HTTP
# cassettes and fixtures also carry data URIs, so these stay notable; the
# Nuclei template composite supplies scanner context.
defaults:
  platforms: [unix, windows]
  for: [yaml]
  crit: notable
  conf: 0.9

traits:
  - id: yaml-base64-data-uri-literal
    desc: YAML carries a long base64 data URI
    if:
      type: text
      regex: ';base64,[A-Za-z0-9+/_-]{32,}={0,2}'

  - id: yaml-url-encoded-php-open-tag
    desc: YAML carries URL-encoded PHP open tag
    if:
      type: text
      regex: '(?i)%3c%3fphp'
