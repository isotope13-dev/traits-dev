# A whole string literal that is an http(s) URL, either plain or as the
# base64 of one; for escaped tables this is the decoded literal value.
traits:
  - id: string-literal-http-or-base64-url
    desc: String literal is plain or base64 URL
    crit: component
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: literal
      kind: string
      regex: '^(https?://|aHR0cHM6Ly|aHR0cDovL)[^\s"'']{6,400}$'
