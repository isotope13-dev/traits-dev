defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - shell
  - elf
  - macho
  - pe
  - javascript
  - typescript
  crit: notable
  conf: 0.9

traits:
  - id: base64-decoded-http-url
    for: [python, shell, elf, macho, pe, javascript, typescript, html, text]
    desc: HTTP URL recovered from Base64 content
    if:
      type: encoded
      encoding: base64
      regex: "https?://[a-zA-Z0-9.-]+\\.[a-z]{2,}"
    not:
      - substr: '"file":"polyglot-no'
      # SVG resize handles commonly embed the W3C namespace in a base64 data
      # URI. That namespace is a benign decoded URL, not an HTTP endpoint.
      - substr: w3.org
      # The exclusion filter also sees the encoded carrier in some extractors.
      - substr: aHR0cDovL3d3dy53My5vcmc
      - substr: apple.com
      - substr: digicert.com
      - substr: entrust.net
      - substr: globalsign.com
      - substr: sectigo.com
      - substr: pki.goog
      - substr: microsoft.com
      - regex: 'crl\.|ocsp\.'
    unless:
      - id: metadata/signed/platform/
      # URLs in inline source-map sourcesContent are build metadata, not
      # endpoints used by the shipped JavaScript.
      - id: metadata/file/format/source-map::sourcemap-context
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-http-url-referrer-param
      - id: metadata/binary/section/name::bun-section-name
      - id: metadata/binary/section/name::bun-macho-section-name
      # Generated browser bundles routinely carry base64 SVG data URLs. A
      # decoded URL in that context is weak evidence; objective rules need a
      # stronger endpoint or payload signal before escalating it.
      - id: metadata/build/minifier::js-large-minified-bundle
      # Inline base64 SVG assets decode to markup whose XML namespace is an
      # http URL by specification, not an endpoint the code contacts.
      - id: micro-behaviors/communications/url/encoded::inline-svg-data-uri-context

  # Hostnames need a dot-tld; a literal IPv4 has none, so the sibling
  # hostname rule never sees `http://203.0.113.5:8080/...` inside a blob.
  - id: base64-decoded-ipv4-http-url
    desc: IPv4 HTTP URL recovered from Base64
    if:
      type: encoded
      encoding: base64
      regex: 'https?://(\d{1,3}\.){3}\d{1,3}'
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/format/source-map::sourcemap-context
      - id: metadata/build/minifier::js-large-minified-bundle
