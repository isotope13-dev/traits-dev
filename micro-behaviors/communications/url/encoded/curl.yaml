# Encoding and transport settings do not establish a command channel.
# These capability combinations also occur in insecure license/updater clients.
defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: encoded-url-curl-tls-bypass
    desc: cURL transfer with encoded URL and TLS checks disabled
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/encoded::encoded-https-url
      - id: micro-behaviors/communications/http/curl::ssl-verify-disable
      - id: micro-behaviors/communications/http/curl::exec-symbol
    near_bytes: 4096

  - id: decoded-url-curl-transfer
    desc: Decoded URL fed into CURLOPT_URL
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/url/encoded::encoded-https-url
      - id: micro-behaviors/communications/http/curl::url-from-decoder
      - id: micro-behaviors/communications/http/curl::exec-symbol
    near_bytes: 4096

  - id: curl-url-method-with-class-decoder
    desc: cURL URL method co-occurs with class base64 decoder
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/data/decode/base64::const-decoder-self
      - id: micro-behaviors/communications/http/curl::url-from-method-call
      - id: micro-behaviors/communications/http/curl::exec-symbol
    near_bytes: 4096
