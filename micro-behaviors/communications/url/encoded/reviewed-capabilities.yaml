traits:
- platforms:
  - unix
  - windows
  for:
  - dll
  id: binary-base64-http-url
  desc: Binary contains a Base64-encoded HTTP(S) URL
  crit: notable
  conf: 0.85
  if:
    type: encoded
    encoding: base64
    regex: https?://[A-Za-z0-9._:\-]{2,253}(/|$)
  not:
  - regex: https?://schemas\.(microsoft|xmlsoap|openxmlformats)
  - regex: https?://www\.w3\.org/
