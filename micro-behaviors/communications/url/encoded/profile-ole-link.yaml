---
defaults:
  platforms:
  - windows
  for:
  - oledoc
traits:
- id: wide-base64-php-path
  desc: UTF-16 base64-like PHP path
  crit: notable
  conf: 0.99
  if:
    type: raw
    regex: "/\\x00([A-Za-z0-9+/]\\x00){32,256}\\.\\x00p\\x00h\\x00p\\x00"
    case_insensitive: true
composite_rules:
- id: wide-numeric-host-base64-php-url
  desc: Numeric-host URL near base64-like PHP path
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/communications/url/host/http::wide-http-numeric-host-url
  - id: micro-behaviors/communications/url/encoded::wide-base64-php-path
  near_bytes: 700
