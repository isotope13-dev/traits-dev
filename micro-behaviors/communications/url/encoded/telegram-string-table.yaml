# Lower-first Base64 encodings of i.telegram, .org/bot and sendDocume.
# Parsed literals handle both plain and ASCII-escaped string-table entries.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: lower-first-telegram-host-fragment
  desc: Encoded Telegram API hostname fragment
  crit: notable
  conf: 0.98
  if:
    type: literal
    exact: As50zwXLz3jHBq

- id: lower-first-telegram-bot-path-fragment
  desc: Encoded Telegram Bot API path fragment
  crit: notable
  conf: 0.98
  if:
    type: literal
    exact: lM9YzY9IB3q

- id: lower-first-send-document-fragment
  desc: Encoded sendDocument method fragment
  crit: notable
  conf: 0.96
  if:
    type: literal
    exact: C2vUzerVy3vTzq

composite_rules:
- id: lower-first-telegram-document-api-fragments
  desc: Lower-first Base64 table contains Telegram document API fragments
  crit: notable
  conf: 0.98
  all:
  - id: lower-first-telegram-host-fragment
  - id: lower-first-telegram-bot-path-fragment
  - id: lower-first-send-document-fragment
  - id: micro-behaviors/data/encoding/base64::lower-first-base64-alphabet

