# LinkedIn's own internal web API (voyager). Requests here are first-party
# calls to LinkedIn, so they carry the signed-in user's cookies by design. The
# URL establishes the destination, not any use of the cookies.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: linkedin-voyager-api-url
    desc: LinkedIn internal voyager API URL
    if:
      type: text
      substr: linkedin.com/voyager/
