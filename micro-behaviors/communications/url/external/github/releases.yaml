defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, rust, python, source]
  attack: T1105
traits:
  - id: github-release-download
    desc: GitHub release asset URL template
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: github\.com/[A-Za-z0-9._${}/:-]+/releases/download/
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/build/docker::buildkit-dockerfile-frontend
      - id: metadata/package/testing/harness/runtime/
  - id: github-release-7z-archive-download
    desc: GitHub release 7-Zip archive URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'github\.com/.{0,96}/releases/download/.{0,120}\.7z\b'
      case_insensitive: true
    unless:
      - id: metadata/package/testing/harness/runtime/
  # The executable/installer flavor of a release download: the asset is a
  # program, not a source tarball. Common and legitimate in CI and Dockerfiles
  # (bazelisk, goreleaser binaries), which is why it is a neutral capability
  # here; supply-chain composites (agent skills, install hooks) reference it
  # and supply the delivery context.
  - id: github-release-executable-download
    desc: GitHub release executable or installer asset URL
    crit: notable
    conf: 0.9
    for: [markdown, text, shell]
    if:
      type: text
      regex: '(?i)github\.com/[\w.-]+/[\w.-]+/releases/download/[^\s)\]]{0,80}\.(exe|zip|dmg|apk)'
  - id: github-release-7zr-asset-download
    desc: GitHub release 7zr executable asset URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'github\.com/.{0,96}/releases/download/.{0,96}/7zr\.exe\b'
      case_insensitive: true
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: github-release-api-latest
    desc: GitHub latest release API template
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: api\.github\.com/repos/[A-Za-z0-9._${}/:%-]+/releases/latest
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: github-raw-file-url
    desc: References a GitHub raw file URL
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'github\.com/[A-Za-z0-9._${}-]+/[A-Za-z0-9._${}-]+/raw/'
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: github-archive-ref-download
    desc: References a GitHub branch or tag archive
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/archive/refs/(tags|heads)/
    unless:
      - id: metadata/package/testing/harness/runtime/
