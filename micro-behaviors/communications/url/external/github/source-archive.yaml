# A GitHub repository source archive. The path names the archive of a branch or
# tag. It says nothing about the bytes returned; it is a link to the source.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [documents, scripts, source]

traits:
  # Relative form too: a repository page embeds its own archive path in a JSON
  # field (`"zipballUrl":"/owner/repo/archive/refs/heads/main.zip"`).
  - id: github-source-archive-zip
    desc: GitHub repository source archive ZIP link
    conf: 0.85
    if:
      type: text
      regex: '/[\w.-]{1,39}/[\w.-]{1,100}/archive/refs/(heads|tags)/[\w./-]{1,80}\.zip'
