defaults:
  platforms: [windows, linux, macos]
  for: [binaries, scripts, github-actions]
  size_max: 524288000
traits:
  - id: frp-repo-reference
    desc: FRP GitHub repository reference
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'github\.com/fatedier/frp(/|$)'
  - id: frp-release-download-url
    desc: FRP GitHub release download URL
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: github.com/fatedier/frp/releases/download
