defaults:
  platforms: [unix, windows]
  for: [markdown]

traits:

  - id: github-release-zip-link
    desc: Markdown references a GitHub release ZIP
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/.{1,80}\.zip\b'

