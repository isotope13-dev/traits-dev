defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents
traits:
- id: gcs-url
  desc: Google Cloud Storage URL
  if:
    type: text
    regex: https?://storage\.googleapis\.com/[a-z0-9-_]+(/|["']|$)
- id: gcs-json-api-upload-endpoint
  desc: Google Cloud Storage JSON API upload endpoint
  if:
    type: text
    substr: storage.googleapis.com/upload/storage/v1/b/
