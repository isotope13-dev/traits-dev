defaults:
  crit: notable
  platforms:
    - unix
    - windows
traits:
  - for:
      - scripts
      - source
      - javascript
      - typescript
    id: message-item-route
    desc: Message item path fragment
    if:
      type: text
      regex: (^|["'`\s])(https?://[^/\s"']{1,253})?/messages/
