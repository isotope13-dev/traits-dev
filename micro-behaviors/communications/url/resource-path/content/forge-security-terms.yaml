# Neutral evidence; intent requires additional context.
traits:
- id: forge-security-term-url
  desc: Repository URL mentions CVE/exploit/PoC
  crit: notable
  conf: 0.9
  for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - go
  - rust
  - java
  - json
  platforms:
  - windows
  - unix
  if:
    regex: (?i)(github|gitlab)\.com/.{0,120}\b(CVE|exploit|poc)\b
    type: string_literal
