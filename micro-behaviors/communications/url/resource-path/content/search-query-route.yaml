# Generic content-search route and wildcard query-string selector used by REST
# search APIs such as Microsoft Graph (/v1.0/search/query). Service context and
# collection behavior are established by downstream composites.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable

traits:
  - id: search-query-path
    desc: Search query API route fragment
    conf: 0.84
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(/v1\.0|/beta|^|["''`\}])/search/query(["''`?\s]|$)'

  - id: wildcard-querystring-selector
    desc: Wildcard queryString search selector
    conf: 0.9
    for: [scripts, source, binaries, json]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)["'']?queryString["'']?\s*[:=]\s*["'']\*["'']'
