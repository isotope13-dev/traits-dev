defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: exam-route-literal
    desc: References an exam URL path
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '/(stall)?exam[a-zA-Z0-9_.-]{0,48}'
    not:
      # https://example.com contains //exam... but names no exam route.
      - regex: '^/exampl'
