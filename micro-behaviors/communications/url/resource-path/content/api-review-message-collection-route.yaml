defaults:
  crit: notable
  platforms:
    - unix
    - windows
traits:
  - for:
      - scripts
      - source
      - binaries
      - javascript
      - typescript
    id: message-collection-route
    desc: Message collection path fragment
    if:
      type: text
      regex: (^|["'`\s])(https?://[^/\s"']{1,253})?/messages\b
