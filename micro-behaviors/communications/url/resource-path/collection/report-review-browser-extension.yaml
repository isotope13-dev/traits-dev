defaults:
  platforms: [unix, windows]
  for: [javascript, crx, zip]

traits:
  - id: browser-anal-endpoint-url
    desc: URL uses an /api/anal endpoint
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^https?://[^/]+/api/anal$'
