defaults:
  platforms: [unix, windows, network-appliance]
  for: [lua]

traits:
  - id: lua-http-exfil-path-atom
    desc: Lua text mentions an exfil route
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: /exfil

  # Component, not suspicious: the matcher is a bare URL-path substring, which
  # is the textbook `component` case in TAXONOMY.md -- it acquires meaning only
  # beside a C2 host or an exec sink. `/gate` alone matches "/gateway" in Kong,
  # an API gateway, and `/register` matches every routing table in every Lua web
  # framework. `lua-http-exfil-path` below is where they combine.
  - id: lua-http-ingest-path-atom
    desc: Lua text mentions an ingest route
    crit: notable
    conf: 0.82
    if:
      type: text
      substr: /ingest
  - id: lua-http-gate-path-atom
    desc: Lua text mentions a gate route
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /gate
  - id: lua-http-register-path-atom
    desc: Lua text mentions a registration route
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /register
  - id: lua-http-commands-path-atom
    desc: Lua text mentions a commands route
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /commands
  - id: lua-ransom-complete-route-reference
    desc: Lua text mentions a ransom completion route
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /ransom-complete
