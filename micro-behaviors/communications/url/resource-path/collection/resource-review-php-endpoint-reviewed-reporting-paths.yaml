# Generic script paths do not establish contact, collection or C2.
defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf, macho, xml]
traits:
- id: php-collect-script-path
  desc: References a PHP collect script path
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: /collect[_-]?(info|data|stats)?\.php
- id: php-beacon-script-path
  desc: References a PHP beacon script path
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: /beacon.php
composite_rules:
- id: php-reporting-script-reference
  desc: References PHP reporting or gateway scripts
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/communications/url/resource-path/collection::php-collect-script-path
  - id: micro-behaviors/communications/url/resource-path/collection::php-log-script-path
  - id: micro-behaviors/communications/url/resource-path/file::php-report-script-path
  - id: micro-behaviors/communications/url/resource-path/collection::php-beacon-script-path
  - id: micro-behaviors/communications/url/resource-path/administration::php-gate-path
