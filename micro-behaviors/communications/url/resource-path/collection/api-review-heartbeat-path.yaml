defaults:
  platforms: [openwrt]
  for: [javascript, typescript]
traits:
  - id: node-heartbeat-path
    desc: Heartbeat name or path text
    crit: notable
    conf: 0.86
    if:
      type: text
      # Require a quoted URL path so module imports like
      # `../services/telemetry.service` do not count as C2 routes.
      regex: 'heartbeatPath|["''`]/(heartbeat|telemetry)(["''`?/#]|$)'

