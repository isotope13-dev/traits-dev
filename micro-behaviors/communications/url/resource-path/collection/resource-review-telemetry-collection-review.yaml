defaults:
  platforms: [windows, unix]
  for: [python, javascript, php, ruby, go, java, elf, macho]
  attack: T1071.001
traits:
  - id: history-endpoint-path
    desc: /history REST endpoint path
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      exact: '/history'
  - id: collect-path
    desc: Collection endpoint path
    crit: notable
    conf: 0.74
    if:
      type: literal
      exact: /collect
  - id: swift-collect-endpoint-literal
    desc: Swift collection endpoint literal
    crit: notable
    conf: 0.9
    for: [swift]
    if:
      type: literal
      kind: string
      regex: '/collect(/|[?#]|$)'
  - id: jvm-collect-path
    desc: JVM collection endpoint path
    crit: notable
    conf: 0.86
    for: [class]
    if:
      type: literal
      kind: string
      regex: '^/collect(/|[?#]|$)'
  - id: native-http-collect-path
    desc: Native HTTP collect path
    crit: notable
    conf: 0.86
    for: [c, cpp, objc, rust, elf, macho]
    if:
      type: text
      regex: '/collect(\?|["''\s]|/clipboard)'
