defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: http-result-endpoint
    desc: HTTP URL uses a top-level result endpoint
    crit: notable
    conf: 0.88
    if:
      type: literal
      regex: "https?://[^\\s\"/]{1,120}/result([\"'?&\\s]|$)"
    unless:
      - id: metadata/document/html/structure::html-root-at-start
