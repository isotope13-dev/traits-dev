defaults:
  platforms: [unix, windows]
  # Groups (not explicit types) so archive-scope composites can pool this
  # with manifest legs the way the discord webhook atoms do. No binaries:
  # the text-matcher file-type cap is 33.
  for: [scripts, source]
  crit: notable
  conf: 0.88
traits:
  # A letters-only segment names a directory and a class, not a receiver token:
  # ./events/EventClasses or ./upload/FileUploadHandler. The exception keeps
  # only segments that carry a digit, which generated tokens nearly always do.
  # Trailing word/path chars keep hyphenated or dotted source paths whole so
  # `not:` can exclude them.
  - id: receiver-style-long-segment-a
    desc: Intake or upload path has long segment
    if:
      type: text
      regex: '/(intake|ingest|collect|upload)/[A-Za-z0-9]{12,}[-.\w]*'
    not:
      - regex: '[-_.]'
      - regex: '^/(intake|ingest|collect|upload)/[A-Za-z]+$'
  - id: receiver-style-long-segment-b
    desc: Submit or events path has long segment
    if:
      type: text
      regex: '/(submit|inbox|drop|events?)/[A-Za-z0-9]{12,}[-.\w]*'
    not:
      - regex: '[-_.]'
      - regex: '^/(submit|inbox|drop|events?)/[A-Za-z]+$'
composite_rules:
  - id: receiver-style-long-segment
    desc: Receiver-style URL path has a long segment
    any:
      - id: receiver-style-long-segment-a
      - id: receiver-style-long-segment-b
