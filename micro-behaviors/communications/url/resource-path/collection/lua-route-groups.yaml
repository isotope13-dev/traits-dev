defaults:
  platforms: [unix, windows, network-appliance]
  for: [lua]

composite_rules:
  - id: lua-control-route-reference
    desc: Lua text mentions a collection or control route
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/communications/url/resource-path/collection::lua-http-exfil-path-atom
      - id: micro-behaviors/communications/url/resource-path/collection::lua-http-ingest-path-atom
      - id: micro-behaviors/communications/url/resource-path/collection::lua-http-gate-path-atom
      - id: micro-behaviors/communications/url/resource-path/collection::lua-http-register-path-atom
      - id: micro-behaviors/communications/url/resource-path/collection::lua-http-commands-path-atom

  # Notable, not suspicious. A bare `any:` over eight path *names* -- naming
  # /etc/passwd or authorized_keys is not reading one, and the legs are all
  # component/notable path atoms. Neovim's runtime/lua/vim/filetype.lua is a
  # table mapping filenames to filetypes, so it names every one of them by
  # design; Kong's terraform perf driver and luarocks match the same way. The
  # two composites below that consume this still pair it with an exfil path or
  # a C2 host, which is where the backdoor claim belongs.
