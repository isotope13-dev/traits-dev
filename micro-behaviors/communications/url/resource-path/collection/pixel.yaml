# A Brotli dictionary embeds "Harvard/pixel.removalso...". A substring in
# that word corpus is not a URI, and this ordinary endpoint is not a family ID.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
traits:
  - id: pixel-endpoint-path
    desc: Pixel endpoint path reference
    crit: notable
    conf: 0.95
    size_min: 512
    size_max: 500000000
    if:
      type: text
      regex: '^(https?://[^ /]{1,80})?/pixel'
      section: .text
