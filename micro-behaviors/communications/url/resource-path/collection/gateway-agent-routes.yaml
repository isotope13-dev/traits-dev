# An agent-lifecycle route set under one gateway/ prefix: register a host,
# poll for work, return results. Neutral on its own; C2 rules supply the
# tasking and execution that make it an implant's protocol.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  crit: component
  conf: 0.9
traits:
  - id: gateway-register-route
    desc: gateway/register route literal
    if: {type: text, substr: gateway/register}
  - id: gateway-report-route
    desc: gateway/report route literal
    if: {type: text, substr: gateway/report}
  - id: gateway-task-route
    desc: gateway/task route literal
    if: {type: text, substr: gateway/task}
composite_rules:
  - id: gateway-register-report-task-routes
    desc: gateway/ register, report and task routes
    crit: notable
    near_bytes: 2048
    all:
      - id: gateway-register-route
      - id: gateway-report-route
      - id: gateway-task-route
