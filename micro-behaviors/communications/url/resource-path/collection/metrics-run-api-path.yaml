defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: metrics-run-api-path
    desc: Metrics run API endpoint path
    crit: notable
    conf: 0.9
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)/api/metrics/run\b'
