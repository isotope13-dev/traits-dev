# Upload routes for precise location and device profiles. Each route is a
# notable capability found in legitimate apps; exfiltration is inferred
# only when objectives combine a route with the matching sensitive
# payload source and an operator-controlled resolution chain.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  crit: notable
  conf: 0.88
  mbc: C0002

traits:
  - id: geo-location-upload-path
    desc: HTTP path uploads precise geolocation
    if:
      type: text
      regex: '(?i)/(loc/geo-?location|geo-?location|location/(report|upload))\b'
      exclude_comments: true

  - id: device-info-upload-path
    desc: HTTP path uploads a device profile
    if:
      type: text
      regex: '(?i)/((app/)?device/(info/)?upload|device[._/-]?(info|profile)/upload)([/?"''\s]|$)'
      exclude_comments: true
