defaults:
  crit: notable
  conf: 0.94
  platforms: [unix, windows]
  for: [go]
traits:
  - id: snapshot-cgi-reference
    desc: snapshot.cgi resource reference
    if:
      type: literal
      kind: string
      substr: snapshot.cgi
  - id: cgi-management-path
    desc: CGI management resource path
    if:
      type: literal
      kind: string
      regex: '/cgi-bin/(configManager|userManager|magicBox|devicemanager)\.cgi'
