# Raw XOR-23 hex text of a quoted http(s) URL ending in .exe, for multi-line
# payloads whose decoded bytes the hex decoder rejects. No host is required.
defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.94
traits:
- id: xor23-hex-text-http-executable-url
  desc: HTTP .exe URL as XOR-23 hex text
  if:
    type: text
    regex: (?i)[57]F[46]3[46]3[46]7([46]4)?2D3838(..){4,200}?39[57]2[46]F[57]235
