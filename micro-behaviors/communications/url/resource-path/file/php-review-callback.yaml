defaults:
  for: [scripts, manifests]
  platforms: [unix, windows]
traits:
  - id: php-callback-path-url
    desc: HTTP URL references a PHP callback path
    crit: notable
    conf: 0.92
    for: [scripts, source, package.json, javascript, typescript]
    if:
      type: text
      regex: 'https?://[^"''\s]{3,120}/callback\.php/[A-Fa-f0-9]{16,64}\b'
