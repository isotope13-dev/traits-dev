# A literal HTTP(S) URL whose path ends in .hta (an HTML Application document).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, powershell, batch, vbs, scripts]
  crit: notable
  attack: T1105

traits:
  - id: hta-document-url-literal
    desc: Literal HTTP(S) URL ending in .hta
    conf: 0.9
    if:
      type: text
      regex: (?i)https?://[^\s'"`<>]{1,200}\.hta\b
