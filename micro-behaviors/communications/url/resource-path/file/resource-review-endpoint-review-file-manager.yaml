defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1071.001
  mbc: C0002
  crit: component
  conf: 0.86
traits:
  - id: rest-file-mutation-endpoints--single
    desc: File mutation path reference
    crit: notable
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    if:
      type: text
      regex: '/(files|tree)/(rename|move|copy)'
  - id: rest-file-mutation-endpoints--bulk
    desc: Bulk file mutation path reference
    crit: notable
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    if:
      type: text
      regex: '/bulk/(copy|delete|move)/files\b'
  - id: rest-archive-file-endpoints
    crit: notable
    desc: Archive file path reference
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    if:
      type: text
      regex: '/zip/(directory|files)\b'
composite_rules:
  - id: micro-behaviors/communications/url/resource-path/file::rest-file-mutation-endpoints
    desc: File mutation path references
    crit: component
    conf: 0.86
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    any:
      - id: micro-behaviors/communications/url/resource-path/file::rest-file-mutation-endpoints--single
      - id: micro-behaviors/communications/url/resource-path/file::rest-file-mutation-endpoints--bulk
