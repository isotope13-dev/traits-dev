defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.88
traits:
  - id: remote-tgz-url
    desc: HTTP URL for a remote tarball
    if:
      type: text
      regex: 'https?://.{0,80}\.tgz'

  - id: archive-file-url
    desc: URL names archive, disk image, or executable
    for: [html]
    if:
      type: text
      # The extension must end the URL or hit a query, fragment, quote, or
      # whitespace: otherwise zip.net-style hosts (youtubi.zip.net/watch.html)
      # match on a domain label that is not a file at all.
      regex: '(?i)https?://[^\s"''<>]{4,200}\.(zip|rar|7z|iso|exe|scr)([?#\"''\s<>]|$)'
