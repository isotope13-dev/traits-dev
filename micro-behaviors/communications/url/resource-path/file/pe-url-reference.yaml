defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
traits:
- id: pe-http-zip-url-text
  desc: PE HTTP ZIP URL text
  conf: 0.88
  if:
    type: text
    regex: (?i)^https?://[^\s]{4,220}\.zip$
- id: pe-application-setup-update-zip-url-text
  desc: PE application or update ZIP URL text
  conf: 0.84
  if:
    type: text
    regex: (?i)^https?://.{0,180}(application|setup|update).{0,180}\.zip$
- id: pe-http-png-url-text
  desc: PE HTTP PNG URL text
  conf: 0.78
  if:
    type: text
    regex: (?i)^https?://[^\s]{4,220}\.png$
