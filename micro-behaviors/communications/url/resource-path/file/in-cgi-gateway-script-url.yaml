defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: in-cgi-query-url
    desc: in.cgi URL with query string
    crit: notable
    conf: 0.93
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: 'https?://[^''">\s\\]{1,120}/in\.cgi\?[A-Za-z0-9_%.=-]{1,64}'
