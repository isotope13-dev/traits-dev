defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: external-ip-info-txt-url
    desc: External IP-pinned info.txt URL
    crit: notable
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{2,5}/[^\s''"]{0,120}info\.txt'
      is: external_ip
