# Rotation-URL shape: traffic-distribution and click-fraud kits address
# their payloads as bare numeric documents at the host root
# (`http://host/83122.html`). Legitimate embeds carry application paths,
# query strings, or slugs; a bare digits-only document name is the kit
# rotation idiom. The matcher only records the shape; intent comes from the
# concealment and delivery legs of the composites that reference it.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.9
traits:
  - id: bare-numeric-html-document-url
    desc: Bare numeric HTML document URL
    if:
      type: text
      regex: '(?i)https?://[^/''"\s>]{1,80}/\d{3,}\.html?\b'
      exclude_html_comments: true
