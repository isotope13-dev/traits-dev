defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: user-list-download-url
    desc: URL path names user.txt
    crit: notable
    if:
      type: text
      regex: 'https?://[^\s/]{1,100}/[^\s]{0,100}/user\.txt\b'
  - id: password-list-download-url
    desc: URL path names pass.txt
    crit: notable
    if:
      type: text
      regex: 'https?://[^\s/]{1,100}/[^\s]{0,100}/pass\.txt\b'
