defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  mbc: B0030

traits:
  - id: credential-endpoint-literal
    desc: Credential endpoint path literal
    # The Fetch `credentials` option is common library code and is not an
    # endpoint. Require a URL/path segment instead of the bare word.
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)/credentials([/?#]|$)'
