defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.93

traits:
  - id: http-mcp-endpoint-url
    desc: HTTP URL targeting /mcp service path
    for: [scripts, source, json, text, binaries]
    if:
      type: text
      regex: 'https?://[^\s"''<>]{3,96}/mcp([/?#\s"'']|$)'

  - id: api-download-os-arch-binary
    desc: API download path for OS/arch binary
    conf: 0.94
    if:
      type: text
      regex: '/api/download/[A-Za-z0-9_.-]*(linux|windows|darwin)-(amd64|arm64)\b'
