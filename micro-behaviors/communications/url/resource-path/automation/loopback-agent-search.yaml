defaults:
  for: [scripts, source, binaries, data, text]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: loopback-agent-search-url
    desc: Loopback URL targets agent search
    if:
      type: text
      regex: 'http\S{3,14}127\.0\.0\.1\S{2,18}system(/|%(25)?2[fF])agents[^"''\s]{2,36}searchOne'
      exclude_comments: true
  - id: agent-search-identifier-query
    desc: Agent search query passes identifier parameter
    if:
      type: text
      regex: 'searchOne(\?|%(25)?3[fF])[^\s"''\r\n]{0,64}identifier(=|%(25)?3[dD])'
      exclude_comments: true
