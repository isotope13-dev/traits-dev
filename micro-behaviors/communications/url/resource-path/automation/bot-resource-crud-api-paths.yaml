defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.9

composite_rules:
  - id: bot-resource-crud-api-paths
    desc: Bot management CRUD API paths
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: micro-behaviors/communications/url/resource-path/automation::bot-list-api-path
      - id: micro-behaviors/communications/url/resource-path/automation::bot-create-api-path
      - id: micro-behaviors/communications/url/resource-path/automation::bot-update-api-path
      - id: micro-behaviors/communications/url/resource-path/automation::bot-delete-api-path
