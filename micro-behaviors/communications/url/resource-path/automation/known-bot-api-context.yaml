defaults:
  platforms: [unix, windows]
  for: [scripts, source]
composite_rules:
  - id: known-bot-api-context
    desc: Recognized benign bot-API client contexts
    crit: exception
    conf: 0.92
    any:
      - id: micro-behaviors/communications/url/resource-path/automation::bot-resource-crud-api-paths
      - id: well-known/app/productivity/nextcloud::nextcloud-ocs-app-api-path
      - id: well-known/app/productivity/nextcloud::nextcloud-spreed-frontend-api-path
      - id: well-known/tool/development/ci/luci-swarming::swarming-bot-api-path
      - id: micro-behaviors/communications/http/llm::versioned-bot-chat-completions-path
      - id: metadata/lang/source/syntax/directive::documented-versioned-bot-route
      - id: micro-behaviors/communications/url/construction/build-http::configurable-domain-bot-path
