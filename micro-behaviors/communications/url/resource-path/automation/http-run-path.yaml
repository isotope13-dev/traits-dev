traits:
  - id: http-run-path
    desc: HTTP URL uses a /run path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)https?://[^\s"'`]{1,200}/run/?([?#\s"'`]|$)
    platforms:
      - unix
      - windows
    for:
      - javascript
      - typescript
      - markdown
      - text
      - documents
