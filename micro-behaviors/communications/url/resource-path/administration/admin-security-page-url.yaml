defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: admin-security-page-url
    desc: Admin or security page URL
    for: [javascript, typescript]
    conf: 0.88
    if:
      type: string_literal
    # The segment must end there: `\b` let /security-disclosure-policy/ in.
      regex: '[a-z0-9]\.[a-z]{2,}/(admin|security)([/?#"''`]|$)'
