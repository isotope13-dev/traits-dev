# `/cgi-mod/*.cgi` endpoints serve administrative web interfaces on Barracuda
# appliances (Email Security Gateway, WAF, Load Balancer ADC, Message Archiver,
# Web Security Gateway). Accessing these routes is ordinary administrative HTTP
# activity on its own and becomes suspicious or hostile only with exploit inputs.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  crit: notable

traits:
  - id: cgi-mod-endpoint-path
    desc: References /cgi-mod/ CGI endpoint path
    conf: 0.88
    if:
      type: text
      regex: '/cgi-mod/[A-Za-z0-9_.-]+\.cgi\b'

  - id: cgi-mod-index-endpoint
    desc: References /cgi-mod/index.cgi endpoint
    conf: 0.92
    if:
      type: text
      substr: /cgi-mod/index.cgi
