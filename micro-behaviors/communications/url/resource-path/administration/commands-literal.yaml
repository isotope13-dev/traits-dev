# This literal can occur in any ELF, including Go applications. Neither Rust
# provenance nor remote-command tasking follows from a route spelling alone.
defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]
  crit: notable
  conf: 0.9

traits:
  - id: rust-commands-path-literal
    desc: Commands URL path literal
    if:
      type: text
      regex: '["'']/[A-Za-z0-9_]{0,32}commands([^A-Za-z0-9.-]|$)'
