# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: generate-query-path-fragment
  desc: Path fragment /generate-query
  conf: 0.9
  if:
    type: text
    substr: /generate-query
- id: debug-sql-path-fragment
  desc: SQL debug path fragment
  conf: 0.9
  if:
    type: text
    substr: /debug-sql
- id: explain-path-fragment
  desc: Explain route path fragment
  conf: 0.86
  if:
    type: text
    substr: /explain
- id: add-comments-path-fragment
  desc: Add-comments path fragment
  conf: 0.86
  if:
    type: text
    substr: /add-comments
composite_rules:
- id: sql-query-diagnostic-route-set
  desc: SQL diagnostic and query path fragments
  conf: 0.9
  all:
  - id: micro-behaviors/communications/url/resource-path/administration::generate-query-path-fragment
  - id: micro-behaviors/communications/url/resource-path/administration::debug-sql-path-fragment
  any:
  - id: micro-behaviors/communications/url/resource-path/administration::explain-path-fragment
  - id: micro-behaviors/communications/url/resource-path/administration::add-comments-path-fragment
