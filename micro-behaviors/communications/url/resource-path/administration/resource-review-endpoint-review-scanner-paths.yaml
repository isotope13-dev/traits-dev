traits:
- id: cgi-bin-endpoint-url
  desc: CGI endpoint path
  conf: 0.7
  if:
    type: string_literal
    substr: /cgi-bin/
  not:
  - regex: (?i)mitre\.org/cgi-bin/
  unless:
  - type: string_literal
    substr: postgresql/xa/RecoveredXid.java
  - id: well-known/lib/data/holidays::country-calendar-module
- id: wp-admin-endpoint-url
  desc: WordPress admin endpoint path
  conf: 0.7
  if:
    type: string_literal
    substr: /wp-admin
- id: admin-command-endpoint-url
  desc: Admin command endpoint path
  conf: 0.7
  if:
    type: string_literal
    regex: /admin/(cmd|shell|upload)
- id: admin-php-endpoint-url
  desc: Admin PHP endpoint path
  conf: 0.7
  if:
    type: string_literal
    substr: /admin.php
- id: shell-script-filename-reference
  desc: Shell/CMD endpoint filename token
  conf: 0.75
  if:
    type: string_literal
    regex: (shell\.php|cmd\.asp)
- id: shell-script-name-reference
  desc: Shell-named script reference
  conf: 0.6
  if:
    type: string_literal
    regex: shell\.(php|asp|jsp|aspx|ashx)|/shell\.(php|asp|jsp)
composite_rules:
- id: admin-cgi-path-reference
  desc: Admin, CGI or shell path reference
  conf: 0.7
  any:
  - id: micro-behaviors/communications/url/resource-path/administration::cgi-bin-endpoint-url
  - id: micro-behaviors/communications/url/resource-path/administration::wp-admin-endpoint-url
  - id: micro-behaviors/communications/url/resource-path/administration::admin-command-endpoint-url
  - id: micro-behaviors/communications/url/resource-path/administration::admin-php-endpoint-url
  - id: micro-behaviors/communications/url/resource-path/administration::shell-script-name-reference
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
