# Classify each URL match separately: an example URL elsewhere in the file
# must not hide a connection-test URL aimed at a different target.
defaults:
  for: [scripts, source]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: mcp-connection-test-nondoc-url
    desc: Connection-test URL outside documentation IPv4
    conf: 0.95
    if:
      type: text
      regex: 'https?://[^/\s"'']{1,253}/mcp-rest/test/connection\b'
      not:
        - regex: '^https?://(192\.0\.2|198\.51\.100|203\.0\.113)\.[0-9]{1,3}(:[0-9]+)?/mcp-rest/test/connection\b'

composite_rules:
  - id: mcp-connection-test-doc-only-context
    crit: exception
    desc: Documentation target without another target URL
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/resource-path/administration::mcp-connection-test-doc-range-url
    unless:
      - id: mcp-connection-test-nondoc-url
