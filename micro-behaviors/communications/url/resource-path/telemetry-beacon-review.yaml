defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source, pe, dll, elf, macho]
  crit: component
  conf: 0.86
traits:
- id: beacon-path-token
  crit: notable
  desc: Beacon path text
  if:
    type: text
    regex: '/beacon[^\s"''<>]{0,60}'
  # A bundler module path such as ./src/components/views/beacon/Foo.tsx is a
  # source directory, not an HTTP endpoint.
  not:
    - regex: '\.(tsx?|jsx?|mjs|cjs)$'

