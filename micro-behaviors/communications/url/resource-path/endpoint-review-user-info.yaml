defaults:
  platforms: [windows, unix, android]
  for: [scripts, binaries, source]
  attack: T1071.001
  mbc: C0002
  crit: notable
  conf: 0.75
traits:
  - id: user-info-endpoint
    desc: User info endpoint path
    if:
      type: text
      regex: /user[-_]info\b
  - id: accounts-endpoint-path
    desc: Accounts endpoint path
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: /accounts(/|[?\#"\x27\s]|$)
  - id: oauth-profile-api-path
    desc: OAuth profile API path reference
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: /api/oauth/profile
