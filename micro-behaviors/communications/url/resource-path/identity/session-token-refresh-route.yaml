defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: session-token-refresh-route
    desc: Session token refresh route in script
    # Ordinary session renewal: the client posts its current session token
    # to its own auth service to obtain a new one (for example /auth/refresh).
    # Used as a suppressor for token-relay co-occurrence, not as a positive signal.
    if:
      type: text
      regex: '/(auth|session|token)/refresh[''"`?]'
