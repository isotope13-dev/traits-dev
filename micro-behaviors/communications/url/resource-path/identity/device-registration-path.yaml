# Device-registration routes in either segment order. The narrower
# micro-behaviors/communications/http/request/route::device-register-path
# covers script scopes in an auth-route file; this atom covers the same
# route capability in mobile source and compiled artifacts (Kotlin/Java
# source, DEX and AOT string tables), where the reversed
# /register/device spelling also occurs. Registration alone is neutral
# provisioning evidence.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  crit: notable
  conf: 0.88
  mbc: C0002

traits:
  - id: device-registration-endpoint-path
    desc: HTTP path registers a device endpoint
    if:
      type: text
      regex: '(?i)/(devices?/regist(er|ration)|regist(er|ration)/devices?)([/?"''\s]|$)'
      exclude_comments: true

  - id: phone-bind-endpoint-path
    desc: HTTP path binds a phone number
    if:
      type: text
      regex: '(?i)/(bind[._/-]?phone|phone[._/-]?bind)([/?"''\s]|$)'
      exclude_comments: true
