defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: config-segment-url
    desc: HTTP URL contains a config path segment
    conf: 0.9
    if:
      type: string_literal
      regex: 'https?://[^"''\s]{1,180}/config(\.json|\.ya?ml|[/?#]|$)'
