traits:
  - id: python-switch-toggle-url
    desc: HTTP switch or toggle endpoint URL
    crit: notable
    conf: 0.75
    if:
      type: literal
      regex: ^https?://[^\s/]{1,160}/[^\s]{0,80}(switch|toggle)([/?#]|$)
      exclude_docstrings: true
    platforms:
      - windows
      - unix
    for:
      - python
