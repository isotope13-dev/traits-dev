# Server-list discovery routes: the client asks one tier of servers which
# next-tier servers to use. Ordinary load-balanced games do this too, so
# the atom is a notable capability; tiered takedown-resistant resolution
# is inferred by objectives that combine it with a dead-drop bootstrap.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  crit: notable
  conf: 0.88
  mbc: C0002

traits:
  - id: server-list-discovery-path
    desc: HTTP path requests next-tier server list
    if:
      type: text
      regex: '(?i)/(svrlist|server[._/-]?list|line[._/-]?config|get[._/-]?servers?)([/?"''\s]|$)'
      exclude_comments: true
