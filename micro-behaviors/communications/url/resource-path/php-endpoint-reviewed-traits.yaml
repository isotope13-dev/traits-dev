# URL path observations; a PHP endpoint alone does not establish C2.
defaults:
  platforms: [unix, windows]
traits:
  - id: sms-api-pro-user-endpoint
    mbc: C0002
    attack: T1071.001
    size_max: 20000000
    desc: SMS API pro user endpoint
    crit: notable
    conf: 0.96
    for: [php]
    if:
      type: text
      substr: '/sms_api_pro/api_user.php'
  - id: php-endpoints-directory-script
    for: [javascript, typescript, html, php]
    crit: notable
    conf: 0.93
    desc: PHP script path under endpoints directory
    if:
      type: text
      regex: '(?i)/php/endpoints/[a-z0-9_-]{2,40}\.php\b'
  - id: php-license-validation-endpoint
    for: [html, javascript, typescript, php]
    crit: notable
    conf: 0.94
    desc: PHP license key validation endpoint
    if:
      type: text
      regex: '(?i)/endpoints/validate_license\.php\b'
  - id: php-password-change-endpoint
    for: [html, javascript, typescript, php]
    crit: notable
    conf: 0.93
    desc: PHP password_change endpoint path
    if:
      type: text
      regex: '(?i)/endpoints/password_change\.php\b'
  - id: php-telegram-mfa-page
    for: [html, javascript, typescript, php]
    crit: notable
    conf: 0.95
    desc: PHP Telegram MFA verification route
    if:
      type: text
      regex: '(?i)["'']telegram_mfa\.php["'']'
