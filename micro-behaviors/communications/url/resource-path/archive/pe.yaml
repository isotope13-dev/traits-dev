# A URL naming a remote archive in a PE is a network resource reference. The
# surrounding installer or execution behavior determines whether it is hostile.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.91

traits:
  - id: executable-remote-archive-url
    desc: PE embeds a remote archive URL
    if:
      type: text
      regex: '(?i)https?://[^\s"''<>]{4,240}\.(zip|7z|rar|cab)([?#"''\s<>]|$)'
