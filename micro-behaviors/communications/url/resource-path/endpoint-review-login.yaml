defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
traits:
  - id: login-endpoint-path
    desc: HTTP login endpoint path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/api/v1/login\b'

  - id: login-pwd-endpoint-path
    desc: HTTP login_pwd endpoint path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '/login_pwd\b'

  - id: login-id-endpoint-path
    desc: HTTP login_id endpoint path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/login_id\b'
