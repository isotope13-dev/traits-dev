defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: plaintext-tarball-dynamic-dns-clues
    desc: Plaintext tarball dependency and dynamic-DNS reference
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/package/dependencies/direct-url::dep-custom-port-tarball-kv
      - id: micro-behaviors/communications/url/host/dynamic-dns::dynamic-dns-hostname
  # `multiple-url-dependencies` moved to
  # metadata/package/dependencies/direct-url/: pinning several deps to URLs is a
  # neutral manifest property common in legitimate apps (React Native SDK
  # tarballs, the author's own fork branches), not install-hook intent. The
  # hostile supply-chain composites here pair URL deps with real risk evidence
  # (phantom deps, plaintext HTTP, confusion staging) instead of a bare count.
