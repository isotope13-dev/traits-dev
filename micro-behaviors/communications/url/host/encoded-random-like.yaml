defaults:
  platforms: [unix]
  for: [scripts, -php, -perl, -lua, rust, groovy, kotlin, makefile, dockerfile, text]

traits:
  - id: encoded-random-like-hostname
    desc: Random-like hostname in decoded HTTP URL
    crit: notable
    conf: 0.85
    if:
      type: encoded
      regex: 'https?://[a-z0-9-]{8,}\.[a-z]{2,6}\b'
      is: random_like
