---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - javascript
  - typescript
  id: session-fileserver-host-reference
  desc: Session messenger file-server host reference
  conf: 0.9
  if:
    type: text
    regex: "(?i)[a-z0-9.-]*getsession\\.org"
- for:
  - scripts
  - source
  - binaries
  id: cloudflare-tunnel-host-reference
  desc: References a Cloudflare tunnel endpoint
  conf: 0.7
  if:
    type: text
    regex: "[a-z0-9-]+\\.trycloudflare\\.com"
    not:
    - substr: api.trycloudflare.com
    - substr: github.com/cloudflare/cloudflared
    - substr: your-tunnel.trycloudflare.com
  unless:
  - id: metadata/signed/unknown::cloudflare
  - id: well-known/app/ai/agent-runtime/bobi/
