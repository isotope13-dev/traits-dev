- id: webhook-site-uuid-path
  platforms:
  - unix
  - windows
  conf: 0.98
  for:
  - javascript
  - typescript
  - shell
  - package.json
  desc: webhook.site UUID callback path
  attack: T1041
  if:
    type: text
    regex: webhook\.site/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
- id: python-webhook-site-call
  platforms:
  - unix
  - windows
  conf: 0.95
  for:
  - python
  desc: Python call sends to webhook.site
  attack: T1041
  if:
    type: symbol
    kind: call
    regex: (?i)(get|post|put|patch|delete|request|send|urlopen|open)
    arg:
      kind: string
      substr: webhook.site/
  # Python counterpart over string literals. A docstring is one literal too,
  # but a multi-line one: anchoring to the literal's first line keeps
  # huggingface_hub's create_webhook() doctest (url="https://webhook.site/...",
  # several lines into the docstring) out, while `URL = "https://webhook.site/
  # <uuid>"` followed by requests.post(URL) still matches -- a form
  # python-webhook-site-call cannot see, because the call argument is a name.
- id: python-webhook-site-uuid-literal
  platforms:
  - unix
  - windows
  desc: Python literal holds webhook.site UUID URL
  crit: notable
  conf: 0.97
  for:
  - python
  if:
    type: literal
    kind: string
    regex: '^[^\n]{0,60}webhook\.site/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-'
  unless:
    - id: metadata/package/testing/presence/harness/
    - id: "metadata/file/naming::test-directory-component"
- id: webhook-site-source-call
  platforms:
  - unix
  - windows
  conf: 0.85
  for:
  - python
  - javascript
  - typescript
  desc: Source call passes a webhook.site URL
  if:
    type: symbol
    kind: call
    regex: ^[A-Za-z_][A-Za-z0-9_.]*$
    arg:
      kind: string
      substr: webhook.site
  unless:
  - id: metadata/package/testing/harness/runtime/
