# Preserve the endpoint observation without treating its spelling as a family
# identity or a control channel. The behavioral Help rules are host-independent.
defaults:
  platforms: [windows]
  for: [pe, html]
  size_max: 20000000
traits:
  - id: softpeak-install-url-reference
    desc: References a softpeak.live install URL
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: https?://softpeak\.live/install/
