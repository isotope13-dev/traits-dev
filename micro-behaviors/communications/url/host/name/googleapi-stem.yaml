# Hostname spelling alone is not evidence of brand impersonation. This also
# occurs in generated protocol documentation and structured logging keys.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, source, html]

traits:
  - id: googleapi-domain-stem-reference
    desc: References googleapi-style hostname text
    conf: 0.93
    if:
      type: text
      # `googleapi` immediately followed by a dot (googleapi.com) or by a
      # dash/digit host part (googleapi2.com) and a registrable TLD — but
      # never `googleapis`, whose next character is `s`. The engine's regex
      # is lookaround-free, so the negative lookahead is expressed by
      # admitting only `.`/`-`/digits after the stem.
      regex: '(?i)googleapi(\.|[-0-9][a-z0-9-]{0,9}\.)(com|net|org|pro|lat|top|xyz)\b'
