defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: google-host-literal
    desc: Quoted google.com hostname literal
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '["''][\w.]{0,8}google\.com["'']'

  - id: cloudflare-host-literal
    desc: Quoted cloudflare.com hostname literal
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '["''][\w.]{0,8}cloudflare\.com["'']'

  - id: akamai-host-literal
    desc: Quoted akamai.com hostname literal
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '["''][\w.]{0,8}akamai\.com["'']'

composite_rules:
  - id: major-vendor-host-list
    desc: Lists three or more major-vendor hostnames
    crit: notable
    conf: 0.8
    needs: 3
    any:
      - id: google-host-literal
      - id: micro-behaviors/communications/url/host/name::quoted-microsoft-domain
      - id: cloudflare-host-literal
      - id: akamai-host-literal
