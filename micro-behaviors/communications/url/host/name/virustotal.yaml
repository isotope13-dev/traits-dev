# A service hostname is a reference, never the scanned program's identity.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, text, json]
  size_max: 120000000
traits:
  - id: virustotal-domain-reference
    desc: References a VirusTotal service hostname
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bvirustotal\.com\b'
