defaults:
  for: [html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.97
traits:
  - id: html-href-hostlike-userinfo
    desc: HTML href has hostname-like URL userinfo
    if:
      type: text
      regex: '(?i)\bhref\s*=\s*["'']https?://[a-z0-9.-]+\.[a-z]{2,}@'
      exclude_html_comments: true
