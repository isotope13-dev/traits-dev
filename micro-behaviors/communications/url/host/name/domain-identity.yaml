# References to named AV and adult-site hosts. A URL alone does not
# establish navigation, redirection, or browser-hijack behavior.
defaults:
  platforms: [unix, windows]
  for: [pe, scripts, source]
  crit: component
traits:
  - id: fake-av-vendor-domain
    crit: notable
    desc: Fake AV vendor homepage URL
    conf: 0.6
    if:
      type: text
      regex: 'https?://(www\.)?(antivirus|antispyware|freeav)\.com/?'
  - id: adult-redirect-domain
    crit: notable
    desc: Adult-site redirect URL
    conf: 0.5
    if:
      type: text
      regex: 'https?://(www\.)?(pinkworld|youporn|redtube|assparade)\.com/?'
