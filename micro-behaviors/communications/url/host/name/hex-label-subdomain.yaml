defaults:
  platforms: [unix, windows]
  for: [scripts, source, zip, whl, python-sdist]
traits:
  - id: hostname-with-eight-hex-label
    desc: URL hostname contains eight hex digits
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bhttps?://[a-z0-9-]+\.[0-9a-f]{8}\.[a-z0-9-]+\.[a-z]{2,}\b'
