defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
traits:
  - id: tld-shop
    crit: notable
    desc: HTTP URL uses a .shop hostname
    conf: 0.78
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.shop([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
    unless:
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
