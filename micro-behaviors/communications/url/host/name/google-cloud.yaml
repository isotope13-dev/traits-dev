# A provider's name in prose establishes no HTTP capability. Require its
# actual hostname and keep the observation as a reference, not a connection.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, javascript, typescript, text, package.json]
  crit: notable
traits:
  - id: repeated-google-cloud-host-reference
    desc: Repeated cloud.google.com hostname references
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '\bcloud\.google\.com\b'
