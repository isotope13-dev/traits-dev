defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: tld-space
    crit: notable
    desc: HTTP URL host uses the .space suffix
    conf: 0.78
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.space([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
      - substr: admx.help
      - substr: hub.docker.com
      # Established project homepages on .space are not C2 beacons.
      - substr: celestiaproject.space
      - substr: api.ocr.space
    unless:
      - id: micro-behaviors/communications/http/services/huggingface::hf-space-reference
      - id: micro-behaviors/communications/http/services/blockchain::mempool-space-endpoint
      # Blocklists name abused-TLD ad domains without contacting them.
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
      # Test fixtures may use public service URLs as integration inputs; the
      # TLD alone is not evidence of C2 in a test harness.
      - id: metadata/package/testing/
      - id: metadata/file/string/identity::pkgbuild-basename
      - id: well-known/app/system/archlinuxcn::packaging-recipe-path
      - id: "metadata/file/naming::test-directory-component"
