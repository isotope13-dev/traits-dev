# Many bare registrable domains on low-cost suffixes quoted as list members
# (no scheme, no path). A short list is a config default; a dozen or more
# in one file is an embedded host inventory on throwaway registrations.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: bare-club-domain-list
    desc: Lists several bare .club domains
    crit: baseline
    conf: 0.8
    count_min: 3
    if:
      type: text
      regex: '"(www\.)?[a-z0-9-]{3,24}\.club"\s*[,\]]'
  - id: bare-icu-domain-list
    desc: Lists several bare .icu domains
    crit: baseline
    conf: 0.8
    count_min: 3
    if:
      type: text
      regex: '"(www\.)?[a-z0-9-]{3,24}\.icu"\s*[,\]]'
  - id: bare-fun-domain-list
    desc: Lists several bare .fun domains
    crit: baseline
    conf: 0.8
    count_min: 3
    if:
      type: text
      regex: '"(www\.)?[a-z0-9-]{3,24}\.fun"\s*[,\]]'
  - id: bare-xyz-domain-list
    desc: Lists several bare .xyz domains
    crit: baseline
    conf: 0.8
    count_min: 3
    if:
      type: text
      regex: '"(www\.)?[a-z0-9-]{3,24}\.xyz"\s*[,\]]'
composite_rules:
  - id: cheap-tld-bare-domain-list
    desc: Lists many bare .club/.icu/.fun/.xyz domains
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: bare-club-domain-list
      - id: bare-icu-domain-list
      - id: bare-fun-domain-list
      - id: bare-xyz-domain-list
