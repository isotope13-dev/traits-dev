traits:
- for:
  - scripts
  - binaries
  id: vip-tld-url
  desc: URL hostname uses the vip top-level domain
  conf: 0.8
  if:
    type: text
    regex: https?://[A-Za-z0-9.-]{1,120}\.vip([:/?#\s"'<>]|$)
  unless:
  - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
- for:
  - binaries
  - scripts
  - source
  id: ngrok-io-endpoint
  desc: References an ngrok.io hostname
  conf: 0.7
  if:
    type: text
    regex: \b[a-z0-9-]+(\.[a-z0-9-]+)?\.ngrok\.io\b
- for:
  - binaries
  - scripts
  - source
  id: ngrok-dev-endpoint
  desc: References an ngrok.dev hostname
  conf: 0.88
  if:
    type: text
    regex: \b[a-z0-9-]+\.ngrok\.dev\b
- id: ngrok-app-endpoint
  desc: References an ngrok.app tunnel hostname
  crit: notable
  conf: 0.88
  for: [scripts, source, javascript]
  if:
    type: text
    regex: '\b[a-z0-9-]+\.ngrok\.app\b'
defaults:
  platforms:
  - unix
  - windows
  crit: notable
