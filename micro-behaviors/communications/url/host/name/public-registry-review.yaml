traits:
- for:
  - scripts
  - binaries
  id: vip-tld-url
  desc: URL hostname uses the vip top-level domain
  conf: 0.8
  if:
    type: text
    regex: https?://[A-Za-z0-9.-]{1,120}\.vip([:/?#\s"'<>]|$)
  not:
  - regex: ^\s*#
  - regex: ^\s*//
  unless:
  - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
- for:
  - binaries
  - scripts
  - source
  id: ngrok-io-endpoint
  desc: References an ngrok.io hostname
  conf: 0.7
  if:
    type: text
    regex: \b[a-z0-9-]+(\.[a-z0-9-]+)?\.ngrok\.io\b
  unless:
  - id: well-known/lib/network/public-suffix-list/
  - id: metadata/build/recognized-contexts::password-strength-blocklist-context
  - id: metadata/package/testing/
  - id: well-known/lib/ui/qt
  - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
  - id: well-known/app/productivity/keepercommander/
  - type: text
    regex: \b[a-z0-9]+\.ngrok\.io\b
    section: .rsrc
  - id: metadata/path::test-directory-component
defaults:
  platforms:
  - unix
  - windows
  crit: notable
