# Raw-file URLs on public code forges. A raw forge URL is a neutral
# capability (open-source apps fetch version files this way); it becomes
# a dead-drop signal only when an objective pairs it with next-tier
# server discovery or device registration. The GitHub-only identity
# traits live in well-known/app/development/code-forge/github; this
# cross-forge capability sees the same behavior when the operator moves
# the drop file to Gitee, GitLab, Codeberg, or Bitbucket.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  crit: notable
  conf: 0.9
  mbc: C0002

traits:
  - id: github-raw-config-file-url
    desc: GitHub raw URL serving a config file
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/[\w.-]+/[\w.-]+/[\w./-]+\.(txt|json|cfg|conf|ini)\b'
      exclude_comments: true

  - id: forge-raw-path-url
    desc: Raw file path on public code forge
    if:
      type: text
      regex: '(?i)(gitee\.com|gitlab\.com|codeberg\.org|bitbucket\.org)/[\w./-]*?raw/'
      exclude_comments: true

composite_rules:
  - id: code-host-raw-file-url
    desc: Raw file URL on public code forge
    crit: notable
    conf: 0.9
    any:
      - id: github-raw-config-file-url
      - id: forge-raw-path-url
