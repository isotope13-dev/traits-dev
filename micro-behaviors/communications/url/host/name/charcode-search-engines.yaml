# Hash-delimited charcode packing keeps every identifier of the hidden
# script as a decimal run. `google.`, `yahoo.` or `bing.` as a run means the
# concealed code compares something (usually document.referrer) against
# search-engine provider names.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.88
traits:
  - id: charcode-concealed-engine-name
    desc: Charcode payload conceals engine name
    if:
      type: text
      exclude_html_comments: true
      regex: '103#111#111#103#108#101#46|121#97#104#111#111#46|98#105#110#103#46'
