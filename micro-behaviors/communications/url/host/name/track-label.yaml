defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.8

traits:
  - id: track-label-host-url
    desc: URL hostname contains a track label
    if:
      type: literal
      regex: '(https?://|//|www\.)[a-z0-9.-]{0,80}\btrack\.[a-z]{2,63}\b'
      case_insensitive: true
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
