defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  crit: notable
traits:
  - id: gameograf-url
    desc: References a Gameograf host URL
    conf: 0.92
    if:
      type: literal
      regex: 'https?://([^/"''\s]+\.)?gameograf\.com\b'
      case_insensitive: true

  - id: gameograf-play-url-record
    desc: URL record targets Gameograf play portal
    conf: 0.95
    if:
      type: text
      regex: 'url\s*:\s*["'']https?://play\.gameograf\.com/?["'']'
      case_insensitive: true
