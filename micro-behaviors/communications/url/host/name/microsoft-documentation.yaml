defaults:
  platforms: [unix, windows]
  for: [php, javascript, python, shell, powershell]
  size_max: 20000000

traits:
  - id: documentation-host-reference
    desc: References a Microsoft documentation hostname
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(msdn\.microsoft\.com/|learn\.microsoft\.com/)'
