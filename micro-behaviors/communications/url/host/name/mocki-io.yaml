defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text, data]
traits:
  - id: mocki-io-host-reference
    desc: References the mocki.io service
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: mocki.io/v1/
  - id: hex-encoded-mocki-io-url
    desc: Hex-encoded URL targets mocki.io
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: hex
      regex: 'https://mocki\.io/v1/[0-9a-f-]{36}'
