defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  size_min: 0
  size_max: 20000000

traits:
  - id: githubassets-cdn-domain
    desc: GitHub assets CDN domain reference
    crit: notable
    conf: 0.98
    size_min: 0
    if:
      type: text
      regex: '(?i)https?://([a-z0-9-]+\.)?githubassets\.com\b'

