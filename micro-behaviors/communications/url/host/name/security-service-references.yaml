defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: av-update-domain-a
  desc: AV update domain (Kaspersky/Avast/AVG)
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)(update|download)\.(kaspersky|avast|avg)\.
- id: av-update-domain-b
  desc: AV update domain (Bitdefender/ESET/Sophos)
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)(update|download)\.(bitdefender|eset|sophos)\.
- id: av-update-domain-c
  desc: AV update domain (McAfee/Norton/Symantec)
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)(update|download)\.(mcafee|norton|symantec)\.
- id: microsoft-security-domain
  desc: Microsoft security domain string
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (?i)(windowsupdate|smartscreen|wdcp)\.microsoft\.com
- id: microsoft-telemetry-domain
  desc: Microsoft telemetry domain string
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?i)(telemetry|diagnostics|crashpad\.telemetry)\.microsoft\.com
- id: escan-security-domain--rx-1
  desc: eScan download-host name reference
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "download[.-]escanav"
    case_insensitive: true
- id: escan-security-domain--rx-4
  desc: patch.escanav (eScan patch host)
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "patch[.-]escanav"
    case_insensitive: true
- id: escan-security-domain--rx-5
  desc: live.escanav (eScan live host)
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "live[.-]escanav"
    case_insensitive: true
composite_rules:
- id: av-update-domain
  desc: AV/EDR update domain reference
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/communications/url/host/name::av-update-domain-a
  - id: micro-behaviors/communications/url/host/name::av-update-domain-b
  - id: micro-behaviors/communications/url/host/name::av-update-domain-c
- id: threat-intel-domain
  desc: Threat intelligence service domain
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/communications/url/host/name::virustotal-domain-reference
  - id: micro-behaviors/communications/url/host/name::any-run-service-reference
- id: security-update-telemetry-service-references
  desc: Security, update and telemetry service references
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/communications/url/host/name::av-update-domain
  - id: micro-behaviors/communications/url/host/name::microsoft-security-domain
  - id: micro-behaviors/communications/url/host/name::microsoft-telemetry-domain
  - id: micro-behaviors/communications/url/host/name::google-service-domain
  - id: micro-behaviors/communications/url/host/name::escan-update-service-references
  - id: micro-behaviors/communications/url/host/name::threat-intel-domain
- id: escan-update-service-references
  desc: eScan update-service name references
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/communications/url/host/name::escan-security-domain--rx-1
  - id: micro-behaviors/os/security/product::escan-update-token
  - id: micro-behaviors/os/security/product::escanav-token
  - id: micro-behaviors/communications/url/host/name::escan-security-domain--rx-4
  - id: micro-behaviors/communications/url/host/name::escan-security-domain--rx-5
  - id: micro-behaviors/os/security/product::microworld-token
