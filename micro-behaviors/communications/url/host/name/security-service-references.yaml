defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: microsoft-telemetry-domain
  desc: Microsoft telemetry domain string
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?i)(telemetry|diagnostics|crashpad\.telemetry)\.microsoft\.com
composite_rules:
- id: security-update-telemetry-service-references
  desc: Security, update and telemetry service references
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/communications/url/host/security-service::av-update-domain
  - id: micro-behaviors/communications/url/host/security-service::microsoft-security-domain
  - id: micro-behaviors/communications/url/host/name::microsoft-telemetry-domain
  - id: micro-behaviors/communications/http/services/google::google-service-domain
  - id: micro-behaviors/communications/url/host/security-service::escan-update-service-references
  - id: micro-behaviors/communications/url/host/security-service::threat-intel-domain
