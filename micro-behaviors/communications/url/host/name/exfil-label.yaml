# Neutral observations relocated from attacker-objective rules.
traits:
  - id: exfil-label-reference
    desc: Hostname text contains an exfil label
    crit: notable
    conf: 0.78
    if:
      type: text
      substr: .exfil.
    platforms:
    - netscaler
    - appliance
    - unix
    for:
    - scripts
    - binaries
    - go
    - java
    - kotlin
    - csharp
    - swift
    - zig
    - elf
