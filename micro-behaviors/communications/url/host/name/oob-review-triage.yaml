traits:
- id: free-host-gt-tc-domain
  platforms:
  - unix
  - windows
  conf: 0.86
  for:
  - javascript
  - package.json
  - source
  - scripts
  desc: References a gt.tc free-hosted domain
  if:
    type: text
    regex: \b[a-z0-9][a-z0-9.-]*\.gt\.tc\b
- id: ngrok-free-domain
  platforms:
  - linux
  - macos
  - windows
  size_min: 32
  size_max: 500000000
  desc: References an ngrok-free tunnel domain
  conf: 0.9
  # package.json included (as with burpcollaborator above): beacon kits keep
  # the tunnel endpoint in a manifest field (e.g. xpack.host) while the hook
  # script reads it at install time, so the domain never appears in code.
  for:
  - scripts
  - source
  - package.json
  if:
    type: text
    regex: '[a-z0-9-]+\.ngrok-free\.(app|dev)\b'
  not:
  - regex: \b(abcd1234|abc123|example)\.ngrok-free\.
  - regex: \b(your-subdomain|xxx)\.ngrok-free\.
  - regex: \b(my-app|myapp|your-app)\.ngrok-free\.
  - regex: \b(x|app)\.ngrok-free\.
  - regex: (?i)#\s*openapi:.*ngrok-free\.

defaults:
  crit: notable
