defaults:
  for: [scripts, source, binaries, data, text]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: loopback-prefix-dns-host
    desc: DNS hostname starts with loopback IPv4 text
    if:
      type: text
      regex: '127\.0\.0\.1\.[a-zA-Z0-9%{][a-zA-Z0-9.%{}_\-]{2,100}'
