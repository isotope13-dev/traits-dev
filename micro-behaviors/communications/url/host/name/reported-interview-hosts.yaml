defaults:
  platforms: [unix, windows]
  for: [javascript, python, json, text]
  crit: notable
  conf: 0.98
  size_max: 5000000
traits:
  # Exact host references, including bracket-defanged dots, do not prove that
  # the file contacts them. Boundaries exclude lookalike superdomains.
  - id: apachelicense-vercel-host-reference
    desc: References apachelicense.vercel.app host
    if:
      type: text
      regex: '(?i)(^|[^a-z0-9.\[\]-])apachelicense(\.|\[\.\])vercel(\.|\[\.\])app($|[^a-z0-9.\[\]-])'
  - id: logkit-vercel-host-reference
    desc: References reported logkit Vercel host
    unless:
      - id: metadata/file/format/structured::threat-indicator-data
    if:
      type: text
      regex: '(?i)(^|[^a-z0-9.\[\]-])logkit(-tau)?(\.|\[\.\])vercel(\.|\[\.\])app($|[^a-z0-9.\[\]-])'
  - id: logkit-onrender-host-reference
    desc: References logkit.onrender.com host
    unless:
      - id: metadata/file/format/structured::threat-indicator-data
    if:
      type: text
      regex: '(?i)(^|[^a-z0-9.\[\]-])logkit(\.|\[\.\])onrender(\.|\[\.\])com($|[^a-z0-9.\[\]-])'
  - id: ngrok-free-vercel-host-reference
    desc: References ngrok-free.vercel.app host
    if:
      type: text
      regex: '(?i)(^|[^a-z0-9.\[\]-])ngrok-free(\.|\[\.\])vercel(\.|\[\.\])app($|[^a-z0-9.\[\]-])'
