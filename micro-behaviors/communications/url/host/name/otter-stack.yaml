defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: sstar-agent-c2-host
    desc: References SStar Agent C2 hostname
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(?i)\bapi\.otter-stack\.com\b'

  - id: sstar-agent-c2-host-xor-table
    desc: XOR table encodes SStar Agent C2 hostname
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '0x42,\s*0x5e,\s*0x5e,\s*0x5a,\s*0x59,\s*0x10,\s*0x0?5,\s*0x0?5,\s*0x4b'
