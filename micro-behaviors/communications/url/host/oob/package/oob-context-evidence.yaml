defaults:
  crit: notable
  platforms: [unix, windows]

traits:
- id: pipedream-npm-script
  conf: 0.85
  for:
  - package.json
  desc: Pipedream OOB service in npm script
  if:
    type: value
    path: scripts[*]
    regex: ([a-z0-9-]{3,64}\.)+(m\.)?pipedream\.net\b
    not:
    - substr: mcp.pipedream.net
