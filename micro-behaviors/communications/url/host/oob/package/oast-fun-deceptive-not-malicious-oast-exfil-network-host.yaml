---
defaults:
  for:
  - manifests
  platforms:
  - windows
  - unix
  size_min: 100
  size_max: 1048576
composite_rules:
- id: deceptive-not-malicious-oast-exfil
  desc: Registry claims not malicious and references OAST
  crit: notable
  conf: 0.995
  all:
  - id: metadata/package/publishing::registry-metadata-json
  - id: micro-behaviors/communications/url/host/oob/package::manifest-oast-fun-reference
  - id: metadata/package/description/security::desc-not-malicious-claim
