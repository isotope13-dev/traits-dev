defaults:
  platforms:
  - unix
  - windows
traits:
- id: npm-preinstall-collaborator-tempest
  desc: NPM preinstall references Tempest Collaborator
  crit: suspicious
  conf: 0.98
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: collaborator\.tempest\.net\.br\b
