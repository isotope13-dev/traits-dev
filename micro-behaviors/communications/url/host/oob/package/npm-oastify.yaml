defaults:
  platforms:
  - windows
  - unix
  for:
  - package.json
  crit: notable
  conf: 0.96
traits:
- id: oastify-url
  desc: npm manifest references an OASTify URL
  if:
    type: text
    regex: https?://[a-z0-9]+\.oastify\.com
- id: node-oastify-hostname
  desc: npm manifest references OASTify hostname
  if:
    type: text
    substr: oastify.com
