defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]

composite_rules:
- id: npm-poc-preinstall-oob-beacon
  desc: PoC package with preinstall and OOB clues
  conf: 0.96
  scope: archive
  for: [javascript, typescript, package.json, npm]
  all:
  - id: metadata/package/description/disclosure::description-mentions-poc
  - id: metadata/package/scripts/entrypoint::preinstall-node-index-hook
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
- id: npm-postinstall-fingerprint-post-to-tunnel
  desc: Postinstall, JSON POST, hash and tunnel clues
  conf: 0.97
  scope: archive
  for: [npm, package.json, javascript, typescript]
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/communications/http/request/json::fetch-flow-json-post-body
  - id: micro-behaviors/crypto/hash/digest/sha2::node-createhash-sha256-call
  - id: micro-behaviors/communications/url/host/name::ngrok-free-domain
