# Endpoint text and lifecycle/identity co-occurrence do not prove a send.
defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576

traits:
  - id: manifest-oast-fun-reference
    desc: Manifest text references an OAST.fun endpoint
    crit: notable
    conf: 0.97
    for: [manifests, github-actions]
    if:
      type: text
      regex: "https?://[a-z0-9.-]+\\.oast\\.fun|\\.oast\\.fun/"

composite_rules:
  - id: postinstall-oast-endpoint-reference
    desc: Postinstall declared beside OAST.fun endpoint
    crit: notable
    conf: 0.98
    all:
      - id: manifest-oast-fun-reference
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook

