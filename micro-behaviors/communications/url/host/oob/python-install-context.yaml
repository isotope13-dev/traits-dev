defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - pkginfo
  - python_sdist
  - whl
  - tar
  - zip
  crit: notable
  conf: 0.96
composite_rules:
- id: python-install-hook-oob-reference
  desc: Install hook beside OOB host reference
  scope: archive
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  unless:
  - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
