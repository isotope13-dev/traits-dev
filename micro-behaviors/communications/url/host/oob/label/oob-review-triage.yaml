traits:
- id: oast-label-host
  conf: 0.9
  for:
  - python
  - scripts
  - source
  - text
  desc: OAST collaborator DNS label
  if:
    type: text
    regex: \boast\.[a-z0-9-]+(\.[a-z]{2,24})+\b
- id: oob-label-host
  conf: 0.88
  for:
  - scripts
  - javascript
  - typescript
  - package.json
  desc: OOB callback DNS label hostname
  if:
    type: text
    regex: \boob\.[a-z0-9-]{1,63}\.[a-z0-9-]{1,63}(\.[a-z0-9-]{1,63}){0,4}\b
- id: oob-dot-subdomain-host
  conf: 0.88
  for:
  - javascript
  - package.json
  - source
  - scripts
  - binaries
  desc: Hostname uses an oob. callback subdomain
  if:
    type: text
    # A second dot keeps this a hostname. `oob.append(...)` is a list of
    # out-of-bounds ranges, not a callback domain.
    regex: '\boob\.[a-z0-9][a-z0-9-]*\.[a-z]{2,}\b'

defaults:
  platforms: [unix, windows]
  crit: notable
