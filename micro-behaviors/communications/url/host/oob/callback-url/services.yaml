# A string literal that is itself an http(s) URL on an out-of-band callback
# service: the code builds or stores a request target on the collector.
# Anchoring on the scheme excludes prose, blocklists and wildcard policy text
# ("never contact *.oastify.com"), which name the service without targeting
# it. Bare-host mentions stay in ../endpoint.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95
  attack: T1048

traits:
  - id: oastify-url-literal
    desc: URL literal targets Burp oastify.com
    if:
      type: literal
      kind: string
      regex: '^https?://([a-z0-9.-]{0,200}\.)?oastify\.com([:/?#]|$)'
  - id: interactsh-oast-url-literal
    desc: URL literal targets Interactsh oast.* host
    if:
      type: literal
      kind: string
      regex: '^https?://([a-z0-9.-]{0,200}\.)?oast\.(fun|me|pro|live|site|online)([:/?#]|$)'
  - id: interact-sh-url-literal
    desc: URL literal targets Interactsh interact.sh
    if:
      type: literal
      kind: string
      regex: '^https?://([a-z0-9.-]{0,200}\.)?interact\.sh([:/?#]|$)'
  - id: interactsh-com-url-literal
