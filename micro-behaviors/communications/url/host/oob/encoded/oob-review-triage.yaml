traits:
- id: unicode-escaped-canarytokens-com
  conf: 0.85
  for:
  - scripts
  - -batch
  - -jcl
  - -lua
  - -perl
  - -applescript
  - -vbs
  - pe
  - go
  - rust
  - package.json
  desc: Escaped CanaryTokens.com OOB URL
  if:
    type: encoded
    encoding: unicode-escape
    regex: https?://([a-z0-9-]+\.)?canarytokens\.com\b
- id: oastify-b64
  for:
  - scripts
  - binaries
  desc: Base64-encoded Oastify OOB domain indicator
  conf: 0.9
  if:
    type: text
    substr: b2FzdGlmeS5jb20
- id: oast-fun-b64
  for:
  - scripts
  - binaries
  desc: Base64-encoded OAST.fun OOB domain indicator
  conf: 0.9
  if:
    type: text
    substr: b2FzdC5mdW4
- id: oast-fun-b64-hexwrapped
  for:
  - scripts
  - binaries
  desc: Hex-wrapped Base64 OAST.fun indicator
  conf: 0.92
  if:
    type: text
    regex: 6232467a6443356d645734(3d)?
    case_insensitive: true

composite_rules:
- id: encoded-oob-indicators
  for:
  - scripts
  - binaries
  desc: Base64-encoded OOB domain indicators
  any:
  - id: micro-behaviors/communications/url/host/oob/encoded::oastify-b64
  - id: micro-behaviors/communications/url/host/oob/encoded::oast-fun-b64
  - id: micro-behaviors/communications/url/host/oob/encoded::oast-fun-b64-hexwrapped

defaults:
  platforms: [unix, windows]
  crit: notable
