---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: obfuscated-dns-label-lookup
  desc: Encoded callback, computed call and dotted text
  crit: suspicious
  conf: 0.98
  near_bytes: 1024
  all:
  - id: micro-behaviors/communications/url/host/oob/encoded::base64-dnshook-host-reference
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat/expression::js-dotted-variable-concat
- id: js-obfuscated-computed-host-profile-dns-beacon
  desc: Computed call, callback and host profile clues
  crit: suspicious
  conf: 0.995
  all:
  - id: micro-behaviors/communications/url/host/oob/encoded::base64-dnshook-host-reference
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-numeric-indexed-computed-call
  - id: micro-behaviors/data/string/concat/expression::js-dotted-variable-concat
  any:
  - id: micro-behaviors/os/sysinfo/hostname/reference::host-profile-term-hostname
  - id: micro-behaviors/os/user/lookup::host-profile-term-userinfo
  - id: micro-behaviors/os/user/lookup::host-profile-term-username
  needs: 2
