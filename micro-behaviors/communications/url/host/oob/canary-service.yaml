defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, scripts, source, text]

traits:
  - id: aws-honey-key-token-type
    desc: Declares AWS honey-key token type
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: token_type["']?\s*:\s*["']aws_keys["']

  - id: canarytokens-service-reference
    desc: References CanaryTokens callback service
    crit: notable
    conf: 0.94
    if:
      type: text
      word: canarytokens

