defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.97

traits:
  - id: npm-preinstall-python-post-oastify-target
    desc: Preinstall Python POST targets OASTify URL
    if:
      type: value
      path: scripts.preinstall
      regex: '(httpx|requests)\.post\([''"]https?://[^/''"]{1,100}\.oastify\.com/'
