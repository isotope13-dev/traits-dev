---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - pkginfo
composite_rules:
- id: init-oob-callback
  for:
  - python
  desc: Import-time call with an OOB callback endpoint
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  any:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-domains
