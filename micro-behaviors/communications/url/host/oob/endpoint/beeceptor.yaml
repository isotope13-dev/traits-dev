# Beeceptor hosts a free mock/request-capture endpoint per subdomain. It has
# legitimate API-mocking use, so the host alone is only an observation;
# install-hook and identity evidence elsewhere supplies the hostile claim.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]

traits:
  - id: beeceptor-endpoint
    desc: Beeceptor request-capture endpoint
    crit: notable
    conf: 0.85
    attack: T1048
    if:
      type: text
      regex: '(?i)[a-z0-9-]{1,63}\.free\.beeceptor\.com\b'
