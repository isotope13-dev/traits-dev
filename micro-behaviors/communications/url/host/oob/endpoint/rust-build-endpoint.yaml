defaults:
  for: [rust]
  platforms:
  - unix
  - windows
  crit: suspicious
traits:
- id: rust-build-rs-oob-endpoint-common
  desc: Rust source references common OOB endpoint
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: https?://[a-z0-9-]+\.(oast\.(me|fun|pro|live)|oastify\.com|interactsh\.com)\b
composite_rules:
- id: rust-build-rs-oob-endpoint
  desc: Rust source references an OOB endpoint
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/communications/url/host/oob/endpoint::rust-build-rs-oob-endpoint-common
  - id: micro-behaviors/communications/url/host/oob/endpoint::rust-collaborator-callback-url
