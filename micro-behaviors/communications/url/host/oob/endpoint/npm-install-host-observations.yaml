defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: preinstall-webhook-site-url
  desc: Preinstall references webhook.site URL
  crit: notable
  conf: 0.96
  if:
    type: value
    path: "scripts.preinstall"
    regex: "https?://webhook\\.site/[A-Fa-f0-9-]{20,}"

- id: postinstall-webhook-site-url
  desc: Postinstall references webhook.site URL
  crit: notable
  conf: 0.96
  if:
    type: value
    path: "scripts.postinstall"
    regex: "https?://webhook\\.site/[A-Fa-f0-9-]{20,}"

- id: install-webhook-site-url
  desc: Install references webhook.site URL
  crit: notable
  conf: 0.96
  if:
    type: value
    path: "scripts.install"
    regex: "https?://webhook\\.site/[A-Fa-f0-9-]{20,}"
