defaults:
  crit: notable
  platforms: [unix, windows]

traits:
- id: web-content-oob-service-reference
  conf: 0.9
  for:
  - html
  - javascript
  - typescript
  desc: OOB service URL in web content
  if:
    type: text
    regex: (?i)(([a-z0-9-]{3,64}\.)+(m\.)?pipedream\.net|([a-z0-9-]{1,64}\.)?webhook\.site)\b
    not:
    - substr: mcp.pipedream.net
