defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: postinstall-identity-query-oob-reference
    desc: Postinstall identity query beside OOB endpoint
    crit: notable
    conf: 0.97
    all:
      - id: oob-endpoint-any
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
    any:
      - id: micro-behaviors/os/sysinfo/hostname::npm-postinstall-os-hostname-call
      - id: micro-behaviors/os/env/user-info::npm-postinstall-user-env
