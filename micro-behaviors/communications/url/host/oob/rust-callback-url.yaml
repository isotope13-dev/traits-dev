# A complete URL in Rust source is endpoint evidence, not a build.rs hook.
defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-collaborator-callback-url
    desc: Rust text contains collaborator callback URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: https?://[a-z0-9-]+\.(burpcollaborator\.net|webhook\.site|oast\.(online|site))\b
