defaults:
  platforms: [unix, windows]
  for: [pe, scripts, source]
  crit: component
traits:
  - id: url-with-top-tld
    desc: URL with .top TLD
    for: [scripts, binaries, documents, pe, dll]
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: https?://[A-Za-z0-9.-]{1,120}\.top([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - substr: https://video.dtube.top/
      - substr: http://ali.mantv.top/
      - substr: https://api.zan.top/
      - substr: https://jsonrpc.planq.nodestake.top
      - substr: ghfast.top
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/package/documentation/package-metadata::references-changelog-history
      - id: well-known/tool/offensive/projectdiscovery/
      - id: metadata/file/format/markup::adblock-filter-list

