defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, scripts]

traits:
  # Named for what the regex checks: SOME value is assigned to a request/URL
  # host property. It was `hardcoded-url-host-assignment`, but the RHS is
  # `[^=\s]` -- any non-'=' character -- so a variable assignment satisfies it
  # just as well as a literal. `options.host = client.path` in an IPC/HTTP
  # client is ordinary config plumbing, and the whole Node ecosystem does it;
  # reporting that under a `hardcoded-*` id reads as an embedded C2 endpoint
  # and misleads anyone filtering findings for baked-in hosts. The description
  # was already accurate -- only the id overstated. Tightening the regex to
  # quoted literals instead was rejected: the composite below pairs this with
  # X-Forwarded-Host to spot host-header rewriting, where the assigned value
  # is normally a variable, so requiring a literal would gut that rule.
  - id: url-host-property-assignment
    desc: Assigns a request or URL host property
    crit: notable
    conf: 0.82
    if:
      # Require a non-'=' RHS char so equality checks (.host === x) don't
      # register as assignments — Rust regex has no lookahead.
      type: text
      regex: '\b(req(uest)?|url|uri|options)\.host\s*=\s*[^=\s]'

composite_rules:
  - id: url-host-reassignment-forwarding
    desc: URL host reassignment near forwarding header
    crit: notable
    conf: 0.94
    near_lines: 20
    all:
      - id: url-host-property-assignment
      - id: micro-behaviors/communications/http/header/custom::x-forwarded-host
