# curl or wget fetching from a host that is not a named service: a raw IPv4
# address, a generated or abused-TLD name, or raw code-paste content. Neutral
# facts about the fetch host; objectives decide what running the result means.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.88

traits:
  - id: downloader-raw-ipv4-host
    desc: Downloader fetches from a raw IPv4 host
    if:
      type: text
      regex: '(\b(?:curl|wget)\s[^\n]{0,80}https?://\d{1,3}(?:\.\d{1,3}){3}(?::\d{1,5})?/)'
      is: valid_ip
    not:
      - regex: '://(127|10|0)\.'
      - regex: '://192\.168\.'
      - regex: '://172\.(1[6-9]|2\d|3[01])\.'

  # `sus_hostname` judges the URL's host alone: an abused TLD, or a
  # registrable label that reads as generated. Legitimate hosts can match.
  - id: downloader-generated-host
    desc: Downloader host matches risk heuristic
    if:
      type: text
      regex: '(\b(?:curl|wget)\s[^\n]{0,80}https?://[A-Za-z0-9.-]{4,253})'
      is: sus_hostname

  - id: downloader-raw-paste-host
    desc: Downloader fetches raw repo, gist or paste
    if:
      type: text
      regex: '\b(curl|wget)\s[^\n]{0,80}https?://((raw|gist)\.githubusercontent\.com|pastebin\.com/raw)/'
