defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: shell-external-http-url
    desc: Shell references external HTTP URL
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'https?://[A-Za-z0-9][A-Za-z0-9.-]*\.([A-Za-z]{2,}|[0-9]{1,3})([:/?#\s"'']|$)'
    not:
      - regex: '^https?://(127\.0\.0\.1|0\.0\.0\.0)([:/?#\s"'']|$)'

composite_rules:
  - id: shell-loopback-only-http-endpoint
    desc: Shell references only loopback HTTP endpoints
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/host/http::loopback-http-url-reference
    unless:
      - id: shell-external-http-url
