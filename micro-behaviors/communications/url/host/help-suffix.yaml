defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: tld-help
    crit: notable
    desc: HTTP URL literal with a .help hostname
    conf: 0.76
    if:
      # Restrict source matches to URL literals.  A documentation comment
      # linking to a vendor's .help site is not an endpoint used by the code.
      type: literal
      kind: string
      regex: https?://[A-Za-z0-9.-]{1,120}\.help([:/?#\s"'<>]|$)
    not:
      - regex: ^\s*#
      - regex: ^\s*//
      - substr: admx.help
    unless:
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
