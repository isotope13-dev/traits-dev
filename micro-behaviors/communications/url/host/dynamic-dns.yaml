defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, manifests, pe, elf, macho]
  attack: T1583.001

traits:
  - id: dynamic-dns-hostname
    desc: Dynamic DNS hostname reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b[a-z0-9][-a-z0-9]{0,62}\.(duckdns|no-ip|ddns|hopto)\.[a-z]{2,6}\b'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/catalog/identity::debian-packages-index

  # The three atoms below cover the rest of the free dynamic-DNS estate the
  # first one misses. They are split by provider family rather than folded
  # into one alternation because the regex budget (80 bytes, 3 alternations)
  # does not hold them, and because a per-provider hit is the more useful
  # evidence line. Each requires a preceding subdomain label -- the free tier
  # only ever hands out `<label>.<suffix>`, never the apex -- which also keeps
  # a bare mention of the provider's own site out of the match.
  - id: dynamic-dns-hostname-freedns
    desc: afraid.org FreeDNS hostname reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\.(mooo|chickenkiller|crabdance|strangled)\.[a-z]{2,4}\b'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/catalog/identity::debian-packages-index

  - id: dynamic-dns-hostname-noip-alt
    desc: No-IP alternate dynamic DNS hostname
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\.(sytes|zapto|myftp|bounceme)\.[a-z]{2,4}\b'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/catalog/identity::debian-packages-index

  - id: dynamic-dns-hostname-dynu
    desc: Dynu dynamic DNS hostname reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\.(dynu|ddnsking|freeddns|mywire)\.[a-z]{2,4}\b'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/catalog/identity::debian-packages-index

composite_rules:
  # One handle for "the host is on somebody's free dynamic-DNS service",
  # whichever provider it is. Consumers that only care about the class of
  # infrastructure reference this instead of enumerating the per-provider
  # atoms, which keeps their `any:` clauses from growing a leg every time a
  # provider is added here.
  - id: dynamic-dns-host-reference
    desc: Free dynamic DNS hostname reference
    crit: notable
    conf: 0.8
    any:
      - id: dynamic-dns-hostname
      - id: dynamic-dns-hostname-freedns
      - id: dynamic-dns-hostname-noip-alt
      - id: dynamic-dns-hostname-dynu
