# Service-role labels in a URL hostname (mail., support.).  Neutral: every
# mailing-list archive and vendor help centre has one.  Moved from
# objectives/.../brand-impersonation, where they were named as credential
# lures; the phishing composite there pairs them with a brand in a
# noncanonical host to supply the lure intent.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, documents, data]
  crit: notable

traits:
  - id: mail-host-label
    desc: URL host has a mail/inbox label
    conf: 0.82
    if:
      type: text
      # Require a complete hostname label.  Substring matching made the
      # legitimate `gmail.googleapis.com` API host look like a mail lure.
      regex: '(?i)https?://([a-z0-9-]+\.){0,8}(mail|email|inbox)\.[a-z0-9.-]+\.[a-z]{2,24}'
    not:
      - regex: '(?i)https?://mail\.(google|yahoo|icloud)\.com\b'
      # Country-code and regional mail hosts used by real providers
      # (e.g. mail.yahoo.co.jp) are not credential-lure infrastructure.
      - regex: '(?i)https?://([a-z0-9-]+\.)*mail\.yahoo\.(com|co|net)(\.[a-z]{2,3})?\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*mail\.google\.(com|co)(\.[a-z]{2,3})?\b'
      - regex: '(?i)https?://([a-z0-9-]+\.)*mail\.(yandex|protonmail)\.[a-z]{2,12}\b'
      - regex: '(?i)https?://mail\.gnome\.org\b'
      # Microsoft-owned hosts (a tenant's `x.mail.onmicrosoft.com`); the host
      # must end at the Microsoft domain so `...outlook.com.evil.net` still counts.
      - regex: '(?i)https?://([a-z0-9-]+\.)*(onmicrosoft|outlook|office365|office)\.com$'
      # RFC 2606 documentation hosts (example.org, *.test, *.invalid) cannot be
      # real lure infrastructure; tests and docs use them as placeholders. The host
      # must end there, so `mail.example.org.evil.top` still counts.
      - regex: '(?i)https?://([a-z0-9-]+\.)*(example\.(com|net|org)|[a-z0-9-]+\.(test|invalid|example))$'

  - id: support-host-label
    desc: URL host contains a support label
    conf: 0.82
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,60}support[a-z0-9.-]{0,24}\.[a-z]{2,24}'
    # The substring match is deliberate — `support-microsoft.xyz` and
    # `microsoft-support.tk` are real lure shapes — but it also swallows the
    # vendors' own help centres, which are the most-linked support hosts there
    # are.  Documentation linking `support.google.com` is not a lure.
    not:
      - regex: '(?i)https?://support\.(google|microsoft|apple|mozilla|atlassian|zendesk|pkware|github|sap)\.com\b'
      - regex: web\.archive\.org
    unless:
      - type: text
        substr: web.archive.org
      - type: text
        regex: '(?m)^# From https?://'

