defaults:
  platforms: [linux]
  for: [elf]
  size_min: 4096
  size_max: 5000000
traits:
  - id: xor-cnc-subdomain
    desc: XOR-decoded hostname with a cnc label
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: xor
      regex: '\bcnc\.[a-z0-9-]{2,40}\.[a-z]{2,12}\b'

  - id: xor-scan-subdomain
    desc: XOR-decoded hostname with a scan label
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: xor
      regex: '\bscan\.[a-z0-9-]{2,40}\.[a-z]{2,12}\b'

