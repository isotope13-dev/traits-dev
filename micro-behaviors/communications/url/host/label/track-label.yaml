defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.8

traits:
  - id: affiliate-domain-pattern-1
    desc: URL hostname contains an affiliate label
    crit: notable
    conf: 0.72
    if:
      type: literal
      regex: '(https?://|//|www\.)[a-z0-9.-]{0,80}\baffiliate\.[a-z]{2,63}\b'
      case_insensitive: true
  - id: affiliate-domain-pattern-partner
