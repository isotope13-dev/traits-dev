defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85
traits:
  - id: ww-numbered-host-url
    desc: URL with a ww-numbered hostname
    crit: notable
    conf: 0.96
    platforms: [windows, unix]
    for: [source, data, html]
    if:
      type: text
      regex: '(?i)\bhttps?://ww[0-9]{2}\.[a-z0-9.-]{3,253}([/?#]|$)'
