# Absolute hyperlinks in HTML. These are navigation capabilities; intent is
# inferred only when they are correlated with extension lifecycle behavior.
defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.9

traits:
  # Account-restoration actions are often linked to an absolute web address.
  # The anchor is a neutral navigation capability; phishing consumers pair it
  # with brand impersonation and account-scare copy to establish the lure.
  - id: html-account-restoration-anchor
    desc: Account-restoration anchor with absolute URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)<a[^>]{0,80}href=["'']https?://.{1,100}["''][^>]{0,10}>.{0,50}restore.{0,50}account'

  - id: html-absolute-link-catalog
    desc: HTML contains a catalog of absolute hyperlinks
    count_min: 8
    if:
      type: text
      regex: '<a[^>]{0,240}href=["'']https?://'

  # The game token must sit in the hostname: a photo-post slug such as
  # `/nice-animals-games-photos.html` on an ordinary blog is a post about
  # games, not a game-site destination. Path tokens stay out.
  - id: html-game-host-link
    desc: Hyperlink to a game-named host
    if:
      type: text
      regex: '<a[^>]{0,160}href=["'']https?://[^"''/<>]{0,80}(game|unblocked|bowl|solitaire)'
      case_insensitive: true
