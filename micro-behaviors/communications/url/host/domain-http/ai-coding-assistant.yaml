# API hosts of AI coding assistants. A hosts-file or DNS rewrite that names one
# of these sends the editor's model traffic somewhere the user did not choose.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: ai-coding-assistant-api-host
    desc: Hardcoded AI coding-assistant API host
    attack: T1557
    if:
      type: text
      regex: 'api2\.cursor\.sh|api\.individual\.githubcopilot\.com|cloudcode-pa\.googleapis\.com'
