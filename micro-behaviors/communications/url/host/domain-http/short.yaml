# URLs whose host is a two- or three-character domain label (x.co, abc.io).
# Link shorteners, paste services and throwaway domains favour them; so do
# plenty of legitimate projects, which is why the exclusions below exist and
# the trait stays notable.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, php, go, csharp]

traits:
- id: short-domain-url
  desc: URL host has a very short domain
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: https?://[a-zA-Z0-9]{2,3}\.[a-zA-Z]{2,4}[/:]
  unless:
  - type: text
    substr: bit.ly/CRA-PWA
  - id: objectives/credential-access/cloud/token/oauth::sharex-uploaderslib-assembly
  - id: metadata/file/catalog/identity/
  - id: well-known/tool/development/build/vite::official-vite-package-context
  - id: well-known/lib/data/holidays::country-calendar-module
  - id: metadata/build/generated::openapi-codegen-python-source-marker
  - id: metadata/file/extension/identity::markdown-file-basename
  - type: text
    substr: http://bit.ly/kubernetes-client-capabilities-badge
  - type: text
    substr: http://bit.ly/kubernetes-client-support-badge
  not:
  - substr: http://ehc.ac/
  - substr: http://eev.ee/
  - substr: http://ok.hu/
  - substr: ok.ru
  - substr: aka.ms/
  - substr: http://bit.ly/kubernetes-client-capabilities-badge
  - substr: http://bit.ly/kubernetes-client-support-badge
  - substr: go.dev/
  - substr: go.microsoft.com/fwlink/
  - substr: gnu.org
  - substr: zgp.org/
  - substr: w3.org
  - substr: eff.org
  - substr: fsf.org
  - substr: iso.org
  - substr: osi.org
  - substr: ietf.org
  - substr: eth.wiki
  - substr: xml.org/
  - substr: hex.pm
  - substr: npm.io
  - substr: pypi.io
  - substr: hf.co/
  - substr: dvc.org/
  - substr: git.io
  - substr: fb.me/
  - substr: lua.org/
  - substr: bun.sh
  - substr: deno.land
  - substr: https://nx.dev/
  - substr: foo.com/
  - substr: bar.com/
  - substr: baz.com/
  - substr: qux.com/
  - substr: foo.bar/
  - regex: \.(home|local|internal|localhost|lan|test|example|invalid)[\s:/]
