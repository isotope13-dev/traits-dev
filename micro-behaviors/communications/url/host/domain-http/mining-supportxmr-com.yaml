defaults:
  platforms: [windows, linux, macos]
  for: [scripts, pe, elf, macho]
  crit: notable
  conf: 0.9

traits:
- id: supportxmr-com
  desc: References supportxmr.com
  crit: notable
  conf: 0.85
  unless:
    # Same catalog exclusion its sibling minexmr-com already carries: filter
    # lists and threat-intel catalogs name pools in order to block them.
    - id: metadata/file/catalog/identity/
    - id: well-known/tool/detection/security-scanner/
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/app/productivity/1password::onepassword-runtime-context
    - id: well-known/app/productivity/1password::onepassword-native-module-context
    - id: metadata/package/testing/presence/harness::test-directory
  if:
    type: text
    substr: supportxmr.com
