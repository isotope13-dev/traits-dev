defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: extension-external-url-literal
    desc: Remote URL beside Chrome extension API use
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    any:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
      - id: micro-behaviors/browser-extension/lifecycle::browser-namespace

