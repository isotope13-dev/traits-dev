# Links to well-known software storefronts and download mirrors. A link says
# where a page sends the user, nothing more: fan sites, review tools and
# download portals all carry them. Click-hijack composites in
# objectives/evasion/decoy/lure supply the intent, when the page keeps such a
# link for hover text and redirects the click elsewhere.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: steam-store-url
    desc: Links the Steam store web front
    if:
      type: text
      regex: '(?i)https?://store\.steampowered\.com/'

  - id: videolan-download-url
    desc: Links the VideoLAN download mirror
    if:
      type: text
      regex: '(?i)https?://(get|download)\.videolan\.org/'
