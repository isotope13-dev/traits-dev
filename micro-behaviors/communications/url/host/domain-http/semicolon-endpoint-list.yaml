# Several full HTTP endpoints packed into one `;`-separated literal: a pool
# the client splits and rotates through when one host stops answering.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: semicolon-joined-http-endpoint-pool
    desc: Literal packs semicolon-joined HTTP endpoints
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(https?://[^"'';\s]{6,300};){2,}https?://'
  - id: semicolon-split-call
    desc: Splits a string on semicolons
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: '.split(";")'
