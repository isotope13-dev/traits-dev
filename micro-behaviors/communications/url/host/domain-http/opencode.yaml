defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - npm
  - tar
  - zip
  - elf
  - macho
  - pe
  - package.json
  - javascript
  crit: notable
  conf: 0.98
traits:
- id: opencode-product-site
  desc: References the OpenCode product site URL
  for:
  - elf
  - macho
  - pe
  - javascript
  - text
  size_min: 64
  if:
    type: text
    regex: https://opencode\.ai/(install|docs|blog|download)
- id: opencode-install-script-url
  desc: References the OpenCode official installer URL
  for:
  - javascript
  - typescript
  - shell
  - markdown
  - python
  if:
    type: text
    substr: opencode.ai/install
