---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - rust
  - pkginfo
  - package.json
  - documents
  crit: notable
  conf: 0.93
  size_max: 5000000
traits:
- id: exfil-service-suspicious-domain-identifier
  desc: Exfiltration service or domain identifier
  for:
  - python
  conf: 0.95
  if:
    type: text
    regex: lots-project\.com[^\n]{0,80}\n\s*SUSPICIOUS_DOMAINS\b|EXFIL_SERVICES
