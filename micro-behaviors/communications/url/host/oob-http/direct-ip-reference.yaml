defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]

traits:
  - id: direct-ip-url-call-argument
    desc: Passes direct-IP URL to a call
    for: [scripts, source]
    crit: notable
    if:
      type: text
      regex: '\b[\w.]+\(\s*[`"'']https?://[0-9.]{7,15}'

composite_rules:
- id: direct-ip-http-url-reference
  desc: External-IP HTTP URL reference
  crit: notable
  conf: 0.93
  any:
  - id: micro-behaviors/communications/ip/direct::external-ipv4-http-endpoint
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  unless:
  - id: metadata/package/testing/presence/fixture::test-filename-pattern

