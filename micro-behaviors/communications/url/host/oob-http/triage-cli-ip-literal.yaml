defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
traits:
- id: curl-wget-ipv4-url
  desc: Curl/wget command targets an IPv4 URL
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?im)(^\s*|[;&|({]\s*)(curl|wget)\b[^\n;&|]{0,96}https?://\d{1,3}(\.\d{1,3}){3}(:\d+)?/
    is: valid_ip
