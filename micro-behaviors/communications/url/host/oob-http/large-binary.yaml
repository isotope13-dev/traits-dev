traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  id: large-binary-https-ip-port-endpoint
  desc: Large binary HTTPS IP endpoint
  crit: notable
  conf: 0.9
  size_min: 1048576
  size_max: 83886080
  if:
    type: text
    regex: https://([0-9]{1,3}\.){3}[0-9]{1,3}:[1-9][0-9]{1,4}
    is: external_ip
  not:
  - regex: 'https://8\.8\.[84]\.[84]:'
  - regex: 'https://1\.1\.1\.1:'
  - regex: 'https://9\.9\.9\.9:'
  - regex: 'https://169\.254\.169\.254:'
