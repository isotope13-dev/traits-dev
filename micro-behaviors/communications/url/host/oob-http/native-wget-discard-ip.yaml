defaults:
  platforms: [linux]
  for: [elf]
traits:
  # Embedded shell command text: wget aimed at an external IPv4 URL whose body is
  # thrown away to /dev/null. The fetch exists for the request, not the response.
  - id: native-wget-discard-ip-fetch
    desc: Embedded wget discards reply from IP URL
    crit: notable
    conf: 0.9
    if:
      type: text
      section: .rodata
      regex: 'wget\s[^\n]{0,24}-O\s*/dev/null\s+https?://([0-9.]{7,15})[:/]'
      is: external_ip
