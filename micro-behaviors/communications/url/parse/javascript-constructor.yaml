defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: new-url-endpoint
    desc: Constructs URL object from endpoint variable
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: new URL(endpoint)
  - id: new-url-variable
    desc: Constructs URL object from variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'new URL\s*\(\s*[A-Za-z_$][\w$]*\s*\)'
