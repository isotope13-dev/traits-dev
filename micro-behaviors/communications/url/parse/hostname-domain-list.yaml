# Page code that tests the current hostname against a list of domains, and
# page code that reads such a list out of a parsed JSON document. Both are
# routine (allowlists, per-site settings); they matter only when the list
# selects which sites a content script takes over.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: hostname-matched-against-domain-list
    desc: Matches page hostname against domain list
    if:
      type: text
      regex: 'location\.hostname[\s\S]{0,200}\.some\(\(?\w+\)? ?=|\.some\([^;\n]{0,60}location\.hostname'

  - id: parsed-json-domain-list-read
    desc: Reads a domain list from parsed JSON
    if:
      type: text
      regex: '\.json\(\)[\s\S]{0,200}\b\w+\.\w*_?[dD]omains\b'
