# A script rebuilds a URL by substituting only its scheme and host, then
# retries that same path on another origin. The rewrite is the capability;
# writing the fetched body into the document is a separate objective.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: url-host-prefix-replace
    desc: Replaces a URL host prefix
    if:
      type: text
      regex: '\.replace\(\s*/\^https\?:\\/\\/\[\^/\]\+'
