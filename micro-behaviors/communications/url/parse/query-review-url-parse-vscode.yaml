defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

traits:
- id: url-search-params
  desc: URLSearchParams parses URI query
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: new URLSearchParams(uri.query)
- id: uri-token-param
  desc: Reads token from a URLSearchParams object
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'URLSearchParams\([^)]{1,120}\)\.get\(["'']token["'']\)'



composite_rules:
- id: uri-handler-credential-params
  desc: URI handler with query parser and credential lookups
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/url/scheme::uri-handler
  - id: micro-behaviors/communications/url/parse::url-search-params
  - id: metadata/lang/source/syntax/call/arguments::params-username-lookup
  - id: metadata/lang/source/syntax/call/arguments::params-password-lookup
- id: uri-code-state-lookup-context
  desc: URI handler with query parser and code/state lookups
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/url/scheme::uri-handler
  - id: micro-behaviors/communications/url/parse::url-search-params
  - id: metadata/lang/source/syntax/call/arguments::params-code-lookup
  - id: metadata/lang/source/syntax/call/arguments::params-state-lookup
