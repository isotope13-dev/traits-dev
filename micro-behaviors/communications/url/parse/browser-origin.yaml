defaults:
  platforms: [android, windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: browser-url-origin-read
    desc: Derives an origin from a URL
    if:
      type: text
      regex: 'new\s+URL\s*\([^)]{1,120}\)\s*\.\s*origin\b'
  # An origin comparison against the page location is a neutral capability:
  # fetch transports use it to pick same-origin versus CORS mode, and click
  # handlers use it to scope link handling. The click context, when present,
  # comes from the referencing composite's other legs, not from this match.
  - id: page-origin-comparison
    desc: Compares page origin with a URL origin
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\b(origin\s*===?\s*(window\.)?location\.origin|location\.origin\s*===)'
