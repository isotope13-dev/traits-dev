defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: browser-location-search-read
    desc: Reads browser URL query string
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: window.location.search
  - id: continue-redirect-param-read
    desc: Reads the continue= redirect parameter
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'location\.search\.split\(["'']continue='

  # Keitaro's JavaScript handoff asks the tracker to return executable client
  # code. Keep the protocol marker neutral here; compromised-page intent is
  # established by the remote-script injection composites under objectives/.
