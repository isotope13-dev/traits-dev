# A location.hash reference may be a read or a write; the text matcher does not distinguish them.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.85
traits:
  - id: location-hash-reference
    desc: location.hash property reference
    if:
      type: text
      regex: '\blocation\.hash\b'

