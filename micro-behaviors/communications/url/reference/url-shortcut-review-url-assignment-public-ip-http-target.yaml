defaults:
  platforms: [windows]
  for: [text]

traits:
- id: url-assignment-public-ip-http-target
  desc: URL assignment names public-IP HTTP target
  crit: notable
  conf: 0.9
  attack: T1105,T1204.002
  if:
    # `URL=https://<public-IP>/...`. A web shortcut a user is meant to open
    # names a site by hostname; one hardcoded to a bare public IP points at
    # operator infrastructure with no DNS record, the delivery form the
    # Midnight Blizzard-linked lures used (a .url to a staging IP). Intranet
    # addresses are excluded by the external-IP check.
    type: text
    regex: '(?im)^URL=https?://\d{1,3}(\.\d{1,3}){3}(:\d{1,5})?[/?]'
    is: external_ip
  not:
    - regex: '(?i)^URL=https?://(10|127|169\.254|192\.168)\.'
    - regex: '(?i)^URL=https?://172\.(1[6-9]|2\d|3[0-1])\.'

