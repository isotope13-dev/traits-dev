defaults:
  platforms: [unix, windows]
  for: [php, javascript, python, shell, powershell]
  size_max: 20000000
traits:
  - id: documentation-url-reference
    desc: References example, Wikipedia, or Unicode URLs
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'https?://([a-z-]+\.)?(example\.org|wikipedia\.org/wiki|unicode\.org)/'

  - id: mdn-url-reference
    desc: References an MDN documentation URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'https?://developer\.mozilla\.org/'

