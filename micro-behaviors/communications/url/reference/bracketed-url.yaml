# HTTP URL syntax in computed properties or array elements.
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  id: bracketed-http-url-reference
  desc: Bracket followed by HTTP URL string
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \[\s*["']https?:[\\/]{2}[^\s"']{4,240}
