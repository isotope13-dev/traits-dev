defaults:
  platforms: [unix, windows]
  for: [text]
traits:
  - id: patch-remote-image-link
    desc: Patch adds a remote image link
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\+\s*!\[.{0,80}\]\(https?://'
composite_rules:
  - id: bot-patch-remote-image-link
    desc: Bot patch and remote image link clues
    crit: notable
    conf: 0.94
    all:
      - id: metadata/file/format/markup::patch-from-bot-identity
      - id: patch-remote-image-link
