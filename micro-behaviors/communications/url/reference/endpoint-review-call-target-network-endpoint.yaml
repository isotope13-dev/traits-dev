---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  - go
  - rust
  - perl
  - powershell
  crit: notable
  conf: 0.95
composite_rules:
- id: explicit-http-request-destination
  desc: HTTP call target or URL reference
  any:
  - id: micro-behaviors/communications/http/request/target::literal-http-call-target
  - id: micro-behaviors/communications/http/request/target::javascript-request-explicit-destination
  - id: micro-behaviors/communications/http/request/target::node-bound-request-explicit-url
  - id: micro-behaviors/communications/url/scheme::powershell-http-url-literal
