defaults:
  platforms: [unix, windows]
  for: [php, javascript, python, shell, powershell]
  size_max: 20000000
traits:
  - id: url-link-or-example-reference
    desc: HTTP URL link tag or example
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(@link\s+https?://|Example:\s+https?://)'

