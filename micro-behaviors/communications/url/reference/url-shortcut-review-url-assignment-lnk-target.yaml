defaults:
  platforms: [windows]
  for: [text]

traits:
- id: url-assignment-lnk-target
  desc: URL assignment names LNK target
  crit: notable
  conf: 0.94
  if:
    # A `.url` that resolves to a `.lnk`. Neither file is content: the first
    # fetches the second, the second runs something. The indirection exists
    # because each hop is a different format, and a scanner that understands
    # one of them is not looking at the other.
    type: text
    regex: '(?i)^URL=[^\r\n]{1,200}\.lnk\s*$'


composite_rules:
- id: url-assignment-launchable-target
  desc: URL assignment names a shortcut, executable or script Windows runs on open
  crit: notable
  conf: 0.94
  any:
    - id: url-assignment-lnk-target
    - id: micro-behaviors/communications/url/reference::url-assignment-executable-target
    - id: micro-behaviors/communications/url/reference::url-assignment-file-script-target
