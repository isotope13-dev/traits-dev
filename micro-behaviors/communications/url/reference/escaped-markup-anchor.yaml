# HTML anchors carried as entity-escaped text inside an XML value, and the
# kind of target they name. XML-escaped HTML is common in feeds and resource
# files; these are reference observations, and only a document format whose
# fields are plain text (or a viewer that renders them) makes them notable.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.9

traits:
  - id: escaped-anchor-in-xml-value
    desc: XML value carries an escaped HTML anchor
    if:
      type: text
      regex: '(?i)&lt;a\s+href\s*=\s*(&quot;|["''])'

  - id: escaped-anchor-local-executable-href
    desc: Escaped anchor targets a relative executable
    conf: 0.94
    if:
      type: text
      regex: '(?i)&lt;a\s+href=(&quot;|")[^"&:/]{0,200}\.(exe|lnk|bat|cmd|scr|hta|vbs|ps1|msi)(&quot;|")'

  - id: escaped-anchor-schemeless-href
    desc: Escaped anchor target has no URL scheme
    if:
      type: text
      regex: '(?i)&lt;a\s+href\s*=\s*(&quot;|["''])[^"&<>:/#?]{1,200}(&quot;|["''])\s*&gt;'
