defaults:
  platforms: [windows]
  for: [text]

traits:
- id: url-assignment-webdav-ssl-root
  desc: URL assignment names SSL WebDAV root
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)^URL=file://\S{1,180}@SSL/DavWWWRoot/'

- id: url-assignment-webdav-ssl-share
  desc: InternetShortcut URL targets SSL WebDAV share
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?im)^URL=file://[A-Za-z0-9.-]{1,180}@SSL(:\d+)?/\S+'

- id: internet-shortcut-system-icon-file
  desc: InternetShortcut uses system DLL icon
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?im)^IconFile=[^\r\n]{1,120}\\(imageres|shell32)\.dll\b'

