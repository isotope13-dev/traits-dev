defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - documents

composite_rules:
- id: filen-koofr-public-file-host
  desc: Filen or Koofr service domain reference
  crit: notable
  conf: 0.92
  for:
  - archives
  - -apk
  - -apk_alpine
  - -composer
  - -cpan
  - -cran
  - -go_module
  - -hackage
  - -hex
  - -phar
  - -pub
  - -rpa
  - -snap
  - -squashfs
  - -vhd
  - scripts
  - binaries
  - documents
  - apk
  - alpine_apk
  any:
  - id: well-known/app/storage/filen::filen-domain-reference
  - id: well-known/app/storage/koofr::koofr-domain-reference
- id: cloud-storage-service-reference
  desc: Cloud storage service URL or host reference
  crit: notable
  conf: 0.88
  any:
  - id: well-known/app/storage/dropbox::dropbox-download-url
  - id: well-known/app/storage/google-drive::gdrive-download-url
  - id: well-known/app/storage/alibaba-oss::alibaba-oss-url
  - id: well-known/app/storage/tencent-cos::tencent-cos-url
  - id: well-known/app/storage/mega::mega-file-share-url
  - id: well-known/app/storage/mediafire::mediafire-download-url
  - id: well-known/app/communication/discord::discord-cdn-download-url
  - id: well-known/app/storage/pcloud::pcloud-api-url
  - id: well-known/app/storage/yandex-disk::yandex-disk-api-url
  - id: well-known/app/productivity/zoho::zoho-workdrive-url
- id: cloud-executable-url
  desc: Executable download URL from cloud storage provider
  crit: notable
  conf: 0.9
  any:
  - id: well-known/app/storage/dropbox::dropbox-executable-url
  - id: well-known/app/storage/google-drive::gdrive-executable-url
  - id: well-known/app/storage/alibaba-oss::alibaba-oss-executable-url
  - id: well-known/app/storage/tencent-cos::tencent-cos-executable-url
  - id: well-known/app/communication/discord::discord-cdn-executable-url
- id: cloud-archive-url
  desc: Archive download URL from cloud storage
  crit: notable
  conf: 0.9
  any:
  - id: well-known/app/storage/tencent-cos::tencent-cos-archive-url
  - id: well-known/app/communication/discord::discord-cdn-archive-url
- id: third-party-object-storage-url
  desc: DigitalOcean, Aliyun or Tencent object host
  crit: notable
  conf: 0.88
  any:
  - id: well-known/app/storage/digitalocean-spaces::spaces-domain-reference
  - id: well-known/app/storage/alibaba-oss::oss-service-host-reference
  - id: well-known/app/storage/tencent-cos::myqcloud-domain-reference
- id: object-storage-endpoint
  desc: References a cloud object-storage endpoint
  crit: notable
  conf: 0.9
  any:
  - id: well-known/app/storage/amazon-s3::aws-s3-url
  - id: well-known/app/storage/cloudflare-r2::r2-object-endpoint
  # pub-<hash>.r2.dev is the public-bucket host anyone can link to.
  - id: well-known/app/storage/cloudflare-r2::cloudflare-r2-pub-url
  - id: third-party-object-storage-url
  - id: micro-behaviors/communications/http/services/backblaze::backblaze-b2-endpoint-reference
