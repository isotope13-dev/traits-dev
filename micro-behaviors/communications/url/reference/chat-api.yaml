# Chat-platform API base URLs. A bare reference is neutral: bots, notifiers,
# share buttons and stealers' webhooks all name these hosts.
#
# Relocated from micro-behaviors/process/create/channel-agent (as
# ai-agent-chat-endpoint-{a,b,c}), where every Discord webhook in a clipboard
# stealer read as "Agent ... API endpoint". The matcher only finds the URL; the
# agent-channel intent comes from the channel-agent composites that pair it with
# a message-receive operation and agent config keys.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  crit: notable
  conf: 0.88
traits:
  - id: telegram-discord-slack-api-url
    desc: Telegram, Discord or Slack API URL
    if:
      type: text
      regex: '(?i)https?://(api\.telegram\.org|discord(app)?\.com|hooks\.slack\.com|slack\.com/api)/'

  - id: whatsapp-signal-matrix-api-url
    desc: WhatsApp, Signal or Matrix API URL
    if:
      type: text
      regex: '(?i)https?://[^/\s]{1,40}(whatsapp|signal|matrix|graph\.facebook\.com)/'

  - id: dingtalk-wechat-line-api-url
    desc: DingTalk, WeChat or LINE API URL
    if:
      type: text
      regex: '(?i)https?://(oapi\.dingtalk\.com|api\.weixin\.qq\.com|api\.line\.me)/'
