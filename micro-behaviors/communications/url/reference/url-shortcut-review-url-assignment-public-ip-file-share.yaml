defaults:
  platforms: [windows]
  for: [text]

traits:
- id: url-assignment-public-ip-file-share
  desc: URL assignment names public-IP file share
  crit: notable
  conf: 0.95
  attack: T1187,T1105
  if:
    # `URL=file://62.173.138.109\Agenzia\entrat.exe`, or the WebDAV form
    # `URL=file:\\193.124.33.71@80\Downloads\...` where the `@80` suffix
    # tells the Windows redirector to reach the host over HTTP rather than
    # SMB, so the fetch works from outside a network that blocks 445.
    # Either slash flavor after `file:` matches: in the wild the scheme is
    # written `file://` as often as `file:\\`. A shortcut to a file server
    # names a server; this names an address on the internet and,
    # optionally, the port to use. `is: external_ip` keeps out intranet
    # shares (`file://192.168.x.x/...`), which are ordinary IT links.
    type: text
    regex: '(?i)^URL=file:[\\/]{2}[0-9]{1,3}(\.[0-9]{1,3}){3}(@[0-9]{1,5})?[\\/]'
    is: external_ip

