# URL string literals whose path ends at a config or feature-flag resource.
# Neutral: management APIs (MariaDB ColumnStore's /cmapi/.../node/config)
# expose exactly this.  Moved from objectives/.../remote-command/config, where
# it was named for the remote-switch composite that polls it.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: config-endpoint-url
    desc: URL path ends at config or feature-flag
    conf: 0.75
    if:
      type: string_literal
      # End the path segment at a quote, query, fragment or literal end:
      # `\b` also accepted hosted files (`resolve/main/config.json`) and
      # documentation paths (`/config-file/v2.html`).
      regex: 'https?://.{1,200}/(feature-?flags?|config)([/?#]|$)'
    unless:
      - type: string_literal
        substr: docs.aws.amazon.com
      - id: metadata/build/generated::openapi-codegen-python-source-marker
      - type: string_literal
        substr: kubernetes.io/docs/
      - type: string_literal
        substr: k8s.io/docs/
