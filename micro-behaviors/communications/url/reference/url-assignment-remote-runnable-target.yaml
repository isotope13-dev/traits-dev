# An Internet Shortcut whose URL= is a file: share path ending in a script or
# executable type: opening the shortcut asks Explorer to run that remote file.
traits:
- id: url-assignment-remote-runnable-target
  desc: URL assignment names remote runnable file
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.93
  attack: T1204.002
  if:
    type: text
    regex: '(?im)^URL=file:[\\/]{2}[^\r\n]{1,160}\.(hta|jse?|vb[se]|wsf|exe|scr|cpl|bat|cmd|ps1)\s*$'
