defaults:
  platforms: [windows]
  for: [text]

traits:
- id: url-assignment-file-script-target
  desc: URL assignment names file-share script
  crit: notable
  conf: 0.94
  attack: T1105,T1204.002
  if:
    type: text
    regex: '(?im)^URL=file:/{2}\S{1,240}\.(vbs|js|jse|wsf|wsh|hta|bat|cmd|ps1)\s*$'

