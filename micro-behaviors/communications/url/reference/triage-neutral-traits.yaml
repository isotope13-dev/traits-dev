---
defaults:
  platforms:
  - unix
  - windows
  for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  crit: notable
  conf: 0.82
traits:
- id: ai-assistant-url-wording
  desc: Ai assistant url wording
  if:
    type: text
    case_insensitive: true
    regex: "\\b(ai assistant|chatgpt)\\b.{0,120}\\bhttps?://"
