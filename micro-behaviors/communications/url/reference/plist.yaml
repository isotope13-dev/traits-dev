# A stored URL is a reference; it does not establish a connection or download.
defaults:
  platforms: [macos, ios]
  for: [plist]
  crit: notable
traits:
  - id: plist-url-field
    desc: Plist URL field references a URI
    conf: 1.0
    if:
      type: value
      path: URL
      regex: '^[A-Za-z][A-Za-z0-9+.-]*:'
