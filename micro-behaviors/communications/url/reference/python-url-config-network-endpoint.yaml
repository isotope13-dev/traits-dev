---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  mbc: C0002
traits:
- id: python-remote-asset-url-config
  desc: Assigns a remote HTTP asset URL
  conf: 0.94
  if:
    type: text
    regex: (?i)\basset_url\b\s*(=|:)\s*["']https?://
- id: python-conditional-endpoint-selection
  desc: Conditionally selects endpoint-named values
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\breturn\\s+\\w*(url|relay|endpoint)\\w*\\s+if\\s+\\w+.{0,48}else\\s+\\w+"
