# Windows brand lookalike domain with digit substitution.
traits:
  - id: windows-brand-typosquat-domain
    desc: Windows lookalike domain, literal or split
    crit: suspicious
    conf: 0.95
    platforms: [windows, unix]
    for: [batch, powershell, text]
    if:
      type: text
      regex: '(?i)\b[a-z0-9.-]*wind0(ws|["”'']\s*\+\s*["“”'']ws)\.[a-z]{2,}\b'
    unless:
      - id: metadata/file/catalog/identity::embedded-domain-blocklist-context
