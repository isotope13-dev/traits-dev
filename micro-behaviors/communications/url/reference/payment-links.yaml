# Payment-provider URL shapes found in chat exports, configuration, and source.
# A single link is ordinary commerce; the objective composites that consume
# these atoms require bulk or cross-purpose combinations before suspicion.
defaults:
  platforms: [windows, unix]
  for: [html, scripts, source, data]
  crit: notable
  conf: 0.9
traits:
  - id: repeated-pay-by-link-urls
    desc: Contains three pay-by-link URLs
    count_min: 3
    if:
      type: text
      regex: 'https?://[a-z0-9.-]+/paybylink/[^\s"''<>]{4,240}'
      case_insensitive: true

  - id: multiple-invoice-payment-urls
    desc: Contains two invoice-payment URLs
    count_min: 2
    if:
      type: text
      regex: '//[a-z0-9.-]+/invoices/invoice/[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}/payment'
      case_insensitive: true

  - id: email-delivery-gift-card-url
    desc: Contains email-delivery gift-card URL
    if:
      type: text
      regex: 'https?://giftcards?\.[a-z0-9.-]+/[^\s"''<>]{0,160}(by-?email|email-delivery)\b'
      case_insensitive: true
