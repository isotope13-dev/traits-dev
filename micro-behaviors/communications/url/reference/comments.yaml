# URLs in source comments are references, not runtime communications or
# encoded payloads. Keep these context atoms outside url/encoded so they do
# not inherit obfuscation mappings from the encoded-URL detections.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
  crit: component
  conf: 0.9

traits:
  - id: javascript-comment-url-reference
    desc: JavaScript comment contains a URL
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?m)^\s*//[^\n]{0,240}https?://'

  - id: python-comment-url-reference
    desc: Python comment contains a URL
    for: [python]
    if:
      type: text
      regex: '(?m)^\s*#.{0,240}https?://'
    unless:
      # RBI/RBS files are Ruby interface declarations. Cleave may classify
      # their comment text as Python because both use hash comments.
      - type: basename
        regex: '(?i)\.(rbi|rbs)$'
