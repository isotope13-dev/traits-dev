# Greasy Fork hosts userscript metadata pages and an update CDN that serves
# `.user.js` payloads. A bare URL reference is neutral (docs, share links);
# pairing it with a userscript runtime is handled in supply-chain composites.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, svg, html, json]
  crit: notable
  conf: 0.95

traits:
  - id: greasyfork-update-cdn-url
    desc: Greasy Fork userscript update CDN URL
    if:
      type: string_literal
      substr: update.greasyfork.org
