# Campaign/session tokens in kit hand-off URLs are long raw hex runs under
# generic token parameter spellings (cmd=, dispatch=, session=/_session;,
# token=, sid=). Requiring the token key plus a 48+ hex value keeps the
# match on tracked hand-offs rather than any long hex blob in a URL;
# destination intent is supplied by the consuming phishing composites.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: token-key-long-hex-value
    desc: Token query key carries long hex value
    for: [html, javascript, typescript, php, python, shell]
    if:
      type: text
      case_insensitive: true
      regex: '[?&](amp;)?(cmd|dispatch|sess(ion(_?id)?)?|_session|sid|token)[=;][0-9A-Fa-f]{48,512}'
