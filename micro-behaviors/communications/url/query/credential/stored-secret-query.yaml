defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  conf: 0.85

traits:
  - id: js-secret-named-query-set
    desc: Sets a secret-named URL query parameter
    crit: component
    if:
      type: text
      regex: '\b(params|searchParams)\.set\(\s*[''"][\w-]*(secret|api[_-]?key)[''"]'
      exclude_comments: true

  - id: js-storage-secret-read
    desc: Reads an API key from extension storage
    crit: component
    if:
      type: text
      regex: 'storage\.(sync|local)\.get\(\s*\{\s*(api[_-]?key|api[_-]?secret|secret)\b'
      exclude_comments: true

composite_rules:
  - id: stored-secret-in-query-url
    desc: Stored API key placed in URL query near storage read
    crit: suspicious
    conf: 0.8
    near_lines: 6
    all:
      - id: js-secret-named-query-set
      - id: js-storage-secret-read
