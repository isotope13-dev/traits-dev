defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.88
traits:
  - id: login-page-long-session-token
    desc: Login page URL carries long session token
    if:
      type: text
      regex: '(?i)login\.php\?[\w=&%.-]{0,40}session_?id=[A-Za-z0-9]{48,}'
  - id: login-page-long-dispatch-token
    desc: Login page URL carries long dispatch token
    if:
      type: text
      regex: '(?i)login\.php\?[\w=&%.-]{0,40}dispatch=[0-9a-f]{32,}'
  - id: signin-page-long-hex-token
    desc: Sign-in page URL carries long hex token
    if:
      type: text
      regex: '(?i)[\w.-]*sign[_-]?in[\w.-]*\.php\?[\w=&%;.+-]{0,80}[0-9a-f]{48,}'
  - id: login-page-login-run-dispatch
    desc: Login URL with _login-run and dispatch
    if:
      type: text
      regex: '(?i)login\.php\?[\w=&%.-]{0,40}_login-run&dispatch=[0-9a-f]{16,}'
