defaults:
  platforms:
  - windows
  - unix
  for:
  - shell
  - python
  - javascript
  - typescript
  - powershell
  crit: notable
  conf: 0.85

traits:
  - id: registration-token-query
    desc: URL query carries registration token
    if:
      type: text
      regex: '[?&](reg|enroll)(istration|ment)?_?token=[A-Za-z0-9_-]{6,}'
