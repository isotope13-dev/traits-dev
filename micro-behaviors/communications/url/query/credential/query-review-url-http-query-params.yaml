defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: token-query-parameter
    desc: URL token query parameter
    crit: notable
    conf: 0.82
    for: [javascript, typescript, html, python, shell]
    if:
      type: text
      regex: '[?&]token=[A-Za-z0-9_-]{16,}'
      case_insensitive: true

  # This query value can be used by analytics or telemetry; it does not by
  # itself establish clipboard use, delivery, or malware identity.
  - id: password-query-parameter
    desc: URL password query parameter
    crit: notable
    conf: 0.9
    for: [scripts, source, html, text]
    if:
      type: text
      # Require a query delimiter. A form body `user=x&password=y` has no `?`
      # and is not a URL query; `&amp;` is the HTML spelling of the same query.
      regex: '(?i)(\?[^?\s]{0,80}&|&amp;|\?)password='

  # Callback and JSONP parameters are protocol markers.  They are neutral
  # here; exploit-chain composites must supply the browser and admin-action
  # context before assigning an exploit classification.
