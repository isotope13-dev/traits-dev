defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  crit: notable
  conf: 0.9

traits:
  - id: tracking-pixel-status-query
    desc: Tracking pixel status parameter fragment
    crit: component
    if:
      type: text
      regex: '(?i)\?(m|s|status)='
  # Generalized image-beacon shape, independent of the exact `pixel.gif` name.
  # An HTTP(S) request for an image resource (.gif/.png/.bmp/.jpg) whose query
  # string carries a short operational parameter (stage/status/id/command).
  # Benign tracking and analytics pixels have this shape too. A URL, even
  # beside a numeric host, establishes neither a covert channel nor exfiltration.
  # Scheme-optional on purpose: stagers routinely build the URL from a base
  # variable ("$c2/t/pixel.gif?...") so the http(s):// lives in a separate
  # literal. Match the image-resource request path plus the operational query
  # parameter, which is the part that stays together.
