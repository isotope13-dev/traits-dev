defaults:
  for:
  - html
  - javascript
  platforms:
  - unix
  - windows

traits:
  - id: recurring-onload-prompt
    desc: Prompt endpoint has recurrence and onload fields
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'prompt\.php\?[^"<>]{0,160}recurrence=always&[^"<>]{0,80}event_type=onload'
