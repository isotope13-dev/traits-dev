defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: chunk-index-param
    desc: URL includes a chunk index parameter
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)[?&]chunk_index='

  - id: total-chunks-param
    desc: URL includes a total chunk-count parameter
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)[?&]total_chunks='

  - id: http-callback-query-parameter
    desc: HTTP callback query parameter
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, php, python, powershell, shell]
    if:
      type: text
      regex: '(?i)[?&]callback='

  - id: jsonp-query-parameter
    desc: JSONP-named query parameter
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html, php, python, powershell, shell]
    if:
      type: text
      regex: '(?i)[?&]_?jsonp='

  - id: autorun-query-parameter
    desc: URL query carries an autorun parameter
    crit: notable
    conf: 0.92
    for: [scripts, source, documents, data, markdown, html]
    if:
      type: text
      regex: '(?i)[?&](amp;)?autorun=[0-9]'

  - id: task-query-parameter
    desc: URL query selects a task
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      regex: '(?i)[?&](amp;)?task=[^&"''\s]{1,80}'

  - id: upload-id-param
    desc: URL includes chunked-transfer session ID
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)[?&]upload_id='

