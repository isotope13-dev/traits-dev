defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: prompt-query-key-basic
    desc: URL query has prompt or instruction field
    crit: notable
    conf: 0.92
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      # Include the value in the match so OAuth's standardized UI prompt
      # values can be filtered from this AI/tasking-oriented observation.
      regex: '(?i)[?&](amp;)?(prompt|instruction)=[^&"''\s]{1,80}'
    not:
      - regex: '(?i)[?&](amp;)?prompt=(select_account|login|consent)\b'
      - regex: '(?i)[?&](amp;)?prompt=(none|create)\b'

  - id: prompt-query-key-qualified
    desc: Qualified AI prompt query key
    crit: notable
    conf: 0.92
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      regex: '(?i)[?&](amp;)?(user|system|ai|chat|agent|assistant)[_-](prompt|message|query)='

  - id: prompt-query-key-camel
    desc: Camel-case prompt query key
    crit: notable
    conf: 0.92
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      # Product integrations commonly concatenate a product or chat-surface
      # name with Prompt/Message/Query (for example, rovoChatPrompt). Keep
      # the capitalized suffix so ordinary `message=` fields do not match.
      regex: '(?i)[?&](chat|agent|assistant|ai)[A-Za-z0-9]{0,12}(prompt|task|instruction|message|query)='

  # Value-side fragments: incomplete alone, meaningful only with a prompt key.



composite_rules:
  - id: chat-endpoint-task-query-context
    desc: Chat-named endpoint near task query parameter
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    near_bytes: 200
    all:
      - id: micro-behaviors/communications/http/url/api-path::chat-agent-api-path-reference
      - id: micro-behaviors/communications/url/query/selection::task-query-parameter

  # OR of the two prompt-key atoms. Paired with an all: value leg so this is
  # not a low-value any-only composite filtered from findings.
  - id: prompt-query-http-url
    desc: Prompt query near a remote-URL query value
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    near_bytes: 700
    all:
      - id: micro-behaviors/communications/url/query/endpoint::nested-remote-url-value
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-basic
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-qualified
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-camel
      - id: micro-behaviors/communications/url/query/prompt::chat-endpoint-task-query-context

  - id: prompt-query-encoded-url
    desc: Prompt query near an encoded-URL query value
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    near_bytes: 700
    all:
      - id: micro-behaviors/communications/url/query/endpoint::query-encoded-remote-url-value
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-basic
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-qualified
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-camel
      - id: micro-behaviors/communications/url/query/prompt::chat-endpoint-task-query-context

  - id: prompt-url-double-brace-data
    desc: Prompt query near a double-brace query value
    # Template syntax in a prompt query is neutral transport behavior; the
    # image/external-host composites below supply suspicious context.
    crit: notable
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 200
    all:
      - id: micro-behaviors/communications/url/query/structure::query-double-brace-template-value
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-basic
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-qualified
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-camel
      - id: micro-behaviors/communications/url/query/prompt::chat-endpoint-task-query-context

  - id: prompt-url-dollar-data
    desc: Prompt query near a dollar-template query value
    crit: notable
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 200
    all:
      - id: micro-behaviors/communications/url/query/structure::query-dollar-template-value
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-basic
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-qualified
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-camel
      - id: micro-behaviors/communications/url/query/prompt::chat-endpoint-task-query-context
    not:
      - regex: '(?i)(^|[?&])prompt=(consent|login|none|select_account)(?:[&#"\s]|$)'

  - id: prompt-url-angle-data
    desc: Prompt query near an angle-template query value
    # Placeholder syntax is neutral transport, as with dollar/brace templates.
    crit: notable
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 200
    all:
      - id: micro-behaviors/communications/url/query/structure::query-angle-template-value
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-basic
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-qualified
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-camel
      - id: micro-behaviors/communications/url/query/prompt::chat-endpoint-task-query-context

  - id: prompt-url-encoded-angle-data
    desc: Prompt query near encoded angle query data
    crit: notable
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 200
    all:
      - id: micro-behaviors/communications/url/query/structure::query-encoded-angle-value
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-basic
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-qualified
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-camel
      - id: micro-behaviors/communications/url/query/prompt::chat-endpoint-task-query-context

  - id: chat-prompt-query-parameter
    desc: Chat-named endpoint near prompt query fields
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/http/url/api-path::chat-agent-api-path-reference
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-basic
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-qualified
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-key-camel
      - id: micro-behaviors/communications/url/query/prompt::chat-endpoint-task-query-context

  # Copilot Personal deep-link shape (host + q= + autorun=). Escalation to
  # hostile lives in objectives/evasion/security-bypass/llm/prompt/.
  - id: microsoft-copilot-autorun-prompt-url
    desc: Copilot host near autorun and q query fields
    crit: suspicious
    conf: 0.98
    for: [scripts, source, documents, data, markdown, html]
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/url/host/http::microsoft-copilot-web-host
      - id: micro-behaviors/communications/url/query/selection::autorun-query-parameter
      - id: micro-behaviors/communications/url/query/structure::short-q-query-param

  - id: prompt-query-remote-url
    desc: Prompt query near remote-URL query values
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-http-url
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-encoded-url

  - id: prompt-image-template-url
    desc: Chat prompt query near templated image URL
    crit: suspicious
    conf: 0.97
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 1400
    all:
      - id: micro-behaviors/communications/url/query/prompt::chat-prompt-query-parameter
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-remote-url
      - id: micro-behaviors/communications/http/url/media::image-file-url
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-url-double-brace-data
      - id: micro-behaviors/communications/url/query/prompt::prompt-url-dollar-data
      - id: micro-behaviors/communications/url/query/prompt::prompt-url-angle-data
      - id: micro-behaviors/communications/url/query/prompt::prompt-url-encoded-angle-data

  - id: prompt-image-placeholder-url
    desc: Chat prompt query near placeholder image URL
    crit: suspicious
    conf: 0.97
    for: [scripts, source, documents, data, -html, -markdown]
    near_bytes: 1400
    all:
      - id: micro-behaviors/communications/url/query/prompt::chat-prompt-query-parameter
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-remote-url
      - id: micro-behaviors/communications/http/url/media::image-file-url-template
    any:
      - id: micro-behaviors/communications/url/query/prompt::prompt-url-angle-data
      - id: micro-behaviors/communications/url/query/prompt::prompt-url-dollar-data

  - id: prompt-query-encoded-image-template-url
    desc: Chat prompt near encoded image URL and angle data
    crit: suspicious
    conf: 0.97
    for: [source, data, scripts, '!jcl', documents, '!html', '!markdown']
    near_bytes: 1600
    all:
      - id: micro-behaviors/communications/url/query/prompt::chat-prompt-query-parameter
      - id: micro-behaviors/communications/url/query/endpoint::query-encoded-image-url-value
      - id: micro-behaviors/communications/url/query/structure::query-encoded-angle-value

  - id: prompt-image-template-url-markup
    desc: Chat prompt near image URL and URL markup
    crit: suspicious
    conf: 0.97
    for: [html, markdown]
    near_bytes: 1400
    all:
      - id: micro-behaviors/communications/url/query/prompt::chat-prompt-query-parameter
      - id: micro-behaviors/communications/url/query/prompt::prompt-query-remote-url
      - id: micro-behaviors/communications/http/url/media::image-file-url
    any:
      - id: micro-behaviors/communications/url/construction/template

  # Source + medium is the attribution pair that actually travels: it is what
  # `?utm_source=extension&utm_medium=install` carries, and a campaign tag is
  # optional in every UTM tool. Rules that want "this navigation is attributed
  # to whoever placed it" should reference this, not the triad below — gating
  # on utm_campaign silently missed the two-parameter form.
