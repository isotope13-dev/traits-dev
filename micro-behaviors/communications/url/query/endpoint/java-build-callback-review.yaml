defaults:
  platforms: [unix, windows]
  for: [jar]

traits:
  - id: callback-query-status
    desc: Callback status query parameter
    crit: component
    conf: 0.95
    if:
      type: text
      substr: ?status=
  - id: callback-query-trigger
    desc: Callback trigger query parameter
    crit: component
    conf: 0.95
    if:
      type: text
      substr: "&trigger="
  - id: callback-query-source
    desc: Callback source query parameter
    crit: component
    conf: 0.95
    if:
      type: text
      substr: "&src="
  - id: callback-query-package
    desc: Callback package query parameter
    crit: component
    conf: 0.95
    if:
      type: text
      substr: "&pkg="
composite_rules:
  - id: build-callback-query-fields
    desc: Build callback query and package references
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/url/query/endpoint::callback-query-status
      - id: micro-behaviors/communications/url/query/endpoint::callback-query-trigger
      - id: micro-behaviors/communications/url/query/endpoint::callback-query-source
      - id: micro-behaviors/communications/url/query/endpoint::callback-query-package
      - id: micro-behaviors/data/encode/url::callback-encode-java
      - id: micro-behaviors/process/lifecycle/initialize::build-debug-package-reference
