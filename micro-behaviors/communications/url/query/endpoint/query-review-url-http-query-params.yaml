defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: nested-remote-url-value
    desc: Query value contains a remote URL
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      # Query values cannot cross markup/string delimiters. Without these
      # boundaries, a badge URL ending in `?token=...)](https://...` made the
      # following Markdown link look embedded in the token value.
      regex: '(?i)[?&][\w-]{1,32}=[^&"''()<>\[\] \t\r\n]{0,600}https?://'

  - id: nested-executable-url-value
    desc: Query value contains a remote executable URL
    crit: notable
    conf: 0.97
    for: [scripts, source, html]
    if:
      type: text
      # Require the executable suffix to terminate the URL path (or be
      # followed by its query/fragment). A CGI route such as `folioisa.dll/slpr`
      # is a web endpoint, not a nested executable download: the suffix must be
      # followed by end-of-text or a non-path character.
      regex: '(?i)[?&][\w-]{1,32}=https?:[^&"''()<>\s]{1,220}\.(exe|dll|msi|scr|bat|cmd|ps1)([^\w/.-]|$)'

  - id: query-encoded-remote-url-value
    desc: Query value contains an encoded remote URL
    crit: notable
    conf: 0.95
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      regex: '[?&][\w-]{1,32}=[^ \t\r\n]{0,600}https?%3a%2f%2f'
      case_insensitive: true

  - id: query-encoded-image-url-value
    desc: Query value contains an encoded image URL
    crit: notable
    conf: 0.96
    for: [scripts, source, documents, data, markdown]
    if:
      type: text
      # The query value can encode the scheme and path separators while
      # leaving the image extension literal. This atom is prompt-agnostic
      # (file viewers encode image links the same way); the prompt query-key
      # and template context are supplied by the composites below.
      regex: '(?i)[?&][\w-]{1,32}=\S{0,800}https?%3a%2f%2f\S{0,180}(%2f|/)\S{0,80}(%2e|\.)jpe?g\b'

