defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: registry-http-get-query-exfil
    desc: External IP URL with data query
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "https?://[0-9]{1,3}(\\.[0-9]{1,3}){3}(:[0-9]{2,5})?/[^\"'\\s]{0,120}\\?data="
      is: external_ip
