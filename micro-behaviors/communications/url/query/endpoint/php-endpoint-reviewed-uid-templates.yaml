# URI vocabulary is useful evidence, but establishes neither a beacon nor theft.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.92
traits:
  - id: ilog-php-i-query-path
    desc: ilog.php path with i query parameter
    if:
      type: text
      substr: /ilog.php?i=
  - id: log-php-uid-query-path
    desc: log.php path with UID query parameter
    if:
      type: text
      substr: /log.php?uid=
  - id: fg-php-uid-query-path
    desc: fg.php path with UID query parameter
    if:
      type: text
      substr: fg.php?uid=
composite_rules:
  - id: micro-behaviors/communications/url/query/endpoint::multiple-php-query-paths
    desc: Multiple PHP query-path templates
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/communications/url/query/endpoint::ilog-php-i-query-path
      - id: micro-behaviors/communications/url/query/endpoint::log-php-uid-query-path
      - id: micro-behaviors/communications/url/query/endpoint::fg-php-uid-query-path
