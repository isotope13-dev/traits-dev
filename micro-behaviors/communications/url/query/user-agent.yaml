defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.7
traits:
  - id: useragent-query-value-concatenation
    desc: Concatenates User-Agent into URL query
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [android, unix, windows]
    if:
      type: text
      regex: '(?i)[?&](ua|user_?agent)=.{0,3}\+\s*encodeURIComponent\s*\(\s*navigator\s*\.\s*userAgent'
