defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, javascript, typescript, java, ruby]
  crit: notable
  conf: 0.9

traits:
  - id: node-peer-relay-query-url
    desc: Node/peer/relay URL with query parameters
    if:
      type: string_literal
      regex: '(?i)https?://[^"\s]{1,160}/(nodes|peers|relays)\?[^"\s]{1,160}[a-z][a-z0-9_-]{0,32}='

composite_rules:
  - id: peer-list-url-json-cooccurrence
    desc: Node/peer/relay query URL with peer-list JSON
    crit: notable
    conf: 0.94
    all:
      - id: node-peer-relay-query-url
    any:
      - id: micro-behaviors/data/format/json::peer-list-json-field
      - id: micro-behaviors/data/parse/json::peer-relay-json-parser-cooccurrence
