defaults:
  platforms: [windows]
  for: [pe, dll, xml, msi, oledoc]
  crit: notable
  conf: 0.95

traits:
  # These abbreviated fields alone do not identify a product or prove contact.
  # ScreenConnect's constraint and key evidence supplies the relay context.
  - id: h-name-p-number-parameters
    desc: Query h=name and p=number fields
    if:
      type: text
      regex: '[?&]h=[A-Za-z0-9][A-Za-z0-9.-]{0,252}(&amp;|&)p=[0-9]{1,5}\b'
