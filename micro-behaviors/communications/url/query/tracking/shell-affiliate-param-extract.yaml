# A shell text filter capturing a publisher/affiliate/sub/click identifier
# from a URL. Pay-per-install installers use this to credit the distributor;
# the atom claims the extraction, not where the URL came from.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-extract-affiliate-url-param
    desc: Shell extracts affiliate ID from a URL
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(\bsed\b[^\n]{0,30}|\bgrep\s+-\w*o\w*\s+.?)\b(pub|aff\w{0,6}|sub|click)_?id=(\\?\(|\[)'
