defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: pasted-event-query
    desc: event=pasted telemetry query parameter
    crit: notable
    conf: 0.94
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)[?&]event=pasted\b'

  - id: search-source-query-parameter
    desc: Search URL source query parameter
    crit: notable
    conf: 0.86
    for: [javascript, typescript, html]
    if:
      type: literal
      kind: string
      regex: 'https?://[^"''\s]{0,80}(search|newtab)[^"''\s]{0,80}[?&]source='
      case_insensitive: true
  - id: utm-source-query-param
    desc: UTM source query parameter
    crit: notable
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: '[?&]utm_source='
      case_insensitive: true
  - id: utm-medium-query-param
    desc: UTM medium query parameter
    crit: notable
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: '[?&]utm_medium='
      case_insensitive: true
  - id: utm-campaign-query-param
    desc: UTM campaign query parameter
    crit: notable
    conf: 0.85
    for: [javascript, typescript, html]
    if:
      type: string_literal
      regex: '[?&]utm_campaign='
      case_insensitive: true

  - id: yandex-uid-mongo-id-query
    desc: Query carries Yandex UID and mongoID fields
    crit: notable
    conf: 0.95
    for: [pe]
    if:
      type: encoded
      regex: '[?&]yandexuid=\d{10,}.*[?&]mongoID=[0-9a-f]{16,}'
    not:
      - regex: '(?i)(docs|example|test|sample)'


composite_rules:
  - id: utm-source-medium-url
    desc: URL carries UTM source/medium pair
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/url/query/tracking::utm-source-query-param
      - id: micro-behaviors/communications/url/query/tracking::utm-medium-query-param
  - id: utm-source-medium-campaign-url
    desc: URL carries UTM source/medium/campaign triad
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/url/query/tracking::utm-source-medium-url
      - id: micro-behaviors/communications/url/query/tracking::utm-campaign-query-param
