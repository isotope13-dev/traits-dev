defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85
traits:
  - id: ww-numbered-host-utm-term
    desc: Numbered hostname URL with utm_term
    crit: notable
    conf: 0.96
    platforms: [windows, unix]
    for: [source, data, html]
    if:
      type: text
      regex: '(?i)\bww[0-9]{2}\.[a-z0-9.-]{3,80}/[^\s<>"'']{0,80}(\?|&|&amp;)utm_term='
