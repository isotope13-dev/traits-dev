defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: tab-query-campaign-parameter-context
    desc: Tab query near campaign parameter handling
    conf: 0.96
    if:
      type: text
      regex: '(?is)chrome\.tabs\.query\s*\([\s\S]{0,650}(campaign_id|campaignId)'

  - id: uninstall-url-campaign-parameter-context
    desc: Uninstall URL near campaign parameter references
    conf: 0.95
    if:
      type: text
      regex: '(?is)(setUninstallURL[\s\S]{0,600}campaign_id|CampaignID[\s\S]{0,900}setUninstallURL)'

