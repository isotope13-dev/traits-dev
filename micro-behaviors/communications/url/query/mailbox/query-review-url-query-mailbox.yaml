defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - makefile
  - text
  crit: notable
  conf: 0.92

traits:
  - id: mail-query-embeds-mailbox
    desc: Mail query value contains an at-sign
    if:
      type: text
      regex: '[?&](e-?)?mail=[^&"''\s]{0,64}@'
      case_insensitive: true
      exclude_html_comments: true
  - id: eml-query-embeds-mailbox
    desc: Eml query value contains an at-sign
    if:
      type: text
      regex: '[?&]eml=[^&"''\s]{0,64}@'
      case_insensitive: true
      exclude_html_comments: true




composite_rules:
  - id: query-embeds-mailbox
    desc: Email query value contains an at-sign
    any:
      - id: micro-behaviors/communications/url/query/mailbox::mail-query-embeds-mailbox
      - id: micro-behaviors/communications/url/query/mailbox::eml-query-embeds-mailbox
