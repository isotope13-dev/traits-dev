defaults:
  for: [oledoc]
  platforms: [windows]
traits:
  # An apparent web address directly follows ?, with no parameter name.
  # This is merely a query component until joined with the actual IP host.
  - id: wide-bare-www-query
    desc: UTF-16 query starts with www address
    crit: notable
    if:
      type: raw
      regex: '\?\x00(w\x00){3}\.\x00([a-z0-9-]\x00){1,63}\.\x00([a-z]\x00){2,24}'
      case_insensitive: true
