defaults:
  platforms: [windows, unix]
  for: [html]

# A continue= parameter that points at a free blogspot host is the post-login hop
# of counterfeit-goods doorways. Relying-party sign-in links use their own
# domains, and Google's own www.blogger.com pages legitimately use blogger.com.
traits:
  - id: google-signin-blog-continue
    desc: Sign-in continue targets a blogspot host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'continue=https?(:|%3A)(//|%2F%2F)[^\s"''<>]{0,120}blogspot\.com'
      case_insensitive: true
      exclude_html_comments: true
