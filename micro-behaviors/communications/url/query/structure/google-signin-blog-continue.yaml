defaults:
  platforms: [windows, unix]
  for: [html]

# A continue= parameter that points at a free blog host is the post-login hop
# of counterfeit-goods doorways. Relying-party sign-in links use their own
# domains, and Google's own continue targets never sit on blogger or blogspot.
traits:
  - id: google-signin-blog-continue
    desc: Sign-in continue parameter targets a blog host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'continue=https?(:|%3A)(//|%2F%2F)[a-z0-9.-]{0,40}blog(ger\.com|spot\.com)'
      case_insensitive: true
      exclude_html_comments: true
