defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - html
  crit: notable
  conf: 0.9

traits:
  - id: short-query-fields-first-set
    desc: Short query parameter names, first set
    crit: component
    conf: 0.93
    if:
      type: text
      # `sc` is a common search/source parameter (for example Baidu search
      # URLs), not a fingerprint field. Keep only the less ambiguous profile
      # names so ordinary search templates do not inflate the field count.
      regex: '[^&]&(ph|vd|fp|ft)='
    unless:
      - type: text
        substr: 'ft=music'
      # Video-CDN playback URLs (TikTok/`ttcdn`, etc.) carry `&ft=<token>`,
      # `&sc=`, `&vd=` alongside `mime_type=video_*`; these collide with the
      # fingerprint-field names and inflate the count. A fingerprint-collection
      # landing page does not ship video-playback query strings.
      - type: text
        substr: 'mime_type=video'
      # Snowplow tracker explicitly sets &fp=none when fingerprinting is disabled
      - type: text
        substr: '&fp=none'
  - id: short-query-fields-second-set
    desc: Short query parameter names, second set
    crit: component
    conf: 0.93
    if:
      type: text
      regex: '[^&]&(tz|lg|ua|gyro)='
    unless:
      - type: text
        substr: 'ft=music'
      - type: text
        substr: 'mime_type=video'


composite_rules:
  - id: short-query-field-sets
    desc: Two sets of short query names
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/url/query/structure::short-query-fields-first-set
      - id: micro-behaviors/communications/url/query/structure::short-query-fields-second-set
    unless:
      - id: well-known/lib/ui/tinymce/
