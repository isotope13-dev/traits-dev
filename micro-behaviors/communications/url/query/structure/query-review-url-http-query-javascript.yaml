defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

composite_rules:
  - id: identifier-query-fields
    desc: URL query has user or offer identifier fields
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/url/query/profile::user-id-query-field
      - id: micro-behaviors/communications/url/query/tracking::offer-id-query-field
