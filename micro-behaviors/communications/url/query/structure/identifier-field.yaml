defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: identity-or-extension-query-field
    desc: URL query contains identity or extension key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)[?&](alias|uid|guid|client[_-]?id|install(ation)?[_-]?id|ext)='
