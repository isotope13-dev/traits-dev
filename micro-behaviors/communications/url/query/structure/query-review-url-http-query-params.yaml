defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: decoded-add-query-param
    desc: Decoded URL has alphanumeric add parameter
    if:
      type: encoded
      regex: '[?&]add=[a-zA-Z0-9]{10,}'
  - id: url-query-type-data-literal
    desc: URL query with type and data params
    crit: notable
    conf: 0.88
    attack: T1041
    for: [javascript, python, shell]
    if:
      type: text
      regex: "[?&]type=[^&]{1,80}&data=[^&]{1,80}"
    unless:
      - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
      - id: metadata/package/testing/harness/runtime/

  - id: short-q-query-param
    desc: URL carries a bare q= query value
    crit: component
    conf: 0.7
    for: [scripts, source, documents, data, markdown, html]
    if:
      type: text
      regex: '(?i)[?&](amp;)?q=[^&"''\s>]{8,}'

  # Bare task= is also an ordinary scheduler/CMS selector. AI task queries
  # require a chat endpoint below; qualified AI keys remain directly usable.
  # Plain message= is intentionally not included: it is a common parameter in
  # ordinary notification and messaging APIs (SMS gateways, status webhooks).
  # Keep each key atom under the regex-size budget; composites below OR them.
  - id: query-double-brace-template-value
    desc: Query value contains a double-brace template
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    if:
      type: text
      regex: '[?&][\w-]{1,32}=\S{0,60}\{\{[^}\r\n]{1,40}\}\}'
      case_insensitive: true

  - id: query-dollar-template-value
    desc: Query value contains a dollar template
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    if:
      type: text
      regex: '[?&][\w-]{1,32}=\S{0,60}\$\{[^}\r\n]{1,40}\}'
      case_insensitive: true

  - id: query-angle-template-value
    desc: Query value contains an angle template
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    if:
      type: text
      # Keep the value URL-shaped and placeholder-like.  A broad \S span
      # turns bitwise comparisons such as `&128===...d<55296||d>` in bundled
      # JavaScript into a query parameter with an angle value.
      regex: '[?&](amp;)?[\w-]{1,32}=[^&#<>\s]{0,60}<[\w$.:/-]{1,40}>'
      case_insensitive: true

  - id: query-encoded-angle-value
    desc: Query value contains encoded angle data
    crit: component
    conf: 0.96
    for: [scripts, source, documents, data, -html, -markdown]
    if:
      type: text
      regex: '[?&][\w-]{1,32}=\S{0,60}%3c[^%\r\n]{1,40}%3e'
      case_insensitive: true

  # The remote-image-URL matcher is canonical at
  # micro-behaviors/communications/http/url/media::image-file-url; the
  # composites below reference it and supply the prompt context.


  - id: decoded-uuid-query-param
    desc: Decoded URL has alphanumeric uuid parameter
    if:
      type: encoded
      regex: '[?&]uuid=[a-zA-Z0-9]{10,}'
  - id: http-query-uids-list-param
    desc: HTTP query list parameter for UIDs
    crit: baseline
    conf: 0.8
    for: [python, javascript, powershell, shell]
    if:
      type: text
      regex: 'uids\[\]\s*='


composite_rules:
  - id: identifier-like-query-field-observations
    desc: Alphanumeric add/uuid or formatted MAC fields
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/communications/url/query/structure::decoded-add-query-param
      - id: micro-behaviors/communications/url/query/structure::decoded-uuid-query-param
      - id: micro-behaviors/communications/url/construction/query::obfuscated-add-parameter-construction
      - id: micro-behaviors/communications/url/construction/query::mac-query-param-format
