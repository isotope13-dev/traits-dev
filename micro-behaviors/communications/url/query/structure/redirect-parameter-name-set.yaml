# Query-parameter names that web applications commonly use to carry a
# post-login or post-action redirect destination. Each atom records one quoted
# name; a single one is ordinary routing, while a catalog of them is used to
# locate redirect sinks.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, ruby, go]
  crit: notable
  conf: 0.8

traits:
  - id: redirect-uri-parameter-name
    desc: redirect_url or redirect_uri parameter name
    if:
      type: literal
      regex: '^redirect_?ur[il]$'
      case_insensitive: true

  - id: return-url-parameter-name
    desc: return_url parameter name
    if:
      type: literal
      regex: '^return_?url$'
      case_insensitive: true

  - id: return-to-parameter-name
    desc: return_to parameter name
    if:
      type: literal
      regex: '^return_?to$'
      case_insensitive: true

  - id: redirect-to-parameter-name
    desc: redirect_to parameter name
    if:
      type: literal
      regex: '^redirect_?to$'
      case_insensitive: true

  - id: callback-url-parameter-name
    desc: callback_url parameter name
    if:
      type: literal
      regex: '^callback_?url$'
      case_insensitive: true

  - id: goto-parameter-name
    desc: goto parameter name
    if:
      type: literal
      regex: '^go_?to$'
      case_insensitive: true

  - id: relaystate-parameter-name
    desc: relaystate parameter name
    if:
      type: literal
      regex: '^relay_?state$'
      case_insensitive: true

  - id: redir-parameter-name
    desc: redir parameter name
    if:
      type: literal
      exact: redir
      case_insensitive: true

  # "destination" is an ordinary word (copy targets, CLI arguments); only
  # the catalog composite gives it a redirect-parameter reading.
  - id: destination-parameter-name
    desc: Quoted "destination" string literal
    crit: component
    if:
      type: literal
      exact: destination
      case_insensitive: true

composite_rules:
  - id: redirect-parameter-name-catalog
    desc: Lists many redirect-target query parameter names
    scope: file
    needs: 6
    any:
      - id: redirect-uri-parameter-name
      - id: return-url-parameter-name
      - id: return-to-parameter-name
      - id: redirect-to-parameter-name
      - id: callback-url-parameter-name
      - id: goto-parameter-name
      - id: relaystate-parameter-name
      - id: redir-parameter-name
      - id: destination-parameter-name
