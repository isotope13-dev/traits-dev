defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  - javascript
  - python
  - shell
  - powershell
  size_max: 20000000

traits:
  - id: percent-encoded-url-query-context
    desc: Percent-encoded URL query parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'https?://[^/\n]{1,253}[?&].{0,300}%[0-9A-Fa-f]{2}'
