# URL path observations; a PHP endpoint alone does not establish C2.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: php-collect
    crit: notable
    conf: 0.8
    desc: PHP URL collect query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?collect(=|&|$)
  - id: php-data
    crit: notable
    conf: 0.8
    desc: PHP URL data query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?data(=|&|$)
  - id: php-info
    crit: notable
    conf: 0.8
    desc: PHP URL info query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?info(=|&|$)
  - id: php-log
    crit: notable
    conf: 0.8
    desc: PHP URL log query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?log(=|&|$)
  - id: php-report
    crit: notable
    conf: 0.8
    desc: PHP URL report query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?report(=|&|$)
  - id: php-beacon
    crit: notable
    conf: 0.8
    desc: PHP URL beacon query parameter
    if:
      type: text
      regex: \.php\?([^#\s]{0,200}&)?beacon(=|&|$)
composite_rules:
- id: php-collector
  desc: PHP collection-related query parameters
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/communications/url/query/structure::php-collect
  - id: micro-behaviors/communications/url/query/structure::php-data
  - id: micro-behaviors/communications/url/query/structure::php-info
  - id: micro-behaviors/communications/url/query/structure::php-log
  - id: micro-behaviors/communications/url/query/structure::php-report
  - id: micro-behaviors/communications/url/query/structure::php-beacon
