# Parameter names establish query syntax, not an HTTP request or a report.
# A brand can identify an installer distribution channel (Google Omaha), a
# product or a device. Only explicitly device-qualified model fields assert
# a device subject. Preserve both observations without inferring telemetry.
defaults:
  platforms: [unix, windows, appliance]
  for: [shell, python, javascript, c, cpp, elf, macho, pe]
  crit: notable
  conf: 0.86

traits:
  - id: brand-manufacturer-parameter
    desc: Query text names brand or manufacturer
    if:
      type: text
      regex: '(?i)[?&](brand|manufacturer)='
  - id: device-model-parameter
    desc: Query text names a device model
    if:
      type: text
      regex: '(?i)[?&](device_?model|phone_?model|mobile_?model)='
