defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - scripts
  - source
  crit: notable
  conf: 0.94

traits:
  - id: visitor-ip-query
    desc: URL query carries visitor IP address
    if:
      type: text
      regex: '[?&]ip(_address)?='

  - id: visitor-country-query
    desc: URL query carries visitor country code
    if:
      type: text
      regex: '[?&]country_code='




composite_rules:
  - id: session-start-location-query
    desc: Session start includes IP and country query fields
    all:
      - id: micro-behaviors/communications/http/device-code::action-start-query-param
      - id: micro-behaviors/communications/url/query/profile::visitor-ip-query
      - id: micro-behaviors/communications/url/query/profile::visitor-country-query
    near_bytes: 512
