defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: notable
traits:
  - id: msbuild-host-query-property
    desc: MSBuild property populates host/pod URI query
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '[?&](amp;)?(host|machine|pod)=\$\('
      case_insensitive: true
  # Query keys are attacker-controlled. The consuming objective separately
  # requires a local-host lookup and an automatic download task.
  - id: msbuild-query-property
    desc: MSBuild property populates URI query value
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '[?&](amp;)?[A-Za-z0-9_.-]{1,64}=\$\('
