defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

traits:
- id: package-user-path-host-query-text
  desc: User, path and hostname query text
  crit: notable
  conf: 0.99
  for: [manifests]
  if:
    type: text
    substr: user=$(whoami)&path=$(pwd)&hostname=$(hostname)
  unless:
    - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
- id: preinstall-user-path-host-query
  desc: Preinstall query names user, path and host
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: "versions.*.scripts.preinstall"
    substr: "?user=$(whoami)&path=$(pwd)&hostname=$(hostname)"
- id: preupdate-user-path-host-query
  desc: Preupdate query names user, path and host
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: "versions.*.scripts.preupdate"
    substr: "?user=$(whoami)&path=$(pwd)&hostname=$(hostname)"
- id: test-user-path-host-query
  desc: Test query names user, path and host
  crit: notable
  conf: 0.99
  for: [pkginfo]
  if:
    type: value
    path: "versions.*.scripts.test"
    substr: "?user=$(whoami)&path=$(pwd)&hostname=$(hostname)"
