defaults:
  platforms:
  - unix
  - windows
  - appliance
  for:
  - shell
  - python
  - javascript
  - c
  - cpp
  - elf
  - macho
  - pe
  crit: notable
  conf: 0.86

traits:
  - id: brand-manufacturer-parameter
    desc: Query text names brand or manufacturer
    if:
      type: text
      regex: '(?i)[?&](brand|manufacturer)='
  - id: device-model-parameter
    desc: Query text names a device model
    if:
      type: text
      regex: '(?i)[?&](device_?model|phone_?model|mobile_?model)='
