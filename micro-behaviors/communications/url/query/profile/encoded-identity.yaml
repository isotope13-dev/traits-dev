# An identity query field beside URL encoding also occurs in ordinary profile
# links. Credential collection and transmission require their own evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: encoded-identity-query-field
    desc: Identity query field before URL encoding
    if:
      type: text
      regex: '(?i)[?&](id|user(name)?|email|employee.?id)=[^&;\r\n]{0,80}encodeURIComponent\('
