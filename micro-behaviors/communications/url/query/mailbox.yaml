# Query syntax does not imply an IP host, an href, or a network request.
# Keep the spelling groups separate: their mandatory literals (mail= / eml=)
# let the raw-content gate reject nonmatching data before HTML-comment masking.
# The union preserves the original four keys and the 64-character value bound.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  crit: notable
  conf: 0.92

traits:
  - id: mail-query-embeds-mailbox
    desc: Mail query value contains an at-sign
    if:
      type: text
      regex: '[?&](e-?)?mail=[^&"''\s]{0,64}@'
      case_insensitive: true
      exclude_html_comments: true
  - id: eml-query-embeds-mailbox
    desc: Eml query value contains an at-sign
    if:
      type: text
      regex: '[?&]eml=[^&"''\s]{0,64}@'
      case_insensitive: true
      exclude_html_comments: true

composite_rules:
  - id: query-embeds-mailbox
    desc: Email query value contains an at-sign
    any:
      - id: mail-query-embeds-mailbox
      - id: eml-query-embeds-mailbox
