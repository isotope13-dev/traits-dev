defaults:
  conf: 0.6
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: status-task-query-key
    desc: HTTP status or task query key
    crit: component
    if:
      type: text
      regex: (\?|&)(status|task)=[0-9a-zA-Z]
  - id: job-command-query-key
    desc: HTTP job or cmd query key
    crit: component
    if:
      type: text
      regex: (\?|&)(job|cmd)=[0-9a-zA-Z]
  - id: command-query-key
    desc: HTTP command query key
    crit: component
    if:
      type: text
      regex: (\?|&)command=[0-9a-zA-Z]
composite_rules:
  - id: status-task-command-query-keys
    desc: HTTP query keys for status, tasks, or commands
    crit: notable
    needs: 2
    any:
      - id: status-task-query-key
      - id: job-command-query-key
      - id: command-query-key
