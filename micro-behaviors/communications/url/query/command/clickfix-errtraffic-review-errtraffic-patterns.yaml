defaults:
  platforms: [windows, unix]
  for: [html, javascript]


traits:
  - id: api-index-context-query
    desc: API index path with context query
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)/api/index\.php\?[^"''<>\r\n]{0,120}\ba=ctx\b'
  - id: api-index-windows-query
    desc: API index path with Windows query
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)/api/index\.php\?[^"''<>\r\n]{0,180}\bos=windows\b'
  - id: api-index-download-query
    desc: API index path with download-mode query
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)/api/index\.php\?[^"''<>\r\n]{0,220}\bmode=download\b'
  # /cf.js and /api/css.js are ordinary resource names, not evidence of a
  # ClickFix stage. Canonical HTTP URL/resource traits retain those neutral
  # observations; the clipboard rule below requires execution mechanics.

composite_rules:
  - id: api-index-context-windows-download-query
    desc: API index context, Windows and download query clues
    crit: suspicious
    conf: 0.96
    near_lines: 4
    all:
      - id: micro-behaviors/communications/url/query/command::api-index-context-query
      - id: micro-behaviors/communications/url/query/command::api-index-windows-query
      - id: micro-behaviors/communications/url/query/command::api-index-download-query
