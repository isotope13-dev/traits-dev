# Capacitor's internal HTTP proxy route (`/_capacitor_http_interceptor_?u=...`)
# legitimately proxies subresource fetch/XHR calls when CapacitorHttp is enabled.
# These notable traits establish the upstream-URL structure without asserting
# document-navigation exploitation.
defaults:
  platforms: [unix, windows, android]
  crit: notable
  conf: 0.96

traits:
  - id: capacitor-http-interceptor-upstream-url
    for: [scripts, source]
    desc: Capacitor proxy route carries upstream URL
    if:
      type: literal
      kind: string
      regex: '(?i)_capacitor_http_interceptor_(/?\?u=|(%2f)?%3fu(%3d|=))https?(:|%(25)?3a)'

  - id: capacitor-http-interceptor-upstream-html
    for: [html]
    desc: HTML embeds Capacitor proxy upstream URL
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)_capacitor_http_interceptor_(/?\?u=|(%2f)?%3fu(%3d|=))https?(:|%(25)?3a)'

composite_rules:
  - id: capacitor-interceptor-upstream-target
    for: [scripts, source, html]
    desc: Capacitor HTTP proxy carries upstream target
    any:
      - id: capacitor-http-interceptor-upstream-url
      - id: capacitor-http-interceptor-upstream-html
