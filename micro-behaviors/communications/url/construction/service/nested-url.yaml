defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
traits:
  - id: nested-http-target-url
    desc: HTTP URL embeds another HTTP target URL
    conf: 0.94
    # Archive replay, conversion, and fetch services carry a second URL in
    # their path or query. This establishes URL structure, not proxy execution.
    if:
      type: literal
      kind: string
      regex: '(?i)https?://[^\s"''<>]{1,512}(/|=)https?(:|%3a)(//|%2f%2f)'
