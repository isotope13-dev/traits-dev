defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
traits:
  - id: script-url-nonreserved-target
    desc: Script URL option names nonreserved HTTP host
    conf: 0.9
    if:
      type: text
      regex: '(?i)\burl\s*:\s*["'']https?://[^/"''\s]{1,120}'
    not:
      - regex: '(?i)\.(invalid|example|test|localhost)(:[0-9]+)?$'
