defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
traits:
  - id: js-fragmented-url-domain-part
    desc: Fragmented URL Domain Part (JS)
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: 'bil.gen.asl.a'

  - id: indexof-path-slash-arg
    desc: Searches string for a forward-slash delimiter
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      regex: '(^|\.)indexOf$'
      arg:
        index: 0
        kind: string
        exact: "/"

  - id: indexof-https-scheme-offset
    desc: indexOf searches past https:// scheme offset
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)indexOf$'
      arg:
        index: 1
        kind: number
        value: 8

  - id: indexof-http-scheme-offset
    desc: indexOf searches past http:// scheme offset
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)indexOf$'
      arg:
        index: 1
        kind: number
        value: 7

composite_rules:
  - id: url-authority-slash-slice-splice
    desc: Slices URL authority using scheme slash offset
    crit: notable
    conf: 0.93
    near_bytes: 120
    all:
      - id: indexof-path-slash-arg
      - id: micro-behaviors/data/string/access::js-substring-call
    any:
      - id: indexof-https-scheme-offset
      - id: indexof-http-scheme-offset
