# A URL written one byte at a time into a local buffer so no "http://" string
# exists in the file. The 'p' is stored from a register (compilers reuse a
# register already holding 0x70) or as an immediate.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: stack-built-http-scheme-register-p
    desc: Byte-stored http:// with register p
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: text
      pattern: C6 44 24 ?? 68 C6 44 24 ?? 74 C6 44 24 ?? 74 88 ?? 24 ?? C6 44 24 ?? 3A C6 44 24 ?? 2F C6 44 24 ?? 2F
  - id: stack-built-http-scheme-immediate-p
    desc: Byte-stored http:// with immediate p
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: text
      pattern: C6 44 24 ?? 68 C6 44 24 ?? 74 C6 44 24 ?? 74 C6 44 24 ?? 70 C6 44 24 ?? 3A C6 44 24 ?? 2F C6 44 24 ?? 2F
