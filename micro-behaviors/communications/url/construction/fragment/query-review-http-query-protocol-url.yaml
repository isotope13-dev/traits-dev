defaults:
  for:
  - scripts
  - source
  - binaries
  - data
  - text
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.98

traits:
  - id: protocol-field-full-http-url
    desc: Protocol field assigned a full HTTP URL
    if:
      type: text
      # Ruby/PHP hash arrows, URL-encoded delimiters, and HTTP(S) are equivalent field spellings.
      regex: '[pP]rotocol["'']?\s*[:=]>?\s*\(?["'']?https?(:|%3[aA]|%253[aA])(/|%2[fF]|%252[fF]){2}'
      exclude_comments: true
  - id: protocol-query-interpolated-value
    desc: Protocol query field uses variable interpolation
    conf: 0.92
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '[?&"'']protocol=(%[sdv]|[$%][{\w]|\{)'
      exclude_comments: true
  - id: protocol-param-setter
    desc: Calls a protocol parameter setter
    conf: 0.92
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '\.([sS]et|[aA]dd|append)\(\s*["'']protocol["'']\s*,'
      exclude_comments: true
  - id: protocol-field-identifier-value
    desc: Protocol field uses an identifier
    conf: 0.92
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '["'']protocol["'']\s*:\s*[a-zA-Z_$][\w$]{0,79}\b'
      exclude_comments: true
    not:
      - regex: '(?i):\s*(true|false|null|None)$'

composite_rules:
  - id: protocol-param-setter-or-dict
    desc: Protocol setter or variable-valued field
    conf: 0.92
    for: [scripts, source, binaries]
    any:
      - id: protocol-param-setter
      - id: protocol-field-identifier-value
  - id: protocol-query-parameter-assignment
    desc: Protocol parameter setter or interpolation
    conf: 0.92
    for: [scripts, source, binaries]
    any:
      - id: protocol-query-interpolated-value
      - id: protocol-param-setter-or-dict
