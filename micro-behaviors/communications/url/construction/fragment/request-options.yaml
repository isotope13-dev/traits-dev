defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: url-hostname-option
    desc: Request options use a hostname property
    conf: 0.96
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((pair key: (property_identifier) @key
          value: (member_expression property: (property_identifier) @hostname))
          (#eq? @key "hostname") (#eq? @hostname "hostname"))
  - id: url-path-search-option
    desc: Request path appends matching URL query string
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((pair key: (property_identifier) @path
          value: (binary_expression left:
            (member_expression object: (identifier) @url property: (property_identifier) @pathname)
            operator: "+"
            right: (member_expression object: (identifier) @url2 property: (property_identifier) @search)))
          (#eq? @path "path") (#eq? @url @url2)
          (#eq? @pathname "pathname") (#eq? @search "search"))
