defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
traits:
- id: qr-callback-remote-image-url
  desc: QR callback builds remote image URL
  if:
    type: tree-sitter
    query: |
      ((call_expression
      function: [(member_expression
      property: (property_identifier) @on) (subscript_expression  index: (string (string_fragment) @on))]
      arguments: (arguments
      .
      (string
      (string_fragment) @event)
      (arrow_function
      parameters: (formal_parameters
      (identifier) @qr_input)
      body: (statement_block
      (lexical_declaration
      (variable_declarator
      name: (identifier) @url_decl
      value: (template_string
      (string_fragment) @url_prefix
      (template_substitution
      (call_expression
      function: (identifier) @encoder
      arguments: (arguments
      .
      (identifier) @qr_used))))))
      (if_statement
      consequence: (statement_block
      (expression_statement
      (call_expression
      function: [(member_expression
      object: [(member_expression
      property: (property_identifier) @view) (subscript_expression  index: (string (string_fragment) @view))]
      property: (property_identifier) @post) (subscript_expression object: [(member_expression
      property: (property_identifier) @view) (subscript_expression  index: (string (string_fragment) @view))] index: (string (string_fragment) @post))]
      arguments: (arguments
      .
      (object
      (pair
      value: (identifier) @url_posted)))))))))))
      (#eq? @on "on") (#eq? @event "qr") (#eq? @qr_input @qr_used)
      (#eq? @url_decl @url_posted) (#eq? @encoder "encodeURIComponent")
      (#eq? @view "webview") (#eq? @post "postMessage")
      (#match? @url_prefix "(?i)^https?://[^/?#\\s]+/")
      (#not-match? @url_prefix "(?i)^https?://(localhost|127([.][0-9]+){3}|\\[::1\\])(:[0-9]+)?/")
      (#not-match? @url_prefix "(?i)^https?://([a-z0-9-]+[.])*whatsapp[.](com|net)(:[0-9]+)?/")
      )
