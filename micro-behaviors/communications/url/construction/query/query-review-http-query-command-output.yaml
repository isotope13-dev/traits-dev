defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable

traits:
  - id: command-output-query-encoding
    desc: URI-encodes out value beside cmd query field
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: 'cmd=[^"\r\n]{1,40}&out=["'']\s*\+\s*encodeURIComponent\('
  - id: cmd-out-query-encoded-output-text
    desc: cmd/out query fields near URI encoding
    conf: 0.98
    if:
      type: text
      regex: 'cmd=.{0,80}&out=.{0,80}encodeURIComponent\s*\('
