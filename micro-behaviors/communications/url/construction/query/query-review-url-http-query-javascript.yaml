defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: encoded-query-parameter
    desc: Encodes a value into a query parameter
    crit: notable
    conf: 0.86
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\?data=[''"]?\s*\+\s*encodeURIComponent\('
  # Script/image beacons often smuggle a payload as `?key=' + btoa(secret)`.
  # Distinct from encodeURIComponent query encoding above.
  - id: btoa-query-parameter
    desc: Concatenates btoa() into a query parameter
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '[?&][A-Za-z_][\w-]{0,24}=[''"]?\s*\+\s*btoa\s*\('
  - id: encoded-template-query-parameter
    desc: Encodes value in a URL query template
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      node: template_string
      regex: '[?&][A-Za-z][A-Za-z0-9_-]{0,40}=\$\{encodeURIComponent\('
  - id: function-result-template-query-parameter
    desc: URL query template interpolates function result
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      node: template_string
      regex: '[?&][A-Za-z][A-Za-z0-9_-]{0,40}=\$\{[A-Za-z_$][A-Za-z0-9_$]*\s*\([^}]{1,160}\)\}'
  - id: oversized-repeated-query-value
    desc: Builds oversized repeated URL query value
    crit: suspicious
    conf: 0.95
    for: [html, javascript, typescript]
    unless:
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
    if:
      type: text
      regex: '\?[A-Za-z][\w-]{0,15}=.{0,64}\.repeat\([1-9][0-9]{4,6}\)'
  - id: query-parameter-mutation
    desc: Mutates a URL query parameter collection
    crit: notable
    conf: 0.82
    for: [html, javascript, typescript]
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\b(params|searchParams)\.(set|append)\s*\('
  - id: stored-email-url-query
    desc: URI-encodes mail-named member into query
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[?&]mail=\$\{encodeURIComponent\([^)]{0,80}\.mail\)\}'
  - id: js-urlsearchparams-construction
    desc: Constructs a URL query parameter object
    crit: notable
    conf: 0.95
    for:
    - html
    - javascript
    - typescript
    if:
      type: text
      regex: \bnew\s+URLSearchParams\s*\(
  - id: query-iteration-append-context
    desc: URLSearchParams near forEach and append calls
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: 'URLSearchParams[\s\S]{0,400}\.forEach[\s\S]{0,300}\.append\s*\('
  - id: bracket-searchparams-append
    desc: Appends query via bracket searchParams access
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\[["'']searchParams["'']\]\[["'']append["'']\]\s*\('
  - id: urlsearchparams-base64-append
    desc: Sets Base64-encoded URLSearchParams value
    crit: notable
    conf: 0.92
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\.(set|append)\s*\([^,\r\n]{1,28},\s*(btoa|[A-Za-z_$]\w*(Base64|B64))\s*\('
  - id: urlsearchparams-buffer-base64-value-call
    desc: Passes Buffer value to query setter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.(set|append)\s*\([^,\r\n]{1,40},\s*Buffer\.from\('



composite_rules:
  - id: urlsearchparams-buffer-base64-value
    desc: Sets query value from Buffer Base64
    crit: notable
    conf: 0.9
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/url/construction/query::urlsearchparams-buffer-base64-value-call
      - id: micro-behaviors/data/encode/base64/primitive::buffer-base64-conversion
  - id: query-object-joined-lists-context
    desc: Query object near joined files and vars fields
    crit: notable
    conf: 0.98
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
      - id: micro-behaviors/data/string/concat/join::files-field-joined-list
      - id: micro-behaviors/data/string/concat/join::vars-field-joined-list
