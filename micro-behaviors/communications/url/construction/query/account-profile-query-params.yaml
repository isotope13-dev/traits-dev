# A query string built from an object carrying an account's email together
# with a balance/funds field: user account and money data packed into a GET.
traits:
  - id: email-and-balance-query-params
    desc: Builds query params with email and balance
    crit: notable
    conf: 0.88
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: 'URLSearchParams\(\{[^}]{0,200}\bemail\s*:[^}]{0,200}\bbalance\s*:'
