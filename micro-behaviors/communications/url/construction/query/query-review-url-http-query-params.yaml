defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: dynamic-object-id-query
    desc: Interpolates an object-ID into a URL query
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      # Require ${x} or {x} interpolation — static ?id=page URLs must not match.
      # Require the bare `id` or `object_id` query key. Names like `video_id`,
      # `feed_id`, or `user_id` are ordinary REST parameters, not generic
      # object-ID enumeration.
      regex: 'https?://[^"''`\s]{1,160}[?&](object_)?id=(\$\{|\{)[A-Za-z_$][\w$]*'
    not:
      - substr: drive.usercontent.google.com
      - substr: drive.google.com
    unless:
      # GA4 Measurement Protocol (.../mp/collect?measurement_id=${id}).
      - id: micro-behaviors/communications/http/services/analytics::ga4-measurement-protocol-id-query

  - id: dynamic-object-id-query-concat
    desc: Concatenates an object-ID into a query
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      # Require the bare `id` query key. Names like `feed_id` or `user_id`
      # are ordinary REST parameters, not generic object-ID enumeration.
      type: text
      regex: '[?&]id=["'']?\s*\+\s*[A-Za-z_$]'
    not:
      - regex: '[?&]id=["'']?\s*\+\s*encodeURI(Component)?\b'
    unless:
      # Yandex Translate widget session ids (...tr-url-widget&id="+c+"-0-0).
      - id: micro-behaviors/communications/http/services/yandex::yandex-translate-widget-id-query
      # Google Tag Manager / gtag.js loader (...gtag/js?id="+measurementId).
      - id: micro-behaviors/communications/http/services/analytics::gtag-js-measurement-id-query
      # Classic GTM snippet (...gtm.js?id='+i).
      - id: micro-behaviors/communications/http/services/analytics::gtm-js-container-id-query
      # GA4 Measurement Protocol (.../mp/collect?measurement_id=${id}).
      - id: micro-behaviors/communications/http/services/analytics::ga4-measurement-protocol-id-query

  - id: obfuscated-add-parameter-construction
    desc: Constructs add parameter from object properties
    if:
      type: encoded
      regex: '[?&]\{[^:]+:[''"]a[''"]\}\.[a-zA-Z0-9_$]+\+\{[^:]+:[''"]d[''"]\}\.[a-zA-Z0-9_$]+'
  - id: mac-query-param-format
    desc: URL query includes formatted MAC address
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[?&]mac=%02X-%02X-%02X-%02X-%02X-%02X'
  - id: interpolated-type-data-query
    desc: Interpolates type and data query values
    crit: notable
    conf: 0.92
    attack: T1041
    for: [javascript]
    if:
      type: text
      regex: '\?type=\$\{[^}]{1,80}\}&data=\$\{[^}]{1,80}\}'

