defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
traits:
  - id: url-query-whoami-subshell
    desc: URL query has whoami command substitution
    crit: suspicious
    conf: 0.97
    attack: T1033
    if:
      type: text
      regex: "[?&]user=\\$\\(whoami\\)"

    unless:
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
