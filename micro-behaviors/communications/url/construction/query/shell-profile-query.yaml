defaults:
  for: [shell]
  platforms: [unix, windows]
  attack: T1195.002,T1041,T1082
traits:
- id: shell-query-hostname-command
  desc: URL query contains hostname command
  crit: component
  if:
    type: text
    regex: 'https?://[^\s"\x27?]{1,300}\?[^\s"\x27]{0,200}\$\(hostname\)'
- id: shell-query-whoami-command
  desc: URL query contains whoami command
  crit: component
  if:
    type: text
    regex: 'https?://[^\s"\x27?]{1,300}\?[^\s"\x27]{0,200}\$\(whoami\)'
- id: shell-query-profile-variables
  desc: URL query contains host and user variables
  crit: component
  if:
    type: text
    regex: '[?&](host|hostname)=\$[A-Za-z_]\w{0,63}&(user|whoami)=\$[A-Za-z_]\w{0,63}'
