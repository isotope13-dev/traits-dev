defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  conf: 0.9

traits:
  - id: formatted-identifier-query-value
    desc: URL query formats identifier value
    if:
      type: text
      regex: '\?[^"''\r\n]{1,40}=\{\}["'']\.format\(\s*[A-Za-z_]\w*\s*\)'

  - id: interpolated-identifier-query-value
    desc: URL query interpolates an identifier value
    if:
      type: text
      regex: '\?[^"''\r\n]{1,40}=\{[A-Za-z_]\w*\}'




composite_rules:
  - id: python-runtime-query-construction
    desc: Query serialization or interpolation in Python
    any:
      - id: micro-behaviors/communications/url/construction/query::formatted-identifier-query-value
      - id: micro-behaviors/communications/url/construction/query::interpolated-identifier-query-value
      - id: micro-behaviors/communications/http/lib/urllib::appended-urlencode-query-value
      - id: micro-behaviors/communications/url/construction/query::query-serializer-call
