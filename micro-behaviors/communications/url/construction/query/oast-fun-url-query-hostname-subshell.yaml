defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
traits:
  - id: url-query-hostname-subshell
    desc: URL query has hostname command substitution
    crit: suspicious
    conf: 0.97
    attack: T1082
    if:
      type: text
      regex: "[?&]hostname=\\$\\(hostname\\)"

    unless:
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
