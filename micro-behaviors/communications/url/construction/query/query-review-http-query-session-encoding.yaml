defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  crit: notable
  size_max: 524288

composite_rules:
- id: cookie-session-query-encoding-cooccurrence
  desc: Cookie/session query key near value encoding
  conf: 0.88
  all:
  - id: micro-behaviors/communications/url/query/credential::cookie-session-query-key-reference
  - id: micro-behaviors/data/encode/url::session-value-uri-encoded
  any:
  - id: micro-behaviors/data/encode/url::cookie-session-argument
  - id: micro-behaviors/data/encode/url::session-identifier-encode-argument
  near_bytes: 240
