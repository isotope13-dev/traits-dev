defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable

traits:
  - id: quoted-command-field-template
    desc: Command-named query field has function template
    conf: 0.9
    if:
      type: literal
      exclude_docstrings: true
      regex: '[?&](c|cmd|command)=\{[\w.]+\([^}]{1,120}\)\}'
