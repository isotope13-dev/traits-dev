defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

traits:
  - id: encoded-dynamic-url-query-value
    desc: Adds an encoded value to URL query
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[?&][A-Za-z][A-Za-z0-9_.-]{0,40}=["'']\s*\+\s*encodeURIComponent\s*\('
  - id: version-nuuid-query-format
    desc: Formats version and nuuid query fields
    crit: baseline
    conf: 0.9
    for: [pe]
    if:
      type: text
      exact: 'v=%s&nuuid=%s'
  - id: urlsearchparams-timestamp-field
    desc: Adds a timestamp URL query parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'searchParams\.set\(\s*[''\"]timestamp[''\"]'
  - id: urlsearchparams-instance-name-field
    desc: Adds an instanceName URL query parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'searchParams\.set\(\s*[''\"]instanceName[''\"]'
  - id: urlsearchparams-ip-field
    desc: Adds an IP URL query parameter
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'searchParams\.set\(\s*[''\"]ip[''\"]'
  - id: urlsearchparams-engine-field
    desc: Adds an engine URL query parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'searchParams\.set\(\s*[''\"]engine[''\"]'
  # Ordered chunk-upload query fields (uid/part/total/data). Neutral upload
  # mechanics shared by resumable-upload protocols; exfiltration intent comes
  # from composites that pair it with a collection source.
