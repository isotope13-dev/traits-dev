# URLs whose path or query embeds a template placeholder that is filled in at
# render time (`{{x}}`, `${x}`, `<x>`, `%3cx%3e`).  This is plain URL
# construction: documentation, mustache/Handlebars/Vue templates, CI badge URLs
# and JS template literals all do it, so each atom is a neutral `notable`
# observation of "this URL is built from a runtime value".
#
# The exfiltration reading -- a remote *image* URL whose query carries page data
# -- is supplied by the composites that combine these with an image source and
# an image extension (micro-behaviors/data/format/html::remote-image-data-template,
# micro-behaviors/communications/http/url/query::ai-prompt-image-template-url-markup).
defaults:
  for: [html, markdown]
  platforms: [unix, windows]
  crit: notable
  conf: 0.94

traits:
  - id: url-double-brace-placeholder
    desc: URL embeds a {{ }} template placeholder
    if:
      type: text
      regex: '(?i)https?://[^ \t\r\n"<>]{1,220}\{\{[^}\r\n]{1,80}\}\}'

  - id: url-dollar-placeholder
    desc: URL embeds a ${ } template placeholder
    if:
      type: text
      regex: '(?i)https?://[^ \t\r\n"<>]{1,220}\$\{[^}\r\n]{1,80}\}'

  - id: url-angle-placeholder
    desc: URL embeds an angle-bracket placeholder
    if:
      # The placeholder has to sit at a URL structural boundary (`/`, `?`, `&`
      # or `=`).  Without that anchor the pattern also matched a bare URL
      # followed by a closing markup tag -- `<a ...>https://example.com</a>` in
      # any README -- which says nothing about the URL itself.
      type: text
      regex: '(?i)https?://[^ \t\r\n"<>]{1,200}[/=?&]<[a-z0-9_.-]{1,60}>'

  - id: url-encoded-angle-placeholder
    desc: URL embeds a percent-encoded <> placeholder
    if:
      type: text
      regex: '(?i)https?://[^ \t\r\n"<>]{1,220}%3c[^%\r\n]{1,80}%3e'
