defaults:
  platforms: [android]
  for: [java, kotlin, csharp, javascript, typescript, dex]
  crit: notable
  conf: 0.9

traits:
  - id: android-uri-parse-dynamic-tel
    desc: Android tel URI parse concatenates a value
    conf: 0.88
    for: [java, kotlin, csharp, javascript, typescript]
    if:
      type: text
      regex: '(?i)Uri\.parse\s*\(\s*["]tel:\s*["]\s*\+\s*\w+'

  - id: android-uri-fromparts-dynamic-tel
    desc: Android tel URI fromParts receives a value
    conf: 0.88
    for: [java, kotlin, csharp, javascript, typescript]
    if:
      type: text
      regex: '(?i)Uri\.fromParts\s*\(\s*["]tel["]\s*,\s*\w+'

