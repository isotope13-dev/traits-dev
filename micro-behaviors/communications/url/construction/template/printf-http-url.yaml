defaults:
  for:
  - shell
  platforms:
  - unix
  crit: notable
  conf: 0.97

traits:
  - id: printf-http-url-format
    desc: printf outputs an HTTP URL prefix
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '^(h|\\150|\\x68)(t|\\164|\\x74)(t|\\164|\\x74)(p|\\160|\\x70)(s|\\163|\\x73)?(:|\\072|\\x3a)(/|\\057|\\x2f)(/|\\057|\\x2f)'
  - id: printf-http-url-percent-b
    desc: printf outputs an HTTP URL prefix
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '^(h|\\150|\\x68)(t|\\164|\\x74)(t|\\164|\\x74)(p|\\160|\\x70)(s|\\163|\\x73)?(:|\\072|\\x3a)(/|\\057|\\x2f)(/|\\057|\\x2f)'





composite_rules:
  - id: printf-http-url
    desc: printf outputs an HTTP URL prefix
    conf: 0.97
    any:
      - id: micro-behaviors/communications/url/construction/template::printf-http-url-format
      - id: micro-behaviors/communications/url/construction/template::printf-http-url-percent-b
