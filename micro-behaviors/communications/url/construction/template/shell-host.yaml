# A shell URL template does not establish a request or download.
defaults:
  platforms: [unix, android, ios]
  for: [shell]
  crit: notable
  conf: 0.88
traits:
  - id: shell-variable-host-url
    desc: HTTP URL host contains shell variable
    if:
      type: text
      regex: '(?i)\bhttps?://\$\{?[A-Za-z_]\w*\}?'
