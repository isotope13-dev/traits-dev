defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1114

traits:
  - id: same-origin-mail-url-build
    desc: "Origin or path near mail URL action"
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: window\.location\.(origin|pathname).{0,120}_task=mail
