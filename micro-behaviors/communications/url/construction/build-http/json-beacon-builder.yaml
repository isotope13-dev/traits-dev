defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: json-beacon-literal-url-builder
    desc: JSON beacon calls a literal URL builder
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @builder
              value: (arrow_function body: (string) @url)))
          (function_declaration
            body: (statement_block
              (try_statement
                body: (statement_block
                  (expression_statement
                    (call_expression
                      function: (member_expression
                        object: (identifier) @navigator
                        property: (property_identifier) @send)
                      arguments: (arguments .
                        (call_expression function: (identifier) @callee) .
                        (call_expression
                          function: (member_expression
                            object: (identifier) @json
                            property: (property_identifier) @serialize)))))))))) @beacon
          (#eq? @builder @callee)
          (#eq? @navigator "navigator")
          (#eq? @send "sendBeacon")
          (#eq? @json "JSON")
          (#eq? @serialize "stringify")
          (#match? @url "^[\"']https?://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}[/\"':]"))

composite_rules:
  - id: external-ip-json-beacon-builder
    desc: JSON beacon URL builder embeds external IP
    scope: file
    near_bytes: 1024
    all:
      - id: json-beacon-literal-url-builder
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
