defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  # A runtime interpolation in a callback URL carries data in the request
  # target itself. Keep this neutral; objective rules bind it to a source and
  # an outbound request.
  - id: webhook-template-interpolated-path
    desc: Interpolates data into webhook URL path
    conf: 0.95
    if:
      type: literal
      regex: 'webhook\.site/[0-9a-f-]{36}/[^`]{0,120}\$\{[A-Za-z_$][A-Za-z0-9_$]*\}'

  - id: http-url-template-literal
    desc: Builds an HTTP URL with interpolation
    if:
      type: literal
      regex: 'https?://[^`''"]{1,160}\$\{[A-Za-z_$][A-Za-z0-9_$]*\}'
  # Relocated from objectives/exfiltration/dns/encoded: the matcher only sees
  # `'http(s)://' + variable +` string concatenation -- neutral URL
  # construction with no exfiltration intent of its own. The OAST-subdomain
  # composites in objectives/ reference it cross-directory and supply the
  # intent there.
  - id: js-http-prefix-variable-concat
    desc: HTTP URL prefix concatenated with variable
    if:
      type: tree-sitter
      kind: binary_op
      regex: '[''"]https?://[''"]\s*\+\s*[A-Za-z_$][\w$]{0,40}\s*\+'
