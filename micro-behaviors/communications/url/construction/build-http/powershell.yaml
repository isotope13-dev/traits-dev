# PowerShell request targets assembled from a variable rather than written as
# a literal URL. Neutral on its own — parameterised base URLs are ordinary in
# admin and installer scripts — but it records that the destination host is not
# statically visible in the script, which C2 composites pair with the source of
# that variable (a dead-drop page, a decoded blob, a config read).
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9
  attack: T1071.001

traits:
  - id: webclient-interpolated-target
    desc: WebClient request to an interpolated URL
    if:
      type: text
      regex: '(?i)\.(Download|Upload)(String|Data|File)\(\s*"\$[A-Za-z_{(]'

  - id: web-cmdlet-interpolated-uri
    desc: Web cmdlet -Uri built from a variable
    if:
      type: text
      regex: '(?i)-Uri\s+"\$[A-Za-z_{(]'
