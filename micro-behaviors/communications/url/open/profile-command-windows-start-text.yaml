---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
  - makefile
traits:
- id: batch-starts-url
  desc: Batch text names start and URL
  conf: 0.95
  for:
  - batch
  if:
    type: text
    regex: "(?im)^\\s*start\\s+https?://.{1,200}$"
- id: batch-starts-multiple-urls
  desc: Batch text repeats start and URL
  conf: 0.97
  for:
  - batch
  count_min: 2
  if:
    type: text
    regex: "(?im)^\\s*start\\s+https?://.{1,200}$"
- id: batch-starts-bare-web-host
  desc: Batch text names start and web host
  conf: 0.93
  for:
  - batch
  if:
    type: text
    regex: "(?im)^\\s*start\\s+www\\.\\S{1,120}\\s*$"
