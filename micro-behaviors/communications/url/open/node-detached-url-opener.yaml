defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-detached-open-url
    desc: Detached Node launch opens an external URL
    conf: 0.9
    if:
      type: text
      regex: "spawn\\(['\"]open['\"][^)]{0,200}https?://[^)]{0,100}detached\\s*:\\s*true"
  - id: node-detached-xdg-open-url
    desc: Detached Node launch opens an external URL
    conf: 0.9
    if:
      type: text
      regex: "spawn\\(['\"]xdg-open['\"][^)]{0,200}https?://[^)]{0,100}detached\\s*:\\s*true"
