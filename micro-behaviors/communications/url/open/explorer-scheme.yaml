defaults:
  crit: notable
  conf: 0.96
  platforms: [windows]
  for: [scripts, source]
  attack: T1202

traits:
  - id: explorer-custom-uri-launch
    desc: Explorer launches a custom URI scheme
    if:
      type: text
      # Quotes may be doubled when this command is embedded in VBScript.
      regex: '(?i)\bexplorer(\.exe)?\s+["'']{0,4}[a-z][a-z0-9+.-]{1,31}://[a-z0-9]'
