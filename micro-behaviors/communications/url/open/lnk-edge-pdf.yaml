defaults:
  platforms: [windows]
  for: [lnk]

traits:
- id: lnk-start-edge-remote-pdf-command
  desc: LNK START Edge remote-PDF command
  crit: notable
  conf: 0.94
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)\bstart\s+msedge(\.exe)?\s+"https?://[^"\s]{1,180}\.pdf([?#][^"\s]*)?"'
