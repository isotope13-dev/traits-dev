defaults:
  for: [applescript]
  platforms: [macos]
traits:
- id: open-location
  desc: open location (Apple Event)
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: syso.open
- id: open-url
  desc: open URL (Apple Event)
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: syso.surl
- id: get-url
  desc: get URL (Apple Event)
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: syso.GUrl
- id: open-location-cmd
  desc: open location (command)
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: open location
- id: open-url-cmd
  desc: open URL (command)
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: open URL
composite_rules:
- id: opens-url
  desc: Opens URL or location
  crit: notable
  conf: 0.85
  any:
  - id: open-location
  - id: open-url
  - id: get-url
  - id: open-location-cmd
  - id: open-url-cmd
