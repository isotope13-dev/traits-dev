defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: named-bin-url-path
    desc: HTTP URL references a named /bin/ path
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      # A URL that *ends* at `/bin` is a toolchain/directory index
      # (kernel.org crosstool `.../files/bin`). Dropper endpoints fetch a
      # named payload under `/bin/`.
      regex: 'https?://[^\s''"<>|`\\]{1,80}/bin/[A-Za-z0-9._-]{1,64}'
    not:
      - regex: '/local/bin/'
      # Help-center article links (`support.google.com/a/bin/answer.py?answer=N`,
      # Blogger Help) use `/bin/answer.py` as a CGI page name, not a payload.
      - regex: '/bin/answer\.py$'
      - regex: 'dl\.k8s\.io\b'
      # Official Julia distribution mirror: language-toolchain provisioners
      # fetch compilers from julialang-s3.julialang.org/bin/<platform>/,
      # which is release infrastructure, not a payload endpoint.
      - regex: 'julialang-s3\.julialang\.org'
      # Source-file view pages (github blob URLs) serve HTML, never a
      # fetchable payload: a `/bin/` source directory cited in a docstring
      # or comment is documentation, not a download endpoint.
      - regex: 'github\.com/[^/''"\s]+/[^/''"\s]+/blob/'
      # RFC 2606 reserved example domains in documentation examples.
      - regex: 'example\.(com|org|net|edu)\b'
      # An elided path segment (`.../main/bin/tool.sh`) is a usage sketch in a
      # docstring, not an address anything can fetch.
      - regex: '/\.\.\./'
      # TWiki/Foswiki serve every wiki page through its CGI directory
      # (`.../twiki/bin/view/<Web>/<Topic>`), so a project homepage on one is
      # a page URL, not a downloadable payload.
      - regex: '(?i)/(twiki|foswiki)/bin/'
    unless:
      - id: metadata/package/testing/terminology::test-code-declaration-text
      - id: metadata/package/testing/presence/harness/
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      - id: metadata/path::test-directory-component
