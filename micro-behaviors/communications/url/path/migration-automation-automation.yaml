defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - json
traits:
- id: workflow-api-v1-path
  desc: Workflow API v1 path text
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)/api/v1/workflows\b
- id: credential-api-v1-path
  desc: Credential API v1 path text
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)/api/v1/credentials\b
  unless:
  - id: metadata/file/format/news::serialized-news-article-catalog
- id: execution-include-data-api-path
  desc: Execution API include-data query text
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)/api/v1/executions\?.{0,80}\bincludeData\s*=\s*true\b
- id: workflow-api-activation-path
  desc: Workflow API activation path text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)/api/v1/workflows/.{1,160}/activate\b
