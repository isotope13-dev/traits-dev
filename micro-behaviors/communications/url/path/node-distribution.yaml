defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
- id: node-version-path-segment
  desc: Node.js node-v version path segment
  crit: notable
  if:
    type: literal
    regex: node-v[0-9]
composite_rules:
- id: node-distribution-version-url
  desc: Node distribution host and version path co-occur
  crit: notable
  all:
  - id: micro-behaviors/communications/http/url/domain::nodejs-distribution-url
  - id: node-version-path-segment
