# Remote SystemSettings executable URL path.
defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  crit: suspicious
  conf: 0.95

traits:
  - id: systemsettings-url-payload
    desc: Remote SystemSettings executable URL
    if:
      type: text
      regex: '(?i)https?://[^\r\n\"\x27\s]{1,160}/SystemSettings\.exe\b'
