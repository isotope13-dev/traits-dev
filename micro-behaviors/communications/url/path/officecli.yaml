# Endpoint references do not establish an agent skill or a download fallback.
# Moved from well-known/app/ai/knowledge/officecli-skills; scopes preserved.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.98

traits:
  - id: officecli-install-url
    desc: References OfficeCLI CDN installer URL
    if:
      type: text
      substr: 'd.officecli.ai/install'

  - id: officecli-repository-url
    desc: References OfficeCLI GitHub repository URL
    if:
      type: text
      regex: 'github\.com/iOfficeAI/OfficeCLI([/#?\s>)]|$)'
