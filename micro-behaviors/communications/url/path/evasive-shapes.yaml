# URL syntax observations; neither shape establishes a compromised host.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9
traits:
  - id: dot-space-path-padding
    desc: URL pads path with dot-space segments
    if:
      type: text
      regex: '(/\.%20){3,40}/'
      exclude_html_comments: true
  - id: ip-host-user-path
    desc: IP URL addresses user home directory
    if:
      type: text
      is: valid_ip
      regex: 'https?://\d{1,3}(\.\d{1,3}){3}(:\d{1,5})?/~[A-Za-z0-9._-]{1,40}'
      exclude_html_comments: true
