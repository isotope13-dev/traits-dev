# Neutral observations moved from the OOMOL skill identity rules.
defaults:
  platforms: [unix, windows]
  for: [markdown]
  crit: notable
  conf: 0.98

traits:
  - id: oomol-cli-install-url
    desc: References OOMOL CLI installation URL
    if:
      type: text
      substr: 'cli.oomol.com/install'

  - id: oomol-oo-cli-repository-url
    desc: References OOMOL oo CLI repository URL
    if:
      type: text
      substr: 'github.com/oomol-lab/oo-cli'
