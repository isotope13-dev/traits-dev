    desc: .NET HTTP trigger endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(https?://[^\s"''<>/]{0,240}|["''][^\s"''<>]{0,160})/trigger([/?"''<>]|$)'

  - id: micro-behaviors/communications/url/path::pe-http-trigger-endpoint-token
    desc: HTTP trigger endpoint token
    crit: notable
    conf: 0.78
    for: [pe]
    if:
      type: text
      regex: '(?i)(https?://[^\s"''<>/]{0,240}|["''][^\s"''<>]{0,160})/trigger([/?"''<>]|$)'

  - id: micro-behaviors/communications/url/path::pe-trigger-activate-token
    desc: Trigger activate token
    crit: notable
    conf: 0.74
    for: [pe]
    if:
      type: text
      regex: '(?i)(https?://[^\s"''<>/]{0,240}|["''][^\s"''<>]{0,160})/activate([/?"''<>]|$)'

