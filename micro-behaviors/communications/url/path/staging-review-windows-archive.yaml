defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.84
traits:
- id: wininet-image-file-zip-path
  desc: Image or file ZIP URL path
  if:
    type: text
    regex: (?i)^/(images?|files?)/[^\s]{1,80}\.zip$
- id: wininet-download-zip-path
  desc: Download ZIP URL path
  if:
    type: text
    regex: (?i)^/downloads?/[^\s]{1,80}\.zip$
- id: wininet-upload-zip-path
  desc: Upload ZIP URL path
  if:
    type: text
    regex: (?i)^/uploads?/[^\s]{1,80}\.zip$
