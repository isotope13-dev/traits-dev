defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
traits:
  - id: submit-php-path-reference
    desc: References the submit.php URL path
    if:
      type: text
      substr: /submit.php
      section: .text
  - id: pixel-gif-path-reference
    desc: References the pixel.gif URL path
    if:
      type: text
      substr: /pixel.gif
      section: .text
  - id: utm-gif-path-reference
    desc: References the __utm.gif URL path
    if:
      type: text
      substr: /__utm.gif
      section: .text
  - id: ga-js-path-reference
    desc: References the ga.js URL path
    if:
      type: text
      substr: /ga.js
      section: .text
