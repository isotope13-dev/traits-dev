defaults:
  for:
  - html
  platforms:
  - windows
traits:
- id: packed-uri-file-arguments
  desc: Packed URI and local filename arguments
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: \]\("[a-z0-9]+://[^"\r\n]{1,96}","[^"\r\n]{1,40}",0\)
    exclude_html_comments: true
- id: percent-cab-exe-arguments
  desc: Percent-escaped CAB and executable arguments
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)%2Ecab%22%2C%20%22.{0,65}%5Cx65%5Cx78%5Cx65%22%2C%200
    exclude_html_comments: true
