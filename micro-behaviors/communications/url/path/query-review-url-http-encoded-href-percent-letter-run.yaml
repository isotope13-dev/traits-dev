defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  crit: suspicious
  conf: 0.9

traits:
  - id: href-percent-encoded-letter-run
    desc: Href path has percent-encoded letter run
    if:
      type: text
      regex: '(?i)href=["'']https?://[^"''\s]{1,80}/(%([46][1-9a-f]|[57][0-9a])){8,}'
