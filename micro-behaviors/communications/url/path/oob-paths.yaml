traits:
- crit: notable
  id: xss-report-callback
  conf: 0.85
  for:
  - scripts
  - -batch
  - -jcl
  - -lua
  - -perl
  - -applescript
  - -vbs
  - pe
  - go
  - rust
  - package.json
  desc: xss.report callback collection path
  if:
    type: text
    regex: xss\.report/(c|r)/[A-Za-z0-9_-]{3,80}\b
- crit: notable
  id: webhook-site-uuid-path
  conf: 0.98
  for:
  - javascript
  - typescript
  - shell
  - package.json
  desc: webhook.site UUID callback path
  if:
    type: text
    regex: webhook\.site/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
- crit: notable
  id: canarytokens-traffic-path
  conf: 0.95
  for:
  - scripts
  - -batch
  - -jcl
  - -lua
  - -perl
  - -applescript
  - -vbs
  - pe
  - go
  - rust
  - package.json
  desc: CanaryTokens traffic callback path
  if:
    type: text
    regex: canarytokens\.com/tags/traffic/[A-Za-z0-9_-]{8,}
defaults:
  platforms:
  - unix
  - windows
