defaults:
  platforms: [unix, windows]
  # Groups (not explicit types) so archive-scope composites can pool this
  # with manifest legs the way the discord webhook atoms do. No binaries:
  # the text-matcher file-type cap is 33.
  for: [scripts, source]
  crit: notable
  conf: 0.88
traits:
  - id: receiver-style-long-segment-a
    desc: Intake or upload path has long segment
    if:
      type: text
      # Include trailing word/path chars so hyphenated or dotted source paths
      # (e.g. /events/configuration-change-event.js) are captured in full and
      # excluded by `not:` rather than matching a 12-char prefix before `-`.
      regex: '/(intake|ingest|collect|upload)/[A-Za-z0-9]{12,}[-.\w]*'
    not:
      - regex: '[-_.]'
  - id: receiver-style-long-segment-b
    desc: Submit or events path has long segment
    if:
      type: text
      regex: '/(submit|inbox|drop|events?)/[A-Za-z0-9]{12,}[-.\w]*'
    not:
      - regex: '[-_.]'
composite_rules:
  - id: receiver-style-long-segment
    desc: Receiver-style URL path has a long segment
    any:
      - id: receiver-style-long-segment-a
      - id: receiver-style-long-segment-b
    unless:
      # Narrower than the whole testing/ directory on purpose: fixture PATH
      # references (fixtures/customer-record.json) are exactly what the
      # stealer composites pair this with, so the presence/manifest
      # fixture-name facts must not suppress it. Test harnesses and files
      # living under test/ directories stay excluded.
      - id: metadata/package/testing/harness/
      - id: "metadata/file/naming::test-directory-component"
