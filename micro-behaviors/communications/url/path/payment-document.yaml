# Payment and billing document names (fatura, invoice, receipt, recibo)
# in URL paths are common lure endpoints for phishing and payment scams.
# The URL path alone is a notable communication capability; intent comes from
# the redirection, masquerade, or credential-harvesting composites that consume it.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, text]
  crit: notable
  conf: 0.88
traits:
  - id: payment-lure-document-url
    desc: Payment lure document URL path
    if:
      type: text
      regex: '(?i)/(fatura|factura|invoice|recibo)[^/\s"''<>]{0,20}\.html?\b'
