defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: notable
  conf: 0.9
traits:
- id: applescript-https-scpt-url-text
  desc: AppleScript HTTPS SCPT URL text
  if:
    type: text
    regex: https://.{3,160}\.scpt\b
- id: applescript-https-update-path-url
  desc: AppleScript HTTPS update-style URL text
  if:
    type: text
    regex: https://[^/\n]{3,160}/(check|update|download|stage)\b
composite_rules:
- id: applescript-https-script-or-update-url
  desc: AppleScript HTTPS script or update URL
  any:
  - id: micro-behaviors/communications/url/path::applescript-https-scpt-url-text
  - id: micro-behaviors/communications/url/path::applescript-https-update-path-url
