defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - shell
  - elf
  - macho
  - pe
  - javascript
  - typescript
  crit: notable
  conf: 0.9

traits:
  - id: long-base64-like-path-segment
    desc: Path has long Base64-like segment
    # Require an HTTP URL or quoted path context. A bare slash inside an
    # armored signature or binary asset is not evidence of a URL path.
    # Exfiltration composites supply the hostile context.
    crit: component
    conf: 0.9
    for: [python, javascript, typescript, html, markdown, text, shell]
    if:
      type: text
      # A raw slash terminates a URL path segment; base64url represents it
      # with URL-safe characters. Exclude digest-only segments such as Git
      # commit IDs, which are identifiers rather than encoded payloads.
      regex: '(?i)(https?://|["''`(])\S*(/|%2f)[a-z0-9+_-]{24,}={0,2}([\s/"''?#&%]|$)'
    not:
      - substr: ";base64,"
      - regex: '(?i)(/|%2f)[0-9a-f]{32,64}([\s/"''?#&%]|$)'
      # Long lowercase package/file slugs also satisfy the URL-safe alphabet,
      # but several hyphen-separated words are human-readable paths rather
      # than encoded payloads.
      - regex: '(/|%2[fF])[a-z]{2,}(-[a-z]{2,}){2,}([\s/"''?#&%]|$)'

