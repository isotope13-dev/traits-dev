defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]

traits:
  - id: rust-generic-collect-url
    desc: HTTP collect URL reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'https?://[\s\S]{0,80}/collect([^A-Za-z]|$)'
  - id: routeros-collect-path-reference
    desc: Collect path near RouterOS reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/collect[\s\S]{0,520}RouterOS|RouterOS[\s\S]{0,520}/collect'
  - id: routeros-exfil-path-reference
    desc: Exfil path near RouterOS reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'RouterOS[\s\S]{0,260}/exfil|/exfil[\s\S]{0,260}RouterOS'
