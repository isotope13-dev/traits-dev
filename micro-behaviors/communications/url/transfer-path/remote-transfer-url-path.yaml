defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: remote-transfer-url-path
    desc: URL path names upload, backup or exfil
    crit: notable
    conf: 0.95
    for: [scripts, source, json, python, javascript, typescript, shell, powershell, ruby, perl, php]
    if:
      type: text
      regex: 'https?://[A-Za-z0-9._/-]{1,120}/(backup|upload|exfil)(/|["''])'
      case_insensitive: true
# `in.cgi?campaign` is the canonical traffic-direction-system (TDS) entry
# script: a redirector that decides which payload a visitor receives. It
# appears in injected or doorway delivery pages, not as an analytics or
# content endpoint.
