# Neutral SMB protocol constant. Clients and servers both set it, and an
# SMB server that requires signing is ordinary hardening. It becomes a relay
# signal only alongside other relay-chain evidence, so it stays a notable
# reference here and is never a verdict by itself.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.93

traits:
  - id: smb-signing-required-flag
    desc: SMB signing-required negotiate flag reference
    if:
      type: text
      substr: SMB2_NEGOTIATE_SIGNING_REQUIRED
