defaults:
  platforms: [windows, unix]
  for: [javascript, pe, dll]
  attack: T1219
  mbc: B0022

traits:
  - id: remote-file-transfer-method
    desc: Remote file transfer method
    crit: component
    conf: 0.9
    for: [javascript, typescript, powershell, python, pe, dll]
    if:
      type: text
      regex: "file\\.(send|receive|upload|download)"
  - id: remote-file-transfer-directory
    desc: Remote file transfer directory
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: remoteDirectory
  - id: remote-received-files-label
    desc: Remote received files label
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: received files
composite_rules:
  - id: remote-task-file-transfer-protocol
    desc: Remote-agent task and file-transfer protocol
    crit: notable
    conf: 0.94
    for: [javascript, typescript, powershell, python, pe, dll]
    all:
      - id: micro-behaviors/data/llm/tool-call::remote-agent-task-command
      - id: micro-behaviors/communications/transfer::remote-file-transfer-method
    near_bytes: 512
