# send_message is also used by SMTP clients, IPC helpers and C2 transports.
# Its name alone does not identify a chat platform or a network transmission.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-send-message-method-call
    desc: Python invokes a send_message helper
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)send_message$'
