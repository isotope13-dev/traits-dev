defaults:
  crit: notable
  for:
  - csharp
  - pe
  - dll
  - powershell
  - python
  - javascript
  platforms:
  - windows
  - linux
  - macos
  size_min: 512
  size_max: 500000000
traits:
- id: screenconnect-transfer-files-message-type
  desc: ScreenConnect file-transfer message type
  conf: 0.99
  if:
    type: text
    regex: \bScreenConnect\.TransferFilesMessage\b
- id: virtual-file-registration-method
  desc: RegisterVirtualFiles method reference
  conf: 0.97
  if:
    type: text
    word: RegisterVirtualFiles
- id: outgoing-message-enqueue-method
  desc: EnqueueOutgoingMessage method reference
  conf: 0.97
  if:
    type: text
    word: EnqueueOutgoingMessage
composite_rules:
- id: screenconnect-programmatic-run-file-transfer
  desc: ScreenConnect programmatic run-file transfer
  conf: 0.99
  all:
  - id: screenconnect-transfer-files-message-type
  - id: metadata/lang/source/syntax/member::file-action-run-reference
  - id: virtual-file-registration-method
  - id: outgoing-message-enqueue-method
  near_bytes: 2048
