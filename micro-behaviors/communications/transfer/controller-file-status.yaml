defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 10485760
  crit: notable
traits:
- id: controller-file-upload-status
  desc: File upload to remote controller status
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: "Uploading file to Controller:"
- id: file-download-status
  desc: File download status message
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: "Downloading file:"

composite_rules:
- id: controller-transfer-with-process-api
  desc: Controller transfer statuses beside process API
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/communications/transfer::controller-file-upload-status
  - id: micro-behaviors/communications/transfer::file-download-status
  - id: micro-behaviors/process/create/spawn::child-process-creation-api
