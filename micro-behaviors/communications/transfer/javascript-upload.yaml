defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: javascript-upload-method-call
    desc: Invokes an upload method or callback
    crit: notable
    conf: 0.86
    # Transport and destination are unknown for a supplied upload callback;
    # do not turn this into an HTTP request or an exfiltration claim.
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload$'
