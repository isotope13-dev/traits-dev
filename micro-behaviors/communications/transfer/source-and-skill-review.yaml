traits:
- id: cloud-copy-to-named-remote
  platforms:
  - windows
  - unix
  for:
  - shell
  - batch
  - powershell
  - dockerfile
  - github-actions
  desc: File-copy command names a remote
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?im)^[ \t]*[^/#;\s]\S*[ \t]+(copy|sync|move)[ \t]+.{1,40}[ \t]+\w+:\S+
