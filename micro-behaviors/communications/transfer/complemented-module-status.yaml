defaults:
  platforms: [windows]
  for: [pe]
traits:
  # Low bytes are complemented ASCII; high bytes contain unrelated noise.
  # The gap covers the byte count, path and line breaks between the statuses.
  - id: complemented-dll-upload-load-status
    desc: Complemented DLL upload and load status text
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .data
      pattern: 'BB ?? B3 ?? B3 ?? DF ?? 8C ?? 8A ?? 9C ?? 9C ?? 9A ?? 8C ?? 8C ?? 99 ?? 8A ?? 93 ?? 93 ?? 86 ?? [24-72] AB ?? 8D ?? 86 ?? 96 ?? 91 ?? 98 ?? DF ?? 8B ?? 90 ?? DF ?? 93 ?? 90 ?? 9E ?? 9B'
