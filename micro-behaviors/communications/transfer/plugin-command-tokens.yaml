# Complete protocol tokens. Binary text and parsed source constants have
# separate scopes so comments and documentation cannot supply source evidence.
defaults:
  platforms: [windows, unix]
  for: [binaries, source, python, javascript, powershell]
  crit: notable
  conf: 0.96
traits:
  - id: send-plugin-command-token-binary
    desc: Send-plugin request token in binary
    for: [binaries]
    if:
      type: text
      exact: sendPlugin

  - id: send-plugin-command-token-source
    desc: Send-plugin request token in source
    for: [source, python, javascript, powershell]
    if:
      type: literal
      exact: sendPlugin
      exclude_docstrings: true

  - id: save-plugin-command-token-binary
    desc: Save-plugin delivery token in binary
    for: [binaries]
    if:
      type: text
      exact: savePlugin

  - id: save-plugin-command-token-source
    desc: Save-plugin delivery token in source
    for: [source, python, javascript, powershell]
    if:
      type: literal
      exact: savePlugin
      exclude_docstrings: true

  - id: client-info-packet-token-binary
    desc: ClientInfo check-in packet token in binary
    for: [binaries]
    if:
      type: text
      exact: ClientInfo

  - id: client-info-packet-token-source
    desc: ClientInfo check-in packet token in source
    for: [source, python, javascript, powershell]
    if:
      type: literal
      exact: ClientInfo
      exclude_docstrings: true

composite_rules:
  - id: send-plugin-command-token
    desc: Send-plugin request token
    any:
      - id: send-plugin-command-token-binary
      - id: send-plugin-command-token-source

  - id: save-plugin-command-token
    desc: Save-plugin delivery token
    any:
      - id: save-plugin-command-token-binary
      - id: save-plugin-command-token-source

  - id: plugin-transfer-command-token
    desc: Save or send plugin command token
    any:
      - id: send-plugin-command-token
      - id: save-plugin-command-token

  - id: client-info-packet-token
    desc: ClientInfo check-in packet token
    any:
      - id: client-info-packet-token-binary
      - id: client-info-packet-token-source
