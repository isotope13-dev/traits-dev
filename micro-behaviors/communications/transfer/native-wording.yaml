defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]

traits:
  # Relocated from objectives/.../dropper/fake-update (staged-download-status):
  # a download result message is ordinary client logging; the fake-update
  # composite supplies the staging intent from its other legs.
  - id: download-result-status-message
    desc: Download success/failure status message
    crit: notable
    conf: 0.9
    for: [pe]
    platforms: [windows]
    if:
      type: text
      regex: 'Download (success|failure)'

  - id: native-upload-before-snapshot-language
    desc: Upload wording before snapshot/export
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(upload|send|post)\b.{0,40}\b(snapshot|export)\b'

  - id: native-snapshot-before-upload-language
    desc: Snapshot/export wording before upload
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(snapshot|export)\b.{0,40}\b(upload|send|post)\b'

composite_rules:
  - id: native-snapshot-upload-language
    desc: Snapshot/export linked to upload wording
    crit: notable
    conf: 0.96
    any:
      - id: native-upload-before-snapshot-language
      - id: native-snapshot-before-upload-language
