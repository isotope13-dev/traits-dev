# A call into a helper named Upload/Download/SendDataByPost in a Go package
# qualified as `utils`. The name `utils` is the most common Go package name,
# so this is neutral transfer capability, not exfiltration or C2 evidence;
# intent composites supply the required context.
defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe, go]

traits:
  - id: go-utils-transfer-helper-call
    desc: Calls a generic Go utils transfer helper
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])utils\.(Upload|Download|SendDataByPost)\s*\('
