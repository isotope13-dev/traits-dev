# BITS jobs can use HTTP or SMB; cancellation does not establish an HTTP request.
defaults:
  platforms: [windows]
  for: [scripts, pe, dll]
traits:
  - id: bitsadmin-cancel-command-text
    desc: BITSAdmin transfer cancellation command
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bbitsadmin(\.exe)?\s+/cancel\s+\S+'
