defaults:
  platforms: [unix, windows]
  for: [scripts, html, markdown, text, json, go, rust]
traits:
  - id: credential-send-phrase
    desc: Text discusses sending credentials to recipient
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^.{0,40}\b(send|upload) (the )?credentials? to\b'
    not:
      - regex: '(?i)\b(never|not|without)\b'
      - regex: '(?i)\brefus(e|ed|ing|al)\b'
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
      - id: well-known/app/ai/agent-runtime/aui-agent-builder::aui-agent-builder-package-context
  - id: llm-sensitive-term-secret
    desc: Instruction to send a secret or token
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^.{0,40}\b(send|upload|forward) the (secret|token)\b'
    not:
      - regex: '(?i)\btoken contract'
      - regex: '(?i)\b(never|not|without|don.t|doesn.t|didn.t|won.t|wouldn.t|can.t|cannot)\b'
      - regex: '(?i)\brefus(e|ed|ing|al)\b'
