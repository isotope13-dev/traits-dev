defaults:
  platforms: [vmcms]
  for: [text, data]

traits:
  - id: cms-send-exec-command
    desc: CMS EXEC send-command text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?im)^[ \t]*["'']SF[ \t]+\w+[ \t]+EXEC[ \t]+\w+[^\r\n]{0,48}\bAT\b'
  - id: cms-queued-contact-loop
    desc: CMS REXX drains queued records
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*DO[ \t]+WHILE[ \t]+QUEUED\(\)[ \t]*>[ \t]*0'
