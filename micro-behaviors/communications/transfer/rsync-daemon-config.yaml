defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: rsync-daemon-config-path
    desc: References rsync daemon configuration file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(^|[\s"''])/etc/rsyncd\.conf\b'
  - id: writable-module-config-text
    desc: Configuration text sets read only to false
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^[ \t]*read[ \t]+only[ \t]*=[ \t]*(false|no|0)[ \t]*$'
  - id: module-header-text
    desc: Configuration section header text
    crit: component
    if:
      type: text
      regex: '(?m)^\[[A-Za-z0-9_.-]+\][ \t]*$'

composite_rules:
  - id: rsync-daemon-writable-module-text
    desc: Rsync config path near writable module text
    crit: notable
    conf: 0.88
    near_lines: 30
    all:
      - id: rsync-daemon-config-path
      - id: writable-module-config-text
      - id: module-header-text
