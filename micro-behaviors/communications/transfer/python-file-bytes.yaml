defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-virtual-files-from-read-bytes
    desc: Registers a file-byte comprehension for transfer
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @data
            right: (list_comprehension body: (call
              function: (attribute attribute: (identifier) @read)))))
          (expression_statement (assignment
            right: (call
              function: (attribute attribute: (identifier) @register)
              arguments: (argument_list (identifier) @used (_)))))) @operation
          (#eq? @read "read_bytes")
          (#eq? @register "RegisterVirtualFiles")
          (#eq? @data @used))
