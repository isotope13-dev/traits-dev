# Reviewed source observations; no malicious intent is implied.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  crit: notable
traits:
- id: s5cmd-copy-command
  desc: s5cmd copy command
  conf: 0.96
  if:
    type: text
    regex: (?i)\bs5cmd(\.exe)?[^\r\n]{0,90}\bcp\b
  unless:
  - id: metadata/file/function::source-no-parsed-call-sites
- id: s5cmd-local-source
  desc: s5cmd local source preceding an S3 destination
  conf: 0.97
  if:
    type: text
    regex: (?i)\bs5cmd(\.exe)?[^\r\n]{0,90}\bcp\b[^\r\n]{0,120}([A-Za-z]:[\\/]|/)[^\r\n]{1,120}s3://
  unless:
  - id: metadata/file/function::source-no-parsed-call-sites
composite_rules:
- id: s5cmd-s3-upload-command
  desc: s5cmd local-to-S3 upload command
  conf: 0.96
  all:
  - id: micro-behaviors/communications/transfer::s5cmd-copy-command
  - id: micro-behaviors/communications/transfer::s5cmd-local-source
  - id: micro-behaviors/communications/http/url/cloud::s3-bucket-uri
  near_lines: 1
