defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98

traits:
  - id: powershell-file-chunk-response-send
    desc: Passes data to a packet-send callback
    if:
      type: text
      regex: '\$SendMessage\s+-Packets\s+\$\(Encode-Packet.{0,35}-data\s+\$\(\$data\)'

composite_rules:
  - id: powershell-file-chunk-response-block
    desc: Formats and sends file-helper output
    crit: notable
    all:
      - id: micro-behaviors/fs/read/stream::powershell-file-chunk-response-assignment
      - id: micro-behaviors/data/format/string::powershell-file-chunk-response-record
      - id: micro-behaviors/communications/transfer::powershell-file-chunk-response-send
    near_lines: 10
