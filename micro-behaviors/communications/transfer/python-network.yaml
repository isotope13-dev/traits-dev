# HTTP-client and socket I/O alternatives establish network activity,
# without requiring an IP address or endpoint literal.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-http-or-socket-io
    desc: Python HTTP client or socket I/O
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: micro-behaviors/communications/http/lib/requests::requests-session
      - id: micro-behaviors/communications/http/client/response-body::python-client-response-body-cooccurrence
      - id: micro-behaviors/communications/socket/receive::socket-data-transfer
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
