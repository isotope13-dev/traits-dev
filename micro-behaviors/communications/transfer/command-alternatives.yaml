defaults:
  platforms: [unix, windows]
  for: [scripts]
composite_rules:
  - id: transfer-command
    desc: File transfer command or upload option
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/communications/transfer::rclone-copy-cmd
      - id: micro-behaviors/communications/transfer::azcopy-transfer-command
      - id: micro-behaviors/communications/transfer::megacmd-transfer-command
      - id: micro-behaviors/communications/transfer::s5cmd-s3-upload-command
      - id: micro-behaviors/communications/http/upload::curl-upload-or-form-option
      - id: micro-behaviors/communications/ftp/upload::ftp-script-upload-command
      - id: micro-behaviors/communications/ftp/upload::ftp-script-upload-command-reverse

