defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: getserver-payload-request-token
    desc: GETSERVER native payload request token
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rdata
      exact: GETSERVER
  - id: x86-ten-byte-request-send
    desc: x86 sends ten-byte stack request through helper
    crit: notable
    conf: 0.97
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '6A 0A 8D 45 ?? 8B CE 50 E8 ?? ?? ?? ?? 83 BE ?? ?? ?? ?? 00 8B 3D ?? ?? ?? ??'
