defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.95
traits:
  - id: rust-send-system-info-call
    desc: Calls send_system_info helper
    if:
      type: symbol
      kind: call
      regex: '(^|::)send_system_info$'
  - id: rust-send-project-env-call
    desc: Calls send_project_env helper
    if:
      type: symbol
      kind: call
      regex: '(^|::)send_project_env$'
  - id: rust-send-scanned-files-call
    desc: Calls send_scanned_files helper
    if:
      type: symbol
      kind: call
      regex: '(^|::)send_scanned_files$'
composite_rules:
  - id: rust-collection-send-calls
    desc: Rust calls three collection-send helpers
    all:
      - id: rust-send-system-info-call
      - id: rust-send-project-env-call
      - id: rust-send-scanned-files-call
