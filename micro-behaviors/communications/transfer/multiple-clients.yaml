defaults:
  platforms:
  - linux
  attack: T1105
composite_rules:
- crit: notable
  id: multiple-download-clients
  desc: Uses multiple command-line download clients
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
  - id: micro-behaviors/communications/http/download/wget::wget-client
  - id: micro-behaviors/communications/ftp/download/busybox::ftpget
  - id: micro-behaviors/communications/tftp/download::command
- crit: notable
  id: multiple-download-clients-architecture-references
  desc: Multiple download clients and CPU architecture references coexist
  conf: 0.93
  near_lines: 80
  all:
  - id: micro-behaviors/communications/transfer::multiple-download-clients
  - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
