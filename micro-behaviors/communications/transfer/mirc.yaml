defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-dot-dcc-send
    desc: mIRC dot-form dcc send command
    crit: notable
    if:
      type: text
      case_insensitive: true
      regex: '\.dcc\s*send\b'

  - id: mirc-dcc-send-script-ini
    desc: mIRC DCC command sends script.ini
    crit: notable
    if:
      type: text
      regex: '(?i)\bdcc\s+send\s+\$nick\s+[^|\r\n]{0,120}(\b|\$mircdir)script\.ini\b'
  - id: mirc-join-handler-dcc-send
    desc: mIRC JOIN handler sends a file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)on [^:\r\n]{1,12}:join:[^\r\n]{1,150}\bdcc\s+send\s+\$nick\b'
  - id: mirc-join-part-block-handler
    desc: mIRC JOIN/PART handler opens a block
    crit: notable
    if:
      type: text
      regex: '(?i)\bon [^:\r\n]{1,12}:(join|part):[^\r\n{]{0,40}\{\s*$'
  - id: mirc-dcc-send-ip-bitmap
    desc: mIRC DCC sends IP-named bitmap
    crit: notable
    for: [mirc]
    if:
      type: text
      regex: '(?i)dcc send \$nick \$mircdir\\\s*\$\+\s*\$ip\s*\$\+\s*\.bmp'
composite_rules:
  - id: mirc-capture-bitmap-dcc-send
    desc: mIRC captures and sends IP-named bitmap
    crit: notable
    for: [mirc]
    near_lines: 1
    all:
      - id: micro-behaviors/hardware/display/screenshot::mirc-dll-capture-bitmap
      - id: mirc-dcc-send-ip-bitmap
