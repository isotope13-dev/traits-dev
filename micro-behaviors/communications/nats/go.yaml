# NATS messaging in Go (github.com/nats-io/nats.go).
#
# NATS is a pub/sub message bus on TCP/4222. Default Go client surface:
# Connect + Publish/Subscribe/Request. Import string is the highest-precision
# signal — outside of nats.go's own test suite, almost nothing else uses
# this exact package path.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go]
  mbc: C0002
traits:
  - id: nats-go-import
    desc: Imports github.com/nats-io/nats.go
    conf: 0.97
    if:
      type: text
      substr: 'github.com/nats-io/nats.go'

  - id: nats-connect
    desc: NATS Connect call
    conf: 0.9
    if:
      type: text
      regex: '\bnats\.Connect\s*\('

  # Bare Publish/Subscribe call shapes are shared with Redis, MQTT and other
  # pub/sub clients: without the nats.go import they establish no NATS usage,
  # so they stand as component legs for the import-gated composites below.
  - id: publish-string-arg-call
    desc: Publish call with a string subject
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\.Publish\s*\(\s*"[^"\n]{1,80}"'

  - id: subscribe-string-arg-call
    desc: Subscribe call with a string subject
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\.Subscribe\s*\(\s*"[^"\n]{1,80}"'

composite_rules:
  - id: nats-publish
    desc: NATS Publish call
    conf: 0.9
    all:
      - id: nats-go-import
      - id: publish-string-arg-call

  - id: nats-subscribe
    desc: NATS Subscribe call
    conf: 0.9
    all:
      - id: nats-go-import
      - id: subscribe-string-arg-call

  - id: nats-client
    desc: Go process speaks NATS
    conf: 0.97
    all:
      - id: nats-go-import
    any:
      - id: nats-connect
      - id: nats-publish
      - id: nats-subscribe
