defaults:
  crit: notable
  platforms: [windows, unix]
  for: [shell, python, batch, powershell, javascript, html, vbs, pe, dll]
  mbc: C0002

traits:
  - id: finger-command-user-host-command
    desc: finger command user host query
    crit: component
    for: [shell, batch, powershell, html, source, -python, -javascript, -typescript]
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bf\^*i\^*n\^*g\^*e\^*r(\.exe)?\s+[\w.-]{1,64}@[\w.^-]{3,253}\.[A-Za-z]{2,24}\b'
  - id: finger-command-user-host-string
    desc: finger command user host query
    crit: component
    conf: 0.88
    for: [python, javascript, typescript]
    if:
      type: literal
      regex: '(?i)\bf\^*i\^*n\^*g\^*e\^*r(\.exe)?\s+[\w.-]{1,64}@[\w.^-]{3,253}\.[A-Za-z]{2,24}\b'
  - id: finger-command-user-ip-command
    desc: finger command user IP query
    crit: component
    for: [shell, batch, powershell, html, source, -python, -javascript, -typescript]
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bf\^*i\^*n\^*g\^*e\^*r(\.exe)?\s+[\w.-]{1,64}@(\d{1,3}\.){3}\d{1,3}\b'

  - id: finger-command-user-ip-string
    desc: finger command user IP query
    crit: component
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: literal
      regex: '(?i)\bf\^*i\^*n\^*g\^*e\^*r(\.exe)?\s+[\w.-]{1,64}@(\d{1,3}\.){3}\d{1,3}\b'
  - id: finger-command-option-query
    desc: Finger query with switches text
    crit: notable
    for: [batch, powershell, javascript, vbs, html]
    if:
      type: text
      regex: 'finger(\.exe)?\s+([-/][A-Za-z0-9?._-]+\s+){1,2}[A-Za-z0-9._-]{1,64}@[A-Za-z0-9.-]{1,253}'
      case_insensitive: true
    conf: 1.0

composite_rules:
  - id: finger-command-user-ip
    desc: finger command user IP query
    conf: 0.9
    for: [shell, python, batch, powershell, javascript, html, source]
    any:
      - id: finger-command-user-ip-command
      - id: finger-command-user-ip-string
  - id: finger-command-user-host
    desc: finger command user host query
    conf: 0.88
    for: [shell, python, batch, powershell, javascript, html, source]
    any:
      - id: finger-command-user-host-command
      - id: finger-command-user-host-string
  - id: finger-command-query
    desc: finger protocol command query
    conf: 0.9
    any:
      - id: finger-command-user-host
      - id: finger-command-user-ip
      - id: finger-command-option-query
