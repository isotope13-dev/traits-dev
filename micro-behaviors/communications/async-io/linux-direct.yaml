# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: io-uring-setup-syscall
    desc: Creates an asynchronous I/O ring
    if:
      type: syscall
      name: [io_uring_setup]
      arch: [x86_64, aarch64]
    unless:
      # Recovered numbers resolve through the Linux table, which is wrong
      # for BSD kernels: io_uring is Linux-only, so this name on a BSD
      # OSABI binary is an ordinary BSD syscall mislabelled.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: io-uring-enter-syscall
    desc: Submits or waits for ring operations
    if:
      type: syscall
      name: [io_uring_enter]
      arch: [x86_64, aarch64]
    unless:
      # Same Linux-table caveat as io-uring-setup-syscall above.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: io-uring-register-syscall
    desc: Registers or updates I/O ring resources
    if:
      type: syscall
      name: [io_uring_register]
      arch: [x86_64, aarch64]
    unless:
      # Same Linux-table caveat as io-uring-setup-syscall above.
      - id: metadata/vendor/identity::bsd-elf-osabi
