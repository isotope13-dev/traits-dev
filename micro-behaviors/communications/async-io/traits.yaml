# Traits moved to proper taxonomy locations:
#   OS kernel event primitives → os/event/kernel/{kqueue,epoll}/
#   Event loop libraries       → os/event/library/{libev,libuv,libevent,boost-asio,tokio}/
#   c-ares DNS resolver        → communications/dns/resolver/c-ares.yaml
defaults:
  platforms: [linux]
  for: [c, cpp, elf]

traits:
  - id: io-uring-connect
    desc: Uses io_uring for asynchronous socket connection
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: io_uring_prep_connect
  - id: io-uring-receive
    desc: Uses io_uring for asynchronous socket receive
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: io_uring_prep_recv
  - id: io-uring-send
    desc: Uses io_uring for asynchronous socket send
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: io_uring_prep_send

composite_rules:
  - id: io-uring-socket-operations
    desc: Uses io_uring for bidirectional socket communication
    crit: notable
    conf: 0.96
    all:
      - id: io-uring-connect
      - id: io-uring-receive
      - id: io-uring-send
