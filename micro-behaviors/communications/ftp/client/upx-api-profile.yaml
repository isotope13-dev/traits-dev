# This IAT set is also present in the official AutoIt interpreter.
# It establishes API availability, not NetWire identity or a packed state.
defaults:
  for: [pe, dll]
  platforms: [windows]
  size_min: 100000
  size_max: 8000000

composite_rules:
  - id: upx-ftp-icmp-user-profile-share-api-set
    desc: UPX-labeled FTP/ICMP/profile/share API set
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/communications/ftp/client::wininet-ftp-api
      - id: micro-behaviors/communications/icmp::icmp-echo-api
      - id: micro-behaviors/os/user/account::load-user-profile-w
      - id: micro-behaviors/os/network/share::wnet-use-connection
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/
      - id: well-known/tool/reverse-engineering/
      # WinINet FTP, ICMP echo, LoadUserProfileW and WNetUseConnection are the
      # AutoIt3 interpreter's own imports for its FTP, Ping and DriveMapAdd
      # builtins, and the import set survives UPX packing. An AutoIt-carried
      # Netwire is the separate autoit-carried trait's job; this profile must
      # not convict every packed AutoIt utility that happens to import them.
      - id: metadata/lang/compiled::autoit-compiled-script
