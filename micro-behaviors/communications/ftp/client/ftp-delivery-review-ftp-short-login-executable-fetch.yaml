defaults:
  platforms: [windows]
  for: [text, batch]
  attack: T1105
composite_rules:
  - id: ftp-short-login-executable-fetch
    desc: FTP executable fetch with short credentials
    crit: notable
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-script-open-host
      - id: micro-behaviors/communications/ftp/client::ftp-script-get-executable
    any:
      - id: micro-behaviors/communications/ftp/client::ftp-script-short-login
      - id: micro-behaviors/communications/ftp/client::ftp-script-short-prompt-login
      - id: micro-behaviors/communications/ftp/client::ftp-script-hacker-credentials
  # Combined automated retrieval and throwaway login: characteristic of worm/dropper
  # stager scripts retrieving binaries using dummy credentials.
