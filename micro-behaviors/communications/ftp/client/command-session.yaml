# FTP command-file operations. Transferring a program does not establish
# execution, malware identity, or attacker ownership of the server.
defaults:
  platforms: [windows]
  for: [text, batch]

traits:
  - id: ftp-command-script-executable-session
    desc: FTP command script binary-gets a program
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)open \S+.{0,60}binary\s+get \S+\.(exe|dll|scr).{0,24}(quit|bye)'
  # These are command operands, not evidence of attacker control. Keep the
  # original match populations, including two-character credentials and
  # three-to-six digit port operands; neither implies runtime success.
  - id: ftp-script-short-login
    desc: FTP-style command supplies short credentials
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?im)^user\s+\S{1,2}\s+\S{1,2}\s*$'
  - id: ftp-script-explicit-port
    desc: FTP open command supplies numeric port
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^open\s+\S+\s+\d{3,6}\s*$'

composite_rules:
  # Authentication plus executable transfer is neutral without abuse evidence.
  - id: ftp-authenticated-executable-fetch
    desc: FTP script authenticates to fetch an executable
    crit: notable
    conf: 0.94
    near_lines: 12
    all:
      - id: ftp-script-user-auth
      - id: ftp-script-open-host
      - id: ftp-script-get-executable
