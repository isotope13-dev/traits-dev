defaults:
  platforms: [windows]
  for: [text, batch]
  size_max: 4096
  conf: 0.98
  attack: T1105
  mbc: B0024
traits:
  - id: micro-behaviors/communications/ftp/client::ftp-script-quit-terminator
    desc: FTP script ends session with quit
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)^quit[ \t]*\r?$'
