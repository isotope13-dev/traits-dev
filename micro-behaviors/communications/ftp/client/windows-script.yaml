defaults:
  platforms: [windows]
  for: [html, javascript, batch, vbs]
traits:
  - id: windows-ftp-script-command
    desc: Windows FTP command uses a command file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bftp(\.exe)?\s+[^\r\n"'']{0,100}-s:'
  - id: ftp-script-echo-get-executable
    desc: Echoes FTP executable get command
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\becho\s+m?get\s+[^\r\n>'']{1,120}\.(exe|dll|scr|bat)\s*>>?\s*\S{1,120}'
  # Windows ftp.exe `-s:` command files say `open host [port]` rather than
  # invoking ftp.exe themselves. A dotted host keeps prose such as "open source"
  # out of the match. The optional port is part of the same connect command.
  - id: ftp-script-open-host
    desc: FTP script opens a remote host
    crit: notable
    conf: 0.92
    for: [text, batch]
    if:
      type: text
      regex: '(?im)^open[ \t]+\S+\.\S+([ \t]+\d{1,5})?[ \t]*\r?$'
  # Same open command when the host is a public IPv4 literal. Private and
  # loopback targets stay on ftp-script-open-host; this atom is the unattributed
  # external endpoint.
  - id: ftp-script-open-external-ipv4
    desc: FTP script opens an external IPv4
    crit: notable
    conf: 0.94
    for: [text, batch]
    if:
      type: text
      regex: '(?im)^open[ \t]+([0-9]{1,3}\.){3}[0-9]{1,3}([ \t]+[0-9]{1,5})?[ \t]*\r?$'
      is: external_ip
  # A line that is only an ftp.exe get/mget of a program file. Document fetches
  # (readme.txt, archives) do not match. The echo-staging sibling above is the
  # wrapper that writes this line into a command file.
  - id: ftp-script-get-executable
    desc: FTP script gets an executable
    crit: notable
    conf: 0.93
    for: [text, batch]
    if:
      type: text
      regex: '(?im)^m?get[ \t]+\S{1,80}\.(exe|dll|scr)([ \t]+\S+)?[ \t]*\r?$'
