defaults:
  platforms: [windows]
  for: [html, javascript, batch, vbs]
traits:
  - id: windows-ftp-script-command
    desc: Windows FTP command uses a command file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bftp(\.exe)?\s+[^\r\n"'']{0,100}-s:'
  - id: ftp-script-echo-get-executable
    desc: Echoes FTP executable get command
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\becho\s+m?get\s+[^\r\n>'']{1,120}\.(exe|dll|scr|bat)\s*>>?\s*\S{1,120}'
