# PowerShell TcpClient to TCP/21 receives the FTP greeting before login.
defaults:
  platforms: [windows]
  for: [powershell]
  mbc: C0004
  attack: T1071.002

traits:
  - id: tcpclient-ftp-service-port
    desc: TcpClient connects to the FTP service port
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bTcpClient\s*\(\s*[^,\n]{1,48},\s*21\s*\)'
