defaults:
  platforms: [windows]
  for: [text, batch]
  attack: T1105
composite_rules:
  - id: ftp-short-login-fetch-and-quit
    desc: FTP short-login executable fetch and quit
    crit: notable
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-short-login-executable-fetch
      - id: micro-behaviors/communications/ftp/client::ftp-script-session-terminator
  # The executable fetch from a raw address on an ephemeral port: the
  # server has no name to resolve and no standard service port to find,
  # so the script must carry both.
