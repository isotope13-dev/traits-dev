defaults:
  platforms: [windows]
  for: [text, batch]
  attack: T1105
composite_rules:
  - id: ftp-explicit-port-short-login-fetch
    desc: FTP explicit-port fetch with short login
    crit: notable
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-explicit-port-executable-fetch
    any:
      - id: micro-behaviors/communications/ftp/client::ftp-script-short-login
      - id: micro-behaviors/communications/ftp/client::ftp-script-short-prompt-login
  # Same retrieval when the local name is under C:\Windows. The script still
  # does not launch the file; the hostile claim is the system-directory plant.
