defaults:
  platforms: [windows]
  for: [text, batch]
  attack: T1105
composite_rules:
  - id: ftp-explicit-port-executable-fetch
    desc: FTP executable fetch on an explicit port
    crit: notable
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-script-open-host
      - id: micro-behaviors/communications/ftp/client::ftp-script-get-executable
      - id: micro-behaviors/communications/ftp/client::ftp-script-explicit-port
  # Combined ephemeral port and throwaway login: characteristic of worm/dropper
  # stager scripts retrieving binaries from temporary local or remote nodes.
