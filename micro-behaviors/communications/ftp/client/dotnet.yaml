# Managed FTP client type as it survives into a compiled assembly.
#
# `FtpWebRequest` is the .NET FTP client class; in a compiled assembly it is a
# CLR metadata string rather than a PE import, so the WinInet import rule in
# this directory never sees it. Neutral capability: the assembly can transfer
# files over FTP. Exfiltration composites supply the intent.
defaults:
  for: [pe, dll]
  platforms: [windows]
  mbc: C0004
  attack: T1071.002

traits:
  - id: dotnet-ftpwebrequest
    desc: .NET FtpWebRequest client type reference
    crit: notable
    conf: 0.85
    if:
      type: text
      word: FtpWebRequest
