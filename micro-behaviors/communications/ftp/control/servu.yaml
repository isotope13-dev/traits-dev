defaults:
  for: [asp]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: servu-user-setup-command
    desc: Serv-U FTP account setup command
    if:
      type: text
      substr: -SETUSERSETUP
  - id: servu-drive-root-home
    desc: Serv-U FTP home points to drive root
    if:
      type: text
      substr: '-HomeDir=c:\\'
  - id: servu-maintenance-command
    desc: Serv-U FTP maintenance mode command
    if:
      type: text
      regex: '(?i)SITE[ \t]+MAINTENANCE'
  - id: servu-system-maintenance-grant
    desc: Grants Serv-U system administrator maintenance
    if:
      type: text
      regex: '(?i)-Maintenance[ \t]*=[ \t]*System\b'
  - id: servu-full-drive-access
    desc: Serv-U grants full drive-root FTP permissions
    if:
      type: text
      regex: '(?i)\bAccess[ \t]*=[ \t]*[a-z]:\\{1,2}\|RWAMELCDP'
