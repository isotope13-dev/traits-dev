defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - lnk
  - batch
  - powershell
  mbc: C0004
  attack: T1071.002
traits:
- id: ftp-client-command-invocation
  desc: FTP client command invocation
  conf: 0.92
  if:
    type: text
    regex: (?im)(^|["';&(]|/[ck][ \t]+)[ \t]*ftp(\.exe)?[ \t]+([-$/]|\S+\.\S)\S{0,80}
- id: ftp-local-start-command
  desc: FTP script invokes local start command
  conf: 0.97
  for:
  - text
  - batch
  - cmd
  if:
    type: text
    regex: (?im)^![ \t]*start\b
- id: ftp-local-copy-command
  desc: FTP script invokes local copy command
  conf: 0.97
  for:
  - text
  - batch
  - cmd
  if:
    type: text
    regex: (?im)^![ \t]*copy\b
- id: ftp-acct-command
  desc: FTP ACCT authentication command
  conf: 0.7
  if:
    type: text
    regex: (?m)^ACCT[ \t]+[^\r\n]{1,128}(\r?\n|$)
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: ftp-cmd-transfer
  desc: FTP upload command token
  conf: 0.7
  if:
    type: text
    regex: (?m)^(STOR|STOU)[ \t]+[^= \t\r\n][^\r\n]{0,255}(\r?\n|$)
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: ftp-cmd-listing
  desc: FTP listing/navigation command token
  conf: 0.7
  if:
    type: text
    regex: (?m)^(LIST|NLST|CWD)[ \t]+[^= \t\r\n][^\r\n]{0,255}(\r?\n|$)
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: ftp-server-greeting
  desc: FTP server greeting banner
  conf: 0.9
  if:
    type: text
    regex: (?mi)^220[ -].{0,100}\b(ftp|server)\b
- id: ftp-pasv-command
  desc: Issues FTP passive-mode command
  conf: 0.9
  for:
  - c
  - cpp
  if:
    type: literal
    exact: PASV\r\n
- id: ftp-command-code-literal
  desc: Builds an FTP command code literal
  conf: 0.85
  for:
  - python
  - ruby
  - perl
  - php
  - javascript
  - typescript
  if:
    type: text
    regex: b?["'](USER|PASS|ACCT|CWD|RETR|STOR|MKD|DELE) (["']|[%{]|\\r\\n)
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: ftp-unterminated-user-buffer-send
  desc: Sends FTP USER buffer without terminator
  conf: 0.96
  for:
  - python
  - ruby
  - perl
  - php
  - javascript
  - typescript
  if:
    type: text
    regex: (send|sendall|write|fwrite)\(.{0,60}b?["']USER ["']\s*(\+|\.)\s*\$?\w+\s*\)
- id: ftp-cwd-command-send
  desc: Sends an FTP CWD command
  conf: 0.9
  for:
  - python
  - ruby
  - perl
  - php
  - javascript
  - typescript
  if:
    type: text
    regex: (send|sendall|write|fwrite)\(.{0,60}b?["']CWD [^"'\r\n]{0,80}["']
composite_rules:
- id: ftp-unterminated-user-with-cwd
  desc: Pairs unterminated FTP USER with CWD
  conf: 0.97
  for:
  - python
  - ruby
  - perl
  - php
  - javascript
  - typescript
  near_lines: 12
  all:
  - id: ftp-unterminated-user-buffer-send
  - id: ftp-cwd-command-send
- id: ftp-local-shell-command-sequence
  desc: FTP script runs local start and copy
  conf: 0.98
  for:
  - text
  - batch
  - cmd
  all:
  - id: ftp-local-start-command
  - id: ftp-local-copy-command
- id: ftp-protocol-support
  desc: FTP control-channel command support
  conf: 0.85
  any:
  - id: ftp-acct-command
  - id: ftp-cmd-transfer
  - id: ftp-cmd-listing
  needs: 2
- id: ftp-server-implementation
  desc: FTP server command handling and greeting
  conf: 0.92
  all:
  - id: ftp-protocol-support
  - id: ftp-server-greeting
