defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, lnk, batch, powershell]
  mbc: C0004
  attack: T1071.002
traits:
  - id: ftp-client-command-invocation
    desc: FTP client command invocation
    crit: notable
    conf: 0.92
    # The first argument must look like a command line -- a switch, a variable,
    # a path, or a dotted host -- rather than an English word. Without that the
    # `(` delimiter matched ordinary prose such as "(FTP command IMAGE)" in the
    # documentation of Ruby's URI::FTP parser.
    if:
      type: text
      regex: '(?im)(^|["'';&(]|/[ck][ \t]+)[ \t]*ftp(\.exe)?[ \t]+([-$/]|\S+\.\S)\S{0,80}'

  # Microsoft's ftp client treats a leading `!` in an input script as a
  # request to execute the remainder through the local command shell.
  - id: ftp-local-start-command
    desc: FTP script invokes local start command
    crit: notable
    conf: 0.97
    for: [text, batch, cmd]
    if:
      type: text
      regex: '(?im)^![ \t]*start\b'

  - id: ftp-local-copy-command
    desc: FTP script invokes local copy command
    crit: notable
    conf: 0.97
    for: [text, batch, cmd]
    if:
      type: text
      regex: '(?im)^![ \t]*copy\b'

  # FTP control-channel command tokens. Individually these are weak fragments
  # (a printf template like "USER %s" appears in plenty of non-FTP code), so
  # they are components that only carry signal inside FTP composites.
  - id: ftp-cmd-auth
    desc: FTP authentication command token
    crit: component
    conf: 0.7
    if:
      type: text
      # FTP commands are canonicalized in uppercase and carry an argument;
      # case-insensitive bare words such as "pass" in prose are not protocol
      # evidence.
      regex: '(?m)^(USER|PASS|ACCT)[ \t]+[^\r\n]{1,128}(\r?\n|$)'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: ftp-cmd-transfer
    desc: FTP upload command token
    crit: component
    conf: 0.7
    if:
      type: text
      # RETR is also a POP3 message-retrieval command. STOR/STOU are the FTP
      # upload verbs that distinguish this atom from a POP3 client vocabulary.
      regex: '(?m)^(STOR|STOU)[ \t]+[^\r\n]{1,256}(\r?\n|$)'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: ftp-cmd-listing
    desc: FTP listing/navigation command token
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(?m)^(LIST|NLST|CWD)[ \t]+[^\r\n]{1,256}(\r?\n|$)'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: ftp-server-greeting
    desc: FTP server greeting banner
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?mi)^220[ -].{0,100}\b(ftp|server)\b'

  - id: ftp-pasv-command
    desc: Issues FTP passive-mode command
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: literal
      exact: "PASV\\r\\n"

  # An FTP control verb built as a code byte/string literal (e.g.
  # `sock.send(b"USER " + payload)`), rather than a line of a stored FTP
  # transcript. This is the client-side "speaks an FTP command" capability;
  # scripted exploits that overflow a login field construct exactly this.
  - id: ftp-command-code-literal
    desc: Builds an FTP command code literal
    crit: notable
    conf: 0.85
    for: [python, ruby, perl, php, javascript, typescript]
    if:
      type: text
      # LIST and QUIT are also ordinary IMAP commands; matching either alone
      # mislabeled mail clients as FTP implementations.
      regex: 'b?["''](USER|PASS|ACCT|CWD|RETR|STOR|MKD|DELE)[ \r\n]'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

composite_rules:
  - id: ftp-local-shell-command-sequence
    desc: FTP script runs local start and copy
    crit: notable
    conf: 0.98
    for: [text, batch, cmd]
    all:
      - id: ftp-local-start-command
      - id: ftp-local-copy-command

  # Multiple FTP control-channel commands = the code speaks FTP. This is a
  # true capability and SHOULD fire on FTP clients (e.g. FFmpeg's ftp muxer)
  # as well as servers — it asserts "FTP support", not "runs a daemon".
  - id: ftp-protocol-support
    desc: FTP control-channel command support
    crit: notable
    conf: 0.85
    any:
      - id: ftp-cmd-auth
      - id: ftp-cmd-transfer
      - id: ftp-cmd-listing
    needs: 2

  # A 220 greeting paired with the command vocabulary is evidence of an FTP
  # server implementation, while the command fragments alone also correctly
  # cover clients and protocol libraries.
  - id: ftp-server-implementation
    desc: FTP server command handling and greeting
    crit: notable
    conf: 0.92
    all:
      - id: ftp-protocol-support
      - id: ftp-server-greeting
