defaults:
  crit: notable
  for: [shell]
  platforms: [linux]
  attack: T1105
traits:
  - id: ftpget
    desc: BusyBox ftpget applet invocation
    conf: 0.9
    if:
      type: text
      regex: '\bbusybox\s+ftpget\b'
  - id: ftpget-archive
    desc: BusyBox ftpget retrieves an archive
    conf: 0.92
    if:
      type: text
      regex: '\bbusybox\s+ftpget\b[^\n]{0,180}\.(tar|tgz|tar\.gz)\b'
  # Loader scripts fetch one payload per supported architecture, so a single
  # ftpget line is only a capability while three or more is a catalogue.
  # The count alone names no host or payload; dropper composites pair it
  # with the raw-IP endpoint, the chmod-exec chain and staged cleanup.
  - id: repeated-ftpget-fetch
    desc: Repeated BusyBox ftpget fetches
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: '\bbusybox\s+ftpget\b'
  - id: ftpget-utility-command
    desc: Standalone ftpget download command
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bftpget\s+'
    not:
      - regex: '(?i)\bbusybox\s+ftpget\b'
  - id: repeated-ftpget-utility-fetch
    desc: Repeated standalone ftpget fetches
    conf: 0.92
    count_min: 3
    if:
      type: text
      regex: '(?i)\bftpget\s+'
    not:
      - regex: '(?i)\bbusybox\s+ftpget\b'
