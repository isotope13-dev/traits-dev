defaults:
  crit: notable
  platforms: [windows, unix]
  for: [php, c, cpp, pe]
traits:
- id: ftp-upload-symbol--ftp-put
  desc: FTP upload symbol (ftp_put)
  crit: notable
  conf: 0.7
  if:
    type: symbol
    regex: ftp_put
- id: ftp-upload-symbol--stor
  desc: FTP upload symbol (STOR)
  crit: notable
  conf: 0.7
  if:
    type: symbol
    exact: STOR
- id: ftp-upload-symbol--ftp-upload
  desc: FTP upload symbol (ftp_upload)
  crit: notable
  conf: 0.7
  if:
    type: symbol
    regex: ftp_upload
- id: ftp-stor-format-command
  desc: Issues formatted FTP upload command
  crit: notable
  conf: 0.92
  if:
    type: literal
    exact: "STOR %s\\r\\n"
- id: ftp-script-upload-command
  desc: FTP script issues put command
  crit: notable
  conf: 0.94
  for: [shell, batch, powershell]
  if:
    type: text
    regex: '(?is)\bs?ftp\b[^\n]{0,260}\bm?put\b'
- id: ftp-script-upload-command-reverse
  desc: FTP script puts before client invocation
  crit: notable
  conf: 0.94
  for: [shell, batch, powershell]
  if:
    type: text
    regex: '(?is)\bm?put\b[\s\S]{0,260}\bs?ftp\b'
- id: wininet-ftp-put-file
  desc: Uploads file through WinINet FTP
  crit: notable
  conf: 0.95
  platforms: [windows]
  for: [pe, dll]
  if:
    type: import
    regex: '^FtpPutFile[AW]$'
- id: node-basic-ftp-upload
  desc: Node basic-ftp upload call
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: text
    regex: 'new Client\(\)[\s\S]{0,520}uploadFrom'

composite_rules:
- id: ftp-upload-symbol
  desc: FTP upload symbol
  crit: notable
  conf: 0.7
  any:
  - id: ftp-upload-symbol--ftp-put
  - id: ftp-upload-symbol--stor
  - id: ftp-upload-symbol--ftp-upload
