defaults:
  platforms: [windows, unix]
  for: [pyc]
  crit: notable
  attack: T1041

traits:
  - id: python-bytecode-ftp-storbinary-reference
    desc: Python bytecode references FTP STOR
    conf: 0.9
    if:
      type: raw
      regex: '(?-u:[\x7a\x5a\xfa\xda]\x0astorbinary)'
    unless:
      # ftplib.py defines this method for every Python application that ships
      # the standard library; the bundled library is not an FTP upload caller.
      - type: value
        path: pyc.source_files
        regex: '(^|[\\/])ftplib\.py$'
