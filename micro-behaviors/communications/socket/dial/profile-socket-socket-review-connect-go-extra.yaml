defaults:
  conf: 0.85
  platforms: [windows, linux, macos]
  for: [go, elf, pe, macho]
  crit: notable
traits:
  - id: net-dial-udp
    desc: net.DialUDP symbol reference
    if:
      type: symbol
      exact: net.DialUDP
composite_rules:
  - id: socket-dial
    desc: Go dial API references
    crit: notable
    any:
      - id: micro-behaviors/communications/socket/dial::dial
      - id: micro-behaviors/communications/socket/dial::dial-tcp
      - id: micro-behaviors/communications/socket/dial::net-dial-udp
