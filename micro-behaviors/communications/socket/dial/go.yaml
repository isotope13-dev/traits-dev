defaults:
  platforms: [windows, unix]
  for: [go]
  mbc: C0001
  attack: T1071

traits:
  - id: udp-google-dns-route-probe
    desc: Go UDP dials Google public DNS
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: net.Dial("udp", "8.8.8.8:53")
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: net-dial-text
    desc: Go binary embeds net.Dial
    crit: notable
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: text
      exact: net.Dial
