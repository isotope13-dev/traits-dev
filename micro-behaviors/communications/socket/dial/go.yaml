defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [go]
  mbc: C0001
  attack: T1071

traits:
  - id: udp-google-dns-route-probe
    desc: Go UDP dials Google public DNS
    if:
      type: text
      substr: net.Dial("udp", "8.8.8.8:53")
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: net-dial-text
    desc: Go binary embeds net.Dial
    for: [elf, macho, pe]
    if:
      type: text
      exact: net.Dial

  # smb2.NewDialer is the go-smb2 client constructor. DCERPC libraries use it
  # as a named-pipe transport, and share clients use the same call. The
  # constructor is the dial, not a lateral-movement action.
  - id: go-smb2-dialer
    desc: Go code constructs an SMB2 dialer
    for: [go, elf]
    if:
      type: text
      substr: smb2.NewDialer
