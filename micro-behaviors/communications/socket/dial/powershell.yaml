defaults:
  platforms: [windows]
  for: [powershell, pe, dll]
  crit: notable
traits:
  - id: powershell-tcpclient-endpoint-constructor-text
    desc: PowerShell TcpClient endpoint constructor
    conf: 0.95
    if:
      type: text
      regex: '(?i)New-Object\s+(System\.)?Net\.Sockets\.TcpClient\s*\([^)]{1,80},[^)]{1,80}\)'
