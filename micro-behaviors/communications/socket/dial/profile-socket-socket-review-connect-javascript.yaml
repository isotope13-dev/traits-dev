defaults:
  crit: notable
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
composite_rules:
  - id: node-named-create-connection
    desc: Node net import and call clues
    # createConnection also accepts Unix-domain socket paths and named pipes.
    # Import/call proximity does not resolve the receiver or endpoint type.
    conf: 0.94
    all:
      - id: micro-behaviors/data/control-flow/dispatch/named::create-connection-call-target
    any:
      - id: metadata/import/builtin::node-net-createconnection-import
      - id: metadata/import/builtin::node-net-namespace-import
    # Large but ordinary TypeScript modules often place imports at the top and
    # use the imported socket primitive in a later helper.  Keep this same-file
    # relationship while covering the compiled 18 KB package module.
    near_bytes: 24000
