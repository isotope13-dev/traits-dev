# Dial-only groupings for cross-language objective composites. Keeping these
# separate from the broad socket/connect directory prevents listeners and plain
# socket construction from being mistaken for outbound connection attempts.
defaults:
  crit: notable
  platforms: [linux, macos, windows]

traits: []
composite_rules:
  - id: python-dial
    desc: Python outbound network socket connection
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::python-created-socket-connect
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-method
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
    unless:
      - id: micro-behaviors/communications/ipc/unix-socket::python-unix-socket-client
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: go-dial
    desc: Go outbound socket connection
    any:
      - id: micro-behaviors/communications/socket/connect/tcp::dial-timeout-tcp
      - id: micro-behaviors/communications/socket/connect/tcp::go-net-dial-tcp-call
      - id: micro-behaviors/communications/socket/connect/attempt::go-net-dial-udp-call
      - id: micro-behaviors/communications/socket/connect/endpoint::go-net-dial-literal-endpoint
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: jvm-dial
    desc: JVM outbound socket connection
    any:
      - id: micro-behaviors/communications/socket/connect/tcp::java-socket-connect
      - id: micro-behaviors/communications/socket/connect/endpoint::new-socket-host-port
      - id: micro-behaviors/communications/socket/connect/tcp::java-address-socket-connect

  - id: javascript-dial
    desc: JavaScript outbound socket connection
    any:
      - id: micro-behaviors/communications/socket/connect/tcp::net-connect
      - id: micro-behaviors/communications/socket/connect/tcp::net-create-connection-call
      - id: micro-behaviors/communications/socket/connect/attempt::node-bound-socket-connect

  - id: scripting-dial
    desc: Script-language outbound socket connection
    any:
      - id: micro-behaviors/communications/socket/connect/tcp::gen-tcp-connect
      - id: micro-behaviors/communications/socket/connect/attempt::php-stream-socket-client

  - id: php-dial
    for: [php]
    desc: PHP outbound socket connection
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-function-call
      - id: micro-behaviors/communications/socket/connect/attempt::fsockopen-call
      - id: micro-behaviors/communications/socket/connect/attempt::pfsockopen-call

  - id: platform-dial
    desc: Platform networking connection attempt
    any:
      - id: micro-behaviors/communications/socket/ras::ras-dial
      - id: micro-behaviors/communications/socket/connect/attempt::deno-connect-call
