# Linux zero-copy pipe/socket page-fragment operations.  These APIs are
# legitimate in high-performance I/O; the security significance comes from
# composites that require their shared-page form and an exploit primitive.
defaults:
  crit: notable
  platforms: [linux]
  for: [c, cpp, go, rust, python, elf]

traits:
  # Keep the native entry point distinct from same-named language methods.
  # In particular, Rust's Vec::splice is a collection edit, not Linux I/O.
  - id: splice-call
    desc: Linux splice system call
    conf: 0.86
    for: [c, cpp, elf]
    if:
      type: symbol
      kind: call
      exact: splice

  - id: vmsplice-call
    desc: Linux vmsplice system call
    conf: 0.9
    for: [c, cpp, elf]
    if:
      type: symbol
      kind: call
      exact: vmsplice

  - id: rust-splice-call
    desc: Rust Linux splice system call
    conf: 0.86
    for: [rust]
    if:
      type: symbol
      kind: call
      regex: '^(libc|nix\.(unistd|syscall))\.splice$'

  - id: rust-vmsplice-call
    desc: Rust Linux vmsplice system call
    conf: 0.9
    for: [rust]
    if:
      type: symbol
      kind: call
      regex: '^(libc|nix\.(unistd|syscall))\.vmsplice$'

  - id: go-splice-call
    desc: Go Linux splice system call
    conf: 0.86
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '^(unix|syscall)\.Splice$'

  - id: go-vmsplice-call
    desc: Go Linux vmsplice system call
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '^(unix|syscall)\.Vmsplice$'

  - id: python-splice-call
    desc: Python Linux splice system call
    conf: 0.86
    for: [python]
    if:
      type: symbol
      kind: call
      exact: os.splice

  - id: msg-splice-pages-flag
    desc: Linux MSG_SPLICE_PAGES shared-fragment send flag
    conf: 0.96
    if:
      type: text
      word: MSG_SPLICE_PAGES

  # MSG_ZEROCOPY pins userspace or file-backed pages into an skb instead of
  # copying them.  The flag and socket option are legitimate high-throughput
  # I/O features on their own; exploit intent only appears when the composite
  # in objectives/privilege-escalation/exploit/kernel/ovs-pagecache.yaml joins
  # them to an OVS upcall/forward chain and ESP in-place decryption.
  - id: msg-zerocopy-send-call
    desc: Sends a socket message with Linux MSG_ZEROCOPY
    conf: 0.95
    if:
      type: text
      regex: '(?s)\b(sendmsg|sendmmsg|SendmsgN?|send_msg)\s*\([^;]{0,320}\bMSG_ZEROCOPY\b'

  - id: so-zerocopy-option
    desc: Enables Linux socket zero-copy transmission
    conf: 0.95
    if:
      type: text
      word: SO_ZEROCOPY

composite_rules:
  - id: linux-splice-call
    desc: Linux splice system call
    conf: 0.9
    any:
      - id: splice-call
      - id: rust-splice-call
      - id: go-splice-call
      - id: python-splice-call

  - id: linux-vmsplice-call
    desc: Linux vmsplice system call
    conf: 0.9
    any:
      - id: vmsplice-call
      - id: rust-vmsplice-call
      - id: go-vmsplice-call

  - id: splice-page-fragment-chain
    desc: Alternates user buffers and file pages in a zero-copy pipe chain
    conf: 0.95
    all:
      - id: linux-splice-call
      - id: linux-vmsplice-call
      - id: msg-splice-pages-flag

  - id: linux-msg-zerocopy-send
    desc: Enables socket zero-copy and sends with MSG_ZEROCOPY
    conf: 0.97
    all:
      - id: msg-zerocopy-send-call
      - id: so-zerocopy-option
