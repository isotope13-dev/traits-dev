# Linux zero-copy pipe/socket page-fragment operations.  These APIs are
# legitimate in high-performance I/O; the security significance comes from
# composites that require their shared-page form and an exploit primitive.
defaults:
  platforms: [linux]
  for: [c, cpp, go, rust, python, elf]

traits:
  # Keep the native entry point distinct from same-named language methods.
  # In particular, Rust's Vec::splice is a collection edit, not Linux I/O.
  - id: splice-call
    desc: Linux splice system call
    crit: notable
    conf: 0.86
    for: [c, cpp, elf]
    if:
      type: symbol
      kind: call
      exact: splice

  - id: vmsplice-call
    desc: Linux vmsplice system call
    crit: notable
    conf: 0.9
    for: [c, cpp, elf]
    if:
      type: symbol
      kind: call
      exact: vmsplice

  - id: rust-splice-call
    desc: Rust Linux splice system call
    crit: notable
    conf: 0.86
    for: [rust]
    if:
      type: symbol
      kind: call
      regex: '^(libc|nix\.(unistd|syscall))\.splice$'

  - id: rust-vmsplice-call
    desc: Rust Linux vmsplice system call
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: symbol
      kind: call
      regex: '^(libc|nix\.(unistd|syscall))\.vmsplice$'

  - id: go-splice-call
    desc: Go Linux splice system call
    crit: notable
    conf: 0.86
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '^(unix|syscall)\.Splice$'

  - id: go-vmsplice-call
    desc: Go Linux vmsplice system call
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '^(unix|syscall)\.Vmsplice$'

  - id: python-splice-call
    desc: Python Linux splice system call
    crit: notable
    conf: 0.86
    for: [python]
    if:
      type: symbol
      kind: call
      exact: os.splice

  - id: msg-splice-pages-flag
    desc: Linux MSG_SPLICE_PAGES shared-fragment send flag
    crit: notable
    conf: 0.96
    if:
      type: text
      word: MSG_SPLICE_PAGES

composite_rules:
  - id: linux-splice-call
    desc: Linux splice system call
    crit: notable
    conf: 0.9
    any:
      - id: splice-call
      - id: rust-splice-call
      - id: go-splice-call
      - id: python-splice-call

  - id: linux-vmsplice-call
    desc: Linux vmsplice system call
    crit: notable
    conf: 0.9
    any:
      - id: vmsplice-call
      - id: rust-vmsplice-call
      - id: go-vmsplice-call

  - id: splice-page-fragment-chain
    desc: Alternates user buffers and file pages in a zero-copy pipe chain
    crit: notable
    conf: 0.95
    all:
      - id: linux-splice-call
      - id: linux-vmsplice-call
      - id: msg-splice-pages-flag
