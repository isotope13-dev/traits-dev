composite_rules:
- id: winsock-addressed-io-api-set
  desc: Winsock addressed socket I/O API references
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/communications/socket/create::socket-api
  any:
  - id: micro-behaviors/communications/socket/send::sendto-api
  - id: micro-behaviors/communications/socket/init::recvfrom-api
  for:
  - pe
  - dll
  platforms:
  - windows
