# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: sendmsg-syscall
    desc: Sends messages through a socket
    crit: baseline
    if:
      type: syscall
      name: [sendmsg, sendmmsg]
      arch: [x86_64, aarch64]
  - id: recvmsg-syscall
    desc: Receives messages through a socket
    crit: baseline
    if:
      type: syscall
      name: [recvmsg, recvmmsg]
      arch: [x86_64, aarch64]
