defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp]

traits:
  # What the pattern observes is any descriptor added to a `rset` read set; it
  # says nothing about where the descriptor came from. Readline's pty test
  # harness (`FD_SET(masterfd, &rset)`) and any other select() loop produce it.
  - id: c-select-read-set-descriptor
    desc: C select read set adds a descriptor
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'FD_SET\s*\(\s*\w+\s*,\s*&rset\s*\)'

composite_rules:
  # The accepted-socket claim needs an accept() call in the same source as the
  # select loop; without one the descriptor is a pty, pipe or stdin.
  - id: c-accepted-socket-selected
    desc: C select monitors accepted socket
    crit: notable
    conf: 0.88
    all:
      - id: c-select-read-set-descriptor
      - id: micro-behaviors/communications/socket/accept::accept-call-source
