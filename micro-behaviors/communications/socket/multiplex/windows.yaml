defaults:
  attack: T1071
  mbc: C0001
  platforms: [windows]
  for: [pe]

traits:
- id: electron-marker
  desc: Electron runtime marker
  crit: component
  conf: 0.99
  if:
    type: text
    substr: "Electron v"

- id: wsa-create-event
  desc: Create Winsock event handle
  crit: baseline
  conf: 0.9
  if:
    type: symbol
    exact: WSACreateEvent

- id: wsa-event-select
  desc: Bind socket to event
  crit: notable
  conf: 0.92
  if:
    type: symbol
    exact: WSAEventSelect

- id: wsa-wait-multiple-events
  desc: Wait on Winsock events
  crit: notable
  conf: 0.92
  if:
    type: symbol
    exact: WSAWaitForMultipleEvents

- id: wsa-enum-network-events
  desc: Enumerate socket network events
  crit: notable
  conf: 0.92
  if:
    type: symbol
    exact: WSAEnumNetworkEvents

- id: wsa-create-event-text
  desc: WSACreateEvent referenced as text
  crit: component
  conf: 0.94
  if:
    type: text
    word: WSACreateEvent

- id: wsa-event-select-text
  desc: WSAEventSelect referenced as text
  crit: component
  conf: 0.94
  if:
    type: text
    word: WSAEventSelect
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/

- id: wsa-wait-multiple-events-text
  desc: WSAWaitForMultipleEvents referenced as text
  crit: component
  conf: 0.94
  if:
    type: text
    word: WSAWaitForMultipleEvents
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/

- id: wsa-enum-network-events-text
  desc: WSAEnumNetworkEvents referenced as text
  crit: component
  conf: 0.94
  if:
    type: text
    word: WSAEnumNetworkEvents
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/

composite_rules:
- id: winsock-event-loop
  desc: Event-driven Winsock socket loop
  crit: notable
  conf: 0.94
  all:
  - id: wsa-create-event
  - id: wsa-event-select
  - id: wsa-wait-multiple-events
  - id: wsa-enum-network-events
  unless:
  - id: electron-marker

- id: winsock-event-loop-text
  desc: Event-driven Winsock socket loop from text references
  crit: notable
  conf: 0.92
  all:
  - id: wsa-create-event-text
  - id: wsa-event-select-text
  - id: wsa-wait-multiple-events-text
  - id: wsa-enum-network-events-text
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/signed/leaf::qihu-360-software-co.-limited
  - id: metadata/lang/compiler/managed::borland-section-code
