---
defaults:
  platforms:
  - windows
  for:
  - pe
  crit: suspicious
composite_rules:
- id: delphi-resource-winsock-loop-clues
  desc: Delphi resource access and Winsock loop clues
  conf: 0.95
  all:
  - id: micro-behaviors/data/embedded/payload/resource::unsigned-delphi-resource-access
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop-text
  any:
  - id: micro-behaviors/communications/socket/multiplex::wsa-create-event
  - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname-import
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  unless:
  - id: well-known/app/browser/internet-explorer/
- id: delphi-resource-hook-network-clues
  desc: Delphi resource, hook and network clues
  conf: 0.97
  all:
  - id: micro-behaviors/data/embedded/payload/resource::unsigned-delphi-resource-access
  - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop-text
  any:
  - id: micro-behaviors/hardware/input/monitor::input-and-window-api-profile
  - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
  - id: micro-behaviors/hardware/input/keyboard/poll::key-state-ui-timer-pe-api-set
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
