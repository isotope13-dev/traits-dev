# Socket multiplex composites only. Bare poll()/select() atoms live under
# os/event/{poll,select}/ — they are not socket-specific.
defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
composite_rules:
  - id: multiplex
    desc: Socket I/O with poll or select multiplexing
    crit: notable
    conf: 0.66
    all:
      - id: micro-behaviors/communications/socket/create/
    any:
      - id: micro-behaviors/os/event/poll::poll-multiplex
      - id: micro-behaviors/os/event/select::select-multiplex
