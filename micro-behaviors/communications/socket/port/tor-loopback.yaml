# A conventional listener port is an endpoint reference, not proof of Tor,
# SOCKS, a connection, or proxy use. No proxy/execution mapping is inferred.
defaults:
  platforms: [unix, windows, android]
  for: [scripts, binaries]
traits:
  - id: tor-default-loopback-port
    desc: Loopback address at a Tor-default port
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(127\.0\.0\.1|localhost):905[01]\b'
    unless:
      - id: well-known/dual-use/tunnel/messenger::messenger-socks-command
