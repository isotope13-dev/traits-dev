# Socket port number taken from a command-line argument.
#
# Relocated from communications/socket/bind/source/, where it was named
# `c-bind-port-from-argv` ("C binds a port parsed from argv") at crit
# suspicious. The regex only sees the sockaddr field assignment -- it cannot
# tell whether the resulting sockaddr is handed to bind() or to connect() -- and
# in practice most hits are CLIENTS (usrsctp's demo client.c / ekr_client.c /
# http_client.c set sin_port from argv and then inet_pton + connect). Taking the
# port from the command line is also the defining idiom of every configurable
# network tool (netcat, iperf, socat, tutorial servers, test harnesses), so
# "rarely legitimate" was the wrong reading: this is a clear neutral capability.
# The bind-shell INTENT stays where it belongs, in the composite
# objectives/command-and-control/backdoor/dispatch/stdio-bridge::c-bind-stdio-bridge,
# which supplies the listen/select/stdio-pump legs itself.
defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: sockaddr-port-from-argv
    desc: Socket port taken from a CLI argument
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sin_port\s*=\s*htons\s*\(\s*atoi\s*\(\s*argv\s*\['
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/app/infrastructure/apache-httpd::source-tree
