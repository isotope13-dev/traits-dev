# Knock-sequence handling in script code. A knock CLIENT -- the knock(1)
# model: paced connection attempts to closed ports, nothing ever received
# back -- is an ordinary network-tool capability. SSH connection managers and
# hardening guides ship it so the user can open their own firewall before
# dialing, and the identifier alone says nothing about who the sequence is
# for. The covert-activation claim -- code that WATCHES for the sequence and
# then opens access -- is the consumer composite
# objectives/command-and-control/channel/covert::port-knock-activation-listener,
# which adds the receiving side.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.85
  attack: T1205

traits:
  - id: knock-sequence-reference
    desc: Port-knock sequence reference
    if:
      type: text
      regex: '\bport[-_ ]?knocks?\b'
