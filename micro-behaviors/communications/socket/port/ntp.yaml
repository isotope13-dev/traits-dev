# A port reference proves neither UDP traffic nor an NTP exchange.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, go, rust, python]
  crit: notable
  conf: 0.94
traits:
  - id: endpoint-port-123-reference
    desc: Endpoint text or setting references port 123
    if:
      type: text
      # Endpoint-shaped text only before :123 (host, IP, [IPv6]); a loose
      # [^"'\r\n] prefix matched non-endpoint spec strings such as pprof's
      # "pid=123:123" pid:address-range test literal.
      regex: '(["''][A-Za-z0-9_.:\[\]-]{1,120}:123["'']|htons\s*\(\s*123\s*\)|\bport\s*[:=]\s*123\b)'
      not:
        # A color grammar uses rgb:123 for three hexadecimal color digits.
        - regex: '["'']rgb:123["'']'


