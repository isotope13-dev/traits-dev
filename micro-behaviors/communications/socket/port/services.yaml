defaults:
  platforms: [windows, unix]
  for: [powershell, csharp, pe, dll, python, javascript, go, rust]

traits:
  - id: service-port-37777
    desc: Source configures network service port 37777
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\bport\w*\s*[:=]\s*37777\b|https?://[^/\s"]{1,64}:37777\b)'
  - id: rust-smb-tcp-445-target
    desc: Rust SMB transport targets TCP port 445
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'format!\([\s\S]{0,80}:445'
  - id: rust-proxy-dial-tcp-445
    desc: Rust proxy helper dials TCP port 445
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'socks::dial\([^,\r\n]{1,80},\s*445\)'
  - id: smb-port-pair
    desc: Labeled SMB service port pair constants
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(smb|netbios|nbss)\w*ports?\s*[:=]\s*\[?139\b[^\]\n]{0,20}445\b'
  - id: winrm-port-pair
    desc: Labeled WinRM service port pair constants
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bwinrm[A-Za-z0-9_-]*(port|ports|service)\b\s*[:=]\s*\[?\s*5985\b[^\]\n]{0,30}\b5986\b'
  - id: rdp-port
    desc: Labeled RDP service port constant
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(?i)\b(rdp|remote[- ]?desktop|ms-wbt-server)\w*(port|service)?\s*[:=]\s*3389\b'
  - id: kerberos-port
    desc: Labeled Kerberos service port constant
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '(?i)\b(kerberos|krb5)[A-Za-z0-9_-]*(port|service)?\b\s*[:=]\s*88\b'
  - id: mssql-port
    desc: Labeled MS-SQL service port constant
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(?i)\b(mssql|ms[-_ ]?sql|sqlserver)[A-Za-z0-9_-]*(port|service)?\b\s*[:=]\s*1433\b'
  - id: mysql-port
    desc: Labeled MySQL service port constant
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(?i)\bmysql[A-Za-z0-9_-]*(port|service)?\b\s*[:=]\s*3306\b'
  - id: codesys-keyword
    desc: CODESYS automation service reference
    crit: notable
    conf: 0.85
    for: [python, javascript, powershell, go, rust, ruby]
    if:
      type: text
      word: CODESYS
      case_insensitive: true
  - id: codesys-port-11740
    desc: Labeled CODESYS TCP port 11740
    crit: component
    conf: 0.82
    for: [python, javascript, powershell, go, rust, ruby]
    if:
      type: text
      regex: '(?i)\bcodesys[A-Za-z0-9_-]*(port|service|tcp)\b\s*[:=]\s*11740\b'

composite_rules:
  - id: multi-service-port-set
    desc: Multiple Windows and database service port constants
    crit: component
    conf: 0.93
    needs: 4
    any:
      - id: smb-port-pair
      - id: winrm-port-pair
      - id: rdp-port
      - id: kerberos-port
      - id: mssql-port
      - id: mysql-port

  - id: codesys-protocol-usage
    desc: CODESYS protocol usage indicators
    crit: notable
    conf: 0.88
    for: [python, javascript, powershell, go, rust, ruby]
    any:
      - id: codesys-keyword
      - id: codesys-port-11740
