defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: exported-ports-object
    desc: JavaScript exports a ports configuration object
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'export\s+const\s+ports\s*=\s*\{'

  - id: named-port-literal-assignments
    desc: Port-named fields carry numeric endpoints
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\w*port\w*\s*:\s*[1-9]\d{3,4}\s*,'
    count_min: 3

composite_rules:
  - id: named-service-port-map
    desc: JavaScript module exports named service ports
    crit: notable
    conf: 0.9
    all:
      - id: exported-ports-object
      - id: named-port-literal-assignments
