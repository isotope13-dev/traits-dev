defaults:
  platforms:
  - routeros
  - appliance
  - unix
  for:
  - text
  - scripts
  - source
  - binaries
  crit: notable
traits:
- id: routeros-winbox-port-reference
  desc: RouterOS service port or URL reference
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (/tool fetch[\s\S]{0,180}:8291|\bport\s*=\s*8291\b)
- id: routeros-api-port-reference
  desc: RouterOS service port or URL reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(:8728\b|port=8728\b|port=8729\b|TARGET_PORT\s*=\s*8728|/tool fetch[\s\S]{0,180}/api/)'
