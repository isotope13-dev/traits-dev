# A command-line -p / --port flag naming a well-known service port: the
# script passes a port number to some client or server. Relocated from
# objectives/discovery/network/scan/port (script-probes-port-*), where the
# names claimed port probing although the regex only sees the flag -- wolfSSL's
# ocsp.test runs its example TLS client with `-p 443`. The probe intent is
# supplied by objectives/discovery/network/scan/port/shell::script-probes-port, which
# requires a loop over addresses.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.7

traits:
  - id: cli-port-flag-legacy-service
    desc: Port flag names FTP/SSH/Telnet/SMTP port
    if:
      type: text
      regex: '(^|\s)-p\s*2[1235]\b'
  - id: cli-port-flag-dns-web
    desc: Port flag names DNS/HTTP/HTTPS port
    if:
      type: text
      regex: '(-p|--port[= ])\s*(53|80|443)\b'
    unless:
      - id: well-known/lib/cloud/kubernetes::legitimate-kubernetes-incluster-client-marker
      - id: metadata/package/testing/presence/harness::shell-example-directory
  - id: cli-port-flag-mail-netbios
    desc: Port flag names POP3/NetBIOS/IMAP port
    if:
      type: text
      regex: '(-p|--port[= ])\s*1(10|39|43)\b'
