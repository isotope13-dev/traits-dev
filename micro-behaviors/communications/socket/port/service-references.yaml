# Port references and service-port tables; these do not prove network activity.
traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - go
  id: port-2375-reference
  desc: Port 2375 reference
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: :2375\b|\b2375/tcp\b
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - go
  id: port-2376-reference
  desc: Port 2376 reference
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: :2376\b|\b2376/tcp\b
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - go
  id: docker-near-2375-text
  desc: Docker text near 2375
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: 2375.{0,32}docker|docker.{0,32}2375
- id: c-common-service-port-array
  desc: C common service port table
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \w*ports\s*\[\]\s*=\s*\{[^}]{0,99}\b22\b[^}]{0,99}\b80\b[^}]{0,99}\b443\b
  platforms:
  - qnx
  - unix
  for:
  - c
  - cpp
  - objc
composite_rules:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - go
  id: ports-2375-and-2376
  desc: Port 2375 and 2376 references
  crit: notable
  conf: 0.82
  all:
  - id: port-2375-reference
  - id: port-2376-reference
