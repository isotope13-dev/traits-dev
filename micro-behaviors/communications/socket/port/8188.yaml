# A port reference does not identify ComfyUI or any other service.
defaults:
  platforms: [windows, unix]
  for: [python, shell]
  crit: notable
  conf: 0.9
traits:
  - id: port-8188-reference
    desc: References service port 8188
    if:
      type: literal
      regex: ':8188\b'
    unless:
      - id: well-known/app/development/calvyn-code
