# ARM Direct Network Syscalls
# Detects hand-written ARM assembly making direct network syscalls
# Unknown disassembler architectures do not prove ARM. Keep the architecture
# gate explicit on each atom and reject a known non-ARM elf.machine value.
# The exclusion regex accepts every nonempty machine name except exactly arm.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable
traits:
- id: arm-sockaddr-port-53
  desc: Builds ARM sockaddr for port 53
  crit: notable
  conf: 0.9
  arch: [arm]
  if:
    type: hex
    section: ".text"
      # mov ip,0x3500; store the AF_INET family and network port into one
      # sockaddr structure.
    pattern: "35 CC A0 E3 02 30 A0 E3 B8 35 C2 E1 BA C5 C2 E1"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'

