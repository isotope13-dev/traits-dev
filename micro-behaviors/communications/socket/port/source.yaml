defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: loopback-endpoint-with-port
    desc: Loopback socket endpoint with explicit port
    crit: notable
    conf: 0.9
    for: [source]
    platforms: [windows, unix]
    if:
      type: literal
      kind: string
      regex: '(?i)^(127\.0\.0\.1|localhost):[1-9][0-9]{1,4}$'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: c-source-hardcoded-port
    desc: C source hardcodes a network port
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: htons\s*\(\s*[1-9][0-9]{2,4}\s*\)
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
