# CLR type-name references do not establish socket construction or transfer.
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  - unix
traits:
- id: tcpclient-dotnet-str
  desc: .NET TCP client type or method names
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: TcpClient(Async)?$
- id: networkstream-dotnet-str
  desc: .NET NetworkStream class reference
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: NetworkStream
composite_rules:
- id: dotnet-tcpclient-stream-references
  desc: .NET TCP client and stream references
  crit: notable
  conf: 0.85
  all:
  - id: tcpclient-dotnet-str
  - id: networkstream-dotnet-str
