defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
traits:
  # PING and PONG are generic application-protocol keepalive tokens used by
  # Redis, IRC, WebSocket, and many custom protocols. They establish protocol
  # vocabulary, not command-and-control intent.
  - id: ping-command-elf
    desc: ELF contains a PING command token
    crit: component
    conf: 0.8
    for: [elf]
    if:
      type: text
      exact: PING
    unless:
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

  - id: pong-command-elf
    desc: ELF contains a PONG command token
    crit: component
    conf: 0.8
    for: [elf]
    if:
      type: text
      exact: PONG
    unless:
      - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

  # Lowercase formatted pong replies are common in compact text protocols.
  # The token is neutral by itself; botnet intent requires tasking and network
  # evidence in an objective composite.
  - id: pong-format-elf
    desc: ELF contains formatted pong reply
    crit: component
    conf: 0.9
    for: [elf]
    if:
      type: text
      exact: 'pong %s'
      section: rodata

  - id: pong-keepalive-token
    desc: Text-based PONG keepalive token
    crit: component
    conf: 0.75
    for: [pe, dll]
    if:
      type: hex
      section: .rdata
      pattern: 50 4F 4E 47
  - id: pingpong-get-port
    desc: Text-based beaconing string (get_port)
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: get_port_from_controller
  - id: pingpong-echo-return
    desc: Text-based beaconing string (echo_return)
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: echo_and_return
  - id: pingpong-data-corrupt
    desc: Text-based beaconing string (data corrupt)
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: DATA CORRUPT.

composite_rules:
  - id: ping-pong-keepalive-elf
    desc: ELF contains PING and PONG keepalive tokens
    crit: component
    conf: 0.92
    for: [elf]
    all:
      - id: ping-command-elf
      - id: pong-command-elf
