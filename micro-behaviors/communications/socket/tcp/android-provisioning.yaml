defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
composite_rules:
  - id: android-accessibility-adb-pairing-context
    desc: Accessibility actions with ADB pairing services
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/message/intent::android-development-settings-intent
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-node-automation
      - id: micro-behaviors/communications/socket/tcp::android-wireless-adb-services
  - id: android-pairing-and-shell-stream
    desc: ADB pairing and shell service references
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/tcp::android-in-app-adb-shell-stream
    any:
      - id: micro-behaviors/communications/socket/tcp::android-adb-pairing-code-submit
      - id: micro-behaviors/communications/socket/tcp::android-local-adb-pairing-source
  - id: android-adb-shared-object-command
    desc: ADB shared-object and command requests
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/tcp::adb-shell-shared-object-exec-request
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request
