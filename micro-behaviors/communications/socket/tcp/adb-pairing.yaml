# Android's pairing protocol labels, not a particular app or SPAKE2 library.
defaults:
  platforms: [android]
  for: [source, scripts, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: adb-spake2-client-label
    desc: ADB SPAKE2 client identity label
    if:
      type: text
      substr: adb pair client

  - id: adb-spake2-server-label
    desc: ADB SPAKE2 server identity label
    if:
      type: text
      substr: adb pair server

  - id: adb-pairing-auth-key-context
    desc: ADB pairing authentication key context
    if:
      type: text
      substr: adb pairing_auth aes-128-gcm key

composite_rules:
  - id: adb-spake2-pairing-protocol
    desc: ADB SPAKE2 pairing protocol identifiers
    all:
      - id: adb-spake2-client-label
      - id: adb-spake2-server-label
      - id: adb-pairing-auth-key-context
