# Android 11+ Wireless Debugging advertises separate TLS pairing and connection
# services. These protocol identifiers survive custom client implementations
# and DEX compilation, unlike library-specific pairing class names.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  mbc: C0001

traits:
  - id: wireless-pairing-service
    desc: Wireless ADB pairing service
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: _adb-tls-pairing._tcp.

  - id: wireless-connect-service
    desc: Wireless ADB connection service
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: _adb-tls-connect._tcp.

composite_rules:
  - id: android-wireless-adb-services
    desc: Android Wireless ADB service pair
    crit: notable
    conf: 0.99
    all:
      - id: wireless-pairing-service
      - id: wireless-connect-service
