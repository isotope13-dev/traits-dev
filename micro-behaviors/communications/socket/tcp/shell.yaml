defaults:
  attack: T1071
  mbc: C0001
  platforms: [unix]
  for: [shell, javascript, typescript]
traits:
  # The stock one-liner for "is this port open": a timed bash subshell opening
  # fd 3 on /dev/tcp. Health-check scripts and reverse shells both use it, so
  # it is a probe idiom rather than evidence on its own.
  - id: bash-devtcp-timed-probe
    desc: Timed bash /dev/tcp port probe
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'timeout 3 bash -c "exec 3<>/dev/tcp/'
  - id: socat-openssl-connect
    desc: socat OpenSSL outbound connection
    crit: notable
    conf: 0.9
    attack: T1573.002
    if:
      type: text
      regex: '(?i)(\$SOCAT|socat)\b.{0,64}OPENSSL-CONNECT:'
  - id: dev-tcp-path
    desc: Shell /dev/tcp socket path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: /dev/tcp/.{1,80}/[0-9]{1,5}\b
  - id: dev-tcp-fd-redirect
    desc: Bash fd redirect to /dev/tcp
    # Neutral TCP connect via bash /dev/tcp; reverse-shell/HTTP intent lives in
    # objectives composites that combine this with interactive shell or HTTP verbs.
    crit: notable
    conf: 0.9
    for:
      - shell
    if:
      type: text
      regex: exec\s+[0-9]+<>"?/dev/tcp/
    not:
      # Loopback port probes are local health checks, not C2.
      - regex: 'exec\s+[0-9]+<>"?/dev/tcp/(127\.0\.0\.1|localhost|::1)/'
    unless:
      - id: bash-devtcp-timed-probe
      - type: text
        substr: 'port_busy()'
      - type: text
        substr: '/dev/tcp/127.0.0.1/'
      - id: well-known/app/productivity/stirling-pdf::source-tree
  - id: dev-tcp-external-ip
    desc: Shell /dev/tcp external endpoint
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: /dev/tcp/([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,5}\b
      is: external_ip
    unless:
      - id: well-known/app/utility/cmdchamp/
