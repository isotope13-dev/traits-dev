defaults:
  platforms: [unix, windows]
  # JSON included: mining endpoints appear inside CloudFormation/IaC
  # templates, miner config files, and dumped CloudTrail request records,
  # and are just as notable there as in a script.
  for: [scripts, binaries, json]

traits:
  - id: stratum-tcp-url
    desc: Stratum TCP endpoint reference
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: stratum+tcp://
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - id: micro-behaviors/process/terminate/signal::procfs-miner-target-termination

  - id: stratum-ssl-url
    desc: Stratum TLS endpoint reference
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: stratum+ssl://

  - id: stratum-term-with-mining-context
    desc: Stratum term near mining context
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bstratum\b.{0,40}\b(mining|pool|subscribe)\b'
    unless:
      - id: well-known/tool/detection/skill-scanner::source-context
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - id: micro-behaviors/process/terminate/signal::procfs-miner-target-termination

  - id: stratum-subscribe-method
    desc: Stratum mining subscribe method
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: mining.subscribe

  - id: stratum-authorize-method
    desc: Stratum mining authorize method
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: mining.authorize

  - id: stratum-submit-method
    desc: Stratum mining submit method
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: mining.submit

  - id: stratum-extranonce-field
    desc: Stratum extra-nonce work field
    crit: notable
    conf: 0.96
    if:
      type: text
      word: extranonce

  - id: stratum-login-rpc
    desc: Stratum login RPC with miner credentials
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"method"\s*:\s*"login".{0,80}"(login|pass|agent)"'

  - id: stratum-share-submit-rpc
    desc: Stratum share submission RPC
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"method"\s*:\s*"submit".{0,80}"(job_id|nonce|result)"'

  - id: stratum-port-3333
    desc: Stratum-adjacent port 3333 reference
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(stratum|pool|mining).{0,40}:\s*3333\b'

composite_rules:
  - id: stratum-keyword
    desc: Stratum term with mining context
    crit: notable
    unless:
      - id: well-known/tool/detection/skill-scanner::source-context
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - id: micro-behaviors/process/terminate/signal::procfs-miner-target-termination
    any:
      - id: stratum-term-with-mining-context
      - id: stratum-tcp-url
      - id: stratum-ssl-url

  - id: stratum-mining-methods
    desc: Stratum mining RPC methods
    crit: notable
    any:
      - id: stratum-subscribe-method
      - id: stratum-authorize-method
      - id: stratum-submit-method

  - id: stratum-mining-protocol
    desc: Stratum mining protocol reference
    crit: notable
    any:
      - id: stratum-mining-methods
      - id: stratum-tcp-url
      - id: stratum-ssl-url
      - id: stratum-extranonce-field
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
      - id: micro-behaviors/process/terminate/signal::procfs-miner-target-termination

  - id: stratum-login-submit-workflow
    desc: Stratum miner login and share submission workflow
    crit: notable
    conf: 0.98
    all:
      - id: stratum-login-rpc
      - id: stratum-share-submit-rpc
