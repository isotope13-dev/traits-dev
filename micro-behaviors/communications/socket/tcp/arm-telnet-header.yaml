defaults:
  platforms: [linux, android]
  for: [elf]
  arch: [arm]
  crit: notable
traits:
  # Builds an IPv4/TCP header: protocol 6, destination port 23 (0x17),
  # TCP data offset 5 and SYN (2). Branch displacements are not pinned.
  - id: arm-tcp-syn-telnet-header
    desc: ARM constructs TCP SYN header for Telnet
    conf: 0.99
    if:
      type: hex
      offset_range: [256, 262144]
      pattern: '40 30 A0 E3 [20] 06 20 A0 E3 29 30 43 E2 09 20 C4 E5 01 C0 CB E5 0C 10 CB E5 03 30 CB E5 [12] ?? ?? ?? EB [8] 02 30 83 E3 [8] 0D 30 CB E5'
