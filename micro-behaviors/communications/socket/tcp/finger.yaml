defaults:
  crit: notable
  platforms: [windows, unix]
  for: [shell, python, batch, powershell, javascript, html, vbs, pe, dll]
  attack: T1071
  mbc: C0002

traits:
  - id: finger-command-user-host
    desc: finger command user host query
    for: [shell, python, batch, powershell, javascript, html, source]
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bf\^*i\^*n\^*g\^*e\^*r(\.exe)?\s+[\w.-]{1,64}@[\w.^-]{3,253}\.[A-Za-z]{2,24}\b'
  - id: finger-command-user-ip
    desc: finger command user IP query
    for: [shell, python, batch, powershell, javascript, html, source]
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bf\^*i\^*n\^*g\^*e\^*r(\.exe)?\s+[\w.-]{1,64}@(\d{1,3}\.){3}\d{1,3}\b'

  - id: finger-command-option-query
    desc: Finger remote query with optional switches
    crit: notable
    for: [batch, powershell, javascript, vbs, html]
    if:
      type: text
      regex: 'finger(\.exe)?\s+([-/][A-Za-z0-9?._-]+\s+){0,2}[A-Za-z0-9._-]{1,64}@[A-Za-z0-9.-]{1,253}'
      case_insensitive: true
    unless:
      - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
      - id: metadata/document/html/
    conf: 1.0

composite_rules:
  - id: finger-command-query
    desc: finger protocol command query
    conf: 0.9
    any:
      - id: finger-command-user-host
      - id: finger-command-user-ip
      - id: finger-command-option-query
