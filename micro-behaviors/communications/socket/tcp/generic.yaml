defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, -python]
traits:
  - id: sock-stream
    desc: SOCK_STREAM socket type
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: SOCK_STREAM
  - id: tcp-conn
    desc: Binary embeds the Go TCPConn symbol text
    crit: baseline
    conf: 0.5
    if:
      type: text
      word: TCPConn
  - id: create-socket
    desc: CreateSocket function
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: CreateSocket
  # Runtime diagnostic strings for TCP connection failures. These are the
  # POSIX/errno wordings emitted by libc, Go's net package, Ruby, Python and
  # most other runtimes alike, so the matcher is language-agnostic: it proves
  # only that the file carries the message text, not which stack produced it.
  - id: endpoint-state-error-string
    desc: TCP endpoint state diagnostic string
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: transport endpoint is (not|already) connected
  - id: connection-refused-error-string
    desc: TCP connection-refused diagnostic string
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: connection refused
    unless:
      - id: metadata/binary/metrics/threshold::many-imports-40
  - id: connection-timeout-error-string
    desc: TCP connection-timeout diagnostic string
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: connection timed out
    unless:
      - id: metadata/binary/metrics/threshold::many-imports-40
  - id: connection-reset-error-string
    desc: TCP connection-reset diagnostic string
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: connection reset by peer
    unless:
      - id: metadata/binary/metrics/threshold::many-imports-40
  - id: connection-abort-error-string
    desc: Connection-abort/drop diagnostic string
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: \bconnection (abort|dropped)\b
    unless:
      # Static glibc embeds this errno diagnostic even in programs that
      # never exercise a TCP connection.
      - id: metadata/binary/linking/runtime::glibc-runtime-markers
      - id: metadata/binary/linking/static::elf-needed-libs-zero
composite_rules:
  - id: connect-comp
    desc: TCP connection operations
    crit: notable
    conf: 0.66
    any:
      - id: sock-stream
      - id: micro-behaviors/communications/socket/connect::dial
      - id: tcp-conn
      - id: create-socket
      - id: connection-error-string
      - id: endpoint-state-error-string
  - id: connection-error-string
    desc: TCP connection-failure diagnostic string
    crit: baseline
    conf: 0.6
    any:
      - id: connection-refused-error-string
      - id: connection-timeout-error-string
      - id: connection-reset-error-string
      - id: connection-abort-error-string
