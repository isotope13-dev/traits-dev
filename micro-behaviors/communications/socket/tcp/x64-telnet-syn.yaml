defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  - id: x64-tcp-syn-telnet-header
    desc: x64 constructs TCP SYN header for Telnet
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # IPv4 protocol 6, network-order destination port 23, TCP data
      # offset 5 and SYN flag 2. Global addresses and PRNG call vary.
      pattern: 'C6 05 [4] 06 66 C7 05 [4] 00 17 66 89 1D [4] 83 E0 0F 83 C8 50 88 05 [4] E8 [4] [22] 80 0D [4] 02'
