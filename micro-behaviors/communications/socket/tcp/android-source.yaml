defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.94

traits:
  - id: android-loopback-socket-target
    desc: Java socket targets loopback TCP
    if:
      type: text
      regex: '(Socket|InetSocketAddress)\s*\(\s*["''](127\.0\.0\.1|localhost)["'']'

  - id: android-adb-wire-packet-source
    desc: Source constructs ADB wire packets
    conf: 0.96
    if:
      type: text
      regex: 'CNXN.{0,24}OPEN.{0,96}shell:'

  # ADB opens a command shell by asking for the `shell:<cmd>` service (the
  # `shell,v2,raw:` form is the Android 8+ protocol variant).  Anchoring on the
  # Android command binary that follows the colon keeps this off the countless
  # unrelated uses of the bare word "shell:" in comments, docs and config.
  - id: android-adb-shell-command-service-request
    desc: ADB shell service runs an Android command
    conf: 0.96
    for: [dex, java, kotlin]
    if:
      type: text
      regex: '(?i)shell(,v2,raw)?:(pm|am|cmd|settings|dumpsys|input|screencap)'

  # An in-process ADB client asks the daemon for the `shell:` service to get a
  # command shell.  Reaching this from inside an app -- rather than from a
  # workstation's adb binary -- means the app is issuing shell-UID commands
  # against the device it is running on.
  - id: android-in-app-adb-shell-stream
    desc: App opens an ADB shell service stream
    conf: 0.96
    for: [java, kotlin, dex]
    if:
      type: text
      regex: '\bopenStream\s*\(\s*["'']shell[,:]'

  # Wireless debugging pairing normally needs a human to read the six-digit
  # code off the Settings dialog and type it into another machine.  Code that
  # passes a pairing code to a pair() call is completing that exchange without
  # the second machine.
  - id: android-adb-pairing-code-submit
    desc: Submits an ADB wireless pairing code
    conf: 0.94
    for: [java, kotlin, dex]
    if:
      type: text
      regex: '(?i)\bpair\s*\([^)]{0,120}\bpairing[_]?code\b'

  # A raw TCP dial against a numeric port is the shape of a relay uplink or
  # a control channel, not of ordinary HTTP traffic, which goes through a
  # URL client. The port itself is not pinned: proxy enrollments rotate it.
  - id: android-fixed-port-socket-dial
    desc: Java socket dials a numeric port
    conf: 0.9
    attack: T1090
    if:
      type: text
      regex: '(new\s+)?Socket\s*\(\s*[^,;\n)]{1,120},\s*\d{2,5}\s*\)'

  # A relay has to hold both directions of the channel at once: one side's
  # input becomes the other side's output. Seeing both stream ends opened in
  # the same span is the pipe primitive.
  - id: android-socket-reconnect-loop
    desc: Redials a socket inside an infinite loop
    conf: 0.93
    attack: T1090
    if:
      type: text
      regex: 'while\s*\(\s*true\s*\)[\s\S]{0,800}(new\s+)?Socket\s*\('

composite_rules:
  - id: android-local-adb-pairing-source
    desc: Android source pairs with local ADB
    crit: notable
    conf: 0.98
    all:
      - id: android-loopback-socket-target
      - id: android-adb-wire-packet-source
      - id: micro-behaviors/crypto/asymmetric/pake::spake2-key-exchange
