defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.94

traits:
  - id: android-loopback-socket-target
    desc: Java socket targets loopback TCP
    if:
      type: text
      regex: '(Socket|InetSocketAddress)\s*\(\s*["''](127\.0\.0\.1|localhost)["'']'

  - id: android-adb-wire-packet-source
    desc: Source constructs ADB wire packets
    conf: 0.96
    if:
      type: text
      regex: 'CNXN.{0,24}OPEN.{0,96}shell:'

  # ADB opens a command shell by asking for the `shell:<cmd>` service (the
  # `shell,v2,raw:` form is the Android 8+ protocol variant).  Anchoring on the
  # Android command binary that follows the colon keeps this off the countless
  # unrelated uses of the bare word "shell:" in comments, docs and config.
  - id: android-adb-shell-command-service-request
    desc: ADB shell service runs an Android command
    conf: 0.96
    for: [java, kotlin, apk, zip, dex]
    if:
      type: text
      regex: '(?i)shell(,v2,raw)?:(pm|am|cmd|settings|dumpsys|input|screencap)'

composite_rules:
  - id: android-local-adb-pairing-source
    desc: Android source pairs with local ADB
    crit: notable
    conf: 0.98
    all:
      - id: android-loopback-socket-target
      - id: android-adb-wire-packet-source
      - id: micro-behaviors/crypto/asymmetric/pake::spake2-key-exchange
