defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, c, cpp, go, rust, dex]
  attack: T1021

traits:
  - id: adb-cnxn-command
    desc: ADB CNXN protocol command literal
    crit: component
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: CNXN

  - id: adb-auth-command
    desc: ADB AUTH protocol command literal
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: AUTH

  - id: adb-host-features-banner
    desc: ADB host feature-negotiation banner
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "host::features="

  - id: adb-private-key-path
    desc: References prepared ADB private-key material
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      regex: '(^|[\\/])adbkey(\.pem)?$'

  - id: adb-sync-service
    desc: ADB file synchronization service request
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: "sync:"

  - id: adb-sync-send-command
    desc: ADB sync SEND command literal
    crit: component
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: SEND

  - id: adb-shell-apk-install
    desc: ADB shell service installs an APK
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+package|pm)\s+install\b.{0,200}\.apk\b'

  # `-r` replaces the installed package and `-g` grants every runtime
  # permission during installation. Match both option orders so the behavior
  # survives command-builder and implementation changes.
  - id: adb-shell-apk-reinstall-auto-grant
    desc: ADB reinstalls APK and grants permissions
    crit: notable
    conf: 0.99
    attack: T1631
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+package|pm)\s+install\b(.*\s-r\b.*\s-g\b|.*\s-g\b.*\s-r\b).{0,200}\.apk\b'

  # Android 13+ refuses to bind Accessibility for an app whose install was not
  # attributed to a trusted source. `pm install -i <pkg>` lets the caller name
  # any package as the installer, which is how that restriction is escaped; a
  # normal install lets the platform supply the attribution itself.
  - id: adb-shell-apk-install-source-spoof
    desc: ADB install spoofs the installer package
    crit: notable
    conf: 0.97
    attack: T1631
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+package|pm)\s+install\b.{0,200}\s-i\s+[a-z][a-z0-9_]*(\.[a-z0-9_]+)+'

  # Doze and App Standby are what stop a background component from running
  # indefinitely. A developer exempts a package by hand while testing battery
  # behaviour; an agent that issues the exemption over its own ADB channel is
  # buying itself uninterrupted runtime.
  - id: adb-shell-doze-whitelist-add
    desc: ADB exempts a package from Doze
    crit: notable
    conf: 0.97
    attack: T1624.001
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd|dumpsys)\s+deviceidle\s+whitelist\s*\+'

  # A `lib*.so` is a shared object the loader maps into a process. Executing
  # one as a standalone program out of the world-writable `/data/local/tmp`
  # drop directory is staged native payload wearing a system-library name.
  - id: adb-shell-exec-staged-shared-object
    desc: ADB runs staged .so as program
    crit: suspicious
    conf: 0.97
    attack: T1036.005
    if:
      type: literal
      kind: string
      regex: '^shell:(/system/bin/sh\s+-c\s+)?/data/local/tmp/lib[A-Za-z0-9._-]{1,40}\.so\b'

  - id: adb-shell-port-reconfigure
    desc: Changes ADB TCP port property
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '^shell:setprop\s+(service|persist\.[a-z0-9_.-]*)\.adb\.tcp\.port\s+\d{1,5}\b'

  - id: adb-shell-system-apk-copy
    desc: Copies APK into Android system app path
    crit: suspicious
    conf: 0.99
    if:
      type: literal
      kind: string
      regex: '^shell:(cp|mv|install)\s+.{1,180}\.apk\s+/(system|product|vendor)/(priv-)?app/'

composite_rules:
  - id: adb-client-auth-handshake
    desc: Implements an authenticated ADB client handshake
    crit: notable
    conf: 0.98
    all:
      - id: adb-cnxn-command
      - id: adb-auth-command
      - id: adb-host-features-banner
    near_bytes: 768

  - id: adb-sync-file-push
    desc: Pushes a file through the ADB synchronization service
    crit: notable
    conf: 0.96
    all:
      - id: adb-sync-service
      - id: adb-sync-send-command
    near_bytes: 768
