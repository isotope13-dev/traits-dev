defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, c, cpp, go, rust, dex, apk]
  attack: T1021

traits:
  - id: adb-cnxn-command
    desc: ADB CNXN protocol command literal
    crit: component
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: CNXN

  - id: adb-auth-command
    desc: ADB AUTH protocol command literal
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: AUTH

  - id: adb-host-features-banner
    desc: ADB host feature-negotiation banner
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "host::features="

  - id: adb-private-key-path
    desc: References prepared ADB private-key material
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      regex: '(^|[\\/])adbkey(\.pem)?$'

  - id: adb-sync-service
    desc: ADB file synchronization service request
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: "sync:"

  - id: adb-sync-send-command
    desc: ADB sync SEND command literal
    crit: component
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: SEND

  - id: adb-shell-apk-install
    desc: ADB shell service installs an APK
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+package|pm)\s+install\b.{0,200}\.apk\b'

  - id: adb-shell-port-reconfigure
    desc: Changes ADB TCP port property
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '^shell:setprop\s+(service|persist\.[a-z0-9_.-]*)\.adb\.tcp\.port\s+\d{1,5}\b'

  - id: adb-shell-system-apk-copy
    desc: Copies APK into Android system app path
    crit: suspicious
    conf: 0.99
    if:
      type: literal
      kind: string
      regex: '^shell:(cp|mv|install)\s+.{1,180}\.apk\s+/(system|product|vendor)/(priv-)?app/'

composite_rules:
  - id: adb-client-auth-handshake
    desc: Implements an authenticated ADB client handshake
    crit: notable
    conf: 0.98
    all:
      - id: adb-cnxn-command
      - id: adb-auth-command
      - id: adb-host-features-banner
    near_bytes: 768

  - id: adb-sync-file-push
    desc: Pushes a file through the ADB synchronization service
    crit: notable
    conf: 0.96
    all:
      - id: adb-sync-service
      - id: adb-sync-send-command
    near_bytes: 768
