defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  - id: ruby-subnet-host-sweep
    desc: Ruby iterates every host of a /24
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\(1\.\.254\)\.each\s*(do\s*|\{\s*)\|\w+\|'

  # Array literal of ports that holds both SMB (445) and RDP (3389).
  - id: ruby-smb-rdp-port-list
    desc: Ruby port list holds SMB and RDP
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\[[\d,\s]{0,60}\b445\b[\d,\s]{0,60}\b3389\b[\d,\s]{0,60}\]'
