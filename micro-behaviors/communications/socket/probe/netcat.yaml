defaults:
  platforms: [unix, android, ios]
  for: [elf, shell]

traits:
  - id: netcat-port-scan
    desc: Netcat probes a port range
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bnc\b[^\n]{0,80}\s-zv?\b[^\n]{0,80}\b([0-9]{1,5}-[0-9]{1,5}|[0-9]{1,5},[0-9,\s-]{1,80})\b'
    not:
      - substr: nc 127.0.0.1
      - substr: nc localhost
    unless:
      - id: well-known/app/utility/cmdchamp/
      - type: text
        regex: \bnc\b.{0,40}(127\.0\.0\.1|localhost)\b
      - type: text
        substr: nc -z -w 1 127.0.0.1 $port | grep -ic succeeded
      - type: text
        regex: (until|while !)\s+nc\b.{0,24}\s-zv?(\s|$)
    attack: T1046
