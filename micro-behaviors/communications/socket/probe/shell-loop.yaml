defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: shell-port-scanner
    desc: Shell loop probes ports with netcat
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: (for|while)[^\n;]{0,50}\{[^\n;]{0,50}\bnc\s+[^;&|\n]{0,20}-z\b
    attack: T1046
