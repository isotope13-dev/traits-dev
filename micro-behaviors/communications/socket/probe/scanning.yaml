defaults:
  platforms: [unix, android, ios]
  for: [elf, shell]

composite_rules:
  - id: port-scanning
    desc: Port scanning command or loop
    crit: notable
    conf: 0.9
    attack: T1046
    any:
    - id: micro-behaviors/communications/socket/probe::netcat-port-scan
    - id: micro-behaviors/communications/socket/probe::nmap-scanning
    - id: micro-behaviors/communications/socket/probe::shell-port-scanner
    unless:
    - id: well-known/app/utility/cmdchamp/
