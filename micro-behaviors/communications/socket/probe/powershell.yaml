# Identify PowerShell code that walks both target addresses and a port list,
# then uses TcpClient.Connect for the probe. Scope HTML to source-bearing pages
# such as GitHub code views; the three required observations describe the code,
# not execution of the containing page.
defaults:
  for: [powershell, html]
  platforms: [windows]

traits:
  - id: powershell-port-target-loop
    desc: PowerShell iterates target addresses
    crit: component
    if:
      type: text
      regex: '(?i)foreach\s*\(\s*\$ip\s+in\s+\$targets\s*\)'

  - id: powershell-port-list-loop
    desc: PowerShell iterates a port list
    crit: component
    if:
      type: text
      regex: '(?i)foreach\s*\(\s*\$p\s+in\s+\$Ports\s*\)'

composite_rules:
  - id: powershell-tcp-port-scan
    desc: PowerShell iterates targets and ports for TCP probes
    crit: notable
    conf: 0.93
    attack: T1046
    near_bytes: 8192
    all:
      - id: powershell-port-target-loop
      - id: powershell-port-list-loop
      - id: micro-behaviors/communications/socket/create::powershell-tcpclient-connect-call
