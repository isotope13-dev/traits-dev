# Bind the ULP name to the socket-option call, including a local buffer alias.
# A string mentioning espintcp beside an unrelated setsockopt is insufficient.
defaults:
  platforms: [linux]
  for: [c, cpp, go, rust, python]
  crit: notable
traits:
  - id: espintcp-socket-option
    desc: Passes ESP-in-TCP ULP name to setsockopt
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.|::)(setsockopt|SetsockoptString)$'
      arg:
        from:
          value: '^espintcp$'
