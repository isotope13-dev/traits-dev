# Raw-IP socket-option references. Crafting packets with an IP header the
# program supplies is a raw-socket capability; flood-tool composites pair it
# with their own banner and usage evidence.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.9
traits:
  - id: ip-hdrincl-option-reference
    desc: References the IP_HDRINCL raw-IP socket option
    if:
      type: text
      word: IP_HDRINCL
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
