defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  - source
  - documents
  - data
  - zip
  - tar
  - markdown
  crit: notable
  conf: 0.99
  size_min: 1
  size_max: 500000000

traits:
  - id: server-host-port-default-options
    desc: Server host/port option default text
    crit: notable
    conf: 0.9
    for: [ruby]
    if:
      type: text
      regex: "'ServerHost'\\s*=>\\s*'0\\.0\\.0\\.0'|'ServerPort'\\s*=>\\s*55553"

