defaults:
  platforms: [unix]
  for: [c, cpp, rust, python]
  crit: notable
  conf: 0.95

traits:
  - id: ipv4-multicast-join-call
    desc: Joins an IPv4 multicast group with setsockopt
    if:
      type: symbol
      kind: call
      regex: '(^|\.|::)setsockopt$'
      arg:
        index: 2
        kind: identifier
        name: IP_ADD_MEMBERSHIP

  - id: ipv4-multicast-ttl-call
    desc: Sets IPv4 multicast hop limit with setsockopt
    if:
      type: symbol
      kind: call
      regex: '(^|\.|::)setsockopt$'
      arg:
        index: 2
        kind: identifier
        name: IP_MULTICAST_TTL
