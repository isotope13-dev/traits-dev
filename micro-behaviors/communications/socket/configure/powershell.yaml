defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-receive-all-control-code
    desc: PowerShell selects receive-all socket control
    if:
      type: text
      regex: '(?i)\[(System\.)?Net\.Sockets\.IOControlCode\]::ReceiveAll\b'
  - id: powershell-include-ip-header-option
    desc: PowerShell enables supplied IP packet headers
    if:
      type: text
      regex: '(?i)\.SetSocketOption\("IP",\s*"HeaderIncluded",\s*\$true\)'
