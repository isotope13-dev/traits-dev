defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-global-connect-override
    desc: Replaces Python's global socket connect method
    if:
      type: symbol
      kind: bind
      exact: socket.socket.connect

  - id: python-self-bind-call
    desc: Python instance method calls bind
    if:
      type: symbol
      kind: call
      exact: self.bind

composite_rules:
  - id: python-global-connect-source-bind
    desc: Socket connect override with instance binding
    near_lines: 30
    all:
      - id: python-global-connect-override
      - id: python-self-bind-call
