defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-global-connect-override
    desc: Replaces Python's global socket connect method
    if:
      type: symbol
      kind: bind
      exact: socket.socket.connect

composite_rules:
  - id: python-global-connect-source-bind
    desc: Socket connect override with instance binding
    near_lines: 30
    all:
      - id: python-global-connect-override
      - id: micro-behaviors/communications/socket/bind/function::python-self-bind-address-pair-call
