defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: setsockopt-symbol
    desc: References a setsockopt-named symbol
    crit: notable
    conf: 0.66
    if:
      type: symbol
      regex: setsockopt
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/communications/socket/configure::setsockopt-import
composite_rules:
  - id: setsockopt-api-reference
    desc: References socket option configuration API
    crit: notable
    conf: 0.8
    any:
      - id: setsockopt-symbol
      - id: micro-behaviors/communications/socket/configure::setsockopt-import
