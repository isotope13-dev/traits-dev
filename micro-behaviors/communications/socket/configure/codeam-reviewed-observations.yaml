traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: redis-cluster-port-field
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Redis or cluster field names port 6379
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)\b(redis|cluster)[A-Za-z0-9_-]*(port|endpoint|url)\b\s*[:=]\s*6379\b
