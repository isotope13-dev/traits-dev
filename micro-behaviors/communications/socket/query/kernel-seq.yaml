defaults:
  platforms: [unix]
  for: [elf, c]

traits:
  - id: tcp4-seq-show-reference
    desc: References tcp4 socket-listing callback
    crit: notable
    conf: 0.85
    if:
      type: symbol
      substr: tcp4_seq_show
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: tcp6-seq-show-reference
    desc: References tcp6 socket-listing callback
    crit: notable
    conf: 0.85
    if:
      type: symbol
      substr: tcp6_seq_show
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: udp4-seq-show-reference
    desc: References udp4 socket-listing callback
    crit: notable
    conf: 0.85
    if:
      type: symbol
      substr: udp4_seq_show
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: udp6-seq-show-reference
    desc: References udp6 socket-listing callback
    crit: notable
    conf: 0.85
    if:
      type: symbol
      substr: udp6_seq_show
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
composite_rules:
  - id: tcp-udp-seq-show-references
    desc: References kernel socket-listing callbacks
    crit: notable
    conf: 0.85
    any:
    - id: micro-behaviors/communications/socket/query::tcp4-seq-show-reference
    - id: micro-behaviors/communications/socket/query::tcp6-seq-show-reference
    - id: micro-behaviors/communications/socket/query::udp4-seq-show-reference
    - id: micro-behaviors/communications/socket/query::udp6-seq-show-reference
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
