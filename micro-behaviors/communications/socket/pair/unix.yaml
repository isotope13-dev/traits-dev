defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, python, elf]
traits:
  - id: pair
    desc: Creates a connected socket pair
    crit: notable
    conf: 0.72
    if:
      type: symbol
      regex: '(^|\.|::)[Ss]ocketpair$'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: unix-socketpair-domain-arg
    desc: References Unix socket domain constant
    crit: component
    conf: 0.75
    for: [c, cpp, rust, go, python]
    if:
      type: text
      regex: '\b(AF_UNIX|AF_LOCAL|PF_UNIX|AddressFamily::Unix)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: socketpair-dgram-type-arg
    desc: References datagram socket type token
    crit: component
    conf: 0.75
    for: [c, cpp, rust, go, python]
    if:
      type: text
      regex: '\b(SOCK_DGRAM|SockType::Datagram)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: x64-unix-dgram-socketpair-args
    desc: Loads AF_UNIX and SOCK_DGRAM arguments
    crit: component
    conf: 0.85
    for: [elf]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      # System V AMD64 socketpair(AF_UNIX=1, SOCK_DGRAM=2, 0, sv):
      # edi = 1 (BF 01 00 00 00), esi = 2 (BE 02 00 00 00), followed by call.
      pattern: '( BF 01 00 00 00 [0-8] BE 02 00 00 00 | BE 02 00 00 00 [0-8] BF 01 00 00 00 ) [0-12] E8'

composite_rules:
  - id: unix-dgram-socketpair-source
    desc: Creates AF_UNIX datagram socket pair
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, python]
    near_lines: 6
    all:
      - id: pair
      - id: unix-socketpair-domain-arg
      - id: socketpair-dgram-type-arg

  - id: x64-elf-unix-dgram-socketpair
    desc: Creates AF_UNIX datagram socketpair in ELF
    crit: notable
    conf: 0.92
    for: [elf]
    arch: [x86-64]
    all:
      - id: pair
      - id: x64-unix-dgram-socketpair-args

  - id: unix-datagram-socketpair
    desc: Creates Unix-domain datagram socket pair
    crit: notable
    conf: 0.92
    any:
      - id: unix-dgram-socketpair-source
      - id: x64-elf-unix-dgram-socketpair
