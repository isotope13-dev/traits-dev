# Wire framing for RAT packet protocols that prefix every encrypted message
# with a small multi-u32 header (sequence number, compressed/original sizes,
# flags) and transport the per-message key material inline: the packed fields
# concatenated with the symmetric key and nonce. Seen in AtlasRAT's 56-byte
# header (4x u32 + 32-byte ChaCha20 key + 8-byte nonce); later variants may
# change widths while keeping the shape.
defaults:
  crit: notable
  platforms: [windows, unix]
  attack: T1573
traits:
  - id: sequence-size-header-pack
    desc: Packs four-u32 sequence-size header
    conf: 0.88
    for: [python]
    if:
      type: text
      regex: 'struct\.(pack|unpack)\s*\(\s*[''"][<>!=]?IIII[''"]'
  - id: key-nonce-header-append
    desc: Appends key and nonce to packed header
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?s)struct\.pack\(.{0,200}?\)\s*\+\s*\w+\s*\+\s*\w*nonce'
  - id: u32-quad-header-tail
    desc: Writes fourth u32 at header offset 12
    conf: 0.88
    for: [javascript]
    if:
      type: text
      regex: 'writeUInt32LE\(.{0,80}?,\s*12\)'
  - id: key-offset-header-placement
    desc: Places 32-byte key at header offset 16
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '(subarray\(16,\s*48\)|\.copy\(\s*\w+\s*,\s*16\s*,\s*0\s*,\s*32\s*\))'
