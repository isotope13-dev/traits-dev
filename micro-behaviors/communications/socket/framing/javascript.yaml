# Node.js implementations of a compact binary frame with a four-byte
# big-endian payload length followed by a one-byte message type.  This is a
# neutral protocol capability; command-and-control intent is added by objective
# rules that require command dispatch and process execution on the framed TLS
# channel.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
  mbc: C0001

traits:
  - id: node-be32-frame-length-write
    desc: Writes BE32 payload length plus type
    if:
      type: text
      regex: 'writeUInt32BE\s*\([^,\r\n]{1,64}\+\s*1\s*,\s*0\s*\)'

  - id: node-frame-type-byte-write
    desc: Writes frame type byte at offset four
    if:
      type: text
      regex: 'writeUInt8\s*\([^,\r\n]{1,48},\s*4\s*\)'

  - id: node-be32-frame-length-read
    desc: Reads BE32 frame length at offset zero
    if:
      type: text
      regex: 'readUInt32BE\s*\(\s*0\s*\)'

  - id: node-frame-type-byte-read
    desc: Reads frame type byte at offset four
    if:
      type: text
      regex: 'readUInt8\s*\(\s*4\s*\)'

composite_rules:
  - id: node-be32-length-byte-type-frame-write
    desc: Writes length-and-type binary frame header
    crit: notable
    conf: 0.97
    near_bytes: 256
    all:
      - id: node-be32-frame-length-write
      - id: node-frame-type-byte-write

  - id: node-be32-length-byte-type-frame-read
    desc: Reads length-and-type binary frame header
    crit: notable
    conf: 0.97
    near_bytes: 256
    all:
      - id: node-be32-frame-length-read
      - id: node-frame-type-byte-read

  - id: node-be32-length-byte-type-framing
    desc: Bidirectional length-and-type binary framing
    crit: notable
    conf: 0.98
    near_bytes: 8192
    all:
      - id: node-be32-length-byte-type-frame-write
      - id: node-be32-length-byte-type-frame-read
