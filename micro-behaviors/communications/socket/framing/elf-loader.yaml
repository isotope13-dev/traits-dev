# Architecture selector sent by compact native downloaders before requesting
# a stage.  This is a protocol-field capability, not a family signature.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  # l32/l64 identify x86 and a32/a64 identify ARM.  The individual tokens are
  # only fragments; the composite below supplies the protocol-field meaning.
  - id: arch-beacon-l32
    desc: l32 architecture beacon token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: '6C 33 32 00'
  - id: arch-beacon-l64
    desc: l64 architecture beacon token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: '6C 36 34 00'
  - id: arch-beacon-a32
    desc: a32 architecture beacon token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: '61 33 32 00'
  - id: arch-beacon-a64
    desc: a64 architecture beacon token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: '61 36 34 00'

composite_rules:
  - id: native-loader-architecture-beacon
    desc: Six-byte native-loader architecture beacon
    crit: notable
    conf: 0.92
    any:
      - id: arch-beacon-l32
      - id: arch-beacon-l64
      - id: arch-beacon-a32
      - id: arch-beacon-a64
