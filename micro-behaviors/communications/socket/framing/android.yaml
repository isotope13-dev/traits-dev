# The proxy protocol described in the reporting uses an outer integer-length
# frame and an AES-ECB metadata envelope before carrying an inner SOCKS5
# exchange.  These atoms describe those protocol mechanics, not vendor names.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, apk, zip]
  attack: T1573

traits:
  - id: android-bytebuf-transport
    desc: Netty byte-buffer transport type
    crit: component
    if:
      type: text
      word: ByteBuf

  - id: android-bytebuffer-transport
    desc: Java byte-buffer transport type
    crit: component
    if:
      type: text
      word: ByteBuffer

  - id: android-data-stream-transport
    desc: Java data-stream transport type
    crit: component
    if:
      type: text
      regex: '\bData(Input|Output)Stream\b'

  - id: android-integer-read-call
    desc: Reads an integer frame length
    crit: component
    if:
      type: text
      regex: '\b(readInt|getInt)\s*\('

  - id: android-integer-write-call
    desc: Writes an integer frame length
    crit: component
    if:
      type: text
      regex: '\b(writeInt|putInt)\s*\('

composite_rules:
  - id: android-byte-buffer-transport
    desc: Java byte-buffer transport type
    crit: component
    any:
      - id: android-bytebuf-transport
      - id: android-bytebuffer-transport

  - id: android-integer-length-framed-socket-message
    desc: Integer-length framed socket message
    crit: notable
    conf: 0.9
    all:
      - id: android-integer-read-call
    any:
      - id: android-byte-buffer-transport
      - id: android-data-stream-transport
      - id: android-integer-write-call
    near_lines: 30

  - id: android-aes-ecb-length-framed-message
    desc: AES-ECB integer-framed socket message
    crit: notable
    conf: 0.95
    all:
      - id: android-integer-length-framed-socket-message
      - id: micro-behaviors/crypto/symmetric/aes/mode::java-aes-ecb-mode
    near_bytes: 2200
