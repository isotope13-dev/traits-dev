# The proxy protocol described in the reporting uses an outer integer-length
# frame and an AES-ECB metadata envelope before carrying an inner SOCKS5
# exchange.  These atoms describe those protocol mechanics, not vendor names.
defaults:
  platforms: [android, unix, windows]
  # Evaluate one code unit at a time. Archive containers can otherwise pool a
  # socket reference from one sibling with an integer read from another.
  for: [java, kotlin, class, dex]
  attack: T1573

traits:
  - id: bytebuf-transport
    desc: Netty byte-buffer transport type
    crit: component
    if:
      type: text
      word: ByteBuf

  - id: bytebuffer-transport
    desc: Java byte-buffer transport type
    crit: component
    if:
      type: text
      word: ByteBuffer

  - id: data-stream-transport
    desc: Java data-stream transport type
    crit: component
    if:
      type: text
      regex: '\bData(Input|Output)Stream\b'

  - id: socket-class-reference
    desc: Socket class reference
    crit: component
    if:
      type: text
      word: Socket

  - id: server-socket-class-reference
    desc: Server socket class reference
    crit: component
    if:
      type: text
      word: ServerSocket

  - id: channel-transport-reference
    desc: Socket channel class reference
    crit: component
    if:
      type: text
      regex: '\b(SocketChannel|DatagramChannel)\b'

  - id: datagram-socket-class-reference
    desc: Datagram socket class reference
    crit: component
    if:
      type: text
      word: DatagramSocket

  - id: local-socket-class-reference
    desc: Local socket class reference
    crit: component
    if:
      type: text
      word: LocalSocket

  - id: zmq-transport-reference
    desc: ZeroMQ transport class reference
    crit: component
    if:
      type: text
      word: ZMQ

composite_rules:
  - id: socket-transport-reference
    desc: Socket transport class reference
    crit: component
    any:
      - id: socket-class-reference
      - id: server-socket-class-reference
      - id: channel-transport-reference
      - id: datagram-socket-class-reference
      - id: local-socket-class-reference
      - id: zmq-transport-reference

  - id: byte-buffer-transport
    desc: Java byte-buffer transport type
    crit: component
    any:
      - id: bytebuf-transport
      - id: bytebuffer-transport

  - id: integer-length-framed-socket-message
    desc: Integer-length framed socket message
    crit: notable
    conf: 0.9
    # Do not assemble framing evidence from unrelated archive siblings (for
    # example, a Socket import in one class and getInt in another).
    scope: file
    all:
      - id: micro-behaviors/data/buffer::integer-read-method-call
      - id: socket-transport-reference
    any:
      - id: byte-buffer-transport
      - id: data-stream-transport
      - id: micro-behaviors/data/buffer::integer-write-method-call
    near_lines: 30

  - id: aes-ecb-length-framed-socket-message
    desc: AES-ECB integer-framed socket message
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: integer-length-framed-socket-message
      - id: micro-behaviors/crypto/symmetric/aes/mode::java-aes-ecb-mode
    near_bytes: 2200
