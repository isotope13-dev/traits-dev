defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, c, cpp, rust, go, ruby]

traits:
  - id: dtls-handshake-record-prefix
    desc: Constructs DTLS handshake record prefix
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(\\x16\\xfe\\x(f[fd])|0x16\s*,\s*0xfe\s*,\s*0xf[fd])'

