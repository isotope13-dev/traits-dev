# Compiled x86-64 length-prefix operations. The two atoms intentionally cover
# opposite directions so the composite identifies an actual framed protocol,
# not an isolated byte swap used by a file parser.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  mbc: C0001

traits:
  - id: big-endian-u32-length-send-x64
    desc: Sends four-byte big-endian length prefix
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '89 D8 48 8D 74 24 ?? BA 04 00 00 00 4C 89 E7 0F C8 89 44 24 ?? E8 ?? ?? ?? ??'

  - id: big-endian-u32-length-receive-x64
    desc: Receives four-byte big-endian length prefix
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'BA 04 00 00 00 E8 ?? ?? ?? ?? 85 C0 79 ?? 31 DB E9 ?? ?? ?? ?? 8B 6C 24 ?? 0F CD'

composite_rules:
  - id: bidirectional-big-endian-u32-framing-x64
    desc: Native protocol uses bidirectional u32 framing
    crit: suspicious
    conf: 0.995
    all:
      - id: big-endian-u32-length-send-x64
      - id: big-endian-u32-length-receive-x64
