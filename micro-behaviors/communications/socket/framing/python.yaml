defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1573
traits:
  - id: big-endian-u32-framing
    desc: Big-endian u32 length framing
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'struct\.(pack|unpack)\([\"\x27]>I[\"\x27]'
  - id: high-bit-frame-length-mask
    desc: Applies a high-bit frame length mask
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(declared|frame_?len(gth)?)\s*(\|=|=[^\r\n]{0,40}\|)\s*0x[0-9a-f]{5,8}\b'
  - id: length-prefixed-encrypted-message
    desc: Length-prefixed encrypted message text
    crit: component
    conf: 0.86
    if:
      type: text
      substr: length-prefixed encrypted message
  - id: python-device-registration-datagram
    desc: Python sends a device registration datagram
    crit: notable
    conf: 0.96
    attack: T1071
    if:
      type: tree-sitter
      kind: call
      regex: 'sendto\s*\(\s*b?["'']REGISTER["'']\s*\+\s*[A-Za-z_]\w*'
composite_rules:
  - id: high-bit-big-endian-u32-length
    desc: Packs a high-bit big-endian u32 length
    crit: notable
    conf: 0.96
    all:
      - id: big-endian-u32-framing
      - id: high-bit-frame-length-mask
    near_lines: 10
  - id: aesgcm-length-prefixed-socket
    desc: AES-GCM socket message framing
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
    any:
      - id: big-endian-u32-framing
      - id: length-prefixed-encrypted-message
    near_lines: 20
  - id: big-endian-length-prefix-json
    desc: Big-endian length-prefixed JSON
    crit: notable
    conf: 0.9
    all:
      - id: big-endian-u32-framing
      - id: micro-behaviors/data/serialize/json/
