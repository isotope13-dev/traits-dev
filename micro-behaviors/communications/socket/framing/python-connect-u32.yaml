# A nearby connection and uint32 decoder suggest socket protocol framing,
# not executable payload staging. Preserve the text fallback for embedded
# Python snippets; the finding asserts co-occurrence, not value flow.
defaults:
  platforms: [unix, windows]
  for: [python, text, makefile]

composite_rules:
  - id: python-uint32-unpack-near-connect
    desc: Python uint32 unpack near socket connect
    crit: notable
    conf: 0.85
    near_lines: 40
    all:
      - id: micro-behaviors/data/buffer/integer-codec::python-uint32-unpack
      - id: micro-behaviors/communications/socket/connect::python-connect-literal-address-text
