# The rctl-derived router implant registers with a fixed 39-byte record: a
# 33-byte class field padded with NULs followed by a six-byte MAC address.
# These atoms describe that protocol layout without naming a vendor or family.
defaults:
  platforms: [unix, appliance]
  for: [c, cpp, rust, go]
  attack: T1071

traits:
  # The bare 39-element array length is NOT modelled here: it is a neutral
  # buffer declaration (ryu digit tables, FreeBSD mc_frame[39], setjmp
  # buffers all have it), so it lives in micro-behaviors/data/buffer/ and is
  # referenced below. What makes this the router-implant registration record
  # is the 33-byte class field plus the MAC copy at offset 33.
  - id: c-33-byte-class-field
    desc: C 33-byte registration class field
    crit: component
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      regex: '\bchar\s+(class|label|devid)\s*\[\s*33\s*\]'

  - id: c-symbolic-class-field
    desc: C symbolic registration class field
    crit: component
    conf: 0.91
    for: [c, cpp]
    if:
      type: text
      regex: '\bchar\s+(class|label|devid)\s*\[\s*DEVID_LEN\s*\]'

  - id: rust-33-byte-class-slice
    desc: Rust registration class slice ending at 33
    crit: component
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '\[[A-Za-z0-9_ \t]{0,24}\.\.\s*33\s*\]'

  - id: c-registration-mac-copy
    desc: C copies data at registration offset 33
    crit: component
    conf: 0.92
    for: [c, cpp]
    if:
      type: text
      regex: 'memcpy\s*\([^;\n]{0,80}\+\s*33'

  - id: rust-registration-mac-copy
    desc: Rust copies the registration tail
    crit: component
    conf: 0.92
    for: [rust]
    if:
      type: text
      regex: '\[\s*33\s*\.\.\s*39\s*\]\.copy_from_slice'

  - id: go-33-byte-class-copy
    desc: Go copies a 33-byte class field
    crit: component
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: '\bcopy\s*\(\s*[A-Za-z_]\w*\s*\[\s*:\s*33\s*\]\s*,'

  - id: go-registration-mac-copy
    desc: Go copies a six-byte registration tail
    crit: component
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '\bcopy\s*\(\s*[A-Za-z_]\w*\s*\[\s*33\s*:\s*(39\s*)?\]\s*,\s*[A-Za-z_]\w*\s*\[\s*:\s*6\s*\]'

composite_rules:
  - id: c-class-mac-registration
    desc: C class field and MAC registration frame
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/buffer::fixed-thirtynine-byte-array
      - id: c-33-byte-class-field
      - id: c-registration-mac-copy
    near_lines: 24

  - id: c-symbolic-class-mac-registration
    desc: C symbolic class and MAC registration frame
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/buffer::fixed-thirtynine-byte-array
      - id: c-symbolic-class-field
      - id: c-registration-mac-copy
    near_lines: 24

  - id: rust-class-mac-registration
    desc: Rust class slice and MAC registration frame
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/buffer::rust-thirtynine-byte-array
      - id: rust-33-byte-class-slice
      - id: rust-registration-mac-copy
    near_lines: 24

  - id: go-class-mac-registration
    desc: Go class field and MAC registration frame
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/buffer::go-thirtynine-byte-array
      - id: go-33-byte-class-copy
      - id: go-registration-mac-copy
    near_lines: 24

  - id: fixed-class-mac-registration
    desc: Fixed class and MAC registration frame
    crit: suspicious
    conf: 0.98
    any:
      - id: c-class-mac-registration
      - id: c-symbolic-class-mac-registration
      - id: rust-class-mac-registration
      - id: go-class-mac-registration
