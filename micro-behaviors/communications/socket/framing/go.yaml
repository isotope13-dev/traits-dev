# Protocol-header serialization is a neutral transport capability. The
# version-byte sequence and field layout together identify a DTLS record
# header; neither observation implies C2 or hostile intent.
defaults:
  platforms: [windows, unix]
  for: [go]

traits:
  - id: go-dtls-content-type-byte
    desc: Writes DTLS application-data type byte
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'b\[0\]\s*=\s*23'

  - id: go-dtls-version-major-byte
    desc: Writes DTLS version major byte
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'b\[1\]\s*=\s*254'

  - id: go-dtls-version-minor-byte
    desc: Writes DTLS version minor byte
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'b\[2\]\s*=\s*253'

  - id: go-dtls-header-fields
    desc: Defines DTLS epoch sequence length fields
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?s)type\s+dtls\s+struct\s*\{.{0,160}\b(epoch|sequence|length)\b'

composite_rules:
  - id: go-dtls-record-header
    desc: Serializes a DTLS record header
    crit: notable
    conf: 0.98
    all:
      - id: go-dtls-content-type-byte
      - id: go-dtls-version-major-byte
      - id: go-dtls-version-minor-byte
      - id: go-dtls-header-fields
    near_lines: 40
