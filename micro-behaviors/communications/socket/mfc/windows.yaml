# MFC socket class names and the legacy Winsock OCX are observable client
# capabilities, not C2 by themselves.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: mfc-casyncsocket-class
    desc: MFC CAsyncSocket class is linked
    if:
      type: symbol
      regex: CAsyncSocket
  - id: mfc-csocket-class
    desc: MFC CSocket class is linked
    if:
      type: import
      regex: CSocket
  - id: mswinsck-ocx
    desc: MSWINSCK ActiveX Winsock control
    if:
      type: text
      regex: '(?i)MSWINSCK\.OCX'
  - id: mfc42u-dll
    desc: Unicode MFC42 runtime DLL name
    if:
      type: text
      regex: '(?i)^MFC42u\.DLL$'
