# Win16 VBX socket control. IPPORT.VBX gives a 16-bit program a network
# connection; it says nothing about the purpose. Objectives add the DoS or
# mail-abuse claim from their own behavior, so this atom carries no attack.
defaults:
  platforms: [windows]
  for: [ne, pe, data]
  crit: notable
  conf: 0.9

traits:
  - id: win16-ipport-vbx
    desc: Win16 IPPORT.VBX network control
    if:
      type: text
      substr: "IPPORT.VBX"
