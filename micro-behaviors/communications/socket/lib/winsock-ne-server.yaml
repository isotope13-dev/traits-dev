defaults:
  for: [ne]
  platforms: [windows]
  crit: notable

traits:
  - id: ne-winsock-library-ref
    desc: References Winsock library by name
    conf: 0.92
    if:
      type: text
      substr: winsock.dll
  - id: ne-winsock-server-bind
    desc: References Winsock bind API name
    conf: 0.88
    if:
      type: text
      substr: bind
  - id: ne-winsock-server-listen
    desc: References Winsock listen API name
    conf: 0.88
    if:
      type: text
      substr: listen
  - id: ne-winsock-server-accept
    desc: References Winsock accept API name
    conf: 0.88
    if:
      type: text
      substr: accept
  - id: ne-winsock-socket-control
    desc: References Socket Winsock control
    conf: 0.9
    if:
      type: text
      substr: Socket1

composite_rules:
  - id: ne-winsock-server-lifecycle
    desc: NE Winsock server socket lifecycle
    crit: notable
    conf: 0.93
    all:
      - id: ne-winsock-library-ref
    any:
      - id: ne-winsock-server-bind
      - id: ne-winsock-server-listen
      - id: ne-winsock-server-accept
    needs: 2
