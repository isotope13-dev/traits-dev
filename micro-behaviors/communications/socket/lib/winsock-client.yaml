# Reusable Winsock outbound client import grouping (named and ordinal imports).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

composite_rules:
  - id: winsock-client-io-pe
    desc: Winsock connect, send, and recv imports
    conf: 0.92
    all:
      - id: micro-behaviors/communications/socket/receive::recv-api
      - id: micro-behaviors/communications/socket/send/reference::send-api
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-connect
