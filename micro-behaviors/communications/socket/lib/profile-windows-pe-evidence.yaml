defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-pe-high-entropy-winsock-clues
    desc: Unsigned PE, entropy and Winsock clues
    crit: notable
    conf: 0.9
    for:
      - pe
    all:
      - id: metadata/binary/section/entropy::small-high-entropy-data-section
      - id: metadata/binary/section/entropy::bounded-high-entropy-rdata-section
      - id: micro-behaviors/fs/path/system/library::ws2-32-dll-marker
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: winsock-module-handle-clues
    desc: PE Winsock and module-handle clues
    crit: notable
    conf: 0.96
    for:
      - pe
    all:
      - id: unsigned-pe-high-entropy-winsock-clues
      - id: micro-behaviors/dylib/lookup::get-module-handle-wide
    unless:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: winsock-ntohl-ordinal-clues
    desc: PE Winsock and ntohl ordinal clues
    crit: notable
    conf: 0.95
    for:
      - pe
    all:
      - id: unsigned-pe-high-entropy-winsock-clues
      - id: micro-behaviors/data/buffer/integer-codec::ntohl-api-ordinal
    unless:
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/create::socket-api-ordinal
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
