# AF_ECONET is a Linux socket family. Naming it is the capability; the
# privilege-escalation composite supplies the overflow intent.
defaults:
  platforms: [linux]
  for: [elf, c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: econet-socket-name
    desc: Names the econet socket protocol
    if:
      type: text
      regex: '(?i)\beconet\b'
