# REALbasic/Xojo runtimes and plugins expose SocketReadAll as their ordinary
# receive primitive. Its presence describes network I/O, not RAT intent.
defaults:
  platforms: [macos, windows, linux]
  for: [macho, pe, dll, elf]
  crit: notable
  conf: 0.88
  attack: T1071
  mbc: C0001

traits:
  - id: realbasic-socket-read-all
    desc: REALbasic socket read-all capability
    if:
      type: text
      regex: '(REAL|plugin|SSL|IPC)SocketReadAll|_SocketReadAll'
