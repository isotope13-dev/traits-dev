defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-datagram-receive-call
    desc: Rust receives a datagram from a socket
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(UdpSocket|UnixDatagram)\b[\s\S]{0,180}\.(recv_from|recvfrom)\s*\('

  - id: rust-stream-receive-call
    desc: Rust reads from a named network stream
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(TcpStream|UnixStream)\b[\s\S]{0,180}\.(read|read_exact|read_to_end)\s*\('

composite_rules:
  - id: rust-socket-receive-call
    desc: Rust receives data from a socket
    crit: notable
    conf: 0.9
    any:
      - id: rust-datagram-receive-call
      - id: rust-stream-receive-call
