defaults:
  crit: notable
  mbc: C0001
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: recv-symbol
    desc: References recv socket API
    conf: 0.66
    if:
      type: symbol
      exact: recv
  - id: recvmsg-symbol
    desc: References recvmsg socket API
    conf: 0.66
    if:
      type: symbol
      exact: recvmsg
  - id: kernel-recvmsg-symbol
    desc: References kernel socket receive API
    conf: 0.9
    for: [c, cpp]
    if:
      type: symbol
      exact: kernel_recvmsg
  - id: recvfrom-symbol
    desc: References recvfrom socket API
    conf: 0.66
    if:
      type: symbol
      exact: recvfrom
  - id: recvfrom-identifier
    desc: References recvfrom identifier
    conf: 0.66
    for: [c, cpp]
    if:
      type: symbol
      kind: identifier
      exact: recvfrom
  - id: recvmmsg-symbol
    desc: References recvmmsg socket API
    conf: 0.66
    if:
      type: symbol
      exact: recvmmsg
composite_rules:
  - id: receive
    desc: Socket receive API reference
    conf: 0.66
    any:
      - id: recv-symbol
      - id: recvmsg-symbol
      - id: recvfrom-symbol
      - id: recvfrom-identifier
      - id: recvmmsg-symbol
