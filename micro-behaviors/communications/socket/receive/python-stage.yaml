# A staged download that grows a buffer inside a receive loop bounded by an
# expected stage size, rather than a single read call. Loaders pull
# multi-hundred-kilobyte second stages this way so a short read cannot
# truncate the payload.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1105
traits:
  - id: staged-recv-accumulation
    desc: Grows staged buffer in receive loop
    conf: 0.88
    if:
      type: text
      regex: '(?s)\bwhile\s+len\(\w+\)\s*<\s*\w+\s*:.{0,400}?\.recv\('
