defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable

traits:
  - id: arm-recv-literal-syscall-wrapper
    desc: ARM recv syscall with literal-pool r7
    crit: notable
    conf: 0.99
    arch: [arm]
    if:
      type: hex
      section: ".text"
      # Little-endian literal-pool encoding of Linux ARM SYS_recv (291).
      pattern: "(30 70 9F E5 00 00 00 EF [48]|28 70 9F E5 00 00 00 EF [40]) 23 01 00 00"
    unless:
      - type: value
        path: elf.machine
        regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
