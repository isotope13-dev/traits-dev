# block_api shellcode calls recv as `push <ROR13 hash>; call ebp`.
# 0x5FC8D902 is ws2_32!recv. The 4-byte length is how a reverse_tcp stager
# learns the size of the second stage before it allocates memory for it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_max: 5242880

traits:
  - id: recv-stage-length-ror13-x86
    desc: ROR13 recv of 4-byte stage length
    crit: notable
    conf: 0.97
    attack: T1095
    if:
      type: hex
      # push 0; push 4; push esi; push edi; push recv; call ebp
      pattern: '6A 00 6A 04 56 57 68 02 D9 C8 5F FF D5'
      offset_range: [0, null]
