defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # Receive-shaped four-argument call, positive-length guard, copy of the
  # same buffer, then dispatch on the copied record's first dword. Addresses,
  # stack offsets and branch displacements vary between builds.
  - id: x86-recv-copied-record-dispatch
    desc: x86 receive-shaped record copy and dispatch
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .data
      pattern: >-
        56 68 28 05 00 00 FF 75 ?? 53 FF 15 [4]
        85 C0 0F 8E [4] 8B 75 ?? BA 4A 01 00 00
        8B CA 33 C0 8D BD [4] F3 AB 8B CA 8D BD [4] F3 A5
        8B 85 [4] 3D 99 00 00 00 0F 87 [4] 0F 84 [4]
        83 F8 06 0F 87 [4] 0F 84 [4]
        48 74 ?? 48 74 ?? 48 74 ?? 48 74 ?? 48 0F 85 [4]
