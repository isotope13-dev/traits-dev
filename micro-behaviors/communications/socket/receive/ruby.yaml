# Ruby socket receive primitives. Reading a response from an established
# socket is a neutral communication capability, not a reverse shell by itself.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.75
  attack: T1071
  mbc: C0001

traits:
  - id: ruby-socket-gets
    desc: Ruby reads a line from a socket
    if:
      type: symbol
      kind: member
      regex: '^(sock|socket)\.gets$'
