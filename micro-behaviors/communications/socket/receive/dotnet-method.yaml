defaults:
  for:
  - pe
  - csharp
  platforms:
  - windows
  crit: notable
  conf: 0.82
traits:
- id: dotnet-begin-receive-method-token
  desc: .NET BeginReceive method-name reference
  crit: notable
  for: [pe, dll]
  if:
    type: text
    exact: BeginReceive
- id: dotnet-receive-async-method-token
  desc: .NET ReceiveAsync method reference
  crit: notable
  if:
    type: text
    word: ReceiveAsync
  unless:
  - type: basename
    regex: ^System\.Net\.(WebSockets(\.Client)?|Sockets|Http)\.dll$
  - id: metadata/file/extension/identity::netstandard-dll-basename
