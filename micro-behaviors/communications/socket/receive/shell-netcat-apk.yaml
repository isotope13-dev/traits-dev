defaults:
  platforms: [unix, android]
  for: [shell]
  crit: notable
traits:
  - id: shell-netcat-apk-output
    desc: Netcat connection writes an APK file
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        ((redirected_statement body: (command) @receiver
           redirect: (file_redirect ">" destination: (_) @output))
         (#match? @receiver "^((busybox[0-9]*|toybox)[ \\t]+)?(nc|netcat)[ \\t]+")
         (#match? @output "\\.apk[\"']?$"))
