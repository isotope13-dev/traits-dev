# A receiver name is a syntactic socket hint, not runtime type inference.
defaults:
  platforms: [unix, windows]
  for: [python, text, makefile]
  crit: notable
  conf: 0.85

traits:
  - id: python-socket-named-recv-assignment
    desc: Assigns recv result from socket-named receiver
    if:
      type: text
      regex: '=\s*([\w.]*\.)?([\w]*_)?(socket|sock|conn|client|s)\s*\.\s*recv\s*\('
