defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-receive-buffer-append-loop
    desc: x86 receive loop appends to connection buffer
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      # recv return length in ESI bounds memcpy and advances the same
      # connection buffer cursor; does not by itself establish execution.
      pattern: 'FF D7 8B F0 89 B5 ?? ?? ?? ?? 85 F6 7E ?? 56 8D 85 ?? ?? ?? ?? 50 8D 43 ?? 03 43 ?? 50 E8 ?? ?? ?? ?? 01 73 ?? 83 C4 0C'
