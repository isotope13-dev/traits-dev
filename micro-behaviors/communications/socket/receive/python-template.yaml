defaults:
  for: [python]
  platforms: [windows]
traits:
  - id: python-tcp-read-loop-template
    desc: Builds a PowerShell TCP read-loop template
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((string (interpolation) @slot) @payload
          (#match? @payload "(?i)New-Object[ \\t]+(Net\\.)?Sockets\\.TCPClient\\(")
          (#match? @payload "\\.GetStream\\(\\)")
          (#match? @payload "while\\(.*\\.Read\\("))
