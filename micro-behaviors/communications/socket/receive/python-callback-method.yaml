# Event-driven Python network code (Twisted protocols, asyncore/asyncio
# handlers, websocket servers) receives data through instance methods named
# for the event: dataReceived, handle_read, on_message, recv_data. The
# definition alone is ordinary; it marks where inbound bytes enter a class.
defaults:
  platforms: [linux, macos, windows]
  for: [python]

traits:
  - id: python-receive-callback-method
    desc: Python read or receive callback method
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '(?i)def\s+\w*(read|recv|receive|received|message)\w*\(\s*self\s*,[^)]{0,80}\)\s*:'
