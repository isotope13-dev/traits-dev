defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.72
  attack: T1071
  mbc: C0001

traits:
  - id: go-socket-read-call
    desc: Go socket Read method call
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(conn|connection|socket|stream|tcpConn|udpConn)\.Read$'

  - id: go-packet-connection-read-from
    desc: Go packet connection receive call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.PacketConn\.ReadFrom$'
