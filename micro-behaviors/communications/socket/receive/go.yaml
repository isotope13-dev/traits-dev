defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.72
  attack: T1071
  mbc: C0001

traits:
  - id: go-socket-read-call
    desc: Go socket Read method call
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(conn|connection|socket|stream|tcpConn|udpConn)\.Read$'

  - id: go-packet-connection-read-from
    desc: Go packet connection receive call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.PacketConn\.ReadFrom$'

composite_rules:
  # This is a protocol-client shape, not scanning intent. HTTP clients,
  # telemetry agents, health checks, and banner tools all use the same bounded
  # connect/read sequence; the caller's naming or iteration supplies intent.
  - id: go-time-bounded-tcp-response-read
    desc: Go TCP client reads a response with a deadline
    crit: notable
    conf: 0.9
    near_lines: 24
    all:
      - id: micro-behaviors/communications/socket/connect::dial-timeout-tcp
      - id: micro-behaviors/communications/socket/options::go-set-read-deadline-call
      - id: go-socket-read-call
