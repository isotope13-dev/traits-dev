defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95

traits:
  - id: powershell-sslstream-read-callback
    desc: PowerShell TLS stream read callbacks
    if:
      type: yara
      source: |
        rule powershell_sslstream_read_callback {
          strings:
            $stream = "System.Net.Security.SslStream" ascii nocase
            $begin = /\.[ ']*BeginRead[' ]*\(/ ascii nocase
            $end = /\.[ ']*EndRead[' ]*\(/ ascii nocase
          condition:
            all of them
        }
