# Swift Network.framework socket receive patterns
defaults:
  platforms: [macos, ios]
  for: [macho]
traits:
  - id: nwconnection-receive-source
    desc: Swift source receives with NWConnection
    crit: notable
    conf: 0.9
    for: [swift]
    if:
      type: text
      regex: 'NWConnection[\s\S]{0,800}\b[A-Za-z_]\w*\.receive\s*\('
  - id: nwconnection-receive
    desc: Swift NWConnection receive call
    crit: notable
    conf: 0.85
    mbc: "C0001"
    attack: "T1071"
    if:
      type: symbol
      regex: "NWConnection.{0,80}receive"
