# Swift Network.framework socket receive patterns
defaults:
  platforms: [macos, ios]
  for: [macho]
traits:
  - id: nwconnection-receive-source
    desc: Swift receive call with minimum byte bound
    crit: notable
    conf: 0.9
    for: [swift]
    if:
      # This Network.framework signature identifies the operation without an
      # arbitrary distance from the connection's declaration or a comment.
      type: tree-sitter
      kind: call
      regex: '\.receive\s*\(\s*minimumIncompleteLength\s*:'
  - id: nwconnection-receive
    desc: Swift NWConnection receive call
    crit: notable
    conf: 0.85
    mbc: "C0001"
    attack: "T1071"
    if:
      type: symbol
      regex: "NWConnection.{0,80}receive"
