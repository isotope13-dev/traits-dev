defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
traits:
  - id: i386-bounded-network-record-dispatch
    desc: x86 bounded network record parser handoff
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      # Swap the received uint16 length, reject lengths over 1024, receive
      # that many bytes with MSG_PEEK|MSG_NOSIGNAL, then parse the record.
      pattern: >-
        66 C1 C8 08 66 3D 00 04 66 89 84 24 [4] 0F 87 [4]
        C7 ( 03 | 07 ) 00 00 00 00 68 02 40 00 00 66 8B 84 24 [4]
        25 FF FF 00 00 50 8D ( 44 | 54 ) 24 ?? ( 50 | 52 ) A1 [4] 50 E8 [4]
        [80-160] 66 85 C0 0F 84 [4] 25 FF FF 00 00
        52 52 50 8D ( 44 | 54 ) 24 ?? ( 50 | 52 ) E8 [4]
