defaults:
  platforms: [unix]
  for: [rust, c, cpp]
  crit: notable
  conf: 0.9
traits:
  - id: scm-rights
    desc: References SCM_RIGHTS fd-passing option
    if:
      type: text
      substr: SCM_RIGHTS
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: sendmsg-fd-handoff
    desc: SCM_RIGHTS and sendmsg appear together
    if:
      type: text
      regex: 'SCM_RIGHTS[\s\S]{0,600}sendmsg|sendmsg[\s\S]{0,600}SCM_RIGHTS'
    unless:
      - id: metadata/package/license::linux-syscall-note-license
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
composite_rules:
  - id: unix-fd-handoff
    desc: Unix descriptor-passing option beside sendmsg
    crit: notable
    conf: 0.95
    all:
      - id: scm-rights
      - id: sendmsg-fd-handoff
