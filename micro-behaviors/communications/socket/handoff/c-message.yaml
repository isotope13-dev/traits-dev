defaults:
  for: [c, cpp]
  platforms: [unix]
  crit: notable
  conf: 0.98

traits:
  # Bind the ancillary header to the message sent, and the CMSG_DATA copy to
  # that header. This does not imply the passed descriptor was stolen or that
  # the routine is reachable through a functioning accept hook.
  - id: scm-rights-message-send-source
    desc: Sends descriptors through an SCM_RIGHTS message
    if:
      type: tree-sitter
      language: c
      query: |
        ((compound_statement
          (declaration (init_declarator
            declarator: (pointer_declarator declarator: (identifier) @header)
            value: (call_expression function: (identifier) @first
              arguments: (argument_list . (pointer_expression
                operator: "&" argument: (identifier) @message) .))))
          . (expression_statement (assignment_expression
            left: (field_expression argument: (identifier) @level_header
              field: (field_identifier) @level_field)
            right: (identifier) @level))
          . (expression_statement (assignment_expression
            left: (field_expression argument: (identifier) @type_header
              field: (field_identifier) @type_field)
            right: (identifier) @rights))
          . (expression_statement (assignment_expression
            left: (field_expression argument: (identifier) @length_header
              field: (field_identifier) @length_field)))
          . (expression_statement (call_expression function: (identifier) @copy
            arguments: (argument_list
              . (call_expression function: (identifier) @data
                arguments: (argument_list . (identifier) @data_header .))
              . (pointer_expression operator: "&" argument: (identifier)))))
          . (return_statement (call_expression function: (identifier) @send
            arguments: (argument_list . (_) . (pointer_expression
              operator: "&" argument: (identifier) @sent)))) @evidence)
          (#eq? @first "CMSG_FIRSTHDR") (#eq? @level "SOL_SOCKET")
          (#eq? @rights "SCM_RIGHTS") (#eq? @level_field "cmsg_level")
          (#eq? @type_field "cmsg_type") (#eq? @length_field "cmsg_len")
          (#eq? @copy "memcpy") (#eq? @data "CMSG_DATA") (#eq? @send "sendmsg")
          (#eq? @header @level_header) (#eq? @header @type_header)
          (#eq? @header @length_header) (#eq? @header @data_header)
          (#eq? @message @sent)
          (#set! cleave.ignore-comments "true"))
