# Windows Network (WNet) share enumeration
# WNetOpenEnum/WNetEnumResource - enumerates network resources
# Used by LAN-spreading worms to find writable shares
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, python]
traits:
  - id: wnet-open-enum
    desc: Starts Windows network-resource enumeration
    conf: 0.9
    for: [c, cpp, csharp]
    if:
      type: symbol
      regex: '^WNetOpenEnum(A|W)?$'
  - id: wnet-enum-resource
    desc: Enumerates Windows network resources
    conf: 0.9
    for: [c, cpp, csharp]
    if:
      type: symbol
      regex: '^WNetEnumResource(A|W)?$'
  - id: wnet-open-enum-import
    desc: Start network resource enumeration import
    conf: 0.94
    for: [pe, dll]
    if:
      type: import
      regex: '^WNetOpenEnum(A|W)?$'
  - id: wnet-enum-resource-import
    desc: Enumerate network resource entries import
    conf: 0.94
    for: [pe, dll]
    if:
      type: import
      regex: '^WNetEnumResource(A|W)?$'
  - id: net-share-enum-symbol
    desc: NetShareEnum symbol reference
    crit: component
    conf: 0.95
    for: [c, cpp, csharp]
    if:
      type: symbol
      exact: NetShareEnum
  - id: net-share-enum-text
    desc: References the Windows NetShareEnum API
    crit: component
    conf: 0.94
    for: [pe, dll, powershell]
    if:
      type: text
      word: NetShareEnum
  - id: share-info-1-struct
    desc: Windows SHARE_INFO_1 share structure
    conf: 0.95
    for: [pe, dll, c, cpp, csharp, powershell]
    if:
      type: text
      regex: '\bSHARE_INFO_1\b|\bshi1_netname\b'
  - id: wnet-disk-resource-enumeration-source
    desc: Starts Windows disk resource enumeration
    conf: 0.95
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^WNetOpenEnum(A|W)?$'
      arg:
        kind: identifier
        name: RESOURCETYPE_DISK
  - id: pywin32-wnet-extension
    desc: pywin32 WNet wrapper extension
    conf: 0.95
    if:
      type: path
      basename: true
      exact: win32wnet.pyd
      case_insensitive: true
  - id: pywin32-wnet-open-enum
    desc: Python starts WNet resource enumeration
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      exact: win32wnet.WNetOpenEnum
  - id: pywin32-wnet-enum-resource
    desc: Python enumerates Windows network resources
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      exact: win32wnet.WNetEnumResource
  - id: pywin32-wnet-disk-resource-enumeration
    desc: Python starts Windows disk-resource enumeration
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'win32wnet\.WNetOpenEnum\([\s\S]{0,240}(win32netcon\.)?RESOURCETYPE_DISK'
composite_rules:
  - id: wnet-share-scan
    desc: Enumerates Windows network resources via WNet
    conf: 0.93
    all:
      - id: wnet-open-enum-api
      - id: wnet-enum-resource-api
    unless:
      - id: pywin32-wnet-extension
  - id: wnet-open-enum-api
    desc: Network resource enumeration start API
    conf: 0.94
    any:
      - id: wnet-open-enum
      - id: wnet-open-enum-import
      - id: pywin32-wnet-open-enum
  - id: wnet-enum-resource-api
    desc: Network resource enumeration API
    conf: 0.94
    any:
      - id: wnet-enum-resource
      - id: wnet-enum-resource-import
      - id: pywin32-wnet-enum-resource
  - id: net-share-enum-api
    desc: Enumerates Windows network shares
    conf: 0.95
    for: [pe, dll, c, cpp, csharp, powershell]
    any:
      - id: net-share-enum-symbol
      - id: net-share-enum-text
  - id: network-disk-share-enumeration
    desc: Enumerates Windows disk resources or network shares
    conf: 0.95
    any:
      - id: net-share-enum-api
      - id: net-share-enum-with-struct
      - id: wnet-disk-resource-enumeration-source
      - id: pywin32-wnet-disk-resource-enumeration
  - id: net-share-enum-with-struct
    desc: NetShareEnum API paired with SHARE_INFO_1 structure
    conf: 0.96
    for: [pe, dll, c, cpp, csharp, powershell]
    all:
      - id: net-share-enum-api
      - id: share-info-1-struct
