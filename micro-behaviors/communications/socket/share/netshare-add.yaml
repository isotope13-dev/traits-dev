# NetShareAdd publishes a directory as an SMB share, on the local machine or,
# with a server name, on a remote one. Shares are also created by installers
# and admin tools, so the capability is notable. A composite that adds the
# remote-server argument or a botnet context carries the attack claim.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp]
  attack: T1021.002

traits:
  - id: net-share-add-import
    desc: Imports NetShareAdd share creation API
    conf: 0.94
    for: [pe, dll]
    if:
      type: import
      exact: NetShareAdd

  - id: net-share-add-symbol
    desc: Calls NetShareAdd share creation API
    conf: 0.94
    for: [c, cpp, csharp]
    if:
      type: symbol
      exact: NetShareAdd

composite_rules:
  - id: net-share-add-api
    desc: Creates an SMB network share with NetShareAdd
    conf: 0.94
    any:
      - id: net-share-add-import
      - id: net-share-add-symbol
