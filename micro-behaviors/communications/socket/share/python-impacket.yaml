defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: python-impacket-list-shares
    desc: Lists shares through an SMB client
    if:
      type: symbol
      kind: call
      regex: '(^|\.)listShares$'
      receiver:
        from:
          call: '(^|\.)SMBConnection$'
