defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.94

traits:
  - id: python-bind-all-interfaces
    desc: Python socket binds all interfaces
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\.bind\(\s*\(\s*["'']0\.0\.0\.0["'']\s*,'

  - id: python-listener-defaults-public-host
    desc: Python listener defaults to public host
    if:
      type: text
      regex: '\blisten_host\s*:\s*\w+\s*=\s*["'']0\.0\.0\.0'

  - id: python-binds-configured-listener-host
    desc: Python socket binds a configured listener host
    if:
      type: text
      regex: '\.bind\(\(self\.listen_host\s*,'
