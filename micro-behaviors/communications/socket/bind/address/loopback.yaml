# Loopback-only listeners. The counterpart of all-interfaces.yaml: a server
# pinned to 127.0.0.1 is reachable only from the same host, which is the
# structural difference between a local developer UI and a service exposed to
# the network. Neutral observation on its own; objective composites use it to
# separate an exposed control channel from a localhost-only one.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.85

traits:
  # The address must be a quoted argument of the bind/listen call: a bare
  # "listening on http://127.0.0.1:3000" banner says nothing about which
  # interface the socket was actually bound to.
  - id: bind-loopback-address
    desc: Binds or listens on the loopback address
    if:
      type: text
      regex: '(?i)\b(bind|listen)\w*\s*\([^\r\n)]{0,80}["'']127\.0\.0\.1(:\d{1,5})?["'']'

  - id: bind-loopback-hostname
    desc: Binds or listens on the localhost hostname
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(bind|listen)\w*\s*\([^\r\n)]{0,80}["'']localhost["'']'
