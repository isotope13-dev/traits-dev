defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - javascript
  - typescript
traits:
- id: bind-all-interfaces-call
  desc: Calls bind or listen on all interfaces
  conf: 0.94
  for:
  - python
  - javascript
  - typescript
  - java
  - kotlin
  - c
  - cpp
  if:
    type: symbol
    kind: call
    regex: (^|\.)(bind|listen)$
    arg:
      kind: string
      regex: ^(0\.0\.0\.0|::)$
- id: rust-tcp-listener-all-interfaces
  desc: Rust TCP listener binds all interfaces
  conf: 0.94
  for:
  - rust
  if:
    type: symbol
    kind: call
    regex: (^|::|\.)TcpListener::bind$
    arg:
      kind: string
      regex: ^(0\.0\.0\.0|::)(:\d+)?$
- id: bind-inaddr-any
  desc: Socket listener uses the INADDR_ANY address
  conf: 0.9
  for:
  - c
  - cpp
  if:
    type: text
    regex: (?is)\bINADDR_ANY[\s\S]{0,120}\bbind\s*\(
- id: listening-all-interfaces-text
  desc: Listening text beside all-interface IPv4
  conf: 0.86
  for:
  - binaries
  if:
    type: text
    regex: (?i)\blisten(ing)?\b.{0,40}0\.0\.0\.0\b
  not:
  - substr: 0.0.0.0/0
- id: bind-all-interfaces
  desc: Bind/listen text with all-interface IPv4
  conf: 0.8
  if:
    type: text
    regex: (?i)(\b(bind|listen)\b[^\r\nb]{0,120}\b0\.0\.0\.0\b|\bhost\s*:\s*["']0\.0\.0\.0["'])
  not:
  - substr: 0.0.0.0/0
  unless:
  - id: metadata/lang/compiler/managed::dotnet-ipv4-like-version
  - type: text
    regex: Version=\d+\.0\.0\.0
  - type: text
    regex: (?i)(fallback|falls back|default|return)\s+.{0,40}0\.0\.0\.0
# The IPv6 half of the same observation: an unbracketed `::` bind address
# covers every interface, including IPv4-mapped ones. Bound to the Python
# socket-bind call shape so bare `::` separators elsewhere cannot match.
- id: bind-all-interfaces-ipv6
  desc: Binds listener on IPv6 all-address (::)
  conf: 0.86
  if:
    type: text
    regex: \.bind\(\s*\(\s*["']::["']\s*,
- id: python-http-server-all-interfaces
  desc: Python HTTP server binds all interfaces
  conf: 0.88
  for:
  - python
  if:
    type: text
    regex: (?i)\b[A-Za-z_]*HTTPServer\b\s*\(\s*\(\s*["']0\.0\.0\.0["']
- id: python-framework-server-all-interfaces
  desc: Python framework server binds all interfaces
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (?is)\bapp(lication)?\.run\s*\([^)]{0,240}\bhost\s*=\s*["']0\.0\.0\.0["']
- id: python-uvicorn-all-interfaces
  desc: Python Uvicorn server binds all interfaces
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: uvicorn\.Config.{0,80}0\.0\.0\.0
