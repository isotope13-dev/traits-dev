defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  crit: notable
  conf: 0.98

traits:
  # EAX=102; EDX=SYS_BIND; exchange EDX into EBX; enter syscall trampoline.
  # A bare push of a small integer followed by call is not a socket operation.
  - id: i386-socketcall-bind
    desc: i386 socketcall bind syscall dispatch
    if:
      type: hex
      section: .text
      pattern: 'B8 66 00 00 00 [0-12] BA 02 00 00 00 [0-32] 87 DA 65 FF 15 10 00 00 00 87 DA'
