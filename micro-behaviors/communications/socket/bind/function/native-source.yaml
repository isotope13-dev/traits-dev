defaults:
  platforms: [unix, windows]
  for: [c, cpp, html, text]
traits:
  - id: native-sockaddr-bind-call
    desc: Native bind with socket-address cast
    crit: notable
    conf: 0.92
    if:
      type: text
      # A sockaddr argument distinguishes socket binding from Boost bind,
      # parser combinators, and JavaScript function/event binding.
      regex: '\bbind\s*\([^,;\n]{1,60},\s*\([^)]{0,24}\bsockaddr\b'
  - id: assembly-bind-invoke
    desc: Assembly invokes socket bind API
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\binvoke\s+bind\b'
composite_rules:
  - id: source-bind-call
    desc: Native socket-address bind operation
    crit: notable
    conf: 0.92
    any:
      - id: native-sockaddr-bind-call
      - id: assembly-bind-invoke
