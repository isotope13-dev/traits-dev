defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 1.0

traits:
  - id: winsock-bind-ordinal-import
    desc: Imports Winsock bind by ordinal
    if:
      type: yara
      source: |
        import "pe"
        rule winsock_bind_ordinal_import {
          strings:
            $library = /WS(2_32|OCK32)\.dll/ ascii nocase
          condition:
            $library and
            (pe.imports("WS2_32.dll", 2) or
             pe.imports("WSOCK32.dll", 2))
        }
