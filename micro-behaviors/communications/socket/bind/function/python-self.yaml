defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.85
traits:
  # Parser-combinator bind(lambda ...) is unrelated to socket address binding.
  - id: python-self-bind-address-pair-call
    desc: self.bind call with two-element tuple
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute object: (identifier) @receiver
                               attribute: (identifier) @method)
          arguments: (argument_list (tuple . (_) . (_) .))) @call
          (#eq? @receiver "self")
          (#eq? @method "bind"))
