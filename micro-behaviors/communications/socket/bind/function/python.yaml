defaults:
  crit: notable
  platforms: [windows, unix]
  mbc: C0001
traits:
  - id: python-assigned-socket-constructor-bind
    for: [python]
    conf: 0.95
    desc: Binds a socket assigned during construction
    if:
      type: tree-sitter
      kind: call
      regex: '^\(\w+\s*:=\s*socket\.socket\([^)]{0,120}\)\)\.bind\('
  - id: python-short-socket-bind-method
    for: [python]
    conf: 0.82
    desc: Python short-name socket bind call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(s|sock)\.bind$'
  - id: python-server-socket-bind-method
    for: [python]
    conf: 0.82
    desc: Python server socket bind call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(server|listener)\.bind$'
  - id: python-named-socket-bind-method
    for: [python]
    conf: 0.82
    desc: Python named socket bind call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(socket|[A-Za-z_][A-Za-z0-9_]*(socket|sock))\.bind$'
  - id: socket-bind-call
    for: [python, pyc]
    attack: T1071
    desc: socket.bind() call
    conf: 0.7
    if:
      type: symbol
      exact: "socket.bind"
composite_rules:
  - id: python-socket-bind-method
    for: [python]
    desc: Python socket bind call
    conf: 0.86
    any:
      - id: python-assigned-socket-constructor-bind
      - id: python-short-socket-bind-method
      - id: python-server-socket-bind-method
      - id: python-named-socket-bind-method
