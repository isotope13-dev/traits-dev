# VNC references in Android source are neutral protocol capabilities.  Remote
# control intent is supplied by composites that also observe accessibility and
# collection behavior.
defaults:
  crit: notable
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: vnc-uri-reference
    desc: VNC endpoint reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bvnc://'

  - id: vnc-protocol-token
    desc: VNC protocol token reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bVNC\b'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index
      - id: metadata/file/catalog/identity::nixpkgs-package-catalog

composite_rules:
  - id: vnc-source-reference
    desc: VNC protocol or endpoint reference
    conf: 0.94
    any:
      - id: vnc-uri-reference
      - id: vnc-protocol-token
