# VNC references in Android source are neutral protocol capabilities.  Remote
# control intent is supplied by composites that also observe accessibility and
# collection behavior.
defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: vnc-uri-reference
    desc: VNC endpoint reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bvnc://'

  - id: vnc-source-operation
    desc: Source sends or starts VNC control
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bVNC\b'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

composite_rules:
  - id: vnc-source-reference
    desc: Android source contains VNC remote-control capability
    crit: notable
    conf: 0.94
    any:
      - id: vnc-uri-reference
      - id: vnc-source-operation
