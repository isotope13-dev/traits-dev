# Apple Screen Sharing extends RFB with security type 36 (SRP) and a
# proprietary file-copy message. These are neutral protocol mechanics; exploit
# intent is inferred by objective composites that require the malformed length
# and sensitive remote-write targets as additional evidence.
defaults:
  # Exploit clients can run on any OS even though the vulnerable server is macOS.
  platforms: [windows, linux, macos]
  for: [scripts, source]
  attack: T1021.005

traits:
  - id: apple-rfb-003-889-version
    desc: Apple Screen Sharing RFB 003.889 version marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: RFB 003.889

  - id: srp-security-type-constant
    desc: SRP security type constant 36
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b[A-Z0-9_]*SRP[A-Z0-9_]*TYPE\s*=\s*(36|0x24)\b'

  - id: srp-security-type-membership
    desc: Checks offered list for security type 36
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(36|0x24|\w*SRP\w*TYPE)\s+not\s+in\s+\w*(offer|security_type)\w*'

  - id: srp-security-type-named-byte-send
    desc: Sends named SRP security type byte
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'send(all)?\s*\(\s*bytes\s*\(\s*\[\s*[A-Z0-9_]*SRP[A-Z0-9_]*TYPE\s*\]\s*\)\s*\)'

  - id: file-copy-type-constant
    desc: Apple file-copy type 0x22 constant
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b[A-Z0-9_]*FILE_?COPY[A-Z0-9_]*\s*=\s*0x22'

composite_rules:
  - id: apple-rfb-srp-security-type
    desc: Selects Apple SRP security type 36
    crit: notable
    conf: 0.96
    all:
      - id: apple-rfb-003-889-version
      - id: srp-security-type-constant
      - id: srp-security-type-membership
    any:
      - id: micro-behaviors/communications/socket/send::python-send-byte-0x24
      - id: srp-security-type-named-byte-send

  - id: python-apple-file-copy-frame-construction
    desc: Python constructs Apple file-copy frames
    crit: notable
    conf: 0.97
    for: [python]
    near_bytes: 1200
    all:
      - id: apple-rfb-003-889-version
      - id: micro-behaviors/data/buffer::python-big-endian-hhii-pack
    any:
      - id: file-copy-type-constant
      - id: micro-behaviors/data/buffer::first-buffer-byte-0x22

  - id: go-apple-file-copy-frame-construction
    desc: Go constructs Apple file-copy frames
    crit: notable
    conf: 0.97
    for: [go]
    near_bytes: 1200
    all:
      - id: apple-rfb-003-889-version
      - id: micro-behaviors/data/buffer::go-big-endian-uint16-write
      - id: micro-behaviors/data/buffer::go-big-endian-uint32-write
    any:
      - id: file-copy-type-constant
      - id: micro-behaviors/data/buffer::first-buffer-byte-0x22

  - id: apple-file-copy-frame-construction
    desc: Constructs Apple file-copy 0x22 frames
    crit: notable
    conf: 0.97
    any:
      - id: python-apple-file-copy-frame-construction
      - id: go-apple-file-copy-frame-construction
