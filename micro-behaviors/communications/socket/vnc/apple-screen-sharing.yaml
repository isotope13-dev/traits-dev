# Apple Screen Sharing extends RFB with security type 36 (SRP) and a
# proprietary file-copy message. These are neutral protocol mechanics; exploit
# intent is inferred by objective composites that require the malformed length
# and sensitive remote-write targets as additional evidence.
defaults:
  platforms: [macos]
  for: [scripts, source]
  attack: T1021.005

traits:
  - id: apple-rfb-003-889-version
    desc: Apple Screen Sharing RFB 003.889 version marker
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: RFB 003.889

  - id: srp-security-type-constant
    desc: SRP security type constant 36
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b[A-Z0-9_]*SRP[A-Z0-9_]*TYPE\s*=\s*(36|0x24)\b'

  - id: srp-security-type-membership
    desc: Checks for SRP security type 36
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bif\s+(36|0x24)\s+not\s+in\s+(types|security[_A-Z0-9]*)\b'

  - id: srp-security-type-byte-send
    desc: Sends SRP security type byte 0x24
    crit: component
    conf: 0.86
    if:
      type: text
      regex: 'send(all)?\s*\(\s*b?["'']\\x24["'']\s*\)'

  - id: file-copy-type-constant
    desc: Apple file-copy type 0x22 constant
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b[A-Z0-9_]*FILE_?COPY[A-Z0-9_]*\s*=\s*0x22'

  - id: message-type-0x22-assignment
    desc: Assigns message type byte 0x22
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\[[A-Za-z0-9_+\- ]{0,24}0\]\s*=\s*0x22'

  - id: big-endian-hhii-pack
    desc: Packs big-endian HHII header fields
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(pack|pack_into)\s*\(\s*["'']>HHII["'']'

composite_rules:
  - id: apple-rfb-srp-security-type
    desc: Selects Apple SRP security type 36
    crit: notable
    conf: 0.96
    all:
      - id: apple-rfb-003-889-version
    any:
      - id: srp-security-type-constant
      - id: srp-security-type-membership
      - id: srp-security-type-byte-send

  - id: apple-file-copy-frame-construction
    desc: Constructs Apple file-copy 0x22 frames
    crit: notable
    conf: 0.97
    near_bytes: 1200
    all:
      - id: apple-rfb-003-889-version
      - id: big-endian-hhii-pack
    any:
      - id: file-copy-type-constant
      - id: message-type-0x22-assignment
