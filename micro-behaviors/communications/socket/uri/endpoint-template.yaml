# A `tcp://host:port` URL whose host and port are filled in at build time
# rather than written out. The interpolation is the point: a program that
# connects to a fixed service hardcodes the address, while a builder that
# stamps an operator-chosen callback into something it is assembling has to
# leave a hole for it.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9
  attack: T1571

traits:
  - id: tcp-endpoint-url-template
    desc: Templated tcp:// endpoint URL
    if:
      type: text
      # f-string braces, printf, shell expansion, or string concatenation.
      regex: 'tcp://(\{|%s|\$\{|["'']\s*[+.])'
