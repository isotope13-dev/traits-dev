# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - php
  platforms:
  - windows
  - unix
  crit: notable
  conf: 1.0
traits:
- id: localhost-socket-uri
  desc: Localhost socket URI
  if:
    type: string_literal
    regex: tcp://(127\.0\.0\.1|localhost|0\.0\.0\.0)(:\d+)?
