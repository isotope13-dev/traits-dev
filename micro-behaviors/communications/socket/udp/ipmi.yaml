defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]

traits:
  - id: ipmi-udp-port-623
    desc: IPMI management endpoint uses UDP port 623
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(ipmi[_-]?port|rport|port)\s*(=|:)\s*623\b'

  - id: rmcp-plus-protocol-marker
    desc: RMCP+ IPMI session protocol marker
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: RMCP+

  - id: rakp-message-marker
    desc: IPMI RAKP authentication message marker
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '^RAKP[12]$'
      case_insensitive: true

  - id: ipmi-session-open-builder
    desc: IPMI session-open symbol
    crit: notable
    conf: 0.96
    for: [python, ruby, go, c, cpp, rust]
    if:
      type: symbol
      regex: '(?i)ipmi.*session.*open'

  - id: ipmi-rakp1-builder
    desc: IPMI RAKP message-1 symbol
    crit: notable
    conf: 0.96
    for: [python, ruby, go, c, cpp, rust]
    if:
      type: symbol
      regex: '(?i)rakp[_-]?1'

  - id: ipmi-rakp2-parser
    desc: IPMI RAKP message-2 symbol
    crit: notable
    conf: 0.96
    for: [python, ruby, go, c, cpp, rust]
    if:
      type: symbol
      regex: '(?i)rakp[_-]?2'
