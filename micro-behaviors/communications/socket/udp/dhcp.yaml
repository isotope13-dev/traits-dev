# DHCP-over-UDP packet construction mechanics. These atoms describe protocol fields and
# calls; exploit intent is supplied by objectives that require oversized data,
# framing, and active delivery together.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, c, cpp, go, rust]
  crit: notable
  conf: 0.94

traits:
  - id: scapy-option-125
    desc: Scapy constructs DHCP vendor option 125
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)^DHCP\s*\([^)]{0,900}\boptions\s*=\s*\[[^]]{0,700}\(\s*125\s*,'

  - id: named-vendor-option-125
    desc: References DHCP vendor option constant
    if:
      type: text
      regex: '\b(DHCP_OPTION_VENDOR_SPECIFIC|DHCP_VENDOR_SPECIFIC|DHO_VIVSO_SUBOPTIONS)\b'

  - id: assigned-option-125
    desc: Assigns DHCP option code 125
    if:
      type: text
      regex: '(?i)\b(dhcp_?)?(option|opt|code|type)\w*\s*(=|:=|:)\s*125\b'

  - id: typed-option-125
    desc: Assigns typed DHCP option code 125
    for: [c, cpp, go, rust]
    if:
      type: text
      regex: '(?i)\b(dhcp_?)?(option|opt|code|type)\w*\s*:\s*(u8|u16|u32|uint\w*)\s*=\s*125\b'

  - id: scapy-client-port-68
    desc: Scapy sets the DHCP client port
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '^UDP\s*\([^)]{0,160}\bsport\s*=\s*68\b'

  - id: scapy-server-port-67
    desc: Scapy sets the DHCP server port
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '^UDP\s*\([^)]{0,160}\bdport\s*=\s*67\b'

  - id: native-server-port-67
    desc: Native code sets the DHCP server port
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(dport|dest(_ination)?_?port|sin_port|server_?port)\b.{0,48}(htons\s*\()?[ ]*67\b'

  - id: go-server-port-67
    desc: Go code sets the DHCP server port
    for: [go]
    if:
      type: text
      regex: '\bUDPAddr\s*\{.{0,80}\bPort\s*:\s*67\b'

  - id: javascript-server-port-67
    desc: JavaScript sends to the DHCP server port
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.send\s*\(.{0,70},\s*67\s*,'

  - id: rust-server-port-67
    desc: Rust uses a DHCP server socket address
    for: [rust]
    if:
      type: string_literal
      regex: '^["''][^"'']{0,60}:67["'']$'

  - id: python-tr111-enterprise-pack
    desc: Packs Broadband Forum enterprise number 3561
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '^struct\.pack\s*\(\s*["''](<|>|!)I["'']\s*,\s*(3561|0x0*[dD][eE]9)\s*\)$'

  - id: assigned-tr111-enterprise-number
    desc: Assigns Broadband Forum enterprise number 3561
    if:
      type: text
      regex: '(?i)\b(enterprise|vendor|iana)\w*\s*(=|:=)\s*(3561|0x0*de9)\b'

  - id: typed-tr111-enterprise-number
    desc: Assigns typed TR-111 enterprise number 3561
    for: [c, cpp, go, rust]
    if:
      type: text
      regex: '(?i)\b(enterprise|vendor|iana)\w*\s*:\s*(u32|uint32_t)\s*=\s*(3561|0x0*de9)\b'

composite_rules:
  - id: option-125
    desc: Constructs DHCP vendor-specific option 125
    crit: notable
    any:
      - id: scapy-option-125
      - id: named-vendor-option-125
      - id: assigned-option-125
      - id: typed-option-125

  - id: scapy-client-server-port-pair
    desc: Scapy builds a DHCP client-to-server datagram
    crit: notable
    for: [python]
    all:
      - id: scapy-client-port-68
      - id: scapy-server-port-67

  - id: client-server-port
    desc: Targets the DHCP server datagram port
    crit: notable
    any:
      - id: scapy-client-server-port-pair
      - id: native-server-port-67
      - id: go-server-port-67
      - id: javascript-server-port-67
      - id: rust-server-port-67

  - id: tr111-enterprise-number
    desc: Encodes Broadband Forum enterprise number 3561
    crit: notable
    any:
      - id: python-tr111-enterprise-pack
      - id: assigned-tr111-enterprise-number
      - id: typed-tr111-enterprise-number
