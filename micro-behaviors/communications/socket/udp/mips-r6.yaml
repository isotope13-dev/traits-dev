defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
traits:
  - id: mips-r6-udp-port-checksum-rewrite-loop
    desc: MIPS R6 UDP port/checksum rewrite loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Clear port/checksum, call rand, store random port, compute UDP
      # checksum with protocol 17, then branch back to the packet-send loop.
      pattern: '00 00 40 A4 ?? ?? C2 8F 06 00 40 A4 ?? ?? 82 8F 25 C8 40 00 00 00 19 F8 ?? ?? DC 8F FF FF 43 30 ?? ?? C2 8F 00 00 43 A4 [12] 25 38 40 00 ?? ?? C6 8F 11 00 05 24 ?? ?? C4 8F ?? ?? ?? EB ?? ?? DC 8F 25 18 40 00 ?? ?? C2 8F 06 00 43 A4 [8] ?? FF 5F D8 [28] ?? FF FF CB'

