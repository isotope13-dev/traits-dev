defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: gamespy-status-query-literal
    desc: GameSpy status request literal
    for: [python, javascript, php, perl]
    if:
      type: literal
      exact: '\status\'
  - id: gamespy-status-query-bytes
    desc: GameSpy status request bytes
    for: [pe, elf]
    if:
      type: text
      exact: '\status\'
composite_rules:
  - id: gamespy-status-query
    desc: GameSpy status request reference
    for: [python, javascript, php, perl, pe, elf]
    any:
      - id: gamespy-status-query-literal
      - id: gamespy-status-query-bytes
