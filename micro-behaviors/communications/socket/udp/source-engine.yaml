traits:
- id: source-engine-query-payload
  desc: References Source Engine server query payload
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: TSource Engine Query
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/game/mod::dmtl-linux-mod-tool
- id: source-engine-query-marker
  desc: References Source Engine query marker
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: TSource Engine
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/game/mod::dmtl-linux-mod-tool
composite_rules:
  - id: source-query-flood-payload
    desc: Source Engine query flood payload in plain or XOR-encoded form
    crit: notable
    conf: 0.95
    any:
      - id: source-engine-query-payload
      - id: xor54-source-engine-query-payload
defaults:
  platforms:
  - linux
  - android
  for:
  - elf
