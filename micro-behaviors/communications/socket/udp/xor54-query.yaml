defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: xor54-source-engine-query-payload
    desc: XOR-0x54-obfuscated Source Engine query payload
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      section: .rodata
      pattern: 07 3B 21 26 37 31 74 11 3A 33 3D 3A 31 74 05 21 31 26 2D 54
  - id: xor22-source-engine-query-payload
    desc: XOR-0x22 Source Engine query payload
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      section: .rodata
      pattern: 76 71 4D 57 50 41 47 02 67 4C 45 4B 4C 47 02 73 57 47 50 5B 22

