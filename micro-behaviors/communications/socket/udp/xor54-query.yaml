defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: xor54-source-engine-query-payload
    desc: XOR-0x54-obfuscated Source Engine query payload
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      offset_range: [0, null]
      pattern: 07 3B 21 26 37 31 74 11 3A 33 3D 3A 31 74 05 21 31 26 2D 54
  - id: xor22-source-engine-query-payload
    desc: XOR-0x22 Source Engine query payload
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      offset_range: [0, null]
      pattern: 76 71 4D 57 50 41 47 02 67 4C 45 4B 4C 47 02 73 57 47 50 5B 22
  - id: xor2e-source-engine-query-payload
    desc: XOR-0x2e Source Engine query payload
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      offset_range: [0, null]
      pattern: 7A 7D 41 5B 5C 4D 4B 0E 6B 40 49 47 40 4B 0E 7F 5B 4B 5C 57 2E

