# DHCPv6 server-side message construction with Scapy. A client only sends
# Solicit/Request/Renew; building Advertise or Reply messages, or ICMPv6
# Router Advertisements, means the code answers for the network. Intent comes
# from objectives that pair these with name-service takeover.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.95
  attack: none
  mbc: none

traits:
  - id: scapy-dhcpv6-server-response
    desc: Builds DHCPv6 Advertise or Reply messages
    if:
      type: symbol
      kind: call
      regex: '^DHCP6_(Advertise|Reply)$'

  - id: scapy-dhcpv6-dns-server-option
    desc: Sets the DHCPv6 DNS-server option
    if:
      type: symbol
      kind: call
      exact: DHCP6OptDNSServers

  - id: scapy-ipv6-router-advertisement
    desc: Builds an ICMPv6 Router Advertisement
    if:
      type: symbol
      kind: call
      exact: ICMPv6ND_RA
