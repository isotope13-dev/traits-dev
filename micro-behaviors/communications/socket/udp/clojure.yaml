# Clojure UDP socket interop.
#
# The Java atoms next door key on the fully-qualified `java.net.DatagramSocket`
# string, which Clojure never emits: `(:import (java.net DatagramSocket ...))`
# splits the package and the class across lines, and the call site is the
# trailing-dot constructor form. A Clojure namespace that opens a UDP socket
# and pushes datagrams at a resolved host therefore produced no communications
# finding at all — com.amperity/dialog's syslog appender is exactly that shape.
#
# Neutral mechanics: syslog appenders, StatsD/metrics clients and service
# discovery all send UDP. Exfil and DoS intent comes from the composites that
# pair these with a target or a payload source.
defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.9
  attack: T1095
  mbc: C0001.003

traits:
  # `(DatagramSocket.)` / `(DatagramSocket. port)` / `(new DatagramSocket)`.
  # Anchored on the open paren so the bare class name in an `:import` vector
  # does not count as opening one.
  - id: clojure-datagram-socket-create
    desc: Clojure opens a UDP datagram socket
    if:
      type: text
      regex: '\((new\s+)?DatagramSocket\b'

  # Building a DatagramPacket is the send side: the constructor takes the
  # payload buffer plus the destination address and port.
  - id: clojure-datagram-packet-build
    desc: Clojure builds a UDP datagram packet
    if:
      type: text
      regex: '\((new\s+)?DatagramPacket\b'
