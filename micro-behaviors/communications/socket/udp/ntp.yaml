# Neutral NTP-shaped datagram structure. The hostile interpretation belongs to the
# C2 composite that combines all of these mechanics.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, go, rust, python]
  crit: notable
  conf: 0.94
  mbc: C0001.003

traits:
  - id: ntpv4-server-mode-header
    desc: Sets NTPv4 server-mode packet header
    if:
      type: text
      # 0x24 is LI=0, VN=4, mode=4 (server).
      regex: '\b[A-Za-z_][A-Za-z0-9_]*\s*\[\s*0\s*\]\s*=\s*(0x24|36)\b'

  - id: rust-nine-datagram-send-loop
    desc: Rust loop sends nine datagrams
    crit: notable
    for: [rust]
    if:
      type: text
      regex: '(?s)for\s+_\s+in\s+0\.\.9\s*\{.{0,400}\.(send|send_to)\s*\('

  - id: go-nine-datagram-send-loop
    desc: Go loop sends nine datagrams
    crit: notable
    for: [go]
    if:
      type: text
      regex: '(?s)for\s+\w+\s*:=\s*0.{1,100}<\s*9.{1,100}\{.{0,300}\.Write\s*\('

  - id: python-nine-datagram-send-loop
    desc: Python loop sends nine datagrams
    crit: notable
    for: [python]
    if:
      type: text
      regex: '(?s)for\s+\w+\s+in\s+range\s*\(\s*9\s*\).{0,300}\.send(to)?\s*\('

composite_rules:
  - id: ntp-datagram-buffer-size
    desc: Datagram socket with NTP-shaped buffer context
    crit: notable
    all:
      - id: ntpv4-server-mode-header
      - id: datagram-socket-reference
    any:
      - id: metadata/lang/source/syntax/type-expression::rust-48-byte-array-type
      - id: metadata/lang/source/literal/array::rust-48-byte-array-initializer
      - id: "metadata/lang/source/declaration::c-48-byte-array"
      - id: micro-behaviors/data/collection/create::go-48-byte-slice
      - id: micro-behaviors/data/collection/create::python-48-byte-bytearray

  - id: datagram-socket-reference
    desc: References a datagram socket type or constructor
    crit: notable
    any:
      - id: micro-behaviors/communications/socket/bind/function::udpsocket-bind
      - id: micro-behaviors/communications/socket/dial::net-dial-udp
      - id: sock-dgram
      - id: sock-dgram-python
