# Neutral NTP datagram structure. The hostile interpretation belongs to the
# C2 composite that combines all of these mechanics.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, go, rust, python]
  crit: notable
  conf: 0.94
  mbc: C0001.003

traits:
  - id: ntp-destination-port-literal
    desc: Network endpoint uses the NTP service port
    if:
      type: text
      # Endpoint-shaped text only before :123 (host, IP, [IPv6]); a loose
      # [^"'\r\n] prefix matched non-endpoint spec strings such as pprof's
      # "pid=123:123" pid:address-range test literal.
      regex: '(["''][A-Za-z0-9_.:\[\]-]{1,120}:123["'']|htons\s*\(\s*123\s*\)|\bport\s*[:=]\s*123\b)'

  - id: rust-48-byte-datagram-buffer
    desc: Rust allocates 48-byte datagram buffer
    crit: component
    for: [rust]
    if:
      type: text
      regex: '\[[A-Za-z0-9_:\s]+;\s*48\s*\]'

  - id: c-48-byte-datagram-buffer
    desc: C allocates 48-byte datagram buffer
    crit: component
    for: [c, cpp]
    if:
      type: text
      regex: '\b(u?int8_t|unsigned char|char)\s+\w+\s*\[\s*48\s*\]'

  - id: go-48-byte-datagram-buffer
    desc: Go allocates 48-byte datagram buffer
    crit: component
    for: [go]
    if:
      type: text
      regex: 'make\s*\(\s*\[\]byte\s*,\s*48\s*\)'

  - id: python-48-byte-datagram-buffer
    desc: Python allocates 48-byte datagram buffer
    crit: component
    for: [python]
    if:
      type: text
      regex: 'bytearray\s*\(\s*48\s*\)'

  - id: ntpv4-server-mode-header
    desc: Sets NTPv4 server-mode packet header
    if:
      type: text
      # 0x24 is LI=0, VN=4, mode=4 (server).
      regex: '\b[A-Za-z_][A-Za-z0-9_]*\s*\[\s*0\s*\]\s*=\s*(0x24|36)\b'

  - id: rust-nine-datagram-send-loop
    desc: Rust loop sends nine datagrams
    crit: component
    for: [rust]
    if:
      type: text
      regex: '(?s)for\s+_\s+in\s+0\.\.9\s*\{.{0,400}\.(send|send_to)\s*\('

  - id: c-nine-iteration-loop
    desc: C loop iterates nine times
    crit: component
    for: [c, cpp]
    if:
      type: text
      regex: 'for\s*\([^;\r\n]{1,40};[^;\r\n]{1,40}<\s*9\s*;[^)\r\n]{1,40}\)'

  - id: go-nine-datagram-send-loop
    desc: Go loop sends nine datagrams
    crit: component
    for: [go]
    if:
      type: text
      regex: '(?s)for\s+\w+\s*:=\s*0.{1,100}<\s*9.{1,100}\{.{0,300}\.Write\s*\('

  - id: python-nine-datagram-send-loop
    desc: Python loop sends nine datagrams
    crit: component
    for: [python]
    if:
      type: text
      regex: '(?s)for\s+\w+\s+in\s+range\s*\(\s*9\s*\).{0,300}\.send(to)?\s*\('

composite_rules:
  - id: ntp-datagram-buffer-size
    desc: Allocates fixed NTP datagram buffer
    crit: notable
    any:
      - id: rust-48-byte-datagram-buffer
      - id: c-48-byte-datagram-buffer
      - id: go-48-byte-datagram-buffer
      - id: python-48-byte-datagram-buffer

  - id: nine-datagram-send-burst
    desc: Sends nine datagrams from one loop
    crit: notable
    any:
      - id: rust-nine-datagram-send-loop
      - id: c-nine-iteration-loop
      - id: go-nine-datagram-send-loop
      - id: python-nine-datagram-send-loop
