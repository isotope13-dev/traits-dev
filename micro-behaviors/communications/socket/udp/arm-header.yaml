defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
traits:
  # Build IPv4 version/IHL in [r4], then store IPPROTO_UDP in [r4+9].
  # Stack offsets and the unrelated comparison do not identify the behavior.
  - id: arm-ipv4-udp-header-construction
    desc: ARM constructs IPv4 UDP header bytes
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: 'B0 30 C3 E3 40 30 83 E3 00 30 C4 E5 00 20 D4 E5 ?? 30 9D E5 0A 20 C2 E3 05 20 82 E3 [4] 11 30 A0 E3 00 20 C4 E5 09 30 C4 E5'
