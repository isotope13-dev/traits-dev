defaults:
  platforms: [windows, unix]
  attack: T1071
  mbc: C0001
  for:
    - java
    - class
    - kotlin
traits:
  - id: java-socket-create
    desc: Java socket creation for network communication
    crit: notable
    conf: 0.8
    for: [java, class, kotlin, text]
    if:
      type: text
      substr: java.net.Socket
  # NIO.2 asynchronous socket. Plain socket creation, not a tunnel: it moved
  # here from communications/proxy/tunnel/, where it labelled every AIO server
  # (Hutool's AioSession, Netty-style acceptors) a proxy tunnel on its own. The
  # tunnel composite still references it and supplies the WebSocket legs.
  - id: java-async-socket-channel
    desc: Java AsynchronousSocketChannel usage
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: AsynchronousSocketChannel
  - id: java-serversocket-create
    desc: Java server socket creation (listening)
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: java.net.ServerSocket
  - id: java-socket-connect
    desc: Java socket connects to an address
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.\s*connect\s*\(\s*(new\s+)?InetSocketAddress\s*\('
  - id: java-variable-socket-create
    desc: JVM socket uses variable endpoint expressions
    crit: notable
    conf: 0.94
    for: [java, class, html, javascript, python, vbs]
    if:
      type: text
      regex: '\bnew\s+Socket\s*\(\s*[A-Za-z_]\w*\s*,\s*(Integer\.parseInt\s*\(\s*)?[A-Za-z_]\w*'
  - id: java-datagramsocket-create
    desc: Java UDP socket creation
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: java.net.DatagramSocket
  - id: java-socket-bytecode-reference
    desc: Java bytecode socket reference
    crit: notable
    conf: 0.86
    for: [apk, class, jar, zip]
    if:
      type: text
      substr: "Ljava/net/Socket;"
  - id: java-socket-slash-reference
    desc: Java slash-form socket reference
    crit: component
    conf: 0.9
    for: [apk, class, jar, zip]
    if:
      type: text
      substr: java/net/Socket
  - id: java-socket-class-import
    desc: Java imports the network socket class
    crit: notable
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: import
      exact: java/net/Socket
  - id: jvm-socket-class-ref
    desc: JVM socket class reference
    crit: component
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/net/Socket
  - id: jvm-serversocket-class-ref
    desc: JVM server socket class reference
    crit: baseline
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/net/ServerSocket
  - id: java-datagram-socket-bytecode-reference
    desc: Java bytecode datagram socket reference
    crit: notable
    conf: 0.86
    for: [apk, class, jar, zip]
    if:
      type: text
      substr: "Ljava/net/DatagramSocket;"
