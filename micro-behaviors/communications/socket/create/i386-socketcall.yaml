defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  crit: notable
  conf: 0.98

traits:
  # EDX=SYS_SOCKET; EAX=102; exchange EDX into EBX; enter syscall trampoline.
  # A bare push of a small integer followed by call is not a socket operation.
  - id: i386-socketcall-socket
    desc: i386 socketcall socket syscall dispatch
    if:
      type: hex
      section: .text
      pattern: 'BA 01 00 00 00 [0-32] B8 66 00 00 00 [0-12] 87 DA 65 FF 15 10 00 00 00 87 DA'
