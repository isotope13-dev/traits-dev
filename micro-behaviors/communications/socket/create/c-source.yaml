# C source-level TCP socket creation capability. Scan intent is inferred by
# composites in the discovery tier.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable

traits:
  - id: tcp-connect-socket-source
    desc: Creates an IPv4 TCP socket
    conf: 0.86
    if:
      type: text
      regex: 'socket\s*\(\s*AF_INET\s*,\s*SOCK_STREAM\s*,\s*(0|IPPROTO_TCP)\s*\)'

  # `struct sockaddr_in` is how any C program names an IPv4 endpoint -- clients,
  # servers, scanners and exploits alike. It lived in
  # objectives/command-and-control/backdoor/shell/reverse/ until 2026-09, where
  # the directory claimed reverse-shell intent the regex never checks; the
  # reverse-shell verdict comes from the dup2-onto-stdio and shell-exec legs
  # beside it, which still reference this atom cross-directory. Kept as a
  # carrier-broad text match (not `for: [c, cpp]`) because the payload that
  # matters is often C source embedded in a script that writes and compiles it.
