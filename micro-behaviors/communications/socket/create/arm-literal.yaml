defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable

traits:
  - id: arm-socket-literal-syscall-wrapper
    desc: ARM socket syscall with literal-pool r7
    crit: notable
    conf: 0.99
    arch: [arm]
    if:
      type: hex
      section: ".text"
      # Each LDR immediate points at its own little-endian SYS_socket (281).
      # The 0x84 variant clears r4/r5 before SVC, then handles socket flags.
      pattern: "(30 70 9F E5 00 00 00 EF [48]|28 70 9F E5 00 00 00 EF [40]|84 70 9F E5 03 40 A0 E1 03 50 A0 E1 00 00 00 EF [124]) 19 01 00 00"
    unless:
      - type: value
        path: elf.machine
        regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
