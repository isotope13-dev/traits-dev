# PowerShell managed TCP listener. A script that accepts a client is a
# server; the bind-shell objective pairs this with a redirected shell.
defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: powershell-tcplistener-object
    desc: PowerShell constructs a TcpListener
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'New-Object[^\r\n]{0,40}Sockets\.TcpListener\b'
  # Add-Type can carry a C# listener without PowerShell's New-Object spelling.
  # This is constructor syntax, not a bare class name or a server objective.
  - id: powershell-embedded-tcplistener-constructor
    desc: PowerShell embeds C# TcpListener construction
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bnew\s+(System\.Net\.Sockets\.)?TcpListener\s*\('
