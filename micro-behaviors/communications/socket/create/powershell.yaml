# PowerShell managed TCP listener. A script that accepts a client is a
# server; the bind-shell objective pairs this with a redirected shell.
defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: powershell-tcplistener-object
    desc: PowerShell constructs a TcpListener
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'New-Object[^\r\n]{0,40}Sockets\.TcpListener\b'
  - id: powershell-accept-tcp-client
    desc: PowerShell accepts a TCP client
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.AcceptTcpClient\s*\('
  - id: powershell-redirect-standard-input
    desc: PowerShell redirects process standard input
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)RedirectStandardInput\s*=\s*(1|\$true)'
