# Canonical descriptor observations and socket-shell relays.
defaults:
  for:
  - perl
  - text
  platforms:
  - unix
  - windows
  crit: component
  conf: 0.9
traits:
- id: perl-inet-stream-socket
  desc: Perl opens a PF_INET stream socket
  if:
    type: text
    regex: socket\s*\(\s*\w+\s*,\s*[PA]F_INET\s*,\s*SOCK_STREAM
