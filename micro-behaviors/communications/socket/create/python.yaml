# Socket Connect - Python
# MBC: C0001 (Socket Communication)
# ATT&CK: T1071
defaults:
  platforms: [windows, unix]
  for: [python, pyc]
  attack: T1071
  mbc: C0001
traits:
- id: socket-module-import
  desc: Imports Python's socket module
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: tree-sitter
    node: import_statement
    regex: '^import\s+socket\b'
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: well-known/lib/cloud/botocore::aws-python-sdk-source
- id: socket-from-import
  desc: from socket import
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: "from\\s+socket\\s+import"
  # === Socket creation ===
- id: socket-socket-call
  desc: socket.socket() call
  crit: notable
  conf: 0.7
  if:
    type: symbol
    exact: "socket.socket"
  unless:
    - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
composite_rules:
- id: socket-creation
  crit: notable
  desc: Python socket creation or socket-type constants
  any:
  - {id: socket-socket-call}
  # Any address-family / socket-type marker. The rule is `for: [python]`, so
  # the directory leg can only match the family traits that apply to Python.
  - {id: micro-behaviors/communications/socket/family}
  - {id: micro-behaviors/communications/socket/udp::sock-dgram-python}
