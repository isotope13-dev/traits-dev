# Socket creation - Python
# MBC: C0001 (Socket Communication)
defaults:
  platforms: [windows, unix]
  for: [python, pyc]
  mbc: C0001
traits:
# Socket imports are emitted under metadata/import/python/socket. Importing
# gethostbyname does not establish socket creation; keep this leaf on calls.
- id: socket-socket-call
  desc: socket.socket() call
  crit: notable
  conf: 0.7
  if:
    type: symbol
    kind: call
    exact: "socket.socket"
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
composite_rules:
- id: socket-creation
  crit: notable
  desc: Python socket creation or socket-type constants
  any:
  - {id: socket-socket-call}
  # Any address-family / socket-type marker. The rule is `for: [python]`, so
  # the directory leg can only match the family traits that apply to Python.
  - {id: micro-behaviors/communications/socket/family}
  - {id: micro-behaviors/communications/socket/udp::sock-dgram-python}
