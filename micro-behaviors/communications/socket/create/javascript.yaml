# Node.js datagram socket creation. Creating a socket is a neutral network
# capability and does not imply that the program listens for inbound traffic.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
traits:
  - id: node-dgram-create-socket
    conf: 0.86
    mbc: C0001
    desc: Node datagram module creates a socket
    if:
      type: symbol
      kind: call
      regex: '^(dgram|import_dgram[0-9]*\.default)\.createSocket$'
  # `new <mod>.Socket()` — the constructor form, matched on any receiver.
  #
  # The atoms above all anchor on the module being *named* `net` (or a bundler's
  # `node_net_1` / `import_net.default`), and `socket-connect-port-host` needs a
  # numeric port literal at the call. An obfuscator defeats both at once: it
  # binds the require to a generated name and hoists the port and host into
  # variables, so `_0x2cf7.connect(_0x3db1,_0x1b2d)` matches nothing. The
  # constructor survives that, because the class name is part of the API.
  #
  # Component alone — plenty of unrelated classes are called `Socket` — and the
  # composite below pairs it with the `net` import that says which one this is.
  - id: node-socket-constructor
    desc: Constructs a Socket on any receiver
    conf: 0.8
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: 'new\s+[A-Za-z_$][\w$]{0,40}\.Socket\s*\('
  - id: net-socket-connect-method
    desc: Node net.Socket constructor
    conf: 0.85
    if:
      type: text
      regex: '\bnew\s+net\.Socket\s*\('
