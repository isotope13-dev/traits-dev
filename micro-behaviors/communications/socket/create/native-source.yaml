# Socket creation as it appears in C/C++ source, independent of platform.
#
# `socket(AF_INET, SOCK_STREAM, 0)` is spelled identically against Winsock and
# against the BSD sockets API, so this call carries no platform information --
# it previously lived in windows.yaml and was described as a Winsock call,
# which mislabelled every POSIX daemon and embedded agent that it matched.
defaults:
  for: [c, cpp]
  platforms: [windows, unix]

traits:
- id: socket-source
  desc: Creates a socket in C/C++ source
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: '(^|\.)socket$'
