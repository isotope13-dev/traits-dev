defaults:
  platforms:
  - unix
  - android
  for:
  - elf
  arch:
  - mips
  crit: notable
traits:
- id: mips-direct-socket-syscall-be
  desc: Big-endian MIPS direct socket syscall
  crit: notable
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: 24 02 10 57 00 00 00 0c
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-socket-syscall-le
  desc: Little-endian MIPS direct socket syscall
  crit: notable
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: 57 10 02 24 0C 00 00 00
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
