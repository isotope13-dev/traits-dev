# Preserved Windows PE/DLL observations, classified by their supported operation.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: socket-api-ordinal
    desc: Winsock socket creation import
    crit: notable
    conf: 0.88
    if:
      type: yara
      source: |
        import "pe"
        rule socket_api_ordinal {
          strings:
            $library = "WS2_32.dll" ascii nocase
          condition:
            $library and
            pe.imports("WS2_32.dll", 23)
        }

