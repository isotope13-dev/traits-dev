# Linux SuperH: r3 holds __NR_socket (340); trapa #0x13 takes three args.
# The PC-relative word load points exactly at the syscall number below.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [superh]
traits:
  - id: superh-glibc-socket-syscall
    desc: SuperH glibc direct socket syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: "1C 93 13 C3 0B 20 0B 20 0B 20 0B 20 0B 20 [46] 54 01"
