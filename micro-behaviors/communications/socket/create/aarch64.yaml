# Direct socket creation belongs with the operation, regardless of ABI.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [aarch64]
  crit: notable
  conf: 0.99

traits:
  - id: aarch64-socket-syscall-wrapper
    desc: AArch64 socket(2) syscall wrapper
    if:
      type: hex
      section: .text
      # mov w8/x8, 198 (0xc6); ...; svc 0
      pattern: "C8 18 80 (52|D2) [0-16] 01 00 00 D4"

