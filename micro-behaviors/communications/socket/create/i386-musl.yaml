defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]

traits:
  # musl passes syscall number in EAX, SYS_SOCKET in EDX and the argument
  # vector in ECX to its shared syscall trampoline, which moves EDX to EBX.
  - id: i386-musl-socket-wrapper
    desc: i386 socket creation through syscall trampoline
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'BE 01 00 00 00 53 BB 66 00 00 00 [12-40] 89 D8 [0-12] 89 F2 [0-32] E8 ?? ?? ?? ??'
