defaults:
  for: [elf]
  platforms: [linux]
  arch: [arm]
  crit: notable

traits:
  - id: arm-socket-variadic-syscall-stub
    desc: ARM socket syscall-281 forwarding stub
    conf: 0.98
    if:
      type: hex
      offset_range: [0, null]
      # Move domain/type/protocol into variadic argument registers. The LDR
      # at +24 points exactly at the SYS_socket literal following BX LR.
      # BL displacement is linker-dependent, not part of the fingerprint.
      pattern: "04 E0 2D E5 01 C0 A0 E1 02 30 A0 E1 00 10 A0 E1 04 D0 4D E2 0C 20 A0 E1 0C 00 9F E5 ?? ?? ?? EB 04 D0 8D E2 04 E0 9D E4 1E FF 2F E1 19 01 00 00"
