defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.88
  attack: T1071
  mbc: C0001

traits:
  # `write` is deliberately not a send verb here: file-handle
  # `output.write(data)` / `output.close()` pairs (plain file I/O) otherwise
  # match, claiming a transport close that never happens.
  - id: send-followed-by-transport-close
    desc: Sends then closes a transport
    if:
      type: text
      regex: '\.(sendall|send)\([^\n]{0,180}\);?\r?\n\s*\w+\.(close|shutdown|abort)\('

  - id: python-context-managed-tls
    desc: Uses a context-managed Python TLS socket
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bwith\s+\w+\.wrap_socket\([^\n]{0,120}\)\s+as\s+\w+\s*:'

  - id: python-sendall-at-block-end
    desc: Ends a Python block with sendall
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?m)^[ \t]{4,}\w+\.sendall\([^\n]{0,180}\)\s*\r?\n[ \t]*\r?\n[ \t]{0,8}\S'

composite_rules:
  - id: python-context-send-and-close
    desc: Context-managed TLS closes after sending
    conf: 0.94
    all:
      - id: python-context-managed-tls
      - id: python-sendall-at-block-end
    near_bytes: 2048
