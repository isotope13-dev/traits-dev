defaults:
  platforms: [unix, windows]
  for: [c, cpp]
traits:
  - id: ip-hdrincl-option
    desc: 'setting IP_HDRINCL socket option (IP header'
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'setsockopt\s*\([^,]{1,120},\s*[^,]{1,120},\s*IP_HDRINCL\s*,\s*[^)]{1,120}\)'

  # The option NAME on its own, without the setsockopt call above: present in
  # constant tables, headers and debug info as well as in code that sets it.
  - id: ip-hdrincl-constant
    desc: IP_HDRINCL socket option
    crit: notable
    conf: 0.75
    # Wider than the file default: the name shows up in compiled binaries and
    # scripts, not just C/C++ sources.
    for: [binaries, scripts, -python]
    if:
      type: text
      substr: IP_HDRINCL
    unless:
    - id: metadata/lang/compiler/systems::go-binary
    - id: metadata/lang/compiler/systems::go-binary-comp
    - id: metadata/lang/compiler/systems::go-buildinfo
