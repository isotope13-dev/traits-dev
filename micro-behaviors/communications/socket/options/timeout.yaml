# Connection-timeout option and error names (ssh_config ConnectTimeout,
# requests/httpx ConnectTimeout exceptions).
defaults:
  platforms: [linux, macos, windows]

traits:
  # `word:`, not `exact:` -- the token only appears inline (`-o ConnectTimeout=5`),
  # so an exact line match never fired. Moved from objectives/lateral-movement:
  # the ssh composites (python-ssh-key-lateral-probe) supply the ssh context.
  - id: connect-timeout-name
    desc: References a ConnectTimeout option or error
    crit: baseline
    conf: 0.6
    for: [scripts, binaries]
    if:
      type: text
      word: ConnectTimeout
    unless:
      - type: path
        regex: '(^|[/\\])requests[/\\]'
