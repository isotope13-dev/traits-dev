defaults:
  platforms: [unix, windows]
  for: [go]
  mbc: C0001

traits:
  - id: go-set-read-deadline-call
    desc: Go network read deadline call
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '(^|.*\.)SetReadDeadline$'

  - id: go-setsockopt-int-call
    desc: Go integer socket option call
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: syscall.SetsockoptInt

  - id: go-setsockopt-string-call
    desc: Go string socket option call
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: syscall.SetsockoptString

  - id: go-enable-multipath-tcp
    desc: Enables Go Multipath TCP
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.SetMultipathTCP$'

  - id: go-transparent-proxy-socket-option
    desc: Enables Linux transparent-proxy socket
    crit: notable
    conf: 0.92
    platforms: [linux]
    if:
      type: text
      regex: 'syscall\.SetsockoptInt\([^\n]{0,160}IP_TRANSPARENT'
