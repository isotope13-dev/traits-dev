defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: options-get
    desc: Get socket options
    crit: notable
    conf: 0.66
    if:
      type: symbol
      regex: getsockopt
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: options-set
    desc: Set socket options
    crit: notable
    conf: 0.66
    if:
      type: symbol
      regex: setsockopt
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: options-reuseport
    desc: Enable socket port reuse
    crit: notable
    conf: 0.66
    if:
      type: text
      substr: SO_REUSEPORT
    downgrade:
      any:
        - type: metrics
          field: binary.string_density
          min: 50
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: options-filter
    desc: Socket packet filtering
    crit: notable
    conf: 0.66
    if:
      type: text
      substr: SO_ATTACH_FILTER
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/compiler/systems::go-binary
  - id: options-filter-x64
    desc: Numeric SO_ATTACH_FILTER option
    crit: component
    conf: 0.86
    platforms: [linux]
    for: [elf]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: BA 1A 00 00 00 BE 01 00 00 00 89 C7 E8

  - id: tcp-nodelay-enable-x64
    desc: Native socket enables TCP_NODELAY
    crit: notable
    conf: 0.96
    platforms: [linux]
    for: [elf]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'BA 01 00 00 00 89 C7 BE 06 00 00 00 4C 8D 6C 24 ?? E8 ?? ?? ?? ??'

  - id: tcp-keepintvl-three-x64
    desc: Native TCP keepalive interval is three
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [elf]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'BA 05 00 00 00 BE 06 00 00 00 C7 44 24 ?? 03 00 00 00 E8 ?? ?? ?? ??'

  - id: tcp-keepcnt-five-x64
    desc: Native TCP keepalive retry count is five
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [elf]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'BA 06 00 00 00 89 DF 4C 89 E9 BE 06 00 00 00 41 B8 04 00 00 00 C7 44 24 ?? 05 00 00 00 E8 ?? ?? ?? ??'

composite_rules:
  - id: bpf-filter-attachment
    desc: Attach a classic or extended BPF socket filter
    crit: notable
    conf: 0.76
    any:
      - id: options-filter
      - id: micro-behaviors/os/bpf/program/network::so-attach-bpf

  - id: options-filter-native
    desc: Native socket packet filtering
    crit: notable
    conf: 0.86
    platforms: [linux]
    for: [elf]
    all:
      - id: options-set
      - id: options-filter-x64

  - id: aggressive-tcp-keepalive-x64
    desc: Native socket uses aggressive TCP keepalive
    crit: suspicious
    conf: 0.995
    platforms: [linux]
    for: [elf]
    all:
      - id: options-set
      - id: tcp-nodelay-enable-x64
      - id: tcp-keepintvl-three-x64
      - id: tcp-keepcnt-five-x64
