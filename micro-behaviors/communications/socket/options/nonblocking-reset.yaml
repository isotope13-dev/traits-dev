defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  crit: notable
traits:
  # SysV arguments: protocol=0, type=SOCK_STREAM|SOCK_NONBLOCK,
  # domain=AF_INET. Relative call displacement is deliberately unconstrained.
  - id: nonblocking-stream-create-x64
    desc: Native nonblocking IPv4 stream setup
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '31 D2 BE 01 08 00 00 BF 02 00 00 00 E8 ?? ?? ?? ??'

  # optlen=8, optname=SO_LINGER (13), level=SOL_SOCKET (1),
  # struct linger={1,0}. The pointer is the same register-backed buffer
  # initialized immediately before the call; no libc wrapper bytes are used.
  - id: reset-on-close-setup-x64
    desc: Native socket reset-on-close setup
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '41 B8 08 00 00 00 4C 89 E9 BA 0D 00 00 00 41 89 C6 89 C7 BE 01 00 00 00 48 C7 84 24 ?? ?? ?? ?? 01 00 00 00 E8 ?? ?? ?? ??'
