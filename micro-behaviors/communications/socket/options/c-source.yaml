defaults:
  platforms: [qnx, unix]
  for: [c, cpp, objc]
  crit: notable
  conf: 0.9

traits:
  - id: c-connect-timeout-options
    desc: C sets socket timeouts before connect
    if:
      type: text
      regex: 'setsockopt\s*\([\s\S]{0,220}SO_SNDTIMEO[\s\S]{0,260}SO_RCVTIMEO[\s\S]{0,500}connect\s*\('
