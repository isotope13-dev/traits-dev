defaults:
  platforms: [windows]
  for: [c, cpp, python]
  crit: notable
  conf: 0.93
  attack: T1040

traits:
  - id: sio-rcvall-constant
    desc: Windows SIO_RCVALL receive-all ioctl constant
    if:
      type: text
      word: SIO_RCVALL
  - id: rcvall-on-constant
    desc: Windows RCVALL_ON receive-all enable flag
    if:
      type: text
      word: RCVALL_ON
  - id: wsaioctl-call
    desc: WSAIoctl socket control call
    for: [c, cpp]
    if:
      type: symbol
      exact: WSAIoctl

composite_rules:
  - id: windows-rcvall-sniff
    desc: Windows socket put into receive-all promiscuous mode
    conf: 0.95
    all:
      - id: sio-rcvall-constant
      - id: rcvall-on-constant
