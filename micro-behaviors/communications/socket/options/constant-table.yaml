# Files that carry the socket/IP option namespace wholesale rather than using a
# couple of options: the CPython _socket extension module, libc and audit
# libraries that map option numbers back to names, header dumps and debug info.
# Their mention of a single sharp option name (IP_HDRINCL, IPPROTO_RAW) is a
# table entry, not a program configuring a raw socket.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  crit: baseline
  conf: 0.9
traits:
  - id: ipproto-constant-names
    desc: Many IPPROTO_ constant names
    count_min: 8
    if:
      type: text
      regex: '\bIPPROTO_[A-Z0-9_]{2,}'
  - id: sockopt-constant-names
    desc: Many SO_ socket option constant names
    count_min: 8
    if:
      type: text
      regex: '\bSO_[A-Z0-9_]{2,}'
  - id: ip-option-constant-names
    desc: Many IP_ option constant names
    count_min: 8
    if:
      type: text
      regex: '\bIP_[A-Z0-9_]{2,}'
  - id: address-family-constant-names
    desc: Many AF_ address family constant names
    count_min: 8
    if:
      type: text
      regex: '\bAF_[A-Z0-9_]{2,}'
  - id: socket-type-constant-names
    desc: Many SOCK_ socket type constant names
    count_min: 4
    if:
      type: text
      regex: '\bSOCK_[A-Z0-9_]{2,}'
  - id: msg-flag-constant-names
    desc: Many MSG_ flag constant names
    count_min: 8
    if:
      type: text
      regex: '\bMSG_[A-Z0-9_]{2,}'
composite_rules:
  - id: socket-constant-name-table
    desc: Exhaustive socket/IP constant name table
    crit: baseline
    conf: 0.9
    needs: 4
    any:
      - id: ipproto-constant-names
      - id: sockopt-constant-names
      - id: ip-option-constant-names
      - id: address-family-constant-names
      - id: socket-type-constant-names
      - id: msg-flag-constant-names
