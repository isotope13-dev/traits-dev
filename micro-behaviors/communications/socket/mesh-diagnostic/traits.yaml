defaults:
  platforms: [linux, macos, windows]
  for: [binaries]

traits:
  - id: peer-connected-diagnostic
    desc: Peer connection diagnostic message
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bconnected to peer\b[^\n]{0,40}%s'
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-prrte-package

  - id: peer-status-diagnostic
    desc: Peer status diagnostic message
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bpeer\b\s+%s\s+(removed|not found|already exists)'

  - id: route-added-diagnostic
    desc: Mesh route diagnostic message
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\broute added\b[^\n]{0,40}%s\s+via\s+%s'

  - id: peer-capacity-diagnostic
    desc: Peer capacity diagnostic message
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bmax peers reached\b'

  - id: peer-route-table-json
    desc: Peer and route table JSON
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\{"peers":\s*\['
