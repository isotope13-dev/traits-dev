defaults:
  for: [shell]
  platforms: [unix]
traits:
  - id: uname-group-netcat-export
    desc: Pipes uname command group into netcat
    crit: notable
    if:
      type: text
      regex: '\{[ \t]*uname[ \t]+-a[ \t]*;[^{}\n]{0,160}\}[ \t]*\|[ \t]*(nc|ncat|netcat)\b'
  - id: nc-public-ip-endpoint
    desc: Netcat command targets public IPv4 endpoint
    crit: notable
    if:
      type: text
      regex: '\b(nc|ncat|netcat)[ \t]+([0-9]{1,3}\.){3}[0-9]{1,3}[ \t]+[0-9]{1,5}\b'
      is: external_ip
