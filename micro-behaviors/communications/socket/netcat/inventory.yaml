defaults:
  for: [shell]
  platforms: [unix]
traits:
  - id: uname-group-netcat-export
    desc: Pipes uname command group into netcat
    crit: notable
    if:
      # Bind the receiving command so multiline groups retain precise proximity.
      type: tree-sitter
      language: bash
      query: |
        ((pipeline
          . (compound_statement
              (command name: (command_name) @uname argument: (_) @flag))
          . (command name: (command_name) @netcat) @evidence .)
         (#eq? @uname "uname")
         (#eq? @flag "-a")
         (#match? @netcat "^(nc|ncat|netcat)$"))
  - id: nc-public-ip-endpoint
    desc: Netcat command targets public IPv4 endpoint
    crit: notable
    if:
      type: text
      regex: '\b(nc|ncat|netcat)\s+(-w\s+\d+\s+)?(\d{1,3}\.){3}\d{1,3}\s+\d{1,5}\b'
      is: external_ip
  - id: nc-public-upload-pipeline
    desc: Pipes output to public netcat endpoint
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '\|\s*(nc|ncat|netcat)\s+(-w\s+\d+\s+)?(\d{1,3}\.){3}\d{1,3}\s+\d{1,5}\b'
      is: external_ip
