defaults:
  platforms: [linux, macos]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: shell-filtered-env-netcat-pipeline
    desc: Sends credential-filtered environment to netcat
    if:
      type: tree-sitter
      language: shell
      query: |
        (pipeline
          (command name: (command_name (word) @producer))
          (command name: (command_name (word) @selector)) @filter
          (command name: (command_name (word) @sender))
          (#eq? @producer "env")
          (#eq? @selector "grep")
          (#eq? @sender "nc")
          (#match? @filter "(AWS|TOKEN|SECRET|PASSWORD|API_KEY)"))
