defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: nc-native-command-bytes
    desc: Netcat command with raw byte boundaries
    crit: notable
    conf: 0.9
    for: [pe, elf, macho]
    if:
      # Extracted runs can start after an arbitrary non-ASCII padding byte.
      type: raw
      regex: '(?m)(^|[\x00;&|(`"''])\s*(/(usr/)?bin/)?nc\s+(-[A-Za-z]+|[\w.$:-]+\s+\d{1,5})\b'
  - id: nc-other-command-text
    for: [scripts, binaries, "-pe", "-elf", "-macho"]
    desc: nc command text
    if:
      type: text
      # Require a command boundary. A bare word boundary let source identifiers
      # such as `nc` match later expression text across a newline (for example,
      # `nc else 0`).
      # Do not treat arithmetic such as `("t": nc * (nc - 1))` as a
      # command. A host/port form must begin with a host character, so an
      # assignment such as `nc = 2` is not interpreted as a connection.
      regex: '(?m)(^|[;&|(`"''])\s*(/(usr/)?bin/)?nc\s+(-[A-Za-z]+|[A-Za-z0-9_.$:-]+\s+\d{1,5})\b'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
  - id: netcat
    desc: netcat command text
    if:
      type: text
      regex: \bnetcat\s+(-[a-zA-Z]+|[\w./:][\w./:-]*\s+\d{1,5})\b
    unless:
      - id: metadata/package/vendor::bitdefender-ecnet-telemetry
      - id: metadata/file/catalog/identity/
  - id: nc-connect-endpoint
    desc: Netcat command text with endpoint arguments
    crit: notable
    conf: 0.95
    for: [shell, package.json, javascript, typescript, scripts, text]
    if:
      type: text
      # A connect target distinguishes an outbound relay from `nc -l -p PORT`,
      # which exposes a local listener and belongs with bind-shell behavior.
      regex: '(?m)(^|[;&|(`"'']|\\n) *(nc(at)?|netcat) +(-[a-km-z]+ +){0,5}[\w.$-]+ +(\d+|\$\w+)\b'
  - id: nc-brace-endpoint-slots
    desc: Netcat command with brace endpoint slots
    crit: notable
    conf: 0.94
    for: [shell, scripts, source, python]
    if:
      type: text
      regex: 'nc +\{[^{}\n]{0,24}\} +\{[^{}\n]{0,24}\}'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: nc-listen-mode
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/file/catalog/identity/
  - id: nc-exec-option-connect-endpoint
    desc: Netcat exec option precedes connect endpoint
    crit: notable
    conf: 0.95
    for: [shell, package.json, javascript, typescript, scripts, text]
    if:
      type: text
      # -e consumes an executable before the actual host and port. The
      # ordinary endpoint matcher cannot parse that intervening argument.
      regex: '(?m)(^|[;&|(`"'']) *(nc(at)?|netcat) +-(e|-exec) +\S+ +[\w.$-]+ +\d+\b'
  - id: netcat-keyword
    desc: netcat name reference
    crit: notable
    conf: 0.7
    if:
      type: text
      word: netcat
  - id: wrapped-nc
    desc: Shell invokes netcat through toybox or BusyBox
    crit: notable
    conf: 0.92
    for: [shell]
    if:
      type: text
      regex: '\b(toybox|busybox[0-9A-Za-z._-]*)\s+nc\s+\S+\s+\d{1,5}\b'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: nc-pipe
    desc: Pipe into netcat command
    # Neutral shell pipeline into nc; reverse-shell intent requires additional
    # legs (mkfifo, interactive shell) in objectives composites.
    crit: notable
    conf: 0.7
    for: [shell]
    if:
      type: text
      regex: '\|\s*(/(usr/)?bin/)?nc\s'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - type: text
        regex: '\becho\b.{0,16}\|\s*(/(usr/)?bin/)?nc\b'
  - id: nc-listen-mode
    desc: Netcat listen-mode invocation
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '(^|/)(nc|ncat|netcat)$'
      arg:
        kind: identifier
        name: -l
  - id: nc-variable-endpoint
    desc: Netcat connects to variable endpoint
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '\bnc\b[^\n]{0,32}"?\$[A-Za-z0-9_{}]+"?\s+"?\$[A-Za-z0-9_{}]+"?'

composite_rules:
  - id: nc-outbound-target
    desc: Netcat text names an outbound target
    for: [scripts, binaries, package.json, text]
    crit: notable
    conf: 0.95
    any:
      - id: nc-connect-endpoint
      - id: nc-brace-endpoint-slots
      - id: nc-variable-endpoint
      - id: nc-exec-option-connect-endpoint

  - id: nc
    desc: nc command text
    crit: notable
    conf: 0.9
    any:
      - id: nc-native-command-bytes
      - id: nc-other-command-text
