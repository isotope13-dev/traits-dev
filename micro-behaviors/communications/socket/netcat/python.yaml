defaults:
  for: [python]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98

traits:
  - id: python-system-outbound-shell
    desc: Python calls Netcat with outbound shell
    if:
      type: symbol
      kind: call
      exact: os.system
      arg:
        index: 0
        regex: '^(/(usr/)?bin/)?(busybox\s+)?(nc|ncat|netcat)\s+[A-Za-z0-9_][A-Za-z0-9_.:-]*\s+[0-9]{1,5}\s+-e\s+/(usr/)?bin/(ba|da|z|k)?sh\s*$'
