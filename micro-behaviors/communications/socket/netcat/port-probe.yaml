defaults:
  platforms: [unix, windows]
  for: [shell, scripts, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: nc-zero-io-port-probe
    desc: Netcat zero-I/O port reachability probe
    if:
      type: text
      regex: '(?m)(^|[;&|(`"''])\s*(nc(at)?|netcat)\s+-[a-zA-Z]*z[a-zA-Z]*\s+'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
