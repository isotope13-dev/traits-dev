defaults:
  platforms: [unix, windows]
  for: [shell, scripts, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: nc-zero-io-port-probe-command
    desc: Netcat zero-I/O port reachability probe
    crit: component
    if:
      type: text
      regex: '(?m)(^|[;&|(`"''])\s*(nc(at)?|netcat)\s+-[a-zA-Z]*z[a-zA-Z]*\s+'
    for: [shell, scripts, binaries, -python, -javascript, -typescript]
  - id: nc-zero-io-port-probe-string
    desc: Netcat zero-I/O port reachability probe
    crit: component
    for: [python, javascript, typescript]
    if:
      type: literal
      regex: '(?m)(^|[;&|(`"''])\s*(nc(at)?|netcat)\s+-[a-zA-Z]*z[a-zA-Z]*\s+'
composite_rules:
  - id: nc-zero-io-port-probe
    desc: Netcat zero-I/O port reachability probe
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
    any:
      - id: nc-zero-io-port-probe-command
      - id: nc-zero-io-port-probe-string
