defaults:
  crit: notable
  conf: 0.85
  platforms: [unix, android]
  for: [elf]

traits:
  - id: commserver-symbol
    desc: commServer communication routine name
    if:
      type: symbol
      exact: commServer

  - id: maincommsock-symbol
    desc: mainCommSock socket state symbol
    if:
      type: symbol
      exact: mainCommSock

  # This symbol only establishes a connection helper. C2 and DDoS intent are
  # supplied by objective composites that combine it with command dispatch
  # and attack routines.
  - id: initconnection-function-name
    desc: initConnection network setup function name
    if:
      type: text
      exact: initConnection
