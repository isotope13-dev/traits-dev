# Position-independent x86 shellcode cannot import ws2_32, so it pushes the
# module name onto the stack and loads it through a hash-resolved
# LoadLibraryA (ROR13 0x0726774C, the Metasploit block_api convention).
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_max: 5242880

traits:
  - id: ws2-32-stack-load-ror13-x86
    desc: Loads ws2_32 via ROR13-hashed LoadLibraryA
    crit: notable
    conf: 0.97
    attack: T1106
    mbc: B0032.014
    if:
      type: hex
      # push "32"; push "ws2_"; push esp; push 0x0726774C (LoadLibraryA)
      pattern: '68 33 32 00 00 68 77 73 32 5F 54 68 4C 77 26 07'
      offset_range: [0, null]
