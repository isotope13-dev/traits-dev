defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: wsa-startup
  desc: Initialize Winsock library
  crit: notable
  conf: 0.9
  if:
    type: import
    regex: '(^|\.)WSAStartup$'
- id: wsa-cleanup
  desc: Cleanup Winsock library
  crit: baseline
  conf: 0.9
  if:
    type: symbol
    exact: WSACleanup
- id: wsa-get-last-error
  desc: Get last Windows socket error
  crit: baseline
  conf: 0.85
  if:
    type: symbol
    exact: WSAGetLastError
- id: wsa-set-last-error
  desc: Set Windows socket error code
  crit: baseline
  conf: 0.85
  if:
    type: symbol
    exact: WSASetLastError
- id: ws2-32-dll-marker
  desc: Winsock WS2_32 DLL name reference
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: WS2_32.dll
- id: msi-embedded-ws2-32-dll
  desc: MSI embedded Winsock DLL reference
  crit: notable
  conf: 0.78
  for: [oledoc, ole]
  if:
    type: text
    substr: ws2_32.dll
- id: ws2-startup-api-string
  desc: Winsock startup API string
  crit: notable
  conf: 0.76
  if:
    type: text
    exact: WSAStartup
  # Go's runtime registers dormant Winsock APIs even in hello-world images.
  # A name in that table supplies no application-level network operation.
  unless:
  - id: metadata/lang/compiler/systems::go-pe-binary-context

- id: wsock32-dll-marker
  desc: References WSOCK32 Winsock DLL
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: '(?i)^wsock32\.dll$'
  downgrade:
    any:
    - id: metadata/binary/vendor::is-microsoft-named
- id: wsa-socket
  desc: Create a Winsock socket with WSASocketW
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: WSASocketW
- id: wsa-socket-source
  desc: WSASocketW call in Windows source
  crit: notable
  conf: 0.92
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    exact: WSASocketW
- id: listen-api
  desc: Winsock listen import
  crit: notable
  conf: 0.9
  if:
    type: import
    regex: '(^|\.)listen$'
- id: accept-api
  desc: Winsock accept import
  crit: notable
  conf: 0.9
  if:
    type: import
    regex: '(^|\.)accept$'
- id: wsa-send
  desc: Winsock overlapped send import
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: WSASend
- id: select-api
  desc: Winsock select import
  crit: notable
  conf: 0.88
  if:
    type: import
    regex: '(^|\.)select$'
- id: recvfrom-api
  desc: Winsock UDP receive import
  crit: notable
  conf: 0.88
  if:
    type: import
    regex: '(^|\.)recvfrom$'
- id: shutdown-api
  desc: Winsock shutdown import
  crit: notable
  conf: 0.85
  if:
    type: import
    regex: '(^|\.)shutdown$'
- id: wsa-duplicate-socket
  desc: Share socket with another process
  crit: notable
  conf: 0.88
  if:
    type: symbol
    exact: WSADuplicateSocketW
- id: getpeername-api
  desc: Query connected peer endpoint
  crit: notable
  conf: 0.85
  if:
    type: symbol
    exact: getpeername
- id: freeaddrinfo-api
  desc: Free resolved address list
  crit: baseline
  conf: 0.8
  if:
    type: symbol
    exact: freeaddrinfo
  # Winsock ws2_32 client-side ordinal imports: ws2_32 exports its BSD-socket
  # API by ordinal only, so an import entry carries the number and no name.
  # The bare "imports ordinal N" fact says nothing about which DLL owns it --
  # oleaut32, comctl32, winspool and mpr are imported by ordinal by every
  # Delphi / C++Builder / VB6 build -- so the atoms live in
  # metadata/binary/symbols/imports and the composites below pair each ordinal
  # with ws2-32-dll-marker to establish that the owning library is ws2_32.
- id: htons-port-80-sockaddr
  desc: Winsock sockaddr port 80 setup
  crit: notable
  conf: 0.82
  arch:
  - x86
  if:
    type: hex
    section: .text
    pattern: 6A 50 89 44 24 ?? FF 15
composite_rules:
- id: winsock-name-resolution-ordinal
  desc: Winsock ordinal name resolution
  crit: notable
  conf: 0.84
  all:
  - id: ws2-32-dll-marker
  any:
  - id: metadata/binary/symbols/imports::ordinal-import-51
  - id: metadata/binary/symbols/imports::ordinal-import-52
- id: winsock-client-ordinal-imports
  desc: Winsock client ordinal imports
  crit: notable
  conf: 0.86
  all:
  - id: ws2-32-dll-marker
  # The four-of-nine threshold now lives with the ordinals themselves.
  - id: metadata/binary/symbols/imports::four-low-ordinal-imports
  unless:
  - id: metadata/binary/symbols/count::many-imports-40
- id: socket-api-ordinal
  desc: Winsock socket creation import
  crit: notable
  conf: 0.88
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-23
- id: connect-api-ordinal
  desc: Winsock outbound connect import
  crit: notable
  conf: 0.88
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-4
# ws2_32 ordinal 14 is ntohl. Importing Winsock solely (or primarily) as a
# named-less ordinal byte-order helper is a common IAT camouflage for loaders
# that resolve the rest of the socket API at runtime.
- id: ntohl-api-ordinal
  desc: Winsock ntohl ordinal import
  crit: notable
  conf: 0.88
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-14
- id: recv-api-ordinal
  desc: Winsock receive import
  crit: notable
  conf: 0.86
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-16
- id: send-api-ordinal
  desc: Winsock send import
  crit: notable
  conf: 0.86
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-19
- id: shutdown-api-ordinal
  desc: Winsock shutdown import
  crit: notable
  conf: 0.84
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-22
- id: winsock-startup-ordinal
  desc: Initialize Winsock library
  crit: notable
  conf: 0.86
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-115
- id: winsock-cleanup-ordinal
  desc: Cleanup Winsock library
  crit: baseline
  conf: 0.84
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-116
- id: inet-addr-api-ordinal
  desc: IPv4 string conversion import
  crit: notable
  conf: 0.84
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-11
- id: htons-api-ordinal
  desc: Network byte order conversion
  crit: notable
  conf: 0.84
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-9
- id: winsock-client-ordinal-api-set
  desc: Winsock client ordinal connect send recv set
  crit: notable
  conf: 0.9
  all:
  - id: connect-api-ordinal
  - id: socket-api-ordinal
  - id: send-api-ordinal
  - id: recv-api-ordinal
- id: winsock-server-ordinal-api-set
  desc: Winsock server ordinal socket lifecycle
  crit: notable
  conf: 0.92
  all:
  - id: ws2-32-dll-marker
  - id: metadata/binary/symbols/imports::ordinal-import-1
  - id: metadata/binary/symbols/imports::ordinal-import-2
  - id: metadata/binary/symbols/imports::ordinal-import-13
  - id: metadata/binary/symbols/imports::ordinal-import-23
  any:
  - id: recv-api-ordinal
  - id: send-api-ordinal
- id: winsock-port-80-client
  desc: Winsock client uses port 80
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
  - id: htons-port-80-sockaddr
- id: winsock-legacy-client-lifecycle
  desc: Legacy Winsock client lifecycle
  crit: notable
  conf: 0.9
  all:
  - id: wsock32-dll-marker
  any:
  - id: micro-behaviors/communications/socket/connect::winsock-client-symbol-lifecycle
  - id: winsock-client-ordinal-imports
- id: winsock-server-symbol-lifecycle
  desc: Winsock server listener API imports
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/socket/create::socket-api
  - id: micro-behaviors/communications/socket/bind/function::winsock-bind-import
  - id: listen-api
  any:
  - id: accept-api
  - id: micro-behaviors/communications/socket/receive::recv-api
  - id: micro-behaviors/communications/socket/send::send-api
- id: winsock-dual-role-lifecycle
  desc: Winsock client and server API references
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
  - id: winsock-server-symbol-lifecycle
  any:
  - id: select-api
  - id: freeaddrinfo-api
- id: winsock-dual-role-multiple-tls-callbacks
  desc: Winsock client-server with multiple TLS callbacks
  crit: notable
  conf: 0.93
  all:
  - id: winsock-dual-role-lifecycle
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  any:
  - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo-import
  - id: micro-behaviors/process/create/thread::create-thread
  - id: select-api
  needs: 2
