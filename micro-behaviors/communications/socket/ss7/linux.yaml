defaults:
  for:
    - elf
  platforms:
    - unix
  crit: notable
  conf: 0.9
traits:
  - id: sms-imsi-log
    desc: SMS intercept log format
    attack: T1040
    if:
      type: text
      substr: send sms from %s imsi:%s to %s
  - id: sms-recv-log
    desc: SMS receive log format
    attack: T1040
    if:
      type: text
      substr: recv sms from %s to %s
  - id: tcap-dialogue-parse
    desc: TCAP dialogue parser errors
    if:
      type: text
      substr: tcap parse begin Dialogue
  - id: tcap-component-parse
    desc: TCAP component parser errors
    if:
      type: text
      substr: tcap parse end component fail
  - id: etsi-sms-spec
    desc: ETSI SMS specification reference
    if:
      type: text
      substr: 123040v040200p.pdf
  - id: imsi-filter-config
    desc: IMSI targeting config path
    crit: suspicious
    attack: T1056
    if:
      type: text
      exact: /tmp/devlog/orbit/keyring/esd/parm.txt
      section: .rodata
  - id: keyword-filter-config
    desc: Keyword targeting config path
    crit: suspicious
    attack: T1056
    if:
      type: text
      exact: /tmp/devlog/orbit/keyring/esd/keyword_parm.txt
      section: .rodata
  # `bond2` is five characters. Its siblings in this file are exact paths and
  # TCAP structures -- evidence that identifies an SS7 implant on its own --
  # and this is not of that kind: it is one interface name lifted from a
  # sample, and a string that short turns up by chance in any large binary's
  # string table. RustDesk's Flutter engine (lib/armeabi-v7a/libapp.so) carried
  # it and was reported as a bonded telecom interface. No rule references this,
  # so at `suspicious` its only effect was that standalone finding; as a
  # component it stays available to a future SS7 composite, which is the only
  # context where one interface name means anything.
  - id: telecom-bond-interface
    desc: Bonded telecom interface name
    crit: component
    if:
      type: text
      exact: bond2
composite_rules:
  - id: tcap-sms-parser
    desc: SS7 TCAP SMS parser
    attack: T1040
    all:
      - id: tcap-dialogue-parse
    any:
      - id: tcap-component-parse
      - id: etsi-sms-spec
  - id: selective-sms-filtering
    desc: Selective SMS targeting filters
    crit: suspicious
    attack: T1056
    needs: 2
    any:
      - id: sms-imsi-log
      - id: imsi-filter-config
      - id: keyword-filter-config
