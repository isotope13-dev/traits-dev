# ELF-visible connection-state mechanics. These are neutral capabilities;
# scan intent is inferred by the objective composites that reference them.
# (Relocated from objectives/discovery/network/scan/port: the matcher only
# observes BSD socket status strings -- the same phrases libc's strerror
# table carries, so every statically-linked binary contains them. Naming
# that an objective fired port-scan findings on benign static fixtures.)
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable

traits:
  - id: connection-status-strings
    desc: Socket connection status message strings
    conf: 0.86
    if:
      type: text
      regex: '(Connection refused|Connection timed out|Established \()'
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
