# Connection-status words. A RAT handshake may send one, but so does every
# enum of connection states (ADO.NET diagnostics, test reporters).
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll, csharp]
traits:
  - id: uppercase-connected-status-token
    desc: Uppercase CONNECTED status word
    crit: notable
    conf: 0.85
    if:
      type: text
      # Uppercase only; lowercase "connected" is common error-string prose.
      word: CONNECTED
