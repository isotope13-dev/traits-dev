defaults:
  platforms: [windows]
  for: [c, cpp, python, pe, dll]
  crit: notable
  conf: 0.93
  attack: T1095

traits:
  - id: vmci-device-name
    desc: VMware VMCI device name
    if:
      type: text
      word: VMCI
  - id: vmci-host-prefix
    desc: "VMware VMCI vm: address prefix"
    if:
      type: text
      substr: '"vm:"'
