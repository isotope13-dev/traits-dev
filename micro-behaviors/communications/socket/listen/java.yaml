defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin]
  attack: T1071
  mbc: C0001

traits:
  # ServerSocket.accept() takes no arguments; every other `accept` in Java
  # takes at least one -- Consumer/BiConsumer.accept(v) is among the most
  # frequently called methods in any lambda-using codebase, and FileFilter,
  # visitors and builders all define their own. Matching the bare method name
  # made this fire on ordinary code such as bnd's `jar.accept(outputFile)`,
  # so the empty argument list is what distinguishes the socket call.
  - id: java-socket-accept
    desc: Java socket accept call
    crit: notable
    conf: 0.85
    for: [java, kotlin]
    if:
      type: text
      regex: '\.accept\s*\(\s*\)'

  # Bytecode has no call syntax to anchor on, but the constant pool carries the
  # method descriptor: only ServerSocket.accept returns a java.net.Socket.
  - id: java-socket-accept-bytecode
    desc: Java socket accept descriptor in bytecode
    crit: notable
    conf: 0.9
    for: [class]
    if:
      type: text
      substr: '()Ljava/net/Socket;'

composite_rules:
  # Source and bytecode spellings of the same observation, so callers can
  # require "this code accepts a connection" without picking a form.
  - id: java-accepts-connection
    desc: Java accepts an inbound socket connection
    crit: notable
    conf: 0.85
    any:
      - id: java-socket-accept
      - id: java-socket-accept-bytecode
