---
defaults:
  crit: notable
  conf: 0.9
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  - go
traits:
- id: go-listener-request-packet
  desc: Listener request packet name text
  if:
    type: text
    substr: ListenerRequestPacket
- id: go-listener-bind-response-packet
  desc: Listener bind response packet name text
  if:
    type: text
    substr: ListenerBindReponse
- id: go-listener-socket-response-packet
  desc: Listener socket response packet name text
  if:
    type: text
    substr: ListenerSockResponsePacket
