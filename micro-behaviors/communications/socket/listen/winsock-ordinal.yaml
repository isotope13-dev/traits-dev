defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 1.0

traits:
  - id: winsock-listen-ordinal-import
    desc: Imports Winsock listen by ordinal
    if:
      type: yara
      source: |
        import "pe"
        rule winsock_listen_ordinal_import {
          strings:
            $library = /WS(2_32|OCK32)\.dll/ ascii nocase
          condition:
            $library and
            (pe.imports("WS2_32.dll", 13) or
             pe.imports("WSOCK32.dll", 13))
        }
