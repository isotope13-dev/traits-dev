defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
composite_rules:
  - id: arm-eabi-listener-file-capabilities
    desc: ARM listener with read, write and rename capabilities
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/syscall::arm-eabi-listening-server
      - id: micro-behaviors/os/syscall/invoke::svc-read
      - id: micro-behaviors/os/syscall/invoke::svc-write
      - id: micro-behaviors/fs/file/rename::arm-eabi-rename
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
