defaults:
  platforms:
  - unix
  - android
  for:
  - elf
  arch:
  - mips
  crit: notable
traits:
- id: mips-direct-listen-syscall-be
  desc: Big-endian MIPS direct listen syscall
  crit: notable
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: 24 02 10 4E 00 00 00 0C
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-listen-syscall-le
  desc: Little-endian MIPS direct listen syscall
  crit: notable
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: 4E 10 02 24 0C 00 00 00
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
