# Godot GDScript TCP server listen. .gd sources are typed as javascript by
# the scanner; matchers stay technology-specific in this filename.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text, scripts]
  crit: notable
  conf: 0.92

traits:
  - id: gdscript-tcpserver-new
    desc: Instantiates Godot TCPServer
    if:
      type: text
      regex: '\bTCPServer\.new\s*\(\s*\)'

  - id: gdscript-tcpserver-listen
    desc: Godot TCPServer listens on a port
    conf: 0.94
    if:
      type: text
      regex: '\b_tcp\.listen\s*\(|\bTCPServer\.new\s*\([\s\S]{0,200}\.listen\s*\('
