defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-socklisten-command
    desc: mIRC opens a listening socket
    crit: notable
    conf: 0.9
    for: [mirc, ircii]
    if:
      type: text
      regex: '(?i)(^|[\s;{|=])\.?/?socklisten\s+[A-Za-z]'

  - id: mirc-socklisten-event
    desc: mIRC socket listener event handler
    crit: notable
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      substr: '*:socklisten:'

