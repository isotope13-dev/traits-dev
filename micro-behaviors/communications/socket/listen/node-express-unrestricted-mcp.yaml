defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  conf: 0.95
  crit: notable
traits:
  - id: express-listen-port-without-host
    desc: Express listens without a host restriction
    if:
      type: text
      regex: 'app\.listen\(\s*this\.port\s*,\s*\(\s*\)\s*=>'
  - id: express-mcp-post-route
    desc: Express registers MCP POST endpoint
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: (member_expression object: (identifier) @app property: (property_identifier) @post)
          arguments: (arguments . (string (string_fragment) @route) (arrow_function)))
          (#eq? @app "app")
          (#eq? @post "post")
          (#eq? @route "/mcp"))
  - id: mcp-evaluate-expression-tool
    desc: MCP tool evaluates debugger expressions
    if:
      type: string_literal
      exact: evaluate_expression
composite_rules:
  - id: unrestricted-mcp-debug-evaluator
    desc: MCP debugger listens without host restriction
    crit: suspicious
    scope: file
    all:
      - id: express-listen-port-without-host
      - id: express-mcp-post-route
      - id: mcp-evaluate-expression-tool
