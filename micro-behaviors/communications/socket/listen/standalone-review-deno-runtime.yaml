defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: deno-localhost-tcp-listen
    desc: Deno listens on localhost TCP
    crit: notable
    conf: 0.97
    for: [javascript]
    if:
      type: text
      regex: 'Deno\.listen\(\{port:(n|\d{4,5}),hostname:"127\.0\.0\.1",transport:"tcp"\}'
