defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: asyncio-server-partial-reference
    desc: Asyncio server passed to partial
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'partial(asyncio.start_server'
  - id: handle-connect-partial-reference
    desc: Connection handler passed to partial
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'partial(handle_connect'
  - id: interface-interact-call
    desc: Interface interaction call
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: interface.interact

composite_rules:
  - id: async-interactive-console-server
    desc: Async server and interactive console callback
    crit: suspicious
    conf: 0.96
    all:
      - id: asyncio-server-partial-reference
      - id: handle-connect-partial-reference
      - id: interface-interact-call
