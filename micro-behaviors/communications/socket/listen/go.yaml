defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
  mbc: C0001
  attack: T1071
traits:
  - id: listen-go
    desc: Go net.Listen call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: net.Listen
    # A test harness does not negate a real listener call. Keep the neutral
    # capability visible, including when a payload is named *_test.go.
  # Go pclntab keeps the dotted name even when symbol recovery fails on ELF.
  - id: pclntab-net-listen
    desc: Go pclntab embeds net.Listen
    for: [elf, pe, macho]
    conf: 0.9
    if:
      type: hex
      offset_range: [0, null]
      pattern: 6e 65 74 2e 4c 69 73 74 65 6e
  - id: listen-tcp
    desc: Go net.ListenTCP call
    conf: 0.9
    if:
      type: symbol
      exact: net.ListenTCP
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: listen-udp
    desc: Go net.ListenUDP call
    conf: 0.9
    if:
      type: symbol
      exact: net.ListenUDP
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: listen-packet
    desc: Go packet listener creation call
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.ListenPacket$'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
