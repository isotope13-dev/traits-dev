defaults:
  platforms: [windows, unix]
  for: [go]
  mbc: C0001
  attack: T1071
traits:
  - id: listen-go
    desc: Go net.Listen call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: net.Listen
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: listen-tcp
    desc: Go net.ListenTCP call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: net.ListenTCP
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: listen-udp
    desc: Go net.ListenUDP call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: net.ListenUDP
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: listen-packet
    desc: Go packet listener creation call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.ListenPacket$'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: accept-go
    desc: Go listener accepts a connection
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.Accept$'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
