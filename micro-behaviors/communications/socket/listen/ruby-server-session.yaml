defaults:
  crit: notable
  platforms: [unix, windows]
  for: [ruby]
  conf: 0.9

traits:
  - id: ruby-tcp-server-loop-call
    desc: Ruby starts a TCP server loop
    if:
      type: text
      regex: '\bSocket\.tcp_server_loop\b'

  - id: ruby-tcp-server-accept-call
    desc: Ruby accepts a TCP server client
    if:
      # The claim is "constructs a TCPServer and accepts a client", which does
      # not depend on tight proximity: real servers separate TCPServer.new
      # from the accept loop with banner, option and request-parsing code
      # (the RRC webshell has ~640 bytes between them). A 120-byte window
      # only matched compact one-liners. 1000 stays under the broad-repeat
      # performance cap for text regexes.
      type: text
      regex: '(?s)\bTCPServer\.new\b.{0,1000}\.accept\b'
