defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: mips-static-listener-shell-capabilities
    desc: Static MIPS listener and shell-execution capabilities
    crit: notable
    conf: 0.97
    all:
      - id: metadata/arch/iot::mips
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
      - id: micro-behaviors/communications/socket/syscall::mips-socket-operation
      - id: micro-behaviors/communications/socket/syscall::mips-bind-operation
      - id: micro-behaviors/communications/socket/syscall::mips-listen-operation
      - id: micro-behaviors/process/create/exec::mips-o32-execve-syscall
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-rodata-substring
