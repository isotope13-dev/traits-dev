defaults:
  mbc: C0001
  platforms: [linux, macos]
  # C and C++ source included, matching the sibling `socket/create/unix.yaml`
  # (`for: [binaries, c]`). Symbol extraction works on source -- `listen`,
  # `accept` and `bind` come back as identifier symbols from a .c file -- so
  # the elf/macho-only gate was not a matcher limitation, it just made these
  # atoms unreachable for source. Everything built on them inherited that:
  # `posix-bind-shell-source`, declared `for: [c, cpp]`, required the `listen`
  # composite and therefore could never fire on any C file. The vsftpd 2.3.4
  # backdoor (bind, listen, accept, dup2 onto stdio, execl of /bin/sh) matched
  # every other leg and still scored clean.
  for: [binaries, c, cpp]
traits:
  - id: listen-sym
    desc: References listen socket API
    crit: notable
    conf: 0.6
    if:
      type: symbol
      exact: listen
  - id: accept-sym
    desc: References accept socket API
    crit: notable
    conf: 0.6
    if:
      type: symbol
      exact: accept
  - id: accept64-sym
    desc: accept64 function symbol
    crit: notable
    conf: 0.6
    if:
      type: symbol
      regex: accept64
composite_rules:
  - id: accept-func
    desc: Accept connection function
    crit: notable
    conf: 0.6
    any:
      - id: accept-sym
      - id: accept64-sym
  - id: listen
    desc: Socket listener with creation API
    crit: notable
    conf: 0.9
    all:
      - id: listen-sym
      - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: server-api-surface
    desc: POSIX socket server API surface
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/bind/function::bind
      - id: listen-sym
  - id: accepting-server-api-surface
    desc: POSIX accepting socket server API surface
    crit: notable
    conf: 0.84
    all:
      - id: server-api-surface
      - id: accept-sym
