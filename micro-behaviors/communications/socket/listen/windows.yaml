defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071
  mbc: C0001
traits:
  - id: source-listen-call
    desc: Native listen call
    crit: notable
    conf: 0.85
    for: [c, cpp, html, text]
    if:
      type: text
      regex: '(?i)((^|[^.\w])listen\s*\(|\binvoke\s+listen\b)'

composite_rules:
  - id: winsock-listener-call-sequence
    desc: Winsock server listener call sequence
    crit: notable
    conf: 0.92
    for: [c, cpp, html, text]
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/socket/bind/function::source-bind-call
      - id: source-listen-call
      - id: micro-behaviors/communications/socket/accept::source-accept-call
  - id: winsock-listener-imports
    desc: Winsock server listener imports
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/socket/bind/function::winsock-bind-import
      - id: micro-behaviors/communications/socket/init::listen-api
    any:
      - id: micro-behaviors/communications/socket/init::accept-api
      - id: micro-behaviors/communications/socket/init::select-api
      - id: micro-behaviors/communications/socket/init::wsa-startup

  - id: winsock-public-listener
    desc: Winsock all interfaces listener
    crit: suspicious
    conf: 0.9
    all:
      - id: winsock-listener-imports
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
