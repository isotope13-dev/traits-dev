defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071
  mbc: C0001
traits:
  - id: source-bind-call
    desc: Native bind call
    crit: notable
    conf: 0.85
    for: [c, cpp, html, text]
    if:
      type: text
      # No dot receiver: in pages and inline scripts `.bind(` is jQuery
      # event binding or Function.prototype.bind (`$(window).bind(...)`),
      # not the Winsock call. The linear-time engine has no lookbehind,
      # so the guard consumes the preceding character instead.
      regex: '(?i)(^|[^.\w])bind\s*\(|\binvoke\s+bind\b'

  - id: source-listen-call
    desc: Native listen call
    crit: notable
    conf: 0.85
    for: [c, cpp, html, text]
    if:
      type: text
      regex: '(?i)(\blisten\s*\(|\binvoke\s+listen\b)'

  - id: source-accept-call
    desc: Native accept call
    crit: notable
    conf: 0.85
    for: [c, cpp, html, text]
    if:
      type: text
      # The Winsock call is a lowercase free-function `accept(` used as a
      # call (after `=`, `(`, `;`, `return`, ...). C++ also names parser
      # and visitor methods `accept` (nlohmann `bool accept(...)`,
      # RapidJSON `value.Accept(handler)`): a declaration follows a type
      # name and a member call follows `.`/`->`, so neither context is
      # admitted here. Managed sockets keep the empty-argument
      # `.Accept()` receiver form; a visitor call always passes a handler.
      regex: '(^|[=(\[{;:]) *accept *\(|return +accept *\(|\.Accept\( *\)|(?i:invoke +accept)'

composite_rules:
  - id: winsock-listener-call-sequence
    desc: Winsock server listener call sequence
    crit: notable
    conf: 0.92
    for: [c, cpp, html, text]
    near_bytes: 256
    all:
      - id: source-bind-call
      - id: source-listen-call
      - id: source-accept-call
  - id: winsock-listener-imports
    desc: Winsock server listener imports
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/socket/init::bind-api
      - id: micro-behaviors/communications/socket/init::listen-api
    any:
      - id: micro-behaviors/communications/socket/init::accept-api
      - id: micro-behaviors/communications/socket/init::select-api
      - id: micro-behaviors/communications/socket/init::wsa-startup

  - id: winsock-public-listener
    desc: Winsock all interfaces listener
    crit: suspicious
    conf: 0.9
    all:
      - id: winsock-listener-imports
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
