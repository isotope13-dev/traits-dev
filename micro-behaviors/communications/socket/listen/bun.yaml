# Bun runtime socket listener. Bun's bundled node-compat layer implements
# net.createServer over Bun.listen, so the call appears in any compiled
# binary that embeds those modules; it is a capability, not an intent.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.97
  mbc: C0001
traits:
- id: bun-listen-call
  desc: Bun listens for socket connections
  if:
    type: symbol
    kind: call
    exact: Bun.listen
