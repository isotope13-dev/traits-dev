defaults:
  platforms: [windows, unix]
  mbc: C0001
traits:
  - id: python-short-socket-listen-method
    for: [python]
    crit: notable
    conf: 0.82
    desc: Python short-name socket listen call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(s|sock)\.listen$'
  - id: python-server-socket-listen-method
    for: [python]
    crit: notable
    conf: 0.82
    desc: Python server socket listen call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(server|listener)\.listen$'
  - id: python-named-socket-listen-method
    for: [python]
    crit: notable
    conf: 0.82
    desc: Python named socket listen call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(socket|[A-Za-z_][A-Za-z0-9_]*(socket|sock))\.listen$'
  - id: asyncio-start-server-call
    for: [python]
    crit: notable
    desc: Python asyncio starts a server
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: asyncio.start_server
composite_rules:
- id: socket-server-operations
  for: [python, pyc]
  attack: T1071
  desc: Server socket operations
  any:
  - {id: micro-behaviors/communications/socket/bind/function::socket-bind-call}
  - {id: micro-behaviors/communications/socket/accept::socket-accept-call}
  # Main composite (matches original YARA behavior)
