defaults:
  platforms: [windows, unix]
  mbc: C0001
traits:
  - id: python-short-socket-listen-method
    for: [python]
    crit: notable
    conf: 0.82
    desc: Python short-name socket listen call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(s|sock)\.listen$'
  - id: python-server-socket-listen-method
    for: [python]
    crit: notable
    conf: 0.82
    desc: Python server socket listen call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(server|listener)\.listen$'
  - id: python-named-socket-listen-method
    for: [python]
    crit: notable
    conf: 0.82
    desc: Python named socket listen call
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(socket|[A-Za-z_][A-Za-z0-9_]*(socket|sock))\.listen$'
  - id: asyncio-start-server-call
    for: [python]
    crit: notable
    desc: Python asyncio starts a server
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: asyncio.start_server
  - id: socket-accept-call--rx-1
    for: [python, pyc]
    attack: T1071
    desc: listen_socket.accept() call
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(listen_socket|listener_socket)\.accept$'
  - id: socket-accept-call--rx-2
    for: [python, pyc]
    attack: T1071
    desc: server.accept() call
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(server_socket|server|listener)\.accept$'
  - id: socket-accept-call--rx-3
    for: [python, pyc]
    attack: T1071
    desc: socket.accept() call
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: socket.accept
  - id: socket-accept-call--rx-4
    for: [python, pyc]
    attack: T1071
    desc: Short-name socket accept call
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '^(s|sock)\.accept$'
  - id: socket-accept-call--rx-5
    for: [python, pyc]
    attack: T1071
    desc: conn.accept() call
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: conn.accept
  - id: socket-accept-call--rx-6
    for: [python, pyc]
    attack: T1071
    desc: client_socket.accept() call
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: client_socket.accept
  # socket send/recv/sendall/recvfrom relocated to socket/send/ and
  # socket/receive/ (data transfer is not connection establishment).
  - id: socket-close-call
    for: [python, pyc]
    attack: T1071
    desc: socket.close() call
    crit: notable
    conf: 0.6
    if:
      type: symbol
      exact: "socket.close"
    # === Socket address operations ===
    # NOTE: socket.gethostbyname / socket.getaddrinfo are DNS-resolution calls and
    # live in micro-behaviors/communications/dns/lookup/resolver::gethostbyname /
    # ::getaddrinfo (the single canonical home). Reference those from there rather
    # than duplicating the atom here.
composite_rules:
- id: socket-accept-call
  for: [python, pyc]
  attack: T1071
  desc: socket.accept() call
  crit: notable
  conf: 0.7
  any:
  - id: socket-accept-call--rx-1
  - id: socket-accept-call--rx-2
  - id: socket-accept-call--rx-3
  - id: socket-accept-call--rx-4
  - id: socket-accept-call--rx-5
  - id: socket-accept-call--rx-6
- id: socket-server-operations
  for: [python, pyc]
  attack: T1071
  desc: Server socket operations
  any:
  - {id: micro-behaviors/communications/socket/bind/function::socket-bind-call}
  - {id: socket-accept-call}
  # Main composite (matches original YARA behavior)
