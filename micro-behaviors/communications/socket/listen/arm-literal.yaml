defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable

traits:
  - id: arm-eabi-listen
    desc: ARM EABI direct listen(2) wrapper
    crit: notable
    conf: 0.99
    arch: [arm]
    if:
      type: hex
      section: ".text"
      # mov r7, 0x11c; svc 0 (Linux ARM EABI listen)
      pattern: "47 7f a0 e3 00 00 00 ef"
    unless:
      - type: value
        path: elf.machine
        regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
