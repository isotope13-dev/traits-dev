defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: php-stream-socket-server
    desc: PHP creates a stream socket listener
    if:
      type: symbol
      kind: call
      exact: stream_socket_server

  - id: php-stream-socket-accept
    desc: PHP accepts a stream socket connection
    if:
      type: symbol
      kind: call
      exact: stream_socket_accept
