# Socket listen/accept in C/C++ source code
defaults:
  mbc: C0001
  attack: T1071
  platforms: [unix, windows]
  for: [c, cpp]
traits:
  - id: accept-call-source
    desc: Socket accept call in source
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      # POSIX/Winsock accept() has exactly three arguments. A bare symbol-name
      # match also classified unrelated one-argument functions such as PROJ's
      # GIE `accept(args)` command handler as network listeners.
      regex: '(?s)^accept\s*\([^,]{1,160},[^,]{1,160},[^,]{1,160}\)$'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/lib/format/nlohmann-json::nlohmann-json-source-header
composite_rules:
  - id: server-socket-source
    desc: Socket server pattern in source
    crit: notable
    conf: 0.80
    all:
      - id: micro-behaviors/communications/socket/bind/function::bind
    any:
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: accept-call-source
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
