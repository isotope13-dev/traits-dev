# Socket listen/accept in C/C++ source code
defaults:
  crit: notable
  mbc: C0001
  attack: T1071
  platforms: [unix, windows]
  for: [c, cpp]
composite_rules:
  - id: server-socket-source
    desc: Socket server pattern in source
    conf: 0.80
    all:
      - id: micro-behaviors/communications/socket/bind/function::source-bind-call
    any:
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: micro-behaviors/communications/socket/accept::accept-call-source
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
