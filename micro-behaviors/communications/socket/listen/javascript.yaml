# Node.js TCP, TLS, UDP, and Unix-socket listener primitives.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86
  mbc: C0001

traits:
  - id: node-net-create-server
    desc: Node net module creates a server
    if:
      type: symbol
      kind: call
      regex: '^(net|import_net[0-9]*\.default)\.createServer$'

  - id: node-tls-create-server
    desc: Node TLS module creates a server
    if:
      type: symbol
      kind: call
      regex: '^(tls|import_tls[0-9]*\.default)\.createServer$'

  - id: node-dgram-create-socket
    desc: Node datagram module creates a socket
    if:
      type: symbol
      kind: call
      regex: '^(dgram|import_dgram[0-9]*\.default)\.createSocket$'

  - id: node-server-listen
    desc: Node server listens on a local endpoint
    if:
      type: text
      regex: '\b(this\.)?(server|socket|srv)\s*\.\s*listen\s*\('

  - id: node-server-bind
    desc: Node datagram server binds an endpoint
    if:
      type: text
      regex: '\b(this\.)?(server|socket|srv)\s*\.\s*bind\s*\('
