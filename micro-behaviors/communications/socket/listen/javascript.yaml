# Node.js TCP, TLS, UDP, and Unix-socket listener primitives.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86
  mbc: C0001

traits:
  - id: node-net-create-server
    desc: Node net module creates a server
    if:
      type: symbol
      kind: call
      regex: '^(net|import_net[0-9]*\.default)\.createServer$'

  - id: node-tls-create-server
    desc: Node TLS module creates a server
    if:
      type: symbol
      kind: call
      regex: '^(tls|import_tls[0-9]*\.default)\.createServer$'

  - id: node-server-listen-generic
    desc: Node generic server listens on endpoint
    if:
      type: text
      regex: '\b(this\.)?(server|socket|srv)(\?\.|\.)\s*listen\s*\('

  - id: node-server-listen-named
    desc: Node named server listens on endpoint
    if:
      type: text
      # Include server-like field names (including `ipcServer`) and optional
      # chaining while keeping the matcher tied to a `.listen()` member call.
      regex: '\b(this\.)?[A-Za-z_$][\w$]*(Server|Socket|Srv)(\?\.|\.)\s*listen\s*\('

  - id: node-server-listen-all-interfaces
    desc: Node server listens on all interfaces
    crit: notable
    conf: 0.95
    attack: T1046
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\s*\.\s*listen\s*\([^)\r\n]{0,120}["'']0\.0\.0\.0["'']'

  - id: node-server-bind
    desc: Node server bind call
    if:
      type: text
      regex: '\b(this\.)?(server|socket|srv)\s*\.\s*bind\s*\('

  # Chromium Direct Sockets. Only an Isolated Web App can reach this API, and
  # it hands browser-hosted code a raw listening TCP socket -- the primitive a
  # proxy or relay running inside the browser needs.
  - id: direct-sockets-tcp-server
    desc: Chromium Direct Sockets TCP server socket
    conf: 0.95
    attack: T1090
    if:
      type: text
      regex: '\bnew\s+TCPServerSocket\s*\('

composite_rules:
  - id: node-server-listen
    desc: Node server listens on endpoint
    any:
      - id: node-server-listen-generic
      - id: node-server-listen-named
