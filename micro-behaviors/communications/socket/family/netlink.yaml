# Linux routing-netlink traffic-control operations.  These atoms are neutral;
# local-exploit intent is inferred by privilege-escalation composites.
defaults:
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]

traits:
  - id: route-netlink-socket
    desc: Opens a NETLINK_ROUTE socket
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)socket$'
      arg:
        kind: identifier
        name: NETLINK_ROUTE

  - id: go-netlink-dial
    desc: Opens a Go netlink connection
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: netlink.Dial

  - id: go-route-netlink-family
    desc: Selects the Linux route netlink family
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: identifier
      exact: NETLINK_ROUTE

  - id: new-traffic-filter
    desc: Creates traffic-control filter
    crit: notable
    conf: 0.92
    if:
      type: text
      word: RTM_NEWTFILTER

  - id: delete-traffic-filter
    desc: Deletes traffic-control filter
    crit: notable
    conf: 0.92
    if:
      type: text
      word: RTM_DELTFILTER

  - id: flower-classifier
    desc: Selects the flower traffic classifier
    crit: notable
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: flower

  - id: clsact-qdisc
    desc: Selects the clsact queueing discipline
    crit: notable
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: clsact

composite_rules:
  - id: traffic-control-filter-lifecycle
    desc: Traffic-control filter lifecycle
    crit: notable
    conf: 0.96
    all:
      - id: route-netlink-socket
      - id: new-traffic-filter
      - id: delete-traffic-filter
    any:
      - id: flower-classifier
      - id: clsact-qdisc

  - id: go-route-netlink-connection
    desc: Opens a Go Linux route-netlink connection
    crit: notable
    conf: 0.94
    for: [go]
    all:
      - id: go-netlink-dial
      - id: go-route-netlink-family
