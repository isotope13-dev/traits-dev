# Linux routing-netlink traffic-control operations.  These atoms are neutral;
# local-exploit intent is inferred by privilege-escalation composites.
defaults:
  crit: notable
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]

traits:
  - id: generic-netlink-socket
    desc: Opens a Linux Generic Netlink socket
    conf: 0.95
    if:
      type: text
      regex: '(?i)(AF_NETLINK[^\n]{0,100}NETLINK_GENERIC|NETLINK_GENERIC[^\n]{0,100}AF_NETLINK)'

  - id: route-netlink-socket
    desc: Opens a NETLINK_ROUTE socket
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)socket$'
      arg:
        kind: identifier
        name: NETLINK_ROUTE

  - id: go-netlink-dial
    desc: Opens a Go netlink connection
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: netlink.Dial

  - id: go-route-netlink-family
    desc: Selects the Linux route netlink family
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: identifier
      exact: NETLINK_ROUTE

  - id: new-traffic-filter
    desc: References RTM_NEWTFILTER request constant
    conf: 0.92
    if:
      type: text
      word: RTM_NEWTFILTER

  - id: delete-traffic-filter
    desc: References RTM_DELTFILTER request constant
    conf: 0.92
    if:
      type: text
      word: RTM_DELTFILTER

  - id: clsact-qdisc
    desc: References the clsact queueing discipline name
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: clsact

  - id: route-netlink-constant
    desc: References NETLINK_ROUTE protocol constant
    conf: 0.9
    for: [c, cpp, rust, python]
    if:
      type: text
      word: NETLINK_ROUTE
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: netlink-generic-constant
    desc: References NETLINK_GENERIC protocol constant
    conf: 0.9
    for: [c, cpp, rust, go, python]
    if:
      type: text
      word: NETLINK_GENERIC
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: x64-route-netlink-socket-args
    desc: Loads AF_NETLINK and NETLINK_ROUTE arguments
    crit: component
    conf: 0.88
    for: [elf]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'BF 10 00 00 00 [0-6] BE (02|03) 00 00 00 [0-6] (31 D2|BA 00 00 00 00) [0-8] E8'

  - id: x64-generic-netlink-socket-args
    desc: Loads AF_NETLINK and NETLINK_GENERIC arguments
    crit: component
    conf: 0.92
    for: [elf]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'BF 10 00 00 00 [0-6] BE (02|03) 00 00 00 [0-6] BA 10 00 00 00 [0-8] E8'

composite_rules:
  - id: x64-elf-route-netlink-socket
    desc: Opens NETLINK_ROUTE socket in ELF
    conf: 0.92
    for: [elf]
    arch: [x86-64]
    all:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: x64-route-netlink-socket-args

  - id: x64-elf-generic-netlink-socket
    desc: Opens NETLINK_GENERIC socket in ELF
    conf: 0.94
    for: [elf]
    arch: [x86-64]
    all:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: x64-generic-netlink-socket-args

  - id: linux-route-netlink
    desc: Opens or configures NETLINK_ROUTE socket
    conf: 0.92
    any:
      - id: route-netlink-socket
      - id: route-netlink-constant
      - id: go-route-netlink-connection
      - id: x64-elf-route-netlink-socket

  - id: linux-generic-netlink
    desc: Opens or configures Generic Netlink socket
    conf: 0.94
    any:
      - id: generic-netlink-socket
      - id: netlink-generic-constant
      - id: x64-elf-generic-netlink-socket
  - id: traffic-control-filter-lifecycle
    desc: Traffic-control filter lifecycle
    conf: 0.96
    all:
      - id: route-netlink-socket
      - id: new-traffic-filter
      - id: delete-traffic-filter
    any:
      - id: metadata/lang/natural/vocabulary/content-word::flower-string
      - id: clsact-qdisc

  - id: go-route-netlink-connection
    desc: Opens a Go Linux route-netlink connection
    conf: 0.94
    for: [go]
    all:
      - id: go-netlink-dial
      - id: go-route-netlink-family
