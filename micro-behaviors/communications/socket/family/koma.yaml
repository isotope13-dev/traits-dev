# KOMA is a Linux kernel connection-multiplexor socket family used by the
# public rainayangg/grpc-go research fork.  It is a neutral socket capability;
# any hostile intent must come from surrounding process, persistence, or
# exfiltration behavior.
defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: af-koma-socket
    desc: Opens a Linux KOMA kernel socket
    if:
      type: symbol
      kind: call
      exact: socket
      arg:
        kind: identifier
        name: AF_KOMA

