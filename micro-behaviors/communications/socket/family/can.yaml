# SocketCAN address family — the Linux socket interface to a CAN vehicle or
# machine fieldbus. Modelled on af_alg.yaml in this directory: the family
# constant, the address struct and the uapi header all mean the same thing
# ("this code opens a CAN socket"), so they share one atom, with the protocol
# selectors passed to socket() kept separate.
#
# CAN was the one fieldbus with no atoms anywhere in the tree while seven of
# its industrial siblings (modbus, dnp3, s7, bacnet, ethernet-ip, opcua,
# profinet) each had a directory under communications/. It belongs here rather
# than in a protocol directory of its own because what these matchers detect is
# the socket address family, not a wire-format decoder.
#
# The kernel-tree exclusions are not optional: include/uapi/linux/can.h and
# net/can/ define every one of these names, so without them a Linux source tree
# would read as CAN bus access. Same list af_alg and vsock carry.
#
# Deliberately keyed on the socket API and never on frame layout — libpcap's
# pcap/can_socketcan.h defines pcap_can_socketcan_hdr and the CANFD_*/CANXL_*
# frame bits without opening anything, and a DLT struct header must not read as
# bus access.
defaults:
  platforms: [unix]
  for: [c, cpp, elf, python]
  crit: notable
  conf: 0.9
traits:
  - id: af-can-socket
    desc: SocketCAN bus socket family (AF_CAN)
    if:
      type: text
      regex: '\b(AF|PF)_CAN\b|\bsockaddr_can\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: can-protocol-selector
    desc: SocketCAN protocol selector constant
    if:
      type: text
      regex: '\bCAN_(RAW|BCM|ISOTP|J1939)\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
