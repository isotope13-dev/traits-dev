# Userspace control of the Linux IPsec data path: XFRM netlink security
# associations, PF_KEYv2, the ESP IP protocol number and the ESP-in-UDP/TCP
# encapsulation template.
#
# Filed here beside netlink.yaml and af_alg.yaml because what these matchers
# find is the socket surface -- the family and protocol selectors a program
# passes to socket(), plus security-association message and encapsulation references.
#
# Every atom is a neutral capability. strongSwan, libreswan, iproute2,
# systemd-networkd and the kernel's own selftests all install SAs this way, so
# nothing below rises above `notable` on its own. Their security value is as
# the context gate for the esp4/esp6 page-cache write exploits (Dirty Frag,
# CVE-2026-43284 / CVE-2026-46300), which have to reach esp_input() through
# exactly this API before a shared-page write primitive means anything -- see
# objectives/privilege-escalation/exploit/kernel/dirtyfrag-esp.yaml.
#
# The kernel-tree exclusions are mandatory: net/xfrm/, net/ipv4/esp4.c and
# include/uapi/linux/xfrm.h define every one of these names, so without them a
# Linux source checkout reads as IPsec SA installation. Same list af_alg and
# af_can carry.
defaults:
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]
  crit: notable
  conf: 0.9

traits:
  # socket(AF_NETLINK, SOCK_RAW, NETLINK_XFRM) -- the SA/policy control channel.
  # Written as a proximity regex rather than a call-argument match because the
  # protocol selector is usually a locally defined integer constant, which is
  # how every non-C binding spells it.
  - id: xfrm-netlink-socket
    desc: References NETLINK_XFRM socket selectors
    conf: 0.95
    if:
      type: text
      regex: '(?i)(AF_NETLINK[^\n]{0,100}NETLINK_XFRM|NETLINK_XFRM[^\n]{0,100}AF_NETLINK)'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  # The netlink message types that create or replace a security association or
  # policy. Read-only types (GETSA, GETPOLICY) are deliberately absent:
  # querying the SAD is monitoring, writing to it is control.
  - id: xfrm-sa-install-message
    desc: XFRM SA/policy update message references
    conf: 0.93
    if:
      type: text
      regex: '\bXFRM_MSG_(NEW|UPD)(SA|POLICY)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: xfrm-usersa-info-struct
    desc: XFRM SA/policy structure references
    conf: 0.93
    if:
      type: text
      regex: '\bxfrm_user(sa|policy)_(info|id)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  # IP protocol 50. Selects the esp4/esp6 receive path for a raw socket or an
  # SA id -- the code that performs the in-place decrypt.
  - id: esp-protocol-selector
    desc: Socket-call text selects IPPROTO_ESP
    conf: 0.9
    # A binary's DWARF symbol table can carry IPPROTO_ESP from the system
    # headers even when its code never selects that protocol. This observation
    # is useful in source, where the call site remains visible, but is not
    # recoverable from that identifier alone in a compiled image.
    for: [c, cpp, rust, go, python]
    if:
      type: text
      regex: '(?i)\bsocket\s*\([^;\n]{0,160}\bIPPROTO_ESP\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  # ESP-in-UDP / ESP-in-TCP encapsulation. The encap template is what routes an
  # SA's traffic back through IP reassembly before esp_input() sees it.
  - id: esp-encapsulation-template
    desc: ESP-in-UDP/TCP encapsulation references
    conf: 0.93
    if:
      type: text
      regex: '\b(UDP_ENCAP_ESPINUDP(_NON_IKE)?|TCP_ENCAP_ESPINTCP|xfrm_encap_tmpl)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  # PF_KEYv2 (RFC 2367) is the other userspace SA-management API and reaches
  # the same esp4/esp6 code without touching netlink.
  - id: pfkey-sa-install-message
    desc: References PF_KEYv2 SA management message types
    conf: 0.93
    if:
      type: text
      regex: '\bSADB_(ADD|UPDATE|GETSPI)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

composite_rules:
  # Installing an SA needs both the control channel and an install message; the
  # pair is a control-channel profile, not proof a request was transmitted.
  - id: xfrm-sa-control-references
    desc: XFRM socket selectors accompany SA update message types
    crit: notable
    conf: 0.95
    all:
      - id: xfrm-netlink-socket
      - id: xfrm-sa-install-message

  # IPsec/ESP control references; consumers must supply their own operation
  # evidence. A bare template or constant does not establish a configured SA.
  - id: ipsec-esp-control-references
    desc: References Linux IPsec or ESP control interfaces
    crit: notable
    conf: 0.93
    any:
      - id: xfrm-sa-control-references
      - id: pfkey-sa-install-message
      - id: esp-encapsulation-template
      - id: esp-protocol-selector
      - id: micro-behaviors/network/tunnel::ip-xfrm-state-write-command
      - id: micro-behaviors/network/tunnel::ip-xfrm-state-write-source-command
      - id: micro-behaviors/network/tunnel::ip-xfrm-esp-state-write-argv
