# AF_RXRPC is a Linux networking family used by RxRPC/YFS-RxGK.  The family
# is a neutral socket capability; privilege-escalation intent belongs in the
# DirtyDecrypt composites that combine it with shared-page packet construction.
defaults:
  platforms: [linux]
  for: [c, cpp, go, rust, python, elf]

traits:
  - id: rxrpc-family-constant
    desc: Linux AF_RXRPC socket family
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(AF|PF)_RXRPC\b'

  - id: rxgk-token-encryption-context
    desc: RxGK token encryption context
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(RXGK_SERVER_ENC_TOKEN|YFS-RxGK|rxgk_(decrypt|set_up_token_cipher))\b'

composite_rules:
  - id: rxgk-rxrpc-context
    desc: RxRPC socket with RxGK token security context
    crit: notable
    conf: 0.95
    all:
      - id: rxrpc-family-constant
    any:
      - id: rxgk-token-encryption-context
      - id: micro-behaviors/os/security/keyring::rxrpc-server-keyring-insert
