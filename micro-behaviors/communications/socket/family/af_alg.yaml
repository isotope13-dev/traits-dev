defaults:
  platforms:
    - unix
    - windows
  for: [c, cpp, rust, go, python, elf]
traits:
  - id: af-alg-socket
    desc: Uses Linux Kernel Crypto API (AF_ALG)
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(AF_ALG|PF_ALG|sockaddr_alg)\b|linux/if_alg\.h'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: x64-af-alg-socket-args
    desc: Loads AF_ALG domain and socket type
    crit: component
    conf: 0.9
    for: [elf]
    arch: [x86-64]
    platforms: [linux]
    if:
      type: hex
      section: .text
      # System V AMD64 socket(AF_ALG=38, SOCK_SEQPACKET=5 | SOCK_RAW=3, 0):
      # edi = 0x26 (BF 26 00 00 00), esi = 5 or 3 (BE 05/03 00 00 00), then call.
      pattern: '( BF 26 00 00 00 [0-6] BE 05 00 00 00 | BF 26 00 00 00 [0-6] BE 03 00 00 00 | BE 05 00 00 00 [0-6] BF 26 00 00 00 | BE 03 00 00 00 [0-6] BF 26 00 00 00 ) [0-8] E8'

composite_rules:
  - id: x64-elf-af-alg-socket
    desc: Opens Linux AF_ALG socket in ELF
    crit: notable
    conf: 0.94
    for: [elf]
    arch: [x86-64]
    platforms: [linux]
    all:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: x64-af-alg-socket-args

  - id: linux-af-alg-socket
    desc: Opens or configures Linux AF_ALG socket
    crit: notable
    conf: 0.95
    platforms: [linux]
    any:
      - id: af-alg-socket
      - id: x64-elf-af-alg-socket
