# Numeric frame types have protocol-specific meanings. These comparisons
# alone establish no WebSocket tunnel action. Matchers and scopes retained.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-frame-open-case
    desc: Frame type equals 1 or OPEN/CONNECT
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_(type|kind)|message_type|\w*msg_type|mtype)\s*==\s*(1|MSG_(OPEN|CONNECT))\b'

  - id: python-frame-data-case
    desc: Frame type equals 3 or DATA
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_(type|kind)|message_type|\w*msg_type|mtype)\s*==\s*(3|MSG_DATA)\b'

  - id: python-frame-keepalive-case
    desc: Frame type equals 4/5 or PING/KEEPALIVE
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(frame_(type|kind)|message_type|\w*msg_type|mtype)\s*==\s*(4|5|MSG_(PING|KEEPALIVE))\b'

composite_rules:
  - id: python-fixed-frame-dispatch
    desc: Checks three frame-type control cases
    crit: notable
    conf: 0.95
    all:
      - id: python-frame-open-case
      - id: python-frame-data-case
      - id: python-frame-keepalive-case
    near_lines: 30

