# Go adapters that hand stream and packet connections to a protocol wrapper.
# This is a transport capability only; the wrapper implementation is outside
# this file and the observation does not imply hostile intent.
defaults:
  platforms: [unix, windows]
  for: [go]
  mbc: C0001

traits:
  - id: go-network-wrapper-constructor-family--transport
    desc: Calls transport-qualified Go connection wrapper
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^NewConn(Client|Server)(TCP|UDP)(Standalone)?$'
  - id: go-network-wrapper-constructor-family--short
    desc: Calls short Go connection wrapper
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^NewConn(Client|Server)$'

  - id: go-packet-connection-wrapper-method
    desc: Defines a Go PacketConn wrapper method
    crit: notable
    conf: 0.9
    if:
      type: function
      regex: '^WrapPacketConn(Client|Server)$'
composite_rules:
  - id: go-network-wrapper-constructor-family
    desc: Calls Go network connection wrappers
    crit: notable
    conf: 0.9
    any:
      - id: go-network-wrapper-constructor-family--transport
      - id: go-network-wrapper-constructor-family--short
