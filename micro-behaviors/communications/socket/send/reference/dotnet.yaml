defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  # SendAsync also belongs to HttpClient and WebSocket. Require the socket
  # event-argument type rather than calling every async send a socket send.
  # These are co-occurring API references, not a resolved call-site chain.
  - id: dotnet-async-socket-send-api-references
    desc: SocketAsyncEventArgs and SendAsync references
    conf: 0.9
    if:
      type: hex
      # NUL-terminated CLR names, bounded to the same code/metadata section.
      pattern: '53 6F 63 6B 65 74 41 73 79 6E 63 45 76 65 6E 74 41 72 67 73 00 [0-65536] 53 65 6E 64 41 73 79 6E 63 00'
      section: .text
