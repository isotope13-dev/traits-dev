---
defaults:
  crit: notable
  conf: 0.66
  mbc: C0001
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - c
  - cpp
  - python
traits:
- id: send-symbol
  desc: References send socket symbol
  for:
  - elf
  - macho
  - c
  - cpp
  if:
    type: symbol
    exact: send
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/lib/runtime/native-platform/chromium-helpers::chrome-sandbox-basename
- id: sendmsg-symbol
  desc: References sendmsg socket symbol
  if:
    type: symbol
    exact: sendmsg
- id: sendto-symbol
  desc: References sendto socket symbol
  if:
    type: symbol
    exact: sendto
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: sendto-function-definition
  desc: Defines a function named sendto
  crit: notable
  if:
    type: symbol
    kind: function
    exact: sendto
- id: sendto-libc-symbol
  desc: Uses static libc sendto alias
  if:
    type: symbol
    exact: __libc_sendto
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: sendmmsg-symbol
  desc: Uses sendmmsg socket call
  if:
    type: symbol
    exact: sendmmsg
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: send-data-reference
  desc: References a send_data send helper
  for:
  - elf
  - c
  platforms:
  - unix
  if:
    type: text
    regex: "(^|[^A-Za-z0-9_])send_data"
  unless:
  - type: basename
    regex: "\\.ko$"
  - type: section
    exact: ".modinfo"
composite_rules:
- id: send
  desc: Send a message to a socket
  any:
  - id: send-symbol
  - id: sendmsg-symbol
  - id: sendto-symbol
  - id: sendto-libc-symbol
  - id: sendmmsg-symbol
