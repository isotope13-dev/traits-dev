defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
traits:
- id: send-api
  desc: Winsock or managed Socket send import
  conf: 0.9
  if:
    type: import
    regex: '(^|\.)send$|^System\.Net\.Sockets\.Socket\.(Begin)?Send$'
- id: sendto-api
  desc: Winsock UDP send import
  conf: 0.88
  if:
    type: import
    regex: (^|\.)sendto$
