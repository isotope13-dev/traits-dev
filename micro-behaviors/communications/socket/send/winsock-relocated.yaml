# Preserved Windows PE/DLL observations, classified by their supported operation.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: send-api-ordinal
    desc: Winsock send import
    crit: notable
    conf: 0.86
    if:
      type: yara
      source: |
        import "pe"
        rule send_api_ordinal {
          strings:
            $library = "WS2_32.dll" ascii nocase
          condition:
            $library and
            pe.imports("WS2_32.dll", 19)
        }

