defaults:
  platforms: [freebsd, netbsd, unix]
  for: [objc]
  attack: T1041

composite_rules: []

traits:
  - id: objc-socket-body-buffer-send
    desc: "Socket send using body or byte buffer"
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'send\s*\(\s*sock[\s\S]{0,180}(body|bytes\s*\+\s*sent)'
