defaults:
  platforms: [linux, macos]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  - id: vllm-pickle-object-send
    desc: Sends a pickled object through TCPStore
    # Bind the receiver to the factory rather than treating every method
    # named send_obj as a vLLM network operation. send_obj calls pickle.dumps
    # and stores the bytes for the destination rank (vLLM v0.8.4 utils.py).
    if:
      type: symbol
      kind: call
      regex: '\.send_obj$'
      receiver:
        from:
          call: '^StatelessProcessGroup\.create$'
