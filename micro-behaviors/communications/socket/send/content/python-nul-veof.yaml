defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-send-eot-value
  desc: Send argument includes literal EOT bytes
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: \.send(all)?$
    arg:
      index: 0
      from:
        value: \x04
- id: python-send-nul-value
  desc: Send argument includes literal NUL bytes
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: \.send(all)?$
    arg:
      index: 0
      from:
        value: \x00
composite_rules:
- id: python-send-nul-eot-values
  desc: Same-line sends include NUL and EOT
  crit: notable
  conf: 0.98
  near_lines: 0
  all:
  - id: python-send-eot-value
  - id: python-send-nul-value
