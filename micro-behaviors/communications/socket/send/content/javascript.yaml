---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.86
  attack: T1071
  mbc: C0001
traits:
- id: object-write-call-with-identifier
  desc: Calls object write with identifier
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '\b[A-Za-z_$][\w$]{0,40}\.write\s*\(\s*[A-Za-z_$][\w$]{0,40}\s*\)'
- id: node-socket-json-write
  desc: Node socket writes JSON payload
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: "\\b(s|socket|sock|client)\\.write\\s*\\(\\s*JSON\\.stringify\\s*\\("

composite_rules:
- id: node-socket-connects-and-writes-json
  desc: Node socket and JSON write calls coexist
  conf: 0.88
  all:
  - id: micro-behaviors/communications/socket/create::node-socket-constructor
  - id: metadata/lang/source/syntax/call/member::object-connect-method-call
  - id: object-write-call-with-identifier
  - id: micro-behaviors/data/serialize/json::json-stringify-call
