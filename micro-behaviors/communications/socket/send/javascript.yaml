defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86
  attack: T1071
  mbc: C0001

traits:
  # The receiver is usually held on an object rather than in a bare variable
  # (`conn.socket.send(...)`, `this.ws.send(...)`), so the old `^`-anchored
  # form only saw the unqualified spelling and left member-chain sends to be
  # picked up -- wrongly -- by the XMLHttpRequest send trait. `(^|\.)` accepts
  # a receiver chain; `ws` still has to be the whole identifier so `flows.send`
  # and friends stay out, while any `*socket` spelling (webSocket, rawSocket)
  # is accepted.
  - id: javascript-socket-send
    desc: JavaScript socket send call
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(ws|[a-z0-9_]*socket)\.send$'
  - id: node-socket-write
    desc: Node socket writes a data payload
    crit: notable
    conf: 0.86
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\b(socket|sock|server|client\.socket)\s*\.\s*write\s*\('
  - id: node-socket-json-write
    desc: Node socket writes JSON payload
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(s|socket|sock|client)\.write\s*\(\s*JSON\.stringify\s*\('
