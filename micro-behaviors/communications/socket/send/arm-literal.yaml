defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable

traits:
  - id: arm-send-literal-syscall-wrapper
    desc: ARM send syscall with literal-pool r7
    crit: notable
    conf: 0.99
    arch: [arm]
    if:
      type: hex
      # The PC-relative load binds the literal number to SVC. Search raw
      # bytes too: valid ARM load segments may lack a usable section table.
      offset_range: [0, null]
      # Little-endian literal-pool encoding of Linux ARM SYS_send (289).
      pattern: "(30 70 9F E5 00 00 00 EF [48]|28 70 9F E5 00 00 00 EF [40]) 21 01 00 00"
    unless:
      - type: value
        path: elf.machine
        regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
  - id: arm-sendto-literal-syscall-wrapper
    desc: ARM sendto syscall with literal-pool r7
    crit: notable
    conf: 0.99
    arch: [arm]
    if:
      type: hex
      # The PC-relative load binds the literal number to SVC. Search raw
      # bytes too: valid ARM load segments may lack a usable section table.
      offset_range: [0, null]
      # Little-endian literal-pool encoding of Linux ARM SYS_sendto (290).
      pattern: "(30 70 9F E5 00 00 00 EF [48]|28 70 9F E5 00 00 00 EF [40]) 22 01 00 00"
    unless:
      - type: value
        path: elf.machine
        regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
