defaults:
  crit: notable
  platforms: [windows, unix]
  for: [ruby]
  attack: T1071
  mbc: C0001
traits:
  - id: ruby-socket-write-call
    desc: Ruby socket write call
    conf: 0.8
    if:
      type: text
      regex: '\b(sock|socket)\.write\s*\('
  - id: ruby-copy-stream-to-socket
    desc: Ruby copies a stream to a socket
    conf: 0.85
    if:
      # Accept the idiomatic `sock` receiver like the sibling gets/write traits,
      # so streaming child-command output back over the socket is recognized.
      type: text
      regex: 'copy_stream\s*\([^\)]{0,200}\b(sock|socket|tcpsocket)\b'
    not:
      - regex: 'IO\.copy_stream\((f|file), sock\)'
      - substr: file.binmode
