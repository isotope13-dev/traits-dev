defaults:
  platforms: [unix, windows]
  for: [rust]
  mbc: C0001
traits:
  - id: rust-datagram-send-to
    desc: Rust sends a datagram to a destination
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)send_to$'

  - id: rust-write-all
    desc: Rust writes all bytes to stream
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bstream\.write_all\s*\('
