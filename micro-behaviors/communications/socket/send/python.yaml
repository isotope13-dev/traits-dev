defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.7
  attack: T1071
  mbc: C0001
traits:
  - id: python-sendto
    desc: Python socket sendto() call
    if:
      type: text
      substr: '.sendto('
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: python-sendto-in-state-loop
    desc: Python sendto call inside state-controlled loop
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?s)\bwhile\s+[A-Za-z_]\w*(\.[A-Za-z_]\w*)?\s*:\s*.{0,320}\.sendto\s*\('
  - id: python-sendall
    desc: Python socket sendall() call
    if:
      type: text
      substr: '.sendall('
  - id: python-sendall-pyc-name
    desc: Python socket sendall name in bytecode
    for: [pyc]
    if:
      type: text
      substr: sendall
  - id: python-send-byte-0x24
    desc: Python sends literal byte 0x24
    crit: component
    conf: 0.86
    if:
      type: text
      regex: 'send(all)?\s*\(\s*b?["'']\\x24["'']\s*\)'
  - id: socket-send-call
    desc: Python socket send() call
    if:
      type: symbol
      exact: "socket.send"
  - id: socket-send-method-named
    desc: Named Python socket send call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(client_socket|server_socket)\.(send|sendall)$'
  - id: socket-send-method-short
    desc: Short Python socket send call
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(sock|socket)\.(send|sendall)\s*\('
  # Named socket variables are unconstrained in Python. Rather than treating
  # every `.send()` as network I/O, retain the narrow data-flow-shaped case
  # where a credential/environment mapping is the transmitted argument. The
  # exfiltration objective also requires socket construction and a proven
  # credential-keyword environment sweep.
  - id: python-send-environment-mapping
    desc: Sends named environment mapping
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.(send|sendall)\s*\(\s*(str\s*\(\s*)?(env_data|env_vars|secret_env|filtered_env)\b'

composite_rules:
  - id: socket-send-method
    desc: Python socket-like send call
    crit: notable
    conf: 0.85
    any:
      - id: socket-send-method-named
      - id: socket-send-method-short
