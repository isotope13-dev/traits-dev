defaults:
  platforms: [windows]
  for: [batch, powershell]
  crit: notable
  conf: 0.93

traits:
  - id: powershell-out-string-bytes
    desc: PowerShell converts formatted output to bytes
    crit: component
    if:
      type: text
      regex: '(?is)Out-String[\s\S]{0,100}\.GetBytes\s*\(\s*\$[A-Za-z_]\w{0,63}\s*\)'
  - id: powershell-stream-writes-byte-buffer
    desc: PowerShell writes byte buffers to stream
    crit: component
    if:
      type: text
      regex: '(?is)\.Write\s*\(\s*\$[A-Za-z_]\w{0,63}\s*,\s*0\s*,\s*\$[A-Za-z_]\w{0,63}\.Length\s*\)'

composite_rules:
  - id: powershell-tcp-output-stream
    desc: PowerShell sends formatted output over TCP
    crit: notable
    all:
      - id: micro-behaviors/process/io/stream::powershell-tcpclient-stream
      - id: powershell-out-string-bytes
      - id: powershell-stream-writes-byte-buffer
    near_bytes: 1500
