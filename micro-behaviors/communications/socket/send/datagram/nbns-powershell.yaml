defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: powershell-nbns-answer-send
    desc: Sends a constructed NBNS response packet
    if:
      type: text
      regex: '\.Send(To)?\(\s*\$NBNS_response_packet\s*,'

  - id: powershell-llmnr-answer-send
    desc: Sends a constructed LLMNR response packet
    if:
      type: text
      regex: '\.Send(To)?\(\s*\$LLMNR_response_packet\s*,'
