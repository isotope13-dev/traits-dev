---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.7
  attack: T1071
  mbc: C0001
traits:
- id: python-sendto
  desc: Python socket sendto() call
  if:
    type: text
    substr: ".sendto("
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: python-sendto-in-state-loop
  desc: Python sendto call inside while loop
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: "(?s)\\bwhile\\s+[A-Za-z_]\\w*(\\.[A-Za-z_]\\w*)?\\s*:\\s*.{0,320}\\.sendto\\s*\\("
