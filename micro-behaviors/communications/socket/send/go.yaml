defaults:
  platforms: [windows, unix]
  for: [go, elf]
  crit: notable
  conf: 0.92
  mbc: C0001

traits:
  - id: go-udp-connection-write
    desc: Go binary embeds the UDPConn.Write symbol text
    crit: baseline
    for: [elf, macho, pe]
    if:
      type: text
      exact: 'net.(*UDPConn).Write'
  - id: go-udp-connection-write-call
    desc: Go calls net.(*UDPConn).Write
    crit: notable
    for: [go]
    if:
      type: symbol
      kind: call
      exact: net.(*UDPConn).Write

  - id: go-packet-connection-write-to
    desc: Go packet connection send call
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.PacketConn\.WriteTo$'

  - id: go-conn-write-call
    desc: Go conn variable Write call
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: conn.Write
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: go-connection-write-call
    desc: Go connection variable Write call
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: connection.Write
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: go-client-write-call
    desc: Go client variable Write call
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: client.Write
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: go-socket-write-call
    desc: Go socket variable Write call
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: socket.Write
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: go-tcp-conn-write-call
    desc: Go TCP connection variable Write call
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: tcpConn.Write
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  - id: go-temp-conn-write-call
    desc: Go temporary connection variable Write call
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: tempConn.Write
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
