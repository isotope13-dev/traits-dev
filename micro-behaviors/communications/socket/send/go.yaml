defaults:
  platforms: [windows, unix]
  for: [go, elf]
  crit: notable
  conf: 0.92
  attack: T1071
  mbc: C0001

traits:
  - id: go-udp-connection-write
    desc: Go binary embeds the UDPConn.Write symbol text
    crit: baseline
    for: [elf, macho, pe]
    if:
      type: text
      exact: 'net.(*UDPConn).Write'
  - id: go-udp-connection-write-call
    desc: Go calls net.(*UDPConn).Write
    crit: notable
    for: [go]
    if:
      type: symbol
      kind: call
      exact: net.(*UDPConn).Write
