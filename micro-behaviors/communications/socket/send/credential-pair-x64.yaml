defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  # Two send(fd, credential-buffer, stored-byte-length, MSG_NOSIGNAL)
  # sites use the same record: user at +0 / length +16, password +8 / +17.
  # Only the call sites are claimed; the propagation objective adds protocol
  # and payload context. Addresses and relative call offsets are wildcarded.
  - id: x64-credential-pair-send-sites
    desc: Credential-pair buffer and length send sites
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '48 8B 43 18 8B 3B B9 00 40 00 00 0F B6 50 10 48 8B 30 E8 ?? ?? ?? ?? [50-90] 48 8B 43 18 8B 3B B9 00 40 00 00 0F B6 50 11 48 8B 70 08 E8 ?? ?? ?? ??'
