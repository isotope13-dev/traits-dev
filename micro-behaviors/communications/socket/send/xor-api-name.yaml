# Recovered from static string-decoder review. This matches an API name,
# not an invocation; the objective consumer supplies the attack context.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: xor-wsasend-name
    desc: XOR-masked WSASend API name
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule xor_wsasend_name {
          strings:
            $name = "\x57\x53\x41\x53\x65\x6e\x64" xor(0-255)
          condition:
            $name
        }
