traits:
- crit: notable
  for:
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
  id: syscall-sendto
  desc: Sends data on a socket
  conf: 0.4
  if:
    type: syscall
    name:
    - sendto
- id: x86-64-syscall-wrapper-sendto
  desc: Invokes sendto(44) via x86-64 syscall wrapper
  crit: notable
  conf: 0.92
  for: [elf]
  platforms: [linux]
  if:
    type: hex
    section: .text
    # uClibc-ng x86-64 sendto wrapper marshals 6 arguments and passes
    # __NR_sendto (0x2c) in edi to __syscall_cp / syscall().
    pattern: "48 83 EC 10 45 89 C9 49 89 F2 48 63 F7 41 51 BF 2C 00 00 00 4D 89 C1 4C 63 C1 48 89 D1 4C 89 D2 E8"
