defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  # Writes back over the same connected socket, directly or through the
  # file object makefile() wraps around it.
  - id: python-connected-socket-write
    desc: Writes to a connected Python socket
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.(write|send|sendall)$'
      receiver:
        from:
          call: '^_?socket\.(create_connection|socket)$'
          through:
            - call: '\.makefile$'
              receiver: true
