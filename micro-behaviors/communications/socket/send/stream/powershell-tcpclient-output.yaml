---
defaults:
  platforms:
  - windows
  for:
  - batch
  - powershell
  crit: notable
  conf: 0.93
composite_rules:
- id: powershell-tcp-output-stream
  desc: PowerShell sends formatted output over TCP
  crit: notable
  all:
  - id: micro-behaviors/communications/socket/tcp::powershell-tcpclient-stream
  - id: micro-behaviors/data/encode/charset::powershell-out-string-bytes
  - id: micro-behaviors/data/stream/write::powershell-stream-writes-byte-buffer
  near_bytes: 1500
