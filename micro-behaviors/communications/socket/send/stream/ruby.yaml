defaults:
  crit: notable
  platforms: [windows, unix]
  for: [ruby]
  attack: T1071
  mbc: C0001
traits:
  - id: ruby-socket-write-call
    desc: Ruby socket write call
    conf: 0.8
    if:
      type: text
      regex: '\b(sock|socket)\.write\s*\('
  - id: ruby-copy-stream-to-socket
    desc: Ruby copies a stream to a socket
    conf: 0.85
    if:
      type: text
      regex: 'IO\.copy_stream\s*\(\s*\w{1,40}\s*,\s*(sock|socket|tcpsocket)\s*\)'
