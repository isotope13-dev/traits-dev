---
defaults:
  platforms:
  - windows
  - unix
  for:
  - go
  - elf
  crit: notable
  conf: 0.92
  mbc: C0001
traits:
- id: go-conn-write-call
  desc: Go conn variable Write call
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: conn.Write
- id: go-connection-write-call
  desc: Go connection variable Write call
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: connection.Write
- id: go-client-write-call
  desc: Go client variable Write call
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: client.Write
- id: go-socket-write-call
  desc: Go socket variable Write call
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: socket.Write
- id: go-tcp-conn-write-call
  desc: Go TCP connection variable Write call
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: tcpConn.Write
- id: go-temp-conn-write-call
  desc: Go temporary connection variable Write call
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: tempConn.Write
- id: go-fprintf-connection-write
  desc: Formatted write to a connection variable
  conf: 0.9
  if:
    type: text
    regex: "\\bfmt\\.Fprintf\\s*\\(\\s*(conn|client|c)\\s*,"
- id: go-connection-output-buffer-write
  desc: Connection Write passes an output buffer
  conf: 0.9
  if:
    type: text
    regex: "\\b(conn|client)\\.Write\\s*\\(\\s*(out|output)\\b"
- id: go-io-copy-output-into-connection
  desc: io.Copy streams output into a connection
  conf: 0.9
  if:
    type: text
    regex: "\\bio\\.Copy\\s*\\(\\s*(conn|client)\\s*,\\s*(out|stdout)\\b"
