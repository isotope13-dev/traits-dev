# Swift Network.framework socket send patterns
defaults:
  platforms: [macos, ios]
  for: [macho]
traits:
  - id: nwconnection-send-source
    desc: Swift source sends with NWConnection
    crit: notable
    conf: 0.9
    for: [swift]
    if:
      type: text
      regex: 'NWConnection[\s\S]{0,800}\b[A-Za-z_]\w*\.send\s*\('
  - id: nwconnection-send
    desc: Swift NWConnection send call
    crit: notable
    conf: 0.85
    mbc: "C0001"
    attack: "T1071"
    if:
      type: symbol
      regex: "NWConnection.{0,80}send"
