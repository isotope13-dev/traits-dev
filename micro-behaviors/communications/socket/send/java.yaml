defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin]
  attack: T1071
  mbc: C0001

traits:
  - id: java-output-stream-access
    desc: Java output stream access
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: getOutputStream
  - id: java-output-stream-write
    desc: Java output stream write sequence
    crit: notable
    conf: 0.85
    for: [java, class, kotlin, text]
    if:
      type: text
      regex: '(?s)getOutputStream\s*\(\)[^;\n]{0,240}\.write\s*\('
  - id: java-dataoutputstream-class
    desc: Java DataOutputStream class reference
    crit: component
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: import
      exact: java/io/DataOutputStream

composite_rules:
  - id: java-raw-socket-client-write
    desc: Java socket client writes request bytes through DataOutputStream
    crit: notable
    conf: 0.94
    for: [class, jar, zip]
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: java-dataoutputstream-class
      - id: micro-behaviors/data/buffer::jvm-outputstream-write
