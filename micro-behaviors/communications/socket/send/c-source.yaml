defaults:
  for: [c, cpp]
  platforms: [windows]
  mbc: C0001

traits:
  - id: source-keyed-frame-send
    desc: C source sends fixed-size keyed frame
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'memcpy\([^,]{1,40},\s*key,\s*32\)[\s\S]{0,80}send\([^,]{1,40},\s*[^,]{1,40},\s*40\s*,'

  - id: source-key-buffer-send
    desc: C source sends key-named buffer
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bsend\s*\([^,\r\n]{1,80},\s*[A-Za-z_][A-Za-z0-9_]*(key|xor)[A-Za-z0-9_]*\s*,'

  - id: source-send-call
    desc: C source sends socket data
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: send
