defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: python-local-socket-send
    desc: Send call on locally constructed Python socket
    if:
      type: tree-sitter
      query: |
        ((_ (expression_statement (assignment
          left: (identifier) @created
          right: (call function: (attribute object: (identifier) @module attribute: (identifier) @constructor))))
          . (expression_statement (call function: (attribute object: (identifier) @used attribute: (identifier) @method)))) @transmission
          (#eq? @module "socket")
          (#eq? @constructor "socket")
          (#eq? @created @used)
          (#match? @method "^send(all)?$")
        )
        ((_ (expression_statement (assignment
          left: (identifier) @created
          right: (call function: (attribute object: (identifier) @module attribute: (identifier) @constructor))))
          . (expression_statement (call function: (attribute object: (identifier) @connected attribute: (identifier) @connect)))
          . (expression_statement (call function: (attribute object: (identifier) @used attribute: (identifier) @method)))) @transmission
          (#eq? @module "socket")
          (#eq? @constructor "socket")
          (#eq? @created @connected)
          (#eq? @created @used)
          (#match? @connect "^connect(_ex)?$")
          (#match? @method "^send(all)?$")
        )
