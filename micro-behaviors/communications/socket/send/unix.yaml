defaults:
  mbc: C0001
  platforms: [linux, macos, windows]
  for: [elf, macho, c, cpp, python]
traits:
  - id: send-symbol
    desc: Uses send socket call
    crit: notable
    conf: 0.66
    # No Python: the symbol index records a receiver-qualified name for the
    # real socket API (`sock.send` -> "s.send"), so `exact: send` can never
    # match it.  What it does match is a *bare* callable named `send`, which in
    # Python is the ASGI application interface -- `async def __call__(self,
    # scope, receive, send)` then `await send({...})` -- plus generator/asyncio
    # `.send` shims. Python socket sends stay covered by python-sendall and
    # socket/receive::socket-data-transfer.
    for: [elf, macho, c, cpp]
    if:
      type: symbol
      exact: send
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/string/identity::chrome-sandbox-basename
  - id: sendmsg-symbol
    desc: Uses sendmsg socket call
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: sendmsg
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
      - id: metadata/file/string/identity::python3-interpreter-basename
  - id: sendto-symbol
    desc: Uses sendto socket call
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: sendto
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: sendto-libc-symbol
    desc: Uses static libc sendto alias
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: __libc_sendto
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: sendmmsg-symbol
    desc: Uses sendmmsg socket call
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: sendmmsg
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: sendfile-symbol
    desc: Uses sendfile socket call
    crit: notable
    conf: 0.66
    if:
      type: symbol
      regex: '(^|\.)sendfile$'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
composite_rules:
  - id: send
    desc: Send a message to a socket
    crit: notable
    conf: 0.66
    any:
      - id: send-symbol
      - id: sendmsg-symbol
      - id: sendto-symbol
      - id: sendto-libc-symbol
      - id: sendmmsg-symbol
      - id: sendfile-symbol
