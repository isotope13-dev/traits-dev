# C source-level connection-state mechanics. These are neutral capabilities;
# port-scan intent is inferred by the objective composite that references them.
defaults:
  platforms: [unix, android, ios]
  for: [c]
  crit: notable

traits:
  - id: eisconn-connect-state
    desc: Handles an already-connected socket
    conf: 0.8
    if:
      type: text
      word: EISCONN
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: ealready-connect-state
    desc: Handles an asynchronous connect state
    conf: 0.8
    if:
      type: text
      word: EALREADY
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: einprogress-connect-state
    desc: Handles a pending socket connection
    conf: 0.8
    if:
      type: text
      word: EINPROGRESS
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
