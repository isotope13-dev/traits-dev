# Linux PowerPC socketcall wrappers.
#
# 32-bit PowerPC Linux uses socketcall(2) for the legacy socket API.  Static
# malware often carries these wrappers after stripping all imports, so the
# syscall and operation setup must be recognized from instructions rather than
# symbol names.
defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
  arch: [powerpc]

traits:
- id: ppc-socketcall-syscall
  desc: PowerPC Linux socketcall syscall wrapper
  conf: 0.99
  if:
    type: hex
    section: ".text"
      # li r0, 0x66; sc -- Linux PowerPC socketcall(2).
    pattern: "38 00 00 66 44 00 00 02"

