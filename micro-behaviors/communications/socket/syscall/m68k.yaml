# Linux/m68k uses the legacy socketcall(2) multiplexer.  This instruction
# signature deliberately avoids section constraints so it also works on
# truncated ELFs whose section table cannot be parsed.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: m68k-socketcall-wrapper
    desc: Motorola 68000 Linux socketcall syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: hex
      offset_range: [64, null]
      # link; preserve d2; load two arguments; moveq #102,d0; trap #0
      pattern: "4E 56 FF F8 2F 02 20 6E 00 0C 22 6E 00 08 24 08 22 09 70 66 4E 40"
