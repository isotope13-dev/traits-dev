defaults:
  for: [elf, macho, pe]
  platforms:
    - unix
    - windows
traits:
  - id: syscall-socket
    desc: Creates network socket
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - socket
        - socketcall
  - id: syscall-bind
    desc: Binds socket to address/port
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - bind
  - id: syscall-listen
    desc: Listens for incoming connections
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - listen
  - id: syscall-accept
    desc: Accepts incoming connections
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - accept
        - accept4
  - id: syscall-sendto
    desc: Sends data on a socket
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - sendto
composite_rules:
  # Was `server-comp`, described as "Network server - binds and" -- a sentence
  # that stops mid-clause, which is what a triager actually read in the output.
  - id: linux-network-server
    desc: Network server binds and listens
    conf: 0.6
    crit: notable
    for: [elf]
    platforms:
      - linux
    all:
      - id: syscall-socket
      - id: syscall-bind
      - id: syscall-listen
  - id: server-accept
    desc: Network server accepting connections
    conf: 0.6
    crit: notable
    for: [elf]
    platforms:
      - linux
    all:
      - id: syscall-socket
      - id: syscall-bind
      - id: syscall-listen
      - id: syscall-accept
