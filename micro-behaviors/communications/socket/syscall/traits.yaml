defaults:
  for: [elf, macho, pe]
  platforms:
    - unix
    - windows
traits:
  - id: syscall-socket
    desc: Creates network socket
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - socket
        - socketcall
  - id: syscall-bind
    desc: Binds socket to address/port
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - bind
  - id: syscall-listen
    desc: Listens for incoming connections
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - listen
  - id: syscall-accept
    desc: Accepts incoming connections
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - accept
        - accept4
  - id: syscall-sendto
    desc: Sends data on a socket
    crit: notable
    conf: 0.4
    if:
      type: syscall
      name:
        - sendto
  # Direct socket() in the AF_PACKET domain (domain arg == 17) creating a raw
  # socket (type arg low bits == SOCK_RAW, 3). This is link-layer packet capture
  # / injection — sniffers and traffic-manipulation tooling — and needs
  # CAP_NET_RAW, so it is rare and privileged in ordinary software. Both args are
  # matched on the same call.
  - id: syscall-socket-raw-packet
    desc: Opens a raw AF_PACKET socket
    crit: suspicious
    conf: 0.85
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [socket]
      # domain (arg 0) == AF_PACKET (17); type (arg 1) has SOCK_RAW (3) bits.
      args:
        - { index: 0, value: 17 }
        - { index: 1, mask: 3 }
composite_rules:
  - id: server-comp
    desc: Network server - binds and
    conf: 0.6
    crit: notable
    for: [elf]
    platforms:
      - linux
    all:
      - id: syscall-socket
      - id: syscall-bind
      - id: syscall-listen
  - id: server-accept
    desc: Network server accepting connections
    conf: 0.6
    crit: notable
    for: [elf]
    platforms:
      - linux
    all:
      - id: syscall-socket
      - id: syscall-bind
      - id: syscall-listen
      - id: syscall-accept
