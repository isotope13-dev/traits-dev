defaults:
  crit: notable
  for:
  - elf
  - macho
  - pe
  platforms:
  - unix
  - windows
traits:
- id: syscall-accept
  desc: Accepts incoming connections
  conf: 0.4
  if:
    type: syscall
    name:
    - accept
    - accept4
composite_rules:
- id: server-accept
  desc: Network server accepting connections
  conf: 0.6
  for:
  - elf
  platforms:
  - linux
  all:
  - id: micro-behaviors/communications/socket/create::socket-create
  - id: micro-behaviors/communications/socket/bind/function::syscall-bind
  - id: micro-behaviors/communications/socket/listen::syscall-listen
  - id: syscall-accept
