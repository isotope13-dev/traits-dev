# Linux/SPARC uses the legacy socketcall(2) multiplexer, syscall 102 (0x66),
# entered with `ta 0x10`. The instruction pattern matches the mov 0x66,%g1
# and the trap, without section constraints so truncated ELFs still report it.
defaults:
  conf: 0.95
  platforms: [linux]
  for: [elf]
  arch: [sparc]
  crit: notable

traits:
  - id: sparc-socketcall-wrapper
    desc: SPARC Linux socketcall syscall wrapper
    if:
      type: hex
      offset_range: [64, null]
      # mov 0x66, %g1; ...; ta 0x10
      pattern: "82 10 20 66 [0-16] 91 D0 20 10"
