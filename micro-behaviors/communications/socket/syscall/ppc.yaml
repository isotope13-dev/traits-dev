# Linux PowerPC socketcall wrappers.
#
# 32-bit PowerPC Linux uses socketcall(2) for the legacy socket API.  Static
# malware often carries these wrappers after stripping all imports, so the
# syscall and operation setup must be recognized from instructions rather than
# symbol names.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [powerpc]

traits:
  - id: ppc-socketcall-syscall
    desc: PowerPC Linux socketcall syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      # li r0, 0x66; sc -- Linux PowerPC socketcall(2).
      pattern: "38 00 00 66 44 00 00 02"

  - id: ppc-socketcall-socket
    desc: PowerPC socketcall socket operation wrapper
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      # li r3, 1 followed by the socketcall argument vector and dispatch.
      pattern: "38 60 00 01 90 81 00 0c 38 81 00 08 90 01 00 24 90 a1 00 10 48 ?? ?? ?? ??"

  - id: ppc-socketcall-connect
    desc: PowerPC socketcall connect operation wrapper
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      # li r3, 3 followed by the socketcall argument vector and dispatch.
      pattern: "38 60 00 03 90 81 00 0c 38 81 00 08 90 01 00 24 90 a1 00 10 48 ?? ?? ?? ??"

  - id: ppc-socketcall-recv
    desc: PowerPC socketcall receive operation wrapper
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      # li r3, 10 followed by a four-argument socketcall vector and dispatch.
      pattern: "38 60 00 0a 90 81 00 0c 38 81 00 08 90 01 00 24 90 a1 00 10 90 c1 00 14 48 ?? ?? ?? ??"

  - id: ppc-sockaddr-port-53
    desc: PowerPC sockaddr construction for DNS port 53
    crit: notable
    conf: 0.95
    attack: T1071.004
    if:
      type: hex
      section: ".text"
      # Load AF_INET and port 53, then store them into sockaddr fields.
      pattern: "38 00 00 02 39 20 00 35 ?? ?? ?? ?? 91 61 00 30 ?? ?? ?? ?? ?? ?? ?? ?? b0 01 00 30 b1 21 00 32"

composite_rules:
  - id: ppc-socketcall-network-io
    desc: PowerPC socket/connect/receive socketcall sequence
    crit: notable
    conf: 0.99
    all:
      - id: ppc-socketcall-syscall
      - id: ppc-socketcall-socket
      - id: ppc-socketcall-connect
      - id: ppc-socketcall-recv
