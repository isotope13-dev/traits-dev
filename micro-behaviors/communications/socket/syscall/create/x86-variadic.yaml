# Three stack arguments copied into socketcall's argument vector.
defaults:
  for: [elf]
  platforms: [linux]
  arch: [x86]
  crit: notable

traits:
  - id: x86-socketcall-socket-wrapper
    desc: x86 socketcall socket operation wrapper
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: "83 EC 20 8B 44 24 24 89 44 24 14 8B 44 24 28 89 44 24 18 8B 44 24 2C 89 44 24 1C 8D 44 24 14 50 6A 01 6A 66 E8 ?? ?? ?? ?? 83 C4 2C C3"
