# Linux Nios II socket wrappers in statically linked ELF files.
#
# Nios II has no normalized architecture value in the current cleave facts, so
# these are instruction-level capability markers.  They identify the syscall
# wrapper itself; the composite is the meaningful socket client surface.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  crit: notable

traits:
- id: nios2-socket-syscall-wrapper
  desc: Nios II socket(2) syscall wrapper
  crit: notable
  if:
    type: hex
    section: ".text"
      # movi r2, 198; trap 0 (Linux Nios II socket syscall)
    pattern: "84 31 80 00 3A 68 3B 00"
