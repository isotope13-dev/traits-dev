# MIPS O32 socketcall wrappers used by statically linked native programs.
defaults:
  platforms: [unix, android]
  for: [elf]
  arch: [mips]
  crit: notable

traits:
- id: mips-socketcall-socket-be
  desc: Big-endian MIPS socketcall socket operation
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
      # socketcall(2) with operation 1 (SYS_SOCKET).
    pattern: "24 04 10 06 27 a6 00 18 03 20 f8 09 24 05 00 01"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-socketcall-socket-le
  desc: Little-endian MIPS socketcall socket operation
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
      # Little-endian encoding of socketcall(2) with SYS_SOCKET.
    pattern: "06 10 04 24 18 00 a6 27 09 f8 20 03 01 00 05 24"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-socket-syscall-be-sectionless
  desc: BE MIPS socket syscall, sectionless
  crit: notable
  conf: 0.95
  if:
    type: hex
    pattern: "24 02 10 57 00 00 00 0c"
    offset_range: [0, null]
  unless:
  - type: section
    exact: .text
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-socket-syscall-le-sectionless
  desc: LE MIPS socket syscall, sectionless
  crit: notable
  conf: 0.95
  if:
    type: hex
    pattern: "57 10 02 24 0C 00 00 00"
    offset_range: [0, null]
  unless:
  - type: section
    exact: .text
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-socket-call-be
  desc: Big-endian MIPS socket syscall wrapper call
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
    pattern: "24 04 10 57"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-socket-call-le
  desc: Little-endian MIPS socket syscall wrapper call
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
    pattern: "57 10 04 24"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
composite_rules:
- id: mips-socketcall-socket
  desc: MIPS socketcall socket operation
  crit: notable
  conf: 0.98
  any:
  - id: micro-behaviors/communications/socket/syscall/create::mips-socketcall-socket-be
  - id: micro-behaviors/communications/socket/syscall/create::mips-socketcall-socket-le
- id: mips-socket-operation
  desc: MIPS socket creation operation
  crit: notable
  conf: 0.99
  any:
  - id: micro-behaviors/communications/socket/syscall/create::mips-socketcall-socket
  - id: micro-behaviors/communications/socket/create::mips-direct-socket-syscall-be
  - id: micro-behaviors/communications/socket/create::mips-direct-socket-syscall-le
  - id: micro-behaviors/communications/socket/syscall/create::mips-direct-socket-syscall-be-sectionless
  - id: micro-behaviors/communications/socket/syscall/create::mips-direct-socket-syscall-le-sectionless
  - id: micro-behaviors/communications/socket/syscall/create::mips-direct-socket-call-be
  - id: micro-behaviors/communications/socket/syscall/create::mips-direct-socket-call-le
