# Linux PowerPC socketcall wrappers.
#
# 32-bit PowerPC Linux uses socketcall(2) for the legacy socket API.  Static
# malware often carries these wrappers after stripping all imports, so the
# syscall and operation setup must be recognized from instructions rather than
# symbol names.
defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
  arch: [powerpc]

traits:
- id: ppc-socketcall-socket
  desc: PowerPC socketcall socket operation wrapper
  conf: 0.98
  if:
    type: hex
    section: ".text"
      # li r3, 1 followed by the socketcall argument vector and dispatch.
    pattern: "38 60 00 01 90 81 00 0c 38 81 00 08 90 01 00 24 90 a1 00 10 48 ?? ?? ?? ??"

