# Linux ARC (ARCompact) socket wrappers in statically linked ELF files.
#
# ARC follows the asm-generic syscall table and enters the kernel with
# `mov r8, <nr>; trap0` (swi). Each atom is the number load plus trap pair
# for one socket call; the composite is the meaningful network client surface.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  crit: notable

traits:
- id: arc-sendto-syscall-wrapper
  desc: ARC sendto(2) syscall wrapper
  if:
    type: hex
    section: ".text"
      # mov r8, 206; trap0
    pattern: "8A 20 83 13 6F 22 3F 00"
- id: arc-recvfrom-syscall-wrapper
  desc: ARC recvfrom(2) syscall wrapper
  if:
    type: hex
    section: ".text"
      # mov r8, 207; trap0
    pattern: "8A 20 C3 13 6F 22 3F 00"

