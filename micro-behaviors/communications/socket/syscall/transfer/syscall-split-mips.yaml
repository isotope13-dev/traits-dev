# MIPS O32 direct sendto(2) syscalls in statically linked native programs.
# Sending a datagram is the transfer operation; socket creation and connect
# are classified in create/ and connect/.
defaults:
  platforms: [unix, android]
  for: [elf]
  arch: [mips]
  crit: notable

traits:
- id: mips-direct-sendto-be
  desc: Big-endian MIPS direct sendto syscall
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
    pattern: "24 02 10 54 00 00 00 0c"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-sendto-le
  desc: Little-endian MIPS direct sendto syscall
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
    pattern: "54 10 02 24 0C 00 00 00"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-sendto-be-sectionless
  desc: BE MIPS sendto syscall, sectionless
  crit: notable
  conf: 0.95
  if:
    type: hex
    pattern: "24 02 10 54 00 00 00 0c"
    offset_range: [0, null]
  unless:
  - type: section
    exact: .text
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-sendto-le-sectionless
  desc: LE MIPS sendto syscall, sectionless
  crit: notable
  conf: 0.95
  if:
    type: hex
    pattern: "54 10 02 24 0C 00 00 00"
    offset_range: [0, null]
  unless:
  - type: section
    exact: .text
  - type: metrics
    field: elf.parse_failed
    min: 1
composite_rules:
- id: mips-direct-sendto-operation
  desc: MIPS direct sendto syscall operation
  crit: notable
  conf: 0.98
  any:
  - id: mips-direct-sendto-be
  - id: mips-direct-sendto-le
  - id: mips-direct-sendto-be-sectionless
  - id: mips-direct-sendto-le-sectionless
