# ARM Direct Network Syscalls
# Detects hand-written ARM assembly making direct network syscalls
# Unknown disassembler architectures do not prove ARM. Keep the architecture
# gate explicit on each atom and reject a known non-ARM elf.machine value.
# The exclusion regex accepts every nonempty machine name except exactly arm.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable
traits:
- id: arm-oabi-direct-send
  desc: ARM OABI direct send(2) SVC instruction
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
    pattern: "21 01 90 EF"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: arm-oabi-direct-recv
  desc: ARM OABI direct recv(2) SVC instruction
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
    pattern: "23 01 90 EF"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: arm-oabi-direct-sendto
  desc: ARM OABI direct sendto(2) SVC instruction
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
    pattern: "22 01 90 EF"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: arm-oabi-direct-recvfrom
  desc: ARM OABI direct recvfrom(2) SVC instruction
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
    pattern: "24 01 90 EF"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
