# Linux AArch64 (ARM64) direct socket syscall wrappers in statically linked ELF files.
#
# AArch64 follows the asm-generic syscall table (socket=198, connect=203,
# sendto=206, recvfrom=207) and enters the kernel via `svc #0`. The syscall
# number is loaded into w8 (32-bit: opcode 52) or x8 (64-bit: opcode D2).
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  arch: [aarch64]
  crit: notable

traits:
  - id: aarch64-connect-syscall-wrapper
    desc: AArch64 connect(2) syscall wrapper
    if:
      type: hex
      offset_range: [0, null]
      # mov w8/x8, 203 (0xcb); ...; svc 0
      pattern: "68 19 80 (52|D2) [0-16] 01 00 00 D4"

  - id: aarch64-sendto-syscall-wrapper
    desc: AArch64 sendto(2) syscall wrapper
    if:
      type: hex
      offset_range: [0, null]
      # mov w8/x8, 206 (0xce); ...; svc 0
      pattern: "C8 19 80 (52|D2) [0-16] 01 00 00 D4"

  - id: aarch64-recvfrom-syscall-wrapper
    desc: AArch64 recvfrom(2) syscall wrapper
    if:
      type: hex
      offset_range: [0, null]
      # mov w8/x8, 207 (0xcf); ...; svc 0
      pattern: "E8 19 80 (52|D2) [0-16] 01 00 00 D4"

composite_rules:
  - id: aarch64-direct-network-syscalls
    desc: AArch64 direct socket and connect syscalls
    crit: notable
    conf: 0.98
    arch: [aarch64]
    all:
      - id: micro-behaviors/communications/socket/create::aarch64-socket-syscall-wrapper
      - id: aarch64-connect-syscall-wrapper

  - id: aarch64-network-io-syscalls
    desc: AArch64 socket client with bidirectional network I/O
    crit: notable
    conf: 0.98
    arch: [aarch64]
    all:
      - id: micro-behaviors/communications/socket/create::aarch64-socket-syscall-wrapper
      - id: aarch64-connect-syscall-wrapper
      - id: aarch64-sendto-syscall-wrapper
      - id: aarch64-recvfrom-syscall-wrapper

  - id: aarch64-connect-send-recv-network-io
    desc: AArch64 direct connect with bidirectional network I/O
    # Statically linked runtimes (including FFmpeg) carry these wrappers.
    # Their combination establishes networking, without evasion or abuse.
    crit: notable
    conf: 0.97
    arch: [aarch64]
    all:
      - id: aarch64-connect-syscall-wrapper
      - id: aarch64-sendto-syscall-wrapper
      - id: aarch64-recvfrom-syscall-wrapper
