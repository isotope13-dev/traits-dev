# MIPS O32 socketcall wrappers used by statically linked native programs.
defaults:
  platforms: [unix, android]
  for: [elf]
  arch: [mips]
  crit: notable

composite_rules:
- id: mips-bind-operation
  desc: MIPS socket bind operation
  crit: notable
  conf: 0.99
  any:
  - id: micro-behaviors/communications/socket/bind/function::mips-direct-bind-syscall-be
  - id: micro-behaviors/communications/socket/bind/function::mips-direct-bind-syscall-le
- id: mips-listen-operation
  desc: MIPS socket listen operation
  crit: notable
  conf: 0.99
  any:
  - id: micro-behaviors/communications/socket/listen::mips-direct-listen-syscall-be
  - id: micro-behaviors/communications/socket/listen::mips-direct-listen-syscall-le
