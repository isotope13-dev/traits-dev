# ARM Direct Network Syscalls
# Detects hand-written ARM assembly making direct network syscalls
# Unknown disassembler architectures do not prove ARM. Keep the architecture
# gate explicit on each atom and reject a known non-ARM elf.machine value.
# The exclusion regex accepts every nonempty machine name except exactly arm.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable
traits:
- id: arm-eabi-bind
  desc: ARM EABI direct bind(2) wrapper
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
      # movw r7, 0x11a; svc 0 (Linux ARM EABI bind)
    pattern: "1a 71 00 e3 00 00 00 ef"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: arm-eabi-accept
  desc: ARM EABI direct accept(2) wrapper
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
      # movw r7, 0x11d; svc 0 (Linux ARM EABI accept)
    pattern: "1d 71 00 e3 00 00 00 ef"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: arm-oabi-direct-bind
  desc: ARM OABI direct bind(2) SVC instruction
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
    pattern: "1A 01 90 EF"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: arm-oabi-direct-listen
  desc: ARM OABI direct listen(2) SVC instruction
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
    pattern: "1C 01 90 EF"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
