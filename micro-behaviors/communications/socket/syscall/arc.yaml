# Linux ARC (ARCompact) socket wrappers in statically linked ELF files.
#
# ARC follows the asm-generic syscall table and enters the kernel with
# `mov r8, <nr>; trap0` (swi). Each atom is the number load plus trap pair
# for one socket call; the composite is the meaningful network client surface.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  crit: notable

traits:
  - id: arc-socket-syscall-wrapper
    desc: ARC socket(2) syscall wrapper
    if:
      type: hex
      section: ".text"
      # mov r8, 198; trap0
      pattern: "8A 20 83 11 6F 22 3F 00"
  - id: arc-connect-syscall-wrapper
    desc: ARC connect(2) syscall wrapper
    if:
      type: hex
      section: ".text"
      # mov r8, 203; trap0
      pattern: "8A 20 C3 12 6F 22 3F 00"
  - id: arc-sendto-syscall-wrapper
    desc: ARC sendto(2) syscall wrapper
    if:
      type: hex
      section: ".text"
      # mov r8, 206; trap0
      pattern: "8A 20 83 13 6F 22 3F 00"
  - id: arc-recvfrom-syscall-wrapper
    desc: ARC recvfrom(2) syscall wrapper
    if:
      type: hex
      section: ".text"
      # mov r8, 207; trap0
      pattern: "8A 20 C3 13 6F 22 3F 00"

composite_rules:
  - id: arc-network-io-syscalls
    desc: ARC socket client with bidirectional network I/O
    crit: notable
    all:
      - id: arc-socket-syscall-wrapper
      - id: arc-connect-syscall-wrapper
      - id: arc-sendto-syscall-wrapper
      - id: arc-recvfrom-syscall-wrapper
