# Linux PowerPC socketcall wrappers.
#
# 32-bit PowerPC Linux uses socketcall(2) for the legacy socket API.  Static
# malware often carries these wrappers after stripping all imports, so the
# syscall and operation setup must be recognized from instructions rather than
# symbol names.
defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
  arch: [powerpc]
composite_rules:
- id: ppc-socketcall-network-io
  desc: PowerPC socket/connect/receive socketcall sequence
  conf: 0.99
  all:
  - id: micro-behaviors/communications/socket/syscall/dispatch::ppc-socketcall-syscall
  - id: micro-behaviors/communications/socket/syscall/create::ppc-socketcall-socket
  - id: micro-behaviors/communications/socket/syscall/connect::ppc-socketcall-connect
  - id: micro-behaviors/communications/socket/syscall/transfer::ppc-socketcall-recv
