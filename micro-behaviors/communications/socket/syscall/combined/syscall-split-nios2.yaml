# Linux Nios II socket wrappers in statically linked ELF files.
#
# Nios II has no normalized architecture value in the current cleave facts, so
# these are instruction-level capability markers.  They identify the syscall
# wrapper itself; the composite is the meaningful socket client surface.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  crit: notable

composite_rules:
- id: nios2-network-io-syscalls
  desc: Nios II socket client with bidirectional network I/O
  crit: notable
  all:
  - id: micro-behaviors/communications/socket/syscall/create::nios2-socket-syscall-wrapper
  - id: micro-behaviors/communications/socket/syscall/connect::nios2-connect-syscall-wrapper
  - id: micro-behaviors/communications/socket/syscall/transfer::nios2-send-syscall-wrapper
  - id: micro-behaviors/communications/socket/syscall/transfer::nios2-recv-syscall-wrapper
