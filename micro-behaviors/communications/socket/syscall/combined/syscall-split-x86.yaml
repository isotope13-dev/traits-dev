defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
composite_rules:
- id: i386-socketcall-network-io
  desc: i386 socketcall socket, bind, and connect stubs coexist
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/socket/syscall/dispatch::i386-socketcall-wrapper
  - id: micro-behaviors/communications/socket/create::i386-socketcall-socket
  - id: micro-behaviors/communications/socket/bind/function::i386-socketcall-bind
  - id: micro-behaviors/communications/socket/connect/attempt::i386-socketcall-connect

- id: x86-64-direct-network-syscalls
  desc: x86-64 direct socket and connect syscalls
  crit: notable
  conf: 0.98
  arch: [x86-64]
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/socket/create::socket-create
  - id: micro-behaviors/communications/socket/connect/attempt::socket-connect
