defaults:
  conf: 0.9
  platforms: [linux, android]
  for: [elf]
composite_rules:
  - id: stripped-static-elf-direct-connect
    desc: Stripped static ELF with direct network syscalls
    crit: suspicious
    size_min: 100000
    all:
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: "metadata/binary/layout/strings::binary-strings-at-most-50"
    any:
      - id: micro-behaviors/communications/socket/syscall/combined::mips-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::arm-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::arm-oabi-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::arm-literal-pool-network-syscalls
