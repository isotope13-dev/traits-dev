# Linux ARC (ARCompact) socket wrappers in statically linked ELF files.
#
# ARC follows the asm-generic syscall table and enters the kernel with
# `mov r8, <nr>; trap0` (swi). Each atom is the number load plus trap pair
# for one socket call; the composite is the meaningful network client surface.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]
  crit: notable

composite_rules:
- id: arc-network-io-syscalls
  desc: ARC socket client with bidirectional network I/O
  crit: notable
  all:
  - id: micro-behaviors/communications/socket/syscall/create::arc-socket-syscall-wrapper
  - id: micro-behaviors/communications/socket/syscall/connect::arc-connect-syscall-wrapper
  - id: micro-behaviors/communications/socket/syscall/transfer::arc-sendto-syscall-wrapper
  - id: micro-behaviors/communications/socket/syscall/transfer::arc-recvfrom-syscall-wrapper
