# MIPS O32 socketcall wrappers used by statically linked native programs.
defaults:
  platforms: [unix, android]
  for: [elf]
  arch: [mips]
  crit: notable

traits:
- id: mips-socketcall-connect-be
  desc: Big-endian MIPS socketcall connect operation
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
      # socketcall(2) with operation 3 (SYS_CONNECT).
    pattern: "24 04 10 06 27 a6 00 18 03 20 f8 09 24 05 00 03"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-socketcall-connect-le
  desc: Little-endian MIPS socketcall connect operation
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
      # Little-endian encoding of socketcall(2) with SYS_CONNECT.
    pattern: "06 10 04 24 18 00 a6 27 09 f8 20 03 03 00 05 24"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-connect-syscall-be
  desc: Big-endian MIPS direct connect syscall
  crit: notable
  conf: 0.99
  if:
    type: hex
    section: ".text"
    pattern: "24 02 10 4A 00 00 00 0c"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-connect-syscall-le
  desc: Little-endian MIPS direct connect syscall
  crit: notable
  conf: 0.99
  if:
    type: hex
    section: ".text"
    pattern: "4A 10 02 24 0C 00 00 00"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-connect-syscall-be-sectionless
  desc: BE MIPS connect syscall, sectionless
  crit: notable
  conf: 0.95
  if:
    type: hex
    pattern: "24 02 10 4A 00 00 00 0c"
    offset_range: [0, null]
  unless:
  - type: section
    exact: .text
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-connect-syscall-le-sectionless
  desc: LE MIPS connect syscall, sectionless
  crit: notable
  conf: 0.95
  if:
    type: hex
    pattern: "4A 10 02 24 0C 00 00 00"
    offset_range: [0, null]
  unless:
  - type: section
    exact: .text
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-connect-call-be
  desc: Big-endian MIPS connect syscall wrapper call
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
    pattern: "24 04 10 4A"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-direct-connect-call-le
  desc: Little-endian MIPS connect syscall wrapper call
  crit: notable
  conf: 0.98
  if:
    type: hex
    section: ".text"
    pattern: "4A 10 04 24"
  unless:
  - type: metrics
    field: elf.parse_failed
    min: 1
composite_rules:
- id: mips-socketcall-connect
  desc: MIPS socketcall connect operation
  crit: notable
  conf: 0.98
  any:
  - id: micro-behaviors/communications/socket/syscall/connect::mips-socketcall-connect-be
  - id: micro-behaviors/communications/socket/syscall/connect::mips-socketcall-connect-le
- id: mips-connect-operation
  desc: MIPS remote socket connection operation
  crit: notable
  conf: 0.99
  any:
  - id: micro-behaviors/communications/socket/syscall/connect::mips-socketcall-connect
  - id: micro-behaviors/communications/socket/syscall/connect::mips-direct-connect-syscall-be
  - id: micro-behaviors/communications/socket/syscall/connect::mips-direct-connect-syscall-le
  - id: micro-behaviors/communications/socket/syscall/connect::mips-direct-connect-syscall-be-sectionless
  - id: micro-behaviors/communications/socket/syscall/connect::mips-direct-connect-syscall-le-sectionless
  - id: micro-behaviors/communications/socket/syscall/connect::mips-direct-connect-call-be
  - id: micro-behaviors/communications/socket/syscall/connect::mips-direct-connect-call-le
