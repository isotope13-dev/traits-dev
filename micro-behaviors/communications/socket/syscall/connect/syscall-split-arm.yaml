# ARM Direct Network Syscalls
# Detects hand-written ARM assembly making direct network syscalls
# Unknown disassembler architectures do not prove ARM. Keep the architecture
# gate explicit on each atom and reject a known non-ARM elf.machine value.
# The exclusion regex accepts every nonempty machine name except exactly arm.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable
traits:
- id: svc-connect
  desc: "ARM direct connect(2) syscall setup"
  crit: notable
  arch: [arm]
  if:
    type: hex
    section: ".text"
      # mov r7, 0x100; add r7, r7, 0x1b (27) -> r7 = 283 (connect)
    pattern: "01 7c a0 e3 1b 70 87 e2"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: svc-connect-mov-orr
  desc: ARM connect syscall mov-orr r7 setup
  crit: notable
  arch: [arm]
  if:
    type: hex
    section: ".text"
      # mov r7, #0x1b; orr r7, r7, #0x100 -> r7 = 283 (connect)
    pattern: "1b 70 a0 e3 01 7c 87 e3"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: svc-connect-sectionless
  desc: ARM connect syscall setup, sectionless ELF
  crit: notable
  conf: 0.95
  arch: [arm]
  if:
    type: hex
    pattern: "01 7c a0 e3 1b 70 87 e2"
    offset_range: [0, null]
  unless:
  - type: section
    exact: .text
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: svc-connect-mov-orr-sectionless
  desc: ARM connect mov-orr setup, sectionless ELF
  crit: notable
  conf: 0.95
  arch: [arm]
  if:
    type: hex
    pattern: "1b 70 a0 e3 01 7c 87 e3"
    offset_range: [0, null]
  unless:
  - type: section
    exact: .text
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: arm-oabi-socketcall-connect
  desc: ARM OABI socketcall connect wrapper
  crit: notable
  conf: 0.98
  arch: [arm]
  if:
    type: hex
    section: ".text"
      # OABI socketcall(2), operation 3 (connect), with the syscall number
      # loaded as 0x900066 and dispatched through an indirect branch.
    pattern: "04 E0 2D E5 0C D0 4D E2 07 00 8D E8 03 10 A0 E3 0D 20 A0 E1 08 00 9F E5 ?? ?? ?? EB 0C D0 8D E2 00 80 BD E8
      66 00 90 00"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
- id: arm-oabi-direct-connect
  desc: ARM OABI direct connect(2) SVC instruction
  crit: notable
  conf: 0.99
  arch: [arm]
  if:
    type: hex
    section: ".text"
    pattern: "1B 01 90 EF"
  unless:
  - type: value
    path: elf.machine
    regex: '^(?:[^a].*|a(?:[^r].*)?|ar(?:[^m].*)?|arm.+)$'
composite_rules:
- id: arm-connect-syscall-setup
  desc: ARM SYS_connect register setup sequence
  crit: notable
  conf: 0.98
  arch: [arm]
  any:
  - id: micro-behaviors/communications/socket/syscall/connect::svc-connect
  - id: micro-behaviors/communications/socket/syscall/connect::svc-connect-mov-orr
  - id: micro-behaviors/communications/socket/syscall/connect::svc-connect-sectionless
  - id: micro-behaviors/communications/socket/syscall/connect::svc-connect-mov-orr-sectionless
