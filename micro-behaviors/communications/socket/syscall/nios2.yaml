# Linux Nios II socket wrappers in statically linked ELF files.
#
# Nios II has no normalized architecture value in the current cleave facts, so
# these are instruction-level capability markers.  They identify the syscall
# wrapper itself; the composite is the meaningful socket client surface.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable

traits:
  - id: nios2-socket-syscall-wrapper
    desc: Nios II socket(2) syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      # movi r2, 198; trap 0 (Linux Nios II socket syscall)
      pattern: "84 31 80 00 3A 68 3B 00"
  - id: nios2-connect-syscall-wrapper
    desc: Nios II connect(2) syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      # movi r2, 203; trap 0 (Linux Nios II connect syscall)
      pattern: "C4 32 80 00 3A 68 3B 00"
  - id: nios2-send-syscall-wrapper
    desc: Nios II send(2) syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      # movi r2, 206; trap 0 (Linux Nios II send syscall)
      pattern: "84 33 80 00 3A 68 3B 00"
  - id: nios2-recv-syscall-wrapper
    desc: Nios II recv(2) syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      # movi r2, 207; trap 0 (Linux Nios II recv syscall)
      pattern: "C4 33 80 00 3A 68 3B 00"

composite_rules:
  - id: nios2-network-io-syscalls
    desc: Nios II socket client with bidirectional network I/O
    crit: notable
    conf: 0.99
    all:
      - id: nios2-socket-syscall-wrapper
      - id: nios2-connect-syscall-wrapper
      - id: nios2-send-syscall-wrapper
      - id: nios2-recv-syscall-wrapper
