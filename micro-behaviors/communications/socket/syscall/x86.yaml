defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]

traits:
  - id: i386-socketcall-wrapper
    desc: Linux i386 socketcall syscall wrapper
    crit: notable
    conf: 0.95
    if:
      type: hex
      offset_range: [0, null]
      pattern: "B8 66 00 00 00 CD 80"

  - id: i386-socketcall-socket
    desc: i386 socketcall socket operation dispatch
    crit: notable
    conf: 0.95
    if:
      type: hex
      offset_range: [0, null]
      # push SYS_SOCKET (1); call socketcall(2) stub.
      pattern: "6A 01 E8 ?? ?? ?? ??"

  - id: i386-socketcall-bind
    desc: i386 socketcall bind operation dispatch
    crit: notable
    conf: 0.95
    if:
      type: hex
      offset_range: [0, null]
      pattern: "6A 02 E8 ?? ?? ?? ??"

  - id: i386-socketcall-connect
    desc: i386 socketcall connect operation dispatch
    crit: notable
    conf: 0.95
    if:
      type: hex
      offset_range: [0, null]
      pattern: "6A 03 E8 ?? ?? ?? ??"

# Constants 41/42 in EAX/EDI are not syscalls. Use canonical matchers
# requiring decoded syscall instructions instead of duplicate constant atoms.
composite_rules:
  - id: i386-socketcall-network-io
    desc: i386 socketcall socket, bind, and connect stubs coexist
    crit: notable
    conf: 0.98
    all:
      - id: i386-socketcall-wrapper
      - id: i386-socketcall-socket
      - id: i386-socketcall-bind
      - id: i386-socketcall-connect

  - id: x86-64-direct-network-syscalls
    desc: x86-64 direct socket and connect syscalls
    crit: notable
    conf: 0.98
    arch: [x86-64]
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/socket/create::socket-create
      - id: micro-behaviors/communications/socket/connect::socket-connect
