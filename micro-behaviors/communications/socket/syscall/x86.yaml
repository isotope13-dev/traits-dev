defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]

traits:
  - id: i386-socketcall-wrapper
    desc: Linux i386 socketcall syscall wrapper
    crit: notable
    conf: 0.95
    if:
      type: hex
      offset_range: [0, null]
      pattern: "B8 66 00 00 00 CD 80"

  - id: x86-64-direct-socket-call
    desc: x86-64 direct socket syscall instruction
    crit: notable
    conf: 0.95
    arch: [x86-64]
    if:
      type: hex
      section: ".text"
      pattern: "(b8|bf) 29 00 00 00"

  - id: x86-64-direct-connect-call
    desc: x86-64 direct connect syscall instruction
    crit: notable
    conf: 0.95
    arch: [x86-64]
    if:
      type: hex
      section: ".text"
      pattern: "(b8|bf) 2a 00 00 00"

composite_rules:
  - id: x86-64-direct-network-syscalls
    desc: x86-64 direct socket and connect syscalls
    crit: notable
    conf: 0.98
    arch: [x86-64]
    near_bytes: 8192
    all:
      - id: x86-64-direct-socket-call
      - id: x86-64-direct-connect-call
