# MIPS O32 socketcall wrappers used by statically linked native programs.
defaults:
  platforms: [unix, android]
  for: [elf]
  arch: [mips]
  crit: notable

traits:
  - id: mips-socketcall-socket-be
    desc: Big-endian MIPS socketcall socket operation
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      # socketcall(2) with operation 1 (SYS_SOCKET).
      pattern: "24 04 10 06 27 a6 00 18 03 20 f8 09 24 05 00 01"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-socketcall-socket-le
    desc: Little-endian MIPS socketcall socket operation
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      # Little-endian encoding of socketcall(2) with SYS_SOCKET.
      pattern: "06 10 04 24 18 00 a6 27 09 f8 20 03 01 00 05 24"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-socketcall-connect-be
    desc: Big-endian MIPS socketcall connect operation
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      # socketcall(2) with operation 3 (SYS_CONNECT).
      pattern: "24 04 10 06 27 a6 00 18 03 20 f8 09 24 05 00 03"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-socketcall-connect-le
    desc: Little-endian MIPS socketcall connect operation
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      # Little-endian encoding of socketcall(2) with SYS_CONNECT.
      pattern: "06 10 04 24 18 00 a6 27 09 f8 20 03 03 00 05 24"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-socket-syscall-be
    desc: Big-endian MIPS direct socket syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "24 02 10 57 00 00 00 0c"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-socket-syscall-le
    desc: Little-endian MIPS direct socket syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "57 10 02 24 0C 00 00 00"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-connect-syscall-be
    desc: Big-endian MIPS direct connect syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "24 02 10 4A 00 00 00 0c"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-connect-syscall-le
    desc: Little-endian MIPS direct connect syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "4A 10 02 24 0C 00 00 00"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-bind-syscall-be
    desc: Big-endian MIPS direct bind syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      # li v0, 4169 (O32 SYS_bind); syscall
      pattern: "24 02 10 49 00 00 00 0C"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-bind-syscall-le
    desc: Little-endian MIPS direct bind syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "49 10 02 24 0C 00 00 00"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-listen-syscall-be
    desc: Big-endian MIPS direct listen syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      # li v0, 4174 (O32 SYS_listen); syscall
      pattern: "24 02 10 4E 00 00 00 0C"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-listen-syscall-le
    desc: Little-endian MIPS direct listen syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "4E 10 02 24 0C 00 00 00"
    unless:
      - type: metrics
        field: elf.parse_failed
        min: 1
  # Sectionless ELF files have no `.text` metadata, so retain raw forms for
  # the same operations. The full li/syscall sequences are exact instruction
  # encodings, uncommon outside the syscall wrapper table that emits them.
  - id: mips-direct-socket-syscall-be-sectionless
    desc: BE MIPS socket syscall, sectionless
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "24 02 10 57 00 00 00 0c"
      offset_range: [0, null]
    unless:
      - type: section
        exact: .text
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-socket-syscall-le-sectionless
    desc: LE MIPS socket syscall, sectionless
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "57 10 02 24 0C 00 00 00"
      offset_range: [0, null]
    unless:
      - type: section
        exact: .text
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-connect-syscall-be-sectionless
    desc: BE MIPS connect syscall, sectionless
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "24 02 10 4A 00 00 00 0c"
      offset_range: [0, null]
    unless:
      - type: section
        exact: .text
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-connect-syscall-le-sectionless
    desc: LE MIPS connect syscall, sectionless
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "4A 10 02 24 0C 00 00 00"
      offset_range: [0, null]
    unless:
      - type: section
        exact: .text
      - type: metrics
        field: elf.parse_failed
        min: 1
composite_rules:
  - id: mips-socketcall-socket
    desc: MIPS socketcall socket operation
    crit: notable
    conf: 0.98
    any:
      - id: mips-socketcall-socket-be
      - id: mips-socketcall-socket-le
  - id: mips-socketcall-connect
    desc: MIPS socketcall connect operation
    crit: notable
    conf: 0.98
    any:
      - id: mips-socketcall-connect-be
      - id: mips-socketcall-connect-le
  - id: mips-socket-operation
    desc: MIPS socket creation operation
    crit: notable
    conf: 0.99
    any:
      - id: mips-socketcall-socket
      - id: mips-direct-socket-syscall-be
      - id: mips-direct-socket-syscall-le
      - id: mips-direct-socket-syscall-be-sectionless
      - id: mips-direct-socket-syscall-le-sectionless
  - id: mips-connect-operation
    desc: MIPS remote socket connection operation
    crit: notable
    conf: 0.99
    any:
      - id: mips-socketcall-connect
      - id: mips-direct-connect-syscall-be
      - id: mips-direct-connect-syscall-le
      - id: mips-direct-connect-syscall-be-sectionless
      - id: mips-direct-connect-syscall-le-sectionless
  - id: mips-bind-operation
    desc: MIPS socket bind operation
    crit: notable
    conf: 0.99
    any:
      - id: mips-direct-bind-syscall-be
      - id: mips-direct-bind-syscall-le
  - id: mips-listen-operation
    desc: MIPS socket listen operation
    crit: notable
    conf: 0.99
    any:
      - id: mips-direct-listen-syscall-be
      - id: mips-direct-listen-syscall-le
  - id: mips-direct-network-syscalls
    desc: MIPS direct socket and connect syscalls
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/syscall/raw::mips-direct-syscall-instruction
      - id: mips-socket-operation
      - id: mips-connect-operation
