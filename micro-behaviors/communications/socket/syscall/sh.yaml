# Linux/SuperH uses the legacy socketcall(2) multiplexer, syscall 102, entered
# with `trapa #0x12` (three arguments). The instruction pair is matched
# without section constraints so truncated ELFs still report it.
defaults:
  conf: 0.95
  platforms: [linux]
  for: [elf]
  crit: notable

traits:
  - id: sh-socketcall-wrapper
    desc: SuperH Linux socketcall syscall wrapper
    if:
      type: hex
      offset_range: [64, null]
      # mov #102,r3; ...; trapa #18
      pattern: "66 E3 [0-8] 12 C3"
