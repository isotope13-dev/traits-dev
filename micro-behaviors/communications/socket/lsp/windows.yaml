# Winsock 2 Layered Service Provider (LSP) configuration APIs. Legitimate
# firewall/VPN clients use these; adware families such as Sendori install a
# provider DLL to intercept name resolution and TCP/UDP traffic.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: wsc-install-provider
    desc: Winsock LSP provider install API
    if:
      type: symbol
      regex: '^WSCInstallProvider(64_32)?$'

  - id: wsc-deinstall-provider
    desc: Winsock LSP provider removal API
    if:
      type: symbol
      regex: '^WSCDeinstallProvider(32)?$'

  - id: wsc-write-provider-order
    desc: Winsock LSP provider order write API
    if:
      type: symbol
      regex: '^WSCWriteProviderOrder(32)?$'

  - id: wsc-enum-protocols
    desc: Winsock LSP protocol enumeration API
    if:
      type: symbol
      regex: '^WSCEnumProtocols(32)?$'

  - id: wsc-get-provider-path
    desc: Winsock LSP provider path query API
    if:
      type: symbol
      exact: WSCGetProviderPath

  - id: winsock2-parameters-registry-key
    desc: WinSock2 Parameters registry key path
    if:
      type: text
      regex: '(?i)SYSTEM\\CurrentControlSet\\Services\\WinSock2\\Parameters'
