defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.93
composite_rules:
- id: lsp-enum-with-winexec
  desc: LSP enumeration with WinExec clue
  all:
  - id: micro-behaviors/process/create/exec::winexec
  - id: micro-behaviors/communications/socket/lsp::wsc-enum-protocols
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib/
  crit: notable
- id: lsp-path-with-winexec
  desc: LSP path query with WinExec clue
  all:
  - id: micro-behaviors/process/create/exec::winexec
  - id: micro-behaviors/communications/socket/lsp::wsc-get-provider-path
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib/
  crit: notable
- id: lsp-connect-with-winexec
  desc: LSP enumeration, connect, and WinExec clues
  all:
  - id: micro-behaviors/process/create/exec::winexec
  - id: micro-behaviors/communications/socket/init::connect-api
  - id: micro-behaviors/communications/socket/lsp::wsc-enum-protocols
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib/
  crit: notable
