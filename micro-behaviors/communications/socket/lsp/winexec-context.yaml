defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.93
  crit: notable
composite_rules:
- id: lsp-enum-with-winexec
  desc: LSP enumeration with WinExec clue
  all:
  - id: metadata/binary/symbols/name/process::winexec
  - id: micro-behaviors/communications/socket/lsp::wsc-enum-protocols
  unless:
  - id: metadata/installer/product/
- id: lsp-path-with-winexec
  desc: LSP path query with WinExec clue
  all:
  - id: metadata/binary/symbols/name/process::winexec
  - id: micro-behaviors/communications/socket/lsp::wsc-get-provider-path
  unless:
  - id: metadata/installer/product/
- id: lsp-connect-with-winexec
  desc: LSP enumeration, connect, and WinExec clues
  all:
  - id: metadata/binary/symbols/name/process::winexec
  - id: micro-behaviors/communications/socket/connect/attempt::connect-api
  - id: micro-behaviors/communications/socket/lsp::wsc-enum-protocols
  unless:
  - id: metadata/installer/product/
