# Neutral Python socket-level TLS capability. Creating a context or wrapping a
# socket in one says the code speaks TLS, not whether it verifies: the default
# context verifies certificates and hostnames. Relocated out of
# communications/http/ssl, whose members are the verification-DISABLING forms
# and which the TLS-bypass objective references as a whole directory.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: python-ssl-default-context
    desc: Python creates a default TLS context
    if:
      type: symbol
      kind: call
      exact: ssl.create_default_context

  - id: python-ssl-context-wrap-socket
    desc: Wraps a socket in Python TLS context
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(context|ssl_context)\.wrap_socket$'
