# Neutral Python socket-level TLS capability. Creating a context or wrapping a
# socket in one says the code speaks TLS, not whether it verifies: the default
# context verifies certificates and hostnames. Relocated out of
# the retired communications/http/ssl leaf. Verification-disabling forms now
# live in communications/tls/verify/disable; ordinary context creation stays out.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: python-ssl-context-wrap-socket
    desc: Wraps a socket in Python TLS context
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(context|ssl_context)\.wrap_socket$'
