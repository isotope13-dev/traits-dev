defaults:
  for: [csharp, pe, dll]
  platforms: [windows]

traits:
  - id: dotnet-sslstream-type
    desc: .NET SslStream transport reference
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: SslStream

  - id: dotnet-server-certificate-validator
    desc: .NET server certificate validator callback
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: ValidateServerCertificate

composite_rules:
  - id: dotnet-custom-tls-certificate-validation
    desc: Custom .NET TLS certificate validation
    crit: notable
    conf: 0.97
    all:
      - id: dotnet-sslstream-type
      - id: dotnet-server-certificate-validator
