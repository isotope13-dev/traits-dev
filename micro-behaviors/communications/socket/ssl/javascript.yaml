# Node.js TLS socket client primitives.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88
  mbc: C0001

traits:
  - id: javascript-empty-java-server-trust
    desc: JavaScript defines an empty Java TLS verifier
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'checkServerTrusted\s*:\s*function\s*\([^)]{0,60}\)\s*\{\s*\}'

  - id: node-check-server-identity-callback
    desc: Configures a TLS server-identity callback
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      substr: checkServerIdentity
