# Node.js TLS socket client primitives.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88
  mbc: C0001

traits:
  - id: node-check-server-identity-callback
    desc: Configures a TLS server-identity callback
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      substr: checkServerIdentity
