# Node.js TLS socket client primitives.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88
  mbc: C0001

traits:
  - id: node-tls-connect
    desc: Node TLS module connects a socket
    if:
      type: symbol
      kind: call
      regex: '^(tls|import_tls[0-9]*\.default)\.connect$'
