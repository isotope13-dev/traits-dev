defaults:
  platforms: [windows, linux, macos]
traits:
  - id: jvm-sslcontext-trustmanager-init-call
    desc: JVM SSLContext.init trust-manager call
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: import
      exact: javax/net/ssl/SSLContext.init
  - id: jvm-trustmanager-class-ref
    desc: JVM TrustManager interface reference
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: import
      exact: javax/net/ssl/TrustManager
  - id: jvm-sslsocket-handshake-call
    desc: JVM SSLSocket.startHandshake call
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: import
      exact: javax/net/ssl/SSLSocket.startHandshake
  # A hand-built POST line written to an SSLSocket, not java.net.http.
  # The preamble is one string; the socket write is the send.
  - id: jvm-manual-http-post-preamble
    desc: Manual HTTP POST request preamble
    crit: notable
    conf: 0.93
    for: [class, java_class]
    platforms: [unix, windows]
    if:
      type: value
      path: class.strings[*]
      regex: 'POST [\s\S]{0,80}Content-Length:'
  # Setting the SNI list by hand overrides the name the JVM would otherwise
  # derive from the connect address. Clients that dial a host by raw IP need
  # this to reach a virtual host; so does code that wants the certificate name
  # and the destination address to disagree.
  - id: jvm-sslparameters-set-server-names
    desc: JVM sets TLS SNI server name
    crit: notable
    conf: 0.93
    for: [class, java_class]
    if:
      type: import
      exact: javax/net/ssl/SSLParameters.setServerNames
  - id: jvm-ssl-class-ref
    desc: JVM SSL package reference
    crit: baseline
    conf: 0.86
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^javax/net/ssl(/|$)'
  - id: jvm-x509trustmanager-class-ref
    desc: JVM X509 trust-manager interface reference
    crit: notable
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      exact: javax/net/ssl/X509TrustManager
    unless:
      - id: metadata/build/bundler/vscode::vscode-language-server-library-text

  - id: jvm-http-ignore-https-cert
    desc: JVM HTTP client skips HTTPS certificate checks
    crit: notable
    conf: 0.95
    for: [java, kotlin]
    platforms: [android]
    if:
      type: text
      word: ignoreHttpsCert

  # Implementing X509TrustManager is neutral: pinning managers, corporate-CA
  # managers, and trust-all bypasses all look like this. Whether validation is
  # actually weakened is decided by other evidence, so these stay capabilities.
  - id: jvm-x509trustmanager-server-callback
    desc: JVM checkServerTrusted callback defined
    crit: notable
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.strings[*]
      exact: checkServerTrusted
    unless:
      - id: metadata/build/bundler/vscode::vscode-language-server-library-text
  - id: jvm-x509trustmanager-issuer-callback
    desc: JVM getAcceptedIssuers callback defined
    crit: notable
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.strings[*]
      exact: getAcceptedIssuers
    unless:
      - id: metadata/build/bundler/vscode::vscode-language-server-library-text

  - id: ssl-connect-symbol
    desc: SSL connect API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSL_connect
  - id: go-tls-dial-text
    desc: Go binary embeds TLS dial client
    crit: notable
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: text
      exact: crypto/tls.Dial
  - id: ssl-read-symbol
    desc: OpenSSL SSL_read API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSL_read
  - id: ssl-write-symbol
    desc: OpenSSL SSL_write API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSL_write
  - id: openssl-ssl-session-function
    desc: OpenSSL SSL session function
    crit: notable
    conf: 0.7
    for: [c, elf]
    if:
      type: text
      regex: '\bSSL_(read|write|set_fd)\b'
  - id: openssl-ssl-connect-function
    desc: SSL_connect named, not linked
    crit: notable
    conf: 0.7
    for: [c, elf]
    if:
      type: text
      word: SSL_connect
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: ssl-connect-symbol
  - id: openssl-ssl-accept-function
    desc: OpenSSL SSL accept function
    crit: notable
    conf: 0.7
    for: [c, elf]
    if:
      type: text
      word: SSL_accept
  - id: openssl-server-certificate-file
    desc: OpenSSL TLS server certificate file API
    crit: notable
    conf: 0.86
    for: [c, cpp, elf, macho, pe, dll]
    if:
      type: symbol
      exact: SSL_CTX_use_certificate_file
  - id: openssl-server-private-key-file
    desc: OpenSSL TLS server private key API
    crit: notable
    conf: 0.86
    for: [c, cpp, elf, macho, pe, dll]
    if:
      type: symbol
      exact: SSL_CTX_use_PrivateKey_file
  - id: tls-openssl-unrecognized-name
    desc: OpenSSL unrecognized SNI alert
    crit: notable
    conf: 0.9
    for: [python, source, text]
    if:
      type: text
      substr: SSL_ERROR_UNRECOGNIZED_NAME_ALERT

  - id: tls-alert-description-unrecognized-name
    desc: TLS unrecognized-name alert description
    crit: notable
    conf: 0.9
    for: [python, source, text]
    if:
      type: text
      substr: ALERT_DESCRIPTION_UNRECOGNIZED_NAME

  - id: tls-unrecognized-name-token
    desc: TLS unrecognized-name token
    crit: notable
    conf: 0.86
    for: [python, source, text]
    if:
      type: text
      regex: '(?i)\bunrecognized_name\b'

  - id: nginx-ssl-reject-handshake
    desc: Nginx rejects unmatched SNI handshakes
    crit: notable
    conf: 0.92
    for: [shell, source, text]
    if:
      type: text
      regex: '(?im)^\s*ssl_reject_handshake\s+on\s*;'
  - id: tls-server-certificate-path
    desc: TLS server certificate file path
    crit: notable
    conf: 0.82
    for: [shell, python, javascript, c, cpp, elf, macho, pe]
    if:
      type: text
      regex: '(?i)(^|[/])server\.(crt|cer|pem)\b'
  - id: tls-server-private-key-path
    desc: TLS server private key file path
    crit: notable
    conf: 0.84
    for: [shell, python, javascript, c, cpp, elf, macho, pe]
    if:
      type: text
      regex: '(?i)(^|[/])server\.key\b'
  - id: gnutls-record-send-recv-source
    desc: GnuTLS record send or receive call
    crit: notable
    conf: 0.9
    for: [c, elf]
    if:
      type: text
      regex: \bgnutls_record_(send|recv)\b
  - id: cert-none
    desc: cert_reqs set to CERT_NONE (Python)
    crit: notable
    conf: 0.75
    for:
      - python
    if:
      type: text
      regex: \bcert_reqs\s*=\s*(ssl\.)?CERT_NONE\b
    unless:
      # Generated OpenAPI clients assign CERT_NONE only on the verify_ssl=false
      # branch beside CERT_REQUIRED — configuration, not an unconditional bypass.
      - id: metadata/lang/generated::openapi-generator-source-banner
  - id: reject-unauthorized-negated-flag
    desc: Node TLS check gated by negated flag
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\brejectUnauthorized\s*:\s*!\s*[A-Za-z_$]'
  # Node's TLS options are commonly driven by a named verification level
  # (`none` / `certificate` / `full`, as in Elasticsearch and Kibana configs).
  # The `certificate` level keeps chain validation on and only skips the
  # SAN/CN hostname check, so these two atoms mark a configured verification
  # level rather than a bypass.
  - id: tls-verification-mode-certificate-selector
    desc: Certificate-only TLS verification level
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '(case\s*|verificationMode\s*===\s*)[''"]certificate[''"]'
  # libpq names the certificate-only level `verify-ca` (hostname check skipped,
  # chain still verified); drivers mapping `sslmode` need the same selector as
  # the `verificationMode === 'certificate'` spelling. Literal spaces cover the
  # usual code styles.
  - id: libpq-verify-ca-mode-selector
    desc: libpq verify-ca TLS mode selected
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '(sslmode *===? *|case *)[''\"]verify-ca[''\"]'
  - id: reject-unauthorized-verification-mode-driven
    desc: rejectUnauthorized on or mode-bound
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\brejectUnauthorized\s*[:=]\s*(true\b|verificationMode)'
  - id: python-ssl-false
    desc: Python call passes ssl=False
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\.\w+\s*\([^)(]{0,240}\bssl\s*=\s*False\b'
  - id: python-verify-ssl-false
    desc: Python TLS verification disabled by config
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bverify_ssl\s*[:=]\s*False\b'
  - id: go-tls-client
    desc: Go crypto/tls client connection wrapper
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      exact: tls.Client
  - id: go-tls-dial
    desc: Opens Go TLS connection
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: tls.Dial
  - id: python-peer-certificate-fetch
    desc: Python fetches a TLS peer certificate
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      exact: tls.getpeercert
  - id: python-httpsconnection-sock-replacement
    desc: Python HTTPS connection socket replacement
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(HTTPSConnection|wrap_socket)[\s\S]{0,800}\b\w+\.sock\s*=\s*(None\w|[A-MO-Za-mo-z_]\w*)\b'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
composite_rules:
  - id: jvm-sslsocket-manual-http-post
    desc: SSLSocket writes a hand-built HTTP POST
    crit: notable
    conf: 0.95
    for: [class, java_class]
    platforms: [unix, windows]
    all:
      - id: jvm-sslsocket-handshake-call
      - id: jvm-manual-http-post-preamble
      - id: micro-behaviors/data/buffer/transfer::jvm-outputstream-write
  - id: tls-unrecognized-name-alert
    desc: Rejects TLS for unrecognized SNI
    crit: notable
    conf: 0.9
    for: [python, source, text]
    any:
      - id: tls-openssl-unrecognized-name
      - id: tls-alert-description-unrecognized-name
      - id: tls-unrecognized-name-token

  - id: openssl-ssl-functions
    desc: OpenSSL SSL session functions
    crit: notable
    conf: 0.7
    for: [c, elf]
    any:
      - id: openssl-ssl-session-function
      - id: openssl-ssl-connect-function
      - id: openssl-ssl-accept-function

  - id: tls-server-certificate
    desc: TLS certificate file API or path reference
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    any:
      - id: openssl-server-certificate-file
      - id: tls-server-certificate-path

  - id: tls-server-private-key
    desc: TLS private-key file API or path reference
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    any:
      - id: openssl-server-private-key-file
      - id: tls-server-private-key-path

  - id: tls-server-certificate-key-pair
    desc: TLS certificate and private-key file references
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    all:
      - id: tls-server-certificate
      - id: tls-server-private-key

  - id: verify-skip
    desc: Skip SSL certificate verification
    crit: notable
    conf: 0.66
    size_max: 10000
    any:
      - id: micro-behaviors/communications/tls/verify/disable::insecure-skip-verify
      - id: micro-behaviors/communications/tls/verify/disable::verify-mode-none
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
      - id: python-ssl-false
      - id: python-verify-ssl-false
  - id: jvm-custom-x509trustmanager
    desc: Class implements a custom X509 trust manager
    crit: notable
    conf: 0.95
    for: [class]
    all:
      - id: jvm-x509trustmanager-class-ref
      - id: jvm-x509trustmanager-server-callback
      - id: jvm-x509trustmanager-issuer-callback
  # A server-identity callback configured beside explicitly retained chain
  # validation (rejectUnauthorized: true, or bound to a verification mode) is
  # the certificate-only verification level: the SAN/CN hostname comparison is
  # what the callback downgrades, while the certificate chain is still checked.
  # This covers the named selector spellings (`verificationMode === 'certificate'`,
  # libpq `sslmode=verify-ca` — often reached through an extracted variable, so
  # no selector literal appears) and deployment-shaped stubs such as
  # IP-literal targets whose certificate carries no IP SAN. A stub without
  # retained chain validation nearby still stands on its own.
  - id: tls-certificate-only-verification-level
    desc: Configured certificate-only TLS verification level
    crit: exception
    conf: 0.9
    near_bytes: 1600
    all:
      - id: reject-unauthorized-verification-mode-driven
      - id: micro-behaviors/communications/socket/ssl::node-check-server-identity-callback
