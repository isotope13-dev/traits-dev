defaults:
  platforms: [windows, linux, macos]
traits:
  - id: jvm-sslcontext-trustmanager-init-call
    desc: JVM SSLContext.init trust-manager call
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: import
      exact: javax/net/ssl/SSLContext.init
  - id: jvm-trustmanager-class-ref
    desc: JVM TrustManager interface reference
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: import
      exact: javax/net/ssl/TrustManager
  - id: jvm-sslsocket-handshake-call
    desc: JVM SSLSocket.startHandshake call
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: import
      exact: javax/net/ssl/SSLSocket.startHandshake
  # Setting the SNI list by hand overrides the name the JVM would otherwise
  # derive from the connect address. Clients that dial a host by raw IP need
  # this to reach a virtual host; so does code that wants the certificate name
  # and the destination address to disagree.
  - id: jvm-sslparameters-set-server-names
    desc: JVM sets TLS SNI server name
    crit: notable
    conf: 0.93
    for: [class, java_class]
    if:
      type: import
      exact: javax/net/ssl/SSLParameters.setServerNames
  - id: jvm-ssl-class-ref
    desc: JVM SSL package reference
    crit: baseline
    conf: 0.86
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^javax/net/ssl(/|$)'
  - id: jvm-x509trustmanager-class-ref
    desc: JVM X509 trust-manager interface reference
    crit: notable
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      exact: javax/net/ssl/X509TrustManager
    unless:
      - type: text
        substr: language-server/lib

  - id: jvm-http-ignore-https-cert
    desc: JVM HTTP client skips HTTPS certificate checks
    crit: notable
    conf: 0.95
    for: [java, kotlin]
    platforms: [android]
    if:
      type: text
      word: ignoreHttpsCert

  # Implementing X509TrustManager is neutral: pinning managers, corporate-CA
  # managers, and trust-all bypasses all look like this. Whether validation is
  # actually weakened is decided by other evidence, so these stay capabilities.
  - id: jvm-x509trustmanager-server-callback
    desc: JVM checkServerTrusted callback defined
    crit: component
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: checkServerTrusted
    unless:
      - type: text
        substr: language-server/lib
  - id: jvm-x509trustmanager-issuer-callback
    desc: JVM getAcceptedIssuers callback defined
    crit: component
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: getAcceptedIssuers
    unless:
      - type: text
        substr: language-server/lib

  - id: ssl-connect-symbol
    desc: SSL connect API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSL_connect
  - id: go-tls-dial-text
    desc: Go binary embeds TLS dial client
    crit: notable
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: text
      exact: crypto/tls.Dial
  - id: ssl-new-symbol
    desc: SSL object creation API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSL_new
  - id: ssl-ctx-new-symbol
    desc: SSL context creation API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSL_CTX_new
  - id: tls-client-method-symbol
    desc: TLS client method API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: TLS_client_method
  - id: ssl-read-symbol
    desc: OpenSSL SSL_read API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSL_read
  - id: ssl-write-symbol
    desc: OpenSSL SSL_write API
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: SSL_write
  - id: openssl-ssl-session-function
    desc: OpenSSL SSL session function
    crit: notable
    conf: 0.7
    for: [c, elf]
    if:
      type: text
      regex: '\bSSL_(read|write|set_fd)\b'
  - id: openssl-ssl-connect-function
    desc: OpenSSL SSL connect function
    crit: notable
    conf: 0.7
    for: [c, elf]
    if:
      type: text
      word: SSL_connect
  - id: openssl-ssl-accept-function
    desc: OpenSSL SSL accept function
    crit: notable
    conf: 0.7
    for: [c, elf]
    if:
      type: text
      word: SSL_accept
  - id: openssl-server-certificate-file
    desc: OpenSSL TLS server certificate file API
    crit: notable
    conf: 0.86
    for: [c, cpp, elf, macho, pe, dll]
    if:
      type: symbol
      exact: SSL_CTX_use_certificate_file
  - id: openssl-server-private-key-file
    desc: OpenSSL TLS server private key API
    crit: notable
    conf: 0.86
    for: [c, cpp, elf, macho, pe, dll]
    if:
      type: symbol
      exact: SSL_CTX_use_PrivateKey_file
  - id: mbedtls-server-certificate-api
    desc: Mbed TLS certificate parsing API
    crit: notable
    conf: 0.86
    for: [c, cpp, elf, macho, pe, dll]
    if:
      type: symbol
      regex: '^mbedtls_x509_crt_parse(_file)?$'
  - id: mbedtls-server-private-key-api
    desc: Mbed TLS private key parsing API
    crit: notable
    conf: 0.86
    for: [c, cpp, elf, macho, pe, dll]
    if:
      type: symbol
      regex: '^mbedtls_pk_parse_key(_file)?$'
  - id: mbedtls-server-handshake
    desc: Mbed TLS handshake API
    crit: notable
    conf: 0.86
    for: [c, cpp, elf, macho, pe, dll]
    if:
      type: symbol
      exact: mbedtls_ssl_handshake

  - id: tls-openssl-unrecognized-name
    desc: OpenSSL unrecognized SNI alert
    crit: notable
    conf: 0.9
    for: [python, source, text]
    if:
      type: text
      substr: SSL_ERROR_UNRECOGNIZED_NAME_ALERT

  - id: tls-alert-description-unrecognized-name
    desc: TLS unrecognized-name alert description
    crit: notable
    conf: 0.9
    for: [python, source, text]
    if:
      type: text
      substr: ALERT_DESCRIPTION_UNRECOGNIZED_NAME

  - id: tls-unrecognized-name-token
    desc: TLS unrecognized-name token
    crit: notable
    conf: 0.86
    for: [python, source, text]
    if:
      type: text
      regex: '(?i)\bunrecognized_name\b'

  - id: nginx-ssl-reject-handshake
    desc: Nginx rejects unmatched SNI handshakes
    crit: suspicious
    conf: 0.92
    for: [shell, source, text]
    if:
      type: text
      regex: '(?im)^\s*ssl_reject_handshake\s+on\s*;'
  - id: tls-server-certificate-path
    desc: TLS server certificate file path
    crit: notable
    conf: 0.82
    for: [shell, python, javascript, c, cpp, elf, macho, pe]
    if:
      type: text
      regex: '(?i)(^|[/])server\.(crt|cer|pem)\b'
  - id: tls-server-private-key-path
    desc: TLS server private key file path
    crit: notable
    conf: 0.84
    for: [shell, python, javascript, c, cpp, elf, macho, pe]
    if:
      type: text
      regex: '(?i)(^|[/])server\.key\b'
  - id: gnutls-record-send-recv-source
    desc: GnuTLS record send or receive call
    crit: notable
    conf: 0.9
    for: [c, elf]
    if:
      type: text
      regex: \bgnutls_record_(send|recv)\b
  - id: nspr-io-functions
    desc: NSPR I/O function names
    crit: notable
    conf: 0.7
    for: [c, elf]
    platforms: [unix]
    if:
      type: text
      regex: \bPR_(Read|Write|Send|Recv)\b
  - id: insecure-skip-verify
    desc: TLS verification bypass configuration
    crit: notable
    conf: 0.8
    for:
      - go
      - pe
    if:
      type: text
      # A commented-out example is not an active TLS bypass.  Anchor the
      # field at the start of a Go source line so `// InsecureSkipVerify:
      # true` in documentation or dead code does not report execution.
      regex: '(?m)^[[:space:]]*(InsecureSkipVerify|skip_tls_verify)\s*[:=]\s*true\b'
  - id: cert-none
    desc: cert_reqs set to CERT_NONE (Python)
    crit: notable
    conf: 0.75
    for:
      - python
    if:
      type: text
      regex: \bcert_reqs\s*=\s*(ssl\.)?CERT_NONE\b
    unless:
      # Generated OpenAPI clients assign CERT_NONE only on the verify_ssl=false
      # branch beside CERT_REQUIRED — configuration, not an unconditional bypass.
      - id: metadata/lang/source::openapi-generator-source-banner
  - id: verify-mode-none
    desc: verify_mode = ssl.CERT_NONE (Python)
    crit: notable
    conf: 0.85
    for:
      - python
    if:
      type: text
      regex: '(?m)^[ \t]{0,40}([A-Za-z_][A-Za-z0-9_]*\.)?verify_mode\s*=\s*(ssl\.)?CERT_NONE\b'
  - id: check-hostname-false
    desc: check_hostname = False (Python)
    crit: notable
    conf: 0.85
    for:
      - python
    if:
      type: text
      regex: '(?m)^[ \t]{0,40}([A-Za-z_][A-Za-z0-9_]*\.)?check_hostname\s*=\s*False\b'
    unless:
      - type: string_literal
        substr: urllib3
      - type: string_literal
        substr: requests
      - type: string_literal
        substr: botocore
  - id: reject-unauthorized-false
    desc: Node TLS check disabled by option
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\brejectUnauthorized\s*:\s*(false|!1)\b'
  # Same certificate-verification switch, written as the negation of a flag
  # (`rejectUnauthorized: !insecure`, minified to `!e`). The literal-false rule
  # above misses it, which hides the bypass path in every bundled/minified
  # build. `!0` is excluded because it means true (verification kept on).
  - id: reject-unauthorized-negated-flag
    desc: Node TLS check gated by negated flag
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\brejectUnauthorized\s*:\s*!\s*[A-Za-z_$]'
  - id: python-ssl-false
    desc: Python call passes ssl=False
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\.\w+\s*\([^)]{0,240}\bssl\s*=\s*False\b'
  - id: python-verify-ssl-false
    desc: Python TLS verification disabled by config
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bverify_ssl\s*[:=]\s*False\b'
  - id: node-tls-verification-env-disable
    desc: Node TLS verification disabled via environment
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env.{0,40}NODE_TLS_REJECT_UNAUTHORIZED.{0,20}=\s*["'']?0'
  - id: go-tls-client
    desc: Go crypto/tls client connection wrapper
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      exact: tls.Client
  - id: go-tls-dial
    desc: Opens Go TLS connection
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: tls.Dial
  - id: domain-intel-skill-context
    desc: Domain intelligence skill context
    crit: component
    conf: 0.8
    for: [python]
    if:
      type: text
      substr: domain_intel
  - id: python-wrap-socket-server-hostname
    desc: Python TLS socket server_hostname
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: 'wrap_socket\s*\([^)\n]{0,160}\bserver_hostname\s*='
  - id: python-peer-certificate-fetch
    desc: Python fetches a TLS peer certificate
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      exact: tls.getpeercert
  - id: python-httpsconnection-sock-replacement
    desc: Python HTTPS connection socket replacement
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(HTTPSConnection|wrap_socket)[\s\S]{0,800}\b\w+\.sock\s*=\s*(None\w|[A-MO-Za-mo-z_]\w*)\b'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
composite_rules:
  - id: tls-unrecognized-name-alert
    desc: Rejects TLS for unrecognized SNI
    crit: notable
    conf: 0.9
    for: [python, source, text]
    any:
      - id: tls-openssl-unrecognized-name
      - id: tls-alert-description-unrecognized-name
      - id: tls-unrecognized-name-token

  - id: openssl-ssl-functions
    desc: OpenSSL SSL session functions
    crit: notable
    conf: 0.7
    for: [c, elf]
    any:
      - id: openssl-ssl-session-function
      - id: openssl-ssl-connect-function
      - id: openssl-ssl-accept-function

  - id: tls-server-certificate
    desc: TLS server certificate material
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    any:
      - id: openssl-server-certificate-file
      - id: mbedtls-server-certificate-api
      - id: tls-server-certificate-path

  - id: tls-server-private-key
    desc: TLS server private key material
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    any:
      - id: openssl-server-private-key-file
      - id: mbedtls-server-private-key-api
      - id: tls-server-private-key-path

  - id: tls-server-certificate-key-pair
    desc: TLS server certificate and private key material
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    all:
      - id: tls-server-certificate
      - id: tls-server-private-key

  - id: tls-server-handshake
    desc: TLS server handshake API
    crit: notable
    conf: 0.9
    for: [c, cpp, elf, macho, pe, dll]
    any:
      - id: openssl-ssl-accept-function
      - id: mbedtls-server-handshake

  - id: connect-comp
    desc: SSL/TLS connection
    crit: notable
    conf: 0.66
    for: [elf, macho, pe]
    any:
      - id: ssl-connect-symbol
      - id: ssl-new-symbol
      - id: ssl-ctx-new-symbol
      - id: tls-client-method-symbol
  - id: verify-skip
    desc: Skip SSL certificate verification
    crit: notable
    conf: 0.66
    size_max: 10000
    any:
      - id: insecure-skip-verify
      - id: verify-mode-none
      - id: reject-unauthorized-false
      - id: python-ssl-false
      - id: python-verify-ssl-false
  # Pair signal: when BOTH check_hostname and verify_mode are disabled
  # the TLS context accepts any cert from any host — leaves the connection
  # cryptographically authenticated only by the underlying socket destination.
  # This is the standard pattern for talking to a hardcoded IP while still
  # presenting an HTTPS-looking request.
  - id: tls-validation-fully-disabled
    desc: TLS hostname and certificate validation both disabled
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: check-hostname-false
      - id: verify-mode-none
    unless:
      - id: metadata/package/testing/
      - id: metadata/library/data::websocket-client-source
      - id: well-known/app/system/kagent::kagent-source-path
      - id: well-known/tool/detection/security-scanner/
      - id: domain-intel-skill-context
      - id: well-known/app/ai/litellm::litellm-package-path
      - id: well-known/tool/development/pymobiledevice3
      - id: well-known/lib/crypto/cheroot::cheroot-ssl-module
      - id: well-known/tool/development/lacelang-executor::http-timing-module
  # A class that implements X509TrustManager and defines both callbacks is
  # supplying its own certificate-trust decision. Neutral on its own: cert
  # pinning, private-CA validation, and trust-all bypasses share this shape.
  # Class-scoped: the interface reference and both callbacks must belong to one
  # class. At jar/zip scope an archive root pools them from unrelated members.
  - id: jvm-custom-x509trustmanager
    desc: Class implements a custom X509 trust manager
    crit: notable
    conf: 0.95
    for: [class]
    all:
      - id: jvm-x509trustmanager-class-ref
      - id: jvm-x509trustmanager-server-callback
      - id: jvm-x509trustmanager-issuer-callback
