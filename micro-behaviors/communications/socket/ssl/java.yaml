# Permissive TLS validation in Java/Kotlin source. Empty trust-manager
# callbacks and always-true hostname verifiers silently downgrade HTTPS;
# debug builds do this too, so intent comes from the surrounding channel.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin]

traits:
  - id: java-empty-trust-manager-source
    desc: Empty Java trust-manager callback
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'checkServerTrusted\s*\([^)]{0,60}\)\s*\{\s*\}'
  - id: java-allow-all-hostname-verifier
    desc: Always-true Java hostname verifier
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'verify\s*\(\s*String[^)]{0,80}\)\s*\{\s*return\s+true'
