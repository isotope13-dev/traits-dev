# Rustls certificate-verifier mechanics. Accepting every certificate is a
# risky transport capability, but does not by itself establish attacker intent;
# private test networks and explicitly trusted internal links also use it.
defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1553

traits:
  - id: rustls-server-cert-verifier-method
    desc: Rustls implements server cert verification
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'fn\s+verify_server_cert\s*\('

  - id: rustls-server-cert-assertion
    desc: Rustls returns cert verification assertion
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'ServerCertVerified::assertion\s*\(\s*\)'

composite_rules:
  - id: rustls-accept-all-server-verifier
    desc: Rustls verifier accepts every server certificate
    crit: suspicious
    conf: 0.99
    near_bytes: 1800
    all:
      - id: rustls-server-cert-verifier-method
      - id: rustls-server-cert-assertion
    unless:
      - id: well-known/lib/network/reqwest::reqwest-crate-package-path
      - id: well-known/lib/network/jsonrpsee::jsonrpsee-crate-package-path
      # Permissive verifier mocks are expected in TLS test harnesses. Keep the
      # suspicious finding for production implementations of the same method.
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/harness/runtime::boringssl-bogo-test-shim
