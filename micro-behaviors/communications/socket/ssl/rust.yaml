# Rustls certificate-verifier mechanics. An ignored server-name parameter
# establishes skipped hostname validation without claiming that CA, expiry,
# revocation, or signature checks are also disabled.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
  attack: T1553

traits:
  - id: rustls-server-cert-verifier-method
    desc: Rustls implements server cert verification
    conf: 0.96
    if:
      type: text
      regex: 'fn\s+verify_server_cert\s*\('

  - id: rustls-server-cert-assertion
    desc: Rustls returns cert verification assertion
    conf: 0.96
    if:
      type: text
      regex: 'ServerCertVerified::assertion\s*\(\s*\)'

  - id: rustls-unused-server-name-parameter
    desc: Rustls server-name parameter marked unused
    conf: 0.98
    if:
      type: text
      regex: '_server_name\s*:\s*&ServerName'

composite_rules:
  - id: rustls-no-hostname-verification
    desc: Rustls verifier skips server hostname validation
    conf: 0.99
    near_bytes: 1800
    all:
      - id: rustls-server-cert-verifier-method
      - id: rustls-unused-server-name-parameter
      - id: rustls-server-cert-assertion
    unless:
      # This content identifies a dedicated TLS test shim; a test attribute
      # elsewhere in the file does not identify the verifier as a test.
      - id: metadata/package/testing/harness/runtime::boringssl-bogo-test-shim
