defaults:
  platforms: [windows, unix]
  for: [c, elf]
traits:
  - id: ssl-ctx-map-link
    desc: File-descriptor and SSL-context association map
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(fd_to_ssl|ssl_to_fd)'
  - id: ssl-ctx-map-store
    desc: SSL context tracking map declaration
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)ssl_(ctx|context)_(map|hash)'
  - id: ssl-ctx-ref
    desc: Repeated SSL context references
    crit: component
    conf: 0.4
    count_min: 3
    if:
      type: text
      regex: '\bSSL[_\s]?CTX\b'
      case_insensitive: true
composite_rules:
  - id: ssl-ctx-map
    desc: SSL context tracking map
    crit: notable
    conf: 0.9
    any:
      - id: ssl-ctx-map-link
      - id: ssl-ctx-map-store
  - id: ssl-ctx-tracking
    desc: SSL context tracking maps and references
    crit: notable
    conf: 0.85
    all:
      - id: ssl-ctx-map
      - id: ssl-ctx-ref
