defaults:
  platforms: [windows, unix]
  for: [c, elf]
traits:
  # x86-64 SysV call site for SSL_CTX_set_verify(ctx, SSL_VERIFY_NONE, NULL):
  # the second and third arguments are both cleared immediately before the
  # call. Keep the complete null-check/call shape so ordinary zeroing code is
  # not mistaken for a certificate-validation bypass.
  - id: openssl-disable-peer-verification-x64
    desc: OpenSSL disables peer certificate verification
    crit: notable
    conf: 0.99
    for: [elf]
    platforms: [linux]
    if:
      type: hex
      section: .text
      pattern: '48 85 C0 74 ?? 31 D2 31 F6 E8 ?? ?? ?? ?? 48 8B 3D ?? ?? ?? ??'

  # SSL_CTRL_SET_MIN_PROTO_VERSION (123) with TLS1_2_VERSION (0x0303).
  - id: openssl-tls12-minimum-x64
    desc: OpenSSL enforces TLS 1.2 minimum
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [linux]
    if:
      type: hex
      section: .text
      pattern: '31 C9 BA 03 03 00 00 BE 7B 00 00 00 E8 ?? ?? ?? ??'

  # SSL_CTX_set_mode(ctx, SSL_MODE_ENABLE_PARTIAL_WRITE |
  # SSL_MODE_ACCEPT_MOVING_WRITE_BUFFER), emitted through SSL_CTX_ctrl.
  - id: openssl-moving-partial-write-modes-x64
    desc: OpenSSL permits partial and moving-buffer writes
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [linux]
    if:
      type: hex
      section: .text
      pattern: '31 C9 BA 03 00 00 00 BE 21 00 00 00 E8 ?? ?? ?? ??'

  # The per-session SSL_ctrl mode mask is 7: partial writes, moving buffers,
  # and SSL_MODE_AUTO_RETRY together.
  - id: openssl-session-auto-retry-modes-x64
    desc: OpenSSL session enables automatic retry
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [linux]
    if:
      type: hex
      section: .text
      pattern: '31 C9 BA 07 00 00 00 BE 21 00 00 00 48 89 C7 E8 ?? ?? ?? ??'

  - id: ssl-ctx-map-link
    desc: File-descriptor and SSL-context association map
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(fd_to_ssl|ssl_to_fd)'
  - id: ssl-ctx-map-store
    desc: SSL context tracking map declaration
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)ssl_(ctx|context)_(map|hash)'
  - id: ssl-ctx-ref
    desc: Repeated SSL context references
    crit: component
    conf: 0.4
    count_min: 3
    if:
      type: text
      regex: '\bSSL[_\s]?CTX\b'
      case_insensitive: true
composite_rules:
  - id: openssl-peer-verification-disabled
    desc: OpenSSL client disables certificate verification
    crit: suspicious
    conf: 0.99
    for: [elf]
    platforms: [linux]
    all:
      - id: openssl-disable-peer-verification-x64
      - id: micro-behaviors/communications/socket/ssl::ssl-connect-symbol

  - id: openssl-resilient-session-modes-x64
    desc: OpenSSL tunes writes and session retries
    crit: suspicious
    conf: 0.99
    for: [elf]
    platforms: [linux]
    all:
      - id: openssl-moving-partial-write-modes-x64
      - id: openssl-session-auto-retry-modes-x64
      - id: micro-behaviors/communications/socket/ssl::ssl-connect-symbol

  - id: ssl-ctx-map
    desc: SSL context tracking map
    crit: notable
    conf: 0.9
    any:
      - id: ssl-ctx-map-link
      - id: ssl-ctx-map-store
  - id: ssl-ctx-tracking
    desc: SSL context tracking maps and references
    crit: notable
    conf: 0.85
    all:
      - id: ssl-ctx-map
      - id: ssl-ctx-ref
