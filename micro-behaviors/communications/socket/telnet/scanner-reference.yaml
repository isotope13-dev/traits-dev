defaults:
  platforms: [unix, android, ios]
  for: [elf]
composite_rules:
- id: scanner-telnet-reference
  desc: Scanner and Telnet references near each other
  crit: component
  all:
  - id: micro-behaviors/data/parse/keywords::scanner-word
  - id: micro-behaviors/communications/socket/telnet::telnet
  near_bytes: 256
