defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: xor22-shell-probe-sequence
    desc: XOR-encoded Telnet shell entry command sequence
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rodata
      # enable\0\0system\0\0linuxshell\0, XOR 0x22; common across bot forks.
      pattern: '47 4C 43 40 4E 47 22 00 51 5B 51 56 47 4F 22 00 4E 4B 4C 57 5A 51 4A 47 4E 4E 22'
