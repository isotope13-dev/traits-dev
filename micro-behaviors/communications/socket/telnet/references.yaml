defaults:
  for: [elf, shell]
  platforms: [linux]
composite_rules:
  - id: telnet-port-endpoint-reference
    desc: Telnet port-23 endpoint reference
    crit: notable
    conf: 0.8
    any:
    - id: micro-behaviors/communications/ip/endpoint::ipv4-port-23
    - id: micro-behaviors/communications/ip/endpoint::hostname-port-23
    unless:
    - id: metadata/binary/provenance/source::rcs-ident-timestamp
    - id: metadata/package/testing/
    - id: "metadata/file/naming::test-directory-component"
    not:
    - substr: column:23
    - substr: line:23
    - substr: Interrupt:23
    - substr: accDescription:23
    - substr: escription:23
    - substr: QuickLook.Plugin.MarkdownViewer.Resources.js
    - regex: \.(rs|c|cc|cpp|h|hpp|go|py|js|ts|y|l|yy|ll|cs|rb|java|sh|properties|po|pot|txt|m4|ml|mli):23\b
