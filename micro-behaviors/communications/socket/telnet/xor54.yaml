defaults:
  platforms: [unix]
  for: [elf]
traits:
- id: xor54-login-prompt
  size_min: 512
  desc: XOR-0x54-encoded login prompt fragment
  crit: suspicious
  conf: 0.82
  if:
    type: hex
    section: ".rodata"
    pattern: 3B 33 3D 3A 54
- id: xor54-password-prompt
  size_min: 512
  desc: XOR-0x54-encoded password prompt fragment
  crit: suspicious
  conf: 0.82
  if:
    type: hex
    section: ".rodata"
    pattern: 35 27 27 23 3B 26 30 54
- id: xor54-login-failure
  size_min: 512
  desc: XOR-0x54-encoded authentication failure fragment
  crit: suspicious
  conf: 0.82
  if:
    type: hex
    section: ".rodata"
    pattern: 3A 37 3B 26 26 31 37 20 54
- id: xor54-enable-prompt
  size_min: 512
  desc: XOR-0x54-encoded enable command
  crit: suspicious
  conf: 0.82
  if:
    type: hex
    section: ".rodata"
    pattern: 31 3A 35 36 38 31 54
- id: xor54-shell-prompt
  size_min: 512
  desc: XOR-0x54-encoded shell command
  crit: suspicious
  conf: 0.82
  if:
    type: hex
    section: ".rodata"
    pattern: 27 3C 31 38 38 54
composite_rules:
- id: xor54-enable-shell-commands
  size_min: 512
  size_max: 500000000
  desc: XOR-encoded enable and shell command pair
  crit: suspicious
  conf: 0.86
  all:
  - id: xor54-enable-prompt
  - id: xor54-shell-prompt
