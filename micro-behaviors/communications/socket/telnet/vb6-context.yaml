# Telnet command references; a Run-key name alone does not establish a write.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vb6-telnet-runkey
  desc: Telnet command near Run-key name
  all:
  - id: micro-behaviors/os/registry/keys::currentversion-run
  - id: micro-behaviors/communications/socket/telnet::telnet-client-host-port
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: notable
- id: vb6-shell-telnet
  desc: VB6 Shell with telnet host command
  all:
  - id: micro-behaviors/process/create/exec::vb6-shell-execution
  - id: micro-behaviors/communications/socket/telnet::telnet-client-host-port
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: notable
