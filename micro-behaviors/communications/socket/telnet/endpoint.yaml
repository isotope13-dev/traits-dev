defaults:
  for: [elf, shell]
  platforms: [linux]
traits:
  - id: telnetadmin-user-token
    desc: References the telnetadmin username
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: telnetadmin
  - id: ipv4-port23-reference
    desc: IPv4 endpoint references TCP port 23
    crit: notable
    conf: 0.8
    if:
      type: text
      is: valid_ip
      regex: \b[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:23\b
  - id: hostname-port23-reference
    desc: Hostname endpoint references TCP port 23
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: \b[a-z0-9][a-z0-9-]{0,62}\.[a-z0-9][a-z0-9.-]{1,190}:23\b
    not:
    - regex: \.(rs|c|cc|cpp|h|hpp|go|py|js|ts|y|l|yy|ll|cs|rb|java|sh|properties|po|pot|txt|m4|at|ml|mli):23\b

