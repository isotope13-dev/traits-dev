defaults:
  platforms: [unix, appliance]
  for: [shell, elf]
  crit: notable
  conf: 0.92
  attack: T1021.007

traits:
  - id: telnetd-high-port
    desc: Telnetd uses a high nonstandard port
    if:
      type: text
      regex: '\btelnetd\b[^\n]{0,80}-p\s+[1-9][0-9]{3,4}\b'

  - id: telnetd-temp-login
    desc: Telnetd uses a /tmp login program
    conf: 0.95
    if:
      type: text
      regex: '\btelnetd\b[^\n]{0,100}-l\s+["'']?/(tmp|var/tmp)/'
