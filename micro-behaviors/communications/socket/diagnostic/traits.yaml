defaults:
  crit: notable
  platforms: [linux]
  for: [binaries, c, cpp, rust, go]

traits:
  - id: sock-diag-by-family-constant
    desc: References SOCK_DIAG_BY_FAMILY constant
    conf: 0.9
    if:
      type: text
      substr: SOCK_DIAG_BY_FAMILY

  - id: inet-diag-message-structure
    desc: inet_diag_msg socket diagnostic record
    conf: 0.85
    if:
      type: text
      word: inet_diag_msg

  - id: netlink-message-next-macro
    desc: NLMSG_NEXT message traversal
    conf: 0.85
    if:
      type: text
      word: NLMSG_NEXT

  - id: inet-diag-netlink-protocol
    desc: Selects INET_DIAG netlink protocol
    conf: 0.92
    for: [c, cpp, rust, go]
    if:
      type: symbol
      kind: identifier
      exact: NETLINK_INET_DIAG

  - id: netlink-aligned-message-length
    desc: Computes aligned netlink message length
    conf: 0.92
    for: [c, cpp]
    if:
      type: text
      regex: 'NLMSG_ALIGN\s*\([^;\n]{0,80}nlmsg_len'
