defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: scapy-layer3-packet-exchange
    desc: Scapy exchanges a constructed IP packet
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bsr1?\(\s*IP\s*\('

  - id: scapy-arp-subnet-probe
    desc: Scapy ARP probe builds a subnet target
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\barping\(\s*\w+\s*\+\s*["'']/[0-9]{1,2}["'']'
