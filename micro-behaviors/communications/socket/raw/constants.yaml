# The bare socket-constant NAMES for raw IP sockets. A binary that merely
# contains `SOCK_RAW`/`IPPROTO_RAW` in a constant table, a header enum or DWARF
# debug info is not opening a raw socket -- the neutral name is all this sees,
# which is why it lives here with the other raw-socket mechanics rather than in
# the IP-spoofing objective that used to own it. Spoofing, flooding and sniffer
# composites reference these and supply the intent.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, -python]
  mbc: C0001
traits:
  - id: ipproto-raw-constant
    desc: IPPROTO_RAW socket type
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: IPPROTO_RAW
    unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
    - id: metadata/lang/compiler/systems::go-binary
    - id: metadata/lang/compiler/systems::go-binary-comp
    - id: metadata/lang/compiler/systems::go-buildinfo

  - id: sock-raw-constant
    desc: SOCK_RAW socket type
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: SOCK_RAW
    unless:
    - id: metadata/lang/compiler/systems::go-binary
    - id: metadata/lang/compiler/systems::go-binary-comp
    - id: metadata/lang/compiler/systems::go-buildinfo
    - type: text
      substr: syscall.SOCK_RAW
    - type: text
      substr: x/sys/windows.SOCK_RAW
