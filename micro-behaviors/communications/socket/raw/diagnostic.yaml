defaults:
  for: [elf]
  platforms: [unix]
  mbc: C0001

traits:
  # DHCP clients also emit this diagnostic; it does not establish flooding.
  - id: opening-raw-socket-message
    desc: Opening-raw-socket diagnostic message
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)opening raw socket\b'
