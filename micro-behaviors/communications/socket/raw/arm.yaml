defaults:
  platforms: [linux]
  for: [elf]
  mbc: C0001

traits:
  - id: arm-ipv4-raw-socket-creation
    desc: ARM creates an IPv4 raw socket
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      # mov r0, AF_INET; mov r1, SOCK_RAW; mov r2, protocol; bl socket.
      # The protocol and branch target vary between raw-socket consumers.
      pattern: "02 00 A0 E3 03 10 A0 E3 ?? 20 A0 E3 ?? ?? ?? EB"

  # GCC may schedule the independent r1 assignment before r0. Keep the exact
  # AF_INET/SOCK_RAW argument values while admitting that equivalent ordering.
  - id: arm-ipv4-raw-socket-creation-r1-first
    desc: ARM creates IPv4 raw socket, r1 first
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "03 10 A0 E3 02 00 A0 E3 ?? 20 A0 E3 ?? ?? ?? EB"
