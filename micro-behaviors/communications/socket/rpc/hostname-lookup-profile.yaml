defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for: [scripts, binaries]

composite_rules:
  - id: rpc-hostname-portmapper-profile
    desc: Hostname resolution with portmapper API references
    crit: notable
    conf: 0.9
    for:
    - c
    all:
    - id: micro-behaviors/communications/socket/rpc::portmapper-client-api
    - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname
    any:
    - id: micro-behaviors/communications/socket/rpc::portmapper-service-port
    - id: micro-behaviors/communications/socket/rpc::portmapper-headers
    unless:
    - id: well-known/tool/sysadmin/busybox::source-tree-path
