# JavaScript socket identifier property or parameter.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: socket-identifier-property
    desc: Socket identifier property
    if:
      type: text
      regex: '(["'']socketId["'']|\bsocketId)\s*:|\b(body|params|query|req|request|socket)\.socketId\b'
