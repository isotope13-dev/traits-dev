defaults:
  platforms: [linux, macos, windows]
  for: [binaries, go, c, cpp]

composite_rules:
  - id: outbound-network-transport
    desc: Outbound socket dial, socket connect or HTTP client capability
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/dial::net-dial-text
      - id: micro-behaviors/communications/socket/connect/
      - id: micro-behaviors/communications/http/client/

  - id: outbound-socket-dial-or-connect
    desc: Outbound network dial or socket connect
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/dial::net-dial-text
      - id: micro-behaviors/communications/socket/connect/
