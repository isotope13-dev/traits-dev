defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-create-connection-loopback-literal
    desc: Python connects to a literal loopback host
    conf: 0.9
    if:
      type: text
      regex: 'create_connection\s*\(\s*\(\s*["''](127\.0\.0\.1|localhost)["'']'
  - id: python-ssh-loopback-target
    desc: Python SSH command targets loopback
    conf: 0.9
    if:
      type: text
      regex: '["'']ssh["''][\s\S]{0,240}127\.0\.0\.1'
