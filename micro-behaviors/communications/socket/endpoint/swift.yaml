defaults:
  platforms: [macos, ios]
  for: [swift]
  crit: notable
traits:
  - id: nwendpoint-host-literal
    desc: Swift Network endpoint host literal
    conf: 0.92
    if:
      type: text
      regex: 'NWEndpoint\.Host\s*\(\s*"[^"\r\n]{1,80}"\s*\)'
  - id: nwendpoint-port-literal
    desc: Swift Network endpoint port literal
    conf: 0.85
    if:
      type: text
      regex: 'NWEndpoint\.Port\s*\(\s*rawValue\s*:\s*\d{2,5}'
