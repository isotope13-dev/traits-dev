defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96
  mbc: C0001

traits:
  - id: aioquic-client-connect
    desc: Opens an aioquic client connection
    conf: 0.98
    if:
      type: text
      regex: 'QuicConfiguration\([^\)\n]{0,200}\)[\s\S]{0,400}async with connect\('

  - id: aioquic-stream-data-event-import
    desc: Imports aioquic stream receive events
    if:
      type: import
      exact: StreamDataReceived

  - id: quic-send-stream-data-call
    desc: Sends data on a QUIC stream
    if:
      type: symbol
      kind: call
      regex: '(^|\.)send_stream_data$'
