defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  crit: notable
  conf: 0.98

traits:
  # Four zero arguments, argument-vector address, SYS_CONNECT=3 and syscall 102.
  # A bare push of a small integer followed by call is not a socket operation.
  - id: i386-socketcall-connect
    desc: i386 socketcall connect argument setup
    if:
      type: hex
      section: .text
      pattern: '6A 00 6A 00 6A 00 6A 00 8D 44 24 ?? 50 6A 03 6A 66 E8 ?? ?? ?? ??'
