defaults:
  platforms: [unix, windows]
  crit: notable
  for: [mirc]

traits:
  # /sockopen opens an outbound TCP connection from an mIRC script. Relocated
  # from objectives/command-and-control/channel/irc/client/ (suspicious): the
  # flood, bounce and harvest composites supply the intent.
  - id: mirc-sockopen
    desc: mIRC script opens a TCP client socket
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsockopen\b'
