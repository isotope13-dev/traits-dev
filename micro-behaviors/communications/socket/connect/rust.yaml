# Rust socket dial primitives.
defaults:
  for: [rust]
  platforms: [unix, windows, openwrt]

traits:
  - id: tcpstream-connect
    desc: Rust TcpStream::connect call
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bTcpStream::connect\s*\('
  - id: tcpstream-connect-host-literal
    desc: Rust TcpStream remote host literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'TcpStream::connect\s*\(\s*"[^"]{1,80}:\d{2,5}"\s*\)'
    not:
      - regex: 'TcpStream::connect\s*\(\s*"(127\.\d{1,3}\.\d{1,3}\.\d{1,3}|localhost|\[?::1\]?|\[?::\]?|0\.0\.0\.0):'
  - id: tcpstream-connect-timeout
    desc: Connects a Rust TcpStream with timeout
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bTcpStream::connect_timeout\s*\('
