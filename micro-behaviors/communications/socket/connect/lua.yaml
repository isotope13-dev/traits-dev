defaults:
  crit: notable
  platforms: [unix, ios]
  for: [lua]
  attack: T1071
  mbc: C0001
traits:
  - id: lua-method-connect
    desc: Lua socket connect method
    conf: 0.7
    if:
      type: tree-sitter
      kind: call
      regex: ':connect\s*\('
composite_rules:
  - id: lua-tcp-connect
    desc: Lua TCP socket connection
    conf: 0.88
    all:
      - id: micro-behaviors/communications/socket/create::lua-socket-tcp
      - id: lua-method-connect
