# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - shell
  - package.json
  - php
  - html
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
traits:
- id: php-var-fsockopen
  desc: Assigns a PHP socket connection
  if:
    type: text
    regex: '\$[A-Za-z_]\w*\s*=\s*fsockopen\s*\('
