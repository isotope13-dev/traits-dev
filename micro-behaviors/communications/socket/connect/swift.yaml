# Swift Network.framework socket connect patterns
defaults:
  crit: notable
  attack: T1071
  mbc: C0001
  platforms: [macos, ios]
  for: [macho]
traits:
  - id: nwconnection-connect-source
    desc: Swift source creates NWConnection
    crit: notable
    conf: 0.92
    for: [swift]
    if:
      type: text
      regex: 'NWConnection\s*\(\s*host\s*:\s*[^,()]{1,80}\s*,\s*port\s*:\s*[^,()]{1,80}\s*,\s*using\s*:'
  - id: nwconnection-host
    desc: Swift NWConnection host setup
    conf: 0.85
    if:
      type: symbol
      regex: "NWConnection.{0,80}host.{0,80}using"
  - id: nwconnection-start
    desc: Swift NWConnection start call
    conf: 0.8
    if:
      type: symbol
      regex: "NWConnection.{0,80}start"
composite_rules:
  - id: nwconnection-connect
    desc: Swift NWConnection connect flow
    conf: 0.85
    all:
      - id: nwconnection-host
      - id: nwconnection-start
