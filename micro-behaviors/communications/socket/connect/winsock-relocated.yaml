# Preserved Windows PE/DLL observations, classified by their supported operation.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: connect-api-ordinal
    desc: Winsock outbound connect import
    crit: notable
    conf: 0.88
    if:
      type: yara
      source: |
        import "pe"
        rule connect_api_ordinal {
          strings:
            $library = "WS2_32.dll" ascii nocase
          condition:
            $library and
            pe.imports("WS2_32.dll", 4)
        }

composite_rules:
- id: winsock-client-ordinal-api-set
  desc: Winsock client ordinal connect send recv set
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/socket/connect::connect-api-ordinal
  - id: micro-behaviors/communications/socket/create::socket-api-ordinal
  - id: micro-behaviors/communications/socket/send::send-api-ordinal
  - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
