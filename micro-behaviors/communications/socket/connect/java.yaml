defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin]
traits:
  - id: java-socket-connect
    desc: Java/Kotlin socket host-port constructor
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\b(new\s+)?Socket\s*\(\s*[^,\n)]{1,120},\s*[^)\n]{1,120}'
  - id: java-inet-socket-address
    desc: Java/Kotlin InetSocketAddress usage
    crit: baseline
    conf: 0.8
    if:
      type: text
      word: InetSocketAddress
