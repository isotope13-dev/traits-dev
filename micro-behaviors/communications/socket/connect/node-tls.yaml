# TLS setup and socket connection retain their operation-specific homes.
traits:
- id: node-tls-connect
  desc: Node TLS module connects a socket
  crit: notable
  conf: 0.88
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  mbc: C0001
  if:
    type: symbol
    kind: call
    regex: ^(tls|Tls|import_tls[0-9]*\.default)\.connect$
