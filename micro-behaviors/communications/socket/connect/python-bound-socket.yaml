# Correlate a constructed socket with a later connect call in the same block.
# Local identifier equality is syntactic evidence, not runtime type inference.
defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-created-socket-connect
    desc: Connects a locally constructed Python socket
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((_ (expression_statement (assignment
          left: (identifier) @created
          right: (call function: (attribute object: (identifier) @module attribute: (identifier) @constructor))))
          (expression_statement (call function: (attribute object: (identifier) @used attribute: (identifier) @method)))) @connection
        (#eq? @module "socket")
        (#eq? @constructor "socket")
        (#eq? @created @used)
        (#match? @method "^connect(_ex)?$")
        )
