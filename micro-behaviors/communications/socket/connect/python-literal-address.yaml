# Text fallback for Python snippets embedded in unparsed carriers.
defaults:
  platforms: [unix, windows]
  for: [python, text, makefile]
  crit: notable
  conf: 0.88

traits:
  - id: python-connect-literal-address-text
    desc: Python-style connect call with literal address
    if:
      type: text
      regex: '\.\s*connect\s*\(\s*\(\s*[''"]'
