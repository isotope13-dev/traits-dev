defaults:
  crit: notable
  platforms: [linux, macos]
  for: [elf, macho]
traits:
  - id: socket-connect
    desc: Connects socket to remote host
    conf: 0.9
    if:
      type: syscall
      name:
        - connect
    unless:
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: x86-64-connect-syscall
    desc: Direct x86-64 connect syscall
    conf: 0.9
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      section: text
      pattern: "B8 2A 00 00 00 0F 05"
    unless:
      # Linux syscall number 42 is not portable to BSD kernels.
      - id: metadata/vendor/identity::bsd-elf-osabi

composite_rules:
  # Each platform's creation leg retains its original file and OS gates.
  - id: socket-create-and-connect-syscalls
    desc: Socket creation and connection syscalls coexist
    conf: 0.85
    all:
      - id: socket-connect
    any:
      - id: micro-behaviors/communications/socket/create::socket-create
      - id: micro-behaviors/communications/socket/create::socket-socket-macos
