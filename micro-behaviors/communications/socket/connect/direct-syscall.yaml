defaults:
  crit: notable
  platforms: [linux, macos]
  for: [elf, macho]
traits:
  - id: socket-connect
    desc: Connects socket to remote host
    conf: 0.9
    if:
      type: syscall
      name:
        - connect
    unless:
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: linux-connect-syscall-sequence
    desc: Linux connect syscall or forwarding wrapper
    conf: 0.9
    platforms: [linux]
    for: [elf]
    arch: [x86-64, aarch64, arm]
    if:
      type: hex
      section: text
      # x86-64: SYS_connect (42) followed by SYSCALL.
      # AArch64 musl: forwards fd/address/length into x1/x2/x3, zeros
      # unused arguments, and passes SYS_connect (203) to __syscall_cp.
      # ARM musl: the same argument forwarding through r1/r2/r3; the
      # PC-relative LDR r0 reads SYS_connect (283) at exactly PC+12.
      # Calls and tail branches vary with linking; argument setup and
      # the literal-pool relationship must remain intact.
      pattern: "(B8 2A 00 00 00 0F 05|E3 03 02 2A E2 03 01 AA 01 7C 40 93 06 00 80 D2 05 00 80 D2 04 00 80 D2 FE 0F 1F F8 60 19 80 D2 ?? ?? ?? 94 ?? ?? ?? 97 FE 07 41 F8 C0 03 5F D6|00 C0 A0 E3 1F 40 2D E9 02 30 A0 E1 08 C0 8D E5 01 20 A0 E1 04 C0 8D E5 00 10 A0 E1 00 C0 8D E5 0C 00 9F E5 ?? ?? ?? EB 14 D0 8D E2 04 E0 9D E4 ?? ?? ?? EA 1B 01 00 00)"
    unless:
      # Linux syscall numbers are not portable to BSD kernels.
      - id: metadata/vendor/identity::bsd-elf-osabi

composite_rules:
  # Each platform's creation leg retains its original file and OS gates.
  - id: socket-create-and-connect-syscalls
    desc: Socket creation and connection syscalls coexist
    conf: 0.85
    all:
      - id: socket-connect
    any:
      - id: micro-behaviors/communications/socket/create::socket-create
      - id: micro-behaviors/communications/socket/create::socket-socket-macos
