defaults:
  crit: notable
  platforms: [linux, macos]
  for: [elf, macho]
traits:
  - id: socket-connect
    desc: Connects socket to remote host
    conf: 0.9
    if:
      type: syscall
      name:
        - connect
    unless:
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: linux-connect-syscall-sequence
    desc: Linux connect syscall or forwarding wrapper
    conf: 0.9
    platforms: [linux]
    for: [elf]
    arch: [x86-64, aarch64, arm]
    if:
      type: yara
      source: |
        import "elf"
        rule linux_connect_syscall_encodings {
          strings:
            $legacy = { (B8 2A 00 00 00 0F 05|E3 03 02 2A E2 03 01 AA 01 7C 40 93 06 00 80 D2 05 00 80 D2 04 00 80 D2 FE 0F 1F F8 60 19 80 D2 ?? ?? ?? 94 ?? ?? ?? 97 FE 07 41 F8 C0 03 5F D6|00 C0 A0 E3 1F 40 2D E9 02 30 A0 E1 08 C0 8D E5 01 20 A0 E1 04 C0 8D E5 00 10 A0 E1 00 C0 8D E5 0C 00 9F E5 ?? ?? ?? EB 14 D0 8D E2 04 E0 9D E4 ?? ?? ?? EA 1B 01 00 00) }
            $arm_variadic = { 04 E0 2D E5 01 C0 A0 E1 02 30 A0 E1 00 10 A0 E1 04 D0 4D E2 0C 20 A0 E1 0C 00 9F E5 ?? ?? ?? EB 04 D0 8D E2 04 E0 9D E4 1E FF 2F E1 1B 01 00 00 }
          condition:
            // Preserve the old text-section matcher; the added compiler
            // stub also occurs in ELF images whose sections were removed.
            (for any s in elf.sections : (
              s.name contains "text" and
              for any i in (1..#legacy) : (
                @legacy[i] >= s.offset and
                @legacy[i] + !legacy[i] <= s.offset + s.size
              )
            )) or (uint16(18) == 40 and $arm_variadic)
        }
    unless:
      # Linux syscall numbers are not portable to BSD kernels.
      - id: metadata/vendor/identity::bsd-elf-osabi

composite_rules:
  # Each platform's creation leg retains its original file and OS gates.
  - id: socket-create-and-connect-syscalls
    desc: Socket creation and connection syscalls coexist
    conf: 0.85
    all:
      - id: socket-connect
    any:
      - id: micro-behaviors/communications/socket/create::socket-create
      - id: micro-behaviors/communications/socket/create::socket-socket-macos
