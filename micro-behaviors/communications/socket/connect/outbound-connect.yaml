# Cross-language outbound TCP connect calls. Ruby, Node, Deno and Python each
# have a canonical connect atom; this groups the call forms so objective
# composites can require "a socket was dialed" without enumerating clients or
# falling back to a directory reference (which would also count import-only
# facts such as the Node net namespace import). Deliberately excludes
# class/module references: only connect-call traits belong here.
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [ruby, javascript, typescript, python, pyc]

composite_rules:
  - id: outbound-connect-call
    desc: Outbound socket connect call (Ruby, Node, Deno, or Python)
    any:
      - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
      - id: micro-behaviors/communications/socket/connect::net-connect
      - id: micro-behaviors/communications/socket/connect::net-create-connection-call
      - id: micro-behaviors/communications/socket/connect::deno-connect-call
      - id: micro-behaviors/communications/socket/connect::socket-connect-call
      - id: micro-behaviors/communications/socket/connect::socket-connect-ex-call
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-text
