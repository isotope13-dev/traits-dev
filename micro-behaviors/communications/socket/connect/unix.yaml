defaults:
  crit: notable
  attack: T1071
  mbc: C0001
  platforms: [aix, unix]
  for: [elf, macho, c, cpp]
traits:
  - id: connect-symbol
    desc: References connect socket API
    conf: 0.66
    if:
      type: symbol
      exact: connect
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: connect-import
    desc: Imports the POSIX connect API
    conf: 0.9
    if:
      type: import
      exact: connect
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: connectx-symbol
    desc: Uses connectx socket call
    conf: 0.66
    if:
      type: symbol
      exact: connectx
composite_rules:
  - id: connect
    desc: Socket connection API surface
    conf: 0.66
    any:
      - id: connect-symbol
      - id: connect-import
      - id: connectx-symbol
      - id: micro-behaviors/communications/socket/wrapper-connect::native-connect-wrapper-symbol
  - id: loopback-ipv4
    desc: Connect-capable code references IPv4 loopback
    conf: 0.84
    all:
      - id: connect-symbol
    any:
      - id: micro-behaviors/communications/ip/literal::loopback-ipv4-binary
      - id: micro-behaviors/communications/ip/literal::loopback-ipv4-source
  - id: loopback-hostname
    desc: Connect-capable code references localhost
    conf: 0.84
    all:
      - id: connect-symbol
    any:
      - id: micro-behaviors/communications/ip/literal::localhost-binary
      - id: micro-behaviors/communications/ip/literal::localhost-source
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: loopback-ipv6
    desc: Connect-capable code references IPv6 loopback
    conf: 0.84
    all:
      - id: connect-symbol
    any:
      - id: micro-behaviors/communications/ip/literal::loopback-ipv6-binary
      - id: micro-behaviors/communications/ip/literal::loopback-ipv6-source
  - id: loopback-address
    desc: Connect-capable code references loopback address
    conf: 0.8
    any:
      - id: loopback-ipv4
      - id: loopback-hostname
      - id: loopback-ipv6
