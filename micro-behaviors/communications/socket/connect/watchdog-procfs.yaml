defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
- id: procfs-watchdog-socket-api-cluster
  desc: Socket syscalls with TCP table and watchdog paths
  crit: notable
  conf: 0.98
  all:
    - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
    - id: micro-behaviors/communications/socket/create::x86-64-socket-syscall
    - id: micro-behaviors/communications/socket/create::x86-64-connect-syscall
  any:
    - id: micro-behaviors/fs/path/device/special::dev-watchdog-plaintext
    - id: micro-behaviors/fs/path/device/special::dev-watchdog-elf-text
    - id: micro-behaviors/fs/path/device/special::dev-misc-watchdog-elf-text
