# block_api shellcode calls every API as `push <ROR13 hash>; call ebp`.
# 0x6174A599 is the ROR13 hash of ws2_32!connect, so this is an outbound
# TCP connection made without an import table.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_max: 5242880
  attack: T1095

traits:
  - id: connect-ror13-hash-call-x86
    desc: Calls connect through a ROR13 API hash
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: '68 99 A5 74 61 FF D5'
      offset_range: [0, null]

  - id: connect-ror13-hash-call-powershell-x64
    desc: PowerShell shellcode calls hashed connect
    crit: notable
    conf: 0.98
    for: [powershell]
    arch: [all]
    if:
      type: text
      regex: '(?i)0x41,\s*0xba,\s*0x99,\s*0xa5,\s*0x74,\s*0x61,\s*0xff,\s*0xd5'
