# block_api shellcode calls every API as `push <ROR13 hash>; call ebp`.
# 0x6174A599 is the ROR13 hash of ws2_32!connect, so this is an outbound
# TCP connection made without an import table.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_max: 5242880

traits:
  - id: connect-ror13-hash-call-x86
    desc: Calls connect through a ROR13 API hash
    crit: notable
    conf: 0.96
    attack: T1095
    if:
      type: hex
      pattern: '68 99 A5 74 61 FF D5'
      offset_range: [0, null]
