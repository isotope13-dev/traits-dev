defaults:
  platforms: [windows, unix]
  for: [go]
  mbc: C0001
  attack: T1071
traits:
  - id: dial
    desc: Go net.Dial call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: net.Dial
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  # Same name as the symbol atom, recovered from pclntab when kind:symbol
  # does not fire on a stripped Go ELF.
  - id: pclntab-net-dial
    desc: Go pclntab embeds net.Dial
    for: [elf, pe, macho]
    crit: notable
    conf: 0.85
    if:
      type: hex
      offset_range: [0, null]
      pattern: 6e 65 74 2e 44 69 61 6c
  - id: dialer-dial
    desc: Go net.Dialer.Dial call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: net.(*Dialer).Dial
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: dialer-dial-context
    desc: Go dialer context connection call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.DialContext$'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: dial-method-call
    desc: Go named dialer method call
    crit: notable
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*[Dd]ialer\.Dial$'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: dial-tcp
    desc: Go net.DialTCP call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: net.DialTCP
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: dial-timeout-tcp
    desc: Go timed TCP dial call
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: net\.DialTimeout.{0,20}tcp
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: multiple-go-dial-call-sites
    desc: Multiple Go outbound socket dial call sites
    crit: notable
    conf: 0.9
    count_min: 2
    if:
      type: symbol
      kind: call
      exact: net.Dial
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
composite_rules:
  - id: go-dial-methods
    desc: Go network dial methods
    any:
      - id: dial
      - id: dialer-dial
      - id: dialer-dial-context
      - id: dial-method-call
      - id: dial-tcp
      - id: dial-timeout-tcp
