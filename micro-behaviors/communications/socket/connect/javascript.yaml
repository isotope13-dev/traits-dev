# Node.js socket dial primitives.
defaults:
  for: [javascript, typescript]
  platforms: [linux, macos, windows]

traits:
  - id: net-connect-port
    desc: Node net.connect with port literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(net|import_net[0-9]*\.default)\.(connect|createConnection)\s*\(\s*[0-9]{2,5}'
  # Socket().connect(port, host) is common in condensed reverse shells that
  # skip net.connect; catches future Node implants using the same shape.
  - id: socket-connect-port-host
    desc: Socket.connect with numeric port then host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.connect\s*\(\s*[0-9]{2,5}\s*,'
  - id: net-connect
    desc: Node net.connect or createConnection usage
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\b(net|node_net_[0-9]+|import_net[0-9]*\.default)\.(connect|createConnection)\s*\('
  - id: net-create-connection-call
    desc: Node net.createConnection call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(net|node_net_[0-9]+|import_net[0-9]*\.default)\.createConnection$'
  - id: node-net-createconnection-import
    desc: Node net named createConnection import
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bimport\s*\{.{0,40}\bcreateConnection\b.{0,40}\}\s*from\s*["''](node:)?net["'']'
  - id: node-named-create-connection-call
    desc: Calls imported Node createConnection
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: createConnection
  - id: net-socket-connect-method
    desc: Node net.Socket constructor
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bnew\s+net\.Socket\s*\('

  - id: node-socket-connect-call
    desc: Socket-like Node connect call marker
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\b(socket|sock|client|conn)\.connect\s*\('

  - id: deno-connect-call
    desc: Deno TCP connect call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Deno.connect

composite_rules:
  - id: node-named-create-connection
    desc: Node named net import opens a TCP connection
    crit: notable
    conf: 0.94
    all:
      - id: node-net-createconnection-import
      - id: node-named-create-connection-call
    near_bytes: 4096
  - id: node-net-socket-connect
    desc: Node net.Socket connects to remote endpoint
    crit: notable
    conf: 0.92
    all:
      - id: net-socket-connect-method
      - id: node-socket-connect-call
    near_bytes: 2048
