defaults:
  crit: notable
  for:
  - java
  - class
  - kotlin
  - scala
  - groovy
  - jsp
  platforms:
  - linux
  - macos
  - windows
traits:
- id: new-socket-host-port
  desc: new Socket(host, port) constructor
  conf: 0.9
  if:
    type: text
    regex: \bnew\s+Socket\s*\(\s*["'][^"']{1,80}["']\s*,\s*[0-9]{2,5}
- id: java-address-socket-connect
  desc: Java socket connects using an address
  conf: 0.94
  if:
    type: text
    regex: SocketChannel\.open\s*\(\s*[^)\s]|\.\s*connect\s*\(\s*(new\s+)?InetSocketAddress
