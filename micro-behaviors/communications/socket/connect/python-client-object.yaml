# A `client.connect(...)` call names no protocol: `client` is the default
# variable name for a socket, database, SSH or broker client alike, and the
# canonical Unix-socket IPC form `client.connect("/run/app/ipc.sock")` is an
# ordinary local connect. The matcher only establishes "something named client
# opens a connection", so the trait lives with the neutral connect capability
# and stays a component fragment. Protocol identity is supplied by composites
# that pair it with a library import (see the MQTT composites under
# micro-behaviors/communications/messaging/mqtt).
defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: client-object-connect-call
    desc: Calls connect on a client object
    crit: component
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)client\.connect$'
