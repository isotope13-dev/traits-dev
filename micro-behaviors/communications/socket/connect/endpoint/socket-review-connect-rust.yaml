defaults:
  crit: notable
  for: [rust]
  platforms: [unix, windows, openwrt]
traits:
  - id: tcpstream-connect-host-literal
    desc: Rust TcpStream remote host literal
    conf: 0.92
    if:
      type: text
      regex: 'TcpStream::connect\s*\(\s*"[^"]{1,80}:\d{2,5}"\s*\)'
    not:
      - regex: 'TcpStream::connect\s*\(\s*"(127\.\d{1,3}\.\d{1,3}\.\d{1,3}|localhost|\[?::1\]?|\[?::\]?|0\.0\.0\.0):'
