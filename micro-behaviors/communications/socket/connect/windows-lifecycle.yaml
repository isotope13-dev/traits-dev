defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
composite_rules:
- id: winsock-client-symbol-lifecycle
  desc: Winsock client connection API imports
  conf: 0.92
  all:
  - id: micro-behaviors/communications/socket/create::socket-api
  - id: micro-behaviors/communications/socket/connect::connect-api
  any:
  - id: micro-behaviors/communications/socket/send::send-api
  - id: micro-behaviors/communications/socket/receive::recv-api
  - id: micro-behaviors/communications/socket/init::shutdown-api
- id: winsock-client-lifecycle
  desc: Winsock client connection API references
  conf: 0.9
  all:
  - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
  any:
  - id: micro-behaviors/communications/socket/connect::winsock-client-symbol-lifecycle
  - id: micro-behaviors/communications/socket/init::winsock-client-ordinal-imports
  - id: micro-behaviors/communications/socket/init::winsock-client-ordinal-api-set
