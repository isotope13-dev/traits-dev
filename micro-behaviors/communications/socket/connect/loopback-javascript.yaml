defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: javascript-connect-loopback-argument
    desc: Connect call targets IPv4 loopback
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.connect$'
      arg:
        index: 1
        kind: string
        exact: '127.0.0.1'
