defaults:
  platforms: [linux, macos, windows]
  for: [powershell]
  crit: notable
  conf: 0.92

traits:
  - id: powershell-tcpclient-connect
    desc: PowerShell TcpClient opens outbound connection
    if:
      type: text
      regex: '\[Net[.]Sockets[.]TcpClient\]::new\s*\(\s*\).{0,240}[.]Connect\s*\('

  # The New-Object plus async BeginConnect() spelling used by port and
  # firewall-egress probers. The constructor and the connect call usually
  # sit on different lines, so the gap matches across line breaks.
  - id: powershell-tcpclient-newobject-beginconnect
    desc: PowerShell TcpClient async outbound probe
    if:
      type: text
      regex: 'New-Object\s+System[.]Net[.]Sockets[.]TCPClient[\s\S]{0,400}[.]BeginConnect\s*\('
