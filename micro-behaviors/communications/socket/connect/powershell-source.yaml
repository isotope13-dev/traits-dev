defaults:
  platforms: [linux, macos, windows]
  for: [powershell]
  crit: notable
  conf: 0.92

traits:
  - id: powershell-tcpclient-connect
    desc: PowerShell TcpClient opens outbound connection
    if:
      type: text
      regex: '\[Net[.]Sockets[.]TcpClient\]::new\s*\(\s*\).{0,240}[.]Connect\s*\('
