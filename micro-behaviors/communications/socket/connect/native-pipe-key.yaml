# The pipe-delimited record, socket connect and 32-byte array coexist; no
# clause binds the array to encryption or the record to a sent message.
defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: native-pipe-record-connect-key-profile
    desc: Pipe-delimited record, socket and 32-byte array clues
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/format/string::pipe-delimited-five-string-format
      - id: micro-behaviors/communications/socket/connect::connect
      - id: micro-behaviors/data/buffer/alloc::fixed-thirtytwo-byte-array
