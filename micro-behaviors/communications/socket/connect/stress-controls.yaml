defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: socket-stress-cycling-controls
    desc: Socket stress interface enables connection cycling
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule socket_stress_cycling_controls {
          strings:
            $max = "Max Sockets:"
            $disconnect = "Disconnect on Connect"
            $reconnect = "Reconnect on Disconnect"
            $delay = "Delay (MS):"
          condition:
            all of them
        }
