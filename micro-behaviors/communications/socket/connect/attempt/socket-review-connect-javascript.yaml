defaults:
  crit: notable
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
traits:
  - id: node-bound-socket-connect
    desc: Connects a locally bound net.Socket instance
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((_
          [(lexical_declaration
             (variable_declarator name: (identifier) @created
               value: (new_expression
                 constructor: (member_expression object: (identifier) @net
                   property: (property_identifier) @ctor))))
           (variable_declaration
             (variable_declarator name: (identifier) @created
               value: (new_expression
                 constructor: (member_expression object: (identifier) @net
                   property: (property_identifier) @ctor))))
           (expression_statement
             (assignment_expression left: (identifier) @created
               right: (new_expression
                 constructor: (member_expression object: (identifier) @net
                   property: (property_identifier) @ctor))))]
          (expression_statement
            (call_expression
              function: (member_expression object: (identifier) @used
                property: (property_identifier) @connect)))) @connection
          (#eq? @net "net") (#eq? @ctor "Socket")
          (#eq? @connect "connect") (#eq? @created @used))
  - id: deno-connect-call
    desc: Deno TCP connect call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Deno.connect
