defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-net-dial-udp-call
    desc: Go net.Dial selects a UDP peer
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: net.Dial
      arg:
        index: 0
        kind: string
        regex: '^udp[46]?$'
