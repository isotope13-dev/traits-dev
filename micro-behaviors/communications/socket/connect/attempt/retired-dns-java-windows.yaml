defaults:
  platforms: [windows]
  for: [java, class, java_class, jar]

traits:
  - id: java-raw-dns-tcp-port
    desc: Java socket constructor targets port 53
    crit: suspicious
    conf: 0.92
    for: [java, class, java_class]
    if:
      type: text
      regex: 'new\s+Socket\s*\([^;\n]{0,180},\s*53\s*\)'

