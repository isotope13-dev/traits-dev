defaults:
  crit: notable
  platforms: [windows, unix]
  for: [php]
composite_rules:
  - id: php-explicit-socket-endpoint
    desc: PHP socket client and URI clues
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::php-stream-socket-client
    any:
      - id: micro-behaviors/communications/socket/uri::tcp-socket-uri
      - id: micro-behaviors/communications/socket/uri::udp-socket-uri
