defaults:
  platforms: [unix]
  for: [swift]
  crit: notable
  conf: 0.95

traits:
  - id: swift-range-tcp-connect-loop
    desc: TCP connect attempts inside a range loop
    if:
      type: tree-sitter
      query: |
        ((for_statement
          collection: (range_expression) @range
          (statements
            (property_declaration value: (call_expression
              (simple_identifier) @socket
              (call_suffix (value_arguments
                . (value_argument value: (simple_identifier) @family)
                . (value_argument value: (simple_identifier) @type)))))
            (property_declaration value: (call_expression
              (simple_identifier) @connect))))
          (#eq? @socket "socket")
          (#eq? @family "AF_INET")
          (#eq? @type "SOCK_STREAM")
          (#eq? @connect "connect")
          (#match? @range "\\.\\.(\\.|<)"))
