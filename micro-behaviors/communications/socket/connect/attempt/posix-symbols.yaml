defaults:
  crit: notable
  platforms: [aix, unix]
  for: [elf, macho, c, cpp]
traits:
  - id: connect-symbol
    desc: References connect socket API
    conf: 0.66
    if:
      type: symbol
      exact: connect
    downgrade:
      any:
        - id: micro-behaviors/fs/path/application/interpreter::system-shell-basename
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: connectx-symbol
    desc: connectx symbol reference
    conf: 0.66
    if:
      type: symbol
      exact: connectx
composite_rules:
  - id: connect
    desc: Native socket connection API references
    conf: 0.66
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/communications/socket/connect/attempt::connect-import
      - id: micro-behaviors/communications/socket/connect/attempt::connectx-symbol
      - id: micro-behaviors/communications/socket/connect/attempt::native-connect-wrapper-symbol
  - id: loopback-address
    desc: Connect-capable code references loopback address
    conf: 0.8
    any:
      - id: micro-behaviors/communications/ip/literal::loopback-ipv4-binary
      - id: micro-behaviors/communications/ip/literal::loopback-ipv4-source
      - id: micro-behaviors/communications/ip/literal::localhost-binary
      - id: micro-behaviors/communications/ip/literal::localhost-source
      - id: micro-behaviors/communications/ip/literal::loopback-ipv6-binary
      - id: micro-behaviors/communications/ip/literal::loopback-ipv6-source
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
