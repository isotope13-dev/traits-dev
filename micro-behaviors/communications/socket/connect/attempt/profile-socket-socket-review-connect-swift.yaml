defaults:
  crit: notable
  platforms: [macos, ios]
  for: [macho]
traits:
  - id: nwconnection-connect-source
    desc: NWConnection constructor call
    crit: notable
    conf: 0.92
    for: [swift]
    if:
      # Constructor arguments may themselves contain calls (NWEndpoint.Port).
      # A parsed invocation excludes comments and quoted source examples.
      type: symbol
      kind: call
      regex: '(^|\.)NWConnection$'
  - id: nwconnection-host
    desc: NWConnection host symbol text
    conf: 0.85
    if:
      type: symbol
      regex: "NWConnection.{0,80}host.{0,80}using"
composite_rules:
  - id: nwconnection-connect
    desc: Swift connection host and start clues
    conf: 0.85
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::nwconnection-host
      - id: micro-behaviors/communications/socket/connect/attempt::nwconnection-start
  - id: swift-nwconnection-bidirectional-channel
    desc: Swift NWConnection bidirectional channel
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::nwconnection-connect
      - id: micro-behaviors/communications/socket/send/message::nwconnection-send
      - id: micro-behaviors/communications/socket/receive::nwconnection-receive
