defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [ruby, javascript, typescript, python, pyc]
composite_rules:
  - id: outbound-connect-call
    desc: Outbound socket connect call (Ruby, Node, Deno, or Python)
    any:
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-socket-connect
      - id: micro-behaviors/communications/socket/connect/tcp::net-connect
      - id: micro-behaviors/communications/socket/connect/tcp::net-create-connection-call
      - id: micro-behaviors/communications/socket/connect/attempt::deno-connect-call
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-text
