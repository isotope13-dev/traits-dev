defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: epoll-socket-client-apis
    desc: Epoll socket client API combination
    crit: notable
    conf: 0.94
    # Ncat and other ordinary asynchronous clients use the same APIs as
    # scanners. Imports do not establish a sweep or nonblocking arguments.
    # Preserve the existing bounded profile for its ADB exploit consumer.
    size_max: 8388608
    all:
      # Require a client import rather than a runtime exporting connect.
      - id: micro-behaviors/communications/socket/connect/attempt::connect-import
      - id: micro-behaviors/os/event/epoll::epoll-usage
      - id: micro-behaviors/communications/socket/connect/attempt::connect
      - id: micro-behaviors/communications/ip/parse::inet-addr-symbol
      - id: micro-behaviors/fs/file/handle::fcntl
    any:
      - id: micro-behaviors/communications/ip/endpoint::ipv4-port-format-string
      - id: micro-behaviors/communications/socket/diagnostic::connection-status-strings
      - id: micro-behaviors/communications/socket/options::options-get
    needs: 2
