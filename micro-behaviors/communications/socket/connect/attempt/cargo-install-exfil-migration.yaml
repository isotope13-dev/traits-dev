defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
composite_rules:
- id: setup-py-install-raw-socket-exfil
  desc: Install hook, socket and host query clues
  crit: suspicious
  conf: 0.96
  scope: leaf
  for:
  - python
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/communications/socket/connect/attempt::python-connect-ip-port
  any:
  - id: micro-behaviors/os/sysinfo/platform/host::platform-system
  - id: micro-behaviors/os/sysinfo/platform/kernel::python-uptime-check
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
