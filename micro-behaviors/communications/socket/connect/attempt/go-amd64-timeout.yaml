defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  # Go register ABI: RSI = timeout, RAX = network pointer, RBX = length.
  # Addresses and call displacement vary with the compiler and obfuscation.
  - id: go-five-second-network-call-setup
    desc: Go timed three-byte network call setup
    crit: notable
    conf: 0.85
    if:
      type: hex
      section: .text
      pattern: '48 BE 00 F2 05 2A 01 00 00 00 48 8D 05 ?? ?? ?? ?? BB 03 00 00 00 E8'
