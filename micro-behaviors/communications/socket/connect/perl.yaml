# Perl socket dial primitives.
defaults:
  for: [perl]
  platforms: [linux, macos, windows]
traits:
  - id: perl-io-socket-inet-client
    desc: Perl IO::Socket::INET client connection
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'IO::Socket::INET->new\s*\([^)]{0,320}\bPeer(Addr|Host)\s*=>'
