defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
  for: [ruby]
traits:
  - id: ruby-socket-connect
    desc: Connects a socket in Ruby
    if:
      type: text
      regex: '\b(TCPSocket\.(open|new)|Socket\.tcp|connect_nonblock)\b'
  - id: ruby-tcp-socket
    desc: Ruby TCPSocket class reference
    conf: 0.9
    if:
      type: string_literal
      substr: TCPSocket
