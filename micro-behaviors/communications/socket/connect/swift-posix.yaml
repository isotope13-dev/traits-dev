defaults:
  platforms: [macos]
  for: [swift]
traits:
- id: swift-posix-connect-call
  desc: Swift POSIX connect call syntax
  crit: notable
  conf: 0.9
  if:
    # Swift facts currently omit arguments and render Darwin..connect.
    # Match the call node itself to require the unlabeled POSIX arguments.
    type: tree-sitter
    kind: call
    regex: '^(Darwin\.)?connect\s*\([^,\n():]{1,80},[^,\n():]{1,80},'
