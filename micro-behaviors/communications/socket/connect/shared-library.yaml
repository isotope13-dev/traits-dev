# Socket client behaviour observed in a shared library rather than an
# executable. Neutral on its own: networking, IPC and event-loop libraries
# (libcurl, libevent, libgio, libassuan, libgpgme) all create and connect
# sockets as their published purpose. Supply-chain composites pair this with
# further evidence -- exec, embedded key constants, duplicated high-entropy
# strings -- to make the liblzma/xz argument.
defaults:
  platforms: [linux, macos, windows]
  for: [so, dylib, dll]
composite_rules:
  - id: library-socket-client
    desc: Shared library creates and connects sockets
    crit: notable
    conf: 0.6
    all:
      - id: micro-behaviors/communications/socket/create::create
      - id: micro-behaviors/communications/socket/connect::connect
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/signed/platform::apple
      - id: well-known/app/ai/tool-server/mcu-ai-debug/
      - id: well-known/tool/sysadmin/alpine-packages::alpine-filebrowser-binary
      # A PT_INTERP marks an ELF executable (shared libraries have none).
      - id: metadata/binary/linking/runtime::interpreter
