# Linux SuperH: PC-relative mov.w loads __NR_connect (342) into r3.
# The fixed gap binds the literal to the instruction, rather than merely
# finding a trap and an unrelated syscall number somewhere in the binary.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [superh]
traits:
  - id: superh-glibc-connect-syscall
    desc: SuperH glibc direct connect syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: "4A 93 13 C3 0B 20 0B 20 0B 20 0B 20 0B 20 [138] 56 01"
composite_rules:
  - id: superh-direct-network-client
    desc: SuperH socket and connect syscall wrappers
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/create::superh-glibc-socket-syscall
      - id: superh-glibc-connect-syscall
