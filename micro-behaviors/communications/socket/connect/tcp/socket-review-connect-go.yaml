defaults:
  platforms: [windows, unix]
  for: [go]
  mbc: C0001
  attack: T1071
traits:
  - id: dial-timeout-tcp
    desc: Go net.DialTimeout call specifies TCP
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: net.DialTimeout
      arg:
        index: 0
        kind: string
        regex: '^tcp[46]?$'
