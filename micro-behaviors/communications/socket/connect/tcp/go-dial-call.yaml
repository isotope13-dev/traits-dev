defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-net-dial-tcp-call
    desc: Go net.Dial attempts a TCP connection
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: net.Dial
      arg:
        index: 0
        kind: string
        regex: '^tcp[46]?$'
