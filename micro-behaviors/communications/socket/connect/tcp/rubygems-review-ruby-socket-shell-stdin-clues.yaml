defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-socket-shell-stdin-clues
    desc: Ruby socket import with process or stdin clues
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/import/ruby/socket
    any:
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-tcp-exec-clues
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-socket-stdin-clues
    unless:
      - id: metadata/path/directory::test-directory-component
