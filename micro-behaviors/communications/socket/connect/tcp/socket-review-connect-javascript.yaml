defaults:
  crit: notable
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
traits:
  - id: net-connect
    desc: Node net.connect or createConnection usage
    conf: 0.86
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      # Include TypeScript's net_1.default alongside Node and esbuild aliases.
      regex: '\b(net|node_net|import_net)_?\d*(\.default)?\.(connect|createConnection)\s*\('
  - id: net-create-connection-call
    desc: Node net.createConnection call
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(net|node_net_[0-9]+|import_net[0-9]*\.default)\.createConnection$'
  - id: node-net-options-connect-call
    desc: Node net.connect call with options object
    conf: 0.9
    if:
      type: symbol
      kind: call
      # Figma Code Connect, database clients, and UI libraries also expose a
      # `.connect(options)` method.  Keep this atom on the Node net namespace
      # (including common compiler aliases) so the options-object shape is
      # evidence of a TCP dial rather than a generic method name.
      regex: '^(net|node_net_[0-9]+|import_net[0-9]*\.default)\.connect$'
      arg:
        kind: object
composite_rules:
  - id: node-net-options-connect
    desc: Node net module connects with an endpoint options object
    conf: 0.95
    all:
      - id: metadata/import/builtin::require-net
      - id: micro-behaviors/communications/socket/connect/tcp::node-net-options-connect-call
    near_bytes: 4096
  - id: node-net-socket-connect
    desc: Node net.Socket connects to remote endpoint
    conf: 0.92
    all:
      - id: micro-behaviors/communications/socket/create::net-socket-connect-method
      - id: micro-behaviors/communications/socket/connect/attempt::node-bound-socket-connect
    near_bytes: 2048
