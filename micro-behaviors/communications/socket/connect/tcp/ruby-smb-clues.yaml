defaults:
  platforms: [unix, appliance, windows]
  for: [ruby]

traits:
  - id: ruby-smb-tcp-port
    desc: Ruby TCP socket with SMB port reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'TCPSocket\.new[\s\S]{0,120}SMB_PORT'
    unless:
      - id: well-known/app/infrastructure/puppet-bolt::bolt-orchestration-context

composite_rules:
  - id: ruby-smb-socket-header-clues
    desc: Ruby SMB socket and header clues
    crit: notable
    conf: 0.98
    all:
      - id: ruby-smb-tcp-port
      - id: metadata/file/profile/smb-protocol::ruby-smb-header-bytes
