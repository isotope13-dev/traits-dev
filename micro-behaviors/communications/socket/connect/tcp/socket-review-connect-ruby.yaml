defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
  # shell: scripts commonly carry `ruby -rsocket -e '...'` one-liners.
  for: [ruby, shell]
traits:
  - id: ruby-socket-connect
    desc: Connects a socket in Ruby
    if:
      type: text
      regex: '\b(TCPSocket\.(open|new)|Socket\.tcp|connect_nonblock)\b'
