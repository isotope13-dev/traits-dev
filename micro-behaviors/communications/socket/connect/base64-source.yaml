# The extractor can recover only portions of independently encoded PHP string
# fragments. Recognize the complete sextets of connect( at each alignment as
# a fallback. This is API text, not proof of an outbound shell by itself.
defaults:
  platforms: [unix, windows]
  for: [html, php, javascript]
traits:
  - id: base64-connect-call-text
    desc: Base64 encodes socket connect call text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'Y29ubmVjdC|Nvbm5lY3Qo|jb25uZWN0K'
