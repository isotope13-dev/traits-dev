# Socket Connect - Python
# MBC: C0001 (Socket Communication)
# ATT&CK: T1071
defaults:
  platforms: [windows, unix]
  for: [python, pyc]
  attack: T1071
  mbc: C0001
traits:
- id: socket-connect-call
  desc: socket.connect() call
  crit: notable
  conf: 0.75
  if:
    type: symbol
    exact: "socket.connect"
- id: socket-create-connection-call
  desc: Python socket create_connection call
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: '^_?socket\.create_connection$'
  unless:
    - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: socket-create-connection-text
  desc: Python socket create_connection in text
  crit: notable
  conf: 0.85
  for: [python, text]
  if:
    type: text
    # Word-bound: a bare substring also matched `websocket.create_connection(`.
    regex: '(^|[^\w.])_?socket\.create_connection\('
# A bare `connect` co_name asserted a socket connect the matcher never checked
# -- DB drivers, ORM sessions and Qt/GObject signal wiring all intern that name,
# so any .pyc that mentions `connect` claimed network behaviour. Require the
# socket module name within 96 bytes instead: marshal packs one code object's
# co_names contiguously, so `socket.socket()` followed by `sock.connect(...)`
# lands both names in the same run. Also covers create_connection/connect_ex.
- id: socket-connect-pyc-name
  desc: socket module near connect in bytecode
  crit: notable
  conf: 0.8
  for: [pyc]
  if:
    type: raw
    regex: '\bsocket\b[\s\S]{0,96}\bconnect\b'
- id: socket-connect-ex-call
  desc: socket.connect_ex() call (non-blocking)
  crit: notable
  conf: 0.75
  if:
    type: symbol
    exact: "socket.connect_ex"
- id: socket-connect-ex-pyc-name
  desc: socket connect_ex name in Python bytecode
  crit: notable
  conf: 0.7
  for: [pyc]
  if:
    type: text
    substr: connect_ex
- id: create-connection-method-call
  desc: Calls a create_connection method
  crit: notable
  conf: 0.86
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '\.create_connection$'
  # socket.create_connection and websocket.create_connection have canonical
  # atoms; this is every other client's (asyncio loops, third-party
  # libraries). A `not:` on the symbol value did not filter call symbols.
  unless:
    - id: socket-create-connection-call
    - id: micro-behaviors/communications/websocket/library::websocket-client-create-connection

composite_rules:
- id: socket-client-operations
  desc: Client socket operations
  any:
  - {id: socket-connect-call}
  - {id: socket-connect-ex-call}
  - {id: micro-behaviors/communications/socket/connect::socket-connect-method}
- id: connect-python
  desc: Initiate socket connection (Python)
  crit: notable
  conf: 0.75
  all:
  - {id: micro-behaviors/communications/socket/create::socket-creation}
  - {id: socket-client-operations}
