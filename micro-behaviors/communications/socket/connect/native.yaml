# One matcher for the same call in PHP and native socket wrappers.
# The helper spelling, not the source language, defines this observation.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, php]

traits:
  - id: socket-connect-function-call
    desc: Calls socket_connect function
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: socket_connect
