# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - perl
  - static-lib
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.92
traits:
- id: perl-sockaddr-in-connect
  desc: Perl sockaddr_in socket connect
  if:
    type: text
    regex: connect\s*\(\w+\s*,\s*sockaddr_in\(
