# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - perl
  - static-lib
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.92
traits:
- id: perl-sockaddr-in-connect
  desc: Perl sockaddr_in socket connect
  if:
    type: text
    regex: connect\s*\(\w+\s*,\s*sockaddr_in\(
- id: perl-packed-sockaddr-connect
  desc: Perl packed sockaddr socket connect
  if:
    type: text
    regex: 'connect\s*\(\s*\$?\w+\s*,\s*pack\s*\(?\s*[''"]S\s*n\s*[Aa]4\s*x8'
