defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-reconnecting-loop
    desc: Ruby TCP loop with retry delay
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call method: (identifier) @loop block: (do_block body: (body_statement
            (_ (assignment right: (call receiver: (constant) @tcp method: (identifier) @connect)))
            (call method: (identifier) @sleep arguments: (argument_list (integer) @delay))))) @retry
         (#eq? @loop "loop") (#eq? @tcp "TCPSocket") (#match? @connect "^(new|open)$")
         (#eq? @sleep "sleep") (#match? @delay "^[1-9][0-9]*$"))
