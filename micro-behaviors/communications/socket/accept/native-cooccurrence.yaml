# Exporting accept and containing lookup/send APIs does not prove an accept
# hook, descriptor transfer, or session relay. C runtimes provide these APIs.
defaults:
  crit: notable
  conf: 0.95
  platforms: [unix]
  for: [elf, so]

composite_rules:
  - id: accept-export-with-dlsym
    desc: Exports accept and contains dlsym API
    all:
      - id: native-accept-export
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
  - id: accept-export-with-dlsym-sendmsg
    desc: Exports accept beside dlsym and sendmsg APIs
    all:
      - id: accept-export-with-dlsym
      - id: micro-behaviors/communications/socket/send::sendmsg-symbol
  - id: accept-export-with-auth-daemon-paths
    desc: Accept/dlsym APIs beside auth-daemon paths
    all:
      - id: accept-export-with-dlsym
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-references
  - id: accept-sendmsg-with-auth-daemon-paths
    desc: Accept/sendmsg APIs beside auth-daemon paths
    all:
      - id: accept-export-with-auth-daemon-paths
      - id: accept-export-with-dlsym-sendmsg
