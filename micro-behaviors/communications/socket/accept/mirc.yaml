defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-sockaccept-command
    desc: mIRC accepts an inbound socket
    crit: notable
    conf: 0.88
    for: [mirc, ircii]
    if:
      type: text
      regex: '(?i)(^|[\s;{|=])\.?/?sockaccept\s+[A-Za-z%$]'

