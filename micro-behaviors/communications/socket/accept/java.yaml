defaults:
  crit: notable
  platforms: [unix, windows]
  for: [java, class, kotlin]
  mbc: C0001

traits:
  # Source syntax alone does not identify the receiver class. Bytecode
  # below uses the owner-qualified ServerSocket method reference.
  - id: java-socket-accept
    desc: Java zero-argument accept call syntax
    conf: 0.85
    for: [java, kotlin]
    if:
      type: text
      regex: '\.accept\s*\(\s*\)'

  # Match the owner-qualified method reference, not a Socket return type.
  - id: java-socket-accept-bytecode
    desc: Java ServerSocket.accept method reference
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/net/ServerSocket.accept

composite_rules:
  # Source and bytecode spellings of the same observation, so callers can
  # require "this code accepts a connection" without picking a form.
  - id: java-accepts-connection
    desc: Java accept call syntax or ServerSocket API reference
    conf: 0.85
    any:
      - id: java-socket-accept
      - id: java-socket-accept-bytecode
