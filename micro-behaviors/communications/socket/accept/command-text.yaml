defaults:
  platforms: [windows]
  crit: notable
traits:
  - id: source-accept-call
    desc: Native accept call
    crit: notable
    conf: 0.85
    for: [c, cpp, html, text]
    if:
      type: text
      # The Winsock call is a lowercase free-function `accept(` used as a
      # call (after `=`, `(`, `;`, `return`, ...). C++ also names parser
      # and visitor methods `accept` (nlohmann `bool accept(...)`,
      # RapidJSON `value.Accept(handler)`): a declaration follows a type
      # name and a member call follows `.`/`->`, so neither context is
      # admitted here. Managed sockets keep the empty-argument
      # `.Accept()` receiver form; a visitor call always passes a handler.
      regex: '(^|[=(\[{;:]) *accept *\(|return +accept *\(|\.Accept\( *\)|(?i:invoke +accept)'

