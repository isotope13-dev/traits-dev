defaults:
  crit: notable
  mbc: C0001
  platforms: [linux, macos]
  # Native socket symbols and the historical C/C++ accept64 fallback scope.
  for: [elf, macho, so, dylib, static-lib, c, cpp]
traits:
  - id: accept-sym
    desc: References accept socket API
    conf: 0.6
    # Source definitions and calls named `accept` are ambiguous; the sibling
    # C/C++ source trait validates the socket API's three-argument call shape.
    for: [elf, macho, so, dylib, static-lib]
    if:
      type: symbol
      exact: accept
  - id: accept64-sym
    desc: accept64 function symbol
    conf: 0.6
    if:
      type: symbol
      regex: accept64
composite_rules:
  - id: accept-func
    desc: Accept connection function
    conf: 0.6
    any:
      - id: accept-sym
      - id: accept64-sym
  - id: accepting-server-api-surface
    for: [elf, macho]
    desc: POSIX accepting socket server API surface
    conf: 0.84
    all:
      - id: micro-behaviors/communications/socket/listen::server-api-surface
    any:
      - id: accept-sym
      - id: micro-behaviors/communications/socket/accept::accept-call-source
