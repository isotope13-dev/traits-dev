defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
  mbc: C0001

traits:
  - id: accept-go
    desc: Go zero-argument Accept method call
    conf: 0.92
    if:
      type: tree-sitter
      kind: call
      # net.Listener.Accept takes no arguments. Matching every .Accept call
      # mislabeled parser/AST visitor dispatch such as tree.Accept(visitor) as
      # network activity.
      regex: '\.Accept\s*\(\s*\)$'
