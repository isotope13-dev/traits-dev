# Testing and developer tools classify the hosts they are pointed at
# (loopback, private, tunnel, public) with a chain of endsWith checks. The
# tunnel domains in that chain are a lookup list, not endpoints the program
# contacts. Three or more in one file is the classifier; one is a mention.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: trycloudflare-suffix-endswith-check
    desc: Hostname tested for trycloudflare suffix
    if:
      type: text
      regex: 'endsWith\(["'']\.trycloudflare\.com["'']\)'
  - id: ngrok-suffix-endswith-check
    desc: Hostname tested for ngrok suffix
    if:
      type: text
      regex: 'endsWith\(["'']\.ngrok(-free)?\.(io|app)["'']\)'
  - id: localtunnel-suffix-endswith-check
    desc: Hostname tested for localtunnel suffix
    if:
      type: text
      regex: 'endsWith\(["'']\.(loca\.lt|localtunnel\.me)["'']\)'
  - id: serveo-suffix-endswith-check
    desc: Hostname tested for serveo suffix
    if:
      type: text
      regex: 'endsWith\(["'']\.serveo\.net["'']\)'

composite_rules:
  - id: tunnel-suffix-endswith-check
    desc: Hostname tested against tunnel domain suffixes
    needs: 3
    any:
      - id: trycloudflare-suffix-endswith-check
      - id: ngrok-suffix-endswith-check
      - id: localtunnel-suffix-endswith-check
      - id: serveo-suffix-endswith-check
