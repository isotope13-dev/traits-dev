# Diagnostics from a client that walks a list of upstream accounts until one
# authenticates. Mirrors and download helpers rotate accounts too; intent comes
# from an objective that combines this with other behavior.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: account-list-rotation-diagnostic
    desc: Cycles a list of upstream accounts
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)(no working account in list|cred: id list empty|cred: id page)'
