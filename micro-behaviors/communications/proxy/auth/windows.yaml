defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust]
  attack: T1071.001

traits:
  - id: winhttp-auth-schemes-query
    desc: Queries HTTP authentication schemes with WinHTTP
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: WinHttpQueryAuthSchemes

  - id: winhttp-credential-retry
    desc: Supplies negotiated credentials through WinHTTP
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: WinHttpSetCredentials

  - id: winhttp-proxy-auth-failure-branch
    desc: Handles HTTP proxy authentication failure status
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b407\b.{0,64}(WinHttpQueryAuthSchemes|WinHttpSetCredentials)'

  - id: winhttp-integrated-auth-schemes
    desc: Selects Windows Negotiate or NTLM authentication
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'WINHTTP_AUTH_SCHEME_(NEGOTIATE|NTLM)'

composite_rules:
  - id: windows-integrated-proxy-auth
    desc: WinHTTP proxy-authentication negotiation and retry
    crit: notable
    conf: 0.97
    all:
      - id: winhttp-auth-schemes-query
      - id: winhttp-credential-retry
    any:
      - id: winhttp-proxy-auth-failure-branch
      - id: winhttp-integrated-auth-schemes
