defaults:
  crit: notable
  conf: 0.95
  platforms: [windows, linux, macos]
  for: [scripts, csharp, c, cpp, go, rust]

traits:
  - id: vscode-remote-tunnel
    desc: VS Code remote tunnel command
    if:
      type: text
      regex: '(?i)\bcode(-insiders)?(\.exe)?["'']?\s+(tunnel\b|[^\r\n]{0,20}--server-tunnel\b)'

  - id: vscode-tunnel-service-install
    desc: VS Code tunnel service registration
    attack: T1543,T1572
    if:
      type: text
      regex: '(?i)\bcode(-insiders)?(\.exe)?["'']?\s+tunnel\s+service\s+install\b'

  - id: vscode-tunnel-service-system-debug-path
    desc: VS Code tunnel service from Windows debug
    crit: suspicious
    conf: 0.94
    platforms: [windows]
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\bWindows\\debug\\code(-insiders)?(\.exe)?["'']?\s+tunnel\s+service\s+install\b'
