# Node forward-command shape: a switch case dispatching a forward/direct
# command paired with a connect/forward/tunnel call carrying a dotted
# host/port target.  Each leg alone is neutral handler vocabulary (a
# webhook-replay CLI dispatches `forward` and threads loopback-defaulted
# host/port options through URL builders); the tunnel/proxy objective
# pairs them before inferring a remote forward target.  URL builders
# taking bare (undotted) host/port fields match neither leg.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  attack: T1090
  mbc: C0003

traits:
  - id: node-forward-command-case
    desc: Switch case dispatches forward or direct command
    conf: 0.85
    if:
      type: text
      regex: 'case\s+["''](direct|forward)["'']'
  - id: node-forward-target-call
    desc: Forwarding call passes host and port target
    if:
      type: text
      regex: '(connect|forward|tunnel)\w*\(.{0,80}\.host.{0,80}\.port'
      case_insensitive: true
