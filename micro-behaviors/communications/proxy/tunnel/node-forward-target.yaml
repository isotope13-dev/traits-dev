# A switch case selecting a direct/forward command is neutral vocabulary.
# Consumers pair it with the call-syntax observation under
# metadata/lang/source/syntax/call before inferring a forward-target handler.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  attack: T1090
  mbc: C0003

traits:
  - id: node-forward-command-case
    desc: Switch case dispatches forward or direct command
    conf: 0.85
    if:
      type: text
      regex: 'case\s+["''](direct|forward)["'']'
