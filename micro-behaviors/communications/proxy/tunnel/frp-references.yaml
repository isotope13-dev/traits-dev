defaults:
  platforms:
  - windows
  - linux
  - macos
traits:
- for:
  - shell
  - python
  - javascript
  - php
  - powershell
  - batch
  - systemd-service
  - github-actions
  size_max: 524288000
  id: frp-command-config-name-reference
  desc: FRP command or configuration name reference
  crit: notable
  conf: 0.9
  size_min: 1
  if:
    type: text
    regex: \bfrp[cs](\.(ini|toml))?\b
