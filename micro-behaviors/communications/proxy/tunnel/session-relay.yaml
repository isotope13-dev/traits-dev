# Session-multiplexed reverse relays use one connection for control messages and
# register separate data streams with the same session identifier.  Keep the
# opcode atoms language-neutral; objective rules add SOCKS and C2 context.
defaults:
  platforms: [unix, windows, android]
  for: [source, elf, macho, pe]
  attack: T1090,T1572

traits:
  - id: relay-session-open-opcode
    desc: Relay protocol session-open opcode
    crit: component
    conf: 0.94
    if:
      type: string_literal
      regex: '(?i)^(relay|proxy|tunnel)[_-](new|open|create):'

  - id: relay-session-data-opcode
    desc: Relay protocol data-stream registration opcode
    crit: component
    conf: 0.94
    if:
      type: string_literal
      regex: '(?i)^(relay|proxy|tunnel)[_-](data|stream):'

composite_rules:
  - id: session-separated-relay-protocol
    desc: Relay protocol separates session control and data streams
    crit: notable
    conf: 0.97
    all:
      - id: relay-session-open-opcode
      - id: relay-session-data-opcode
