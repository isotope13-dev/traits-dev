# Cross-language mechanics of a server-controlled WebSocket relay.  These
# atoms describe protocol structure and API shapes; malicious intent is
# inferred only by the command-and-control composites that combine them.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, python]
  attack: T1090,T1572

traits:
  - id: relay-frame-type
    desc: Relay frame message-type field
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: type

  - id: relay-frame-msg-type
    desc: Relay frame message-type variable
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: msg_type

  - id: relay-frame-connection-id
    desc: Relay frame connection identifier
    crit: component
    conf: 0.92
    if:
      type: symbol
      kind: identifier
      exact: conn_id

  - id: relay-frame-connection-id-alt
    desc: Relay frame connection identifier variable
    crit: component
    conf: 0.92
    if:
      type: symbol
      kind: identifier
      exact: connection_id

  - id: relay-frame-flags-field
    desc: Relay frame flags or status field
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: flags

  - id: relay-frame-data-length
    desc: Relay frame data-length field
    crit: component
    conf: 0.92
    if:
      type: symbol
      kind: identifier
      exact: data_len

  - id: relay-frame-payload-length
    desc: Relay frame payload-length variable
    crit: component
    conf: 0.92
    if:
      type: symbol
      kind: identifier
      exact: payload_length

  - id: socks5-domain-connect-constant
    desc: Source encodes a SOCKS5 domain CONNECT request
    crit: notable
    conf: 0.96
    for: [c, cpp]
    if:
      type: text
      regex: '0x05\s*,\s*0x01\s*,\s*0x00\s*,\s*0x03'

  - id: socks5-domain-type-constant
    desc: Source defines a SOCKS5 domain-address type
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\b(ATYP|SOCKS5)[A-Z_]*\s*=\s*0x03\b'

  - id: relay-channel-recv-function
    desc: Relay receives on a native channel
    crit: notable
    conf: 0.82
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: recv

  - id: relay-channel-recv-method
    desc: Named relay channel recv method
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(ws|websocket|channel|relay)\.recv$'

  - id: relay-channel-send-function
    desc: Relay sends on a native channel
    crit: notable
    conf: 0.82
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: send

  - id: relay-channel-send-method
    desc: Named relay channel send method
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(ws|websocket|channel|relay)\.send$'

  - id: relay-channel-sendall-method
    desc: Named relay channel sendall
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(ws|websocket|channel|relay)\.sendall$'

  - id: relay-target-connect-function
    desc: Relay opens an outbound native socket
    crit: notable
    conf: 0.86
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: connect

  - id: relay-target-connect-method
    desc: Client API opens outbound relay socket
    crit: notable
    conf: 0.86
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.create_connection$'

composite_rules:
  - id: relay-frame-type-field
    desc: Relay frame type field
    crit: component
    conf: 0.9
    any:
      - id: relay-frame-type
      - id: relay-frame-msg-type

  - id: relay-frame-connection-id-field
    desc: Relay frame connection ID field
    crit: component
    conf: 0.92
    any:
      - id: relay-frame-connection-id
      - id: relay-frame-connection-id-alt

  - id: relay-frame-length-field
    desc: Relay frame payload length field
    crit: component
    conf: 0.92
    any:
      - id: relay-frame-data-length
      - id: relay-frame-payload-length

  - id: websocket-relay-frame-layout
    desc: Multiplexed relay frame layout
    crit: notable
    conf: 0.96
    all:
      - id: relay-frame-type-field
      - id: relay-frame-connection-id-field
      - id: relay-frame-flags-field
      - id: relay-frame-length-field
    near_bytes: 512

  - id: socks5-domain-connect-encoding
    desc: SOCKS5 domain-target encoding
    crit: notable
    conf: 0.95
    any:
      - id: socks5-domain-connect-constant
      - id: socks5-domain-type-constant

  - id: websocket-channel-bidirectional-copy
    desc: Bidirectional channel data transfer
    crit: notable
    conf: 0.93
    any:
      - id: native-channel-bidirectional-copy
      - id: object-channel-bidirectional-copy

  - id: native-channel-bidirectional-copy
    desc: Native channel receives and sends data
    crit: notable
    conf: 0.93
    all:
      - id: relay-channel-recv-function
      - id: relay-channel-send-function

  - id: object-channel-bidirectional-copy
    desc: Channel object receives and sends data
    crit: notable
    conf: 0.93
    all:
      - id: relay-channel-recv-method
    any:
      - id: relay-channel-send-method
      - id: relay-channel-sendall-method

  - id: websocket-target-connect
    desc: WebSocket relay opens an outbound target connection
    crit: notable
    conf: 0.94
    any:
      - id: relay-target-connect-function
      - id: relay-target-connect-method
