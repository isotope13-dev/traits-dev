# Cross-language mechanics of a server-controlled WebSocket relay.  These
# atoms describe protocol structure and API shapes; malicious intent is
# inferred only by the command-and-control composites that combine them.
defaults:
  platforms: [windows, unix]
  for: [python, source]
  attack: T1090,T1572

traits:
  - id: relay-frame-type
    desc: Relay-context message-type token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)_?type\b'

  - id: relay-frame-msg-type
    desc: Relay-context message-type variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}msg_type\b'

  - id: relay-frame-connection-id
    desc: Relay-context connection identifier
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}conn_id\b'

  - id: relay-frame-connection-id-alt
    desc: Relay-context connection identifier variable
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}connection_id\b'

  - id: relay-frame-stream-id
    desc: Relay-context stream identifier
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}stream_id\b'

  - id: relay-frame-data-length
    desc: Relay-context data-length field
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}data_len\b'

  - id: relay-frame-payload-length
    desc: Relay-context payload-length variable
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(relay|websocket|socks|proxy|tunnel)\w{0,16}payload_length\b'

  - id: socks5-domain-connect-constant
    desc: Source encodes a SOCKS5 domain CONNECT request
    crit: notable
    conf: 0.96
    for: [c, cpp]
    if:
      type: text
      regex: '0x05\s*,\s*0x01\s*,\s*0x00\s*,\s*0x03'

  - id: socks5-domain-type-constant
    desc: Source defines a SOCKS5 domain-address type
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\b(ATYP|SOCKS5)[A-Z_]*\s*=\s*0x03\b'

  - id: relay-channel-recv-method
    desc: Named channel recv method call
    crit: component
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(ws|websocket|channel|relay)\.recv$'

  - id: relay-channel-send-method
    desc: Named channel send method call
    crit: component
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(ws|websocket|channel|relay)\.send$'

  - id: relay-channel-sendall-method
    desc: Named channel sendall method call
    crit: component
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(ws|websocket|channel|relay)\.sendall$'

  - id: relay-target-connect-method
    desc: Client API create_connection call
    crit: component
    conf: 0.86
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.create_connection$'

composite_rules:
  - id: relay-frame-type-field
    desc: Relay frame type field
    crit: component
    conf: 0.9
    any:
      - id: relay-frame-type
      - id: relay-frame-msg-type

  - id: relay-frame-connection-id-field
    desc: Relay frame stream identifier field
    crit: component
    conf: 0.92
    any:
      - id: relay-frame-connection-id
      - id: relay-frame-connection-id-alt
      - id: relay-frame-stream-id

  - id: relay-frame-length-field
    desc: Relay frame payload length field
    crit: component
    conf: 0.92
    any:
      - id: relay-frame-data-length
      - id: relay-frame-payload-length

  - id: websocket-relay-frame-layout
    desc: Multiplexed relay frame layout
    crit: notable
    conf: 0.96
    all:
      - id: relay-frame-type-field
      - id: relay-frame-connection-id-field
      - id: relay-frame-length-field
    near_bytes: 2048

  - id: socks5-domain-connect-encoding
    desc: SOCKS5 domain-target encoding
    crit: notable
    conf: 0.95
    any:
      - id: socks5-domain-connect-constant
      - id: socks5-domain-type-constant

  - id: websocket-channel-bidirectional-copy
    desc: Bidirectional channel data transfer
    crit: notable
    conf: 0.93
    any:
      - id: native-channel-bidirectional-copy
      - id: object-channel-bidirectional-copy
      - id: python-socket-bidirectional-copy

  - id: python-socket-bidirectional-copy
    desc: Python sockets receive and send stream data
    crit: notable
    conf: 0.94
    for: [python]
    all:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/communications/socket/send::python-sendall

  - id: native-channel-bidirectional-copy
    desc: Source calls recv and send
    crit: component
    conf: 0.93
    all:
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/communications/socket/send::send-symbol

  - id: object-channel-bidirectional-copy
    desc: Channel object receives and sends data
    crit: notable
    conf: 0.93
    all:
      - id: relay-channel-recv-method
    any:
      - id: relay-channel-send-method
      - id: relay-channel-sendall-method

  - id: websocket-target-connect
    desc: Opens an outbound target connection
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: relay-target-connect-method
