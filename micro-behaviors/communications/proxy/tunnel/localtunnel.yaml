# Localtunnel client integration vocabulary. Apps that bundle the localtunnel
# npm client as an opt-in tunnel provider carry its own status, provider, and
# debug strings (client error text, provider selection, client debug
# namespace). That is a neutral client capability: objectives that see C2
# infrastructure in the bare endpoint add their own beaconing or execution
# context. Any two of the three establish the client; a bare endpoint with a
# single marker stays suspicious.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: localtunnel-client-error-text
    desc: Localtunnel client error strings
    if:
      type: text
      regex: 'Localtunnel (exited|timeout)|localtunnel server returned an error'

  - id: localtunnel-provider-selection-text
    desc: Localtunnel provider selection strings
    if:
      type: text
      regex: 'tunnelProvider|createLocaltunnel'

  - id: localtunnel-debug-namespace
    desc: Localtunnel client debug namespace
    if:
      type: text
      substr: 'localtunnel:client'

composite_rules:
  - id: localtunnel-client-context
    desc: Localtunnel client integration context
    any:
      - id: localtunnel-client-error-text
      - id: localtunnel-provider-selection-text
      - id: localtunnel-debug-namespace
    needs: 2
