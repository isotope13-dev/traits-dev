# The bare word "tunnel" in JVM code is tunneling vocabulary, nothing more:
# SSH clients (port forwarding), VPN frontends and proxy tools all say it.
# Keep it a component — channel composites supply the protocol around it that
# makes tunneling evidence mean C2.
defaults:
  platforms: [windows, unix]
  for: [java, kotlin, class]
  crit: component
  conf: 0.55

traits:
  - id: java-tunnel-term
    desc: Java tunnel vocabulary
    if:
      type: text
      substr: tunnel
