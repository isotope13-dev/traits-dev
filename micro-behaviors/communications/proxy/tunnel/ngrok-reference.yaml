defaults:
  crit: notable
  platforms: [linux, macos, windows]
  size_min: 32
  size_max: 500000000
traits:
  - id: ngrok-name-reference
    desc: References the ngrok tunneling service
    conf: 0.6
    for: [go, c, cpp, elf, pe, macho]
    if:
      type: text
      word: ngrok
      case_insensitive: true
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/ui/qt
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: well-known/lib/network/public-suffix-list::public-suffix-list-content
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - type: text
        substr: ngrok
        case_insensitive: true
        section: .rsrc

      - id: "metadata/file/naming::test-directory-component"
