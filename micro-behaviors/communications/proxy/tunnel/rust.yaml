defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
  attack: T1572
traits:
  - id: rust-ngrok-session-builder
    desc: Rust ngrok session builder
    conf: 0.88
    if:
      type: text
      substr: ngrok::Session::builder()
  - id: rust-ngrok-authtoken
    desc: Rust ngrok auth token setup
    conf: 0.84
    if:
      type: text
      substr: .authtoken(
  - id: rust-ngrok-http-endpoint
    desc: Rust ngrok HTTP endpoint member access
    conf: 0.84
    if:
      type: symbol
      exact: session.http_endpoint
  - id: rust-ngrok-listen-and-forward
    desc: Rust ngrok listen-and-forward tunnel
    conf: 0.9
    if:
      type: text
      regex: 'session\s*\.\s*http_endpoint\s*\(\s*\)\s*\.\s*listen_and_forward\s*\('
composite_rules:
  - id: rust-ngrok-http-tunnel
    desc: Rust ngrok HTTP tunnel forwarding
    conf: 0.94
    all:
      - id: rust-ngrok-session-builder
      - id: rust-ngrok-listen-and-forward
    any:
      - id: rust-ngrok-authtoken
      - id: rust-ngrok-http-endpoint
