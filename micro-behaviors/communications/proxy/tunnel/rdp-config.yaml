defaults:
  for: [text]
  platforms: [windows, linux, macos]
  crit: component

traits:
  - id: reverse-proxy-server-address
    desc: Reverse proxy server address setting
    if:
      type: text
      regex: '(?m)^\s*server_addr\s*=\s*\S+'

  - id: reverse-proxy-remote-port
    desc: Reverse proxy remote port setting
    if:
      type: text
      regex: '(?m)^\s*remote_port\s*=\s*[0-9]+'

  - id: reverse-proxy-tcp
    desc: Reverse proxy TCP setting
    if:
      type: text
      regex: '(?m)^\s*type\s*=\s*tcp\s*$'

  - id: reverse-proxy-rdp-port
    desc: Reverse proxy local RDP port
    if:
      type: text
      regex: '(?m)^\s*local_port\s*=\s*3389\s*$'

composite_rules:
  - id: reverse-proxy-rdp-config
    desc: Reverse proxy configuration targets local RDP
    crit: suspicious
    near_lines: 20
    all:
      - id: reverse-proxy-server-address
      - id: reverse-proxy-remote-port
      - id: reverse-proxy-tcp
      - id: reverse-proxy-rdp-port
