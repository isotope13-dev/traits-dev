defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  - id: local-tunnel-start
    desc: Local tunnel bootstrap target
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'tunnel::start(&obfuscate!("http://127.0.0.1:80"))'
  - id: local-http-tunnel-server-one
    desc: "Local HTTP tunnel server selector one"
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'tunnel::server(1, &obfuscate!("http://127.0.0.1:80"), tunnel)'
  - id: local-http-tunnel-server-two
    desc: "Local HTTP tunnel server selector two"
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'tunnel::server(2, &obfuscate!("http://127.0.0.1:80"), tunnel)'
