defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript, go, csharp, java, c, cpp, rust]
  crit: notable

traits:
  - id: openconnect-fortinet-command
    desc: OpenConnect Fortinet tunnel command text
    conf: 0.95
    if:
      type: text
      regex: '(?s)\bopenconnect\b.{0,160}--protocol[= ''"]+fortinet([\s,''";)]|$)'
