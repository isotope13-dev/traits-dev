defaults:
  platforms: [windows, unix]
  for: [shell, batch, powershell, python, javascript, go]
  attack: T1090
  crit: notable
  conf: 0.86

traits:
  - id: cloudflared-binary-name
    desc: cloudflared binary reference
    crit: component
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: cloudflared

  - id: cloudflared-tunnel-subcommand
    desc: cloudflared tunnel subcommand
    crit: component
    conf: 0.84
    if:
      type: literal
      kind: string
      exact: tunnel

  - id: cloudflared-url-flag
    desc: cloudflared URL forwarding flag
    crit: component
    conf: 0.84
    if:
      type: literal
      kind: string
      exact: --url

  - id: trycloudflare-domain
    desc: References a trycloudflare tunnel domain
    crit: notable
    conf: 0.86
    if:
      type: literal
      kind: string
      substr: trycloudflare
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: metadata/file/catalog/identity::public-suffix-list
      - id: metadata/library/data::public-suffix-list-content

  - id: cloudflared-node-package-require
    desc: Node cloudflared package import
    crit: component
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'require\s*\(\s*["'']cloudflared["'']\s*\)'

  - id: cloudflared-node-quick-tunnel-api
    desc: Node cloudflared quick tunnel API
    crit: component
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Tunnel\.quick\s*\([\s\S]{0,80}localhost'

  - id: tunnel-run-token-command
    desc: Tunnel run command with token
    crit: notable
    conf: 0.91
    for: [scripts, systemd-service]
    platforms: [windows, linux]
    if:
      type: text
      regex: '(?i)\btunnel\s+run\b[^\r\n]{0,180}\s--token\b'

  - id: cloudflared-service-install-command
    desc: cloudflared service install subcommand
    # `cloudflared [tunnel] service install [TOKEN]` is the documented one-shot
    # that registers cloudflared as an OS service (Windows service / systemd
    # unit) and brings the outbound tunnel up — the persistence step behind an
    # attacker-registered "Cloudflared" service. Requires the literal binary
    # name adjacent to `service install` to stay precise.
    crit: notable
    conf: 0.9
    for: [scripts, systemd-service]
    platforms: [windows, linux]
    attack: T1543
    if:
      type: text
      regex: '(?i)\bcloudflared(\.exe)?\b[^\r\n]{0,80}\bservice\s+install\b'

  - id: cloudflare-tunnel-token-credential
    desc: Cloudflare tunnel token credential blob
    # A Cloudflare tunnel token is base64 of
    # {"a":"<account tag>","t":"<tunnel uuid>","s":"<secret>"} — so it always
    # begins `eyJhIjoi` (base64 of `{"a":"`) and runs well past 120 chars. It is
    # the one artifact that survives renaming the connector: an operator who
    # ships cloudflared.exe as svchost.exe still has to paste this token to
    # register the tunnel. Length floor keeps short base64 JSON off it.
    crit: notable
    conf: 0.9
    for: [scripts, systemd-service, pe]
    platforms: [windows, linux, macos]
    attack: T1572
    if:
      type: text
      regex: '\beyJhIjoi[A-Za-z0-9+/=_-]{120,}'

  - id: tunnel-connector-service-install-token
    desc: Tunnel connector service install with token
    # `<connector> service install <token>` registers the connector as an OS
    # service and authenticates the tunnel in one shot. Deliberately does NOT
    # require the `cloudflared` binary name — the sibling
    # cloudflared-service-install-command covers the named form and goes blind
    # the moment the connector is renamed, which is exactly what post-
    # exploitation tooling does. The long opaque token argument is what keeps
    # this off ordinary `service install` verbs; barring a separator from the
    # leading run keeps it off long filesystem paths.
    crit: notable
    conf: 0.9
    for: [scripts, systemd-service]
    platforms: [windows, linux]
    attack: T1543
    if:
      type: text
      regex: '(?i)\bservice\s+install\s+[A-Za-z0-9+_-]{20}[A-Za-z0-9+/=_-]{60,}'

  - id: cloudflared-systemd-service
    desc: Systemd service launches cloudflared
    crit: notable
    conf: 0.9
    for: [systemd-service]
    platforms: [linux]
    if:
      type: text
      regex: '(?i)\bExecStart=[^\r\n]{0,160}\bcloudflared(\.exe)?\b'

  - id: reverse-tunnel-term
    desc: Reverse-tunnel terminology
    crit: notable
    conf: 0.8
    for: [scripts]
    if:
      type: text
      regex: '(?i)\breverse[-_ ]+tunnel\b'
    unless:
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
      - id: metadata/library/runtime::legitimate-kubernetes-incluster-client-marker
      - id: metadata/package/testing/presence/harness::example-directory
      - id: metadata/package/testing/presence/harness::shell-example-directory

composite_rules:
  - id: cloudflared-local-service-tunnel
    desc: Cloudflared local service tunnel
    crit: notable
    conf: 0.9
    all:
      - id: cloudflared-binary-name
      - id: cloudflared-tunnel-subcommand
      - id: cloudflared-url-flag
  - id: cloudflared-node-quick-tunnel
    desc: Node cloudflared quick tunnel to localhost
    crit: notable
    conf: 0.9
    all:
      - id: cloudflared-node-package-require
      - id: cloudflared-node-quick-tunnel-api
  - id: tunnel-run-as-external-service
    desc: Tunnel run command paired with OS service registration
    crit: suspicious
    conf: 0.93
    for: [scripts, systemd-service]
    platforms: [windows, linux]
    all:
      - id: tunnel-run-token-command
    any:
      - id: micro-behaviors/os/service/config::powershell-binary-service-command
      - id: micro-behaviors/os/service/control::sc-create-command
      - id: micro-behaviors/os/service/config::exec-start-text
      - id: cloudflared-systemd-service

  - id: persistent-tunnel-service
    desc: Tunnel client configured as service
    crit: suspicious
    conf: 0.94
    for: [scripts, systemd-service]
    platforms: [windows, linux]
    any:
      # run-command staged into a separate service registration, or the
      # self-installing `cloudflared service install` one-shot — either under
      # the connector's own name or renamed, in which case the opaque tunnel
      # token is the leg that still identifies it.
      - id: tunnel-run-as-external-service
      - id: cloudflared-service-install-command
      - id: tunnel-connector-service-install-token
      - id: renamed-tunnel-connector-service-install

  - id: renamed-tunnel-connector-service-install
    desc: Cloudflare tunnel token registered as a service
    # Token credential plus any OS service registration: the connector binary
    # can be called anything at all and this still identifies the persistence
    # as a Cloudflare tunnel.
    crit: suspicious
    conf: 0.93
    for: [scripts, systemd-service]
    platforms: [windows, linux]
    attack: T1572,T1543
    all:
      - id: cloudflare-tunnel-token-credential
    any:
      - id: tunnel-connector-service-install-token
      - id: micro-behaviors/os/service/control::sc-create-command
      - id: micro-behaviors/os/service/config::powershell-binary-service-command
      - id: micro-behaviors/os/service/config::exec-start-text
      - id: cloudflared-systemd-service
