# Node.js WebSocket-to-TCP forwarding.  The combination is a neutral proxy
# capability; hostile intent belongs in objectives that add package or C2
# context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1090
  mbc: C0003

composite_rules:
  - id: node-websocket-tcp-bridge
    desc: Node WebSocket handler bridges traffic to a TCP connection
    crit: notable
    conf: 0.97
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/websocket/receive::websocket-message-event-handler
      - id: micro-behaviors/communications/socket/connect::node-named-create-connection
    any:
      - id: micro-behaviors/communications/socket/receive::node-socket-data-event
      - id: micro-behaviors/communications/socket/send::node-socket-write
