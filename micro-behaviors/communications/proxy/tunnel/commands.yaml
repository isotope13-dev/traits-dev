# Public tunnel commands are dual-use. Record the exposed transport at notable
# without treating local development and remote support tools as hostile.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.95

traits:
  - id: public-tunnel-command
    desc: Starts a public tunnel
    if:
      type: text
      regex: '(?i)\b(ngrok\s+(http|tcp)|tailscale\s+funnel|bore\s+local|frpc\s+-c)\b'

  - id: localtunnel-command
    desc: Starts a Localtunnel endpoint
    if:
      type: text
      regex: '(?i)(^|\s)(lt\s+--port|npx\b[^\n]{0,80}\blocaltunnel\s+--port)\b'

  - id: ssh-reverse-forward-command
    desc: Starts SSH reverse port forwarding
    if:
      type: text
      regex: '(?i)\bssh\b.{0,120}\s-[A-Za-z]*R\s*\d+:[A-Za-z0-9.:_-]{1,160}'
