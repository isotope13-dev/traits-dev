---
defaults:
  platforms:
  - windows
  - unix
  for:
  - shell
  - batch
  - powershell
  - python
  - javascript
  - go
  crit: notable
  conf: 0.86
traits:
- id: localhost-quick-tunnel-call
  desc: Quick tunnel call referencing localhost
  crit: notable
  conf: 0.86
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: Tunnel\.quick\s*\([\s\S]{0,80}localhost
- id: tunnel-run-token-command
  desc: Tunnel run command with token
  crit: notable
  conf: 0.91
  for:
  - scripts
  - systemd-service
  platforms:
  - windows
  - linux
  if:
    type: text
    regex: "(?i)\\btunnel\\s+run\\b[^\\r\\n]{0,180}\\s--token\\b"
