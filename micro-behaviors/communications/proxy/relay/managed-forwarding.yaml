# Co-occurrence does not establish an operator-selected destination or unwanted access.
defaults:
  for: [csharp]
  platforms: [windows, unix]
composite_rules:
  - id: csharp-looping-tcp-forwarding-clues
    desc: C# TCP, line-read and paired-copy clues with an unconditional loop
    crit: notable
    conf: 0.98
    attack: T1090,T1572
    all:
      - id: micro-behaviors/communications/socket/create::tcpclient-create
      - id: micro-behaviors/data/stream/create::csharp-getstream-call
      - id: micro-behaviors/data/stream/read::csharp-streamreader-constructor
      - id: micro-behaviors/data/stream/read::csharp-readline-call
      - id: micro-behaviors/communications/proxy/relay::csharp-split-host-port-connect
      - id: micro-behaviors/data/buffer/transfer::dotnet-multiple-copyto-calls
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
    any:
      - id: metadata/lang/source/naming/function/communication::dotnet-connect-async-method-token
      - id: micro-behaviors/communications/socket/create::tcpclient-connect

  - id: csharp-tcp-paired-copy-clues
    desc: C# TCP host:port and multiple CopyTo call clues
    crit: notable
    conf: 0.95
    attack: T1090,T1572
    mbc: B0030
    all:
    - id: micro-behaviors/communications/socket/create::tcpclient-create
    - id: micro-behaviors/data/stream/create::csharp-getstream-call
    - id: micro-behaviors/communications/proxy/relay::csharp-split-host-port-connect
    - id: micro-behaviors/data/buffer/transfer::dotnet-multiple-copyto-calls
  - id: dotnet-looping-line-read-forwarding-clues
    desc: .NET line-read, host:port and paired-transfer clues with a loop
    crit: notable
    conf: 0.98
    for: [csharp, powershell]
    attack: T1572,T1090
    mbc: B0030
    all:
      - id: micro-behaviors/communications/proxy/relay::dotnet-client-split-transfer-loop-clues
      - id: micro-behaviors/data/stream/read::dotnet-readline-call-clues
