composite_rules:
- for:
  - c
  - cpp
  crit: notable
  conf: 0.95
  size_min: 48
  size_max: 200000000
  id: tailcat-source-forward-peer
  desc: Source references tailcat peer forwarding
  all:
  - id: micro-behaviors/fs/path/basename::tailcat-binary-name
  - id: metadata/lang/source/literal::forward-command-fragment
  - id: micro-behaviors/communications/proxy/relay::tailcat-peer-address
- for:
  - scripts
  - c
  - cpp
  - go
  - pe
  - dll
  attack: T1572,T1090
  id: tailcat-peer-tunnel
  desc: Tailcat references with peer-forwarding clues
  crit: notable
  conf: 0.95
  any:
  - id: micro-behaviors/communications/proxy/relay::tailcat-command-peer
  - id: micro-behaviors/communications/proxy/relay::tailcat-source-forward-peer
- for:
  - scripts
  - c
  - cpp
  - go
  - pe
  - dll
  id: tailcat-hidden-launch-clues
  desc: Tailcat peer-forwarding and hidden-window clues
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/proxy/relay::tailcat-peer-tunnel
  any:
  - id: micro-behaviors/process/create/flags::sw-hide-token
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: micro-behaviors/process/create/hidden::powershell-hidden-window
  - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
- id: tailcat-command-peer
  desc: Tailcat command beside peer-forwarding address
  crit: notable
  conf: 0.95
  for:
  - c
  - cpp
  - go
  - go.mod
  - pe
  - dll
  - scripts
  all:
  - id: micro-behaviors/communications/proxy/relay::tailcat-subcommand
  - id: micro-behaviors/communications/proxy/relay::tailcat-forward-address
defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - c
  - cpp
  - go
  - go.mod
  - pe
  - dll
  - scripts
  crit: notable
  conf: 0.9
  size_min: 48
  size_max: 200000000
  id: tailcat-subcommand
  desc: tailcat tunnel subcommand invocation
  if:
    type: text
    regex: (?i)\btailcat(\.exe)?\s+(serve|forward|browse|listen)\b
- for:
  - c
  - cpp
  - go
  - go.mod
  - pe
  - dll
  - scripts
  crit: notable
  conf: 0.9
  size_min: 48
  size_max: 200000000
  id: tailcat-forward-address
  desc: Forward command with tc-prefixed address
  if:
    type: text
    regex: (?i)\b(forward|serve|browse)\b['"\s,]{1,4}tc[A-Za-z0-9_-]{40,}
- for:
  - c
  - cpp
  crit: notable
  conf: 0.9
  size_min: 48
  size_max: 200000000
  id: tailcat-peer-address
  desc: Source references tc-prefixed peer address token
  if:
    type: text
    regex: \btc[A-Za-z0-9_-]{40,}
