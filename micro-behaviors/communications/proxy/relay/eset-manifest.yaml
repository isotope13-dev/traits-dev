# A fixed-upstream update mirror can omit routing sections and unsupported
# signature resources. These mechanics do not establish a bypass of the
# client's signature verification, malicious update substitution, or C2.
defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: eset-manifest-filtering-relay-profile
    desc: ESET manifest filtering with signature-resource denial
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/response::x86-signed-suffix-404-response
      - id: micro-behaviors/data/collection/filter::x86-server-link-host-section-filter
      - id: micro-behaviors/communications/http/url/api-path::eset-update-manifest-path
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
