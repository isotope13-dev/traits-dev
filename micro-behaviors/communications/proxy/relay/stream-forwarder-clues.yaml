---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - python
  - go
  - rust
  - javascript
  crit: notable
  conf: 0.88
traits:
- id: proxy-bandwidth-accounting-counter
  desc: Proxied byte and session counters
  crit: notable
  conf: 0.92
  for:
  - binaries
  - scripts
  if:
    type: text
    regex: "(?i)[Bb]ytes[_]?[Pp]roxied|[Ss]essions[_]?[Hh]andled"
- id: powershell-indexed-host-port-connect
  desc: Connects TcpClient to indexed host and port
  crit: notable
  conf: 0.95
  for:
  - powershell
  if:
    type: text
    regex: '(?i)(\.Connect(Async)?|TcpClient)\s*\(\s*\$\w+\[0\]\s*,\s*(\[int\]\s*)?\$\w+\[1\]'
- id: csharp-indexed-host-port-connect
  desc: Connect call with indexed host and port
  crit: notable
  conf: 0.95
  for: [csharp]
  # Call facts do not expose nested index expressions. Splitting this into
  # nearby regexes loses the relationship to the same Connect call.
  if:
    type: tree-sitter
    query: |
      ((invocation_expression
        function: (member_access_expression name: (identifier) @connect)
        arguments: (argument_list
          (argument (element_access_expression
            (identifier)
            (bracketed_argument_list (argument (integer_literal) @zero))))
          (argument (invocation_expression
            function: (member_access_expression
              expression: [(identifier) (predefined_type)] @converter
              name: (identifier) @parse)
            arguments: (argument_list
              (argument (element_access_expression
                (identifier)
                (bracketed_argument_list (argument (integer_literal) @one))))))))) @dial
        (#match? @connect "^Connect(Async)?$")
        (#match? @converter "^(int|Convert)$")
        (#match? @parse "^(Parse|ToInt32)$")
        (#eq? @zero "0") (#eq? @one "1"))
composite_rules:
- id: powershell-split-host-port-connect
  for:
  - powershell
  desc: PowerShell colon split near indexed host:port Connect call
  conf: 0.96
  near_lines: 6
  all:
  - id: micro-behaviors/data/string/split::dotnet-colon-delimiter-split
  - id: powershell-indexed-host-port-connect
- id: csharp-split-host-port-connect
  for:
  - csharp
  desc: C# colon split near indexed host:port Connect call
  conf: 0.96
  near_lines: 6
  all:
  - id: micro-behaviors/data/string/split::dotnet-colon-delimiter-split
  - id: csharp-indexed-host-port-connect
- id: powershell-bidirectional-networkstream-pump
  for:
  - powershell
  desc: PowerShell TCP stream, buffer read and multiple stream transfers
  conf: 0.96
  all:
  - id: micro-behaviors/communications/socket/tcp::powershell-tcpclient-stream
  - id: micro-behaviors/data/stream/read::powershell-buffer-stream-read
  any:
  - id: micro-behaviors/data/buffer/transfer::powershell-dual-stream-buffer-write
  - id: micro-behaviors/data/buffer/transfer::dotnet-multiple-copyto-calls
- id: transparent-stream-forwarder
  for:
  - python
  - c
  desc: Socket I/O and event-loop clues
  conf: 0.95
  all:
  - id: micro-behaviors/communications/proxy/relay::relay-listener-accept-call
  - id: micro-behaviors/communications/proxy/relay::relay-outbound-connect-call
  - id: micro-behaviors/communications/proxy/relay::relay-stream-receive-call
  - id: micro-behaviors/communications/proxy/relay::relay-stream-output-call
  - id: micro-behaviors/communications/proxy/relay::relay-event-loop-call
  near_bytes: 4096
