defaults:
  platforms: [windows, unix]
  for: [powershell, csharp]
  crit: notable
traits:
  - id: dotnet-colon-split-tcpclient
    desc: Splits on colon before a TcpClient
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.Split\s*\(|-split)\s*[''"]\s*:\s*[''"].{0,240}\bTcpClient\b'
  - id: dotnet-colon-split-int-port
    desc: Splits on colon before int port cast
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.Split\s*\(|-split)\s*[''"]\s*:\s*[''"].{0,420}(\[int\]|int\.Parse|Convert\.ToInt32)'
  - id: powershell-paired-stream-read-write-bridge
    desc: PowerShell bridges streams via paired Read/Write
    conf: 0.93
    for: [powershell]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.DataAvailable\b.{0,160}\.Read\s*\([^)]{1,80}\).{0,80}\.Write\s*\(.{0,240}){2}'

composite_rules:
  - id: dotnet-host-port-split-dial
    desc: Splits host:port and dials a TcpClient
    conf: 0.94
    near_bytes: 480
    all:
      - id: dotnet-colon-split-tcpclient
      - id: dotnet-colon-split-int-port
