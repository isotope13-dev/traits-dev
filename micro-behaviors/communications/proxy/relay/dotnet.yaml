defaults:
  platforms: [windows, unix]
  for: [powershell, csharp]
  crit: notable
traits:
  - id: dotnet-colon-split-tcpclient
    desc: Splits on colon before a TcpClient
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.Split\s*\(|-split)\s*[''"]\s*:\s*[''"].{0,240}\bTcpClient\b'
  - id: dotnet-colon-split-int-port
    desc: Splits on colon before int port cast
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.Split\s*\(|-split)\s*[''"]\s*:\s*[''"].{0,420}(\[int\]|int\.Parse|Convert\.ToInt32)'
  - id: powershell-paired-stream-read-write-bridge
    desc: PowerShell bridges streams via paired Read/Write
    conf: 0.93
    for: [powershell]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.DataAvailable\b.{0,160}\.Read\s*\([^)]{1,80}\).{0,80}\.Write\s*\(.{0,240}){2}'

composite_rules:
  - id: dotnet-host-port-split-dial
    desc: Colon split near TcpClient and integer port conversion
    conf: 0.94
    near_bytes: 480
    all:
      - id: dotnet-colon-split-tcpclient
      - id: dotnet-colon-split-int-port

  - id: dotnet-outbound-tcp-stream-bridge-clues
    desc: TCP client, colon-split target and paired stream transfer in a loop
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: dotnet-host-port-split-dial
    any:
      - id: micro-behaviors/data/stream/transfer::dotnet-paired-stream-copy-to
      - id: powershell-paired-stream-read-write-bridge
