defaults:
  platforms: [windows, unix]
  for: [powershell, csharp]
  crit: notable
traits:
  - id: dotnet-colon-split-tcpclient
    desc: Splits on colon before a TcpClient
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.Split\s*\(|-split)\s*[''"]\s*:\s*[''"].{0,240}\bTcpClient\b'
  - id: powershell-paired-stream-read-write-bridge
    desc: PowerShell bridges streams via paired Read/Write
    conf: 0.93
    for: [powershell]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)(\.DataAvailable\b.{0,160}\.Read\s*\([^)]{1,80}\).{0,80}\.Write\s*\(.{0,240}){2}'

composite_rules:
  - id: dotnet-colon-split-client-integer-clues
    desc: Colon split near TcpClient and integer conversion
    conf: 0.94
    near_bytes: 480
    all:
      - id: dotnet-colon-split-tcpclient
      - id: micro-behaviors/data/string/split::dotnet-colon-split-integer-conversion

  - id: dotnet-client-split-transfer-loop-clues
    desc: TcpClient, colon split and multiple transfer clues with a loop
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: dotnet-colon-split-client-integer-clues
    any:
      - id: micro-behaviors/data/buffer/transfer::dotnet-multiple-copyto-calls
      - id: powershell-paired-stream-read-write-bridge
