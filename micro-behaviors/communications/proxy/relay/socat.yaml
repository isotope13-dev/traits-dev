defaults:
  platforms: [unix, windows]
traits:
- id: socat-tcp-shell-relay
  desc: socat TCP-to-shell relay syntax
  crit: notable
  conf: 0.8
  for:
  - shell
  - package.json
  - markdown
  if:
    type: text
    case_insensitive: true
    regex: 'socat\s+.{0,50}TCP.{0,30}EXEC:.{0,20}\b(sh|bash)\b'
