defaults:
  platforms: [unix, windows]
  for: [shell, package.json, markdown]
traits:
- id: socat-tcp-first-shell-relay
  desc: socat TCP address precedes shell execution
  crit: notable
  conf: 0.8
  if:
    type: text
    case_insensitive: true
    regex: 'socat\s+.{0,50}TCP.{0,30}EXEC:.{0,20}\b(sh|bash)\b'
- id: socat-exec-first-shell-relay
  desc: socat shell execution precedes TCP address
  crit: notable
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: 'socat\s+EXEC:[''"]?(/bin/)?(ba)?sh\b[^;|#\r\n]{0,50}\sTCP[46]?(-CONNECT)?:'

composite_rules:
# Socat bridges its two address operands in either order. Keep the original
# TCP-first observation and recognize EXEC-first commands without treating an
# unrelated socket and shell on different lines as a relay.
- id: socat-tcp-shell-relay
  desc: socat TCP-to-shell relay syntax
  crit: notable
  conf: 0.9
  any:
  - id: socat-tcp-first-shell-relay
  - id: socat-exec-first-shell-relay
