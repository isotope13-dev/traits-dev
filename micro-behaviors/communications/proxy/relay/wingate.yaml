# Wingate gateway listener port in C/C++ source. A compile-time port define for
# a wingate-style relay names the listening port; it does not show that a
# listener is opened or who may connect to it.
defaults:
  for: [c, cpp]
  platforms: [unix, windows]

traits:
  - id: wingate-gateway-listener-define
    desc: Wingate gateway listener port define
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '#define\s{1,3}\w{0,20}(WINGATE|GATE_LISTEN)\w{0,20}\s{1,3}\d{2,5}'
