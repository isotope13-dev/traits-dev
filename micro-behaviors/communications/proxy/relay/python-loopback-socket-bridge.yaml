# An inbound accept distinguishes a bridge from a client draining a socket.
---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: python-loopback-socket-bridge
  desc: Loopback, select and socket I/O clues
  conf: 0.95
  all:
  - id: micro-behaviors/communications/ip/literal::loopback-ipv4-source
  - id: micro-behaviors/os/event/select::python-select-call
  - id: micro-behaviors/communications/socket/receive::socket-data-transfer
  - id: micro-behaviors/communications/socket/accept::socket-accept-call
