---
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - java
  - class
composite_rules:
- id: java-websocket-tcp-tunnel
  for:
  - class
  desc: Java socket and WebSocket evidence
  crit: suspicious
  conf: 0.9
  scope: leaf
  all:
  - id: micro-behaviors/communications/socket/create::java-async-socket-channel
  - id: micro-behaviors/data/control-flow/dispatch/callback::completion-handler
  - id: micro-behaviors/communications/http/websocket::websocket-headers
  any:
  - id: micro-behaviors/data/buffer/alloc::byte-buffer-allocate
  - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
  - id: micro-behaviors/communications/socket/endpoint::java-inet-socket-address
