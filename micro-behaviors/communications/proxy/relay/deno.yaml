defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: deno-http-socket-interface
    desc: Deno HTTP server with TCP socket handles
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/server/listener::deno-serve-call
      - id: micro-behaviors/communications/socket/connect::deno-connect-call
      - id: micro-behaviors/communications/socket/endpoint::socket-identifier-property
