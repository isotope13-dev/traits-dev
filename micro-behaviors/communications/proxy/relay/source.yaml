# A transparent relay is a neutral network capability.  The objective layer
# adds the victim-relay context (UPnP exposure, relay health reporting, or a
# blockchain-derived peer list).
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, go, rust, javascript]
  attack: T1090.003
  mbc: C0003
  crit: notable
  conf: 0.88

# The I/O-multiplexing atoms (select/poll/epoll_wait) are NOT defined here.
# They are neutral kernel event-wait primitives that already exist under
# micro-behaviors/os/event/, and duplicating their matchers here — under
# names like "Relay waits on select events" — both split one signal across two
# ML features and mislabelled the atom for the composite it feeds. It also cost
# precision: the copies carried `for: [... javascript]`, so a bare `select(...)`
# in a CSS selector engine (nwmatcher) or a feature-flag SDK read as a relay
# event loop. The composite below references the canonical atoms instead.

composite_rules:
  - id: relay-listener-accept-call
    desc: Accepts an inbound socket connection
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/accept::accept-call-source
      - id: micro-behaviors/communications/socket/accept::socket-accept-call

  - id: relay-outbound-connect-call
    desc: Opens an outbound socket connection
    crit: component
    conf: 0.9
    any:
      - id: metadata/file/profile/socket-api::connect-symbol
      - id: micro-behaviors/data/control-flow/dispatch/named::create-connection-method-call
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: micro-behaviors/communications/websocket/library::websocket-client-create-connection

  - id: relay-stream-receive-call
    desc: Receives socket or named-channel data
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/communications/proxy/relay::relay-channel-recv-method

  - id: relay-stream-output-call
    desc: Sends socket or named-channel data
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/proxy/relay::relay-channel-send-method
      - id: micro-behaviors/communications/proxy/relay::relay-channel-sendall-method

  - id: relay-event-loop-call
    desc: Uses an event-driven socket primitive
    crit: component
    conf: 0.9
    for: [c, cpp, python]
    any:
      - id: micro-behaviors/os/event/epoll::epoll-wait
      - id: micro-behaviors/os/event/epoll::epoll-pwait
      - id: micro-behaviors/os/event/poll::poll-multiplex
      - id: micro-behaviors/os/event/select::select-multiplex
      - id: micro-behaviors/os/event/select::python-select-call
