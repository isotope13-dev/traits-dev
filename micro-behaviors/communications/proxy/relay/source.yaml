# A transparent relay is a neutral network capability.  The objective layer
# adds the victim-relay context (UPnP exposure, relay health reporting, or a
# blockchain-derived peer list).
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, go, rust, javascript]
  attack: T1090.003
  mbc: C0003
  crit: notable
  conf: 0.88

# The I/O-multiplexing atoms (select/poll/epoll_wait) are NOT defined here.
# They are neutral kernel event-wait primitives that already exist under
# micro-behaviors/os/event/kernel/, and duplicating their matchers here — under
# names like "Relay waits on select events" — both split one signal across two
# ML features and mislabelled the atom for the composite it feeds. It also cost
# precision: the copies carried `for: [... javascript]`, so a bare `select(...)`
# in a CSS selector engine (nwmatcher) or a feature-flag SDK read as a relay
# event loop. The composite below references the canonical atoms instead.
composite_rules:
  - id: relay-listener-accept-call
    desc: Relay accepts an inbound socket connection
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/listen::accept-call-source
      - id: micro-behaviors/communications/socket/connect::socket-accept-call

  - id: relay-outbound-connect-call
    desc: Relay opens an outbound socket connection
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/communications/proxy/tunnel::relay-target-connect-method

  - id: relay-stream-receive-call
    desc: Relay receives stream data
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-recv-method

  - id: relay-stream-output-call
    desc: Relay sends or writes stream data
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-send-method
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-sendall-method

  - id: relay-event-loop-call
    desc: Relay uses an event-driven socket loop
    crit: notable
    conf: 0.9
    for: [c, cpp, python]
    any:
      - id: micro-behaviors/os/event/kernel/epoll::epoll-wait
      - id: micro-behaviors/os/event/kernel/epoll::epoll-pwait
      - id: micro-behaviors/os/event/kernel/poll::poll-multiplex
      - id: micro-behaviors/os/event/kernel/select::select-multiplex
      - id: micro-behaviors/os/event/kernel/select::python-select-call

  - id: transparent-stream-forwarder
    desc: Event-driven bidirectional stream forwarder
    conf: 0.95
    all:
      - id: relay-listener-accept-call
      - id: relay-outbound-connect-call
      - id: relay-stream-receive-call
      - id: relay-stream-output-call
      - id: relay-event-loop-call
    near_bytes: 4096
