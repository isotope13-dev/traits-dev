# A transparent relay is a neutral network capability.  The objective layer
# adds the victim-relay context (UPnP exposure, relay health reporting, or a
# blockchain-derived peer list).
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, go, rust, javascript]
  attack: T1090.003
  mbc: C0003
  crit: notable
  conf: 0.88

traits:
  - id: relay-epoll-wait-call
    desc: Relay waits on epoll events
    if:
      type: symbol
      kind: call
      exact: epoll_wait

  - id: relay-epoll-pwait-call
    desc: Relay waits on epoll events
    if:
      type: symbol
      kind: call
      exact: epoll_pwait

  - id: relay-poll-call
    desc: Relay waits on poll events
    if:
      type: symbol
      kind: call
      exact: poll

  - id: relay-select-call
    desc: Relay waits on select events
    if:
      type: symbol
      kind: call
      exact: select

composite_rules:
  - id: relay-listener-accept-call
    desc: Relay accepts an inbound socket connection
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/listen::accept-call-source
      - id: micro-behaviors/communications/socket/connect::socket-accept-call

  - id: relay-outbound-connect-call
    desc: Relay opens an outbound socket connection
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/proxy/tunnel::relay-target-connect-function
      - id: micro-behaviors/communications/proxy/tunnel::relay-target-connect-method

  - id: relay-stream-receive-call
    desc: Relay receives stream data
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-recv-function
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-recv-method

  - id: relay-stream-output-call
    desc: Relay sends or writes stream data
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-send-function
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-send-method
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-sendall-method

  - id: relay-event-loop-call
    desc: Relay uses an event-driven socket loop
    crit: notable
    conf: 0.9
    any:
      - id: relay-epoll-wait-call
      - id: relay-epoll-pwait-call
      - id: relay-poll-call
      - id: relay-select-call

  - id: transparent-stream-forwarder
    desc: Event-driven bidirectional stream forwarder
    conf: 0.95
    all:
      - id: relay-listener-accept-call
      - id: relay-outbound-connect-call
      - id: relay-stream-receive-call
      - id: relay-stream-output-call
      - id: relay-event-loop-call
    near_bytes: 4096
