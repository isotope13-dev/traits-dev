defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: request-json-selects-tcp-target
    desc: Request JSON selects TCP destination
    if:
      type: tree-sitter
      query: |
        ((arrow_function body: (statement_block
          (lexical_declaration (variable_declarator name: (identifier) @body
            value: (await_expression (call_expression
              function: (member_expression property: (property_identifier) @parse)))))
          (if_statement consequence: (statement_block
            (lexical_declaration (variable_declarator
              value: (await_expression (call_expression
                function: (member_expression) @connect
                arguments: (arguments (object
                  (pair key: (property_identifier) @hostname
                    value: (member_expression object: (identifier) @host_body))
                  (pair key: (property_identifier) @port
                    value: (member_expression object: (identifier) @port_body)))))))))))) @target
          (#eq? @parse "json")
          (#eq? @connect "Deno.connect")
          (#eq? @hostname "hostname")
          (#eq? @port "port")
          (#eq? @body @host_body)
          (#eq? @body @port_body))
