# Cross-language mechanics of a server-controlled WebSocket relay.  These
# atoms describe protocol structure and API shapes; malicious intent is
# inferred only by the command-and-control composites that combine them.
defaults:
  platforms: [windows, unix]
  for: [python, source]
  attack: T1090,T1572
traits:
  - id: relay-channel-recv-method
    desc: Named channel recv method call
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(channel|relay)\.recv$'
  - id: relay-channel-send-method
    desc: Named channel send method call
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(channel|relay)\.send$'
  - id: relay-channel-sendall-method
    desc: Named channel sendall method call
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.(ws|websocket|channel|relay)\.sendall$'
  - id: native-socket-buffer-forwarding
    for: [c, cpp]
    desc: Forwards received bytes between distinct sockets
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ((compound_statement
          (expression_statement
            (call_expression
              function: (identifier) @recv
              arguments: (argument_list
                (identifier) @source
                (identifier) @received)))
          (expression_statement
            (call_expression
              function: (identifier) @send
              arguments: (argument_list
                (identifier) @target
                (identifier) @forwarded)))) @relay
        (#eq? @recv "recv")
        (#eq? @send "send")
        (#eq? @received @forwarded)
        (#not-eq? @source @target))

composite_rules:
  - id: socks5-target-address-evidence
    desc: SOCKS target-address constants or parser
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/communications/proxy/socks::socks5-domain-target-constants
      - id: micro-behaviors/communications/proxy/socks::python-socks-address-parser

  - id: websocket-target-connect
    desc: Opens an outbound target connection
    crit: component
    conf: 0.94
    any:
      - id: metadata/file/profile/socket-api::connect-symbol
      - id: micro-behaviors/data/control-flow/dispatch/named::create-connection-method-call
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
      - id: micro-behaviors/communications/websocket/library::websocket-client-create-connection
      - id: micro-behaviors/communications/socket/connect/tcp::asyncio-open-connection-call
