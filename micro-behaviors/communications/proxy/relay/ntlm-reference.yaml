defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  # Commands in help text and forwarding option names establish the relay
  # subject, not invocation, a destination protocol, or an authentication flow.
  - id: ntlm-relay-command-or-forwarding-reference
    desc: NTLM relay command or forwarding reference
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: (?i)\b(ntlm(relayx(\.py)?|[-_]?relay)\s+--?[A-Za-z]|forward[-_]?ntlm)\b
