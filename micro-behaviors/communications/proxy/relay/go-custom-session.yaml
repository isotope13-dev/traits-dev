defaults:
  crit: notable
  conf: 0.9
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]

traits:
  - id: go-encrypted-session-acceptor
    desc: Encrypted session acceptor routine
    if:
      type: text
      substr: AcceptEncryptedSession
  - id: go-quic-relay-constructor
    desc: QUIC relay constructor routine
    if:
      type: text
      substr: NewQuicRelay
  - id: go-upload-request-packet
    desc: Upload request packet type
    if:
      type: text
      substr: UploadRequestPacket
  - id: go-download-response-packet
    desc: Download response packet type
    if:
      type: text
      substr: DownloadResponsePacket
  - id: go-listener-request-packet
    desc: Listener request packet type
    if:
      type: text
      substr: ListenerRequestPacket
  - id: go-connect-request-packet
    desc: Custom connection request packet type
    if:
      type: text
      substr: ConnectRequestPacket
  - id: go-listener-bind-response-packet
    desc: Listener bind response packet type
    if:
      type: text
      substr: ListenerBindReponse
  - id: go-listener-socket-response-packet
    desc: Listener socket response packet type
    if:
      type: text
      substr: ListenerSockResponsePacket
