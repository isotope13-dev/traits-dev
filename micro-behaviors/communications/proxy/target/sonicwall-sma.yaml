defaults:
  platforms: [unix]
  for: [python, shell, javascript, go, ruby, perl, java]

traits:
  - id: sma-wsproxy-endpoint
    desc: SonicWall SMA wsproxy endpoint path
    crit: notable
    conf: 0.9
    if:
      type: text
      # Match the path itself so interpolated URL construction such as
      # `f"wss://{host}/wsproxy?..."` is visible. Requiring a quote directly
      # before the slash missed the public exploit's normal URL-building form.
      regex: '(?i)/wsproxy([?/"''])'

  - id: sma-wsproxy-bookmark-id
    desc: Proxy bookmark identifier parameter
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: bmID=[^&\s]{1,64}

  - id: sma-wsproxy-service-type
    desc: Remote tunnel service type parameter
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: (?i)(^|[?&\s])serviceType=(SSH|TELNET|RDP)([&\s"'#]|$)

  - id: sma-wsproxy-port-parameter
    desc: SMA wsproxy destination port parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)/wsproxy[^\r\n]{0,200}\bport=[0-9]{1,5}\b'

  - id: sma-wsproxy-legacy-tag
    desc: WebSocket WS_TAG configuration string
    crit: notable
    conf: 0.9
    if:
      type: text
      # Word boundaries keep ordinary XML worksheet constants such as
      # `VIEWS_TAG` from being read as this protocol field.
      regex: '\bWS_TAG\b\s*=\s*["''][^"'']{1,64}'
    not:
      # Metasploit's own RPC daemon tags its websocket listener
      # (`WS_TAG = 'msf-ws'` in msfrpcd) -- same constant shape, unrelated
      # protocol.
      - regex: 'WS_TAG\s*=\s*[''"]msf-'

composite_rules:
  - id: sma-wsproxy-bookmark-tunnel-params
    desc: Bookmark query or WebSocket tag configuration
    crit: notable
    conf: 0.94
    any:
    - id: sma-wsproxy-bookmark-query
    - id: sma-wsproxy-legacy-tag

  - id: sma-wsproxy-bookmark-query
    desc: SMA wsproxy bookmark query parameters
    crit: notable
    conf: 0.94
    all:
    - id: sma-wsproxy-bookmark-id
    - id: sma-wsproxy-service-type

  - id: sma-wsproxy-loopback-target
    desc: SMA proxy local/wildcard host and port parameters
    crit: notable
    conf: 0.92
    all:
    - id: sma-wsproxy-endpoint
    - id: micro-behaviors/communications/proxy/target::local-host-parameter
    - id: sma-wsproxy-port-parameter
    near_bytes: 256

