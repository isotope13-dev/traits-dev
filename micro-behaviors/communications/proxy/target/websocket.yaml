# Request-controlled WebSocket target selection. These atoms describe the
# source APIs and stream operations; the local-service pivot objective combines
# them into an attack pattern.
defaults:
  platforms: [windows, unix]
  for: [python, java, javascript, typescript, go]
  attack: T1090,T1572

traits:
  - id: websocket-api-python
    desc: Python WebSocket API marker
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: text
      regex: '\bwebsocket[s]?\b'

  - id: websocket-api-java
    desc: Java WebSocket API marker
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: '\bWebSocket(Session)?\b'

  - id: websocket-api-annotation
    desc: WebSocket endpoint annotation
    crit: notable
    conf: 0.92
    for: [java, go]
    if:
      type: text
      substr: '@ServerEndpoint'

  - id: request-target-host-python
    desc: Request reads target host
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: 'request\.(args|query_params).{0,40}host'

  - id: request-target-port-python
    desc: Request reads target port
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: 'request\.(args|query_params).{0,40}port'

  - id: request-target-host-java
    desc: Java request reads target host
    crit: notable
    conf: 0.93
    for: [java]
    if:
      type: text
      regex: 'getParameter\(\s*["'']host["'']\s*\)'

  - id: request-target-port-java
    desc: Java request reads target port
    crit: notable
    conf: 0.93
    for: [java]
    if:
      type: text
      regex: 'getParameter\(\s*["'']port["'']\s*\)'

  - id: request-target-host-javascript
    desc: JavaScript request reads target host
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '(req|request)\.query\.host'

  - id: request-target-port-javascript
    desc: JavaScript request reads target port
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '(req|request)\.query\.port'

  - id: request-target-host-go
    desc: Go request reads target host
    crit: notable
    conf: 0.93
    for: [go]
    if:
      type: text
      regex: 'Query\(\)\.Get\(\s*"host"'

  - id: request-target-port-go
    desc: Go request reads target port
    crit: notable
    conf: 0.93
    for: [go]
    if:
      type: text
      regex: 'Query\(\)\.Get\(\s*"port"'

  - id: target-connect-python
    desc: Python connects to target variable
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'create_connection\s*\(\s*\(\s*(host|target_host)'

  - id: target-connect-java
    desc: Java connects to target variable
    crit: notable
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: 'new\s+Socket\s*\(\s*(host|target_host)'

  - id: target-connect-javascript
    desc: JavaScript connects to target variable
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'net\.connect\s*\(\s*(host|target_host)'

  - id: target-connect-go
    desc: Go connects to target variable
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: 'net\.Dial(TCP)?\s*\(\s*(host|target_host)'

  - id: stream-send-binary-call
    desc: Binary stream send call
    crit: notable
    conf: 0.88
    for: [java, javascript, typescript]
    if:
      type: text
      regex: '\.sendBinary\s*\('

  - id: local-ipv4-target
    desc: Target host is IPv4 loopback
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'host.{0,80}(127\.0\.0\.1|0\.0\.0\.0)'

  - id: local-hostname-target
    desc: Target host is localhost
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'host.{0,80}localhost'

  - id: local-ipv6-target
    desc: Target host is IPv6 loopback
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'host.{0,80}::1'

composite_rules:
  - id: stream-receive-call
    desc: WebSocket or socket stream receive call
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-recv-method
      - id: micro-behaviors/communications/socket/receive
      - id: micro-behaviors/communications/websocket/receive

  - id: stream-send-call
    desc: WebSocket or socket stream send call
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-send-method
      - id: micro-behaviors/communications/proxy/tunnel::relay-channel-sendall-method
      - id: micro-behaviors/communications/socket/send
      - id: micro-behaviors/communications/websocket/send

  - id: websocket-handler-context
    desc: WebSocket handler context
    crit: notable
    conf: 0.92
    any:
      - id: websocket-api-python
      - id: websocket-api-java
      - id: websocket-api-annotation
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers

  - id: request-target-host
    desc: Request-selected target host field
    crit: notable
    conf: 0.94
    any:
      - id: request-target-host-python
      - id: request-target-host-java
      - id: request-target-host-javascript
      - id: request-target-host-go

  - id: request-target-port
    desc: Request-selected target port field
    crit: notable
    conf: 0.94
    any:
      - id: request-target-port-python
      - id: request-target-port-java
      - id: request-target-port-javascript
      - id: request-target-port-go

  - id: request-target-connect
    desc: Socket connects to request target
    crit: notable
    conf: 0.95
    any:
      - id: target-connect-python
      - id: target-connect-java
      - id: target-connect-javascript
      - id: target-connect-go

  - id: websocket-stream-copy
    desc: WebSocket copies stream data
    crit: notable
    conf: 0.93
    all:
      - id: stream-receive-call
    any:
      - id: stream-send-call
      - id: stream-send-binary-call
    near_bytes: 2048

  - id: websocket-local-target
    desc: WebSocket target is local
    crit: notable
    conf: 0.94
    any:
      - id: local-ipv4-target
      - id: local-hostname-target
      - id: local-ipv6-target

  - id: websocket-request-target-relay
    desc: WebSocket relays request-selected target
    crit: suspicious
    conf: 0.96
    all:
      - id: websocket-handler-context
      - id: request-target-host
      - id: request-target-port
      - id: request-target-connect
      - id: websocket-stream-copy
    near_bytes: 4096
