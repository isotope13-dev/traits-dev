# Request-controlled WebSocket target selection. These atoms describe the
# source APIs and stream operations; the local-service pivot objective combines
# them into an attack pattern.
defaults:
  platforms: [windows, unix]
  for: [python, java, javascript, typescript, go]
  attack: T1090,T1572

traits:
  - id: request-target-host-python
    desc: Request reads target host
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: 'request\.(args|query_params).{0,40}host'

  - id: request-target-port-python
    desc: Request reads target port
    crit: notable
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: 'request\.(args|query_params).{0,40}port'

  - id: request-target-host-java
    desc: Java request reads target host
    crit: notable
    conf: 0.93
    for: [java]
    if:
      type: text
      regex: 'getParameter\(\s*["'']host["'']\s*\)'

  - id: request-target-port-java
    desc: Java request reads target port
    crit: notable
    conf: 0.93
    for: [java]
    if:
      type: text
      regex: 'getParameter\(\s*["'']port["'']\s*\)'

  - id: request-target-host-javascript
    desc: JavaScript request reads target host
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '(req|request)\.query\.host'

  - id: request-target-port-javascript
    desc: JavaScript request reads target port
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '(req|request)\.query\.port'

  - id: request-target-host-go
    desc: Go request reads target host
    crit: notable
    conf: 0.93
    for: [go]
    if:
      type: text
      regex: 'Query\(\)\.Get\(\s*"host"'

  - id: request-target-port-go
    desc: Go request reads target port
    crit: notable
    conf: 0.93
    for: [go]
    if:
      type: text
      regex: 'Query\(\)\.Get\(\s*"port"'

  - id: target-connect-python
    desc: Python connects to target variable
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'create_connection\s*\(\s*\(\s*(host|target_host)'

  - id: target-connect-java
    desc: Java connects to target variable
    crit: notable
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: 'new\s+Socket\s*\(\s*(host|target_host)'

  - id: target-connect-javascript
    desc: JavaScript connects to target variable
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'net\.connect\s*\(\s*(host|target_host)'

  - id: target-connect-go
    desc: Go connects to target variable
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: 'net\.Dial(TCP)?\s*\(\s*(host|target_host)'

  # These three read a proxy target-host keyword sitting next to a local address. Roff man
  # pages are typed as JavaScript by the walker, and a connection-API man page
  # documents exactly this shape (`host=127.0.0.1:3306`, `host=[::1]:3306`), so
  # the manpage identity is excluded: documenting a connection string is not
  # selecting a target. 0.0.0.0 is the wildcard bind address rather than
  # loopback, so the description names both forms.
  - id: local-ipv4-target
    desc: Target host is loopback or wildcard IPv4
    crit: notable
    conf: 0.94
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      # Require an explicit target-like host assignment. A comparison such as
      # `options.host === "0.0.0.0"` does not select a proxy target.
      regex: '(?i)\b(target|upstream|proxy)[_-]?host\s*[:=].{0,16}(127\.0\.0\.1|0\.0\.0\.0)'

  - id: local-hostname-target
    desc: Proxy target host is localhost
    crit: notable
    conf: 0.94
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(?i)\b(target|destination|upstream|proxy)[_-]?host\b.{0,80}localhost'

  # `::1` is only three characters, so a bare `host.{0,80}::1` matched any code
  # that mentions a host near an IPv6 literal -- notably the follow-redirects
  # URL validator, which assigns `hostname = "::1"` as a placeholder when a
  # parsed URL carries no host.  Require the same target/destination/upstream/
  # proxy host keyword the localhost sibling requires, so the match means a
  # relay target was selected rather than an address appearing in passing.
  - id: local-ipv6-target
    desc: Proxy target host is IPv6 loopback
    crit: notable
    conf: 0.94
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(?i)\b(target|destination|upstream|proxy)[_-]?host\b.{0,80}::1'

  # A bare host= parameter is neutral connection configuration. Appliance-
  # specific exploit rules combine it with their endpoint and protocol fields.
  - id: local-host-parameter
    desc: Host parameter selects loopback or wildcard
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(^|[?&\s])host=(0\.0\.0\.0|127\.0\.0\.1|localhost|::ffff:127\.0\.0\.1)'

composite_rules:
  - id: websocket-handler-context
    desc: WebSocket handler context
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/communications/websocket/handler::websocket-library-api-reference
      - id: micro-behaviors/communications/websocket/library::aiohttp-websocket-connect
      - id: micro-behaviors/communications/websocket/server::websockets-asyncio-serve-call
      - id: micro-behaviors/communications/websocket/server::fastapi-websocket-route
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers

  - id: request-target-host
    desc: Request-selected target host field
    crit: notable
    conf: 0.94
    any:
      - id: request-target-host-python
      - id: request-target-host-java
      - id: request-target-host-javascript
      - id: request-target-host-go

  - id: request-target-port
    desc: Request-selected target port field
    crit: notable
    conf: 0.94
    any:
      - id: request-target-port-python
      - id: request-target-port-java
      - id: request-target-port-javascript
      - id: request-target-port-go

  - id: request-target-connect
    desc: Socket connects to request target
    crit: notable
    conf: 0.95
    any:
      - id: target-connect-python
      - id: target-connect-java
      - id: target-connect-javascript
      - id: target-connect-go

  - id: websocket-local-target
    desc: WebSocket target is local
    crit: notable
    conf: 0.94
    any:
      - id: local-ipv4-target
      - id: local-hostname-target
      - id: local-ipv6-target

  - id: websocket-request-target-relay
    desc: WebSocket relays request-selected target
    crit: suspicious
    conf: 0.96
    all:
      - id: websocket-handler-context
      - id: request-target-host
      - id: request-target-port
      - id: request-target-connect
      - id: micro-behaviors/communications/proxy/tunnel::websocket-channel-bidirectional-copy
    near_bytes: 4096
