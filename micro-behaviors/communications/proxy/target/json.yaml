defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

composite_rules:
  - id: sma-wsproxy-loopback-json-target
    desc: SMA JSON proxy targets a loopback port
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/proxy/target::sma-wsproxy-endpoint
      - id: metadata/lang/source/syntax/key-value::loopback-host-field
      - id: metadata/lang/source/syntax/key-value::port-field-identifier-value
    near_bytes: 512
