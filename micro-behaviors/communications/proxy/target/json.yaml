defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: json-proxy-loopback-host
    desc: JSON proxy sets loopback host
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']host["'']\s*:\s*["''](127\.0\.0\.1|localhost|::1)["'']'

  - id: json-proxy-port-variable
    desc: JSON proxy sets a port variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']port["'']\s*:\s*[A-Z_][A-Z0-9_]*'

composite_rules:
  - id: sma-wsproxy-loopback-json-target
    desc: SMA JSON proxy targets a loopback port
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/proxy/target::sma-wsproxy-endpoint
      - id: json-proxy-loopback-host
      - id: json-proxy-port-variable
    near_bytes: 512
