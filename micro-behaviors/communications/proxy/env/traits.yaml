# Proxy configuration carried in process environment variables.
#
# Naming HTTP_PROXY/HTTPS_PROXY/ALL_PROXY is ubiquitous — every HTTP client
# honours them — so the bare name is baseline. Writing one is the behaviour
# worth surfacing: it redirects every outbound request the process (and the
# children that inherit its environment) makes, through an operator-chosen
# endpoint. Neutral mechanics only; interception intent belongs in objectives/.
defaults:
  platforms: [unix, windows]
  attack: T1090

traits:
  - id: proxy-env-var-name
    desc: HTTP proxy environment variable name
    crit: baseline
    conf: 0.9
    for: [go, rust, java, python, javascript, typescript, ruby, shell]
    if:
      type: literal
      regex: '^(HTTP|HTTPS|ALL)_PROXY$'
      case_insensitive: true
  - id: shell-proxy-env-export
    desc: Shell exports an HTTP proxy environment variable
    crit: notable
    conf: 0.9
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '(?i)\b(export|set)\s+(HTTP|HTTPS|ALL)_PROXY\s*='

  # NO_PROXY is the exclusion half of the same configuration: a host that
  # matches it is contacted directly, skipping whatever inspection or policy
  # the proxy applies. Writing it is the behaviour worth surfacing -- reading
  # the variable is what every HTTP client does -- because the process is
  # deciding for itself which destinations leave unexamined.
  - id: no-proxy-exclusion-write
    desc: Writes the NO_PROXY exclusion list
    crit: notable
    conf: 0.9
    for: [go, rust, java, python, javascript, typescript, ruby, shell, powershell]
    if:
      type: text
      # Assignment in the spellings scripts actually use: `export NO_PROXY=`,
      # `os.environ["NO_PROXY"] =`, `process.env.NO_PROXY =`. The trailing
      # `[^=]` keeps comparisons (`== "1"`) out.
      regex: '(?i)\bNO_PROXY(["'']\]|)\s*=[^=]'

composite_rules:
  - id: go-proxy-env-override
    desc: Go writes an HTTP proxy environment variable
    crit: notable
    conf: 0.9
    for: [go]
    all:
      - id: proxy-env-var-name
      - id: micro-behaviors/os/env/modify::go-setenv
