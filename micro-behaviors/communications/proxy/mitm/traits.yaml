defaults:
  platforms: [unix, windows]
  for: [python, shell, dockerfile, pkginfo, markdown]
  crit: notable
  conf: 0.9

traits:
- id: proxy-ca-module-marker
  desc: Proxy CA module marker
  crit: notable
  conf: 0.92
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\bproxy_ca\b'
- id: https-interception-marker
  desc: HTTPS interception marker
  crit: notable
  conf: 0.94
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)intercepting\s+https\b'
- id: custom-upstream-marker
  desc: Custom upstream marker
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)custom\s+upstream\b'
- id: mitmproxy-ca-cert
  desc: mitmproxy CA certificate path
  if:
    type: text
    substr: mitmproxy-ca-cert.pem

- id: mitmproxy-python-import
  desc: mitmproxy Python import
  for: [python]
  if:
    type: import
    substr: mitmproxy
- id: mitmproxy-command--mitmproxy
  desc: mitmproxy command invocation (mitmproxy)
  if:
    type: text
    word: mitmproxy
- id: mitmproxy-command--mitmdump
  desc: mitmproxy command invocation (mitmdump)
  if:
    type: text
    word: mitmdump
- id: go-domain-certificate-generator
  desc: Go MITM proxy generates per-domain certificates
  crit: notable
  conf: 0.96
  for: [go]
  if:
    type: function
    exact: generateCertificateForDomain
composite_rules:
- id: mitmproxy-command
  desc: mitmproxy command invocation
  any:
  - id: mitmproxy-command--mitmproxy
  - id: mitmproxy-command--mitmdump
- id: go-mitm-https-interception
  desc: Go proxy parses and reissues HTTPS traffic
  crit: notable
  conf: 0.98
  for: [zip, archives]
  scope: archive
  all:
  - id: go-domain-certificate-generator
  - id: micro-behaviors/communications/http/server/request::go-http-read-request
  - id: micro-behaviors/communications/http/lib/netlib::go-http-newrequest
  - id: micro-behaviors/communications/socket/ssl::insecure-skip-verify
