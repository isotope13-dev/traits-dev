defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  attack: T1090

traits:
  - id: proxy-enable-value-name
    desc: Windows ProxyEnable registry value name
    conf: 0.92
    if:
      type: text
      exact: ProxyEnable

  - id: proxy-server-value-name
    desc: Windows ProxyServer registry value name
    conf: 0.92
    if:
      type: text
      exact: ProxyServer

  - id: proxy-state-restoration-message
    desc: Reports proxy enable or restoration state
    conf: 0.9
    if:
      type: text
      regex: '(?i)(proxy (enabled|disabled)|proxy restored|proxy settings restored)'

composite_rules:
  - id: windows-internet-settings-proxy-management
    desc: Windows program manages Internet Settings proxy state
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/access::internet-settings-key
      - id: proxy-enable-value-name
      - id: proxy-server-value-name
      - id: proxy-state-restoration-message
