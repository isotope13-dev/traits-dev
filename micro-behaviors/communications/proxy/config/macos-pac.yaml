defaults:
  platforms: [macos]
  for: [class, shell]
traits:
  - id: macos-auto-proxy-url-option
    desc: macOS automatic proxy URL option
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '-setautoproxyurl'
composite_rules:
  - id: jvm-configures-auto-proxy-url
    desc: JVM runs automatic proxy URL configuration
    crit: notable
    conf: 0.96
    for: [class]
    all:
      - id: macos-auto-proxy-url-option
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
