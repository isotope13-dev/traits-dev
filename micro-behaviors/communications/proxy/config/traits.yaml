# Proxy endpoint carried in program configuration (a settings key, a config
# file, a constructor option) rather than in the environment — the env-var
# surface lives in ../env/.
#
# Pointing a client at an operator-chosen proxy redirects every request it
# makes, so it is worth surfacing in a diff, but it is also what every HTTP
# client library, corporate build and download helper does. Neutral mechanics
# only: interception or offensive-traffic-routing intent belongs in objectives/,
# which reference this atom cross-directory.
defaults:
  platforms: [unix, windows]
  attack: T1090

traits:
  - id: proxy-endpoint-url-setting
    desc: Proxy setting assigned an explicit HTTP URL
    crit: notable
    conf: 0.92
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\b(proxy([_-](url|endpoint|base))?|https?_proxy)\b["'']?\s*[:=]\s*["'']https?://'

  - id: loopback-proxy-port-endpoint
    desc: Loopback proxy endpoint with explicit port
    crit: notable
    conf: 0.9
    for: [source]
    if:
      type: string_literal
      regex: '(?i)^(127\.0\.0\.1|localhost):[1-9][0-9]{3,4}$'
