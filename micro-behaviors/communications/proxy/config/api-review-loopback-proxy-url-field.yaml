defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php, json]
  crit: notable
  conf: 0.85
traits:
  - id: loopback-proxy-url-field
    desc: Proxy field references a loopback URL
    conf: 0.86
    if:
      type: text
      regex: '"proxy"\s*:\s*"https?://(127\.0\.0\.1|localhost|\[::1\])'
