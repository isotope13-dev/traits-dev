defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: requests-session-proxies-update-call
    desc: Updates a Python requests session proxy mapping
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.proxies\.update$'

  # Routing every request of a connection pool through an operator-supplied
  # proxy. Benign SDKs expose it as configuration; tunnelled implants use the
  # same constructor to put a relay between themselves and their C2 host.
  - id: urllib3-proxy-manager-construction
    desc: Constructs a urllib3 HTTP ProxyManager
    crit: notable
    conf: 0.9
    mbc: C0001
    attack: T1090
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ProxyManager$'

composite_rules:
  - id: python-cyclic-socks-proxy-pool
    desc: Python requests session rotates through a cyclic SOCKS proxy pool
    crit: notable
    conf: 0.96
    all:
      - id: requests-session-proxies-update-call
      - id: micro-behaviors/data/control-flow/loop::python-itertools-cycle-call
      - id: micro-behaviors/communications/http/lib/requests::imports-requests
      - id: micro-behaviors/communications/proxy/socks::socks5-string
