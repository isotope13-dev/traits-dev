# A chrome.proxy fixed_servers config whose single proxy host is a domain
# literal in the code: every request goes to one server the user cannot
# pick or change.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: chrome-proxy-literal-single-host
    desc: Single proxy host is a hardcoded domain
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'singleProxy\s*:\s*\{[^}]{0,40}\bhost\s*:\s*["''][a-z0-9-]{1,63}\.[a-z0-9.-]{2,120}["'']'
