defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: proxy-config-consumes-resolver-result
    desc: Proxy config consumes proxy resolver result
    if:
      type: symbol
      kind: call
      regex: '^(set|apply)ProxyConfig$'
      arg:
        index: 0
        from:
          call: '^resolveProxyHost$'

composite_rules:
  - id: socks5-config-with-doh-resolver-result
    desc: SOCKS5 configuration consumes resolver result beside DoH
    all:
      - id: proxy-config-consumes-resolver-result
      - id: micro-behaviors/os/network/webextension::chrome-proxy-fixed-socks5-config
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
    any:
      - id: micro-behaviors/communications/dns/doh::doh-cloudflare-json
      - id: micro-behaviors/communications/dns/doh::doh-google-json
