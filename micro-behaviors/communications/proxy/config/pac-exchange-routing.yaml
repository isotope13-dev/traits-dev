defaults:
  for: [javascript]
  platforms: [windows, unix]

traits:
  - id: javascript-pac-resolver
    desc: JavaScript defines proxy auto-config resolver
    crit: notable
    if:
      type: text
      regex: '\bfunction\s+FindProxyForURL\s*\('
  - id: javascript-pac-numeric-proxy
    desc: Proxy auto-config names numeric proxy address
    crit: notable
    if:
      type: text
      regex: '(?i)\bPROXY\s+[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]{2,5}'
  - id: pac-crypto-exchange-group-a
    desc: Proxy rules reference crypto exchange
    crit: notable
    if:
      type: text
      regex: '(?i)\b(binance|huobi)\b'
  - id: pac-crypto-exchange-group-b
    desc: Proxy rules reference another crypto exchange
    crit: notable
    if:
      type: text
      regex: '(?i)\b(okx|kraken|coinbase)\b'

composite_rules:
  - id: pac-crypto-exchanges-numeric-proxy
    desc: PAC routes crypto exchanges via numeric proxy
    crit: suspicious
    conf: 0.94
    all:
      - id: javascript-pac-resolver
      - id: javascript-pac-numeric-proxy
      - id: pac-crypto-exchange-group-a
      - id: pac-crypto-exchange-group-b
