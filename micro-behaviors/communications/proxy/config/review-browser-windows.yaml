# Application-subject review; matcher and effective scope preserved.
---
defaults:
  mbc: E1083
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: firefox-proxy-type-pref
  desc: Firefox proxy type preference
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: network.proxy.type
- id: firefox-proxy-http-pref
  desc: Firefox HTTP proxy preference
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: network.proxy.http
- id: firefox-proxy-port-pref
  desc: Firefox proxy port preference
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: network.proxy.http_port
- id: firefox-proxy-autoconfig-pref
  desc: Firefox proxy autoconfig preference
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: network.proxy.autoconfig_url
composite_rules:
- id: firefox-proxy-config-reference
  desc: Firefox proxy configuration reference
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/application/browser::firefox-profiles-ini-path
  any:
  - id: micro-behaviors/communications/proxy/config::firefox-proxy-type-pref
  - id: micro-behaviors/communications/proxy/config::firefox-proxy-http-pref
  - id: micro-behaviors/communications/proxy/config::firefox-proxy-port-pref
  - id: micro-behaviors/communications/proxy/config::firefox-proxy-autoconfig-pref
  needs: 2
