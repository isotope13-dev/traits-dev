defaults:
  crit: notable
  conf: 0.96
  platforms: [unix, windows]
  for: [scripts, source, json]
traits:
  - id: remote-tcp-serve-node
    desc: Remote TCP listener in proxy configuration
    if:
      type: text
      regex: '"ServeNodes"\s*:\s*\[\s*"rtcp://[^"\r\n]{1,180}"'
  - id: ssh-forward-chain-node
    desc: SSH relay in proxy forwarding configuration
    if:
      type: text
      regex: '"ChainNodes"\s*:\s*\[\s*"forward\+ssh://[^"\r\n]{1,180}"'
composite_rules:
  - id: ssh-remote-tcp-forward-config
    desc: Remote TCP listener with SSH relay chain
    near_bytes: 1024
    all:
      - id: remote-tcp-serve-node
      - id: ssh-forward-chain-node
