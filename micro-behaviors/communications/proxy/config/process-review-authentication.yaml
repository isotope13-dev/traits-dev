defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  crit: notable
  conf: 0.95
composite_rules:
  - id: proxy-credentials-on-all-url-auth-challenges
    desc: Proxy credentials answer all URL auth challenges
    crit: suspicious
    conf: 0.94
    scope: archive
    for:
      - crx
      - xpi
      - zip
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/auth::webrequest-credential-provider
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
      - id: micro-behaviors/communications/http/intercept::webrequest-all-url-filter
    near_bytes: 1800
