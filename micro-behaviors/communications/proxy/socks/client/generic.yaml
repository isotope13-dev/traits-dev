defaults:
  platforms:
    - unix
    - windows
    - android
  for: [scripts, binaries]
  mbc: C0001
  attack: T1090
traits:
  - id: curl-socks5-hostname
    desc: curl SOCKS5 hostname proxy
    crit: notable
    conf: 0.78
    for: [shell, scripts, binaries]
    if:
      type: text
      regex: \bcurl\b.{0,120}--socks5-hostname\b
      case_insensitive: true
  # curl through a SOCKS proxy carrying a request body (-d/--data/-X POST/
  # --upload-file): data pushed OUT through the tunnel — the beacon/exfil
  # transport shape. Neutral capability here; hostile intent comes from
  # composites pairing it with attacker endpoint evidence (onion C2, etc.).
  - id: curl-post-data-via-socks
    desc: curl sends POST data through SOCKS proxy
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(--data[ \t=]|-X[ \t]+POST\b|[\s"'']-d[ \t=])[^;]{0,240}--socks[45]'
  # curl response written to a file through a SOCKS proxy: a payload pulled
  # through the tunnel. Neutral capability; dropper intent comes from
  # composites that pair it with attacker endpoint evidence.
  - id: curl-output-file-via-socks
    desc: curl writes output file through SOCKS proxy
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '--socks[45][^;]{0,240}(\s-[A-Za-z]{0,6}[oO][ \t]+|--output[ \t]+)[^ \t\n;&|]'
  - id: go-x-net-socks-package
    desc: Go golang.org/x/net SOCKS client package
    crit: notable
    conf: 0.95
    for: [elf, macho, pe]
    if:
      type: text
      substr: golang.org/x/net/internal/socks
  # SOCKS-tunnel command verbs used by backdoors that proxy traffic over their
  # C2 channel (e.g. BurrowShell, SNOWGLAZE). Generic across families.
composite_rules:
  - id: socks-channel-data-transfer
    desc: SOCKS proxy carries request data
    crit: notable
    conf: 0.9
    any:
      - id: curl-post-data-via-socks
      - id: curl-output-file-via-socks
