# SOCKS5 wire-format opcode byte patterns. These atoms are deliberately
# narrow — they detect the protocol's literal request bytes (RFC 1928)
# and have no standalone signal. They are FP-prone in any large binary
# (only 3 bytes wide) and gain meaning only inside composites that gate
# on a SOCKS-related string or socket-server API surface.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
traits:
  # GCC/Clang commonly materialize the RFC 1928 greeting and domain-name
  # CONNECT request as stack immediates. Requiring both stores in the
  # composite below avoids treating either short constant as SOCKS by itself.
  - id: socks5-noauth-greeting-store-x86-64
    desc: x86-64 stores a SOCKS5 no-auth greeting
    crit: component
    conf: 0.96
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      pattern: "66 C7 85 ?? ?? ?? ?? 05 01 C6 85 ?? ?? ?? ?? 00"
      section: .text

  - id: socks5-domain-connect-store-x86-64
    desc: x86-64 stores a SOCKS5 domain CONNECT header
    crit: component
    conf: 0.98
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      pattern: "C7 04 24 05 01 00 03"
      section: .text

  - id: socks5-version-greeting-bytes
    desc: SOCKS5 no-auth handshake bytes
    crit: component
    conf: 0.9
    if:
      type: hex
      pattern: "05 01 00 05 00 00"
      section: text
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - type: section
        exact: .modinfo
  - id: socks5-bind-command-byte
    desc: SOCKS5 BIND wildcard-address request
    crit: component
    conf: 0.6
    if:
      type: hex
      pattern: "05 02 00 01 00 00 00 00 00 00"
      section: text
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - type: section
        exact: .modinfo
  - id: socks5-udp-associate-byte
    desc: SOCKS5 UDP wildcard-address request
    crit: component
    conf: 0.6
    if:
      type: hex
      pattern: "05 03 00 01 00 00 00 00 00 00"
      section: text
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - type: section
        exact: .modinfo

  # GCC/MinGW x86-64 materializes the ten-byte RFC 1928 server response as a
  # qword immediate followed by a zero port. These longer instruction patterns
  # distinguish server replies from short protocol constants in client code.
  - id: socks5-ipv4-success-reply-store-x86-64
    desc: x86-64 stores a SOCKS5 IPv4 success reply
    crit: component
    conf: 0.98
    platforms: [windows]
    for: [pe]
    if:
      type: hex
      pattern: "48 C7 84 24 ?? ?? ?? ?? 05 00 00 01 66 C7 84 24 ?? ?? ?? ?? 00 00"
      section: .text

  - id: socks5-host-unreachable-reply-store-x86-64
    desc: x86-64 stores a SOCKS5 host-unreachable reply
    crit: component
    conf: 0.98
    platforms: [windows]
    for: [pe]
    if:
      type: hex
      pattern: "48 C7 84 24 ?? ?? ?? ?? 05 04 00 01"
      section: .text

  - id: socks5-connection-refused-reply-store-x86-64
    desc: x86-64 stores a SOCKS5 connection-refused reply
    crit: component
    conf: 0.98
    platforms: [windows]
    for: [pe]
    if:
      type: hex
      pattern: "48 C7 84 24 ?? ?? ?? ?? 05 05 00 01"
      section: .text

composite_rules:
  - id: native-socks5-server-replies
    desc: Native SOCKS5 server reply handling
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [pe]
    all:
      - id: socks5-ipv4-success-reply-store-x86-64
      - id: micro-behaviors/communications/socket/init::winsock-server-symbol-lifecycle
    needs: 2
    any:
      - id: socks5-host-unreachable-reply-store-x86-64
      - id: socks5-connection-refused-reply-store-x86-64

  - id: native-socks5-domain-connect-client
    desc: Native SOCKS5 client sends a domain-name CONNECT request
    crit: notable
    conf: 0.98
    platforms: [linux]
    for: [elf]
    all:
      - id: socks5-noauth-greeting-store-x86-64
      - id: socks5-domain-connect-store-x86-64
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect::connect-symbol
