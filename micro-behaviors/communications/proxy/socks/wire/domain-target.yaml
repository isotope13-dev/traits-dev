defaults:
  platforms: [windows, unix]
  for: [python, c, cpp]

traits:
  - id: socks5-domain-connect-constant
    desc: Source encodes a SOCKS5 domain CONNECT request
    crit: notable
    conf: 0.96
    for: [c, cpp]
    if:
      type: text
      regex: '0x05\s*,\s*0x01\s*,\s*0x00\s*,\s*0x03'
  - id: socks5-domain-type-constant
    desc: Source defines a SOCKS5 domain-address type
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\b(ATYP|SOCKS5)[A-Z_]*\s*=\s*0x03\b'

composite_rules:
  - id: socks5-domain-target-constants
    desc: SOCKS5 domain-target protocol constants
    crit: notable
    conf: 0.95
    any:
      - id: socks5-domain-connect-constant
      - id: socks5-domain-type-constant
