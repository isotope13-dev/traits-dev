# SOCKS address types encode IPv4=1, hostname=3, IPv6=4; these are protocol
# mechanics, not evidence of malice until combined with remote relay behavior.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.96
  attack: T1090

traits:
  - id: python-socks-named-domain-branch
    desc: Decodes hostname in ATYP_DOMAIN branch
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (comparison_operator
            (identifier) "==" (identifier) @kind)
          consequence: (block
            (expression_statement (assignment
              right: (call
                function: (attribute
                  object: (subscript)
                  attribute: (identifier) @decode)))))) @branch
          (#eq? @kind "ATYP_DOMAIN")
          (#eq? @decode "decode"))

  - id: python-socks-ipv4-branch
    desc: Parses SOCKS type 1 IPv4 address
    if:
      type: text
      regex: '(?s)\bif\s+\w+\s*==\s*1\s*:.{0,100}\bsocket\.inet_ntoa\(\w+\[\w+:\w+\s*\+\s*4\]\)'

  - id: python-socks-hostname-branch
    desc: Decodes SOCKS type 3 hostname
    if:
      type: text
      regex: '(?s)\belif\s+\w+\s*==\s*3\s*:.{0,180}\b\w+\[\w+:\w+\s*\+\s*\w+\]\.decode\(\)'

composite_rules:
  - id: python-socks-address-parser
    desc: Parses SOCKS addresses and target port
    all:
      - id: python-socks-ipv4-branch
      - id: python-socks-hostname-branch
      - id: micro-behaviors/data/buffer/integer-codec::python-big-endian-uint16-slice-unpack
    near_lines: 24
