defaults:
  platforms: [android, unix, windows]
  for: [elf, android_apk, python, javascript, java, kotlin, c, cpp]
  crit: notable
  conf: 0.91
  attack: T1090
  mbc: C0003

traits:
  - id: socks5-relay-inbound-data
    desc: SOCKS5 relay receives stream data
    conf: 0.9
    for: [elf, python, javascript, java, kotlin, c, cpp]
    if:
      type: text
      # Require socket recv/receive calls — not `def read(self)` on response wrappers.
      regex: '(?is)socks5\w*.{0,80}\b(recv|receive)\s*\('

  - id: socks5-relay-outbound-write-generic
    desc: SOCKS5 relay writes stream data
    conf: 0.9
    for: [elf, python, javascript, c, cpp]
    if:
      type: text
      regex: '(?is)socks5\w*.{0,80}\b(send|sendall|write)\s*\('

  - id: socks5-stream-output-write
    desc: Writes through a SOCKS5 stream
    conf: 0.95
    for: [java, kotlin]
    if:
      type: text
      # A status message on another channel does not prove forwarding.
      regex: '(?i)\bsocks5\w*\s*\.\s*(send|sendall|write)\s*\('

  - id: socks5-relay-outbound-pipe
    desc: SOCKS5 relay pipes stream data
    conf: 0.9
    for: [elf, python, javascript, java, kotlin, c, cpp]
    if:
      type: text
      regex: '(?is)socks5\w*.{0,80}\b(pipe|forward)\s*\('

  - id: socks5-stream-input-read
    desc: SOCKS5 relay reads from stream
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: '(?i)\bsocks5\w*\s*\.\s*read\s*\('

composite_rules:
  - id: socks5-relay-outbound-write
    desc: SOCKS5 relay writes stream data
    conf: 0.9
    for: [elf, python, javascript, java, kotlin, c, cpp]
    any:
      - id: socks5-relay-outbound-write-generic
      - id: socks5-stream-output-write

  - id: socks5-relay-inbound
    desc: SOCKS5 relay inbound stream read
    crit: component
    conf: 0.9
    any:
      - id: socks5-relay-inbound-data
      - id: socks5-stream-input-read

  - id: socks5-stream-relay
    desc: SOCKS5 stream forwarding capability
    crit: notable
    conf: 0.91
    all:
      - id: socks5-relay-inbound
    any:
      - id: socks5-relay-outbound-write
      - id: socks5-relay-outbound-pipe
      # Source implementations often name SOCKS in the enclosing relay
      # function rather than beside each send call. The generic native
      # bidirectional-copy composite still proves both recv and send calls.
      - id: micro-behaviors/communications/proxy/relay::native-socket-buffer-forwarding

  # Public exposure is notable relay behavior, not backdoor intent. Higher
  # tiers add operator-control or persistence evidence when it is malicious.
  - id: public-socks5-relay-node
    desc: Publicly exposed SOCKS5 stream relay
    crit: notable
    conf: 0.94
    for: [elf, python, javascript, java, c, kotlin]
    platforms: [linux, macos, windows, android]
    attack: T1090.001
    all:
      - id: socks5-stream-relay
    any:
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces-call
      - id: micro-behaviors/communications/socket/bind/address::bind-inaddr-any
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
