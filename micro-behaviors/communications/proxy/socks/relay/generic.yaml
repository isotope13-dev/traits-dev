defaults:
  platforms:
    - unix
    - windows
    - android
  for: [scripts, binaries]
  mbc: C0001
  attack: T1090
traits:
  - id: socks-connect-command
    desc: socks_connect tunnel command verb
    crit: notable
    conf: 0.6
    if:
      type: text
      word: socks_connect
  - id: socks-data-command
    desc: socks_data tunnel command verb
    crit: notable
    conf: 0.6
    if:
      type: text
      word: socks_data
  - id: socks-close-command
    desc: socks_close tunnel command verb
    crit: notable
    conf: 0.6
    if:
      type: text
      word: socks_close
