defaults:
  platforms:
    - unix
    - windows
    - android
  for: [scripts, binaries]
  mbc: C0001
  attack: T1090
traits:
  - id: socks4a-proto
    desc: SOCKS4a protocol string
    crit: component
    conf: 0.9
    if:
      type: text
      substr: socks4a
  - id: socks4-proto
    desc: SOCKS4 protocol reference
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: SOCKS4
    unless:
      - id: well-known/lib/web/site-platforms/stacksjs/stacks::iana-whois-bootstrap-url
  - id: socks5-proto
    desc: SOCKS5 protocol reference
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: SOCKS5
    unless:
      - id: well-known/lib/web/site-platforms/stacksjs/stacks::iana-whois-bootstrap-url
  # Mirai-lineage proxy banner ("SOCKS5 on :%d" status line): a proxy
  # implementation announcing itself, not a generic protocol reference.
  - id: socks5-proxy-status-banner
    desc: SOCKS5 proxy status banner
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'SOCKS5 on'
  - id: socks5-string
    desc: SOCKS5 proxy URL or operation marker
    crit: notable
    conf: 0.5
    if:
      type: text
      # Go x/net's "socks5hangup" error token is not itself a proxy use.
      regex: '(?i)\bsocks5(h)?(://|[[:space:]_-]+(proxy|server|connect|dial))'
  - id: socks5h-proto
    desc: SOCKS5h protocol string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: socks5h
  - id: socks5h-url-source
    desc: SOCKS5h proxy URL in Rust
    crit: notable
    conf: 0.86
    for: [rust]
    if:
      type: text
      substr: socks5h://
  - id: socks4-string
    desc: "SOCKS4 proxy protocol marker"
    # A single protocol word is common in proxy-capable clients and is not
    # analyst-worthy without the surrounding SOCKS behavior.
    crit: notable
    conf: 0.5
    if:
      type: text
      word: socks4
  - id: socks-url
    desc: SOCKS URL scheme
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: socks://
  - id: socks-port-context
    desc: SOCKS/proxy context with port 1080
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (socks|proxy)[:/].{0,30}1080
      case_insensitive: true
  - id: socks-port-literal
    desc: SOCKS URL uses port 1080
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '\bsocks(4|5|5h)?://[^[:space:]"'']{1,80}:1080\b'
      case_insensitive: true
    unless:
      - id: well-known/lib/media/regula-facesdk/
  - id: socks-port-keyvalue
    desc: SOCKS/proxy port 1080 key/value assignment
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '\b(socks|proxy)[A-Za-z0-9_-]{0,24}port\s*[=:]\s*["'']?1080\b'
      case_insensitive: true
  - id: socks-server-ref
    desc: SOCKS server terminology
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: socks server
      case_insensitive: true
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
    not:
      - regex: (?i)socks server (sent|reported|refused|wanted|asked)
      - regex: (?i)can't complete socks[45]? connection
      - regex: (?i)request rejected
      # Go's net/http bundles a SOCKS5 *dialer* (used only when the proxy env
      # vars name a socks5:// URL), and its reply-code table ships this
      # sentence in every Go binary that links net/http — including ones with
      # no other SOCKS evidence at all. Same class as the curl client errors
      # above: a diagnostic about a SOCKS server, not use of one.
      - regex: (?i)(general )?socks server failure
  - id: shell-socks5-proxy-variable
    desc: Shell variable stores SOCKS5 proxy option
    crit: notable
    conf: 0.82
    for: [shell]
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z0-9_]*\s*=\s*["'']?[^"\n]{0,16}--socks5-hostname\b'
      case_insensitive: true
  # Neutral package-identity read: the Go linker keeps the import path of the
  # SOCKS dialer that golang.org/x/net/proxy builds on. Every Go program that
  # vendors x/net (Kubernetes clients, gRPC, HTTP/2 stacks) carries it, so this
  # states a capability only — proxy-abuse intent lives in objectives/.
composite_rules:
  - id: socks
    desc: SOCKS proxy protocol references
    crit: notable
    conf: 0.66
    any:
      - id: socks4-proto
      - id: socks5-proto
      - id: socks5-string
      - id: socks5h-proto
      - id: micro-behaviors/communications/proxy/socks/server::socks5-server-symbol
      - id: socks4-string
      - id: socks-url
      - id: socks-server-ref
      - id: micro-behaviors/communications/proxy/socks/client::curl-socks5-hostname
      - id: socks-port
  - id: socks-port
    desc: SOCKS port 1080 reference
    crit: notable
    conf: 0.5
    any:
      - id: socks-port-context
      - id: socks-port-literal
      - id: socks-port-keyvalue
    unless:
      - id: well-known/lib/media/regula-facesdk/
  # Data actually moves through a SOCKS proxy — a request body sent out, or a
  # response saved to disk. Neutral channel capability; objective composites
  # pair it with attacker endpoint evidence (onion C2, hardcoded relay hosts)
  # to assert exfil/dropper intent.
  - id: socks5-indicator
    desc: SOCKS5 protocol or proxy indicator
    crit: notable
    conf: 0.65
    any:
      - id: socks5-string
      - id: socks5h-proto
      - id: socks5-proto
