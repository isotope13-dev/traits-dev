# urllib3 keeps SOCKS support in an optional contrib module, so importing
# `urllib3.contrib.socks` or building a `SOCKSProxyManager` is an explicit
# decision to route HTTP traffic through a SOCKS proxy instead of connecting
# directly. Benign API clients expose it as a configuration option; tunnelled
# C2 and stealers use the same two entry points to reach a Tor or relay hop.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
  mbc: C0001
  attack: T1090

traits:
  - id: urllib3-socks-module-import
    desc: Imports the urllib3 SOCKS proxy module
    if:
      type: import
      exact: urllib3.contrib.socks

  - id: socks-proxy-manager-construction
    desc: Constructs a urllib3 SOCKSProxyManager
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SOCKSProxyManager$'
