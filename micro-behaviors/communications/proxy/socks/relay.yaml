defaults:
  platforms: [android, unix, windows]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  crit: notable
  conf: 0.91
  attack: T1090
  mbc: C0003

traits:
  - id: socks5-relay-inbound-data
    desc: SOCKS5 relay receives stream data
    conf: 0.9
    if:
      type: text
      regex: '(?is)socks5\w*.{0,600}\b(recv|receive|read|data)\b'

  - id: socks5-relay-outbound-write
    desc: SOCKS5 relay writes stream data
    conf: 0.9
    if:
      type: text
      regex: '(?is)socks5\w*.{0,600}\b(send|sendall|write)\b'

  - id: socks5-relay-outbound-pipe
    desc: SOCKS5 relay pipes stream data
    conf: 0.9
    if:
      type: text
      regex: '(?is)socks5\w*.{0,600}\b(pipe|forward)\b'

composite_rules:
  - id: socks5-stream-relay
    desc: SOCKS5 bidirectional stream relay
    crit: notable
    conf: 0.91
    all:
      - id: socks5-relay-inbound-data
    any:
      - id: socks5-relay-outbound-write
      - id: socks5-relay-outbound-pipe
