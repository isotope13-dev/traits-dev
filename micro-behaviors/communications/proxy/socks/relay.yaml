defaults:
  platforms: [android, unix, windows]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  crit: notable
  conf: 0.91
  attack: T1090
  mbc: C0003

traits:
  - id: socks-relay-bind-public-literal
    desc: Listener binds a public address literal
    crit: notable
    conf: 0.9
    if:
      type: text
      # Match the address passed to a listener, not prose such as
      # "public SOCKS relay".
      #
      # The IPv6 any-address branch must be quoted. Unquoted `::` is C++'s
      # scope-resolution operator, so `std::bind(&TraceTracker::addInstruction,
      # ...)` — an ordinary member-function binder, and one of the commonest
      # constructs in C++ — matched `bind(` ... `::` and was reported as a
      # SOCKS relay binding a public listener (T1090) in a RISC-V simulator.
      # Real listeners spell the address as a string: bind(("::", port)).
      regex: '(?i)\bbind\s*\([^;\n]{0,80}(0\.0\.0\.0|["'']::["''])'

  - id: socks-relay-bind-any-constant
    desc: Listener binds the INADDR_ANY address
    crit: notable
    conf: 0.9
    if:
      type: text
      # C commonly assigns INADDR_ANY before calling bind().
      regex: '(?is)\bINADDR_ANY[\s\S]{0,120}\bbind\s*\('

  - id: socks-relay-listen-public-literal
    desc: Listener listens on a public address literal
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\blisten\s*\([^;\n]{0,80}(0\.0\.0\.0|::)'

  - id: socks5-relay-inbound-data
    desc: SOCKS5 relay receives stream data
    conf: 0.9
    if:
      type: text
      # Require socket recv/receive calls — not `def read(self)` on response wrappers.
      regex: '(?is)socks5\w*.{0,600}\b(recv|receive)\s*\('

  - id: socks5-relay-outbound-write
    desc: SOCKS5 relay writes stream data
    conf: 0.9
    if:
      type: text
      # Require a send/write *call*, mirroring the inbound leg. A bare word
      # match fired on connection-manager config templates that list a
      # `socks5 tunnel active:` key near a `send string active:` key.
      regex: '(?is)socks5\w*.{0,600}\b(send|sendall|write)\s*\('

  - id: socks5-relay-outbound-pipe
    desc: SOCKS5 relay pipes stream data
    conf: 0.9
    if:
      type: text
      regex: '(?is)socks5\w*.{0,600}\b(pipe|forward)\s*\('

composite_rules:
  - id: socks-relay-public-bind
    desc: SOCKS relay binds a public address
    crit: notable
    conf: 0.9
    any:
      - id: socks-relay-bind-public-literal
      - id: socks-relay-bind-any-constant
      - id: socks-relay-listen-public-literal

  - id: socks5-stream-relay
    desc: SOCKS5 bidirectional stream relay
    crit: notable
    conf: 0.91
    all:
      - id: socks5-relay-inbound-data
    any:
      - id: socks5-relay-outbound-write
      - id: socks5-relay-outbound-pipe

  # Public exposure is notable relay behavior, not backdoor intent. Higher
  # tiers add operator-control or persistence evidence when it is malicious.
  - id: public-socks5-relay-node
    desc: Publicly exposed SOCKS5 stream relay
    crit: notable
    conf: 0.94
    for: [source, scripts, binaries]
    platforms: [linux, macos, windows, android]
    attack: T1090.001
    all:
      - id: socks5-stream-relay
      - id: socks-relay-public-bind
