# SOCKS5 protocol helpers exported by native Windows proxy DLLs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.92
  attack: T1090
  mbc: C0001

traits:
  - id: socks5-accept-export
    desc: Exports Socks5Accept handler
    if:
      type: symbol
      exact: Socks5Accept

  - id: socks5-auth-export
    desc: Exports Socks5Auth handler
    if:
      type: symbol
      exact: Socks5Auth

  - id: socks5-serv-connect-export
    desc: Exports Socks5ServConnect handler
    if:
      type: symbol
      exact: Socks5ServConnect

  - id: socks5-get-cmd-export
    desc: Exports Socks5GetCmd handler
    if:
      type: symbol
      exact: Socks5GetCmd

  - id: socks5-exec-export
    desc: Exports socks5_exec entry
    if:
      type: symbol
      exact: socks5_exec

  - id: xsocks5-export
    desc: Exports xsocks5 helper
    if:
      type: symbol
      exact: xsocks5

  # Export-directory module name used by socks55-style proxy DLLs. Kept here
  # (not well-known/) so packed builds with nonstandard section names still match
  # without a brittle .rdata/.data section filter.
  - id: socks55-dll-name-string
    desc: Mentions socks55.dll module name
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: socks55.dll

composite_rules:
  - id: socks5-proxy-export-cluster
    desc: Native SOCKS5 proxy export cluster
    crit: notable
    conf: 0.96
    all:
      - id: socks5-accept-export
      - id: socks5-auth-export
    any:
      - id: socks5-serv-connect-export
      - id: socks5-get-cmd-export
      - id: socks5-exec-export
      - id: xsocks5-export
    needs: 1
