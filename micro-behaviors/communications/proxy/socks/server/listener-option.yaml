# GOST's -L URL is a listener declaration, unlike an ordinary SOCKS client
# proxy URL. No executable basename, credential, address or port is required.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe]
  crit: notable
  conf: 0.95
  attack: T1090
traits:
  - id: socks-listener-url-option
    desc: SOCKS listener declared with URL option
    if:
      type: text
      regex: '-L["'']?[\s,=]+\\?["'']?socks5?://'
