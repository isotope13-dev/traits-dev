defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-socks5-selects-no-auth
    desc: SOCKS5 server selects no authentication
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule python_socks5_selects_no_auth {
          strings:
            $server = "class SOCKS5Proxy:"
            $methods = "methods = client.recv(nmeth)"
            $selection = "client.send(bytes([5, 0]))"
            $connect = "dest.connect((target, port))"
          condition:
            all of them and @server < @methods and @methods < @selection and
            @selection < @connect
        }
