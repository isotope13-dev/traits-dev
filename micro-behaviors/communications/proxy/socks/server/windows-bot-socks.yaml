# Windows botnet SOCKS5 proxy source patterns (including .txt source backups).
defaults:
  platforms: [windows]
  for: [c, cpp, text]

traits:
  - id: socks-protocol-constants-source
    desc: SOCKS protocol constants and relay loop
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(SOCKS_VERSION|SOCKS_CONNECT_ERROR|SocksLoopThread)\b'

  - id: socks5-listen-port-dispatch
    desc: Launches Socks5 thread with listen port
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '&Socks5\b[^;\n]{0,80}(ListenPort|Port)\b'
