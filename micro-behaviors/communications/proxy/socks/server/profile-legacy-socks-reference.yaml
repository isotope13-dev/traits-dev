defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]
traits:
  - id: go-socks-handler
    desc: Go SOCKS handler name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: handleSocks
    unless:
      - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: go-socks-dispatch-symbol
    desc: Go SOCKS command dispatcher symbol
    crit: notable
    conf: 0.98
    for: [elf]
    if:
      type: text
      substr: main.dispatchSocks
      section: .gopclntab
  - id: go-socks-config-or-server-type
    desc: Go SOCKS config or server type
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*socks5\.(Config|Server)\b'
  - id: go-socks-request-or-ruleset-type
    desc: Go SOCKS request or ruleset type
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*socks5\.(Request|RuleSet)\b'
  - id: go-socks-authenticator-type
    desc: Go SOCKS authenticator type
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\*socks5\.(Authenticator)\b'
  - id: go-socks-config-name
    desc: Go SOCKS config name
    crit: notable
    conf: 0.72
    if:
      type: text
      word: SocksConfig
composite_rules:
  - id: go-socks-config-type
    desc: Go SOCKS config type
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/communications/proxy/socks/server::go-socks-config-or-server-type
      - id: micro-behaviors/communications/proxy/socks/server::go-socks-request-or-ruleset-type
      - id: micro-behaviors/communications/proxy/socks/server::go-socks-authenticator-type
