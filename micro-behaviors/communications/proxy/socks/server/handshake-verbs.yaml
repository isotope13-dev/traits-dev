defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
traits:
  # A SOCKS proxy that serves clients shakes hands: it receives the client's
  # greeting and sends its own acknowledgement. Client-only code (curl
  # --socks5, dialer libraries) never prints the server side of the exchange,
  # so these verbs identify a server implementation, not a client option.
  - id: socks-server-handshake-verbs
    desc: SOCKS proxy server handshake implementation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsocks5 (recv valid|send) handshake\b|\bimplement socks[0-9](/[0-9])? proxy\b'
