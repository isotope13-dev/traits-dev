# SOCKS proxy implementation in C source code
# Backdoor component of worms (Mydoom xproxy)
defaults:
  for: [c, cpp]
  platforms: [windows, unix]
traits:
  - id: socks4-header-struct
    desc: SOCKS4 header struct definition
    crit: notable
    conf: 0.93
    if:
      type: text
      word: "socks4_header"
  - id: socks4-constants
    desc: SOCKS4 protocol constants
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: "SOCKS4_(SUCCEEDED|REJECTED)"
  - id: socks-relay-function
    desc: SOCKS relay function
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "relay_socks"
  - id: socks-server-function
    desc: SOCKS server function
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "socks4_(server|main|client)"
  - id: socks5-protocol-source
    desc: SOCKS5 protocol reference in C source
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsocks5\b'
  - id: socks5-relay-source
    desc: C SOCKS5 relay receives stream data
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bSOCKS5\b[^b\n]{0,700}\b(recv|read)\s*\('
    # The companion write leg is joined below. Keeping each scan bounded
    # avoids treating a distant protocol mention as stream forwarding.

  - id: socks5-relay-write-source
    desc: C SOCKS5 relay writes stream data
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bSOCKS5\b[^b\n]{0,700}\b(send|write)\s*\('
  # A generic SOCKS5 command/help string is a proxy capability, not evidence
  # of C2 tunneling. Objective composites add the pivoting context separately.
  - id: source-socks5-proxy-command
    desc: SOCKS5 proxy command text in C source
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)socks5 proxy|list all socks5 proxy servers'
composite_rules:
  - id: socks4-proxy-implementation
    desc: SOCKS4 proxy in C source
    crit: suspicious
    conf: 0.95
    attack: T1090
    any:
      - id: socks4-header-struct
      - id: socks4-constants
    all:
      - id: socks-server-function
  - id: socks5-proxy-implementation
    desc: SOCKS5 listener and relay implementation in C source
    crit: suspicious
    conf: 0.95
    attack: T1090
    all:
      - id: socks5-protocol-source
      - id: micro-behaviors/communications/socket/listen::server-socket-source
      - id: socks5-relay-source
      - id: socks5-relay-write-source
