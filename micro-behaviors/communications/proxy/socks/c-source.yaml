# SOCKS proxy implementation in C source code
# Backdoor component of worms (Mydoom xproxy)
defaults:
  for: [c, cpp]
  platforms: [windows, unix]
traits:
  - id: socks4-header-struct
    desc: SOCKS4 header struct definition
    crit: notable
    conf: 0.93
    if:
      type: text
      word: "socks4_header"
  - id: socks4-constants
    desc: SOCKS4 protocol constants
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: "SOCKS4_(SUCCEEDED|REJECTED)"
  - id: socks-relay-function
    desc: SOCKS relay function
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "relay_socks"
  - id: socks-server-function
    desc: SOCKS server function
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "socks4_(server|main|client)"
  - id: socks5-protocol-source
    desc: SOCKS5 protocol reference in C source
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsocks5\b'
  - id: socks5-listener-source
    desc: C source listens for proxy clients
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)\b(bind|listen)\s*\([^)]{0,160}\).{0,256}\baccept\s*\('
  - id: socks5-relay-source
    desc: C source relays proxy data
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)\b(select|poll)\s*\([^)]{0,180}\).{0,256}\b(recv|send)\s*\('
composite_rules:
  - id: socks4-proxy-implementation
    desc: SOCKS4 proxy in C source
    crit: suspicious
    conf: 0.95
    attack: T1090
    any:
      - id: socks4-header-struct
      - id: socks4-constants
    all:
      - id: socks-server-function
  - id: socks5-proxy-implementation
    desc: SOCKS5 listener and relay implementation in C source
    crit: suspicious
    conf: 0.95
    attack: T1090
    all:
      - id: socks5-protocol-source
      - id: socks5-listener-source
      - id: socks5-relay-source
