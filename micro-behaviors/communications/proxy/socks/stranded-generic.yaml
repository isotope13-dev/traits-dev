# Neutral observations reviewed from stranded members.
defaults:
  for:
  - python
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.9
  size_max: 5000000
traits:
- id: python-socks-base64-context
  desc: SOCKS text near Python Base64 decoding
  if:
    type: text
    regex: socks.{0,80}base64\.b64decode|base64\.b64decode.{0,80}socks
- id: python-socks-json-context
  desc: SOCKS text near Python JSON parsing
  if:
    type: text
    regex: socks.{0,80}json\.loads|json\.loads.{0,80}socks
