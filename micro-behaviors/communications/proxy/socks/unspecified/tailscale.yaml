defaults:
  platforms: [unix, windows]
  for: [python, shell, scripts]

traits:
  - id: local-socks-egress-proxy
    desc: Tailscale loopback SOCKS proxy option reference
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\btailscale(d)?\b.{0,360}--socks5-server(=|\s+)127\.0\.0\.1:[0-9]+'

