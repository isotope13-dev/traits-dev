defaults:
  platforms: [unix, appliance]
  for: [shell]
  crit: notable
  conf: 0.92
  attack: T1090.001

traits:
  - id: socks-server-all-interfaces
    desc: SOCKS5 server binds all interfaces
    conf: 0.94
    if:
      type: text
      regex: '\b(socks5|microsocks)\b[^\n]{0,120}\s-a\s+0\.0\.0\.0\b'

  - id: socks-server-auth-user-pass
    desc: SOCKS5 server uses user/password options
    conf: 0.93
    if:
      type: text
      regex: '\b(socks5|microsocks)\b[^\n]{0,180}\s-u\s+\S{1,64}[^\n]{0,80}\s-k\s+\S{1,64}'

  - id: socks-server-high-port
    desc: SOCKS5 server uses a high port
    conf: 0.9
    if:
      type: text
      regex: '\b(socks5|microsocks)\b[^\n]{0,160}\s-p\s+[1-9][0-9]{3,4}\b'
