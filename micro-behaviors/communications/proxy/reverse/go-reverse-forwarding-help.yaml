---
defaults:
  crit: notable
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  - go
traits:
- id: reverse-port-forwarding-help
  desc: Reverse port forwarding help
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: reverse port forwarding
- id: ssh-proxycommand-tunnel-help
  desc: SSH ProxyCommand tunnel help
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: ssh -o ProxyCommand=.{0,160}\btunnel\b
composite_rules:
- id: go-reverse-socks-tunnel-help
  desc: Go reverse SOCKS tunnel help
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/communications/proxy/reverse::reverse-port-forwarding-help
  - id: micro-behaviors/communications/proxy/reverse::reverse-socks-remote-help
  - id: micro-behaviors/communications/proxy/reverse::ssh-proxycommand-tunnel-help
  - id: micro-behaviors/communications/proxy/socks/server::go-socks-config-name
  needs: 2
