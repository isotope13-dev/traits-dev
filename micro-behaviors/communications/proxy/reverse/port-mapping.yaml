# Chisel's remote mapping grammar is independent of the executable name,
# controller address and chosen ports. Braces also cover source templates.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe]
  crit: notable
  conf: 0.95
  attack: T1572
traits:
  - id: reverse-loopback-port-mapping
    desc: Reverse forwarding maps a loopback TCP endpoint
    if:
      type: text
      regex: '\bR:([^:\s"''<>]{1,64}:){1,2}(127\.0\.0\.1|localhost):[\w{}]+'
  - id: reverse-ipv6-loopback-port-mapping
    desc: Reverse forwarding maps IPv6 loopback TCP
    if:
      type: text
      regex: '\bR:([^:\s"''<>]{1,64}:){1,2}\[::1\]:[\w{}]+'
composite_rules:
  - id: reverse-local-port-mapping
    desc: Reverse forwarding targets a loopback endpoint
    any:
      - id: reverse-loopback-port-mapping
      - id: reverse-ipv6-loopback-port-mapping
