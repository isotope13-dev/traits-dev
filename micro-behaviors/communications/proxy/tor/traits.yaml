defaults:
  platforms: [unix, windows, android]
  for: [scripts, binaries]
  attack: T1090.003
  mbc: C0001

traits:
  - id: onion-domain-reference
    desc: Tor onion hidden-service domain reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b[a-z2-7]{16,56}\.onion\b'

  - id: onion-domain-source-literal
    desc: Source contains an onion service literal
    crit: notable
    conf: 0.94
    for: [c, cpp]
    if:
      type: string_literal
      regex: '(?i)^[a-z2-7]{16,56}\.onion$'

  - id: hidden-service-loopback-variable-port
    desc: Tor service uses a variable loopback port
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?mi)^\s*HiddenServicePort\s+\d+\s+127\.0\.0\.1:\$'

  - id: single-hop-circuit-config
    desc: Enables Tor single-hop circuits
    crit: suspicious
    conf: 0.95
    if:
      type: text
      word: AllowSingleHopCircuits
