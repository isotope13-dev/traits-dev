defaults:
  platforms: [unix, windows, android]
  for: [scripts, binaries]
  attack: T1090.003
  mbc: C0001

traits:
  - id: tor-newnym-control-signal
    desc: Requests a new Tor circuit
    crit: notable
    conf: 0.96
    for: [shell, python]
    if:
      type: literal
      regex: '(?i)SIGNAL\s+NEWNYM'

  # Column-0 torrc / heredoc form. Markdown and wiki walkthroughs generally
  # indent the directive as quoted documentation, while generated torrc
  # payloads write it at column 0.
  - id: hidden-service-directory-config
    desc: Configures Tor hidden-service directory
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [powershell, shell, batch, pe, elf]
    if:
      type: text
      regex: (?mi)^HiddenServiceDir\s+\S+

  - id: tor-onion-socks-state-function
    desc: Tor/onion/SOCKS state-named function
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|[_-])(tor|onion|socks)[_-].{0,32}state'

  - id: onion-domain-reference
    desc: Tor onion hidden-service domain reference
    crit: notable
    conf: 0.9
    if:
      type: text
      # Onion service identifiers are exactly 16 characters (legacy v2) or
      # 56 characters (v3); intermediate lengths are not valid identifiers.
      regex: '(?i)\b([a-z2-7]{16}|[a-z2-7]{56})\.onion\b'

  - id: onion-domain-source-literal
    desc: Source contains an onion service literal
    crit: notable
    conf: 0.94
    for: [c, cpp]
    if:
      type: string_literal
      regex: '(?i)^([a-z2-7]{16}|[a-z2-7]{56})\.onion$'

  - id: hidden-service-loopback-variable-port
    desc: Tor service uses a variable loopback port
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?mi)^\s*HiddenServicePort\s+\d+\s+127\.0\.0\.1:\$'

  # The daemon's own startup log format string. Distros (OpenWrt musl/MIPS
  # builds) ship it stripped without section headers, so the banner is
  # matched as whole-file vocabulary; the size bounds keep the scan inside
  # real executables. well-known/dual-use/tunnel/tor builds its referenceable
  # tor-version-banner identity on this atom.
  - id: tor-daemon-version-banner
    desc: Tor daemon version banner string
    crit: notable
    conf: 0.95
    platforms: [unix]
    for: [elf]
    size_min: 512
    size_max: 20000000
    if:
      type: text
      substr: "Tor version"

  # The NTOR onboarding handshake constant every Tor client implements; its
  # presence beside the version banner identifies the real daemon.
  - id: tor-ntor-protocol-constant
    desc: Tor NTOR handshake protocol constant
    crit: notable
    conf: 0.95
    platforms: [unix]
    for: [elf]
    size_min: 512
    size_max: 20000000
    if:
      type: text
      exact: ntor-curve25519-sha256-1

  - id: single-hop-circuit-config
    desc: Enables Tor single-hop circuits
    crit: suspicious
    conf: 0.95
    if:
      type: text
      word: AllowSingleHopCircuits
    unless:
      - id: well-known/dual-use/tunnel/tor::tor-version-banner
      - id: well-known/dual-use/tunnel/tor::windows-tor-native-runtime
