---
defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - binaries
traits:
- id: macos-system-proxy-config
  desc: SCDynamicStoreCopyProxies symbol reference
  crit: notable
  conf: 0.92
  platforms:
  - macos
  for:
  - macho
  - dylib
  if:
    type: symbol
    exact: SCDynamicStoreCopyProxies
- id: macos-proxy-keys
  desc: macOS HTTP proxy keys
  crit: notable
  conf: 0.85
  platforms:
  - macos
  for:
  - macho
  - dylib
  if:
    type: symbol
    regex: "^kSCPropNetProxies(HTTP|HTTPS)"
- id: dotnet-webbrowserproxy-class
  desc: ".NET WebBrowserProxy helper class"
  crit: notable
  conf: 0.82
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    exact: WebBrowserProxy
- id: dotnet-set-connection-proxy
  desc: SetConnectionProxy name reference
  crit: notable
  conf: 0.86
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    exact: SetConnectionProxy
- id: dotnet-restore-system-proxy
  desc: RestoreSystemProxy name reference
  crit: notable
  conf: 0.84
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    exact: RestoreSystemProxy
- id: dotnet-proxy-address-property
  desc: ".NET proxy address property"
  crit: notable
  conf: 0.76
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    exact: ProxyAddress
composite_rules:
- id: dotnet-system-proxy-modification
  desc: System proxy helper name clues
  crit: notable
  conf: 0.86
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/communications/proxy/system::dotnet-webbrowserproxy-class
  any:
  - id: micro-behaviors/communications/proxy/system::dotnet-set-connection-proxy
  - id: micro-behaviors/communications/proxy/system::dotnet-restore-system-proxy
  - id: micro-behaviors/communications/proxy/system::dotnet-proxy-address-property
