# JavaScript source that names the Windows ProxyEnable value. A bare name only
# shows the setting exists; consumers pair it with the behavior that changes it.
defaults:
  for: [javascript]
  platforms: [windows]
  crit: notable
  attack: T1090
  conf: 0.9

traits:
  - id: js-proxy-enable-value-name
    desc: JavaScript source names the ProxyEnable value
    if:
      type: text
      substr: ProxyEnable
