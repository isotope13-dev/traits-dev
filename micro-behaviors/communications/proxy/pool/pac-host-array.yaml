# Proxy endpoint pools: a PAC resolver whose return value is generated from
# an in-code list of proxy hosts rather than naming one server. Failover
# chains across a pool are ordinary for commercial proxies; the observation
# is that the route set is a list the code chooses from.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1090

traits:
  - id: pac-https-chain-from-host-array
    desc: PAC maps host list to HTTPS chain
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)FindProxyForURL[\s\S]{0,300}\.map\(\s*\w+\s*=>\s*`HTTPS \$\{'
