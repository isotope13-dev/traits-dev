---
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  - binaries
  size_max: 5000000
composite_rules:
- id: core-dump-gso-spoof-reference-cluster
  size_min: 512
  size_max: 500000000
  desc: CoreDump, GSO, proxy and spoofing names
  crit: suspicious
  conf: 0.9
  platforms:
  - linux
  for:
  - elf
  all:
  - id: metadata/binary/symbols/name/function::core-dump-member-name
  - id: metadata/binary/symbols/name/function::gvisor-gso-capability-name
  - id: micro-behaviors/communications/proxy/library::proxy-func
  - id: metadata/binary/symbols/name/function::set-spoofing-name
