defaults:
  platforms:
    - unix
    - windows
    - android
  for: [scripts, binaries]
traits:
  # Ultraviolet — the service-worker web proxy from the same ecosystem as
  # Scramjet below. It registers a service worker that intercepts every request
  # the tab makes, rewrites URLs through a `/service/<encoded>` prefix, and
  # relays them to an upstream ("bare") server, so the proxied site renders
  # under the proxy's own origin with all links and forms rewritten.
  #
  # Its intended use is circumventing network filters, which makes a bare
  # reference dual-use rather than malicious. It is also, unmodified, a working
  # adversary-in-the-middle harness: the same transparent rewriting relays a
  # real identity-provider login page and exposes the traffic to the operator.
  # Intent lives in objectives/credential-access/phishing/mfa-relay/ and
  # objectives/command-and-control/channel/proxy/.
  - id: ultraviolet-config-global
    desc: References the Ultraviolet proxy config
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: __uv$config
  - id: ultraviolet-service-worker-class
    desc: References the Ultraviolet worker class
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: UVServiceWorker
  - id: ultraviolet-codec-namespace
    desc: References the Ultraviolet URL codec
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      substr: Ultraviolet.codec
  - id: ultraviolet-runtime-script
    desc: Loads an Ultraviolet runtime script
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'uv\.(bundle|sw|handler|client)\.js'
  - id: scramjet-client-token
    desc: References ScramjetClient proxy runtime
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: ScramjetClient
  - id: scramjet-client-name-token
    desc: References Scramjet client-name runtime
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: SCRAMJETCLIENTNAME
  - id: scramjet-fetch-handler-token
    desc: References Scramjet proxy fetch handler
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: ScramjetFetchHandler
  - id: libcurl-js-runtime
    desc: Includes libcurl.js browser transport
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: libcurl.js
  - id: websocket-proxy-runtime
    desc: Configures WebSocket proxy transport
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'websocket proxy (url|transport)|set_websocket'
  - id: proxy-func
    desc: Proxy function reference (potential proxying
    crit: notable
    conf: 0.5
    attack: T1090
    if:
      type: text
      word: ProxyFunc
    unless:
      - type: text
        substr: envProxyFunc
      - type: text
        substr: httpproxy.(*Config).ProxyFunc
  - id: armon-go-socks5
    desc: Uses github.com/armon/go-socks5 library
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: github.com/armon/go-socks5
    unless:
      - id: well-known/dual-use/tunnel/frp::frp-tool

  - id: golang-x-net-proxy-from-environment
    desc: Go x/net proxy from environment
    crit: notable
    conf: 0.93
    for: [go]
    if:
      type: text
      regex: 'proxy\.FromEnvironment(Using)?\s*\('
  - id: macos-system-proxy-config
    desc: Reads macOS system proxy settings
    crit: notable
    conf: 0.92
    platforms:
      - macos
    for:
      - macho
      - dylib
    if:
      type: symbol
      exact: SCDynamicStoreCopyProxies
  - id: macos-proxy-keys
    desc: macOS HTTP proxy keys
    crit: notable
    conf: 0.85
    platforms:
      - macos
    for:
      - macho
      - dylib
    if:
      type: symbol
      regex: ^kSCPropNetProxies(HTTP|HTTPS)
  - id: macos-networksetup-set-web-proxy
    desc: macOS networksetup web proxy configuration
    crit: notable
    conf: 0.9
    attack: T1090
    platforms:
      - macos
    for:
      - shell
      - python
      - ruby
      - applescript
    if:
      type: text
      regex: networksetup\s+-set(secure)?webproxy
  - id: dotnet-webbrowserproxy-class
    desc: .NET WebBrowserProxy helper class
    crit: component
    conf: 0.82
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: WebBrowserProxy
  - id: dotnet-set-connection-proxy
    desc: .NET sets system connection proxy
    crit: component
    conf: 0.86
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: SetConnectionProxy
  - id: dotnet-restore-system-proxy
    desc: .NET restores system proxy settings
    crit: component
    conf: 0.84
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: RestoreSystemProxy
  - id: dotnet-proxy-address-property
    desc: .NET proxy address property
    crit: component
    conf: 0.76
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: ProxyAddress
  - id: dotnet-proxied-tcpclient
    desc: .NET proxied TCP client helper
    crit: notable
    conf: 0.84
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      exact: ProxiedTcpClient
composite_rules:
  - id: ultraviolet-browser-proxy
    desc: Includes Ultraviolet browser proxy runtime
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    any:
      - id: ultraviolet-config-global
      - id: ultraviolet-service-worker-class
      - id: ultraviolet-codec-namespace
      - id: ultraviolet-runtime-script
  - id: service-worker-proxy-runtime
    desc: Includes a service-worker web proxy runtime
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    any:
      - id: ultraviolet-browser-proxy
      - id: scramjet-browser-proxy
  - id: scramjet-browser-proxy
    desc: Includes Scramjet browser proxy runtime
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    any:
      - id: scramjet-client-token
      - id: scramjet-client-name-token
      - id: scramjet-fetch-handler-token
  - id: dotnet-system-proxy-modification
    desc: .NET system proxy modification helpers
    crit: suspicious
    conf: 0.86
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: dotnet-webbrowserproxy-class
    any:
      - id: dotnet-set-connection-proxy
      - id: dotnet-restore-system-proxy
      - id: dotnet-proxy-address-property
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-windows
