defaults:
  platforms:
    - unix
    - windows
    - android
  for: [scripts, binaries]
traits:
  # Ultraviolet — the service-worker web proxy from the same ecosystem as
  # Scramjet below. It registers a service worker that intercepts every request
  # the tab makes, rewrites URLs through a `/service/<encoded>` prefix, and
  # relays them to an upstream ("bare") server, so the proxied site renders
  # under the proxy's own origin with all links and forms rewritten.
  #
  # Its intended use is circumventing network filters, which makes a bare
  # reference dual-use rather than malicious. It is also, unmodified, a working
  # adversary-in-the-middle harness: the same transparent rewriting relays a
  # real identity-provider login page and exposes the traffic to the operator.
  # Intent lives in objectives/credential-access/phishing/mfa-relay/ and
  # objectives/command-and-control/channel/proxy/.
  - id: golang-x-net-proxy-from-environment
    desc: Go x/net proxy from environment
    crit: notable
    conf: 0.93
    for: [go]
    if:
      type: text
      regex: 'proxy\.FromEnvironment(Using)?\s*\('
  - id: macos-networksetup-set-web-proxy
    desc: macOS networksetup web proxy configuration
    crit: notable
    conf: 0.9
    attack: T1090
    platforms:
      - macos
    for:
      - shell
      - python
      - ruby
      - applescript
    if:
      type: text
      regex: networksetup\s+-set(secure)?webproxy
composite_rules: []
