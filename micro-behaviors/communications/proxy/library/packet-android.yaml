defaults:
  for: [dex]
  platforms: [android]
  crit: notable

traits:
  - id: packet-sdk-reference
    desc: References Packet residential proxy SDK
    if:
      type: text
      exact: 'Lcom/packet/sdk/PacketSdk;'

  - id: fleet-sdk-reference
    desc: References Fleet residential proxy SDK
    if:
      type: text
      exact: 'Lcom/fleet/FleetSdk;'

composite_rules:
  - id: android-residential-proxy-sdk-reference
    desc: References an Android residential proxy SDK
    crit: notable
    any:
      - id: packet-sdk-reference
      - id: fleet-sdk-reference
