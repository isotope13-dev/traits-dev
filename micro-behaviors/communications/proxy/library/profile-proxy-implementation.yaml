---
defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - scripts
  - binaries
traits:
- id: proxy-func
  desc: ProxyFunc name reference
  crit: notable
  conf: 0.5
  if:
    type: text
    word: ProxyFunc
  unless:
  - type: text
    substr: envProxyFunc
  - type: text
    substr: httpproxy.(*Config).ProxyFunc
- id: dotnet-proxied-tcpclient
  desc: ".NET proxied TCP client helper"
  crit: notable
  conf: 0.84
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    exact: ProxiedTcpClient
