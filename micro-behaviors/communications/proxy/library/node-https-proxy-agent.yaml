defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93
traits:
  # new HttpsProxyAgent(...) routes outbound traffic through an operator
  # proxy. Legitimate apps use it for corporate egress; combined with
  # install hooks, obfuscation, or proxy rotation it becomes C2 transport.
  - id: https-proxy-agent-instantiation
    desc: Instantiates an HTTPS proxy agent
    if:
      type: text
      regex: 'new\s+HttpsProxyAgent\s*\('
