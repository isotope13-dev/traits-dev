defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  crit: notable
traits:
  - id: binding-request-header-pack
    desc: Packs a STUN Binding request header
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bpack\(\s*["\x27][!>]HHI["\x27]\s*,\s*1,\s*0,\s*(0x2112a442|554869826)\b'
