defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  crit: notable
traits:
  - id: binding-request-header-pack
    for: [python]
    desc: Packs a STUN Binding request header
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)\bpack\(\s*["\x27][!>]HHI(12s)?["\x27]\s*,\s*1,\s*0,\s*(0x2112a442|554869826)\b'
  - id: binding-request-byte-array
    desc: STUN Binding header byte-array initializer
    conf: 0.98
    if:
      type: text
      regex: '(?i)[{\[]\s*0x0+,\s*0x0?1,\s*(0x0+,\s*){2}0x21,\s*0x12,\s*0xa4,\s*0x42,'
