defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: js-zero-transaction-binding-request
    desc: Constructs zero-ID STUN Binding request
    if:
      type: text
      regex: 'Buffer\.from\(["'']000100002112a442000000000000000000000000["'']\s*,\s*["'']hex["'']\)'
  - id: js-transaction-id-target-fields
    desc: Reads target fields from STUN transaction-ID
    if:
      type: text
      regex: '\.readUInt32BE\(10\)[\s\S]{0,80}\.readUInt16BE\(14\)'
  - id: js-binding-response-header-check
    desc: Checks STUN Binding Success header
    if:
      type: text
      regex: '\.readUInt16BE\(0\)\s*!==\s*0x0101[\s\S]{0,80}\.readUInt32BE\(4\)\s*!==\s*0x2112a442'
  - id: js-transaction-id-opcode-switch
    desc: Dispatches on STUN transaction-ID first byte
    if:
      type: text
      regex: 'switch\s*\(\w+\.readUInt8\(8\)\)'
