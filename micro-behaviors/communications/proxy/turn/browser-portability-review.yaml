traits:
- id: webrtc-empty-ice-servers
  desc: WebRTC peer connection without ICE servers
  conf: 0.9
  if:
    type: text
    regex: iceServers\s*:\s*\[\s*\]
- id: local-ip-list-symbol
  desc: Local IP list symbol
  conf: 0.85
  if:
    type: symbol
    regex: (^|\.)(localIpList|ipAddressList)$
composite_rules:
- id: webrtc-local-ip-discovery
  desc: WebRTC local IP discovery
  conf: 0.94
  all:
  - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
  - id: micro-behaviors/communications/proxy/turn::webrtc-ice-candidate-handler
  - id: micro-behaviors/communications/proxy/turn::webrtc-ice-candidate-line-read
  any:
  - id: micro-behaviors/communications/proxy/turn::webrtc-empty-ice-servers
  - id: micro-behaviors/communications/proxy/turn::local-ip-list-symbol
  - id: micro-behaviors/communications/proxy/turn::webrtc-data-channel-api
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
  crit: notable
