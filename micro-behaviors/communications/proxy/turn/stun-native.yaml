defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.92
  attack: T1071

traits:
  # Hand-built STUN requests carry the RFC 5389 magic cookie as an immediate
  # or literal-pool word. Stripped static IoT binaries have no STUN library
  # strings, so the constant is the surviving evidence. Byte order differs by
  # compiler and architecture, hence both spellings.
  - id: native-stun-magic-cookie
    desc: STUN magic cookie constant in code
    if:
      type: hex
      section: .text
      pattern: '(21 12 A4 42 | 42 A4 12 21)'

  - id: mips-be-stun-magic-cookie
    desc: MIPS STUN magic cookie built from halves
    arch: [mips]
    if:
      type: hex
      section: .text
      pattern: '3C ?? 21 12 34 ?? A4 42'

  # 32-bit ARM compilers assemble htonl(0x2112a442) = 0x42a41221 across three
  # rotated-immediate instructions (`mov rX, #0x1200`, `add rX, rX, #0x40000021`,
  # `add rX, rX, #0x02a40000`).
  - id: arm-stun-magic-cookie
    desc: ARM STUN magic cookie built from immediates
    arch: [arm]
    if:
      type: hex
      section: .text
      pattern: '12 ?C A0 E3 [0-24] 85 ?1 8? E2 [0-24] A9 ?7 8? E2'

  # ARCompact stores 32-bit long immediates high-halfword first (each half
  # little-endian), encoding network-order 0x42a41221 as A4 42 21 12.
  - id: arc-stun-magic-cookie-bytes
    desc: ARC-ordered STUN magic cookie bytes
    crit: baseline
    if:
      type: hex
      section: .text
      pattern: 'A4 42 21 12'

  # One sockaddr is filled per server, so a dozen immediates of port 3478
  # (0x0D96) mean a fixed list of STUN servers compiled into the code.
  - id: x86-stun-port-immediates
    desc: Repeated STUN port immediates in x86 code
    arch: [x86, x86-64]
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: '(66 C7 ?? 08 96 0D | B? 96 0D 00 00)'

  - id: mips-be-stun-port-immediates
    desc: Repeated STUN port immediates in MIPS code
    arch: [mips]
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: '24 ?? 0D 96'

  # ARC loads the port as a long immediate (`mov_s r2, 0xd96`, bytes
  # `CF 72 00 00 96 0D`), stored high half first. One per server again.
  - id: arc-stun-port-immediates
    desc: Repeated STUN port immediates in ARC code
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: 'CF 72 00 00 96 0D'

  # m68k (big-endian) fills each server's port with `move.w #0xd96, d16(An)`,
  # bytes `3? 7C 0D 96` (e.g. `31 7C` for a0, `3B 7C` for a5). One per server.
  - id: m68k-stun-port-immediates
    desc: Repeated STUN port immediates in m68k code
    arch: [m68k]
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: '3? 7C 0D 96'

  # 32-bit ARM builds port 0x0d96 (3478) as `mov rX, #0xd90; add rX, rX, #6`.
  - id: arm-stun-port-immediates
    desc: Repeated STUN port immediates in ARM code
    arch: [arm]
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: 'D9 ?E A0 E3 [0-16] 06 ?0 8? E2'

composite_rules:
  - id: arc-stun-magic-cookie
    desc: ARC STUN magic cookie constant in code
    crit: notable
    conf: 0.92
    all:
      - id: metadata/arch/iot::arc-compact
      - id: arc-stun-magic-cookie-bytes

  - id: native-stun-cookie-code
    desc: Native code builds STUN messages
    crit: notable
    conf: 0.92
    any:
      - id: native-stun-magic-cookie
      - id: mips-be-stun-magic-cookie
      - id: arm-stun-magic-cookie
      - id: arc-stun-magic-cookie

  - id: native-stun-server-fanout
    desc: Native code targets many STUN servers
    crit: notable
    conf: 0.92
    any:
      - id: x86-stun-port-immediates
      - id: mips-be-stun-port-immediates
      - id: arc-stun-port-immediates
      - id: m68k-stun-port-immediates
      - id: arm-stun-port-immediates
