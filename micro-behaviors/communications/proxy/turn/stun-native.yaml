defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.92
  attack: T1071

traits:
  # Hand-built STUN requests carry the RFC 5389 magic cookie as an immediate
  # or literal-pool word. Stripped static IoT binaries have no STUN library
  # strings, so the constant is the surviving evidence. Byte order differs by
  # compiler and architecture, hence both spellings.
  - id: native-stun-magic-cookie
    desc: STUN magic cookie constant in code
    if:
      type: hex
      section: .text
      pattern: '(21 12 A4 42 | 42 A4 12 21)'

  - id: mips-be-stun-magic-cookie
    desc: MIPS STUN magic cookie built from halves
    arch: [mips]
    if:
      type: hex
      section: .text
      pattern: '3C ?? 21 12 34 ?? A4 42'

  # One sockaddr is filled per server, so a dozen immediates of port 3478
  # (0x0D96) mean a fixed list of STUN servers compiled into the code.
  - id: x86-stun-port-immediates
    desc: Repeated STUN port immediates in x86 code
    arch: [x86, x86-64]
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: '(66 C7 ?? 08 96 0D | B? 96 0D 00 00)'

  - id: mips-be-stun-port-immediates
    desc: Repeated STUN port immediates in MIPS code
    arch: [mips]
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: '24 ?? 0D 96'

  # ARC loads the port as a long immediate (`mov_s r2, 0xd96`, bytes
  # `CF 72 00 00 96 0D`), stored high half first. One per server again.
  - id: arc-stun-port-immediates
    desc: Repeated STUN port immediates in ARC code
    count_min: 12
    if:
      type: hex
      section: .text
      pattern: 'CF 72 00 00 96 0D'

composite_rules:
  - id: native-stun-cookie-code
    desc: Native code builds STUN messages
    crit: notable
    conf: 0.92
    any:
      - id: native-stun-magic-cookie
      - id: mips-be-stun-magic-cookie

  - id: native-stun-server-fanout
    desc: Native code targets many STUN servers
    crit: notable
    conf: 0.92
    any:
      - id: x86-stun-port-immediates
      - id: mips-be-stun-port-immediates
      - id: arc-stun-port-immediates
