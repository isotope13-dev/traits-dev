defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: zero-id-binding-bytes-constructor
    desc: Packs zero-ID STUN request using bytes
    if:
      type: tree-sitter
      kind: call
      regex: 'pack\(["''][!>]HHI12s["'']\s*,\s*1\s*,\s*0\s*,\s*0x2112[aA]442\s*,\s*bytes\(12\)\)'
  - id: zero-id-binding-repeated-byte
    desc: Packs zero-ID STUN request using repetition
    if:
      type: tree-sitter
      kind: call
      regex: 'pack\(["''][!>]HHI12s["''],\s*1,\s*0,\s*0x2112[aA]442,\s*b["'']\\x00["'']\s*\*\s*12\)'
  - id: binding-response-header-check
    desc: Checks STUN Binding Success header
    if:
      type: tree-sitter
      kind: conditional
      regex: '^if\s+\w+\s*!=\s*0x0*101\s+or\s+\w+\s*!=\s*0x2112[aA]442\s*:'

composite_rules:
  - id: zero-transaction-binding-request
    desc: Packs zero-ID STUN Binding request
    any:
      - id: zero-id-binding-bytes-constructor
      - id: zero-id-binding-repeated-byte
