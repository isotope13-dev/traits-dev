defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
- id: webrtc-local-ip-with-page-and-send-apis
  desc: WebRTC IP discovery with URL and send APIs
  crit: notable
  conf: 0.9
  # Whole-file co-occurrence does not bind the IPs or page URL to a request.
  scope: file
  all:
  - id: micro-behaviors/communications/proxy/turn::webrtc-local-ip-discovery
  - id: micro-behaviors/communications/url/navigation-http::browser-page-url-href-rhs-read
  any:
  - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  unless:
  - id: metadata/file/catalog/service::service-name-twilio
