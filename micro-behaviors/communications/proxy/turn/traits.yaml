# WebRTC is a normal browser communications API.  These atoms describe the
# channel mechanics without assigning malicious intent; browser-carried C2 is
# inferred only when they join with CDP control and host command execution.
defaults:
  platforms: [windows, unix]
  for: [binaries, csharp, go, rust, javascript, typescript, python, powershell]
  attack: T1071.001

traits:
  - id: webrtc-peer-connection-api
    desc: WebRTC peer connection API
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(RTCPeerConnection|PeerConnection::new)\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
      - id: well-known/lib/development/typescript-compiler::compiler-diagnostics-bundle
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb

  - id: webrtc-data-channel-api
    desc: WebRTC data channel API
    crit: notable
    conf: 0.92
    if:
      type: text
      # `data-channel` is also a common DOM/CSS property name.  Restrict this
      # atom to the WebRTC API symbols so UI components do not look like a
      # browser relay implementation.
      regex: '(?i)\b(createDataChannel|RTCDataChannel)\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
      - id: well-known/lib/development/typescript-compiler::compiler-diagnostics-bundle
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb

  - id: webrtc-sdp-signaling-api
    desc: WebRTC SDP offer-answer signaling
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(createOffer|createAnswer|setLocalDescription|setRemoteDescription)\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
      - id: well-known/lib/development/typescript-compiler::compiler-diagnostics-bundle

  # The URI half needs a host, not just the scheme token. `turn:` followed by
  # "anything non-space" is the Rust/C++ path separator (`core::turn::run`, a
  # module named turn) and every format string an agent writes about a
  # conversation turn (`"pre-turn:{turn_seq}"`, `format!("turn:{i}")`) — an LLM
  # coding TUI reported WebRTC relay configuration eight times over the English
  # noun. A real turn:/stun: URI (RFC 7065) has an alphanumeric host followed by
  # a dot or a :port, which none of those spellings can produce.
  - id: webrtc-stun-turn-relay-config
    desc: WebRTC STUN or TURN relay configuration
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(stun|turns?):[a-z0-9][\w.-]{1,40}[.:]\w|\bRTCIceServer|\biceServers\b'
    unless:
      - id: well-known/app/ai/aui-agent-builder/
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
      - id: well-known/lib/development/typescript-compiler::compiler-diagnostics-bundle

  - id: go-stun-message-decode
    desc: Decodes a Go STUN message
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: symbol
      kind: call
      exact: stun.Decode

  - id: go-stun-xor-mapped-address
    desc: Extracts a STUN XOR-mapped address
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: symbol
      kind: call
      exact: xorMapped.GetFrom

  - id: go-stun-mapped-address
    desc: Extracts a STUN mapped address
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: symbol
      kind: call
      exact: mapped.GetFrom

  - id: go-stun-binding-request
    desc: Builds a Go STUN Binding request
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: text
      regex: 'stun\.Build\(\s*stun\.TransactionID\s*,\s*stun\.BindingRequest\s*\)'

  - id: go-udp-punch-hello-packet
    desc: Builds a UDP hole-punch hello packet
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: 'EncodePunchPacket\(\s*PunchPacketHello\b'

  - id: go-udp-punch-ack-packet
    desc: Builds a UDP hole-punch acknowledgement packet
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: 'EncodePunchPacket\(\s*PunchPacketAck\b'

composite_rules:
  - id: go-stun-mapped-endpoint-parse
    desc: Parses a Go STUN response for a mapped endpoint
    crit: notable
    conf: 0.96
    for: [go]
    all:
      - id: go-stun-message-decode
    any:
      - id: go-stun-xor-mapped-address
      - id: go-stun-mapped-address

  - id: go-udp-hole-punching-handshake
    desc: Performs a UDP hole-punch hello/ack handshake
    crit: notable
    conf: 0.97
    for: [go]
    all:
      - id: go-udp-punch-hello-packet
      - id: go-udp-punch-ack-packet
      - id: micro-behaviors/communications/socket/send::go-packet-connection-write-to
      - id: micro-behaviors/communications/socket/receive::go-packet-connection-read-from
