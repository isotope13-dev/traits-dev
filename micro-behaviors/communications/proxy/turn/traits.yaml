# WebRTC is a normal browser communications API.  These atoms describe the
# channel mechanics without assigning malicious intent; browser-carried C2 is
# inferred only when they join with CDP control and host command execution.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [binaries, csharp, go, rust, javascript, typescript, python, powershell]
  attack: T1071.001

traits:
  - id: webrtc-peer-connection-api
    desc: WebRTC peer connection name reference
    conf: 0.9
    for: [binaries, csharp, go, rust, javascript, typescript, html, python, powershell]
    if:
      type: text
      # Vendor-prefixed constructors (mozRTCPeerConnection,
      # webkitRTCPeerConnection) are the same API; `\b` alone does not split
      # them from their prefix.
      regex: '(?i)\b((moz|webkit)?RTCPeerConnection|PeerConnection::new)\b'

  - id: webrtc-data-channel-api
    desc: WebRTC data channel name reference
    conf: 0.92
    if:
      type: text
      # `data-channel` is also a common DOM/CSS property name.  Restrict this
      # atom to the WebRTC API symbols so UI components do not look like a
      # browser relay implementation.
      regex: '(?i)\b(createDataChannel|RTCDataChannel|ondatachannel)\b'

  - id: webrtc-inline-sdp-datachannel
    desc: Hardcoded SDP WebRTC DataChannel media line
    conf: 0.96
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'm=application\s+\d+\s+UDP/DTLS/SCTP\s+webrtc-datachannel'

  - id: webrtc-inline-sdp-host-candidate
    desc: Hardcoded SDP host ICE candidate line
    conf: 0.94
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'a=candidate:[^\r\n\\]{4,60}\s+typ\s+host\b'

  - id: webrtc-sdp-signaling-api
    desc: Offer, answer or session-description name
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(createOffer|createAnswer|setLocalDescription|setRemoteDescription)\b'

  # ICE candidate plumbing, relocated from objectives/discovery/system/
  # fingerprint/network. Every WebRTC call client (Element Call, Jitsi) sets
  # the handler and reads the candidate line to trickle it to its peer; the
  # local-IP discovery composite there combines them with the leak shape.
  - id: webrtc-ice-candidate-handler
    desc: WebRTC ICE candidate event handler
    for: [javascript, typescript]
    if:
      type: text
      substr: onicecandidate

  - id: webrtc-ice-candidate-line-read
    desc: Reads an ICE candidate's SDP line
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      regex: '\.candidate\.candidate$'

  # The URI half needs a host, not just the scheme token. `turn:` followed by
  # "anything non-space" is the Rust/C++ path separator (`core::turn::run`, a
  # module named turn) and every format string an agent writes about a
  # conversation turn (`"pre-turn:{turn_seq}"`, `format!("turn:{i}")`) — an LLM
  # coding TUI reported WebRTC relay configuration eight times over the English
  # noun. A real turn:/stun: URI (RFC 7065) has a domain-shaped host (letter
  # led, dotted) or a host with a :port, which none of those spellings can
  # produce — including a Python format spec like `row.turns:10.4f` (NEC
  # spiral output, "TURNS=10.4"), whose digit-led, portless host fails both.
  # IPv4 hosts without a port are the accepted gap.
  - id: webrtc-stun-turn-relay-config
    desc: WebRTC relay configuration reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(stun|turns?):([a-z][\w.-]{2,50}|[\w.]{1,50}:\d{2,5})|\bRTCIceServer|\biceServers\b'

  # A configured relay-only policy, not a reference to the option. Call SDKs
  # (Twilio Video, lib-jitsi-meet) copy or switch on `iceTransportPolicy`
  # from caller options; only a literal `relay` value forces every packet
  # through TURN, which hides the peer address and rides the relay's
  # reputation (turn.cloudflare.com) past page network allowlists.
  - id: webrtc-relay-only-ice-policy
    desc: Forces WebRTC traffic through TURN relays
    conf: 0.95
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\biceTransportPolicy["'']?\s*:\s*["''`]relay["''`]'

  # The window binds the handler to a channel the same code opened or
  # accepted. Bare `.onmessage` is every worker, socket, and iframe.
  - id: webrtc-data-channel-receive
    desc: Handles messages on a WebRTC data channel
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(createDataChannel|ondatachannel)[\s\S]{0,900}(\.onmessage\s*=|Listener\(\s*["'']message)'

  - id: js-send-method-call
    desc: Calls a send method
    crit: component
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '\.send$'

  - id: go-stun-message-decode
    desc: Decodes a Go STUN message
    conf: 0.94
    for: [go]
    if:
      type: symbol
      kind: call
      exact: stun.Decode

  - id: go-stun-xor-mapped-address
    desc: Extracts a STUN XOR-mapped address
    conf: 0.94
    for: [go]
    if:
      type: symbol
      kind: call
      exact: xorMapped.GetFrom

  - id: go-stun-mapped-address
    desc: Extracts a STUN mapped address
    conf: 0.94
    for: [go]
    if:
      type: symbol
      kind: call
      exact: mapped.GetFrom

  - id: go-stun-binding-request
    desc: Builds a Go STUN Binding request
    conf: 0.96
    for: [go]
    if:
      type: text
      regex: 'stun\.Build\(\s*stun\.TransactionID\s*,\s*stun\.BindingRequest\s*\)'

  - id: go-udp-punch-hello-packet
    desc: Builds a UDP hole-punch hello packet
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: 'EncodePunchPacket\(\s*PunchPacketHello\b'

  - id: go-udp-punch-ack-packet
    desc: Builds a UDP hole-punch acknowledgement packet
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: 'EncodePunchPacket\(\s*PunchPacketAck\b'

composite_rules:
  # The channel object is usually a minified local, so bind by proximity:
  # a send call in the code that opened or accepted the data channel.
  - id: webrtc-data-channel-send
    desc: Sends data on a WebRTC data channel
    for: [javascript, typescript]
    near_bytes: 4000
    all:
      - id: webrtc-data-channel-api
      - id: js-send-method-call

  - id: go-stun-mapped-endpoint-parse
    desc: Parses a Go STUN response for a mapped endpoint
    conf: 0.96
    for: [go]
    all:
      - id: go-stun-message-decode
    any:
      - id: go-stun-xor-mapped-address
      - id: go-stun-mapped-address

  - id: go-udp-hole-punching-handshake
    desc: Performs a UDP hole-punch hello/ack handshake
    conf: 0.97
    for: [go]
    all:
      - id: go-udp-punch-hello-packet
      - id: go-udp-punch-ack-packet
      - id: micro-behaviors/communications/socket/send/datagram::go-packet-connection-write-to
      - id: micro-behaviors/communications/socket/receive::go-packet-connection-read-from
