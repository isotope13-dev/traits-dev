defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: grpc-go-set-header
    desc: Sets gRPC response header metadata
    if:
      type: symbol
      kind: call
      exact: grpc.SetHeader

  - id: grpc-go-send-header
    desc: Sends gRPC response header metadata
    if:
      type: symbol
      kind: call
      exact: grpc.SendHeader

  - id: grpc-go-set-trailer
    desc: Sets gRPC response trailer metadata
    if:
      type: symbol
      kind: call
      exact: grpc.SetTrailer

  - id: grpc-go-outgoing-metadata
    desc: Attaches gRPC metadata to an outgoing context
    if:
      type: symbol
      kind: call
      exact: metadata.NewOutgoingContext
