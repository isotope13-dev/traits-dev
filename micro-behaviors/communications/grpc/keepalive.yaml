defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: grpc-go-server-keepalive
    desc: Configures gRPC server keepalive parameters
    if:
      type: symbol
      kind: call
      exact: grpc.KeepaliveParams

  - id: grpc-go-client-keepalive
    desc: Configures gRPC client keepalive parameters
    if:
      type: symbol
      kind: call
      exact: grpc.WithKeepaliveParams

  - id: grpc-go-keepalive-enforcement
    desc: Configures gRPC keepalive enforcement policy
    if:
      type: symbol
      kind: call
      exact: grpc.KeepaliveEnforcementPolicy
