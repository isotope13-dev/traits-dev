# Cross-language gRPC URL-scheme references. `grpc://` (and its TLS variant)
# is the protocol's own endpoint scheme -- Arrow Flight, Envoy xDS, and every
# RPC client and server use it -- so a literal is a neutral capability signal,
# not tunnel tooling.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: url-scheme-reference
    desc: "grpc:// URL scheme literal"
    if:
      type: literal
      substr: grpc://

  - id: tls-scheme-reference
    desc: "grpcs:// URL scheme literal"
    if:
      type: literal
      substr: grpcs://
