defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: grpc-go-default-service-config
    desc: Configures default gRPC client service settings
    if:
      type: symbol
      kind: call
      exact: grpc.WithDefaultServiceConfig

  - id: grpc-go-server-graceful-stop
    desc: Gracefully stops a constructed gRPC server
    # Require the receiver to originate at the server constructor. A method
    # name on an unrelated service, or a quoted call, is insufficient.
    if:
      type: symbol
      kind: call
      regex: '\.GracefulStop$'
      receiver:
        from:
          call: '^google\.golang\.org/grpc\.NewServer$'
