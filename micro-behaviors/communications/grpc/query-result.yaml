defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: query-result-upload-method
    desc: References SendQueryResult gRPC method path
    if:
      type: literal
      regex: '^/[\w.]+/SendQueryResult$'
      exclude_docstrings: true

  - id: query-id-metadata-key
    desc: Query identifier metadata key literal
    crit: component
    if:
      type: literal
      exact: query-id
      exclude_docstrings: true
