# Private IPv4 endpoint literals are neutral address evidence. Objective rules
# add the socket and command-channel context that supports an intent verdict.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

traits:
  - id: rfc1918-host-string--rx-1
    desc: RFC1918 private IPv4 address prefix
    crit: component
    conf: 0.75
    if:
      type: text
      regex: '\b(10\.(\d{1,3}\.){2}\d{1,3}|192\.168\.(\d{1,3}\.)\d{1,3})\b'
      is: valid_ip
  - id: rfc1918-host-string--rx-2
    desc: RFC1918 172.16 through 172.31 address prefix
    crit: component
    conf: 0.75
    if:
      type: text
      regex: '(172\.(1[6-9]|2[0-9]|3[0-1])\.)'

composite_rules:
  - id: rfc1918-host-string
    desc: RFC1918 private IPv4 address
    crit: component
    conf: 0.75
    any:
      - id: rfc1918-host-string--rx-1
      - id: rfc1918-host-string--rx-2
