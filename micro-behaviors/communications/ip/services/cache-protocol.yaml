defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.85
traits:
  - id: redis-resp-ping-frame
    desc: Redis RESP-framed PING command
    conf: 0.9
    if:
      type: text
      substr: "*1\r\n$4\r\nPING\r\n"
  - id: redis-require-call
    desc: require('redis') call
    if:
      type: text
      regex: 'require\(["'']redis["'']\)'
  - id: redis-new-constructor
    desc: new Redis() constructor
    if:
      type: text
      regex: '\bnew\s+Redis\b'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
      - id: well-known/tool/detection/scarno::scarno-defensive-scanner-context
  - id: redis-createclient-6379
    desc: Redis default port 6379 in createClient
    if:
      type: text
      regex: 'createClient\s*\(\s*\{[^}]{0,200}6379'
  # Require an imported client. Product-name catalogs and cloud-service icon
  # names are not evidence that the program communicates with Memcached.
  - id: memcached-client-import
    desc: Imports a Memcached client module
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: import
      regex: '^(memcache|memcached)([./]|$)'
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: pymemcache-module
    desc: pymemcache client module name
    conf: 0.8
    if:
      type: text
      word: pymemcache
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source

  # Net-SNMP's public session/PDU symbols identify an SNMP protocol client;
  # unlike a generic socket import, these are useful capability evidence for
  # future network-tool and implant triage.
  - id: snmp-session-open
    desc: Opens an SNMP client session
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [elf, macho]
    if:
      type: symbol
      exact: snmp_open
  - id: snmp-request-send
    desc: Sends an SNMP request
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [elf, macho]
    if:
      type: symbol
      exact: snmp_send
  - id: snmp-synchronous-response
    desc: Waits for an SNMP response
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [elf, macho]
    if:
      type: symbol
      exact: snmp_synch_response
  - id: snmp-pdu-create
    desc: Creates an SNMP protocol data unit
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [elf, macho]
    if:
      type: symbol
      exact: snmp_pdu_create
composite_rules:
  - id: redis-ping-protocol
    desc: Redis client/protocol marker
    any:
      - id: redis-resp-ping-frame
      - id: redis-require-call
      - id: redis-new-constructor
      - id: redis-createclient-6379
