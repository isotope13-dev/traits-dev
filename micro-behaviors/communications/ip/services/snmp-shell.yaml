defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
traits:
  - id: snmp-set-command
    desc: Writes SNMP managed objects
    if:
      type: symbol
      kind: call
      exact: snmpset
  - id: snmp-default-community-option
    desc: Supplies a default SNMP community
    if:
      type: text
      regex: '(^|\s)-c\s+["'']?(public|private)["'']?(\s|$)'
      exclude_comments: true
  - id: snmp-copy-tftp
    desc: Selects TFTP for Cisco config copy
    if:
      type: text
      regex: '\b1\.3\.6\.1\.4\.1\.9\.9\.96\.1\.1\.1\.1\.2\.\d{1,10}\s+i\s+1\b'
      exclude_comments: true
  - id: snmp-copy-running-config
    desc: Selects running configuration as source
    if:
      type: text
      regex: '\b1\.3\.6\.1\.4\.1\.9\.9\.96\.1\.1\.1\.1\.3\.\d{1,10}\s+i\s+4\b'
      exclude_comments: true
  - id: snmp-copy-network-destination
    desc: Selects remote configuration copy target
    if:
      type: text
      regex: '\b1\.3\.6\.1\.4\.1\.9\.9\.96\.1\.1\.1\.1\.4\.\d{1,10}\s+i\s+1\b'
      exclude_comments: true
  - id: snmp-copy-create-and-go
    desc: Activates Cisco configuration copy row
    if:
      type: text
      regex: '\b1\.3\.6\.1\.4\.1\.9\.9\.96\.1\.1\.1\.1\.14\.\d{1,10}\s+i\s+4\b'
      exclude_comments: true
composite_rules:
  - id: snmp-default-community-write
    desc: Writes SNMP objects with a default community
    crit: suspicious
    near_lines: 2
    all:
      - id: snmp-set-command
      - id: snmp-default-community-option
