defaults:
  platforms:
    - unix
    - windows
  for:
    - elf
    - c
traits:
  - id: native-ip-protocol-constants
    desc: Multiple native IP protocol constants
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '\bIPPROTO_(ICMP|UDP|TCP)\b'

  - id: ipproto-icmp
    desc: IPPROTO_ICMP protocol constant
    crit: baseline
    conf: 0.3
    if:
      type: text
      substr: IPPROTO_ICMP
  - id: services-icmp
    desc: ICMP service/protocol reference
    crit: baseline
    conf: 0.3
    if:
      type: text
      word: icmp
      case_insensitive: true
