defaults:
  platforms:
    - unix
    - windows
  for:
    - elf
    - c
traits:
  - id: ipproto-tcp
    desc: IPPROTO_TCP protocol constant
    crit: baseline
    conf: 0.3
    for: [c, cpp]
    if:
      type: text
      word: IPPROTO_TCP

  - id: ipproto-udp
    desc: IPPROTO_UDP protocol constant
    crit: baseline
    conf: 0.3
    for: [c, cpp]
    if:
      type: text
      word: IPPROTO_UDP

  - id: ipproto-icmp
    desc: IPPROTO_ICMP protocol constant
    crit: baseline
    conf: 0.3
    for: [elf, c, cpp]
    if:
      type: text
      word: IPPROTO_ICMP
  - id: services-icmp
    desc: ICMP packet or protocol vocabulary
    crit: notable
    conf: 0.8
    if:
      type: text
      # LLVM's integer comparison mnemonic is also spelled "icmp".
      regex: '\bICMP(v[46])?[ _-](packet|protocol|echo|header)\b'
      case_insensitive: true

composite_rules:
  - id: native-ip-protocol-constants
    desc: References multiple native IP protocol constants
    crit: notable
    conf: 0.9
    for: [c, cpp]
    any:
      - id: ipproto-tcp
      - id: ipproto-udp
      - id: ipproto-icmp
    needs: 2
