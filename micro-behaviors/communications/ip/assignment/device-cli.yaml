# Assigning a network device's interface address through its own vendor CLI.
#
# The sibling `set-ip-address-call` atom covers wrapper functions; these cover
# the literal configuration lines a script pushes over SSH or console. Only the
# unroutable values are matched — loopback and the unspecified address — because
# an interface parked there is unreachable, which is the point when an intruder
# wants a device to survive a reboot but not answer its operators. Socket binds
# to 0.0.0.0 are excluded by requiring the vendor's interface-configuration
# keyword, not a bare address.
defaults:
  platforms: [unix, windows, appliance]
  for: [python, javascript, typescript, ruby, shell, powershell, go, perl]
  crit: notable
  conf: 0.93

traits:
  - id: cli-interface-address-blackhole
    desc: Cisco/FortiOS interface address blackholed
    if:
      type: text
      regex: '(?im)^\s*(ip address|set ip)\s+(127\.0\.0\.1|0\.0\.0\.0)\b'

  - id: uci-routeros-address-blackhole
    desc: UCI/RouterOS interface address blackholed
    if:
      type: text
      regex: '(?i)(network\.\w+\.ipaddr|/ip address set[^\n]{0,60}address)=(127\.0\.0\.1|0\.0\.0\.0)'

  - id: junos-inet-address-blackhole
    desc: Junos inet address blackholed
    if:
      type: text
      regex: '(?i)family inet address\s+(127\.0\.0\.1|0\.0\.0\.0)/'

composite_rules:
  - id: device-management-address-blackholed
    desc: Moves a network device management interface to an unroutable address
    crit: suspicious
    conf: 0.94
    any:
      - id: cli-interface-address-blackhole
      - id: uci-routeros-address-blackhole
      - id: junos-inet-address-blackhole
