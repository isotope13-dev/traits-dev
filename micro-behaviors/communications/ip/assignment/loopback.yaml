# Assigning an IP address to a device is a distinct network-setting operation.
# It is neutral as a capability; the cleanup composite adds the loopback and
# APN-pivot context.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, shell, powershell, go, c, rust]
  crit: notable
  conf: 0.94

traits:
  - id: set-ip-address-call
    desc: Calls a device IP-address setter
    if:
      type: symbol
      kind: call
      # `address` is required: a bare `setIP`/`set_ip` is overwhelmingly the
      # unwinder/JIT/debugger "set instruction pointer" accessor (libunwind's
      # Registers::setIP, DWARF step code), not a network-interface setter.
      regex: '(?i)(^|\.)(set|change|update|assign)[_-]?ip[_-]?address$'

  - id: loopback-address-call-argument
    desc: Call contains a loopback address argument
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '127\.0\.0\.1'

  - id: javascript-loopback-address-literal
    desc: JavaScript call argument contains loopback
    crit: component
    conf: 0.95
    for: [javascript]
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)\b[A-Za-z_$][A-Za-z0-9_$]*\([^)]{0,200}127\.0\.0\.1'

composite_rules:
  - id: ip-set-to-loopback
    desc: Sets a device IP to loopback
    crit: notable
    conf: 0.96
    all:
      - id: set-ip-address-call
    any:
      - id: loopback-address-call-argument
      - id: javascript-loopback-address-literal
    near_lines: 4
