# Python configuration often assigns bind addresses and service endpoints.
# The assignment itself is a network capability, not evidence of C2 intent;
# objective rules add the request/transport context when it is warranted.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-ipv4-string-assignment
    desc: Assigns an IPv4 address string in Python
    if:
      type: tree-sitter
      kind: assignment
      # A network-shaped variable name distinguishes addresses from four-part
      # software versions such as pycurl_version = "7.43.0.2".
      regex: "\\b\\w*(ip|addr|host|bind|listen|server)\\w*\\s*=\\s*[\\\"'](\\d{1,3}\\.){3}\\d{1,3}[\\\"']"
      case_insensitive: true
    unless:
      - id: metadata/library/data::pulumi-python-provider-generated
