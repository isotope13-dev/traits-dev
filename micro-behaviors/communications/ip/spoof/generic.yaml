defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  attack: T1071
  mbc: C0001
traits:
- id: spoof-keyword
  desc: IP spoofing keyword in network context
  crit: baseline
  conf: 0.65
  if:
    type: text
    regex: '(?i)\bIP[ _-]{0,12}spoof\b|\bspoof[ _-]{0,12}IP\b'
- id: forge-keyword
  desc: Packet or header forging keyword
  crit: baseline
  conf: 0.6
  # Bare `forge` matched any identifier/name containing it (avatar-forge,
  # node-forge, sourceforge, salesforce) — meaningless for IP spoofing. Anchor
  # to forging a network object so the word only corroborates the
  # bitwise-IP-construction composite when a packet/header is actually forged.
  if:
    type: text
    regex: '(?i)forge[a-z_]{0,4}(packet|header|datagram)'


- id: syncookie-word
  desc: "TCP SYN-cookie reference"
  crit: baseline
  conf: 0.5
  if:
    type: text
    substr: syncookie
- id: syn-cookie
  desc: SYN cookie or syn cookie (case variants)
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: (SYN|syn).?cookie
- id: bitwise-ip-shift-mask
  desc: Bit shift and 0xFF mask pattern
  crit: component
  conf: 0.8
  for: [binaries, scripts, c, cpp]
  if:
    type: text
    regex: '>>\s*[0-9]{1,2}\s*&\s*0xFF'
- id: ruby-rex-socket-library-path
  desc: Ruby Rex socket library path
  crit: component
  conf: 0.95
  for: [ruby]
  if:
    type: path
    regex: 'socket[\\/]comm'
- id: ruby-rex-socket-library-text
  desc: Ruby Rex socket library text
  crit: component
  conf: 0.95
  for: [ruby]
  if:
    type: text
    regex: 'Rex::Socket|require [''"]rex/socket'
composite_rules:
- id: ruby-rex-socket-library-context
  desc: Ruby Rex socket abstraction library context
  crit: component
  conf: 0.95
  all:
  - id: ruby-rex-socket-library-path
  - id: ruby-rex-socket-library-text
- id: spoof
  desc: IP address spoofing capabilities
  crit: suspicious
  conf: 0.7
  any:
  - id: micro-behaviors/communications/socket/options::ip-hdrincl-constant
  - id: micro-behaviors/communications/socket/raw::ipproto-raw-constant
  - id: bitwise-ip-construction
  unless:
  # A .NET apphost stub embeds the base-class-library socket enums, so a lone
  # IPPROTO_RAW/IP_HDRINCL string is constant-table data from the embedded
  # runtime, not a raw-socket configuration. Self-contained .NET publishes
  # (e.g. GitVersion's GitVersion.exe) trip the constant leg on every build.
  - id: metadata/binary/framework::dotnet-runtime-host-stub
  # A Wine builtin DLL is a reimplementation of the Windows system DLL whose
  # name it carries, so it contains the API surface by definition -- the
  # behaviour being described here is the one Windows itself provides.
  - id: well-known/lib/platform/wine::wine-builtin-dll-marker
  # A lone IP_HDRINCL/IPPROTO_RAW string inside a file that also carries the
  # whole socket option namespace is a constant table entry, not a raw-socket
  # configuration.
  - id: micro-behaviors/communications/socket/options::socket-constant-name-table
  - id: well-known/lib/runtime/cpython::cpython-interpreter-binary
  - id: well-known/lib/runtime/guile::libguile-shared-library
  - id: metadata/lang/source/
  - id: metadata/file/magic/identity::php-archive
  - id: well-known/lib/development/phpstan::phpstan-phar-basename
- id: bitwise-ip-construction
  desc: IP address construction using bitwise operations
  crit: suspicious
  conf: 0.8
  all:
  - id: micro-behaviors/os/random/prng/stdlib::c-rand-family-call
  - id: bitwise-ip-shift-mask
  any:
  - id: spoof-keyword
  - id: forge-keyword
  - id: micro-behaviors/communications/socket/options::ip-hdrincl-constant
  - id: micro-behaviors/communications/socket/raw::ipproto-raw-constant
  - id: micro-behaviors/communications/socket/raw::sock-raw-constant
  near_lines: 20
  unless:
  - id: well-known/app/security/bitwarden::bitwarden-browser-extension
  - id: metadata/file/format/structured::sourcemap-context
  - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
- id: syncookie
  desc: SYN cookie manipulation
  crit: notable
  conf: 0.66
  any:
  - id: syncookie-word
  - id: syn-cookie
- id: ip-spoof-raw-socket
  desc: IP spoofing via raw socket with IP_HDRINCL
  crit: suspicious
  conf: 0.9
  attack: T1090
  all:
  - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
  - id: micro-behaviors/communications/socket/options::ip-hdrincl-option
