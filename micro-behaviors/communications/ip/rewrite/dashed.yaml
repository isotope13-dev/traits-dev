defaults:
  crit: notable
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: ipv6-correctform-dash-render
  desc: IPv6 correctForm dash rendering
  if:
    type: text
    regex: correctForm\(\)\.replace\(/:/g,\s*'-'\)
- id: dashed-ip-regex
  desc: IP address dot replacement with dash
  size_max: 50000
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @obj
          property: (property_identifier) @prop
        )
        arguments: (arguments
          (regex (regex_pattern) @pat)
          (string (string_fragment) @repl)
        )
        (#match? @obj "(?i)(ip|addr|address|host|octet)")
        (#eq? @prop "replace")
        (#match? @pat "\\.")
        (#not-match? @pat ":")
        (#eq? @repl "-")
      )
- id: dashed-ip-colon-regex
  desc: IP address colon replacement with dash
  size_max: 50000
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @obj
          property: (property_identifier) @prop
        )
        arguments: (arguments
          (regex (regex_pattern) @pat)
          (string (string_fragment) @repl)
        )
        (#match? @obj "(?i)(ip|addr|address|host|octet)")
        (#eq? @prop "replace")
        (#match? @pat ":")
        (#not-match? @pat "\\.")
        (#eq? @repl "-")
      )
