defaults:
  crit: notable
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: ipv6-correctform-dash-render
  desc: IPv6 correctForm dash rendering
  if:
    type: text
    regex: correctForm\(\)\.replace\(/:/g,\s*'-'\)
- id: dashed-ip-regex
  desc: Dashed IP Replacement pattern (regex)
  attack: T1071.004
  size_max: 50000
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @obj
          property: (property_identifier) @prop
        )
        arguments: (arguments
          (regex (regex_pattern) @pat)
          (string (string_fragment) @repl)
        )
        (#match? @obj "(?i)(ip|addr|address|host|octet)")
        (#eq? @prop "replace")
        (#match? @pat "\\.")
        (#not-match? @pat ":")
        (#eq? @repl "-")
      )
  unless:
  - id: micro-behaviors/data/manipulation::alpha-sanitization-replace
  - id: metadata/build/autotools/
  - id: metadata/build/pip::setup-py
  - id: micro-behaviors/data/encode/json-pointer::json-pointer-token-escape
  - type: text
    substr: replace(/[^a-zA-Z0-9_.-]+/g, "-")
  downgrade:
    any:
    - id: well-known/lib
- id: dashed-ip-colon-regex
  desc: Dashed IP Replacement (colon to dash)
  attack: T1071.004
  size_max: 50000
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @obj
          property: (property_identifier) @prop
        )
        arguments: (arguments
          (regex (regex_pattern) @pat)
          (string (string_fragment) @repl)
        )
        (#match? @obj "(?i)(ip|addr|address|host|octet)")
        (#eq? @prop "replace")
        (#match? @pat ":")
        (#not-match? @pat "\\.")
        (#eq? @repl "-")
      )
  unless:
  - id: micro-behaviors/data/manipulation::alpha-sanitization-replace
  - id: metadata/build/autotools/
  - id: metadata/build/pip::setup-py
  - id: micro-behaviors/data/encode/json-pointer::json-pointer-token-escape
  - id: ipv6-correctform-dash-render
  downgrade:
    any:
    - id: well-known/lib
composite_rules:
- id: dashed-ip-manipulation
  desc: IP Address Manipulation (Dashed format for DNS Exfil)
  any:
  - id: dashed-ip-regex
  - id: dashed-ip-colon-regex
  unless:
  - id: micro-behaviors/data/manipulation::alpha-sanitization-replace
  - id: micro-behaviors/data/manipulation::filename-sanitization-replace
  - id: metadata/build/autotools
  - id: metadata/build/pip::setup-py
  - id: well-known/lib
