# Go IP Parsing
# Neutral Go net package IP operations
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: baseline
traits:
  - id: net-split-host-port
    desc: Go parses host-port endpoint syntax
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: "net.SplitHostPort"
  - id: netip-parseaddr
    desc: Go parses IP address value
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: "netip.ParseAddr"
  - id: net-parseip
    desc: net.ParseIP() call
    conf: 0.5
    if:
      type: symbol
      kind: call
      exact: "net.ParseIP"
  - id: net-ip-address-wrapper
    desc: Go IP address wrapper call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: "net.IPAddress"
  - id: net-parsecidr
    desc: net.ParseCIDR() call
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: "net.ParseCIDR"
  - id: ipnet-contains
    desc: net.IPNet.Contains() call
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bip[Nn]et\.Contains\('
  - id: go-four-byte-prefix-to-ipv4
    desc: Go converts four-byte prefix to IPv4
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bnet\.IP\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\[\s*:\s*(net\.IPv4len|4)\s*\]\s*\)\.String\s*\('

composite_rules:
  - id: go-host-port-ip-parser
    desc: Go parses host-port into IP address
    crit: notable
    conf: 0.98
    near_bytes: 500
    all:
      - id: net-split-host-port
      - id: netip-parseaddr
  - id: go-hex-decoded-ip-address
    desc: Go parses hex-decoded bytes as an IP address
    crit: notable
    conf: 0.98
    near_bytes: 900
    all:
      - id: micro-behaviors/data/decode/hex::go-hex-decode-string
      - id: net-parseip
