defaults:
  crit: notable
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: ip-defanged-brackets
  desc: Defanged IP address with brackets
  if:
    type: text
    regex: \b(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\[\.\](25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}\b
  unless:
    - type: path
      regex: '(^|[\\/])(tests?|testing|spec|testdata)[\\/]'
- id: ip-defanged-parentheses
  desc: Defanged IP address with parentheses
  if:
    type: text
    regex: \b(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\(\.\)(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}\b
composite_rules:
- id: defanged-ip-delimited-dots
  desc: Defanged IP with delimited dots
  any:
  - id: ip-defanged-brackets
  - id: ip-defanged-parentheses
