defaults:
  platforms: [windows, linux, macos]
  for: [python, pyc]
traits:
  - id: socket-inet-pton
    desc: Parse IP with socket.inet_pton
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: socket.inet_pton
  - id: python-ip-address-parse
    desc: Python parses an IP address value
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: ipaddress.ip_address

composite_rules:
  - id: python-hex-decoded-ip-address
    desc: Python parses hex-decoded bytes as an IP address
    crit: notable
    conf: 0.98
    near_bytes: 900
    all:
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: python-ip-address-parse
