defaults:
  platforms: [unix, windows]
  for: [php, scripts, c, cpp, go]
  crit: notable
  conf: 0.9
traits:
- id: ip-bitwise-cidr-check
  desc: Bitwise IP range verification logic
  crit: baseline
  if:
    type: text
    substr: (?i)\(?.{0,20}\$[a-z0-9_]{1,20}\s*&\s*\$[a-z0-9_]{1,20}.{0,20}\)
    case_insensitive: true
  conf: 1.0
- id: ip-to-long-conversion--rx-2
  desc: Regex component marker
  crit: component
  if:
    type: text
    regex: (?i)\b(IPToLong|ip[-_]?to[-_]?(int|long|number))\b
- id: ip-to-long-conversion--rx-3
  desc: Regex component marker
  crit: component
  if:
    type: text
    regex: (?i)\b(ip2long|inet[-_]?aton)\b
- id: ip-network-from-cidr
  desc: Builds an IP network object from CIDR
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)(ip_network|IPv4Network|IPv6Network)$'
- id: ipv4-cidr-slash-24-or-wider
  desc: IPv4 CIDR prefix /24 or wider
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: '\b\d{1,3}(\.\d{1,3}){3}/(1?\d|2[0-4])\b'
# Require hosts() to operate on a network constructor's result. A method named
# hosts on an unrelated object, or a constructor elsewhere, proves no expansion.
- id: cidr-host-expansion
  desc: Expands a CIDR network to host addresses
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)hosts$'
    receiver:
      from:
        call: '(^|\.)(ip_network|IPv4Network|IPv6Network)$'

composite_rules:
- id: ip-to-long-conversion
  desc: Converts IP to long/decimal format
  crit: baseline
  conf: 1.0
  any:
  - id: ip-to-long-conversion--rx-2
  - id: ip-to-long-conversion--rx-3
  unless:
  - id: metadata/file/catalog/identity/
