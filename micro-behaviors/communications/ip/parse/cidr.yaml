defaults:
  platforms: [unix, windows]
  for: [php, scripts, c, cpp, go]
  crit: notable
  conf: 0.9
traits:
- id: ip-bitwise-cidr-check
  desc: Bitwise IP range verification logic
  crit: baseline
  if:
    type: text
    substr: (?i)\(?.{0,20}\$[a-z0-9_]{1,20}\s*&\s*\$[a-z0-9_]{1,20}.{0,20}\)
    case_insensitive: true
  conf: 1.0
- id: ip-to-long-conversion--rx-2
  desc: Regex component marker
  crit: component
  if:
    type: text
    regex: (?i)\b(IPToLong|ip[-_]?to[-_]?(int|long|number))\b
  count_max: 1016076
- id: ip-to-long-conversion--rx-3
  desc: Regex component marker
  crit: component
  if:
    type: text
    regex: (?i)\b(ip2long|inet[-_]?aton)\b
  count_max: 1016077
- id: ip-network-from-cidr
  desc: Builds an IP network object from CIDR
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: '\b(ip_network|IPv4Network|IPv6Network)\s*\('
- id: ipv4-cidr-slash-24-or-wider
  desc: IPv4 CIDR prefix /24 or wider
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: '\b\d{1,3}(\.\d{1,3}){3}/(1?\d|2[0-4])\b'
- id: network-host-address-iteration
  desc: Network object host-address iteration
  # `.hosts()` alone names no subject -- it is only an address expansion when
  # paired with the network constructor, so it carries no standalone meaning.
  crit: component
  conf: 0.8
  for: [python]
  if:
    type: text
    regex: '\.hosts\s*\(\s*\)'

composite_rules:
# Neutral on its own -- inventory, allocation and firewall tooling all expand a
# CIDR -- so the scan intent comes from composites that pair this with per-host
# probing (see objectives/discovery/network/scan/port). Split into two atoms
# because the two calls usually sit on separate lines (`net = ip_network(...)`
# then `net.hosts()`), and text runs are line-bounded.
- id: cidr-host-expansion
  desc: Expands a CIDR network to host addresses
  crit: notable
  conf: 0.9
  for: [python]
  all:
  - id: ip-network-from-cidr
  - id: network-host-address-iteration
  near_lines: 8
- id: ip-to-long-conversion
  desc: Converts IP to long/decimal format
  crit: baseline
  conf: 1.0
  any:
  - id: ip-to-long-conversion--rx-2
  - id: ip-to-long-conversion--rx-3
  unless:
  - id: metadata/file/catalog/identity/
