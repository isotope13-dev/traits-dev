# IPv4 literals in spellings that host parsers disagree on. A dotted quad
# written with fullwidth digits normalizes to an IPv4 address for the
# connection but is not recognized as an IP literal by hostname verifiers.
# A leading-zero octet is read as octal by WHATWG-style parsers and as
# decimal by some OS resolvers, so the validated address can differ from
# the connected address. The URL-spelling sibling is url-with-octal-ip in
# ip/literal; these match the bare host literal in any octet position.
# The fullwidth atoms are split by which octet starts with a fullwidth
# digit. A leading-zero octet can run to four digits (0127), so the quad
# shape allows up to four digits per octet. The bare literal shape is
# notable, like url-with-octal-ip: it also appears in invalid-host test
# lists and parser test data. Sink-bound use is graded by the TLS
# objectives. The segment atom requires
# 0[1-7][0-7]+, the shape whose octal and decimal readings actually
# differ; two-digit forms (01) and zero-padded small values (003) read
# the same both ways and are not the differential.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: fullwidth-first-octet-quad
    desc: Quad with fullwidth first octet
    crit: notable
    conf: 0.9
    if:
      type: literal
      exclude_docstrings: true
      regex: '^[０-９][0-9０-９]{0,2}\.[0-9０-９]{1,3}\.[0-9０-９]{1,3}\.[0-9０-９]{1,3}$'
  - id: fullwidth-second-octet-quad
    desc: Quad with fullwidth second octet
    crit: notable
    conf: 0.9
    if:
      type: literal
      exclude_docstrings: true
      regex: '^[0-9０-９]{1,3}\.[０-９][0-9０-９]{0,2}\.[0-9０-９]{1,3}\.[0-9０-９]{1,3}$'
  - id: fullwidth-third-octet-quad
    desc: Quad with fullwidth third octet
    crit: notable
    conf: 0.9
    if:
      type: literal
      exclude_docstrings: true
      regex: '^[0-9０-９]{1,3}\.[0-9０-９]{1,3}\.[０-９][0-9０-９]{0,2}\.[0-9０-９]{1,3}$'
  - id: fullwidth-fourth-octet-quad
    desc: Quad with fullwidth fourth octet
    crit: notable
    conf: 0.9
    if:
      type: literal
      exclude_docstrings: true
      regex: '^[0-9０-９]{1,3}\.[0-9０-９]{1,3}\.[0-9０-９]{1,3}\.[０-９][0-9０-９]{0,2}$'
  - id: ascii-dotted-quad
    desc: Dotted quad of ASCII digits
    crit: component
    conf: 0.85
    if:
      type: literal
      exclude_docstrings: true
      regex: '^([0-9]{1,4}\.){3}[0-9]{1,4}(:[0-9]{1,5})?$'
  - id: leading-zero-in-quad-chars
    desc: Quad-shaped literal has leading-zero segment
    crit: component
    conf: 0.85
    if:
      type: literal
      exclude_docstrings: true
      regex: '^[0-9.:]*(\.|^)0[1-7][0-7]{1,2}(\.|:|$)[0-9.:]*$'
  # Uniformly zero-padded quads (010.000.000.001) are a fixed-width
  # formatting convention in device and network configuration, so the
  # leading-zero composite below excludes them.
  - id: uniform-padded-dotted-quad
    desc: Dotted quad padded to fixed width
    crit: component
    conf: 0.85
    if:
      type: literal
      exclude_docstrings: true
      regex: '^([0-9]{3}\.){3}[0-9]{3}$'

composite_rules:
  - id: fullwidth-digit-ipv4-literal
    desc: IPv4 literal written with fullwidth digits
    crit: notable
    conf: 0.9
    any:
    - id: micro-behaviors/communications/ip/parse::fullwidth-first-octet-quad
    - id: micro-behaviors/communications/ip/parse::fullwidth-second-octet-quad
    - id: micro-behaviors/communications/ip/parse::fullwidth-third-octet-quad
    - id: micro-behaviors/communications/ip/parse::fullwidth-fourth-octet-quad
  - id: leading-zero-octet-ipv4-literal
    desc: IPv4 literal has leading-zero octet
    crit: notable
    conf: 0.85
    near_bytes: 32
    all:
    - id: micro-behaviors/communications/ip/parse::ascii-dotted-quad
    - id: micro-behaviors/communications/ip/parse::leading-zero-in-quad-chars
    unless:
    - id: micro-behaviors/communications/ip/parse::uniform-padded-dotted-quad
