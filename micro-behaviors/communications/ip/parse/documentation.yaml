defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: inet-pton-documentation-ipv4
    desc: inet_pton uses a documentation-only IPv4 address
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: inet_pton
      arg:
        index: 1
        from:
          whole_value: '^(192\.0\.2|198\.51\.100|203\.0\.113)\.[0-9]{1,3}$'
