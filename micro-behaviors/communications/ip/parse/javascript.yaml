defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.9

traits:
  - id: node-is-ip
    desc: Node.js validates an IP address value
    if:
      type: symbol
      kind: call
      exact: net.isIP

composite_rules:
  - id: node-hex-decoded-ip-address
    desc: Node.js validates hex-decoded bytes as an IP address
    crit: notable
    conf: 0.98
    near_bytes: 900
    all:
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-call
      - id: node-is-ip
