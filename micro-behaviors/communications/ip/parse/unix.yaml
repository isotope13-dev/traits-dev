defaults:
  crit: notable
  conf: 0.66
  platforms: [windows, linux, macos]
  for: [c, cpp, go, rust, elf, macho, so, pe]
traits:
  - id: inet-pton-symbol
    desc: Parse IP with inet_pton
    if:
      type: symbol
      exact: inet_pton
  - id: inet-ntop-symbol
    desc: References inet_ntop IP-to-text API
    if:
      type: symbol
      exact: inet_ntop
  - id: inet-addr-symbol
    desc: Parse IP with inet_addr
    if:
      type: symbol
      exact: inet_addr
  - id: inet-aton-symbol
    desc: Parse IP with inet_aton
    if:
      type: symbol
      exact: inet_aton
  - id: htons-symbol
    desc: Converts host to network short
    if:
      type: symbol
      exact: htons
  - id: htonl-symbol
    desc: Converts host to network long
    if:
      type: symbol
      exact: htonl
  - id: ntohs-symbol
    desc: Converts network to host short
    if:
      type: symbol
      exact: ntohs
  - id: ntohl-symbol
    desc: Converts network to host long
    if:
      type: symbol
      exact: ntohl
composite_rules:
  - id: parse
    desc: Parse IP addresses
    any:
      - id: inet-pton-symbol
      - id: inet-ntop-symbol
      - id: inet-addr-symbol
      - id: inet-aton-symbol
  - id: byte-order
    desc: Network byte order conversion
    any:
      - id: htons-symbol
      - id: htonl-symbol
      - id: ntohs-symbol
      - id: ntohl-symbol
