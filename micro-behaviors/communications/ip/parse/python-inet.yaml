defaults:
  platforms: [unix, windows]
traits:
  - id: python-inet-ntoa-call
    desc: Formats packed IPv4 via socket.inet_ntoa
    for: [python, javascript, typescript, ruby]
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'socket\.inet_ntoa\s*\('
  - id: python-inet-aton-call
    desc: Parses IPv4 text into packed bytes
    for: [python]
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: socket.inet_aton
