defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: resolve-gethostbyname-import
    desc: Windows gethostbyname API string
    crit: baseline
    conf: 0.7
    if:
      type: text
      exact: gethostbyname
  - id: resolve-gethostname-string
    desc: Windows gethostname API string
    crit: baseline
    conf: 0.7
    if:
      type: text
      exact: gethostname

  - id: resolve-ws2-32-string
    desc: Winsock library name string
    crit: component
    conf: 0.76
    if:
      # Not always recovered as a text run (e.g. adjacent to CodeView RSDS);
      # raw match covers dynamic LoadLibrary("Ws2_32") resolve tables.
      type: raw
      regex: '(?i)Ws2_32(\.dll)?'
  - id: resolve-getaddrinfo-import
    desc: Resolve endpoint with getaddrinfo
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: getaddrinfo

composite_rules:
  - id: dynamic-winsock-host-resolution
    desc: Dynamically resolves Windows hostnames
    crit: notable
    conf: 0.95
    all:
      - id: resolve-gethostbyname-import
      - id: resolve-gethostname-string
      - id: micro-behaviors/communications/socket/init::ws2-startup-api-string
      - id: resolve-ws2-32-string
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/os/module/load::get-proc-address-reference
