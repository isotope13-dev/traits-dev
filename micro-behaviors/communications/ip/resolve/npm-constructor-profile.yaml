defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: npm-hidden-helper-telemetry-stack
    desc: Helper, HTTP and public-IP references
    crit: suspicious
    conf: 0.985
    all:
      - id: metadata/filename/source::preparewriter-basename
      - id: metadata/lang/source/naming/function/runtime::constructor-preparewriter-import-and-call
      - id: micro-behaviors/communications/http/lib/axios::axios
      - id: micro-behaviors/communications/ip/resolve::public-ip-module-ref
    any:
      - id: micro-behaviors/os/module/require::dotenv-name-literal
      - id: micro-behaviors/data/config/load::dotenv-config-call
  - id: npm-hidden-helper-telemetry-camouflage
    desc: Helper and IP clues with error messages
    crit: suspicious
    conf: 0.985
    all:
      - id: micro-behaviors/communications/ip/resolve::npm-hidden-helper-telemetry-stack
    any:
      - id: metadata/lang/natural/phrasing/system::backend-cover-message
      - id: metadata/lang/natural/phrasing/system::backend-cover-message-obfuscated
      - id: metadata/lang/natural/phrasing/system::internet-cover-message
      - id: metadata/lang/natural/phrasing/system::internet-cover-message-obfuscated
