# Go endpoint-resolution helpers. These identify address preparation, not
# reconnaissance or scanning intent.
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.88

traits:
  - id: resolve-udp-address
    desc: Resolves a Go UDP endpoint
    if:
      type: symbol
      kind: call
      exact: net.ResolveUDPAddr
