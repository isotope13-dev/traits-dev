defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]


traits:
  - id: hex-format-hostname-resolution-profile
    desc: Hex-format text beside hostname resolution
    crit: notable
    conf: 0.9
    for: [c, cpp, objc]
    if:
      type: text
      regex: '%02x[\s\S]{0,220}gethostbyname\s*\('

    unless:
    - id: well-known/lib/platform/wine::wine-source-tree
    - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
