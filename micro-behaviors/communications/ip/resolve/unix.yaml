defaults:
  crit: notable
  conf: 0.66
  platforms: [linux, macos]
  for: [binaries, source]
traits:
  - id: resolve-gethostbyname
    desc: Resolve hostname with gethostbyname
    platforms: [unix]
    for:
      - elf
      - macho
      - c
      - cpp
      - objc
    if:
      type: symbol
      exact: gethostbyname
  - id: resolve-gethostbyaddr
    desc: References gethostbyaddr address-resolution API
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      exact: gethostbyaddr
  - id: resolve-getaddrinfo
    desc: References getaddrinfo endpoint-resolution API
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      exact: getaddrinfo
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/compiler/systems::go-binary
  - id: getnameinfo-symbol
    desc: Binary references the getnameinfo API
    for: [elf, macho]
    if:
      type: symbol
      exact: getnameinfo

  - id: getnameinfo-non-numeric-source-call
    desc: Source calls getnameinfo without NI_NUMERICHOST
    for: [c, cpp]
    if:
      type: tree-sitter
      language: c
      query: |
        (call_expression
          function: (identifier) @callee
          arguments: (argument_list) @arguments
          (#eq? @callee "getnameinfo")
          (#not-match? @arguments "NI_NUMERICHOST"))

composite_rules:
  - id: resolve-getnameinfo
    desc: Resolve endpoint with getnameinfo
    for: [elf, macho, c, cpp]
    any:
      - id: getnameinfo-symbol
      - id: getnameinfo-non-numeric-source-call
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path

  - id: resolve
    desc: Resolve IP addresses
    for:
      - elf
      - macho
      - c
      - cpp
    any:
      - id: resolve-gethostbyname
      - id: resolve-gethostbyaddr
      - id: resolve-getaddrinfo
      - id: resolve-getnameinfo
