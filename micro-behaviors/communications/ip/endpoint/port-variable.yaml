# Source that binds a port-named variable to a well-known service port. A
# neutral endpoint fact: HTTP clients, TLS servers and config loaders all write
# `port = 443`. Relocated (2026-09) from objectives/command-and-control/channel/
# covert, whose RC4-on-the-TLS-port composite still requires it alongside a
# handwritten RC4 implementation and a raw socket connect.
defaults:
  platforms: [windows, unix]
  for: [source, scripts]
  crit: notable
  attack: T1043

traits:
  - id: port-variable-set-to-443
    desc: Assigns 443 to a port variable
    conf: 0.7
    if:
      type: text
      regex: '(?i)\b\w*port\w*\s*=\s*443\b'
