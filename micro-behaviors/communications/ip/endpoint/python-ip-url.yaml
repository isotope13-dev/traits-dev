# Explicit IPv4 URL targets are a network behavior. Keep the atoms neutral;
# the command-and-control objective composes them with the external-IP test.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-requests-external-ip-url
    desc: Python requests external IPv4 URL
    if:
      type: string_literal
      regex: requests\.(get|post)\([^)]{0,120}https?://\d{1,3}(\.\d{1,3}){3}
      is: external_ip

  - id: python-urllib-external-ip-url
    desc: Python opens external IPv4 URL
    if:
      type: string_literal
      regex: urlopen\([^)]{0,120}https?://\d{1,3}(\.\d{1,3}){3}
      is: external_ip
