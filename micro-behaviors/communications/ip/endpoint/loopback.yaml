# The loopback endpoint written out as a literal. A server binding here, or a
# client pointed here, is talking to the local machine -- which is why rules
# about listening sockets, outbound clients and repository URLs treat it as
# local development rather than a reachable network target.
#
# Two traits rather than one regex because the copies these replace appear
# independently: some clauses name only the address, some only the hostname.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, manifests, data, binaries]
  crit: component
  conf: 0.9
composite_rules:
  # A loopback literal in close range of TCP-client use marks a client that
  # targets its own machine -- the local-harness reading the leaf comment
  # describes. The proximity window keeps remote-end binaries that mention
  # 127.0.0.1 for unrelated reasons (hosts-block lists) out of this claim.
  - id: loopback-endpoint-connect-target
    desc: Loopback target near TCP client reference
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    near_bytes: 2048
    all:
      - id: loopback-ipv4-text
      - id: micro-behaviors/communications/socket/tcp::tcpclient-dotnet-str
  # Benign context: the local readiness harness that drives cmd.exe over its
  # own loopback endpoint shares every token of a connect-back shell; this is
  # the suppressor for those rules.
  - id: loopback-cmd-stdio-harness
    desc: Loopback cmd stdio harness
    crit: exception
    all:
      - id: loopback-endpoint-connect-target
      - id: micro-behaviors/process/create/spawn::redirect-standard-input-dotnet
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name

  - id: fetch-loopback-http-url
    desc: Fetch targets a loopback HTTP URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: loopback-ipv4-text
      - id: localhost-hostname-text

traits:
  - id: loopback-ipv4-text
    desc: Loopback IPv4 address literal
    if:
      type: text
      substr: 127.0.0.1
    unless:
    # A name reached through a string is the reflective spelling; where the
    # direct form is already recorded, this would be the same call twice.
    - id: micro-behaviors/communications/ip/literal::loopback-ipv4-source
  - id: localhost-hostname-text
    desc: localhost hostname literal
    if:
      type: text
      substr: localhost

  # 0.0.0.0 is the all-interfaces wildcard, not loopback: it stays with the
  # bind-all-interfaces traits and must never match under this loopback id.
  - id: javascript-loopback-host-property
    desc: JavaScript object assigns loopback host
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        (pair
          key: [(property_identifier) @key (string (string_fragment) @key)]
          value: (string (string_fragment) @value)
          (#eq? @key "host")
          (#match? @value "^(127\\.0\\.0\\.1|::1)$"))
  - id: javascript-loopback-hostname-property
    desc: JavaScript object assigns loopback hostname
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        (pair
          key: [(property_identifier) @key (string (string_fragment) @key)]
          value: (string (string_fragment) @value)
          (#eq? @key "hostname")
          (#match? @value "^(127\\.0\\.0\\.1|localhost)$"))
