# The loopback endpoint written out as a literal. A server binding here, or a
# client pointed here, is talking to the local machine -- which is why rules
# about listening sockets, outbound clients and repository URLs treat it as
# local development rather than a reachable network target.
#
# Two traits rather than one regex because the copies these replace appear
# independently: some clauses name only the address, some only the hostname.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, manifests, data, binaries]
  crit: component
  conf: 0.9
traits:
  - id: loopback-ipv4-text
    desc: Loopback IPv4 address literal
    if:
      type: text
      substr: 127.0.0.1
    unless:
    # A name reached through a string is the reflective spelling; where the
    # direct form is already recorded, this would be the same call twice.
    - id: micro-behaviors/communications/ip/literal::loopback-ipv4-source
  - id: localhost-hostname-text
    desc: localhost hostname literal
    if:
      type: text
      substr: localhost

  - id: javascript-loopback-host-property
    desc: JavaScript object assigns loopback host
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        (pair
          key: [(property_identifier) @key (string (string_fragment) @key)]
          value: (string (string_fragment) @value)
          (#eq? @key "host")
          (#match? @value "^(0\\.0\\.0\\.0|127\\.0\\.0\\.1|::1)$"))
