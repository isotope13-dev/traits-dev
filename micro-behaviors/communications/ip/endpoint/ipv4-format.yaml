# A dotted IPv4 formatter with a port field describes endpoint presentation;
# socket scanning intent requires the connect and loop evidence below it.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.82

traits:
  - id: ipv4-port-format-string
    desc: Formats an IPv4 address with a port
    if:
      type: text
      exact: "%d.%d.%d.%d:%d"
