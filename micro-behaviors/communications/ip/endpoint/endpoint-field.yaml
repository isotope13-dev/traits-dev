defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, csharp]

traits:
  # Relocated from objectives/.../backdoor/rat/config (c2-config-name-marker):
  # `remoteHost`/`RemoteServer` are ordinary client field and class names
  # (.NET remoting ships RemoteServer). The RAT config-cluster composite
  # supplies intent by requiring persistence/mutex/stealth names beside it.
  - id: remote-endpoint-field-name
    desc: C2 or remote host/server field name
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(c2|remote)[_-]?(host|endpoint|server)\b'
