defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, php]
traits:
  - id: target-argument-field
    desc: Reads network target argument field
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      regex: '(?i)^args\.(target|host|url|ip(_address)?)$'
