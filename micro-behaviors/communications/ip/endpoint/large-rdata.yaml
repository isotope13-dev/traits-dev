defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: external-ipv4-port-rdata-large
  desc: External IPv4:port literal in rdata
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: (^(?:[0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]{2,5}$)
    is: external_ip
    section: rdata
  unless:
  - id: metadata/lang/compiler/managed::dotnet-ipv4-like-version
  - id: well-known/tool/reverse-engineering/reverse-slop/
  # Node.js runtime's own inspector default (127.0.0.1:9229) is not a C2 literal.
  - id: well-known/lib/runtime/scripted/nodejs-runtime::nodejs-embedded-pe-runtime
