defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.94
traits:
  - id: go-client-start-fixed-endpoint
    desc: Client Start call with endpoint
    # The endpoint must reach this Start call, whose receiver originates at
    # a client constructor. Merely declaring a hostname is insufficient.
    # Start is a helper, so this observes its endpoint argument; it does
    # not establish a call to a known socket-connect API.
    if:
      type: symbol
      kind: call
      regex: '\.Start$'
      receiver:
        from:
          call: '(^|\.)NewClientM?$'
      arg:
        index: 0
        from:
          value: '^[A-Za-z0-9.-]+:[0-9]{1,5}$'
