# Host properties do not identify proxies or establish traffic collection.
# Keep resolver/private/documentation exclusions for the infrastructure consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: javascript-non-resolver-ipv4-host-table
    desc: Multiple non-resolver IPv4 host properties
    crit: notable
    conf: 0.94
    # The engine counts captured keys and values, not distinct addresses.
    count_min: 5
    unless:
      - id: metadata/package/testing/harness/unit::vitest-import
    if:
      type: tree-sitter
      query: |
        (pair
          key: [(property_identifier) @key (string (string_fragment) @key)]
          value: (string (string_fragment) @value)
          (#eq? @key "host")
          (#match? @value "^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$")
          (#not-match? @value "^(8\\.8\\.8\\.8|8\\.8\\.4\\.4|1\\.1\\.1\\.1|1\\.0\\.0\\.1|9\\.9\\.9\\.9|149\\.112\\.112\\.112|208\\.67\\.222\\.222|208\\.67\\.220\\.220|223\\.5\\.5\\.5|223\\.6\\.6\\.6|119\\.29\\.29\\.29|114\\.114\\.114\\.114|114\\.114\\.115\\.115|77\\.88\\.8\\.8|64\\.6\\.64\\.6)$")
          (#not-match? @value "^(0|127|10)\\.")
          (#not-match? @value "^192\\.168\\.")
          (#not-match? @value "^(192\\.0\\.2|198\\.51\\.100|203\\.0\\.113)\\.")
          (#not-match? @value "^169\\.254\\.")
          (#not-match? @value "^172\\.(1[6-9]|2[0-9]|3[01])\\."))

