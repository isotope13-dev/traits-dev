traits:
- crit: notable
  conf: 0.94
  id: node-http-ipv4-hostname-option
  desc: HTTP hostname option names IPv4 address
  if:
    type: text
    regex: (?is)hostname\s*:\s*['"]([0-9]{1,3}\.){3}[0-9]{1,3}['"]
    # Loopback and unspecified addresses reach only the local host.
    not:
      - regex: '[''"](127\.|0\.0\.0\.0)'
composite_rules:
- crit: notable
  conf: 0.95
  id: node-raw-ip-http-endpoint
  desc: HTTP URL or host options use IPv4
  any:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-host-port-fields
  - id: micro-behaviors/communications/ip/endpoint::node-http-ipv4-hostname-option
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
