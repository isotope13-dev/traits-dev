# Immediate AF_INET endpoint construction emitted by m68k compilers: store
# family 2, an immediate IPv4 value, then an immediate port in one sockaddr.
# Addresses of the destination fields, the IPv4 value, and the port vary.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: m68k-immediate-ipv4-sockaddr
    desc: m68k code builds immediate IPv4 endpoint
    crit: notable
    conf: 0.98
    attack: T1095
    if:
      type: hex
      offset_range: [64, null]
      pattern: "33 FC 00 02 ?? ?? ?? ?? 23 FC ?? ?? ?? ?? ?? ?? ?? ?? 33 FC ?? ?? ?? ?? ?? ??"
