defaults:
  platforms: [unix, windows]
  for: [elf, shell]

traits:
- id: ipv4-port-23
  desc: IPv4 endpoint with port 23
  crit: notable
  conf: 0.8
  platforms:
  - linux
  if:
    type: text
    is: valid_ip
    regex: \b[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:23\b
- id: hostname-port-23
  desc: Hostname-shaped endpoint with port 23
  crit: notable
  conf: 0.8
  platforms:
  - linux
  if:
    type: text
    regex: \b[a-z0-9][a-z0-9-]{0,62}\.[a-z0-9][a-z0-9.-]{1,190}:23\b
  not:
  - regex: \.(rs|c|cc|cpp|h|hpp|go|py|js|ts|y|l|yy|ll|cs|rb|java|sh|properties|po|pot|txt|at|ml|mli|ac|m4):23\b

