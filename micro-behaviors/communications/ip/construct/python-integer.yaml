traits:
- id: python-ipv4address-integer-literal
  desc: IPv4Address call with integer literal
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (ipaddress\.)?IPv4Address\s*\(\s*(0x[0-9a-fA-F]{6,8}|[0-9]{4,10})\s*\)
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - ruby
