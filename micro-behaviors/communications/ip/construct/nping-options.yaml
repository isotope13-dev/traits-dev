defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: source-port
    desc: nping explicitly sets a source port
    crit: notable
    conf: 0.85
    # A bare `--source-port` token is shared with iptables and other packet
    # tools (an IoT bot opening `--source-port 5002` via iptables is not
    # nping). Require the nping binary name on the same command line so the
    # trait proves nping rather than any --source-port consumer.
    if:
      type: text
      case_insensitive: true
      regex: '(?i)\bnping\b[^\r\n]{0,300}--source-port'
  - id: payload-data
    desc: nping packet data payload
    crit: notable
    conf: 0.85
    # `--data=` alone is a generic CLI option (mysqld_safe, curl, arg
    # parsers); bind it to the nping command line like source-port.
    if:
      type: text
      regex: '(?i)\bnping\b[^\r\n]{0,300}--data='

  # Three or more TCP flags asserted on one packet. The pairs that show up this
  # way -- RST with PSH, FIN with RST, anything carrying URG or CWR -- are
  # combinations no TCP stack produces, so the packet exists to be recognised
  # rather than to be answered. Two flags is still ordinary (SYN,ACK and
  # FIN,ACK are how TCP works); three is where the crafting starts.
