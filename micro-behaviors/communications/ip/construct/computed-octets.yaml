defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]

composite_rules:
- id: computed-octet-dot-separator
  desc: Computed octet array with dot separator
  crit: notable
  conf: 0.9
  near_lines: 16
  # Octets arrive either as a literal first octet plus computed rest, or all
  # as offsets from one base (`[seed+102, seed+57, seed-35, seed-43]` ->
  # 193.148.56.48 in a wallet-stealer extension).
  all:
  - id: micro-behaviors/data/control-flow/branch::ternary-dot-separator
  any:
  - id: micro-behaviors/data/collection/array::four-value-array-with-identifier
  - id: micro-behaviors/data/collection/array::identifier-offset-array
  # This is a neutral construction capability. Build tools, formatters, and
  # tests can exhibit it too; their provenance does not erase the observation.
