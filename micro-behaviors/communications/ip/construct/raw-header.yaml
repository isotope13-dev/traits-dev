# IP_HDRINCL lets callers construct their own IP header. It does not prove
# that the source address impersonates another host.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
composite_rules:
- id: raw-socket-explicit-ip-header
  desc: Raw socket uses a caller-supplied IP header
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
  - id: micro-behaviors/communications/socket/options::ip-hdrincl-option
  unless:
  - id: micro-behaviors/communications/icmp/ping::icmp-echo-api-constant
  - id: micro-behaviors/communications/ip/spoof::apple-network-cmds-path
  - id: micro-behaviors/communications/ip/spoof::s390-tools-source-tree-path
