# Evidence describes ordinary capabilities or static properties.
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - ruby
  id: python-ipv4-from-integer
  desc: IPv4Address constructor with an integer literal
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (ipaddress\.)?IPv4Address\s*\(\s*(0x[0-9a-fA-F]{6,8}|[0-9]{4,10})\s*\)
