defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-random-ipv4-octet
    desc: Repeated shell random arithmetic for IPv4 octets
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)^\s*o[1-4]\s*=\s*\$\(\([^\n]{0,80}(RANDOM|urandom)[^\n]{0,20}%\s*2(54|56)\b'
  - id: shell-ipv4-four-variable-format
    desc: Shell formats four variables as IPv4
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\{[A-Za-z_]\w*\}\.\$\{[A-Za-z_]\w*\}\.\$\{[A-Za-z_]\w*\}\.\$\{[A-Za-z_]\w*\}'
composite_rules:
  - id: shell-random-ipv4-generation
    desc: Shell generates IPv4 targets from random values
    crit: notable
    conf: 0.96
    all:
      - id: shell-random-ipv4-octet
      - id: shell-ipv4-four-variable-format
