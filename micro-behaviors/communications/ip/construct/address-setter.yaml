defaults:
  platforms: [windows, unix]
  for: [python, javascript, shell, powershell, go, c, rust]
  crit: notable
  conf: 0.94

traits:
  - id: ip-address-setter-call
    desc: Calls an IP-address setter method
    if:
      type: symbol
      kind: call
      # `address` is required: a bare `setIP`/`set_ip` is overwhelmingly the
      # unwinder/JIT/debugger "set instruction pointer" accessor (libunwind's
      # Registers::setIP, DWARF step code), not a network-interface setter.
      regex: '(?i)(^|\.)(set|change|update|assign)[_-]?ip[_-]?address$'

  - id: loopback-address-call-argument
    desc: Call contains a loopback address argument
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: tree-sitter
      kind: call
      substr: '127.0.0.1'


composite_rules:
  - id: ip-set-to-loopback
    desc: Calls an IP setter near loopback
    crit: notable
    conf: 0.96
    all:
      - id: ip-address-setter-call
    any:
      - id: loopback-address-call-argument
      - id: micro-behaviors/communications/ip/literal::javascript-loopback-call-argument
    near_lines: 4
