---
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - ruby
  id: integer-array-dot-join
  desc: Four-integer array near dot-separated join
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \[\d{1,3}(,\s*\d{1,3}){3}\][^\n]{0,40}\.join\(["']\.["']\)
  not:
  - regex: "\\[\\s*(24,\\s*16,\\s*8,\\s*0|0,\\s*8,\\s*16,\\s*24)\\s*\\]"
  - regex: \[\d{1,3}(,\s*\d{1,3}){3}\][^\n]{0,40}>>[^\n]{0,40}\.join\(["']\.["']\)
