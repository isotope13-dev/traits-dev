defaults:
  for: [source, scripts, binaries]
  platforms: [unix, windows]
traits:
# Protocol header struct declarations. These are the ordinary way any C
# networking code — a libc <netinet/tcp.h>, a packet sniffer, an XDP program —
# names a wire header, so they are neutral capabilities here rather than
# BPF/XDP-specific markers. (Moved from micro-behaviors/os/bpf/program/, where
# the names claimed XDP/BPF context the regexes cannot see.)
- id: tcp-header-struct
  desc: References the TCP header structure
  crit: notable
  conf: 0.62
  for: [c, elf]
  if:
    type: text
    regex: struct\s+tcphdr|tcphdr\s*\*
- id: ip-header-struct
  desc: References the IP header structure
  crit: baseline
  conf: 0.5
  for: [c, elf]
  if:
    type: text
    regex: struct\s+iphdr|iphdr\s*\*
- id: icmp-header-struct
  desc: References the ICMP header structure
  crit: notable
  conf: 0.7
  for: [c, elf]
  if:
    type: text
    regex: struct\s+icmphdr|icmphdr\s*\*
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
- id: ip-checksum-calc
  desc: Manual IP checksum calculation function
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: "sum = \\(sum >> 16\\).{0,30}sum >> 16"
# Hand-built IPv4 fragmentation: the more-fragments flag written into an IP
# header the program is assembling itself. Fragment *reassembly* is the kernel's
# job, so userspace code that emits fragments deliberately is building a packet
# the receiver has to reassemble -- an evasion trick for inspection devices, and
# the entry condition for reassembly-path kernel bugs (Fragnesia,
# CVE-2026-46300). Neutral on its own: MTU test tools and packet generators do
# the same thing.
- id: ip-fragment-flag-assignment
  desc: Sets the IPv4 more-fragments flag
  crit: notable
  conf: 0.88
  for: [c, cpp, rust, go, python, elf]
  if:
    type: text
    regex: '\bfrag_off\b[^;\n]{0,120}\bIP_MF\b|\bIP_MF\b[^;\n]{0,120}\bfrag_off\b'
- id: setup-ip-header-func
  desc: IP header construction function
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: setup_ip_header
- id: setup-udp-header-func
  desc: UDP header construction function
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: setup_udp_header
- id: tcp-ack-flag-set--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: "\\b(TH_ACK|TCP_ACK|TCPHDR_ACK|ACK_FLAG)\\b"
  count_max: 1015703
- id: tcp-ack-flag-set--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: "\\btcp(hdr|_header)?\\b.{0,160}\\back\\s*="
  count_max: 1015704
composite_rules:
- id: tcp-ack-flag-set
  desc: TCP ACK flag construction
  crit: component
  conf: 0.85
  any:
  - id: tcp-ack-flag-set--rx-1
  - id: tcp-ack-flag-set--rx-2
