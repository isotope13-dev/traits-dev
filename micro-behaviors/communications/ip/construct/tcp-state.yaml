defaults:
  platforms: [unix, windows]
  for: [source, scripts, binaries]

traits:
  - id: tcp-syn-constant
    desc: TCP SYN flag constant
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(TH_SYN|TCP_SYN|TCPHDR_SYN|SYN_FLAG)\b'

  - id: tcp-syn-member
    desc: TCP SYN member assignment
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(tcp|packet\.tcp)(->|\.)syn\s*=\s*1\b'

  - id: scapy-tcp-syn
    desc: Scapy TCP SYN packet
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)\bTCP\s*\([^)]{0,180}\bflags\s*=\s*["'']S["'']'

  - id: tcp-rst-constant
    desc: TCP RST flag constant
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(TH_RST|TCP_RST|TCPHDR_RST|RST_FLAG)\b'

  - id: tcp-rst-member
    desc: TCP RST member assignment
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(tcp|packet\.tcp)(->|\.)rst\s*=\s*1\b'

  - id: scapy-tcp-rst
    desc: Scapy TCP RST packet
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '(?is)\bTCP\s*\([^)]{0,180}\bflags\s*=\s*["'']R[A"'']?'

  - id: tcp-sequence-member
    desc: TCP sequence member assignment
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(tcp|packet\.tcp)(->|\.)seq\s*='

  - id: scapy-tcp-sequence
    desc: Scapy TCP sequence field
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?is)\bTCP\s*\([^)]{0,180}\bseq\s*='

  - id: ip-source-member
    desc: IP source member assignment
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '(?i)\b(ip|packet\.ip)(->|\.)saddr\s*='

  - id: scapy-ip-source
    desc: Scapy IP source field
    crit: notable
    conf: 0.91
    for: [python]
    if:
      type: text
      regex: '(?is)\bIP\s*\([^)]{0,160}\bsrc\s*='

composite_rules:
  - id: tcp-syn-flag-construction
    desc: TCP SYN flag construction
    crit: notable
    conf: 0.95
    any:
      - id: tcp-syn-constant
      - id: tcp-syn-member
      - id: scapy-tcp-syn

  - id: tcp-rst-flag-construction
    desc: TCP RST flag construction
    crit: notable
    conf: 0.96
    any:
      - id: tcp-rst-constant
      - id: tcp-rst-member
      - id: scapy-tcp-rst

  - id: tcp-sequence-field-construction
    desc: TCP sequence field construction
    crit: notable
    conf: 0.94
    any:
      - id: tcp-sequence-member
      - id: scapy-tcp-sequence

  - id: crafted-ip-source-field
    desc: Crafted IP source field
    crit: notable
    conf: 0.92
    any:
      - id: ip-source-member
      - id: scapy-ip-source
