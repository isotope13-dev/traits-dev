# Rust IPv4 address construction from octet literals.
defaults:
  crit: notable
  conf: 0.92
  platforms: [unix, windows, android]
  for: [rust]
  mbc: C0002
  attack: T1071.001

traits:
  - id: rust-ipv4addr-literal-tuple
    desc: Builds IPv4 address from literals
    if:
      type: text
      regex: 'Ipv4Addr::new\s*\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)'
    not:
      - regex: 'Ipv4Addr::new\s*\(\s*127\s*,\s*0\s*,\s*0\s*,\s*1\s*\)'
      - regex: 'Ipv4Addr::new\s*\(\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*\)'
