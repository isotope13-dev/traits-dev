defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: static-stripped-elf-external-ip-literal
    desc: Static stripped ELF contains an external IPv4 literal
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
      - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty-flag
      - id: external-ipv4-host-literal-binary
    unless:
      - id: micro-behaviors/ui/help::has-help
      - id: metadata/lang/compiler/systems::go-buildinfo
