defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
traits:
  - id: base64-layer-percent-numeric-http-host
    desc: Base64 layer contains percent numeric host
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '%2[Ff]%2[Ff](%3[0-9]){1,3}(%2[Ee](%3[0-9]){1,3}){3}%2[Ff]'
