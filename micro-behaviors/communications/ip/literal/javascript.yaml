defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001

traits:
  - id: javascript-external-http-ip-url
    desc: JavaScript raw external-IP URL literal
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      regex: 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?'
      is: external_ip
