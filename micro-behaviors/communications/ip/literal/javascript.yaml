defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001

traits:
  - id: javascript-external-http-ip-url
    desc: JavaScript raw external-IP URL literal
    # A JavaScript source literal naming an IP address instead of a hostname is
    # not a configuration style: it skips DNS, certificate name validation and
    # every domain-reputation control, which is why droppers reach for it. The
    # public-resolver probes below are the benign shape, and they are excluded.
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      regex: 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?'
      is: external_ip
    # Public DNS resolvers are common connectivity probes (HEAD http://1.1.1.1)
    # and pass the external-IP validator; exclude them so POST+fetch composites
    # do not treat a minified SDK's network check as a hardcoded C2 endpoint.
    not:
      - regex: 'https?://(1\.1\.1\.1|1\.0\.0\.1|8\.8\.[84]\.[84]|9\.9\.9\.9)\b'
      - regex: 'https?://(149\.112\.|208\.67\.)'
    # Every sibling raw-IP-URL atom in ipv4.yaml (http-ip-url-source-literal,
    # external-ipv4-url-script, malformed-http-ip-url-source-literal, ...)
    # carries this same test-context carve-out; this one was bumped from
    # notable to suspicious without it. Angular/React component specs
    # routinely feed a registry-endpoint form mock IPs like 4.4.4.4 or
    # 101.1.11.111 as fixture data (e.g. Harbor's endpoint.component.spec.ts),
    # which is not a hardcoded C2 endpoint.
    unless:
      - id: metadata/package/testing/
