defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1071.001
  crit: notable
  conf: 0.95
traits:
- id: javascript-external-http-ip-url
  desc: JavaScript raw external-IP URL literal
  if:
    type: string_literal
    regex: https?://([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]{1,5})?
    is: external_ip
  not:
  - regex: https?://(1\.1\.1\.1|1\.0\.0\.1|8\.8\.[84]\.[84]|9\.9\.9\.9)\b
  - regex: https?://(149\.112\.|208\.67\.)
  - regex: https?://1\.2\.3\.4(:[0-9]{1,5})?\b
  - regex: :0(/|\b|$)
  unless:
  - id: metadata/package/testing/
  - type: text
    regex: from ["']k6/
  - id: metadata/path::test-directory-component
- id: javascript-loopback-call-argument
  desc: JavaScript call argument contains loopback IP
  for:
  - javascript
  if:
    type: symbol
    kind: call
    regex: .
    arg:
      kind: string
      regex: (^|[^0-9.])127\.0\.0\.1($|[^0-9.])
  unless:
  - id: metadata/lang/source/declaration::pony-method-declaration-syntax
