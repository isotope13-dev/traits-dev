# RFC 8215 extends the well-known NAT64 space with 64:ff9b:1::/48. For this
# prefix the embedded IPv4 address is split around the reserved u octet; it is
# not stored in the final 32 bits as it is for 64:ff9b::/96. These atoms model
# URL structure only. Parser-confusion objectives combine them with a nonzero
# suffix and an active HTTP client before inferring an SSRF bypass.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, text]
  conf: 0.98

traits:
  - id: rfc8215-nat64-link-local-url
    desc: RFC 8215 NAT64 URL embeds link-local IPv4
    crit: suspicious
    if:
      type: literal
      regex: '(?i)^https?://\[64:ff9b:0*1:a9fe:0*[0-9a-f]{1,2}:[0-9a-f]{1,2}00:'

  - id: rfc8215-nat64-loopback-url
    desc: RFC 8215 NAT64 URL embeds loopback IPv4
    crit: suspicious
    if:
      type: literal
      regex: '(?i)^https?://\[64:ff9b:0*1:7f[0-9a-f]{2}:'

  - id: rfc8215-nat64-rfc1918-url
    desc: NAT64 /48 URL embeds RFC1918 IPv4
    crit: suspicious
    if:
      type: literal
      regex: '(?i)^https?://\[64:ff9b:0*1:(0?a[0-9a-f]{2}|ac1[0-9a-f]|c0a8):'

  # With a /48 prefix, the last 40 bits are outside the embedded IPv4 value.
  # A nonzero first suffix word is the parser-differential primitive: a guard
  # that wrongly reads the final 32 bits can classify an unrelated decoy IP.
  - id: rfc8215-nat64-nonzero-suffix-url
    desc: RFC 8215 NAT64 URL has nonzero suffix
    crit: notable
    if:
      type: literal
      regex: '(?i)^https?://\[64:ff9b:0*1:([0-9a-f]{1,4}:){3}[1-9a-f][0-9a-f]{0,3}:'

composite_rules:
  - id: rfc8215-nat64-private-target-url
    desc: RFC 8215 NAT64 URL embeds a private IPv4 destination
    crit: suspicious
    any:
      - id: rfc8215-nat64-link-local-url
      - id: rfc8215-nat64-loopback-url
      - id: rfc8215-nat64-rfc1918-url
