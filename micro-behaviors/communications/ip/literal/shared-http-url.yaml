# RFC 6598 shared address space is not a public Internet destination.
# Keep its direct-IP capability separate from the public-IP observations.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, manifests, documents]
  crit: notable

traits:
  - id: shared-ipv4-http-url
    desc: HTTP URL in shared IPv4 space
    conf: 0.95
    if:
      type: text
      regex: 'https?://100\.(6[4-9]|[789]\d|1[01]\d|12[0-7])(\.\d{1,3}){2}([/:"''\s]|$)'
      is: valid_ip

composite_rules:
  - id: public-or-shared-ipv4-http-url
    desc: Public or shared IPv4 HTTP URL
    conf: 0.95
    any:
      - id: http-ip-url
      - id: shared-ipv4-http-url
