  - id: javascript-external-http-ip-url
  - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
  unless:
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-signed-launcher-context

- id: malformed-http-ip-url
  desc: Malformed HTTP URL with IP
  crit: suspicious
  conf: 0.93
  any:
  - id: malformed-http-ip-url-source-literal
  - id: malformed-http-ip-url-manifest

- id: private-192-http-url
  desc: HTTP URL uses private 192.168 address
  crit: notable
  conf: 0.9
  any:
  - id: private-192-http-url-source-literal
  - id: multiple-private-192-http-urls-text

