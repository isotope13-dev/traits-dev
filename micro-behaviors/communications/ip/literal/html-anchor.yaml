# HTML anchors whose href is a public IPv4 literal. Mailed HTML is often
# quoted-printable, so `href=3D"` is accepted as well as `href="`. An
# IP-hosted link is ordinary on appliance, intranet and mirror pages; it is
# recorded here as a neutral fact. IP-hosted `/~user` paths are left to
# micro-behaviors/communications/url/path::ip-host-user-path, which already
# describes that case, so the same link is not counted twice.
defaults:
  platforms: [windows, unix]
  # Raw MIME/HTML email files can be parser-classified as makefile from their
  # transport headers; preserve HTML anchor matching on those bodies too.
  for: [html, makefile, text]
traits:
  - id: html-anchor-public-ipv4-href
    desc: HTML anchor links to public IPv4 host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '<a\b[^>]{0,60}\bhref\s*=(3D)?\s*["'']?https?://\d{1,3}(\.\d{1,3}){3}(/[^~]|[:"''>])'
      case_insensitive: true
      exclude_html_comments: true
    not:
      - regex: '//(192\.168\.|10\.|127\.|172\.(1[6-9]|2\d|3[01])\.)'
      - regex: '//0\.0\.0\.0'
