defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - html
  crit: component
  conf: 0.8
traits:
- id: loopback-ipv6-literal
  desc: Contains the IPv6 loopback literal
  conf: 0.9
  if:
    type: text
    substr: ::1
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: ipv4-literal
  desc: Contains an IPv4 address literal
  conf: 0.75
  if:
    type: text
    regex: \b\d{1,3}(\.\d{1,3}){3}\b
    is: valid_ip
