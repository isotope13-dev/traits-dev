# Text matcher retained for existing consumers: unlike http-ip-url-text,
# this includes scripts/documents and has different example/context exclusions.
# A literal address alone does not establish command and control.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, documents]
traits:
  - id: http-ip-url-filtered-text
    desc: Direct external IP address in URL
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: https?://\d{1,3}(\.\d{1,3}){3}(:\d{1,5})?(/[^\s'"<>{}]{0,200})?
      is: external_ip
    not:
      - regex: /thumb\b
      - regex: 0\.0\.0\.0
      - regex: 192\.168\.
      - regex: 10\.\d{1,3}\.
      - regex: 100\.(6[4-9]|[7-9]\d|[01]\d|12[0-7])\.
      - regex: 172\.(1[6-9]|2\d|3[0-1])\.
      - regex: 127\.\d{1,3}\.
      - regex: 169\.254\.
      - regex: 1\.1\.1\.1
      - regex: 8\.8\.8\.8
      - regex: https?://1\.2\.3\.4(:\d{1,5})?(/[^\s'"<>{}]{0,200})?
      - regex: ^\s*#
    unless:
      - type: text
        substr: split_anaconda_token(

      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  # Percent-encoded numeric host: the same direct-IP destination as
  # http-ip-url-filtered-text, but every byte hex-escaped so naive
  # IP-blacklist matching slides off. Decoded-text search sees through
  # it; this atom records encoded dotted-address syntax.
  - id: percent-encoded-ip-destination
    desc: Percent-encoded dotted IPv4 URL syntax
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: 'https?://((%3[0-9]){1,3}%2[eE]){3}(%3[0-9]){1,3}([:/]|%3[aAfF])'
      exclude_html_comments: true
