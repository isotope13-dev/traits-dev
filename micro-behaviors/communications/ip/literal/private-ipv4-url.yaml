# A hardcoded RFC1918 destination baked into shipped code. Loopback and
# link-local probing is ordinary; a private-LAN HTTP URL as a built-in
# default (telemetry sinks, update checks, license calls) sends the
# machine's traffic to whoever holds that address on the local network.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: private-ipv4-http-url
    desc: Hardcoded private-network HTTP URL
    if:
      type: text
      regex: '://(192\.168|10|172\.(1[6-9]|2\d|3[01]))\.\d+\.\d+'
