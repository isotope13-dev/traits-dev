defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1071.001
  mbc: C0002
  crit: notable
  conf: 0.85
traits:
- id: javascript-external-ipv4-url
  desc: JavaScript contains a raw external-IP URL
  conf: 0.9
  if:
    type: string_literal
    regex: https?://([0-9]{1,3}\.){3}[0-9]{1,3}
    is: external_ip
  not:
  - regex: https?://(8\.8\.[84]\.[84]|1\.1\.1\.1|9\.9\.9\.9)
  - regex: https?://(1\.0\.0\.1|149\.112|208\.67)
  - regex: https?://1\.2\.3\.4\b
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
composite_rules:
- id: js-external-ipv4-url
  desc: External IPv4 URL in extension JavaScript
  conf: 0.85
  all:
  - id: javascript-external-ipv4-url
  - id: metadata/permission/runtime::is-extension
