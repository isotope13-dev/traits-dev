# OpenOCD/GDB, Stratum, and other services share this endpoint spelling.
defaults:
  platforms:
  - unix
  for:
  - shell
  - text
  - python
  - javascript
traits:
- id: loopback-port-3333-reference
  desc: Loopback endpoint references port 3333
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: tcp://(127\.0\.0\.1|localhost):3333|[^/](127\.0\.0\.1|localhost):3333
