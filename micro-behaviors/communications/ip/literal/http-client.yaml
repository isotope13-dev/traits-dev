defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
  attack: T1071.001

composite_rules:
  - id: direct-ip-http-client
    desc: Requests a direct-IP HTTP endpoint
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
    any:
      - id: micro-behaviors/communications/http/request/
      - id: micro-behaviors/communications/http/header/custom::dense-request-header-set
      - id: micro-behaviors/communications/http/download/curl::curl-cmd
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/presence/harness/
      - id: micro-behaviors/crypto/library/blockchain/

  # The same capability when the address never appears next to the scheme.
  # `http-ip-url` needs `http://<dotted quad>` in one string, so a module that
  # assigns `PROBE_HOST = "203.0.113.9"` and requests
  # `f"http://{PROBE_HOST}/..."` matches nothing above -- the destination is
  # still a hardcoded public IP, split across two statements by ordinary
  # constant hoisting. Requiring the f-string URL, the IP-shaped assignment and
  # a public-address literal in the same file reassembles it without accepting
  # any file that merely mentions an address somewhere.
  - id: interpolated-ip-http-client
    desc: Direct-IP HTTP endpoint built from constant
    crit: notable
    conf: 0.9
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/communications/http/url/build::python-fstring-url-host-suffixed-name
      - id: micro-behaviors/communications/ip/assignment::python-ipv4-string-assignment
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
    any:
      - id: micro-behaviors/communications/http/request/
      - id: micro-behaviors/communications/http/download/curl::curl-cmd
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/presence/harness/
      - id: micro-behaviors/crypto/library/blockchain/
