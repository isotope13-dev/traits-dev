defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  - source
  attack: T1071.001
  crit: notable
composite_rules:
- id: direct-ip-http-client
  desc: Direct-IP URL and HTTP client evidence co-occur
  conf: 0.95
  all:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  any:
  - id: micro-behaviors/communications/http/request
  - id: micro-behaviors/communications/http/client/response-body::response-stream-python
  - id: micro-behaviors/communications/http/header/custom::request-header-token-density
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
- id: interpolated-ip-http-client
  desc: Direct-IP HTTP endpoint built from constant
  conf: 0.9
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/communications/url/construction/build-http::python-fstring-url-host-suffixed-name
  - id: micro-behaviors/communications/ip/assignment::python-ipv4-string-assignment
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  any:
  - id: micro-behaviors/communications/http/request
  - id: micro-behaviors/communications/http/client/response-body::response-stream-python
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
