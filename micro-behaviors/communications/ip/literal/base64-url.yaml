defaults:
  platforms: [linux, macos, windows]
  for: [python, shell, elf, macho, pe]
traits:
- id: base64-http-ipv4-url
  desc: Base64-decoded HTTP IPv4 URL
  crit: notable
  conf: 0.85
  if:
    type: encoded
    encoding: base64
    regex: http://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
  unless:
  - id: well-known/tool/offensive/projectdiscovery/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
