# 0200::/7 is the address space used by Yggdrasil. The range alone establishes
# neither Yggdrasil membership nor maliciousness; require tasking at the consumer.
defaults:
  platforms: [unix, windows]
  for: [source, scripts, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: overlay-ipv6-http-url
    desc: HTTP URL in the 0200::/7 IPv6 range
    if:
      type: string_literal
      regex: '(?i)https?://\[0?[23][0-9a-f]{2}:[0-9a-f:]{2,39}\]'

  - id: encoded-overlay-ipv6-http-url
    desc: Decoded HTTP URL in 0200::/7
    for: [python, javascript, typescript, go, csharp, pe, elf, macho]
    if:
      type: encoded
      regex: '(?i)https?://\[0?[23][0-9a-f]{2}:[0-9a-f:]{2,39}\]'
