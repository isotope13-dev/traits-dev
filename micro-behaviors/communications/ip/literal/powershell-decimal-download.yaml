# Unusual address notation near file acquisition; no evasion intent asserted.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-decimal-host-download
    desc: Decimal IPv4 URL near PowerShell file download
    crit: suspicious
    conf: 0.94
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ip/literal::decimal-ip-http-url
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
