defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.9
composite_rules:
- id: local-ip-or-localhost-literal
  desc: Contains a localhost or IP address literal
  crit: component
  any:
  - id: micro-behaviors/communications/ip/literal::localhost-source
  - id: micro-behaviors/communications/ip/literal::loopback-ipv6-literal
  - id: micro-behaviors/communications/ip/literal::ipv4-literal
- id: local-ip-or-localhost-guard
  desc: Host comparison near IP or localhost literal
  crit: notable
  for:
  - javascript
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/ip/literal::local-ip-or-localhost-literal
  - id: micro-behaviors/communications/url/navigation-http::browser-location-host-comparison
