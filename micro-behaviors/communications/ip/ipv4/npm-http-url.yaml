defaults:
  platforms: [unix, windows]
  for: [package.json, pkginfo]
traits:
  - id: preinstall-external-ipv4-url
    desc: External IPv4 URL in preinstall script
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: "https?://(\\d{1,3}\\.){3}\\d{1,3}/"
      is: external_ip
