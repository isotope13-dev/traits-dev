defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, text, data, json]
traits:
  - id: alibaba-metadata-service-address
    desc: References Alibaba metadata IPv4 100.100.100.200
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b100\.100\.100\.200\b'

  - id: metadata-service-link-local-address
    desc: References link-local IPv4 169.254.169.254
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: '169.254.169.254'

