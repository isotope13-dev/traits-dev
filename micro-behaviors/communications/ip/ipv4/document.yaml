# A network endpoint written as a bare address inside a document.
#
# Scoped to documents on purpose. In a binary or a script an IPv4 literal is
# ordinary -- test fixtures, default gateways, RFC examples -- which is why the
# generic form of this is noisy enough to be useless. A spreadsheet is
# different: nothing about presenting numbers to a reader requires an address
# and a port, and an office document that carries one is carrying it for code
# that will connect there. Two samples in the abuse.ch XLM wave shared the same
# `87.12.150.8:38408` across otherwise fully regenerated builds -- the one
# field a per-victim builder cannot randomize, because the operator has to be
# reachable at it.
defaults:
  platforms: [windows, unix]
  for: [oledoc, ooxml, rtf]
  attack: T1071
traits:
  - id: document-ipv4-endpoint-literal
    desc: Document carries an IPv4 address and port
    crit: notable
    conf: 0.9
    if:
      # Deliberately not narrowed to public ranges: a maldoc pointing at
      # 192.168.x is a lateral-movement stager, not a false positive. Stated
      # as notable so that a version string that happens to read this way
      # cannot convict a file on its own.
      type: text
      regex: '\b\d{1,3}(\.\d{1,3}){3}:[0-9]{2,5}\b'
