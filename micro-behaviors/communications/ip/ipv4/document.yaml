# A network endpoint written as a bare address inside a document.
#
# Scoped to documents on purpose. In a binary or a script an IPv4 literal is
# ordinary -- test fixtures, default gateways, RFC examples -- which is why the
# generic form of this is noisy enough to be useless. A spreadsheet is
# different: nothing about presenting numbers to a reader requires an address
# and a port, and an office document that carries one is carrying it for code
# that will connect there. Two samples in the abuse.ch XLM wave shared the same
# `87.12.150.8:38408` across otherwise fully regenerated builds -- the one
# field a per-victim builder cannot randomize, because the operator has to be
# reachable at it.
defaults:
  platforms: [windows, unix]
  for: [oledoc, ooxml, rtf]
  attack: T1071
traits:
  - id: document-ipv4-endpoint-literal
    desc: Literal IPv4:port in document bytes
    crit: notable
    conf: 0.9
    if:
      # Search raw bytes: Office text extraction can render arbitrary binary
      # fields as dotted decimal plus a port, even when those bytes do not
      # contain an address string (for example, numeric drawing data).
      # Deliberately not narrowed to public ranges: a maldoc pointing at
      # 192.168.x is still an endpoint indicator.
      type: raw
      regex: '\b\d{1,3}(\.\d{1,3}){3}:[0-9]{2,5}\b'

  # Several endpoints, the shape of a fallback or C2 list.  Each form needs
  # the endpoints as written characters; standalone dotted values that the
  # extractor renders from binary sockaddr-like fields cannot satisfy them.
  - id: document-ipv4-endpoint-literals-many
    desc: Three literal IPv4:port values in document bytes
    crit: notable
    conf: 0.85
    count_min: 3
    if:
      type: raw
      regex: '\b\d{1,3}(\.\d{1,3}){3}:[0-9]{2,5}\b'
      is: valid_ip

  - id: document-ipv4-endpoint-utf16-literals-many
    desc: Three UTF-16 IPv4:port values in document bytes
    crit: notable
    conf: 0.85
    count_min: 3
    if:
      # Word stores Unicode body text as UTF-16LE, which the extractor does
      # not surface for OLE storage.
      type: raw
      regex: '(\d\x00){1,3}(\.\x00(\d\x00){1,3}){3}:\x00(\d\x00){2,5}'

  - id: document-ipv4-endpoint-run
    desc: One text run lists three IPv4:port values
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)\b((\d{1,3}\.){3}\d{1,3}:\d{2,5}\b.{1,40}?){2}(\d{1,3}\.){3}\d{1,3}:\d{2,5}\b'
      is: valid_ip
