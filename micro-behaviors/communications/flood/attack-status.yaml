defaults:
  platforms: [unix]
  for: [elf]
traits:
  - id: attack-status-banner
    desc: Packet attack or flood status text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(send|launch|start).{0,20}(attack|flood)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
