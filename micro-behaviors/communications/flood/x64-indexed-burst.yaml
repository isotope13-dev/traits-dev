defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
composite_rules:
  - id: native-indexed-datagram-burst
    desc: Indexed socket burst loop and sendto import
    conf: 0.97
    all:
      - id: micro-behaviors/data/control-flow/loop::x64-indexed-handle-burst-loop
      - id: micro-behaviors/communications/socket/create::socket-api
      - id: micro-behaviors/communications/socket/send::sendto-api
