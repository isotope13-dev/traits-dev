defaults:
  platforms: [linux]
  for: [elf]
  arch: [superh]
traits:
  # SH little endian: call send, call sleep(5), read the clock, compare
  # against the deadline, set buffer/length=25/flags=0, branch back.
  # PC-relative buffer displacement varies; no image addresses are pinned.
  # This is probable packet-emission code, not proof of a DDoS objective.
  - id: superh-paced-25-byte-send-loop
    desc: SuperH paced 25-byte send loop
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '0B 4C 09 00 0B 4B 05 E4 0B 4A 09 00 06 38 93 64 ?? D5 19 E6 F4 8D 00 E7'
