defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
traits:
- conf: 0.8
  desc: SYN flood terminology
  id: syn-flood
  if:
    regex: (?i)\bsyn[\s_-]?flood\b
    type: text
  unless:
  - type: text
    regex: (?i)\bprotection_synflood\b
  - type: basename
    exact: pft_synflood.py
  - id: metadata/package/documentation/page::static-html-shell
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
  - id: metadata/package/vendor::bitdefender-ecnet-telemetry
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- conf: 0.8
  desc: UDP flood terminology
  id: udp-flood
  if:
    regex: '[uU][dD][pP][_-]?[fF]lood'
    type: text
  unless:
  - id: metadata/package/vendor::bitdefender-ecnet-telemetry
  - id: metadata/package/documentation/page::static-html-shell
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- conf: 0.8
  desc: HTTP flood terminology
  id: http-flood
  unless:
  - id: metadata/file/naming::generated-attack-map-context
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
  - id: metadata/build/generated::openapi-codegen-python-source-marker
  if:
    regex: \bhttp[_-]?flood\b
    case_insensitive: true
    type: text
- conf: 0.8
  desc: ICMP flood terminology
  id: icmp-flood
  unless:
  - id: well-known/lib/cloud/cloud-sdk::tencentcloud-python-sdk
  - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
  - id: well-known/lib/cloud/tencentcloud-ruby::generated-service-model
  - id: metadata/package/documentation/page::static-html-shell
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  if:
    regex: \bicmp[_-]?flood\b
    case_insensitive: true
    type: text
- conf: 0.8
  desc: Slowloris flood terminology
  id: slowloris-flood
  if:
    regex: (?i)\bslowloris[_-]?flood\b
    type: text
  unless:
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
- conf: 0.8
  desc: POST flood terminology
  id: post-flood
  if:
    regex: (?i)\bpost[\s-]+flood\b
    type: text
  unless:
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
- conf: 0.8
  desc: GET flood terminology
  id: get-flood
  if:
    regex: (?i)\bget[_-]?flood\b
    type: text
  unless:
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
- conf: 0.8
  desc: DNS flood terminology
  id: dns-flood
  if:
    regex: (?i)\bdns[_-]?flood\b
    type: text
  unless:
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
- conf: 0.85
  desc: RTP flood terminology
  id: rtp-flood
  if:
    regex: (?i)\brtp[_-]?flood\b
    type: text
  unless:
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
- conf: 0.85
  desc: SIP INVITE flood terminology
  id: invite-flood
  if:
    regex: (?i)\binvite[_-]?flood\b
    type: text
  unless:
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
- conf: 0.8
  desc: Memcached flood terminology
  id: memcached-flood
  if:
    regex: (?i)\bmemcached[_-]?flood\b
    type: text
  unless:
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
- conf: 0.8
  desc: ACK flood terminology
  id: ack-flood
  if:
    regex: (?i)\back[_-]?flood\b
    type: text
  unless:
  - id: well-known/lib/cloud/tencentcloud-dotnet::tencentcloud-dotnet-sdk
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
- any:
  - id: micro-behaviors/communications/flood::syn-flood
  - id: micro-behaviors/communications/flood::udp-flood
  - id: micro-behaviors/communications/flood::http-flood
  - id: micro-behaviors/communications/flood::icmp-flood
  - id: micro-behaviors/communications/flood::slowloris-flood
  - id: micro-behaviors/communications/flood::post-flood
  - id: micro-behaviors/communications/flood::get-flood
  - id: micro-behaviors/communications/flood::dns-flood
  - id: micro-behaviors/communications/flood::memcached-flood
  - id: micro-behaviors/communications/flood::ack-flood
  - id: micro-behaviors/communications/flood::rtp-flood
  - id: micro-behaviors/communications/flood::invite-flood
  conf: 0.8
  desc: References specific network flood categories
  id: flood-type-terminology
  scope: file
  unless:
  - id: well-known/lib/cloud/
  - id: well-known/app/infrastructure/cloud-custodian::shield-ddos-metrics-filter-context
  - id: metadata/package/tooling::libbcc-library
  - id: well-known/app/infrastructure/ansible::ansible-defensive-dos-module-context
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-ddos-protection-context
  - id: well-known/tool/offensive/iotsploit::iotsploit-distribution
