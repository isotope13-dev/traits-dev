defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  crit: notable
traits:
  # sendto sockaddr length 16 / MSG_NOSIGNAL, followed by either a direct
  # backward branch or a pacing call and unconditional backward branch.
  # Call targets, addresses, stack slots and branch distances may vary.
  - id: x64-packet-send-pacing-loop
    desc: Packet-send loop with optional pacing call
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '41 B9 10 00 00 00 B9 00 40 00 00 [20-55] E8 ?? ?? ?? ?? 83 7C 24 ?? 00 0F 84 ?? ?? FF FF 8B 7C 24 ?? E8 ?? ?? ?? ?? E9 ?? FE FF FF'
composite_rules:
  - id: native-packet-send-loop
    desc: Repeated packet emission and sendto syscall
    conf: 0.97
    all:
      - id: x64-packet-send-pacing-loop
      - id: micro-behaviors/communications/socket/send::syscall-sendto
