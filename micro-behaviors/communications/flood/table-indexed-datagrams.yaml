defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98

traits:
  # Validated against the send() callers, not just the static libc wrappers.
  # Both variants select a pointer/length pair from a packet table, send it
  # with MSG_NOSIGNAL to successive connected sockets, and repeat the sweep.
  # Absolute table addresses and relative call destinations are unpinned.
  - id: x64-table-indexed-datagram-loop
    desc: x64 table-indexed repeated datagram send loop
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '89 C1 BE 0D 00 00 00 41 8B 3C 9F F7 E5 48 FF C3 C1 EA 02 0F AF D6 29 D1 48 63 C1 B9 00 40 00 00 48 C1 E0 04 48 63 90 ?? ?? ?? ?? 48 8B B0 ?? ?? ?? ?? E8 ?? ?? ?? ?? 4C 39 E3 75 ?? 45 85 ED 7E ??'
  - id: arm-table-indexed-datagram-loop
    desc: ARM table-indexed repeated datagram send loop
    arch: [arm]
    if:
      type: hex
      section: .text
      pattern: '93 10 82 E0 22 21 A0 E1 02 32 A0 E1 02 31 43 E0 02 30 83 E0 00 20 63 E0 82 01 A0 E1 05 00 80 E0 82 11 95 E7 01 39 A0 E3 04 20 90 E5 04 01 98 E7 ?? ?? ?? EB 01 40 84 E2 07 00 54 E1 ?? ?? ?? BA 00 40 A0 E3 ?? ?? ?? EA'

composite_rules:
  - id: table-indexed-datagram-loop
    desc: Repeated socket sends from a packet table
    any:
      - id: x64-table-indexed-datagram-loop
      - id: arm-table-indexed-datagram-loop
      - id: i386-table-indexed-datagram-loop
