defaults:
  for: [elf]
  platforms: [linux]
  crit: suspicious
traits:
  - id: ovh-tcp-function
    desc: OVH TCP attack function name
    if: {type: symbol, kind: function, exact: ovh_tcp}
  - id: ovh-udp-function
    desc: OVH UDP attack function name
    if: {type: symbol, kind: function, exact: ovh_udp}
composite_rules:
  - id: ovh-tcp-udp-function-set
    desc: OVH TCP and UDP attack function names
    all:
      - id: ovh-tcp-function
      - id: ovh-udp-function
