defaults:
  platforms:
  - unix
  for:
  - elf
  crit: notable
  conf: 0.92

traits:
  - id: transport-attack-function-name
    desc: Transport attack-named function
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_(syn|ack|tcp|udp)$'
  - id: application-attack-function-name
    desc: Application attack-named function
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_(http|dns|tls|quic)$'
  - id: protocol-attack-handler-symbol
    desc: Protocol-named attack handler function
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_(tcp|udp|gre|http)_[a-z0-9_]+$'
  - id: tcp-attack-handler-symbol-set-member
    desc: Three or more TCP-named attack handlers
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_tcp_[a-z0-9_]+$'
    count_min: 3
  - id: udp-attack-handler-symbol-set-member
    desc: Three or more UDP-named attack handlers
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_udp_[a-z0-9_]+$'
    count_min: 3
  - id: gre-attack-handler-symbol-set-member
    desc: Three or more GRE-named attack handlers
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_gre_[a-z0-9_]+$'
    count_min: 3
  - id: http-attack-handler-symbol-set-member
    desc: Three or more HTTP-named attack handlers
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      kind: function
      regex: '(?i)^attack_http_[a-z0-9_]+$'
    count_min: 3
  - id: flood-function-symbol
    desc: Symbol names a flood or DDoS worker
    crit: notable
    conf: 0.9
    if:
      type: symbol
      # TLS libraries expose DoS prevention callbacks, not attack workers.
      regex: '(?i)(?s:.*)(^|_)(flood|ddos|dos)(_|$)(?s:.*)'
    not:
      - regex: '(?i)(dos|ddos)_(protection|prevention|mitigation|detect)'

composite_rules:
  # Each protocol counts its own handlers, so a count does not repeat matches
  # across an alternation. Any one protocol reaching three handlers fires.
  - id: protocol-attack-handler-symbol-set
    desc: Three or more protocol-named attack handlers
    crit: suspicious
    conf: 0.93
    any:
      - id: tcp-attack-handler-symbol-set-member
      - id: udp-attack-handler-symbol-set-member
      - id: gre-attack-handler-symbol-set-member
      - id: http-attack-handler-symbol-set-member
  - id: protocol-attack-function-name-set
    desc: Transport and application attack-named functions
    all:
      - id: transport-attack-function-name
      - id: application-attack-function-name