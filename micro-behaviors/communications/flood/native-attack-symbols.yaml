defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  # Function names and imports are independent references, not proven flow.
  - id: protocol-attack-names-with-network-apis
    desc: Attack-named functions with socket and send APIs
    crit: suspicious
    conf: 0.91
    all:
      - id: metadata/binary/symbols/name/token::protocol-attack-function-name-set
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/send::sendto-symbol
