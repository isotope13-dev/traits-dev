defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
traits:
  # r0=socket, r1=packet, r2=length, r3=MSG_DONTWAIT|MSG_NOSIGNAL,
  # stack arguments=target sockaddr and length 16. After the call, increment
  # the target index and branch backwards to the packet-construction sweep.
  # Relative calls, branch destinations and stack slots are not pinned.
  - id: arm-target-packet-send-loop
    desc: ARM repeated target packet-send call layout
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '01 39 A0 E3 10 C0 A0 E3 06 10 A0 E1 40 30 83 E2 ?? 00 9D E5 ?? 20 9D E5 20 10 8D E8 ?? ?? ?? EB 01 80 88 E2 ?? FF FF EA'
