defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
traits:
  # GCC ARM layout: target table uses 24-byte records (index*32-index*8).
  # sendto receives the packet, MSG_NOSIGNAL, and sockaddr length 16. The
  # target index increments after the call and a signed branch repeats it.
  # Calls and branch destinations are relocation-independent. A packet
  # generator can legitimately contain this layout; attack context is separate.
  - id: arm-indexed-target-send-loop
    desc: ARM indexed target packet-send loop
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '83 C2 A0 E1 22 28 A0 E1 83 C1 4C E0 0A C0 8C E0 [16] 01 39 A0 E3 ?? 00 9D E5 0B 20 A0 E1 10 40 A0 E3 00 C0 8D E5 04 40 8D E5 ?? ?? ?? EB ?? 30 9D E5 01 00 83 E2 09 00 50 E1 ?? 00 8D E5 ?? FF FF BA'

  # r0=socket, r1=packet, r2=length, r3=MSG_DONTWAIT|MSG_NOSIGNAL,
  # stack arguments=target sockaddr and length 16. After the call, increment
  # the target index and branch backwards to the packet-construction sweep.
  # Relative calls, branch destinations and stack slots are not pinned.
  - id: arm-target-packet-send-loop
    desc: ARM repeated target packet-send call layout
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '01 39 A0 E3 10 C0 A0 E3 06 10 A0 E1 40 30 83 E2 ?? 00 9D E5 ?? 20 9D E5 20 10 8D E8 ?? ?? ?? EB 01 80 88 E2 ?? FF FF EA'
