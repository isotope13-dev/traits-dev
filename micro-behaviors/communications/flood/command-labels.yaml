  # Keep these as separate atoms so the cluster below requires distinct
  # attack-mode labels.  A count_min on one alternation counts repeated
  # occurrences, so a normal networking utility's repeated BROADCAST help
  # text was previously enough to look like an IoT bot.
defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: udp-flood-attack-label
    desc: UDP_FLOOD attack command label
    crit: notable
    conf: 0.9
    if:
      type: text
      word: UDP_FLOOD
  - id: syn-bypass-attack-label
    desc: SYN_BYPASS attack command label
    crit: notable
    conf: 0.9
    if:
      type: text
      word: SYN_BYPASS
  - id: http2-flood-attack-label
    desc: HTTP2_FLOOD attack command label
    crit: notable
    conf: 0.9
    if:
      type: text
      word: HTTP2_FLOOD
  - id: https-flood-attack-label
    desc: HTTPS_FLOOD attack command label
    crit: notable
    conf: 0.9
    if:
      type: text
      word: HTTPS_FLOOD

