# Bot flood-method names stored as bare strings in a dispatch table. The
# names are distinctive enough that a three-name catalog is a capability
# clue, but not an attack by itself; objectives add the stager context.
defaults:
  platforms: [linux]
  for: [elf]
  size_min: 512
  attack: T1498.001
traits:
  - id: flood-method-udprandom
    desc: udprandom flood method name string
    crit: notable
    conf: 0.9
    if: {type: text, exact: udprandom}
  - id: flood-method-tcplegit
    desc: tcplegit flood method name string
    crit: notable
    conf: 0.9
    if: {type: text, exact: tcplegit}
  - id: flood-method-greip
    desc: greip flood method name string
    crit: notable
    conf: 0.9
    if: {type: text, exact: greip}
  - id: flood-method-greeth
    desc: greeth flood method name string
    crit: notable
    conf: 0.9
    if: {type: text, exact: greeth}
  - id: flood-method-tcpstomp
    desc: tcpstomp flood method name string
    crit: notable
    conf: 0.9
    if: {type: text, exact: tcpstomp}
composite_rules:
  - id: flood-method-name-table
    desc: Dispatch table lists three or more flood method names
    crit: notable
    conf: 0.93
    needs: 3
    any:
      - id: flood-method-udprandom
      - id: flood-method-tcplegit
      - id: flood-method-greip
      - id: flood-method-greeth
      - id: flood-method-tcpstomp
