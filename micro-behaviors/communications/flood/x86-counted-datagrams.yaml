defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-counted-datagram-burst-stop-loop
    desc: x86 counted datagram bursts with stop flag
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_counted_datagram_burst_stop_loop {
          strings:
            $burst = { 8B 2D [4] BE ?? 00 00 00 8D 44 24 ?? 6A 10 50 6A 00
                       8D 8C 24 [4] 53 51 57 FF D5 4E 75 E8 6A ?? FF 15 [4]
                       83 3D [4] 01 75 D2 }
          condition:
            for any s in pe.sections : (
              s.name == ".text" and
              for any b in (1..#burst) : (
                @burst[b] >= s.raw_data_offset and
                @burst[b]+!burst[b] <= s.raw_data_offset+s.raw_data_size and
                uint8(@burst[b]+7) >= 2 and
                uint32(@burst[b]+2) == pe.image_base+pe.import_rva("WS2_32.dll",20) and
                uint32(@burst[b]+39) == pe.image_base+pe.import_rva("KERNEL32.dll","Sleep")
              )
            )
        }
