defaults:
  platforms: [linux]
  for: [elf]

traits:
  # Tight packet-send flood loop on ARCompact: flags=0 (mov_s r3, 0),
  # packet length (mov_s r2, imm), buffer setup, delayed bl.d send(),
  # socket reload into r0, unconditional short backward b.d with mov_s r3, 0.
  - id: arc-tight-send-loop-bytes
    desc: ARC tight send flood loop bytes
    crit: baseline
    conf: 0.92
    if:
      type: hex
      section: .text
      pattern: '00 DB ?? DA ?? ?? ?? ?? ?? ?? ?? 70 F? 07 ?? FF 00 DB'

composite_rules:
  - id: arc-tight-send-flood-loop
    desc: ARC tight packet-send flood loop
    crit: notable
    conf: 0.96
    all:
      - id: metadata/arch/iot::arc-compact
      - id: arc-tight-send-loop-bytes
