defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # Six-argument sendto shape with sockaddr length 16, a twelve-call burst,
  # an indirect delay, and an unconditional return to the global stop check.
  - id: x86-twelve-datagram-burst-loop
    desc: x86 twelve-datagram bursts repeat until stopped
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .data
      pattern: '6A 0C 5E 8D 45 ?? 6A 10 50 53 FF 35 [4] 68 [4] FF 75 ?? FF 15 [4] 4E 75 ?? FF 35 [4] FF 15 [4] EB ??'
  - id: x86-resource-twelve-datagram-burst-loop
    desc: Resource x86 repeated twelve-datagram bursts
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .rsrc
      pattern: '6A 0C 5E 8D 45 ?? 6A 10 50 53 FF 35 [4] 68 [4] FF 75 ?? FF 15 [4] 4E 75 ?? FF 35 [4] FF 15 [4] EB ??'

composite_rules:
  - id: x86-resource-raw-udp-burst-code
    desc: Resource contains nearby raw UDP and repeated datagram-burst code
    crit: notable
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/socket/raw::x86-resource-raw-udp-arguments
      - id: x86-resource-twelve-datagram-burst-loop
