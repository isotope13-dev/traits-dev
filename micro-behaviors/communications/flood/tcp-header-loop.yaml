# Compiled layouts verified in GCC static Linux x86-64, i386 and big-endian
# PowerPC specimens. Each requires packet-header construction, send arguments
# and a backward loop guard. Calls/addresses/stack slots are not pinned.
# This is code-layout coverage, not a claim to recognize every TCP sender.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.97
traits:
  - id: x64-tcp-header-repeat-send-layout
    desc: x86-64 TCP packet construction and send loop
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'C6 44 24 ?? 45 [40-80] C6 44 24 ?? 06 [140-220] BA ?? 00 00 00 [0-16] 41 B9 10 00 00 00 [0-20] E8 ?? ?? ?? ?? 48 85 C0 78 ?? 8B 05 ?? ?? ?? ?? 85 C0 0F 84 ?? ?? FF FF'
  - id: i386-tcp-header-repeat-send-layout
    desc: i386 TCP packet construction and send loop
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: 'C6 44 24 ?? 45 [20-64] C6 44 24 ?? 06 [180-260] 6A 10 FF 74 24 ?? 6A 00 6A ?? FF 74 24 ?? FF 74 24 ?? E8 ?? ?? ?? ?? 83 C4 20 85 C0 78 ?? 8B 44 24 ?? 8B 00 85 C0 0F 84 ?? ?? FF FF'
  - id: powerpc-tcp-header-repeat-send-layout
    desc: PowerPC TCP packet construction and send loop
    arch: [powerpc]
    if:
      type: hex
      section: .text
      pattern: '3A A0 00 45 [0-12] 3A C0 00 ?? [0-12] 3A E0 00 06 [280-360] 39 00 00 10 38 E1 ?? ?? 7C 6A 1B 78 38 81 ?? ?? 92 61 ?? ?? 7F A3 EB 78 38 C0 00 00 B1 41 ?? ?? 38 A0 00 ?? B1 21 ?? ?? 48 ?? ?? ?? 2C 03 00 00 41 80 00 ?? 81 3C 00 00 2C 09 00 00 41 82 F? ??'
composite_rules:
  - id: native-tcp-header-repeat-send-layout
    desc: Builds TCP headers in a repeated packet-send loop
    any:
      - id: x64-tcp-header-repeat-send-layout
      - id: i386-tcp-header-repeat-send-layout
      - id: powerpc-tcp-header-repeat-send-layout
