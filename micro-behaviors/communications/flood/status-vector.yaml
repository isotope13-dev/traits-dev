defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
traits:
  - id: flood-vector-target-start-log
    desc: Flood vector target start log
    if:
      type: text
      substr: '[flood] START vector=%u duration=%u targets=%u'
  - id: flood-udp-send-failure-log
    desc: UDP flood send failure log
    if:
      type: text
      substr: '[flood] vec_udp: udp sendto failed'
