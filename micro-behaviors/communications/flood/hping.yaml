defaults:
  platforms: [unix, windows]
  for: [python, shell]
traits:
  - id: hping3-flood-command
    desc: hping3 command enables packet flooding
    crit: notable
    conf: 0.98
    mbc: B0042
    attack: T1498.001
    if:
      type: text
      regex: '(?i)\bhping3\b[^\n]{0,240}\s--flood\b'
    unless:
      - id: well-known/tool/offensive/iotsploit::iotsploit-distribution
composite_rules:
  - id: hping3-spoofed-flood-command
    desc: hping3 command combines flooding with randomized source addresses
    crit: suspicious
    conf: 0.98
    all:
      - id: hping3-flood-command
      - id: micro-behaviors/communications/ip/spoof::hping3-random-source-option
    unless:
      - id: well-known/tool/offensive/iotsploit::iotsploit-distribution
