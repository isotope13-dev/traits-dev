defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: traceroute
    desc: traceroute command
    if:
      type: text
      regex: (^|\s)traceroute(\s|$)
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: tracepath
    desc: tracepath command
    for: [shell, python, javascript, ruby, perl]
    if:
      type: symbol
      kind: call
      exact: tracepath
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: mtr
    desc: mtr network diagnostic
    for: [scripts]
    if:
      type: text
      # A one-character argument is too weak for a raw binary scan: the
      # compressed overlay in an installer produced the coincidental `mtr M`.
      regex: (?i)(^|[\s"'`/\\])(/usr/(s)?bin/)?mtr(\.exe)?\s+(-[A-Za-z]|[A-Za-z0-9_.:-]{2,})
    unless:
      - id: metadata/package/vendor::bitdefender-ecnet-telemetry
      - id: well-known/lib/network/public-suffix-list::public-suffix-list-content
      - id: metadata/file/format/source-map::sourcemap-sources-content
      # MathML table elements (`mtr`) are not the mtr network diagnostic.
      - id: well-known/lib/ai/mathjax::mathjax-api-access
  - id: mtr-binary-command
    desc: Embedded mtr command with arguments
    for: [binaries]
    if:
      type: text
      # A binary string must begin a command, or delimit one explicitly.
      # Whitespace inside shuffled resource prose is not a command boundary.
      # Bare short host tokens are ambiguous in binary data; require a flag,
      # an address/domain-shaped target, or localhost. Scripts retain them.
      regex: '(^|["''`;|&])\s*(/\S+/)?mtr(\.exe)?\s+(-[a-z]|\S+[.:][\w.:-]+|localhost)'
      case_insensitive: true
    unless:
      - id: metadata/package/vendor::bitdefender-ecnet-telemetry
      - id: well-known/lib/network/public-suffix-list::public-suffix-list-content
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/lib/ai/mathjax::mathjax-api-access
  - id: hping
    desc: hping packet tool
    if:
      type: text
      word: hping
