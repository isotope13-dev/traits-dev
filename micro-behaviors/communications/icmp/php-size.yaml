defaults:
  platforms: [unix]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: php-icmp-high-nibble-call
    desc: Passes high byte nibble to ICMP
    if:
      type: text
      exclude_comments: true
      regex: '(?i)icmp_?nibble\s*\([^,\r\n]{1,80},\s*ord\(\$\w+\)\s*>>\s*4\b'
  - id: php-icmp-low-nibble-call
    desc: Passes low byte nibble to ICMP
    if:
      type: text
      exclude_comments: true
      regex: '(?i)icmp_?nibble\s*\([^,\r\n]{1,80},\s*ord\(\$\w+\)\s*&\s*15\b'
  - id: php-ping-packet-size-command
    desc: PHP ping uses computed packet size
    if:
      type: text
      exclude_comments: true
      regex: 'proc_open\s*\(\s*[''"]ping[^''"\r\n]{0,70}-s\s*[''"]\s*\.'
composite_rules:
  - id: php-paired-icmp-byte-nibbles
    desc: Paired ICMP calls receive high and low byte nibbles
    near_lines: 4
    all:
      - id: php-icmp-high-nibble-call
      - id: php-icmp-low-nibble-call
  - id: php-ping-size-nibble-channel
    desc: PHP computed ping size near low-nibble arithmetic
    near_bytes: 180
    all:
      - id: php-ping-packet-size-command
      - id: micro-behaviors/data/bitwise/mask::php-low-nibble-offset
