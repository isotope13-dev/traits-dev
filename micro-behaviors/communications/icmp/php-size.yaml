defaults:
  platforms: [unix]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: php-ping-packet-size-command
    desc: PHP ping uses computed packet size
    if:
      type: text
      exclude_comments: true
      regex: 'proc_open\s*\(\s*[''"]ping[^''"\r\n]{0,70}-s\s*[''"]\s*\.'
composite_rules:
  - id: php-ping-size-nibble-channel
    desc: PHP computed ping size near low-nibble arithmetic
    near_bytes: 180
    all:
      - id: php-ping-packet-size-command
      - id: micro-behaviors/data/bitwise/mask::php-low-nibble-offset
