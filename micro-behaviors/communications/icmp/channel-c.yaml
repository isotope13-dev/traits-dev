defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: c-icmp-helper-call
    desc: C source invokes an ICMP channel helper
    if:
      type: text
      regex: '\bch_icmp_(nibble|byte_ip)\s*\('
    unless:
      - type: path
        regex: '[/\\]channels[.]c$'

  - id: c-icmp-byte-identity-argument
    desc: Indexed character byte passed to ICMP target
    conf: 0.94
    if:
      type: text
      regex: '(?i)ch_icmp_byte_ip.{0,80}unsigned char.{0,20}\w+\[\w+\]'

  - id: zig-icmp-helper-call
    desc: Zig source invokes an ICMP channel helper
    for: [zig]
    if:
      type: symbol
      kind: call
      regex: '^ch[.]icmp(ByteIp|Nibble)$'
    unless:
      - type: path
        regex: '[/\\]channels[.]zig$'

  - id: source-icmp-helper-call
    desc: Source invokes an ICMP data channel helper
    for: [csharp, java, kotlin, elixir, ruby, swift, zig, rust]
    if:
      type: text
      regex: '(?i)\b(icmp|Icmp)[_-]?(Byte[_-]?Ip|Nibble)\s*[(]|\bicmp_nibble\s*[(]'
    unless:
      - type: path
        regex: '[/\\](channels|Channels)[.](c|cs|java|kt|ex|rb|swift|zig)$'

  - id: rust-ping-size-nibble
    desc: Rust encodes nibble in ping size
    for: [rust]
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)Command::new\(\"ping\"\).{0,200}\"-s\".{0,80}&\s*15'
