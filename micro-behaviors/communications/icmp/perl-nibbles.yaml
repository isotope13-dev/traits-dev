defaults:
  platforms:
  - unix
  - windows
  for:
  - perl
  crit: notable
  conf: 0.98
traits:
- id: perl-ipv4-prefix-helper-call
  desc: Perl ICMP helper receives IPv4 prefix
  if:
    type: symbol
    kind: call
    regex: '(?i)icmp'
    args:
    - index: 0
      kind: string
      regex: '^([0-9]{1,3}\.){3}$'
    - index: 1
      kind: expression
- id: perl-ping-destination-byte
  desc: Perl builds ping destination from scalars
  if:
    type: text
    regex: exec\s+["']ping["'],[^;]{0,100}"\$\w+\$\w+"
