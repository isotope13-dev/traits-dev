defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: ping
    desc: References the ping network-reachability command
    not:
      - regex: \bping(\s+-\w+\s+\S+){1,3}\s+127\.
      - regex: \bping(\s+-\w+\s+\S+){1,3}\s+localhost\b
    if:
      type: text
      regex: \bping(\s+-\w+\s+\S+){1,3}\s+\S+
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: ping6
    desc: Invokes the ping6 IPv6 command
    for: [shell, scripts, binaries]
    if:
      type: text
      regex: '(?m)(^|[;&|][ \t]*)[ \t]*ping6[ \t]+[-A-Za-z0-9:.\[\]]+'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: python-ping6-argument
    desc: Python passes ping6 as a process argument
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: string_literal
      exact: ping6
  - id: python-ping-argv
    desc: Python subprocess passes ping as first argument
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: tree-sitter
      language: python
      kind: call
      regex: '(?is)\bsubprocess\.(call|run|Popen)\s*\(\s*\[\s*["'']ping["''](\s*[,]])'
  - id: powershell-test-connection
    desc: PowerShell tests network reachability
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?im)(^|[;&|=]\s*)Test-Connection\b'
  - id: python-ping-shell-call
    desc: Python shell call runs ping
    crit: notable
    conf: 0.92
    for: [python, pyc]
    if:
      type: text
      regex: 'os\.(system|popen)\([^)]{0,100}\bping\b'
  - id: python-ping-process-call
    desc: Python subprocess call runs ping
    crit: notable
    conf: 0.92
    for: [python, pyc]
    if:
      type: text
      regex: 'subprocess\.(call|run|Popen)\([^)]{0,100}\bping\b'
  - id: python-ping-shell-flag
    desc: Python shell command includes ping flags
    crit: notable
    conf: 0.9
    for: [python, pyc]
    if:
      type: text
      regex: '[''"`]ping\s+-'
  - id: python-large-ping-payload
    desc: Python ping uses maximum payload
    crit: notable
    conf: 0.94
    for: [python, pyc]
    if:
      type: text
      regex: '(?i)\bping\b[^\n]{0,120}\s-s\s*65500\b'
  - id: python-background-ping
    desc: Python backgrounds a ping command
    crit: notable
    conf: 0.92
    for: [python, pyc]
    if:
      type: text
      regex: '(run|call|Popen|system)\([^)]{0,80}ping\s+-[^&\n]{0,80}&'
  - id: python-throttled-ping-loop
    desc: Python ping loop includes interval pacing
    crit: component
    conf: 0.92
    for: [python, pyc]
    if:
      type: text
      regex: '(?is)\bwhile\b.{0,900}\bping\b.{0,600}(sleep\s*\(|wait\s*\(|\bdeadline\b)'
  - id: fping
    desc: fping fast ping
    if:
      type: text
      word: fping
  - id: icmp-create-file-api
    desc: Open a native Windows ICMP handle
    crit: notable
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    if:
      type: symbol
      exact: IcmpCreateFile
  - id: icmp-echo-api
    desc: Send a native Windows ICMP echo request
    crit: notable
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    if:
      type: import
      exact: IcmpSendEcho

composite_rules:
  - id: python-ping-process-launch
    desc: Python launches a ping process
    crit: notable
    conf: 0.92
    for: [python, pyc]
    any:
      - id: python-ping-argv
      - id: python-ping-shell-call
      - id: python-ping-process-call
      - id: python-ping-shell-flag
