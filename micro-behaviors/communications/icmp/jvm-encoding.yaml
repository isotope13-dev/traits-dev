defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.98
traits:
  - id: jvm-ping-command-token
    desc: JVM constant pool contains ping command
    if:
      type: value
      path: class.strings[*]
      exact: ping
  - id: jvm-nibble-adds-packet-length
    desc: JVM nibble adds to packet-size argv
    if:
      type: hex
      # 64 + (local int & 15), converted to text, stored in argv[6].
      pattern: '59 10 06 10 40 1B 10 0F 7E 60 B8 ?? ?? 53'
  - id: jvm-byte-appends-ping-destination
    desc: JVM byte appends to destination argv
    if:
      type: hex
      # Reject <=0 and >=255, then append the int to a caller string.
      pattern: '1B 9E ?? ?? 1B 11 00 FF A2 [41] 2A B6 ?? ?? 1B B6 ?? ?? B6 ?? ?? 53 B8'
composite_rules:
  - id: jvm-ping-nibble-size-channel
    desc: JVM encodes a nibble in ping packet size
    all:
      - id: jvm-ping-command-token
      - id: jvm-nibble-adds-packet-length
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
  - id: jvm-ping-destination-byte-channel
    desc: JVM encodes a byte in ping destination
    all:
      - id: jvm-ping-command-token
      - id: jvm-byte-appends-ping-destination
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
