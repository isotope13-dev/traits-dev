defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.98
traits:
  - id: jvm-ping-command-token
    desc: JVM constant pool contains ping command
    if:
      type: value
      path: class.strings[*]
      exact: ping
  - id: jvm-nibble-adds-packet-length
    desc: JVM nibble adds to packet-size argv
    if:
      type: hex
      # 64 + (local int & 15), converted to text, stored in argv[6].
      pattern: '59 10 06 10 40 1B 10 0F 7E 60 B8 ?? ?? 53'
  - id: jvm-byte-appends-ping-destination
    desc: JVM byte appends to destination argv
    if:
      type: hex
      # Reject <=0 and >=255, then append the int to a caller string.
      pattern: '1B 9E ?? ?? 1B 11 00 FF A2 [41] 2A B6 ?? ?? 1B B6 ?? ?? B6 ?? ?? 53 B8'
  - id: kotlin-ping-size-argument
    desc: Kotlin ping command sets packet size
    crit: notable
    conf: 0.98
    for: [kotlin]
    if:
      type: text
      regex: 'run\s*\(\s*"ping"[^\r\n]{0,100}"-s"'
  - id: kotlin-nibble-size-expression
    desc: Kotlin masks a nibble into ping size
    crit: notable
    conf: 0.98
    for: [kotlin]
    if:
      type: text
      regex: '64\s*\+\s*\(\w+\s+and\s+15\)'
  - id: kotlin-ping-byte-destination-argument
    desc: Kotlin ping appends a byte to target
    crit: notable
    conf: 0.98
    for: [kotlin]
    if:
      type: text
      regex: 'run\s*\(\s*"ping"[^\r\n]{0,100}"\$\w+\$\w+"'
  - id: kotlin-bounded-ping-byte
    desc: Kotlin bounds a ping target byte
    crit: notable
    conf: 0.98
    for: [kotlin]
    if:
      type: text
      regex: 'if\s*\(\s*\w+\s+in\s+1\.\.254\s*\)'
  - id: php-ping-command-reference
    desc: PHP proc_open command references ping
    crit: notable
    conf: 0.97
    for: [php]
    if:
      type: text
      regex: '(?is)proc_open\s*\(\s*[''"][^''"]{0,120}\bping\b'
  - id: php-ping-target-concatenates-values
    desc: PHP ping target concatenates two values
    crit: notable
    conf: 0.97
    for: [php]
    if:
      type: text
      regex: '(?is)escapeshellarg\s*\(\s*\$[A-Za-z_]\w*\s*\.\s*\$[A-Za-z_]\w*'
  - id: php-bounds-ping-target-byte
    desc: Bounds a ping target byte value
    crit: notable
    conf: 0.97
    for: [php]
    if:
      type: text
      regex: '(?is)if\s*\(\s*\$[A-Za-z_]\w*\s*>\s*0\s*&&\s*\$[A-Za-z_]\w*\s*<\s*255\s*\)'
composite_rules:
  - id: kotlin-ping-size-nibble-helper
    desc: Kotlin ping encodes nibble in size
    crit: notable
    conf: 0.98
    for: [kotlin]
    near_lines: 12
    all:
      - id: kotlin-ping-size-argument
      - id: kotlin-nibble-size-expression
  - id: kotlin-ping-destination-byte-helper
    desc: Kotlin ping encodes byte in destination
    crit: notable
    conf: 0.98
    for: [kotlin]
    near_lines: 12
    all:
      - id: kotlin-ping-byte-destination-argument
      - id: kotlin-bounded-ping-byte
  - id: php-ping-byte-destination-helper
    desc: PHP appends a byte to ping target
    crit: notable
    conf: 0.98
    for: [php]
    near_lines: 16
    all:
      - id: php-ping-command-reference
      - id: php-ping-target-concatenates-values
      - id: php-bounds-ping-target-byte

  - id: jvm-ping-nibble-size-channel
    desc: JVM encodes a nibble in ping packet size
    all:
      - id: jvm-ping-command-token
      - id: jvm-nibble-adds-packet-length
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
  - id: jvm-ping-destination-byte-channel
    desc: JVM encodes a byte in ping destination
    all:
      - id: jvm-ping-command-token
      - id: jvm-byte-appends-ping-destination
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
