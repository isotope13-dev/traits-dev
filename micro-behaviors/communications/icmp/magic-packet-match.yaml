# A packet filter that recognises one specific ICMP type, code (and
# optionally id) combination: the wake-up check of a magic-packet backdoor.
defaults:
  platforms: [unix]
  for: [c]
  conf: 0.88

traits:
  - id: icmp-type-and-code-magic-compare
    desc: Compares ICMP type and code to constants
    crit: notable
    if:
      type: text
      regex: '\bicmp_type\s*==\s*[A-Z_0-9x]+\s*&&\s*[\w>.-]{0,40}\bicmp_code\s*==\s*[A-Z_0-9x]+'
