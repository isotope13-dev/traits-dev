defaults:
  platforms:
    - unix
    - windows
  for: [c, go, python, pe, elf]
traits:
  - id: icmp-rcv
    desc: ICMP receive name reference
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: icmp_rcv
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
composite_rules:
  - id: icmp-marker
    desc: ICMP packet handling marker
    any:
      - id: micro-behaviors/communications/ip/construct::icmp-header-struct
      - id: micro-behaviors/communications/icmp::icmp-rcv
