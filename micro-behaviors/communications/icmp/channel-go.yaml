defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.94

traits:
  - id: icmp-channel-constructor
    desc: Go constructs an ICMP transport channel
    if:
      type: symbol
      kind: call
      exact: newICMPChannel

  - id: go-ping-destination-byte
    desc: Go appends integer to ping target
    conf: 0.96
    if:
      type: text
      regex: '(?is)exec\.Command\s*\(\s*"ping"[\s\S]{0,240}\+\s*strconv\.Itoa\s*\(\s*int\s*\('

  - id: go-ping-size-nibble
    desc: Go derives ping size from nibble
    conf: 0.97
    if:
      type: text
      regex: '(?is)strconv\.Itoa\s*\(\s*\d+\s*\+\s*int\s*\(\s*\w+\s*&\s*(15|0x0f)'

  - id: go-two-arg-call-high-nibble
    desc: Go passes high nibble with string target
    if:
      type: text
      regex: '(?is)\w+(\.\w+)?\s*\(\s*["''][^"'']{1,40}["'']\s*,\s*\w+\s*>>\s*4'

  - id: go-two-arg-call-low-nibble
    desc: Go passes low nibble with string target
    if:
      type: text
      regex: '(?is)\w+(\.\w+)?\s*\(\s*["''][^"'']{1,40}["'']\s*,\s*\w+\s*&\s*(15|0x0f)'
