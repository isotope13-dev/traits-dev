defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.94

traits:
  - id: icmp-channel-constructor
    desc: Go constructs an ICMP transport channel
    if:
      type: symbol
      kind: call
      exact: newICMPChannel

  - id: go-ping-destination-byte
    desc: Go appends identity byte to ping target
    conf: 0.96
    if:
      type: text
      regex: '(?is)exec\.Command\s*\(\s*"ping"[\s\S]{0,240}\+\s*strconv\.Itoa\s*\(\s*int\s*\('
