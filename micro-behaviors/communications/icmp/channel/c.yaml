defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: c-icmp-helper-call
    desc: C source invokes an ICMP channel helper
    if:
      type: text
      regex: '\bch_icmp_(nibble|byte_ip)\s*\('
    unless:
      - type: path
        regex: '[/\\]channels[.]c$'

  - id: zig-icmp-helper-call
    desc: Zig source invokes an ICMP channel helper
    for: [zig]
    if:
      type: symbol
      kind: call
      regex: '^ch[.]icmp(ByteIp|Nibble)$'
    unless:
      - type: path
        regex: '[/\\]channels[.]zig$'

  - id: source-icmp-helper-call
    desc: Source invokes an ICMP data channel helper
    for: [csharp, java, kotlin, elixir, ruby, swift, zig]
    if:
      type: text
      regex: '(?i)\b(icmp|Icmp)[_-]?(Byte[_-]?Ip|Nibble)\s*[(]'
    unless:
      - type: path
        regex: '[/\\](channels|Channels)[.](c|cs|java|kt|ex|rb|swift|zig)$'

  - id: source-icmp-host-identity
    desc: Source collects host identity for ICMP data
    for: [csharp, java, kotlin, elixir, ruby, swift, zig]
    if:
      type: text
      regex: '(?i)\b(gethostname|GetHostName|Socket[.]gethostname|os[.]hostname)\s*[(]'
