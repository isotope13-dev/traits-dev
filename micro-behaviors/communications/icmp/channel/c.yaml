defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: c-icmp-helper-call
    desc: C source invokes an ICMP channel helper
    if:
      type: text
      regex: '\bch_icmp_(nibble|byte_ip)\s*\('
    unless:
      - type: path
        regex: '[/\\]channels[.]c$'
