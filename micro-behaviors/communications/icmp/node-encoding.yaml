defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: node-high-nibble-helper-call
    desc: Sends high nibble to ICMP helper
    if:
      type: text
      regex: '\bicmpNibble\s*\([^,\n]{1,80},\s*\w+\s*>>\s*4\s*\)'

  - id: node-low-nibble-helper-call
    desc: Sends low nibble to ICMP helper
    if:
      type: text
      regex: '\bicmpNibble\s*\([^,\n]{1,80},\s*\w+\s*&\s*15\s*\)'

  - id: node-ping-size-nibble
    desc: Encodes nibble in ping packet size
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        index: 0
        regex: '^ping .{0,40}-s \$\{.{1,40}&\s*15'

