defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: node-high-nibble-helper-call
    desc: Sends high nibble to ICMP helper
    if:
      type: text
      regex: '\bicmpNibble\s*\([^,\n]{1,80},\s*\w+\s*>>\s*4\s*\)'

  - id: node-low-nibble-helper-call
    desc: Sends low nibble to ICMP helper
    if:
      type: text
      regex: '\bicmpNibble\s*\([^,\n]{1,80},\s*\w+\s*&\s*15\s*\)'

  - id: node-ping-size-nibble
    desc: Encodes nibble in ping packet size
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        index: 0
        regex: '^ping .{0,40}-s \$\{.{1,40}&\s*15'


  # Loop bindings are not yet resolved by source call-argument flow facts.
  # Tie the byte binding to the actual ping template rather than co-occurring
  # hostname logging, buffer encoding and an unrelated reachability probe.
  - id: node-hostname-byte-ping-loop
    desc: Pings with hostname buffer byte values
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((for_in_statement
          left: (identifier) @byte
          right: (call_expression
            function: (member_expression
              object: (identifier) @buffer
              property: (property_identifier) @from)
            arguments: (arguments) @input)
          body: (statement_block
            (expression_statement
              (call_expression
                function: (identifier) @exec
                arguments: (arguments
                  (template_string
                    (template_substitution (identifier) @sent)) @command)))))
          (#eq? @buffer "Buffer")
          (#eq? @from "from")
          (#match? @input "[.]hostname[(]")
          (#match? @exec "^exec(Sync)?$")
          (#match? @command "^`ping ")
          (#eq? @byte @sent))

  - id: node-hostname-byte-ping-helper
    desc: Passes hostname bytes to ping helper
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (for_in_statement
            left: (identifier) @byte
            right: (call_expression
              function: (member_expression
                object: (identifier) @buffer
                property: (property_identifier) @from)
              arguments: (arguments) @input)
            body: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @helper_call
                  arguments: (arguments
                    (_) (identifier) @sent .)))))
          (function_declaration
            name: (identifier) @helper
            parameters: (formal_parameters
              (identifier) (identifier) @parameter .)
            body: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @exec
                  arguments: (arguments
                    (template_string
                      (template_substitution (identifier) @used)) @command))))))
          (#eq? @buffer "Buffer")
          (#eq? @from "from")
          (#match? @input "[.]hostname[(]")
          (#eq? @byte @sent)
          (#eq? @helper_call @helper)
          (#eq? @parameter @used)
          (#match? @exec "^exec(Sync)?$")
          (#match? @command "^`ping "))

        ((program
          (function_declaration
            name: (identifier) @helper
            parameters: (formal_parameters
              (identifier) (identifier) @parameter .)
            body: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @exec
                  arguments: (arguments
                    (template_string
                      (template_substitution (identifier) @used)) @command)))))
          (for_in_statement
            left: (identifier) @byte
            right: (call_expression
              function: (member_expression
                object: (identifier) @buffer
                property: (property_identifier) @from)
              arguments: (arguments) @input)
            body: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @helper_call
                  arguments: (arguments
                    (_) (identifier) @sent .))))))
          (#eq? @buffer "Buffer")
          (#eq? @from "from")
          (#match? @input "[.]hostname[(]")
          (#eq? @byte @sent)
          (#eq? @helper_call @helper)
          (#eq? @parameter @used)
          (#match? @exec "^exec(Sync)?$")
          (#match? @command "^`ping "))

composite_rules:
  - id: node-hostname-byte-ping
    desc: Transmits hostname buffer bytes through ping
    any:
      - id: node-hostname-byte-ping-loop
      - id: node-hostname-byte-ping-helper
