defaults:
  platforms: [unix, windows]
  for: [c]
  crit: notable
  conf: 0.95

traits:
  - id: c-ping-decimal-target-suffix
    desc: Formats ping target with decimal suffix
    if:
      type: symbol
      kind: call
      exact: snprintf
      arg:
        index: 2
        regex: '^ping .{0,64}%s%[du]'

  - id: c-ping-variable-size-format
    desc: Formats ping with variable packet size
    if:
      type: symbol
      kind: call
      exact: snprintf
      arg:
        index: 2
        regex: '^ping .{0,64}-s %d'

