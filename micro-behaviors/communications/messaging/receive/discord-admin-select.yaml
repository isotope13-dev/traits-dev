defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.96
traits:
  - id: admin-gated-target-refresh-selection
    desc: Admin-gated selection calls target refresh
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((if_statement
          consequence: (statement_block
            (if_statement condition: (parenthesized_expression (unary_expression operator: "!"
              argument: (call_expression function: (member_expression object: (member_expression object: (this)
                property: (property_identifier) @admins) property: (property_identifier) @includes)
                arguments: (arguments . (member_expression object: (member_expression object: (identifier) @interaction
                  property: (property_identifier) @user) property: (property_identifier) @id) .))))
              consequence: (statement_block (return_statement)))
            (lexical_declaration (variable_declarator name: (identifier) @target
              value: (subscript_expression object: (member_expression object: (identifier) @interaction2
                property: (property_identifier) @values) index: (number) @index)))
            (expression_statement (await_expression (call_expression
              function: (member_expression object: (this) property: (property_identifier) @handler)
              arguments: (arguments . (identifier) @interaction3 . (identifier) @targetuse . (true) .))))))
          (#eq? @admins "adminIds") (#eq? @includes "includes")
          (#eq? @user "user") (#eq? @id "id") (#eq? @values "values") (#eq? @index "0")
          (#eq? @interaction @interaction2) (#eq? @interaction @interaction3)
          (#eq? @target @targetuse) (#eq? @handler "handleManualRefresh"))
