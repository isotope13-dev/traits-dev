defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: sendmessage-source-url-reference
  desc: sendMessage call text near a sourceUrl field
  conf: 0.94
  if:
    type: text
    regex: '\bsendMessage\s*\([\s\S]{0,360}\bsourceUrl\s*:'

- id: sendmessage-media-type-reference
  desc: sendMessage near image/video field
  conf: 0.92
  if:
    type: text
    regex: '\bsendMessage\s*\([\s\S]{0,220}\b(image|video)\s*[,}:]'

