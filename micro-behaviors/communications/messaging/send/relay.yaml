defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: whatsapp-relay-message-call
    desc: Calls a WhatsApp-style relayMessage helper
    crit: notable
    conf: 0.95
    if:
      # Call facts currently omit some class-method bodies.
      type: tree-sitter
      kind: call
      regex: '^([\w$.#?]+\.)?relayMessage\s*\('
