# Android SMS send primitives in Java/Kotlin source. Sending texts is a
# neutral capability (messaging apps, 2FA autofill); the toll-fraud shapes
# built on top live in objectives/impact/fraud/.
defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: android-sms-manager-send-text
    desc: Sends SMS through Android SmsManager
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'SmsManager\.getDefault\(\)[\s\S]{0,200}\.sendTextMessage\s*\('
  # Both the bare and the plus-prefixed form of one destination, covering
  # providers that require either variant. Legitimate apps send to the
  # number the user typed; systematic dual-form sending is the toll-fraud
  # premium-SMS shape (Joker, Harly, TollFraud families).
  - id: android-sms-pair-send
    desc: Sends SMS in bare and plus-prefixed forms
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\.sendTextMessage\s*\([^;]{0,120}"\+"\s*\+'
  # Script-navigated sms: links (href="sms:<code>?body=<keyword>") routed
  # to the native sender instead of the messaging app: the click that
  # subscribes the victim without a tap.
  - id: android-sms-url-target
    desc: Handles sms-colon URLs with bodies
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.startsWith\(\s*"sms:"'
  # Manifest-declared SMS_RECEIVED action handled in code: inbound messages
  # enter the application for interception rather than the inbox.
  - id: android-sms-received-action
    desc: Listens for inbound SMS_RECEIVED broadcasts
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: SMS_RECEIVED
