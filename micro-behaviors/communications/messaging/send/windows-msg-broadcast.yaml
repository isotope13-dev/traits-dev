defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.94

traits:
  - id: batch-msg-all-users
    desc: Batch MSG targets all local users
    # This is command text, not evidence that Windows accepted or delivered it.
    if:
      type: text
      regex: '(?im)^\s*msg(\.exe)?\s+\*\s+\S'
