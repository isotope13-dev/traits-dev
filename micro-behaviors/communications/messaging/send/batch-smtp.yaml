defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: sendsmtp-file-attachment-command
    desc: Sends file attachment with SMTP utility
    crit: notable
    conf: 0.97
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^sendsmtp(\.exe)?\s+/HOST\s+[^\r\n]{1,400}/FILES\s+\S+'
