defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
traits:
- id: telegram-bot-api-token
  desc: Telegram Bot API token URL literal
  conf: 1.0
  if:
    type: literal
    regex: (?i)api\.telegram\.org/bot\d+:[a-zA-Z0-9_-]+/
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  not:
  - substr: alphanumeric_characters
- id: telegram-bot-token-sendmessage-path
  desc: Telegram bot token sendMessage path
  conf: 0.96
  if:
    type: text
    regex: /bot\d{8,12}:[A-Za-z0-9_-]{30,60}/sendMessage
