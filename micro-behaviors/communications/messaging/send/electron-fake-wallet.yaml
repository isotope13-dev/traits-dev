# Telegram-send channel/member vocabulary. No Electron or actual send is required.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, scripts, asar, dmg, pkg, zip]
  attack: T1185,T1567,T1555

traits:
  - id: telegram-send-channel
    desc: "Telegram-send channel or member name"
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '["'']send-telegram["'']|sendToTelegram'
