defaults:
  platforms: [unix, windows]
traits:
- id: hardcoded-chat-id-literal
  desc: Hardcoded Telegram chat identifier
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - rust
  - go
  - html
  - php
  unless:
  - id: well-known/app/browser/google-web::official-google-web-asset
  - id: micro-behaviors/data/string/redact::sensitive-data-scanner
  - id: well-known/lib/network/go-telegram-bot-api::library-source-context
  if:
    type: text
    regex: '(?i)(chat_?id.{0,80}["'']-?\d{9,15}["'']|ChatId\s*\(\s*-?\d{9,15}\s*\))'
