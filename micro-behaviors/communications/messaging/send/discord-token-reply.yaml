defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.96
traits:
  - id: target-token-refresh-attachment-reply
    desc: Target token refresh returned as attachment
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((method_definition name: (property_identifier) @handler
          parameters: (formal_parameters . (identifier) @interaction . (identifier) @target)
          body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @file
              value: (call_expression function: (member_expression object: (identifier) @path
                property: (property_identifier) @join)
                arguments: (arguments (_) (template_string (template_substitution (identifier) @targetuse)
                  (string_fragment) @suffix)))))
            (lexical_declaration (variable_declarator name: (identifier) @saved
              value: (call_expression function: (member_expression object: (identifier) @json1
                property: (property_identifier) @parse)
                arguments: (arguments (call_expression function: (member_expression object: (identifier) @fs
                  property: (property_identifier) @read)
                  arguments: (arguments . (identifier) @readfile))))))
            (lexical_declaration (variable_declarator name: (identifier) @result
              value: (await_expression (call_expression function: (member_expression object: (this))
                arguments: (arguments . (member_expression object: (identifier) @saveduse
                  property: (property_identifier) @refreshkey) .)))))
            (if_statement consequence: (statement_block
              (lexical_declaration (variable_declarator name: (identifier) @data
                value: (object
                  (pair key: (property_identifier) @tokenkey value: (member_expression object: (identifier) @result1
                    property: (property_identifier) @tokenvalue))
                  (pair key: (property_identifier) @refreshkey2 value: (member_expression object: (identifier) @result2
                    property: (property_identifier) @refreshvalue)))))
              (lexical_declaration (variable_declarator name: (identifier) @buffer
                value: (call_expression function: (member_expression object: (identifier) @buffer_class
                  property: (property_identifier) @from)
                  arguments: (arguments (call_expression function: (member_expression object: (identifier) @json2
                    property: (property_identifier) @stringify)
                    arguments: (arguments . (identifier) @datause))))))
              (lexical_declaration (variable_declarator name: (identifier) @attachment
                value: (new_expression constructor: (identifier) @builder
                  arguments: (arguments . (identifier) @bufferuse))))
              (expression_statement (await_expression (call_expression
                function: (member_expression object: (identifier) @interactionuse
                  property: (property_identifier) @reply)
                arguments: (arguments (object (pair key: (property_identifier) @files
                  value: (array . (identifier) @attachmentuse .)))))))))))
          (#eq? @handler "handleManualRefresh")
          (#eq? @target @targetuse)
          (#eq? @path "path") (#eq? @join "join") (#eq? @suffix "_token.json")
          (#eq? @json1 "JSON") (#eq? @parse "parse") (#eq? @fs "fs") (#eq? @read "readFileSync")
          (#eq? @file @readfile) (#eq? @saved @saveduse) (#eq? @refreshkey "refresh_token")
