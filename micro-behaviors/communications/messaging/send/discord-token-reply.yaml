          (#eq? @tokenkey "token") (#eq? @tokenvalue "token")
          (#eq? @refreshkey2 "refresh_token") (#eq? @refreshvalue "refresh_token")
          (#eq? @buffer_class "Buffer") (#eq? @from "from")
          (#eq? @json2 "JSON") (#eq? @stringify "stringify") (#eq? @data @datause)
