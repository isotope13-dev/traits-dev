defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9
  mbc: C0029
traits:
  - id: whatsapp-web-send-text-message-export
    desc: Exports async sendTextMessage function
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bsendTextMessage\s*=\s*async\s+function\b'

  # The message payload carries an is_ai_message flag set to true, which marks
  # the outgoing message as machine-authored. Client code stamping that flag on
  # output it did not classify is a forged AI-authorship claim.
  - id: whatsapp-forged-ai-message-support-flag
    desc: Stamps is_ai_message true on message payload
    conf: 0.93
    if:
      type: text
      regex: 'is_ai_message\s*:\s*true'
