defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9
  mbc: C0029
traits:
  - id: whatsapp-web-send-text-message-export
    desc: Exports async sendTextMessage function
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bsendTextMessage\s*=\s*async\s+function\b'

  # The message payload carries an is_ai_message flag set to true, which marks
  # the outgoing message as machine-authored. Client code stamping that flag on
  # output it did not classify is a forged AI-authorship claim.
  - id: whatsapp-forged-ai-message-support-flag
    desc: Stamps is_ai_message true on message payload
    conf: 0.93
    if:
      type: text
      regex: 'is_ai_message\s*:\s*true'

  # Rich-response HTML payload: the protocol primitive that carries raw HTML
  # for the recipient's client to render. A bot-forwarded rich response with
  # an HTML primitive lets the sender put markup into a victim's chat; the
  # primitive name is the WhatsApp protocol type, not a fork-chosen label.
  - id: whatsapp-html-rich-response-primitive
    desc: Rich response carries raw HTML payload
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'FOAHtmlPrimitive\w*'

  # Rich-response envelope that wraps a bot-forwarded payload. Neutral alone:
  # ordinary bot replies use it. It matters paired with the HTML primitive.
  - id: whatsapp-rich-response-message-key
    desc: Builds a rich response message envelope
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'richResponseMessage\s*:'

  # Generative-UI open-URL footer button. Rendered as a tappable link to an
  # arbitrary destination inside a bot-authored message; the URL is caller
  # supplied, so one of these per message is a link-lure shape.
  - id: whatsapp-genai-open-url-cta
    desc: Rich response button opens caller URL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: "cta_type:\\s*['\"]OPEN_URL['\"]"
