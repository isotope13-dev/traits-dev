defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

# Preserve the observable call and IP/message co-occurrence without inferring
# theft, a particular method name, or a proven recipient.
traits:
  - id: wapi-awaits-fragmented-latitude-call
    desc: Awaits WAPI call passing fragmented latitude
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'await\s+WAPI\s*\[[^\]]{1,100}\]\(_0x[0-9a-f]+,_0x[0-9a-f]+\[''lat'''

composite_rules:
  - id: ip-field-near-wapi-coordinate-or-value
    desc: IP field near WAPI coordinate or value syntax
    crit: notable
    conf: 0.9
    scope: leaf
    near_bytes: 12000
    all:
      - id: micro-behaviors/data/property/assign::ip-object-field
    any:
      - id: metadata/lang/source/shape::wapi-near-fragmented-latitude
      - id: metadata/lang/source/shape::wapi-near-escaped-space-value
