# Share-sheet deep links. Opening `whatsapp://send?text=` hands a
# prefilled message to the WhatsApp share sheet: the launcher half of
# viral share-gating kits, but also every legitimate "share on WhatsApp"
# button, so it stays notable and the prize-funnel composites add the
# quota gate that makes it coercion.
defaults:
  platforms: [unix, windows]
  for: [html, javascript]
  crit: notable
  conf: 0.92

traits:
  - id: whatsapp-send-text-deep-link
    desc: WhatsApp prefilled-message share link
    if:
      type: text
      regex: '(?i)whatsapp://send\?text='
