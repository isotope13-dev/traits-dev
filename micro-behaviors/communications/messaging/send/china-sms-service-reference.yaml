defaults:
  for: [binaries]
  platforms: [windows, android]
  crit: notable
composite_rules:
  - id: cn-bulk-sms-endpoint-reference
    desc: Bulk SMS provider endpoint reference
    conf: 0.88
    any:
      - id: well-known/app/communication/weimi::weimi-cc-api
      - id: well-known/app/communication/juhe::juhe-cn-sms-send
  - id: cn-sms-parameter-clues
    desc: SMS endpoint and parameter text references
    conf: 0.9
    any:
      - id: well-known/app/communication/weimi::weimi-cc-api
      - id: well-known/app/communication/juhe::juhe-cn-sms-send
    all:
      - id: micro-behaviors/communications/http/request/parameter::sms-tpl-id-param
      - id: micro-behaviors/communications/http/request/parameter::sms-mobile-param
