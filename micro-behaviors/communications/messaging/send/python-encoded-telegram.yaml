defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: encoded-telegram-send-document
    desc: Encoded Telegram document upload reference
    if:
      type: encoded
      encoding: base64
      regex: '(?i)api\.telegram\.org.{0,150}sendDocument'
  - id: encoded-python-post-files
    desc: Encoded source posts a files argument
    if:
      type: encoded
      encoding: base64
      regex: '(?s)requests\.post\([^\n]{0,150}files\s*='
