defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95
traits:
  - id: go-send-seed-notification-call
    desc: Calls Go seed-notification helper
    if:
      type: symbol
      kind: call
      regex: '\.SendSeedNotification$'
  - id: go-photo-to-chat-helper-call
    desc: Calls Go photo-to-chat helper
    if:
      type: symbol
      kind: call
      regex: '\.SendPhotoWithKeyboardToChat$'
composite_rules:
  - id: go-capture-photo-chat-calls
    desc: Nearby desktop-capture and photo-to-chat calls
    crit: notable
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/hardware/display/screenshot::go-capture-screen-helper-call
      - id: go-photo-to-chat-helper-call
