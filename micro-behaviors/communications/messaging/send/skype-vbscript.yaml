# Programmatic Skype4COM sends are ordinary messaging capability until paired
# with iteration over the entire contact list.
defaults:
  platforms: [windows]
  for: [vbs, static-lib]

traits:
  - id: skype4com-send-message
    desc: Sends a message through Skype4COM
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bSkype\.SendMessage\s+[A-Za-z]+\.handle\s*,'

