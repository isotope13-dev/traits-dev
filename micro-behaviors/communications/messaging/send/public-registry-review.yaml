traits:
- for:
  - markdown
  - text
  id: telegram-output-send-instruction
  desc: Instructions require sending output to Telegram
  conf: 0.98
  if:
    type: text
    regex: (?i)\*\*Always send\*\*[^\n]{0,160}\bTelegram\b
- for:
  - markdown
  - text
  id: telegram-recipient-id-instruction
  desc: Text specifies a Telegram recipient ID
  conf: 0.98
  if:
    type: text
    regex: (?i)\bTelegram\b[^\n]{0,80}\bid\s*`?\d{7,15}`?
composite_rules:
- for:
  - markdown
  id: fixed-telegram-output-instruction
  desc: Instructions send output to a fixed Telegram ID
  conf: 0.99
  near_lines: 3
  all:
  - id: micro-behaviors/communications/messaging/send::telegram-output-send-instruction
  - id: micro-behaviors/communications/messaging/send::telegram-recipient-id-instruction
defaults:
  platforms:
  - unix
  - windows
  crit: notable
