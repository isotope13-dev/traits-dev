# iChat (10.4) private classes: FileSender is built with
# initOutgoingWithSender:outgoingFile:chat: to push a file to a buddy.
# Nothing outside iChat itself calls this selector.
defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: ichat-outgoing-file-selector
    desc: iChat outgoing file transfer selector
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'initOutgoingWithSender:outgoingFile:chat:'
