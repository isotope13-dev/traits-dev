defaults:
  platforms: [unix, windows]
composite_rules:
- id: rust-build-curl-telegram-send-references
  desc: Cargo build references curl and Telegram send
  crit: notable
  conf: 0.99
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: "micro-behaviors/process/create/direct::cargo-build-process-launch"
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/messaging/send::chat-send-message
  any:
  - id: "micro-behaviors/process/create/direct::cargo-build-curl-wget-command"
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
