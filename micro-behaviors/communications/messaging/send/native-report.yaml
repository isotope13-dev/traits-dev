defaults:
  for:
  - c
  - cpp
  platforms:
  - windows
traits:
- id: native-report-sendmessage-body
  desc: Host/user report buffer passed to sendMessage
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |-
      ((translation_unit
       (function_definition
        declarator: (function_declarator declarator: (identifier) @formatter
         parameters: (parameter_list . (parameter_declaration
          declarator: (pointer_declarator declarator: (identifier) @output))))
        body: (compound_statement
         (expression_statement (call_expression function: (identifier) @hostname
          arguments: (argument_list . (identifier) @host)))
         (expression_statement (call_expression function: (identifier) @username
          arguments: (argument_list . (identifier) @user)))
         (expression_statement (call_expression function: (identifier) @format
          arguments: (argument_list . (identifier) @destination
           (identifier) @formatted_host (identifier) @formatted_user)))))
       (function_definition body: (compound_statement
        (expression_statement (call_expression function: (identifier) @called_formatter
         arguments: (argument_list . (identifier) @report)))
        (expression_statement (call_expression
         arguments: (argument_list (_) (string_literal) @method (identifier) @sent)))))) @report_send
       (#eq? @formatter @called_formatter)
       (#match? @hostname "^GetComputerName[AW]?$")
       (#match? @username "^GetUserName[AW]?$")
       (#eq? @format "snprintf")
       (#eq? @output @destination)
       (#eq? @host @formatted_host)
       (#eq? @user @formatted_user)
       (#eq? @method "\"sendMessage\"")
       (#eq? @report @sent))
