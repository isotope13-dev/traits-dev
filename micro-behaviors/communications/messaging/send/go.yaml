# A Go call to a method named `publish` or `send` is a message-dispatch verb
# and nothing more: every broker client, event bus, channel wrapper and HTTP
# helper spells it the same way. It carries no protocol identity on its own, so
# it lives with the neutral message-send capability; the MQTT composite under
# micro-behaviors/communications/messaging/mqtt pairs it with an MQTT library
# import to supply that identity.
defaults:
  platforms: [android, windows, unix]
  for: [go]
  mbc: C0029

traits:
  - id: publish-or-send-call
    desc: Calls a method named publish or send
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(publish|send)$'
