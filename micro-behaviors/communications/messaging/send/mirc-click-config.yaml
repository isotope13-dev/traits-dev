# IRC is not IPC. Until communications/irc is admitted by the validator,
# these chat-send operations use the neutral messaging/send operation leaf.
# Several distinct click bindings are required; no campaign token is needed.
defaults:
  platforms: [windows]
  for: [text, mirc]
traits:
  - id: mirc-multiple-click-run-message-hooks
    desc: Multiple mIRC run hooks send click reports
    crit: notable
    conf: 0.95
    count_min: 3
    if:
      type: text
      regex: '(?im)^\w{1,16}=//run [^|\r\n]{1,150}\| *//msg [%#]\S+ :?DoubleClicked:'

composite_rules:
  - id: mirc-executable-click-hooks-report-interaction
    desc: Executable click hooks report over IRC
    crit: suspicious
    conf: 0.9
    for: [text]
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/process/create/exec::mirc-config-click-run-executable
      - id: mirc-multiple-click-run-message-hooks
