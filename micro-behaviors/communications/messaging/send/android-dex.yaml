defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-sms-send-text-call
    desc: Sends an Android text message
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Landroid/telephony/SmsManager;->sendTextMessage
  - id: dex-sms-service-number-argument
    desc: SMS call targets a 106-series service number
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Landroid/telephony/SmsManager;->sendTextMessage
      arg: {index: 0, kind: string, regex: '^106[0-9-]{5,20}$'}
  - id: dex-sms-record-phone-setter
    desc: DEX sets a phone field
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: ';->setPhone$'
  - id: dex-sms-record-content-setter
    desc: DEX sets a content field
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: ';->setContent$'
  - id: dex-sms-record-list-adder
    desc: DEX adds SMS record to list
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: ';->addSmsList$'
  - id: dex-sms-root-content-uri
    desc: Android SMS provider root URI
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: 'content://sms/'
  - id: dex-sms-sender-call
    desc: DEX calls SMS sender accessor
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^Landroid/telephony/(gsm/)?SmsMessage;->get(Display)?OriginatingAddress$'
  - id: dex-sms-body-call
    desc: DEX calls SMS body accessor
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^Landroid/telephony/(gsm/)?SmsMessage;->get(Display)?MessageBody$'
  - id: dex-http-output-call
    desc: DEX calls HTTP connection output stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/HttpURLConnection;->getOutputStream'
  - id: dex-socket-input-call
    desc: DEX gets socket input stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/Socket;->getInputStream'
  - id: dex-socket-output-call
    desc: DEX gets socket output stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/Socket;->getOutputStream'
  - id: dex-command-executor-call
    desc: DEX calls command executor helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i);->(executer2?|execcommand|executecommand|runcommand)$'
  - id: dex-sms-sender-helper-call
    desc: DEX calls SMS sending helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i);->sendsms$'
  - id: android-dex-upload-file-operation
    desc: DEX defines an HTTP file upload operation
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: uploadFile
  - id: android-dex-foreground-service
    desc: DEX starts an Android foreground service
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: startForeground
  - id: dex-mqtt-function-script-topic
    desc: MQTT remote script execution topic path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '/*/function/script'
  - id: dex-mqtt-function-cmd-topic
    desc: MQTT remote command topic path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '/*/function/cmd/read'
  - id: dex-mqtt-function-app-install-topic
    desc: MQTT remote app install topic path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '/*/function/app/install'
  - id: dex-mqtt-function-remote-control-topic
    desc: MQTT remote control topic path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '/*/function/remote/control'
  - id: dex-mqtt-function-lock-topic
    desc: MQTT remote device lock topic path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '/*/function/lock'
  - id: dex-mqtt-function-factory-reset-topic
    desc: MQTT remote factory reset topic path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '/*/function/factory/reset'
  - id: dex-mqtt-function-reboot-topic
    desc: MQTT remote reboot topic path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '/*/function/reboot'
