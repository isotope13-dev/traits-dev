# SmsManager.sendDataMessage delivers a binary payload to a destination port.
# Legitimate for app-to-app data SMS; it is also the delivery primitive for
# WAP Push and other binary-SMS parser attacks, which live in objectives/.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.92

traits:
  - id: android-sms-manager-send-data
    desc: Sends binary SMS through Android SmsManager
    if:
      type: text
      regex: '\bSmsManager\b[\s\S]{0,400}\.sendDataMessage\s*\('
