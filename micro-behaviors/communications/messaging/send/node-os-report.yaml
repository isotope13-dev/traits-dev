# Bind the OS import, report variable, sender parameter and serialized text.
# This neutral chain also occurs in legitimate inventory/reporting tools.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.96

traits:
  - id: node-os-report-chat-envelope
    desc: OS report passed into written chat envelope
    if:
      type: tree-sitter
      query: |-
        (program
          (lexical_declaration (variable_declarator name: (identifier) @os
            value: (call_expression function: (identifier) @require
              arguments: (arguments . (string (string_fragment) @module) .))))
          (function_declaration name: (identifier) @sender
            parameters: (formal_parameters . (identifier) @message .)
            body: (statement_block
              (return_statement (new_expression arguments: (arguments
                (arrow_function body: (statement_block
                  (variable_declaration (variable_declarator name: (identifier) @body
                    value: (call_expression function: (subscript_expression object: (identifier) @json)
                      arguments: (arguments . (object
                        (pair key: (string (string_fragment) @channel))
                        (pair key: (string (string_fragment) @text) value: (identifier) @serialized)) .))))
                  (expression_statement (sequence_expression
                    (call_expression function: (subscript_expression object: (identifier) @request
                      index: (string (string_fragment) @write))
                      arguments: (arguments . (identifier) @posted .)))))))))))
          (function_declaration body: (statement_block
            (variable_declaration
              (variable_declarator name: (identifier) @profile value: (object
                (pair key: (string (string_fragment) @platform)
                  value: (call_expression function: (subscript_expression object: (identifier) @os1)))
                (pair key: (string (string_fragment) @hostname)
                  value: (call_expression function: (subscript_expression object: (identifier) @os2)))
                (pair key: (string (string_fragment) @cpus))))
              (variable_declarator name: (identifier) @formatted value: (binary_expression left: (binary_expression right: (subscript_expression object: (identifier) @used))) @format))
            (try_statement body: (statement_block (expression_statement
              (await_expression (call_expression function: (identifier) @send
                arguments: (arguments . (identifier) @report .)))))))) @export
          (#eq? @require "require") (#eq? @module "os")
          (#eq? @os @os1) (#eq? @os @os2)
          (#eq? @platform "platform") (#eq? @hostname "hostname") (#eq? @cpus "cpus")
          (#eq? @profile @used) (#eq? @profile @formatted) (#eq? @formatted @report)
          (#eq? @sender @send) (#eq? @message @serialized)
          (#eq? @json "JSON") (#eq? @channel "channel") (#eq? @text "text")
          (#eq? @write "write") (#eq? @body @posted))
