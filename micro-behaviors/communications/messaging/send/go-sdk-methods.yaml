# API-shaped message sending is notable, including in ordinary notification
# libraries. These observations do not establish sensitive input, command
# reception, an attacker destination, or exfiltration.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.9
traits:
  - id: go-send-text-message-helper-call
    desc: Calls a SendTextMessage helper
    if:
      type: symbol
      kind: call
      regex: '\.SendTextMessage$'
  - id: go-post-message-context-helper-call
    desc: Calls a PostMessageContext helper
    if:
      type: symbol
      kind: call
      regex: '\.PostMessageContext$'
  - id: go-push-sms-helper-call
    desc: Calls an SMS-push helper
    if:
      type: symbol
      kind: call
      regex: '\.PushSMS$'
  - id: go-notify-message-helper-call
    desc: Calls a message-notification helper
    if:
      type: symbol
      kind: call
      regex: '\.NotifyMessage$'
  - id: go-send-message-event-helper-call
    desc: Calls a message-event sending helper
    if:
      type: symbol
      kind: call
      regex: '\.SendMessageEvent$'
  - id: go-push-note-helper-call
    desc: Calls a note-push helper
    if:
      type: symbol
      kind: call
      regex: '\.PushNote$'
  - id: go-push-message-helper-call
    desc: Calls a message-push helper
    if:
      type: symbol
      kind: call
      regex: '\.PushMessage$'
  - id: go-direct-message-event-helper-call
    desc: Creates a direct-message event through a helper
    if:
      type: symbol
      kind: call
      regex: '\.DirectMessages\.EventsNew$'
