# These capabilities do not establish unsolicited sends or account compromise.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, crx, xpi, zip, chrome-manifest]

composite_rules:
  - id: extension-recipient-list-and-send
    desc: Recipient enumeration and send APIs co-occur
    conf: 0.92
    scope: archive
    all:
      - id: metadata/permission/host::content-script-matches-im-web-app
      - id: micro-behaviors/communications/messaging/list::wppconnect-recipient-list-enumeration
    any:
      - id: micro-behaviors/communications/messaging/send::agent-collaboration-send-message-call
      - id: micro-behaviors/communications/messaging/send::chat-send-document
      - id: micro-behaviors/communications/messaging/send::chat-send-document-symbol
      - id: micro-behaviors/communications/messaging/send::chat-send-message
      - id: micro-behaviors/communications/messaging/send::chat-send-photo
      - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal
      - id: micro-behaviors/communications/messaging/send::send-to-chat-label
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-token
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
      - id: micro-behaviors/communications/messaging/send::telegram-bot-token-sendmessage-path
      - id: micro-behaviors/communications/messaging/send::telegram-send-channel
      - id: micro-behaviors/communications/messaging/send::whatsapp-send-text-deep-link
      - id: micro-behaviors/communications/messaging/send::whatsapp-web-send-text-message-export
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-file
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-message
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-poll
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-text
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-vcard
  - id: extension-external-listener-and-send
    desc: External listener and messaging send APIs
    conf: 0.94
    scope: archive
    all:
      - id: metadata/permission/manifest::externally-connectable
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message-external
      - id: metadata/permission/host::content-script-matches-im-web-app
    any:
      - id: micro-behaviors/communications/messaging/send::agent-collaboration-send-message-call
      - id: micro-behaviors/communications/messaging/send::chat-send-document
      - id: micro-behaviors/communications/messaging/send::chat-send-document-symbol
      - id: micro-behaviors/communications/messaging/send::chat-send-message
      - id: micro-behaviors/communications/messaging/send::chat-send-photo
      - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal
      - id: micro-behaviors/communications/messaging/send::send-to-chat-label
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-token
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
      - id: micro-behaviors/communications/messaging/send::telegram-bot-token-sendmessage-path
      - id: micro-behaviors/communications/messaging/send::telegram-send-channel
      - id: micro-behaviors/communications/messaging/send::whatsapp-send-text-deep-link
      - id: micro-behaviors/communications/messaging/send::whatsapp-web-send-text-message-export
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-file
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-message
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-poll
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-text
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-vcard
  - id: all-site-authority-with-messaging-apis
    desc: All-site grants with contact and send APIs
    conf: 0.94
    scope: archive
    all:
      - id: metadata/permission/host::content-script-all-urls
      - id: "metadata/permission/host::host-permission-web-wildcard"
      - id: micro-behaviors/communications/messaging/list::wppconnect-contact-list
    any:
      - id: micro-behaviors/communications/messaging/send::agent-collaboration-send-message-call
      - id: micro-behaviors/communications/messaging/send::chat-send-document
      - id: micro-behaviors/communications/messaging/send::chat-send-document-symbol
      - id: micro-behaviors/communications/messaging/send::chat-send-message
      - id: micro-behaviors/communications/messaging/send::chat-send-photo
      - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal
      - id: micro-behaviors/communications/messaging/send::send-to-chat-label
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-token
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-operation
      - id: micro-behaviors/communications/messaging/send::telegram-bot-token-sendmessage-path
      - id: micro-behaviors/communications/messaging/send::telegram-send-channel
      - id: micro-behaviors/communications/messaging/send::whatsapp-send-text-deep-link
      - id: micro-behaviors/communications/messaging/send::whatsapp-web-send-text-message-export
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-file
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-message
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-poll
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-text
      - id: micro-behaviors/communications/messaging/send::wppconnect-send-vcard
