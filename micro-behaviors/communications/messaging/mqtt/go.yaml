defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.94

traits:
  - id: paho-client-import
    desc: Imports the Eclipse Paho MQTT client
    conf: 0.99
    if:
      type: import
      exact: github.com/eclipse/paho.golang/paho

  - id: paho-new-client
    desc: Creates an Eclipse Paho MQTT client
    if:
      type: symbol
      kind: call
      exact: paho.NewClient

  - id: paho-connect-packet
    desc: Constructs an Eclipse Paho CONNECT packet
    if:
      type: text
      regex: '\bpaho\.Connect\s*\{'

  - id: paho-publish-packet
    desc: Constructs an Eclipse Paho PUBLISH packet
    if:
      type: text
      regex: '\bpaho\.Publish\s*\{'

  - id: paho-subscribe-packet
    desc: Constructs an Eclipse Paho SUBSCRIBE packet
    if:
      type: text
      regex: '\bpaho\.Subscribe\s*\{'

  - id: paho-disconnect-packet
    desc: Constructs an Eclipse Paho DISCONNECT packet
    if:
      type: text
      regex: '\bpaho\.Disconnect\s*\{'
