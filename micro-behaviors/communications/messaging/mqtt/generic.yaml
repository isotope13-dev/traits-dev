defaults:
  platforms: [android, windows, unix]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: mqtt-library-import
    desc: Imports an MQTT client or server library
    if:
      type: import
      regex: '(?i)(^|[/._-])mqtt([/._-]|$)'

  - id: publish-or-send-call
    desc: Calls a method named publish or send
    crit: baseline
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(publish|send)$'

composite_rules:
  - id: mqtt-context-publish-call
    desc: Publishes a message in MQTT context
    crit: notable
    conf: 0.94
    all:
      - id: mqtt-library-import
      - id: publish-or-send-call
