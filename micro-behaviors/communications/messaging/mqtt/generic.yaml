defaults:
  platforms: [android, windows, unix]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: mqtt-library-import
    desc: Imports an MQTT client or server library
    if:
      type: import
      regex: '(?i)(^|[/._-])mqtt([/._-]|$)'

composite_rules:
  - id: mqtt-context-publish-call
    desc: Publishes a message in MQTT context
    crit: notable
    conf: 0.94
    all:
      - id: mqtt-library-import
      - id: micro-behaviors/communications/messaging/send::publish-or-send-call
