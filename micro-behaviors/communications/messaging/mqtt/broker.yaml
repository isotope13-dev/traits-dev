# MQTT broker service endpoints are neutral communications capabilities.
# Objective rules combine them with task schemas and process execution before
# inferring command and control.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.88

traits:
  - id: hivemq-broker-endpoint
    desc: HiveMQ broker endpoint
    if:
      type: text
      regex: '(?i)\b[a-z0-9.-]*hivemq\.cloud\b|\bbroker\.hivemq\.com\b'
    unless:
      - id: well-known/lib/network/trystero::trystero-source-marker
