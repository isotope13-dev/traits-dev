defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: paho-mqtt-import
    desc: Imports Python Paho MQTT client
    if:
      type: import
      exact: paho.mqtt.client

  - id: paho-mqtt-client
    desc: Creates a Paho MQTT client
    if:
      type: symbol
      kind: call
      regex: '(^|\.)mqtt\.Client$'

  # Bare `*.client.<verb>` calls name no protocol: `client` is the default
  # name for any socket or API client (a Unix-socket IPC daemon's
  # `client.connect(path)` is not an MQTT broker connection). Those matchers
  # therefore live with the neutral capabilities they actually detect --
  # micro-behaviors/communications/socket/connect and
  # micro-behaviors/communications/messaging/pubsub -- and the composites below
  # supply the MQTT meaning by pairing them with the paho import.
  # `loop_forever` stays atomic here because that method name is paho-specific.
  - id: mqtt-loop-forever
    desc: Runs the MQTT network loop
    if:
      type: symbol
      kind: call
      regex: '(^|\.)client\.loop_forever$'

composite_rules:
  - id: mqtt-connect
    desc: Connects a client to an MQTT broker
    crit: notable
    conf: 0.9
    all:
      - id: paho-mqtt-import
      - id: micro-behaviors/communications/socket/connect::client-object-connect-call

  - id: mqtt-subscribe
    desc: Subscribes to an MQTT topic
    all:
      - id: paho-mqtt-import
      - id: micro-behaviors/communications/messaging/pubsub::client-subscribe-call

  - id: mqtt-publish
    desc: Publishes an MQTT message
    all:
      - id: paho-mqtt-import
      - id: micro-behaviors/communications/messaging/pubsub::client-publish-call

  - id: paho-mqtt-subscriber
    desc: Python Paho MQTT subscriber
    crit: notable
    conf: 0.95
    all:
      - id: paho-mqtt-import
      - id: paho-mqtt-client
      - id: mqtt-subscribe
    any:
      - id: mqtt-connect
      - id: mqtt-loop-forever

  - id: paho-mqtt-publisher
    desc: Python Paho MQTT publisher
    crit: notable
    conf: 0.95
    all:
      - id: paho-mqtt-import
      - id: paho-mqtt-client
      - id: mqtt-publish
    any:
      - id: mqtt-connect
      - id: mqtt-loop-forever
