defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: paho-mqtt-import
    desc: Imports Python Paho MQTT client
    if:
      type: import
      exact: paho.mqtt.client

  - id: paho-mqtt-client
    desc: Creates a Paho MQTT client
    if:
      type: symbol
      kind: call
      regex: '(^|\.)mqtt\.Client$'

  # Bare `*.client.<verb>` calls are genuinely incomplete: `client` is the
  # default name for any socket or API client (a Unix-socket IPC daemon's
  # `client.connect(path)` is not an MQTT broker connection). The MQTT
  # meaning comes only from the paho import, so the composites below supply
  # it; `loop_forever` stays atomic because that method name is paho-specific.
  - id: client-connect-call
    desc: Calls a client connect method
    crit: component
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)client\.connect$'

  - id: client-subscribe-call
    desc: Calls a client subscribe method
    crit: component
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)client\.subscribe$'

  - id: client-publish-call
    desc: Calls a client publish method
    crit: component
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)client\.publish$'

  - id: mqtt-loop-forever
    desc: Runs the MQTT network loop
    if:
      type: symbol
      kind: call
      regex: '(^|\.)client\.loop_forever$'

composite_rules:
  - id: mqtt-connect
    desc: Connects a client to an MQTT broker
    crit: notable
    conf: 0.9
    all:
      - id: paho-mqtt-import
      - id: client-connect-call

  - id: mqtt-subscribe
    desc: Subscribes to an MQTT topic
    all:
      - id: paho-mqtt-import
      - id: client-subscribe-call

  - id: mqtt-publish
    desc: Publishes an MQTT message
    all:
      - id: paho-mqtt-import
      - id: client-publish-call

  - id: paho-mqtt-subscriber
    desc: Python Paho MQTT subscriber
    crit: notable
    conf: 0.95
    all:
      - id: paho-mqtt-import
      - id: paho-mqtt-client
      - id: mqtt-subscribe
    any:
      - id: mqtt-connect
      - id: mqtt-loop-forever

  - id: paho-mqtt-publisher
    desc: Python Paho MQTT publisher
    crit: notable
    conf: 0.95
    all:
      - id: paho-mqtt-import
      - id: paho-mqtt-client
      - id: mqtt-publish
    any:
      - id: mqtt-connect
      - id: mqtt-loop-forever
