# JVM MQTT client behavior (Eclipse Paho, HiveMQ and compatible libraries
# share the MqttClient / MqttCallback.messageArrived surface). The callback
# signature is fixed by the library API, so it survives renaming of the
# application class, topics, and broker host. Java and Kotlin spell the
# override differently; each spelling is its own atom.
defaults:
  platforms: [android, windows, unix]
  for: [java, kotlin]
  crit: notable
  conf: 0.92

traits:
  - id: java-mqtt-client-import
    desc: Imports JVM MQTT client library
    conf: 0.95
    if:
      type: import
      regex: '(?i)(^|[/._-])(mqtt|mqttv3|mqttv5|paho|hivemq)([/._-]|$)'

  - id: java-mqtt-arrived-signature
    desc: Java MQTT messageArrived signature
    conf: 0.96
    if:
      type: text
      regex: 'messageArrived\(String\s+\w+,\s*MqttMessage'

  - id: kotlin-mqtt-arrived-signature
    desc: Kotlin MQTT messageArrived signature
    conf: 0.96
    if:
      type: text
      regex: 'messageArrived\(\w+:\s*String,\s*\w+:\s*MqttMessage'

  - id: java-mqtt-callback-implements
    desc: Implements MQTT callback interface
    conf: 0.9
    if:
      type: text
      regex: '(implements\s+[\w,\s]{0,40}MqttCallback|:\s*MqttCallback\b)'

  - id: java-mqtt-client-construction
    desc: Constructs an MQTT client
    conf: 0.94
    if:
      type: text
      regex: '\bnew\s+(MqttClient|MqttAsyncClient|Mqtt5AsyncClient)\s*\('

composite_rules:
  - id: java-mqtt-message-callback
    desc: Handles inbound MQTT messages
    conf: 0.96
    any:
      - id: java-mqtt-arrived-signature
      - id: kotlin-mqtt-arrived-signature
      - id: java-mqtt-callback-implements

  - id: java-mqtt-subscriber
    desc: Subscribes to MQTT topics
    conf: 0.97
    all:
      - id: java-mqtt-client-import
      - id: micro-behaviors/communications/messaging/pubsub::jvm-subscribe-method-call
    any:
      - id: java-mqtt-message-callback
      - id: java-mqtt-client-construction

  - id: java-mqtt-publisher
    desc: Publishes messages through MQTT client
    conf: 0.97
    all:
      - id: java-mqtt-client-import
      - id: micro-behaviors/communications/messaging/pubsub::jvm-publish-method-call
    any:
      - id: java-mqtt-message-callback
      - id: java-mqtt-client-construction
