defaults:
  platforms: [android, windows, unix]
  for: [javascript, typescript]

traits:
  - id: mqtt-endpoint-configuration
    desc: JavaScript defines an MQTT endpoint URL
    crit: notable
    conf: 0.94
    if:
      # Parser-extracted literals avoid treating a README or comment that
      # mentions mqtt:// as a runtime configuration value.  This is still
      # configuration only; it does not imply that the code opens a socket.
      type: literal
      kind: string
      regex: '(?i)^mqtts?://'

  - id: mqtt-topic-configuration
    desc: JavaScript defines MQTT topic configuration
    crit: notable
    conf: 0.9
    if:
      type: text
      # Anchor the topic object to an actual `const mqtt = {` initializer;
      # an unrelated comment or object containing both words is not enough.
      regex: '(?is)\b(const|let|var)\s+mqtt\s*=\s*\{[\s\S]{0,260}\btopic\s*:\s*\{'
