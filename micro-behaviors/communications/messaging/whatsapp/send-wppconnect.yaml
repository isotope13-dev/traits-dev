defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9
  mbc: C0029
traits:
  - id: wppconnect-send-message
    desc: WPPConnect sends a WhatsApp message
    conf: 0.94
    if:
      type: text
      regex: '\bWPP_BRIDGE\.sendMessage\s*\('
  - id: wppconnect-send-text
    desc: WPPConnect sends WhatsApp text message
    conf: 0.94
    if:
      type: text
      regex: '\bWPP\.chat\.sendTextMessage\s*\('
  - id: wppconnect-send-poll
    desc: WPPConnect sends a WhatsApp poll
    conf: 0.94
    if:
      type: text
      regex: '\bWPP\.chat\.sendCreatePollMessage\s*\('
  - id: wppconnect-send-file
    desc: WPPConnect sends a WhatsApp file
    conf: 0.94
    if:
      type: text
      regex: '\bWPP\.chat\.sendFileMessage\s*\('
  - id: wppconnect-send-vcard
    desc: WPPConnect sends a WhatsApp contact card
    conf: 0.94
    if:
      type: text
      regex: '\bWPP\.chat\.sendVCardContactMessage\s*\('
