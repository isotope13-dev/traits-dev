# Bulk WhatsApp campaign primitives. Each atom is a capability on its own: a
# contact list, a group join, a paced loop over recipient rows. Sending to a
# harvested or spreadsheet recipient list is what makes it a campaign, and that
# composition lives in objectives/impact/spam/chat.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: wa-contact-list-harvest
    desc: Lists every WhatsApp contact through WPP
    if:
      type: text
      regex: 'WPP\.contact\.(list|getAllContacts)\('

  - id: wa-group-join-by-invite
    desc: Joins WhatsApp groups through WPP
    if:
      type: text
      substr: 'WPP.group.join('

  - id: wa-randomized-send-pause
    desc: Randomized pause before the next WhatsApp action
    if:
      type: text
      regex: 'setTimeout\([^)]{0,30}Math\.random\(\)'

  - id: wa-recipient-row-index
    desc: Indexes spreadsheet recipient rows with fallback
    if:
      type: text
      regex: '\.rows\[\w{1,20}\]\s*\|\|\s*\[\]'
