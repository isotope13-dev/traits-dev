# Session-material vocabulary shared by clients, migration tools and collectors.
# These references do not independently establish theft.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: noise-key-field
    desc: References WhatsApp Noise session-key fields
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\b(WANoiseInfo|noise\.(privKey|pubKey))\b'

  - id: identity-key-field
    desc: References WhatsApp Signal identity-key fields
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bsignal_static_(priv|pub)key\b'

  - id: signed-prekey-store
    desc: References WhatsApp signed prekey store
    crit: notable
    conf: 0.98
    # The literal store name is WhatsApp Web session-store vocabulary. The
    # generic `keyPair.privKey` member access this trait used to accept is
    # written by every Signal-protocol library while generating its own
    # prekeys, so it carried no WhatsApp-store identity and false-fired on
    # clean implementations; only the store-name artifact stays.
    if:
      type: text
      word: signed-prekey-store

  - id: registration-store-id-field
    desc: References WhatsApp registration-store ID field
    crit: notable
    conf: 0.98
    if:
      type: text
      word: signal_reg_id

  - id: me-jid-field
    desc: WhatsApp account JID field
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\b(last-wid-md|WALid)\b'

composite_rules:
  - id: whatsapp-session-key-fields
    desc: WhatsApp device session key fields
    crit: notable
    conf: 0.98
    any:
      - id: micro-behaviors/communications/messaging/whatsapp::noise-key-field
      - id: micro-behaviors/communications/messaging/whatsapp::identity-key-field
      - id: micro-behaviors/communications/messaging/whatsapp::signed-prekey-store

  - id: whatsapp-session-device-fields
    desc: WhatsApp session device identifiers
    crit: notable
    conf: 0.98
    any:
      - id: metadata/lang/source/naming/identity::registration-id-identifier
      - id: micro-behaviors/communications/messaging/whatsapp::registration-store-id-field
      - id: micro-behaviors/communications/messaging/whatsapp::me-jid-field

  - id: whatsapp-session-store-decrypt-profile
    desc: WhatsApp key-store reads and decryption APIs
    crit: notable
    conf: 0.97
    scope: archive
    for: [javascript, typescript, xpi, crx, zip]
    all:
      - id: whatsapp-session-key-fields
      - id: whatsapp-session-device-fields
      - id: micro-behaviors/data/db/access::indexeddb-open
      - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-decrypt-call-text

