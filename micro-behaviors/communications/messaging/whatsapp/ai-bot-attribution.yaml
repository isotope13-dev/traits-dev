# WhatsApp AI-bot attribution metadata. The stamp that makes a relayed message
# render as forwarded from the platform AI assistant (Meta AI), and the bot JID
# literal it names. Both are protocol-level shapes; abuse is decided by the
# objective composites that join them with a relay call.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # The AI-bot counterpart of the forwarded-newsletter stamp. A client writes
  # `forwardedAiBotMessageInfo: { botJid }` so an outgoing message renders as
  # forwarded from a WhatsApp AI bot (Meta AI). Real bot frameworks do not need
  # to impersonate the platform assistant's authorship; a library that stamps
  # it on messages it relays is forging that attribution. Neutral on its own,
  # because the stamp is also a documented field of the protocol.
  - id: whatsapp-forwarded-ai-bot-attribution
    desc: Forwarded WhatsApp AI-bot attribution metadata
    conf: 0.94
    if:
      type: text
      regex: 'forwardedAiBotMessageInfo\s*:\s*\{\s*botJid\b'

  # The platform AI bot JID as a literal (for example the Meta AI
  # `...@bot` identifier). Neutral alone; it is the identity that the
  # attribution stamp above forges when a message is relayed.
  - id: whatsapp-ai-bot-jid-literal
    desc: Literal WhatsApp AI bot JID
    conf: 0.94
    if:
      # A placeholder `0@bot` stamp (progress-step wrapper in one fork) is a
      # bot JID too, so the digit run has no lower bound of 12.
      type: string_literal
      regex: '^\d{1,20}@bot$'
