# WhatsApp Web extensions can unlock one-view media by changing message state.
# The atoms describe the implementation details; the objective joins them so
# that generic Android protocol support or ordinary UI labels are not enough.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: whatsapp-registration-payload-android-spoof
    desc: Spoofs WhatsApp Web registration as Android
    if:
      type: text
      regex: 'payload\.userAgent\.platform\s*=\s*\w+\.ANDROID[\s\S]{0,160}delete\s+payload\.webInfo'

  - id: whatsapp-view-once-flag-cleared
    desc: Clears a message's view-once flag
    if:
      type: text
      regex: 'setViewOnceFlag\s*=\s*\([^)]{0,500}\)\s*=>[\s\S]{0,500}isViewOnce[\s\S]{0,120}(false|!0)'

  - id: historical-view-once-message-store
    desc: References historical view-once messages
    crit: component
    if:
      type: text
      substr: historicalViewOnceMessages

  - id: reusable-view-once-media-model
    desc: References reusable view-once media
    crit: component
    if:
      type: text
      regex: '(exposeLoadedViewOnceModel|reusable media data)'

composite_rules:
  - id: whatsapp-view-once-historical-media-sweep
    desc: Sweeps loaded messages for reusable media
    crit: notable
    conf: 0.9
    near_bytes: 2400
    all:
      - id: historical-view-once-message-store
      - id: reusable-view-once-media-model
