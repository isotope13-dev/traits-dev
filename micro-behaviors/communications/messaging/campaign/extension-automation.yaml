# These capabilities do not establish unsolicited sends or account compromise.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, crx, xpi, zip, chrome-manifest]

composite_rules:
  - id: extension-dom-campaign-protocol
    desc: Messaging campaign IPC and DOM executor
    conf: 0.96
    scope: archive
    all:
      - id: metadata/permission/host::content-script-matches-im-web-app
      - id: micro-behaviors/communications/messaging/campaign::extension-bulk-report-send-message-protocol
      - id: micro-behaviors/communications/messaging/campaign::dom-messaging-action-executor
