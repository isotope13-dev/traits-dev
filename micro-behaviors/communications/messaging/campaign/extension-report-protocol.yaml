# Extension-local message types for driving a bulk messaging "report" or
# campaign from a content script into a logged-in web messenger (WhatsApp Web,
# Google Messages, and similar CRM integrations).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: extension-campaign-start-report-enum
    desc: START_REPORT enum in extension IPC
    crit: component
    if:
      type: text
      substr: 'START_REPORT="START_REPORT"'

  - id: extension-campaign-send-message-enum
    desc: SEND_MESSAGE enum in extension IPC
    crit: component
    if:
      type: text
      substr: 'SEND_MESSAGE="SEND_MESSAGE"'

  - id: dom-messaging-action-executor
    desc: DOM ActionExecutor for messaging web UI
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: ActionExecutor

composite_rules:
  - id: extension-bulk-report-send-message-protocol
    desc: Bulk START_REPORT and SEND_MESSAGE types
    crit: notable
    conf: 0.94
    near_bytes: 4096
    all:
      - id: extension-campaign-start-report-enum
      - id: extension-campaign-send-message-enum
