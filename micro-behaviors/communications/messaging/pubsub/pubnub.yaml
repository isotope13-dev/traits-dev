# PubNub REST routes are protocol evidence, not malicious infrastructure.
# Keep keys, channel names, timetokens, and regional host labels unconstrained.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho]
  crit: notable
  conf: 0.95

traits:
  - id: pubnub-subscribe-url
    desc: PubNub subscription API URL reference
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{1,80}\.pndsn\.com/(v2/)?subscribe/'

  - id: pubnub-publish-url
    desc: PubNub publish API URL reference
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{1,80}\.pndsn\.com/publish/'
