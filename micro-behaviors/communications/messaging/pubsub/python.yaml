# Protocol-agnostic publish/subscribe verbs on a client object. MQTT, NATS,
# Redis, ROS and cloud pub/sub clients all spell them `client.publish(...)` /
# `client.subscribe(...)`, so the matcher cannot name a protocol on its own;
# it stays a component fragment here, and the broker-specific composites
# (e.g. micro-behaviors/communications/messaging/mqtt) supply the identity by
# pairing it with the corresponding client-library import.
defaults:
  platforms: [windows, unix]
  for: [python]
  mbc: C0029

traits:
  - id: client-publish-call
    desc: Calls publish on a client object
    crit: component
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)client\.publish$'

  - id: client-subscribe-call
    desc: Calls subscribe on a client object
    crit: component
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)client\.subscribe$'
