# Protocol-agnostic publish/subscribe verbs in JVM source. MQTT, NATS,
# Redis, and cloud pub/sub clients all expose publish/subscribe methods, so
# the bare call cannot name a protocol; broker-specific composites supply
# the identity by pairing it with the client-library import.
defaults:
  platforms: [android, windows, unix]
  for: [java, kotlin]
  crit: component
  mbc: C0029

traits:
  - id: jvm-publish-method-call
    desc: Calls a method named publish
    conf: 0.7
    if:
      type: text
      regex: '\.\s*publish\s*\('

  - id: jvm-subscribe-method-call
    desc: Calls a method named subscribe
    conf: 0.7
    if:
      type: text
      regex: '\.\s*subscribe\s*\('
