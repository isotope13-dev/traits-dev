defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: produce-method-call
    desc: Calls a produce method
    # The method name alone does not identify a messaging API.
    crit: component
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '\.produce$'

composite_rules:
  - id: python-kafka-produce-call
    desc: Kafka import with produce-method calls
    conf: 0.94
    # Import alone says nothing about use. A produce call is also required;
    # this is a file-level capability, not a resolved receiver/data-flow claim.
    all:
      - id: metadata/import/python/confluent_kafka/producer
      - id: produce-method-call
