# Broker administration is a capability, not package-build metadata.
# Match executable command positions; echo and comments only document commands.
defaults:
  platforms: [linux]
  for: [shell]

traits:
  - id: rabbitmq-inline-account
    desc: Inline RabbitMQ account password
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?m)^\s*(sudo|\$SUDO)?\s*(/\S*/)?rabbitmqctl\s+add_user\s+\S+\s+[^\s$;&|`]{1,128}([\s;]|$)'
      exclude_comments: true
    unless:
      - id: metadata/path/software::proxmoxve-community-scripts

  # Configure/write/read regexes refer to resources in the selected vhost.
  # Wildcard access is ordinary broker provisioning, not all-vhost access.
  - id: rabbitmq-wildcard-permissions
    desc: RabbitMQ wildcard resource permission grant
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^\s*(sudo|\$SUDO)?\s*(/\S*/)?rabbitmqctl\s+set_permissions\s+\S+(\s+["'']\.\*["'']){3}'
      exclude_comments: true

composite_rules:
  - id: rabbitmq-open-account
    desc: RabbitMQ inline account and wildcard resource permissions
    crit: notable
    conf: 0.99
    all:
      - id: rabbitmq-inline-account
      - id: rabbitmq-wildcard-permissions

  - id: rabbitmq-service-provisioning
    desc: RabbitMQ account provisioning coexists with systemd service enablement
    crit: notable
    conf: 0.98
    all:
      - id: rabbitmq-open-account
      - id: micro-behaviors/os/service/control::systemctl-enable-command
