# Call-diversion dialing via supplementary-service (MMI) codes in mobile
# source. Both *21* and **21* activate unconditional forwarding. A bare
# service code is a neutral reference; a CALL action and activity launch
# supply the programmatic-dial context. Source literals exclude comments.
# Keep DEX string-pool references separate: they do not prove a dial call.
# Percent-escaped stars and tel: prefixes preserve the same MMI semantics.
defaults:
  platforms: [android]
  for: [java, kotlin, csharp, javascript, typescript, dex]
  crit: notable
  conf: 0.9

traits:
  - id: android-mmi-forward-activate-code
    desc: References call-forwarding MMI code
    crit: notable
    conf: 0.94
    for: [java, kotlin, csharp, javascript, typescript]
    if:
      type: literal
      regex: '(?i)^(tel:)?(\*|%2a){1,2}21(\*|%2a)'

  - id: android-dex-mmi-forward-activate-code
    desc: DEX references call-forwarding MMI code
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      regex: '(?i)^(tel:)?(\*|%2a){1,2}21(\*|%2a)'

  - id: android-mmi-forward-cancel-code
    desc: References call-forwarding cancel code
    conf: 0.88
    if:
      type: text
      substr: '##21#'

  - id: android-action-call-dial
    desc: Android CALL action near activity launch
    conf: 0.9
    for: [java, kotlin, csharp, javascript, typescript]
    if:
      type: text
      regex: '(ACTION_CALL|ActionCall|action\.CALL)[\s\S]{0,400}[sS]tartActivity\s*\('

composite_rules:
  - id: android-mmi-forward-dial
    desc: Call-forwarding code near CALL activity launch
    crit: suspicious
    conf: 0.94
    for: [java, kotlin, csharp, javascript, typescript]
    all:
      - id: android-mmi-forward-activate-code
      - id: android-action-call-dial
    near_bytes: 1400
