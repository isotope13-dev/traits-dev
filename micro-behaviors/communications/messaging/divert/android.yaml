# Call-diversion dialing via supplementary-service (MMI) codes in mobile
# source. Unconditional-forward activation (`**21*<number>#`) reroutes every
# inbound call to an attacker-chosen number without touching a setting the
# victim can see; the cancel code (`##21#`) is the matching off switch.
# Dialing either through a programmatic ACTION_CALL intent is the divert
# half of SMS-stealer implants (Corp MDM's forward_on/forward_off), and the
# same codes work from any dialer, so the matcher keys on the code strings
# and the dial mechanism rather than on any implant's C2 or package name.
defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.9

traits:
  - id: android-mmi-forward-activate-code
    desc: References call-forwarding MMI code
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: '**21*'

  - id: android-mmi-forward-cancel-code
    desc: References call-forwarding cancel code
    conf: 0.88
    if:
      type: text
      substr: '##21#'

  - id: android-action-call-dial
    desc: Dials a number through an ACTION_CALL intent
    conf: 0.9
    if:
      type: text
      regex: '(Intent\s*\.\s*ACTION_CALL|android\.intent\.action\.CALL)[\s\S]{0,400}startActivity\s*\('

composite_rules:
  - id: android-mmi-forward-dial
    desc: Dials an unconditional call-forwarding code via ACTION_CALL
    crit: suspicious
    conf: 0.94
    all:
      - id: android-mmi-forward-activate-code
      - id: android-action-call-dial
    near_bytes: 1400
