defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
traits:
- id: pytelegrambotapi-client
  desc: Constructs a pyTelegramBotAPI client
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: telebot.TeleBot
composite_rules:
  - id: python-telegram-hardcoded-bot-client
    desc: Python Telegram bot client with a hardcoded bot token
    crit: notable
    conf: 0.96
    all:
      - id: pytelegrambotapi-client
      - id: micro-behaviors/communications/http/auth::python-hardcoded-bot-token
