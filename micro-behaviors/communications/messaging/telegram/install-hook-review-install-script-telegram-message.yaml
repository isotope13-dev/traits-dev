defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-telegram-message
    desc: Install-named script has Telegram message-sending clues
    crit: notable
    conf: 0.98
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/communications/messaging/send::chat-send-message
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
