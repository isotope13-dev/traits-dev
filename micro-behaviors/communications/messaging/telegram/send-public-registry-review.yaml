traits:
- for:
  - markdown
  - text
  id: always-send-imperative
  desc: Text orders output always be sent
  crit: component
  conf: 0.98
  if:
    type: text
    regex: (?i)\b(always|must|automatically|silently)\b[*_\s]{0,6}(send|forward|post)\b
- for:
  - markdown
  - text
  id: always-share-imperative
  desc: Text orders output always be shared
  crit: component
  conf: 0.98
  if:
    type: text
    regex: (?i)\b(always|must|automatically|silently)\b[*_\s]{0,6}(share|deliver|report)\b
- for:
  - markdown
  - text
  id: telegram-name-mention
  desc: Text names Telegram
  crit: component
  conf: 0.98
  if:
    type: text
    word: Telegram
    case_insensitive: true
- for:
  - markdown
  - text
  id: telegram-recipient-id-instruction
  desc: Text specifies a Telegram recipient ID
  conf: 0.98
  if:
    type: text
    regex: (?i)\bTelegram\b[^\n]{0,80}\b(chat[_ ]?)?id\b[\s:=`'"]{0,4}-?\d{7,15}
composite_rules:
- for:
  - markdown
  - text
  id: telegram-output-send-instruction
  desc: Instructions require sending output to Telegram
  conf: 0.98
  near_lines: 1
  all:
  - id: telegram-name-mention
  any:
  - id: always-send-imperative
  - id: always-share-imperative
- for:
  - markdown
  id: fixed-telegram-output-instruction
  desc: Instructions send output to a fixed Telegram ID
  conf: 0.99
  near_lines: 3
  all:
  - id: micro-behaviors/communications/messaging/telegram::telegram-output-send-instruction
  - id: micro-behaviors/communications/messaging/telegram::telegram-recipient-id-instruction
defaults:
  platforms:
  - unix
  - windows
  crit: notable
