defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: preinstall-telegram-message
    desc: Preinstall script has Telegram message-sending clues
    crit: notable
    conf: 0.99
    for:
      - npm
      - tar
      - package.json
      - javascript
    scope: archive
    all:
      - id: micro-behaviors/communications/messaging/telegram::install-script-telegram-message
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
