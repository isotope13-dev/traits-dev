defaults:
  platforms: [unix, windows]
  for: [python, whl, zip, python-sdist]
  crit: notable
  conf: 0.98
composite_rules:
- id: goygram-account-delete-request
  desc: GoyGram with account-deletion request
  all:
  - id: micro-behaviors/communications/http/services/telegram::goygram-import-reference
  - id: micro-behaviors/communications/messaging/telegram::account-delete-request-evidence

- id: goygram-vault-glob-delete-request
  desc: Vault clue, GoyGram and deletion request
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/telegram::goygram-import-reference
  - id: micro-behaviors/communications/messaging/telegram::account-delete-request-evidence
  any:
  - id: micro-behaviors/communications/http/services/telegram::telegram-session-vault-glob
  - id: micro-behaviors/fs/path/glob::user-vault-glob-pattern
  - id: metadata/lang/source/naming/function/runtime::read-vault-name-reference

- id: goygram-detached-delete-template
  desc: GoyGram and detached deletion-code child
  for: [python]
  all:
  - id: micro-behaviors/communications/http/services/telegram::goygram-import-reference
  - id: micro-behaviors/communications/messaging/telegram::account-delete-template-child
  - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
  crit: notable
