defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98

traits:
  - id: dex-telegram-message-constructor
    desc: DEX constructs a Telegram message request
    if:
      type: symbol
      kind: call
      exact: 'Lcom/pengrad/telegrambot/request/SendMessage;-><init>'

  - id: dex-telegram-request-execute
    desc: DEX executes a Telegram bot request
    if:
      type: symbol
      kind: call
      exact: 'Lcom/pengrad/telegrambot/TelegramBot;->execute'

composite_rules:
  - id: dex-telegram-message-send
    desc: DEX constructs and submits Telegram message requests
    # The SDK's descriptors alone do not demonstrate app use. These must
    # be invocation sites, with construction close to submission.
    all:
      - id: dex-telegram-message-constructor
      - id: dex-telegram-request-execute
    near_bytes: 256
