defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: javascript-telegram-json-message
    desc: Telegram endpoint near fetch and JSON message body
    crit: notable
    conf: 0.95
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call
      - id: micro-behaviors/communications/http/request/json::json-chat-id-and-text-body
