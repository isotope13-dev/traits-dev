---
defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
traits:
- id: clipboard-telegram-text-cooccurrence
  desc: Clipboard and Telegram text co-occur
  crit: component
  conf: 0.92
  for:
  - macho
  - elf
  - binaries
  if:
    type: text
    regex: "(?i)clipboard[^\\n.]{0,48}telegram"
