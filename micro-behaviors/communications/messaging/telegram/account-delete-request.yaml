# Observe a deletion request, not whether the caller is authorized to issue it.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97
traits:
  - id: account-delete-request-call
    desc: Sends account.deleteAccount request
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute attribute: (identifier) @method)
          arguments: (argument_list
            (dictionary (pair
              key: (string (string_content) @key)
              value: (string (string_content) @request)))))
          (#eq? @method "send")
          (#eq? @key "_")
          (#eq? @request "account.deleteAccount")) @call

  - id: account-delete-template-child
    desc: Python child receives deletion-request code
    if:
      type: tree-sitter
      query: |
        ((function_definition
          body: (block
            (expression_statement (assignment
              left: (identifier) @defined
              right: (_) @source))
            (expression_statement (call
              function: (attribute attribute: (identifier) @spawn)
              arguments: (argument_list
                (list
                  . (attribute attribute: (identifier) @executable)
                  . (string (string_content) @flag)
                  . (identifier) @used))))))
          (#eq? @defined @used)
          (#eq? @spawn "Popen")
          (#eq? @executable "executable")
          (#eq? @flag "-c")
          (#match? @source "[.]send[[:space:]]*[(][[:space:]]*[{][{]?[[:space:]]*['\"]_['\"][[:space:]]*:[[:space:]]*['\"]account[.]deleteAccount['\"]")) @launch

composite_rules:
  - id: account-delete-request-evidence
    desc: Account-deletion request or child template
    any:
      - id: account-delete-request-call
      - id: account-delete-template-child
