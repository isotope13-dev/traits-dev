# Telegram MTProto account-management RPC strings in source.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: mtproto-delete-account-rpc
    desc: Telegram account.deleteAccount RPC string
    if:
      type: literal
      substr: account.deleteAccount
      exclude_docstrings: true
  - id: telegram-user-vault-glob-pattern
    desc: Glob pattern for user Telegram vault files
    if:
      type: literal
      substr: user-*.vault
      exclude_docstrings: true
  - id: goygram-read-vault-api-reference
    desc: References goygram vault reader API
    if:
      type: literal
      substr: _read_vault
      exclude_docstrings: true
  - id: hotaru-restart-hook-marker
    desc: Hotaru restart hook marker name
    if:
      type: literal
      substr: _u69_restart_hook
      exclude_docstrings: true
