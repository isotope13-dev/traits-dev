        (#eq? @name "newsletterName")
        (#match? @official "^[\"'`]WhatsApp[\"'`]$")
        (#eq? @jid "newsletterJid")
        (#match? @target "^[\"'][0-9]{10,25}@newsletter[\"']$"))
        ((assignment_expression left: (member_expression property: (property_identifier) @ctx) right: (object (pair key: (property_identifier) @forward value: (object (pair key: (property_identifier) @name value: [(string) (template_string)] @official)
        (pair key: (property_identifier) @jid value: (string) @target))))) @stamp
        (#eq? @ctx "contextInfo")
        (#eq? @forward "forwardedNewsletterMessageInfo")
        (#eq? @name "newsletterName")
        (#match? @official "^[\"'`]WhatsApp[\"'`]$")
        (#eq? @jid "newsletterJid")
        (#match? @target "^[\"'][0-9]{10,25}@newsletter[\"']$"))
        ((pair key: (property_identifier) @ctx value: (object (pair key: (property_identifier) @forward value: (object (pair key: (property_identifier) @jid value: (string) @target)
        (pair key: (property_identifier) @name value: [(string) (template_string)] @official))))) @stamp
        (#eq? @ctx "contextInfo")
        (#eq? @forward "forwardedNewsletterMessageInfo")
        (#eq? @name "newsletterName")
        (#match? @official "^[\"'`]WhatsApp[\"'`]$")
        (#eq? @jid "newsletterJid")
