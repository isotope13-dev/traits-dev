- id: whatsapp-contextinfo-extreme-forwarding
  desc: Extreme count in WhatsApp ContextInfo
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |
      [

        ((pair key: (property_identifier) @ctx
          value: (object
            (pair key: (property_identifier) @score value: (number) @count)
            (pair key: (property_identifier) @forward value: (object) @attribution))) @stamp
          (#eq? @ctx "contextInfo")
          (#eq? @score "forwardingScore")
          (#match? @count "^[0-9]{5,}$")
          (#eq? @forward "forwardedNewsletterMessageInfo")
          (#match? @attribution "newsletterJid\\s*:\\s*[\"'][0-9]{10,25}@newsletter"))
        ((pair key: (property_identifier) @ctx
          value: (object
            (pair key: (property_identifier) @forward value: (object) @attribution)
            (pair key: (property_identifier) @score value: (number) @count))) @stamp
          (#eq? @ctx "contextInfo")
          (#eq? @score "forwardingScore")
          (#match? @count "^[0-9]{5,}$")
          (#eq? @forward "forwardedNewsletterMessageInfo")
          (#match? @attribution "newsletterJid\\s*:\\s*[\"'][0-9]{10,25}@newsletter"))

        ((assignment_expression left: (member_expression property: (property_identifier) @ctx)
          right: (object
            (pair key: (property_identifier) @score value: (number) @count)
            (pair key: (property_identifier) @forward value: (object) @attribution))) @stamp
          (#eq? @ctx "contextInfo")
          (#eq? @score "forwardingScore")
          (#match? @count "^[0-9]{5,}$")
          (#eq? @forward "forwardedNewsletterMessageInfo")
          (#match? @attribution "newsletterJid\\s*:\\s*[\"'][0-9]{10,25}@newsletter"))
        ((assignment_expression left: (member_expression property: (property_identifier) @ctx)
          right: (object
            (pair key: (property_identifier) @forward value: (object) @attribution)
            (pair key: (property_identifier) @score value: (number) @count))) @stamp
          (#eq? @ctx "contextInfo")
          (#eq? @score "forwardingScore")
          (#match? @count "^[0-9]{5,}$")
          (#eq? @forward "forwardedNewsletterMessageInfo")
          (#match? @attribution "newsletterJid\\s*:\\s*[\"'][0-9]{10,25}@newsletter"))

      ]

- id: whatsapp-messagecontextinfo-extreme-forwarding
  desc: Extreme forwarding score in message context
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |
      [
        ((pair key: (property_identifier) @ctx
          value: (object
            (pair key: (property_identifier) @score value: (number) @count)))
          (#eq? @ctx "messageContextInfo")
          (#eq? @score "forwardingScore")
          (#match? @count "^[0-9]{5,}$"))
        ((assignment_expression
          left: (member_expression property: (property_identifier) @ctx)
          right: (object
            (pair key: (property_identifier) @score value: (number) @count)))
          (#eq? @ctx "messageContextInfo")
          (#eq? @score "forwardingScore")
          (#match? @count "^[0-9]{5,}$"))
      ]

- id: whatsapp-messagecontextinfo-status-broadcast
  desc: Message context carries status broadcast JID
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |
      [
        ((pair key: (property_identifier) @ctx
          value: (object
            (pair key: (property_identifier) @remote value: (string) @target)))
          (#eq? @ctx "messageContextInfo")
          (#eq? @remote "remoteJid")
          (#match? @target "^[\"']status@broadcast[\"']$"))
        ((assignment_expression
          left: (member_expression property: (property_identifier) @ctx)
          right: (object
            (pair key: (property_identifier) @remote value: (string) @target)))
          (#eq? @ctx "messageContextInfo")
          (#eq? @remote "remoteJid")
          (#match? @target "^[\"']status@broadcast[\"']$"))
      ]
