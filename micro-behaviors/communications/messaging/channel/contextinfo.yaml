        ((assignment_expression left: (member_expression object: (member_expression property: (property_identifier) @ctx) property: (property_identifier) @forward) right: (object (pair key: (property_identifier) @jid value: (string) @target)
        (pair key: (property_identifier) @name value: [(string) (template_string)] @official))) @stamp
        (#eq? @ctx "contextInfo")
