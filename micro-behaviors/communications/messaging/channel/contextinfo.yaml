defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: whatsapp-contextinfo-official-attribution
  desc: Official WhatsApp ContextInfo attribution
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      [
        ((pair key: (property_identifier) @ctx value: (object (pair key: (property_identifier) @forward value: (object (pair key: (property_identifier) @name value: [(string) (template_string)] @official)
        (pair key: (property_identifier) @jid value: (string) @target))))) @stamp
        (#eq? @ctx "contextInfo")
        (#eq? @forward "forwardedNewsletterMessageInfo")
        (#eq? @name "newsletterName")
        (#match? @official "^[\"'`]WhatsApp[\"'`]$")
        (#eq? @jid "newsletterJid")
        (#match? @target "^[\"'][0-9]{10,25}@newsletter[\"']$"))
        ((assignment_expression left: (member_expression object: (member_expression property: (property_identifier) @ctx) property: (property_identifier) @forward) right: (object (pair key: (property_identifier) @name value: [(string) (template_string)] @official)
