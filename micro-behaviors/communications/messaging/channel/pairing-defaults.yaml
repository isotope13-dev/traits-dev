# Upstream requestPairingCode explicitly supports caller-selected codes.
# A fixed default is observable configuration, not credential theft or proof
# of replay/account takeover. The user still approves linking on the phone.
# Keep both co-occurrence observations at their original scopes.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
composite_rules:
  - id: fixed-whatsapp-pairing-code-in-socket-client
    desc: Pairing-code literal and companion registration stanza
    conf: 0.97
    all:
      - id: whatsapp-hardcoded-pairing-code
      - id: whatsapp-pairing-link-code-registration
    near_bytes: 3000

  - id: archive-embedded-pairing-code-socket-default
    desc: Embedded pairing-code config and socket default
    conf: 0.96
    for: [javascript, typescript, npm, tar, zip]
    scope: archive
    all:
      - id: whatsapp-hardcoded-pairing-code
      - id: whatsapp-socket-pairing-code-config-fallback
      - id: whatsapp-pairing-link-code-registration
