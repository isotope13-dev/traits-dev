defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # The FOLLOW query-id selector on its own line. Calls whose argument is an
  # array literal split across lines do not fit the single-line query regexes
  # in whatsapp.yaml, so this atom supplies the selector alone. It is not a
  # follow by itself; composites require a second, independent leg.
  - id: whatsapp-newsletter-follow-selector-token
    desc: Names the WMex FOLLOW newsletter query-id
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bQueryIds\.FOLLOW\b'
