defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # Some forks decode an embedded invite identifier before passing it through
  # a newsletter query wrapper, so the target is not present in the call.
  - id: whatsapp-indexed-base64-roster-decode
    desc: Decodes an indexed Base64 roster value
    crit: component
    conf: 0.97
    if:
      type: text
      regex: "Buffer\\.from\\(\\s*[\\w$]+\\s*\\[\\s*[\\w$]+\\s*\\],\\s*['\"]base64['\"]\\s*\\)"
