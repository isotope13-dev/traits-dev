# WhatsApp device-linking pairing code and registration observations.
# Pairing defaults and the companion registration stanza describe the
# protocol ceremony; neutral configuration stays separate from abuse.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # A literal pairing code supplied as the socket client default.
  - id: whatsapp-hardcoded-pairing-code
    desc: Hardcoded WhatsApp pairing code
    conf: 0.93
    if:
      type: text
      regex: 'pairingCode\s*[=:]\s*["''][A-Za-z0-9]{4,12}["'']'

  # Socket-factory wrapper forwards a config default when no code is supplied.
  - id: whatsapp-socket-pairing-code-config-fallback
    desc: Pairing request defaults to config pairingCode
    conf: 0.94
    if:
      type: text
      regex: 'requestPairingCode\s*=[\s\S]{0,200}\.pairingCode'

  # The device-linking stanza of the pairing ceremony
  # (`link_code_companion_reg` carrying the wrapped ephemeral key and the
  # server auth key). Every Baileys implementation emits it when pairing;
  # neutral on its own, it binds a pairing-code observation to the actual
  # ceremony instead of a variable name appearing in comments or tests.
  - id: whatsapp-pairing-link-code-registration
    desc: Issues WhatsApp link-code companion registration
    conf: 0.95
    if:
      type: text
      substr: 'link_code_companion_reg'

  # The optional caller-supplied code of requestPairingCode defaults to a
  # fixed literal instead of a random one. Upstream leaves the parameter
  # without a literal, so a literal default is a fork-side change to the
  # pairing secret.
  - id: whatsapp-pairing-code-literal-default
    desc: requestPairingCode fixes customCode to a literal
    conf: 0.95
    if:
      type: text
      regex: 'requestPairingCode\s*\([^)]{0,240}\bcustomCode\s*=\s*["''][A-Za-z0-9]{4,12}["'']'

