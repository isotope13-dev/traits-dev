# Neutral observations; intent requires separate evidence.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  size_max: 20000000
traits:
- id: whatsapp-apache-command-vocabulary
  desc: WhatsApp Apache command vocabulary
  conf: 0.96
  if:
    type: text
    regex: '!start apache.{0,500}!stop apache'
- id: whatsapp-sql-command-vocabulary
  desc: WhatsApp SQL command vocabulary
  conf: 0.94
  if:
    type: text
    regex: '!db\s+(<db_name>|<name>).{0,80}(<query>|<SQL>)'
