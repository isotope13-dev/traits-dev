# Neutral Skype4COM channel access. Mass-message intent is composed separately
# under lateral-movement/social-engineering/spam.
defaults:
  platforms: [windows]
  for: [vbs, static-lib]

traits:
  - id: skype4com-automation-object
    desc: Instantiates Skype4COM automation client
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)CreateObject\("Skype4com\.Skype"'

