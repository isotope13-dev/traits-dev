defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  attack: T1059
  mbc: B0022
  crit: notable
  conf: 0.88

traits:
  - id: ai-agent-gateway-key
    desc: Agent gateway configuration key
    crit: notable
    conf: 0.9
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)["'']?(agent|assistant)[_-]?gateway["'']?\s*[:=]'

    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: ai-agent-control-channel-key
    desc: Agent control-channel configuration key
    crit: notable
    conf: 0.9
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '["'']?(operator|control)[_-]?channel["'']?\s*[:=]'

  - id: ai-agent-chat-platform-a
    desc: Agent chat platform endpoint marker
    crit: component
    conf: 0.82
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      # A bare identifier such as `slack` is ordinary application data.  URLs
      # identify an actual chat service endpoint (including Slack webhooks).
      regex: '(?i)\b(api\.)?(telegram|discord|slack)\.(org|com)\b'

  - id: ai-agent-chat-platform-b
    desc: Agent chat platform marker
    crit: component
    conf: 0.82
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_.-])(whatsapp|matrix\.org)([^A-Za-z0-9_.-]|$)'

  - id: ai-agent-signal-platform
    desc: Agent Signal platform marker
    crit: component
    conf: 0.82
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      # `signal` is also a common Go/POSIX package name. Require a
      # platform-specific identifier instead of treating every signal import
      # or signal-handling identifier as a chat service.
      regex: '(?i)\bsignal(\.org|-cli)\b'

  # The chat-service endpoint URLs (Telegram/Discord/Slack, WhatsApp/Signal/
  # Matrix, DingTalk/WeChat/LINE) live in
  # micro-behaviors/communications/url/reference/chat-api.yaml: the matcher
  # finds a URL, not an agent, and a Discord webhook in a clipboard stealer
  # was reading as "Agent ... API endpoint".

  # `polling` was in this alternation and named nothing about messaging: it is
  # the ordinary English word for any retry loop, so a Telegram transport's
  # doc comments — or any file that says "long polling" — read as an agent
  # command channel. Only the two bot-API names remain.
  - id: ai-agent-inbound-message-api-name
    desc: Chat-bot inbound-message API name
    crit: component
    conf: 0.86
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\b(getUpdates|onText)\b'

composite_rules:
  - id: ai-agent-chat-endpoint
    desc: Agent external chat endpoint
    crit: component
    conf: 0.88
    any:
      - id: micro-behaviors/communications/url/reference::telegram-discord-slack-api-url
      - id: micro-behaviors/communications/url/reference::whatsapp-signal-matrix-api-url
      - id: micro-behaviors/communications/url/reference::dingtalk-wechat-line-api-url

  - id: ai-agent-message-receive-operation
    desc: Agent receives chat commands
    crit: component
    conf: 0.86
    any:
      - id: micro-behaviors/communications/messaging/channel::ai-agent-inbound-message-api-name
      - id: micro-behaviors/communications/http/webhook::webhook-configuration-key
      - id: micro-behaviors/communications/http/webhook::webhook-registration-call
      - id: micro-behaviors/communications/http/webhook::webhook-route-declaration
      - id: metadata/lang/source/naming/interface::incoming-message-name-text
  - id: ai-agent-messaging-gateway-setting
    desc: Agent messaging gateway configuration
    crit: notable
    conf: 0.92
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift,
          -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    all:
      - id: micro-behaviors/communications/messaging/channel::ai-agent-gateway-key
    any:
      - id: micro-behaviors/communications/messaging/channel::ai-agent-control-channel-key
      - id: micro-behaviors/communications/messaging/channel::ai-agent-chat-platform-a
      - id: micro-behaviors/communications/messaging/channel::ai-agent-chat-platform-b
      - id: micro-behaviors/communications/messaging/channel::ai-agent-signal-platform
      - id: micro-behaviors/data/collection/map::quoted-email-field-key
      - id: micro-behaviors/communications/http/webhook::webhook-configuration-key
      - id: micro-behaviors/communications/http/webhook::webhook-registration-call
      - id: micro-behaviors/communications/http/webhook::webhook-route-declaration
    # A minified bundle may be one multi-megabyte line. Byte proximity keeps
    # unrelated payment gateway settings and chat integrations from joining.
    near_bytes: 800

  # Proximity is in bytes, not lines: a minified bundle is a handful of
  # 700 KB lines, so `near_lines` put the whole file in one window and let a
  # chat URL anywhere pair with a receive verb anywhere.
  - id: ai-agent-external-message-channel
    desc: Agent receives commands through an external messaging service
    crit: notable
    conf: 0.93
    for: [shell, python, javascript, json]
    all:
      - id: micro-behaviors/communications/messaging/channel::ai-agent-chat-endpoint
      - id: micro-behaviors/communications/messaging/channel::ai-agent-message-receive-operation
    any:
      - id: micro-behaviors/communications/messaging/channel::ai-agent-gateway-key
      - id: micro-behaviors/communications/messaging/channel::ai-agent-control-channel-key
      - id: micro-behaviors/data/config/schema::ai-agent-tools-key
      - id: micro-behaviors/data/llm/permission::ai-agent-unattended-execution-setting
    near_bytes: 800
