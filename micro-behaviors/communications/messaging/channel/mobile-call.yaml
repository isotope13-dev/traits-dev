# Mobile APIs that originate telephone or application-managed VoIP calls.
# These are neutral communication capabilities; contact-list fanout is an
# objective assembled in objectives/lateral-movement/worm/messaging/.
defaults:
  platforms: [android, ios]
  for: [java, kotlin, swift]
  crit: notable
  conf: 0.98

traits:
  - id: android-telecom-manager-import
    desc: Imports the Android TelecomManager call API
    for: [java, kotlin]
    platforms: [android]
    if:
      type: symbol
      kind: import
      exact: android.telecom.TelecomManager

  - id: android-telecom-place-call
    desc: Places an Android telecom call
    for: [java, kotlin]
    platforms: [android]
    if:
      type: symbol
      kind: call
      exact: placeCall

  - id: ios-callkit-import
    desc: Imports the Apple CallKit framework
    for: [swift]
    platforms: [ios]
    if:
      type: symbol
      kind: import
      exact: CallKit

  - id: ios-callkit-start-call-action
    desc: Creates a CallKit outbound-call action
    for: [swift]
    platforms: [ios]
    if:
      type: symbol
      kind: call
      exact: CXStartCallAction

  - id: ios-callkit-transaction-request
    desc: Requests a CallKit transaction
    for: [swift]
    platforms: [ios]
    if:
      type: text
      regex: '\.request\s*\(\s*CXTransaction\s*\('

composite_rules:
  - id: android-telecom-outbound-call
    desc: Places an outbound call through Android TelecomManager
    for: [java, kotlin]
    platforms: [android]
    all:
      - id: android-telecom-manager-import
      - id: android-telecom-place-call

  - id: ios-callkit-outbound-call
    desc: Submits an outbound call through CallKit
    for: [swift]
    platforms: [ios]
    all:
      - id: ios-callkit-import
      - id: ios-callkit-start-call-action
      - id: ios-callkit-transaction-request
    near_bytes: 1400
