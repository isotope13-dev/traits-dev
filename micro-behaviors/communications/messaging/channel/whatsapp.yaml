# WhatsApp channel/newsletter protocol operations.
# These atoms describe observable protocol fields and method calls.  Abuse is
# inferred only by objective composites that combine them with autonomous
# lifecycle triggers or concealment.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1491

traits:
  - id: whatsapp-newsletter-jid
    desc: WhatsApp newsletter channel JID
    crit: notable
    conf: 0.96
    if:
      type: string_literal
      regex: '^\d{10,20}@newsletter$'

  # The same JID, arriving at runtime instead of being written down.
  #
  # `whatsapp-newsletter-jid` above only sees a channel id baked into the
  # source. Once the id list moves to a remote config the literal is gone, and
  # what remains is the guard the loop uses to check the values it was handed —
  # `id.endsWith("@newsletter")`. Neutral on its own: any code that routes
  # WhatsApp JIDs by type writes this. It matters because it is the only
  # on-disk evidence that the code operates on newsletter ids at all when the
  # ids themselves are fetched.
  - id: whatsapp-newsletter-jid-suffix-check
    desc: Validates a WhatsApp newsletter JID suffix
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.(endsWith|includes)\s*\(\s*["'']@newsletter["'']'

  - id: whatsapp-connection-update-handler
    desc: Registers a connection.update handler
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.(on|once)\s*\(\s*["'']connection\.update["'']'

  - id: whatsapp-connection-open-branch
    desc: Branches on an open connection
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bconnection\s*!?==\s*["'']open["'']'

  - id: whatsapp-newsletter-follow-query
    desc: Issues a WhatsApp newsletter follow query
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(newsletterWMexQuery|executeWMexQueryIgnoreResponse)\s*\([^)]{0,120}FOLLOW\b'

  - id: whatsapp-newsletter-mute-query
    desc: Issues a WhatsApp newsletter mute query
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(newsletterWMexQuery|executeWMexQueryIgnoreResponse)\s*\([^)]{0,120}MUTE\b'

  - id: whatsapp-media-source-url
    desc: sourceUrl in a WhatsApp send call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bsendMessage\s*\([\s\S]{0,360}\bsourceUrl\s*:'

  - id: whatsapp-media-payload-type
    desc: Image/video payload in WhatsApp send call
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bsendMessage\s*\([\s\S]{0,220}\b(image|video)\s*[,}:]'

  - id: whatsapp-obfuscated-media-source-url
    desc: Obfuscated WhatsApp media sourceUrl
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'sourceUrl\s*:\s*String\.fromCharCode\s*\('

  - id: whatsapp-forwarded-newsletter-attribution
    desc: Forwarded WhatsApp newsletter metadata
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'forwardedNewsletterMessageInfo\s*:\s*\{[\s\S]{0,260}newsletterJid\s*:'

  - id: whatsapp-no-self-sync
    desc: Disables WhatsApp message self-sync
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bnoSelfSync\s*:\s*true\b'

  # A channel subscription written into the code rather than chosen by whoever
  # is running the bot. `newsletterFollow(jid)` taking a variable is the
  # library's own API surface; a literal JID at the call site means one
  # specific channel gains a follower from every session that opens.
  - id: whatsapp-newsletter-follow-hardcoded-jid
    desc: Follows a hardcoded WhatsApp channel
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'newsletterFollow\s*\(\s*["'']\d{10,20}@newsletter'

  # The same fixed-target operation with its JID supplied through Base64
  # decoding:
  # `newsletterWMexQuery(Buffer.from("...", "base64").toString(),
  # QueryIds.FOLLOW)`.  Keep this as a protocol capability; the autonomous
  # delayed invocation and supply-chain interpretation are composed below in
  # their respective objective directories.
  - id: whatsapp-newsletter-follow-base64-target
    desc: Follow query decodes a Base64 target
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'newsletterWMexQuery\s*\(\s*Buffer\.from\(.{20,100}base64.{0,40}FOLLOW'

  # Decode the target independently so a non-JID Base64 argument cannot make
  # the follow-call shape above look like fixed WhatsApp channel targeting.
  - id: whatsapp-newsletter-base64-jid
    desc: Base64-encoded WhatsApp newsletter JID
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '^\d{10,20}@newsletter$'

  # A channel JID baked into outgoing message metadata. WhatsApp renders the
  # `newsletter` block of a media message's context as a channel attribution,
  # so a literal here stamps one operator's channel onto messages the bot's
  # owner sends. Distinct from `whatsapp-forwarded-newsletter-attribution`,
  # which keys on the `forwardedNewsletterMessageInfo` wrapper.
  - id: whatsapp-newsletter-attribution-jid-literal
    desc: Hardcoded channel JID in message metadata
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'newsletterJid\s*:\s*["'']\d{10,20}@newsletter'
