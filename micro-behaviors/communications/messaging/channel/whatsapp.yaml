# WhatsApp channel/newsletter protocol operations.
# These atoms describe observable protocol fields and method calls.  Abuse is
# inferred only by objective composites that combine them with autonomous
# lifecycle triggers or concealment.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: whatsapp-newsletter-jid
    desc: WhatsApp newsletter channel JID
    conf: 0.96
    if:
      type: string_literal
      regex: '^\d{10,20}@newsletter$'

  # The same JID, arriving at runtime instead of being written down.
  #
  # `whatsapp-newsletter-jid` above only sees a channel id baked into the
  # source. Once the id list moves to a remote config the literal is gone, and
  # what remains is the guard the loop uses to check the values it was handed —
  # `id.endsWith("@newsletter")`. Neutral on its own: any code that routes
  # WhatsApp JIDs by type writes this. It matters because it is the only
  # on-disk evidence that the code operates on newsletter ids at all when the
  # ids themselves are fetched.
  - id: whatsapp-newsletter-jid-suffix-check
    desc: Validates a WhatsApp newsletter JID suffix
    conf: 0.94
    if:
      type: text
      regex: '\.(endsWith|includes)\s*\(\s*["'']@newsletter["'']'

  # The same JID suffix, arriving as decimal character codes instead of text.
  # Forks rebuild hardcoded channel ids with a `String.fromCharCode(...)`
  # helper so the `@newsletter` target never appears on disk (64 is `@`,
  # 110 is `n`, and so on); the channel's own digits stay numeric and are
  # not matched. Any decimal char-code array hiding this suffix matches
  # regardless of which channel is embedded.
  - id: whatsapp-newsletter-charcode-jid-suffix
    desc: Char-code array encodes newsletter JID suffix
    conf: 0.96
    if:
      type: text
      regex: '\b64,\s*110,\s*101,\s*119,\s*115,\s*108,\s*101,\s*116,\s*116,\s*101,\s*114\b'

  - id: whatsapp-connection-update-handler
    desc: Registers a connection.update handler
    conf: 0.94
    if:
      type: text
      regex: '\.(on|once)\s*\(\s*["'']connection\.update["'']'

  - id: whatsapp-connection-open-branch
    desc: Branches on an open connection
    conf: 0.94
    if:
      type: text
      regex: 'connection\s*(!==|===|==|!=)\s*["'']open["'']'

  # The Signal registration id every companion registration carries. Neutral
  # protocol vocabulary: every Signal-protocol library generates and stores
  # one, so this is an identity fact about the session surface the code
  # speaks, not credential access; only objective composites infer theft.
  # CDP and service-worker typings use the same property name for a
  # registration handle. That file is not a WhatsApp session store.
  - id: whatsapp-registration-id-field
    desc: registrationId protocol field identifier
    conf: 0.98
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - type: text
        substr: ServiceWorker.RegistrationID
    if:
      type: text
      word: registrationId

  - id: whatsapp-newsletter-follow-api-call
    desc: Calls the Baileys newsletterFollow API
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.newsletterFollow$'

  - id: whatsapp-newsletter-follow-query
    desc: Issues a WhatsApp newsletter follow query
    conf: 0.97
    if:
      type: text
      # Baileys exposes both the older newsletterWMexQuery helper and the
      # lower-level executeWMexQuery path used by library forks. The latter
      # commonly passes QueryIds.FOLLOW rather than a bare FOLLOW token.
      # The window allows one level of nested call in the target argument --
      # fork campaigns decode their channel JID at the call site
      # (Buffer.from("...", "base64").toString()), and a `)` cannot close
      # the window or every decoded-target follow escapes the matcher.
      regex: '(newsletter|execute)WMexQuery(IgnoreResponse)?\s*\([^;]{0,240}\bFOLLOW\b'

  # A follow invocation whose failures vanish: the injected connect-path
  # follow awaits newsletterFollow inside try and closes with an empty
  # catch, so a revoked session or a deleted channel never surfaces.
  # Neutral alone — best-effort fire-and-forget uses the same shape —
  # the attack reading is composed where a connect trigger drives it.
  - id: whatsapp-follow-call-error-swallowed
    desc: Follow call hides its errors
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'newsletterFollow[\s\S]{0,120}catch\s*(\([^)\n]{0,16}\))?\s*\{\s*(//[^\n]{0,20}\n)?\s*\}'

  - id: whatsapp-newsletter-mute-query
    desc: Issues a WhatsApp newsletter mute query
    conf: 0.97
    if:
      type: text
      regex: '(newsletterWMexQuery|executeWMexQueryIgnoreResponse)\s*\([^)]{0,120}MUTE\b'

  - id: whatsapp-newsletter-mute-api-call
    desc: Calls the Baileys newsletterMute API
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.newsletterMute$'

  - id: whatsapp-newsletter-react-api-call
    desc: Calls the Baileys newsletterReactMessage API
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '\.newsletterReactMessage$'

  # query_id is a protocol operation identifier, not a campaign indicator.
  # Require the newsletter target field in the same stanza: w:mex alone also
  # carries metadata reads and other benign operations.
  - id: whatsapp-newsletter-follow-operation-target
    desc: Newsletter follow operation with target field
    for: [javascript, typescript, python, go, rust, java, csharp, ruby, php]
    conf: 0.98
    if:
      type: text
      regex: 'query_id["'']?\s*:\s*["'']7871414976211147["''][\s\S]{0,300}\bnewsletter_id["'']?\s*:'

  - id: whatsapp-newsletter-invite-metadata-input
    desc: Newsletter metadata query uses invite input
    conf: 0.96
    if:
      type: text
      regex: '\btype\s*:\s*["'']INVITE["''][\s\S]{0,350}\bxwa2_newsletter_metadata\b'

  - id: whatsapp-base64-channel-invite-list
    desc: Base64 JSON array of WhatsApp channel invites
    for: [javascript, typescript, python, go, rust, java, csharp, ruby, php]
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '^\[\s*"0029V[A-Za-z0-9]{15,27}"'

  # A hand-rolled `w:mex` stanza carrying a newsletter follow, built without
  # the library's newsletterWMexQuery/executeWMexQuery helpers. Legitimate
  # call sites go through those helpers; injected code hand-rolls the stanza
  # to keep the follow off the usual call graph. Intent comes only from the
  # objective composites that pair this with autonomous triggers.
  - id: whatsapp-wmex-newsletter-query
    desc: Issues a raw w:mex newsletter query
    conf: 0.93
    if:
      type: text
      regex: '["'']w:mex["''][\s\S]{0,600}newsletter_id'

  - id: whatsapp-media-source-url
    desc: sourceUrl in a WhatsApp send call
    conf: 0.94
    if:
      type: text
      regex: '\bsendMessage\s*\([\s\S]{0,360}\bsourceUrl\s*:'

  - id: whatsapp-media-payload-type
    desc: Image/video payload in WhatsApp send call
    conf: 0.92
    if:
      type: text
      regex: '\bsendMessage\s*\([\s\S]{0,220}\b(image|video)\s*[,}:]'

  - id: whatsapp-obfuscated-media-source-url
    desc: Obfuscated WhatsApp media sourceUrl
    conf: 0.96
    if:
      type: text
      regex: 'sourceUrl\s*:\s*String\.fromCharCode\s*\('

  # Client code that writes the forwarded-newsletter wrapper itself, either
  # as an object property (`forwardedNewsletterMessageInfo: {`) or as an
  # assignment onto an outgoing message (`msg.forwardedNewsletterMessageInfo
  # = {`). The same client-authored metadata either way.
  - id: whatsapp-forwarded-newsletter-attribution
    desc: Forwarded WhatsApp newsletter metadata
    conf: 0.96
    if:
      type: text
      regex: 'forwardedNewsletterMessageInfo\s*[=:]\s*\{[\s\S]{0,260}newsletterJid\s*:'

  # The helper-built form of the same stamp: the wrapper field is assigned
  # from a resolved value instead of an inline literal object, so the field
  # name is the only on-disk evidence that this code writes the platform's
  # forwarded attribution at all. Neutral on its own -- the variable could
  # carry a caller's own channel -- the official-identity pairing is composed
  # in objectives/impact/ui/manipulation/social/.
  - id: whatsapp-forwarded-newsletter-identifier-value
    desc: Forwarded newsletter stamp from identifier
    conf: 0.95
    if:
      type: text
      regex: 'forwardedNewsletterMessageInfo\s*:\s*[A-Za-z_$][A-Za-z0-9_$.]*\s*[,}]'

  # One half of an official-channel identity preset: the platform's own
  # display name written as a preset `name` value. Common on its own; the
  # newsletter-JID pairing below makes it identity evidence.
  - id: whatsapp-official-display-name-literal
    desc: WhatsApp or Meta AI preset name literal
    conf: 0.95
    if:
      type: text
      regex: 'name\s*:\s*["''](WhatsApp|Meta AI)["'']'

  # The other half: a `jid` field holding a hardcoded newsletter JID.
  - id: whatsapp-newsletter-jid-literal-field
    desc: jid field holds a newsletter JID literal
    conf: 0.95
    if:
      type: text
      regex: '\bjid\s*:\s*["'']\d{10,25}@newsletter["'']'

  # The official channel's own display name written as a literal value of
  # `newsletterName` (quoted or template). A real "forwarded from WhatsApp"
  # attribution is applied server-side from an actual forward; a client that
  # stamps the platform's name into this field is forging the badge,
  # whatever JID accompanies it. Neutral on its own -- a standalone constant
  # could carry the name -- the forgery claim is composed in
  # objectives/impact/ui/manipulation/social/.
  - id: whatsapp-official-newsletter-name-literal
    desc: Sets newsletterName to WhatsApp literal
    conf: 0.96
    if:
      type: text
      regex: 'newsletterName\s*:\s*["''`]WhatsApp["''`]'

  # The same official-name stamp with the literal moved behind a caller
  # override (`newsletterName: opts.name || `WhatsApp``). Forks dress
  # outgoing messages in the platform's name while keeping a parameter for
  # the moments a caller supplies one; the on-disk default is still the
  # platform badge on every message sent without an explicit name. Neutral
  # on its own -- a standalone constant could carry the name -- the forgery
  # claim is composed in objectives/impact/ui/manipulation/social/.
  - id: whatsapp-official-newsletter-name-fallback
    desc: newsletterName defaults to WhatsApp literal
    conf: 0.96
    if:
      type: text
      regex: 'newsletterName\s*:\s*[^,;\n]{0,80}\|\|\s*["''`]WhatsApp["''`]'

  # The quoted-message verified-business badge written as a literal official
  # name (`verifiedBizName: 'WhatsApp'`). Clients copy this field from
  # received messages (`verifiedBizName: msg.verifiedBizName`); a literal
  # platform name on a quoted message the bot composes is badge material,
  # not parsing. Neutral on its own -- the forgery claim is composed in
  # objectives/impact/ui/manipulation/social/.
  - id: whatsapp-official-verified-biz-name-literal
    desc: Sets verifiedBizName to official name literal
    conf: 0.96
    if:
      type: text
      regex: 'verifiedBizName\s*:\s*["''](WhatsApp Business|WhatsApp|Meta AI)["''`]'

  # An identity preset pairing an official channel display name with a
  # numeric `@newsletter` JID in one object (`whatsapp: { name: 'WhatsApp',
  # jid: '120363024512399490@newsletter' }`) -- ready-made official livery
  # for outgoing message metadata. Neutral on its own -- a channel directory
  # could ship the same table -- the forgery claim is composed in
  # objectives/impact/ui/manipulation/social/.
  - id: whatsapp-official-channel-preset
    desc: Binds official channel name to newsletter JID
    conf: 0.95
    if:
      type: text
      regex: 'name\s*:\s*["''](WhatsApp|Meta AI)["''][\s\S]{0,120}jid\s*:\s*["'']\d{10,20}@newsletter'

  # A helper that assembles the forwardedNewsletterMessageInfo payload as a
  # returned object: newsletterJid, newsletterName and a server message id
  # built in one place so call sites can attach the block to outgoing
  # messages. Neutral on its own -- parsers build the same shape when
  # normalizing channel metadata; the forgery claim is composed in
  # objectives/impact/ui/manipulation/social/.
  - id: whatsapp-forwarded-newsletter-builder-fields
    desc: Builds forwarded-newsletter metadata field set
    conf: 0.93
    if:
      type: text
      regex: 'newsletterJid\s*:[\s\S]{0,180}newsletterName\s*:[\s\S]{0,120}serverMessageId\s*:'

  - id: whatsapp-no-self-sync
    desc: Disables WhatsApp message self-sync
    conf: 0.94
    if:
      type: text
      regex: '\bnoSelfSync\s*:\s*true\b'

  # A large literal records client-authored forwarding metadata. It does not
  # establish a server-rendered badge, spam, or an unauthorized send.
  - id: whatsapp-large-forwarding-score
    desc: Sets extreme WhatsApp forwarding-score literal
    conf: 0.95
    if:
      type: text
      regex: 'forwardingScore\s*:\s*\d{5,}'

  # A channel subscription written into the code rather than chosen by whoever
  # is running the bot. `newsletterFollow(jid)` taking a variable is the
  # library's own API surface; a literal JID at the call site means one
  # specific channel gains a follower from every session that opens.
  - id: whatsapp-newsletter-follow-hardcoded-jid
    desc: Follows a hardcoded WhatsApp channel
    conf: 0.96
    if:
      type: text
      regex: 'newsletterFollow\s*\(\s*["'']\d{10,20}@newsletter'

  # Legs of the preset-constant follow (composed below as
  # whatsapp-newsletter-follow-jid-constant): a channel JID written into an
  # ALL-CAPS constant, and a follow call whose target is an ALL-CAPS
  # identifier rather than a caller argument or lowercase config field.
  - id: whatsapp-newsletter-jid-caps-constant
    desc: Channel JID stored in an ALL-CAPS constant
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\b[A-Z][A-Z0-9_]{2,}\s*=\s*["'']\d{10,20}@newsletter["'']'

  - id: whatsapp-newsletter-follow-caps-target
    desc: Follow call targets an ALL-CAPS constant
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'newsletterFollow\s*\(\s*[A-Z][A-Z0-9_]{2,}\s*[,)]'

  - id: whatsapp-wmex-follow-caps-target
    desc: WMex FOLLOW query targets an ALL-CAPS constant
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'WMexQuery\w*\s*\([^;]{0,200}\b[A-Z][A-Z0-9_]{2,}\b[^;]{0,200}FOLLOW\b'

  # A message builder that fills URL or title fields from ALL-CAPS constants
  # when the caller supplies none (`url: message.offerUrl || DONATE_URL`,
  # `content.url = DONATE_URL`, `orderTitle: LIBRARY_NAME`). Upstream Baileys
  # passes caller URLs through; a fork that substitutes its own store link
  # and name promotes itself inside messages its users send. Neutral on its
  # own: a default constant is ordinary config until it rewrites somebody
  # else's outgoing content, which only composites assess.
  - id: whatsapp-outgoing-message-url-constant-default
    desc: Outgoing message URL defaults to a constant
    conf: 0.9
    if:
      type: text
      regex: '(\burl\s*:\s*.{0,60}\|\|\s*|content\.url\s*=\s*)[A-Z][A-Z_0-9]{2,}'
  # `title`/`text` are generic object fields (every dialog and UI widget
  # sets one), so they count only in the fallback form that actually
  # defaults (`title: caller.title || DEFAULT_TITLE`); a bare
  # `title: SOME_CONST` assignment is ordinary configuration. `orderTitle`
  # is the WhatsApp order-message field itself, so a direct constant
  # there is already message-specific. The constant must be the whole
  # value (terminated by `,` or `}`): a value rooted at a capitalised
  # namespace such as `title: CKEDITOR.env.ie ? ... : ...` is a
  # member/ternary expression, not a constant default.
  - id: whatsapp-outgoing-message-title-constant-default
    desc: Outgoing message title defaults to a constant
    conf: 0.9
    if:
      type: text
      regex: '\b(orderTitle\s*:\s*|(title|text)\s*:.{0,60}\|\|\s*)[A-Z][A-Z_0-9]{2,}\s*[,}]'

  # Upstream Baileys always randomizes the device-linking secret
  # (`customPairingCode ?? bytesToCrockford(randomBytes(5))`). A literal
  # assignment pins every session to one predictable code, so anyone who
  # reads the dependency knows the secret before pairing starts. Neutral on
  # its own -- fixtures and documentation quote example codes -- the attack
  # reading is composed where a socket client carries it.
  - id: whatsapp-hardcoded-pairing-code
    desc: Hardcoded WhatsApp pairing code
    conf: 0.93
    if:
      type: text
      regex: 'pairingCode\s*[=:]\s*["''][A-Za-z0-9]{4,12}["'']'

  # The socket-factory override that supplies an embedded pairingCode when the
  # caller omits customPairingCode. Neutral alone — wrappers may forward
  # caller input — the attack reading is composed with a hardcoded config
  # literal and the link-code registration stanza.
  - id: whatsapp-socket-pairing-code-config-fallback
    desc: Pairing request defaults to config pairingCode
    conf: 0.94
    if:
      type: text
      regex: 'requestPairingCode\s*=[\s\S]{0,200}\.pairingCode'

  # The device-linking stanza of the pairing ceremony
  # (`link_code_companion_reg` carrying the wrapped ephemeral key and the
  # server auth key). Every Baileys implementation emits it when pairing;
  # neutral on its own, it binds a pairing-code observation to the actual
  # ceremony instead of a variable name appearing in comments or tests.
  - id: whatsapp-pairing-link-code-registration
    desc: Issues WhatsApp link-code companion registration
    conf: 0.95
    if:
      type: text
      substr: 'link_code_companion_reg'

  # A message decoder reading the per-correspondent phone-number/LID pair off
  # an incoming stanza (`stanza.attrs.participant_pn`,
  # `.sender_lid`, `attrs["recipient_pn"]`, ...). Upstream Baileys ports this
  # addressing-mode handling to keep both addresses for one contact; reading
  # the pair is neutral protocol handling. Member matching keeps comments and
  # documentation that merely name the attributes silent; the objective
  # composite that pairs the read with out-of-band persistence states any
  # collection claim.
  - id: whatsapp-stanza-addressing-attr-read
    desc: Reads WhatsApp LID/PN addressing attributes
    conf: 0.94
    if:
      type: symbol
      kind: member
      regex: 'attrs\.(participant|sender|recipient|peer_recipient)_(pn|lid)($|\.)'

  # The same fixed-target operation with its JID supplied through Base64
  # decoding:
  # `newsletterWMexQuery(Buffer.from("...", "base64").toString(),
  # QueryIds.FOLLOW)`.  Keep this as a protocol capability; the autonomous
  # delayed invocation and supply-chain interpretation are composed below in
  # their respective objective directories.
  - id: whatsapp-newsletter-follow-base64-target
    desc: Follow query decodes a Base64 target
    conf: 0.98
    if:
      type: text
      regex: '(?is)newsletterWMexQuery\s*\([\s\S]{0,300}?base64[\s\S]{0,80}?FOLLOW\b'

  # Decode the target independently so a non-JID Base64 argument cannot make
  # the follow-call shape above look like fixed WhatsApp channel targeting.
  - id: whatsapp-newsletter-base64-jid
    desc: Base64-encoded WhatsApp newsletter JID
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '^[0-9A-Za-z]{8,32}@newsletter$'

  # A Base64 layer that still decodes to newsletter JID material before any
  # XOR or character-code rebuild hides the suffix. Forks use this to keep the
  # follow target off disk while leaving one recoverable layer for static scans.
  - id: whatsapp-newsletter-base64-encoded-suffix
    desc: Base64 layer hides newsletter JID suffix
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      substr: '@newsletter'

  # A channel JID baked into outgoing message metadata. WhatsApp renders the
  # `newsletter` block of a media message's context as a channel attribution,
  # so a literal here stamps one operator's channel onto messages the bot's
  # owner sends. Distinct from `whatsapp-forwarded-newsletter-attribution`,
  # which keys on the `forwardedNewsletterMessageInfo` wrapper.
  - id: whatsapp-newsletter-attribution-jid-literal
    desc: Hardcoded channel JID in message metadata
    conf: 0.95
    if:
      type: text
      regex: 'newsletterJid\s*:\s*([^|"''\n]{0,80}\|\|\s*)?["'']\d{10,20}@newsletter'

  # The media builder keeps caller annotations when given (`annotations ?
  # { annotations: <same expression> } : { annotations: [ ... ] }`) and
  # substitutes a library-authored block when they are absent. Upstream
  # Baileys never touches the annotations field, so this defaulting shape is
  # a fork grafting its own message content into the media pipeline. Neutral
  # on its own -- the embedded block could be any annotation; the
  # channel-attribution abuse is composed in
  # objectives/impact/ui/manipulation/social/.
  - id: whatsapp-media-annotations-default-block
    desc: Media annotations default to embedded block
    conf: 0.9
    if:
      type: text
      regex: 'annotations\s*\?\s*\{\s*annotations\s*:\s*[\w.$]+\s*\}\s*:\s*\{\s*annotations\s*:\s*\['

  # The nullish spelling of the same fallback: `annotations ?? [ {...} ]` /
  # `annotations || [ {...} ]`. Requires a populated object array -- an empty
  # `|| []` default is ordinary null-safety and stays silent.
  - id: whatsapp-media-annotations-nullish-default
    desc: Media annotations nullish-default to entries
    conf: 0.9
    if:
      type: text
      regex: 'annotations\s*(\?\?|\|\|)\s*\[\s*\{'

  # A media `annotations` array whose entry carries a `newsletter` block:
  # WhatsApp renders that block as channel attribution on the recipient's
  # screen. Channel-post clients write this for their own channel, so it is
  # neutral alone; the covert default is composed in
  # objectives/impact/ui/manipulation/social/.
  - id: whatsapp-media-annotation-newsletter
    desc: Media annotation carries channel attribution
    conf: 0.92
    if:
      type: text
      regex: 'annotations\s*:\s*\[\s*\{[\s\S]{0,800}?\bnewsletter\s*:\s*\{'

  # Forks stash the follow target in a local before calling newsletterWMexQuery
  # with QueryIds.FOLLOW, instead of the public newsletterFollow(jid) API.
  - id: whatsapp-newsletter-channel-id-literal
    desc: Hardcoded WhatsApp newsletter channelId variable
    conf: 0.96
    if:
      type: text
      regex: 'channelId\s*=\s*["'']\d{10,20}@newsletter'

  - id: whatsapp-ws-login-success-handler
    desc: Handles WhatsApp WebSocket login success
    conf: 0.94
    if:
      type: text
      regex: '\.on\s*\(\s*["'']CB:success["'']'

  # The default-on shape of an auto-follow: the caller's autoFollowChannels
  # config wins, otherwise a one-element list holding a module constant (the
  # developer's own channel) is used. Neutral alone; a follow that runs on
  # session open is what the objective composite adds.
  - id: whatsapp-auto-follow-config-constant-fallback
    desc: Auto-follow config defaults to constant channel
    conf: 0.95
    if:
      type: text
      regex: 'autoFollowChannels\b[^;]{0,300}\|\|\s*\[\s*[A-Z][A-Z_]{3,}\s*\]'

  # The developer's constant appended to whatever follow set the caller
  # configured, so a caller who supplies their own channels still gets this
  # one. Neutral alone; the session-open trigger and the embedded channel id
  # are what the objective composite adds. Only matches a constant spelled
  # DEFAULT_*CHANNEL*, so a renamed constant corroborates nothing here.
  - id: whatsapp-default-channel-appended-to-follow-set
    desc: Default channel constant added to follow set
    conf: 0.95
    if:
      type: text
      regex: '\.add\(\s*(this\.)?DEFAULT_[A-Z_]*CHANNEL[A-Z_]*\s*\)'

  - id: whatsapp-default-auto-follow-channel-list
    desc: Default auto-follow channel JID list constant
    conf: 0.97
    if:
      type: text
      # Only an array literal is a list. A single JID constant is
      # whatsapp-default-auto-follow-newsletter-jid below; matching it
      # here counted one hardcoded channel as both a list and a JID.
      regex: 'DEFAULT_AUTO_FOLLOW_CHANNELS\s*=\s*\[\s*["'']\d{10,20}@newsletter'

  - id: whatsapp-auto-follow-newsletter-jids-array
    desc: AUTO_FOLLOW_NEWSLETTER_JIDS preset channel list
    conf: 0.97
    if:
      type: text
      regex: 'AUTO_FOLLOW_NEWSLETTER_JIDS\s*=\s*\[\s*["'']\d{10,20}@newsletter'

  - id: whatsapp-newsletter-ids-embedded-array
    desc: Embeds channel JIDs in a newsletterIds list
    conf: 0.96
    if:
      type: text
      regex: '\bnewsletterIds\s*:\s*\[\s*["'']\d{10,20}@newsletter'

  - id: whatsapp-auto-follow-channels-invocation
    desc: Invokes autoFollowChannels on the socket
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bautoFollowChannels\s*\(\s*sock\s*\)'

  - id: whatsapp-auto-follow-remote-list-url
    desc: Remote URL constant for auto-follow channel list
    conf: 0.96
    if:
      type: text
      regex: 'AUTO_FOLLOW_(NEWSLETTER_)?LIST_URL\s*=\s*["'']https?://'

  - id: whatsapp-default-auto-follow-newsletter-jid
    desc: Auto-follow newsletter or channel JID constant
    conf: 0.97
    if:
      type: text
      # Family spellings observed so far: DEFAULT_AUTO_FOLLOW_NEWSLETTER_JID
      # (@fer2809fl/baileys 7.0.6) and AUTO_FOLLOW_CHANNEL_JID
      # (@zanta/baileys 1.0.0). The literal JID on the same line is the
      # content evidence; the constant name only corroborates it.
      regex: '\b(DEFAULT_)?AUTO_FOLLOW_(NEWSLETTER_|CHANNEL_)?JID\s*=\s*["'']\d{10,20}@newsletter'

  # The same fixed-target follow without the library's helper names: an
  # aliased low-level call (`wmex`, a renamed `executeWMexQuery` import)
  # carrying a `newsletter_id` target beside a FOLLOW operation token.
  # Legitimate call sites use the same shape through the public
  # `newsletterFollow(jid)` wrapper, so this stays a neutral capability;
  # objective composites pair it with autonomous triggers.
  - id: whatsapp-newsletter-follow-token-target
    desc: Follow token call carries newsletter target
    conf: 0.97
    if:
      type: text
      regex: '\{\s*newsletter_id\s*:[\s\S]{0,160}\bFOLLOW\b'

  - id: whatsapp-auto-follow-newsletter-config-key
    desc: Default config sets autoFollowNewsletterJid
    conf: 0.97
    if:
      type: text
      regex: '\bautoFollowNewsletterJid\s*:\s*["'']\d{10,20}@newsletter'

  - id: whatsapp-auto-follow-remote-github-list
    desc: Fetches newsletter JIDs from GitHub raw
    conf: 0.96
    if:
      type: text
      regex: 'raw\.githubusercontent\.com[\s\S]{0,160}newsletter'

  - id: whatsapp-trigger-auto-follow-on-connect
    desc: Defers auto-follow until connection opens
    conf: 0.97
    if:
      type: text
      regex: 'triggerAutoFollow[\s\S]{0,900}connection\.update'

  - id: whatsapp-newsletter-follow-periodic-timer
    desc: Schedules a repeated newsletter follow callback
    conf: 0.96
    if:
      type: text
      regex: 'setInterval[\s\S]{0,500}performNewsletterFollow'

  - id: whatsapp-auto-follow-ninety-second-delay
    desc: Auto-follow waits about ninety seconds
    conf: 0.94
    if:
      type: text
      regex: 'triggerAutoFollow[\s\S]{0,500}: 90000'

  - id: whatsapp-auto-follow-channel-invite-code
    desc: Hardcoded WhatsApp channel invite code
    conf: 0.96
    if:
      type: text
      regex: 'AUTO_FOLLOW_CHANNEL_INVITE\s*=\s*["'']0029V[A-Za-z0-9]{15,27}["'']'

  - id: whatsapp-newsletter-follow-literal-target
    desc: Follow query takes a literal channel JID
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: newsletterWMexQuery
      arg:
        index: 0
        kind: string
        regex: '^\d{10,20}@newsletter$'

  # The benign side of the hardcoded-target line: the follow target arrives
  # from caller configuration instead of being written into the module
  # (`follow(config.channel)`). Neutral on its own; hardcoded-target
  # composites use it to keep parameterized follows out of convictions.
  # Only explicit external sources count: a local loop variable carrying an
  # embedded literal (the implant shape) is not configuration.
  - id: whatsapp-newsletter-follow-external-target
    desc: Follow target comes from caller configuration
    conf: 0.94
    if:
      type: text
      regex: 'newsletter(Follow|WMexQuery)\s?\([^)]{0,40}\b(config|options|settings|params|args)\s*\.'

  - id: whatsapp-auto-follow-default-config
    desc: Default config assigns auto-follow channels
    conf: 0.98
    if:
      type: text
      regex: '\bautoFollowChannels\s*:\s*DEFAULT_AUTO_FOLLOW_CHANNELS\b'

  - id: whatsapp-default-config-merge
    desc: Socket config inherits connection defaults
    conf: 0.98
    if:
      type: text
      regex: '\.\.\.DEFAULT_CONNECTION_CONFIG\s*,\s*\.\.\.config\b'

  # A low-level `iq` stanza against the `newsletter` namespace carrying a
  # subscribe tag. The public `newsletterFollow(jid)` helper builds this
  # internally, so user-driven follows show the helper call; injected
  # auto-follows hand-roll the stanza to stay off the usual call graph.
  # Neutral on its own: any newsletter client subscribes.
  - id: whatsapp-newsletter-subscribe-stanza
    desc: Sends a newsletter subscribe stanza
    conf: 0.93
    if:
      type: text
      regex: 'xmlns\s*:\s*["'']newsletter["''][\s\S]{0,500}["'']subscribe["'']'

  # Upstream Baileys fetches its version manifest from a raw content URL.
  # A fork that repoints `fetchLatestBaileysVersion` at a browsable
  # `github.com/<owner>/<repo>/...` page URL fetches HTML instead of JSON,
  # so the check silently falls back while looking maintained. The function
  # name is the library's own stable API, not attacker wording; only the
  # HTML-page endpoint is the tamper signal.
  - id: baileys-version-check-github-page-url
    desc: Baileys version check fetches GitHub page URL
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: 'fetchLatestBaileysVersion[\s\S]{0,800}https://github\.com/'

  # One Base64 literal inside a nested function is decoded twice, once for
  # the literal and once when that function body is re-parsed. A decoded
  # count of two is therefore one channel. Two source literals are the roster.
  - id: whatsapp-two-long-base64-literals
    desc: Two long Base64 string literals
    crit: component
    conf: 0.8
    count_min: 2
    if:
      type: text
      regex: '[''"][A-Za-z0-9+/]{24,}={0,2}[''"]'

  # The unconcealed sibling of the Base64 roster above: two or more numeric
  # `@newsletter` JID literals written in the open. The public Baileys API
  # surface carries no hardcoded channels, so a literal roster is
  # fork-injected growth material. Neutral on its own: only composites
  # infer the follow. The singular `whatsapp-newsletter-jid` atom above
  # keeps single-target detection; this one counts the roster.
  # Counted over raw text: a string_literal count also sees the same JID again
  # when it sits inside a template literal that is re-parsed as embedded
  # source, so one hardcoded channel read as a two-entry roster.
  - id: whatsapp-plaintext-newsletter-jid-roster
    desc: Multiple plaintext newsletter JID literals
    conf: 0.96
    count_min: 2
    if:
      type: text
      regex: '["''`]\d{10,20}@newsletter["''`]'

composite_rules:
  - id: whatsapp-newsletter-follow-invocation
    desc: Invokes a WhatsApp newsletter follow
    conf: 0.97
    any:
      - id: whatsapp-newsletter-follow-query
      - id: whatsapp-newsletter-follow-api-call
      - id: whatsapp-newsletter-follow-token-target

  # The preset-constant form of whatsapp-newsletter-follow-hardcoded-jid:
  # the channel JID sits in an ALL-CAPS module constant and the follow
  # helper or wmex FOLLOW query takes that constant as its target, so no
  # literal appears at the call site. A follow driven by a caller argument
  # names no ALL-CAPS identifier at the call.
  # Worked example: @smart-dev-wa/baileys 1.0.0 lib/Socket/newsletter.js
  # (SAIRIDEV_NEWSLETTER).
  - id: whatsapp-newsletter-follow-jid-constant
    desc: Follows WhatsApp channel held in preset constant
    conf: 0.9
    all:
      - id: whatsapp-newsletter-jid-caps-constant
    any:
      - id: whatsapp-newsletter-follow-caps-target
      - id: whatsapp-wmex-follow-caps-target
    needs: 1
    near_bytes: 3000

  # An official-channel identity preset: the platform's own display name
  # ("WhatsApp" / "Meta AI") paired with a hardcoded newsletter JID, ready to
  # be resolved into outgoing message metadata. A channel catalog could hold
  # the pair, so this stays a neutral identity observation; the forgery
  # claim is composed in objectives/impact/ui/manipulation/social/.
  - id: whatsapp-official-channel-identity-preset
    desc: Official WhatsApp channel identity preset
    conf: 0.96
    all:
      - id: whatsapp-official-display-name-literal
      - id: whatsapp-newsletter-jid-literal-field
    near_bytes: 200

  # Several Base64 literals decode to newsletter JIDs: an embedded channel
  # roster rather than a single follow target. The decoded-string count is
  # not the roster, because one nested literal is emitted twice. Neutral on
  # its own: only composites infer the follow.
  - id: whatsapp-base64-newsletter-jid-roster
    desc: Multiple Base64 blobs hide newsletter JIDs
    conf: 0.97
    all:
      - id: whatsapp-newsletter-base64-encoded-suffix
      - id: whatsapp-two-long-base64-literals

  # An embedded channel roster in either form: plaintext `@newsletter`
  # literals or Base64 blobs that decode to them. Lets roster-driven follow
  # composites stay agnostic to the concealment layer.
  - id: whatsapp-newsletter-jid-roster
    desc: Embeds a roster of WhatsApp channel JIDs
    conf: 0.96
    any:
      - id: whatsapp-plaintext-newsletter-jid-roster
      - id: whatsapp-base64-newsletter-jid-roster

  # The caller-omission annotation fallback in either spelling: the ternary
  # pass-through or the nullish default. Neutral on its own; the channel
  # stamp is composed with the newsletter annotation block.
  - id: whatsapp-media-annotation-default-fallback
    desc: Media annotations fall back to embedded entries
    conf: 0.9
    any:
      - id: whatsapp-media-annotations-default-block
      - id: whatsapp-media-annotations-nullish-default

  # The `newsletterFollow` / `newsletterMute` method names, rebuilt from
  # decimal character-code arrays instead of written as text. Each composite
  # requires the `newsletter` stem and the method tail in the same array
  # region: either word alone is only a concealed English word, while the
  # adjacent pair establishes the concealed Baileys method name.
  - id: whatsapp-newsletter-follow-charcode-name
    desc: Char-code arrays spell newsletterFollow
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-newsletter
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-follow
    near_bytes: 1200

  - id: whatsapp-newsletter-mute-charcode-name
    desc: Char-code arrays spell newsletterMute
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-newsletter
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-mute
    near_bytes: 1200

  # Session-open wiring near a follow query. Neither the target's source
  # (caller config versus fork-embedded constant) nor a loop is established
  # here; consumers supply that context.
  - id: whatsapp-session-open-follow-query
    desc: Session-open handler near a follow query
    conf: 0.98
    all:
      - id: whatsapp-connection-update-handler
      - id: whatsapp-connection-open-branch
      - id: whatsapp-newsletter-follow-query
    near_bytes: 3500

  # The sidecar-module wiring: connection.update open calls an imported
  # autoFollowChannels(sock) helper instead of inlining the follow loop.
  # Worked example: @randev404/baileys 1.0.0 lib/Socket/index.js.
  - id: whatsapp-connection-open-auto-follow-channels
    desc: Session open invokes autoFollowChannels helper
    conf: 0.97
    all:
      - id: whatsapp-connection-update-handler
      - id: whatsapp-connection-open-branch
      - id: whatsapp-auto-follow-channels-invocation
    near_bytes: 2500
