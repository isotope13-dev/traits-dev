# WhatsApp channel/newsletter protocol operations.
# These atoms describe observable protocol fields and method calls.  Abuse is
# inferred only by objective composites that combine them with autonomous
# lifecycle triggers or concealment.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: whatsapp-newsletter-jid
    desc: WhatsApp newsletter channel JID
    conf: 0.96
    if:
      type: string_literal
      regex: '^\d{10,20}@newsletter$'

  # The same JID, arriving at runtime instead of being written down.
  #
  # `whatsapp-newsletter-jid` above only sees a channel id baked into the
  # source. Once the id list moves to a remote config the literal is gone, and
  # what remains is the guard the loop uses to check the values it was handed —
  # `id.endsWith("@newsletter")`. Neutral on its own: any code that routes
  # WhatsApp JIDs by type writes this. It matters because it is the only
  # on-disk evidence that the code operates on newsletter ids at all when the
  # ids themselves are fetched.
  - id: whatsapp-newsletter-jid-suffix-check
    desc: Validates a WhatsApp newsletter JID suffix
    conf: 0.94
    if:
      type: text
      regex: '\.(endsWith|includes)\s*\(\s*["'']@newsletter["'']'

  # The same JID suffix, arriving as decimal character codes instead of text.
  # Forks rebuild hardcoded channel ids with a `String.fromCharCode(...)`
  # helper so the `@newsletter` target never appears on disk (64 is `@`,
  # 110 is `n`, and so on); the channel's own digits stay numeric and are
  # not matched. Any decimal char-code array hiding this suffix matches
  # regardless of which channel is embedded.
  - id: whatsapp-newsletter-charcode-jid-suffix
    desc: Char-code array encodes newsletter JID suffix
    conf: 0.96
    if:
      type: text
      regex: '\b64,\s*110,\s*101,\s*119,\s*115,\s*108,\s*101,\s*116,\s*116,\s*101,\s*114\b'

  - id: whatsapp-connection-update-handler
    desc: Registers a connection.update handler
    conf: 0.94
    if:
      type: text
      regex: '\.(on|once)\s*\(\s*["'']connection\.update["'']'

  - id: whatsapp-connection-open-branch
    desc: Branches on an open connection
    conf: 0.94
    if:
      type: text
      regex: 'connection\s*(!==|===|==|!=)\s*["'']open["'']'

  - id: whatsapp-newsletter-follow-api-call
    desc: Calls the Baileys newsletterFollow API
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.newsletterFollow$'

  - id: whatsapp-newsletter-follow-query
    desc: Issues a WhatsApp newsletter follow query
    conf: 0.97
    if:
      type: text
      # Baileys exposes both the older newsletterWMexQuery helper and the
      # lower-level executeWMexQuery path used by library forks. The latter
      # commonly passes QueryIds.FOLLOW rather than a bare FOLLOW token.
      # The window allows one level of nested call in the target argument --
      # fork campaigns decode their channel JID at the call site
      # (Buffer.from("...", "base64").toString()), and a `)` cannot close
      # the window or every decoded-target follow escapes the matcher.
      regex: '(newsletterWMexQuery|executeWMexQuery(IgnoreResponse)?)\s*\([^;]{0,240}FOLLOW\b'

  - id: whatsapp-newsletter-mute-query
    desc: Issues a WhatsApp newsletter mute query
    conf: 0.97
    if:
      type: text
      regex: '(newsletterWMexQuery|executeWMexQueryIgnoreResponse)\s*\([^)]{0,120}MUTE\b'

  - id: whatsapp-newsletter-mute-api-call
    desc: Calls the Baileys newsletterMute API
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.newsletterMute$'

  # query_id is a protocol operation identifier, not a campaign indicator.
  # Require the newsletter target field in the same stanza: w:mex alone also
  # carries metadata reads and other benign operations.
  - id: whatsapp-newsletter-follow-operation-target
    desc: Newsletter follow operation with target field
    for: [javascript, typescript, python, go, rust, java, csharp, ruby, php]
    conf: 0.98
    if:
      type: text
      regex: 'query_id["'']?\s*:\s*["'']7871414976211147["''][\s\S]{0,300}\bnewsletter_id["'']?\s*:'

  - id: whatsapp-newsletter-invite-metadata-input
    desc: Newsletter metadata query uses invite input
    conf: 0.96
    if:
      type: text
      regex: '\btype\s*:\s*["'']INVITE["''][\s\S]{0,350}\bxwa2_newsletter_metadata\b'

  - id: whatsapp-base64-channel-invite-list
    desc: Base64 JSON array of WhatsApp channel invites
    for: [javascript, typescript, python, go, rust, java, csharp, ruby, php]
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '^\[\s*"0029V[A-Za-z0-9]{15,27}"'

  # A hand-rolled `w:mex` stanza carrying a newsletter follow, built without
  # the library's newsletterWMexQuery/executeWMexQuery helpers. Legitimate
  # call sites go through those helpers; injected code hand-rolls the stanza
  # to keep the follow off the usual call graph. Intent comes only from the
  # objective composites that pair this with autonomous triggers.
  - id: whatsapp-wmex-newsletter-query
    desc: Issues a raw w:mex newsletter query
    conf: 0.93
    if:
      type: text
      regex: '["'']w:mex["''][\s\S]{0,600}newsletter_id'

  - id: whatsapp-media-source-url
    desc: sourceUrl in a WhatsApp send call
    conf: 0.94
    if:
      type: text
      regex: '\bsendMessage\s*\([\s\S]{0,360}\bsourceUrl\s*:'

  - id: whatsapp-media-payload-type
    desc: Image/video payload in WhatsApp send call
    conf: 0.92
    if:
      type: text
      regex: '\bsendMessage\s*\([\s\S]{0,220}\b(image|video)\s*[,}:]'

  - id: whatsapp-obfuscated-media-source-url
    desc: Obfuscated WhatsApp media sourceUrl
    conf: 0.96
    if:
      type: text
      regex: 'sourceUrl\s*:\s*String\.fromCharCode\s*\('

  # Client code that writes the forwarded-newsletter wrapper itself, either
  # as an object property (`forwardedNewsletterMessageInfo: {`) or as an
  # assignment onto an outgoing message (`msg.forwardedNewsletterMessageInfo
  # = {`). The same client-authored metadata either way.
  - id: whatsapp-forwarded-newsletter-attribution
    desc: Forwarded WhatsApp newsletter metadata
    conf: 0.96
    if:
      type: text
      regex: 'forwardedNewsletterMessageInfo\s*[=:]\s*\{[\s\S]{0,260}newsletterJid\s*:'

  # The official channel's own display name written as a literal value of
  # `newsletterName` (quoted or template). A real "forwarded from WhatsApp"
  # attribution is applied server-side from an actual forward; a client that
  # stamps the platform's name into this field is forging the badge,
  # whatever JID accompanies it. Neutral on its own -- a standalone constant
  # could carry the name -- the forgery claim is composed in
  # objectives/impact/ui/manipulation/social/.
  - id: whatsapp-official-newsletter-name-literal
    desc: Sets newsletterName to WhatsApp literal
    conf: 0.96
    if:
      type: text
      regex: 'newsletterName\s*:\s*["''`]WhatsApp["''`]'

  - id: whatsapp-no-self-sync
    desc: Disables WhatsApp message self-sync
    conf: 0.94
    if:
      type: text
      regex: '\bnoSelfSync\s*:\s*true\b'

  # A large literal records client-authored forwarding metadata. It does not
  # establish a server-rendered badge, spam, or an unauthorized send.
  - id: whatsapp-large-forwarding-score
    desc: Sets extreme WhatsApp forwarding-score literal
    conf: 0.95
    if:
      type: text
      regex: 'forwardingScore\s*:\s*\d{5,}'

  # A channel subscription written into the code rather than chosen by whoever
  # is running the bot. `newsletterFollow(jid)` taking a variable is the
  # library's own API surface; a literal JID at the call site means one
  # specific channel gains a follower from every session that opens.
  - id: whatsapp-newsletter-follow-hardcoded-jid
    desc: Follows a hardcoded WhatsApp channel
    conf: 0.96
    if:
      type: text
      regex: 'newsletterFollow\s*\(\s*["'']\d{10,20}@newsletter'

  # Upstream Baileys always randomizes the device-linking secret
  # (`customPairingCode ?? bytesToCrockford(randomBytes(5))`). A literal
  # assignment pins every session to one predictable code, so anyone who
  # reads the dependency knows the secret before pairing starts. Neutral on
  # its own -- fixtures and documentation quote example codes -- the attack
  # reading is composed where a socket client carries it.
  - id: whatsapp-hardcoded-pairing-code
    desc: Hardcoded WhatsApp pairing code
    conf: 0.93
    if:
      type: text
      regex: 'pairingCode\s*=\s*["''][A-Za-z0-9]{4,12}["'']'

  # The device-linking stanza of the pairing ceremony
  # (`link_code_companion_reg` carrying the wrapped ephemeral key and the
  # server auth key). Every Baileys implementation emits it when pairing;
  # neutral on its own, it binds a pairing-code observation to the actual
  # ceremony instead of a variable name appearing in comments or tests.
  - id: whatsapp-pairing-link-code-registration
    desc: Issues WhatsApp link-code companion registration
    conf: 0.95
    if:
      type: text
      substr: 'link_code_companion_reg'

  # The same fixed-target operation with its JID supplied through Base64
  # decoding:
  # `newsletterWMexQuery(Buffer.from("...", "base64").toString(),
  # QueryIds.FOLLOW)`.  Keep this as a protocol capability; the autonomous
  # delayed invocation and supply-chain interpretation are composed below in
  # their respective objective directories.
  - id: whatsapp-newsletter-follow-base64-target
    desc: Follow query decodes a Base64 target
    conf: 0.98
    if:
      type: text
      regex: '(?is)newsletterWMexQuery\s*\([\s\S]{0,300}?base64[\s\S]{0,80}?FOLLOW\b'

  # Decode the target independently so a non-JID Base64 argument cannot make
  # the follow-call shape above look like fixed WhatsApp channel targeting.
  - id: whatsapp-newsletter-base64-jid
    desc: Base64-encoded WhatsApp newsletter JID
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '^[0-9A-Za-z]{8,32}@newsletter$'

  # A Base64 layer that still decodes to newsletter JID material before any
  # XOR or character-code rebuild hides the suffix. Forks use this to keep the
  # follow target off disk while leaving one recoverable layer for static scans.
  - id: whatsapp-newsletter-base64-encoded-suffix
    desc: Base64 layer hides newsletter JID suffix
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      substr: '@newsletter'

  # A channel JID baked into outgoing message metadata. WhatsApp renders the
  # `newsletter` block of a media message's context as a channel attribution,
  # so a literal here stamps one operator's channel onto messages the bot's
  # owner sends. Distinct from `whatsapp-forwarded-newsletter-attribution`,
  # which keys on the `forwardedNewsletterMessageInfo` wrapper.
  - id: whatsapp-newsletter-attribution-jid-literal
    desc: Hardcoded channel JID in message metadata
    conf: 0.95
    if:
      type: text
      regex: 'newsletterJid\s*:\s*([^|"''\n]{0,80}\|\|\s*)?["'']\d{10,20}@newsletter'

  # Forks stash the follow target in a local before calling newsletterWMexQuery
  # with QueryIds.FOLLOW, instead of the public newsletterFollow(jid) API.
  - id: whatsapp-newsletter-channel-id-literal
    desc: Hardcoded WhatsApp newsletter channelId variable
    conf: 0.96
    if:
      type: text
      regex: 'channelId\s*=\s*["'']\d{10,20}@newsletter'

  - id: whatsapp-ws-login-success-handler
    desc: Handles WhatsApp WebSocket login success
    conf: 0.94
    if:
      type: text
      regex: '\.on\s*\(\s*["'']CB:success["'']'

  - id: whatsapp-default-auto-follow-channel-list
    desc: Default auto-follow channel JID list constant
    conf: 0.97
    if:
      type: text
      regex: 'DEFAULT_AUTO_FOLLOW_(CHANNELS\s*=\s*\[\s*|NEWSLETTER_JID\s*=\s*)["'']\d{10,20}@newsletter'

  - id: whatsapp-auto-follow-remote-list-url
    desc: Remote URL constant for auto-follow channel list
    conf: 0.96
    if:
      type: text
      regex: 'AUTO_FOLLOW_(NEWSLETTER_)?LIST_URL\s*=\s*["'']https?://'

  - id: whatsapp-default-auto-follow-newsletter-jid
    desc: Default auto-follow newsletter JID constant
    conf: 0.97
    if:
      type: text
      regex: 'DEFAULT_AUTO_FOLLOW_NEWSLETTER_JID\s*=\s*["'']\d{10,20}@newsletter'

  - id: whatsapp-auto-follow-newsletter-config-key
    desc: Default config sets autoFollowNewsletterJid
    conf: 0.97
    if:
      type: text
      regex: '\bautoFollowNewsletterJid\s*:\s*["'']\d{10,20}@newsletter'

  - id: whatsapp-auto-follow-remote-github-list
    desc: Fetches newsletter JIDs from GitHub raw
    conf: 0.96
    if:
      type: text
      regex: 'raw\.githubusercontent\.com[\s\S]{0,160}newsletter'

  - id: whatsapp-trigger-auto-follow-on-connect
    desc: Defers auto-follow until connection opens
    conf: 0.97
    if:
      type: text
      regex: 'triggerAutoFollow[\s\S]{0,900}connection\.update'

  - id: whatsapp-auto-follow-ninety-second-delay
    desc: Auto-follow waits about ninety seconds
    conf: 0.94
    if:
      type: text
      regex: 'triggerAutoFollow[\s\S]{0,500}: 90000'

  - id: whatsapp-auto-follow-channel-invite-code
    desc: Hardcoded WhatsApp channel invite code
    conf: 0.96
    if:
      type: text
      regex: 'AUTO_FOLLOW_CHANNEL_INVITE\s*=\s*["'']0029V[A-Za-z0-9]{15,27}["'']'

  - id: whatsapp-newsletter-follow-literal-target
    desc: Follow query takes a literal channel JID
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: newsletterWMexQuery
      arg:
        index: 0
        kind: string
        regex: '^\d{10,20}@newsletter$'

  - id: whatsapp-auto-follow-default-config
    desc: Default config assigns auto-follow channels
    conf: 0.98
    if:
      type: text
      regex: '\bautoFollowChannels\s*:\s*DEFAULT_AUTO_FOLLOW_CHANNELS\b'

  - id: whatsapp-default-config-merge
    desc: Socket config inherits connection defaults
    conf: 0.98
    if:
      type: text
      regex: '\.\.\.DEFAULT_CONNECTION_CONFIG\s*,\s*\.\.\.config\b'

  # A low-level `iq` stanza against the `newsletter` namespace carrying a
  # subscribe tag. The public `newsletterFollow(jid)` helper builds this
  # internally, so user-driven follows show the helper call; injected
  # auto-follows hand-roll the stanza to stay off the usual call graph.
  # Neutral on its own: any newsletter client subscribes.
  - id: whatsapp-newsletter-subscribe-stanza
    desc: Sends a newsletter subscribe stanza
    conf: 0.93
    if:
      type: text
      regex: 'xmlns\s*:\s*["'']newsletter["''][\s\S]{0,500}["'']subscribe["'']'

  # Upstream Baileys fetches its version manifest from a raw content URL.
  # A fork that repoints `fetchLatestBaileysVersion` at a browsable
  # `github.com/<owner>/<repo>/...` page URL fetches HTML instead of JSON,
  # so the check silently falls back while looking maintained. The function
  # name is the library's own stable API, not attacker wording; only the
  # HTML-page endpoint is the tamper signal.
  - id: baileys-version-check-github-page-url
    desc: Baileys version check fetches GitHub page URL
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: 'fetchLatestBaileysVersion[\s\S]{0,800}https://github\.com/'

composite_rules:
  - id: whatsapp-newsletter-follow-invocation
    desc: Invokes a WhatsApp newsletter follow
    conf: 0.97
    any:
      - id: whatsapp-newsletter-follow-query
      - id: whatsapp-newsletter-follow-api-call

  # The `newsletterFollow` / `newsletterMute` method names, rebuilt from
  # decimal character-code arrays instead of written as text. Each composite
  # requires the `newsletter` stem and the method tail in the same array
  # region: either word alone is only a concealed English word, while the
  # adjacent pair establishes the concealed Baileys method name.
  - id: whatsapp-newsletter-follow-charcode-name
    desc: Char-code arrays spell newsletterFollow
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-newsletter
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-follow
    near_bytes: 1200

  - id: whatsapp-newsletter-mute-charcode-name
    desc: Char-code arrays spell newsletterMute
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-newsletter
      - id: micro-behaviors/data/decode/charset::charcode-run-spells-mute
    near_bytes: 1200

  - id: whatsapp-config-channel-follow-loop
    desc: Follows configured channels on session open
    conf: 0.98
    all:
      - id: whatsapp-connection-update-handler
      - id: whatsapp-connection-open-branch
      - id: whatsapp-newsletter-follow-query
    near_bytes: 3500
