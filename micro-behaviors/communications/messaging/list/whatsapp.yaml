defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9
  mbc: C0010
traits:
  - id: wppconnect-contact-list
    desc: WPPConnect lists WhatsApp contacts or chats
    conf: 0.88
    if:
      type: text
      regex: '\bWPP\.contact\.list\s*\('
  - id: wppconnect-get-all-contacts
    desc: WPPConnect lists all WhatsApp contacts
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: WPP.getAllContacts
  # Both loop shapes over the chat store read each chat's recipient id; the
  # forEach and for-of/in forms are separate atoms so each regex stays short.
  - id: wppconnect-chat-store-enumeration
    desc: WPPConnect enumerates chat recipient identifiers
    conf: 0.92
    if:
      type: text
      regex: '(?s)ChatStore\._models\b.{0,500}\.forEach\s*\(.{0,500}\.(id\.(user|_serialized)|number\b)'
  - id: wppconnect-chat-store-loop-enumeration
    desc: WPPConnect loops chat recipient identifiers
    conf: 0.92
    if:
      type: text
      regex: '(?s)\b(of|in)\s+\S{0,24}ChatStore\._models.{0,500}\.(id\.(user|_serialized)|number\b)'
  - id: wppconnect-contact-existence-query
    desc: Checks WhatsApp contact existence
    conf: 0.9
    if:
      type: text
      regex: '\bWPP\.contact\.queryExists\s*\('

composite_rules:
  - id: wppconnect-recipient-list-enumeration
    desc: Enumerates WhatsApp recipients or chat models
    crit: component
    conf: 0.92
    any:
      - id: wppconnect-contact-list
      - id: wppconnect-get-all-contacts
      - id: wppconnect-chat-store-enumeration
      - id: wppconnect-chat-store-loop-enumeration
