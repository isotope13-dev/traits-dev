# Skype4COM contact enumeration is neutral API capability. Whole-list spam is
# inferred only when a send call and automation/start evidence are also present.
defaults:
  platforms: [windows]
  for: [vbs, static-lib]

traits:
  - id: skype4com-friends-enumeration
    desc: Enumerates the Skype friend list
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bFor Each [A-Za-z]+ In Skype\.Friends\b'

