# These capabilities do not establish unsolicited sends or account compromise.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, crx, xpi, zip, chrome-manifest]

composite_rules:
  - id: extension-contact-list-and-csv-export
    desc: Contact enumeration and CSV download co-occur
    conf: 0.93
    scope: archive
    all:
      - id: metadata/permission/host::content-script-matches-im-web-app
      - id: micro-behaviors/data/format/csv/export::csv-content-type
      - id: micro-behaviors/ui/window/dom/tree::dom-blob-download-link
      - id: micro-behaviors/communications/messaging/list::wppconnect-recipient-list-enumeration
