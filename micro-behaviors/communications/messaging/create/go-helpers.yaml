# Named construction helpers, including in ordinary messaging libraries.
# This does not bind a provider, prove a send, or identify C2/exfiltration.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.9
traits:
  - id: go-bot-api-constructor-call
    desc: Calls a bot API client constructor
    if:
      type: symbol
      kind: call
      regex: '\.NewBotAPI$'
  - id: go-message-constructor-call
    desc: Calls a message construction helper
    if:
      type: symbol
      kind: call
      regex: '\.NewMessage$'
