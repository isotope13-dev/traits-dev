# Notification delivery controls; these operations do not establish audit evasion.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, php, go]
  crit: notable
  conf: 0.94

composite_rules:
  - id: notification-routing-suppressed
    desc: Clears ping/page recipients and suppresses alerts
    # Bounded co-occurrence, not a claim of cross-statement object identity.
    near_lines: 12
    all:
      - id: micro-behaviors/communications/messaging/configure::ping-recipients-cleared
      - id: micro-behaviors/communications/messaging/configure::page-recipients-cleared
      - id: micro-behaviors/communications/messaging/configure::no-notify-enabled

  - id: notification-suppression-enforced
    desc: Rejects notifying rows beside suppressed routing
    # Separate from routing changes: an exception makes suppression mandatory.
    # The real ping/page schema supplies context; no prose or invented product
    # marker establishes that the no_notify guard controls monitoring results.
    near_lines: 40
    all:
      - id: notification-routing-suppressed
    any:
      - id: micro-behaviors/communications/messaging/configure::python-reject-notifying-row
      - id: micro-behaviors/communications/messaging/configure::javascript-reject-notifying-row
      - id: micro-behaviors/communications/messaging/configure::ruby-reject-notifying-row
      - id: micro-behaviors/communications/messaging/configure::php-reject-notifying-row
      - id: micro-behaviors/communications/messaging/configure::go-reject-notifying-row
