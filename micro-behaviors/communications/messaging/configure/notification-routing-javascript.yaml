# JavaScript/TypeScript support dotted fields as well as indexed fields.
# Separate parser scopes keep each tree-sitter rule within the engine's cap.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: javascript-ping-recipients-cleared
    desc: Assigns empty ping notification recipients
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        (\.|\[["'])ping_recipients["']?\]?\s*=\s*\[\s*\]$

  - id: javascript-page-recipients-cleared
    desc: Assigns empty paging notification recipients
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        (\.|\[["'])page_recipients["']?\]?\s*=\s*\[\s*\]$

  - id: javascript-no-notify-enabled
    desc: Enables notification suppression field
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        (\.|\[["'])no_notify["']?\]?\s*=\s*true$

  - id: javascript-reject-notifying-row
    desc: Throws unless row suppresses notifications
    if:
      type: tree-sitter
      kind: conditional
      regex: >-
        ^if\s*\([^\n]{1,64}\bno_notify\b.{0,3}\s*!==?\s*true\)\s*\{?\s*throw\b
