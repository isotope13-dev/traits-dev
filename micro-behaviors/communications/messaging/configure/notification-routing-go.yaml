# The report's request/row schema can also be carried by Go maps.
# Require assignments and a terminating guard, not quoted source or comments.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: go-ping-recipients-cleared
    desc: Assigns empty ping notification recipients
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        \["ping_recipients"\]\s*=\s*\[\]string\s*\{\s*\}$

  - id: go-page-recipients-cleared
    desc: Assigns empty paging notification recipients
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        \["page_recipients"\]\s*=\s*\[\]string\s*\{\s*\}$

  - id: go-no-notify-enabled
    desc: Enables notification suppression field
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        \["no_notify"\]\s*=\s*true$

  - id: go-reject-notifying-row
    desc: Panics unless row suppresses notifications
    if:
      type: tree-sitter
      kind: conditional
      regex: >-
        ^if\s+[^\n]{1,64}\["no_notify"\]\s*!=\s*true\s*\{\s*panic\(
