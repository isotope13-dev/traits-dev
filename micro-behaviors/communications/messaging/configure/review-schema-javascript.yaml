---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: javascript-telegram-enabled-field
  desc: Telegram notification setting name
  crit: notable
  conf: 0.9
  if:
    type: text
    word: telegramEnabled
- id: telegram-bot-token-config-field
  desc: Telegram bot token config field
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - macho
  - swift
  - objc
  if:
    type: text
    word: telegramBotToken
- id: native-telegram-channel-id-config-field
  desc: Native app Telegram channel ID config field
  crit: notable
  conf: 0.9
  for:
  - macho
  - swift
  - objc
  platforms:
  - macos
  if:
    type: text
    word: telegramChannelID
- id: javascript-telegram-chat-id-field
  desc: Telegram chat ID config field
  crit: notable
  conf: 0.9
  if:
    type: text
    word: telegramChatId
