# WhatsApp client configuration sources: where protocol parameters are read from.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # The query-id source is a module constant, so the URL precedes the fetch
  # helper and this atom names the constant rather than the fetch call. A
  # publisher-owned raw GitHub file supplying the GraphQL ids is a mutable
  # protocol-configuration channel the consumer did not pin.
  - id: baileys-query-id-remote-source-fetch
    desc: Baileys query-id source URL on raw GitHub
    crit: suspicious
    conf: 0.88
    attack: T1195.002
    if:
      type: text
      regex: 'QUERY_IDS_SOURCE_URL\s*=\s*[''"`]https://raw\.githubusercontent\.com/'
