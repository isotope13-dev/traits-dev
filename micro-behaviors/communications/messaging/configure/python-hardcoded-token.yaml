defaults:
  platforms: [unix, windows]

composite_rules:
- id: python-hardcoded-token-message-channel
  desc: Telegram bot token and message URL configuration
  crit: notable
  conf: 0.96
  attack: none
  for:
  - python
  scope: file
  near_lines: 40
  all:
  - id: micro-behaviors/communications/http/auth::python-hardcoded-bot-token
  - id: micro-behaviors/communications/messaging/send::chat-send-message
  any:
  - id: micro-behaviors/communications/http/services/telegram::python-telegram-api-url-template
  - id: micro-behaviors/communications/http/services/telegram::python-telegram-api-url-positional
