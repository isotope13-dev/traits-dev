defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: php-ping-recipients-cleared
    desc: Assigns empty ping notification recipients
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        \[["']ping_recipients["']\]\s*=\s*\[\s*\]$

  - id: php-page-recipients-cleared
    desc: Assigns empty paging notification recipients
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        \[["']page_recipients["']\]\s*=\s*\[\s*\]$

  - id: php-no-notify-enabled
    desc: Enables notification suppression field
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        ^\$[^\n]{1,80}\[["']no_notify["']\]\s*=\s*(?i:true)$

  - id: php-reject-notifying-row
    desc: Throws unless row suppresses notifications
    if:
      type: tree-sitter
      kind: conditional
      regex: >-
        ^if\s*\(\$[^\n]{1,64}\bno_notify\b.{0,3}\s*!==?\s*true\)\s*\{?\s*throw\b
