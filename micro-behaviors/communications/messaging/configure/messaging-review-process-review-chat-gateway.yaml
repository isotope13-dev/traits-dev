defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  crit: notable
  conf: 0.88

composite_rules:
- id: endpoint-near-messaging-configuration
  desc: Chat endpoint near gateway and messaging indications
  crit: notable
  conf: 0.93
  for: [shell, python, javascript, json]
  all:
  - id: micro-behaviors/communications/messaging/service-reference::chat-service-url-reference
  - id: metadata/file/profile/operation-reference::messaging-or-webhook-indicator
  any:
  - id: micro-behaviors/data/config/schema::agent-gateway-setting-key
  - id: micro-behaviors/data/config/schema::control-channel-setting-key
  - id: micro-behaviors/data/config/schema::ai-agent-tools-key
  - id: micro-behaviors/data/llm/permission::ai-agent-unattended-execution-setting
  near_bytes: 800
