# WhatsApp mobile-API account registration. The official apps are the only
# first-party clients of `v.whatsapp.net`: they ask whether a number already
# has an account (`/exist`), request an SMS/voice verification code (`/code`)
# and confirm it (`/register`). Reimplementing that exchange is what lets a
# script bring new accounts into being without a phone. These atoms record the
# protocol surface only; account-farming intent is judged in
# objectives/evasion/security-bypass/signup-abuse.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, python, go, java, kotlin]
  attack: T1585

traits:
  - id: mobile-registration-host
    desc: WhatsApp mobile registration host
    conf: 0.95
    if:
      type: text
      regex: '\bv\.whatsapp\.net\b'

  - id: registration-endpoint-request
    desc: Requests a /code, /exist or /register path
    conf: 0.8
    if:
      type: text
      regex: '(v\.whatsapp\.net/v2|\b[sS]end\w{0,20}\(\s*["''])/(code|exist|register)\b'

