# WhatsApp group membership operations.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: whatsapp-group-invite-accept-call
    desc: Calls a WhatsApp group invite acceptance API
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.groupAcceptInvite(V4)?$'

  - id: whatsapp-group-invite-link
    desc: WhatsApp group invitation URL
    conf: 0.96
    if:
      type: string_literal
      regex: '^https?://chat\.whatsapp\.com/[A-Za-z0-9_-]{8,}$'
