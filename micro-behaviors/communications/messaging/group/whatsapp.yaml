# WhatsApp group membership operations.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: whatsapp-group-set-query
    desc: Sends a group service mutation query
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)groupQuery$'
      args:
        - {index: 0, kind: string, exact: '@g.us'}
        - {index: 1, kind: string, exact: set}

  - id: whatsapp-group-invite-code-stanza
    desc: Builds a group invitation code stanza
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: 'tag:\s*["'']invite["''],\s*attrs:\s*\{\s*code\s*\}'

  # Bind the preset array, iterator and query code inside the same open
  # callback. Text proximity alone joins unrelated handlers and public APIs.
  - id: whatsapp-session-open-preset-invite-loop
    desc: Session-open loop passes embedded invite codes
    crit: notable
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (member_expression property: (property_identifier) @on)
          arguments: (arguments
            (string (string_fragment) @event)
            (arrow_function
              body: (statement_block
                (if_statement
                  condition: (parenthesized_expression
                    (binary_expression
                      left: (identifier) @connection
                      operator: "==="
                      right: (string (string_fragment) @state)))
                  consequence: (statement_block
                    (lexical_declaration
                      (variable_declarator
                        name: (identifier) @roster
                        value: (array (string (string_fragment) @token))))
                    (for_in_statement
                      left: (identifier) @entry
                      "of"
                      right: (identifier) @source
                      body: (statement_block
                        (try_statement
                          body: (statement_block
                            (expression_statement
                              (await_expression
                                (call_expression
                                  function: (identifier) @query
                                  arguments: (arguments
                                    (string (string_fragment) @destination)
                                    (string (string_fragment) @method)
                                    (array (object
                                      (pair
                                        key: (property_identifier) @tag
                                        value: (string (string_fragment) @operation))
                                      (pair
                                        key: (property_identifier) @attrs
                                        value: (object
                                          (shorthand_property_identifier) @code))))))))))))))))) @evidence
          (#eq? @on "on")
          (#eq? @event "connection.update")
          (#eq? @connection "connection")
          (#eq? @state "open")
          (#eq? @roster @source)
          (#eq? @entry @code)
          (#eq? @query "groupQuery")
          (#eq? @destination "@g.us")
          (#eq? @method "set")
          (#eq? @tag "tag")
          (#eq? @operation "invite")
          (#eq? @attrs "attrs")
          (#match? @token "^[A-Za-z0-9_-]{20,32}$"))

  - id: whatsapp-group-invite-accept-call
    desc: Calls a WhatsApp group invite acceptance API
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)groupAcceptInvite(V4)?$'

  # Shared invite links may retain WhatsApp's share-attribution query.
  - id: whatsapp-group-invite-link
    desc: WhatsApp group invitation URL
    conf: 0.96
    if:
      type: string_literal
      regex: '^https?://chat\.whatsapp\.com/[A-Za-z0-9_-]{8,}([?][^\s"''<>]{1,200})?$'

  # WhatsApp's groupAcceptInvite API also accepts the invitation token by
  # itself. Keep this low-level token as component evidence; arbitrary
  # application tokens are too common to be notable without the join call and
  # an autonomous trigger.
  - id: whatsapp-group-invite-code
    desc: WhatsApp group invitation code
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b[A-Z0-9_]*(GROUP|INVITE)[A-Z0-9_]*\s*=\s*["''][A-Z0-9_-]{20,32}["'']'

  # Some forks retain only the invite code and call groupAcceptInvite(code),
  # so the complete invitation URL is absent. Keep this as neutral evidence;
  # an autonomous session trigger makes the objective hostile.
  - id: whatsapp-group-invite-code-constant
    desc: Defines a fixed WhatsApp group invite code
    conf: 0.95
    if:
      type: text
      regex: '\b\w*GROUP\w*INVITE\w*CODE\s*=\s*["''][A-Za-z0-9_-]{8,40}["'']'

  # Some forks conceal the fixed invite code in a decimal character array and
  # pass the decoded variable directly to the join API. Bind the definition
  # to the call so unrelated String.fromCharCode use does not supply this role.
  - id: whatsapp-group-invite-charcode-target
    desc: Passes decoded invite code to group join
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\w+\s*=\s*\w+\(\[[\d,\s]{20,120}\]\)[\s\S]{0,500}groupAcceptInvite\(\w+\)'

  - id: whatsapp-group-accept-invite-code-variable
    desc: Passes named group invite code to API
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)groupAcceptInvite(V4)?$'
      arg:
        index: 0
        kind: identifier
        name_regex: '(?i).*group.*invite.*code.*'

  - id: whatsapp-group-accept-invite-literal
    desc: Passes literal invite code to groupAcceptInvite
    crit: component
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)groupAcceptInvite(V4)?$'
      arg:
        index: 0
        kind: string
        regex: '^[A-Za-z0-9_-]{16,40}$'

  - id: whatsapp-group-participant-add-call
    desc: Calls WhatsApp group participant add operation
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)groupParticipantsUpdate$'
      arg:
        index: 2
        kind: string
        regex: '^add$'

  # The helper defines an add-participant stanza whose only target is the
  # Meta AI bot user (the @bot domain), and creates groups with that add on
  # by default.
  - id: whatsapp-ai-bot-group-add-helper
    desc: Defines Meta AI bot group-add helper
    conf: 0.93
    if:
      type: text
      regex: 'addAiBotToGroup\s*=\s*async'

  - id: whatsapp-join-group-via-link-helper
    desc: Automated WhatsApp group invite link joiner
    conf: 0.90
    if:
      type: text
      regex: 'joinGroupViaLink\s*=\s*async\s*\(.{0,30}\)\s*=>[\s\S]{0,400}groupAcceptInvite'
