# WhatsApp group membership operations.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: whatsapp-group-invite-accept-call
    desc: Calls a WhatsApp group invite acceptance API
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)groupAcceptInvite(V4)?$'

  - id: whatsapp-group-invite-link
    desc: WhatsApp group invitation URL
    conf: 0.96
    if:
      type: string_literal
      regex: '^https?://chat\.whatsapp\.com/[A-Za-z0-9_-]{8,}$'

  - id: whatsapp-group-participant-add-call
    desc: Calls WhatsApp group participant add operation
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)groupParticipantsUpdate$'
      arg:
        index: 2
        kind: string
        regex: '^add$'

  # The helper defines an add-participant stanza whose only target is the
  # Meta AI bot user (the @bot domain), and creates groups with that add on
  # by default.
  - id: whatsapp-ai-bot-group-add-helper
    desc: Defines Meta AI bot group-add helper
    conf: 0.93
    if:
      type: text
      regex: 'addAiBotToGroup\s*=\s*async'
