defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts]

traits:
  - id: tox-verb-before-id
    desc: TOX-ID verb-before instruction
    # Contact instructions alone do not imply a ransom or C2 channel.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(send|contact|provide|add).{0,80}\bTOX[ -]?ID\b'

  - id: tox-id-before-verb
    desc: TOX-ID before contact verb
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bTOX[ -]?ID\b.{0,80}(send|contact|provide)'


composite_rules:
  - id: tox-id-instruction
    desc: TOX-ID instruction text
    crit: notable
    conf: 0.92
    any:
      - id: tox-verb-before-id
      - id: tox-id-before-verb

