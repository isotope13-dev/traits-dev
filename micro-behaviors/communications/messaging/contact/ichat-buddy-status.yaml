# iChat posts personStatusChanged: when a buddy's presence changes; a loaded
# bundle observing it learns which contacts are online.
defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: ichat-buddy-status-selector
    desc: iChat buddy presence change selector
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'personStatusChanged:'
