defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  crit: notable
  conf: 0.88

traits:
- id: chat-service-domain-reference
  desc: Chat service domain reference
  crit: component
  conf: 0.82
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  if:
    type: text
      # A bare identifier such as `slack` is ordinary application data.  URLs
      # identify an actual chat service endpoint (including Slack webhooks).
    regex: '(?i)\b(api\.)?(telegram|discord|slack)\.(org|com)\b'

- id: whatsapp-or-matrix-name-reference
  desc: WhatsApp or Matrix name reference
  crit: component
  conf: 0.82
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z0-9_.-])(whatsapp|matrix\.org)([^A-Za-z0-9_.-]|$)'

- id: signal-service-name-reference
  desc: Signal service name reference
  crit: component
  conf: 0.82
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  if:
    type: text
      # `signal` is also a common Go/POSIX package name. Require a
      # platform-specific identifier instead of treating every signal import
      # or signal-handling identifier as a chat service.
    regex: '(?i)\bsignal(\.org|-cli)\b'

  # The chat-service endpoint URLs (Telegram/Discord/Slack, WhatsApp/Signal/
  # Matrix, DingTalk/WeChat/LINE) live in
  # micro-behaviors/communications/url/reference/chat-api.yaml: the matcher
  # finds a URL, not an agent, and a Discord webhook in a clipboard stealer
  # was reading as "Agent ... API endpoint".

  # `polling` was in this alternation and named nothing about messaging: it is
  # the ordinary English word for any retry loop, so a Telegram transport's
  # doc comments — or any file that says "long polling" — read as an agent
  # command channel. Only the two bot-API names remain.
composite_rules:
- id: chat-service-url-reference
  desc: Chat service URL reference
  crit: component
  conf: 0.88
  any:
  - id: micro-behaviors/communications/url/reference::telegram-discord-slack-api-url
  - id: micro-behaviors/communications/url/reference::whatsapp-signal-matrix-api-url
  - id: micro-behaviors/communications/url/reference::dingtalk-wechat-line-api-url

