defaults:
  platforms: [unix]
  for: [makefile]

traits:
  - id: pipes-to-mail-transport
    unless:
      - id: metadata/package/testing/corpus/labeled::inert-security-input-module
    desc: Pipes output into a mail transport
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\|\s*(/usr/(s?bin|lib)/)?(mail|mailx|sendmail)\s+[-\w@.]'
