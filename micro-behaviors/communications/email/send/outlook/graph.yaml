defaults:
  for: [python, javascript, typescript, powershell, csharp, rust, go, pe, dll]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  - id: graph-send-mail-path
    desc: References Graph sendMail resource
    if:
      type: text
      regex: '/sendMail([?"'']|$)'
  # Microsoft Graph SDK mail composition: attachments are added through the
  # SDK's message object (message.attachments.add in the Python SDK) and the
  # draft is saved via the SDK, not through Outlook COM/WSH automation. SDK
  # documentation samples carry this shape; a WSH mail worm never does. Kept
  # as two single-literal atoms in one file-scoped composite: a spanning
  # pattern crosses string-table coordinates unreliably.
  - id: graph-message-attachments-add
    desc: Graph SDK message attachments add
    for: [python, javascript, typescript, text]
    if:
      type: text
      substr: 'message.attachments.add('
  - id: graph-save-draft-call
    desc: Graph SDK save draft call
    for: [python, javascript, typescript, text]
    if:
      type: text
      regex: '(save_draft|saveDraft)\s*\('
composite_rules:
  - id: graph-sdk-draft-attachment
    desc: Graph SDK draft mail attachment add
    conf: 0.9
    for: [python, javascript, typescript, text]
    all:
      - id: graph-message-attachments-add
      - id: graph-save-draft-call
