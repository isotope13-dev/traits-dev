defaults:
  platforms: [windows, unix]
  for: [xml]
  crit: component
  conf: 0.94

traits:
  # Styled OOXML frequently places every word in a separate run. Keep the run
  # atoms incomplete, then join the four words by proximity so a huge XML file
  # cannot correlate unrelated vocabulary into an email instruction.
  - id: ooxml-send-run
    desc: OOXML text run contains send verb
    if:
      type: text
      regex: '(?i)<w:t[^>]{0,40}>Send</w:t>'

  - id: ooxml-required-run
    desc: OOXML text run contains required qualifier
    if:
      type: text
      regex: '(?i)<w:t[^>]{0,40}>required</w:t>'

  - id: ooxml-information-run
    desc: OOXML text run contains information noun
    if:
      type: text
      regex: '(?i)<w:t[^>]{0,40}>information</w:t>'

  - id: ooxml-email-run
    desc: OOXML text run contains email noun
    if:
      type: text
      regex: '(?i)<w:t[^>]{0,40}>e-mail</w:t>'

composite_rules:
  - id: send-required-information-by-email
    desc: Document instructs sending required information by email
    crit: notable
    conf: 0.96
    near_bytes: 5000
    all:
      - id: ooxml-send-run
      - id: ooxml-required-run
      - id: ooxml-information-run
      - id: ooxml-email-run
