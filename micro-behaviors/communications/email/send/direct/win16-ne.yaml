# Direct SMTP envelope strings in a 16-bit NE (Win16) executable.
# Separate from windows-pe.yaml because NE binaries expose their strings as
# text but no PE format facts.
defaults:
  platforms: [windows]
  for: [ne]
  crit: notable
  conf: 0.94

traits:
  - id: win16-ne-smtp-mail-from
    desc: NE SMTP MAIL FROM envelope command
    if:
      type: text
      regex: '(?i)MAIL FROM: ?<'
  # Raw bytes: the nine-character "Rcpt to:<" string is too short for the
  # extracted-string matcher, which drops it from the text view.
  - id: win16-ne-smtp-rcpt-to
    desc: NE SMTP RCPT TO envelope command
    if:
      type: raw
      regex: '(?i)RCPT TO: ?<'

composite_rules:
  - id: win16-ne-direct-smtp-client
    desc: Win16 program speaks SMTP MAIL FROM and RCPT TO
    all:
      - id: win16-ne-smtp-mail-from
      - id: win16-ne-smtp-rcpt-to
