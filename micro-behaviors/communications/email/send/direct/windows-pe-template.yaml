# Bulk templates and counters establish a mail sender, not unsolicited abuse.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.97

composite_rules:
  - id: pe-smtp-template-bulk-mailer
    desc: SMTP client with bulk-mail templates/counters
    crit: notable
    all:
      - id: micro-behaviors/communications/email/send/direct::pe-direct-smtp-client
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/communications/email/content::pe-mail-from-macro
      - id: micro-behaviors/communications/email/content::pe-mail-to-macro
      - id: micro-behaviors/communications/email/content::pe-original-message-placeholder
      - id: micro-behaviors/communications/email/content::pe-smtp-delivery-counters
