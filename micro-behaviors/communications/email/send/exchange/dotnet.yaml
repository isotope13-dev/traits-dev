# Exchange Web Services email operations. These are capabilities, so the
# malicious interpretation is assembled by objective composites that add
# credential interception or bulk file collection.
defaults:
  for: [csharp, powershell, pe, dll]
  platforms: [windows]
  attack: T1041

traits:
  - id: exchange-mail-send
    desc: Sends an Exchange Web Services message
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bEmailMessage\b[\s\S]{0,600}\.Send\s*\('

  # Walking the mailbox rather than acting on one message. In a .NET assembly
  # these names land in the #Strings heap as separate entries, so each is its
  # own atom and the composites below require the pair — a proximity regex
  # cannot see across two heap strings.
  #
  # A mail client calls these for the folder it is showing; a collector calls
  # them for everything, which is the distinction the objectives make.
composite_rules:
  # The setter memberref alone does not mean this program disabled validation.
  # A self-contained or ILMerge'd .NET assembly carries the framework's own
  # definition of the property -- gitversion-5.1.4's bin/GitVersion.exe embeds
  # the whole networking stack, so `get_`/`set_` pairs appear three times over
  # with no call site of its own. Pair it with the EWS client so the reading is
  # "this Exchange client accepts any certificate", which is what the rule
  # name claims. The source-level spellings of the same bypass already have
  # their own home in objectives/evasion/security-bypass/tls/validation.yaml.
  - id: exchange-attachment-send
    desc: Exchange Web Services message sends a file attachment
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/email/access/exchange::exchange-web-services-client
      - id: micro-behaviors/communications/email/mime::exchange-file-attachment-reference
      - id: exchange-mail-send

  - id: exchange-credentialed-attachment-send
    desc: Sends an Exchange attachment through explicit credentials
    crit: suspicious
    conf: 0.98
    all:
      - id: exchange-attachment-send
      - id: micro-behaviors/communications/email/auth::exchange-web-credentials
