# Exchange Web Services email operations. These are capabilities, so the
# malicious interpretation is assembled by objective composites that add
# credential interception or bulk file collection.
defaults:
  for: [csharp, powershell, pe, dll]
  platforms: [windows]
  attack: T1041

traits:
  - id: exchange-web-services-client
    desc: Microsoft Exchange Web Services client usage
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Microsoft\.Exchange\.WebServices|\bExchangeService\b'

  - id: exchange-web-credentials
    desc: Authenticates to Exchange with WebCredentials
    crit: notable
    conf: 0.94
    if:
      type: text
      word: WebCredentials

  - id: exchange-mail-attachment
    desc: Adds an Exchange message file attachment
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bAttachments?\s*\.\s*Add(FileAttachment)?\s*\('

  - id: exchange-mail-send
    desc: Sends an Exchange Web Services message
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bEmailMessage\b[\s\S]{0,600}\.Send\s*\('

composite_rules:
  - id: exchange-attachment-send
    desc: Exchange Web Services message sends a file attachment
    crit: suspicious
    conf: 0.97
    all:
      - id: exchange-web-services-client
      - id: exchange-mail-attachment
      - id: exchange-mail-send

  - id: exchange-credentialed-attachment-send
    desc: Sends an Exchange attachment through explicit credentials
    crit: suspicious
    conf: 0.98
    all:
      - id: exchange-attachment-send
      - id: exchange-web-credentials
