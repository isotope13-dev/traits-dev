defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-send-mailmessage
    desc: PowerShell invokes Send-MailMessage
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: (?i)^send-mailmessage$
  - id: powershell-mail-variable-attachment
    desc: Send-MailMessage attaches a variable path
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        (command
          command_name: (command_name) @name
          command_elements: (command_elements
            (command_parameter) @parameter
            . (command_argument_sep)
            . (_) @path)
          (#match? @name "(?i)^Send-MailMessage$")
          (#match? @parameter "(?i)^-Attachments?$")
          (#match? @path "^\\$[A-Za-z_][A-Za-z_0-9]*$"))
