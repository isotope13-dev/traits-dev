# Windows Script Host mail through CDO: a CDO.Message object configured with
# the schemas.microsoft.com sendusing/smtpserver fields sends mail directly
# over SMTP, and the sendpassword field supplies SMTP AUTH credentials.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1071.003

traits:
  - id: wsh-cdo-message-object
    desc: Script creates a CDO.Message mail object
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)CreateObject\s*\(\s*"CDO\.Message"\s*\)'
  - id: wsh-cdo-smtp-password-field
    desc: Script sets CDO SMTP authentication password
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)cdo/configuration/sendpassword"\s*\)\s*=\s*\S'
