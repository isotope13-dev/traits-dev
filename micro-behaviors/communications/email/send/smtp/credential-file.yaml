defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: python-credential-file-smtp-message
    desc: Credential file content enters SMTP message
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @data
            right: (call function: (attribute attribute: (identifier) @read)) @source))
          . (expression_statement (assignment left: (identifier) @message
            right: (call function: (identifier) @constructor)))
          . (expression_statement (assignment left: (subscript value: (identifier) @header1)))
          . (expression_statement (assignment left: (subscript value: (identifier) @header2)))
          . (expression_statement (assignment left: (subscript value: (identifier) @header3)))
          . (expression_statement (call function: (attribute object: (identifier) @filled attribute: (identifier) @set)
            arguments: (argument_list (call function: (attribute object: (identifier) @sent attribute: (identifier) @decode)))))
          . (expression_statement (assignment left: (identifier) @smtp
            right: (call function: (attribute object: (identifier) @module attribute: (identifier) @smtp_constructor))))
          . (expression_statement (call function: (attribute object: (identifier) @receiver attribute: (identifier) @sendmail)
            arguments: (argument_list (call function: (attribute object: (identifier) @serialized attribute: (identifier) @as_string)))))) @send
          (#eq? @read "read_bytes")
          (#match? @source "(application_default_credentials|\\.aws|\\.ssh|\\.npmrc)")
          (#eq? @constructor "EmailMessage")
          (#eq? @message @header1)
          (#eq? @message @header2)
          (#eq? @message @header3)
          (#eq? @message @filled)
          (#eq? @message @serialized)
          (#eq? @data @sent)
          (#eq? @set "set_content")
          (#eq? @decode "decode")
          (#eq? @module "smtplib")
          (#eq? @smtp_constructor "SMTP")
          (#eq? @smtp @receiver)
          (#eq? @sendmail "sendmail")
          (#eq? @as_string "as_string"))
