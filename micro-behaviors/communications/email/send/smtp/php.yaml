defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.86

traits:
  - id: php-mailer-send-method
    desc: Calls a PHP mailer object's send method
    conf: 0.9
    if:
      type: text
      regex: '(?i)\$[a-z_][a-z0-9_]*mailer\s*->\s*send\s*\('
    not:
      # WordPress' bundled PHPMailer is a distinct SMTP capability and is
      # already covered by the WordPress mail traits.
      - regex: '(?i)\$phpmailer\s*->\s*send\s*\('

  - id: smtp-transport-exception-handling
    desc: SMTP transport exception handling
    conf: 0.86
    if:
      type: text
      substr: TransportExceptionInterface

composite_rules:
  - id: php-mailer-smtp-send-retry-helper
    desc: PHP mailer send with transport exception handling
    crit: notable
    conf: 0.92
    all:
      - id: php-mailer-send-method
      - id: smtp-transport-exception-handling
