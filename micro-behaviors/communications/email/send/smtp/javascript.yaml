defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, json]

traits:
  - id: smtp-connection-input-field
    desc: SMTP server or credential setting name
    conf: 0.9
    if:
      type: text
      regex: '\b(smtp[-_]server|smtp[-_]username|smtp[-_]password|INPUT_SMTP)\b'
    unless:
      - id: well-known/lib/web/syntaxhighlighter::prismjs-package-reference
      # A generated TextMate grammar is a symbol table, not program logic:
      # its per-language alternation lists every keyword the language has.
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  # A bare property name: settings screens for alert destinations carry it as
  # often as anything that mails credentials, so it supports no claim alone.
  - id: alert-emails-field-name
    desc: Alert email recipients field name
    crit: component
    conf: 0.9
    if:
      type: text
      word: alertEmails

  - id: smtp-client-construction
    desc: Constructs a direct SMTP client
    conf: 0.94
    if:
      type: text
      regex: '\bnew\s+SmtpClient\s*\('

  - id: smtp-mail-send
    desc: Sends a message through an SMTP client
    conf: 0.94
    if:
      type: text
      regex: '\bsmtp\.sendMail\s*\('

  - id: smtp-xoauth2-authentication
    desc: Configures SMTP XOAUTH2 with a token
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bmethod\s*:\s*["'']XOAUTH2["''][\s\S]{0,120}\btoken\b'
