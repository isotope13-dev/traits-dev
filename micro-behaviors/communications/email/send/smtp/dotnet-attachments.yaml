defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: managed-smtp-attachment-loop
    desc: Managed SMTP attachment-send loop
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule managed_smtp_attachment_loop {
          strings:
            $smtp = "SmtpClient" ascii fullword
            $mail = "MailMessage" ascii fullword
            $attachment = "Attachment" ascii fullword
            $attachments = "get_Attachments" ascii fullword
            $credentials = "set_Credentials" ascii fullword
            $ssl = "set_EnableSsl" ascii fullword
            $send = "Send" ascii fullword
            // Read an array item, add it as a message attachment, then
            // construct a client, set credentials and SSL, and send.
            $loop = {
              11 ?? 11 ?? 9A 13 ?? 11 ?? 6F ?? ?? ?? 0A
              11 ?? 73 ?? ?? ?? 0A 6F ?? ?? ?? 0A
              [1-64]
              73 ?? ?? ?? 0A 13 ?? 11 ?? 11 ?? 11 ??
              73 ?? ?? ?? 0A 6F ?? ?? ?? 0A
              11 ?? 11 ?? 6F ?? ?? ?? 0A
              11 ?? 11 ?? 6F ?? ?? ?? 0A
            }
          condition:
            uint16(0) == 0x5a4d and all of them
        }

