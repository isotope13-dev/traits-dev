# A Node mail message object whose attachments list names a file on disk by
# path, so the transport reads and sends that file.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-mail-attachment-file-path
    desc: Mail message attaches a file by path
    conf: 0.88
    if:
      type: text
      regex: '\battachments\s*:\s*\[\s*\{[^\]]{0,200}\bpath\s*:\s*\w'
