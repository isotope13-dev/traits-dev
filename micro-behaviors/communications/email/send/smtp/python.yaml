defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-aiosmtplib-import
    desc: Imports asynchronous Python SMTP client
    conf: 0.95
    if:
      type: import
      exact: aiosmtplib

  - id: python-smtplib-import
    desc: Imports Python SMTP client library
    if:
      type: symbol
      kind: import
      exact: smtplib

  - id: python-smtp-imported-client
    desc: Imports SMTP client from smtplib
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*from\s+smtplib\s+import\s+SMTP\b'

  - id: python-smtp-client-construction
    desc: Constructs a Python SMTP client
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SMTP(_SSL)?$'

  - id: python-smtp-sendmail-call
    desc: Sends email through Python SMTP sendmail
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)sendmail$'

  - id: python-send-message-call
    desc: Calls a Python object's send_message method
    crit: component
    if:
      type: symbol
      kind: call
      regex: '(^|\.)send_message$'

  # The stdlib mailing idiom: `with smtplib.SMTP(...) as server:
  # server.send_message(msg)`. This is the complete email-send observation;
  # the generic send_message symbol above stays the component leg for
  # non-email objects.
  - id: python-server-send-message-call
    desc: Sends email via server.send_message
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: server.send_message

composite_rules:
  - id: python-aiosmtplib-send-message
    desc: Sends email through aiosmtplib
    crit: notable
    conf: 0.96
    near_lines: 200
    all:
      - id: python-aiosmtplib-import
      - id: python-send-message-call

  # Session-portability tools intentionally deliver an encrypted share URL
  # through an operator-configured SMTP account.  The transport is useful
  # triage evidence, but it does not establish credential theft or exfiltration.
  - id: python-browser-session-share-email-delivery
    desc: Sends browser-session share link by SMTP
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/data/serialize/json::browser-session-share-link-generation
      - id: micro-behaviors/data/serialize/json::browser-session-cookie-read
      - id: python-smtplib-import
      - id: python-smtp-sendmail-call
