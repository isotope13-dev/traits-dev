defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: cdo-message-progid
    desc: CDO.Message COM mail object identifier
    if:
      type: text
      exact: CDO.Message
  - id: cdo-smtp-server-field
    desc: CDO SMTP server configuration field
    if:
      type: text
      exact: smtpserver
  - id: cdo-mail-textbody-field
    desc: COM mail TextBody property reference
    if:
      type: text
      exact: TextBody
composite_rules:
  - id: cdo-smtp-mail-api-cluster
    desc: CDO mail object, SMTP configuration and message-body properties co-occur
    all:
      - id: cdo-message-progid
      - id: cdo-smtp-server-field
      - id: cdo-mail-textbody-field
