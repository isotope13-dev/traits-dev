# Markdown prose that mentions SMTP mail-sending context (docs, changelogs,
# configuration guides). Neutral vocabulary: the phishing-credential
# composites reference this cross-directory and supply the agent-skill
# frontmatter plus credential-request legs that make it a lure.
defaults:
  platforms: [unix, windows]
  for: [markdown]
traits:
  - id: smtp-mail-context-reference
    desc: Text references SMTP mail-sending context
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)smtp|mail server|outgoing mail|sender mailbox'
