# Managed SMTP delivery types as they survive into a compiled assembly.
#
# `smtp/dotnet-source.yaml` matches the C#/PowerShell *syntax* (`new SmtpClient(`).
# A compiled .NET binary has no syntax left — the class names survive only as
# CLR metadata strings — so the source rules never fire on a PE. These are the
# binary-side counterparts: neutral "this assembly can send mail over SMTP"
# capability observations. Mail-based exfiltration composites reference them.
defaults:
  for: [pe, dll]
  platforms: [windows]
  mbc: C0012
  attack: T1071.003

traits:
  - id: dotnet-smtpclient-type
    desc: .NET SmtpClient mail-sending type reference
    crit: notable
    conf: 0.85
    if:
      type: text
      word: SmtpClient

  - id: dotnet-mailmessage-type
    desc: .NET MailMessage type reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: MailMessage
