# Extended MAPI email sending APIs in PE binaries
# mapi32.dll dynamic loading, MAPILogonEx, MAPIInitialize, address book access
# Used by native Windows binaries to send email via Outlook/MAPI
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.9
traits:
- id: mapi-send-mail-import
  desc: Import the MAPISendMail API
  if:
    type: symbol
    kind: import
    regex: '(?i)(^|@)MAPISendMail$'

- id: mapi32-dll-ref
  desc: MAPI32 DLL reference string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: "mapi32.dll"

- id: mapi-logon-ex
  desc: Extended MAPI logon API
  crit: notable
  conf: 0.95
  if:
    type: text
    word: MAPILogonEx

- id: mapi-initialize
  desc: Extended MAPI initialize API
  crit: notable
  conf: 0.95
  if:
    type: text
    word: MAPIInitialize

- id: ipm-note-class
  desc: MAPI email message class
  conf: 0.95
  if:
    type: text
    exact: "IPM.Note"

- id: sendmail-routine
  desc: MAPI SendMail routine string
  crit: notable
  conf: 0.85
  if:
    type: text
    word: SendMail

- id: pdf-attachment-string
  desc: PDF email attachment creation diagnostic
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: "Creating PDF attachment"

composite_rules:
- id: extended-mapi-session
  desc: Extended MAPI session initialization
  crit: notable
  conf: 0.95
  all:
  - id: mapi32-dll-ref
  - id: mapi-logon-ex
  - id: mapi-initialize

- id: mapi-email-send-capability
  desc: Extended MAPI send and addressing references
  crit: notable
  conf: 0.95
  all:
  - id: extended-mapi-session
  - id: sendmail-routine
  any:
  - id: ipm-note-class
  - id: micro-behaviors/communications/email/address::outlook-address-request-token
  - id: micro-behaviors/communications/email/address::mapi-address-book-diagnostic
- id: mapi-send-with-artifacts
  desc: MAPI send and mail artifact references
  crit: notable
  conf: 0.95
  all:
  - id: mapi-email-send-capability
  any:
  - id: sendmail-routine
  - id: micro-behaviors/communications/email/address::outlook-autocomplete-filename-token
  - id: pdf-attachment-string
  needs: 2
