defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml]

traits:
  - id: wsh-outlook-recipient-add
    desc: Outlook recipient-add member reference
    crit: notable
    conf: 0.92
    for: [vbs, text, oledoc, ooxml, static-lib, batch]
    if:
      type: text
      regex: '(?i)Recipients\.Add\b'

  # Text-scoped mirrors of the micro-behavior Outlook send-chain atoms, which
  # are scoped to [c, cpp, javascript, vbs] source and never evaluate on
  # HTML-embedded or macro-text carriers where these worms actually run.

  - id: outlook-create-mailitem-text
    desc: Creates an Outlook mail item
    crit: notable
    conf: 0.9
    for: [scripts, text, oledoc, ooxml, static-lib, c, cpp, ne]
    if:
      type: text
      regex: '(?i)CreateItem\s*\(\s*0\s*\)'
