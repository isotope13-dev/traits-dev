# Outlook automation that attaches a program rather than a document: a local
# script or executable path, or the running script's own file. Mail clients
# block these extensions on receipt, so a script that composes such a message
# is shipping code, not a report.
defaults:
  platforms: [windows]
  for: [vbs, text, batch, html]
  crit: notable
  conf: 0.9

traits:
  - id: outlook-attaches-executable-file
    desc: Attaches script or executable file to mail
    if:
      type: text
      regex: '(?i)Attachments\.Add\b[^\r\n]{0,120}\.(bat|cmd|vb[se]|jse?|wsf|hta|exe|scr|pif|com)["'']'

  - id: outlook-attaches-running-script
    desc: Attaches the running script to mail
    if:
      type: text
      regex: '(?i)Attachments\.Add\b[^\r\n]{0,80}\bScriptFullName\b'
