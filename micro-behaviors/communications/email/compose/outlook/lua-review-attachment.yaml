defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml]

composite_rules:
  - id: wsh-outlook-attachments-add
    desc: Outlook mail item and attachment-add member reference
    crit: notable
    conf: 0.92
    for: [vbs, text, oledoc, ooxml, static-lib]
    all:
      - id: micro-behaviors/communications/email/compose/outlook::outlook-create-mailitem-text
      - id: micro-behaviors/data/property/access::attachments-add-member-reference
    unless:
      - id: micro-behaviors/communications/email/send/outlook::graph-sdk-draft-attachment
      - id: metadata/file/extension/identity::dart-source-basename
