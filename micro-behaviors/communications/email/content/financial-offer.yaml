defaults:
  platforms: [unix, windows]
  for: [text, html]
  crit: notable
  conf: 0.95

traits:
  - id: subject-header-line
    desc: Message contains an email Subject header
    if:
      type: text
      regex: '(?im)^Subject:[ \t]{1,8}[^\r\n]{1,200}'

  - id: financial-preapproval-offer
    desc: Message offers loan or funding preapproval
    if:
      type: text
      regex: '(?i)\b(loan|funding|credit)\b.{0,40}\bpre[- ]?approv\w*'
