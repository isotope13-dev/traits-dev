# Billing-dispute mail wording. A chargeback notice or a pointer to payment
# details in an attachment is ordinary merchant correspondence, so each atom
# is only notable; lure composites add what the attachment really is.
# `msg`/`oledoc` read the Outlook body streams; `makefile`/`text` cover raw
# mailed bodies, which the file sniffer often types as makefile.
defaults:
  platforms: [windows, unix]
  for: [msg, oledoc, html, makefile, text]
  crit: notable

traits:
  - id: card-chargeback-notice
    desc: Mail reports a card chargeback
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(notice|received|reported|filed)\b[^\r\n]{0,120}\bcharge-?back\b'
  - id: payment-details-attachment-pointer
    desc: Mail points to payment details attachment
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(payment|billing|order|invoice) (details?|info)\b[^\r\n.]{0,16}\battach'
