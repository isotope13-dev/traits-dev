defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]

traits:
  - id: invoice-sign-or-pay-request
    desc: Requests signing or payment of an invoice
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\b(stamp|sign|pay)\b[^\r\n]{0,80}\b(proforma|factura)\b'
      case_insensitive: true
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog

