# Compiled mail templates may expose personalization markers used to fill
# sender, recipient, and quoted-message fields. These are content signals;
# intent comes from the consuming behavior rule that requires a mail client
# and delivery telemetry alongside them.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.97

traits:
  - id: pe-mail-from-macro
    desc: Mail template sender macro
    crit: notable
    if:
      type: text
      section: .rdata
      substr: '%FROM_EMAIL'

  - id: pe-mail-to-macro
    desc: Mail template recipient macro
    crit: notable
    if:
      type: text
      section: .rdata
      substr: '%TO_EMAIL'

  - id: pe-original-message-placeholder
    desc: Mail template original-message placeholder
    crit: notable
    if:
      type: text
      section: .rdata
      substr: INSERT_ORIGINAL_EMAIL

  - id: pe-smtp-delivery-counters
    desc: SMTP ban and retry statistic keys
    crit: notable
    if:
      type: text
      section: .rdata
      regex: 'smtp_(ban|herr|retr)'
