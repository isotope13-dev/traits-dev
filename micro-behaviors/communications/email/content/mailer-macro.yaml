# Bulk-mailer template macros that the sending tool expands per message
# (`RND_WORD[10]` -> ten random words). A copy that still carries the literal
# macro is a mail body captured from, or templated for, a randomizing bulk
# mailer; the randomized text exists to make each copy hash differently.
defaults:
  platforms: [windows, unix]
  for: [html, text]

traits:
  - id: unexpanded-random-text-macro
    desc: Unexpanded bulk-mailer RND_ random-text macro
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bRND_[A-Z_]{3,12}\[\d{1,3}\]'
