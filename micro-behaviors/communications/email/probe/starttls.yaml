defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable

traits:
  - id: ehlo-command
    desc: SMTP EHLO greeting with wire line terminator
    conf: 0.95
    if:
      type: literal
      regex: '^EHLO [^\r\n]{1,120}\r\n$'
  - id: starttls-command
    desc: SMTP STARTTLS upgrade with wire line terminator
    conf: 0.98
    if:
      type: literal
      exact: "STARTTLS\r\n"

composite_rules:
  - id: smtp-starttls-negotiation
    desc: SMTP greeting and explicit TLS upgrade commands
    conf: 0.98
    all:
      - id: ehlo-command
      - id: starttls-command
