defaults:
  platforms: [windows, unix]
  for: [php, text]
  crit: notable
  conf: 0.95

traits:
  - id: php-disable-mail-originating-header
    desc: Disables PHP mail originating script header
    if:
      type: text
      regex: '(?i)\bini_set\s*\(\s*["'']mail\.add_x_header["'']\s*,\s*["'']?(0|off|false)["'']?\s*\)'
