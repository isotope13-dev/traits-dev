# Shell-written msmtp configuration.
#
# These are capability observations: a legitimate provisioning script may
# configure an SMTP relay. Intent is inferred by objective-tier composites
# when the config is fetched, credential-bearing, or paired with cleanup.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.94

traits:
  - id: shell-msmtp-config-write
    desc: Shell writes an msmtp system configuration
    if:
      type: text
      regex: '(?im)^\s*cat\s*<<-?\s*[A-Za-z_][A-Za-z0-9_]*\s*>>?\s*/etc/msmtprc\b'

  - id: msmtp-default-account
    desc: msmtp default account stanza
    if:
      type: text
      regex: '(?im)^\s*account\s+default\b'

  - id: msmtp-host-field
    desc: msmtp SMTP host field
    if:
      type: text
      regex: '(?im)^\s*host\s+\S+'

  - id: msmtp-auth-enabled
    desc: msmtp authentication enabled
    if:
      type: text
      regex: '(?im)^\s*auth\s+on\b'

  - id: msmtp-user-email-field
    desc: msmtp user email field
    if:
      type: text
      regex: '(?im)^\s*(user|from)\s+\S+@[\w.-]+'

  - id: msmtp-password-field
    desc: msmtp plaintext password field
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*password\s+\S+'

composite_rules:
  - id: shell-msmtp-credential-bootstrap
    desc: Shell stages a plaintext msmtp SMTP credential
    crit: suspicious
    conf: 0.97
    near_lines: 12
    all:
      - id: shell-msmtp-config-write
      - id: msmtp-default-account
      - id: msmtp-host-field
      - id: msmtp-auth-enabled
      - id: msmtp-user-email-field
      - id: msmtp-password-field
