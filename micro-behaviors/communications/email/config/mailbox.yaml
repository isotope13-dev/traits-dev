# A configuration key that names the mailbox a client reads or writes, e.g.
# `"mailbox": "ops@contoso.com"` or `Mailbox = "..."`. Mail clients, Graph
# API integrations and helpdesk tools all carry one; the DNS credential-refresh
# objective pairs it with tenant/client ids and a client secret.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]
  crit: notable
  conf: 0.88

traits:
  # Relocated from objectives/command-and-control/dns/tunneling, where a bare
  # `word: mailbox` matched emoji labels and prose ("closed mailbox with
  # raised flag"). Require a key followed by an assigned string value.
  - id: mailbox-config-field
    desc: Mailbox configuration field
    if:
      type: text
      regex: '(?i)\bmailbox["'']?\s*[:=]\s*["'']'
