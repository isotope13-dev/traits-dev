defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-patch-attachment
    desc: Email attachment declares patch MIME subtype
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      regex: '\.add_attachment\([\s\S]{0,300}subtype\s*=\s*["'']x-patch["'']'
