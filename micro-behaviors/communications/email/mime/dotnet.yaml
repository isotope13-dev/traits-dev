# Exchange Web Services email operations. These are capabilities, so the
# malicious interpretation is assembled by objective composites that add
# credential interception or bulk file collection.
defaults:
  for: [csharp, powershell, pe, dll]
  platforms: [windows]
  attack: T1041

traits:
  - id: exchange-file-attachment-reference
    desc: "Exchange file-attachment API reference"
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(AddFileAttachment|FileAttachment)\s*\('
