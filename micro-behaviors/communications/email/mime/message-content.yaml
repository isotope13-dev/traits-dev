# Email message content indicators for worm emails analyzed as raw files.
#
# A captured worm email (EML) sniffs as text or makefile, never as code, so
# the code-scoped MIME atoms cannot see it. These match the message itself:
# multipart structure, base64 parts, ZIP attachments, executables concealed
# inside the encoded attachment, and non-English lure charsets.
defaults:
  platforms: [windows, unix]
  for: [text, makefile]
traits:
  - id: eml-multipart-mixed
    desc: Email multipart mixed content
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'multipart/mixed'
  - id: eml-zip-attachment
    desc: Email ZIP attachment filename
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'filename=".{0,50}\.zip"'
  - id: eml-base64-zip-magic
    desc: Base64 part opens with ZIP magic
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[\r\n]UEsDB'
  - id: eml-koi8r-charset
    desc: Email KOI8-R charset reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^Content-Type:[^\r\n]{0,100}charset=["'']?koi8-r\b'
  - id: eml-outlook-express-mailer
    desc: Email Outlook Express mailer
    crit: notable
    conf: 0.87
    if:
      type: text
      substr: 'X-Mailer: Microsoft Outlook Express'
  - id: eml-fake-spam-negative
    desc: Spam-negative X-Spam header
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: 'X-Spam: Not detected'
