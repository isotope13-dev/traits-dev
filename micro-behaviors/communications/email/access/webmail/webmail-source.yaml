defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1114

traits:
  - id: webmail-list-action-reference
    desc: "Webmail message-list action references"
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: _task=mail&_action=list|_mbox=.{0,80}_remote=1
  - id: webmail-message-action-reference
    desc: "Webmail message-view action references"
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: _action=viewsource|_save=0&_uid=|_extwin=1
