defaults:
  platforms: [android, windows, unix]
  for: [javascript, typescript]

traits:
  - id: account-password-field
    desc: Reads configured IMAP account password
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]{0,24}\.imap\.password\b'

  - id: account-imap-config-serialization
    desc: Serializes IMAP account configuration object
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'JSON\.stringify\(\s*[A-Za-z_$][\w$]{0,24}\.imap\s*\)'

  # Keyed on conventional verbose/debug logger names (Node's util.debuglog and
  # the vlog spelling around it) rather than console.log, which every mail
  # client uses for ordinary status output. Regex budget caps how many name
  # variants fit here; widen it only alongside the alternation limits.
  - id: account-email-in-log-call
    desc: Logs an account email field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(vlog|debuglog)\s*\([^)]{0,180}\b\w+\.email\b'

  - id: account-imap-field-in-log-call
    desc: Logs IMAP host, auth, or password
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(vlog|debuglog)\s*\([^)]{0,180}\b\w+\.imap\??\.(host|auth|password)\b'

  - id: account-imap-config-in-log-call
    desc: IMAP config passed to verbose logger
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(vlog|debuglog)\s*\([^)]{0,350}JSON\.stringify\([^)]{0,120}\.imap\s*\)'

  - id: xoauth2-authentication-command
    desc: Implements IMAP XOAUTH2 authentication
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'buildCommand(tag, `AUTHENTICATE XOAUTH2'

  - id: imap-message-fetch-command
    desc: Implements IMAP UID message retrieval
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'buildCommand(tag, `UID FETCH'

  - id: imap-idle-command
    desc: Implements the IMAP IDLE command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'buildCommand(tag, "IDLE")'

  - id: imap-auto-configuration
    desc: Builds automatic IMAP account configuration
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: createAutoImapConfig

  - id: imap-client-construction
    desc: Constructs a compatibility IMAP client
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bnew\s+CompatImapClient\s*\('

  - id: imap-message-fetch-method
    desc: Fetches messages through an IMAP client
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bclient\.fetchMessages(SinceUid)?\s*\('

  - id: imap-idle-mailbox-watch
    desc: Watches an IMAP mailbox for new messages
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bwatchClient\.watchMailbox\s*\('

  - id: imap-mailbox-append
    desc: Appends a message to an IMAP mailbox
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bclient\.appendMessage\s*\('

  - id: imapflow-library-import
    desc: Imports the ImapFlow IMAP client library
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: imapflow

composite_rules:
  # The two log-call atoms only show that account fields reach a logger; this
  # adds the leg that shows the logger is a network sink, so the account
  # address and mail-server settings actually leave the device. Neutral: remote
  # diagnostic logging is what most mobile/WebView clients do. The
  # credential-bearing variant (whole config object, password included) is
  # objectives/exfiltration/http/report::imap-config-object-in-log-url.
  - id: account-fields-in-remote-log-request
    desc: Account email and IMAP settings sent to remote log URL
    crit: notable
    conf: 0.93
    # Bundles often place the logger definition hundreds of lines from the call
    # sites that pass account fields; keep proximity at typical bundle distance.
    near_lines: 520
    all:
      - id: micro-behaviors/communications/http/url/path::fetch-encoded-log-path
      - id: account-email-in-log-call
      - id: account-imap-field-in-log-call
