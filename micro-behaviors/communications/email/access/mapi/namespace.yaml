# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  for:
  - c
  - cpp
  - javascript
  - vbs
  - ne
  platforms:
  - windows
traits:
- id: outlook-namespace-call
  desc: Outlook MAPI namespace access
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)GetNameSpace\s*\(\s*["']MAPI["']\s*\)
composite_rules:
- id: mapi-htmlbody-access-context
  desc: MAPI namespace access with HTMLBody property reference
  for: [vbs]
  crit: notable
  conf: 0.94
  all:
  - id: outlook-namespace-call
  - id: micro-behaviors/data/property/access::vb-htmlbody-property-reference
