defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml]

traits:
  - id: vba-outlook-mapi-address-loop
    desc: Outlook MAPI and address-list count text
    crit: notable
    conf: 0.94
    for: [vbs, text, oledoc, ooxml, static-lib]
    if:
      type: text
      regex: 'GetNameSpace\("MAPI"\)[\s\S]{0,260}AddressLists\.Count'
  - id: wsh-outlook-mapi-namespace
    desc: Outlook MAPI namespace lookup text
    crit: notable
    conf: 0.9
    for: [vbs, text, oledoc, ooxml, static-lib]
    if:
      type: text
      substr: 'GetNameSpace("MAPI")'
  - id: wsh-outlook-address-lists
    desc: Outlook address-list count text
    crit: notable
    conf: 0.9
    for: [vbs, text, oledoc, ooxml, static-lib]
    if:
      type: text
      substr: 'AddressLists.Count'
