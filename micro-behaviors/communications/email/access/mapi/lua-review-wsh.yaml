defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml]

traits:
  - id: vba-outlook-mapi-address-loop
    desc: Outlook MAPI and address-list count text
    crit: notable
    conf: 0.94
    for: [vbs, text, oledoc, ooxml, static-lib]
    if:
      type: text
      regex: 'GetNameSpace\("MAPI"\)[\s\S]{0,260}AddressLists\.Count'
  - id: wsh-outlook-mapi-namespace
    desc: Outlook MAPI namespace lookup text
    crit: notable
    conf: 0.9
    for: [vbs, text, oledoc, ooxml, static-lib]
    if:
      type: text
      substr: 'GetNameSpace("MAPI")'
  # VBScript is case-insensitive, and batch droppers echo the same mailer
  # lines into a .vbs they then run, so the batch carrier holds them as text.
  - id: wsh-outlook-address-lists
    desc: Outlook address-list count text
    crit: notable
    conf: 0.9
    for: [vbs, text, oledoc, ooxml, static-lib, batch]
    if:
      type: text
      case_insensitive: true
      substr: 'AddressLists.Count'
  - id: wsh-outlook-address-entries
    desc: Indexes or counts Outlook address entries
    crit: notable
    conf: 0.9
    for: [vbs, text, oledoc, ooxml, static-lib, batch]
    if:
      type: text
      regex: '(?i)\.AddressEntries\s*(\.\s*Count\b|\(\s*\w+\s*\))'
