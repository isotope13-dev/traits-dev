defaults:
  for: [pe, dll, c, cpp, csharp]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: session-logon-token
    desc: MAPI LogOn API name token
    if:
      type: text
      word: MapiLogOn
  - id: enumerate-messages-token
    desc: MAPI FindNext API name token
    if:
      type: text
      word: MapiFindNext
  - id: read-message-token
    desc: MAPI ReadMail API name token
    if:
      type: text
      word: MAPIReadMail
  - id: session-logon-import
    desc: Import MAPI LogOn API
    for: [pe, dll]
    if:
      type: symbol
      kind: import
      regex: '(?i)(^|@)MapiLogOn$'
  - id: enumerate-messages-import
    desc: Import MAPI FindNext API
    for: [pe, dll]
    if:
      type: symbol
      kind: import
      regex: '(?i)(^|@)MapiFindNext$'
  - id: read-message-import
    desc: Import MAPI ReadMail API
    for: [pe, dll]
    if:
      type: symbol
      kind: import
      regex: '(?i)(^|@)MapiReadMail$'
  - id: session-logon-call
    desc: Call MAPI LogOn API
    for: [c, cpp, csharp]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])MapiLogOn$'
  - id: enumerate-messages-call
    desc: Call MAPI FindNext API
    for: [c, cpp, csharp]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])MapiFindNext$'
  - id: read-message-call
    desc: Call MAPI ReadMail API
    for: [c, cpp, csharp]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])MapiReadMail$'

composite_rules:
  - id: session-logon
    desc: Log on to a MAPI session
    any:
      - id: session-logon-import
      - id: session-logon-call
  - id: enumerate-messages
    desc: Enumerate messages through MAPI
    any:
      - id: enumerate-messages-import
      - id: enumerate-messages-call
  - id: read-message
    desc: Read an email through MAPI
    any:
      - id: read-message-import
      - id: read-message-call
