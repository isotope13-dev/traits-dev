defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97

traits:
  # Extracted text drops CR/LF. Match the wire command terminators in bytes
  # so a registry value named UIDL cannot stand in for the POP3 command.
  - id: numbered-retr-command-template
    desc: Numbered mail retrieval command template
    if:
      type: hex
      pattern: '52 45 54 52 20 25 64 0D 0A 00'
      section: any
  - id: uidl-command
    desc: POP3 unique-message listing command
    if:
      type: hex
      pattern: '55 49 44 4C 0D 0A 00'
      section: any

composite_rules:
  - id: native-retrieval-command-set
    desc: POP3 retrieval commands with Winsock client references
    all:
      - id: numbered-retr-command-template
      - id: uidl-command
      # The client profile handles named and ordinal Winsock imports.
      # Requiring only named send/recv silently loses older native clients.
      - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
