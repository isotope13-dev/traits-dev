# EWS wire-format evidence applies across client implementations.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, elf, macho, class, pyc]
  crit: notable
  conf: 0.95
traits:
  - id: ews-soap-messages-namespace
    desc: Exchange Web Services SOAP message namespace
    if:
      type: text
      substr: schemas.microsoft.com/exchange/services/2006/messages
  - id: ews-soap-item-read-operation
    desc: SOAP item read element
    if:
      type: text
      # XML permits either a prefix or a default namespace.
      regex: '<([A-Za-z_][A-Za-z0-9_]*:)?(FindItem|GetItem)([ >])'
composite_rules:
  - id: ews-soap-mailbox-read
    desc: EWS namespace with mailbox item read operation
    all:
      - id: ews-soap-messages-namespace
      - id: ews-soap-item-read-operation
    near_bytes: 2048
