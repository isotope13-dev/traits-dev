# Co-occurrence describes mailbox/archive capabilities, not unauthorized access.
# writestr supplies member bytes; it does not make the ZIP itself in-memory.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
composite_rules:
  - id: python-ews-hidden-zip-capabilities
    desc: EWS reads, hidden archive path and ZIP writes
    all:
      - id: micro-behaviors/communications/email/access/exchange::ews-soap-mailbox-read
      - id: micro-behaviors/fs/path/archive::hidden-archive-path
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-write-string
