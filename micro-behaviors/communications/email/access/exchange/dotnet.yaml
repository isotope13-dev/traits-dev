# Exchange Web Services email operations. These are capabilities, so the
# malicious interpretation is assembled by objective composites that add
# credential interception or bulk file collection.
defaults:
  for: [csharp, powershell, pe, dll]
  platforms: [windows]

traits:
  - id: exchange-web-services-client
    desc: Microsoft Exchange Web Services client usage
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Microsoft\.Exchange\.WebServices|\bExchangeService\b'
  # An unqualified FindFolders name also occurs in non-mail tools.
  - id: exchange-qualified-find-folders-reference
    desc: Exchange-qualified FindFolders API reference
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bExchangeService\.FindFolders\b'
  - id: exchange-folder-view
    desc: Exchange FolderView paging type
    crit: notable
    conf: 0.9
    if:
      type: text
      word: FolderView
  - id: exchange-find-items-call
    desc: Enumerates Exchange mailbox items
    crit: notable
    conf: 0.93
    if:
      type: text
      word: FindItems
  - id: exchange-item-view
    desc: Exchange ItemView paging type
    crit: notable
    conf: 0.9
    if:
      type: text
      word: ItemView

  # Raw MIME supports legitimate message rendering and export alike.
  - id: exchange-mime-content-read
    desc: Reads raw MIME content of a message
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(get_)?MimeContent\b'

  # `exchange-ambient-windows-credentials` moved to
  # micro-behaviors/communications/http/auth as
  # `dotnet-default-network-credentials`: running as the logged-in user is a
  # System.Net capability, not an Exchange one.

composite_rules:
  - id: exchange-folder-tree-enumeration
    desc: Enumerates the Exchange folder tree
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/email/access/exchange::exchange-qualified-find-folders-reference
      - id: micro-behaviors/communications/email/access/exchange::exchange-folder-view
  - id: exchange-item-enumeration
    desc: Pages through Exchange mailbox items
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/email/access/exchange::exchange-find-items-call
      - id: micro-behaviors/communications/email/access/exchange::exchange-item-view
