defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
  conf: 0.96
traits:
  - id: grant-mailbox-permission-command
    desc: Grants Exchange mailbox permissions
    if:
      type: text
      regex: '(?i)\bAdd-MailboxPermission\s+-'
      exclude_comments: true
  - id: mailbox-fullaccess-right
    desc: Requests mailbox FullAccess rights
    if:
      type: text
      regex: '(?i)-AccessRights\s*:?\s*["'']?FullAccess\b'
      exclude_comments: true
  - id: all-mailboxes-pipeline-loop
    desc: Loops over all Exchange mailboxes
    if:
      type: text
      regex: '(?i)Get-Mailbox\s+-ResultSize\s+Unlimited\s*\|\s*(ForEach-Object|%)\s*\{'
      exclude_comments: true
  - id: exchange-impersonation-role-query
    desc: Queries Exchange impersonation role grants
    if:
      type: text
      regex: '(?i)Get-ManagementRoleAssignment\s+-Role\s*:?\s*ApplicationImpersonation'
      exclude_comments: true
  - id: mailbox-permission-loop-body
    desc: Mailbox permission grant starts a loop body
    if:
      type: text
      regex: '(?i)(ForEach-Object|%)\s*\{\s*Add-MailboxPermission\b'
      exclude_comments: true
  - id: grant-mailbox-fullaccess
    desc: Grants FullAccess to an Exchange mailbox
    if:
      type: text
      regex: '(?i)Add-MailboxPermission[^;}]{0,256}-AccessRights\s*:?\s*["'']?FullAccess\b'
      exclude_comments: true
