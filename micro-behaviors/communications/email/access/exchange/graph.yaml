defaults:
  for: [python, javascript, typescript, powershell, csharp, rust, go, pe, dll]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  # Only quoted-relative (`'/messages'`, as in `base + '/messages'`) and
  # mailbox-selector (`/me/messages`, `/users/<id>/messages`) paths count.
  # Bare `/messages` also matches JSON-pointer fragments
  # (`#/definitions/messages`, `#/components/messages/...`) that pervade
  # API-spec tooling such as AsyncAPI renderers: those name schema objects,
  # not HTTP mailbox paths.
  - id: mailbox-messages-resource-path
    desc: Mailbox messages resource path reference
    if:
      type: text
      regex: '["''`]/messages([?"''/]|$)|/(me|users/[^"''/ ]{1,64})/messages([?"''/]|$)'
