# Documents carry complete addresses; source strings can split route and token.
defaults:
  platforms: [unix, windows]
  for: [documents]
traits:
  - id: gitlab-incoming-email-token-address-document
    desc: GitLab incoming-email token-shaped address
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)incoming\+[\w.-]+-\d+-[\w-]{16,80}-(issue(-\d+)?|merge-request)@'
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/harness/fixture::secret-scanner-demo-context
