defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vb6-mailto-prefix-reference
    desc: "Quoted mailto prefix reference"
    crit: notable
    conf: 0.97
    if:
      # A harvester looks for the scheme on its own -- InStr(buf, "mailto:")
      # -- and reads the address that follows. Any page that merely links to
      # an author (`href="mailto:someone@example.com"`) carries the scheme
      # with an address already attached, so the unquoted substring matched
      # every classic ASP page with a contact link.
      type: text
      substr: '"mailto:"'
