defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vb6-mailto-prefix-reference
    desc: "Quoted mailto prefix reference"
    crit: notable
    conf: 0.97
    if:
      # A harvester looks for the scheme on its own -- InStr(buf, "mailto:")
      # -- and reads the address that follows. Any page that merely links to
      # an author (`href="mailto:someone@example.com"`) carries the scheme
      # with an address already attached, so the unquoted substring matched
      # every classic ASP page with a contact link.
      type: text
      substr: '"mailto:"'
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: metadata/build/bundler/vscode::javascript-source-map-file
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
      - id: metadata/file/string/corpus::hashed-text-record
      # WebKit ChangeLog prose mentions the mailto: URL scheme.
      - type: basename
        regex: '(?i)^changelog'
