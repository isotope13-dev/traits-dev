defaults:
  platforms: [windows, unix]
  for: [html, text, data]


traits:
  - id: docusign-expanded-brand-email-domain-reference
    desc: Email-domain label expands docusign
    crit: notable
    conf: 0.94
    unless:
      # Vendor-impersonation signatures encode the lookalike domains as
      # detection content.
      - id: well-known/tool/detection/malware-signature-table::antivirus-signature-database
    if:
      type: text
      regex: '(?i)@(docusign[a-z0-9-]+|[a-z0-9-]+docusign)\.[a-z]{2,8}\b'
