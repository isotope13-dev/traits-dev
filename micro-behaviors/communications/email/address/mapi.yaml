# These are local address-selection interfaces, not evidence of harvesting.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: outlook-address-request-token
    desc: OutlookGetAddrs address request token
    if:
      type: text
      word: OutlookGetAddrs
  - id: mapi-address-book-diagnostic
    desc: MAPI address-book access diagnostic
    conf: 0.9
    if:
      type: text
      substr: Get the address book
  - id: outlook-autocomplete-filename-token
    desc: Outlook autocomplete filename field token
    conf: 0.9
    if:
      type: text
      exact: AutoCompleteFileName
