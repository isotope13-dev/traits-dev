defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1114
  mbc: E1114

traits:
  - id: provider-email-extractor-entrypoint
    desc: "Email extractor function definition"
    crit: notable
    conf: 0.97
    if:
      type: function
      exact: runEmailExtractor
  - id: email-result-writer-reference
    desc: "Email-result writer reference"
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bcreateEmailWriter\b'
