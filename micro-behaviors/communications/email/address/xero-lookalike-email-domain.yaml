defaults:
  platforms: [windows, unix]
  for: [html, text, data]


traits:
  - id: xero-expanded-brand-email-domain-reference
    desc: Email-domain label expands xero
    crit: notable
    conf: 0.94
    if:
      type: text
      # A label continuing with x is the Xerox brand (xerox.com, xerox-rheine.de),
      # the copier company, not a Xero lookalike; do not add an alternative that
      # matches past that x. Prefix/suffix + xero lookalikes still match.
      regex: '(?i)@(xero[a-wyz0-9-][a-z0-9-]*|[a-z0-9-]+xero)\.[a-z]{2,8}\b'
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-install-tree
