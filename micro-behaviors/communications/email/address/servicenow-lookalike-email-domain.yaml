defaults:
  platforms: [windows, unix]
  for: [html, text, data]


traits:
  - id: servicenow-expanded-brand-email-domain-reference
    desc: Email-domain label expands servicenow
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(service-?now[a-z0-9-]+|[a-z0-9-]+service-?now)\.[a-z]{2,8}\b'
