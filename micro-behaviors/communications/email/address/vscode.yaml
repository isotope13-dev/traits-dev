# An editor extension that scans workspace documents for address patterns and
# copies the collected set to the clipboard is a local data-harvest workflow.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1114,T1115

traits:
  - id: email-address-text
    desc: "Email address text"
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '[A-Za-z0-9._%+\-]{1,64}@[A-Za-z0-9.-]{1,96}\.[A-Za-z]{2,24}'
  - id: email-localpart-regex-fragment
    desc: "Email local-part regex fragment"
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\\[[A-Za-z0-9._%+\\-]{1,64}\\][+*?{][^;\\n]{0,120}@'
  - id: email-domain-regex-fragment
    desc: "Email domain regex fragment"
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '@\\(\\?:[A-Za-z0-9.\\-\\[\\]\\\\|+*?{}]{1,160}\\)'
composite_rules:
  - id: email-regex-structure
    desc: "Structured email-matching regex"
    crit: component
    conf: 0.9
    all:
      - type: trait
        id: micro-behaviors/communications/email/address::email-localpart-regex-fragment
      - type: trait
        id: micro-behaviors/communications/email/address::email-domain-regex-fragment
