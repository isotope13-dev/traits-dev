traits:
  - id: protonmail-address
    desc: ProtonMail email address
    platforms: [unix, windows]
    for: [binaries]
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '[a-zA-Z0-9._-]+@protonmail\.(com|ch)'
      case_insensitive: true
    unless:
    - id: well-known/app/system/sq::go-module-path
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
