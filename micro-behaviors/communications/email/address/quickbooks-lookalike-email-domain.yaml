defaults:
  platforms: [windows, unix]
  for: [html, text, data]


traits:
  - id: quickbooks-expanded-brand-email-domain-reference
    desc: Email-domain label expands quickbooks
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(quickbooks[a-z0-9-]+|[a-z0-9-]+quickbooks)\.[a-z]{2,8}\b'
