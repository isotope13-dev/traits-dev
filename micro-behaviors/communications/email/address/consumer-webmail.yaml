# Recipient addresses hosted at free consumer webmail providers.
#
# On its own this is weak evidence -- plenty of honest code carries a
# maintainer's personal address, so each atom stays notable at low confidence.
# It earns its place because the mail-rule and mail-forwarding objectives need
# to tell "forwards inside the organisation" from "forwards out to an account
# the organisation does not control", and a static file never knows the
# victim's own domain. A free provider is the durable stand-in for an
# attacker's drop box, which is why responders hunting hijacked mailboxes
# filter forwarding destinations against exactly this kind of list.
#
# Split by provider family rather than written as one long alternation so that
# which provider was chosen survives into differential analysis.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, powershell, csharp]
  crit: notable
  conf: 0.55

# Match the address's provider suffix, beginning at `@`. Prefix-consuming email
# regexes try a bounded username match at almost every byte of a generated
# single-line bundle; a 39 MB Rspack SSR artifact took longer than the rule
# timeout even though it contained no Microsoft address. The provider suffix
# is the durable fact these atoms need, gives the regex engine a selective
# literal prefix, and still cannot match a bare provider name or URL.
traits:
  - id: google-consumer-email-domain-suffix
    desc: Gmail consumer email domain suffix
    if:
      type: text
      regex: '@(gmail|googlemail)\.com\b'
      case_insensitive: true

  - id: microsoft-consumer-email-domain-suffix
    desc: Microsoft consumer email domain suffix
    if:
      type: text
      regex: '@(outlook|hotmail|live|msn)\.com\b'
      case_insensitive: true

  - id: privacy-email-domain-suffix
    desc: Privacy provider email domain suffix
    if:
      type: text
      regex: '@(proton\.me|protonmail\.com|pm\.me|tuta\.io)\b'
      case_insensitive: true

  - id: legacy-consumer-email-domain-suffix
    desc: Legacy consumer email domain suffix
    if:
      type: text
      regex: '@(yahoo|aol|gmx|zoho)\.com\b'
      case_insensitive: true

  - id: eastern-consumer-email-domain-suffix
    desc: Eastern consumer email domain suffix
    if:
      type: text
      regex: '@(yandex|mail)\.(ru|com)\b'
      case_insensitive: true

composite_rules:
  - id: consumer-webmail-address
    desc: Free consumer email domain suffix
    crit: notable
    conf: 0.6
    any:
      - id: google-consumer-email-domain-suffix
      - id: microsoft-consumer-email-domain-suffix
      - id: privacy-email-domain-suffix
      - id: legacy-consumer-email-domain-suffix
      - id: eastern-consumer-email-domain-suffix
