# Literal domain prefixes permit selective indexing before HTML masking.
# This preserves comment exclusion without parsing unrelated lexical corpora.
defaults:
  platforms: [windows, unix]
  for: [scripts, typescript, csharp, documents, text]
  crit: notable
  conf: 0.55

traits:
  - id: gmail-com-email-domain-suffix
    desc: Email address suffix @gmail.com
    if:
      type: text
      regex: '@gmail\.com\b'
      case_insensitive: true
      exclude_html_comments: true
  - id: googlemail-com-email-domain-suffix
    desc: Email address suffix @googlemail.com
    if:
