# Recipient addresses hosted at free consumer webmail providers.
#
# On its own this is weak evidence -- plenty of honest code carries a
# maintainer's personal address, so each atom stays notable at low confidence.
# It earns its place because the mail-rule and mail-forwarding objectives need
# to tell "forwards inside the organisation" from "forwards out to an account
# the organisation does not control", and a static file never knows the
# victim's own domain. A free provider is the durable stand-in for an
# attacker's drop box, which is why responders hunting hijacked mailboxes
# filter forwarding destinations against exactly this kind of list.
#
# Split by provider family rather than written as one long alternation so that
# which provider was chosen survives into differential analysis.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, powershell, csharp]
  crit: notable
  conf: 0.55

# Each atom captures up to 64 bytes of the line BEFORE the address so the
# `not:` filters below can see the context: a `not:` clause is handed only the
# matched string, so a bare address regex can never tell a drop box from an
# attribution line. Package trees are full of the latter -- "Copyright (C) 2009
# Michael Trier (mtrier@gmail.com)", "Author-email:", "__contact__ =" -- and one
# bundled dependency set produced 100 such findings, none of them a recipient.
# A forwarding or exfil destination never carries an authorship prefix, so the
# filters cost no detection.
# License headers also commonly put a contributor's address after a year range
# (for example, `2016-2018 Name <name@gmail.com>`); that shape is attribution,
# not a delivery destination, and must be excluded before this atom fires.
traits:
  - id: google-consumer-mail-address
    desc: Gmail consumer address
    if:
      type: text
      regex: '(?i).{0,64}\b[\w.%+-]{1,64}@(gmail|googlemail)\.com\b'
    not:
      - regex: '(?i)\bcopyright\b'
      - regex: '(?i)\b(contributor|license)\b'
      - regex: '(?i)(author|maintainer)[-_ ]?e?mail'
      - regex: '(?i)\b(?:19|20)\d{2}[-–]?\d{0,4}\s+[A-Z][^<]{0,40}<'
      - regex: '(?i)__(email|contact|author)__'
      # JSDoc examples explaining Gmail canonicalization, not recipients.
      - regex: '(?i)\bcollapse\b'
      - regex: '(?i)\bcanonical\b'
      - regex: '(?i)Other domains:'
      - regex: '(?i)OAuth token cache'
      # Documentation examples: "(like 'test@googlemail.com')".
      - regex: '(?i)like\s+[''"]'

  - id: microsoft-consumer-mail-address
    desc: Microsoft consumer webmail address
    if:
      type: text
      regex: '.{0,64}[\w.%+-]{1,64}@(outlook|hotmail|live|msn)\.com\b'
    not:
      - regex: '(?i)\bcopyright\b'
      - regex: '(?i)\b(contributor|license)\b'
      - regex: '(?i)(author|maintainer)[-_ ]?e?mail'
      - regex: '(?i)\b(?:19|20)\d{2}[-–]?\d{0,4}\s+[A-Z][^<]{0,40}<'
      - regex: '(?i)__(email|contact|author)__'

  - id: privacy-mail-address
    desc: Privacy webmail provider address
    if:
      type: text
      regex: '.{0,64}[\w.%+-]{1,64}@(proton\.me|protonmail\.com|pm\.me|tuta\.io)\b'
    not:
      - regex: '(?i)\bcopyright\b'
      - regex: '(?i)\b(contributor|license)\b'
      - regex: '(?i)(author|maintainer)[-_ ]?e?mail'
      - regex: '(?i)\b(?:19|20)\d{2}[-–]?\d{0,4}\s+[A-Z][^<]{0,40}<'
      - regex: '(?i)__(email|contact|author)__'

  - id: legacy-consumer-mail-address
    desc: Legacy consumer webmail address
    if:
      type: text
      regex: '.{0,64}[\w.%+-]{1,64}@(yahoo|aol|gmx|zoho)\.com\b'
    not:
      - regex: '(?i)\bcopyright\b'
      - regex: '(?i)\b(contributor|license)\b'
      - regex: '(?i)(author|maintainer)[-_ ]?e?mail'
      - regex: '(?i)\b(?:19|20)\d{2}[-–]?\d{0,4}\s+[A-Z][^<]{0,40}<'
      - regex: '(?i)__(email|contact|author)__'
      # Comment examples contrasting ambiguous account ids, not drop boxes.
      - regex: '(?i)\bwould collide\b'
      - regex: '(?i)\bambiguous\b'

  - id: eastern-consumer-mail-address
    desc: Yandex or Mail.ru consumer address
    if:
      type: text
      regex: '.{0,64}[\w.%+-]{1,64}@(yandex|mail)\.(ru|com)\b'
    not:
      - regex: '(?i)\bcopyright\b'
      - regex: '(?i)\b(contributor|license)\b'
      - regex: '(?i)(author|maintainer)[-_ ]?e?mail'
      - regex: '(?i)\b(?:19|20)\d{2}[-–]?\d{0,4}\s+[A-Z][^<]{0,40}<'
      - regex: '(?i)__(email|contact|author)__'

composite_rules:
  - id: consumer-webmail-address
    desc: Free consumer webmail address
    crit: notable
    conf: 0.6
    any:
      - id: google-consumer-mail-address
      - id: microsoft-consumer-mail-address
      - id: privacy-mail-address
      - id: legacy-consumer-mail-address
      - id: eastern-consumer-mail-address
