defaults:
  platforms: [windows, unix]
  for: [html, text, data]


traits:
  - id: netsuite-expanded-brand-email-domain-reference
    desc: Email-domain label expands netsuite
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(netsuite[a-z0-9-]+|[a-z0-9-]+netsuite)\.[a-z]{2,8}\b'
