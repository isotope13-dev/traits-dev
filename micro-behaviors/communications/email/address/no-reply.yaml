# An address reference is neither evidence of sending mail nor of phishing.
# Relocated without changing the matcher, platform/type scope or exclusion.
defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: no-reply-address-text
    desc: No-reply email address reference
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/app/productivity/keepercommander/
    if:
      type: text
      regex: '(?i)(noreply|no-reply)@[A-Za-z0-9._-]{1,80}'
