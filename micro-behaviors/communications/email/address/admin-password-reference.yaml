# Reference text only: no dialog, password collection, or email send implied.
defaults:
  for: [scripts, source, macho]
  platforms: [macos]
traits:
  - id: admin-address-near-password-text
    desc: Admin email reference near password text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?is)admin@[A-Za-z0-9._%+-]+\.[A-Za-z]{2,}.{0,80}password

