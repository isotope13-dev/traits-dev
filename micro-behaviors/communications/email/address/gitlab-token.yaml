defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - data
traits:
- id: gitlab-incoming-email-route
  desc: GitLab incoming-email routing prefix
  crit: component
  conf: 0.98
  if:
    type: text
    regex: (?i)\bincoming\+[a-z0-9._-]+-[0-9]{1,12}-
- id: incoming-email-token-action
  desc: Incoming-email token and action suffix
  crit: component
  conf: 0.96
  if:
    type: text
    regex: (?i)-[a-z0-9_-]{16,80}-(issue(-[0-9]+)?|merge-request)@
composite_rules:
- id: gitlab-incoming-email-token-address
  desc: GitLab incoming-email token-shaped address
  crit: notable
  conf: 0.98
  near_bytes: 256
  all:
  - id: gitlab-incoming-email-route
  - id: incoming-email-token-action
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/harness/fixture::secret-scanner-demo-context
