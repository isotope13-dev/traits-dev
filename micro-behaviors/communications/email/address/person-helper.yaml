defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: normalize-person-email-helper
    desc: normalizePerson helper with email-field evidence
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bnormalizePerson\b[\s\S]{0,500}\b(emails?|emailAddress)\b'
