defaults:
  platforms: [windows, unix]
  for: [html, text, data]


traits:
  - id: workday-expanded-brand-email-domain-reference
    desc: Email-domain label expands workday
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(workday[a-z0-9-]+|[a-z0-9-]+workday)\.[a-z]{2,8}\b'
