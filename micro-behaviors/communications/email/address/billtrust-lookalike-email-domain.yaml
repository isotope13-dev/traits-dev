defaults:
  platforms: [windows, unix]
  for: [html, text, data]


traits:
  - id: billtrust-expanded-brand-email-domain-reference
    desc: Email-domain label expands billtrust
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)@(billtrust[a-z0-9-]+|[a-z0-9-]+billtrust)\.[a-z]{2,8}\b'
