# WordPress and WooCommerce configured contact-address lookups. These reads
# are neutral on their own but identify privacy-relevant data access in diffs.
defaults:
  conf: 0.96
  platforms: [unix, windows]
  for: [php]
  crit: notable

traits:
  - id: wordpress-admin-email-option
    desc: Reads configured WordPress administrator email
    if:
      type: symbol
      kind: call
      exact: get_option
      arg:
        kind: string
        exact: admin_email

  - id: woocommerce-order-recipient-option
    desc: Reads WooCommerce order notification recipients
    if:
      type: symbol
      kind: call
      exact: get_option
      arg:
        kind: string
        exact: woocommerce_new_order_recipient
