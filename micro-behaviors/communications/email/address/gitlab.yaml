defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json]
  conf: 0.96

traits:
  - id: method-issue-email-suffix-rewrite
    desc: Rewrites GitLab issue-email action suffix
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.(replace|sub|gsub)\s*\(\s*["'']-issue@["'']\s*,\s*["'']-merge-request@["'']'

  - id: php-issue-email-suffix-rewrite
    desc: PHP rewrites GitLab issue-email action
    crit: notable
    conf: 0.98
    for: [php]
    if:
      type: text
      regex: '(?i)str_replace\s*\(\s*["'']-issue@["'']\s*,\s*["'']-merge-request@["'']'

  - id: powershell-issue-email-suffix-rewrite
    desc: PowerShell rewrites GitLab email action
    crit: notable
    conf: 0.98
    for: [powershell]
    if:
      type: text
      regex: '(?i)-replace\s+["'']-issue@["'']\s*,\s*["'']-merge-request@["'']'

  - id: sed-issue-email-suffix-rewrite
    desc: sed rewrites GitLab issue-email action
    crit: notable
    conf: 0.97
    for: [shell]
    if:
      type: text
      regex: '(?i)\bsed\s+[^\r\n]{0,32}s/-issue@/-merge-request@/'

  - id: gitlab-merge-request-address
    desc: Complete GitLab merge-request email address
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bincoming\+[a-z0-9._-]+-[0-9]{1,12}-[a-z0-9_-]{16,80}-merge-request@[\w.-]+'
