# Mail-rule settings whose only purpose is to keep the mail a rule acts on out
# of the mailbox owner's view.
#
# Written against both spellings the same setting takes in practice -- the
# Exchange shell parameter (`-MoveToFolder`) and the Graph messageRule JSON key
# (`moveToFolder`) -- so a kit that switches transport does not switch off the
# detection.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, powershell, csharp]
  crit: suspicious
  conf: 0.95
  attack: T1564.008
  mbc: E1564

traits:
  # Outlook's RSS Feeds folder is the canonical dead drop for a hijacked
  # mailbox: it exists in every profile, is effectively never opened, and
  # filing stolen mail there keeps the owner from noticing the copy. Written
  # `"moveToFolder": "rssfeeds"` over Graph and `-MoveToFolder ":\RSS Feeds"`
  # in the Exchange shell.
  - id: mail-rule-moves-mail-to-rss-folder
    desc: Mail rule files mail to RSS Feeds
    if:
      type: text
      regex: '(?i)MoveToFolder["'']?\s*[:=]?\s*["''][^"'']{0,30}RSS[\s_-]?Feeds'
