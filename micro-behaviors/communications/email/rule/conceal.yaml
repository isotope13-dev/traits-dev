# Mail-rule destinations used to keep messages out of the main inbox.
# These settings are suspicious in isolation; they do not prove compromise.
#
# Written against both spellings the same setting takes in practice -- the
# Exchange shell parameter (`-MoveToFolder`) and the Graph messageRule JSON key
# (`moveToFolder`) -- so a kit that switches transport does not switch off the
# detection.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: suspicious
  conf: 0.95
  attack: T1564.008
  mbc: E1564

traits:
  # Match assigned folder names/paths, not a mention of a folder in prose.
  # Opaque REST folder IDs cannot establish a destination name statically.
  # Huntress also reported RSS Subscriptions and Conversation History.
  - id: mail-rule-moves-mail-to-rss-folder
    desc: Mail rule files mail to RSS Feeds
    if:
      type: text
      regex: '(?i)\bMoveToFolder["''\s:=]*["'']([^"'']{0,80}\\)?RSS[ _-]?Feeds["'']'

  - id: mail-rule-moves-mail-to-rss-subscriptions
    desc: Mail rule files mail to RSS Subscriptions
    if:
      type: text
      regex: '(?i)\bMoveToFolder["''\s:=]*["'']([^"'']{0,80}\\)?RSS[ _-]?Subscriptions["'']'

  - id: mail-rule-moves-mail-to-conversation-history
    desc: Mail rule files mail to Conversation History
    if:
      type: text
      regex: '(?i)\bMoveToFolder["''\s:=]*["'']([^"'']{0,80}\\)?Conversation[ _]?History["'']'
