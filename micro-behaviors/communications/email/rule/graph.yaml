# Microsoft Graph messageRule resource -- the REST equivalent of an Outlook
# inbox rule.
#
# A rule is created by POSTing to
# /users/{id}/mailFolders/inbox/messageRules with a JSON body whose `actions`
# object names what happens to matching mail. Mail clients, backup tools and
# tenant-provisioning scripts all use this API legitimately, so the endpoint and
# its action fields are capability-level facts; the objectives tier decides when
# the assembled rule is a mailbox hijack.
#
# Field names come from the documented messageRuleActions resource, so these
# atoms hold across every SDK and language that speaks Graph rather than being
# tied to one kit's source.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, powershell, csharp]
  crit: notable
  conf: 0.92
  attack: T1114.003
  mbc: E1114

traits:
  - id: graph-message-rule-endpoint
    desc: Graph inbox messageRules endpoint
    if:
      type: text
      regex: '(?i)mailFolders/[^/"''\s]{1,64}/messageRules\b'

  - id: message-rule-forward-action
    desc: Mail rule action forwards matched mail
    if:
      # A messageRule forward action always carries a recipient object, so the
      # `emailAddress` key is required. Without it `redirectTo:` alone would
      # match every Angular/React route table that names the same field.
      type: text
      regex: '(?i)\b(forward|redirect)(AsAttachment)?To\b["'']?\s*[:=]\s*\[?\s*\{?\s*["'']?emailAddress'

  - id: message-rule-conceal-action
    desc: Mail rule action hiding matched mail
    attack: T1564.008
    if:
      # Requiring the assigned value keeps this on rule declarations and off
      # the identically named methods a mail client calls at runtime.
      type: text
      regex: '(?i)\b(markAsRead|moveToFolder|permanentDelete)\b["'']?\s*[:=]\s*(true|["''])'
    unless:
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
