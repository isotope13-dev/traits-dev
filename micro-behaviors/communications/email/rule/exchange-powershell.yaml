# Exchange mailbox rule and forwarding cmdlets (Exchange Online PowerShell and
# the on-premises Exchange Management Shell).
#
# Every cmdlet named here is a supported administrative operation: help desks
# create inbox rules, and tenants legitimately forward a departing employee's
# mail to a colleague. These atoms therefore stay at capability level and
# describe only the operation and its parameter.
#
# Business email compromise reuses exactly these cmdlets to plant a hidden
# auto-forward on a mailbox it has just taken over, so the objective tier under
# objectives/persistence/system/mail-forwarding/ assembles the abusive shape --
# an external consumer destination, a rule that hides the mail it copies, or a
# sweep across every mailbox in the tenant.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.93
  attack: T1114.003
  mbc: E1114

traits:
  - id: new-inbox-rule-cmdlet
    desc: Creates an Exchange inbox rule
    if:
      type: symbol
      kind: call
      exact: New-InboxRule

  - id: set-inbox-rule-cmdlet
    desc: Modifies an Exchange inbox rule
    if:
      type: symbol
      kind: call
      exact: Set-InboxRule

  - id: inbox-rule-forward-parameter
    desc: Inbox rule forward destination parameter
    if:
      type: text
      regex: '(?i)-(ForwardTo|ForwardAsAttachmentTo|RedirectTo)\b'

  - id: mailbox-forwarding-address-parameter
    desc: Sets mailbox SMTP forwarding address
    if:
      type: text
      regex: '(?i)-Forwarding(SmtpAddress|Address)\b'

  # -DeliverToMailboxAndForward $false stops the mailbox owner's own copy from
  # being delivered, so the account holder sees no trace of the mail that was
  # forwarded away. An administrator configuring a sanctioned forward normally
  # keeps the local copy, which is the parameter's default.
  - id: mailbox-forward-suppresses-local-delivery
    desc: Mailbox forward leaves no local copy
    crit: suspicious
    conf: 0.94
    attack: T1564.008
    if:
      type: text
      regex: '(?i)-DeliverToMailboxAndForward\s*:?\s*\$false\b'

  # Individually ordinary rule actions. Paired with a forward to an address
  # outside the tenant they are what keeps the victim from noticing the copy.
  - id: inbox-rule-conceal-parameter
    desc: Inbox rule parameter hiding matched mail
    attack: T1564.008
    if:
      type: text
      regex: '(?i)-(MoveToFolder|MarkAsRead|DeleteMessage|StopProcessingRules)\b'
