defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1114
  mbc: E1114

traits:
  - id: email-provider-api-key-fragment
    desc: Email or lead API-key fragment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(email|lead|contact|prospect).{0,160}api[_-]?key'
  - id: api-key-email-provider-fragment
    desc: API key near email-provider fragment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)api[_-]?key[^;\n]{0,48}\b(email|lead|contact|prospect)'
composite_rules:
  - id: provider-api-key-templates
    desc: Email-provider API-key templates
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/email/auth::email-provider-api-key-fragment
      - id: micro-behaviors/communications/email/auth::api-key-email-provider-fragment
