defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: email-vocabulary-before-api-key
    desc: Email-related text precedes API-key text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(email|lead|contact|prospect).{0,160}api[_-]?key'
  - id: api-key-before-email-vocabulary
    desc: API-key text precedes email-related text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)api[_-]?key[^;\n]{0,48}\b(email|lead|contact|prospect)'
composite_rules:
  - id: email-api-key-cooccurrence
    desc: Email-related and API-key text co-occur
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/email/auth::email-vocabulary-before-api-key
      - id: micro-behaviors/communications/email/auth::api-key-before-email-vocabulary
