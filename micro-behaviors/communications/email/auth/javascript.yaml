defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: email-api-key-setting
    desc: Configures an email-service API-key field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(email|mail|sendgrid|mailgun)[_-]?api[_-]?key["\x27]?\s*[:=]'
