# Authentication and transport results embedded in RFC 822 messages. These
# atoms describe the mail system's own structured verdicts; attack intent is
# inferred only by composites that require several independent failures.
defaults:
  platforms: [windows, unix]
  for: [text, html, data]

traits:
  - id: exchange-authas-anonymous
    desc: Exchange marks message authentication anonymous
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?im)^X-MS-Exchange-Organization-AuthAs:\s*Anonymous\s*\r?$'

  - id: authentication-results-spf-fail
    desc: Email authentication reports SPF failure
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^Authentication-Results:[\s\S]{0,500}\bspf\s*=\s*fail\b'

  - id: authentication-results-dkim-none
    desc: Email authentication reports no DKIM signature
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?im)^[ \t]+dkim\s*=\s*none\b'

  - id: authentication-results-dmarc-unenforced
    desc: Email authentication reports unenforced DMARC
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^[ \t]+dmarc\s*=\s*(none|fail)\b'

  - id: exchange-composite-auth-fail
    desc: Exchange composite authentication failure
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^[ \t]+compauth\s*=\s*fail\b'

  - id: exchange-online-received
    desc: Exchange Online MX received message
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^[ \t]+by\s+\S+\.mail\.protection\.outlook\.com\b'

  - id: exchange-frontend-transport
    desc: Exchange frontend transport receipt
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^[ \t]+with Microsoft SMTP Server via Frontend Transport\b'
