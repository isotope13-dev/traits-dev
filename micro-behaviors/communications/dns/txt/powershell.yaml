defaults:
  platforms: [windows]
  for: [powershell, html]
  attack: T1071.004
  mbc: C0011
  crit: notable
  conf: 0.94

traits:
  - id: powershell-nslookup-txt-capture
    desc: PowerShell captures nslookup TXT response
    if:
      type: text
      regex: '(?i)\$[A-Za-z_]\w*\s*=\s*\(\s*nslookup\s+-q=TXT\b'

  - id: powershell-resolve-dns-txt-capture
    desc: PowerShell captures Resolve-DnsName TXT response
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: Resolve-DnsName
      arg:
        kind: identifier
        name: TXT

  - id: nslookup-txt-explicit-resolver
    desc: nslookup TXT query specifies resolver
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bnslookup\s+-q=TXT\s+\S+\s+[^|;&\s]{1,253}'

  - id: powershell-inline-nslookup-txt-iex
    desc: IEX evaluates inline nslookup TXT output
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\biex\s*\(\s*nslookup\s+-q=TXT\b'

  - id: powershell-nslookup-txt-double-iex
    desc: IEX chains DNS TXT output twice
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\|\s*iex\s*\|\s*iex\b'
