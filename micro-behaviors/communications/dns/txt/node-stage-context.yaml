# TXT chunk decode, write, chmod and detached spawn occur nearby. The clauses
# do not bind the decoded bytes to the written path or that path to spawn.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: node-txt-decode-write-detached-spawn-profile
    desc: Node TXT decode, file-write, chmod and detached-spawn clues
    crit: suspicious
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/dns/txt::node-indexed-txt-chunk-query
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
