# Cross-language aggregation of source-level DNS TXT lookups.  The individual
# language rules stay in their canonical files; this composite gives objective
# rules one stable capability to consume.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1071.004
  mbc: C0011

traits:
  - id: nslookup-txt-command-source
    desc: Source invokes nslookup for TXT records
    crit: notable
    conf: 0.9
    for: [c, cpp, zig, elixir]
    if:
      type: text
      regex: '(?i)\b(nslookup|dig)[^\r\n]{0,120}\b(TXT|type[= ]TXT)\b'

  - id: zig-txt-fields-call
    desc: Zig calls a DNS TXT response helper
    crit: notable
    conf: 0.92
    for: [zig]
    if:
      type: text
      regex: '(?i)\b(ch[.])?txtFields\s*\('

  - id: source-txt-query-command
    desc: Source invokes a DNS TXT query
    crit: notable
    conf: 0.9
    for: [csharp, swift, kotlin, php, javascript, typescript, rust, python]
    if:
      type: text
      regex: '(?i)\b(nslookup|dig|resolveTxt|dns[.]resolve)\b.{0,80}(TXT|type[= ]TXT|txt)'

composite_rules:
  - id: source-txt-query
    desc: Source code requests DNS TXT records
    conf: 0.9
    any:
      - id: micro-behaviors/communications/dns/txt::python-dnspython-query-txt
      - id: micro-behaviors/communications/dns/txt::python-dnspython-resolve-txt
      - id: micro-behaviors/communications/dns/txt::node-txt-lookup
      - id: micro-behaviors/communications/dns/txt::perl-net-dns-txt-query
      - id: micro-behaviors/communications/dns/txt::perl-nslookup-txt-command
      - id: micro-behaviors/communications/dns/txt::php-dns-get-record-txt
      - id: micro-behaviors/communications/dns/txt::ruby-resolv-txt-query
      - id: micro-behaviors/communications/dns/txt::powershell-resolve-dns-txt-capture
      - id: micro-behaviors/communications/dns/txt::powershell-nslookup-txt-capture
      - id: micro-behaviors/communications/dns/txt::go-net-lookup-txt
      - id: micro-behaviors/communications/dns/txt::nslookup-txt-command-source

  - id: source-txt-response
    desc: Source code captures DNS TXT response data
    conf: 0.95
    any:
      - id: micro-behaviors/communications/dns/txt::python-dns-txt-response-capture
      - id: micro-behaviors/communications/dns/txt::node-resolve-txt-response-capture
      - id: micro-behaviors/communications/dns/txt::perl-dns-txt-response-capture
      - id: micro-behaviors/communications/dns/txt::php-dns-txt-response-capture
      - id: micro-behaviors/communications/dns/txt::ruby-dns-txt-response-capture
      - id: micro-behaviors/communications/dns/txt::powershell-resolve-dns-txt-capture
      - id: micro-behaviors/communications/dns/txt::powershell-nslookup-txt-capture
      - id: micro-behaviors/communications/dns/txt::shell-dns-txt-response-capture
      - id: micro-behaviors/communications/dns/txt::go-dns-txt-response-capture
