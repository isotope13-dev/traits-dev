# Go's resolver API is the compiled/source equivalent of the TXT lookups
# covered by the scripting-language files. The lookup is neutral; the DNS
# tunneling objective combines it with encoded, variable labels or execution.
defaults:
  platforms: [windows, linux, macos]
  for: [go]
  attack: T1071.004
  mbc: C0011
  crit: notable
  conf: 0.92

traits:
  - id: go-net-lookup-txt
    desc: Go requests DNS TXT records with net.LookupTXT
    if:
      type: symbol
      kind: call
      exact: net.LookupTXT

  - id: go-default-resolver-lookup-txt
    desc: Go resolver requests DNS TXT records
    if:
      type: symbol
      kind: call
      exact: net.DefaultResolver.LookupTXT

  - id: go-dns-txt-response-capture
    desc: Go captures a net.LookupTXT response
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*[A-Za-z_]\w*\s*,\s*\w+\s*(:=|=)\s*net\.LookupTXT\s*\('
