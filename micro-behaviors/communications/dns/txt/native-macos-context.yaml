# The rules combine DNS TXT lookup with file/process or LaunchAgent clues.
# They do not connect TXT response bytes to a written or launched path.
defaults:
  crit: suspicious
  conf: 0.99
  platforms: [macos]
  for: [c, cpp, objc]

composite_rules:
  - id: native-dns-txt-write-detached-exec-context
    for: [c]
    desc: DNS TXT with write and detached exec
    all:
      - id: micro-behaviors/communications/dns/txt::unix-txt-lookup-ns-t-txt
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: micro-behaviors/process/daemonize/detach::setsid-call
      - id: micro-behaviors/process/create/execv::c-exec-family-source

  - id: native-dns-txt-launchagent-context
    for: [c]
    desc: DNS TXT with LaunchAgent and detached exec
    all:
      - id: micro-behaviors/communications/dns/txt::unix-txt-lookup-ns-t-txt
      - id: micro-behaviors/process/fork/clone::c-fork-call
      - id: micro-behaviors/process/daemonize/detach::setsid-call
      - id: micro-behaviors/process/create/execv::c-exec-family-source
      - id: micro-behaviors/os/service/launchagent::source-launchagents-plist
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/start::launchctl-load-command
