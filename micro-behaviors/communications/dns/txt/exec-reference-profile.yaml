defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: generated-bundle-dns-and-exec-references
    desc: Generated bundle references DNS TXT and shell APIs
    crit: notable
    conf: 0.97
    mbc: B0030
    attack: T1071.004
    all:
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
      - id: micro-behaviors/communications/dns/txt::resolvetxt-literal
    any:
      - id: metadata/import/builtin::child-process-module-reference
      - id: micro-behaviors/process/create/shell/bridge::execsync-method-literal
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  # A packed JavaScript stage that combines an obfuscated detached child,
  # hidden-window handling, event-loop detachment, and file staging is a
  # runtime payload rather than ordinary library obfuscation.
