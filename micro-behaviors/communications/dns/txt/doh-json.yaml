defaults:
  platforms: [windows, unix]
  for: [scripts, source, html]
  crit: notable
traits:
  - id: doh-txt-query-parameter
    desc: DNS JSON query parameter requests TXT records
    conf: 0.95
    if:
      type: string_literal
      regex: '(?i)[?&]type=(TXT|16)\b'
  - id: json-answer-txt-filter
    desc: Filters DNS JSON answers for TXT records
    conf: 0.95
    if:
      type: text
      regex: '\.Answer\.find\([^\n]{0,100}\.type\s*===?\s*16\b'
