defaults:
  platforms: [windows, unix]
  for: [perl]
  mbc: C0011
  attack: T1071.004
  crit: notable
  conf: 0.92

traits:
  # Backticks/qx are command_string nodes, not named call facts. Query that
  # syntax directly so comments and ordinary quoted examples do not match.
  - id: perl-nslookup-txt-command
    desc: Perl invokes nslookup for TXT records
    if:
      type: tree-sitter
      query: |
        ((command_string content: (string_content) @command)
         (#match? @command "(?i)^\\s*(/usr/bin/)?nslookup\\s+-(type|querytype|q)=TXT\\b"))

  - id: perl-net-dns-txt-query
    desc: Perl requests DNS TXT records
    if:
      type: text
      regex: '->query\s*\([^)]{0,160}["'']TXT["'']'

  - id: perl-dns-txt-response-capture
    desc: Perl captures DNS TXT response
    conf: 0.95
    if:
      type: text
      regex: '\bmy\s+\$\w+\s*=\s*\$\w+->query\([^)]{0,160}["'']TXT["'']'
