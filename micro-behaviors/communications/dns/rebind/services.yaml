# DNS rebinding-as-a-service hostnames. rbndr.us and 1u.ms are public services
# that return one A record on the first lookup and a different one (typically a
# loopback/RFC1918 address) on the next, so a page loaded from such a host can
# defeat the browser same-origin check and then reach services bound on the
# victim's own machine. Their hostnames carry the target IPs inline (hex-octet
# pairs for rbndr.us; make-A-<ip>-rr-A-<ip> for 1u.ms). Seeing one is a strong
# structural signal of a rebinding attack rather than ordinary DNS.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, python, shell, go]

traits:
  - id: rebinding-service-hostname
    desc: DNS rebinding-as-a-service hostname
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(rbndr\.us|1u\.ms)\b'
