defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-shell-dns-txt-query"
    desc: "Lua command queries DNS TXT records"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "os.execute"
      arg:
        from:
          call: "^string\\.format$"
          argument: 0
          literal: "(?i)\\bnslookup\\s+-type=txt\\b"
  - id: "lua-shell-dig-txt-query"
    desc: "Lua command queries DNS TXT records"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "os.execute"
      arg:
        from:
          call: "^string\\.format$"
          argument: 0
          literal: "(?i)\\bdig\\s+\\+short\\s+TXT\\b"
composite_rules:
  - id: lua-shell-txt-query-command
    desc: Lua executes a formatted DNS TXT query
    crit: notable
    conf: 0.96
    any:
      - id: lua-shell-dns-txt-query
      - id: lua-shell-dig-txt-query
