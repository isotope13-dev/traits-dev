# A module-scope try block whose own statements resolve a hostname, with a
# broad handler that only passes. The lookup runs when the module is
# imported and any failure is discarded. This records where the lookup runs
# and how errors are handled; it does not establish what the name carries.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-module-try-silent-dns-lookup
    desc: Import-time DNS lookup with silenced errors
    crit: notable
    conf: 0.9
    attack: T1071.004
    if:
      type: tree-sitter
      language: python
      # The call may stand alone or feed an assignment; either way it is a
      # direct statement of the module-level try body, so a lookup inside a
      # function defined there (and never called) does not match.
      query: |
        (module
          (try_statement
            body: (block
              [
                (expression_statement
                  (call function: (_) @callee))
                (expression_statement
                  (assignment right: (call function: (_) @callee)))
              ])
            (except_clause
              (block . (pass_statement) .)) @handler)
          (#match? @callee "((^|\\.)(getaddrinfo|gethostbyname(_ex)?|gethostbyaddr)|(^|\\.)resolver\\.(resolve|query))$")
          (#match? @handler "^except\\s*(\\(?\\s*(Exception|BaseException|OSError|socket\\.\\w+)[^:]*)?:"))
