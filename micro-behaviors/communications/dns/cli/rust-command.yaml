defaults:
  platforms: [unix, windows]
  for: [rust]
traits:
  - id: rust-dns-cli-command-new
    desc: Rust spawns nslookup, dig or host
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: 'Command::new\(\s*"(nslookup|dig|host)"\s*\)'
  - id: rust-dns-query-value-dot-host-format
    desc: Rust formats value.host query name
    crit: notable
    conf: 0.8
    if:
      type: text
      exclude_comments: true
      regex: 'format!\(\s*"\{\}\.\{\}"\s*,\s*\w+\s*,\s*\w+\s*\)'
