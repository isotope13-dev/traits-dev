defaults:
  platforms: [unix, netbsd]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: host-txt-query-call
    desc: Calls host with TXT query type
    if:
      type: symbol
      kind: call
      exact: host
      args:
        - index: 0
          kind: identifier
          name: -t
        - index: 1
          regex: '(?i)^txt$'
