defaults:
  platforms: [linux, macos, windows]
  for: [java, kotlin]
  crit: notable
  conf: 0.95
  attack: T1071.004
traits:
  - id: jvm-nslookup-variable-name-helper
    desc: Passes variable DNS name to nslookup
    if:
      type: text
      regex: '(?is)\b([A-Za-z_$][\w$]*\.)?run\s*\(\s*["'']nslookup["'']\s*,\s*[A-Za-z_$][\w$]*\s*\)'
