defaults:
  platforms: [unix, windows]
  for: [kotlin]
  crit: notable
  conf: 0.95
composite_rules:
  # Co-occurrence does not bind a credential file to a DNS argument or prove
  # that an arbitrary run helper launches nslookup.
  - id: kotlin-auth-path-file-input-nslookup-context
    desc: SSH/AWS file input with nslookup reference
    all:
      - id: micro-behaviors/fs/path/credential::kotlin-ssh-aws-path-cluster
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
    any:
      - id: micro-behaviors/communications/dns/cli::nslookup-command-name
      - id: micro-behaviors/communications/dns/lookup::nslookup-command-literal
      - id: micro-behaviors/communications/dns/cli::nslookup
  - id: kotlin-file-input-bit-case-nslookup-context
    desc: File/bit/case context near nslookup helper
    near_lines: 80
    all:
      - id: micro-behaviors/fs/path/credential::kotlin-ssh-aws-path-cluster
      - id: micro-behaviors/fs/read/file/full::kotlin-file-read-call
      - id: metadata/lang/source/syntax/operator::low-bit-mask-expression-text
      - id: micro-behaviors/communications/dns/cli::jvm-nslookup-variable-name-helper
    any:
      - id: micro-behaviors/data/string/case::source-case-transform
      - id: micro-behaviors/data/string/case::kotlin-char-case-transform
