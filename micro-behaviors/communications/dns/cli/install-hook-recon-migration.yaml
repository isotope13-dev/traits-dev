defaults:
  platforms:
  - unix
  - windows
traits:
- id: js-nslookup-exec
  desc: JS exec references dynamic nslookup
  crit: suspicious
  conf: 0.95
  for:
  - javascript
  if:
    type: text
    regex: '(?is)\bexec(Sync)?\s*\([^)]{0,500}nslookup\s+\$\{[^}]{1,50}\}\.[a-zA-Z0-9]'
- id: npm-preinstall-nslookup
  desc: NPM preinstall invokes nslookup
  crit: suspicious
  conf: 0.94
  for:
  - package.json
  if:
    type: value
    path: scripts.preinstall
    regex: \bnslookup\b
