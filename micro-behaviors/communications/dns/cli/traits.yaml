defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: nslookup
    desc: nslookup command
    for: [shell, batch]
    if:
      type: text
      word: nslookup
    downgrade:
      any:
        - id: metadata/binary/resource/
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
  - id: dig
    desc: dig DNS command
    for: [shell]
    if:
      type: text
      regex: (?m)(^|[;&|\s(])dig\s+.{0,120}\b[A-Za-z0-9-]{1,63}(\.[A-Za-z0-9-]{1,63}){1,5}\b
  - id: dns-cli-spliced-variable-label
    # A shell variable spliced *between* the labels of a hostname
    # (static.$chunk.static.tld) is the shape of a data-carrying DNS query:
    # the resolver never sees the payload, but the authoritative server for the
    # trailing domain logs every label. Legitimate lookups resolve a whole
    # hostname held in one variable (dig "$host"); splicing a variable into the
    # middle of a dotted name is how base64/hex chunks ride out over DNS. The
    # named exfil rail in SOCRadar's Operation Master used
    # task.row.$chunk.x.$random.victim exactly this way.
    desc: DNS query splices a variable subdomain label
    crit: suspicious
    conf: 0.9
    for: [shell]
    platforms: [unix, netbsd]
    if:
      type: text
      regex: '(?m)\b(dig|nslookup)\b[^\r\n]{0,80}\.\$\{?\w+\}?\.'
  - id: dig-txt-template
    desc: dig TXT query with templated host
    crit: notable
    conf: 0.9
    for: [scripts, binaries, c, cpp, objc]
    platforms: [unix]
    if:
      type: text
      regex: 'dig\s+\+short\s+TXT\s+[%$][A-Za-z_({]'
  - id: perl-dig-command-string
    desc: Perl dig command string
    for: [perl]
    if:
      type: text
      regex: 'dig\s+\+short\s+txt\s+[''"]?\$'
  - id: host
    desc: host DNS command
    crit: notable
    for: [shell]
    if:
      type: text
      regex: (?m)(^|[;&|()])\s*host\s+(\$\w+\.|[A-Za-z0-9*_-]+\.){1,5}[A-Za-z]{2,}\b
    not:
      - substr: "this.xterm.open"
  - id: host-var-subdomain
    desc: host DNS lookup with shell var subdomain
    crit: suspicious
    conf: 0.92
    attack: T1048.003
    for: [shell]
    if:
      type: text
      regex: (?m)(^|[;&|()])\s*host\s+\$\w+\.
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      - id: well-known/tool/detection/wazuh/
  - id: dnsmasq
    desc: dnsmasq resolver command
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: (?m)(^|[;&|()\s])dnsmasq(\s|$)
  - id: getent-ahostsv4
    desc: getent resolves IPv4 addresses
    crit: notable
    conf: 0.9
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '(?m)(^|[;&|()\s])getent\s+ahostsv4\b'
  - id: ping-hex-subdomain
    desc: ping resolves long hex subdomain
    crit: suspicious
    conf: 0.95
    attack: T1048.003
    for: [shell]
    if:
      type: text
      regex: ping\s+-[cn]\s+\d+\s+[0-9a-f]{12,}\.[A-Za-z0-9.-]+
  - id: ping-var-subdomain
    desc: ping resolves templated hostname
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: ping\s+-[cn]\s+\d+\s+\$\{\w+\}
