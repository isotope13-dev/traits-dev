defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, pe, elf]
  mbc: C0001
  attack: T1071.004

traits:
  - id: doh-google
    desc: Google DoH endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: dns.google/dns-query
    unless:
      - id: well-known/lib/runtime/scripted/v8::isolate-symbol
  - id: doh-quad9
    desc: Quad9 DoH endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: dns.quad9.net/dns-query
    unless:
      - id: well-known/lib/runtime/scripted/v8::isolate-symbol
  - id: doh-opendns
    desc: OpenDNS DoH endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: dns.opendns.com/dns-query
    unless:
      - id: well-known/lib/runtime/scripted/v8::isolate-symbol
  - id: doh-appliedprivacy
    desc: AppliedPrivacy DoH endpoint
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: doh.appliedprivacy.net/query
    unless:
      - id: well-known/lib/runtime/scripted/v8::isolate-symbol

composite_rules:
  - id: doh-endpoint
    desc: Known DoH endpoint reference
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/communications/dns/doh::doh-cloudflare-json
      - id: doh-google
      - id: micro-behaviors/communications/dns/doh::doh-google-json
      - id: doh-quad9
      - id: doh-opendns
      - id: doh-appliedprivacy
  # Several public resolvers hard-coded in one file select a resolver
  # failover list. A single endpoint can be a documented client setting.
  - id: doh-resolver-list
    desc: Multiple public DoH resolver endpoints hard-coded together
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/communications/dns/doh::doh-cloudflare-json
      - id: doh-google
      - id: micro-behaviors/communications/dns/doh::doh-google-json
      - id: doh-quad9
      - id: doh-opendns
      - id: doh-appliedprivacy
    needs: 2
