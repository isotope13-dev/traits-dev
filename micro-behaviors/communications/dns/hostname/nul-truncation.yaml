# A hostname-shaped literal with text on both sides of an embedded NUL.
# Length-aware validators see the whole string, including the suffix after
# the NUL; resolvers that pass the name on as a C string stop at the NUL and
# query only the prefix. Matching the decoded literal makes the escape
# spelling (\0, \x00, \u0000, a raw byte) and the language irrelevant.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: nul-suffixed-hostname-literal
    desc: Hostname literal embeds NUL before suffix
    crit: notable
    conf: 0.92
    if:
      type: literal
      exclude_docstrings: true
      regex: '^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\x00\.?[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
