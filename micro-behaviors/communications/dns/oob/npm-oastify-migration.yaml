defaults:
  platforms: [windows, unix]
  for: [package.json]
composite_rules:
  - id: node-oastify-dns-sidecar
    desc: Encoded OASTify marker and DNS resolution
    crit: suspicious
    conf: 0.99
    for: [javascript]
    all:
      - id: metadata/lang/encoding/base64::node-oastify-b64
      - id: metadata/import/builtin::require-dns
      - id: micro-behaviors/communications/dns/resolver::dns-resolve4
    any:
      - id: metadata/file/size::javascript-small-file-5k
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
  - id: node-oastify-dns-callback
    desc: Node sends DNS callback to Oastify
    crit: suspicious
    conf: 0.94
    attack: "T1071.004"
    for: [javascript]
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oastify
      - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
      - id: micro-behaviors/communications/dns/resolver::node-oastify-query-argument
  - id: npm-postinstall-node-oastify-dns-callback
    desc: npm postinstall sends Oastify DNS callback
    crit: suspicious
    conf: 0.995
    attack: "T1071.004"
    scope: archive
    for: [javascript, package.json, npm]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: node-oastify-dns-callback
