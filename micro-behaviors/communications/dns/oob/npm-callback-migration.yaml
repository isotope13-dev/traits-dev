defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-postinstall-oob-dns-callback
  desc: npm postinstall performs DNS lookup to an OOB callback
  crit: suspicious
  conf: 0.98
  for: [npm, tar, package.json, javascript, typescript]
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup-with-oob-host-text
  unless:
  - id: metadata/path/directory::test-directory-component
- id: npm-prepare-oob-dns-callback
  desc: npm prepare performs DNS lookup to an OOB callback
  crit: suspicious
  conf: 0.98
  for: [npm, tar, package.json, javascript, typescript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
  - id: metadata/package/scripts/command::npm-prepare-node-index-hook
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup-with-oob-host-text
  unless:
  - id: metadata/path/directory::test-directory-component

