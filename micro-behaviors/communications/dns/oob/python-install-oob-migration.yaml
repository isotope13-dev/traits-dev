defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: python-install-hook-dns-oob-clues
  desc: Install-hook, DNS and OOB references in archive
  conf: 0.96
  scope: archive
  # Archive-wide co-occurrence can combine unrelated components and does not
  # establish a DNS lookup by the hook or a connection to the OOB host.
  for: [python, pkginfo, python_sdist, whl, tar, zip]
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/dns/resolver::getaddrinfo

