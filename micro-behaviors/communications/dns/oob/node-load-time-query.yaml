# The collector zone must contribute to the queried name itself; a callback
# host in unrelated text beside an ordinary lookup is not this observation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.95
traits:
  - id: node-load-time-oob-label-query
    desc: Load-time DNS query under an oob. zone
    if:
      type: symbol
      kind: call
      regex: '\.(resolve(4|6|Txt|Any|Cname|Mx|Ns|Srv)?|lookup)$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
      arg:
        index: 0
        from:
          value: '(?i)(^|\.)oob(\.[a-z0-9-]{1,63}){2,6}$'
  - id: node-load-time-oast-service-query
    desc: Load-time DNS query to public OAST service
    if:
      type: symbol
      kind: call
      regex: '\.(resolve(4|6|Txt|Any|Cname|Mx|Ns|Srv)?|lookup)$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
      arg:
        index: 0
        from:
          value: '(?i)(^|\.)(oastify\.com|burpcollaborator\.net|interact(sh\.com|\.sh)|oast\.[a-z]{2,6}|dnslog\.cn)$'
