defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: import-time-dns-callback
  desc: Init file with OOB DNS lookup clues
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/dns/resolver::gethostbyname
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
- id: import-dns-oob-identity-beacon
  desc: Import context, user query and OOB DNS clues
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/profile/source-indications::runs-at-import-or-install
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/process/identity/query/principal::python-getpass-user
  any:
  - id: micro-behaviors/communications/dns/resolver::gethostbyname
  - id: micro-behaviors/communications/dns/resolver::getaddrinfo
- id: init-dns-oob-silent-beacon
  desc: Init context, silent errors and OOB DNS clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
  any:
  - id: micro-behaviors/communications/dns/resolver::gethostbyname
  - id: micro-behaviors/communications/dns/resolver::getaddrinfo
