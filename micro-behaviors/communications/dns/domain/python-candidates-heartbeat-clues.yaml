# Hostname-shaped expression, TLD iteration and a heartbeat routine label
# are co-occurring clues; they do not establish a date seed or a C2 channel.
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-domain-candidates-heartbeat-clues
    desc: Python domain candidates and heartbeat clues
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/dns/domain::python-md5-slice-domain-label
      - id: micro-behaviors/communications/dns/domain::python-tld-candidate-rotation
      - id: micro-behaviors/time/schedule/interval::heartbeat-routine-label
