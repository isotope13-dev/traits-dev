defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.004

traits:
  - id: tyui54345-spi-pool
    desc: tyui54345 numbered SPI domain pool
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)^spi[1-3]\.tyui54345\.xyz$'

  - id: zxcv56745-spi-pool
    desc: zxcv56745 numbered SPI domain pool
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)^spi[1-3]\.zxcv56745\.xyz$'

  - id: alidns-doh-format
    desc: AliDNS resolve API format string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)^https?://(dns\.alidns\.com|223\.5\.5\.5)/resolve\?name=%s&type=%d$'
