# Rust keeps source paths for panic locations, so a module named dga.rs
# announces a domain-generation algorithm in the shipped binary.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]
  attack: T1568.002

traits:
  - id: rust-dga-module-path
    desc: Rust binary contains a dga.rs module path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'src[\\/]dga\.rs\b'
