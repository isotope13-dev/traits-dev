# Python-built candidate hostnames: a hash slice becomes a domain label and a
# literal TLD list supplies rotating candidates. Time-seeded domain generation
# feeds the label from a digest of the current date; the DGA composites pair
# these mechanics with a check-in channel.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-md5-slice-domain-label
    desc: Python derives a digest slice as hostname
    if:
      type: text
      regex: '\b\w+\([^()\n]{0,80}\)\s*\[\s*:\s*\d+\s*\]\s*\+\s*\w+'

  - id: python-tld-candidate-rotation
    desc: Python loops a literal dot-TLD candidate list
    if:
      type: text
      regex: 'for\s+\w+\s+in\s+\[[^\]\n]{0,140}["'']\.(cc|io|com|net|org|xyz|top|tk|ml|cn|info|biz)["'']'
