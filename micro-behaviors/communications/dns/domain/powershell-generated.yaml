defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95

traits:
  - id: powershell-date-seeded-domain-generator
    desc: PowerShell date-seeded domain generation
    if:
      type: yara
      source: |
        rule powershell_date_seeded_domain_generator {
          strings:
            $day = "DayOfYear" ascii nocase
            $year = /\.[' ]*Year[' ]*/ ascii nocase
            $rng = "System.Random" ascii nocase
            $alphabet = /["'][a-z]{20,26}[0-9]{6,10}["']/ ascii nocase
            $sample = /\.[' ]*next[' ]*\(\s*0\s*,/ ascii nocase
            $suffix = /\+\s*["']\.(com|net|org|top|fun|xyz|cn)["']/ ascii nocase
          condition:
            $day and $year and $rng and $alphabet and $sample and #suffix >= 3
        }
