# JavaScript dynamic domain generation
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: js-wordlist-dynamic-domain-template
    desc: JavaScript generates dynamic domain name
    if:
      type: text
      regex: '`\$\{[^`\n]{1,60}\}\.(dedyn\.io|ddns\.net|duckdns\.org)'
