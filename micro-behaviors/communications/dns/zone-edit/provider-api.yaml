# Authoritative DNS record edits made through a hosting provider's control
# plane rather than through the resolver.
#
# Editing a zone is ordinary infrastructure automation — terraform providers,
# ACME DNS-01 solvers, and failover scripts all do it — so these stay neutral
# capabilities. What makes them worth surfacing is that a single successful
# call moves an organisation's mail or web traffic, which is why they are the
# payoff step for an attacker who has borrowed a credential rather than
# breaking one.
defaults:
  platforms: [unix, windows]
  for: [json, text, markdown, scripts, source]
  crit: notable
  conf: 0.93

traits:
  - id: dns-records-api-path
    desc: DNS records API path
    if:
      type: text
      regex: '/dns_records(/|\b)'

  - id: route53-record-set-change-api
    desc: Route 53 record-set change API
    if:
      type: text
      regex: '\b(ChangeResourceRecordSets|change_resource_record_sets)\b'

  - id: google-cloud-dns-changes-api-path
    desc: Google Cloud DNS managed-zone path
    if:
      type: text
      regex: '/dns/v1/projects/[^/"''\s]{1,64}/managedZones'

  - id: digitalocean-domain-records-api-path
    desc: DigitalOcean domain records API path
    if:
      type: text
      regex: '/v2/domains/[^/"''\s]{1,64}/records\b'

  - id: dns-address-record-type-field
    desc: DNS address-record type field
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\btype\\?"\s*:\s*\\?"(A|AAAA|CNAME|MX|NS|TXT)\\?"'

composite_rules:
  - id: dns-provider-record-endpoint
    desc: DNS provider record-management API
    crit: notable
    conf: 0.94
    any:
      - id: dns-records-api-path
      - id: route53-record-set-change-api
      - id: google-cloud-dns-changes-api-path
      - id: digitalocean-domain-records-api-path

  - id: dns-record-repoint-request
    desc: Writes a DNS address record via provider API
    crit: notable
    conf: 0.95
    near_bytes: 800
    all:
      - id: dns-provider-record-endpoint
      - id: dns-address-record-type-field
      - id: micro-behaviors/communications/http/request/result::http-write-request-method
