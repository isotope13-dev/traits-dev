defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source]
  crit: notable
  conf: 0.92
  attack: T1071.004
  mbc: C0011

traits:
  - id: dnspython-sig-type
    desc: References dnspython SIG record type
    if:
      type: text
      substr: dns.rdatatype.SIG

  - id: library-dns-sig-type
    desc: References a library DNS SIG type
    if:
      type: text
      regex: '\b(RecordType|QType)(::|\.)SIG\b|\bdns\.(TypeSIG|SIG)\b'

  - id: native-dns-sig-type
    desc: References a native DNS SIG constant
    if:
      type: text
      regex: '\b(DNS_TYPE_SIG|TYPE_SIG|ns_t_sig)\b'

  - id: snake-type-covered-zero
    desc: Sets snake-case type-covered to zero
    conf: 0.96
    if:
      type: text
      regex: '\b(type_covered|covered_type)\b\s*(:|=)\s*0\b'

  - id: camel-type-covered-zero
    desc: Sets camel-case type-covered to zero
    conf: 0.96
    if:
      type: text
      regex: '\b(typeCovered|TypeCovered|CoveredType)\b\s*(:|=)\s*0\b'

composite_rules:
  - id: object-dns-sig0-record-construction
    desc: Constructs an object-style DNS SIG(0) record
    crit: notable
    conf: 0.98
    all:
      - id: library-dns-sig-type
    any:
      - id: snake-type-covered-zero
      - id: camel-type-covered-zero

  - id: native-dns-sig0-record-construction
    desc: Constructs a native DNS SIG(0) record
    crit: notable
    conf: 0.98
    all:
      - id: native-dns-sig-type
    any:
      - id: snake-type-covered-zero
      - id: camel-type-covered-zero
