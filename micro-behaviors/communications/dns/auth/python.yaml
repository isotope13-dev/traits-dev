# dnspython primitives for constructing SIG(0)-authenticated DNS messages.
# These are neutral protocol mechanics; exploit intent is added by objectives
# that require a malformed signature and a delivery pattern.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.94
  attack: T1071.004
  mbc: C0011

traits:
  - id: dnspython-rdata-from-wire
    desc: Constructs dnspython record data from wire bytes
    if:
      type: symbol
      kind: call
      exact: dns.rdata.from_wire

  - id: dnspython-rrset-from-rdata
    desc: Constructs a dnspython RRset from record data
    if:
      type: symbol
      kind: call
      exact: dns.rrset.from_rdata

composite_rules:
  - id: dnspython-sig0-record-construction
    desc: Constructs a DNS SIG(0) record from raw record data
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/auth::dnspython-sig-type
      - id: dnspython-rdata-from-wire
      - id: dnspython-rrset-from-rdata
