# DNS policy rewriting and hijack actions are neutral capabilities.  Proxy,
# filtering, and parental-control software commonly implements them; intent
# must come from an objective composite rather than these atoms.
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.92

traits:
  - id: dns-rule-hijack-action
    desc: Configures a DNS hijack action
    if:
      type: symbol
      kind: member
      exact: dns.RuleAction_Hijack

  - id: dns-rewrite-server-endpoint
    desc: Builds a DNS rewrite endpoint
    if:
      type: symbol
      kind: member
      exact: config.RewriteServer
