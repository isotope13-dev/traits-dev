defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: hostname-and-dynamic-oob-dns
    desc: Hostname and dynamic OOB DNS references
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/sysinfo/hostname/
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
    any:
      - id: dns-resolve-dynamic-name
      - id: dns-resolve-bound-dynamic-name
      - id: dns-resolve4-dynamic-name
      - id: dns-lookup-dynamic-name
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
  - id: npm-oob-dns-host-user-references
    desc: npm archive references OOB DNS and host identity
    crit: suspicious
    conf: 0.99
    scope: archive
    for: [npm, package.json, javascript, typescript]
    all:
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
      - id: node-dns-lookup-with-oob-host-text
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
    unless:
      - id: metadata/package/testing/presence/harness/
