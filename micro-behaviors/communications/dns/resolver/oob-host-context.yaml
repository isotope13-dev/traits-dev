defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: hostname-and-oob-dns-lookup
    desc: DNS lookup with hostname and OOB references
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/sysinfo/hostname/
      - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
    any:
      - id: dns-require-bound-resolve
      - id: dns-require-bound-lookup
      - id: dns-resolve4
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: npm-oob-dns-host-user-references
    desc: npm archive references OOB DNS and host identity
    crit: suspicious
    conf: 0.99
    scope: archive
    for: [npm, package.json, javascript, typescript]
    all:
      - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
      - id: node-dns-lookup-with-oob-host-text
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
