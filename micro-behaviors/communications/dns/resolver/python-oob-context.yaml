defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.95
composite_rules:
- id: python-silent-dns-oob-reference-cooccurrence
  desc: Silent DNS lookup beside OOB host reference
  all:
  - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
  - id: micro-behaviors/communications/dns/resolver::gethostbyname
  - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
