defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.95

traits:
  - id: node-oastify-query-argument
    desc: Lookup argument contains an Oastify hostname
    if:
      type: symbol
      kind: call
      regex: '\.(lookup|resolve[46]?)$'
      arg:
        index: 0
        from:
          value: '\.oastify\.com\b'
