defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: node-dns-direct-host-identity-argument
    desc: DNS argument includes queried host identity
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(lookup|resolve)$'
      arg:
        index: 0
        from:
          call: '(^|\.)(hostname|userInfo)$'

  - id: node-dns-joined-host-identity-argument
    desc: DNS lookup uses a joined hostname label
    if:
      type: tree-sitter
      query: |
        (statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @host
            value: (call_expression function: (member_expression
              property: (property_identifier) @hostname))))
          (lexical_declaration (variable_declarator
            name: (identifier) @name
            value: (call_expression
              function: (member_expression
                object: (array (call_expression function: (member_expression
                  object: (identifier) @host_use
                  property: (property_identifier) @lower)))
                property: (property_identifier) @join))))
          (expression_statement (call_expression
            function: (member_expression property: (property_identifier) @lookup)
            arguments: (arguments (identifier) @name_use)))
          (#eq? @hostname "hostname")
          (#eq? @host @host_use)
          (#eq? @lower "toLowerCase")
          (#eq? @join "join")
          (#eq? @lookup "lookup")
          (#eq? @name @name_use))
composite_rules:
  - id: node-dns-host-identity-argument
    desc: DNS argument includes queried host identity
    crit: notable
    any:
      - id: node-dns-direct-host-identity-argument
      - id: node-dns-joined-host-identity-argument
