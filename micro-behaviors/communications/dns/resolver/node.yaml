# DNS Lookup Operations (Node.js)
# MBC: C0011 (DNS Communication)
# ATT&CK: T1071.004
#
# Type-specific lookups are in subdirectories:
#   txt/     - TXT record lookups
#   reverse/ - Reverse DNS lookups
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: "C0011"
  attack: "T1071.004"
  crit: notable
  conf: 0.7
traits:
  - id: dns-lookup-call
    desc: Calls a method named dns.lookup
    conf: 0.65
    unless:
      - type: basename
        regex: (^|[\\/])builtin-plugins[\\/]tabby-ssh[\\/]node_modules[\\/]
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: symbol
      kind: call
      exact: dns.lookup
  - id: dns-lookup-variable-name
    desc: dns.lookup() receives a variable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: dns.lookup
      arg:
        index: 0
        kind: identifier
  - id: dns-lookup-in-loop
    desc: DNS lookup call inside a loop
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: 'for\s*\([^)]{1,40}\)\s*\{[\s\S]{0,40}dns\.lookup\s*\('
  # Receiver provenance covers inline requires and local module aliases.
  - id: dns-require-bound-lookup
    desc: Bound dns import issues lookup call
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.lookup$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
  - id: dns-resolve-call
    desc: Calls a method named dns.resolve
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: dns.resolve
  # Bind the receiver to the DNS import, rather than unrelated nearby text.
  - id: dns-require-receiver-resolve
    desc: Bound dns import issues resolve call
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.resolve$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
  # Destructured function imports have no receiver in the projected flow.
  # Bind the imported API and its call in the same lexical body instead.
  - id: dns-destructured-resolve-call
    desc: Destructured DNS resolver is called
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((_
          (_ (variable_declarator
            name: (object_pattern [
              (shorthand_property_identifier_pattern) @api @bound
              (pair_pattern key: (property_identifier) @api
                value: (identifier) @bound)])
            value: (call_expression function: (identifier) @require
              arguments: (arguments (string (string_fragment) @library)))))
          .
          [(lexical_declaration . (variable_declarator name: (identifier) @other) .)
           (variable_declaration . (variable_declarator name: (identifier) @other) .)]*
          .
          (expression_statement (call_expression function: (identifier) @called)))
          (#eq? @require "require")
          (#match? @library "^(node:)?dns$")
          (#eq? @api "resolve")
          (#eq? @bound @called)
          (#not-eq? @other @called)
          (#set! cleave.ignore-comments "true"))
  - id: dns-bound-resolve-variable-name
    desc: Imported DNS resolver receives a variable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '\.resolve$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
      arg:
        index: 0
        kind: identifier

  - id: dns-resolve4-variable-name
    desc: dns.resolve4() receives a variable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: dns.resolve4
      arg:
        index: 0
        kind: identifier
  # Node exposes every record query both on the `dns` module and on each
  # `Resolver` instance (`const r = new Resolver(); r.resolve4(...)`).  Matching
  # the call target instead of a literal `dns.` receiver covers both forms; the
  # instance form is what ESM packages and npm DNS-tunnel payloads ship.
  - id: dns-resolve4
    desc: resolve4() DNS A record query call
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '\.resolve4$'
  - id: dns-resolve6
    desc: resolve6() DNS AAAA record query call
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '\.resolve6$'
  - id: dns-resolve-mx-ns-soa-srv
    desc: resolveMx/Ns/Soa/Srv() record query call
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '\.resolve(Mx|Ns|Soa|Srv)$'
  - id: dns-resolve-cname-record
    desc: resolveCname() DNS alias query call
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '\.resolveCname$'
  # `import { Resolver } from "node:dns/promises"` — an independent resolver
  # object whose server list can be repointed away from the host resolver.
  - id: node-resolver-class-import
    desc: Imports the Node.js DNS Resolver class
    conf: 0.9
    if:
      type: text
      regex: 'Resolver[^;\n]{0,40}from\s*["''](node:)?dns["''/]'
  - id: dns-promises-lookup
    desc: dns.promises.lookup() call
    conf: 0.7
    if:
      type: text
      substr: 'dns.promises.lookup('
  - id: ipv4-family-selection
    desc: Node DNS lookup requests IPv4 address results
    conf: 0.75
    if:
      type: text
      regex: 'dns\.(lookup|resolve4|resolve6|promises\.lookup)\([\s\S]{0,160}family\s*:\s*4'
  - id: ipv4-address-flags
    desc: Node DNS requests IPv4 address flags
    conf: 0.75
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: "dns\\.ADDRCONFIG\\s*\\|\\s*dns\\.V4MAPPED"
composite_rules:
  - id: dns-require-bound-resolve
    desc: Imported Node DNS resolver is called
    crit: notable
    conf: 0.95
    any:
      - id: dns-require-receiver-resolve
      - id: dns-destructured-resolve-call
  - id: ipv4-address-selection
    desc: Node DNS lookup selects IPv4-compatible results
    crit: notable
    conf: 0.75
    any:
      - id: ipv4-family-selection
      - id: ipv4-address-flags
  - id: node-dns-lookup
    desc: Node.js DNS lookup operations
    crit: notable
    conf: 0.7
    any:
      - id: dns-lookup-call
      - id: dns-resolve-call
      - id: dns-resolve4
      - id: dns-resolve6
      - id: dns-promises-lookup
      - id: ipv4-family-selection
      - id: ipv4-address-flags
      - id: dns-require-bound-lookup
      - id: dns-require-bound-resolve
      - id: dns-bound-resolve-variable-name
      - id: dns-resolve-mx-ns-soa-srv
      - id: dns-resolve-cname-record
