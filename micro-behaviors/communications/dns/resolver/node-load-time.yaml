defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
traits:
  - id: node-module-load-dns-request
    desc: Node module queries DNS while loading
    if:
      type: symbol
      kind: call
      regex: '\.(resolve[46]?|lookup)$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
