defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
traits:
  - id: node-module-load-dns-request
    desc: Node module queries DNS while loading
    if:
      type: symbol
      kind: call
      regex: '\.(resolve(4|6|Txt|Any|Cname|Mx|Ns|Srv)?|lookup)$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
  # The callback has an empty body, so neither the answer nor the error is
  # used: the query is made only for its side effect at the name server.
  - id: node-dns-query-result-discarded
    desc: Node DNS query callback ignores its result
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments (_)
            [(arrow_function body: (statement_block) @body)
             (function_expression body: (statement_block) @body)] .))
          (#match? @method "^(lookup|resolve(4|6|Txt|Any|Cname|Mx|Ns|Srv)?)$")
          (#match? @body "^[{][[:space:]]*[}]$"))
