defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
traits:
  - id: python-base64-dns-cli-query
    desc: DNS CLI queries a Base64-derived label
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment left: (identifier) @encoded
            right: (call) @encoder))
          . (expression_statement (call function: (attribute
            object: (identifier) @module attribute: (identifier) @run)
            arguments: (argument_list (list
              (string (string_content) @command)
              [(identifier) @label
               (binary_operator left: (identifier) @label)])))))
          (#match? @encoder "^base64\\.(urlsafe_)?b64encode\\(")
          (#eq? @module "subprocess")
          (#match? @run "^(run|call|check_output|Popen)$")
          (#match? @command "^(nslookup|dig)$")
          (#eq? @encoded @label))
