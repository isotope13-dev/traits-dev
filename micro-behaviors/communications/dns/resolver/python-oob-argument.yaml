defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.98
traits:
- id: python-oob-dns-name-argument
  desc: Python resolves an OOB callback hostname
  if:
    type: symbol
    kind: call
    regex: ^socket\.(gethostbyname|getaddrinfo|gethostbyname_ex)$
    arg:
      index: 0
      from:
        value: (?i)(oastify\.com|interact\.sh|canarytokens\.com|burpcollaborator\.net)$
