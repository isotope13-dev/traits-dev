defaults:
  crit: notable
  platforms: [unix, android, windows]
  for: [elf, macho, pe]
traits:
  - id: ares-init
    desc: ares_init symbol reference
    conf: 0.4
    if:
      type: symbol
      regex: ares_init
    unless:
      - id: metadata/binary/symbols/exports::shared-argumentless-export-thunks
  - id: ares-gethostbyname
    desc: ares_gethostbyname symbol reference
    conf: 0.4
    if:
      type: symbol
      regex: ares_gethostbyname
    unless:
      - id: metadata/binary/symbols/exports::shared-argumentless-export-thunks
  - id: ares-process
    desc: ares_process symbol reference
    conf: 0.4
    if:
      type: symbol
      regex: ares_process
    unless:
      - id: metadata/binary/symbols/exports::shared-argumentless-export-thunks
  - id: ares-destroy
    desc: ares_destroy symbol reference
    conf: 0.4
    if:
      type: symbol
      regex: ares_destroy
    unless:
      - id: metadata/binary/symbols/exports::shared-argumentless-export-thunks
  - id: ares-query
    desc: ares_query symbol reference
    conf: 0.4
    if:
      type: symbol
      regex: ares_query
    unless:
      - id: metadata/binary/symbols/exports::shared-argumentless-export-thunks
  - id: ares-success
    desc: ARES_SUCCESS constant
    conf: 0.4
    if:
      type: text
      substr: ARES_SUCCESS
composite_rules:
  - id: c-ares
    desc: c-ares-related names or constants
    conf: 0.7
    needs: 2
    any:
      - id: micro-behaviors/communications/dns/resolver::ares-destroy
      - id: micro-behaviors/communications/dns/resolver::ares-gethostbyname
      - id: micro-behaviors/communications/dns/resolver::ares-init
      - id: micro-behaviors/communications/dns/resolver::ares-process
      - id: micro-behaviors/communications/dns/resolver::ares-query
      - id: micro-behaviors/communications/dns/resolver::ares-success
