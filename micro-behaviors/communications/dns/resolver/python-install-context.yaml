defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.96
composite_rules:
- id: python-install-hook-hostname-dns-cooccurrence
  desc: Install hook has hostname and DNS queries
  all:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  any:
  - id: micro-behaviors/communications/dns/resolver::getaddrinfo
  - id: micro-behaviors/communications/dns/resolver::gethostbyname
