defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: node-base64-buffer-query
    desc: Resolves a Base64-buffer-derived DNS name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(resolve[46]?|lookup)$'
      arg:
        index: 0
        from:
          call: '^Buffer\.from\.toString$'
          literal: '^base64$'
          through:
            - call: '\.(slice|substring)$'
              receiver: true
