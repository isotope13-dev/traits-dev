defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-dns-lookup-with-oob-host-text
    desc: DNS lookup coexists with OOB hostname text
    crit: suspicious
    conf: 0.95
    all:
      - id: node-dns-lookup
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: npm-postinstall-oob-dns-calls
    desc: Postinstall hook ships DNS/OOB host calls
    crit: suspicious
    conf: 0.98
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: node-dns-lookup-with-oob-host-text
    unless:
      - id: metadata/package/documentation/disclosure::npm-config-diagnostic-research-beacon
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/naming::test-directory-component
