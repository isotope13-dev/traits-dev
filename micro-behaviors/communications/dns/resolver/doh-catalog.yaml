# Resolver-choice observations: how a file presents DNS resolvers. A file
# that offers several DoH endpoints is a resolver catalog or settings
# chooser (VPN panels, ad-blockers, browser configs), not a pinned
# resolver: pinning hardcodes one endpoint, catalogs enumerate many.
# Consumers that read lone DoH URLs as resolver-pinning evidence reference
# this to keep menus out of that claim.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, html]
  crit: notable
  conf: 0.9

traits:
  - id: multi-resolver-doh-catalog
    desc: Offers several DoH resolver endpoints
    count_min: 3
    if:
      type: text
      regex: 'https?://[a-z0-9.-]{4,80}/dns-query\b'
