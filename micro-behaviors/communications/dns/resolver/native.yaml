defaults:
  platforms: [unix, android]
  for: [elf, macho, so]

traits:
  - id: ldns-library-reference
    desc: ldns DNS resolver library reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\blibldns\.so(\.[0-9]+)?\b'

  - id: unbound-control-reference
    desc: unbound resolver control utility reference
    crit: notable
    conf: 0.9
    if:
      type: text
      word: unbound-control
