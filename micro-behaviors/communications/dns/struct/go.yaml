defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1071.004
  mbc: C0011
  crit: notable
  conf: 0.9

traits:
  - id: go-dns-name-constructor
    desc: Go constructs a DNS name
    if:
      type: symbol
      kind: call
      exact: NewName

  - id: go-dns-wire-format-call
    desc: Go serializes DNS to wire format
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.WireFormat$'

  - id: go-dns-record-type-reference
    desc: Go references a DNS record type constant
    if:
      type: text
      regex: '\bRRType[A-Z][A-Za-z0-9_]*\b'

  - id: go-dns-class-reference
    desc: Go references a DNS class constant
    if:
      type: text
      substr: ClassIN

  - id: go-dns-header-constructor
    desc: Go defines a DNS header constructor
    if:
      type: function
      exact: NewHeaderDNS

  - id: go-dns-domain-name-packer
    desc: Go defines a DNS name packer
    if:
      type: function
      exact: packDomainName

composite_rules:
  - id: go-dns-wire-message
    desc: Go constructs and serializes a DNS wire message
    crit: notable
    conf: 0.92
    all:
      - id: go-dns-name-constructor
      - id: go-dns-wire-format-call
    any:
      - id: go-dns-record-type-reference
      - id: go-dns-class-reference

  - id: go-dns-header-wire-builder
    desc: Go constructs a DNS query wire header
    crit: notable
    conf: 0.96
    all:
      - id: go-dns-header-constructor
      - id: go-dns-domain-name-packer
      - id: micro-behaviors/data/buffer::go-big-endian-uint16-append
