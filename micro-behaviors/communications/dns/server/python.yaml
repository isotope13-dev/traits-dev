defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1071.004
  mbc: C0011

traits:
  - id: python-dnslib-txt-answer
    desc: Python dnslib constructs a TXT answer record
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'add_answer\s*\(\s*RR\([^\r\n]{0,240}\bQTYPE\.TXT\b[^\r\n]{0,240}\brdata\s*=\s*TXT\s*\('
