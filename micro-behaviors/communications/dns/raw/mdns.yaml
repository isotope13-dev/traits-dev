defaults:
  for: [source, binaries]
  platforms: [unix, windows]
traits:
  - id: mdns-port-5353
    desc: mDNS port 5353 network target
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: htons\(\s*5353\s*\)
  - id: dnssd-udp-service-tuple
    desc: DNS-SD UDP service discovery tuple
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: _dns-sd.{0,12}_udp.{0,12}local
  - id: dnssd-hex-query
    desc: Hex-escaped DNS-SD query payload
    crit: notable
    conf: 0.85
    for: [python, javascript, php]
    if:
      type: text
      regex: \\x5F\\x64\\x6E\\x73.{0,30}\\x5F\\x75\\x64\\x70
composite_rules:
  - id: dnssd-query
    desc: DNS-SD service discovery query
    crit: notable
    conf: 0.84
    any:
      - id: dnssd-udp-service-tuple
      - id: dnssd-hex-query
