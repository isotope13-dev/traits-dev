# DNS response and resource-record wire shapes. The malformed owner-pointer
# fragment remains a component until paired with a DNS response header; the
# objective composites perform that intent-bearing assembly.
defaults:
  platforms: [unix, windows, appliance]
  for: [data]
  attack: T1071.004
  mbc: C0011

traits:
  - id: dns-zero-question-single-answer-response
    desc: DNS response has one answer
    crit: notable
    conf: 0.98
    size_min: 24
    if:
      type: hex
      offset: 0
      pattern: "?? ?? 8? ?? 00 00 00 01 00 00 00 00"

  - id: dns-owner-pointer-own-rdata-fragment
    desc: DNS owner pointer-to-RDATA wire fragment
    crit: suspicious
    conf: 0.99
    size_min: 24
    if:
      type: hex
      offset: 12
      # c018 points to offset 24, exactly after a compressed owner and the
      # ten fixed RR bytes when this fragment is the first answer.
      pattern: "C0 18 ?? ?? 00 01 ?? ?? ?? ?? ?? ??"

  - id: dnskey-answer-rdata-shape
    desc: DNSKEY answer uses DNSSEC protocol
    crit: notable
    conf: 0.99
    size_min: 28
    if:
      type: hex
      offset: 14
      # Type DNSKEY (48), class IN, then TTL/RDLENGTH/flags and protocol 3.
      pattern: "00 30 00 01 ?? ?? ?? ?? ?? ?? ?? ?? 03"
