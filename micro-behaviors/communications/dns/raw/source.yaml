# Source-level DNS wire construction primitives. These patterns describe
# protocol arithmetic and constants, not a particular resolver or CVE.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, c, cpp, go, rust]
  attack: T1071.004
  mbc: C0011
  crit: notable

traits:
  - id: dns-owner-pointer-to-following-rdata-len
    desc: DNS owner pointer targets following RDATA
    crit: suspicious
    conf: 0.99
    for: [python, go]
    if:
      type: text
      # 0xc000 supplies the DNS compression-pointer tag. With a two-byte
      # compressed owner, the RR RDATA begins 12 bytes after the owner starts.
      regex: '0x[Cc]000\s*\|\s*\(?\s*len\s*\(\s*[\w.]{1,40}\s*\)\s*\+\s*12\b'

  - id: dns-owner-pointer-to-following-rdata-length
    desc: DNS owner pointer targets buffer RDATA
    crit: suspicious
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      regex: '0x[Cc]000\s*\|\s*\(?\s*\w+\.length\s*\+\s*12\b'

  - id: dns-owner-pointer-to-following-rdata-sizeof
    desc: DNS owner pointer targets sizeof RDATA
    crit: suspicious
    conf: 0.99
    for: [c, cpp]
    if:
      type: text
      regex: '0x[Cc]000\s*\|\s*\(?\s*sizeof\s*\(\s*[\w.]{1,40}\s*\)\s*\+\s*12\b'

  - id: dnskey-record-type-number-binding
    desc: Binds the DNSKEY wire record type number
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b(TYPE_?DNSKEY|DNSKEY_?TYPE|DNSKEY)\b\s*[:=]\s*(48|0x30)\b'
