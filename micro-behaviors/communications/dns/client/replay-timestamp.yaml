defaults:
  crit: component
  conf: 0.98
  for: [c, cpp]
  platforms: [unix, windows]

traits:
  - id: packet-replay-timestamp-loop-marker
    desc: Compares packet time with replay clock
    if:
      type: text
      regex: 'while\s*\(\s*packet_ts\s*<\s*mental_time\s*\)'

  - id: packet-replay-capture-timestamp-marker
    desc: Copies timestamps from capture header
    if:
      type: text
      regex: 'packet_ts\.tv_(sec|usec)\s*=\s*pr\.d_pheader\.ts\.tv_(sec|usec)'

  - id: packet-replay-speed-adjusted-clock-marker
    desc: Advances replay clock by elapsed time
    if:
      type: text
      regex: 'mental_time\s*=\s*mental_time\s*\+\s*speedup\s*\*\s*\(\s*now\s*-\s*then\s*\)'

composite_rules:
  - id: timestamp-paced-pcap-packet-replay
    desc: DNS packet replay paced by capture time
    crit: notable
    conf: 0.98
    all:
      - id: packet-replay-timestamp-loop-marker
      - id: packet-replay-capture-timestamp-marker
      - id: packet-replay-speed-adjusted-clock-marker
      - id: micro-behaviors/communications/socket/send::sendto-symbol
