# A hardcoded public resolver address bypasses the host's configured DNS.
# Connectivity probes, DNS tests, and cluster configs name one as often as
# host-profiling scripts do, so the reference is notable on its own and the
# objective composites that cite it supply any attack reading.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]

traits:
  - id: google-public-dns-address
    desc: References Google Public DNS
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b8\.8\.(8\.8|4\.4)\b'
