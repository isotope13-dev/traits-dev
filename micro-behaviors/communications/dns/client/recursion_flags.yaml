defaults:
  crit: suspicious
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: recursion-desired-set
    desc: Sets DNS Recursion Desired (RD) bit (common
    if:
      type: text
      regex: ->rd\s*=\s*1
  - id: recursion-available-check
    desc: "DNS Recursion Available (RA) bit check"
    if:
      type: text
      regex: ->ra\s*==\s*1
