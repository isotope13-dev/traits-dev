defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: recursion-desired-set
    desc: Sets the DNS Recursion Desired (RD) bit
    if:
      type: text
      regex: '->rd\s*=\s*1\b'
  - id: recursion-available-check
    desc: "DNS Recursion Available (RA) bit check"
    if:
      type: text
      regex: '->ra\s*==\s*1\b'
