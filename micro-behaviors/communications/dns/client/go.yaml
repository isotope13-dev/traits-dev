defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
  mbc: C0011

traits:
  - id: dnsx-import
    desc: Imports the dnsx DNS client
    conf: 0.95
    if:
      type: import
      exact: github.com/projectdiscovery/dnsx/libs/dnsx

  - id: dnsx-query-multiple-call
    desc: Calls a QueryMultiple method
    crit: component
    if:
      type: symbol
      kind: call
      regex: '\.QueryMultiple$'

  - id: dns-channel-constructor
    desc: Go constructs a DNS transport channel
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: newDNSChannel

  - id: miekg-dns-import
    desc: Imports the miekg DNS client
    conf: 0.9
    if:
      type: import
      exact: github.com/miekg/dns

  - id: dns-client-exchange-call
    desc: Go DNS client Exchange call
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.Exchange$'

composite_rules:
  - id: dnsx-multi-record-query
    desc: dnsx multi-record DNS query capability
    conf: 0.95
    all:
      - id: dnsx-import
      - id: dnsx-query-multiple-call

  - id: miekg-dns-client
    desc: miekg DNS client query capability
    conf: 0.95
    all:
      - id: miekg-dns-import
      - id: dns-client-exchange-call
