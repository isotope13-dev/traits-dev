defaults:
  crit: notable
  platforms: [android, windows]
  for: [csharp, pe, dll]

traits:
  - id: dotnet-udp-socket-token
    desc: .NET UDP socket API token
    conf: 0.9
    if:
      type: text
      regex: '\bUdpClient\b|SocketType\.Dgram'
  - id: dotnet-dns-context-token
    desc: .NET DNS query API token
    conf: 0.86
    if:
      type: text
      regex: '\bSystem\.Net\.Dns\b|\bDnsClient\b|\bDns\.Resolve\b'
composite_rules:
  - id: dotnet-udp-dns-client
    desc: .NET UDP and DNS API name references
    conf: 0.9
    all:
      - id: dotnet-udp-socket-token
      - id: dotnet-dns-context-token
