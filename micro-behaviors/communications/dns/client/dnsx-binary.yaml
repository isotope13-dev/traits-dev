# Recovered Go function facts, not dependency strings or active traffic.
# Scoped to the format verified against the ARTEX Linux ARM64 sample.
defaults:
  for: [elf]
  platforms: [linux]
  crit: notable
  conf: 0.99

traits:
  - id: go-dnsx-query-multiple
    desc: Compiled DNS multi-record query routine
    if:
      type: function
      exact: github.com/projectdiscovery/dnsx/libs/dnsx.(*DNSX).QueryMultiple

  - id: go-dnsx-trace
    desc: Compiled DNS delegation tracing routine
    if:
      type: function
      exact: github.com/projectdiscovery/dnsx/libs/dnsx.(*DNSX).Trace
