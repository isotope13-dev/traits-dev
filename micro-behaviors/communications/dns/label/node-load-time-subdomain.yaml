defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  # A fixed domain suffix appended to a value: the queried name is a
  # subdomain built at run time, e.g. `label + ".example.net"`.
  - id: node-module-load-dns-suffix-query
    desc: Load-time DNS query appends a domain suffix
    if:
      type: symbol
      kind: call
      regex: '\.(resolve(4|6|Txt|Any|Cname|Mx|Ns|Srv)?|lookup)$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
      arg:
        index: 0
        from:
          value: '^\.([A-Za-z0-9-]{1,63}\.){1,8}[A-Za-z]{2,24}$'
  # Template form of the same query: `${label}.example.net`.
  - id: node-module-load-dns-template-subdomain
    desc: Load-time DNS query of a templated subdomain
    if:
      type: symbol
      kind: call
      regex: '\.(resolve(4|6|Txt|Any|Cname|Mx|Ns|Srv)?|lookup)$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
      arg:
        index: 0
        kind: string
        substr: '}.'
