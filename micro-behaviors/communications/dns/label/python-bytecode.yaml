# A bounded marshal name-table sequence corroborates use in one helper.
# It does not by itself prove that the encoded value reaches the resolver.
defaults:
  platforms: [windows, unix]
  for: [pyc]
traits:
  - id: pyc-base32-resolver-name-sequence
    desc: Bytecode groups Base32 and DNS resolver names
    crit: suspicious
    conf: 0.9
    if:
      type: hex
      pattern: '(DA|FA) 09 62 33 32 65 6E 63 6F 64 65 [0-128] (DA|FA) 0B 67 65 74 61 64 64 72 69 6E 66 6F'
