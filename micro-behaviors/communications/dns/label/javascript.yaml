# JavaScript DNS label / FQDN construction from template literals.
# ATT&CK: T1071.004 (Application Layer Protocol: DNS)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1071.004"

traits:
  # `${chunk}.apex.tld` — variable left-label under a fixed apex. Common in
  # DNS-exfil beacons that encode whoami/hostname (or other recon) as a label.
  - id: js-template-subdomain-label
    desc: Template literal builds variable DNS subdomain
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '^\$\{[A-Za-z_$][\w$]*\}\.[a-z0-9-]+(\.[a-z0-9-]+)+$'
