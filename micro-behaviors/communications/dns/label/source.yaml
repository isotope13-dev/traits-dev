# Source-level DNS label construction patterns.  A variable label is common
# in ordinary service discovery; these rules become suspicious when paired
# with a data encoder and a TXT query by an objective composite.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript]
  attack: T1071.004

traits:
  - id: python-dynamic-dns-label
    desc: Python dotted DNS label construction
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'f["''].{0,100}\{[A-Za-z_]\w*\}.{0,100}\{'

  - id: powershell-dynamic-dns-label
    desc: PowerShell dotted DNS label construction
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '["'']\$[A-Za-z_]\w*\.\$[A-Za-z_]\w*["'']'

  - id: javascript-dynamic-dns-label
    desc: JavaScript dotted DNS label construction
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '`[^`\n]{0,100}\$\{[A-Za-z_$][A-Za-z0-9_$]*\}\s*\.\s*\$\{[A-Za-z_$][A-Za-z0-9_$]*\}'
    not:
      - regex: '\$\{prefix\}\s*\.\s*\$\{key\}'
      - regex: '\$\{outName\}\s*\.\s*\$\{i\}'
      - regex: '\$\{versionNumber\}\s*\.\s*\$\{i\}'
      - regex: '\$\{sectionPath\}\s*\.\s*\$\{loc\}'

composite_rules:
  - id: python-encoded-dynamic-dns-label
    desc: Python encoded dynamic DNS label
    crit: suspicious
    conf: 0.95
    for: [python]
    all:
      - id: python-dynamic-dns-label
      - id: micro-behaviors/data/encode/base64::urlsafe-b64encode-call

  - id: powershell-encoded-dynamic-dns-label
    desc: PowerShell encoded dynamic DNS label
    crit: suspicious
    conf: 0.95
    for: [powershell]
    all:
      - id: powershell-dynamic-dns-label
      - id: micro-behaviors/data/encode/base64::to-base64-string

  - id: javascript-encoded-dynamic-dns-label
    desc: JavaScript encoded dynamic DNS label
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: javascript-dynamic-dns-label
      - id: micro-behaviors/data/encode/base64::tostring-base64

  - id: encoded-dynamic-dns-label
    desc: Encoded dynamic DNS label
    crit: suspicious
    conf: 0.96
    any:
      - id: python-encoded-dynamic-dns-label
      - id: powershell-encoded-dynamic-dns-label
      - id: javascript-encoded-dynamic-dns-label
