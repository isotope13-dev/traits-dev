# Source-level DNS label construction patterns.  Dotted string interpolation
# is common in ordinary file rotation, so the DNS composite requires host/DNS
# context and a nearby resolver API before it is treated as DNS construction.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript, go]
  attack: T1071.004

traits:
  - id: python-dns-query-reference
    desc: Python DNS resolution API reference
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)\b(dns\.resolver|socket\.gethostbyname|socket\.getaddrinfo)\b'

  - id: powershell-dns-query-reference
    desc: PowerShell DNS resolution API reference
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\b(Resolve-DnsName|nslookup|System\.Net\.Dns)\b'

  # Underscore-prefixed DNS labels such as `_beacon.<apex>` are used as
  # takedown-resilient TXT channels that publish a replacement HTTPS base URL.
  - id: dns-txt-beacon-label-prefix
    desc: DNS TXT query label prefixed with _beacon.
    crit: notable
    conf: 0.92
    for: [javascript, typescript, python, powershell, go, shell]
    if:
      type: string_literal
      regex: '^_beacon\.'

  - id: dns-txt-base-https-prefix
    desc: Parses base=https:// from a DNS TXT payload
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, powershell, go, shell]
    if:
      type: text
      substr: 'base=https://'

  - id: javascript-dns-api-reference
    desc: JavaScript DNS API reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bdns\.(lookup|resolve)\b'

  - id: javascript-dns-promises-reference
    desc: JavaScript DNS promises API reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bdns\.promises\.(lookup|resolveTxt?)\b'

  - id: go-hostname-context
    desc: Go source names host or DNS context
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '(?i)\b(hostname|domain|fqdn|dns)\b'

  - id: go-dotted-format
    desc: Go formats a dotted string
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'fmt\.Sprintf\s*\("[^"\n]{0,24}%[a-z][^"\n]{0,16}\.[^"\n]{0,16}%[a-z]'

  # A UUID sitting in a hostname label rather than a URL path.
  #
  # Collector services hand out one host per target so the request that arrives
  # identifies who ran it; when the operator runs their own domain instead of a
  # named service, the per-target label is all that is left to recognise. A
  # UUID immediately followed by a dot is that shape -- `analytics-<uuid>.
  # cloud.example.rs`. Notable alone: some cloud providers do put a GUID in a
  # hostname, so the composites pair this with a resolver call and the install
  # hook that runs it.
  - id: uuid-label-hostname
    desc: Hostname label carries a UUID
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.[a-z]'

composite_rules:
  - id: go-dotted-hostname-format
    desc: Go formats a dotted hostname
    crit: notable
    conf: 0.9
    for: [go]
    all:
      - id: go-hostname-context
      - id: go-dotted-format
    near_lines: 2

  - id: python-dynamic-dns-label
    desc: Python dotted label near a DNS resolution API
    crit: notable
    conf: 0.9
    for: [python]
    all:
      - id: micro-behaviors/data/string/concat::python-dotted-fstring
      - id: python-dns-query-reference
    near_bytes: 2048

  - id: powershell-dynamic-dns-label
    desc: PowerShell dotted label near a DNS resolution API
    crit: notable
    conf: 0.9
    for: [powershell]
    all:
      - id: micro-behaviors/data/string/concat::powershell-dotted-variable-string
      - id: powershell-dns-query-reference
    near_bytes: 2048

  - id: javascript-dynamic-dns-label
    desc: JavaScript dotted label near a DNS resolution API
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    # Do not combine a resolver in the original bundle with a dotted string
    # found only in a decoded payload layer.
    scope: leaf
    all:
      # A bare `dns.*` reference is too weak here: bundled browser and
      # networking libraries routinely mention DNS names without constructing
      # a query label.  Require a call-level Node resolver operation so this
      # composite describes an actual lookup, not source-map or minifier text.
      - id: micro-behaviors/communications/dns/lookup/resolver::node-dns-lookup
    any:
      - id: micro-behaviors/data/string/concat::js-dotted-template-string
      - id: micro-behaviors/data/string/concat::dotted-variable-template
    near_bytes: 2048

  - id: javascript-dns-query-reference
    desc: JavaScript DNS resolution API reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/communications/dns/lookup/txt::resolve-txt-reference
      - id: javascript-dns-api-reference
      - id: javascript-dns-promises-reference

  - id: go-dynamic-dns-label
    desc: Go formats a dotted hostname near a DNS lookup
    crit: notable
    conf: 0.9
    for: [go]
    all:
      - id: go-dotted-hostname-format
      - id: micro-behaviors/communications/dns/lookup/resolver::dns-lookup
    near_bytes: 2048

  - id: python-encoded-dynamic-dns-label
    desc: Python encoded dynamic DNS label
    crit: suspicious
    conf: 0.95
    for: [python]
    all:
      - id: python-dynamic-dns-label
      - id: micro-behaviors/data/encode/base64::urlsafe-b64encode-call
    near_bytes: 1024

  - id: powershell-encoded-dynamic-dns-label
    desc: PowerShell encoded dynamic DNS label
    crit: suspicious
    conf: 0.95
    for: [powershell]
    all:
      - id: powershell-dynamic-dns-label
      - id: micro-behaviors/data/encode/base64::to-base64-string
    near_bytes: 1024

  - id: javascript-encoded-dynamic-dns-label
    desc: JavaScript encoded dynamic DNS label
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: javascript-dynamic-dns-label
      - id: micro-behaviors/data/encode/base64::tostring-base64
    near_bytes: 1024
    unless:
      - id: metadata/file/format/structured::sourcemap-context

  - id: go-encoded-dynamic-dns-label
    desc: Go Base64 data in a variable DNS label
    crit: suspicious
    conf: 0.95
    for: [go]
    all:
      - id: go-dynamic-dns-label
      - id: micro-behaviors/data/encode/base64::go-base64-encode

  - id: encoded-dynamic-dns-label
    desc: Encoded dynamic DNS label
    crit: suspicious
    conf: 0.96
    any:
      - id: python-encoded-dynamic-dns-label
      - id: powershell-encoded-dynamic-dns-label
      - id: javascript-encoded-dynamic-dns-label
      - id: go-encoded-dynamic-dns-label
