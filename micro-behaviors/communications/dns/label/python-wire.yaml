defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-length-prefixed-label-loop
    desc: Encodes dotted labels with their byte lengths
    if:
      type: tree-sitter
      query: |
        (for_statement
          left: (identifier) @label
          right: (call
            function: (attribute attribute: (identifier) @split)
            arguments: (argument_list (string) @separator))
          body: (block
            (expression_statement
              (augmented_assignment
                operator: "+="
                right: (binary_operator
                  left: (call
                    function: (identifier) @bytes
                    arguments: (argument_list
                      (list
                        (call
                          function: (identifier) @len
                          arguments: (argument_list (identifier) @length_label)))))
                  operator: "+"
                  right: (call
                    function: (attribute
                      object: (identifier) @encoded_label
                      attribute: (identifier) @encode)
                    arguments: (argument_list (string) @encoding))))))
          (#eq? @split "split")
          (#match? @separator "^[\"']\\.[\"']$")
          (#eq? @bytes "bytes")
          (#eq? @len "len")
          (#eq? @encode "encode")
          (#match? @encoding "^[\"']ascii[\"']$")
          (#eq? @label @length_label)
          (#eq? @label @encoded_label))
