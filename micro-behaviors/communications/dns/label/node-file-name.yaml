defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-file-derived-query-name
    desc: DNS name derives from file contents
    if:
      type: symbol
      kind: call
      regex: '\.(lookup|resolve[46]?)$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?dns$'
      arg:
        index: 0
        from:
          call: '\.readFileSync$'
          through:
            - call: '^Buffer\.concat$'
              arguments: [0]
            - call: '\.(slice|subarray|toString)$'
              receiver: true
