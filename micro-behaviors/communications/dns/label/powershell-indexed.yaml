defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: powershell-indexed-address-query
    desc: Resolves a name with variable labels
    crit: notable
    if:
      type: text
      regex: '(?i)::GetHostAddresses\s*\(\s*"\$\w+[.]\$\w+[.]'
      exclude_comments: true
composite_rules:
  - id: powershell-hex-indexed-dns-query
    desc: Hex formatting and buffer chunks beside indexed DNS queries
    crit: suspicious
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/data/encode/hex::powershell-pipeline-byte-hex-format
      - id: powershell-indexed-address-query
      - id: micro-behaviors/communications/dns/lookup::dotnet-host-address-lookup-command
      - id: micro-behaviors/data/buffer/chunk::powershell-fixed-step-chunk-loop
      - id: micro-behaviors/data/string/slice::powershell-substring-variable-call
