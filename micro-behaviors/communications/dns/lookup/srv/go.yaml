# Go's resolver API for SRV records is a neutral DNS lookup capability.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1071.004
  mbc: C0011
  crit: notable
  conf: 0.92

traits:
  - id: go-default-resolver-lookup-srv
    desc: Go resolver requests DNS SRV records
    if:
      type: symbol
      kind: call
      exact: net.DefaultResolver.LookupSRV
