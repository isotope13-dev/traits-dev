# Preserved Windows PE/DLL observations, classified by their supported operation.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: winsock-name-resolution-ordinal
    desc: Winsock ordinal name resolution
    crit: notable
    conf: 0.84
    if:
      type: yara
      source: |
        import "pe"
        rule winsock_name_resolution_ordinal {
          strings:
            $library = "WS2_32.dll" ascii nocase
          condition:
            $library and
            (pe.imports("WS2_32.dll", 51) or pe.imports("WS2_32.dll", 52))
        }

