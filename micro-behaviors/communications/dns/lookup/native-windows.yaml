defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  # Ordinary DNS APIs do not establish the ATT&CK DNS C2 technique.
  mbc: C0011
traits:
  - id: dnsapi-string
    desc: DNSAPI library string marker
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: dnsapi
  - id: dns-query-w
    desc: Windows DNS query API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: DnsQuery_W
  - id: dns-query-a
    desc: References Windows ANSI DNS query API
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: DnsQuery_A
  - id: dns-query-w-go
    desc: Go DNS query binding
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: syscall.procDnsQuery_W
  - id: dns-record-list-free
    desc: Free DNS query results
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: DnsRecordListFree
  - id: dns-free
    desc: References Windows DNS result-release API
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: DnsFree
  - id: dns-record-list-free-go
    desc: Go DNS result cleanup binding
    crit: baseline
    conf: 0.8
    if:
      type: text
      exact: syscall.procDnsRecordListFree
  - id: dns-name-compare-w
    desc: Compare DNS names
    crit: notable
    conf: 0.78
    if:
      type: symbol
      exact: DnsNameCompare_W
  - id: dns-name-compare-w-go
    desc: Go DNS name compare binding
    crit: baseline
    conf: 0.78
    if:
      type: text
      exact: syscall.procDnsNameCompare_W
composite_rules:
  - id: dnsapi-lookup
    desc: References Windows DNS query APIs
    crit: notable
    conf: 0.9
    any:
      - id: dns-query-a
      - id: dns-query-w
