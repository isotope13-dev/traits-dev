defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-postinstall-computed-dns-callback
  desc: npm postinstall queries a computed DNS callback name
  crit: suspicious
  conf: 0.98
  for: [npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: micro-behaviors/communications/dns/resolver::dns-resolve4-variable-name
  - id: metadata/package/description/disclosure::desc-dependency-confusion
  unless:
  - id: metadata/path/directory::test-directory-component
