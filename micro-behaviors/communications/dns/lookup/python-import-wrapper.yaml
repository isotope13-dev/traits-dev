defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-import-pyvac-dns-wrapper
    desc: Import resolves a PyVAC callback host
    size_max: 16000
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition
            name: (identifier) @wrapper
            body: (block
              [(expression_statement
                 (call function: (attribute
                   object: (identifier) @module
                   attribute: (identifier) @resolver)
                   arguments: (argument_list
                     . (string (string_content) @target))))
               (try_statement body: (block
                 (expression_statement
                   (call function: (attribute
                     object: (identifier) @module
                     attribute: (identifier) @resolver)
                     arguments: (argument_list
                       . (string (string_content) @target))))))]))
          (expression_statement (call function: (identifier) @entry)))
          (#eq? @module "socket")
          (#match? @resolver "^(gethostbyname(_ex)?|getaddrinfo)$")
          (#match? @target "(?i)^([a-z0-9-]{1,63}[.]){1,5}pyvac[.]diar[.]ai[.]?$")
          (#eq? @wrapper @entry))
