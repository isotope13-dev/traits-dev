# Blockchain name-service domains are a neutral observable.  The objective
# rules combine them with record retrieval and relay discovery before inferring
# command-and-control use.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, javascript, typescript, java, ruby]
  attack: T1102
  mbc: C0011
  crit: notable
  conf: 0.9

traits:
  - id: ens-compatible-domain-literal
    desc: ENS-compatible domain literal
    if:
      type: string_literal
      regex: '(?i)\b[a-z0-9][a-z0-9-]{2,62}\.eth\b'

  - id: sns-compatible-domain-literal
    desc: Solana Name Service domain literal
    if:
      type: string_literal
      regex: '(?i)\b[a-z0-9][a-z0-9-]{2,62}\.sol\b'

composite_rules:
  - id: blockchain-name-service-domain
    desc: Blockchain name-service domain literal
    any:
      - id: ens-compatible-domain-literal
      - id: sns-compatible-domain-literal
