# Blockchain name-service domains are a neutral observable.  The objective
# rules combine them with record retrieval and relay discovery before inferring
# command-and-control use.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, javascript, typescript, java, ruby]
  attack: T1102
  mbc: C0011
  crit: notable
  conf: 0.9

traits:
  - id: ens-compatible-domain-literal
    desc: ENS-compatible domain literal
    if:
      type: string_literal
      regex: '(?i)\b[a-z0-9][a-z0-9-]{2,62}\.eth\b'

  - id: sns-domain-suffix-literal
    desc: Lowercase .sol string literal
    crit: component
    if:
      type: string_literal
      regex: '^[a-z0-9][a-z0-9-]{2,62}\.sol$'

  - id: sns-library-reference
    desc: Solana Name Service client library
    if:
      type: string_literal
      regex: '^(@bonfida/spl-name-service|@sns-sdk/)'

  # ENS resolved by calling the chain directly rather than through a `.eth`
  # name. The registry below is Ethereum's public ENS Registry contract, so
  # every ENS lookup goes through it; naming it is how code reaches ENS when it
  # never spells out a domain literal, which is exactly the case the
  # blockchain-name-service-domain atom above cannot see.
  #
  # Neutral facts: ENS is ordinary public infrastructure and wallets, explorers
  # and dapp libraries all call this contract. What matters is who is doing it
  # and what they do with the answer, which the composites supply.
  - id: ens-registry-contract-address
    desc: Ethereum ENS registry contract address
    crit: notable
    conf: 0.95
    for: [binaries, scripts]
    if:
      type: text
      regex: '(?i)0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e'

  # The resolver hop of an ENS lookup: registry.resolver(node) then
  # resolver.text(node, key). A `text` record is free-form key/value storage on
  # chain, which is what makes ENS usable as a configuration channel rather
  # than just a name lookup.
  - id: ens-resolver-text-lookup
    desc: ENS resolver text-record lookup routine
    crit: notable
    conf: 0.94
    for: [binaries, scripts]
    if:
      type: text
      # `[.:]{2}` covers both spellings: `ens::call_text` in source, and
      # `ens..call_text` in a Rust binary, where the mangler writes `::` as `..`.
      regex: 'ens[.:]{2}(call_text|get_resolver|text_record)'


  # Bootstrap peer addresses resolved through the program's own DNS client
  # against its own server list, rather than through the platform resolver.
  # Doing DNS by hand is how a client keeps reaching its seeds when the
  # network's resolver is the thing filtering it.
  - id: builtin-dns-seed-bootstrap
    desc: Own DNS client resolves bootstrap seeds
    crit: notable
    conf: 0.93
    for: [binaries, scripts]
    if:
      type: text
      regex: 'dns[.:]{2}(resolve_seed_addrs|dns_servers)'

composite_rules:
  - id: sns-compatible-domain-literal
    desc: Solana Name Service domain literal
    all:
      - id: sns-domain-suffix-literal
      - id: sns-library-reference
    near_bytes: 8192

  - id: blockchain-name-service-domain
    desc: Blockchain name-service domain literal
    any:
      - id: ens-compatible-domain-literal
      - id: sns-compatible-domain-literal
