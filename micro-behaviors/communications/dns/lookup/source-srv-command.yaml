# nslookup SRV queries issued from compiled-language source through a shell
# string. SRV lookups answer service-location questions, so the query alone is
# a capability; objective rules decide whether the answer gates behavior.
defaults:
  platforms: [unix, windows]
  attack: T1071.004
  mbc: C0011

traits:
  - id: nslookup-srv-command-source
    desc: Source invokes nslookup for SRV records
    crit: notable
    conf: 0.9
    for: [c, cpp, zig, elixir]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bnslookup\s+-(type|query(type)?|q)[= ]SRV\b'
