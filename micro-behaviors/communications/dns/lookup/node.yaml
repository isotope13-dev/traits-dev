# Node.js reverse (PTR) resolution.  `reverse()` is exposed on the `dns` module
# and on every `Resolver` instance, but a bare `.reverse(` call is
# Array.prototype.reverse, so the receiver has to name DNS or a resolver before
# the match means a PTR query.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: C0011
  attack: T1071.004

traits:
  - id: node-resolver-reverse
    desc: Reverse DNS PTR lookup via resolver
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^dns|[Rr]esolver)\.reverse$'
