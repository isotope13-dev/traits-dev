defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: preinstall-queries-dns-with-joined-labels
    desc: Resolves joined data as a DNS name
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: 'dns\.lookup\(chunks\s*\+\s*["''][.][A-Za-z0-9.-]+'

