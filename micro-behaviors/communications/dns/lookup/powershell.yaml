# A resolver name is not evidence of constructing a DNS label or a C2 channel.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-dns-query-reference
    desc: PowerShell DNS resolution API reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(Resolve-DnsName|nslookup|System\.Net\.Dns)\b'
