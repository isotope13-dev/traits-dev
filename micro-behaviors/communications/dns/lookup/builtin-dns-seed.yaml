# The application performs its own DNS lookup to resolve bootstrap peers.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.93

traits:
  # Bootstrap peer addresses resolved through the program's own DNS client
  # against its own server list, rather than through the platform resolver.
  # Doing DNS by hand is how a client keeps reaching its seeds when the
  # network's resolver is the thing filtering it.
  - id: builtin-dns-seed-bootstrap
    desc: Own DNS client resolves bootstrap seeds
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'dns[.:]{2}(resolve_seed_addrs|dns_servers)'
