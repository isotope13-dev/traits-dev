# Cross-language aggregation of source-level DNS TXT lookups.  The individual
# language rules stay in their canonical files; this composite gives objective
# rules one stable capability to consume.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1071.004
  mbc: C0011

composite_rules:
  - id: source-txt-query
    desc: Source code requests DNS TXT records
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/dns/lookup/txt::python-dnspython-query-txt
      - id: micro-behaviors/communications/dns/lookup/txt::python-dnspython-resolve-txt
      - id: micro-behaviors/communications/dns/lookup/txt::node-txt-lookup
      - id: micro-behaviors/communications/dns/lookup/txt::perl-net-dns-txt-query
      - id: micro-behaviors/communications/dns/lookup/txt::php-dns-get-record-txt
      - id: micro-behaviors/communications/dns/lookup/txt::ruby-resolv-txt-query
      - id: micro-behaviors/communications/dns/lookup/txt::powershell-resolve-dns-txt-capture
      - id: micro-behaviors/communications/dns/lookup/txt::powershell-nslookup-txt-capture
