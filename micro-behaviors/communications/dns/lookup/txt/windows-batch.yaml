defaults:
  platforms: [windows]
  for: [batch]
  attack: T1071.004
  mbc: C0011

traits:
  - id: batch-nslookup-txt-for-f-capture
    desc: Captures nslookup TXT response in batch loop
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)for\s+/f\b[^\r\n]{0,180}\bin\s*\([^\r\n]{0,80}\bnslookup\s+-q=txt\b'
