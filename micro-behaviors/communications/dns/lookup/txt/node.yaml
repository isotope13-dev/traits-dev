defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  mbc: C0011
  attack: T1071.004
  crit: notable
  conf: 0.7
traits:
  # Node exposes resolveTxt() both on the `dns` module and on every `Resolver`
  # instance (`new Resolver().resolveTxt(...)`).  Anchoring on the `dns.`
  # receiver missed the instance form entirely, which is the shape modern ESM
  # packages -- and npm DNS-tunnel payloads -- actually ship.
  - id: resolve-txt
    desc: resolveTxt() DNS TXT query call
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '(^|\.)resolveTxt$'
  # Relocated from micro-behaviors/communications/dns/label/: the matcher only
  # detects that source names the TXT-resolution API, which is a lookup
  # reference, not label construction.  Supersedes the former
  # `resolve-txt-string` string_literal variant (a strict subset of this scan).
  - id: resolve-txt-reference
    desc: References the Node.js DNS resolveTxt API
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bresolveTxt\b'
  - id: txt-record-type
    desc: TXT record type constant
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      exact: '''TXT'''
  - id: node-resolve-txt-response-capture
    desc: Node.js captures DNS TXT response
    conf: 0.94
    if:
      type: text
      regex: '\b(const|let|var)\s+\w+\s*=\s*await\s+dns(\.promises)?\.resolveTxt\s*\('
composite_rules:
  - id: node-txt-lookup
    desc: Node.js DNS TXT record resolution
    crit: notable
    conf: 0.75
    any:
      - id: resolve-txt
      - id: node-resolve-txt-response-capture
  - id: node-indexed-txt-query-label
    desc: Indexed DNS TXT query loop
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/analysis::js-zero-based-index-loop
      - id: resolve-txt-reference
    any:
      - id: micro-behaviors/data/string/concat::js-dotted-variable-concat
      - id: micro-behaviors/communications/dns/label::javascript-dynamic-dns-label
    near_bytes: 2048
  - id: node-indexed-txt-chunk-query
    desc: Queries indexed DNS TXT chunks
    crit: notable
    conf: 0.94
    all:
      - id: node-indexed-txt-query-label
      - id: node-txt-lookup
    near_bytes: 2048
