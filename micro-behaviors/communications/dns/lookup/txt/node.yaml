defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  mbc: C0011
  attack: T1071.004
  crit: notable
  conf: 0.7
traits:
  - id: resolve-txt
    desc: dns.resolveTxt() call
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: dns.resolveTxt
  - id: resolve-txt-promise
    desc: dns.promises.resolveTxt() call
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: dns.promises.resolveTxt
  - id: resolve-txt-string
    desc: resolveTxt string reference
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: resolveTxt
  - id: txt-record-type
    desc: TXT record type constant
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      exact: '''TXT'''
  - id: node-resolve-txt-response-capture
    desc: Node.js captures DNS TXT response
    conf: 0.94
    if:
      type: text
      regex: '\b(const|let|var)\s+\w+\s*=\s*await\s+dns(\.promises)?\.resolveTxt\s*\('
  - id: node-dynamic-resolve-txt
    desc: Dynamically required Node DNS TXT lookup
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: require().resolveTxt
composite_rules:
  - id: node-txt-lookup
    desc: Node.js DNS TXT record resolution
    crit: notable
    conf: 0.75
    any:
      - id: resolve-txt
      - id: resolve-txt-promise
      - id: node-dynamic-resolve-txt
  - id: node-indexed-txt-query-label
    desc: Indexed DNS TXT query loop
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/analysis::js-zero-based-index-loop
      - id: micro-behaviors/communications/dns/label::javascript-resolve-txt-reference
    any:
      - id: micro-behaviors/data/string/concat::js-dotted-variable-concat
      - id: micro-behaviors/communications/dns/label::javascript-dynamic-dns-label
    near_bytes: 2048
  - id: node-indexed-txt-chunk-query
    desc: Queries indexed DNS TXT chunks
    crit: notable
    conf: 0.94
    all:
      - id: node-indexed-txt-query-label
      - id: node-txt-lookup
    near_bytes: 2048
