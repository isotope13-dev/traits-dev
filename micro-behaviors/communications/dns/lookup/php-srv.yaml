defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-nslookup-srv-command
    desc: PHP invokes nslookup for DNS SRV records
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: shell_exec
      arg:
        index: 0
        from:
          value: '(?i)^nslookup\s+-type=SRV\b'
