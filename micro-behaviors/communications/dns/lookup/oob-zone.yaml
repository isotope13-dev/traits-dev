defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: oob-zone-resolver-cooccurrence
    for: [shell, python, javascript, rust, ruby, go, php, powershell]
    desc: Resolver query beside OOB DNS zone
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/dns/lookup::source-resolver-query
      - id: micro-behaviors/communications/url/host::oob-dns-capable-endpoint
