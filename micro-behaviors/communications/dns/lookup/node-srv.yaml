defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.95

traits:
  - id: node-nslookup-srv-argument
    desc: Passes SRV option to nslookup
    if:
      type: text
      exclude_comments: true
      regex: '\bexecFile(Sync)?\s*\(["'']nslookup["''],\s*\[["'']-type=SRV["'']'

