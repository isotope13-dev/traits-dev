defaults:
  for: [class]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
traits:
  - id: jvm-nslookup-command-reference
    desc: JVM constant pool names nslookup command
    if:
      type: value
      path: class.strings[*]
      exact: nslookup
  - id: jvm-nslookup-txt-option
    desc: JVM nslookup TXT record option
    if:
      type: value
      path: class.strings[*]
      exact: -type=TXT
  - id: jvm-nslookup-srv-option
    desc: JVM nslookup SRV record option
    if:
      type: value
      path: class.strings[*]
      exact: -type=SRV
  - id: kotlin-nslookup-srv-command
    desc: Kotlin invokes nslookup for SRV records
    for: [kotlin]
    if:
      type: text
      regex: 'run\s*\(\s*"nslookup"\s*,\s*"-type=SRV"'
