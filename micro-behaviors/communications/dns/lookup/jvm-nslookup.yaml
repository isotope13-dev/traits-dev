defaults:
  for: [class]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
traits:
  - id: jvm-nslookup-command-reference
    desc: JVM constant pool names nslookup command
    if:
      type: value
      path: class.strings[*]
      exact: nslookup
  - id: jvm-nslookup-txt-option
    desc: JVM nslookup TXT record option
    if:
      type: value
      path: class.strings[*]
      exact: -type=TXT
  - id: jvm-nslookup-srv-option
    desc: JVM nslookup SRV record option
    if:
      type: value
      path: class.strings[*]
      exact: -type=SRV
