# Source-level observation for a program that uses IPv4 DNS answers as data.
# The lookup is neutral; the objective layer decides when inspecting an answer
# byte is being used as a C2 channel selector or bootstrap transport.
defaults:
  platforms: [windows, unix]
  for: [csharp, python]
  attack: T1071.004
  mbc: C0011

traits:
  - id: dotnet-dns-address-lookup
    desc: .NET resolves host addresses
    crit: notable
    conf: 0.92
    for: [csharp]
    if:
      type: symbol
      kind: call
      exact: Dns.GetHostAddressesAsync

  - id: dotnet-dns-address-byte-index
    desc: .NET reads final resolved address byte
    crit: notable
    conf: 0.94
    for: [csharp]
    if:
      type: text
      regex: 'GetAddressBytes\s*\(\s*\)\s*\[\s*3\s*\]'

  - id: python-resolver-a-record
    desc: Python resolver requests an A record
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: call
      exact: resolver.resolve
      arg:
        kind: string
        exact: A

  - id: python-dns-address-last-octet
    desc: Python reads final IPv4 address byte
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'ipaddress\.ip_address\([^)]{0,64}\)\.packed\s*\[\s*-1\s*\]'

composite_rules:
  - id: dotnet-dns-a-response-octet
    desc: .NET inspects an IPv4 byte from DNS resolution
    crit: notable
    conf: 0.95
    for: [csharp]
    all:
      - id: dotnet-dns-address-lookup
      - id: dotnet-dns-address-byte-index

  - id: python-dns-a-response-octet
    desc: Python inspects an IPv4 byte from an A-record response
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-resolver-a-record
      - id: python-dns-address-last-octet

  - id: source-dns-a-response-octet
    desc: Source inspects an IPv4 byte from a DNS response
    crit: notable
    conf: 0.95
    any:
      - id: dotnet-dns-a-response-octet
      - id: python-dns-a-response-octet
