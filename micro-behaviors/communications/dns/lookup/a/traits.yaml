# IPv4 A record lookup capability. The DNS tunnel objective combines this
# neutral protocol operation with output encoding to turn a resolution into an
# egress channel; the lookup itself is ordinary name resolution.
defaults:
  crit: notable
  conf: 0.93
  platforms: [windows, unix]
  for: [python]
  attack: T1071.004
  mbc: C0011

traits:
  - id: python-dnspython-resolve-a
    desc: Python resolves DNS A record
    if:
      type: text
      regex: '(?i)\bdns\.resolver\.resolve\s*\(.{0,80}["'']A["'']'

  - id: python-dnspython-query-a
    desc: Python requests DNS A record
    if:
      type: text
      regex: '(?i)\bdns\.resolver\.query\s*\(.{0,80}["'']A["'']'
