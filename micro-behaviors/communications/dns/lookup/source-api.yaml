defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript, go]
traits:
- id: common-source-dns-query-api
  desc: Source references a common DNS query API
  crit: notable
  conf: 0.88
  for: [scripts, source, -c, -cpp]
  if:
    type: text
    regex: '(?i)\b(resolve-dns|inetaddress|getaddrinfo)\b'
- id: dns-lookup-resolve-api-reference
  desc: Source references a dns query API member
  crit: notable
  conf: 0.88
  for: [scripts, source, -c, -cpp]
  if:
    type: text
    # Arbitrary dns members can be cloud resources, not DNS query APIs;
    # require call, member, or argument syntax so prose mentions do not match.
    regex: '\bdns\.(lookup|resolve|reverse|query)\w*\s*[.(,)]'
- id: dotnet-dns-query-call
  desc: .NET calls a DNS resolution API
  crit: notable
  conf: 0.95
  for: [csharp]
  if:
    type: symbol
    kind: call
    regex: '(?i)(^|\.)dns\.(gethost(entry|addresses)|resolve)(async)?$'
- id: portable-source-dns-query-api
  desc: Source calls a portable DNS query API
  crit: notable
  conf: 0.9
  for: [python, perl, php, ruby]
  if:
    type: symbol
    kind: call
    regex: '(?i)(^|[.:])(gethostbyname|to_socket_addrs)$'
- id: c-source-dns-query-call
  desc: C source calls a DNS query API
  crit: notable
  conf: 0.9
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    regex: '(?i)^(getaddrinfo|gethostbyname|gethostbyaddr)$'
- id: rust-to-socket-addrs-call
  desc: Rust invokes socket address resolution
  crit: notable
  conf: 0.9
  for: [rust]
  if:
    type: tree-sitter
    kind: call
    regex: '\.to_socket_addrs\s*\('
composite_rules:
- id: source-dns-query-api
  desc: Source references DNS resolution interfaces
  crit: notable
  conf: 0.9
  for: [scripts, source]
  any:
    - id: micro-behaviors/communications/dns/lookup::common-source-dns-query-api
    - id: micro-behaviors/communications/dns/lookup::dns-lookup-resolve-api-reference
    - id: micro-behaviors/communications/dns/lookup::dotnet-dns-query-call
    - id: micro-behaviors/communications/dns/lookup::portable-source-dns-query-api
    - id: micro-behaviors/communications/dns/lookup::rust-to-socket-addrs-call

  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
    - id: metadata/file/format/structured::generated-news-summary-index
