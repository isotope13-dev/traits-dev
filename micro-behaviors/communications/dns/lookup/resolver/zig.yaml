# Zig's standard-library resolver call. Keep this as a neutral DNS capability;
# exfiltration rules supply the sensitive-data and label-construction evidence.
defaults:
  platforms: [windows, unix]
  for: [zig]
  crit: notable
  conf: 0.96

traits:
  - id: zig-get-address-list
    desc: Zig resolves a host address list
    if:
      type: symbol
      kind: call
      exact: std.net.getAddressList

