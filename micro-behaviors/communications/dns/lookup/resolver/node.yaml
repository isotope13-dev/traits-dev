# DNS Lookup Operations (Node.js)
# MBC: C0011 (DNS Communication)
# ATT&CK: T1071.004
#
# Type-specific lookups are in subdirectories:
#   txt/     - TXT record lookups
#   reverse/ - Reverse DNS lookups
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: "C0011"
  attack: "T1071.004"
  crit: notable
  conf: 0.7
traits:
  - id: dns-lookup-call
    desc: dns.lookup() call
    conf: 0.65
    unless:
      - type: basename
        regex: (^|[\\/])builtin-plugins[\\/]tabby-ssh[\\/]node_modules[\\/]
    if:
      type: text
      regex: "dns\\.lookup\\("
  - id: dns-lookup-in-loop
    desc: DNS lookup call inside a loop
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: 'for\s*\([^)]{1,40}\)\s*\{[\s\S]{0,40}dns\.lookup\s*\('
  # Keep the module name in the pattern.  The symbol projection collapses every
  # `require(<anything>).lookup(...)` to the call target `require().lookup`, so
  # matching that instead reports ordinary MIME/path helpers
  # (`require('mime').lookup(file)`, `require('../utils').lookup(p)`) as DNS.
  - id: require-dns-inline-lookup
    desc: Inline require('dns').lookup() call
    conf: 0.72
    if:
      type: text
      regex: "require\\(['\"](node:)?dns['\"]\\)\\.lookup\\s*\\("
  - id: dns-resolve-call
    desc: dns.resolve() call
    conf: 0.7
    if:
      type: text
      regex: "dns\\.resolve\\("
  # Node exposes every record query both on the `dns` module and on each
  # `Resolver` instance (`const r = new Resolver(); r.resolve4(...)`).  Matching
  # the call target instead of a literal `dns.` receiver covers both forms; the
  # instance form is what ESM packages and npm DNS-tunnel payloads ship.
  - id: dns-resolve4
    desc: resolve4() DNS A record query call
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)resolve4$'
  - id: dns-resolve6
    desc: resolve6() DNS AAAA record query call
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)resolve6$'
  - id: dns-resolve-mx-ns-soa-srv
    desc: resolveMx/Ns/Soa/Srv() record query call
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)resolve(Mx|Ns|Soa|Srv)$'
  - id: dns-resolve-cname-record
    desc: resolveCname() DNS alias query call
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)resolveCname$'
  # `import { Resolver } from "node:dns/promises"` — an independent resolver
  # object whose server list can be repointed away from the host resolver.
  - id: node-resolver-class-import
    desc: Imports the Node.js DNS Resolver class
    conf: 0.9
    if:
      type: text
      regex: 'Resolver[^;\n]{0,40}from\s*["''](node:)?dns["''/]'
  - id: dns-promises-lookup
    desc: dns.promises.lookup() call
    conf: 0.7
    if:
      type: text
      regex: "dns\\.promises\\.lookup\\("
  - id: ipv4-family-selection
    desc: Node DNS lookup requests IPv4 address results
    conf: 0.75
    if:
      type: text
      regex: 'dns\.(lookup|resolve4|resolve6|promises\.lookup)\([\s\S]{0,160}family\s*:\s*4'
  - id: ipv4-address-flags
    desc: Node DNS requests IPv4 address flags
    conf: 0.75
    if:
      type: text
      regex: "dns\\.ADDRCONFIG\\s*\\|\\s*dns\\.V4MAPPED"
  - id: require-dns
    desc: require('dns') import
    crit: notable
    conf: 0.5
    unless:
      - type: basename
        regex: (^|[\\/])builtin-plugins[\\/]tabby-ssh[\\/]node_modules[\\/]
    if:
      type: text
      regex: "require\\(['\"]dns['\"]\\)"
composite_rules:
  - id: ipv4-address-selection
    desc: Node DNS lookup selects IPv4-compatible results
    crit: notable
    conf: 0.75
    any:
      - id: ipv4-family-selection
      - id: ipv4-address-flags
  - id: node-dns-lookup
    desc: Node.js DNS lookup operations
    crit: notable
    conf: 0.7
    any:
      - id: dns-lookup-call
      - id: dns-resolve-call
      - id: dns-resolve4
      - id: dns-resolve6
      - id: dns-promises-lookup
      - id: ipv4-family-selection
      - id: ipv4-address-flags
      - id: require-dns-inline-lookup
      - id: dns-resolve-mx-ns-soa-srv
      - id: dns-resolve-cname-record
