defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.97

traits:
  - id: go-nslookup-srv-command
    desc: Go constructs nslookup SRV query
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - {index: 0, kind: string, exact: nslookup}
        - {kind: string, exact: '-type=SRV'}
