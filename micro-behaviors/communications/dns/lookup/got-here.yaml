defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: got-here-dns-beacon
  desc: DNS lookup uses gotHere prefix
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: lookup\('gotHere'\s*\+\s*[A-Za-z_][A-Za-z0-9_]*
composite_rules:
- id: dns-install-beacon
  desc: DNS lookup with gotHere prefix
  crit: notable
  conf: 0.95
  attack: T1048.003
  all:
  - id: metadata/import/builtin::require-dns
  - id: micro-behaviors/communications/dns/resolver::dns-lookup-call
  - id: got-here-dns-beacon

