defaults:
  platforms: [unix]
  for: [binaries, c]
  mbc: C0011
  # Reverse-DNS namespace references do not establish DNS command traffic.
  crit: notable
  conf: 0.56
traits:
  - id: in-addr-arpa
    desc: IPv4 reverse-DNS namespace reference
    if:
      type: text
      substr: .in-addr.arpa
  - id: ip6-arpa
    desc: IPv6 reverse-DNS namespace reference
    if:
      type: text
      substr: ip6.arpa
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
