# IPv6 AAAA record lookup capability. The DNS tunnel objective combines this
# neutral protocol operation with structured length/data label construction.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]
  attack: T1071.004
  mbc: C0011

traits:
  - id: aaaa-record-selector
    desc: DNS AAAA record selector
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .AAAA

composite_rules:
  - id: aaaa-record-lookup
    desc: DNS IPv6 AAAA lookup capability
    crit: notable
    conf: 0.92
    any:
      - id: aaaa-record-selector
      - id: micro-behaviors/communications/dns/lookup/resolver::dns-resolve6
