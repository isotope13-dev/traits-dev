# IPv6 AAAA record lookup capability. The DNS tunnel objective combines this
# neutral protocol operation with structured length/data label construction.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]
  attack: T1071.004
  mbc: C0011

traits:
  # The selector is a record-type enum member (`DnsRecordType.AAAA`,
  # `rdatatype.AAAA`, `dns.AAAA`), so the qualifier is required. A bare `.AAAA`
  # substring also matches nucleotide alignments, where `.` is the gap
  # character and poly-A runs are everywhere.
  - id: aaaa-record-selector
    desc: DNS AAAA record selector
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b([a-z]*type|dns)\.AAAA\b'

composite_rules:
  - id: aaaa-record-lookup
    desc: DNS IPv6 AAAA lookup capability
    crit: notable
    conf: 0.92
    any:
      - id: aaaa-record-selector
      - id: micro-behaviors/communications/dns/lookup/resolver::dns-resolve6
