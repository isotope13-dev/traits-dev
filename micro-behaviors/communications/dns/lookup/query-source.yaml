# Normalize source and bytecode resolver calls without asserting C2 intent.
# The concrete atoms remain language-specific and use cached symbols/text;
# objective rules can consume this capability without repeating the list.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, class, java_class]
  crit: notable
  conf: 0.92

composite_rules:
  - id: source-resolver-query
    desc: Source or bytecode references DNS resolution
    any:
      - id: micro-behaviors/communications/dns/resolver/
      - id: micro-behaviors/communications/dns/lookup::source-dns-query-api
      - id: micro-behaviors/communications/dns/lookup::c-source-dns-query-call
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: metadata/file/format/structured::generated-news-summary-index
