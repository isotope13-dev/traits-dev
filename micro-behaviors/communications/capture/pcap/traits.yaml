# Canonical home for the libpcap API. Every named libpcap entry point is
# defined here once; other tiers reference these rather than restating the
# strings (micro-behaviors/os/bpf/network-infra keeps only the generic
# "some pcap_ symbol" fact for its BPF-infrastructure composite).
#
# Man pages document these functions by name — pcap_loop(3pcap) is mostly the
# words "pcap_loop" and "pcap_dispatch" — and roff has no file type of its own,
# so a man page is guessed as C, JavaScript or Python and its prose is scanned
# as source. Each atom therefore excludes documentation context.
#
# Two further ways a file can name these functions without calling them, both
# found on pristine libpcap 1.10.5 headers pulled out of a feed:
#
#  1. As part of a longer identifier. `substr: pcap_compile` matched the include
#     guard `lib_pcap_compiler_tests_h` and labelled pcap/compiler-tests.h — a
#     header of nothing but __GNUC__/__clang__/_MSC_VER version macros — as
#     compiling a BPF filter; `substr: pcap_next` matched pcap_next_etherent(),
#     an /etc/ethers name-record reader that never touches the wire, and
#     labelled pcap/namedb.h as a packet read. Each atom is therefore anchored
#     on a non-identifier character (or a run boundary, which is where a bare
#     symbol string in a stripped binary lands) on both sides, and any suffix
#     that is genuinely the same operation — pcap_compile_nopcap, pcap_next_ex —
#     is enumerated rather than left open.
#
#  2. In prose, written man-page style with empty parentheses. pcap/bpf.h says
#     `Structure for "pcap_compile()", "pcap_setfilter()", etc..` in a comment,
#     which was enough for two atoms to fire and for the `listener` composite
#     (needs: 2) to call a struct-definition header a packet listener. Every
#     function named in this file takes at least one argument, so `name()` with
#     an empty argument list is always a reference and never a call. Each regex
#     captures one character past the closing anchor so `not:` has the `()` to
#     test — `not:` filters the matched string, so without that character it
#     would have nothing to look at. A real call keeps its detection even in a
#     file that also mentions the function in a comment, which a file-scoped
#     `unless:` would have thrown away.
defaults:
  platforms:
    - unix
    - android
  for: [scripts, binaries, c, cpp]
  crit: notable
  conf: 0.75
traits:
  - id: open-live
    desc: libpcap live capture open
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_open_live([^A-Za-z0-9_].?|$)'
    not:
      - regex: 'pcap_open_live\(\)'
  - id: compile-filter
    desc: libpcap BPF compile
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_compile(_nopcap)?([^A-Za-z0-9_].?|$)'
    not:
      - regex: 'pcap_compile(_nopcap)?\(\)'
  - id: set-filter
    desc: libpcap BPF setfilter
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_setfilter([^A-Za-z0-9_].?|$)'
    not:
      - regex: 'pcap_setfilter\(\)'
  - id: next-packet
    desc: libpcap single-packet read
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_next(_ex)?([^A-Za-z0-9_].?|$)'
    not:
      - regex: 'pcap_next(_ex)?\(\)'
  # pcap_loop / pcap_dispatch are the callback-driven packet pumps. A sniffer
  # built on them never calls pcap_next at all, so covering only pcap_next left
  # the most common capture loop with no atom of its own.
  - id: packet-callback-loop
    desc: libpcap packet callback loop
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_(loop|dispatch)([^A-Za-z0-9_].?|$)'
    not:
      - regex: 'pcap_(loop|dispatch)\(\)'
  - id: set-nonblock
    desc: libpcap nonblocking capture
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_setnonblock([^A-Za-z0-9_].?|$)'
    not:
      - regex: 'pcap_setnonblock\(\)'
  - id: selectable-fd
    desc: libpcap selectable file descriptor
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_get_selectable_fd([^A-Za-z0-9_].?|$)'
    not:
      - regex: 'pcap_get_selectable_fd\(\)'
  # The empty-parens guard above is right about man pages and header comments,
  # but it also throws away the one place a stripped, statically linked binary
  # names these functions: its own diagnostics. mettle's sniffer.bin carries
  # "Error from pcap_open_live(): %s", "Error from pcap_setfilter(): %s" and
  # nothing else -- every call site is inlined and the symbol table is gone --
  # so `open-live` and `set-filter` were both rejected and `listener` (needs 2)
  # never fired on an actual packet sniffer. A printf conversion straight after
  # `pcap_x()` is a program formatting its own error, never prose about the API.
  - id: capture-error-diagnostic
    desc: libpcap error message with format specifier
    conf: 0.9
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
    if:
      type: text
      regex: 'pcap_[a-z_]{3,20}\(\):?\s*%[sd]'

composite_rules:
  - id: listener
    desc: libpcap packet listener
    needs: 2
    any:
      - id: open-live
      - id: compile-filter
      - id: set-filter
      - id: next-packet
      - id: packet-callback-loop
      - id: set-nonblock
      - id: selectable-fd
      - id: capture-error-diagnostic
  - id: stealth-listener
    desc: stealth libpcap packet listener
    crit: suspicious
    conf: 0.92
    all:
      - id: listener
      - id: micro-behaviors/os/network/interface::non-promiscuous-mode-phrase
