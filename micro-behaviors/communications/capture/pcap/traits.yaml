# Canonical home for the libpcap API. Every named libpcap entry point is
# defined here once; other tiers reference these rather than restating the
# strings (micro-behaviors/os/bpf/network-infra keeps only the generic
# "some pcap_ symbol" fact for its BPF-infrastructure composite).
#
# Man pages document these functions by name — pcap_loop(3pcap) is mostly the
# words "pcap_loop" and "pcap_dispatch" — and roff has no file type of its own,
# so a man page is guessed as C, JavaScript or Python and its prose is scanned
# as source. Each atom therefore excludes documentation context.
defaults:
  platforms:
    - unix
    - android
  for: [scripts, binaries, c, cpp]
  crit: notable
  conf: 0.75
traits:
  - id: open-live
    desc: libpcap live capture open
    unless:
      - id: metadata/package/documentation::unix-manpage
    if:
      type: text
      substr: pcap_open_live
  # Anchored on both sides rather than `substr: pcap_compile`, which matched
  # libpcap's own include guard `lib_pcap_compiler_tests_h` and labelled
  # pcap/compiler-tests.h — a header of nothing but __GNUC__/__clang__/_MSC_VER
  # version macros — as compiling a BPF filter. Every libpcap public header
  # guards itself as `lib_pcap_<name>_h`, so an unanchored pcap_ substring is
  # one rename away from claiming a capability the file does not have. The
  # leading class rejects the guard (`_` before the name); `_nopcap` is kept
  # because pcap_compile_nopcap() really does compile a filter.
  - id: compile-filter
    desc: libpcap BPF compile
    unless:
      - id: metadata/package/documentation::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_compile(_nopcap)?([^A-Za-z0-9_]|$)'
  - id: set-filter
    desc: libpcap BPF setfilter
    unless:
      - id: metadata/package/documentation::unix-manpage
    if:
      type: text
      substr: pcap_setfilter
  # `substr: pcap_next` also caught pcap_next_etherent(), which reads name
  # records out of /etc/ethers and never touches the wire — it labelled
  # pcap/namedb.h, a header of name-to-address declarations, as a packet read.
  # pcap_next() and pcap_next_ex() are the two calls that actually return a
  # captured packet, so the suffix is enumerated instead of left open.
  - id: next-packet
    desc: libpcap single-packet read
    unless:
      - id: metadata/package/documentation::unix-manpage
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])pcap_next(_ex)?([^A-Za-z0-9_]|$)'
  # pcap_loop / pcap_dispatch are the callback-driven packet pumps. A sniffer
  # built on them never calls pcap_next at all, so covering only pcap_next left
  # the most common capture loop with no atom of its own.
  - id: packet-callback-loop
    desc: libpcap packet callback loop
    unless:
      - id: metadata/package/documentation::unix-manpage
    if:
      type: text
      regex: 'pcap_(loop|dispatch)\b'
  - id: set-nonblock
    desc: libpcap nonblocking capture
    unless:
      - id: metadata/package/documentation::unix-manpage
    if:
      type: text
      substr: pcap_setnonblock
  - id: selectable-fd
    desc: libpcap selectable file descriptor
    unless:
      - id: metadata/package/documentation::unix-manpage
    if:
      type: text
      substr: pcap_get_selectable_fd
  - id: non-promiscuous
    desc: non-promiscuous sniffing comment
    crit: suspicious
    conf: 0.9
    unless:
      - id: metadata/package/documentation::unix-manpage
      - id: well-known/app/aui-agent-builder/
    if:
      type: text
      substr: not in promiscuous mode
composite_rules:
  - id: listener
    desc: libpcap packet listener
    needs: 2
    any:
      - id: open-live
      - id: compile-filter
      - id: set-filter
      - id: next-packet
      - id: packet-callback-loop
      - id: set-nonblock
      - id: selectable-fd
  - id: stealth-listener
    desc: stealth libpcap packet listener
    crit: suspicious
    conf: 0.92
    all:
      - id: listener
      - id: non-promiscuous
