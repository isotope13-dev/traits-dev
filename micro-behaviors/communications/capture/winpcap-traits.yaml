# WinPcap packet API (packet.dll / Packet32). The Windows counterpart of the
# libpcap entry points in pcap-traits.yaml and the WinDivert API in
# windivert-traits.yaml.
#
# Each entry point is a fragment: a name alone can be an import, a header
# declaration, or a call. The composite needs two distinct entry points before
# it reports a capture or injection capability. Comments are masked so a prose
# mention in a header or a manual cannot supply a leg.
#
# WinPcap static libraries (packet.lib) carry these names as plain ASCII in
# their symbol tables, so the text matcher sees them without a PE or DLL
# container. Coverage is scoped to Windows binaries and C/C++ source.
defaults:
  platforms: [windows]
  for: [pe, dll, static-lib, c, cpp]
  crit: component
  conf: 0.9

traits:
  - id: winpcap-open-adapter
    desc: WinPcap PacketOpenAdapter API name
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])_?PacketOpenAdapter(NPF)?(@[0-9]+)?([^A-Za-z0-9_]|$)'
      exclude_comments: true
  - id: winpcap-receive-packet
    desc: WinPcap PacketReceivePacket API name
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])_?PacketReceivePacket(@[0-9]+)?([^A-Za-z0-9_]|$)'
      exclude_comments: true
  - id: winpcap-send-packet
    desc: WinPcap PacketSendPacket API name
    if:
      type: text
      regex: '(^|[^A-Za-z0-9])_?PacketSendPackets?(@[0-9]+)?([^A-Za-z0-9_]|$)'
      exclude_comments: true

composite_rules:
  - id: winpcap-capture-api
    desc: WinPcap packet capture or injection API entry points
    crit: notable
    conf: 0.9
    attack: T1040
    needs: 2
    any:
      - id: winpcap-open-adapter
      - id: winpcap-receive-packet
      - id: winpcap-send-packet
