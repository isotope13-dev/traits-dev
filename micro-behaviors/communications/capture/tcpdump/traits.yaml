defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: tcpdump
    desc: References the tcpdump packet-capture tool
    for: [scripts, binaries, -php]
    count_min: 2
    if:
      # Leading context is captured deliberately: `not:` filters the matched
      # evidence string, so a bare `word: tcpdump` gives it nothing to test
      # and the pcap-MIME exclusion below never fires. Every JS bundle that
      # embeds a MIME table (file-type, mime-db, mime-types) carries
      # `application/vnd.tcpdump.pcap` twice and tripped count_min: 2.
      type: text
      regex: '.{0,24}\btcpdump\b'
    not:
      - regex: 'vnd\.tcpdump'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  # A capture that is written out rather than read on screen, plus the BPF
  # port terms that say which protocol the capture is aimed at. Kept separate
  # from the bare tool reference above: one occurrence of an invocation that
  # persists packets is meaningful on its own.
  - id: tcpdump-write-capture-file
    desc: tcpdump writes a capture file
    for: [scripts, binaries, -php]
    if:
      type: text
      regex: 'tcpdump\s[^\n;|]{0,72}-w\s'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
  - id: bpf-filter-ldap-port
    desc: Capture filter targets LDAP port 389
    for: [scripts, binaries, -php]
    if:
      type: text
      regex: '\b(tcp|udp)\s+port\s+389\b'
  - id: bpf-filter-kerberos-port
    desc: Capture filter targets Kerberos port 88
    for: [scripts, binaries, -php]
    if:
      type: text
      regex: '\b(tcp|udp)\s+port\s+88\b'
  - id: tcpdump-capture-size-rotation
    desc: tcpdump capture size rotation option
    for: [scripts, binaries, -php]
    if:
      type: text
      regex: '\btcpdump\b[^\n;|]{0,120}-C\s+[0-9]{1,6}\b'
  - id: tcpdump-capture-file-count-rotation
    desc: tcpdump bounded capture file count option
    for: [scripts, binaries, -php]
    if:
      type: text
      regex: '\btcpdump\b[^\n;|]{0,120}-W\s+[0-9]{1,4}\b'

composite_rules:
  - id: tcpdump-ring-file-rotation
    desc: tcpdump rotates bounded capture files
    crit: notable
    conf: 0.92
    all:
      - id: tcpdump-capture-size-rotation
      - id: tcpdump-capture-file-count-rotation
