defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: tcpdump
    desc: References the tcpdump packet-capture tool
    for: [scripts, binaries, -php]
    count_min: 2
    if:
      # Leading context is captured deliberately: `not:` filters the matched
      # evidence string, so a bare `word: tcpdump` gives it nothing to test
      # and the pcap-MIME exclusion below never fires. Every JS bundle that
      # embeds a MIME table (file-type, mime-db, mime-types) carries
      # `application/vnd.tcpdump.pcap` twice and tripped count_min: 2.
      type: text
      regex: '.{0,24}\btcpdump\b'
    not:
      - regex: 'vnd\.tcpdump'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
