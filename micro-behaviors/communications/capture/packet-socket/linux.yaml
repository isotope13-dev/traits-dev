defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: eth-p-all-identifier
    desc: All-protocol Ethernet packet-socket selector
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: identifier
      exact: ETH_P_ALL

composite_rules:
  - id: raw-all-protocol-capture-loop
    desc: Raw packet socket receives all Ethernet frames
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/bpf/program/network::af-packet-source
      - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
      - id: eth-p-all-identifier
      - id: micro-behaviors/communications/socket/receive::recvfrom-symbol
