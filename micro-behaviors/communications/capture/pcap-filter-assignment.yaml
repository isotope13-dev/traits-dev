defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - text
  crit: notable
traits:
- id: negating-pcap-selector-literal
  desc: Negated capture address or port selector
  conf: 0.93
  if:
    type: text
    regex: '"\s*not\s+(port|host|src|dst)\b[^"\n]{0,40}"'
- id: negating-pcap-protocol-literal
  desc: Negated packet-capture protocol selector
  conf: 0.93
  if:
    type: text
    regex: '"\s*not\s+(tcp|udp|ip)\b[^"\n]{0,40}"'
composite_rules:
- id: negating-filter-expression-literal
  desc: Negating packet-capture filter literal
  conf: 0.93
  any:
  - id: micro-behaviors/communications/capture::negating-pcap-selector-literal
  - id: micro-behaviors/communications/capture::negating-pcap-protocol-literal
- id: assigned-negating-capture-filter
  for:
  - c
  desc: Negating capture filter near local assignment
  conf: 0.95
  near_lines: 12
  all:
  - id: micro-behaviors/communications/capture::negating-filter-expression-literal
  - id: metadata/lang/source/syntax/assignment::buffer-filter-variable-assignment
