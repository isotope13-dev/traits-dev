defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, c, cpp]
  crit: notable
  conf: 0.95

traits:
  - id: pcap-open-offline
    desc: References libpcap offline capture-file reader
    if:
      type: text
      regex: '\b_?pcap_open_offline(_with_tstamp_precision)?\b'
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage

composite_rules:
  - id: pcap-packet-input
    desc: Live packet capture or offline PCAP input
    any:
      - id: pcap-open-offline
      - id: micro-behaviors/communications/capture::listener
