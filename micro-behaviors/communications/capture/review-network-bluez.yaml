# Bluetooth operation review; matcher and effective scope preserved.
---
defaults:
  for:
  - scripts
  - binaries
  platforms:
  - linux
traits:
- id: btmon-btsnoop-capture-command
  desc: Captures Bluetooth HCI to BTSnoop
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: "\\bbtmon -i [A-Za-z0-9_-]+ -w .{1,80}\\.btsnoop\\b"
