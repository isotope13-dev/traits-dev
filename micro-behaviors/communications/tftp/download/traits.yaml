defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1105
traits:
  - id: tftp
    desc: BusyBox tftp applet invocation
    conf: 0.9
    for: [shell]
    platforms: [linux]
    if:
      type: text
      regex: '\bbusybox\s+tftp\b'
  - id: command
    desc: TFTP command invocation
    conf: 0.5
    if:
      type: text
      # BusyBox accepts compact option clusters such as `-gr`; malware aimed
      # at appliances commonly uses that spelling instead of separate flags.
      regex: '\btftp\s+-[A-Za-z]*[glr][A-Za-z]*\b'
    unless:
      - type: text
        substr: tftp error msg
      - type: text
        substr: tftp rrq file
  - id: client-local-file
    desc: TFTP client local file option
    conf: 0.78
    if:
      type: text
      # The local-path flag can follow get/remote-name options rather than
      # appearing immediately after the executable.
      regex: '\btftp\b[^\r\n]{0,120}\s-l\s+["$/{]'
  - id: scripted-put
    desc: Scripted TFTP put command
    conf: 0.86
    if:
      type: text
      regex: 'printf\s+"[^"]{0,40}put %s'
composite_rules:
  - id: scripted-upload
    desc: Scripted TFTP file upload
    conf: 0.9
    all:
      - id: client-local-file
      - id: scripted-put
    near_lines: 8
