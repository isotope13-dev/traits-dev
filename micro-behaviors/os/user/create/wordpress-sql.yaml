# Direct SQL creation of a WordPress administrator account acrossusers and
# usermeta tables. Custom table prefixes (beyond wp_) remain covered by matching
# the fixed WordPress column and capability names.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  attack: T1136.001

traits:
  - id: sql-wordpress-users-insert
    desc: SQL INSERT into WordPress users table
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?is)INSERT\s+INTO\s+\S*users\b[^;]{0,160}\buser_login\b[^;]{0,160}\buser_pass\b'

  - id: sql-wordpress-usermeta-write
    desc: SQL writes WordPress usermeta table
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)(INSERT\s+INTO|UPDATE)\s+\S*usermeta\b'

  - id: wordpress-admin-capability-value
    desc: WordPress administrator capabilities value
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?is)capabilities[^;]{0,160}administrator'

composite_rules:
  - id: sql-wordpress-admin-cap-insert
    desc: SQL writes WordPress admin usermeta capability
    crit: component
    conf: 0.96
    all:
      - id: sql-wordpress-usermeta-write
      - id: wordpress-admin-capability-value
    near_bytes: 320
  - id: sql-wordpress-admin-create
    desc: Direct SQL inserts WordPress administrator user and capabilities
    crit: notable
    conf: 0.98
    all:
      - id: sql-wordpress-users-insert
      - id: sql-wordpress-admin-cap-insert
    near_bytes: 1024
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case
