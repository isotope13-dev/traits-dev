defaults:
  platforms:
  - windows
  for:
  - pe
  - powershell
  - batch
  - vbs
  crit: notable
traits:
- id: new-local-user
  desc: Uses New-LocalUser PowerShell cmdlet
  conf: 0.9
  attack: T1136.001
  if:
    type: text
    regex: (?i)New-LocalUser
- id: windows-local-test-user
  desc: Local test user declaration
  conf: 0.9
  for:
  - pe
  - powershell
  - batch
  - vbs
  - github-actions
  - yaml
  if:
    type: text
    regex: (?i)New-LocalUser[^\n]{0,200}-Description\s+"[^"\n]{0,80}testing
- id: net-user-create-text
  desc: Net user account creation command text
  conf: 0.9
  attack: T1136.001
  for:
  - scripts
  - binaries
  - source
  - text
  - '!powershell'
  if:
    type: text
    regex: (?i)(^|[\r\n&|({;"'])\s*(/c\s+)?net1?(\.exe)?\s+user\s+\S+(\s+\S+){0,3}\s+/add\b
- id: net-user-add-api
  desc: NetUserAdd account-creation API reference
  conf: 0.95
  attack: T1136.001
  for:
  - c
  - cpp
  - csharp
  - rust
  - pe
  - dll
  if:
    type: symbol
    exact: NetUserAdd
composite_rules:
- id: native-privileged-account-provisioning
  desc: Native Windows APIs can create a user and add it to an admin group
  conf: 0.95
  attack: T1136.001,T1098
  for:
  - pe
  - c
  - csharp
  all:
  - id: net-user-add-api
  - id: micro-behaviors/os/group/membership::windows-group-membership-api
  - id: micro-behaviors/os/group/membership::privileged-local-group-name
- id: net-user-create
  desc: Net user account creation command
  conf: 0.9
  for:
  - scripts
  - binaries
  - source
  any:
  - id: net-user-create-text
  - id: powershell-net-user-create-literal
  - id: powershell-net-user-create-call
- id: net-administrator-account-provisioning
  desc: Net user creation and administrator group addition
  conf: 0.97
  all:
  - id: micro-behaviors/os/user/create::net-user-create
  - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add
