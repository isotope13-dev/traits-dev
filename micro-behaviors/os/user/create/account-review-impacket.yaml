defaults:
  platforms:
  - windows
  for:
  - pe
  - powershell
  - batch
  - vbs
  crit: notable
  attack: T1136.002
traits:
- id: impacket-addcomputer-invocation
  desc: Invokes Impacket addcomputer
  conf: 0.96
  platforms:
  - unix
  - windows
  for:
  - scripts
  if:
    type: text
    regex: (?im)^\s*(impacket-)?addcomputer(\.py)?\s+
- id: impacket-addcomputer-name-password-options
  desc: Impacket machine name and password options
  conf: 0.98
  platforms:
  - unix
  - windows
  for:
  - scripts
  if:
    type: text
    regex: (?i)-computer-name\s+.{1,80}\s+-computer-pass\s+
composite_rules:
- id: impacket-domain-machine-account-create
  desc: Creates AD machine account via Impacket
  conf: 0.98
  platforms:
  - unix
  - windows
  for:
  - scripts
  all:
  - id: impacket-addcomputer-invocation
  - id: impacket-addcomputer-name-password-options
  near_bytes: 512
