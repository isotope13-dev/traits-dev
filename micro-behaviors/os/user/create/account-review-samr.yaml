# SAMR's SamrCreateUser2InDomain/SamrCreateUserInDomain routines create a
# domain principal, the RPC path Impacket-based tooling uses to add machine
# accounts (USER_WORKSTATION_TRUST_ACCOUNT) during relay and RBCD setups.
# Domain-joined management agents also create accounts, so the call
# reference stays notable like its CLI sibling impacket-addcomputer-invocation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: samr-domain-account-create-call
    desc: SAMR domain account creation routine call
    attack: T1136.002
    if:
      type: text
      regex: '(?i)\bhSamrCreateUser(2)?InDomain\b'
