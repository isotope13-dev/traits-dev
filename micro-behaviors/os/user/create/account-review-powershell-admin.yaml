defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-user-create-admin-group
    desc: Local user creation with privileged-group addition
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/user/create::new-local-user
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add

  - id: privileged-local-account-setup
    desc: Creates a local user account and grants privileged group membership
    crit: notable
    conf: 0.95
    for: [binaries, scripts, source]
    any:
      - id: native-privileged-account-provisioning
      - id: net-administrator-account-provisioning
      - id: powershell-user-create-admin-group
