defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]

traits:
  - id: wordpress-create-editor
    desc: Inserts WordPress user with editor role
    conf: 0.98
    if:
      type: tree-sitter
      language: php
      query: |
        ((function_call_expression
          function: (name) @callee
          arguments: (arguments
            . (argument (array_creation_expression
              (array_element_initializer
                . [(string) (encapsed_string)] @key
                . [(string) (encapsed_string)] @role .))) .)) @create
          (#match? @callee "(?i)^wp_insert_user$")
          (#match? @key "^[\"']role[\"']$")
          (#match? @role "^[\"']editor[\"']$"))

  - id: wordpress-create-user
    desc: Creates a WordPress user account
    conf: 0.9
    attack: T1136.001
    if:
      type: symbol
      kind: call
      regex: '^wp_(create|insert)_user$'

composite_rules:
  - id: wordpress-create-user-admin-role
    desc: Creates user alongside administrator role assignment
    crit: notable
    conf: 0.98
    attack: T1136.001
    all:
      - id: wordpress-create-user
      - id: micro-behaviors/os/user/modify::wordpress-admin-role-assignment