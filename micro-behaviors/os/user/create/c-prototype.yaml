# C source prototype for NetUserAdd. The net-user-add-api symbol atom in
# account-review-windows.yaml cannot see a function-pointer typedef, which is
# how the netapi32 account call is declared when it is resolved at run time.
# The typedef states an account-creation API signature only; the account name
# and privileged group are supplied by the caller and are not established here.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.93
  attack: T1136.001

traits:
  - id: net-user-add-prototype-typedef
    desc: NetUserAdd prototype typedef
    if:
      type: text
      regex: 'NET_API_STATUS \(__stdcall ?\*\w+\)\(LPCWSTR,DWORD,LPBYTE,LPDWORD\)'
      exclude_comments: true
