# `net user NAME PASSWORD /add` supplies a password argument, which may be
# expanded from a variable. An asterisk requests an interactive prompt.
defaults:
  platforms: [windows]
traits:
  - id: net-user-add-inline-password
    desc: Net user adds account with password argument
    crit: suspicious
    conf: 0.9
    attack: T1136.001
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*net1?(\.exe)?\s+user\s+\S+\s+[^\s*/]\S{2,}\s+/add\b'
  - id: powershell-net-user-inline-password-text
    desc: PowerShell account command supplies password
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*net1?(\.exe)?\s+user\s+\S+\s+[^\s*/]\S{2,}\s+/add\b'

composite_rules:
  - id: powershell-net-user-inline-password
    desc: PowerShell adds account with password argument
    crit: suspicious
    conf: 0.9
    for: [powershell]
    attack: T1136.001
    all:
      - id: powershell-net-user-inline-password-text
      - id: micro-behaviors/os/user/create::powershell-net-user-create-call
