defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: useradd-nonunique-uid
    desc: useradd allows duplicate user IDs
    if:
      type: symbol
      kind: call
      regex: '(^|/)useradd$'
      arg:
        name_regex: '^(-o|--non-unique)$'
  - id: useradd-crypt-password-arguments
    desc: useradd includes password option and crypt hash
    if:
      type: symbol
      kind: call
      regex: '(^|/)useradd$'
      args:
        - name_regex: '^(-p|--password)$'
        - regex: '^\$[1256y][a-z]?\$'
