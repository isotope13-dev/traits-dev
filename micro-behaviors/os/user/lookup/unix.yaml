defaults:
  platforms: [linux, macos]
  for: [elf, macho, c]
  crit: notable
  conf: 0.8
traits:
  - id: user-from-uid
    desc: Convert user ID to username (user_from_uid)
    if:
      type: symbol
      exact: user_from_uid
  - id: getpwent
    desc: Iterate password entries
    if:
      type: symbol
      exact: getpwent
  - id: fgetpwent
    desc: Read password entries from a file
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])fgetpwent([^A-Za-z0-9_]|$)'
  - id: fgetgrent
    desc: Read group entries from a file
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])fgetgrent([^A-Za-z0-9_]|$)'
  - id: fgetspent
    desc: Read shadow entries from a file
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])fgetspent([^A-Za-z0-9_]|$)'
  # The shadow-database counterpart of getpwnam, and a neutral libc lookup for
  # the same reason its siblings here are: every login path, PAM module and
  # account tool on a Linux system resolves a shadow entry. It previously sat
  # in objectives/credential-access/dump/system/ -- the same file whose own
  # header records that getpwnam/getpwuid were moved out of there for being
  # "legitimate user lookup functions used by countless system utilities".
  # getspnam was simply left behind, so every stock shadow-utils binary scored
  # a credential-dumping finding. Reading a shadow entry is the capability;
  # dumping intent comes from the composites that pair it with exfil or with a
  # non-account-tool identity.
  - id: getspnam
    desc: Resolve shadow password entry (getspnam)
    mbc: "E1003.008"
    attack: "T1003.008"
    if:
      type: symbol
      exact: getspnam

  - id: sgetspent
    desc: Parse shadow password record
    if:
      type: import
      exact: sgetspent

  - id: sgetsgent
    desc: Parse shadow group record
    if:
      type: import
      exact: sgetsgent
