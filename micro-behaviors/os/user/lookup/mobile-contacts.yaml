# Mobile address-book enumeration APIs. These traits describe access to a
# user's contact records; propagation intent is composed under objectives/.
defaults:
  platforms: [android, ios]
  for: [java, kotlin, swift]
  crit: notable
  conf: 0.97

traits:
  - id: android-contacts-provider-import
    desc: Imports the Android contacts provider API
    for: [java, kotlin]
    platforms: [android]
    if:
      type: symbol
      kind: import
      exact: android.provider.ContactsContract

  - id: android-phone-contact-content-uri
    desc: Android phone-contact provider URI
    for: [java, kotlin]
    platforms: [android]
    if:
      type: symbol
      kind: member
      exact: ContactsContract.CommonDataKinds.Phone.CONTENT_URI

  - id: ios-contacts-framework-import
    desc: Imports the Apple Contacts framework
    for: [swift]
    platforms: [ios]
    if:
      type: symbol
      kind: import
      exact: Contacts

  - id: ios-contact-store-enumeration
    desc: Enumerates contacts through CNContactStore
    for: [swift]
    platforms: [ios]
    if:
      type: symbol
      kind: call
      regex: '(^|\.\.)enumerateContacts$'

  - id: ios-contact-phone-number-key
    desc: Requests phone numbers from iOS contacts
    for: [swift]
    platforms: [ios]
    if:
      type: symbol
      kind: identifier
      exact: CNContactPhoneNumbersKey

  - id: ios-contact-phone-numbers-member
    desc: Reads an iOS contact phone-number list
    for: [swift]
    platforms: [ios]
    if:
      type: symbol
      kind: member
      regex: '^[A-Za-z_]\w*\.\.phoneNumbers$'

composite_rules:
  - id: android-phone-contact-enumeration
    desc: Enumerates Android phone contacts from the contacts provider
    for: [java, kotlin]
    platforms: [android]
    all:
      - id: android-contacts-provider-import
      - id: android-phone-contact-content-uri
      - id: micro-behaviors/data/db/access::jvm-cursor-next-record-call
    near_bytes: 1800

  - id: ios-phone-contact-enumeration
    desc: Enumerates iOS contacts including their phone numbers
    for: [swift]
    platforms: [ios]
    all:
      - id: ios-contacts-framework-import
      - id: ios-contact-store-enumeration
    near_bytes: 1800
    any:
      - id: ios-contact-phone-number-key
      - id: ios-contact-phone-numbers-member
