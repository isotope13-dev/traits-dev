# Node exec/execSync whose literal command lists local Windows accounts or
# groups (`net user`, `net localgroup` with no further arguments).
defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: js-exec-net-user-localgroup-list
    desc: Node exec lists local users or groups
    crit: notable
    conf: 0.92
    attack: T1087.001,T1069.001
    if:
      type: text
      regex: \bexec(Sync)?\(\s*['"`]net\s+(user|localgroup)\s*['"`]
