defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: baseline
  conf: 0.8
traits:
- id: wts-query-session-information
  desc: Terminal session metadata query API reference
  crit: notable
  conf: 0.92
  if:
    type: symbol
    exact: WTSQuerySessionInformationW
- id: lookup-account-name
  desc: Resolve account name to SID
  if:
    type: symbol
    regex: ^LookupAccountName[AW]$
- id: dynamic-get-user-name-reference
  desc: Dynamically resolved Windows username API name
  crit: notable
  conf: 0.94
  for:
  - c
  - cpp
  - pe
  - dll
  if:
    type: text
    regex: GetProcAddress[^\n]{0,120}"GetUserName[AW]"
- id: get-user-name
  desc: References Windows current-username lookup API
  crit: notable
  for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  conf: 0.9
  attack: T1033
  if:
    type: symbol
    regex: ^GetUserName[AW]$
