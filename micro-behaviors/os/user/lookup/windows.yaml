# Windows Account Lookup APIs
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.8
traits:
  - id: lookup-account-name
    desc: Resolve account name to SID
    if:
      type: symbol
      regex: "^LookupAccountName[AW]$"
  - id: dynamic-get-user-name-reference
    desc: Dynamically resolved Windows username API name
    crit: component
    conf: 0.94
    for: [c, cpp, pe, dll]
    if:
      type: text
      regex: 'GetProcAddress[^\n]{0,120}"GetUserName[AW]"'
