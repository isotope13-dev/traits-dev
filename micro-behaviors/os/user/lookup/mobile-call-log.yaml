# Android call-history provider access in compiled-Dalvik form. The DEX
# string pool carries the provider descriptor rather than a source-level
# CallLog import, which java/kotlin-only matchers never see inside an APK.
# Reading the call log is a clear analyst-relevant capability on its own;
# collection intent is composed under objectives/.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.95

traits:
  - id: android-dex-call-log-provider
    desc: DEX references Android call-log provider
    if:
      type: text
      substr: "Landroid/provider/CallLog$Calls;"
  # Some agents query the provider by URI instead of the CallLog class
  # descriptor. The URI is the same call-history store.
  - id: android-dex-call-log-uri
    desc: DEX references the Android call-log content URI
    if:
      type: text
      substr: "content://call_log/calls"
