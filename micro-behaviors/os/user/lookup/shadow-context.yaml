defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  - id: shadow-account-lookup-paths
    desc: Shadow account lookup API and shadow path references
    crit: notable
    conf: 0.9
    all:
    - id: micro-behaviors/os/user/lookup::getspnam
    any:
    - id: micro-behaviors/os/privilege/paths::etc-shadow
    - id: micro-behaviors/fs/path/config/groups::etc-gshadow
