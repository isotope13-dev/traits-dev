# Evidence-only observations; consumers supply any attack context.
defaults:
  platforms: [unix, windows]

traits:
- for: [class, java_class]
  id: java-user-home-property-constant
  desc: Java class contains the user.home property name
  crit: notable
  conf: 0.95
  if:
    type: value
    path: class.strings[*]
    exact: user.home

- for:
  - java
  id: java-user-home-property-read
  desc: Reads the Java user.home system property
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: System\s*\.\s*getProperty\s*\(\s*["']user\.home["']\s*\)
