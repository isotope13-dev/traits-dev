defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: get-user-name-ansi-text
    desc: References the GetUserNameA API name
    if:
      type: text
      substr: GetUserNameA
      section: .rdata

  - id: python-getpass-getuser
    desc: Queries active username via getpass.getuser
    for: [python]
    platforms: [windows, linux, macos]
    attack: T1033
    if:
      type: text
      regex: '\bgetpass\.getuser\s*\('

composite_rules:
  - id: host-username-lookup-any
    desc: Queries active user account identity
    for: [pe, dll, c, cpp, csharp, go, rust, python, powershell]
    platforms: [windows, linux, macos]
    attack: T1033
    any:
      - id: get-user-name
      - id: go-current-user
      - id: python-getpass-getuser
