defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: notable

traits:
  - id: python-net-account-popen
    desc: Python popen queries Windows accounts
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?popen$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^net[ \t]+(user|localgroup|accounts)([ \t]+/domain)?[ \t]*$'
