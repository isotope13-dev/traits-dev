# Preserve the former process/user/query selector membership after UID lookup moves.
composite_rules:
  - id: user-query-api-set
    desc: User identity queries or UID account lookup
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    any:
      - id: micro-behaviors/process/user/query/
      - id: getpwuid
    downgrade:
      # Preserve the moved lookup's effective level in ordinary runtimes.
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiled/
        - id: metadata/file/string/identity::system-shell-basename
