defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-current-user-lookup
    desc: Python current-user lookup
    if:
      type: symbol
      kind: call
      regex: '^(getpass\.getuser|os\.getlogin)$'

  - id: python-normalized-user-name
    desc: Python normalizes current username
    if:
      type: text
      regex: '\b(getpass\.getuser|os\.getlogin)\s*\(\s*\)\s*\.\s*(lower|casefold)\s*\('

  - id: python-user-substring-test
    desc: Python tests a literal username substring
    if:
      type: text
      regex: '["''][\w-]{3,}["'']\s+(not\s+in|in)\s+\w*user(name|_name|_id)?\b'
      case_insensitive: true

composite_rules:
  - id: python-normalized-username-substring
    desc: Python normalized username substring test
    crit: notable
    conf: 0.96
    all:
      - id: python-normalized-user-name
      - id: python-user-substring-test
    near_lines: 8
