# Go User Information
defaults:
  platforms: [windows, linux, macos]
traits:
  - id: go-home-dir
    desc: "Get user home directory (Go)"
    crit: baseline
    conf: 0.9
    for: [go, macho, elf, pe]
    if:
      type: symbol
      exact: "os.UserHomeDir"

  - id: go-current-user
    desc: user.Current() call
    crit: notable
    conf: 0.7
    for:
    - go
    if:
      type: symbol
      kind: call
      exact: user.Current
