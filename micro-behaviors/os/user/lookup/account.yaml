# Generic account-name resolution is a capability, not an attacker objective.
defaults:
  platforms: [unix, android, ios, windows]
  for: [binaries, c]
  crit: notable
  conf: 0.85

composite_rules:
  - id: account-name-resolution
    desc: Resolve account names from numeric IDs
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/os/user/lookup::user-from-uid
      - id: micro-behaviors/os/user/lookup::getpwent
      - id: micro-behaviors/os/user/lookup::fgetpwent
      - id: micro-behaviors/os/user/lookup::fgetgrent
      - id: micro-behaviors/os/user/lookup::fgetspent
      - id: micro-behaviors/os/user/lookup::getspnam
      - id: micro-behaviors/process/user/query/
      - id: micro-behaviors/os/group/lookup/
