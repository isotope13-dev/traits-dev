# PHP / WordPress user-account lookups
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1087

traits:
  # The account query is neutral WordPress plumbing. Intent comes from the
  # composites that reference it (for example, an auth-cookie setup).
  - id: wordpress-get-users-administrators
    desc: get_users query requests administrator accounts
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'get_users\s*\(\s*.{0,50}administrator'

  - id: wordpress-user-query-administrators
    desc: WP_User_Query requests administrator accounts
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(new\s+\\?WP_User_Query|WP_User_Query\s*\()[\s\S]{0,160}administrator'

composite_rules:
  - id: wordpress-list-administrators
    desc: Queries WordPress for administrator accounts
    crit: notable
    conf: 0.84
    any:
      - id: wordpress-get-users-administrators
      - id: wordpress-user-query-administrators
