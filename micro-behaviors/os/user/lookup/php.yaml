# PHP / WordPress user-account lookups
defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  # Canonical atom for "which accounts hold the administrator role" — two
  # objective composites used to carry their own copy of this regex, one of
  # them named for telemetry it does not observe.  The query itself is neutral
  # WordPress plumbing: caching plugins skip the cache for logged-in admins,
  # notice/mail plugins address them, membership plugins gate on them.  Intent
  # comes from the composites that reference it (auto-login backdoor in
  # credential-access/, admin-metadata telemetry in collection/).
  - id: wordpress-list-administrators
    desc: Queries WordPress for administrator accounts
    crit: notable
    conf: 0.8
    attack: T1087
    if:
      type: text
      regex: 'get_users\s*\(\s*.{0,50}administrator'
