defaults:
  crit: notable
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1087.002

traits:
  - id: windows-net-domain-group-query
    desc: Queries Windows domain groups with net.exe
    conf: 0.96
    if:
      type: text
      regex: '(?im)(^|[\r\n&|\[(,"''])\s*net(\.exe)?(["'']?(\s+|,\s*["'']))group\b[^\r\n]{0,80}/dom(ain)?\b'

  - id: windows-net-domain-user-query
    desc: Queries Windows domain users with net.exe
    conf: 0.96
    if:
      type: text
      regex: '(?im)(^|[\r\n&|\[(,"''])\s*net(\.exe)?(["'']?(\s+|,\s*["'']))user\b[^\r\n]{0,80}/dom(ain)?\b'
