# Exclude mutations from each matched command, including trailing switches.
defaults:
  crit: notable
  platforms:
  - windows
  for:
  - batch
  - powershell
  - scripts
  attack: T1087.002
traits:
- id: windows-net-domain-group-query
  desc: Queries Windows domain groups with net.exe
  conf: 0.96
  if:
    type: text
    regex: (?i)\bnet(\.exe)?[\s"\x27,]+group\b[^\r\n&|]{0,80}/dom(ain)?\b[^\r\n&|]{0,80}
  not:
  - regex: (?i)/(add|del(ete)?)\b
- id: windows-net-domain-user-query
  desc: Queries Windows domain users with net.exe
  conf: 0.96
  if:
    type: text
    regex: (?i)\bnet(\.exe)?[\s"\x27,]+user\b[^\r\n&|]{0,80}/dom(ain)?\b[^\r\n&|]{0,80}
  not:
  - regex: (?i)/(add|del(ete)?)\b
