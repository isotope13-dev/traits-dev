defaults:
  platforms: [unix, windows]
  for: [java]

traits:
  - id: java-current-user-property
    desc: Java reads the current user name
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: getProperty
      arg:
        kind: string
        exact: user.name
  - id: java-user-name-property-string
    desc: Java references the user name property
    crit: notable
    conf: 0.88
    for: [class, java]
    if:
      type: text
      exact: user.name
