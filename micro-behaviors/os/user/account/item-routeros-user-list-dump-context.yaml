defaults:
  platforms: [routeros, appliance, unix]
  for: [text, shell, python, javascript]
composite_rules:
- id: routeros-user-list-dump-context
  desc: Reads a RouterOS user listing into a named dump value
  crit: notable
  conf: 0.9
  # The variable names alone (`userList`, `userDump`) are ordinary words in
  # web-content and subdomain wordlists; only a script that also reads the
  # RouterOS user database is storing a dump.
  all:
  - id: micro-behaviors/os/user/account::routeros-user-database-read
  any:
  - id: metadata/lang/source/naming/target::routeros-user-dump-variable--creds-dump
  - id: metadata/lang/source/naming/target::routeros-user-dump-variable--userdump
  - id: metadata/lang/source/naming/target::routeros-user-dump-variable--userlist
  unless:
  - id: metadata/file/extension/asset::javascript-source-map-path
  - id: metadata/file/profile/source-indications/
  - id: metadata/lang/source/naming/function::haxe-user-list-api-reference
