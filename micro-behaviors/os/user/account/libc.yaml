# The WRITE half of the Unix account databases, as libc exposes it to compiled
# programs.
#
# The read primitives all had homes already -- os/user/lookup::getpwent,
# os/user/lookup::getspnam, process/user/query::getpwnam, ::getpwuid -- but
# nothing matched the writes. Consequence: a native binary that APPENDS a uid-0
# record to /etc/passwd or /etc/shadow scored exactly like one that merely read
# them, because only the lookup leg had a trait. Measured on Debian's own
# base-passwd/update-passwd and libpam-modules-bin/unix_chkpwd, which import
# putgrent/putspent/putpwent and lckpwdf: cleave reported the getspnam/getpwuid
# reads and nothing at all for the writes.
#
# The sibling unix.yaml covers this same objective through the shell commands
# (useradd / chpasswd / adduser); these are what a *compiled* program calls
# instead. libc ships no other formatter for the passwd/group/shadow record
# layouts, so a native backdoor adding an account either calls one of these or
# hand-rolls the colon-separated line format itself.
#
# Neutral at notable, not suspicious: shadow-utils, PAM, base-passwd and every
# stock account tool import them. Persistence/backdoor intent comes from
# composites that pair a record write with a uid-0 value or a dropper, the same
# way objectives/persistence/login/account/create/ consumes the command atoms.
defaults:
  platforms: [linux]
  for: [elf, c]
  crit: notable
  conf: 0.9
traits:
  - id: putpwent
    desc: Writes a passwd database record
    if:
      type: import
      exact: putpwent

  - id: putspent
    desc: Writes a shadow database record
    if:
      type: import
      exact: putspent

  - id: putgrent
    desc: Writes a group database record
    if:
      type: import
      exact: putgrent

  # lckpwdf/ulckpwdf take the /etc/.pwd.lock advisory lock that guards
  # passwd+shadow+group against concurrent edits. Readers do not need it, so
  # importing it is a stronger statement of intent-to-modify than the record
  # writers above: the program is announcing it will rewrite the databases.
  - id: lckpwdf
    desc: Locks the shadow password database
    conf: 0.92
    if:
      type: import
      exact: lckpwdf

  - id: ulckpwdf
    desc: Unlocks the shadow password database
    conf: 0.92
    if:
      type: import
      exact: ulckpwdf
