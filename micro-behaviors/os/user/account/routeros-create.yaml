traits:
- id: routeros-user-add
  desc: RouterOS user-add command or API syntax
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (^|[^A-Za-z0-9_/.-])(/user\s+add|/user/add['"]|api\.menu\(['"]/user['"]\)\.add)
- id: routeros-full-group
  desc: RouterOS user command specifies full group
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (/user[^\n]{0,240}group\s*[:=]\s*['"]?full|group\s*[:=]\s*['"]?full[^\n]{0,240}/user)
composite_rules:
- id: routeros-full-admin-account
  desc: RouterOS full user with password
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/user/account::routeros-user-add
  - id: micro-behaviors/os/user/account::routeros-full-group
  - id: micro-behaviors/data/format/credentials::password-field-source-value
defaults:
  platforms:
  - routeros
  for:
  - javascript
  - typescript
  - text
  - python
  - pyc
  - go
