# Neutral observations relocated during release-diff triage.
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  crit: notable
  conf: 0.9
traits:
- id: wp-usermeta-capability-keys--capabilities
  desc: WordPress user-meta capabilities key reference
  if:
    type: text
    regex: (?is)(\b|_)user_?meta\b.{0,80}(\b|_)capabilities\b
- id: wp-usermeta-capability-keys--usermeta
  desc: WordPress user-meta field reference
  if:
    type: text
    regex: (?i)(\b|_)user_?meta\b
