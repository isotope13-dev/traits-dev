defaults:
  platforms: [appliance, unix]
  for: [perl, shell, python, text]
traits:
  - id: netscaler-bind-superuser
    desc: NetScaler system user bound to superuser group
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bbind\s+system\s+user\s+[\$\w]+\s+superuser\b'

  - id: netscaler-add-system-user
    desc: NetScaler system user creation directive
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(add|set)\s+system\s+user\s+[\$\w]+'

