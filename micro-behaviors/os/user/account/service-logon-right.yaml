# Granting "Log on as a service" (SeServiceLogonRight) is what a service account
# needs before the Service Control Manager can start a service as that user. A
# provisioning script that creates a user and grants this right in the same
# source is preparing a service identity; an account created for later
# interactive use has no reason to carry it.
defaults:
  platforms: [windows]
  for: [go, powershell, batch, python]
  crit: notable
  conf: 0.9

traits:
  - id: service-logon-right-grant
    desc: Grants log on as a service right
    if:
      type: text
      substr: SeServiceLogonRight
