# `net user NAME PASSWORD /add` with a literal password adds the account
# without a prompt. An asterisk password asks interactively and is excluded.
defaults:
  platforms: [windows]
traits:
  - id: net-user-add-inline-password
    desc: Net user adds account with literal password
    crit: suspicious
    conf: 0.9
    attack: T1136.001
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*net1?(\.exe)?\s+user\s+\S+\s+[^\s*/]\S{2,}\s+/add\b'
  - id: powershell-net-user-inline-password-text
    desc: PowerShell account command with literal password
    crit: component
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*net1?(\.exe)?\s+user\s+\S+\s+[^\s*/]\S{2,}\s+/add\b'

composite_rules:
  - id: powershell-net-user-inline-password
    desc: PowerShell adds account with literal password
    crit: suspicious
    conf: 0.9
    for: [powershell]
    attack: T1136.001
    all:
      - id: powershell-net-user-inline-password-text
      - id: micro-behaviors/os/user/account::powershell-net-user-create-call
