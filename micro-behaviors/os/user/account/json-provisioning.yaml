# Field-level JSON shapes for programmatic administrator provisioning: a
# password and an administrator role assigned as object fields, bound to the
# object's login-name key. The login-name key is neutral structured data and
# is read from the canonical object-field atom
# micro-behaviors/data/serialize/schema-object::user-field-key (formerly a
# near-duplicate atom filed under os/user/account); the composite below binds
# all three into one provisioning object, and exploit composites add the
# malicious context (here, a paired webshell drop) that proves the
# provisioning serves an attack chain.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: json-administrator-role-field
    desc: JSON administrator role assignment
    if:
      type: text
      regex: '["'']role["'']\s*:\s*["'']admin(istrator)?["'']'
      case_insensitive: true

composite_rules:
  - id: json-administrator-account-provisioning
    desc: JSON provisions an administrator account
    near_bytes: 600
    all:
      - id: micro-behaviors/data/serialize/schema-object::user-field-key
      - id: micro-behaviors/data/property/assign::password-field-name
      - id: json-administrator-role-field
