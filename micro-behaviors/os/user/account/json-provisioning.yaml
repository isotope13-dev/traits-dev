# Field-level JSON shapes for programmatic administrator provisioning: a
# login name, a password, and an administrator role assigned as object
# fields. Each atom alone is neutral structured data (benign setup scripts
# share it); the composite below binds all three into one provisioning
# object, and exploit composites add the malicious context (here, a paired
# webshell drop) that proves the provisioning serves an attack chain.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: json-login-name-field
    desc: JSON login name field
    if:
      type: text
      regex: '["''](loginname|login|username)["'']\s*:'
      case_insensitive: true
  - id: json-administrator-role-field
    desc: JSON administrator role assignment
    if:
      type: text
      regex: '["'']role["'']\s*:\s*["'']admin(istrator)?["'']'
      case_insensitive: true

composite_rules:
  - id: json-administrator-account-provisioning
    desc: JSON provisions an administrator account
    near_bytes: 600
    all:
      - id: json-login-name-field
      - id: micro-behaviors/data/property/assign::password-field-name
      - id: json-administrator-role-field
