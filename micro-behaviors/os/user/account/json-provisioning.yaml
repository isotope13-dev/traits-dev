# Nearby login, password and administrator-role fields describe account data.
# Proximity establishes co-occurrence, not one object or an executed API call.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: json-administrator-role-field
    desc: JSON administrator role assignment
    if:
      type: text
      regex: '["'']role["'']\s*:\s*["'']admin(istrator)?["'']'
      case_insensitive: true

composite_rules:
  - id: administrator-account-field-set
    desc: Login, password and administrator-role fields co-occur
    near_bytes: 600
    all:
      - id: micro-behaviors/data/serialize/schema-object::user-field-key
      - id: "metadata/lang/source/syntax/key-value::password-field-name"
      - id: json-administrator-role-field
