defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-net-user-create-literal
    desc: PowerShell net user creation command string
    conf: 0.95
    if:
      type: literal
      regex: '(?i)\bnet(\.exe)?\s+user\s+\S+(\s+\S+){0,3}\s+/add\b'

  - id: powershell-net-user-create-template
    desc: PowerShell builds a net user add template
    attack: T1136.001
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)net user.{0,80}\$\w+.{0,80}/add\b'

  - id: powershell-net-user-create-call
    desc: PowerShell calls net user with add argument
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i)^net(\.exe)?$'
      args:
        - index: 0
          kind: identifier
          name_regex: '(?i)^user$'
        - kind: identifier
          name_regex: '(?i)^/add$'
