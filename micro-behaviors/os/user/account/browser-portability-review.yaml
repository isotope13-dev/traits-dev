traits:
# Canonical account/role-name observation; a bare word does not prove RBAC.
# Preserve both former atoms' platform coverage and identical exclusions.
# The appliance umbrella includes NetScaler.
- platforms:
  - appliance
  - unix
  - windows
  for:
  - binaries
  - csharp
  - go
  - java
  - kotlin
  - scripts
  - swift
  id: superadmin-word
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  desc: Superadmin account or role word
  crit: notable
  conf: 0.9
  if:
    type: text
    word: superadmin
