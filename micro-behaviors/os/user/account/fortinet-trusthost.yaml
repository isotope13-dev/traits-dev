defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: fortinet-unrestricted-trusthost-field
    desc: Fortinet trusthostv4 permits every IPv4 host
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((pair key: (string (string_content) @key)
          value: (string (string_content) @value)) @field
        (#eq? @key "trusthostv4")
        (#eq? @value "0.0.0.0/0"))
