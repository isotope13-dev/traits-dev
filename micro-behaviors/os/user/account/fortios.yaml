# Entering the FortiOS administrator configuration context is a neutral account
# management capability. Persistence intent depends on the changes made inside
# that context and is expressed by objective composites.
defaults:
  platforms: [fortios, appliance, unix]
  for: [shell, scripts, binaries]

traits:
  - id: fortios-cli-admin-config
    desc: Enters FortiOS administrator configuration
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: config system admin
