# Entering the FortiOS administrator configuration context is a neutral account
# management capability. Persistence intent depends on the changes made inside
# that context and is expressed by objective composites.
defaults:
  platforms: [fortios, appliance, unix]
  for: [shell, scripts, binaries]

traits:
  - id: fortios-cli-admin-config
    desc: Enters FortiOS administrator configuration
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: config system admin

  # Reading the administrator table and piping it onward is ordinary inventory
  # and audit work.  Which field the pipeline then selects is what carries
  # intent, so the credential-access composite supplies that leg.
  - id: fortios-admin-config-read
    desc: Reads FortiOS administrator configuration
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bshow\s+system\s+admin(\s+[^|\r\n]{1,80})?\s*\|'
