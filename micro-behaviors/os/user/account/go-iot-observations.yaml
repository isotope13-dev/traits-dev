defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: dahua-add-user-endpoint
    desc: Dahua user creation endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'userManager.cgi?action=addUser'


composite_rules:
  - id: dahua-admin-user-add
    desc: Dahua add-user endpoint with administrator group
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/os/user/account::dahua-add-user-endpoint
    any:
      - id: micro-behaviors/os/user/account::admin-group-selection
      - id: micro-behaviors/os/user/account::primary-admin-group-selection


