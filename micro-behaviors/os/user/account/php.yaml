defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]

traits:
  - id: wordpress-create-user
    desc: Creates a WordPress user account
    conf: 0.9
    attack: T1136.001
    if:
      type: symbol
      kind: call
      regex: '^wp_(create|insert)_user$'

  - id: wordpress-username-exists-check
    desc: Checks whether a WordPress username exists
    conf: 0.85
    if:
      type: text
      substr: username_exists

  - id: wordpress-set-admin-role
    desc: Sets WordPress administrator role
    conf: 0.9
    attack: T1098
    if:
      type: text
      # Also match PHP source embedded in a generated recovery script, where
      # quotes are escaped inside the surrounding string literal.
      regex: "set_role\\s*\\(\\s*\\\\?['\"]administrator\\\\?['\"]\\s*\\)"

  - id: wordpress-user-array-admin-role
    desc: Assigns admin role in WordPress user array
    conf: 0.94
    attack: T1098
    if:
      type: text
      regex: "\\\\?['\"]role\\\\?['\"]\\s*=>\\s*\\\\?['\"]administrator\\\\?['\"]"

  - id: php-get-current-user
    desc: Gets the current PHP process user
    conf: 0.85
    attack: T1033
    if:
      type: symbol
      kind: call
      exact: get_current_user

composite_rules:
  - id: wordpress-admin-role-assignment
    desc: Assigns administrator role in WordPress
    crit: notable
    conf: 0.94
    any:
      - id: wordpress-set-admin-role
      - id: wordpress-user-array-admin-role
