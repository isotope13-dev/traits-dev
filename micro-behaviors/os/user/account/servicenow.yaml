# ServiceNow user/role table operations via GlideRecord.
#
# Every ServiceNow record is a row in a table; user accounts and role
# assignments are no exception. Scripts that write the sys_user or
# sys_user_has_role tables are performing account and privilege
# operations on the tenant, and are the mechanical core of ServiceNow
# backdoor-user and role-escalation attacks (MDSec, "When it Snows it
# Pours", 2026: Glide scripts re-creating hidden admin users and
# inserting privileged role assignments). Matchers tolerate the escaped
# quoting used when these scripts travel inside JSON REST payloads.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data]

traits:
  - id: servicenow-user-table-write
    desc: Operates on ServiceNow user table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}sys_user[''"]'

  - id: servicenow-role-assignment-table
    desc: Operates on ServiceNow role-assignment table
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}sys_user_has_role'

  - id: servicenow-record-insert-call
    desc: Glide script record insert call
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\.insert\s*\('

  - id: servicenow-user-password-set
    desc: Sets ServiceNow user password via script
    crit: notable
    conf: 0.93
    attack: T1098
    if:
      type: text
      regex: '(setValue|setDisplayValue)\s*\(\s*.{0,3}user_password'

composite_rules:
  - id: servicenow-account-re-enable
    desc: Re-enables or unlocks ServiceNow user record
    crit: notable
    conf: 0.9
    near_bytes: 800
    all:
      - id: servicenow-user-table-write
      - id: micro-behaviors/data/source/property/assignment::js-active-or-unlocked-boolean-assignment

  - id: servicenow-role-assignment-insert
    desc: Inserts ServiceNow role assignment
    crit: notable
    conf: 0.93
    attack: T1098
    all:
      - id: servicenow-role-assignment-table
      - id: servicenow-record-insert-call
    near_bytes: 800
