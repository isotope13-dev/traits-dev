defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: administrator-role-field
    desc: Sets an administrator role field
    crit: notable
    conf: 0.9
    # This is JSON/object-field syntax shared by exploit clients in every
    # source language, not a JavaScript-only construct.
    for: [scripts, source, json]
    if:
      type: text
      regex: '(?i)\broles?["''\s:=\[]{1,6}administrator\b'

  - id: hardcoded-account-credential-triplet
    desc: Account function gets hardcoded credentials
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (arguments
            (string) @username
            (string) @password
            (string) @email))
         (#match? @fn "(?i)(admin|user|account|create|add|register)")
         (#match? @username "^['\"][^'\"]{3,40}['\"]$")
         (#match? @password "^['\"][^'\"]{6,80}['\"]$")
         (#match? @email "@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}['\"]$"))
