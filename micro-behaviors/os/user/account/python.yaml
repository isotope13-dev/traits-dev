# Python account-management function definitions are a neutral capability.  A
# remote-control objective must also establish the HTTP/file-manager context;
# auth stores and local administration tools legitimately define the same API.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-user-management-function-set--get-users
    desc: Python user-management definition (get_users)
    crit: component
    if:
      type: text
      regex: '\bdef\s+get_users\s*\('
  - id: python-user-management-function-set--add-user
    desc: Python user-management definition (add_user)
    crit: component
    if:
      type: text
      regex: '\bdef\s+add_user\s*\('
  - id: python-user-management-function-set--change-user
    desc: Python user-management definition (change_user)
    crit: component
    if:
      type: text
      regex: '\bdef\s+change_user\s*\('
  - id: python-user-management-function-set--remove-user
    desc: Python user-management definition (remove_user)
    crit: component
    if:
      type: text
      regex: '\bdef\s+remove_user\s*\('
  - id: python-user-management-function-set--update-config
    desc: Python user-management def (update_config)
    crit: component
    if:
      type: text
      regex: '\bdef\s+update_config\s*\('
  - id: python-user-management-function-set--get-config
    desc: Python user-management definition (get_config)
    crit: component
    if:
      type: text
      regex: '\bdef\s+get_config\s*\('
composite_rules:
  - id: python-user-management-function-set
    desc: Defines Python user-management functions
    crit: notable
    conf: 0.9
    any:
      - id: python-user-management-function-set--get-users
      - id: python-user-management-function-set--add-user
      - id: python-user-management-function-set--change-user
      - id: python-user-management-function-set--remove-user
      - id: python-user-management-function-set--update-config
      - id: python-user-management-function-set--get-config
