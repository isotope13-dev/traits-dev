defaults:
  platforms:
  - windows
  for:
  - pe
  - powershell
  - batch
  - vbs
  crit: notable
traits:
- id: new-local-user
  desc: Uses New-LocalUser PowerShell cmdlet
  conf: 0.9
  attack: T1136.001
  if:
    type: text
    regex: (?i)New-LocalUser
  unless:
  - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: metadata/build/ci/github-actions::github-workflow-test-user-context
- id: windows-local-test-user
  desc: Local test user declaration
  conf: 0.9
  for:
  - pe
  - powershell
  - batch
  - vbs
  - github-actions
  - yaml
  if:
    type: text
    regex: (?i)New-LocalUser[^\n]{0,200}-Description\s+"[^"\n]{0,80}testing
- id: net-user-create-text
  desc: Net user account creation command text
  conf: 0.9
  attack: T1136.001
  for:
  - scripts
  - binaries
  - source
  - '!powershell'
  if:
    type: text
    regex: (?i)(^|[\r\n&|({;"'])\s*(/c\s+)?net1?(\.exe)?\s+user\s+\S+(\s+\S+){0,3}\s+/add\b
- id: net-user-add-api
  desc: NetUserAdd account-creation API reference
  conf: 0.95
  attack: T1136.001
  for:
  - c
  - cpp
  - csharp
  - rust
  - pe
  - dll
  if:
    type: symbol
    exact: NetUserAdd
- id: impacket-addcomputer-invocation
  desc: Invokes Impacket addcomputer
  conf: 0.96
  attack: T1136.002
  platforms:
  - unix
  - windows
  for:
  - scripts
  if:
    type: text
    regex: (?im)^\s*(impacket-)?addcomputer(\.py)?\s+
- id: impacket-addcomputer-name-password-options
  desc: Impacket machine name and password options
  conf: 0.98
  attack: T1136.002
  platforms:
  - unix
  - windows
  for:
  - scripts
  if:
    type: text
    regex: (?i)-computer-name\s+.{1,80}\s+-computer-pass\s+
- id: load-user-profile-w
  desc: LoadUserProfileW user hive import
  conf: 0.93
  attack: T1087.001
  for:
  - pe
  - dll
  if:
    type: import
    exact: LoadUserProfileW
composite_rules:
- id: native-privileged-account-provisioning
  desc: Native Windows APIs can create a user and add it to an admin group
  conf: 0.95
  attack: T1136.001,T1098
  for:
  - pe
  - c
  - csharp
  all:
  - id: net-user-add-api
  - id: micro-behaviors/os/group/membership::windows-group-membership-api
  - id: micro-behaviors/os/group/membership::privileged-local-group-name
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/packaging/wix::firegiant-utilca-context
  - id: well-known/tool/packaging/wix::wix-toolset-utilca-context
  - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
- id: impacket-domain-machine-account-create
  desc: Creates AD machine account via Impacket
  conf: 0.98
  attack: T1136.002
  platforms:
  - unix
  - windows
  for:
  - scripts
  all:
  - id: impacket-addcomputer-invocation
  - id: impacket-addcomputer-name-password-options
  near_bytes: 512
- id: net-user-create
  desc: Net user account creation command
  conf: 0.9
  for:
  - scripts
  - binaries
  - source
  any:
  - id: net-user-create-text
  - id: powershell-net-user-create-literal
  - id: powershell-net-user-create-call
- id: net-administrator-account-provisioning
  desc: Net user creation and administrator group addition
  conf: 0.97
  all:
  - id: micro-behaviors/os/user/account::net-user-create
  - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add
  unless:
  - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
  - id: well-known/tool/development/ci/skia-buildbot/
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
  - id: metadata/build/ci/agent::packer-windows-ci-image-context
  - id: metadata/path::test-directory-component
