defaults:
  platforms: [windows]
  for: [pe, powershell, batch, vbs]
traits:
  - id: new-local-user
    desc: Uses New-LocalUser PowerShell cmdlet
    crit: notable
    conf: 0.9
    attack: "T1136.001"
    if:
      type: text
      regex: '(?i)New-LocalUser'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: add-local-group-member
    desc: Uses Add-LocalGroupMember PowerShell cmdlet
    crit: notable
    conf: 0.9
    attack: "T1098"
    if:
      type: text
      regex: '(?i)Add-LocalGroupMember'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: remove-local-group-member
    desc: Uses Remove-LocalGroupMember PowerShell cmdlet
    crit: notable
    conf: 0.9
    attack: "T1531"
    if:
      type: text
      regex: '(?i)Remove-LocalGroupMember'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: net-user-create
    desc: Creates local user via net user command
    crit: notable
    conf: 0.9
    attack: "T1136.001"
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)(^|[\r\n&|({;"''])\s*(/c\s+)?net(\.exe)?\s+user\s+\S+(\s+\S+){0,3}\s+/add\b'
  - id: net-localgroup-administrators-add
    desc: Adds user to administrators via net localgroup
    crit: suspicious
    conf: 0.95
    attack: "T1098"
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)net\s+localgroup\s+administrators\s+\S+\s+/add'
    unless:
      - id: well-known/tool/development/go-x-build::go-x-build-infra-context
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
      - id: well-known/tool/offensive/bingo/
  - id: net-user-add-api
    desc: Creates a local user through NetUserAdd
    crit: notable
    conf: 0.95
    attack: T1136.001
    for: [c, cpp, csharp, rust, pe, dll]
    if:
      type: symbol
      exact: NetUserAdd
  - id: load-user-profile-w
    desc: LoadUserProfileW user hive import
    crit: notable
    conf: 0.93
    attack: T1087.001
    for: [pe, dll]
    if:
      type: import
      exact: LoadUserProfileW
