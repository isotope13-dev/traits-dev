# Unix account-management command references.  Account creation is a neutral
# capability; attacker intent requires additional context in objectives/.
defaults:
  platforms: [unix]
  for: [python, shell]
  crit: notable
  conf: 0.9
  attack: T1136.001

traits:
  - id: useradd-command
    desc: Creates Unix account with useradd or adduser
    for: [python, shell, elf]
    if:
      type: text
      regex: '(^|[\n;&|`$])\s*(/usr/sbin/)?(useradd|adduser)[ \t]+(-|[A-Za-z0-9_./])'
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: useradd-login-shell
    desc: Account creation specifies a login shell
    crit: notable
    conf: 0.86
    for: [python, shell, elf]
    if:
      type: text
      regex: '(useradd|adduser)\b[^\n]{0,120}(-s|--shell)'
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: useradd-uid-zero
    desc: Creates Unix account with UID zero
    crit: notable
    conf: 0.95
    for: [python, shell, elf]
    if:
      type: text
      regex: '(?i)(useradd|adduser)\b[^\n;&|]{0,120}-(ou|u)\s+0'
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: useradd-gid-zero
    desc: Creates Unix account with GID zero
    crit: notable
    conf: 0.95
    for: [python, shell, elf]
    if:
      type: text
      regex: '(?i)(useradd|adduser)\b[^\n;&|]{0,160}-g\s+0'
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: chpasswd-command
    desc: Changes Unix passwords with chpasswd
    for: [python, shell, elf]
    if:
      type: text
      regex: "(^|[\\n;&|`$({])\\s*((/usr/sbin/)?chpasswd\\b|echo '%s:%s' \\| chpasswd)"
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/sysadmin/busybox::busybox-binary

  # Account/group REMOVAL had no command trait anywhere — this directory covered
  # only creation (useradd/adduser) and password change (chpasswd), and the sole
  # userdel/groupdel matches in the tree are `type: basename` markers in
  # objectives/credential-access/dump/system/ that identify the *tool file*, not
  # an invocation. So a script running `userdel -r victim` scored nothing while
  # `useradd victim` scored notable. Deleting an account is the destructive half
  # of the same capability and the standard cover-your-tracks step after an
  # operator account has served its purpose (ATT&CK T1531).
  #
  # The anchor class adds `'` and `"` on top of the siblings' shell metacharacters
  # so argv-list invocations match too — `systemcall('/usr/sbin/userdel', $user)`
  # in Perl, `subprocess.run(["userdel", user])` in Python — which is how a
  # compiled or scripted caller actually spawns these, never as a shell string.
  # The comment-leader `not:` keeps prose out (Debian's own deluser carries the
  # line `# groupdel will error out if there are users left`).
  - id: userdel-command
    desc: Deletes Unix account with userdel or deluser
    crit: notable
    conf: 0.9
    attack: T1531
    for: [python, shell, perl, elf]
    if:
      type: text
      regex: "(^|[\\n;&|`$({'\"])\\s*(/usr/sbin/)?(userdel|deluser)\\b"
    not:
      - regex: '^\s*(\*|//|#)'
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: groupdel-command
    desc: Deletes Unix group with groupdel or delgroup
    crit: notable
    conf: 0.9
    attack: T1531
    for: [python, shell, perl, elf]
    if:
      type: text
      regex: "(^|[\\n;&|`$({'\"])\\s*(/usr/sbin/)?(groupdel|delgroup)\\b"
    not:
      - regex: '^\s*(\*|//|#)'
    unless:
      - id: metadata/package/testing/harness/runtime/
