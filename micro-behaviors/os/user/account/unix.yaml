# Unix account-management command references.  Account creation is a neutral
# capability; attacker intent requires additional context in objectives/.
defaults:
  platforms: [unix]
  for: [python, shell]
  crit: notable
  conf: 0.9
  attack: T1136.001

traits:
  - id: useradd-command
    desc: Creates Unix account with useradd or adduser
    for: [python, shell, elf]
    if:
      type: text
      regex: '(^|[\n;&|`$])\s*(/usr/sbin/)?(useradd|adduser)[ \t]+(-|[A-Za-z0-9_./])'
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
  - id: useradd-login-shell
    desc: Account creation specifies a login shell
    crit: notable
    conf: 0.86
    for: [python, shell, elf]
    if:
      # Capture the shell itself, not just the flag. Stopping at `-s` meant
      # `useradd -s /usr/sbin/nologin` — a service account that cannot log in,
      # and the standard shape in a container entrypoint — was read as "specifies
      # a login shell", which is the opposite of what the argument says.
      type: text
      regex: '(useradd|adduser)\b[^\n]{0,120}(-s|--shell)[= \t]+\S+'
    not:
      - regex: '(nologin|/false|/true)$'
  - id: useradd-uid-zero
    desc: Creates Unix account with UID zero
    crit: notable
    conf: 0.95
    for: [python, shell, elf]
    if:
      type: text
      regex: '(?i)(useradd|adduser)\b[^\n;&|]{0,120}-(ou|u)\s+0'
  - id: useradd-gid-zero
    desc: Creates Unix account with GID zero
    crit: notable
    conf: 0.95
    for: [python, shell, elf]
    if:
      type: text
      regex: '(?i)(useradd|adduser)\b[^\n;&|]{0,160}-g\s+0'
  - id: chpasswd-command
    desc: Changes Unix passwords with chpasswd
    for: [python, shell, elf]
    if:
      type: text
      regex: "(^|[\\n;&|`$({])\\s*((/usr/sbin/)?chpasswd\\b|echo '%s:%s' \\| chpasswd)"
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
      - id: well-known/tool/sysadmin/busybox::busybox-binary

  - id: python-chpasswd-process-call
    desc: Python launches chpasswd
    crit: notable
    conf: 0.93
    attack: T1098
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)\bsubprocess\.\w+\(\s*\[\s*["''](/usr/sbin/)?chpasswd["'']'
  - id: userdel-command
    desc: Deletes Unix account with userdel or deluser
    crit: notable
    conf: 0.9
    attack: T1531
    for: [python, shell, elf]
    if:
      type: text
      regex: "(^|[\\n;&|`$({])\\s*(/usr/sbin/)?(userdel|deluser)\\b"
    not:
      - regex: '^\s*(\*|//|#)'
  - id: perl-systemcall-userdel
    desc: Perl wrapper invokes userdel
    crit: notable
    conf: 0.94
    attack: T1531
    for: [perl]
    if:
      type: text
      regex: "\\bsystemcall(_silent|_or_warn)?\\s*\\(\\s*['\"](/usr/sbin/)?userdel['\"]"
  - id: groupdel-command
    desc: Deletes Unix group with groupdel or delgroup
    crit: notable
    conf: 0.9
    attack: T1531
    for: [python, shell, elf]
    if:
      type: text
      regex: "(^|[\\n;&|`$({])\\s*(/usr/sbin/)?(groupdel|delgroup)\\b"
    not:
      - regex: '^\s*(\*|//|#)'
  - id: perl-groupdel-command-resolution
    desc: Perl resolves groupdel utility path
    crit: notable
    conf: 0.9
    for: [perl]
    if:
      type: text
      regex: "\\bwhich\\s*\\(\\s*['\"]groupdel['\"]\\s*\\)"
  - id: perl-groupdel-systemcall
    desc: Perl wrapper invokes resolved groupdel
    crit: notable
    conf: 0.9
    attack: T1531
    for: [perl]
    if:
      type: text
      substr: systemcall($groupdel
  - id: skel-profile-setup
    desc: Copies /etc/skel into user profile
    crit: notable
    conf: 0.75
    for:
      - elf
      - shell
    if:
      type: text
      substr: cp -r /etc/skel

composite_rules:
  - id: perl-groupdel-command
    desc: Deletes Unix group through Perl wrapper
    crit: notable
    conf: 0.94
    attack: T1531
    for: [perl]
    all:
      - id: perl-groupdel-command-resolution
      - id: perl-groupdel-systemcall
