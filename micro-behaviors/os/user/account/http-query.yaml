defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, text]

traits:
  - id: administrator-role-query-parameter
    desc: URL query assigns administrator role
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)([?&]|&amp;)roles?(\[\]|%5b%5d)?=administrator([&#"''\s]|$)'
