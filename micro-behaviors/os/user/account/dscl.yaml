defaults:
  platforms: [unix, android, ios]
traits:
  - id: dscl-create-user
    desc: macOS dscl user creation
    crit: notable
    conf: 0.85
    for:
      - shell
      - macho
    platforms:
      - macos
    if:
      type: text
      regex: dscl\s+\.\s+-create\s+/Users/[A-Za-z0-9._-]+
  - id: dscl-user-shell
    desc: macOS dscl login shell set
    crit: notable
    conf: 0.85
    for:
      - shell
      - macho
    platforms:
      - macos
    if:
      type: text
      regex: dscl\s+\.\s+-create\s+/Users/\S+\s+UserShell\s+/bin/(ba)?sh
    unless:
      - id: well-known/app/utility/sudo::source-tree
  - id: dscl-user-password
    desc: macOS dscl password set
    crit: notable
    conf: 0.85
    for:
      - shell
      - macho
    platforms:
      - macos
    if:
      type: text
      regex: dscl\s+\.\s+-passwd\s+/Users/[A-Za-z0-9._-]+\s+\S+
composite_rules:
  - id: account-provisioning
    desc: Account creation or password provisioning
    crit: notable
    conf: 0.8
    for:
      - elf
      - shell
    needs: 2
    any:
      - id: micro-behaviors/os/user/account::useradd-command
      - id: micro-behaviors/os/user/account::useradd-login-shell
      - id: micro-behaviors/os/user/account::chpasswd-command
      - id: micro-behaviors/crypto/kdf/password::openssl-passwd
      - id: dscl-create-user
      - id: dscl-user-shell
      - id: dscl-user-password
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/docker::dockerfile-basename
      - id: well-known/app/infrastructure/pvetui::pvetui-ansible-bootstrap-context
    downgrade:
      any:
        - id: micro-behaviors/fs/path/binary::bin-busybox-path
