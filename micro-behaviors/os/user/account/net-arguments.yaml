defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Process.Start("net", arguments) stores these separately from the image name.
  # Match complete arguments; a standalone template does not prove execution.
  - id: net-user-create-password-arguments
    desc: Net user-create arguments with fixed password
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)^user\s+\S+\s+[^\s*/]\S*\s+/add$'
      section: .text
