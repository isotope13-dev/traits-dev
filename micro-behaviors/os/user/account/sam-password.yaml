defaults:
  platforms:
  - windows
  for: [binaries, source, scripts]
traits:
- id: sam-password-change-api-reference
  desc: References SAM password-change API
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\bSamiChangePasswordUser\b
  unless:
  - id: metadata/binary/vendor::microsoft-signed-system-component-context
  - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
