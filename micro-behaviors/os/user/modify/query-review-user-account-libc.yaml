# libc account-record writers; imports alone do not establish execution.
defaults:
  platforms:
  - linux
  for:
  - elf
  - c
  crit: notable
  conf: 0.9

traits:
  - id: putpwent
    desc: References passwd database writer
    if:
      type: import
      exact: putpwent

  - id: putspent
    desc: References shadow database writer
    if:
      type: import
      exact: putspent

