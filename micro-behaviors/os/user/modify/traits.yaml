defaults:
  for:
    - shell
    - elf
  platforms:
    - linux
traits:
  - id: usermod
    desc: usermod command
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?m)(^|[\n;&|`$({])\s*(/usr/sbin/)?usermod\s+-[A-Za-z]'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context

  - id: lua-uid-zero-passwd-entry
    desc: Lua constructs a UID-zero passwd entry
    crit: notable
    conf: 0.9
    for: [lua, rpm]
    if:
      # RPM stores Lua scriptlets in the package header rather than as a
      # standalone text member; raw matching keeps this behavior visible there.
      type: raw
      regex: 'file:write\s*\(\s*["''][^"''\r\n:]{1,32}:x:0:0:'
