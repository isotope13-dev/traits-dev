defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-admin-membership-replacement
    desc: User creation and privileged-group changes
    crit: suspicious
    conf: 0.94
    near_lines: 30
    all:
      - id: micro-behaviors/os/user/create::new-local-user
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-remove
