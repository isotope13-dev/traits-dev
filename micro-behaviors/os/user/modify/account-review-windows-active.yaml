defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1098
traits:
  - id: net-user-activate-account
    desc: net user activates user account
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\r\n&|({;"''])\s*(/c\s+)?net1?(\.exe)?\s+user\s+[^\r\n]{1,80}/active:yes\b'
