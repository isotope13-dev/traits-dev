defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1098
traits:
  - id: net-user-activate-account
    desc: net user activates user account
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\r\n&|({;"''])\s*(/c\s+)?net1?(\.exe)?\s+user\s+[^\r\n]{1,80}/active:yes\b'
  # The built-in Guest account is a shared, normally disabled identity. Turning
  # it on removes an authentication boundary; it does not by itself establish
  # who will use the account. Hardening scripts write /active:no, never :yes.
  - id: net-guest-account-activate
    desc: net user enables the built-in Guest account
    crit: suspicious
    conf: 0.95
    for: [pe, dll, batch, vbscript, c, cpp, csharp]
    if:
      type: text
      regex: '(?i)\bnet1?(\.exe)?\s+user\s+"?guest"?\s[^\r\n&|]{0,60}/active:yes\b'
  - id: powershell-guest-account-enable
    desc: PowerShell enables the built-in Guest account
    crit: suspicious
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bEnable-LocalUser\s+(-Name\s+)?["'']?guest["'']?(\s|;|$)'
