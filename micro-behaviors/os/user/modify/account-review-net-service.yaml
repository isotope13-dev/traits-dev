defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: net-admin-account-service-reference-clues
    desc: Admin account and service reference clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/user/create::net-administrator-account-provisioning
    any:
      - id: "micro-behaviors/os/registry/service/reference::system-services-registry-path"
      - id: "micro-behaviors/os/registry/autostart/reference::winlogon-registry-path"
      - id: micro-behaviors/os/service/host::svchost-netsvcs-group-name
      - id: micro-behaviors/os/service/configure::change-service-config
      - id: micro-behaviors/os/service/control::open-sc-manager
    needs: 1
    unless:
      - id: metadata/installer/product/
  - id: net-admin-promotion-telnet-start
    desc: Net admin promotion with Telnet service start
    crit: suspicious
    conf: 0.96
    # No account has to be created: promoting an existing one (the built-in
    # helpassistant, say) and opening Telnet is the same remote-access setup.
    all:
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add-text
      - id: micro-behaviors/os/service/start::net-start-telnet-service
    unless:
      - id: metadata/installer/product/
