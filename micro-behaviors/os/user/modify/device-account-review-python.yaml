defaults:
  platforms: [unix]
  for: [python]

composite_rules:
  - id: python-passwd-shadow-entry-clues
    desc: Python passwd and shadow entry clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/os/privilege/paths::etc-shadow
      - id: micro-behaviors/os/user/create::python-shadow-entry-build
    any:
      - id: micro-behaviors/fs/write/file/target::python-etc-passwd-open-write
      - id: micro-behaviors/os/user/create::python-passwd-binsh-entry-format
      - id: micro-behaviors/fs/path/config/system::openwrt-uci-config-access
      - id: micro-behaviors/fs/path/private-key::dropbear-key-path
    needs: 1
