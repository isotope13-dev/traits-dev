defaults:
  platforms:
    - unix
    - android
    - ios
traits:
  - id: dscl-root-uid
    desc: macOS dscl UID 0 assignment
    crit: notable
    conf: 0.95
    for:
      - shell
      - macho
    platforms:
      - macos
    if:
      type: text
      regex: dscl\s+\.\s+-create\s+/Users/\S+\s+UniqueID\s+0
  - id: dscl-root-group
    desc: macOS dscl GID 0 assignment
    crit: notable
    conf: 0.95
    for:
      - shell
      - macho
    platforms:
      - macos
    if:
      type: text
      regex: dscl\s+\.\s+-create\s+/Users/\S+\s+PrimaryGroupID\s+0
composite_rules:
  - id: privilege-configuration-clues
    desc: Privilege configuration command clues
    crit: notable
    conf: 0.85
    for:
      - elf
      - shell
    needs: 2
    any:
      - id: micro-behaviors/os/group/membership::usermod-wheel
      - id: micro-behaviors/os/group/membership::usermod-sudo
      - id: micro-behaviors/fs/config/sudo::sudo-nopasswd
      - id: micro-behaviors/fs/config/sudo::visudo-validate
      - id: micro-behaviors/os/user/modify::dscl-root-uid
      - id: micro-behaviors/os/user/modify::dscl-root-group
    unless:
      # TensorFlow-style CI Docker wrapper creates a matching in-container user.
      - id: well-known/lib/ai/tensorflow::tensorflow-user-wrapper
      - id: metadata/build/docker::dockerfile-basename
      - id: well-known/app/infrastructure/pvetui::pvetui-ansible-bootstrap-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
  - id: account-and-privilege-configuration
    desc: Account provisioning and privilege configuration
    crit: notable
    conf: 0.9
    for:
      - elf
      - shell
    all:
      - id: micro-behaviors/os/user/provision::account-provisioning
      - id: micro-behaviors/os/user/modify::privilege-configuration-clues

  - id: root-equivalent-useradd
    desc: Creates UID/GID-zero login account
    crit: suspicious
    conf: 0.98
    for: [shell, python, elf]
    attack: T1136.001
    all:
      - id: micro-behaviors/os/user/create::useradd-uid-zero
      - id: micro-behaviors/os/user/create::useradd-gid-zero
      - id: micro-behaviors/os/user/create::useradd-login-shell

  # macOS spelling of the same account: dscl -create /Users/<name>, then
  # UniqueID 0, PrimaryGroupID 0, and a login shell. UID 0 is the privilege;
  # the shell is what makes it a login account rather than a directory entry.
  - id: macos-dscl-root-equivalent-account
    desc: dscl creates a UID-zero account
    crit: suspicious
    conf: 0.97
    for: [shell, macho]
    platforms: [macos]
    attack: T1136.001,T1548.001
    all:
      - id: micro-behaviors/os/user/create::dscl-create-user
      - id: micro-behaviors/os/user/modify::dscl-root-uid
      - id: micro-behaviors/os/user/modify::dscl-root-group
      - id: micro-behaviors/os/user/modify::dscl-user-shell
