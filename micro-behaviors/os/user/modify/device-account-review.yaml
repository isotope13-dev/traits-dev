defaults:
  platforms: [appliance]
  for: [javascript, typescript, text, python, pyc, go]

composite_rules:
  - id: go-add-full-group-password-clues
    desc: Go add command, full group and password clues
    crit: suspicious
    conf: 0.98
    platforms: [routeros]
    for: [go]
    all:
      - id: metadata/file/profile/command-reference::go-runsynt-add-command-text
      - id: metadata/file/profile/command-reference::go-resolved-full-group-argument
      - id: metadata/file/profile/command-reference::go-resolved-password-argument
