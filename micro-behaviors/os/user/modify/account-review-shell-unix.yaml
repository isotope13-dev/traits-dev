defaults:
  platforms: [unix]
  for: [scripts, binaries]

traits:
  - id: passwd-uid-zero-line-append
    desc: Appends a UID-zero account line to /etc/passwd
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: :0:0:[^\n]{0,60}>>\s*['"]?/etc/passwd
    unless:
    - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
    - id: well-known/app/utility/cmdchamp/
    - id: micro-behaviors/fs/path/config/system::openwrt-firmware-component-context
    - id: well-known/tool/offensive/exploitdb::published-script-wrapper
    # Minimal container / CI root account initialization fallback
    - type: text
      regex: 'grep\s+.*root:.*(printf|echo)\s+[''"]?root:x:0:0:'
composite_rules:
  - id: passwd-uid-zero-append-account-clues
    desc: UID-zero passwd append and account-file clues
    crit: suspicious
    conf: 0.97
    attack: T1136.001,T1098
    all:
    - id: micro-behaviors/os/user/modify::passwd-uid-zero-line-append
    any:
    - id: micro-behaviors/fs/write/credential::unix-shadow-file-append
    - id: micro-behaviors/fs/path/account-db::passwd-entry-uid-zero-shell-account
    unless:
    - id: micro-behaviors/fs/path/config/system::openwrt-firmware-component-context
    - id: well-known/tool/offensive/exploitdb::published-script-wrapper

