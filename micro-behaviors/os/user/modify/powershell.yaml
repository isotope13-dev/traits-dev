# Account password-change entry points in PowerShell. `SetPassword` is the
# .NET DirectoryServices / ADSI method every local- and domain-user management
# script calls, so this is a neutral account-administration capability. Intent
# comes from the target (a PLC, a domain controller, a rival account) supplied
# by the composites that reference it.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1098

traits:
  - id: set-or-change-password-method
    desc: Calls a set or change password method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(set|change)[A-Za-z0-9_-]*password[A-Za-z0-9_-]*$'
