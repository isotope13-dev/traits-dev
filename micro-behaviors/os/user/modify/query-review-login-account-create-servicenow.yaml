defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - json
  - text
  - data

composite_rules:
  - id: servicenow-password-reset-reenable
    for: [javascript]
    desc: ServiceNow password reset and account enable
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/user/account::servicenow-user-password-set
      - id: micro-behaviors/os/user/account::servicenow-account-re-enable
    near_bytes: 1500
