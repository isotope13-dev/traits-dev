# Unix account-management command references.  Account creation is a neutral
# capability; attacker intent requires additional context in objectives/.
defaults:
  platforms: [unix]
  for: [python, shell]
  crit: notable
  conf: 0.9
  attack: T1136.001

traits:
  - id: userdel-command
    desc: Deletes Unix account with userdel or deluser
    crit: notable
    conf: 0.9
    attack: T1531
    for: [python, shell, elf]
    if:
      type: text
      regex: "(^|[\\n;&|`$({])\\s*(/usr/sbin/)?(userdel|deluser)\\b"
    not:
      - regex: '^\s*(\*|//|#)'
  - id: perl-systemcall-userdel
    desc: Perl wrapper invokes userdel
    crit: notable
    conf: 0.94
    attack: T1531
    for: [perl]
    if:
      type: text
      regex: "\\bsystemcall(_silent|_or_warn)?\\s*\\(\\s*['\"](/usr/sbin/)?userdel['\"]"
