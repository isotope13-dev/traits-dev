defaults:
  platforms: [unix, android, ios]
composite_rules:
  - id: account-provisioning
    desc: Account creation or password provisioning clues
    crit: notable
    conf: 0.8
    for:
      - elf
      - shell
    needs: 2
    any:
      - id: micro-behaviors/os/user/create::useradd-command
      - id: micro-behaviors/os/user/create::useradd-login-shell
      - id: micro-behaviors/os/user/modify::chpasswd-command
      - id: micro-behaviors/crypto/kdf/password::openssl-passwd
      - id: micro-behaviors/os/user/create::dscl-create-user
      - id: micro-behaviors/os/user/modify::dscl-user-shell
      - id: micro-behaviors/os/user/modify::dscl-user-password
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
      - id: metadata/build/docker::dockerfile-basename
      - id: well-known/app/infrastructure/pvetui::pvetui-ansible-bootstrap-context
    downgrade:
      any:
        - id: micro-behaviors/fs/path/application/interpreter::bin-busybox-path
