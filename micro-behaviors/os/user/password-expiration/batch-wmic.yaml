defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  attack: T1098
traits:
  - id: batch-wmic-password-never-expires
    desc: Disables Windows account password expiration
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^wmic(\.exe)?\s+useraccount\b.{0,160}\bset\s+PasswordExpires\s*=\s*False\b'
