defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  attack: T1098

traits:
  - id: python-wmic-password-never-expires
    desc: WMIC password-expiration disable command
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+useraccount\b.{0,100}\bset\s+PasswordExpires\s*=\s*False\b'
