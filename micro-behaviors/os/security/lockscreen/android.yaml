# Commands documented in the ArcticRAT report are also legitimate Android
# administration primitives. These observations do not establish remote use.
defaults:
  platforms: [android]
  for: [java]
  crit: notable
  conf: 0.98

traits:
  - id: android-locksettings-clear-old
    desc: References authenticated screen-lock removal
    ref: https://zimperium.com/blog/arcticrat-ai-powered-android-rat
    if:
      type: text
      exclude_comments: true
      regex: '\blocksettings\s+clear\s+--old\b'

  - id: android-locksettings-set-credential
    desc: References screen-lock credential setting
    ref: https://zimperium.com/blog/arcticrat-ai-powered-android-rat
    if:
      type: text
      exclude_comments: true
      regex: '\blocksettings\s+set-(password|pin|pattern)\s+'
