# Verification alone neither captures nor guesses a credential.
defaults:
  platforms: [android, unix]
  for: [java, kotlin, shell, dex]

traits:
  - id: android-adb-locksettings-verify
    desc: References screen-lock credential verification
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\blocksettings\s+verify\s+--old\b'
