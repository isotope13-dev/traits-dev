# macOS Gatekeeper and code signing security tools
# Detects binaries that invoke system security assessment tools
# These are used by droppers to validate payloads before execution
defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
traits:
  - id: spctl-assess
    desc: Gatekeeper assessment via spctl
    conf: 0.9
    attack: T1553.001
    if:
      type: text
      substr: "/usr/sbin/spctl --assess"
  - id: codesign-verify
    desc: Code signature verification via codesign
    conf: 0.85
    if:
      type: text
      substr: "/usr/bin/codesign -dv"
  - id: codesign-force-adhoc
    desc: Ad-hoc code signing command
    crit: notable
    conf: 0.95
    attack: T1553.001
    for: [shell, applescript, python, javascript, macho]
    if:
      type: text
      regex: codesign\s+--force.{0,30}--sign\s+-[\s"]
  - id: codesign-command
    desc: References the macOS codesign command
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      word: codesign
  - id: codesign-verbose-verification
    desc: macOS codesign verbose verification command
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: runCodeSignInvocation
      arg:
        kind: string
        exact: --verbose=4
  - id: codesign-ad-hoc-signing
    desc: Ad-hoc signs a file with macOS codesign
    crit: notable
    conf: 0.96
    attack: T1553.001
    for: [shell]
    if:
      type: text
      regex: '\bcodesign\b[^\n]{0,80}(--sign|-s)\s+["'']?-\s'
  - id: file-mime-check
    desc: File MIME type detection via file command
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: "/usr/bin/file --mime-type"

  - id: amfid-daemon-path
    desc: macOS amfid daemon path
    crit: notable
    conf: 0.95
    attack: T1553.001
    for: [python]
    if:
      type: text
      substr: /usr/libexec/amfid

  - id: amfi-path-validator-class
    desc: AMFI path validator class name
    crit: notable
    conf: 0.96
    attack: T1553.001
    for: [python]
    if:
      type: text
      substr: AMFIPathValidator_macos
