defaults:
  platforms: [macos]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-spctl-launch
    desc: Node invokes the Gatekeeper utility
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^execFile(Sync|Async)?[0-9]*$'
      arg:
        index: 0
        kind: string
        exact: spctl
