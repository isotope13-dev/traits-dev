# Code-signature checks performed by the program, independent of the analyzed
# artifact's own signature (which belongs under metadata/signed).
defaults:
  platforms: [macos]
  for: [macho, dylib]
  crit: notable
  conf: 0.98

traits:
  - id: apple-running-code-validity-import
    desc: Imports running-code signature validation API
    if:
      type: import
      exact: SecCodeCheckValidity

  - id: apple-file-code-validity-import
    desc: Imports file code-signature validation API
    if:
      type: import
      exact: SecStaticCodeCheckValidity
