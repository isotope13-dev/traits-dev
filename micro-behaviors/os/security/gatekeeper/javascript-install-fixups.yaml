defaults:
  for: [javascript, typescript]
  platforms: [macos]
  crit: notable
traits:
  - id: javascript-quarantine-remove-command
    desc: References quarantine removal command
    if:
      type: text
      substr: 'xattr -d com.apple.quarantine'
  - id: javascript-remove-codesign-command
    desc: References code signature removal command
    if:
      type: text
      substr: 'codesign --remove-signature'
composite_rules:
  - id: javascript-quarantine-remove-resign
    desc: Removes quarantine and re-signs executable
    crit: suspicious
    near_bytes: 1800
    all:
      - id: javascript-quarantine-remove-command
      - id: javascript-remove-codesign-command
