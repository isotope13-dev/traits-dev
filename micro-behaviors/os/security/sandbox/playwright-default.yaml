defaults:
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.96
traits:
  - id: playwright-no-sandbox-unless-enabled
    desc: Chromium sandbox disabled unless enabled
    if:
      type: text
      regex: '(!0|true)\s*!==\s*\w+\.chromiumSandbox\s*&&\s*\w+\.push\(["'']--no-sandbox["'']\)'
  - id: playwright-default-unsandboxed-if-statement
    desc: Playwright disables sandbox by default
    if:
      type: text
      regex: 'if\s*\(\s*\w+\.chromiumSandbox\s*!==\s*true\s*\)\s*\w+\.push\(["'']--no-sandbox["'']\)'
  - id: playwright-chromium-launch-headless-default
    desc: Playwright launches with default sandbox
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @browser property: (property_identifier) @launch)
          arguments: (arguments . (object . (shorthand_property_identifier) @headless .) .))
          (#eq? @browser "chromium")
          (#eq? @launch "launch")
          (#eq? @headless "headless"))
  - id: playwright-chromium-explicit-no-sandbox
    desc: Playwright launches Chromium without sandbox
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @browser)
            property: (property_identifier) @launch)
          arguments: (arguments (object
            (pair key: (property_identifier) @args
              value: (array (string (string_fragment) @flag))))))
          (#eq? @browser "chromium")
          (#eq? @launch "launch")
          (#eq? @args "args")
          (#eq? @flag "--no-sandbox"))
