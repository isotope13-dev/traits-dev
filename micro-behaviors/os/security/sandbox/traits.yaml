defaults:
  crit: notable
  platforms:
    - unix
    - windows
traits:
  - id: sandbox-init
    desc: macOS sandbox initialization
    conf: 0.95
    platforms:
      - macos
    for:
      - macho
    if:
      type: symbol
      regex: sandbox_init
  - id: sandbox-init-params
    desc: macOS sandbox initialization with parameters
    conf: 0.95
    platforms:
      - macos
    for:
      - macho
    if:
      type: symbol
      regex: sandbox_init_with_parameters
  - id: sandbox-extension-consume
    desc: macOS sandbox extension consumption
    conf: 0.9
    platforms:
      - macos
    for:
      - macho
    if:
      type: symbol
      regex: sandbox_extension_consume
  - id: sandbox-extension-issue
    desc: macOS sandbox extension issuance
    conf: 0.9
    platforms:
      - macos
    for:
      - macho
    if:
      type: symbol
      regex: sandbox_extension_issue
  - id: sandbox-check
    desc: macOS sandbox check function
    conf: 0.9
    platforms:
      - macos
    for:
      - macho
    if:
      type: symbol
      regex: sandbox_check
  - id: sandbox-entering
    desc: Sandbox entry log message
    conf: 0.85
    platforms:
      - macos
    for:
      - macho
    if:
      type: text
      substr: entering sandbox
      case_insensitive: true
      section: .text
  - id: sandbox-failed
    desc: Sandbox entry failure message
    conf: 0.85
    platforms:
      - macos
    for:
      - macho
    if:
      type: text
      substr: Failed to enter sandbox
      section: .text
  - id: hardened-runtime
    desc: macOS Hardened Runtime enabled
    conf: 0.9
    platforms:
      - macos
    for:
      - macho
    if:
      type: text
      regex: (?i)hardened.{0,4}runtime
      section: .text
  - id: seccomp-init
    desc: Linux seccomp sandbox initialization
    conf: 0.95
    platforms:
      - linux
    for:
      - elf
    if:
      type: symbol
      regex: seccomp_init
  - id: seccomp-rule-add
    desc: Linux seccomp rule addition
    conf: 0.9
    platforms:
      - linux
    for:
      - elf
    if:
      type: symbol
      regex: seccomp_rule_add
  - id: seccomp-load
    desc: Linux seccomp profile loading
    conf: 0.95
    platforms:
      - linux
    for:
      - elf
    if:
      type: symbol
      regex: seccomp_load
  # Resolved direct seccomp(2) syscall instruction (no libc wrapper) — installs
  # a syscall filter without going through libseccomp. Deliberate sandboxing,
  # not a runtime-issued syscall, so no Go downgrade.
  - id: seccomp-syscall
    desc: Installs seccomp filter via direct syscall
    conf: 0.85
    platforms:
      - linux
    for:
      - elf
    if:
      type: syscall
      name: [seccomp]
  # Landlock (Linux 5.13+) is the unprivileged filesystem/network sandbox that
  # newer tooling reaches for instead of seccomp — agent runners, build
  # sandboxes and browsers confine their own children with it. Cuts both ways:
  # `landlock_restrict_self` is also how a payload denies an investigator (or
  # an EDR agent) access to its own files, and it needs no privileges to do so.
  # Matched as text as well as symbols because the syscall is usually reached
  # through a raw `libc::syscall(SYS_landlock_*)` rather than a linked wrapper.
  - id: landlock-create-ruleset
    desc: Creates a Linux Landlock ruleset
    conf: 0.95
    platforms:
      - linux
    for: [elf, rust, c, cpp, go]
    if:
      type: text
      regex: '\b(SYS_)?landlock_create_ruleset\b'
  - id: landlock-add-rule
    desc: Adds a Linux Landlock access rule
    conf: 0.9
    platforms:
      - linux
    for: [elf, rust, c, cpp, go]
    if:
      type: text
      regex: '\b(SYS_)?landlock_add_rule\b'
  - id: landlock-restrict-self
    desc: Confines the process with Landlock
    conf: 0.95
    platforms:
      - linux
    for: [elf, rust, c, cpp, go]
    if:
      type: text
      regex: '\b(SYS_)?landlock_restrict_self\b'

  # The userland front end to the same macOS sandbox the `sandbox_init` atoms
  # above detect: `sandbox-exec -f profile.sb <cmd>` runs a child under a
  # seatbelt profile. Apple deprecated it and it is unavailable to sandboxed
  # apps, so tooling that shells out to it is making a deliberate confinement
  # choice — and profile authoring is equally where a weak `(allow default)`
  # policy shows up.
  #
  # Named for what a bare word match can honestly claim: the tool name appears.
  # It is as likely to be in a doc comment weighing seatbelt against Landlock as
  # on an argv, and "runs a child under sandbox-exec" would be a claim the
  # matcher never checked.
  - id: macos-sandbox-exec-reference
    desc: References the macOS sandbox-exec wrapper
    conf: 0.9
    platforms:
      - macos
    for: [macho, rust, c, cpp, go, scripts]
    if:
      type: text
      word: sandbox-exec

  - id: prctl-seccomp
    desc: Linux prctl seccomp mode
    conf: 0.85
    platforms:
      - linux
    for:
      - elf
    if:
      type: text
      substr: PR_SET_SECCOMP
      section: .text
  - id: seccomp-mode-filter
    desc: Linux seccomp filter mode constant
    conf: 0.85
    platforms:
      - linux
    for:
      - elf
    if:
      type: text
      substr: SECCOMP_MODE_FILTER
      section: .text
  - id: pledge
    desc: OpenBSD pledge syscall restriction
    conf: 0.95
    platforms: [unix]
    for: [elf, c]
    if:
      type: symbol
      exact: pledge
  - id: unveil
    desc: OpenBSD unveil filesystem restriction
    conf: 0.95
    platforms: [unix]
    for: [elf, c]
    if:
      type: symbol
      exact: unveil
  - id: cap-enter
    desc: FreeBSD Capsicum capability mode
    conf: 0.95
    platforms: [unix]
    for: [elf, c]
    if:
      type: symbol
      regex: cap_enter
  - id: cap-rights-limit
    desc: FreeBSD Capsicum rights limiting
    conf: 0.9
    platforms: [unix]
    for: [elf, c]
    if:
      type: symbol
      regex: cap_rights_limit

  # Python wrappers that launch bubblewrap expose a neutral hardening
  # capability.  The flags are specific to the isolation mechanism; intent
  # is supplied by higher-tier composites when additional attack context exists.
  - id: python-bubblewrap-namespace-flag
    desc: Python configures a bubblewrap namespace
    crit: notable
    conf: 0.95
    platforms: [linux]
    for: [python]
    if:
      type: literal
      regex: '^--unshare-[A-Za-z0-9-]+$'

  - id: python-bubblewrap-seccomp-filter
    desc: Python passes a seccomp filter to bubblewrap
    crit: notable
    conf: 0.95
    platforms: [linux]
    for: [python]
    if:
      type: literal
      exact: --seccomp

  - id: python-bubblewrap-capability-drop-flag
    desc: Python uses bubblewrap capability-drop flag
    crit: notable
    conf: 0.95
    platforms: [linux]
    for: [python]
    if:
      type: literal
      exact: --cap-drop
  - id: browser-no-sandbox-flag
    desc: Browser launch disables sandbox
    crit: notable
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [python, javascript, typescript]
    if:
      type: literal
      exact: --no-sandbox
composite_rules:
  - id: macos-sandboxed
    desc: macOS App Sandbox enabled
    crit: notable
    conf: 0.95
    platforms:
      - macos
    for:
      - macho
    any:
      - id: sandbox-init
      - id: sandbox-init-params
      - id: sandbox-extension-consume
      - id: sandbox-extension-issue
      - id: sandbox-entering
      - id: sandbox-failed
  - id: linux-seccomp
    desc: Linux seccomp sandbox enabled
    crit: notable
    conf: 0.95
    platforms:
      - linux
    for:
      - elf
    needs: 2
    any:
      - id: seccomp-init
      - id: seccomp-load
      - id: seccomp-rule-add
      - id: prctl-seccomp
      - id: seccomp-mode-filter
      - id: seccomp-syscall

  # Ruleset construction alone can be a probe; pairing it with the self-restrict
  # call is what proves the process actually confines itself.
  - id: linux-landlock-self-confinement
    desc: Linux Landlock sandbox applied to self
    crit: notable
    conf: 0.95
    platforms:
      - linux
    for: [elf, rust, c, cpp, go]
    all:
      - id: landlock-create-ruleset
      - id: landlock-restrict-self
