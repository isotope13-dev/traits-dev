# Build integrations disable this sandbox to read source maps and git metadata.
# This is a visible security setting change, without implying an exploit.
defaults:
  platforms: [macos]
  for: [javascript, pbxproj]
  crit: notable
  conf: 0.95

traits:
  - id: xcode-script-sandbox-disabled-setting
    desc: Xcode script sandbox disabled setting
    if:
      type: text
      exclude_comments: true
      regex: '\bENABLE_USER_SCRIPT_SANDBOXING\s*=\s*[''\"]{0,2}NO[''\"]{0,2}\s*;'
