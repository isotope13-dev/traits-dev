defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: crypt-unprotect-data-api
    desc: Imports Windows DPAPI unprotect API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: CryptUnprotectData
  - id: crypt-unprotect-data-source-reference
    desc: Windows DPAPI unprotect API reference in source
    crit: notable
    conf: 0.9
    for: [source]
    if:
      type: text
      substr: CryptUnprotectData
  - id: crypt-unprotect-memory-reference
    desc: Windows CryptUnprotectMemory API reference
    crit: notable
    conf: 0.95
    for: [pe, dll, c, cpp, csharp, rust, go, python]
    if:
      type: text
      word: CryptUnprotectMemory
  - id: crypt-protect-memory-reference
    desc: Windows CryptProtectMemory API reference
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, rust, go, python]
    if:
      type: text
      word: CryptProtectMemory
  - id: cryptprotectmemory-same-process-flag
    desc: Same-process memory protection flag
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, rust, go, python]
    if:
      type: text
      word: CRYPTPROTECTMEMORY_SAME_PROCESS
