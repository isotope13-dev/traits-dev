# Resolved CIL call sites distinguish an operation from metadata names or
# an unused MemberRef. DPAPI use alone does not establish credential theft.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99

traits:
  - id: managed-protect-call
    desc: Calls managed DPAPI data encryption
    if:
      type: symbol
      kind: call
      exact: System.Security.Cryptography.ProtectedData.Protect

  - id: managed-unprotect-call
    desc: Calls managed DPAPI data decryption
    if:
      type: symbol
      kind: call
      exact: System.Security.Cryptography.ProtectedData.Unprotect
