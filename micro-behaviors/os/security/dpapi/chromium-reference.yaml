defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dpapi-with-chromium-login-data-reference
    crit: notable
    desc: DPAPI use alongside Chromium Login Data
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      # Bare v10/v11 tokens are not Chromium evidence: Unicode property tables
      # use them as Age aliases, among many other legitimate version schemes.
      # Require the distinctive Chromium password database name instead.
      - id: micro-behaviors/fs/path/password-store::login-data
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/app/security/bitwarden::bitwarden-app
      - id: well-known/app/browser/
      # Chromium decrypts its own Login Data with DPAPI. The engine binary
      # is that implementation, not a stealer reading someone else's store.
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
