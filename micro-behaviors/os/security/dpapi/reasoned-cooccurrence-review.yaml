# References and API co-occurrence do not establish bound data flow.
composite_rules:
- platforms:
  - windows
  id: credential-path-unprotect-api-cooccurrence
  desc: Roaming credential path beside DPAPI decryption API
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
  - id: micro-behaviors/fs/path/password-store::windows-roaming-credentials-path
  unless:
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-windows-package-context
  - id: well-known/app/storage/syncback/
