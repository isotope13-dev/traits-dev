defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  # A Node DPAPI binding decrypting a blob for the current user. Apps use it
  # to keep their own secrets at rest; browser-credential theft is inferred
  # only where a composite pairs it with Chromium profile data.
  - id: node-dpapi-unprotect-data-call
    desc: Node calls DPAPI unprotectData
    attack: T1555
    if:
      type: symbol
      kind: call
      regex: '(^|\.)unprotectData$'
  # Obfuscators split the method name across computed-property fragments, so
  # the parser does not report the call under its resolved symbol name.
  - id: node-dpapi-obfuscated-unprotect-data-call
    desc: Node calls obfuscated DPAPI unprotectData
    attack: T1555
    if:
      type: text
      regex: '\w+\s*\[\s*[''"]unprot[''"]\s*\+\s*[''"]ectDat[''"]\s*\+\s*[''"]a[''"]\s*\]\s*\('
  - id: powershell-unprotect-template-literal
    desc: PowerShell DPAPI Unprotect source literal
    if:
      type: literal
      kind: string
      regex: '\[System\.Security\.Cryptography\.ProtectedData\]\s*::\s*Unprotect\s*\('
