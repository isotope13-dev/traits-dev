defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: powershell-unprotect-template-literal
    desc: PowerShell DPAPI Unprotect source literal
    if:
      type: literal
      kind: string
      regex: '\[System\.Security\.Cryptography\.ProtectedData\]\s*::\s*Unprotect\s*\('
