composite_rules:
  - id: dpapi-registry-process-download-api-set
    desc: DPAPI, registry, process, and HTTP receive APIs
    crit: notable
    platforms: [windows]
    for: [pe, dll]
    conf: 0.92
    all:
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/os/registry/access::reg-open-key-ex-w-symbol
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    any:
      - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
    unless:
      - id: metadata/binary/vendor/
      - id: metadata/signed/unknown::brave-software
