defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: windows-dpapi-encoded-script-reference
    desc: Encoded DPAPI script reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'WINDOWS_DPAPI_SCRIPT[\s\S]{0,250}-EncodedCommand'
