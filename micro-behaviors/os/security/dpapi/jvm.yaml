# Windows DPAPI reached from the JVM through JNA's Crypt32Util. The JNA
# platform class name and its `cryptUnprotectData` method are what a class
# file keeps of the call. Previously claimed as carLambo strings
# (well-known/malware/rat/carlambo::carlambo-dpapi-crypt32 / -detail), which
# attributed every JNA DPAPI caller to that family.
defaults:
  crit: notable
  platforms: [windows]
  for: [class, java_class]
  attack: T1555
traits:
  - id: jna-crypt32util-class
    desc: JVM references JNA Crypt32Util (DPAPI)
    conf: 0.95
    if:
      type: text
      substr: com/sun/jna/platform/win32/Crypt32Util
  - id: jvm-crypt-unprotect-data-name
    desc: JVM class names cryptUnprotectData
    conf: 0.95
    if:
      type: text
      substr: cryptUnprotectData
