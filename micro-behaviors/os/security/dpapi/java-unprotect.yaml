defaults:
  platforms: [windows]
  crit: notable
traits:
  - id: java-crypt32-unprotect-call
    desc: Java calls DPAPI data decryption
    for: [java]
    if:
      type: text
      regex: '\bCrypt32Util\.cryptUnprotectData\s*\('
      exclude_comments: true
composite_rules:
  - id: jvm-crypt32-unprotect-reference
    desc: JVM references DPAPI data decryption
    for: [class]
    all:
      - id: jna-crypt32util-class
      - id: jvm-crypt-unprotect-data-name
  - id: java-dpapi-unprotect
    desc: Java DPAPI data decryption interface
    for: [java, class]
    any:
      - id: java-crypt32-unprotect-call
      - id: jvm-crypt32-unprotect-reference
