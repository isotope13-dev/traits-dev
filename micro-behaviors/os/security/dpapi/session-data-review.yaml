composite_rules:
- platforms:
  - windows
  for:
  - python
  id: python-chromium-key-unprotect
  desc: Chromium key metadata with DPAPI decryption
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/application/browser::local-state
  - id: micro-behaviors/data/config/schema::encrypted-key-field-reference
  - id: micro-behaviors/os/security/dpapi::python-dpapi-unprotect
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-source-context
  - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-archive-context
  - id: well-known/tool/media/yt-dlp/
  - id: well-known/lib/development/browser-cookie3/
  - id: well-known/app/finance/emoney-mcp::session-reuse-context
