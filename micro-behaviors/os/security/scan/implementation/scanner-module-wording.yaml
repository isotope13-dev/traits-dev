---
defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  crit: component
  conf: 0.99
  size_max: 5000000
traits:
- id: malware-signature-module
  crit: notable
  desc: Language-agnostic malware signatures wording
  if:
    type: text
    substr: Language-agnostic malware signatures
- id: malware-detector-module
  crit: notable
  desc: Shell malware detectors wording
  if:
    type: text
    substr: Shell malware detectors
- id: secret-signature-catalog
  crit: notable
  desc: Committed-secret signature catalog wording
  if:
    type: text
    substr: comprehensive catalog of committed-secret signatures
- id: malware-sweep-bases
  crit: notable
  desc: Malware string-sweep rule bases wording
  if:
    type: text
    substr: Shared malware string-sweep rule bases
- id: string-literal-sweep
  crit: notable
  desc: Cross-language string-literal sweeps wording
  if:
    type: text
    substr: Cross-language string-literal sweeps
- id: typescript-malware-detector
  crit: notable
  desc: TypeScript malware detectors wording
  if:
    type: text
    substr: TypeScript/JavaScript malware detectors
- id: network-security-detector
  crit: notable
  desc: Network security detectors wording
  if:
    type: text
    substr: Transport & network security detectors
- id: injection-security-detector
  crit: notable
  desc: Injection security detectors wording
  if:
    type: text
    substr: Injection & code-execution security detectors
- id: config-category-detector
  crit: notable
  desc: Config-category detectors wording
  if:
    type: text
    substr: 'Config-category detectors: ad-hoc env reads'
- id: config-file-auditor
  crit: notable
  desc: Config-file detectors wording
  if:
    type: text
    substr: runs the config-file detectors over data files
- id: orchestration-detector
  crit: notable
  desc: Orchestration-layer detectors wording
  if:
    type: text
    substr: Orchestration-layer detectors
