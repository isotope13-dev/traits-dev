defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000

composite_rules:
- id: evidence-collector-artifacts
  desc: Defensive evidence collector artifacts
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/source/naming/security::evidence-collector-artifacts--signal-overrides
  - id: metadata/lang/source/naming/security::evidence-collector-artifacts--precondition-checks
  - id: metadata/lang/source/naming/security::evidence-collector-artifacts--collector-meta
  - id: metadata/lang/source/naming/security::evidence-collector-artifacts--collector-errors
- id: security-playbook-artifacts
  desc: Security playbook artifact catalog
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/security::security-playbook-artifacts--playbook-id
  - id: metadata/lang/source/naming/security::security-playbook-artifacts--false-positive-checks-required
- id: security-scanner-or-collector-clues
  desc: Security scanner or evidence collector clues
  crit: notable
  conf: 0.96
  any:
  - id: micro-behaviors/os/security/scan/web::defensive-wordpress-scanner
  - id: micro-behaviors/os/security/scan/evidence::defensive-evidence-collector-artifacts
- id: defensive-evidence-collector-artifacts
  desc: Defensive evidence collector artifacts and captured fields
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/security/scan/evidence::evidence-collector-artifacts
  any:
  - id: metadata/lang/source/naming/security::evidence-collector-captured-fields
  - id: micro-behaviors/os/security/scan/evidence::security-playbook-artifacts
  - id: metadata/lang/natural/vocabulary/security::companion-collector-doc
