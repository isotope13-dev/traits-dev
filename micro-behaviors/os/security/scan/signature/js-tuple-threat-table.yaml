# Positional tuple threat-pattern tables (e.g. `rule(pattern, id, 'critical',
# 'exfiltration', ...)`) compile regexes into typed threat entries. Attack
# prose does not construct a RegExp rule builder alongside severity/category
# tuples.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-threat-critical-tuple-arg
    desc: Threat table tuple with critical severity
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]critical[''"],\s*[''"][a-z_]{4,24}[''"]'

  - id: js-threat-high-tuple-arg
    desc: Threat table tuple with high severity
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]high[''"],\s*[''"][a-z_]{4,24}[''"]'

  - id: js-threat-medium-tuple-arg
    desc: Threat table tuple with medium severity
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]medium[''"],\s*[''"][a-z_]{4,24}[''"]'

  - id: js-threat-low-tuple-arg
    desc: Threat table tuple with low severity
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]low[''"],\s*[''"][a-z_]{4,24}[''"]'

  - id: js-threat-exfiltration-tuple-arg
    desc: Threat table exfiltration category literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]exfiltration[''"]'

  - id: js-threat-injection-tuple-arg
    desc: Threat table injection category literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]injection[''"]'

  - id: js-threat-persistence-tuple-arg
    desc: Threat table persistence category literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]persistence[''"]'

  - id: js-threat-supply-chain-tuple-arg
    desc: Threat table supply_chain category literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '[''"]supply_chain[''"]'

  - id: js-regexp-constructor-call
    desc: Constructs dynamic RegExp instance
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: RegExp

composite_rules:
  - id: js-threat-severity-tuple-arg
    desc: Multiple severity arguments in JS threat table
    crit: notable
    conf: 0.92
    any:
      - id: js-threat-critical-tuple-arg
      - id: js-threat-high-tuple-arg
      - id: js-threat-medium-tuple-arg
      - id: js-threat-low-tuple-arg
    needs: 2

  - id: js-threat-category-tuple-arg
    desc: Multiple category arguments in JS threat table
    crit: notable
    conf: 0.92
    any:
      - id: js-threat-exfiltration-tuple-arg
      - id: js-threat-injection-tuple-arg
      - id: js-threat-persistence-tuple-arg
      - id: js-threat-supply-chain-tuple-arg
    needs: 2

  - id: js-threat-severity-category-tuple
    desc: Tuple entries pair threat severities and categories
    crit: notable
    conf: 0.93
    all:
      - id: js-threat-severity-tuple-arg
      - id: js-threat-category-tuple-arg

  - id: js-tuple-threat-pattern-table
    desc: Positional tuple threat-pattern table with RegExp builder
    crit: exception
    conf: 0.94
    all:
      - id: js-threat-severity-category-tuple
      - id: js-regexp-constructor-call
