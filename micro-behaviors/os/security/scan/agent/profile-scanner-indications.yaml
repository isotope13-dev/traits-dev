---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - rust
  - pkginfo
  - package.json
  - documents
  crit: notable
  conf: 0.93
  size_max: 5000000
traits:
- id: skill-vetting-pattern-scanner
  desc: SkillScanner class with pattern field
  for:
  - python
  conf: 0.97
  if:
    type: text
    regex: class\s+SkillScanner[\s\S]{0,400}\bPATTERNS\s*=
- id: agent-skill-static-scanner
  desc: Agent skill scanner or injection pattern name
  for:
  - python
  conf: 0.97
  if:
    type: text
    regex: Static analysis scanner for agent skills|PROMPT_INJECTION_PATTERNS\s*[:=]
- id: agent-skill-threat-analysis-prompt
  desc: Agent skill threat-analysis LLM prompt heading
  for:
  - markdown
  - documents
  conf: 0.95
  if:
    type: text
    regex: "(?m)^# Agent Skill (Behavioral Alignment |Threat |Security Meta-)Analysis\\b"
- id: ai-skill-scanner-report-doc
  desc: Skill scanner or security finding name
  conf: 0.94
  if:
    type: text
    regex: Cisco AI Defense Skill Scanner|LLM_PROMPT_INJECTION|BEHAVIOR_ENV_VAR_EXFILTRATION
    case_insensitive: true
