defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: skill-scanner-default-permission-catalog
    desc: Skill scanner seeds permission classifications
    if:
      type: yara
      source: |
        rule skill_scanner_default_permission_catalog {
          strings:
            $description = "Default permissions and policies for the Skill Scanner Policy Engine" nocase
            $classification = "classification:" nocase
            $seed = "seeded into the database" nocase
          condition:
            all of them
        }
