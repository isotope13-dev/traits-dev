defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.95
traits:
  - id: network-provider-logon-callback-definition
    desc: Defines the network provider logon callback
    if:
      type: symbol
      kind: function
      exact: NPLogonNotify
  - id: interactive-logon-password-field-read
    desc: Reads MSV1_0 interactive logon password
    if:
      type: tree-sitter
      query: |
        ((field_expression) @read
          (#match? @read "MSV1_0_INTERACTIVE_LOGON")
          (#match? @read "Password$"))
