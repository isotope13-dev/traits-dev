# Two more documented Windows interfaces that put a third-party DLL on the
# interactive-logon path.
#
# An MSV1_0 subauthentication package is called by the NTLM authentication
# package to make the final allow/deny decision, and a network provider is
# handed the account name and the cleartext password through NPLogonNotify
# every time a user logs on. Both are legitimate extension points -- smart-card
# middleware registers a subauthentication package, VPN and network clients
# register a provider -- so both stay neutral capabilities here. What is not
# ordinary is one binary claiming several of these roles at once; that
# inference lives in objectives/credential-access/theft/auth-provider/.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96
  attack: T1556.002

traits:
  - id: msv1-0-subauthentication-routine
    desc: MSV1_0 subauthentication package entry point
    if:
      type: symbol
      kind: export
      exact: Msv1_0SubAuthenticationRoutine

  - id: network-provider-logon-notify
    desc: Network provider logon notification export
    if:
      type: symbol
      kind: export
      exact: NPLogonNotify
