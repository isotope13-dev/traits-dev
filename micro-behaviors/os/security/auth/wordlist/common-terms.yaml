defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
traits:
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-set-numeric
  desc: Adjacent numeric weak password tokens
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b123456789?\b.{0,40}\b111111\b|\b111111\b.{0,40}\b123456789?\b
  unless:
  - type: raw
    regex: 1234567890[\-=\s\t]{0,8}qwerty
  - type: raw
    regex: '00000000001111111111222201234567890'
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-master
  desc: Master-password dictionary token
  crit: component
  conf: 0.4
  if:
    type: text
    regex: (?i)(--)?\bmaster[ _-]?(password|passphrase)\b
  not:
  - regex: ^--
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-monkey
  desc: Weak-password token monkey
  crit: component
  conf: 0.4
  if:
    type: text
    substr: monkey
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-dragon
  desc: Weak-password token dragon
  crit: component
  conf: 0.4
  if:
    type: literal
    kind: string
    exact: dragon
    case_insensitive: true
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-qwerty
  desc: Weak-password token qwerty
  crit: component
  conf: 0.6
  if:
    type: text
    substr: qwerty
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-abc123
  desc: Weak-password token abc123
  crit: component
  conf: 0.85
  if:
    type: text
    substr: abc123
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-letmein
  desc: Weak-password token letmein
  crit: component
  conf: 0.85
  if:
    type: text
    substr: letmein
- id: micro-behaviors/os/security/auth/wordlist::service-account-mysql
  desc: Possible MySQL service-account name token
  crit: component
  conf: 0.85
  if:
    type: text
    regex: (?i)\bmysql\b[ \t]*,
- id: micro-behaviors/os/security/auth/wordlist::service-account-oracle
  for:
  - scripts
  desc: Possible Oracle service-account name token
  crit: component
  conf: 0.85
  if:
    type: literal
    kind: string
    exact: oracle
    case_insensitive: true
- id: micro-behaviors/os/security/auth/wordlist::service-account-postgres
  for:
  - scripts
  desc: Possible PostgreSQL service-account name token
  crit: component
  conf: 0.85
  if:
    type: literal
    kind: string
    exact: postgres
    case_insensitive: true
- id: micro-behaviors/os/security/auth/wordlist::service-account-tomcat
  for:
  - scripts
  desc: Possible Tomcat service-account name token
  crit: component
  conf: 0.85
  if:
    type: literal
    kind: string
    exact: tomcat
    case_insensitive: true
- id: micro-behaviors/os/security/auth/wordlist::service-account-redis
  for:
  - scripts
  desc: Possible Redis service-account name token
  crit: component
  conf: 0.85
  unless:
  - id: micro-behaviors/data/db/redis::python-redis-import
  if:
    type: literal
    kind: string
    exact: redis
    case_insensitive: true
- id: micro-behaviors/os/security/auth/wordlist::service-account-ubuntu
  for:
  - scripts
  desc: Possible Ubuntu service-account name token
  crit: component
  conf: 0.85
  if:
    type: literal
    kind: string
    exact: ubuntu
    case_insensitive: true
composite_rules:
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-set-words
  desc: Nearby common-password terms
  crit: notable
  conf: 0.92
  near_bytes: 160
  needs: 3
  any:
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-master
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-monkey
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-dragon
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-qwerty
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-abc123
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-letmein
- id: micro-behaviors/os/security/auth/wordlist::weak-pass-set-services
  desc: Nearby database and service names
  crit: component
  conf: 0.9
  near_bytes: 120
  needs: 3
  any:
  - id: micro-behaviors/os/security/auth/wordlist::service-account-mysql
  - id: micro-behaviors/os/security/auth/wordlist::service-account-oracle
  - id: micro-behaviors/os/security/auth/wordlist::service-account-postgres
  - id: micro-behaviors/os/security/auth/wordlist::service-account-tomcat
  - id: micro-behaviors/os/security/auth/wordlist::service-account-redis
  - id: micro-behaviors/os/security/auth/wordlist::service-account-ubuntu
  - id: micro-behaviors/os/application/target/server::postgres-name-reference
  - id: micro-behaviors/os/service/daemon::redis-name-reference
  - id: well-known/lib/web/server/tomcat::tomcat-name
- id: micro-behaviors/os/security/auth/wordlist::common-password-account-terms
  desc: Common password and account terms
  crit: notable
  conf: 0.95
  needs: 2
  any:
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-set-numeric
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-set-words
  - id: micro-behaviors/os/security/auth/wordlist::weak-pass-set-services
