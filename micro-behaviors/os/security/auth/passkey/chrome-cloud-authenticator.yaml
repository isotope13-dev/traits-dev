# Identifiers of Chrome's cloud (Google Password Manager) passkey authenticator
# records and key material.
#
# These are the exact serialization/field names Chrome uses for its synced
# WebAuthn credentials and the keys that protect them. Reading or naming them is
# a neutral capability shared by the browser and by anything that inspects the
# synced-passkey store, so they are notable atoms; the objective composites under
# objectives/credential-access/browser/passkey/ combine them with a theft
# mechanic (CNG key reuse, process-memory scraping, re-enroll triggering).
#
# Source: Chromium (enclave_local_state.proto / enclave_manager.cc) and Unit 42,
# "The Risks of Passwordless Authentication", 2026-08.
defaults:
  platforms: [windows, unix]
  # Keep the text matcher broad across native and script implementations while
  # staying below the validator's per-matcher type cap.
  for: [binaries, scripts, c, cpp, rust, go, csharp]
  crit: notable
  conf: 0.85

traits:
  # The proto record type Chrome persists for each synced passkey; enumerating
  # these reveals every relying party, username and credential id the victim uses.
  - id: webauthn-credential-specifics-record
    desc: Chrome WebauthnCredentialSpecifics record
    conf: 0.9
    if:
      type: text
      word: WebauthnCredentialSpecifics

  # The TPM-wrapped device identity private key stored in the enclave state.
  # Re-importing this blob lets code sign as the device without user verification.
  - id: wrapped-identity-private-key-field
    desc: Chrome wrapped identity private key field
    conf: 0.9
    if:
      type: text
      word: wrapped_identity_private_key

  # The 32-byte Security Domain Secret (SDS) that decrypts every synced passkey.
  # Distinctive name; the generic wrapped_secret field is a component below.
  - id: security-domain-secret-field
    desc: Chrome security domain secret (SDS)
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsecurity[_-]domain[_-]secret\b|\bSecurityDomainSecret\b'

  # The encrypted master-key blob each device stores; only meaningful paired with
  # the passkey record/enclave context, so a component.
  - id: wrapped-secret-field
    desc: Chrome wrapped secret field
    crit: component
    conf: 0.85
    if:
      type: text
      word: wrapped_secret

  # Chrome's FIDO device-log surface — where Unit 42 found the SDS exposed in
  # plaintext. Code that reaches for this log is inspecting authenticator internals.
  - id: chrome-fido-device-log-surface
    desc: Chrome FIDO device-log surface
    conf: 0.88
    if:
      type: text
      regex: '(?i)(chrome://)?device-log/FIDO'

  # Cloud-authenticator protocol operations used to invalidate enrollment or
  # register a replacement user-verification key during the pending window.
  - id: device-forget-command
    desc: Cloud authenticator device-forget command
    conf: 0.92
    if:
      type: text
      substr: device/forget

  - id: device-add-uv-key-command
    desc: Cloud authenticator UV-key registration command
    conf: 0.94
    if:
      type: text
      substr: device/add_uv_key

  - id: uv-key-pending-state
    desc: Cloud authenticator pending UV-key state
    conf: 0.94
    if:
      type: text
      word: uv_key_pending

  - id: uv-public-key-field
    desc: Cloud authenticator UV public-key field
    conf: 0.9
    if:
      type: text
      word: uv_public_key

  - id: identity-public-key-field
    desc: Cloud authenticator identity public-key field
    conf: 0.86
    if:
      type: text
      word: identity_public_key

  - id: keys-wrap-command
    desc: Cloud authenticator key-wrap command
    conf: 0.9
    if:
      type: text
      substr: keys/wrap
