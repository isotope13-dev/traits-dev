# Generic WebAuthn assertion structure. These are protocol observations, not
# browser-family identifiers; the Windows Hello objective pairs them with CNG
# key use and Microsoft identity-provider context.
defaults:
  platforms: [windows, unix]
  for: [powershell, csharp, cpp, python, go, rust, pe, dll]

traits:
  - id: webauthn-get-operation
    desc: Constructs WebAuthn get operation
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: webauthn.get

  - id: webauthn-assertion-response-fields
    desc: Constructs WebAuthn assertion response
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bclientDataJSON\b[\s\S]{0,800}\bauthenticatorData\b[\s\S]{0,800}\bsignature\b'
