# Generic WebAuthn assertion structure. These are protocol observations, not
# browser-family identifiers; the Windows Hello objective pairs them with CNG
# key use and Microsoft identity-provider context.
defaults:
  platforms: [windows, unix]
  for: [powershell, csharp, cpp, python, go, rust, pe, dll]

  # Windows-specific atoms below identify the OS WebAuthn boundary and its
  # diagnostic event surface. They are capabilities; credential theft intent
  # is inferred by the composites under objectives/credential-access/browser.
  #
  # Hooking mechanics (Detours, MinHook, IAT patching) are NOT WebAuthn facts
  # and live in micro-behaviors/process/hook/interception/; the objectives
  # reference them from there.

traits:
  - id: webauthn-get-operation
    desc: Constructs WebAuthn get operation
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: webauthn.get

  # The three fields of a PublicKeyCredential assertion response, close enough
  # together to be one structure: whoever names all three is building, parsing,
  # or relaying a complete replayable assertion.
  - id: webauthn-assertion-response-fields
    desc: Names the WebAuthn assertion response fields
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bclientDataJSON\b[\s\S]{0,800}\bauthenticatorData\b[\s\S]{0,800}\bsignature\b'

  - id: windows-webauthn-get-assertion-call
    desc: Calls the Windows WebAuthn assertion API
    crit: notable
    conf: 0.96
    platforms: [windows]
    if:
      type: symbol
      kind: call
      exact: WebAuthNAuthenticatorGetAssertion

  - id: windows-webauthn-get-assertion-reference
    desc: References the Windows WebAuthn assertion API
    crit: notable
    conf: 0.94
    platforms: [windows]
    if:
      type: text
      word: WebAuthNAuthenticatorGetAssertion

  - id: windows-webauthn-library
    desc: References the Windows WebAuthn library
    crit: notable
    conf: 0.92
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\bwebauthn\.dll\b'

  - id: windows-webauthn-event-channel
    desc: References the Windows WebAuthn event channel
    crit: notable
    conf: 0.96
    platforms: [windows]
    if:
      type: text
      substr: Microsoft-Windows-WebAuthN/Operational

  - id: windows-webauthn-event-assertion-field
    desc: References WebAuthn assertion event field
    crit: notable
    conf: 0.95
    platforms: [windows]
    if:
      type: text
      word: authenticationResponseJSON

  - id: windows-webauthn-event-2106
    desc: References Windows WebAuthn response event
    crit: notable
    conf: 0.92
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(EventID\s*[=:>]\s*2106|<EventID>\s*2106\s*</EventID>)'

  - id: windows-webauthn-event-query-call
    desc: Queries a Windows event log result set
    crit: notable
    conf: 0.88
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '^(Get-WinEvent|EvtQuery|EvtNext)$'

  - id: windows-webauthn-event-query-reference
    desc: References a Windows event log query API
    crit: notable
    conf: 0.82
    platforms: [windows]
    if:
      type: text
      regex: '\b(EvtQuery|EvtNext)\b'

composite_rules:
  - id: windows-webauthn-event-query
    desc: Queries the Windows WebAuthn operational event log
    crit: notable
    conf: 0.97
    platforms: [windows]
    all:
      - id: windows-webauthn-event-channel
    any:
      - id: windows-webauthn-event-query-call
      - id: windows-webauthn-event-query-reference

  - id: windows-webauthn-assertion-api
    desc: Uses the Windows WebAuthn assertion API
    crit: notable
    conf: 0.97
    platforms: [windows]
    any:
      - id: windows-webauthn-get-assertion-call
      - id: windows-webauthn-get-assertion-reference
