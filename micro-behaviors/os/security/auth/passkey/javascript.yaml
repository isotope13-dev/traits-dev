# Browser-side WebAuthn surface. Sites read PublicKeyCredential's static
# capability checks to decide whether to offer a passkey; scripts that
# replace them change what the site believes the device can do. Passkey
# managers (Bitwarden, LastPass, Keeper) replace them too, but only alongside
# their own navigator.credentials implementation.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: webauthn-capability-check-override
    desc: Replaces a PublicKeyCredential capability check
    conf: 0.92
    if:
      type: text
      # `X.isUserVerifyingPlatformAuthenticatorAvailable = ...` and friends;
      # [^=>] rejects comparisons and arrow-function parameters.
      regex: '\.is(UserVerifyingPlatformAuthenticator|ConditionalMediation)Available\s*=[^=>]'

  - id: webauthn-client-capabilities-override
    desc: Replaces WebAuthn getClientCapabilities
    conf: 0.92
    if:
      type: text
      regex: '\.getClientCapabilities\s*=[^=>]'

  - id: navigator-credentials-reference
    desc: References the navigator.credentials API
    # Notable: a credentials-API reference is an analyst-visible auth
    # capability, and a baseline finding is stripped before composite
    # unless: on large files, which lets a virtual authenticator that
    # implements navigator.credentials.create/get still read as a spoof.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bnavigator\.credentials\b'


  # chrome.webAuthenticationProxy lets one extension answer every site's
  # navigator.credentials.create() call. Chrome built it for remote-desktop
  # clients that forward the request to another machine.
  - id: webauthn-proxy-create-request-listener
    desc: Proxies WebAuthn credential creation requests
    conf: 0.95
    if:
      type: text
      regex: '\bwebAuthenticationProxy\s*\.\s*onCreateRequest\s*\.\s*addListener\s*\('
