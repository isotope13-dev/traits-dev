defaults:
  platforms: [unix, windows]
  for: [rust, python, javascript, typescript]
traits:
  - id: cargo-credential-source-read
    desc: Reads Cargo registry credentials
    crit: notable
    conf: 0.94
    if:
      type: value
      path: source.payload_flow.events[*].kind
      exact: cargo-credential-read
    unless:
      - id: micro-behaviors/data/control-flow/branch::cargo-credential-read-false-branch
