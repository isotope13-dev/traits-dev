defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
composite_rules:
  - id: micro-behaviors/os/security/auth/secret::developer-credential-source-context
    desc: Developer credential source references or reads
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
      - id: micro-behaviors/os/env/secret-name::developer-credential-environment-references
      - id: micro-behaviors/os/security/auth/secret::cargo-credential-source-read

