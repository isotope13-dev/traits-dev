defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: powershell-password-record-format
  desc: PowerShell formats saved-login secret records
  if:
    type: text
    regex: (?i)Format-List\s+URL,\s*UserName,\s*Password
- id: powershell-saved-login-call
  desc: PowerShell invokes saved-login retrieval
  if:
    type: text
    regex: (?i)\.GetSavedLogins\s*\(
