# Appliance-native CLI, independent of the language carrying the command.
defaults:
  platforms: [linux]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: beyondtrust-vault-get
    desc: BeyondTrust CLI retrieves credential vault
    if:
      type: text
      regex: '\bbt-secrets["'']?\s+get\b[^\n;|]{0,80}\bvault\b'
