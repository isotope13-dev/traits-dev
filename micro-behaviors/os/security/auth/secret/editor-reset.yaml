defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: editor-credential-reset-command
    desc: Requests editor credential reset by command
    crit: notable
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(^|\.)executeCommand$'
      arg:
        index: 0
        kind: string
        regex: '(?i)(remove|clear|reset).{0,24}(api.?key|credentials?|auth.?tokens?)'
