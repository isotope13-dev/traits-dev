defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]
  attack: T1555,T1041

traits:
  - id: native-credential-snapshot-language
    desc: Credential or password snapshot/export phrase
    # Sensitive-data wording alone is a fragment, not proof of collection.
    # The stealer/credential tunnel composite supplies transfer context.
    crit: notable
    conf: 0.97
    attack: T1555
    if:
      type: text
      regex: '(?i)\b(credential|password)\b[\s:_-]{1,16}\b(snapshot|export)\b'
    unless:
      - id: well-known/app/browser/microsoft-edge::microsoft-edge-package-context
  - id: native-token-capture-language
    desc: Token or secret capture/dump phrase
    crit: notable
    conf: 0.97
    attack: T1555
    if:
      type: text
      regex: '(?i)\b(token|secret)\b[\s:_-]{1,16}\b(capture|dump)\b'
    unless:
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
