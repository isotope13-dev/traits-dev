defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho, java, markdown, text, json]

traits:
  - id: github-fine-grained-pat
    desc: GitHub fine-grained token-shaped value
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bgithub_pat_[A-Za-z0-9]{22}_[A-Za-z0-9_]{59}\b'
    not:
      # Exclude sequential alphanumeric placeholder values while retaining
      # other values with the fine-grained token format.
      - regex: 'github_pat_[A-Za-z0-9_]*(0123456789|1234567890|ABCDEFGHIJ|abcdefghij|([0-9][A-Z]){8,})'
    unless:
      - id: well-known/tool/detection/titus::titus-defensive-secret-scanner-context
      - id: well-known/tool/detection/kingfisher::kingfisher-defensive-secret-scanner-context
      - id: metadata/lang/source/naming/resource::builtin-patterns-token
      - id: metadata/path/directory::test-directory-component

  - id: github-classic-token
    desc: GitHub classic token-shaped value
    for: [javascript]
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\bghp_[A-Za-z0-9]{36,251}\b'
    ref: https://github.blog/engineering/behind-githubs-new-authentication-token-formats/
    # Filter matched placeholders, not other token evidence in the file.
    not:
      - regex: 'ghp_[A-Za-z0-9]*(ABCDEFGHIJ|abcdefghij|[xX]{20,})'
      - regex: '^ghp_(0123456789){3,}[0-9]*$'
      - regex: '^ghp_(1234567890){3,}[0-9]{0,9}$'
      - regex: '^ghp_(1234567890abcdef){2}1234$'
      - regex: '^ghp_0{36,251}$'
      - regex: '^ghp_(FAKE){9,62}$'
      - regex: '^ghp_[aA]{36,251}$'
      - regex: '^ghp_fixture[A-Za-z0-9]{29,244}$'
      - regex: '^ghp_ABC123XYZ789abc012def345ghi678jkl901mno234$'
      - regex: '^ghp_([A-Z][a-z]){10,}[A-Za-z0-9]*$'
      - regex: '^ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ[A-Za-z0-9]*$'
    unless:
      - id: metadata/package/testing/corpus/security-tests::github-token-url-regression-test
      - id: metadata/file/catalog/pattern-rules::js-security-rule-catalog-context
