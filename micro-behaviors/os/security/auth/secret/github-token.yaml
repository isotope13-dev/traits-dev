defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho, java, markdown, text, json]

traits:
  - id: github-fine-grained-pat
    desc: Embedded GitHub fine-grained token pattern
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bgithub_pat_[A-Za-z0-9]{22}_[A-Za-z0-9_]{59}\b'
    unless:
      - id: well-known/tool/detection/security-scanner::titus-defensive-secret-scanner-context
      - id: well-known/tool/detection/sast::python-secret-rule-catalog
      - id: metadata/package/testing/
