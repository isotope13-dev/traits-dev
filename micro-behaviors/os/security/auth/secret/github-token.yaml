defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho, java, markdown, text, json]

traits:
  - id: github-fine-grained-pat
    desc: GitHub fine-grained token-shaped value
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bgithub_pat_[A-Za-z0-9]{22}_[A-Za-z0-9_]{59}\b'
    unless:
      # Exclude the conventional sequential API-example placeholder, while
      # retaining other values with the token format.
      - type: text
        regex: 'github_pat_([0-9][A-Z]){11}_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456'
      - id: well-known/tool/detection/titus::titus-defensive-secret-scanner-context
      - id: well-known/tool/detection/kingfisher::kingfisher-defensive-secret-scanner-context
      - id: metadata/lang/source/naming/resource::builtin-patterns-token
      - id: metadata/path/directory::test-directory-component
