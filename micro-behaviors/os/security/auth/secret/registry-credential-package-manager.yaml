defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
composite_rules:
# Writing ~/.gem/credentials with an API key (publishing or CI provisioning)
# matches the same legs as a read-and-send stealer. Without a read or upload
# leg this is a notable credential placement, not theft.
- id: gem-credential-theft-comp
  desc: RubyGems credential and key references
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/credential/registry::gem-credentials-file
  any:
  - id: micro-behaviors/data/serialize/schema-credential::rubygems-api-key-name
  - id: metadata/lang/source/literal/fragment/env-variable::gem-host-api-key-var
  unless:
  - id: metadata/build/ci/github-actions::workflow-definition-path
