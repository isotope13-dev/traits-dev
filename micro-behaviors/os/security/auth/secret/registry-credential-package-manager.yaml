defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
composite_rules:
- id: gem-credential-theft-comp
  desc: RubyGems credential and key references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/secret-config::gem-credentials-file
  any:
  - id: micro-behaviors/data/serialize/schema-credential::rubygems-api-key-name
  - id: metadata/lang/source/literal/fragment/env-variable::gem-host-api-key-var
  unless:
  - id: metadata/build/ci/github-actions::workflow-definition-path
