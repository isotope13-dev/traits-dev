defaults:
  crit: notable
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf
traits:
- id: native-password-like-identifier
  desc: Password-like identifier string in native code
  conf: 0.82
  if:
    type: raw
    regex: \b[A-Z][A-Z0-9_]*_(PASSWORD|PASSWD|PASS)\b
  not:
  - regex: ^(G|GL|SOUP|NICE|SSL|TLS|GLIB|GIO|CURL[A-Z]*)_[A-Z0-9_]+$
  - substr: SORTPP_PASS
  - regex: ^(?:[A-Z][A-Z0-9]*_)?MIDL_PASS$
  - regex: ^E(RROR|RR)_
  - regex: _ERROR_
  - regex: _(INVALID|MISSING|WRONG|WEAK)_
- id: native-secret-like-identifier
  desc: Secret-key-like identifier string in native code
  conf: 0.82
  if:
    type: raw
    regex: \b[A-Z][A-Z0-9_]*_(SECRET_KEY|ACCESS_KEY|CLIENT_SECRET)\b
  not:
  - regex: ^(G|GL|SOUP|NICE|SSL|TLS|GLIB|GIO)_[A-Z0-9_]+$
  - regex: ^SORTPP_PASS$
  - regex: ^E(RROR|RR)_
  - regex: _ERROR_
  - regex: _(INVALID|MISSING|WRONG|WEAK)_
- id: native-api-key-like-identifier
  desc: API-key-like identifier string in native code
  conf: 0.82
  if:
    type: raw
    regex: \b[A-Z][A-Z0-9_]*_API_KEY\b
  not:
  - regex: ^(G|GL|SOUP|NICE|SSL|TLS|GLIB|GIO)_[A-Z0-9_]+$
  - regex: ^SORTPP_PASS$
  - regex: ^E(RROR|RR)_
  - regex: _ERROR_
  - regex: _(INVALID|MISSING|WRONG|WEAK)_
composite_rules:
- id: native-credential-like-identifiers
  desc: Multiple credential-like identifier strings in native code
  conf: 0.9
  any:
  - id: native-password-like-identifier
  - id: micro-behaviors/os/env/secret-name::native-token-env-read
  - id: native-secret-like-identifier
  - id: native-api-key-like-identifier
  needs: 3
