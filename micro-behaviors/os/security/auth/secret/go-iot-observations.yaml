defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-credential-extraction-call
    desc: Calls a credential extraction helper
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      substr: ExtractCreds

  - id: go-setauth-credential-call
    desc: Go SetAuth call with credentials
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'SetAuth\(\s*\w+\.Login\s*,\s*\w+\.Password'

composite_rules:
  - id: go-bruteforce-named-credential-helper
    desc: Brute-force name with credential setup
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/function::go-bruteforce-function-name
      - id: micro-behaviors/os/security/auth/secret::go-setauth-credential-call
