defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
- id: gh-auth-token-raw
  desc: References GitHub CLI token query command
  crit: notable
  conf: 0.95
  if:
    type: literal
    exact: gh auth token
  unless:
  # The bare command string alongside split argv is one invocation described
  # twice: Go usage monitors pass "gh", "auth", "token" to exec and keep the
  # joined form as a token-source label. Count the invocation once (via the
  # split trait) so a single `gh auth token` call cannot satisfy a
  # multiple-operation harvest composite by itself.
  - id: gh-auth-token-split
  - id: metadata/package/testing/
  - id: github-cli-token-helper-context
  - id: micro-behaviors/os/package-manager/publish::github-api-cli-token-helper
  # (Two Go-helper carve-outs stood here -- go-github-token-env-fallback-call
  # and go-github-token-discard-comment -- but their matchers occur nowhere
  # outside their own definitions, so they suppressed nothing. Dropped to
  # stay under the suppression budget; re-add if that helper resurfaces.)
  # Calvyn contains an explicit security-audit implementation that checks the
  # caller's own gh session.
  - id: well-known/app/development/calvyn-code/
  # Nx's release client shells out to `gh auth token` only as the last step of
  # the developer auth chain (env vars, then the user's own gh hosts.yml), and
  # uses the result as the Authorization header on its own release API calls.
  - id: well-known/tool/development/cli/dev-cli/nx::nx-github-release-client-module
  - id: well-known/lib/format/cadence::update-tool-context
  # Hermes Agent checks gh auth token as a fallback provider credential for
  # Copilot chat completions.
  - id: well-known/app/ai/coding-agent/hermes-agent/

  - id: "metadata/file/naming::test-directory-component"
- id: gh-auth-token-split
  desc: GitHub CLI token query argv
  crit: notable
  conf: 0.9
  for:
  - go
  - rust
  - java
  - csharp
  if:
    type: text
    regex: '"gh"[,\s]+"auth"[,\s]+"token"'
  unless:
  - id: well-known/tool/development/cloud-dev/
  - id: go-github-token-env-fallback-call
  # Datadog's known-metrics generator uses the user's own `gh` session to
  # fetch its private metrics schema during development.  The surrounding
  # Datadog library marker makes that legitimate build-tool context explicit.
  - id: well-known/lib/observability/telemetry::datadog-go-package-text
  # Microsoft's Azure Developer CLI (`azd`) shells out to `gh auth token` when
  # it wires a project up to GitHub Actions -- the same "developer CLI using
  # the operator's own gh session" case as the two carve-outs above.
  # `azure-dev-cli-source` is a three-part identity (source path, repo URL and
  # Go module), so a stray string cannot claim it.
  - id: well-known/app/infrastructure/azure-dev-cli::azure-dev-cli-source
  # A fail-closed self-updater may ask gh for the operator's token solely to
  # download a private release, then verify the published checksums asset.
  - type: text
    substr: checksums.txt
  - type: text
    substr: DownloadVerifiedBinary
  # Same shape one level down: a live end-to-end Go test drives the real `gh`
  # CLI (tests/e2e-live/tier2_live_test.go).
  - id: metadata/package/testing/harness/unit::go-test
  - id: go-github-token-discard-comment

- id: go-github-token-env-fallback-call
  desc: Go GitHub token env fallback call
  crit: notable
  conf: 0.94
  for:
  - go
  if:
    type: text
    substr: GetGitHubTokenFromEnv

- id: go-github-token-discard-comment
  desc: Go GitHub token discard comment
  crit: notable
  conf: 0.94
  for:
  - go
  if:
    type: text
    substr: token value is intentionally discarded

composite_rules:
- id: github-cli-token-helper-context
  desc: Recognized GitHub CLI token helper context
  crit: exception
  conf: 0.96
  for: [javascript, typescript, shell]
  any:
  - id: well-known/tool/development/vcs/github-cli::auth-helper-context
  - id: well-known/tool/development/cli/aicommit2::github-models-login-context

