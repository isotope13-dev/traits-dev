composite_rules:
- id: aws-secretsmanager-inventory-read
  desc: References AWS secret listing and retrieval
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/security/auth/secret::aws-secretsmanager-list
  - id: micro-behaviors/os/security/auth/secret::aws-secretsmanager-get
  for:
  - scripts
  - source
  platforms:
  - windows
  - unix
