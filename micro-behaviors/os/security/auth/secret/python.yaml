defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-aws-secretsmanager-client-call
    desc: Python calls AWS Secrets Manager client
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(boto3|botocore)\.client\s*\(\s*["'']secretsmanager["'']'
  - id: python-list-secrets-call
    desc: Python calls a list_secrets method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)list_secrets$'
  # Pydantic SecretStr and several secret-provider clients expose this method.
  # The call proves protected-value access; provider intent needs context.
  - id: python-get-secret-value-call
    desc: Python unwraps a protected secret value
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)get_secret_value$'
