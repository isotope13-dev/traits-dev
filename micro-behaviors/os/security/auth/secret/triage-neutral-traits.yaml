---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.88
traits:
- for:
  - python
  id: python-client-api-key-argument
  desc: Client constructor takes an API key
  unless:
  - id: well-known/lib/data/lancedb::lancedb-python-distribution
  if:
    type: text
    regex: "\\.Client\\(\\s*api_key\\s*="
- for:
  - python
  id: vault-authentication-source-reference
  desc: HashiCorp Vault token source references
  if:
    type: string_literal
    regex: VAULT_(TOKEN|ROLE_ID|SECRET_ID)|\.vault-token
- for:
  - scripts
  id: ai-cloud-token-prefix-reference
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: References AI cloud credential prefixes
  if:
    type: text
    regex: "(sk-ant-|sk-\\(proj-\\)|dop_v1_)"
