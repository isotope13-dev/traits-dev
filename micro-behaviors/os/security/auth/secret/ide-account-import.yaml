defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: ide-account-import-token-fields
    desc: IDE account import carries token fields
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'importIdeAccount.{0,100}accessToken:.{0,40}refreshToken:'

composite_rules:
  - id: ide-oauth-and-account-token-import
    desc: IDE OAuth and account token import clues
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/auth::ide-oauth-token-info-api
      - id: ide-account-import-token-fields
