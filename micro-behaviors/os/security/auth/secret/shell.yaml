defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: aws-secretsmanager-list
    desc: Lists AWS Secrets Manager entries
    if:
      type: text
      regex: 'aws\s+secretsmanager\s+list-secrets'
    unless:
      - id: well-known/tool/detection/security-scanner/

  - id: aws-secretsmanager-get
    desc: Retrieves an AWS Secrets Manager value
    if:
      type: text
      regex: 'aws\s+secretsmanager\s+get-secret-value'
    unless:
      - id: well-known/tool/detection/security-scanner/
      # Docstring/README examples documenting cmd:// backend capabilities.
      - type: text
        regex: 'e\.g\.\s+``[^`]{0,80}aws\s+secretsmanager\s+get-secret-value'
      - type: text
        regex: '(?m)^\s*#+\s+[^\n]{0,120}aws\s+secretsmanager\s+get-secret-value'
      - type: text
        regex: 'az\s+account\s+show\s+--output\s+tsv\s+--query\s+[''"]name[''"]'
