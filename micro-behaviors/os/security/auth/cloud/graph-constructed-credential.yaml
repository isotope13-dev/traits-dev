# The call facts expose each concatenated URL fragment but not its ordered
# construction. Proximity of two literal origins cannot prove they bracket the
# identity operand of this Request. Match that expression in the argument tree.
# POST is required on this same constructor, rather than borrowed from another
# request. This observes construction, not successful transmission or abuse.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96

traits:
  - id: graph-constructed-credential-urllib-post
    desc: Builds Graph credential POST with variable ID
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute
            object: (attribute
              object: (identifier) @_module
              attribute: (identifier) @_request)
            attribute: (identifier) @_constructor)
          arguments: (argument_list
            . (binary_operator
                left: (binary_operator
                  left: (string) @prefix
                  operator: "+"
                  right: (_))
                operator: "+"
                right: (string) @suffix)
            (keyword_argument
              name: (identifier) @_method
              value: (string) @verb))) @call
        (#eq? @_module "urllib")
        (#eq? @_request "request")
        (#eq? @_constructor "Request")
        (#eq? @_method "method")
        (#match? @prefix "^[\"']https://graph[.]microsoft[.](com|us)/(v1[.]0|beta)/(applications|servicePrincipals)/[\"']$")
        (#match? @suffix "^[\"']/add(Password|Key)[\"']$")
        (#match? @verb "^[\"']POST[\"']$"))
