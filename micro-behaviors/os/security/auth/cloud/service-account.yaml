defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go]
  crit: notable
  conf: 0.97
traits:
  - id: service-account-type-field
    desc: Service-account type field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']?type["'']?\s*:\s*["'']service_account["'']'
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
  - id: gcp-service-account-email
    desc: GCP service-account email literal
    if:
      type: literal
      regex: '^[A-Za-z0-9_.+-]+@[A-Za-z0-9-]+\.iam\.gserviceaccount\.com$'
  - id: gcp-secret-version-access
    desc: Calls GCP secret version access
    if:
      type: symbol
      kind: identifier
      exact: accessSecretVersion
  - id: firebase-admin-config-embedded-pem
    desc: firebaseAdmin config embeds PEM privateKey
    for: [javascript, typescript]
    if:
      type: text
      regex: 'firebaseAdminServiceAccount[\s\S]{0,160}privateKey\s*:\s*["'']-----BEGIN PRIVATE KEY-----'
composite_rules:
  - id: embedded-gcp-key-secret-read
    desc: Uses embedded GCP service-account credentials to read cloud secrets
    crit: suspicious
    conf: 0.97
    near_lines: 30
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/crypto/key/representation::pem-private-key-header
      - id: micro-behaviors/crypto/key/representation::pem-private-key-body
      - id: micro-behaviors/crypto/key/representation::pem-private-key-footer
      - id: micro-behaviors/data/parse/vocabulary::private-key-field-name
      - id: gcp-service-account-email
      - id: service-account-type-field
      - id: gcp-secret-version-access
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
  - id: embedded-gcp-service-account-key
    desc: Embeds private key with GCP service-account identity
    crit: suspicious
    near_lines: 20
    all:
      - id: gcp-service-account-email
      - id: micro-behaviors/crypto/key/representation::embedded-pem-private-key
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::spec-test-filename
      - id: metadata/path::test-directory-component
