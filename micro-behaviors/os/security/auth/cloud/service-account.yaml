defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, python_bytecode, go]
  crit: notable
  conf: 0.97
traits:
  - id: service-account-type-field
    desc: Service-account type field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']?type["'']?\s*:\s*["'']service_account["'']'
  - id: gcp-service-account-email
    desc: GCP service-account email literal
    if:
      type: literal
      regex: '^[A-Za-z0-9_.+-]+@[A-Za-z0-9-]+\.iam\.gserviceaccount\.com$'
  - id: gcp-secret-version-access
    desc: Calls GCP secret version access
    if:
      type: symbol
      kind: identifier
      exact: accessSecretVersion
  - id: firebase-admin-config-embedded-pem
    desc: firebaseAdmin config embeds PEM privateKey
    for: [javascript, typescript]
    if:
      type: text
      regex: 'firebaseAdminServiceAccount[\s\S]{0,160}privateKey\s*:\s*["'']-----BEGIN PRIVATE KEY-----'
  # Compiled Python and native binaries expose constants as extracted text,
  # not as source literals, so the literal-anchored atom above cannot see
  # them. These text forms cover bytecode and frozen bundles.
  - id: gcp-service-account-email-text
    desc: GCP service-account email in extracted text
    for: [python_bytecode, binaries]
    if:
      type: text
      regex: '\b[a-z][a-z0-9-]{4,29}@[a-z][a-z0-9-]{4,29}\.iam\.gserviceaccount\.com\b'
  - id: firebase-admin-service-account-email
    desc: Firebase Admin SDK service-account email
    for: [python, python_bytecode, javascript, typescript, go, java, binaries]
    if:
      type: text
      regex: '\bfirebase-adminsdk-[a-z0-9]{4,6}@[a-z][a-z0-9-]{4,29}\.iam\.gserviceaccount\.com\b'
composite_rules:
  - id: embedded-gcp-key-secret-read
    desc: Uses embedded GCP service-account credentials to read cloud secrets
    crit: suspicious
    conf: 0.97
    near_lines: 30
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-header
      - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-body
      - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-footer
      - id: micro-behaviors/data/parse/vocabulary::private-key-field-name
      - id: gcp-service-account-email
      - id: service-account-type-field
      - id: gcp-secret-version-access
    unless:
      - id: metadata/path/directory::test-directory-component
  - id: embedded-gcp-service-account-key
    desc: Embeds private key with GCP service-account identity
    crit: suspicious
    for: [javascript, typescript, python, go]
    near_lines: 20
    all:
      - id: gcp-service-account-email
      - id: micro-behaviors/crypto/key/representation/encoded::embedded-pem-private-key
    unless:
      - id: metadata/package/testing/presence/harness::spec-test-filename

  - id: embedded-gcp-service-account-key-text
    desc: Compiled code embeds a private key with a GCP service-account identity
    crit: suspicious
    conf: 0.96
    for: [python_bytecode]
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-header
      - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-footer
      - id: gcp-service-account-email-text
