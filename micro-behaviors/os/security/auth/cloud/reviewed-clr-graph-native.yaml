traits:
- for:
  - scripts
  conf: 0.94
  id: graph-mg-credential-add-cmdlet
  desc: Graph identity credential-add cmdlet reference
  if:
    type: text
    regex: (?i)\b(New|Add)-Mg(Application|ServicePrincipal)(Password|Key)\b
- for:
  - scripts
  conf: 0.94
  id: graph-azuread-credential-add-cmdlet
  desc: Azure AD credential-add cmdlet reference
  if:
    type: text
    regex: (?i)\b(New|Add)-AzureADServicePrincipal(Key|Password)Credential\b
composite_rules:
- for:
  - scripts
  - source
  - binaries
  conf: 0.96
  id: graph-identity-credential-add-reference
  desc: Graph credential-add endpoint or cmdlet references
  any:
  - id: micro-behaviors/communications/url/http-path::graph-application-credential-add-path
  - id: micro-behaviors/communications/url/http-path::graph-service-principal-credential-add-path
  - id: graph-mg-credential-add-cmdlet
  - id: graph-azuread-credential-add-cmdlet
  - id: graph-identity-credential-create
defaults:
  platforms:
  - unix
  - windows
  crit: notable
