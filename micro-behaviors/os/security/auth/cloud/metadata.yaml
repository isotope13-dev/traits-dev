# Cloud credential metadata references are normal authentication capabilities.
# Credential theft objectives combine them with collection or exfiltration.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.95

traits:
  - id: node-aws-container-credential-uri
    desc: Node references AWS container credential URI
    for: [javascript, typescript]
    if:
      type: text
      substr: AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
  - id: node-aws-container-metadata-ip
    desc: Node references AWS container metadata address
    for: [javascript, typescript]
    if:
      type: text
      substr: 169.254.170.2

composite_rules:
  - id: node-cloud-credential-source-reference
    desc: Node references cloud credential metadata sources
    for: [javascript, typescript]
    any:
      - id: metadata/file/string/cloud::aws-imds-v2-token-ttl-header
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
      - id: node-aws-container-credential-uri
      - id: node-aws-container-metadata-ip
      - id: metadata/file/string/cloud::gcp-default-credentials
    unless:
      - id: well-known/lib/data/mongodb::mongodb-js-driver-bundle
  - id: aws-imds-credential-reference
    desc: References an AWS instance credential metadata path
    for: [javascript, typescript, python, shell, class, jar]
    any:
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
    unless:
      - id: metadata/package/documentation/
      - id: metadata/package/testing/
  - id: gcp-metadata-credential-reference
    desc: References a GCP service-account metadata path
    for: [javascript, typescript, python, shell]
    any:
      - id: metadata/file/string/cloud::gcp-service-account-token-path
      - id: metadata/file/string/cloud::gcp-service-accounts-metadata-path
      - id: metadata/file/string/cloud::gcp-default-service-account-email-path
    unless:
      - id: metadata/package/testing/
