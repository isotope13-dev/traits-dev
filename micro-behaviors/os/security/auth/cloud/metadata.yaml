# Cloud credential metadata references are normal authentication capabilities.
# Credential theft objectives combine them with collection or exfiltration.
defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.95

traits:
  - id: node-aws-container-credential-uri
    desc: Node references AWS container credential URI
    for: [javascript, typescript]
    if:
      type: text
      substr: AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
  - id: node-aws-container-metadata-ip
    desc: Node references AWS container metadata address
    for: [javascript, typescript]
    if:
      type: text
      substr: 169.254.170.2

composite_rules:
  - id: node-cloud-credential-source-reference
    desc: Node references cloud credential metadata sources
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/communications/http/header/custom::aws-imds-token-ttl-header
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
      - id: node-aws-container-credential-uri
      - id: node-aws-container-metadata-ip
      - id: micro-behaviors/fs/path/credential::gcp-default-credentials
    unless:
      - id: well-known/lib/data/mongodb::mongodb-js-driver-bundle
  - id: aws-imds-credential-reference
    desc: References an AWS instance credential metadata path
    for: [javascript, typescript, python, shell, class, jar]
    any:
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
    unless:
      - id: metadata/package/documentation/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: gcp-metadata-credential-reference
    desc: References a GCP service-account metadata path
    for: [javascript, typescript, python, shell]
    any:
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-account-token-path
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-accounts-metadata-path
      - id: micro-behaviors/communications/http/services/gcp::gcp-default-service-account-email-path
    unless:
      - id: metadata/package/testing/

      - id: "metadata/file/naming::test-directory-component"
  - id: rust-cloud-metadata-endpoint-reference
    desc: Rust references a cloud credential endpoint
    crit: component
    conf: 0.92
    for: [rust]
    any:
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-accounts-metadata-path

  - id: aws-imds-credentials-over-direct-socket
    desc: Requests AWS instance credentials via direct socket
    crit: notable
    conf: 0.96
    for: [shell]
    attack: T1552.005
    all:
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-fd-redirect
