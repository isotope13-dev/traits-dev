defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.88

traits:
  - id: azure-default-credential
    desc: Azure DefaultCredential usage
    for: [python, javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: DefaultAzureCredential

  - id: python-azure-openai-token-scope
    desc: Python Azure OpenAI token scope
    if:
      type: text
      substr: https://cognitiveservices.azure.com/.default
