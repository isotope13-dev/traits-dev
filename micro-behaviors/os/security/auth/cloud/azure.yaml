defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.88

traits:
  - id: azure-default-credential
    desc: Azure DefaultCredential usage
    for: [python, javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: DefaultAzureCredential

  - id: python-azure-openai-token-scope
    desc: Azure Cognitive Services OAuth token scope
    for: [scripts, source, binaries, -mirc, -ircii, -static-lib]
    if:
      type: text
      exclude_comments: true
      substr: https://cognitiveservices.azure.com/.default
