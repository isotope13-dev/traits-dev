defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  # Both AWS clients and Pydantic SecretStr expose this method. The call alone
  # proves sensitive-value access, while provider intent needs other context.
  - id: python-get-secret-value-call
    desc: Python calls a get_secret_value method
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: get_secret_value
