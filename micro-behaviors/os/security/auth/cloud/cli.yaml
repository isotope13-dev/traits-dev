defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, source]
  crit: notable
  conf: 0.9

traits:
  # Authentication-state queries identify the account a cloud CLI is already
  # using. They do not return reusable secrets and are common in setup,
  # deployment and workspace-orchestration tools.
  - id: aws-sts-identity
    desc: AWS CLI authentication-state query
    conf: 0.95
    if:
      type: text
      regex: aws\s+sts\s+get-caller-identity(\s+\*)?
    not:
      - exact: aws sts get-caller-identity *
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
      - id: well-known/app/infrastructure/skypilot::skypilot-kubeconfig-helper

  - id: gcloud-auth-list
    desc: GCP CLI authentication-state query
    conf: 0.95
    if:
      type: text
      regex: '(?i)subprocess\.(run|Popen|check_output)[^\n]{0,120}gcloud\s+auth\s+list'
    unless:
      - id: well-known/tool/detection/security-scanner/

  - id: azure-account-show
    desc: Azure CLI authentication-state query
    conf: 0.95
    if:
      type: text
      regex: az\s+account\s+show(\s+\*)?
    not:
      - exact: az account show *
    unless:
      - id: well-known/tool/detection/security-scanner/

  - id: doppler-me
    desc: Doppler CLI authentication-state query
    conf: 0.95
    if:
      type: text
      regex: \bdoppler\s+me\b

  - id: aws-sts-identity-split
    desc: Split-argument AWS authentication-state query
    conf: 0.9
    for: [go, rust, java, csharp]
    if:
      type: text
      regex: '"aws"[,\s]+"sts"[,\s]+"get-caller-identity"'

  - id: gcloud-auth-list-split
    desc: Split-argument GCP authentication-state query
    conf: 0.9
    for: [go, rust, java, csharp]
    if:
      type: text
      regex: '"gcloud"[,\s]+"auth"[,\s]+"list"'
    unless:
      - type: text
        substr: '--format=value(account,status)'
      - id: micro-behaviors/os/service/gcloud::gcloud-deployment-bootstrap-context

  - id: azure-account-show-split
    desc: Split-argument Azure authentication-state query
    conf: 0.9
    for: [go, rust, java, csharp]
    if:
      type: text
      regex: '"az"[,\s]+"account"[,\s]+"show"'

  - id: vercel-whoami
    desc: Vercel CLI authentication-state query
    if:
      type: text
      word: vercel whoami
  - id: vault-token-lookup
    desc: HashiCorp Vault token metadata query
    if:
      type: text
      word: vault token lookup
