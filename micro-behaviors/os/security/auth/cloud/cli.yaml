defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, source]
  crit: notable
  conf: 0.9

traits:
  - id: vercel-whoami
    desc: Vercel CLI authentication-state query
    if:
      type: text
      word: vercel whoami
  - id: vault-token-lookup
    desc: HashiCorp Vault token metadata query
    if:
      type: text
      word: vault token lookup
