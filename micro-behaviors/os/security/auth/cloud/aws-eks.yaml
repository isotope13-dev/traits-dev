# EKS IAM authentication wraps a presigned STS GetCallerIdentity request in a
# k8s-aws-v1 bearer token. These are neutral authentication mechanics until an
# objective pairs them with stolen node credentials and token minting.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: eks-aws-iam-token-prefix
    desc: EKS AWS IAM authenticator bearer token prefix
    if:
      type: text
      substr: k8s-aws-v1.

  - id: python-presigned-sts-caller-identity
    desc: Python presigns STS GetCallerIdentity
    for: [python]
    if:
      type: text
      regex: 'generate_presigned_url\s*\(\s*["'']get_caller_identity["'']'

  - id: go-presigned-sts-caller-identity
    desc: Go presigns STS GetCallerIdentity
    for: [go]
    if:
      type: symbol
      exact: PresignGetCallerIdentity

  - id: js-presigned-sts-caller-identity
    desc: JavaScript presigns STS GetCallerIdentity
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)(getSignedUrl|presign)\s*\(.{0,180}GetCallerIdentityCommand'

composite_rules:
  - id: presigned-sts-caller-identity
    desc: Presigns an STS GetCallerIdentity request
    crit: notable
    for: [python, javascript, typescript, go]
    any:
      - id: python-presigned-sts-caller-identity
      - id: go-presigned-sts-caller-identity
      - id: js-presigned-sts-caller-identity
