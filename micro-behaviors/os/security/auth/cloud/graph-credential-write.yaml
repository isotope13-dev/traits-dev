# Credential creation is a neutral authentication capability. Bind the write
# method to the credential endpoint; a GET or a URL in documentation is not a
# credential addition. Both application registrations and service principals
# expose these Graph actions.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: graph-identity-credential-post-call
    desc: POSTs Graph identity credential action
    for: [python, javascript, typescript, ruby, php, go, csharp]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(post|postasync|postasjsonasync)$'
      arg:
        index: 0
        kind: string
        regex: '/(applications|servicePrincipals)/[^/?]{1,128}/add(Password|Key)$'

  - id: graph-identity-credential-urllib-request
    desc: urllib Graph credential-action request
    for: [python]
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 0
        kind: string
        regex: '/(applications|servicePrincipals)/[^/?]{1,128}/add(Password|Key)$'

  - id: graph-identity-credential-add-cmdlet-call
    desc: Calls Graph identity credential-add cmdlet
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^Add-Mg(Beta)?(Application|ServicePrincipal)(Password|Key)$'

  - id: graph-application-password-sdk-call
    desc: Calls Graph SDK application password creation
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.applications\.by_application_id\.add_password\.post$'

  - id: graph-principal-password-sdk-call
    desc: Calls Graph SDK principal password creation
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.service_principals\.by_service_principal_id\.add_password\.post$'

  - id: graph-application-password-csharp-sdk-call
    desc: Calls Graph SDK application password creation
    for: [csharp]
    # Indexed C# request builders have no symbol target in current facts.
    # Anchor the invocation to avoid matching code inside logging arguments.
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)^[\w.]+\.applications\[[^\]\n]{1,80}\]\.addpassword\.postasync\s*\('

  - id: graph-identity-credential-js-sdk-endpoint
    desc: Builds Graph SDK identity credential request
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)api$'
      arg:
        index: 0
        kind: string
        regex: '/(applications|servicePrincipals)/[^/?]{1,128}/add(Password|Key)$'

  - id: graph-identity-key-post-call
    desc: POSTs Graph identity key credential action
    for: [python, javascript, typescript, ruby, php, go, csharp]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(post|postasync|postasjsonasync)$'
      arg:
        index: 0
        kind: string
        regex: '/(applications|servicePrincipals)/[^/?]{1,128}/addKey$'

  - id: graph-identity-key-urllib-request
    desc: urllib Graph key-credential request
    for: [python]
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 0
        kind: string
        regex: '/(applications|servicePrincipals)/[^/?]{1,128}/addKey$'

  - id: graph-identity-key-add-cmdlet-call
    desc: Calls Graph identity key-add cmdlet
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(New|Add)-Mg(Beta)?(Application|ServicePrincipal)Key$'

  - id: graph-identity-password-post-call
    desc: POSTs Graph identity password credential action
    for: [python, javascript, typescript, ruby, php, go, csharp]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(post|postasync|postasjsonasync)$'
      arg:
        index: 0
        kind: string
        regex: '/(applications|servicePrincipals)/[^/?]{1,128}/addPassword$'

  - id: graph-identity-password-urllib-request
    desc: urllib Graph password-credential request
    for: [python]
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 0
        kind: string
        regex: '/(applications|servicePrincipals)/[^/?]{1,128}/addPassword$'

  - id: graph-identity-password-add-cmdlet-call
    desc: Calls Graph identity password-add cmdlet
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(New|Add)-Mg(Beta)?(Application|ServicePrincipal)Password$'

composite_rules:
  - id: graph-identity-credential-js-sdk-post
    desc: POSTs Graph SDK identity credential endpoint
    for: [javascript, typescript]
    all:
      - id: graph-identity-credential-js-sdk-endpoint
      - id: micro-behaviors/communications/http/post::http-post-call
    near_bytes: 1

  - id: graph-identity-credential-urllib-post
    desc: Constructs urllib Graph credential-add POST
    for: [python]
    all:
      - id: graph-identity-credential-urllib-request
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
    near_bytes: 1

  - id: graph-identity-key-urllib-post
    desc: Constructs urllib Graph key-add POST
    for: [python]
    all:
      - id: graph-identity-key-urllib-request
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
    near_bytes: 1

  - id: graph-identity-password-urllib-post
    desc: Constructs urllib Graph password-add POST
    for: [python]
    all:
      - id: graph-identity-password-urllib-request
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
    near_bytes: 1

  - id: graph-identity-key-credential-create
    desc: Creates a Graph certificate key credential
    any:
      - id: graph-identity-key-post-call
      - id: graph-identity-key-urllib-post
      - id: graph-identity-key-add-cmdlet-call

  - id: graph-identity-password-credential-create
    desc: Creates a Graph password secret credential
    any:
      - id: graph-identity-password-post-call
      - id: graph-identity-password-urllib-post
      - id: graph-identity-password-add-cmdlet-call
      - id: graph-application-password-sdk-call
      - id: graph-principal-password-sdk-call
      - id: graph-application-password-csharp-sdk-call

  - id: graph-identity-credential-create
    desc: Creates a Graph application or principal credential
    any:
      - id: graph-identity-credential-post-call
      - id: graph-identity-credential-urllib-post
      - id: graph-identity-credential-add-cmdlet-call
      - id: graph-application-password-sdk-call
      - id: graph-principal-password-sdk-call
      - id: graph-application-password-csharp-sdk-call
      - id: graph-identity-credential-js-sdk-post
