defaults:
  platforms: [unix]
  crit: notable
  conf: 0.92

composite_rules:
  - id: rust-cloud-metadata-and-credential-references
    desc: Rust cloud metadata and credential references
    for: [rust]
    all:
      - id: micro-behaviors/os/security/auth/cloud::cloud-metadata-credential-path-reference
    any:
      - id: micro-behaviors/os/env/cloud::cloud-secret-environment-name-set
      - id: micro-behaviors/fs/path/secret-config::cloud-config-path-set

  - id: rust-elf-cloud-metadata-and-credential-references
    desc: Rust ELF cloud metadata and credential references
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: micro-behaviors/os/security/auth/cloud::cloud-metadata-credential-path-reference
    any:
      - id: micro-behaviors/os/env/cloud::cloud-secret-environment-name-set
      - id: micro-behaviors/fs/path/secret-config::cloud-config-path-set
