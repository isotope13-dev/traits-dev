# Evidence-only observations; family and intent require independent context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]

composite_rules:
  # Ordinary provisioning can grant a role, rotate a secret and test login.
  # These nearby operations establish neither unauthorized persistence nor
  # self-assignment. Preserve the observation without an attacker objective.
  - id: entra-admin-grant-credential-login-references
    desc: Admin grant, credential creation and secret-login fields co-occur
    crit: notable
    conf: 0.94
    for: [scripts, source]
    all:
      - id: micro-behaviors/os/security/auth/rbac::entra-privileged-admin-role-grant
      - id: micro-behaviors/os/security/auth/cloud::graph-identity-credential-create
    any:
      - id: micro-behaviors/communications/http/oauth::client-secret-from-secrettext-property
      - id: micro-behaviors/communications/http/oauth::client-secret-from-secrettext-member
    needs: 1
    near_bytes: 1600
    scope: leaf

  - id: entra-role-grant-credential-add-references
    desc: Privileged admin grant and credential-add refs
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/security/auth/rbac::entra-privileged-admin-role-grant
      - id: micro-behaviors/os/security/auth/cloud::graph-identity-credential-add-reference
    near_bytes: 4096
    scope: leaf

  - id: entra-admin-credential-response-stdout
    desc: Prints a Graph credential-add response near a Global Administrator grant
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/auth/rbac::entra-global-admin-role-id
      - id: micro-behaviors/communications/http/url/path::graph-application-credential-add-path
    any:
      - id: micro-behaviors/os/console/io::prints-graph-password-secret-text
      - id: micro-behaviors/os/console/io::prints-http-response-body
      - id: micro-behaviors/os/console/io::prints-script-http-response-body
      - id: micro-behaviors/os/console/io::go-prints-read-http-body
    needs: 1
    near_bytes: 1600
    scope: leaf
