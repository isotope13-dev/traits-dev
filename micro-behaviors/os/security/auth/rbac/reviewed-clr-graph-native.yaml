# Evidence-only observations; family and intent require independent context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]

composite_rules:
  - id: entra-role-grant-credential-add-references
    desc: Global Administrator grant and credential-add references co-occur
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/security/auth/rbac::entra-global-admin-role-grant
      - id: micro-behaviors/os/security/auth/cloud::graph-identity-credential-add-reference
    near_bytes: 4096
    scope: leaf

  - id: entra-admin-credential-response-stdout
    desc: Prints a Graph credential-add response near a Global Administrator grant
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/auth/rbac::entra-global-admin-role-id
      - id: micro-behaviors/communications/http/url/path::graph-application-credential-add-path
    any:
      - id: micro-behaviors/os/console/io::prints-graph-password-secret-text
      - id: micro-behaviors/os/console/io::go-prints-read-http-body
    needs: 1
    near_bytes: 1600
    scope: leaf
