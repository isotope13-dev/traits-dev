defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, go, rust, java, shell, powershell]
  crit: notable
  conf: 0.92

traits:
  - id: check-permission-or-role-call
    desc: Calls a role or permission checking function
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[._])(check|verify)[_-]?(permission|role)s?$'
