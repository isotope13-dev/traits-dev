defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]

traits:
- id: superadmin-role-name
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
    - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
  desc: References superadmin account or role
  crit: notable
  conf: 0.9
  if:
    type: text
    word: superadmin
