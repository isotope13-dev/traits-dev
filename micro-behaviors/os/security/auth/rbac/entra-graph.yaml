# Graph directory role writes are permission changes, independent of intent.
# The fixed built-in role ID belongs to Microsoft, not to an attacker or app.
# A highly privileged grant merits investigation but can be authorized.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: entra-global-admin-role-id
    desc: Entra Global Administrator built-in role ID
    if:
      type: literal
      kind: string
      exact: 62e90394-69f5-4237-9190-012177145e10
      case_insensitive: true

  - id: graph-directory-role-post-call
    desc: POSTs Graph directory role assignment
    for: [python, javascript, typescript, ruby, php, go, csharp]
    if:
      type: symbol
      kind: call
      # HttpClient's async POST helpers perform the same operation as post().
      # Keep the role-assignment URL bound to this particular call's first arg.
      regex: '(?i)(^|\.)(post|postasync|postasjsonasync)$'
      arg:
        index: 0
        kind: string
        substr: /roleManagement/directory/roleAssignments

  - id: graph-directory-role-urllib-request
    desc: urllib Graph directory role request
    for: [python]
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 0
        kind: string
        substr: /roleManagement/directory/roleAssignments

  - id: graph-directory-role-create-cmdlet
    desc: Creates Graph directory role via PowerShell
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^New-Mg(Beta)?RoleManagementDirectoryRoleAssignment$'

composite_rules:
  # Both structured call predicates must describe the very same constructor.
  # A separate POST to addPassword must not turn a role-assignment GET into
  # evidence of a grant.
  - id: graph-directory-role-urllib-post
    desc: Constructs Graph directory role assignment POST
    for: [python]
    all:
      - id: graph-directory-role-urllib-request
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
    near_bytes: 1

  - id: graph-directory-role-create
    desc: Creates an Entra directory role assignment
    any:
      - id: graph-directory-role-post-call
      - id: graph-directory-role-urllib-post
      - id: graph-directory-role-create-cmdlet

  - id: entra-global-admin-role-grant
    desc: Graph role creation near Global Administrator role ID
    crit: suspicious
    conf: 0.9
    all:
      - id: graph-directory-role-create
      - id: entra-global-admin-role-id
    near_bytes: 512
