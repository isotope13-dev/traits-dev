# License-authorization material handling: a licensing client's data-loading
# routine. Neutral on its own — vendor licensing SDKs expose the same loader,
# and a wheel that ships one with distribution metadata is an ordinary
# licensed product. Objective composites supply the undisclosed-distribution
# context that turns the pairing into a claim.
defaults:
  platforms: [windows, unix]
  for: [python, pe, dll, so]
  crit: notable
  conf: 0.9

traits:
  # Substring, not a word match: Cython-compiled modules abut identifiers in
  # one packed string table, so no word boundary survives compilation.
  - id: license-client-loader
    desc: License data loading routine reference
    if:
      type: text
      substr: load_license
