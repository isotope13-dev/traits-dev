# PAN-OS GlobalProtect authentication-override cookie fields and session format.
defaults:
  platforms: [panos, unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: globalprotect-portal-userauthcookie-field
    desc: GlobalProtect portal-userauthcookie field
    if:
      type: text
      substr: portal-userauthcookie

  - id: globalprotect-auth-override-cookie-cleartext
    desc: GlobalProtect auth-override cookie format
    conf: 0.98
    if:
      type: text
      regex: ';;(Windows|Mac|Linux|iOS|Android);;[^\r\n"'']{1,48};0\.0\.0\.0'

  - id: openconnect-gp-userauthcookie-option
    desc: OpenConnect GlobalProtect cookie usergroup
    if:
      type: text
      regex: '(?is)\bopenconnect\b.{0,160}--protocol[= ]gp\b.{0,160}portal-userauthcookie'
