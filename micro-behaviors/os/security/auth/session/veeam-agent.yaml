defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, python, go, rust]
  crit: notable
  conf: 0.96

traits:
  # This is a machine-emitted Veeam log record token, not prose. Exploit code
  # uses it to select cached elevated-session identifiers from the service log.
  - id: veeam-elevated-client-log-event
    desc: Selects a Veeam elevated-client log event
    if:
      type: literal
      exact: Added elevated client

  - id: veeam-caller-session-metadata-field
    desc: Veeam caller session metadata field
    if:
      type: literal
      exact: caller-sessionId

  - id: veeam-elevation-rights-grpc-proxy
    desc: Creates a Veeam elevation-rights gRPC proxy
    if:
      type: symbol
      exact: CElevationRightsGrpcProxyClient

composite_rules:
  - id: veeam-admin-rights-grpc-check
    desc: Checks administrator rights through Veeam gRPC
    conf: 0.98
    for: [pe, dll, csharp]
    all:
      - id: veeam-elevation-rights-grpc-proxy
      - id: micro-behaviors/os/privilege/check::dotnet-has-admin-rights-call
    near_bytes: 1024
