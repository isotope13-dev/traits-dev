defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: admin-session-username
    desc: Constructs admin session username field
    if:
      type: text
      regex: '["'']username["'']\s*:\s*["'']admin["'']'
    unless:
      - id: well-known/lib/web/pallets-flask::flask-json-init-module-path
  - id: koa-cookie-signature-pair
    desc: Constructs HFS signed session cookie pair
    if:
      type: text
      regex: 'hfs_http=\$?\{[^}\r\n]{1,100}\};\s*hfs_http\.sig=\$?\{[^}\r\n]{1,100}\}'
  - id: srp-login-first-stage
    desc: HFS unauthenticated SRP handshake API
    if:
      type: string_literal
      exact: loginSrp1
