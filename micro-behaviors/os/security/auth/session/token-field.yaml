# A session-token field name. Neutral on its own; an operator-channel
# composite supplies the remote project the token is checked against.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, python]
  crit: notable
  conf: 0.9

traits:
  - id: session-token-field
    desc: Session token field name
    if:
      type: text
      substr: session_token
