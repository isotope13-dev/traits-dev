# storageState({path}) saves the automation context's session state; a
# storageState() snapshot without a destination does not establish a file save.
# Use the AST: the symbol projection currently drops targets rooted in `this`.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: browser-storage-state-save
    desc: Saves browser automation session state
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments (object
            (pair key: [(property_identifier) @key
                        (string (string_fragment) @key)] value: (_)))))
          (#eq? @method "storageState")
          (#eq? @key "path"))
