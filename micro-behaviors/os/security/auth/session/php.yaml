defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: wordpress-auth-cookie
    desc: Sets a WordPress authentication cookie
    if:
      type: symbol
      exact: wp_set_auth_cookie

  - id: wordpress-current-user
    desc: Sets the current WordPress user
    if:
      type: symbol
      exact: wp_set_current_user

  - id: symfony-username-password-token
    desc: References UsernamePasswordToken
    conf: 0.9
    if:
      type: text
      substr: new UsernamePasswordToken

  - id: symfony-user-get-password
    desc: Calls getPassword method
    crit: component
    conf: 0.85
    if:
      type: symbol
      kind: identifier
      exact: getPassword

  - id: symfony-security-set-token
    desc: Calls setToken method
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: setToken

  - id: symfony-security-session-set
    desc: Stores security token in session
    conf: 0.9
    if:
      type: text
      substr: "_security_"

composite_rules:
  - id: wordpress-auth-session-setup
    desc: Completes WordPress authentication session setup
    crit: notable
    conf: 0.95
    all:
      - id: wordpress-auth-cookie
      - id: wordpress-current-user

  - id: symfony-token-stored-password
    desc: Feeds stored password hash to token
    crit: notable
    conf: 0.94
    near_lines: 6
    all:
      - id: symfony-username-password-token
      - id: symfony-user-get-password
