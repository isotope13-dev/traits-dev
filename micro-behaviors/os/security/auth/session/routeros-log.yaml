# RouterOS system history identifies the SSH principal responsible for a
# configuration event. These atoms preserve that neutral log structure and the
# anomalous negative-numeric identity separately; exploit intent is composed in
# objectives/lateral-movement/exploit/network-device/ssh-auth-bypass.yaml.
defaults:
  platforms: [routeros]
  for: [text]
  crit: notable
  conf: 0.96

traits:
  - id: routeros-ssh-login-failure
    desc: RouterOS SSH login failure event
    if:
      type: text
      regex: 'system,error,critical[ \t]+login failure for user \S+ from \S+ via ssh'

  - id: negative-numeric-login-user
    desc: Negative numeric login username
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'login failure for user -[0-9]{1,10} from'

  - id: routeros-ssh-history-attribution
    desc: RouterOS history attributed to SSH
    if:
      type: text
      regex: 'system,info[^\r\n]{1,240}\bby ssh:[^ @\r\n]{1,64}@[^ \r\n()]{3,64}'

  - id: negative-numeric-ssh-history-principal
    desc: Negative numeric SSH history principal
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\bby ssh:-[0-9]{1,10}@[^ \t\r\n()]{3,64}'
