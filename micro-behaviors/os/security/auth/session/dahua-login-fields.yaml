defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - go
  - python
  - javascript
  - typescript
  crit: notable
traits:
- id: dahua-netkeyboard-client-type
  desc: Dahua login sets clientType to NetKeyboard
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)["']clientType["']\s*[:=,]\s*["']NetKeyboard["']
- id: dahua-netkeyboard-unused-password
  desc: Dahua login password set to Not Used
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)(["'']password["'']\s*[:=,]\s*|(pwd|password)\b[^;,\n]{0,30})["'']Not Used["'']'
- id: dahua-loopback-login-type
  desc: Dahua login sets loginType to Loopback
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)["']loginType["']\s*[:=,]\s*["']Loopback["']
- id: dahua-loopback-spoofed-ip
  desc: Login ipAddr field set to loopback address
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)["']ipAddr["']\s*[:=,]\s*["']127\.0\.0\.1["']

composite_rules:
# Keep field proximity independent of transport: request helpers can be
# defined far from the payload they send.
- id: dahua-netkeyboard-login-fields
  desc: Dahua NetKeyboard client type near unused password
  conf: 0.98
  near_bytes: 600
  all:
  - id: dahua-netkeyboard-client-type
  - id: dahua-netkeyboard-unused-password
- id: dahua-loopback-login-fields
  desc: Dahua Loopback login type near loopback IP field
  conf: 0.98
  near_bytes: 600
  all:
  - id: dahua-loopback-login-type
  - id: dahua-loopback-spoofed-ip
