defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.88

traits:
  - id: source-session-admin-assignment
    desc: Assigns administrator to web session
    if:
      type: text
      regex: '(?i)session[\s\S]{0,40}(user_id|administrator_id)[^\n]{0,8}='

  - id: source-session-admin-member
    desc: Assigns admin member to web session
    if:
      type: text
      regex: '(?i)session\s*\.\s*(user|admin|administrator)\s*='

composite_rules:
  - id: source-privileged-session-setup
    desc: Establishes session from privileged account
    crit: notable
    conf: 0.9
    any:
      - id: source-session-admin-assignment
      - id: source-session-admin-member
