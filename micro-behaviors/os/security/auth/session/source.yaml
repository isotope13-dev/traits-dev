defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.88

traits:
  - id: punctuation-leading-username-assignment
    desc: Assigns punctuation-leading auth username
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '\b(ssh_|target_)?user(name)?\s*=\s*b?["''][!#$%&*+./:;<=>?@^_`|~-]'

  - id: source-session-user-id-assignment
    desc: Assigns session user identifier
    if:
      type: text
      regex: '(?i)session[\s\S]{0,40}(user_id|administrator_id)[^\n]{0,8}='

  - id: source-session-user-member-assignment
    desc: Assigns session user member
    if:
      type: text
      regex: '(?i)session\s*\.\s*(user|admin|administrator)\s*='

  - id: java-session-user-id-assignment
    desc: Assigns Java session user identifier
    for: [java]
    if:
      type: text
      regex: '(?i)\bsession\s*\.\s*setAttribute\s*\(\s*[''\"]user_id[''\"]'

  - id: csharp-session-user-id-assignment
    desc: Assigns C# session user identifier
    for: [csharp]
    if:
      type: text
      regex: '(?i)\bSession\s*\.\s*Set(Int32|String)\s*\(\s*[''\"]user_id[''\"]'

  - id: go-session-user-id-assignment
    desc: Assigns Go session user identifier
    for: [go]
    if:
      type: text
      regex: '(?i)\bsession\s*\.\s*Set\s*\(\s*[''\"]user_id[''\"]'

composite_rules:
  - id: source-session-user-assignment
    desc: Assigns user identity to web session
    crit: notable
    conf: 0.88
    any:
      - id: source-session-user-id-assignment
      - id: source-session-user-member-assignment
      - id: java-session-user-id-assignment
      - id: csharp-session-user-id-assignment
      - id: go-session-user-id-assignment

  - id: source-privileged-session-setup
    desc: Establishes session from privileged account
    crit: notable
    conf: 0.9
    all:
      - id: source-session-user-assignment
      - id: micro-behaviors/os/privilege/check::source-privileged-account-reference
    near_bytes: 512
    unless:
      - id: metadata/build/scaffold::antlr-generated-parser
