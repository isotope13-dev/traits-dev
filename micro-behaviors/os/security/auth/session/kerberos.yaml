# Neutral source-level Kerberos ticket protocol operations. Credential-access
# objectives combine these capabilities with SPN targeting and ticket-cracking
# evidence to identify Kerberoasting.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript, go, csharp, perl, ruby, php]
  attack: T1558.003

traits:
  - id: kerberos-tgs-api-request
    desc: Requests a Kerberos TGS ticket by API
    crit: notable
    conf: 0.92
    if:
      type: text
      word: getKerberosTGS

  - id: go-kerberos-tgs-request
    desc: Go requests a Kerberos service ticket
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: '(?i)\bGetServiceTicket(WithSessionKey)?\s*\('

  - id: windows-kerberos-tgs-request
    desc: Windows Kerberos TGS request API
    crit: notable
    conf: 0.92
    for: [powershell, csharp]
    if:
      type: text
      regex: '(?i)\b(KerberosRequestorSecurityToken|RequestServiceTicket)\b'

  - id: kerberos-tgs-request-marker
    desc: Identifies a Kerberos TGS request marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(asktgs|KRB_TGS_REQ|TGS-REQ)\b'

  - id: kerberos-tgs-response-marker
    desc: Identifies a Kerberos TGS response marker
    crit: notable
    conf: 0.9
    if:
      type: text
      word: KRB_TGS_REP

  - id: kerberos-weak-encryption
    desc: Identifies weak encryption on a Kerberos ticket
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(RC4[-_ ]?HMAC|weak[_ -]?encryption|etype\s*[:=]\s*23)'

composite_rules:
  - id: kerberos-tgs-request
    desc: Kerberos service-ticket request capability
    crit: notable
    conf: 0.94
    any:
      - id: kerberos-tgs-api-request
      - id: windows-kerberos-tgs-request
      - id: go-kerberos-tgs-request
      - id: kerberos-tgs-request-marker
