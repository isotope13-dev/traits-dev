# Neutral source-level Kerberos ticket protocol operations. Credential-access
# objectives combine these capabilities with SPN targeting and ticket-cracking
# evidence to identify Kerberoasting.
defaults:
  platforms: [windows, unix]
  for: [source, binaries]
  attack: T1558.003

traits:
  - id: kerberos-tgs-api-request
    desc: Requests a Kerberos TGS ticket by API
    crit: notable
    conf: 0.92
    if:
      type: text
      word: getKerberosTGS

  - id: go-kerberos-tgs-request
    desc: Go requests a Kerberos service ticket
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: '(?i)\bGetServiceTicket(WithSessionKey)?\s*\('

  - id: windows-kerberos-tgs-request
    desc: Windows Kerberos TGS request API
    crit: notable
    conf: 0.92
    for: [powershell, csharp]
    if:
      type: text
      regex: '(?i)\b(KerberosRequestorSecurityToken|RequestServiceTicket)\b'

  - id: kerberos-tgs-request-marker
    desc: Identifies a Kerberos TGS request marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(asktgs|KRB_TGS_REQ|TGS-REQ)\b'

  - id: kerberos-tgt-request-marker
    desc: Identifies a Kerberos TGT request marker
    crit: notable
    conf: 0.9
    if:
      type: text
      word: asktgt

  - id: kerberos-tgs-response-marker
    desc: Identifies a Kerberos TGS response marker
    crit: notable
    conf: 0.9
    if:
      type: text
      word: KRB_TGS_REP

  - id: kerberos-login-call
    desc: Kerberos-based login/authentication call
    crit: notable
    conf: 0.88
    # A plain authentication-mechanism call, not a credential-dump signal on
    # its own: any impacket-based tool that supports Kerberos auth (a
    # read-only AD enumeration script, an interactive SMB client, an actual
    # dump tool) calls this. objectives/credential-access composites combine
    # it with dump-specific targeting (DRSUAPI, NTDS, DC-mode flags) for the
    # credential-access verdict.
    if:
      type: text
      regex: 'kerberosLogin\s*\('

  - id: kerberos-aeskey-auth-option
    desc: AES key option for Kerberos authentication
    crit: notable
    conf: 0.85
    # A standard auth-mechanism CLI/API option (AES-key Kerberos auth is a
    # normal, documented alternative to password/NTLM auth), present across
    # an entire Kerberos-capable toolset regardless of what the tool does
    # with the resulting session. Not suspicious on its own.
    if:
      type: text
      substr: aesKey

  - id: kerberos-weak-encryption-reference
    desc: References Kerberos RC4 or etype 23 encryption
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(RC4[-_ ]?HMAC|etype\s*[:=]\s*23)\b'
    unless:
      - id: well-known/lib/crypto/gokrb5::library-context
      - id: well-known/lib/crypto/mit-krb5::source-tree-context
      # A `.d.ts` carries only type declarations, so an enumerated API value
      # ("Valid values are RC4-HMAC, AES-256" in @azure/arm-storage's Kerberos
      # ticket-encryption union) documents a server option, not a downgrade.
      - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
  - id: kerberos-tgs-request
    desc: Kerberos service-ticket request capability
    crit: notable
    conf: 0.94
    any:
      - id: kerberos-tgs-api-request
      - id: windows-kerberos-tgs-request
      - id: go-kerberos-tgs-request
      - id: kerberos-tgs-request-marker
