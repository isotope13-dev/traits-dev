defaults:
  platforms:
  - unix
  - windows
  for:
  - xpi
  - crx
  - chrome-manifest
  - javascript
  - typescript
composite_rules:
- crit: notable
  conf: 0.95
  id: capture-authority-with-auth-token-call
  desc: Capture authority with auth-token request
  scope: archive
  all:
  - id: metadata/permission/capture::broad-capture-extension
  - id: micro-behaviors/os/security/auth/session::browser-identity-auth-token-call
  any:
  - id: metadata/permission/manifest::externally-connectable
  - id: metadata/permission/network::permission-declarative-net-request
