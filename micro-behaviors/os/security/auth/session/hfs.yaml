defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: hfs-login-random-output-access
    desc: Reads exposed HFS login PRNG output
    for: [python, javascript, typescript]
    if:
      type: symbol
      kind: member
      regex: '\.loggingIn\.sid$'
  - id: session-ip-change-enabled
    desc: Enables session client IP changes
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?m)^[ \t]*["'']?allow_session_ip_change["'']?\s*:\s*(True|true)\b'
  - id: administrator-session-username
    desc: Assigns administrator username field
    for: [python, javascript, typescript]
    if:
      type: tree-sitter
      kind: assignment
      regex: '["'']?username["'']?\s*:\s*["'']admin["'']'
