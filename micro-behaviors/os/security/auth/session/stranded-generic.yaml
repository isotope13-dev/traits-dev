# Neutral observations reviewed from stranded members.
defaults:
  for:
  - scripts
  - binaries
  - csharp
  conf: 0.9
traits:
- id: kerberoast-command-name
  desc: Kerberoasting command name
  crit: notable
  if:
    type: text
    word: kerberoast
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  platforms:
  - windows
  - unix
- id: asrep-roast-command-name
  desc: AS-REP roasting command name
  crit: notable
  if:
    type: text
    word: asrep_roast
  platforms:
  - windows
- id: kerberos-renewal-command-name
  desc: Kerberos ticket renewal command name
  crit: notable
  if:
    type: text
    word: kerbrenew
  platforms:
  - windows
- id: golden-ticket-command-name
  desc: Golden Ticket command name
  crit: notable
  if:
    type: text
    word: golden_ticket
  platforms:
  - windows
- id: silver-ticket-command-name
  desc: Silver Ticket command name
  crit: notable
  if:
    type: text
    word: silver_ticket
  platforms:
  - windows
- id: rbcd-command-name
  desc: Resource-based delegation command name
  crit: component
  if:
    type: text
    word: rbcd
  platforms:
  - windows
composite_rules:
- id: kerberos-roast-or-renew-command-name
  desc: Kerberos roast or renewal command name
  crit: component
  any:
  - id: micro-behaviors/os/security/auth/session::kerberoast-command-name
  - id: micro-behaviors/os/security/auth/session::asrep-roast-command-name
  - id: micro-behaviors/os/security/auth/session::kerberos-renewal-command-name
  platforms:
  - windows
- id: kerberos-ticket-command-name
  desc: Kerberos ticket command name
  crit: component
  any:
  - id: micro-behaviors/os/security/auth/session::kerberos-tgt-request-marker
  - id: micro-behaviors/os/security/auth/session::kerberos-tgs-request-marker
  - id: micro-behaviors/os/security/auth/session::golden-ticket-command-name
  - id: micro-behaviors/os/security/auth/session::silver-ticket-command-name
  platforms:
  - windows
- id: directory-replication-or-delegation-command-name
  desc: Replication or delegation command name
  crit: component
  any:
  - id: micro-behaviors/os/security/directory-service::dcsync-command-name
  - id: micro-behaviors/os/security/auth/session::rbcd-command-name
  platforms:
  - windows
- id: kerberos-command-name-groups
  desc: Multiple Kerberos command-name groups
  crit: notable
  needs: 2
  any:
  - id: micro-behaviors/os/security/auth/session::kerberos-roast-or-renew-command-name
  - id: micro-behaviors/os/security/auth/session::kerberos-ticket-command-name
  - id: micro-behaviors/os/security/auth/session::directory-replication-or-delegation-command-name
  platforms:
  - windows
