# A session existence check does not by itself establish first access.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
traits:
  - id: cfml-session-existence-check
    desc: CFML checks whether a session value exists
    if:
      type: symbol
      kind: call
      exact: isdefined
      arg:
        index: 0
        from:
          whole_value: '(?i)^session\.[\w$]+(\.[\w$]+)*$'
  - id: cfml-session-inequality
    desc: CFML compares a session member for inequality
    if:
      type: symbol
      kind: call
      regex: '^cf(if|elseif)$'
      args:
        - index: 1
          exact: neq
        - kind: identifier
          name_regex: '^session\.'
