defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: editor-silent-existing-auth-session-request
    desc: Requests existing auth session silently
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            property: (property_identifier) @session_method)
          arguments: (arguments
            (string)
            (array)
            (object
              (pair key: (property_identifier) @create value: (false))
              (pair key: (property_identifier) @silent value: (true)))))
          (#eq? @session_method "getSession")
          (#eq? @create "createIfNone")
          (#eq? @silent "silent"))
