defaults:
  for: [php]
  crit: notable
  platforms: [windows, unix]
  mbc: C0029
traits:

  - id: php-sha256-comparison
    desc: Compares a PHP SHA-256 result
    conf: 0.92
    if:
      type: tree-sitter
      language: php
      query: |
        ((binary_expression
          left: (function_call_expression
            function: (name) @callee
            arguments: (arguments
              . (argument [(string) (encapsed_string)] @algorithm)))
          operator: ["==" "==="]) @comparison
          (#eq? @callee "hash")
          (#match? @algorithm "^[\"']sha256[\"']$"))

  - id: php-sha256-hash-equals
    desc: Uses hash_equals with a SHA-256 result
    conf: 0.92
    if:
      type: text
      regex: 'hash_equals\s*\(\s*\$[A-Za-z_]\w*\s*,[\s\S]{0,80}hash\s*\(\s*[''\"]sha256[''\"]'

  - id: php-fixed-digest-hash-equals
    desc: Calls hash_equals with a fixed digest
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: hash_equals
      arg:
        kind: string
        regex: '^[0-9a-fA-F]{64}$'

  - id: php-variable-hash-equals
    desc: Compares two PHP values with hash_equals
    conf: 0.84
    if:
      type: text
      regex: 'hash_equals\s*\(\s*\$[A-Za-z_]\w*\s*,[\s\S]{0,120}\$[A-Za-z_]\w*\s*\)'

  - id: php-sha256-fixed-digest-equality
    desc: Compares SHA-256 output to a fixed digest
    conf: 0.96
    if:
      type: tree-sitter
      language: php
      query: |
        ((binary_expression
          left: (function_call_expression
            function: (name) @callee
            arguments: (arguments
              . (argument [(string) (encapsed_string)] @algorithm)))
          operator: ["==" "===" "!=" "!=="]
          right: [(string) (encapsed_string)] @digest) @evidence
          (#match? @callee "(?i)^hash$")
          (#match? @algorithm "(?i)^[\"']sha256[\"']$")
          (#match? @digest "^[\"'][0-9a-fA-F]{64}[\"']$"))
        ((binary_expression
          left: [(string) (encapsed_string)] @digest
          operator: ["==" "===" "!=" "!=="]
          right: (function_call_expression
            function: (name) @callee
            arguments: (arguments
              . (argument [(string) (encapsed_string)] @algorithm)))) @evidence
          (#match? @callee "(?i)^hash$")
          (#match? @algorithm "(?i)^[\"']sha256[\"']$")
          (#match? @digest "^[\"'][0-9a-fA-F]{64}[\"']$"))
composite_rules:
  - id: php-hardcoded-sha256-comparison
    desc: PHP compares a fixed SHA-256-shaped value
    conf: 0.96
    any:
      - id: php-fixed-digest-hash-equals
      - id: php-sha256-fixed-digest-equality
