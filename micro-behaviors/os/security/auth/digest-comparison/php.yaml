defaults:
  for: [php]
  crit: notable
  platforms: [windows, unix]
  mbc: C0029
traits:

  - id: php-sha256-comparison
    desc: Compares a PHP SHA-256 result
    conf: 0.92
    if:
      type: tree-sitter
      language: php
      query: |
        ((binary_expression
          left: (function_call_expression
            function: (name) @callee
            arguments: (arguments
              . (argument [(string) (encapsed_string)] @algorithm)))
          operator: ["==" "==="]) @comparison
          (#eq? @callee "hash")
          (#match? @algorithm "^[\"']sha256[\"']$"))

  - id: php-sha256-hash-equals
    desc: Uses hash_equals with a SHA-256 result
    conf: 0.92
    if:
      type: text
      regex: 'hash_equals\s*\(\s*\$[A-Za-z_]\w*\s*,[\s\S]{0,80}hash\s*\(\s*[''\"]sha256[''\"]'

  - id: php-fixed-digest-hash-equals
    desc: Calls hash_equals with a fixed digest
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: hash_equals
      arg:
        kind: string
        regex: '^[0-9a-fA-F]{64}$'

  - id: php-variable-hash-equals
    desc: Compares two PHP values with hash_equals
    conf: 0.84
    if:
      type: text
      regex: 'hash_equals\s*\(\s*\$[A-Za-z_]\w*\s*,[\s\S]{0,120}\$[A-Za-z_]\w*\s*\)'
composite_rules:
  - id: php-hardcoded-sha256-comparison
    desc: PHP compares input with a hardcoded SHA-256 digest
    conf: 0.96
    all:
      - id: metadata/file/encoding/hex::php-hex-64-literal
    any:
      - id: php-sha256-comparison
      - id: php-sha256-hash-equals
      - id: php-fixed-digest-hash-equals
      - id: php-variable-hash-equals
    near_bytes: 1024
