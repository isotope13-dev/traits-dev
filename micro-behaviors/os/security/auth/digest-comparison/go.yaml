defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-hex-digest-literal-comparison
    desc: Go compares against a 64-hex literal
    conf: 0.85
    if:
      type: text
      regex: '(==|!=)\s*"[0-9a-fA-F]{64}"'

  # The pclntab survives ordinary Go stripping and remains usable when deep
  # disassembly times out. Restrict the name to the function table so a
  # printed or documented API name in .rodata is not digest implementation.
