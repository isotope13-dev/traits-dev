# An embedded digest comparison is an authentication/integrity observation,
# rather than public-key signature verification. The hashed input can be an
# in-memory buffer; no file read is required.
# The bounded matcher does not bind the comparison variable to ComputeHash.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable

traits:
  - id: powershell-computehash-digest-comparison
    desc: ComputeHash near an embedded digest comparison
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.ComputeHash\(.{0,40}\)[\s\S]{0,500}-[ci]?eq\s*[''"][\da-f]{64}[''"]'

