# Assignment-purpose review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - go
  - rust
  - c
  - cpp
  - java
  crit: notable
  conf: 0.92
traits:
- id: admin-admin-auth-pair
  desc: Auth parameter set to the admin/admin pair
  conf: 0.96
  if:
    type: text
    regex: (?i)\b(auth|default_auth)\s*=\s*[(\[]\s*["']admin["']\s*,\s*["']admin
  unless:
  - id: well-known/tool/offensive/exploitdb::published-script-wrapper
