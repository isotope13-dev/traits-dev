# A dictionary reference also occurs in ordinary authentication configuration.
# Guessing intent belongs to composites requiring cracking routines.
defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: password-dictionary-file-reference
    desc: Password dictionary file reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(path to |choose (a )?)?password dictionary file'

