defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
traits:
  - id: sys-exasol-cli-credentials
    desc: CLI supplies default sys/exasol credentials
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Command-line arguments and quoted argv arrays, not a bare mention of
      # either credential. Preserve the case-sensitive password and -P flag.
      regex: '-u[\s''",]{1,8}(?i:sys)[\s''",]{1,8}-P([\s''",]+exasol[''"]|\s+exasol)([\s,\])]|$)'
