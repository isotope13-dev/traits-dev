defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
traits:
  - id: sys-exasol-cli-credentials
    desc: CLI supplies default sys/exasol credentials
    crit: notable
    conf: 0.95
    if:
      type: text
      # Command-line arguments and quoted argv arrays, not a bare mention of
      # either credential. Both password flags occur in the cited artifacts;
      # the password itself remains case sensitive.
      regex: '-u[\s''",]{1,8}(?i:sys)[\s''",]{1,8}-[pP]([\s''",]+exasol[''"]|\s+exasol)([\s,\])]|$)'

  - id: exasol-default-password-field
    desc: Password field specifies Exasol factory password
    crit: notable
    conf: 0.95
    if:
      type: text
      # Field names are case insensitive; the password is not.
      regex: '(?i:\b\w*(pass(word)?|pwd))["'']?\s*[:=]\s*["'']exasol["'']'

composite_rules:
  - id: sys-exasol-credential-fields
    desc: Adjacent fields configure factory SYS credentials
    crit: notable
    conf: 0.97
    near_bytes: 256
    all:
      - id: micro-behaviors/os/security/auth/session::sys-user-field
      - id: exasol-default-password-field
