defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: admin1234
    desc: Common admin1234 password token
    crit: notable
    conf: 0.72
    if:
      type: text
      word: "admin1234"
    unless:
      - id: micro-behaviors/os/security/auth/password::powershell-rejects-admin1234-password
