defaults:
  platforms: [linux, macos, windows]
  for: [scripts, pyc]
  crit: notable
  conf: 0.85

traits:
  - id: native-password-operation-symbol
    desc: References a native password-related symbol
    for: [c, elf]
    platforms: [linux]
    if:
      type: import
      regex: '(?i)(^|[_-])password([_-]|$)'

  - id: hardcoded-default-password-parameter
    desc: Uses a hardcoded default password parameter
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)\b(pwd|password|passwd)\s*(:\s*str)?\s*=\s*["''][^"''\r\n]{6,80}["'']'
    not:
      # Config key labels like PASSWORD = 'PASSWORD' are not credentials.
      - regex: '(?i)\b(pwd|password|passwd)\s*(:\s*str)?\s*=\s*["''](pwd|password|passwd)["'']'

  - id: python-hardcoded-password-call-argument
    desc: Python call with hardcoded password argument
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)\b(pwd|password|passwd)\s*=\s*["''][^"''\r\n]{6,80}["'']'

  - id: credentials-setter-call
    desc: Calls a client credential-setting method
    crit: notable
    conf: 0.86
    for: [python, javascript, typescript, shell, powershell, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)set[_-]?credentials$'
    unless:
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
  - id: python-raw-password-field
    desc: Python raw password field name
    crit: component
    conf: 0.86
    for: [python]
    if:
      type: text
      regex: '(?i)raw[_-]?password'
  - id: php-common-default-password-literal
    desc: PHP common default-password literal
    for: [php]
    platforms: [unix, windows]
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(admin@123|//12345)'

  - id: php-user-literal-comparison
    desc: PHP user variable compared to literal
    for: [php]
    platforms: [unix, windows]
    conf: 0.94
    if:
      type: text
      regex: '\$(user|username|login)\s*===?\s*["''][^"''\r\n]{4,96}["'']'

  - id: php-secret-literal-comparison
    desc: PHP secret variable compared to literal
    for: [php]
    platforms: [unix, windows]
    conf: 0.94
    if:
      type: text
      regex: '\$(pass|password|key|token)\s*===?\s*["''][^"''\r\n]{4,96}["'']'

  - id: common-password-policy-text
    desc: Common-password policy warning
    if:
      type: text
      regex: '(?i)(password is too common|common passwords|weak passwords|too common\.)'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
  - id: dockerfile-root-password-set
    desc: Dockerfile sets root password
    for: [dockerfile]
    platforms: [unix]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'echo\s+["'']?root:.{1,64}["'']?\s*\|\s*chpasswd'
      case_insensitive: true

  - id: python-container-password-reset-command
    desc: Python sends container password reset
    crit: notable
    conf: 0.92
    for: [python]
    platforms: [unix]
    if:
      type: text
      regex: '(?is)\bdocker\b.{0,800}\b(passwordset|chpasswd|passwd)\b'

composite_rules:
  - id: python-raw-password-credential-setter
    desc: Python raw password field near credential setter
    crit: notable
    conf: 0.9
    for: [python]
    all:
      - id: python-raw-password-field
      - id: credentials-setter-call
    near_bytes: 512
