defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: suspicious
traits:
  - id: native-byte-password-success-branch
    desc: Byte-built password comparison returns success
    conf: 0.99
    attack: T1556.004
    if:
      type: tree-sitter
      language: c
      query: |
        ((function_definition
          declarator: (function_declarator declarator: (identifier) @function)
          body: (compound_statement
            (expression_statement (assignment_expression
              left: (subscript_expression argument: (identifier) @built)
              right: (number_literal) @byte))
            (if_statement
              condition: (parenthesized_expression
                (unary_expression operator: "!" argument:
                  (call_expression function: (identifier) @compare
                    arguments: (argument_list (identifier) @password (identifier) @key))))
              consequence: (compound_statement
                (expression_statement (assignment_expression right: (number_literal) @flag_value))
                (return_statement (number_literal) @success)))))
         (#eq? @compare "strcmp")
         (#eq? @password "password")
         (#eq? @built @key)
         (#match? @byte "^0[xX][0-9a-fA-F]{1,2}$")
         (#eq? @flag_value "1") (#eq? @success "1"))
