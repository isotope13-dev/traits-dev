defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
traits:
  - id: native-ssh-password-handler
    desc: Defines the SSH password-authentication handler
    conf: 0.99
    if:
      type: tree-sitter
      language: c
      query: |
        ((function_definition declarator: (function_declarator
           declarator: (identifier) @function
           parameters: (parameter_list (parameter_declaration type: (type_identifier) @context))))
         (#eq? @function "auth_password") (#eq? @context "Authctxt"))
