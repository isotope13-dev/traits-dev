# Overlong 257-1024 byte password literals, encoded password payloads, and
# cross-language bounded string constructors exceeding 256-byte libc/musl crypt()
# limits while staying within 1024-byte protocol caps.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.94

traits:
  - id: literal-password-assign-257-to-999
    desc: Assigns 257-999 byte password literal
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(password|passwd|(\b|_)(pass|pw))(\[\])?\s*[:=]\s*["''][!-~]{257,999}["'']'
    not:
      - substr: "-----BEGIN"

  - id: encoded-overlong-password-assign
    desc: Decodes 257-999 byte password assignment
    for: [shell, python, powershell, javascript, typescript, go, ruby, php]
    if:
      type: encoded
      regex: '(?i)\b(password|passwd|SSHPASS)\s*[:=]\s*["'']?[!-~]{257,999}'

  - id: encoded-repeated-alpha-257-to-999
    desc: Encoded 257-999 byte repeated alpha run
    for: [shell, python, powershell, javascript, typescript, go, ruby, php]
    if:
      type: encoded
      encoding: [base64, hex]
      regex: '(?i)^(aaaaaaaaa{249,991}|xxxxxxxxx{249,991})$'

  - id: native-repeated-alpha-257-to-1024
    desc: Binary embeds 257-999 repeated alpha chars
    crit: component
    conf: 0.88
    for: [elf, macho, pe]
    if:
      type: raw
      regex: '[^Aa][Aa]{257,999}[^Aa]|[^Xx][Xx]{257,999}[^Xx]'

  - id: sshpass-env-overlong-literal
    desc: Sets SSHPASS to 257-999 byte literal
    platforms: [unix]
    for: [shell, scripts, source]
    if:
      type: text
      exclude_comments: true
      regex: '\bSSHPASS\s*=\s*["'']?[!-~]{257,999}(["'']|\s|$)'

  - id: shell-printf-width-tr-257-to-1019
    desc: Shell printf width builds 257-1019 chars
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: 'printf\s+[''"]?%(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)s[''"]?.{0,16}\|\s*tr\b'

  - id: csharp-new-string-257-to-1019
    desc: C# String repeats 257-1019 chars
    for: [csharp]
    if:
      type: text
      exclude_comments: true
      regex: '\bnew\s+[Ss]tring\(\s*.{3,12},\s*(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)\s*\)'

  - id: powershell-new-string-257-to-1019
    desc: PowerShell String::new repeats 257-1019 chars
    for: [powershell]
    if:
      type: text
      exclude_comments: true
      regex: '\[[Ss]tring\]::new\(\s*.{3,12},\s*(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)\s*\)'

  - id: js-buffer-alloc-fill-257-to-1019
    desc: Node Buffer.alloc fills 257-1019 chars
    for: [javascript, typescript]
    if:
      type: text
      exclude_comments: true
      regex: '\bBuffer\.alloc\(\s*(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)\s*,\s*[''"][A-Za-z][''"]'

  - id: tcl-expect-string-repeat-257-to-1019
    desc: Tcl/Expect repeats string 257-1019 times
    platforms: [unix]
    for: [shell, text, scripts]
    if:
      type: text
      exclude_comments: true
      regex: '\bstring\s+repeat\s+\S+\s+(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)\b'

  - id: rust-vec-repeat-257-to-1019
    desc: Rust slice repeats byte 257-1019 times
    for: [rust]
    if:
      type: text
      exclude_comments: true
      regex: '\[b?''[^''\n]{1,4}''\s*;\s*(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)\s*\]'

composite_rules:
  - id: overlong-password-payload-257-to-1024
    desc: Builds or decodes 257-1024 byte password
    for: [scripts, source, text, binaries, -beam, -wasm, -static-lib]
    conf: 0.94
    any:
      - id: micro-behaviors/data/string/assembly::repeated-string-257-to-1024
      - id: micro-behaviors/os/random/generator::random-token-257-to-1024
      - id: literal-password-assign-257-to-999
      - id: encoded-overlong-password-assign
      - id: encoded-repeated-alpha-257-to-999
      - id: sshpass-env-overlong-literal
      - id: shell-printf-width-tr-257-to-1019
      - id: csharp-new-string-257-to-1019
      - id: powershell-new-string-257-to-1019
      - id: js-buffer-alloc-fill-257-to-1019
      - id: tcl-expect-string-repeat-257-to-1019
      - id: rust-vec-repeat-257-to-1019
