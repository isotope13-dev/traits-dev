defaults:
  platforms: [unix, windows]
  for: [class]
traits:
  - id: attempted-password-buffer
    desc: JVM names an attempted login password buffer
    crit: notable
    conf: 0.93
    if:
      type: text
      exact: lastAttemptedPassword
  - id: password-report-value
    desc: JVM contains a plaintext password report field
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '"name":"Password","value":"'
