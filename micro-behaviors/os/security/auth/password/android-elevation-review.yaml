defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.92

traits:
  # Require device-policy context because resetPassword is a common method name.
  - id: android-device-policy-reset-password
    desc: DevicePolicyManager resets device password
    if:
      type: text
      regex: 'DevicePolicyManager[\s\S]{0,200}\.\s*resetPassword\s*\('
