# C string comparisons over credential variables. Neutral: every login path
# compares a password, and admin tools compare user names to literals.
# Relocated from objectives/command-and-control/backdoor/auth-bypass, whose
# sentinel composite pairs the two within a few lines to find the wu-ftpd
# "magic password" shape.
#
# `text` is in `for:` because this evidence normally reaches an analyst as a
# patch or a source excerpt, and a `.patch`/`.diff` types as text.
defaults:
  platforms: [unix]
  for: [c, cpp, text]
  crit: notable

traits:
  - id: strcmp-password-field
    desc: Compares a password field with strcmp
    conf: 0.9
    # `strcmp(xpasswd, pw->pw_passwd)` -- the daemon's real password check.
    if:
      type: text
      regex: '\bstr(n|case)?cmp\s*\([^;"\n]{0,60}(pw_passwd|passwd|password|pwd)\b[^;"\n]{0,60}\)'

  - id: strcmp-credential-var-to-literal
    desc: Compares a credential variable to a literal
    conf: 0.92
    # The sentinel leg, narrowed to the case that matters: the LITERAL is
    # tested against the credential itself, as in wu-ftpd's
    # `strcmp(passwd, "NULL")`.
    #
    # The generic `literal-string-comparison-guard` was standing here, and it
    # matched any literal comparison at all. In pristine irssi 0.8.4 the proxy
    # dispatches its protocol with `strcmp(cmd, "PASS")` two lines above the
    # genuine `strcmp(password, args)`, and the pair convicted the upstream
    # release of carrying a magic credential. Requiring the compared variable
    # to be the credential separates the two: a protocol token named `cmd` is
    # not a password, however close it sits to one.
    if:
      type: text
      # Braced substitution tokens such as "{username}" are transformation
      # templates, not fixed magic credentials.
      regex: '\bstr\w*cmp\s*\(\s*[\w>.\[\]-]{0,20}(pass|login|user)\w*\s*,\s*"[^\{"\n][^"\n]{1,39}"'
    not:
      # Windows SIDs (e.g. Cygwin group S-1-5-32-544 stored in gr_passwd) are identifiers, not credentials.
      - regex: '"S-1-[0-9-]+"'

