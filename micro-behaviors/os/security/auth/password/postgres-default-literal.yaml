# A literal credential setting is not evidence of successful authentication,
# a live secret, or credential theft. This also applies to source templates.
defaults:
  platforms: [windows, unix]
  for: [csharp]
traits:
  - id: postgres-default-credential-literal
    desc: Literal sets postgres/postgres credentials
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: '(?i)\bUsername\s*=\s*postgres\s*;\s*Password\s*=\s*postgres\s*(;|$)'
