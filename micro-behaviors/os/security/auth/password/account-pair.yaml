traits:
  - id: common-account-pair-literal
    desc: Literal pairs two common account names
    crit: notable
    conf: 0.86
    for: [scripts]
    platforms: [unix, windows]
    if:
      type: literal
      regex: '^(admin|operator|root)[ \t]*[,:|\t][ \t,:|]{0,9}(admin|operator)$'
      case_insensitive: true
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
    not:
      - regex: '(?i)\b(admin|operator|root)\b\s*[/|]'
      - regex: '(?i)\b(admin|operator)\s*(\|\||&&)'
      - regex: '^:param '

