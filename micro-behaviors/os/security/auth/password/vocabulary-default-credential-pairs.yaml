defaults:
  platforms:
  - unix
  - windows
  - appliance
  for:
  - python
  - javascript
  - typescript
  - ruby
  - shell
  - powershell
  - go
  - perl
  - elf
  crit: suspicious
  conf: 0.92
traits:
- crit: notable
  conf: 0.93
  id: wago-controller-default-pair
  desc: WAGO controller default credential pair
  if:
    type: text
    regex: (?i)\b(admin|root|user)\b["']?\s*[,:/=]\s*["']?wago\b
- crit: notable
  conf: 0.93
  id: teltonika-router-default-pair
  desc: Teltonika router default credential pair
  if:
    type: text
    regex: (?i)\b(admin|root)\b["']?\s*[,:/=]\s*["']?admin01\b
composite_rules:
- crit: notable
  conf: 0.94
  id: ot-device-default-credentials
  desc: Embeds factory-default credentials for industrial or cellular edge devices
  any:
  - id: micro-behaviors/os/security/auth/password::wago-controller-default-pair
  - id: micro-behaviors/os/security/auth/password::teltonika-router-default-pair
