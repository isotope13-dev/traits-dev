defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.94
traits:
  - id: go-administrator-password-pair
    desc: Go embeds an administrator/password string pair
    if:
      type: tree-sitter
      query: |
        (composite_literal
          body: (literal_value
            . (literal_element (interpreted_string_literal) @user)
            . (literal_element (interpreted_string_literal) @password) .)
          (#eq? @user "\"administrator\"")
          (#eq? @password "\"password\""))
  - id: go-default-password-auth-call
    desc: Calls Authenticate with administrator/password
    if:
      type: symbol
      kind: call
      regex: '\.Authenticate$'
      args:
        - index: 0
          kind: string
          exact: administrator
        - index: 1
          kind: string
          exact: password
