# Literal credential configuration is not evidence of a successful login.
# This pair is the XWEB EVO built-in credential (CVE-2026-124004).
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: xweb-builtin-credential-form
    desc: Form contains XWEB built-in credentials
    crit: notable
    conf: 0.99
    if:
      type: literal
      regex: '(^|&)username=Administrator&password=xwebevonewgeneration(&|$)'

  - id: xweb-builtin-credential-form-password-first
    desc: Form contains XWEB built-in credentials
    crit: notable
    conf: 0.99
    if:
      type: literal
      regex: '(^|&)password=xwebevonewgeneration&username=Administrator(&|$)'
