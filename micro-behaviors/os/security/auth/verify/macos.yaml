# Local directory-service password verification (`dscl . -authonly`).
#
# `-authonly` is the only dscl verb that checks a password without changing
# anything, so it is how a stealer confirms a phished login password is real
# before replaying it into sudo/keychain. Two spellings have to be covered:
# the inline command line (shell, or a string handed to a shell), and the
# argv-array form that compiled carriers build — Rust
# `Command::new("dscl").arg(".").arg("-authonly")`, Go `exec.Command`, Python
# `subprocess.run([...])` — where the verb never touches the tool name.
defaults:
  platforms:
    - macos
  for: [source, binaries]
traits:
  - id: csidentity-auth
    desc: macOS CSIdentity password authentication
    crit: suspicious
    conf: 0.95
    # Native-only symbol; the CoreServices API has no scripting spelling.
    for: [macho, c, cpp, objectivec, swift]
    if:
      type: symbol
      exact: CSIdentityAuthenticateUsingPassword
  - id: dscl-authonly
    desc: dscl authonly in native source
    crit: suspicious
    conf: 0.85
    mbc: T1078.001
    if:
      type: text
      regex: '\bdscl\s+(\.|/Local/Default)\s+-?authonly\b'

  - id: dscl-authonly-argv
    desc: dscl password check in an argv list
    crit: suspicious
    conf: 0.9
    mbc: T1078.001
    attack: T1110.001
    for: [scripts, source]
    if:
      # The verb is a separate argv element, so it is never adjacent to the
      # tool name; anchor on dscl and allow the intervening argument list.
      type: text
      regex: '(?s)\bdscl\b.{0,200}["\x27]-?authonly["\x27]'
  - id: dscl-local-default
    desc: 'macOS dscl /Local/Default (local dir service)'
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /Local/Default
