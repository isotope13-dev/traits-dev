# Local password authentication; alone this does not imply capture or guessing.
defaults:
  platforms:
    - macos
  for: [scripts, source, binaries]
traits:
  - id: csidentity-auth
    desc: macOS CSIdentity password authentication
    crit: notable
    conf: 0.95
    # Native-only symbol; the CoreServices API has no scripting spelling.
    for: [macho, c, cpp, objectivec, swift]
    if:
      type: symbol
      exact: CSIdentityAuthenticateUsingPassword
  - id: dscl-authonly
    desc: Local password verification with dscl
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bdscl\s+(\.|/Local/Default)\s+-?authonly\b'

  - id: dscl-authonly-argv
    desc: dscl password check in an argv list
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      # The verb is a separate argv element, so it is never adjacent to the
      # tool name; anchor on dscl and allow the intervening argument list.
      type: text
      regex: '(?s)\bdscl\b.{0,200}["\x27]-?authonly["\x27]'
  - id: dscl-local-default
    desc: 'macOS dscl /Local/Default (local dir service)'
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /Local/Default

composite_rules:
  - id: dscl-password-verification
    desc: Local password verification with dscl
    crit: notable
    conf: 0.95
    any:
      - id: dscl-authonly
      - id: dscl-authonly-argv
