# Local password authentication; alone this does not imply capture or guessing.
defaults:
  platforms:
    - macos
  for: [scripts, source, binaries]
traits:
  - id: csidentity-auth
    desc: macOS CSIdentity password authentication
    crit: notable
    conf: 0.95
    # Native-only symbol; the CoreServices API has no scripting spelling.
    for: [macho, c, cpp, objectivec, swift]
    if:
      type: symbol
      exact: CSIdentityAuthenticateUsingPassword
  - id: dscl-authonly
    desc: Local password verification with dscl
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bdscl\s+(\.|/Local/Default)\s+-?authonly\b'

  - id: dscl-authonly-argv
    desc: dscl password check in an argv list
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      # The verb is a separate argv element, so it is never adjacent to the
      # tool name; anchor on dscl and allow the intervening argument list.
      type: text
      regex: '(?s)\bdscl\b.{0,200}["\x27]-?authonly["\x27]'
  - id: dscl-local-default
    desc: 'macOS dscl /Local/Default (local dir service)'
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /Local/Default

  # OpenDirectory's `-[ODRecord verifyPassword:error:]` is the framework
  # spelling of `dscl . -authonly`: it checks a candidate password against a
  # local account without changing anything. Native Swift/Objective-C carriers
  # reach it through the selector; PyObjC spells it `verifyPassword_error_` and
  # JXA `verifyPasswordError(`.
  - id: opendirectory-verify-password
    desc: OpenDirectory record password check
    crit: notable
    conf: 0.85
    attack: T1078.001
    for: [macho, swift, objectivec, objc, python, javascript, applescript]
    if:
      type: text
      regex: '\bverifyPassword(:error:|_error_|Error\s*\()'
  - id: opendirectory-user-record-type
    desc: OpenDirectory user record lookup
    crit: notable
    conf: 0.8
    for: [macho, swift, objectivec, objc, python, javascript, applescript]
    if:
      type: text
      substr: kODRecordTypeUsers

composite_rules:
  - id: dscl-password-verification
    desc: Local password verification with dscl
    crit: notable
    conf: 0.95
    any:
      - id: dscl-authonly
      - id: dscl-authonly-argv
  - id: opendirectory-user-password-check
    desc: Checks a local user password via OpenDirectory
    # Notable, not suspicious: ControlCenter, mdmclient, ManagedClient and
    # DirectoryService all do this. Intent comes from what surrounds it — see
    # objectives/credential-access/phishing/ui::validated-native-password-phish.
    crit: notable
    conf: 0.9
    attack: T1078.001,T1110.001
    for: [macho, swift, objectivec, objc, python, javascript, applescript]
    all:
      - id: opendirectory-verify-password
      - id: opendirectory-user-record-type
