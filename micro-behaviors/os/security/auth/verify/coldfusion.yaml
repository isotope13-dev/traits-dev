# Proximity records co-occurrence, not variable identity or successful gating.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.85
composite_rules:
  - id: cfml-password-literal-session-comparison
    desc: CFML password literal near a session comparison
    near_lines: 40
    all:
      - id: micro-behaviors/data/source/syntax/credential::cfml-password-literal-assignment
      - id: micro-behaviors/os/security/auth/session::cfml-session-inequality
