# WordPress request verification: the nonce check that proves a request was
# issued by the site rather than forged cross-site.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: wordpress-nonce-verification
    desc: Verifies a WordPress request nonce
    if:
      type: symbol
      kind: call
      exact: wp_verify_nonce
