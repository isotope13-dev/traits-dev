# Session-verification and face-authentication references are neutral
# capabilities, including when they co-occur with embedded cloud configuration.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, python]
  crit: notable
  conf: 0.92

traits:
  - id: online-session-verification
    desc: Online session verification routine
    if:
      type: text
      substr: verify_session_online
  - id: face-auth-mode
    desc: Face authentication mode text
    if:
      type: text
      regex: "\\bface auth\\b"
      case_insensitive: true

# Embedded Firebase configuration and authentication references do not establish
# command tasking or attacker control. Preserve their co-occurrence as a capability.
composite_rules:
  - id: firebase-face-auth-session-verification
    desc: Firebase configuration near face-auth session verification
    crit: notable
    conf: 0.97
    for: [pe, dll]
    platforms: [windows]
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/services/google::google-api-key-packed
      - id: micro-behaviors/communications/http/services/firebase::firebase-auth-domain
      - id: micro-behaviors/communications/http/services/firebase::firebase-storage-domain
      - id: micro-behaviors/communications/http/services/firebase::pyrebase-client
      - id: micro-behaviors/os/security/auth/session::session-token-field
      - id: micro-behaviors/os/security/auth/verify::online-session-verification
      - id: micro-behaviors/os/security/auth/verify::face-auth-mode
