# Client routines that decide a session by asking a remote service, and the
# face-authentication mode those routines cover. The names are capabilities;
# binding them to an embedded cloud project is the operator channel.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, python]
  crit: notable
  conf: 0.92

traits:
  - id: online-session-verification
    desc: Online session verification routine
    if:
      type: text
      substr: verify_session_online
  - id: face-auth-mode
    desc: Face authentication mode text
    if:
      type: text
      substr: "face auth"
      case_insensitive: true
