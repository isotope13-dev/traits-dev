# The Windows functions that actually validate or collect interactive
# credentials: the LSA logon entry point, the NTLM password validator inside
# msv1_0, and the CredUI prompt. Logon services, RDP front-ends, backup agents
# and installers legitimately name them, so each atom is a neutral capability;
# the objective composites pair them with an in-process hook mechanic, which is
# what turns "calls the authentication API" into "intercepts authentication"
# (ATT&CK T1056.004, Credential API Hooking).
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp]
  crit: notable
  conf: 0.9
  attack: T1056.004

traits:
  - id: lsa-logon-user
    desc: LSA interactive logon entry point
    if:
      type: text
      word: LsaLogonUser

  - id: msv1-0-password-validate
    desc: MSV1_0 NTLM password validation routine
    conf: 0.92
    if:
      type: text
      word: MsvpPasswordValidate

  - id: credui-prompt-for-credentials
    desc: Windows interactive credential prompt API
    if:
      type: text
      regex: '\bCredUIPromptForCredentials[AW]?\b'

composite_rules:
  # Any of the surfaces above, including the OS WebAuthn assertion call kept
  # with the other passkey atoms. Referenced by hook-interception objectives.
  - id: windows-authentication-entry-point
    desc: References a Windows credential-validation entry point
    crit: notable
    conf: 0.92
    any:
      - id: lsa-logon-user
      - id: msv1-0-password-validate
      - id: credui-prompt-for-credentials
      - id: micro-behaviors/os/security/auth/passkey::windows-webauthn-assertion-api
