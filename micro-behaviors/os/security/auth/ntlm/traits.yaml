defaults:
  crit: notable
  platforms: [windows, unix]
  for: [binaries, scripts]
  attack: T1550.002

traits:
  - id: python-lm-ntlm-hash-pair
    desc: Python accepts LM:NTLM hash pair
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '\blmntlm\b|LM:NTLM'
  - id: ntlmssp-marker
    desc: NTLMSSP authentication marker
    conf: 0.9
    count_min: 2
    if:
      type: text
      substr: NTLMSSP

  - id: ntlmv2-credential-capture-log
    desc: NetNTLMv2 credential capture log indicator
    crit: notable
    conf: 0.95
    for: [pe, c, cpp, python, powershell, csharp]
    if:
      type: text
      regex: '(?i)(capture[d]?\s+NTLMv2|NTLMv2\s+hash)'
  # Shared NT-hash field atom: NTLM credential material referenced by field
  # name, whether a Ruby pass-the-hash module, an offline dump parser, or
  # forensic tooling names it. Higher-tier traits reference this one atom
  # instead of redefining the word.
  - id: nt-hash-field
    desc: NT hash credential field
    conf: 0.9
    for: [scripts, source, rust]
    if:
      type: text
      regex: '(?i)\bnt_?hash\b'
