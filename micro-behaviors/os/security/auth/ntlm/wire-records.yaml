# Protocol constants and interoperable output structure, independent of tool
# names, account names and destinations. Neither headers nor templates alone
# establish capture or credential theft.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]
  crit: notable
  conf: 0.97

traits:
  - id: challenge-header-mapped
    desc: NTLM Type 2 header in mapped data
    if:
      type: hex
      section: any
      pattern: "4E 54 4C 4D 53 53 50 00 02 00 00 00"
  - id: challenge-header-overlay
    desc: NTLM Type 2 header in executable overlay
    if:
      type: hex
      section: overlay
      pattern: "4E 54 4C 4D 53 53 50 00 02 00 00 00"
  - id: authenticate-header-mapped
    desc: NTLM Type 3 header in mapped data
    if:
      type: hex
      section: any
      pattern: "4E 54 4C 4D 53 53 50 00 03 00 00 00"
  - id: authenticate-header-overlay
    desc: NTLM Type 3 header in executable overlay
    if:
      type: hex
      section: overlay
      pattern: "4E 54 4C 4D 53 53 50 00 03 00 00 00"
  - id: netntlm-positional-record-template
    desc: NetNTLM five-field positional output template
    for: [csharp, python, elf, macho, pe, dll]
    conf: 0.88
    if:
      type: text
      regex: '\{\d+\}::\{\d+\}(:\{\d+\}){3}'
  - id: netntlm-printf-record-template
    desc: NetNTLM five-field printf output template
    for: [c, cpp, go, elf, macho, pe, dll]
    conf: 0.88
    if:
      type: text
      substr: '%s::%s:%s:%s:%s'
  # Punctuation-heavy CLR user strings can be omitted by printable-string
  # extraction. Match their serialized UTF-16LE representation directly.
  # 3? accepts a positional-format digit without fixing the argument order.
  - id: netntlm-positional-record-utf16-mapped
    desc: NetNTLM record in mapped UTF-16LE data
    conf: 0.94
    if:
      type: hex
      section: any
      pattern: '7B 00 3? 00 7D 00 3A 00 3A 00 7B 00 3? 00 7D 00 3A 00 7B 00 3? 00 7D 00 3A 00 7B 00 3? 00 7D 00 3A 00 7B 00 3? 00 7D 00'
  - id: netntlm-positional-record-utf16-overlay
    desc: NetNTLM positional record in UTF-16LE overlay
    conf: 0.94
    if:
      type: hex
      section: overlay
      pattern: '7B 00 3? 00 7D 00 3A 00 3A 00 7B 00 3? 00 7D 00 3A 00 7B 00 3? 00 7D 00 3A 00 7B 00 3? 00 7D 00 3A 00 7B 00 3? 00 7D 00'

composite_rules:
  - id: challenge-message-header
    desc: NTLM server challenge wire header
    any:
      - id: challenge-header-mapped
      - id: challenge-header-overlay
  - id: authenticate-message-header
    desc: NTLM client authenticate wire header
    any:
      - id: authenticate-header-mapped
      - id: authenticate-header-overlay
  - id: netntlm-record-template
    desc: NetNTLM response-record output template
    for: [scripts, source, binaries]
    any:
      - id: netntlm-positional-record-template
      - id: netntlm-printf-record-template
      - id: netntlm-positional-record-utf16-mapped
      - id: netntlm-positional-record-utf16-overlay
