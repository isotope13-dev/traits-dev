# A credential format label does not establish SMB lateral movement.
# Relocated without changing its matcher, type, platforms or severity.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-lmhash-nthash-pair
    desc: Names an LM and NT hash pair
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'LMHASH:NTHASH'
