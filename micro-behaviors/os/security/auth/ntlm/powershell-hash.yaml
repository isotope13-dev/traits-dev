defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.97

traits:
  # These are source-level relationships, shared by PowerShell SMB and WMI
  # clients. Neither an NTLM implementation nor a MAC provider proves replay.
  - id: powershell-hash-text-to-ntlm-buffer
    desc: Hash text slices initialize NTLM-named buffer
    if:
      type: text
      regex: '(?i)\$NTLM_hash_bytes\s*=[^\r\n]{0,100}\$hash\.SubString\('

  - id: powershell-ntlm-buffer-mac-key
    desc: NTLM hash buffer assigned as MAC key
    if:
      type: text
      regex: '(?i)\$HMAC_MD5\.key\s*=\s*\$NTLM_hash_bytes\b'
