defaults:
  platforms: [windows]
  for: [text, source, scripts, powershell, python, batch, shell, csharp, javascript, typescript, go, rust]

traits:
  - id: wsus-ntlmrelayx-mssql-target
    desc: ntlmrelayx MSSQL target command text
    crit: suspicious
    conf: 0.99
    unless:
    - id: well-known/tool/detection/openhound::pypi-distribution-name
    - id: well-known/tool/detection/openhound::openhound-framework-url
    - id: metadata/file/format/structured::serialized-skill-documentation-catalog
    if:
      type: text
      regex: (?i)\bntlmrelayx(\.py)?\b.{0,220}(-t|--target)\s*mssql://
