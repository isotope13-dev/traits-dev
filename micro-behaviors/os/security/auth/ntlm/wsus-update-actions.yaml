defaults:
  platforms: [windows]
  for: [text, source, scripts, powershell, python, batch, shell, csharp, javascript, typescript, go, rust]

# Angle-bracket placeholders (mssql://<host>) are operator-help templates, not
# operational relay commands: `<` cannot appear in a real URI authority, so
# requiring another authority character only drops templates. Template text
# stays covered at notable by
# communications/proxy/relay::ntlm-relay-command-or-forwarding-reference.
traits:
  - id: ntlmrelayx-mssql-target
    desc: ntlmrelayx MSSQL target command text
    crit: suspicious
    conf: 0.99
    unless:
    - id: well-known/tool/detection/openhound::pypi-distribution-name
    - id: well-known/tool/detection/openhound::openhound-framework-url
    - id: metadata/file/format/structured::serialized-skill-documentation-catalog
    if:
      type: text
      regex: (?i)\bntlmrelayx(\.py)?\b.{0,220}(-t|--target)\s*mssql://[^<\s]
