# SASL (RFC 4422) authentication mechanism references. SASL is the pluggable
# auth framework shared by AMQP, SMTP, IMAP, XMPP, LDAP, Kafka and Hive, so a
# mechanism name on its own identifies the auth scheme in use and nothing about
# the protocol or the caller's intent. Protocol- or product-specific composites
# reference these atoms and supply that context themselves.
defaults:
  platforms: [unix, windows]
  # Trimmed to stay under the type:text file-type cap; the dropped buckets are
  # ones that do not carry SASL client code in practice.
  for: [scripts, source, json, -jcl, -batch, -applescript, -vbs, -lua, -zig,
        -objc, -swift, -groovy]
  crit: notable
  conf: 0.9
  attack: T1078

traits:
  - id: sasl-plain-mechanism
    desc: References the SASL PLAIN auth mechanism
    if:
      type: text
      regex: '(?i)\bSASL[_ -]PLAIN\b'
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
      # A generated TextMate grammar is a symbol table, not program logic:
      # its per-language alternation lists every keyword the language has.
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
