defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
traits:
  - id: netdom-add-trust
    desc: Creates an Active Directory domain trust
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bnetdom(\.exe)?["'']?\s+trust\s+[^\r\n;&|]{1,500}\s/add\b'
  - id: netdom-two-way-option
    desc: Requests two-way domain trust mode
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bnetdom(\.exe)?["'']?\s+trust\s+[^\r\n;&|]{1,500}\s/twoway\b'
  - id: nltest-domain-trusts
    desc: Lists Active Directory domain trusts
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bnltest(\.exe)?["'']?\s+[^;\r\n|&]{0,120}/domain_trusts\b'
  - id: nltest-all-trusts
    desc: Lists all Active Directory domain trusts
    conf: 0.98
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bnltest(\.exe)?\s+/domain_trusts\s+/all_trusts\b'
