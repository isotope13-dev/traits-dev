defaults:
  conf: 0.8
  crit: notable
  for:
    - elf
  platforms:
    - unix
traits:
  # The uppercase C macro is not a sysctl operation. Linux bots also use
  # KERN_SECURELEVEL as an environment key, unrelated to BSD security state.
  - id: kern-securelvl-sysctl
    desc: BSD kernel securelevel sysctl
    crit: notable
    if:
      type: text
      substr: 'kern.securelevel'
    unless:
      - id: metadata/lang/compiler/systems::go-binary
    downgrade:
      # Go's runtime on OpenBSD embeds the full sysctl name table including
      # `kern.securelevel` in gopclntab regardless of whether the program reads it.
      any:
        - id: metadata/lang/compiled/
