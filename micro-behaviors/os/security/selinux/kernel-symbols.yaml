defaults:
  platforms: [linux]
  for: [c, elf]

traits:
  - id: selinux-state-reference
    desc: References SELinux state symbol
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: selinux_state
  - id: selinux-reader-reference
    desc: References SELinux enforcement reader
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: sel_read_enforce
  - id: selinux-writer-reference
    desc: References SELinux enforcement writer
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: sel_write_enforce
