defaults:
  platforms: [linux, android]
  for: [scripts, binaries]
  crit: notable

traits:
  - id: unconfined-u-label
    desc: References an unconfined SELinux user label
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: '\bunconfined_u:[A-Za-z0-9_.-]+'
  - id: unconfined-r-label
    desc: References an unconfined SELinux role label
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: '\bunconfined_r:[A-Za-z0-9_.-]+'
  - id: unconfined-t-label
    desc: References an unconfined SELinux domain label
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: '\bunconfined_t:[A-Za-z0-9_.-]+'
  - id: object-r-label
    desc: References an object_r SELinux file-role label
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: 'object_r:'
  - id: permissive-keyword
    desc: References SELinux permissive mode
    crit: component
    conf: 0.7
    if:
      type: text
      word: permissive
  - id: enforce-sysfs-path
    desc: SELinux sysfs enforce path
    conf: 0.82
    if:
      type: text
      substr: /sys/fs/selinux/enforce
  - id: enforce-legacy-path
    desc: Legacy SELinux enforce path
    conf: 0.78
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_./-])/selinux/enforce([^A-Za-z0-9_./-]|$)'
  - id: restorecon-command
    desc: Restores SELinux file labels
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?m)^[ \t]*((sudo[ \t]+)?restorecon)([ \t]|$)'
  - id: selinux-config-path
    desc: References SELinux policy configuration path
    conf: 0.85
    for: [shell, scripts, binaries]
    if:
      type: text
      substr: /etc/selinux
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  # Relocated from objectives/persistence/system/init/script (2026-07). Sourcing
  # /etc/selinux/config is the standard way a shell script reads SELINUXTYPE --
  # policycoreutils' own fixfiles/selinux-autorelabel, the systemd generator,
  # dracut's selinux module and rc.d/init.d/functions all do it. It is a neutral
  # config read (the shell does execute the file's contents, hence notable, not
  # baseline), not init persistence and not an SELinux bypass.
  - id: source-selinux-config
    desc: Shell sources a config file under /etc/selinux
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: \.\s+/etc/selinux/|source\s+/etc/selinux/
  - id: getenforce-command
    desc: Reads SELinux enforcement state
    conf: 0.85
    for: [shell]
    if:
      type: text
      word: getenforce
  - id: chcon-command
    desc: Relabels a file with chcon
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?chcon\b'
  # `semodule -i policy.pp` (install) / `-e` (enable) is how packaging scripts,
  # container builds, and configuration-management roles ship their own policy
  # module. Removing or disabling a module weakens the policy instead and lives
  # in objectives/evasion/anti-av/platform/selinux::semodule-remove-command.
  - id: semodule-install-command
    desc: Installs or enables an SELinux policy module
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo[ \t]+)?semodule[ \t]+-[ie]\b'
  - id: setsebool-command
    desc: Modifies an SELinux boolean
    crit: notable
    conf: 0.85
    for: [shell, python, ruby, go, rust]
    if:
      type: text
      regex: '(?m)^[ \t]*((sudo[ \t]+)?setsebool)[ \t]+'
  # `setenforce 1` puts SELinux back into enforcing mode. On its own this is a
  # neutral MAC state change; paired with `setenforce 0` in the same file it
  # marks a scoped, restored relaxation rather than a lasting MAC teardown, so
  # objectives/impact/degrade/mac references it from downgrade:.
  - id: setenforce-enforcing
    desc: Sets SELinux back to enforcing mode
    crit: notable
    conf: 0.9
    for: [shell, python, ruby, go, rust]
    if:
      type: text
      regex: '\bsetenforce\s+(1|Enforcing)\b'
