# Neutral observations; attack consumers must supply intent-specific evidence.
traits:
- platforms:
  - unix
  - windows
  crit: notable
  for:
  - python
  id: python-write-selinux-disabled
  desc: Python writes SELinux disabled directive
  conf: 0.9
  if:
    type: tree-sitter
    kind: call
    regex: ^[A-Za-z_][A-Za-z0-9_]*\.write\([^)]{0,120}SELINUX\s*=\s*disabled
