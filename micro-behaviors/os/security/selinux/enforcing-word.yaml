defaults:
  platforms: [linux]
traits:
  # A bare word: SELinux getenforce output, but also any policy/option text
  # ("enforcing" GTID mode in MariaDB). Composites add the SELinux context.
  - id: enforcing-keyword
    desc: String literal uses the word enforcing
    crit: notable
    conf: 0.6
    for:
      - shell
      - c
      - elf
    if:
      type: string_literal
      word: enforcing
