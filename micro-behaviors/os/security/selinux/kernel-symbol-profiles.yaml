defaults:
  platforms: [linux]
  for: [c, elf]

composite_rules:
  - id: selinux-reader-writer-references
    desc: References SELinux reader and writer APIs
    crit: notable
    all:
    - id: micro-behaviors/os/security/selinux::selinux-reader-reference
    - id: micro-behaviors/os/security/selinux::selinux-writer-reference
  - id: selinux-state-enforcing-references
    desc: SELinux state beside enforcing keyword
    crit: notable
    all:
    - id: micro-behaviors/os/security/selinux::selinux-state-reference
    - id: micro-behaviors/os/security/selinux::enforcing-keyword
