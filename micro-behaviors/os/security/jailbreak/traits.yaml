# Jailbreak artifact paths a program looks for to decide whether the device it
# runs on has been jailbroken. Neutral capability: legitimate banking and DRM
# apps check these too. The intent (evading analysis on a jailbroken device)
# belongs in objectives/anti-analysis/environment-detect/.
defaults:
  platforms: [ios]
  for: [go, kotlin, rust, cpp, objc, c, swift]
  crit: suspicious
  conf: 0.9

traits:
  - id: ios-cydia-artifact-path
    desc: References the iOS Cydia artifact path
    if:
      type: string_literal
      exact: /Applications/Cydia.app

  - id: ios-sileo-artifact-path
    desc: References the iOS Sileo artifact path
    if:
      type: string_literal
      exact: /Applications/Sileo.app

  - id: ios-mobilesubstrate-artifact-path
    desc: References the iOS MobileSubstrate artifact path
    if:
      type: string_literal
      exact: /Library/MobileSubstrate/MobileSubstrate.dylib

  - id: ios-apt-artifact-path
    desc: References the iOS apt artifact path
    if:
      type: string_literal
      exact: /private/var/lib/apt
