# Defensive agent runtimes keep sensitive developer paths in explicit deny
# policies. Path names alone are still surfaced by their canonical traits; this
# context only prevents a deny implementation from being called credential
# collection.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: create-sensitive-path-policy-function
    desc: Defines sensitive-path enforcement policy
    if:
      type: function
      exact: createSensitivePathPolicy

  - id: safety-denial-decision
    desc: Returns a safety-motivated denial decision
    if:
      type: text
      regex: 'action:\s*["'']deny["''][\s\S]{0,240}decisionReason:\s*["'']safety["'']'

composite_rules:
  - id: sensitive-path-deny-policy-context
    desc: Defensive sensitive-path denial policy context
    crit: exception
    conf: 0.99
    all:
      - id: create-sensitive-path-policy-function
      - id: safety-denial-decision
