# Defensive agent runtimes keep sensitive developer paths in explicit deny
# policies. Path names alone are still surfaced by their canonical traits; this
# context only prevents a deny implementation from being called credential
# collection.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: create-sensitive-path-policy-function
    desc: Defines sensitive-path enforcement policy
    if:
      type: function
      exact: createSensitivePathPolicy

  - id: safety-denial-decision
    desc: Returns a safety-motivated denial decision
    if:
      type: text
      regex: 'action:\s*["'']deny["''][\s\S]{0,240}decisionReason:\s*["'']safety["'']'

  # A path validator keeps its refused file names and extensions in constant
  # arrays named for the refusal and reports a failed check as a result object.
  # Both names and extensions are listed, so the arrays are the policy itself.
  - id: js-blocked-name-constant-arrays
    desc: Declares blocked file-name array
    if:
      type: text
      regex: '(?i)\w*BLOCKED_[nf][a-z]{4}\b\s*(:[^=]{1,40})?=\s*\['

  - id: js-blocked-extension-constant-arrays
    desc: Declares blocked file-extension array
    if:
      type: text
      regex: '(?i)\w*BLOCKED_EXTENSIONS\s*(:[^=]{1,40})?=\s*\['

  - id: js-invalid-path-result-objects
    desc: Returns repeated invalid-path result objects
    count_min: 3
    if:
      type: text
      regex: 'isValid\s*:\s*false'

composite_rules:
  - id: sensitive-path-deny-policy-context
    desc: Defensive sensitive-path denial policy context
    crit: exception
    conf: 0.99
    all:
      - id: create-sensitive-path-policy-function
      - id: safety-denial-decision

  # The enforcement half of the arrays above: a validator that refuses blocked
  # names is a guard, so quoting `.npmrc` or `.git` in its list is not a sweep.
  - id: js-path-validator-blocklist-context
    desc: JavaScript path validator refusing blocked file names
    crit: exception
    conf: 0.95
    all:
      - id: js-blocked-name-constant-arrays
      - id: js-blocked-extension-constant-arrays
      - id: js-invalid-path-result-objects
