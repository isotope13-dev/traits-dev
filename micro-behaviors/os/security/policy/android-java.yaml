# Android global-settings writes from Java/Kotlin source. Settings.Global /
# Settings.Secure writes need a privileged (system) caller; the package
# verifier keys decide whether Google Play Protect screens installs at all.
# The recorded XCPE routine is Settings.Global.putInt(cr,
# "package_verifier_user_consent", -1): the key names and the disabling
# values are platform constants, while the resolver variable and any
# wrapper method around the call vary freely. Long single regexes are
# decomposed into a write call plus a nearby key/value argument.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable

traits:
  - id: android-global-setting-write-call
    desc: Writes Android global or secure setting
    conf: 0.95
    if:
      type: text
      regex: 'Settings\.(Global|Secure)\.put(Int|Long|String|Float)\s*\('

  - id: android-package-verifier-key
    desc: Android package-verifier setting key
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"(package_verifier_\w+|verifier_verify_adb_installs)"'

  # -1 and 0 are the values that switch verification off; quoted forms
  # cover putString. Any other value stays the notable write below.
  - id: android-package-verifier-disable-argument
    desc: Package-verifier key set to disabling value
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '"(package_verifier_\w+|verifier_verify_adb_installs)"\s*,\s*"?(-1|0)"?\s*\)'

composite_rules:
  - id: android-package-verifier-setting-write
    desc: Writes Android package-verifier setting
    conf: 0.97
    near_bytes: 200
    all:
      - id: android-global-setting-write-call
      - id: android-package-verifier-key

  - id: android-package-verifier-disable-write
    desc: Disables Android package verification
    crit: suspicious
    conf: 0.98
    attack: T1629.003
    near_bytes: 200
    all:
      - id: android-global-setting-write-call
      - id: android-package-verifier-disable-argument
