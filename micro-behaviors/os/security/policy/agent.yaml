# Agent approval-policy values. A one-shot grant is a normal human UI action;
# it becomes a guardrail bypass only when code posts the grant back to the
# control plane from the agent's own managed environment.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: agent-one-shot-approval-outcome
    desc: Agent one-shot approval grant
    if:
      type: text
      regex: '(?i)\boutcome\b[\\"'']{0,3}\s*:\s*[\\"'']{0,3}allowed-once\b'
