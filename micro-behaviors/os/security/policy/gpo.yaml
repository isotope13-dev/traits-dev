# Neutral Group Policy management capability. Destructive intent is supplied
# by objective composites that combine policy editing with elevated task work.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]

traits:
  - id: backup-gpo-cmdlet
    desc: Backs up a Windows Group Policy object
    conf: 0.91
    if:
      type: text
      regex: '(?i)\bBackup-GPO\b'

  - id: new-gpo-cmdlet
    desc: Creates a Windows Group Policy object
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bNew-GPO\b'

  - id: new-gplink-cmdlet
    desc: Links a Windows Group Policy object
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bNew-GPLink\b'

  - id: set-gpregistryvalue-cmdlet
    desc: Writes a Group Policy registry value
    conf: 0.94
    attack: T1484.001
    if:
      type: text
      regex: '(?i)\bSet-GPRegistryValue\b'

  - id: sysvol-policies-share-path
    desc: SYSVOL Group Policy template path
    conf: 0.94
    for: [scripts, powershell, batch, c, cpp, csharp, go, rust, python]
    attack: T1484.001
    if:
      type: text
      regex: '(?i)\\\\[^\\\r\n]{1,120}\\+SYSVOL\\+[^\\\r\n]{1,120}\\+Policies\\+'

  - id: gpp-files-template-path
    desc: GPP Files configuration path
    conf: 0.94
    for: [scripts, powershell, batch, c, cpp, csharp, go, rust, python]
    attack: T1484.001
    if:
      type: text
      regex: '(?i)\bPreferences\\+Files\\+Files\.xml\b'

  - id: gpttmpl-security-template-path
    desc: GptTmpl security template path
    conf: 0.94
    for: [scripts, powershell, batch, c, cpp, csharp, go, rust, python]
    attack: T1484.001
    if:
      type: text
      regex: '(?i)\b(Microsoft\\+Windows NT\\+SecEdit\\+)?GptTmpl\.inf\b'

  - id: gpttmpl-disable-built-in-administrator
    desc: GptTmpl disables built-in Administrator account
    conf: 0.96
    for: [scripts, powershell, batch, c, cpp, csharp, go, rust, python]
    attack: T1531
    if:
      type: text
      regex: '(?is)\[System Access\].{0,512}\bEnableAdminAccount\s*=\s*0\b'

  - id: netlogon-share-path
    desc: References a NETLOGON UNC path
    conf: 0.9
    for: [scripts]
    attack: T1570
    if:
      type: text
      regex: '(?i)\\\\.{0,80}\\NETLOGON\\'

  - id: sysvol-scripts-share-path
    desc: References a SYSVOL scripts UNC path
    conf: 0.92
    for: [scripts]
    attack: T1570
    if:
      type: text
      regex: '(?i)\\\\[^\\\n]{0,120}\\SYSVOL\\[^\\\n]{0,120}\\scripts\\'
