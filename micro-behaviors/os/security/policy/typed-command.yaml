# These output arguments name the PowerShell execution-policy control and its
# Bypass setting; they do not establish process creation or a policy change.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.97

traits:
  - id: text-output-policy-bypass-option
    desc: Output call carries policy-bypass option
    for: [c, cpp, python]
    if:
      type: symbol
      kind: call
      regex: '\.(print(ln)?|write)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)-(ep|ExecutionPolicy)\s+Bypass\b'

  - id: ducky-policy-bypass-output
    desc: Keyboard script types policy-bypass option
    for: [text, powershell]
    if:
      type: text
      regex: '(?im)^STRING(LN)?[ \t]+[^\r\n]{0,200}-(ep|ExecutionPolicy)\s+Bypass\b'

composite_rules:
  - id: output-call-policy-bypass-option
    desc: Text output includes policy-bypass option
    for: [c, cpp, python, text, powershell]
    any:
      - id: text-output-policy-bypass-option
      - id: ducky-policy-bypass-output

  - id: output-call-hidden-policy-bypass
    desc: Output carries hidden and bypass options
    for: [c, cpp, python, text, powershell]
    # Both predicates retain the call/STRING start, so a one-byte window
    # requires the two options in the same output operation.
    near_bytes: 1
    all:
      - id: output-call-policy-bypass-option
      - id: micro-behaviors/process/argument/option::output-call-hidden-option
