# Legacy Windows Security Center configuration: the DisableNotify and
# Override value names silence the OS-level AV/firewall/update monitoring
# surface. The key path and value names are neutral references; the
# blinding composite in objectives/evasion/anti-av/blinding adds the write
# evidence.
defaults:
  for: [pe, dll, batch, powershell]
  platforms: [windows]
  crit: notable
  attack: T1562.001

traits:
  - id: security-center-key-path
    desc: Windows Security Center registry key path
    conf: 0.92
    if:
      type: text
      substr: SOFTWARE\Microsoft\Security Center
      case_insensitive: true

  - id: security-center-antivirus-values
    desc: Security Center antivirus notify values
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bAntiVirus(DisableNotify|Override)\b'

  - id: security-center-firewall-values
    desc: Security Center firewall notify values
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bFirewall(DisableNotify|Override)\b'

  - id: security-center-other-notify-values
    desc: Security Center update/UAC/spyware notify values
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(Updates|Uac|AntiSpyware)(DisableNotify|Override)\b'

composite_rules:
  - id: security-center-notify-values
    desc: Security Center notify/override values
    conf: 0.92
    any:
      - id: security-center-antivirus-values
      - id: security-center-firewall-values
      - id: security-center-other-notify-values
    needs: 2
