# The four fragments must occur in one bounded Base64 script span. This
# records policy/write vocabulary, not variable binding or runtime success.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: base64-uac-zero-write-script
    desc: Base64 UAC policy and zero-write script
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule base64_uac_zero_write_script {
          strings:
            $policy = "CurrentVersion\\Policies\\System" base64
            $name = "EnableLUA" base64
            $write = "Set-ItemProperty -Path " base64
            $zero = "-Value 0" base64
          condition:
            // Any non-.data section, not the overlay: dumped or repacked images
            // lose the original .rdata name but keep the embedded script.
            for any s in pe.sections : (
              s.raw_data_size > 0 and
              s.name != ".data" and
              for any p in (1..#policy) : (
                @policy[p] >= s.raw_data_offset and
                @policy[p] + 512 <= s.raw_data_offset + s.raw_data_size and
                for all of ($name, $write, $zero) : (
                  $ in (@policy[p] .. @policy[p] + 512)
                )
              )
            )
        }
