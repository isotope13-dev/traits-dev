defaults:
  platforms: [zos]
  for: [c, cpp, elf]

traits:
  - id: zos-access-check-bypass
    desc: Access-check bypass flag enabled
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: ACCESS_CHECK_BYPASS=1

  - id: zos-racroute-override
    desc: RACROUTE override flag enabled
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: RACROUTE_OVERRIDE=1

  - id: zos-audit-suppress
    desc: Audit-suppression flag enabled
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: AUDIT_SUPPRESS=1

