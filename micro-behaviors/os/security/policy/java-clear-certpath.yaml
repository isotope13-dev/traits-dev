defaults:
  platforms: [unix, windows]
  for: [java]
traits:
  - id: java-clear-certpath-algorithm-policy
    desc: Clears certificate-path algorithm restrictions
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: setProperty
      args:
        - index: 0
          kind: string
          exact: jdk.certpath.disabledAlgorithms
        - index: 1
          kind: string
          exact: ''
