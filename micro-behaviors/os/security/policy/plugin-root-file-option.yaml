defaults:
  platforms: [windows, unix]
  for: [powershell, batch]
traits:
  - id: powershell-plugin-root-bypass-file-text
    desc: Policy bypass File with plugin-root placeholder
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)-ExecutionPolicy\s+Bypass\s+-File\s+"?(<[A-Z_]+_DIR>|\$\{?CLAUDE_PLUGIN_ROOT)'
