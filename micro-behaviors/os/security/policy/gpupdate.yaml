defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [powershell, batch, scripts, pe]

traits:
  - id: invoke-gpupdate-force-cmdlet
    desc: Forces policy refresh via Invoke-GPUpdate
    if:
      type: text
      regex: '(?i)\bInvoke-GPUpdate\b[^\r\n]{0,80}\b-Force\b'
  - id: gpupdate-force-command
    desc: Forces a Group Policy refresh with gpupdate
    if:
      type: text
      regex: '(?i)\bgpupdate(\.exe)?[ \t]+/force\b'
  # A compiled program that spawns gpupdate stores the image name and the
  # switches as separate strings, so the adjacency the two traits above need
  # never holds there. Naming the executable is the observable part.
  - id: gpupdate-executable-reference
    desc: References the gpupdate executable
    if:
      type: text
      substr: gpupdate.exe

composite_rules:
  - id: gpupdate-force
    desc: Forces a Group Policy refresh
    any:
      - id: invoke-gpupdate-force-cmdlet
      - id: gpupdate-force-command
