defaults:
  platforms: [windows]
  for: [powershell, batch, scripts, pe]

traits:
  - id: invoke-gpupdate-force-cmdlet
    desc: Forces policy refresh via Invoke-GPUpdate
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bInvoke-GPUpdate\b[^\r\n]{0,80}\b-Force\b'
  - id: gpupdate-force-command
    desc: Forces a Group Policy refresh with gpupdate
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bgpupdate\b[ \t]+/force\b'

composite_rules:
  - id: gpupdate-force
    desc: Forces a Group Policy refresh
    crit: notable
    conf: 0.9
    any:
      - id: invoke-gpupdate-force-cmdlet
      - id: gpupdate-force-command
