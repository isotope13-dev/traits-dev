composite_rules:
- id: execution-policy-bypass
  for:
  - pe
  - batch
  - javascript
  - vbs
  - oledoc
  desc: PowerShell execution-policy override options
  conf: 0.95
  all:
  - id: micro-behaviors/process/argument/option::powershell-command-options-text
  any:
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
  - id: micro-behaviors/os/security/execution-policy::execution-policy-bypass-short-flag
  - id: micro-behaviors/os/security/execution-policy::execution-policy-bypass-abbrev-flag
  - id: micro-behaviors/os/security/execution-policy::execution-policy-override-flag
  - id: micro-behaviors/os/security/execution-policy::execution-policy-override-short-flag
  - id: micro-behaviors/os/security/policy::execution-policy-bypass-spellings
- id: execution-policy-bypass-spellings
  for:
  - javascript
  - vbs
  - batch
  - powershell
  - pe
  - oledoc
  desc: PowerShell policy Bypass token patterns
  conf: 0.9
  any:
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-token-sequence
  - id: micro-behaviors/os/security/execution-policy::execution-policy-bypass-concat-fragment
defaults:
  platforms:
  - windows
  attack: T1059.001
  crit: notable
