---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - documents
  size_max: 5000000
traits:
- id: blocked-sensitive-path-list
  desc: Defensive sensitive path blocklist
  crit: notable
  conf: 0.93
  for:
  - python
  if:
    type: text
    regex: "(?i)(blocked path patterns|_BLOCKED_PATH_PATTERNS|blocked.{0,80}(/etc/shadow|/etc/passwd))"
composite_rules:
- id: sensitive-dir-guard-comment
  desc: Sensitive-data guard comment
  crit: notable
  conf: 0.9
  all:
  - id: metadata/package/documentation/claims::prohibited-use-wording
  any:
  - id: micro-behaviors/data/string/redact::credential-dir-denylist-phrase
  - id: micro-behaviors/os/security/policy::blocked-sensitive-path-list
- id: defensive-sensitive-dir-denylist
  desc: Defensive sensitive-directory denylist guard
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/security/policy::sensitive-dir-guard-comment
  - id: micro-behaviors/data/string/redact::credential-dir-denylist-phrase
