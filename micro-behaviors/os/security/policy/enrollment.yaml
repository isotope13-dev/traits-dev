defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable
  conf: 0.96

traits:
  - id: windows-mdm-enrollment-uri
    desc: Windows MDM device-enrollment URI
    if:
      type: text
      regex: '(?i)\bms-device-enrollment:\?mode=mdm\b'

  - id: windows-enrollments-registry-path
    desc: Windows MDM Enrollments registry path
    if:
      type: text
      regex: '(?i)HKLM[:\\]+SOFTWARE\\Microsoft\\Enrollments\b'
