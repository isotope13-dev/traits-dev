defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: component
  conf: 0.94

traits:
  - id: bypass-safety-setting-enabled
    desc: Bypass-safety setting text with true value
    crit: notable
    conf: 0.96
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\b\w*bypass[_-]?(safety|guardrail)s?["'']?\s*[=:]\s*["'']?(1|true)["'']?(\s|[,}\]#;)]|$)'
