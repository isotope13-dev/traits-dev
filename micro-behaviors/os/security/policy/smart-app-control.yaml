defaults:
  platforms: [windows]
traits:
  - id: reg-smart-app-control-disable-command
    desc: reg command disables Smart App Control policy
    crit: notable
    conf: 0.98
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)/v\s+VerifiedAndReputablePolicyState\s+/t\s+REG_DWORD\s+/d\s+0\b'
