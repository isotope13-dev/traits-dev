defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: content-security-policy-reference
    desc: References Content Security Policy
    crit: component
    conf: 0.99
    if:
      type: text
      substr: Content-Security-Policy
  - id: trusted-types-text-replacement
    desc: Replaces text matching trusted-types
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\.replace\([^\r\n]{0,160}trusted-types'

composite_rules:
  - id: csp-and-trusted-types-replacement
    desc: CSP reference and trusted-types text replacement
    crit: notable
    conf: 0.96
    all:
      - id: content-security-policy-reference
      - id: trusted-types-text-replacement
