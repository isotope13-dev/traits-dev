defaults:
  platforms: [windows, unix]
  for: [scripts, source, text, data]

traits:
  - id: powershell-policy-bypass-assignment
    desc: ExecutionPolicy assignment requests Bypass
    crit: notable
    conf: 0.93
    if:
      type: text
      # Anchor the literal to an ExecutionPolicy assignment: a bare ="bypass" also
      # matches WAF ruleset actions (mitigate.action === "bypass"), proxy
      # modes, and other non-PowerShell comparisons.
      regex: '(?i)\bexecutionpolic\w*\s*[:=]\s*["'']?bypass\b'
    unless:
      # Tirith detector fixtures name the bypass assignments they catch.
      - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
