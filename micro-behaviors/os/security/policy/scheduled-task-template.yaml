defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch, go, csharp]
  crit: notable
traits:
  - id: gpp-scheduled-tasks-template-path
    desc: Group Policy scheduled-task preference path
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bMachine\\+Preferences\\+ScheduledTasks\b'
  - id: task-xml-system-principal
    desc: Task XML specifies the SYSTEM principal
    conf: 0.98
    if:
      type: text
      regex: '(?i)<UserId>\s*NT AUTHORITY\\System\s*</UserId>'
