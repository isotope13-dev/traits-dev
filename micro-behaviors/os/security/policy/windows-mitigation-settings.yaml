# Tuning and recovery software can change these controls legitimately.
# Match the configured value, rather than treating a policy-name reference
# as evidence that the protection is disabled.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: vbs-zero-dword-command-text
    desc: Command text sets VBS policy to zero
    if:
      type: text
      regex: '(?i)/v\s+"?EnableVirtualizationBasedSecurity"?\s+/t\s+REG_DWORD\s+/d\s+0(\s|$)'

  - id: cpu-mitigation-override-three-dword-spec
    desc: DWORD spec configures CPU mitigation override 3
    for: [powershell, pe, dll]
    if:
      # PE text extraction can omit a short hashtable row. This bounded
      # source-form match also requires its DWORD type and literal value.
      type: raw
      regex: '\bFeatureSettingsOverride["'']\s*;\s*T\s*=\s*["'']DWord["''];\s*V\s*=\s*3[;\s]*}'
