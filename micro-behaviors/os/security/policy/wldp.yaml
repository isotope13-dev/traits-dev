defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: csharp-wldp-dll-reference
    desc: C# reference to Windows Lockdown Policy DLL
    crit: notable
    conf: 0.92
    if:
      type: text
      word: wldp.dll
      case_insensitive: true
    unless:
      # Roslyn's ExpressionEvaluator test tree mentions this DLL without
      # calling it as an implementation of PowerShell policy enforcement.
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
