defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: vscode-markdown-command-trust
    desc: Grants VS Code Markdown command trust
    crit: notable
    conf: 0.96
    if:
      # MarkdownString.isTrusted=true permits command: links in rendered
      # extension content. Keep this neutral: trusted Markdown is legitimate
      # when the extension controls or safely encodes the rendered content.
      type: text
      regex: '(?s)new vscode(_[0-9]+)?\.MarkdownString\(\).{0,300}\.isTrusted\s*=\s*true'
