# A supported recovery/tuning operation as well as an abuse primitive.
# The Enabled value and zero data distinguish disabling from querying HVCI,
# enabling it, or changing the separate Locked value. No attacker intent.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: hvci-enabled-zero-command-text
    desc: Command text sets HVCI Enabled to zero
    if:
      type: text
      regex: '(?i)HypervisorEnforcedCodeIntegrity"\s+/v "Enabled" /t REG_DWORD /d 0\b'
