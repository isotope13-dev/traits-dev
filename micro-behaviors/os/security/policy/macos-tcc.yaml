# macOS TCC (Transparency, Consent and Control) policy constants.
#
# `kTCCService<Name>` is the identifier macOS uses to name a consent-gated
# capability — kTCCServiceSystemPolicyAllFiles for Full Disk Access,
# kTCCServiceAccessibility for input control, kTCCServiceScreenCapture,
# kTCCServiceCamera, and so on. Referencing one is neutral: permission-check
# helpers, MDM PPPC profile generators and privacy-audit tools all name these
# constants, as does anything that forges a consent record.
#
# Intent-bearing use (writing a grant row, restarting tccd to load it) is
# composed in objectives/evasion/tcc-manipulation/.
defaults:
  platforms: [macos]
  for: [scripts, source, binaries]
  attack: T1548

traits:
  - id: tcc-service-identifier
    desc: References a macOS TCC service identifier
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bkTCCService[A-Z][A-Za-z]{2,32}\b'

  - id: tcc-policy-namespace
    desc: References macOS TCC policy namespace
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: com.apple.TCC
