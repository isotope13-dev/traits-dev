defaults:
  platforms: [netscaler, appliance, unix]
  for: [java, class, jar]


traits:
  - id: java-allpermission-policy-text
    desc: Text contains Java AllPermission policy grant
    crit: notable
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: '(?i)\bpermission\s+java\.security\.AllPermission\s*;'
    # A Java Web Start client builds this grant as a MessageFormat template
    # (`grant codeBase "{0}"`). That is the launcher's policy text, not a
    # statement applied to the file that contains it.
    unless:
      - type: text
        regex: 'grant codeBase \\"\{0\}\\"'
