defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: component
  conf: 0.94

composite_rules:
  - id: safety-control-disable-setting
    desc: Safety-control disable setting text
    crit: notable
    conf: 0.96
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    any:
      - id: disable-safety-setting-enabled
      - id: bypass-safety-setting-enabled
      - id: skip-safety-setting-enabled
