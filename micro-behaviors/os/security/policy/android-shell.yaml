defaults:
  platforms: [unix, android]
  for: [shell]
  crit: notable
traits:
  - id: shell-android-disables-package-verifier
    desc: Disables Android package verification
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: settings
      args:
        - index: 0
          kind: identifier
          name: put
        - index: 1
          kind: identifier
          name: global
        - index: 2
          kind: identifier
          name_regex: '^(verifier_verify_adb_installs|package_verifier_enable|package_verifier_user_consent)$'
        - index: 3
          kind: number
          value: 0
  # The shell facts expose unary -1 as an expression, without its value.
  # Inspect the command node so quoted examples and nearby unrelated writes
  # cannot supply the disabling value. Keep the adb shell invocation form.
  - id: shell-android-disables-package-verifier-consent
    desc: Disables Android package verification
    crit: suspicious
    conf: 0.98
    attack: T1629.003
    if:
      type: tree-sitter
      language: bash
      query: |
        ((command) @evidence
          (#match? @evidence "^(adb(\\s+-[de]|\\s+-s\\s+[\\w.:-]+)?\\s+shell\\s+)?settings\\s+put\\s+global\\s+\\w+\\s+\\S+$")
          (#match? @evidence "\\s(package_verifier_(enable|user_consent)|verifier_verify_adb_installs)\\s+(-1|0)$"))
