defaults:
  platforms: [unix, android]
  for: [shell]
  crit: notable
traits:
  - id: shell-android-disables-package-verifier
    desc: Disables Android package verification
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: settings
      args:
        - index: 0
          kind: identifier
          name: put
        - index: 1
          kind: identifier
          name: global
        - index: 2
          kind: identifier
          name_regex: '^(verifier_verify_adb_installs|package_verifier_enable|package_verifier_user_consent)$'
        - index: 3
          kind: number
          value: 0
  # XCPE writes -1 rather than 0; in shell text that surfaces as a separate
  # unary-minus token the symbol matcher above does not bind, so match the
  # command text directly. The settings invocation must sit in command
  # position (line start, after a separator, or after `adb shell`) so that
  # documentation strings quoting the command do not match.
  - id: shell-settings-put-command-position
    desc: Android settings put in command position
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*|shell\s+)settings\s+put\s+'
  - id: shell-verifier-disable-arguments
    desc: Verifier key with disabling shell value
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(package_verifier_\w+|verifier_verify_adb_installs)\s+(-1|0)\b'

composite_rules:
  - id: shell-android-disables-package-verifier-consent
    desc: Disables Android package verification
    crit: suspicious
    conf: 0.98
    attack: T1629.003
    near_bytes: 100
    all:
      - id: shell-settings-put-command-position
      - id: shell-verifier-disable-arguments
