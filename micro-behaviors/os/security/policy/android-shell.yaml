defaults:
  platforms: [unix, android]
  for: [shell]
  crit: notable
traits:
  - id: shell-android-disables-package-verifier
    desc: Disables Android package verification
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: settings
      args:
        - index: 0
          kind: identifier
          name: put
        - index: 1
          kind: identifier
          name: global
        - index: 2
          kind: identifier
          name_regex: '^(verifier_verify_adb_installs|package_verifier_enable)$'
        - index: 3
          kind: number
          value: 0
