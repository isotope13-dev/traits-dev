defaults:
  platforms: [windows]
  for: [batch, powershell, scripts, pe, go, java, class, java_class]
traits:
- id: powershell-profile-disable-command
  desc: PowerShell disables Windows firewall profiles
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: Set-NetFirewallProfile.{0,80}-Enabled\s+\$?False
    case_insensitive: true
- id: powershell-profile-enable-command
  desc: PowerShell enables Windows firewall profiles
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: Set-NetFirewallProfile.{0,80}-Enabled\s+\$?True
    case_insensitive: true
- id: firewall-disabled-profile-inventory-query
  desc: Queries which firewall profiles are disabled
  crit: notable
  conf: 0.9
  if:
    type: text
    # The standard PowerShell inventory grammar for "profiles currently off",
    # as used by scripts that restore the prior state after a temporary
    # firewall change.
    regex: Where-Object\s*\{\s*\$_\.Enabled\s+-ne\s+\$true
    case_insensitive: true
- id: netsh-allprofiles-disable-command
  desc: Netsh all-profile firewall-disable command text
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: advfirewall\s+set\s+allprofiles\s+state\s+off
    case_insensitive: true
