defaults:
  platforms: [windows]
  for: [batch, powershell, scripts, pe, go, java, class, java_class]
traits:
- id: powershell-profile-disable-command
  desc: PowerShell disables Windows firewall profiles
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: Set-NetFirewallProfile.{0,80}-Enabled\s+\$?False
    case_insensitive: true
- id: netsh-allprofiles-disable-command
  desc: Netsh command disables all firewall profiles
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: advfirewall\s+set\s+allprofiles\s+state\s+off
    case_insensitive: true
