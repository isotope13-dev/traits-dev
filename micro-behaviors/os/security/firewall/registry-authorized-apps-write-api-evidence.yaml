# Firewall authorized-applications list configured through the registry
# write chain: the list location plus open/create and value-write API
# references. Co-occurrence alone does not bind the write to that path.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

composite_rules:
  - id: windows-firewall-authorizedapps-write-chain
    desc: Firewall authorized applications path with write API
    all:
      - id: micro-behaviors/os/firewall/registry-state::windows-firewall-authorizedapps-path
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
