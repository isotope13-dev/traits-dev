# Decode an actual command operand, then format its program path into the
# service-install script. No match depends on the chosen firewall-rule name.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-rolling-xor-inbound-program-allowance-format
    desc: Decodes and formats inbound firewall allowance
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_rolling_xor_inbound_program_allowance {
          strings:
            $prefix = { 8A C8 00 4E 6C ED F5 39 52 8B DD 0F 21 7A B5 F1 08 0D 92 D4 F6 28 63 BC C8 01 14 9C A0 E9 74 6F 91 C1 11 1D 6A AC F9 38 19 }
            $format = { 53 57 68 ?? ?? 00 00 68 ?? ?? ?? ?? 56 E8 ?? ?? ?? ?? 83 C4 14 50 8B 45 78 8D 84 05 A4 F6 FF FF 50 FF 15 ?? ?? ?? ?? }
            $key_setup = { BB C8 00 00 00 8D 85 ?? ?? ?? ?? 8D 7B 1C BE ?? ?? ?? ?? }
            $decoder = { 55 8B EC 8B 45 08 57 8B 7D 10 B1 01 85 FF 74 ?? 56 8B 75 0C 2B F0 8A 14 06 32 55 14 88 10 8A D1 02 55 18 F6 D9 00 55 14 40 4F 75 ?? 5E 8B 45 08 5F 5D C3 }
          condition:
            pe.machine == pe.MACHINE_I386 and
            for all of ($key_setup, $format, $decoder) : (
              for any sec in pe.sections : (
                sec.characteristics & pe.SECTION_MEM_EXECUTE != 0 and
                @ >= sec.raw_data_offset and @+! <= sec.raw_data_offset+sec.raw_data_size
              )
            ) and
            for any f in (1..#format) : (
              for any k in (1..#key_setup) : (
                @format[f] > @key_setup[k] and @format[f] < @key_setup[k]+512
              ) and
              $prefix at pe.rva_to_offset(uint32(@format[f]+8)-pe.image_base) and
              uint32(@format[f]+35) == pe.image_base+pe.import_rva("USER32.dll", "wsprintfA") and
              for any d in (1..#decoder) : (
                @format[f]+18+int32(@format[f]+14) == @decoder[d] and
                for any s in pe.sections : (
                  s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and
                  @decoder[d] >= s.raw_data_offset and
                  @format[f]+!format[f] <= s.raw_data_offset+s.raw_data_size
                )
              ) and
              for any p in (1..#prefix) : (
                pe.rva_to_offset(uint32(@format[f]+8)-pe.image_base) == @prefix[p] and
                for any n in (39..199) : (
                  (uint8(@prefix[p]+n+0) ^ ((0xe4+(n+0)*0xc8+(n+0)%2)&255)) == 32 and
                  (uint8(@prefix[p]+n+1) ^ ((0xe4+(n+1)*0xc8+(n+1)%2)&255)) == 100 and
                  (uint8(@prefix[p]+n+2) ^ ((0xe4+(n+2)*0xc8+(n+2)%2)&255)) == 105 and
                  (uint8(@prefix[p]+n+3) ^ ((0xe4+(n+3)*0xc8+(n+3)%2)&255)) == 114 and
                  (uint8(@prefix[p]+n+4) ^ ((0xe4+(n+4)*0xc8+(n+4)%2)&255)) == 61 and
                  (uint8(@prefix[p]+n+5) ^ ((0xe4+(n+5)*0xc8+(n+5)%2)&255)) == 105 and
                  (uint8(@prefix[p]+n+6) ^ ((0xe4+(n+6)*0xc8+(n+6)%2)&255)) == 110 and
                  (uint8(@prefix[p]+n+7) ^ ((0xe4+(n+7)*0xc8+(n+7)%2)&255)) == 32 and
                  (uint8(@prefix[p]+n+8) ^ ((0xe4+(n+8)*0xc8+(n+8)%2)&255)) == 97 and
                  (uint8(@prefix[p]+n+9) ^ ((0xe4+(n+9)*0xc8+(n+9)%2)&255)) == 99 and
                  (uint8(@prefix[p]+n+10) ^ ((0xe4+(n+10)*0xc8+(n+10)%2)&255)) == 116 and
                  (uint8(@prefix[p]+n+11) ^ ((0xe4+(n+11)*0xc8+(n+11)%2)&255)) == 105 and
                  (uint8(@prefix[p]+n+12) ^ ((0xe4+(n+12)*0xc8+(n+12)%2)&255)) == 111 and
                  (uint8(@prefix[p]+n+13) ^ ((0xe4+(n+13)*0xc8+(n+13)%2)&255)) == 110 and
                  (uint8(@prefix[p]+n+14) ^ ((0xe4+(n+14)*0xc8+(n+14)%2)&255)) == 61 and
                  (uint8(@prefix[p]+n+15) ^ ((0xe4+(n+15)*0xc8+(n+15)%2)&255)) == 97 and
                  (uint8(@prefix[p]+n+16) ^ ((0xe4+(n+16)*0xc8+(n+16)%2)&255)) == 108 and
                  (uint8(@prefix[p]+n+17) ^ ((0xe4+(n+17)*0xc8+(n+17)%2)&255)) == 108 and
                  (uint8(@prefix[p]+n+18) ^ ((0xe4+(n+18)*0xc8+(n+18)%2)&255)) == 111 and
                  (uint8(@prefix[p]+n+19) ^ ((0xe4+(n+19)*0xc8+(n+19)%2)&255)) == 119 and
                  (uint8(@prefix[p]+n+20) ^ ((0xe4+(n+20)*0xc8+(n+20)%2)&255)) == 32 and
                  (uint8(@prefix[p]+n+21) ^ ((0xe4+(n+21)*0xc8+(n+21)%2)&255)) == 112 and
                  (uint8(@prefix[p]+n+22) ^ ((0xe4+(n+22)*0xc8+(n+22)%2)&255)) == 114 and
                  (uint8(@prefix[p]+n+23) ^ ((0xe4+(n+23)*0xc8+(n+23)%2)&255)) == 111 and
                  (uint8(@prefix[p]+n+24) ^ ((0xe4+(n+24)*0xc8+(n+24)%2)&255)) == 103 and
                  (uint8(@prefix[p]+n+25) ^ ((0xe4+(n+25)*0xc8+(n+25)%2)&255)) == 114 and
                  (uint8(@prefix[p]+n+26) ^ ((0xe4+(n+26)*0xc8+(n+26)%2)&255)) == 97 and
                  (uint8(@prefix[p]+n+27) ^ ((0xe4+(n+27)*0xc8+(n+27)%2)&255)) == 109 and
                  (uint8(@prefix[p]+n+28) ^ ((0xe4+(n+28)*0xc8+(n+28)%2)&255)) == 61 and
                  (uint8(@prefix[p]+n+29) ^ ((0xe4+(n+29)*0xc8+(n+29)%2)&255)) == 34 and
                  (uint8(@prefix[p]+n+30) ^ ((0xe4+(n+30)*0xc8+(n+30)%2)&255)) == 37 and
                  (uint8(@prefix[p]+n+31) ^ ((0xe4+(n+31)*0xc8+(n+31)%2)&255)) == 115 and
                  (uint8(@prefix[p]+n+32) ^ ((0xe4+(n+32)*0xc8+(n+32)%2)&255)) == 34 and
                  (uint8(@prefix[p]+n+33) ^ ((0xe4+(n+33)*0xc8+(n+33)%2)&255)) == 32 and
                  (uint8(@prefix[p]+n+34) ^ ((0xe4+(n+34)*0xc8+(n+34)%2)&255)) == 101 and
                  (uint8(@prefix[p]+n+35) ^ ((0xe4+(n+35)*0xc8+(n+35)%2)&255)) == 110 and
                  (uint8(@prefix[p]+n+36) ^ ((0xe4+(n+36)*0xc8+(n+36)%2)&255)) == 97 and
                  (uint8(@prefix[p]+n+37) ^ ((0xe4+(n+37)*0xc8+(n+37)%2)&255)) == 98 and
                  (uint8(@prefix[p]+n+38) ^ ((0xe4+(n+38)*0xc8+(n+38)%2)&255)) == 108 and
                  (uint8(@prefix[p]+n+39) ^ ((0xe4+(n+39)*0xc8+(n+39)%2)&255)) == 101 and
                  (uint8(@prefix[p]+n+40) ^ ((0xe4+(n+40)*0xc8+(n+40)%2)&255)) == 61 and
                  (uint8(@prefix[p]+n+41) ^ ((0xe4+(n+41)*0xc8+(n+41)%2)&255)) == 121 and
                  (uint8(@prefix[p]+n+42) ^ ((0xe4+(n+42)*0xc8+(n+42)%2)&255)) == 101 and
                  (uint8(@prefix[p]+n+43) ^ ((0xe4+(n+43)*0xc8+(n+43)%2)&255)) == 115
                )
              )
            )
        }
