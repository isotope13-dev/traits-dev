defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: new-netfirewallrule
    desc: Creates a Windows firewall rule
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: New-NetFirewallRule
  - id: get-netfirewallrule
    desc: Queries Windows firewall rules
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: Get-NetFirewallRule
  - id: powershell-globally-open-port-add
    desc: PowerShell adds a Windows firewall open port
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.GloballyOpenPorts\.Add\s*\('
