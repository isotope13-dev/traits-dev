# Windows Credential Manager and Credential Vault API observations.
# Intent-level credential access belongs under objectives/credential-access;
# these rules only identify the native API mechanics.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: cred-enumerate
    desc: Enumerate stored Windows credentials
    if:
      type: symbol
      regex: "^CredEnumerate[AW]?$"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
  - id: cred-read
    desc: Read a single stored Windows credential
    if:
      type: symbol
      regex: "^CredRead[AW]?$"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
  - id: cred-free
    desc: Free a Windows credential buffer
    conf: 0.8
    if:
      type: symbol
      exact: CredFree
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
  - id: cred-write
    desc: Write a stored Windows credential
    if:
      type: symbol
      regex: "^CredWrite[AW]?$"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
  - id: cred-delete
    desc: Delete a stored Windows credential
    if:
      type: symbol
      regex: "^CredDelete[AW]?$"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
  - id: vault-open
    desc: Open a Windows credential vault
    if:
      type: symbol
      exact: VaultOpenVault
    unless:
      - id: well-known/lib/platform/windows-vault/
  - id: vault-enumerate
    desc: Enumerate Windows credential-vault items
    if:
      type: symbol
      exact: VaultEnumerateItems
    unless:
      - id: well-known/lib/platform/windows-vault/
  - id: vault-get-item
    desc: Retrieve a Windows credential-vault item
    if:
      type: symbol
      exact: VaultGetItem
    unless:
      - id: well-known/lib/platform/windows-vault/
