defaults:
  platforms: [windows]

traits:
- id: cmdkey-ip-credential-command
  desc: Cmdkey adds credentials for an IPv4 address
  crit: suspicious
  conf: 0.93
  for: [batch, powershell, text, html, javascript]
  if:
    type: text
    regex: '(?i)\bcmdkey(\.exe)?\s+/add:([1-9][0-9]{0,2}\.){3}[0-9]{1,3}\s+/user:\S{1,80}'
