defaults:
  platforms: [windows]
  for: [binaries, source, scripts]
  crit: notable
  conf: 0.98
traits:
  - id: office-data-credential-target
    desc: Versioned Office credential target prefix
    if:
      type: text
      regex: '\bMicrosoftOffice[0-9]{1,2}_Data:'
  - id: outlook-credential-target
    desc: Outlook Credential Manager target name
    if:
      type: text
      exact: Microsoft.Office.Outlook
  - id: windows-live-credential-target
    desc: Windows Live Credential Manager target prefix
    if:
      type: text
      substr: 'WindowsLive:target='
  - id: cred-enumerate-code-name
    desc: Credential enumeration API name in code
    for: [pe, dll]
    if:
      type: text
      regex: '^CredEnumerate[AW]?$'
      section: .text
composite_rules:
  - id: enumeration-api
    desc: Credential Manager enumeration API references
    any:
      - id: cred-enumerate
      - id: cred-enumerate-code-name
