defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: ps-cmdkey-list-command
    desc: PowerShell cmdkey list command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bcmdkey(\.exe)?\s+/list\b'

  - id: ps-cmdkey-output-parsing
    desc: PowerShell parses cmdkey output
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\^Target:\\s\*\(\.\*\)[\s\S]{0,220}\^Username:\\s\*\(\.\*\)'

  - id: powershell-credential-enumeration-pinvoke
    crit: notable
    conf: 0.98
    desc: Credential enumeration P/Invoke declaration
    if:
      type: text
      regex: '\[DllImport\([^\r\n]{0,120}EntryPoint\s*=\s*"CredEnumerate[AW]"'

  - id: powershell-credential-password-output-template
    crit: notable
    conf: 0.98
    desc: Credential-blob password output template
    if:
      type: literal
      regex: '\|\s*Password\s*\|\s*\$\(\$\w+\.CredentialBlob\)'

composite_rules:
  - id: ps-windows-credential-manager-list
    desc: Lists and parses Windows credential metadata
    crit: notable
    conf: 0.97
    all:
      - id: ps-cmdkey-list-command
      - id: ps-cmdkey-output-parsing
