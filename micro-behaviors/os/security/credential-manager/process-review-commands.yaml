defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.94

traits:
  - id: secret-manager-read-command
    desc: Reads secret manager value
    if:
      type: text
      regex: '(?i)\b(vault\s+kv\s+get|aws\b[^\n]{0,100}\bsecretsmanager\s+get-secret-value)\b'

  - id: credential-token-display-command
    desc: Displays package or service token
    if:
      type: text
      regex: '(?i)\b(gh\s+auth\s+token|npm\b[^\n]{0,80}\btoken\s+list)\b'

  - id: onepassword-secret-read-command
    desc: OnePassword reads or injects secret
    if:
      type: text
      regex: '(?i)\bop\s+(item\s+get|inject)\b'

