defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: keytar-get-password
    desc: Reads password through Keytar API
    if:
      type: symbol
      kind: call
      exact: keytar.getPassword
  - id: keytar-replace-password
    desc: Replaces password through Keytar API
    if:
      type: symbol
      kind: call
      exact: keytar.replacePassword
  - id: keytar-delete-password
    desc: Deletes password through Keytar API
    if:
      type: symbol
      kind: call
      exact: keytar.deletePassword
