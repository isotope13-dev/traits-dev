# The git credential protocol client: a tool asks the configured helper for a
# stored secret ("git credential fill|get", feeding "protocol=...\nhost=..."
# on stdin and reading "username=.../password=..." back). This is how gh, IDEs
# and release tooling obtain GitHub credentials for their own API calls, so a
# match is store access, not theft; the destination of any request that uses
# the secret decides intent.
defaults:
  platforms: [unix, windows]
  for: [python, shell, javascript, typescript, ruby, go, rust]
  crit: notable
  conf: 0.9

traits:
  - id: git-credential-helper-invocation
    desc: Invokes git credential helper for stored secret
    # Covers both the argv-list form ["git", "credential", "fill"] and the
    # shell form `git credential fill`; "get" is the older read verb.
    if:
      type: text
      regex: 'git["'']?\s*,?\s*["'']?credential["'']?\s*,?\s*["'']?(fill|get)\b'
