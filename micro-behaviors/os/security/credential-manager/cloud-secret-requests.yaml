defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: aws-secrets-manager-list-command
    desc: Constructs AWS secret enumeration request
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ListSecretsCommand$'
  - id: aws-secrets-manager-value-command
    desc: Constructs AWS secret value request
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetSecretValueCommand$'

  - id: gcp-secret-version-call
    desc: Calls GCP secret version access
    if:
      type: symbol
      kind: call
      regex: '(^|\.)accessSecretVersion$'

composite_rules:
  - id: cloud-secret-value-requests
    desc: Requests values from a cloud secret store
    any:
      - id: aws-secrets-manager-enumeration-and-read
      - id: gcp-secret-version-call
  - id: aws-secrets-manager-enumeration-and-read
    desc: Enumerates AWS secrets beside value requests
    near_bytes: 2048
    all:
      - id: aws-secrets-manager-list-command
      - id: aws-secrets-manager-value-command
