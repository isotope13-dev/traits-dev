# A call named storeCredentials persists a login the app already holds.
# Capture intent comes from the objective composite that also sees a UI field.
defaults:
  platforms: [android]
  for: [kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: kotlin-store-credential-call
    desc: Calls storeCredentials
    if:
      type: symbol
      kind: call
      regex: '(^|[.$])storeCredentials?$'
    unless:
      - id: metadata/package/files/included::jsii-metadata-basename
