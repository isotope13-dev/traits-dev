# Provider import plus a parsed storage read. This records co-occurrence,
# not a claim of credential theft or proof of the receiver's value provenance.
defaults:
  platforms: [android, ios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

composite_rules:
  - id: expo-secure-store-item-read
    desc: Expo SecureStore import and item read
    all:
      - id: metadata/import/npm/expo-secure-store
      - id: micro-behaviors/data/db/access::js-get-item-async-call
