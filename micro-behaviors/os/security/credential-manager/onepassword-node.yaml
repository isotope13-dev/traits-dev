defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: onepassword-cli-read-call
    desc: Node invokes 1Password secret read
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (_) @callee
          arguments: (arguments
            (string (string_fragment) @exe)
            (array . (string (string_fragment) @verb)))) @call
          (#match? @callee "(^|\\.)(execFileSync|execFile|spawnSync|spawn)$")
          (#match? @exe "(^|[/\\\\])op(\\.exe)?$")
          (#eq? @verb "read"))
