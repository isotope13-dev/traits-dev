defaults:
  platforms: [unix]
  for: [shell, python]
traits:
  - id: vmafd-local-client
    desc: Creates a local vmafd client
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '\bvmafd\.client\s*\(\s*["'']localhost["'']\s*\)'
  - id: machine-password-getter
    desc: Calls machine password retrieval method
    crit: suspicious
    if:
      type: text
      exclude_comments: true
      regex: '\.GetMachinePassword\s*\(\s*\)'
