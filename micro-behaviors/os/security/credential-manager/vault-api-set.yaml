# Vault APIs plus a decryptor do not bind decrypted data to a vault item.
# Neither a missing nor a malformed signature supplies that missing link.
# Keep the API and signature observations without claiming a credential dump.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.95

composite_rules:
  - id: vault-open-read-api-set
    desc: Vault-open and item-access API references
    all:
      - id: micro-behaviors/os/security/credential-manager::vault-open
    any:
      - id: micro-behaviors/os/security/credential-manager::vault-enumerate
      - id: micro-behaviors/os/security/credential-manager::vault-get-item
    unless:
      - id: well-known/lib/platform/windows-vault/
      - id: metadata/binary/vendor/
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member

  - id: unsigned-vault-decrypt-api-set
    desc: Unsigned PE with vault and decryptor references
    for: [pe, dll]
    all:
      - id: vault-open-read-api-set
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/lib/platform/windows-vault/

  - id: truncated-cert-vault-decrypt-api-set
    desc: Vault and decryptor references with truncated certificate table
    for: [pe, dll]
    all:
      - id: vault-open-read-api-set
      - id: metadata/binary/layout/checksum::cert-table-truncated
    any:
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/lib/platform/windows-vault/
