# freedesktop Secret Service (libsecret / GNOME Keyring) credential storage.
#
# This is the *userspace* credential store, distinct from the kernel keyring in
# linux.yaml: it is where Linux desktop applications keep account tokens and
# passwords, and therefore where a stealer goes to collect them. The read and
# the write are separated deliberately -- an application that saves its own
# login stores; one that enumerates and reads back secrets is doing what a
# credential harvester does, so the objective composites can require the lookup
# without the store.
#
# Both readings are neutral on their own: a Misskey client bundling
# flutter_secure_storage imports exactly these symbols to remember one account
# token, and nothing here reported it.
defaults:
  platforms: [linux]
  for: [elf, c, cpp, rust, go, python]
  crit: notable
  conf: 0.9

traits:
  - id: libsecret-password-store
    desc: Stores a secret via libsecret
    if:
      type: symbol
      regex: '^secret_password_storev?_sync$'

  - id: libsecret-password-lookup
    desc: Reads a secret via libsecret
    if:
      type: symbol
      regex: '^secret_password_lookupv?_sync$'

  - id: libsecret-password-clear
    desc: Removes a secret via libsecret
    if:
      type: symbol
      regex: '^secret_password_clearv?_sync$'
