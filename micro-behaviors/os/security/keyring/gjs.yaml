defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: glib-secret-tool-search
    desc: Runs a Secret Service search
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn_command_line_(a)?sync$'
      arg:
        index: 0
        from:
          # A concrete attribute/value search, excluding --help/--version.
          value: "^/bin/(ba)?sh -c 'secret-tool search (--all )?\\w+ [\\w.-]+ (2>/dev/null )?\\| *$"
