defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: glib-secret-tool-search
    desc: Runs a Secret Service search
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(GLib|imports\.gi\.GLib)\.spawn_command_line_(a)?sync$'
      arg:
        index: 0
        kind: string
        # One complete constant command, including concrete search attributes.
        regex: "^/bin/(ba)?sh -c 'secret-tool search (--all )?\\w+ [\\w.-]+ (2>/dev/null )?\\|"
