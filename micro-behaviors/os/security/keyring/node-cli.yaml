defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-secret-tool-lookup-call
    desc: Node invokes Secret Service lookup
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (_) @callee
          arguments: (arguments
            (string (string_fragment) @exe)
            (array . (string (string_fragment) @verb)))) @call
          (#match? @callee "(^|\\.)(execFileSync|execFile|spawnSync|spawn)$")
          (#match? @exe "(^|/)secret-tool$")
          (#eq? @verb "lookup"))
