# Linux kernel keyring insertion.  The rxrpc_s key type is the attacker-owned
# RxGK server secret described by the DirtyCBC proof of concept.
defaults:
  platforms: [linux]
  for: [c, cpp, elf]

traits:
  - id: rxrpc-server-keyring-insert
    desc: Adds an rxrpc_s Linux keyring secret
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\badd_key\s*\(\s*["'']rxrpc_s["'']'
