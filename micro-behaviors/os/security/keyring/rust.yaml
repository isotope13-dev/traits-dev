defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.96
traits:
  - id: rust-keyring-entry-create
    desc: Rust constructs an OS keyring entry
    if:
      type: symbol
      kind: call
      exact: keyring::Entry::new
  - id: rust-keyring-get-secret-call
    desc: Rust reads a keyring entry secret
    if:
      type: symbol
      kind: call
      regex: '\.get_secret$'
      receiver:
        from:
          call: '^keyring::Entry::new$'
          # Snafu's ResultExt adds error context without replacing the entry.
          through:
            - call: '^keyring::Entry::new\.context$'
              receiver: true
