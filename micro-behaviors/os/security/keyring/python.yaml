defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1555.003

traits:
  - id: browser-libsecret-schema
    desc: "Browser libsecret schema reference"
    # A schema or keyring label is an identity marker, not proof that a secret
    # was harvested.  Stronger composites still combine these atoms.
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: chrome_libsecret_os_crypt_password_v2
    unless:
      - id: well-known/lib/development/browser-cookie3/
  - id: browser-kwallet-service
    desc: "KWallet service reference"
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: org.kde.kwalletd5
  - id: browser-keys-wallet
    desc: "Browser keyring wallet labels"
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: Chrome Keys|Brave Keys
