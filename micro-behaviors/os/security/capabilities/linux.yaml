defaults:
  for:
    - elf
  platforms:
    - linux
  crit: baseline
traits:
  - id: cap-get-proc
    desc: cap_get_proc function
    conf: 0.75
    if:
      type: symbol
      exact: cap_get_proc
  - id: cap-set-proc
    desc: cap_set_proc function
    conf: 0.75
    if:
      type: symbol
      exact: cap_set_proc
  - id: cap-get-file
    desc: cap_get_file function
    conf: 0.6
    if:
      type: text
      substr: cap_get_file
  - id: cap-set-file
    desc: cap_set_file function
    conf: 0.6
    if:
      type: text
      substr: cap_set_file
  - id: cap-setuid
    desc: CAP_SETUID capability reference
    crit: notable
    conf: 0.85
    for:
      - elf
      - shell
      - python
      - ruby
    if:
      type: text
      regex: cap_setuid|setcap.{0,50}setuid

  - id: setcap-capability-assignment
    desc: References setcap capability assignment
    crit: notable
    conf: 0.95
    for: [go, shell]
    if:
      type: text
      regex: '\bsetcap\s+cap_[A-Za-z0-9_,]+\+[A-Za-z]+\b'

  - id: setcap-capability-removal
    desc: References setcap capability removal
    crit: notable
    conf: 0.95
    for: [go, shell]
    if:
      type: text
      regex: '\bsetcap\s+-r\b'
