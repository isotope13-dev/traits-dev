# cap_get/set_proc and cap_get/set_file are privilege operations, which
# TAXONOMY's `notable` row names explicitly, and they are rare in ELF. The file
# default was `baseline`, which ranked the syscall wrappers that actually read
# and change process capabilities *below* the sibling `cap-setuid`, a plain
# text mention of the same subject -- every other trait here is notable.
defaults:
  for:
    - elf
  platforms:
    - linux
  crit: notable
traits:
  - id: cap-get-proc
    desc: cap_get_proc function
    conf: 0.75
    if:
      type: symbol
      exact: cap_get_proc
  - id: cap-set-proc
    desc: cap_set_proc function
    conf: 0.75
    if:
      type: symbol
      exact: cap_set_proc
  - id: cap-get-file
    desc: cap_get_file function
    conf: 0.6
    if:
      type: text
      substr: cap_get_file
  - id: cap-set-file
    desc: cap_set_file function
    conf: 0.6
    if:
      type: text
      substr: cap_set_file
  - id: cap-setuid
    desc: CAP_SETUID capability reference
    crit: notable
    conf: 0.85
    for:
      - elf
      - shell
      - python
      - ruby
    if:
      type: text
      regex: cap_setuid|setcap.{0,50}setuid

  - id: setcap-capability-assignment
    desc: References setcap capability assignment
    crit: notable
    conf: 0.95
    for: [go, shell]
    if:
      type: text
      regex: '\bsetcap\s+cap_[A-Za-z0-9_,]+\s*[+=][A-Za-z]+\b'

  - id: setcap-capability-removal
    desc: References setcap capability removal
    crit: notable
    conf: 0.95
    for: [go, shell]
    if:
      type: text
      regex: '\bsetcap\s+-r\b'

  - id: systemd-capability-bounding-set
    desc: systemd service capability bounding set
    crit: notable
    conf: 0.95
    for: [shell, systemd-service]
    if:
      type: text
      # A unit directive, not a quoted grep needle that only asserts the line.
      regex: '(?m)^[ \t]*CapabilityBoundingSet='

  - id: systemd-ambient-capabilities
    desc: systemd service ambient capabilities
    crit: notable
    conf: 0.95
    for: [shell, systemd-service]
    if:
      type: text
      regex: '(?m)^[ \t]*AmbientCapabilities='

  - id: dac-override-capability-reference
    desc: References CAP_DAC_OVERRIDE capability
    crit: notable
    conf: 0.95
    for: [shell, systemd-service]
    if:
      type: text
      word: CAP_DAC_OVERRIDE

  - id: ptrace-capability-reference
    desc: References CAP_SYS_PTRACE capability
    crit: notable
    conf: 0.95
    for: [shell, systemd-service]
    if:
      type: text
      word: CAP_SYS_PTRACE

composite_rules:
  - id: systemd-broad-host-capabilities
    desc: systemd service grants broad filesystem and process capabilities
    crit: suspicious
    conf: 0.96
    for: [shell, systemd-service]
    all:
      - id: systemd-capability-bounding-set
      - id: systemd-ambient-capabilities
      - id: dac-override-capability-reference
      - id: ptrace-capability-reference
    unless:
      - id: well-known/dual-use/tunnel/clash-for-linux-install::clash-systemd-unit-template-context
      - id: well-known/dual-use/tunnel/clash-for-linux-install::clash-for-linux-install-context
      - id: well-known/app/infrastructure/kpanel/
