defaults:
  conf: 0.9
  platforms: [linux]
  for: [shell, python, javascript, ruby, c, cpp, go, rust]
  crit: notable

traits:
  - id: profile-disable-command
    desc: Disables an AppArmor profile with aa-disable
    if:
      type: text
      word: aa-disable

  - id: profile-remove-command
    desc: Removes an AppArmor profile with apparmor_parser
    if:
      type: text
      regex: 'apparmor_parser\s+-R\b'

  - id: service-stop-command
    desc: Stops the AppArmor service
    if:
      type: text
      regex: 'service\s+apparmor\s+stop|systemctl\s+(stop|disable)\s+apparmor'

  # Posture checkers query the status and report whether AppArmor is
  # disabled, advising the operator what to run; they stop nothing.
  - id: status-query-command
    desc: Queries AppArmor status
    if:
      type: text
      regex: 'systemctl\s+is-active\s+apparmor|apparmor_status|aa-status'

  # The same service stop, as a Dockerfile build instruction: it changes the
  # image being built, not the machine running the build.
  - id: container-build-service-disable
    desc: Container build step disables AppArmor
    if:
      type: text
      regex: '(?m)^\s*RUN\s+systemctl\s+(stop|disable)\s+apparmor\b'
