defaults:
  conf: 0.9
  platforms: [linux]
  for: [shell, python, javascript, ruby, c, cpp, go, rust]
  crit: notable

traits:
  - id: profile-disable-command
    desc: Disables an AppArmor profile with aa-disable
    if:
      type: text
      word: aa-disable

  - id: profile-remove-command
    desc: Removes an AppArmor profile with apparmor_parser
    if:
      type: text
      regex: 'apparmor_parser\s+-R\b'

  - id: service-stop-command
    desc: Stops the AppArmor service
    if:
      type: text
      regex: 'service\s+apparmor\s+stop|systemctl\s+(stop|disable)\s+apparmor'
