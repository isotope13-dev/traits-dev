traits:
- id: dll-name-substring
  desc: Contains the AMSI library name
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: amsi.dll
- id: scan-buffer-name-substring
  desc: Contains the AMSI buffer-scan export name
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: AmsiScanBuffer
composite_rules:
- id: library-and-scan-buffer-name-pair
  desc: AMSI library and buffer-scan names coexist
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/security/amsi::dll-name-substring
  - id: micro-behaviors/os/security/amsi::scan-buffer-name-substring
defaults:
  for:
  - pe
  - powershell
  - batch
  - vbs
  platforms:
  - windows
