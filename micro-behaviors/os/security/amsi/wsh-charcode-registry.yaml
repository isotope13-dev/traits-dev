# Security-relevant names spelled as String.fromCharCode decimal lists in
# WSH script, so the registry path or engine id never appears as text.
# Each atom is the decimal spelling of one name; separators may carry
# spaces.
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  conf: 0.92

traits:
  # "AmsiEnable" - the HKCU\Software\Microsoft\Windows Script\Settings value
  # that switches AMSI scanning of WSH scripts off when set to 0.
  - id: charcode-wsh-amsienable-name
    desc: Charcode spells the WSH AmsiEnable setting name
    crit: notable
    attack: T1562.001
    if:
      type: text
      regex: '65,\s*109,\s*115,\s*105,\s*69,\s*110,\s*97,\s*98,\s*108,\s*101'

  # "ETWEnabled" - the .NET Framework value that turns CLR ETW events off.
  - id: charcode-dotnet-etwenabled-name
    desc: Charcode spells the .NET ETWEnabled setting name
    crit: notable
    attack: T1562.006
    if:
      type: text
      regex: '69,\s*84,\s*87,\s*69,\s*110,\s*97,\s*98,\s*108,\s*101,\s*100'

  # "{F414C262" - the JScript engine CLSID passed to cscript -e: to run a
  # script under a fresh engine instance (or a non-.js file as JScript).
  - id: charcode-jscript-engine-clsid
    desc: Charcode spells the JScript engine CLSID
    crit: notable
    if:
      type: text
      regex: '123,\s*70,\s*52,\s*49,\s*52,\s*67,\s*50,\s*54,\s*50'

  - id: wsh-regwrite-dword-call
    desc: WSH writes a REG_DWORD registry value
    crit: notable
    if:
      type: text
      regex: '\.RegWrite\s*\([^;]{1,80}(82,\s*69,\s*71,\s*95,\s*68|["'']REG_DWORD)'
