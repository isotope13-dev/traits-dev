defaults:
  platforms: [windows]
  for: [lua]
  crit: notable
  conf: 0.98
traits:
  - id: lua-load-amsi-module
    desc: Lua loads the AMSI library
    if:
      type: symbol
      kind: call
      regex: '\.load$'
      arg:
        kind: string
        exact: amsi
  - id: lua-scan-buffer-name
    desc: Lua literal names AMSI buffer scanning
    if:
      type: literal
      exact: AmsiScanBuffer
