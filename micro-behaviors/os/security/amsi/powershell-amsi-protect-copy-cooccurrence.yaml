defaults:
  for: [powershell]
  platforms: [windows]

composite_rules:
  - id: powershell-amsi-protect-copy-cooccurrence
    desc: AMSI, protection and memory copy co-occur
    crit: suspicious
    conf: 0.9
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/security/amsi::scan-buffer-name-substring
      - id: micro-behaviors/mem/protect/modify/api-reference::powershell-virtualprotect-name
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
