# Variable seed and multiplier; complete decoded API name is verified.
# The arithmetic follows the native decoder, not precomputed ciphertext.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: index-mixed-xor-scan-buffer-name
    desc: Index-XOR concealed AmsiScanBuffer name
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule index_mixed_xor_scan_buffer_name {
          strings:
            $loop = { 41 69 C0 ?? ?? ?? ?? 49 8B D0 B9 ?? ?? ?? ?? 2B C8 8B C1 C1 E8 0F 33 C1 42 32 44 04 ?? 43 88 04 08 49 FF C0 48 8D 42 02 }
            $dword = { C7 44 24 ?? ?? ?? ?? ?? }
            $word = { 66 C7 44 24 ?? ?? ?? }
          condition:
            pe.is_pe and $loop and $dword and $word and
            for any section in (0..pe.number_of_sections-1) : (
              pe.sections[section].name == ".text" and
              for any l in (1..#loop) : (
                @loop[l] >= pe.sections[section].raw_data_offset and
                @loop[l] + !loop[l] <= pe.sections[section].raw_data_offset + pe.sections[section].raw_data_size and
                for all j in (0..13) : (
                  with state = (uint32(@loop[l]+11) - j*uint32(@loop[l]+3)) & 0xffffffff : (
                    with low = (0x6e61635369736d41 >> ((j%8)*8)) & 255, high = (0x726566667542 >> ((j%8)*8)) & 255 : (
                      (j < 12 and for any d in (1..#dword) : (
                        @dword[d] >= pe.sections[section].raw_data_offset and
                        @dword[d] >= @loop[l]-128 and @dword[d]+8 <= @loop[l] and
                        uint8(@dword[d]+3) == uint8(@loop[l]+28)+(j\4)*4 and
                        with decoded = uint8(@dword[d]+4+j%4) ^ ((state ^ (state >> 15)) & 255) : (
                          (j < 8 and decoded == low) or (j >= 8 and decoded == high)
                        )
                      )) or
                      (j >= 12 and for any w in (1..#word) : (
                        @word[w] >= pe.sections[section].raw_data_offset and
                        @word[w] >= @loop[l]-128 and @word[w]+7 <= @loop[l] and
                        uint8(@word[w]+4) == uint8(@loop[l]+28)+12 and
                        (uint8(@word[w]+5+j-12) ^ ((state ^ (state >> 15)) & 255)) == high
                      ))
                    )
                  )
                )
              )
            )
        }
