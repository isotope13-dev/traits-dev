defaults:
  platforms: [windows]
  for: [pyc]

traits:
  - id: pyc-amsi-scan-buffer-name
    desc: Bytecode references AmsiScanBuffer name
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: AmsiScanBuffer

composite_rules:
  - id: pyc-amsi-memory-api-cluster
    desc: Python bytecode references AMSI scanning and memory protection/copy API names
    crit: notable
    conf: 0.9
    all:
      - id: pyc-amsi-scan-buffer-name
      - id: micro-behaviors/mem/protect/modify::pyc-virtualprotect-name
      - id: "micro-behaviors/mem/copy::pyc-rtlmovememory-name"
