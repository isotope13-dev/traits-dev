defaults:
  platforms: [windows]
  for: [powershell, batch, csharp, pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: dll-reference
    desc: References Windows AMSI library
    if:
      type: text
      word: amsi.dll
      case_insensitive: true
    unless:
      - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context

  - id: scan-buffer-api
    desc: References AMSI buffer scanning API
    if:
      type: text
      word: AmsiScanBuffer
      case_insensitive: true
    unless:
      - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
  - id: dll-reference-utf16le
    desc: Wide AMSI library reference
    if:
      type: encoded
      encoding: wide
      substr: amsi.dll
    unless:
      - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
  - id: scan-buffer-api-utf16le
    desc: Wide AMSI scan API reference
    if:
      type: encoded
      encoding: wide
      substr: AmsiScanBuffer
      case_insensitive: true
    unless:
      - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context

composite_rules:
  - id: amsi-library-reference
    desc: AMSI library reference
    crit: notable
    conf: 0.95
    any:
      - id: dll-reference
      - id: dll-reference-utf16le
  - id: amsi-scan-buffer-reference
    desc: AMSI scan API reference
    crit: notable
    conf: 0.95
    any:
      - id: scan-buffer-api
      - id: scan-buffer-api-utf16le
