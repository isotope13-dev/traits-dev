defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: reads-php-disable-functions
    desc: Reads PHP disabled-functions setting
    if:
      type: symbol
      kind: call
      exact: ini_get
      arg:
        kind: string
        exact: disable_functions
  - id: reads-php-open-basedir
    desc: Reads PHP open_basedir setting
    if:
      type: symbol
      kind: call
      exact: ini_get
      arg:
        kind: string
        exact: open_basedir
  - id: reads-php-safe-mode
    desc: Reads PHP safe_mode setting
    if:
      type: symbol
      kind: call
      exact: ini_get
      arg:
        kind: string
        exact: safe_mode
  - id: reads-php-allow-url-include
    desc: Reads PHP URL-include setting
    if:
      type: symbol
      kind: call
      exact: ini_get
      arg:
        kind: string
        exact: allow_url_include
  - id: reads-php-suhosin-eval-restriction
    desc: Reads Suhosin eval restriction setting
    if:
      type: text
      substr: suhosin.executor.disable_eval

composite_rules:
  # Relocated from objectives/evasion/security-bypass/runtime, where it was
  # `suspicious` and named a "probe". Reading these settings is capability
  # detection, and a library that reads them usually does so to HONOR them --
  # apimatic's JsonMapper reads disable_functions and open_basedir to decide
  # whether it may call parse_ini_file on php.ini at all. The bypass intent
  # belongs to the composites that reference this alongside execution or
  # webshell context.
  - id: reads-multiple-php-restrictions
    desc: Reads multiple PHP runtime restriction settings
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: reads-php-disable-functions
      - id: reads-php-open-basedir
      - id: reads-php-safe-mode
      - id: reads-php-allow-url-include
      - id: reads-php-suhosin-eval-restriction
