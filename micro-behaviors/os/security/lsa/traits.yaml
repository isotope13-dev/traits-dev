defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.87
traits:
  - id: lsasrv-library-reference
    desc: References the Windows LSA server library
    conf: 0.92
    if:
      type: text
      regex: '(?i)\blsasrv\.dll\b'

  - id: lsa-systemfunction005
    desc: Calls the LSA secret decryption routine
    conf: 0.95
    attack: T1140
    if:
      type: symbol
      exact: SystemFunction005

  - id: samr-connect-api
    desc: Connects to the SAM remote protocol service
    conf: 0.95
    if:
      type: symbol
      exact: SamrConnect

  - id: samr-enumerate-domain-users
    desc: Enumerates SAM domain users through SAMR
    conf: 0.95
    attack: T1087.002
    if:
      type: symbol
      exact: SamrEnumerateUsersInDomain

  - id: samr-query-user-info
    desc: Queries SAM user records through SAMR
    conf: 0.95
    attack: T1087.002
    if:
      type: symbol
      exact: SamrQueryInformationUser

  - id: lsa-lookup-names
    desc: LSA internal name-to-SID lookup
    attack: T1087.001
    if:
      type: symbol
      exact: "LsaICLookupNames"
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
  - id: lsa-set-system-access
    desc: LSA account system access rights modify
    crit: suspicious
    conf: 0.9
    attack: T1078.001
    if:
      type: symbol
      exact: "LsaSetSystemAccessAccount"
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
    downgrade:
      any:
        - id: metadata/signed/platform/
  - id: lsa-open-policy
    desc: Open LSA policy database
    # Inherits the file's `notable`. Opening the LSA policy database is the
    # handle every credential-access path goes through, and its siblings here
    # are notable/suspicious; baseline is not "nearly every PE does it".
    conf: 0.8
    if:
      type: symbol
      exact: "LsaOpenPolicy"
  - id: lsa-query-information-policy
    desc: Query LSA policy settings
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: "LsaQueryInformationPolicy"

  - id: lsa-enumerate-logon-sessions
    desc: Enumerate Windows logon sessions
    crit: notable
    conf: 0.95
    attack: T1087
    if:
      type: symbol
      exact: LsaEnumerateLogonSessions

  - id: lsa-get-logon-session-data
    desc: Read LSA logon session data
    crit: notable
    conf: 0.95
    attack: T1087
    if:
      type: symbol
      exact: LsaGetLogonSessionData

  # Windows password-filter DLLs receive a new password in plaintext during
  # PasswordChangeNotify/PasswordFilter. The three callbacks are the stable
  # interface across implementations; the names are more portable than a
  # particular DLL or actor sample.
  - id: password-filter-initialize-change-notify
    desc: Windows password-filter initialization callback
    crit: notable
    conf: 0.96
    for: [csharp, c, cpp, powershell, pe, dll]
    if:
      type: symbol
      exact: InitializeChangeNotify

  - id: password-filter-change-notify
    desc: Windows password-change notification callback
    crit: notable
    conf: 0.97
    for: [csharp, c, cpp, powershell, pe, dll]
    if:
      type: symbol
      exact: PasswordChangeNotify

  - id: password-filter-validation-callback
    desc: Windows password-filter validation callback
    crit: notable
    conf: 0.96
    for: [csharp, c, cpp, powershell, pe, dll]
    if:
      type: symbol
      exact: PasswordFilter

  # The `type: symbol` traits above are blind to managed code. A .NET assembly
  # reaches Win32 through `[DllImport]`, and the target name lands in the
  # `#Strings` metadata heap rather than the PE import table, so filefacts
  # records one symbol (`_CorDllMain`) for the whole module and every symbol
  # matcher in the tree misses the P/Invoke. Seen on abuse.ch 1af33429697d,
  # whose entire content is an LSA policy P/Invoke wrapper and which scored
  # fifteen notables and nothing else.
  #
  # Read the same names out of the bytes instead. The struct names are the
  # discriminator: `LsaOpenPolicy` on its own can be a mention, but a module
  # carrying the marshalling layout for `LSA_OBJECT_ATTRIBUTES` has *declared*
  # the interop signature, which is a thing only code that calls it does.
  - id: managed-lsa-policy-interop
    desc: Managed code declares LSA policy interop
    # Notable, like its two neighbours. Microsoft's own
    # ExchangeOnlineManagement PowerShell module declares this interop, as does
    # every administration tool that manages service-account rights. Declaring
    # the signature is a capability; the conviction is in
    # `generated-name-managed-lsa-module`, which asks who is declaring it.
    crit: notable
    conf: 0.9
    for: [pe, dll, csharp]
    attack: T1003
    if:
      type: text
      regex: 'LSA_OBJECT_ATTRIBUTES|LSA_UNICODE_STRING'

  # The LSA operations that read or grant something, as opposed to opening a
  # handle. Text rather than symbol for the same managed-code reason as its
  # neighbour above: `LsaRetrievePrivateData` is where the machine account
  # password, service account passwords and cached secrets come from, and
  # `LsaAddAccountRights` is how an operator grants themselves SeDebug or
  # SeBackup before using it.
  - id: managed-lsa-privileged-operation
    desc: LSA secret or rights operation
    # Notable, not suspicious. The benign population is exactly the tools
    # whose job this is: SysinternalsSuite carries `LsaStorePrivateData`,
    # an AD administration MSI carries `LsaAddAccountRights`, and HTCondor's
    # source RPM carries both because it provisions service accounts. The
    # operation is not the finding; who is doing it, under what name, is.
    crit: notable
    conf: 0.9
    for: [pe, dll, csharp, c, cpp, powershell]
    attack: T1003,T1098
    if:
      type: text
      # `LsaEnumerateAccounts*` was in this alternation and is not in the
      # same class: it reads who holds a right, which installers do. It has
      # its own notable trait below. What is left here either reads a stored
      # secret or grants a right.
      regex: 'Lsa(RetrievePrivateData|StorePrivateData|AddAccountRights)'

  # Which accounts hold a given privilege -- the query an operator runs after
  # landing, to find the account worth stealing. Missing entirely: the file
  # knows the logon-session and policy calls but not the rights enumeration.
  - id: lsa-enumerate-accounts-with-right
    desc: Enumerate accounts holding a privilege
    # Notable, not suspicious: three Notepad++ MSI installers carry this call,
    # because granting a service account a right means first asking who has
    # it. The operator's use of it looks identical; what separates them is the
    # company it keeps, which is the composite's job.
    crit: notable
    conf: 0.92
    for: [pe, dll, csharp, c, cpp, powershell]
    attack: T1087.001,T1069
    if:
      type: text
      substr: LsaEnumerateAccountsWithUserRight

composite_rules:
  - id: password-filter-callback-set
    desc: Complete Windows password-filter callback set
    crit: suspicious
    conf: 0.98
    for: [csharp, c, cpp, powershell, pe, dll]
    all:
      - id: password-filter-initialize-change-notify
      - id: password-filter-change-notify
      - id: password-filter-validation-callback
