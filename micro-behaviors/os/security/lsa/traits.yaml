defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.87
traits:
  - id: lsa-lookup-names
    desc: LSA internal name-to-SID lookup
    attack: T1087.001
    if:
      type: symbol
      exact: "LsaICLookupNames"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: lsa-set-system-access
    desc: LSA account system access rights modify
    crit: suspicious
    conf: 0.9
    attack: T1078.001
    if:
      type: symbol
      exact: "LsaSetSystemAccessAccount"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
    downgrade:
      any:
        - id: metadata/signed/platform/
  - id: lsa-open-policy
    desc: Open LSA policy database
    # Inherits the file's `notable`. Opening the LSA policy database is the
    # handle every credential-access path goes through, and its siblings here
    # are notable/suspicious; baseline is not "nearly every PE does it".
    conf: 0.8
    if:
      type: symbol
      exact: "LsaOpenPolicy"
  - id: lsa-query-information-policy
    desc: Query LSA policy settings
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: "LsaQueryInformationPolicy"

  - id: lsa-enumerate-logon-sessions
    desc: Enumerate Windows logon sessions
    crit: notable
    conf: 0.95
    attack: T1087
    if:
      type: symbol
      exact: LsaEnumerateLogonSessions

  - id: lsa-get-logon-session-data
    desc: Read LSA logon session data
    crit: notable
    conf: 0.95
    attack: T1087
    if:
      type: symbol
      exact: LsaGetLogonSessionData

  # Windows password-filter DLLs receive a new password in plaintext during
  # PasswordChangeNotify/PasswordFilter. The three callbacks are the stable
  # interface across implementations; the names are more portable than a
  # particular DLL or actor sample.
  - id: password-filter-initialize-change-notify
    desc: Windows password-filter initialization callback
    crit: notable
    conf: 0.96
    for: [csharp, c, cpp, powershell, pe, dll]
    if:
      type: symbol
      exact: InitializeChangeNotify

  - id: password-filter-change-notify
    desc: Windows password-change notification callback
    crit: notable
    conf: 0.97
    for: [csharp, c, cpp, powershell, pe, dll]
    if:
      type: symbol
      exact: PasswordChangeNotify

  - id: password-filter-validation-callback
    desc: Windows password-filter validation callback
    crit: notable
    conf: 0.96
    for: [csharp, c, cpp, powershell, pe, dll]
    if:
      type: symbol
      exact: PasswordFilter

composite_rules:
  - id: password-filter-callback-set
    desc: Complete Windows password-filter callback set
    crit: suspicious
    conf: 0.98
    for: [csharp, c, cpp, powershell, pe, dll]
    all:
      - id: password-filter-initialize-change-notify
      - id: password-filter-change-notify
      - id: password-filter-validation-callback
