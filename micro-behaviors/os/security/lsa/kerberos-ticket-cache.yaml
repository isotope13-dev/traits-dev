# Kerberos ticket-cache messages sent through LsaCallAuthenticationPackage.
# Native callers pass the KERB_PROTOCOL_MESSAGE_TYPE as an integer, so these
# names only survive in managed metadata, PowerShell Add-Type blocks and
# source. Each name is a capability on its own: klist retrieves tickets,
# Kerberos.NET submits them, and P/Invoke catalogs declare all of them.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp, powershell]
  crit: notable
  attack: T1558

traits:
  - id: kerb-submit-ticket-message
    desc: Kerberos ticket-submit LSA message
    conf: 0.95
    attack: T1550.003
    if:
      type: text
      regex: '\b(KERB_SUBMIT_TKT_REQUEST|KerbSubmitTicketMessage)\b'

  - id: kerb-retrieve-ticket-message
    desc: Kerberos encoded-ticket retrieve LSA message
    conf: 0.95
    if:
      type: text
      regex: '\b(KERB_RETRIEVE_TKT_REQUEST|KerbRetrieveEncodedTicketMessage)\b'

  - id: lsa-call-authentication-package-name
    desc: Names LsaCallAuthenticationPackage
    conf: 0.93
    if:
      type: text
      word: LsaCallAuthenticationPackage

  # Managed callers often bind LSA exports to delegates at runtime, so the
  # name is text rather than an import symbol, and often decorated
  # (_LsaEnumerateLogonSessions, LsaEnumerateLogonSessionsDelegate).
  - id: lsa-enumerate-logon-sessions-name
    desc: Names LsaEnumerateLogonSessions
    crit: component
    conf: 0.93
    attack: T1087
    if:
      type: text
      substr: LsaEnumerateLogonSessions

composite_rules:
  # Imported (symbol) or runtime-bound (text) session enumeration; each
  # surface reaches binaries the other cannot.
  - id: lsa-enumerate-logon-sessions-any
    desc: Enumerates logon sessions by import or binding
    crit: notable
    conf: 0.93
    attack: T1087
    any:
      - id: lsa-enumerate-logon-sessions
      - id: lsa-enumerate-logon-sessions-name
