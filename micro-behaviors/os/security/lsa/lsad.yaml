defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  # These operations require a caller-provided, authorized RPC session.
  # Neither exposing them nor granting caller-specified rights proves theft
  # or privilege escalation. Match request-to-dispatch flow, not declarations.
  - id: lsar-query-secret-rpc
    desc: Sends an LSA secret query RPC
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      arg:
        index: 0
        from:
          call: '^LsarQuerySecret$'

  - id: lsar-retrieve-private-data-rpc
    desc: Sends an LSA private-data retrieval RPC
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      arg:
        index: 0
        from:
          call: '^LsarRetrievePrivateData$'

  - id: lsar-add-account-rights-rpc
    desc: Sends an LSA account-right grant RPC
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      arg:
        index: 0
        from:
          call: '^LsarAddAccountRights$'

  - id: lsar-set-security-object-rpc
    desc: Sends an LSA security-descriptor update RPC
    if:
      type: symbol
      kind: call
      regex: '\.request$'
      arg:
        index: 0
        from:
          call: '^LsarSetSecurityObject$'
