defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: lsa-retrieve-private-data-import
    desc: Imports LSA private-secret retrieval
    crit: notable
    conf: 0.98
    if:
      type: import
      exact: LsaRetrievePrivateData

  # RAS keeps saved dial-up and VPN passwords as LSA private data under these
  # fixed secret names: the machine-wide default entry and the per-user
  # `RasDialParams!<SID>#0` record. Naming them is what a RAS password reader
  # passes to LsaRetrievePrivateData; Windows' own rasapi32 carries them too.
  - id: ras-credential-secret-name
    crit: notable
    desc: Names a RAS dial-up credential LSA secret
    conf: 0.95
    attack: T1003.004
    if:
      type: text
      regex: 'L\$_RasDefaultCredentials#0|RasDialParams!(%s|%ws|S-1-5-)'

  # The same names recovered only after decoding: a reader that hides which
  # secret it opens. Observation only; the objective decides intent.
  - id: ras-credential-secret-name-encoded
    crit: notable
    desc: Encoded RAS credential LSA secret name
    conf: 0.95
    attack: T1003.004
    if:
      type: encoded
      # Text-transform encodings only: UTF-16 storage is how Windows keeps
      # this name in the clear, so wide/utf16 forms are not concealment.
      encoding: [xor, base64, base64-obf, hex, base32, base85, stack]
      regex: 'L\$_RasDefaultCredentials#0|RasDialParams!(%s|%ws|S-1-5-)'

  - id: lsa-free-memory-import
    crit: notable
    desc: Imports the LSA buffer release routine
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: LsaFreeMemory
