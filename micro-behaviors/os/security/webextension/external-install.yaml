# Fields Chromium reads when an extension is registered from outside the Web
# Store -- from the `External Extensions` JSON drop directory or the external
# extension registry key. `external_update_url` points the browser at an update
# manifest of the installer's choosing; `external_crx` names a packaged CRX on
# disk. Both are documented deployment fields, so they are neutral on their
# own; the objective composites supply the intent.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data]
  crit: notable
  conf: 0.93
  attack: T1176

traits:
  - id: external-extension-update-url-field
    desc: Chromium external extension update URL field
    if:
      type: text
      word: external_update_url

  - id: external-extension-crx-field
    desc: Chromium external extension CRX path field
    if:
      type: text
      word: external_crx
