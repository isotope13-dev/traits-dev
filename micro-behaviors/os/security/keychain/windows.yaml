# Keytar is a cross-platform native keychain add-on.  The Windows
# Credential Manager and Credential Vault APIs are defined separately under
# micro-behaviors/os/security/credential-manager.
defaults:
  for: [pe, dll, elf, macho]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9

traits:
  - id: keytar-native-addon-symbol
    desc: Keytar native credential addon symbol
    crit: notable
    conf: 0.98
    if:
      type: symbol
      regex: '(?i)(node|napi)_register_module_keytar|Java_.*keytar|ZN6keytar'

  - id: keytar-node-pdb-path
    desc: Keytar native credential addon PDB path
    crit: notable
    conf: 0.98
    for: [pe, dll]
    if:
      type: value
      path: pe.debug.pdb.path
      regex: '(?i)[\\/]node-keytar[\\/].*keytar\.pdb$'

composite_rules:
  - id: keytar-native-addon
    desc: Keytar native credential addon
    crit: notable
    conf: 0.98
    any:
      - id: keytar-native-addon-symbol
      - id: keytar-node-pdb-path
