# Scriptable exposes keychain storage through this API.
# These calls do not establish access to another application's secrets.
defaults:
  for: [javascript]
  platforms: [ios]
  crit: notable

traits:
  - id: javascript-keychain-get
    desc: Calls Keychain.get to read a value
    if:
      type: symbol
      kind: call
      exact: Keychain.get

  - id: javascript-keychain-set
    desc: Calls Keychain.set to store a value
    if:
      type: symbol
      kind: call
      exact: Keychain.set

  - id: javascript-keychain-remove
    desc: Calls Keychain.remove to delete a value
    if:
      type: symbol
      kind: call
      exact: Keychain.remove
