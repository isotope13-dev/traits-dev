defaults:
  platforms: [macos]
  for: [java, kotlin]
  crit: notable
  conf: 0.98

# Constructor argv configures a query; start and success remain unproved.
traits:
  - id: jvm-safe-storage-output-first-query
    desc: Safe Storage password query with -w first
    if:
      type: symbol
      kind: call
      regex: '(^|[.])ProcessBuilder$'
      args:
        - {index: 0, kind: string, regex: '^(/usr/bin/)?security$'}
        - {index: 1, kind: string, exact: find-generic-password}
        - {index: 2, kind: string, exact: '-w'}
        - {index: 3, kind: string, exact: '-s'}
        - {index: 4, kind: string, regex: '^(Chrome|Chromium) Safe Storage$'}

  - id: jvm-safe-storage-service-first-query
    desc: Safe Storage password query with -s first
    if:
      type: symbol
      kind: call
      regex: '(^|[.])ProcessBuilder$'
      args:
        - {index: 0, kind: string, regex: '^(/usr/bin/)?security$'}
        - {index: 1, kind: string, exact: find-generic-password}
        - {index: 2, kind: string, exact: '-s'}
        - {index: 3, kind: string, regex: '^(Chrome|Chromium) Safe Storage$'}
        - {index: 4, kind: string, exact: '-w'}

composite_rules:
  - id: jvm-safe-storage-password-query
    desc: Configures browser Safe Storage password query
    any:
      - id: jvm-safe-storage-output-first-query
      - id: jvm-safe-storage-service-first-query
