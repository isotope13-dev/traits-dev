# `security find-generic-password -w` prints the stored secret itself rather
# than the item attributes. Ruby string text, possibly split across a `\`
# continuation; the service the query targets is left to consumers.
defaults:
  for: [ruby]
  platforms: [macos]

traits:
  - id: ruby-security-password-print-command
    desc: Ruby security CLI prints a keychain secret
    crit: notable
    conf: 0.92
    attack: T1555.001
    if:
      type: text
      exclude_comments: true
      regex: 'security\s+find-generic-password\s+[^\n"''|;]{0,40}-w\b'
