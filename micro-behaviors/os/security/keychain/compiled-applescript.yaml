# Require a decoded shell-call argument, not a string merely present in the
# compiled script. Both common orderings of the service and output flags work.
defaults:
  for: [applescript]
  platforms: [macos]
traits:
  - id: scpt-chrome-safe-storage-query
    desc: Compiled AppleScript queries Chrome Safe Storage
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: syso.exec
      arg:
        index: 0
        kind: string
        regex: '^security[ \t]+find-generic-password[ \t]+(-w[ \t]+-s[ \t]+["'']?Chrome Safe Storage|-s[ \t]+["'']?Chrome Safe Storage["'']?[ \t]+-w)\b'
