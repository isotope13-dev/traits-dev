defaults:
  platforms: [ios]
  for: [lua]
traits:
  - id: lua-find-generic-password-call
    desc: Lua executes security keychain lookup
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        ((function_call
          name: (dot_index_expression table: (identifier) @module field: (identifier) @method)
          arguments: (arguments (string content: (string_content) @command))) @call
          (#eq? @module "os")
          (#eq? @method "execute")
          (#match? @command "(^|[[:space:]])security[[:space:]]+find-generic-password\\b"))
