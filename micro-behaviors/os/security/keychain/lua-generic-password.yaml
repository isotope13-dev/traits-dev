defaults:
  crit: hostile
  platforms: [ios]
  for: [lua]
  attack: T1041,T1555.001

traits:
  # ios-gamecenter-keychain-targeting (objectives/credential-access/gaming/
  # mobile) is for: [javascript] only -- its find-generic-password leg is a
  # JS-specific tree-sitter AST query (`_runNative(...)`), structurally bound
  # to the JavaScript grammar and not portable to Lua -- so it was
  # ft-impossible on Lua. This local atom carries the same bare-command
  # evidence as a plain text match instead.
  - id: lua-find-generic-password-call
    desc: Lua invokes keychain generic-password lookup
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: find-generic-password
