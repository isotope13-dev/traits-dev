defaults:
  for: [shell]
  platforms: [macos]
  crit: notable
  conf: 0.96

traits:
  - id: shell-safe-storage-password-stdout
    desc: Queries a Safe Storage password on stdout
    unless:
      # A stdout redirect discards the password before command substitution
      # can capture it. Do not confuse this with the common 2>/dev/null form.
      - type: text
        regex: '(?m)security[^\n]{0,160}find-generic-password[^\n]{0,160}[^2]>[ \t]*/dev/null'
      - type: symbol
        kind: function
        exact: security
    if:
      type: symbol
      kind: call
      regex: '^(/usr/bin/)?security$'
      args:
        - index: 0
          kind: identifier
          name: find-generic-password
        - index: 1
          kind: identifier
          name: -w
        - index: 2
          kind: identifier
          name: -s
        - index: 3
          kind: string
          regex: '^[A-Z][A-Za-z ]{2,40} Safe Storage$'
