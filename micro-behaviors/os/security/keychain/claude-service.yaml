defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, -beam, -wasm, -class]
  crit: notable
traits:
  # The macOS generic-password item Claude Code persists its OAuth token
  # under (`security find-generic-password -s "Claude Code-credentials"`).
  # Tools that read the stored token spell the service name; its presence is
  # a store reference, not a read.
  - id: claude-code-keychain-service-name
    desc: Claude Code macOS keychain service name
    conf: 0.95
    if:
      type: text
      substr: 'Claude Code-credentials'

  # The read that prints the stored secret (`-w`). Unlike the service name
  # above, this is an acquisition of the Claude Code OAuth token.
  - id: claude-code-keychain-token-read
    desc: Reads Claude Code keychain token
    conf: 0.96
    attack: T1555.001
    if:
      type: text
      regex: 'find-generic-password -s ["'']?Claude Code-credentials["'']? -w'

