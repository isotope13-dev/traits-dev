# The browser's own password manager, reached through the WebExtension
# `browser.logins` API rather than by reading the store off disk. Firefox
# exposes it to privileged extensions; an extension that calls it is asking
# the browser for saved credentials directly, with no SQLite parsing or
# Safe Storage decryption in between.
defaults:
  attack: T1555.003
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: webextension-logins-get-all
    desc: Enumerates saved browser logins
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(chrome|browser)\.logins\.(getAll|search|getAllLogins)$'
