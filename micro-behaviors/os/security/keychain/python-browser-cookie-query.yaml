# These independent operations describe browser-session access, not exfiltration.
defaults:
  for: [python]
  platforms: [macos]
composite_rules:
  - id: python-browser-cookie-sql-and-safe-storage-query
    desc: Encrypted-cookie SQL and Safe Storage query
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/db/access::chromium-encrypted-cookie-sql
      - id: micro-behaviors/os/security/keychain::chrome-safe-storage-query
