defaults:
  platforms: [macos]
  for: [applescript]
  crit: notable
  conf: 0.95

traits:
  - id: applescript-chrome-safe-storage-call
    desc: Shell command references Chrome Safe Storage
    if:
      type: symbol
      kind: call
      exact: syso.exec
      arg:
        index: 0
        kind: string
        substr: Chrome Safe Storage

  - id: generic-password-partition-list-command
    desc: Generic password access-partition command
    for: [scripts, source, macho]
    if:
      type: literal
      kind: string
      substr: security set-generic-password-partition-list

  - id: partition-list-teamid-grant
    desc: Keychain partition-list grants a team ID
    for: [scripts, source, macho]
    # A partition-list ACL that names a specific developer team ID grants that
    # signer silent access to the stored secret. Benign keychain-prompt fixes
    # grant only apple:/apple-tool:, never a third-party teamid.
    if:
      type: text
      regex: 'teamid:[A-Z0-9]{10}'
