traits:
- for:
  - applescript
  - javascript
  - python
  - shell
  platforms:
  - macos
  id: chrome-safe-storage-query
  desc: Contains Chrome Safe Storage query text
  conf: 0.95
  unless:
  - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-crypto-helper
  - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-workflow
  - id: well-known/app/ai/coding-agent/kombai::kombai-browser-session-import-context
  if:
    type: text
    regex: find-generic-password.{0,80}Chrome Safe Storage
- platforms:
  - ios
  - macos
  for:
  - python
  id: python-find-generic-password
  desc: Python reads a named macOS Keychain item
  conf: 0.9
  if:
    type: tree-sitter
    kind: call
    regex: subprocess\.run\([\s\S]{0,260}find-generic-password
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: well-known/app/ai/agent-runtime/bobi/
  - id: well-known/tool/development/testing/specterqa-ios::specterqa-ios-context
  - type: text
    substr: '[REDACTED]'
defaults:
  crit: notable
