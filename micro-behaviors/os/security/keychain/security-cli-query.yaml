# The `security` CLI reading one keychain password — the operational form of
# the store references in fs/path/credential/ai-agent-auth, embedded in
# compiled artifacts. Scripted and source spellings of the same command are
# owned by macos-keychain-generic-password-command-reference next door; a
# single targeted query (as opposed to the paired dump in
# objectives/credential-access/keychain/extract) stays a capability here, so
# intent is left to the objectives composites. The platform umbrella (not a
# macOS gate) keeps cross-compiled bundles that embed the query in scope.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.88

traits:
  - id: security-cli-keychain-password-query
    desc: Security CLI reads a keychain password
    if:
      type: text
      regex: 'find-(generic|internet)-password'

composite_rules:
  # The query bound to the coding-agent credential store it targets: embedders
  # of both literals read (or offer to read) Claude Code's stored OAuth token.
  - id: coding-agent-keychain-credential-query
    desc: Queries the Claude Code keychain credential
    all:
      - id: security-cli-keychain-password-query
      - id: micro-behaviors/os/security/keychain::claude-code-keychain-service-name
