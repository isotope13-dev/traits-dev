defaults:
  attack: T1555.001
  mbc: T1555.001
  for: [scripts, binaries]
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  - id: macos-keychain-dump-command
    desc: macOS keychain dump utility command reference
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [shell, python, javascript, typescript, applescript, lua, ruby]
    if:
      type: literal
      kind: string
      substr: security dump-keychain
  - id: macos-keychain-generic-password-command-reference
    desc: macOS generic-password command ref
    crit: notable
    conf: 0.94
    platforms: [macos]
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exact: find-generic-password
  # `security(1)` subcommands. These are the CLI spelling of the SecKeychain*
  # APIs below and are what scripted and compiled macOS malware actually
  # invokes. Neutral on their own — build/signing pipelines unlock keychains
  # and add codesigning credentials — so the intent-bearing combinations live
  # in objectives/ composites.
  - id: macos-keychain-unlock-command
    desc: Unlocks a macOS keychain
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [scripts, source, macho]
    if:
      type: text
      substr: unlock-keychain

  - id: macos-keychain-generic-password-delete-command
    desc: Deletes a Keychain generic password
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [scripts, source, macho]
    if:
      type: text
      substr: delete-generic-password

  - id: macos-keychain-generic-password-add-command
    desc: Adds a Keychain generic password
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [scripts, source, macho]
    if:
      type: text
      substr: add-generic-password

  - id: secitem-copy-matching-api
    desc: Read keychain item via API
    crit: notable
    conf: 0.9
    platforms:
      - macos
      - ios
    for: [macho, dylib, c, objectivec, swift, python, javascript]
    if:
      type: symbol
      exact: SecItemCopyMatching
  - id: secitem-add-api
    desc: Add keychain item via API
    crit: notable
    conf: 0.85
    platforms:
      - macos
      - ios
    for: [macho, dylib, c, objectivec, swift, python, javascript]
    if:
      type: symbol
      exact: SecItemAdd
  - id: secitem-delete-api
    desc: Delete keychain item via API
    crit: notable
    conf: 0.85
    platforms:
      - macos
      - ios
    for: [macho, dylib, c, objectivec, swift, python, javascript]
    if:
      type: symbol
      exact: SecItemDelete
  - id: secitem-update-api
    desc: Update keychain item via API
    crit: notable
    conf: 0.85
    platforms:
      - macos
      - ios
    for: [macho, dylib, c, objectivec, swift, python, javascript]
    if:
      type: symbol
      exact: SecItemUpdate
  - id: seckeychain-find-generic-password-api
    desc: Read a macOS Keychain generic password
    crit: notable
    conf: 0.95
    platforms: [macos]
    for: [macho]
    if:
      type: import
      exact: SecKeychainFindGenericPassword
  - id: seckeychain-add-generic-password-api
    desc: Add a macOS Keychain generic password
    crit: notable
    conf: 0.95
    platforms: [macos]
    for: [macho]
    if:
      type: import
      exact: SecKeychainAddGenericPassword
  - id: seckeychain-item-modify-api
    desc: Modify a macOS Keychain item
    crit: notable
    conf: 0.95
    platforms: [macos]
    for: [macho]
    if:
      type: import
      exact: SecKeychainItemModifyAttributesAndData
  - id: seckeychain-item-delete-api
    desc: Delete a macOS Keychain item
    crit: notable
    conf: 0.95
    platforms: [macos]
    for: [macho]
    if:
      type: import
      exact: SecKeychainItemDelete
  - id: swift-keychain-delete
    desc: Swift calls the iOS/macOS Keychain deletion API
    crit: notable
    conf: 0.93
    platforms: [macos, ios]
    for: [swift]
    if:
      type: text
      regex: 'SecItemDelete[\s\S]{0,120}kSecClass'
  - id: secclass-generic-password
    desc: Generic password class key
    crit: suspicious
    conf: 0.8
    platforms:
      - macos
      - ios
    for:
      - shell
      - python
      - javascript
    if:
      type: symbol
      exact: kSecClassGenericPassword
composite_rules:
  - id: keychain-item-crud
    desc: OS credential-store API usage
    crit: notable
    conf: 0.9
    platforms:
      - macos
      - ios
    for:
      - shell
      - python
      - javascript
    needs: 2
    any:
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
      - id: micro-behaviors/os/security/keychain::python-keyring-delete-password
      - id: micro-behaviors/os/security/keychain::python-keyring-get-password
      - id: micro-behaviors/os/security/keychain::python-keyring-import
      - id: micro-behaviors/os/security/keychain::python-keyring-set-password
      - id: micro-behaviors/os/security/keychain::secclass-generic-password
      - id: micro-behaviors/os/security/keychain::secitem-add-api
      - id: micro-behaviors/os/security/keychain::secitem-copy-matching-api
      - id: micro-behaviors/os/security/keychain::secitem-delete-api
