# A single named-item lookup is also used by authorized credential utilities.
# Keep the operation neutral; phishing context belongs to its consumer.
# Text includes decoded native strings and escaped AppleScript command strings.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
traits:
  - id: chrome-generic-password-query
    desc: Generic-password query names Chrome
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'find-generic-password.{0,40}\\*["'']Chrome\\*["'']'
