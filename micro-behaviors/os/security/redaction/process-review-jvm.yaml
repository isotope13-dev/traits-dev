defaults:
  platforms: [unix, windows]
  for: [class, java_class, java, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: command-client-secret-flag-pattern
    desc: Regex for a --client-secret command flag
    if:
      type: text
      substr: '\s--client-secret'
  - id: command-auth-token-flag-pattern
    desc: Regex for an --auth-token command flag
    if:
      type: text
      substr: '\s--auth-token'
  - id: command-secret-env-name-pattern
    desc: Regex for secret-named env assignments
    if:
      type: text
      substr: 'PASSWORD|SECRET|TOKEN|API_KEY'

composite_rules:
  - id: jvm-command-secret-redaction-patterns
    desc: JVM screens commands for secret-bearing arguments
    all:
      - id: micro-behaviors/os/security/redaction::command-client-secret-flag-pattern
      - id: micro-behaviors/os/security/redaction::command-auth-token-flag-pattern
      - id: micro-behaviors/os/security/redaction::command-secret-env-name-pattern
