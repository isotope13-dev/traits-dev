defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: security-product-debug-process-api-set
    desc: Security-product names with process APIs and debug privilege
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/security/product::security-product-enumeration-termination-api-set
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: well-known/tool/reverse-engineering/windows-debugger/
      - id: well-known/tool/reverse-engineering/nanomite/

