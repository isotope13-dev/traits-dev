defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: escanav-token
  desc: eScan service-name token reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: escanav
    case_insensitive: true
- id: microworld-token
  desc: mwti (MicroWorld eScan parent)
  crit: notable
  conf: 0.85
  if:
    type: text
    word: mwti
