defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: antivirus-product-term
    desc: Antivirus or anti-malware product terminology
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(antivirus|anti-malware)\b'
    unless:
      - id: metadata/binary/resource::resource-only-dll-context
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/security/bitdefender/
      - id: well-known/lib/platform/microsoft-amsiproxy::microsoft-amsiproxy-system-context
      - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
      - id: well-known/app/utility/rufus::rufus-official-context
