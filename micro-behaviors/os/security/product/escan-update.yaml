defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  # The bare updater token does not establish a hostname.
  - id: escan-update-token
    desc: References the eScan updater token
    crit: notable
    conf: 0.85
    if:
      type: text
      word: esupdate
      case_insensitive: true
