defaults:
  platforms: [windows, unix, android]
  for: [pe, elf]
traits:
- id: qihoo-360-safe-term
  desc: Qihoo 360 safe, antivirus, or tray term
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)360(safe|sd|tray)
  unless:
  - id: well-known/app/utility/360-clean-master::360-clean-master-installer-identity
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: qihoo-active-defense-process
  desc: 'Matches ''ZhuDongFangYu.exe'''
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: ZhuDongFangYu.exe
- id: qihoo-realtime-protection-process
  desc: 'Matches ''360rps.exe'''
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: 360rps.exe
- id: qihoo-360-process
  desc: Qihoo 360 protection process name
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (?i)360rp\.exe
  unless:
  - id: well-known/app/utility/360-clean-master::360-clean-master-installer-identity
- id: tencent-security
  desc: Tencent security process-name reference
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(qqpctray|qqpcmgr|tav\.exe)
- id: baidu-security
  desc: Baidu Antivirus reference
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(baidusd|bddownloader|bdmserv)
- id: kingsoft-antivirus-name
  desc: Kingsoft Antivirus or Internet Security name
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)kingsoft[ _-]?(antivirus|internet[ _-]?security)
- id: kingsoft-av-guard-name
  desc: Kingsoft AV or guard name reference
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)kingsoft[ _-]?(av|guard)
- id: kingsoft-defender-name
  desc: Kingsoft Defender name reference
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)kingsoft[ _-]?(defender)
- id: kingsoft-kxe
  desc: Kingsoft KXE process reference
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)kxe(tray|scan|serv)
- id: duba-av
  desc: Duba Antivirus reference
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)\b(duba(antivirus|security)|duba\.exe)\b
  unless:
  - id: metadata/build/recognized-contexts/
- id: rising-av
  desc: Rising Antivirus reference
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)rav(mon|task|tray)\.exe
- id: huorong-security
  desc: Huorong Security reference
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(huorong|hipstray)
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: msi-embedded-security-process-set
  desc: Chinese security-process name reference
  crit: notable
  conf: 0.92
  for: [oledoc]
  if:
    type: text
    regex: (?i)(qqpctray|hipstray|360tray)\.exe
composite_rules:
- id: qihoo-360
  desc: Qihoo 360 security product
  crit: notable
  conf: 0.7
  any:
  - id: qihoo-360-safe
  - id: qihoo-360-process
  unless:
  - id: well-known/app/utility/360-clean-master::360-clean-master-installer-identity
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: kingsoft-security
  desc: Kingsoft security product
  crit: notable
  conf: 0.7
  any:
  - id: kingsoft-name
  - id: kingsoft-kxe
  - id: duba-av
- id: chinese-av-product
  desc: Chinese AV/security product reference
  crit: notable
  conf: 0.7
  any:
  - id: qihoo-360
  - id: tencent-security
  - id: baidu-security
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: chinese-av-product-extended
  desc: Chinese AV (extended coverage)
  crit: notable
  conf: 0.7
  any:
  - id: chinese-av-product
  - id: kingsoft-security
  - id: rising-av
- id: qihoo-360-safe
  desc: Qihoo 360 Safe reference
  crit: notable
  conf: 0.6
  any:
  - id: qihoo-360-safe-term
  - id: qihoo-active-defense-process
  - id: qihoo-realtime-protection-process
  unless:
  - id: well-known/app/utility/360-clean-master::360-clean-master-installer-identity
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: kingsoft-name
  desc: Kingsoft Antivirus reference
  crit: notable
  conf: 0.6
  any:
  - id: kingsoft-antivirus-name
  - id: kingsoft-av-guard-name
  - id: kingsoft-defender-name
  not:
  - substr: Kingsoft-Phonetic
  - substr: KingsoftPhonetic
  - substr: KingsoftPhoneticPlain
