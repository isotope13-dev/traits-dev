traits:
  - id: av-scan-status-text
    desc: Literal mentions antivirus scan status
    crit: notable
    platforms: [unix, windows]
    for: [javascript, typescript]
    conf: 0.9
    if:
      # Literal matching avoids comments and generated code identifiers that
      # merely document a quarantine field or action.
      type: literal
      regex: '(?i)\b(real[- ]time|on[- ]access|AV)\s+scan\b'

