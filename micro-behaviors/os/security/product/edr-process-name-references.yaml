defaults:
  platforms:
  - windows
  for:
  - binaries
  - scripts
  - c
  - cpp
traits:
- id: sentinel-agent-monitor-process-reference
  desc: Sentinel Agent or Monitor process reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(SentinelAgent|SentinelMonitor)(\.exe)?\b
- id: carbonblack-repmgt-process-reference
  desc: cb.exe or RepMgt.exe process reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(cb|RepMgt)\.exe\b
- id: cyserver-ccsvchst-process-reference
  desc: Cyserver or ccSvcHst process reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(cyserver|ccSvcHst)\.exe\b
- id: cylance-xagt-process-reference
  desc: CylanceSvc or xagt process reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(CylanceSvc|xagt)\.exe\b
- id: tanium-bdagent-process-reference
  desc: TaniumClient or bdagent process reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(TaniumClient|bdagent)\.exe\b
- id: defender-engine-process-reference
  desc: Microsoft Defender engine process reference
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  - c
  - cpp
  - csharp
  - powershell
  - batch
  - go
  - rust
  - python
  if:
    type: text
    regex: (?i)\bMsMpEng\.exe\b
  unless:
  - id: metadata/signed/platform::microsoft
  - id: well-known/app/security/defender::is-defender-named-2
  - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-bootstrapper-context
- id: sophos-edr-process-reference
  desc: Sophos EDR process image reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bSophosEDR\.exe\b
- id: sophos-clean-process-reference
  desc: Sophos Clean process image reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bSophosClean\.exe\b
- id: sophos-fs-process-reference
  desc: Sophos FS process image reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bSophosFS\.exe\b
- id: falcon-container-process-reference
  desc: Falcon container process image reference
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\bCSFalconContainer\.exe\b
- id: falcon-service-process-reference
  desc: Falcon service process image reference
  crit: notable
  conf: 0.95
  for:
  - scripts
  - binaries
  - c
  - cpp
  - csharp
  - powershell
  - batch
  - go
  - rust
  - python
  if:
    type: text
    regex: (?i)\bCSFalconService(\.exe)?\b
  unless:
  - id: well-known/tool/development/agent/openai-codex/
composite_rules:
- id: edr-av-process-name-reference
  desc: EDR or AV process name reference
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/security/product::sentinel-agent-monitor-process-reference
  - id: micro-behaviors/os/security/product::carbonblack-repmgt-process-reference
  - id: micro-behaviors/os/security/product::cyserver-ccsvchst-process-reference
  - id: micro-behaviors/os/security/product::mcshield-pccntmon-image-reference
  - id: micro-behaviors/os/security/product::cylance-xagt-process-reference
  - id: micro-behaviors/os/security/product::tanium-bdagent-process-reference
- id: security-process-name-reference
  desc: Security product process name reference
  crit: notable
  for:
  - scripts
  - binaries
  - pe
  - dll
  - c
  - cpp
  - csharp
  - powershell
  - batch
  - go
  - rust
  - python
  any:
  - id: micro-behaviors/os/security/product::defender-engine-process-reference
  - id: micro-behaviors/os/security/product::sophos-edr-process-reference
  - id: micro-behaviors/os/security/product::sophos-clean-process-reference
  - id: micro-behaviors/os/security/product::sophos-fs-process-reference
  - id: micro-behaviors/os/security/product::falcon-container-process-reference
  - id: micro-behaviors/os/security/product::falcon-service-process-reference
  - id: micro-behaviors/os/security/product::edr-av-process-name-reference
  unless:
  - id: well-known/tool/development/agent/openai-codex/
