# Install directories of the Alibaba Cloud (Aegis) and Tencent Cloud (QCloud)
# host security agents on Linux. A script naming them is either managing them
# or, when paired with stop/disable and delete commands, removing them.
defaults:
  platforms: [unix]
  for: [shell, scripts]
  crit: notable
  conf: 0.9
  attack: T1562.001
traits:
  - id: aliyun-aegis-agent-path
    desc: References Alibaba Cloud Aegis agent directory
    if:
      type: text
      substr: /usr/local/aegis

  - id: tencent-qcloud-agent-path
    desc: References Tencent Cloud agent directory
    if:
      type: text
      substr: /usr/local/qcloud
