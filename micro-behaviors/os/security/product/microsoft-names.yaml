defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: microsoft-defender-product-name
  desc: References the Microsoft Defender product name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bMicrosoft(\(R\))?[ ]+Defender\b
    case_insensitive: true
  unless:
  - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
- id: microsoft-security-essentials-name
  desc: References Microsoft Security Essentials
  crit: notable
  conf: 0.9
  if:
    type: text
    word: Microsoft Security Essentials
    case_insensitive: true
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
- id: microsoft-windows-firewall-name
  desc: References Microsoft Windows Firewall
  crit: notable
  conf: 0.9
  if:
    type: text
    word: Microsoft Windows Firewall
    case_insensitive: true
composite_rules:
- id: microsoft-security-product-name-reference
  desc: References a Microsoft security product name
  crit: notable
  conf: 0.9
  any:
  - id: microsoft-defender-product-name
  - id: microsoft-security-essentials-name
  - id: microsoft-windows-firewall-name
  - id: metadata/vendor/string::microsoft-firewall-label
