defaults:
  platforms: [unix, windows]
traits:
- id: malwarebytes-name
  desc: Standalone Malwarebytes product-name token
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    word: malwarebytes
    case_insensitive: true
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: kaspersky-name
  desc: Standalone Kaspersky product-name token
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    word: kaspersky
    case_insensitive: true
  unless:
    - id: metadata/package/documentation/page::static-html-shell
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: bitdefender-name
  desc: Bitdefender reference
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    word: bitdefender
    case_insensitive: true
    section: .text
  unless:
    - type: text
      substr: bitdefender srl
    - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
- id: bitdefender-service-host
  desc: Bitdefender service host process name
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: text
    regex: (?i)bdservicehost\.exe
- id: avast-path
  desc: Avast installation path
  crit: notable
  conf: 0.7
  for: [scripts, binaries]
  if:
    type: text
    regex: (?i)(program files|avast software).{0,50}avast
- id: norton-name
  desc: Standalone Norton product-name token
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    word: norton
    case_insensitive: true
  not:
    - substr: NortonLifeLock Ireland Limited
- id: mcafee-name
  desc: Standalone McAfee product-name token
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    word: mcafee
    case_insensitive: true
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: sophos-name
  desc: Standalone Sophos product-name token
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    word: sophos
    case_insensitive: true
  unless:
    - id: metadata/package/documentation/page::static-html-shell
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  not:
    - substr: LSOPHOS-AS-NA
- id: eset-name
  desc: ESET product reference
  crit: component
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    # Case-sensitive on purpose: the vendor writes ESET or eset (process and
    # path names), while the camelCase `eSet` is EMF's setter API, emitted
    # all over GWT-compiled JavaScript — the ELK layout engine bundled in the
    # Mermaid VS Code extension supplied one, which was half of an
    # "EDR/Antivirus product name reference" on a diagramming extension.
    regex: '\b(ESET|eset)\b'
- id: consumer-av-brand-name
  desc: Names Bitdefender, Kaspersky or Norton
  for: [html, javascript, markdown]
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(bitdefender|kaspersky|norton)\b

composite_rules:
- id: edr-product-name
  desc: Names two or more security products
  crit: notable
  conf: 0.8
  for: [scripts, binaries]
  any:
    - id: micro-behaviors/os/security/defender::defender-product-name-reference
    - id: micro-behaviors/os/security/product::malwarebytes-name
    - id: micro-behaviors/os/security/product::kaspersky-name
    - id: micro-behaviors/os/security/product::bitdefender-name
    - id: micro-behaviors/os/security/product::bitdefender-service-host
    - id: micro-behaviors/os/security/product::avast-path
    - id: micro-behaviors/os/security/product::norton-name
    - id: micro-behaviors/os/security/product::mcafee-name
    - id: micro-behaviors/os/security/product::sophos-name
    - id: micro-behaviors/os/security/product::eset-name
  needs: 2
  unless:
    - id: metadata/file/catalog/identity::ad-tracker-domain-catalog
    # A domain blocklist names AV vendors because scammers register their
    # brands: kaspersky-shop.ch, nortonfire.co.uk, esethodsth.top and
    # microsoft-windows-defender-alert-error404.usa.cc are blocklist entries,
    # not the product-targeting table of an EDR killer.
    - id: metadata/file/catalog/identity::bulk-domain-blocklist
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
    - id: metadata/lang/compiler/generated::qt-generated-python-resource-module
    - id: metadata/file/string/application-name::microsoft-activation-script-benign-context
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  downgrade:
    any:
      - id: metadata/binary/resource/
      - id: metadata/binary/layout/size::massive-executable
      - id: metadata/package/vendor::bitdefender-ecnet-telemetry
