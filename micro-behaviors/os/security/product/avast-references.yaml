defaults:
  platforms:
  - unix
  - windows
traits:
- id: avast-process-name-reference
  desc: Avast process-name reference
  crit: notable
  conf: 0.7
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)avast(svc|ui|setup|\.exe)
- id: avast-product-name-reference
  desc: Avast product-name reference
  crit: notable
  conf: 0.7
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)avast(antivirus|software|service)
- id: antivirus-directory-path-reference
  desc: Antivirus directory path reference
  crit: notable
  conf: 0.9
  for:
  - batch
  - scripts
  - pe
  if:
    type: text
    regex: (?i)[\\/](antivi[a-z~0-9]{0,6}|inocul[a-z~0-9]{0,6}|f-secure)[\\/]
composite_rules:
- id: avast-product-reference
  desc: Avast product reference
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/os/security/product::avast-process-name-reference
  - id: micro-behaviors/os/security/product::avast-product-name-reference
