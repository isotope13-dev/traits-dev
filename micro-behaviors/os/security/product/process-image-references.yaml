defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, c, cpp, powershell]
traits:
  - id: security-product-image-cylance
    desc: Cylance security process image
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bCylanceSvc\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-crowdstrike
    desc: CrowdStrike security process images
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(CrowdStrike|Falcon|CSFalconService)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-sentinel
    desc: Sentinel security process images
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(SentinelAgent|SentinelOne|CarbonBlack)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-antivirus
    desc: Antivirus security process images
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(MBAMService|McShield|egui|ekrn)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-security
    desc: Security service process images
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(SecurityHealthService|SavService|avp)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-linux-edr
    desc: Linux security or EDR process names
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      # Bare Cortex also names ARM CPU cores (Cortex-A65AE, Cortex-X1).
      # Require the security product suffix rather than treating CPU names as EDR.
      regex: '(?i)\b(pmd|trapsd?|cortex-xdr|falcon-sensor|sentinelone|mdatp|cbdaemon|wazuh-agentd?)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

composite_rules:
  - id: security-product-process-image
    desc: Named security product process image
    crit: notable
    conf: 0.97
    any:
      - id: security-product-image-cylance
      - id: micro-behaviors/process/info/name::defender-process-image-reference
      - id: security-product-image-crowdstrike
      - id: security-product-image-sentinel
      - id: security-product-image-antivirus
      - id: security-product-image-security
      - id: security-product-image-linux-edr
  - id: multi-vendor-security-process-images
    desc: Names multiple vendors' security processes
    crit: notable
    conf: 0.98
    any:
      - id: security-product-image-cylance
      - id: micro-behaviors/process/info/name::defender-process-image-reference
      - id: security-product-image-crowdstrike
      - id: security-product-image-sentinel
      - id: security-product-image-antivirus
      - id: security-product-image-security
      - id: security-product-image-linux-edr
    needs: 2
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

