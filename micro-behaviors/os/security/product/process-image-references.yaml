defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, c, cpp, csharp, go, rust]
traits:
  - id: security-product-image-cylance
    desc: Cylance security process image
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bCylanceSvc\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-crowdstrike
    desc: CrowdStrike security process images
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(CrowdStrike|Falcon|CSFalconService)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-sentinel
    desc: Sentinel or Carbon Black process image names
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(SentinelAgent|SentinelOne|CarbonBlack)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-antivirus
    desc: Antivirus security process images
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(MBAMService|McShield|egui|ekrn)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-security
    desc: Security service process images
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(SecurityHealthService|SavService|avp)\.exe\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-quick-heal-seqrite
    desc: Quick Heal or Seqrite process images
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(Quick Heal|qhsafetray|msghandler)\.exe\b|SOFTWARE\\Seqrite'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  # Each name is its own signal. A combined alternation both exceeds the
  # regex budget and treats unrelated products as one matcher.
  # Bare Cortex names ARM CPU cores; bare `traps` is a shell signal-trap
  # comment. The agent daemon is `trapsd`.
  - id: security-product-image-pmd
    desc: Linux pmd security process name
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      # Require a complete image token, not a vendor such as "PMD Solutions".
      regex: '(?i)(^|[/\\\s"''`])pmd(["''`\x00]|$)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-trapsd
    desc: Linux trapsd security process name
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: '(?i)\btrapsd\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-cortex-xdr
    desc: Linux Cortex XDR process name
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: '(?i)\bcortex-xdr\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-falcon-sensor
    desc: Linux Falcon sensor process name
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: '(?i)\bfalcon-sensor\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-sentinelone
    desc: SentinelOne product name reference
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      word: sentinelone
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-mdatp
    desc: Linux MDATP process name
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: '(?i)\bmdatp\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-cbdaemon
    desc: Linux Carbon Black daemon name
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: '(?i)\bcbdaemon\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: security-product-image-wazuh-agent
    desc: Linux Wazuh agent process name
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: '(?i)\bwazuh-agentd?\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

composite_rules:
  - id: security-product-process-image
    desc: Named security product process image
    crit: notable
    conf: 0.97
    any:
      - id: security-product-image-cylance
      - id: micro-behaviors/process/info/name::defender-process-image-reference
      - id: security-product-image-crowdstrike
      - id: security-product-image-sentinel
      - id: security-product-image-antivirus
      - id: security-product-image-security
      - id: security-product-image-pmd
      - id: security-product-image-trapsd
      - id: security-product-image-cortex-xdr
      - id: security-product-image-falcon-sensor
      - id: security-product-image-sentinelone
      - id: security-product-image-mdatp
      - id: security-product-image-cbdaemon
      - id: security-product-image-wazuh-agent
  - id: multiple-security-process-name-clues
    desc: Multiple security-process name observations
    crit: notable
    conf: 0.98
    any:
      - id: security-product-image-cylance
      - id: micro-behaviors/process/info/name::defender-process-image-reference
      - id: security-product-image-crowdstrike
      - id: security-product-image-sentinel
      - id: security-product-image-antivirus
      - id: security-product-image-security
      - id: security-product-image-pmd
      - id: security-product-image-trapsd
      - id: security-product-image-cortex-xdr
      - id: security-product-image-falcon-sensor
      - id: security-product-image-sentinelone
      - id: security-product-image-mdatp
      - id: security-product-image-cbdaemon
      - id: security-product-image-wazuh-agent
    needs: 2
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

