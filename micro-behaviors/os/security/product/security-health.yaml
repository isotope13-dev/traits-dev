defaults:
  platforms: [windows]
traits:
  - id: security-health-process-name-reference
    desc: Windows Security service or tray process name
    crit: notable
    conf: 0.92
    for: [scripts, c, cpp, csharp, go, rust]
    if:
      type: literal
      kind: string
      regex: (?i)\bSecurityHealth(Systray|Service)\.exe\b

# Service-name references alone do not prove enumeration or teardown.
# Individual reference placement and technique annotations require review.
