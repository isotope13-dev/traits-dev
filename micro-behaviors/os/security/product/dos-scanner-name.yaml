defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-compare-scan-name-bytes
    desc: DOS compares adjacent SCAN bytes
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: '26 81 7D FD 41 4E (74|75) ?? 26 81 7D FB 53 43 (74|75)'
