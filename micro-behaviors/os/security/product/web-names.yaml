defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  - markdown
traits:
- id: consumer-security-suite-name
  desc: Security-suite name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(mcafee|avast|eset)\b
- id: avg-security-suite-name
  desc: AVG security-suite name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bAVG\s+(AntiVirus|Internet Security)\b
composite_rules:
- id: web-security-product-reference
  desc: Security-product name reference
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/security/product::malwarebytes-name
  - id: micro-behaviors/os/security/product::consumer-av-brand-name
  - id: consumer-security-suite-name
  - id: avg-security-suite-name
  - id: sophos-name
