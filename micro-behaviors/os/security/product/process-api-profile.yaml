composite_rules:
  - id: security-product-enumeration-termination-api-set
    desc: Security names and process-management APIs
    crit: notable
    for: [pe]
    platforms: [windows]
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/product::edr-product-name
      - id: micro-behaviors/process/terminate/kill::terminate-process
    any:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
    downgrade:
      any:
        - id: metadata/signed/platform/
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/tool/development/agent/openai-codex/
