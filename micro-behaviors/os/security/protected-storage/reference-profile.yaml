defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
traits:
  - id: enum-pstorage
    desc: Protected Storage enumeration routine name
    crit: notable
    conf: 0.96
    if:
      type: string_literal
      exact: EnumPStorage
  - id: protected-storage-text
    desc: Protected Storage text reference
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: Protected Storage
composite_rules:
  - id: pstore-factory-interface-clues
    desc: Protected Storage factory, enumeration, or interface references
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: pstore-factory-reference
      - id: enum-pstorage
      - id: protected-storage-text
      - id: ipstore-interface
