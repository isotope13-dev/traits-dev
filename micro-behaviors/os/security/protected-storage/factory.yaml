defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: notable
  conf: 0.95

composite_rules:
  - id: pstore-factory-reference
    desc: References Protected Storage factory API
    crit: notable
    conf: 0.95
    unless:
    - id: metadata/binary/vendor/
    - id: well-known/tool/sysadmin/sandboxie/
    - id: metadata/lang/source/
    - id: metadata/lang/security::win32-com-interface-declaration-header
    - id: well-known/app/utility/siw::siw-family-identity
    any:
    - id: pstore-create-instance-function-pointer
    - id: pstore-create-instance-reference
