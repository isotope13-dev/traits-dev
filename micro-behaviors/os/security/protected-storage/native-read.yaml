defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  # EnumTypes, EnumSubtypes, ReadItem and EnumItems have distinct argument
  # counts and vtable offsets. The complete ABI sequence plus the factory
  # reference is useful capability evidence, including in recovery utilities.
  - id: x86-pstore-enumerate-read-wrappers
    desc: PStore enumeration and ReadItem ABI wrappers
    crit: notable
    conf: 0.96
    all:
      - id: pstore-factory-reference
      - id: metadata/binary/instruction::x86-com-vtable-argument-sequence
