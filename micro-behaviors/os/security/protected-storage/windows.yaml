# Windows Protected Storage API observations. Credential-theft intent belongs
# under objectives/credential-access and requires operational evidence.
defaults:
  for: [c, cpp, pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: get-pstore-provider-export
    desc: Exports Windows GetPStoreProvider API
    if:
      type: export
      exact: GetPStoreProvider

  - id: pstore-create-instance-export
    desc: Exports Protected Storage COM factory
    if:
      type: export
      exact: PStoreCreateInstance

  - id: pstore-enumeration-export
    desc: Exports Protected Storage provider enumeration
    if:
      type: export
      exact: PStoreEnumProviders

  - id: ipstore-interface
    desc: References Windows Protected Storage interface
    if:
      type: text
      regex: '\bIPStore(Ptr)?\b'
    unless:
      - id: well-known/lib/platform/wine/
      - id: "metadata/file/naming::wine-include-source-path"
  - id: pstore-create-instance-reference
    desc: References Protected Storage COM factory
    # A named COM factory is also used by migration and inventory software.
    crit: notable
    conf: 0.95
    if:
      type: text
      word: PStoreCreateInstance
    unless:
    - id: well-known/lib/platform/wine/
    - id: well-known/app/system/reactos::system-component
    - id: "metadata/file/naming::wine-include-source-path"
    - type: path
      basename: true
      regex: '(?i).*\.(h|hh|hpp|hxx|inc)$'
    - id: well-known/app/utility/siw::siw-family-identity
  - id: pstore-create-instance-function-pointer
    desc: Protected Storage factory pointer reference
    crit: notable
    conf: 0.95
    if:
      type: text
      word: fPStoreCreateInstance
    unless:
    - type: path
      basename: true
      regex: '(?i).*\.(h|hh|hpp|hxx|inc)$'
    - id: well-known/app/utility/siw::siw-family-identity

  - id: ie-autocomplete-passwords-label
    desc: IE AutoComplete Passwords storage label
    crit: notable
    conf: 0.93
    for:
    - pe
    - dll
    if:
      type: text
      exact: AutoComplete Passwords

  # Category display names the Protected Storage enumerator resolves from
  # the well-known type GUIDs. Recovery tools enumerate the same stores.
  - id: pstore-category-inetcomm-passwords
    desc: PStore inetcomm server passwords category label
    for: [pe, dll]
    conf: 0.95
    if:
      type: text
      word: inetcomm server passwords
      case_insensitive: true

composite_rules:
  # A factory and a category label establish context, not enumeration or theft.
  # Identification alone is also an SSPI impersonation-level name.
  - id: pstore-password-category-factory
    desc: PStore factory with password category label
    for: [pe, dll]
    conf: 0.9
    all:
      - id: pstore-factory-reference
      - id: pstore-category-inetcomm-passwords

  # An Internet Explorer installation path is not a Protected Storage label.
  # Reuse the canonical standalone product-name observation and require a
  # Protected Storage factory reference; co-occurrence proves no enumeration.
  - id: pstore-category-internet-explorer
    desc: Protected Storage factory with standalone IE label
    crit: notable
    conf: 0.9
    for: [pe, dll]
    all:
      - id: pstore-factory-reference
      - id: metadata/file/string/application-name::internet-explorer-product-name
