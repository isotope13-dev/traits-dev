# Windows Protected Storage API observations. Credential-theft intent belongs
# under objectives/credential-access and requires operational evidence.
defaults:
  for: [c, cpp, pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: get-pstore-provider-export
    desc: Exports Windows GetPStoreProvider API
    if:
      type: export
      exact: GetPStoreProvider

  - id: pstore-create-instance-export
    desc: Exports Protected Storage COM factory
    if:
      type: export
      exact: PStoreCreateInstance

  - id: pstore-enumeration-export
    desc: Exports Protected Storage provider enumeration
    if:
      type: export
      exact: PStoreEnumProviders

  - id: ipstore-interface
    desc: References Windows Protected Storage interface
    if:
      type: text
      regex: '\bIPStore(Ptr)?\b'
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/file/string/file::wine-include-source-path
