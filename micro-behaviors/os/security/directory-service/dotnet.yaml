# .NET System.DirectoryServices search surface. An LDAP/Active Directory query
# is ordinary for admin tools, installers and enterprise apps; enumeration
# intent comes from the objective composites that pair it with other evidence.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  crit: notable
  conf: 0.85
  attack: T1087.002

traits:
  # Relocated from objectives/discovery/network/scan/internal-port (was
  # dotnet-directory-searcher). The old `System\.DirectoryServices`
  # alternative matched the assembly-reference string
  # "System.DirectoryServices, Version=2.0.0.0, ..." that CasPol.exe and
  # InstallUtil.exe carry in the .NET Framework itself -- a namespace
  # reference, not a search.
  - id: directory-searcher-class
    desc: References the .NET DirectorySearcher class
    if:
      type: text
      word: DirectorySearcher
