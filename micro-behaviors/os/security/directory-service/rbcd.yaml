traits:
  - id: rbcd-modification-reference
    for: [scripts]
    platforms: [unix, windows]
    desc: RBCD modification routine or command reference
    crit: suspicious
    conf: 0.96
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: well-known/tool/offensive/impacket::source-tree-member
    if:
      type: text
      regex: '(?i)\b(add|set|write|modify)[^A-Za-z0-9]{0,4}rbcd'
