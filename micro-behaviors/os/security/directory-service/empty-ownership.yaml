# Empty ownership attributes alone do not establish an authentication bypass.
# In particular, managedBy is not specific to FreeIPA or to OTP tokens.
defaults:
  platforms: [unix]
  for: [scripts, source, text]

traits:
  - id: freeipa-empty-token-owner
    desc: Empty owner on FreeIPA OTP token
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)["'']ipaTokenOwner["'']\s*[:=,][^"''\r\n]{0,32}["'']{2}|^\s*ipaTokenOwner\s*:\s*$'

  - id: ldap-empty-managed-by-attribute
    desc: Empty managedBy directory attribute
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)["'']managedBy["'']\s*[:=,][^"''\r\n]{0,32}["'']{2}|^\s*managedBy\s*:\s*$'

composite_rules:
  - id: freeipa-empty-token-ownership-fields
    desc: FreeIPA OTP token with empty ownership fields
    crit: notable
    conf: 0.98
    all:
      - id: freeipa-empty-token-owner
      - id: ldap-empty-managed-by-attribute
    near_bytes: 180

