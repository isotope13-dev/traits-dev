# Neutral LDAP client mechanics: how a program binds to a directory, how it
# submits an entry-add, and which credential-bearing attributes it stages for
# the write. Intent lives in the composites that reference these.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  crit: notable
  conf: 0.94

traits:
  # --- Binds that carry no identity -----------------------------------------
  - id: ldap3-anonymous-authentication
    desc: Configures ldap3 anonymous authentication
    if:
      type: text
      regex: '(?i)\bauthentication\s*=\s*(ldap3\.)?ANONYMOUS\b'

  - id: ldap-empty-simple-bind
    desc: Binds to LDAP with empty credentials
    if:
      type: text
      regex: '(?i)\bsimple_bind(_s)?\s*\(\s*["'']{2}\s*,\s*["'']{2}\s*\)'

  - id: go-ldap-unauthenticated-bind
    desc: Performs a go-ldap unauthenticated bind
    if:
      type: text
      regex: '\bUnauthenticatedBind\s*\('

  - id: jndi-authentication-none
    desc: Sets JNDI LDAP authentication to none
    if:
      type: text
      regex: '(?i)security[._]authentication[^\r\n]{0,40}["'']none["'']'

  - id: openldap-cli-empty-bind-credentials
    desc: OpenLDAP client binds with empty credentials
    if:
      type: text
      regex: '\bldap(add|modify|search|delete|whoami)\b[^\r\n]{0,200}\s-[Dw]\s+(""|'''')'

  # --- Entry creation --------------------------------------------------------
  - id: native-ldap-entry-add-call
    desc: Invokes a native LDAP entry-add API
    if:
      type: text
      regex: '(?i)\bldap_(add|add_ext)(_s)?\s*\('

  - id: named-ldap-client-add-call
    desc: LDAP-named client invokes entry add
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(ldap|directory|anonymous)[A-Za-z0-9_]*\.(add|add_s|add_ext_s)\s*\('

  - id: go-ldap-add-request
    desc: Builds a go-ldap entry add request
    if:
      type: text
      regex: '\bNewAddRequest\s*\('

  - id: jndi-create-subcontext
    desc: Creates a JNDI directory subcontext
    if:
      type: text
      regex: '\.createSubcontext\s*\('

  - id: openldap-entry-write-cli
    desc: Runs the OpenLDAP ldapadd or ldapmodify client
    if:
      type: text
      regex: '(?m)\bldap(add|modify)\s+-'

  - id: ldif-entry-add-record
    desc: LDIF record requests an entry add
    if:
      type: text
      regex: '(?im)^\s*changetype\s*:\s*add\s*$'

  # --- Credential-bearing attributes staged for a directory write ------------
  # Matched as an attribute token so the same rule covers LDIF (`attr:`),
  # mapping literals (`"attr":`), and call arguments (`("attr", ...)`).
  - id: kerberos-principal-key-attribute
    desc: References krbPrincipalKey attribute
    if:
      type: text
      regex: '(?im)(["'']|^\s*)krbPrincipalKey(["'']|\s*::?)'

  - id: kerberos-principal-name-attribute
    desc: References Kerberos principal name attribute
    if:
      type: text
      regex: '(?im)(["'']|^\s*)krb(PrincipalName|CanonicalName)(["'']|\s*::?)'

  - id: ldap-user-password-attribute
    desc: References the userPassword attribute
    if:
      type: text
      regex: '(?im)(["'']|^\s*)userPassword(["'']|\s*::?)'

  - id: ldif-group-member-add
    desc: LDIF modify adds a group member
    if:
      type: text
      regex: '(?im)^\s*add\s*:\s*(member|uniqueMember)\s*$'

  - id: ldap-client-group-member-add
    desc: LDAP client adds a group member
    if:
      type: text
      regex: '(?i)\.Add\s*\(\s*["'']member["'']|["'']member["'']\s*:\s*\[?\(?\s*MODIFY_ADD'

composite_rules:
  # Grouping composites so intent rules stay language- and tool-independent:
  # adding a new client binding here extends every objective that uses them.
  - id: anonymous-directory-bind
    desc: Directory bind without an identity
    conf: 0.93
    any:
      - id: ldap3-anonymous-authentication
      - id: ldap-empty-simple-bind
      - id: go-ldap-unauthenticated-bind
      - id: jndi-authentication-none
      - id: openldap-cli-empty-bind-credentials

  - id: directory-entry-add
    desc: Submits a new directory entry
    conf: 0.93
    any:
      - id: native-ldap-entry-add-call
      - id: named-ldap-client-add-call
      - id: go-ldap-add-request
      - id: jndi-create-subcontext
      - id: openldap-entry-write-cli
      - id: ldif-entry-add-record

  - id: ldap-group-member-add
    desc: Adds a member to an LDAP group
    conf: 0.93
    any:
      - id: ldif-group-member-add
      - id: ldap-client-group-member-add
