# RFC 2713 Java naming-reference attributes, as used by JNDI LDAP servers.
# These are protocol observations; remote factory preparation is classified by
# the consumer in objectives/execution/exploit/network-service/service-api-abuse.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: ldap-java-naming-reference
    desc: LDAP Java naming-reference object class
    if:
      type: literal
      exact: javaNamingReference
      case_insensitive: true
      exclude_docstrings: true

  - id: ldap-java-factory-attribute
    desc: LDAP Java factory attribute key
    if:
      type: text
      regex: '\bjavaFactory["'']?\s*(=>|[:,])'
      case_insensitive: true

  - id: ldap-java-http-codebase-field
    desc: LDAP Java codebase field contains HTTP URL
    # Mapping entries and attribute-construction arguments, including Python
    # byte strings and single-value lists. Require the URL in the field's value;
    # an unrelated URL elsewhere in the file must not supply this evidence.
    if:
      type: text
      regex: '\bjavaCodeBase["'']?\s*(=>|[:,])\s*\[?b?["'']https?://'
      case_insensitive: true

