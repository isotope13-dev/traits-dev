# The scriptPath user-object attribute names a logon script run from the
# domain NETLOGON/SYSVOL scripts share when the user authenticates. Setting it
# is legitimate administration; it becomes an abuse primitive when an attacker
# with directory-write access points a victim's scriptPath at a dropped
# payload. Match the attribute only in a directory-write context so ordinary
# code variables named scriptPath do not fire. The intent lives in the
# objectives composite that pairs this with a SYSVOL/NETLOGON script drop.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: scriptpath-set-object-write
    desc: Directory write sets scriptPath attribute
    if:
      type: text
      regex: '(?i)\bset\s+object\b[^\r\n]{0,120}\bscriptPath\b'

  - id: scriptpath-aduser-parameter
    desc: AD cmdlet sets ScriptPath parameter
    for: [powershell]
    if:
      type: text
      regex: '(?i)\b(Set|New)-ADUser\b[^\r\n]{0,160}-ScriptPath\b'

  - id: scriptpath-ldif-attribute-line
    desc: LDIF record sets scriptPath attribute
    if:
      type: text
      regex: '(?im)^\s*scriptPath\s*:\s*\S'

composite_rules:
  - id: scriptpath-attribute-write
    desc: Writes a user logon-script attribute
    crit: notable
    conf: 0.94
    any:
      - id: scriptpath-set-object-write
      - id: scriptpath-aduser-parameter
      - id: scriptpath-ldif-attribute-line
