# AD-integrated DNS zones store their records as dnsRecord attributes on
# dnsNode objects, so a directory write can create or replace zone data
# without touching the DNS management APIs (Powermad, krbrelayx dnstool,
# ntlmrelayx --add-dns-record, including the classic wpad NS-record
# registration). Legitimate directory tooling also references the
# attribute, so the reference stays notable.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: dns-record-attribute
    desc: AD-integrated dnsRecord attribute reference
    if:
      type: literal
      regex: '(?i)^dnsRecord$'
      exclude_docstrings: true
