# AD RMS publishes a Service Connection Point (SCP) in Active Directory so
# clients can locate the deployment. These atoms match the protocol-level LDAP
# filter and distinguished-name structure, independent of client or language.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, dll, elf, class]
  crit: notable
  conf: 0.97
  attack: T1018

traits:
  - id: ad-rms-root-cluster-scp-filter
    desc: Queries the AD RMS root-cluster SCP
    if:
      type: text
      regex: '(?i)\(\s*keywords\s*=\s*MSRMRootCluster\s*\)'

  - id: ad-rms-service-connection-point-dn
    desc: References the AD RMS service connection point
    if:
      type: text
      regex: '(?i)CN=RightsManagementServices,CN=Services,CN=Configuration\b'

composite_rules:
  - id: ad-rms-service-connection-point-query
    desc: Locates an AD RMS cluster through LDAP
    all:
      - id: ad-rms-root-cluster-scp-filter
      - id: ad-rms-service-connection-point-dn
    near_bytes: 1200
