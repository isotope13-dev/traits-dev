defaults:
  platforms: [macos]
  for: [shell, applescript, macho]
  crit: notable
  conf: 0.85
  attack: T1087.001

traits:
  - id: dscl-cli
    desc: Runs macOS Directory Service CLI
    if:
      type: text
      regex: '\bdscl\s+\.'
  # Relocated from objectives/credential-access/validation/check. These
  # CoreServices calls open the local identity authority and look up a named
  # or current user. They do not check a password; that is csidentity-auth.
  - id: csidentity-query-create
    desc: Searches macOS user directory
    conf: 0.75
    for: [macho]
    if:
      type: symbol
      regex: CSIdentityQueryCreateForName
  - id: csidentity-query-execute
    desc: Executes macOS directory search
    conf: 0.75
    for: [macho]
    if:
      type: symbol
      regex: CSIdentityQueryExecute
  - id: csidentity-query-results
    desc: Retrieves macOS account results
    conf: 0.75
    for: [macho]
    if:
      type: symbol
      regex: CSIdentityQueryCopyResults
  - id: csidentity-authority
    desc: Accesses macOS user authority
    conf: 0.7
    for: [macho]
    if:
      type: symbol
      regex: CSGetDefaultIdentityAuthority

composite_rules:
  - id: csidentity-query
    desc: CoreServices identity query by name
    conf: 0.85
    for: [macho]
    all:
      - id: csidentity-query-create
    any:
      - id: csidentity-query-execute
      - id: csidentity-query-results
