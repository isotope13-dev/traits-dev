defaults:
  platforms: [windows]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: powershell-get-adobject
    desc: Queries Active Directory objects
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: Get-ADObject

  - id: powershell-get-adrootdse
    desc: Reads Active Directory root DSE
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: Get-ADRootDSE

  - id: powershell-schema-naming-context
    desc: Reads Active Directory schema context
    for: [powershell]
    if:
      type: text
      substr: SchemaNamingContext

  - id: powershell-ad-object-write-call
    desc: PowerShell invokes an AD object writer
    crit: component
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^Set-AD(Object|User|Computer)$'

  - id: powershell-ad-property-write-option
    desc: PowerShell AD property add or replace option
    crit: component
    for: [powershell]
    if:
      type: text
      regex: '(?i)-(Add|Replace)\b'

  - id: directory-entry-property-put-call
    desc: DirectoryEntry property write API call
    crit: component
    if:
      type: text
      regex: '(?i)\.(Put|PutEx)\s*\('

  - id: domain-sid-rid-construction
    desc: Builds a domain SID from RID
    if:
      type: text
      regex: '(?is)(\{domain[_ -]?sid\}|\bdomain[_ -]?sid\b).{0,160}(\{rid\}|\brid\b)'

  - id: ldap-computer-object-filter
    desc: LDAP filter selects computer objects
    if:
      type: text
      regex: '(?i)\bobjectcategory\s*=\s*computer\b'

  # Raw ADSI search handle — the [adsisearcher] accelerator or a directly
  # constructed System.DirectoryServices.DirectorySearcher. Legitimate AD
  # tooling uses the PowerShell AD module or Get-AD* cmdlets instead.
  - id: powershell-directory-searcher
    desc: Constructs raw ADSI DirectorySearcher
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\[\s*adsisearcher\s*\]|New-Object\s+System\.DirectoryServices\.DirectorySearcher)'
