# The nTSecurityDescriptor attribute carries an object's owner and DACL.
# Reading it is how every ACL-aware tool (auditors, BloodHound-style
# collectors, delegation checkers) enumerates delegated rights; writing it
# back is how DACL-backdoor and GPO-hijack tooling grants control. The
# reference alone is the capability signal, not a verdict.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: nt-security-descriptor-attribute
    desc: nTSecurityDescriptor attribute reference
    if:
      type: literal
      regex: '(?i)nTSecurityDescriptor'
      exclude_docstrings: true
