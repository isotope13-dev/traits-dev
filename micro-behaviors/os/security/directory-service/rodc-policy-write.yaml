defaults:
  for: [powershell]
  platforms: [windows]

traits:
  - id: reveal-policy-hashtable-entry
    desc: RODC reveal policy hashtable entry
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)@\{\s*["'']?msDS-RevealOnDemandGroup["'']?\s*='

composite_rules:
  - id: powershell-rodc-reveal-policy-write
    desc: PowerShell writes RODC reveal policy
    crit: notable
    conf: 0.95
    all:
      - id: reveal-policy-hashtable-entry
      - id: powershell-ad-object-write-call
    near_lines: 1
