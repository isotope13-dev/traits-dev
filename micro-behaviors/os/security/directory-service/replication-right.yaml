# The DS-Replication-Get-Changes (1131f6aa-...) and Get-Changes-All
# (1131f6ad-...) extended-right GUIDs are the two ACE object types that
# grant a principal directory-replication access, the privilege DCSync
# needs. Granting them is ordinary work for AD audit and hardening tools
# and standard escalation for relayed attackers, so the literal alone
# stays a notable reference; the dump objective needs the composites in
# objectives/credential-access/credential-manager/system/.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: directory-replication-right-guid
    desc: Directory replication right GUID literal
    if:
      type: literal
      regex: '(?i)1131f6(aa|ad)-9c07-11d1-f79f-00c04fc2dcd2'
      exclude_docstrings: true
