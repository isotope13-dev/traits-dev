# Neutral observations reviewed from stranded members.
defaults:
  platforms:
  - windows
  crit: notable
  conf: 0.9
traits:
- id: dcsync-command-name
  desc: DCSync command name
  if:
    type: text
    word: dcsync
  for:
  - scripts
  - binaries
  - csharp
- id: domain-user-query-function-name
  desc: Domain-user query function name
  if:
    type: text
    regex: Get-DomainUser\b|Get-NetUser\b
  for:
  - pe
  - dll
  - batch
  - powershell
