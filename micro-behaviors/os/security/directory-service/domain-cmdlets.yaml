defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.98

traits:
  - id: get-addomain-call
    desc: Queries the Active Directory domain
    if:
      type: symbol
      kind: call
      exact: Get-ADDomain
  - id: get-adcomputer-all-filter
    desc: Queries all Active Directory computer objects
    attack: T1018
    if:
      type: text
      regex: '(?i)\bGet-ADComputer\s+-Filter\s+\*(\s|[;|}]|$)'

