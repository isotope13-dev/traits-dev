# Read-Only Domain Controller (RODC) directory attributes. The schema fixes
# these names, so they survive tool, host, destination and language changes.
# msDS-RevealedUsers records which account secrets an RODC has cached;
# msDS-RevealOnDemandGroup / msDS-NeverRevealGroup are the caching allow/deny
# policy; msDS-KrbTgtLink points the RODC at its per-RODC krbtgt account, whose
# krbtgt_<number> naming is itself the signal that an RODC exists. Reading or
# auditing any of these is ordinary directory work, so the references stay
# notable; the objective composites supply the abuse context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: revealed-users-attribute
    desc: RODC msDS-RevealedUsers cache attribute
    if:
      type: text
      regex: '(?i)\bmsDS-RevealedUsers\b'

  - id: reveal-on-demand-group-attribute
    desc: RODC msDS-RevealOnDemandGroup attribute
    if:
      type: text
      regex: '(?i)\bmsDS-RevealOnDemandGroup\b'

  - id: never-reveal-group-attribute
    desc: RODC msDS-NeverRevealGroup attribute
    if:
      type: text
      regex: '(?i)\bmsDS-NeverRevealGroup\b'

  - id: krbtgt-link-attribute
    desc: RODC msDS-KrbTgtLink attribute
    if:
      type: text
      regex: '(?i)\bmsDS-KrbTgtLink\b'

  - id: rodc-krbtgt-account-name
    desc: Per-RODC krbtgt account name
    if:
      type: text
      regex: '(?i)\bkrbtgt_\d{1,6}\b'
