defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: preauthentication-disabled-filter
    desc: LDAP preauthentication-disabled account filter
    if:
      type: text
      regex: '(?i)\(userAccountControl:1\.2\.840\.113556\.1\.4\.803:=4194304\)'

  - id: noncomputer-spn-filter
    desc: LDAP noncomputer SPNs excluding krbtgt
    if:
      type: text
      regex: '(?i)\(servicePrincipalName=\*\)\(!\(objectClass=computer\)\)\(!\(cn=krbtgt\)\)'

  - id: python-search-filter-call
    desc: Python LDAP searchFilter call
    for: [python]
    if:
      type: text
      regex: '\.search\(\s*(searchBase\s*=\s*[^,\n]{1,100},\s*)?searchFilter\s*='
