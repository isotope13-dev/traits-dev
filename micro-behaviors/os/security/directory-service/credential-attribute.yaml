# Machine credential material stored in the directory: LAPS writes rotated
# local-admin passwords to the computer object and gMSA leaves the managed
# service-account password blob readable over LDAP to authorized principals.
# The attribute reference is the capability signal; whether the reader is an
# authorized administrator or a relayed attacker needs independent objective
# evidence, so these stay notable references like their siblings.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: laps-password-attribute
    desc: LAPS password directory attribute reference
    if:
      type: literal
      regex: '(?i)ms-(MCS-AdmPwd|LAPS-Encrypted(Domain)?Password|LAPS-Password)\b'
      exclude_docstrings: true

  - id: gmsa-managed-password-attribute
    desc: gMSA managed-password attribute reference
    conf: 0.97
    if:
      type: literal
      regex: '(?i)^msDS-ManagedPassword$'
      exclude_docstrings: true
