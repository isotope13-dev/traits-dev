traits:
  - id: ldap-directory-modify-command
    for: [shell, python, perl, go]
    platforms: [unix]
    desc: LDAP directory add/modify client command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bldap(add|modify)\b'

  # bloodyAD / dirkit style "set object <DN>" attribute writes. The required
  # DN or machine-account target keeps it off prose uses of "set object".
  - id: ldap-object-set-command
    for: [scripts, source]
    platforms: [unix, windows]
    desc: Directory object attribute-set command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(set|modify)\s+object\s+[''"]?(CN=|OU=|DC=|[A-Za-z0-9_.-]{1,64}\$)'

  - id: ldif-modify-changetype
    for: [scripts, source, text]
    platforms: [unix, windows]
    desc: LDIF record requests an entry modify
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?im)^\s*changetype\s*:\s*modify\s*$'
