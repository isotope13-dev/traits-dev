defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.95
traits:
  - id: authentication-key-attribute
    desc: Zimbra authentication-secret LDAP attribute
    if:
      type: text
      regex: '\bzimbra(AuthTokenKey|PreAuthKey|TwoFactorAuthSecret)\b'
  - id: ldapsearch-command
    desc: ldapsearch command with query arguments
    if:
      type: text
      regex: '\bldapsearch\s+[^\r\n]{0,300}-b\s+'
  - id: zmprov-domain-query
    desc: Zimbra provisioning domain-attribute query
    if:
      type: text
      regex: '\bzmprov\s+(gd|getDomain)\s+'
  - id: zmlocalconfig-secret-command
    desc: Zimbra configuration secret-display command
    if:
      type: text
      regex: '\bzmlocalconfig\s+-s\b'
