defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  # Legitimate SSP installers use this API too. Loading a provider alone
  # establishes neither credential interception nor unwanted persistence.
  - id: powershell-add-security-package-call
    desc: PowerShell calls SSPI package loader
    if:
      type: text
      regex: '::AddSecurityPackage[AW]?\s*\('
