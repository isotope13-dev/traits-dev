# The Windows entry point a DLL exports to *be* a Security Support Provider,
# as opposed to the SSPI functions a client calls to *use* one (those live in
# windows.yaml next to this file). LSASS calls SpLsaModeInitialize when it
# loads a package listed under the Security Packages registry value, so a
# binary exporting it is asking to run inside LSASS on the authentication path.
#
# Neutral on its own: single sign-on agents, smart-card middleware and
# federation products all ship a legitimate SSP. Objectives that infer
# credential interception combine it with the other logon interfaces.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96
  attack: T1547.005

traits:
  - id: ssp-lsa-mode-initialize
    desc: Security Support Provider LSA entry point
    if:
      type: symbol
      kind: export
      exact: SpLsaModeInitialize
