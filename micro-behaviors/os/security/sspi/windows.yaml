# SSPI (Security Support Provider Interface) is the Windows entry point for
# both TLS via schannel and for Negotiate/NTLM/Kerberos authentication, so a
# program that imports it is either speaking TLS through the OS stack or
# authenticating against a Windows service. Neutral and extremely common —
# every Rust/Go/C++ binary that uses the platform TLS verifier lands here.
#
# It is recorded because nothing did: the only place these names appeared was
# objectives/evasion/masquerade/dll/proxy/secur32.yaml, which models a DLL that
# *re-exports* the SSPI surface for sideloading. Those traits now use
# `type: export`, which is what their names claim; without this file, tightening
# them would have removed the SSPI observation from the corpus entirely rather
# than moving it to the tier it belongs in.
#
# The A/W pairs are one signal spelled two ways, not two signals, so they stay
# in a single anchored regex per function.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: sspi-acquire-credentials-handle
    desc: Acquires an SSPI credential handle
    if:
      type: import
      regex: '^AcquireCredentialsHandle[AW]$'

  - id: sspi-initialize-security-context
    desc: Initializes an SSPI client security context
    if:
      type: import
      regex: '^InitializeSecurityContext[AW]$'

  - id: sspi-accept-security-context
    desc: Accepts an SSPI server security context
    if:
      type: import
      regex: '^AcceptSecurityContext[AW]?$'

  # Constant name only — appears in SDK headers and in clients that request
  # datagram-mode SSPI contexts. Intent comes from objective composites.
  - id: isc-req-datagram-flag
    desc: ISC_REQ_DATAGRAM flag constant
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\bISC_REQ_DATAGRAM\b'

  - id: sspi-acquire-creds-source
    desc: Calls AcquireCredentialsHandle in source
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\bAcquireCredentialsHandle[AW]?\s*\('
    unless:
      - id: metadata/lang/security::windows-sdk-security-header-declarations

  - id: sspi-init-context-source
    desc: Calls InitializeSecurityContext in source
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\bInitializeSecurityContext[AW]?\s*\('
    unless:
      - id: metadata/lang/security::windows-sdk-security-header-declarations

composite_rules:
  - id: sspi-datagram-client
    desc: Uses SSPI datagram client authentication
    crit: notable
    conf: 0.94
    for: [pe, dll, c, cpp, csharp, go, rust]
    all:
      - id: isc-req-datagram-flag
    any:
      - id: sspi-acquire-creds-source
      - id: sspi-init-context-source
      - id: sspi-acquire-credentials-handle
      - id: sspi-initialize-security-context
    unless:
      - id: metadata/lang/security::windows-sdk-security-header-declarations
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-binding-crate
