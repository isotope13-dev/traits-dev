traits:
- id: defender-exclusion-command-reference
  desc: Defender exclusion mutation command text
  crit: notable
  conf: 0.95
  for: [scripts, source, binaries, data]
  if:
    type: text
    regex: '(?i)\b(Set|Add)-MpPreference[\s`]{1,24}-Exclusion(Path|Extension|Process|IpAddress)\b'
- id: defender-preference-mutation-call
  desc: Calls Set-MpPreference or Add-MpPreference
  crit: notable
  conf: 0.99
  for: [powershell]
  if:
    type: symbol
    kind: call
    regex: '(?i)^(Set|Add)-MpPreference$'
- id: defender-exclusion-command-line
  desc: Bare Defender exclusion mutation command line
  crit: notable
  conf: 0.97
  for: [powershell]
  if:
    type: text
    regex: '(?im)^[ \t]*(Set|Add)-MpPreference[\s`]{1,24}-Exclusion(Path|Extension|Process|IpAddress)'
- for:
  - batch
  - powershell
  - csharp
  - java
  id: defender-exclusion-process
  desc: Defender process-exclusion parameter context
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
  - id: well-known/app/ai/media/comfy-test::generated-vm-template
  - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
  - id: metadata/package/tooling::azure-agentbaker-tree
  - id: metadata/build/ci/github-actions::workflow-definition-path
  - id: well-known/app/infrastructure/
  if:
    id: micro-behaviors/os/security/defender::defender-exclusion-process-parameter
defaults:
  platforms:
  - windows

composite_rules:
- for:
  - powershell
  id: powershell-exclusion-assignment
  desc: Defender exclusion mutation call or command
  crit: notable
  conf: 0.95
  all:
  - id: defender-exclusion-command-reference
  any:
  - id: defender-preference-mutation-call
  - id: defender-exclusion-command-line
  near_bytes: 160
  unless:
  - id: well-known/dual-use/tunnel/frp/
  - id: well-known/tool/development/toolchain/go-x-build/
  - id: metadata/package/documentation/agent-safety::security-example-documentation
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
  - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
  - id: well-known/app/infrastructure/ansible/
  - id: well-known/app/enterprise/dotmatics-dtx/
  - id: metadata/build/ci/github-actions::workflow-definition-path
