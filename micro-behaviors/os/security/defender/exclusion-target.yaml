# An option naming TEMP/TMP is configuration evidence, not proof of a
# mutation or an evasion objective. Preserve the original matching scope.
defaults:
  platforms: [windows]
  for: [scripts, binaries, source]

traits:
  - id: defender-exclusion-temp-environment
    desc: Defender exclusion option names TEMP or TMP
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '-ExclusionPath[\s\S]{0,240}(\$env:(TEMP|TMP)\b|%(TEMP|TMP)%)([\s";,)]|$)'
      case_insensitive: true
