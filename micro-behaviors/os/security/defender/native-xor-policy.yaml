defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # Recognizes plaintext algebra, not a build's ciphertext or random XOR key.
  # The same 16-byte key repeats, with the byte index XORed into each byte.
  - id: xor-index-defender-extension-policy
    desc: XOR-index Defender extension exclusion path
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule xor_index_defender_extension_policy {
          strings:
            $decoder = { 41 89 C9 41 83 E1 0F 47 8A 0C 01 41 30 C9 44 30 0C 08 48 FF C1 }
          condition:
            $decoder and pe.is_pe and
            for any s in (0..pe.number_of_sections - 1) : (
              pe.sections[s].name == ".data" and
              pe.sections[s].raw_data_size >= 134 and
              pe.sections[s].raw_data_size <= 65536 and
              for any o in (pe.sections[s].raw_data_offset..
                pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size - 134) : (
                (uint8(o + 16) ^ uint8(o + 0)) == 31 and
                (uint8(o + 17) ^ uint8(o + 1)) == 16 and
                (uint8(o + 18) ^ uint8(o + 2)) == 15 and
                (uint8(o + 19) ^ uint8(o + 3)) == 16 and
                (uint8(o + 20) ^ uint8(o + 4)) == 57 and
                (uint8(o + 21) ^ uint8(o + 5)) == 16 and
                (uint8(o + 22) ^ uint8(o + 6)) == 40 and
                (uint8(o + 23) ^ uint8(o + 7)) == 16 and
                (uint8(o + 24) ^ uint8(o + 8)) == 46 and
