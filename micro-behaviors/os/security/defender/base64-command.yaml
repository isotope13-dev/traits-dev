defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: base64-path-exclusion-command
    desc: Base64-embedded Defender path-exclusion command
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule base64_defender_path_exclusion_command {
          strings:
            $command = "Add-MpPreference -ExclusionPath" base64
          condition:
            // Any non-.data section, not the overlay: dumped or repacked images
            // lose the original .rdata name but keep the embedded script.
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].raw_data_size > 0 and
              pe.sections[s].name != ".data" and
              for any i in (1..#command) : (
                @command[i] >= pe.sections[s].raw_data_offset and
                @command[i] + !command[i] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
              )
            )
        }
