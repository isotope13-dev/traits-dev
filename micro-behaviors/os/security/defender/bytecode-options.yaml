defaults:
  for: [pyc]
  platforms: [windows]
traits:
  - id: bytecode-defender-exclusion-option
    desc: Bytecode Defender exclusion command option
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: 'Add-MpPreference[\s\S]{0,64}-ExclusionPath'
  - id: bytecode-system-root-exclusion-list
    desc: Exclusion list names Windows and user roots
    crit: notable
    conf: 0.98
    # Marshal type/length bytes separate these constants. Matching across
    # that byte framing cannot use the separately extracted text strings.
    if:
      type: raw
      regex: 'C:\\Windows,[\s\S]{0,64}C:\\ProgramData,[\s\S]{0,64}C:\\Users'
