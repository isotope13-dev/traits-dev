defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-profile-root-exclusion-commands
    desc: Batch sets profile-root path/process exclusions
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: batch
      query: |
        (program
          (cmd (command_name) @path_shell (argument_list) @path_args)
          (cmd (command_name) @process_shell (argument_list) @process_args)
          (#match? @path_shell "(?i)^cmd([.]exe)?$")
          (#match? @process_shell "(?i)^cmd([.]exe)?$")
          (#match? @path_args "(?i)^/c\\s+powershell([.]exe)?\\s+")
          (#match? @process_args "(?i)^/c\\s+powershell([.]exe)?\\s+")
          (#match? @path_args "(?i)-(Command|c)\\s+Add-MpPreference\\s+-ExclusionPath\\s+")
          (#match? @process_args "(?i)-(Command|c)\\s+Add-MpPreference\\s+-ExclusionProcess\\s+")
          (#match? @path_args "(?i)-ExclusionPath\\s+['\"]?%UserProfile%[\\\\*]*['\"]?(\\s|$)")
          (#match? @process_args "(?i)-ExclusionProcess\\s+['\"]?%UserProfile%[\\\\*]*['\"]?(\\s|$)"))
