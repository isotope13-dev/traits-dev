defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, data, pe, javascript, python]
  crit: notable
  conf: 0.96

traits:
  - id: defender-client-library
    desc: Loads the Microsoft Defender client library
    crit: notable
    conf: 0.96
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: MpClient.dll

  - id: defender-manager-open-api
    desc: Opens the Microsoft Defender scan manager
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: MpManagerOpen

  - id: defender-resource-scan-api
    desc: Starts a Microsoft Defender resource scan
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: MpScanStart

  - id: defender-clean-open-api
    desc: Opens a Microsoft Defender clean operation
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: MpCleanOpen

  - id: defender-clean-start-api
    desc: Starts a Microsoft Defender clean operation
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: MpCleanStart

  - id: defender-clean-control-api
    desc: Controls a Microsoft Defender clean operation
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: MpCleanControl

  - id: defender-product-name-reference
    desc: Microsoft Defender product name reference
    crit: notable
    conf: 0.85
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(windows|microsoft)[ _-]+defender([\s"''.,;:)]|$)|\bdefender antivirus\b'

  # Matched inside the literal rather than anchored to the whole of it. The
  # anchored form only saw code that passes the cmdlet name as its own
  # argument; the ordinary way to write this -- assembling the command line,
  # `"Add-MpPreference -ExclusionPath '" + p + "'"` -- puts the name in the
  # middle of a longer string, and every such script was missed. Staying on
  # `literal` (not `text`) keeps the match inside real string constants, so a
  # comment or an identifier mentioning the cmdlet still does not count.
  - id: defender-exclusion-cmdlet
    desc: Defender exclusion mutation cmdlet reference
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      regex: '(?i)\b(Add|Remove)-MpPreference\b'

  - id: defender-exclusion-preference-query
    desc: Defender exclusion preference query
    if:
      type: text
      regex: '\bGet-MpPreference\b[\s\S]{0,80}\.ExclusionPath\b'
      case_insensitive: true

  - id: defender-exclusion-path-parameter
    desc: Defender exclusion path parameter
    crit: component
    conf: 0.92
    if:
      type: text
      substr: -ExclusionPath
      case_insensitive: true

  # Text extraction retains visibility into batch files prefixed with a false
  # UTF-16 BOM: the byte-swapped representation is exposed as Han text while
  # the ordinary command remains available in correctly decoded batch files.
  - id: batch-defender-exclusion-command-text
    desc: Batch adds a Microsoft Defender exclusion
    crit: notable
    conf: 0.99
    for: [batch]
    if:
      type: text
      regex: '(?i)Add-MpPreference\s+-Exclusion(Path|Process|Extension)\b'

  - id: defender-exclusion-process-parameter
    desc: Defender exclusion process parameter
    crit: component
    conf: 0.96
    for: [batch, powershell, csharp, java]
    if:
      type: text
      substr: -ExclusionProcess
      case_insensitive: true

  - id: defender-path-exclusion-registry-key
    desc: Defender path-exclusion registry key
    crit: notable
    conf: 0.99
    for: [pe, dll, csharp]
    if:
      type: text
      exact: 'SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths'

  - id: defender-process-exclusion-registry-key
    desc: Defender process-exclusion registry key
    crit: notable
    conf: 0.99
    for: [pe, dll, csharp]
    if:
      type: text
      exact: 'SOFTWARE\Microsoft\Windows Defender\Exclusions\Processes'

  - id: defender-policies-registry-key
    desc: Microsoft Defender machine-policy registry key
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)SOFTWARE\\+Policies\\+Microsoft\\+Windows Defender'

  - id: defender-disable-antispyware-policy-value
    desc: Defender DisableAntiSpyware policy value
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      word: DisableAntiSpyware

  - id: defender-exclusion-extension-parameter
    desc: Defender exclusion extension parameter
    crit: component
    conf: 0.96
    for: [batch, powershell]
    if:
      type: text
      substr: -ExclusionExtension
      case_insensitive: true

  - id: batch-defender-exclusion-false-bom
    desc: False-BOM batch has Defender exclusion
    crit: notable
    conf: 0.99
    for: [batch]
    if:
      # UTF-16LE interpretation of the raw ASCII bytes spanning
      # "Add-MpPreference -Exclusion" on an odd byte boundary.
      type: text
      substr: '摁ⵤ灍牐晥牥湥散ⴠ硅汣獵潩'

  - id: batch-defender-extension-exclusion-false-bom
    desc: False-BOM batch has extension exclusion
    crit: notable
    conf: 0.99
    for: [batch]
    if:
      type: text
      substr: '䕮瑸湥楳湯'

  - id: defender-reenable-realtime
    desc: Restores Windows Defender realtime monitoring
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: Set-MpPreference\s+.{0,80}-DisableRealtimeMonitoring\s+\$?false
      case_insensitive: true

composite_rules:
  - id: defender-resource-scan-workflow
    desc: Opens and starts a Defender resource scan
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    all:
      - id: defender-client-library
      - id: defender-manager-open-api
      - id: defender-resource-scan-api

  - id: defender-clean-workflow
    desc: Opens and controls a Defender clean operation
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    all:
      - id: defender-client-library
      - id: defender-clean-open-api
      - id: defender-clean-start-api
      - id: defender-clean-control-api
  - id: defender-exclusion-command
    desc: Builds a Defender exclusion mutation command
    crit: notable
    conf: 0.96
    near_bytes: 384
    all:
      - id: defender-exclusion-cmdlet
      - id: defender-exclusion-path-parameter

  - id: batch-broad-defender-exclusions
    desc: Batch adds multiple broad Defender exclusions
    crit: notable
    conf: 0.99
    for: [batch]
    near_bytes: 1200
    all:
      - id: batch-defender-exclusion-command-text
      - id: defender-exclusion-path-parameter
      - id: defender-exclusion-process-parameter
      - id: defender-exclusion-extension-parameter

  - id: temporary-module-install-restoration
    desc: Temporary Defender disable restored after module installation
    crit: exception
    conf: 0.98
    all:
      - id: defender-reenable-realtime
      - id: micro-behaviors/os/module/load::powershell-install-module
      - id: micro-behaviors/os/module/load::powershell-skip-publisher-check

  - id: defender-antispyware-policy-write-source
    desc: Source writes the Defender DisableAntiSpyware policy
    crit: suspicious
    conf: 0.97
    for: [c, cpp, csharp, go, rust]
    near_bytes: 768
    all:
      - id: defender-policies-registry-key
      - id: defender-disable-antispyware-policy-value
      - id: micro-behaviors/os/registry/access::registry-set-value-source
