defaults:
  for:
  - pe
  - powershell
  - batch
  - vbs
  platforms:
  - windows

traits:
  - id: defender-exclusion-programdata-environment
    desc: ProgramData exclusion option reference
    crit: notable
    conf: 0.97
    for:
      - scripts
      - binaries
      - source
    if:
      type: text
      regex: -ExclusionPath[\s\S]{0,240}(\$env:ProgramData\b|%ProgramData%)([\s";,)]|$)
      case_insensitive: true
  - id: defender-exclusion-allusers-profile-environment
    desc: Shared profile exclusion option reference
    crit: notable
    conf: 0.97
    for:
      - scripts
      - binaries
      - source
    if:
      type: text
      regex: -ExclusionPath[\s\S]{0,240}%AllUsersProfile%([\s";,)]|$)
      case_insensitive: true
  - id: defender-exclusion-executable-extension
    desc: Executable extension exclusion option reference
    crit: notable
    conf: 0.99
    for:
      - scripts
      - binaries
      - source
    if:
      type: text
      regex: (?i)-ExclusionExtension[^\r\n]{0,200}\.exe\b
  - id: defender-exclusion-driver-extension
    desc: Driver extension exclusion option reference
    crit: notable
    conf: 0.99
    for:
      - scripts
      - binaries
      - source
    if:
      type: text
      regex: (?i)-ExclusionExtension[^\r\n]{0,200}\.sys\b
  - id: defender-exclusion-users-root
    desc: Users root exclusion option reference
    crit: notable
    conf: 0.96
    for:
      - batch
      - powershell
      - java
      - vbs
      - csharp
    if:
      type: text
      regex: (?i)-ExclusionPath\s+['"]C:\\+Users['"]
  - id: defender-exclusion-javaw-image
    desc: Java process exclusion option reference
    crit: notable
    conf: 0.94
    for:
      - batch
      - powershell
      - java
      - vbs
      - csharp
    if:
      type: text
      regex: (?i)-ExclusionProcess\s+['"]javaw(\.exe)?['"]
