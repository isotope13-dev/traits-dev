defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data]
  crit: notable
  conf: 0.96
traits:
  - id: cim-preference-add-method
    desc: Defender CIM preference mutation method options
    if:
      type: text
      regex: '(?i)MSFT_MpPreference["'']?\s+-MethodName\s+["'']?(Add|Set)\b'
  - id: cim-exclusion-argument
    desc: Defender CIM exclusion argument assignment
    if:
      type: text
      regex: '(?i)\bExclusion(Path|Extension|Process|IpAddress)\s*='
  - id: exclusion-store-category
    desc: Defender exclusion registry category reference
    if:
      type: text
      regex: '(?i)Microsoft\\+Windows Defender\\+Exclusions\\+(Paths|Extensions|Processes|IpAddresses)'
  - id: python-exclusion-key-open
    desc: Opens a Defender exclusion registry subkey
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^winreg\.(CreateKeyEx|OpenKey)$'
      arg:
        index: 1
        regex: '^SOFTWARE\\(Policies\\)?Microsoft\\Windows Defender\\Exclusions\\\w+$'
  - id: policy-registry-value-option
    desc: Defender policy registry value command option
    if:
      type: text
      regex: '(?i)Policies\\+Microsoft\\+Windows Defender["'']?\s+/v\s+'
  - id: hide-exclusions-enabled-option
    desc: Enabled exclusion concealment registry option
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bHideExclusionsFromLocalAdmins["'']?\s+/t\s+REG_DWORD\s+/d\s+1\b'
