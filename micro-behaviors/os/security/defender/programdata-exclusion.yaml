defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data]
  crit: notable
  conf: 0.96

traits:
  - id: programdata-exclusion-path-argument
    desc: Defender ProgramData exclusion argument
    if:
      type: text
      regex: '(?i)-ExclusionPath\s+["'']?[A-Z]:\\+ProgramData\\+'

  - id: programdata-env-exclusion-path-argument
    desc: Defender ProgramData environment exclusion
    if:
      type: text
      regex: '(?i)-ExclusionPath\s+["'']?%ProgramData%\\+'

  - id: programdata-powershell-exclusion-path-argument
    desc: Defender PowerShell ProgramData exclusion
    if:
      type: text
      regex: '(?i)-ExclusionPath\s+["'']?\$env:ProgramData\\+'

composite_rules:
  - id: programdata-exclusion-path-argument-any
    desc: Defender exclusion argument names ProgramData subtree
    any:
      - id: programdata-exclusion-path-argument
      - id: programdata-env-exclusion-path-argument
      - id: programdata-powershell-exclusion-path-argument
