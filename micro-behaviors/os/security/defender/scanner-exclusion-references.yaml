# These are file-scoped references, not proof MpCmdRun receives an exclusion.
# XWorm Options invokes Add-MpPreference through PowerShell instead.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: scanner-path-exclusion-references
    desc: Defender scanner and exclusion-path references
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/info/name::mpcmdrun-executable-reference
      - id: defender-exclusion-path-parameter
      - id: defender-exclusion-option-text
