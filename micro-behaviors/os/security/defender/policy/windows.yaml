defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, data, pe, javascript, python]
  crit: notable
  conf: 0.96

traits:
  - id: defender-policy-registry-key
    desc: References Defender policy registry key
    crit: notable
    conf: 0.98
    for: [c, cpp, csharp, rust, go]
    if:
      type: literal
      kind: string
      regex: 'SOFTWARE\\{1,2}Policies\\{1,2}Microsoft\\{1,2}Windows Defender'

  - id: defender-disable-antispyware-value
    desc: References Defender AntiSpyware disable policy
    crit: notable
    conf: 0.98
    for: [c, cpp, csharp, rust, go]
    if:
      type: literal
      kind: string
      word: DisableAntiSpyware

  # Matched inside the literal rather than anchored to the whole of it. The
  # anchored form only saw code that passes the cmdlet name as its own
  # argument; the ordinary way to write this -- assembling the command line,
  # `"Add-MpPreference -ExclusionPath '" + p + "'"` -- puts the name in the
  # middle of a longer string, and every such script was missed. Staying on
  # `literal` (not `text`) keeps the match inside real string constants, so a
  # comment or an identifier mentioning the cmdlet still does not count.
  - id: defender-preference-mutation-cmdlet
    desc: Defender preference mutation cmdlet reference
    crit: notable
    conf: 0.96
    for: [scripts, source, binaries, data]
    if:
      type: literal
      kind: string
      regex: '(?i)\b(Add|Set|Remove)-MpPreference\b'

  - id: defender-preference-option-prefix
    desc: Add-MpPreference command option prefix
    crit: notable
    conf: 0.96
    for: [scripts, binaries, source]
    if:
      type: text
      # PowerShell may use a backtick line continuation before the first
      # option; native payloads can retain that formatting in a string.
      regex: '(?i)\bAdd-MpPreference\b[\s`]{1,24}-'

  - id: defender-policies-registry-key
    desc: Microsoft Defender machine-policy registry key
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)SOFTWARE\\+Policies\\+Microsoft\\+Windows Defender'

  - id: defender-disable-antispyware-policy-value
    desc: Defender DisableAntiSpyware policy value
    crit: notable
    conf: 0.98
    # Source parsers use the literal-only atom above; retain byte-text
    # coverage here for compiled Windows artifacts without duplicating the
    # same source-language match across two atom types.
    for: [pe, dll]
    if:
      type: text
      word: DisableAntiSpyware

  - id: test-cluster-guarded-preference-change
    desc: Test-cluster gated Defender preference change
    crit: notable
    conf: 0.98
    for: [powershell]
    if:
      type: text
      regex: 'if\s*\(\s*\(?\s*Test-IsTestCluster[\s\S]{0,200}Set-MpPreference'
      case_insensitive: true

  # Node/provisioning scripts assemble the same cmdlet line in a string and
  # hand it to powershell.exe (observed in @a11ign/screenreader-worker
  # windows-trim.mjs); the technique is identical, so script-embedded
  # spellings share this home with implementation carried in `for:`.
  - id: defender-disable-realtime
    desc: Defender realtime-disable command text
    crit: suspicious
    conf: 0.95
    for: [pe, dll, batch, powershell, vbs]
    if:
      type: text
      regex: Set-MpPreference\s+.{0,50}-DisableRealtimeMonitoring\s+(\$?true|1)\b
      case_insensitive: true
      exclude_comments: true
    unless:
      - id: well-known/tool/sysadmin/gce-image-build::gce-windows-disk-bootstrap
      - id: well-known/app/ai/media/comfy-test::generated-vm-template
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-test-defender-exception
      - id: micro-behaviors/os/security/command-policy/gate::command-policy-implementation-context
      - id: micro-behaviors/os/security/command-policy/gate::native-command-guard-policy
    downgrade:
      any:
        - id: defender-ci-workflow-context
        - id: metadata/package/testing/compiled::go-compiled-test-binary
        - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-node-setup-defender-context

  - id: defender-disable-realtime-source
    desc: Defender realtime-disable command text in source
    crit: notable
    conf: 0.95
    for: [javascript, typescript, go, c]
    if:
      type: text
      regex: Set-MpPreference\s+.{0,50}-DisableRealtimeMonitoring\s+(\$?true|1)\b
      case_insensitive: true
      exclude_comments: true
    unless:
      - id: well-known/app/development/a11ign-screenreader-worker::windows-trim-routine
      - id: micro-behaviors/os/security/command-policy/gate::command-policy-implementation-context
      - id: metadata/package/testing/harness/unit::go-test-source-file
      - id: metadata/package/testing/harness/fixture::js-declared-test-data
      - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
  - id: defender-reenable-realtime
    desc: Restores Windows Defender realtime monitoring
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: Set-MpPreference\s+.{0,80}-DisableRealtimeMonitoring\s+\$?false
      case_insensitive: true

composite_rules:
  - id: defender-ci-workflow-context
    desc: CI workflow definition or step script
    for: [batch, powershell]
    any:
      - id: metadata/build/ci/github-actions::workflow-definition-path
      - id: metadata/build/ci/step::workflow-or-composite-step-script

  # A Python source file can carry EC2 PowerShell user data as a string. Keep
  # the Defender change visible as a capability, but treat a disable/restore
  # pair inside that explicit provisioning template as setup context.
  - id: ec2-user-data-defender-restoration
    desc: EC2 bootstrap restores Defender monitoring
    crit: exception
    conf: 0.98
    for: [python]
    all:
      - id: metadata/build/recognized-contexts::ec2-user-data-powershell-context
      - id: powershell-realtime-disable-command
      - id: defender-reenable-realtime

  - id: temporary-module-install-restoration
    desc: Temporary Defender disable restored after module installation
    crit: exception
    conf: 0.98
    for: [powershell]
    all:
      - id: defender-reenable-realtime
      - id: micro-behaviors/os/package-manager/install::powershell-install-module
      - id: micro-behaviors/os/package-manager/verify::powershell-skip-publisher-check

  - id: defender-antispyware-policy-write-source
    desc: Source writes the Defender DisableAntiSpyware policy
    crit: suspicious
    conf: 0.97
    for: [c, cpp, csharp, go, rust]
    near_bytes: 768
    all:
      - id: defender-policies-registry-key
      - id: defender-disable-antispyware-value
      - id: micro-behaviors/os/registry/value/write::registry-set-value-source
