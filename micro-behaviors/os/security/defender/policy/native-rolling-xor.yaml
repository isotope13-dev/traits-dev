# UTF-16 names XORed with (0x5a3c + 13 * character index).
# The decoded names were verified against the native registry/WMI routines.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
traits:
  - id: rolling-xor-realtime-disable-flag
    desc: XOR-masks Defender realtime disable flag
    if:
      type: hex
      section: .rdata
      pattern: "78 5A 20 5A 25 5A 02 5A 12 5A 11 5A EF 5A C5 5A C1 5A D0 5A D2 5A BF 5A B1 5A 88 5A 97 5A B2 5A 63 5B 77 5B 4F 5B 47 5B 2F 5B 3F 5B 33 5B 09 5B 13 5B"
  - id: rolling-xor-behavior-disable-flag
    desc: XOR-masks Defender behavior disable flag
    if:
      type: hex
      section: .rdata
      pattern: "78 5A 20 5A 25 5A 02 5A 12 5A 11 5A EF 5A D5 5A C1 5A D9 5A DF 5A BD 5A B1 5A 8A 5A 80 5A B2 5A 63 5B 77 5B 4F 5B 47 5B 2F 5B 3F 5B 33 5B 09 5B 13 5B"
