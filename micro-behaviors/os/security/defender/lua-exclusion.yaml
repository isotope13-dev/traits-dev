defaults:
  platforms: [windows]
  for: [lua]
traits:
  - id: lua-system-drive-exclusion-command
    desc: Lua Defender system-drive exclusion command
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'Add-MpPreference -ExclusionPath $env:SystemDrive'
  - id: lua-executable-extension-exclusion-command
    desc: Lua Defender EXE/DLL exclusion command
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: '-ExclusionExtension .exe, .dll'
