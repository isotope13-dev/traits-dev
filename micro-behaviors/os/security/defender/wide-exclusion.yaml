defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: utf16-defender-path-exclusion-store
    desc: UTF-16 Defender path exclusion store reference
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: wide
      exact: 'SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths'
      case_insensitive: true
