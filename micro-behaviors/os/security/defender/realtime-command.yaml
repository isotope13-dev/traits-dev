defaults:
  platforms: [windows]
  for: [powershell]

traits:
  # Report the command even in provisioning contexts where intent-based
  # Defender evasion is suppressed. It does not prove execution or success.
  - id: powershell-realtime-disable-command
    desc: Command to disable Defender real-time protection
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[ \t]*Set-MpPreference[ \t]+.{0,80}-DisableRealtimeMonitoring[ \t]+(\$?true|1)\b'
