defaults:
  platforms: [windows]
  for: [scripts, binaries, data]

traits:
- id: mpcmdrun-signature-removal-option
  desc: Defender signature-removal option reference
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: '(?i)\-(RemoveDefinitions|RemoveDynamicSignature)\b'
  unless:
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: metadata/path::test-directory-component
  - id: micro-behaviors/ui/help::mpcmdrun-signature-removal-help

composite_rules:
- id: mpcmdrun-signature-removal-references
  desc: MpCmdRun with signature-removal option
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/process/info/name::mpcmdrun-executable-reference
  - id: mpcmdrun-signature-removal-option
  unless:
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: metadata/path::test-directory-component
  - id: micro-behaviors/ui/help::mpcmdrun-signature-removal-help
