defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, zig]
  crit: notable
  conf: 0.97

traits:
  - id: defender-client-library
    desc: Defender client library reference
    conf: 0.96
    if:
      type: text
      word: MpClient.dll

  - id: defender-manager-open-api
    desc: Defender scan manager open API reference
    if:
      type: text
      word: MpManagerOpen

  - id: defender-resource-scan-api
    desc: Defender resource scan API reference
    if:
      type: text
      word: MpScanStart

  - id: defender-clean-open-api
    desc: Defender clean open API reference
    if:
      type: text
      word: MpCleanOpen

  - id: defender-clean-start-api
    desc: Defender clean start API reference
    if:
      type: text
      word: MpCleanStart

  - id: defender-clean-control-api
    desc: Defender clean control API reference
    if:
      type: text
      word: MpCleanControl

  - id: defender-shadow-target-object-directory
    desc: Defender shadow target object directory
    conf: 0.99
    if:
      type: literal
      kind: string
      substr: '\BaseNamedObjects\Restricted\WD_TARGET_'

  - id: defender-shadow-scan-object-directory
    desc: References Defender shadow scan object directory
    conf: 0.99
    if:
      type: literal
      kind: string
      substr: '\BaseNamedObjects\Restricted\WD_SHADOW_'

  - id: defender-shadow-scan-link-name
    desc: References Defender shadow scan link name
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: WD_SCAN

  - id: defender-product-name-reference
    desc: Microsoft Defender product name reference
    conf: 0.85
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(windows|microsoft)[ _-]+defender([\s"''.,;:)]|$)|\bdefender antivirus\b'

composite_rules:
  - id: defender-resource-scan-workflow
    desc: References Defender resource scan APIs
    conf: 0.98
    all:
      - id: defender-client-library
      - id: defender-manager-open-api
      - id: defender-resource-scan-api

  - id: defender-clean-workflow
    desc: References Defender clean APIs
    conf: 0.98
    all:
      - id: defender-client-library
      - id: defender-clean-open-api
      - id: defender-clean-start-api

  - id: defender-shadow-scan-namespace
    desc: Builds Microsoft Defender shadow scan namespace
    conf: 0.995
    needs: 2
    any:
      - id: defender-shadow-target-object-directory
      - id: defender-shadow-scan-object-directory
      - id: defender-shadow-scan-link-name
    near_bytes: 8192
