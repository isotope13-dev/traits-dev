# Neutral observations reviewed from stranded members.
traits:
- id: component-name-reference
  desc: Defender process service or driver name
  conf: 0.94
  if:
    type: text
    regex: (?i)\b(WdFilter(\.sys)?|WdNisDrv(\.sys)?|MsMpEng\.exe|WinDefend)\b
  crit: notable
  platforms:
  - windows
  for:
  - binaries
  - scripts
  - c
  - cpp
  - csharp
  - powershell
  - batch
  - go
  - rust
  - python
  size_max: 52428800
