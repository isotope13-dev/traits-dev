defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  crit: suspicious
  conf: 0.98
traits:
- id: percent-userprofile-root-path-exclusion
  desc: ExclusionPath targets the user-profile root
  if:
    type: text
    regex: '(?i)-ExclusionPath\s+[''"]?%UserProfile%[\\*]*[''"]?(\s|$)'
- id: powershell-userprofile-root-path-exclusion
  desc: ExclusionPath targets PowerShell user profile
  if:
    type: text
    regex: '(?i)-ExclusionPath\s+[''"]?\$env:UserProfile[\\*]*[''"]?(\s|$)'
- id: percent-userprofile-root-process-exclusion
  desc: ExclusionProcess targets the user-profile root
  for: [batch, powershell]
  if:
    type: text
    regex: '(?i)-ExclusionProcess\s+[''"]?%UserProfile%[\\*]*[''"]?(\s|$)'
composite_rules:
- id: user-profile-root-path-exclusion-target
  desc: Defender exclusion targets user-profile root
  any:
  - id: percent-userprofile-root-path-exclusion
  - id: powershell-userprofile-root-path-exclusion
  unless:
  - id: metadata/build/ci/github-actions::github-ci-runner-script-context
  - id: metadata/build/ci/agent::ci-runner-windows-configuration-context
