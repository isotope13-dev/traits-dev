defaults:
  platforms: [windows]
  for: [pe, scripts, c, cpp]
  crit: notable
  conf: 0.9
traits:
- id: remove-definitions-command-option
  desc: Defender definition-rollback command option
  if:
    type: text
    regex: '(?i)-RemoveDefinitions\b'
- id: disable-service-definition-update-text
  desc: DisableService near DefinitionUpdate text
  if:
    type: text
    regex: '(?i)DisableService.{0,80}DefinitionUpdate'

composite_rules:
- id: definition-update-control-text
  desc: Definition rollback or update-disable references
  any:
  - id: remove-definitions-command-option
  - id: disable-service-definition-update-text
