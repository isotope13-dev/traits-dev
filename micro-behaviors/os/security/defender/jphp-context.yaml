defaults:
  platforms: [windows]
  for: [pe, data, php, xml]
composite_rules:
- id: jphp-powershell-defender-exclusion
  for:
  - pe
  - data
  desc: PowerShell Defender exclusion process context
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  any:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-bootstrap-config
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-process-class
  - id: micro-behaviors/fs/write/file/full::jphp-file-put-contents

- id: jphp-powershell-defender-exclusion-runner
  for:
  - pe
  desc: JPHP decode/launch references with exclusion
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/decode/base64::base64-decoding
  - id: micro-behaviors/fs/write/file/full::jphp-file-put-contents
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-process-class
  - id: metadata/lang/source/naming/interface::startandwait-method-name-reference
  - id: micro-behaviors/os/security/defender::jphp-powershell-defender-exclusion
