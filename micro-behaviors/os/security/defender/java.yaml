defaults:
  platforms: [windows]
  for: [class, java_class]

traits:
  - id: jvm-defender-exclusion-method
    desc: JVM implements Defender exclusion method
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: addDefenderExclusion

  - id: jvm-defender-exclusion-state-check
    desc: JVM checks Defender exclusion state
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: isDefenderExclusionProtected
