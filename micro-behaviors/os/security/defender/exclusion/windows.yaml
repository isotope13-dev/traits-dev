defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, data, pe, javascript, python]
  crit: notable
  conf: 0.96

traits:
  - id: defender-exclusion-preference-query
    desc: Defender exclusion preference query
    if:
      type: text
      regex: '\bGet-MpPreference\b[\s\S]{0,80}\.ExclusionPath\b'
      case_insensitive: true

  - id: defender-exclusion-path-parameter
    desc: Defender exclusion path parameter
    crit: notable
    conf: 0.92
    for: [powershell, batch, vbs, data, pe, javascript, python, go]
    if:
      type: text
      substr: -ExclusionPath
      case_insensitive: true

  - id: defender-exclusion-option-text
    desc: Defender exclusion option reference
    crit: notable
    conf: 0.95
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)\s+-(ExclusionPath|ExclusionProcess|ExclusionExtension)\b'

  # Text extraction retains visibility into batch files prefixed with a false
  # UTF-16 BOM: the byte-swapped representation is exposed as Han text while
  # the ordinary command remains available in correctly decoded batch files.
  - id: batch-defender-exclusion-command-text
    desc: Batch adds a Microsoft Defender exclusion
    crit: notable
    conf: 0.99
    for: [batch]
    if:
      type: text
      regex: '(?i)Add-MpPreference\s+-Exclusion(Path|Process|Extension)\b'

  - id: defender-exclusion-process-parameter
    desc: Defender exclusion process parameter
    crit: notable
    conf: 0.96
    for: [batch, powershell, csharp, java, pe, dll, python]
    if:
      type: text
      substr: -ExclusionProcess
      case_insensitive: true

  - id: defender-path-exclusion-registry-key
    desc: Defender path-exclusion registry key
    crit: notable
    conf: 0.99
    # Substring rather than exact: script command lines prefix the key with
    # HKLM\ or HKLM\\ and may double the separators when quoted, while PE
    # string tables carry it verbatim.
    #
    # Anchored on the trailing `Windows Defender\Exclusions\Paths` rather than a
    # `SOFTWARE\Microsoft\` prefix: the machine-policy spelling
    # (`SOFTWARE\Policies\Microsoft\Windows Defender\Exclusions\Paths`) writes the
    # same exclusion store and is the same finding, but the old prefix anchor
    # skipped it.
    for: [pe, dll, csharp, batch, powershell, vbs, javascript]
    if:
      type: text
      regex: '(?i)Windows Defender\\+Exclusions\\+Paths'

  - id: defender-process-exclusion-registry-key
    desc: Defender process-exclusion registry key
    crit: notable
    conf: 0.99
    for: [pe, dll, csharp]
    if:
      type: text
      exact: 'SOFTWARE\Microsoft\Windows Defender\Exclusions\Processes'

  - id: defender-exclusion-extension-parameter
    desc: Defender exclusion extension parameter
    crit: notable
    conf: 0.96
    for: [batch, powershell]
    if:
      type: text
      substr: -ExclusionExtension
      case_insensitive: true

  - id: batch-defender-exclusion-false-bom
    desc: False-BOM batch has Defender exclusion
    crit: notable
    conf: 0.99
    for: [batch]
    if:
      # UTF-16LE interpretation of the raw ASCII bytes spanning
      # "Add-MpPreference -Exclusion" on an odd byte boundary.
      type: text
      substr: '摁ⵤ灍牐晥牥湥散ⴠ硅汣獵潩'

  - id: batch-defender-extension-exclusion-false-bom
    desc: False-BOM batch has extension exclusion
    crit: notable
    conf: 0.99
    for: [batch]
    if:
      type: text
      substr: '䕮瑸湥楳湯'

composite_rules:
  - id: defender-exclusion-command
    desc: Defender exclusion mutation command text
    crit: notable
    conf: 0.96
    for: [powershell, batch, vbs, data, pe, javascript, python, go]
    near_bytes: 384
    all:
      - id: defender-exclusion-path-parameter
    any:
      # Embedded native command strings are seen as literals; direct
      # PowerShell cmdlets are exposed through their option-bearing text.
      - id: micro-behaviors/os/security/defender/policy::defender-preference-mutation-cmdlet
      - id: micro-behaviors/os/security/defender/policy::defender-preference-option-prefix
    needs: 1

  - id: batch-broad-defender-exclusions
    desc: Batch adds multiple broad Defender exclusions
    crit: notable
    conf: 0.99
    for: [batch]
    near_bytes: 1200
    all:
      - id: batch-defender-exclusion-command-text
      - id: defender-exclusion-path-parameter
      - id: defender-exclusion-process-parameter
      - id: defender-exclusion-extension-parameter
