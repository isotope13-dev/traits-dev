defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
traits:
  - id: native-exclusion-shield-export
    desc: Exports exclusion shielding entry point
    if:
      type: export
      exact: ExclShieldBeginW
  - id: native-process-exclusion-export
    desc: Exports process exclusion entry point
    if:
      type: export
      exact: ExclAddProcessW
