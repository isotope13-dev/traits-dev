defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.96
traits:
  - id: native-add-mppreference-reference
    desc: Native Add-MpPreference cmdlet-name reference
    if:
      type: text
      substr: Add-MpPreference
      section: .rdata

  # Text extraction stops at 200000 strings, and large Go binaries place
  # their .rdata string table past that cap. The raw byte search reads the
  # same .rdata literal, so the exclusion parameter stays visible there.
  - id: native-exclusion-path-parameter-raw
    desc: Native Defender -ExclusionPath parameter
    size_min: 8000000
    if:
      type: raw
      substr: '-ExclusionPath'
      section: .rdata
