# An option naming TEMP/TMP is configuration evidence, not proof of a
# mutation or an evasion objective. Preserve the original matching scope.
defaults:
  platforms: [windows]
  for: [scripts, binaries, source]

traits:
  - id: defender-exclusion-temp-environment
    desc: Defender exclusion names Windows temp
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '-ExclusionPath[^\r\n]{0,240}(\$env:TE?MP\b|%TE?MP%|\\+Windows\\+Temp)([\s"''\\;,)]|$)'
      case_insensitive: true

  - id: defender-exclusion-appdata-environment
    desc: Defender exclusion names AppData
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '-ExclusionPath[\s\S]{0,240}(\$env:(LOCAL)?APPDATA\b|%(LOCAL)?APPDATA%)([\s";,)]|$)'
      case_insensitive: true
