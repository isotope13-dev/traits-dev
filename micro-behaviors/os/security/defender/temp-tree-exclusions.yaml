defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: temp-directory-path-exclusion
  desc: Defender mutation excludes TEMP directory
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)Add-MpPreference[ \t]+-ExclusionPath[ \t]+'%temp%\\';
- id: temp-process-wildcard-exclusion
  desc: Defender TEMP process-wildcard exclusion
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)Add-MpPreference[ \t]+-ExclusionProcess[ \t]+'%temp%\\\*';
composite_rules:
- id: temp-directory-and-process-exclusions
  desc: Defender mutations exclude the TEMP directory and process wildcard
  crit: suspicious
  conf: 0.99
  all:
  - id: temp-directory-path-exclusion
  - id: temp-process-wildcard-exclusion
