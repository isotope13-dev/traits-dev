# Scheduled-scan resource policy is distinct from disabling protection or
# adding exclusions. A literal positive percentage does not establish evasion.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: defender-scan-cpu-load-command-text
    desc: Command text sets Defender scan CPU limit
    if:
      type: text
      regex: '(?i)\bSet-MpPreference\s+-ScanAvgCPULoadFactor\s+([1-9][0-9]?|100)(\s|$)'
