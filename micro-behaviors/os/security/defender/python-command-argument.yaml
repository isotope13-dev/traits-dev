defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-interpreter-exclusion-argument
    desc: PowerShell command excludes Python from Defender
    crit: notable
    conf: 0.99
    size_max: 32768
    if:
      type: tree-sitter
      # Bind the exclusion to the source handed to PowerShell. An echo
      # argument beside an unrelated PowerShell launch must not match.
      query: |
        ((call function: (attribute
          object: (identifier) @module attribute: (identifier) @method)
          arguments: (argument_list
            (list . (string (string_content) @exe)
              (_)* (string (string_content) @option) . (_) @source)))
          (#eq? @module "subprocess")
          (#match? @method "^(run|call|Popen|check_call)$")
          (#match? @exe "(?i)^(powershell|pwsh)(\\.exe)?$")
          (#match? @option "(?i)^-command$")
          (#match? @source "(?i)Add-MpPreference\\s+-ExclusionProcess\\s+[\"']?pythonw?\\.exe"))
