# GPO field references, scheduled-task operations, and a share path indicate
# a possible deployment. They do not identify the task as destructive or bind
# the deletion command to that task.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1484.001

traits:
  - id: gpo-guid-machine-version-field-text
    desc: GPO GUID and machine-version field references
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bGPOGuid\b[\s\S]{0,260}\bMachineVersionNumber\b'

composite_rules:
  - id: gpo-system-task-share-cleanup-clues
    desc: GPO backup and SYSTEM task with share clues
    crit: suspicious
    conf: 0.998
    all:
      - id: micro-behaviors/os/security/gpo::backup-gpo-cmdlet
      - id: micro-behaviors/os/security/gpo::gpo-guid-machine-version-field-text
      - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction
      - id: micro-behaviors/os/autorun/task-principal::new-scheduledtask-principal-authority-system
      - id: micro-behaviors/os/autorun/task-principal::schtask-runlevel-highest
      - id: micro-behaviors/fs/path/network::unc-executable-or-script
      - id: micro-behaviors/os/autorun/control::schtasks-delete-force
