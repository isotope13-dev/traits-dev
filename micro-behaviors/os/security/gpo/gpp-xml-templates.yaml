defaults:
  platforms: [windows]
  for: [xml, text, scripts]
  attack: T1484.001

traits:
  - id: gpp-registry-settings-clsid
    desc: GPP RegistrySettings XML schema CLSID
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '{A3CCFC41-DFDB-43a5-8D26-0FE8B954DA51}'
      case_insensitive: true

  - id: gpp-files-settings-clsid
    desc: GPP Files XML schema CLSID
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '{215B2E53-57CE-475c-80FE-9EEC14635851}'
      case_insensitive: true

  - id: gpp-sysvol-from-path
    desc: GPP file deployment from SYSVOL share
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfromPath=["'']\\\\[^"''\\\r\n]{1,60}\\sysvol\\'

  - id: gpp-readonly-attribute-enabled
    desc: GPP file deployment sets read-only attribute
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\breadOnly=["'']1["'']'

  - id: gpp-registry-enable-firewall-zero
    desc: GPP Registry XML disables Windows Firewall
    crit: suspicious
    conf: 0.96
    attack: T1562.004
    if:
      type: text
      regex: '(?i)\bname=["'']EnableFirewall["''][^\r\n]{0,48}\bvalue=["'']0+["'']'

composite_rules:
  - id: gpp-sysvol-readonly-root-file-drop
    desc: GPP deploys read-only SYSVOL file to drive root
    crit: suspicious
    conf: 0.97
    all:
      - id: gpp-files-settings-clsid
      - id: gpp-sysvol-from-path
      - id: gpp-readonly-attribute-enabled
      - id: micro-behaviors/os/security/gpo::gpp-drive-root-target-path
