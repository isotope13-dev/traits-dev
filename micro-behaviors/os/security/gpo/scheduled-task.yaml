defaults:
  crit: notable
  platforms: [windows]
  for: [powershell, batch, scripts, pe, dll, go, c]

traits:
  - id: sysvol-scheduledtasks-path
    desc: References GPP ScheduledTasks data in SYSVOL
    conf: 0.9
    if:
      type: text
      regex: '(?i)SYSVOL.{0,120}Policies.{0,120}ScheduledTasks'

  - id: immediate-task-v2-clsid
    desc: References the GPP ImmediateTaskV2 CLSID
    conf: 0.92
    if:
      type: text
      word: 9756B581-76EC-4169-9AFC-0CA8D43ADB5F

  - id: task-v2-clsid
    desc: References the GPP TaskV2 CLSID
    conf: 0.92
    if:
      type: text
      word: D8896631-B747-47a7-84A6-C155337F3BC8

  - id: scheduledtasks-clsid
    desc: References the GPP ScheduledTasks CLSID
    conf: 0.86
    if:
      type: text
      word: CC63F200-7309-4ba0-B154-A71CD118DBCC
