# PowerShell execution policy configured through the registry write chain:
# the ShellIds policy path plus open/create and value-write API references.
# These references are partial evidence; they do not bind the write to the path.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

composite_rules:
  - id: powershell-executionpolicy-write-chain
    desc: Execution policy registry path with write API
    all:
      - id: micro-behaviors/os/registry/policy/reference::powershell-executionpolicy-registry-path
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
