# An application's own Add/Remove Programs entry stores the command that runs
# its uninstall script. Windows runs that string only when the user uninstalls,
# so a hidden window and a policy bypass in it describe the product's remover,
# not a concealed runtime launch.
defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
  crit: notable
  conf: 0.9

traits:
  - id: uninstall-string-value-write
    desc: Writes the UninstallString registry value
    if:
      type: text
      regex: '(?i)(SetValue\(\s*[''"]|/v\s+)(Quiet)?UninstallString\b'

composite_rules:
  - id: policy-bypass-in-uninstall-entry
    desc: Policy-bypass command stored as uninstall entry
    near_bytes: 700
    all:
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
      - id: uninstall-string-value-write
