# The array operands, not a bare Bypass word, establish the option/value pair.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  - id: go-executionpolicy-bypass-argument-pair
    desc: Go ExecutionPolicy/Bypass argument array pair
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule go_executionpolicy_bypass_argument_pair {
          strings:
            $policy = { 48 C7 84 24 [4] 10 00 00 00 48 8D 0D [4] 48 89 8C 24 ?? ?? ?? ?? }
            $value = { 48 C7 84 24 [4] 06 00 00 00 48 8D 0D [4] 48 89 8C 24 ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_AMD64 and
            for any s in (0..pe.number_of_sections - 1) : (
              pe.sections[s].name == ".text" and
              for any i in (1..#policy) : (
                @policy[i] >= pe.sections[s].raw_data_offset and
                @policy[i] < pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                (uint32(pe.rva_to_offset(pe.sections[s].virtual_address + @policy[i] - pe.sections[s].raw_data_offset + 19 + int32(@policy[i] + 15)) + 0) == 0x6578452d and uint32((pe.rva_to_offset(pe.sections[s].virtual_address + @policy[i] - pe.sections[s].raw_data_offset + 19 + int32(@policy[i] + 15)) + 0) + 4) == 0x69747563) and
                        (uint32(pe.rva_to_offset(pe.sections[s].virtual_address + @policy[i] - pe.sections[s].raw_data_offset + 19 + int32(@policy[i] + 15)) + 8) == 0x6f506e6f and uint32((pe.rva_to_offset(pe.sections[s].virtual_address + @policy[i] - pe.sections[s].raw_data_offset + 19 + int32(@policy[i] + 15)) + 8) + 4) == 0x7963696c) and
                for any j in (1..#value) : (
                  @value[j] > @policy[i] and @value[j] - @policy[i] < 64 and
                  int32(@value[j] + 4) == int32(@policy[i] + 4) + 16 and
                  uint32(pe.rva_to_offset(pe.sections[s].virtual_address + @value[j] - pe.sections[s].raw_data_offset + 19 + int32(@value[j] + 15)) + 0) == 0x61707942 and
                        uint16(pe.rva_to_offset(pe.sections[s].virtual_address + @value[j] - pe.sections[s].raw_data_offset + 19 + int32(@value[j] + 15)) + 4) == 0x7373
                )
              )
            )
        }
