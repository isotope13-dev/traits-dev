defaults:
  platforms: [windows]
  for: [oledoc, msi]
  attack: "T1204.002"
  conf: 0.92
traits:
  - id: msi-powershell-executionpolicy-bypass
    desc: MSI custom action bypasses PowerShell policy
    crit: notable
    conf: 0.97
    attack: T1059.001
    if:
      type: raw
      regex: '(?i)powershell\.exe.{0,80}-(ExecutionPolicy|EP|Exec)\s+Bypass'
