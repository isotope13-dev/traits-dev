defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: set-entries-in-acl
    desc: Builds Windows ACL entries
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: symbol
      regex: '^SetEntriesInAcl[AW]?$'

  - id: world-sid-authority
    desc: Uses the Windows Everyone SID authority
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      word: SECURITY_WORLD_SID_AUTHORITY

  - id: generic-all-access-mask
    desc: Requests Windows GENERIC_ALL access
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      word: GENERIC_ALL

  - id: add-ace
    desc: Add ACE to ACL
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "AddAce"
  - id: get-acl-information
    desc: Query ACL information
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      exact: "GetAclInformation"
  - id: initialize-security-descriptor
    desc: Initialize security descriptor
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: "InitializeSecurityDescriptor"
  - id: initialize-acl
    desc: Initialize ACL structure
    crit: baseline
    conf: 0.88
    if:
      type: symbol
      exact: "InitializeAcl"
  - id: make-absolute-sd
    desc: Flatten self-relative descriptor
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "MakeAbsoluteSD"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: get-security-info
    desc: Query object security descriptor import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: GetSecurityInfo
  - id: are-all-accesses-granted
    desc: AreAllAccessesGranted ACL check import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: AreAllAccessesGranted
  - id: set-user-object-security
    desc: User-object security descriptor import
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: SetUserObjectSecurity
  - id: set-named-security-info
    desc: Apply security info to named object
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "SetNamedSecurityInfoW"
  - id: set-file-security
    desc: Apply file security descriptor
    crit: notable
    conf: 0.88
    if:
      type: symbol
      exact: "SetFileSecurityW"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: set-security-descriptor-dacl
    desc: Set security descriptor DACL
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "SetSecurityDescriptorDacl"
  - id: powershell-sc-read-service-descriptor
    desc: Reads service security descriptor with sc.exe
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bsc\.exe\s+sdshow\b'
  - id: powershell-sc-write-service-descriptor
    desc: Sets service security descriptor with sc.exe
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bsc\.exe\s+sdset\b'
  - id: powershell-wmi-read-security-descriptor
    desc: Reads WMI namespace security descriptor
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?is)\bInvoke-WmiMethod\b.{0,240}\bGetSecurityDescriptor\b'
  - id: powershell-wmi-write-security-descriptor
    desc: Sets WMI namespace security descriptor
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?is)\bInvoke-WmiMethod\b.{0,240}\bSetSecurityDescriptor\b'
  - id: dotnet-security-identifier
    desc: Uses .NET Windows security identifiers
    crit: notable
    conf: 0.92
    for: [powershell, csharp]
    if:
      type: text
      word: SecurityIdentifier
composite_rules:
  - id: world-writable-acl-setup
    desc: Builds an Everyone full-control ACL
    crit: notable
    conf: 0.96
    for: [pe, dll, c, cpp, csharp, go, rust]
    all:
      - id: set-entries-in-acl
      - id: world-sid-authority
      - id: generic-all-access-mask

  - id: security-descriptor-acl-setup
    desc: Constructs a security descriptor and ACL
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
    all:
      - id: initialize-security-descriptor
    any:
      - id: set-security-descriptor-dacl
      - id: initialize-acl
      - id: make-absolute-sd
    needs: 2

  - id: acl-rewrite-cluster
    desc: Applies ACL changes to a named or file object
    crit: notable
    conf: 0.94
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
    all:
      - id: initialize-security-descriptor
    any:
      - id: set-named-security-info
      - id: set-file-security
      - id: add-ace
      - id: get-acl-information
      - id: make-absolute-sd
    needs: 2
