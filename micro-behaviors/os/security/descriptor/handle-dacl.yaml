defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, zig, python]
  crit: notable
  conf: 0.98

traits:
  - id: set-handle-dacl
    desc: Sets a handle DACL
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetSecurityInfo$'
      arg:
        kind: identifier
        name: DACL_SECURITY_INFORMATION
