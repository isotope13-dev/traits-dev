# Resolution of an encoded API name is evidence of the reference, not proof
# that the program invokes it or changes any object's permissions.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: encoded-set-entries-in-acl
    desc: Encoded Windows ACL construction API reference
    if:
      type: encoded
      regex: '^SetEntriesInAcl[AW]$'
  - id: encoded-set-named-security-info
    desc: Encoded named-object security API reference
    if:
      type: encoded
      regex: '^SetNamedSecurityInfo[AW]$'
  - id: encoded-build-explicit-access
    desc: Encoded explicit ACL entry API reference
    if:
      type: encoded
      regex: '^BuildExplicitAccessWithName[AW]$'
  - id: encoded-convert-string-security-descriptor
    desc: Encoded SDDL conversion API reference
    if:
      type: encoded
      regex: '^ConvertStringSecurityDescriptorToSecurityDescriptor[AW]$'
