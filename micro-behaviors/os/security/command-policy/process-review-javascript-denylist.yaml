defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: js-blocked-command-pattern-array
    desc: Array of blocked command patterns
    if:
      type: text
      regex: '(?i)(const|let|var)\s+\w*(MALICIOUS|DENIED|BLOCKED|DANGEROUS)\w*\s*=\s*\['

  - id: js-command-policy-deny-verdict
    desc: Emits blocked or denied command verdict
    if:
      type: text
      regex: '(?i)(return\s*\{.{0,40}(safe|allowed):\s*false|\bactionTaken:\s*["\x27]BLOCKED)'

composite_rules:
  - id: javascript-command-denylist-gate
    desc: JavaScript command policy gate rejecting dangerous patterns
    crit: exception
    all:
      - id: micro-behaviors/os/security/command-policy::js-blocked-command-pattern-array
      - id: micro-behaviors/os/security/command-policy::js-command-policy-deny-verdict
