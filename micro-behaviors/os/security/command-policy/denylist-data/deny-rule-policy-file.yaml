defaults:
  platforms: [unix, windows]
  for: [yaml, json]

# A permission-gateway policy file: rules match a tool's shell command argument
# and deny it. Its literal destructive commands are test vectors and deny patterns,
# not commands that run. Both legs are needed so an ordinary config key does not
# suppress root-wipe findings.
traits:
  - id: approval-deny-command-pattern
    desc: Policy assigns deny to a command pattern
    crit: notable
    conf: 0.94
    unless:
      - id: denied-root-wipe-policy-entry
    if:
      type: value
      path: bash.patterns[*].approval
      exact: deny

  - id: approval-denied-root-wipe-pattern
    desc: Policy lists a root-wipe command pattern
    crit: notable
    conf: 0.94
    unless:
      - id: denied-root-wipe-policy-entry
    if:
      type: value
      path: bash.patterns[*].match
      exact: rm -rf /*

  - id: policy-rule-decision-deny-line
    desc: Policy rule sets decision to deny
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*decision:\s*["'']?(deny|block|reject)["'']?\s*$'

  - id: policy-rule-command-match-arg
    desc: Policy rule matches the shell command argument
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*args\.command:\s*$'

composite_rules:
  - id: denied-root-wipe-policy-entry
    desc: Command policy denies a root-wipe pattern
    crit: exception
    conf: 0.94
    all:
      - id: approval-deny-command-pattern
      - id: approval-denied-root-wipe-pattern

  - id: deny-rule-policy-file
    desc: Permission policy file denies shell command patterns
    crit: exception
    conf: 0.9
    all:
      - id: policy-rule-decision-deny-line
      - id: policy-rule-command-match-arg
