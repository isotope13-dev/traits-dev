defaults:
  platforms: [unix, windows]

traits:
  - id: javascript-single-root-wipe-reference
    desc: One root wipe command reference
    for: [javascript, typescript]
    crit: notable
    count_min: 1
    count_max: 1
    if:
      type: text
      regex: 'rm\s+-rf\s+/\*?'
  - id: javascript-root-wipe-deny-array
    desc: Deny array contains root wipe
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: 'deny\s*:\s*\[[^\]\n]{0,160}rm\s+-rf\s+/\*?'
  - id: javascript-root-wipe-array-assertion
    desc: Assertion checks root wipe list entry
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: 'expect\.arrayContaining\(\[[^\]\n]{0,160}rm\s+-rf\s+/\*?'
  # A deny or keyword array literal whose entries include a root wipe string.
  # The array may span lines; the wipe string is the list entry, not a command.
  - id: javascript-root-wipe-list-declaration
    desc: Keyword or deny list holds root wipe
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: '(?i)(deny|keyword|blocklist|blacklist)[\w.''"]*\s*[:=]\s*\[[^\]]{0,160}rm\s+-rf\s+/'
  - id: yaml-root-wipe-deny-marker
    desc: YAML policy denies an action
    for: [yaml]
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'approval:\s*deny'
  - id: yaml-root-wipe-command-reference
    desc: YAML policy references a root wipe command
    for: [yaml]
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '^.{0,80}rm\s[\w -]*-\w*[rR][\w -]*\s/(\*([\s;&|)"'']|$)|\s+--no-preserve-root|[;&|]|\s*$)'

composite_rules:
  # OMP-style YAML policy rows name commands the host must block. Require the
  # deny action within two lines of the root-wipe pattern in the same entry.
  - id: yaml-root-wipe-deny-policy
    desc: YAML policy denies the root wipe command
    for: [yaml]
    crit: notable
    conf: 0.98
    near_lines: 2
    all:
      - id: yaml-root-wipe-command-reference
      - id: yaml-root-wipe-deny-marker
  - id: javascript-root-wipe-deny-policy
    desc: Sole root wipe reference is in a deny array
    for: [javascript, typescript]
    crit: exception
    all:
      - id: javascript-single-root-wipe-reference
      - id: javascript-root-wipe-deny-array
  - id: javascript-root-wipe-policy-test
    desc: Bun test checks a root wipe policy entry
    for: [javascript, typescript]
    crit: exception
    all:
      - id: javascript-single-root-wipe-reference
      - id: javascript-root-wipe-array-assertion
      - id: metadata/package/testing/harness/runtime::bun-assertion-test-file
  # A deny, block, or keyword list (a settings default or a moderation table)
  # with a root-wipe string inside it. The list is data the program checks
  # input against; the wipe string is the thing it blocks, not a command run.
  - id: javascript-root-wipe-list-context
    desc: Root-wipe string sits in a deny or keyword list
    for: [javascript, typescript]
    crit: exception
    near_lines: 12
    all:
      - id: javascript-root-wipe-list-declaration
      - id: micro-behaviors/fs/delete/directory::root-deletion-command-reference
  - id: javascript-root-wipe-policy-context
    desc: JavaScript root-wipe entry in a deny array or its policy test
    for: [javascript, typescript]
    crit: exception
    any:
      - id: javascript-root-wipe-deny-policy
      - id: javascript-root-wipe-policy-test
      - id: javascript-root-wipe-list-context
  - id: root-wipe-safety-context
    desc: Script guards or blocks root deletion
    for: [scripts, binaries]
    crit: exception
    conf: 0.9
    any:
      - id: micro-behaviors/os/security/command-policy/gate::command-blocked-marker
      - id: micro-behaviors/os/security/command-policy/denylist-data::destructive-action-prohibition-text

  - id: destructive-action-prohibition-text
    desc: Deletion syntax near destructive action prohibition
    crit: notable
    conf: 0.88
    for: [scripts, -shell, -jcl]
    all:
      - id: metadata/file/line::destructive-action-prohibition-phrase
      - id: micro-behaviors/fs/delete/directory::rm-rf
    near_lines: 2
