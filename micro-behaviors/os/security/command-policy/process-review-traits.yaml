defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.88

traits:
  - id: shell-command-risk-classifier
    desc: Shell command safety risk classifier
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(classifyCommand|isHardDenied|looksLikeCredentialExfiltration)\b'

  - id: powershell-inline-flag-token-set
    desc: PowerShell inline flag token allowlist Set
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)POWERSHELL_INLINE_COMMAND_FLAGS|new Set\(\[[\s\S]{0,600}-encodedcommand'

  - id: command-filter-verdicts
    crit: notable
    desc: Shell command safety verdicts
    if:
      type: text
      regex: "VERDICT\\.(ALLOW|CONFIRM|BLOCK)"

  - id: shell-command-safety-gate
    crit: notable
    desc: Shell command safety gate
    if:
      type: text
      substr: assertSafe(command)

  - id: shell-command-approval-check
    crit: notable
    desc: Shell command approval check
    if:
      type: text
      substr: commandNeedsApproval

  - id: command-blocked-marker
    desc: Command blocked marker
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: COMMAND_BLOCKED

  - id: js-shell-threat-guard
    desc: JavaScript defensive shell threat check function
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(function\s+checkShellThreats\b|PIPE_TO_SHELL\b[\s\S]{0,120}REVERSE_SHELL\b)'

  - id: ai-cli-bash-tool-root-rm-pattern
    crit: notable
    desc: AI CLI root rm tool pattern
    platforms: [unix]
    for: [elf, macho]
    if:
      type: text
      regex: '(?i)\bBash\s*\(\s*rm\s+-(rf|fr)\s+/\*\s*\)'

  - id: ai-cli-bash-deny-rule-marker
    crit: notable
    desc: AI CLI Bash deny-rule implementation marker
    platforms: [unix]
    for: [elf, macho]
    if:
      type: text
      regex: '(?i)(projectBashDenyRules|bashDenied)'

  # A permission table serializes several tool-call wildcards together:
  # `NotebookEdit(*)SlashCommand(*)Bash(rm -rf /*)`. The `Bash(rm ...)` entry
  # is one row of that table, not a command the binary runs. Requiring a
  # second `Name(*)` wildcard next to the Bash entry keeps this general
  # across harness vendors instead of naming any one product's tools.
  # Raw bytes, not extracted strings: Go lays each pattern down as its own
  # string constant, so the run splitter never yields the pair together even
  # though the table is contiguous in .rodata.
  - id: ai-cli-tool-pattern-table
    crit: notable
    desc: AI CLI tool-pattern permission table
    platforms: [unix]
    for: [elf, macho]
    if:
      type: raw
      regex: '(?i)[A-Za-z][A-Za-z0-9]*\(\*\)[^()\n]{0,40}Bash\s*\(\s*rm\s+-(rf|fr)\s+/'

# Agent guardrails quote the command they refuse to run. Two orders, because
# the verdict word can lead ("NEVER run `rm -rf`") or follow ("`rm -rf /` is
# still DENIED by the catastrophic-standalone rule") -- MiniMax Code's prompt
# builder and its permission registry are one of each.
  - id: destructive-command-forbid-phrase
    desc: Prose forbids a destructive rm command
    crit: notable
    conf: 0.9
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)(never|do not|don.t|refuse|forbidden)[^\n]{0,60}rm\s+-rf'

  - id: destructive-command-ban-list
    desc: Destructive command listed as banned
    crit: notable
    conf: 0.9
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)(banned commands|dangerous command blocking|defaultBannedCommands)'

  - id: agent-guard-action-blocked
    desc: AI agent blocked action guardrail
    crit: notable
    conf: 0.95
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)(guard blocked refinement|blocked by guardrail|action must be blocked)'

  - id: agent-guard-command-safety
  # A generic blocked_reason field may describe runtime autostart, not commands.
    desc: Command safety guard references
    crit: notable
    conf: 0.95
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)(CommandSafetyGuardrail|check_command_safety|CommandSafetyResult)'

  - id: agent-tool-execution-command-policy
    desc: AI agent tool execution command safety policy
    crit: notable
    conf: 0.95
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)(ToolExecutionCommandRule|shell_command_rules|shellCommandRules)'

  - id: agent-dangerous-command-blocked-warning
    desc: AI agent blocked dangerous command warning
    crit: notable
    conf: 0.95
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)(Command appears to be a fork bomb|dangerous redirect to device file)'

  - id: agent-guard-llm-verdict-prompt
    desc: AI agent LLM security verdict prompt
    crit: notable
    conf: 0.95
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)shouldBlock["'':\s]+(true|false)'

  - id: destructive-command-denied-prose
    desc: Prose marks a destructive rm as denied
    crit: notable
    conf: 0.9
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)rm\s+-rf[^\n]{0,60}(denied|blocked|not allowed|rejected)'

  - id: agent-command-pattern-guard
    desc: Agent destructive command guard pattern
    crit: notable
    conf: 0.95
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)("match_pattern"\s*:\s*|[''"]rm\s+-rf[^\n]{0,30}[''"]\s+does not match)'

# A file that repeats `Bash(...)` is a Claude Code permission table. The
# text inside the parentheses is the command the harness refuses, not one
# this file runs. Eight entries is a shipped deny list, not a stray mention.
  - id: agent-bash-permission-deny-rule
    desc: Agent Bash permission deny rule
    crit: notable
    conf: 0.95
    for: [javascript, typescript, json]
    count_min: 8
    if:
      type: text
      regex: 'Bash\([^)\n]{0,80}\)'

# A quoted `bash(rm -rf /*)` token is a permission-table entry, the same
# guard as `Bash(...)` above, including the lowercase spelling a denylist uses.
  - id: quoted-bash-root-wipe-deny
    desc: Quoted bash deny of a root wipe
    crit: notable
    conf: 0.95
    for: [javascript, typescript, json]
    if:
      type: text
      regex: '(?i)["'']bash\(rm\s+-rf\s+/\*\)["'']'

# A runtime that queues tool calls for human approval instead of running
# them is the opposite of a wiper: the dangerous command is recorded and
# only executes after a decision. Two structural halves are required --
# the persisted approval queue that records tool name/input, and the
# deferred-execution payload that survives a restart.
  - id: agent-pending-approval-token
    desc: Pending approval queue token
    crit: notable
    conf: 0.9
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)\b(pending|awaiting)[_-]approvals?\b'

  - id: agent-deferred-tool-execution
    desc: Deferred tool execution stored for resume
    crit: notable
    conf: 0.9
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)deferred[_ -]?(tool_execution|payload)|restored pending approval'

  - id: agent-tool-permission-rules
    desc: Agent permission rules guard tool execution
    crit: notable
    conf: 0.95
    for: [pe, elf, macho, scripts, source]
    if:
      type: text
      regex: '(?i)denied by permission rules'

  - id: python-command-safety-rule-class
    desc: Python command safety rule class
    crit: baseline
    conf: 0.95
    for: [python]
    if:
      type: text
      substr: class CommandSafetyRule

  - id: python-whitelist-blocklist-shell-guard
    desc: Python shell allow/blocklist guard
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?s)def\s+_check_allowed\s*\([^)]{0,80}\).{0,900}self\._blocked.{0,350}self\._whitelist'

  - id: literal-secret-exec-gate
    desc: Literal secret gates Node exec call
    crit: notable
    conf: 0.93
    if:
      type: text
    # A hardcoded comparison literal near an exec() call: the knee of a
    # shared-secret remote-command gate (`k !== 'secret'` ... `exec(cmd)`).
    # The exec argument need not be wrapped in String().
    # Require a direct exec call; .exec() also denotes RegExp matching and
    # database query methods and does not establish Node process execution.
      regex: '[!]==?\s*[''"][\w-]{4,32}[''"][\s\S]{0,240}?[^\w$.]exec\s*\('
    not:
    # `typeof it != 'function'` (the core-js aFunction guard, bundled into
    # thousands of dist files) is a type check: typeof yields a fixed type
    # keyword, never a shared secret.
      - regex: '==?\s*[''"](function|object|string|number|boolean|undefined|symbol|bigint)[''"]'

  - id: command-blocklist-pattern-table
    desc: Command blocklist table with categories
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'pattern:\s*/[^\n]{1,80}/\w*,\s*category:\s*["'']'

composite_rules:
  - id: agent-pending-approval-tool-store
    desc: Agent queues tool calls for human approval
    crit: notable
    conf: 0.95
    for: [pe, elf, macho, scripts, source]
    all:
      - id: micro-behaviors/os/security/command-policy::agent-pending-approval-token
      - id: micro-behaviors/data/llm/tool-call::agent-tool-input-field-token
      - id: micro-behaviors/os/security/command-policy::agent-deferred-tool-execution
  - id: destructive-command-prohibited-prose
    desc: Prose forbids a destructive rm command
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/security/command-policy::destructive-command-forbid-phrase
      - id: micro-behaviors/os/security/command-policy::destructive-command-ban-list
      - id: micro-behaviors/os/security/command-policy::agent-guard-action-blocked
      - id: micro-behaviors/os/security/command-policy::agent-guard-llm-verdict-prompt
      - id: micro-behaviors/os/security/command-policy::agent-guard-command-safety
      - id: micro-behaviors/os/security/command-policy::agent-tool-execution-command-policy
      - id: micro-behaviors/os/security/command-policy::agent-dangerous-command-blocked-warning
      - id: micro-behaviors/os/security/command-policy::destructive-command-denied-prose
      - id: micro-behaviors/os/security/command-policy::agent-command-pattern-guard
  - id: ai-cli-destructive-command-deny-rules
    desc: AI CLI blocks destructive root rm commands
    crit: notable
    conf: 0.98
    platforms: [unix]
    for: [elf, macho]
    all:
      - id: micro-behaviors/os/security/command-policy::ai-cli-bash-tool-root-rm-pattern
    any:
      - id: micro-behaviors/os/security/command-policy::ai-cli-bash-deny-rule-marker
      - id: micro-behaviors/os/security/command-policy::ai-cli-tool-pattern-table

  - id: python-command-safety-blocklists
    desc: Python command safety blocklists
    crit: baseline
    conf: 0.95
    for: [python]
    any:
      - id: metadata/lang/source/naming/setting::python-command-safety-blocklists--blocked-patterns
      - id: metadata/lang/source/naming/setting::python-command-safety-blocklists--defaults-blocked
      - id: metadata/lang/source/naming/setting::python-command-safety-blocklists--require-confirmation
      - id: metadata/lang/source/naming/setting::python-command-safety-always-blocked
      - id: metadata/lang/source/naming/setting::python-command-safety-always-allowed
      - id: metadata/lang/source/naming/setting::python-command-safety-block-reasons
      - id: metadata/lang/source/naming/setting::python-command-safety-blocklists--deny-cmd
  - id: guarded-shell-command-tool
    desc: Guarded shell command tool
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/llm/tool-call::execute-command-tool-name
    any:
      - id: micro-behaviors/os/security/command-policy::shell-command-safety-gate
      - id: micro-behaviors/os/security/command-policy::shell-command-approval-check
      - id: "metadata/lang/source/syntax/key-value::js-shell-true-property"

  - id: destructive-command-safety-filter
    desc: Destructive command safety filter
    crit: component
    conf: 0.92
    all:
      - id: metadata/lang/source/naming/setting::blocked-or-destructive-list-identifier
    any:
      - id: micro-behaviors/os/security/command-policy::command-filter-verdicts
      - id: micro-behaviors/os/security/command-policy::shell-command-safety-gate

  - id: python-command-safety-filter
    desc: Python destructive command safety filter
    crit: component
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/os/security/command-policy::python-command-safety-rule-class
      - id: micro-behaviors/os/security/command-policy::python-command-safety-blocklists
