defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-regex-denylist-refusal
    desc: Rejects commands matching denylist regexes
    if:
      # Require the enforcement path, not a freely chosen safety label:
      # each denylist pattern is tested against the command, and a match
      # returns a result with allowed=False. Quoted disk-wipe examples in
      # such a policy are the commands it rejects, not actions it performs.
      type: tree-sitter
      query: |
        ((for_statement
          left: (identifier) @pattern
          right: (attribute attribute: (identifier) @denylist)
          body: (block
            (if_statement
              condition: (call
                function: (attribute
                  object: (identifier) @module
                  attribute: (identifier) @search)
                arguments: (argument_list
                  . (identifier) @tested_pattern
                  . (identifier) @command))
              consequence: (block
                . (return_statement
                  (call arguments: (argument_list
                    (keyword_argument
                      name: (identifier) @allowed
                      value: (false))))) .)))) @guard
        (#eq? @pattern @tested_pattern)
        (#match? @denylist "^(denylist|blocklist)$")
        (#eq? @module "re")
        (#eq? @search "search")
        (#eq? @allowed "allowed"))
