defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.97

traits:
  - id: packed-destructive-shell-command-table
    desc: Packed destructive shell command table
    # Linkers pack these distinct string constants without delimiters.
    if:
      type: text
      substr: 'rm -rf /*rm -rf ~/*rm -rf ..fdisk'

  # A risk classifier tests a command string for the destructive pattern and
  # returns a risk level; a wiper runs the command instead of comparing it.
  - id: destructive-command-string-classifier
    desc: Risk classifier tests destructive command string
    if:
      type: text
      regex: '\.includes\("rm -(rf|fr) /"\)'

  - id: bash-command-permission-check-symbol
    desc: Bash command permission check implementation
    if:
      type: symbol
      substr: check_bash_command_permission

  - id: command-guard-denial-message
    desc: Command guard denial message
    for: [elf]
    if:
      type: text
      substr: 'BLOCKED by dcg: the hook input'

  - id: command-guard-policy-description
    desc: Command guard policy description
    for: [elf]
    if:
      type: text
      substr: 'Destructive Command Guard - multi-agent safety hook'

composite_rules:
  - id: native-shell-permission-denylist
    desc: Native shell permission checker with destructive command denylist
    all:
      - id: bash-command-permission-check-symbol
      - id: packed-destructive-shell-command-table

  - id: native-command-guard-policy
    desc: Native command guard policy and denial messages
    for: [elf]
    all:
      - id: command-guard-denial-message
      - id: command-guard-policy-description
