defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9

traits:
  - id: shell-blocked-pattern-array
    desc: Shell array of blocked command patterns
    if:
      type: text
      regex: '(?m)^[ \t]*(BLOCKED|DENIED|DANGEROUS|FORBIDDEN)_[A-Z_]{0,12}=\('

  - id: shell-deny-verdict-emitted
    desc: Shell script emits a deny decision
    if:
      type: text
      regex: 'decision\\?":\s*\\?"deny\\?"'

  - id: typescript-agent-shell-preexecution-hook
    desc: TypeScript agent pre-execution shell hook
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)ctx\.shell\.hook\s*\(\s*["'']create\.before["'']'

composite_rules:
  - id: shell-command-denylist-gate
    desc: Shell hook gate denying listed commands
    crit: exception
    all:
      - id: micro-behaviors/os/security/command-policy::shell-blocked-pattern-array
      - id: micro-behaviors/os/security/command-policy::shell-deny-verdict-emitted
