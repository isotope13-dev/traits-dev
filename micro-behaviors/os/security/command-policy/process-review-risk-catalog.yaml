defaults:
  platforms: [unix, windows]
  # Raw matchers are capped at three explicit file types; native binaries are
  # where linkers lay the token/label pairs out flush.
  for: [elf, macho, pe]
  crit: notable
  conf: 0.9

traits:
  - id: risk-label-world-writable-chmod
    desc: chmod 777 beside world-writable label
    if:
      type: raw
      regex: '(?i)chmod\s+777.{0,12}world-writable chmod'

  - id: risk-label-device-write-via-dd
    desc: dd token beside raw-device-write label
    if:
      type: raw
      regex: '(?i)dd\s+if=.{0,12}raw device write via dd'

  - id: risk-label-direct-device-write
    desc: device redirect beside direct-write label
    if:
      type: raw
      regex: '(?i)>\s*/dev/(sd|hd|nvme|xvd).{0,12}direct device write'

composite_rules:
  - id: dangerous-command-risk-catalog
    desc: Labeled dangerous-command risk catalog
    # The guard-catalog reading needs the labels to agree on at least two
    # command classes; one labeled pair alone is documentation-grade.
    near_bytes: 256
    needs: 2
    any:
      - id: micro-behaviors/os/security/command-policy::risk-label-world-writable-chmod
      - id: micro-behaviors/os/security/command-policy::risk-label-device-write-via-dd
      - id: micro-behaviors/os/security/command-policy::risk-label-direct-device-write
