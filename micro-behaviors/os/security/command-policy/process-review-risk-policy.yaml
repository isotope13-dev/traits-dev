defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-command-risk-category-order
    desc: Orders shell command safety classifications
    if:
      type: text
      regex: 'SEVERITY\s*=\s*\("read_only", "other", "hidden", "irreversible", "catastrophic"\)'

  - id: python-managed-shell-deny-policy
    desc: Generates Bash command permission deny entries
    if:
      type: tree-sitter
      query: |
        ((pair key: (string) @permission
          value: (dictionary
            (pair key: (string) @deny
              value: (list_comprehension
                body: (string) @pattern)))) @policy
        (#eq? @permission "\"permissions\"")
        (#eq? @deny "\"deny\"")
        (#match? @pattern "^f\"Bash\\("))
  # A shell-security module's docstring labels the next example "blocked"
  # and then shows the decode pipeline. That line is the gate's illustration,
  # not a pipeline the module runs.
  - id: python-doc-blocked-decode-example
    desc: Docstring labels a decode pipeline blocked
    if:
      type: text
      regex: '(?i)\bblocked\n[^\n]{0,120}base64\s+-d\s*\|\s*(ba)?sh'

  # The denylist is a compiled pattern, not a command. Kept separate from
  # the decode call so a wide gap does not become one regex.
  - id: python-compiled-rm-denylist
    desc: Compiles a regular expression that matches rm
    if:
      type: text
      regex: 're\.compile\(r?["'']\\brm\\s'

  - id: python-risk-policy-level-pattern-array
    desc: Defines risk level pattern array
    crit: notable
    if:
      type: text
      regex: 'R[0-4]_PATTERNS\s*=\s*\['
  - id: python-bash-risk-classifier
    desc: Defines a Python Bash command risk classifier
    crit: notable
    if:
      type: text
      regex: 'def\s+classify_bash\s*\(\s*command'
composite_rules:
  - id: python-command-risk-classifier-context
    desc: Shell tokenizer with defensive risk categories
    crit: exception
    all:
      - id: micro-behaviors/os/security/command-policy::python-command-risk-category-order
      - id: micro-behaviors/data/parse/command::python-shlex-command-split
  - id: python-destructive-command-risk-filter
    desc: Classifies destructive shell command patterns by risk
    crit: exception
    all:
      - id: micro-behaviors/os/security/command-policy::python-risk-policy-level-pattern-array
      - id: micro-behaviors/os/security/command-policy::python-bash-risk-classifier
      - id: micro-behaviors/data/string/regex::python-risk-classifier-tests-patterns

