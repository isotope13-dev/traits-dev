defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

composite_rules:
  - id: python-rm-denylist-near-b64decode
    desc: RM denylist compiled near a Base64 decode
    crit: exception
    near_lines: 80
    all:
      - id: micro-behaviors/os/security/command-policy::python-compiled-rm-denylist
      - id: micro-behaviors/data/decode/base64::b64decode-call
  # Command spellings inside a numbered risk classifier are its match data,
  # not calls issued by the program. Use this only to exclude literal-command
  # findings from that classifier's source.
