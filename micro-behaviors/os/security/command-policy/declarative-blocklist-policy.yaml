# Declarative guardrail, content-filter, and command-blocklist policy files in
# YAML or JSON carry denied command strings and injection patterns as data to
# refuse, rather than commands to execute. Require a refusal disposition, a
# structured blocklist/denylist collection, and classification metadata, while
# excluding executable CI/CD, container, configuration-management, and package
# lifecycle manifests that could otherwise embed decoy policy keys.
defaults:
  platforms:
  - unix
  - windows
  for:
  - yaml
  - json
  crit: notable

traits:
- id: policy-block-disposition
  desc: Policy action field refuses matching input
  conf: 0.94
  if:
    type: text
    regex: '(?im)^\s*"?(default_)?action"?\s*:\s*["'']?(block|deny|reject)["'']?\s*,?\s*$'
  unless:
  - type: value
    path: jobs
    exists: true
  - type: value
    path: runs
    exists: true
  - type: value
    path: spec
    exists: true
  - type: value
    path: tasks
    exists: true
  - type: value
    path: root[*].hosts
    exists: true
  - type: value
    path: root[*].tasks[*]
    exists: true
  - type: value
    path: runcmd
    exists: true
  - type: value
    path: script
    exists: true
  - type: value
    path: scripts
    exists: true

- id: policy-block-keywords-field
  desc: Policy declares blocked keyword or word list
  conf: 0.94
  if:
    type: text
    regex: '(?m)^\s*"?(always_block_keywords|additional_block_words|blocked_words)"?\s*:'

- id: policy-denied-commands-field
  desc: Policy declares denied command or pattern list
  conf: 0.94
  if:
    type: text
    regex: '(?m)^\s*"?(blocked_commands|blocked_patterns|deny_patterns|denylist)"?\s*:'

- id: policy-entry-severity-level
  desc: Policy entries assign severity levels
  conf: 0.92
  if:
    type: text
    regex: '(?im)^\s*-?\s*"?severity"?\s*:\s*["'']?(critical|high|medium|low)["'']?'

- id: policy-context-exceptions-field
  desc: Policy declares allowed exception contexts
  conf: 0.92
  if:
    type: text
    regex: '(?m)^\s*"?(exceptions|allowlist|allowed_contexts)"?\s*:'

composite_rules:
- id: declarative-blocklist-entries
  desc: Declarative blocklist keyword or command table
  conf: 0.94
  any:
  - id: policy-block-keywords-field
  - id: policy-denied-commands-field

- id: declarative-guardrail-blocklist-policy
  desc: Declarative guardrail or command blocklist
  conf: 0.97
  all:
  - id: policy-block-disposition
  - id: declarative-blocklist-entries
  any:
  - id: policy-entry-severity-level
  - id: policy-context-exceptions-field
