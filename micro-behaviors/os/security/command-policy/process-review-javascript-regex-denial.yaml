defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: js-regex-denylist-pattern-loop
    desc: JS loops over pattern denylist
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'for\s*\(\s*(const|let|var)\s+\w+\s+of\s+[A-Za-z0-9_$]*(PATTERN|SIGNATURE|DENY|BLOCK)'

  - id: js-regex-test-call
    desc: JS tests regex pattern against target
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\b\w+\.(test|exec)\s*\([A-Za-z0-9_$]+\)'

  - id: js-denylist-refusal-verdict
    desc: JS returns refusal verdict on match
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(safe\s*:\s*false|allowed\s*:\s*false|actionTaken\s*:\s*[''"].{0,30}BLOCK)'

composite_rules:
  - id: javascript-regex-denylist-refusal
    desc: JS rejects input matching denylist regexes
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/command-policy::js-regex-denylist-pattern-loop
      - id: micro-behaviors/os/security/command-policy::js-regex-test-call
      - id: micro-behaviors/os/security/command-policy::js-denylist-refusal-verdict
    near_bytes: 800
