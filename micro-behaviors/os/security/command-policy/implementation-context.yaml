# Require an identified guard implementation or structured policy test.
# Bare dangerous commands, variable names and risk labels are insufficient.
defaults:
  for:
  - scripts
  - source
  - binaries
  platforms:
  - unix
  - windows
composite_rules:
- id: command-policy-implementation-context
  desc: Command guard implementation or policy tests
  crit: exception
  any:
  - id: micro-behaviors/os/security/command-policy::shell-command-denylist-gate
  - id: micro-behaviors/os/security/command-policy::python-regex-denylist-refusal
  - id: micro-behaviors/os/security/command-policy::python-whitelist-blocklist-shell-guard
  - id: metadata/package/testing/harness/unit::command-guard-pattern-fixtures
