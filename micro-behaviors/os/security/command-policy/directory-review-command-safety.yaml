defaults:
  platforms: [unix, windows]

composite_rules:
  - id: root-wipe-safety-context
    desc: Script guards or blocks root deletion
    for: [scripts, binaries]
    crit: exception
    conf: 0.9
    any:
      - id: micro-behaviors/os/security/command-policy::command-blocked-marker
      - id: micro-behaviors/os/security/command-policy::destructive-action-prohibition-text

  - id: destructive-action-prohibition-text
    desc: Deletion syntax near destructive action prohibition
    crit: notable
    conf: 0.88
    for: [scripts, -shell, -jcl]
    all:
      - id: metadata/file/line::destructive-action-prohibition-phrase
      - id: micro-behaviors/fs/delete/directory::rm-rf
    near_lines: 2
