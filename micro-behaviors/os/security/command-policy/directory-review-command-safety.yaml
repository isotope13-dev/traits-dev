defaults:
  platforms: [unix, windows]

traits:
  - id: javascript-single-root-wipe-reference
    desc: One root wipe command reference
    for: [javascript, typescript]
    crit: notable
    count_min: 1
    count_max: 1
    if:
      type: text
      regex: 'rm\s+-rf\s+/\*?'
  - id: javascript-root-wipe-deny-array
    desc: Deny array contains root wipe
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: 'deny\s*:\s*\[[^\]\n]{0,160}rm\s+-rf\s+/\*?'
  - id: javascript-root-wipe-array-assertion
    desc: Assertion checks root wipe list entry
    for: [javascript, typescript]
    crit: notable
    if:
      type: text
      regex: 'expect\.arrayContaining\(\[[^\]\n]{0,160}rm\s+-rf\s+/\*?'

composite_rules:
  - id: javascript-root-wipe-deny-policy
    desc: Sole root wipe reference is in a deny array
    for: [javascript, typescript]
    crit: exception
    all:
      - id: javascript-single-root-wipe-reference
      - id: javascript-root-wipe-deny-array
  - id: javascript-root-wipe-policy-test
    desc: Bun test checks a root wipe policy entry
    for: [javascript, typescript]
    crit: exception
    all:
      - id: javascript-single-root-wipe-reference
      - id: javascript-root-wipe-array-assertion
      - id: metadata/package/testing/harness/runtime::bun-assertion-test-file
  - id: javascript-root-wipe-policy-context
    desc: JavaScript root-wipe entry in a deny array or its policy test
    for: [javascript, typescript]
    crit: exception
    any:
      - id: javascript-root-wipe-deny-policy
      - id: javascript-root-wipe-policy-test
  - id: root-wipe-safety-context
    desc: Script guards or blocks root deletion
    for: [scripts, binaries]
    crit: exception
    conf: 0.9
    any:
      - id: micro-behaviors/os/security/command-policy::command-blocked-marker
      - id: micro-behaviors/os/security/command-policy::destructive-action-prohibition-text

  - id: destructive-action-prohibition-text
    desc: Deletion syntax near destructive action prohibition
    crit: notable
    conf: 0.88
    for: [scripts, -shell, -jcl]
    all:
      - id: metadata/file/line::destructive-action-prohibition-phrase
      - id: micro-behaviors/fs/delete/directory::rm-rf
    near_lines: 2
