defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.9

traits:
  - id: packed-root-glob-beside-windows-del
    desc: Root-glob wipe packed against Windows del
    # String extraction splits adjacent literals, so the packed `/*del` join
    # is only visible in the file bytes.
    for: [elf, macho, pe]
    if:
      type: raw
      regex: 'rm -rf /\*del /f /[qs]'

composite_rules:
  - id: dangerous-command-refusal-list
    desc: Packed list of destructive commands to refuse
    near_bytes: 400
    all:
      - id: micro-behaviors/fs/chown::refusal-entry-recursive-chown-root
      - id: micro-behaviors/hardware/block/write::refusal-entry-dd-zero-to-device
      - id: micro-behaviors/fs/chmod/modify::refusal-entry-recursive-chmod-root
