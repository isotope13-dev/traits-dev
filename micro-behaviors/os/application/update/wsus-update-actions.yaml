defaults:
  platforms: [windows]
  for: [text, source, scripts, powershell, python, batch, shell, csharp, javascript, typescript, go, rust]

traits:
  - id: wsus-update-import-procedure
    desc: WSUS update import procedure reference
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: spImportUpdate
      case_insensitive: true

  - id: wsus-xml-fragment-save-procedure
    desc: WSUS XML fragment save procedure reference
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: spSaveXmlFragment
      case_insensitive: true

  - id: wsus-commandline-handler-marker
    desc: WSUS command-line installation handler
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: CommandLineInstallation
      case_insensitive: true

  - id: wsus-install-command-program
    desc: WSUS install command names a program
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)<(cmd:)?InstallCommand.{0,160}Program\s*='

  - id: wsus-batch-url-procedure
    desc: WSUS batch URL procedure
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: spSetBatchURL
      case_insensitive: true

  - id: wsus-muurl-http-value
    desc: WSUS update download URL
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bMUURL\s*=\s*["'']https?://.{1,180}["'']'

  - id: wsus-target-group-create-procedure
    desc: WSUS target-group creation procedure reference
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: spCreateTargetGroup
      case_insensitive: true

  - id: wsus-computer-target-lookup
    desc: WSUS computer-target lookup procedure reference
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: spGetComputerTargetByName
      case_insensitive: true

  - id: wsus-computer-target-add-procedure
    desc: WSUS target-group member-add procedure reference
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: spAddComputerToTargetGroup
      case_insensitive: true

  - id: wsus-update-deploy-procedure
    desc: WSUS update deployment procedure reference
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: spDeployUpdate
      case_insensitive: true

composite_rules:
  - id: wsus-commandline-update-xml
    desc: WSUS XML command installation handler
    crit: suspicious
    conf: 0.99
    near_lines: 2
    all:
      - id: micro-behaviors/os/application/update::wsus-commandline-handler-marker
      - id: micro-behaviors/os/application/update::wsus-install-command-program
  - id: wsus-update-batch-url
    desc: WSUS batch URL procedure and URL references
    crit: suspicious
    conf: 0.99
    near_lines: 4
    all:
      - id: micro-behaviors/os/application/update::wsus-batch-url-procedure
      - id: micro-behaviors/os/application/update::wsus-muurl-http-value
