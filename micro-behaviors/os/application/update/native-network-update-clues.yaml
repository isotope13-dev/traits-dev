defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: native-network-update-clues
    desc: Network update and replacement command clues
    crit: suspicious
    conf: 0.97
    for: [pe, dll]
    all:
      - id: micro-behaviors/communications/url/path::update-version-download-path
      - id: micro-behaviors/fs/file/move::batch-move-y-byte-text
      - id: micro-behaviors/fs/delete/file/self::batch-delete-self-command-text
      - id: micro-behaviors/communications/url/scheme::wss-scheme
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
      - id: micro-behaviors/fs/file/move::move-file-ex
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
    unless:
      - id: metadata/installer/product/
