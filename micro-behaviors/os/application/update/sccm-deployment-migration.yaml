defaults:
  platforms: [windows, unix]
  for: [source, scripts, binaries, -swift, -objectivec, -groovy, -scala, -elixir]
  attack: T1072

traits:
  - id: sccm-application-object-write
    desc: SCCM application object creation clues
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bSMS_Application\b.{0,400}\b(SDMPackageXML|CreateInstance)\b'

  - id: sccm-script-deployment-technology
    desc: Selects SCCM script deployment technology
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: <DeploymentTechnology>GLOBAL/ScriptDeploymentTechnology</DeploymentTechnology>

  - id: sccm-hidden-application-object
    desc: Hides SCCM application from management console
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)\bSMS_Application\b.{0,600}\bIsHidden\b.{0,80}(=|:|>)\s*(true|1)\b'

  - id: sccm-service-window-override-enabled
    desc: Enables SCCM service window override
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)\bOverrideServiceWindows\b.{0,80}(=|:|>)\s*(true|1)\b'

  - id: sccm-user-notification-disabled
    desc: Sets NotifyUser false
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bNotifyUser\b[^;=]{0,24}(=|:|>)\s*(false|0)\b'

  - id: sccm-user-ui-disabled
    desc: Disables SCCM assignment user interface
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bUserUIExperience\b.{0,80}(=|:|>)\s*(false|0)\b'

  - id: sccm-application-assignment-delete
    desc: Deletes SCCM application assignment via WMI
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bSMS_ApplicationAssignment\b.{0,1000}\.Delete\s*\('

  - id: sccm-application-object-expire
    desc: SCCM application expiry method reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bSMS_Application\b.{0,999}\bSetIsExpired\b'

  - id: sccm-application-object-remove
    desc: Deletes SCCM application object via WMI
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bSMS_Application\b.{0,999}\.Delete\s*\('

composite_rules:
  - id: sccm-application-assignment-write
    desc: SCCM assignment and target-collection clues
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/package-manager/management::sccm-application-assignment-class
      - id: metadata/lang/source/naming/setting::target-collection-id-name
    near_bytes: 1400

  - id: sccm-script-application-command-digest
    desc: SCCM script deployment command configuration
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/package-manager/management::sccm-app-management-digest
      - id: micro-behaviors/os/application/update::sccm-script-deployment-technology
      - id: micro-behaviors/os/package-manager/management::sccm-install-command-field
    near_bytes: 3800

  - id: sccm-assignment-forces-service-window-override
    desc: Overrides SCCM assignment service windows
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/management::sccm-application-assignment-class
      - id: micro-behaviors/os/package-manager/management::sccm-enforcement-deadline-field
      - id: micro-behaviors/os/application/update::sccm-service-window-override-enabled
    near_bytes: 2300

  - id: sccm-assignment-suppresses-user-ui
    desc: Disables SCCM assignment notifications and UI
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/package-manager/management::sccm-application-assignment-class
      - id: micro-behaviors/os/application/update::sccm-user-notification-disabled
      - id: micro-behaviors/os/application/update::sccm-user-ui-disabled
    near_bytes: 2300

  - id: sccm-application-object-delete
    desc: Expires or deletes SCCM application via WMI
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/application/update::sccm-application-object-expire
      - id: micro-behaviors/os/application/update::sccm-application-object-remove
