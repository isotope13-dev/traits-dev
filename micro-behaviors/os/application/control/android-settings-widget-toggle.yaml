# The stock Settings power-control widget toggles GPS, Wi-Fi, Bluetooth
# and sync when it receives a broadcast addressed to
# com.android.settings.widget.SettingsAppWidgetProvider with category
# ALTERNATIVE and data "custom:<n>" (3 = GPS). Before Android 4.1 the widget
# did not check the sender, so any app could turn location on silently.
defaults:
  platforms: [android]
  for: [dex]
  conf: 0.92

traits:
  - id: dex-settings-widget-provider-target
    desc: Targets the Settings power widget provider
    crit: notable
    if:
      type: text
      substr: com.android.settings.widget.SettingsAppWidgetProvider

  - id: dex-intent-alternative-category
    desc: References the ALTERNATIVE intent category
    crit: notable
    if:
      type: text
      substr: android.intent.category.ALTERNATIVE

  - id: dex-location-providers-allowed-setting
    desc: Uses the location_providers_allowed setting
    crit: notable
    if:
      type: text
      substr: location_providers_allowed
