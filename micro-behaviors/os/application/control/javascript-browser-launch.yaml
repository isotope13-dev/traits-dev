defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: puppeteer-launch-call
    desc: Puppeteer launch call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: puppeteer.launch

  # A static path or a synchronous lookup is ordinary. An awaited call that
  # supplies the browser path means the launched executable is whatever that
  # call returns at runtime.
  - id: executable-path-awaited-assignment
    desc: executablePath assigned from awaited call
    conf: 0.85
    if:
      type: text
      regex: '\bexecutablePath\s*[:=]\s*await\s+[\w.]+\s*\('

composite_rules:
  - id: puppeteer-launch-awaited-executable
    desc: Puppeteer launch uses an awaited executable path
    crit: notable
    conf: 0.9
    near_lines: 8
    all:
      - id: puppeteer-launch-call
      - id: executable-path-awaited-assignment
