defaults:
  for: [applescript]
  platforms: [macos]
traits:
- id: run-app
  desc: AppleEvent application-open code
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: aevt.oapp
- id: quit-app
  desc: AppleEvent application-quit code
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: aevt.quit
- id: reopen-app
  desc: AppleEvent application-reopen code
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: aevt.rapp
- id: activate
  desc: AppleEvent application-activate code
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: misc.actv
- id: select
  desc: AppleEvent item-selection code
  crit: baseline
  conf: 0.85
  if:
    type: text
    exact: misc.slct
- id: delete-dup
  desc: AppleEvent item-deletion code
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: core.dele
- id: move
  desc: AppleEvent item-move code
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: core.move
- id: duplicate
  desc: AppleEvent item-duplicate code
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: core.clon
