defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  conf: 0.97

traits:
  - id: document-open-handler
    desc: VBA Document_Open event handler
    crit: notable
    if:
      type: function
      exact: Document_Open
  - id: document-new-handler
    desc: VBA Document_New event handler
    crit: notable
    if:
      type: function
      exact: Document_New
  - id: document-close-handler
    desc: VBA Document_Close event handler
    crit: notable
    if:
      type: function
      exact: Document_Close

composite_rules:
  - id: document-lifecycle-trigger-mix
    desc: Multiple document lifecycle triggers
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/application/hook::document-open-handler
      - id: micro-behaviors/os/application/hook::document-new-handler
      - id: micro-behaviors/os/application/hook::document-close-handler
