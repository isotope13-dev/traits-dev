defaults:
  for: [oledoc]
  platforms: [windows]
  crit: notable
  conf: 0.88

traits:
  - id: wordbasic-autoopen
    desc: WordBasic auto-macro entrypoint in OleDoc
    crit: suspicious
    conf: 0.87
    attack: T1204.002
    # A bare AutoOpen word in a document carrying a VBA project is the VBA
    # handler's name, not a legacy WordBasic entrypoint: WordBasic predates
    # VBA projects, so the VBA symbol trait owns that evidence. WordBasic-only
    # documents (no VBA project) still match.
    unless:
      - id: metadata/document/ole::ole-vba-macro-count
    if:
      type: text
      regex: '(?i)\b(AutoOpen|AutoClose)\b'

  - id: wordbasic-filesaveas-hook
    desc: WordBasic FileSaveAs macro override in OleDoc
    conf: 0.85
    attack: T1204.002
    if:
      type: text
      word: "FileSaveAs"

  - id: colon-qualified-auto-run-macro-path
    desc: Container-qualified auto-run macro path literal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i):\s*auto(Open|Exec|Close|New|Exit)'

  - id: colon-qualified-command-macro-path
    desc: Container-qualified command macro path literal
    crit: suspicious
    conf: 0.9
    attack: T1204.002
    if:
      type: text
      regex: '(?i):\s*(file(close|exit|save(as)?)|toolsmacro|dateispeich\w*)\b'



  - id: global-qualified-macro-path
    desc: Global-container macro path literal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # WW6-class infectors copy macros through the global template by
      # container path — `Global:autoOpen` or `\normal:autoOpen` for auto-run spreaders,
      # `Global:DocClose` / `Global:ToolsSpelling` / `Global:PayLoad` for the
      # command-macro spreaders that hook no auto entrypoint.
      regex: '(?i)\b(Global|Normal)\s*:\s*[A-Za-z]\w{1,24}\b'

  - id: wordbasic-command-hook
    desc: WordBasic document command override
    crit: suspicious
    conf: 0.88
    attack: T1204.002
    if:
      type: raw
      regex: '(?i)\b(datei(speichern\w*|dokvorlagen|schlie\w*)|file(close|exit|save(as)?|chiudi|esci))\b'

