defaults:
  for: [oledoc]
  platforms: [windows]
  crit: notable
traits:
- id: fragmented-vba-workbook-open-entrypoint
  desc: Fragmented VBA Workbook_Open entrypoint
  conf: 0.94
  if:
    type: raw
    regex: '(?i)\bSub[\s\S]{0,2}Wor[\s\S]{0,2}kbook_Op[\s\S]{0,2}en\b'
- id: fragmented-vba-auto-open-entrypoint
  desc: Fragmented VBA AutoOpen or Document_Open hook
  conf: 0.95
  if:
    type: raw
    regex: '(?i)(\bAuto[\s\x00_]{0,4}Open\b|\bDocument[\s\x00]{0,4}_Open\b)'
- id: raw-vba-powerpoint-actionhook
  desc: Raw VBA PowerPoint actionhook event
  conf: 0.95
  if:
    type: raw
    regex: '(?i)\bactionhook\b'

