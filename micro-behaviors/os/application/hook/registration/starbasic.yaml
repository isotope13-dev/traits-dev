# OpenOffice/LibreOffice application-wide event binding from Basic. The
# GlobalEventBroadcaster service fires for every document the suite opens,
# saves or closes; ReplaceByName on its Events container rebinds one of those
# events (OnLoad, OnSave, OnUnload, ...) to a script.
defaults:
  for: [xml]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95

traits:
  - id: starbasic-global-event-rebind
    desc: Rebinds an application-wide OpenOffice event
    if:
      type: text
      regex: '(?s)GlobalEventBroadcaster.{0,600}?\.Events\.ReplaceByName\s*\('

  - id: starbasic-document-macro-script-url
    desc: Script URL names a document-hosted macro
    conf: 0.9
    if:
      # Legacy `macro://ThisComponent/Lib.Module.Sub` and the newer
      # `vnd.sun.star.script:...?location=document` both resolve the macro in
      # whichever document is current when the event fires.
      type: text
      regex: '(?i)macro://ThisComponent/[\w.]+|vnd\.sun\.star\.script:[^"&<\s]{1,120}location=document'
