defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  conf: 0.97

traits:
  - id: document-open-handler
    desc: VBA Document_Open event handler
    crit: notable
    if:
      type: function
      exact: Document_Open
  - id: document-new-handler
    desc: VBA Document_New event handler
    crit: notable
    if:
      type: function
      exact: Document_New
  - id: document-close-handler
    desc: VBA Document_Close event handler
    crit: notable
    if:
      type: function
      exact: Document_Close

composite_rules:
  # Open, New and Close handlers together are how every macro-enabled Word
  # template or add-in manages its own state (style packs, toolbars, option
  # files). The trio alone says nothing about what the handlers run; it is a
  # corroborating leg for composites such as the TrickBot loader.
  - id: document-lifecycle-trigger-mix
    desc: Multiple document lifecycle triggers
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/application/hook/event::document-open-handler
      - id: micro-behaviors/os/application/hook/event::document-new-handler
      - id: micro-behaviors/os/application/hook/event::document-close-handler
