# Office runs a VBA procedure (or a module's MAIN) whose name matches a
# built-in command instead of the command itself, and Excel runs the macro
# named by OnSheetActivate / OnTime / a control event without user action.
# These are trigger surfaces; document-management add-ins override FileSave
# too, so intent comes from what the triggered code does.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.9
  attack: T1137

traits:
  - id: vba-word-file-command-procedure
    desc: Overrides a Word file command with VBA
    if:
      type: text
      regex: '(?i)(\bSub\s+|VB_Name\s*=\s*")(File(Save(As)?|Close|New(Default)?|Open|Exit)|ToolsMacro)\b'

  - id: excel-onsheetactivate-macro-hook
    desc: Registers a macro for every sheet activation
    if:
      type: text
      regex: '(?i)\bApplication\.OnSheetActivate\s*=\s*"[^"\r\n]{1,80}"'

  - id: excel-ontime-immediate-macro
    desc: Schedules a macro to run moments later
    if:
      type: text
      regex: '(?i)\bApplication\.OnTime\s+Now\s*\+\s*TimeValue\s*\(\s*"00:00:\d\d"'

  - id: msforms-layout-event-handler
    desc: Handles an ActiveX control Layout event
    if:
      type: text
      regex: '(?i)\bSub\s+\w{1,40}_Layout\s*\(\s*\)'
