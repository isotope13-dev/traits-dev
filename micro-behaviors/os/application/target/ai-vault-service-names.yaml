defaults:
  platforms: [unix, windows]
  for: [scripts]
composite_rules:
  - id: ai-vault-service-names
    desc: AI, vault or dashboard service name reference
    crit: notable
    conf: 0.82
    any:
      - id: micro-behaviors/communications/http/services/anthropic::service-name-anthropic
      - id: metadata/file/catalog/service::service-name-vault
      - id: metadata/file/catalog/service::service-name-grafana
