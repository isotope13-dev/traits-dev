# Application-subject review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - shell
  - batch
  - powershell
  - ruby
  - perl
  - lua
  - python
  - pyc
traits:
- id: pythonw-executable-reference
  desc: References the pythonw executable name
  conf: 0.84
  if:
    type: text
    regex: "(?i)\\bpythonw(\\.exe)?\\b"
