# Application-subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  for:
  - class
  crit: notable
traits:
- id: javaw-exe-literal
  desc: References javaw.exe Windows launcher
  crit: notable
  conf: 0.92
  for:
  - class
  - java_class
  if:
    type: value
    path: class.strings[*]
    regex: "(?i)javaw\\.exe"
- id: js-javaw-exe-literal
  desc: JavaScript literal names javaw.exe
  crit: notable
  conf: 0.92
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  if:
    type: literal
    kind: string
    regex: "(?i)(^|[\\\\/])javaw\\.exe$"
