# Application-subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  crit: baseline
traits:
- id: dev-apps-sublime
  desc: Dev app sublime_text
  crit: notable
  conf: 0.5
  if:
    type: text
    word: sublime_text
    case_insensitive: true
- id: dev-apps-notepad-vim
  desc: Dev app notepad++
  crit: notable
  conf: 0.5
  if:
    type: text
    word: notepad++
    case_insensitive: true
- id: dev-apps-vim
  desc: Repeated Vim name references
  crit: component
  conf: 0.5
  count_min: 2
  if:
    type: literal
    word: vim
    case_insensitive: false
  not:
  - substr: "/vim"
  unless:
  - id: well-known/tool/development/cli/fzf::fzf-binary
- id: dev-apps-emacs
  desc: Repeated Emacs name references
  crit: notable
  conf: 0.5
  count_min: 2
  if:
    type: text
    word: emacs
    case_insensitive: true
  not:
  - regex: "(?i)(/terminfo/|github\\.com/|/usr/share/)"
  unless:
  - type: text
    substr: dired
  - type: basename
    exact: CHANGES
  - id: well-known/tool/development/cli/fzf::fzf-binary
  downgrade:
    any:
    - id: metadata/file/string/identity::system-shell-basename
- id: dev-apps-pycharm-exe
  desc: PyCharm Windows executable
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\bpycharm(64|32)?\\.exe\\b"
    case_insensitive: true
- id: pycharm-unix-launcher-name
  desc: PyCharm shell launcher or app bundle name
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\bpycharm\\.(sh|app)\\b"
    case_insensitive: true
- id: dev-apps-intellij
  desc: IntelliJ executable or launcher name
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\b(idea|intellij)(64)?\\.(exe|sh|app)\\b"
composite_rules:
- id: dev-apps
  desc: Developer/Editor application names
  crit: baseline
  conf: 0.5
  any:
  - id: metadata/file/profile/tool-reference::vscode-name
  - id: micro-behaviors/os/application/target/development::dev-apps-sublime
  - id: micro-behaviors/os/application/target/development::dev-apps-notepad-vim
  - id: micro-behaviors/os/application/target/development::dev-apps-vim
  - id: micro-behaviors/os/application/target/development::dev-apps-emacs
  - id: micro-behaviors/os/application/target/development::dev-apps-pycharm
  - id: micro-behaviors/os/application/target/development::dev-apps-intellij
- id: dev-apps-pycharm
  desc: Dev app pycharm
  crit: notable
  conf: 0.5
  any:
  - id: micro-behaviors/os/application/target/development::dev-apps-pycharm-exe
  - id: micro-behaviors/os/application/target/development::pycharm-unix-launcher-name
  - id: micro-behaviors/os/application/target/development::dev-apps-pycharm-path
