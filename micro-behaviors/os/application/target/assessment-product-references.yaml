defaults:
  platforms: [windows, macos, linux]
  for: [binaries]
  crit: notable
  conf: 0.9
traits:
  - id: cpuz-product-reference
    crit: notable
    desc: References CPU-Z or CPUID Ltd
    if:
      type: text
      regex: (?i)\b(CPU-Z|CPUID Ltd\.?)\b
  - id: putty-product-reference
    crit: notable
    desc: References the PuTTY SSH client
    if:
      type: text
      word: PuTTY
