defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: apache-tomcat-product-reference
    desc: Apache Tomcat product name
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(?i)apache[\s_-]*tomcat'
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
