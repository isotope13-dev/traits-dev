traits:
- crit: notable
  id: service-name-binance
  desc: References the Binance service
  conf: 0.82
  if:
    type: text
    word: Binance
- crit: notable
  id: service-name-kraken
  desc: References the Kraken exchange service
  conf: 0.82
  if:
    type: text
    # "Kraken" is also an ordinary mythical-beast name (avatar presets,
    # mascots); require a finance/trading neighbor on the same line.
    regex: '(?i)(ccxt|exchang|trad|balanc).{0,80}kraken|kraken.{0,80}(ccxt|exchang|trad|balanc)'
- crit: notable
  id: service-name-stripe
  desc: References the Stripe payment service
  conf: 0.82
  if:
    type: text
    word: Stripe
composite_rules:
- crit: notable
  id: finance-service-names
  desc: References finance or payment services
  conf: 0.82
  any:
  - id: micro-behaviors/os/application/target::service-name-binance
  - id: micro-behaviors/os/application/target::wallet-brand-coinbase
  - id: micro-behaviors/os/application/target::service-name-kraken
  - id: micro-behaviors/os/application/target::service-name-stripe
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
