defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]
composite_rules:
- id: browser-store-and-three-browser-name-references
  desc: Browser data files and 3+ browser names co-occur
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/application/browser/profile::browser-data-files
  # 3+ distinct browser-name keywords (directory ref counts distinct member
  # matches toward needs:).
  needs: 3
  any:
  - id: micro-behaviors/os/application/target/browser::chrome-browser-name-literal
  - id: micro-behaviors/os/application/target/browser::firefox-browser-name-literal
  - id: well-known/app/browser/safari::safari-browser-name-literal
  - id: micro-behaviors/os/application/target/browser::brave-name
  - id: micro-behaviors/os/application/target/browser::opera-name-or-path-reference
  - id: micro-behaviors/os/application/target/browser::microsoft-edge-name
