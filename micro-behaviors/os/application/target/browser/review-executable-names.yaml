# Application-subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  crit: baseline
traits:
- id: browser-apps-safari
  desc: Browser app safari
  conf: 0.5
  count_max: 1
  if:
    type: text
    regex: "(?i)\\b(safari\\.exe|/Applications/Safari\\.app)\\b"
- id: browser-apps-opera-brave
  desc: Browser app opera
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\b(opera\\.exe|opera-browser|opera_stable)\\b"
  unless:
  - id: metadata/lang/javascript-features::closure-externs-annotation
  downgrade:
    any:
    - id: metadata/binary/resource/
    - id: metadata/build/recognized-contexts/
    - id: well-known/lib/ui/presentation::x3dom-runtime-banner
- id: browser-apps-brave
  desc: References the Brave executable filename
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\bbrave\\.exe\\b"
  unless:
  - id: metadata/file/catalog/identity/
  downgrade:
    any:
    - id: metadata/binary/resource/
composite_rules:
- id: browser-apps
  desc: References a browser executable name
  crit: notable
  conf: 0.5
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  - c
  - cpp
  - go
  unless:
  - id: well-known/tool/development/testing/webdriver-manager::selenium-webdriver-driver-manager-package
  any:
  - id: micro-behaviors/os/application/target/browser::chrome-process-name
  - id: micro-behaviors/os/application/target/browser::browser-apps-firefox
  - id: micro-behaviors/os/application/target/browser::msedge-executable-name
  - id: micro-behaviors/os/application/target/browser::browser-apps-safari
  - id: micro-behaviors/os/application/target/browser::browser-apps-opera-brave
  - id: micro-behaviors/os/application/target/browser::browser-apps-brave
  - id: micro-behaviors/os/application/target/browser::browser-apps-iexplore
- id: chrome-process-name
  desc: Standalone Chrome-family application-name token
  crit: notable
  conf: 0.5
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  - c
  - cpp
  - go
  any:
  - id: micro-behaviors/os/application/target/browser::chrome-exe-process-name
  - id: micro-behaviors/fs/path/application/executable::google-chrome-unix-path
  - id: micro-behaviors/process/argument/option::google-chrome-command-options
  - id: micro-behaviors/os/application/target/browser::chromium-browser-process-name
- id: browser-apps-firefox
  desc: References a Firefox executable or application package
  crit: baseline
  conf: 0.5
  any:
  - id: micro-behaviors/os/application/target/browser::browser-apps-firefox-exe
  - id: micro-behaviors/os/application/target/browser::browser-apps-firefox-bin
  - id: micro-behaviors/os/application/target/browser::browser-apps-firefox-browser
  - id: micro-behaviors/os/application/target/browser::browser-apps-firefox-esr
  - id: micro-behaviors/fs/path/application/bundle::browser-apps-firefox-app
