defaults:
  for:
  - html
  platforms:
  - windows
traits:
- id: packed-baidubar-progid-tokens
  desc: Packed BaiduBar and Tool ProgID tokens
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \|BaiduBar\|.{0,45}\|Tool\|
    exclude_html_comments: true
- id: percent-hex-baidubar-name
  desc: Percent-wrapped hexadecimal BaiduBar name
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: '%5Cx42%5Cx61%5Cx69%5Cx64%5Cx75%5Cx42%5Cx61%5Cx72'
    exclude_html_comments: true
