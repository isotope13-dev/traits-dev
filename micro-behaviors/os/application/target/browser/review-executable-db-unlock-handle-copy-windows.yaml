# Application references; each cluster leg names a different browser.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: browser-process-opera
  desc: References opera.exe process name
  crit: notable
  conf: 0.82
  for:
  - pe
  - dll
  - c
  - cpp
  platforms:
  - windows
  if:
    type: text
    word: opera.exe
composite_rules:
- id: browser-process-name-cluster
  desc: Multiple browser process names
  crit: component
  conf: 0.88
  for:
  - pe
  - dll
  - source
  platforms:
  - windows
  near_bytes: 512
  needs: 2
  any:
  - id: micro-behaviors/os/application/target/browser::chrome-exe-process-name
  - id: micro-behaviors/os/application/target/browser::browser-apps-firefox-exe
  - id: micro-behaviors/os/application/target/browser::msedge-executable-name
  - id: micro-behaviors/os/application/target/browser::browser-apps-brave
  - id: micro-behaviors/os/application/target/browser::browser-process-opera
