defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  conf: 0.4
  crit: notable
traits:
- id: chrome-browser-name-literal
  desc: String literal names the Chrome browser
  unless:
  - type: text
    regex: \.displayName\s*=\s*["\x27]Chrome["\x27]
  - id: metadata/package/documentation
  - id: metadata/document/html::html-root-at-start
  - id: metadata/package/testing/harness/runtime/
  if:
    type: string_literal
    exact: Chrome
- id: firefox-browser-name-literal
  desc: String literal names the Firefox browser
  unless:
  - id: metadata/package/documentation
  - id: metadata/document/html::html-root-at-start
  - id: metadata/package/testing/harness/runtime/
  if:
    type: string_literal
    substr: Firefox
  not:
  - substr: Mozilla\Firefox\Profiles
