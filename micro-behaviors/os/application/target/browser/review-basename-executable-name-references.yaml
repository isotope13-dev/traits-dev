---
defaults:
  platforms:
  - windows
  - unix
traits:
- id: chromium-browser-process-name
  desc: Standalone chromium-browser process-name token
  crit: notable
  conf: 0.5
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  - c
  - cpp
  - go
  if:
    type: text
    regex: (?i)(^|[[:space:]"'(\[])chromium-browser([[:space:]"')\]]|$)
    case_insensitive: true
  unless:
  - type: text
    substr: application/x-google-chrome-extension
- id: browser-apps-firefox-exe
  desc: Firefox executable name reference
  conf: 0.5
  for:
  - pe
  - dll
  - elf
  - c
  - cpp
  - python
  - javascript
  - powershell
  - batch
  if:
    type: text
    word: firefox.exe
    case_insensitive: true
  crit: baseline
- id: browser-apps-firefox-bin
  desc: Firefox binary name reference
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\bfirefox-bin\\b"
    case_insensitive: true
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  crit: baseline
- id: browser-apps-iexplore
  desc: Internet Explorer executable stem reference
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\biexplore\\b"
  unless:
  - id: metadata/build/recognized-contexts/
  downgrade:
    any:
    - id: metadata/binary/resource/
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
