defaults:
  size_min: 1
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: component
  conf: 0.4
traits:
- id: microsoft-edge-name
  crit: notable
  conf: 0.92
  desc: Names the Microsoft Edge browser
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: Microsoft Edge
- id: edge-name-other
  crit: notable
  desc: References an Edge Browser or Chromium name
  if:
    type: text
    regex: Edge\s+(Browser|Chromium)
