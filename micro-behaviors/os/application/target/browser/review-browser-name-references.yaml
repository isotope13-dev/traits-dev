defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: component
  conf: 0.4
traits:
- id: edge-name-path
  desc: Edge path segment reference
  if:
    type: text
    regex: Edge[/\\]
  unless:
  - id: well-known/game/overwolf::overwolf-vendor-string
  not:
  - substr: Edge\
  - substr: Microsoft\Edge\
  - substr: \BraveSoftware\
