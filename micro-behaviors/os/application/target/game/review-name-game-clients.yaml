# Application-subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.95
traits:
- id: league-client-process-name
  desc: League of Legends client process name
  if:
    type: text
    regex: "(?i)\\b(League of Legends|RiotClientServices)\\.exe\\b"
