defaults:
  for:
  - scripts
  - binaries
  - csharp
  platforms:
  - macos
  - windows
  - linux
traits:
- id: binance-aspect
  desc: Binance application package reference
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: '@aspect-binance'
composite_rules:
- id: binance
  desc: Binance application or store reference
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/app-data/application::binance-app-store
  - id: micro-behaviors/os/application/target/finance::binance-aspect
