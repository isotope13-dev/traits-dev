# Dozens of third-party banking application ids embedded in one APK: the
# overlay/injection target list of an Android banker. A bank's own app names
# itself and maybe a sister app, never a few dozen competitors.
defaults:
  platforms: [android]
  for: [dex]
  conf: 0.9

traits:
  - id: dex-many-banking-app-ids
    desc: DEX embeds 25+ banking application ids
    crit: notable
    attack: T1417.002
    count_min: 25
    if:
      type: text
      regex: '\b[a-z]{2,3}\.[a-z0-9_]{1,40}(\.[a-z0-9_]{1,40}){0,5}\.[a-z0-9_]{0,30}bank[a-z0-9_]{0,10}'
