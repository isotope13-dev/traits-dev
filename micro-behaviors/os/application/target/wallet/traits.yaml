defaults:
  for: [scripts, binaries, csharp]
  attack: T1555
  mbc: B0028
  crit: suspicious
  platforms:
  - macos
  - windows
  - linux

traits:
- id: coinomi-bundle
  desc: com.coinomi bundle
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: com.coinomi
- id: exodus-bundle
  desc: com.exodus bundle
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: com.exodus
  # Wallet directories declare the wallet's own EIP-6963 rdns discovery name;
  # an installed-app probe never does.
  unless:
  - id: micro-behaviors/communications/blockchain/client::wallet-provider-rdns-table
- id: desktop-wallet-product-list--rx-4
  desc: Trezor Suite product name (repeated)
  crit: component
  conf: 0.9
  count_min: 4
  if:
    id: micro-behaviors/os/application/target/wallet::trezor-suite-product
- id: atomic-bundle
  desc: com.atomicwallet bundle
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: com.atomicwallet
- id: tonkeeper-desktop
  desc: "Tonkeeper desktop package reference"
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: '@tonkeeper/desktop'
- id: tonkeeper-bundle
  desc: com.ton-keeper bundle
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: com.ton-keeper
- id: ledgerhq-package
  desc: "LedgerHQ package namespace reference"
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: '@ledgerhq'
- id: guarda-bundle
  desc: com.guarda bundle
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: com.guarda
composite_rules:
- id: coinomi
  desc: "Coinomi application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::coinomi-wallets-dir
  - id: micro-behaviors/fs/path/wallet::coinomi-wallet-dat
  - id: micro-behaviors/os/application/target/wallet::coinomi-bundle
- id: atomic
  desc: "Atomic Wallet application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::atomic-local-storage
  - id: micro-behaviors/os/application/target/wallet::atomic-bundle
- id: tonkeeper
  desc: "Tonkeeper application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/os/application/target/wallet::tonkeeper-desktop
  - id: micro-behaviors/fs/path/wallet::tonkeeper-config
  - id: micro-behaviors/os/application/target/wallet::tonkeeper-bundle
- id: ledger
  desc: "Ledger application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::ledger-live-dir
  - id: micro-behaviors/os/application/target/wallet::ledgerhq-package
  - id: micro-behaviors/fs/path/wallet::ledger-accounts
  unless:
  - id: metadata/package/name/identity::crypto-sdk-sibling-name-claim
  - id: metadata/package/name/identity::crypto-sdk-manifest-name-claim
  - id: well-known/lib/crypto/sdk::trezor-connect-webextension-library
- id: guarda
  desc: "Guarda application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::guarda-local-storage
  - id: micro-behaviors/os/application/target/wallet::guarda-bundle
- id: desktop-wallet-product-list
  desc: Repeated references to multiple desktop wallet products
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: well-known/lib/crypto/ledger-live::ledger-live-product-at-least-four
  - id: micro-behaviors/os/application/target/wallet::desktop-wallet-product-list--rx-4
  - id: well-known/app/finance/monero-gui::monero-gui-name-at-least-four
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: metadata/package/name/identity::crypto-sdk-sibling-name-claim
  - id: metadata/package/name/identity::crypto-sdk-manifest-name-claim
  - id: well-known/lib/crypto/sdk::trezor-connect-webextension-library

# Mass desktop crypto-wallet directory theft (wallet drainer recon). Enumerating

