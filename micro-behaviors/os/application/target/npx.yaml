defaults:
  platforms: [windows, unix]
traits:
  - id: npx-package-runner-target
    desc: Spawn target is the npx package runner
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        kind: string
        exact: npx

