defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  attack: T1552.001

traits:
- id: crypto-wallet-keyword-cluster--rx-1
  desc: Repeated MetaMask wallet keyword
  crit: notable
  conf: 0.9
  count_min: 4
  if:
    type: text
    substr: metamask
  not:
    - regex: '(@metamask/|metamask-[a-z]|[a-z0-9_-]+-metamask|metamask\.(png|svg|jpg))'
- id: crypto-wallet-keyword-cluster--rx-2
  desc: Repeated Phantom wallet keyword
  crit: component
  conf: 0.9
  count_min: 4
  if:
    id: micro-behaviors/os/application/target::phantom-wallet-word
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
- id: hardware-wallet-keyword-cluster--rx-6
  desc: Repeated Trezor wallet keyword
  crit: component
  conf: 0.88
  count_min: 4
  if:
    type: text
    substr: trezor
- id: hardware-wallet-keyword-cluster--rx-7
  desc: "Ledger product or domain reference"
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)(Ledger Live|LedgerWallet|ledger\.com)'
- id: hardware-wallet-keyword-cluster--rx-8
  desc: Repeated Electrum wallet keyword
  crit: notable
  conf: 0.88
  count_min: 4
  if:
    type: text
    substr: electrum
- id: hardware-wallet-keyword-cluster--rx-9
  desc: Repeated Exodus wallet keyword
  crit: component
  conf: 0.88
  count_min: 4
  if:
    type: text
    substr: exodus
- id: hardware-wallet-keyword-cluster--rx-10
  desc: Repeated Trust Wallet keyword
  crit: notable
  conf: 0.88
  count_min: 4
  if:
    type: text
    substr: trustwallet
