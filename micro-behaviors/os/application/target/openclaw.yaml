defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, markdown, powershell, text, shell]
  size_max: 5000000
traits:
  - id: openclaw-name-reference
    desc: References the OpenClaw application name
    crit: notable
    conf: 0.94
    # shell included: a SKILL.md member may be typed markdown or shell by
    # content heuristics, and the openclaw metadata field appears under both.
    if:
      type: text
      regex: '(?i)\b(OpenClaw|Clawdbot|Moltbot|Molty)\b'
