defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, markdown, powershell, text]
  size_max: 5000000
traits:
  - id: openclaw-name-reference
    desc: References the OpenClaw application name
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(OpenClaw|Clawdbot|Moltbot|Molty)\b'
