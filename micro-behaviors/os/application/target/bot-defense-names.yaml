# Product references do not establish solving or evasion. Preserve distinct
# vendor legs so aliases and repeated mentions cannot inflate cardinality.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown]
  crit: notable
  conf: 0.9

traits:
  - id: kasada-name-reference
    desc: References Kasada bot defense
    if:
      type: text
      regex: '(?i)\bkasada\b'
  - id: perimeterx-name-reference
    desc: References PerimeterX bot defense
    if:
      type: text
      regex: '(?i)\bperimeter-?x\b'
  - id: datadome-name-reference
    desc: References DataDome bot defense
    if:
      type: text
      regex: '(?i)\bdatadome\b'
  - id: imperva-name-reference
    desc: References Imperva or Incapsula
    if:
      type: text
      regex: '(?i)\b(imperva|incapsula)\b'
  - id: akamai-name-reference
    desc: References Akamai
    if:
      type: text
      regex: (?i)\bakamai\b
    unless:
    - id: metadata/file/format/wordlist::one-token-per-line-list

  - id: shape-security-name-reference
    desc: References Shape Security bot defense
    if:
      type: text
      regex: '(?i)\bshape[ _-]?security\b'
  - id: aws-waf-name-reference
    desc: References AWS WAF
    if:
      type: text
      regex: '(?i)\baws[ _-]?waf\b'
  - id: recaptcha-name-reference
    desc: References reCAPTCHA
    if:
      type: text
      regex: (?i)\brecaptcha\b
    unless:
    - id: metadata/file/format/wordlist::one-token-per-line-list

  - id: hcaptcha-name-reference
    desc: References hCaptcha
    if:
      type: text
      regex: '(?i)\bhcaptcha\b'
  - id: arkose-name-reference
    desc: References Arkose or FunCaptcha
    if:
      type: text
      regex: (?i)\b(arkose|funcaptcha)\b
    unless:
    - id: metadata/file/format/wordlist::one-token-per-line-list

  - id: turnstile-name-reference
    desc: References Cloudflare Turnstile
    if:
      type: text
      regex: (?i)\bturnstile\b
    unless:
    - id: metadata/file/format/wordlist::one-token-per-line-list

  - id: geetest-name-reference
    desc: References GeeTest CAPTCHA
    if:
      type: text
      regex: '(?i)\bgeetest\b'

composite_rules:
  - id: multiple-captcha-provider-references
    desc: Package names at least three CAPTCHA providers
    conf: 0.94
    scope: archive
    for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown, npm, whl, python_sdist, zip, tar]
    needs: 3
    any:
      - id: recaptcha-name-reference
      - id: hcaptcha-name-reference
      - id: arkose-name-reference
      - id: turnstile-name-reference
      - id: geetest-name-reference
  - id: multiple-bot-defense-vendor-references
    desc: Package references at least three bot-defense vendors
    conf: 0.95
    scope: archive
    for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown, npm, whl, python_sdist, zip, tar]
    needs: 3
    any:
      - id: kasada-name-reference
      - id: perimeterx-name-reference
      - id: datadome-name-reference
      - id: imperva-name-reference
      - id: akamai-name-reference
      - id: shape-security-name-reference
      - id: aws-waf-name-reference
      - id: micro-behaviors/communications/http/cookie-name::cloudflare-clearance-reference
      - id: micro-behaviors/communications/http/cookie-name::alibaba-acw-challenge-reference
    unless:
      - id: well-known/lib/ui/iconify::svg-icon-body-map
