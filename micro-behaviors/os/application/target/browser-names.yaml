# Browser names are neutral target context; consumers supply access or abuse.
defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]

composite_rules:
  - id: multiple-browser-names
    desc: References at least two distinct browser names
    crit: notable
    conf: 0.5
    needs: 2
    any:
      - id: metadata/file/string/application-name::chrome-browser-name-literal
      - id: metadata/file/string/application-name::firefox-browser-name-literal
      - id: metadata/file/string/application-name::safari-browser-name-literal
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/string/application-name::browser-doc-example-index
      - id: well-known/lib/ui/greensock::greensock-tweenmax-suite-banner
