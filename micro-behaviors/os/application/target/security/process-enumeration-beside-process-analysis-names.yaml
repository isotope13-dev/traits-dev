defaults:
  platforms:
    - linux
    - macos
    - windows
composite_rules:
  - id: process-enumeration-beside-process-analysis-names
    desc: Process enumeration beside process-analysis names
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/enumerate/
    any:
      - id: micro-behaviors/process/debug/tool-markers::procmon-tool-name-reference
      - id: micro-behaviors/process/debug/tool-markers::procexp-tool-name-reference
      - id: micro-behaviors/process/debug/tool-markers::process-hacker-executable-name-reference
      - id: micro-behaviors/process/debug/tool-markers::autoruns-tool-name-reference
      - id: micro-behaviors/process/debug/tool-markers::api-monitor-tool-name-reference
      - id: micro-behaviors/os/application/target/security::http-debugger-tool-name-reference
      - id: micro-behaviors/process/debug/tool-markers::cheatengine-tool-name-reference
