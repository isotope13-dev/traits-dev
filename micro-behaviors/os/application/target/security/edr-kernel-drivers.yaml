# Kernel driver images shipped by endpoint security products. Naming one
# cites that product's kernel component (callback owner, minifilter, ELAM)
# as a subject; it does not by itself establish discovery or tampering.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, powershell]
  crit: notable
  conf: 0.92

traits:
  - id: crowdstrike-falcon-driver-image
    desc: CrowdStrike Falcon kernel driver image name
    if:
      type: text
      regex: '(?i)\b(csagent|csboot|CSDeviceControl)\.sys\b'
  - id: sentinelone-driver-image
    desc: SentinelOne kernel driver image name
    if:
      type: text
      regex: '(?i)\bSentinel(Monitor|ELAM|DeviceControl)\.sys\b'
  - id: carbonblack-cylance-driver-image
    desc: Carbon Black or Cylance driver image name
    if:
      type: text
      regex: '(?i)\b(cbk7|CbELAM|CyOptics|CyProtectDrv\d{0,2})\.sys\b'
  - id: sysmon-elastic-sophos-driver-image
    desc: Sysmon, Elastic or Sophos kernel driver image
    if:
      type: text
      regex: '(?i)\b(SysmonDrv|elastic-endpoint-driver|SophosED)\.sys\b'

composite_rules:
  # Grouped alternative for consumers that need "names some EDR/AV
  # component": kernel driver images above plus existing process-image
  # and Defender component references.
  - id: edr-component-image-reference
    desc: Endpoint-security driver or process image name
    any:
      - id: crowdstrike-falcon-driver-image
      - id: sentinelone-driver-image
      - id: carbonblack-cylance-driver-image
      - id: sysmon-elastic-sophos-driver-image
      - id: micro-behaviors/os/security/defender::component-name-reference
      - id: micro-behaviors/os/security/product::security-product-process-image
      - id: micro-behaviors/os/security/product::sentinel-agent-monitor-process-reference
      - id: micro-behaviors/os/security/product::cylance-xagt-process-reference
