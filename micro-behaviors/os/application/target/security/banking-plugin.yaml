defaults:
  for: [pe, dll]
  platforms: [windows]
  conf: 0.98
traits:
  - id: banking-protection-gbpsv-exe-path
    desc: Banking protection gbpsv.exe path
    crit: component
    if:
      type: text
      substr: '\GbPlugin\gbpsv.exe'
      case_insensitive: true
  - id: banking-protection-gbieh-dll-path
    desc: Banking protection gbieh.dll path
    crit: component
    if:
      type: text
      substr: '\GbPlugin\gbieh.dll'
      case_insensitive: true
  - id: banking-protection-gbpdist-dll-path
    desc: Banking protection gbpdist.dll path
    crit: component
    if:
      type: text
      substr: '\GbPlugin\gbpdist.dll'
      case_insensitive: true
composite_rules:
  - id: banking-protection-plugin-file-targets
    desc: Banking protection plugin binary paths
    crit: notable
    needs: 2
    any:
      - id: banking-protection-gbpsv-exe-path
      - id: banking-protection-gbieh-dll-path
      - id: banking-protection-gbpdist-dll-path
