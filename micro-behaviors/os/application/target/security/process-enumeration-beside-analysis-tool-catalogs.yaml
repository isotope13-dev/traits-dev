defaults:
  platforms:
    - linux
    - macos
    - windows
composite_rules:
  - id: process-enumeration-beside-analysis-tool-catalogs
    desc: Process enumeration beside analysis-tool catalogs
    crit: notable
    conf: 0.9
    for:
      - scripts
      - binaries
    all:
      - id: micro-behaviors/process/enumerate/
    needs: 3
    any:
      - id: micro-behaviors/os/application/target/security::process-enumeration-beside-network-analysis-names
      - id: micro-behaviors/os/application/target/security::process-enumeration-beside-process-analysis-names
      - id: micro-behaviors/os/application/target/security::process-enumeration-beside-debugger-names
      - id: micro-behaviors/process/debug/tool-markers::regshot-tool-name-reference
      - id: micro-behaviors/process/debug/tool-markers::pestudio-tool-name-reference
      - id: micro-behaviors/process/debug/tool-markers::peid-tool-name-reference
