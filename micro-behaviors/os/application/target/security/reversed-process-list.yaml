defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: reversed-antivirus-process-target-list
    desc: Reversed antivirus process-name list
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule reversed_antivirus_process_target_list {
          strings:
            $name1 = "exe.noMvaR"
            $name2 = "exe.pva"
            $name3 = "exe.23pva"
            $name4 = "exe.mralaenoz"
          condition:
            3 of them
        }
