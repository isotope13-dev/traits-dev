defaults:
  platforms:
    - windows
  for:
    - c
    - cpp
    - csharp
    - rust
    - go
    - source
  crit: notable
  conf: 0.95
traits:
  - id: source-wireshark-literal
    desc: Source literal references wireshark
    if:
      type: literal
      kind: string
      regex: (?i)^wireshark(\.exe)?$
  - id: source-dumpcap-literal
    desc: Source literal references dumpcap
    if:
      type: literal
      kind: string
      regex: (?i)\bdumpcap\b
  - id: source-splunkd-literal
    desc: Source literal references splunkd
    if:
      type: literal
      kind: string
      regex: (?i)\bsplunkd\.exe\b
