defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: ravmon-stack-wide-name
    desc: Builds wide RavMon name on stack
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: INIT
      # Six UTF-16 character stores. Frame offsets can change between builds.
      pattern: '66 C7 45 ?? 52 00 66 C7 45 ?? 61 00 66 C7 45 ?? 76 00 66 C7 45 ?? 4D 00 66 C7 45 ?? 6F 00 66 C7 45 ?? 6E 00'
