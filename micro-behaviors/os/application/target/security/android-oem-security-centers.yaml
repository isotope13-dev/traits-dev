# References to the Android OEM device-security and permission-manager
# components: MIUI Security Center, ColorOS SafeCenter, Huawei System
# Manager, Vivo Permission Manager, and Samsung Device Security. These are
# named security products, so they are targeting facts; whether the app
# self-whitelists, guides the user, or suppresses the product is composed
# under objectives/.
defaults:
  platforms: [android]
  for: [dex, xml]
  crit: notable
  conf: 0.9

traits:
  # Split vendor legs so aliases and repeated mentions cannot inflate
  # cardinality; the grouped composite keeps one referenceable identity.
  - id: android-oem-security-center-cn-vendor
    desc: References a Chinese-OEM security-center app
    conf: 0.92
    if:
      type: text
      regex: 'com\.(miui\.securitycenter|coloros\.safecenter|oppo\.securitycenter)'

  - id: android-oem-security-center-ww-vendor
    desc: References a global-OEM security-center app
    conf: 0.92
    if:
      type: text
      regex: 'com\.(huawei\.systemmanager|vivo\.permissionmanager|samsung\.android\.lool)'

composite_rules:
  - id: android-oem-security-center-target
    desc: References an Android OEM security-center app
    conf: 0.92
    any:
      - id: android-oem-security-center-cn-vendor
      - id: android-oem-security-center-ww-vendor
