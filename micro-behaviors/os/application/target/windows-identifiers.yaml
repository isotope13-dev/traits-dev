# Identifier references supply neutral context to masquerade composites.
# Preserve the original scopes and benign-context exclusions.
defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: windows-defender-identifier-reference
    desc: WindowsDefender identifier reference
    conf: 0.8
    for: [go, pe, dll]
    if:
      type: text
      regex: (?i)\bWindowsDefender(\.(exe|dll))?\b
      not:
        - substr: Windows Defender
        - substr: microsoft.com
        - substr: WindowsDefender.exe
        - substr: WindowsDefender.dll
        - substr: DefaultIcon
        - substr: ContextMenuHandlers
        - substr: ShellEx
