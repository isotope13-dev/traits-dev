defaults:
  for: [source]
  platforms:
    - macos
    - ios
  attack: T1059.002
composite_rules:
  - id: osascript-settings-reference
    desc: osascript with a settings-app name reference
    crit: notable
    conf: 0.8
    for: [applescript, macho]
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::osascript-exec
    any:
      - id: well-known/app/system/apple/macos-system-binaries::system-settings-name-reference
      - id: well-known/app/system/apple/macos-system-binaries::system-preferences-name-reference
