# Application-subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - macos
  - ios
  for:
  - javascript
  - typescript
  crit: component
  conf: 0.3
traits:
- id: springboard-daemon
  crit: notable
  desc: SpringBoard daemon name
  if:
    type: string_literal
    exact: SpringBoard
- id: launchd-daemon
  crit: notable
  desc: launchd daemon name
  if:
    type: string_literal
    exact: launchd
- id: configd-daemon
  crit: notable
  desc: configd daemon name
  if:
    type: string_literal
    exact: configd
- id: wifid-daemon
  crit: notable
  desc: wifid daemon name
  if:
    type: string_literal
    exact: wifid
- id: securityd-daemon
  crit: notable
  desc: securityd daemon name
  if:
    type: string_literal
    exact: securityd
- id: usereventagent-daemon
  crit: notable
  desc: UserEventAgent daemon name
  if:
    type: string_literal
    exact: UserEventAgent
