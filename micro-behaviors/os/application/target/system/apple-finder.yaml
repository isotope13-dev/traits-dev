# A tell target establishes application scripting, not process creation.
defaults:
  crit: notable
  platforms: [macos]
  for: [scripts, source, macho]
traits:
  - id: finder-applescript-target
    desc: AppleScript tell targets the Finder
    conf: 0.7
    if:
      type: text
      regex: 'tell application \\?"Finder\\?"'
