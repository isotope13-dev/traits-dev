defaults:
  platforms: [android]
  crit: notable
  conf: 0.92
traits:
- id: android-play-store-package-literal
  desc: Play Store app-target package identifier
  for: [java, kotlin, xml, dex, c, cpp, elf]
  if:
    type: text
    substr: com.android.vending
  unless:
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
- id: android-play-services-package-literal
  desc: Play Services app-target package identifier
  for: [java, kotlin, xml, dex]
  if:
    type: text
    substr: com.google.android.gms
