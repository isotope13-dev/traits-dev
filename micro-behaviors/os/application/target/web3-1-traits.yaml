# Phantom injected-provider references, not standalone library identity.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: phantom-wallet-word
  desc: Phantom wallet provider reference
  crit: notable
  conf: 0.7
  for: [python, javascript, typescript, csharp, go]
  if:
    type: text
    # The bare word "phantom" is KaTeX math (`mphantom`, `.phantom` font
    # flags) and ordinary English. Wallet identity needs the injected-provider
    # shape dapps actually use: window.phantom, isPhantom, or Phantom named
    # beside a chain/provider.
    regex: '(?i)window\.phantom|\bisPhantom\b|phantom[^;\n]{0,50}(solana|ethereum|provider|solanaWeb3)'
  not:
  - substr: PhantomJS
  - substr: phantomjs
  - substr: phantom_soft
  - substr: window.phantomas
  - substr: __phantomas
  unless:
  - id: micro-behaviors/os/sysinfo/platform/browser::automation-global-or-chain-probe
