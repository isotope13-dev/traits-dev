defaults:
  for: [scripts, binaries, csharp]
  attack: T1555
  mbc: B0028
  crit: suspicious
  platforms:
  - macos
  - windows
  - linux

traits:
- id: coinomi-bundle
  desc: com.coinomi bundle
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: com.coinomi
- id: exodus-bundle
  desc: com.exodus bundle
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: com.exodus
- id: desktop-wallet-product-list--rx-3
  desc: Ledger Live product name (repeated)
  crit: component
  conf: 0.9
  count_min: 4
  if:
    id: micro-behaviors/os/application/target::ledger-live-product
- id: desktop-wallet-product-list--rx-4
  desc: Trezor Suite product name (repeated)
  crit: component
  conf: 0.9
  count_min: 4
  if:
    id: micro-behaviors/os/application/target::trezor-suite-product
- id: desktop-wallet-product-list--rx-5
  desc: Monero GUI Wallet name (repeated)
  crit: notable
  conf: 0.9
  count_min: 4
  if:
    type: text
    substr: Monero GUI Wallet
- id: atomic-bundle
  desc: com.atomicwallet bundle
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: com.atomicwallet
- id: binance-aspect
  desc: "Binance application package reference"
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: '@aspect-binance'
- id: tonkeeper-desktop
  desc: "Tonkeeper desktop package reference"
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: '@tonkeeper/desktop'
- id: tonkeeper-bundle
  desc: com.ton-keeper bundle
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: com.ton-keeper
- id: ledgerhq-package
  desc: "LedgerHQ package namespace reference"
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: '@ledgerhq'
- id: guarda-bundle
  desc: com.guarda bundle
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: com.guarda
- id: teampcp-target-name
  desc: TeamPCP application target name
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\b(TeamPCP|PCPCat|pcp_cat)\b'
  unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/tool/detection/llm-scanner/
composite_rules:
- id: coinomi
  desc: "Coinomi application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::coinomi-wallets-dir
  - id: micro-behaviors/fs/path/wallet::coinomi-wallet-dat
  - id: micro-behaviors/os/application/target::coinomi-bundle
- id: atomic
  desc: "Atomic application or store reference"
  crit: suspicious
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::atomic-local-storage
  - id: micro-behaviors/os/application/target::atomic-bundle
- id: binance
  desc: "Binance application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::binance-app-store
  - id: micro-behaviors/os/application/target::binance-aspect
- id: tonkeeper
  desc: "Tonkeeper application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/os/application/target::tonkeeper-desktop
  - id: micro-behaviors/fs/path/wallet::tonkeeper-config
  - id: micro-behaviors/os/application/target::tonkeeper-bundle
- id: ledger
  desc: "Ledger application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::ledger-live-dir
  - id: micro-behaviors/os/application/target::ledgerhq-package
  - id: micro-behaviors/fs/path/wallet::ledger-accounts
  unless:
  - id: well-known/lib/crypto/sdk/
- id: guarda
  desc: "Guarda application or store reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::guarda-local-storage
  - id: micro-behaviors/os/application/target::guarda-bundle
- id: desktop-wallet-product-list
  desc: Repeated references to a desktop wallet product
  crit: suspicious
  conf: 0.9
  any:
  - id: micro-behaviors/os/application/target::desktop-wallet-product-list--rx-3
  - id: micro-behaviors/os/application/target::desktop-wallet-product-list--rx-4
  - id: micro-behaviors/os/application/target::desktop-wallet-product-list--rx-5
  unless:
  - id: well-known/tool/detection/llm-scanner/

# Mass desktop crypto-wallet directory theft (wallet drainer recon). Enumerating


