defaults:
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.95
traits:
  - id: fodhelper-go-name
    desc: Go source references fodhelper.exe
    for: [go]
    if:
      type: text
      regex: '(?i)\bfodhelper\.exe\b'
  - id: eventvwr-go-or-pe-name
    desc: Go or PE references Event Viewer name
    for: [go, pe]
    if:
      type: text
      word: eventvwr
  - id: computerdefaults-go-name
    desc: Go source references ComputerDefaults name
    for: [go]
    if:
      type: text
      word: computerdefaults
