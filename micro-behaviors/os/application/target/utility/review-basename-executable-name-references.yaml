---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
traits:
- id: perfmon-process
  desc: Performance Monitor executable name reference
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: "(?i)(^|[[:space:]/\\\\])perfmon\\.exe($|[[:space:]/\\\\])"
- id: resmon-process
  desc: Resource Monitor executable name reference
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: "(?i)\\bresmon(\\.exe)?\\b"
