# Application-subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - linux
  - android
traits:
- id: busybox-name-reference
  desc: BusyBox utility referenced by name
  crit: notable
  conf: 0.6
  for:
  - elf
  - shell
  size_min: 512
  size_max: 500000000
  if:
    type: text
    word: busybox
    case_insensitive: true
  unless:
  - id: micro-behaviors/process/create/shell/busybox::busybox-command
