defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
composite_rules:
- id: cloud-saas-service-name-references
  desc: References a Cloud SaaS service name
  conf: 0.6
  any:
  - id: metadata/file/catalog/service::service-name-digitalocean
  - id: metadata/file/catalog/service::service-name-onepassword
  - id: micro-behaviors/os/application/target::github-service-name-reference
  for:
  - scripts
