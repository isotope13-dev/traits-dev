defaults:
  platforms: [linux]
  for: [c, cpp, elf, shell]
  crit: notable
  conf: 0.9
traits:
- id: rsyslogd-daemon-path
  desc: References the rsyslogd daemon path
  if:
    type: text
    exact: /usr/sbin/rsyslogd
- id: rsyslogd-bare-invocation
  desc: Invokes rsyslogd with no arguments
  for: [shell]
  if:
    type: text
    regex: '(?m)^[ \t]*/usr/sbin/rsyslogd[ \t]*$'
