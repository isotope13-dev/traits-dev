defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.9

traits:
- id: facebook-audience-network-loader-class
  desc: Audience Network DynamicLoaderFactory class
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: "Lcom/facebook/ads/internal/dynamicloading/DynamicLoaderFactory;"

- id: facebook-audience-network-dex-asset
  desc: Audience Network asset location check
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: 'Please, check that audience_network(\.dex| folder) is inside of assets folder\.'

composite_rules:
- id: facebook-audience-network-dynamic-loader
  desc: Audience Network SDK loads its own DEX asset
  crit: exception
  conf: 0.97
  all:
  - id: micro-behaviors/os/application/target/advertising::facebook-audience-network-loader-class
  - id: micro-behaviors/os/application/target/advertising::facebook-audience-network-dex-asset

