defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.9

traits:
- id: facebook-audience-network-loader-class
  desc: Audience Network DynamicLoaderFactory class
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: "Lcom/facebook/ads/internal/dynamicloading/DynamicLoaderFactory;"

- id: facebook-audience-network-dex-asset
  desc: Audience Network asset location check
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: 'Please, check that audience_network(\.dex| folder) is inside of assets folder\.'

- id: bytedance-apm-package-descriptor
  desc: ByteDance APM SDK class descriptor
  conf: 0.96
  if:
    type: text
    substr: "Lcom/apm/insight/"

- id: bytedance-vendor-package-descriptor
  desc: ByteDance SDK class descriptor
  conf: 0.95
  if:
    type: text
    substr: "Lcom/bytedance/"

composite_rules:
- id: facebook-audience-network-dynamic-loader
  desc: Audience Network SDK loads its own DEX asset
  crit: exception
  conf: 0.97
  all:
  - id: micro-behaviors/os/application/target/advertising::facebook-audience-network-loader-class
  - id: micro-behaviors/os/application/target/advertising::facebook-audience-network-dex-asset

# Google's integrity VM client performs the dynamic DEX loading in the
# dexes that carry it; the surrounding descriptors are stock androidx code.
# The DroidGuard client atom is the canonical identity in well-known; the
# ads-mobile-sdk marker corroborates that the carrier is Google's SDK.
- id: google-play-integrity-dynamic-loader
  desc: Play-integrity DroidGuard module performs DEX loading
  crit: exception
  conf: 0.95
  all:
  - id: well-known/lib/vendor-sdk/google-mobile-ads::google-droidguard-client
  - id: well-known/lib/vendor-sdk/google-mobile-ads::google-mobile-ads-sdk

# ByteDance's APM and ads stack ships its own DEX loading, asset gzip
# handling, and classloader patching inside a dex that also carries the
# vendor descriptors.
- id: bytedance-apm-dynamic-loader
  desc: ByteDance APM/ads SDK performs DEX loading
  crit: exception
  conf: 0.95
  all:
  - id: micro-behaviors/os/application/target/advertising::bytedance-apm-package-descriptor
  - id: micro-behaviors/os/application/target/advertising::bytedance-vendor-package-descriptor

