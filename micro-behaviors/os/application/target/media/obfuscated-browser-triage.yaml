defaults:
  for:
  - html
  platforms:
  - windows
traits:
- id: packed-ierpctl-token
  desc: Packed IERPCtl control name
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: '|IERPCtl|'
    exclude_html_comments: true
- id: packed-stormplayer-token
  desc: Packed StormPlayer control name
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: '|StormPlayer|'
    exclude_html_comments: true
- id: percent-ierpctl-progid
  desc: Percent-escaped RealPlayer control ProgID
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: IERPCtl%2EIERPCtl%2E1
    exclude_html_comments: true
- id: percent-powerplayer-constructor
  desc: Percent-escaped PowerPlayer control reference
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: ActiveXObject%28%22POWERPLAYER%2EPowerPlayerCtrl%2E1
    exclude_html_comments: true
