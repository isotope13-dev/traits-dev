defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  # A service name, package name or key-search path can reference nginx
  # without creating an HTTP listener. Preserve the compound-name exclusion:
  # emby-nginx and plex-strm-nginx name other applications.
  - id: nginx-name-reference
    desc: References the nginx web server
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(?i)[a-z0-9-]*\bnginx\b'
    not:
      - regex: '(?i)[a-z0-9]-nginx'
    unless:
      - id: micro-behaviors/data/format/mime::mime-types-with-extension-map
