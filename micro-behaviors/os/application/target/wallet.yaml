defaults:
  platforms:
  - unix
  - windows
  for: [scripts, binaries]

traits:
- id: electrum-word
  desc: Electrum wallet keyword
  crit: notable
  conf: 0.5
  if:
    type: text
    word: electrum
- id: exodus-word
  desc: Exodus wallet keyword
  crit: notable
  conf: 0.5
  if:
    type: text
    word: exodus
- id: trezor-word
  desc: Trezor hardware wallet keyword
  crit: notable
  conf: 0.6
  # Czech BIP-39 uses trezor as the noun "vault", between trest and trhavina.
  # That fixed triple is the wordlist, not the hardware-wallet product.
  unless:
    - type: text
      substr: 'trest","trezor","trhavina'
    - type: text
      substr: "trest','trezor','trhavina"
  if:
    type: text
    word: trezor
composite_rules:
- id: wallet-app-name-cluster
  desc: Names several wallet products at once
  crit: notable
  conf: 0.9
  needs: 3
  any:
  - id: micro-behaviors/os/application/target::wallet-brand-metamask
  - id: micro-behaviors/os/application/target::electrum-word
  - id: micro-behaviors/os/application/target::exodus-word
  - id: micro-behaviors/os/application/target::trezor-word
  - id: micro-behaviors/os/application/target::phantom-wallet-word
