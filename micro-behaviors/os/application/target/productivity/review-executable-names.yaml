# Application-subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  crit: baseline
traits:
- id: office-apps-excel
  desc: References Excel executable or app bundle
  crit: notable
  conf: 0.5
  count_max: 2
  if:
    type: text
    regex: "(?i)\\b(excel\\.exe|/Applications/Microsoft Excel\\.app)\\b"
  not:
  - substr: file-excel
  unless:
  - type: text
    substr: application/vnd.ms-excel
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
- id: office-apps-powerpoint-soffice
  desc: Office app powerpnt
  crit: notable
  conf: 0.5
  if:
    type: text
    word: powerpnt
    case_insensitive: true
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
- id: office-apps-soffice
  desc: Office app soffice
  crit: notable
  conf: 0.5
  if:
    type: text
    word: soffice
    case_insensitive: true
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
- id: office-apps-outlook-onenote
  desc: Office app outlook
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\boutlook\\.exe\\b"
  unless:
  - type: text
    substr: application/vnd.ms-outlook
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
- id: office-apps-onenote
  desc: References OneNote executable or app
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\bonenote(\\.exe|\\.app|\\.desktop)\\b"
    case_insensitive: true
  unless:
  - id: metadata/document/office/container/
  - type: text
    substr: application/onenote
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
composite_rules:
- id: office-apps
  desc: Office/Productivity application names
  crit: notable
  conf: 0.5
  any:
  - id: micro-behaviors/os/application/target/productivity::winword-executable-name
  - id: micro-behaviors/os/application/target/productivity::office-apps-excel
  - id: micro-behaviors/os/application/target/productivity::office-apps-powerpoint-soffice
  - id: micro-behaviors/os/application/target/productivity::office-apps-soffice
  - id: micro-behaviors/os/application/target/productivity::office-apps-outlook-onenote
  - id: micro-behaviors/os/application/target/productivity::office-apps-onenote
