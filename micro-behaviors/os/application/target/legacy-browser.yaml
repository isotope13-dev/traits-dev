defaults:
  for: [html, javascript, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: hex-speech-findengine-method
    desc: Hex-encoded Speech FindEngine method reference
    if:
      type: text
      regex: '(?i)46696e64456e67["\sS=+]{0,20}696e65'
  - id: realplayer-browser-control-clsid
    desc: RealPlayer browser control CLSID reference
    if:
      type: text
      substr: '2F542A2E-EDC9-4BF7-8CB1-87C9919F7F93'
      case_insensitive: true
