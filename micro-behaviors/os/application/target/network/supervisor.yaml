# An application-name reference does not establish ownership or benign intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: livedesk-supervisor-name-reference
    desc: LiveDesk or dsh-supervisor name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(LiveDesk|dsh-supervisor)\b'
