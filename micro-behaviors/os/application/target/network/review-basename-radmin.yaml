# Application-subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  for:
  - pe
  - c
  - cpp
  - powershell
  - python
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000
traits:
- id: radmin-interface-executable-reference
  desc: References Radmin interface executable
  if:
    type: text
    regex: "(?i)\\bFamItrf(c|2)\\.exe\\b"
