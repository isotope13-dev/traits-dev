# Names the WeChat desktop client executable. A bare name is only a target
# reference; consumers must add the behavior directed at that client.
defaults:
  for: [python]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: wechat-client-executable-literal
    desc: Python source names WeChat.exe
    if:
      type: text
      substr: WeChat.exe

  - id: wechat-core-module-literal
    desc: JavaScript source names WeChat core DLL
    for: [javascript]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)wechatwin\.dll'
