defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript]
traits:
  - id: discord-client-binary-name
    desc: Discord client executable or prerelease name
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(discord(canary|ptb|\.exe)|Lightcord)\b'

  # A community invite link on a Discord host is not a client directory; the
  # host sits inside the match span so `not` can exclude it.
  - id: discord-client-install-path
    desc: Discord client directory path segment
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(stagehand\.dev|stacksjs\.com)?[/\\]discord([/\\ \t"''`]|$)'
      not:
        - stagehand.dev
        - stacksjs.com

composite_rules:
  - id: discord-client-name-reference
    desc: Discord client path or prerelease name
    crit: notable
    conf: 0.85
    any:
      - id: discord-client-binary-name
      - id: discord-client-install-path
