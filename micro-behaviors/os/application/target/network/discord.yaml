defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript]
traits:
  - id: discord-client-name-reference
    desc: Discord client path or prerelease name
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(discord(canary|ptb)|[/\\]discord([/\\]|\b)|\bdiscord\.exe\b|Lightcord)'
