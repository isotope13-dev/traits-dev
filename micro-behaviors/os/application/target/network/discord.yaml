defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript]
traits:
  - id: discord-client-name-reference
    desc: Discord client path or prerelease name
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(discord(canary|ptb|\.exe)|Lightcord)\b|(stagehand\.dev)?[/\\]discord([/\\\s"''`]|$)'
      not:
        - stagehand.dev
