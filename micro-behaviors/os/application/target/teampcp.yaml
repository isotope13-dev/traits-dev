# References to rival malware targets, not identity of the analyzed artifact.
defaults:
  platforms: [unix, windows]
  for: [shell, python, scripts, binaries, csharp]

traits:
  - id: teampcp-target-name
    desc: TeamPCP rival target name reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(TeamPCP|PCPCat|pcp_cat)\b'
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/llm-scanner/
