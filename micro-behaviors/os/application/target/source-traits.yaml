# Wallet product references. These identify a named application target;
# they do not identify the analyzed file as that application or its library.
defaults:
  crit: notable
  platforms: [windows, linux, macos]
  # Union of the coverage that was scattered across wallet-brands-{evm,
  # exchange,solana}: groups for binaries/scripts/source plus the standalone
  # markup and browser-extension container types those splits added.
  for: [binaries, scripts, source, html, chrome-manifest, crx, text, xpi]

traits:
  - crit: notable
    platforms:
    - unix
    - windows
    id: wallet-brand-metamask
    desc: MetaMask wallet brand reference
    if:
      type: text
      word: MetaMask
      case_insensitive: true
  - id: wallet-brand-phantom
    desc: Phantom wallet brand reference
    if:
      type: text
      regex: '(?i)\bPhantom\s+Wallet\b|\bphantom\.app\b'
  - id: wallet-brand-rabby
    desc: Rabby wallet brand reference
    if:
      type: text
      word: Rabby
      case_insensitive: true
  - id: wallet-brand-bitget
    desc: Bitget wallet brand reference
    if:
      type: text
      word: Bitget
      case_insensitive: true
  - id: wallet-brand-coinbase
    desc: Coinbase wallet brand reference
    if:
      type: text
      word: Coinbase
      case_insensitive: true
  - id: wallet-brand-solflare
    desc: Solflare wallet brand reference
    if:
      type: text
      word: Solflare
      case_insensitive: true
composite_rules:
  - id: wallet-brand-catalog
    desc: "References several wallet products"
    conf: 0.94
    for: [html, javascript, crx, xpi, zip, npm]
    any:
      - id: micro-behaviors/os/application/target::wallet-brand-metamask
      - id: micro-behaviors/os/application/target::wallet-brand-phantom
      - id: micro-behaviors/os/application/target::wallet-brand-rabby
      - id: micro-behaviors/os/application/target::wallet-brand-bitget
      - id: micro-behaviors/os/application/target::wallet-brand-coinbase
      - id: micro-behaviors/os/application/target::wallet-brand-solflare
      - id: micro-behaviors/os/application/target::tronlink-word
    needs: 3
