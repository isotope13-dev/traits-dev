# Electron command-line flag configuration via app.commandLine.appendSwitch.
# Headless or VM environments without hardware acceleration often crash
# Chromium's GPU process unless GPU acceleration or compositing is disabled;
# legitimate apps working around driver bugs do the same, so this stays a
# neutral capability. The consuming objective supplies any evasive context.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: electron-disable-gpu-switch
    desc: Appends Electron GPU-disable command switch
    conf: 0.88
    if:
      type: text
      regex: 'appendSwitch\s*\(\s*[''"]disable-gpu(-compositing|-sandbox)?[''"]\s*\)'
