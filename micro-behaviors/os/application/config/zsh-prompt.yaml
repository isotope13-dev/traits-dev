defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: zsh-precmd-hook-command
    desc: Zsh pre-prompt hook registration command
    if:
      type: literal
      regex: '(^|[;\n])\s*add-zsh-hook\s+precmd\s+[A-Za-z_][\w]*'
  - id: zsh-prompt-substitution-option
    desc: Enables zsh prompt command substitution
    if:
      type: literal
      regex: '(^|[;\n])\s*setopt\s+prompt_?subst\b'
