# Bind the registered instance callback to its implementation.
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  conf: 0.98
traits:
- id: wordpress-plugin-delete-link-removal
  desc: Plugin callback removes delete action link
  crit: notable
  if:
    type: tree-sitter
    language: php
    query: |-
      (
      (class_declaration body: (declaration_list
      (method_declaration body: (compound_statement
        (expression_statement (function_call_expression
          function: (name) @register
          arguments: (arguments
            . (argument [(string . (string_content) @hook .) (encapsed_string . (string_content) @hook .)])
            . (argument (array_creation_expression
              . (array_element_initializer (variable_name) @receiver)
              . (array_element_initializer [(string . (string_content) @callback .) (encapsed_string . (string_content) @callback .)]))))))))
      (method_declaration name: (name) @method parameters: (formal_parameters . (simple_parameter name: (variable_name) @input))
       body: (compound_statement
        (if_statement body: (compound_statement
         (unset_statement (subscript_expression (variable_name) @mutated
          [(string . (string_content) @action .) (encapsed_string . (string_content) @action .)]))))
        . (return_statement (variable_name) @returned) .)))) @policy
      (#eq? @register "add_filter")
      (#eq? @hook "plugin_action_links")
      (#eq? @receiver "$this")
      (#eq? @callback @method)
      (#eq? @input @mutated)
      (#eq? @input @returned)
      (#eq? @action "delete")
      )
- id: wordpress-plugin-update-response-removal
  desc: Plugin callback removes update offers
  crit: notable
  if:
    type: tree-sitter
    language: php
    query: |-
      (
      (class_declaration body: (declaration_list
      (method_declaration body: (compound_statement
        (expression_statement (function_call_expression
          function: (name) @register
          arguments: (arguments
            . (argument [(string . (string_content) @hook .) (encapsed_string . (string_content) @hook .)])
            . (argument (array_creation_expression
              . (array_element_initializer (variable_name) @receiver)
              . (array_element_initializer [(string . (string_content) @callback .) (encapsed_string . (string_content) @callback .)]))))))))
      (method_declaration name: (name) @method parameters: (formal_parameters . (simple_parameter name: (variable_name) @input))
       body: (compound_statement
        (if_statement body: (compound_statement
         (foreach_statement body: (compound_statement
          (if_statement body: (compound_statement
           (unset_statement (subscript_expression
            (member_access_expression object: (variable_name) @mutated name: (name) @field)
            (variable_name)))))))))
        . (return_statement (variable_name) @returned) .)))) @policy
      (#eq? @register "add_filter")
      (#eq? @hook "site_transient_update_plugins")
      (#eq? @receiver "$this")
      (#eq? @callback @method)
      (#eq? @input @mutated)
      (#eq? @input @returned)
      (#eq? @field "response")
      )
- id: wordpress-plugin-auto-update-approval
  desc: Plugin callback approves automatic updates
  crit: notable
  if:
    type: tree-sitter
    language: php
    query: |-
      (
      (class_declaration body: (declaration_list
      (method_declaration body: (compound_statement
        (expression_statement (function_call_expression
          function: (name) @register
          arguments: (arguments
            . (argument [(string . (string_content) @hook .) (encapsed_string . (string_content) @hook .)])
            . (argument (array_creation_expression
              . (array_element_initializer (variable_name) @receiver)
              . (array_element_initializer [(string . (string_content) @callback .) (encapsed_string . (string_content) @callback .)]))))))))
      (method_declaration name: (name) @method
       body: (compound_statement
        (if_statement body: (compound_statement
         (return_statement (boolean) @approval))))))) @policy
      (#eq? @register "add_filter")
      (#eq? @hook "auto_update_plugin")
      (#eq? @receiver "$this")
      (#eq? @callback @method)
      (#eq? @approval "true")
      )
- id: wordpress-plugin-auto-update-list-addition
  desc: Plugin callback adds automatic update entry
  crit: notable
  if:
    type: tree-sitter
    language: php
    query: |-
      (
      (class_declaration body: (declaration_list
      (method_declaration body: (compound_statement
        (expression_statement (function_call_expression
          function: (name) @register
          arguments: (arguments
            . (argument [(string . (string_content) @hook .) (encapsed_string . (string_content) @hook .)])
            . (argument (array_creation_expression
              . (array_element_initializer (variable_name) @receiver)
              . (array_element_initializer [(string . (string_content) @callback .) (encapsed_string . (string_content) @callback .)]))))))))
      (method_declaration name: (name) @method parameters: (formal_parameters . (simple_parameter name: (variable_name) @input))
       body: (compound_statement
        (if_statement body: (compound_statement
         (expression_statement (assignment_expression
          left: (subscript_expression . (variable_name) @mutated .)
          right: [(string . (string_content) @plugin .) (encapsed_string . (string_content) @plugin .)]))))
        . (return_statement (variable_name) @returned) .)))) @policy
      (#eq? @register "add_filter")
      (#eq? @hook "pre_update_site_option_auto_update_plugins")
      (#eq? @receiver "$this")
      (#eq? @callback @method)
      (#eq? @input @mutated)
      (#eq? @input @returned)
      (#match? @plugin "\\.php$")
      )
