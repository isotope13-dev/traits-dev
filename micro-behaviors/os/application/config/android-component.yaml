defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
traits:
  - id: dex-component-enable-call
    desc: Enables an Android component
    if:
      type: symbol
      kind: call
      exact: Landroid/content/pm/PackageManager;->setComponentEnabledSetting
      arg: {index: 1, kind: number, value: 1}
  - id: dex-component-disable-call
    desc: Disables an Android component
    if:
      type: symbol
      kind: call
      exact: Landroid/content/pm/PackageManager;->setComponentEnabledSetting
      arg: {index: 1, kind: number, value: 2}
  - id: dex-activity-component-name-call
    desc: DEX reads activity component name
    if:
      type: symbol
      kind: call
      exact: 'Landroid/app/Activity;->getComponentName'
