defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  size_max: 20000000
composite_rules:
  - id: chromium-headless-automation-flags
    desc: Chromium headless automation flags
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/os/application/config::chrome-disable-background-networking-flag
      - id: micro-behaviors/os/application/config::chromium-no-first-run-flag
    any:
      - id: well-known/lib/platform/browser-automation/frameworks::playwright-import
      - id: well-known/lib/platform/browser-automation/frameworks::playwright-require
      - id: micro-behaviors/os/application/control::python-chromium-launch-call
  - id: chromium-automation-launch-flags
    desc: Chromium automation launch flag set
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/application/config::chromium-remote-debugging-port
      - id: micro-behaviors/os/application/config::chromium-user-data-dir
      - id: micro-behaviors/os/application/config::chrome-disable-component-update-flag
