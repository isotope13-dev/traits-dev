defaults:
  platforms:
  - windows
  for:
  - html
  - vbs
  crit: notable
  conf: 0.97

composite_rules:
  - id: fragmented-regwrite-start-page
    desc: RegWrite targets a fragmented Start Page value
    near_lines: 0
    all:
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
      - id: micro-behaviors/os/registry/browser/reference::fragmented-ie-start-page
      - id: micro-behaviors/os/registry/browser/reference::fragmented-internet-explorer-path
