defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: shell-pidl-append
  desc: Append shell item ID
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: ILAppendID
- id: shell-pidl-clone-first
  desc: Clone first shell item
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: ILCloneFirst
- id: shell-pidl-combine
  desc: Combine shell item IDs
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: ILCombine
- id: shell-pidl-free
  desc: Free shell item list
  crit: notable
  conf: 0.93
  if:
    type: symbol
    exact: ILFree
- id: shell-pidl-get-next
  desc: Traverse shell item list
  crit: notable
  conf: 0.94
  if:
    type: symbol
    exact: ILGetNext
- id: shell-pidl-remove-last
  desc: Trim shell item list
  crit: notable
  conf: 0.94
  if:
    type: symbol
    exact: ILRemoveLastID
- id: shell-pidl-is-equal
  desc: Compare shell item lists
  crit: notable
  conf: 0.93
  if:
    type: symbol
    exact: ILIsEqual
- id: shell-pidl-is-parent
  desc: Test shell item parentage
  crit: notable
  conf: 0.94
  if:
    type: symbol
    exact: ILIsParent
- id: shell-instance-explorer
  desc: Mark process as Explorer
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: SHSetInstanceExplorer
- id: shell-localized-name
  desc: Shell localized name API
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: SHSetLocalizedName
composite_rules:
- id: shell-pidl-namespace-ops
  desc: Shell PIDL namespace manipulation
  crit: notable
  conf: 0.96
  any:
  - id: shell-pidl-append
  - id: shell-pidl-clone-first
  - id: shell-pidl-combine
  - id: shell-pidl-free
  - id: shell-pidl-get-next
  - id: shell-pidl-remove-last
  - id: shell-pidl-is-equal
  - id: shell-pidl-is-parent
  needs: 5
- id: explorer-shell-namespace-control
  desc: Explorer shell namespace control
  crit: suspicious
  conf: 0.97
  all:
  - id: shell-pidl-namespace-ops
  any:
  - id: micro-behaviors/fs/watch::explorer-change-registration
  - id: micro-behaviors/ui/graphics/icon::shell-icon-customization
  - id: micro-behaviors/fs/file/stat::shell-recycle-bin-query
  - id: micro-behaviors/ui/controls/drag-drop::shell-drag-drop
  - id: micro-behaviors/ui/controls/drag-drop::shell-drag-query-file
  - id: micro-behaviors/ui/dialog/prompt::browse-for-folder
  - id: shell-instance-explorer
  needs: 2
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: well-known/lib/platform/wine/
