defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: glib-selects-gnome-shell-user-theme
    desc: GLib command selects GNOME user theme
    if:
      type: symbol
      kind: call
      exact: GLib.spawn_command_line_async
      arg:
        index: 0
        kind: string
        regex: "^/bin/sh -c 'gsettings set org\\.gnome\\.shell\\.extensions\\.user-theme name "
