defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.92

traits:
  # The literals name secure settings; they do not by themselves prove that
  # the command was executed or that privileges were gained.
  - id: android-shell-set-accessibility-services
    desc: Shell sets enabled Accessibility services
    conf: 0.99
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+settings\s+|settings\s+)put\s+secure\s+enabled_accessibility_services\b'

  - id: android-shell-enable-accessibility
    desc: Shell enables Android Accessibility globally
    conf: 0.99
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+settings\s+|settings\s+)put\s+secure\s+accessibility_enabled\s+1\b'


  - id: android-source-set-accessibility-services
    desc: Accessibility service-list write literal
    conf: 0.99
    for: [java, kotlin, go, rust, c, cpp]
    if:
      type: literal
      kind: string
      regex: '^(cmd\s+settings\s+|settings\s+)put\s+secure\s+enabled_accessibility_services\b'

  - id: android-source-enable-accessibility
    desc: Accessibility global-enable write literal
    conf: 0.99
    for: [java, kotlin, go, rust, c, cpp]
    if:
      type: literal
      kind: string
      regex: '^(cmd\s+settings\s+|settings\s+)put\s+secure\s+accessibility_enabled\s+1\b'

composite_rules:
  - id: android-shell-accessibility-settings-enable
    desc: Shell enables a configured Accessibility service
    crit: notable
    conf: 0.995
    attack: T1417.001,T1548
    all:
      - id: android-shell-set-accessibility-services
      - id: android-shell-enable-accessibility

  - id: android-source-accessibility-settings-enable
    desc: Accessibility configure-and-enable literals
    crit: notable
    conf: 0.995
    attack: T1417.001,T1548
    for: [java, kotlin, go, rust, c, cpp]
    all:
      - id: android-source-set-accessibility-services
      - id: android-source-enable-accessibility

  - id: android-accessibility-settings-command-enable
    desc: Accessibility configure-and-enable literals
    crit: notable
    conf: 0.995
    attack: T1417.001,T1548
    for: [source, binaries]
    any:
      - id: android-shell-accessibility-settings-enable
      - id: android-source-accessibility-settings-enable
