defaults:
  for: [elf, macho, c, cpp]
  crit: baseline
  platforms: [unix]
traits:
  - id: getgid
    desc: Get group ID
    conf: 0.5
    if:
      type: symbol
      exact: getgid
  - id: getgid-text
    desc: Get group ID (text)
    conf: 0.5
    if:
      type: text
      regex: '\bgetgid\s*\('
  - id: getegid
    desc: Get effective group ID
    conf: 0.5
    if:
      type: symbol
      exact: getegid
  - id: getegid-text
    desc: Get effective group ID (text)
    conf: 0.5
    if:
      type: text
      regex: '\bgetegid\s*\('
  - id: geteuid
    desc: Get effective user ID
    conf: 0.5
    if:
      type: symbol
      exact: geteuid
  - id: geteuid-text
    desc: Get effective user ID (text)
    conf: 0.5
    if:
      type: text
      regex: '\bgeteuid\s*\('
  - id: getuid
    desc: Get user ID
    conf: 0.5
    if:
      type: symbol
      exact: getuid
  - id: getuid-text
    desc: Get user ID (text)
    conf: 0.5
    if:
      type: text
      regex: '\bgetuid\s*\('
  # The kernel-side entry-point names. Every BSD sys/syscallargs.h,
  # sys/sysproto.h and _libsys.h declares them, and Linux's syscall table
  # names them, so this is a neutral prototype reference. Kernel-privesc
  # composites reference it and add the kallsyms/backdoor evidence.
  - id: kernel-uid-gid-syscall-entrypoint-name
    desc: Names a kernel UID/GID syscall entry point
    conf: 0.82
    if:
      type: text
      regex: 'sys_get(uid|euid|gid|egid)'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/string/artifact::linux-syscall-note-license
      - id: metadata/lang/source::linux-kernel-header-source-path
