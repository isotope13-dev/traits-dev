defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.85

traits:
  - id: php-script-uid-query
    desc: PHP queries the script file owner UID
    if:
      type: symbol
      kind: call
      exact: getmyuid

  - id: php-script-gid-query
    desc: PHP queries the script file owner GID
    if:
      type: symbol
      kind: call
      exact: getmygid

  - id: php-user-record-query
    desc: PHP resolves user information from a UID
    if:
      type: symbol
      kind: call
      exact: posix_getpwuid

  - id: php-effective-uid-query
    desc: PHP queries the current process effective UID
    if:
      type: symbol
      kind: call
      exact: posix_geteuid
