defaults:
  platforms: [linux]
  for: [scripts, binaries, python, pyc, rust, go, c, cpp, elf]
  crit: notable
  conf: 0.9

traits:
  - id: proc-status-capability-mask
    desc: Reads CapEff from own proc status
    if:
      type: text
      regex: '(?i)/proc/self/status[\s\S]{0,180}\bCapEff\b|\bCapEff\b[\s\S]{0,180}/proc/self/status'
