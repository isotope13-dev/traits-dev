defaults:
  crit: notable
  for: [macho, dylib, c]
  platforms: [macos]
  attack: "T1548.004"
  conf: 0.85
traits:
- id: auth-copy-rights
  desc: "AuthorizationCopyRights API privilege check"
  if:
    type: symbol
    exact: "AuthorizationCopyRights"
composite_rules:
- id: auth-rights-request
  desc: Requests macOS authorization rights through Security.framework
  crit: notable
  all:
  - id: micro-behaviors/os/security/auth/session::auth-create
  - id: micro-behaviors/os/privilege/query::auth-copy-rights
