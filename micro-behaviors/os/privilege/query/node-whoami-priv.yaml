# Node exec/execSync runs `whoami /priv`, `/groups` or `/all`: queries the
# current token's privileges or group memberships.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: js-exec-whoami-privileges
    desc: Node exec queries whoami privileges
    crit: notable
    conf: 0.92
    attack: T1033,T1069.001
    if:
      type: text
      regex: \bexec(Sync)?\(\s*['"`]whoami\s+/(priv|groups|all)\b
