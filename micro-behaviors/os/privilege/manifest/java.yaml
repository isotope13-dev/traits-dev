# JAR manifest privilege declarations.
#
# `Permissions:` is the attribute the JRE reads when a JAR is launched through
# Java Web Start or the (now removed) browser plugin, and Java 7u51 onward
# refuses to run a JAR that omits it. `all-permissions` asks to execute outside
# the applet sandbox with full filesystem, network, process, and reflection
# rights; `sandbox` accepts the restricted environment.
#
# Signed desktop applications that ship as a JAR legitimately request
# all-permissions, so this is a privilege fact for triage rather than evidence
# of intent -- but it is also the request every signed-applet drive-by and
# every JAR-delivered RAT has to make, so pair it with the signing state from
# metadata/signed/trust-level and with the entry point in
# objectives/command-and-control/backdoor/loader/archive.
defaults:
  platforms: [unix, windows]
  for: [jar]
  crit: notable
  conf: 0.98

traits:
  - id: jar-all-permissions
    desc: JAR manifest requests all-permissions
    attack: "T1548"
    if:
      type: value
      path: jar.manifest.permissions
      exact: all-permissions
      case_insensitive: true

  - id: jar-sandbox-permissions
    desc: JAR manifest accepts sandboxed execution
    crit: baseline
    if:
      type: value
      path: jar.manifest.permissions
      exact: sandbox
      case_insensitive: true
