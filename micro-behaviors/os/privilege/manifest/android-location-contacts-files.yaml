defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-sensitive-access-permissions
    for: [android_apk, zip, java, kotlin, xml]
    desc: Android requests location, contact, file, and network access
    crit: notable
    conf: 0.98
    all:
      - id: metadata/permission/manifest::android-location-permission-reference
      - id: metadata/permission/storage::android-read-contacts-request
      - id: micro-behaviors/os/privilege/manifest::read-external-storage
      - id: metadata/permission/network::android-internet-permission-reference
