defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-sensitive-access-permissions
    for: [android_apk, zip, java, kotlin, xml]
    desc: Android requests location, contact, file, and network access
    crit: suspicious
    conf: 0.98
    unless:
      - id: well-known/app/system/android-x86::phonesky-system-app
      - id: well-known/app/communication/sms-forwarder/
      - id: well-known/app/communication/bluebubbles/
      - id: well-known/app/ai/coding-agent/openclaw::openclaw-android-source-tree
      - id: well-known/app/ai/coding-agent/openclaw::openclaw-android-theme-reference
      - id: metadata/package/testing/presence/manifest::android-example-manifest
      - id: well-known/lib/platform/expo/
    all:
      - id: micro-behaviors/os/privilege/manifest::read-location
      - id: metadata/permission/storage::android-read-contacts-request
      - id: micro-behaviors/os/privilege/manifest::read-external-storage
      - id: metadata/permission/network::android-internet-permission-reference
