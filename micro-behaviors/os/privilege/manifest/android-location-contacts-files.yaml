defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-sensitive-access-permissions
    for: [android_apk, zip, java, kotlin, xml]
    desc: Android requests location, contact, file, and network access
    crit: suspicious
    conf: 0.98
    unless:
      - id: well-known/app/system/android-x86::phonesky-system-app
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
      - id: metadata/package/testing/presence/manifest::android-example-manifest
    all:
      - id: micro-behaviors/os/privilege/manifest::read-location
      - id: micro-behaviors/os/privilege/manifest::read-contacts
      - id: micro-behaviors/os/privilege/manifest::read-external-storage
      - id: micro-behaviors/os/privilege/manifest::internet-access
    scope: outer
