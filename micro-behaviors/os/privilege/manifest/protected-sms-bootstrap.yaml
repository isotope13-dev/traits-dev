defaults:
  platforms: [android]
  for: [android_apk]

composite_rules:
  - id: bootstrapped-queued-sms-application
    desc: SMS send/read grants behind internal bootstrap and message queue
    crit: suspicious
    conf: 0.90
    all:
      - id: micro-behaviors/process/lifecycle/initialize::internal-base-application-bootstrap
      - id: micro-behaviors/communications/messaging/receive::queued-messaging-service
      - id: android-sms-phone-permission-cluster
      - id: read-sms-declared-grant
