# Binary AndroidManifest component declarations, read from the decoded
# element/attribute/value records. A component's binding permission names
# the privileged system role it asks to be bound into.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.97

traits:
  - id: axml-accessibility-service-binding
    desc: Manifest declares an accessibility service
    attack: T1453
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"service","attribute":"permission","value":"android.permission.BIND_ACCESSIBILITY_SERVICE"}'

  - id: axml-device-admin-receiver-binding
    desc: Manifest declares a device admin receiver
    attack: T1626.001
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"receiver","attribute":"permission","value":"android.permission.BIND_DEVICE_ADMIN"}'

  - id: axml-notification-listener-binding
    desc: Manifest declares a notification listener
    attack: T1517
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"service","attribute":"permission","value":"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"}'

  - id: axml-sms-deliver-action
    desc: Manifest handles SMS_DELIVER as default SMS app
    attack: T1636.004
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"action","attribute":"name","value":"android.provider.Telephony.SMS_DELIVER"}'

  - id: axml-home-category
    desc: Manifest registers a Home launcher activity
    attack: T1631
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"category","attribute":"name","value":"android.intent.category.HOME"}'

  - id: axml-device-admin-enabled-action
    desc: Manifest handles DEVICE_ADMIN_ENABLED action
    attack: T1624
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"action","attribute":"name","value":"android.app.action.DEVICE_ADMIN_ENABLED"}'

  - id: axml-uses-policy-wipe-data
    desc: Manifest requests USES_POLICY_WIPE_DATA
    attack: T1485
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.USES_POLICY_WIPE_DATA"}'

  - id: axml-access-superuser
    desc: Manifest requests ACCESS_SUPERUSER permission
    attack: T1548
    if:
      type: value
      path: android_xml.values[*]
      exact: '{"element":"uses-permission","attribute":"name","value":"android.permission.ACCESS_SUPERUSER"}'
