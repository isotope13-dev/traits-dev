defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  conf: 0.8
traits:
  - id: highest-available
    desc: Manifest requests highest available privileges
    crit: notable
    if:
      type: text
      regex: <requestedExecutionLevel level=['"]highestAvailable
      section: .rsrc
  - id: require-administrator
    desc: Embedded manifest literal requests administrator
    crit: notable
    if:
      type: text
      regex: <requestedExecutionLevel level=['"]requireAdministrator
      section: .rsrc
  - id: require-administrator-large-offset-raw
    desc: Raw admin-manifest literal beyond PE header
    crit: notable
    conf: 0.88
    size_min: 1000000
    if:
      type: raw
      regex: <requestedExecutionLevel level=['"]requireAdministrator['"] uiAccess=['"]false
      offset_range: [1048576, null]
  - id: require-administrator-large-pe-raw
    desc: Large PE contains raw admin-manifest literal
    crit: notable
    conf: 0.88
    for: [pe]
    size_min: 1000000
    if:
      type: raw
      regex: <requestedExecutionLevel level=['"]requireAdministrator
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  # Packers such as ASPack relocate the resource tree into their own section,
  # so the element-scoped twin above goes blind while the level attribute
  # itself survives. This deliberately drops the element prefix: the pattern
  # is distinct from every existing manifest matcher, and the attribute is
  # still the demand itself, wherever the packer stashed the manifest.
  - id: require-administrator-level-attribute
    desc: requireAdministrator execution-level attribute
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: level=['"]requireAdministrator
  - id: msi-embedded-require-administrator
    desc: MSI embedded manifest requires admin
    crit: suspicious
    conf: 0.9
    for: [oledoc, ole]
    if:
      type: text
      regex: <requestedExecutionLevel level=['"]requireAdministrator
  - id: auto-elevate
    desc: Auto-elevation manifest attribute
    crit: notable
    if:
      type: text
      regex: autoElevate.{0,20}true|<autoElevate>true
      case_insensitive: true
      section: .rsrc
    downgrade:
      any:
        - id: metadata/binary/vendor/
  - id: ui-access
    desc: Manifest requests UIAccess privileges
    crit: notable
    if:
      type: text
      regex: uiAccess=['"]true
      section: .rsrc
composite_rules:
  - id: admin-manifest
    desc: Manifest requests admin privileges
    conf: 0.9
    any:
      - id: highest-available
      - id: require-administrator
      - id: require-administrator-level-attribute
      - id: require-administrator-large-offset-raw
      - id: require-administrator-large-pe-raw
      - id: msi-embedded-require-administrator
