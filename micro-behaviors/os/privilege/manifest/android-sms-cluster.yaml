defaults:
  platforms: [android]

composite_rules:
  - id: android-sms-phone-permission-cluster
    for: [android_apk, zip, java, kotlin, xml]
    desc: Declares SMS send/receive with SMS or phone read permissions
    crit: notable
    conf: 0.95
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/manifest::send-sms-declared-grant
      - id: micro-behaviors/os/privilege/manifest::receive-sms-declared-grant
    any:
      - id: micro-behaviors/os/privilege/manifest::read-sms-declared-grant
      - id: micro-behaviors/os/privilege/manifest::read-phone-numbers
      - id: micro-behaviors/os/privilege/manifest::read-phone-state-declared-grant
    needs: 2
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-application
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-package
      # TextSecure (Signal's predecessor) is an SMS client: its whole purpose
      # is sending, receiving and reading messages, so the manifest grants the
      # full SMS cluster. Identity is the format-mandated package attribute
      # (member files) plus the source namespace (archive context), not a
      # renameable label.
      - id: well-known/app/communication/signal::textsecure-manifest-package
      - id: well-known/app/communication/signal::textsecure-android-archive-context
      - id: well-known/tool/development/mobile/expo::expo-quest-template-manifest

