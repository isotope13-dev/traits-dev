defaults:
  platforms: [android]
  for: [apk_android]
  crit: notable
  conf: 0.97

traits:
  - id: read-sms-apk-manifest-grant
    desc: Parsed APK grants SMS read
    attack: T1636.001
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.READ_SMS

  - id: send-sms-apk-manifest-grant
    desc: Parsed APK grants SMS send
    attack: T1636.004
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.SEND_SMS

  - id: receive-sms-apk-manifest-grant
    desc: Parsed APK grants SMS receive
    attack: T1636.004
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.RECEIVE_SMS

  - id: write-sms-apk-manifest-grant
    desc: Parsed APK grants SMS write
    attack: T1636.004
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.WRITE_SMS

  - id: read-contacts-apk-manifest-grant
    desc: Parsed APK grants contacts read
    attack: T1636.003
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.READ_CONTACTS

  - id: call-phone-apk-manifest-grant
    desc: Parsed APK grants outbound calls
    attack: T1636.002
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.CALL_PHONE

  - id: read-phone-state-apk-manifest-grant
    desc: Parsed APK grants phone state read
    attack: T1433
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.READ_PHONE_STATE

  - id: receive-boot-completed-apk-manifest-grant
    desc: Parsed APK grants boot completed
    attack: T1624.001
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.RECEIVE_BOOT_COMPLETED

  - id: read-call-log-apk-manifest-grant
    desc: Parsed APK grants call log read
    attack: T1636.002
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.READ_CALL_LOG

  - id: process-outgoing-calls-apk-manifest-grant
    desc: Parsed APK grants outgoing call watch
    attack: T1636.002
    if:
      type: value
      path: android.permissions[*]
      exact: android.permission.PROCESS_OUTGOING_CALLS

composite_rules:
  - id: read-sms-declared-grant
    desc: Android manifest grants SMS read in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/storage::android-read-sms-request
      - id: micro-behaviors/os/privilege/manifest::read-sms-apk-manifest-grant
  - id: send-sms-declared-grant
    desc: Android manifest grants SMS send in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/network::android-send-sms-request
      - id: micro-behaviors/os/privilege/manifest::send-sms-apk-manifest-grant
  - id: receive-sms-declared-grant
    desc: Android manifest grants SMS receive in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/network::android-receive-sms-request
      - id: micro-behaviors/os/privilege/manifest::receive-sms-apk-manifest-grant
  - id: write-sms-declared-grant
    desc: Android manifest grants SMS write in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/storage::android-write-sms-request
      - id: micro-behaviors/os/privilege/manifest::write-sms-apk-manifest-grant

  - id: read-contacts-declared-grant
    desc: Android manifest grants contacts read in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/storage::android-read-contacts-request
      - id: micro-behaviors/os/privilege/manifest::read-contacts-apk-manifest-grant
  - id: call-phone-declared-grant
    desc: Android manifest grants outbound call in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/network::android-call-phone-request
      - id: micro-behaviors/os/privilege/manifest::call-phone-apk-manifest-grant

  - id: read-phone-state-declared-grant
    desc: Android manifest grants phone state read in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/identity::android-read-phone-state-request
      - id: micro-behaviors/os/privilege/manifest::read-phone-state-apk-manifest-grant
  - id: receive-boot-completed-declared-grant
    desc: Android manifest grants boot completed receive in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/activation::android-receive-boot-completed-request
      - id: micro-behaviors/os/privilege/manifest::receive-boot-completed-apk-manifest-grant

  - id: read-call-log-declared-grant
    desc: Android manifest grants call log read in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/storage::android-read-call-log-request
      - id: micro-behaviors/os/privilege/manifest::read-call-log-apk-manifest-grant

  - id: process-outgoing-calls-declared-grant
    desc: Android manifest grants outgoing call monitor in any encoding
    crit: component
    conf: 0.97
    for: [apk_android, zip, xml, android_apk]
    scope: outer
    any:
      - id: metadata/permission/network::android-process-outgoing-calls-request
      - id: micro-behaviors/os/privilege/manifest::process-outgoing-calls-apk-manifest-grant
