      # whose enum put SEND_SMS/RECEIVE_SMS/READ_SMS/READ_PHONE_STATE and
      # SYSTEM_ALERT_WINDOW in classes.dex while the manifest declares only
      # READ/WRITE_EXTERNAL_STORAGE. Excluding the DEX copy loses no detection —
      # Android will not grant a permission the manifest omits, so a real
      # requester always carries the manifest declaration too.
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: read-phone-numbers
    desc: Android phone number permission
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "android.permission.READ_PHONE_NUMBERS"
    unless:
      # A permission name in a DEX string pool is a code reference, not a
      # grantable declaration: only AndroidManifest.xml makes it grantable, and
      # a runtime-permissions library compiles the full permission vocabulary in
      # as constants. material-dialogs' sample bundles com.afollestad.assent,
      # whose enum put SEND_SMS/RECEIVE_SMS/READ_SMS/READ_PHONE_STATE and
      # SYSTEM_ALERT_WINDOW in classes.dex while the manifest declares only
      # READ/WRITE_EXTERNAL_STORAGE. Excluding the DEX copy loses no detection —
      # Android will not grant a permission the manifest omits, so a real
      # requester always carries the manifest declaration too.
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: ignore-battery-optimizations
    desc: Android battery optimization exemption
    crit: notable
    conf: 0.92
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    if:
      type: text
      substr: "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"

  - id: bind-accessibility-service
    desc: Android accessibility binding permission
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "android.permission.BIND_ACCESSIBILITY_SERVICE"
    unless:
      # Android permission catalogs are also embedded in dependency DEX files;
      # only the manifest declaration grants this signature-level permission.
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: bind-input-method
    desc: Android input-method bind permission
    crit: notable
    conf: 0.94
    attack: T1417.001
    if:
      type: text
      substr: "android.permission.BIND_INPUT_METHOD"
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: device-admin-enabled-action
    desc: Android DEVICE_ADMIN_ENABLED action
    crit: notable
    conf: 0.92
    attack: T1624
    if:
      type: text
      substr: "android.app.action.DEVICE_ADMIN_ENABLED"

  - id: foreground-service-media-projection
    desc: Android media-projection service permission
    crit: notable
    conf: 0.94
    attack: T1113
    if:
      type: text
      substr: "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"

  - id: media-projection-service-type
    desc: Android mediaProjection foreground service type
    crit: notable
    conf: 0.94
    attack: T1113
    if:
