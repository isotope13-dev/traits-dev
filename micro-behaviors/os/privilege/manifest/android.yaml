defaults:
  platforms: [android]
  # Android manifests are scanned as the binary-XML leaves inside their
  # package, never as the package container itself -- cleave expands an APK
  # into members and does not content-scan the container's own bytes, so the
  # findings reach the APK by roll-up.  Permission names survive string
  # extraction with surrounding XML-table text, so substring matching is the
  # canonical form here.
  # In source manifests `not:` drops a matched element carrying the merger
  # `tools:node="remove"` directive: it strips the permission from the
  # built APK rather than requesting it.
  for: [xml]
  crit: notable
  conf: 0.86

traits:
  - id: device-admin-policy-resource
    desc: Android device admin policy
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "res/xml/adm_rit.xml"
      offset_range: [-262144, null]

  - id: device-admin-policy-member
    desc: Android device admin policy
    crit: notable
    conf: 0.88
    for: [android_apk, zip]
    if:
      type: value
      path: "archive.members[*].path"
      exact: res/xml/adm_rit.xml

  - id: read-external-storage
    desc: External storage read permission
    count_min: 1
    for: [dex, java, kotlin, xml]
    if:
      type: text
      substr: "android.permission.READ_EXTERNAL_STORAGE"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'

  - id: write-external-storage-utf16
    desc: External storage write permission
    attack: T1406
    for: [data]
    if:
      type: text
      substr: "WRITE_EXTERNAL"
    unless:
      - id: metadata/file/magic/identity::sqlite3

  - id: nfc-access
    desc: Android NFC permission
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "android.permission.NFC"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'

  - id: bind-device-admin-source
    desc: Device admin bind permission
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "android.permission.BIND_DEVICE_ADMIN"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'

  - id: device-admin-receiver-class
    desc: Android DeviceAdminReceiver class
    crit: notable
    conf: 0.92
    attack: T1624
    for: [xml, dex]
    if:
      type: text
      substr: "Landroid/app/admin/DeviceAdminReceiver;"

  - id: add-device-admin-action
    desc: Android ADD_DEVICE_ADMIN action
    crit: notable
    conf: 0.9
    attack: T1624
    for: [java, kotlin, xml, dex]
    if:
      type: text
      substr: "android.app.action.ADD_DEVICE_ADMIN"

  - id: bind-device-admin-utf16
    desc: Device admin bind permission
    crit: suspicious
    conf: 0.9
    for: [data]
    if:
      type: text
      substr: "BIND_DEVICE_AD"

  - id: kill-uid
    desc: Kill UID permission requested
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "android.permission.KILL_UID"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/permission/identity::android-platform-manifest-header

  - id: kill-uid-utf16
    desc: Kill UID permission requested
    crit: suspicious
    conf: 0.9
    for: [data]
    if:
      type: text
      substr: "KILL_UID"

  - id: manage-device-admins
    desc: Manage device admins permission
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "android.permission.MANAGE_DEVICE_ADMINS"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/permission/identity::android-platform-manifest-header

  - id: manage-device-admins-utf16
    desc: Manage device admins permission
    crit: suspicious
    conf: 0.9
    for: [data]
    if:
      type: text
      substr: "MANAGE_DEVICE"

  - id: react-native-debug-overlay-manifest
    desc: React Native overlay permission manifest
    crit: baseline
    conf: 0.95
    if:
      # Stock RN debug AndroidManifest.xml is a tiny overlay+cleartext stub with
      # this tools:ignore marker; release manifests that grant overlays do not.
      # Also matches React Native's own com.facebook.react library manifests.
      type: text
      regex: 'GoogleAppIndexingWarning|com\.facebook\.react'

  - id: retrieve-window-content
    desc: Android window content permission
    crit: suspicious
    conf: 0.88
    attack: T1411
    if:
      type: text
      substr: "android.permission.RETRIEVE_WINDOW_CONTENT"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/permission/identity::android-platform-manifest-header

  - id: bind-notification-listener
    desc: Android notification listener permission
    crit: notable
    conf: 0.94
    attack: T1517
    if:
      type: text
      substr: "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: notification-listener-service
    desc: Android notification listener service
    crit: notable
    conf: 0.93
    attack: T1517
    # The service descriptor is also the form the DEX string pool carries;
    # outer-APK text never contains it, so without dex the atom is blind
    # to the implementation inside the APK it describes.
    for: [xml, dex]
    if:
      type: text
      substr: "Landroid/service/notification/NotificationListenerService;"

  - id: package-usage-stats
    desc: Android usage stats permission
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "android.permission.PACKAGE_USAGE_STATS"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: query-all-packages
    desc: Android package query permission
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "android.permission.QUERY_ALL_PACKAGES"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: get-installed-apps
    desc: Android installed apps permission
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "android.permission.GET_INSTALLED_APPS"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: manage-external-storage
    desc: Android all files access permission
    crit: notable
    conf: 0.94
    attack: T1406
    if:
      type: text
      substr: "android.permission.MANAGE_EXTERNAL_STORAGE"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'

  - id: bind-accessibility-service-source
    desc: Android accessibility binding permission
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "android.permission.BIND_ACCESSIBILITY_SERVICE"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      # Android permission catalogs are also embedded in dependency DEX files;
      # only the manifest declaration grants this signature-level permission.
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: bind-input-method
    desc: Android input-method bind permission
    crit: notable
    conf: 0.94
    attack: T1417.001
    if:
      type: text
      substr: "android.permission.BIND_INPUT_METHOD"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: device-admin-enabled-action-source
    desc: Android DEVICE_ADMIN_ENABLED action
    crit: notable
    conf: 0.92
    attack: T1624
    if:
      type: text
      substr: "android.app.action.DEVICE_ADMIN_ENABLED"

  - id: foreground-service-media-projection
    desc: Android media-projection service permission
    crit: notable
    conf: 0.94
    attack: T1113
    if:
      type: text
      substr: "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'

  - id: media-projection-service-type
    desc: Android mediaProjection foreground service type
    crit: notable
    conf: 0.94
    attack: T1113
    if:
      type: text
      substr: 'foregroundServiceType="mediaProjection"'

  - id: dump-permission
    desc: XML requests Android DUMP permission
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # The span runs to the element end so `not:` sees a trailing directive.
      regex: '<uses-permission[^>]{0,96}android\.permission\.DUMP[^\w.>][^>]{0,96}'
    not:
      - regex: '[\w-]+:node\s*=\s*["'']remove(All)?["'']'

composite_rules:
  - id: bind-accessibility-service
    desc: Manifest declares an accessibility service
    crit: notable
    conf: 0.95
    any:
      - id: bind-accessibility-service-source
      - id: axml-accessibility-service-binding

  - id: bind-device-admin
    desc: Device admin bind permission
    crit: suspicious
    conf: 0.9
    any:
      - id: bind-device-admin-source
      - id: axml-device-admin-receiver-binding
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic
      - id: well-known/tool/development/mobile/expo::expo-quest-template-manifest
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/permission/identity::android-platform-manifest-header

  - id: device-admin-enabled-action
    desc: Android DEVICE_ADMIN_ENABLED action
    crit: notable
    conf: 0.92
    attack: T1624
    any:
      - id: device-admin-enabled-action-source
      - id: axml-device-admin-enabled-action

  # The device-admin policy descriptor by either surface: the adm_rit.xml
  # resource member in the package table, or the path string in scanned
  # dex/xml content.
  - id: device-admin-policy
    desc: Android device admin policy
    crit: notable
    conf: 0.88
    for: [android_apk, zip, xml, dex]
    any:
      - id: device-admin-policy-resource
      - id: device-admin-policy-member

