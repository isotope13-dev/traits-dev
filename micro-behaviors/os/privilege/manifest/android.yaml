      substr: 'foregroundServiceType="mediaProjection"'

  - id: dump-permission
    desc: Android signature-level DUMP permission request
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/app/system/android-x86::phonesky-system-app
      - id: well-known/app/system/android-x86::systemui-system-app
    if:
      type: text
      substr: "android.permission.DUMP"

  - id: custom-app-scoped-permission
    desc: Android app-scoped custom permission reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*){1,8}\.permission\.[A-Za-z0-9_.-]+\b'
