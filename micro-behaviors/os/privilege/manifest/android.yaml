defaults:
  platforms: [android]
  # Android manifests are scanned both as package containers and as the
  # binary-XML leaves inside those containers.  Permission names survive
  # string extraction with surrounding XML-table text, so substring matching
  # is the canonical form here.
  for: [apk, zip, xml]
  crit: notable
  conf: 0.86

traits:
  - id: request-install-packages-binary-manifest
    desc: Binary manifest requests package installation
    conf: 0.97
    attack: T1631
    if:
      type: hex
      pattern: '61 00 6E 00 64 00 72 00 6F 00 69 00 64 00 2E 00 70 00 65 00 72 00 6D 00 69 00 73 00 73 00 69 00 6F 00 6E 00 2E 00 52 00 45 00 51 00 55 00 45 00 53 00 54 00 5F 00 49 00 4E 00 53 00 54 00 41 00 4C 00 4C 00 5F 00 50 00 41 00 43 00 4B 00 41 00 47 00 45 00 53 00'

  - id: exported-application-component
    desc: Android manifest exports app component
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'android:exported\s*=\s*["'']true["'']'

  - id: device-admin-policy-resource
    desc: Android device admin policy
    crit: component
    conf: 0.88
    if:
      type: text
      substr: "res/xml/adm_rit.xml"
      offset_range: [-262144, null]

  - id: read-external-storage
    desc: External storage read permission
    count_min: 1
    if:
      type: text
      substr: "android.permission.READ_EXTERNAL_STORAGE"

  - id: write-external-storage
    desc: External storage write permission
    attack: T1406
    count_min: 1
    if:
      type: text
      substr: "android.permission.WRITE_EXTERNAL_STORAGE"

  - id: write-external-storage-utf16
    desc: External storage write permission
    attack: T1406
    for: [data]
    if:
      type: text
      substr: "WRITE_EXTERNAL"

  - id: internet-access
    desc: Android application requests network access
    crit: notable
    conf: 0.9
    attack: T1071
    if:
      type: text
      substr: "android.permission.INTERNET"

  - id: access-network-state
    desc: Android observes network connectivity state
    crit: notable
    conf: 0.9
    attack: T1071
    if:
      type: text
      substr: "android.permission.ACCESS_NETWORK_STATE"

  - id: read-contacts
    desc: Android application requests access to contacts
    crit: notable
    conf: 0.92
    attack: T1005
    if:
      type: text
      substr: "android.permission.READ_CONTACTS"

  - id: read-location
    desc: Android application requests location access
    crit: notable
    conf: 0.92
    attack: T1614.001
    if:
      type: text
      regex: 'android\.permission\.ACCESS_(FINE|COARSE)_LOCATION'

  - id: nfc-access
    desc: Android NFC permission
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "android.permission.NFC"

  - id: bind-device-admin
    desc: Device admin bind permission
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "android.permission.BIND_DEVICE_ADMIN"
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: device-admin-receiver-class
    desc: Android DeviceAdminReceiver class
    crit: notable
    conf: 0.92
    attack: T1624
    if:
      type: text
      substr: "Landroid/app/admin/DeviceAdminReceiver;"

  - id: add-device-admin-action
    desc: Android ADD_DEVICE_ADMIN action
    crit: notable
    conf: 0.9
    attack: T1624
    for: [apk, zip, xml, java, kotlin]
    if:
      type: text
      substr: "android.app.action.ADD_DEVICE_ADMIN"

  - id: bind-device-admin-utf16
    desc: Device admin bind permission
    crit: suspicious
    conf: 0.9
    for: [data]
    if:
      type: text
      substr: "BIND_DEVICE_AD"

  - id: kill-uid
    desc: Kill UID permission requested
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "android.permission.KILL_UID"

  - id: kill-uid-utf16
    desc: Kill UID permission requested
    crit: suspicious
    conf: 0.9
    for: [data]
    if:
      type: text
      substr: "KILL_UID"

  - id: manage-device-admins
    desc: Manage device admins permission
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "android.permission.MANAGE_DEVICE_ADMINS"

  - id: manage-device-admins-utf16
    desc: Manage device admins permission
    crit: suspicious
    conf: 0.9
    for: [data]
    if:
      type: text
      substr: "MANAGE_DEVICE"

  - id: react-native-debug-overlay-manifest
    desc: React Native debug overlay permission stub
    crit: baseline
    conf: 0.95
    if:
      # Stock RN debug AndroidManifest.xml is a tiny overlay+cleartext stub with
      # this tools:ignore marker; release manifests that grant overlays do not.
      # Attributes may be on one line or split across lines.
      type: text
      regex: 'tools:targetApi="28"\s+tools:ignore="GoogleAppIndexingWarning"'

  - id: system-alert-window
    desc: Android overlay window permission
    crit: suspicious
    conf: 0.9
    attack: T1411
    if:
      type: text
      substr: "android.permission.SYSTEM_ALERT_WINDOW"
    unless:
      # A permission name in a DEX string pool is a code reference, not a
      # grantable declaration: only AndroidManifest.xml makes it grantable, and
      # a runtime-permissions library compiles the full permission vocabulary in
      # as constants. material-dialogs' sample bundles com.afollestad.assent,
      # whose enum put SEND_SMS/RECEIVE_SMS/READ_SMS/READ_PHONE_STATE and
      # SYSTEM_ALERT_WINDOW in classes.dex while the manifest declares only
      # READ/WRITE_EXTERNAL_STORAGE. Excluding the DEX copy loses no detection —
      # Android will not grant a permission the manifest omits, so a real
      # requester always carries the manifest declaration too.
      - id: metadata/file/format/structured::dalvik-dex-magic
      - id: react-native-debug-overlay-manifest
      - type: text
        substr: 'com.facebook.react.devsupport.DevSettingsActivity'
      - type: text
        substr: 'OPTIONAL PERMISSIONS, REMOVE WHATEVER YOU DO NOT NEED'
      - type: text
        regex: '(?i)debug-only.{0,80}(manifest|capabilit)'
      # Expo development clients declare an exp+<project> URL scheme and use
      # the overlay permission for their developer UI. This is not a release
      # application's independent request for draw-over-other-apps authority.
      - type: text
        regex: '<data\s+android:scheme="exp\+[^"\s]{1,80}"\s*/>'

  - id: set-wallpaper
    desc: Android wallpaper change permission
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: "android.permission.SET_WALLPAPER"

  - id: retrieve-window-content
    desc: Android window content permission
    crit: suspicious
    conf: 0.88
    attack: T1411
    if:
      type: text
      substr: "android.permission.RETRIEVE_WINDOW_CONTENT"

  - id: bind-notification-listener
    desc: Android notification listener permission
    crit: notable
    conf: 0.94
    attack: T1517
    if:
      type: text
      substr: "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: notification-listener-service
    desc: Android notification listener service
    crit: notable
    conf: 0.93
    attack: T1517
    if:
      type: text
      substr: "Landroid/service/notification/NotificationListenerService;"

  - id: package-usage-stats
    desc: Android usage stats permission
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "android.permission.PACKAGE_USAGE_STATS"
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: query-all-packages
    desc: Android package query permission
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "android.permission.QUERY_ALL_PACKAGES"
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: get-installed-apps
    desc: Android installed apps permission
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "android.permission.GET_INSTALLED_APPS"
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: manage-external-storage
    desc: Android all files access permission
    crit: notable
    conf: 0.94
    attack: T1406
    if:
      type: text
      substr: "android.permission.MANAGE_EXTERNAL_STORAGE"

  - id: send-sms
    desc: Android SMS send permission
    conf: 0.9
    if:
      type: text
      substr: "android.permission.SEND_SMS"
    unless:
      # A permission name in a DEX string pool is a code reference, not a
      # grantable declaration: only AndroidManifest.xml makes it grantable, and
      # a runtime-permissions library compiles the full permission vocabulary in
      # as constants. material-dialogs' sample bundles com.afollestad.assent,
      # whose enum put SEND_SMS/RECEIVE_SMS/READ_SMS/READ_PHONE_STATE and
      # SYSTEM_ALERT_WINDOW in classes.dex while the manifest declares only
      # READ/WRITE_EXTERNAL_STORAGE. Excluding the DEX copy loses no detection —
      # Android will not grant a permission the manifest omits, so a real
      # requester always carries the manifest declaration too.
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: receive-sms
    desc: Android SMS receive permission
    conf: 0.9
    if:
      type: text
      substr: "android.permission.RECEIVE_SMS"
    unless:
      # A permission name in a DEX string pool is a code reference, not a
      # grantable declaration: only AndroidManifest.xml makes it grantable, and
      # a runtime-permissions library compiles the full permission vocabulary in
      # as constants. material-dialogs' sample bundles com.afollestad.assent,
      # whose enum put SEND_SMS/RECEIVE_SMS/READ_SMS/READ_PHONE_STATE and
      # SYSTEM_ALERT_WINDOW in classes.dex while the manifest declares only
      # READ/WRITE_EXTERNAL_STORAGE. Excluding the DEX copy loses no detection —
      # Android will not grant a permission the manifest omits, so a real
      # requester always carries the manifest declaration too.
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: read-sms
    desc: Android SMS read permission
    conf: 0.9
    if:
      type: text
      substr: "android.permission.READ_SMS"
    unless:
      # A permission name in a DEX string pool is a code reference, not a
      # grantable declaration: only AndroidManifest.xml makes it grantable, and
      # a runtime-permissions library compiles the full permission vocabulary in
      # as constants. material-dialogs' sample bundles com.afollestad.assent,
      # whose enum put SEND_SMS/RECEIVE_SMS/READ_SMS/READ_PHONE_STATE and
      # SYSTEM_ALERT_WINDOW in classes.dex while the manifest declares only
      # READ/WRITE_EXTERNAL_STORAGE. Excluding the DEX copy loses no detection —
      # Android will not grant a permission the manifest omits, so a real
      # requester always carries the manifest declaration too.
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: broadcast-sms
    desc: Android SMS broadcast permission declaration
    conf: 0.94
    if:
      type: text
      substr: "android.permission.BROADCAST_SMS"
    unless:
      - id: metadata/file/format/structured::dalvik-dex-magic

  - id: sms-manager-class
    desc: Android SmsManager class
    crit: notable
    conf: 0.9
    attack: T1636.004
    for: [apk, zip, xml, dex]
    if:
      type: text
      substr: "Landroid/telephony/SmsManager;"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

  - id: sms-inbox-provider
    desc: Android SMS inbox provider
    crit: notable
    conf: 0.9
    attack: T1636.004
    if:
      type: text
      substr: "Landroid/provider/Telephony$Sms$Inbox;"

  - id: read-phone-state
    desc: Android phone state permission
    conf: 0.88
    if:
      type: text
      substr: "android.permission.READ_PHONE_STATE"
    unless:
      # A permission name in a DEX string pool is a code reference, not a
      # grantable declaration: only AndroidManifest.xml makes it grantable, and
