defaults:
  platforms: [windows, unix]
  for: [scripts, pe]
  crit: notable
  conf: 0.9

traits:
  - id: license-validation-action
    desc: License validation action parameter
    if:
      type: text
      regex: 'action\s*[=:]\s*["''](validate|request)["'']'

  # The old `|Key` branch matched any `validateKey`/`verifyKey` helper — a cache,
  # crypto or map-key check has nothing to do with licensing.  Keep the license
  # spellings only.
  - id: license-validation-function
    desc: License validation function name
    if:
      type: text
      regex: '(?i)\b(verify|validate)License[A-Za-z0-9_$]*'
    unless:
      - id: well-known/lib/runtime/normalize-package-data::normalize-package-data-library

  - id: license-validation-label
    desc: License access validation label
    if:
      type: text
      regex: '(?i)validate\s+(access|license)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: license-cache-storage
    desc: Local license decision cache storage
    if:
      type: text
      regex: 'license(Cache|Permanent|CheckedAt)'

  - id: license-auth-state
    desc: Local license authorization state
    if:
      type: text
      regex: '(?i)(licen[cs]e.{0,60}isAuth|isAuth.{0,60}licen[cs]e)'
