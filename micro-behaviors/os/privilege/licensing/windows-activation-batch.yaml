defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.96

traits:
  - id: clipup-apply-genuine-ticket
    desc: Applies GenuineTicket data with ClipUp
    if:
      type: text
      regex: '(?i)\bclipup(\.exe)?\s+-v\s+-o\b'

  - id: clipsvc-genuine-ticket-path
    desc: References ClipSVC GenuineTicket storage
    if:
      type: text
      substr: Microsoft\Windows\ClipSVC\GenuineTicket
      case_insensitive: true
