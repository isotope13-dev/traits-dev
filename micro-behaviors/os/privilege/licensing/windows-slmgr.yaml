defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: slmgr-set-kms-host
    desc: slmgr.vbs sets Windows KMS host
    if:
      type: text
      regex: '(?i)slmgr\.vbs\s+/skms\b'

  - id: slmgr-activate-product
    desc: slmgr.vbs triggers Windows activation
    if:
      type: text
      regex: '(?i)slmgr\.vbs\s+/ato\b'

  - id: kms-sppsvc-service-stop
    desc: Stops Windows Software Protection service
    if:
      type: text
      regex: '(?i)\b(net|sc)(\.exe)?\s+stop\s+sppsvc\b'

  - id: kms-sppextcomobj-kill
    desc: Force-kills SppExtComObj licensing process
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b[^\r\n]{0,40}/im\s+"?SppExtComObj\.exe\b'

  - id: kms-emulator-service-banner
    desc: KMS Server Service Emulator banner
    for: [pe, dll]
    if:
      type: text
      regex: 'KMS Server (Service )?Emulator v?\d'

  - id: kms-activation-response-log
    desc: KMS activation response log
    for: [pe, dll]
    if:
      type: text
      substr: 'Activation response (KMS v'

  - id: sppextcomobj-licensing-target
    desc: Targets SppExtComObj licensing component
    for: [pe, dll, scripts]
    if:
      type: text
      regex: '(?i)\bSppExtComObj(\.exe|Hook\.dll|Patcher\.exe)\b'

  - id: secopatcher-dll-reference
    desc: References SECOPatcher licensing hook DLL
    for: [pe, dll, scripts]
    if:
      type: text
      substr: 'SECOPatcher.dll'
