# Office Software Protection Platform command lines (ospp.vbs).
# ospp.vbs ships inside an installed Microsoft Office and is the supported way
# to point a client at a KMS host and trigger activation, so the individual
# switches are neutral capabilities. Intent comes from the composites in
# objectives/evasion/security-bypass/licensing/, which additionally require the
# licensing kit to be redistributed by the analyzed package.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.93

traits:
  - id: ospp-set-kms-host
    desc: ospp.vbs sets the Office KMS host
    if:
      type: text
      regex: '(?i)ospp\.vbs\s+/sethst:'

  - id: ospp-activate-product
    desc: ospp.vbs triggers Office activation
    if:
      type: text
      regex: '(?i)ospp\.vbs\s+/act\b'
