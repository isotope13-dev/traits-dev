# API-name references are neutral. LSASS-directed impersonation is inferred
# by the objective composite, not by either name alone.
defaults:
  platforms: [windows]
  for: [powershell, html]
  crit: notable
  conf: 0.9
traits:
  - id: powershell-duplicate-token-text
    desc: PowerShell token duplication API-name text
    if:
      type: text
      regex: '(?i)DuplicateToken'
  - id: powershell-set-thread-token-text
    desc: PowerShell thread-token assignment API-name text
    if:
      type: text
      regex: '(?i)SetThreadToken'
