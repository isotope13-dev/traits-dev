composite_rules:
- for:
  - pe
  - dll
  id: token-spawn-api-chain-binary
  desc: Token-open, duplication and process-launch API references
  conf: 0.84
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
  all:
  - id: micro-behaviors/os/privilege/token::open-process-token
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex
  - id: micro-behaviors/process/create/exec::create-process-with-token
- for:
  - rust
  id: token-spawn-api-chain-source
  desc: Rust token-open, duplication and process-launch API references
  conf: 0.84
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
  all:
  - id: micro-behaviors/os/privilege/token::open-process-token-source
  - id: micro-behaviors/os/privilege/token::duplicate-token-ex-source
  - id: micro-behaviors/process/create/exec::create-process-with-token-source
- for:
  - pe
  - dll
  - rust
  id: token-spawn-api-chain
  desc: Token-open, duplication and process-launch API sets
  conf: 0.84
  any:
  - id: micro-behaviors/os/privilege/token::token-spawn-api-chain-binary
  - id: micro-behaviors/os/privilege/token::token-spawn-api-chain-source
- for:
  - pe
  - dll
  - rust
  id: token-spawn-privilege-adjust
  desc: Token launch and privilege-adjustment API references co-occur
  conf: 0.9
  all:
  - id: micro-behaviors/os/privilege/token::token-spawn-api-chain
  - id: micro-behaviors/os/privilege/token::privilege-adjustment-or-runas-api-references
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  downgrade:
    any:
    - id: metadata/package/license
    - id: metadata/signed/platform/
    - id: metadata/lang/compiled::autoit-compiled-script
defaults:
  platforms:
  - windows
  crit: notable
