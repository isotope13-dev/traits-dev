# SeBackupPrivilege name in scripts/source. PE imports live in traits.yaml
# (for: pe/dll); script stealers that enable backup reads need this atom.
defaults:
  platforms: [windows]
  for: [scripts, python, powershell, batch, cmd, rust, go, csharp]
  crit: notable
  attack: T1134.001

traits:
  - id: se-backup-privilege-name-source
    desc: SeBackupPrivilege name in source
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: SeBackupPrivilege
