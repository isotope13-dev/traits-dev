# Privilege 19 is SeShutdownPrivilege. VB source is matched as text because
# filefacts does not parse VB.NET/VB6 call sites.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vb-rtl-shutdown-privilege-call
    desc: VB enables shutdown privilege 19
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bRtlAdjustPrivilege\(\s*19\s*,\s*True\b'
