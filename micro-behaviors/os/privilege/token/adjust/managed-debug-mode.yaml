# Process.EnterDebugMode enables SeDebugPrivilege on the caller's token,
# which lets it open handles to other users' and SYSTEM processes. Debuggers
# and process managers use it too; the call is a capability, not intent.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
traits:
  - id: managed-enter-debug-mode-call
    desc: Calls Process.EnterDebugMode (SeDebugPrivilege)
    crit: notable
    conf: 0.98
    attack: T1134
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Process\.EnterDebugMode$'
