defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-rtl-shutdown-privilege-call
    desc: Calls RtlAdjustPrivilege for SeShutdownPrivilege
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|[.])_?RtlAdjustPrivilege$'
      arg:
        index: 0
        kind: number
        value: 19
