defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: rtl-adjust-privilege-name-reference
    desc: RtlAdjustPrivilege API name in code section
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: RtlAdjustPrivilege
      section: .text
    unless:
      - id: micro-behaviors/os/privilege/token/use::rtl-adjust-privilege
  - id: rtl-adjust-privilege-source-name
    for: [scripts, source]
    desc: RtlAdjustPrivilege API name in source
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      word: RtlAdjustPrivilege
    unless:
      - id: micro-behaviors/os/privilege/token/use::rtl-adjust-privilege
      - id: micro-behaviors/os/privilege/token/use::python-rtl-adjust-privilege-call
  - id: rtl-adjust-privilege-bytecode-name
    for: [pyc]
    desc: RtlAdjustPrivilege API name in bytecode
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: RtlAdjustPrivilege
    unless:
      - id: micro-behaviors/os/privilege/token/use::rtl-adjust-privilege
      - id: micro-behaviors/os/privilege/token/use::python-rtl-adjust-privilege-call
composite_rules:
  - id: privilege-adjust-api-any
    for: [binaries, scripts, source]
    desc: Calls or resolves Windows token privilege adjustment API
    crit: component
    conf: 0.9
    any:
      - id: rtl-adjust-privilege-name-reference
      - id: rtl-adjust-privilege-source-name
      - id: micro-behaviors/os/privilege/token/use::rtl-adjust-privilege
      - id: micro-behaviors/os/privilege/token/use::python-rtl-adjust-privilege-call
      - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges-any
