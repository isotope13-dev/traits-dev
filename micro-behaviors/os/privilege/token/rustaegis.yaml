defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1134.001

traits:
  - id: encrypted-open-process-token
    desc: Encrypted RustAegis OpenProcessToken ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 99 17 41 8b 64 bb df 44

  - id: encrypted-lookup-privilege-value
    desc: Encrypted RustAegis privilege lookup ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 3c da f1 32 98 17 e8 af

  - id: encrypted-adjust-token-privileges
    desc: Encrypted RustAegis token-adjustment ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 d9 4f f1 1f 46 e4 1e 57

  - id: encrypted-debug-privilege-name
    desc: Encrypted RustAegis SeDebugPrivilege ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 03 e6 25 56 dd b4 20 fd

composite_rules:
  - id: encrypted-debug-privilege-adjustment
    desc: RustAegis-protected code enables SeDebugPrivilege
    crit: notable
    conf: 0.99
    all:
      - id: encrypted-open-process-token
      - id: encrypted-lookup-privilege-value
      - id: encrypted-adjust-token-privileges
      - id: encrypted-debug-privilege-name
