# Token retargeting has legitimate service/admin uses. A linked process launch
# plus shell context warrants review, not a hostile token-theft claim.
defaults:
  platforms: [windows]
  for: [c, cpp]
  conf: 0.95
traits:
  - id: session-retargeted-token-process-launch
    desc: Launches using a session-retargeted token
    crit: notable
    if:
      type: tree-sitter
      query: |
        (compound_statement
         (expression_statement (call_expression
           function: (identifier) @set
           arguments: (argument_list (identifier) @token (identifier) @class (_) (_))))
         [
         (expression_statement (call_expression function: (identifier) @launch
          arguments: (argument_list (identifier) @launch_token)))
         (expression_statement (assignment_expression right: (call_expression function: (identifier) @launch
          arguments: (argument_list (identifier) @launch_token))))
         (if_statement condition: (parenthesized_expression (call_expression function: (identifier) @launch
          arguments: (argument_list (identifier) @launch_token))))
         ]
         (#eq? @set "SetTokenInformation")
         (#eq? @class "TokenSessionId")
         (#match? @launch "^CreateProcessAsUser[AW]$")
         (#eq? @token @launch_token)) @retarget
