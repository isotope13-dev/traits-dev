composite_rules:
- id: token-open-and-duplicate-apis
  desc: Opens and duplicates access tokens
  platforms: [windows]
  crit: notable
  conf: 0.86
  attack: T1134
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/privilege/token::open-process-token-any
  needs: 2
  any:
  - id: micro-behaviors/os/privilege/token::token-duplication-api
  - id: micro-behaviors/os/privilege/token::token-secondary-access-api
