defaults:
  platforms: [windows]
  for: [pe, dll, rust]
composite_rules:
  - id: privilege-adjustment-or-runas-api-references
    desc: Privilege adjustment or runas API references
    crit: notable
    conf: 0.82
    # These APIs do not establish a crossing to greater authority. Exports
    # and signatures do not change whether this capability is present.
    any:
      - id: lookup-privilege-value-any
      - id: adjust-token-privileges-any
      - id: rtl-adjust-privilege
      - id: micro-behaviors/os/privilege/elevation::runas-api-context
