defaults:
  platforms: [windows]
  for: [c, cpp, pe]

traits:
- id: se-security-privilege
  desc: SeSecurityPrivilege token-name reference
  crit: notable
  conf: 0.92
  for: [c, cpp]
  if:
    type: string_literal
    substr: SeSecurityPrivilege
- id: se-takeownership-privilege
  desc: SeTakeOwnershipPrivilege token-name reference
  crit: notable
  conf: 0.92
  for: [c, cpp]
  if:
    type: string_literal
    substr: SeTakeOwnershipPrivilege
- id: se-restore-privilege
  desc: SeRestorePrivilege token-name reference
  crit: notable
  conf: 0.92
  for: [c, cpp]
  if:
    type: string_literal
    substr: SeRestorePrivilege
composite_rules:
- id: privileged-token-setup-with-stale-cleanup
  desc: Token APIs and deferred cleanup references
  crit: notable
  conf: 0.95
  for: [c, cpp]
  all:
  - id: micro-behaviors/fs/delete/file/deferred::stale-contact-self-delete
  - id: micro-behaviors/os/privilege/token::open-process-token
  - id: micro-behaviors/os/privilege/token::lookup-privilege-value
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
- id: privileged-cleanup-self-delete
  for: [c]
  desc: Cleanup and multiple privilege-name references
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/fs/delete/file/deferred::stale-contact-self-delete
  - id: micro-behaviors/os/privilege/token::privileged-token-setup-with-stale-cleanup
  any:
  - id: micro-behaviors/os/privilege/token::se-restore-privilege
  - id: micro-behaviors/os/privilege/token::se-security-privilege
  - id: micro-behaviors/os/privilege/token::se-takeownership-privilege
  needs: 2
