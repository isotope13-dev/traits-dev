defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: notable
traits:
  - id: proxmox-root-api-token-provision
    desc: Proxmox provisions root API token
    crit: notable
    conf: 0.98
    for: [python]
    platforms: [linux]
    if:
      type: text
      regex: 'token_user\s*=\s*["'']root@pam["''][\s\S]{0,240}["'']pveum["''][\s\S]{0,160}["'']--privsep["'']'

  - id: get-token-information
    desc: GetTokenInformation API
    conf: 0.8
    if:
      type: symbol
      exact: "GetTokenInformation"
    unless:
      - id: metadata/binary/framework/
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: well-known/lib/platform/windows-vault/
  - id: open-process-token
    desc: OpenProcessToken API symbol
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: OpenProcessToken
  - id: beacon-use-token-api-declaration
    desc: Beacon BOF token-use API declaration
    crit: notable
    conf: 0.92
    attack: T1134.001
    for: [c, cpp]
    if:
      type: text
      regex: 'DECLSPEC_IMPORT\s+[^;\n]{0,120}\bBeaconUseToken\s*\('
  - id: query-session-user-token
    desc: Query interactive session access token
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: WTSQueryUserToken
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: duplicate-token
    desc: Duplicate a Windows access token
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: DuplicateToken
  - id: duplicate-token-ex
    desc: Duplicate a Windows token with extended options
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: DuplicateTokenEx
  - id: native-duplicate-token
    desc: Native Windows token duplication API
    crit: notable
    conf: 0.86
    if:
      type: symbol
      exact: ZwDuplicateToken
  - id: impersonate-named-pipe-client
    desc: Impersonate a named-pipe client
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: ImpersonateNamedPipeClient
  - id: dynamic-process-token-impersonation
    desc: Runtime token impersonation API pair
    crit: notable
    conf: 0.97
    attack: T1134.001
    if:
      type: text
      regex: (?i)OpenProcessToken.{0,96}ImpersonateLoggedOnUser
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/signed/leaf::microsoft-corporation
  - id: lookup-privilege-value
    desc: LookupPrivilegeValue API symbol
    conf: 0.75
    if:
      type: symbol
      regex: ^LookupPrivilegeValue[AW]$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
    downgrade:
      any:
        - id: metadata/binary/framework/
  - id: adjust-token-privileges
    desc: AdjustTokenPrivileges API symbol
    conf: 0.8
    if:
      type: symbol
      exact: AdjustTokenPrivileges
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
    downgrade:
      any:
        - id: metadata/binary/framework/
  - id: create-restricted-token
    desc: Create restricted access token
    crit: notable
    conf: 0.84
    if:
      type: text
      word: CreateRestrictedToken
    unless:
      - id: metadata/binary/framework/
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: high-risk-privilege-name
    desc: References high-risk Windows token privilege
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      regex: 'Se(Debug|Tcb|AssignPrimaryToken|Impersonate|LoadDriver)Privilege|SE_LOAD_DRIVER_NAME'
    unless:
      - id: well-known/app/system/drivers/nvidia::nvidia-windows-nvapi-context
  # The subset of the names above that a stock language runtime never asks for.
  # A self-contained .NET binary carries `SeDebugPrivilege` (System.Diagnostics
  # .Process) and `SeLockMemoryPrivilege` (the GC's large-pages option) in its
  # host's string pool whatever the program does; nothing in the runtime wants
  # to impersonate, assign a primary token, load a driver or hold SeTcb. Rules
  # that exempt an embedded runtime gate the exemption on this, so the exemption
  # cannot cover a managed program that reaches for real privilege.
  - id: high-risk-privilege-name-beyond-debug
    desc: High-risk privilege beyond SeDebug named
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      regex: 'Se(Tcb|AssignPrimaryToken|Impersonate|LoadDriver)Privilege'

  - id: high-risk-take-ownership-privilege-name
    desc: References SeTakeOwnershipPrivilege token
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp]
    if:
      type: text
      exact: SeTakeOwnershipPrivilege
  - id: logon-user
    desc: LogonUser credential token logon
    conf: 0.82
    if:
      type: text
      word: LogonUserW
    unless:
      - id: metadata/binary/framework/
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: rtl-adjust-privilege
    desc: Adjust privilege via ntdll
    crit: notable
    conf: 0.9
    attack: T1134.001
    if:
      type: symbol
      exact: RtlAdjustPrivilege
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: metadata/lang/source/
      - id: metadata/lang/source/
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: x64-enable-privilege-20-indirect-call
    desc: x64 sets privilege 20 before indirect call
    crit: component
    conf: 0.96
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: 45 33 C0 ?? ?? ?? ?? ?? ?? ?? B2 01 41 8D 48 14 FF 15
  - id: python-rtl-adjust-privilege-call
    desc: Python calls RtlAdjustPrivilege
    crit: notable
    conf: 0.9
    attack: T1134.001
    for: [python]
    if:
      type: symbol
      kind: call
      exact: RtlAdjustPrivilege
  - id: shutdown-privilege-name
    desc: Shutdown privilege name string
    # A name string is only partial evidence of privilege use; the API
    # traits below provide the actual token-adjustment behavior.
    crit: component
    conf: 0.78
    attack: T1134.001
    if:
      type: text
      word: SeShutdownPrivilege
    unless:
      - id: well-known/tool/sysadmin/sysinternals/
      - id: well-known/tool/sysadmin/sysinternals/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/binary/framework/
  - id: backup-privilege-name
    desc: Backup privilege name string
    crit: notable
    conf: 0.82
    attack: T1134.001
    if:
      type: text
      exact: SeBackupPrivilege
    unless:
      - id: metadata/library/generated::winmd-metadata
  - id: restore-privilege-name
    desc: Restore privilege name string
    crit: notable
    conf: 0.82
    attack: T1134.001
    if:
      type: text
      exact: SeRestorePrivilege
  - id: open-thread-token
    desc: Open thread access token
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      exact: OpenThreadToken
    unless:
      - id: well-known/lib/platform/windows-vault/
  - id: set-token-information
    desc: Modify access-token attributes
    crit: notable
    conf: 0.86
    attack: T1134
    if:
      type: symbol
      exact: SetTokenInformation
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: get-token-information-source
    desc: GetTokenInformation API in Rust source
    for: [rust]
    conf: 0.88
    if:
      type: text
      word: GetTokenInformation
  - id: open-process-token-source
    desc: OpenProcessToken API in Rust source
    for: [rust]
    crit: baseline
    conf: 0.85
    if:
      type: text
      word: OpenProcessToken
  - id: lookup-privilege-value-source
    desc: LookupPrivilegeValue API in Rust source
    for: [rust]
    conf: 0.85
    if:
      type: text
      substr: LookupPrivilegeValue
  - id: adjust-token-privileges-source
    desc: AdjustTokenPrivileges API in Rust source
    for: [rust]
    conf: 0.88
    if:
      type: text
      word: AdjustTokenPrivileges
  - id: open-thread-token-source
    desc: OpenThreadToken API in Rust source
    for: [rust]
    crit: baseline
    conf: 0.85
    if:
      type: text
      word: OpenThreadToken


  # The account SID of the token's user, named either through the token
  # information class, the .NET wrapper, or a literal machine-scoped SID.
  # Neutral: installers, ACL tooling, per-user path builders and licence code
  # all read it. Composites elsewhere use it as the host-binding input.
  - id: windows-user-sid-reference
    desc: References the Windows user account SID
    crit: notable
    conf: 0.9
    for: [scripts, source, data, pe, dll, elf]
    if:
      # Restricted to names that denote the *user's own SID value*. A bare
      # `SID` collides with session and server ids; `LookupAccountSid` and
      # `ConvertSidToStringSid` are worse still -- Go's x/sys/windows exports
      # both, so every Windows Go binary carries them.
      type: text
      regex: '(?i)TokenUser|UserSid|S-1-5-21-'

composite_rules:
  - id: rtl-enable-debug-privilege-x64
    desc: Calls RtlAdjustPrivilege to enable SeDebugPrivilege on x64
    crit: notable
    conf: 0.98
    all:
      - id: rtl-adjust-privilege
      - id: x64-enable-privilege-20-indirect-call
  - id: get-token-information-any
    desc: GetTokenInformation API reference
    crit: notable
    conf: 0.84
    any:
      - id: get-token-information
      - id: get-token-information-source
  - id: open-process-token-any
    desc: Open process access token
    crit: notable
    conf: 0.8
    any:
      - id: open-process-token
      - id: open-process-token-source
  - id: lookup-privilege-value-any
    desc: LookupPrivilegeValue API reference
    crit: notable
    conf: 0.8
    any:
      - id: lookup-privilege-value
      - id: lookup-privilege-value-source
  - id: adjust-token-privileges-any
    desc: AdjustTokenPrivileges API reference
    crit: notable
    conf: 0.82
    any:
      - id: adjust-token-privileges
      - id: adjust-token-privileges-source
  - id: open-thread-token-any
    desc: Open thread access token
    crit: baseline
    conf: 0.8
    any:
      - id: open-thread-token
      - id: open-thread-token-source
  - id: logon-privilege-api-cluster
    desc: Token logon and privilege API cluster
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: lookup-privilege-value
      - id: adjust-token-privileges
      - id: create-restricted-token
      - id: logon-user
    unless:
      - id: metadata/binary/framework/
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-symtab
