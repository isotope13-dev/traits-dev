defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: powershell-duplicate-token-call
    desc: PowerShell invokes basic token duplication
    if:
      type: text
      regex: '\$[A-Za-z_]\w*::DuplicateToken\s*\('
  - id: powershell-set-thread-token-call
    desc: PowerShell assigns a thread security token
    if:
      type: text
      regex: '\$[A-Za-z_]\w*::SetThreadToken\s*\('
  - id: powershell-duplicate-token-ex-call
    desc: PowerShell invokes extended token duplication
    if:
      type: text
      regex: '\$[A-Za-z_]\w*::DuplicateTokenEx\s*\('
  - id: powershell-impersonate-logon-token-call
    desc: PowerShell invokes logon-token impersonation
    if:
      type: text
      regex: '\$[A-Za-z_]\w*::ImpersonateLoggedOnUser\s*\('
composite_rules:
  - id: powershell-duplicate-assign-thread-token
    desc: PowerShell duplicates and assigns thread token
    crit: suspicious
    all:
      - id: powershell-duplicate-token-call
      - id: powershell-set-thread-token-call
  - id: powershell-duplicate-impersonate-logon-token
    desc: PowerShell duplicates and impersonates tokens
    crit: suspicious
    all:
      - id: powershell-duplicate-token-ex-call
      - id: powershell-impersonate-logon-token-call
