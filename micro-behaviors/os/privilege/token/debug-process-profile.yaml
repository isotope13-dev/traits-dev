defaults:
  platforms: [windows]

composite_rules:
- id: debug-privilege-process-access
  desc: Debug-privilege and process-access API set
  crit: notable
  conf: 0.95
  attack: T1134.001
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
  - id: micro-behaviors/os/privilege/token::open-process-token-any
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
  - id: micro-behaviors/process/attach/rights::open-process
  any:
  - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
  - id: micro-behaviors/process/terminate/kill::terminate-process
