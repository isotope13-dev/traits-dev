defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: nt-impersonate-thread-source
    desc: NtImpersonateThread API reference in PowerShell
    if:
      type: text
      word: NtImpersonateThread
  - id: nt-thread-impersonation-token-call
    desc: NtSetInformationThread impersonation token call
    for: [c, cpp, csharp, rust, go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)SetInformationThread$'
      arg:
        index: 1
        kind: identifier
        name: ThreadImpersonationToken
