# Managed code that binds advapi32 token APIs to delegates at runtime
# instead of [DllImport] leaves no import symbol; the API name survives only
# as a delegate field or type name such as _DuplicateTokenEx or
# OpenProcessTokenDelegate. These match that metadata form.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.88

traits:
  - id: managed-open-process-token-binding
    desc: Managed OpenProcessToken binding name
    if:
      type: text
      regex: '\b_?OpenProcessToken(Delegate)?\b'

  - id: managed-duplicate-token-ex-binding
    desc: Managed DuplicateTokenEx binding name
    if:
      type: text
      regex: '\b_?DuplicateTokenEx(Delegate)?\b'

  - id: managed-thread-impersonation-binding
    desc: Managed thread-token impersonation binding
    if:
      type: text
      regex: '\b_?(SetThreadToken|ImpersonateLoggedOnUser)(Delegate)?\b'
