# The literal "Local admin" as a whole string: a label a program reports for
# an elevated token. Exact match so LAPS-style "Local admin password" UI text
# does not count.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: local-admin-privilege-label
    desc: Literal "Local admin" privilege label
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: Local admin
