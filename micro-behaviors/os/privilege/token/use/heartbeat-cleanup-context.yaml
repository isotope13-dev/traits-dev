defaults:
  platforms: [windows]
  for: [c, cpp, pe]

composite_rules:
- id: privileged-token-setup-with-stale-cleanup
  desc: Token APIs and deferred cleanup references
  crit: notable
  conf: 0.95
  for: [c, cpp]
  all:
  - id: micro-behaviors/fs/delete/file/deferred::stale-contact-self-delete
  - id: micro-behaviors/os/privilege/token/use::open-process-token
  - id: micro-behaviors/os/privilege/token/use::lookup-privilege-value
  - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
- id: privileged-cleanup-self-delete
  for: [c]
  desc: Cleanup and multiple privilege-name references
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/fs/delete/file/deferred::stale-contact-self-delete
  - id: micro-behaviors/os/privilege/token/use::privileged-token-setup-with-stale-cleanup
  any:
  - id: micro-behaviors/os/privilege/reference::se-restore-privilege
  - id: micro-behaviors/os/privilege/reference::se-security-privilege
  - id: micro-behaviors/os/privilege/reference::se-takeownership-privilege
  needs: 2
