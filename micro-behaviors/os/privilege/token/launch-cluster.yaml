composite_rules:
- id: privilege-adjustment-user-launch-api-set
  desc: Token adjustment and user-launch API references
  crit: notable
  conf: 0.96
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/privilege/token::open-process-token
  - id: micro-behaviors/os/privilege/token::lookup-privilege-value
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  any:
  - id: micro-behaviors/process/create/sudo::create-process-as-user
  - id: micro-behaviors/process/create/sudo::create-process-with-token
  needs: 1
  platforms:
  - windows
