# References and API co-occurrence do not establish bound data flow.
defaults:
  platforms:
  - windows
  crit: notable
composite_rules:
- for:
  - pe
  - dll
  - rust
  id: winlogon-token-spawn-api-cooccurrence
  desc: Winlogon name beside token-launch and privilege APIs
  conf: 0.97
  all:
  - id: micro-behaviors/os/privilege/token::token-spawn-api-chain
  - id: micro-behaviors/process/info/name::winlogon-executable-reference
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  any:
  - id: micro-behaviors/os/privilege/token::token-privilege-adjustment-references
  - id: micro-behaviors/os/privilege/token::rust-token-privilege-adjustment
  needs: 1
  unless:
  - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
- for:
  - rust
  id: rust-token-privilege-adjustment
  desc: Rust token privilege adjustment API references
  conf: 0.9
  all:
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  - id: micro-behaviors/os/privilege/token::open-process-token-source
  - id: micro-behaviors/os/privilege/token::lookup-privilege-value-source
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-source
