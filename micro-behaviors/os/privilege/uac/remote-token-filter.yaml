# Changing remote UAC token filtering is an administrative capability, not proof of pass-the-hash.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell, csharp]
composite_rules:
  - id: localaccount-token-filter-powershell-set
    desc: Disables remote UAC filtering through PowerShell
    crit: suspicious
    conf: 0.97
    # The Set-ItemProperty leg is PowerShell-only.
    for: [powershell]
    all:
      - id: "micro-behaviors/os/registry/keys/policy::localaccount-token-filter-policy-name"
      - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
      - id: micro-behaviors/process/argument/option::powershell-value-one-option
    near_lines: 1
  - id: localaccount-token-filter-reg-set
    for: [batch, csharp, powershell]
    desc: Disables remote UAC filtering through reg.exe
    crit: suspicious
    conf: 0.97
    all:
      - id: "micro-behaviors/os/registry/keys/policy::localaccount-token-filter-policy-name"
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/process/argument/option::reg-data-one-option
    near_lines: 1
  - id: localaccount-token-filter-set
    desc: Disables UAC filtering for remote administrators
    crit: suspicious
    conf: 0.97
    any:
      - id: localaccount-token-filter-powershell-set
      - id: localaccount-token-filter-reg-set
