defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.98
traits:
  - id: batch-runas-trustlevel
    desc: Program launch at a chosen trust level
    if:
      type: text
      exclude_comments: true
      regex: '(?im)^\s*"?runas(\.exe)?"?\s+.{0,160}/trustlevel:0x[0-9a-f]{1,8}\s+"?[^"\s]'
