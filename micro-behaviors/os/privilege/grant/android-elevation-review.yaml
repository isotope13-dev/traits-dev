defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.92

traits:
  - id: android-pm-grant-command
    desc: Android pm grant shell command
    for: [source, scripts, binaries]
    if:
      type: text
      regex: '(?i)\bpm\s+grant\b'

  - id: android-pm-grant-argv
    desc: Android pm grant argv call
    if:
      type: text
      regex: '(?i)"pm"\s*,\s*"grant"'

composite_rules:
  - id: android-pm-grant
    desc: Android permission grant operation
    for: [source, scripts, binaries]
    any:
      - id: android-pm-grant-command
      - id: android-pm-grant-argv
