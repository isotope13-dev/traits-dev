defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.92

traits:
  - id: android-pm-grant-command
    desc: Android pm grant shell command
    for: [source, scripts, binaries]
    if:
      type: text
      regex: '(?i)\bpm\s+grant\b'

  - id: android-pm-grant-argv
    desc: Android pm grant argv call
    if:
      type: text
      regex: '(?i)"pm"\s*,\s*"grant"'

composite_rules:
  - id: android-pm-grant
    desc: Android permission grant operation
    for: [source, scripts, binaries]
    any:
      - id: android-pm-grant-command
      - id: android-pm-grant-argv

  # Local Wireless ADB pairing + Accessibility enablement + pm grant also
  # appears in developer provisioning tools; keep the capability notable here
  # and convict in objectives/ when combined with spyware abuse signals.
  - id: android-wireless-adb-accessibility-permission-grant
    desc: Wireless ADB enables Accessibility and grants permissions
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request
      - id: micro-behaviors/os/application/desktop-settings::android-shell-accessibility-settings-enable
      - id: android-pm-grant-command
    any:
      - id: micro-behaviors/communications/socket/tcp::android-wireless-adb-services
      - id: micro-behaviors/communications/socket/tcp::adb-spake2-pairing-protocol
