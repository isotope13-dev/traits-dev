defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.92

traits:
  - id: android-dpm-set-active-admin-command
    desc: Android dpm active-admin command
    for: [java, kotlin, dex, elf]
    if:
      type: text
      regex: '(?i)(\bdpm\s+set-active-admin\b|"dpm"\s*,\s*"set-active-admin")'
