defaults:
  crit: notable
  platforms:
  - unix
  for:
  - javascript
  - typescript
traits:
- id: operator-write-scope-append
  desc: Appends the operator.write scope
  conf: 0.99
  platforms:
  - unix
  - windows
  if:
    type: tree-sitter
    language: typescript
    kind: call
    regex: (?i)\b(push|append)\s*\(\s*["']operator\.write["']
- id: operator-write-spread-add
  desc: Adds operator.write through array spread
  conf: 0.98
  platforms:
  - unix
  - windows
  if:
    type: text
    regex: \.\.\.[\s\S]{0,80}["']operator\.write["']
