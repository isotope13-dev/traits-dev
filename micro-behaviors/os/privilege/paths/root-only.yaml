defaults:
  for: [scripts, binaries, c, cpp, objc, elf, macho, java, class, kotlin]
  platforms:
  - unix
  crit: notable
  conf: 0.9
traits:
# Both legs below are SOURCE-shaped: they require an `open(`/`fopen(`/`Path(` token
# adjacent to the path. A compiled binary has no such text -- `/etc/shadow` sits in
# .rodata on its own -- so for the elf/macho/class/kotlin types in `for:` above,
# `etc-shadow` can never match. Verified by compiling a shadow dumper
# (`fopen("/etc/shadow")` + `getspent`/`getspnam` + `crypt_r`): cleave reports only
# getspnam and fopen, no shadow-path trait, and `/etc/shadow` IS present as a string.
# Consequence: objectives/credential-access/dump/system::shadow-extraction is
# `for: [elf]` and takes `etc-shadow` as its primary `any:` leg, so that rule is
# dead-ended for the /etc/shadow case it exists to catch (only the /etc/gshadow leg
# can fire). The source matchers remain deliberately call-shaped and line-bounded.
# A binary-appropriate leg (the bare `/etc/shadow`
# string) makes shadow-extraction live for ELF, and it would then fire on every
# PAM-linked system binary -- unix_chkpwd, passwd, chage, login, su, sudo, sshd, cron
# all reference /etc/shadow with getspnam. The benign guard on shadow-extraction
# currently recognises shadow-utils BASENAMES only, which does not cover that class,
# so reviving the leg needs a real benign model for PAM consumers first.
- id: etc-shadow-access-call-before
  desc: Access call preceding /etc/shadow path
  crit: component
  if:
    type: text
    regex: '(?i)(open|fopen|Path)[ \t]*\([^\n]{0,80}/etc/shadow'
  unless:
  - type: text
    regex: DANGEROUS_PATTERNS
  - type: text
    regex: BLOCKED_TOOLS
  - id: metadata/file/catalog/identity/
- id: etc-shadow-access-call-after
  desc: Access call following /etc/shadow path
  crit: component
  if:
    type: text
    regex: '(?i)/etc/shadow[^\n]{0,80}(open|fopen|Path)[ \t]*\('
  unless:
  - type: text
    regex: DANGEROUS_PATTERNS
  - type: text
    regex: BLOCKED_TOOLS
  - id: metadata/file/catalog/identity/
- id: etc-shadow-path-bytes
  desc: Embedded bytes for the /etc/shadow path
  for: [class, jar, zip]
  # RPM headers can contain Lua maintainer scripts. Their raw strings are
  # scanned alongside archive members, but are not JVM bytecode; without this
  # guard a normal system-user package looks like Java account-file access.
  unless:
  - id: metadata/package/files/system-package::rpm-package-metadata
  if:
    type: hex
    pattern: 2F 65 74 63 2F 73 68 61 64 6F 77
- id: jvm-root-uid-passwd-bytes
  desc: Root UID passwd entry bytes
  for: [class, java_class, jar]
  # See the RPM-header exclusion on etc-shadow-path-bytes above. This byte
  # fragment is meaningful for JVM class/archive content, not package
  # scriptlet text embedded in an RPM header.
  unless:
  - id: metadata/package/files/system-package::rpm-package-metadata
  if:
    type: hex
    pattern: 3A 78 3A 30 3A 30 3A
- id: proc-mem
  desc: /proc/*/mem memory access
  if:
    type: text
    regex: /proc/[^/]{1,20}/mem
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - type: text
    substr: /proc/self/
- id: dev-kmem
  desc: /dev/kmem kernel memory access
  if:
    type: text
    exact: /dev/kmem
- id: boot-vmlinuz
  desc: /boot/vmlinuz kernel image
  if:
    type: text
    substr: /boot/vmlinuz
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: metadata/document/html/
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: boot-initrd
  desc: /boot/initrd initial ramdisk
  if:
    type: text
    substr: /boot/initrd
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: sys-kernel-debug-path
  desc: References /sys/kernel/debug/ debugfs path
  if:
    type: text
    substr: /sys/kernel/debug/
  unless:
  - id: metadata/lang/source::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: sys-kernel-security
  desc: /sys/kernel/security/ LSM access
  if:
    type: text
    substr: /sys/kernel/security/
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
composite_rules:
- id: etc-shadow
  desc: /etc/shadow password file access
  crit: notable
  conf: 0.98
  any:
  - id: etc-shadow-access-call-before
  - id: etc-shadow-access-call-after
- id: root-access
  desc: Root-only path access
  conf: 1.0
  any:
  - id: etc-shadow
  - id: etc-shadow-path-bytes
  - id: proc-mem
  - id: dev-kmem
  - id: boot-vmlinuz
  - id: boot-initrd
  - id: sys-kernel-debug-path
  - id: sys-kernel-security
