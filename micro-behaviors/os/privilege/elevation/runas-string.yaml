defaults:
  platforms: [windows]
  for: [pe, dll, scripts, rust]
traits:
  - id: runas-string
    desc: References the Windows ShellExecute runas verb
    crit: notable
    conf: 0.9
    if:
      type: text
      word: runas
    unless:
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  # ShellExecute "runas" verb is often a lone wide string adjacent to schtasks
  # args; keep an exact-token atom so PE loaders still match when word
  # boundaries are ambiguous across UTF-16 extractions.
  - id: runas-verb-token
    desc: Exact runas ShellExecute verb token
    crit: notable
    conf: 0.92
    for: [pe, dll]
    if:
      type: text
      exact: runas
    unless:
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
  - id: runas-verb
    desc: PowerShell RunAs verb requests elevation
    crit: notable
    conf: 0.9
    for: [powershell, batch, javascript, typescript]
    if:
      type: text
      regex: '(?i)-Verb\s+RunAs\b'

composite_rules:
  # `oShellApp.ShellExecute cmd, args, "", "runas", 1` is the documented way a
  # script asks for a UAC prompt and relaunches itself elevated. Microsoft's own
  # OffScrub uninstaller elevates exactly like this, and so does a WSH dropper
  # that wants admin -- the elevation *request* is the observable, and the
  # composites that infer abuse add the hidden-window / obfuscation legs.
  - id: wsh-shellexecute-runas
    desc: WSH ShellExecute relaunch requests runas elevation
    crit: notable
    conf: 0.93
    attack: T1548.002
    for: [vbs, javascript]
    all:
      - id: runas-string
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-method-call
    near_lines: 2
  - id: runas-elevation-token
    desc: Windows runas elevation token present
    crit: notable
    conf: 0.9
    any:
      - id: runas-string
      - id: runas-verb-token
  - id: shell-execute-runas
    desc: ShellExecute requests runas elevation
    crit: notable
    conf: 0.92
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/create/exec::shell-execute-ex
      - id: runas-elevation-token
