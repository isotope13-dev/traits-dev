defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, scripts, rust]
traits:
  - id: runas-string
    desc: Windows runas account or elevation reference
    conf: 0.9
    if:
      type: text
      # "runas" is also an ordinary word (Portuguese/Spanish "runas", runes),
      # so require an elevation-context neighbor on the same line: the CLI
      # form or a ShellExecute-style call site. A lone PE string-table token
      # stays covered by runas-verb-token below; PowerShell -Verb RunAs by
      # the runas-verb atom.
      regex: '(?i)runas\s+/user|shellexecute[^\n]{0,40}["'']?runas|runas[^\n]{0,30}(elevat|uac|admin)'
    unless:
      - id: well-known/lib/web/authoring/syntaxhighlighter::prismjs-package-reference
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  # ShellExecute "runas" verb is often a lone wide string adjacent to schtasks
  # args; keep an exact-token atom so PE loaders still match when word
  # boundaries are ambiguous across UTF-16 extractions.
  - id: runas-verb-token
    desc: Exact runas ShellExecute verb token
    conf: 0.92
    for: [pe, dll]
    if:
      type: text
      exact: runas
    unless:
      - id: well-known/lib/web/authoring/syntaxhighlighter::prismjs-package-reference
  - id: runas-verb
    desc: PowerShell RunAs elevation option text
    conf: 0.9
    for: [powershell, batch, javascript, typescript, pe, dll]
    if:
      type: text
      regex: '(?i)-Verb\s+RunAs\b'
  - id: shellexecute-quoted-runas-verb
    desc: ShellExecute argument is the runas verb
    conf: 0.93
    for: [vbs, javascript, html]
    if:
      type: text
      regex: '(?i)\.ShellExecute\b[^\n]{0,900},\s*["'']runas["'']'

composite_rules:
  # `oShellApp.ShellExecute cmd, args, "", "runas", 1` is the documented way a
  # script asks for a UAC prompt and relaunches itself elevated. Microsoft's own
  # OffScrub uninstaller elevates exactly like this, and so does a WSH dropper
  # that wants admin -- the elevation *request* is the observable, and the
  # composites that infer abuse add the hidden-window / obfuscation legs.
  - id: wsh-shellexecute-runas
    desc: WSH ShellExecute relaunch requests runas elevation
    conf: 0.93
    attack: T1548.002
    for: [vbs, javascript]
    all:
      - id: micro-behaviors/process/create/shellexec::shellexecute-method-call
    any:
      - id: runas-string
      - id: shellexecute-quoted-runas-verb
    near_lines: 2
  - id: runas-elevation-token
    desc: Windows runas elevation token present
    conf: 0.9
    any:
      - id: runas-string
      - id: runas-verb-token
  - id: shell-execute-runas
    desc: ShellExecute requests runas elevation
    conf: 0.92
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
      - id: runas-elevation-token
