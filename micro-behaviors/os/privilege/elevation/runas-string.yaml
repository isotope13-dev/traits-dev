defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, scripts, rust]
traits:
  - id: shellexecute-quoted-runas-verb
    desc: ShellExecute argument is the runas verb
    conf: 0.93
    for: [vbs, javascript, html]
    if:
      type: text
      regex: '(?i)\.ShellExecute\b[^\n]{0,900},\s*["'']runas["'']'

composite_rules:
  - id: wsh-shellexecute-runas
    desc: WSH ShellExecute relaunch requests runas elevation
    conf: 0.93
    attack: T1548.002
    for: [vbs, javascript]
    all:
      - id: micro-behaviors/os/handler/open::shellexecute-method-reference
    any:
      - id: micro-behaviors/os/privilege/elevation::runas-string
      - id: shellexecute-quoted-runas-verb
    near_lines: 2

  - id: shell-execute-runas
    desc: ShellExecute requests runas elevation
    conf: 0.92
    for: [pe, dll]
    all:
      - id: micro-behaviors/os/handler/open::shell-execute-ex
      - id: micro-behaviors/os/privilege/elevation::runas-elevation-token
