defaults:
  platforms: [unix]
  for: [binaries]
  crit: notable

traits:
  - id: sudo-binary-path-reference
    desc: References the sudo binary path
    conf: 0.82
    if:
      type: text
      exact: /usr/bin/sudo

  - id: go-permutil-sudo
    desc: Requests elevation through Go privilege helper
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: symbol
      kind: call
      exact: permutil.Sudo
