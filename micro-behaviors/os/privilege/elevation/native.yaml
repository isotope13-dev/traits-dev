defaults:
  platforms: [unix]
  for: [binaries]
  crit: notable

traits:
  # A compiled program that elevates does it by naming the helper it re-executes
  # itself through. `sudo-binary-path-reference` covered only the absolute sudo
  # path; nothing covered pkexec, which is what a GUI program uses because polkit
  # supplies the authentication dialog. A Rust tray app shipping a root helper
  # and a Linux dropper re-execing itself as root look identical here on purpose:
  # this is the capability, and the objectives supply what gets run elevated.
  - id: pkexec-binary-reference
    desc: References the pkexec elevation helper
    conf: 0.85
    for: [binaries, scripts, source, -applescript]
    if:
      type: text
      regex: '(?m)(^|[\s"''`=/])pkexec($|[\s"''`\x00])'

  - id: polkit-action-policy-path
    desc: References a polkit action policy file
    conf: 0.85
    for: [binaries, scripts, source, -applescript]
    if:
      type: text
      substr: /usr/share/polkit-1/actions/

  - id: sudo-binary-path-reference
    desc: References the sudo binary path
    conf: 0.82
    if:
      type: text
      exact: /usr/bin/sudo

  # Programs that drive sudo non-interactively (terminal agents, deploy tools,
  # expect-style wrappers) watch for this prompt to know when to answer it.
  # The credential-capture intent lives in objectives/credential-access/capture/.
  - id: sudo-password-prompt-text
    desc: Contains the sudo password prompt text
    conf: 0.82
    for: [elf, macho]
    if:
      type: text
      regex: '(\[?sudo\]?\s+password|do\]\s+password|sudo: .{0,80}password|Sorry, try again)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: go-permutil-sudo
    desc: Requests elevation through Go privilege helper
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: symbol
      kind: call
      exact: permutil.Sudo
