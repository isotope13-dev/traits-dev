defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: vscode-host-write-with-elevation-request
  for:
  - javascript
  - typescript
  - package.json
  - vsix
  desc: VS Code host writes with elevation request
  crit: notable
  conf: 0.85
  scope: archive
  all:
  - id: micro-behaviors/fs/write/file/target::vscode-host-paths-with-file-write
  - id: metadata/package/runtime::vscode-extension
  - id: metadata/permission/activation::on-startup-finished
  - id: micro-behaviors/os/module/require::child-process-require
  any:
  - id: micro-behaviors/os/privilege/elevation::pkexec-binary-reference
  - id: micro-behaviors/os/privilege/elevation::applescript-admin-prompt
  - id: micro-behaviors/os/privilege/elevation::runas-verb
