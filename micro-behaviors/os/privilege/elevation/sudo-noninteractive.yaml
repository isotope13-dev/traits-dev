# Running sudo without a password prompt is neutral process-launch behavior.
# Passwordless policy changes and exploit context are inferred by objective
# composites.
defaults:
  crit: notable
  platforms: [unix]
  for: [shell, python, c, cpp, rust, go, elf]

traits:
  - id: sudo-no-prompt-command-text
    desc: sudo command text requests no prompt
    conf: 0.9
    if:
      type: text
      # Stop at the executable: in `sudo lsof -n`, -n belongs to lsof.
      # Short options taking an argument may precede sudo's own -n.
      regex: '\bsudo[ \t]+(-[uUgphC][ \t]+\S+[ \t]+|-\S+[ \t]+){0,6}(-n|--non-interactive)\b'

  - id: sudo-no-prompt-argv-text
    desc: sudo argv starts with no-prompt option
    conf: 0.9
    if:
      type: text
      regex: '\bsudo["''][ \t]*,[ \t]*\[?[ \t]*["''](-n|--non-interactive)["'']'

  - id: sudo-no-prompt-long-user-option
    desc: sudo user option precedes no-prompt option
    conf: 0.9
    if:
      type: text
      regex: '\bsudo[ \t]+--(user|group|host)[ \t]+\S+[ \t]+(-n|--non-interactive)\b'

  - id: sudo-noninteractive-bash-text
    desc: sudo no-prompt command references bash
    conf: 0.94
    if:
      type: text
      regex: '\bsudo\b[^\n]{0,45}-n\b[^\n]{0,30}\bbash\b'

composite_rules:
  - id: sudo-noninteractive
    desc: sudo command or argv requests no prompt
    conf: 0.9
    any:
      - id: sudo-no-prompt-command-text
      - id: sudo-no-prompt-argv-text
      - id: sudo-no-prompt-long-user-option
