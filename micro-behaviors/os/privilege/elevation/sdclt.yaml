defaults:
  for: [batch, vbs, powershell, pe, python, rust]
  platforms: [windows]
traits:
  - id: powershell-start-sdclt
    desc: Starts the Windows Backup launcher
    for: [powershell]
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: Start-Process
      arg:
        index: 0
        kind: identifier
        name: sdclt.exe

  - id: sdclt-kickoff-elev-command
    desc: sdclt auto-elevation command sequence
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bsdclt(\.exe)?\b.{0,100}/KickOffElev\b'
