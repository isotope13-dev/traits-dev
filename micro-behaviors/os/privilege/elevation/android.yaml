defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  crit: notable
  conf: 0.92

traits:
  - id: android-device-policy-manager-import
    desc: Android device policy manager import
    if:
      type: symbol
      kind: import
      exact: android.app.admin.DevicePolicyManager

  # `resetPassword` is a common account-management method name, so require the
  # DevicePolicyManager receiver nearby: only the device-admin API can rewrite
  # the *device* unlock credential and lock the owner out.
  - id: android-device-policy-reset-password
    desc: DevicePolicyManager resets device password
    if:
      type: text
      regex: 'DevicePolicyManager[\s\S]{0,200}\.\s*resetPassword\s*\('

  - id: android-pm-grant-command
    desc: Android pm grant shell command
    if:
      type: text
      regex: '(?i)\bpm\s+grant\b'

  - id: android-pm-grant-argv
    desc: Android pm grant argv call
    if:
      type: text
      regex: '(?i)"pm"\s*,\s*"grant"'

  - id: android-write-secure-settings-permission
    desc: Android secure settings write permission
    conf: 0.98
    if:
      type: text
      substr: android.permission.WRITE_SECURE_SETTINGS

  - id: android-dpm-set-active-admin-command
    desc: Android dpm active-admin command
    if:
      type: text
      regex: '(?i)(\bdpm\s+set-active-admin\b|"dpm"\s*,\s*"set-active-admin")'

  - id: android-runtime-permission-request
    desc: Android runtime permission request
    conf: 0.94
    for: [dex]
    if:
      type: text
      word: requestPermissions

  - id: android-read-external-storage-permission-reference
    desc: Android read-storage permission reference
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: android.permission.READ_EXTERNAL_STORAGE

  - id: android-write-external-storage-permission-reference
    desc: Android write-storage permission reference
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: android.permission.WRITE_EXTERNAL_STORAGE

composite_rules:
  - id: android-pm-grant
    desc: Android permission grant operation
    any:
      - id: android-pm-grant-command
      - id: android-pm-grant-argv

  - id: android-external-storage-runtime-request
    desc: Requests Android external-storage access
    crit: notable
    conf: 0.98
    for: [dex]
    all:
      - id: android-runtime-permission-request
      - id: android-read-external-storage-permission-reference
      - id: android-write-external-storage-permission-reference
    near_bytes: 4096
