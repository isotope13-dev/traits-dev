defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  crit: notable
  conf: 0.92

traits:
  - id: android-pm-grant-command
    desc: Android pm grant shell command
    if:
      type: text
      regex: '(?i)\bpm\s+grant\b'

  - id: android-pm-grant-argv
    desc: Android pm grant argv call
    if:
      type: text
      regex: '(?i)"pm"\s*,\s*"grant"'

  - id: android-dpm-set-active-admin-command
    desc: Android dpm active-admin command
    if:
      type: text
      regex: '(?i)(\bdpm\s+set-active-admin\b|"dpm"\s*,\s*"set-active-admin")'

composite_rules:
  - id: android-pm-grant
    desc: Android permission grant operation
    any:
      - id: android-pm-grant-command
      - id: android-pm-grant-argv
