defaults:
  platforms: [windows]
  for: [lua]

traits:
  # A generated PowerShell block comment can separate -Verb from RunAs.
  # This observes the recovered argument fragment, not a UAC bypass or
  # successful elevation. The executable and comment contents may vary.
  - id: lua-comment-delimited-runas-argument
    desc: Lua embeds commented RunAs launch arguments
    crit: notable
    conf: 0.94
    if:
      type: literal
      regex: '(?i)#>\s+runas["'']?\s+-WindowStyle\b'
