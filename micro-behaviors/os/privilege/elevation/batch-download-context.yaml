defaults:
  for: [batch]
  platforms: [windows]
composite_rules:
  - id: batch-download-elevation-output-suppression
    desc: Download beside silent elevation request
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/process/create/exec::start-process-call
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: micro-behaviors/os/console/io::batch-command-stdout-nul
