defaults:
  # The elevated daemon runs on the Android device; the adb client that
  # requests it may run on any host OS.
  platforms: [android, unix, windows]
  for: [scripts, source]

traits:
  # One spelling per atom of the same request: restart adbd as root.
  # adb root / adb -s <serial> root / adb.exe, including path-prefixed
  # binaries and template strings such as `adb -s ${serial} root`.
  - id: android-adbd-root-cli-text
    desc: adb root command text
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\badb(\.exe)?(\s+-s\s+\S+)?\s+root\b'
  # setprop service.adb.root 1, config assignment, or
  # SystemProperties.set("service.adb.root", "1"). Property reads and
  # comparisons stay out: only a set/request form matches.
  - id: android-adbd-root-property-set
    desc: Sets service.adb.root property
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(service\.adb\.root\s*["'']?\s*[:,=]?\s*["'']?\s*1\b)'
  # Quoted argv array: spawn(["adb", "root"]) or
  # spawn(["adb", "-s", serial, "root"]). Other adb subcommands between
  # adb and root (shell, install, ...) do not match.
  - id: android-adbd-root-argv-array
    desc: adb root argv array literal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '["'']adb["'']\s*,\s*(["'']-s["'']\s*,\s*[^,]{0,64},\s*)?["'']root["'']'

composite_rules:
  - id: android-adbd-root-request
    desc: Requests root Android debug daemon
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/os/privilege/elevation::android-adbd-root-cli-text
      - id: micro-behaviors/os/privilege/elevation::android-adbd-root-property-set
      - id: micro-behaviors/os/privilege/elevation::android-adbd-root-argv-array
