defaults:
  # The elevated daemon runs on the Android device; the adb client that
  # requests it may run on any host OS.
  platforms: [android, unix, windows]
  for: [scripts, source]

traits:
  # One spelling per atom of the same request: restart adbd as root.
  # adb root / adb -s <serial> root / adb.exe, including path-prefixed
  # binaries and template strings such as `adb -s ${serial} root`.
  - id: android-adbd-root-cli-text
    desc: Shell command requests root Android daemon
    crit: component
    conf: 0.9
    for: [shell, batch, powershell, makefile]
    if:
      type: text
      regex: '(?im)^[ \t]*(\S*[/\\])?adb(\.exe)?([ \t]+-s[ \t]+\S+)?[ \t]+root[ \t\r]*($|[;&|>#])'
  - id: android-adbd-root-cli-literal
    desc: Command literal requests root adbd
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '(?im)^[ \t]*(\S*[/\\])?adb(\.exe)?([ \t]+-s[ \t]+\S+)?[ \t]+root[ \t]*($|[;&|>])'
  # setprop service.adb.root 1, config assignment, or
  # SystemProperties.set("service.adb.root", "1"). Property reads and
  # comparisons stay out: only a set/request form matches.
  - id: android-adbd-root-property-set
    desc: Sets service.adb.root property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(service\.adb\.root\s*["'']?\s*[:,=]?\s*["'']?\s*1\b)'
  # Quoted argv array: spawn(["adb", "root"]) or
  # spawn(["adb", "-s", serial, "root"]). Other adb subcommands between
  # adb and root (shell, install, ...) do not match. A component like its
  # siblings: device test harnesses (OboeTester dsp_timing.py) run it to set
  # debug properties; android-adbd-root-request reports it at notable.
  - id: android-adbd-root-argv-array
    desc: adb root argv array literal
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']adb["'']\s*,\s*(["'']-s["'']\s*,\s*[^,]{0,64},\s*)?["'']root["'']'

composite_rules:
  # `adb root` is notable (debug_remount.sh control), but only
  # as a command: it must end the command line or string. Comments and prose
  # ("excluded from attempting adb root." in mozdevice adb.py, compiler-rt
  # asan_device_setup's "'adb root' once." help text) are not invocations.
  - id: android-adbd-root-request
    desc: Requests root Android debug daemon
    crit: notable
    conf: 0.95
    for: [scripts, source, makefile]
    any:
      - id: micro-behaviors/os/privilege/elevation::android-adbd-root-cli-text
      - id: micro-behaviors/os/privilege/elevation::android-adbd-root-cli-literal
      - id: micro-behaviors/os/privilege/elevation::android-adbd-root-property-set
      - id: micro-behaviors/os/privilege/elevation::android-adbd-root-argv-array
    downgrade:
      any:
        - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
