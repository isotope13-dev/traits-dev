defaults:
  for: [elf, so]
  platforms: [linux]
  crit: notable
  conf: 0.98

composite_rules:
  - id: samba-root-memory-api-profile
    desc: Samba extension references root switching and memory mapping
    all:
      - id: micro-behaviors/dylib/load/runtime::samba-module-init-export
      - id: micro-behaviors/os/privilege/elevation::samba-change-to-root-user-import
      - id: micro-behaviors/mem/map::mmap-import
      - id: micro-behaviors/process/fork/clone::fork
