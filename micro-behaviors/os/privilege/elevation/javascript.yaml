defaults:
  platforms: [unix]
  for: [javascript, typescript]

traits:
  - id: sudo-command-string
    desc: JavaScript sudo command string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''`]sudo\s+[^"''`\r\n]{1,160}'
    unless:
      - id: metadata/package/testing/

  - id: operator-write-scope-append
    desc: Appends the OpenClaw operator.write scope
    crit: notable
    conf: 0.99
    platforms: [unix, windows]
    if:
      type: tree-sitter
      language: typescript
      kind: call
      regex: '(?i)\b(push|append)\s*\(\s*["'']operator\.write["'']'

  - id: operator-write-spread-add
    desc: Adds operator.write through array spread
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    if:
      type: text
      regex: '\.\.\.[\s\S]{0,80}["'']operator\.write["'']'
