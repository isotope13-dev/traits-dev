defaults:
  crit: notable
  platforms: [unix]
  for: [javascript, typescript]

traits:
  - id: sudo-command-string
    desc: JavaScript sudo command string
    conf: 0.9
    if:
      type: text
      regex: '["''`]sudo\s+[^"''`\r\n]{1,160}'
    unless:
      - id: metadata/package/testing/

  - id: operator-write-scope-append
    desc: Appends the OpenClaw operator.write scope
    conf: 0.99
    platforms: [unix, windows]
    if:
      type: tree-sitter
      language: typescript
      kind: call
      regex: '(?i)\b(push|append)\s*\(\s*["'']operator\.write["'']'

  - id: operator-write-spread-add
    desc: Adds operator.write through array spread
    conf: 0.98
    platforms: [unix, windows]
    if:
      type: text
      regex: '\.\.\.[\s\S]{0,80}["'']operator\.write["'']'

composite_rules:
  - id: powershell-runas-hidden-wrapper
    desc: Hidden PowerShell wrapper requests RunAs elevation
    crit: notable
    conf: 0.95
    platforms: [windows]
    attack: T1548.002
    mbc: F0015
    all:
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: micro-behaviors/process/create/start-process::start-process-filepath
      - id: micro-behaviors/process/create/spawn::windowshide-option
