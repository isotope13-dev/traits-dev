defaults:
  crit: notable
  platforms:
  - unix
  for:
  - javascript
  - typescript
traits:
- id: sudo-command-string
  desc: JavaScript sudo command string
  conf: 0.9
  if:
    type: text
    regex: '["''`]sudo\s+[^"''`\r\n]{1,160}'
- id: node-powershell-start-process-runas
  desc: Start-Process multiline UAC elevation
  conf: 0.95
  platforms:
  - windows
  for:
  - javascript
  - typescript
  - pe
  if:
    type: raw
    regex: (?i)\bStart-Process\b[\s\S]{0,260}-Verb\s+RunAs\b
composite_rules:
- id: powershell-runas-hidden-wrapper
  desc: Hidden PowerShell wrapper requests RunAs elevation
  conf: 0.95
  platforms:
  - windows
  attack: T1548.002
  mbc: F0015
  all:
  - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
  - id: micro-behaviors/process/config/launch::runas-verb
  - id: micro-behaviors/process/create/cmdlet::start-process-call
  - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
