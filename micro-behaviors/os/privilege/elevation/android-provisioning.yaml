defaults:
  platforms: [android]
composite_rules:
  - id: android-adb-doze-exemption
    desc: ADB shell requests a Doze exemption
    crit: notable
    conf: 0.96
    for: [java, kotlin, apk, zip, dex]
    all:
      - id: micro-behaviors/communications/socket/tcp::adb-shell-doze-whitelist-add
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request
  - id: android-install-attribution-accessibility-configuration
    desc: Installer attribution and Accessibility setup
    crit: notable
    conf: 0.97
    for: [source, binaries]
    all:
      - id: micro-behaviors/os/package-manager/sideload::android-apk-installer-attribution
      - id: micro-behaviors/os/privilege/elevation::android-accessibility-settings-command-enable
