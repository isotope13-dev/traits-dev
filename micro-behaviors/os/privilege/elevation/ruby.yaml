# Ruby privilege-boundary invocation.  The call-site matcher distinguishes an
# actual pkexec argv entry from documentation or a package name mention.
defaults:
  crit: notable
  platforms: [unix]
  for: [ruby]

traits:
  - id: ruby-pkexec-constant
    desc: Ruby pkexec command constant
    conf: 0.95
    if:
      type: text
      regex: '\bPKEXEC\s*=\s*["'']pkexec["'']'
  - id: ruby-pkexec-system-argv
    desc: Ruby system call uses PKEXEC
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        kind: identifier
        name: PKEXEC

composite_rules:
  - id: ruby-pkexec-system-call
    desc: Ruby invokes pkexec for elevation
    conf: 0.95
    all:
      - id: ruby-pkexec-constant
      - id: ruby-pkexec-system-argv
