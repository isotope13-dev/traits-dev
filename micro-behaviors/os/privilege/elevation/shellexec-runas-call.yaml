defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  - csharp
  - go
  - rust
  - powershell
  - javascript
  - vbs
  crit: notable
traits:
- id: shellexecute-runas-call
  desc: Calls ShellExecute with runas verb
  conf: 0.96
  if:
    type: text
    regex: '(?i)\bShellExecute(Ex)?[AW]?\s*\([^;\r\n]{0,160}["'']runas["'']'
- id: shellexecute-powershell-runas
  desc: ShellExecute elevates PowerShell via runas
  conf: 0.94
  if:
    type: text
    regex: '(?i)ShellExecute.{0,80}powershell.{0,80}runas'
