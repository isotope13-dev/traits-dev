traits:
- for:
  - c
  - cpp
  - csharp
  - go
  - rust
  - powershell
  - javascript
  - vbs
  id: shellexecute-runas-call
  desc: Calls ShellExecute with runas verb
  conf: 0.96
  if:
    type: text
    regex: '(?i)\bShellExecute(Ex)?[AW]?\s*\([^;\r\n]{0,160}["'']runas["'']'
defaults:
  platforms:
  - windows
  crit: notable
