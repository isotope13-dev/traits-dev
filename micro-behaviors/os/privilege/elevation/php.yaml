# PHP privilege elevation through a shelled-out `sudo`/`doas` command. A web
# application that builds a `sudo ...` string and hands it to exec()/shell_exec()
# is running part of itself as root, which is worth surfacing whether it is a
# server control panel doing it by design or a webshell doing it to escalate.
#
# Neutral capability only: this atom says the command string exists, not that the
# argument is attacker-controlled. Composites in objectives/ supply that intent.
# Matched on the string literal so `sudo` appearing in a comment or in prose is
# not read as a command.
defaults:
  platforms: [unix]
  for: [php]

traits:
  - id: php-sudo-command-string
    desc: PHP builds a sudo command string
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '^\s*(sudo|doas)\s+\S'
