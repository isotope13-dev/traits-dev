defaults:
  platforms:
  - macos
composite_rules:
- for:
  - applescript
  id: applescript-shell-admin-request
  desc: AppleScript requests privileged shell execution
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/process/create/script/apple-event::shell-dup-cmd
  - id: micro-behaviors/os/privilege/elevation::applescript-admin-prompt
- for:
  - shell
  - python
  - javascript
  - macho
  id: applescript-shell-admin-request-embedded
  desc: Embedded AppleScript requests privileged shell execution
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/os/privilege/elevation::applescript-admin-prompt
  any:
  - id: micro-behaviors/process/create/script/osascript::do-shell-script-binary
  - id: micro-behaviors/process/create/script/apple-event::shell-dup-cmd
