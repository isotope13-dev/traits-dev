defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-runas-explorer-launch
    desc: Unsigned PE has ShellExecute runas and Explorer launch references
    crit: notable
    conf: 0.9
    attack: T1548
    all:
      - id: metadata/signed/trust-level::unsigned
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/os/privilege/elevation::runas-string
      - id: micro-behaviors/process/create/launch::launch-explorer
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/app/productivity/winmerge::winmerge-signed-main-binary
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity
      - id: well-known/app/system/reactos::system-component

