defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-runas-explorer-launch
    desc: Unsigned PE has ShellExecute runas and Explorer launch references
    crit: notable
    conf: 0.9
    attack: T1548
    all:
      - id: metadata/signed/trust-level::unsigned
      - id: micro-behaviors/os/handler/open::shell-execute
      - id: metadata/file/profile/command-reference::runas-string
      - id: micro-behaviors/os/application/target/system::explorer-executable-reference
