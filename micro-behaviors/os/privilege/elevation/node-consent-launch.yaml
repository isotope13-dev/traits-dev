composite_rules:
- platforms:
  - windows
  for:
  - javascript
  - typescript
  - pe
  id: node-elevated-powershell-runas-launch
  desc: Node requests a UAC consent prompt through PowerShell RunAs
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/shell/interpreter::node-powershell-launch
  - id: micro-behaviors/os/privilege/elevation::node-powershell-start-process-runas
  unless:
  - id: metadata/path/directory::test-directory-component
  attack: T1059.001
