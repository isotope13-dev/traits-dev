defaults:
  for: [pe, dll, rust]
  platforms: [windows]
composite_rules:
- id: runas-api-context
  desc: Runas verb and process-launch API co-occur
  crit: notable
  conf: 0.9
  all:
  - id: metadata/file/profile/command-reference::runas-string
  any:
  - id: metadata/file/profile/open-handler::lpverb-field-name-text
  - id: metadata/file/profile/open-handler::shell-execute-api-text
  - id: metadata/file/profile/open-handler::shell-executeex-api-text
  - id: micro-behaviors/process/create/cmdlet::start-process-call
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
