defaults:
  for: [pe, dll, rust]
  platforms: [windows]
composite_rules:
- id: runas-api-context
  desc: Runas verb and process-launch API co-occur
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/privilege/elevation::runas-string
  any:
  - id: micro-behaviors/process/create/shellexec::lpverb-field
  - id: micro-behaviors/process/create/shellexec::shell-execute-call
  - id: micro-behaviors/process/create/shellexec::shell-executeex-call
  - id: micro-behaviors/process/create/start-process::start-process-call
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
