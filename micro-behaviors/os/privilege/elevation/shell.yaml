# Neutral shell privilege-elevation command invocation. A bare `sudo`/`doas`/
# `pkexec` call is a common, legitimate capability — intent is inferred by composites
# (e.g. sudo inside a PKGBUILD build() function, which runs in fakeroot and
# should never need real elevation). Match command position so comments and
# quoted prose mentioning sudo cannot become command evidence.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: sudo-command
    desc: Shell command invokes sudo
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*sudo[ \t]+'
  - id: doas-command
    desc: Invokes doas to elevate
    crit: component
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: doas
  # pkexec is the polkit elevation path, and on a desktop it is the one that
  # pops an authentication dialog rather than needing a terminal -- which is why
  # Linux droppers and installers reach for it. It was previously only visible
  # through a Ruby constant, a `sh -c` prefix and the PwnKit CVE string, so an
  # ordinary `pkexec <helper>` produced no elevation finding at all.
  - id: pkexec-command
    desc: Shell command invokes pkexec
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*pkexec[ \t]+'

  - id: sudo-curl-privileged-path
    desc: sudo curl writes into privileged path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'sudo\s+curl\s+.{0,160}(-o|--output)\s+/(etc|usr|var)/'
  - id: sudo-wget-privileged-path
    desc: sudo wget writes into privileged path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'sudo\s+wget\s+.{0,160}(-O|--output-document)[ =]+/(etc|usr|var)/'
  - id: sudo-chmod-executable
    desc: sudo chmod grants executable permissions
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'sudo\s+chmod\s+(7[0-7]{2}|\+x)\s+'
    not:
      - substr: sudo chmod 777
composite_rules:
  - id: sudo-command-invoke
    desc: Invokes sudo, doas or pkexec
    crit: notable
    conf: 0.7
    any:
      - id: sudo-command
      - id: doas-command
      - id: pkexec-command
