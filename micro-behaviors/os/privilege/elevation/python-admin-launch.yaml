defaults:
  crit: notable
  for: [python]
  platforms: [windows]
  attack: T1548.002
  conf: 0.9

traits:
- id: py-admin-launch-import
  desc: Python admin-launch library import
  crit: notable
  if:
    type: import
    regex: 'py_admin_launch|py_admin_launch\.(AdminLaunchError|launch)'
- id: python-elevate-library-import
  desc: Imports Python elevation helper
  crit: notable
  if:
    type: import
    exact: elevate
- id: python-elevate-helper-call
  desc: Calls Python elevation helper
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: elevate
- id: elevation-attempt-flag
  desc: Elevation attempt guard flag
  crit: notable
  if:
    type: literal
    exact: --elevation-attempted
- id: python-ctypes-shell-execute-runas
  desc: Python calls ShellExecute with runas
  crit: suspicious
  conf: 0.97
  if:
    type: symbol
    kind: call
    exact: ctypes.windll.shell32.ShellExecuteW
    arg:
      kind: string
      exact: runas

composite_rules:
- id: python-self-elevation-relaunch
  desc: Python relaunches itself with runas
  crit: suspicious
  conf: 0.98
  all:
  - id: python-ctypes-shell-execute-runas
  - id: micro-behaviors/process/info/current::python-sys-executable-text
  - id: micro-behaviors/process/exit/terminate::python-sys-exit-symbol
  near_bytes: 512

- id: python-admin-relaunch
  desc: Python relaunches for admin
  crit: notable
  conf: 0.94
  all:
  - id: py-admin-launch-import
  - id: micro-behaviors/process/create/launch::sys-executable-module-launch
  - id: elevation-attempt-flag
  - id: micro-behaviors/os/privilege/check::ctypes-is-admin
