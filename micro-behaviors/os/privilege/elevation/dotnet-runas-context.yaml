defaults:
  for:
  - csharp
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.85
traits:
- id: dotnet-shell-runas-text
  desc: ShellExecute with runas verb
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (?i)(ShellExecute|ProcessStartInfo).{0,60}runas
- id: relaunch-self-elevated--rx-1
  desc: Self process path near runas verb
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)(GetCurrentProcess|ExecutablePath).{0,80}runas
- id: relaunch-self-elevated--rx-2
  desc: Entry assembly path near runas verb
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)(GetEntryAssembly).{0,80}runas
composite_rules:
- id: relaunch-self-elevated
  desc: Re-launches current process with elevation
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/os/privilege/elevation::relaunch-self-elevated--rx-1
  - id: micro-behaviors/os/privilege/elevation::relaunch-self-elevated--rx-2
- id: administrator-check-with-consent-request
  desc: Administrator check with RunAs request
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/os/privilege/check::dotnet-administrator-check
  any:
  - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
  - id: micro-behaviors/os/privilege/elevation::dotnet-shell-runas-text
  - id: micro-behaviors/os/privilege/elevation::relaunch-self-elevated
