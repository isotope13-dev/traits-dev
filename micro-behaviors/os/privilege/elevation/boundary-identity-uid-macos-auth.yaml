defaults:
  crit: notable
  for: [macho, dylib, c]
  platforms: [macos]
  attack: "T1548.004"
traits:
  - id: auth-execute-with-privileges
    desc: "Calls macOS AuthorizationExecuteWithPrivileges"
    conf: 0.95
    if:
      type: symbol
      exact: "AuthorizationExecuteWithPrivileges"
    downgrade:
      any:
        - id: metadata/signature/verified/platform::apple
        - id: well-known/lib/runtime/managed/jvm::jli-symbol-set
    unless:
      - id: well-known/app/security/securew2-joinnow::recognized-securew2-joinnow
      - id: well-known/tool/development/cli/sentry-cli::sentry-cli
