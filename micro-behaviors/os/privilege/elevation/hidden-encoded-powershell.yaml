defaults:
  platforms: [windows]
  for: [scripts, source]
traits:
  - id: hidden-encoded-powershell-runas
    desc: Hidden encoded PowerShell elevation request
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Start-Process.{0,40}-Verb RunAs -WindowStyle Hidden.{0,70}-EncodedCommand\b'
