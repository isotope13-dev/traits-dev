# Neutral privilege declarations in desktop launchers.  These fields describe
# the requested launch identity; objective rules add intent-specific context.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: notable
  attack: T1548

traits:
  - id: desktop-exec-elevation-helper
    desc: Desktop launch command uses an elevation helper
    conf: 0.95
    if:
      type: value
      path: desktop_entry.exec
      regex: '^(/(usr/)?s?bin/)?(pkexec|su-to-root)(\s|$)'

  - id: kde-substitute-uid
    desc: Desktop entry requests KDE UID substitution
    conf: 0.9
    if:
      type: value
      path: desktop_entry.x_kde_substitute_uid
      exact: "true"

  - id: kde-root-launch-user
    desc: Desktop entry names root launch user
    conf: 0.92
    if:
      type: value
      path: desktop_entry.x_kde_username
      exact: root
      case_insensitive: true
