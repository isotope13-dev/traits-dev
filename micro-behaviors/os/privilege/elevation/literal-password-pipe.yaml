# A quoted literal fed by printf straight into sudo or doas is the hardcoded
# password idiom: the secret lives in the script, not in the user's terminal.
# The stdin flag is reported separately by sudo-stdin-password. Objective
# composites combine the two with the action the elevation performs.
defaults:
  crit: notable
  platforms: [unix]
  for: [scripts]

traits:
  - id: elevation-literal-password-pipe
    desc: Pipes printf literal into sudo or doas
    conf: 0.9
    attack: T1552.001
    if:
      type: text
      exclude_comments: true
      regex: 'printf[ \t]+''%s''[ \t]+''[^''\n]{4,80}''[ \t]*\|[ \t]*(sudo|doas)\b'
