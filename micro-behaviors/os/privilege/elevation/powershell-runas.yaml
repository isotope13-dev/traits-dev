defaults:
  platforms: [windows]
  for: [powershell, batch, javascript, vbs, pe, csharp]
traits:
  - id: powershell-start-process-runas
    desc: Start-Process requests UAC elevation
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bStart-Process\b[^\r\n]{0,180}-Verb\s+RunAs\b'
    not:
      - regex: '(?i)Start-Process\s+-Verb\s+RunAs'
  # -PassThru plus the child's Id is how a parent tracks a helper the user
  # approved at the UAC prompt. A silent install hook does not need that channel.
  - id: start-process-runas-passthru-pid
    desc: Start-Process RunAs returns the process
    crit: notable
    conf: 0.93
    for: [javascript, typescript, powershell]
    if:
      type: text
      regex: '(?i)RunAs\b[^\r\n]{0,24}-PassThru\b[\s\S]{0,260}\.Id\b'
