defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: geteuid-root-check
    desc: Go compares the effective UID to root
    platforms: [unix]
    if:
      type: text
      regex: 'os\.Geteuid\s*\(\s*\)\s*(==|!=)\s*0'

  - id: physical-drive-admin-probe
    desc: Opens physical drive to test admin access
    platforms: [windows]
    if:
      type: string_literal
      regex: '\\\\.\\PHYSICALDRIVE[0-9]+'
