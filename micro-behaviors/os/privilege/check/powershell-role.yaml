defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-administrator-role-check
    desc: Checks the PowerShell Administrator role
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.IsInRole\(\[Security\.Principal\.WindowsBuiltInRole\]::Administrator\)'
