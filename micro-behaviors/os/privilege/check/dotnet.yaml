# .NET administrator-role checks. Asking whether the current token is in the
# Administrators role is a neutral capability that installers, updaters and
# malware alike perform; the elevation composites in
# objectives/privilege-escalation/elevation-control/ supply the intent.
defaults:
  for: [csharp, pe]
  platforms: [windows]
  attack: T1033
  crit: notable
  conf: 0.85

traits:
  - id: is-in-role-admin
    desc: WindowsIdentity IsInRole administrator check
    if:
      type: text
      regex: (?i)IsInRole.{0,40}(Administrator|BuiltinAdministrator)

  - id: windows-principal-check
    desc: WindowsPrincipal administrator check
    if:
      type: text
      regex: (?i)WindowsPrincipal.{0,60}(IsInRole|Administrator)
