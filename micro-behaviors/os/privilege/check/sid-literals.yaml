defaults:
  platforms: [windows]
  for: [pe, dll, go, c, cpp, csharp, rust, powershell]

traits:
  # These SIDs are used by service installers, ACL tools, and authorization
  # tests. Their coexistence identifies privileged Windows service principals;
  # it does not by itself establish post-exploitation activity.
  - id: trustedinstaller-sid-literal
    desc: TrustedInstaller well-known SID literal
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'S-1-5-80-956008885-3418522649-1831038044-1853292631-2271478464'
    unless:
      - id: well-known/app/system/samba::samba-source-tree
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc

  - id: localsystem-sid-literal
    desc: LocalSystem well-known SID literal
    crit: component
    conf: 0.85
    if:
      type: text
      word: "S-1-5-18"

composite_rules:
  - id: privileged-service-sid-pair
    desc: TrustedInstaller and LocalSystem SID pair
    crit: notable
    conf: 0.92
    all:
      - id: trustedinstaller-sid-literal
      - id: localsystem-sid-literal
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      - id: metadata/signed/platform/
