# Checking the token and creating a COM object do not establish elevation.
# WAPT queries Schedule.Service and Microsoft.Update.Session independently.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: admin-api-or-flag-reference
    desc: Administrator-check API or IsAdmin identifier reference
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/os/privilege/check::ctypes-is-admin
      - id: metadata/lang/source/naming/setting::isadmin-identifier-text
      - id: micro-behaviors/os/privilege/check::check-token-membership
    unless:
      - id: well-known/tool/detection/
  - id: admin-reference-with-com-dispatch
    desc: Administrator-check reference alongside COM Dispatch
    crit: notable
    conf: 0.95
    platforms:
      - windows
    all:
      - id: micro-behaviors/communications/ipc/win32com::dispatch-call
      - id: micro-behaviors/os/privilege/check::admin-api-or-flag-reference
