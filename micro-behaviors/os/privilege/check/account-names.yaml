# Well-known Windows privileged identities referred to by NAME rather than by
# SID (see sid-literals.yaml for the S-1-5-* spellings). Naming the identity is
# neutral: service installers, ACL code, and any binary that ships the Windows
# well-known-account table all contain these strings. Intent belongs to the
# composites that pair a name with an action taken under it.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python, powershell, batch]
  attack: T1033

traits:
  - id: localsystem-account-name
    desc: Names the Windows LocalSystem identity
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(LocalSystem|SYSTEM\s+(account|token|privilege))\b'
    unless:
      - id: well-known/app/infrastructure/vmware-workstation::workstation-ui-dll-identity
