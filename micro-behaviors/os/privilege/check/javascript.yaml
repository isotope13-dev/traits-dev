# JavaScript privilege-context checks are neutral discovery capabilities.
defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: node-root-uid-check
    desc: Node checks for UID 0
    if:
      type: text
      regex: '\bprocess\.getuid\s*\(\s*\)\s*={2,3}\s*0\b'
