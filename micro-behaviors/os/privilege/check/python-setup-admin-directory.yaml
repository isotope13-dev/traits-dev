defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-setup-admin-directory-clues
  desc: Setup script admin check and directory creation clues
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/os/env/read/variable::setup-py-environment-read
  - id: micro-behaviors/os/privilege/check::ctypes-is-admin
  - id: micro-behaviors/fs/directory/create::mkdir-python
