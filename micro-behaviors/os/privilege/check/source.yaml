# Source-level references to privileged accounts are a neutral privilege
# check. They are not web-session behavior; higher-level objectives should
# combine this capability with the surrounding operation before inferring use.
defaults:
  platforms: [linux, macos, windows]
  for: [go, c, cpp, rust, python, javascript, typescript]
  crit: component
  conf: 0.86

traits:
  - id: source-privileged-account-reference
    desc: Source references a privileged account
    if:
      type: text
      regex: '(?i)\b(administrator|admin|superuser|is_admin)\b'

  - id: c-geteuid-root-check
    desc: C compares effective UID to root
    crit: notable
    conf: 0.88
    platforms: [unix]
    for: [c, cpp]
    if:
      type: text
      regex: '\bgeteuid\s*\(\s*\)[^;\n]{0,12}(==|!=)\s*0'

  - id: rust-geteuid-root-check
    desc: Rust compares the effective UID to root
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [rust]
    if:
      type: text
      regex: 'geteuid\s*\(\s*\)[^;\n]{0,20}(==|!=)\s*0'

composite_rules:
  - id: effective-root-check
    desc: Program checks whether its effective identity is root
    crit: notable
    conf: 0.9
    for: [shell, python, go, rust, perl, javascript, typescript, c, cpp]
    any:
      - id: geteuid-root-check
      - id: os-getuid-admin
      - id: os-geteuid-root-check
      - id: perl-effective-uid-root-check
      - id: node-root-uid-check
      - id: root-privilege-check
      - id: micro-behaviors/os/privilege/query::is-root-check
      - id: c-geteuid-root-check
      - id: rust-geteuid-root-check
