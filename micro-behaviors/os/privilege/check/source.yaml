# Source-level references to privileged accounts are a neutral privilege
# check. They are not web-session behavior; higher-level objectives should
# combine this capability with the surrounding operation before inferring use.
defaults:
  platforms: [linux, macos, windows]
  for: [go, c, cpp, rust, python, javascript, typescript]
  crit: component
  conf: 0.86

traits:
  - id: source-privileged-account-reference
    desc: Source references a privileged account
    if:
      type: text
      regex: '(?i)\b(administrator|admin|superuser|is_admin)\b'
