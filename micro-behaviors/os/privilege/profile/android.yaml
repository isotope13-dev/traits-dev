# Android device-policy controllers can provision a managed profile and make an
# already-installed package available inside it. The individual APIs are
# legitimate administration surfaces; intent-driven exposure and hostile use
# are assessed by objective composites.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  crit: notable
  conf: 0.94

traits:
  - id: android-managed-profile-provisioning-action
    desc: Starts Android managed-profile provisioning
    if:
      type: text
      regex: '(ACTION_PROVISION_MANAGED_PROFILE|android\.app\.action\.PROVISION_MANAGED_PROFILE)'

  - id: android-install-existing-package-policy-call
    desc: Installs existing package via device policy
    for: [java, kotlin]
    conf: 0.97
    if:
      type: text
      regex: '\.\s*installExistingPackage\s*\('

  - id: android-install-existing-package-policy-reference
    desc: Device-policy existing-package API reference
    for: [apk, zip, dex]
    conf: 0.94
    if:
      type: text
      word: installExistingPackage

  # Cross-profile intent filters are the boundary that decides which intents
  # may cross the personal/work profile divide. Clearing them from the admin
  # side removes that boundary; managed-profile tools normally maintain the
  # filters instead.
  - id: android-cross-profile-intent-filter-clear
    desc: Clears Android cross-profile intent filters
    for: [java, kotlin]
    conf: 0.94
    if:
      type: text
      regex: '\.\s*clearCrossProfileIntentFilters\s*\('

  - id: android-cross-profile-intent-filter-clear-reference
    desc: Cross-profile filter clearing API reference
    for: [apk, zip, dex]
    conf: 0.92
    if:
      type: text
      word: clearCrossProfileIntentFilters

  - id: android-profile-user-restriction-policy
    desc: Changes Android profile user restriction
    for: [java, kotlin]
    conf: 0.92
    if:
      type: text
      regex: '\.\s*(addUserRestriction|setUserRestriction|clearUserRestriction)\s*\('

composite_rules:
  - id: android-managed-profile-existing-package-install
    desc: Provisions a managed profile and installs an existing package into it
    crit: notable
    conf: 0.97
    all:
      - id: android-managed-profile-provisioning-action
    any:
      - id: android-install-existing-package-policy-call
      - id: android-install-existing-package-policy-reference
    scope: leaf
