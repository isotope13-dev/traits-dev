defaults:
  platforms: [android]
  for: [java, kotlin, dex]
  crit: notable
  conf: 0.92

traits:
  - id: android-runtime-permission-request
    desc: Android runtime permission request
    conf: 0.94
    for: [dex]
    if:
      type: text
      word: requestPermissions

composite_rules:
  - id: android-external-storage-runtime-request
    desc: Requests Android external-storage access
    crit: notable
    conf: 0.98
    for: [dex]
    all:
      - id: android-runtime-permission-request
      - id: micro-behaviors/os/privilege/manifest::read-external-storage
      - id: metadata/permission/storage::android-write-external-storage-permission-reference
    near_bytes: 4096
