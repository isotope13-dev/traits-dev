defaults:
  platforms: [windows]
  for: [oledoc, msi]
traits:
  - id: msi-bytes-enforced-runasadmin
    desc: EnforcedRunAsAdmin elevation marker
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: EnforcedRunAsAdmin
    unless:
      - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
      - id: well-known/app/storage/cloud-drive-mapper::cloud-drive-mapper-msi-context
  - id: msi-advanced-installer-asadmin-action
    desc: MSI AsAdmin action-name reference
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: AsAdmin
