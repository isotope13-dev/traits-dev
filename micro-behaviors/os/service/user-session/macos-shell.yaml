defaults:
  platforms:
  - macos
  for:
  - shell
  - applescript
  crit: notable
  conf: 0.94
traits:
- id: launchctl-asuser-command
  desc: Launches process in macOS user session
  if:
    type: text
    regex: \blaunchctl\s+asuser\s+(["']?\$[A-Za-z_][A-Za-z0-9_]*["']?|[0-9]+)\s+[^\r\n]{1,300}
composite_rules:
- id: console-user-session-exec
  desc: Runs a command as the active macOS console user
  conf: 0.96
  attack: T1033
  near_lines: 8
  all:
  - id: micro-behaviors/process/identity/query::console-user-stat-command
  any:
  - id: launchctl-asuser-command
  - id: micro-behaviors/process/create/sudo::sudo-user-command
  - id: micro-behaviors/process/create/sudo::sudo-user-applescript-command
  unless:
  - id: metadata/path::test-directory-component
  - id: well-known/app/infrastructure/datadog-agent::source-context
