# A Python program that drives per-user services through a helper module --
# systemd user units, launchd agents, loginctl linger. It is the benign
# shape the service-control traits suppress on, so it is named for what it
# detects rather than for that verdict.
#
# Two bare matchers (`python-systemctl-user-argv`, `python-launchctl-argv`)
# were dropped here: the composite below already reaches into
# os/service/control for those, and the local copies were referenced by
# nothing. They stay separate from control/ deliberately -- control/'s
# traits suppress on this composite, so merging would make the reference
# circular.
defaults:
  platforms: [linux, macos]
  for: [python]
  crit: baseline
  conf: 0.9
  size_max: 5242880

traits:
  - id: python-user-service-helper
    desc: Python user service helper names
    if:
      type: text
      regex: '_guard_service_namespace|ensure_linger|service_name\(\)'
composite_rules:
  - id: python-managed-user-service-context
    desc: Python managed user service lifecycle
    all:
      - id: python-user-service-helper
    any:
      - id: micro-behaviors/os/service/control::python-systemctl-user-argv
      - id: micro-behaviors/os/service/control::python-launchctl-argv
