# WSUS database and command-line update structures. These are named platform
# capabilities; malicious intent is inferred only by the supply-chain objective
# that combines them with an attacker-controlled payload and targeting.
defaults:
  platforms: [windows]
  for: [scripts, source, xml]
  attack: T1195.002

traits:
  - id: wsus-batch-url-procedure-call
    desc: Calls the WSUS batch URL stored procedure
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bspSetBatchURL\s+@(urlBatch|batchUrl)\s*='

  - id: wsus-target-group-creation-procedure
    desc: WSUS group creation procedure
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bspCreateTargetGroup\s+@name\s*='

  - id: wsus-target-computer-membership-procedure
    desc: Adds a computer to a WSUS group
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bspAddComputerToTargetGroup\s+@targetGroupID\s*='

  - id: wsus-update-deployment-procedure
    desc: WSUS update deployment procedure
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bspDeployUpdate\s+@updateID\s*='

  - id: wsus-update-file-metadata
    desc: WSUS update file entry with digest
    crit: notable
    conf: 0.96
    # Both attributes must sit inside the same element ([^>]), and `FileName` is
    # matched case-sensitively. The WSUS/MSUS schema always pairs `Digest` /
    # `DigestAlgorithm` with `FileName`; a case-insensitive "any <*File> tag with
    # a filename attribute" matched every Log4j2 `<RollingRandomAccessFile
    # fileName="...">` appender and reported it as WSUS update metadata.
    if:
      type: text
      regex: '<[\w:.-]*File\b[^>]{0,240}(FileName[^>]{0,240}Digest|Digest[^>]{0,240}FileName)\s*='

  - id: wsus-commandline-install-handler
    desc: WSUS command-line install handler
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)<[A-Za-z_:.-]*InstallCommand\b.{0,160}\bProgram\s*=\s*["'']'

  - id: wsus-content-sync-agent-context
    desc: WSUS ContentSyncAgent implementation reference
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bContentSyncAgent\b|UpdateServices\.ContentSyncAgent'
