# A service executable filename is neutral identity evidence.  PnP-specific
# intent requires the separate installer, path, and hardware signals in the
# objective composites that reference this atom.
defaults:
  platforms: [windows]
  for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]

traits:
  - id: service-executable-filename
    desc: Windows service executable filename
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_.-]{1,80}Service\.exe\b'
