# Windows database and backup service-name literals are neutral identity
# evidence. The ransomware signal comes from combining these names with a
# service-stop action, not from an individual vendor name.
defaults:
  platforms: [windows]
  for: [pe]
  crit: component

traits:
  - id: oracle-service-name
    desc: OracleServiceOrcl Windows service name
    conf: 0.8
    if:
      type: text
      substr: 'OracleServiceOrcl'

  - id: mssql-service-name
    desc: MSSQLSERVER Windows service name
    conf: 0.78
    if:
      type: text
      substr: 'MSSQLSERVER'
    unless:
      - id: well-known/app/utility/siw::siw-family-identity

  - id: exchange-service-name
    desc: Microsoft Exchange Windows service name
    conf: 0.78
    if:
      type: text
      regex: 'MSExchange[A-Za-z]+'

  - id: veeam-service-name
    desc: Veeam Backup Windows service name
    conf: 0.82
    if:
      type: text
      regex: 'Veeam(Backup|Catalog|Mount|Agent)'
