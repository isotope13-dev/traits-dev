defaults:
  platforms: [unix]
  for: [scripts, c, cpp, rust, go, zig]

traits:
  - id: unix-authentication-daemon-name
    desc: References Unix authentication daemon
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '^(tac_plus|sshd|radiusd|freeradius|krb5kdc)$'

  - id: unix-authentication-daemon-name-binary
    desc: Embeds Unix authentication daemon name
    crit: notable
    conf: 0.92
    for: [elf, so]
    if:
      type: text
      regex: '^(tac_plus|sshd|radiusd|freeradius|krb5kdc)$'

composite_rules:
  - id: unix-authentication-daemon-reference
    desc: References Unix authentication daemon
    crit: notable
    conf: 0.94
    for: [scripts, c, cpp, rust, go, zig, elf, so]
    any:
      - id: unix-authentication-daemon-name
      - id: unix-authentication-daemon-name-binary
