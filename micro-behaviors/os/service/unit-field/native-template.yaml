traits:
- attack: T1543.002
  for:
  - shell
  - python
  - systemd
  - go
  - rust
  - objc
  - elf
  id: wanted-by-target-text
  desc: Systemd WantedBy target directive
  crit: notable
  conf: 0.7
  if:
    type: text
    word: WantedBy=default.target
  unless:
  - id: metadata/file/catalog/service::cloud-init-embedded-systemd-bootstrap-unit
composite_rules:
- for:
  - elf
  id: native-unit-template
  desc: Native binary contains systemd unit directives
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/os/service/unit-field::exec-start
  any:
  - id: micro-behaviors/os/service/restart-policy::restart-always-text
  - id: micro-behaviors/os/service/unit-field::wanted-by-target-text
  - id: micro-behaviors/os/service/unit-field::wanted-by-multi-user-text
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
defaults:
  platforms:
  - linux
