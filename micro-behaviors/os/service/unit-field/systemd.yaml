# Neutral optional fields in parsed systemd unit files. Their presence
# describes unit structure and does not establish persistence intent.
defaults:
  platforms: [linux]
  for: [systemd]
  crit: component

traits:
- id: embedded-exec-start-directive
  desc: Embeds systemd ExecStart directive in source
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: literal
    kind: string
    word: "ExecStart"

- id: condition-exists
  desc: Systemd unit declares activation condition
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: '(?m)^Condition[A-Z][A-Za-z]+='

- id: standard-output-exists
  desc: Systemd unit declares standard output
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: '(?m)^StandardOutput='
