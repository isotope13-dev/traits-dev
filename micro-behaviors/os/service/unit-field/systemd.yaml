# Neutral optional fields in parsed systemd unit files. Their presence
# describes unit structure and does not establish persistence intent.
defaults:
  platforms: [linux]
  for: [systemd]
  crit: component

traits:
- id: embedded-exec-start-directive
  desc: Embeds systemd ExecStart directive in source
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: literal
    kind: string
    word: "ExecStart"

- id: condition-exists
  desc: Unit Condition= exists
  if:
    type: value
    path: "unit.condition"
    exists: true

- id: standard-output-exists
  desc: Service StandardOutput= exists
  if:
    type: value
    path: "service.standard_output"
    exists: true
