defaults:
  platforms: [linux]
  for: [systemd]

traits:
- id: exec-start-home-root-etc-path
  desc: ExecStart in home or nonstandard etc path
  crit: notable
  conf: 0.7
  if:
    # `/opt` dropped: the FHS reserves it for add-on application packages, so
    # a vendor unit running `/opt/<product>/bin/...` is the documented layout,
    # not an unusual location (agent-glovebox's own sweep scheduler unit runs
    # /opt/agent-glovebox/.github/scheduler/dispatch-sweeps.sh). /home, /root
    # and /etc remain unusual places to run a system service binary from.
    type: value
    path: "service.exec_start"
    regex: "^/(home|root|etc)/"
    not:
      # `/etc/systemd/` is the unit tree itself and is root-owned: Photon OS
      # keeps unit helper scripts in /etc/systemd/scripts/, which is where
      # VMware VIC's appliance units point (`nat-setup`,
      # `permissions-setup`). Same reading as the `rc`/`update` entries.
      # `/etc/init.d/` completes the init-system compat set: SysV scripts
      # live there root-owned and package-managed, and first-boot oneshots
      # (pi-gen firstrun/firstboot units running /etc/init.d/firstboot.sh
      # once, then archiving it to /boot/*.done) point at it by design.
      - regex: "^/etc/(rc|update|kubernetes/|systemd/)"
      - regex: '^/etc/init\.d/'

- id: exec-start-init-script
  desc: ExecStart invokes a SysV init script
  crit: notable
  conf: 0.95
  if:
    type: value
    path: service.exec_start
    regex: '^/etc/init\.d/[^/\s]+'
