defaults:
  platforms:
  - unix
  for:
  - scripts
traits:
- id: default-target-split-fragment
  desc: Split or escaped default.target field fragment
  crit: component
  conf: 0.7
  if:
    type: text
    regex: t\.target\\\\x0a|=defaul.{0,5}target
composite_rules:
- id: default-target-field-evidence
  desc: Default-target directive or incomplete split fragments
  crit: component
  conf: 0.8
  any:
  - id: wanted-by-target-text
  - id: default-target-split-fragment
