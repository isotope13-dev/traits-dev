defaults:
  platforms: [linux]
  for: [systemd]
  crit: baseline

traits:
  - id: unit-exec-start-system-path
    desc: ExecStart uses system binary or library path
    if:
      type: value
      path: service.exec_start
      regex: ^/(s?bin|usr/(s?bin|lib))/
  - id: unit-exec-start-usr-sbin-or-lib-path
    desc: ExecStart begins /usr/sbin/ or /usr/lib/
    if:
      type: value
      path: service.exec_start
      regex: ^/(usr/sbin|usr/lib)/
  - id: unit-exec-start-field
    desc: Unit contains an ExecStart field
    if:
      type: value
      path: service.exec_start
