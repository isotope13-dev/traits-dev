defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  attack: T1562.001
traits:
  - id: batch-symantec-service-disabled
    desc: Disables Symantec endpoint protection startup
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^sc(\.exe)?\s+config\s+["'']?SepMasterService["'']?\s+start=\s*disabled\b'
