defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-smf-audit-disable-command"
    desc: "Lua passes an SMF audit-service disable command"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      regex: ".+"
      arg:
        kind: "string"
        regex: "\\bsvcadm\\s+disable\\s+system/audit/auditd\\b"
  - id: "lua-smf-tpm-disable-command"
    desc: "Lua passes an SMF TPM-service disable command"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      regex: ".+"
      arg:
        kind: "string"
        regex: "\\bsvcadm\\s+disable\\s+system/security/tpm\\b"
