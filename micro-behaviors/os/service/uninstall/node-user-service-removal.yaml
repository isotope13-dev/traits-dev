# A Node CLI that registers user autostart for itself usually also ships the
# opposite command: it unloads the LaunchAgent and disables the systemd user
# unit it created. Both halves in one file are an install/uninstall pair that
# manages the tool's own service, not an installer left behind on a fleet.
defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: node-launchctl-unload-argv
    desc: Node unloads a LaunchAgent with launchctl argv
    if:
      type: text
      regex: 'launchctl["'']\s*,\s*\[\s*["''](unload|bootout)["'']'

  - id: node-systemctl-user-disable-argv
    desc: Node disables user systemd unit via argv
    if:
      type: text
      regex: 'systemctl["'']\s*,\s*\[\s*["'']--user["'']\s*,\s*["'']disable["'']'

composite_rules:
  - id: node-dual-service-manager-removal
    desc: Node script removes both user autostart registrations
    crit: exception
    all:
      - id: node-launchctl-unload-argv
      - id: node-systemctl-user-disable-argv
