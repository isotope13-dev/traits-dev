# Systemctl text does not establish unwanted persistence.
defaults:
  platforms: [unix]
  for: [scripts]
traits:
- id: systemctl-user-fragment--rx-1
  desc: systemctl --user command fragment
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\bsystemctl\s+--user\b'
- id: systemctl-user-fragment--rx-2
  desc: "Matches 'systemctl\\\\x20--u'"
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: systemctl\\x20--u
- id: systemctl-user-fragment--rx-3
  desc: "Matches '--user\\\\x20enab'"
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: --user\\x20enab
- id: systemctl-user-fragment--rx-4
  desc: "Matches 'user\\\\x20stop'"
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: user\\x20stop
- id: systemctl-user-fragment--rx-5
  desc: "Matches 'user\\\\x20start'"
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: user\\x20start
composite_rules:
- id: systemctl-user-fragment
  desc: systemctl --user command fragment
  crit: notable
  conf: 0.92
  any:
  - id: systemctl-user-fragment--rx-1
  - id: systemctl-user-fragment--rx-2
  - id: systemctl-user-fragment--rx-3
  - id: systemctl-user-fragment--rx-4
  - id: systemctl-user-fragment--rx-5
