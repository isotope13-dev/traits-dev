defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: systemd-control-or-enable-reference
  desc: References systemctl or user service enable
  crit: notable
  conf: 0.85
  any:
    - id: micro-behaviors/os/service/configure::source-systemctl-user-enable
    - id: micro-behaviors/os/service/control::systemctl-string-literal

# Benign cross-platform schedulers (dev-tool runners, sync agents) expose a
# full install/stop lifecycle: every OS surface they register they can also
# tear down. Implants register and never ship the per-OS unload path.
