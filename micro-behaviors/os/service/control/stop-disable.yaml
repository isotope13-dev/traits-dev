defaults:
  platforms: [unix]
  for: [shell, python, javascript]

composite_rules:
  - id: systemd-stop-disable
    desc: Stops and disables systemd services
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/stop::systemctl-stop
      - id: micro-behaviors/os/service/configure::systemctl-disable
