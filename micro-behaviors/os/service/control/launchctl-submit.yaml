defaults:
  platforms:
  - macos
  for:
  - scripts
  - binaries
traits:
- id: launchctl-submit-command
  desc: launchctl submit service command
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \blaunchctl\s+submit\s+-l\b
- id: launchctl-submit-zsh
  desc: launchctl submit starts zsh
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \blaunchctl\s+submit\b[^\r\n]{0,160}\s--\s*["\x27]?(/bin/)?zsh(["\x27]|\s|$)
composite_rules:
- id: launchctl-submit-profiler
  desc: launchctl submission with profiler label
  crit: notable
  conf: 0.94
  all:
  - id: launchctl-submit-command
  - id: micro-behaviors/os/service/name::profiler-label
