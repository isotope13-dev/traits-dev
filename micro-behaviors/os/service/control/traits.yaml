defaults:
  for:
    - shell
    - elf
  platforms:
    - linux
traits:
  - id: systemctl-word
    desc: References systemctl service manager
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?m)(^|[;&|])\s*(sudo\s+)?systemctl(\s+|$)
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
  - id: systemctl-list-units
    desc: systemctl list-units command
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: systemctl list-units
  - id: systemctl-stop
    desc: systemctl stops a service
    crit: notable
    conf: 0.8
    for: [shell, python, javascript]
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*(sudo\s+)?systemctl\s+stop\s+\S+'
    not:
      - regex: '(?m)^%preun\b'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/package/files/system-package::package-post-remove-script
      - id: micro-behaviors/os/service/legitimate::shell-uninstall-function-marker
      - id: micro-behaviors/os/service/legitimate::shell-uninstall-function-marker

  - id: systemctl-templated-target
    desc: systemctl targets a format placeholder
    crit: notable
    conf: 0.8
    platforms: [unix]
    for: [shell, python, javascript, source]
    if:
      type: text
      regex: 'systemctl\s+(disable|stop)\s+["'']?[{$%]'

  - id: systemctl-disable
    desc: systemctl disables a service
    crit: notable
    conf: 0.8
    platforms: [unix]
    for: [shell, python, javascript]
    if:
      type: text
      regex: (?im)(^|[;&|])\s*(sudo\s+)?systemctl\s+disable\s+(--now\s+)?\S+
    not:
      - regex: '(?im)systemctl\s+(--user\s+)?disable\s+(--now\s+)?\S+\.(timer|path|socket)\b'
      - substr: systemctl disable devmon@devmon
      - substr: 'systemctl disable "${SERVICE}"'
      - substr: systemctl disable "${agent_name}.service"
      - regex: (?i)systemctl\s+disable\s+ollama(?:\.service)?\b
      - regex: systemctl\s+disable\s+["'']?policy-routes@\*\.service["'']?
      - regex: (?i)machinectl|systemd-nspawn@XXX|wrapper around `systemctl disable
      - substr: "systemctl disable raised:"
      - regex: '(?m)^%preun\b'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/build/package/
      - id: metadata/package/files/system-package::package-post-remove-script
      - id: metadata/file/profile/identity::static-html-shell
      - id: well-known/app/infrastructure/walinuxagent::source-tree
      - id: well-known/app/system/olares::cli-source-tree
      - id: well-known/app/infrastructure/nuzur/
    downgrade:
      any:
        - id: micro-behaviors/os/service/legitimate::installer-script
        - id: well-known/tool/sysadmin/kubernetes

  - id: python-systemctl-user-argv
    desc: Python invokes systemctl user service
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: text
      regex: '\[\s*["'']systemctl["'']\s*,\s*["'']--user["'']'
    unless:
      - id: micro-behaviors/os/service/legitimate::python-managed-user-service-context
  - id: python-launchctl-argv
    desc: Python invokes launchctl service control
    crit: notable
    conf: 0.82
    for: [python]
    platforms: [macos]
    if:
      type: text
      regex: '\[\s*["'']launchctl["'']'
    unless:
      - id: micro-behaviors/os/service/legitimate::python-managed-user-service-context
  - id: javascript-systemctl-user-service-command
    desc: JavaScript invokes systemd user service
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'systemctl\s+--user\s+(stop|restart|start)'
  - id: javascript-launchctl-service-command
    desc: JavaScript invokes a launchd service command
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    platforms: [macos]
    if:
      type: text
      regex: 'launchctl\s+(unload|load)'
  - id: launchctl-load-command
    desc: launchctl load service command
    crit: notable
    conf: 0.92
    for: [source]
    platforms: [macos]
    if:
      type: text
      regex: '\blaunchctl\b.{0,80}\bload\b'
    unless:
      - type: text
        substr: com.apple.smb.preferences
      - id: well-known/tool/detection/skill-scanner::source-context
  - id: launchctl-load-plist
    desc: launchctl loads a plist service
    crit: notable
    conf: 0.94
    for: [shell]
    platforms: [macos]
    mbc: B0028
    attack: T1543.004
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?launchctl\s+load\s+[^;\n]{0,160}\.plist'
  - id: launchctl-bootstrap-command
    desc: Bootstraps a launchd plist with launchctl
    crit: notable
    conf: 0.95
    for: [shell, go, c, cpp, objc, macho, python, rust]
    platforms: [macos]
    mbc: B0028
    attack: T1543.004
    if:
      type: text
      regex: '\blaunchctl\s+bootstrap\s+(gui|user|system)/[0-9]+\s+\S+\.plist\b'
  - id: launchctl-stop-command
    desc: launchctl stops a service
    crit: notable
    conf: 0.82
    for: [shell, python, javascript]
    platforms: [macos]
    mbc: B0028
    attack: T1543.004
    if:
      type: text
      regex: '\blaunchctl\s+stop\s+\S+'
  - id: loginctl-enable-linger
    desc: References loginctl enable-linger for an account
    crit: notable
    conf: 0.86
    for: [shell, python, go, rust, c, cpp, objc, elf]
    if:
      type: text
      regex: '(?i)\bloginctl\s+enable-linger\b'
    unless:
      - id: micro-behaviors/os/service/legitimate::python-managed-user-service-context
  - id: service-start
    desc: Service utility starts a daemon
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?service\s+[a-zA-Z0-9_\-]+\s+start\b'
  - id: service-stop
    desc: Service utility stops a daemon
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?im)(^|[;&])\s*(sudo\s+)?(/usr/sbin/)?service\s+[A-Za-z0-9_.@-]+\s+stop\b'
    not:
      - regex: '(?i)service\s+(and|or|will|the|is|to|can)\s+stop'
  - id: service-restart
    desc: Service utility restarts a daemon
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?service\s+[a-zA-Z0-9_\-]+\s+restart\b'
  - id: sshd-restart-command
    desc: Restarts the OpenSSH daemon
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [scripts, binaries]
    if:
      type: text
      regex: '\b(systemctl\s+restart\s+sshd|service\s+sshd\s+restart)\b'
    unless:
      - type: text
        substr: run_rc_command
      - id: well-known/tool/sysadmin/automatedlab/
      - id: well-known/tool/sysadmin/alpine-packages::alpine-ansible-core-package
  - id: android-start-service-command
    desc: Shell starts an Android service with am
    crit: notable
    conf: 0.94
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*am[ \t]+start(-foreground)?-service\b'
  - id: chkconfig-word
    desc: Checks for the chkconfig service tool
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?m)^\s*(which|command\s+-v)\s+chkconfig\b'
  - id: launchctl-command
    desc: launchctl command (manage launchd services)
    crit: notable
    conf: 0.7
    mbc: B0028
    attack: T1543.004
    platforms: [macos]
    for: [shell, applescript, python, javascript, c, macho]
    if:
      type: text
      regex: (^|[\s;&|(/])(/bin/)?launchctl(\s|$)
    not:
      - regex: completions/launchctl\.fish|complete --command launchctl|Opens the launchctl daemon file
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: launchctl-enable-disable-command
    desc: launchctl service enable or disable command
    crit: notable
    conf: 0.88
    platforms: [macos]
    for: [shell, applescript, python, javascript, c, macho]
    if:
      type: text
      regex: '\blaunchctl\s+(enable|disable)\b'
  - id: launchctl-bootout-gui
    desc: launchctl bootout gui service
    crit: notable
    conf: 0.86
    mbc: B0028
    attack: T1543.004
    platforms: [macos]
    for: [macho, c, shell]
    if:
      type: text
      substr: launchctl bootout gui/
  - id: launchctl-bootstrap-gui
    desc: launchctl bootstrap gui service
    crit: notable
    conf: 0.86
    mbc: B0028
    attack: T1543.004
    platforms: [macos]
    for: [macho, c, shell]
    if:
      type: text
      substr: launchctl bootstrap gui/
  - id: launchctl-bootstrap-subcommand
    desc: launchctl bootstraps a service
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [scripts]
    if:
      type: text
      regex: '\blaunchctl\s+bootstrap\b'
  - id: launchctl-kickstart-command
    desc: launchctl kickstarts a service
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [shell, applescript, python, javascript, c, cpp, objc, macho, rust]
    mbc: B0028
    attack: T1543.004
    if:
      type: text
      regex: '\blaunchctl\s+kickstart(\s+-k)?\b'
  - id: launchctl-load-variable
    desc: launchctl loads variable plist
    crit: notable
    conf: 0.93
    mbc: B0028
    attack: T1543.004
    platforms: [macos]
    for: [shell]
    if:
      type: text
      regex: 'launchctl load "\$[A-Z_]{3,40}"'
  - id: native-systemd-unit-name
    desc: Native binary embeds a systemd unit name
    crit: notable
    conf: 0.86
    for: [elf]
    if:
      type: text
      regex: '^[A-Za-z0-9_.@-]+\.service$'
    not:
      - regex: '^(com|java|javax|net|org)\.'
composite_rules:
  - id: shell-launchctl-load
    desc: Shell loads a launchd service with launchctl
    crit: notable
    conf: 0.94
    for: [shell]
    platforms: [macos]
    mbc: B0028
    attack: T1543.004
    any:
      - id: launchctl-load-plist
      - id: launchctl-load-variable
  - id: service-cmd
    desc: service command with action
    crit: notable
    conf: 0.7
    any:
      - id: service-start
      - id: service-stop
      - id: service-restart
  - id: service-control
    desc: Service control commands
    crit: notable
    conf: 0.7
    any:
      - id: systemctl-word
      - id: service-cmd
      - id: chkconfig-word
      - id: launchctl-stop-command
