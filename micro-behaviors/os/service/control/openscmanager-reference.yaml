defaults:
  platforms: [windows]
  # The API-name reference is a binary fact too: Go and other native code
  # resolve service-control APIs from name strings without importing them.
  for: [powershell, pe, dll]
traits:
  - id: openscmanager-name-reference
    desc: OpenSCManagerW API name reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: OpenSCManagerW
