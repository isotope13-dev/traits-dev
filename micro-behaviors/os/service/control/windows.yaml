defaults:
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: sc-create-command
    desc: sc.exe create service command
    crit: notable
    conf: 0.95
    for: [csharp, powershell, batch, c, cpp]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+create\b'

  - id: sc-local-system-service-create
    desc: sc.exe creates a LocalSystem service
    crit: suspicious
    conf: 0.92
    for: [powershell, batch, csharp, go, c, cpp]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[^\r\n]{0,180}\bLocalSystem\b'

  - id: sc-auto-start-service-create
    desc: sc.exe creates an auto-start service
    crit: suspicious
    conf: 0.92
    for: [powershell, batch, csharp, go, c, cpp]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[^\r\n]{0,180}\bstart\s*=\s*auto\b'

  - id: sc-shared-svchost-service-create
    desc: sc.exe creates shared svchost service
    crit: notable
    conf: 0.95
    for: [powershell, batch, csharp, go]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create[^\r\n]{0,180}svchost\.exe -k [^\r\n]{0,60}type= share\b'

  - id: sc-kernel-driver-service-create
    desc: sc.exe registers a kernel driver service
    # `sc create <name> type= kernel binPath= <image>.sys` is how a driver is
    # loaded on a running system without an INF. Neutral capability — driver
    # vendors and endpoint products install this way too — but it is the
    # narrowest observable form of "code is about to run in the kernel", so an
    # analyst wants it surfaced. `type= filesys` is the same registration for a
    # filesystem filter driver.
    crit: notable
    conf: 0.94
    for: [powershell, batch, csharp, go]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[^\r\n]{0,180}\btype\s*=\s*(kernel|filesys)\b'

  - id: sc-remote-create-command
    desc: sc.exe remote service creation
    crit: notable
    conf: 0.96
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+\\+[A-Za-z0-9._-]{1,63}\s+create\b'
  - id: sc-config-command
    desc: sc.exe configure service command
    crit: notable
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+config\b'

  - id: net-start-service-command
    desc: net.exe starts a Windows service
    crit: notable
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+start\s+[A-Za-z0-9_.-]+\b'

  - id: net-stop-service-command
    desc: net.exe stops a Windows service
    crit: notable
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+stop\s+[A-Za-z0-9_.-]+\b'
  # --- "this service starts at boot", one atom per spelling ---
  - id: service-auto-start-argument
    desc: Windows service automatic-start argument
    crit: notable
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    if:
      type: text
      regex: '(?i)\bstart\s*=\s*auto(matic)?\b'

  - id: service-start-type-property
    desc: Service StartType property Automatic
    crit: component
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    if:
      type: text
      regex: '(?i)\bStartType\s*=\s*["'']?Automatic\b'

  - id: service-startuptype-parameter
    desc: Service cmdlet StartupType set Automatic
    # `New-Service`/`Set-Service -StartupType Automatic` is the idiomatic way
    # modern post-exploitation scripts make a service boot-persistent. The
    # parameter is space-separated rather than `=`-assigned, so the sc.exe and
    # Win32 property spellings above do not reach it.
    crit: component
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    if:
      type: text
      regex: '(?i)\bStartupType\s+["'']?Automatic\b'

  - id: service-auto-start-constant
    desc: SERVICE_AUTO_START Win32 constant
    crit: component
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    if:
      type: text
      word: SERVICE_AUTO_START
  - id: sc-delete-command
    desc: sc.exe delete service command
    crit: notable
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+delete\b'
  - id: sc-start-command
    desc: sc.exe start service command
    crit: notable
    conf: 0.95
    # Native loaders often embed the command and invoke it through a shell
    # helper; keep this coverage aligned with the script forms.
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+start\b'
  - id: sc-stop-command
    desc: sc.exe stop service command
    crit: notable
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+stop\b'
  - id: sc-query-command
    desc: sc.exe query service command
    crit: notable
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+q(c|description)\b'

  - id: go-sc-create-command
    desc: Go invokes sc.exe service creation
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: '(?i)exec\.Command\(\s*["'']sc(\.exe)?["'']\s*,\s*["'']create["'']'

  - id: python-win32serviceutil-module
    desc: Imports Python service management module
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: import
      exact: win32serviceutil
  - id: notify-service-status-change
    desc: Register Windows service status callback
    crit: notable
    conf: 0.93
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: NotifyServiceStatusChangeW
  - id: open-sc-manager
    desc: Open service control manager
    crit: component
    conf: 0.85
    if:
      type: symbol
      regex: (^|[./])OpenSCManager[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: metadata/library/data::gcp-go-sdk
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: open-service
    desc: Open existing service handle
    crit: component
    conf: 0.85
    if:
      type: symbol
      regex: (^|[./])OpenService[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: query-service-config
    desc: Query service configuration
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: (^|[./])QueryServiceConfig[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: change-service-config
    desc: Modify service configuration
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: (^|[./])ChangeServiceConfig[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: create-service
    desc: Create Windows service
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      regex: (^|[./])CreateService[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: control-service
    desc: Send service control code
    crit: notable
    conf: 0.86
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: ControlService
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: delete-service
    desc: DeleteService API import
    crit: notable
    conf: 0.84
    if:
      type: symbol
      exact: DeleteService
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: query-service-status
    desc: Query service runtime status
    crit: notable
    conf: 0.82
    if:
      type: symbol
      regex: ^QueryServiceStatus(Ex)?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: start-service
    desc: Start Windows service
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      regex: (^|[./])StartService[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: cscservice-name
    desc: Offline Files service name
    crit: component
    conf: 0.95
    if:
      type: text
      exact: CscService
  - id: start-service-dispatcher
    desc: Start service control dispatcher
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: (^|[./])StartServiceCtrlDispatcher[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: register-service-handler
    desc: Register service control handler
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: (^|[./])RegisterServiceCtrlHandler(Ex)?[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: exported-register-service-entrypoint
    desc: Exported RegisterService entrypoint
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: RegisterService
  - id: set-service-status
    desc: Report service status updates
    crit: notable
    conf: 0.88
    if:
      type: symbol
      regex: (^|[./])SetServiceStatus$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: open-sc-manager-import
    desc: Program opens service control manager
    crit: notable
    conf: 0.95
    if:
      type: import
      regex: ^OpenSCManager[AW]?$
  - id: open-service-import
    desc: Program can open Windows services
    crit: notable
    conf: 0.93
    if:
      type: import
      regex: ^OpenService[AW]?$
  - id: go-open-sc-manager-proc
    desc: Go resolves OpenSCManager proc
    crit: component
    conf: 0.9
    for: [go, pe, dll]
    if:
      type: literal
      exact: OpenSCManagerW
  - id: go-open-service-proc
    desc: Go resolves OpenService proc
    crit: component
    conf: 0.9
    for: [go, pe, dll]
    if:
      type: literal
      exact: OpenServiceW
  - id: create-service-w-reference
    desc: References CreateServiceW service creation API
    crit: notable
    conf: 0.9
    for: [go, pe, dll]
    if:
      type: text
      word: CreateServiceW
  - id: go-control-service-proc
    desc: Go resolves ControlService proc
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: literal
      exact: ControlService
  - id: go-change-service-config-proc
    desc: Go resolves ChangeServiceConfig proc
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: literal
      exact: ChangeServiceConfigW
  - id: go-start-service-proc
    desc: Go resolves StartService proc
    crit: notable
    conf: 0.9
    for: [go, pe, dll]
    if:
      type: literal
      exact: StartServiceW
composite_rules:
  # Nothing here is Go-specific -- both legs are plain ADVAPI32 import checks,
  # and the pair fires on any PE that manages services (it matched a 2008 MFC
  # service EXE). Named for the imports it actually reads; the Go-specific
  # composite that consumes it supplies the Go evidence in its other legs.
  - id: service-create-open-import-pair
    desc: Windows service create/open API import pair
    crit: notable
    conf: 0.9
    for: [pe]
    all:
      - id: create-service
      - id: open-service-import
  - id: service-admin-import-cluster
    desc: Windows service admin import cluster
    crit: notable
    conf: 0.95
    all:
      - id: open-sc-manager-import
    needs: 3
    any:
      - id: create-service
      - id: open-service-import
      - id: start-service
    downgrade:
      any:
        - id: metadata/binary/installer/family/
        - id: metadata/signed/platform/
  - id: reconfigure-and-start-service
    desc: Reconfigure service then start
    crit: notable
    conf: 0.9
    all:
      - id: open-sc-manager
      - id: open-service
      - id: change-service-config
    any:
      - id: start-service
      - id: query-service-config
    unless:
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: service-control-dispatch
    desc: Windows service control dispatch
    crit: notable
    conf: 0.92
    all:
      - id: start-service-dispatcher
      - id: register-service-handler
    any:
      - id: set-service-status
      - id: start-service
    unless:
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: service-dispatch-triad
    desc: Full Windows service dispatch triplet
    crit: notable
    conf: 0.95
    all:
      - id: start-service-dispatcher
      - id: register-service-handler
      - id: set-service-status
    unless:
      - id: well-known/tool/development/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: service-stop-control
    desc: Open and control or delete service API chain
    crit: notable
    conf: 0.92
    all:
      - id: open-sc-manager
      - id: open-service
    any:
      - id: control-service
      - id: delete-service
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: service-status-query
    desc: Query Windows service runtime status
    crit: notable
    conf: 0.85
    all:
      - id: open-sc-manager
      - id: open-service
      - id: query-service-status
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: go-service-install-control
    desc: Go Windows service install control
    crit: notable
    conf: 0.93
    for: [go, pe, dll]
    all:
      - id: go-open-sc-manager-proc
      - id: create-service-w-reference
    any:
      - id: go-open-service-proc
      - id: go-start-service-proc
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: go-service-stop-control
    desc: Go Windows service stop control
    crit: notable
    conf: 0.93
    for: [go]
    all:
      - id: go-open-sc-manager-proc
      - id: go-open-service-proc
      - id: go-control-service-proc
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: go-service-reconfigure-control
    desc: Go Windows service reconfigure control
    crit: notable
    conf: 0.93
    for: [go]
    all:
      - id: go-open-sc-manager-proc
      - id: go-open-service-proc
      - id: go-change-service-config-proc
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: service-admin-with-winhttp
    desc: Service administration combined with WinHTTP request capability
    crit: notable
    conf: 0.9
    all:
      - id: service-admin-import-cluster
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow

  - id: service-auto-start-setting
    desc: Windows service automatic-start setting
    # Any spelling of "this service starts at boot" — the sc.exe argument, the
    # Win32/.NET property, the PowerShell cmdlet parameter, or the Win32
    # constant. Downstream composites pair this with a payload location, so
    # they only need the boot-persistence fact, not which API expressed it.
    crit: notable
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    any:
      - id: service-auto-start-argument
      - id: service-start-type-property
      - id: service-startuptype-parameter
      - id: service-auto-start-constant

  - id: sc-local-system-auto-start
    desc: LocalSystem auto-start service creation
    crit: suspicious
    conf: 0.95
    for: [powershell, batch, csharp, go, c, cpp]
    all:
      - id: sc-local-system-service-create
      - id: sc-auto-start-service-create
    near_bytes: 240

  - id: sc-create-start-sequence
    desc: sc.exe creates and starts a service
    crit: suspicious
    conf: 0.93
    for: [powershell, batch, csharp]
    all:
      - id: sc-create-command
      - id: sc-start-command
    near_lines: 2
