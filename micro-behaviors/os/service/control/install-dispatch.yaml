defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # SCM creation/dispatch APIs and service configuration references describe
  # service administration. They do not prove unwanted reactivation, a write
  # to ImagePath, or a linked runtime installation sequence.
  - id: service-create-dispatch-api-profile
    desc: Service create/dispatch and configuration APIs
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/control::open-sc-manager
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/service/dispatch::service-control-dispatch
    any:
      - id: micro-behaviors/os/registry/keys/service::service-key-format-string
      - id: micro-behaviors/os/registry/keys/service::escaped-service-imagepath-registry-path
      - id: micro-behaviors/os/service/configure::sc-config-binpath
    unless:
      - id: metadata/signed/unknown::brave-software
      - id: well-known/app/storage/syncback/
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-rootkit-revealer
