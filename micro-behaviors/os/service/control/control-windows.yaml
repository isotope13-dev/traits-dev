defaults:
  crit: notable
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: open-sc-manager
    desc: Open service control manager
    conf: 0.85
    if:
      type: symbol
      regex: (^|[./])OpenSCManager[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/lib/cloud/google-cloud-go::binary-module-path
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: open-service
    desc: Open existing service handle
    conf: 0.85
    if:
      type: symbol
      regex: (^|[./])OpenService[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: control-service
    desc: Send service control code
    conf: 0.86
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: ControlService
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
  - id: go-open-sc-manager-proc
    desc: Go resolves OpenSCManager proc
    conf: 0.9
    for: [go, pe, dll]
    if:
      type: literal
      exact: OpenSCManagerW
  - id: go-open-service-proc
    desc: Go resolves OpenService proc
    conf: 0.9
    for: [go, pe, dll]
    if:
      type: literal
      exact: OpenServiceW
  - id: go-control-service-proc
    desc: Go resolves ControlService proc
    conf: 0.9
    for: [go]
    if:
      type: literal
      exact: ControlService
composite_rules:
  - id: service-admin-import-cluster
    desc: Windows service admin import cluster
    conf: 0.95
    all:
      - id: open-sc-manager
    needs: 3
    any:
      - id: micro-behaviors/os/service/create::create-service
      - id: open-service
      - id: micro-behaviors/os/service/start::start-service
    downgrade:
      any:
        - id: metadata/binary/installer/family/
        - id: metadata/signed/platform/
  - id: service-admin-with-winhttp
    desc: Service administration combined with WinHTTP request capability
    conf: 0.9
    all:
      - id: service-admin-import-cluster
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow

