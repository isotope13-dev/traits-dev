defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: security-names-with-service-control-apis
  desc: Security names with service-control APIs
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/security/product::security-product-process-image
  - id: micro-behaviors/os/service/configure::change-service-config
  any:
  - id: micro-behaviors/os/service/control::control-service
  - id: micro-behaviors/os/service/delete::delete-service
  unless:
  - id: well-known/tool/sysadmin/iobit-unlocker::iobit-unlocker-application-context
  - id: well-known/tool/sysadmin/iobit-unlocker::iobit-unlocker-installer-context
  - id: well-known/app/system/iobit::iobit-component-context
  - id: well-known/app/enterprise/microsoft-office-c2r::office-setupodt-pdb-stem
  - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-c2r-client-context
