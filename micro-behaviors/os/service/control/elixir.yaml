defaults:
  for: [elixir]
  platforms: [linux]
  crit: notable
  conf: 0.95

traits:
  - id: elixir-systemctl-command
    desc: Elixir invokes systemd service manager
    if:
      type: symbol
      kind: call
      exact: System.cmd
      arg:
        index: 0
        kind: string
        regex: '^(?:/usr/bin/|/bin/)?systemctl$'
