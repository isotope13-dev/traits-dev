defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: open-control-or-delete-api-set
    desc: Service open and control-or-delete API references
    conf: 0.92
    all:
      - id: micro-behaviors/os/service/control::open-sc-manager
      - id: micro-behaviors/os/service/control::open-service
    any:
      - id: micro-behaviors/os/service/control::control-service
      - id: micro-behaviors/os/service/delete::delete-service
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
