defaults:
  crit: notable
  for:
    - shell
    - elf
  platforms:
    - linux
traits:
  - id: systemctl-word
    desc: References systemctl service manager
    conf: 0.7
    if:
      type: text
      regex: '(?m)(^|[;&|(!]|\b(if|then|do|else|elif|while|until|exec)\b)\s*(sudo\s+)?systemctl(\s|$)'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
  - id: systemctl-templated-target
    desc: systemctl targets a format placeholder
    conf: 0.8
    platforms: [unix]
    for: [shell, python, javascript, source]
    if:
      type: text
      regex: 'systemctl\s+(disable|stop)\s+["'']?[{$%]'

  - id: python-systemctl-user-argv
    desc: Python invokes systemctl user service
    conf: 0.82
    for: [python]
    if:
      type: text
      regex: '\[\s*["'']systemctl["'']\s*,\s*["'']--user["'']'
    unless:
      - id: micro-behaviors/os/service/user-session::python-managed-user-service-context
  - id: python-launchctl-argv
    desc: Python invokes launchctl service control
    conf: 0.82
    for: [python]
    platforms: [macos]
    if:
      type: text
      regex: '\[\s*["'']launchctl["'']'
    unless:
      - id: micro-behaviors/os/service/user-session::python-managed-user-service-context
  - id: javascript-systemctl-user-service-command
    desc: JavaScript invokes systemd user service
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'systemctl\s+--user\s+(stop|restart|start)'
  - id: javascript-launchctl-service-command
    desc: JavaScript invokes a launchd service command
    conf: 0.86
    for: [javascript, typescript]
    platforms: [macos]
    if:
      type: text
      regex: 'launchctl\s+(unload|load)'
  - id: chkconfig-word
    desc: Checks for the chkconfig service tool
    conf: 0.7
    if:
      type: text
      regex: '(?m)^\s*(which|command\s+-v)\s+chkconfig\b'
  - id: launchctl-command
    desc: launchctl command (manage launchd services)
    conf: 0.7
    mbc: B0028
    attack: T1543.004
    platforms: [macos]
    for: [shell, applescript, python, javascript, c, macho]
    if:
      type: text
      regex: (^|[\s;&|(/])(/bin/)?launchctl(\s|$)
    not:
      - regex: completions/launchctl\.fish|complete --command launchctl|Opens the launchctl daemon file
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: native-systemd-unit-name
    desc: Native binary embeds a systemd unit name
    conf: 0.86
    for: [elf]
    if:
      type: text
      regex: '^[A-Za-z0-9_.@-]+\.service$'
    not:
      - regex: '^(com|java|javax|net|org)\.'
  - id: systemctl-enable-command
    desc: Enables a systemd service to start automatically
    for: [shell, python, systemd, go, rust, objc, c, cpp]
    conf: 0.8
    mbc: B0028
    unless:
    - type: text
      substr: 'Source: https://docs.docker.com/engine/install/linux-postinstall/'
    - type: text
      substr: '# Configure Docker to boot up with the OS'
    - type: text
      regex: '\bsystemctl\s[\w \t-]{0,40}\benable\s[\w \t-]{0,20}\bdocker\b'
    - type: text
      regex: '\bsystemctl\s[\w \t-]{0,40}\benable\s[\w \t-]{0,20}\bearlyoom\b'
    - type: basename
      regex: '(^|[\\/])(README|REQUIREMENTS|INSTALL)(\.[A-Za-z0-9]+)?$'
    - id: metadata/file/extension/identity::markdown-file-basename
    # Options such as --user or --now may precede the verb, and shell keywords
    # (`if ! systemctl --user enable ...`) may start the line.
    if:
      type: text
      regex: '(?m)^[ \t!]*((if|then|do|else|while)[ \t!]+)?(sudo\s+)?systemctl\s[\w \t-]{0,40}\benable\b'
    downgrade:
      any:
      - id: well-known/tool/sysadmin/kubernetes
  - id: systemctl-enable-on-line
    desc: systemctl and enable on one line
    for: [scripts, source]
    conf: 0.9
    if:
      type: text
      regex: '\bsystemctl\b.{0,100}\benable\b'
  - id: systemctl-string-literal
    desc: String literal names systemctl
    for: [scripts, source]
    conf: 0.9
    if:
      type: string_literal
      exact: systemctl
composite_rules:
  - id: service-cmd
    desc: service command with action
    conf: 0.7
    any:
      - id: micro-behaviors/os/service/start::service-start
      - id: micro-behaviors/os/service/stop::service-stop
      - id: micro-behaviors/os/service/start::service-restart
  - id: service-control
    desc: Service control commands
    conf: 0.7
    any:
      - id: systemctl-word
      - id: service-cmd
      - id: chkconfig-word
      - id: micro-behaviors/os/service/stop::launchctl-stop-command
  - id: launchctl-refresh-gui-service
    desc: launchctl bootout and bootstrap refresh
    conf: 0.9
    platforms: [macos]
    for: [macho, c]
    all:
      - id: micro-behaviors/os/service/stop::launchctl-bootout-gui
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-gui
