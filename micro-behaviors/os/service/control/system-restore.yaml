# System Restore is a Windows OS control API. Recovery-impact intent belongs
# in objectives/impact/degrade/system/recovery/ and references this atom.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: sr-set-restore-point
    desc: Windows System Restore create API reference
    if:
      type: text
      substr: SRSetRestorePoint
