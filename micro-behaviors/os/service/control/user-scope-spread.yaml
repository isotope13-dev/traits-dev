# Node installers often compute the systemd scope once (`const scope = user ?
# [] : ["--user"]`) and then spread it into each systemctl argv:
# `run(systemctl, [...scope, "enable", "--now", unit])`. The literal `--user`
# and the verb never share a line, so the same-line user-enable composite
# misses this shape. These atoms keep the spread-argv form visible.
defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: systemctl-user-scope-literal
    desc: JavaScript names the systemd user scope flag
    crit: component
    if:
      type: text
      regex: '["'']--user["'']'

  - id: systemctl-spread-enable-argv
    desc: systemctl argv spreads scope before enable
    crit: component
    if:
      type: text
      regex: '\[\s*\.\.\.[A-Za-z_$][\w$]{0,40}\s*,\s*["'']enable["'']'

composite_rules:
  - id: source-systemctl-user-spread-enable
    desc: Script enables a user systemd unit with spread argv
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/service/control::systemctl-string-literal
      - id: micro-behaviors/os/service/control::systemctl-user-scope-literal
      - id: micro-behaviors/os/service/control::systemctl-spread-enable-argv
