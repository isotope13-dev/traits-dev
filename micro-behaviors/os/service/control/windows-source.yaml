defaults:
  for: [c, cpp]
  platforms: [windows]

traits:
  - id: dllmain-service-dispatcher-source
    desc: DLL entrypoint starts service dispatcher
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'DllMain[\s\S]{0,400}StartServiceCtrlDispatcher[AW]?'

  - id: change-service-config-disabled
    desc: Configures a Windows service as disabled
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|[./])ChangeServiceConfig[AW]?$'
      arg:
        kind: identifier
        name: SERVICE_DISABLED
