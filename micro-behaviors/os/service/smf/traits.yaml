# Solaris Service Management Facility declarations are neutral service
# configuration capabilities.  Persistence intent belongs to objective
# composites that combine these with an actual import, enable, or write.
defaults:
  platforms: [unix]
  for: [shell, python, go, elf]
  crit: notable
  conf: 0.85

traits:
  - id: service-bundle-declaration
    desc: Solaris SMF service bundle declaration
    if:
      type: text
      regex: '<service_bundle type=[''\"]manifest[''\"]'

  - id: root-method-credential
    desc: Solaris SMF method runs as root
    if:
      type: text
      regex: '<method_credential\s+user=[''\"]root[''\"]'
