defaults:
  crit: notable
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: sc-delete-command
    desc: sc.exe delete service command
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+delete\b'
  - id: delete-service
    desc: DeleteService API import
    conf: 0.84
    if:
      type: symbol
      exact: DeleteService
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
  # Raw-SMB lateral tools (Invoke-SMBExec) build the SVCCTL delete packet by
  # hand instead of importing DeleteService; mirror of scm-create-service-packet.
  - id: scm-delete-service-packet
    desc: Calls SCM DeleteServiceW packet builder
    conf: 0.96
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*\$\w+\s*=\s*Get-PacketSCMDeleteServiceW\b'
  # PsExec-style modules resolve DeleteService at runtime and invoke the
  # delegate to tear down the ephemeral remote service afterward.
  - id: powershell-delete-service-delegate-call
    desc: PowerShell invokes a DeleteService delegate
    conf: 0.96
    for: [powershell]
    if:
      type: text
      regex: '\$DeleteService\.invoke\('
      case_insensitive: true
