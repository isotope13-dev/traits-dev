defaults:
  crit: notable
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: sc-delete-command
    desc: sc.exe delete service command
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+delete\b'
  - id: delete-service
    desc: DeleteService API import
    conf: 0.84
    if:
      type: symbol
      exact: DeleteService
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
