# Neutral systemd restart policy facts. Restarting a service indefinitely can
# support availability or persistence; the objective composites supply the
# startup, delivery, or suspicious-path context that distinguishes intent.
defaults:
  crit: notable
  platforms: [linux]
  for: [systemd]

traits:
- id: embedded-restart-always-policy
  desc: Embeds a systemd always-restart policy in source
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: literal
    kind: string
    word: "Restart=always"

- id: restart-always-text
  desc: Systemd service restart policy is always
  crit: notable
  conf: 0.7
  # Unit templates are independent of their carrier language. JavaScript and
  # TypeScript have the parser-backed embedded-restart-always-policy above.
  for: [scripts, '!javascript', source, '!typescript', elf, systemd-service]
  if:
    type: text
    word: "Restart=always"
  unless:
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
    - type: path
      regex: '(?i)contrib/systemd/[^/]+\.service$'

- id: restart-always-kv
  desc: Systemd service restart policy is always
  crit: notable
  if:
    type: value
    path: "service.restart"
    exact: "always"

composite_rules:
- id: restart-always
  desc: Systemd service is configured to restart indefinitely
  crit: notable
  for: [scripts, source, elf, systemd-service]
  any:
  - id: embedded-restart-always-policy
  - id: restart-always-text
  - id: restart-always-kv
  downgrade:
    any:
    - id: metadata/file/catalog/service::deployment-helper-context
