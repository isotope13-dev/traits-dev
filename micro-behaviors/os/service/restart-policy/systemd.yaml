# Neutral systemd restart policy facts. Restarting a service indefinitely can
# support availability or persistence; the objective composites supply the
# startup, delivery, or suspicious-path context that distinguishes intent.
defaults:
  platforms: [linux]
  for: [systemd]

traits:
- id: embedded-restart-always-policy
  desc: Embeds a systemd always-restart policy in source
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: literal
    kind: string
    word: "Restart=always"

- id: restart-always-text
  desc: Systemd service restart policy is always
  crit: notable
  conf: 0.7
  # C/C++ implants embed unit bodies as string literals, same as Go/Rust.
  for: [shell, python, systemd, go, rust, objc, elf, c, cpp]
  if:
    type: text
    word: "Restart=always"
  unless:
    - id: metadata/lang/source::linux-kernel-primary-tree-path
    - type: path
      regex: '(?i)contrib/systemd/[^/]+\.service$'

- id: restart-always-kv
  desc: Systemd service restart policy is always
  crit: component
  if:
    type: value
    path: "service.restart"
    exact: "always"

composite_rules:
- id: restart-always
  desc: Systemd service is configured to restart indefinitely
  crit: notable
  any:
  - id: embedded-restart-always-policy
  - id: restart-always-text
  - id: restart-always-kv
  downgrade:
    any:
    - id: metadata/file/catalog/service::deployment-helper-context
