defaults:
  platforms: [android, unix]
  for: [scripts, source]

traits:
  # A restart alone says nothing about the daemon's UID. Root requests are
  # separate privilege evidence; neither observation implies APK sideloading.
  - id: android-adbd-restart-command
    desc: Requests Android debug daemon restart
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'ctl\.restart\s+adbd\b'
