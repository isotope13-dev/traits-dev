defaults:
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  - id: launchdaemon-runatload-source
    desc: LaunchDaemons path with enabled RunAtLoad
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/autorun::library-launchdaemons-path
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key
