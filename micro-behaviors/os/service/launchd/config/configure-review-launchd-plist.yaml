# Declarative launchd job settings. Inline interpreter arguments also occur in
# ordinary container launchers and service wrappers; no persistence intent is
# inferred from these fields. Attack-specific launchd composites remain in
# objectives/ and can consume these neutral observations.
defaults:
  platforms: [macos]
  for: [plist]
  conf: 0.8

traits:
  - id: launchd-abandon-process-group
    desc: Launchd abandons the process group
    crit: notable
    conf: 0.76
    if:
      type: value
      path: AbandonProcessGroup
      exact: "true"
  - id: launchd-command-flag
    desc: Launchd argument uses -c or -e
    crit: notable
    conf: 0.82
    if:
      type: value
      path: ProgramArguments[1]
      regex: ^-(c|e)$
  - id: launchd-run-at-load
    desc: Launchd job enables RunAtLoad
    crit: notable
    conf: 0.98
    if:
      type: value
      path: RunAtLoad
      exact: "true"
  - id: launchd-label-keylogger
    desc: Launchd job label identifies a keylogger
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: Label
      regex: '(^|[._-])keylogger([._-]|$)'
      case_insensitive: true
  - id: launchd-program-keylogger
    desc: Launchd program path names a keylogger
    crit: notable
    conf: 0.95
    if:
      type: value
      path: ProgramArguments[0]
      regex: '(^|/)keylogger$'
      case_insensitive: true
  - id: launchd-process-type
    desc: Launchd job configures ProcessType
    crit: baseline
    if:
      type: value
      path: ProcessType
  - id: launchd-environment-variables
    desc: Launchd job configures environment variables
    crit: notable
    if:
      type: value
      path: EnvironmentVariables
  - id: launchd-working-directory
    desc: Launchd job configures WorkingDirectory
    crit: baseline
    if:
      type: value
      path: WorkingDirectory
  - id: launchd-stdout-path
    desc: Launchd job configures stdout redirection
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: StandardOutPath
  - id: launchd-stderr-path
    desc: Launchd job configures stderr redirection
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: StandardErrorPath
  # Standard system and package-manager interpreter locations. This neutral
  # observation also covers /usr/bin/zsh and Homebrew Ruby/Perl wrappers.
  - id: launchd-interpreter-program
    desc: Launchd ProgramArguments selects an interpreter
    crit: notable
    conf: 0.82
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^/((usr/(local/)?)?bin|opt/homebrew/bin)/((ba|z)?sh|python[\d.]*|ruby|perl|osascript)$'
  # A distinct program constraint remains necessary for the osascript-specific
  # remote-pipeline objective; a generic interpreter must never satisfy it.
  - id: launchd-osascript-program
    desc: Launchd selects system osascript
    crit: notable
    conf: 0.78
    if:
      type: value
      path: ProgramArguments[0]
      exact: /usr/bin/osascript

composite_rules:
  - id: launchd-interpreter-command-flag
    desc: Launchd interpreter uses -c or -e
    crit: notable
    conf: 0.88
    all:
      - id: launchd-interpreter-program
      - id: launchd-command-flag
  - id: launchd-abandon-interpreter-command
    desc: Launchd interpreter abandons process group
    crit: notable
    conf: 0.86
    all:
      - id: launchd-abandon-process-group
      - id: launchd-interpreter-command-flag
