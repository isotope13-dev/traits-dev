traits:
- platforms:
  - macos
  - ios
  for:
  - scripts
  - source
  - perl
  - class
  crit: notable
  conf: 0.9
  id: source-runatload-key
  desc: Source contains enabled RunAtLoad setting
  if:
    type: text
    regex: (?i)RunAtLoad[\s\S]{0,80}(<true\s*/>|true\b)
- platforms:
  - macos
  for:
  - scripts
  - source
  - perl
  crit: notable
  conf: 0.9
  id: source-launchd-program-shell-command
  desc: Launchd ProgramArguments run a shell -c command
  if:
    type: text
    regex: (?i)ProgramArguments[\s\S]{0,160}?\b(ba|z|da)?sh\b[\s\S]{0,60}?["'>]-l?c["'<\s]
- platforms:
  - macos
  for:
  - scripts
  - source
  - perl
  crit: notable
  conf: 0.9
  id: source-programarguments-shell-flag
  desc: Launchd ProgramArguments shell command flag
  if:
    type: text
    regex: (?i)ProgramArguments[\s\S]{0,100}["'>]-l?c["'<]
defaults:
  attack: T1543.004
