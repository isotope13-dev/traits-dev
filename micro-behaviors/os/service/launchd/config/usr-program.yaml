# Neutral evidence separated from its objective consumers.
defaults:
  platforms: [macos]
  for: [plist]
traits:
- id: program-usr
  desc: Launchd Program points into /usr
  crit: notable
  if:
    type: value
    path: Program
    regex: ^/usr/

- id: progargs-usr
  desc: Launchd first argument points into /usr
  crit: notable
  if:
    type: value
    path: ProgramArguments[0]
    regex: ^/usr/
