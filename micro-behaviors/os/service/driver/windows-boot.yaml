# Windows driver service load-order configuration.
defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp, csharp, powershell, batch, go, rust, python]

traits:
  - id: boot-bus-extender-group
    desc: Boot Bus Extender driver group
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bBoot Bus Extender\b'
