# Windows driver service load-order configuration.
defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp, csharp, powershell, batch, go, rust, python]

traits:
  - id: boot-bus-extender-group
    desc: Boot Bus Extender driver group
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bBoot Bus Extender\b'

composite_rules:
  - id: direct-boot-bus-driver-registry-write
    desc: Writes a Boot Bus Extender driver service directly through the registry
    crit: notable
    conf: 0.98
    all:
      - id: boot-bus-extender-group
      - id: micro-behaviors/os/registry/keys::system-services-registry-path
    any:
      - id: micro-behaviors/os/registry/access::reg-create-key-ex-w
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-text
      - id: micro-behaviors/os/registry/write/property::powershell-registry-property-cmd
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
