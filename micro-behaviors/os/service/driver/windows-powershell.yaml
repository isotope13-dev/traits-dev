# PowerShell kernel-driver service deployment variants.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.92

traits:
  - id: powershell-driver-path-array
    desc: PowerShell array of SYS driver paths
    if:
      type: text
      regex: '(?is)\$[A-Za-z_][A-Za-z0-9_]*\s*=\s*@\(.{0,320}\.sys\b.{0,320}\)'

  - id: powershell-driver-service-variable
    desc: PowerShell New-Service uses a driver variable
    if:
      type: text
      regex: '(?i)\bNew-Service\b[^\r\n]{0,180}-BinaryPathName\s+\$[A-Za-z_][A-Za-z0-9_]*(\[[0-9]+\])?'

composite_rules:
  - id: powershell-driver-service-variable-command
    desc: PowerShell driver service from array path
    crit: notable
    conf: 0.95
    all:
      - id: powershell-driver-path-array
      - id: powershell-driver-service-variable
    near_bytes: 768
