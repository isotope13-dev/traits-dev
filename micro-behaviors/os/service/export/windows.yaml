# Windows Service Capabilities
# Detects mechanics related to Windows Service execution
defaults:
  crit: notable
  for: [pe]
  platforms: [windows]
traits:
  - id: win-service-export
    desc: "Exported ServiceMain func (Win Service)"
    conf: 1.0
    if:
      type: symbol
      exact: "ServiceMain"

  - id: source-registerservice-export
    desc: C source exports RegisterService entrypoint
    conf: 0.94
    for: [c, cpp]
    if:
      type: text
      regex: '__declspec\s*\(\s*dllexport\s*\)\s+void\s+RegisterService\s*\('
