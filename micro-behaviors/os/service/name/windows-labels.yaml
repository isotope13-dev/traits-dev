defaults:
  platforms:
  - windows
traits:
- crit: notable
  id: windowsupdate-identifier-reference
  desc: WindowsUpdate identifier reference
  conf: 0.84
  for:
  - pe
  - batch
  if:
    type: text
    exact: WindowsUpdate
    section: .text
- id: systemupdate-label-reference
  desc: References SystemUpdate label
  crit: notable
  conf: 0.8
  for:
  - go
  - pe
  - dll
  if:
    type: text
    word: SystemUpdate
- id: trustedinstaller-label-reference
  desc: References TrustedInstaller label
  crit: component
  conf: 0.8
  for:
  - go
  - pe
  - dll
  if:
    type: text
    word: TrustedInstaller
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
    - id: metadata/binary/vendor/
    - id: well-known/lib/format/
    - id: metadata/binary/installer/sfx/
  unless:
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
