defaults:
  platforms: [macos]
  for: [scripts, source, binaries]

traits:
  # The preference domain the macOS SMB server reads its settings from.
  # Naming it is configuration of the built-in file-sharing service.
  - id: apple-smb-preferences-domain
    desc: macOS SMB preferences domain
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: com.apple.smb.preferences
