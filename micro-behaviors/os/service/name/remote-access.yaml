# Neutral observations and discriminating identities.
defaults:
  platforms: [windows]
traits:
- for:
  - pe
  - dll
  - scripts
  - source
  - data
  - text
  - msi
  - oledoc
  id: remote-access-service-name
  desc: Remote Access Service name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: Remote Access Service
# Relocated from objectives/persistence/login/self-install/remote-support,
# where it was the suspicious `teamviewer-service-binary`. The matcher only
# detects a reference to the TeamViewer service binary name: inventory,
# support tooling, and audit tools name it without installing anything, so
# the persistence verdict belongs to the commercial-rat-service-mode
# composite (service-registry legs), not the bare string.
- for:
  - pe
  - dll
  - batch
  - powershell
  id: teamviewer-service-name
  desc: TeamViewer service binary reference
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'TeamViewer_Service(\.exe)?'
    case_insensitive: true
