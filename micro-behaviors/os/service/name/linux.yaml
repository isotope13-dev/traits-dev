defaults:
  platforms: [linux]
  for: [elf, shell, source, scripts]

traits:
  # The Docker daemon's unit. Rules about stopping, modifying or persisting
  # via systemd units treat it as an ordinary dependency target: container
  # tooling orders itself against docker.service constantly.
  - id: docker-service-unit-name
    desc: Docker daemon systemd unit name
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: docker.service
  - id: network-dispatch-service-name
    desc: network-dispatch systemd service name
    crit: notable
    conf: 0.93
    if:
      type: text
      exact: network-dispatch.service
