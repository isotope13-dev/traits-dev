# Secondary Logon (seclogon) backs RunAs and CreateProcessWithLogon. Hardened
# hosts disable it, so a script that re-enables it changes host policy.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1569.002
traits:
  - id: batch-seclogon-service-enable
    desc: Sets Secondary Logon service to start
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+config\s+seclogon\s+start\s*=\s*(auto|demand)'
