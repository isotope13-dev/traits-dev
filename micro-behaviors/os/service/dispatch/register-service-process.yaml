defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: register-service-process-name
    desc: References Windows 9x RegisterServiceProcess API
    crit: notable
    conf: 0.95
    if:
      type: text
      word: "RegisterServiceProcess"
      section: any
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
