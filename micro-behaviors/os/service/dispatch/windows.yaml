defaults:
  crit: notable
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: python-win32serviceutil-module
    desc: Imports Python service management module
    conf: 0.9
    for: [python]
    if:
      type: import
      exact: win32serviceutil
  - id: notify-service-status-change
    desc: Register Windows service status callback
    conf: 0.93
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: NotifyServiceStatusChangeW
  - id: start-service-dispatcher
    desc: Start service control dispatcher
    conf: 0.9
    if:
      type: symbol
      regex: (^|[./])StartServiceCtrlDispatcher[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: register-service-handler
    desc: Register service control handler
    conf: 0.9
    if:
      type: symbol
      regex: (^|[./])RegisterServiceCtrlHandler(Ex)?[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: exported-register-service-entrypoint
    desc: Exported RegisterService entrypoint
    conf: 0.95
    if:
      type: export
      exact: RegisterService
  - id: set-service-status
    desc: Report service status updates
    conf: 0.88
    if:
      type: symbol
      regex: (^|[./])SetServiceStatus$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  # Rust binaries linked with windows-sys resolve these entry points through a
  # table of NUL-terminated API names instead of PE imports, so the import-based
  # atoms above never see them and text extraction does not split them out.
  # The names are the same three service-host calls.
  - id: start-service-dispatcher-name
    desc: Service dispatcher API name string
    conf: 0.85
    for: [pe]
    if:
      type: raw
      regex: '(?-u:StartServiceCtrlDispatcherW\x00)'
  - id: register-service-handler-name
    desc: Service control handler API name string
    conf: 0.85
    for: [pe]
    if:
      type: raw
      regex: '(?-u:RegisterServiceCtrlHandlerExW\x00)'
  - id: set-service-status-name
    desc: Service status report API name string
    conf: 0.85
    for: [pe]
    if:
      type: raw
      regex: '(?-u:SetServiceStatus\x00)'
composite_rules:
  - id: service-dispatch-triad-by-name
    desc: Service dispatch triplet named in strings
    conf: 0.9
    for: [pe]
    all:
      - id: start-service-dispatcher-name
      - id: register-service-handler-name
      - id: set-service-status-name
  - id: service-control-dispatch
    desc: Windows service control dispatch
    conf: 0.92
    all:
      - id: start-service-dispatcher
      - id: register-service-handler
    any:
      - id: set-service-status
      - id: micro-behaviors/os/service/start::start-service
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: service-dispatch-triad
    desc: Full Windows service dispatch triplet
    conf: 0.95
    all:
      - id: start-service-dispatcher
      - id: register-service-handler
      - id: set-service-status
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
