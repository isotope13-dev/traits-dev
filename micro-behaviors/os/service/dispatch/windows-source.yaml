defaults:
  for: [c, cpp]
  platforms: [windows]
traits:
  - id: dllmain-service-dispatcher-source
    desc: DLL entrypoint starts service dispatcher
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'DllMain[\s\S]{0,400}StartServiceCtrlDispatcher[AW]?'

  - id: service-dispatcher-source-call
    desc: Starts Windows service control dispatcher
    crit: notable
    conf: 0.9
    for: [c, cpp, go, rust, csharp]
    attack: T1543.003
    if:
      type: text
      regex: '(?i)(\bStartServiceCtrlDispatcher|\bwinsvc\.Run\b|\bsvc\.Run\s*\()'

composite_rules:
  - id: windows-service-dispatch-any
    desc: Registers or runs a Windows service dispatcher
    crit: notable
    conf: 0.92
    for: [pe, dll, c, cpp, go, rust, csharp, python]
    attack: T1543.003
    any:
      - id: service-control-dispatch
      - id: service-dispatch-triad-by-name
      - id: python-win32serviceutil-module
      - id: service-dispatcher-source-call


