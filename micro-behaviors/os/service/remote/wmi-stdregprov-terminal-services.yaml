# StdRegProv Set*Value calls on Terminal Services keys: the service start
# type, TSEnabled, or the RDP-Tcp listener PortNumber are changed through
# the WMI registry provider (local or remote).
defaults:
  platforms: [windows]
  for: [vbs, html, javascript]
  attack: T1112

traits:
  - id: stdregprov-terminal-services-write
    desc: WMI registry write to Terminal Services keys
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.SetDWORDValue\s*\(?\s*\w+\s*,\s*"[^"]{0,40}\\(Terminal Server|TermService|TermDD)"'
  - id: stdregprov-rdp-port-number-write
    desc: WMI registry write to RDP listener port
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.SetDWORDValue\s*\(?\s*\w+\s*,\s*"[^"]{0,80}\\RDP-Tcp"\s*,\s*"PortNumber"'
