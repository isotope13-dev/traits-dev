# `source` is in `for:` alongside scripts and PE: the registry values and
# service names below identify RDP enablement wherever they are written, and
# compiled-language implants (C#, Go, Rust, C++) reach the same keys through
# the registry API rather than through reg.exe.
defaults:
  platforms: [windows]
  for: [scripts, source, pe]
  attack: T1021.001
  mbc: B0022

traits:
  - id: rdp-registry-allow-connections
    desc: RDP allow-connections zero setting
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfDenyTSConnections\b[^\r\n]{0,100}(\b0\b|-Value\s+0)'

