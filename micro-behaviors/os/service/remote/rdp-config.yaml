defaults:
  platforms:
  - windows
traits:
- id: batch-enable-rdp-registry
  desc: Batch enables RDP registry
  for:
  - batch
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)reg\s+add.{0,120}Terminal Server.{0,80}fDenyTSConnections.{0,80}/d\s+0\b
- id: rdp-service-autostart
  desc: Terminal Services set to auto-start
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\bsc(\.exe)?\s+config\s+TermService\b[^\r\n]{0,80}\bauto\b
- id: powershell-termservice-name
  desc: PowerShell targets Terminal Services
  for:
  - powershell
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\bSet-Service\b[^\r\n]{0,80}\bTermService\b
- id: rdp-connections-allowed-setting
  desc: RDP deny-connections setting is zero
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\bfDenyTSConnections\b[^\r\n]{0,100}(\b0\b|-Value\s+0)
- id: rdp-concurrent-session-setting
  desc: Concurrent Terminal Server session setting
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: (?i)\bEnableConcurrentSessions\b[^\r\n]{0,120}(\b1\b|00000001|true)
- id: rdp-multiple-session-setting
  desc: AllowMultipleTSSessions enabled setting
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: (?i)\bAllowMultipleTSSessions\b[^\r\n]{0,120}(\b1\b|00000001|true)
composite_rules:
- id: batch-enables-rdp-access
  desc: Batch enables remote desktop access
  for:
  - batch
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/service/remote::batch-enable-rdp-registry
  - id: micro-behaviors/os/firewall/netsh::batch-netsh-remotedesktop-enable
  - id: micro-behaviors/os/firewall/netsh::batch-netsh-open-rdp-port
- id: batch-advfirewall-rdp-wmi-enable
  desc: Batch opens RDP and remote WMI via advfirewall
  for:
  - batch
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/service/remote::batch-enable-rdp-registry
  - id: micro-behaviors/os/firewall/netsh::batch-advfirewall-rdp-allow-rule
  - id: micro-behaviors/os/firewall/netsh::batch-advfirewall-wmi-enable
- id: windows-rdp-enable-sequence
  desc: RDP service, connection and firewall settings
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/service/remote::rdp-service-autostart
  - id: micro-behaviors/os/service/remote::rdp-connections-allowed-setting
  - id: micro-behaviors/os/firewall/netsh::rdp-firewall-enable
  near_lines: 6
- id: powershell-rdp-service-autostart
  desc: PowerShell sets Terminal Services auto-start
  for:
  - powershell
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/remote::powershell-termservice-name
  - id: micro-behaviors/os/service/configure::service-auto-start-setting
  near_lines: 2
- id: registry-rdp-concurrent-session-configuration
  desc: RDP and concurrent-session configuration
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/service/remote::rdp-connections-allowed-setting
  - id: micro-behaviors/os/firewall/netsh::rdp-firewall-enabled-tcp-3389-value
  any:
  - id: micro-behaviors/os/service/remote::rdp-concurrent-session-setting
  - id: micro-behaviors/os/service/remote::rdp-multiple-session-setting
  needs: 2
