defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: freerdp-vchan-manager-exports
  desc: FreeRDP virtual channel manager exports
  crit: notable
  conf: 0.94
  if:
    type: symbol
    regex: ^WTSVirtualChannelManager
- id: freerdp-rdpgfx-exports
  desc: FreeRDP graphics channel exports
  crit: notable
  conf: 0.94
  if:
    type: symbol
    regex: ^rdpgfx_client_context_
- id: freerdp-assistance-export
  desc: FreeRDP assistance session export
  crit: notable
  conf: 0.93
  if:
    type: symbol
    exact: freerdp_assistance_set_connection_string2
- id: freerdp-keyboard-layout-export
  desc: FreeRDP keyboard layout export
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: freerdp_keyboard_get_layouts
- id: urbdrc-channel-marker
  desc: RDP USB redirection URBDRC marker
  crit: notable
  conf: 0.95
  for: [python, c, cpp, powershell, batch, pe, dll]
  if:
    type: text
    substr: URBDRC
- id: urbdrc-add-device-token
  desc: ADD_DEVICE USB message token
  crit: notable
  conf: 0.94
  for: [python, c, cpp, powershell, batch, pe, dll]
  if:
    type: text
    substr: ADD_DEVICE
- id: rdp-pnp-redirection-policy
  desc: RDP USB PnP policy setting
  crit: notable
  conf: 0.94
  for: [python, c, cpp, powershell, batch, pe, dll]
  if:
    type: text
    regex: '(?i)(fDisablePNPRedir|fUsbRedirectionEnableMode)'
composite_rules:
- id: freerdp-remote-desktop-stack
  desc: Embedded FreeRDP remote desktop stack
  crit: suspicious
  conf: 0.97
  all:
  - id: freerdp-vchan-manager-exports
  - id: freerdp-rdpgfx-exports
  any:
  - id: freerdp-assistance-export
  - id: freerdp-keyboard-layout-export
- id: rdp-phantom-usb-device
  desc: RDP announces a synthetic USB device
  crit: suspicious
  conf: 0.98
  for: [python, c, cpp, powershell, batch, pe, dll]
  all:
  - id: urbdrc-channel-marker
  - id: urbdrc-add-device-token
  - id: metadata/file/string/device::windows-usb-hardware-id
