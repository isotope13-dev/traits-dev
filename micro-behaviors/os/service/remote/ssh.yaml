defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: sshd-ref
    desc: sshd daemon reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      word: sshd
  - id: sshd-path
    desc: sshd daemon path
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: /usr/sbin/sshd
  - id: ssh-service
    desc: SSH service reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      substr: ssh.service

  - id: sshd-config-test-command
    desc: Validates OpenSSH daemon configuration
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bsshd\s+-t\b'

  - id: sshd-banner-directive
    desc: OpenSSH remote login banner directive
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bBanner\s+/etc/ssh/[A-Za-z0-9._/-]+'

  - id: dropbear-ref
    desc: dropbear SSH daemon reference
    crit: baseline
    conf: 0.45
    if:
      type: text
      word: dropbear
  - id: dropbear-server-args
    desc: dropbear server-side execution arguments
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bdropbear\s+[^&;|\n]{0,60}-[pFrE]'

composite_rules:
  - id: ssh-service-setup
    desc: SSH daemon service setup
    crit: notable
    conf: 0.8
    unless:
      # libcurl's configure.ac only probes for an sshd test server; it does
      # not install or start an SSH service. Keep this path-specific so a
      # real SSH setup elsewhere in a curl source tree remains visible.
      - id: well-known/lib/network/curl::configure-ac-path
    all:
      - id: sshd-ref
    any:
      - id: sshd-path
      - id: ssh-service
