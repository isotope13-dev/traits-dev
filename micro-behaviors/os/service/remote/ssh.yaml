defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: sshd-ref
    desc: sshd daemon reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      word: sshd
  - id: sshd-path
    desc: sshd daemon path
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: /usr/sbin/sshd
  - id: ssh-service
    desc: SSH service reference
    crit: baseline
    conf: 0.4
    if:
      type: text
      substr: ssh.service


  - id: sshd-host-key-generate-all
    desc: Generates all sshd host keys
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bssh-keygen\s+-A\b'

  - id: sshd-foreground-flag
    desc: Runs sshd in the foreground
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bsshd\s+-D\b'

  - id: sshd-config-test-command
    desc: Validates OpenSSH daemon configuration
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bsshd\s+-t\b'

  - id: ssh-password-auth-enabled
    desc: SSH daemon enables password authentication
    crit: notable
    conf: 0.9
    for: [elf, shell, github-actions]
    if:
      type: text
      regex: '(PasswordAuthentication yes|PubkeyAuthentication no)'

  - id: dropbear-ref
    desc: dropbear SSH daemon reference
    crit: baseline
    conf: 0.45
    if:
      type: text
      word: dropbear
  - id: dropbear-server-args
    desc: dropbear server-side execution arguments
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bdropbear\s+[^&;|\n]{0,60}-[pFrE]'

composite_rules:
  # `ssh-keygen -A` generates the host keys a fresh container has none of, and
  # `sshd -D` runs the daemon in the foreground as the container's own process
  # rather than handing it to init. Together they are the documented recipe for
  # an SSH-enabled container image, and they are what a backdoor does NOT do:
  # a backdoor edits the host's config and restarts the system service.
  - id: sshd-container-foreground-start
    desc: Generates host keys and runs sshd in foreground
    crit: notable
    conf: 0.9
    all:
      - id: sshd-host-key-generate-all
      - id: sshd-foreground-flag

  - id: ssh-service-setup
    desc: SSH daemon service setup
    crit: notable
    conf: 0.8
    unless:
      # libcurl's configure.ac only probes for an sshd test server; it does
      # not install or start an SSH service. Keep this path-specific so a
      # real SSH setup elsewhere in a curl source tree remains visible.
      - id: well-known/lib/network/curl::configure-ac-path
    all:
      - id: sshd-ref
    any:
      - id: sshd-path
      - id: ssh-service
