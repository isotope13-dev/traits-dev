defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: node-macos-enable-remote-login
  desc: Node source enables macOS Remote Login
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  platforms: [macos]
  if:
    type: text
    regex: 'systemsetup\s+-setremotelogin\s+on\b'
- id: node-windows-install-openssh-server
  desc: Node source installs Windows OpenSSH server
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  platforms: [windows]
  if:
    type: text
    regex: 'Add-WindowsCapability.{0,60}OpenSSH\.Server'
- id: sshd-root-login-disabled
  desc: SSH daemon disables direct root login
  crit: notable
  conf: 0.9
  for:
  - shell
  - github-actions
  - elf
  if:
    type: text
    # A slash before the directive is a sed search (`s/PermitRootLogin no/`),
    # the text being replaced, not a setting the file leaves in place.
    regex: '(?m)^[^#\n/]{0,80}PermitRootLogin[\s\\]+(no|prohibit-password|without-password)'
- id: vagrant-box-root-ssh-provision
  desc: Vagrant box opens root SSH login
  crit: notable
  conf: 0.95
  for:
  - shell
  if:
    type: text
    regex: '(?s)/home/vagrant/\.ssh/authorized_keys.{0,240}PermitRootLogin[\s\\]+yes'
- id: sshd-root-login-enabled
  desc: SSH daemon enables direct root login
  crit: notable
  conf: 0.9
  for:
  - shell
  - github-actions
  if:
    type: text
    # A directive or command, not a `# ... PermitRootLogin yes` comment that
    # explains why a hardening script leaves it alone.
    regex: (?m)^[^#\n]{0,80}PermitRootLogin[\s\\]+yes
  # `sed 's/^PermitRootLogin yes/PermitRootLogin prohibit-password/'` names
  # `yes` as the text to find and replace: it is the hardening edit, whose
  # replacement is the disabled form, not an enabling one.
  not:
  - regex: \bs/\^?#?\s*PermitRootLogin[\s\\]+yes
  unless:
  - id: metadata/build/recognized-contexts::shell-image-build-install-pip-helper
  - id: metadata/build/recognized-contexts::freebsd-installerconfig-script
  - id: well-known/app/infrastructure/ansible::ansible-python-package-path
  - id: well-known/app/network/openssh/
  - id: well-known/app/infrastructure/vmware-vic::appliance-staging-context
- id: sshd-ref
  desc: sshd daemon reference
  crit: baseline
  conf: 0.4
  if:
    type: text
    regex: (^|[/\s"'])sshd($|[\s"'])
- id: sshd-path
  desc: sshd daemon path
  crit: notable
  conf: 0.5
  if:
    type: text
    substr: /usr/sbin/sshd
- id: ssh-service
  desc: SSH service reference
  crit: baseline
  conf: 0.4
  if:
    type: text
    substr: ssh.service
- id: sshd-host-key-generate-all
  desc: Generates all sshd host keys
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bssh-keygen\s+-A\b
- id: sshd-foreground-flag
  desc: Runs sshd in the foreground
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bsshd\s+-D\b
- id: sshd-config-test-command
  desc: Validates OpenSSH daemon configuration
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bsshd\s+-t\b
- id: sshd-config-sed-edit
  desc: Edits SSH daemon configuration with sed
  crit: notable
  conf: 0.9
  for:
  - shell
  if:
    type: text
    regex: sed\s+-i.{0,80}/etc/ssh/sshd_config
- id: ssh-password-auth-enabled
  desc: SSH daemon enables password authentication
  crit: notable
  conf: 0.9
  for:
  - elf
  - shell
  - github-actions
  if:
    type: text
    regex: (PasswordAuthentication yes|PubkeyAuthentication no)
- id: dropbear-ref
  desc: dropbear SSH daemon reference
  crit: baseline
  conf: 0.45
  if:
    type: text
    word: dropbear
- id: dropbear-server-args
  desc: dropbear server-side execution arguments
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: \bdropbear\s+[^&;|\n]{0,60}-[pFrE]
- id: linux-sshd-enable-or-start
  desc: Enables or starts Linux SSH daemon
  crit: notable
  conf: 0.92
  platforms:
  - linux
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -static-lib
  if:
    type: text
    regex: '\b(systemctl\s+(enable|start)(\s+--now)?\s+ssh(d)?|service\s+ssh(d)?\s+start)\b'
  unless:
  - id: micro-behaviors/os/service/config::bsd-rc-subr-dispatcher
  - id: well-known/tool/sysadmin/automatedlab/
  - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
- id: macos-remote-login-enable
  desc: Enables macOS SSH Remote Login
  crit: notable
  conf: 0.95
  platforms:
  - macos
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -static-lib
  if:
    type: text
    regex: 'systemsetup\s+-setremotelogin\s+on\b'
  not:
  - regex: '`[^`\n]*systemsetup'
- id: windows-openssh-server-install
  desc: Installs Windows OpenSSH Server
  crit: notable
  conf: 0.96
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -static-lib
  if:
    type: text
    regex: '(?i)Add-WindowsCapability\b[^\r\n]{0,80}\bOpenSSH\.Server'
- id: windows-sshd-service-enable
  desc: Starts or enables Windows sshd
  crit: notable
  conf: 0.94
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -static-lib
  if:
    type: text
    regex: '(?i)(Start-Service|Set-Service)\b[^\r\n]{0,60}\bsshd\b'
composite_rules:
- id: windows-sshd-enable
  desc: Installs or starts Windows sshd
  crit: notable
  conf: 0.95
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -static-lib
  any:
  - id: windows-openssh-server-install
  - id: windows-sshd-service-enable
- id: cross-platform-ssh-server-enable
  desc: Enables SSH daemon across OS families
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  - binaries
  - -beam
  - -wasm
  - -static-lib
  needs: 2
  any:
  - id: linux-sshd-enable-or-start
  - id: macos-remote-login-enable
  - id: windows-sshd-enable
- id: sshd-container-foreground-start
  desc: Generates host keys and runs sshd in foreground
  crit: notable
  conf: 0.9
  all:
  - id: sshd-host-key-generate-all
  - id: sshd-foreground-flag
- id: sshd-with-path-or-service-reference
  desc: SSH daemon with path or service reference
  crit: notable
  conf: 0.8
  unless:
  - id: well-known/lib/network/curl::configure-ac-path
  all:
  - id: sshd-ref
  any:
  - id: sshd-path
  - id: ssh-service
