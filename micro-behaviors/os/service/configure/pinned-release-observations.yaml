composite_rules:
- for:
  - python
  - javascript
  - ruby
  - php
  id: launchagent-registration-code
  desc: LaunchAgent path with registration or write APIs
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
  any:
  - id: micro-behaviors/os/service/start::launchctl-bootstrap-subcommand
  - id: micro-behaviors/os/service/start::launchctl-bootstrap-gui
  - id: micro-behaviors/os/service/control::python-launchctl-argv
  - id: micro-behaviors/os/service/launchagent::shell-launchagent-plist-write
  - id: micro-behaviors/os/service/launchagent::shell-launchd-plist-write
  - id: micro-behaviors/os/service/launchagent::plistbuddy-start-interval-edit
  - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text
- for:
  - npm
  - tar
  - package.json
  - javascript
  id: npm-hook-launchagent-code
  desc: Install hook and LaunchAgent registration code coexist
  crit: notable
  conf: 0.97
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::install-hooks
  - id: micro-behaviors/os/service/launchagent::launchagents-directory-reference
  - id: micro-behaviors/os/service/plist::embedded-runatload-true
  - id: micro-behaviors/os/service/plist::embedded-keepalive-key
  - id: micro-behaviors/fs/write/file/full::js-file-write
  any:
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  - id: micro-behaviors/fs/chmod/executable/mode
  - id: micro-behaviors/os/service/control::launchctl-command
defaults:
  platforms:
  - macos
