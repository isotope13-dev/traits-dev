# These imports also occur in ordinary installers. Neither their combination
# nor an absent vendor identity establishes unwanted persistence. Preserve the
# original matching scope; report the capability at notable in every context.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: service-admin-configure-api-profile
    desc: Service administration and configuration API profile
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/control::service-admin-import-cluster
      - id: change-service-config2-w-symbol
    any:
      - id: micro-behaviors/os/service/delete::delete-service
      - id: micro-behaviors/os/service/query::query-service-status
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/exec::create-process-a
    unless:
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/plugin::known-nsis-plugin-basename
      - id: well-known/dual-use/tunnel/clash-verge/
      - id: micro-behaviors/data/archive/extract/cab::cabinet-api-with-uninstall-references
