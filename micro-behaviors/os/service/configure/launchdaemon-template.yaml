defaults:
  platforms: [macos]
  for: [javascript]

composite_rules:
  - id: launchdaemon-runatload-source
    desc: Source contains LaunchDaemons path and enabled RunAtLoad setting
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/launchagent::launchdaemons-path
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
