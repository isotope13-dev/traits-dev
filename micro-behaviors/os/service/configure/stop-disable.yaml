# Neutral observations and discriminating identities.
traits:
- for:
  # Python hosts the same cmdlet text inside strings when a library embeds
  # its PowerShell service loop; the matched evidence is the cmdlet text,
  # unchanged by the host language.
  - powershell
  - python
  platforms:
  - windows
  id: powershell-stop-disable-service-references
  desc: PowerShell stop and disable service references
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: Stop-Service[\s\S]{0,240}Set-Service[\s\S]{0,160}StartupType\s+Disabled
    case_insensitive: true
