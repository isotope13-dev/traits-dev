defaults:
  platforms: [openwrt]
  for: [scripts, source, elf, pyc, -perl]
composite_rules:
  - id: openwrt-init-hidden-background-paths
    desc: OpenWrt init template beside hidden background paths
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/config::init-script-path
      - id: micro-behaviors/os/service/config::rc-common-init-script-header
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
    any:
      - id: micro-behaviors/process/create/local-exec::tmp-path-execution
      - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
      - id: micro-behaviors/communications/http/request/beacon::shell-network-sleep-loop

