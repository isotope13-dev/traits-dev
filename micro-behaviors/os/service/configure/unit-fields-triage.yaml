traits:
- id: unit-hidden-working-directory
  desc: Unit specifies a hidden working directory
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: WorkingDirectory=.{0,120}/\.[^\r\n]{1,80}
  for: &id001
  - systemd
- id: unit-var-tmp-exec-start
  desc: Unit executes a file under /var/tmp
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: ExecStart=/var/tmp/[^\r\n]{1,160}
  for: *id001
- id: unit-sudo-root-local-script
  desc: Unit invokes sudo for a root-local script
  crit: suspicious
  conf: 0.94
  if:
    type: text
    substr: ExecStart=/usr/bin/sudo /bin/bash /root/.local/
  for: *id001
- id: unit-hidden-exec-start-path
  desc: Unit command includes a hidden path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: ExecStart=.{0,120}/\.[^\r\n]{1,80}
  unless:
  - type: text
    regex: ExecStart=%h/\.local/bin/
  - type: text
    regex: ExecStart=[^\r\n]*/\.local/bin/[^\r\n]*
  - type: text
    regex: ExecStart=[^\r\n]*/\.(github|config|venv)/
  - type: text
    regex: ExecStart=[^\r\n]*/\.(cargo|bun)/bin/
  - type: text
    regex: ExecStart=[^\r\n]*/\.claude/
  for: *id001
- id: unit-forking-type
  desc: Unit uses the forking service type
  crit: notable
  if:
    type: text
    regex: (?m)^Type=forking$
  for: *id001
- id: unit-root-local-working-directory
  desc: Unit specifies a root-local working directory
  crit: notable
  if:
    type: text
    regex: (?m)^WorkingDirectory=/root/\.local
  for: *id001
- id: unit-exec-start-var-transient
  desc: ExecStart from transient /var path
  for:
  - systemd
  crit: notable
  if:
    type: value
    path: service.exec_start
    regex: ^/var/(tmp|run)/
- id: unit-exec-start-tmp
  desc: ExecStart from /tmp
  for:
  - systemd
  crit: notable
  if:
    type: value
    path: service.exec_start
    regex: ^/tmp/
- id: unit-exec-start-dev
  desc: ExecStart from /dev
  for:
  - systemd
  crit: notable
  if:
    type: value
    path: service.exec_start
    regex: ^/dev/
- id: unit-exec-start-userwritable-path
  desc: ExecStart from user writable path
  for:
  - systemd
  crit: notable
  conf: 0.7
  if:
    type: value
    path: service.exec_start
    regex: ^/(tmp|var/tmp|dev/shm|run/user)/
composite_rules:
- id: embedded-root-multi-user-unit-policy
  desc: Embedded unit configures root and multi-user startup
  crit: notable
  conf: 0.92
  for:
  - python
  - shell
  - go
  - rust
  - objc
  - elf
  all:
  - id: micro-behaviors/os/service/config::service-runs-as-root
  - id: micro-behaviors/os/service/unit-field::wanted-by-multi-user-text
  near_lines: 20
- id: unit-root-hidden-path
  desc: Root service uses a hidden path
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/service/config::service-runs-as-root
  any:
  - id: micro-behaviors/os/service/configure::unit-hidden-working-directory
  - id: micro-behaviors/os/service/configure::unit-hidden-exec-start-path
  unless:
  - id: well-known/tool/offensive/pwn/
  for: *id001
- id: unit-hidden-connect-ignore-cert
  desc: Hidden unit command connects without certificate verification
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/service/configure::unit-hidden-exec-start-path
  - id: micro-behaviors/communications/socket/configure::unit-connect-target-argument
  - id: micro-behaviors/communications/tls/verify/disable::unit-ignore-cert-argument
  for: *id001
- id: unit-exec-start-dangerous-path
  desc: ExecStart from transient or device path
  crit: suspicious
  conf: 0.9
  any:
  - id: micro-behaviors/os/service/configure::unit-exec-start-var-transient
  - id: micro-behaviors/os/service/configure::unit-exec-start-tmp
  - id: micro-behaviors/os/service/configure::unit-exec-start-dev
  for:
  - shell
  - python
  - systemd
  - go
  - rust
  - objc
  - c
  - cpp
defaults:
  platforms:
  - linux
