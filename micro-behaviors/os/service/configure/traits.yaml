defaults:
  crit: notable
  for:
    - shell
    - elf
  platforms:
    - linux
traits:
  - id: systemctl-disable
    desc: systemctl disables a service
    conf: 0.8
    platforms: [unix]
    for: [shell, python, javascript]
    if:
      type: text
      regex: (?im)(^|[;&|])\s*(sudo\s+)?systemctl\s+disable\s+(--now\s+)?\S+
    not:
      - regex: '(?im)systemctl\s+(--user\s+)?disable\s+(--now\s+)?\S+\.(timer|path|socket)\b'
      - substr: systemctl disable devmon@devmon
      - substr: 'systemctl disable "${SERVICE}"'
      - substr: systemctl disable "${agent_name}.service"
      - regex: (?i)systemctl\s+disable\s+ollama(?:\.service)?\b
      - regex: systemctl\s+disable\s+["'']?policy-routes@\*\.service["'']?
      - regex: (?i)machinectl|systemd-nspawn@XXX|wrapper around `systemctl disable
      - substr: "systemctl disable raised:"
      - regex: '(?m)^%preun\b'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/build/package/
      - id: metadata/package/files/system-package::package-post-remove-script
      - id: metadata/package/documentation/page::static-html-shell
      - id: well-known/app/infrastructure/walinuxagent::source-tree
      - id: well-known/app/system/olares::cli-source-tree
      - id: well-known/app/infrastructure/nuzur/
    downgrade:
      any:
        - id: micro-behaviors/os/package-manager/installer-script::installer-script
        - id: well-known/tool/sysadmin/kubernetes

  - id: loginctl-enable-linger
    desc: References loginctl enable-linger for an account
    conf: 0.86
    for: [shell, python, go, rust, c, cpp, objc, elf]
    if:
      type: text
      regex: '(?i)\bloginctl\s+enable-linger\b'
    unless:
      - id: micro-behaviors/os/service/user-session::python-managed-user-service-context
  - id: launchctl-enable-disable-command
    desc: launchctl service enable or disable command
    conf: 0.88
    platforms: [macos]
    for: [shell, applescript, python, javascript, c, macho]
    if:
      type: text
      regex: '\blaunchctl\s+(enable|disable)\b'
