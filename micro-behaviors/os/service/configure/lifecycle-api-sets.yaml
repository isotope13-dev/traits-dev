defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: service-create-configure-start-api-set
  desc: Service creation, configuration and start API set
  crit: notable
  conf: 0.94
  scope: file
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/create::create-service
  - id: micro-behaviors/os/service/start::start-service
  any:
  - id: micro-behaviors/os/registry/keys::service-key-format-string
  - id: micro-behaviors/os/registry/keys::escaped-service-imagepath-registry-path
  - id: micro-behaviors/os/service/configure::sc-config-binpath
  - id: micro-behaviors/os/service/configure::change-service-config
  unless:
  - id: well-known/app/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/tool/sysadmin/nssm::nssm-service-manager
  - id: well-known/lib/native/
  - id: well-known/dual-use/tunnel/netch::netch-nfapi-component
  - id: metadata/signed/leaf::mullvad-vpn-ab
- id: service-configure-start-registry-api-set
  desc: Service configure/start APIs with registry paths
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/control::open-service
  - id: micro-behaviors/os/service/configure::change-service-config
  - id: micro-behaviors/os/service/start::start-service
  any:
  - id: micro-behaviors/os/registry/keys::service-key-format-string
  - id: micro-behaviors/os/registry/keys::escaped-service-imagepath-registry-path
  - id: micro-behaviors/os/service/configure::sc-config-binpath
  unless:
  - id: metadata/binary/vendor::bitdefender-product-marker
  - id: metadata/binary/framework/
