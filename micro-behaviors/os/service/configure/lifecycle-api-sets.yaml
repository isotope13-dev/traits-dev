defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
composite_rules:
- id: service-create-configure-start-api-set
  desc: Service creation, configuration and start API set
  conf: 0.94
  scope: file
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/create::create-service
  - id: micro-behaviors/os/service/start::start-service
  any:
  - id: micro-behaviors/os/registry/keys/service::service-key-format-string
  - id: micro-behaviors/os/registry/keys/service::escaped-service-imagepath-registry-path
  - id: micro-behaviors/os/service/configure::sc-config-binpath
  - id: micro-behaviors/os/service/configure::change-service-config
- id: service-configure-start-registry-api-set
  desc: Service configure/start APIs with registry paths
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/control::open-service
  - id: micro-behaviors/os/service/configure::change-service-config
  - id: micro-behaviors/os/service/start::start-service
  any:
  - id: micro-behaviors/os/registry/keys/service::service-key-format-string
  - id: micro-behaviors/os/registry/keys/service::escaped-service-imagepath-registry-path
  - id: micro-behaviors/os/service/configure::sc-config-binpath
