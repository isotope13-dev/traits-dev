# References and API co-occurrence do not establish bound data flow.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: service-http-crypto-api-cooccurrence
  desc: Service, HTTP and crypto API references coexist
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: service-crypto-reference-context
  any:
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/network/connections::get-tcp-table
- id: service-crypto-reference-context
  desc: Crypto library or Go crypto package reference
  crit: component
  conf: 0.85
  any:
  - id: micro-behaviors/crypto/library/
  - id: metadata/binary/symbols/name/token::crypt-import-public-key-info-string
  - id: micro-behaviors/crypto/provider/library::crypto-library-context
  - id: metadata/import/builtin::go-crypto-rsa-import
  - id: metadata/import/builtin::go-crypto-aes-import
