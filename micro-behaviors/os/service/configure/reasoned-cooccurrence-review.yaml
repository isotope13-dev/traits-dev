# References and API co-occurrence do not establish bound data flow.
composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: service-http-crypto-api-cooccurrence
  desc: Service, HTTP and crypto API references coexist
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/crypto/library/
  any:
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/os/network/connections::get-tcp-table
