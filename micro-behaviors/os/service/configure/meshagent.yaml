defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99
traits:
  - id: meshagent-edge-service-name-setting
    desc: MeshAgent settings name MicrosoftEdge service
    if:
      type: text
      regex: '(?m)^meshServiceName=MicrosoftEdge\r?$'
  - id: meshagent-edge-display-name-setting
    desc: MeshAgent settings display Microsoft Edge
    if:
      type: text
      regex: '(?m)^displayName=Microsoft Edge\r?$'
