defaults:
  platforms: [macos]
  for: [plist]

traits:
  - id: launchd-apple-label
    desc: Launchd Label starting with com.apple
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: ^com\.apple\.
  - id: launchd-apple-helper-label
    desc: Apple-style helper label
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "Label"
      regex: 'com\.apple\.[a-z0-9.-]{2,30}\.(helper|service|agent|daemon)'
    unless:
      - id: well-known/tool/development/toolchain/darling/
