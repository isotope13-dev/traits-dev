defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: change-service-config2-w-symbol
    desc: ChangeServiceConfig2W API reference
    conf: 1.0
    if:
      type: symbol
      exact: ChangeServiceConfig2W
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
  - id: change-service-config2-ansi
    desc: ChangeServiceConfig2A API name
    conf: 0.9
    if:
      type: text
      regex: (^|[./])ChangeServiceConfig2A$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
