# Evidence-specific placement; matching does not imply attacker intent.
traits:
- platforms:
  - windows
  for:
  - go
  id: go-service-auto-start-constant
  desc: Go references SERVICE_AUTO_START constant
  conf: 0.9
  if:
    type: text
    substr: SERVICE_AUTO_START
- platforms:
  - linux
  for:
  - shell
  - python
  - systemd
  - go
  - rust
  - objc
  - c
  - cpp
  id: systemctl-enable-trigger-unit
  desc: systemctl enables timer path or socket unit
  conf: 0.86
  if:
    type: text
    regex: \bsystemctl\s+(--user\s+)?enable\s+[^\n;]{1,120}\.(timer|socket|path)\b
  unless:
  - id: well-known/app/infrastructure/pvetui::pvetui-workflow-test-script
  downgrade:
    any:
    - id: well-known/tool/sysadmin/kubernetes
- platforms:
  - linux
  for:
  - scripts
  - binaries
  id: openrc-add-service-command
  desc: OpenRC rc-update add service command
  conf: 0.84
  if:
    type: text
    regex: \brc-update\s+add\s+[A-Za-z0-9_.@-]{1,80}\b
  unless:
  - id: well-known/tool/sysadmin/virtualization::lima-virtualization-tool
  - type: basename
    regex: ^limactl(\.exe)?$
composite_rules:
- platforms:
  - linux
  for:
  - scripts
  - binaries
  id: linux-service-manager-config-reference
  desc: Service-manager configuration references
  conf: 0.86
  any:
  - id: micro-behaviors/fs/path/config/system::supervisor-config-file-reference
  - id: micro-behaviors/fs/path/config/system::runit-service-path
  - id: micro-behaviors/fs/path/config/system::s6-service-run-path
  - id: micro-behaviors/os/service/configure::openrc-add-service-command
defaults:
  crit: notable
