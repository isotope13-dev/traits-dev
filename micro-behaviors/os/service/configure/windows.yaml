defaults:
  crit: notable
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: sc-config-command
    desc: sc.exe configure service command
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+config\b'

  - id: service-auto-start-argument
    desc: Windows service automatic-start argument
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    if:
      type: text
      regex: '(?i)\bstart\s*=\s*auto(matic)?\b'

  - id: service-start-type-property
    desc: Service StartType property Automatic
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    if:
      type: text
      regex: '(?i)\bStartType\s*=\s*["'']?Automatic\b'

  - id: service-startuptype-parameter
    desc: Service cmdlet StartupType set Automatic
    # `New-Service`/`Set-Service -StartupType Automatic` is the idiomatic way
    # modern post-exploitation scripts make a service boot-persistent. The
    # parameter is space-separated rather than `=`-assigned, so the sc.exe and
    # Win32 property spellings above do not reach it.
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    if:
      type: text
      regex: '(?i)\bStartupType\s+["'']?Automatic\b'

  - id: service-auto-start-constant
    desc: SERVICE_AUTO_START Win32 constant
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    if:
      type: text
      word: SERVICE_AUTO_START
  - id: change-service-config
    desc: Modify service configuration
    conf: 0.9
    if:
      type: symbol
      regex: (^|[./])ChangeServiceConfig[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: go-change-service-config-proc
    desc: Go resolves ChangeServiceConfig proc
    conf: 0.9
    for: [go]
    if:
      type: literal
      exact: ChangeServiceConfigW
composite_rules:
  - id: reconfigure-and-start-service
    desc: Reconfigure service then start
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/control::open-sc-manager
      - id: micro-behaviors/os/service/control::open-service
      - id: change-service-config
    any:
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/os/service/query::query-service-config
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: go-service-reconfigure-control
    desc: Go Windows service reconfigure control
    conf: 0.93
    for: [go]
    all:
      - id: micro-behaviors/os/service/control::go-open-sc-manager-proc
      - id: micro-behaviors/os/service/control::go-open-service-proc
      - id: go-change-service-config-proc
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: service-auto-start-setting
    desc: Windows service automatic-start setting
    # Any spelling of "this service starts at boot" — the sc.exe argument, the
    # Win32/.NET property, the PowerShell cmdlet parameter, or the Win32
    # constant. Downstream composites pair this with a payload location, so
    # they only need the boot-persistence fact, not which API expressed it.
    conf: 0.9
    for: [batch, powershell, c, cpp, csharp, python]
    any:
      - id: service-auto-start-argument
      - id: service-start-type-property
      - id: service-startuptype-parameter
      - id: service-auto-start-constant

