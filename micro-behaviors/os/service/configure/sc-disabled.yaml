traits:
- platforms:
  - windows
  for:
  - batch
  - powershell
  - python
  - javascript
  - typescript
  - c
  - cpp
  - pe
  - dll
  id: sc-config-start-disabled
  desc: sc config sets service startup disabled
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\bsc(\.exe)?\s+config\s+\S+\s+start=\s*disabled
  unless:
  - id: metadata/file/string/application-name::microsoft-activation-script-benign-context
  downgrade:
    any:
    - id: metadata/binary/installer/family/
