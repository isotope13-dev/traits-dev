traits:
- platforms:
  - windows
  for:
  - batch
  - powershell
  - python
  - javascript
  - typescript
  - c
  - cpp
  - pe
  - dll
  id: sc-config-start-disabled
  desc: sc config sets service startup disabled
  crit: notable
  conf: 0.92
  if:
    # Separators admit quotes and commas so argv-split calls
    # (`["sc", "config", name, "start=", "disabled"]`) match alongside the
    # classic `sc config <name> start= disabled` command line.
    type: text
    regex: (?i)\bsc(\.exe)?[\s"',]+config[\s"',]+\S+[\s"',]+start=\s*["',\s]*["']?disabled
  unless:
  - id: well-known/dual-use/access-control/microsoft-activation-scripts::microsoft-activation-script-benign-context
  downgrade:
    any:
    - id: metadata/installer/product/
