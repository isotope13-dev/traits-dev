defaults:
  platforms: [windows]
  for: [go]
traits:
  - id: go-sc-disabled-service-command
    desc: Go constructs a disabled-service startup command
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - {index: 0, kind: string, exact: sc}
        - {index: 1, kind: string, exact: config}
        - {index: 3, kind: string, exact: 'start='}
        - {index: 4, kind: string, exact: disabled}
