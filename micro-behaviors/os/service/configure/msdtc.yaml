defaults:
  for: [pe, dll, batch, powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98

traits:
  - id: sc-msdtc-local-system-account
    desc: sc config sets MSDTC account to LocalSystem
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?[ \t]+config[ \t]+msdtc[ \t]+obj=[ \t]*LocalSystem\b'
