composite_rules:
- platforms:
  - windows
  id: service-config-privilege-api-profile
  desc: Service configuration and token privilege APIs
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
  - id: metadata/binary/symbols/count::many-exports-100
  - id: metadata/binary/vendor::bitdefender-product-marker
  all:
  - id: micro-behaviors/os/service/configure::change-service-config
  - id: micro-behaviors/os/service/control::open-service
  any:
  - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
