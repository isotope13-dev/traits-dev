defaults:
  platforms: [windows]
  for: [pe, dll, scripts, source, data, text, msi, oledoc]
composite_rules:
  - id: safeboot-service-write-references
    desc: SafeBoot service keys with registry-write clues
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/keys/policy::safeboot-service-subkey-reference
    any:
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/os/registry/manipulate::reg-exe-safeboot-service-registration
