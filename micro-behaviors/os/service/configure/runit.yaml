# Command structure is independent of the implant's service and binary names.
defaults:
  platforms: [unix]
  for: [scripts, source, binaries]
  crit: notable

traits:
  - id: sed-inplace-runit-launcher
    desc: Sed in-place edit targets runit launcher
    conf: 0.95
    if:
      type: text
      regex: '(^|[\n"''`])\s*sed\s+-i[^\n]{1,160}\s\S*/etc/(sv|service)/[^/\s]{1,80}/run\b'
