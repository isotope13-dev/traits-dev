defaults:
  platforms: [unix]
  crit: notable
  conf: 0.9

traits:
  - id: embedded-label-key
    desc: Embedded launchd plist Label key
    for: [javascript, typescript, go, rust, c, macho]
    if:
      type: text
      exact: '<key>Label</key>'
  - id: plist-programarguments-key
    desc: Plist ProgramArguments key in source text
    for: [javascript, typescript, go, rust, ruby, c, macho, perl]
    if:
      type: text
      substr: '<key>ProgramArguments</key>'
