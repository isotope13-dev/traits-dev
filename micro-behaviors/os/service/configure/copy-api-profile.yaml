composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: service-config-copy-directory-api-profile
  desc: Service, file-copy and directory API references
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/fs/directory/mkdir::create-directory-a
  any:
  - id: micro-behaviors/fs/path/check::get-module-filename
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  unless:
  - id: well-known/app/utility/ventoy/
