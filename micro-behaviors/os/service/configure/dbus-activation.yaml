defaults:
  platforms: [linux]
  for: [scripts, binaries]
traits:
  - id: dbus-activation-exec-directive
    desc: D-Bus activation declares an absolute Exec path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)\[D-BUS Service\][\s\S]{0,260}^\s*Exec=/[^\n]{1,200}'
  - id: exec-line-transient-path
    desc: Exec line from temp or hidden path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*Exec=(/tmp/|/var/tmp/|/dev/shm/|\S{0,120}/\.[A-Za-z0-9_-]+/)'

composite_rules:
  - id: dbus-activation-exec-transient-path
    desc: D-Bus Exec from temp or hidden path
    crit: notable
    conf: 0.9
    near_lines: 12
    all:
      - id: dbus-activation-exec-directive
      - id: exec-line-transient-path
