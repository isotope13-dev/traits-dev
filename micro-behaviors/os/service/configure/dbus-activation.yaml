defaults:
  platforms: [linux]
  for: [scripts, binaries]
traits:
  - id: dbus-activation-exec-directive
    desc: D-Bus activation declares an absolute Exec path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)\[D-BUS Service\][\s\S]{0,260}^\s*Exec=/[^\n]{1,200}'
  - id: dbus-activation-exec-transient-path
    desc: D-Bus activation Exec from temp or hidden path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)\[D-BUS Service\][\s\S]{0,260}^\s*Exec=(/tmp/|/var/tmp/|/dev/shm/|\S*/\.[A-Za-z0-9_-]+/)[^\n]{0,200}'
