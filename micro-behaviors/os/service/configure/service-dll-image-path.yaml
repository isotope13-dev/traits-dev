defaults:
  platforms: [windows]
  for: [batch, c, cpp, csharp, powershell, python]

traits:
- id: service-dll-image-path
  desc: Service image path names a DLL
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: '(?i)\b(binpath|binarypathname|imagepath)\b[^;\r\n]{0,160}\b[A-Za-z0-9_./\\-]+\.dll\b'
