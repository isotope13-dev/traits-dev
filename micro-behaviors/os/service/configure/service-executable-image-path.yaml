defaults:
  platforms: [windows]
  for: [batch, c, cpp, csharp, powershell, python]

traits:
- id: service-executable-image-path
  desc: Service image path names an executable
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: '(?i)\b(binpath|binarypathname|imagepath)\b[^;\r\n]{0,120}\.exe\b'
