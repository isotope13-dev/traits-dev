# How a systemd unit is wired into the boot graph: ordering edges, hard
# requirements, and D-Bus activation name. Presence of any of these is unit
# structure, nothing more — a distro-shipped daemon declares them as a matter
# of course, which is why they are component-level here rather than persistence
# findings. `Before=`, `Requires=` and `BusName=` came from
# objectives/persistence/system/service/systemd, where the mere presence of a
# standard field was reported as persistence intent on every packaged service
# (deepin-file-manager's session units); `After=` came from ../config so the
# whole family reads from one place. The persistence composites still combine
# them with the ExecStart, install-target and masking evidence that carries the
# intent.
defaults:
  platforms: [linux]
  for: [systemd]
  crit: component
  conf: 0.9

traits:
- id: after-exists
  desc: Unit After= exists
  if:
    type: value
    path: "unit.after"
    exists: true
  unless:
  - id: well-known/app/system/drivers/

- id: before-exists
  desc: Unit Before= exists
  if:
    type: value
    path: "unit.before"
    exists: true
  unless:
  - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: well-known/app/system/drivers/

- id: requires-exists
  desc: Unit Requires= exists
  if:
    type: value
    path: "unit.requires"
    exists: true

- id: bus-name-exists
  desc: Service BusName= exists
  if:
    type: value
    path: "service.bus_name"
    exists: true
