defaults:
  platforms: [macos]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: shell-tee-launchdaemon-plist
    desc: Shell writes LaunchDaemon plist with tee
    if:
      type: text
      regex: '(?m)(^|[|;&])\s*(sudo\s+)?tee\s+(-a\s+)?["'']?/Library/LaunchDaemons/[\w.-]{1,100}\.plist'
