defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: copy-service-create-api-cluster
  desc: Copy and service creation API cluster
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/create::create-service
  - id: micro-behaviors/fs/file/copy::copyfile-a
  any:
  - id: micro-behaviors/os/service/start::start-service
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  - id: micro-behaviors/fs/path/check::get-module-filename
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/app/utility/ventoy/
  - id: well-known/app/storage/syncback::syncback-backup-benign-context
  - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/signed/developer
- id: resource-service-dll-write-api-cluster
  desc: ServiceDLL, file-write and service creation APIs
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/create::create-service
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  - id: micro-behaviors/os/service/host::service-dll-value-name
  - id: micro-behaviors/fs/write/file/handle::write-file
  any:
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  - id: micro-behaviors/os/service/host::system32-service-dll-target
  downgrade:
    any:
    - id: metadata/binary/installer/family/
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor/
