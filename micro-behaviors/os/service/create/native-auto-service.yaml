defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-auto-interactive-service-arguments
    desc: x86 auto-start interactive service arguments
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '6A 01 6A 02 68 10 01 00 00 68 FF 01 0F 00 50 50 57 FF 15 [4]'
