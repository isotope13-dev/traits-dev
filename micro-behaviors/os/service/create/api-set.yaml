# Service creation is a capability; unrelated registry writes and cipher APIs
# do not establish encrypted payload storage or persistent reactivation.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, rust, go]
  crit: notable
  conf: 0.92

composite_rules:
  - id: service-registration-capability
    desc: Windows service creation API or command
    any:
      - id: micro-behaviors/os/service/config::powershell-binary-service-command
      - id: create-service
      - id: sc-create-command
      - id: sc-remote-create-command
