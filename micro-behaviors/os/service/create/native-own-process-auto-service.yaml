defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  # Five null optional arguments, binary-path address, error-control zero,
  # SERVICE_AUTO_START (2), SERVICE_WIN32_OWN_PROCESS (16), and ALL_ACCESS.
  # This argument layout supports probable service creation, just as the
  # interactive-service layout in native-auto-service.yaml does. It does not
  # bind the indirect call's IAT slot or establish successful installation.
  # Stack slots and addresses
  # vary, and no service name or payload filename is required.
  - id: x86-auto-own-process-service-call-layout
    desc: x86 auto-start own-process service call layout
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '6A 00 6A 00 6A 00 6A 00 6A 00 8D 95 [4] 52 6A 00 6A 02 6A 10 68 FF 01 0F 00 8B 45 ?? 50 8B 7D ?? 57 56 FF 15 [4]'

  # Windows x64 passes desired access in R9D and the service type/start type
  # in stack argument slots 0x20/0x28. Require ALL_ACCESS, AUTO_START and
  # WIN32_OWN_PROCESS immediately before an indirect call. As above, this
  # describes the argument layout, not a resolved IAT target or runtime success.
  # NSSM's ordinary install path is a positive control, not an exclusion.
  - id: x64-auto-own-process-service-call-layout
    desc: x64 auto-start own-process service call layout
    crit: notable
    conf: 0.97
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '41 B9 FF 01 0F 00 48 8B ?? C7 44 24 28 02 00 00 00 C7 44 24 20 10 00 00 00 FF 15 [4]'

  # SERVICE_ERROR_NORMAL differs from the ignore-error layout above. These
  # pushes provide five absent optional arguments, a stack-local binary path,
  # AUTO_START, OWN_PROCESS and SERVICE_ALL_ACCESS before an indirect call.
  - id: x86-auto-service-normal-error-call-layout
    desc: x86 auto-service NORMAL error call layout
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '6A 00 6A 00 6A 00 6A 00 8D 4C 24 ?? 6A 00 51 6A 01 6A 02 6A 10 68 FF 01 0F 00 68 ?? ?? ?? ?? 68 ?? ?? ?? ?? 57 FF 15 ?? ?? ?? ??'
