defaults:
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: create-service-w-import
    desc: CreateServiceW import
    crit: notable
    size_min: 2600000
    size_max: 2900000
    if:
      type: import
      exact: CreateServiceW
  - id: install-service-function
    desc: Defines or calls InstallService routine
    crit: notable
    conf: 0.85
    for: [binaries, scripts, source]
    if:
      type: text
      # Exclude IsInstallService and UninstallService predicates/actions.
      regex: '\bInstallService\s*\('

  - id: sc-create-command
    desc: sc.exe create service command
    crit: notable
    conf: 0.95
    for: [csharp, powershell, batch, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+create\b'

  - id: sc-local-system-service-create
    desc: sc.exe creates a LocalSystem service
    crit: suspicious
    conf: 0.92
    for: [powershell, batch, csharp, go, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[^\r\n]{0,180}\bLocalSystem\b'

  - id: sc-auto-start-service-create
    desc: sc.exe creates an auto-start service
    crit: suspicious
    conf: 0.92
    for: [powershell, batch, csharp, go, c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[^\r\n]{0,180}\bstart\s*=\s*auto\b'
    downgrade:
      any:
        - id: well-known/tool/offensive/psbits::source-tree-member

  - id: sc-shared-svchost-service-create
    desc: sc.exe creates shared svchost service
    crit: notable
    conf: 0.95
    for: [powershell, batch, csharp, go]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create[^\r\n]{0,180}svchost\.exe -k [^\r\n]{0,60}type= share\b'

  - id: sc-kernel-driver-service-create
    desc: sc.exe registers a kernel driver service
    # `sc create <name> type= kernel binPath= <image>.sys` is how a driver is
    # loaded on a running system without an INF. Neutral capability — driver
    # vendors and endpoint products install this way too — but it is the
    # narrowest observable form of "code is about to run in the kernel", so an
    # analyst wants it surfaced. `type= filesys` is the same registration for a
    # filesystem filter driver.
    crit: notable
    conf: 0.94
    for: [powershell, batch, csharp, go]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[^\r\n]{0,180}\btype\s*=\s*(kernel|filesys)\b'

  - id: sc-remote-create-command
    desc: sc.exe remote service creation
    crit: notable
    conf: 0.96
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+\\+[A-Za-z0-9._-]{1,63}\s+create\b'

  - id: service-persistence-status
    desc: Native service persistence status message
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bpersisted\s+via\s+service\s*\('
  - id: go-sc-create-command
    desc: Go invokes sc.exe service creation
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: '(?i)exec\.Command\(\s*["'']sc(\.exe)?["'']\s*,\s*["'']create["'']'

  - id: create-service
    desc: Create Windows service
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      regex: (^|[./])CreateService[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
  - id: create-service-w-reference
    desc: CreateServiceW named, not imported
    crit: notable
    conf: 0.9
    for: [go, pe, dll]
    if:
      type: text
      word: CreateServiceW
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: create-service-w-import
composite_rules:
  - id: create-service-manager-install-flow
    desc: Windows service manager installation flow
    crit: notable
    conf: 0.9
    for: [pe]
    all:
      - id: create-service
      - id: micro-behaviors/os/service/control::open-sc-manager
    any:
      - id: sc-create-command
      - id: install-service-function
      - id: micro-behaviors/os/service/dispatch::python-win32serviceutil-module

  - id: windows-service-install
    desc: Installs a Windows service
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    any:
      - id: sc-create-command
      - id: create-service-manager-install-flow
      - id: install-service-function

  # Nothing here is Go-specific -- both legs are plain ADVAPI32 import checks,
  # and the pair fires on any PE that manages services (it matched a 2008 MFC
  # service EXE). Named for the imports it actually reads; the Go-specific
  # composite that consumes it supplies the Go evidence in its other legs.
  - id: service-create-open-import-pair
    desc: Windows service create/open API import pair
    crit: notable
    conf: 0.9
    for: [pe]
    all:
      - id: create-service
      - id: micro-behaviors/os/service/control::open-service
  - id: go-service-install-control
    desc: Go Windows service install control
    crit: notable
    conf: 0.93
    for: [go, pe, dll]
    all:
      - id: micro-behaviors/os/service/control::go-open-sc-manager-proc
      - id: create-service-w-reference
    any:
      - id: micro-behaviors/os/service/control::go-open-service-proc
      - id: micro-behaviors/os/service/start::go-start-service-proc
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: sc-local-system-auto-start
    desc: LocalSystem auto-start service creation
    crit: suspicious
    conf: 0.95
    for: [powershell, batch, csharp, go, c, cpp]
    all:
      - id: sc-local-system-service-create
      - id: sc-auto-start-service-create
    near_bytes: 240

  - id: sc-create-start-sequence
    desc: sc.exe creates and starts a service
    crit: suspicious
    conf: 0.93
    for: [pe, batch, powershell]
    all:
      - id: sc-create-command
      - id: micro-behaviors/os/service/start::sc-start-command
    near_lines: 2
