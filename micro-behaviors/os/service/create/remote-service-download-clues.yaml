# Remote service creation and a curl file download occur on the same line.
# The matcher does not bind the downloaded file to the service command.
defaults:
  platforms: [windows]
  for: [batch, powershell, csharp]
  attack: T1021.002,T1105,T1569.002
  mbc: B0024

composite_rules:
  - id: remote-service-download-clues
    for: [batch, powershell]
    desc: Remote service creation near curl download
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/create::sc-remote-create-command
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
    near_lines: 1
