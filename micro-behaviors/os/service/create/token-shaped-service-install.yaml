# The long token-shaped argument distinguishes this from ordinary service installs, including renamed connectors.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - shell
  - batch
  - powershell
  - python
  - javascript
  - go
  crit: notable
  conf: 0.86
traits:
- id: tunnel-connector-service-install-token
  desc: Service install command and token-like text
  crit: suspicious
  conf: 0.9
  for:
  - scripts
  - systemd-service
  platforms:
  - windows
  - linux
  if:
    type: text
    regex: "(?i)\\bservice\\s+install\\s+[A-Za-z0-9+_-]{20}[A-Za-z0-9+/=_-]{60,}"
