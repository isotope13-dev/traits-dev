# C source prototype for CreateService. The CreateServiceW import in
# windows.yaml cannot see a function-pointer typedef, which is how a service
# creation call is declared when the API is resolved at run time.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.93
  attack: T1543.003

traits:
  - id: create-service-prototype-typedef
    desc: CreateService prototype typedef
    if:
      type: text
      regex: 'SC_HANDLE \(__stdcall ?\*\w+\)\(SC_HANDLE,LPCTSTR,LPCTSTR,DWORD,DWORD,DWORD,DWORD,LPCTSTR'
      exclude_comments: true
