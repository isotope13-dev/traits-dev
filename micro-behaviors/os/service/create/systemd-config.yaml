# This is a service-launcher declaration, not evidence of a command shell.
defaults:
  platforms: [linux]
  for: [scripts, source, json, yaml, markdown, text]
traits:
  - id: config-command-systemd-run
    desc: Config selects detached systemd-run launcher
    crit: notable
    conf: 0.96
    unless:
      - type: text
        regex: 'systemd-run["''][\s\S]{0,80}args["'']?\s*[:=]\s*\[[^\]]{0,80}["'']--(scope|pipe)["'']'
    if:
      type: text
      regex: 'command["'']?\s*[:=]\s*["''](/(usr/)?bin/)?systemd-run["'']'
