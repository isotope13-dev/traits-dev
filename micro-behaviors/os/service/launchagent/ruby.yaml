# Ruby heredoc bodies are siblings of their introducing call. Match the
# assignment, optional directory creation, write, and body as one sequence.
# In particular, a different/overwritten path binding must not supply the
# LaunchAgents destination for a documentation write.
defaults:
  for: [ruby]
  platforms: [macos]
  crit: notable
  conf: 0.95

traits:
  - id: ruby-write-autostart-shell-loader-plist
    desc: Ruby writes autostart shell-loader plist
    if:
      type: tree-sitter
      query: |
        (_
          (assignment left: (identifier) @binding
            right: (call receiver: (constant) @path_class
              method: (identifier) @expand
              arguments: (argument_list . (string) @directory .)))
          .
          (call receiver: (constant) @utils
            method: (identifier) @mkdir
            arguments: (argument_list . (identifier) @mkdir_binding .))?
          .
          (call receiver: (constant) @file_class
            method: (identifier) @write
            arguments: (argument_list
              . (call receiver: (constant) @join_class
                  method: (identifier) @join
                  arguments: (argument_list
                    . (identifier) @destination
                    . (string) @filename .))
              . (heredoc_beginning) .))
          . (heredoc_body (heredoc_content) @payload)
          (#eq? @path_class "File")
          (#eq? @expand "expand_path")
          (#match? @directory "^['\"](~|/Users/[^/]+)/Library/LaunchAgents/?['\"]$")
          (#eq? @utils "FileUtils")
          (#eq? @mkdir "mkdir_p")
          (#eq? @mkdir_binding @binding)
          (#eq? @file_class "File")
          (#eq? @write "write")
          (#eq? @join_class "File")
          (#eq? @join "join")
          (#eq? @destination @binding)
          (#match? @filename "^['\"][A-Za-z0-9_.-]+\\.plist['\"]$")
          (#match? @payload "<key>RunAtLoad</key>\\s*<true\\s*/>")
          (#match? @payload "<key>ProgramArguments</key>\\s*<array>\\s*<string>/bin/(ba|z)?sh</string>\\s*<string>-[a-z]*c[a-z]*</string>\\s*<string>\\s*(curl|wget)\\s+[^<|\"']{0,100}(https?|ftp)://[^\\s<|\"']{1,180}\\s*\\|\\s*(/bin/)?(ba|z)?sh\\b"))
