# Call/value facts do not expose shell heredoc content as the argument of a
# file write. This query combines a literal heredoc write, an autostart
# download/evaluate command and the immediately following load of exactly
# the same path. An objective combines this relationship with install context.
# It is not general shell dataflow.
defaults:
  for: [shell]
  platforms: [macos]
  crit: notable
  conf: 0.97
  attack: T1543.004,T1105,T1059.004

traits:
  - id: shell-load-written-autostart-fetch-pipe
    desc: Loads written autostart fetch-shell plist
    if:
      type: tree-sitter
      query: |
        (_
          (redirected_statement
            body: (command . name: (command_name (word) @writer) .)
            . redirect: (file_redirect ">" destination: (_) @written) @redirect
            . redirect: (heredoc_redirect
              (heredoc_start) @delimiter
              (heredoc_body) @plist) .)
          .
          (command
            . name: (command_name (word) @loader)
            . argument: (word) @operation
            . argument: (word)? @option
            . argument: (_) @loaded .)
          (#match? @writer "^(/bin/)?cat$")
          (#match? @redirect "^>\\s")
          (#match? @delimiter "^'[^']+'$")
          (#eq? @written @loaded)
          (#match? @written "^\"(\\$[A-Za-z_][A-Za-z0-9_]*|/[A-Za-z0-9_./-]+)[A-Za-z0-9_./-]*\\.plist\"$")
          (#match? @loader "^(/bin/)?launchctl$")
          (#eq? @operation "load")
          (#eq? @option "-w")
          (#match? @plist "^\\s*(<\\?xml[^?]*\\?>\\s*)?<plist[^>]*>\\s*<dict>")
          (#match? @plist "</dict>\\s*</plist>\\s*$")
          (#not-match? @plist "<!|<key>\\s*Program\\s*</key>|<key>\\s*RunAtLoad\\s*</key>\\s*<false")
          (#not-match? @plist "<dict>[\\s\\S]*<dict>|<key>ProgramArguments</key>[\\s\\S]*<key>ProgramArguments</key>")
          (#match? @plist "<key>RunAtLoad</key>\\s*<true\\s*/>")
          (#match? @plist "<key>ProgramArguments</key>\\s*<array>\\s*<string>/bin/(ba|z)?sh</string>\\s*<string>-[l]*c</string>\\s*<string>\\s*(/usr/bin/)?curl(\\s+-[fsSLk]+)*\\s+https?://[^\\s<|\"';&`$\\\\]{1,240}\\s*\\|\\s*(/bin/)?(ba|z)?sh\\s*</string>\\s*</array>"))
