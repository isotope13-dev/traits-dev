defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: start-calendar-interval
    desc: Launchd calendar schedule key
    crit: notable
    conf: 0.8
    if:
      type: value
      path: StartCalendarInterval

  - id: throttle-interval
    desc: Launchd minimum respawn interval key
    crit: notable
    conf: 0.5
    if:
      type: value
      path: ThrottleInterval
