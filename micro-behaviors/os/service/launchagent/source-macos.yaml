# Source-level launchd configuration observations. These are capabilities;
# persistence intent is inferred only by objective composites that combine them
# with service loading or other attack-context evidence.
defaults:
  platforms: [macos]
  for: [scripts, source, perl]
  crit: notable
  conf: 0.9
  attack: T1543.004
traits:
  - id: jvm-runatload-enabled-string
    desc: JVM string enables LaunchAgent RunAtLoad
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)<key>RunAtLoad</key>\s*<true\s*/>'

  - id: jvm-startinterval-string
    desc: JVM string configures launchd interval
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)<key>StartInterval</key>\s*<integer>[0-9]+'

  - id: jvm-launchagents-string
    desc: JVM string names LaunchAgents directory
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)LaunchAgents'

  - id: source-launchagents-join
    desc: Source joins Library LaunchAgents path
    if:
      type: text
      regex: '["'']Library["''][\s\S]{0,80}["'']LaunchAgents["'']'
    unless:
      - id: metadata/file/catalog/persistence-path::persistence-path-catalog-constant
  # Systems languages often keep the complete path in one format string
  # (`"{s}/Library/LaunchAgents"`) instead of quoting each path component.
  - id: source-launchagents-literal
    desc: Source contains a literal LaunchAgents path
    if:
      type: text
      substr: Library/LaunchAgents
  - id: source-launchagents-plist
    desc: Source references LaunchAgents plist
    if:
      type: text
      regex: 'Library/LaunchAgents/.{0,80}\.plist'
  - id: source-runatload-key
    desc: Source contains enabled RunAtLoad setting
    for: [scripts, source, perl, class]
    platforms: [macos, ios]
    if:
      type: text
      regex: '(?i)RunAtLoad[\s\S]{0,80}(<true\s*/>|true\b)'
    unless:
      - id: metadata/package/testing/presence/path::test-fixture-directory-path
  - id: source-startinterval-key
    desc: Source specifies launchd StartInterval
    if:
      type: text
      word: StartInterval
