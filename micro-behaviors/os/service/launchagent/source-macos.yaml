defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - perl
  crit: notable
  conf: 0.9
  attack: T1543.004
traits:
- id: jvm-runatload-enabled-string
  desc: JVM string enables LaunchAgent RunAtLoad
  for:
  - class
  - java_class
  if:
    type: value
    path: class.strings[*]
    regex: (?i)<key>RunAtLoad</key>\s*<true\s*/>
- id: jvm-startinterval-string
  desc: JVM string configures launchd interval
  for:
  - class
  - java_class
  if:
    type: value
    path: class.strings[*]
    regex: (?i)<key>StartInterval</key>\s*<integer>[0-9]+
- id: jvm-launchagents-string
  desc: JVM string names LaunchAgents directory
  for:
  - class
  - java_class
  if:
    type: value
    path: class.strings[*]
    regex: (?i)LaunchAgents
- id: source-launchagents-join
  desc: Source joins Library LaunchAgents path
  if:
    type: text
    regex: '["'']Library["''][\s\S]{0,80}["'']LaunchAgents["'']'
  unless:
  - id: metadata/file/catalog/persistence-path::persistence-path-catalog-constant
- id: source-launchagents-literal
  desc: Source contains a literal LaunchAgents path
  if:
    type: text
    substr: Library/LaunchAgents
- id: source-launchagents-plist
  desc: Source references LaunchAgents plist
  if:
    type: text
    regex: Library/LaunchAgents/.{0,80}\.plist
- id: source-startinterval-key
  desc: Source specifies launchd StartInterval
  if:
    type: text
    word: StartInterval
- id: source-short-startinterval-value
  desc: Source launchd interval is under 15 minutes
  if:
    type: text
    regex: <key>StartInterval</key>\s*<integer>([1-9][0-9]?|[1-8][0-9]{2})</integer>
