defaults:
  platforms: [macos]
  for: [macho]
  crit: notable

traits:
  - id: rust-startup-registration-routine
    desc: Rust startup registration routine symbol
    if:
      type: symbol
      kind: function
      regex: '14add_to_startup17h[0-9a-f]{16}E$'

composite_rules:
  - id: rust-startup-launchagent-configuration
    desc: Rust startup routine with enabled LaunchAgent configuration
    all:
      - id: rust-startup-registration-routine
      - id: launchagents-directory-reference
      - id: micro-behaviors/os/service/launchd/config::embedded-runatload-true
      - id: micro-behaviors/os/service/launchd/config::programarguments-key-reference
