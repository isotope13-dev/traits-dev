defaults:
  platforms: [macos]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-launchd-launchagents-path
    desc: Node builds a user LaunchAgents path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'path\.join\s*\([^\r\n;]{0,160}["'']Library["''][^\r\n;]{0,80}["'']LaunchAgents["'']'

  - id: node-launchd-runatload-plist
    desc: Node embeds a RunAtLoad plist key
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '<key>RunAtLoad</key>[\s\S]{0,80}<true'

  - id: node-launchd-plist-write
    desc: Node writes a plistPath configuration file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'fs\.writeFileSync\s*\(\s*plistPath'


composite_rules:
  - id: node-launchd-runatload-installer
    desc: Node configures and registers LaunchAgent
    crit: notable
    conf: 0.96
    all:
      - id: node-launchd-launchagents-path
      - id: node-launchd-runatload-plist
      - id: micro-behaviors/os/service/plist::plist-programarguments-key
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-subcommand
      - id: node-launchd-plist-write
  - id: source-launchagent-load
    platforms: [unix]
    for: [go, kotlin, php, ruby, rust, javascript, python]
    desc: LaunchAgent paths beside launchctl load
    # User LaunchAgents are a persistence mechanism but are also routinely
    # installed by legitimate desktop applications and daemon managers.
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/start::launchctl-load-command
    any:
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/launchagent::source-launchagents-plist
    needs: 1
    unless:
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-homebrew-package
      - id: well-known/lib/runtime/compiled/crate-package/
      - id: well-known/lib/runtime/compiled/running-process::runpm-launchd-backend
      - id: well-known/app/storage/spacedrive/
      - id: well-known/app/ai/coding-agent/pixcode::benign-runtime-context
      - id: well-known/app/ai/coding-agent/pixcode::benign-archive-context
      - id: well-known/app/ai/coding-agent/pixcode::daemon-manager-source
      - id: well-known/app/ai/coding-agent/pixcode::archive-member-context

  - id: shell-macos-launchd-service-install
    platforms: [unix]
    for: [shell]
    desc: Shell writes a launchd plist and loads it
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/launchagent::shell-launchd-plist-write
      - id: micro-behaviors/os/service/start::shell-launchctl-load

  - id: launchd-js-runatload-installer
    desc: LaunchAgent keys beside load or write operations
    crit: notable
    conf: 0.93
    for: [javascript, npm]
    scope: archive
    all:
      - id: micro-behaviors/os/service/launchagent::launchagents-directory-reference
      - id: micro-behaviors/os/service/plist::embedded-runatload-true
      - id: micro-behaviors/os/service/plist::plist-programarguments-key
    any:
      - id: micro-behaviors/os/service/control::launchctl-command
      - id: micro-behaviors/fs/write/file/full::write-file-sync
    unless:
      # ADHDev exposes this as an explicit, documented service-install
      # command; its package identity is a benign context for the behavior.
      - id: well-known/app/ai/coding-agent/adhdev::adhdev-daemon-package
      - id: well-known/app/system/freddie::benign-archive-context
      - id: well-known/app/system/freddie::gateway-service-context
      - id: well-known/app/ai/coding-agent/pixcode::benign-runtime-context
      - id: well-known/app/ai/coding-agent/pixcode::benign-archive-context
      - id: well-known/app/ai/coding-agent/pixcode::daemon-manager-source
      - id: well-known/app/ai/coding-agent/pixcode::archive-member-context
      - id: well-known/app/ai/gateway/neurolink::benign-archive-context

  - id: macos-launchagent-recurring-config
    for: [python, javascript, ruby, php]
    desc: LaunchAgent path with startup or recurrence keys
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
    any:
      - id: micro-behaviors/os/service/launchagent::launchagent-run-at-load
      - id: micro-behaviors/os/service/launchagent::launchagent-keepalive-key
      - id: micro-behaviors/os/service/plist::start-interval
      - id: micro-behaviors/os/service/plist::keep-alive

