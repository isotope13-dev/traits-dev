defaults:
  platforms:
  - macos
  for:
  - macho
  - go
  - shell
  - plist
traits:
- id: interactive-zsh-plist
  desc: LaunchAgent plist starts interactive zsh
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: <key>ProgramArguments</key>\s*<array>\s*<string>/bin/zsh</string>\s*<string>-i</string>
