defaults:
  platforms: [macos]
  for: [scripts, source, perl, class, java_class]
  crit: notable
  conf: 0.95
traits:
  - id: source-short-startinterval-mapping
    desc: Launchd mapping interval is under 15 minutes
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '[''"]StartInterval[''"]\s*:\s*([1-9][0-9]?|[1-8][0-9]{2})\b'
  - id: jvm-short-startinterval-value
    desc: JVM launchd interval is under 15 minutes
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '<key>StartInterval</key>\s*<integer>([1-9][0-9]?|[1-8][0-9]{2})</integer>'
composite_rules:
  - id: short-startinterval-setting
    desc: Launchd interval setting is under 15 minutes
    any:
      - id: source-short-startinterval-value
      - id: source-short-startinterval-mapping
      - id: jvm-short-startinterval-value
