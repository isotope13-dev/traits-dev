defaults:
  platforms: [macos]
traits:
  - id: launchagents-directory-reference
    desc: References the LaunchAgents directory name
    crit: notable
    conf: 0.7
    attack: T1543.004
    for: [plist, shell, applescript, javascript, macho]
    if:
      type: text
      substr: LaunchAgents
    downgrade:
      any:
        - id: metadata/signed/platform::apple
    unless:
      - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
