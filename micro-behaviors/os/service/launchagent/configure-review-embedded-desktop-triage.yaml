defaults:
  platforms: [macos]
  conf: 0.9

composite_rules:
  - id: launchagent-autostart-key-paths
    desc: LaunchAgent path with autostart plist keys
    crit: notable
    conf: 0.92
    for: [macho, dylib, applescript]
    all:
      - id: micro-behaviors/os/service/launchd/config::runatload-key-reference
      - id: micro-behaviors/os/service/launchd/config::programarguments-key-reference
      - id: micro-behaviors/os/service/launchagent::launchagents-path

  - id: launchagent-readonly-manager
    desc: LaunchAgent configuration and directory-read references
    crit: notable
    conf: 0.93
    for: [macho, dylib]
    scope: file
    all:
      - id: micro-behaviors/os/service/launchagent::launchagents-path
      - id: micro-behaviors/os/service/launchd/config::runatload-key-reference
      - id: micro-behaviors/os/service/launchd/config::programarguments-key-reference
      - id: micro-behaviors/fs/directory/readdir/language::foundation-directory-contents-at-path
    any:
      - id: micro-behaviors/fs/read/file/content/unspecified::foundation-dictionary-from-file
      - id: micro-behaviors/fs/read/file/content/unspecified::foundation-property-list-at-path

