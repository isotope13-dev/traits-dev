# launchd plists can be authored key-by-key with `defaults write` or
# PlistBuddy instead of shipping the file. The composite binds a program key,
# an enabled RunAtLoad key and a LaunchAgents destination in one script.
defaults:
  platforms: [macos]
  for: [shell]
  crit: notable
  attack: T1543.001
traits:
  - id: plist-tool-writes-program-key
    desc: Plist tool writes a launchd Program key
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '\b(defaults\s+write\s+\S+\s+["'']?|PlistBuddy[^\n]{0,80}Add\s+:)Program(Arguments)?\b'
  - id: plist-tool-enables-run-at-load
    desc: Plist tool enables launchd RunAtLoad
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(\bdefaults\s+write\s+\S+\s+["'']?|:)RunAtLoad["'']?\s+-?bool\s+["'']?(yes|true|1)\b'

composite_rules:
  - id: plist-tool-writes-autostart-program
    desc: Plist tool writes autostart program keys
    conf: 0.93
    near_lines: 6
    all:
      - id: plist-tool-writes-program-key
      - id: plist-tool-enables-run-at-load
  - id: plist-tool-builds-autostart-launchagent
    desc: Script builds an autostart LaunchAgent plist
    conf: 0.94
    all:
      - id: plist-tool-writes-autostart-program
      - id: micro-behaviors/os/service/launchagent::launchagents-path
