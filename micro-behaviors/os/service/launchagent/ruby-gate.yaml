defaults:
  for: [ruby]
  platforms: [macos]
traits:
  - id: ruby-marker-gates-launchagent-write
    desc: File existence gates LaunchAgent installation
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (if condition: (call receiver: (constant) @file
            method: (identifier) @exists)
          consequence: (then
            (call receiver: (constant) @writer
              method: (identifier) @write)
            (call method: (identifier) @system
              arguments: (argument_list (_) @command))) @body
          (#eq? @file "File")
          (#eq? @exists "exist?")
          (#eq? @writer "File") (#eq? @write "write")
          (#eq? @system "system")
          (#match? @command "launchctl load")
          (#match? @body "Library/LaunchAgents")
        )
