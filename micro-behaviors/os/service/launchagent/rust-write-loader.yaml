defaults:
  platforms: [macos]
  for: [rust]
  crit: notable

traits:
  - id: rust-write-remote-shell-agent
    desc: Writes remote shell loader LaunchAgent
    if:
      type: symbol
      kind: call
      exact: std::fs::write
      args:
        - index: 0
          from:
            value: '(^|/)Library/LaunchAgents(/|$)'
            through:
              - call: '\.join$'
                receiver: true
                arguments: [0]
        - index: 1
          from:
            value: '\b(curl|wget)\s+[^|\r\n]{0,100}https?://[^|\r\n]{1,100}\|\s*(ba|z)?sh\b'
