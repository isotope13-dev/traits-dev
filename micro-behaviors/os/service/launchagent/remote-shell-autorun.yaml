defaults:
  platforms: [macos]
  for: [scripts, source]
composite_rules:
  - id: source-launchagent-remote-shell-autorun
    desc: RunAtLoad shell, curl pipeline and launchctl co-occur
    crit: suspicious
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    for: [source, '!go', applescript, javascript, lua, perl, php, python, ruby, shell]
    near_lines: 32
    all:
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/launchd/config::source-launchd-program-shell-command
      - id: metadata/lang/source/syntax/command/download::source-curl-pipe-shell
      - id: micro-behaviors/os/service/launchd/config::source-programarguments-shell-flag
    any:
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/launchagent::source-launchagents-literal
    unless:
      # ClawMetry installs its own dashboard/sync LaunchAgents; its
      # uninstaller only prints a curl|bash reinstall hint.
      - id: well-known/tool/detection/clawmetry::clawmetry-tool

