defaults:
  platforms: [macos]
  for: [scripts]
  crit: notable
  conf: 0.9
  attack: T1543.004

traits:
  - id: launchagent-keepalive-key
    desc: LaunchAgent KeepAlive configuration key
    if:
      type: text
      regex: '<key>KeepAlive</key>|["'']KeepAlive["'']\s*[:=]'
  - id: plistbuddy-start-interval-edit
    desc: PlistBuddy edits StartInterval
    if:
      type: text
      regex: '\bPlistBuddy\b[^\r\n]{0,96}\bStartInterval\b'

composite_rules:
  - id: launchagent-path-reference
    desc: References a user LaunchAgent path
    any:
      - id: micro-behaviors/os/service/config::launchagents-path
      - id: micro-behaviors/os/service/config::source-launchagents-join
      - id: micro-behaviors/os/service/config::source-launchagents-plist
