defaults:
  platforms:
  - macos
  for:
  - scripts
  crit: notable
  conf: 0.9
  attack: T1543.004
traits:
- id: plistbuddy-start-interval-edit
  desc: PlistBuddy edits StartInterval
  if:
    type: text
    regex: \bPlistBuddy\b[^\r\n]{0,96}\bStartInterval\b
composite_rules:
- id: launchagent-path-reference
  desc: References a user LaunchAgent path
  for:
  - scripts
  - source
  - perl
  any:
  - id: micro-behaviors/os/service/launchagent::launchagents-path
  - id: micro-behaviors/os/service/launchagent::source-launchagents-join
  - id: micro-behaviors/os/service/launchagent::source-launchagents-literal
  - id: micro-behaviors/os/service/launchagent::source-launchagents-plist
