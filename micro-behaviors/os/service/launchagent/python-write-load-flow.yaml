defaults:
  platforms: [macos]
  for: [python]
traits:
  - id: python-written-launchagent-load-flow
    desc: Writes a LaunchAgent then loads that path
    crit: notable
    conf: 0.98
    # The destination, write receiver and launchctl argument must be the same
    # variable. Directly adjacent write/load calls prevent path reassignment.
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @path right: (_) @destination))
          . (expression_statement (call
            function: (attribute object: (identifier) @writer attribute: (identifier) @write)
            arguments: (argument_list . (string) @plist .)))
          . (expression_statement (call
            function: (attribute object: (identifier) @subprocess attribute: (identifier) @run)
            arguments: (argument_list . (list
              . (string) @launchctl . (string) @load
              . (call function: (identifier) @str
                  arguments: (argument_list . (identifier) @loaded .)) .) .))))
          (#eq? @path @writer)
          (#eq? @path @loaded)
          (#eq? @write "write_text")
          (#eq? @subprocess "subprocess")
          (#eq? @run "run")
          (#eq? @str "str")
          (#match? @launchctl "^['\"]launchctl['\"]$")
          (#match? @load "^['\"]load['\"]$")
          (#match? @destination "Library[\\s\\S]{0,80}LaunchAgents")
          (#match? @plist "<key>ProgramArguments</key>"))
