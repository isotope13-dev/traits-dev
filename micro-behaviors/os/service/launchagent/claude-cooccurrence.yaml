# File-wide co-occurrence, not a path-bound write or an attacker objective.
defaults:
  platforms: [unix]
  for: [javascript]

composite_rules:
  - id: source-launchagent-claude-config-cooccurrence
    desc: LaunchAgent setup, Claude path, and file-write call coexist
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
    any:
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-subcommand
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-argv
    unless:
      - id: well-known/app/ai/gateway/neurolink::benign-archive-context
      - id: well-known/app/ai/gateway/inboost-ai-proxy::archive-context
      - id: well-known/app/ai/gateway/astragate::archive-context
      - id: well-known/tool/development/ci/buildhound::buildhound-package
      - id: well-known/app/ai/coding-agent/
      - id: well-known/app/ai/agent-runtime/
      - id: well-known/app/ai/usage/
      - id: well-known/app/ai/tool-server/
      - id: well-known/app/ai/knowledge/
