defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  - csharp
  - python
  - go
  - rust
  crit: notable
traits:
- id: control-service-stop-named-call
  desc: ControlService requests service stop
  conf: 0.99
  if:
    type: symbol
    kind: call
    regex: (^|[.:>])ControlService$
    arg:
      index: 1
      kind: identifier
      name: SERVICE_CONTROL_STOP
