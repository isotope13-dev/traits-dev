defaults:
  platforms: [linux, macos, windows]
  for: [shell, python, javascript, powershell, batch, pe]
traits:
  - id: mssql-stop-reference
    desc: Stop text near MSSQL
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\bstop\b[^\n]{0,30}\bmssql\b
    not:
      - regex: '(?i)stop:\s+mssql'
      - regex: '(?i)(docker\s+)?stop\s+mssql\b'
      - regex: '(?i)\bstop-service\b'
composite_rules:
  - id: kill-mysql
    desc: MySQL service termination
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/process/terminate/command::taskkill-mysql-process
      - id: micro-behaviors/os/service/stop::mysql-service-stop-command
  - id: kill-mssql
    desc: MSSQL kill or stop text
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/process/terminate/target::mssql-kill-reference
      - id: mssql-stop-reference
