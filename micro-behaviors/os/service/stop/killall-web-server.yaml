defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: killall-httpd-command
    desc: killall command targets httpd or uhttpd
    conf: 0.9
    if:
      type: text
      # HUP/USR signals reload or gracefully reconfigure httpd; they do not
      # terminate it. Only termination signals or the default are accepted;
      # process names cannot consume option tokens. Boundaries reject
      # lighttpd as an httpd match. This is a neutral command capability.
      regex: '\bkillall\s+(-(9|15|KILL|TERM)\s+)?([\w.]+\s+){0,6}(u?httpd)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/build/conda::conda-recipe-build-path
      - id: metadata/build/conda::conda-recipe-helper-script-path
  - id: killall-apache-command
    desc: killall command targets Apache
    conf: 0.9
    if:
      type: text
      regex: '\bkillall\s+(-(9|15|KILL|TERM)\s+)?([\w.]+\s+){0,6}apache2?\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/build/conda::conda-recipe-build-path
      - id: metadata/build/conda::conda-recipe-helper-script-path
  - id: killall-nginx-command
    desc: killall command targets nginx
    conf: 0.9
    size_min: 256
    if:
      type: text
      regex: '\bkillall\s+(-(9|15|KILL|TERM)\s+)?([\w.]+\s+){0,6}nginx\b'
    not:
      - substr: "killall nginx  #"
    unless:
      - type: text
        substr: "before running the test suite"
      - type: raw
        substr: '#system("killall -9 nginx")'
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/build/conda::conda-recipe-build-path
      - id: metadata/build/conda::conda-recipe-helper-script-path
composite_rules:
  - id: killall-web-server-command
    desc: killall command targets a web server
    conf: 0.8
    any:
      - id: killall-httpd-command
      - id: killall-apache-command
      - id: killall-nginx-command
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/build/conda::conda-recipe-build-path
      - id: metadata/build/conda::conda-recipe-helper-script-path
