defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dotnet-windows-update-stop-argument
    desc: Managed Windows Update stop argument
    crit: notable
    conf: 0.97
    # Process.Start("sc", "stop wuauserv") stores the executable and
    # argument in separate CLR user strings. This atom asserts the argument,
    # not a successful stop or a bound process-launch call.
    if:
      type: text
      regex: '(?i)^stop[ \t]+wuauserv$'
      section: .text
