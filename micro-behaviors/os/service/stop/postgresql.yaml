# Neutral evidence; intent requires additional context.
traits:
- id: postgresql-stop-command
  desc: PostgreSQL stop command syntax
  crit: notable
  conf: 0.5
  for:
  - shell
  - python
  - javascript
  - powershell
  - batch
  - pe
  platforms:
  - linux
  - macos
  - windows
  if:
    regex: (?i)\b((systemctl|net)\s+stop\s+postgres|service\s+postgres\S*\s+stop|pg_ctl\s+stop)
    type: text
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
