defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  attack: T1562.001
traits:
  - id: batch-symantec-service-stop
    desc: Stops Symantec endpoint protection service
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^sc(\.exe)?\s+stop\s+["'']?SepMasterService["'']?(\s|$)'
