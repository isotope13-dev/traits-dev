defaults:
  platforms: [linux]
  for: [json]
  crit: notable
  conf: 0.92

traits:
  - id: cloud-startup-stop-login-guard-service
    desc: VM startup command to stop login guard
    if:
      type: value
      path: 'Steps.*.CreateInstances[*].metadata.startup-script'
      regex: '(?i)(^|[;&|])\s*(sudo\s+)?service\s+(sshguard|fail2ban)\s+stop\b'

  - id: cloud-startup-systemctl-stop-login-guard
    desc: VM startup command to stop login guard
    if:
      type: value
      path: 'Steps.*.CreateInstances[*].metadata.startup-script'
      regex: '(?i)(^|[;&|])\s*(sudo\s+)?systemctl\s+stop\s+(sshguard|fail2ban)\b'
