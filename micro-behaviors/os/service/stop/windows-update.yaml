defaults:
  platforms: [windows]

traits:
  - id: windows-update-services-stop-command
    desc: Stop command lists Windows servicing services
    crit: notable
    conf: 0.92
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)(stop-service|net\s+stop|sc\s+stop)[^\r\n]{0,60}(wuauserv|usosvc|uhssvc|waasmedicsvc)'

