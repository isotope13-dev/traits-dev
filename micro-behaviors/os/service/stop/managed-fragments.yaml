# Adjacent length-prefixed CLR user strings: "sc" followed by "stop ".
# This is command-construction evidence, without a bound service target.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dotnet-sc-stop-command-fragments
    desc: CLR sc and stop command-string fragments
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: '05 73 00 63 00 00 0B 73 00 74 00 6F 00 70 00 20 00 00'
      section: .text
