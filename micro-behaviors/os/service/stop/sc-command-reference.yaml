traits:
- id: sc-stop
  desc: Windows sc stop targets a named service
  crit: notable
  conf: 0.8
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: (?i)\bsc(\.exe)?\s+stop\s+['"]?[A-Za-z0-9_.$-]{2,}\b
  not:
  - regex: '%[A-Za-z]'
  - substr: sc stop cloudflared
  - substr: sc stop igfxCUIService
  - substr: sc.exe stop LCD_Service
  - substr: sc stop sppsvc
  downgrade: null
  unless:
  - id: metadata/binary/installer/family/
