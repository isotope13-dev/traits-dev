defaults:
  crit: notable
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: net-stop-service-command
    desc: net.exe stops a Windows service
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+stop\s+[A-Za-z0-9_.-]+\b'
  # --- "this service starts at boot", one atom per spelling ---
  - id: sc-stop-command
    desc: sc.exe stop service command
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+stop\b'
composite_rules:
  - id: service-stop-control
    desc: Open and control or delete service API chain
    conf: 0.92
    all:
      - id: micro-behaviors/os/service/control::open-sc-manager
      - id: micro-behaviors/os/service/control::open-service
    any:
      - id: micro-behaviors/os/service/control::control-service
      - id: micro-behaviors/os/service/delete::delete-service
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: go-service-stop-control
    desc: Go Windows service stop control
    conf: 0.93
    for: [go]
    all:
      - id: micro-behaviors/os/service/control::go-open-sc-manager-proc
      - id: micro-behaviors/os/service/control::go-open-service-proc
      - id: micro-behaviors/os/service/control::go-control-service-proc
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
