defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: security-vendor-service-stop-api-cluster
  desc: Service-stop APIs with multiple security-vendor names
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/service/stop::service-stop-control
  any:
  - id: micro-behaviors/os/security/product::malwarebytes-name
  - id: micro-behaviors/os/security/product::kaspersky-name
  - id: micro-behaviors/os/security/product::bitdefender-name
  - id: micro-behaviors/os/security/product::norton-name
  - id: micro-behaviors/os/security/product::mcafee-name
  - id: micro-behaviors/os/security/product::sophos-name
  - id: micro-behaviors/os/security/product::eset-name
  needs: 2
  unless:
  - id: metadata/signed/platform/
