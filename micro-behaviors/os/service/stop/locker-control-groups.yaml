defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
  - id: service-mask-controls
    desc: Service-mask option or termination log
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/process/argument/option::serv-mask-option
      - id: micro-behaviors/os/service/stop::service-mask-kill-success-log
