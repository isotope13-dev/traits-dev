defaults:
  platforms: [windows]
  for: [powershell, batch, python, javascript]
traits:
  - id: powershell-stop-service-command
    desc: PowerShell stops a named service
    crit: notable
    conf: 0.95
    if:
      # The trailing class admits `{` so interpolated names
      # (`Stop-Service -Name {svc}`, `-Name $svc`) match as well as literals.
      type: text
      regex: '(?i)\bStop-Service\s+(-Name\s+)?["''$\w{]'
