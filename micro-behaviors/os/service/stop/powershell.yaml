defaults:
  platforms: [windows]
  for: [powershell, batch, python, javascript]
traits:
  - id: powershell-stop-service-command
    desc: PowerShell named service-stop command text
    crit: notable
    conf: 0.95
    if:
      # The trailing class admits `{` so interpolated names
      # (`Stop-Service -Name {svc}`, `-Name $svc`) match as well as literals.
      type: text
      regex: '(?i)\bStop-Service\s+(-Name\s+)?["''$\w{]'
  - id: powershell-stop-service-call
    desc: Calls PowerShell service stop cmdlet
    crit: notable
    conf: 0.99
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^Stop-Service$'
    # Named arguments already have a finding. This adds pipeline and
    # InputObject invocation forms without counting the same operation twice.
    unless:
      - id: powershell-stop-service-command
