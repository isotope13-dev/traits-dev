defaults:
  crit: notable
  for:
    - shell
    - elf
  platforms:
    - linux
traits:
  - id: systemctl-stop
    desc: systemctl stops a service
    conf: 0.8
    for: [shell, python, javascript]
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*(sudo\s+)?systemctl\s+stop\s+\S+'
    not:
      - regex: '(?m)^%preun\b'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/package/files/system-package::package-post-remove-script
      - id: micro-behaviors/os/package-manager/installer-script::shell-uninstall-function-marker

  - id: launchctl-stop-command
    desc: launchctl stops a service
    conf: 0.82
    for: [shell, python, javascript]
    platforms: [macos]
    mbc: B0028
    attack: T1543.004
    if:
      type: text
      regex: '\blaunchctl\s+stop\s+\S+'
  - id: service-stop
    desc: Service utility stops a daemon
    conf: 0.8
    if:
      type: text
      regex: '(?im)(^|[;&])\s*(sudo\s+)?(/usr/sbin/)?service\s+[A-Za-z0-9_.@-]+\s+stop\b'
    not:
      - regex: '(?i)service\s+(and|or|will|the|is|to|can)\s+stop'
  - id: launchctl-bootout-gui
    desc: launchctl bootout gui service
    conf: 0.86
    mbc: B0028
    attack: T1543.004
    platforms: [macos]
    for: [macho, c, shell]
    if:
      type: text
      substr: launchctl bootout gui/
