defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: go-net-stop-command
    desc: Go constructs a net service-stop command
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)^net(\.exe)?$'
        - index: 1
          kind: string
          regex: '(?i)^stop$'
