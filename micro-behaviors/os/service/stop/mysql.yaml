traits:
  # Stopping one database service is what its own packaging, CI and docs do
  # (MariaDB's debian/salsa-ci.yml stops mysql between upgrade tests).
  # objectives/impact/services/stop::kill-multiple-databases carries intent.
  - id: mysql-service-stop-command
    desc: Stops the MySQL service
    platforms: [linux, macos, windows]
    for: [shell, python, javascript, powershell, batch, pe]
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: (?i)\b(systemctl stop|service mysql stop)\b.{0,40}\b(mysql|mysqld)\b
    unless:
      - id: metadata/lang/source/
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/harness::python-test-file-content
      - id: well-known/lib/ui/ace-editor
    not:
      - regex: '(?i)stop:\s+mysql'
