defaults:
  platforms: [windows]
  for: [data]

traits:
  - id: x86-servicedll-delete-replace-raw
    desc: x86 deletes and writes 128-byte registry value
    crit: component
    conf: 0.95
    if:
      type: hex
      pattern: '68 ?? ?? ?? ?? 52 FF 15 ?? ?? ?? ?? [4-24] 68 80 00 00 00 50 6A 02 6A 00 68 ?? ?? ?? ?? 51 FF 15 ?? ?? ?? ??'

  - id: unparsed-pe-reg-delete-value-a
    desc: RegDeleteValueA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: RegDeleteValueA

  - id: unparsed-pe-reg-set-value-ex-a
    desc: RegSetValueExA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: RegSetValueExA

composite_rules:
  - id: unparsed-servicedll-registry-apis
    desc: LanmanServer ServiceDLL replacement setup in unparsed PE
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/header/malformed::overlapping-dos-pe-header
      - id: micro-behaviors/os/registry/service/reference::lanmanserver-parameters-regpath
      - id: micro-behaviors/os/registry/value-name::service-dll-value
      - id: x86-servicedll-delete-replace-raw
      - id: unparsed-pe-reg-delete-value-a
      - id: unparsed-pe-reg-set-value-ex-a
