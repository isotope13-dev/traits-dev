# A .NET assembly that *is* a Windows service host: it imports the service
# framework and implements the SCM lifecycle callbacks. Neutral on its own —
# vendor updaters and agents are built this way — but it is the persistence
# surface an analyst wants named, because whatever OnStart() launches runs at
# boot without a logged-in user.
defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: dotnet-service-framework-import
    desc: Imports the .NET Windows service framework
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: System.ServiceProcess
