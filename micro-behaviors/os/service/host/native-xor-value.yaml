defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: svchost-group-option-reference
  desc: References svchost service-group command option
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?i)svchost\.exe\s+-k\b
- id: xor-utf16-servicedll-stack-literal
  desc: XOR-masked UTF16 ServiceDll stack literal
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |-
      rule xor_utf16_servicedll_stack_literal {
       strings:
        $s = { C7 44 24 ?? ?? ?? ?? ?? C7 44 24 ?? ?? ?? ?? ?? C7 44 24 ?? ?? ?? ?? ?? C7 44 24 ?? ?? ?? ?? ?? C7 45 ?? ?? ?? ?? ?? }
       condition:
        for any i in (1..#s): (
         uint8(@s[i]+11) == uint8(@s[i]+3)+4 and
         uint8(@s[i]+19) == uint8(@s[i]+3)+8 and
         uint8(@s[i]+27) == uint8(@s[i]+3)+12 and
         with key = uint32(@s[i]+4) ^ 0x00650053 : (
          (uint32(@s[i]+12) ^ key) == 0x00760072 and
          (uint32(@s[i]+20) ^ key) == 0x00630069 and
          (uint32(@s[i]+28) ^ key) == 0x00440065 and
          (uint32(@s[i]+35) ^ key) == 0x006c006c
         )
        )
      }
