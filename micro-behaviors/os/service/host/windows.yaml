defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: advapi32-link
    desc: Links to ADVAPI32.dll (Service Management)
    crit: baseline
    conf: 1.0
    if:
      type: symbol
      exact: DeregisterEventSource
  - id: service-config-change
    desc: Changes service configuration via ADVAPI32
    crit: notable
    conf: 1.0
    if:
      type: symbol
      exact: ChangeServiceConfig2W
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: change-service-config2-ansi
    desc: "Change service config ANSI"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (^|[./])ChangeServiceConfig2A$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: service-dll-value-name
    desc: ServiceDll registry value marker
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: servicedll
      case_insensitive: true
  - id: service-imagepath-value-name
    desc: Service ImagePath registry value marker
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: ImagePath
  - id: svchost-netsvcs-group-name
    desc: Names the svchost netsvcs service group
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: netsvcs
      case_insensitive: true
  - id: reg-add-servicedll-command
    desc: reg.exe sets ServiceDll value
    crit: notable
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+add[^\r\n]{0,180}/v\s+ServiceDll\b'
  - id: reg-add-servicedll-system32-target
    desc: reg.exe points ServiceDll into System32
    crit: notable
    conf: 0.94
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+add[^\r\n]{0,180}/v\s+ServiceDll\b[^\r\n]{0,80}\\System32\\'
  - id: reg-add-registerservice-entrypoint
    desc: reg.exe sets RegisterService entrypoint
    crit: notable
    conf: 0.96
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+add[^\r\n]{0,180}/v\s+ServiceMain\b[^\r\n]{0,100}RegisterService\b'
  - id: system32-service-dll-target
    desc: Service DLL path under System32
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)%+systemroot%+\\\\system32\\\\
  - id: service-parameters-registry-path
    desc: Service parameters registry path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)system\\\\currentcontrolset\\\\services\\\\[^\\\\]{1,80}\\\\parameters
  - id: svchost-k-service-group
    desc: svchost service group command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)svchost\.exe\s+-k\s+"?(%s|[a-z0-9_.-]+)"?
  - id: svchost-system32-service-image
    desc: svchost.exe image under System32
    crit: notable
    conf: 0.9
    for: [batch, powershell, csharp, go]
    if:
      type: text
      regex: '(?i)(%SystemRoot%|%WINDIR%|[A-Z]:\\Windows)\\System32\\svchost\.exe\b'
composite_rules:
  - id: legit-service-host-registration
    desc: Canonical svchost service registration
    crit: notable
    conf: 0.92
    all:
      - id: service-dll-value-name
      - id: system32-service-dll-target
      - id: svchost-k-service-group
    any:
      - id: service-parameters-registry-path
      - id: micro-behaviors/os/service/export::win-service-export
