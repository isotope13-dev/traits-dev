defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
traits:
  - id: native-servicedll-registry-write
    desc: Calls registry setter for ServiceDll
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^RegSetValueEx[AW]?$'
      arg:
        index: 1
        kind: string
        exact: ServiceDll
