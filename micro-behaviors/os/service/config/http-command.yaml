# A directive is configuration text, not proof that a unit was installed,
# enabled, started, elevated, or that an HTTP response was executed. Restrict
# the command position: `ExecStart=/usr/bin/printf curl` is not a curl command.
# Accept escaped newlines too: generated unit text often lives in a literal.
defaults:
  platforms: [linux]
  for: [shell, python, systemd]
  crit: notable
  conf: 0.95

traits:
  - id: systemd-http-client-command-text
    desc: Systemd HTTP-client command directive text
    if:
      type: text
      regex: '(\\n|\b)Exec(Start|Stop|StartPre)\s*=\s*[-@+!]*\s*(/[\w/]+/)?(curl|wget)([\s"'']|$)'
