# Solaris Service Management Facility (SMF) operations.
# These are neutral service-configuration capabilities. Persistence intent is
# inferred by the objective composites that combine them with service-install
# or startup-specific evidence.
defaults:
  platforms: [unix]
  for: [shell, python, go, elf]
  crit: notable
  conf: 0.85

traits:
  - id: solaris-smf-fmri-reference
    desc: References Solaris SMF service FMRI
    if:
      type: text
      substr: 'svc:/'

  - id: solaris-smf-set-property
    desc: Sets a Solaris SMF service property
    if:
      type: text
      regex: '(?m)^\s*(/usr/sbin/)?svccfg\s+-s\s+\S{1,80}\s+setprop\b'

  - id: solaris-smf-refresh
    desc: Refreshes a Solaris SMF service
    if:
      type: text
      regex: '(?m)^\s*(/usr/sbin/)?svcadm\s+refresh\b'

  - id: solaris-smf-enable
    desc: Enables a Solaris SMF service
    if:
      type: text
      regex: '(?m)^\s*(/usr/sbin/)?svcadm\s+enable\b'

  - id: solaris-smf-definition-import
    desc: Imports a Solaris SMF service definition
    if:
      type: text
      regex: '(?m)^\s*(/usr/sbin/)?(run)?svccfg\s+import\b'
