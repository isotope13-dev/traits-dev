# Windows kernel-driver service configuration capabilities.
# These are neutral observations; BYOVD/EDR intent is inferred by objective
# composites that combine them with device I/O and security-product targeting.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, batch, go, rust, python]
  crit: notable
  conf: 0.94

traits:
  - id: kernel-driver-service-type
    desc: Windows kernel-driver service type
    if:
      type: text
      regex: '(?i)\bSERVICE_KERNEL_DRIVER\b'

  - id: kernel-driver-service-command
    desc: sc command creates a kernel-driver service
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[\s\S]{0,160}\btype\s*=\s*kernel\b'

  - id: native-driver-service-registration
    desc: Native code registers a SYS-backed service
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp]
    if:
      type: text
      regex: '(?is)\bCreateService[AW]?\s*\([\s\S]{0,320}\.sys\b'

  - id: powershell-driver-service-cmd
    desc: PowerShell New-Service command
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bNew-Service\b'
  - id: powershell-driver-path
    desc: PowerShell service path targets a SYS file
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)-BinaryPathName\s+[''"'']?[^''"''\r\n]{1,200}\.sys\b'

composite_rules:
  - id: powershell-driver-service-command
    desc: PowerShell creates a kernel-driver service
    crit: notable
    conf: 0.95
    all:
      - id: powershell-driver-service-cmd
      - id: powershell-driver-path
    near_lines: 1
  - id: kernel-driver-service-registration
    desc: Windows kernel-driver service registration
    crit: notable
    conf: 0.95
    any:
      - id: kernel-driver-service-type
      - id: kernel-driver-service-command
      - id: powershell-driver-service-command
      - id: micro-behaviors/os/service/driver::powershell-driver-service-variable-command
      - id: native-driver-service-registration
