# Windows kernel-driver service configuration capabilities.
# These are neutral observations; BYOVD/EDR intent is inferred by objective
# composites that combine them with device I/O and security-product targeting.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, batch, go, rust, python]
  crit: notable
  conf: 0.94

traits:
  - id: kernel-driver-service-type
    desc: Windows kernel-driver service type
    if:
      type: text
      regex: '(?i)\bSERVICE_KERNEL_DRIVER\b'

  - id: kernel-driver-service-command
    desc: sc command creates a kernel-driver service
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[\s\S]{0,160}\btype\s*=\s*kernel\b'

  - id: powershell-driver-service-command
    desc: PowerShell creates a binary-backed service
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bNew-Service\b[\s\S]{0,160}-BinaryPathName\b'

composite_rules:
  - id: kernel-driver-service-registration
    desc: Windows kernel-driver service registration
    crit: notable
    conf: 0.95
    any:
      - id: kernel-driver-service-type
      - id: kernel-driver-service-command
      - id: powershell-driver-service-command
