defaults:
  platforms: [linux]
  for: [elf]
traits:
  # The extractor omits short dotfile paths such as /etc/init.d/.x.
  - id: native-hidden-init-script-path
    desc: Hidden SysV init script path bytes
    crit: notable
    conf: 0.97
    if:
      type: raw
      section: .rodata
      regex: '/etc/init\.d/\.[A-Za-z0-9_-]{1,40}\x00'
