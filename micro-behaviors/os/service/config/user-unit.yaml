defaults:
  platforms: [linux]
  for: [shell, python, rust, c, go, objectivec]
  crit: notable
  conf: 0.9

composite_rules:
- id: systemd-user-unit
  desc: References a user systemd unit configuration
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/service/config::systemd-user-service-directory-path
  any:
  - id: micro-behaviors/os/service/control::systemctl-word
  - id: micro-behaviors/os/service/control::systemctl-enable-command
  - id: micro-behaviors/os/service/control::systemctl-enable-on-line
  - id: micro-behaviors/fs/path/extension::service-unit-filename-literal
  - id: micro-behaviors/os/service/unit-field::exec-start
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: micro-behaviors/os/service/unit-field::wanted-by-target
  unless:
  - id: well-known/app/communication/televault::televault-backup-context
  - id: well-known/app/communication/televault::schedule-module-doc
