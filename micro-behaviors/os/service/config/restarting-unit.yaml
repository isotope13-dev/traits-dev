composite_rules:
- id: restarting-unit-path-reference
  conf: 0.95
  desc: Systemd unit path co-occurs with always-restart setting
  crit: notable
  all:
  - id: micro-behaviors/os/service/config::systemd-etc-unit-path
  - id: micro-behaviors/os/service/restart-policy::restart-always-text
  unless:
  - id: metadata/file/catalog/service::deployment-helper-context
  - id: metadata/package/testing/
traits: []
defaults:
  platforms:
  - linux
  - unix
  for:
  - elf
  - c
  - cpp
  - rust
