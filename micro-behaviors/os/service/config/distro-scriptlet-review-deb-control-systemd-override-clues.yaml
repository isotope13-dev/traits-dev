defaults:
  platforms: [linux]
  for: [deb, shell]
composite_rules:
  - id: deb-control-systemd-override-clues
    desc: Debian script has systemd override and service clues
    crit: suspicious
    conf: 0.99
    # Only on the maintainer script itself. The file default includes `deb`
    # and `archives`, so the rule also ran on the CONTAINER node, where every
    # member's traits are rolled up -- which is how kali-menu's `rm_conffile`
    # cleanup and an unrelated apt path combined into a hostile finding.
    for: [shell]
    all:
      - id: metadata/path/installation::debian-control-hook-path
      - id: micro-behaviors/os/service/config::systemd-service-timer-dropin-path
      - id: micro-behaviors/os/service/control::systemctl-word
      # A drop-in path and systemctl also occur when removing old config.
      # Require a replacement executable directive, not mere service upkeep.
      - id: micro-behaviors/os/service/unit-field::exec-start-text

