defaults:
  platforms:
    - unix
  for: [scripts, binaries]
traits:
  # `User=root` is a neutral service-configuration line shared by systemd unit
  # files and D-Bus activation files (`[D-BUS Service]` + `Exec=` + `User=root`,
  # as in Deepin's org.deepin.dde.*.service). Stock distro daemons declare it
  # routinely, so it carries no persistence intent on its own — the composites
  # in objectives/persistence/system/service/install reference it and supply
  # the intent from their other legs (hidden ExecStart path, /var/tmp payload).
  - id: service-runs-as-root
    desc: Service file declares User=root
    crit: notable
    platforms: [linux]
    for: [python, shell, systemd, go, rust, objc, elf]
    if:
      type: text
      regex: '(?m)^User=root$'

  - id: systemd-xdg-fallback-branch
    desc: Service installer uses systemd/XDG fallback
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'shutil\.which\(.{0,20}systemctl[\s\S]{0,160}_install_xdg_autostart'

  - id: systemd-keyword
    desc: systemd identifier reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      # Ignore quoted lexicon entries (`"systemd"` keys/values in synonym maps).
      regex: '(?m)(^|[^"])\bsystemd\b($|[^"])'
  - id: nix-systemd-service-definition
    desc: Nix defines a systemd service unit
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '\bsystemd\.services\.[A-Za-z0-9_."''-]+\s*='
  - id: nix-systemd-timer-definition
    desc: Nix defines a systemd timer unit
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '\bsystemd\.timers\.[A-Za-z0-9_."''-]+\s*='
  - id: systemd-etc-unit-path
    desc: References a systemd unit path under /etc
    crit: notable
    conf: 0.85
    for: [c, cpp, objectivec, go, rust, scripts, binaries]
    if:
      type: text
      regex: /etc/systemd/system/[a-zA-Z0-9_\-]+\.(service|timer|socket|target)

  - id: systemd-etc-directory-path
    desc: System-wide /etc/systemd directory
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /etc/systemd
    unless:
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
      - id: well-known/tool/detection/skill-scanner::source-context
  - id: systemd-lib-service-path
    desc: Systemd /lib service file path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: /lib/systemd/system/[a-zA-Z0-9_\-]+\.service
  - id: systemd-lib-directory-path
    desc: References the systemd library directory
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(^|[/\\])(usr[/\\])?lib[/\\]systemd([/\\]|$)'
  - id: systemd-binary-path
    desc: References the systemd executable path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|[/\\])(usr[/\\])?lib[/\\]systemd[/\\]systemd($|[^A-Za-z0-9_.-])'
  - id: systemd-user-service-directory-path
    desc: References a user systemd service directory
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\.config.{0,40}systemd.{0,20}user|SYSTEMD_PATH=\$HOME|systemd[\\/]+user[\\/]'
    unless:
      - id: well-known/tool/detection/hol-guard/
      - id: well-known/app/ai/agent-runtime/bobi/
    downgrade:
      any:
        - id: well-known/tool/sysadmin/container/
  - id: init-script-path
    desc: Init.d service script path reference
    crit: notable
    conf: 0.8
    if:
      type: text
      # Match concrete script names and printf-style templates used when a
      # binary writes /etc/init.d/<name> at install time (e.g. /etc/init.d/%s).
      regex: /etc/init\.d/(%[sdXx]|[a-zA-Z0-9_\-]+)
  - id: initd-service-action
    desc: Init.d service action command
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*/etc/init\.d/[A-Za-z0-9_.-]+\s+(start|stop|restart)\b'
    unless:
      - id: well-known/app/network/dropbear::source-tree
  - id: initd-service-enable-action
    desc: Init.d service enable command
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*/etc/init\.d/[A-Za-z0-9_.-]+\s+enable\b'
  - id: sshd-config-path
    desc: SSH daemon configuration file
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /etc/ssh/sshd_config
    unless:
      - type: text
        substr: run_rc_command
  - id: daemon-reload
    desc: systemctl daemon-reload command
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: systemctl\s+daemon-reload
  - id: networkmanager-daemon-path
    desc: References the NetworkManager daemon path
    crit: notable
    conf: 0.8
    for: [c, cpp, elf, shell]
    if:
      type: text
      exact: /usr/sbin/NetworkManager
  - id: native-cron-directory-path
    desc: Native binary references /etc/cron.d
    crit: notable
    conf: 0.88
    for: [elf]
    if:
      type: hex
      pattern: 2F 65 74 63 2F 63 72 6F 6E 2E 64 2F
      section: .rodata
composite_rules:
  - id: systemd-unit-path
    desc: Systemd unit file path reference
    crit: notable
    conf: 0.85
    any:
      - id: systemd-etc-unit-path
      - id: systemd-lib-service-path
