defaults:
  platforms:
    - unix
  for: [scripts, binaries]
traits:
  # The dispatcher every BSD rc.d script ends with. Its presence says the file
  # is an rc.d service script using the stock framework, which is what the
  # service-start and boot-persistence rules check against.
  - id: bsd-rc-subr-dispatcher
    desc: BSD rc.subr run_rc_command dispatcher
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: run_rc_command

  # `User=root` is a neutral service-configuration line shared by systemd unit
  # files and D-Bus activation files (`[D-BUS Service]` + `Exec=` + `User=root`,
  # as in Deepin's org.deepin.dde.*.service). Stock distro daemons declare it
  # routinely, so it carries no persistence intent on its own — the composites
  # in objectives/persistence/system/service/install reference it and supply
  # the intent from their other legs (hidden ExecStart path, /var/tmp payload).
  - id: service-runs-as-root
    desc: Service file declares User=root
    crit: notable
    platforms: [linux]
    for: [python, shell, systemd, go, rust, objc, elf]
    if:
      type: text
      regex: '(?m)^User=root\r?$'

  - id: systemd-xdg-fallback-branch
    desc: Service installer uses systemd/XDG fallback
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'shutil\.which\(.{0,20}systemctl[\s\S]{0,160}_install_xdg_autostart'

  - id: systemd-keyword
    desc: systemd identifier reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      # Ignore quoted lexicon entries (`"systemd"` keys/values in synonym maps).
      regex: '(?m)(^|[^"])\bsystemd\b($|[^"])'
  - id: nix-systemd-service-definition
    desc: Nix defines a systemd service unit
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '\bsystemd\.services\.[A-Za-z0-9_."''-]+\s*='
  - id: nix-systemd-timer-definition
    desc: Nix defines a systemd timer unit
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '\bsystemd\.timers\.[A-Za-z0-9_."''-]+\s*='
  - id: systemd-etc-unit-path
    desc: References a systemd unit path under /etc
    crit: notable
    conf: 0.85
    for: [c, cpp, objectivec, go, rust, scripts, binaries]
    if:
      type: text
      regex: /etc/systemd/system/[a-zA-Z0-9_\-]+\.(service|timer|socket|target)

  - id: systemd-etc-directory-path
    desc: System-wide /etc/systemd directory
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /etc/systemd
    unless:
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
      - id: well-known/tool/detection/skill-scanner::source-context
  - id: systemd-lib-directory-path
    desc: References the systemd library directory
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(^|[/\\])(usr[/\\])?lib[/\\]systemd([/\\]|$)'
  - id: systemd-binary-path
    desc: References the systemd executable path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|[/\\])(usr[/\\])?lib[/\\]systemd[/\\]systemd($|[^A-Za-z0-9_.-])'
  - id: systemd-user-service-directory-path
    desc: References a user systemd service directory
    crit: notable
    conf: 0.8
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '\.config.{0,40}systemd.{0,20}user|SYSTEMD_PATH=\$HOME|systemd[\\/]+user[\\/]'
    unless:
      - id: well-known/tool/detection/hol-guard/
      - id: well-known/app/ai/agent-runtime/bobi/
    downgrade:
      any:
        - id: well-known/tool/sysadmin/container/
  - id: init-script-path
    desc: Init.d service script path reference
    crit: notable
    conf: 0.8
    for: [scripts, binaries, c, cpp, go, rust]
    if:
      type: text
      # Match concrete script names and printf-style templates used when a
      # binary writes /etc/init.d/<name> at install time (e.g. /etc/init.d/%s).
      regex: /etc/init\.d/(%[sdXx]|[a-zA-Z0-9_\-]+)
  - id: initd-service-action
    desc: Init.d service action command
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*/etc/init\.d/[A-Za-z0-9_.-]+\s+(start|stop|restart)\b'
    unless:
      - id: well-known/app/network/dropbear::source-tree
  - id: initd-service-enable-action
    desc: Init.d service enable command
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*/etc/init\.d/[A-Za-z0-9_.-]+\s+enable\b'
  - id: sshd-config-path
    desc: SSH daemon configuration file
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /etc/ssh/sshd_config
    unless:
      - id: bsd-rc-subr-dispatcher
  - id: daemon-reload
    desc: systemctl daemon-reload command
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: systemctl\s+daemon-reload
  - id: networkmanager-daemon-path
    desc: References the NetworkManager daemon path
    crit: notable
    conf: 0.8
    for: [c, cpp, elf, shell]
    if:
      type: text
      exact: /usr/sbin/NetworkManager
  - id: native-cron-directory-path
    desc: Native binary references /etc/cron.d
    crit: notable
    conf: 0.88
    for: [elf]
    if:
      type: hex
      pattern: 2F 65 74 63 2F 63 72 6F 6E 2E 64 2F
      section: .rodata
  - id: systemd-service-timer-dropin-path
    desc: Systemd service or timer drop-in directory
    for: [shell, python, systemd, go, rust, objc, c, cpp]
    platforms: [linux]
    crit: notable
    conf: 0.84
    unless:
    - type: path
      regex: '/tests/'
    if:
      type: text
      regex: '/etc/systemd/(system|user)/[^/\s]{1,80}\.(service|timer)\.d/'
  - id: systemd-socket-path-dropin-path
    desc: Systemd socket or path drop-in directory
    for: [shell, python, systemd, go, rust, objc, c, cpp]
    platforms: [linux]
    crit: notable
    conf: 0.84
    unless:
    - type: path
      regex: '/tests/'
    if:
      type: text
      regex: '/etc/systemd/(system|user)/[^/\s]{1,80}\.(socket|path)\.d/'
  - id: update-rc-d-call
    desc: Calls update-rc.d
    platforms: [linux]
    crit: notable
    conf: 0.7
    attack: T1037.004
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: update-rc.d
    unless:
      - id: well-known/app/network/dropbear::source-tree
  - id: install-verb-before-initd-path
    desc: Install or enable verb before init.d path
    for: [elf, shell, python, javascript, typescript, go, c, cpp, php]
    platforms: [linux]
    crit: notable
    conf: 0.85
    attack: T1037.004
    unless:
      - id: well-known/app/network/dropbear::source-tree
    if:
      type: text
      regex: \b(install|enable|disable)\b.{0,40}/etc/init\.d/[^\s"'`|;]{1,96}
  # `notable`, like the install/enable siblings above: copying a script into
  # /etc/init.d and marking it executable is how every installer ships a
  # service, which is why the unless: list below kept growing (Dockerfiles,
  # packages, WordPress plugins, container templates, OpenSSH, Proxmox, and
  # MariaDB's salsa-ci.yml). linux-init-script supplies the persistence claim.
  - id: write-verb-before-initd-path
    desc: Copy or write verb before init.d path
    for: [elf, shell, python, javascript, typescript, go, c, cpp, php]
    platforms: [linux]
    crit: notable
    conf: 0.85
    attack: T1037.004
    unless:
      - id: metadata/build/docker::dockerfile-basename
      - id: metadata/build/package/
      # W3 Total Cache's clean plugin archive contains packaging helpers that
      # copy an init.d example; the plugin identity is not persistence intent.
      - id: well-known/app/publishing/wordpress-plugins/performance::wordpress-plugin-path-w3-total-cache
      # An APK/deb vendored as test data brings its maintainer scripts with it:
      # apko's pkg/apk/apk/testdata/alpine-*/alpine-baselayout-*.apk installs
      # Alpine's own init tree, which is the fixture, not the behavior.
      - type: path
        regex: 'testdata/'
      # A container template's whole job is to build a root filesystem, init
      # scripts included -- lxc ships usr/share/lxc/templates/lxc-busybox.
      - id: metadata/build/package-builder::container-rootfs-template-path
      # OpenSSH's own buildpkg.sh.in installs its init script; that is the
      # package build recipe for the service, not persistence added to a host.
      - id: well-known/app/network/openssh::source-tree-path
      - id: metadata/package/tooling::proxmoxve-community-scripts
    if:
      type: text
      regex: \b(copy|write|chmod|chown)\b.{0,40}/etc/init\.d/[^\s"'`|;]{1,96}
  - id: rc-common-init-script-header
    desc: Init script runs via /etc/rc.common
    for: [scripts, source, elf, pyc, -perl]
    platforms: [openwrt, macos]
    crit: notable
    conf: 0.9
    # Two spellings: `#!/bin/sh /etc/rc.common` runs the script through
    # OpenWrt's init wrapper directly, and `. /etc/rc.common` sources it from a
    # plain /bin/sh script. The sourced form is also how legacy macOS
    # StartupItems (MariaDB's MySQLCOM) begin, so this is the init-script
    # convention, not an OpenWrt identity; the OpenWrt composites add that.
    if:
      type: text
      regex: '(?m)(#!/bin/sh |^[ \t]*\.[ \t]+)/etc/rc\.common'
composite_rules:
  - id: systemd-unit-path
    desc: Systemd unit file path reference
    crit: notable
    conf: 0.85
    any:
      - id: systemd-etc-unit-path
      - id: micro-behaviors/fs/path/config/system::systemd-lib-service-path
