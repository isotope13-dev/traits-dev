defaults:
  platforms: [unix]
  for: [binaries, scripts, c, cpp, go, rust]

traits:
  - id: sysv-runlevel-start-path-reference
    desc: References a SysV runlevel start-script path
    crit: notable
    conf: 0.9
    if:
      type: text
      # Not on a `#` comment line: MariaDB's mysql.server init script says it
      # "is linked to /etc/rc3.d/S99mysql" in its header prose. `#` followed by
      # a letter (`#define`) still counts, so a C path table is still seen.
      regex: '(?m)^([^#\n]|#\w)*/etc/(init\.d/[\w.-]{0,16}|rc[0-9S]\.d)/S[0-9]{2}[A-Za-z]'
    unless:
      # The package managers named above, caught in the act. Debian's own
      # procps.postinst carries `/etc/rcS.d/S30procps.sh` twice -- in the code
      # that *removes* the stale symlink (`update-rc.d -f procps.sh remove`,
      # then `rm -f`). That is the boot sequence being cleaned up by the tool
      # whose job it is, which is the opposite of a program installing itself.
      - id: metadata/build/package/maintainer-scripts::debhelper-init-maintainer-block
      - id: metadata/package/testing/
      - id: well-known/app/infrastructure/chef::chef-source-context

      - id: "metadata/file/naming::test-directory-component"
