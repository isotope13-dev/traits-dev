defaults:
  platforms: [linux]
  for: [shell, go, python]
  crit: notable
  conf: 0.9
traits:
  # A unit whose only job is to systemctl-start another unit: a watchdog
  # that revives a service an administrator stopped.
  - id: unit-execstart-starts-other-unit
    desc: Systemd unit ExecStart starts another unit
    if:
      type: text
      regex: 'ExecStart=\S{0,20}systemctl\s+(start|restart)\s+[\w@.-]{1,64}\.service'
  - id: on-unit-active-timer-text
    desc: Systemd timer repeats after unit activation
    if:
      type: text
      regex: 'OnUnitActiveSec\s*=\s*\d'
