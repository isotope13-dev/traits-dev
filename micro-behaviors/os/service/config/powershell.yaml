# PowerShell service configuration is a neutral capability.  Kernel-driver
# intent remains in windows-driver.yaml; a DLL or EXE service is not a driver.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1543.003
  mbc: B0011.003

traits:
  - id: powershell-binary-service-command
    desc: PowerShell creates binary-backed service
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bNew-Service\b[\s\S]{0,160}-BinaryPathName\b'
