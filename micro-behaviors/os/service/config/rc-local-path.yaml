traits:
- id: etc-rc-local
  for:
  - c
  - cpp
  - elf
  - go
  - javascript
  - lua
  - php
  - python
  - shell
  - typescript
  crit: notable
  desc: References rc.local boot script path
  conf: 0.8
  if:
    type: text
    substr: /etc/rc.local
  unless:
  - id: metadata/file/catalog/persistence-path::persistence-path-catalog-constant
  - type: path
    regex: (?i)(^|[\\/])(include|libc|libcxx|libtsan)[\\/]
composite_rules: []
defaults:
  platforms:
  - linux
