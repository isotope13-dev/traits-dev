# Neutral structural/config properties of a systemd .service unit file.
# These describe what a unit file IS (ExecStart=, [Install], WantedBy=,
# Description=, blank-line layout, dependency declarations) — neutral service
# configuration mechanics, not persistence intent. A normal distro-shipped
# unit file satisfies many of these; the persistence verdict lives in the
# objectives/persistence/system/service/systemd composites that combine them
# with genuinely suspicious evidence (dangerous ExecStart path, missing docs,
# timer/path/socket triggers).
defaults:
  platforms: [linux]
  for: [systemd]
traits:
- id: exec-start-text
  desc: References a systemd ExecStart directive
  crit: notable
  # Native daemons/stealers that author a unit file at runtime embed these
  # directives as plain strings; elf is included so the systemd composites can
  # fire on compiled binaries that author units.
  for: [shell, python, go, rust, objc, elf]
  if:
    type: text
    word: "ExecStart"
  unless:
  - id: well-known/app/system/drivers/

- id: exec-start-empty-directive
  desc: Bare ExecStart= with empty value
  crit: notable
  conf: 0.92
  # IoT bots often embed `ExecStart=\0` and fill the payload path at install
  # time. String extractors drop the trailing-nul bare directive, so match
  # the exact byte sequence in ELF only.
  for: [elf]
  if:
    type: hex
    section: rodata
    pattern: "45 78 65 63 53 74 61 72 74 3D 00"


- id: exec-start-kv
  desc: Systemd unit declares an ExecStart command
  crit: component
  if:
    type: value
    path: "service.exec_start"
  unless:
  - id: well-known/app/system/drivers/

- id: wanted-by-multi-user-text
  desc: References systemd multi-user WantedBy directive
  crit: notable
  conf: 0.7
  # `c`/`cpp` included for the same reason the rest of the systemd surface
  # carries them: a C implant that installs its own unit holds the unit body
  # as a string literal, so the directive appears in the source, not just in
  # the .service file it writes.
  for: [shell, python, go, rust, objc, elf, c, cpp]
  if:
    type: text
    word: "WantedBy=multi-user.target"

- id: exec-start-expected-core
  desc: ExecStart from standard system path
  crit: baseline
  if:
    type: value
    path: "service.exec_start"
    regex: "^/(s?bin|usr/(s?bin|lib))/"
  unless:
  - id: well-known/app/system/drivers/

# Distro units commonly ExecStart from /usr/lib or /usr/sbin (generators,
# helpers). Neutral path shape — not persistence intent on its own.
- id: exec-start-expected-system
  desc: ExecStart from system library path
  crit: baseline
  if:
    type: value
    path: "service.exec_start"
    regex: "^/(usr/sbin|usr/lib)/"
  unless:
  - id: well-known/app/system/drivers/

- id: blank-line-separator
  desc: Unit file blank line separator
  crit: component
  count_min: 2
  if:
    type: text
    regex: '[\r\n]{2,}'
  unless:
  - id: well-known/app/system/drivers/

- id: documentation-exists
  desc: Unit Documentation= exists
  crit: component
  if:
    type: value
    path: "unit.documentation"
    exists: true

- id: unit-description-exists
  desc: Unit Description= exists
  crit: component
  if:
    type: value
    path: "unit.description"
    exists: true
  unless:
  - id: well-known/app/system/drivers/

- id: system-helper-description
  desc: Generic systemd helper service description
  crit: component
  conf: 0.92
  for: [elf, shell, python, systemd, go, rust, objc]
  if:
    type: text
    exact: "Description=System Helper Service"

# The unit ordering/activation fields (After=, Before=, Requires=, BusName=)
# live together in micro-behaviors/os/service/dependency.
- id: install-wanted-by-exists
  desc: Install WantedBy= exists
  crit: component
  if:
    type: value
    path: "install.wanted_by"
    exists: true
  unless:
  - id: well-known/app/system/drivers/

- id: service-type-minimal--oneshot
  desc: Minimal service type (oneshot)
  crit: baseline
  if:
    type: value
    path: "service.type"
    exact: oneshot
- id: service-type-minimal--idle
  desc: Minimal service type (idle)
  crit: baseline
  if:
    type: value
    path: "service.type"
    exact: idle
composite_rules:
- id: exec-start
  desc: Systemd ExecStart reference or declaration
  crit: component
  for: [shell, python, systemd, go, rust, objc, elf]
  any:
  - id: exec-start-text
  - id: exec-start-kv
  - id: exec-start-empty-directive

- id: service-type-minimal
  desc: Minimal service type (oneshot/idle)
  crit: baseline
  unless:
  - id: well-known/app/system/drivers/
  any:
  - id: service-type-minimal--oneshot
  - id: service-type-minimal--idle
