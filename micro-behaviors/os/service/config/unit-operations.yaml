defaults:
  platforms: [linux]
  for: [shell, python, elf, go, rust, objc]
  crit: notable
  conf: 0.9

composite_rules:
- id: systemd-unit-operations
  desc: References systemd unit fields or controls
  crit: notable
  conf: 0.66
  needs: 2
  # Standalone systemd unit files trivially satisfy multiple indicators
  # (that's their definition). The composite targets scripts/binaries
  # that deploy systemd persistence, not the unit-file artifacts themselves.
  # Lowered to notable because legitimate sysadmin scripts (postinst,
  # ansible plays, distro installers) routinely manage systemd services.
  # systemd-keyword (bare word "systemd") is intentionally excluded: it is a
  # substring of every path indicator (e.g. /etc/systemd/system), so a single
  # benign path reference would satisfy needs:2 on its own. Persistence requires
  # an actual action/unit indicator, not a passing mention of the word.
  any:
  - id: micro-behaviors/os/service/control::systemctl-word
  - id: micro-behaviors/os/service/control::systemctl-enable-command
  - id: micro-behaviors/os/service/control::systemctl-enable-on-line
  - id: micro-behaviors/os/service/unit-field::exec-start
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: micro-behaviors/os/service/unit-field::wanted-by-target
  downgrade:
    any:
    - id: well-known/dual-use/remote-admin/rustdesk/
    - id: well-known/app/system/niri::source-tree
    - id: micro-behaviors/os/service/name::docker-service-unit-name
  unless:
  - id: "metadata/file/naming::readme-requirements-install-basename"
  - id: well-known/lib/native/systemd::systemd-shared-library
  - id: metadata/file/catalog/service::cloud-init-embedded-systemd-bootstrap-unit
