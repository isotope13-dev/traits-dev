composite_rules:
- id: linux-startup-loader-reference-cluster
  desc: Linux startup and loader reference cluster
  crit: notable
  conf: 0.96
  platforms: [linux]
  for: [scripts, binaries]
  needs: 3
  any:
  - id: micro-behaviors/os/service/config::user-systemd-service-reference-profile
  - id: micro-behaviors/os/service/config::init-script-path
  - id: micro-behaviors/os/autorun/login-items::xdg-autostart-entry-reference
  - id: micro-behaviors/os/autorun/cron::reboot-entry-reference
  - id: micro-behaviors/process/interpreter/shell::shell-init-path
  - id: micro-behaviors/fs/path/config/system::ld-so-preload-file
  - id: micro-behaviors/fs/path/config/system::ld-so-conf-dropin-path
  - id: micro-behaviors/fs/path/config/system::modules-load-config-path
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/detection/defensive-scanner-context::linux-persistence-threat-scanner
  - id: metadata/build/docker::dockerfile-basename
  - id: well-known/app/system/raspi-config::raspi-config-persistence-context
