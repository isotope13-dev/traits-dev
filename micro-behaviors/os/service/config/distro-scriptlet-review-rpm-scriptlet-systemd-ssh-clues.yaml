defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: rpm-scriptlet-systemd-ssh-clues
    desc: RPM scriptlet has systemd SSH and key clues
    crit: suspicious
    conf: 0.99
    scope: leaf
    all:
      - id: metadata/build/package/maintainer-scripts::rpm-install-scriptlet-body
      - id: micro-behaviors/os/service/config::systemd-service-timer-dropin-path
      - id: micro-behaviors/communications/ssh/keys::ed25519-key-text-fragment
      - id: micro-behaviors/os/service/remote::sshd-ref

