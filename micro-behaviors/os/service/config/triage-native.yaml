traits:
- id: udev-run-helper-field
  desc: udev RUN append action field
  crit: notable
  conf: 0.86
  downgrade:
    any:
    - id: well-known/lib/format/xml2
    - id: well-known/lib/format/xslt
  if:
    type: text
    regex: (?m)^.{0,240}\bRUN\+=\s*["']
composite_rules:
- id: udev-rule-helper-config
  desc: udev rules path co-occurs with RUN helper field
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/config/system::udev-rules-file-path
  - id: micro-behaviors/os/service/config::udev-run-helper-field
defaults:
  platforms:
  - linux
  for:
  - scripts
  - binaries
