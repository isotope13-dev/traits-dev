# The message supplies cleanup context to systemd configuration/control clues.
# No stop, deletion or persistence installation is required.
defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - elf
  - shell
  size_max: 500000000
  id: systemd-cleanup-indicators
  size_min: 512
  desc: Service configuration with systemd/cron cleanup message
  conf: 0.95
  all:
  - id: metadata/lang/natural/diagnostic::turkish-systemd-cron-cleaning-message-text
  - id: micro-behaviors/os/service/config::systemd-unit-operations
