# References describe content; execution requires independent evidence.
composite_rules:
- for:
  - elf
  crit: notable
  platforms:
  - linux
  id: elf-init-script-reference
  desc: ELF references init-script configuration
  conf: 0.9
  any:
  - id: micro-behaviors/os/service/config::sysv-init-script-header
  - id: micro-behaviors/fs/write/system-paths::startup-init-file-redirect
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-initd-script-executable
