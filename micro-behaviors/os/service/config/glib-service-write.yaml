defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: glib-service-definition-write
    desc: GLib writes a service definition
    # The complete second argument is constant source text, whether written
    # as one literal or a bounded string addition. This does not activate it.
    if:
      type: symbol
      kind: call
      exact: GLib.file_set_contents
      arg:
        index: 1
        kind: string
        regex: '(?ms)^\[(D-BUS )?Service\]\r?\n.{0,400}^Exec(Start)?=/'

  - id: glib-curl-shell-service-definition
    desc: Writes service definition with curl pipeline
    crit: suspicious
    if:
      type: symbol
      kind: call
      exact: GLib.file_set_contents
      arg:
        index: 1
        kind: string
        regex: "(?s)\\[(D-BUS )?Service\\].{0,120}Exec(Start)?=/bin/(ba)?sh -c 'curl[^']{1,160}\\| sh'"
