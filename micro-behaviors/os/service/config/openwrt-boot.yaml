defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
- id: openwrt-boot-config-surface-cluster
  desc: OpenWrt identity path with multiple boot configuration references
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/os/identity::openwrt-release-or-banner-path
  needs: 2
  any:
  - id: micro-behaviors/os/service/config::systemd-etc-unit-path
  - id: micro-behaviors/os/autorun/cron::crontab-string
  - id: micro-behaviors/os/service/config::rc-common-init-script-header
  - id: micro-behaviors/os/service/config::etc-rc-local
