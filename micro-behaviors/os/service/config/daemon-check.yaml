defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: daemon-check-service-variable
    desc: SysV daemon checks variable service name
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: \bdaemon\s+--check\s+\$\w+
composite_rules:
  - id: sysv-daemon-startup-layout
    desc: SysV service headers, PID file and checked daemon helper
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/service/config::sysv-chkconfig-header
      - id: micro-behaviors/os/service/config::sysv-init-script-header
      - id: micro-behaviors/os/service/config::subsys-lockfile
      - id: daemon-check-service-variable
      - id: micro-behaviors/fs/path/host-process::varrun-pidfile-path
