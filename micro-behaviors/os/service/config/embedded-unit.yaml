defaults:
  platforms: [linux]
  for: [shell, python, elf, go, rust, objc]
  crit: notable
  conf: 0.9

composite_rules:
- id: embedded-systemd-unit
  desc: Embeds systemd service directives
  crit: notable
  conf: 0.9
  # Targets scripts/binaries that author/embed a .service file inline;
  # standalone .service unit files trivially match ExecStart + WantedBy
  # by definition and should not be flagged as their own persistence.
  all:
  - id: micro-behaviors/os/service/unit-field::exec-start
  any:
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: micro-behaviors/os/service/unit-field::wanted-by-target
  downgrade:
    any:
    - id: well-known/dual-use/remote-admin/rustdesk/
    - id: "metadata/file/policy/config/services::unit-exec-start-system-path"
  unless:
  - id: metadata/file/catalog/service::cloud-init-embedded-systemd-bootstrap-unit
