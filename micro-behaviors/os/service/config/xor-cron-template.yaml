# Resolve fixed-stride XOR table operands from executable decoder code.
# The key, slot count/stride and data addresses vary. Decoded prefixes are
# behavior evidence; no campaign endpoint, process label or exact size gates.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]

traits:
  - id: xor-table-cron-shell-template
    desc: XOR table holds root cron launch template
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "elf"
        rule xor_cron_template {
          strings:
            $decode = { 0F B6 BE ?? ?? ?? ?? 31 D2 EB ?? 69 C6 ?? ?? ?? ?? B9 ?? ?? ?? ?? 89 45 ?? 89 D0 31 D2 F7 F1 8A 82 ?? ?? ?? ?? 8B 55 ?? 32 84 13 ?? ?? ?? ?? 88 84 13 ?? ?? ?? ?? }
          condition:
            uint16(0) == 0x457f and elf.machine == elf.EM_386 and
            for any d in (1..#decode) : (
              uint16(@decode[d]-17) == 0xfe81 and uint8(@decode[d]-11) == 0x77 and
              for any c in (0..elf.number_of_sections-1) : (
                elf.sections[c].name == ".text" and
                @decode[d] >= elf.sections[c].offset and
                @decode[d]+!decode[d] <= elf.sections[c].offset+elf.sections[c].size
              ) and
              for any s in (0..elf.number_of_sections-1) : (
                elf.sections[s].name == ".rodata" and
                for any delta in (elf.sections[s].address-elf.sections[s].offset..elf.sections[s].address-elf.sections[s].offset) : (
                  uint32(@decode[d]+13) >= 32 and uint32(@decode[d]+13) <= 512 and
                  uint32(@decode[d]+18) >= 2 and uint32(@decode[d]+18) <= 64 and
                  (uint32(@decode[d]-15)+1) >= 2 and (uint32(@decode[d]-15)+1) <= 1024 and
                  (uint32(@decode[d]+3)-delta) >= elf.sections[s].offset and (uint32(@decode[d]+3)-delta)+(uint32(@decode[d]-15)+1) <= elf.sections[s].offset+elf.sections[s].size and
                  (uint32(@decode[d]+33)-delta) >= elf.sections[s].offset and (uint32(@decode[d]+33)-delta)+uint32(@decode[d]+18) <= elf.sections[s].offset+elf.sections[s].size and
                  (uint32(@decode[d]+43)+1-delta) >= elf.sections[s].offset and (uint32(@decode[d]+43)+1-delta)+(uint32(@decode[d]-15)+1)*uint32(@decode[d]+13) <= elf.sections[s].offset+elf.sections[s].size and
                    for any slot in (0..(uint32(@decode[d]-15)+1)-1) : (
                      uint8((uint32(@decode[d]+3)-delta) + slot) <= uint32(@decode[d]+13) and
                        uint8((uint32(@decode[d]+3)-delta) + slot) >= 38 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 0) ^ uint8((uint32(@decode[d]+33)-delta) + (0 % uint32(@decode[d]+18)))) == 42 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 1) ^ uint8((uint32(@decode[d]+33)-delta) + (1 % uint32(@decode[d]+18)))) == 47 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 2) ^ uint8((uint32(@decode[d]+33)-delta) + (2 % uint32(@decode[d]+18)))) == 53 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 3) ^ uint8((uint32(@decode[d]+33)-delta) + (3 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 4) ^ uint8((uint32(@decode[d]+33)-delta) + (4 % uint32(@decode[d]+18)))) == 42 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 5) ^ uint8((uint32(@decode[d]+33)-delta) + (5 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 6) ^ uint8((uint32(@decode[d]+33)-delta) + (6 % uint32(@decode[d]+18)))) == 42 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 7) ^ uint8((uint32(@decode[d]+33)-delta) + (7 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 8) ^ uint8((uint32(@decode[d]+33)-delta) + (8 % uint32(@decode[d]+18)))) == 42 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 9) ^ uint8((uint32(@decode[d]+33)-delta) + (9 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 10) ^ uint8((uint32(@decode[d]+33)-delta) + (10 % uint32(@decode[d]+18)))) == 42 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 11) ^ uint8((uint32(@decode[d]+33)-delta) + (11 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 12) ^ uint8((uint32(@decode[d]+33)-delta) + (12 % uint32(@decode[d]+18)))) == 114 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 13) ^ uint8((uint32(@decode[d]+33)-delta) + (13 % uint32(@decode[d]+18)))) == 111 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 14) ^ uint8((uint32(@decode[d]+33)-delta) + (14 % uint32(@decode[d]+18)))) == 111 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 15) ^ uint8((uint32(@decode[d]+33)-delta) + (15 % uint32(@decode[d]+18)))) == 116 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 16) ^ uint8((uint32(@decode[d]+33)-delta) + (16 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 17) ^ uint8((uint32(@decode[d]+33)-delta) + (17 % uint32(@decode[d]+18)))) == 37 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 18) ^ uint8((uint32(@decode[d]+33)-delta) + (18 % uint32(@decode[d]+18)))) == 115 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 19) ^ uint8((uint32(@decode[d]+33)-delta) + (19 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 20) ^ uint8((uint32(@decode[d]+33)-delta) + (20 % uint32(@decode[d]+18)))) == 37 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 21) ^ uint8((uint32(@decode[d]+33)-delta) + (21 % uint32(@decode[d]+18)))) == 115 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 22) ^ uint8((uint32(@decode[d]+33)-delta) + (22 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 23) ^ uint8((uint32(@decode[d]+33)-delta) + (23 % uint32(@decode[d]+18)))) == 62 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 24) ^ uint8((uint32(@decode[d]+33)-delta) + (24 % uint32(@decode[d]+18)))) == 47 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 25) ^ uint8((uint32(@decode[d]+33)-delta) + (25 % uint32(@decode[d]+18)))) == 100 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 26) ^ uint8((uint32(@decode[d]+33)-delta) + (26 % uint32(@decode[d]+18)))) == 101 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 27) ^ uint8((uint32(@decode[d]+33)-delta) + (27 % uint32(@decode[d]+18)))) == 118 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 28) ^ uint8((uint32(@decode[d]+33)-delta) + (28 % uint32(@decode[d]+18)))) == 47 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 29) ^ uint8((uint32(@decode[d]+33)-delta) + (29 % uint32(@decode[d]+18)))) == 110 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 30) ^ uint8((uint32(@decode[d]+33)-delta) + (30 % uint32(@decode[d]+18)))) == 117 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 31) ^ uint8((uint32(@decode[d]+33)-delta) + (31 % uint32(@decode[d]+18)))) == 108 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 32) ^ uint8((uint32(@decode[d]+33)-delta) + (32 % uint32(@decode[d]+18)))) == 108 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 33) ^ uint8((uint32(@decode[d]+33)-delta) + (33 % uint32(@decode[d]+18)))) == 32 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 34) ^ uint8((uint32(@decode[d]+33)-delta) + (34 % uint32(@decode[d]+18)))) == 50 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 35) ^ uint8((uint32(@decode[d]+33)-delta) + (35 % uint32(@decode[d]+18)))) == 62 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 36) ^ uint8((uint32(@decode[d]+33)-delta) + (36 % uint32(@decode[d]+18)))) == 38 and
                        (uint8((uint32(@decode[d]+43)+1-delta) + slot * uint32(@decode[d]+13) + 37) ^ uint8((uint32(@decode[d]+33)-delta) + (37 % uint32(@decode[d]+18)))) == 49
                    )
                )
              )
            )
        }
