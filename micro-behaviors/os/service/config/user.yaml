defaults:
  platforms: [linux, macos]
  for: [python]

traits:
  - id: python-user-systemd-unit
    desc: Python writes a user systemd unit
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.config/systemd/user[\s\S]{0,500}(ExecStart|systemctl\s+--user|daemon-reload|enable)'
  - id: workflow-user-service-path
    desc: Workflow references user service path
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: text
      regex: 'systemd/user|\.service'
  - id: workflow-user-service-action
    desc: Workflow runs service action
    crit: notable
    conf: 0.9
    for: [github-actions]
    if:
      type: text
      regex: 'ExecStart|daemon-reload|systemctl\s+--user'

composite_rules:
  - id: workflow-user-service-config
    desc: Workflow configures user service
    crit: notable
    conf: 0.9
    for: [github-actions]
    near_bytes: 512
    all:
      - id: workflow-user-service-path
      - id: workflow-user-service-action
