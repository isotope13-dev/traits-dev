defaults:
  platforms: [unix]
  attack: T1098
  for: [elf, macho, go, rust, c, cpp]

traits:
  # Three consecutive "no" forwarding directives in one literal are a config
  # block to be appended to sshd_config, not the daemon's own keyword table
  # (which stores each keyword as a separate string).
  - id: sshd-forwarding-disable-template
    desc: Binary embeds sshd forwarding-off config
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'X11Forwarding no\s{1,3}AllowTcpForwarding no\s{1,3}AllowAgentForwarding no'

  - id: sshd-force-command-directive
    desc: Binary names the sshd ForceCommand directive
    crit: notable
    conf: 0.8
    if:
      type: text
      word: ForceCommand
