# Neutral systemd environment configuration. EnvironmentFile= and
# Environment= describe how a service receives configuration; they do not
# establish persistence or malicious intent by themselves.
defaults:
  platforms: [linux]
  for: [systemd]

traits:
- id: environment-file-exists
  desc: Systemd service declares an EnvironmentFile
  crit: notable
  if:
    type: value
    path: "service.environment_file"
    exists: true

- id: environment-list-exists
  desc: Systemd service declares Environment variables
  crit: notable
  if:
    type: value
    path: "service.environment_list"
    exists: true
  unless:
    - id: well-known/app/system/drivers/

composite_rules:
- id: service-environment-exists
  desc: Systemd service environment is configured
  crit: notable
  any:
  - id: environment-file-exists
  - id: environment-list-exists
