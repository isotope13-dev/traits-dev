defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.7
traits:
  - id: telnetd
    desc: telnetd daemon reference
    if:
      type: text
      word: telnetd
    unless:
      - id: metadata/file/format/
      - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
      - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
  - id: apache2
    desc: apache2 daemon reference
    if:
      type: text
      regex: '(^|[\s"`(/])apache2(\s|$)'
    not:
      - substr: /etc/apache2/mime.types
    unless:
      - id: metadata/file/catalog/identity/
  - id: ftpd
    desc: FTP daemon software name reference
    crit: component
    if:
      type: text
      word: ftpd
    unless:
      - id: metadata/file/format/
      - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
      - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
  - id: inetd
    desc: inetd daemon reference
    for:
      - c
      - html
    platforms:
      - unix
    if:
      type: text
      substr: /usr/sbin/inetd
  - id: auditd-name-marker
    desc: auditd daemon name token
    crit: component
    conf: 0.8
    if:
      type: text
      word: auditd
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  # A bare "ftpd" name is just an FTP-software reference (FFmpeg names pure-ftpd
  # in its ftp muxer help). Claiming an FTP *daemon* requires FTP protocol
  # command handling too; FFmpeg's ftp *client* carries the same verbs, so the
  # multimedia-library marker rules it out as a server.
  - id: ftpd-daemon
    desc: FTP daemon with protocol command handling
    crit: notable
    conf: 0.8
    all:
      - id: ftpd
      - id: micro-behaviors/communications/ftp/control::ftp-protocol-support
    unless:
      - id: well-known/lib/media/ffmpeg/
  - id: remote-access-daemons
    desc: Remote access daemon references
    any:
      - id: telnetd
      - id: micro-behaviors/os/service/remote::sshd-ref
      - id: ftpd-daemon
      - id: metadata/lang/source/naming/target::httpd-name-reference
      - id: inetd

  - id: remote-daemon-name-cluster
    desc: Multiple remote-service daemon names
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: telnetd
      - id: metadata/lang/source/naming/target::httpd-name-reference
      - id: micro-behaviors/os/service/remote::sshd-path
      - id: micro-behaviors/os/service/remote::dropbear-ref
    unless:
      - id: well-known/app/network/openssh/
      - id: well-known/app/infrastructure/apache-httpd::source-tree
      - id: well-known/tool/development/editor/cmder::vendor-member
      - id: well-known/lib/network/curl::source-tree-path
      - id: metadata/package/files/system-package::dpkg-maintainer-script
  - id: system-daemon-name-marker-set
    desc: Three distinct system-daemon name strings
    crit: notable
    conf: 0.85
    needs: 3
    near_bytes: 2048
    any:
      - id: auditd-name-marker
      - id: micro-behaviors/process/info/name::inetd-name-reference
      - id: micro-behaviors/os/service/remote::sshd-ref
      - id: micro-behaviors/process/info/name::webserv-name-reference
