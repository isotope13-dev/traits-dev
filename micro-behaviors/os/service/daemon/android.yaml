defaults:
  platforms: [android]
  for: [apk, zip, dex]
  crit: notable
  conf: 0.86

traits:
  - id: android-persistent-process-service-name
    desc: Android persistent-process service name
    crit: component
    conf: 0.94
    if:
      type: text
      substr: PersistentProcessService

  - id: android-second-process-service-name
    desc: Android secondary-process service name
    crit: component
    conf: 0.94
    if:
      type: text
      substr: SecondProcessService

  - id: android-daemon-client-reference
    desc: Android process daemon client reference
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "Lcom/jiubang/commerce/daemon/DaemonClient;"

  - id: android-service-reference
    desc: Android service or job-service reference
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'android\.app\.Service|<service|JobService|ForegroundService'

  - id: android-job-service
    desc: Android JobService reference
    if:
      type: text
      substr: "Landroid/app/job/JobService;"

  - id: android-boot-completed-action
    desc: Android boot completed receiver
    conf: 0.9
    if:
      type: text
      substr: "android.intent.action.BOOT_COMPLETED"

  - id: android-boot-completed-permission
    desc: RECEIVE_BOOT_COMPLETED permission
    for: [xml, java, kotlin]
    conf: 0.9
    if:
      type: text
      word: "RECEIVE_BOOT_COMPLETED"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

  - id: android-foreground-service-permission
    desc: Android foreground service permission
    conf: 0.88
    if:
      type: text
      substr: "android.permission.FOREGROUND_SERVICE"

  - id: android-foreground-service-permission-text
    desc: FOREGROUND_SERVICE permission
    for: [xml, java, kotlin]
    conf: 0.85
    crit: notable
    if:
      type: text
      word: "FOREGROUND_SERVICE"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

  - id: android-write-sync-settings-permission
    desc: WRITE_SYNC_SETTINGS permission
    for: [xml, java, kotlin]
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "WRITE_SYNC_SETTINGS"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

  - id: android-background-service-names
    desc: Android opaque service names
    crit: component
    conf: 0.88
    if:
      type: text
      regex: "Lcom/mante/daily/cleaner/data/repository/(Hige|Dinga|Badesin)Service;"

  - id: android-fox-component-names
    desc: Android Fox boot service component names
    crit: component
    conf: 0.92
    if:
      type: text
      regex: "Fox(BootReceiver|HeartbeatReceiver|Service|Worker);"

  - id: android-fox-start-persistence
    desc: Android Fox start persistence method
    crit: component
    conf: 0.92
    if:
      type: text
      word: startFoxPersistence

composite_rules:
  - id: android-two-process-daemon-client
    desc: Android daemon coordinates two app processes
    crit: suspicious
    conf: 0.96
    all:
      - id: android-persistent-process-service-name
      - id: android-second-process-service-name
      - id: android-daemon-client-reference
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
