# A native helper bundled with an Android app that watches its parent process
# and relaunches the app's service through `am startservice` when the parent
# dies.  The legs are strings and imports in the helper ELF itself.
defaults:
  platforms: [android]
  for: [elf]
  crit: notable
  conf: 0.85

traits:
  - id: android-am-startservice-argument
    desc: ELF holds the am startservice argument
    if:
      type: text
      exact: startservice

  - id: parent-process-death-message
    desc: ELF holds a parent-process-dead message
    if:
      type: text
      regex: '(?i)\bparent\W{0,12}dead\b'

composite_rules:
  - id: android-native-service-respawn-daemon
    desc: Native daemon restarts Android service when parent dies
    crit: suspicious
    conf: 0.93
    all:
      - id: android-am-startservice-argument
      - id: parent-process-death-message
      - id: micro-behaviors/process/create/exec::execlp-process-launch
      - id: micro-behaviors/process/daemonize/detach::setsid-import
