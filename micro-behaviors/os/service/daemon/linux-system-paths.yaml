defaults:
  platforms: [linux]
  for: [elf]
  attack: T1562.001
  mbc: B0024
traits:
  - id: daemon-path-snapd
    desc: snapd daemon path
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: /usr/lib/snapd/snapd
  - id: daemon-path-fwupd
    desc: fwupd daemon path
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: /usr/lib/fwupd/fwupd
  - id: daemon-path-boltd
    desc: boltd daemon path
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: /usr/lib/boltd/boltd
  - id: daemon-path-udisksd
    desc: udisksd daemon path
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: /usr/lib/udisks2/udisksd
  - id: daemon-path-cupsd
    desc: cupsd daemon path
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: /usr/sbin/cupsd
  - id: daemon-path-accounts
    desc: accounts-daemon path
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: /usr/lib/accountsservice/accounts-daemon
  - id: daemon-path-packagekit
    desc: packagekitd daemon path
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: /usr/lib/packagekit/packagekitd
  - id: daemon-path-abrtd
    desc: abrtd daemon path
    for: [elf, c, cpp]
    platforms: [linux, openwrt]
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "/usr/sbin/abrtd"
  - id: daemon-path-udevd
    desc: udevd daemon path
    for: [elf, c, cpp]
    platforms: [linux, openwrt]
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "/sbin/udevd"
  - id: daemon-path-postfix-master
    desc: postfix-master daemon path
    for: [elf, c, cpp]
    platforms: [linux, openwrt]
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "/usr/libexec/postfix/master"
  - id: daemon-path-upowerd
    desc: upowerd daemon path
    for: [elf, c, cpp]
    platforms: [linux, openwrt]
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "/usr/libexec/upowerd"
  - id: daemon-path-chronyd
    desc: chronyd daemon path
    for: [elf, c, cpp]
    platforms: [linux, openwrt]
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "/usr/sbin/chronyd"
  - id: daemon-path-polkitd
    desc: polkitd daemon path
    for: [elf, c, cpp]
    platforms: [linux, openwrt]
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "/usr/lib/polkit-1/polkitd"
  - id: daemon-path-tuned
    desc: tuned daemon path
    for: [elf, c, cpp]
    platforms: [linux, openwrt]
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "/usr/sbin/tuned"
  - id: daemon-path-atd
    desc: atd daemon path
    for: [elf, c, cpp]
    platforms: [linux, openwrt]
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "/usr/sbin/atd"
    unless:
      # The crash dump analyser names the kernel threads it reports.
      - id: well-known/tool/reverse-engineering/crash-utility::crash-utility-source
