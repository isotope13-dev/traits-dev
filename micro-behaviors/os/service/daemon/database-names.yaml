composite_rules:
- id: native-database-service-names
  desc: References a database server process name
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/application/target/server::postgres-name-reference
  - id: micro-behaviors/os/service/daemon::redis-name-reference
  - id: micro-behaviors/os/application/target/server::mongod-name
defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf
