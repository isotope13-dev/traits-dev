composite_rules:
- id: native-web-service-names
  desc: References a server or SSH daemon name
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/service/daemon::httpd-name
  - id: metadata/file/catalog/service::nginx-name-reference
  - id: micro-behaviors/os/service/daemon::apache2-name-reference
  - id: micro-behaviors/os/service/remote::sshd-ref
defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf
