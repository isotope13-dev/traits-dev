traits:
  # An ordinary CLI option. The SAM service-exploit composite in
  # objectives/privilege-escalation/exploit/vulnerabilities pairs it with the
  # SAM + create-service + start-service legs.
  - id: service-cli-flag
    desc: Command line has a --service flag
    platforms: [windows]
    for: [pe, c, cpp]
    crit: notable
    conf: 0.6
    if:
      type: text
      # The flag itself, not a longer option such as --service-version.
      regex: '(?i)--service([ =\t"''\x00]|$)'
