defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  conf: 0.4
traits:
  - id: apache2-name-reference
    crit: notable
    desc: References the apache2 service name
    if:
      type: text
      regex: '(?i)(^|[^\w-])apache2($|[^\w-])'
    # Hyphen-attached MIME subtype tokens are not service names.
    unless:
      - id: metadata/package/license::apache-license-text
  - id: redis-name-reference
    crit: notable
    desc: References Redis server name
    if:
      type: text
      word: redis
