defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  conf: 0.4
traits:
  - id: apache-name-reference
    crit: notable
    desc: References httpd or apache2 service name
    if:
      type: text
      regex: '(?i)\b(httpd|apache2)\b'
    unless:
      - id: metadata/package/license::apache-license-text
  - id: redis-name-reference
    crit: notable
    desc: References Redis server name
    if:
      type: text
      word: redis
