defaults:
  platforms: [unix, windows]
  for: [go, rust, java, csharp]
traits:
  - id: gcloud-activate-service-account-split
    desc: gcloud activate-service-account (split args)
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"gcloud"[,\s]+"auth"[,\s]+"activate-service-account"'
  - id: gcloud-functions-deploy-split
    desc: gcloud functions deploy (split args)
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"gcloud"[,\s]+"functions"[,\s]+"deploy"'
  - id: gcloud-builds-submit-split
    desc: gcloud builds submit (split args)
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"gcloud"[,\s]+"builds"[,\s]+"submit"'
  - id: gcloud-run-service-split
    desc: gcloud Cloud Run command (split args)
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '"gcloud"[^;]{0,120}"run"'
composite_rules:
  - id: gcloud-deployment-bootstrap-context
    desc: GCP deploy service-account bootstrap context
    crit: exception
    conf: 0.95
    all:
      - id: gcloud-activate-service-account-split
    any:
      - id: gcloud-functions-deploy-split
      - id: gcloud-builds-submit-split
      - id: gcloud-run-service-split
