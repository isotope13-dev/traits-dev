defaults:
  platforms: [macos]
  conf: 0.9

composite_rules:
  - id: launchagent-autostart-key-paths
    desc: LaunchAgent path with autostart plist keys
    crit: notable
    conf: 0.92
    for: [macho, dylib, applescript]
    all:
      - id: micro-behaviors/os/service/plist::runatload-key-reference
      - id: micro-behaviors/os/service/plist::programarguments-key-reference
      - id: micro-behaviors/os/service/launchagent::launchagents-path
    unless:
      - id: well-known/tool/detection/watchmen::watchmen-cli-context
      - id: well-known/app/data/curatorbin::baobab-launchagent-template-context
      - id: well-known/app/ai/coding-agent/
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: launchagent-readonly-manager

  - id: launchagent-readonly-manager
    desc: Reads existing LaunchAgent configuration
    crit: exception
    conf: 0.93
    for: [macho, dylib]
    scope: file
    all:
      - id: micro-behaviors/os/service/launchagent::launchagents-path
      - id: micro-behaviors/os/service/plist::runatload-key-reference
      - id: micro-behaviors/os/service/plist::programarguments-key-reference
      - id: micro-behaviors/fs/enumerate/directory::foundation-directory-contents-at-path
    any:
      - id: micro-behaviors/fs/read/file/full::foundation-dictionary-from-file
      - id: micro-behaviors/fs/read/file/full::foundation-property-list-at-path

