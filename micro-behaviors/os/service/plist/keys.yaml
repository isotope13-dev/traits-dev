defaults:
  platforms: [unix]
  crit: notable
  conf: 0.9

traits:
  - id: plist-programarguments-key
    desc: Plist ProgramArguments key in source text
    for: [javascript, typescript, go, rust, ruby, c, macho]
    if:
      type: text
      substr: '<key>ProgramArguments</key>'
    unless:
      - type: text
        regex: '(?i)(install-service|installService|uninstall-service|uninstallService)'
