defaults:
  platforms: [macos]
  for: [plist]

traits:
  - id: keep-alive
    desc: References plist KeepAlive key
    crit: notable
    conf: 0.8
    if:
      type: value
      path: KeepAlive

  - id: start-interval
    desc: References plist StartInterval key
    crit: notable
    conf: 0.8
    if:
      type: value
      path: StartInterval

