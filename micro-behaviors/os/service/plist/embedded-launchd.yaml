# launchd configuration content. These keys/templates do not prove installation.
defaults:
  platforms: [macos]
  crit: notable
  conf: 0.9
traits:
  - id: embedded-runatload-true
    desc: Embedded launchd plist enables RunAtLoad
    for: [macho, c, javascript]
    if:
      type: text
      regex: '<key>RunAtLoad</key>(\s|\\[nrt]){0,40}<true\s*/>'
  - id: embedded-runatload-key
    desc: Embedded RunAtLoad XML key
    for: [c, macho]
    if:
      type: text
      exact: '<key>RunAtLoad</key>'
  - id: embedded-keepalive-key
    desc: Embedded KeepAlive XML key
    for: [javascript, macho]
    if:
      type: text
      substr: '<key>KeepAlive</key>'
  - id: programarguments-keepalive-template
    desc: Embedded ProgramArguments and KeepAlive XML keys
    for: [macho]
    if:
      type: text
      regex: '<key>ProgramArguments</key>[\s\S]{0,240}<key>KeepAlive</key>'
  - id: runatload-key-reference
    desc: References the RunAtLoad configuration key
    for: [macho, dylib, scripts, applescript]
    if:
      type: text
      word: RunAtLoad
  - id: programarguments-key-reference
    desc: ProgramArguments configuration key reference
    for: [macho, dylib, scripts, applescript]
    if:
      type: text
      word: ProgramArguments
