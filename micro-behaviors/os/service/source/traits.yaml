defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.85

traits:
  - id: init-helper-functions
    desc: Sources SysV init helper functions
    if:
      type: text
      regex: \.\s+/etc/rc\.d/init\.d/functions|source\s+/etc/rc\.d/init\.d/functions

  - id: sysconfig-file
    desc: Sources SysV service configuration
    conf: 0.8
    if:
      type: text
      regex: \.\s+/etc/sysconfig/|source\s+/etc/sysconfig/
