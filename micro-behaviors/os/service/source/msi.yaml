defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: msi-serviceinstall-table
    desc: MSI contains service installation table
    crit: notable
    conf: 0.98
    attack: T1543.003
    if:
      # MSI database table names are compressed into OLE stream names.  Match
      # the decoded values-tree entry for !ServiceInstall rather than the
      # plaintext word, which also occurs in generic WiX custom-action code
      # when an installer has no ServiceInstall table at all.
      type: value
      path: office.streams
      exact: /䡀䈜䙵䆬㲨䖱䄷䏯
