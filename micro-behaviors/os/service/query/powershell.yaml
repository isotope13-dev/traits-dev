defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1007

traits:
  - id: service-state-field
    desc: References a service-state field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(sensor|telemetry|payload|device|service).{0,80}["'']?service[_-]?state["'']?\s*[:=]'

  - id: powershell-get-service
    desc: PowerShell queries Windows services
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: Get-Service
