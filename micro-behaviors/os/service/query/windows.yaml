defaults:
  crit: notable
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: sc-query-command
    desc: sc.exe query service command
    conf: 0.95
    for: [csharp, powershell, batch]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+q(c|description)\b'

  - id: query-service-config
    desc: Query service configuration
    conf: 0.8
    if:
      type: symbol
      regex: (^|[./])QueryServiceConfig[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: wmi-service-pathname-query
    desc: Queries a service PathName through WMI
    conf: 0.93
    for: [pe, dll, powershell, batch]
    if:
      type: text
      regex: '(?i)(gwmi|get-wmiobject|get-ciminstance) win32_service'
  - id: query-service-status
    for: [pe, dll, c, cpp]
    desc: Windows service-status query API reference
    conf: 0.82
    if:
      type: symbol
      regex: ^QueryServiceStatus(Ex)?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
composite_rules:
  - id: service-status-query
    desc: Query Windows service runtime status
    conf: 0.85
    all:
      - id: micro-behaviors/os/service/control::open-sc-manager
      - id: micro-behaviors/os/service/control::open-service
      - id: query-service-status
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  # Installers snapshot win32_service.PathName and write that same path back
  # with sc.exe config. That preserves the installed image; it does not
  # replace it.
  - id: sc-config-restores-queried-image
    desc: sc config writes back a queried service image
    crit: notable
    conf: 0.94
    for: [pe, dll, powershell, batch]
    near_bytes: 512
    all:
      - id: wmi-service-pathname-query
      - id: micro-behaviors/os/service/configure::sc-config-binpath
