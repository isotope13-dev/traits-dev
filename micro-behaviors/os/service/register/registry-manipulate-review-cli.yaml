defaults:
  crit: notable
  platforms: [windows]
  for: [binaries, scripts, source]
  attack: T1112
traits:
  - id: reg-exe-safeboot-path
    desc: reg.exe SafeBoot service path
    conf: 0.96
    if:
      type: text
      regex: '(?i)\breg(\.exe)?["'']?\s+add\b.{0,80}\bSafeBoot[\\/]+(Minimal|Network)[\\/]\S+'
composite_rules:
  - id: reg-exe-safeboot-service-registration
    desc: reg.exe SafeBoot service registration
    conf: 0.97
    # A SafeBoot entry whose service value is written through reg.exe is a
    # concrete form of service smuggling into the reduced Safe Mode allow-list.
    all:
      - id: micro-behaviors/os/service/register::reg-exe-safeboot-path
      - id: micro-behaviors/os/registry/value/write::reg-exe-service-value
    near_bytes: 220
