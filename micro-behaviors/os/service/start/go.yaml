defaults:
  for: [go]
  platforms: [macos]
  crit: notable
  conf: 0.97

traits:
  - id: go-launchctl-load-command
    desc: Go prepares launchctl load command
    if:
      type: symbol
      kind: call
      # Direct-argument matching uses the source call target; canonical flow
      # targets are currently available only to provenance queries.
      exact: exec.Command
      args:
        - index: 0
          regex: '^(/bin/|/usr/bin/)?launchctl$'
        - index: 1
          exact: load
