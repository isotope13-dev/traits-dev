defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98

traits:
  - id: dex-context-start-service-call
    desc: Android Context starts a service
    if:
      type: symbol
      kind: call
      exact: 'Landroid/content/Context;->startService'

  - id: dex-context-start-foreground-service-call
    desc: Android Context starts a foreground service
    if:
      type: symbol
      kind: call
      exact: 'Landroid/content/Context;->startForegroundService'
