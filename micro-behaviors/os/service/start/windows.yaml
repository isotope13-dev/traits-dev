defaults:
  attack: T1543.003
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: net-start-service-command
    desc: net.exe starts a Windows service
    crit: notable
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+start\s+[A-Za-z0-9_.-]+\b'

  - id: sc-start-command
    desc: sc.exe start service command
    crit: notable
    conf: 0.95
    # Native loaders often embed the command and invoke it through a shell
    # helper; keep this coverage aligned with the script forms.
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|["''`])sc(\.exe)?\s+start\b'
  - id: start-service
    desc: Start Windows service
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      regex: (^|[./])StartService[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/development/cli/fzf::fzf-binary
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: go-start-service-proc
    desc: Go resolves StartService proc
    crit: notable
    conf: 0.9
    for: [go, pe, dll]
    if:
      type: literal
      exact: StartServiceW
