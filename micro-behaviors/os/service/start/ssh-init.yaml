# The Cursor extension implant falls back to /etc/init.d/ssh start after
# systemctl and service. Retain this neutral operation independently of the
# caller's language and of the backdoor's key, endpoint, or persistence name.
defaults:
  platforms: [unix]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.95

traits:
  - id: ssh-init-start-command
    desc: Starts SSH through an init script
    if:
      type: text
      # Also recognize argv lists and command strings embedded in source.
      # ESXi's service script is uppercase SSH.
      regex: '(?i)/etc/init\.d/ssh(d)?[\\\s"'',]+start\b'
