defaults:
  platforms: [unix]
  for: [go, kotlin, php, ruby, rust, javascript, python]

traits:
  - id: source-launchagent-load-via-node
    desc: Node calls launchctl with load argument
    crit: notable
    conf: 0.97
    platforms: [macos]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)(execFileSync|spawnSync|execFile)\s*\(\s*["'']launchctl["''][\s\S]{0,160}["'']load["'']'
