# `service tor start` / `systemctl start tor`: a script launching the Tor
# daemon. Seen beside a matching stop it is a restart cycle for a fresh circuit.
defaults:
  platforms: [unix]
  for: [shell, python, javascript]

traits:
  - id: tor-service-start-command
    desc: Tor service start command
    crit: notable
    conf: 0.8
    attack: T1090.003
    if:
      type: text
      regex: (?i)\b(service tor start|systemctl (re)?start tor)\b
