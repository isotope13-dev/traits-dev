defaults:
  crit: notable
  for:
    - shell
    - elf
  platforms:
    - linux
traits:
  - id: launchctl-load-command-text
    desc: References launchctl load service command
    conf: 0.92
    for: [scripts, source, perl, -go]
    platforms: [macos]
    if:
      type: text
      regex: '\blaunchctl\b[\s\S]{0,80}\bload\b'
    unless:
      - id: micro-behaviors/os/service/name::apple-smb-preferences-domain
      - id: well-known/tool/detection/skill-scanner::source-context
  - id: jvm-launchctl-string
    desc: JVM string names launchctl
    conf: 0.9
    for: [class, java_class]
    platforms: [macos]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)launchctl'
  - id: launchctl-load-plist
    desc: launchctl loads a plist service
    conf: 0.94
    for: [shell]
    platforms: [macos]
    mbc: B0028
    attack: T1543.004
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?launchctl\s+load\s+[^;\n]{0,160}\.plist'
  - id: launchctl-bootstrap-command
    desc: Bootstraps a launchd plist with launchctl
    conf: 0.95
    for: [shell, go, c, cpp, objc, macho, python, rust]
    platforms: [macos]
    mbc: B0028
    attack: T1543.004
    if:
      type: text
      regex: '\blaunchctl\s+bootstrap\s+(gui|user|system)/[0-9]+\s+\S+\.plist\b'
  - id: service-start
    desc: Service utility starts a daemon
    conf: 0.7
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?service\s+[a-zA-Z0-9_\-]+\s+start\b'
  - id: service-restart
    desc: Service utility restarts a daemon
    conf: 0.7
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?service\s+[a-zA-Z0-9_\-]+\s+restart\b'
  - id: sshd-restart-command
    desc: Restarts the OpenSSH daemon
    conf: 0.9
    platforms: [unix]
    for: [scripts, binaries]
    if:
      type: text
      regex: '\b(systemctl\s+restart\s+sshd|service\s+sshd\s+restart)\b'
    unless:
      - id: micro-behaviors/os/service/config::bsd-rc-subr-dispatcher
      - id: well-known/tool/sysadmin/automatedlab/
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
  - id: sshd-init-restart-command
    desc: Restarts OpenSSH through an init script
    conf: 0.92
    platforms: [unix]
    for: [scripts, binaries]
    if:
      type: text
      # ESXi spells this service path /etc/init.d/SSH.
      regex: '(?i)/etc/init\.d/ssh(d)?\s+restart\b'
  - id: android-start-service-command
    desc: Shell starts an Android service with am
    conf: 0.94
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*am[ \t]+start(-foreground)?-service\b'
  - id: launchctl-bootstrap-gui
    desc: launchctl bootstrap gui service
    conf: 0.86
    mbc: B0028
    attack: T1543.004
    platforms: [macos]
    for: [macho, c, shell]
    if:
      type: text
      substr: launchctl bootstrap gui/
  - id: launchctl-bootstrap-subcommand
    desc: launchctl bootstraps a service
    conf: 0.9
    platforms: [macos]
    for: [scripts]
    if:
      type: text
      regex: '\blaunchctl\s+bootstrap\b'
  - id: launchctl-kickstart-command
    desc: launchctl kickstarts a service
    conf: 0.9
    platforms: [macos]
    for: [shell, applescript, python, javascript, c, cpp, objc, macho, rust]
    mbc: B0028
    attack: T1543.004
    if:
      type: text
      regex: '\blaunchctl\s+kickstart(\s+-k)?\b'
  - id: launchctl-load-variable
    desc: launchctl loads variable plist
    conf: 0.93
    mbc: B0028
    attack: T1543.004
    platforms: [macos]
    for: [shell]
    if:
      type: text
      regex: 'launchctl load "\$[A-Z_]{3,40}"'
composite_rules:
  - id: launchctl-load-command
    desc: launchctl load service command
    conf: 0.92
    for: [scripts, source, perl]
    platforms: [macos]
    any:
      - id: launchctl-load-command-text
      - id: go-launchctl-load-command
  - id: sshd-restart
    desc: OpenSSH daemon restart
    conf: 0.94
    platforms: [unix]
    for: [scripts, binaries]
    any:
      - id: sshd-restart-command
      - id: sshd-init-restart-command
  - id: shell-launchctl-load
    desc: Shell loads a launchd service with launchctl
    conf: 0.94
    for: [shell]
    platforms: [macos]
    mbc: B0028
    attack: T1543.004
    any:
      - id: launchctl-load-plist
      - id: launchctl-load-variable
