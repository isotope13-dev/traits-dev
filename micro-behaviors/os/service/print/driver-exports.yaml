# The exports a DLL must provide to be loaded by the Windows print subsystem.
#
# DrvEnableDriver is the printer-driver entry point spoolsv/GDI calls to hand
# the driver its function table. SpoolerCopyFileEvent and GenerateCopyFilePaths
# are the Point-and-Print hooks: the spooler calls them, as SYSTEM, while
# copying driver files to a client. All three are documented DDI members that a
# genuine printer driver implements, so they are neutral capabilities.
#
# DrvBitBlt and DrvTextOut are the rendering half of that same DDI. A real
# printer driver exports them; a DLL that claims the spooler hooks without any
# rendering entry point is not a printer driver, which is what the objective in
# objectives/privilege-escalation/exploit/print-spooler/ keys on.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: printer-driver-enable-export
    desc: Printer driver DDI entry point export
    if:
      type: symbol
      kind: export
      exact: DrvEnableDriver

  - id: spooler-copy-file-event-export
    desc: Point-and-Print spooler file-copy hook
    attack: T1547.012
    if:
      type: symbol
      kind: export
      exact: SpoolerCopyFileEvent

  - id: spooler-generate-copy-file-paths-export
    desc: Point-and-Print copy path generation hook
    attack: T1547.012
    if:
      type: symbol
      kind: export
      exact: GenerateCopyFilePaths

  - id: printer-driver-render-export
    desc: Printer driver rendering DDI export
    if:
      type: symbol
      kind: export
      regex: '^Drv(BitBlt|TextOut|StretchBlt)$'
