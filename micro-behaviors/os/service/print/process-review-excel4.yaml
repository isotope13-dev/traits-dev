defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
- id: vba-excel4-print-command
  desc: Excel 4 macro PRINT command
  conf: 0.95
  if:
    type: raw
    regex: 'PRINT\([0-9,]{8,}'
    case_insensitive: true
composite_rules:
- id: vba-excel4-print-workflow
  desc: VBA uses Excel 4 evaluator for printing
  conf: 0.98
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::vba-execute-excel4macro
  - id: micro-behaviors/os/service/print::vba-excel4-print-command
