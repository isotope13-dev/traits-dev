traits:
  - id: write-printer-api-reference
    desc: References raw printer write API
    platforms: [windows]
    for: [powershell, c, cpp, pe]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(WritePrinter|SendBytesToPrinter)'
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
      - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
