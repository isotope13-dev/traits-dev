defaults:
  platforms: [windows]
  for: [source, scripts]
traits:
  - id: spoolss-router-library-name
    desc: Names the Windows print router library
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: '^(L"|u8"|u")?spoolss\.dll"?$'
      case_insensitive: true
  - id: addform-export-name
    desc: References Windows print spooler AddForm API
    crit: notable
    conf: 0.96
    if:
      type: literal
      regex: '^(L"|u8"|u")?AddForm[AW]?"?$'
  - id: enumforms-export-name
    desc: References Windows print spooler EnumForms API
    crit: notable
    conf: 0.96
    if:
      type: literal
      regex: '^(L"|u8"|u")?EnumForms[AW]?"?$'
  - id: deleteform-export-name
    desc: References Windows print spooler DeleteForm API
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '^(L"|u8"|u")?DeleteForm[AW]?"?$'
  - id: spoolsv-executable-reference
    desc: Names the Windows Print Spooler executable
    crit: notable
    conf: 0.92
    if:
      type: literal
      regex: '^(L"|u8"|u")?spoolsv\.exe"?$'
      case_insensitive: true
