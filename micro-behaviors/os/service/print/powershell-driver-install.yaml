defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
traits:
  - id: driver-config-file-variable
    desc: Printer config file assigned DLL variable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.pConfigFile\s*=\s*\$DLL\b'
  - id: driver-copy-all-flags-call
    desc: Printer driver copy-all and overwrite flags
    conf: 0.95
    if:
      type: text
      regex: 'AddPrinterDriverEx\([^\r\n]{0,80}APD_COPY_ALL_FILES -bor 0x10 -bor 0x8000'
  - id: system32-dll-printer-port
    desc: Printer port targets a System32 DLL
    conf: 0.98
    if:
      type: text
      regex: '(?i)Add-PrinterPort\s+-Name\s+"C:\\Windows\\system32\\[^"\r\n]{1,40}\.dll"'
