# A status line naming a vendor installer URL. Real installers print these;
# ClickFix one-liners print one as a decoy before running a different stage.
defaults:
  platforms: [unix]
  for: [shell, text]
  crit: notable
  conf: 0.85
traits:
  - id: echo-installer-domain-url
    desc: Echo announces a domain installer URL
    if:
      type: text
      regex: '\b(echo|printf)\s+["''][^"''\n]{0,80}https?://[a-z][\w.-]*\.[a-z]{2,}/\S*install'
      case_insensitive: true
