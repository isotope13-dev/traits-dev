defaults:
  platforms: [unix]
  for: [java, kotlin, class, jar]
  crit: notable
  conf: 0.9

traits:
  - id: jvm-login-banner-path-reference
    desc: JVM references Unix login banner paths
    if:
      type: text
      regex: '/etc/issue[\s\S]{0,120}/etc/motd'

  - id: jvm-login-banner-path-bytecode
    # JVM constant-pool probe: a raw hex hit for this ASCII literal only means
    # "bytecode references it" inside a class/jar. Bounded so it cannot claim a
    # hundreds-of-megabyte container (a FreeBSD install ISO reached this rule and
    # matched the literal in ordinary files it carries); no real class or jar is
    # this large.
    size_max: 67108864
    desc: JVM bytecode references the issue banner path
    for: [class, jar]
    if:
      type: hex
      pattern: 2F 65 74 63 2F 69 73 73 75 65
