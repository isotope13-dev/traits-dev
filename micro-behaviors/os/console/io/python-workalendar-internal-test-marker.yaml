defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-prints-workalendar-internal-test-marker
    desc: Prints workalendar internal build-test marker
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: print
      arg:
        index: 0
        kind: string
        exact: "test-workalendar-internal: source build hook ran"
