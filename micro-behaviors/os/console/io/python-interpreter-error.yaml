defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-missing-file-error-print
  desc: Prints Python interpreter missing-file error
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: print
    arg:
      index: 0
      from:
        value: 'python: can''t open file'
- id: python-prints-test-build-marker
  desc: Python prints test build marker
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'print\s*\(\s*["\x27].{0,80}\btest\b.{0,80}\b(build|hook|install)\b'
