defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-missing-file-error-print
  desc: Prints Python interpreter missing-file error
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: print
    arg:
      index: 0
      from:
        value: 'python: can''t open file'
