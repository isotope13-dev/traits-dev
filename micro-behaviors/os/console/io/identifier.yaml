defaults:
  platforms: [windows, unix]
  crit: notable
  for: [javascript, typescript, html]
traits:
  - id: js-console-log-identifier
    desc: Logs a single identifier with console.log
    # The identifier may hold a primitive or an object; this does not
    # establish object inspection or debugger detection.
    crit: notable
    conf: 0.8
    # `console.log(element)` -- one identifier, no template, no property
    # access. The referenced value type is not established by this matcher.
    if:
      type: text
      regex: '\bconsole\.log\s*\(\s*[A-Za-z_$][\w$]{0,30}\s*\)'
