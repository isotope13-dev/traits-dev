# Graph addPassword returns the new secret in secretText. Printing that field
# is the operator collecting the credential, not a mention of the property.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, powershell, php, ruby, csharp]
  crit: notable
  conf: 0.94

traits:
  - id: prints-graph-password-secret-text
    desc: Prints a Graph password secretText value
    if:
      type: text
      regex: '(?i)\b(print|console\.log|write-output|echo)\b[^\n]{0,120}secretText'
  - id: prints-http-response-body
    desc: Prints a just-read HTTP response body
    if:
      type: text
      regex: '(?i)(console\.writeline|print|write-output)[^\n]{0,160}readasstringasync'
  - id: prints-python-http-response-read
    desc: Prints a Python HTTP response read buffer
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bprint\b[^\n]{0,48}(urlopen\([^)\n]{0,44}\)|resp?(onse)?)\.read\(\)\.decode'
  - id: prints-script-response-text-body
    desc: Prints a response text or body property
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\b(print|puts|console\.log)\b[^\n]{0,48}resp(onse)?\.(text|body)\b'

composite_rules:
  - id: prints-script-http-response-body
    desc: Prints a script HTTP response body
    any:
      - id: prints-python-http-response-read
      - id: prints-script-response-text-body
