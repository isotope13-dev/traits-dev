defaults:
  crit: notable
  conf: 0.95
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # The receiver may be console, a logger, or a saved-method object. This
  # call shape alone establishes neither console preservation nor hooking.
  - id: js-log-method-argument-forwarding
    desc: Log-like method invoked with forwarded arguments
    if:
      type: text
      regex: '\w+\.(log|error|warn|info)\s*(\(\s*\.\.\.|\.\s*apply\(\s*(null|console)\s*,)'
