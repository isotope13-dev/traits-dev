defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: component
traits:
- id: js-console-object
  desc: References the JavaScript console object
  if:
    type: text
    regex: '\bconsole\.'

- id: js-console-log-call
  desc: Writes output through JavaScript console.log
  crit: baseline
  conf: 1.0
  if:
    type: symbol
    kind: call
    exact: console.log

- id: js-console-log-zalgo-call
  desc: Writes Zalgo-styled JavaScript console output
  crit: notable
  conf: 0.99
  for: [javascript]
  if:
    type: tree-sitter
    kind: call
    regex: '^console\.log\s*\([^)]{0,200}\.zalgo\b'

- id: js-console-output-silenced-log-err
  desc: Silences JS console output methods (log/error)
  crit: notable
  if:
    type: text
    regex: '(?i)console\.(log|error)\s*=\s*(function\s*\(\s*\)\s*\{\s*\}|\(\s*\)\s*=>\s*\{\s*\})'

- id: js-console-output-silenced-info-dbg
  desc: "Silences JS console output methods"
  crit: notable
  if:
    type: text
    regex: '(?i)console\.(info|debug)\s*=\s*(function\s*\(\s*\)\s*\{\s*\}|\(\s*\)\s*=>\s*\{\s*\})'

- id: js-console-output-silenced-warn
  desc: Silences JS console output methods (warn)
  crit: notable
  if:
    type: text
    regex: '(?i)console\.warn\s*=\s*(function\s*\(\s*\)\s*\{\s*\}|\(\s*\)\s*=>\s*\{\s*\})'

- id: console-log-json-stringify-call
  desc: Console logs JSON stringified payload
  crit: notable
  conf: 0.86
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: "console\\.log\\s*\\([^\\n]{0,120}JSON\\.stringify\\s*\\("

# Neutral console capability: logging a variable or property named `text` (usually an
# HTTP response body) carries no LLM meaning on its own. LLM intent comes
# from the label atoms in os/telemetry/logging/llm composites that
# reference this leg cross-directory.
- id: console-log-text-value
  desc: Console logs variable/property named text
  crit: notable
  conf: 0.82
  if:
    type: tree-sitter
    kind: call
    regex: '^console\.log\s*\([^)]{0,120}\btext\s*[,)]'

- id: js-console-log-private-key-direct
  desc: Console logs a private-key value
  crit: suspicious
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: tree-sitter
    kind: call
    regex: '(?i)^console\.log\s*\(\s*(["''][^"''()]{0,60}["''],\s*)?(\w{1,40}\.){0,4}private_?key\s*[,)]'
- id: js-console-log-private-key-prefix
  desc: Console logs a partial private-key value
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: tree-sitter
    kind: call
    regex: '(?i)^console\.log\s*\(\s*`[^`]{0,60}\$\{[\w.$]{0,40}private_?key'
- id: js-console-log-private-key-string
  desc: Console logs a stringified private key
  crit: suspicious
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: tree-sitter
    kind: call
    regex: '(?i)^console\.log\s*\(\s*(this\.)?private_?key\.toString\s*\(\s*\)'
composite_rules:
- id: js-console-log-near-private-key
  desc: Console logs a private-key value
  crit: suspicious
  conf: 0.98
  for: [javascript, typescript]
  any:
  - id: js-console-log-private-key-direct
  - id: js-console-log-private-key-string
- id: js-console-output-silenced
  desc: Silences JavaScript console output methods
  crit: notable
  conf: 0.94
  any:
  - id: js-console-output-silenced-log-err
  - id: js-console-output-silenced-info-dbg
  - id: js-console-output-silenced-warn
  unless:
  - id: well-known/lib/web/server/tiktok-scraper::tiktok-acrawler-signer
  - id: metadata/path/software::firefox-directory-path
  - id: well-known/app/browser/mozilla-firefox::firefox-known-source-module-context
