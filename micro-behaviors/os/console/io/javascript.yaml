defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: component
traits:
- id: js-console-object
  desc: References the JavaScript console object
  if:
    type: text
    substr: console

- id: js-console-log-call
  desc: Writes output through JavaScript console.log
  crit: baseline
  conf: 1.0
  if:
    type: symbol
    kind: call
    exact: console.log

- id: js-console-log-zalgo-call
  desc: Writes Zalgo-styled JavaScript console output
  crit: notable
  conf: 0.99
  for: [javascript]
  if:
    type: tree-sitter
    kind: call
    regex: '^console\.log\s*\([^)]{0,200}\.zalgo\b'

- id: js-console-output-silenced-log-err
  desc: Silences JS console output methods (log/error)
  crit: notable
  if:
    type: text
    regex: '(?i)console\.(log|error)\s*=\s*(function\s*\(\s*\)\s*\{\s*\}|\(\s*\)\s*=>\s*\{\s*\})'

- id: js-console-output-silenced-info-dbg
  desc: "Silences JS console output methods"
  crit: notable
  if:
    type: text
    regex: '(?i)console\.(info|debug)\s*=\s*(function\s*\(\s*\)\s*\{\s*\}|\(\s*\)\s*=>\s*\{\s*\})'

- id: js-console-output-silenced-warn
  desc: Silences JS console output methods (warn)
  crit: notable
  if:
    type: text
    regex: '(?i)console\.warn\s*=\s*(function\s*\(\s*\)\s*\{\s*\}|\(\s*\)\s*=>\s*\{\s*\})'

- id: console-log-json-stringify-call
  desc: Console logs JSON stringified payload
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: "console\\.log\\s*\\([^\\n]{0,120}JSON\\.stringify\\s*\\("

# Neutral console capability: logging a variable named `text` (usually an
# HTTP response body) carries no LLM meaning on its own. LLM intent comes
# from the label atoms in os/telemetry/logging/llm composites that
# reference this leg cross-directory.
- id: console-log-response-text-call
  desc: Console logs response text variable
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: "console\\.log\\s*\\([^\\n]{0,120}\\btext\\b"
composite_rules:
- id: js-console-output-silenced
  desc: Silences JavaScript console output methods
  crit: notable
  conf: 0.94
  any:
  - id: js-console-output-silenced-log-err
  - id: js-console-output-silenced-info-dbg
  - id: js-console-output-silenced-warn
  unless:
  - id: well-known/lib/web/tiktok-scraper::tiktok-acrawler-signer
  - id: well-known/app/browser/mozilla-firefox::firefox-runtime-tree-path
  - id: well-known/app/browser/mozilla-firefox::firefox-known-source-module-context
  - id: metadata/package/testing/presence/harness::test-directory-path
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
