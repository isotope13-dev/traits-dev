defaults:
  platforms: [unix, windows]
  for: [go]
  crit: baseline

traits:
  - id: go-stdout-write-call
    desc: Go calls fmt.Print to write output
    conf: 0.94
    if:
      type: text
      regex: 'fmt[.]Print\w*[[:space:]]*[(]'
  - id: go-copy-to-stdout-call
    desc: Go copies data to os.Stdout
    conf: 0.94
    if:
      type: tree-sitter
      language: go
      query: |
        (call_expression
          function: (selector_expression
            operand: (identifier) @package
          field: (field_identifier) @function)
          arguments: (argument_list
            . (selector_expression
              operand: (identifier) @writer_package
              field: (field_identifier) @writer_name))
          (#eq? @package "io")
          (#eq? @function "Copy")
          (#eq? @writer_package "os")
          (#eq? @writer_name "Stdout"))
