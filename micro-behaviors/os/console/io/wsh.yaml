# Windows Script Host console output.  Echoing text is a neutral capability;
# process launch, download, and dynamic evaluation are separate behaviors.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: wscript-echo-call
    desc: Writes text through WScript.Echo
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bWScript\.Echo\b'
