# Interactive confirmation prompts
# Language-agnostic markers of a program that asks the operator before doing
# something: the yes/no prompt text and the affirmative-answer gate. Either
# alone is weak (log text, flag parsing); together they describe an
# interactive consent step, which is what withholds a hostile verdict from a
# user-confirmed privileged install.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: confirm-yes-no-prompt
    desc: Interactive yes/no confirmation prompt text
    conf: 0.85
    if:
      type: text
      regex: '\[y/n\]|\(y/n\)|yes/no'
      case_insensitive: true
