# DOS operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - dos_com
  - data
  size_max: 65536
traits:
- id: dos-display-string
  desc: DOS display-string call (INT 21h AH=09h)
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B4 09 [0-32] CD 21
  unless:
  - type: hex
    pattern: 4D 53 57 49 4D 00 00 00
    offset: 0
