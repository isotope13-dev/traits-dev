defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: batch-echo-off
    desc: Batch ECHO OFF command text
    crit: baseline
    conf: 0.8
    for: [batch, html]
    if:
      type: text
      exact: '@echo off'
      case_insensitive: true
    unless:
      - type: basename
        regex: '^run\.bat(\.xz)?$'
      - type: path
        substr: testdata/benign/
  - id: redirect-dev-null
    desc: Redirect to /dev/null
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: '>/dev/null'
  - id: stderr-to-dev-null
    desc: Stderr redirected to /dev/null
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: '2>/dev/null'
  - id: command-targets-dev-stdout
    desc: Command writes data to /dev/stdout
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: 'of=/dev/stdout'
  - id: encoded-dev-null-redirect
    desc: Encoded /dev/null output redirection
    crit: notable
    conf: 0.85
    for: [elf, shell, python, javascript]
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, xor]
      substr: '/dev/null'
  - id: dense-stderr-suppression
    desc: Dense stderr suppression pattern
    crit: notable
    conf: 0.85
    for: [shell]
    per_kb_min: 5.0
    if:
      type: text
      substr: '2>/dev/null'
    unless:
      - type: text
        regex: '(?s)^#![^\n]*\n(\s*(addgroup|adduser)\b[^\n]*\s2>/dev/null\s*\n)+(\s*exit\s+0\s*)?$'
  - id: stderr-redirect
    desc: Stderr redirect 2>&1
    crit: baseline
    conf: 0.5
    if:
      type: text
      exact: 2>&1
  - id: null-redirect-stdout-stderr
    desc: Combined stdout+stderr redirect to /dev/null
    crit: baseline
    conf: 0.8
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - type: basename
        regex: '\.(css|html?|js|json)$'
      - type: basename
        regex: '\.(md|php|txt|xml)$'
      - type: basename
        regex: '\.(pyi?|pyc)$'
      - type: basename
        regex: '(^|[\\/])(configure|config\.(guess|sub))$'
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: '>/dev/null\s+2>&1|2>&1\s+>/dev/null'
  - id: windows-output-to-nul-text
    desc: Windows NUL output-redirection text
    crit: baseline
    conf: 0.55
    for: [batch, powershell, pe, vbs]
    if:
      type: text
      regex: '(?i)>\s*nul\b'
  - id: windows-stderr-to-nul
    desc: Stderr redirected to NUL
    crit: baseline
    conf: 0.55
    for: [batch, powershell, pe, vbs]
    if:
      type: text
      regex: '(?i)2>\s*nul\b'
  - id: pipe-shell
    desc: Pipe to shell
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: '| shell'
  - id: pipe-sh
    desc: Pipe to sh
    crit: baseline
    conf: 0.6
    if:
      type: text
      exact: '| sh'
  - id: pipe-bin-sh
    desc: Pipe to /bin/sh
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: '| /bin/sh'
  - id: pkginfo-dev-null-redirect
    desc: Package metadata redirects output to /dev/null
    for: [pkginfo]
    crit: notable
    conf: 0.93
    # An install/preinstall script whose output is discarded. The bare
    # `dev/null` substring also matched README prose in METADATA files.
    if:
      type: text
      regex: '>\s*/dev/null'
composite_rules:
  - id: output-suppression
    desc: Suppresses command output or errors
    any:
      - id: redirect-dev-null
      - id: stderr-redirect
      - id: windows-output-to-nul-text
      - id: windows-stderr-to-nul
  - id: shell-pipes
    desc: Pipe to shell interpreters
    any:
      - id: pipe-shell
      - id: pipe-sh
      - id: pipe-bin-sh
