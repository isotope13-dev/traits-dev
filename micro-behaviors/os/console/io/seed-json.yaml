defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, typescript, go, rust]
  conf: 0.97
traits:
  - id: serialized-seed-console-emission
    desc: Logs a serialized seed field
    crit: notable
    if:
      type: text
      regex: 'console\.log\([^\r\n;]{0,100}JSON\.stringify\(\{\s*seed\s*:'
