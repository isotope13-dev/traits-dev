defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: batch-command-stdout-nul
    desc: Batch command redirects stdout to NUL
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: batch
      query: |
        (redirect_stmt
          (cmd)
          (redirection (redirect_op) @op (redirect_target) @target)
          (#match? @op "^1?(>|>>)$")
          (#match? @target "(?i)^nul$"))
