defaults:
  platforms: [unix, windows]
  for: [javascript, text]
traits:
  # This text pattern excludes line-comment prefixes, but cannot prove that a
  # matched line is executable or that it belongs to an enclosing loop.
  - id: zalgo-console-log-text
    desc: Text resembles Zalgo console logging
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(?im)^[^\n/]{0,24}console\.log[^\n]{0,140}\.zalgo\b'
