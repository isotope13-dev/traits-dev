defaults:
  platforms: [windows, unix]
  crit: notable
  for: [javascript, typescript, html]
traits:
  - id: js-console-log-bare-object
    desc: Logs a bare object reference
    # This is common debugging/UI code alone; only the adjacent getter makes
    # it a DevTools oracle.
    crit: notable
    conf: 0.8
    # `console.log(element)` -- one identifier, no template, no property
    # access. That is the shape that makes devtools walk the object.
    if:
      type: text
      regex: '\bconsole\.log\s*\(\s*[A-Za-z_$][\w$]{0,30}\s*\)'
