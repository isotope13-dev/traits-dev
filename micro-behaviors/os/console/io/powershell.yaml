# PowerShell console operator input.
#
# Read-Host blocks on the operator at the console. An unbounded loop that
# prompts the operator is an interactive installer or helper, not an
# autonomous polling agent: nothing fetched nearby executes on its own, so
# the operator prompt withholds the agent-loop verdict.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [powershell]
traits:
  - id: read-host-call
    desc: Read-Host console operator read
    if:
      type: symbol
      kind: call
      regex: '(?i)^Read-Host$'
  # Relocated from objectives/command-and-control/backdoor/control/desktop,
  # where it was `ps-stdin-readline-loop` ("Console stdin command loop").
  # The matcher is only the .NET console line read. A local tray worker
  # uses the same call for parent-process menu IPC.
  - id: console-in-readline
    desc: .NET Console.In line read
    conf: 0.92
    if:
      type: text
      substr: '[Console]::In.ReadLine()'
composite_rules:
  - id: operator-prompted-fetch-loop
    desc: Operator-prompted loop fetches remote content
    crit: exception
    conf: 0.9
    all:
      - id: read-host-call
      - id: micro-behaviors/data/control-flow/loop::embedded-powershell-while-true
      - id: micro-behaviors/communications/http/client/response-body::powershell-http-response-retrieval
    near_lines: 24
