# Stream subject review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
traits:
- id: shell-echo-variable-pair
  desc: Echoes colon-separated shell variable pair
  if:
    type: tree-sitter
    node: command
    regex: \becho\s+"[^"\n]{0,64}\$\{?\w+\}?:\$\{?\w+
