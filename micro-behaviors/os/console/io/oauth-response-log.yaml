defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: github-link-response-to-log
    desc: Formats GitHub-link response as log text
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          arguments: (arguments (template_string
            (string_fragment) @prefix
            (template_substitution
              (call_expression function: (member_expression
                object: (call_expression function: (member_expression object: (identifier) @json
                  property: (property_identifier) @stringify)
                  arguments: (arguments (member_expression property: (property_identifier) @data)))
                property: (property_identifier) @slice))))))
          (#match? @prefix "^github-link response:")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @data "data")
          (#eq? @slice "slice"))
