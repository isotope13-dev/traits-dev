# IOS command-dispatch calls and pipeline syntax are execution mechanics.
# Concealment intent requires both a show-command rewrite and the specific
# configuration fields hidden by it, which is assembled under objectives/.
defaults:
  crit: notable
  platforms: [appliance]
  for: [c, cpp]

composite_rules:
  - id: dispatcher-exclude-clues
    desc: Command dispatcher and exclude text co-occur
    conf: 0.97
    all:
      - id: micro-behaviors/os/console/command::shell-send-command-call
      - id: metadata/lang/source/literal/string/label::pipe-exclude-string

  - id: dispatcher-show-exclude-clues
    desc: Dispatcher and filtered show command clues
    conf: 0.98
    all:
      - id: micro-behaviors/os/console/command::dispatcher-exclude-clues
      - id: metadata/lang/source/literal/string/command::show-command-prefix
