defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: history-cmd
  desc: Shell history builtin invocation
    # Use the shell symbol table (cleave extracts command invocations as
    # symbols) — avoids collisions with `"history"` dict keys, attribute
    # access (`resp.history`), type annotations (`history: List[…]`), etc.
  crit: notable
  conf: 0.78
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
  - id: well-known/app/enterprise/egroupware/
  - id: metadata/path::test-directory-component
  if:
    type: symbol
    kind: call
    exact: history
