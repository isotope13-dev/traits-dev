defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: js-console-method-preservation
  desc: Preserves original JavaScript console methods
  conf: 0.95
  if:
    type: text
    regex: 'console\.(log|error|warn)\.bind\(console\)'
- id: js-console-method-save
  desc: Saves JavaScript console method to a variable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\w*(orig|saved|prev|old)\w*\s*=\s*console\.(log|warn|error)'
- id: js-console-method-restoration
  desc: Restores saved JavaScript console methods
  conf: 0.95
  if:
    type: text
    regex: '(?i)console\.(log|warn|error)\s*=\s*\w*(orig|saved|prev|old)\w*'
- id: console-log-reassign
  desc: Reassigns console.log method
  conf: 0.9
  if:
    type: text
    regex: 'console\.log\s*=\s*(function|\(\)|=>)'
- id: console-warn-reassign
  desc: Reassigns console.warn method
  conf: 0.9
  if:
    type: text
    regex: 'console\.warn\s*=\s*(function|\(\)|=>)'
- id: console-error-reassign
  desc: Reassigns console.error method
  conf: 0.9
  if:
    type: text
    regex: 'console\.error\s*=\s*(function|\(\)|=>)'
- id: console-method-wrapper
  desc: Wraps a console method with a callback
  conf: 0.9
  if:
    type: text
    regex: 'console\.(log|warn|error)\s*=\s*\([^)]{1,80}\)\s*=>'
- id: console-log-noop
  desc: Assigns an empty function to console.log
  conf: 0.9
  if:
    type: text
    regex: '(?m)(^[ \t]*|[;{]\s*)console\.log\s*=\s*\(\)\s*=>\s*\{\s*\}'
- id: console-warn-noop
  desc: Assigns an empty function to console.warn
  conf: 0.9
  if:
    type: text
    regex: '(?m)(^[ \t]*|[;{]\s*)console\.warn\s*=\s*\(\)\s*=>\s*\{\s*\}'
- id: console-error-noop
  desc: Assigns an empty function to console.error
  conf: 0.9
  if:
    type: text
    regex: '(?m)(^[ \t]*|[;{]\s*)console\.error\s*=\s*\(\)\s*=>\s*\{\s*\}'
# Obfuscator output and bracket-notation obfuscation reach the same methods
# through a computed property, so the dot-notation rules above never see it.
- id: console-bracket-method-reassign
  desc: Reassigns a console method via bracket notation
  conf: 0.9
  if:
    type: text
    regex: 'console\s*\[[''"](log|warn|error|info|debug)[''"]\]\s*=\s*(function|\(\s*\)\s*=>)'
- id: console-object-replace
  desc: Replaces the global console object
  conf: 0.9
  if:
    type: text
    regex: 'window\.console\s*=\s*\{[\s\S]{0,120}log\s*:'
- id: console-prototype-modify
  desc: Modifies console prototype methods
  conf: 0.9
  if:
    type: text
    regex: 'Console\.prototype\.(log|warn|error)\s*='
# Obfuscated bundles reach console through a decoder call rather than a quoted
# method name, so `console-bracket-method-reassign` above -- which requires a
# literal `log`/`warn`/`error` inside the brackets -- never sees them. Match the
# shape instead: a computed console property assigned an empty function.
#
# Multiple silenced methods can suppress diagnostics or obstruct an interactive
# inspection, but the pattern also appears when a utility keeps non-result logs
# out of a machine-readable output stream. This signal alone does not establish
# evasion. Example: javascript-obfuscator's self-defending preset nulls
# log/warn/error/info in one statement group as part of its debug-protection
# path.
- id: console-computed-method-noop-cluster
  desc: Silences several computed console methods
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: 'console\s*\[[^\]\n]{1,80}\]\s*=\s*function\s*\(\s*\)\s*\{\s*\}'

composite_rules:
- id: console-binary-output-stream-context
  desc: Writes a buffer to Node.js stdout
  crit: exception
  conf: 0.95
  all:
  - id: metadata/lang/source/syntax/member::node-stdout-reference
  - id: micro-behaviors/data/buffer/transfer::stream-write-buffer-arg
  near_bytes: 200

- id: js-console-forwarder-context
  desc: Console forwarding wrapper context
  crit: exception
  conf: 0.98
  all:
  - id: micro-behaviors/os/console/control::js-console-method-preservation
  - id: micro-behaviors/os/console/io::js-log-method-argument-forwarding
  near_bytes: 2000

- id: js-console-restoration-context
  desc: Console preservation and restoration context
  crit: exception
  conf: 0.98
  all:
  - id: micro-behaviors/os/console/control::js-console-method-save
  - id: micro-behaviors/os/console/control::js-console-method-restoration

- id: console-log-warn-error-noop-cluster
  desc: Sets console.log, console.warn, and console.error to empty callbacks
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/console/control::console-log-noop
  - id: micro-behaviors/os/console/control::console-warn-noop
  - id: micro-behaviors/os/console/control::console-error-noop
