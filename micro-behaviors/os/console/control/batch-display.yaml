defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.97

traits:
  - id: batch-console-title-command
    desc: Batch sets a console title
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^title[ \t]+[^ \t]'

  - id: batch-console-color-command
    desc: Batch sets console text colors
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^color[ \t]+[0-9a-f]{2}[ \t]*$'

  - id: batch-console-clear-command
    desc: Batch clears the console screen
    if:
      type: symbol
      kind: call
      exact: cls
