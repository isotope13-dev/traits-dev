defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-xtrace-enable
    desc: Shell enables command tracing
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*set[ \t]+(-[a-zA-Z]*x[a-zA-Z]*|-o[ \t]+xtrace)([ \t;]|$)'

  - id: shell-xtrace-disable
    desc: Shell disables command tracing
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*set[ \t]+(\+[a-zA-Z]*x[a-zA-Z]*|\+o[ \t]+xtrace)([ \t;]|$)'
