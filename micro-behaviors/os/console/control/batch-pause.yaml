defaults:
  for: [batch]
  platforms: [windows]
  crit: notable
traits:
  - id: batch-pause-stdout-nul
    desc: Batch PAUSE redirects output to NUL
    conf: 0.97
    if:
      type: tree-sitter
      language: batch
      query: |
        (redirect_stmt
          (cmd (command_name) @tool)
          (redirection (redirect_op) @op (redirect_target) @target)
          (#match? @tool "(?i)^pause$")
          (#match? @op "^1?>$")
          (#match? @target "(?i)^nul$"))
        (redirect_stmt
          (redirection (redirect_op) @op (redirect_target) @target)
          (cmd (command_name) @tool)
          (#match? @tool "(?i)^pause$")
          (#match? @op "^1?>$")
          (#match? @target "(?i)^nul$"))
