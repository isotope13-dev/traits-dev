defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
traits:
  - id: get-console-mode
    desc: Get console input/output mode
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetConsoleMode"
  - id: get-console-output-cp
    desc: Get console output code page
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetConsoleOutputCP"
