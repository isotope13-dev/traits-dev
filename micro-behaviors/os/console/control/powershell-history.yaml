defaults:
  platforms: [windows]
  for: [scripts, binaries]

traits:
  - id: powershell-psreadline-save-nothing
    desc: References PSReadLine SaveNothing history mode
    crit: notable
    conf: 0.8
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)HistorySaveStyle\s+SaveNothing'

  - id: powershell-psreadline-clear-history
    desc: Calls PSConsoleReadLine ClearHistory
    crit: notable
    conf: 0.96
    for: [powershell]
    if:
      type: text
      regex: '(?i)\[Microsoft\.PowerShell\.PSConsoleReadLine\]::ClearHistory\(\)'
