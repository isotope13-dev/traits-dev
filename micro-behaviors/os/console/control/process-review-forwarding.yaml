defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: js-console-forwarder-context
    desc: Console forwarding wrapper context
    crit: exception
    conf: 0.98
    all:
      - id: micro-behaviors/os/console/control::js-console-method-preservation
      - id: micro-behaviors/os/console/io::js-log-method-argument-forwarding
    near_bytes: 2000

  - id: js-console-restoration-context
    desc: Console preservation and restoration context
    crit: exception
    conf: 0.98
    all:
      - id: micro-behaviors/os/console/control::js-console-method-save
      - id: micro-behaviors/os/console/control::js-console-method-restoration
