defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: fill-console-output-attribute
    desc: Fill console output attributes
    crit: baseline
    conf: 0.9
    if:
      type: import
      exact: FillConsoleOutputAttribute
  # Setting a numeric code page (`chcp 65001`) is common UTF-8 bootstrap.
  - id: chcp-set-command
    desc: chcp numeric argument reference
    crit: baseline
    conf: 0.85
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])chcp(\.exe)?[ \t]+[0-9]{2,5}\b'
  # A chcp token can occur in commands, quoted data or documentation.
  - id: chcp-command-token-reference
    desc: chcp command token reference
    crit: notable
    conf: 0.86
    for:
    - scripts
    - binaries
    if:
      type: text
      regex: (?i)(^|[^A-Za-z0-9_@])chcp(\.exe)?([^A-Za-z0-9_@]|$)
  - id: chcp-65001-command
    desc: chcp 65001 text reference
    crit: baseline
    conf: 0.85
    for: [batch, powershell, vbs, python]
    if:
      type: text
      regex: '(?i)chcp(\.exe)?[ \t]+65001\b|chcp[''\"]?\s*,\s*[''\"]65001'
  - id: set-console-ctrl-handler
    desc: Register console control handler
    crit: baseline
    conf: 0.86
    if:
      type: symbol
      exact: SetConsoleCtrlHandler
    unless:
      - id: metadata/file/extension/identity::uac-exe-basename
      - id: metadata/binary/framework/
    downgrade:
      # Go's runtime registers a console ctrl handler to translate Ctrl-C into
      # SIGINT for os/signal; every Go Windows binary imports it.
      any:
        - id: metadata/lang/compiled/
  - id: batch-ctty-null-device
    desc: Routes batch console to NUL device
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      substr: ctty nul
      case_insensitive: true

  - id: pause-string
    desc: Standalone pause string (console pause command)
    crit: component
    conf: 0.72
    if:
      type: text
      exact: pause
