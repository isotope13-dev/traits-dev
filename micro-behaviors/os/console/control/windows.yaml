defaults:
  platforms: [windows]
  for: [pe]
traits:
  # Setting a numeric code page (`chcp 65001`) is common UTF-8 bootstrap.
  - id: chcp-set-command
    desc: Windows code page set command
    crit: baseline
    conf: 0.85
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])chcp(\.exe)?[ \t]+[0-9]{2,5}\b'
  # Bare `chcp` without a page number queries the active console code page.
  - id: chcp-query-command
    desc: Windows code page query command
    crit: notable
    conf: 0.86
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])chcp(\.exe)?\b'
    unless:
      - id: chcp-set-command
      - id: well-known/lib/ui/highlight-js::bundled-library
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: chcp-65001-command
    desc: Windows UTF-8 code page command
    crit: baseline
    conf: 0.85
    for: [batch, powershell, vbs, python]
    if:
      type: text
      regex: '(?i)chcp(\.exe)?[ \t]+65001\b|chcp[''\"]?\s*,\s*[''\"]65001'
  - id: set-console-ctrl-handler
    desc: Register console control handler
    crit: baseline
    conf: 0.86
    if:
      type: symbol
      exact: SetConsoleCtrlHandler
    unless:
      - id: metadata/file/extension/identity::uac-exe-basename
      - id: metadata/binary/framework/
    downgrade:
      # Go's runtime registers a console ctrl handler to translate Ctrl-C into
      # SIGINT for os/signal; every Go Windows binary imports it.
      any:
        - id: metadata/lang/compiled/
        - id: metadata/binary/framework/
