defaults:
  platforms: [windows]
  for: [c, cpp, rust, csharp, python]
  crit: notable

composite_rules:
  # Co-location supports inspection of remote exports, but does not bind the
  # fields to the read result or prove forwarded-export recursion.
  - id: remote-read-export-field-references
    desc: Process-memory read near PE export-table fields
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/mem/read/cross-process::read-process-memory-call
      - id: micro-behaviors/data/format/executable/header::export-name-table
      - id: micro-behaviors/data/format/executable/header::export-name-ordinals
      - id: micro-behaviors/data/format/executable/header::export-function-table
