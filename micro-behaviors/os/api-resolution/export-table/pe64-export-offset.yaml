defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.95

traits:
  - id: x64-pe-signature-export-rva-read
    desc: Checks PE signature then reads export RVA
    if:
      type: hex
      section: any
      pattern: '48 63 41 3C 81 3C 08 50 45 00 00 [0-24] 44 8B 8C 08 88 00 00 00'
