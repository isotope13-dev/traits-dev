defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.95

traits:
  - id: x64-pe-signature-export-rva-read
    desc: Checks PE signature then reads export RVA
    # Compare the NT signature ('PE\0\0') at any register/displacement, then
    # read OptionalHeader.DataDirectory[EXPORT] at the PE32+ offset 0x88.
    # Register allocation and bounds-check branches vary between compilers,
    # so neither the operands nor the gap are pinned.
    if:
      type: hex
      section: any
      pattern: '81 ?? [0-1] 50 45 00 00 [0-48] 8B ?? [0-1] 88 00 00 00'
