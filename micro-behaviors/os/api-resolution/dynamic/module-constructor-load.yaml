# Node.js Dynamic Module Resolution via module.constructor._load()
# Detects the anti-static evasion pattern where malware bypasses
# require() by calling module.constructor._load() with dynamically
# constructed module names. This defeats AST-based detectors that
# match require('module') call expressions.
# ATT&CK: T1027.002 (Obfuscated Files or Information)
# MBC: B0032 (Anti-Static Analysis)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.9
  attack: "T1027.002"
  mbc: "B0032"

traits:
  # Direct module.constructor._load() call
  - id: module-constructor-load
    desc: "Dynamic mod load via mod.constructor._load"
    if:
      # A text regex also matches documentation of the attack vector in
      # sandbox hardening code. Require the parsed call node.
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (member_expression
            object: (member_expression
              object: (identifier) @mod (#eq? @mod "module")
              property: (property_identifier) @ctor (#eq? @ctor "constructor"))
            property: (property_identifier) @load (#eq? @load "_load")))

        (call_expression
          function: (member_expression
            object: (member_expression
              object: (member_expression
                object: (identifier) @req (#eq? @req "require")
                property: (property_identifier) @main (#eq? @main "main"))
              property: (property_identifier) @ctor2 (#eq? @ctor2 "constructor"))
            property: (property_identifier) @load2 (#eq? @load2 "_load")))

  # module.constructor with bracket access (obfuscated _load)
  # e.g., module.constructor[_0xb1i9([0x5f,0x6c,0x6f,0x61,0x64])]
  - id: module-constructor-bracket-load
    desc: 'module constructor bracket load'
    if:
      type: text
      regex: "module\\.constructor\\[.{1,50}\\]\\s*\\("

  # module.constructor access (component — needs context)
  - id: module-constructor-access
    desc: Access to module.constructor
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: "module\\.constructor\\b"

  - id: new-module-constructor
    desc: Constructs Node module via module.constructor
    crit: notable
    conf: 0.94
    attack: T1059.007
    if:
      type: tree-sitter
      language: javascript
      query: |
        (new_expression
          constructor: (member_expression
            object: (identifier) @object
            property: (property_identifier) @property)
          (#eq? @object "module")
          (#eq? @property "constructor"))

  # `require('module')` then `new <alias>()` is how AES sidecar loaders obtain a
  # fresh Module instance to feed decrypted source into `_compile`.
  - id: require-node-module-builtin
    desc: Requires the Node module builtin
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: text
      regex: 'require\s*\(\s*[''"]module[''"]\s*\)'

  - id: node-module-paths-api
    desc: Calls Module._nodeModulePaths helper
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: text
      substr: _nodeModulePaths

  # module._compile detection lives in
  # micro-behaviors/process/interpreter/eval::module-compile-marker.
