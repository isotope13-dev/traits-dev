# A registry API name kept as a standalone string beside LoadLibrary and
# GetProcAddress: the function is looked up at run time rather than imported.
# Compatibility shims do this for newer registry calls; loaders do it to keep
# the call out of their import table.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1106

traits:
  - id: registry-api-name-string
    desc: Registry API name as a standalone string
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '^Reg(Open|Create|Set|Query|Delete|Enum)\w{0,16}(A|W)$'

composite_rules:
  - id: registry-api-resolved-by-name
    desc: Registry API resolved by name at run time
    crit: notable
    conf: 0.88
    all:
      - id: registry-api-name-string
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/fs/path/system/library::advapi32-dll-reference
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/load/runtime::load-library-w
