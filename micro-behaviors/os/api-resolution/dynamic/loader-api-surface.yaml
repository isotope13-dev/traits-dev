defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: loader-api-surface
    desc: Native memory, library and file API co-occurrence
    crit: notable
    conf: 0.86
    mbc: B0005
    attack: T1620
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: micro-behaviors/process/info/current::get-module-filename-ansi
      - id: micro-behaviors/fs/file/open/unspecified::fopen
      - id: micro-behaviors/fs/read/file/handle::fread
    needs: 2
  # Pair the shared memory/loader API-set capability with an executable
  # overlay stub. Keep the capability definition in mem/combined; this
  # objective adds the payload context without duplicating its evidence.
