defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: sparse-import-resolution-data-profile
    desc: Sparse imports, resolution and dense data
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/symbols/count::imported-functions-under-80
      - id: metadata/binary/symbols/count::recovered-function-count-under-10
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: metadata/binary/section/ratio::dominant-high-entropy-data
    # A large overlay or read-only data section can make native function
    # recovery unrepresentative of the whole image. The import-count leg
    # already excludes managed images.
    unless:
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/binary/section/size::rdata-section-at-least-500000-bytes
