defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  # VB6 p-code populates a byte array with the x86 CallWindowProc trampoline
  # stack-cleanup prolog: `pop eax; pop ecx; pop ecx; pop ecx; pop ecx; push eax`
  # (`0x58, 0x59, 0x59, 0x59, 0x59, 0x50`) via `LitI2_Byte` (`F4 <op>`).
  - id: vb6-pcode-callwindowproc-trampoline-prolog
    desc: VB6 p-code builds CallWindowProc x86 prolog
    conf: 0.97
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: 'F4 58 [0-20] F4 59 [0-20] F4 59 [0-20] F4 59 [0-20] F4 59 [0-20] F4 50'

  # VB6 p-code emits `push imm32` (`0x68`), `call rel32` (`0xE8`), and `ret` (`0xC3`)
  # into a runtime byte-array trampoline.
  - id: vb6-pcode-callwindowproc-trampoline-call-ret
    desc: VB6 p-code builds CallWindowProc call-ret stub
    conf: 0.96
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: 'F4 68 [0-512] F3 E8 00 [0-512] F3 C3 00'

composite_rules:
- id: vb6-dispatch-process-network-apis
  desc: VB6 dispatcher and process or network APIs
  conf: 0.88
  all:
  - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
  any:
  - id: micro-behaviors/communications/socket/create
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
