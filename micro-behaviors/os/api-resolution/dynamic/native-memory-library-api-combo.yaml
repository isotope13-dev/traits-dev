defaults:
  for:
    - pe
    - dll
  platforms:
    - windows

composite_rules:
  - id: native-memory-library-api-combo
    desc: Native memory and library API combination
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address
    any:
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/dylib/unload::free-library
      - id: micro-behaviors/mem/query::is-bad-read-ptr
    needs: 2
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-imports-50
      - id: metadata/binary/linking/runtime::system-dll-section-text
