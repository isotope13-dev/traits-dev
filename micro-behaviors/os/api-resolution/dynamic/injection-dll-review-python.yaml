defaults:
  crit: notable
  conf: 0.97
  platforms: [windows]
  for: [python]

traits:
  - id: python-getattr-write-process-memory
    desc: Python getattr WriteProcessMemory text
    if:
      type: text
      regex: getattr\([^)]{0,120}['"]WriteProcessMemory['"]\s*\)
  - id: python-getattr-create-remote-thread
    desc: Python getattr CreateRemoteThread text
    if:
      type: text
      regex: getattr\([^)]{0,120}['"]CreateRemoteThread['"]\s*\)

composite_rules:
  - id: python-getattr-remote-memory-thread-api
    desc: Python getattr remote-memory or thread API
    any:
      - id: micro-behaviors/os/api-resolution/dynamic::python-getattr-write-process-memory
      - id: micro-behaviors/os/api-resolution/dynamic::python-getattr-create-remote-thread
