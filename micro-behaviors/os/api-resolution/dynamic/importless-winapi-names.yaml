defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.92

traits:
  - id: reg-open-key-a-resolved-name
    desc: RegOpenKeyA API name absent from imports
    if:
      type: text
      exact: RegOpenKeyA
    unless:
      - id: micro-behaviors/os/registry/access::reg-open-key-a-symbol
  - id: copyfile-a-resolved-name
    desc: CopyFileA API name absent from imports
    if:
      type: text
      word: CopyFileA
    unless:
      - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: get-module-filename-a-resolved-name
    desc: GetModuleFileNameA API name absent from imports
    if:
      type: text
      word: GetModuleFileNameA
    unless:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/process/info/current::get-module-filename-ansi
  - id: get-proc-address-resolved-name
    desc: GetProcAddress API name absent from imports
    if:
      type: text
      word: GetProcAddress
    unless:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
      - id: micro-behaviors/dylib/lookup::get-proc-address
  # A retained API name without an import is evidence for possible dynamic
  # lookup, not proof that the program resolves or invokes the API.
  - id: winexec-resolved-name
    desc: WinExec API name absent from imports
    if:
      type: text
      word: WinExec
    unless:
      - id: micro-behaviors/process/create/exec::winexec

composite_rules:
  - id: self-copy-api-name-cluster
    desc: Unimported loader, lookup and self-copy names
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: get-proc-address-resolved-name
      - id: copyfile-a-resolved-name
      - id: get-module-filename-a-resolved-name
