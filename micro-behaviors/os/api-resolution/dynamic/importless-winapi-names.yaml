defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.92
  attack: T1574.002

traits:
  - id: reg-open-key-a-resolved-name
    desc: RegOpenKeyA API name absent from imports
    if:
      type: text
      exact: RegOpenKeyA
    unless:
      - id: micro-behaviors/os/registry/access::reg-open-key-a-symbol
  - id: copyfile-a-resolved-name
    desc: CopyFileA API name absent from imports
    if:
      type: text
      word: CopyFileA
    unless:
      - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: get-module-filename-a-resolved-name
    desc: GetModuleFileNameA API name absent from imports
    if:
      type: text
      word: GetModuleFileNameA
    unless:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/os/module/load::get-module-filename-ansi
  - id: get-proc-address-resolved-name
    desc: GetProcAddress API name absent from imports
    if:
      type: text
      word: GetProcAddress
    unless:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/module/load::get-proc-address-source-call
      - id: micro-behaviors/dylib/lookup::get-proc-address

composite_rules:
  - id: dynamic-self-copy-api-name-set
    desc: Dynamically resolves CopyFile and module path APIs
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: get-proc-address-resolved-name
      - id: copyfile-a-resolved-name
      - id: get-module-filename-a-resolved-name
