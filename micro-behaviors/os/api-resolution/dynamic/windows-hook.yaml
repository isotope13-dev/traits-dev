defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

composite_rules:
  - id: dynamic-windows-hook-api-resolution
    desc: Resolves SetWindowsHookEx without static import
    conf: 0.94
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/ui/window/hook::set-windows-hook-mapped-name
    unless:
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/ui/window/hook::wine-builtin-hook-api-implementation
