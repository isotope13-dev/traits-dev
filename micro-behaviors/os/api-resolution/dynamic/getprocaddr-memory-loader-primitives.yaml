defaults:
  for:
    - pe
  platforms:
    - windows
composite_rules:
  - id: getprocaddr-memory-loader-primitives
    desc: GetProcAddress and memory API names
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/binary/symbols/count::import-count-under-80
    any:
      - id: micro-behaviors/os/api-resolution/dynamic::loadlibrarya-virtualprotect-pair
      - id: micro-behaviors/mem/combined::virtualalloc-virtualprotect-pair
      - id: micro-behaviors/mem/combined::virtualprotect-virtualalloc-pair
