defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-function-pointer-dynamicinvoke-text
    desc: Delegate and DynamicInvoke text nearby
    conf: 0.95
    if:
      type: text
      regex: 'GetDelegateForFunctionPointer[\s\S]{0,120}DynamicInvoke'
