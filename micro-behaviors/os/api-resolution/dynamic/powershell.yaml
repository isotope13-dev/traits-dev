# Resolving a native export at runtime from PowerShell, without a P/Invoke
# declaration.
#
# `Add-Type`/`DllImport` puts the API name in the script where any signature
# can read it; these two constructs do not. A loader reaches into
# `Microsoft.Win32.UnsafeNativeMethods` for GetProcAddress, builds a delegate
# type with Reflection.Emit, and binds the resolved pointer to it -- so the
# only literal left is the module and function name passed as data.
#
# Neutral capability facts: interop wrappers and profiling tools legitimately
# bind function pointers this way. The loader reading comes from the composite
# in objectives/anti-static/obfuscation/eval/powershell-loader/memory.yaml,
# which pairs them with the allocate/copy/protect chain.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  attack: T1620

traits:
  - id: powershell-function-pointer-delegate
    desc: PowerShell binds a native function pointer
    conf: 0.92
    if:
      type: text
      word: GetDelegateForFunctionPointer

  # Reflective lookup of the nonpublic GetProcAddress wrapper.
  - id: powershell-unsafe-native-methods-lookup
    desc: PowerShell reflects into UnsafeNativeMethods
    conf: 0.94
    if:
      type: text
      regex: 'UnsafeNativeMethods[\s\S]{0,240}GetProcAddress'

  # `$delegate.Invoke([IntPtr]::Zero)` and `Invoke([IntPtr]::Zero, size, …)` —
  # a bound function pointer called with a null handle as the first argument.
  # Shellcode entry points take no arguments; VirtualAlloc/CreateThread pass
  # NULL as lpAddress/lpThreadAttributes. The same call shape appears in any
  # interop wrapper that passes a null handle, which is why this is the
  # neutral capability and the loader reading lives in the objectives/
  # composites that pair it with the allocate/copy chain.
  - id: powershell-null-pointer-delegate-invoke
    desc: Delegate invoked with a null pointer
    conf: 0.96
    if:
      type: text
      regex: '(?i)Invoke\s*\(\s*\[IntPtr\]::Zero\s*[,)]'

  - id: powershell-unsafe-nativemethods-type
    desc: Reflects UnsafeNativeMethods type
    conf: 0.94
    if:
      type: text
      regex: '(?i)Microsoft\.Win32\.UnsafeNativeMethods'
