defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-getattr-composed-name
    desc: Python getattr with a composed attribute name
    conf: 0.85
    if:
      type: tree-sitter
      query: |
        (call
          function: (identifier) @fn
          (#eq? @fn "getattr")
          arguments: (argument_list
            (_) @obj
            [
              (binary_operator
                left: (string)
                right: (string))
              (binary_operator
                left: (call
                  function: (identifier) @chr_l
                  (#eq? @chr_l "chr")))
              (call
                function: (identifier) @chr_only
                (#eq? @chr_only "chr"))
            ]))
  - id: python-getattr-credential-attribute
    desc: Python getattr reads credential-named attribute
    conf: 0.9
    # Reflective read of an attribute whose name is a credential
    # (`getattr(client, "api_key", None)`). On its own this is an ordinary
    # duck-typed config lookup — SDKs read their own key attributes this way —
    # so it stays a capability here; intent comes from the composites that
    # pair it with exfiltration or printing.
    if:
      type: symbol
      kind: call
      exact: getattr
      arg:
        kind: string
        regex: '(?i)(master_key|api_key|secret_key|admin_key|access_token|auth_token)'
    # `getattr(self, ...)` reads state the current instance already owns and
    # carries no reflection-on-foreign-object signal at all.
    unless:
      - type: text
        regex: 'getattr\s*\(\s*self\b'
  - id: python-getattr-import-callable
    desc: Python getattr resolves import callable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: getattr
      arg:
        kind: string
        exact: __import__
  - id: python-getattr-process-callable
    desc: Python getattr resolves process callable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: getattr
      arg:
        kind: string
        regex: '^(system|popen|Popen)$'
  - id: python-sys-modules-api-call
    desc: Python sys.modules dynamic API call
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^sys\.modules\.[^.]+\.(system|popen|Popen|check_output)$'
  - id: python-vars-api-call
    desc: Python vars() dynamic API call
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '^vars\(\)\.(system|popen|Popen|check_output)$'

composite_rules:
  - id: python-sys-modules-api-dispatch
    desc: Python sys.modules dynamic API dispatch
    conf: 0.9
    all:
      - id: micro-behaviors/os/module/resource::python-sys-modules-member
      - id: python-sys-modules-api-call
