# A dense table of __stdcall function-pointer typedefs declares many Win32
# prototypes so each can be resolved at run time. A few typedefs are ordinary
# callback declarations, so the atom requires a table-sized count.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9
  attack: T1027.007

traits:
  - id: stdcall-prototype-typedef-table
    desc: Dense table of Win32 function-pointer typedefs
    count_min: 40
    if:
      type: text
      regex: '\(__stdcall ?\*\w+\)\('
      exclude_comments: true
