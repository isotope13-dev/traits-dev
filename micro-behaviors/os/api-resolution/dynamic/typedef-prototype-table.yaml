# A dense table of __stdcall function-pointer typedefs declares many Win32
# prototypes so each can be resolved at run time. A few typedefs are ordinary
# callback declarations, so the atom requires a table-sized count.
# WINAPI is the __stdcall macro spelling, so the table uses one spelling
# throughout. Each spelling is its own atom so count_min verifies a single
# branch; the composite preserves the original OR semantics.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9
  attack: T1027.007

traits:
  - id: stdcall-prototype-typedef
    desc: Dense __stdcall function-pointer typedef table
    count_min: 40
    if:
      type: text
      regex: '\(__stdcall\s*\*\w+\)\s*\('
      exclude_comments: true

  - id: winapi-prototype-typedef
    desc: Dense WINAPI function-pointer typedef table
    count_min: 40
    if:
      type: text
      regex: '\(WINAPI\s*\*\w+\)\s*\('
      exclude_comments: true

composite_rules:
  - id: stdcall-prototype-typedef-table
    desc: Dense table of Win32 function-pointer typedefs
    any:
      - id: stdcall-prototype-typedef
      - id: winapi-prototype-typedef
