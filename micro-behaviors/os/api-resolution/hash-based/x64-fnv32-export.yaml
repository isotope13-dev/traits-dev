defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-fnv32-export-name-walk
    desc: FNV32 hashes PE export names for lookup
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # Export-directory RVA, name-table walk, FNV-1a seed/multiply,
      # comparison with requested hash, then ordinal/function tables.
      pattern: '8B 8C 08 88 00 00 00 [0-48] 35 C5 9D 1C 81 [0-8] 69 D0 93 01 00 01 [0-16] 41 3B C4 74 ?? [0-32] 41 8B 44 1F 24 41 8B 4C 1F 1C'
