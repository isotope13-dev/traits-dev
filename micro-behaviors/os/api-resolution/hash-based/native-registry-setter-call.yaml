defaults:
  arch:
  - x86-64
  platforms:
  - windows
  for:
  - pe
traits:
- id: djb2-registry-setter-zero-buffer-call
  desc: DJB2-resolved setter call with zero DWORD
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |-
      rule native_zero_dword_registry_writer {
       strings:
        $clear = { 45 33 F6 }
        $zero = { 44 89 75 ?? }
        $write = { E8 ?? ?? ?? ?? 48 85 C0 74 ?? C7 44 24 28 04 00 00 00 48 8D 4D ?? 48 89 4C 24 20 41 B9 04 00 00 00 45 33 C0 48 8B D6 48 8B 4D ?? FF D0 }
       condition:
        for any i in (1..#clear): (for any j in (1..#zero): (for any k in (1..#write): (
         @clear[i] < @zero[j] and @zero[j] - @clear[i] < 64 and
         @zero[j] < @write[k] and @write[k] - @zero[j] < 4096 and
         uint8(@zero[j]+3) == uint8(@write[k]+21) and
         with resolver = @write[k]+5+int32(@write[k]+1) : (
          resolver >= 0 and resolver+1024 < filesize and
          for any h in (resolver..resolver+1024): (
           uint32(h) == 0xd03173a0 and uint8(h-3) == 0x41 and uint16(h-2) == 0xf981 and
           for any q in (h-40..h-8): (
            uint32(q) == 0x21c96b45 and uint32(q+4) == 0xc0be0f41
           )
          )
         )
        )))
      }
