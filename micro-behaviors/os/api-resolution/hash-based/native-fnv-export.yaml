defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-fnv1a-export-name-resolver
    desc: PE export lookup by FNV-1a name hash
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # Export name table walk, FNV offset/prime, comparison against the
      # requested hash, then ordinal and function-address table lookup.
      pattern: '8B 46 20 45 31 C0 48 8D 1C 01 [0-16] 42 8B 0C 83 BA C5 9D 1C 81 [0-48] 31 C2 0F B6 01 69 D2 93 01 00 01 84 C0 75 ?? 41 39 D2 [0-24] 8B 46 24 4B 8D 14 41 0F B7 14 02 8B 46 1C'
