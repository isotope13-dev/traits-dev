defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-fnv64-export-name-hash-walk
    desc: Walks PE exports using FNV64 hashes
    crit: notable
    conf: 0.99
    if:
      # AddressOfNames walk, FNV64 offset basis, byte XOR/multiply loop,
      # then comparison against a requested (optionally masked) name hash.
      type: yara
      source: |
        import "pe"
        rule x64_fnv64_export_hash_walk {
          strings:
            $walk = { 43 8B 14 83 48 B9 25 23 22 84 E4 9C F2 CB 49 03 D7 0F B6 02 84 C0 74 ?? [0-12] 0F B6 C0 48 8D 52 01 48 33 C8 0F B6 02 49 0F AF CD 84 C0 75 ?? 48 33 CD 48 3B CE }
          condition:
            pe.is_64bit() and $walk and
            for any i in (1..#walk): (
              for any s in (0..pe.number_of_sections - 1): (
                pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
                @walk[i] >= pe.sections[s].raw_data_offset and
                @walk[i] + !walk[i] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
              )
            )
        }
