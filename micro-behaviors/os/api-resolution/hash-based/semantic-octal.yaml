# Semantic carrier lookup; no fixed alphabet, token assignments or URLs.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
  size_max: 262144
traits:
  # Decoded evidence: '%u6850%u1a36%u702f'
  - id: octal-dictionary-urlmon-resolver-hash
    desc: Octal URLDownloadToFileA ROR13 resolver hash
    if:
      type: yara
      source: |
        import "math"
        rule octal_dictionary_urlmon_resolver_hash {
         strings:
          $dictionary = /'([0-7]{1,3}\|){1,61}eval(\|[0-7]{1,3}){1,61}'/
         condition:
          $dictionary and
          for any d in (1..#dictionary) : (
           for any p in (0..@dictionary[d]-3*18) : (
            uint16(p) == 0x5c5c and
            for all n in (0..18-1) : (
             uint16(p+n*3) == 0x5c5c and
             for any k in (0..!dictionary[d]-3) : (
              (uint8(@dictionary[d]+k) == 124 or k == 0) and
              ((n == 0 and uint8(@dictionary[d]+k+1) == 52 and uint8(@dictionary[d]+k+2) == 53 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 1 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2) == 54 and uint8(@dictionary[d]+k+3) == 53 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39)) or
        (n == 2 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 54 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 3 and uint8(@dictionary[d]+k+1) == 55 and uint8(@dictionary[d]+k+2) == 48 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 4 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 53 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 5 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 48 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 6 and uint8(@dictionary[d]+k+1) == 52 and uint8(@dictionary[d]+k+2) == 53 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 7 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2) == 54 and uint8(@dictionary[d]+k+3) == 53 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39)) or
        (n == 8 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 49 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 9 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2) == 52 and uint8(@dictionary[d]+k+3) == 49 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39)) or
        (n == 10 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 51 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 11 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 54 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 12 and uint8(@dictionary[d]+k+1) == 52 and uint8(@dictionary[d]+k+2) == 53 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 13 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2) == 54 and uint8(@dictionary[d]+k+3) == 53 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39)) or
        (n == 14 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 55 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 15 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 48 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 16 and uint8(@dictionary[d]+k+1) == 54 and uint8(@dictionary[d]+k+2) == 50 and (uint8(@dictionary[d]+k+3) == 124 or uint8(@dictionary[d]+k+3) == 39)) or
        (n == 17 and uint8(@dictionary[d]+k+1) == 49 and uint8(@dictionary[d]+k+2) == 52 and uint8(@dictionary[d]+k+3) == 54 and (uint8(@dictionary[d]+k+4) == 124 or uint8(@dictionary[d]+k+4) == 39))) and
              with slot = math.count(124,@dictionary[d],k+1) : (
               (slot < 10 and uint8(p+n*3+2) == slot+48) or
               (slot >= 10 and slot < 36 and uint8(p+n*3+2) == slot+87) or
               (slot >= 36 and slot < 58 and uint8(p+n*3+2) == slot+29)
              )
             )
            )
           )
          )
        }
