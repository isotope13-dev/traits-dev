defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1027.002
  mbc: F0004
traits:
  - id: in-memory-order
    desc: InMemoryOrderModuleList traversal
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: InMemoryOrderModuleList
  - id: in-load-order
    desc: InLoadOrderModuleList traversal
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: InLoadOrderModuleList
  - id: in-init-order
    desc: InInitializationOrderModuleList traversal
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: InInitializationOrderModuleList
  - id: peb-ldr-list-access-x86
    desc: Direct x86 PEB loader-list access
    crit: notable
    conf: 0.92
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '64 8B ?? 30 00 00 00 [0-96] 8B ?? 0C'
  - id: pe-export-directory-walk-x86
    desc: Manual x86 PE export-directory walk
    crit: notable
    conf: 0.94
    if:
      type: hex
      section: .text
      pattern: '8B ?? 3C [0-24] 8B ?? ?? 78 [0-24] 8B ?? ?? 24 [0-24] 8B ?? ?? 1C [0-24] 8B ?? ?? 18'
  # A bounds-checking resolver may separate the PE-header, signature, and
  # export-directory reads with conditional branches.  The compact walk above
  # intentionally does not cover that safer layout.
  - id: checked-pe-export-directory-walk-x86
    desc: Checked x86 PE export-directory walk
    crit: notable
    conf: 0.96
    arch: [x86]
    if:
      type: value
      path: pe.checked_export_walk_sites[*].kind
      exact: checked_pe32_export_directory_walk
  - id: address-of-name-ordinals
    desc: Parses export ordinals to resolve APIs
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: AddressOfNameOrdinals
    unless:
      - type: text
        word: ExportTable
    downgrade:
      any:
        - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
        - id: metadata/binary/framework::dotnet-metadata
        - id: micro-behaviors/fs/file/section::pe-viewer-header-labels
  - id: li-fn-macro
    desc: lazy_importer LI_FN API hashing
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: LI_FN
  - id: li-module-macro
    desc: lazy_importer LI_MODULE handle lookup
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: LI_MODULE
  - id: fnv1a-hash
    desc: FNV-1a hash (API name hashing)
    crit: notable
    conf: 0.65
    if:
      type: text
      regex: (?i)fnv.?1a
  - id: djb2-hash
    desc: DJB2 hash (API name hashing)
    crit: notable
    conf: 0.65
    if:
      type: text
      regex: (?i)djb2
  - id: get-proc-by-hash
    desc: Get procedure by hash function
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)get.?proc.?by.?hash
  - id: resolve-by-hash
    desc: Resolve API by hash function
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)resolve.?by.?hash
  # imul+shr+xor is common in ordinary hash tables (e.g. Steam/Valve), not
  # only PE export API hashing — suppress when Steam client identity is known.
  - id: multiplicative-hash-loop
    desc: "Multiplicative hash inner loop"
    crit: notable
    conf: 0.8
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      pattern: 69 ?? ?? ?? ?? ?? 8B ?? C1 ?? ?? 33 ??
    unless:
      - id: well-known/game/steam::steam-client-identity
  - id: custom-mul-xor-rol-api-hash-loop-x86
    desc: Custom x86 multiply-XOR-rotate API hash loop
    crit: notable
    conf: 0.94
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_profiles[*].kind
      exact: multiply_xor_rotate
  - id: flattened-xor-rol-mul-api-hash-loop-x86
    desc: Flattened x86 XOR-rotate-multiply API hash loop
    crit: notable
    conf: 0.96
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_profiles[*].kind
      exact: xor_rotate_multiply_xor
  - id: hashed-pe-export-resolver-callsite
    desc: Manual PE export resolution by API hash
    crit: suspicious
    conf: 0.98
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_resolver_requests[*].kind
      exact: hashed_pe_export_resolution
  - id: constant-folded-api-hash-request
    desc: Static expression yields API hash request
    crit: notable
    conf: 0.97
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_resolver_requests[*].hash_source
      exact: constant_folded_memory_xor_add
  - id: hashed-ntqueryinformationprocess-resolution
    desc: NtQueryInformationProcess resolved by API hash
    crit: suspicious
    conf: 0.99
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_resolver_requests[*].resolved_name
      exact: NtQueryInformationProcess
  - id: hashed-network-stack-api-resolution
    desc: Network API resolved by name hash
    crit: suspicious
    conf: 0.97
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_resolver_requests[*].resolved_library
      regex: '(?i)^(winhttp|wininet|ws2_32)\.dll$'
  - id: multiplicative-hash-loop-x64
    desc: 'Multiplicative hash inner loop'
    crit: notable
    conf: 0.85
    arch: [x86-64]
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: (45|44|41) 69 ?? ?? ?? ?? ?? [0-12] C1 ?? ?? [0-12] (44|45|41|31|33) (31|33) ??
  - id: multiply-by-129-api-hash-loop-x64
    desc: x64 API hash loop, multiply by 129
    crit: notable
    conf: 0.94
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 45 69 ?? 81 00 00 00 [0-12] 01 ?? [0-12] EB
  - id: shift-add-33-hash-loop-x64
    desc: x64 shift/add-33 API hash loop
    crit: notable
    conf: 0.92
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: (41|44|45) (BC|BE|BF) ?? ?? ?? ?? [0-16] 44 89 (E6|F6) C1 (E6|F6) 05 44 01 (E6|F6) 44 0F B6 (E5|F5) 44 01 (E6|F6)
  - id: shift-add-33-hash-packed-stub-x64
    desc: x64 shift-add-33 hash in packed stub
    crit: notable
    conf: 0.96
    arch: [x86-64]
    size_max: 1048576
    if:
      type: hex
      offset_range: [0, 524288]
      pattern: '41 B? ?? ?? ?? ?? [0-16] 44 89 ?? C1 E? 05 44 01 ?? 44 0F B6 ?? 41 01 ?? [0-16] 48 FF C? [0-8] 75 ??'
  - id: peb-being-debugged-byte
    desc: "Inline PEB.BeingDebugged byte read"
    crit: suspicious
    conf: 0.9
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 65 48 8b 04 25 60 00 00 00 [0-16] 0F B6 ?? 02
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-windows
        - id: metadata/signed/leaf::microsoft-corporation
        - id: metadata/binary/vendor::windows-system-implementer-dll
        - id: well-known/lib/platform/wine/
    unless:
      - id: well-known/lib/crypto/workink::workink-key-validation-anti-tamper
  - id: peb-being-debugged-byte-i386
    desc: 'Inline PEB.BeingDebugged byte read'
    crit: suspicious
    conf: 0.9
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: 64 A1 18 00 00 00 8B 40 30 0F B6 40 02
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-windows
        - id: metadata/signed/leaf::microsoft-corporation
        - id: metadata/binary/vendor::windows-system-implementer-dll
        - id: well-known/lib/platform/wine/
composite_rules:
  - id: peb-traversal
    desc: PEB module list traversal
    crit: notable
    conf: 0.85
    any:
      - id: in-memory-order
      - id: in-load-order
      - id: in-init-order
  - id: lazy-importer
    desc: Lazy importer library usage
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/os/api-resolution/lazy-importer::lazy-importer-usage
      - id: li-fn-macro
      - id: li-module-macro
