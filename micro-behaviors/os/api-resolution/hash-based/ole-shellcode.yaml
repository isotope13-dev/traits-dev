defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.98
traits:
  # PEB loader walk, then PE export-name traversal with add/ROR-13 hashing.
  # 0x4d and 0x0d rotate counts are equivalent for a 32-bit register.
  - id: ole-peb-add-ror13-export-resolver
    desc: OLE shellcode resolves exports by ADD/ROR13
    if:
      type: hex
      pattern: '64 FF 35 30 00 00 00 58 8B 40 0C 8B 70 1C AD 8B 68 08 [0-48] 31 FF FC 31 C0 AC 38 E0 74 ?? 01 C7 C1 CF (0D|4D) EB ??'
