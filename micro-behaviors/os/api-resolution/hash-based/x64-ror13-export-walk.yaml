defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  # Export names/ordinals/functions are walked together. A zero-extended
  # name-byte loop rotates and adds into EDX before the ordinal is used to
  # fetch the corresponding export address. Includes appended code sections.
  - id: x64-ror13-name-ordinal-export-walk
    desc: ROR13 hashing during PE export traversal
    crit: notable
    conf: 0.98
    if:
      type: hex
      offset_range: [512, null]
      pattern: '41 8B 73 20 41 8B 7B 24 49 03 F2 41 8B 6B 1C 49 03 FA 49 03 EA [0-64] 41 0F B6 00 C1 CA 0D 03 D0 49 83 C0 01 75 ?? 41 0F B7 C6 44 8B 44 85 00 4D 03 C2'
