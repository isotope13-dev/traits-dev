defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: packed-x86-winexec-hash-words
    desc: Packed words contain WinExec resolver hash
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bu9868.{0,40}u8afe\|uff0e\b|uBF5D\|u0E8A\|uFE98\|uEB52\|u5324'
  - id: packed-download-resolver-hash-words
    desc: Packed downloader API resolver hash words
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)uFF40\|uFF52\|u1A36\|uBF50'
