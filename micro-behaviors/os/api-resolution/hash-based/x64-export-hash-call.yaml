defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-export-name-hash-call-loop
    desc: Calls hash function over PE export names
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Export-directory name/ordinal/function tables followed by a bounded
      # name walk and requested-hash comparison. Call relocations vary.
      pattern: '44 8B 76 20 8B 46 1C 4C 03 F7 44 8B 6E 24 [0-32] 41 8B 0C 9E 48 03 CF E8 [4] 41 3B C4 74 ?? FF C3 3B 5E 18 72 ??'
