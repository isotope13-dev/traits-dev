defaults:
  for:
  - c
  - cpp
  platforms:
  - windows

composite_rules:
  - id: peb-export-resolution-reference-profile
    desc: PEB list with PE export-field references
    crit: notable
    conf: 0.95
    all:
    - id: micro-behaviors/os/api-resolution/manual::peb-module-walk
    - id: micro-behaviors/data/format/executable/header::export-directory-field-set
    unless:
    - id: well-known/lib/platform/wine::wine-source-tree
    - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
