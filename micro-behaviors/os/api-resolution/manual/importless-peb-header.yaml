defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]

composite_rules:
  # PEB access plus PE parsing does not establish hashing, obfuscation, or
  # hostile execution. Manual mappers and import-free utilities share it.
  - id: importless-x86-peb-header-inspection
    desc: Importless x86 image with PEB and PE-header reads
    crit: notable
    conf: 0.9
    size_max: 5242880
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: micro-behaviors/os/api-resolution/manual::peb-access-x86
      - id: metadata/binary/instruction::x86-load-displacement-3c
    any:
      - id: micro-behaviors/data/format/pe-parser::mz-magic-check
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: metadata/binary/instruction::pe-signature-immediate-compare
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/wix::wixca-module-pdb-path
