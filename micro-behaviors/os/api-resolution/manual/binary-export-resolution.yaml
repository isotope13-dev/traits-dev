defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: binary-export-resolution
    desc: Native PE export-table traversal or name comparisons
    crit: notable
    conf: 0.95
    any:
      - id: pe-export-table-walk
      - id: x86-backward-module-export-walk
      - id: x86-backward-mz-search-export-resolver
      - id: manual-api-name-compare-chain
