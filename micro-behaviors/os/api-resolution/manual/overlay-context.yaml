# These are co-occurring image properties and PEB accesses. They establish
# neither injection nor an unpack-to-execution chain.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: x86-peb-loader-small-image-large-overlay
    desc: PEB loader access in small overlay-heavy image
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: micro-behaviors/os/api-resolution/manual::x86-peb-loader-data-load
      - id: metadata/binary/section/size::small-code-in-large-pe
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/lib/

  - id: x86-peb-loader-truncated-certificate
    desc: PEB loader access with truncated certificate table
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: micro-behaviors/os/api-resolution/manual::x86-peb-loader-data-load
      - id: metadata/binary/layout/checksum::cert-table-truncated
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: well-known/lib/
