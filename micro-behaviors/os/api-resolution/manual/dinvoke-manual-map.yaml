# DInvoke-style mapped-module export resolution in C# sources: a module image
# is mapped from disk and exports are resolved and invoked from the mapped
# copy, bypassing user-mode hooks on the loaded module.
defaults:
  platforms: [windows]
  for: [csharp]
  crit: notable
traits:
  - id: csharp-call-mapped-module-export
    desc: C# invokes mapped-module export
    conf: 0.92
    if:
      type: text
      word: CallMappedDLLModuleExport
  - id: csharp-manual-map-module-to-memory
    desc: C# manual-maps module image
    conf: 0.92
    if:
      type: text
      word: MapModuleToMemory
