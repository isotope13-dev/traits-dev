composite_rules:
- id: go-pe-sparse-import-dynamic-dispatch
  desc: Go dynamic dispatch with sparse PE imports
  conf: 0.9
  all:
  - id: metadata/lang/compiler/systems::go-pe-rich-symbols
  - id: metadata/binary/symbols/imports::pe-single-import-dll
  - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
  any:
  - id: metadata/binary/resource/size::no-resources
  - id: metadata/binary/symbols/count::import-count-under-80
  - id: metadata/binary/section/ratio::inflated-data-section
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  platforms:
  - linux
  - macos
  - windows
- id: go-pe-opaque-build-syscalln-support
  desc: Opaque Go build with SyscallN support
  conf: 0.92
  all:
  - id: metadata/lang/compiler/systems::go-buildinfo
  - id: metadata/lang/go-build::go-trimpath
  - id: metadata/binary/symbols/compiler::go-syscalln-name
  any:
  - id: metadata/lang/compiler/systems::go-opaque-module-path
  - id: metadata/lang/compiler/systems::go-opaque-build-path
  platforms:
  - windows
defaults:
  for:
  - pe
  crit: notable
