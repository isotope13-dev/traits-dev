# DInvoke routine names that survive compilation into .NET metadata. DInvoke
# (TheWover) is vendored wholesale into Apollo, SharpSploit-derived loaders
# and many red-team assemblies; renamed forks usually keep these member names.
#   OverloadModule  - maps a decoy signed DLL from System32 into a section and
#                     overwrites it with the payload, so the code is file-backed
#   FindDecoyModule - picks the System32 DLL to overload
#   GetSyscallStub  - copies a syscall stub out of a fresh ntdll mapping
#   MapModuleToMemory - manual-maps a PE image without the loader
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  crit: notable

traits:
  - id: dinvoke-overload-module-name
    desc: DInvoke OverloadModule routine name
    conf: 0.94
    if:
      type: text
      word: OverloadModule

  - id: dinvoke-find-decoy-module-name
    desc: DInvoke FindDecoyModule routine name
    conf: 0.95
    if:
      type: text
      word: FindDecoyModule

  - id: dinvoke-get-syscall-stub-name
    desc: DInvoke GetSyscallStub routine name
    conf: 0.93
    if:
      type: text
      word: GetSyscallStub
