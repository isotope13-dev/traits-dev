defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-adjusted-kernel-image-check
    desc: x86 adjusted kernel-image header checks
    crit: notable
    conf: 0.99
    if:
      type: hex
      offset_range: [1024, null]
      pattern: FF 73 3C 59 [0-16] 81 E9 FD FF FF 7F [0-24] 81 D9 E6 13 00 00
