defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
traits:
  - id: x86-adjusted-mz-backscan
    desc: x86 module backscan with adjusted MZ comparison
    conf: 0.98
    if:
      type: hex
      section: text
      # Scan backwards from an imported API to its module; compare M-1 and Z+1.
      pattern: '2B C2 8B 08 FE C9 80 F9 4C 75 ?? FE C5 80 FD 5B 75 ??'
  - id: x86-export-names-pointer-walk
    desc: x86 reads PE export names and count
    conf: 0.96
    if:
      type: hex
      section: text
      # Optional-header export RVA, AddressOfNames, NumberOfNames.
      pattern: '8B 70 60 8B 45 ?? 83 C0 20 03 F0 8B 3E 83 EE 0C 8B 06'
