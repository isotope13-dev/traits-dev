defaults:
  platforms: [windows]
  for: [lua]
  crit: notable
  conf: 0.94

traits:
  # Bind a cast-member alias to a subsequent two-argument call in the same
  # block. Bare FFI typedefs, log messages and unrelated calls do not qualify.
  - id: lua-aliased-peb-pointer-cast
    desc: Lua alias casts a PEB pointer
    if:
      type: tree-sitter
      query: |
        ((block
          (assignment_statement
            (variable_list . (identifier) @caster .)
            (expression_list . (bracket_index_expression
              field: (string content: (string_content) @method)) .))
          (assignment_statement
            (expression_list (function_call name: (identifier) @called
              arguments: (arguments . (string content: (string_content) @pointer) . (_) .)))))
          (#eq? @method "cast")
          (#eq? @caster @called)
          (#eq? @pointer "PEB*"))

  - id: lua-aliased-export-directory-pointer-cast
    desc: Lua alias casts PE export-directory pointer
    if:
      type: tree-sitter
      query: |
        ((block
          (assignment_statement
            (variable_list . (identifier) @caster .)
            (expression_list . (bracket_index_expression
              field: (string content: (string_content) @method)) .))
          (assignment_statement
            (expression_list (function_call name: (identifier) @called
              arguments: (arguments . (string content: (string_content) @pointer) . (_) .)))))
          (#eq? @method "cast")
          (#eq? @caster @called)
          (#eq? @pointer "IMAGE_EXPORT_DIRECTORY*"))

