defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: x86-page-backscan-adjusted-pe-header
    desc: Backscans memory for adjusted PE header
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: any
      # SUB EBX,30; SUB BX,98 walks backward by 128 bytes. The
      # displaced e_lfanew check then verifies the PE signature.
      # Displacements and junk vary with the polymorphic generation.
      pattern: '83 EB ?? 66 83 EB ?? 75 ?? [0-12] 0F B7 53 3C 81 D2 ?? ?? ?? ?? 79 ?? [0-12] 8B 94 1A ?? ?? ?? ?? 66 83 F2 45 75 ??'
