defaults:
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: manual-api-name-compare-chain
  desc: WinE/Clos/Writ/Crea/GetT name comparisons
  crit: suspicious
  arch: [x86]
  # GetT is a prefix, not a timing API: the entry graft resolves
  # GetTempPathA here. Keep the observation limited to the compared bytes.
  if:
    type: hex
    pattern: 81 F9 57 69 6E 45 [0-32] 81 F9 43 6C 6F 73 [0-48] 81 F9 57 72 69 74 [0-48]
      81 F9 43 72 65 61 [0-48] 81 F9 47 65 74 54
    offset_range:
    - 0
    - null
