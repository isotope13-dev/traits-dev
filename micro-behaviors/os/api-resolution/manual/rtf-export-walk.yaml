# Hex source represents executable x86 comparisons for GetProcAddress followed
# by the PE export-ordinal and address-table walk. It does not prove execution.
defaults:
  for: [rtf]
  platforms: [windows]
traits:
  - id: hex-x86-getprocaddress-export-walk
    desc: Hex x86 GetProcAddress export-table lookup
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule rtf_hex_x86_export_walk {
          strings:
            $getp = /81[ \t\r\n]*[0-9a-f]{2}[ \t\r\n]*47[ \t\r\n]*65[ \t\r\n]*74[ \t\r\n]*50/ nocase
            $roca = /81[ \t\r\n]*[0-9a-f]{2}[ \t\r\n]*04[ \t\r\n]*72[ \t\r\n]*6f[ \t\r\n]*63[ \t\r\n]*41/ nocase
            $tables = /8b[ \t\r\n]*75[ \t\r\n]*24[ \t\r\n]*03[ \t\r\n]*f3[ \t\r\n]*66[ \t\r\n]*8b[ \t\r\n]*14[ \t\r\n]*56[ \t\r\n]*8b[ \t\r\n]*75[ \t\r\n]*1c[ \t\r\n]*03[ \t\r\n]*f3/ nocase
          condition:
            for any p in (1..#getp) : (
              for any r in (1..#roca) : (
                @roca[r] > @getp[p] and @roca[r] - @getp[p] < 256 and
                $tables in (@roca[r]..@roca[r]+512)
              )
            )
        }
