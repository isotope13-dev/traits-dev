# Reflective shellcode API-resolution atoms for native x64 PE binaries
# Position-independent stubs walk the PEB loader order list from GS:0x60
# and dispatch resolved routines through a modulebase+RVA table with
# indirect calls, avoiding every import. No `section:` scope: entry-point
# shellcode lives outside .text (appended loader sections, overlays), and
# both spellings carry enough concrete bytes to need no pinning.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  - id: x64-teb-peb-ldr-order-walk
    desc: TEB PEB loader order-list walk
    crit: notable
    conf: 0.9
    if:
      type: hex
      offset_range: [0, null]
      pattern: "65 48 8B 38 48 8B 7F 18 48 8B 7F 20"
  - id: x64-modulebase-rva-table-dispatch
    desc: Module-base RVA table indirect call
    crit: notable
    conf: 0.85
    if:
      type: hex
      offset_range: [0, null]
      pattern: "48 8B 83 ?? ?? 00 00 48 01 F8 FF D0"
