defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007
  mbc: B0032.014
  conf: 0.9
  crit: notable
traits:
  - id: djb2-globalmemorystatusex
    desc: DJB2 hash of GlobalMemoryStatusEx
    if:
      type: hex
      section: .text
      pattern: 'F0 11 B2 E4'
  - id: djb2-getsystemmetrics
    desc: DJB2 hash of GetSystemMetrics
    if:
      type: hex
      section: .text
      pattern: 'A1 C1 88 A9'
  - id: djb2-getcursorpos
    desc: DJB2 hash of GetCursorPos
    if:
      type: hex
      section: .text
      pattern: '95 A2 EF 30'
  - id: djb2-checkremotedebuggerpresent
    desc: DJB2 hash of CheckRemoteDebuggerPresent
    if:
      type: hex
      section: .text
      pattern: '15 8C 63 06'
