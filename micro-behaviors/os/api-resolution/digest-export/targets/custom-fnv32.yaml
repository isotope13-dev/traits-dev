defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
traits:
  - id: custom-fnv32-dpapi-memory-hashes
    desc: DPAPI memory protection API hashes
    conf: 0.99
    if:
      type: hex
      section: .text
      # CryptUnprotectMemory and CryptProtectMemory under the custom FNV32
      # routine. These are API-derived constants, not specimen identifiers.
      pattern: 'BF 10 81 53 A3 BE 3D 99 8A 71 [0-24] 8B D7 48 8B C8 E8 ?? ?? ?? ??'
  - id: custom-fnv32-apc-queue-hashes
    desc: Native APC queue API hash requests
    conf: 0.99
    if:
      type: hex
      section: .text
      # NtQueueApcThreadEx2 and NtQueueApcThreadEx requested through a
      # common module/export resolver, allowing changing instruction RVAs.
      pattern: >-
        BA AD 4D 12 2B 48 89 05 ?? ?? ?? ?? 48 8B CB E8 ?? ?? ?? ??
        48 89 05 ?? ?? ?? ?? BA F5 09 8B 5B 48 8B CB E8 ?? ?? ?? ??
