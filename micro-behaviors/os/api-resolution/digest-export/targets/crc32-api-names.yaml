# CRC32 (IEEE, zlib polynomial) digests of export names, stored as
# little-endian immediates or hash-table entries. Resolvers hash the name as
# exported, its lowercase form (case-insensitive lookups) or its uppercase
# form, so each spelling is its own hex atom and the per-API composite accepts
# any of them. A digest names the API the code resolves without importing it;
# it does not show how the API is used.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007
  mbc: B0032.014
traits:
  - id: crc32-lower-nt-allocate-virtual-memory
    desc: CRC32 of lowercase NtAllocateVirtualMemory
    crit: notable
    conf: 0.85
    if:
      type: hex
      section: any
      # 68 48 89 C1 is also ordinary x64 code: mov reg,[rsp+68h] followed
      # by mov rcx,rax (seen in a Go GUI client). Require the digest as an
      # imm32 operand: ALU-EAX, PUSH, MOV r32, 81 /r or C7 /0 forms.
      pattern: '(05|0D|25|2D|35|3D|68|B8|B9|BA|BB|BD|BE|BF|81 ??|C7 ?? ??|C7 4? ?? ??) 68 48 89 C1'
  - id: crc32-exact-nt-allocate-virtual-memory
    desc: CRC32 of as-exported NtAllocateVirtualMemory
    crit: notable
    conf: 0.85
    if:
      type: hex
      section: any
      pattern: 'EB 2F 76 E0'
  - id: crc32-upper-nt-allocate-virtual-memory
    desc: CRC32 of uppercase NtAllocateVirtualMemory
    crit: notable
    conf: 0.85
    if:
      type: hex
      section: any
      pattern: 'E0 60 74 E7'
