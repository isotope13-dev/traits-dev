defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: djb2-protect-load-constant-bytes
    desc: DJB2-compatible API hash constant bytes
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule djb2_protect_load_constant_bytes {
          strings:
            $seed = { 95 92 C1 4E }
            $other = { 89 9A 7E 08 }
            $protect = { 58 EC 57 52 }
            $load = { B3 8C AF BF }
          condition:
            all of them
        }
