# Local groups of API-name digests suggest hashed API resolution. They do
# not establish call order, debug-object swapping, or environment gating.
# Keep the hashes close: large GPU libraries contain coincidental four-byte
# matches in compressed device code, separated by megabytes.
# Preserve table-based and immediate constants, without vendor exclusions.
defaults:
  platforms: [windows]
  for: [pe]
  crit: suspicious
  conf: 0.9
  attack: T1027.007

composite_rules:
  - id: crc32-debug-object-process-cluster
    desc: Nearby CRC32 debug-object and process API constants
    near_bytes: 256
    all:
      - id: crc32-dbgui-get-thread-debug-object
      - id: crc32-dbgui-set-thread-debug-object
    any:
      - id: crc32-create-process-internal-w
      - id: crc32-nt-create-user-process

  - id: crc32-ad-entra-join-cluster
    desc: Nearby CRC32 AD and Entra join-state API constants
    near_bytes: 256
    all:
      - id: crc32-net-get-join-information
    any:
      - id: crc32-net-get-aad-join-information
      - id: crc32-dsr-get-join-info
