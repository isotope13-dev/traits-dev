defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: checksum-hash-walk-system-api-profile
    desc: Checksum mismatch, hash walk and host APIs
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: micro-behaviors/os/api-resolution/digest-export::multiply-shift-xor-export-walk
      - id: micro-behaviors/os/sysinfo/hardware::get-system-info
    any:
      - id: micro-behaviors/hardware/input/mouse::get-cursor-pos
      - id: micro-behaviors/time/query::get-tick-count
