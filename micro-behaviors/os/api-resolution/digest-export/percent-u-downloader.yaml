defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.99
traits:
  - id: percent-u-urlmon-download-hash
    desc: Percent-u x86 URLDownloadToFileA resolver hash
    if:
      type: text
      regex: '(?i)%ubf50%u1a36%u702f'
  - id: percent-u-winexec-contiguous-hash
    desc: Percent-u x86 WinExec resolver hash
    if:
      type: text
      regex: '(?i)%ubf5d%ufe98%u0e8a'
  # A writer may split a percent-u word itself at its literal boundary.
  # These are incomplete pieces of the same immediate, not API calls alone.
  - id: percent-u-winexec-immediate-prefix
    desc: Split WinExec immediate low-word fragment
    crit: component
    if:
      type: text
      regex: '(?i)%ubf5d%ufe98%u["'']'
  - id: percent-u-winexec-immediate-tail
    desc: Split WinExec immediate high-word fragment
    crit: component
    if:
      type: text
      regex: '(?i)["'']0e8a%u'
composite_rules:
  - id: percent-u-winexec-split-hash
    desc: Adjacent writer fragments contain WinExec hash
    crit: notable
    near_bytes: 240
    all:
      - id: percent-u-winexec-immediate-prefix
      - id: percent-u-winexec-immediate-tail
  - id: percent-u-winexec-hash
    desc: Percent-u x86 WinExec resolver hash
    crit: notable
    any:
      - id: percent-u-winexec-contiguous-hash
      - id: percent-u-winexec-split-hash
