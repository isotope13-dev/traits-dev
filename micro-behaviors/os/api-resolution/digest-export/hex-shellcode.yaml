# Contiguous hex is used by classic ASP binary-response generators.
# Match the resolver's instruction idioms and API hash call sites, not a host.
defaults:
  platforms: [windows]
  for: [asp, vbs, html, text]
  crit: notable
  conf: 0.98
traits:
  - id: hex-x86-ror13-export-name-loop
    desc: Hex x86 export-name hashing loop with ROR13
    if:
      type: text
      regex: '(?i)33ff33c0fcac84c074[0-9a-f]{2}c1cf0d03f8'
  - id: hex-x86-url-cache-download-hash
    desc: Hex x86 URLDownloadToCacheFileA hash resolution
    if:
      type: text
      regex: '(?i)684fef4f0550e8[0-9a-f]{8}83c408c3'
  - id: hex-x86-createprocess-hash
    desc: Hex x86 CreateProcessA hash resolution
    if:
      type: text
      regex: '(?i)6872feb31650e8[0-9a-f]{8}83c408c3'
