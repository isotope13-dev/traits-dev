defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.98

traits:
  - id: raw-x86-ror13-export-loop
    desc: X86 PE export ROR13 hashing
    if:
      type: hex
      pattern: '8B 54 05 78 [0-8] 8B 4A 18 [0-8] 8B 5A 20 [0-24] 33 C0 FC AC 84 C0 74 ?? C1 CF 0D 03 F8'
  - id: raw-x86-url-cache-download-hash
    desc: X86 URLDownloadToCacheFileA hash resolver call
    if:
      type: hex
      pattern: '68 4F EF 4F 05 50 E8 [4] 83 C4 08 C3'
  - id: raw-x86-createprocess-hash
    desc: X86 CreateProcessA hash resolver call
    if:
      type: hex
      pattern: '68 72 FE B3 16 50 E8 [4] 83 C4 08 C3'

  # The XOR key is read from the actual byte-decoder instruction, then bound
  # to each encoded instruction marker. This is not an arbitrary XOR search.
  - id: xor-x86-export-resolver
    desc: XOR-concealed x86 PE export resolver
    if:
      type: yara
      source: |
        rule xor_x86_export_resolver {
          strings:
            $loop = { 80 30 ?? 40 E2 FA }
            $resolver = "\x8b\x45\x3c\x8b\x54\x05\x78\x01\xea\x8b\x4a\x18\x8b\x5a\x20\x01\xeb" xor(1-255)
            $hash = "\xc1\xcf\x0d\x01\xc7" xor(1-255)
          condition:
            for any i in (1..#loop) : (
              for any j in (1..#resolver) : (
                @resolver[j] > @loop[i] and @resolver[j] < @loop[i] + 4096 and
                (uint8(@resolver[j]) ^ 0x8b) == uint8(@loop[i] + 2) and
                for any k in (1..#hash) : (
                  @hash[k] > @resolver[j] and @hash[k] < @resolver[j] + 128 and
                  (uint8(@hash[k]) ^ 0xc1) == uint8(@loop[i] + 2)
                )
              )
            )
        }

  - id: xor-x86-url-file-download-hash
    desc: XOR-concealed URLDownloadToFileA resolver call
    if:
      type: yara
      source: |
        rule xor_x86_url_file_download_hash {
          strings:
            $loop = { 80 30 ?? 40 E2 FA }
            $call = "\x68\x36\x1a\x2f\x70\xe8" xor(1-255)
          condition:
            for any i in (1..#loop) : (
              for any j in (1..#call) : (
                @call[j] > @loop[i] and @call[j] < @loop[i] + 4096 and
                (uint8(@call[j]) ^ 0x68) == uint8(@loop[i] + 2)
              )
            )
        }

  - id: xor-x86-winexec-hash
    desc: XOR-concealed WinExec resolver call
    if:
      type: yara
      source: |
        rule xor_x86_winexec_hash {
          strings:
            $loop = { 80 30 ?? 40 E2 FA }
            $call = "\x68\x98\xfe\x8a\x0e\xe8" xor(1-255)
          condition:
            for any i in (1..#loop) : (
              for any j in (1..#call) : (
                @call[j] > @loop[i] and @call[j] < @loop[i] + 4096 and
                (uint8(@call[j]) ^ 0x68) == uint8(@loop[i] + 2)
              )
            )
        }
