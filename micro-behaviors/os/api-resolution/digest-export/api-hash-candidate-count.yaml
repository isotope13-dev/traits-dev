defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: pe-api-hashing-indicator-single
    desc: PE API hash resolver candidate
    crit: notable
    conf: 0.86
    if:
      type: metrics
      field: pe.api_hash_resolver_request_count
      min: 1
  - id: pe-api-hashing-indicator
    desc: Multiple PE API hash resolver candidates
    crit: notable
    conf: 0.88
    if:
      type: metrics
      field: pe.api_hash_resolver_request_count
      min: 2
