defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  - id: x64-double-add-name-hash
    desc: Doubles hash and adds string bytes
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Zero-extended name byte; pointer increment; hash = hash*2+byte;
      # read next byte and loop until the NUL terminator. No seed is pinned.
      pattern: '0F B6 C9 48 8D 40 01 8D 14 51 0F B6 08 84 C9 75 ?? 3B D3'
