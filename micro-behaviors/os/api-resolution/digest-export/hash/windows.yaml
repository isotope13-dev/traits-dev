defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: djb2-hash
    desc: DJB2 hash identifier reference
    crit: notable
    conf: 0.65
    if:
      type: text
      regex: '(?i)\bdjb2(_?hash)?\b'
  - id: custom-mul-xor-rol-api-hash-loop-x86
    desc: Custom x86 multiply-XOR-rotate API hash loop
    crit: notable
    conf: 0.94
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_profiles[*].kind
      exact: multiply_xor_rotate
  - id: flattened-xor-rol-mul-api-hash-loop-x86
    desc: Flattened x86 XOR-rotate-multiply API hash loop
    crit: notable
    conf: 0.96
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_profiles[*].kind
      exact: xor_rotate_multiply_xor
  - id: ror13-byte-hash-loop-x64
    desc: x64 ROR13 byte hash loop
    crit: notable
    conf: 0.92
    arch: [x86-64]
    if:
      type: hex
      section: .text
      # movsx of one name byte, then ror by 13: the block_api name fold.
      pattern: '0F BE ?? [0-8] C1 C? 0D'
  - id: ror13-lodsb-hash-loop-x64
    desc: x64 ROR13 hash loop over export-name bytes
    crit: notable
    conf: 0.96
    arch: [x86-64]
    if:
      type: hex
      section: any
      # lodsb followed by ROR 13 and accumulator addition, as used by
      # PEB-based shellcode export walkers in nonstandard PE code sections.
      pattern: '41 C1 C? 0D AC 41 01 C?'
  - id: multiply-by-129-api-hash-loop-x64
    desc: x64 API hash loop, multiply by 129
    crit: notable
    conf: 0.94
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 45 69 ?? 81 00 00 00 [0-12] 01 ?? [0-12] EB
  - id: shift-add-33-hash-loop-x64
    desc: x64 shift/add-33 API hash loop
    crit: notable
    conf: 0.92
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: (41|44|45) (BC|BE|BF) ?? ?? ?? ?? [0-16] 44 89 (E6|F6) C1 (E6|F6) 05 44 01 (E6|F6) 44 0F B6 (E5|F5) 44 01
        (E6|F6)
  - id: shift-add-33-hash-packed-stub-x64
    desc: x64 shift-add-33 hash in packed stub
    crit: notable
    conf: 0.96
    arch: [x86-64]
    size_max: 1048576
    if:
      type: hex
      offset_range: [0, 524288]
      pattern: '41 B? ?? ?? ?? ?? [0-16] 44 89 ?? C1 E? 05 44 01 ?? 44 0F B6 ?? 41 01 ?? [0-16] 48 FF C? [0-8] 75 ??'
