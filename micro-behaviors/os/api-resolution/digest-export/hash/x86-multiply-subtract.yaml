defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: x86-multiply-15-subtract-name-byte
    desc: Multiplies hash then subtracts name byte
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: any
      # hash = hash * 15 - byte; pointer advances by one using
      # LEA -14 / SUB -15. Branch distance varies with inserted junk.
      pattern: '6B C0 0F 50 0F B6 47 FC F7 D8 01 04 24 8D 7F F2 83 EF F1 E9 ?? ?? ?? ?? [0-192] 58 80 7F FC 0A'
