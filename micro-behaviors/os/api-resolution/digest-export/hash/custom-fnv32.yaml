defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-custom-fnv32-name-hash
    desc: Custom FNV32 name-hashing routine
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # h = F8DDF5E7; h = (h ^ byte) * 01000623; return h ^ 12503F3A.
      # Ignore unrelated opaque-state arithmetic inserted around the loop.
      pattern: >-
        BF E7 F5 DD F8 [0-320] 33 CF [0-16] 69 F9 23 06 00 01
        [0-400] 81 F7 3A 3F 50 12
