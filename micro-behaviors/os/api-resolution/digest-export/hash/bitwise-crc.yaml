defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-bitwise-crc-name-fold
    desc: Bytewise CRC name folding loop
    conf: 0.98
    if:
      type: hex
      section: .text
      # Fold a signed name byte, then eight polynomial-feedback steps,
      # then advance to the next byte. The seed is deliberately unrestricted.
      pattern: '45 0F BE C9 45 31 CD 41 B9 08 00 00 00 [0-8] 45 89 EA 41 D1 EA 41 83 E5 01 41 F7 DD 45 21 E5 45 31 D5 41 FF C9 75 ?? 45 0F B6 4F 01 49 FF C7 45 84 C9 75 ??'
