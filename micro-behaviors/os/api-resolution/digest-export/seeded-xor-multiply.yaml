defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-seeded-xor-multiply-export-names
    desc: Seeded XOR/multiply PE export-name resolution
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # AddressOfNames walk, per-call seed, byte mixing, hash comparison.
      # Seeds, expected hashes, branch distances and table indexing vary.
      pattern: '45 8B 71 20 [0-32] 41 BB ?? ?? ?? ?? [0-24] 0F B6 C0 41 33 C3 44 69 D8 43 01 00 00 [0-24] 41 81 FB ?? ?? ?? ??'
