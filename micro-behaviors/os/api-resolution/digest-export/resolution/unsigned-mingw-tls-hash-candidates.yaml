defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 65536
composite_rules:
  - id: unsigned-mingw-tls-hash-candidates
    desc: Unsigned MinGW with TLS and hash candidates
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/signature/absent::unsigned
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator
    unless:
      - id: metadata/installer/product/
      - id: metadata/binary/symbols/plugin::x64dbg-plugin-export
      - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
