# Recovered x64 loader: PE export names are rotated/added byte by byte,
# compared to a requested digest, then indexed through the ordinal table.
defaults:
  platforms: [windows]
  for: [data]
traits:
  - id: x64-ror7-opaque-export-walk
    desc: ROR7 hashes opaque PE export names
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      pattern: '49 63 46 3C 46 8B 8C 30 88 00 00 00 43 8B 7C 31 20 43 8B 74 31 24 [0-24] 8A 02 48 FF C2 C1 C9 07 0F BE C0 03 C8 8A 02 84 C0 75 ?? [0-96] 43 8B 44 31 1C 0F B7 16 49 03 C6'
