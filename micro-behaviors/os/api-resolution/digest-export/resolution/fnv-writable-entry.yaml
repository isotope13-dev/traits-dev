defaults:
  platforms:
    - linux
    - windows
    - macos
  for: [elf, macho, pe]
composite_rules:
  - id: fnv-dynamic-resolution-writable-entry
    desc: FNV and dynamic imports in writable-entry PE
    crit: suspicious
    conf: 0.96
    for: [pe]
    size_min: 24576
    all:
      - id: metadata/binary/section/header::writable-entry-entropy-sparse-imports
      - id: micro-behaviors/data/checksum::fnv1a-prime-32bit-literal
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: well-known/dual-use/packaging/
