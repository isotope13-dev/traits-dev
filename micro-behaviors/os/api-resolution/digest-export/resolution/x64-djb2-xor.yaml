defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-djb2-xor-export-walk
    desc: Resolves PE exports by DJB2-XOR hash
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # PE64 export directory, names, DJB2-XOR loop, requested hash compare.
      # The final XOR key is deliberately variable.
      pattern: '46 8B A4 38 88 00 00 00 [0-112] B9 05 15 00 00 [0-24] 6B C9 21 48 8D 52 01 0F B6 C0 33 C8 0F B6 02 84 C0 75 ?? 81 F1 ?? ?? ?? ?? 3B CD'
