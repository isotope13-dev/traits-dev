defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: li-fn-macro
    desc: lazy_importer LI_FN API hashing
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: LI_FN
  - id: get-proc-by-hash
    desc: Get procedure by hash function
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)get.?proc.?by.?hash
  - id: resolve-by-hash
    desc: Resolve API by hash function
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)resolve.?by.?hash
  - id: hashed-pe-export-resolver-callsite
    desc: Manual PE export resolution by API hash
    crit: suspicious
    conf: 0.98
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_resolver_requests[*].kind
      exact: hashed_pe_export_resolution
  - id: constant-folded-api-hash-request
    desc: Static expression yields API hash request
    crit: notable
    conf: 0.97
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_resolver_requests[*].hash_source
      exact: constant_folded_memory_xor_add
  - id: hashed-ntqueryinformationprocess-resolution
    desc: NtQueryInformationProcess resolved by API hash
    crit: suspicious
    conf: 0.99
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_resolver_requests[*].resolved_name
      exact: NtQueryInformationProcess
  - id: hashed-network-stack-api-resolution
    desc: Network API resolved by name hash
    crit: suspicious
    conf: 0.97
    arch: [x86]
    if:
      type: value
      path: pe.api_hash_resolver_requests[*].resolved_library
      regex: '(?i)^(winhttp|wininet|ws2_32)\.dll$'
  - id: ror13-recv-hash-request-x64
    desc: ROR13 ws2_32 recv hash request
    crit: notable
    conf: 0.95
    arch: [x86-64]
    if:
      type: hex
      section: .text
      # mov ecx, 0x5FC8D902: the block_api ROR13 hash for ws2_32!recv,
      # passed to a PEB export resolver instead of importing recv.
      pattern: 'B9 02 D9 C8 5F'
  - id: ror13-recv-hash-request-r10d-x64
    desc: ROR13 ws2_32 recv hash request in r10d
    crit: notable
    conf: 0.97
    arch: [x86-64]
    if:
      type: hex
      section: any
      # Some x64 block_api-style resolvers pass the requested function hash
      # in r10d rather than ecx.
      pattern: '41 BA 02 D9 C8 5F'
composite_rules:
  - id: multiply-shift-xor-export-walk
    desc: PE export walk near multiply/shift/XOR mixing
    crit: notable
    conf: 0.9
    arch: [x86, x86-64]
    near_bytes: 256
    all:
      - id: metadata/binary/instruction/sequence/unspecified::multiply-shift-xor-register-sequence
      - id: micro-behaviors/os/api-resolution/manual::pe-export-table-walk
  - id: lazy-importer
    desc: Lazy importer library usage
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/os/api-resolution/lazy-importer::lazy-importer-usage
      - id: li-fn-macro
