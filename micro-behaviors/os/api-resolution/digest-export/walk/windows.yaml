defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: in-memory-order
    desc: InMemoryOrderModuleList traversal
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: InMemoryOrderModuleList
  - id: in-load-order
    desc: InLoadOrderModuleList traversal
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: InLoadOrderModuleList
  - id: in-init-order
    desc: InInitializationOrderModuleList traversal
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: InInitializationOrderModuleList
  - id: peb-ldr-list-access-x86
    desc: Direct x86 PEB loader-list access
    crit: notable
    conf: 0.92
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '64 8B ?? 30 00 00 00 [0-96] 8B ?? 0C'
  - id: pe-export-directory-walk-x86
    desc: Manual x86 PE export-directory walk
    crit: notable
    conf: 0.94
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '8B ?? 3C [0-24] 8B ?? ?? 78 [0-24] 8B ?? ?? 24 [0-24] 8B ?? ?? 1C [0-24] 8B ?? ?? 18'
  # A bounds-checking resolver may separate the PE-header, signature, and
  # export-directory reads with conditional branches.  The compact walk above
  # intentionally does not cover that safer layout.
  - id: checked-pe-export-directory-walk-x86
    desc: Checked x86 PE export-directory walk
    crit: notable
    conf: 0.96
    arch: [x86]
    if:
      type: value
      path: pe.checked_export_walk_sites[*].kind
      exact: checked_pe32_export_directory_walk
  - id: address-of-name-ordinals
    desc: Parses export ordinals to resolve APIs
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: AddressOfNameOrdinals
    unless:
      - id: micro-behaviors/os/api-resolution/manual::export-table-label
    downgrade:
      any:
        - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
        - id: metadata/lang/compiler/managed::dotnet-metadata
        - id: micro-behaviors/data/format/pe-parser::image-section-header-reference
  # A loader that pushes a protection-API name address found via its own
  # module walk, then resolves it through an indirect call, smuggles the
  # import past static import analysis. Ordinary importers call through
  # the IAT directly and never push the name address.
  - id: x86-virtualprotect-loader-walk-resolve
    desc: x86 resolves VirtualProtect through loader walk
    crit: suspicious
    conf: 0.93
    arch: [x86]
    if:
      type: yara
      source: |
        import "pe"
        rule x86_virtualprotect_loader_walk_resolve {
          strings:
            $name = "VirtualProtect"
            $resolve = { 68 ?? ?? ?? ?? FF 35 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_I386 and $name and
            for any i in (1..#resolve) : (
              for any n in (1..#name) : (
                pe.rva_to_offset(uint32(@resolve[i]+1) - pe.image_base) == @name[n]
              ) and
              for any s in pe.sections : (
                (s.characteristics & pe.SECTION_MEM_EXECUTE) != 0 and
                @resolve[i] >= s.raw_data_offset and
                @resolve[i] + 17 <= s.raw_data_offset + s.raw_data_size
              )
            )
        }
composite_rules:
  - id: peb-traversal
    desc: PEB module list traversal
    crit: notable
    conf: 0.85
    any:
      - id: in-memory-order
      - id: in-load-order
      - id: in-init-order
