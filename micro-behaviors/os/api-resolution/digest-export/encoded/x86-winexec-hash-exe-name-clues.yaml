# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - windows
  for:
  - html
  - javascript
  - text
  - data
  crit: notable
  conf: 0.98
traits:
- id: x86-winexec-hash-exe-name-clues
  desc: WinExec hash-like bytes and executable name
  if:
    type: yara
    source: "rule x86_winexec_hash_launch {\n  strings:\n    $call = { BA 98 FE 8A 0E 52 50 E8 ?? ?? ?? ?? }\n \
      \   $exe = /[a-z0-9_.-]{1,32}\\.exe/ nocase\n  condition:\n    all of them\n}\n"
