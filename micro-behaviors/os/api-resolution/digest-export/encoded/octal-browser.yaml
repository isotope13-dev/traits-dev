defaults:
  platforms: [windows]
  for: [html]
  conf: 0.99
traits:
  - id: octal-urlmon-hash-words
    desc: Octal URLDownloadToFile resolver hash
    crit: notable
    if:
      type: text
      substr: '\45\165\61\101\63\66\45\165\67\60\62\106'
  - id: octal-winexec-hash-words
    desc: Octal WinExec resolver hash
    crit: notable
    if:
      type: text
      substr: '\45\165\106\105\71\70\45\165\60\105\70\101'
