defaults:
  for: [c]
  platforms: [windows]
  crit: notable
traits:
  - id: escaped-x64-peb-load
    desc: Escaped x64 GS PEB pointer load
    if:
      type: text
      case_insensitive: true
      substr: '\x65\x48\x8b\x52\x60'
  - id: escaped-x64-ror13-export-loop
    desc: Escaped x64 export name hash loop
    if:
      type: text
      case_insensitive: true
      substr: '\xac\x41\xc1\xc9\x0d\x41\x01'
  - id: escaped-x64-export-name-table
    desc: Escaped x64 export name table lookup
    if:
      type: text
      case_insensitive: true
      substr: '\x44\x8b\x40\x20\x49'
