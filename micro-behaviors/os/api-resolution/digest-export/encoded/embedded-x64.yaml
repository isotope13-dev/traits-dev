defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
traits:
  - id: embedded-x64-peb-walk
    desc: Embedded x64 PEB module list walk
    if:
      type: hex
      section: .rdata
      pattern: '65 48 8B 52 60 3E 48 8B 52 18 3E 48 8B 52 20'
  - id: embedded-x64-export-hash-loop
    desc: Embedded x64 export name hashing loop
    if:
      type: hex
      section: .rdata
      pattern: '44 8B 40 20 49 01 D0 [0-32] AC 41 C1 C9 0D 41 01 C1 38 E0 75'
