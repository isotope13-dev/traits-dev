defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-bkdr131-export-resolver
    desc: x64 PE export walk with BKDR131 hashing
    conf: 0.99
    if:
      type: hex
      section: .data
      pattern: '48 63 41 3C [0-16] 8B 8C 08 88 00 00 00 [0-100] 45 69 D2 83 00 00 00 0F BE C0 44 03 D0 [0-16] 41 0F BA F2 1F'
  - id: x64-bkdr131-winsock-api-hashes
    desc: WSAStartup and socket BKDR131 hash loads
    conf: 0.98
    # WSAStartup=33522634, socket=26402d9f. These are API-derived
    # constants, not campaign identifiers or destination addresses.
    if:
      type: hex
      section: .data
      pattern: 'BA 34 26 52 33 [0-16] E8 ?? ?? ?? ?? [0-16] BA 9F 2D 40 26'
composite_rules:
  - id: x64-bkdr131-winsock-resolution
    desc: BKDR131 export resolver with Winsock API hashes
    conf: 0.99
    all:
      - id: x64-bkdr131-export-resolver
      - id: x64-bkdr131-winsock-api-hashes
