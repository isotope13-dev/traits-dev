# JavaScript/React Native attribution SDK callbacks used to read install
# conversion metadata before it is forwarded elsewhere.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: appsflyer-install-conversion-callback
    desc: AppsFlyer install conversion callback
    if:
      type: text
      regex: '\bappsFlyer\.onInstallConversionData\s*\('

  - id: appsflyer-get-uid-call
    desc: Reads AppsFlyer device UID
    conf: 0.9
    if:
      type: text
      regex: '\bappsFlyer\.getAppsFlyerUID\s*\('
