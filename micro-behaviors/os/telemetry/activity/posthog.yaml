traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - rust
  crit: notable
  conf: 0.94
  id: posthog-custom-host-option
  desc: PostHog custom telemetry host option
  if:
    type: text
    regex: (new\s+PostHog|PostHog\s*\()[\s\S]{0,240}\bhost\s*:\s*["']https?://
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - rust
  crit: notable
  conf: 0.94
  id: posthog-custom-host-binding
  desc: PostHog custom telemetry host binding
  if:
    type: text
    regex: (?i)\bPOSTHOG_HOST\s*=\s*["']https?://
- platforms:
  - unix
  - windows
  for:
  - rust
  crit: notable
  conf: 0.9
  id: rust-event-distinct-id-fields
  desc: Rust event and distinct_id field references
  if:
    type: text
    regex: \bevent\b.{0,240}\bdistinct_id\b
    case_insensitive: true
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.95
  id: dotnet-session-replay-start
  desc: References StartSessionReplay API name
  size_min: 10000
  if:
    type: text
    substr: StartSessionReplay
    section: .text
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.95
  id: dotnet-session-replay-stop
  desc: References StopSessionReplay API name
  size_min: 10000
  if:
    type: text
    substr: StopSessionReplay
    section: .text
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - rust
  crit: notable
  conf: 0.92
  id: posthog-telemetry-client
  desc: PostHog endpoint with telemetry API references
  all:
  - id: micro-behaviors/communications/http/services/analytics::posthog-host-reference
  any:
  - id: micro-behaviors/os/telemetry/activity::telemetry-event-identity-fields
  - id: micro-behaviors/os/telemetry/activity::rust-event-distinct-id-fields
  - id: micro-behaviors/communications/http/services/analytics::posthog-rust-capture-endpoint
  - id: micro-behaviors/os/telemetry/logging/analytics::feature-flag-lookup-reference
  - id: micro-behaviors/os/telemetry/activity::posthog-custom-host-option
  - id: micro-behaviors/os/telemetry/activity::posthog-custom-host-binding
- id: posthog-reference-exclusion
  desc: PostHog reference exclusion
  crit: exception
  conf: 1.0
  for:
  - javascript
  - typescript
  - rust
  - python
  - pe
  - dll
  platforms:
  - unix
  - windows
  any:
  - id: metadata/import/package::posthog-python-integration-import
  - id: micro-behaviors/communications/http/services/analytics::posthog-rust-capture-endpoint
  - id: micro-behaviors/os/telemetry/activity::posthog-custom-host-option
  - id: micro-behaviors/os/telemetry/activity::posthog-custom-host-binding
  - id: micro-behaviors/os/telemetry/activity::rust-event-distinct-id-fields
  - id: well-known/lib/observability/posthog::posthog-dotnet-binding-product
  - id: micro-behaviors/os/telemetry/activity::dotnet-session-replay-start
  - id: micro-behaviors/os/telemetry/activity::dotnet-session-replay-stop
  - id: micro-behaviors/os/telemetry/activity::posthog-telemetry-client
