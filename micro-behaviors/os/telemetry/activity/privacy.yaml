defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1119

traits:
- id: page-visit-url-field
  desc: Page-visit telemetry records the visited URL
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '["'']page_visit["'']\s*,\s*\{[^}]{0,160}\burl\s*:'
- id: telemetry-distinct-id-fields--uniqueid
  desc: Distinct telemetry ID fields (uniqueId)
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)telemetry.{0,80}\buniqueId\b|\buniqueId\b.{0,80}telemetry'
- id: telemetry-file-path-fields--filepath
  desc: File path telemetry fields (filePath)
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)telemetry.{0,80}\bfilePath\b|\bfilePath\b.{0,80}telemetry'
- id: telemetry-file-path-fields--directorypath
  desc: File path telemetry fields (directoryPath)
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)telemetry.{0,80}\bdirectoryPath\b|\bdirectoryPath\b.{0,80}telemetry'
- id: telemetry-workspace-path-fields--workspacepath
  desc: Workspace path telemetry fields (workspacePath)
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)telemetry.{0,80}\bworkspacePath\b|\bworkspacePath\b.{0,80}telemetry'
- id: telemetry-terminal-fields--terminalid
  desc: Terminal telemetry fields (terminalId)
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)telemetry.{0,80}\bterminalId\b|\bterminalId\b.{0,80}telemetry'
composite_rules:
- id: path-or-telemetry-field-labels
  desc: "Path field labels with optional telemetry context"
  crit: component
  conf: 0.86
  any:
  - id: micro-behaviors/os/telemetry/activity::telemetry-file-path-fields--filepath
  - id: micro-behaviors/fs/path/reference::new-file-path-label
  - id: micro-behaviors/os/telemetry/activity::telemetry-file-path-fields--directorypath
  - id: micro-behaviors/fs/path/reference::tsconfig-path-label
- id: terminal-or-shell-path-labels
  desc: "Terminal identity or shell path labels"
  crit: component
  conf: 0.86
  unless:
  - id: well-known/app/browser/google-web::official-google-web-asset
  any:
  - id: micro-behaviors/os/telemetry/activity::telemetry-terminal-fields--terminalid
  - id: micro-behaviors/fs/path/reference::shell-path-label
- id: telemetry-context-id-labels
  desc: "Telemetry page, browser, or thread identifiers"
  crit: component
  conf: 0.86
  unless:
  - id: well-known/app/browser/google-web::official-google-web-asset
  any:
  - id: micro-behaviors/os/telemetry/logging/event::telemetry-page-id-field
  - id: micro-behaviors/os/telemetry/logging/event::telemetry-browser-id-field
  - id: micro-behaviors/os/telemetry/logging/event::telemetry-thread-id-field
- id: developer-activity-telemetry-fields
  desc: Developer activity telemetry fields
  crit: component
  conf: 0.88
  needs: 2
  any:
  - id: micro-behaviors/os/telemetry/activity::path-or-telemetry-field-labels
  - id: micro-behaviors/os/telemetry/activity::telemetry-workspace-path-fields--workspacepath
  - id: micro-behaviors/os/telemetry/activity::terminal-or-shell-path-labels
  - id: micro-behaviors/os/telemetry/activity::telemetry-context-id-labels
- id: developer-activity-telemetry-events
  desc: Developer activity telemetry events
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/os/telemetry/logging/event::terminal-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::browser-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::workspace-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::file-operation-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::screenshot-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::typecheck-telemetry-events
- id: design-activity-telemetry-events
  desc: Design activity telemetry events
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/os/telemetry/logging/event::canvas-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::node-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::node-undo-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::theme-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::theme-change-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/event::style-export-telemetry-events
- id: developer-activity-instrumentation-context
  desc: "Developer activity instrumentation fields and events"
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/os/telemetry/activity::developer-activity-telemetry-fields
  - id: micro-behaviors/os/telemetry/activity::developer-activity-telemetry-events
  unless:
  - id: well-known/lib/data/posthog::posthog-telemetry-client
  - id: micro-behaviors/os/telemetry/logging/analytics::design-telemetry-forwarder
  - id: well-known/app/ai/coding-agent/kombai::kombai-extension-context
