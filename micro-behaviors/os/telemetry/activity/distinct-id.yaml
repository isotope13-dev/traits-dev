defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: distinct-id-reference
    desc: References a distinctId telemetry identifier
    crit: notable
    conf: 0.88
    if:
      type: text
      word: distinctId

composite_rules:
  - id: telemetry-identifier-reference
    desc: References distinctId or uniqueId telemetry identifiers
    crit: notable
    conf: 0.88
    any:
      - id: distinct-id-reference
      - id: micro-behaviors/os/telemetry/activity::telemetry-distinct-id-fields--uniqueid
