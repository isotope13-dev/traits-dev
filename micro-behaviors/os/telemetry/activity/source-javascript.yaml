defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
# User Activity Exfiltration

traits:
  - id: extension-tab-open-counter
    desc: Tab-open counter field reference
    crit: component
    conf: 0.9
    if:
      type: text
      substr: tabOpens
  - id: extension-tab-open-counter-write
    desc: Writes extension tab-open counter
    crit: notable
    conf: 0.98
    if:
      # Anonymous storage callbacks do not expose object-field flow facts.
      # Match the write structurally, including inside those callbacks.
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression) @target
          arguments: (arguments . (object
            (pair key: [(property_identifier) @key
                        (string (string_fragment) @key)])))) @call
          (#eq? @target "chrome.storage.local.set")
          (#eq? @key "tabOpens"))
  - id: tabs-event-field
    desc: Tab event field in extension telemetry
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'e\s*:\s*["'']tabs["'']'
  - id: extension-search-activity-fields--counter
    desc: Extension search field (search_counter)
    crit: notable
    conf: 0.94
    if:
      type: text
      word: search_counter
  - id: extension-search-activity-fields--searched
    desc: Extension search field (hasSearched)
    crit: notable
    conf: 0.94
    if:
      type: text
      word: hasSearched
  - id: extension-search-activity-fields--alive
    desc: Extension search field (Extension_Alive)
    crit: notable
    conf: 0.94
    if:
      type: text
      word: Extension_Alive

composite_rules:
  - id: extension-tab-count-post
    desc: Extension posts its accumulated new-tab count
    crit: notable
    conf: 0.96
    all:
      - id: extension-tab-open-counter
      - id: tabs-event-field
      - id: micro-behaviors/communications/http/post::fetch-post-call
    near_bytes: 2500
  - id: search-or-extension-status-labels
    desc: "Search status or extension-alive labels"
    crit: notable
    conf: 0.94
    # Omit first_search/last_search — common debounce locals in admin UIs.
    any:
      - id: micro-behaviors/os/telemetry/activity::extension-search-activity-fields--counter
      - id: micro-behaviors/os/telemetry/activity::extension-search-activity-fields--searched
      - id: micro-behaviors/os/telemetry/activity::extension-search-activity-fields--alive
  # Retention/date arithmetic is common in ordinary applications. Keep the
  # duration as a weak atom, and require the browser cookie setter plus its
  # expiration field nearby before calling it a persistent tracking cookie.
