# Neutral browser observation primitive. Its source, storage, and transfer
# context are assembled independently by collection/export consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

traits:
  - id: browsing-activity-record-fields
    desc: "Browsing duration or interaction record fields"
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)browsingData.{0,180}(activeDuration|scrollDistance|charsTyped|keywords)'
  - id: pageview-record-fields
    desc: "Visited URL, referrer, and status fields"
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bvisitedURL\s*:[\s\S]{0,160}\breferrerURL\s*:[\s\S]{0,160}\b(responseCode|statusCode)\s*:'

  # Require the visited URL/host value to be close to an upload-body
  # construction. An extension can read a request host for filtering or
  # licensing while sending unrelated state; those are not exfiltration.
