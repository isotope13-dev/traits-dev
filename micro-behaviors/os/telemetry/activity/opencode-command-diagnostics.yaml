# Plugin diagnostics expose activity without proving covert collection or export.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: opencode-shell-create-command-hook
    desc: OpenCode shell hook references command text
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'ctx\.shell\.hook\([\s\S]{0,240}create\.before[\s\S]{0,240}event\.command'

  - id: shell-guard-recent-read
    desc: Reads recent shell-guard blocks
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'ctx.rpc(GuardRpc).recent({ limit: 50 })'

  - id: shell-guard-command-rpc-output
    desc: Returns blocked command in digest RPC
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'guardLatestCommand: latestBlock?.command ?? ""'

