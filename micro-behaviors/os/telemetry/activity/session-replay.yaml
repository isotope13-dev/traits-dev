defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Replay output is meaningful telemetry, including in otherwise legitimate
  # SDKs. Require the event argument at its call site, not a loose field name.
  - id: session-snapshot-capture-call
    desc: Calls capture with a session snapshot event
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.capture\s*\(\s*["'']\$snapshot["'']\s*,'
