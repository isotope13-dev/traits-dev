defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: banner-event-report-call
    desc: Calls trackBanner with view or close
    if:
      type: symbol
      kind: call
      exact: trackBanner
      arg:
        index: 0
        kind: string
        regex: '^(view|close)$'

composite_rules:
  # The evidence establishes reporting-call vocabulary near a POST, rather
  # than proving a particular reporting call reaches that request at runtime.
  - id: extension-banner-events-with-http-post
    desc: Extension banner reporting calls beside HTTP POST
    near_bytes: 5000
    all:
      - id: banner-event-report-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
