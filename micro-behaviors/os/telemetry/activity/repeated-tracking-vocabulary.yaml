# Repeated analytics and tracking words are partial telemetry clues;
# they do not establish that data is collected or sent.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
traits:
  - id: repeated-analytics-term
    desc: Analytics term repeated in read-only data
    conf: 0.95
    count_min: 25
    if:
      type: text
      substr: analytics
      section: rdata
      case_insensitive: true
  - id: repeated-counter-term
    desc: Counter term repeated in read-only data
    conf: 0.95
    count_min: 25
    if:
      type: text
      substr: counter
      section: rdata
      case_insensitive: true
  - id: repeated-stats-term
    desc: Stats term repeated in read-only data
    conf: 0.95
    count_min: 25
    if:
      type: text
      substr: stats
      section: rdata
      case_insensitive: true
  - id: repeated-track-substring
    desc: Track substring repeated in read-only data
    conf: 0.95
    count_min: 25
    if:
      type: text
      substr: track
      section: rdata
      case_insensitive: true
composite_rules:
  - id: repeated-tracking-vocabulary
    desc: Binary repeats tracking-related vocabulary
    crit: component
    conf: 0.95
    any:
      - id: repeated-analytics-term
      - id: repeated-counter-term
      - id: repeated-stats-term
      - id: repeated-track-substring
