# Fire-and-forget CLI telemetry beacons: an event payload pairing a
# device/install identifier with host facts (platform, architecture),
# co-occurring with a battery of CI environment names used to tag the event.
# Each leg is benign in disclosed product telemetry and is the exact shape a
# covert exfil beacon would reuse.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: cli-telemetry-device-field
    desc: Device id field from config object
    crit: component
    conf: 0.85
    if:
      type: text
      # device: cfg.device — an install identifier plumbed from a config
      # object into an object literal, the beacon payload shape.
      regex: '\bdevice\s*:\s*[A-Za-z_$][\w$]{0,24}\.device\b'

composite_rules:
  - id: cli-telemetry-host-facts-payload
    desc: Device id with host facts in payload
    conf: 0.8
    all:
      - id: micro-behaviors/os/telemetry/activity::cli-telemetry-device-field
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-platform-member
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-arch-content
    near_bytes: 512

  - id: cli-telemetry-beacon-markers
    desc: Telemetry payload with CI probe markers
    conf: 0.8
    all:
      - id: micro-behaviors/os/telemetry/activity::cli-telemetry-host-facts-payload
      - id: micro-behaviors/os/env/cicd::multi-ci-provider-env-refs-three-plus
