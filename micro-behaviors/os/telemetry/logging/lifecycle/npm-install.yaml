defaults:
  for:
  - package.json
  - npm
  - tar
  - zip
  - shell
  platforms:
  - unix
  - windows
traits:
- id: install-hook-fetches-remote-uuid
  desc: Curl requests a remote UUID API
  crit: notable
  conf: 0.96
  for:
  - shell
  if:
    type: text
    regex: (?i)\bcurl\b[^\n]{0,100}https?://[A-Za-z0-9.-]{1,60}/(api/)?version4\b
- id: install-hook-builds-os-install-event
  desc: Shell payload includes install event and OS
  crit: notable
  conf: 0.97
  for:
  - shell
  if:
    type: text
    regex: (?is)install.{0,140}properties.{0,30}os
