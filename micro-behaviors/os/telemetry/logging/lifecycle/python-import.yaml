defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-import-environment-event
    desc: Import hook records Python environment event
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((module (try_statement body: (block
          (if_statement condition: (call function: (identifier) @gate)
            consequence: (block (expression_statement (call
              function: (identifier) @emit
              arguments: (argument_list (string (string_content) @event)
                (dictionary (pair key: (string (string_content) @field)
                  value: (attribute object: (identifier) @sys
                    attribute: (identifier) @version)))))))))))
          (#eq? @gate "is_telemetry_enabled") (#eq? @emit "record_event")
          (#eq? @event "module_init") (#eq? @field "python_version")
          (#eq? @sys "sys") (#eq? @version "version"))
