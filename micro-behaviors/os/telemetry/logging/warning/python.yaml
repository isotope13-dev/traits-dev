# Suppressing urllib3's InsecureRequestWarning changes diagnostic output; it
# does not disable certificate or hostname validation. A separate verify=False
# operation is required to change TLS security behavior.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: urllib3-insecure-request-warning-suppressed
    desc: Suppresses urllib3 insecure-request warnings
    if:
      type: symbol
      kind: call
      regex: '(^|\.)disable_warnings$'
      arg:
        kind: identifier
        name: InsecureRequestWarning
