# Warning output control does not change peer authentication.
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.95
  id: urllib3-disable-warnings-call
  desc: Suppresses urllib3 warning messages
  if:
    type: symbol
    kind: call
    regex: ^(requests\.packages\.)?urllib3\.disable_warnings$
