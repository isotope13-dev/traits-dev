# Complete decode-to-warning data flow, with no other statements in the block.
# The blob, local bindings, format text, function name and source path may vary.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.99

traits:
  - id: go-base64-gzip-warning-block
    for: [go]
    desc: Go Base64/gzip block only prints warnings
    if:
      type: tree-sitter
      query: |
        ((block (statement_list
          . (short_var_declaration
            left: (expression_list . (identifier) @encoded .)
            right: (expression_list . (raw_string_literal) @blob .))
          . (short_var_declaration
            left: (expression_list . (identifier) @decoded . (identifier) @ignore1 .)
            right: (expression_list . (call_expression
              function: (selector_expression
                operand: (selector_expression operand: (identifier) @base64 field: (field_identifier) @encoding)
                field: (field_identifier) @decode)
              arguments: (argument_list . (identifier) @encoded_arg .)) .))
          . (short_var_declaration
            left: (expression_list . (identifier) @bytes_reader .)
            right: (expression_list . (call_expression
              function: (selector_expression operand: (identifier) @bytes field: (field_identifier) @new_bytes)
              arguments: (argument_list . (identifier) @decoded_arg .)) .))
          . (short_var_declaration
            left: (expression_list . (identifier) @gzip_reader . (identifier) @ignore2 .)
            right: (expression_list . (call_expression
              function: (selector_expression operand: (identifier) @gzip field: (field_identifier) @new_gzip)
              arguments: (argument_list . (identifier) @bytes_arg .)) .))
          . (if_statement !alternative
            initializer: (short_var_declaration
              left: (expression_list . (identifier) @close_error .)
              right: (expression_list . (call_expression
                function: (selector_expression operand: (identifier) @close_reader field: (field_identifier) @close)
                arguments: (argument_list) @close_args) .))
            condition: (binary_expression left: (identifier) @condition_error operator: "!=" right: (nil))
            consequence: (block (statement_list (comment)* . (expression_statement (call_expression
              function: (selector_expression operand: (identifier) @close_logger field: (field_identifier) @close_warning)
              arguments: (argument_list . (interpreted_string_literal) . (identifier) @logged_error .))) .)))
          . (short_var_declaration
            left: (expression_list . (identifier) @output . (identifier) @ignore3 .)
            right: (expression_list . (call_expression
              function: (selector_expression operand: (identifier) @io field: (field_identifier) @read_all)
              arguments: (argument_list . (identifier) @gzip_arg .)) .))
          . (expression_statement (call_expression
            function: (selector_expression operand: (identifier) @logger field: (field_identifier) @warning)
            arguments: (argument_list . (interpreted_string_literal) @format . (call_expression
              function: (identifier) @string
              arguments: (argument_list . (identifier) @output_arg .)) .))) .)) @warning_block
          (#match? @blob "^`H4sI[A-Za-z0-9+/]+=*`$")
          (#eq? @base64 "base64") (#eq? @encoding "StdEncoding") (#eq? @decode "DecodeString")
          (#eq? @bytes "bytes") (#eq? @new_bytes "NewReader")
          (#eq? @gzip "gzip") (#eq? @new_gzip "NewReader")
          (#match? @io "^(io|ioutil)$") (#eq? @read_all "ReadAll")
          (#eq? @ignore1 "_") (#eq? @ignore2 "_") (#eq? @ignore3 "_")
          (#eq? @encoded @encoded_arg) (#eq? @decoded @decoded_arg)
          (#eq? @bytes_reader @bytes_arg) (#eq? @gzip_reader @gzip_arg)
          (#eq? @close_reader @gzip_reader) (#eq? @close "Close")
          (#eq? @close_args "()")
          (#eq? @close_error @condition_error) (#eq? @close_error @logged_error)
          (#eq? @close_logger @logger) (#eq? @close_warning "Warningf")
          (#match? @logger "^(glog|klog)$") (#eq? @warning "Warningf")
          (#eq? @string "string") (#eq? @output @output_arg)
          (#match? @format "%s"))

