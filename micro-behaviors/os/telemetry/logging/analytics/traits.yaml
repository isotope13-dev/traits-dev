defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: python-analytics-report-url-assignment
    desc: Python assigns analytics report URL
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'self\.report_url\s*='

  - id: python-analytics-config-lookup
    desc: Python reads analytics configuration
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'app_config\.get\(\s*["'']analytics["'']\s*\)'

  - id: python-telemetry-os-field
    desc: Python telemetry includes OS field
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '["'']os["'']\s*:\s*os_name_val'

  - id: python-telemetry-cpu-field
    desc: Python telemetry includes CPU field
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '["'']cpu["'']\s*:\s*cpu_name_val'

  - id: python-analytics-scheduled-send
    desc: Python schedules recurring analytics send
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'handler\.post\(\s*self\.send_alive\s*,\s*(20|3600\s*\*\s*6)\s*\)'

  - id: universal-analytics-library
    desc: Universal Analytics library reference
    crit: notable
    conf: 0.82
    for: [javascript, package.json]
    if:
      type: string_literal
      exact: universal-analytics
  - id: google-analytics-tracking-id
    desc: Google Analytics tracking identifier
    crit: notable
    conf: 0.9
    for: [javascript]
    unless:
      - id: metadata/package/testing/harness/runtime/
    if:
      type: string_literal
      regex: \bUA-[0-9]{4,12}-[0-9]{1,4}\b
  - id: visitor-event-call
    desc: Analytics visitor event submission
    crit: notable
    conf: 0.8
    for: [javascript]
    if:
      type: text
      regex: visitor\.event\s*\(
  - id: avast-burger-client-factory
    desc: Avast "Burger" telemetry library
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: BurgerClientFactory
  - id: avast-burger-client
    desc: Avast "Burger" telemetry library
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: BurgerClient
  - id: avast-analytics-endpoint
    desc: Avast analytics telemetry endpoint
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: analytics\.ff\.avast\.com
    unless:
      - type: text
        regex: analytics\.ff\.avast\.com
        section: .rsrc
      - id: metadata/package/quality/
  - id: telemetry-send
    desc: Generic telemetry/analytics send message
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: analytics\.send|telemetry\.send|track\.event
  - id: exception-capture-call
    desc: Calls exception-reporting capture API
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)captureException$'
  - id: sentry-request-context-message
    desc: Sends request context through Sentry
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.setContext\s*\(\s*["'']req["''][^)]{0,80}\)\s*,\s*[\w$.]+\.captureMessage\s*\('

  # Server-side counterpart to the JavaScript capture call above: the one call
  # that turns crash reporting on. From that point every unhandled exception —
  # stack frames, local variables, environment and request context — is shipped
  # to whatever ingest endpoint the DSN names, which is why a package adding it
  # is worth seeing in a diff, and why an attacker who wants a plausible
  # outbound channel reaches for a real telemetry SDK rather than a socket.
  # Only the initialiser is matched; importing the SDK proves nothing ran.
  - id: python-crash-reporter-init
    desc: Initializes a Python crash-reporting SDK
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(sentry_sdk\.init|rollbar\.init|bugsnag\.configure)$'
  - id: hardware-id-hwid
    desc: Hardware/Unique ID in telemetry context
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: hwid
  - id: hardware-id-local-app
    desc: Hardware/Unique ID in telemetry context
    crit: notable
    conf: 0.6
    if:
      type: text
      exact: localAppHWID
composite_rules:
  - id: python-system-telemetry-payload
    desc: Python telemetry includes system profile
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-telemetry-os-field
      - id: python-telemetry-cpu-field

  - id: python-hardware-telemetry-report
    desc: Python posts configured hardware telemetry
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-analytics-report-url-assignment
      - id: python-analytics-config-lookup
      - id: python-system-telemetry-payload
      - id: python-analytics-scheduled-send
      - id: micro-behaviors/communications/http/lib/requests::requests-post

  - id: analytics-install-beacon
    desc: Embedded analytics beacon client
    crit: suspicious
    conf: 0.92
    all:
      - id: universal-analytics-library
      - id: google-analytics-tracking-id
      - id: visitor-event-call
  - id: avast-telemetry
    desc: Avast analytics telemetry detection
    crit: suspicious
    conf: 0.95
    any:
      - id: avast-burger-lib
      - id: avast-analytics-endpoint
  - id: general-telemetry
    desc: General telemetry or tracking capability
    crit: notable
    conf: 0.8
    all:
      - id: telemetry-send
      - id: hardware-id-context
  - id: avast-burger-lib
    desc: Avast "Burger" telemetry library
    crit: notable
    conf: 0.9
    any:
      - id: avast-burger-client-factory
      - id: avast-burger-client
  - id: hardware-id-context
    desc: Hardware/Unique ID in telemetry context
    crit: notable
    conf: 0.6
    any:
      - id: hardware-id-hwid
      - id: hardware-id-local-app
