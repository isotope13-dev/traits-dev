defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, scripts, source, text]

traits:
  - id: microsoft-events-telemetry-host
    desc: Microsoft browser-events telemetry host
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'events.data.microsoft.com'

  - id: microsoft-onecollector-telemetry-name
    desc: Microsoft OneCollector telemetry name
    crit: notable
    conf: 0.96
    if:
      type: text
      word: OneCollector

composite_rules:
  - id: microsoft-canary-telemetry-target-group
    desc: Groups Microsoft and canary telemetry targets
    crit: notable
    conf: 0.99
    needs: 2
    any:
      - id: microsoft-events-telemetry-host
      - id: microsoft-onecollector-telemetry-name
      - id: micro-behaviors/communications/url/host/oob::canarytokens-service-reference

