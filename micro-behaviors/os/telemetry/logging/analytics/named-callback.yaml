defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: telemetry-data-object-call
    desc: Telemetry-style call receives data object
    conf: 0.9
    if:
      type: text
      # Generic sendResponse({ data: ... }) is ordinary browser-extension IPC.
      # Require the callee name itself to identify telemetry or usage reporting.
      regex: '(?i)\b(collect|track|report|send)(Metric|Telemetry|Usage)\w*\(\s*\{\s*data:'

