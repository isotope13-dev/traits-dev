defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1119

traits:
- id: sentry-worker-identity-bridge
  desc: Sentry worker identity bridge
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'set-sentry-identity|applyWorkerSentryIdentity|initWorkerSentry'
- id: telemetry-store-routine-label
  desc: "Telemetry storage routine name"
  crit: notable
  conf: 0.92
  if:
    type: text
    word: storeTelemetryData
- id: design-telemetry-forwarder
  desc: Design telemetry event forwarder
  crit: notable
  conf: 0.92
  if:
    type: text
    # Product design/IDE agents often buffer PostHog-shaped property bags
    # (`posthogProperties`) without embedding posthog.com in the same chunk.
    regex: 'telemetry:track|ctx\.tracer\.posthog\.capture|posthogProperties\s*='
composite_rules:
- id: sentry-identity-context
  desc: "Sentry endpoint and identity context"
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/communications/http/telemetry::sentry-ingest-dsn
  any:
  - id: micro-behaviors/os/telemetry/logging/analytics::sentry-worker-identity-bridge
  - id: metadata/file/string/telemetry::telemetry-user-identity-fields
- id: worker-analytics-event-context
  desc: "Analytics interface with worker or event context"
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/telemetry/logging/analytics::design-telemetry-forwarder
  any:
  - id: micro-behaviors/os/telemetry/activity::design-activity-telemetry-events
  - id: micro-behaviors/os/telemetry/logging/analytics::sentry-worker-identity-bridge
  - id: micro-behaviors/os/telemetry/logging/analytics::exception-capture-call
- id: design-event-analytics-context
  desc: "Design event labels with analytics context"
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/os/telemetry/logging/analytics::design-telemetry-forwarder
  - id: micro-behaviors/os/telemetry/activity::design-activity-telemetry-events
  unless:
