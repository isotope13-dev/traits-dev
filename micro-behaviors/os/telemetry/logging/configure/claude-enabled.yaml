# SDK-defined switches are configuration, not evidence of a completed export.
# Facts expose literals and calls, but not enabled object fields/assignments as
# a queryable setting. Syntax is needed to reject comments and quoted examples.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: node-claude-telemetry-enabled
    desc: Enables Claude Code telemetry
    if:
      type: tree-sitter
      query: |
        ([(pair key: [(property_identifier) @key (string (string_fragment) @key)]
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (variable_declarator name: (identifier) @key
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (assignment_expression
            left: [(identifier) @key
              (member_expression property: (property_identifier) @key)
              (subscript_expression index: (string (string_fragment) @key))]
            right: [(string (string_fragment) @value) (number) @value (true) @value])]
          (#eq? @key "CLAUDE_CODE_ENABLE_TELEMETRY")
          (#match? @value "^(1|true)$"))

  - id: node-claude-enhanced-telemetry-enabled
    desc: Enables Claude enhanced telemetry beta
    if:
      type: tree-sitter
      query: |
        ([(pair key: [(property_identifier) @key (string (string_fragment) @key)]
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (variable_declarator name: (identifier) @key
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (assignment_expression
            left: [(identifier) @key
              (member_expression property: (property_identifier) @key)
              (subscript_expression index: (string (string_fragment) @key))]
            right: [(string (string_fragment) @value) (number) @value (true) @value])]
          (#eq? @key "CLAUDE_CODE_ENHANCED_TELEMETRY_BETA")
          (#match? @value "^(1|true)$"))
