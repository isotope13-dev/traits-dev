# The OpenAI incident report publishes these monitoring request/row fields.
# These are configuration operations, not proof of unauthorized tampering.
# Assignment/conditional nodes exclude comments and quoted code examples.
defaults:
  platforms: [unix, windows]
  for: [python, ruby]
  crit: notable
  conf: 0.95

traits:
  - id: indexed-ping-recipients-cleared
    desc: Assigns empty ping notification recipients
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        \[["']ping_recipients["']\]\s*=\s*(\[\s*\]|\(\s*\))$

  - id: indexed-page-recipients-cleared
    desc: Assigns empty paging notification recipients
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        \[["']page_recipients["']\]\s*=\s*(\[\s*\]|\(\s*\))$

  - id: indexed-no-notify-enabled
    desc: Enables notification suppression field
    if:
      type: tree-sitter
      kind: assignment
      regex: >-
        \[["']no_notify["']\]\s*=\s*(?i:true)$

  - id: python-reject-notifying-row
    desc: Raises unless row suppresses notifications
    for: [python]
    if:
      type: tree-sitter
      kind: conditional
      regex: >-
        ^if\s+[^\n]{1,64}\bno_notify\b.{0,3}\s+is not\s+True:\s+raise\b

  - id: ruby-reject-notifying-row
    desc: Raises unless row suppresses notifications
    for: [ruby]
    if:
      type: tree-sitter
      kind: conditional
      regex: >-
        ^unless\s+[^\n]{1,64}\bno_notify\b.{0,3}\s*==\s*true\s+raise\b

composite_rules:
  - id: ping-recipients-cleared
    desc: Assigns empty ping notification recipients
    for: [python, ruby, javascript, typescript]
    any:
      - id: indexed-ping-recipients-cleared
      - id: javascript-ping-recipients-cleared

  - id: page-recipients-cleared
    desc: Assigns empty paging notification recipients
    for: [python, ruby, javascript, typescript]
    any:
      - id: indexed-page-recipients-cleared
      - id: javascript-page-recipients-cleared

  - id: no-notify-enabled
    desc: Enables notification suppression field
    for: [python, ruby, javascript, typescript]
    any:
      - id: indexed-no-notify-enabled
      - id: javascript-no-notify-enabled
