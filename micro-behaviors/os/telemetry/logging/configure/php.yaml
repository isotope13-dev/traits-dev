defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-log-config-disabled
    desc: PHP config disables logging or audit flag
    conf: 0.97
    if:
      type: tree-sitter
      node: array_element_initializer
      regex: '(?i)["''](log(ging)?|audit(_log)?)["'']\s*=>\s*false\b'
