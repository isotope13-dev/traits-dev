defaults:
  platforms: [windows]
  for: [xml, csharp, powershell, python]

traits:
  - id: clr-assembly-usage-log-disabled
    desc: Disables CLR assembly usage logging in config
    crit: notable
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '<NGenAssemblyUsageLog\b[^>]{0,80}\benabled\s*=\s*["'']0["'']'
