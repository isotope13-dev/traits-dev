defaults:
  platforms: [fortios, unix]
  for: [scripts, source]

traits:
  # Clearing diagnostic crash records is also routine administration. This
  # command reference can occur in audit records; it proves no concealment.
  - id: fortios-crashlog-clear-command
    desc: References FortiOS crash-log clear command
    crit: notable
    conf: 0.96
    platforms: [fortios, unix, windows]
    for: [scripts, source, text, json]
    if:
      type: text
      regex: 'diagnose\s+debug\s+crashlog\s+clear\b'
