defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.97
traits:
  - id: console-log-token-property
    desc: Console logs a token property
    crit: notable
    # Retain the exposure, but lower its urgency in a manually activated
    # credential test. A test-directory name alone is insufficient.
    downgrade:
      all:
        - id: metadata/package/testing/harness/fixture::manual-credential-test-instructions
        - id: metadata/path/directory::test-directory-component
    unless:
      - id: metadata/package/testing/harness/dtslint::expect-type-assertion-comments
      - id: metadata/package/testing/harness/dtslint::definitelytyped-tests-source-path
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (identifier) @console
            property: (property_identifier) @method)
          arguments: (arguments
            . (string (string_fragment) @label)
            . (member_expression property: (property_identifier) @property)))
          (#eq? @console "console")
          (#match? @method "^(log|info|debug|warn|error)$")
          (#match? @label "(?i)token")
          (#match? @property "(?i)^(token|accessToken|authToken|refreshToken)$"))

  - id: console-log-password-property
    desc: Console logs a password property
    downgrade:
      any:
        - id: metadata/package/testing/corpus/security-tests/labeled-verdict::annotated-security-query-test
    if:
      type: text
      regex: 'console\.log\s*\(\s*\{[^}]{0,80}\bpassword\s*[,}:]'
      exclude_comments: true
