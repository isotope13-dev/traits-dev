defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.97
traits:
  - id: console-log-token-property
    desc: Console logs a token property
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (identifier) @console
            property: (property_identifier) @method)
          arguments: (arguments
            . (string (string_fragment) @label)
            . (member_expression property: (property_identifier) @property)))
          (#eq? @console "console")
          (#match? @method "^(log|info|debug|warn|error)$")
          (#match? @label "(?i)token")
          (#match? @property "(?i)^(token|accessToken|authToken|refreshToken)$"))
