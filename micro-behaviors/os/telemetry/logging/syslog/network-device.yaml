# IOS XR's evsyslog path is a platform-specific logging surface. Referencing it
# is not malicious by itself; evasion rules combine it with selective delivery
# control flow.
defaults:
  platforms: [unix, appliance]
  for: [c, cpp, elf, so]

traits:
  - id: ios-xr-evsyslog-library
    desc: References the Cisco IOS XR evsyslog library
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '^(lib)?evsyslog(\.so(\.[0-9]+)*)?$'
