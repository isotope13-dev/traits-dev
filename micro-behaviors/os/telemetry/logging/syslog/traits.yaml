# POSIX syslog API calls in native source.  These are neutral logging
# capabilities; intent-specific log tampering belongs in objectives/.
defaults:
  crit: notable
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: openlog-call
    desc: Opens a POSIX syslog session
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: openlog
    unless:
      - type: path
        substr: testdata/does-nothing/

  - id: syslog-write-call
    desc: Writes a message to POSIX syslog
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: syslog
    unless:
      - type: path
        substr: testdata/does-nothing/

  - id: closelog-call
    desc: Closes a POSIX syslog session
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: closelog
    unless:
      - type: path
        substr: testdata/does-nothing/

composite_rules:
  - id: syslog-session
    desc: Opens writes and closes a POSIX syslog session
    conf: 0.98
    all:
      - id: openlog-call
      - id: syslog-write-call
      - id: closelog-call
