defaults:
  platforms: [linux]
  for: [shell]
  crit: notable

traits:
  - id: ncentral-temp-shell-program
    desc: Syslog launches hidden N-central temp script
    for: [shell, text]
    crit: suspicious
    if:
      type: text
      regex: 'program\(\s*["'']/bin/(ba)?sh\s+/var/opt/n-central/tmp/\.[^"''\s]{1,60}'
      exclude_comments: true
  - id: ncentral-config-stage-write
    desc: Writes staged N-central syslog configuration
    if:
      type: text
      regex: '>\s*/var/opt/n-central/tmp/syslog/ncod_network\.conf\b'
      exclude_comments: true
  - id: ncentral-privileged-config-install
    desc: Runs privileged N-central syslog installer
    if:
      type: symbol
      kind: call
      exact: sudo
      args:
        - index: 0
          kind: identifier
          name: -n
        - index: 1
          kind: identifier
          name: /opt/nable/usr/sbin/nable_wrapper.pl
        - index: 2
          kind: identifier
          name: installSyslogConfig
