defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: npm-script-prints-awslogs-routing-fields
    desc: npm script prints AWS log-routing fields
    if:
      type: value
      path: scripts.*
      regex: 'console\.log[\s\S]{0,200}awslogs-group[\s\S]{0,120}awslogs-stream'
