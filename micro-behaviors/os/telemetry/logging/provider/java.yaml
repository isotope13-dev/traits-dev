# JDK platform logging (JEP 264): a library registers a System.LoggerFinder
# so java.lang.System.getLogger() is backed by that implementation.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  crit: notable
  conf: 0.94

traits:
  - id: logger-finder-superclass
    desc: Extends Java System.LoggerFinder
    for: [class, java_class]
    conf: 0.98
    if:
      type: value
      path: class.super_class
      exact: java/lang/System$LoggerFinder

  - id: logger-finder-spi-path
    desc: Java LoggerFinder service-loader path
    for: [jar, zip]
    conf: 0.97
    if:
      type: value
      path: archive.members[*].path
      exact: META-INF/services/java.lang.System$LoggerFinder
