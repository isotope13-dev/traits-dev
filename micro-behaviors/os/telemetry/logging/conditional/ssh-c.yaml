defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
traits:
  - id: ssh-audit-boolean-flag-guard
    desc: Boolean flag gates SSH audit logging
    conf: 0.98
    if:
      type: tree-sitter
      language: c
      query: |
        ((function_definition
           declarator: (function_declarator declarator: (identifier) @function)
           body: (compound_statement
             (if_statement condition: (parenthesized_expression
               (binary_expression
                 left: (unary_expression operator: "!" argument: (identifier) @flag)
                 operator: "||"
                 right: (binary_expression left: (identifier) @other
                   operator: "!=" right: (number_literal) @value))))))
         (#match? @function "^(do_log|auth_log)$")
         (#eq? @flag @other) (#eq? @value "1"))
