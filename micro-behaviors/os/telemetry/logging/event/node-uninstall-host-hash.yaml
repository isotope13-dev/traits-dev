defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: host-user-hash-update
    desc: Hash update combines host and user variables
    if:
      type: text
      substr: '.update(`${hostname}-${username}`)'
  - id: uninstall-machine-id-fields
    desc: Uninstall event with machine ID field
    if:
      type: text
      regex: 'machine_id\s*:\s*machineId[\s\S]{0,100}event_type\s*:\s*["'']uninstall["'']'
  - id: node-uninstall-request-body-write
    desc: Uninstall script writes request data
    if:
      type: text
      substr: 'req.write(data)'
composite_rules:
  - id: node-uninstall-host-user-hash-post-clues
    desc: Uninstall host-user hash and POST clues
    all:
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
      - id: host-user-hash-update
      - id: uninstall-machine-id-fields
      - id: node-uninstall-request-body-write
      - id: micro-behaviors/communications/http/request/verb::https-post-option-source
