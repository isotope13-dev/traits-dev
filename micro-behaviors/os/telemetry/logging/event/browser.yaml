# Browser telemetry identifiers are neutral observability fields. They remain
# notable because their appearance in a version diff can identify newly added
# tracking, but they do not by themselves establish a collection objective.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86

traits:
  - id: telemetry-page-id-field
    desc: References page telemetry identifier
    unless:
      - id: well-known/app/browser/google-web::official-google-web-asset
    if:
      type: text
      regex: '(?i)telemetry.{0,80}\bpageId\b|\bpageId\b.{0,80}telemetry'

  - id: telemetry-browser-id-field
    desc: References browser telemetry identifier
    if:
      type: text
      word: browserId

  - id: telemetry-thread-id-field
    desc: References thread telemetry identifier
    if:
      type: text
      word: threadId
