# Neither hashing nor a telemetry API beside an agent path proves activity
# collection. Keep the bounded API/path context as a neutral observation.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: agent-paths-near-hash-telemetry
    desc: Agent paths near hashing and telemetry
    crit: notable
    conf: 0.92
    near_bytes: 2048
    all:
      - id: micro-behaviors/crypto/hash/hmac::node-createhmac-text-call
      - id: micro-behaviors/os/telemetry/logging/event::log-event-identifier
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/communications/http/request/json::http-post-json
    any:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-session-projects-directory
      - id: micro-behaviors/fs/path/agent-config/directory::codex-config-directory
      - id: micro-behaviors/fs/path/agent-config/directory::gemini-config-directory
