defaults:
  platforms: [unix, windows]
  for: [go]
  crit: baseline

traits:
  - id: go-logger-write-call
    desc: Go writes a message through a logger
    conf: 0.94
    if:
      type: text
      regex: '\b(klog\.(Warning|Info)f|log\.(Print|Printf|Println))\s*\('

  - id: go-error-log-credential-argument
    desc: Go logger formats a credential-named argument
    crit: notable
    conf: 0.90
    if:
      type: text
      regex: '(?i)\bk?log(ger)?\.Errorf\([^;\n]{0,80},\s*\w*(token|secret|cred|password)'
