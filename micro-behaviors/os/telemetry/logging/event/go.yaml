defaults:
  platforms: [unix, windows]
  for: [go]
  crit: baseline

traits:
  - id: go-logger-write-call
    desc: Go writes a message through a logger
    conf: 0.94
    if:
      type: text
      regex: '\b(klog\.(Warning|Info)f|log\.(Print|Printf|Println))\s*\('

  - id: go-error-log-credential-argument
    desc: Go error log formats credential value
    crit: notable
    conf: 0.90
    if:
      type: text
      # The match ends on the argument (optional selector field) so name/id
      # fields can be excluded without dropping a later value argument.
      case_insensitive: true
      regex: '\bk?log(ger)?\.Errorf\([^;\n]{0,80},\s*\w*(token|secret|cred|password)(\.\w+)?'
    not:
      - regex: '\.(Name|Namespace)$'
      - regex: '\.(ID|Type|Kind|UID)$'
