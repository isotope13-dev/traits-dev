defaults:
  platforms: [unix, windows]
  for: [python]

# Bind the header copy and its consumer structurally, including nested request
# callbacks. Adjacent statements prevent intervening overwrites or redaction
# from establishing a transfer of the original mapping. The call name identifies
# a logging sink; this does not prove how its implementation stores or sends it.
traits:
  - id: python-request-headers-log-sink
    desc: Passes copied request headers into logging
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        (block
          (expression_statement
            (assignment
              left: (identifier) @payload
              right: (dictionary
                (pair value: (call
                  function: (identifier) @copy
                  arguments: (argument_list
                    (attribute object: (identifier) @request attribute: (identifier) @headers)))))))
          .
          (expression_statement
            (call function: (attribute attribute: (identifier) @sink)
              arguments: (argument_list (identifier) @sent)))
          (#eq? @copy "dict")
          (#eq? @request "request")
          (#eq? @headers "headers")
          (#eq? @payload @sent)
          (#match? @sink "^(send_log|log|debug|info|warning|error|critical)$")) @match
        
        (block
          (expression_statement
            (assignment
              left: (identifier) @copied
              right: (call function: (identifier) @copy
                arguments: (argument_list
                  (attribute object: (identifier) @request attribute: (identifier) @headers)))))
          .
          (expression_statement
            (assignment left: (identifier) @payload
              right: (dictionary (pair value: (identifier) @stored))))
          .
          (expression_statement
            (call function: (attribute attribute: (identifier) @sink)
              arguments: (argument_list (identifier) @sent)))
          (#eq? @copy "dict")
          (#eq? @request "request")
          (#eq? @headers "headers")
          (#eq? @copied @stored)
          (#eq? @payload @sent)
          (#match? @sink "^(send_log|log|debug|info|warning|error|critical)$")) @match
        
        (call function: (attribute attribute: (identifier) @sink)
          arguments: (argument_list
            (call function: (identifier) @copy
              arguments: (argument_list
                (attribute object: (identifier) @request attribute: (identifier) @headers))))
          (#eq? @copy "dict")
          (#eq? @request "request")
          (#eq? @headers "headers")
          (#match? @sink "^(send_log|log|debug|info|warning|error|critical)$")) @match
