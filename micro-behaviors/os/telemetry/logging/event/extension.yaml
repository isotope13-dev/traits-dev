# Browser-extension analytics event fields. These names are generic telemetry
# payload fields, not Google Apps Script-specific indicators.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: extension-track-event-marker
    desc: Extension TRACK_EVENT marker
    if:
      type: text
      word: TRACK_EVENT

  - id: extension-event-category-field
    desc: Extension analytics category field
    if:
      type: text
      word: eventCategory

  - id: extension-event-action-field
    desc: Extension analytics action field
    if:
      type: text
      word: eventAction

  - id: extension-event-label-field
    desc: Extension analytics label field
    if:
      type: text
      word: eventLabel

  - id: extension-installation-id-field
    desc: Extension installation identifier field
    if:
      type: text
      word: installationId

  - id: extension-lifecycle-telemetry-fields
    desc: UUID timestamp and reason telemetry fields
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'uuid[A-Z]\w{0,40}[\s\S]{0,900}dateTime[\s\S]{0,300}reason'

  - id: extension-analytics-event-field
    # Component, and described for what it is: a lone `event` key or ES6
    # shorthand property in an object literal. At notable it announced
    # "extension analytics" on every event-driven Node program that builds a
    # record with an `event` field -- a local PTY daemon's dispatch envelope
    # was enough. One generic field name is not a behaviour; the analytics
    # inference belongs to extension-analytics-event-payload below, which
    # pairs it with TRACK_EVENT / category / action markers.
    desc: Object literal has a bare event field
    crit: component
    if:
      type: text
      regex: '(?m)^\s*event\s*[,}:]'

composite_rules:
  - id: extension-analytics-event-payload
    desc: Extension analytics event fields
    crit: notable
    any:
      - id: extension-track-event-marker
      - id: micro-behaviors/os/telemetry/logging/event::track-event-method
      - id: extension-event-category-field
      - id: extension-event-action-field
      - id: extension-event-label-field

  - id: extension-analytics-installation-payload
    desc: Extension analytics payload with installation identity
    crit: notable
    all:
      - id: extension-installation-id-field
      - id: extension-analytics-event-field
      - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace
