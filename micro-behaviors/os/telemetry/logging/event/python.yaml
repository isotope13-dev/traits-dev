defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-package-artifact-log
    desc: Writes logs into package artifact directory
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: logging.FileHandler
      arg:
        index: 0
        regex: '^/(packages|dist|build)/'

  - id: python-print-replacement
    desc: Replaces the global print function
    conf: 0.95
    if:
      type: text
      regex: 'builtins\.print\s*=\s*[A-Za-z_]\w*'

  - id: python-credential-error-log
    desc: Error call logs credential variable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.error\s*\([^;\n]{0,80}%s[^;\n]{0,24},\s*\w*(token|secret|cred|password)\w*'
