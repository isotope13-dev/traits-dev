defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-package-artifact-log
    desc: Writes logs into package artifact directory
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: logging.FileHandler
      arg:
        index: 0
        regex: '^/(packages|dist|build)/'

  - id: python-print-replacement
    desc: Replaces the global print function
    conf: 0.95
    if:
      type: text
      regex: 'builtins\.print\s*=\s*[A-Za-z_]\w*'
