defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-debug-notice-session-password
    desc: Debug notice exposes session password
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment left: (attribute object: (identifier) @session attribute: (identifier) @auth)
            right: (tuple (attribute) (identifier) @password)))
          (if_statement condition: (identifier) @debug consequence: (block
            (expression_statement (call function: (identifier) @notice arguments: (argument_list
              (string (interpolation expression: (identifier) @password2)))))))))
          (#eq? @auth "auth") (#match? @password "(?i)password") (#eq? @password @password2)
          (#match? @debug "(?i)debug") (#eq? @notice "notice"))
