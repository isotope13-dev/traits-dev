# Exchange audit-log shapes associated with automated mailbox collection.
# The individual fields are neutral log facts; the suspicious composites
# require the unusual client and successful message-content access together.
defaults:
  platforms: [unix, windows]
  for: [json, text]
  attack: T1114.002

traits:
  - id: mailitems-accessed-operation
    desc: Exchange MailItemsAccessed audit operation
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']Operation["'']\s*:\s*["'']MailItemsAccessed["'']'
  - id: mailitems-access-bind
    desc: Exchange message Bind access type
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']Name["'']\s*:\s*["'']MailAccessType["'']\s*,\s*["'']Value["'']\s*:\s*["'']Bind["'']'
  - id: rest-firefox-actor-record
    desc: "REST/Firefox actor-information record"
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']ActorInfoString["'']\s*:\s*["''].{0,240}Client=REST;.{0,240}Firefox/[0-9.]+'
composite_rules:
  - id: mail-access-rest-firefox-record
    desc: "Mail access audit record with REST Firefox"
    crit: suspicious
    conf: 0.98
    attack: T1114.002,T1078
    all:
      - id: micro-behaviors/os/telemetry/logging/event::mailitems-accessed-operation
      - id: micro-behaviors/os/telemetry/logging/event::mailitems-access-bind
      - id: micro-behaviors/os/telemetry/logging/event::rest-firefox-actor-record
    near_bytes: 1800
  - id: mailitems-access-application-api
    desc: "Mail Bind audit record with app and API IDs"
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/telemetry/logging/event::mailitems-accessed-operation
      - id: micro-behaviors/os/telemetry/logging/event::mailitems-access-bind
      - id: micro-behaviors/data/serialize/schema-object::api-id-guid-value
      - id: micro-behaviors/data/serialize/schema-object::client-app-guid-value
    near_bytes: 1800
