# A debug label alone establishes neither secret content nor credential theft.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.94

traits:
  - id: android-secret-assignment-log-call
    desc: Android log call with secret assignment label
    if:
      type: text
      # The credential word may end a longer name (authToken) and may take a
      # short suffix (credentials, password). Letters after that suffix are
      # another identifier (checkCredentialsAndVersion:), not a value separator.
      regex: '(?i)Log\.[vdiew]\([^;\n]{0,40}\w*(token|cred(ential)?s?|secret|passw(or)?d)["'']?\s*[:=]'

  - id: android-stealer-tag-log-call
    desc: Android log call with stealer tag
    if:
      type: text
      regex: '(?i)Log\.[vdiew]\([^;\n]{0,40}stealer\w*["'']\s*,'

composite_rules:
  - id: android-secret-label-log-call
    desc: Android log call with secret-like label
    crit: notable
    conf: 0.94
    any:
      - id: android-secret-assignment-log-call
      - id: android-stealer-tag-log-call
