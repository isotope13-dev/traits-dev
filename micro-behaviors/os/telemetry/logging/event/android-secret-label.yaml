# A debug label alone establishes neither secret content nor credential theft.
defaults:
  platforms: [android]
  for: [java, kotlin]
traits:
  - id: android-secret-label-log-call
    desc: Android log call with secret-like label
    # A visible debug statement is a capability, not concealed theft: the
    # provider-read-plus-log consumer supplies acquisition evidence.
    # The matcher keys on a credential-named LABEL with a value
    # separator (`Log.d(TAG, "token=" + authToken)`); protocol prose that
    # merely mentions the words ("no recipient session", "no credentials,
    # falling back") must not match, and bare "session"/"auth" matched every
    # messaging and crypto implementation's debug log, so they only count
    # inside a longer credential word (sessionToken, authToken).
    crit: notable
    conf: 0.94
    if:
      type: text
      # The credential word may end a longer name (authToken) and may take a
      # short suffix (credentials, password). Letters after that suffix are
      # another identifier (checkCredentialsAndVersion:), not a value separator.
      regex: '(?i)Log\.[vdiew]\([^;\n]{0,40}\w*(token|cred(ential)?s?|secret|passw(or)?d)["'']?\s*[:=]'

