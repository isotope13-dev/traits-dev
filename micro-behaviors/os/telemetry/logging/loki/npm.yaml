# pino-loki transport configuration atoms. Neutral alone; objectives pair them
# with opt-out defaults and hardcoded host fallbacks to convict silent relays.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: pino-loki-transport-target
    desc: Configures pino-loki transport target
    if:
      type: text
      regex: 'target:\s*["'']pino-loki["'']'

  - id: loki-shipping-opt-out-default-true
    desc: Loki shipping env defaults to enabled
    if:
      type: text
      regex: 'process\.env\.LOG_LOKI_ENABLED\s*\|\|\s*["'']true["'']'

  - id: loki-silence-errors-opt-out-default-true
    desc: Loki silence-errors env defaults to true
    if:
      type: text
      regex: 'process\.env\.LOG_LOKI_SILENCE_ERRORS\s*\|\|\s*["'']true["'']'

  - id: loki-host-hardcoded-env-fallback
    desc: Loki host env chain with literal fallback
    if:
      type: text
      regex: 'LOG_LOKI_HOST\s*\|\|\s*["''][\w.-]+\.[a-z]{2,}["'']'

  - id: loki-shipping-ci-jest-gated
    desc: Loki shipping gated on CI and Jest
    crit: suspicious
    conf: 0.92
    attack: T1497
    if:
      type: text
      regex: 'lokiEnabled[\s\S]{0,120}!isCI\s*&&\s*!isJest'

composite_rules:
  - id: pino-loki-default-remote-sink-config
    desc: pino-loki transport with opt-out remote defaults
    crit: suspicious
    conf: 0.94
    attack: T1041
    all:
      - id: pino-loki-transport-target
      - id: loki-shipping-opt-out-default-true
      - id: loki-host-hardcoded-env-fallback
      - id: loki-silence-errors-opt-out-default-true
