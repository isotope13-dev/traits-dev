# Archive co-occurrence does not bind the hook to this writer or establish theft.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
composite_rules:
  - id: postinstall-global-agent-content-export
    desc: npm hook accompanies global conversation export
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: default-global-agent-content-export
