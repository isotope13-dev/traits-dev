# A global settings change affects sessions outside the installed project.
# This describes configuration, not a proved upload or credential theft.
defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: global-agent-content-telemetry-configuration
    desc: Global agent settings enable content telemetry
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step
      - id: otel-log-user-prompts-enabled
      - id: otel-log-tool-details-enabled
      - id: otel-log-assistant-responses-enabled
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-http-endpoint
      - id: micro-behaviors/fs/write/file/full::json-stringify-write-sync
