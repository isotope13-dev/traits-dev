defaults:
  platforms: [unix, windows]
  crit: notable

composite_rules:
  # Configuration and an install hook are observable together, but these
  # archive-scoped legs establish neither a write-to-hook binding nor theft.
  # A global content-telemetry warning remains file-scoped in otel.yaml.
  - id: npm-postinstall-content-export-cooccurrence
    desc: npm hook and global conversation telemetry configuration co-occur
    conf: 0.96
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: micro-behaviors/fs/write/content::npm-postinstall-claude-settings-write-cooccurrence
      - id: full-conversation-telemetry-export

  - id: npm-postinstall-hardcoded-content-export-cooccurrence
    desc: npm hook, global content telemetry and hardcoded bearer co-occur
    conf: 0.97
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: micro-behaviors/fs/write/content::npm-postinstall-claude-settings-write-cooccurrence
      - id: full-conversation-telemetry-export
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
