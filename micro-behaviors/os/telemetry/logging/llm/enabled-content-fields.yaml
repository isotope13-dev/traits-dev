# SDK-defined fields and enabled values, parsed as object entries, variable
# bindings or assignments. Quoted documentation, disabled fields and three
# copies of one field do not qualify.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: node-user-prompt-content-logging-enabled
    desc: Enables user-prompt content telemetry
    if:
      type: tree-sitter
      query: |
        ([(pair key: [(property_identifier) @key (string (string_fragment) @key)]
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (variable_declarator name: (identifier) @key
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (assignment_expression
            left: [(identifier) @key
              (member_expression property: (property_identifier) @key)
              (subscript_expression index: (string (string_fragment) @key))]
            right: [(string (string_fragment) @value) (number) @value (true) @value])]
          (#eq? @key "OTEL_LOG_USER_PROMPTS") (#match? @value "^(1|true)$"))
  - id: node-assistant-content-logging-enabled
    desc: Enables assistant-response content telemetry
    if:
      type: tree-sitter
      query: |
        ([(pair key: [(property_identifier) @key (string (string_fragment) @key)]
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (variable_declarator name: (identifier) @key
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (assignment_expression
            left: [(identifier) @key
              (member_expression property: (property_identifier) @key)
              (subscript_expression index: (string (string_fragment) @key))]
            right: [(string (string_fragment) @value) (number) @value (true) @value])]
          (#eq? @key "OTEL_LOG_ASSISTANT_RESPONSES") (#match? @value "^(1|true)$"))
  - id: node-tool-content-logging-enabled
    desc: Enables tool-detail content telemetry
    if:
      type: tree-sitter
      query: |
        ([(pair key: [(property_identifier) @key (string (string_fragment) @key)]
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (variable_declarator name: (identifier) @key
            value: [(string (string_fragment) @value) (number) @value (true) @value])
          (assignment_expression
            left: [(identifier) @key
              (member_expression property: (property_identifier) @key)
              (subscript_expression index: (string (string_fragment) @key))]
            right: [(string (string_fragment) @value) (number) @value (true) @value])]
          (#eq? @key "OTEL_LOG_TOOL_DETAILS") (#match? @value "^(1|true)$"))
  - id: node-opt-out-global-agent-settings-writer
    desc: Env skip guard before Claude settings rewrite
    if:
      type: tree-sitter
      query: |
        ((function_declaration body: (statement_block
          (if_statement condition: (parenthesized_expression (binary_expression
            left: (member_expression object: (member_expression
              object: (identifier) @process property: (property_identifier) @env)
              property: (property_identifier))
            operator: "===" right: (string (string_fragment) @disabled)))
            consequence: (statement_block (return_statement)))
          (expression_statement (assignment_expression
            left: (member_expression object: (identifier) property: (property_identifier) @setting)
            right: (_))))) @writer
          (#eq? @process "process") (#eq? @env "env") (#eq? @disabled "1")
          (#eq? @setting "env")
          (#match? @writer "\\.claude") (#match? @writer "settings\\.json")
          (#match? @writer "writeFileSync") (#match? @writer "JSON\\.stringify"))
composite_rules:
  - id: node-conversation-content-logging-enabled
    desc: Enables prompt, response and tool-detail telemetry
    all:
      - id: node-user-prompt-content-logging-enabled
      - id: node-assistant-content-logging-enabled
      - id: node-tool-content-logging-enabled
