defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: C0069

traits:
  - id: agent-session-branch-capture
    desc: Reads an AI agent session branch
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bsessionManager\s*\.\s*getBranch\s*\(\s*\)'

  - id: agent-session-raw-transcript-field
    desc: Serializes a raw AI agent transcript entry
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\braw_data\s*:\s*JSON\.stringify\s*\('

  - id: agent-session-tool-input-field
    desc: Serializes AI agent tool input
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\btool_input\s*:\s*JSON\.stringify\s*\('

  - id: agent-session-user-field
    desc: Agent telemetry user identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(user_email|user_name)\s*:'

  - id: agent-session-device-field
    desc: Agent telemetry device identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(device_name|device_id)\s*:'

  - id: agent-session-repository-field
    desc: Agent telemetry repository identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(repo_url|repo_name|cwd)\s*:'

  - id: agent-session-git-field
    desc: Agent telemetry revision identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(git_branch|git_commit|project_hash)\s*:'

  - id: agent-telemetry-config-url
    desc: Environment-backed telemetry URL setting
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\btelemetry\w*\s*:\s*process\.env\.[A-Z][A-Z0-9_]*\s*\?\?'

  - id: agent-telemetry-default-https
    desc: HTTPS fallback for telemetry setting
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\?\?\s*["'']https?://'

  - id: agent-telemetry-opt-out-field
    desc: Telemetry opt-out setting field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\btelemetry\w*(off|disabled)\s*:'
      case_insensitive: true

  - id: agent-telemetry-env-disable
    desc: Environment switch disables telemetry
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'process\.env\.[A-Z][A-Z0-9_]*\s*===?\s*["'']1["'']'

  - id: deepseek-request-log-label
    desc: DeepSeek outgoing request log label
    crit: component
    conf: 0.9
    if:
      type: text
      substr: OUTGOING DEEPSEEK REQUEST

  - id: deepseek-response-log-label
    desc: DeepSeek incoming response log label
    crit: component
    conf: 0.9
    if:
      type: text
      substr: INCOMING DEEPSEEK RESPONSE

  - id: console-log-json-stringify-call
    desc: Console logs JSON stringified payload
    crit: component
    conf: 0.86
    if:
      type: text
      regex: "console\\.log\\s*\\([^\\n]{0,120}JSON\\.stringify\\s*\\("

  - id: console-log-response-text-call
    desc: Console logs response text variable
    crit: component
    conf: 0.82
    if:
      type: text
      regex: "console\\.log\\s*\\([^\\n]{0,120}\\btext\\b"

composite_rules:
  - id: agent-session-raw-tool-data
    desc: Serializes raw agent messages and tool inputs
    crit: notable
    conf: 0.96
    all:
      - id: agent-session-raw-transcript-field
      - id: agent-session-tool-input-field

  - id: agent-session-telemetry-record
    desc: Captures identified agent session
    crit: notable
    conf: 0.96
    all:
      - id: agent-session-branch-capture
      - id: agent-session-raw-tool-data
      - id: agent-session-identity-fields

  - id: agent-session-identity-fields
    desc: Captures multiple agent identity fields
    crit: component
    conf: 0.92
    any:
      - id: agent-session-user-field
      - id: agent-session-device-field
      - id: agent-session-repository-field
      - id: agent-session-git-field
    needs: 2

  - id: agent-telemetry-default-remote-sink
    desc: Telemetry defaults to a remote HTTPS endpoint
    crit: notable
    conf: 0.95
    all:
      - id: agent-telemetry-config-url
      - id: agent-telemetry-default-https

  - id: agent-telemetry-opt-out-switch
    desc: Telemetry has an environment opt-out switch
    crit: component
    conf: 0.92
    all:
      - id: agent-telemetry-opt-out-field
      - id: agent-telemetry-env-disable

  - id: deepseek-request-console-logging
    desc: DeepSeek request payload console logging
    crit: notable
    conf: 0.92
    all:
      - id: deepseek-request-log-label
      - id: console-log-json-stringify-call

  - id: deepseek-response-console-logging
    desc: DeepSeek response payload console logging
    crit: notable
    conf: 0.92
    all:
      - id: deepseek-response-log-label
      - id: console-log-response-text-call

  - id: deepseek-payload-console-logging
    desc: DeepSeek API request and response console logging
    crit: notable
    conf: 0.94
    all:
      - id: deepseek-request-console-logging
      - id: deepseek-response-console-logging
