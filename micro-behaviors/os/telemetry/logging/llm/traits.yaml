defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: C0069

traits:
  - id: agent-session-branch-capture
    desc: Reads an AI agent session branch
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bsessionManager\s*\.\s*getBranch\s*\(\s*\)'

  - id: agent-session-raw-transcript-field
    desc: Serializes a raw AI agent transcript entry
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\braw_data\s*:\s*JSON\.stringify\s*\('

  - id: agent-session-tool-input-field
    desc: Serializes AI agent tool input
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\btool_input\s*:\s*JSON\.stringify\s*\('

  - id: agent-session-user-field
    desc: Agent telemetry user identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(user_email|user_name)\s*:'

  - id: agent-session-device-field
    desc: Agent telemetry device identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(device_name|device_id)\s*:'

  - id: agent-session-repository-field
    desc: Agent telemetry repository identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(repo_url|repo_name|cwd)\s*:'

  - id: agent-session-git-field
    desc: Agent telemetry revision identity field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(git_branch|git_commit|project_hash)\s*:'

  - id: agent-telemetry-config-url
    desc: Environment-backed telemetry URL setting
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\btelemetry\w*\s*:\s*process\.env\.[A-Z][A-Z0-9_]*\s*\?\?'

  - id: agent-telemetry-default-https
    desc: HTTPS fallback for telemetry setting
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\?\?\s*["'']https?://'

  - id: agent-telemetry-opt-out-field
    desc: Telemetry opt-out setting field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\btelemetry\w*(off|disabled)\s*:'
      case_insensitive: true

  - id: agent-telemetry-env-disable
    desc: Environment switch disables telemetry
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'process\.env\.[A-Z][A-Z0-9_]*\s*===?\s*["'']1["'']'

  - id: deepseek-request-log-label
    desc: DeepSeek outgoing request log label
    crit: component
    conf: 0.9
    if:
      type: text
      substr: OUTGOING DEEPSEEK REQUEST

  - id: deepseek-response-log-label
    desc: DeepSeek incoming response log label
    crit: component
    conf: 0.9
    if:
      type: text
      substr: INCOMING DEEPSEEK RESPONSE

  - id: console-log-json-stringify-call
    desc: Console logs JSON stringified payload
    crit: component
    conf: 0.86
    if:
      type: text
      regex: "console\\.log\\s*\\([^\\n]{0,120}JSON\\.stringify\\s*\\("

  - id: console-log-response-text-call
    desc: Console logs response text variable
    crit: component
    conf: 0.82
    if:
      type: text
      regex: "console\\.log\\s*\\([^\\n]{0,120}\\btext\\b"

  - id: agent-session-rollout-source
    desc: Identifies AI agent rollout synchronization data
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      exact: codex-session-rollout

  - id: agent-session-rollout-encoding
    desc: Encodes agent rollout as gzip base64
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bencoding\s*:\s*["'']gzip-base64["'']'

  - id: agent-session-rollout-raw-bytes
    desc: Includes raw byte count in rollout data
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\braw_bytes\s*:'

  - id: agent-session-rollout-data-field
    desc: Includes long encoded rollout data value
    crit: notable
    conf: 0.94
    if:
      type: text
      # A bare `data:` property is ordinary application code (and is common
      # in browser extensions).  Rollout records carry the encoded payload as
      # a long Base64-like string; require that value here so this atom does
      # not label unrelated JSON/RPC objects as agent telemetry.
      regex: '(?i)\bdata\s*:\s*["''][A-Za-z0-9+/=_-]{64,}["'']'

  - id: agent-session-rollout-builder
    desc: Builds an agent rollout batch
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bbuildTraceSyncRolloutBatch\s*\('

  - id: agent-session-rollout-post-call
    desc: Posts an agent rollout batch
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bpostTraceSyncRolloutBatch\s*\('

  - id: agent-session-rollout-json-body
    desc: Sends rollout as a JSON request body
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bbody\s*:\s*JSON\.stringify\s*\(\s*input\.envelope'

  - id: agent-session-trace-sync-constant
    desc: Defines an agent trace sync URL
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bTRACE_SYNC_[A-Z0-9_]*\s*=\s*["'']https?://'

  - id: agent-session-trace-sync-url
    desc: References an agent trace sync URL
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']https?://.{0,160}/trace[-_]sync'

  - id: agent-session-trace-default-config
    desc: Defines the agent trace default config
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: CODEX_TRACE_DEFAULT_CONFIG = {

  - id: agent-session-trace-content-enabled
    desc: Enables full agent trace content
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcaptureContent\s*:\s*true'

composite_rules:
  - id: agent-session-raw-tool-data
    desc: Serializes raw agent messages and tool inputs
    crit: notable
    conf: 0.96
    all:
      - id: agent-session-raw-transcript-field
      - id: agent-session-tool-input-field

  - id: agent-session-telemetry-record
    desc: Captures identified agent session
    crit: notable
    conf: 0.96
    all:
      - id: agent-session-branch-capture
      - id: agent-session-raw-tool-data
      - id: agent-session-identity-fields

  - id: agent-session-identity-fields
    desc: Captures multiple agent identity fields
    crit: component
    conf: 0.92
    any:
      - id: agent-session-user-field
      - id: agent-session-device-field
      - id: agent-session-repository-field
      - id: agent-session-git-field
    needs: 2

  - id: agent-telemetry-default-remote-sink
    desc: Telemetry defaults to a remote HTTPS endpoint
    crit: notable
    conf: 0.95
    all:
      - id: agent-telemetry-config-url
      - id: agent-telemetry-default-https

  - id: agent-telemetry-opt-out-switch
    desc: Telemetry has an environment opt-out switch
    crit: component
    conf: 0.92
    all:
      - id: agent-telemetry-opt-out-field
      - id: agent-telemetry-env-disable

  - id: deepseek-request-console-logging
    desc: DeepSeek request payload console logging
    crit: notable
    conf: 0.92
    all:
      - id: deepseek-request-log-label
      - id: console-log-json-stringify-call

  - id: deepseek-response-console-logging
    desc: DeepSeek response payload console logging
    crit: notable
    conf: 0.92
    all:
      - id: deepseek-response-log-label
      - id: console-log-response-text-call

  - id: deepseek-payload-console-logging
    desc: DeepSeek API request and response console logging
    crit: notable
    conf: 0.94
    all:
      - id: deepseek-request-console-logging
      - id: deepseek-response-console-logging

  - id: agent-session-rollout-record
    desc: Builds a compressed AI agent rollout record
    crit: notable
    conf: 0.97
    near_bytes: 4096
    all:
      - id: agent-session-rollout-source
      - id: agent-session-rollout-encoding
      - id: agent-session-rollout-raw-bytes
      - id: agent-session-rollout-data-field

  - id: agent-session-trace-sync-endpoint
    desc: Remote agent trace sync endpoint
    crit: notable
    conf: 0.97
    any:
      - id: agent-session-trace-sync-constant
      - id: agent-session-trace-sync-url

  - id: agent-session-content-capture-default
    desc: Full agent trace content default
    crit: notable
    conf: 0.96
    near_lines: 12
    all:
      - id: agent-session-trace-default-config
      - id: agent-session-trace-content-enabled
