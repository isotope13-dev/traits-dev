defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, python]
  crit: notable
  conf: 0.97

traits:
  - id: otel-log-user-prompts-enabled
    desc: Enables telemetry logging of user prompts
    if:
      type: text
      regex: 'OTEL_LOG_USER_PROMPTS["'']?\]?\s*[:=]\s*["'']?(1|true)(["'']|[,;\s}\]]|$)'

  - id: otel-log-user-prompts-setdefault-enabled
    desc: setDefault enables OTEL user prompt logging
    for: [javascript, typescript]
    if:
      type: text
      regex: 'setDefault\s*\(\s*[''"]OTEL_LOG_USER_PROMPTS[''"]\s*,\s*[''"]?(1|true)\b'

  - id: otel-log-tool-details-enabled
    desc: Enables telemetry logging of tool details
    if:
      type: text
      regex: 'OTEL_LOG_TOOL_DETAILS["'']?\]?\s*[:=]\s*["'']?(1|true)(["'']|[,;\s}\]]|$)'
  - id: otel-log-assistant-responses-enabled
    desc: Enables telemetry logging of assistant responses
    if:
      type: text
      regex: 'OTEL_LOG_ASSISTANT_RESPONSES["'']?\]?\s*[:=]\s*["'']?(1|true)(["'']|[,;\s}\]]|$)'
# Content-export settings are observable configuration, not proof of theft.
# Identity exclusions would hide the same behavior in a repacked release.

composite_rules:
  # A bundled collector credential and content-logging settings describe
  # configuration. They do not establish unauthorized transfer or execution.
  # Preserve the former objective's evidence, scope and proximity here.
  - id: hardcoded-bearer-conversation-telemetry
    desc: Conversation logging with bundled collector token
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 16000
    all:
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: otel-log-user-prompts-enabled
      - id: otel-log-tool-details-enabled
      - id: otel-log-assistant-responses-enabled
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-http-endpoint

  - id: full-conversation-telemetry-export
    desc: Configures prompt, response and tool logging
    crit: notable
    all:
      - id: otel-log-user-prompts-enabled
      - id: otel-log-tool-details-enabled
      - id: otel-log-assistant-responses-enabled
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-http-endpoint

  - id: default-detailed-prompt-trace-export
    desc: Defaults detailed prompt tracing to a configured collector
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: otel-log-user-prompts-setdefault-enabled
      - id: micro-behaviors/os/telemetry/logging/configure::otel-detailed-tracing-setdefault-enabled
      - id: micro-behaviors/os/telemetry/logging/configure::otel-collector-endpoint-setdefault

  # Global content-export configuration is unusual even in a legitimate
  # toolkit. The file-scoped legs show co-occurrence, not a bound write or
  # transfer. Retain this one suspicious observation without inferring theft.
  - id: global-agent-content-telemetry-write
    desc: Claude settings enable prompt/response/tool logs
    crit: suspicious
    for: [javascript, typescript]
    all:
      - id: full-conversation-telemetry-export
      # In source, require actual enabled fields/assignments before combining
      # configuration references with an unrelated settings write. A quoted
      # example or commented-out block must not create this suspicious finding.
      - id: node-conversation-content-logging-enabled
      - id: metadata/file/profile/file-write-api::node-write-file-sync-call
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step

  # Archive-wide configuration co-occurrence does not establish injection
  # or unauthorized export. Preserve the evidence without an attack claim.
  - id: claude-settings-hardcoded-otel-write-cooccurrence
    desc: Claude settings writer includes telemetry token
    crit: notable
    conf: 0.98
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: metadata/file/profile/file-write-api::node-write-file-sync-call
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step

  # Proxy and trace defaults describe configuration without proving theft.
  - id: npm-agent-inference-proxy-with-session-tracing
    desc: npm agent proxies inference with tracing enabled
    crit: notable
    conf: 0.93
    for: [npm, javascript]
    scope: archive
    all:
    - id: micro-behaviors/os/env/provider::anthropic-proxy-configuration
    any:
    - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-setdefault-enabled
    - id: micro-behaviors/os/telemetry/logging/llm::otel-log-user-prompts-enabled
    - id: micro-behaviors/os/telemetry/logging/configure::agent-cli-event-logging-setdefault-enabled
