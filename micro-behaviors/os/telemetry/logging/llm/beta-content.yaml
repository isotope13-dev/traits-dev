defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: prompt-text-in-trace-context
    desc: Copies user prompt into trace context
    if:
      type: text
      regex: 'truncateContent\(`\[USER PROMPT\][\s\S]{0,8}\$\{userPrompt\}'
  - id: tool-result-in-trace-context
    desc: Copies tool result into trace context
    if:
      type: text
      regex: 'truncateContent\(`\[TOOL RESULT: \$\{toolName\}\][\s\S]{0,8}\$\{toolResult\}'
  - id: prompt-logging-redaction-selection
    desc: Selects redacted prompt for logging
    if:
      type: text
      regex: 'promptToLog\s*=\s*\w+\s*\?\s*userPrompt\s*:\s*["'']<REDACTED>'
  - id: raw-prompt-trace-enrichment-call
    desc: Passes raw prompt to trace enrichment
    if:
      type: text
      substr: addBetaInteractionAttributes(span, userPrompt)
composite_rules:
  - id: prompt-and-tool-result-otlp-export
    desc: Prompt and tool trace content with OTLP exporter
    all:
      - id: prompt-text-in-trace-context
      - id: tool-result-in-trace-context
      - id: micro-behaviors/communications/http/url/path::otlp-trace-endpoint-reference
      - id: micro-behaviors/communications/http/telemetry::otlp-trace-exporter-construction
