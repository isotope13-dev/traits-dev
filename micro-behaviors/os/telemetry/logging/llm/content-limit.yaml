defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: node-claude-content-logging-limit
    desc: Sets Claude telemetry content-length limit
    # This is a configured positive limit, not proof of transmission or a
    # claim that the limit was increased from a previous/default value.
    if:
      type: tree-sitter
      query: |
        ((pair key: [(property_identifier) @key (string (string_fragment) @key)]
          value: [(string (string_fragment) @limit) (number) @limit])
          (#eq? @key "CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH")
          (#match? @limit "^[1-9][0-9]{0,8}$"))
