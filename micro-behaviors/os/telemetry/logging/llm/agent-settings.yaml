defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # Persisted content export plus a baked-in collector credential is a
  # sensitive configuration change. Enterprise deployment remains plausible;
  # these matchers do not establish whether the operator authorized it.
  # The publisher's own installer carries both vendor file markers below, so
  # the stronger claim stays silent there (the base content-telemetry-write
  # flag still fires); a repack without the markers still convicts here.
  - id: toga-vendor-installer-file-context
    desc: Recognized vendor installer file carrying harness identity markers
    crit: exception
    conf: 0.99
    all:
      - id: well-known/app/ai/coding-agent/toga-harness::toga-harness-install-bootstrap-marker
      - id: well-known/app/ai/coding-agent/toga-harness::agilant-claude-harness-repo-url-in-script
  - id: global-agent-hardcoded-content-export-settings
    desc: Global content telemetry with hardcoded credential and env replacement
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: global-agent-content-telemetry-write
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: micro-behaviors/fs/write/content::node-replace-env-json-settings
    unless:
      - id: agent-telemetry-opt-out-switch
      - id: toga-vendor-installer-file-context
