defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # Full-content export with a fixed credential is sensitive configuration;
  # these file-scoped matchers establish neither authorization nor a transfer.
  - id: global-agent-hardcoded-content-export-settings
    desc: Global logging settings with bundled token
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: global-agent-content-telemetry-write
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: micro-behaviors/fs/write/content::node-replace-env-json-settings
