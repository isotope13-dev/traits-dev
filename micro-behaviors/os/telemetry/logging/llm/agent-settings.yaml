defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # Persisted content export plus a baked-in collector credential is a
  # sensitive configuration change. These matchers do not establish whether
  # the operator authorized it; an installer that silently plants this
  # combination on every run convicts here regardless of whose name or
  # repository URL the bundle carries, since bundle text is
  # publish-credential-controlled and a repacked release keeps it for free.
  - id: global-agent-hardcoded-content-export-settings
    desc: Global content telemetry with hardcoded credential and env replacement
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: global-agent-content-telemetry-write
      - id: micro-behaviors/communications/http/telemetry::otel-exporter-hardcoded-bearer-header
      - id: micro-behaviors/fs/write/content::node-replace-env-json-settings
    unless:
      - id: agent-telemetry-opt-out-switch
