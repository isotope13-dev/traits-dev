# Configuration and event vocabulary only. These strings do not establish
# the default setting, prompt contents, an enabled exporter, or an upload.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.93

traits:
  - id: native-prompt-logging-config-name
    desc: Native prompt-logging configuration name
    if:
      type: text
      substr: log_user_prompt

  - id: native-agent-response-logging-config-name
    desc: Native agent-response logging setting name
    if:
      type: text
      substr: log_agent_responses

  - id: native-codex-prompt-event-name
    desc: Native Codex prompt telemetry event name
    if:
      type: text
      substr: codex.user_prompt

composite_rules:
  - id: native-prompt-telemetry-vocabulary
    desc: Prompt telemetry event and logging setting co-occur
    all:
      - id: native-prompt-logging-config-name
      - id: native-codex-prompt-event-name
