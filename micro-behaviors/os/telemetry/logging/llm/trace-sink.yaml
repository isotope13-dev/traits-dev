# Telemetry exfiltration primitives of agent frameworks: where traces go,
# what authorizes the upload, and whether span content ships by default.
# Each atom is neutral on its own — the documented OpenAI traces endpoint
# and a user-supplied key are legitimate. The composite below records the
# combination of a LAN default collector, content on and a trace upload;
# a private-network sink is a developer leftover, not an attacker-reachable
# destination, so it is a capability observation and not an exfiltration claim.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Text twin of micro-behaviors/communications/http/url/telemetry's
  # ingest-api-path (a `literal` matcher): literal findings do not pool into
  # archive-scope evaluation, so file/archive composites cannot bind that
  # atom on npm tarballs. This narrower traces-shaped text twin exists so
  # the sink composites below can require the endpoint path.
  - id: trace-ingest-path
    desc: References trace ingest endpoint path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'trace[s]?/ingest'

  - id: telemetry-dev-token-default
    desc: Telemetry key defaults to dev token
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'TRACING_API_KEY.{0,90}dev-token'

  - id: trace-sensitive-data-default
    desc: Trace sensitive data defaults on
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'traceIncludeSensitiveData.{0,40}\?\?\s*(!0|true)\b'

  # The OpenAI traces ingest API shape: uploads carry the traces version
  # header. A generic fetch-POST-JSON atom already exists a dozen times
  # over; this leg requires the traces-API marker so the sink composites
  # bind an actual trace upload, not any JSON POST.
  - id: traces-api-upload
    desc: Uploads via traces API version header
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: traces=v1

composite_rules:
  - id: trace-export-default-private-collector
    desc: Trace export defaults to private-network collector
    crit: notable
    conf: 0.9
    scope: file
    for: [javascript, typescript, npm, tar, zip]
    all:
      - id: trace-sensitive-data-default
      - id: trace-ingest-path
      - id: micro-behaviors/communications/ip/literal::private-ipv4-http-url
      - id: traces-api-upload
