# Refinements of global-agent-content-telemetry-write, which carries the one
# suspicious finding; operator authorization and actual transfer are unknown.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
composite_rules:
  - id: default-global-agent-content-export
    desc: Global conversation telemetry writer has environment opt-out
    scope: file
    all:
      - id: global-agent-hardcoded-content-export-settings
      - id: node-conversation-content-logging-enabled
      - id: node-opt-out-global-agent-settings-writer
