# Configuration-only evidence: operator authorization and actual transfer are unknown.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.98
composite_rules:
  - id: default-global-agent-content-export
    desc: Global logging settings with env opt-out
    scope: file
    all:
      - id: global-agent-hardcoded-content-export-settings
      - id: node-conversation-content-logging-enabled
      - id: node-opt-out-global-agent-settings-writer
