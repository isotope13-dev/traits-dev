defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-prompt-submitted-event-call
    desc: Dispatches a prompt-submitted event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: go
      query: |
        ((call_expression function: (identifier) @callee arguments: (argument_list) @args)
         (#match? @callee "(?i)^(emit|log|record|track)[a-z0-9_]*$")
         (#match? @args "\\\"prompt\\.submitted\\\""))
composite_rules:
  - id: go-prompt-text-event-field
    desc: Prompt text field and event dispatch co-occur
    crit: notable
    conf: 0.92
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/serialize/schema-object::go-prompt-text-map-field
      - id: go-prompt-submitted-event-call
