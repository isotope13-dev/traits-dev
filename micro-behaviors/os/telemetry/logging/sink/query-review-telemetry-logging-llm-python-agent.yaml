defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python

traits:
  - id: telemetry-sinks-config-field
    desc: Telemetry sinks config field
    conf: 0.86
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    if:
      type: text
      substr: telemetry_sinks

  - id: telemetry-url-config-lookup
    desc: Telemetry URL config lookup
    conf: 0.84
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    if:
      type: text
      substr: 'spec.get("url"'

  - id: http-telemetry-sink-builder
    desc: HTTP telemetry sink builder
    conf: 0.86
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    if:
      type: text
      substr: make_http_telemetry_sink

  # A generic urllib POST literal appears in any HTTP client code; the
  # telemetry-sink composite below carries the library-specific context.
  - id: urllib-request-post-literal
    desc: Generic urllib Request POST literal fragment
    crit: component
    conf: 0.88
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    if:
      type: text
      regex: 'urllib\.request\.Request.{0,80}method="POST"'

  - id: syslog-telemetry-sink-builder
    desc: Syslog telemetry sink builder
    conf: 0.86
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    if:
      type: text
      substr: _make_syslog_sink


composite_rules:
  - id: config-expanded-telemetry-sinks
    desc: Config expanded telemetry sinks
    conf: 0.92
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    all:
      - id: micro-behaviors/os/telemetry/logging/sink::telemetry-sinks-config-field
      - id: micro-behaviors/os/env/read::os-path-expandvars
      - id: micro-behaviors/os/telemetry/logging/sink::telemetry-url-config-lookup
      - id: micro-behaviors/communications/http/header/custom::request-spec-headers-lookup

  - id: http-post-telemetry-sink
    desc: HTTP POST telemetry sink
    conf: 0.92
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    near_lines: 80
    all:
      - id: micro-behaviors/os/telemetry/logging/sink::http-telemetry-sink-builder
      - id: micro-behaviors/os/telemetry/logging/sink::urllib-request-post-literal

  - id: syslog-udp-telemetry-sink
    desc: UDP syslog telemetry sink
    conf: 0.9
    ref: sha256:4a646c14c10fbca2666cce3a4bae7554e5815b4fdf4926b42d4c92e1e783340c
    all:
      - id: micro-behaviors/os/telemetry/logging/sink::syslog-telemetry-sink-builder
      - id: micro-behaviors/communications/socket/udp::sock-dgram-python
      - id: micro-behaviors/communications/socket/send::python-sendto
