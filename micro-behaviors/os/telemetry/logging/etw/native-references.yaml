# References to ETW APIs and their provider module do not establish patching.
defaults:
  platforms: [windows]
  for: [binaries, pe, dll]
traits:
  - id: etw-event-write-symbol
    desc: EtwEventWrite symbol reference
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: EtwEventWrite

  - id: nttraceevent-api-reference
    desc: NtTraceEvent telemetry API reference
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      word: NtTraceEvent

  - id: native-etw-target-reference
    desc: EtwEventWrite and ntdll.dll name references
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: raw
      regex: '(?is)(ntdll\.dll.{0,320}EtwEventWrite|EtwEventWrite.{0,320}ntdll\.dll)'


