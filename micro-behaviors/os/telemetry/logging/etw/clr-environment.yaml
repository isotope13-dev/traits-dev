# A supported CLR configuration switch; alone this does not prove evasion.
defaults:
  platforms: [windows]
  for: [csharp, powershell, python]

traits:
  - id: clr-environment-etw-disabled
    desc: Sets CLR ETW environment switch off
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bSetEnvironmentVariable\s*\(\s*["'']COMPlus_ETWEnabled["'']\s*,\s*["'']0["'']\s*[,)]'
