# Windows Event Tracing for Windows (ETW) write APIs — neutral telemetry
# capability. Patching/blinding intent lives in objectives composites that
# combine these atoms with patch stubs or explicit "Patching EtwEventWrite"
# strings.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp]
  crit: notable
  conf: 0.9

traits:
  - id: etw-event-write-str
    desc: EtwEventWrite API name string
    if:
      type: text
      substr: "EtwEventWrite"

  - id: etw-event-write-call
    desc: Native source calls EtwEventWrite
    for: [c, cpp, csharp]
    if:
      type: symbol
      kind: call
      exact: EtwEventWrite

  - id: register-trace-guids-w
    desc: Registers a classic Windows trace provider
    conf: 0.93
    if:
      type: import
      exact: RegisterTraceGuidsW

  - id: unregister-trace-guids
    desc: Unregisters a classic Windows trace provider
    conf: 0.93
    if:
      type: import
      exact: UnregisterTraceGuids

  - id: trace-message
    desc: Emits messages through classic Windows tracing
    conf: 0.93
    if:
      type: import
      exact: TraceMessage

  - id: trace-logger-state-query
    desc: Queries Windows trace-session state
    conf: 0.93
    if:
      type: import
      exact: GetTraceLoggerHandle

  - id: trace-enable-state-query
    desc: Queries Windows trace enablement state
    conf: 0.93
    if:
      type: import
      exact: GetTraceEnableLevel

  - id: trace-enable-flags-query
    desc: Queries Windows trace enablement flags
    conf: 0.93
    if:
      type: import
      exact: GetTraceEnableFlags

  - id: trace-activity-id-control
    desc: Controls Windows event activity identifiers
    conf: 0.9
    if:
      type: import
      exact: EventActivityIdControl

composite_rules:
  - id: classic-trace-provider
    desc: Implements a classic Windows trace provider
    crit: notable
    conf: 0.97
    all:
      - id: register-trace-guids-w
      - id: trace-message
      - id: trace-logger-state-query
    any:
      - id: trace-enable-state-query
      - id: trace-enable-flags-query
