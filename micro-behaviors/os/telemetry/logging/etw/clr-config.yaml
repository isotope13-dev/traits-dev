# Documented per-application CLR tracing setting; no memory patch is implied.
defaults:
  platforms: [windows]
  for: [xml, csharp]

traits:
  - id: clr-config-etw-disabled
    desc: CLR config disables runtime ETW
    crit: notable
    conf: 0.93
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<etwEnable\b[^>]{0,80}\benabled\s*=\s*["'']false["'']'

