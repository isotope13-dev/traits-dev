defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, python, powershell, batch]
  crit: notable
traits:
  - id: resolved-event-write-argument
    desc: Passes resolved ETW writer address
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '.'
      arg:
        from:
          call: '(^|[.:])GetProcAddress$'
          argument: 1
          literal: '^EtwEventWrite(Ex)?$'
