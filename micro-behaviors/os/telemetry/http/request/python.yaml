defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.92

traits:
  - id: repository-owner-name-payload-fields
    desc: Repository owner and name payload fields
    if:
      type: text
      regex: '["'']org["'']\s*:\s*\w+[\s\S]{0,100}["'']repo["'']\s*:\s*\w+'

  - id: repository-scan-metric-payload-fields
    desc: Repository scan metric payload fields
    if:
      type: text
      regex: '["'']branch_count["'']\s*:[\s\S]{0,260}["'']scan_duration_seconds["'']\s*:'

composite_rules:
  - id: repository-scan-telemetry-payload
    desc: Repository identity and scan telemetry payload
    crit: notable
    conf: 0.96
    near_lines: 30
    all:
      - id: repository-owner-name-payload-fields
      - id: repository-scan-metric-payload-fields
