# User identity fields in an HTTP request support audit attribution and can also
# reveal data collection. The observation remains neutral without covert intent.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.92

composite_rules:
  - id: python-http-audit-user-identity
    desc: Python POST alongside user audit fields
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/collection/map::audit-user-name-payload-field
      - id: micro-behaviors/data/collection/map::audit-user-email-payload-field
      - id: micro-behaviors/communications/http/request/client::python-http-post-any
