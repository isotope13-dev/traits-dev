# User identity fields in an HTTP request support audit attribution and can also
# reveal data collection. The observation remains neutral without covert intent.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.92

traits:
  - id: audit-user-name-payload-field
    desc: HTTP audit payload user name field
    if:
      type: string_literal
      exact: _user_name

  - id: audit-user-email-payload-field
    desc: HTTP audit payload user email field
    if:
      type: string_literal
      exact: _user_email

composite_rules:
  - id: python-http-audit-user-identity
    desc: Python POST carries user name and email audit fields
    crit: notable
    conf: 0.94
    all:
      - id: audit-user-name-payload-field
      - id: audit-user-email-payload-field
      - id: micro-behaviors/communications/http/request/client::python-http-post-any
