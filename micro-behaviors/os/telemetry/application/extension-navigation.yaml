# These API combinations do not establish browsing-data collection or theft.
# Navigation callbacks may record only counters or timestamps, an ID helper
# may never run, and an unrelated alarm may send ordinary telemetry. Keep the
# observations useful without asserting reachability or source-to-send flow.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]

composite_rules:
  - id: extension-navigation-storage-id
    desc: Extension navigation observer, storage write and ID co-occur
    crit: notable
    conf: 0.96
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-committed
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
    any:
      - id: micro-behaviors/os/random/crypto::webcrypto-uuid-local-persist
      - id: micro-behaviors/os/random/prng/stdlib::javascript-prefixed-random-id
      - id: micro-behaviors/os/random/prng/stdlib::javascript-makeuid-random-function
      - id: micro-behaviors/data/db/web-storage::extension-uid-sync-storage
    unless:
      - id: micro-behaviors/process/hook/webextension::chrome-declarative-net-request
      - id: metadata/permission/network::permission-declarative-net-request

  - id: extension-navigation-alarm-json-post
    desc: Extension UUID storage, navigation, alarm and JSON POST co-occur
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/os/random/crypto::webcrypto-uuid-local-persist
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-committed
      - id: micro-behaviors/time/schedule/webextension::chrome-alarms-create
    # Accept a variable endpoint or a literal fetch POST; neither proves theft.
    any:
      - id: micro-behaviors/communications/http/request/payload::fetch-endpoint-post-json-body
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    unless:
      - id: micro-behaviors/process/hook/webextension::chrome-declarative-net-request
      - id: metadata/permission/network::permission-declarative-net-request

