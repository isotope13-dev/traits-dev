defaults:
  platforms: [windows, unix]
  for: [python]
  crit: component
  conf: 0.92

traits:
  - id: repository-owner-name-payload-fields
    crit: notable
    desc: Repository owner and name payload fields
    if:
      type: text
      regex: '["'']org["'']\s*:\s*\w+[\s\S]{0,100}["'']repo["'']\s*:\s*\w+'

  - id: repository-scan-metric-payload-fields
    crit: notable
    desc: Repository scan metric payload fields
    if:
      type: text
      regex: '["'']branch_count["'']\s*:[\s\S]{0,260}["'']scan_duration_seconds["'']\s*:'

  - id: installation-id-payload-field
    crit: notable
    desc: Installation-identifier field reference
    conf: 0.9
    if:
      type: string_literal
      exact: installation_id

composite_rules:
  - id: repository-scan-telemetry-payload
    desc: Repository identity and scan telemetry payload
    crit: notable
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/os/telemetry/application::repository-owner-name-payload-fields
      - id: micro-behaviors/os/telemetry/application::repository-scan-metric-payload-fields
  - id: consent-gated-installation-telemetry-post
    desc: Consented POST with installation-ID reference
    crit: notable
    conf: 0.94
    near_lines: 40
    all:
      - id: micro-behaviors/data/control-flow/return::explicit-telemetry-consent-gate
      - id: micro-behaviors/os/telemetry/application::installation-id-payload-field
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
