# Build-tool telemetry names its CI provider from the repository variables each
# provider exports and sends only a SHA-256 of the repo URL, so the raw
# environment value never reaches the request body.
defaults:
  platforms: [unix, windows]
  for: [go]
  conf: 0.9

traits:
  - id: go-ci-repo-env-names
    desc: Go reads CI provider repository variables
    crit: notable
    if:
      type: text
      regex: '"(CIRCLE_PROJECT_REPONAME|BUILDKITE_REPO|DRONE_REPO|TRAVIS_REPO_SLUG)"'

  - id: go-sha256-sum-call
    desc: Go hashes data with SHA-256
    crit: notable
    if:
      type: symbol
      exact: sha256.Sum256

composite_rules:
  - id: go-hashed-ci-repo-telemetry
    desc: CI repository name hashed before telemetry
    crit: exception
    all:
      - id: go-ci-repo-env-names
      - id: go-sha256-sum-call
