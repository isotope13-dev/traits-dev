composite_rules:
- id: github-startup-assignment-publish-credential
  desc: CI startup assignment and publish credentials
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/env/cicd::github-env-file
  - id: micro-behaviors/os/env/runtime::bash-env-assignment-string
  any:
  - id: micro-behaviors/os/env/package-manager::package-registry-credential-env-read
  - id: micro-behaviors/os/env/secret-name::pypi-publish-secret-name
  - id: micro-behaviors/os/env/ci-credentials::javascript-ci-token-env-access
- id: github-startup-assignment-credential-launch
  desc: CI startup, credentials and launch references
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/env/cicd::github-startup-assignment-publish-credential
  any:
  - id: micro-behaviors/process/create/exec
  - id: metadata/lang/encoding/shape::htmlhelp-shortcut-item1-numeric-entities
  - id: metadata/lang/source/syntax/command/invocation::rundll32-command-syntax-reference
  - id: micro-behaviors/process/create/shell/command-string::awk-system-call
  - id: micro-behaviors/process/create/flags::wsh-hidden-async-run
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
defaults:
