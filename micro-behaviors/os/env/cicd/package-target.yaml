defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  - shell
traits:
- id: package-target-and-repository-suffix-names
  desc: Package target and repository selector names
  crit: notable
  conf: 0.95
  for:
  - package.json
  - manifests
  - pkginfo
  - javascript
  - typescript
  - shell
  - github-actions
  if:
    type: text
    regex: (?s)REPO_ID_SUFFIX.{1,99}TARGET_PACKAGES|TARGET_PACKAGES.{1,99}REPO_ID_SUFFIX
  unless:
  - id: metadata/file/catalog/identity::cleave-trait-definition-file
