defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: ci-comparison-before-fetch-call
    desc: CI flag comparison precedes a fetch call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(process\.env\.)?CI\s*[=!]==?\s*["''\w][\s\S]{0,200}\bfetch\s*\('
