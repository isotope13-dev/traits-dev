defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-append-github-bash-startup
  desc: Appends BASH_ENV to GitHub environment file
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    kind: call
    regex: appendFileSync\(process\.env\.GITHUB_ENV,\s*`BASH_ENV=
