defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: appends-generated-dir-to-github-path
    desc: Adds generated directory to GITHUB_PATH
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'appendFileSync\s*\(\s*process\.env\.GITHUB_PATH\s*,[\s\S]{0,100}\bdir\b'
