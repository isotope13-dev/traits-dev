defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript]
composite_rules:
  - id: github-bash-env-assignment-reference
    desc: BASH_ENV assignment string near a GITHUB_ENV reference
    crit: notable
    conf: 0.93
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/cicd/startup::github-env-file
      - id: micro-behaviors/os/env/runtime::bash-env-assignment-string
