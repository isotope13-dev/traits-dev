defaults:
  platforms: [unix, android, ios]
  for: [shell]
  crit: notable
  conf: 0.75
traits:
  - id: sh-runner-name
    desc: $RUNNER_NAME shell environment access
    conf: 0.85
    if:
      type: text
      regex: "\\$\\{?RUNNER_NAME\\}?"
  - id: sh-runner-os
    desc: $RUNNER_OS shell environment access
    conf: 0.8
    if:
      type: text
      regex: "\\$\\{?RUNNER_OS\\}?"
  - id: sh-github-actions
    desc: $GITHUB_ACTIONS shell environment access
    conf: 0.8
    if:
      type: text
      regex: "\\$\\{?GITHUB_ACTIONS\\}?"
  - id: sh-ci-variable
    desc: $CI shell environment variable
    conf: 0.7
    if:
      type: text
      regex: "\\$CI\\b|\\$\\{CI\\}"
    unless:
      - id: well-known/tool/packaging/install4j::install4j-unix-sfx
      - id: metadata/lang/encoding/shape/character::non-ascii-script-text
