# A guard that reads the CI flag and returns: code that declines to run under
# a build/test runner. Ordinary in install scripts, so only a notable clue.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: ci-env-check-early-return
    desc: Returns early when CI variable is set
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: if\s*\([^)]{0,160}process\.env\.CI\b[^)]{0,160}\)\s*\{?\s*return\b
