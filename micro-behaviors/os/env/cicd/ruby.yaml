# CI/CD Environment Variable Targeting - Ruby
# Detects access to CI/CD runner environment variables in Ruby gems
# ATT&CK: T1082 (System Information Discovery)
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 0.75
traits:
  # GitHub Actions runner variables via ENV[]
  - id: rb-runner-name
    desc: Ruby ENV RUNNER_NAME access
    conf: 0.85
    if:
      type: text
      regex: "ENV\\[[\"']RUNNER_NAME[\"']\\]"
  - id: rb-runner-os
    desc: Ruby ENV RUNNER_OS access
    conf: 0.8
    if:
      type: text
      regex: "ENV\\[[\"']RUNNER_OS[\"']\\]"
  - id: rb-github-actions
    desc: Ruby ENV GITHUB_ACTIONS access
    conf: 0.8
    if:
      type: text
      regex: "ENV\\[[\"']GITHUB_ACTIONS[\"']\\]"
  # ENV.fetch patterns
  - id: rb-fetch-runner
    desc: Ruby ENV.fetch for runner vars
    conf: 0.85
    if:
      type: text
      regex: "ENV\\.fetch\\([\"']RUNNER_"
  - id: rb-fetch-github
    desc: Ruby ENV.fetch for github vars
    conf: 0.8
    if:
      type: text
      regex: "ENV\\.fetch\\([\"']GITHUB_"

  # CI-platform environment-variable NAMES. These are neutral capability
  # observations -- a CI-detection library enumerates exactly these. Relocated
  # from objectives/anti-analysis/sandbox-detect/script/, where "code names
  # GITLAB_CI" was pitched as sandbox evasion and fired on RubyGems' and
  # Bundler's own ci_detector.rb (shipped in every Ruby install), ci_info,
  # simplecov, coveralls and rspec CI formatters. Their sibling
  # cicd::github-actions-flag was already here. The evasion INTENT stays in
  # objectives/anti-analysis/sandbox-detect/script::ruby-ci-skip-remote-loader,
  # which additionally requires net/http + file write + spawn.
  - id: gitlab-ci-env-word
    desc: GITLAB_CI environment token
    conf: 0.85
    if:
      type: text
      word: GITLAB_CI
  - id: circleci-env-word
    desc: CIRCLECI environment token
    conf: 0.85
    if:
      type: text
      word: CIRCLECI
  - id: travis-ci-env-word
    desc: TRAVIS environment token
    conf: 0.8
    if:
      type: text
      word: TRAVIS
  - id: jenkins-url-env-word
    desc: JENKINS_URL environment token
    conf: 0.8
    if:
      type: text
      word: JENKINS_URL

composite_rules:
  - id: ruby-ci-provider-env-refs
    desc: Ruby CI provider environment references
    crit: notable
    conf: 0.92
    any:
      - id: gitlab-ci-env-word
      - id: circleci-env-word
      - id: travis-ci-env-word
      - id: jenkins-url-env-word
  - id: ruby-multi-ci-env-probe
    desc: Ruby probes multiple CI platform env vars
    crit: notable
    conf: 0.9
    needs: 4
    any:
      - id: github-actions-flag
      - id: gitlab-ci-env-word
      - id: circleci-env-word
      - id: travis-ci-env-word
      - id: jenkins-url-env-word
