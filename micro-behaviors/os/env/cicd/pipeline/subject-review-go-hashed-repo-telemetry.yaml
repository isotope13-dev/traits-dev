defaults:
  platforms: [unix, windows]
  for: [go]
  conf: 0.9

traits:
  - id: go-ci-repo-env-names
    desc: Go reads CI provider repository variables
    crit: notable
    if:
      type: text
      regex: '"(CIRCLE_PROJECT_REPONAME|BUILDKITE_REPO|DRONE_REPO|TRAVIS_REPO_SLUG)"'

composite_rules:
  - id: go-hashed-ci-repo-telemetry
    desc: CI repository name hashed before telemetry
    crit: exception
    all:
      - id: micro-behaviors/os/env/cicd/pipeline::go-ci-repo-env-names
      - id: micro-behaviors/crypto/hash/digest/sha2::go-sha256-operation
