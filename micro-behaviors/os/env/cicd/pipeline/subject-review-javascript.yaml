defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.75
traits:
  - id: process-env-github-repository
    desc: Reads GITHUB_REPOSITORY CI variable
    conf: 0.78
    if:
      type: text
      substr: 'process.env.GITHUB_REPOSITORY'
  - id: process-env-github-workspace
    desc: Reads GITHUB_WORKSPACE CI variable
    conf: 0.85
    if:
      type: text
      substr: 'process.env.GITHUB_WORKSPACE'
  - id: process-env-github-run-id
    desc: Reads GITHUB_RUN_ID CI variable
    conf: 0.78
    if:
      type: symbol
      kind: member
      exact: process.env.GITHUB_RUN_ID
  - id: process-env-ci-project-name
    desc: Reads CI_PROJECT_NAME CI variable
    conf: 0.78
    if:
      type: symbol
      kind: member
      exact: process.env.CI_PROJECT_NAME
  - id: process-env-ci-project-path
    desc: Reads CI_PROJECT_PATH CI variable
    conf: 0.8
    if:
      type: text
      substr: 'process.env.CI_PROJECT_PATH'
  - id: process-env-buildkite-org-slug
    desc: Reads BUILDKITE_ORGANIZATION_SLUG CI variable
    conf: 0.8
    if:
      type: text
      substr: 'process.env.BUILDKITE_ORGANIZATION_SLUG'
  - id: process-env-circle-project-username
    desc: Reads CIRCLE_PROJECT_USERNAME CI variable
    conf: 0.8
    if:
      type: text
      substr: 'process.env.CIRCLE_PROJECT_USERNAME'
  - id: process-env-codespace-name
    desc: Reads CODESPACE_NAME environment variable
    conf: 0.8
    if:
      type: text
      substr: 'process.env.CODESPACE_NAME'
  - id: process-env-gitpod-workspace-context-url
    desc: Reads GITPOD_WORKSPACE_CONTEXT_URL env var
    conf: 0.8
    if:
      type: text
      substr: 'process.env.GITPOD_WORKSPACE_CONTEXT_URL'
  - id: process-env-system-collectionuri
    desc: Reads SYSTEM_COLLECTIONURI CI variable
    conf: 0.8
    if:
      type: text
      substr: 'process.env.SYSTEM_COLLECTIONURI'
  # Comparisons, not reads. `process-env-ci` above records that the flag was
  # looked at; these record that the value was tested against a specific
  # sentinel, which is what an execution gate does. Neutral on their own —
  # ordinary packages skip telemetry under CI or in a test run — so intent is
  # left to the composites in objectives/anti-analysis/environment-detect/.
composite_rules:
  - id: node-multi-ci-project-identity
    desc: Reads multiple CI/cloud-dev project identity variables
    crit: notable
    conf: 0.94
    needs: 3
    any:
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-github-repository
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-ci-project-path
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-buildkite-org-slug
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-circle-project-username
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-codespace-name
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-gitpod-workspace-context-url
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-system-collectionuri
