defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.75
traits:
  - id: github-actor
    desc: GITHUB_ACTOR environment variable
    conf: 0.7
    if:
      type: text
      exact: GITHUB_ACTOR
  - id: github-repository
    desc: GITHUB_REPOSITORY environment variable
    conf: 0.7
    if:
      type: text
      exact: GITHUB_REPOSITORY
  - id: github-workflow
    desc: GITHUB_WORKFLOW environment variable
    conf: 0.7
    if:
      type: text
      exact: GITHUB_WORKFLOW
  - id: github-workflow-log-command
    desc: GitHub Actions workflow log command
    crit: notable
    conf: 0.9
    for: [shell, python, javascript, typescript, ruby, go]
    if:
      type: text
      regex: '::(debug|notice|warning|error|group|endgroup|add-mask|stop-commands)::'
