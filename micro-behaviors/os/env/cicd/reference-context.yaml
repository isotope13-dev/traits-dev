defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: suspicious
  conf: 0.85
composite_rules:
  - id: ci-environment-reference-context
    desc: CI environment names with context exclusions
    crit: notable
    any:
      - id: micro-behaviors/os/env/read::ci-env-reference-set
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/scripted::dot-spec-filename
      - id: well-known/tool/development/agent/kilocode::kilo-code-js-bundle
      - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
      - id: metadata/build/bundler/vscode::vscode-large-minified-extension-bundle
      - id: metadata/build/minifier::js-large-minified-dist-bundle
      - id: metadata/file/naming::plugin-version-cjs-basename
      - id: metadata/build/ci/step::github-actions-sudo-preserve-env
