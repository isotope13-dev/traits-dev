defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-github-env-preload-write
    desc: Appends Ruby preload to CI environment file
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ body: (body_statement
          [(assignment left: (identifier) @environment_file right: (element_reference
          object: (constant) @env (string (string_content) @environment_name))) (unless_modifier condition: (parenthesized_statements (assignment left: (identifier) @environment_file right: (element_reference
          object: (constant) @env (string (string_content) @environment_name)))))]
          [(call receiver: (constant) @file method: (identifier) @open
          arguments: (argument_list (identifier) @destination (string (string_content) @mode))
          block: [(block parameters: (block_parameters (identifier) @stream)
            body: (block_body (call receiver: (identifier) @output method: (identifier) @puts
              arguments: (argument_list (string (string_content) @preload (interpolation (identifier)))))))
            (do_block parameters: (block_parameters (identifier) @stream)
              body: (body_statement (call receiver: (identifier) @output method: (identifier) @puts
                arguments: (argument_list (string (string_content) @preload (interpolation (identifier)))))))]) (begin (call receiver: (constant) @file method: (identifier) @open
          arguments: (argument_list (identifier) @destination (string (string_content) @mode))
          block: [(block parameters: (block_parameters (identifier) @stream)
            body: (block_body (call receiver: (identifier) @output method: (identifier) @puts
              arguments: (argument_list (string (string_content) @preload (interpolation (identifier)))))))
            (do_block parameters: (block_parameters (identifier) @stream)
              body: (body_statement (call receiver: (identifier) @output method: (identifier) @puts
                arguments: (argument_list (string (string_content) @preload (interpolation (identifier)))))))]))]))
          (#eq? @env "ENV") (#eq? @environment_name "GITHUB_ENV")
          (#eq? @file "File") (#eq? @open "open") (#eq? @environment_file @destination)
          (#match? @mode "^a[b+]?$" ) (#eq? @stream @output) (#eq? @puts "puts")
          (#match? @preload "^RUBYOPT=-r"))
