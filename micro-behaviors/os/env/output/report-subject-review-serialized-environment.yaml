defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: github-actions-debug-call
  desc: Calls GitHub Actions debug logging
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\bcore\.debug\s*\('
    exclude_comments: true
composite_rules:
- id: process-env-direct-dump
  desc: Serializes Node environment directly as JSON
  crit: notable
  conf: 0.85
  near_bytes: 120
  all:
  - id: micro-behaviors/os/env/read/current::javascript
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
- id: process-env-debug-log
  desc: Logs process environment when debug is enabled
  crit: suspicious
  conf: 0.95
  near_bytes: 180
  all:
  - id: micro-behaviors/os/env/output::process-env-direct-dump
  - id: micro-behaviors/os/env/output::github-actions-debug-call
- id: node-env-json-serialization-context
  desc: Environment references with JSON serialization
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/env/output::process-env-direct-dump
  - id: micro-behaviors/os/env/output::node-env-alias-json-cooccurrence
- id: node-env-alias-json-cooccurrence
  desc: Environment alias near JSON serialization
  crit: notable
  conf: 0.88
  near_bytes: 1200
  all:
  - id: micro-behaviors/os/env/enumerate/entries::node-process-env-alias
  - id: micro-behaviors/data/serialize/json::parsed-or-environment-json-stringify
