defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  crit: notable
  conf: 0.6
  attack: T1082
traits:
- id: printenv-unquoted-call
  desc: References an unquoted printenv call
  for:
  - shell
  crit: notable
  if:
    type: symbol
    kind: call
    regex: ^([^"'$`\\\r\n]{0,1024}/)?printenv$
- id: printenv-double-quoted-call
  desc: References a double-quoted printenv call
  for:
  - shell
  crit: notable
  if:
    type: symbol
    kind: call
    regex: ^"([^"$`\\\r\n]{0,1024}/)?printenv"$
- id: printenv-single-quoted-call
  desc: References a single-quoted printenv call
  for:
  - shell
  crit: notable
  if:
    type: symbol
    kind: call
    regex: ^'([^'\r\n]{0,1024}/)?printenv'$
composite_rules:
- id: printenv
  desc: printenv-named call reference
  for:
  - shell
  any:
  - id: printenv-unquoted-call
  - id: printenv-double-quoted-call
  - id: printenv-single-quoted-call
