defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-echo-json-environment
    desc: Outputs full PHP environment as JSON
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      node: echo_statement
      regex: '(?i)^echo\s+\\?json_encode\s*\(\s*\\?getenv\s*\(\s*\)\s*\)\s*;?$'
