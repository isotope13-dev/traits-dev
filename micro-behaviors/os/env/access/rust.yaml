defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable
  conf: 0.86

traits:
  - id: std-env-var
    desc: Reads a Rust environment variable
    if:
      type: text
      regex: 'std::env::var(_os)?\s*\('
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: rust-env-module-var
    desc: Rust reads an environment variable
    crit: notable
    conf: 0.86
    if:
      type: text
      # Keep calls through an imported `env` module distinct from qualified
      # `std::env` calls, which are covered by std-env-var above.
      regex: '(^|[^:])\benv::var(_os)?\s*\('
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: rust-env-module-vars
    desc: Enumerates the Rust process environment
    crit: notable
    conf: 0.9
    attack: T1082
    if:
      type: text
      regex: '\benv::vars\s*\(\s*\)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: cargo-out-dir-reference
    desc: References Cargo OUT_DIR environment value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(std::)?env::var\s*\(\s*"OUT_DIR"\s*\)|\bOUT_DIR\b'
  - id: config-env-prefix
    desc: Rust config environment source
    conf: 0.88
    if:
      type: text
      regex: 'config::Environment::with_prefix\s*\('
