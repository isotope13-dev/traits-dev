defaults:
  for: [binaries, c]
  crit: baseline
  platforms:
    - unix
    - windows
traits:
  - id: shell-ostype-reference
    desc: Reads shell OSTYPE environment value
    conf: 0.8
    for: [shell]
    platforms: [unix]
    if:
      type: text
      substr: $OSTYPE
  - id: native-getenv
    desc: Reads process environment through getenv
    conf: 0.8
    for: [elf, macho, c, cpp, objc]
    platforms: [unix]
    if:
      type: symbol
      exact: getenv
  - id: native-setenv
    desc: Sets process environment through setenv
    conf: 0.8
    for: [elf, macho, c, cpp, objc]
    platforms: [unix]
    if:
      type: symbol
      exact: setenv
  - id: getenv-user
    desc: Query USER environment variable
    conf: 0.5
    attack: T1033
    mbc: E1033
    platforms:
      - unix
    if:
      type: text
      regex: getenv\("USER"\)
  - id: getenv-home
    desc: Query HOME environment variable
    conf: 0.5
    attack: T1082
    mbc: E1082
    platforms:
      - unix
    if:
      type: text
      regex: getenv\("HOME"\)
