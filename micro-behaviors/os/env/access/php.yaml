defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-getenv-call
    desc: Calls PHP getenv
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: getenv

  - id: php-getenv-path
    desc: PHP reads the PATH environment variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "getenv\\s*\\(\\s*['\"]PATH['\"]\\s*\\)"

  - id: php-getenv-home
    desc: PHP reads the HOME environment variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "getenv\\s*\\(\\s*['\"]HOME['\"]\\s*\\)"
