defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-server-script-name
    desc: Reads PHP request script path
    crit: notable
    conf: 0.85
    # PHP subscripts do not fold to member facts, so keep this as a specific
    # source-text pattern rather than treating every $_SERVER read alike.
    unless:
      - id: metadata/file/extension/identity::yara-extension
    if:
      type: text
      regex: '\$_SERVER\s*\[\s*[''"](SCRIPT_NAME|PHP_SELF)[''"]\s*\]'

  - id: php-server-superglobal
    desc: Reads PHP $_SERVER execution environment data
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: identifier
      exact: '_SERVER'

  - id: php-getenv-call
    desc: Calls PHP getenv
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: getenv

  - id: php-getenv-path
    desc: PHP reads the PATH environment variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "getenv\\s*\\(\\s*['\"]PATH['\"]\\s*\\)"

  - id: php-getenv-home
    desc: PHP reads the HOME environment variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "getenv\\s*\\(\\s*['\"]HOME['\"]\\s*\\)"
