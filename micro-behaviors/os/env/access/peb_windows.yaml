defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: peb-access-x86
    desc: Accesses the x86 process environment block
    if:
      type: metrics
      field: pe.peb_access_x86_count
      min: 1

  - id: peb-access-x64
    desc: Accesses the x64 process environment block
    if:
      type: metrics
      field: pe.peb_access_x64_count
      min: 1

composite_rules:
  - id: peb-access-both-architectures
    desc: Accesses both x86 and x64 environment blocks
    crit: notable
    conf: 0.96
    all:
      - id: peb-access-x86
      - id: peb-access-x64
