defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin]

traits:
  - id: java-system-getproperty
    desc: Java System.getProperty() usage
    crit: baseline
    conf: 0.8
    if:
      type: text
      word: System.getProperty

  - id: java-system-getenv
    desc: Java System.getenv() usage
    crit: baseline
    conf: 0.8
    if:
      type: text
      word: System.getenv

  - id: java-environment-entry-map-copy
    desc: Java copies environment map entry values
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'System\.getenv\(\)\.entrySet\(\)[\s\S]{0,260}\.getValue\(\)'
