---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.7
composite_rules:
- for:
  - typescript
  id: github-token-name-with-environment-read
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: GitHub token name co-occurs with environment access
  all:
  - id: micro-behaviors/os/env/vcs::github-token-variable-reference
  - id: micro-behaviors/os/env/read::process-env
- for:
  - javascript
  - typescript
  - python
  - shell
  id: github-token-variable-reference
  desc: GitHub token variable indicators
  any:
  - id: micro-behaviors/os/env/secret-name::github-token-name-reference
  - id: micro-behaviors/os/env/vcs::gh-token-name-reference
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/app/ai/agent-runtime/bobi/
