defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: node-github-token-member
    desc: Accesses the GITHUB_TOKEN environment member
    if:
      type: symbol
      kind: member
      exact: process.env.GITHUB_TOKEN
    unless:
      - type: symbol
        kind: bind
        exact: process.env.GITHUB_TOKEN
  - id: node-gh-token-member
    desc: Accesses the GH_TOKEN environment member
    if:
      type: symbol
      kind: member
      exact: process.env.GH_TOKEN
    unless:
      - type: symbol
        kind: bind
        exact: process.env.GH_TOKEN

  # A generated program or fixture may quote this expression without reading
  # the host environment. Member facts above identify actual parsed access.
  - id: node-gh-token-code-literal
    for: [javascript, typescript, python, shell]
    desc: String contains Node GH_TOKEN env expression
    conf: 0.7
    if:
      type: literal
      substr: process.env.GH_TOKEN
