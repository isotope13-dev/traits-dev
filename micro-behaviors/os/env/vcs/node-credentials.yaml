defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: node-github-token-member
    desc: Accesses the GITHUB_TOKEN environment member
    if:
      type: symbol
      kind: member
      exact: process.env.GITHUB_TOKEN
    unless:
      - type: symbol
        kind: bind
        exact: process.env.GITHUB_TOKEN
  - id: node-gh-token-member
    desc: Accesses the GH_TOKEN environment member
    if:
      type: symbol
      kind: member
      exact: process.env.GH_TOKEN
    unless:
      - type: symbol
        kind: bind
        exact: process.env.GH_TOKEN
