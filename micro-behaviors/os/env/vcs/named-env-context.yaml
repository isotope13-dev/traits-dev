defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
composite_rules:
  - id: micro-behaviors/os/env/vcs::github-token-name-lookup-proximity
    desc: GitHub token name near an environment lookup
    crit: notable
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/os/env/secret-name::github-token-name-reference
    any:
      - id: micro-behaviors/os/env/read::os-getenv
      - id: micro-behaviors/os/env/read::std-env-var

