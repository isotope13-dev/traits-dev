defaults:
  platforms: [unix, android, ios]
  for: [shell]
traits:
  - id: shell-github-token-reference
    desc: $GITHUB_TOKEN shell environment access
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "\\$\\{?GITHUB_TOKEN\\}?"
    unless:
      - type: text
        substr: "x-access-token:${GITHUB_TOKEN}@github.com/"
      - type: text
        substr: "https://$GITHUB_TOKEN@github.com/"
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
      - id: well-known/tool/detection/security-scanner/
