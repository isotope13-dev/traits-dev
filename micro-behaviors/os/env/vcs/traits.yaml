defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell, pe, elf]
  crit: notable
  conf: 0.7
traits:
  - id: github-credentials
    desc: GitHub credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^(GITHUB_|GH_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: github-credentials-encoded
    desc: Encoded GitHub credential environment variables
    conf: 0.8
    if:
      type: encoded
      regex: (GITHUB_|GH_)[A-Z0-9_]*_(TOKEN|KEY|SECRET)
  - id: gitlab-credentials
    desc: GitLab credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^GITLAB_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: python-github-token-env-read
    desc: Python reads GITHUB_TOKEN environment variable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: GITHUB_TOKEN
  - id: python-gh-token-env-read
    desc: Python reads GH_TOKEN environment variable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: GH_TOKEN
  - id: python-github-pat-env-read
    desc: Python reads GITHUB_PAT environment variable
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: GITHUB_PAT
