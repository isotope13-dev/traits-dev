defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-env-serialization-to-define-map
    desc: Full Node environment serialized into define map
    conf: 0.99
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\.define\s*=\s*\{(?s:.{0,300})JSON\.stringify\s*\(\s*process\.env\s*\)'
