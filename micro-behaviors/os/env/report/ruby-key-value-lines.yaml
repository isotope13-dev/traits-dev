# Require the environment receiver, both block parameters in their original
# order, the literal equals separator, and a join on that same mapping.
# This describes record construction, not export or network transmission.
defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-environment-key-value-lines
    desc: Renders environment entries as key=value lines
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call
          receiver: (call
            receiver: (call receiver: (constant) @environment method: (identifier) @snapshot)
            method: (identifier) @map
            block: (block
              parameters: (block_parameters (identifier) @key (identifier) @value)
              body: (block_body
                (string (interpolation (identifier) @rendered_key)
                  (string_content) @separator
                  (interpolation (identifier) @rendered_value)))))
          method: (identifier) @join
          arguments: (argument_list (string (escape_sequence) @newline)))
          (#eq? @environment "ENV") (#match? @snapshot "^to_h(ash)?$")
          (#eq? @map "map") (#eq? @join "join")
          (#eq? @key @rendered_key) (#eq? @value @rendered_value)
          (#eq? @separator "=") (#eq? @newline "\\n"))
