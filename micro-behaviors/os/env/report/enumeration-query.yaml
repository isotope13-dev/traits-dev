defaults:
  platforms:
    - unix
    - windows
  for: [scripts]
  crit: notable
  conf: 0.6
  attack: T1082
traits:
  - id: printenv
    desc: printenv-named call reference
    # Match an executable command; unrelated same-named script functions do
    # not establish environment enumeration.
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '^(([^"''$`\\\r\n]*/)?printenv|"([^"$`\\\r\n]*/)?printenv"|''([^''\r\n]*/)?printenv'')$'
