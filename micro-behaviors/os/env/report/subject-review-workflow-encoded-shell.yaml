defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: gha-shell-hex-environment-output
    desc: Workflow logs hex-encoded environment dump
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?m)^\s*(env|printenv) *\| *(xxd *-p( *-c *\d+)?|od *-t *x\d*) *$'
