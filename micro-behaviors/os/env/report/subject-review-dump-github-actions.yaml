defaults:
  platforms: [unix, windows]
  for: [github-actions]
  mbc: C0034

traits:
  - id: gha-step-prints-environment
    desc: Workflow step prints the whole environment
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'run:\s*[>|-]?\s*(env|printenv)\b[^\n]{0,200}|run:\s*set\s*($|[|>])'
    not:
      # `env VAR=value cmd` sets variables for one command; it prints nothing.
      # Without this, the vendor-CLI auth idiom (`env DD_API_KEY=... ./tool`)
      # reads as an environment dump.
      - regex: '\benv\b[^|\n;&]{0,80}[A-Za-z_][A-Za-z0-9_]*='
