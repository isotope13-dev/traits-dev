defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  # Truthiness tests on an env read keep only whether a variable is set:
  # `if os.environ.get("X", "").strip():` to warn a key is still exported,
  # `any(os.environ.get(k) for k in KEYS)` to see which providers look
  # connected. The value itself is not what the test keeps.
  - id: python-env-presence-check
    desc: Python tests whether env vars are set
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b(if\s+(not\s+)?|any\(\s*|all\(\s*|bool\(\s*)os\.(environ\.get|getenv)\('
