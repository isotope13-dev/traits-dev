defaults:
  platforms: [windows]
  for: [pe, dll, csharp]

composite_rules:
  - id: dotnet-profiler-setting-presence-check
    desc: Tests whether the .NET profiler environment setting is present
    crit: notable
    conf: 0.94
    near_lines: 8
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/env/platform::dotnet-profiling-env-name
      - id: micro-behaviors/os/env/read::get-environment-variable-name-reference
