# Unit 42, ai-assisted-cybercrime-analysis, figure 7. These are settings of
# the actor's Cursor bridge, not claims about undocumented Cursor IDE APIs.
# Policy choices alone are neutral capabilities; do not infer cybercrime.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: notable
  conf: 0.96
traits:
  - id: cursor-bridge-agent-mode-setting
    desc: Cursor bridge agent-mode assignment
    if:
      type: text
      regex: '\bCURSOR_BRIDGE_MODE["'']?\s*[:=]\s*["'']agent["'']'
  - id: cursor-bridge-force-setting
    desc: Cursor bridge force-permission setting enabled
    if:
      type: text
      regex: '\bCURSOR_BRIDGE_FORCE["'']?\s*[:=]\s*["'']?true\b'
  - id: cursor-bridge-chat-workspace-disabled
    desc: Cursor bridge chat-only restriction disabled
    if:
      type: text
      regex: '\bCURSOR_BRIDGE_CHAT_ONLY_WORKSPACE["'']?\s*[:=]\s*["'']?false\b'
  - id: cursor-bridge-mcp-auto-approval
    desc: Cursor bridge MCP server auto-approval enabled
    if:
      type: text
      regex: '\bCURSOR_BRIDGE_APPROVE_MCPS["'']?\s*[:=]\s*["'']?true\b'
