defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, shell]
traits:
  - id: node-options-env
    desc: NODE_OPTIONS environment variable
    conf: 0.8
    if:
      type: text
      regex: '(?m)(process\.env\.NODE_OPTIONS|^\s*(export\s+)?NODE_OPTIONS\s*=)'
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: node-ld-preload-env
    desc: Node accesses LD_PRELOAD environment variable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env\.LD_PRELOAD\s*=|["'']LD_PRELOAD["'']\s*:\s*["'']|\bLD_PRELOAD\s*=\s*["'']'

  - id: node-preload-configuration
    desc: Node configuration references module preloading
    crit: notable
    conf: 0.95
    for: [shell, json, package.json, text, javascript, typescript]
    if:
      type: text
      regex: '\b(node|NODE_OPTIONS|node-options)["'' :=\t]{1,8}--(require|import)\b'
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
