defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, shell]
traits:
  - id: node-options-env
    desc: NODE_OPTIONS environment variable
    conf: 0.8
    if:
      type: text
      regex: '(?m)(process\.env\.NODE_OPTIONS|^\s*(export\s+)?NODE_OPTIONS\s*=)'
    unless:
      - id: metadata/package/testing/harness/runtime/
  # A preload flag installed through NODE_OPTIONS: the hijack setup itself, as
  # opposed to merely reading the variable (inspecting inherited flags to
  # adapt, sanitize, or forward) or documenting the `NODE_OPTIONS=<flag>`
  # shape in a comment. The flag must sit in the assigned value, so prose such
  # as "runtimes keep the `NODE_OPTIONS=--conditions` escape hatch" stays out.
  # `=[^=]` keeps `==` comparisons out (`!=` can never match); the leading
  # `\b` keeps longer names such as `MY_NODE_OPTIONS` out. Covers JS/TS
  # (`process.env.NODE_OPTIONS = '--require ...'`) and shell
  # (`export NODE_OPTIONS=--require ...`) spellings alike.
  # No test-harness carve-out here: assigning a preload flag is the setup
  # itself, and the S composite above already suppresses the known-good
  # setters (pnpm, VS Code debugger) plus test-harness contexts by identity.
  - id: node-options-preload-value
    desc: NODE_OPTIONS assigned a module preload flag
    conf: 0.9
    if:
      type: text
      regex: '\bNODE_OPTIONS\s*\+?=[^=]{0,80}--(require|import|experimental-loader|loader)\b'
  - id: node-ld-preload-env
    desc: Node accesses LD_PRELOAD environment variable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env\.LD_PRELOAD\s*=|["'']LD_PRELOAD["'']\s*:\s*["'']|\bLD_PRELOAD\s*=\s*["'']'
