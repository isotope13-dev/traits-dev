defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: node-pm2-env-check
  desc: Detects PM2 environment (NODE_APP_INSTANCE)
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: process\.env\.(NODE_APP_INSTANCE|pm2_env)|["']NODE_APP_INSTANCE["']
# Computed form (`process.env[pm2InstanceVar]`); moved from impact/wipe,
# where a runtime check said nothing about deletion.
- id: node-pm2-env-index-check
  desc: Reads a PM2-named environment variable
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'process\.env\[[^\]]{1,50}pm2[^\]]{0,20}\]'
