defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.8
  for: [scripts, binaries]
traits:
  - id: histfile-dev-null
    desc: HISTFILE=/dev/null assignment text
    if:
      type: text
      regex: (HISTFILE=/dev/null|export HISTFILE=/dev/null|export\s+HISTFILE=/dev/null)
    unless:
      - id: micro-behaviors/os/security/scan/signature::scanner-module-wording-context
  # The child-environment form: a launcher hands the shell it spawns an
  # environment whose history file is /dev/null.
  - id: python-env-histfile-dev-null
    desc: Child environment disables shell history
    for: [python]
    if:
      type: text
      regex: '\[\s*["'']HISTFILE["'']\s*\]\s*=\s*["'']/dev/null["'']'
  # A shell launched with readline's init file pointed at /dev/null reads no
  # user-writable configuration; it says nothing about history by itself.
  - id: inputrc-dev-null
    desc: INPUTRC=/dev/null assignment text
    for: [scripts]
    conf: 0.9
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])INPUTRC=/dev/null'
  - id: histfile-tmp-hidden
    desc: Sets HISTFILE to hidden temporary path
    for: [scripts]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])HISTFILE=(/tmp/\.|/var/tmp/\.)[^\s"''`]{1,40}'
    unless:
      - id: micro-behaviors/os/security/scan/signature::scanner-module-wording-context
  - id: histfile-tmp-hidden-native
    desc: ELF sets HISTFILE to hidden temp path
    for: [elf]
    platforms: [unix]
    if:
      type: raw
      section: .rodata
      regex: '(^|[^A-Za-z0-9_])HISTFILE=(/tmp/\.|/var/tmp/\.)[A-Za-z0-9_.-]{1,40}'
