# NODE_EXTRA_CA_CERTS set through the user session makes a root CA trusted by
# every Node process. Launch-agent and setx forms both persist for the session.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
  crit: notable
  conf: 0.95
  attack: T1553.004
traits:
  - id: node-extra-ca-certs-session-set
    desc: Sets NODE_EXTRA_CA_CERTS for user sessions
    if:
      type: text
      regex: '(launchctl setenv|setx) NODE_EXTRA_CA_CERTS\b'
