# Bash reads BASH_ENV before a non-interactive shell starts. This runtime
# configuration exists outside CI; build-pipeline objectives add the CI and
# modification evidence rather than classifying the variable as a CI signal.
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - typescript
  - ruby
  - go
  - binaries
  - github-actions

traits:
- id: bash-env-startup-file
  desc: BASH_ENV startup file variable
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BASH_ENV
# Keep assignment strings separate from variable references. Comments and
# deny-lists naming the variable do not establish an assignment payload.
- id: bash-env-assignment-string
  desc: String containing a BASH_ENV assignment
  crit: notable
  conf: 0.95
  for: [shell, python, javascript, typescript, ruby, go]
  if:
    # Parsed constants include echo/write payloads, but exclude source comments.
    # This is assignment text, not proof it was written or sourced by a shell.
    type: literal
    regex: 'BASH_ENV\s*='


