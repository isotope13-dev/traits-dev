# Bash reads BASH_ENV before a non-interactive shell starts. This runtime
# configuration exists outside CI; build-pipeline objectives add the CI and
# modification evidence rather than classifying the variable as a CI signal.
traits:
- id: bash-env-startup-file
  desc: BASH_ENV startup file variable
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - typescript
  - ruby
  - go
  - binaries
  - github-actions
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BASH_ENV
