# Bash reads BASH_ENV before a non-interactive shell starts. This runtime
# configuration exists outside CI; build-pipeline objectives add the CI and
# modification evidence rather than classifying the variable as a CI signal.
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - typescript
  - ruby
  - go
  - binaries
  - github-actions

traits:
- id: bash-env-startup-file
  desc: BASH_ENV startup file variable
  crit: notable
  conf: 0.9
  if:
    type: text
    word: BASH_ENV
- id: bash-env-cleared
  desc: Clears BASH_ENV environment variable
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'BASH_ENV=(["'']\s*["'']|\s*["''\r\n;|}])'
# Mentioning BASH_ENV is not redirecting it: deny-lists and exclusion sets
# name the variable without assigning it. The hijack needs an assignment.
- id: bash-env-assignment
  desc: BASH_ENV variable assignment
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'BASH_ENV\s*='


