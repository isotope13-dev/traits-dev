# Evidence describes ordinary capabilities or static properties.
traits:
- platforms:
  - windows
  - unix
  for:
  - python
  size_max: 131072
  id: pythonstartup-env-read
  desc: Reads the PYTHONSTARTUP environment setting
  crit: notable
  conf: 0.92
  unless:
  - id: metadata/package/testing/presence/harness/
  - type: basename
    exact: site.py
  - id: well-known/lib/web/server/pallets-flask::flask-cli-module-path
  - id: well-known/lib/runtime/scripted/pallets-click::pallets-click-library
  - id: well-known/lib/web/server/django::django-web-framework-package
  - id: metadata/file/naming::test-directory-component
  if:
    type: text
    regex: (os\.getenv|os\.environ(\.get|\[))[^\n]{0,80}PYTHONSTARTUP
