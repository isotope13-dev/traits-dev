defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-options-inherited-comparison
    desc: Compares a value against inherited NODE_OPTIONS
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '!==\s*process\.env\.NODE_OPTIONS'
  - id: node-options-child-env-override
    desc: Overrides NODE_OPTIONS in child environment
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'env:{...process.env,NODE_OPTIONS:'

