defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.9
traits:
  - id: elf-histsize-zero-text
    desc: Native binary contains HISTSIZE=0 text
    if:
      type: text
      substr: HISTSIZE=0
  - id: elf-unset-histfile-text
    desc: Native binary contains unset HISTFILE text
    if:
      type: text
      substr: unset HISTFILE
