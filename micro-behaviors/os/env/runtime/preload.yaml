# Relocated by the supported observation; matchers and scope preserved.
defaults:
  platforms:
  - unix
  - android
  crit: notable
traits:
- for:
  - elf
  - so
  - shell
  - c
  - cpp
  - objc
  - zig
  - php
  id: ld-preload-text-reference
  desc: LD_PRELOAD environment variable
  conf: 0.7
  if:
    type: text
    word: LD_PRELOAD
- for:
  - elf
  - so
  id: ld-preload-rodata-prefix
  desc: LD_PRELOAD at read-only section start
  conf: 0.95
  if:
    type: hex
    pattern: 4C 44 5F 50 52 45 4C 4F 41 44 00
    section: .rodata
    section_offset_range:
    - 0
    - 11
composite_rules:
- for:
  - elf
  - so
  - shell
  - c
  - cpp
  - objc
  - zig
  - php
  id: ld-preload
  desc: References the LD_PRELOAD loader variable
  conf: 0.8
  any:
  - id: micro-behaviors/os/env/runtime::ld-preload-text-reference
  - id: micro-behaviors/os/env/runtime::ld-preload-rodata-prefix
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/binary/linking/runtime::glibc-runtime-markers
  - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
