# SEE_MASK_NOZONECHECKS is read by the Windows shell when launching files; set
# to 1 it skips the attachment-manager zone check (Mark-of-the-Web prompt) for
# programs the process starts. The name alone is a reference, not a write.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: see-mask-nozonechecks-reference
    desc: References SEE_MASK_NOZONECHECKS override
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: SEE_MASK_NOZONECHECKS
