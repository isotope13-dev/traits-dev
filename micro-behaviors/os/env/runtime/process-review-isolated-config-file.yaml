defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: agent-config-env-pointer
    desc: Agent config path set via env variable
    if:
      type: text
      regex: '\b(env|environ)\b[.\[''"\s]{1,3}(OPENCODE|CODEX|GEMINI|CLAUDE)_CONFIG\b[^=\n]{0,8}='

