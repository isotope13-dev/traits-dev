defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: electron-run-as-node-env-injection
    desc: Sets ELECTRON_RUN_AS_NODE in child env
    crit: notable
    conf: 0.95
    platforms: [windows, macos, linux]
    attack: T1059.007
    if:
      type: text
      substr: ELECTRON_RUN_AS_NODE
  # Payload launchers set NODE_NO_WARNINGS so the spawned child stays
  # quiet; developers also set it to silence noisy builds. Neutral alone.
  - id: node-no-warnings-env
    desc: Disables Node.js warnings via environment
    conf: 0.93
    if:
      type: text
      regex: '\bNODE_NO_WARNINGS\s*[''"]?\s*[:=]\s*[''"]?(0x1|1|true)\b'
