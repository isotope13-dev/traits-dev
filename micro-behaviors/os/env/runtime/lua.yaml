# These names configure Lua runtimes, including ordinary PUC Lua. They do
# not identify LuaJIT, nor does their presence prove an environment read.
# Preserve the original binary/section scopes of the relocated observations.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9
  size_max: 50000000

traits:
  - id: lua-configuration-env-name
    desc: Lua LUA_NOENV or LUA_CPATH environment name
    platforms: [windows, unix]
    for: [binaries]
    size_min: 100000
    if:
      type: text
      regex: '\bLUA_(NOENV|CPATH)\b'
      section: rdata

  - id: lua-init-env-name
    desc: Lua LUA_INIT startup environment name
    if:
      type: text
      exact: LUA_INIT
      section: rdata
