defaults:
  platforms: [windows, unix]
  for: [scripts, elf, macho]
traits:
  - id: histfilesize-zero-setting
    desc: HISTFILESIZE=0 history file setting reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bHISTFILESIZE=0\b'
    unless:
      - id: metadata/build/generated::generated-attack-map-context
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
