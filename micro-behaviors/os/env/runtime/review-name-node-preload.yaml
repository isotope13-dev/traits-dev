# Assignment-purpose review; matcher and effective scope preserved.
---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - shell
traits:
- id: node-options-preload-assignment-text
  desc: NODE_OPTIONS preload assignment syntax
  conf: 0.9
  if:
    type: text
    regex: "\\bNODE_OPTIONS\\s*\\+?=[^=]{0,80}--(require|import|experimental-loader|loader)\\b"
