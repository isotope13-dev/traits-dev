defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  - id: histsize-zero-setting
    desc: HISTSIZE=0 shell history setting reference
    crit: notable
    conf: 0.9


    if:
      type: text
      substr: HISTSIZE=0
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: metadata/package/files/system-package::zsh-function-script
      - id: micro-behaviors/process/tty/pty::terminal-runner-history-isolation
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-path
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
      - id: micro-behaviors/process/create/shell/interactive::login-shell-probe-history-isolation
      - id: metadata/package/tooling::azure-agentbaker-tree
