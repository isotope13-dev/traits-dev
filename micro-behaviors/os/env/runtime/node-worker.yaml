defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-worker-env-reference
    desc: References a Node worker environment flag
    crit: notable
    conf: 0.84
    unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
    - type: text
      substr: FUNCTIONS_WORKER_RUNTIME
    if:
      type: text
      regex: 'process\.env\.[A-Z0-9_]+_WORKER\b'
