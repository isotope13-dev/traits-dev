defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.7
traits:
- id: python-environ-any-marker-filter
  desc: Filters env keys against a marker list
  crit: baseline
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (?is)any\(\s*\w+\s+in\s+\w+\.(upper|lower)\(\)\s+for\s+\w+\s+in\s+\w+
- id: python-environ-credential-filter
  desc: Python env membership credential marker
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: in\s+os\.environ[^\w.][\s\S]{0,100}["'](SECRET|TOKEN|KEY)
composite_rules:
- id: python-environ-marker-set-filter
  desc: Python filters environment keys by credential markers
  crit: notable
  conf: 0.94
  for:
  - python
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-items-loop
  - id: micro-behaviors/os/env/credential/selection::python-environ-any-marker-filter
  - id: micro-behaviors/os/env/credential/name::python-environ-credential-marker-set
- id: python-environ-credential-keyword-filter
  desc: Python environment access uses credential-named keys
  crit: notable
  conf: 0.9
  for:
  - python
  any:
  - id: micro-behaviors/os/env/credential/name::python-env-keyword-key
  - id: micro-behaviors/os/env/credential/name::python-env-keyword-token
  - id: micro-behaviors/os/env/credential/name::python-env-keyword-secret
- id: python-environ-alias-items-credential-filter
  desc: Aliased Python env entries are filtered for credentials
  crit: notable
  conf: 0.94
  for:
  - python
  all:
  - id: micro-behaviors/os/env/enumerate/entries::environ-alias-items-loop
  any:
  - id: micro-behaviors/os/env/credential/name::python-environ-alias-items-secret-marker
  - id: micro-behaviors/os/env/credential/name::python-environ-alias-items-password-marker
- id: python-environ-credential-name-filter
  desc: Selects credential-named environment entries
  crit: notable
  conf: 0.92
  for:
  - python
  any:
  - id: micro-behaviors/os/env/credential/selection::python-environ-credential-filter
  - id: micro-behaviors/os/env/credential/selection::python-environ-credential-selection
  - id: micro-behaviors/os/env/credential/selection::python-normalized-environ-marker-selection
  - id: micro-behaviors/os/env/credential/selection::python-environ-alias-items-credential-filter
