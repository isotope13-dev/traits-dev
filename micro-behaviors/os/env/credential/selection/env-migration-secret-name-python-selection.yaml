- id: python-normalized-environ-marker-selection
  desc: Selects env entries by normalized keys
  if:
    type: tree-sitter
    query: "((block\n   (expression_statement (assignment left: (identifier) @markers\n     right: [(tuple (string) @term) (list (string) @term)\n       (assignment right: [(tuple (string) @term) (list (string) @term)])]))\n   (for_statement left: (pattern_list . (identifier) @key (identifier) .)\n     right: (call function: (_) @items)\n     body: (block\n       (expression_statement (assignment left: (identifier) @normalized\n         right: (call function: (attribute object: (identifier) @original\n           attribute: (identifier) @normalize) arguments: (argument_list))))\n       (if_statement condition: (call function: (identifier) @any\n         arguments: (generator_expression\n           body: (comparison_operator (identifier) @needle operators: \"in\" (identifier) @subject)\n           (for_in_clause left: (identifier) @entry right: (identifier) @list))))))) @filter\n  (#match? @items \"^(os\\\\.)?environ\\\\.items$\")\n  (#match? @term \"(?i)(key|token|secret|password|passwd|credential)\"\
      )\n  (#match? @normalize \"^(upper|lower|casefold)$\")\n  (#eq? @any \"any\") (#eq? @key @original) (#eq? @normalized @subject)\n  (#eq? @needle @entry) (#eq? @markers @list))\n"
