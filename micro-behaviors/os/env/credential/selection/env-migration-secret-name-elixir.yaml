defaults:
  for:
  - elixir
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.95
  attack: T1552.001
traits:
- id: elixir-secret-environment-selection
  desc: Selects secret-named process environment entries
  if:
    type: tree-sitter
    query: "((binary_operator\n  left: (call\n    target: (dot left: (alias) @system right: (identifier) @getenv)\n    (arguments) @noargs)\n  \"|>\"\n  right: (call\n    target: (dot left: (alias) @enum right: (identifier) @filter)\n    (arguments (anonymous_function (stab_clause\n      left: (arguments (tuple (identifier) @key (identifier)))\n      right: (body . (binary_operator\n        left: (identifier) @tested\n        \"=~\"\n        right: (sigil (sigil_name) @sigil (quoted_content) @pattern)) .))))))\n  (#eq? @system \"System\")\n  (#eq? @getenv \"get_env\")\n  (#match? @noargs \"^\\\\(\\\\s*\\\\)$\")\n  (#eq? @enum \"Enum\")\n  (#eq? @filter \"filter\")\n  (#eq? @key @tested)\n  (#eq? @sigil \"r\")\n  (#match? @pattern \"(?i)TOKEN|SECRET|PASSWORD\"))\n"
