defaults:
  platforms:
  - unix
  - windows
  for:
  - github-actions
traits:
- id: complete-secrets-json-expression
  for:
  - github-actions
  - shell
  - javascript
  - typescript
  desc: Serializes complete GitHub Actions secrets
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)\$\{\{\s*toJSON\s*\(\s*secrets\s*\)\s*\}\}
  unless:
  - id: well-known/app/infrastructure/pulumi::github-secrets-export-action
  - id: well-known/app/infrastructure/pytorch-test-infra::secrets-env-runner-script
  - id: well-known/app/infrastructure/wads::wads-ci-context
  - id: well-known/app/infrastructure/zizmor::zizmor-test-data-path
  - id: well-known/app/infrastructure/openremote::openremote-deploy-context
  - id: well-known/app/infrastructure/opentelemetry-github::opentelemetry-github-ci-context
- id: step-env-complete-secrets-json
  desc: Step env binds complete Actions secrets
  crit: notable
  conf: 0.96
  if:
    type: value
    path: jobs.*.steps[*].env.*
    regex: (?i)\$\{\{\s*toJSON\s*\(\s*secrets\s*\)\s*\}\}
- id: job-env-complete-secrets-json
  desc: Job env binds complete Actions secrets
  crit: notable
  conf: 0.96
  if:
    type: value
    path: jobs.*.env.*
    regex: (?i)\$\{\{\s*toJSON\s*\(\s*secrets\s*\)\s*\}\}
composite_rules:
- id: complete-secrets-bound-to-env
  desc: Binds complete Actions secrets to environment
  crit: notable
  conf: 0.96
  any:
  - id: micro-behaviors/os/env/credential/ci::step-env-complete-secrets-json
  - id: micro-behaviors/os/env/credential/ci::job-env-complete-secrets-json
