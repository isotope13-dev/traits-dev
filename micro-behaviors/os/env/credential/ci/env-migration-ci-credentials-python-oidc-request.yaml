defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.96
traits:
- id: python-actions-oidc-getenv-request
  desc: Builds GitHub Actions OIDC request URL
  if:
    type: symbol
    kind: call
    regex: ^(urllib\.request\.(Request|urlopen)|(requests|httpx)\.get)$
    arg:
      index: 0
      from:
        call: ^(os\.)?(getenv|environ\.get)$
        argument: 0
        literal: ^ACTIONS_ID_TOKEN_REQUEST_URL$
- id: python-actions-oidc-indexed-request
  desc: Builds GitHub Actions OIDC request URL
  if:
    type: text
    regex: \b(Request|urlopen|requests\.get)\(\s*os\.environ\[['"]ACTIONS_ID_TOKEN_REQUEST_URL['"]\]
    exclude_comments: true
composite_rules:
- id: python-actions-oidc-request
  desc: Builds GitHub Actions OIDC request URL
  any:
  - id: micro-behaviors/os/env/credential/ci::python-actions-oidc-getenv-request
  - id: micro-behaviors/os/env/credential/ci::python-actions-oidc-indexed-request
