defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - ruby
  - java
  crit: notable
traits:
- id: node-sdk-developer-key-env
  desc: Reads SDK developer key from Node environment
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: process\.env\.(DEV_KEY|DEVELOPER_KEY|SDK_KEY)
