defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
  - pe
  - elf
  crit: notable
  conf: 0.7
traits:
- id: openai-api-key-name-reference
  desc: References OPENAI_API_KEY env variable
  conf: 0.9
  for:
  - scripts
  - source
  - pe
  - elf
  if:
    type: text
    word: OPENAI_API_KEY
- id: anthropic-api-key-name-reference
  desc: References ANTHROPIC_API_KEY env variable
  conf: 0.9
  for:
  - scripts
  - source
  - pe
  - elf
  if:
    type: text
    word: ANTHROPIC_API_KEY
- id: gemini-api-key-name-reference
  desc: References GEMINI_API_KEY env variable
  conf: 0.9
  for:
  - scripts
  - source
  - pe
  - elf
  if:
    type: text
    word: GEMINI_API_KEY
- id: openrouter-api-key-name-reference
  desc: References OPENROUTER_API_KEY env variable
  conf: 0.9
  for:
  - scripts
  - source
  - pe
  - elf
  if:
    type: text
    word: OPENROUTER_API_KEY
- id: ai-api-credentials
  desc: AI service API credentials
  conf: 0.7
  if:
    type: text
    regex: ^(OPENAI_|ANTHROPIC_|OPENROUTER_).{0,50}_(TOKEN|KEY|SECRET)$
composite_rules:
- id: ai-provider-key-env-reference
  desc: References an AI provider API key env variable
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/credential/service::openai-api-key-name-reference
  - id: micro-behaviors/os/env/credential/service::anthropic-api-key-name-reference
  - id: micro-behaviors/os/env/credential/service::gemini-api-key-name-reference
  - id: micro-behaviors/os/env/credential/service::openrouter-api-key-name-reference
  - id: micro-behaviors/os/env/credential/service::ai-api-credentials
