defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
traits:
- id: n8n-encryption-key-name
  desc: n8n encryption-key environment name
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (^|[^A-Z0-9_])N8N_ENCRYPTION_KEY([^A-Z0-9_]|$)
- id: javascript-credential-env-reference
  desc: JavaScript credential env var reference
  conf: 0.85
  if:
    type: tree-sitter
    language: javascript
    query: "((member_expression\n  object: (member_expression\n    object: (identifier) @process\n    property: (property_identifier) @env)\n  property: (property_identifier) @name) @read\n(#eq? @process \"process\")\n(#eq? @env \"env\")\n(#match? @name \"(?i)((API|PRIVATE|LICENSE|ACCESS)[_-]?KEY|TOKEN|SECRET|PASSWORD)$\")\n(#not-match? @name \"(?i)^(NEXT_PUBLIC_|VITE_|REACT_APP_)|PUBLIC_KEY\"))\n"
- id: javascript-artifactory-reader-credential-env-reference
  desc: Reads Artifactory reader credential env names
  conf: 0.9
  if:
    type: tree-sitter
    language: javascript
    query: "((member_expression\n  object: (member_expression\n    object: (identifier) @process\n    property: (property_identifier) @env)\n  property: (property_identifier) @name) @read\n(#eq? @process \"process\")\n(#eq? @env \"env\")\n(#match? @name \"(?i)_READER_(USERNAME|PASSWORD)$\"))\n"
