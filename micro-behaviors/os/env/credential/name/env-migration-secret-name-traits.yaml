defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.7
traits:
- id: python-environ-credential-marker-set
  desc: Defines credential environment name markers
  crit: baseline
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (?is)\w+\s*=\s*[\[(][^\])]{0,180}(KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL|AUTH|PRIVATE)
- id: python-environ-alias-items-secret-marker
  desc: Aliased env iteration uses secret markers
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: (?is)environ\.items\(\).{0,220}["'][^"'\r\n]{0,24}(TOKEN|SECRET|KEY)
- id: python-environ-alias-items-password-marker
  desc: Aliased env iteration uses password markers
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: (?is)environ\.items\(\).{0,220}["'][^"'\r\n]{0,24}(PASSWORD|CREDENTIAL)
- id: python-reader-username-env-suffix
  desc: Env key ends with _READER_USERNAME
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: literal
    kind: string
    regex: _READER_USERNAME$
- id: python-reader-password-env-suffix
  desc: Env key ends with _READER_PASSWORD
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: literal
    kind: string
    regex: _READER_PASSWORD$
- id: python-env-keyword-key
  desc: Python getenv name contains KEY
  crit: notable
  conf: 0.88
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(os\.)?(getenv|environ\.get)$
    arg:
      kind: string
      regex: (?i)KEY
- id: python-env-keyword-token
  desc: Reads a TOKEN-suffixed environment variable
  crit: notable
  conf: 0.88
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(os\.)?(getenv|environ\.get)$
    arg:
      index: 0
      kind: string
      regex: (?i)^([A-Z0-9]+_)*TOKEN$
- id: python-env-keyword-secret
  desc: Python getenv name contains SECRET
  crit: notable
  conf: 0.88
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(os\.)?(getenv|environ\.get)$
    arg:
      kind: string
      regex: (?i)SECRET
- id: jwt-secret
  desc: Reads JWT_SECRET from the process environment
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: member
    exact: process.env.JWT_SECRET
- id: session-secret
  desc: Accesses the SESSION_SECRET environment member
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: member
    exact: process.env.SESSION_SECRET
- id: cookie-secret
  desc: COOKIE_SECRET environment variable
  if:
    type: text
    word: COOKIE_SECRET
- id: root-password
  desc: ROOT_PASSWORD environment variable
  if:
    type: text
    word: ROOT_PASSWORD
- id: admin-password
  desc: ADMIN_PASSWORD environment variable
  if:
    type: text
    word: ADMIN_PASSWORD
  unless:
  - id: metadata/build/scaffold::antlr-generated-parser
- id: smbhash
  desc: SMBHASH environment variable
  crit: suspicious
  conf: 0.9
  attack: T1550.002
  if:
    type: text
    word: SMBHASH
    section: .rodata
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: service-account-key
  desc: SERVICE_ACCOUNT_KEY environment variable
  if:
    type: text
    word: SERVICE_ACCOUNT_KEY
- id: service-credential-env-var
  desc: Reads secret-like credential env variable
  conf: 0.86
  for:
  - javascript
  - typescript
  ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
  if:
    type: tree-sitter
    query: "((member_expression\n  object: (member_expression\n    object: (identifier) @process\n    property: (property_identifier) @env)\n  property: (property_identifier) @name) @access\n  (#eq? @process \"process\")\n  (#eq? @env \"env\")\n  (#match? @name \"^[A-Z][A-Z0-9_]{0,40}_(PASSWORD|CLIENT_SECRET|API_KEY|AUTH_TOKEN)$\")\n  (#not-match? @name \"^(NEXT_PUBLIC_|PUBLIC_|VITE_|EXPO_PUBLIC_|REACT_APP_)\"))\n"
  unless:
  - id: metadata/lang/generated::codegen-source-path
  - id: well-known/app/browser/google-web::official-google-web-asset
  - id: metadata/file/format/source-map::sourcemap-sources-content
- id: system-env-token-name
  desc: System environment TOKEN variable
  crit: notable
  if:
    type: text
    regex: (System\.getenv|GetEnvironmentVariable)\s*\([^)]{0,60}TOKEN
- id: keyword-secret
  desc: SECRET-named environment variable
  crit: notable
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(os\.getenv|os\.environ\.get)$
    arg:
      kind: string
      substr: SECRET
- id: keyword-auth
  desc: Python reads AUTH-named environment variable
  crit: notable
  conf: 0.86
  for:
  - python
  if:
    type: text
    regex: os\.(getenv|environ\.get)\s*\([^)]{0,60}AUTH
- id: keyword-cred
  desc: CRED environment access pattern
  crit: notable
  if:
    type: text
    regex: (?i)\b(getenv|environ(\.get)?|process\.env)\b[^;\n]{0,40}\bCRED(ENTIALS)?\b
  unless:
  - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
composite_rules:
- id: python-sensitive-env-read
  desc: Reads credential-named environment variable
  crit: notable
  conf: 0.9
  for:
  - python
  all:
  - id: micro-behaviors/os/env/read::python-os-getenv-call
  any:
  - id: micro-behaviors/os/env/credential/name::python-env-keyword-key
  - id: micro-behaviors/os/env/credential/name::python-env-keyword-secret
  - id: micro-behaviors/os/env/read::python-env-snapshot-sensitive-mapping-get
  - id: micro-behaviors/os/env/credential/vcs::python-github-token-env-read
  - id: micro-behaviors/os/env/credential/vcs::python-gh-token-env-read
  - id: micro-behaviors/os/env/credential/vcs::python-github-pat-env-read
  - id: micro-behaviors/os/env/credential/name::keyword-secret
  - id: micro-behaviors/os/env/credential/name::keyword-auth
  - id: micro-behaviors/os/env/credential/name::keyword-cred
  near_lines: 4
- id: credential-env-read
  desc: Reads a credential-bearing environment variable
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/credential/cloud/
  - id: micro-behaviors/os/env/config/service::postinstall-ecs-metadata-uri-reference
  - id: micro-behaviors/os/env/config/service::gyp-container-env-var-references
  - id: micro-behaviors/data/serialize/schema-credential::script-aws-credential-parameter-name
  - id: micro-behaviors/os/env/credential/name::aws-secret-access-key-env-read
  - id: micro-behaviors/os/env/credential/name::python-aws-secret-access-key-env-read
  - id: micro-behaviors/os/env/credential/vcs
  - id: metadata/lang/source/naming/secret::github-token-name-reference
  - id: micro-behaviors/os/env/credential/database
  - id: micro-behaviors/os/env/credential/ai/
  - id: micro-behaviors/os/env/config/ai/
  - id: micro-behaviors/os/env/credential/name::python-api-key-env-read
  - id: micro-behaviors/os/env/credential/service::env-discord-token
  - id: micro-behaviors/os/env/credential/service::env-discord-bot-token
  - id: micro-behaviors/os/env/credential/service::env-discord-client-secret
  - id: micro-behaviors/os/env/credential/service::env-slack-bot-token
  - id: micro-behaviors/os/env/credential/service::env-slack-api-key
  - id: micro-behaviors/os/env/credential/service::env-slack-webhook
  - id: micro-behaviors/os/env/credential/service::python-discord-token-getenv
  - id: micro-behaviors/os/env/credential/registry::package-registry-credential-env-read
  - id: micro-behaviors/os/env/credential/name::ssh-private-key-dup
  - id: micro-behaviors/os/env/credential/name::javascript-private-key-environment-variable
