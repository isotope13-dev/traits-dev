defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - markdown
  - batch
  - powershell
  crit: notable
traits:
- id: credential-env-var-assignment
  desc: Assigns credential-named environment variable
  conf: 0.85
  if:
    type: text
    regex: (?m)^[ \t]*(export |set |\$env:)[A-Z][A-Z0-9_]*_(TOKEN|API_KEY|SECRET)=
