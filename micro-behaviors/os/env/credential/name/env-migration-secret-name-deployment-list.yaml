defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
composite_rules:
- id: deployment-secret-name-list
  desc: Deployment secret variable name references
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/credential/name::npm-docker-credential-var-name
  - id: metadata/lang/source/naming/secret::cloudflare-database-credential-var-name
  - id: micro-behaviors/os/env/credential/ai::netlify-openai-credential-var-name
  - id: micro-behaviors/os/env/credential/name::ssh-key-credential-var-name
  - id: micro-behaviors/os/env/credential/cloud::aws-secret-access-key-var
  - id: micro-behaviors/os/env/credential/cloud::aws-env-secret-vars
  - id: micro-behaviors/os/env/credential/name::ssh-private-key-dup
  - id: micro-behaviors/os/env/credential/ai::anthropic-api-key-name-reference
  - id: micro-behaviors/os/env/credential/ai::gemini-api-key-name-reference
  - id: micro-behaviors/os/env/credential/ai::anthropic-auth-token-variable
