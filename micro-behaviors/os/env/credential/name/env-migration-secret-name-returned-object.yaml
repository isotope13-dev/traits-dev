defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: javascript-returned-credential-env-object
  desc: Returns object with credential environment read
  conf: 0.95
  if:
    type: tree-sitter
    query: "((return_statement\n  (object\n    (pair value: (member_expression\n      object: (member_expression\n        object: (identifier) @process\n        property: (property_identifier) @env)\n      property: (property_identifier) @credential)))) @returned\n  (#eq? @process \"process\")\n  (#eq? @env \"env\")\n  (#match? @credential \"(?i)(TOKEN|SECRET|KEY|PASS)\"))\n"
