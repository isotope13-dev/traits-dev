defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  for:
  - python
  - powershell
  - shell
traits:
- id: registry-and-vcs-token-alias-name
  desc: Registry or VCS token alias variable name
  if:
    type: text
    regex: (?i)\b(GH_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|GITLAB_TOKEN)\b
composite_rules:
- id: vcs-registry-token-name
  desc: VCS or package-registry token variable name
  any:
  - id: metadata/lang/source/naming/secret::github-token-name-reference
  - id: micro-behaviors/os/env/credential/registry::registry-and-vcs-token-alias-name
