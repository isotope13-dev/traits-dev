defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.7
traits:
- id: python-environ-alias-items-password-marker
  desc: Env iteration near password markers
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: (?is)environ\.items\(\)[^}]{0,220}["'][^"'\r\n]{0,24}(PASSWORD|CREDENTIAL)
- id: root-password
  desc: ROOT_PASSWORD environment variable
  if:
    type: text
    word: ROOT_PASSWORD
- id: admin-password
  desc: ADMIN_PASSWORD environment variable
  if:
    type: text
    word: ADMIN_PASSWORD
  unless:
  - id: metadata/build/scaffold::antlr-generated-parser
