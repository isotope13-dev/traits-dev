defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.7
composite_rules:
- id: github-token-name-with-environment-read
  for:
  - typescript
  unless:
  - id: metadata/package/testing/corpus/labeled::inert-security-input-module
  desc: GitHub token name co-occurs with environment access
  near_bytes: 512
  all:
  - id: micro-behaviors/os/env/credential/vcs::github-token-variable-reference
  - id: micro-behaviors/os/env/read/current::process-env
- id: github-token-variable-reference
  for:
  - javascript
  - typescript
  - python
  - shell
  desc: GitHub token variable indicators
  any:
  - id: metadata/lang/source/naming/secret::github-token-name-reference
  - id: micro-behaviors/os/env/credential/vcs::gh-token-name-reference
