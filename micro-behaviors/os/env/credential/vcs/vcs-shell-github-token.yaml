defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
traits:
- id: shell-github-token-reference
  desc: $GITHUB_TOKEN shell environment access
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \$\{?GITHUB_TOKEN\}?
  unless:
  - type: text
    substr: x-access-token:${GITHUB_TOKEN}@github.com/
  - type: text
    substr: https://$GITHUB_TOKEN@github.com/
  - id: micro-behaviors/os/security/scan/documentation/
- id: shell-github-url-token-credential
  desc: Shell token embedded in GitHub URL
  crit: notable
  conf: 0.9
  # Any variable name: a git push URL that carries the token in its
  # credential position stores it in process arguments and remotes.
  if:
    type: text
    regex: x-access-token:\$\{?[A-Za-z_]+\}?@github[.]com/
