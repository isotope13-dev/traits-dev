defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  - shell
traits:
- id: node-gitlab-token-code-literal
  desc: String contains Node GITLAB_TOKEN env expression
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.GITLAB_TOKEN
- id: node-bitbucket-token-code-literal
  desc: String contains Node BITBUCKET_TOKEN env expr
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.BITBUCKET_TOKEN
composite_rules:
- id: node-source-control-token-code-literal
  desc: Source-control token expressions in strings
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/credential/vcs::node-gitlab-token-code-literal
  - id: micro-behaviors/os/env/credential/vcs::node-gh-token-code-literal
  - id: micro-behaviors/os/env/credential/vcs::node-bitbucket-token-code-literal
