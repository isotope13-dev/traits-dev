defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-openai-anthropic-key-env-read
  desc: Python reads OpenAI or Anthropic API key
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: ^(os\.)?(getenv|environ\.get)$
    arg:
      kind: string
      regex: ^(OPENAI_API_KEY|ANTHROPIC_API_KEY)$
composite_rules:
- id: python-ai-provider-key-env-read
  desc: Python reads an AI provider API key
  crit: notable
  conf: 0.95
  any:
  - id: micro-behaviors/os/env/credential/ai::python-openai-anthropic-key-env-read
  - id: micro-behaviors/os/env/credential/ai::python-azure-api-key-env-read
