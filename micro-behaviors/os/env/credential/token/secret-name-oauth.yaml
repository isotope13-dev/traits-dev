defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
traits:
- id: refresh-token-env-name
  desc: OAuth refresh-token environment variable
  crit: notable
  conf: 0.94
  if:
    type: literal
    kind: string
    regex: ^[A-Z0-9_]*REFRESH_TOKEN$
  not:
    # Firebase Auth error code, not a variable name.
    - exact: INVALID_REFRESH_TOKEN
