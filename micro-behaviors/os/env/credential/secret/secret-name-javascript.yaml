defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
traits:
- id: n8n-encryption-key-name
  desc: n8n encryption-key environment name
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (^|[^A-Z0-9_])N8N_ENCRYPTION_KEY([^A-Z0-9_]|$)
- id: javascript-credential-env-reference
  desc: JavaScript credential env var reference
  conf: 0.85
  if:
    type: tree-sitter
    language: javascript
    query: |
      ((member_expression
        object: (member_expression
          object: (identifier) @process
          property: (property_identifier) @env)
        property: (property_identifier) @name) @read
      (#eq? @process "process")
      (#eq? @env "env")
      (#match? @name "(?i)((API|PRIVATE|LICENSE|ACCESS)[_-]?KEY|TOKEN|SECRET|PASSWORD)$")
      (#not-match? @name "(?i)^(NEXT_PUBLIC_|VITE_|REACT_APP_)|PUBLIC_KEY"))
