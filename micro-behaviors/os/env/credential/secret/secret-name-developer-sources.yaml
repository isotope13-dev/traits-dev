defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - go
  - rust
  - perl
  - javascript
  - typescript
  - powershell
  - c
  - cpp
composite_rules:
- id: micro-behaviors/os/env/credential/secret::developer-credential-environment-references
  desc: References developer credentials in the environment
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/os/env/credential/registry::npm-token-name-ref
  - id: micro-behaviors/os/env/credential/cloud::aws-secret-access-key-env-read
  - id: micro-behaviors/os/env/credential/vcs::node-source-control-token-code-literal
  - id: micro-behaviors/os/env/credential/vcs::github-token-name-with-environment-read
  - id: micro-behaviors/os/env/credential/vcs::shell-github-token-reference
  - id: micro-behaviors/os/env/credential/vcs::python-github-token-env-read
  - id: micro-behaviors/os/env/credential/vcs::github-token-name-lookup-proximity
  - id: micro-behaviors/os/env/credential/registry::node-registry-token-env-read
  - id: micro-behaviors/os/env/credential/cloud::node-aws-secret-member
  - id: micro-behaviors/os/env/credential/cloud::node-aws-access-key-member
  - id: micro-behaviors/os/env/enumerate/filter::shell-env-cloud-prefix-filter
  - id: micro-behaviors/os/env/credential/cloud::go-aws-secret-env-var
