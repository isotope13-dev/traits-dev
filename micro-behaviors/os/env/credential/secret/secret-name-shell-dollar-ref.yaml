defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
traits:
- id: shell-secret-env-dollar-ref
  desc: Shell expands secret-named variable
  conf: 0.85
  if:
    type: text
    regex: \$\{?[A-Z][A-Z0-9_]{0,48}(SECRET|PASSWORD|PASSWD|TOKEN|APIKEY|_KEY)[A-Z0-9_]*\}?
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
