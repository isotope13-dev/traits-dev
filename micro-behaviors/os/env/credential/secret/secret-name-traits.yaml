defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.7
traits:
- id: python-environ-any-marker-filter
  desc: Filters env keys against a marker list
  crit: baseline
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (?is)any\(\s*\w+\s+in\s+\w+\.(upper|lower)\(\)\s+for\s+\w+\s+in\s+\w+
- id: python-environ-credential-marker-set
  desc: Defines credential environment name markers
  crit: baseline
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (?is)\w+\s*=\s*[\[(][^\])]{0,180}(KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL|AUTH|PRIVATE)
- id: python-environ-credential-filter
  desc: Python env membership credential marker
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: in\s+os\.environ[^\w.][\s\S]{0,100}["'](SECRET|TOKEN|KEY)
- id: python-environ-alias-items-secret-marker
  desc: Aliased env iteration uses secret markers
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: (?is)environ\.items\(\).{0,220}["'][^"'\r\n]{0,24}(TOKEN|SECRET|KEY)
- id: python-env-keyword-key
  desc: Python getenv name contains KEY
  crit: notable
  conf: 0.88
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(os\.)?(getenv|environ\.get)$
    arg:
      kind: string
      regex: (?i)KEY
- id: python-env-keyword-secret
  desc: Python getenv name contains SECRET
  crit: notable
  conf: 0.88
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(os\.)?(getenv|environ\.get)$
    arg:
      kind: string
      regex: (?i)SECRET
- id: service-account-key
  desc: SERVICE_ACCOUNT_KEY environment variable
  if:
    type: text
    word: SERVICE_ACCOUNT_KEY
- id: service-credential-env-var
  desc: Reads secret-like credential env variable
  conf: 0.86
  for:
  - javascript
  - typescript
  ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
  if:
    type: tree-sitter
    query: |
      ((member_expression
        object: (member_expression
          object: (identifier) @process
          property: (property_identifier) @env)
        property: (property_identifier) @name) @access
        (#eq? @process "process")
        (#eq? @env "env")
        (#match? @name "^[A-Z][A-Z0-9_]{0,40}_(PASSWORD|CLIENT_SECRET|API_KEY|AUTH_TOKEN)$")
        (#not-match? @name "^(NEXT_PUBLIC_|PUBLIC_|VITE_|EXPO_PUBLIC_|REACT_APP_)"))
  unless:
  - id: metadata/lang/generated::codegen-source-path
  - id: well-known/app/browser/google-web::official-google-web-asset
  - id: metadata/file/format/source-map::sourcemap-sources-content
- id: keyword-secret
  desc: SECRET-named environment variable
  crit: notable
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: ^(os\.getenv|os\.environ\.get)$
    arg:
      kind: string
      substr: SECRET
- id: keyword-auth
  desc: Python reads AUTH-named environment variable
  crit: notable
  conf: 0.86
  for:
  - python
  if:
    type: text
    regex: os\.(getenv|environ\.get)\s*\([^)]{0,60}AUTH
- id: keyword-cred
  desc: CRED environment access pattern
  crit: notable
  if:
    type: text
    regex: (?i)\b(getenv|environ(\.get)?|process\.env)\b[^;\n]{0,40}\bCRED(ENTIALS)?\b
  unless:
  - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
composite_rules:
- id: python-environ-marker-set-filter
  desc: Python filters environment keys by credential markers
  crit: notable
  conf: 0.94
  for:
  - python
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/env/enumerate/entries::python-environ-items-loop
  - id: micro-behaviors/os/env/credential/secret::python-environ-any-marker-filter
  - id: micro-behaviors/os/env/credential/secret::python-environ-credential-marker-set
- id: python-environ-credential-keyword-filter
  desc: Python environment access uses credential-named keys
  crit: notable
  conf: 0.9
  for:
  - python
  any:
  - id: micro-behaviors/os/env/credential/secret::python-env-keyword-key
  - id: micro-behaviors/os/env/credential/token::python-env-keyword-token
  - id: micro-behaviors/os/env/credential/secret::python-env-keyword-secret
- id: python-environ-alias-items-credential-filter
  desc: Aliased Python env entries are filtered for credentials
  crit: notable
  conf: 0.94
  for:
  - python
  all:
  - id: micro-behaviors/os/env/enumerate/entries::environ-alias-items-loop
  any:
