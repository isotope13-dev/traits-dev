  - id: micro-behaviors/os/env/credential/password::python-environ-alias-items-password-marker
- id: python-environ-credential-name-filter
  desc: Selects credential-named environment entries
  crit: notable
  conf: 0.92
  for:
  - python
  any:
  - id: micro-behaviors/os/env/credential/secret::python-environ-credential-filter
  - id: micro-behaviors/os/env/credential/secret::python-environ-credential-selection
  - id: micro-behaviors/os/env/credential/secret::python-normalized-environ-marker-selection
  - id: micro-behaviors/os/env/credential/secret::python-environ-alias-items-credential-filter
- id: python-sensitive-env-read
  desc: Reads credential-named environment variable
  crit: notable
  conf: 0.9
