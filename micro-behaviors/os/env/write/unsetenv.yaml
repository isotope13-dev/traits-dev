# Relocated by the supported observation; matchers and scope preserved.
traits:
- platforms:
  - windows
  - unix
  for:
  - elf
  - pe
  - macho
  id: unsetenv-import
  desc: Imports C environment-variable removal API
  crit: notable
  conf: 0.98
  if:
    type: import
    exact: unsetenv

composite_rules:
- id: wsh-environment-remove-call
  desc: WSH removes an item from an environment collection
  crit: notable
  conf: 0.92
  platforms: [windows]
  for: [javascript, vbs, html]
  # Bounded co-occurrence: the receiver variable of `.Remove(...)` is not
  # provably the collection object retrieved by `.Environment(...)` (WSH
  # droppers split the "USER" argument, so the two statements rarely sit on
  # adjacent lines). The removal call itself is the observation; the
  # environment-collection retrieval nearby gives it its subject.
  all:
    - id: micro-behaviors/os/env/read::wsh-environment-object
    - id: micro-behaviors/data/property/write::script-item-removal-call
