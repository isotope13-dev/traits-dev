defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-machine-environment-setter
    desc: Sets persistent machine environment variable
    if:
      type: text
      regex: '(?i)::SetEnvironmentVariable\s*\([^\r\n]{1,240},\s*["'']Machine["'']\s*\)'
      exclude_comments: true
  - id: powershell-user-environment-setter
    desc: Sets persistent user environment variable
    if:
      type: text
      regex: '(?i)\bEnvironment\]::SetEnvironmentVariable\s*\([^\r\n]{1,180},\s*["'']User["'']\s*\)'
      exclude_comments: true
