defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-machine-environment-setter
    desc: Sets persistent machine environment variable
    if:
      type: text
      regex: '(?i)::SetEnvironmentVariable\s*\([^\r\n]{1,240},\s*["'']Machine["'']\s*\)'
      exclude_comments: true
