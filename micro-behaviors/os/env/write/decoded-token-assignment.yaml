# A source assignment reconstructed from escaped strings. This preserves
# credential exposure evidence when identifier escapes impede symbol facts.
# It reports source text, without claiming runtime execution or exfiltration.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: decoded-token-environment-assignment
    desc: Decoded token environment-assignment source
    crit: notable
    conf: 0.96
    if:
      type: encoded
      regex: '\bprocess\.env\.(ACCESS_TOKEN|REFRESH_TOKEN|API_KEY)\s*=\s*(this\.)?[$\w]+'
