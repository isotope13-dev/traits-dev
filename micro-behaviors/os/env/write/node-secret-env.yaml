traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: node-child-npm-token-env-field
  desc: Child environment explicitly provides NPM_TOKEN
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: [(identifier) @launch
          (member_expression property: (property_identifier) @launch)]
        arguments: (arguments (_) (_) (object
          (pair key: [(property_identifier) (string)] @env
            value: (object (pair key: [(property_identifier) (string)] @token)))))) @call
       (#match? @launch "^(spawnSync|spawn)$")
       (#match? @env "^[\"']?env[\"']?$")
       (#match? @token "^[\"']?NPM_TOKEN[\"']?$"))
