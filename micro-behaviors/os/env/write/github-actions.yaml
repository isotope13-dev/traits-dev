defaults:
  platforms: [unix, windows]
  for: [github-actions]
traits:
- id: gha-cache-bust-env-write
  desc: GitHub Actions cache-bust env write
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: 'CACHE_BUST\s*=\s*\$?\(?date\s+\+%s\)?[\s\S]{0,80}GITHUB_ENV'
- id: github-actions-printf-output-write
  desc: Workflow step printf writes GITHUB_OUTPUT
  crit: notable
  conf: 0.9
  for: [github_actions]
  if:
    type: value
    path: runs.steps[*].run
    regex: 'printf\s+[^\n]{0,240}\$GITHUB_OUTPUT'
