# Co-occurring unsetenv does not bind its argument to LD_PRELOAD. Even
# when that argument is verified, clearing it can prevent recursive loading,
# as in GoAhead templates; it does not establish process masquerading.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95

composite_rules:
  - id: preload-library-fork-shell-unsetenv-api-set
    desc: Preload shell-launch API set includes unsetenv
    all:
      - id: micro-behaviors/os/env/runtime::ld-preload
      - id: micro-behaviors/os/env/write::unsetenv
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/create/shell/spawn::system-fn
