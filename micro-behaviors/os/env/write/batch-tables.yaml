# Assignment tables alone do not establish command reconstruction.
defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-many-short-quoted-assignments
    desc: Many short quoted batch environment assignments
    crit: notable
    conf: 0.95
    count_min: 8
    if:
      type: text
      regex: '(?im)^set\s+"[A-Za-z_][A-Za-z0-9_]{3,20}=[^"]{1,24}"\s*$'
