defaults:
  platforms: [unix]
  for: [perl]

traits:
  - id: perl-environment-assignment
    desc: Perl assigns process environment variables
    crit: notable
    conf: 0.88
    if:
      type: text
      # Reject `=~` binding matches — `\s*=` alone also matched `$ENV{k} =~ /.../`.
      regex: '\$ENV\s*\{\s*["'']?[A-Za-z_][A-Za-z0-9_]*["'']?\s*\}\s*=\s*[^=~]'
