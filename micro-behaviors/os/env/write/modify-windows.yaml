# MSBuild property functions are normally restricted to an allowlisted set of
# operations. This process-scoped switch permits every property function; the
# capability is legitimate in unusual build environments, while objective
# rules combine it with proxy-execution evidence.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1127.001

traits:
  - id: msbuild-all-property-functions-enabled
    desc: Enables unrestricted MSBuild property functions
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)MSBUILDENABLEALLPROPERTYFUNCTIONS\s*=\s*["'']?1\b'
