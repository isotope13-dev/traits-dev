# The git commit identity supplied through the environment: GIT_AUTHOR_*,
# and GIT_COMMITTER_* describe the author and committer of the next commit.
# Demo fixtures, build users, and impersonation all write these; the claim
# is the environment write, not whether the identity is honest.
defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: git-identity-env-export
    desc: Exports git commit identity env variables
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'export\s+GIT_(AUTHOR|COMMITTER)_(NAME|EMAIL)='
