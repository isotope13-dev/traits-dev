defaults:
  platforms: [windows]
  for: [html, scripts, documents]

composite_rules:
- id: hta-environment-item-assignment
  desc: HTA WSH environment item assignment
  crit: suspicious
  conf: 0.96
  all:
    - id: metadata/file/format/markup::hta-application-element
  any:
    - id: micro-behaviors/os/env/write::wsh-environment-item-assignment
    - id: micro-behaviors/os/env/write::wsh-environment-assignment-call

