defaults:
  platforms: [windows]
  for: [html, scripts, documents]

composite_rules:
- id: hta-wscript-user-environment-clues
  for: [javascript, vbs, html]
  desc: HTA WSH environment read and write clues
  crit: notable
  conf: 0.98
  all:
    - id: well-known/lib/runtime/scripted/windows-script-host::wscript-shell-literal
    - id: micro-behaviors/os/env/read/variable::wsh-environment-object
    - id: micro-behaviors/os/env/write::hta-environment-item-assignment

