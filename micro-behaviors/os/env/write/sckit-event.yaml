defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: sckit-event-text-option
    desc: Configures SCKIT_EVENT_TEXT environment option
    crit: notable
    conf: 0.99
    for: [python, javascript]
    size_min: 400
    size_max: 20000
    if:
      type: text
      regex: '["'']?SCKIT_EVENT_TEXT["'']?\s*[:=]'

