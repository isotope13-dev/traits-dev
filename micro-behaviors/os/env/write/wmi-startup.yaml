defaults:
  platforms: [windows]
  for: [javascript]

traits:
  - id: wmi-startup-environment-array
    desc: Assigns startup environment variable array
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression
            property: (property_identifier) @property)
          right: (array)) @assignment
          (#eq? @property "EnvironmentVariables"))
