defaults:
  crit: notable
traits:
  - id: ssh-connection-var
    for: [scripts, binaries]
    platforms: [unix]
    conf: 0.6
    desc: SSH_CONNECTION environment variable
    if:
      type: text
      exact: SSH_CONNECTION
  - id: ssh-client-var
    for: [scripts, binaries]
    platforms: [unix]
    conf: 0.6
    desc: SSH_CLIENT environment variable
    if:
      type: text
      exact: SSH_CLIENT
  - id: ssh-tty-var
    for: [scripts, binaries]
    platforms: [unix]
    conf: 0.6
    desc: SSH_TTY environment variable
    if:
      type: text
      exact: SSH_TTY
  - id: ssh-auth-sock-var
    for: [scripts, binaries]
    platforms: [unix]
    conf: 0.6
    desc: SSH_AUTH_SOCK environment variable
    if:
      type: text
      exact: SSH_AUTH_SOCK
  - id: ssh-agent-pid-var
    for: [scripts, binaries]
    platforms: [unix]
    conf: 0.6
    desc: SSH_AGENT_PID environment variable
    if:
      type: text
      exact: SSH_AGENT_PID
  - id: javascript-private-key-environment-variable
    platforms: [unix, windows]
    desc: JavaScript private-key environment variable
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env(\.[A-Z0-9_]*PRIVATE_KEY|\[\s*["''][A-Z0-9_]*PRIVATE_KEY["'']\s*\])'
  - id: ssh-private-key-dup
    platforms: [unix, windows]
    for: [shell, python, javascript, powershell, pe, elf]
    conf: 0.7
    desc: SSH_PRIVATE_KEY environment variable
    if:
      type: text
      word: SSH_PRIVATE_KEY
