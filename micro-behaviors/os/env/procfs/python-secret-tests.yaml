defaults:
  platforms: [linux]
  for: [python]
traits:
  - id: python-proc-environ-credential-tests
    desc: Process environs near credential tests
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      # Include the old closing parenthesis in the proximity budget.
      regex: '/proc/(\[0-9\])?\*/environ["''][\s\S]{0,251}any\([^\n]{1,90}["''](TOKEN|SECRET|PASSWORD)["'']'
