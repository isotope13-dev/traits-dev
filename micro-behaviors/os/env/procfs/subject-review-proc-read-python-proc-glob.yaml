defaults:
  platforms: [linux]
  for: [python]
traits:
  - id: python-pathlib-proc-environ-read
    desc: Reads process environs via pathlib glob
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((for_statement
          left: (identifier) @selected
          right: (call
            function: (attribute
              object: (call function: (identifier) @path
                arguments: (argument_list . (string (string_content) @root)))
              attribute: (identifier) @glob)
            arguments: (argument_list . (string (string_content) @pattern)))
          body: (block
            . (try_statement body: (block
              . (expression_statement (assignment
                right: (call function: (attribute
                  object: (call function: (attribute
                    object: (identifier) @reader
                    attribute: (identifier) @read))
                  attribute: (identifier) @decode)))))))) @read_loop
          (#eq? @path "Path")
          (#eq? @root "/proc")
          (#eq? @glob "glob")
          (#match? @pattern "^(\\*|\\[0-9\\]\\*)/environ$")
          (#eq? @selected @reader)
          (#eq? @read "read_bytes")
          (#eq? @decode "decode"))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path

  - id: python-glob-open-proc-environ-read
    desc: Reads process environs via glob and open
    crit: notable
    conf: 0.99
    # Bind open() to the loop variable. The glob must select process
    # environments, rather than unrelated files or a quoted example.
    if:
      type: tree-sitter
      query: |
        ((for_statement
          left: (identifier) @selected
          right: (_) @iterator
          body: (block
            (try_statement body: (block
              (expression_statement (assignment
                right: (call function: (attribute
                  object: (call function: (attribute
                    object: (call function: (identifier) @open
                      arguments: (argument_list . (identifier) @reader))
                    attribute: (identifier) @read))
                  attribute: (identifier) @decode)))))))) @operation
          (#match? @iterator "^glob\\s*\\.\\s*glob\\s*\\(\\s*[\"']/proc/(\\[0-9\\]\\*|\\*)/environ[\"']\\s*[,)]")
          (#eq? @selected @reader)
          (#eq? @open "open")
          (#eq? @read "read")
          (#eq? @decode "decode"))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path

composite_rules:
  - id: python-globbed-proc-environ-read
    desc: Reads glob-selected process environments
    crit: notable
    conf: 0.99
    any:
      - id: python-pathlib-proc-environ-read
      - id: python-glob-open-proc-environ-read
