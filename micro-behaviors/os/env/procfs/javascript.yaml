defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-concat-proc-environ-path
    desc: Concatenates PID into /proc environ path
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '["''`]/proc/["''`]\s*\+\s*[\w$.()]+\s*\+\s*["''`]/environ["''`]'
    not:
      - regex: '["''`]self["''`]'

  - id: node-join-proc-environ-path
    desc: Joins PID into /proc environ path
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(\bjoin\(\s*|\[\s*)["''`]/proc/?["''`]\s*,[^\r\n;]{1,32}["''`]environ["''`]'
    not:
      - regex: '["''`]self["''`]'

composite_rules:
  - id: js-cross-proc-environ-reference
    desc: References other-process environment via procfs
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/proc/info/path::proc-init-environ
      - id: micro-behaviors/fs/proc/info/path::process-pid-environ
      - id: micro-behaviors/fs/proc/info/path::process-var-environ
      - id: node-concat-proc-environ-path
      - id: node-join-proc-environ-path
