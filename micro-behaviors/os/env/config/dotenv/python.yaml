# Python environment/configuration resolver capabilities.
#
# These describe normal application configuration plumbing. Credential theft
# objectives should combine env access with secret targeting or exfiltration
# rather than emitting these neutral markers from an objective directory.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
- id: python-dotenv-load
  desc: Python dotenv loading
  crit: notable
  conf: 0.85
  ref: sha256:e9bef8406a3b69fe6558990b02e40b2b75a2872d5133f812bafbc0c0393cee77
  if:
    type: symbol
    exact: load_dotenv
  unless:
    - id: metadata/file/format/news::serialized-news-article-catalog

# A configuration module loads its own .env from a joined, fixed app-data
# path with override=True -- the python-dotenv config idiom, not discovery.
- id: python-dotenv-joined-config-load
  desc: Loads a joined .env path with override
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: 'os\.path\.join[^)]{0,80}\.env["''][\s\S]{0,120}load_dotenv\([^)]{0,40}override'

- id: python-dotenv-into-os-environ
  desc: Python writes parsed dotenv into os.environ
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'split\s*\(\s*["'']=[\s\S]{0,240}os\.environ\[[^\]]{1,120}\]\s*=\s*value\b'
