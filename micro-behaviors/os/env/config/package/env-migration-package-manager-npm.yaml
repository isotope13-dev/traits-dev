defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: npm-package-name-process-env-read
  desc: Reads npm_package_name from JavaScript env
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: member
    exact: process.env.npm_package_name
- id: npm-package-name-getenv-key
  desc: npm_package_name getenv key literal
  crit: notable
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    word: npm_package_name
- id: npm-config-registry-getenv-key
  desc: npm_config_registry getenv key literal
  crit: notable
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    word: npm_config_registry
- id: npm-lifecycle
  desc: Reads npm lifecycle event environment variable
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: process\.env(\?\.|\.|\[['"])npm_lifecycle_event
- id: npm-config-user-agent
  desc: Reads npm user-agent environment variable
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: process\.env(\?\.|\.|\[['"])npm_config_user_agent
- id: npm-config-proxy
  desc: References npm_config_proxy environment variable
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: npm_config_proxy
- id: npm-user-agent-package-manager-field
  desc: Maps npm user-agent into package-manager field
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \bpackageManager\s*:\s*[^,\r\n]{0,96}\.env\.npm_config_user_agent\b
- id: npm-package-info
  desc: Access npm package info
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: process.env.npm_package_
- id: npm-config-registry-env-access
  desc: References npm_config_registry env field
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: process.env.npm_config_registry
- id: npm-config-env-prefix-remap
  desc: Remaps npm_config_ environment variable prefix
  crit: notable
  conf: 0.92
  if:
    type: text
    exclude_comments: true
    regex: npm\)?_config_\(\.\+\)\$
- id: npm-config-global-scope-read
  desc: Reads npm_config_global install-scope flag
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: npm_config_global
- id: npmrc-publishing-version-context
  desc: npmrc package publishing message context
  crit: baseline
  conf: 0.86
  if:
    type: string_literal
    substr: 'Publishing version:'
- id: npmrc-tool-config-context
  desc: npmrc package-manager config context
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: name:\s*['"]npmrc['"]|packageFile\.npmrc|redactedFields|configSerializer
- id: npmrc-file-extension-list-context
  desc: npmrc filename in extension allowlist context
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[''"]wgetrc[''"],\s*[''"]npmrc[''"],\s*[''"]yarnrc[''"]'
composite_rules:
- id: npm-install-profile-getenv-key-pair
  desc: npm install profile getenv key pair
  crit: notable
  conf: 0.93
  for:
  - elf
  - macho
  all:
  - id: micro-behaviors/os/env/config/package::npm-package-name-getenv-key
  - id: micro-behaviors/os/env/config/package::npm-config-registry-getenv-key
- id: npm-install-profile-javascript-env-pair
  desc: npm install profile JavaScript env pair
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/os/env/config/package::npm-package-info
  - id: micro-behaviors/os/env/config/package::npm-config-registry-env-access
- id: selective-npm-agent-telemetry
  desc: npm user-agent mapping and JSON POST references
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/os/env/config/package::npm-user-agent-package-manager-field
  - id: micro-behaviors/communications/http/request/json::http-post-json
- id: npmrc-benign-context
  desc: Benign npmrc reference context
  crit: component
  conf: 0.88
  any:
  - id: micro-behaviors/os/env/config/package::npmrc-publishing-version-context
  - id: metadata/build/bundler/vscode::vscode-icon-theme-catalog
  - id: metadata/build/ecosystem::npm-embedded-build-env-dump
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/harness/runtime::is-test
  - id: well-known/lib/web/authoring/npm-frameworks::update-notifier-npmrc-context
  - id: metadata/build/bundler/vscode::vscode-material-icon-map-bundle
  - id: micro-behaviors/os/env/config/package::npmrc-registry-client-context
  - id: micro-behaviors/os/env/config/package::npmrc-tool-config-context
  - id: micro-behaviors/os/env/config/package::npmrc-file-extension-list-context
- id: npmrc-registry-client-context
  desc: npmrc registry client context
  crit: baseline
  conf: 0.88
  any:
  - id: micro-behaviors/os/env/credential/registry::npmrc-registry-auth-token
  - id: micro-behaviors/os/env/credential/registry::npmrc-token-to-npmrc-text
