defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
  conf: 0.95
traits:
- id: go-private-module-setting
  desc: Go private module environment setting
  for:
  - go
  - shell
  - github-actions
  if:
    type: literal
    word: GOPRIVATE
- id: go-module-sum-exclusion
  desc: Go module checksum exclusion setting
  if:
    type: text
    regex: GONOSUMCHECK|GONOSUMDB|["`]OSU["`]\s*,\s*["`]MCHECK|["`]OSU["`]\s*,\s*["`]MDB
- id: go-module-mutation-flag
  desc: Go module mutation flag setting
  if:
    type: text
    regex: GOFLAGS\s*=\s*-mod=mod|LAGS=-mod=mod
- id: go-env-git-credential-isolation
  desc: Go strips git credentials from child env
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: credential\.helper=[\s\S]{0,240}GIT_TERMINAL_PROMPT=0
