defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- id: py-harvest-mongo-uri
  desc: Python environment access and MongoDB URI name
  crit: suspicious
  conf: 0.9
  for:
  - python
  near_lines: 1
  all:
  - id: metadata/lang/source/literal/fragment/env-variable::py-mongo-uri-env-name
  any:
  - id: micro-behaviors/os/env/read/variable::python-os-getenv-call
  - id: micro-behaviors/os/env/read/variable::os-environ-symbol
- id: pypi-install-redis-url-harvest
  desc: Setup file reads Redis URL environment value
  crit: suspicious
  conf: 0.9
  scope: leaf
  all:
  - id: micro-behaviors/os/env/config::python-redis-url-read
  - id: metadata/build/pip::root-setup-py
  unless:
  - id: metadata/file/magic/identity::zip-archive
  - id: metadata/package/files/included::archive-container-path
