composite_rules:
- id: go-environment-config-context
  desc: Go environment configuration or redaction context
  crit: component
  for:
  - go
  platforms:
  - unix
  - windows
  any:
  - id: micro-behaviors/os/env/config/application::config-env-field-reference
  - id: micro-behaviors/os/env/config/package::go-env-git-credential-isolation
  - id: micro-behaviors/os/env/config/package::go-module-mutation-flag
  - id: micro-behaviors/os/env/config/package::go-module-sum-exclusion
  - id: micro-behaviors/os/env/config/package::go-private-module-setting
  - id: micro-behaviors/os/env/config/cluster::kubeconfig-name
  - id: micro-behaviors/os/env/config/redaction/
