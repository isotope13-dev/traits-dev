defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-config-proxy-class
  desc: Python PersistentConfig construction
  crit: notable
  conf: 0.85
  ref: sha256:e9bef8406a3b69fe6558990b02e40b2b75a2872d5133f812bafbc0c0393cee77
  if:
    type: symbol
    kind: call
    exact: PersistentConfig
- id: python-many-env-getters
  desc: Python repeated environment variable reads
  crit: notable
  conf: 0.85
  ref: sha256:e9bef8406a3b69fe6558990b02e40b2b75a2872d5133f812bafbc0c0393cee77
  count_min: 10
  if:
    type: text
    regex: os\.environ\.get\s*\(
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: python-named-secret-env-lookup
  desc: Python reads a named secret environment variable
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: os\.environ\.get\s*\([\"'](SECRET(_KEY|_TRIGGER)?|TRIGGER[A-Z0-9_]*)[\"']\)
- id: python-env-resolver-spec
  desc: Python env-var resolver specification
  crit: notable
  conf: 0.88
  ref: sha256:e9bef8406a3b69fe6558990b02e40b2b75a2872d5133f812bafbc0c0393cee77
  if:
    type: text
    regex: \b(EnvVarSpec|ManualResolver|McpResolver|EnvVar)\s*\(
- id: python-mcp-env-installer-marker
  desc: Python MCP env-var installer marker
  crit: notable
  conf: 0.88
  ref: sha256:e9bef8406a3b69fe6558990b02e40b2b75a2872d5133f812bafbc0c0393cee77
  if:
    type: text
    regex: mcp\.upsert_server|class\s+\w+Mcp\w*Tool\(BaseTool\)|Install/configure .{0,80}MCP server
composite_rules:
- id: python-env-config-marker
  desc: Python environment configuration marker
  crit: notable
  conf: 0.86
  ref: sha256:e9bef8406a3b69fe6558990b02e40b2b75a2872d5133f812bafbc0c0393cee77
  all:
  - id: micro-behaviors/os/env/config/application::python-many-env-getters
  any:
  - id: micro-behaviors/os/env/config/dotenv::python-dotenv-load
  - id: micro-behaviors/os/env/config/database::python-db-config-marker
- id: python-env-resolver-marker
  desc: Python environment resolver configuration marker
  crit: notable
  conf: 0.88
  ref: sha256:e9bef8406a3b69fe6558990b02e40b2b75a2872d5133f812bafbc0c0393cee77
  all:
  - id: micro-behaviors/os/env/config/application::python-env-resolver-spec
  any:
  - id: micro-behaviors/os/env/config/application::python-env-config-marker
  - id: micro-behaviors/os/env/config/application::python-mcp-env-installer-marker
