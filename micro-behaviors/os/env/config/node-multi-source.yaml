# Breadth of supported credentials is ordinary SDK/agent configuration.
# Collection and exfiltration require separate data-flow evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: node-several-credential-config-sources
  desc: Several credential environment config sources
  crit: notable
  conf: 0.95
  needs: 3
  any:
  - id: micro-behaviors/os/env/secret-name::node-aws
  - id: micro-behaviors/os/env/vcs::node-source-control-token-code-literal
  - id: micro-behaviors/os/env/package-manager::node-registry-token-env-read
  - id: micro-behaviors/os/env/service-api::node-discord
  - id: micro-behaviors/os/env/config::database-connection-env-config

