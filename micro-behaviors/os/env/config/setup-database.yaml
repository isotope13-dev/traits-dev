defaults:
  platforms: [unix, windows]
  crit: notable
  for: [python]

composite_rules:
  - id: setup-database-url-setting
    desc: Setup script reads database URL env setting
    crit: notable
    conf: 0.9
    scope: leaf
    all:
    - id: micro-behaviors/os/env/config::python-database-url
    - id: metadata/build/pip::root-setup-py
    unless:
    - id: metadata/file/magic/identity::zip-archive
    - id: metadata/package/files/included::archive-container-path
