defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
  conf: 0.95
traits:
- id: go-env-redaction-after-read
  desc: Go masks an environment value before logging
  if:
    type: text
    regex: os\.Getenv\(key\)[\s\S]{0,260}value\s*=\s*mask(Secret|DSNPassword)\s*\(value\)
- id: go-env-redaction-placeholder-assign
  desc: Go redacts a credential env value
  if:
    type: text
    case_insensitive: true
    regex: Contains\(.{0,30}(AUTH|PASS|SEC|TOK)[\s\S]{0,800}(redacted|"xxx"|"present"|NewReplacer)
- id: go-env-sensitive-variable-unset
  desc: Go unsets sensitive environment variables
  if:
    type: text
    case_insensitive: true
    regex: Contains\([^)\n]{0,40}(AUTH|PASS|SEC|TOK)[\s\S]{0,240}os\.Unsetenv\(
- id: go-env-sensitive-key-skip
  desc: Go skips sensitive environment keys
  if:
    type: text
    regex: Contains\(key,[^\n]{0,90}(_KEY|_AUTH_TOKEN)[\s\S]{0,320}continue
- id: go-env-credential-name-skip
  desc: Go skips credential-named environment keys
  if:
    type: text
    case_insensitive: true
    regex: Contains\([^)]{0,80}"(TOKEN|SECRET|KEY)"\)[\s\S]{0,320}continue
- id: go-env-credential-word-prefix-skip
  desc: Go skips env prefixes with credential words
  if:
    type: text
    regex: HasPrefix\(.{0,60}".{0,40}(TOKEN|SECRET|KEY).{0,40}"\)[\s\S]{0,240}continue
