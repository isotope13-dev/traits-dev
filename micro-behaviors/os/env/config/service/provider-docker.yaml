defaults:
  platforms:
  - windows
  - unix
traits:
- id: docker-env-prefix
  desc: DOCKER_ environment variable name reference
  crit: notable
  conf: 0.8
  for:
  - dockerfile
  - shell
  - python
  - javascript
  - typescript
  unless:
  - id: well-known/lib/ai/pyaigis/
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])DOCKER_[A-Za-z]
