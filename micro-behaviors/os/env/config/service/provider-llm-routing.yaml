defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - go
  - rust
  - java
  - json
  crit: notable
  conf: 0.9
traits:
- id: anthropic-base-url-off-vendor
  desc: Anthropic base URL assigns non-vendor host
  if:
    type: text
    regex: \bANTHROPIC_(BASE_URL|API_URL)\b["']?\s*[:=]\s*["']?https?://[\w.:-]{3,64}
  not:
  - substr: api.anthropic.com
  - substr: localhost
  - substr: 127.0.0.1
- id: anthropic-base-url-setdefault-call
  desc: setDefault configures Anthropic base URL
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: setDefault\s*\(\s*['"]ANTHROPIC_BASE_URL['"]\s*,
- id: openai-base-url-off-vendor
  desc: OpenAI base URL assigns non-vendor host
  if:
    type: text
    regex: \bOPENAI_(BASE_URL|API_BASE)\b["']?\s*[:=]\s*["']?https?://[\w.:-]{3,64}
  not:
  - substr: api.openai.com
  - substr: localhost
  - substr: 127.0.0.1
- id: deepseek-base-url-off-vendor
  desc: DeepSeek base URL assigns non-vendor host
  if:
    type: text
    regex: \bDEEPSEEK_BASE_URL\b["']?\s*[:=]\s*["']?https?://[\w.:-]{3,64}
  not:
  - substr: api.deepseek.com
  - substr: localhost
  - substr: 127.0.0.1
- id: ai-agent-attribution-header-disabled
  desc: Agent attribution header disabled
  conf: 0.94
  if:
    type: text
    regex: \b\w+_ATTRIBUTION_HEADER\b["']?\s*[:=]\s*["']?(0|false)\b
- id: ai-agent-nonessential-traffic-disabled
  desc: Agent non-essential traffic disabled
  conf: 0.94
  if:
    type: text
    regex: \b\w+_DISABLE_NONESSENTIAL_TRAFFIC\b["']?\s*[:=]\s*["']?(1|true)\b
- id: remote-proxy-url-default
  desc: Proxy URL defaults to remote HTTPS
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: process\.env\.\w+_PROXY_URL\s*\|\|\s*['"]https://[^'"]{3,160}
  not:
  - substr: localhost
  - substr: 127.0.0.1
composite_rules:
- id: anthropic-proxy-configuration
  desc: Anthropic base URL setter and proxy URL co-occur
  crit: notable
  conf: 0.94
  for:
  - javascript
  - typescript
  scope: file
  all:
  - id: micro-behaviors/os/env/config/service::anthropic-base-url-setdefault-call
  - id: micro-behaviors/communications/url/host/domain-http::https-proxy-named-host
- id: llm-api-base-url-third-party-host
  desc: LLM API base URL points at a non-vendor host
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/config/service::anthropic-base-url-off-vendor
  - id: micro-behaviors/os/env/config/service::openai-base-url-off-vendor
  - id: micro-behaviors/os/env/config/service::deepseek-base-url-off-vendor
- id: llm-relay-with-vendor-telemetry-disabled
  desc: Off-vendor API setting with telemetry suppression
  crit: notable
  conf: 0.93
  near_lines: 24
  all:
  - id: micro-behaviors/os/env/config/service::llm-api-base-url-third-party-host
  any:
  - id: micro-behaviors/os/env/config/service::ai-agent-attribution-header-disabled
  - id: micro-behaviors/os/env/config/service::ai-agent-nonessential-traffic-disabled
  - id: micro-behaviors/data/llm/session::ai-agent-response-storage-disabled
