defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

# These settings are legitimate for private modules, local development, and
# Go's own module tooling. Build-pipeline abuse is inferred only when they are
# combined with CI environment-file manipulation in objectives/.
traits:
- id: go-private-module-setting
  desc: Go private module environment setting
  for: [go, shell, github-actions]
  if:
    type: literal
    word: GOPRIVATE
- id: go-module-sum-exclusion
  desc: Go module checksum exclusion setting
  if:
    type: text
    regex: 'GONOSUMCHECK|GONOSUMDB|["`]OSU["`]\s*,\s*["`]MCHECK|["`]OSU["`]\s*,\s*["`]MDB'
- id: go-module-mutation-flag
  desc: Go module mutation flag setting
  if:
    type: text
    regex: 'GOFLAGS\s*=\s*-mod=mod|LAGS=-mod=mod'
- id: go-env-redaction-after-read
  desc: Go masks an environment value before logging
  if:
    type: text
    regex: 'os\.Getenv\(key\)[\s\S]{0,260}value\s*=\s*mask(Secret|DSNPassword)\s*\(value\)'
# Redact-in-place is the other half of the same idea: rather than skipping the
# variable, the collector tests the key for a credential word and overwrites the
# value with a placeholder. Ambassador's `cmd/reproducer/extract.go` builds a
# support bundle this way --
#   if strings.Contains(e.Name, "AUTH") || strings.Contains(e.Name, "PASSWORD") {
#       copy.Value = "<redacted>"
# -- and read as Go credential harvesting, because the existing trait above only
# recognizes the `maskSecret(value)` spelling.
- id: go-env-redaction-placeholder-assign
  desc: Go redacts a credential env value
  if:
    type: text
    case_insensitive: true
    regex: 'Contains\([^)]{0,48}(AUTH|PASSWORD|SECRET)[\s\S]{0,200}redacted'
- id: go-env-sensitive-key-skip
  desc: Go skips sensitive environment keys
  if:
    type: text
    # Diagnostic collectors often check several sensitive suffixes, explain
    # the exclusion in adjacent comments, and only then continue the loop.
    # Keep the key test and control-flow action close enough to establish an
    # intentional skip without requiring the comment to be unusually short.
    regex: 'Contains\(key,[^\n]{0,90}(_KEY|_AUTH_TOKEN)[\s\S]{0,320}continue'
- id: go-env-credential-name-skip
  desc: Go skips credential-named environment keys
  if:
    type: text
    # Build runners commonly pass a sanitized copy of os.Environ to a child.
    # A credential-word test followed by continue proves exclusion, not
    # harvesting; the caller never retains the matching entry.
    regex: 'Contains\([^)]{0,80}"(TOKEN|SECRET|KEY)"\)[\s\S]{0,320}continue'
