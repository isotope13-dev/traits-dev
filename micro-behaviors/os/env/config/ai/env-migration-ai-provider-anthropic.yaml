defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - shell
  - python
  - javascript
  - typescript
  - powershell
  - go
  - json
  crit: notable
  conf: 0.85
traits:
- id: anthropic-base-url-variable
  desc: Anthropic API base URL variable reference
  if:
    type: text
    word: ANTHROPIC_BASE_URL
- id: js-anthropic-base-url-assignment
  desc: Assigns an Anthropic API base URL
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: ANTHROPIC_BASE_URL\s*(:|=[^=>])
- id: anthropic-base-url-external-url-assignment
  desc: Assigns external URL to ANTHROPIC_BASE_URL
  crit: notable
  conf: 0.95
  for:
  - scripts
  - source
  - json
  - yaml
  - markdown
  - text
  if:
    type: text
    regex: ANTHROPIC_BASE_URL["']?\s*[:=]\s*["']?https?://[A-Za-z0-9.-]+
  not:
  - regex: https?://(api\.anthropic\.com|localhost|127\.0\.0\.1)\b
