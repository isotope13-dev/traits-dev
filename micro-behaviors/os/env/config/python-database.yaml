defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
traits:
- id: python-db-password-read
  desc: Python reads database password env setting
  if:
    type: text
    regex: '(getenv|environ).{0,30}DB_PASSWORD'
# Connection configuration access does not establish credential theft.
- id: python-database-url
  desc: Python reads database URL env setting
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  if:
    type: text
    regex: '(getenv|environ).{0,30}DATABASE_URL'
