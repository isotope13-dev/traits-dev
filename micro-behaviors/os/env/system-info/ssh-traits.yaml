# SSH session variables identify a remote login session on the host.
defaults:
  crit: notable
  platforms: [unix]
  for: [scripts, binaries]
traits:
  - id: ssh-connection-var
    conf: 0.6
    desc: SSH_CONNECTION environment variable
    if:
      type: text
      exact: SSH_CONNECTION
  - id: ssh-client-var
    conf: 0.6
    desc: SSH_CLIENT environment variable
    if:
      type: text
      exact: SSH_CLIENT
  - id: ssh-tty-var
    conf: 0.6
    desc: SSH_TTY environment variable
    if:
      type: text
      exact: SSH_TTY
