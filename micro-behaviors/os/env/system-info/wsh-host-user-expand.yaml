# WScript.Shell.ExpandEnvironmentStrings of %COMPUTERNAME% or %USERNAME%:
# the script reads the host or account name.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1082,T1033

traits:
  - id: wsh-expand-computer-or-user-name
    desc: Script reads computer or user name variable
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)ExpandEnvironmentStrings\s*\(\s*"%(COMPUTERNAME|USERNAME)%"\s*\)'
