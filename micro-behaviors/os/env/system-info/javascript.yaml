# Locale environment variables read from JavaScript. Grouped with the other
# locale variables rather than with generic env access. Kept in their own
# file because system-info/traits.yaml is scoped `for: [binaries, shell,
# python]`, which would exclude JavaScript entirely.
defaults:
  crit: notable
  conf: 0.5
  for: [javascript, typescript]
  platforms: [windows, unix]
traits:
  - id: env-lang-check
    desc: JavaScript reads LANG environment variable
    if:
      type: text
      substr: process.env.LANG

  - id: env-language-check
    desc: JavaScript reads LANGUAGE environment variable
    if:
      type: text
      substr: process.env.LANGUAGE

  - id: env-lc-all-check
    desc: JavaScript reads LC_ALL environment variable
    if:
      type: text
      substr: process.env.LC_ALL

  - id: env-lc-messages-check
    desc: JavaScript reads LC_MESSAGES variable
    if:
      type: text
      substr: process.env.LC_MESSAGES

  - id: node-host-identity-env-reference
    desc: Node reads HOSTNAME or COMPUTERNAME env var
    conf: 0.85
    if:
      type: symbol
      kind: member
      regex: '^process\.env\.(HOSTNAME|COMPUTERNAME)$'

