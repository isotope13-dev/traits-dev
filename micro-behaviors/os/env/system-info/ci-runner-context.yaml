# The host is a CI runner: any CI job metadata, or the runner OIDC request
# names. Lives outside cicd/ so the cicd/ selector cannot include itself.
composite_rules:
  - id: ci-env-reference-set
    desc: CI environment metadata or OIDC credential request names
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/os/env/cicd/
      - id: micro-behaviors/os/env/secret/ci::github-actions-oidc-token-request-env
