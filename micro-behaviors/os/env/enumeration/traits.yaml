defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
composite_rules:
  - id: environment-block-enumeration
    desc: Enumerate process environment block
    crit: baseline
    conf: 0.88
    all:
      - id: micro-behaviors/os/env/block::get-environment-strings-wide
      - id: micro-behaviors/os/env/block::free-environment-strings-wide
    downgrade:
      # Go's os package statically imports GetEnvironmentStringsW /
      # FreeEnvironmentStringsW on Windows to implement os.Environ().
      any:
        - id: metadata/lang/compiled/
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
