defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  # `{k: v for k, v in os.environ.items() if k not in ("GH_TOKEN", ...)}` --
  # an exclusion test, which is the opposite of a credential selection. This
  # is how a test harness or subprocess wrapper forwards the environment with
  # named variables scrubbed out, and the credential word appears precisely
  # because it is the thing being dropped. `!= "SOME_TOKEN"` is the same
  # single-variable exclusion spelled as an inequality rather than a
  # membership test -- OpenHands-Cloud's test_create_slack_app.py builds
  # `{k: v for k, v in os.environ.items() if k != "SLACK_CONFIG_TOKEN"}` to
  # simulate that one env var being unset for a test case. Similarly,
  # `{k: v for k, v in os.environ.items() if not k.startswith("...")}` scrubs
  # out an entire prefix namespace before invoking child processes.
  - id: python-environ-items-exclusion-filter
    desc: Environment loop excludes named keys
    conf: 0.9
    if:
      type: text
      regex: '(?s)os\.environ\.items\(\).{0,200}\bif\b.{0,60}(not\s+(in|any|\w+\.start)|!=)'

  # `{k: v for k, v in os.environ.items() if k.startswith("...")}` selects an
  # application's own configuration namespace (e.g. FINIZI_*, NETWORKX_*).
  # Selecting entries by a non-credential namespace prefix is application
  # configuration loading, not broad credential harvesting.
  - id: python-environ-items-namespace-prefix-filter
    desc: Environment loop selects literal name prefix
    conf: 0.9
    if:
      type: text
      regex: '(?s)environ\.items\(\).{0,200}if\s+\w+\.startswith\(\s*["''][^"'']{1,60}'
    not:
      - regex: '(?i)\.startswith\s*\(\s*\(?\s*["''](AWS|SECRET|TOKEN|KEY|PASS|CRED)'

  - id: os-environ-alias-import
    desc: Imports os.environ under a local alias
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*from[ \t]+os[ \t]+import[ \t]+.{0,80}\benviron\b'

  - id: environ-alias-items-call
    desc: Calls items() on an os.environ alias
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: environ.items

  # `for _, value in os.environ.items(): blob += value` -- every environment
  # value swept into one accumulator. Reading named variables, or building a
  # keyed dict from the environment (the `*_proxy` scan in `urllib.request`
  # does exactly that), keeps the entries distinct; concatenating them all into
  # a single string is the stealer shape, because the collector does not know
  # which secret the victim holds.
  - id: environ-items-loop-string-accumulate
    desc: Concatenates all env values into one string
    conf: 0.9
    if:
      type: text
      regex: '(?s)environ\.items\(\)\s*:.{0,100}\+='

  # `fh.write(json.dumps(...))` whose argument is derived from
  # `os.environ.items()` through `json.dumps`. A filtered config dump has the
  # same flow, so this is the materialization, not the harvest. Keys-only
  # iteration that never reaches the write does not match.
  - id: python-environ-items-json-write
    desc: Writes JSON derived from environment entries
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        from:
          call: '^os\.environ\.items$'
          through:
            - call: '^json\.dumps$'
              arguments: [0]

  # `{k: v[:200] for k, v in os.environ.items()}` keeps every value. A name
  # filter (`if k.startswith(...)`) is a different behavior and is excluded.
  # The value may be the loop variable or a slice of it, under any name.
  - id: python-environ-unfiltered-value-comprehension
    desc: Keeps every environment value unfiltered
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((dictionary_comprehension
            body: (pair
              value: [(identifier) @kept (subscript (identifier) @kept)])
            (for_in_clause
              left: (pattern_list . (identifier) @key (identifier) @val .)
              right: (call
                function: (attribute
                  object: (attribute
                    object: (identifier) @os
                    attribute: (identifier) @env)
                  attribute: (identifier) @items)
                arguments: (argument_list)))) @comp
          (#eq? @os "os")
          (#eq? @env "environ")
          (#eq? @items "items")
          (#eq? @kept @val)
          (#not-match? @comp "\\bif\\b"))

  # The function invoked at module level is the one that writes JSON, and it
  # either reads os.environ.items() itself or calls the helper that does.
  # The helper call may be a direct assignment or the first assignment inside
  # a try. An unrelated module-level call next to an uncalled saver does not
  # match, because the callee name has to be the writer that reaches the helper.
  - id: python-import-runs-environ-json-writer
    desc: Import runs environment JSON writer
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((module
            (function_definition
              name: (identifier) @fn
              body: (block) @body)
            (_)*
            (expression_statement
              (call
                function: (identifier) @called)))
          (#eq? @fn @called)
          (#match? @body "os\\.environ\\.items\\(\\)")
          (#match? @body "json\\.dumps")
          (#match? @body "\\.write\\("))

        ((module
            (function_definition
              name: (identifier) @helper
              body: (block) @hbody)
            (_)*
            (function_definition
              name: (identifier) @entry
              body: (block
                [(expression_statement
                   (assignment
                     right: (call
                       function: (identifier) @invoked)))
                 (try_statement
                   body: (block
                     (expression_statement
                       (assignment
                         right: (call
                           function: (identifier) @invoked)))))]) @ebody)
            (_)*
            (expression_statement
              (call
                function: (identifier) @called)))
          (#eq? @entry @called)
          (#eq? @invoked @helper)
          (#match? @hbody "os\\.environ\\.items\\(\\)")
          (#match? @ebody "json\\.dumps")
          (#match? @ebody "\\.write\\("))

composite_rules:
  - id: environ-alias-items-loop
    desc: Iterates over aliased os.environ entries
    conf: 0.92
    all:
      - id: os-environ-alias-import
      - id: environ-alias-items-call
