# Get-ChildItem Env: enumerates an environment; it does not create a process.
# Placement correction preserves the matcher, types, platforms and severity.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.94
traits:
  - id: powershell-environment-list-command
    desc: PowerShell lists environment variables
    if:
      type: text
      regex: '(?i)\bGet-ChildItem\s+Env:'

