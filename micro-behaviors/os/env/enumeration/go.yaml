defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe]
  crit: baseline
traits:
  - id: os-environ
    desc: os.Environ() enumerates the entire environment
    crit: notable
    conf: 0.85
    attack: T1082
    if:
      type: symbol
      exact: os.Environ
  # A broker that splits each entry, skips an empty value, and appends only
  # the key name is inventorying names. It is not collecting secret values.
  - id: go-environ-key-name-inventory
    desc: Go env scan keeps key names only
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'parts\[1\] == ""[\s\S]{0,400}append\([\w.]+, key\)'
