# .NET enumeration of the whole process environment filtered by credential
# keywords. Reading one named variable is ordinary configuration; sweeping
# every variable for KEY/SECRET/TOKEN/AUTH/CRED material is credential
# harvesting. Composites supply the exfiltration or evasion context.
defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  crit: suspicious
  conf: 0.94
  attack: T1552.001

traits:
  - id: dotnet-env-secret-filter
    desc: .NET filters env vars by secret keywords
    if:
      type: text
      regex: 'GetEnvironmentVariables\(\)[\s\S]{0,260}(SECRET|TOKEN|CRED|AUTH)'
