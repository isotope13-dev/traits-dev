# Environment variables the running VS Code instance exports to the processes
# it starts. They identify the *editor session*, not the machine: the PID of the
# window's main process and the filesystem path of the IPC socket that window
# listens on.
#
# Extensions do not need either one -- the `vscode` extension API already hands
# them a session id, a machine id and the workspace. Code that reaches around
# the API for them is building its own instance identity, so record the read as
# a capability here and let objectives compose the intent.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  attack: T1082

traits:
  - id: vscode-instance-pid-env
    desc: Reads VS Code instance PID env var
    conf: 0.94
    if:
      type: text
      regex: 'process\.env[.\[''"]{1,2}VSCODE_PID\b'

  # Matches VSCODE_IPC_HOOK and its VSCODE_IPC_HOOK_CLI sibling; both name the
  # socket that drives the running window, so they are one observation.
  - id: vscode-ipc-hook-env
    desc: Reads VS Code IPC socket env var
    conf: 0.94
    if:
      type: text
      regex: 'process\.env[.\[''"]{1,2}VSCODE_IPC_HOOK'

  # The VS Code JavaScript debugger's auto-attach contract: it hands a child
  # process `VSCODE_INSPECTOR_OPTIONS` alongside its `NODE_OPTIONS --require`
  # bootloader, and the bootloader reads this variable to learn which session to
  # connect back to. Only the debugger and code cooperating with it use it.
  - id: vscode-inspector-options-env
    desc: VS Code debugger inspector-options env var
    crit: notable
    conf: 0.95
    if:
      type: text
      word: VSCODE_INSPECTOR_OPTIONS

composite_rules:
  - id: vscode-instance-env-read
    desc: Reads VS Code editor instance environment variables
    crit: notable
    conf: 0.94
    any:
      - id: vscode-instance-pid-env
      - id: vscode-ipc-hook-env
