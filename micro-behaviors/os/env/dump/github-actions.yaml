# A workflow step whose whole command is `env` / `printenv` / bare `set` prints
# the runner environment into the build log. That is an ordinary debugging step
# in CI, and on its own it says nothing about where the values go — the
# secret-theft inference lives in objectives/supply-chain/trojanized/, which
# pairs this with an outbound sink.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  mbc: C0034

traits:
  - id: gha-step-prints-environment
    desc: Workflow step prints the whole environment
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'run:\s*[>|-]?\s*(env|printenv)\b|run:\s*set\s*($|[|>])'
