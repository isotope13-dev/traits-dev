defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  # Environment stealers do not always serialize process.env as JSON. A
  # common alternative copies every entry and renders NAME=value records for
  # transport. Keep this atomic neutral; the outbound sink supplies intent.
  - id: js-env-key-value-line-dump
    desc: Formats full environment key-value lines
    conf: 0.97
    if:
      type: text
      regex: 'Object\.entries\(process\.env\)[\s\S]{0,500}\$\{key\}=\$\{value\}'

  - id: denylist-filtered-snapshot
    desc: Enumerates environment through prefix denylist
    conf: 0.95
    if:
      type: text
      regex: 'Object\.entries\(process\.env\)[\s\S]{0,180}!\w+\.some\('

  # Whole-environment snapshots are also commonly flattened before transport.
  # Keep this neutral: the exfiltration objective supplies the outbound sink.
  - id: js-base64-environment-snapshot
    desc: Base64-encodes all process environment entries
    conf: 0.96
    if:
      type: text
      regex: 'Object\.entries\(process\.env\)[\s\S]{0,220}toString\(["'']base64'
