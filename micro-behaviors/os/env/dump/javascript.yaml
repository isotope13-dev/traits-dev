defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: denylist-filtered-snapshot
    desc: Enumerates environment through prefix denylist
    conf: 0.95
    if:
      type: text
      regex: 'Object\.entries\(process\.env\)[\s\S]{0,180}!\w+\.some\('
