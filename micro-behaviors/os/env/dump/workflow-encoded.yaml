defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: gha-ruby-encoded-environment-output
    desc: Ruby prints Base64 encoded whole environment
    if:
      type: text
      regex: '(?m)^\s*puts[ (]+Base64\.(strict_)?encode64\(ENV\.to_h\.to_json\)\)? *$'

  - id: gha-python-environment-encoder-input
    desc: Python encodes whole environment for printing
    if:
      type: text
      regex: '(?m)^[ \t]*print\(base64\.b(32|64)encode\(str\(dict\(os\.environ\)\)'

  - id: gha-node-environment-buffer-input
    desc: Node buffer consumes serialized environment
    if:
      type: text
      substr: Buffer.from(JSON.stringify(process.env))

  - id: gha-powershell-environment-byte-input
    desc: PowerShell output consumes whole environment
    if:
      type: text
      regex: '(?im)^ *Write-Output .{0,80}Get-ChildItem Env: *\| *Out-String'

composite_rules:
  - id: gha-python-encoded-environment-output
    desc: Python prints encoded whole environment
    near_lines: 0
    all:
      - id: gha-python-environment-encoder-input
    any:
      - id: micro-behaviors/data/encode/base32::gha-python-base32-stdout
      - id: micro-behaviors/data/encode/base64::gha-python-base64-stdout
  - id: gha-node-encoded-environment-output
    desc: Node prints encoded whole environment
    near_lines: 0
    all:
      - id: gha-node-environment-buffer-input
      - id: micro-behaviors/data/encode/base64::gha-node-base64-stdout
  - id: gha-powershell-encoded-environment-output
    desc: Powershell prints encoded whole environment
    near_lines: 0
    all:
      - id: gha-powershell-environment-byte-input
      - id: micro-behaviors/data/encode/base64::to-base64-string
    unless:
      - id: micro-behaviors/fs/write/file/redirect::gha-powershell-output-file-redirect
