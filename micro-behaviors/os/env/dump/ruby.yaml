# Ruby environment enumeration capability.
# The operation is neutral on its own; credential-theft intent comes from
# pairing it with sensitive-name filtering and an outbound data sink.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
traits:
  - id: ruby-env-serialization
    desc: Ruby serializes the process environment
    conf: 0.9
    if:
      type: text
      regex: '\bENV(\.to_h(ash)?)?\.(to_yaml|to_json|inspect)\b'
    unless:
      # Runtime tests may pass this expression to a child interpreter rather
      # than serializing the package's own environment.
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/lib/runtime/scripted/cruby::source-tree
      - id: well-known/lib/runtime/scripted/jruby::runtime-context

  - id: ruby-env-iteration
    desc: Ruby enumerates process environment entries
    conf: 0.88
    if:
      type: text
      regex: '\bENV\.(each|each_pair|each_key|each_value)\s+do\b'

  - id: ruby-env-sensitive-filter
    desc: Ruby filters env names by secrets
    conf: 0.9
    if:
      type: text
      regex: '\bENV\.(each|each_pair)\s+do[\s\S]{0,220}\b(TOKEN|SECRET|PASSWORD)\b'

  - id: ruby-env-key-filter
    desc: Ruby filters env names by key terms
    conf: 0.9
    if:
      type: text
      regex: '\bENV\.(each|each_pair)\s+do[\s\S]{0,220}\b(KEY|PRIVATE_KEY)\b'

  - id: ruby-env-hash-enumeration
    desc: Ruby filters an environment hash
    conf: 0.9
    if:
      type: text
      regex: '\bENV\.to_h(ash)?\s*\.select\s*\{'

  - id: ruby-env-select-enumeration
    desc: Ruby ENV.select filters entries
    conf: 0.9
    if:
      type: text
      regex: '\bENV\.select\s*\{'

  - id: ruby-env-hash-sensitive-filter
    desc: Ruby hash filter selects secret env names
    conf: 0.92
    if:
      type: text
      regex: '\bENV\.to_h(ash)?\s*\.select\s*\{[\s\S]{0,220}\b(TOKEN|KEY|SECRET|PASSWORD|GEM)\b'

  - id: ruby-env-select-sensitive-filter
    desc: Ruby ENV.select filters secret env names
    conf: 0.92
    if:
      type: text
      regex: '\bENV\.select\s*\{[\s\S]{0,180}\b(TOKEN|SECRET|KEY|AUTH|API)\b'

composite_rules:
  - id: ruby-env-enumeration
    desc: Ruby enumerates process env
    crit: notable
    conf: 0.9
    any:
      - id: ruby-env-iteration
      - id: ruby-env-hash-enumeration
      - id: ruby-env-select-enumeration

  - id: ruby-env-sensitive-selection
    desc: Ruby selects secret-named environment entries
    crit: notable
    conf: 0.92
    any:
      - id: ruby-env-sensitive-filter
      - id: ruby-env-key-filter
      - id: ruby-env-hash-sensitive-filter
      - id: ruby-env-select-sensitive-filter
