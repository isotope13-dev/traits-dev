# PHP getenv() with no arguments returns the entire process environment
# as an associative array. This is a neutral capability: libraries use it
# for configuration and callers may combine it with other behaviors, such as
# host profiling or exfiltration.
defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: C0034
traits:
  - id: php-getenv-no-args
    desc: Reads all process environment variables
    crit: notable
    conf: 0.95
    if:
      # A call-shaped matcher avoids firing on comments, documentation, or
      # string contents that merely mention getenv(). The call's empty
      # argument list distinguishes this whole-environment form from a named
      # variable lookup.
      type: tree-sitter
      kind: call
      regex: '^\s*\\?getenv\s*\(\s*\)\s*$'

  - id: php-env-superglobal
    desc: PHP $_ENV superglobal access
    # $_ENV access is the standard PHP config-bootstrap pattern (Symfony,
    # Laravel, dotenv libraries all read it). Keep this common superglobal
    # access as inventory-only evidence; the complete-environment call above
    # remains a notable capability for behavioral composition.
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: '\$_ENV\b'
