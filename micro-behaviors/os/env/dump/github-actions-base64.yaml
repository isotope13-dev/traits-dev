# Require the complete run value to be a grouped printenv-to-Base64 file
# pipeline. Comments, quoted examples and heredoc bodies cannot start it.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
traits:
  - id: gha-base64-environment-file-pipeline
    desc: Workflow encodes environment into a file
    crit: notable
    conf: 0.96
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '^\s*\{\s*printenv;[^{}\n]{0,120}\}\s*\|\s*base64\s+-w0\s*>\s*\S+\s*$'
