defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96
traits:
  - id: gha-shell-encoded-environment-output
    desc: Workflow logs Base32 or Base64 environment dump
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?m)^\s*(env|printenv) *\| *base(32|64)( +-w *\d+)? *$'
