defaults:
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-azure-tenant-id-env-read
    desc: Python reads Azure tenant ID env var
    for: [python]
    conf: 0.95
    if:
      type: symbol
      kind: member
      exact: os.environ.AZURE_TENANT_ID
  - id: script-aws-credential-env-name
    for: [python, powershell, shell]
    desc: AWS credential env name in a script
    conf: 0.9
    attack: T1552.001
    if:
      type: text
      regex: '(?i)\bAWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|SESSION_TOKEN)\b'
  - id: aws-secret-access-key-var-encoded
    for: [shell, python, javascript, powershell, pe, elf]
    desc: Encoded AWS secret-key reference
    crit: notable
    conf: 0.86
    if:
      type: encoded
      word: AWS_SECRET_ACCESS_KEY
  # Relocated from objectives/credential-access/env/secrets/cloud-access
  # (aws-secret-env-access). Any SDK, uploader or test that authenticates to
  # S3 from the environment does this; theft needs corroborating legs.
  - id: aws-secret-access-key-env-read
    desc: Reads AWS_SECRET_ACCESS_KEY from the environment
    for: [scripts, source]
    conf: 0.88
    attack: T1552.001
    if:
      type: text
      regex: '(?i)(env(iron)?[\.\[:]|getenv\().{0,10}["'']?AWS_SECRET_ACCESS_KEY\b'
  - id: python-aws-secret-access-key-env-read
    desc: Python reads AWS secret-key environment variable
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: AWS_SECRET_ACCESS_KEY
  - id: python-aws-secret-access-key-environ-read
    desc: Python indexes AWS secret-key env
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'os\.environ\s*\[\s*["'']AWS_SECRET_ACCESS_KEY["'']\s*\]'
  - id: azure-credentials-dup
    for: [shell, python, javascript, powershell, pe, elf]
    desc: Azure credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^AZURE_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: google-credentials
    for: [shell, python, javascript, powershell, pe, elf]
    desc: Google credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^GOOGLE_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: docker-credentials
    for: [shell, python, javascript, powershell, pe, elf]
    desc: Docker credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^DOCKER_.{0,50}_(TOKEN|KEY|SECRET)$
