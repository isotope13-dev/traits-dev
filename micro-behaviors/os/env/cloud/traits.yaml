defaults:
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-azure-tenant-id-env-read
    desc: Python reads Azure tenant ID env var
    for: [python]
    conf: 0.95
    if:
      type: symbol
      kind: member
      exact: os.environ.AZURE_TENANT_ID
  - id: aws-env-secret-vars
    for: [shell, python, javascript, powershell, pe, elf]
    desc: AWS credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^AWS_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: aws-secret-access-key-var
    for: [shell, python, javascript, powershell, pe, elf, csharp]
    # A bare name can occur in documentation or SDK guidance; it does not
    # establish that the program reads the credential.  Keep it as incomplete
    # evidence and let the access-specific atom below carry the behavior.
    desc: AWS secret-key environment name reference
    crit: notable
    conf: 0.86
    if:
      type: text
      word: AWS_SECRET_ACCESS_KEY
  # Compiled binaries pack string constants back to back, so the name sits
  # between two other constants with no word boundary on either side (a Rust
  # payload stored `...:9000AWS_ACCESS_KEY_IDAWS_SECRET_ACCESS_KEY/var/run...`)
  # and the `word:` atom above never matches. String extraction also splits
  # such blobs at xref-derived lengths that need not fall on a constant's
  # boundary (seen: `...ACCESS_K` | `EY/var/...`), hence raw bytes. The two
  # names together are the credential pair an SDK or a harvester reads.
  - id: aws-access-key-pair-names-binary
    for: [elf, macho, pe]
    desc: Binary names the AWS access-key env pair
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: 'AWS_ACCESS_KEY_ID[\s\S]{0,64}AWS_SECRET_ACCESS_KEY'
  - id: aws-secret-access-key-var-encoded
    for: [shell, python, javascript, powershell, pe, elf]
    desc: Encoded AWS secret-key reference
    crit: notable
    conf: 0.86
    if:
      type: encoded
      word: AWS_SECRET_ACCESS_KEY
  - id: python-aws-secret-access-key-env-read
    desc: Python reads AWS secret-key environment variable
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: AWS_SECRET_ACCESS_KEY
  - id: python-aws-secret-access-key-environ-read
    desc: Python indexes AWS secret-key env
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'os\.environ\s*\[\s*["'']AWS_SECRET_ACCESS_KEY["'']\s*\]'
  - id: azure-credentials-dup
    for: [shell, python, javascript, powershell, pe, elf]
    desc: Azure credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^AZURE_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: google-credentials
    for: [shell, python, javascript, powershell, pe, elf]
    desc: Google credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^GOOGLE_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: docker-credentials
    for: [shell, python, javascript, powershell, pe, elf]
    desc: Docker credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^DOCKER_.{0,50}_(TOKEN|KEY|SECRET)$
