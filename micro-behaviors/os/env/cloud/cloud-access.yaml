defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: google-cloud-credential-env-read
    desc: Reads Google credential environment variable
    if:
      type: symbol
      kind: member
      regex: '^process\.env\.GOOGLE_[A-Z0-9_]*(TOKEN|SECRET|CREDENTIALS?)$'
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
  - id: azure-cloud-credential-env-read
    desc: Reads Azure credential environment variable
    if:
      type: symbol
      kind: member
      regex: '^process\.env\.AZURE_[A-Z0-9_]*(TOKEN|KEY|SECRET|CREDENTIALS?)$'
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
composite_rules:
  - id: python-cloud-credential-env-read
    desc: Python reads a cloud credential env var
    crit: notable
    conf: 0.9
    for: [python]
    any:
      - id: python-gcp-app-creds-env-read
      - id: python-gcp-service-account-env-read
      - id: python-azure-client-secret-env-read
      - id: python-azure-tenant-id-env-read
