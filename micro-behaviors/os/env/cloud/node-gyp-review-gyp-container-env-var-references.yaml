defaults:
  platforms: [unix, windows]
  for: [gyp]
traits:
  - id: gyp-container-env-var-references
    desc: gyp references ECS environment variables
    crit: notable
    conf: 0.99
    if:
      type: value
      path: targets[*].actions[*].action[*]
      regex: 'AWS_CONTAINER_CREDENTIALS_RELATIVE_URI|ECS_CONTAINER_METADATA_URI_V4'
