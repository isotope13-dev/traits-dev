# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
traits:
- id: postinstall-ecs-metadata-uri-reference
  desc: Postinstall references ECS metadata variable
  crit: notable
  conf: 0.98
  for: [package.json]
  if:
    type: value
    path: scripts.postinstall
    regex: '\bprocess\.env\.ECS_CONTAINER_METADATA_URI_V4\b'
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture/
