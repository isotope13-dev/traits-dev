composite_rules:
- platforms:
  - windows
  for:
  - c
  - cpp
  - pe
  - dll
  id: windows-cloud-env-name-cluster
  desc: Binary names at least four cloud credential variables
  crit: notable
  conf: 0.94
  any:
  - id: micro-behaviors/os/env/cloud::native-aws-access-key-id-name
  - id: micro-behaviors/os/env/cloud::native-aws-secret-access-key-name
  - id: micro-behaviors/os/env/cloud::native-aws-session-token-name
  - id: micro-behaviors/os/env/cloud::native-azure-client-secret-name
  - id: micro-behaviors/os/env/cloud::native-gcp-credentials-name
  - id: micro-behaviors/os/env/cloud::native-service-account-key-name
  needs: 4
  unless:
  - id: well-known/lib/data/oracle-managed-data-access::oracle-managed-data-access-library
