# Cloud credential environment-variable names embedded in native Windows code.
# Relocated from objectives/credential-access/env/secrets/bulk-access: a name is
# what every cloud SDK and storage driver (GDAL, curl, rclone) reads to
# authenticate. The bulk-access objective combines several with an env read.

defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1552.001
  crit: notable
  conf: 0.9

traits:
  - id: native-aws-access-key-id-name
    desc: AWS_ACCESS_KEY_ID name in native code
    if:
      type: text
      substr: AWS_ACCESS_KEY_ID

  - id: native-aws-secret-access-key-name
    desc: AWS_SECRET_ACCESS_KEY name in native code
    if:
      type: text
      substr: AWS_SECRET_ACCESS_KEY

  - id: native-aws-session-token-name
    desc: AWS_SESSION_TOKEN name in native code
    if:
      type: text
      substr: AWS_SESSION_TOKEN

  - id: native-azure-client-secret-name
    desc: AZURE_CLIENT_SECRET name in native code
    if:
      type: text
      substr: AZURE_CLIENT_SECRET

  - id: native-gcp-credentials-name
    desc: GOOGLE_APPLICATION_CREDENTIALS in native code
    if:
      type: text
      substr: GOOGLE_APPLICATION_CREDENTIALS

  - id: native-service-account-key-name
    desc: SERVICE_ACCOUNT_KEY name in native code
    if:
      type: text
      substr: SERVICE_ACCOUNT_KEY
