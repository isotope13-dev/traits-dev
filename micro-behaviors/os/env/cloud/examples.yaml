defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.7
traits:
- id: aws-access-key-source-example
  desc: Literal references process.env AWS access key
  if:
    type: string_literal
    substr: process.env.AWS_ACCESS_KEY
- id: aws-secret-source-example
  desc: String literal references process.env AWS secret
  if:
    type: string_literal
    substr: process.env.AWS_SECRET
