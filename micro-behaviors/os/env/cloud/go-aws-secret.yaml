defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-aws-secret-env-var
    desc: Go reads AWS secret-access-key env
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'os\.(Getenv|LookupEnv)\(\s*["'']AWS_SECRET_ACCESS_KEY["'']'
    unless:
      - id: well-known/app/system/olares::cli-source-tree
      - id: metadata/package/documentation/claims::go-cloud-default-credentials-doc-marker
      # Test assertions read mocked values to verify setup; they do not
      # implement credential harvesting in the shipped CLI.
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::go-test-helper-file

