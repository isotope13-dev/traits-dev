defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: node-aws-access-key-member
    desc: Accesses an AWS access-key environment member
    if:
      type: symbol
      kind: member
      regex: '^process\.env\.AWS_ACCESS_KEY(_ID)?$'
  - id: node-aws-secret-member
    desc: Accesses an AWS secret-key environment member
    if:
      type: symbol
      kind: member
      exact: process.env.AWS_SECRET_ACCESS_KEY
  - id: node-cloudflare-token-member
    desc: Reads Cloudflare API-token environment member
    conf: 0.82
    if:
      type: symbol
      kind: member
      regex: '^process\.env\.(CLOUDFLARE_API_TOKEN|CF_API_TOKEN)$'
    unless:
      - type: text
        regex: 'import\s*\{\s*defineConfig\s*\}\s*from\s*["'']drizzle-kit["'']'
