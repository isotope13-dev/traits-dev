# A debug-option reference does not establish that the option is enabled.
# Keep the observation visible in upstream clients and in embedding programs;
# attack context belongs to consumers such as the BOF Tailscale composites.
defaults:
  platforms: [windows, unix]
  for: [go, c, cpp, pe, dll, shell, scripts]

traits:
  - id: tailscale-derp-websocket-option
    desc: DERP WebSocket debug option reference
    crit: notable
    conf: 0.97
    if:
      type: text
      word: TS_DEBUG_DERP_WS_CLIENT
