# LLM service configuration observations; no launch or traffic is implied.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
  crit: notable
  conf: 0.9

traits:
  # Matches assignments, not comma-separated test tuples.
  - id: anthropic-base-url-off-vendor
    desc: Anthropic base URL assigns non-vendor host
    if:
      type: text
      regex: '\bANTHROPIC_(BASE_URL|API_URL)\b["'']?\s*[:=]\s*["'']?https?://[\w.:-]{3,64}'
    not:
      - substr: api.anthropic.com
      - substr: localhost
      - substr: 127.0.0.1

  - id: anthropic-base-url-setdefault-call
    desc: setDefault configures Anthropic base URL
    for: [javascript, typescript]
    if:
      type: text
      regex: 'setDefault\s*\(\s*[''"]ANTHROPIC_BASE_URL[''"]\s*,'

  - id: openai-base-url-off-vendor
    desc: OpenAI base URL assigns non-vendor host
    if:
      type: text
      regex: '\bOPENAI_(BASE_URL|API_BASE)\b["'']?\s*[:=]\s*["'']?https?://[\w.:-]{3,64}'
    not:
      - substr: api.openai.com
      - substr: localhost
      - substr: 127.0.0.1

  - id: deepseek-base-url-off-vendor
    desc: DeepSeek base URL assigns non-vendor host
    if:
      type: text
      regex: '\bDEEPSEEK_BASE_URL\b["'']?\s*[:=]\s*["'']?https?://[\w.:-]{3,64}'
    not:
      - substr: api.deepseek.com
      - substr: localhost
      - substr: 127.0.0.1

  # Claude Code spells these CLAUDE_CODE_ATTRIBUTION_HEADER and
  # CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC. The vendor prefix is left open so
  # the same convention in other agent CLIs matches without naming a product.
  - id: ai-agent-attribution-header-disabled
    desc: Agent attribution header disabled
    conf: 0.94
    if:
      type: text
      regex: '\b\w+_ATTRIBUTION_HEADER\b["'']?\s*[:=]\s*["'']?(0|false)\b'

  - id: ai-agent-nonessential-traffic-disabled
    desc: Agent non-essential traffic disabled
    conf: 0.94
    if:
      type: text
      regex: '\b\w+_DISABLE_NONESSENTIAL_TRAFFIC\b["'']?\s*[:=]\s*["'']?(1|true)\b'

composite_rules:
  - id: anthropic-proxy-configuration
    desc: Anthropic base URL setter and proxy URL co-occur
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    scope: file
    all:
      - id: anthropic-base-url-setdefault-call
      - id: micro-behaviors/communications/http/url/domain::https-proxy-named-host

  - id: llm-api-base-url-third-party-host
    desc: LLM API base URL points at a non-vendor host
    crit: notable
    conf: 0.9
    any:
      - id: anthropic-base-url-off-vendor
      - id: openai-base-url-off-vendor
      - id: deepseek-base-url-off-vendor

  # Configuration co-occurrence does not establish traffic or operator intent.
  - id: llm-relay-with-vendor-telemetry-disabled
    desc: Off-vendor API setting with telemetry suppression
    crit: notable
    conf: 0.93
    near_lines: 24
    all:
      - id: llm-api-base-url-third-party-host
    any:
      - id: ai-agent-attribution-header-disabled
      - id: ai-agent-nonessential-traffic-disabled
      - id: micro-behaviors/process/create/agent::ai-agent-response-storage-disabled
