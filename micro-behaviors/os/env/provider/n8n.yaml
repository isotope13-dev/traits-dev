# n8n application configuration includes noncredential settings.
traits:
- id: n8n-runtime-env-reference
  desc: References n8n runtime environment variable
  conf: 0.97
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: process\.env\.(N8N_USER_FOLDER|N8N_ENCRYPTION_KEY|EXECUTIONS_MODE|N8N_RUNNERS_ENABLED)
  platforms:
  - unix
  - windows
  crit: notable
