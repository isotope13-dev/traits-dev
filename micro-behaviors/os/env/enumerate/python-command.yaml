# Command references do not prove execution at import time. Embedded test
# programs can contain these calls too; intent requires separate evidence.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-env-command-reference
    desc: Python os shell env command reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.(system|popen)\s*,\s*["'']env["'']|os\.(system|popen)\s*\(\s*["'']env["'']'
