composite_rules:
- id: process-env-direct-dump
  desc: Serializes Node environment directly as JSON
  crit: notable
  conf: 0.85
  near_bytes: 120
  all:
  - id: micro-behaviors/os/env/read::javascript
  - id: micro-behaviors/data/serialize/json::process-env-json-stringify
- id: node-env-json-serialization-context
  desc: Environment references with JSON serialization
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/env/enumerate::process-env-direct-dump
  - id: micro-behaviors/os/env/enumerate::node-env-alias-json-cooccurrence
- id: node-env-alias-json-cooccurrence
  desc: Environment alias near JSON serialization
  crit: notable
  conf: 0.88
  near_bytes: 1200
  all:
  - id: micro-behaviors/os/env/read::node-process-env-alias
  - id: micro-behaviors/data/serialize/json::parsed-or-environment-json-stringify
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
