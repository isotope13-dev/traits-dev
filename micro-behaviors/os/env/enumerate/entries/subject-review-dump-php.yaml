defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  mbc: C0034
traits:
- id: php-getenv-no-args
  desc: Reads all process environment variables
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    kind: call
    regex: ^\s*\\?getenv\s*\(\s*\)\s*$
- id: php-env-superglobal
  desc: PHP $_ENV superglobal access
  crit: baseline
  conf: 0.7
  if:
    type: text
    regex: \$_ENV\b
