defaults:
  platforms:
  - windows
  - unix
  for:
  - c
  - cpp
  - elf
  - pe
traits:
- id: js-process-env-spread
  desc: Spread of entire process.env into object
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |
      ((spread_element
        (member_expression
          object: (identifier) @process
          property: (property_identifier) @env)) @spread
        (#eq? @process "process")
        (#eq? @env "env"))
- id: js-object-keys-env
  desc: JavaScript enumerates process.env keys
  crit: notable
  conf: 0.75
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    kind: call
    regex: ^Object\.keys\s*\(\s*process\.env\s*\)$
- id: js-object-entries-env
  desc: JavaScript enumerates process.env entries
  crit: notable
  conf: 0.75
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: Object\.entries\s*\(\s*process\.env\s*(\)|\|\||\?\?)
- id: python-environ-items-loop
  desc: Iterates over Python environment entries
  crit: notable
  conf: 0.88
  for:
  - python
  ref: sha256:7c8adc80c7efc628483693598c7827bbc1529a0e1fd87d7cdd5ff6af889c008f
  if:
    type: symbol
    kind: call
    exact: os.environ.items
- id: python-filtered-environment-map
  desc: Python copies filtered environment entries
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: os\.environ\.items\(\)[\s\S]{0,180}if\s+\w+\.upper\(\)\.(startswith|endswith)\(
- id: python-environ-dict
  desc: Python snapshots the full process environment
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    substr: dict(os.environ)
- id: python-environment-snapshot-field
  desc: Stores full environment in named field
  crit: notable
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: '["'']env_snapshot["'']\s*:\s*dict\s*\(\s*os\.environ\s*\)'
- id: python-environ-string
  desc: Python converts environ to string
  crit: baseline
  conf: 0.7
  for:
  - python
  if:
    type: text
    substr: str(os.environ)
- id: go-environ-iteration
  desc: Go iterates over os.Environ()
  crit: notable
  conf: 0.85
  for:
  - go
  if:
    type: text
    regex: range\s+os\.Environ\s*\(\s*\)
composite_rules:
- id: node-environment-enumeration-or-copy
  desc: Node environment enumeration or object copy
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/os/env/enumerate/entries::js-process-env-spread
  - id: micro-behaviors/os/env/enumerate/entries::js-object-keys-env
  - id: micro-behaviors/os/env/enumerate/entries::js-object-entries-env
