defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-environ-items-value-mapping
    desc: Builds a mapping with environment entry values
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((dictionary_comprehension
          body: (pair value: (identifier) @value)
          (for_in_clause
            left: (pattern_list (identifier) (identifier) @entry_value)
            right: (call function: (attribute object: (attribute object: (identifier) @os attribute: (identifier) @env) attribute: (identifier) @items)))) @evidence
          (#eq? @os "os") (#eq? @env "environ") (#eq? @items "items")
          (#eq? @value @entry_value))
