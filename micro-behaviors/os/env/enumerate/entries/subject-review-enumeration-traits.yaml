defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
composite_rules:
  - id: environment-block-enumeration
    desc: Enumerate process environment block
    crit: baseline
    conf: 0.88
    all:
      - id: micro-behaviors/os/env/enumerate/native-block::get-environment-strings-wide
      - id: micro-behaviors/os/env/write::free-environment-strings-wide
    downgrade:
      any:
        - id: metadata/lang/compiled/
