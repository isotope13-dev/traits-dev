# A whole-environment snapshot piped into an encoder inside a package.json
# script, for example `$(env | base64)`. This is a bulk environment snapshot,
# not a credential-name filter, so it does not belong to the credential
# branch. Intent comes from the install-hook composite that posts the result.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9
  mbc: E1552
  attack: T1552.001
traits:
  - id: npm-script-shell-env-snapshot
    desc: npm script pipes full environment to encoder
    if:
      type: value
      path: scripts[*]
      regex: '\b(printenv|env)\s*\|\s*(base64|xxd|gzip)\b'
