defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable
  conf: 0.86

traits:
  - id: rust-env-module-vars
    desc: Enumerates the Rust process environment
    crit: notable
    conf: 0.9
    attack: T1082
    if:
      type: text
      regex: '\benv::vars\s*\(\s*\)'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
