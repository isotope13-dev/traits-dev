# A parsed call excludes comments and quoted documentation. Snapshotting the
# environment is notable even when no selection or serialization follows.
defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-env-hash-snapshot
    desc: Copies process environment into Ruby hash
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '^ENV[.]to_h(ash)?$'
