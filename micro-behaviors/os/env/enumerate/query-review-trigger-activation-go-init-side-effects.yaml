defaults:
  conf: 0.95
  platforms:
  - unix
  - windows
  for:
  - go

composite_rules:
  - id: go-init-env-enumeration-context
    desc: Go init and environment enumeration coexist
    crit: suspicious
    # Same precision guard as go-init-network-stager: the collection must
    # happen inside the init goroutine, not anywhere in a large package.
    near_lines: 25
    all:
      - id: micro-behaviors/process/thread/create::go-init-with-goroutine
      - id: micro-behaviors/os/env/enumerate::os-environ
    any:
      - id: micro-behaviors/communications/http/client/library::go-http-newrequest
      - id: micro-behaviors/fs/read/file/full::os-readfile
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/package/testing/presence/harness::go-test-helper-file
      - id: metadata/package/testing/presence/path::go-tools-testdata-directory-path
