defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe]
  crit: baseline
traits:
  - id: os-environ
    desc: os.Environ() enumerates the entire environment
    crit: notable
    conf: 0.85
    attack: T1082
    if:
      type: symbol
      exact: os.Environ
  # Prefix-scoped own-namespace expansion: a config loader iterating Environ
  # only to find numbered variants of its own literal setting prefix
  # (strings.Cut each entry, HasPrefix the key against the app prefix) reads
  # its own settings and discards everything else — the opposite of harvest.
  - id: go-environ-own-prefix-filter
    desc: Environ filtered to an own literal prefix
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: 'strings\.Cut\(env, "="\)[\s\S]{0,120}strings\.HasPrefix\(key, '
  # Passing os.Environ() into a child process is ordinary. Joining the full
  # environment into one string is the shape that gets posted or otherwise sent.
  - id: go-environ-joined
    desc: Joins full Go environment into string
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'strings\.Join\(\s*os\.Environ\(\)|os\.Environ\(\)[\s\S]{0,200}strings\.Join\('
  # A broker that splits each entry, skips an empty value, and appends only
  # the key name is inventorying names. It is not collecting secret values.
  - id: go-environ-key-name-inventory
    desc: Go env scan keeps key names only
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'parts\[1\] == ""[\s\S]{0,400}append\([\w.]+, key\)'
