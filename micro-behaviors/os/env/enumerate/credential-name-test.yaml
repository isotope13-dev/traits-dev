# Callback binding distinguishes name inventories from value tests and prose.
# Indexed call facts do not project the callback's returned predicate.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: js-env-name-credential-regex-callback
    desc: JavaScript credential-name filter callback
    for: [javascript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression object: (identifier) @object
                property: (property_identifier) @keys)
              arguments: (arguments . (member_expression
                object: (identifier) @process
                property: (property_identifier) @env) .))
            property: (property_identifier) @filter)
          arguments: (arguments . [
            (arrow_function
              [(identifier) @key (formal_parameters . (identifier) @key .)]
              body: [(call_expression
              function: (member_expression object: (regex) @pattern
                property: (property_identifier) @test)
              arguments: (arguments . (identifier) @tested .)) (statement_block . (return_statement (call_expression
              function: (member_expression object: (regex) @pattern
                property: (property_identifier) @test)
              arguments: (arguments . (identifier) @tested .))) .)])
            (function_expression parameters: (formal_parameters . (identifier) @key .)
              body: (statement_block . (return_statement (call_expression
              function: (member_expression object: (regex) @pattern
                property: (property_identifier) @test)
              arguments: (arguments . (identifier) @tested .))) .))
          ] .)) @inventory
          (#eq? @object "Object") (#eq? @keys "keys")
          (#eq? @process "process") (#eq? @env "env")
          (#eq? @filter "filter") (#eq? @test "test")
          (#eq? @key @tested)
          (#match? @pattern "(?i)(key|secret|token|pass|auth|cred)"))
  - id: ts-env-name-credential-regex-callback
    desc: TypeScript credential-name filter callback
    for: [typescript]
    if:
      type: tree-sitter
      language: typescript
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression object: (identifier) @object
                property: (property_identifier) @keys)
              arguments: (arguments . (member_expression
                object: (identifier) @process
                property: (property_identifier) @env) .))
            property: (property_identifier) @filter)
          arguments: (arguments . [
            (arrow_function
              [(identifier) @key (formal_parameters . (required_parameter pattern: (identifier) @key) .)]
              body: [(call_expression
              function: (member_expression object: (regex) @pattern
                property: (property_identifier) @test)
              arguments: (arguments . (identifier) @tested .)) (statement_block . (return_statement (call_expression
              function: (member_expression object: (regex) @pattern
                property: (property_identifier) @test)
              arguments: (arguments . (identifier) @tested .))) .)])
            (function_expression parameters: (formal_parameters . (required_parameter pattern: (identifier) @key) .)
              body: (statement_block . (return_statement (call_expression
              function: (member_expression object: (regex) @pattern
                property: (property_identifier) @test)
              arguments: (arguments . (identifier) @tested .))) .))
          ] .)) @inventory
          (#eq? @object "Object") (#eq? @keys "keys")
          (#eq? @process "process") (#eq? @env "env")
          (#eq? @filter "filter") (#eq? @test "test")
          (#eq? @key @tested)
          (#match? @pattern "(?i)(key|secret|token|pass|auth|cred)"))
composite_rules:
  - id: js-env-name-credential-regex-filter
    desc: Filters environment names with credential regex
    for: [javascript, typescript]
    any:
      - id: js-env-name-credential-regex-callback
      - id: ts-env-name-credential-regex-callback
