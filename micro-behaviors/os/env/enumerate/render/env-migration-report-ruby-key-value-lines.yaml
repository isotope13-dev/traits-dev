defaults:
  platforms:
  - unix
  - windows
  for:
  - ruby
traits:
- id: ruby-environment-key-value-lines
  desc: Renders environment entries as key=value lines
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: "((call\n  receiver: (call\n    receiver: (call receiver: (constant) @environment method: (identifier) @snapshot)\n    method: (identifier) @map\n    block: (block\n      parameters: (block_parameters (identifier) @key (identifier) @value)\n      body: (block_body\n        (string (interpolation (identifier) @rendered_key)\n          (string_content) @separator\n          (interpolation (identifier) @rendered_value)))))\n  method: (identifier) @join\n  arguments: (argument_list (string (escape_sequence) @newline)))\n  (#eq? @environment \"ENV\") (#match? @snapshot \"^to_h(ash)?$\")\n  (#eq? @map \"map\") (#eq? @join \"join\")\n  (#eq? @key @rendered_key) (#eq? @value @rendered_value)\n  (#eq? @separator \"=\") (#eq? @newline \"\\\\n\"))\n"
