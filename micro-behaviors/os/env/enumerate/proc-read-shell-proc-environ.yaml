defaults:
  platforms: [linux]
  for: [shell]

traits:
  - id: shell-proc-environ-loop-read
    desc: Reads globbed process environments through stdin
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: bash
      query: |
        ((for_statement
          variable: (variable_name) @iterator
          value: (_) @source
          body: (do_group
            (redirected_statement
              body: (command name: (command_name (word) @reader))
              redirect: (file_redirect "<"
                destination: (string
                  (simple_expansion (variable_name) @read))))))
         (#match? @source "^/proc/(\\*|\\[0-9\\]\\*)/environ$")
         (#eq? @iterator @read)
         (#eq? @reader "tr"))
