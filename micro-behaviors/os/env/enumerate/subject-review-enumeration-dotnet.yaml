defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  crit: suspicious
  conf: 0.94
  attack: T1552.001

traits:
  - id: dotnet-env-secret-filter
    desc: .NET filters env vars by secret keywords
    if:
      type: text
      regex: 'GetEnvironmentVariables\(\)[\s\S]{0,260}(SECRET|TOKEN|CRED|AUTH)'
    unless:
      - id: well-known/tool/detection/xgrep::xgrep-scanner-context
