defaults:
  platforms: [windows, unix]
  for: [c, cpp, elf, pe]
traits:
  - id: js-object-keys-env
    desc: JavaScript enumerates process.env keys
    crit: notable
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '^Object\.keys\s*\(\s*process\.env\s*\)$'

  - id: js-object-entries-env
    desc: JavaScript enumerates process.env entries
    crit: notable
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Object\.entries\s*\(\s*process\.env\s*(\)|\|\||\?\?)'
  - id: python-environ-items-loop
    desc: Iterates over Python environment entries
    crit: notable
    conf: 0.88
    for: [python]
    ref: sha256:7c8adc80c7efc628483693598c7827bbc1529a0e1fd87d7cdd5ff6af889c008f
    if:
      type: symbol
      kind: call
      exact: os.environ.items
  - id: go-environ-iteration
    desc: Go iterates over os.Environ()
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: text
      regex: 'range\s+os\.Environ\s*\(\s*\)'

# An exact OR of the three operations used by the npm telemetry exclusion.
# Ancestor consumers use existence, with no needs/proximity cardinality.
composite_rules:
  - id: node-environment-enumeration-or-copy
    desc: Node environment enumeration or object copy
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/os/env/enumerate/copy::js-process-env-spread
      - id: micro-behaviors/os/env/enumerate/list::js-object-keys-env
      - id: micro-behaviors/os/env/enumerate/list::js-object-entries-env
