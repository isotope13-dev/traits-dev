defaults:
  platforms:
    - windows
    - unix
  for:
    - ruby
  crit: notable
traits:
  - id: ruby-env-iteration
    desc: Ruby enumerates process environment entries
    conf: 0.88
    if:
      type: text
      regex: \bENV\.(each|each_pair|each_key|each_value)\s+do\b
  - id: ruby-env-hash-enumeration
    desc: Ruby filters an environment hash
    conf: 0.9
    if:
      type: text
      regex: \bENV\.to_h(ash)?\s*\.select\s*\{
  - id: ruby-env-select-enumeration
    desc: Ruby ENV.select filters entries
    conf: 0.9
    if:
      type: text
      regex: \bENV\.select\s*\{
  - id: ruby-env-select-database-filter
    desc: Ruby ENV.select filters database settings
    conf: 0.93
    if:
      type: text
      regex: \bENV\.select\s*\{[\s\S]{0,180}\b(DATABASE|MYSQL|AURORA|POSTGRES|REDIS|RDS)\b
composite_rules:
  - id: ruby-env-enumeration
    desc: Ruby enumerates process env
    conf: 0.9
    any:
      - id: micro-behaviors/os/env/enumerate/list::ruby-env-iteration
      - id: micro-behaviors/os/env/enumerate/list::ruby-env-hash-enumeration
      - id: micro-behaviors/os/env/enumerate/list::ruby-env-select-enumeration
