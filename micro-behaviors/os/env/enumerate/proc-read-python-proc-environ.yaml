defaults:
  for: [python]
  platforms: [linux]
  crit: notable
  conf: 0.97

traits:
  - id: python-formatted-proc-environ-read
    desc: Reads a process environment through procfs
    if:
      type: tree-sitter
      language: python
      query: |
        ((with_statement
          (with_clause (with_item value: (as_pattern
            (call function: (identifier) @open
              arguments: (argument_list . (binary_operator
                left: (string) @path operator: "%")))
            alias: (as_pattern_target (identifier) @handle))))
          body: (block . (expression_statement (assignment
            right: (call function: (attribute
              object: (identifier) @reader attribute: (identifier) @read)))))) @operation
          (#eq? @open "open")
          (#match? @path "^['\"]/proc/%[0-9]*[ds]/environ['\"]$")
          (#eq? @handle @reader)
          (#eq? @read "read"))
    unless:
      # A quoted example recovered as plain source is not an invoked read.
      - id: metadata/lang/source/origin::plain-source-layer-path
