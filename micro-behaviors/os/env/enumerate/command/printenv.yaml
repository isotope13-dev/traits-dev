defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  crit: notable
  conf: 0.6
  attack: T1082
traits:
- id: printenv-unquoted-command
  desc: Calls unquoted printenv executable
  if:
    type: symbol
    kind: call
    regex: ^([^"'$`\\\r\n]{0,1024}/)?printenv$
- id: printenv-double-quoted-command
  desc: Calls double-quoted printenv executable
  if:
    type: symbol
    kind: call
    regex: ^"([^"$`\\\r\n]{0,1024}/)?printenv"$
- id: printenv-single-quoted-command
  desc: Calls single-quoted printenv executable
  if:
    type: symbol
    kind: call
    regex: ^'([^'\r\n]{0,1024}/)?printenv'$
