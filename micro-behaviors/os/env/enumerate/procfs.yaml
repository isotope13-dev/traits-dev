# A procfs glob over every numeric PID reads other processes' environments,
# unlike /proc/self/environ or a single named PID. The glob is the claim.
defaults:
  platforms: [linux]
  for: [shell, github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: shell-procfs-all-process-environ
    desc: Reads every process environment via procfs glob
    if:
      type: text
      regex: '/proc/(\*|\[0-9\][*+])/environ\b'
