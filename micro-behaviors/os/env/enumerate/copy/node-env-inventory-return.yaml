defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-env-entries-copy-return
    desc: Returns a copy of process.env
    crit: notable
    conf: 0.99
    size_max: 65536
    if:
      type: tree-sitter
      # Bind the loop inputs, destination and returned field within one function.
      query: |
        ((call_expression
          function: (parenthesized_expression
            (_ body: (statement_block
              (for_in_statement
                left: (array_pattern . (identifier) @key . (identifier) @value .)
                operator: "of"
                right: (call_expression
                  function: (member_expression
                    object: (identifier) @object
                    property: (property_identifier) @entries)
                  arguments: (arguments . (member_expression
                    object: (identifier) @process
                    property: (property_identifier) @env) .))
                body: (statement_block . (expression_statement (assignment_expression
                  left: (subscript_expression
                    object: (identifier) @copy
                    index: (identifier) @copied_key)
                  right: (identifier) @copied_value)) .))
              (return_statement (object (pair value: (identifier) @returned)))))))
          (#eq? @object "Object")
          (#eq? @entries "entries")
          (#eq? @process "process")
          (#eq? @env "env")
          (#eq? @key @copied_key)
          (#eq? @value @copied_value)
          (#eq? @copy @returned))

  - id: node-env-direct-object-return
    desc: Returns process.env in an object
    crit: notable
    conf: 0.99
    size_max: 65536
    if:
      type: tree-sitter
      query: |
        ((return_statement (object
          [(pair value: (member_expression object: (identifier) @process
                    property: (property_identifier) @env))
           (spread_element (member_expression object: (identifier) @process
                    property: (property_identifier) @env))]))
          (#eq? @process "process")
          (#eq? @env "env"))
