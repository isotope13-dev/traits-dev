defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: debug-prefixed-env-filter
  desc: Filters environment names with a debug_ prefix
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    query: "((call_expression\n  function: (member_expression\n    object: (call_expression\n      function: (member_expression\n        object: (identifier) @object\n        property: (property_identifier) @keys)\n      arguments: (arguments . (member_expression\n        object: (identifier) @process\n        property: (property_identifier) @env)))\n    property: (property_identifier) @filter)\n  arguments: (arguments . [\n    (arrow_function body: (call_expression\n      function: (member_expression\n        object: (regex) @pattern\n        property: (property_identifier) @test)))\n    (function_expression body: (statement_block\n      (return_statement (call_expression\n        function: (member_expression\n          object: (regex) @pattern\n          property: (property_identifier) @test)))))\n  ])) @filtered\n  (#eq? @object \"Object\")\n  (#eq? @keys \"keys\")\n  (#eq? @process \"process\")\n  (#eq? @env \"env\")\n  (#eq? @filter \"filter\")\n  (#eq? @test \"test\")\n  (#match? @pattern\
      \ \"^/\\\\^debug_/i?$\"))\n"
