defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
traits:
  - id: shell-env-dump
    desc: Lifecycle hook dumps env vars via shell
    crit: suspicious
    conf: 0.95
    attack: T1552.007
    if:
      type: text
      regex: '(?m)^[ \t]*[^#\r\n]{0,200}\$\(env[;|]'

