defaults:
  for:
  - shell
  platforms:
  - unix
  crit: notable
  conf: 0.96
composite_rules:
- id: shell-env-credential-name-filter
  desc: Filters env output for credential terms
  any:
  - id: micro-behaviors/os/env/enumerate/filter::guarded-env-credential-filter-shape
  - id: micro-behaviors/os/env/enumerate/filter::absolute-env-credential-filter-shape
  - id: micro-behaviors/os/env/enumerate/filter::grep-credential-term
