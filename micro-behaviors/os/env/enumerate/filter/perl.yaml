defaults:
  platforms: [unix, windows]
  for: [perl]
  crit: notable
  conf: 0.9
traits:
- id: perl-prefix-sensitive-env-filter
  desc: Perl secret terms precede ENV keys
  if:
    type: text
    regex: '(SECRET|TOKEN|KEY)[\s\S]{0,40}\bkeys\s+%ENV'
- id: perl-loop-sensitive-env-filter
  desc: Perl ENV keys precede secret filter
  if:
    type: text
    exclude_comments: true
    regex: '\bkeys\s+%ENV[\s\S]{0,130}=~\s*/[^/\n]{0,40}\b(SECRET|TOKEN|KEY)\b'
