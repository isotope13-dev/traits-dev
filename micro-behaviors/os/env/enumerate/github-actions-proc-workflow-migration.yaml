defaults:
  platforms: [unix]
  for: [shell, python, javascript, typescript, rust, github-actions]
  attack: "T1195.002, T1552.001"
traits:
- id: python-proc-listdir-call
  desc: Calls listdir or scandir on /proc
  crit: component
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: 'os\.(listdir|scandir)\s*\(\s*[''"]/proc[''"]\s*\)'

- id: python-proc-environ-path-format
  desc: Procfs environ path pattern
  crit: component
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: '/proc/(\{[a-zA-Z_][\w.]*\}|%[0-9]*[sdi]|\{?pid\}?)/environ'

composite_rules:
- id: python-proc-environ-loop
  desc: Python loops over proc environments
  crit: notable
  conf: 0.94
  for: [python]
  all:
  - id: python-proc-listdir-call
  - id: python-proc-environ-path-format
  near_bytes: 600
  unless:
  - id: well-known/app/ai/agent-runtime/alpi::alpi-agent-context
  - id: well-known/tool/detection/agent-glovebox::archive-context
