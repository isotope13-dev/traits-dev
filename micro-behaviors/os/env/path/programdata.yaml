defaults:
  platforms: [windows]
traits:
  - id: programdata-env-lookup
    desc: Resolves the ProgramData directory
    crit: notable
    conf: 0.85
    for: [python, csharp, powershell, batch, javascript, pe, dll]
    if:
      type: text
      regex: '(?i)(GetEnvironmentVariable\s*\(\s*["'']ProgramData|\$env:ProgramData\b)'
