defaults:
  for: [binaries, shell, python]
  crit: baseline
  conf: 0.5
  platforms:
  - unix
  - windows
traits:
- id: pwd-var
  desc: PWD environment variable
  platforms:
  - unix
  if:
    type: text
    word: PWD
- id: oldpwd-var
  desc: OLDPWD environment variable
  platforms:
  - unix
  if:
    type: text
    word: OLDPWD
- id: systemroot-var
  desc: SYSTEMROOT environment variable
  platforms: [windows]
  if:
    type: text
    substr: SystemRoot
    case_insensitive: true
- id: systemdrive-percent-lookup
  desc: Percent-style SystemDrive environment lookup
  conf: 0.95
  for: [scripts, binaries]
  platforms: [windows]
  if:
    type: text
    substr: '%SystemDrive%'
    case_insensitive: true
- id: systemdrive-powershell-lookup
  desc: PowerShell SystemDrive environment lookup
  conf: 0.95
  for: [scripts, binaries]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)\$(env:SystemDrive|\{env:SystemDrive\})'
- id: windir-var
  desc: windir environment variable
  platforms: [windows]
  if:
    type: text
    word: windir
    case_insensitive: true
