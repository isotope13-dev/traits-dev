defaults:
  platforms: [windows]
traits:
- id: split-temp-env-chain
  desc: Split TEMP environment path fragments
  crit: notable
  conf: 0.92
  for: [javascript, vbs, html]
  if:
    type: text
    regex: '["'']%["'']\s*\+\s*\(.{0,48}["'']TE["'']\)\s*\+\s*["'']MP%["'']'
- id: temp-exe-fragmented-path
  desc: Fragmented TEMP executable path
  crit: notable
  conf: 0.92
  for: [javascript]
  if:
    type: text
    substr: '""+"%"+"TE"+'
- id: wsh-temp-expand
  for:
  - html
  - vbs
  desc: WSH TEMP expansion reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: ExpandEnvironmentStrings("%TEMP%")
  unless:
  - id: well-known/tool/sysadmin/microsoft-office::office-license-cleanup-benign-context
  - id: well-known/app/enterprise/fusioninventory::fusioninventory-agent-deployment-benign-context
