traits:
- id: wsh-temp-expand
  platforms:
  - windows
  for:
  - html
  - vbs
  desc: WSH TEMP expansion reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: ExpandEnvironmentStrings("%TEMP%")
  unless:
  - id: well-known/tool/sysadmin/microsoft-office::office-license-cleanup-benign-context
  - id: well-known/app/enterprise/fusioninventory::fusioninventory-agent-deployment-benign-context
