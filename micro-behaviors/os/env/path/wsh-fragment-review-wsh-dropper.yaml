defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
- id: split-temp-env-chain
  desc: Split TEMP environment variable text
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '["'']%["'']\s*\+\s*\(.{0,48}["'']TE["'']\)\s*\+\s*["'']MP%["'']'
- id: temp-exe-comma-shard
  desc: Split TEMP and EXE path text
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '"%"\+"TE"\+\(.{0,160}"MP%"\).{0,160}"\."\+"exe"'
