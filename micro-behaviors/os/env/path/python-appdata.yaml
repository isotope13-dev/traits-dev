defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-appdata-getenv-call
    desc: Python reads AppData directory environment
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: os.getenv
      arg:
        index: 0
        kind: string
        regex: '^(LOCAL)?APPDATA$'
