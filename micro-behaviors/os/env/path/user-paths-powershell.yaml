defaults:
  crit: baseline
  conf: 0.8
  platforms: [windows]
  for: [powershell]
traits:
  - id: env-temp-dup
    desc: Accesses temp environment variable
    if:
      type: text
      regex: '(?i)\$env:TEMP\b'
  - id: env-appdata
    desc: Accesses APPDATA or LOCALAPPDATA environment
    crit: notable
    if:
      type: text
      regex: '(?i)\$env:(LOCAL)?APPDATA\b'

composite_rules:
  - id: powershell-user-staging-env
    desc: References PowerShell AppData or Temp path
    crit: notable
    conf: 0.9
    any:
      - id: env-appdata
      - id: micro-behaviors/fs/path/temp::env-temp
