defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript, shell]
traits:
  - id: node-claude-config-dir-access
    desc: References Claude config directory env member
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: process.env.CLAUDE_CONFIG_DIR
  - id: node-home-access
    desc: Node reads HOME directory environment variable
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: process.env.HOME
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: node-localappdata-access
    desc: Node reads Windows LOCALAPPDATA directory
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: process.env.LOCALAPPDATA
  - id: node-appdata-access
    desc: References Node APPDATA environment member
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: process.env.APPDATA
