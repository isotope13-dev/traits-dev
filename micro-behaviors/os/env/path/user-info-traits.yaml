defaults:
  for: [scripts, binaries]
  crit: baseline
  conf: 0.5
  platforms:
    - unix
    - windows
traits:
  - id: home-var
    desc: HOME environment variable
    platforms:
      - unix
    if:
      type: text
      exact: HOME
  - id: homedrive-var
    desc: HOMEDRIVE environment variable
    platforms:
      - windows
    if:
      type: text
      exact: HOMEDRIVE
  - id: homepath-var
    desc: HOMEPATH environment variable
    platforms:
      - windows
    if:
      type: text
      exact: HOMEPATH
