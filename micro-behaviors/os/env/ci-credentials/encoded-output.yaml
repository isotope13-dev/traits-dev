defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: gha-shell-secrets-output-source
    desc: Shell output interpolates all Actions secrets
    if:
      type: text
      regex: '(?im)^[ \t]*(run: *)?(echo|printf)\b.{0,24}\$\{\{ *toJSON\( *secrets *\)'

  - id: gha-python-secrets-encoder-input
    desc: Python encoder consumes complete Actions secrets
    if:
      type: text
      regex: '(?i)base64\.b(32|64)encode\(b?[''"]\$\{\{ *toJSON\( *secrets *\) *}}[''"]'

  - id: gha-node-secrets-buffer-input
    desc: Node buffer consumes complete Actions secrets
    if:
      type: text
      regex: '(?i)Buffer\.from\([''"]\$\{\{ *toJSON\( *secrets *\) *}}[''"]\)'

  - id: gha-powershell-secrets-byte-input
    desc: PowerShell output consumes Actions secret bytes
    if:
      type: text
      regex: '(?im)^ *Write-Output .{0,80}GetBytes\([''"]\$\{\{ *toJSON\(secrets\)'

