# Serializing a workflow secrets context is sensitive access, including normal
# provider-credential export. It establishes neither theft nor exfiltration.
# Attack composites add their transfer or staging evidence. Existing exclusions
# are retained during relocation to preserve their effective scope.
defaults:
  platforms: [unix, windows]
  for: [github-actions]

traits:
  - id: complete-secrets-json-expression
    desc: Serializes complete GitHub Actions secrets
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\$\{\{\s*toJSON\(\s*secrets\s*\)\s*\}\}'
    unless:
      - id: well-known/app/infrastructure/pulumi::github-secrets-export-action
      - id: well-known/app/infrastructure/pytorch-test-infra::secrets-env-runner-script
      - id: well-known/app/infrastructure/wads::wads-ci-context
      - id: well-known/app/infrastructure/zizmor::zizmor-test-data-path
      # OpenRemote overlays the secrets map into SECRETS for its own
      # multi-repo deployment matrix; the sink is its deploy scripts.
      - id: well-known/app/infrastructure/openremote::openremote-deploy-context
      # OpenTelemetry GitHub Actions passes secrets into secrets_to_redact so
      # traces redact secret values.
      - id: well-known/app/infrastructure/opentelemetry-github::opentelemetry-github-ci-context
