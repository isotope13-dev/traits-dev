# CI and package-registry credentials read from the environment.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
composite_rules:
  - id: javascript-ci-token-env-access
    desc: CI/CD token/credential access
    conf: 0.9
    any:
      - id: micro-behaviors/os/env/vcs::node-github-token-member
      - id: micro-behaviors/os/env/package-manager::npm-token-env-read
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
      - id: well-known/tool/development/aube::aube-external-tools-download-context
      - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
