# Ruby CI credential environment references; no theft or file access claim.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
traits:
  - id: ruby-github-token-env-reference
    desc: Ruby ENV GITHUB_TOKEN access
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "ENV\\[[\"']GITHUB_TOKEN[\"']\\]"
  - id: ruby-gem-credential-env-reference
    desc: Ruby ENV for gem credentials
    crit: notable
    conf: 0.95
    unless:
      - id: well-known/lib/runtime/scripted/jruby::embedded-runtime-member
    if:
      type: text
      regex: "ENV\\[[\"'](GEM_HOST_API_KEY|RUBYGEMS_API_KEY)[\"']\\]"
    downgrade:
      any:
        - type: basename
          regex: '(^|[\\/])(Rakefile|[^\\/]+\.rake)$'
        - type: text
          regex: 'RubyGems credentials|rubygems_api_key|\.gem[/\\]credentials|rubygems\.org/api/'
composite_rules:
  - id: ruby-ci-credential-env-references
    desc: Ruby CI credential environment references
    crit: notable
    conf: 0.9
    any:
      - id: ruby-github-token-env-reference
      - id: ruby-gem-credential-env-reference
  # GITHUB_TOKEN presented to GitHub's own API (`gh`-style helpers, PR and
  # release scripts) is the token doing its job, not a credential in transit
  # to a third party.
  - id: ruby-github-token-api-client-context
    desc: Ruby GITHUB_TOKEN used with the GitHub API
    crit: exception
    conf: 0.9
    all:
      - id: ruby-github-token-env-reference
      - id: micro-behaviors/communications/http/services/github::github-api-host
