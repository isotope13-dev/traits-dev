defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: actions-oidc-request-token-name
    desc: Actions OIDC request credential environment name
    if:
      type: text
      word: ACTIONS_ID_TOKEN_REQUEST_TOKEN
  - id: actions-runtime-token-name
    desc: Actions runtime credential environment name
    if:
      type: text
      word: ACTIONS_RUNTIME_TOKEN
  - id: azure-pipelines-access-token-name
    desc: Azure Pipelines access-token environment name
    if:
      type: text
      word: SYSTEM_ACCESSTOKEN
