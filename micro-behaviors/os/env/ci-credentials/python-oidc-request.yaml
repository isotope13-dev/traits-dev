defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96
traits:
  - id: python-actions-oidc-request
    desc: Builds GitHub Actions OIDC request URL
    if:
      type: symbol
      kind: call
      exact: urllib.request.Request
      arg:
        index: 0
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '^ACTIONS_ID_TOKEN_REQUEST_URL$'
