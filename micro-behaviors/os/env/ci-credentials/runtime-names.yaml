defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.95

traits:
  - id: actions-runtime-token-name
    desc: GitHub Actions runtime token environment name
    if:
      type: text
      word: ACTIONS_RUNTIME_TOKEN
  - id: system-accesstoken-name
    desc: Azure Pipelines access token environment name
    if:
      type: text
      word: SYSTEM_ACCESSTOKEN
