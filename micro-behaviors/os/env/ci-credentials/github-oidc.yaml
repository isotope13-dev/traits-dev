defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.75

traits:
  - id: github-actions-oidc-token-request-env
    desc: Actions OIDC credential request env names
    conf: 0.96
    if:
      type: text
      regex: 'ACTIONS_ID_TOKEN_REQUEST_(TOKEN|URL)'
  - id: actions-oidc-request-url-direct-call
    desc: Calls the runner OIDC URL directly
    conf: 0.9
    if:
      type: text
      regex: '(?i)(fetch|new URL)\s*\([^)\n]{0,60}ACTIONS_ID_TOKEN_REQUEST_URL'
  - id: actions-oidc-request-url-client-call
    desc: OIDC request URL client call target
    conf: 0.9
    if:
      type: text
      # HTTP-client spellings of the same sanctioned mint call.
      regex: '(?i)(axios|requests)\.(get|post)\s*\([^)\n]{0,60}ACTIONS_ID_TOKEN_REQUEST_URL'
  - id: actions-oidc-client-user-agent
    desc: Actions OIDC client user agent string
    conf: 0.95
    if:
      type: text
      substr: 'actions/oidc-client'

composite_rules:
  - id: actions-oidc-request-url-wrapped
    desc: Wraps the runner OIDC URL
    all:
      - id: github-actions-oidc-token-request-env
      - id: micro-behaviors/communications/url/parse::new-url-variable
    near_bytes: 1200
  - id: actions-oidc-wrapped-url-fetch
    desc: Fetches a URL object built from the runner endpoint
    all:
      - id: actions-oidc-request-url-wrapped
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1600
  - id: actions-oidc-request-url-fetch
    desc: Calls or wraps the runner-provided OIDC request URL
    any:
      - id: actions-oidc-request-url-direct-call
      - id: actions-oidc-wrapped-url-fetch
