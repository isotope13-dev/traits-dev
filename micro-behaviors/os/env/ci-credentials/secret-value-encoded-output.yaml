# A selected Actions secret, rather than the complete toJSON(secrets) map.
# These predicates bind the secret expression to the encoder input. Consumers
# must also require that encoder's stdout sink on the same executable line.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.97

traits:
  - id: gha-echo-secret-value-encoder-input
    desc: Echo feeds an Actions secret to encoder
    if:
      type: text
      regex: '(?m)^ *echo( -n)? [''"]\$\{\{ *secrets\.\w+ *}}[''"] *\| *base(32|64)\b'

  - id: gha-printf-secret-value-encoder-input
    desc: Printf feeds an Actions secret to encoder
    if:
      type: text
      # An actual %s format excludes printf -v, which assigns a local variable
      # and sends no secret to the downstream encoder.
      regex: '(?m)^ *printf [''"]%s[''"] [''"]\$\{\{ *secrets\.\w+ *}}[''"] *\| *base(32|64)'

  - id: gha-python-secret-value-encoder-input
    desc: Python encoder consumes an Actions secret value
    if:
      type: text
      regex: '(?m)^ *print\(base64\.b(32|64)encode\(b?[''"]\$\{\{ *secrets\.\w+ *}}[''"]'

  - id: gha-node-secret-value-buffer-input
    desc: Node buffer consumes an Actions secret value
    if:
      type: text
      regex: '(?m)^ *console\.log\(Buffer\.from\([''"]\$\{\{ *secrets\.\w+ *}}[''"]\)'

  - id: gha-powershell-secret-value-byte-input
    desc: PowerShell output consumes Actions secret bytes
    if:
      type: text
      regex: '(?im)^ *Write-Output [^;\r\n]{0,80}GetBytes\([''"]\$\{\{ *secrets\.\w+ *}}'

composite_rules:
  - id: gha-shell-secret-value-encoder-input
    desc: Actions secret feeds shell Base32 or Base64
    any:
      - id: gha-echo-secret-value-encoder-input
      - id: gha-printf-secret-value-encoder-input
