defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
traits:
  - id: actions-oidc-curl-bearer-token
    desc: Curl text uses runner bearer token
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bcurl\b[^\n]{0,240}bearer\s+\$\{?ACTIONS_ID_TOKEN_REQUEST_TOKEN'
  - id: actions-oidc-request-url-variable
    desc: Runner OIDC request URL variable
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\$\{?ACTIONS_ID_TOKEN_REQUEST_URL\}?'
composite_rules:
  - id: actions-oidc-curl-bearer-request
    desc: Curl uses runner token with OIDC URL
    crit: notable
    conf: 0.97
    near_lines: 1
    all:
      - id: actions-oidc-curl-bearer-token
      - id: actions-oidc-request-url-variable
