# Piping the whole environment into an encoder packs every variable,
# including tokens and keys, into one transport-safe blob. Base64 is also
# how CI jobs debug environment differences; sending it anywhere is a
# separate observation.
defaults:
  platforms: [unix]
  for: [scripts]
  crit: notable
  conf: 0.9
traits:
  - id: env-dump-base-encoded
    desc: Encodes the full environment as Base32/64
    if:
      type: text
      regex: '\b(print)?env\s*\|\s*base(32|64)\b'
