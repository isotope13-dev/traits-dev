defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.85
traits:
  - id: shell-env-pipe
    desc: Shell pipes env listing to command
    if:
      type: text
      regex: '(?m)(^|[;&|][ \t]*)\b(env|printenv)\b[ \t]*\|'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
  # Selecting a provider namespace copies configuration and credential values,
  # but is also how build wrappers forward a user's cloud environment into a
  # local container. The matcher establishes filtering, not theft.
  - id: shell-env-cloud-prefix-filter
    desc: Shell filters env by cloud variable prefix
    conf: 0.9
    if:
      type: text
      regex: '\b(env|printenv)\s*[|]\s*grep[^\n]{0,30}(AWS|GCP|AZURE)'
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: metadata/package/files/archive-member::openshift-release-ci-step-context
  # Token-named env vars piped through grep is the harvest step of a secret
  # stealer; the matcher establishes filtering, not theft.
  - id: shell-token-env-secret-filter
    desc: Shell filters token secret env vars
    conf: 0.9
    for: [shell, package.json]
    if:
      type: text
      # Manifest text keeps JSON backslash escapes (`grep -iE \"token…"`),
      # so allow an optional backslash before the opening quote.
      regex: '\b(env|printenv)\s*[|]\s*grep\s+-iE\s+\\?[''"][^''"\n]{0,40}(token|jwt|auth)'
  - id: grep-credential-term
    desc: Shell env pipeline grep filters credential terms
    conf: 0.9
    if:
      type: text
      regex: '(?i)(env|printenv)\s*\|\s*grep\s+(-i\s+)?(key|secret|token|api|password|passwd)\s*$'
