defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: shell-registry-token-pipe-source-reference
    desc: Registry token name in shell pipe source
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^[ \t]*\w+[^|;\n]{0,60}(NPM|PYPI|NODE_AUTH)_\w*TOKEN[^|;\n]{0,60}\|'
  - id: shell-printenv-token-curl-pipe
    desc: printenv token selection piped to curl
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^[ \t]*printenv +["'']?\w*TOKEN\b[\w "'' ]*(2>/dev/null *)?\| *curl\b'
  - id: shell-echo-token-curl-pipe
    desc: Echoed environment token piped to curl
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^[ \t]*echo +"?\$\{?\w*TOKEN\b[^#|;>\n]{0,80}\|\s*curl\b'
  - id: shell-printf-token-curl-pipe
    desc: Printed environment token piped to curl
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^[ \t]*printf +[''"]%s[''"] +"?\$\{?\w*TOKEN\b[^#|;>\n]{0,80}\|\s*curl\b'
