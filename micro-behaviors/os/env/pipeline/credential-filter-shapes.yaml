defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 0.9
traits:
- id: guarded-env-credential-filter-shape
  desc: Env output filtered for credential terms
  if:
    type: tree-sitter
    query: '((pipeline
      (command name: (command_name) @source) .
      (command name: (command_name) @grep) @filter)

      (#match? @source "^(?:env|\"env\"|''env''|printenv|\"printenv\"|''printenv''|/usr/bin/env|\"/usr/bin/env\"|''/usr/bin/env''|/bin/env|\"/bin/env\"|''/bin/env''|/usr/bin/printenv|\"/usr/bin/printenv\"|''/usr/bin/printenv''|/bin/printenv|\"/bin/printenv\"|''/bin/printenv'')$")

      (#match? @grep "^(?:grep|\"grep\"|''grep''|/usr/bin/grep|\"/usr/bin/grep\"|''/usr/bin/grep''|/bin/grep|\"/bin/grep\"|''/bin/grep'')$")

      (#match? @filter "(?i)(^|[^A-Za-z0-9])(key|secret|token|api|password|passwd)([^A-Za-z0-9]|$)")
      (#not-match? @filter "(^|[[:space:]])-v([[:space:]]|$)")
      (#not-match? @filter "(^|[[:space:]])-i[[:space:]]+-i([[:space:]]|$)")
      (#not-match? @filter "/dev/stdin|<"))'
  unless:
  - id: metadata/file/function::shell-env-function-name-symbol
  - id: metadata/file/function::shell-printenv-function-name-symbol
  - id: metadata/file/function::shell-grep-function-name-symbol
  - type: tree-sitter
    kind: call
    regex: ^alias[ \t]+["']?(env|printenv|grep)=
  - type: tree-sitter
    query: '[(ERROR) @error (MISSING) @missing]'
  - type: tree-sitter
    query: |
      ((redirected_statement
        body: (pipeline
          (command . name: (command_name) @source .) .
          (command . name: (command_name) @grep .)))
        (#match? @source "^(env|printenv)$")
        (#match? @grep "^(grep|/usr/bin/grep|/bin/grep)$"))
  - type: text
    regex: '(env|printenv)\s*\|.{0,40}(/dev/stdin|<)'
- id: absolute-env-credential-filter-shape
  desc: Absolute env and grep filter pipeline
  if:
    type: tree-sitter
    query: '((pipeline
      (command name: (command_name) @source) .
      (command name: (command_name) @grep) @filter)

      (#match? @source "^(?:/usr/bin/env|\"/usr/bin/env\"|''/usr/bin/env''|/bin/env|\"/bin/env\"|''/bin/env''|/usr/bin/printenv|\"/usr/bin/printenv\"|''/usr/bin/printenv''|/bin/printenv|\"/bin/printenv\"|''/bin/printenv'')$")

      (#match? @grep "^(?:/usr/bin/grep|\"/usr/bin/grep\"|''/usr/bin/grep''|/bin/grep|\"/bin/grep\"|''/bin/grep'')$")

      (#match? @filter "(?i)(^|[^A-Za-z0-9])(key|secret|token|api|password|passwd)([^A-Za-z0-9]|$)")
      (#not-match? @filter "(^|[[:space:]])-v([[:space:]]|$)")
      (#not-match? @filter "/dev/stdin|<"))'
  unless:
  - type: tree-sitter
    query: '[(ERROR) @error (MISSING) @missing]'
