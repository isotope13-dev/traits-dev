defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: shell-env-credential-name-filter
    desc: Filters environment for credential-like names
    unless:
      - {type: symbol, kind: function, exact: env}
      - {type: symbol, kind: function, exact: printenv}
      - {type: symbol, kind: function, exact: grep}
    if:
      type: tree-sitter
      language: shell
      query: |
        (pipeline
          (command name: (command_name (word) @env) !argument !redirect)
          . (command name: (command_name (word) @grep) !redirect
              . argument: (word) @option
              . argument: [(raw_string) (string . (string_content) .)] @selection .)
          (#match? @env "^(env|printenv)$")
          (#eq? @grep "grep")
          (#match? @option "^(-E|-iE|-Ei)$")
          (#match? @selection "(?i)^['\"]\\^?[(]?(TOKEN|KEY|SECRET|PASSWORD)"))
