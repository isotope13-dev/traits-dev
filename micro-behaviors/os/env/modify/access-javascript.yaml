defaults:
  platforms: [windows, unix]
traits:
  - id: node-process-env-object-assignment
    desc: Node assigns process.env object
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[\w$]+\.[\w$]+\s*=\s*process\.env[^.\[\w$]'

  # Object-literal fields preserve the complete environment just as an alias
  # assignment does, but use `env: process.env` rather than `x.env = ...`.
  - id: env-dynamic-assignment
    desc: Dynamic environment variable assignment
    crit: notable
    conf: 0.88
    for: [javascript]
    platforms: [windows]
    if:
      type: text
      regex: 'Environment\s*\([^)]{0,48}\)\s*\(\s*["''][A-Za-z0-9_]{6,32}["'']\s*\)\s*='
  - id: wsh-environment-item-assignment
    desc: WSH Environment item assignment
    crit: notable
    conf: 0.9
    for: [javascript, html]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\.Environment\("[^"]{1,16}"\)\.Item\("[A-Za-z_][A-Za-z0-9_]{4,16}"\)\s*='
  - id: wsh-environment-separate-item-assignment
    desc: Assignment to a WSH Environment object item
    crit: notable
    conf: 0.95
    for: [javascript, vbs, html]
    platforms: [windows]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.Item\s*\(\s*["''][A-Za-z0-9_]{4,24}["'']\s*\)\s*='
  - id: wsh-environment-assignment-call
    desc: WSH environment item assignment
    crit: notable
    conf: 0.94
    for: [javascript, vbs]
    platforms: [windows]
    if:
      type: text
      regex: '\.Environment\s*\([^)]{0,32}\)\s*\(\s*["''][A-Za-z0-9_]{1,24}["'']\s*\)\s*='
  - id: wsh-environment-decoded-assignment-cluster
    desc: Repeated decoded WSH environment assignments
    crit: notable
    conf: 0.98
    for: [javascript, vbs]
    platforms: [windows]
    count_min: 32
    if:
      type: text
      # JScript's WSH default-property syntax allows an encoded key to be
      # assigned as `env(decode(...)) = decode(...)`.  A large repeated run is
      # payload staging, not ordinary environment configuration.
      regex: '(?m)^\s*\w+\s*\(\s*\w+\s*\([^\)\r\n]{1,160}\)\s*\)\s*='
  - id: encoded-call-assignment-cluster
    desc: Repeated encoded call assignments
    crit: notable
    conf: 0.97
    for: [javascript, vbs]
    platforms: [windows]
    count_min: 32
    # WSH default-property syntax can stage a carrier as
    # `environment("randomKey") = ("large-base64-value")`.
    if:
      type: text
      regex: '(?m)^[ \t]*[A-Za-z_$][A-Za-z0-9_$]*\(["''][A-Za-z0-9_$]{8,40}["'']\)[ \t]*='
composite_rules:
  - id: wsh-environment-object-item-assignment
    desc: WSH Environment object receives an item assignment
    crit: notable
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/os/env/read::wsh-environment-object
      - id: wsh-environment-separate-item-assignment
  - id: wsh-environment-computed-assignment
    desc: WSH environment computed assignment
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/env/read::wsh-environment-method-text
      - id: wsh-environment-assignment-call
  - id: wsh-environment-indexed-staging
    desc: WSH environment method paired with call assignment
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/env/read::wsh-environment-method-text
      # This generic syntax marker is meaningful only alongside the WSH API.
    any:
      - id: micro-behaviors/data/source/syntax/assignment::indexed-call-assignment
      - id: micro-behaviors/data/source/syntax/assignment::nested-call-assignment
    needs: 1
