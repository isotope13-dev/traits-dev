defaults:
  platforms: [unix]
  for: [binaries]

traits:
  - id: path-env-var-setenv
    desc: PATH set to transient directory via setenv
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'setenv\(["'']PATH["'']\s*,\s*["'']/(tmp|var/tmp|dev/shm)'

composite_rules:
  - id: path-assignment
    desc: PATH variable assignment evidence
    crit: component
    any:
      - id: micro-behaviors/os/env/vars/access::path-env-var-direct
      - id: path-env-var-setenv
