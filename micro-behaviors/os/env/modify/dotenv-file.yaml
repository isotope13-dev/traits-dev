# A command-line flag that seeds a process environment from a dotenv file
# (`node --env-file=.env`, `docker run --env-file secrets.env`, `podman`, ...).
#
# Neutral capability: this is the documented way to keep secrets out of a
# service's argv, and the sibling path atoms in
# micro-behaviors/fs/path/config/environment/ only match `.env` when it follows
# a `/` or starts a line, so a `--env-file=.env` launcher goes unrecorded.
# Worth surfacing on its own -- it tells an analyst that a spawned child is
# handed a credential file's contents -- while intent stays with the composites
# that pair it with exfiltration or a credential sweep.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, batch, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: env-file-flag-load
    desc: Command flag loads env from file
    if:
      type: text
      regex: '(?i)--env-file(-if-exists)?[=\s]'
