# Neutral observations; attack consumers must supply intent-specific evidence.
traits:
- platforms:
  - unix
  for:
  - shell
  id: shell-path-prepend-hidden-dotdir
  desc: Prepends hidden dotdir to $PATH
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: export\s+PATH=["']?(~|\$HOME)/\.[\w./-]+:\$PATH
  not:
  - regex: (~|\$HOME)/\.local/bin
  - regex: (~|\$HOME)/\.dotnet(/|:)
  - regex: (~|\$HOME)/\.(cargo|rustup|fnm|volta|deno|bun|pyenv|asdf|nvm|npm|npm-global|go|sdkman|pnpm|poetry|nodenv|goenv|rbenv|rvm)(/|:)
