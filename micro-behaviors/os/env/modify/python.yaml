defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
  mbc: "E1082"
  attack: "T1082"
traits:
  - id: os-environ-assignment
    desc: Python writes environment variable
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: 'os\.environ\s*\[.{0,120}\]\s*='
  # The parsed form of the same write. A bind into `os.environ["X"]` has the
  # target `os.environ.X` -- the subscript is normalised to a dot -- so the
  # bracketed source text above cannot express it.
  - id: os-environ-bind
    desc: Python binds a value into os.environ
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      kind: bind
      regex: '^os\.environ\.'
