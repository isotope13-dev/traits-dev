defaults:
  platforms: [windows, unix]
  for: [c, cpp, elf, pe]
traits:
  - id: setenv
    desc: setenv function (set environment variable)
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      regex: (^|\.)setenv$
  - id: putenv
    desc: Modifies environment through putenv
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      regex: (^|\.)putenv$
  - id: unsetenv
    desc: "unsetenv func (remove env var)"
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      regex: (^|\.)unsetenv$
  - id: js-process-env-write
    desc: JavaScript process.env assignment
    crit: baseline
    conf: 0.85
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: process\.env\.\w+\s*=[^=]
  - id: js-process-env-delete-or-restore
    desc: Conditional process.env delete/restore
    crit: baseline
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'delete process\.env\.[A-Z0-9_]+\s*:\s*process\.env\.'
  - id: js-process-env-word-assignment
    desc: JavaScript process.env word assignment
    crit: baseline
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env\.[A-Z0-9_]+\s*=\s*\w+'
  - id: path-env-var-direct
    desc: Direct PATH assignment (PATH= or PATH+=)
    crit: component
    conf: 0.5
    for: [scripts, binaries]
    # The assigned value has to look like a search path — absolute, relative,
    # home-relative, a `:`-separated append, or an expansion of the old value.
    # Without that, `PATH=` matched any variable that happens to be named PATH,
    # notably the `var PATH={splitPath:...}` filesystem shim that every
    # Emscripten-generated JS bundle (MediaPipe, ffmpeg.wasm, sql.js, opencv.js)
    # emits, which is not an environment assignment at all.
    if:
      type: text
      regex: (^|[^A-Z0-9_])PATH[+]?=["']?[.~$%/:]
  - id: shell-export-env-assignments
    desc: Multiple shell environment exports
    crit: baseline
    conf: 0.72
    for: [shell]
    count_min: 2
    if:
      type: text
      regex: '^export\s+[A-Z0-9_]+\s*='
  - id: powershell-path-assignment
    desc: PowerShell PATH environment assignment
    crit: notable
    conf: 0.82
    for: [scripts]
    if:
      type: text
      regex: '(?i)\$env:PATH\s*='
composite_rules:
  - id: js-process-env-preserve-restore
    desc: JavaScript process.env preserve/restore
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    near_bytes: 500
    all:
      - id: micro-behaviors/os/env/read::js-process-env-optional-trim-read
      - id: js-process-env-delete-or-restore
      - id: js-process-env-word-assignment
  - id: set
    desc: Environment variable modification
    crit: baseline
    conf: 0.5
    any:
      - id: setenv
      - id: putenv
      - id: unsetenv
