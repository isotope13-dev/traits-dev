defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.8
  for: [scripts, binaries]
traits:
  - id: histfile-dev-null
    desc: Set HISTFILE to /dev/null
    if:
      type: text
      regex: (HISTFILE=/dev/null|export HISTFILE=/dev/null|export\s+HISTFILE=/dev/null)
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
  # The child-environment form: a launcher hands the shell it spawns an
  # environment whose history file is /dev/null.
  - id: python-env-histfile-dev-null
    desc: Child environment disables shell history
    for: [python]
    if:
      type: text
      regex: '\[\s*["'']HISTFILE["'']\s*\]\s*=\s*["'']/dev/null["'']'
  - id: powershell-psreadline-save-nothing
    desc: Disables PowerShell command history
    for: [scripts, source, binaries]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)HistorySaveStyle\s+SaveNothing'
