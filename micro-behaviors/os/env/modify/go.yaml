defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-setenv
    desc: Go sets a process environment variable
    if:
      type: text
      regex: '\bos\.Setenv\('
  - id: go-unsetenv
    desc: Go clears a process environment variable
    if:
      type: text
      regex: '\bos\.Unsetenv\('
