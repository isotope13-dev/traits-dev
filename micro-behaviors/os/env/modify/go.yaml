defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-setenv
    desc: Go sets a process environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bos\.Setenv\('
  - id: go-unsetenv
    desc: Go clears a process environment variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bos\.Unsetenv\('
