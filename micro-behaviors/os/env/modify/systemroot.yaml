defaults:
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: batch-systemroot-assignment
    desc: Batch assigns SystemRoot environment variable
    for: [batch]
    if:
      type: text
      regex: '(?im)^[ \t]*set[ \t]+"?systemroot[ \t]*='
  - id: powershell-systemroot-assignment
    desc: PowerShell assigns SystemRoot environment
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$env:systemroot\s*='
  - id: indexed-systemroot-assignment
    desc: Assigns SystemRoot via environment dictionary
    for: [python, ruby, javascript, typescript]
    if:
      type: text
      regex: '(?i)(os\.environ|process\.env|ENV)\s*\[\s*["'']systemroot["'']\s*\]\s*='
  - id: native-systemroot-assignment
    desc: Sets SystemRoot through environment API
    for: [c, cpp, csharp, go]
    if:
      type: text
      regex: '(?i)(SetEnvironmentVariable[AW]?|os\.Setenv)\s*\(\s*["'']SystemRoot["'']\s*,'

composite_rules:
  - id: systemroot-assignment
    desc: Assigns the Windows SystemRoot environment variable
    for: [scripts, source]
    any:
      - id: batch-systemroot-assignment
      - id: powershell-systemroot-assignment
      - id: indexed-systemroot-assignment
      - id: native-systemroot-assignment
