defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell, pe, elf]
  crit: notable
  conf: 0.7
traits:
  - id: chat-api-credentials
    desc: Chat/messaging API credentials
    conf: 0.7
    if:
      type: text
      regex: ^(SLACK_|DISCORD_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: payment-api-credentials-stripe
    desc: Stripe payment API credentials
    conf: 0.7
    if:
      type: text
      regex: ^STRIPE_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: payment-api-credentials-messaging
    desc: Messaging service API credentials
    conf: 0.7
    if:
      type: text
      regex: ^(TWILIO_|SENDGRID_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: security-tool-credentials-scanning
    desc: Security scanning tool credentials
    conf: 0.7
    if:
      type: text
      regex: ^(SONAR_|SNYK_).{0,50}_(TOKEN|KEY|SECRET)$
  # Relocated from objectives/credential-access/api-harvest/catalog
  # (secret-env-vault-token). The HashiCorp Vault CLI/SDK token variable;
  # every Vault client and test harness names it.
  - id: vault-token-env-name
    desc: VAULT_TOKEN environment variable name
    for: [scripts]
    conf: 0.9
    attack: T1528
    if:
      type: text
      word: VAULT_TOKEN
  # Relocated from objectives/credential-access/validation/check: a direct
  # process.env read of the Vault token is a neutral env access; harvest
  # intent comes from the consuming composites.
  - id: node-process-env-vault-token-read
    desc: Node reads VAULT_TOKEN from process.env
    for: [javascript, typescript]
    conf: 0.92
    attack: T1552.001
    if:
      type: text
      regex: 'process\.env(\[["'']VAULT_TOKEN["'']\]|\.VAULT_TOKEN)\b'
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
      - id: well-known/tool/detection/threat-intel/
  - id: security-tool-credentials-vault
    desc: Vault/secrets management credentials
    conf: 0.7
    if:
      type: text
      regex: ^(VAULT_|HASHICORP_).{0,50}_(TOKEN|KEY|SECRET)$
