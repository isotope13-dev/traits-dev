defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  conf: 0.85
  crit: notable

traits:
  - id: js-aws-access-key-id-literal
    desc: AWS_ACCESS_KEY_ID string literal in code
    if:
      type: literal
      kind: string
      exact: AWS_ACCESS_KEY_ID

  - id: js-aws-session-token-literal
    desc: AWS_SESSION_TOKEN string literal in code
    if:
      type: literal
      kind: string
      exact: AWS_SESSION_TOKEN
