defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.75
traits:
  # Clearing publish credentials after use.
  - id: ci-secret-unset-after-use
    desc: Unsets publish secret variables
    crit: notable
    conf: 0.85
    for: [shell, python]
    if:
      type: text
      regex: 'unset\s+[A-Z_]*(PASSWORD|TOKEN)'
  # GitHub Actions workflow commands emitted outside a workflow definition:
  # `::notice::` / `::error::` annotations a CI bridge prints to fake a
  # healthy step log while it handles the stolen secret off-screen.
