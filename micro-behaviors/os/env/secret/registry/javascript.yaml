defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
traits:
  # CI Artifactory reader accounts commonly split the identity across
  # *_READER_USERNAME and *_READER_PASSWORD environment members.
  - id: javascript-artifactory-reader-credential-env-reference
    desc: Reads Artifactory reader credential env names
    conf: 0.9
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((member_expression
          object: (member_expression
            object: (identifier) @process
            property: (property_identifier) @env)
          property: (property_identifier) @name) @read
        (#eq? @process "process")
        (#eq? @env "env")
        (#match? @name "(?i)_READER_(USERNAME|PASSWORD)$"))
