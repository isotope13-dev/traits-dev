# Ruby CI credential environment references; no theft or file access claim.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
composite_rules:
  - id: ruby-ci-credential-env-references
    desc: Ruby CI credential environment references
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/env/secret/vcs::ruby-github-token-env-reference
      - id: micro-behaviors/os/env/secret/registry::ruby-gem-credential-env-reference
