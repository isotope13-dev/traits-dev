defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96
traits:
  - id: python-actions-oidc-subscript-request
    desc: Builds Actions OIDC request from environment
    if:
      type: text
      exclude_comments: true
      regex: 'urllib\.request\.Request\s*\(\s*os\.environ\[["'']ACTIONS_ID_TOKEN_REQUEST_URL["'']\]'
  - id: python-actions-oidc-request
    desc: Builds GitHub Actions OIDC request URL
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.(Request|urlopen)|(requests|httpx)\.get)$'
      arg:
        index: 0
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '^ACTIONS_ID_TOKEN_REQUEST_URL$'
