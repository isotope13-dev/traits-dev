defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.9

traits:
  # A Ruby %w[] word list naming wallet or key environment variables, the
  # shape used by install-time collectors that loop over ENV[k] by name.
  # Requiring the secret-shaped word inside the list keeps ordinary %w[]
  # arrays (gem names, file extensions) from matching.
  - id: ruby-secret-env-list
    desc: Ruby word list names key environment variables
    if:
      type: text
      regex: '%w\[[^\]]{0,200}\b(PRIVATE_KEY|MNEMONIC|SECRET_KEY)\b'
