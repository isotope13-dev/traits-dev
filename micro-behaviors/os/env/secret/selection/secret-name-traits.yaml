defaults:
  platforms: [unix, windows]
  # Every native format: a credential variable name in a Mach-O build means
  # what it means in the ELF and PE builds of the same program.
  for: [shell, python, javascript, powershell, pe, elf, macho]
  crit: notable
  conf: 0.7
traits:
  # Some harvesters keep the credential markers in a separate constant list
  # and use any(marker in key.upper() for marker in markers) while iterating.
  - id: python-environ-any-marker-filter
    desc: Filters env keys against a marker list
    crit: baseline
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?is)any\(\s*\w+\s+in\s+\w+\.(upper|lower)\(\)\s+for\s+\w+\s+in\s+\w+'
  - id: python-environ-credential-marker-set
    desc: Defines credential environment name markers
    crit: baseline
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?is)\w+\s*=\s*[\[(][^\])]{0,180}(KEY|SECRET|PASSWORD|TOKEN|CREDENTIAL|AUTH|PRIVATE)'
  - id: python-environ-credential-filter
    desc: Python env membership credential marker
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'in\s+os\.environ[^\w.][\s\S]{0,100}["''](SECRET|TOKEN|KEY)'
  - id: python-environ-alias-items-secret-marker
    desc: Aliased env iteration uses secret markers
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?is)environ\.items\(\).{0,220}["''][^"''\r\n]{0,24}(TOKEN|SECRET|KEY)'
  - id: python-environ-alias-items-password-marker
    desc: Aliased env iteration uses password markers
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?is)environ\.items\(\).{0,220}["''][^"''\r\n]{0,24}(PASSWORD|CREDENTIAL)'
composite_rules:
  - id: python-environ-marker-set-filter
    desc: Python filters environment keys by credential markers
    crit: notable
    conf: 0.94
    for: [python]
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/env/enumerate/list::python-environ-items-loop
      - id: python-environ-any-marker-filter
      - id: python-environ-credential-marker-set
  - id: python-environ-credential-keyword-filter
    desc: Python environment access uses credential-named keys
    crit: notable
    conf: 0.9
    for: [python]
    any:
      - id: micro-behaviors/os/env/secret/keyword::python-env-keyword-key
      - id: micro-behaviors/os/env/secret/keyword::python-env-keyword-token
      - id: micro-behaviors/os/env/secret/keyword::python-env-keyword-secret
  - id: python-environ-alias-items-credential-filter
    desc: Aliased Python env entries are filtered for credentials
    crit: notable
    conf: 0.94
    for: [python]
    all:
      - id: micro-behaviors/os/env/enumerate/list::environ-alias-items-loop
    any:
      - id: python-environ-alias-items-secret-marker
      - id: python-environ-alias-items-password-marker
  - id: python-environ-credential-name-filter
    desc: Selects credential-named environment entries
    crit: notable
    conf: 0.92
    for: [python]
    any:
      - id: python-environ-credential-filter
      - id: python-environ-credential-selection
      - id: python-normalized-environ-marker-selection
      - id: python-environ-alias-items-credential-filter
