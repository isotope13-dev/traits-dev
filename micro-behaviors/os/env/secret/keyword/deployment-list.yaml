defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
- id: deployment-secret-name-list
  desc: Deployment secret variable name references
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/secret/registry::npm-docker-credential-var-name
  - id: metadata/lang/source/naming/secret::cloudflare-database-credential-var-name
  - id: micro-behaviors/os/env/secret/ai-provider::netlify-openai-credential-var-name
  - id: micro-behaviors/os/env/secret/ssh::ssh-key-credential-var-name
  - id: micro-behaviors/os/env/secret/cloud::aws-secret-access-key-var
  - id: micro-behaviors/os/env/secret/cloud::aws-env-secret-vars
  - id: micro-behaviors/os/env/secret/ssh::ssh-private-key-dup
  - id: micro-behaviors/os/env/secret/ai-provider::anthropic-api-key-name-reference
  - id: micro-behaviors/os/env/secret/ai-provider::gemini-api-key-name-reference
  - id: micro-behaviors/os/env/secret/ai-provider::anthropic-auth-token-variable
