defaults:
  platforms: [unix, windows]
  # Every native format: a credential variable name in a Mach-O build means
  # what it means in the ELF and PE builds of the same program.
  for: [shell, python, javascript, powershell, pe, elf, macho]
  crit: notable
  conf: 0.7
traits:
  - id: python-env-keyword-key
    desc: Python getenv name contains KEY
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        regex: '(?i)KEY'
  - id: python-env-keyword-token
    desc: Reads a TOKEN-suffixed environment variable
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^(?:[A-Z0-9]+_)*TOKEN$'
  - id: python-env-keyword-secret
    desc: Python getenv name contains SECRET
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        regex: '(?i)SECRET'
  - id: jwt-secret
    desc: Reads JWT_SECRET from the process environment
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: process.env.JWT_SECRET
  - id: session-secret
    desc: Accesses the SESSION_SECRET environment member
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: process.env.SESSION_SECRET
  - id: cookie-secret
    desc: COOKIE_SECRET environment variable
    if:
      type: text
      word: COOKIE_SECRET
  - id: root-password
    desc: ROOT_PASSWORD environment variable
    if:
      type: text
      word: ROOT_PASSWORD
  - id: admin-password
    desc: ADMIN_PASSWORD environment variable
    if:
      type: text
      word: ADMIN_PASSWORD
    unless:
      - id: metadata/build/scaffold::antlr-generated-parser
  - id: smbhash
    desc: SMBHASH environment variable
    crit: suspicious
    conf: 0.9
    attack: T1550.002
    if:
      type: text
      word: SMBHASH
      section: .rodata
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: service-credential-env-var
    desc: Reads secret-like credential env variable
    conf: 0.86
    for: [javascript, typescript]
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    if:
      # Member-symbol exclusions are not evaluated by the engine. Match the
      # executable member node and exclude public names within the query.
      type: tree-sitter
      query: |
        ((member_expression
          object: (member_expression
            object: (identifier) @process
            property: (property_identifier) @env)
          property: (property_identifier) @name) @access
          (#eq? @process "process")
          (#eq? @env "env")
          (#match? @name "^[A-Z][A-Z0-9_]{0,40}_(PASSWORD|CLIENT_SECRET|API_KEY|AUTH_TOKEN)$")
          (#not-match? @name "^(NEXT_PUBLIC_|PUBLIC_|VITE_|EXPO_PUBLIC_|REACT_APP_)"))
    unless:
      - id: metadata/lang/generated::codegen-source-path
      - id: well-known/app/browser/google-web::official-google-web-asset
      - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: system-env-token-name
    desc: System environment TOKEN variable
    crit: notable
    if:
      type: text
      regex: '(System\.getenv|GetEnvironmentVariable)\s*\([^)]{0,60}TOKEN'
  - id: keyword-secret
    desc: SECRET-named environment variable
    crit: notable
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.getenv|os\.environ\.get)$'
      arg:
        kind: string
        substr: SECRET
  - id: keyword-auth
    desc: Python reads AUTH-named environment variable
    crit: notable
    conf: 0.86
    for: [python]
    if:
      type: text
      regex: 'os\.(getenv|environ\.get)\s*\([^)]{0,60}AUTH'
  - id: keyword-cred
    desc: CRED environment access pattern
    crit: notable
    if:
      type: text
      # Require an environment-access form; a protocol field named
      # CREDENTIALS is not an environment variable.
      regex: '(?i)\b(getenv|environ(\.get)?|process\.env)\b[^;\n]{0,40}\bCRED(ENTIALS)?\b'
    unless:
      - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
composite_rules:
  - id: python-sensitive-env-read
    desc: Reads credential-named environment variable
    crit: notable
    conf: 0.9
    for: [python]
    all:
      # Generic "read an environment variable" lives in os/env/read; the
      # secret-name topic only contributes which names were read.
      - id: micro-behaviors/os/env/read::python-os-getenv-call
    any:
      - id: python-env-keyword-key
      - id: python-env-keyword-secret
      - id: micro-behaviors/os/env/secret/keyword::python-env-snapshot-sensitive-mapping-get
      - id: micro-behaviors/os/env/secret/vcs::python-github-token-env-read
      - id: micro-behaviors/os/env/secret/vcs::python-gh-token-env-read
      - id: micro-behaviors/os/env/secret/vcs::python-github-pat-env-read
      - id: keyword-secret
      - id: keyword-auth
      - id: keyword-cred
    near_lines: 4

  # The `credentials/` directory that consumers used to name as a whole has
  # been split by which service the credential belongs to. This roll-up keeps
  # "some credential-looking env var was read" expressible in one reference.
  - id: credential-env-read
    desc: Reads a credential-bearing environment variable
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/env/secret/cloud/
      - id: micro-behaviors/data/serialize/schema-credential::script-aws-credential-parameter-name
      - id: micro-behaviors/os/env/secret/vcs/
      - id: metadata/lang/source/naming/secret::github-token-name-reference
      - id: micro-behaviors/os/env/secret/database
      - id: micro-behaviors/os/env/secret/ai-provider
      - id: micro-behaviors/os/env/secret/keyword::python-api-key-env-read
      # The service API leaf also holds declarations and literal names.
      # Only named environment-access matchers establish a read here.
      - id: micro-behaviors/os/env/secret/service-api::env-discord-token
      - id: micro-behaviors/os/env/secret/service-api::env-discord-bot-token
      - id: micro-behaviors/os/env/secret/service-api::env-discord-client-secret
      - id: micro-behaviors/os/env/secret/service-api::env-slack-bot-token
      - id: micro-behaviors/os/env/secret/service-api::env-slack-api-key
      - id: micro-behaviors/os/env/secret/service-api::env-slack-webhook
      - id: micro-behaviors/os/env/secret/service-api::python-discord-token-getenv
      # package-manager/ and ssh/ are topic directories, not credential ones:
      # they also hold npm_lifecycle_event, npm user-agent, SSH_TTY/SSH_CLIENT
      # and npmrc benign-context markers. A bare directory reference made this
      # rule claim "reads a credential env var" for files that read no
      # environment at all, so name the credential-bearing members instead.
      - id: micro-behaviors/os/env/secret/registry::package-registry-credential-env-read
      - id: micro-behaviors/os/env/secret/ssh::ssh-private-key-dup
      - id: micro-behaviors/os/env/secret/keyword::javascript-private-key-environment-variable
