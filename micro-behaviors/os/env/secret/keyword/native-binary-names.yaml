# Credential-shaped environment variable names stored whole in a compiled
# binary: GITHUB_TOKEN, SYSTEM_ACCESSTOKEN, AZURE_CLIENT_SECRET,
# AWS_SECRET_ACCESS_KEY, GOOGLE_APPLICATION_CREDENTIALS, NPM_API_KEY. Shape
# rather than a name list, so a payload aimed at a new service still matches.
# Library and diagnostic constants (CURLOPT_*, SSL_*, ERR_*_TOKEN) name
# options and failures, not environment credentials.
defaults:
  crit: notable
  conf: 0.85
  platforms: [unix, windows]
  for: [elf, macho, pe]

traits:
  - id: binary-token-secret-env-name
    desc: Token or secret name in binary
    if:
      type: text
      regex: ^[A-Z][A-Z0-9]*_[A-Z0-9_]{0,40}(TOKEN|SECRET|PASSWORD)$
      not:
        # Win32 PROCESS_INFORMATION_CLASS enum, not an environment variable.
        - exact: PROCESS_ACCESS_TOKEN
        # XNU IPC object-type enum retained in Apple SDK debug information.
        - exact: IPC_OTYPE_TASK_ID_TOKEN
        - regex: ^(ERR|ERROR|E|CURL[A-Z]*)_
        - regex: ^(SSL|GL|G|SOUP)_
        # llhttp error names and TLS key-log labels are not environment names.
        - exact: HPE_INVALID_HEADER_TOKEN
        - exact: INVALID_TOKEN
        - exact: EARLY_EXPORTER_SECRET
        - exact: EXPORTER_SECRET
        - regex: ^(CLIENT|SERVER)_(EARLY|HANDSHAKE)_TRAFFIC_SECRET$

  - id: binary-key-credential-env-name
    desc: Key or credential name in binary
    if:
      type: text
      regex: ^[A-Z][A-Z0-9]*_[A-Z0-9_]{0,40}(API_KEY|ACCESS_KEY|CREDENTIALS)$
      not:
        - regex: ^(ERR|ERROR|E|CURL[A-Z]*)_
        - regex: ^(SSL|GL|G|SOUP)_
