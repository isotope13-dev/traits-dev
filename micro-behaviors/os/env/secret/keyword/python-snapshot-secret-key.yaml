defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-snapshot-secret-key-get
    desc: Reads a secret-named mapping key
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.get\(["\x27][^"\x27]{0,80}(API_KEY|API_SECRET|PRIVATE_KEY|WALLET_PRIVATE_KEY)'
composite_rules:
  - id: python-env-snapshot-sensitive-mapping-get
    desc: Reads secret keys from env snapshot
    conf: 0.93
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/enumerate/copy::python-environ-dict
      - id: python-snapshot-secret-key-get
