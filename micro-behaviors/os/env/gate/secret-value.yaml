# A long embedded value compared with one named environment variable is a
# common operator gate: the payload stays dormant in sandboxes and only runs
# when the operator supplies both the otherwise-unadvertised key and value.
# The comparison is only a capability atom.  Package-lifecycle and payload
# objectives add the context that turns it into an attack signal.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  # Java often places the literal on the left (`secret.equals(getenv(key))`),
  # the reverse of the portable source shape above.
  - id: java-long-secret-environment-comparison
    desc: Java secret compares environment value
    for: [java]
    if:
      type: text
      regex: '[''"][A-Za-z0-9_-]{12,}[''"][.]equals\s*\(\s*System[.]getenv\s*\('

  - id: shell-printenv-long-secret-comparison
    desc: Shell compares secret environment value
    for: [shell]
    if:
      type: text
      regex: 'printenv\s+[A-Za-z_]\w{5,}.{0,100}[=!]?=\s*[''"]?[A-Za-z0-9_-]{12,}'

composite_rules:
  - id: named-environment-long-secret-comparison
    desc: Random-like literal near environment read
    crit: component
    conf: 0.94
    near_bytes: 320
    all:
      - id: metadata/file/profile/string-population::random-like-alphanumeric-literal-present
      - id: micro-behaviors/os/env/read/

  - id: operator-secret-environment-gate
    desc: Opaque secret gates environment branch
    crit: component
    conf: 0.96
    any:
      - id: named-environment-long-secret-comparison
      - id: java-long-secret-environment-comparison
      - id: shell-printenv-long-secret-comparison
