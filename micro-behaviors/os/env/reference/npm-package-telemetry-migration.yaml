defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: npm-disable-telemetry-env-gate
    desc: Telemetry gated by env opt-out
    crit: component
    conf: 0.82
    any:
      - id: micro-behaviors/os/env/read/named::node-telemetry-optout-variable-reference
      - id: micro-behaviors/os/env/reference::namespaced-telemetry-member
