defaults:
  crit: baseline
  conf: 0.8
  platforms: [windows]
  for: [powershell]
traits:
  - id: env-temp-dup
    desc: Accesses temp environment variable
    if:
      type: text
      regex: '(?i)\$env:TEMP\b'
  - id: env-appdata
    desc: Accesses APPDATA or LOCALAPPDATA environment
    crit: notable
    if:
      type: text
      regex: '(?i)\$env:(LOCAL)?APPDATA\b'
