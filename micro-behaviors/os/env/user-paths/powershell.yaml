defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: env-temp-dup
    desc: Accesses temp environment variable
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '(?i)\$env:TEMP\b'
  - id: env-appdata
    desc: Accesses APPDATA environment variable
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '(?i)\$env:(LOCAL)?APPDATA\b'
