defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: ai-gateway-preferred-adapter
    desc: Gateway preferred adapter env var
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GATEWAY_PREFERRED_ADAPTER

  - id: ai-provider-base-url-external-override
    desc: Redirects AI provider base URL externally
    crit: notable
    conf: 0.95
    for: [scripts, source, json, yaml, markdown, text]
    if:
      type: text
      regex: '(ANTHROPIC|OPENAI|GEMINI)_BASE_URL["'']?\s*[:=]\s*["'']?https?://[\w.-]+'
    not:
      - regex: 'https?://(api\.anthropic\.com|api\.openai\.com|generativelanguage\.googleapis\.com|localhost|127\.0\.0\.1)\b'

  - id: json-env-block-ai-base-url-override
    desc: JSON env block sets AI base URL
    crit: notable
    conf: 0.96
    for: [json, javascript, typescript, python, shell, markdown, text]
    if:
      type: text
      regex: '"env"\s*:\s*\{\s*"(ANTHROPIC|OPENAI|GEMINI)_BASE_URL"\s*:\s*"https?://'
    not:
      - regex: 'https?://(api\.anthropic\.com|api\.openai\.com|generativelanguage\.googleapis\.com|localhost|127\.0\.0\.1)\b'

composite_rules:
  - id: ai-gateway-env-marker
    desc: AI gateway environment setup marker
    crit: component
    conf: 0.9
    any:
      - id: anthropic-auth-token-variable
      - id: anthropic-base-url-variable
      - id: ai-gateway-preferred-adapter
