defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: ai-gateway-preferred-adapter
    desc: Gateway preferred adapter env var
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GATEWAY_PREFERRED_ADAPTER

composite_rules:
  - id: ai-gateway-env-marker
    desc: AI gateway environment setup marker
    crit: component
    conf: 0.9
    any:
      - id: anthropic-auth-token-variable
      - id: anthropic-base-url-variable
      - id: ai-gateway-preferred-adapter
