# `binaries` is in the list because AI CLIs ship compiled far more often than
# they ship as scripts — a Bun/Go/Rust single-file build carries these variable
# names in its string table exactly as a shell script carries them in source.
# Leaving binaries out had already forced a second, `for: [macho]` copy of the
# ANTHROPIC_BASE_URL matcher into objectives/supply-chain/trojanized/, where a
# neutral SDK configuration knob read as evidence of trojanization; the copy is
# gone and its composite now references this atom.
defaults:
  platforms: [unix, windows]
  for: [binaries, shell, python, javascript, typescript, powershell, go, json]
  crit: notable
  conf: 0.85

traits:
- id: anthropic-base-url-variable
  desc: Anthropic API base URL variable reference
  if:
    type: text
    word: ANTHROPIC_BASE_URL
- id: anthropic-auth-token-variable
  desc: Anthropic API auth token variable reference
  if:
    type: text
    word: ANTHROPIC_AUTH_TOKEN
- id: js-claude-settings-env-anthropic-token-assign
  desc: JS sets Claude settings Anthropic auth token
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: text
    regex: 'settings\.env\.ANTHROPIC_AUTH_TOKEN\s*='
# A read (`env.ANTHROPIC_BASE_URL`) or `delete env.ANTHROPIC_BASE_URL` is not
# planting a router. Assignment is `NAME =` or an object key `NAME:`.
# Require a non-operator byte after '=' so equality/arrow expressions do not
# become writes (notably the status report's BASE_URL === gateway comparison).
- id: js-anthropic-base-url-assignment
  desc: Assigns an Anthropic API base URL
  conf: 0.92
  for: [javascript, typescript]
  if:
    type: text
    regex: 'ANTHROPIC_BASE_URL\s*(:|=[^=>])'
- id: js-anthropic-auth-token-assignment
  desc: Assigns an Anthropic auth token
  conf: 0.92
  for: [javascript, typescript]
  if:
    type: text
    regex: 'ANTHROPIC_AUTH_TOKEN\s*(:|=[^=>])'
- id: js-anthropic-api-key-assignment
  desc: Assigns an Anthropic API key
  conf: 0.92
  for: [javascript, typescript]
  if:
    type: text
    regex: 'ANTHROPIC_API_KEY\s*(:|=[^=>])'
# Bundled gateways often resolve keys with env[name] after iterating a name
# list, not a direct env.ANTHROPIC_API_KEY member read.
- id: js-anthropic-api-key-env-name-loop
  desc: Anthropic API key from env name list
  conf: 0.91
  for: [javascript, typescript]
  if:
    type: text
    regex: 'of\s*\[.{0,120}ANTHROPIC_API_KEY.{0,120}\]\s*\)'
composite_rules:
  - id: js-anthropic-gateway-credential-assignment
    desc: JS assigns Anthropic API key or auth token
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    any:
      - id: js-anthropic-api-key-assignment
      - id: js-anthropic-auth-token-assignment
  - id: anthropic-router-settings
    desc: Anthropic router URL and auth token variables
    crit: notable
    conf: 0.9
    all:
      - id: anthropic-base-url-variable
      - id: anthropic-auth-token-variable
