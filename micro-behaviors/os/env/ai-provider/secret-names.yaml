traits:
- id: netlify-openai-credential-var-name
  desc: Netlify or OpenAI credential variable reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b(NETLIFY_(AUTH_TOKEN|API_TOKEN)|OPENAI_(API_KEY|ORG_ID))\b
defaults:
  platforms:
  - unix
  for:
  - shell
  - python
  - javascript
  - typescript
  - rust
  - github-actions
