traits:
- for:
  - javascript
  - typescript
  size_min: 64
  id: stripe-secret-name-or-key-prefix
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Stripe secret variable name or key prefix
  if:
    type: string_literal
    regex: ^STRIPE_(SECRET_KEY|API_KEY)$|sk_live_[0-9A-Za-z]{16,}
- for:
  - python
  - powershell
  - shell
  id: registry-and-vcs-token-alias-name
  desc: Registry or VCS token alias variable name
  if:
    type: text
    regex: (?i)\b(GH_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|GITLAB_TOKEN)\b
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
composite_rules:
- id: vcs-registry-token-name
  desc: VCS or package-registry token variable name
  for:
  - python
  - powershell
  - shell
  any:
  - id: micro-behaviors/os/env/secret-name::github-token-name-reference
  - id: registry-and-vcs-token-alias-name
