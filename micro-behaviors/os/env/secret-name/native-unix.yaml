# Shared exclusions applied to every atom below:
#   * Library API constants (G_*, GL_*, SOUP_*, SSL_*, libcurl's CURLOPT_*/CURLUPART_*
#     /CURLUE_*) are compile-time symbol names, not environment-variable names.
#   * Diagnostic constants (ERROR_WRONG_PASSWORD, ERR_INVALID_TOKEN,
#     AUTH_ERROR_MISSING_API_KEY) name a failure condition. Every SDK with an
#     error-code table ships dozens of them; none holds a credential.
# Password-name exclusion: MIDL_PASS (and prefixed *_MIDL_PASS forms) selects
# an IDL compiler pass, not a password or environment credential.
defaults:
  crit: notable
  platforms: [unix]
  for: [c, cpp, objc, elf]
traits:
  - id: native-token-env-read
    desc: Reads token-named native environment variable
    conf: 0.95
    for: [c, cpp, objc]
    if:
      type: symbol
      kind: call
      regex: '^(getenv|secure_getenv)$'
      arg:
        index: 0
        kind: string
        regex: '^[A-Z][A-Z0-9_]*_(TOKEN|ACCESS_TOKEN|AUTH_TOKEN)$'
  - id: native-env-credential-loop
    desc: Environment credential keywords in native code
    conf: 0.85
    if:
      type: text
      regex: 'PASS[\s\S]{0,120}TOKEN[\s\S]{0,120}SECRET[\s\S]{0,120}CRED'
