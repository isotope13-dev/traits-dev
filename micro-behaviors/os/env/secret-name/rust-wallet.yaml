defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.95

traits:
  # Credential configuration is a capability; theft needs a transfer sink.
  - id: rust-wallet-private-key-env-read
    desc: Reads wallet private key from environment
    # Match the call node and literal argument, excluding comments and strings.
    if:
      type: tree-sitter
      kind: call
      regex: '^(std::)?env::var\s*\(\s*"(POLYMARKET|ETH|BTC|SOLANA)_PRIVATE_KEY"'
