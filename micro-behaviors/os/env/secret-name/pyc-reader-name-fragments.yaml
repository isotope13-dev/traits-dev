defaults:
  platforms: [unix, windows]
  for: [pyc]
traits:
  - id: pyc-registry-reader-user-suffix
    desc: Bytecode text contains _READER_USERNAME
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '_READER_USERNAME'
  - id: pyc-registry-reader-password-suffix
    desc: Bytecode text contains _READER_PASSWORD
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '_READER_PASSWORD'
