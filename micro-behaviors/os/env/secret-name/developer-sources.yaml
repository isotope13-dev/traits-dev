defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]

composite_rules:
  - id: micro-behaviors/os/env/secret-name::developer-credential-environment-references
    desc: References developer credentials in the environment
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/env/package-manager::npm-token-name-ref
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-env-read
      - id: micro-behaviors/os/env/vcs::node-source-control-token-code-literal
      - id: micro-behaviors/os/env/vcs::github-token-name-with-environment-read
      - id: micro-behaviors/os/env/vcs::shell-github-token-reference
      - id: micro-behaviors/os/env/vcs::python-github-token-env-read
      - id: micro-behaviors/os/env/vcs::github-token-name-lookup-proximity
      - id: micro-behaviors/os/env/package-manager::node-registry-token-env-read
      - id: micro-behaviors/os/env/cloud::node-aws-secret-member
      - id: micro-behaviors/os/env/cloud::node-aws-access-key-member
      - id: micro-behaviors/os/env/pipeline::shell-env-cloud-prefix-filter
      - id: micro-behaviors/os/env/cloud::go-aws-secret-env-var

