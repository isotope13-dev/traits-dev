# Shell dereference of a secret-named environment variable (`$FOO_SECRET_KEY`,
# `${DB_PASSWORD}`, `$API_TOKEN`). Reading a credential-named variable is a
# neutral capability on its own; exfiltration composites bind it to a network
# sink. The name token must carry a credential word so routine `$PATH`/`$HOME`
# expansions do not match.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-secret-env-dollar-ref
    desc: Shell reads secret-named environment variable
    conf: 0.85
    if:
      type: text
      regex: '\$\{?[A-Z][A-Z0-9_]{0,48}(SECRET|PASSWORD|PASSWD|TOKEN|APIKEY|_KEY)[A-Z0-9_]*\}?'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
