defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
traits:
  - id: n8n-encryption-key-name
    desc: n8n encryption-key environment name
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(^|[^A-Z0-9_])N8N_ENCRYPTION_KEY([^A-Z0-9_]|$)'

  # Named for what the matcher detects — a reference to an n8n runtime
  # environment variable, not the gate itself. Gating intent is inferred by
  # the supply-chain composites that pair this with payload behavior.
  - id: n8n-runtime-env-reference
    desc: References n8n runtime environment variable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env\.(N8N_USER_FOLDER|N8N_ENCRYPTION_KEY|EXECUTIONS_MODE|N8N_RUNNERS_ENABLED)'

  # Both rules in this file used `type: tree-sitter` with `kind: member` and
  # matched nothing -- not even `process.env.NPM_TOKEN`. filefacts does extract
  # the access (`cleave facts` reports
  # `{"kind":"member","path":"process.env.NPM_TOKEN"}`), but the tree-sitter
  # matcher walks raw grammar node kinds, and JavaScript spells this
  # `member_expression`, so `member` selected nothing and the rules were dead.
  # `type: text` is what the working sibling in traits.yaml
  # (`service-credential-env-var`) uses.
  #
  # Credential-bearing env names, by suffix. LICENSE/ACCESS were added after a
  # preinstall hook read CENTRAL_LICENSE_KEY and shipped it to a vendor endpoint
  # with nothing firing -- a licence or activation key is a credential and
  # travels the same path a stolen token does. Bare `KEY` stays out on purpose:
  # PUBLIC_KEY, CACHE_KEY and KEY_PATH are not secrets.
  #
  # A narrower `process-env-token-name` rule lived here for the *TOKEN spelling
  # alone. Once this rule started firing it covered TOKEN too, and that rule had
  # no references, so it was folded in rather than left to double-count.
  - id: javascript-credential-env-read
    desc: JavaScript reads a credential env var
    conf: 0.85
    if:
      type: text
      regex: 'process\.env\.\w{0,40}((API|PRIVATE|LICENSE|ACCESS)[_-]?KEY|TOKEN|SECRET|PASSWORD)\b'
      case_insensitive: true
      not:
        # Framework build-time variables are deliberately exposed to browser
        # bundles; reading one is configuration, not a secret access.
        - substr: NEXT_PUBLIC_
        - substr: VITE_
        - substr: REACT_APP_
        - substr: PUBLIC_KEY
