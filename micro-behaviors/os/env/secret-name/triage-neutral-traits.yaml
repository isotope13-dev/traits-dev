---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: python-secret-key-environment-read
  desc: Python secret-key environment read syntax
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: "(getenv|environ\\.get)\\(.{0,20}SECRET.{0,20}KEY"
    case_insensitive: true
- conf: 0.6
  for:
  - scripts
  - source
  id: telegram-bot-token-name-reference
  desc: Telegram bot token variable/column
  unless:
  - id: well-known/app/ai/gateway/opencode-router
  - type: text
    substr: TELEGRAM_BOT_TOKEN
  if:
    type: text
    regex: "(?i)telegram[_\\s]?bot[_\\s]?token"
- for:
  - python
  - powershell
  - shell
  id: slack-token-environment-name-reference
  desc: Slack secret environment name
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\bSLACK_(BOT_TOKEN|TOKEN)\\b"
