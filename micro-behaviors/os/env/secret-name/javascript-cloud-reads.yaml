defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: env-aws-session-token
  desc: Literal names AWS session-token access
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.AWS_SESSION_TOKEN

- id: env-gcp-prefix
  desc: Literal names GCP credential env access
  conf: 0.72
  if:
    type: string_literal
    regex: process\.env\.GCP_[A-Z0-9_]*(TOKEN|KEY|SECRET|CREDENTIALS?)\b

- id: env-digitalocean-prefix
  desc: DigitalOcean credential env access
  conf: 0.72
  if:
    type: text
    regex: process\.env\.DIGITALOCEAN_[A-Z0-9_]*(TOKEN|KEY|SECRET|CREDENTIALS?)\b

- id: env-heroku-api
  desc: Reads HEROKU_API_KEY environment variable
  conf: 0.75
  if:
    type: symbol
    kind: member
    regex: ^process\.env\.HEROKU_API_KEY(\.|$)

composite_rules:
- id: node-aws
  desc: AWS credential environment references
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/secret-name::node-aws-access-key-member
  - id: micro-behaviors/os/env/secret-name::node-aws-secret-member
  - id: env-aws-session-token
  - id: node-aws-credential-env-access
- id: node-cloud
  desc: Cloud credential environment references
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/cloud::google-cloud-credential-env-read
  - id: env-gcp-prefix
  - id: micro-behaviors/os/env/cloud::azure-cloud-credential-env-read
  - id: env-digitalocean-prefix
  - id: env-heroku-api
  - id: micro-behaviors/os/env/secret-name::node-cloudflare-token-member
  - id: micro-behaviors/os/env/cloud::node-r2-credential-env-access

- id: node-aws-credential-env-access
  desc: Env access near AWS credential name
  conf: 0.9
  unless:
  - id: metadata/package/testing/corpus/labeled::inert-security-input-module
  near_bytes: 256
  all:
  - id: micro-behaviors/os/env/read/variable::javascript
  - id: micro-behaviors/os/env/cloud::aws-secret-access-key-var
