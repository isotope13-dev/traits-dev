defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: env-aws-session-token
  desc: Literal names AWS session-token access
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.AWS_SESSION_TOKEN
  unless:
  - id: well-known/app/ai/coding-agent/pi-coding-agent::base-context-archive-context
  - id: well-known/app/ai/coding-agent/pi-coding-agent::base-context-ambient-bedrock-identity
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/app/ai/gateway/neurolink::bedrock-provider-context
  - id: well-known/lib/cloud/electron-publish/
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/extension/identity::markdown-file-basename
- id: env-gcp-prefix
  desc: Literal names GCP credential env access
  crit: notable
  conf: 0.72
  if:
    type: string_literal
    regex: process\.env\.GCP_[A-Z0-9_]*(TOKEN|KEY|SECRET|CREDENTIALS?)\b
  unless:
  - id: metadata/package/documentation/package-metadata::has-jsdoc-example
  - id: metadata/package/documentation/source::documentation-dir-path
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/app/ai/gateway/neurolink::bedrock-provider-context
- id: env-azure-prefix
  desc: Azure credential env access
  crit: notable
  conf: 0.72
  if:
    id: micro-behaviors/os/env/cloud::azure-cloud-credential-env-read
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/documentation/package-metadata::has-jsdoc-example
  - id: well-known/lib/cloud/azure-identity::azure-identity-js-sdk
  - id: well-known/tool/development/vscode-extension/dbcode::extension-context
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::m365-agents-toolkit-vsix
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/lib/ai/policysynth-agents::benign-archive-context
  - id: well-known/lib/development/electron-builder::library-context
- id: env-digitalocean-prefix
  desc: DigitalOcean credential env access
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: process\.env\.DIGITALOCEAN_[A-Z0-9_]*(TOKEN|KEY|SECRET|CREDENTIALS?)\b
  unless:
  - id: metadata/package/documentation/package-metadata::has-jsdoc-example
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/app/ai/gateway/phaseo::phaseo-source-path
- id: env-heroku-api
  desc: Reads HEROKU_API_KEY environment variable
  crit: notable
  conf: 0.75
  if:
    type: symbol
    kind: member
    regex: ^process\.env\.HEROKU_API_KEY(\.|$)
  unless:
  - id: well-known/app/ai/tool-server/heroku-mcp-server/
  - id: well-known/app/infrastructure/heroku-cli/
  - id: well-known/app/ai/tool-server/heroku-mcp-server::official-package
  - id: well-known/app/infrastructure/heroku-cli::official-command-package
  - id: metadata/package/testing/presence/harness::test-directory
  - id: metadata/file/naming::test-directory-component
composite_rules:
- id: node-aws
  desc: AWS credential environment references
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/lib/ai/cline-llms/
  - id: well-known/tool/development/agent/anthropic-claude-agent/
  - id: well-known/tool/development/autohq::autohq-cli-source-marker
  - id: well-known/lib/cloud/aws4/
  - id: well-known/lib/vendor-sdk/uniweb/
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/lib/cloud/electron-publish/
  any:
  - id: micro-behaviors/os/env/secret-name::node-aws-access-key-member
  - id: micro-behaviors/os/env/secret-name::node-aws-secret-member
  - id: env-aws-session-token
  - id: node-aws-credential-env-access
- id: node-cloud
  desc: Cloud credential environment references
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/cloud::google-cloud-credential-env-read
  - id: env-gcp-prefix
  - id: env-azure-prefix
  - id: env-digitalocean-prefix
  - id: env-heroku-api
  - id: micro-behaviors/os/env/secret-name::node-cloudflare-token-member
  - id: micro-behaviors/os/env/cloud::node-r2-credential-env-access
  unless:
  - id: well-known/app/storage/bruno::app-bundle
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::m365-agents-toolkit-vsix
  - id: well-known/lib/cloud/azure-identity::azure-identity-js-sdk
  - id: well-known/tool/development/vscode-extension/dbcode::extension-context
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/lib/ai/policysynth-agents::benign-archive-context
  - id: well-known/tool/development/vscode-extension/jinicode::provider-user-agent
  - id: well-known/app/infrastructure/heroku-cli::official-command-package
  - id: well-known/app/ai/tool-server/heroku-mcp-server::official-package
- id: node-aws-credential-env-access
  desc: Env access near AWS credential name
  crit: notable
  conf: 0.9
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/lib/ai/cline-llms/
  - id: well-known/tool/development/agent/anthropic-claude-agent/
  - id: well-known/tool/development/autohq::autohq-cli-source-marker
  - id: well-known/lib/cloud/aws4/
  - id: well-known/lib/vendor-sdk/uniweb/
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/lib/cloud/electron-publish/
  near_bytes: 256
  all:
  - id: micro-behaviors/os/env/read::javascript
  - id: micro-behaviors/os/env/secret-name::aws-secret-access-key-var
