defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: js-secret-keyword-list
    desc: Environment enumeration beside credential-name labels
    crit: notable
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/data/format/credentials::credential-label-upper
    any:
      - id: micro-behaviors/os/env/enumeration::js-object-entries-env
      - id: micro-behaviors/os/env/enumeration::js-object-keys-env
