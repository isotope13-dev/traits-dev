defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - powershell
  - shell
traits:
- id: script-stripe-secret-env-name
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Stripe secret environment name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bSTRIPE_(SECRET_KEY|API_KEY)\b
