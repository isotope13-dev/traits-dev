defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: chain-private-key-env-name
  desc: Chain-specific private-key environment name
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (ETH|BTC|SOLANA)_PRIVATE_KEY

- id: node-wallet-secret-env-member
  desc: Reads wallet-secret named environment member
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: member
    regex: '^process\.env\.WALLET_(PRIVATE_KEY|SEED|MNEMONIC|SECRET)$'
