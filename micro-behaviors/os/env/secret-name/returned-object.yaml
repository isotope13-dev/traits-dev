defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: javascript-returned-credential-env-object
    desc: Returns object with credential environment read
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((return_statement
          (object
            (pair value: (member_expression
              object: (member_expression
                object: (identifier) @process
                property: (property_identifier) @env)
              property: (property_identifier) @credential)))) @returned
          (#eq? @process "process")
          (#eq? @env "env")
          (#match? @credential "(?i)(TOKEN|SECRET|KEY|PASS)"))
