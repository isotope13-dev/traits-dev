defaults:
  for: [elixir]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: elixir-secret-environment-selection
    desc: Selects secret-named process environment entries
    # The filter must test the tuple's key, accept matches, and operate on
    # System.get_env(). The test must be the returned expression, not a
    # discarded intermediate value. Comments and unrelated inputs do not count.
    if:
      type: tree-sitter
      query: |
        ((binary_operator
          left: (call
            target: (dot left: (alias) @system right: (identifier) @getenv)
            (arguments) @noargs)
          "|>"
          right: (call
            target: (dot left: (alias) @enum right: (identifier) @filter)
            (arguments (anonymous_function (stab_clause
              left: (arguments (tuple (identifier) @key (identifier)))
              right: (body . (binary_operator
                left: (identifier) @tested
                "=~"
                right: (sigil (sigil_name) @sigil (quoted_content) @pattern)) .))))))
          (#eq? @system "System")
          (#eq? @getenv "get_env")
          (#match? @noargs "^\\(\\s*\\)$")
          (#eq? @enum "Enum")
          (#eq? @filter "filter")
          (#eq? @key @tested)
          (#eq? @sigil "r")
          (#match? @pattern "(?i)TOKEN|SECRET|PASSWORD"))
