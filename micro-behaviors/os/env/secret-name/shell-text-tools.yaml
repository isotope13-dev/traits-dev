# Text-tool proximity to key variable names; no theft or data flow inferred.
defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: shell-text-tool-near-key-name
  desc: Text tool near KEY-suffixed variable name
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '\b(grep|awk|sed)\b.{0,50}\$?[A-Z0-9]+_KEY\b'
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: shell-key-name-near-text-tool
  desc: KEY-suffixed variable near a grep-like tool
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '\$?[A-Z0-9]+_KEY\b.{0,50}\b(grep|awk|sed)\b'
