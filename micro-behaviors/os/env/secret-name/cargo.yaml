defaults:
  platforms: [unix, windows]
  for: [github-actions]
traits:
- id: cargo-registry-token-name
  desc: Cargo registry credential variable name
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\b(CRATES_IO_TOKEN|CARGO_REGISTRY_TOKEN)\b'
  unless:
    - id: micro-behaviors/os/package-manager/publish::cargo-publish-workflow-secret
    - id: micro-behaviors/os/package-manager/publish::cargo-registry-token-gha-secrets-reference

