defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: aws-env-secret-vars
    for: [shell, python, javascript, powershell, pe, elf]
    desc: AWS credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^AWS_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: aws-secret-access-key-var
    for: [shell, python, javascript, powershell, pe, elf, csharp]
    # A bare name can occur in documentation or SDK guidance; it does not
    # establish that the program reads the credential.
    desc: AWS secret-key environment name reference
    crit: notable
    conf: 0.86
    if:
      type: text
      word: AWS_SECRET_ACCESS_KEY
  # Compiled binaries pack string constants back to back, so the name sits
  # between two other constants with no word boundary on either side (a Rust
  # payload stored `...:9000AWS_ACCESS_KEY_IDAWS_SECRET_ACCESS_KEY/var/run...`)
  # and the `word:` atom above never matches. String extraction also splits
  # such blobs at xref-derived lengths that need not fall on a constant's
  # boundary (seen: `...ACCESS_K` | `EY/var/...`), hence raw bytes. The two
  # names together are the credential pair an SDK or a harvester reads.
  - id: aws-access-key-pair-names-binary
    for: [elf, macho, pe]
    desc: Binary names the AWS access-key env pair
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: 'AWS_ACCESS_KEY_ID[\s\S]{0,64}AWS_SECRET_ACCESS_KEY'

composite_rules:
  - id: aws-credential-env-name
    desc: AWS credential environment names in JavaScript
    for: [javascript, typescript]
    conf: 0.86
    any:
      - id: aws-env-secret-vars
      - id: aws-secret-access-key-var
