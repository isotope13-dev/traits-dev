# Evidence describes ordinary capabilities or static properties.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - powershell
  - shell
  crit: notable
  conf: 0.9
traits:
- id: script-azure-credential-env-name
  desc: Azure credential environment variable name
  if:
    type: text
    regex: (?i)\bAZURE_(CLIENT_ID|CLIENT_SECRET|TENANT_ID)\b
- id: script-gcp-credential-env-name
  desc: GCP credential environment variable name
  if:
    type: text
    regex: (?i)\bGOOGLE_APPLICATION_CREDENTIALS\b
