defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
- id: walletd-passphrase-env
  desc: Wallet daemon passphrase environment variable
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: WALLETD_KEYSTORE_PASSPHRASE

- id: python-api-key-env-read
  desc: Python reads API key env vars
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: '^(os\.)?(getenv|environ\.get)$'
    arg:
      kind: string
      regex: '(?i)(^|[_-])API[_-]?KEY($|[_-])'
