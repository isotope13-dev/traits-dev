defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: platform-secret-store-session-token-name
  desc: References secret-store session-token env name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b[A-Z][A-Z0-9_]{0,32}_(USER_)?SECRETS?_TOKEN\b'

# A request aimed at the secret store rather than the product API. The
# "by label"/"by name" spelling is how these endpoints address one stored
# secret.

