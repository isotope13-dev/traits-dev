# Instruction assigns a credential-shaped environment variable:
# `export VENDOR_TOKEN=...`, `MYAPP_API_KEY=` in an env file or setup step.
# Vendor-specific name traits live beside this one; this catches the generic
# assignment shape so a renamed vendor prefix cannot walk past detection.
# Requiring the `=` keeps CLI help enumerations ("Environment: MYAPP_API_KEY,
# MYAPP_URL") and bare prose mentions quiet. An assignment instruction alone
# establishes neither that the credential is the user's own nor where it
# flows; exfiltration composites bind it to a network sink.
defaults:
  platforms: [unix, windows]
  # Instruction surfaces: shell scripts and agent-skill markdown. `text` is
  # deliberately absent — embedded string layers inside source files (a CLI's
  # own help text naming its env vars) would otherwise match.
  for: [shell, markdown, batch, powershell]
  crit: notable
traits:
- id: credential-env-var-assignment
  desc: Assigns credential-named environment variable
  conf: 0.85
  # Uppercase only: env-var names are conventionally uppercase, and case
  # insensitivity would pull in URL query parameters (`xsec_token=...`).
  if:
    type: text
    regex: '(?m)\b[A-Z][A-Z0-9_]{0,32}_(TOKEN|API_KEY|ACCESS_TOKEN|AUTH_TOKEN|SECRET)='
