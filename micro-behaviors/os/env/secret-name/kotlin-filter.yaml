defaults:
  platforms: [unix, windows]
  for: [kotlin]

traits:
  # A deployment-variable list is not environment access. Require the
  # no-argument environment map chained to a key-filter predicate.
  - id: kotlin-password-env-key-filter
    desc: Kotlin env key filter references PASSWORD
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'System[.]getenv\(\)[.]filterKeys[\s\S]{0,180}PASSWORD'

  - id: kotlin-sensitive-env-key-filter
    desc: Kotlin filters secret environment keys
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'System[.]getenv\(\)[.]filterKeys[\s\S]{0,240}(TOKEN|KEY|SECRET)'
