defaults:
  platforms: [windows]
  for: [rust]
  attack: T1041

traits:
  - id: rust-windows-env-data-marker
    desc: Rust environment-data protocol marker
    # ENV_DATA is also an ordinary protocol/register constant. It is only a
    # useful stealer fragment with the profile fields and HTTP beacon below.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*(pub\s+)?(const|static)\s+ENV_DATA\s*:'
