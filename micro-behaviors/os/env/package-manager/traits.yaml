defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell, pe, elf]
  crit: notable
  conf: 0.7
traits:
  - id: package-registry-credentials-npm
    desc: NPM/PyPI registry credentials
    conf: 0.7
    if:
      type: text
      regex: ^(NPM_|PYPI_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: package-registry-credentials-enterprise
    desc: Enterprise registry credentials
    conf: 0.7
    if:
      type: text
      regex: ^(NUGET_|ARTIFACTORY_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: composer-auth-var-name
    desc: Composer credential environment variable
    conf: 0.9
    if:
      type: literal
      exact: COMPOSER_AUTH
  - id: shell-embedded-node-credential-env-read
    desc: Embedded credential env access
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: process.env.AWS_SECRET_ACCESS_KEY
  - id: shell-embedded-node-npm-token-read
    desc: Embedded NPM token env access
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: process.env.NPM_TOKEN

composite_rules:
  # This directory holds every npm/node ecosystem variable, credential-bearing
  # or not (npm_lifecycle_event, npm_config_user_agent, npmrc context markers).
  # Consumers that mean "a registry credential was read" name this roll-up
  # rather than the directory, which would also sweep in the neutral members.
  - id: package-registry-credential-env-read
    desc: Reads a package-registry credential from the environment
    crit: notable
    conf: 0.9
    any:
      - id: npm-token-env-read
      - id: node-auth-token-env-read
      - id: npm-auth-token-env-read
      - id: npmrc-registry-auth-token
      - id: composer-auth-var-name
      - id: package-registry-credentials-npm
      - id: package-registry-credentials-enterprise
      - id: shell-embedded-node-credential-env-read
      - id: shell-embedded-node-npm-token-read
