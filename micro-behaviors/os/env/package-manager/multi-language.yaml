defaults:
  platforms: [unix, windows]
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
  attack: "T1552.001,T1041"
  mbc: E1552

traits:
  # Path/env atoms that are not already covered (or not covered for go/rust/c)
  # by micro-behavior defaults. Do not restate CURLOPT_POSTFIELDS / axios.post /
  # discord webhook / slack / telegram URL atoms — reference those below.
  # A `.netrc` path reference is a neutral sensitive-path read, already owned by
  # micro-behaviors/fs/path/secret-config::netrc (which also carries the
  # test-harness downgrade and scanner carve-outs). A second copy here reported
  # ordinary netrc-aware network clients — CPAN::FTP reads ~/.netrc for mirror
  # logins — as a credential-stealer finding. The composite below references the
  # capability atom instead.
  - id: npm-token-name-ref
    desc: Reads npm auth token from environment
    crit: notable
    conf: 0.88
    if:
      type: text
      # Require env-style access (JS/Python/Rust/C). Bare NPM_TOKEN in an
      # HTML placeholder (build-secret name hints) is documentation, not theft.
      regex: '(?i)(env(iron)?[\.\[:]|getenv\().{0,10}["'']?(NPM_TOKEN|NODE_AUTH_TOKEN)\b'
