defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: cargo-registry-token-dot-access
  desc: Cargo token dot environment access
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: process\s*\.\s*env\s*\.\s*CARGO_(REGISTRY_TOKEN|REGISTRIES_[A-Z0-9_]+_TOKEN)\b
- id: cargo-registry-token-bracket-access
  desc: Cargo token bracket environment access
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: process\s*\.\s*env\s*\[\s*["']CARGO_(REGISTRY_TOKEN|REGISTRIES_[A-Z0-9_]+_TOKEN)["']\s*\]

composite_rules:
- id: cargo-registry-token
  desc: Cargo token environment access
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/os/env/package-manager::cargo-registry-token-dot-access
  - id: micro-behaviors/os/env/package-manager::cargo-registry-token-bracket-access
