defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: npm-token-env-read
    crit: notable
    conf: 0.95
    desc: Reads NPM_TOKEN from JavaScript env
    if:
      type: symbol
      kind: member
      exact: process.env.NPM_TOKEN
  - id: node-auth-token-env-read
    crit: notable
    conf: 0.95
    desc: Reads NODE_AUTH_TOKEN from JavaScript env
    if:
      type: symbol
      kind: member
      exact: process.env.NODE_AUTH_TOKEN
  - id: npm-auth-token-env-read
    crit: notable
    conf: 0.95
    desc: Reads NPM_AUTH_TOKEN from JavaScript env
    if:
      type: symbol
      kind: member
      exact: process.env.NPM_AUTH_TOKEN
  - id: npm-lifecycle
    desc: Reads npm lifecycle event environment variable
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'process\.env(\?\.|\.|\[[''"])npm_lifecycle_event'
  - id: npm-config-user-agent
    desc: Reads npm user-agent environment variable
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'process\.env(\?\.|\.|\[[''"])npm_config_user_agent'
  - id: npm-user-agent-package-manager-field
    desc: Maps npm user-agent into package-manager field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bpackageManager\s*:\s*[^,\r\n]{0,96}\.env\.npm_config_user_agent\b'
  - id: npm-package-info
    desc: Access npm package info
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: process.env.npm_package_
  - id: npmrc-publishing-version-context
    desc: npmrc package publishing message context
    crit: baseline
    conf: 0.86
    if:
      type: string_literal
      substr: "Publishing version:"
  - id: npmrc-token-to-npmrc-text
    desc: npm token to npmrc writing text context
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: 'npmToken to npmrc|Writing \.npmrc to \$\{basedir\}'
  - id: npmrc-tool-config-context
    desc: npmrc package-manager config context
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: 'name:\s*[''"]npmrc[''"]|packageFile\.npmrc|redactedFields|configSerializer'
  - id: npmrc-file-extension-list-context
    desc: npmrc filename in extension allowlist context
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[''"]wgetrc[''"],\s*[''"]npmrc[''"],\s*[''"]yarnrc[''"]'
  - id: npm-build-env-windows-profile--appdata
    desc: npm build Windows profile env (APPDATA)
    crit: notable
    conf: 0.9
    if:
      type: text
      word: APPDATA
  - id: npm-build-env-windows-profile--systemroot
    desc: npm build Windows profile env (SystemRoot)
    crit: notable
    conf: 0.9
    if:
      type: text
      word: SystemRoot
composite_rules:
# A telemetry sender that posts a JSON event is benign when it explicitly maps
# npm_config_user_agent into a packageManager field. The payload-flow engine
# cannot see through a builder object and otherwise reports the process.env
# argument as entering the body. Mere presence of the env name is insufficient,
# and bulk-environment or credential reads invalidate the exception.
- id: selective-npm-agent-telemetry
  desc: JSON POST maps npm user-agent package-manager field
  crit: exception
  conf: 0.93
  all:
  - id: npm-user-agent-package-manager-field
  - id: micro-behaviors/communications/http/request/client::http-post-json
  unless:
  - id: micro-behaviors/os/env/enumeration::js-process-env-spread
  - id: micro-behaviors/os/env/enumeration::js-object-keys-env
  - id: micro-behaviors/os/env/enumeration::js-object-entries-env
  - id: micro-behaviors/os/env/read::js-filtered-env-copy
  - id: package-registry-credential-env-read
  - id: micro-behaviors/os/env/cloud/
  - id: micro-behaviors/os/env/ci-credentials/
  - id: micro-behaviors/os/env/ssh/
- id: node-registry-token-env-read
  desc: Reads a Node registry token variable
  crit: notable
  conf: 0.95
  # One credential category for breadth-counting consumers, not three sources.
  any:
  - id: npm-token-env-read
  - id: node-auth-token-env-read
  - id: npm-auth-token-env-read
- id: npm-build-env-windows-profile
  desc: npm build Windows profile env
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/read::rust-localappdata-env-var
  - id: npm-build-env-windows-profile--appdata
  - id: micro-behaviors/os/env/user-paths::userprofile-var
  - id: npm-build-env-windows-profile--systemroot
- id: npmrc-benign-context
  desc: Benign npmrc reference context
  crit: component
  conf: 0.88
  any:
  - id: npmrc-publishing-version-context
  - id: metadata/build/bundler/vscode::vscode-icon-theme-catalog
  - id: metadata/build/ecosystem::npm-embedded-build-env-dump
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/harness/runtime::is-test
  - id: well-known/lib/web/npm-frameworks::update-notifier-npmrc-context
  - id: metadata/build/bundler/vscode::vscode-material-icon-map-bundle
  - id: npmrc-registry-client-context
  - id: npmrc-tool-config-context
  - id: npmrc-file-extension-list-context
- id: npmrc-registry-client-context
  desc: npmrc registry client context
  crit: baseline
  conf: 0.88
  any:
  - id: npmrc-registry-auth-token
  - id: npmrc-token-to-npmrc-text
