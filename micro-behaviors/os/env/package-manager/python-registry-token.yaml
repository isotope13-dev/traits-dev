defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: python-npm-token-env-read
  desc: Python reads NPM_TOKEN env var
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (getenv|environ).{0,30}NPM_TOKEN
- id: python-pypi-token-env-read
  desc: Python reads PYPI_TOKEN env var
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (getenv\(|environ\[|environ\.get\()\s*['"]PYPI_TOKEN
- id: python-twine-password-env-read
  desc: Python reads TWINE_PASSWORD env var
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])(getenv\(|environ\[|environ\.get\()\s*['"]TWINE_PASSWORD
