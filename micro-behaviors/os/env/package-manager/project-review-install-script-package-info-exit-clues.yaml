defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: install-script-package-info-exit-clues
    desc: Install script references npm package info and exits
    crit: notable
    conf: 0.88
    scope: file
    near_lines: 4
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: micro-behaviors/os/env/package-manager::npm-package-info
      - id: micro-behaviors/process/exit/terminate::js-process-exit-zero
