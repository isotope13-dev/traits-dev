defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: npm-token-name
    desc: '"NPM_TOKEN" env-var name'
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: NPM_TOKEN
      case_insensitive: true

  - id: node-auth-token-name
    desc: '"NODE_AUTH_TOKEN" env-var name'
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: NODE_AUTH_TOKEN
      case_insensitive: true
