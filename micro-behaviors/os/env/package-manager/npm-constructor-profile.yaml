defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: npm-package-version-env
    desc: Reads npm package version from env
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: process['env']['npm_package_version']
composite_rules:
  - id: npm-package-version-env-obfuscated
    desc: Obfuscated npm package version read from environment
    crit: notable
    conf: 0.91
    all:
      - id: micro-behaviors/os/env/read/variable::javascript
      - id: metadata/lang/source/literal/fragment/env-variable::npm-package-version-fragment-a
      - id: metadata/lang/source/literal/fragment/env-variable::npm-package-version-fragment-b
