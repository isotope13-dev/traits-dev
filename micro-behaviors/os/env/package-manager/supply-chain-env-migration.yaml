defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- id: python-package-tokens
  desc: Python registry or source-control token access
  crit: notable
  conf: 0.9
  for:
  - python
  any:
  - id: micro-behaviors/os/env/vcs::python-github-token-env-read
  - id: micro-behaviors/os/env/vcs::python-gh-token-env-read
  - id: micro-behaviors/os/env/package-manager::python-npm-token-env-read
  - id: micro-behaviors/os/env/package-manager::python-pypi-token-env-read
  - id: micro-behaviors/os/env/package-manager::python-twine-password-env-read
- id: javascript-package-tokens
  desc: JavaScript registry or source-control token clues
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/os/env/vcs::node-source-control-token-code-literal
  - id: micro-behaviors/os/env/package-manager::node-registry-token-env-read
