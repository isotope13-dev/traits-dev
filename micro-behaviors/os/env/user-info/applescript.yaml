# The named system attribute is the environment source, not a user-account
# enumeration or evidence of credential access. Match escaped quotes too,
# so compiled carriers retain the observation after string reconstruction.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
traits:
  - id: applescript-user-environment-query
    desc: AppleScript queries USER environment attribute
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bsystem attribute\s+\\*["'']USER\\*["'']'
