defaults:
  for: [scripts, binaries]
  crit: baseline
  conf: 0.5
  platforms:
    - unix
    - windows
traits:
  - id: user-var
    desc: USER environment variable
    platforms:
      - unix
    if:
      type: text
      exact: USER
  - id: username-var
    desc: USERNAME environment variable
    platforms:
      - windows
    if:
      type: text
      exact: USERNAME
  - id: logname-var
    desc: LOGNAME environment variable
    platforms:
      - unix
    if:
      type: text
      exact: LOGNAME
  - id: home-var
    desc: HOME environment variable
    platforms:
      - unix
    if:
      type: text
      exact: HOME
  - id: homedrive-var
    desc: HOMEDRIVE environment variable
    platforms:
      - windows
    if:
      type: text
      exact: HOMEDRIVE
  - id: homepath-var
    desc: HOMEPATH environment variable
    platforms:
      - windows
    if:
      type: text
      exact: HOMEPATH
  - id: node-user-identity-env-reference
    desc: Node reads USER or USERNAME environment variable
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      regex: '^process\.env\.(USER|USERNAME)$'
  - id: python-user-identity-env-reference
    desc: Python reads USER or USERNAME env var
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: '(?i)\b(os\.)?(environ(\.get)?|getenv)\s*(\[\s*|\(\s*)["''](USER|USERNAME|LOGNAME)["'']'

