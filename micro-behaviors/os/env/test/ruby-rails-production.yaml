# Rails environment references and actual production-mode tests are separate.
defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: rails-production-env
    desc: Rails production check in a quoted string
    crit: notable
    conf: 0.65
    if:
      type: string_literal
      regex: 'Rails\.env\.production|env\.production\?'
  - id: ruby-rails-production-check
    desc: Checks Rails production environment
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        (call receiver: (call receiver: (constant) @rails method: (identifier) @env)
          method: (identifier) @production
          (#eq? @rails "Rails") (#eq? @env "env") (#eq? @production "production?"))
