defaults:
  platforms: [unix, windows]
  crit: notable
traits:
  - id: php-missing-env-return
    desc: PHP returns when environment key is absent
    for: [php]
    if:
      type: text
      regex: '\bif\s*\(\s*getenv\([^)]{1,60}\)\s*===\s*false\s*\)\s*\{\s*return;'
      exclude_comments: true
  - id: c-direct-missing-env-return
    desc: C returns when environment key is absent
    for: [c]
    if:
      type: text
      regex: '\bif\s*\(\s*getenv\([^)]{1,60}\)\s*==\s*NULL\s*\)\s*\{\s*return\b'
      exclude_comments: true
  # The adjacent guard must test the pointer initialized by getenv, not an
  # unrelated null check. Facts do not retain this branch relationship.
  - id: c-assigned-missing-env-return
    desc: C returns when getenv pointer is null
    for: [c]
    if:
      type: tree-sitter
      language: c
      query: |
        ((compound_statement
          (declaration
            declarator: (init_declarator
              declarator: (pointer_declarator declarator: (identifier) @env)
              value: (call_expression function: (identifier) @getenv)))
          . (if_statement
            condition: (parenthesized_expression
              (binary_expression left: (identifier) @checked
                operator: "==" right: (_) @null))
            consequence: (compound_statement . (return_statement))) @evidence)
          (#eq? @getenv "getenv") (#eq? @env @checked) (#eq? @null "NULL"))
  - id: perl-env-return-guard
    desc: Perl returns unless environment value is set
    for: [perl]
    if:
      type: text
      regex: 'return\s+([0-9]+|undef)\s+unless\s+\$ENV\{[^}]{1,60}\}\s*;'
      exclude_comments: true
composite_rules:
  - id: c-missing-env-return
    desc: C returns when environment key is absent
    for: [c]
    any:
      - id: c-direct-missing-env-return
      - id: c-assigned-missing-env-return
