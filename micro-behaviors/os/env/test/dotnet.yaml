defaults:
  platforms: [windows, unix]
  for: [pe, dll, csharp]

traits:
  - id: dotnet-env-null-check
    desc: Tests whether .NET environment variable is null
    crit: notable
    conf: 0.92
    for: [csharp]
    if:
      type: text
      regex: 'GetEnvironmentVariable\s*\([^)\n]{1,30}\)\s*(is\s+(not\s+)?null|[!=]=\s*null)'

composite_rules:
  - id: dotnet-profiler-setting-presence-check
    desc: Tests whether the .NET profiler environment setting is present
    crit: notable
    conf: 0.94
    near_lines: 8
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/env/platform::dotnet-profiling-env-name
      - id: micro-behaviors/os/env/read/variable::get-environment-variable-name-reference
