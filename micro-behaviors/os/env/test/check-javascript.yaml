defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Boolean() around an env read discards the value and keeps only whether it
  # is set (e.g. `credential_present: Boolean(process.env.X || ...)`). The
  # secret never flows anywhere; only the presence bit does.
  - id: boolean-env-presence-check
    desc: Boolean() checks env var presence
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Boolean\s*\(\s*process\.env\??\.[A-Za-z0-9_]+'
