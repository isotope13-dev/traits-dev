defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: npm-token-env-read
    desc: Reads NPM_TOKEN from JavaScript env
    if:
      type: symbol
      kind: member
      exact: process.env.NPM_TOKEN

  - id: node-auth-token-env-read
    desc: Reads NODE_AUTH_TOKEN from JavaScript env
    if:
      type: symbol
      kind: member
      exact: process.env.NODE_AUTH_TOKEN

  - id: npm-auth-token-env-read
    desc: Reads NPM_AUTH_TOKEN from JavaScript env
    if:
      type: symbol
      kind: member
      exact: process.env.NPM_AUTH_TOKEN
