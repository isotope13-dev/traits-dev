defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

# Shared exclusions applied to every atom below:
#   * Library API constants (G_*, SOUP_*, SSL_*) are compile-time symbol names,
#     not environment-variable names.
#   * Diagnostic constants (ERROR_WRONG_PASSWORD, ERR_INVALID_TOKEN,
#     AUTH_ERROR_MISSING_API_KEY) name a failure condition. Every SDK with an
#     error-code table ships dozens of them; none holds a credential.

traits:
  - id: native-password-like-identifier
    desc: Password-like identifier string in native code
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '\b[A-Z][A-Z0-9_]*_(PASSWORD|PASSWD|PASS)\b'
      not:
        - regex: '^(G|SOUP|NICE|SSL|TLS|GLIB|GIO)_[A-Z0-9_]+$'
        - regex: '^E(RROR|RR)_'
        - regex: '_ERROR_'
        - regex: '_(INVALID|MISSING|WRONG|WEAK)_'
  - id: native-token-like-identifier
    desc: Token-like identifier string in native code
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '\b[A-Z][A-Z0-9_]*_(TOKEN|ACCESS_TOKEN|AUTH_TOKEN)\b'
      not:
        - regex: '^(G|SOUP|NICE|SSL|TLS|GLIB|GIO)_[A-Z0-9_]+$'
        - regex: '^E(RROR|RR)_'
        - regex: '_ERROR_'
        - regex: '_(INVALID|MISSING|WRONG|WEAK)_'
  - id: native-secret-like-identifier
    desc: Secret-key-like identifier string in native code
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '\b[A-Z][A-Z0-9_]*_(SECRET_KEY|ACCESS_KEY|CLIENT_SECRET)\b'
      not:
        - regex: '^(G|SOUP|NICE|SSL|TLS|GLIB|GIO)_[A-Z0-9_]+$'
        - regex: '^E(RROR|RR)_'
        - regex: '_ERROR_'
        - regex: '_(INVALID|MISSING|WRONG|WEAK)_'
  - id: native-api-key-like-identifier
    desc: API-key-like identifier string in native code
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '\b[A-Z][A-Z0-9_]*_API_KEY\b'
      not:
        - regex: '^(G|SOUP|NICE|SSL|TLS|GLIB|GIO)_[A-Z0-9_]+$'
        - regex: '^E(RROR|RR)_'
        - regex: '_ERROR_'
        - regex: '_(INVALID|MISSING|WRONG|WEAK)_'

composite_rules:
  - id: native-credential-like-identifiers
    desc: Multiple credential-like identifier strings in native code
    crit: notable
    conf: 0.9
    any:
      - id: native-password-like-identifier
      - id: native-token-like-identifier
      - id: native-secret-like-identifier
      - id: native-api-key-like-identifier
    needs: 3
