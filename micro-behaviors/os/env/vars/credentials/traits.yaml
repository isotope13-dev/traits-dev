defaults:
  platforms:
    - unix
    - windows
  for: [shell, python, javascript, powershell, pe, elf]
  crit: notable
  conf: 0.7
traits:
  - id: python-environ-credential-filter
    desc: Python env membership credential marker
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'in\s+os\.environ[\s\S]{0,100}["''](SECRET|TOKEN|KEY)'

  - id: python-environ-items-secret-marker
    desc: Credential marker string literal
    crit: component
    conf: 0.92
    for: [python]
    if:
      type: string_literal
      kind: string
      # The consuming composite supplies the os.environ.items() context.
      # Keep this atom limited to actual string literals, not identifiers
      # such as _safe_keys or prose mentioning a credential term.
      # A literal ending in KEY_/SECRET_/TOKEN_ is a namespace prefix for a
      # startswith() selection (e.g. an app's own FERAL_KEY_ variables), not
      # a credential name: real credential variables never end in "_".
      regex: '(^|[_-])(TOKEN|SECRET|KEY)([_-]|$)'
      case_insensitive: true
    not:
      - regex: '(?i)(TOKEN|SECRET|KEY)_["'']?$'

  - id: python-environ-items-password-marker
    desc: Password marker string literal
    crit: component
    conf: 0.92
    for: [python]
    if:
      type: string_literal
      kind: string
      # As above: a trailing-underscore literal (APP_PASSWORD_) selects an
      # application namespace; it does not name a credential.
      regex: '(^|[_-])(PASSWORD|CREDENTIAL)([_-]|$)'
      case_insensitive: true
    not:
      - regex: '(?i)(PASSWORD|CREDENTIAL)_["'']?$'

  - id: python-environ-alias-items-secret-marker
    desc: Aliased env iteration uses secret markers
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?is)environ\.items\(\).{0,220}["''][^"''\r\n]{0,24}(TOKEN|SECRET|KEY)'

  - id: python-environ-alias-items-password-marker
    desc: Aliased env iteration uses password markers
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?is)environ\.items\(\).{0,220}["''][^"''\r\n]{0,24}(PASSWORD|CREDENTIAL)'

  # Artifactory/CI "reader" service accounts often expose
  # <PREFIX>_READER_USERNAME / <PREFIX>_READER_PASSWORD in the environment.
  - id: python-reader-username-env-suffix
    desc: Env key ends with _READER_USERNAME
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: literal
      kind: string
      regex: '_READER_USERNAME$'

  - id: python-reader-password-env-suffix
    desc: Env key ends with _READER_PASSWORD
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: literal
      kind: string
      regex: '_READER_PASSWORD$'

  - id: python-env-keyword-key
    desc: Python getenv name contains KEY
    crit: component
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        regex: '(?i)KEY'

  - id: python-env-keyword-token
    desc: Python getenv name contains TOKEN
    crit: component
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        regex: '(?i)TOKEN'

  - id: python-env-keyword-secret
    desc: Python getenv name contains SECRET
    crit: component
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        regex: '(?i)SECRET'

  - id: python-env-get-call
    desc: Python reads an environment variable
    crit: component
    conf: 0.8
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'

  - id: javascript-private-key-environment-variable
    desc: JavaScript private-key environment variable
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env(\.[A-Z0-9_]*PRIVATE_KEY|\[\s*["''][A-Z0-9_]*PRIVATE_KEY["'']\s*\])'

  - id: ssh-private-key-dup
    desc: SSH_PRIVATE_KEY environment variable
    if:
      type: text
      word: SSH_PRIVATE_KEY
  - id: jwt-secret
    desc: Reads JWT_SECRET from the process environment
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env(\.JWT_SECRET|\[\s*["'']JWT_SECRET["'']\s*\])'
  - id: session-secret
    desc: SESSION_SECRET environment variable
    if:
      type: text
      word: SESSION_SECRET
  - id: cookie-secret
    desc: COOKIE_SECRET environment variable
    if:
      type: text
      word: COOKIE_SECRET
  - id: root-password
    desc: ROOT_PASSWORD environment variable
    if:
      type: text
      word: ROOT_PASSWORD
  - id: admin-password
    desc: ADMIN_PASSWORD environment variable
    if:
      type: text
      word: ADMIN_PASSWORD
    unless:
      - id: metadata/build/scaffold::antlr-generated-parser
  - id: smbhash
    desc: SMBHASH environment variable
    crit: suspicious
    conf: 0.9
    attack: T1550.002
    if:
      type: text
      word: SMBHASH
      section: .rodata
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: service-account-key
    desc: SERVICE_ACCOUNT_KEY environment variable
    if:
      type: text
      word: SERVICE_ACCOUNT_KEY
  - id: aws-env-secret-vars
    desc: AWS credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^AWS_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: aws-secret-access-key-var
    # A bare name can occur in documentation or SDK guidance; it does not
    # establish that the program reads the credential.  Keep it as incomplete
    # evidence and let the access-specific atom below carry the behavior.
    desc: AWS secret-key environment name reference
    crit: component
    conf: 0.86
    if:
      type: text
      word: AWS_SECRET_ACCESS_KEY
  - id: aws-secret-access-key-var-encoded
    desc: Encoded AWS secret-key reference
    crit: component
    conf: 0.86
    if:
      type: encoded
      word: AWS_SECRET_ACCESS_KEY

  - id: python-aws-secret-access-key-env-read
    desc: Python reads AWS secret-key environment variable
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: AWS_SECRET_ACCESS_KEY

  - id: python-aws-secret-access-key-environ-read
    desc: Python indexes AWS secret-key env
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'os\.environ\s*\[\s*["'']AWS_SECRET_ACCESS_KEY["'']\s*\]'
  - id: shell-embedded-node-credential-env-read
    desc: Embedded credential env access
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: process.env.AWS_SECRET_ACCESS_KEY
  - id: shell-embedded-node-npm-token-read
    desc: Embedded NPM token env access
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: process.env.NPM_TOKEN
  - id: github-credentials
    desc: GitHub credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^(GITHUB_|GH_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: github-credentials-encoded
    desc: Encoded GitHub credential environment variables
    conf: 0.8
    if:
      type: encoded
      regex: (GITHUB_|GH_)[A-Z0-9_]*_(TOKEN|KEY|SECRET)
  - id: gitlab-credentials
    desc: GitLab credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^GITLAB_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: azure-credentials-dup
    desc: Azure credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^AZURE_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: google-credentials
    desc: Google credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^GOOGLE_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: docker-credentials
    desc: Docker credential environment variables
    conf: 0.8
    if:
      type: text
      regex: ^DOCKER_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: database-credentials-generic
    desc: Generic database credential variables
    conf: 0.8
    if:
      type: text
      regex: ^(DATABASE_|DB_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: database-credentials-redis
    desc: Redis database credential variables
    conf: 0.8
    if:
      type: text
      regex: ^REDIS_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: database-credentials-sql
    desc: SQL database credential variables
    conf: 0.8
    if:
      type: text
      regex: ^(POSTGRES_|MYSQL_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: database-credentials-nosql
    desc: MongoDB credential variables
    conf: 0.8
    if:
      type: text
      regex: ^MONGO_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: package-registry-credentials-npm
    desc: NPM/PyPI registry credentials
    conf: 0.7
    if:
      type: text
      regex: ^(NPM_|PYPI_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: package-registry-credentials-enterprise
    desc: Enterprise registry credentials
    conf: 0.7
    if:
      type: text
      regex: ^(NUGET_|ARTIFACTORY_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: chat-api-credentials
    desc: Chat/messaging API credentials
    conf: 0.7
    if:
      type: text
      regex: ^(SLACK_|DISCORD_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: ai-api-credentials
    desc: AI service API credentials
    conf: 0.7
    if:
      type: text
      regex: ^(OPENAI_|ANTHROPIC_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: payment-api-credentials-stripe
    desc: Stripe payment API credentials
    conf: 0.7
    if:
      type: text
      regex: ^STRIPE_.{0,50}_(TOKEN|KEY|SECRET)$
  - id: payment-api-credentials-messaging
    desc: Messaging service API credentials
    conf: 0.7
    if:
      type: text
      regex: ^(TWILIO_|SENDGRID_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: security-tool-credentials-scanning
    desc: Security scanning tool credentials
    conf: 0.7
    if:
      type: text
      regex: ^(SONAR_|SNYK_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: security-tool-credentials-vault
    desc: Vault/secrets management credentials
    conf: 0.7
    if:
      type: text
      regex: ^(VAULT_|HASHICORP_).{0,50}_(TOKEN|KEY|SECRET)$
  - id: service-credential-env-var
    desc: Reads secret-like credential env variable
    conf: 0.86
    for: [javascript, typescript]
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    if:
      type: text
      regex: 'process\.env\.[A-Z][A-Z0-9_]{0,40}_(PASSWORD|CLIENT_SECRET|API_KEY|AUTH_TOKEN)\b'
      not:
        - substr: CURLOPT_
        - substr: CURLINFO_
        # Public build-time variables are intentionally exposed to browser
        # bundles; they are not service-secret accesses.
        - regex: 'process\.env\.(NEXT_PUBLIC_|PUBLIC_|VITE_|EXPO_PUBLIC_|REACT_APP_)'
    unless:
      - id: metadata/lang/source::codegen-source-path
      - id: well-known/app/browser/google-web::official-google-web-asset
      - id: metadata/file/format/structured::sourcemap-sources-content

  - id: posix-env-token-name
    desc: Reads a TOKEN-named environment variable
    crit: notable
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        regex: '(?i)\b[A-Z0-9_]*TOKEN[A-Z0-9_]*\b'
  - id: system-env-token-name
    desc: System environment TOKEN variable
    crit: notable
    if:
      type: text
      regex: '(System\.getenv|GetEnvironmentVariable)\s*\([^)]{0,60}TOKEN'
  - id: keyword-secret
    desc: SECRET-named environment variable
    crit: notable
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.getenv|os\.environ\.get)$'
      arg:
        kind: string
        substr: SECRET
  - id: keyword-auth
    desc: Python reads AUTH-named environment variable
    crit: notable
    conf: 0.86
    for: [python]
    if:
      type: text
      regex: 'os\.(getenv|environ\.get)\s*\([^)]{0,60}AUTH'
  - id: keyword-pwd
    desc: PWD environment access expression
    crit: notable
    if:
      type: text
      # A bare PWD token in a shell-command vocabulary, help text, or a
      # generated library table is not credential access.  Require the Node or
      # Python environment API on the same expression.
      regex: '(process\.env|os\.(getenv|environ))[^;\n]{0,80}PWD'
    unless:
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
  - id: keyword-cred
    desc: CRED environment access pattern
    crit: notable
    if:
      type: text
      # Require an environment-access form; a protocol field named
      # CREDENTIALS is not an environment variable.
      regex: '(?i)\b(getenv|environ(\.get)?|process\.env)\b[^;\n]{0,40}\bCRED(ENTIALS)?\b'
    unless:
      - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
  - id: composer-auth-var-name
    desc: Composer credential environment variable
    conf: 0.9
    if:
      type: literal
      exact: COMPOSER_AUTH
  - id: python-github-token-env-read
    desc: Python reads GITHUB_TOKEN environment variable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: GITHUB_TOKEN
  - id: python-gh-token-env-read
    desc: Python reads GH_TOKEN environment variable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: GH_TOKEN
  - id: python-github-pat-env-read
    desc: Python reads GITHUB_PAT environment variable
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
      arg:
        kind: string
        exact: GITHUB_PAT

composite_rules:
  - id: python-environ-credential-keyword-filter
    desc: Python environment access uses credential-named keys
    crit: notable
    conf: 0.9
    for: [python]
    any:
      - id: python-env-keyword-key
      - id: python-env-keyword-token
      - id: python-env-keyword-secret

  - id: python-environ-items-credential-filter
    desc: Python env items credential filter
    crit: notable
    conf: 0.92
    for: [python]
    # Keep the credential marker in the loop/filter itself. A byte window also
    # joined an ordinary full-environment copy to an unrelated API-key
    # assignment several statements later.
    near_lines: 3
    all:
      - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
    any:
      - id: python-environ-items-secret-marker
      - id: python-environ-items-password-marker
    unless:
      # A `not in` test drops the named variables and keeps the rest, so the
      # credential word is what is being removed, not what is being selected.
      # agent-glovebox's test helpers build subprocess environments with
      # `{k: v for k, v in os.environ.items() if k not in ("GH_TOKEN",
      # "XDG_RUNTIME_DIR")}`, and reading that as a credential filter inverted
      # the meaning of the code.
      - id: micro-behaviors/os/env/vars/enumeration::python-environ-items-exclusion-filter

  - id: python-environ-alias-items-credential-filter
    desc: Aliased Python env entries are filtered for credentials
    crit: notable
    conf: 0.94
    for: [python]
    all:
      - id: micro-behaviors/os/env/vars/enumeration::environ-alias-items-loop
    any:
      - id: python-environ-alias-items-secret-marker
      - id: python-environ-alias-items-password-marker

  - id: python-environ-credential-name-filter
    desc: Python accesses credential-named environment entries
    crit: notable
    conf: 0.92
    for: [python]
    any:
      - id: python-environ-credential-filter
      - id: python-environ-items-credential-filter
      - id: python-environ-alias-items-credential-filter
      - id: python-environ-credential-keyword-filter

  - id: python-sensitive-env-read
    desc: Python reads credential-named environment variable
    crit: notable
    conf: 0.9
    for: [python]
    all:
      - id: python-env-get-call
    any:
      - id: python-env-keyword-key
      - id: python-env-keyword-secret
      - id: python-github-token-env-read
      - id: python-gh-token-env-read
      - id: python-github-pat-env-read
      - id: keyword-secret
      - id: keyword-auth
      - id: keyword-cred
    near_lines: 4
