# The variable name is credential evidence; the brokering objective separately
# requires an environment-access mechanic and a concrete token exchange.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: refresh-token-env-name
    desc: OAuth refresh-token environment variable
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '(?i)^[A-Z0-9_]*REFRESH_TOKEN$'
