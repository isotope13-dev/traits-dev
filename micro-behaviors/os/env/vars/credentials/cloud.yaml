defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: gcp-application-credentials-env-name
    desc: GOOGLE_APPLICATION_CREDENTIALS environment name
    crit: component
    conf: 0.88
    for: [elf, c, cpp, rust, go, python]
    if:
      type: text
      word: GOOGLE_APPLICATION_CREDENTIALS
  - id: gcp-cloud-keyfile-env-name
    desc: GOOGLE_CLOUD_KEYFILE_JSON environment name
    crit: component
    conf: 0.88
    for: [elf, c, cpp, rust, go, python]
    if:
      type: text
      word: GOOGLE_CLOUD_KEYFILE_JSON

  - id: azure-tenant-client-secret-env-names
    desc: Azure tenant/client-secret env names
    crit: notable
    conf: 0.94
    for: [go, elf]
    if:
      type: text
      regex: 'AZURE_TENANT_ID[\s\S]{0,120}AZURE_CLIENT_SECRET'

  - id: php-aws-secret-env-read
    desc: PHP reads AWS secret environment
    crit: notable
    conf: 0.92
    for: [php]
    if:
      type: text
      regex: '(?i)(env|getenv)\s*\(\s*["'']AWS_SECRET_ACCESS_KEY["'']\s*\)'

  - id: php-azure-secret-env-read
    desc: PHP reads Azure secret environment
    crit: notable
    conf: 0.92
    for: [php]
    if:
      type: text
      regex: '(?i)(env|getenv)\s*\(\s*["'']AZURE_CLIENT_SECRET["'']\s*\)'

  - id: python-gcp-app-creds-env-read
    desc: Python reads GCP credentials env var
    if:
      type: symbol
      kind: member
      exact: os.environ.GOOGLE_APPLICATION_CREDENTIALS
  - id: python-gcp-service-account-env-read
    desc: Python reads GCP service-account env var
    if:
      type: text
      regex: '(getenv|environ).{0,30}GCP_SERVICE_ACCOUNT'
  - id: python-azure-client-secret-env-read
    desc: Python reads Azure client secret env var
    if:
      type: symbol
      kind: member
      exact: os.environ.AZURE_CLIENT_SECRET

  # Relocated from objectives/exfiltration/cloud/object-store/, where reading the
  # name of a Cloudflare R2 key was filed as exfiltration.
  - id: r2-credential-env-name
    desc: R2 credential environment variable name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)R2_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)'

composite_rules:
  - id: php-cloud-secret-env-list
    desc: PHP reads AWS and Azure secrets
    crit: notable
    conf: 0.92
    for: [php]
    all:
      - id: php-aws-secret-env-read
      - id: php-azure-secret-env-read

  - id: gcp-credential-env-name
    desc: GCP credential environment variable name
    crit: component
    conf: 0.88
    any:
      - id: gcp-application-credentials-env-name
      - id: gcp-cloud-keyfile-env-name
