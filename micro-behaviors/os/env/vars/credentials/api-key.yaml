defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: python-api-key-env-read
  desc: Python reads API key env vars
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: '^(os\.)?(getenv|environ\.get)$'
    arg:
      kind: string
      regex: '(?i)(^|[_-])API[_-]?KEY($|[_-])'
- id: python-openai-anthropic-key-env-read
  desc: Python reads OpenAI or Anthropic API key
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: '^(os\.)?(getenv|environ\.get)$'
    arg:
      kind: string
      regex: '^(OPENAI_API_KEY|ANTHROPIC_API_KEY)$'
- id: python-azure-api-key-env-read
  desc: Python reads Azure API key environment variable
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: '^(os\.)?(getenv|environ\.get)$'
    arg:
      kind: string
      regex: '^(AZURE_OPENAI_API_KEY|AZURE_API_KEY)$'

composite_rules:
- id: python-ai-provider-key-env-read
  desc: Python reads an AI provider API key
  crit: notable
  conf: 0.95
  any:
  - id: python-openai-anthropic-key-env-read
  - id: python-azure-api-key-env-read
