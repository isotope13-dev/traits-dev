defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable

traits:
  - id: process-env-token-name
    desc: JavaScript process.env credential token variable
    conf: 0.7
    if:
      type: tree-sitter
      kind: member
      # Require the singular TOKEN word so settings such as *_TOKENS are not
      # mistaken for credential reads.
      regex: 'process\.env(\.[A-Z0-9_]*TOKEN\b|\[[^]]*TOKEN\b[^]]*\])'

  - id: javascript-credential-env-read
    desc: JavaScript reads a credential env var
    conf: 0.85
    if:
      type: tree-sitter
      kind: member
      regex: 'process\.env\.\w*(API[_-]?KEY|TOKEN|SECRET|PRIVATE[_-]?KEY)\b'
      case_insensitive: true
