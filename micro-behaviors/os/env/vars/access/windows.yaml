defaults:
  for:
    - pe
    - powershell
    - batch
    - vbs
  platforms:
    - windows
traits:
  - id: comspec-env-var
    desc: Accesses ComSpec environment variable
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: (?i)comspec
  - id: temp-env-var
    desc: Contains %TEMP% environment variable string
    crit: baseline
    if:
      type: text
      substr: '%TEMP%'
      case_insensitive: true
  # Canonical %APPDATA% / Environ("APPDATA") atom for every Windows language.
  # The roaming and local profile directories are where installers,
  # uninstallers and stagers alike keep per-user state, so naming one is a real
  # behavioural fact -- but on its own it is still only an environment read,
  # which is why the copies under objectives/command-and-control/dropper/
  # builder/ ("%appdata% reference", "%%appdata%% reference") were removed.
  - id: appdata-path-lookup
    desc: AppData environment lookup
    crit: notable
    conf: 0.85
    for: [scripts, oledoc, ooxml, pe, dll]
    if:
      type: text
      regex: '(?i)Environ\(\s*"(APPDATA|LOCALAPPDATA)"\s*\)|%APPDATA%'
  - id: getenv-profiling-api
    desc: GetEnvironmentVariable profiler check
    crit: component
    conf: 0.86
    for: [pe, dll, csharp]
    if:
      type: text
      regex: 'GetEnvironmentVariable(A|W)?'
    unless:
    - id: metadata/lang/compiler/systems::go-buildinfo
    - id: well-known/app/drivers::ngx-dll-basename
