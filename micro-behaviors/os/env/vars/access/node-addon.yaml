# Node.js Addon Environment Variable Checks
# Detects native addons that use Node-specific environment variables to
# control diagnostics or other runtime behavior.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: node-addon-quiet-check
    desc: Checks NODE_ADDON_QUIET logging control
    crit: notable
    conf: 0.92
    if:
      type: text
      word: NODE_ADDON_QUIET
  - id: node-debug-check
    desc: NODE_DEBUG environment variable check
    crit: notable
    conf: 0.75
    if:
      type: text
      word: NODE_DEBUG
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/signed/platform/

composite_rules:
  - id: node-addon-environment-control
    desc: Native addon behavior controlled by a Node environment variable
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/framework::node-api-addon-export
    any:
      - id: node-addon-quiet-check
      - id: node-debug-check
    unless:
      - id: well-known/tool/reverse-engineering/frida/
