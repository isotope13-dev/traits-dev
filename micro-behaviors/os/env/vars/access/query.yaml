defaults:
  platforms:
    - unix
    - windows
  for: [scripts]
  crit: notable
  conf: 0.6
  attack: T1082
traits:
  - id: printenv
    desc: printenv command
    if:
      type: text
      substr: printenv
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - id: well-known/lib/ui/highlight-js::bundled-library
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
      - id: metadata/library/syntaxhighlighter::prismjs-core
      # prism-bash.js is a shell *grammar*: it lists every builtin as a
      # highlight keyword and names Prism only in its IIFE footer.
      - id: metadata/library/syntaxhighlighter::prismjs-language-component
      # HTML docs/wiki list the command; shell scripts that invoke it still match.
      - id: metadata/file/profile/identity::static-html-shell
      - id: metadata/file/profile/identity::generated-documentation-page
  - id: env-cmd
    desc: Runs a command through /usr/bin/env
    if:
      type: text
      regex: '(?m)(^|[;&|][ \t]*)/usr/bin/env([ \t]|$)'
    unless:
      - id: metadata/package/files/bsd::pkgsrc-maintainer-script
      - id: well-known/lib/ui/highlight-js::bundled-library
  - id: env-cmd-bare
    desc: Runs env to list environment variables
    crit: component
    conf: 0.5
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*env\s*$|^\s*env\s+-[A-Za-z-]{1,40}\s*$'
    not:
      - substr: "#!/usr/bin/env"
      - substr: "/node_gyp_bins/python3"
      - substr: findTool(desc, commandList)
      - substr: apply env-specific formatting (colors, etc.)
      - substr: "whoami\n            env\n            freebsd-version"
    unless:
      - type: text
        regex: 'env\s+[A-Za-z_][A-Za-z0-9_]*='
      - type: basename
        exact: configure
      - id: metadata/file/extension/identity::autotools-configure-basename
      - type: basename
        exact: Makefile
        case_insensitive: true

composite_rules:
  - id: env-command-query
    desc: Runs command to list environment
    crit: notable
    conf: 0.8
    any:
      - id: env-cmd
      - id: env-cmd-bare
