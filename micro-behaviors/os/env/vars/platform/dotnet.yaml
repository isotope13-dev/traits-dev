defaults:
  platforms: [windows]
  for: [pe, dll, csharp]

traits:
  - id: dotnet-profiling-env-name
    desc: .NET profiling environment variable name
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: _ENABLE_PROFILING
    unless:
      - id: metadata/binary/framework::dotnet-singlefilehost-pdb
      - id: well-known/lib/runtime/dotnet-runtime::coreclr-runtime-context
