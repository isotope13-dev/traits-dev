defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96

traits:
  - id: native-host-identity-marker-cluster
    desc: Native host and user environment markers
    attack: T1082
    if:
      type: raw
      regex: 'COMPUTERNAME.{0,32}HOSTNAME.{0,32}USERNAME.{0,32}LOCALAPPDATA'
      case_insensitive: true
