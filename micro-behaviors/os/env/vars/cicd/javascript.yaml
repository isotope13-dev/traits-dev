# CI/CD Environment Variable Targeting - JavaScript/Node.js
# Detects access to CI/CD runner environment variables in npm packages
# ATT&CK: T1082 (System Information Discovery)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.75
traits:
  # GitHub Actions runner variables via process.env
  - id: process-env-runner-name
    desc: process.env.RUNNER_NAME access
    conf: 0.85
    if:
      type: text
      regex: "process\\.env\\.RUNNER_NAME"
  - id: process-env-runner-os
    desc: Reads RUNNER_OS CI variable
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\.RUNNER_OS"
  - id: process-env-github-actions
    desc: Reads GITHUB_ACTIONS CI variable
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\.GITHUB_ACTIONS"
  - id: process-env-github-repository
    desc: Reads GITHUB_REPOSITORY CI variable
    conf: 0.78
    if:
      type: text
      regex: "process\\.env\\.GITHUB_REPOSITORY"
  - id: process-env-github-run-id
    desc: Reads GITHUB_RUN_ID CI variable
    conf: 0.78
    if:
      type: symbol
      kind: member
      exact: process.env.GITHUB_RUN_ID
  - id: process-env-ci-job-id
    desc: Reads CI_JOB_ID CI variable
    conf: 0.78
    if:
      type: symbol
      kind: member
      exact: process.env.CI_JOB_ID
  - id: process-env-ci-project-name
    desc: Reads CI_PROJECT_NAME CI variable
    conf: 0.78
    if:
      type: symbol
      kind: member
      exact: process.env.CI_PROJECT_NAME
  - id: process-env-ci
    desc: Reads CI environment flag
    conf: 0.75
    if:
      type: text
      regex: "process\\.env\\.CI\\b"
  # The property `ci-info` exports, read directly rather than through
  # process.env. Relocated from objectives/anti-analysis/sandbox-detect, where
  # its name, ATT&CK T1497 tag and directory claimed sandbox evasion for what
  # is a CI-vs-local branch in npm, jest, eslint and Next.js telemetry.
  - id: ci-info-isci-property
    desc: Reads the ci-info isCI flag
    conf: 0.85
    if:
      type: text
      word: isCI
  - id: process-env-jenkins-prefix
    desc: Reads Jenkins CI environment variables
    conf: 0.8
    if:
      type: text
      substr: process.env.JENKINS_
  # Bracket notation access (evasion technique)
  - id: process-env-bracket-runner
    desc: process.env bracket access for runner vars
    conf: 0.85
    if:
      type: text
      regex: "process\\.env\\[[\"']RUNNER_"
  - id: process-env-bracket-github
    desc: process.env bracket access for github vars
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\[[\"']GITHUB_"
  - id: github-actions-gated-fetch
    desc: CI variable near JavaScript fetch call
    conf: 0.9
    if:
      type: text
      regex: 'GITHUB_ACTIONS[\s\S]{0,200}\bfetch\s*\('
  - id: travis-gated-fetch
    desc: Travis CI condition guards fetch call
    conf: 0.9
    if:
      type: tree-sitter
      kind: conditional
      regex: '\bTRAVIS(_|$|\b)[\s\S]{0,200}\bfetch\s*\('
  - id: process-env-ci-project-path
    desc: Reads CI_PROJECT_PATH CI variable
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\.CI_PROJECT_PATH"
  - id: process-env-buildkite-org-slug
    desc: Reads BUILDKITE_ORGANIZATION_SLUG CI variable
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\.BUILDKITE_ORGANIZATION_SLUG"
  - id: process-env-circle-project-username
    desc: Reads CIRCLE_PROJECT_USERNAME CI variable
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\.CIRCLE_PROJECT_USERNAME"
  - id: process-env-codespace-name
    desc: Reads CODESPACE_NAME environment variable
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\.CODESPACE_NAME"
  - id: process-env-gitpod-workspace-context-url
    desc: Reads GITPOD_WORKSPACE_CONTEXT_URL env var
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\.GITPOD_WORKSPACE_CONTEXT_URL"
  - id: process-env-system-collectionuri
    desc: Reads SYSTEM_COLLECTIONURI CI variable
    conf: 0.8
    if:
      type: text
      regex: "process\\.env\\.SYSTEM_COLLECTIONURI"
composite_rules:
  - id: node-multi-ci-project-identity
    desc: Reads multiple CI/cloud-dev project identity variables
    crit: suspicious
    conf: 0.94
    needs: 3
    any:
      - id: process-env-github-repository
      - id: process-env-ci-project-path
      - id: process-env-buildkite-org-slug
      - id: process-env-circle-project-username
      - id: process-env-codespace-name
      - id: process-env-gitpod-workspace-context-url
      - id: process-env-system-collectionuri
