# CI-provider environment-variable names embedded in a compiled binary. These
# stay neutral: a CI-detection library, a build tool, or a runner agent
# enumerates exactly these names, and the sibling script rules were already
# burned once by treating the names themselves as evasion (see ruby.yaml).
# Intent lives in the composites that pair this cluster with an actual
# anti-analysis check.
#
# ELF and Mach-O were missing: the rule was Windows-only, so a Linux implant
# carrying the same provider blocklist -- to abort inside build and analysis
# pipelines -- matched nothing.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, macho]
  crit: notable
  conf: 0.96

traits:
  - id: native-ci-provider-marker-a
    desc: Native binary embeds two CI provider markers
    attack: T1497.001
    if:
      type: raw
      regex: 'GITHUB_ACTIONS.{0,64}(GITLAB_CI|JENKINS_HOME)'
      case_insensitive: true

  - id: native-ci-provider-marker-b
    desc: Native binary embeds another CI marker pair
    attack: T1497.001
    if:
      type: raw
      regex: '(TRAVIS|CIRCLECI|CODEBUILD).{0,64}(APPVEYOR|TEAMCITY)'
      case_insensitive: true

composite_rules:
  - id: native-ci-provider-marker-cluster
    desc: Native binary embeds a multi-CI marker set
    crit: notable
    conf: 0.98
    all:
      - id: native-ci-provider-marker-a
      - id: native-ci-provider-marker-b
