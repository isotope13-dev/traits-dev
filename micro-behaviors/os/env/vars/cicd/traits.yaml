defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.75
traits:
  - id: runner-name
    desc: RUNNER_NAME environment variable access
    conf: 0.85
    if:
      type: text
      exact: RUNNER_NAME
  - id: runner-os
    desc: RUNNER_OS environment variable access
    conf: 0.8
    if:
      type: text
      exact: RUNNER_OS
  - id: runner-arch
    desc: RUNNER_ARCH environment variable access
    conf: 0.8
    if:
      type: text
      exact: RUNNER_ARCH
  - id: runner-temp
    desc: RUNNER_TEMP environment variable access
    conf: 0.75
    if:
      type: text
      exact: RUNNER_TEMP
  - id: github-actor
    desc: GITHUB_ACTOR environment variable
    conf: 0.7
    if:
      type: text
      exact: GITHUB_ACTOR
  - id: github-repository
    desc: GITHUB_REPOSITORY environment variable
    conf: 0.7
    if:
      type: text
      exact: GITHUB_REPOSITORY
  - id: github-workflow
    desc: GITHUB_WORKFLOW environment variable
    conf: 0.7
    if:
      type: text
      exact: GITHUB_WORKFLOW
  - id: github-actions-flag
    desc: GITHUB_ACTIONS runtime flag
    conf: 0.85
    for: [shell, python, javascript, typescript, ruby, go, binaries]
    if:
      type: text
      word: GITHUB_ACTIONS
  - id: github-env-file
    desc: GITHUB_ENV environment file
    conf: 0.85
    for: [shell, python, javascript, typescript, ruby, go, binaries]
    if:
      type: text
      regex: '\bGITHUB_ENV\b|["`]GITHUB["`]\s*,\s*["`]_ENV["`]'
  - id: github-path-file
    desc: GITHUB_PATH environment file
    conf: 0.85
    for: [shell, python, javascript, typescript, ruby, go, binaries]
    if:
      type: text
      regex: '\bGITHUB_PATH\b|["`]GITHUB["`]\s*,\s*["`]_PATH["`]'
  - id: multi-ci-provider-env-refs--gitlab
    desc: CI provider environment reference (GITLAB_CI)
    conf: 0.92
    for: [shell, python, javascript, typescript, go, binaries]
    if:
      type: text
      word: GITLAB_CI
  - id: multi-ci-provider-env-refs--jenkins
    desc: CI provider environment reference (JENKINS_URL)
    conf: 0.92
    for: [shell, python, javascript, typescript, go, binaries]
    if:
      type: text
      word: JENKINS_URL
  - id: multi-ci-provider-env-refs--circleci
    desc: CI provider environment reference (CIRCLECI)
    conf: 0.92
    for: [shell, python, javascript, typescript, go, binaries]
    if:
      type: text
      word: CIRCLECI
  - id: multi-ci-provider-env-refs--travis
    desc: CI provider environment reference (TRAVIS)
    conf: 0.92
    for: [shell, python, javascript, typescript, go, binaries]
    if:
      type: text
      word: TRAVIS
  - id: multi-ci-provider-env-refs--buildkite
    desc: CI provider environment reference (BUILDKITE)
    conf: 0.92
    for: [shell, python, javascript, typescript, ruby, go, binaries]
    if:
      type: text
      word: BUILDKITE
composite_rules:
  - id: multi-ci-provider-env-refs
    desc: Multiple CI provider environment references
    conf: 0.92
    for: [shell, python, javascript, typescript, ruby, go, binaries]
    any:
      - id: github-actions-flag
      - id: multi-ci-provider-env-refs--gitlab
      - id: multi-ci-provider-env-refs--jenkins
      - id: multi-ci-provider-env-refs--circleci
      - id: multi-ci-provider-env-refs--travis
      - id: multi-ci-provider-env-refs--buildkite
      - id: micro-behaviors/os/env/vars/cicd::ruby-ci-provider-env-refs
  - id: github-context-access
    desc: GitHub Actions context access
    crit: notable
    conf: 0.8
    any:
      - id: github-actor
      - id: github-repository
      - id: github-workflow
