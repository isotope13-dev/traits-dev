defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: os-environ-alias-import
    desc: Imports os.environ under a local alias
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*from[ \t]+os[ \t]+import[ \t]+.{0,80}\benviron\b'

  - id: environ-alias-items-call
    desc: Calls items() on an os.environ alias
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: environ.items

composite_rules:
  - id: environ-alias-items-loop
    desc: Iterates over aliased os.environ entries
    crit: notable
    conf: 0.92
    all:
      - id: os-environ-alias-import
      - id: environ-alias-items-call
