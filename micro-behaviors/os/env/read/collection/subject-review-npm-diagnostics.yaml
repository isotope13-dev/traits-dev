defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  crit: notable
composite_rules:
  - id: node-nondiagnostic-environment-source
    desc: Non-diagnostic environment value access
    conf: 0.95
    any:
      - id: micro-behaviors/os/env/read/variable::node-env-access-outside-key-k-scoped
      - id: micro-behaviors/os/env/read/collection::node-process-env-alias
      - id: micro-behaviors/os/env/read/collection::node-process-env-object-copy
      - id: micro-behaviors/os/env/read/collection::node-process-env-object-field
      - id: micro-behaviors/os/env/read/variable::node-env-text-outside-npm-context-ci-markers
