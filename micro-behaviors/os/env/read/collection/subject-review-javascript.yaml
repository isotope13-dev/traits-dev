defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-filtered-env-copy
    desc: Filters and copies process.env values
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Object\.keys\s*\(\s*process\.env\s*\)\s*\.filter[\s\S]{0,900}\bprocess\.env\s*\['

  - id: node-process-env-alias
    desc: Assigns full Node environment to alias
    crit: notable
    conf: 0.9
    if:
      type: text
      # A named member or computed entry is one setting, not a copy of the
      # complete environment.  Keep the alias atom for the object itself.
      # Optional chaining is still a named-member read (`process.env?.KEY`),
      # not an alias of the environment object.
      regex: '(const|let|var)\s+\w+\s*=\s*process[.]env($|[^.?\[])'
  - id: node-process-env-object-copy
    desc: Copies full Node environment into object
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'Object\.assign\s*\(\s*\{\s*\}\s*,\s*process\.env\s*\)'
  - id: node-process-env-object-field
    desc: Places full Node environment in object field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*:\s*process\.env[^.\[\w$]'
    unless:
      - id: metadata/file/format/record-sequence::hashed-text-record

      - id: metadata/lang/scripted::dts-declaration-file
  # The obfuscated spelling of the same dump: `Object.keys(process["env"])`
  # enumerates every entry through computed access exactly as
  # `Object.keys(process.env)` does, and hex-packed stealers use it because
  # the plain spelling is signature content.
  - id: node-computed-env-collection
    desc: Enumerates Node environment, computed access
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Object\.keys\s*\(\s*process\s*\[\s*[''"]env[''"]\s*\]\s*\)'
