defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin]
traits:
  - id: java-environment-entry-map-copy
    desc: Java copies environment map entry values
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'System\.getenv\(\)\.entrySet\(\)[\s\S]{0,260}\.getValue\(\)'
