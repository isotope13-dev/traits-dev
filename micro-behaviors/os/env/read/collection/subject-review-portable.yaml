defaults:
  platforms: [windows, unix]
  for: [c, cpp, elf, pe]
traits:
  - id: js-env-index-copy-to-object
    desc: JavaScript copies process.env entry
    crit: component
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: '\w+\s*\[\s*\w+\s*\]\s*=\s*process\.env\s*\[\s*\w+\s*\]'
  - id: python-environ-sensitive-filter
    desc: Python filters sensitive environment keys
    crit: notable
    conf: 0.86
    for: [python]
    ref: sha256:7c8adc80c7efc628483693598c7827bbc1529a0e1fd87d7cdd5ff6af889c008f
    if:
      type: text
      substr: sensitive_keywords = ["KEY", "TOKEN", "SECRET"
composite_rules:
  - id: python-filtered-environ-copy
    desc: Python copies filtered environment values
    crit: notable
    conf: 0.9
    for:
      - python
    ref: sha256:7c8adc80c7efc628483693598c7827bbc1529a0e1fd87d7cdd5ff6af889c008f
    all:
      - id: micro-behaviors/os/env/enumerate::python-environ-items-loop
      - id: micro-behaviors/os/env/read/collection::python-environ-sensitive-filter
      - id: "metadata/lang/source/syntax/assignment/member::python-env-credential-named-mapping-assignment"
