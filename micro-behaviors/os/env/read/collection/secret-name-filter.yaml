# Shell that dumps the whole environment and keeps only credential-named
# variables, and shell that loads a project .env into the environment first.
defaults:
  platforms: [unix, windows]
  for: [markdown, shell, text]
  conf: 0.9

traits:
  - id: env-dump-piped-to-grep
    desc: Environment dump piped into grep
    crit: component
    if:
      type: text
      regex: '\b(env|printenv|set|export\s+-p)\s*\|\s*grep\b'

  - id: grep-two-secret-name-terms
    desc: grep pattern names two secret terms
    crit: component
    if:
      type: text
      regex: '(?i)grep\b[^\n]{0,40}(TOKEN|SECRET|PASSW|API_?KEY)[^\n]{0,60}(TOKEN|SECRET|PASSW|KEY)'
    not:
      - regex: '(?i)\bgrep\b[^\n]{0,30}(\s+-[a-z]*v|--invert-match)'

  - id: dotenv-exported-into-shell
    desc: Shell exports every .env assignment
    crit: notable
    if:
      type: text
      regex: '\bexport\s+\$\(\s*(grep|cat|sed)\b[^)\n]{0,60}\.env\b[^)\n]{0,40}\|\s*xargs'

composite_rules:
  - id: env-dump-filtered-to-secret-names
    desc: Env dump filtered to secret names
    crit: notable
    near_lines: 1
    all:
      - id: env-dump-piped-to-grep
      - id: grep-two-secret-name-terms
