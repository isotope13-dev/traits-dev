defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  - id: node-cicd-payload-fields
    desc: Payload object reads CI repository environment
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: text
      regex: 'payload\s*=\s*\{[\s\S]{0,700}process\.env\.CI[\s\S]{0,180}process\.env\.GITHUB_REPOSITORY'
