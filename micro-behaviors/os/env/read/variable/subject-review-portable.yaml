defaults:
  platforms: [windows, unix]
  for: [c, cpp, elf, pe]
traits:
  - id: getenv
    desc: getenv function (read environment variable)
    crit: baseline
    conf: 0.3
    if:
      type: symbol
      regex: (^|\.)getenv$
    downgrade:
      any:
        - id: micro-behaviors/fs/path/system/library::wininet-dll-name-reference
  - id: js-process-env-optional-trim-read
    desc: JavaScript process.env optional trim read
    crit: baseline
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env\.[A-Z0-9_]+\?\.trim\(\)'
composite_rules:
  - id: env-access-comp
    desc: Environment variable access functions
    crit: baseline
    conf: 0.4
    any:
      - id: micro-behaviors/os/env/read/variable::getenv
      - id: micro-behaviors/os/env/write::setenv
      - id: micro-behaviors/os/env/write::putenv
      - id: micro-behaviors/os/env/write::unsetenv
      - id: micro-behaviors/os/env/enumerate/
      - id: micro-behaviors/os/env/report/
      - id: micro-behaviors/os/env/procfs/

      - id: micro-behaviors/os/env/read/named::getenv-home
