defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-env-near-filter-or-match-text
    desc: Environment access beside filter/match text
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'process\.env.{0,40}(filter|match)|(filter|match).{0,40}process\.env'
