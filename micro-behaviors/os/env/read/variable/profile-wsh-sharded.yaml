defaults:
  platforms: [windows]
  for: [javascript, text, data]
composite_rules:
  - id: wsh-env-cjk-fragment-clues
    for: [javascript]
    desc: WSH environment and CJK fragment clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
      - id: metadata/lang/source/literal/fragment/single::x-dollar-en-fragment
      - id: micro-behaviors/os/env/read/variable::wsh-process-environment-split
      - id: metadata/lang/source/literal/fragment/single::cjk-offset-fragment-alternatives
    any:
      - id: metadata/lang/source/literal/fragment/single::env-du-text-fragment
      - id: metadata/lang/source/literal/fragment/sequence::minus-19-968-text-fragments
      - id: metadata/lang/source/literal/fragment/sequence::split-aesmanaged-text
      - id: metadata/lang/source/literal/fragment/single::smana-text-fragment
      - id: metadata/lang/source/literal/fragment/single::y-ae-text-fragment
      - id: metadata/lang/source/literal/fragment/sequence::split-gzipstream-text
      - id: metadata/lang/source/literal/fragment/single::ipst-text-fragment
      - id: metadata/lang/source/literal/fragment/sequence::gzip-compre-text-fragments
      - id: metadata/lang/source/literal/fragment/single::deco-text-fragment
      - id: metadata/lang/source/literal/fragment/sequence::split-assembly-load-text
      - id: metadata/lang/source/literal/fragment/single::embly-text-fragment
      - id: metadata/lang/source/naming/action/token::load-symbol-token
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-assembly-load-text
      - id: metadata/lang/source/literal/fragment/single::voke-text-fragment
      - id: metadata/lang/source/literal/fragment/sequence::fragmented-entrypoint-invoke-text
      - id: micro-behaviors/os/handler/open::shellexecute-method-reference
      - id: metadata/lang/source/literal/fragment/single::conho-text-fragment
      - id: metadata/lang/source/literal/fragment/single::l-ex-text-fragment
      - id: metadata/lang/source/literal/fragment/sequence::split-conhost-powershell-text
      - id: metadata/lang/source/literal/fragment/sequence::hidden-noninteractive-flag-fragments
      - id: metadata/lang/source/literal/fragment/single::ypass-text-fragment
      - id: metadata/lang/source/literal/fragment/sequence::window-noprofile-text-fragments
    needs: 3
  - id: wsh-env-cjk-sharded-fragment-clues
    for: [javascript]
    desc: WSH environment and CJK sharded clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
      - id: metadata/lang/source/literal/fragment/single::ex-dollar-e-fragment
      - id: micro-behaviors/os/env/read/variable::wsh-process-environment-split
      - id: metadata/lang/source/literal/fragment/single::cjk-offset-fragment-alternatives
    any:
      - id: metadata/lang/source/literal/fragment/sequence::sharded-aesmanaged-text
      - id: metadata/lang/source/literal/fragment/sequence::sharded-gzipstream-text
      - id: metadata/lang/source/literal/fragment/single::embly-text-fragment
      - id: metadata/lang/source/literal/fragment/sequence::sharded-assembly-load-text
      - id: metadata/lang/source/literal/fragment/sequence::sharded-entrypoint-invoke-text
      - id: micro-behaviors/os/handler/open::shellexecute-method-reference
      - id: metadata/lang/source/literal/fragment/sequence::sharded-conhost-powershell-text
      - id: metadata/lang/source/literal/fragment/sequence::hidden-noprofile-bypass-fragments
    needs: 4
