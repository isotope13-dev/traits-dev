defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-os-getenv-call
    desc: Python reads an environment variable
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?(getenv|environ\.get)$'
    unless:
      - id: metadata/build/xcode::xcode-platform-args-build-context
