defaults:
  for: [javascript]
  platforms: [windows]
composite_rules:
  - id: wsh-named-environment-reader
    desc: WSH-related and named environment read text co-occur
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/os/env/read/variable::wsh-named-environment-item-reader
      - id: micro-behaviors/os/env/read/variable::wsh-named-environment-expansion-reader
  - id: wsh-named-environment-item-reader
    desc: WSH Environment method and named Item reference nearby
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/env/read/variable::wsh-environment-method-text
      - id: micro-behaviors/os/env/read/variable::env-item-named-variable
    near_lines: 8
  - id: wsh-named-environment-expansion-reader
    desc: ActiveX construction and named environment expansion co-occur
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/os/env/read/variable::expandenv-named-variable
