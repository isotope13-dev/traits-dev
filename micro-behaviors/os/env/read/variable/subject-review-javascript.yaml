defaults:
  platforms: [windows, unix]
traits:
  - id: process-env
    desc: Node process.env access
    crit: baseline
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      substr: process.env
  # Keeping the complete environment under an alias is distinct from reading
  # one named setting: later payload construction can avoid the direct
  # `process.env` spelling while retaining every environment entry.
  - id: javascript
    desc: Access environment variables
    crit: baseline
    conf: 0.8
    for: [javascript, typescript]
    if:
      # Migrated from a tree-sitter query (member_expression `process.env`
      # + subscript_expression `process["env"]`). filefacts normalizes both
      # forms — `process.env` and `process["env"]` — to the same `member`
      # chain `process.env`, so one `kind: member` match covers both without
      # the per-member tree-sitter cursor walk. Anchored so `process.env` and
      # `process.env.SECRET` match but `process.environment` does not.
      type: symbol
      kind: member
      regex: '^process\.env(\.|$)'

  - id: wsh-process-environment
    desc: WSH process environment access
    crit: notable
    conf: 0.9
    for: [javascript, vbs]
    platforms: [windows]
    if:
      type: text
      regex: 'Environment\s*\(.{0,24}Proc.{0,12}ess'
  - id: wsh-process-environment-split
    desc: Split-join WSH process environment access
    crit: notable
    conf: 0.92
    for: [javascript, vbs]
    platforms: [windows]
    if:
      type: text
      regex: 'Environment\s*\(\s*\[["'']Pro["''].{0,32}["'']cess["'']'
  - id: wsh-environment-symbol
    desc: WSH Environment method access
    crit: notable
    conf: 0.86
    for: [javascript, vbs]
    platforms: [windows]
    if:
      type: text
      # `.Environment` is also a common JavaScript constructor name (for
      # example, nunjucks.Environment).  Require the WSH Shell object and the
      # method call so ordinary library APIs do not become WSH findings.
      regex: 'WScript\.Shell[^\n]{0,83}\.Environment\s*\('
  - id: wsh-expand-environment-strings-call
    desc: Calls WSH ExpandEnvironmentStrings
    crit: notable
    conf: 0.9
    for: [javascript, vbs]
    platforms: [windows]
    if:
      type: symbol
      regex: '\.ExpandEnvironmentStrings$'
  - id: expandenv-named-variable
    desc: ExpandEnvironmentStrings named-variable call
    crit: notable
    conf: 0.88
    for: [javascript]
    platforms: [windows]
    if:
      type: text
      regex: 'ExpandEnvironmentStrings\s*\(\s*["'']%[A-Za-z0-9_]{8,24}%["'']\s*\)'
      case_insensitive: true
    not:
      - regex: '(?i)ALLUSERSPROFILE'
      - regex: '(?i)APPDATA'
      - regex: '(?i)COMMONPROGRAMFILES'
      - regex: '(?i)COMPUTERNAME'
      - regex: '(?i)COMSPEC'
      - regex: '(?i)HOMEDRIVE'
      - regex: '(?i)HOMEPATH'
      - regex: '(?i)LOCALAPPDATA'
      - regex: '(?i)LOGONSERVER'
      - regex: '(?i)NUMBER_OF_PROCESSORS'
      - regex: '(?i)ONEDRIVE'
      - regex: '(?i)OS'
      - regex: '(?i)PATHEXT'
      - regex: '(?i)PROCESSOR_ARCHITECTURE'
      - regex: '(?i)PROCESSOR_IDENTIFIER'
      - regex: '(?i)PROCESSOR_LEVEL'
      - regex: '(?i)PROCESSOR_REVISION'
      - regex: '(?i)PROGRAMDATA'
      - regex: '(?i)PROGRAMFILES'
      - regex: '(?i)PUBLIC'
      - regex: '(?i)SYSTEMDRIVE'
      - regex: '(?i)SYSTEMROOT'
      - regex: '(?i)TEMP'
      - regex: '(?i)TMP'
      - regex: '(?i)USERDOMAIN'
      - regex: '(?i)USERDOMAIN_ROAMINGPROFILE'
      - regex: '(?i)USERNAME'
      - regex: '(?i)USERPROFILE'
      - regex: '(?i)WINDIR'
  - id: env-item-named-variable
    desc: Environment Item named-variable reference
    crit: notable
    conf: 0.84
    for: [javascript]
    platforms: [windows]
    if:
      type: text
      regex: '\.Item\s*\(\s*["''][A-Za-z0-9_]{8,24}["'']\s*\)'
      case_insensitive: true
    not:
      - regex: '(?i)ALLUSERSPROFILE'
      - regex: '(?i)APPDATA'
      - regex: '(?i)COMMONPROGRAMFILES'
      - regex: '(?i)COMPUTERNAME'
      - regex: '(?i)COMSPEC'
      - regex: '(?i)HOMEDRIVE'
      - regex: '(?i)HOMEPATH'
      - regex: '(?i)LOCALAPPDATA'
      - regex: '(?i)LOGONSERVER'
      - regex: '(?i)NUMBER_OF_PROCESSORS'
      - regex: '(?i)ONEDRIVE'
      - regex: '(?i)OS'
      - regex: '(?i)PATHEXT'
      - regex: '(?i)PROCESSOR_ARCHITECTURE'
      - regex: '(?i)PROCESSOR_IDENTIFIER'
      - regex: '(?i)PROCESSOR_LEVEL'
      - regex: '(?i)PROCESSOR_REVISION'
      - regex: '(?i)PROGRAMDATA'
      - regex: '(?i)PROGRAMFILES'
      - regex: '(?i)PUBLIC'
      - regex: '(?i)SYSTEMDRIVE'
      - regex: '(?i)SYSTEMROOT'
      - regex: '(?i)TEMP'
      - regex: '(?i)TMP'
      - regex: '(?i)USERDOMAIN'
      - regex: '(?i)USERDOMAIN_ROAMINGPROFILE'
      - regex: '(?i)USERNAME'
      - regex: '(?i)USERPROFILE'
      - regex: '(?i)WINDIR'
  - id: wsh-environment-object
    desc: WSH Environment object retrieval
    crit: notable
    conf: 0.95
    for: [javascript, vbs, html]
    platforms: [windows]
    if:
      type: text
      case_insensitive: true
      regex: '(?i)\b[A-Za-z_$][\w$]*\.Environment\s*\(\s*["''](USE|PRO|SYS)[A-Za-z"''\s+]*\)'
  - id: wsh-environment-method-text
    desc: Calls the WSH Environment method
    crit: notable
    conf: 0.9
    for: [javascript, vbs]
    platforms: [windows]
    if:
      type: text
      # A receiver named `x` plus `.Environment()` is not enough: ordinary
      # JavaScript libraries use Environment as a constructor.  WSH exposes
      # the User/Process/System environment collections by these arguments.
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.Environment\s*\(\s*["''](User|Process|System)["'']'
  - id: wsh-environment-computed-arg
    desc: WSH Environment call takes computed argument
    crit: notable
    conf: 0.9
    for: [javascript, vbs]
    platforms: [windows]
    if:
      type: text
      # Companion to the literal above for obfuscated droppers, which compute
      # the collection name -- an IIFE returning it, or a decoder call --
      # instead of writing "Process" literally.  A bare variable or an empty
      # argument list still does not match, keeping constructor-like uses out.
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.Environment\s*\(\s*(\(\s*function\b|[A-Za-z_$][\w$]*\s*\()'
