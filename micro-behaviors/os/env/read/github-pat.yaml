# Reading one configured token is a neutral sensitive-data capability.
# Export and remote-control claims belong in consumers that require sinks.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - shell
traits:
- id: node-github-pat-environment-access
  desc: Node GITHUB_PAT access text
  crit: notable
  conf: 0.82
  if:
    type: text
    # Keep the identifier boundary explicit: GITHUB_PAT is a prefix of the
    # GitHub Actions runtime variable GITHUB_PATH.
    regex: 'process\.env\.GITHUB_PAT([^A-Za-z0-9_]|$)'
