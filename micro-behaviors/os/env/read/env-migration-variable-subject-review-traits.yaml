defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: native-environ-reference
  desc: Indexed native environ[] access
  crit: notable
  conf: 0.75
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf
  if:
    type: text
    regex: (^|[^\w.])environ\s*\[\s*[^'"\s]
- id: vb6-environ-bstr
  desc: VB6 environment variable lookup
  crit: baseline
  conf: 0.88
  if:
    type: symbol
    exact: rtcEnvironBstr
- id: vb6-environ-var
  desc: VB6 rtcEnvironVar environment lookup
  crit: notable
  conf: 0.9
  if:
    type: import
    exact: rtcEnvironVar
- id: get-environment-variable
  desc: Read a process env var (GetEnvironmentVariable)
  crit: notable
  conf: 0.85
  for:
  - pe
  - dll
  - c
  - cpp
  if:
    type: import
    regex: ^GetEnvironmentVariable[AW]$
- id: wsh-vbs-environment-method
  desc: VBScript accesses a WSH environment collection
  crit: notable
  conf: 0.88
  for:
  - vbs
  if:
    type: text
    regex: (?i)\.\s*Environment\s*\(
