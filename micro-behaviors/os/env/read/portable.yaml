defaults:
  platforms: [windows, unix]
  for: [c, cpp, elf, pe]
traits:
  - id: getenv
    desc: getenv function (read environment variable)
    crit: baseline
    conf: 0.3
    if:
      type: symbol
      regex: (^|\.)getenv$
    downgrade:
      any:
        - id: micro-behaviors/dylib/library/family/
        - id: micro-behaviors/fs/path/library::wininet-dll-name-reference
  - id: js-process-env-optional-trim-read
    desc: JavaScript process.env optional trim read
    crit: baseline
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env\.[A-Z0-9_]+\?\.trim\(\)'
  - id: js-env-index-copy-to-object
    desc: JavaScript copies process.env entry
    crit: component
    conf: 0.86
    for: [javascript, typescript]
    if:
      type: text
      regex: '\w+\s*\[\s*\w+\s*\]\s*=\s*process\.env\s*\[\s*\w+\s*\]'
  - id: python-environ-sensitive-filter
    desc: Python filters sensitive environment keys
    crit: notable
    conf: 0.86
    for: [python]
    ref: sha256:7c8adc80c7efc628483693598c7827bbc1529a0e1fd87d7cdd5ff6af889c008f
    if:
      type: text
      substr: sensitive_keywords = ["KEY", "TOKEN", "SECRET"
  - id: dollar-home
    desc: $HOME variable reference
    crit: component
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: text
      substr: $HOME
  - id: getenv-home
    desc: getenv HOME lookup
    crit: baseline
    conf: 0.5
    attack: T1082
    mbc: E1082
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: getenv.{0,30}HOME
  - id: env-dot-home
    desc: env.HOME property reference
    crit: baseline
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: text
      substr: env.HOME
    not:
      - substr: Resolve ~ in path configs to env.HOME
      - substr: process.env.HOME
    unless:
      - id: metadata/file/catalog/identity/
composite_rules:
  - id: env-access-comp
    desc: Environment variable access functions
    crit: baseline
    conf: 0.4
    any:
      - id: getenv
      - id: micro-behaviors/os/env/write::setenv
      - id: micro-behaviors/os/env/write::putenv
      - id: micro-behaviors/os/env/write::unsetenv
      - id: micro-behaviors/os/env/enumerate/
      
      - id: micro-behaviors/os/env/read::getenv-home
  - id: python-filtered-environ-copy
    desc: Python copies filtered environment values
    crit: notable
    conf: 0.9
    for:
    - python
    ref: sha256:7c8adc80c7efc628483693598c7827bbc1529a0e1fd87d7cdd5ff6af889c008f
    all:
    - id: micro-behaviors/os/env/enumerate::python-environ-items-loop
    - id: python-environ-sensitive-filter
    - id: "metadata/lang/source/syntax/assignment/member::python-env-credential-named-mapping-assignment"
