defaults:
  platforms:
  - windows
  - unix
  for:
  - rust
  crit: notable
  conf: 0.86
traits:
- id: std-env-var
  desc: Reads a Rust environment variable
  if:
    type: text
    regex: std::env::var(_os)?\s*\(
  unless:
  - id: micro-behaviors/data/control-flow/branch::cargo-credential-http-false-branch
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: rust-env-module-var
  desc: Rust reads an environment variable
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (^|[^:])\benv::var(_os)?\s*\(
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
