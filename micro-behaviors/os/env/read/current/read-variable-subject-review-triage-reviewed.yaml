defaults:
  platforms:
  - windows
  crit: notable
traits:
- id: user-environment-call
  for:
  - html
  - text
  - data
  - vbs
  desc: Script accesses the User environment collection
  conf: 0.96
  if:
    type: text
    regex: (?is)Environment\s*\(\s*["']User["']\s*\)
composite_rules:
- id: wsh-user-environment-access
  for:
  - html
  - text
  - data
  desc: WScript.Shell constructor beside User environment access
  conf: 0.97
  all:
  - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
  - id: micro-behaviors/os/env/read/current::user-environment-call
