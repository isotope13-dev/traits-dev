defaults:
  crit: notable
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
composite_rules:
- id: node-addon-environment-control
  for:
  - elf
  - macho
  - pe
  desc: Native Node addon with environment variable reference
  conf: 0.9
  all:
  - id: metadata/binary/linking/addon-abi::node-api-addon-export
  any:
  - id: micro-behaviors/os/env/runtime::node-addon-quiet-check
  - id: micro-behaviors/os/env/runtime::node-debug-check
