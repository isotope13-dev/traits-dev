defaults:
  platforms:
  - windows
  - unix
traits:
- id: process-env
  desc: Node process.env access
  crit: baseline
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: process.env
- id: javascript
  desc: Access environment variables
  crit: baseline
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: member
    regex: ^process\.env(\.|$)
- id: wsh-process-environment
  desc: WSH process environment access
  crit: notable
  conf: 0.9
  for:
  - javascript
  - vbs
  platforms:
  - windows
  if:
    type: text
    regex: Environment\s*\(.{0,24}Proc.{0,12}ess
- id: wsh-process-environment-split
  desc: Split-join WSH process environment access
  crit: notable
  conf: 0.92
  for:
  - javascript
  - vbs
  platforms:
  - windows
  if:
    type: text
    regex: Environment\s*\(\s*\[["']Pro["'].{0,32}["']cess["']
- id: wsh-environment-symbol
  desc: WSH Environment method access
  crit: notable
  conf: 0.86
  for:
  - javascript
  - vbs
  platforms:
  - windows
  if:
    type: text
    regex: WScript\.Shell[^\n]{0,83}\.Environment\s*\(
- id: wsh-expand-environment-strings-call
  desc: Calls WSH ExpandEnvironmentStrings
  crit: notable
  conf: 0.9
  for:
  - javascript
  - vbs
  platforms:
  - windows
  if:
    type: symbol
    regex: \.ExpandEnvironmentStrings$
- id: expandenv-named-variable
  desc: ExpandEnvironmentStrings named-variable call
  crit: notable
  conf: 0.88
  for:
  - javascript
  platforms:
  - windows
  if:
    type: text
    regex: ExpandEnvironmentStrings\s*\(\s*["']%[A-Za-z0-9_]{8,24}%["']\s*\)
    case_insensitive: true
  not:
  - regex: (?i)ALLUSERSPROFILE
  - regex: (?i)APPDATA
  - regex: (?i)COMMONPROGRAMFILES
  - regex: (?i)COMPUTERNAME
  - regex: (?i)COMSPEC
  - regex: (?i)HOMEDRIVE
  - regex: (?i)HOMEPATH
  - regex: (?i)LOCALAPPDATA
  - regex: (?i)LOGONSERVER
  - regex: (?i)NUMBER_OF_PROCESSORS
  - regex: (?i)ONEDRIVE
  - regex: (?i)OS
  - regex: (?i)PATHEXT
  - regex: (?i)PROCESSOR_ARCHITECTURE
  - regex: (?i)PROCESSOR_IDENTIFIER
  - regex: (?i)PROCESSOR_LEVEL
  - regex: (?i)PROCESSOR_REVISION
  - regex: (?i)PROGRAMDATA
  - regex: (?i)PROGRAMFILES
  - regex: (?i)PUBLIC
  - regex: (?i)SYSTEMDRIVE
  - regex: (?i)SYSTEMROOT
  - regex: (?i)TEMP
  - regex: (?i)TMP
  - regex: (?i)USERDOMAIN
  - regex: (?i)USERNAME
  - regex: (?i)USERPROFILE
  - regex: (?i)WINDIR
- id: env-item-named-variable
  desc: Environment Item named-variable reference
  crit: notable
  conf: 0.84
  for:
  - javascript
  platforms:
  - windows
  if:
    type: text
    regex: \.Item\s*\(\s*["'][A-Za-z0-9_]{8,24}["']\s*\)
    case_insensitive: true
  not:
  - regex: (?i)ALLUSERSPROFILE
  - regex: (?i)APPDATA
  - regex: (?i)COMMONPROGRAMFILES
  - regex: (?i)COMPUTERNAME
  - regex: (?i)COMSPEC
  - regex: (?i)HOMEDRIVE
  - regex: (?i)HOMEPATH
  - regex: (?i)LOCALAPPDATA
  - regex: (?i)LOGONSERVER
  - regex: (?i)NUMBER_OF_PROCESSORS
  - regex: (?i)ONEDRIVE
  - regex: (?i)OS
  - regex: (?i)PATHEXT
  - regex: (?i)PROCESSOR_ARCHITECTURE
  - regex: (?i)PROCESSOR_IDENTIFIER
  - regex: (?i)PROCESSOR_LEVEL
  - regex: (?i)PROCESSOR_REVISION
  - regex: (?i)PROGRAMDATA
  - regex: (?i)PROGRAMFILES
  - regex: (?i)PUBLIC
  - regex: (?i)SYSTEMDRIVE
  - regex: (?i)SYSTEMROOT
  - regex: (?i)TEMP
  - regex: (?i)TMP
  - regex: (?i)USERDOMAIN
  - regex: (?i)USERNAME
  - regex: (?i)USERPROFILE
  - regex: (?i)WINDIR
- id: wsh-environment-object
  desc: WSH Environment object retrieval
  crit: notable
  conf: 0.95
  for:
  - javascript
  - vbs
  - html
  platforms:
  - windows
  if:
    type: text
    case_insensitive: true
    regex: (?i)\b[A-Za-z_$][\w$]*\.Environment\s*\(\s*["'](USE|PRO|SYS)[A-Za-z"'\s+]*\)
- id: wsh-environment-method-text
  desc: Calls the WSH Environment method
  crit: notable
  conf: 0.9
  for:
  - javascript
  - vbs
  platforms:
  - windows
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]*\.Environment\s*\(\s*["'](User|Process|System)["']
- id: wsh-environment-computed-arg
  desc: WSH Environment call takes computed argument
  crit: notable
  conf: 0.9
  for:
  - javascript
  - vbs
  platforms:
  - windows
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]*\.Environment\s*\(\s*(\(\s*function\b|[A-Za-z_$][\w$]*\s*\()
