defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-comspec-environment-reference
    desc: References ComSpec environment value
    if:
      type: text
      exclude_comments: true
      regex: 'Environment[\s\S]{0,10}ComSpec'
    unless:
      - type: text
        substr: ExpandEnvironmentStrings
