defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: debug-prefixed-env-filter
    desc: Filters environment names with a debug_ prefix
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Object\.keys\(process\.env\)\.filter\(.{0,160}=>\s*/\^debug_/'
