defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: debug-prefixed-env-filter
    desc: Filters environment names with a debug_ prefix
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      # The regex test must be the filter callback's result, not unrelated
      # text elsewhere in a bundle. The DEBUG_ namespace is not secret access.
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression
                object: (identifier) @object
                property: (property_identifier) @keys)
              arguments: (arguments . (member_expression
                object: (identifier) @process
                property: (property_identifier) @env)))
            property: (property_identifier) @filter)
          arguments: (arguments . [
            (arrow_function body: (call_expression
              function: (member_expression
                object: (regex) @pattern
                property: (property_identifier) @test)))
            (function_expression body: (statement_block
              (return_statement (call_expression
                function: (member_expression
                  object: (regex) @pattern
                  property: (property_identifier) @test)))))
          ])) @filtered
          (#eq? @object "Object")
          (#eq? @keys "keys")
          (#eq? @process "process")
          (#eq? @env "env")
          (#eq? @filter "filter")
          (#eq? @test "test")
          (#match? @pattern "^/\\^debug_/i?$"))
