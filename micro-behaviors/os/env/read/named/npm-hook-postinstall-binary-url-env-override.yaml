defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: postinstall-binary-url-env-override
    desc: Node references binary URL environment variable
    crit: notable
    conf: 0.82
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: process\.env\.[A-Z0-9_]*BINARY[A-Z0-9_]*URL
