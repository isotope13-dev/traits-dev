defaults:
  platforms: [windows, unix]
  for: [c, cpp, elf, pe]
traits:
  - id: dollar-home
    desc: $HOME variable reference
    crit: component
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: text
      substr: $HOME
  - id: getenv-home
    desc: getenv HOME lookup
    crit: baseline
    conf: 0.5
    attack: T1082
    mbc: E1082
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: getenv.{0,30}HOME
  - id: env-dot-home
    desc: env.HOME property reference
    crit: baseline
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: text
      substr: env.HOME
    not:
      - substr: Resolve ~ in path configs to env.HOME
      - substr: process.env.HOME
