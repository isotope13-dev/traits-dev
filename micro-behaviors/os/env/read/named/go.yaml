defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.92

traits:
  # A service credential read by name: os.Getenv/os.LookupEnv of an
  # UPPER_SNAKE credential variable (API key, token, or secret). The name
  # shape generalizes across vendor prefixes so a renamed service cannot walk
  # past detection. Reading the variable establishes neither ownership of the
  # credential nor where it flows; exfiltration composites bind it to a sink.
  - id: go-getenv-service-api-key
    desc: Go reads service API key from environment
    if:
      type: text
      regex: 'os\.(Getenv|LookupEnv)\(\s*"[A-Z][A-Z0-9_]*_(API_KEY|APIKEY|TOKEN|SECRET)"\s*\)'
