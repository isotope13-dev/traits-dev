defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: npm-init-cwd-read
    desc: Reads npm invocation directory
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      exact: process.env.INIT_CWD

  - id: npm-package-metadata-env-hex-hidden
    desc: Hex-hidden npm package metadata environment key
    crit: notable
    conf: 0.95
    attack: T1027
    if:
      type: encoded
      encoding: hex
      regex: '^npm_package_[a-z0-9_]{2,80}$'

  - id: node-pm2-env-check
    desc: Detects PM2 environment (NODE_APP_INSTANCE)
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'process\.env\.(NODE_APP_INSTANCE|pm2_env)|["'']NODE_APP_INSTANCE["'']'
  # The trailing [^.\[\w$] is what makes this "the process.env OBJECT" rather
  # than "some variable out of it": `process\.env\b` also matched
  # `opts.token = process.env.NPM_TOKEN`, because \b sits happily before the
  # dot. Ordinary Node config and CI glue is full of single-variable reads, and
  # they were all being reported as handing over the whole environment.
