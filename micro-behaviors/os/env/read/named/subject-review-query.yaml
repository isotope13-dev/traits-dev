defaults:
  for: [binaries, c]
  crit: baseline
  platforms:
    - unix
    - windows
traits:
  - id: shell-ostype-reference
    desc: Reads shell OSTYPE environment value
    conf: 0.8
    for: [shell]
    platforms: [unix]
    if:
      type: text
      substr: $OSTYPE
  - id: getenv-user
    desc: Query USER environment variable
    conf: 0.5
    attack: T1033
    mbc: E1033
    platforms:
      - unix
    if:
      type: text
      substr: 'getenv("USER")'
