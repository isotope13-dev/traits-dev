defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 0.75
traits:
  - id: sensitive-env-var
    desc: References a sensitive Ruby environment variable
    if:
      type: text
      regex: 'ENV\[.{0,30}(TOKEN|SECRET|KEY|PASS)'

  # A host-named variable (RHOST, DB_HOST, REDIS_HOST) usually configures a
  # connection endpoint. This is a configuration read, not credential access.
  - id: host-env-var-read
    desc: Reads a host-named Ruby ENV variable
    if:
      type: text
      regex: 'ENV\[\s*[''"][A-Z0-9_]*HOST[A-Z0-9_]*[''"]\s*\]'
