traits:
  - id: temp-environment-variable-read
    desc: Reads TEMP or TMP environment variable
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    for: [scripts, source, javascript, typescript]
    if:
      type: text
      regex: '(?i)env(iron)?\s*[.\[]\s*["'']?TE?MP\b|get(env|EnvironmentVariable[AW]?)\s*\(\s*["'']TE?MP'
