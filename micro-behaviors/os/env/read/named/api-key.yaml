---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - ruby
  - java
  crit: notable
traits:
- id: api-key-env-bracket
  desc: API_KEY via bracketed env access
  conf: 0.8
  if:
    type: text
    regex: ENV\[['"]API_KEY['"]\]|os\.environ\[['"]API_KEY['"]\]
- id: api-key-process-env
  unless:
  - id: metadata/package/testing/corpus/labeled::inert-security-input-module
  desc: API_KEY via process env access
  conf: 0.9
  if:
    type: symbol
    kind: member
    exact: process.env.API_KEY
