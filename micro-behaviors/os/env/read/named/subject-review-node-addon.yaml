defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: node-addon-quiet-check
    desc: NODE_ADDON_QUIET variable name reference
    conf: 0.92
    if:
      type: text
      word: NODE_ADDON_QUIET
  - id: node-debug-check
    desc: NODE_DEBUG variable name reference
    conf: 0.75
    if:
      type: text
      word: NODE_DEBUG

composite_rules:
  - id: node-addon-environment-control
    for: [elf, macho, pe]
    desc: Native Node addon with environment variable reference
    conf: 0.9
    all:
      - id: metadata/binary/symbols/exports::node-api-addon-export
    any:
      - id: micro-behaviors/os/env/read/named::node-addon-quiet-check
      - id: micro-behaviors/os/env/read/named::node-debug-check
