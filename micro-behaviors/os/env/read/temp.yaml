traits:
  - id: temp-environment-variable-read
    desc: Reads TEMP or TMP environment variable
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    for: [scripts, source, javascript, typescript]
    if:
      type: text
      regex: "(?i)(environ|env)\\s*[.\\[]\\s*[\"']?TE?MP\\b|getenv\\s*\\(\\s*[\"']TE?MP|GetEnvironmentVariable(A|W)?\\s*\\(\\s*[\"'](?:TEMP|TMP)[\"']"
