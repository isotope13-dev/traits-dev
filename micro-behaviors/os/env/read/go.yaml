defaults:
  conf: 0.8
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe]
  crit: baseline
traits:
  - id: os-getenv
    desc: os.Getenv() reads a named environment variable
    if:
      type: symbol
      exact: os.Getenv
  - id: os-lookupenv
    desc: os.LookupEnv() reads a named env variable
    if:
      type: symbol
      exact: os.LookupEnv
composite_rules:
  - id: go-env-access
    desc: Environment variable access
    crit: baseline
    any:
      - id: os-getenv
      - id: os-lookupenv
      - id: micro-behaviors/os/env/enumeration::os-environ
