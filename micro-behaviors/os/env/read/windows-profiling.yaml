defaults:
  for:
    - pe
    - powershell
    - batch
    - vbs
  platforms:
    - windows
traits:
  - id: getenv-profiling-api
    desc: GetEnvironmentVariable profiler check
    crit: baseline
    conf: 0.86
    for: [pe, dll, csharp]
    if:
      type: text
      regex: 'GetEnvironmentVariable(A|W)?'
    unless:
    - id: metadata/lang/compiler/systems::go-buildinfo
    - id: well-known/app/system/drivers/nvidia::ngx-dll-basename
