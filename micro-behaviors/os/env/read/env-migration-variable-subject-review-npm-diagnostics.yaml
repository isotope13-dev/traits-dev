defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: node-npm-diagnostic-allowlist-loop
  desc: Closed npm diagnostic allowlist loop
  conf: 0.98
  if:
    type: tree-sitter
    query: "(program\n  (lexical_declaration (variable_declarator name: (identifier) @list\n    value: (array .\n      (string (string_fragment) @key0) .\n      (string (string_fragment) @key1) .\n      (string (string_fragment) @key2) .\n      (string (string_fragment) @key3) .\n      (string (string_fragment) @key4) .\n      (string (string_fragment) @key5) .\n      (string (string_fragment) @key6) .\n      (string (string_fragment) @key7) .\n      (string (string_fragment) @key8) .\n    ) @allowlist))\n  (function_declaration body: (statement_block\n    (for_in_statement right: (identifier) @used_list)\n  ))\n  (#eq? @list @used_list)\n  (#eq? @key0 \"npm_command\")\n  (#eq? @key1 \"npm_lifecycle_event\")\n  (#eq? @key2 \"npm_package_name\")\n  (#eq? @key3 \"npm_package_version\")\n  (#eq? @key4 \"npm_config_registry\")\n  (#eq? @key5 \"npm_config_user_agent\")\n  (#eq? @key6 \"npm_config_userconfig\")\n  (#eq? @key7 \"npm_config_globalconfig\")\n  (#eq? @key8 \"npm_config_prefix\")\n\
      )\n"
- id: node-env-access-outside-key-k-scoped
  size_max: 262144
  desc: Environment reads outside key/k/scoped indices
  conf: 0.95
  if:
    type: tree-sitter
    query: "[\n  ((subscript_expression) @access\n    (#match? @access \"^process\\\\.env\\\\[\"))\n  ((member_expression) @access\n    (#match? @access \"^process\\\\.env\\\\.\"))\n]\n"
  not:
  - exact: process.env[key]
  - exact: process.env[scoped]
  - exact: process.env[k]
- id: node-env-text-outside-npm-context-ci-markers
  size_max: 262144
  desc: Function body references process.env
  conf: 0.95
  if:
    type: tree-sitter
    query: "((function_declaration\n  name: (identifier) @name\n  body: (statement_block) @body)\n (#not-eq? @name \"npmContext\")\n (#not-eq? @name \"ciMarkers\")\n (#match? @body \"process[.]env\"))"
