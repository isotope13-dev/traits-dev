defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: node-npm-diagnostic-allowlist-loop
  desc: Closed npm diagnostic allowlist loop
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      (program
        (lexical_declaration (variable_declarator name: (identifier) @list
          value: (array .
            (string (string_fragment) @key0) .
            (string (string_fragment) @key1) .
            (string (string_fragment) @key2) .
            (string (string_fragment) @key3) .
            (string (string_fragment) @key4) .
            (string (string_fragment) @key5) .
            (string (string_fragment) @key6) .
            (string (string_fragment) @key7) .
            (string (string_fragment) @key8) .
          ) @allowlist))
        (function_declaration body: (statement_block
          (for_in_statement right: (identifier) @used_list)
        ))
        (#eq? @list @used_list)
        (#eq? @key0 "npm_command")
        (#eq? @key1 "npm_lifecycle_event")
        (#eq? @key2 "npm_package_name")
        (#eq? @key3 "npm_package_version")
        (#eq? @key4 "npm_config_registry")
        (#eq? @key5 "npm_config_user_agent")
        (#eq? @key6 "npm_config_userconfig")
        (#eq? @key7 "npm_config_globalconfig")
        (#eq? @key8 "npm_config_prefix")
      )
- id: node-env-access-outside-key-k-scoped
  desc: Environment reads outside key/k/scoped indices
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      [
        ((subscript_expression) @access
          (#match? @access "^process\\.env\\["))
        ((member_expression) @access
          (#match? @access "^process\\.env\\."))
      ]
  not:
  - exact: process.env[key]
  - exact: process.env[scoped]
  - exact: process.env[k]
- id: node-env-text-outside-npm-context-ci-markers
  desc: Env text outside npmContext/ciMarkers helpers
  conf: 0.95
  if:
    type: tree-sitter
    query: |-
      [
       ((function_declaration name: (identifier) @name body: (statement_block) @body)
        (#match? @body "process[.]env")
        (#not-eq? @name "npmContext")
        (#not-eq? @name "ciMarkers"))
       (program (lexical_declaration) @statement
        (#match? @statement "process[.]env"))
       (program (expression_statement) @statement
        (#match? @statement "process[.]env"))
      ]
composite_rules:
- id: node-nondiagnostic-environment-source
  desc: Non-diagnostic environment value access
  conf: 0.95
  any:
  - id: node-env-access-outside-key-k-scoped
  - id: node-process-env-alias
  - id: node-process-env-object-copy
  - id: node-process-env-object-field
  - id: node-env-text-outside-npm-context-ci-markers
