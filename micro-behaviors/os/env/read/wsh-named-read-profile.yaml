defaults:
  for: [javascript]
  platforms: [windows]

composite_rules:
  - id: wsh-named-environment-reader
    desc: WSH reads a named environment variable
    crit: notable
    conf: 0.95
    any:
      - id: wsh-named-environment-item-reader
      - id: wsh-named-environment-expansion-reader
  - id: wsh-named-environment-item-reader
    desc: WSH Environment method and named Item reference nearby
    crit: notable
    conf: 0.95
    all:
      - id: wsh-environment-method-text
      - id: env-item-named-variable
    near_lines: 8
  - id: wsh-named-environment-expansion-reader
    desc: ActiveX construction and named environment variable expansion
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: expandenv-named-variable
