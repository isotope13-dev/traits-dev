# Preserve the former CI environment selector as one role in consumers.
composite_rules:
  - id: ci-env-reference-set
    desc: CI environment metadata or OIDC credential request names
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/os/env/cicd/
      - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
