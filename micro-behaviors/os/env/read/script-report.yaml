composite_rules:
- id: named-script-env-report-cooccurrence
  desc: Named script contains environment report inputs
  crit: notable
  conf: 0.96
  all:
  - id: metadata/package/files/included::install-or-beacon-js-basename
  - id: micro-behaviors/os/env/read::process-env-report-input
  any:
  - id: metadata/lang/source/naming/function::http-post-name-reference
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  - id: micro-behaviors/data/buffer/alloc::buffer-from-call
  - id: micro-behaviors/communications/http/request/body/construction::request-write-call
  - id: micro-behaviors/communications/dns/resolver::node-dns-lookup
  platforms:
  - unix
  - windows
  for:
  - javascript
