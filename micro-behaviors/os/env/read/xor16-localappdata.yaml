# Length buckets retain candidates beyond the scanner's eight-match cap.
# Validate plaintext under the decoder's own RIP-relative 16-byte key.
# No campaign address, key, filename, fixed offset or plaintext copy is needed.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: xor16-localappdata-name
    desc: XOR-encoded LOCALAPPDATA reference
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule xor16_localappdata_name {
          strings:
            $decode = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 ?? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
            $decode_0 = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 0? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
            $decode_1 = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 1? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
            $decode_2 = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 2? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
            $decode_3 = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 3? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
            $decode_4 = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 4? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
            $decode_5 = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 5? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
            $decode_6 = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 6? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
            $decode_7 = { 48 8D 0D [4] 48 8D 15 [4] 48 83 F8 7? 74 ??
                        (41 89 C0 41 83 E0 0F 45 8A 04 10 | 44 8A 04 10) 44 32 04 08 }
          condition:
            pe.is_pe and pe.machine == pe.MACHINE_AMD64 and filesize < 32MB and
            $decode and #decode < 4096 and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any of ($decode*) : (
                for any m in (1..#) : (
                @[m] >= pe.sections[s].raw_data_offset and
                @[m]+![m] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
                uint8(@[m]+17) >= 12 and
                with site_rva = pe.sections[s].virtual_address+@[m]-pe.sections[s].raw_data_offset : (
                  with source = pe.rva_to_offset(site_rva+7+int32(@[m]+3)),
                       key = pe.rva_to_offset(site_rva+14+int32(@[m]+10)) : (
                    source+12 <= filesize and key+16 <= filesize and
                    for all j in (0..7) : (
                  (uint8(source+j) ^ uint8(key+(j%16))) == ((0x5050414c41434f4c >> ((j-0)*8)) & 255)
                ) and
                for all j in (8..11) : (
                  (uint8(source+j) ^ uint8(key+(j%16))) == ((0x41544144 >> ((j-8)*8)) & 255)
                )
                  )
                )
              )
              )
            )
        }
