defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  - id: native-environ-reference
    desc: "Indexed native environ[] access"
    crit: baseline
    conf: 0.75
    platforms: [unix]
    for: [c, cpp, objc, elf]
    if:
      # The C global is indexed by an integer/loop variable (`environ[i]`,
      # `environ[0]`) to walk the whole table. Requiring the first
      # non-space byte after `[` to not be a quote excludes the
      # syntactically identical but semantically opposite dict-style
      # single-key lookup (`os.environ["OPENAI_API_KEY"]`, `ENV['TOKEN']`)
      # that native extensions for scripting languages routinely embed as
      # docstrings, usage examples, or code-generation templates — seen in
      # baml.linux-x64-musl.node's generated-Python-SDK strings and
      # gllm_inference's Python docstrings, neither of which touches the
      # process's own environment table at all.
      type: text
      regex: '\benviron\s*\[\s*[^''"\s]'
  - id: vb6-environ-bstr
    desc: VB6 environment variable lookup
    crit: baseline
    conf: 0.88
    if:
      type: symbol
      exact: "rtcEnvironBstr"
  - id: get-environment-variable
    desc: "Read a process env var (GetEnvironmentVariable)"
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp]
    if:
      type: import
      regex: ^GetEnvironmentVariable[AW]$
  - id: wsh-vbs-environment-method
    desc: VBScript accesses a WSH environment collection
    crit: notable
    conf: 0.88
    for: [vbs]
    if:
      type: text
      regex: '(?i)\.\s*Environment\s*\('
