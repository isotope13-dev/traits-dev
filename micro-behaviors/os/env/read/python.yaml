defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
  mbc: "E1082"
  attack: "T1082"
traits:
  - id: os-path-expandvars
    desc: Expands environment variables in paths
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.path.expandvars
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: os-environ-symbol
    desc: Accesses environment variables (os.environ)
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: "os.environ"
  # Whole-environment inheritance for a child process: copying os.environ
  # hands every reachable secret (tokens, registry credentials, prompt
  # material in agent plugins) to whatever is launched next.
  - id: python-environ-copy
    desc: Copies the full process environment
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "os.environ.copy()"
  - id: pyc-environ-name
    desc: Python bytecode names environ
    crit: baseline
    for: [pyc]
    # The name is in the string table of any module that reads os.environ;
    # baseline like os-environ-symbol, the source-text form above.
    conf: 0.95
    if:
      type: text
      word: environ
