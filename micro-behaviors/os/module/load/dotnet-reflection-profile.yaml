defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dotnet-load-reflection-api-profile
    desc: Managed load and reflection API profile
    crit: notable
    conf: 0.8
    all:
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/metaprogramming/reflection::activator
      - id: metadata/binary/symbols/name::dotnet-create-instance-method-name
      - id: micro-behaviors/os/module/load::dotnet-explicit-load-api
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-exported-types-token
    unless:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/lang/compiler/aot::system-private-corelib
      - id: metadata/lang/compiler/aot::kiota-wasm-corelib-dll-path
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-apicurio-registry-ui-package
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-reference-pack-context
      # CoreLib *implements* Assembly.Load / Activator / GetExportedTypes; the
      # aot .rdata marker often misses single-section CoreLib PE copies.
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-corelib-assembly
      # Unsigned reference facades (netstandard / mscorlib / System.*).
      - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
