traits:
- id: php-include-get-param
  desc: PHP includes request-selected code
  crit: suspicious
  conf: 0.95
  attack: T1505.003
  if:
    # Parse executable include syntax so PHP source stored in a quoted string
    # is not reported as a live request-controlled include.
    type: tree-sitter
    query: |
      ((include_expression (parenthesized_expression
        (subscript_expression
          (variable_name (name) @source)
          [(string . (string_content) @key .)
           (encapsed_string . (string_content) @key .)]))) @include
       (#match? @source "^_(GET|POST|REQUEST)$"))
  unless:
  - id: metadata/package/testing/presence/path::vuln-samples-directory-path
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
  - id: metadata/package/testing/corpus::fenced-detector-regression-case
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  - id: well-known/app/publishing/wordpress-plugins/security::centershield-decoded-signature-literal
  platforms:
  - windows
  - unix
  for:
  - php

