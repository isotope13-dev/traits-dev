# Importlib execution in embedded source text; no HTTP-to-loader flow claim.
defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-importlib-exec-module
    desc: File-spec and importlib execution references
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'importlib\.util\.spec_from_file_location.{0,400}module_from_spec.{0,300}exec_module'

