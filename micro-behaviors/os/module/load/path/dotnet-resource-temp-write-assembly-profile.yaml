defaults:
  for:
  - csharp
  platforms:
  - windows
composite_rules:
- id: dotnet-resource-temp-write-assembly-profile
  desc: Resource stream, temp write and assembly load
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/data/embedded/resource::dotnet-source-manifest-resource-stream-call
  - id: micro-behaviors/fs/path/temp::temp-path-any
  - id: micro-behaviors/fs/write/file/full/bytes::writeallbytes-any
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-file
  any:
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load
  - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-file
