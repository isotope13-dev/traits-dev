# A script element created and given a source near the end of a bundle, a
# remote URL beside it, and the element appended to the document head: the
# browser fetches and runs the script once it is appended. Loading by location,
# so `load/path`; the URL's destination and the script's contents are not
# established here.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: bundle-tail-script-source-and-append
  desc: Appends a URL-sourced script element near the bundle tail
  crit: notable
  conf: 0.9
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/url/host/domain-http::js-http-url-literal-in-file-tail
  - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment-in-file-tail
  - id: micro-behaviors/ui/window/dom/create::document-head-append-in-file-tail
