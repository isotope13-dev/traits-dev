defaults:
  for: [applescript]
  platforms: [macos]
traits:
- id: load-script
  desc: load script (Apple Event)
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (^syso\.load$|sysoload)
- id: compiled-load-script-event
  desc: Compiled AppleScript load script event
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: sysoloadscpt
- id: load-script-cmd
  desc: load script (command)
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (load script|loadscpt)
- id: load-script-posix-file
  desc: AppleScript load-script POSIX path text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: load script\s*\(\s*POSIX file
composite_rules:
- id: external-script
  desc: AppleScript load-script references
  crit: notable
  conf: 0.85
  any:
  - id: load-script
  - id: load-script-cmd
  - id: load-script-posix-file
