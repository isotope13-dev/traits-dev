defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
- id: python-spec-from-file-location
  desc: References importlib file-spec construction
  conf: 0.9
  if:
    type: text
    substr: importlib.util.spec_from_file_location
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: python-loaded-module-exec-module
  desc: References loader exec_module invocation
  conf: 0.92
  if:
    type: text
    regex: '\b(spec|module)\.loader\.exec_module\s*\('
