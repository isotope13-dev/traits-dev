defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- crit: notable
  conf: 0.94
  id: cjs-interpolated-local-require
  desc: CommonJS require uses interpolated local path
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (identifier) @callee
        arguments: (arguments . (template_string
          . (string_fragment) @prefix
          (template_substitution)))) @call
        (#eq? @callee "require")
        (#match? @prefix "^\\.\\.?/"))

- crit: notable
  conf: 0.9
  id: cjs-local-require-call
  desc: CommonJS local-module require call
  if:
    type: symbol
    kind: call
    exact: require
    arg:
      kind: string
      regex: ^\./[^"']{1,80}$

- crit: notable
  conf: 0.95
  id: cjs-pre-export-local-require
  desc: CommonJS local require precedes module.exports
  if:
    type: text
    regex: '}\s*\r?\n\s*require\s*\(\s*[''"]\./[^''"]{1,80}[''"]\s*\)\s*\r?\n\s*module\.exports'
