defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]
traits:
- id: import-hidden-module-path
  desc: Imports a hidden module path
  crit: notable
  conf: 0.85
  for:
  - javascript
  - python
  if:
    type: symbol
    kind: import
    regex: ^(\.\.?/|/)\.[\w-]{1,20}/
  not:
  - regex: (^|/)\.(claude(-plugin)?|openclaw|hermes|codex|gemini|github|gitlab|circleci|vscode|idea|config|husky|yarn|pnpm|changeset|well-known|storybook|next|nuxt|svelte-kit|react-router|devcontainer|bin|ceraph)/
  - regex: (^|/)\.(generated|output|setup|cache|turbo|vite|astro|parcel-cache|angular|metadata)/
