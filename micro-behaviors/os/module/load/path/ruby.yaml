defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.9

traits:
  - id: ruby-require-relative
    desc: Ruby loads a relative source module
    if:
      type: symbol
      kind: call
      exact: require_relative
      arg:
        kind: string

  # `load` evaluates a file every time; `require` and `require_relative`
  # cache module loading. The explicit tree shapes retain bare Kernel calls
  # and Kernel.load while rejecting a method named load on other receivers.
  - id: ruby-load-source-call
    desc: Ruby calls Kernel.load on source files
    crit: notable
    conf: 0.85
    if:
      type: tree-sitter
      query: |
        (call !receiver method: (identifier) @method
          arguments: (argument_list . (_) @arg)
          (#eq? @method "load")) @call
        (call receiver: (constant) @receiver method: (identifier) @method
          arguments: (argument_list . (_) @arg)
          (#eq? @receiver "Kernel")
          (#eq? @method "load")) @call
