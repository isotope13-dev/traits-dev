defaults:
  platforms: [unix, windows]
  for: [scripts, dockerfile, github-actions]
  crit: notable
  conf: 0.9
  attack: T1059

traits:
  - id: yard-command-preload-script
    desc: YARD command line preloads a Ruby script
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)yard(oc)?\b[^\r\n;&|]{0,120}\s(--load|-e)[ \t=]+\S'

  - id: yard-preload-directive
    desc: YARD preload directive loads a file
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(^|["''\n])\s*--load[ \t]+\S'

composite_rules:
  - id: yard-options-preload-write
    desc: Code writes a YARD options file that preloads Ruby
    crit: notable
    conf: 0.95
    near_bytes: 400
    all:
      - id: micro-behaviors/fs/path/config/app::yard-options-file-path
      - id: micro-behaviors/os/module/load/path::yard-preload-directive
