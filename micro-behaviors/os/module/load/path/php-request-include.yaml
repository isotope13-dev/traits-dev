defaults:
  for: [php]
  platforms: [windows, unix]

traits:
  - id: php-include-get-param
    desc: PHP includes request-selected code
    crit: suspicious
    conf: 0.95
    attack: T1505.003
    if:
    # Parse executable include syntax so PHP source stored in a quoted string
    # is not reported as a live request-controlled include.
      type: tree-sitter
      query: |
        ((include_expression (parenthesized_expression
          (subscript_expression
            (variable_name (name) @source)
            [(string . (string_content) @key .)
             (encapsed_string . (string_content) @key .)]))) @include
         (#match? @source "^_(GET|POST|REQUEST)$"))
    unless:
      - id: metadata/package/testing/corpus/security-tests/labeled-verdict::fenced-detector-regression-case
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  # Include whose script name is a variable joined to a `.php` suffix under a
  # relative webroot path: `require './' . $script . '.php'`. Plugin dispatchers
  # use this to route a request-named page to a file. Benign code usually uses
  # __DIR__ or a fixed path, so the variable-script form is the notable part.
  - id: php-variable-script-include
    desc: PHP includes script named by a variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(include|require)(_once)?\s*\(?\s*[''"]\./[''"]\s*\.\s*\$\w+\s*\.\s*[''"]\.php'
