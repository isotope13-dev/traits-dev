defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]
traits:
- id: require-hidden-module-path
  desc: Requires a hidden module path
  crit: notable
  conf: 0.85
  for:
  - javascript
  if:
    type: symbol
    kind: call
    exact: require
    arg:
      kind: string
      regex: ^(\.\.?/|/)\.[\w-]{1,20}/
  unless:
  - id: metadata/package/files/dependency::ceraph-package-path
