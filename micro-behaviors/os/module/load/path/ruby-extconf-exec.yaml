defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: extconf-loads-relative-helper
    desc: extconf.rb loads a relative Ruby helper
    crit: notable
    conf: 0.92
    scope: file
    unless:
      - id: metadata/build/package/recipe/gemspec::extconf-mkmf-version-helper
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/os/module/load/path::ruby-require-relative

  # A recipe that both drives mkmf (require "mkmf" / create_makefile /
  # create_header) and shells out to a compiler toolchain is compiling
  # something. Requiring both legs keeps a stub recipe that only *names* cargo
  # while fetching a payload out of the suppression.
