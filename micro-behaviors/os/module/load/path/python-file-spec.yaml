defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
traits:
- id: python-importlib-spec-file-module-load
  desc: Python importlib file-spec module load
  conf: 0.9
  if:
    type: text
    regex: '(?s)spec_from_file_location.{0,400}exec_module'

- id: python-importlib-spec-exec-module
  platforms: [windows, unix]
  desc: Python importlib spec module execution
  conf: 0.86
  if:
    type: text
    regex: 'spec_from_file_location[\s\S]{0,500}exec_module\s*\('
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
