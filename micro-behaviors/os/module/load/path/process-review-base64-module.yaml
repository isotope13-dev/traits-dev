defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: dynamic-base64-data-module-import
    desc: Imports a computed Base64 JavaScript data URL
    conf: 0.98
    if:
      # Dynamic import has no named call target in the symbol projection.
      # Require the import operator and concatenation, excluding comments,
      # object methods named import, and ordinary inline script resources.
      type: tree-sitter
      query: |
        ((call_expression
          function: (import)
          arguments: (arguments
            (binary_expression
              left: (string (string_fragment) @scheme)
              operator: "+"
              right: (_) @encoded))) @load
        (#eq? @scheme "data:text/javascript;base64,"))
