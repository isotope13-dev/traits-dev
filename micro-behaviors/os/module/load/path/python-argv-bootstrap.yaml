defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-file-spec-from-argv
    desc: References argv-based module spec
    if:
      type: text
      regex: 'spec_from_file_location\(\s*[''"][A-Za-z_]\w{0,39}[''"]\s*,\s*sys\.argv\[1\]'

composite_rules:
  - id: python-inline-child-file-module
    desc: Python argv module-load text accompanies inline child launch
    all:
      - id: python-file-spec-from-argv
      - id: micro-behaviors/os/module/load/path::python-loaded-module-exec-module
      - id: micro-behaviors/process/deploy/interpreter-command::sys-executable-c-subprocess
