defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: deep-single-letter-require-path
    desc: Requires a module under single-letter dirs
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: require
      arg:
        index: 0
        kind: string
        regex: '(/[a-z]){8,}(/|$)'
