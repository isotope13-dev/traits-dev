# File-based module loading is separate from native API resolution.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-spec-from-file-location
    desc: References importlib file-spec construction
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: importlib.util.spec_from_file_location
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: python-loaded-module-exec-module
    desc: References loader exec_module invocation
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(spec|module)\.loader\.exec_module\s*\('
