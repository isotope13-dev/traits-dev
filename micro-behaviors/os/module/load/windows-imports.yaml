defaults:
  conf: 1.0
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: user32-dll-reference
    desc: Reference to USER32.dll
    crit: baseline
    if:
      type: text
      word: USER32.dll
  - id: gdi32-dll-reference
    desc: Reference to GDI32.dll
    crit: baseline
    if:
      type: text
      word: GDI32.dll
  - id: d3d11-dll-reference
    desc: Reference to D3D11.dll
    crit: notable
    if:
      type: text
      word: D3D11.dll
  - id: opengl32-dll-reference
    desc: Reference to OPENGL32.dll
    crit: notable
    if:
      type: text
      word: OPENGL32.dll
