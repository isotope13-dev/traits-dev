defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  # Follow local aliases through both reflection calls. Mere assembly loading,
  # method lookup, or invocation of an unrelated object does not suffice.
  # Plugin hosts can perform this operation legitimately.
  - id: python-loaded-assembly-method-invocation
    desc: Python invokes loaded .NET assembly method
    if:
      type: symbol
      kind: call
      regex: '\.Invoke$'
      receiver:
        from:
          call: '^Assembly\.Load$'
          through:
            - call: '\.GetType$'
              receiver: true
            - call: '\.GetMethod$'
              receiver: true
