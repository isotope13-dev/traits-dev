defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: ntdll-dll-string
    desc: ntdll.dll module name reference
    crit: baseline
    conf: 0.9
    for: [pe, dll, powershell, batch, vbs]
    if:
      type: text
      substr: ntdll.dll
      case_insensitive: true
  - id: get-proc-address-source-call
    desc: Resolves a Windows API export in source
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust, python, powershell]
    if:
      type: symbol
      kind: call
      exact: GetProcAddress
  - id: get-proc-address-import
    desc: Resolve exports with GetProcAddress
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: "GetProcAddress"
    downgrade:
      any:
        # One reference to the toolchain rather than three spellings of it; the
        # bare `llvm` substring matched any file that merely mentions LLVM.
        - id: well-known/tool/development/toolchain/llvm/
        # Go's windows syscall package statically links GetProcAddress for
        # lazy-bound DLL imports — every Go Windows binary imports it.
        # `metadata/lang/compiled/` holds Go *source* markers, so it never
        # matched a compiled PE and this exclusion did nothing. A Go PE carries
        # pclntab in .rdata rather than a .gopclntab section, so `go-binary`
        # does not see it either, so the build-metadata module path carries
        # the PE side. Both legs are atoms deliberately: a composite reference
        # here resolves too late to affect the downgrade.
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-module-path
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
composite_rules:
  - id: dynamic-self-resolution-imports
    desc: Dynamically resolve own modules and exports
    crit: baseline
    conf: 0.92
    all:
      - id: get-proc-address-import
    any:
      - id: micro-behaviors/os/module/load::get-module-handle-ansi
      - id: micro-behaviors/os/module/load::get-module-handle-wide
      - id: micro-behaviors/os/module/load::get-module-handle-ex
