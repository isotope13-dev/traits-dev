defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # A dotfile is a module location, not evidence of a concealed payload.
  # Match the actual require argument, excluding comments and quoted code.
  - id: cjs-dotfile-require
    desc: Requires a local dotfile module
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: require
      arg:
        index: 0
        kind: string
        regex: '^\.{1,2}/([^/]+/)*\.[A-Za-z0-9_-][^/]*$'
