# Module._compile installs and evaluates source as a Node module. The module
# loading result, not the incidental compiler step, owns these observations.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: module-compile-marker
    desc: Calls _compile with source and filename
    conf: 0.95
    attack: T1059.007
    if:
      type: symbol
      kind: call
      regex: '(^|\.)_compile$'
      # Node's compiler takes source and a filename. Transaction serializers
      # also use _compile(), with no arguments and no code-loading behavior.
      arg:
        index: 1

  - id: module-compile-hex-hidden
    desc: Hex-hidden Node _compile method
    conf: 0.96
    attack: T1027,T1059.007
    if:
      type: encoded
      encoding: hex
      exact: _compile

  - id: node-new-module-computed-invocation
    desc: New Node Module invokes a computed member
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      regex: 'new Module\s*\(.{0,40}\).{0,800}\[.{0,120}\]\(\s*\w+\s*,\s*\w+\s*\)'
