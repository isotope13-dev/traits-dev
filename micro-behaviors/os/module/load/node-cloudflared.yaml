# Requiring a package proves module loading, not a tunnel opening.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: cloudflared-node-package-require
    desc: Node cloudflared package import
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'require\s*\(\s*["'']cloudflared["'']\s*\)'

