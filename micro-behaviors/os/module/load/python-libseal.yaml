# Libseal is an ordinary encrypted-module API. Its use alone establishes
# neither package compromise nor the behavior of the decrypted module.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-libseal-load-call
    desc: Calls libseal encrypted module loader
    if:
      type: symbol
      kind: call
      regex: '(^|\.)load_sealed(_sync)?$'
