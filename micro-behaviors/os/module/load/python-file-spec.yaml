defaults:
  platforms: [linux, macos, windows]
  for: [python]
traits:
  - id: python-importlib-spec-file-module-load
    desc: Python importlib file-spec module load
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)spec_from_file_location.{0,400}exec_module'

  - id: python-importlib-spec-exec-module
    platforms: [windows, unix]
    desc: Python importlib spec module execution
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'spec_from_file_location[\s\S]{0,500}exec_module\s*\('
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      # Tests import the hyphen-named script under test by path
      # (`spec_from_file_location("instinct_cli", ".../instinct-cli.py")`).
      - id: metadata/package/testing/presence/harness::python-test-file
