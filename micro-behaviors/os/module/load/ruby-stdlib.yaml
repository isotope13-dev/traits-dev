# Neutral Ruby stdlib require strings. A bare `require 'socket'` (etc.) is a
# capability, not a dropper signal — composites under
# objectives/command-and-control/dropper/ combine these with write/exec legs.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.85

traits:
  - id: require-net-http-single-quote
    desc: Requires net/http with single quotes
    if:
      type: string_literal
      substr: "'net/http'"

  - id: require-net-http-double-quote
    desc: Requires net/http with double quotes
    if:
      type: string_literal
      substr: '"net/http"'

  - id: require-socket-single-quote
    desc: Requires socket with single quotes
    if:
      type: string_literal
      substr: "'socket'"

  - id: require-socket-double-quote
    desc: Requires socket with double quotes
    if:
      type: string_literal
      substr: '"socket"'

  - id: require-tempfile-single-quote
    desc: Requires tempfile with single quotes
    if:
      type: string_literal
      substr: "'tempfile'"

  - id: require-tempfile-double-quote
    desc: Requires tempfile with double quotes
    if:
      type: string_literal
      substr: '"tempfile"'
