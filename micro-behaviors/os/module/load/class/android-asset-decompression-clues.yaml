---
defaults:
  platforms:
  - android
  for:
  - android_apk
  - zip
  - dex
  crit: suspicious
  conf: 0.9
composite_rules:
- id: android-asset-decompression-dex-clues
  desc: Android assets, decompression and DEX clues
  conf: 0.98
  all:
  - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
  - id: micro-behaviors/fs/path/app-data/platform::dalvik-get-files-dir-reference
  - id: micro-behaviors/data/decompress/gzip::dalvik-gzip-inputstream-class
  - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
  - id: micro-behaviors/os/module/load/class::dalvik-in-memory-dex-classloader
  unless:
  - id: micro-behaviors/os/application/target/advertising::facebook-audience-network-dynamic-loader
  - id: micro-behaviors/os/application/target/advertising::google-play-integrity-dynamic-loader
  - id: micro-behaviors/os/application/target/advertising::bytedance-apm-dynamic-loader
