defaults:
  platforms: [android]
composite_rules:
- id: apk-dalvik-reflection-stager
  for: [apk, zip, dex]
  desc: Android asset and reflection API references
  crit: notable
  conf: 0.97
  all:
  - id: metadata/package/files/mobile-package::android-apk-archive-layout
  - id: micro-behaviors/process/lifecycle/initialize::attach-base-context
  - id: micro-behaviors/os/module/load/class::dalvik-classloader-descriptor
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::dalvik-get-method-reference
  - id: metadata/binary/symbols/name/token/execution::invoke-word-token
  any:
  - id: metadata/package/files/android-assets::apk-asset-dex-member
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: metadata/package/files/android-assets::apk-opaque-shortext-asset
  unless:
  - id: metadata/package/testing/presence/path::android-apk-test-resources-path
