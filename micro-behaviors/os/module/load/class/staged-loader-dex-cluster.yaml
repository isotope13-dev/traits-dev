defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95

composite_rules:
- id: staged-loader-dex-cluster
  desc: Reflective DEX loader reference beside class-name fragment
  crit: suspicious
  conf: 0.995
  all:
  - id: micro-behaviors/os/module/load/class::reflective-dex-loader-member
  - id: metadata/binary/symbols/class::reflective-loader-cluster-marker

  # The size bound limits known SDK co-occurrences but can miss larger files.
