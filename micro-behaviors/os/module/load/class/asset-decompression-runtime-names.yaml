defaults:
  platforms: [android]
composite_rules:
  - id: asset-decompression-runtime-names
    desc: Asset loading and runtime reflection coexist
    crit: notable
    conf: 0.995
    for: [apk, zip, dex]
    all:
    - id: micro-behaviors/metaprogramming/reflection/resolve::android-runtime-reflection-classloader-names
    - id: micro-behaviors/os/module/load/class::android-asset-decompression-dex-clues
