defaults:
  platforms: [android]
  for: [elf]
  crit: notable
  conf: 0.88
  attack: "T1406"

traits:
  - id: memory-dex-classloader-fragment
    desc: Android in-memory DEX loader fragment
    crit: notable
    conf: 0.96
    if:
      type: text
    # Native string literals may be emitted as fixed-width adjacent fragments,
    # so the terminal "ader" may not be contiguous in the ELF.
      substr: MemoryDexClassLo

  - id: dex-classloader-jni-ctor
    desc: JNI DexClassLoader constructor signature
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/lang/ClassLoader;)V"

  - id: dex-path-list-element
    desc: Dalvik DexPathList Element class array
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "[Ldalvik/system/DexPathList$Element;"

composite_rules:
  - id: android-native-memory-dex-component-loader
    desc: JNI loads in-memory DEX code that manages app components
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/module/load/class::memory-dex-classloader-fragment
      - id: micro-behaviors/os/application/config::native-component-enable-fragment
      - id: metadata/binary/symbols/plugin::jni-onload-export
    unless:
      - id: well-known/lib/runtime/native-platform/unity/

