defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
  crit: notable
  conf: 0.9

traits:
  - id: base-dex-class-loader
    desc: BaseDexClassLoader referenced directly
    conf: 0.92
    for: [dex]
    if:
      type: text
      substr: "dalvik.system.BaseDexClassLoader"

  - id: dex-elements-field
    desc: DEX names dexElements classloader field
    conf: 0.94
    for: [dex]
    if:
      type: text
      substr: "dexElements"

  - id: path-list-field
    desc: DEX names pathList classloader field
    conf: 0.92
    for: [dex]
    if:
      type: text
      substr: "pathList"

  # DexPathList's private element factories. Calling one reflectively builds
  # classloader elements for DEX files the platform never registered -- the
  # step that splices a decrypted stage into the running app's classloader.
  - id: dex-path-list-element-factory
    desc: Names DexPathList element factory method
    conf: 0.93
    for: [dex]
    if:
      type: text
      regex: '^make(Dex|Path|InMemoryDex)Elements$'

  # ActivityThread.mInitialApplication holds the process's Application
  # object. Only code that replaces the running Application (a packer's stub
  # handing over to the decrypted real one, or a hot-patch framework) names it.
  - id: dalvik-classloader-descriptor
    desc: Dalvik ClassLoader descriptor
    crit: component
    conf: 0.86
    for: [dex]
    if:
      type: text
      substr: "Ljava/lang/ClassLoader;"

  - id: dalvik-runtime-classloader-descriptor
    desc: Dalvik runtime ClassLoader descriptor
    crit: notable
    conf: 0.9
    for: [class, dex]
    if:
      type: text
      regex: 'Ldalvik/system/(BaseDexClassLoader|DexClassLoader|PathClassLoader);'

  - id: dalvik-in-memory-dex-classloader
    desc: Dalvik in-memory DEX class loader reference
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Ldalvik/system/InMemoryDexClassLoader;"

  - id: android-runtime-classloader-fields
    desc: Reflection names package classloader fields
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      word: "mPackages"

  - id: android-context-classloader-setter
    desc: DEX names setContextClassLoader method
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      word: "setContextClassLoader"

  - id: encoded-android-runtime-fields
    desc: Encoded Android runtime fields
    crit: suspicious
    conf: 0.95
    for: [dex]
    if:
      type: yara
      source: |
        rule encoded_android_runtime_fields {
          strings:
            $a = "bU1haW5UaHJlYW" ascii
            $b = "bVBhY2thZ2VJbmZv" ascii
            $c = "bUFwcGxpY2F0aW9u" ascii
          condition:
            all of them
        }

  - id: encoded-android-asset-loader
    desc: Encoded Android staged asset name
    crit: suspicious
    conf: 0.94
    for: [dex]
    if:
      type: yara
      source: |
        rule encoded_android_asset_loader {
          strings:
            $a = "bmd5Ym1h" ascii
            $b = "bXNiaGd0Zw" ascii
            $c = "cGF0aExpc3Q" ascii
          condition:
            all of them
        }

  - id: encoded-cjnejwgbazc-runtime-fields
    desc: Encoded Android runtime swap fields
    crit: suspicious
    conf: 0.96
    count_min: 6
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2JhemNt"

  - id: encoded-cjnejwgbazc-stage-asset
    desc: Encoded Android staged asset name
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2JhemN5cXdzcmNqbmVqd2diYXpj"

  - id: encoded-cjnejwgbazc-dex-elements
    desc: Encoded dexElements field name
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2JhemNkZXhFbGVtZW50c2NqbmVqd2diYXpj"

  - id: encoded-cjnejwgbazc-path-list
    desc: Encoded pathList field name
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2JhemNwYXRoTGlzdGNqbmVqd2diYXpj"

  - id: encoded-hqjgwjslwxj-runtime-fields
    desc: Encoded Android runtime swap fields
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "aHFqZ3dqc2x3eGptSW5pdGlhbEFwcGxpY2F0aW9u"

  - id: encoded-hqjgwjslwxj-stage-asset
    desc: Encoded Android staged asset name
    crit: notable
    conf: 0.95
    for: [dex]
    if:
      type: text
      substr: "aHFqZ3dqc2x3eGphZXFhdGtidWhxamd3anNsd3hq"

  - id: encoded-hqjgwjslwxj-dex-elements
    desc: Encoded dexElements field name
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "aHFqZ3dqc2x3eGpkZXhFbGVtZW50c2hxamd3anNsd3hq"

  - id: encoded-hqjgwjslwxj-path-list
    desc: Encoded pathList field name
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "aHFqZ3dqc2x3eGpwYXRoTGlzdGhxamd3anNsd3hq"

  - id: dex-file-api
    desc: Dalvik DexFile loader API
    conf: 0.92
    for: [dex]
    if:
      type: text
      substr: "dalvik.system.DexFile"

composite_rules:
  - id: android-in-memory-asset-dex-loader
    desc: Android decrypts and loads an in-memory DEX from an asset
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/module/load/class::dalvik-in-memory-dex-classloader
      - id: micro-behaviors/data/decompress/gzip::dalvik-gzip-inputstream-class
      - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
      - id: micro-behaviors/process/lifecycle/initialize::attach-base-context
    unless:
      - id: micro-behaviors/os/application/target/advertising::facebook-audience-network-dynamic-loader

  - id: android-application-classloader-hijack
    desc: Android application classloader hijack through ActivityThread internals
    crit: suspicious
    conf: 0.995
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-dex-communication-features
      - id: well-known/app/system/motorola-launcher::motorola-launcher-dex-features
      - id: metadata/package/testing/
    all:
      - id: metadata/file/profile/operation-reference::android-activitythread-reflection
      - id: metadata/lang/source/naming/function/runtime::android-activitythread-current-method
      - id: micro-behaviors/os/module/load/class::android-runtime-classloader-fields
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-field
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass
      - id: micro-behaviors/os/module/load/class::android-context-classloader-setter

  - id: reflective-classloader-patch
    desc: Reflective BaseDexClassLoader element patching
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/module/load/class::base-dex-class-loader
      - id: micro-behaviors/os/module/load/class::dex-elements-field
      - id: micro-behaviors/os/module/load/class::path-list-field
    any:
      - id: metadata/binary/symbols/descriptor::reflective-array
      - id: micro-behaviors/process/lifecycle/initialize::attach-base-context

  - id: reflective-dex-loader-member
    desc: Reflective DexFile classloader patching chain
    for: [android_apk, zip, dex, class]
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/module/load/class::base-dex-class-loader
      - id: micro-behaviors/os/module/load/class::dex-elements-field
      - id: micro-behaviors/os/module/load/class::path-list-field
      - id: micro-behaviors/os/module/load/class::dex-file-api
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-field
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-method
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass
      - id: micro-behaviors/fs/write/file/stream::file-output-stream-call
      - id: micro-behaviors/data/archive/extract/zip::jvm-zipfile-class-reference
    needs: 2

  - id: asset-inflater-reflective-loader
    desc: Asset inflater with reflective loader invoke
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/resource::dalvik-asset-manager-class
      - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
      - id: metadata/file/profile/encoding::android-base64-class-reference
      - id: micro-behaviors/data/decompress/zlib::dalvik-inflater-input-stream
      - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
      - id: micro-behaviors/fs/path/app-data::dalvik-get-files-dir-reference
      - id: micro-behaviors/os/module/load/class::dalvik-classloader-descriptor
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dalvik-reflect-constructor-class
      - id: metadata/binary/symbols/descriptor::dalvik-reflect-method-class
    unless:
      - id: well-known/app/system/ankidroid::package-member
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dalvik-get-method-reference
      - id: metadata/binary/symbols/name/token::invoke-word-token

  - id: encoded-application-swap-loader
    desc: Encoded Android application swap loader
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/lang/source/literal/string::encoded-loader-delimiter
      - id: micro-behaviors/os/module/load/class::encoded-android-runtime-fields
      - id: micro-behaviors/os/module/load/class::encoded-android-asset-loader
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-field
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-method
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass
      - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
    needs: 2

  - id: encoded-delimited-application-swap-loader
    desc: Delimited encoded Android application swap loader
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/lang/source/literal/string::encoded-cjnejwgbazc-delimiter
      - id: micro-behaviors/os/module/load/class::encoded-cjnejwgbazc-runtime-fields
      - id: micro-behaviors/os/module/load/class::encoded-cjnejwgbazc-stage-asset
      - id: micro-behaviors/os/module/load/class::encoded-cjnejwgbazc-dex-elements
      - id: micro-behaviors/os/module/load/class::encoded-cjnejwgbazc-path-list
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-field
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-method
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass
      - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
    needs: 2

  - id: encoded-hqjgwjslwxj-application-swap-loader
    desc: Delimited encoded Android application swap loader
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/lang/source/literal/string::encoded-hqjgwjslwxj-delimiter
      - id: micro-behaviors/os/module/load/class::encoded-hqjgwjslwxj-runtime-fields
      - id: micro-behaviors/os/module/load/class::encoded-hqjgwjslwxj-stage-asset
      - id: micro-behaviors/os/module/load/class::encoded-hqjgwjslwxj-dex-elements
      - id: micro-behaviors/os/module/load/class::encoded-hqjgwjslwxj-path-list
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-field
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::jvm-get-declared-method
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass
      - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
    needs: 2
