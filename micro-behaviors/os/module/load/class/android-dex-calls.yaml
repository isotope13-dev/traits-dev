defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: android-dex-classloader-constructor
    desc: Constructs an Android DEX class loader
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Ldalvik/system/DexClassLoader;-><init>
  - id: dex-context-classloader-call
    desc: DEX reads context class loader
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/content/Context;->getClassLoader'
