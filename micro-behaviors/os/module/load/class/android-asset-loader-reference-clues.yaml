defaults:
  platforms: [android]
# DEX references may originate in unrelated libraries and do not prove staging.
composite_rules:
- id: android-asset-classloader-reference-clues
  for: [apk, zip, dex]
  desc: Asset and dynamic classloader API references coexist
  crit: notable
  conf: 0.97
  unless:
  - id: well-known/lib/vendor-sdk/google-mobile-ads/
  all:
  - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
  - id: micro-behaviors/fs/path/app-data/platform::dalvik-get-files-dir-reference
  - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
  - id: metadata/lang/source/naming/function/runtime::android-context-classloader-method-name
  - id: micro-behaviors/os/module/load/class::dalvik-classloader-descriptor
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass
  - id: micro-behaviors/os/module/load/class::dynamic-dex-loading-api

- id: android-asset-classloader-socket-reference-clues
  desc: Asset, classloader and socket API references coexist
  crit: notable
  conf: 0.96
  scope: outer
  for: [apk, zip, dex]
  all:
  - id: micro-behaviors/os/module/load/class::android-asset-classloader-reference-clues
  - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference

- id: android-asset-classloader-invoke-reference-clues
  desc: Asset, classloader and invoke references coexist
  crit: notable
  conf: 0.95
  for: [dex]
  all:
  - id: micro-behaviors/os/module/load/class::android-asset-classloader-reference-clues
  - id: metadata/binary/symbols/name/token/execution::invoke-word-token

- id: android-xapk-classloader-reference-clues
  desc: XAPK split bundle has asset and classloader references
  crit: notable
  conf: 0.97
  for: [zip]
  scope: outer
  all:
  - id: metadata/package/files/mobile-package::archive-android-apk-member
  - id: metadata/package/files/mobile-package::archive-android-config-split-apk
  - id: micro-behaviors/os/module/load/class::android-asset-classloader-reference-clues

- id: android-asset-decompression-classloader-reference-clues
  desc: Android asset, decompression and classloader references coexist
  crit: notable
  conf: 0.97
  for: [apk, zip, dex]
  all:
  - id: micro-behaviors/os/module/load/class::android-asset-classloader-reference-clues
  - id: micro-behaviors/os/module/load/class::android-asset-decompression-dex-clues


- id: android-in-memory-dex-asset-decompression-clues
  desc: Asset, decompression and in-memory DEX references coexist
  crit: notable
  conf: 0.995
  for: [apk, zip, dex]
  all:
  - id: micro-behaviors/os/module/load/class::android-in-memory-asset-dex-loader
  - id: micro-behaviors/os/module/load/class::android-asset-decompression-dex-clues
  unless:
  - id: micro-behaviors/os/application/target/advertising::facebook-audience-network-dynamic-loader
  - id: micro-behaviors/os/application/target/advertising::google-play-integrity-dynamic-loader
  - id: micro-behaviors/os/application/target/advertising::bytedance-apm-dynamic-loader

