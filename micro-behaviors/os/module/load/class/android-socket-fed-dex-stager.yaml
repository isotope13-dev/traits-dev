defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95

composite_rules:
- id: android-socket-fed-dex-stager
  desc: DEX classloader, socket and wake-lock references in a compact DEX
  crit: suspicious
  conf: 0.95
  for: [dex]
  size_max: 4000000
  all:
  - id: micro-behaviors/os/module/load/class::dex-class-loader
  - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  - id: micro-behaviors/communications/socket/create::java-server-socket-bytecode-reference
  - id: micro-behaviors/os/service/daemon::android-wake-lock-bytecode-reference
