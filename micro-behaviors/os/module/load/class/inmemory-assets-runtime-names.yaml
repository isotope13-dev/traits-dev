defaults:
  platforms: [android]
composite_rules:
  - id: inmemory-assets-runtime-names
    desc: Asset loading and runtime reflection coexist
    crit: notable
    conf: 0.995
    for: [apk, zip, dex]
    all:
    - id: micro-behaviors/os/module/load/class::android-in-memory-asset-dex-loader
    - id: micro-behaviors/metaprogramming/reflection/resolve::android-runtime-reflection-classloader-names
