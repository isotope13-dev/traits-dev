defaults:
  platforms: [android]
  for: [elf]
  crit: suspicious
  conf: 0.88
composite_rules:
  - id: jni-export-dex-file-api-clues
    desc: JNI exports, DEX signature and file API clues
    conf: 0.98
    all:
      - id: metadata/binary/symbols/name/export::short-obfuscated-jni-exports
      - id: metadata/binary/symbols/name/export::data-ptr-export
      - id: metadata/binary/symbols/name/qualified/security::loader-class-return-signature
    any:
      - id: micro-behaviors/fs/file/open/unspecified::fopen
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol
