defaults:
  platforms: [android]
  for: [android_apk, binaries]
  crit: notable
  conf: 0.9
  attack: "T1406"

traits:
  - id: dex-class-loader-source
    desc: Android source imports DexClassLoader
    for: [java, kotlin]
    conf: 0.92
    if:
      type: symbol
      kind: import
      exact: dalvik.system.DexClassLoader

  - id: dex-class-loader
    desc: DexClassLoader dynamic code loading
    mbc: "C0021"
    if:
      type: text
      substr: "Ldalvik/system/DexClassLoader;"

  - id: path-class-loader
    desc: PathClassLoader runtime class loading
    conf: 0.8
    if:
      type: text
      substr: "Ldalvik/system/PathClassLoader;"

composite_rules:
  - id: dynamic-dex-loading-api
    desc: Class capable of loading a DEX at runtime
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/module/load/class::dex-class-loader
      # `path-class-loader` is deliberately absent: PathClassLoader is the
      # platform's own loader for the APK's own DEXes, which every app has and
      # every multidex app names (shadowsocks-android does). It says nothing
      # about loading code staged from outside the package.
      - id: micro-behaviors/os/module/load/class::base-dex-class-loader
      - id: micro-behaviors/os/module/load/class::dalvik-in-memory-dex-classloader
      - id: micro-behaviors/os/module/load/class::dex-file-api
  - id: dynamic-dex-loading
    desc: Android dynamic DEX code loading
    # Runtime DEX loading is a capability. Libraries such as Google Mobile
    # Ads use it for their own optimized components; intent requires a higher
    # level objective composite.
    crit: notable
    conf: 0.92
    mbc: "C0021"
    any:
      - id: micro-behaviors/os/module/load/class::dex-class-loader-source
      - id: micro-behaviors/os/module/load/class::dex-class-loader
      - id: micro-behaviors/os/module/load/class::path-class-loader
      - id: micro-behaviors/os/module/load/class::dalvik-in-memory-dex-classloader
      - id: micro-behaviors/fs/path/library::dex-format-template

  - id: dynamic-dex-and-native-loading
    desc: Android dynamic DEX and native loading
    crit: notable
    conf: 0.94
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    all:
      - id: micro-behaviors/os/module/load/class::dynamic-dex-loading
      - id: micro-behaviors/dylib/load/runtime::system-load-library-call
