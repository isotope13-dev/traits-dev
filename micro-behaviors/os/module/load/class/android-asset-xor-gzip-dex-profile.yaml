defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
composite_rules:
- id: android-asset-xor-gzip-dex-profile
  desc: Asset, XOR, gzip and DEX loader co-occur
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/fs/file/open/unspecified::android-asset-open-source
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::java-indexed-byte-scalar-xor
  - id: micro-behaviors/data/decompress/gzip::gzip-byte-array-input-source
  - id: micro-behaviors/os/module/load/class::dex-class-loader-source
  near_lines: 48
