defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: js-computed-import
    desc: Imports a variable or property module specifier
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (import)
          arguments: (arguments .
            [(identifier) (member_expression) (subscript_expression)])) @load
        (call_expression
          function: (import)
          arguments: (arguments . (comment)+ .
            [(identifier) (member_expression) (subscript_expression)])) @load
