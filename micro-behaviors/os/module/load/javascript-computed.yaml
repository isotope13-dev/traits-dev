defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: js-computed-import
    desc: Dynamically imports a variable module reference
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (import)
          arguments: (arguments . (comment)* .
            [(identifier) (member_expression)])) @load
