# Wix Thunderbolt / Velo registry module surface. Real site bundles ship these
# names from @wix/* packages; typosquat npm tarballs reuse the filenames and
# export shapes to hijack resolution.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits: []
composite_rules: []
  # The API surface also occurs in legitimate Wix bundles. Hostile consumers
  # must supply independent execution and exfiltration evidence.
