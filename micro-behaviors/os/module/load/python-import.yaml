defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: dunder-import-call
    desc: Python dynamically loads a module
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: __import__
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - type: text
        regex: '__import__\(\s*[''"]pkgutil[''"]\s*\)\.extend_path'
      - type: text
        regex: '__import__\(\s*[''"]pkg_resources[''"]\s*\)\.declare_namespace'
      # Lazy-load split data tables (unidecode.xNNN, similar sharded modules).
      - type: text
        regex: '__import__\(\s*[''"][^''"]+\.x%03x[''"]'
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
