defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: windows-lockdown-policy-module
    desc: Windows Lockdown Policy module name
    crit: baseline
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: '77 6C 64 70 2E 64 6C 6C 00'
  - id: get-current-process
    desc: Get current process handle
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetCurrentProcess
composite_rules:
