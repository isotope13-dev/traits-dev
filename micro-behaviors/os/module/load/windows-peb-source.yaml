# Source mechanics for constructing a Windows loader-table entry and linking it
# into the current process's PEB. Custom in-memory loaders can use these without
# malicious intent; objective rules add the camouflage interpretation.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1620

traits:
  - id: ldr-entry-dll-base-write-source
    desc: Writes loader-entry image base
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '->\s*DllBase\s*='

  - id: ldr-entry-image-size-write-source
    desc: Writes loader-entry image size
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '->\s*SizeOfImage\s*='

  - id: ldr-entry-name-write-source
    desc: Writes loader-entry module names
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '->\s*(BaseDllName|FullDllName)\s*='

  - id: ldr-entry-entrypoint-write-source
    desc: Writes loader-entry entry point
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '->\s*EntryPoint\s*='

  - id: ldr-entry-hash-blink-self-link-source
    desc: Self-links loader hash backward pointer
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '->\s*HashLinks\.Blink\s*=\s*&\s*\w+->\s*HashLinks\s*;'

  - id: ldr-entry-hash-flink-self-link-source
    desc: Self-links loader hash forward pointer
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '->\s*HashLinks\.Flink\s*=\s*&\s*\w+->\s*HashLinks\s*;'

  - id: ldr-entry-load-list-insert-source
    desc: Inserts into PEB load-order list
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'InsertTailList\s*\([^;\n]{0,200}InLoadOrderModuleList'

  - id: ldr-entry-memory-list-insert-source
    desc: Inserts into PEB memory-order list
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'InsertTailList\s*\([^;\n]{0,200}InMemoryOrderModuleList'

composite_rules:
  - id: ldr-entry-image-metadata-writes-source
    desc: Populates synthetic loader image metadata
    crit: notable
    conf: 0.98
    all:
      - id: ldr-entry-dll-base-write-source
      - id: ldr-entry-image-size-write-source
      - id: ldr-entry-name-write-source
      - id: ldr-entry-entrypoint-write-source
    near_bytes: 1200

  - id: ldr-entry-self-linked-hash-source
    desc: Self-links a loader-entry hash chain
    crit: suspicious
    conf: 0.99
    all:
      - id: ldr-entry-hash-blink-self-link-source
      - id: ldr-entry-hash-flink-self-link-source
    near_bytes: 320

  - id: ldr-entry-dual-list-insertion-source
    desc: Inserts into both PEB loader lists
    crit: notable
    conf: 0.99
    all:
      - id: ldr-entry-load-list-insert-source
      - id: ldr-entry-memory-list-insert-source
    near_bytes: 640
