defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  # Also describes snippets in documentation without convicting the document.
  - id: php-include-upload-temporary-file
    desc: PHP includes uploaded temporary file
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((include_expression (parenthesized_expression
          (subscript_expression
            (subscript_expression (variable_name (name) @source))
            [(string . (string_content) @key .)
             (encapsed_string . (string_content) @key .)]))) @include
        (#eq? @source "_FILES")
        (#eq? @key "tmp_name"))
