# A host that runs generated or user-authored JavaScript with a `require`
# argument can hand it the real loader (full module access) or a shim that
# resolves only an explicit allowlist and refuses everything else. The shim is
# a scoping control the host declares in its own source: an allowlist
# membership test plus a refusal error that names the rejected module.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: require-refusal-error
    desc: Throws when a module is not allowed
    if:
      type: text
      regex: 'require\(.{1,40}\) is not (available|allowed|permitted)'
