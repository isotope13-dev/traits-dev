# Windows system module names appearing inside a non-Windows native binary
# (ELF / Mach-O). The matchers here find nothing but the module name string:
# cross-compilers, PE parsers, Wine, emulators, malware-analysis engines and
# porting shims all carry them, so the name alone infers no intent. Composites
# in objectives/ supply the intent leg (e.g. an API-hash generator template)
# and reference these by full id.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: component
  conf: 0.86
traits:
  - id: bcrypt-dll-name-in-native
    desc: References the bcrypt.dll module name
    if:
      type: text
      substr: bcrypt.dll
  - id: crypt32-dll-name-in-native
    desc: References the crypt32.dll module name
    if:
      type: text
      substr: crypt32.dll
  - id: kernel32-dll-name-in-native
    desc: References the kernel32.dll module name
    if:
      type: text
      substr: kernel32.dll
  - id: ntdll-dll-name-in-native
    desc: References the ntdll.dll module name
    if:
      type: text
      substr: ntdll.dll
  - id: winhttp-dll-name-in-native
    desc: References the winhttp.dll module name
    if:
      type: text
      substr: winhttp.dll

composite_rules:
  - id: windows-system-dll-name-set
    desc: Native binary names several Windows system DLLs
    crit: notable
    conf: 0.9
    any:
      - id: bcrypt-dll-name-in-native
      - id: crypt32-dll-name-in-native
      - id: kernel32-dll-name-in-native
      - id: ntdll-dll-name-in-native
      - id: winhttp-dll-name-in-native
    needs: 3
