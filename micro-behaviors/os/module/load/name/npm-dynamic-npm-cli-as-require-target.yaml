defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: npm-cli-as-require-target
    desc: Imports npm module
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: require\(\s*["']npm["']\s*\)|\bfrom\s+["']npm["']
# Invoking npm install at runtime is how CLIs and project bootstrappers
# install a requested package. Hidden or scripted abuse is the stealth and
# secondary-tgz composites, which keep their own criticality.
