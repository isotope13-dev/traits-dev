defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: notable
  conf: 0.86
traits:
  - id: bcrypt-dll-name-in-native
    desc: References the bcrypt.dll module name
    if:
      type: text
      substr: bcrypt.dll
  - id: crypt32-dll-name-in-native
    desc: References the crypt32.dll module name
    if:
      type: text
      substr: crypt32.dll
  - id: kernel32-dll-name-in-native
    desc: References the kernel32.dll module name
    if:
      type: text
      substr: kernel32.dll
  - id: ntdll-dll-name-in-native
    desc: References the ntdll.dll module name
    if:
      type: text
      substr: ntdll.dll
  - id: winhttp-dll-name-in-native
    desc: References the winhttp.dll module name
    if:
      type: text
      substr: winhttp.dll

composite_rules:
  - id: windows-system-dll-name-set
    desc: Native binary names several Windows system DLLs
    conf: 0.9
    any:
      - id: micro-behaviors/os/module/load/name::bcrypt-dll-name-in-native
      - id: micro-behaviors/os/module/load/name::crypt32-dll-name-in-native
      - id: micro-behaviors/os/module/load/name::kernel32-dll-name-in-native
      - id: micro-behaviors/os/module/load/name::ntdll-dll-name-in-native
      - id: micro-behaviors/os/module/load/name::winhttp-dll-name-in-native
    needs: 3
