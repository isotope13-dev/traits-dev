defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]
composite_rules:
  - id: install-hook-module-call-temp-error-clues
    for: [python]
    desc: Install hook has module call and temp error-log clues
    crit: suspicious
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
      - id: micro-behaviors/os/module/load/name::indented-import-followed-call
      - id: micro-behaviors/data/control-flow/error-handling/catch::broad-exception-near-file-open
      - id: micro-behaviors/fs/file/open/unspecified::python-open-hardcoded-tmp-path

