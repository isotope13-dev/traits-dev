defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: mutable-url-dependency-install-require-clues
    desc: Mutable URL dependency and install-time require clues
    crit: suspicious
    conf: 0.99
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/dependencies/direct-url::dep-github-mutable-branch-archive
      - id: metadata/package/dependencies/source::npm-single-https-runtime-dependency
      - id: micro-behaviors/os/module/require::postinstall-bare-module-require
      - id: micro-behaviors/os/module/require::node-bracket-module-require-call
