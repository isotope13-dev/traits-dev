defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: node-fs-binding
    desc: Binds Node filesystem module as fs
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @name
              value: (call_expression function: (identifier) @loader
                arguments: (arguments . (string (string_fragment) @module) .)))))
          (#eq? @name "fs")
          (#eq? @loader "require")
          (#match? @module "^(node:)?fs$"))

