defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: public-url-dependency-side-effect-import-clues
    for: [package.json, javascript, npm]
    desc: Public package has URL dependency and side-effect import clues
    crit: suspicious
    conf: 0.98
    scope: package
    all:
      - id: metadata/package/dependencies/source::npm-https-runtime-dependency
      - id: metadata/package/publishing::npm-public-publish-access
      - id: micro-behaviors/os/module/require::esm-side-effect-package-import
    unless:
      - id: well-known/tool/development/aube::aube-published-npm-package
      - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
      # The official SheetJS release channel is a tarball on its own CDN.
      - id: well-known/lib/format/sheetjs-xlsx::sheetjs-cdn-tarball-dependency
      - id: metadata/package/publishing::is-private
      # A tagged GitHub release tarball is a pinned UI asset, not a mutable drop host.
      - id: metadata/package/dependencies/source::npm-github-release-tarball-dependency
      # A GitHub repository URL is a public VCS repository, not a direct drop host.
      - id: metadata/package/dependencies/source::npm-github-repository-dependency
