# The importlib sink is real, but the staged script path is not tied to the
# spec_from_file_location argument by these composites.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-importlib-http-script-write-profile
    desc: Python importlib module load near URL and script write clues
    crit: suspicious
    conf: 0.98
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/download/write::python-urlopen-script-write-profile
      - id: micro-behaviors/os/api-resolution/dynamic::python-importlib-spec-exec-module

  - id: python-importlib-http-script-write-cleanup-profile
    desc: Python importlib load, URL/write and cleanup clues
    crit: suspicious
    conf: 0.99
    scope: file
    near_lines: 96
    all:
      - id: python-importlib-http-script-write-profile
      - id: micro-behaviors/fs/delete/file/library::py-remove
      - id: micro-behaviors/os/api-resolution/dynamic::python-importlib-spec-exec-module
