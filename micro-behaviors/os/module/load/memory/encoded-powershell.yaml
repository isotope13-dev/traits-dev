defaults:
  platforms: [windows]
  for: [vbs]
traits:
  - id: encoded-powershell-assembly-load
    desc: Encoded PowerShell calls Assembly.Load
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\[\s*(System\.)?Reflection\.Assembly\s*\]::Load\s*\('
