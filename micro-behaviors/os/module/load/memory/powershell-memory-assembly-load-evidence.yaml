defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: powershell-memory-assembly-load-evidence
    desc: PowerShell in-memory assembly loading references
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::powershell-appdomain-currentdomain-load
      - id: micro-behaviors/metaprogramming/reflection/resolve::clr-internal-nloadimage-call
      - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load-variable-argument
