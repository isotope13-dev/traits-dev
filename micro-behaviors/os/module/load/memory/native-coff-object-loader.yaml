# Native COFF object loaders execute a relocatable object from memory without
# writing it to disk. The call name is the BOF-loader naming convention; the
# composites that cite it supply the origin of the object bytes.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9
traits:
  - id: native-coff-object-loader-call
    desc: Native call loads COFF object from memory
    if:
      type: symbol
      kind: call
      regex: '^(coff|bof)_?(go|load|exec|run|loader)$'
