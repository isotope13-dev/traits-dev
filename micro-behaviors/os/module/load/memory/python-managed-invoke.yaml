defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-loaded-assembly-method-invocation
    desc: Python invokes loaded .NET assembly method
    if:
      type: symbol
      kind: call
      regex: '\.Invoke$'
      receiver:
        from:
          call: '^Assembly\.Load$'
          through:
            - call: '\.GetType$'
              receiver: true
            - call: '\.GetMethod$'
              receiver: true
