defaults:
  platforms: [windows]
  for: [batch, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-appdomain-load-variable
    desc: PowerShell calls AppDomain.Load with a variable
    if:
      type: text
      regex: '(?i)\[System\.AppDomain\]::CurrentDomain\.Load\(\s*\$[A-Za-z_]\w*'

composite_rules:
  - id: powershell-hidden-reversed-appdomain-entrypoint-loader
    desc: Hidden script reverses data near AppDomain.Load
    crit: suspicious
    conf: 0.98
    attack: T1027,T1059.001,T1140,T1564.003,T1620
    near_bytes: 800
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/data/codec::powershell-gzipstream
      - id: micro-behaviors/data/decompress/stream::powershell-compressionmode-decompress
      - id: micro-behaviors/data/collection/array::powershell-array-reverse-call
      - id: powershell-appdomain-load-variable
      - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-entrypoint-delegate-dispatch
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
