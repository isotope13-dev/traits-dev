defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-load-member-name-variants
    desc: Load member-name variants
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
      - id: metadata/file/encoding::reversed-load-member-text
      - id: metadata/file/encoding::base64-load-member-text
