defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-module-builtin-require
    desc: Requires the Node module builtin
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: symbol
      kind: call
      exact: require
      arg:
        kind: string
        exact: module

  - id: node-global-os-module-exposure
    desc: Exposes Node os module through globalThis
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: 'globalThis\s*\[\s*["'']os["'']\s*\]\s*='

  - id: node-runtime-os-module-exposure
    desc: Exposes Node os through runtime object
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\[[''\"]os[''\"]\]\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\s*(,|;)'

  - id: webpack-runtime-chunk-load
    desc: Loads a Webpack chunk named runtime
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.e\(["'']runtime["'']\)'

  - id: node-require-resolve-package-name
    desc: Resolves a named Node package
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\brequire\.resolve\s*\(\s*(packageName|[A-Za-z_$][A-Za-z0-9_$]*PackageName)\b'

  - id: node-require-wrapper-prototype
    desc: Wraps Node require function
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "Object\\.setPrototypeOf\\(function\\s+\\w*WrappedRequire"

  - id: node-require-function-rebind
    desc: Rebinds Node require function
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: "require\\s*=\\s*\\(function\\s*\\(req\\)"
  - id: node-require-returning-getter
    desc: Object getter exposes the Node require function
    crit: notable
    conf: 0.95
    if:
      type: text
      # Handles identifier-obfuscated quoted getters such as a name padded
      # with literal Unicode escape sequences.
      regex: 'get"[^"\r\n]{1,180}"\(\)\{return require\}'
  - id: node-require-binding-reassignment
    desc: Reassigns the CommonJS require binding
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^[ \\t]*require[ \\t]*='
  - id: local-native-addon-require
    desc: Requires local native addon
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "require\\(['\"]\\./[^'\"\\n]{1,120}\\.node['\"]\\)"
  - id: node-platform-native-addon-map
    desc: Platform map selects local native addon
    crit: notable
    conf: 0.95
    attack: T1129
    if:
      type: text
      regex: '(?i)(win32|darwin|linux)\s*:\s*["'']\./[^"''\r\n]{1,120}\.node["'']'
  - id: node-computed-local-require
    desc: Requires a computed local module path
    crit: notable
    conf: 0.94
    attack: T1129
    if:
      type: text
      regex: 'require\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.join\s*\(\s*__dirname'
  - id: node-native-addon-install-call
    desc: Calls install from a native addon
    crit: notable
    conf: 0.96
    attack: T1129,T1059.007
    if:
      type: text
      regex: '\{\s*install\s*\}\s*=\s*require\s*\([^;\n]{1,240}\)[\s\S]{0,100}\binstall\s*\(\s*\)'
  - id: cjs-require-in-try-fallback
    desc: CommonJS require inside try fallback
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'try\s*\{[\s\S]{0,180}require\('
  - id: cjs-require-in-catch-fallback
    desc: CommonJS require inside a catch fallback
    crit: notable
    conf: 0.9
    if:
      # The leading `[^.\w$]` keeps this on the bare CommonJS `require(`.  A
      # member call such as `sap.ui.require([...])` (the UI5/AMD loader) or
      # `foo.require(x)` is a library method, not a CommonJS module load.
      type: text
      regex: 'catch\s*(\([^)]{0,80}\))?\s*\{[^}]{0,560}[^.\w$]require\s*\('

  - id: prebuilt-native-addon-require
    desc: Requires prebuilt native addon
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: "require\\(['\"]\\./prebuilt/[^'\"\\n]{1,120}\\.node['\"]\\)"
  - id: js-side-effect-require
    desc: Side-effect require without binding
    crit: component
    conf: 0.75
    if:
      type: text
      regex: '^\s*require\s*\(\s*["''](\./|\.\./|/)[^"''\n]{1,80}["'']\s*\)\s*;?\s*$'
    unless:
      - type: text
        regex: '^#!/usr/bin/env\s+node\b'
  - id: cjs-side-effect-package-require
    desc: CommonJS side-effect-only package require
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: "(?m)^\\s*require\\s*\\(['\"](@[^'/]{1,30}/)?[A-Za-z0-9][^'\"]{0,50}['\"]\\)\\s*;?\\s*$"
  - id: scoped-config-package-import
    desc: Imports a scoped npm configuration package
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: '^@[a-z0-9][a-z0-9._-]{1,80}/config$'
  - id: esm-side-effect-package-import
    desc: ESM side-effect-only package import
    crit: notable
    conf: 0.9
    if:
      type: text
      # Bare specifier only: leading "." or "/" means a relative/absolute file,
      # which is micro-behaviors/os/module/load::esm-side-effect-local-import.
      regex: '(?m)^\s*import\s+["''][^"''/.][^"''\n]{0,70}["'']\s*;?\s*$'
    unless:
      # Declaration imports are erased and do not establish runtime loading.
      - id: metadata/lang/scripted::dts-declaration-file
      # Dart files parse as JavaScript, and `import 'package:flutter/…';` is a
      # namespace import there, not an ESM side-effect-only import.
      - id: metadata/file/extension/identity::dart-source-basename
  - id: esm-side-effect-local-import
    desc: ESM side-effect-only local import
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*import\s+["'']\.\.?/[^"'']{1,80}["'']\s*;?[ \t]*$'
    unless:
      # Declaration imports are erased and do not establish runtime loading.
      - id: metadata/lang/scripted::dts-declaration-file
  - id: esm-side-effect-dot-js-package-import
    desc: ESM side-effect import of a .js-named package
    crit: notable
    conf: 0.9
    if:
      type: text
      # The bare specifier must be a TOP-LEVEL package name ending in `.js`
      # (`import "lodash.js";`) — the shape a `.js` name-squat takes. Both
      # operand classes exclude "/", so a subpath import of an ordinary
      # package (`import "regenerator-runtime/runtime.js";`) is not this.
      regex: '(?m)^\s*import\s+["''][^"''/.\n][^"''/\n]{0,50}\.js["'']\s*;?\s*$'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/extension/identity::dart-source-basename
  - id: js-require-extensions-mutate
    desc: require.extensions mutated
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'require\.extensions\s*\[\s*["''][^"''\n]{1,40}["'']\s*\]\s*='
  - id: js-module-resolvefilename-override
    desc: Module._resolveFilename override
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Module\._resolveFilename\s*='
    not:
      - substr: "originalModuleResolveFilename"
  - id: dynamic-import-string-literal
    desc: Dynamically imports a literal module path
    crit: notable
    conf: 0.8
    if:
      # Match a runtime import call node, not a TypeScript import type such as
      # `import('pkg').Type`, which is erased and does not load a module.
      type: tree-sitter
      query: |
        (
          (_
            (call_expression
              function: (import)
          arguments: (arguments (string) @module)) @call) @parent
          (#not-match? @module "^[\"']?@(components|pages|utils|hooks)/")
          (#not-match? @module "^[\"']?@(constants|apis|styles|types)/")
          (#not-match? @parent "\\)\\s*\\.")
        )
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      # Type-only declaration imports are erased and never load at runtime.
      - id: metadata/lang/scripted::dts-declaration-file
      - type: basename
        regex: '\.d\.ts$'

  - id: dynamic-external-import-string-literal
    desc: Dynamically imports a non-relative module path
    crit: notable
    conf: 0.9
    if:
      # The query constrains the match to a runtime import() call and keeps
      # relative/absolute specifiers out of the external-loader signal.
      type: tree-sitter
      query: |
        (
          (_
            (call_expression
              function: (import)
          arguments: (arguments (string) @module)) @call) @parent
          (#not-match? @module "^[\"']?\\.")
          (#not-match? @module "^[\"']?/")
          (#not-match? @module "^[\"']?@(components|pages|utils|hooks)/")
          (#not-match? @module "^[\"']?@(constants|apis|styles|types)/")
          (#not-match? @parent "\\)\\s*\\.")
        )
    unless:
      # Type-only declaration imports are erased and never load at runtime.
      - id: metadata/lang/scripted::dts-declaration-file
      - type: basename
        regex: '\.d\.ts$'

  # `import("pkg").then(...)` — a bare (non-relative) specifier loaded lazily and
  # consumed straight off the promise. This is the isomorphic/lazy-load idiom and
  # nothing more on its own; it matters to composites because the loaded module
  # never appears in the static import list, so what the file finally hands its
  # callers came from somewhere the import list does not mention. The `.then`
  # keeps this off TypeScript's erased `import("pkg").Type` positions.
  - id: dynamic-external-import-promise-chain
    desc: Chains on a lazily imported package
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[^.\w$]import\s*\(\s*["''][^"''./][^"'']{0,60}["'']\s*\)\s*\.\s*then'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: dynamic-imported-provider-reexport
    desc: Dynamic import followed by a provider reference
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: "import\\(\\s*['\"][^'\"]{1,80}['\"]\\s*\\)[\\s\\S]{0,180}Provider"
    unless:
      - type: basename
        regex: '\.d\.ts$'

  # The leading `[^.\w$]` keeps these on the `import()` operator.  A bare `\b`
  # also matches the member call `style.import(file)` / `less.import(path)`,
  # which is an ordinary API method on a user object, not a module load.
  # `import` is a legal method name, and in minified class bodies a shorthand
  # method reads exactly like a call: `}import(t){return this.emit(...)}` in
  # @adobe/css-tools is the CSS @import at-rule printer, not a module load.
  # A definition is followed by its body, so require a non-brace after the
  # parameter list; every real dynamic import is followed by `.then`, `;`,
  # `)` or `,`.
  - id: dynamic-import-expression
    desc: Dynamically imports a computed module reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '[^.\w$]import\s*\(\s*[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)?\s*\)\s*[^{\s]'

  - id: dynamic-import-call-expression
    desc: Dynamically imports a computed call result
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[^.\w$]import\s*\(\s*[A-Za-z_$][\w$]*\s*\([^)]{1,240}\)\s*\)'

  - id: dynamic-import-function-constructor
    desc: Function constructor wraps dynamic import
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*["''][A-Za-z_$][A-Za-z0-9_$]*["'']\s*,\s*["'']return\s+import\s*\('

  - id: js-get-builtin-module-key-lookup
    desc: Getter resolves getBuiltinModule property
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: symbol
      kind: call
      regex: '(^|\.)get$'
      args:
        - {kind: identifier}
        - {kind: string, exact: getBuiltinModule}

  - id: node-get-builtin-child-process
    desc: Loads child_process through getBuiltinModule
    crit: notable
    conf: 0.98
    attack: T1059.007
    if:
      type: symbol
      kind: call
      regex: '(^|\.)getBuiltinModule$'
      arg:
        kind: string
        exact: child_process

  # `await import("node:child_process")` inside a function body, rather than a
  # top-level `import`/`require`. The capability never appears in the module's
  # static import list, so a manifest-level dependency review, a bundler's
  # module graph and every "what does this package require" scanner all miss
  # it. Neutral on its own — ESM libraries genuinely defer Node-only builtins so
  # the same file can load in a browser — so the concealment reading comes from
  # the composites that pair these with what the loaded builtin is used for.
  # Split by capability family so a composite can ask for *which* capabilities
  # were deferred rather than for how many import calls it counted.
  - id: node-lazy-exec-builtin-import
    desc: Defers loading a Node execution builtin
    crit: notable
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: 'import\(\s*["'']node:(child_process|vm|worker_threads)["'']\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: node-lazy-fs-builtin-import
    desc: Defers loading a Node filesystem builtin
    crit: notable
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: 'import\(\s*["'']node:fs(/promises)?["'']\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: node-lazy-net-builtin-import
    desc: Defers loading a Node network builtin
    crit: notable
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: 'import\(\s*["'']node:(net|tls|https?|dgram|dns)["'']\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: node-dynamic-import-file-url
    desc: Node dynamically imports a file URL
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'import\s*\(\s*`file://.{1,120}`\s*\)'
  - id: empty-arrow-catch-handler
    desc: Empty arrow catch silently ignores errors
    crit: component
    conf: 0.8
    if:
      type: text
      regex: "\\.catch\\(\\s*\\(\\s*\\w*\\s*\\)\\s*=>\\s*\\{\\s*\\}\\s*\\)"

  # `builtinModules` from the `module` package is the runtime's own list of
  # every built-in ("fs", "child_process", ...). Reading it is neutral -- test
  # runners, bundlers and polyfill shims all need to know which specifiers are
  # built in. It is the enumeration surface an import-hashing loader searches,
  # so the anti-static composites reference it for that half of the pattern.
  - id: node-builtin-modules-list
    desc: Reads the Node builtin module name list
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      substr: builtinModules

composite_rules:
  - id: scoped-config-package-loader
    desc: Invokes scoped config package loadConfig
    crit: notable
    conf: 0.93
    all:
      - id: scoped-config-package-import
      - id: micro-behaviors/data/config/load::load-config-helper-call
  - id: node-lazy-builtin-capability-import
    desc: Defers loading a Node capability builtin
    crit: notable
    conf: 0.9
    any:
      - id: node-lazy-exec-builtin-import
      - id: node-lazy-fs-builtin-import
      - id: node-lazy-net-builtin-import
  - id: node-system-module-import-set
    desc: Imports at least two Node system modules
    crit: notable
    conf: 0.88
    needs: 2
    any:
      - id: metadata/import/builtin::require-child-process
      - id: metadata/import/builtin::require-os
      - id: metadata/import/builtin::require-https
      - id: metadata/import/builtin::require-fs

  - id: eager-import-error-swallowed
    desc: Dynamic import with swallowed errors
    crit: notable
    conf: 0.8
    all:
      - id: dynamic-import-string-literal
      - id: empty-arrow-catch-handler
    near_bytes: 200
