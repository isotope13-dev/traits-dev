# Decoded assembly loading plus nearby downloads/slicing is dual use.
# The required evidence does not bind downloaded content to the loader.
defaults:
  platforms:
  - unix
  - windows
  for:
  - powershell
  crit: notable
  conf: 0.97
composite_rules:
- id: powershell-download-slice-decoded-assembly-load
  desc: Decoded assembly load with download/indexing
  crit: suspicious
  conf: 0.99
  attack: T1620
  mbc: E1620
  all:
  - id: micro-behaviors/process/interpreter/reflection/runtime::ps-decode-and-load
  - id: micro-behaviors/communications/http/client/managed::downloaddata
  - id: micro-behaviors/data/string/access::powershell-download-near-string-slice
