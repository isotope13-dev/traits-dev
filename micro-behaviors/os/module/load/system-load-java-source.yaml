# Java Execution and Security Traits
# Detects dangerous Java patterns in source code
# MBC: Execution, Defense Evasion
# ATT&CK: T1059 (Command and Scripting Interpreter)
defaults:
  platforms: [windows, unix]
  for: [java]
traits:
  - id: system-load
    desc: Load native library by path
    crit: notable
    conf: 0.9
    mbc: "C0033"
    attack: "T1129"
    if:
      type: symbol
      kind: call
      exact: "System.load"
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  # Neutral JVM capabilities whose canonical observations live under
  # micro-behaviors, referenced from there rather than restated here:
  #   URLClassLoader  -> micro-behaviors/process/interpreter/runtime/jvm
  #   setAccessible   -> micro-behaviors/data/source/dynamic/reflect::java-set-accessible
  #   defineClass     -> micro-behaviors/data/embedded/classfile::runtime-define-class
  # ScriptEngine API calls are neutral capabilities.  Their canonical
  # observations live under micro-behaviors/process/interpreter/runtime/jvm;
  # dropper composites add the staging context that makes them suspicious.
  # ============================================================
  # JNDI (Log4Shell vector)
  # ============================================================
