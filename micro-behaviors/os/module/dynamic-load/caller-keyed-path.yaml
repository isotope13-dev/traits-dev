defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: node-caller-json-module-path
  desc: Caller JSON keys a computed module path
  conf: 0.98
  size_max: 65536
  if:
    type: tree-sitter
    language: javascript
    query: '((function_declaration parameters: (formal_parameters (identifier ) @input) body: (statement_block (lexical_declaration
      (variable_declarator name: (identifier ) @name value: (call_expression arguments: (arguments (_) (call_expression
      function: (subscript_expression object: (identifier ) @json) arguments: (arguments (identifier ) @key_input)))))
      (variable_declarator name: (identifier ) @path value: (call_expression arguments: (arguments (identifier )
      @dirname (identifier ) @used_name))) (variable_declarator value: (call_expression function: (identifier )
      @require arguments: (arguments (call_expression arguments: (arguments (identifier ) @used_path (call_expression
      function: (subscript_expression object: (identifier ) @json_again) arguments: (arguments (identifier ) @key_again))))))))))

      (#eq? @input @key_input)

      (#eq? @input @key_again)

      (#eq? @name @used_name)

      (#eq? @path @used_path)

      (#eq? @dirname "__dirname")

      (#eq? @require "require")

      (#eq? @json "JSON")

      (#eq? @json_again "JSON"))'
