defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: require-numeric-string-decoder
    desc: Requires a module through numeric string decoder
    conf: 0.93
    if:
      type: text
      regex: 'require\s*\(\s*\w+\(\s*-?\d+,[^()\n]{0,100}["''][^"'']{2,16}["''][^()\n]{0,80}\)\s*\)'
