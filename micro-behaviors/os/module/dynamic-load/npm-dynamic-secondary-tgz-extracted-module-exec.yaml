defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: secondary-tgz-extracted-module-exec
    desc: Runtime npm tar extraction and dynamic require
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/runtime-install::secondary-tgz-npm-bootstrap
      - id: micro-behaviors/os/module/require::node-dynamic-require-destructure
    unless:
      - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
