defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: tsimport-call
    desc: Calls a tsImport module-loading API
    if:
      type: symbol
      kind: call
      regex: '(^|\.)tsImport$'
    unless:
      # A locally defined namesake does not establish the loader API.
      - type: function
        exact: tsImport
