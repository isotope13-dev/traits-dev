defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-variable-require-call
    desc: Requires a module named by a variable
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: require
      arg:
        kind: identifier
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path

  - id: node-dynamic-require-call
    desc: Requires a module named by a call
    crit: notable
    conf: 0.82
    # `archives` admits the archive containers themselves, where this fires as
    # a folded member finding; text conditions cannot re-evaluate against a
    # container, so archive-scoped composites need the type listed here to
    # pair a packed script's decoder-dispatched require with manifest facts.
    for: [javascript, typescript, archives]
    if:
      type: text
      regex: \brequire\s*\(\s*[A-Za-z_$][\w$]*\s*\(
    unless:
      - type: text
        regex: '\b(function\s+require\s*\(|(const|let|var)\s+require\s*=)'
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      - id: metadata/build/recognized-contexts::benign-build-tooling-context

  - id: node-require-alias-binding
    desc: Assigns Node require to an alias
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(const|let|var)\s+[A-Za-z_$][\w$]*\s*=\s*require\s*;'

  - id: node-computed-require-call
    desc: Requires a computed Node module name
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\brequire\s*\(\s*[A-Za-z_$][\w$]*\s*(\[|\.|\()'
    unless:
      - id: node-dynamic-require-call
      - type: text
        regex: '\b(function\s+require\s*\(|(const|let|var)\s+require\s*=)'
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/library/structure::js-large-module-bundle

  - id: node-split-literal-require
    desc: Requires a module name joined from literals
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'require\s*\(\s*[''"][a-z][a-z_]{1,14}[''"]\s*\+'
