defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: require-awaited-result
    desc: require() receives an awaited call result
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration "const"
            (variable_declarator
              name: (identifier) @path
              value: (await_expression (call_expression))))
          (lexical_declaration
            (variable_declarator
              value: (call_expression
                function: (identifier) @require
                arguments: (arguments . (identifier) @loaded))))) @block
          (#eq? @require "require")
          (#eq? @path @loaded))
