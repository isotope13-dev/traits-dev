defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  # Each name may be cut at any position (`['bin','ding']`, `['b','ind','ing']`):
  # only quotes, commas and spaces may separate its letters.
  - id: js-array-join-binding-token
    desc: Reconstructs 'binding' via array join
    if:
      type: text
      regex: '["'']b\W*?i\W*?n\W*?d\W*?i\W*?n\W*?g["'']\s*\]\.join\(["'']{2}'

  - id: js-array-join-spawn-sync-token
    desc: Reconstructs 'spawn_sync' via array join
    if:
      type: text
      regex: '["'']s\W*?p\W*?a\W*?w\W*?n\W*?_\W*?s\W*?y\W*?n\W*?c["'']\s*\]\.join\(["'']{2}'

  - id: js-array-join-fetch-token
    desc: Reconstructs 'fetch' via array join
    if:
      type: text
      regex: '["'']f\W*?e\W*?t\W*?c\W*?h["'']\s*\]\.join\(["'']{2}'

  - id: js-process-get-builtin-module-call
    desc: Loads built-in module via getBuiltinModule
    if:
      type: text
      substr: 'process.getBuiltinModule('

  - id: js-reflect-get-platform-env
    desc: Reads process env via Reflect.get
    if:
      type: text
      regex: 'Reflect\.get\s*\(\s*\w+\s*,\s*[''"]env[''"]\s*\)'

  - id: js-array-join-child-process-token
    desc: Reconstructs 'child_process' via array join
    if:
      type: text
      regex: '["'']c\W*?h\W*?i\W*?l\W*?d\W*?_\W*?p\W*?r\W*?o\W*?c\W*?e\W*?s\W*?s["'']\s*\]\.join\(["'']{2}'
