defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: cjs-serialized-input-module-path-helper
  desc: Module helper receives serialized caller input
  conf: 0.95
  if:
    type: tree-sitter
    language: javascript
    query: |
      (assignment_expression
        left: (member_expression
          object: (identifier) @exports)
        right: (function_expression
          parameters: (formal_parameters
            (identifier) @parameter)
          body: (statement_block
            (lexical_declaration
              (variable_declarator
                name: (identifier) @serialized
                value: (call_expression
                  function: (member_expression
                    object: (identifier) @json
                    property: (property_identifier) @stringify)
                  arguments: (arguments
                    (identifier) @input))))
            (lexical_declaration
              (variable_declarator
                value: (call_expression
                  function: (identifier) @require
                  arguments: (arguments
                    (call_expression
                      arguments: (arguments
                        (_)*
                        (identifier) @used))))))))
        (#eq? @exports "exports")
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#eq? @require "require")
        (#eq? @parameter @input)
        (#eq? @serialized @used))
- id: caller-keyed-decipher-module-path
  size_max: 65536
  desc: Caller-keyed decipher helper selects module path
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: |
      (program
        (function_declaration
          name: (identifier) @decrypt
          parameters: (formal_parameters
            (identifier)
            (identifier) @password)
          body: (statement_block
            (lexical_declaration
              (variable_declarator
                name: (identifier) @key
                value: (call_expression
                  function: (member_expression
                    property: (property_identifier) @scrypt)
                  arguments: (arguments . (identifier) @password_input))))
            (lexical_declaration
              (variable_declarator
                value: (call_expression
                  function: (member_expression
                    property: (property_identifier) @decipher)
                  arguments: (arguments . (_) . (identifier) @key_input))))))
        (expression_statement
          (assignment_expression
            left: (member_expression object: (identifier) @exports)
            right: (function_expression
              parameters: (formal_parameters (identifier) @caller)
              body: (statement_block
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @serialized
                    value: (call_expression
                      function: (member_expression
                        object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments . (identifier) @caller_input))))
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @module_name
                    value: (call_expression
                      function: (member_expression
                        object: (call_expression
                          function: (identifier) @used_decrypt
                          arguments: (arguments . (_) . (identifier) @serialized_input))
                        property: (property_identifier) @to_string)) ))
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @module_path
                    value: (call_expression
                      function: (member_expression
                        property: (property_identifier) @join)
                      arguments: (arguments . (identifier) @dirname . (identifier) @name_input))))
                (lexical_declaration
                  (variable_declarator
                    value: (call_expression
                      function: (identifier) @require
                      arguments: (arguments . (call_expression
                        arguments: (arguments . (identifier) @path_input . (identifier) @key_again))))))))))
        (#eq? @scrypt "scryptSync")
        (#eq? @decipher "createDecipheriv")
        (#eq? @password @password_input)
        (#eq? @key @key_input)
        (#eq? @exports "exports")
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#eq? @caller @caller_input)
        (#eq? @decrypt @used_decrypt)
        (#eq? @serialized @serialized_input)
        (#eq? @serialized @key_again)
        (#eq? @to_string "toString")
        (#eq? @join "join")
        (#eq? @dirname "__dirname")
        (#eq? @module_name @name_input)
        (#eq? @module_path @path_input)
        (#eq? @require "require"))
composite_rules:
- id: node-file-io-aead-dynamic-require
  desc: Dynamic require beside AES-GCM and file I/O
  conf: 0.96
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/crypto/library/provider::node-memory-hard-kdf
  - id: micro-behaviors/crypto/decrypt::createDecipheriv
  - id: micro-behaviors/crypto/symmetric/aes/gcm::aes-256-gcm-dash
  - id: micro-behaviors/crypto/decrypt::set-auth-tag
  - id: micro-behaviors/fs/read/file/full::readfilesync-call
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
  unless:
  - id: well-known/tool/detection/
- id: node-scrypt-gcm-buffer-field-require
  desc: Dynamic require beside scrypt, GCM and buffer fields
  conf: 0.96
  near_bytes: 4096
  all:
  - id: micro-behaviors/crypto/symmetric/aes/gcm::aes-256-gcm-dash
  - id: micro-behaviors/crypto/library/provider::node-scrypt-any-spelling
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
  any:
  - id: micro-behaviors/data/buffer/record::fixed-offset-buffer-fields
  - id: metadata/lang/source/syntax/call/relationship::repeated-fixed-slice-call-cluster
  - id: metadata/lang/source/syntax/call/arguments::computed-call-hex-token-pairs
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/path::test-directory-component
