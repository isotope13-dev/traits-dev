defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: caller-keyed-decipher-module-path
  size_max: 65536
  desc: Caller-keyed decipher helper selects module path
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: |
      (program
        (function_declaration
          name: (identifier) @decrypt
          parameters: (formal_parameters
            (identifier)
            (identifier) @password)
          body: (statement_block
            (lexical_declaration
              (variable_declarator
                name: (identifier) @key
                value: (call_expression
                  function: (member_expression
                    property: (property_identifier) @scrypt)
                  arguments: (arguments . (identifier) @password_input))))
            (lexical_declaration
              (variable_declarator
                value: (call_expression
                  function: (member_expression
                    property: (property_identifier) @decipher)
                  arguments: (arguments . (_) . (identifier) @key_input))))))
        (expression_statement
          (assignment_expression
            left: (member_expression object: (identifier) @exports)
            right: (function_expression
              parameters: (formal_parameters (identifier) @caller)
              body: (statement_block
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @serialized
                    value: (call_expression
                      function: (member_expression
                        object: (identifier) @json
                        property: (property_identifier) @stringify)
                      arguments: (arguments . (identifier) @caller_input))))
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @module_name
                    value: (call_expression
                      function: (member_expression
                        object: (call_expression
                          function: (identifier) @used_decrypt
                          arguments: (arguments . (_) . (identifier) @serialized_input))
                        property: (property_identifier) @to_string)) ))
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @module_path
                    value: (call_expression
                      function: (member_expression
                        property: (property_identifier) @join)
                      arguments: (arguments . (identifier) @dirname . (identifier) @name_input))))
                (lexical_declaration
                  (variable_declarator
                    value: (call_expression
                      function: (identifier) @require
                      arguments: (arguments . (call_expression
                        arguments: (arguments . (identifier) @path_input . (identifier) @key_again))))))))))
        (#eq? @scrypt "scryptSync")
        (#eq? @decipher "createDecipheriv")
        (#eq? @password @password_input)
        (#eq? @key @key_input)
        (#eq? @exports "exports")
        (#eq? @json "JSON")
        (#eq? @stringify "stringify")
        (#eq? @caller @caller_input)
        (#eq? @decrypt @used_decrypt)
        (#eq? @serialized @serialized_input)
        (#eq? @serialized @key_again)
        (#eq? @to_string "toString")
        (#eq? @join "join")
        (#eq? @dirname "__dirname")
        (#eq? @module_name @name_input)
        (#eq? @module_path @path_input)
        (#eq? @require "require"))
composite_rules:
- id: node-scrypt-gcm-decrypt-write-variable-require
  desc: Variable require beside scrypt AES-GCM decrypt-write
  conf: 0.95
  # A scrypt-keyed AES-GCM helper that reads, decrypts and writes a file is a
  # stage loader; the caller side of that loader commonly requires the
  # plaintext path the decryptor returns (a plain variable, not a call).
  # Joining the chain to the variable require keeps the load step covered
  # when the path never appears inside a require argument call.
  near_bytes: 4096
  all:
  - id: micro-behaviors/crypto/decrypt/transform/symmetric::node-scrypt-gcm-file-decrypt-write
  - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call
- id: node-file-io-aead-dynamic-require
  desc: Dynamic require beside AES-GCM and file I/O
  conf: 0.96
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
  - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
  - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
  - id: metadata/lang/source/literal/string/cryptography::aes-256-gcm-dash
  - id: micro-behaviors/crypto/cipher/authentication::set-auth-tag
  - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
  - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
- id: node-scrypt-symbol-gcm-buffer-require
  desc: Dynamic require beside scrypt symbol, GCM and buffer fields
  conf: 0.96
  all:
  - id: metadata/lang/source/literal/string/cryptography::aes-256-gcm-dash
  - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
  any:
  - id: micro-behaviors/data/buffer/record::fixed-offset-buffer-fields
  - id: metadata/lang/source/syntax/call/relationship::repeated-fixed-slice-call-cluster
  - id: metadata/lang/source/syntax/call/arguments::computed-call-hex-token-pairs
  needs: 1
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: micro-behaviors/os/security/scan/documentation/
  - id: metadata/path/directory::test-directory-component
- id: node-scrypt-literal-gcm-buffer-require
  desc: Dynamic require beside scrypt literal, GCM and buffer fields
  conf: 0.96
  all:
  - id: metadata/lang/source/literal/string/cryptography::aes-256-gcm-dash
  - id: micro-behaviors/crypto/kdf/algorithm::scrypt-name-literal
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
  any:
  - id: micro-behaviors/data/buffer/record::fixed-offset-buffer-fields
  - id: metadata/lang/source/syntax/call/relationship::repeated-fixed-slice-call-cluster
  - id: metadata/lang/source/syntax/call/arguments::computed-call-hex-token-pairs
  needs: 1
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: micro-behaviors/os/security/scan/documentation/
  - id: metadata/path/directory::test-directory-component
