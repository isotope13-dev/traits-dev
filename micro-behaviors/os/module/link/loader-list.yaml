defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: native-ldr-adjacent-list-insertion-x64
    desc: Inserts node into adjacent loader lists
    crit: suspicious
    conf: 0.97
    if:
      type: hex
      section: .text
      # Ldr list head at +0x10/+0x18 is relinked, immediately followed by
      # the +0x20/+0x28 list. Node offsets vary with allocation layout.
      # This claims list manipulation, not successful OS registration.
      pattern: >-
        48 8B 4C 24 ?? 48 89 0A 48 89 4E 18
        49 8B C8 48 81 C1 ?? ?? ?? ?? 48 8D 56 20
        4C 8B 56 28 49 89 90 ?? ?? ?? ?? 4D 89 90 ?? ?? ?? ??
