defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: dynamic-import-http-url
    desc: Imports module over HTTP
    crit: notable
    conf: 0.96
    attack: T1105
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (import)
          arguments: (arguments . (string) @url)) @load
          (#match? @url "^['\"]https?://"))
        ((statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @destination value: (string) @url))
          . [(return_statement (call_expression function: (import)
               arguments: (arguments . (identifier) @source)) @load)
             (expression_statement (call_expression function: (import)
               arguments: (arguments . (identifier) @source)) @load)])
          (#match? @url "^['\"]https?://")
          (#eq? @destination @source))
