defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: unipswap-postcss-animate-units
    desc: Requires Unipswap PostCSS animation helper
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "@unipswap/postcss-animate-units"
  - id: scoped-postcss-motion-helper
    desc: Requires scoped PostCSS animation helper
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'require\s*\(\s*[''"]@[-a-z0-9_]+/postcss-(motion|animate|kinetix)[-_a-z0-9]*[''"]\s*\)'
