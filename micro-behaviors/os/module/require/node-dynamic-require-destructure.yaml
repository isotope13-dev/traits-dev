traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: node-dynamic-require-destructure
  desc: Destructures exports from variable require
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    query: "((variable_declarator\n   name: (object_pattern)\n   value: (call_expression\n     function: (identifier) @req_function\n     arguments: (arguments (identifier))) @call)\n (#eq? @req_function \"require\"))\n"
