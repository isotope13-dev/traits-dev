defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: dynamic-import-xenova-transformers
    desc: Dynamically imports Xenova Transformers module
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (
          (_ (call_expression
            function: (import)
            arguments: (arguments (string) @module)) @call) @parent
          (#not-match? @parent "\\)\\s*\\.")
          (#match? @module "^[\"']@xenova/transformers[\"']$")
        )
        (
          (call_expression
            function: (member_expression
              object: (call_expression
                function: (import)
                arguments: (arguments (string) @module))))
          (#match? @module "^[\"']@xenova/transformers[\"']$")
        )
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
