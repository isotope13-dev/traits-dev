defaults:
  platforms: [unix, windows]

traits:
  - id: postinstall-bare-module-require
    desc: Postinstall text requires a bare module
    crit: notable
    conf: 0.94
    for: [package.json]
    unless:
    - type: value
      path: scripts.postinstall
      regex: "require\\.resolve\\(['\"]husky['\"]\\)"
    if:
      type: value
      path: scripts.postinstall
      regex: '\brequire\(\s*["''][A-Za-z@][A-Za-z0-9@_./-]{0,79}["'']\s*\)'
