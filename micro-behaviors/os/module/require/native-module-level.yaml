defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: module-level-native-addon-require
    desc: Module-scope native addon require call
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: require
      module_level: true
      arg:
        index: 0
        from:
          value: '\.node$'
    unless:
      - id: metadata/path::test-directory-component
