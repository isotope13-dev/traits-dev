defaults:
  platforms: [unix, windows]
  for: [source, markdown, html, text, binaries, javascript, typescript]
traits:
  - id: axios-variable-computed-require
    desc: Computed require assigned to axios variable
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(const|let|var)\s+axios\s*=\s*require\s*\(\s*[A-Za-z_$][\w$]*\s*\('
