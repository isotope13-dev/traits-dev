defaults:
  platforms:
  - windows
  for:
  - javascript
  - typescript
  attack: T1055,T1105
composite_rules:
- id: node-watch-gated-native-addon-stager
  desc: File watch and read beside a silently loaded native addon
  crit: suspicious
  conf: 0.97
  near_lines: 60
  all:
  - id: micro-behaviors/fs/watch::node-fs-watch-call
  - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
  - id: micro-behaviors/os/module/require::prebuilds-silent-native-addon-loader
  - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
