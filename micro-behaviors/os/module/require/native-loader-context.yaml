defaults:
  platforms: [unix, windows]
composite_rules:
  - id: silent-native-addon-loader
    desc: Silent native addon loader stub
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/module/require::local-native-addon-require
      - id: micro-behaviors/data/control-flow/error-handling::from-str-empty-catch
  - id: prebuilds-silent-native-addon-loader
    desc: Silent loader for platform prebuilds native addon
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/path/library::prebuilds-node-addon-name-pair
      - id: micro-behaviors/os/module/require::cjs-require-in-try
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
  - id: tiny-prebuilt-native-addon-loader
    desc: Tiny prebuilt native addon loader
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/module/require::prebuilt-native-addon-require
      - id: metadata/file/line::tiny-javascript-file-lines
      - id: metadata/file/size::tiny-javascript-file-size
  - id: npm-package-ships-native-elf-addon
    desc: npm package ships native ELF addon
    crit: notable
    conf: 0.95
    scope: archive
    for: [npm, tar, zip, package.json, javascript, binaries]
    all:
      - id: metadata/package/files/package-json::package-publishes-prebuilt-dir
      - id: metadata/binary/framework::node-api-addon-export
      - id: metadata/binary/linking/runtime::needed-lib
