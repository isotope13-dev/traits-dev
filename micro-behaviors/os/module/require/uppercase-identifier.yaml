defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88
traits:
  # A bare `require()` of an all-caps identifier (`require(TARGET)`,
  # `require(CONFIG_PATH)`). Test harnesses use the same shape for path
  # placeholders, so the form alone establishes no loading behavior; the
  # dropper composites that reference this supply the staging context.
  - id: require-uppercase-identifier
    desc: require() with uppercase identifier argument
    if:
      type: text
      regex: '\brequire\(\s*[A-Z][A-Z0-9_]{2,}\s*\)'
