defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1195.002

traits:
  - id: dotenv-name-literal
    desc: String literal names dotenv
    crit: notable
    conf: 0.86
    unless:
      - id: well-known/tool/development/build/autorest::autorest-generated-header
      - id: well-known/app/ai/gateway/opencode-router
      - id: well-known/app/ai/assistant/nitin-ai
    if:
      type: string_literal
      exact: dotenv
  # Loading a .env file at startup is a ubiquitous benign idiom. Neutral
  # `notable` — it describes real behavior; the malicious signal is dotenv +
  # constructor-telemetry exfil, carried by the composites that use this leg.
