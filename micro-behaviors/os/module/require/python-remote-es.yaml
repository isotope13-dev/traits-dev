defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: python-remote-es-module-import
  desc: Python embeds remote ES module import
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'import\s{0,4}\(\s{0,4}["'']https?://[^"'']{4,120}\.js["'']'
  not:
    # Documentation-reserved hosts (RFC 2606 plus the evil.example
    # convention) can never serve attacker code: a match here is a writeup,
    # lint comment, or sandbox rule describing the pattern, not an import.
    - regex: '(?i)https?://([A-Za-z0-9.-]*\.)?(example\.com|example\.net|example\.org|evil\.example)\b'
    # A loopback Vite or dev-server URL is the author's own preview, not a
    # host that can deliver a payload.
    - regex: '(?i)https?://(127\.0\.0\.1|localhost|\[::1\])[:/]'
    - regex: '(?i)https?://[A-Za-z0-9.-]*\.(example|test|invalid)\b'
    # A version-pinned package from a public npm CDN (an accessibility audit
    # importing axe-core@4.9.1 from unpkg) is a published library, not code
    # served from a host the author controls.
    - regex: '(?i)https://(unpkg\.com|cdn\.jsdelivr\.net/npm)/[@\w./-]{1,60}@\d+\.\d+\.\d+/'

