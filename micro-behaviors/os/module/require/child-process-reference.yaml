composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: child-process-require
  desc: Imports the Node.js child_process module
  crit: notable
  conf: 0.8
  unless:
  - id: well-known/tool/detection/agentskillmap/
  - id: metadata/lang/scripted::dts-declaration-file
  any:
  - id: metadata/import/builtin::require-child-process
  - id: metadata/import/builtin::child-process-api-destructure
  - id: metadata/import/builtin::child-process-import-runtime
