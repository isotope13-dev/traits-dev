defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: silent-exportless-native-import-iife
  desc: Exportless module silently imports native file
  crit: suspicious
  conf: 0.94
  size_max: 4096
  if:
    type: tree-sitter
    query: |
      ((program
      .
      (empty_statement)*
      .
      (expression_statement
      (call_expression
      function: (parenthesized_expression
      (function_expression
      parameters: (formal_parameters) @parameters
      body: (statement_block
      (try_statement
      body: (statement_block
      (_
      (variable_declarator
      name: (identifier) @platform_binding
      value: [(member_expression
      object: (identifier) @process
      property: (property_identifier) @platform_property) (subscript_expression object: (identifier) @process index: (string (string_fragment) @platform_property))]))
      (_
      (variable_declarator
      name: (identifier) @native_binding))
      (if_statement
      condition: (parenthesized_expression
      (binary_expression
      left: (identifier) @platform_test
      operator: ["===" "=="]
      right: (string
      (string_fragment) @platform_value)))
      consequence: (expression_statement
      (assignment_expression
      left: (identifier) @native_assigned
      right: (string
      (string_fragment) @native_filename))))
      (if_statement
      condition: (parenthesized_expression
      (identifier) @native_guard)
      consequence: (expression_statement
      (call_expression
      function: (identifier) @require
      arguments: (arguments
      .
      (binary_expression
      left: (string
      (string_fragment) @prefix)
      operator: "+"
      right: (identifier) @native_used))))))
      handler: (catch_clause
      body: (statement_block) @empty_catch)))))
      arguments: (arguments) @invoke_arguments))
      .
      )
      (#eq? @platform_binding @platform_test)
      (#eq? @native_binding @native_assigned) (#eq? @native_binding @native_guard) (#eq? @native_binding @native_used)
      (#eq? @process "process") (#eq? @platform_property "platform") (#match? @platform_value "^(win32|linux|darwin)$")
      (#eq? @require "require") (#eq? @prefix "./") (#match? @native_filename "(?i)[.]node$")
      (#match? @parameters "^\\(\\s*\\)$") (#match? @invoke_arguments "^\\(\\s*\\)$")
      (#match? @empty_catch "^\\{\\s*\\}$")
      (#not-eq? @platform_binding @native_binding)
      (#not-eq? @platform_binding @process)
      (#not-eq? @native_binding @process)
      (#not-eq? @platform_binding @require) (#not-eq? @native_binding @require)
      )
  unless:
  - id: micro-behaviors/data/control-flow/module-exec::js-module-exports
  - id: well-known/lib/development/vscode::activate-export
