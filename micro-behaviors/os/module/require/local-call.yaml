defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- crit: notable
  conf: 0.9
  id: cjs-local-require-call
  desc: CommonJS local-module require call
  if:
    type: symbol
    kind: call
    exact: require
    arg:
      kind: string
      regex: ^\./[^"']{1,80}$

- crit: notable
  conf: 0.95
  id: cjs-pre-export-local-require
  desc: CommonJS local require precedes module.exports
  if:
    type: text
    regex: '}\s*\r?\n\s*require\s*\(\s*[''"]\./[^''"]{1,80}[''"]\s*\)\s*\r?\n\s*module\.exports'
