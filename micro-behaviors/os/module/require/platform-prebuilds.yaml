defaults:
  platforms: [unix, windows]

composite_rules:
  - id: platform-prebuilds-caught-require
    desc: Loads a platform prebuilt addon inside try/catch
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/path/construct::platform-prebuild-node-addon-path
      - id: micro-behaviors/os/module/require::cjs-require-in-try
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text

