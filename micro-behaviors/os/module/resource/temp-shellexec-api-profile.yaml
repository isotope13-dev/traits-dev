# These imports do not link a resource to a written or launched file.
defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: resource-temp-shellexec-api-profile
    desc: Resource enumeration with temp and launch APIs
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/module/resource::enum-resource-names
      - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
      - id: micro-behaviors/fs/write/file/handle::write-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # Compiled AutoIt executables embed a general-purpose interpreter whose
      # imports include these resource, temp-file, write, and ShellExecute APIs
      # even when the script does not use them. Their import table alone cannot
      # establish that the script stages and launches a resource payload.
      - id: metadata/lang/compiled::autoit-binary
      # wxWidgets GUI applications link the framework's resource, temp-file,
      # write, and ShellExecute helper APIs as part of the standard toolkit;
      # their presence in imports alone does not indicate resource staging.
      - id: well-known/lib/ui/wxwidgets/
