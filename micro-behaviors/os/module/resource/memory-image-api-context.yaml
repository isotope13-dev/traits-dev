defaults:
  platforms: [macos]
  for: [macho]
traits:
  - id: nscreate-objectfile-memory
    desc: Mach-O image-from-memory API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "NSCreateObjectFileImageFromMemory"
  - id: nsdestroy-objectfile-api
    desc: Mach-O object-image disposal API reference
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: "NSDestroyObjectFileImage"
  - id: dyld4-segment-layout-api
    desc: Mach-O segment layout API-name reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: analyzeSegmentsLayout
