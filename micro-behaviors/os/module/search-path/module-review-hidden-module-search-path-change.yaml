defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]
composite_rules:
- id: hidden-module-search-path-change
  desc: Nonstandard hidden module search path change
  crit: suspicious
  conf: 0.95
  any:
  - id: micro-behaviors/os/module/search-path::python-hidden-module-search-path-mutation
  - id: micro-behaviors/os/module/search-path::node-hidden-module-search-path-mutation
  - id: micro-behaviors/os/module/search-path::hidden-module-search-path-env-assignment
  unless:
  - id: well-known/lib/platform/psutil
  - id: well-known/app/system/cowork-flow::cowork-flow-hook-context
  - id: well-known/app/data/gsas-ii::gsas-ii-local-plugin-context
  downgrade:
    scope: file-or-parent
    any:
      - id: well-known/app/infrastructure/ansible::ansible-community-sdist-context
