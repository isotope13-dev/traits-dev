defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: sys-path-mutate
    desc: Modifies module search path (sys.path)
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '^sys\.path\.(insert|append|extend)$'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  # The hidden-directory literal written inside the sys.path call itself.
  # Same-line proximity between the call and any dotdir string is not enough:
  # installers that write a launcher (bytes containing `sys.path.insert`) into
  # `.tool/bin/` put both on one line without mutating anything.
  - id: sys-path-hidden-dir-entry
    desc: Adds a hidden directory to sys.path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sys\.path\.(insert|append|extend)\([^\n]{0,100}[''"/]\.[A-Za-z_][\w-]{0,30}[/''"]'
    # Conventional venv/tool/agent dotdirs are layout, not concealment.
    not:
      - regex: '[''"/]\.(local|venv|virtualenv|tox|nox|cache|config|github|gitlab|vscode|idea)[/''"]'
      - regex: '[''"/]\.(bin|openclaw|claude|hermes|codex|gemini|devcontainer)[/''"]'
