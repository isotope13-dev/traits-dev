# The original supply-chain rule combined unrelated functions. This neutral
# observation requires the three operations in one function, without asserting
# that the downloaded path is the path added to sys.path.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-http-write-search-path-function
    desc: Function HTTP writes and import-path changes
    crit: notable
    conf: 0.85
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition body: (block) @body)
          (#set! cleave.ignore-comments "true")
          (#match? @body "requests\\.get\\(")
          (#match? @body "\\.write_bytes\\(")
          (#match? @body "sys\\.path\\.(insert|append|extend)\\("))
