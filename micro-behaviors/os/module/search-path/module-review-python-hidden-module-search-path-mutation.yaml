defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]
composite_rules:
- id: python-hidden-module-search-path-mutation
  desc: sys.path mutated with hidden-directory literal
  crit: suspicious
  conf: 0.93
  for:
  - python
  all:
  - id: micro-behaviors/os/module/search-path::sys-path-mutate
  - id: micro-behaviors/os/module/search-path::sys-path-hidden-dir-entry
  unless:
  - id: well-known/app/system/cowork-flow::cowork-flow-hook-context
  - id: metadata/package/documentation/source::documentation-dir-path
  - id: well-known/app/data/gsas-ii::gsas-ii-local-plugin-context
