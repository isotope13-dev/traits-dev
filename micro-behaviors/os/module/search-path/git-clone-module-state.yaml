defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-clone-import-module-state-profile
    desc: Git clone coexists with import/module mutation
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/vcs/git::python-subprocess-git-clone
      - id: micro-behaviors/os/module/search-path::sys-path-mutate
      - id: micro-behaviors/os/api-resolution/dynamic::python-sys-modules-write
