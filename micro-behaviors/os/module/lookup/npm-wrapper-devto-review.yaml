defaults:
  platforms: [unix, windows]
  for: [python, text, github-actions]
  crit: baseline
  size_max: 5242880
traits:
  - id: npm-wrapper-package-resolve
    desc: npm wrapper resolves platform package
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: 'require.resolve(`${pkg}/package.json`)'
  - id: npm-wrapper-package-resolve-template
    desc: npm wrapper resolves templated platform package
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: 'require.resolve(`${packageName}/package.json`)'
  - id: npm-wrapper-platform-binary-resolve
    desc: Templated require.resolve call
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: 'require.resolve(`${'
composite_rules:
  - id: npm-native-binary-wrapper-postinstall
    desc: Platform-specific package resolution
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/sysinfo/platform/branch::npm-wrapper-platform-arch-branch
      - id: metadata/lang/source/syntax/assignment/value::npm-wrapper-platform-package-name
      - id: micro-behaviors/os/module/lookup::npm-wrapper-package-resolve-template
  - id: npm-native-binary-wrapper-platform-bin-postinstall
    desc: Mapped platform binary resolution
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-content
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::os-arch-call
      - id: metadata/lang/source/syntax/assignment/value::npm-wrapper-platform-package-property
      - id: micro-behaviors/os/module/lookup::npm-wrapper-platform-binary-resolve
  - id: npm-native-binary-wrapper
    desc: npm native binary wrapper template
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/process/create/variable::npm-native-binary-wrapper-resolve-spawn
      - id: micro-behaviors/os/module/lookup::npm-native-binary-wrapper-postinstall
      - id: micro-behaviors/os/module/lookup::npm-native-binary-wrapper-platform-bin-postinstall
      - id: micro-behaviors/process/create/variable::npm-native-binary-wrapper-dispatch
