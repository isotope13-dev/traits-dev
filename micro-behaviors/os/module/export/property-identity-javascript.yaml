defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: commonjs-domain-like-export
  desc: CommonJS exports object with domain-like key
  if:
    type: text
    regex: 'module\.exports\s*=\s*\{[^}\n]{0,400}\b(dom|domain|host|hostname)\s*:'
