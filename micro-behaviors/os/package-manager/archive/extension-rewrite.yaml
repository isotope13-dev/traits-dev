defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: javascript-gem-extension-manifest-rewrite
    desc: Replaces RubyGems extensions manifest field
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (subscript_expression index: (string (string_fragment) @method))
            (member_expression property: (property_identifier) @method)]
          arguments: (arguments
            . (regex)
            . (binary_expression left: (string (string_fragment) @prefix)))
          (#eq? @method "replace")
          (#match? @prefix "^extensions:")) @match
  - id: javascript-wheel-sitecustomize-insertion
    desc: Inserts sitecustomize.py archive member
    if:
      type: tree-sitter
      query: |
        (assignment_expression
          left: (subscript_expression index: (string (string_fragment) @path))
          right: (identifier)
          (#eq? @path "sitecustomize.py")) @match
  - id: javascript-package-version-assignment
    size_max: 262144
    desc: Assigns incremented package version
    if:
      type: tree-sitter
      query: |
        (assignment_expression
          left: [
            (subscript_expression
              object: (identifier)
              index: (string (string_fragment) @field))
            (member_expression
              object: (identifier)
              property: (property_identifier) @field)]
          right: [(binary_expression
                    right: (number) @increment
                    (#match? @increment "^(0x)?1$")) @value
            (binary_expression
              right: (parenthesized_expression
                (binary_expression
                  right: (number) @nested_increment
                  (#match? @nested_increment "^(0x)?1$")))) @value
            (template_string
              (template_substitution
                (binary_expression
                  right: (number) @template_increment
                  (#match? @template_increment "^(0x)?1$")) @value))]
          (#eq? @field "version")
          ) @match
