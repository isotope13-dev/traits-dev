defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-wheel-pth-member-assignment
    desc: Assigns a dynamically named wheel pth member
    crit: notable
    conf: 0.96
    # The local name must be used as the member key in the same builder.
    # dist-info context distinguishes wheel member assembly from generic maps.
    # This is construction of archive contents, not proof of installation.
    if:
      type: tree-sitter
      query: |
        (function_declaration
          body: (statement_block
            (lexical_declaration (variable_declarator
              name: (identifier) @path
              value: (binary_expression operator: "+"
                right: (string (string_fragment) @suffix))))
            (expression_statement (assignment_expression
              left: (subscript_expression index: (identifier) @key)))) @builder
          (#eq? @path @key)
          (#match? @suffix "\\.pth$")
          (#match? @builder "\\.dist-info/")) @match
