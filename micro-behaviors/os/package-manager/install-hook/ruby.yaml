# RubyGems package lifecycle hooks. These APIs execute during installation or
# removal and are useful review surfaces, but their presence alone is not
# evidence of a supply-chain objective.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.95
  attack: "T1195.002"
traits:
  - id: gem-post-install
    desc: RubyGems registers a post-install hook
    if:
      type: symbol
      kind: member
      exact: 'Gem.post_install'
    unless:
      - id: well-known/tool/development/rbenv::rbenv-gem-rehash-plugin-context
      - id: well-known/lib/development/rubygems::rubygems-own-library-file
      - id: well-known/lib/runtime/jruby::runtime-context
      - id: well-known/lib/runtime/jruby::module-marker
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/cruby::rubygems-stdlib-path
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::ruby-test-file
  - id: gem-installer-post-install
    desc: RubyGems installer registers a post-install hook
    if:
      type: symbol
      regex: 'Gem::Installer\.post_install'
    unless:
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/cruby::rubygems-stdlib-path
      - id: well-known/lib/runtime/jruby::runtime-context
  - id: gem-pre-install
    desc: RubyGems registers a pre-install hook
    if:
      type: symbol
      kind: member
      exact: 'Gem.pre_install'
    unless:
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/cruby::rubygems-stdlib-path
      - id: well-known/lib/runtime/jruby::runtime-context
      - id: well-known/lib/runtime/jruby::module-marker
  - id: gem-installer-pre-install
    desc: RubyGems installer registers a pre-install hook
    if:
      type: symbol
      regex: 'Gem::Installer\.pre_install'
    unless:
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/cruby::rubygems-stdlib-path
  - id: gem-post-uninstall
    desc: RubyGems registers a post-uninstall hook
    if:
      type: symbol
      kind: member
      exact: 'Gem.post_uninstall'
    unless:
      - id: well-known/tool/development/rbenv::rbenv-gem-rehash-plugin-context
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/cruby::rubygems-stdlib-path
      - id: well-known/lib/runtime/jruby::runtime-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::ruby-test-file
  - id: gem-pre-uninstall
    desc: RubyGems registers a pre-uninstall hook
    if:
      type: symbol
      kind: member
      exact: 'Gem.pre_uninstall'
    unless:
      - id: well-known/tool/development/rbenv::rbenv-gem-rehash-plugin-context
      - id: well-known/tool/development/yard::rubygems-doc-hook-file
      - id: well-known/tool/development/rdoc::rubygems-doc-hook-file
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/cruby::rubygems-stdlib-path
      - id: well-known/lib/runtime/jruby::runtime-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::ruby-test-file
  - id: gem-extensions
    desc: RubyGem declares native extension scripts
    conf: 0.85
    if:
      type: symbol
      substr: ".extensions"
