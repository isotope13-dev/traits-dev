# The optional-dependency bootstrap: a helper that asks whether a module is
# already importable and only shells pip when it is not.
#
# `importlib.util.find_spec("x") is None` is a *presence probe*. Code whose
# purpose is to get a package installed does not first check whether it is
# already there, because the install is the point -- so the probe is what
# separates "this script needs pypdf and will fetch it once" from "this script
# wants a resolver consulted at run time". It is deliberately narrower than the
# `except ImportError:` shape, which malware does use to look ordinary.
defaults:
  platforms: [windows, unix]
  for: [python]
  mbc: C0002

traits:
  - id: python-module-presence-probe
    desc: Probes whether a module is importable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'find_spec\([^)]{0,60}\)\s+is\s+None'

composite_rules:
  # The proximity bound keeps the probe and the install inside the same helper
  # rather than anywhere in the file.
  - id: pip-install-guarded-by-missing-module
    desc: pip install gated on a missing-module probe
    crit: notable
    conf: 0.85
    near_bytes: 700
    all:
      - id: python-module-presence-probe
      - id: micro-behaviors/os/package-manager/install::subprocess-pip-install-list
