# Semantic placement review; matchers and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
traits:
- id: which-apt-get
  desc: checking for apt-get availability
  crit: baseline
  conf: 0.6
  if:
    type: text
    substr: which apt-get
- id: which-yum
  desc: checking for yum availability
  crit: baseline
  conf: 0.6
  if:
    type: text
    substr: which yum
- id: which-dnf
  desc: checking for dnf availability
  crit: baseline
  conf: 0.6
  if:
    type: text
    substr: which dnf
- id: package-manager-which-conditional
  desc: which package manager conditional
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: which\s+(apt-get|yum|dnf).{0,50}&&
- id: package-manager-if-conditional
  desc: if which package manager conditional
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: if.{0,50}which\s+(apt-get|yum|dnf)
composite_rules:
- id: which-package-check
  desc: checking for package manager availability
  crit: baseline
  conf: 0.6
  any:
  - id: micro-behaviors/os/package-manager/dependency-probe::which-apt-get
  - id: micro-behaviors/os/package-manager/dependency-probe::which-yum
  - id: micro-behaviors/os/package-manager/dependency-probe::which-dnf
- id: package-manager-conditional
  desc: Conditional package-manager availability probe
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/os/package-manager/dependency-probe::package-manager-which-conditional
  - id: micro-behaviors/os/package-manager/dependency-probe::package-manager-if-conditional
