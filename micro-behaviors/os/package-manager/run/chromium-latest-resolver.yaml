defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: chromium-resolver-defaults-latest
    desc: Chromium resolver defaults to latest revision
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((pair key: (property_identifier) @key
          value: (arrow_function
            parameters: (formal_parameters (identifier)
              (assignment_pattern left: (identifier) @version right: (string (string_fragment) @latest)))
            body: (binary_expression left: (await_expression
              (call_expression function: (member_expression
                object: (call_expression function: (member_expression property: (property_identifier) @resolve)
                  arguments: (arguments
                    (member_expression property: (property_identifier) @chromium)
                    (identifier) (identifier) @requested))))))))
          (#eq? @key "resolveBuildId")
          (#eq? @resolve "resolveBuildId")
          (#eq? @latest "latest")
          (#eq? @chromium "CHROMIUM")
          (#eq? @version @requested))

  - id: resolved-browser-launched-without-sandbox
    desc: Launches resolved browser without sandbox
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (function_declaration body: (statement_block
            (expression_statement (sequence_expression
              (assignment_expression)
              (assignment_expression left: (identifier) @pending
                right: (call_expression arguments: (arguments (object
                  (pair key: (property_identifier) @download)))))))))
          (function_declaration body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @resolved
              value: (await_expression (identifier) @awaited)))
            (return_statement (call_expression arguments: (arguments (object
              (pair key: (property_identifier) @executable
                value: (member_expression object: (identifier) @resolved2 property: (property_identifier) @executable2))
              (pair key: (property_identifier) @args value: (array
                (string (string_fragment) @nosandbox))))))))))
          (#eq? @pending @awaited)
          (#eq? @resolved @resolved2)
          (#eq? @download "downloadPath")
          (#eq? @executable "executablePath")
          (#eq? @executable2 "executablePath")
          (#eq? @args "args")
          (#eq? @nosandbox "--no-sandbox"))

  - id: chromium-unsandboxed-executable-probe
    desc: Launches a browser executable without sandbox
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @launch)
          arguments: (arguments (object
            (pair key: (property_identifier) @args value: (array (string (string_fragment) @flag)))
            (pair key: (property_identifier) @path value: (member_expression property: (property_identifier) @source)))))
          (#eq? @launch "launch")
          (#eq? @args "args")
          (#eq? @flag "--no-sandbox")
          (#eq? @path "executablePath")
          (#eq? @source "executablePath"))

  - id: chromium-snapshot-latest-marker
    desc: Reports selected Chromium revision
    if:
      type: text
      substr: 'Chromium revision:'

  - id: chromium-latest-resolver-source-text
    desc: Resolver source defaults build ID to latest
    if:
      type: text
      regex: 'resolveBuildId\s*:\s*async\s*\([^)]{0,80}=["'']latest["'']'

  - id: chromium-unsandboxed-probe-source-text
    desc: Browser launch text disables sandbox
    if:
      type: text
      regex: '\.launch\(\{headless:[^,]{1,40},args:\[["'']--no-sandbox["'']\],executablePath:'

composite_rules:
  # puppeteer-chromium-resolver (Cline's browser tool, scrapers) fetches the
  # latest snapshot and probes it with --no-sandbox; ordinary for headless
  # automation, so every resolver shape below stays notable.
  - id: latest-chromium-resolver-unsandboxed-launch
    desc: Latest Chromium resolver and unsandboxed launch
    crit: notable
    near_bytes: 16000
    all:
      - id: chromium-resolver-defaults-latest
      - id: resolved-browser-launched-without-sandbox
      - id: chromium-snapshot-latest-marker

  - id: latest-chromium-with-unsandboxed-probe
    desc: Latest Chromium resolver and unsandboxed probe
    crit: notable
    near_bytes: 16000
    all:
      - id: chromium-resolver-defaults-latest
      - id: chromium-snapshot-latest-marker
      - id: chromium-unsandboxed-executable-probe

  - id: latest-chromium-with-unsandboxed-probe-text
    desc: Latest resolver and unsandboxed launch text
    crit: notable
    near_bytes: 16000
    all:
      - id: chromium-latest-resolver-source-text
      - id: chromium-snapshot-latest-marker
      - id: chromium-unsandboxed-probe-source-text
