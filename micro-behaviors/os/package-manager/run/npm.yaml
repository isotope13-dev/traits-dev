defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  # `npm run publish` calls a package-defined script; its name does not prove
  # that the script publishes a package. Bare `npm run` lists available scripts.
  - id: npm-run-interface-call
    desc: Invokes npm run script interface
    if:
      type: symbol
      kind: call
      exact: npm
      arg:
        index: 0
        kind: identifier
        name: run
