defaults:
  for: [javascript, typescript]
  platforms: [macos, linux]
  crit: suspicious
  conf: 0.96
traits:
  - id: vscode-terminal-floating-brew
    desc: Editor terminal submits floating brew install
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @terminal
              value: (call_expression function: (member_expression property: (property_identifier) @create))))
          (expression_statement
            (call_expression function: (member_expression object: (identifier) @receiver property: (property_identifier) @send)
              arguments: (arguments . (string (string_fragment) @command)))))
          (#eq? @create "createTerminal")
          (#eq? @terminal @receiver)
          (#eq? @send "sendText")
          (#match? @command "^brew +install +[A-Za-z0-9_./-]+(@[0-9]+(\\.[0-9]+)?)?( +|$)"))

  - id: vscode-terminal-floating-brew-sequence
    desc: Editor terminal submits floating brew install
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @terminal
              value: (call_expression function: (member_expression property: (property_identifier) @create))))
          (expression_statement
            (sequence_expression
              (call_expression function: (member_expression object: (identifier) @receiver property: (property_identifier) @send)
                arguments: (arguments . (string (string_fragment) @command))))))
          (#eq? @create "createTerminal")
          (#eq? @terminal @receiver)
          (#eq? @send "sendText")
          (#match? @command "^brew +install +[A-Za-z0-9_./-]+(@[0-9]+(\\.[0-9]+)?)?( +|$)"))
