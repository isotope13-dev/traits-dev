defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: floating-global-npm-command-text
    desc: Floating global npm install command text
    if:
      type: text
      regex: 'npm\s+install\s+-g\s+(@[a-zA-Z0-9_.-]+/)?[a-zA-Z0-9_.-]+(@(latest|next))?([ \t"'']|$)'
  - id: terminal-command-adapter-call
    desc: Calls terminal execution adapter
    if:
      type: symbol
      kind: call
      regex: '(^|\.)executeCommandInTerminal$'
composite_rules:
  - id: floating-global-npm-near-terminal-adapter
    desc: Floating npm command near terminal adapter
    crit: suspicious
    near_bytes: 1024
    all:
      - id: floating-global-npm-command-text
      - id: terminal-command-adapter-call
