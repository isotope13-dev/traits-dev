defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: serialized-manifest-floating-dependency
    desc: Serializes floating npm dependency range
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((variable_declarator name: (identifier) @manifest
          value: (binary_expression
            left: (call_expression
              function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
              arguments: (arguments
                (object (pair key: (property_identifier) @dependencies
                  value: (object (pair value: (string (string_fragment) @version)))))))))
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @dependencies "dependencies")
          (#match? @version "^[~^][0-9]"))

  - id: write-lan-debugger-manifest
    desc: Writes generated LAN debugger manifest
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @write)
          arguments: (arguments . (identifier) . (identifier) @manifest))
          (#eq? @write "writeFile")
          (#eq? @manifest "LAN_DEBUGGER_PACKAGE_JSON"))

  - id: node-wrapper-npm-install
    desc: Node wrapper launches npm install
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (parenthesized_expression
            (sequence_expression (number)
              (member_expression property: (property_identifier) @spawn)))
          arguments: (arguments . (identifier) .
            (array . (string (string_fragment) @install))))
          (#eq? @spawn "spawnWithNode")
          (#eq? @install "install"))
