defaults:
  for: [python, javascript, powershell, pe]
  crit: component
  conf: 0.8
  platforms: [windows]
traits:
  - id: start-process-msiexec
    desc: Start-Process launches msiexec
    crit: component
    conf: 0.9
    if:
      type: text
      regex: (?i)\bStart-Process\b[^\r\n]{0,160}\bmsiexec(\.exe)?\b
  - id: start-process-msi-path
    desc: Start-Process launches MSI package
    crit: component
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bStart-Process\b[^\r\n]{0,160}\.msi\b'
