defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: go-installer-latest-default
    desc: Go installer defaults to latest
    if:
      type: text
      regex: 'goInstaller\s*\([^)]{0,80}=["'']latest["'']'
  - id: go-installer-two-argument-call
    desc: Calls Go installer without version argument
    if:
      type: text
      regex: '\.goInstaller\(["''][^"'']{1,100}["''],\s*["''][^"'']{1,60}["'']\)'
composite_rules:
  - id: go-installer-latest-with-default-call
    desc: Latest Go installer and unversioned call
    crit: suspicious
    near_bytes: 16000
    all:
      - id: go-installer-latest-default
      - id: go-installer-two-argument-call
