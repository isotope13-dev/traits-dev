defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: go-installer-latest-default
    desc: Go installer defaults to latest
    if:
      type: text
      regex: 'goInstaller\s*\([^)]{0,80}=["'']latest["'']'
  - id: go-installer-two-argument-call
    desc: Calls Go installer without version argument
    if:
      type: text
      regex: '\.goInstaller\(["''][^"'']{1,100}["''],\s*["''][^"'']{1,60}["'']\)'
  - id: github-release-latest-api-template
    desc: GitHub latest-release API URL template
    if:
      type: text
      regex: 'https://api\.github\.com/repos/[^`"''\s]{1,100}/releases/latest'
  - id: github-asset-download-url-field
    desc: References release asset download URL
    if:
      type: text
      substr: browser_download_url
composite_rules:
  - id: go-installer-latest-with-default-call
    desc: Latest Go installer and unversioned call
    crit: suspicious
    near_bytes: 16000
    all:
      - id: go-installer-latest-default
      - id: go-installer-two-argument-call
  - id: github-latest-release-asset-download
    desc: Latest GitHub release and asset URL
    crit: suspicious
    near_bytes: 4096
    all:
      - id: github-release-latest-api-template
      - id: github-asset-download-url-field
