# The active channel selects a release at runtime; no archive hash or
# version pin is present in this download-and-run path.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: active-gitkraken-cli-installer
    desc: Downloads and runs active GitKraken CLI
    if:
      type: yara
      source: |
        rule active_gitkraken_cli_installer {
          strings:
            $route = /"releases","gkcli-proxy","production",[a-z]+,[a-z]+,"active"/
            $meta = /await fetch\([a-z]+\).{0,250}\.json\(\).{0,150}\?\.packages\?\.zip/
            $download = /await fetch\([a-z]+\)\)\.ok/
            $install = /\["install"\],\{cwd:[a-z]+\.fsPath\}/
            $exec = /"gk\.exe":"\.\/gk"/
          condition:
            all of them and @meta > @route and @meta - @route < 1000 and
            @download > @meta and @download - @meta < 1000 and
            @install > @download and @install - @download < 4000
        }
