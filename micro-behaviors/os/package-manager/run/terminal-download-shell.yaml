defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: remote-curl-pipe-shell-text
    desc: Remote curl pipe to shell command text
    if:
      type: text
      regex: 'curl\s+[^\n"'']{1,120}https://[^\s"'']{1,180}\s*\|\s*(sh|bash)\b'
  - id: remote-powershell-pipe-eval-text
    desc: Remote PowerShell response piped to eval
    if:
      type: text
      regex: '(?i)\b(irm|invoke-restmethod)\s+https?://[^\s"''|]{1,180}\s*\|\s*(iex|invoke-expression)\b'
  - id: send-command-to-terminal-call
    desc: Calls terminal command adapter
    if:
      type: symbol
      kind: call
      regex: '(^|\.)sendCommandToTerminal$'
  - id: remote-shell-script-url
    desc: Source holds a remote shell script URL
    if:
      type: string_literal
      regex: '^https?://[^\s"''?#]{1,240}\.sh([?#][^\s"'' ]{1,100})?$'
composite_rules:
  - id: terminal-near-remote-shell-pipeline
    desc: Terminal call near remote shell pipeline
    crit: suspicious
    near_bytes: 2048
    all:
      - id: send-command-to-terminal-call
    any:
      - id: remote-curl-pipe-shell-text
      - id: remote-powershell-pipe-eval-text
  - id: shell-task-near-remote-script-pipeline
    desc: VS Code shell task near a remote script pipeline
    crit: suspicious
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/config/launch::shell-execution-constructor
      - id: micro-behaviors/process/work/task::execute-task-call
      - id: metadata/lang/source/syntax/command/download::source-curl-pipe-shell
      - id: remote-shell-script-url
