defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: remote-curl-pipe-shell-text
    desc: Remote curl pipe to shell command text
    if:
      type: text
      regex: 'curl\s+[^\n"'']{1,120}https://[^\s"'']{1,180}\s*\|\s*(sh|bash)\b'
  - id: send-command-to-terminal-call
    desc: Calls terminal command adapter
    if:
      type: symbol
      kind: call
      regex: '(^|\.)sendCommandToTerminal$'
composite_rules:
  - id: terminal-near-remote-shell-pipeline
    desc: Terminal call near remote shell pipeline
    crit: suspicious
    near_bytes: 2048
    all:
      - id: remote-curl-pipe-shell-text
      - id: send-command-to-terminal-call
