defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: terminal-uv-mutable-installer
    desc: Submits mutable uv installer to terminal
    if:
      type: yara
      source: |
        rule terminal_uv_mutable_installer {
          strings:
            $url = "curl -LsSf https://astral.sh/uv/install.sh | sh" ascii
            $terminal = "createTerminal(" ascii
            $submit = "s.sendText(Rb(e))" ascii
            $call = "Gu(\"uv\",\"uv\")" ascii
          condition:
            all of them and @submit > @url and @submit - @url < 1200 and
            @call > @submit and @call - @submit < 1200
        }
