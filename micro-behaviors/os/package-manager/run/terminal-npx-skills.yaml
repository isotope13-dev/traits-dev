defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.97
traits:
  - id: vscode-terminal-floating-agent-skills
    desc: Editor terminal runs floating skills installer
    if:
      type: yara
      source: |
        rule vscode_terminal_floating_agent_skills {
          strings:
            $terminal = "createTerminal(" ascii
            $send = /\.sendText\(`npx[ \t]+skills[ \t]+add[ \t]+[^`]{1,160}`\)/
          condition:
            for any i in (1..#send) : (
              for any j in (1..#terminal) : (
                @send[i] > @terminal[j] and @send[i] - @terminal[j] < 600
              )
            )
        }
