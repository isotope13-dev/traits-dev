defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-exec-floating-npx-fallback-helper
    desc: Helper passes floating npx fallback to exec
    if:
      type: tree-sitter
      language: javascript
      query: |
        (program
          (variable_declaration
            (variable_declarator name: (identifier) @module
              value: (call_expression function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @module_name) .))))
          (function_declaration name: (identifier) @helper
            parameters: (formal_parameters . (identifier) @parameter)
            body: (statement_block
              (return_statement (new_expression
                arguments: (arguments (arrow_function body: (statement_block
                  (expression_statement (call_expression
                    function: (parenthesized_expression (sequence_expression
                      (number) (member_expression object: (identifier) @module2
                        property: (property_identifier) @exec)))
                    arguments: (arguments . (identifier) @parameter2))))))))))
          (function_declaration body: (statement_block
            (lexical_declaration (variable_declarator
              value: (arrow_function body: (statement_block
                (lexical_declaration (variable_declarator name: (identifier) @command
                  value: (binary_expression operator: "||" right: (string (string_fragment) @fallback))))
                (expression_statement (sequence_expression
                  (assignment_expression right: (await_expression (call_expression
                    function: (identifier) @called
                    arguments: (arguments . (identifier) @command2 .))))))))))))
          (#eq? @require "require")
          (#match? @module_name "^(node:)?child_process$")
          (#eq? @module @module2)
          (#eq? @exec "exec")
          (#eq? @parameter @parameter2)
          (#eq? @helper @called)
          (#eq? @command @command2)
          (#match? @fallback "^npx +(-[A-Za-z][A-Za-z-]* +)*(@[A-Za-z0-9._-]+/)?[A-Za-z0-9_][A-Za-z0-9._-]*(@(latest|next|[~^][0-9.]+))?( +|$)"))
