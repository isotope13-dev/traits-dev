defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: floating-npm-cli-install-field
    desc: CLI install field names unversioned npm package
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((pair key: (property_identifier) @key
          value: (string (string_fragment) @command))
          (#eq? @key "cliInstallCommand")
          (#match? @command "^npm +(install|i) +(-[A-Za-z-]+ +)*(@[A-Za-z0-9._-]+/)?[A-Za-z0-9_][A-Za-z0-9._-]*(@(latest|next|[~^][0-9.]+))?( +|$)"))

  - id: terminal-runs-cli-install-field
    desc: Terminal helper receives CLI install field
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments . (member_expression property: (property_identifier) @field)))
          (#eq? @method "createTerminalAndRunCommand")
          (#eq? @field "cliInstallCommand"))
