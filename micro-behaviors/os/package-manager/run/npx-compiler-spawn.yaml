defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.94
traits:
  - id: npx-spawn-variable-argv
    desc: Spawn npx with variable argument list
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (_) @spawn
          arguments: (arguments
            . (string (string_fragment) @program)
            . (identifier) @argv))
          (#match? @spawn "(^spawn$|\\.spawn\\)?$)")
          (#eq? @program "npx"))
  - id: typescript-compiler-literal
    desc: TypeScript compiler command literal
    if:
      type: literal
      kind: string
      exact: tsc
composite_rules:
  - id: npx-spawn-near-tsc-literal
    desc: npx spawn near TypeScript compiler literal
    crit: suspicious
    near_bytes: 1024
    all:
      - id: npx-spawn-variable-argv
      - id: typescript-compiler-literal
