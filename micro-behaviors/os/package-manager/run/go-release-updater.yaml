defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  crit: notable
  conf: 0.96

traits:
  - id: go-latest-release-call
    desc: References GitHub latest-release routine
    if:
      type: text
      regex: 'go-github/v[0-9]{1,4}/github\.\(\*RepositoriesService\)\.GetLatestRelease'

  - id: go-release-asset-call
    desc: References GitHub release asset download
    if:
      type: text
      regex: 'go-github/v[0-9]{1,4}/github\.\(\*RepositoriesService\)\.DownloadReleaseAsset'

  - id: go-update-check-function
    desc: Go updater has release check routine
    if:
      type: text
      substr: /internal/update.check

  - id: go-update-download-replace-function
    desc: Go updater has download-and-replace routine
    if:
      type: text
      substr: /internal/update.downloadAndReplace

composite_rules:
  - id: go-github-latest-release-updater
    desc: Go updater references latest GitHub release
    crit: notable
    all:
      - id: go-latest-release-call
      - id: go-release-asset-call
      - id: go-update-check-function
      - id: go-update-download-replace-function
