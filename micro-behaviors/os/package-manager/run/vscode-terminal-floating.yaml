defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: vscode-terminal-floating-npm-statement
    desc: Editor terminal receives floating npm command
    if:
      type: tree-sitter
      language: javascript
      query: |
        (statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @terminal
              value: (call_expression
                function: (member_expression property: (property_identifier) @create))))
          (expression_statement
            (call_expression
              function: (member_expression object: (identifier) @receiver
                property: (property_identifier) @send)
              arguments: (arguments . (string (string_fragment) @command) .)))
          (#eq? @create "createTerminal")
          (#eq? @terminal @receiver)
          (#eq? @send "sendText")
          (#match? @command "^npm +(install|i) +(-[A-Za-z-]+ +)*(@[A-Za-z0-9._-]+/)?[A-Za-z0-9_][A-Za-z0-9._-]*(@(latest|next|[~^][0-9.]+))?( +|$)"))

  - id: vscode-terminal-floating-npm-submit
    desc: Editor terminal receives floating npm command
    if:
      type: tree-sitter
      language: javascript
      query: |
        (statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @terminal
              value: (call_expression
                function: (member_expression property: (property_identifier) @create))))
          (expression_statement
            (sequence_expression
              (call_expression
                function: (member_expression object: (identifier) @receiver
                  property: (property_identifier) @send)
                arguments: (arguments . (string (string_fragment) @command) .))))
          (#eq? @create "createTerminal")
          (#eq? @terminal @receiver)
          (#eq? @send "sendText")
          (#match? @command "^npm +(install|i) +(-[A-Za-z-]+ +)*(@[A-Za-z0-9._-]+/)?[A-Za-z0-9_][A-Za-z0-9._-]*(@(latest|next|[~^][0-9.]+))?( +|$)"))
