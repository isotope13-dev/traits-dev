# Static offline decoding: table index 11110 and key 4lgf yield
# `npm install ms-types@latest ms-vite-plugin@latest -D`. The local variable
# selected by the Y9Iq lookup is passed to child_process.exec via E0DP.
# These fragments are intentionally linked to this encoding; they do not
# claim that the installed packages contain malicious code or actually ran.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.99
traits:
  - id: encoded-kuai-floating-npm-dispatch
    desc: Encoded floating npm command reaches exec
    if:
      type: yara
      source: |
        rule encoded_kuai_floating_npm_dispatch {
          strings:
            $command = "b8kwWRX/W6JdQ8keW7RcRmkIFIfeW4SRmbRcTrNcP8k4W5hdOCo9W5yCWRTZWRxdR8owW5CNq2tdRSkFxKRcM8k6s8oSn0aMbCosBCo7WQRdIG" ascii
            $store = "SDsVF:a(5909,\"4lgf\",12902,10556,11521)" ascii
            $read = "n=r[c(7546,10792,7971,\"Y9Iq\",16094)]" ascii
            $exec = "U0[u(11480,12826,11816,\"E0DP\",17322)](n,x" ascii
            $module = "U0=require(K(-4457,854,\"lp4^\",-166,-2685))" ascii
          condition:
            all of them
        }
  - id: encoded-kuai-floating-npm-dispatch-older
    desc: Encoded floating npm command reaches exec
    if:
      type: yara
      source: |
        rule encoded_kuai_floating_npm_dispatch_older {
          strings:
            $command = "W73cSmk6WPPQW4xdJ8kOWQTme8kxW5L7WPiFlSo+xCkwWRJcMSkhWPBcS8kUzIpcPCk0W5BcNCkLd8oSW51gWOPmWP1mWPWJWQ06W57dG8k/qGesbW" ascii
            $store = "fiCyL:e(5359,\"^6op\",15606,11308,16176)" ascii
            $read = "b=i[W(17428,12024,15394,11069,\"deym\")]" ascii
            $exec = "p0[x(14995,11006,11841,\"SJuZ\",6929)](b,c" ascii
            $module = "p0=require(J(-1864,-4255,-5788,-162,\"kSYu\"))" ascii
          condition:
            all of them
        }
composite_rules:
  - id: encoded-kuai-floating-npm-dispatch-either
    desc: Encoded floating npm command reaches exec
    any:
      - id: encoded-kuai-floating-npm-dispatch
      - id: encoded-kuai-floating-npm-dispatch-older
