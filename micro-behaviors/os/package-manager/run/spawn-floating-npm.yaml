defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
traits:
  # Lazy installs of optional runtime dependencies (impit, sharp, native
  # addons) spawn `npm install pkg@latest` into a private directory.
  - id: spawn-npm-install-latest
    desc: Spawn npm install with latest package
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (_) @spawn
          arguments: (arguments
            . (string (string_fragment) @program)
            . (array
              . (string (string_fragment) @install)
              . (string (string_fragment) @package))))
        (#match? @spawn "(^spawn$|\\.spawn\\)?$)")
        (#eq? @program "npm")
        (#match? @install "^(install|i)$")
        (#match? @package "^[A-Za-z0-9_@/.-]+@latest$"))
