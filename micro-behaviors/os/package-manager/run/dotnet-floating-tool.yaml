defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: suspicious
traits:
  - id: node-exec-floating-dotnet-tool
    desc: Node installs an unversioned dotnet tool
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(exec|execSync)$'
      arg:
        kind: string
        regex: '^dotnet\s+tool\s+install\s+(-g|--global)\s+[A-Za-z0-9._-]+(\s+--allow-roll-forward)?\s*$'
