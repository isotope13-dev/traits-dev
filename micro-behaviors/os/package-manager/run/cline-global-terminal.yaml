defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: cline-global-install-terminal
    desc: Terminal dispatches floating Cline install
    if:
      type: yara
      source: |
        rule cline_global_install_terminal {
          strings:
            $binding = "let r=\"npm install -g cline\"" ascii
            $terminal = ".workspace.executeCommandInTerminal(" ascii
            $arg = ".create({command:r})" ascii
            $registration = "installClineCli:Gvc" ascii
          condition:
            all of them and @terminal > @binding and @terminal - @binding < 250 and
            @arg > @terminal and @arg - @terminal < 120
        }
