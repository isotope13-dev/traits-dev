defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: vscode-terminal-winget-floating
    desc: Terminal submits unpinned winget install
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments (string (string_fragment) @command)))
          (#eq? @method "sendText")
          (#match? @command "^winget[ \\t]+(install|upgrade)[ \\t]+")
          (#not-match? @command "(^|[ \\t])(-v|--version)[= \\t]+v?[0-9]"))

  - id: encoded-ollama-winget-install
    desc: Encoded Ollama winget install command
    if:
      type: text
      substr: D2LUz2v0igLUC3rHBgWGls1PzcbpBgXHBweUt2XSyw1Hic1Lic0TC291CMnLihDPBMDLDa

  - id: encoded-ollama-terminal-indices
    desc: Indexed terminal installer dispatch
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (subscript_expression
            object: (identifier)
            index: (call_expression function: (identifier) @decoder
              arguments: (arguments (number) @method)))
          arguments: (arguments
            (call_expression function: (identifier) @decoder2
              arguments: (arguments (number) @command))))
          (#eq? @decoder @decoder2)
          (#eq? @method "0x46c")
          (#eq? @command "0x703"))

  - id: encoded-ollama-rotation-checksum
    desc: Encoded installer rotation checksum
    if:
      type: text
      substr: '0xb2c65'
