defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96
traits:
  - id: checkmarx-asca-latest-request
    desc: Requests latest ASCA engine
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments . (null) . (true)))
          (#eq? @method "scanAsca"))
  - id: checkmarx-sca-realtime-call
    desc: Calls Checkmarx SCA realtime scan
    if:
      type: symbol
      kind: call
      regex: '\.runScaRealtimeScan$'
