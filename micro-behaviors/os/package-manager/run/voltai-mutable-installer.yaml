# The CLI version is an argument to a mutable installer script; the script
# itself is downloaded without a version, hash, or signature check.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: downloaded-mutable-installer-bash
    desc: Downloads mutable installer and invokes Bash
    if:
      type: yara
      source: |
        rule downloaded_mutable_installer_bash {
          strings:
            $url = "/install.sh`" ascii
            $download = "await Qh(i,a),d.chmodSync(a,493)" ascii
            $args = "[a,`--version`,e]" ascii
            $run = "await Hh(`bash`,s,{env:o})" ascii
          condition:
            all of them and @download > @url and @download - @url < 500 and
            @args > @download and @args - @download < 700 and
            @run > @args and @run - @args < 300
        }
