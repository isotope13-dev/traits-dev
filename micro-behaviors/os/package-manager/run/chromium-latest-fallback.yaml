# An installed or configured browser may be used instead. The network-selected
# revision matters only when the fallback downloader is actually reached.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.97
traits:
  - id: latest-chromium-download-and-launch-fallback
    desc: Downloads and launches latest browser fallback
    if:
      type: yara
      source: |
        rule latest_chromium_download_and_launch_fallback {
          strings:
            $default = "resolveBuildId:async(t,e=\"latest\")" ascii
            $revision = "t.revision=await RrA(t)" ascii
            $download = "await vrA(t)" ascii
            $fallback = "return{path:(await S2r()).executablePath,isBundled:!0}" ascii
            $launch = "executablePath:r,defaultViewport:e.viewport,headless:\"shell\"" ascii
          condition:
            all of them and @revision > @default and @revision - @default < 12000 and
            @download > @revision and @download - @revision < 500 and
            @fallback > @download and @fallback - @download < 5000 and
            @launch > @fallback and @launch - @fallback < 6000
        }
