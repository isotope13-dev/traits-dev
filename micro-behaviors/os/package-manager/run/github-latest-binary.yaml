defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: github-latest-binary-url
    desc: GitHub latest binary download URL
    if:
      type: text
      regex: 'https://github\.com/[^"''\s]{1,100}/releases/latest/download/'
  - id: https-get-call
    desc: Calls HTTPS GET
    if:
      type: symbol
      kind: call
      regex: '(^|\.)https\.get$'
composite_rules:
  - id: github-latest-binary-download-chmod
    desc: Latest binary URL near download and chmod
    crit: suspicious
    scope: file
    all:
      - id: github-latest-binary-url
      - id: https-get-call
      - id: micro-behaviors/fs/chmod/modify::node-chmod-call
