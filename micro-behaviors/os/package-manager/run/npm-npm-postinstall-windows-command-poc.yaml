defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-postinstall-windows-command-poc
  desc: PoC-named package declares Windows executable
  crit: notable
  conf: 0.99
  for: [npm, package.json]
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/os/package-manager/run::postinstall-windows-executable
  - id: metadata/package/placeholder::npm-name-poc
