defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: npx-floating-command-literal
    desc: npx command names a floating package
    if:
      type: string_literal
      regex: '^npx\s+(-[\w-]+\s+){0,4}(@[\w.-]+/)?\w[\w.-]*(@(latest|next|[~^][\d.]+))?(\s|$)'
  - id: node-exec-floating-npx-argument
    desc: Node exec receives a floating npx command
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(exec|execSync)$'
      arg:
        kind: string
        regex: '^npx\s+(-[\w-]+\s+){0,4}(@[\w.-]+/)?\w[\w.-]*(@(latest|next|[~^][\d.]+))?(\s|$)'
