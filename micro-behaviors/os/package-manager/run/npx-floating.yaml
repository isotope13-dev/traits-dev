defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: npx-floating-command-literal
    desc: npx command names a floating package
    if:
      type: string_literal
      regex: '^npx\s+(-[\w-]+\s+){0,4}(@[\w.-]+/)?[\w.-]+(@(latest|next|[~^][\d.]+))?(\s|$)'
