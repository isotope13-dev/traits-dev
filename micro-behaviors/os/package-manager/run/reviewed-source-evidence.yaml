# Reviewed source observations; no malicious intent is implied.
traits:
- platforms:
  - unix
  - windows
  conf: 0.9
  id: build-bunx-package
  desc: Build text invokes bunx with a package
  crit: notable
  for:
  - dockerfile
  - github-actions
  if:
    type: text
    regex: \bbunx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}
