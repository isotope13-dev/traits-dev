# The same bound promisified child_process.exec alias receives floating npx
# commands and is reachable through the registered error-detection handler.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: mcp-error-detector-floating-npx
    desc: MCP error tool runs floating npx checks
    if:
      type: yara
      source: |
        rule mcp_error_detector_floating_npx {
          strings:
            $import = "import { exec as exec3 } from \"child_process\"" ascii
            $promisify = "execAsync2 = promisify4(exec3)" ascii
            $check = "execAsync2(`npx ${tool} --version`" ascii
            $eslint = "checkCLI(\"eslint\")" ascii
            $prettier = "checkCLI(\"prettier\")" ascii
            $handler = "await runComprehensiveErrorDetection(options)" ascii
            $dispatch = "comprehensive_error_detection: comprehensiveErrorDetection" ascii
          condition:
            all of them
        }
