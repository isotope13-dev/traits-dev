defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.94
traits:
  # An unquoted filename in a conda command is a quoting weakness; it
  # observes a command shape, not a payload or an attacker objective.
  - id: conda-unquoted-file-name-template
    desc: Conda command interpolates an unquoted filename
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          arguments: (arguments
            (template_string
              (string_fragment) @prefix
              . (template_substitution
                (member_expression property: (property_identifier) @property))) @command))
          (#match? @command "^`conda env (create|update) ")
          (#match? @prefix "--file[ \\t]+$")
          (#eq? @property "fileName"))
