defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: github-runner-shell-execution
    desc: GitHub npx --yes passed to ShellExecution
    if:
      type: tree-sitter
      query: |
        ((new_expression
          constructor: (member_expression property: (property_identifier) @ctor)
          arguments: (arguments . [(string) (template_string)] @command)) @sink
          (#eq? @ctor "ShellExecution")
          (#match? @command "^[\"'`]npx[ \\t]+(-y|--yes)[ \\t]+(github:|https://github[.]com/|git[+]https://github[.]com/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"))

        ((lexical_declaration
          (variable_declarator name: (identifier) @bound value: [(string) (template_string)] @command)
          (variable_declarator value: (new_expression
            arguments: (arguments (new_expression
              constructor: (member_expression property: (property_identifier) @ctor)
              arguments: (arguments . (identifier) @used)) @sink))))
          (#eq? @ctor "ShellExecution")
          (#eq? @bound @used)
          (#match? @command "^[\"'`]npx[ \\t]+(-y|--yes)[ \\t]+(github:|https://github[.]com/|git[+]https://github[.]com/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"))

        ((_
          (lexical_declaration
            (variable_declarator name: (identifier) @bound value: [(string) (template_string)] @command))
          . (lexical_declaration
            (variable_declarator value: (new_expression
              arguments: (arguments (new_expression
                constructor: (member_expression property: (property_identifier) @ctor)
                arguments: (arguments . (identifier) @used)) @sink)))))
          (#eq? @ctor "ShellExecution")
          (#eq? @bound @used)
          (#match? @command "^[\"'`]npx[ \\t]+(-y|--yes)[ \\t]+(github:|https://github[.]com/|git[+]https://github[.]com/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"))

