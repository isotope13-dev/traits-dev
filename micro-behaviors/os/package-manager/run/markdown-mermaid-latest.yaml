# The generated HTML can be saved without execution; PDF rendering opens it
# in Chromium, where the unversioned Mermaid script is loaded conditionally.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: markdown-mermaid-latest-export
    desc: Markdown export loads floating Mermaid script
    if:
      type: yara
      source: |
        rule markdown_mermaid_latest_export {
          strings:
            $condition = "if(u(\".mermaid\").length>0)" ascii
            $script = "https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js" ascii
            $append = "u(\"body\").append(f)" ascii
            $export = "await jce(e,u.html(),n,t)" ascii
            $map = "exportByType:jce" ascii
            $browser = "require(\"puppeteer-core\").launch(u)" ascii
            $open = "m.goto(e$.file(s).toString()" ascii
          condition:
            all of them and @script > @condition and @script - @condition < 200 and
            @append > @script and @append - @script < 400 and
            @export > @append and @export - @append < 200 and
            @open > @browser and @open - @browser < 600
        }
