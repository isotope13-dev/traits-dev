defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: npx-latest-scoped-package-array
    desc: npx array names a floating scoped package
    if:
      type: text
      regex: '\[["'']npx["''],\s*["'']@[\w.-]+/[\w.-]+@latest["'']\]'
  - id: mcp-add-enabled-local-command
    desc: MCP client adds enabled local command
    if:
      type: text
      regex: '\.mcp\.add\(.{0,250}type:["'']local["''],command:[\w$]+,enabled:(!0|true)'
composite_rules:
  - id: mcp-floating-npx-enabled-local-server
    desc: MCP client enables floating npx server
    crit: suspicious
    near_bytes: 1000
    all:
      - id: npx-latest-scoped-package-array
      - id: mcp-add-enabled-local-command
