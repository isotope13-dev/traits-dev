defaults:
  platforms:
  - linux
  - unix
  - macos
  - android
  - ios
  for:
  - shell
composite_rules:
- id: github-source-build-installer
  desc: GitHub archive source build-install workflow
  crit: suspicious
  conf: 0.91
  all:
  - id: micro-behaviors/communications/url/external/github::github-archive-ref-download
  - id: micro-behaviors/data/archive/extract/tar::tar-extract
  - id: micro-behaviors/os/package-manager/source-install::local-build-install-script
  any:
  - id: micro-behaviors/communications/url/external/github::github-release-api-latest
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
- id: elevated-github-source-installer
  desc: Elevated GitHub archive source build-install workflow
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/os/package-manager/source-install::github-source-build-installer
  - id: micro-behaviors/os/package-manager/source-install::sudo-local-build-install-script
