defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: encoded-npm-install
    desc: Base64 text references npm install
    crit: suspicious
    conf: 0.95
    size_max: 200000
    if:
      type: encoded
      encoding: base64
      word: npm install
    unless:
      - id: well-known/lib/development/vscode-webview::acquire-vscode-api
      - id: metadata/file/format/source-map::sourcemap-inline-base64
      - id: metadata/file/format/markup::astrojs-package-reference
      - id: micro-behaviors/os/package-manager/reference-install::base64-markdown-example-bundle
# Base64-only like the sibling encoded-npm-install leg: without it, any
# minified line carrying unrelated \uXXXX escapes Unicode-decodes wholesale
# and a plaintext "--no-save" argv nearby counts as "encoded stealth".
