defaults:
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]

traits:
  - id: lnk-remote-msiexec-url
    desc: LNK arguments reference remote MSI install
    crit: suspicious
    conf: 0.98
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bmsiexec(\.exe)?\b.{0,80}[/\-](i|package)\b.{0,80}https?://'
