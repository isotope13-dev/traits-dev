defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: system-package-install-command-text
    desc: References a system package install command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(apt-get|apt|dnf|yum|brew|port|nix-env)\s+(install|-iA)\b[^\r\n]{0,100}'

  - id: platform-install-command-map-export
    desc: Exports platform-specific install command lookup
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: export function getInstallCommand

  - id: platform-install-command-map-table
    desc: Maps tool names to install command strings
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: const INSTALL_COMMANDS =

composite_rules:
  - id: platform-install-command-map-context
    desc: Documented per-platform tool install command table
    crit: exception
    conf: 0.96
    all:
      - id: platform-install-command-map-export
      - id: platform-install-command-map-table
