---
defaults:
  crit: notable
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vsto-clickonce-bootstrapper-clues
  desc: VSTO and ClickOnce bootstrapper references
  conf: 0.98
  all:
  - id: well-known/lib/platform/vsto::vstoee-dll-marker
  - id: well-known/lib/platform/clickonce::dfshim-dll-marker
  any:
  - id: well-known/lib/platform/vsto::install-vsto-via-vstoee
  - id: well-known/lib/platform/clickonce::launch-via-dfshim
  - id: metadata/binary/symbols/name/function::msi-product-check-marker
  - id: metadata/binary/symbols/name/function::vs-bootstrapper-aversion-prefix
