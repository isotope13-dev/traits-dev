defaults:
  platforms: [windows, unix]
  for: [github-actions]
  crit: notable
  conf: 0.85

# Workflow text may occur outside an executable step.
traits:
  - id: gha-apt-get-noninteractive-y
    desc: Workflow references apt-get install -y
    if:
      type: text
      substr: apt-get install -y
  - id: gha-apt-install-noninteractive-y
    desc: Workflow references apt install -y
    if:
      type: text
      substr: apt install -y
  - id: gha-yum-noninteractive
    desc: Workflow references yum install -y
    if:
      type: text
      substr: yum install -y
  - id: gha-dnf-noninteractive
    desc: Workflow references dnf install -y
    if:
      type: text
      substr: dnf install -y
