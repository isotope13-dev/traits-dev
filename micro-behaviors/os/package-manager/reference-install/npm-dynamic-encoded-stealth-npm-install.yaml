defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: encoded-stealth-npm-install
    desc: Encoded npm install and option references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/reference-install::encoded-npm-install
    any:
      - id: metadata/lang/source/literal/fragment/syntax::encoded-stealth-no-save
      - id: metadata/lang/source/literal/fragment/syntax::encoded-stealth-silent
      - id: metadata/lang/source/literal/fragment/syntax::encoded-stealth-no-audit
