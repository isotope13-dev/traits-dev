defaults:
  platforms: [windows]
  for: [oledoc, msi]
  conf: 0.92
traits:
  - id: lnk-msiexec-quiet-install
    desc: LNK arguments reference quiet MSI install
    crit: notable
    conf: 0.97
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bmsiexec(\.exe)?\s+/i\b.{0,160}\s+/qn\b'
