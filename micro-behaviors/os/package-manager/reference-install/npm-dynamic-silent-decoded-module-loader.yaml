defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: silent-decoded-module-loader
    desc: Encoded npm command and child process clues
    crit: suspicious
    conf: 0.97
    near_bytes: 1600
    all:
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/data/decode/embedded/base64::buffer-from-base64-literal-to-text
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
      - id: micro-behaviors/os/package-manager/reference-install::encoded-npm-install
