defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.9
traits:
  - id: package-install-command-text
    desc: Package manager install or add command text
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*(npm|pnpm|yarn|bun)\b.{0,60}\b(add|install|i)\s+[A-Za-z0-9@._/-]{1,120}'
  - id: cargo-add-command
    desc: Cargo add dependency command text
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*cargo\s+add\s+\S+'
  - id: go-get-command
    desc: Go get package command text
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*go\s+get\s+\S+'
