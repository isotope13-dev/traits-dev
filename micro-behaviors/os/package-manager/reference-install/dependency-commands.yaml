defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.9
traits:
  - id: cargo-add-command
    desc: Cargo add dependency command text
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*cargo\s+add\s+\S+'
  - id: go-get-command
    desc: Go get package command text
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*go\s+get\s+\S+'
