defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.82
traits:
  - id: npm-install-production-command-literal
    desc: Production npm install command literal
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: literal
      exact: npm install --production
  - id: npm-install-save-command
    desc: npm install command with save flag
    conf: 0.92
    if:
      type: literal
      regex: 'npm\s+install\s+[a-z@][a-z0-9._@/-]{1,60}\s+--save(\s|$)'
    unless:
      - id: metadata/file/format/markup::generic-template-source
