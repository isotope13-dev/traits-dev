defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: obfuscated-npm-dropper
    desc: Encoded npm install and process clues
    crit: suspicious
    conf: 0.95
    size_max: 200000
    scope: leaf
    near_bytes: 4096
    all:
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/os/package-manager/reference-install::encoded-npm-install
      - id: micro-behaviors/process/stdio/configure::child-stdio-ignore-option
