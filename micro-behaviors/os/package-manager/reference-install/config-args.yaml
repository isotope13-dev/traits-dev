defaults:
  platforms: [windows, unix]
traits:
  - id: config-args-package-install-command
    desc: Config args contain package install command
    crit: notable
    conf: 0.96
    for: [scripts, source, json, yaml, markdown, text]
    if:
      type: text
      regex: 'args["'']?\s*[:=]\s*\[[^\]]{0,200}\b(npm|pip3?|pnpm|yarn)\s+(install|i)\s+[\w@-]'
  # A model tool call carries its shell command as a parsed JSON value, not
  # as a config argument array, so the args-shaped atom above cannot see it.
  - id: tool-call-command-package-install
    desc: Tool-call command installs a package
    crit: notable
    conf: 0.96
    for: [json]
    if:
      type: value
      path: input.command
      regex: '^\s*(npm|pnpm|yarn|bun|pip3?|uv\s+pip)\s+(install|add|i)\s+[\w@-]'

