defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: runtime-clx-cookie-signature-install
    desc: String references clx-cookie-signature install
    crit: suspicious
    conf: 0.99
    if:
      type: string_literal
      regex: npm\s+install\s+clx-cookie-signature(\s|$)
