defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  crit: notable
  conf: 0.82
traits:
- id: npm-install-shell-boundary-text
  desc: npm install text at shell command boundary
  if:
    type: text
    regex: (?m)^[ \t]*(sudo[ \t]+)?npm[ \t]+install\b|[;&|][ \t]*(sudo[ \t]+)?npm[ \t]+install\b
  unless:
  - id: metadata/file/format/markup::generic-template-source
  - id: metadata/file/format/source-map::sourcemap
  - id: micro-behaviors/ui/help::package-install-remediation
  - id: metadata/file/naming::readme-requirements-install-basename
  - id: metadata/package/documentation/page::docusaurus-docs-bundle
  - id: metadata/package/documentation/source::readme-markdown-basename
- id: npm-named-install-shell-boundary-text
  desc: Named npm install text at command boundary
  if:
    type: text
    regex: '(^|[\n;&|])[ \t]*(sudo[ \t]+)?npm[ \t]+(install|i|add)[ \t]+[\w@][\w@./-]'
  unless:
  - id: metadata/file/format/markup::generic-template-source
  - id: metadata/file/naming::readme-requirements-install-basename
  - id: metadata/package/documentation/source::readme-markdown-basename
- id: tmp-staged-package-install-command
  desc: Stages /tmp package install with log
  crit: notable
  conf: 0.96
  for: [scripts, source, json, yaml, markdown, text]
  if:
    type: text
    regex: 'cd\s+/tmp/[\w.-]+\s*&&\s*(npm|pip3?|yarn)\s+install\s+[\w@.-]+[^\r\n]{0,60}>/tmp/'
