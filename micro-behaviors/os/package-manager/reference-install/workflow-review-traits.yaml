defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - elf
    - shell
traits:
  - id: gha-apt-get-install-cmd
    desc: Workflow references apt-get install
    crit: baseline
    conf: 0.75
    for: [github-actions]
    if:
      type: text
      substr: apt-get install
  - id: gha-apt-install-cmd
    desc: Workflow references apt install
    crit: baseline
    conf: 0.75
    for: [github-actions]
    if:
      type: text
      regex: 'apt install\s+\S+'
  - id: gha-yum-install-cmd
    desc: Workflow references yum install
    crit: baseline
    conf: 0.75
    for: [github-actions]
    if:
      type: text
      substr: yum install
  - id: gha-yum-install-y-cmd
    desc: Workflow references yum -y install
    crit: baseline
    conf: 0.75
    for: [github-actions]
    if:
      type: text
      substr: yum -y install
  - id: gha-dnf-install-cmd
    desc: Workflow references dnf install
    crit: baseline
    conf: 0.75
    for: [github-actions]
    if:
      type: text
      substr: dnf install
  - id: gha-dnf-install-y-cmd
    desc: Workflow references dnf -y install
    crit: baseline
    conf: 0.75
    for: [github-actions]
    if:
      type: text
      substr: dnf -y install
