defaults:
  platforms: [windows, unix]
  for:
    - python
    - shell
traits:
  - id: pip-install
    desc: pip install command text
    crit: baseline
    conf: 0.7
    for: [python, shell, pe]
    if:
      type: string_literal
      regex: \bpip\b.{0,50}\binstall\b
    not:
      - substr: Run `pip install
      - substr: run `pip install
      - substr: "`pip install"
      - substr: "pip install --upgrade"
  - id: pip-install-remote-url
    desc: Remote pip install URL reference
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '\bpip3?\s+install\s+https?://'
  - id: pip-install-y
    desc: pip install -y (non-interactive)
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      # pip must be the installer: prose like "…and pip. Debian: apt-get
      # install -y python3-pip" names pip after the fact and is not a
      # non-interactive pip command.
      regex: \bpip(3)?\s+install\b[^;\n]{0,12}-(y|yes)(\s|$)
  - id: pip-install-cli-text
    desc: pip install command text
    crit: notable
    conf: 0.85
    for: [text, markdown, shell]
    if:
      type: text
      regex: '(?m)\bpip[3]?\s+install\s+[^\n]{1,100}'
    not:
      - substr: Run `pip install
      - substr: run `pip install
      - substr: "`pip install"
  - id: pip-install-requests-command-literal
    desc: Literal pip install requests command
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: literal
      regex: '^pip3? install requests([ \t]|$)'
      exclude_docstrings: true
