defaults:
  platforms: [unix, windows]
traits:
- id: npm-install-command-text
  desc: npm install command string for a package
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?m)(^|[;&|''"`])[ \t]*npm[ \t]+install[ \t]+[A-Za-z0-9@][A-Za-z0-9._/-]{1,79}'
  not:
    # `npm install` followed by an English continuation word is a sentence about
    # the command, not an invocation of it: oh-my-pi's updater throws
    # ``new Error(`npm install failed with exit code ${code}`)``, where the
    # command-position anchor is the template-literal backtick and the
    # "package" is the word "failed".
    - regex: '\bnpm[ \t]+install[ \t]+(failed|failing|fails|succeeded|completed|finished|command|first|again|before|after|instead|works|worked|will|would|should|could|may|might|error|errors|output|here|now|step|script|process)\b'
    # A quote followed by whitespace before `npm` is a formatted instruction
    # inside a message, not a command: cross-spawn throws
    # ``'...you must install spawn-sync:\n\n' + '  npm install spawn-sync --save'``
    # to tell the developer what to run. Real command position after a quote
    # (`sh -c 'npm install x'`, `exec("npm install x")`) puts `npm` against the
    # quote, so requiring the gap only drops the prose form.
    - regex: '[''"`][ \t]+npm[ \t]+install'
  unless:
    - id: metadata/package/documentation/page::install-doc-basename
    - id: micro-behaviors/os/package-manager/reference-install::platform-install-command-map-context
# Same reasoning as `src-npm-install-package` below: `npm i <pkg>` at command
# position in a shell script is a developer running an automation script -- the
# MegaLinter repo's `format-tables.sh` installs the formatter it is about to
# run -- and the autoinstall verdict belongs to the install-hook and
# child-process composites.
