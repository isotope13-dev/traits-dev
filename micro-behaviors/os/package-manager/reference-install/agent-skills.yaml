defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, package.json]
  crit: notable

traits:
  - id: npx-skills-add-global-command-text
    desc: References global npx skill installation command
    conf: 0.95
    if:
      type: text
      regex: '\bnpx\s+(-y\s+)?skills\s+add\b.{0,160}(--global|-g)\b'

  - id: npx-skills-remove-global-command-text
    desc: References global npx skill removal command
    conf: 0.9
    for: [javascript, typescript, package.json]
    if:
      type: text
      regex: '\bnpx\s+(-y\s+)?skills\s+remove\b.{0,160}(--global|-g)\b'
