defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
# The hook payload filename is attacker-chosen and renames for free; these
# rules match any local shell script run by the install hook, not just
# install.sh.
- id: install-shell-hook-missing-payload
  desc: Install hook script not listed for publication
  crit: suspicious
  conf: 0.98
  scope: outer
  for: [package.json, npm, tar]
  all:
  - id: micro-behaviors/os/package-manager/hook-install::npm-install-local-shell-script-command
  - id: micro-behaviors/os/package-manager/hook-install::install-hook-omits-companion-from-files-list
  unless:
  - id: metadata/package/files/package-json::files-list-hook-shell-script

- id: tiny-hollow-missing-shell-hook
  desc: Unlisted install script and constant functions
  crit: notable
  conf: 0.97
  for: [package.json, npm, tar, javascript]
  scope: archive
  all:
  - id: install-shell-hook-missing-payload
  - id: metadata/package/entrypoint/module::has-index-entry
  - id: metadata/lang/source/function::constant-return-function-ratio-half
  - id: metadata/package/files/package-json::files-array-present

- id: unpublished-shell-loader-without-source
  desc: Install script omitted from files list with no repo or build script
  crit: suspicious
  conf: 0.97
  for: [npm, package.json]
  scope: archive
  all:
  - id: install-shell-hook-missing-payload
  - id: metadata/package/repository::no-repo-with-hooks
  unless:
  - id: metadata/package/scripts/build::declares-build-stage-script
