defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: postinstall-best-effort-bootstrap
    desc: Postinstall hook has best-effort bootstrap clues
    crit: notable
    conf: 0.93
    for:
      - npm
      - tar
      - package.json
      - javascript
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/lang/source/literal/fragment/message::postinstall-never-fail-install-prose
      - id: micro-behaviors/process/exit/terminate::node-explicit-success-exit
