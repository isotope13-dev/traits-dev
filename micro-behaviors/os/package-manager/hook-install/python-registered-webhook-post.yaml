defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-registered-install-run-post
    desc: Registered install run method posts HTTP
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition name: (identifier) @class superclasses: (argument_list (identifier) @base)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement [
                (call function: (attribute object: (identifier) @requests attribute: (identifier) @post))
                (assignment right: (call function: (attribute object: (identifier) @requests attribute: (identifier) @post)))
              ])))))
          (expression_statement (call function: [(identifier) @setup (attribute attribute: (identifier) @setup)] arguments: (argument_list
            (keyword_argument name: (identifier) @cmdclass value: (dictionary
              (pair key: (string) @key value: (identifier) @registered)))))))
          (#eq? @base "install") (#eq? @run "run") (#eq? @requests "requests") (#eq? @post "post")
          (#eq? @class @registered) (#eq? @setup "setup") (#eq? @cmdclass "cmdclass")
          (#match? @key "^.install.$"))
  - id: python-registered-install-helper-post
    desc: Registered install method invokes POST helper
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition name: (identifier) @class superclasses: (argument_list (identifier) @base)
            body: (block
              (function_definition name: (identifier) @run body: (block (try_statement body: (block
                (expression_statement (call function: (attribute object: (identifier) @self attribute: (identifier) @called)))))))
              (function_definition name: (identifier) @helper body: (block
                (expression_statement (assignment right: (call function: (attribute object: (identifier) @requests attribute: (identifier) @post))))))))
          (expression_statement (call function: (identifier) @setup arguments: (argument_list
            (keyword_argument name: (identifier) @cmdclass value: (dictionary
              (pair key: (string) @key value: (identifier) @registered)))))))
          (#eq? @base "install") (#eq? @run "run") (#eq? @self "self") (#eq? @called @helper)
          (#eq? @requests "requests") (#eq? @post "post") (#eq? @class @registered)
          (#eq? @setup "setup") (#eq? @cmdclass "cmdclass") (#match? @key "^.install.$"))
