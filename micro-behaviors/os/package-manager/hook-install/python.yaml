# setuptools install-time command hooks. Overriding a setup.py command class is
# the documented way to adjust what `pip install` does -- rewriting script
# shebangs, installing symlinks, compiling assets -- and Ansible's own setup.py
# subclasses install_scripts for exactly that. The supply-chain composites in
# objectives/supply-chain/ supply the intent by pairing this with the payload.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002

traits:
  - id: cmdclass-install-scripts
    desc: setup.py overrides install_scripts command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']install_scripts["'']\s*:\s*InstallScripts'
