# A lifecycle hook plus host fields and a POST does not establish theft.
# Keep the package-level co-occurrence visible without inferring a recipient,
# consent, execution linkage, or dependency substitution from these atoms.
defaults:
  platforms: [windows, linux]
  for: [npm, tar, zip, package.json, javascript]
composite_rules:
  - id: npm-preinstall-host-fields-post
    desc: Preinstall package has host fields and POST
    crit: notable
    conf: 0.97
    scope: package
    all:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: micro-behaviors/data/serialize/schema-object::host-platform-arch-text-sequence
      - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-post-body
