defaults:
  platforms: [netbsd, unix]
  for: [javascript, typescript]
traits:
  - id: micro-behaviors/os/package-manager/hook-install::node-pkgsrc-post-install-hook
    desc: pkgsrc post-install assignment text
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: POST_INSTALL+=

composite_rules:
  - id: micro-behaviors/os/package-manager/hook-install::node-pkgsrc-install-hook
    desc: pkgsrc hook and defaults path clues
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/hook-install::node-pkgsrc-post-install-hook
      - id: micro-behaviors/fs/path/package-manager::node-pkgsrc-defaults-path
