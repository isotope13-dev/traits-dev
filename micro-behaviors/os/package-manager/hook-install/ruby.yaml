# RubyGems package lifecycle hooks. These APIs execute during installation or
# removal and are useful review surfaces, but their presence alone is not
# evidence of a supply-chain objective.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.95
  attack: "T1195.002"
traits:
  - id: gem-post-install
    desc: RubyGems post-install hook reference
    if:
      type: symbol
      kind: member
      exact: 'Gem.post_install'
  - id: gem-installer-post-install
    desc: RubyGems installer post-install hook reference
    if:
      type: symbol
      substr: 'Gem::Installer.post_install'
  - id: gem-pre-install
    desc: RubyGems pre-install hook reference
    if:
      type: symbol
      kind: member
      exact: 'Gem.pre_install'
  - id: gem-installer-pre-install
    desc: RubyGems installer pre-install hook reference
    if:
      type: symbol
      substr: 'Gem::Installer.pre_install'
  - id: gem-post-uninstall
    desc: RubyGems post-uninstall hook reference
    if:
      type: symbol
      kind: member
      exact: 'Gem.post_uninstall'
  - id: gem-pre-uninstall
    desc: RubyGems pre-uninstall hook reference
    if:
      type: symbol
      kind: member
      exact: 'Gem.pre_uninstall'
  - id: gem-extensions
    desc: RubyGem declares native extension scripts
    conf: 0.85
    if:
      type: symbol
      substr: ".extensions"

composite_rules:
  # A native-extension build script shelling out. Common for gems that build
  # vendored libraries, so this records the install-time command only.
  - id: extconf-shell-command
    desc: Gem extconf.rb runs a shell command
    conf: 0.85
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/process/create/subprocess/reference::ruby-system-shell-command
