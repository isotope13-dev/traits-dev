defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: post-install-package-import
  desc: Install run followed by Python import
  crit: suspicious
  conf: 0.9
  for:
  - python
  - pkginfo
  if:
    type: text
    regex: install\.run\s*\(\s*self\s*\)\s*\n\s*import\s+\w+

composite_rules:
- id: install-scripts-exec-hook
  desc: Install scripts hook declarations
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/package-manager/hook-install::install-scripts-class
  - id: micro-behaviors/os/package-manager/hook-install::cmdclass-install-scripts
