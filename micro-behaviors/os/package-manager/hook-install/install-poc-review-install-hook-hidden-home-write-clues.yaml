defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]
composite_rules:
  - id: install-hook-hidden-home-write-clues
    for: [python]
    desc: Install hook has hidden HOME path and write clues
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
      - id: micro-behaviors/fs/path/user-directory::home-hidden-dotpath
    any:
      - id: micro-behaviors/fs/write/file/full/string::python-pathlib-write-text
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/fs/directory/create::mkdir-python

