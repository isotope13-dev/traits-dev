defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]
composite_rules:
  - id: install-hook-visible-console-clues
    desc: Install hook has visible console clues
    crit: notable
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
    any:
      - id: micro-behaviors/process/argument/interpreter::cmd-k-persistent-console
      - id: micro-behaviors/process/config/launch::python-create-new-console
      - id: micro-behaviors/data/format/script::embedded-batch-pause-prompt

