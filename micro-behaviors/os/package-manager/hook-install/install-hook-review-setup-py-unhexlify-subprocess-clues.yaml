defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
- id: setup-py-unhexlify-subprocess-clues
  crit: suspicious
  desc: Setup hook has hex decoding and Python subprocess clues
  conf: 0.96
  all:
  - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
  - id: micro-behaviors/data/decode/hex::python-unhexlify-text
  - id: micro-behaviors/process/interpreter/python::sys-executable-popen
