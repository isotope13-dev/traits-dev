composite_rules:
- platforms:
  - windows
  - linux
  - macos
  - unix
  for:
  - scripts
  - npm
  - package.json
  id: package-install-hook-present
  desc: Package declares install-time code execution
  crit: notable
  scope: archive
  conf: 0.9
  any:
  - id: metadata/build/package/recipe/setup-hooks::python-install-hook
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: metadata/package/scripts/lifecycle::has-install-script
