defaults:
  platforms: [macos]
  for: [pkg]
composite_rules:
- id: macpkg-nested-package-download-clues
  desc: Installer hook, temp package, and curl clues
  crit: suspicious
  conf: 0.99
  scope: archive
  platforms: [macos, windows, linux]
  for: [scripts, '!jcl', macho, markdown, objectivec, pkg, swift, text]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/fs/path/archive::macos-package-temp-path-reference
    - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url

