defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  # Call/member facts do not retain the assignment target's complete shape.
  # Proximity between "scripts" and "postinstall" would also match a read or
  # documentation. This query requires an actual install-hook assignment and
  # accepts namespace and quoted-subscript spellings without a chosen name.
  - id: javascript-install-hook-assignment
    size_max: 262144
    desc: Assigns a package install lifecycle hook
    if:
      type: tree-sitter
      query: |
        (assignment_expression
          left: [
            (member_expression
              object: [
                (member_expression property: (property_identifier) @scripts)
                (subscript_expression index: (string (string_fragment) @scripts))
              ]
              property: (property_identifier) @hook)
            (subscript_expression
              object: [
                (member_expression property: (property_identifier) @scripts)
                (subscript_expression index: (string (string_fragment) @scripts))
              ]
              index: (string (string_fragment) @hook))
          ]
          (#eq? @scripts "scripts")
          (#match? @hook "^(preinstall|install|postinstall)$"))
