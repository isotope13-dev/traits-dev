# Explicit package operands in lifecycle command values are capabilities.
# The parent-directory install objective supplies the boundary-crossing context.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-preinstall-names-dependency
    desc: npm preinstall names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?npm\s+(install|i|add)\s+[A-Za-z@./]'

  - id: npm-install-names-dependency
    desc: npm install names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.install
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?npm\s+(install|i|add)\s+[A-Za-z@./]'

  - id: npm-postinstall-names-dependency
    desc: npm postinstall names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?npm\s+(install|i|add)\s+[A-Za-z@./]'

  - id: yarn-preinstall-names-dependency
    desc: yarn preinstall names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?yarn\s+add\s+[A-Za-z@./]'

  - id: yarn-install-names-dependency
    desc: yarn install names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.install
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?yarn\s+add\s+[A-Za-z@./]'

  - id: yarn-postinstall-names-dependency
    desc: yarn postinstall names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?yarn\s+add\s+[A-Za-z@./]'

  - id: pnpm-preinstall-names-dependency
    desc: pnpm preinstall names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?pnpm\s+(add|install)\s+[A-Za-z@./]'

  - id: pnpm-install-names-dependency
    desc: pnpm install names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.install
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?pnpm\s+(add|install)\s+[A-Za-z@./]'

  - id: pnpm-postinstall-names-dependency
    desc: pnpm postinstall names dependency to add
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)(^|[;&|]\s*|\$\()\s*(sudo\s+)?pnpm\s+(add|install)\s+[A-Za-z@./]'

composite_rules:
  - id: npm-install-hook-adds-explicit-dependency
    desc: npm hook names dependency to add
    crit: notable
    conf: 0.95
    any:
      - id: npm-preinstall-names-dependency
      - id: npm-install-names-dependency
      - id: npm-postinstall-names-dependency

  - id: yarn-install-hook-adds-explicit-dependency
    desc: yarn hook names dependency to add
    crit: notable
    conf: 0.95
    any:
      - id: yarn-preinstall-names-dependency
      - id: yarn-install-names-dependency
      - id: yarn-postinstall-names-dependency

  - id: pnpm-install-hook-adds-explicit-dependency
    desc: pnpm hook names dependency to add
    crit: notable
    conf: 0.95
    any:
      - id: pnpm-preinstall-names-dependency
      - id: pnpm-install-names-dependency
      - id: pnpm-postinstall-names-dependency

  - id: install-hook-adds-explicit-dependency
    desc: Install hook names a dependency to add
    crit: notable
    conf: 0.95
    any:
      - id: npm-install-hook-adds-explicit-dependency
      - id: yarn-install-hook-adds-explicit-dependency
      - id: pnpm-install-hook-adds-explicit-dependency

  - id: lifecycle-parent-navigation-and-package-install
    desc: Lifecycle parent path and install commands coexist
    crit: notable
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/package-manager/hook-install::install-hook-runs-pkg-install
      - id: micro-behaviors/os/package-manager/hook-install::install-hook-adds-explicit-dependency
    any:
      - id: micro-behaviors/fs/directory/chdir::npm-preinstall-parent-directory
      - id: micro-behaviors/fs/directory/chdir::npm-install-parent-directory
      - id: micro-behaviors/fs/directory/chdir::npm-postinstall-parent-directory
      - id: micro-behaviors/fs/directory/chdir::npm-prepare-parent-directory
