defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: preinstall-install-and-node-command
    desc: Preinstall declares package install and local Node code
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/hook-install::preinstall-runs-npm-install
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script
  # Install-time PII telemetry: the hook above auto-runs local code that
  # ships the installer's public IP to a third-party telemetry endpoint.
  # Either half alone is suspicious; the combination is installer spyware
  # with no legitimate distribution use, so it convicts on its own.
