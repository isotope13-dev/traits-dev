defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pacman-scriptlet-foreign-package-bootstrap
    # The AUR/ALVR supply-chain vector: a distro package's root-level install
    # scriptlet pulls a foreign-ecosystem package (npm/pip/gem), whose own
    # install hooks then execute as root. A legitimate package declares its
    # dependencies through the PKGBUILD and pacman — it does not shell out to a
    # second package manager to fetch arbitrary code at install time.
    desc: pacman scriptlet bootstraps a foreign-ecosystem package install
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-scriptlet-hook
    any:
      - id: micro-behaviors/os/package-manager/runtime-install::scriptlet-npm-install-package
      - id: micro-behaviors/os/package-manager/runtime-install::scriptlet-pip-install-package
      - id: micro-behaviors/os/package-manager/runtime-install::scriptlet-gem-install-package
      - id: micro-behaviors/os/package-manager/runtime-install::scriptlet-js-runtime-install-package
      - id: micro-behaviors/os/package-manager/runtime-install::scriptlet-native-toolchain-install
      - id: micro-behaviors/os/package-manager/runtime-install::scriptlet-runtime-fetch-install
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/process/interpreter/shell::curl-process-substitution

