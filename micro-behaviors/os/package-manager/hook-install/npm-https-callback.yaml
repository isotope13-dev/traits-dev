composite_rules:
- platforms:
  - unix
  - windows
  for:
  - npm
  - tar
  - package.json
  - javascript
  - typescript
  id: npm-postinstall-oob-https-context
  desc: Postinstall hook with OOB HTTPS request clues
  crit: notable
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/communications/url/host/oob::oob-endpoint-any
  - id: micro-behaviors/communications/http/request/client::https-request
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
