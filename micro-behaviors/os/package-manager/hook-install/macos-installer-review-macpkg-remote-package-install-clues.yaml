defaults:
  platforms: [macos]
  for: [pkg]
composite_rules:
- id: macpkg-remote-package-install-clues
  desc: Installer hook and remote package setup clues
  crit: suspicious
  conf: 0.96
  scope: archive
  for: [shell, pkg]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
  any:
    - id: micro-behaviors/data/archive/extract/zip::macpkg-ditto-downloaded-zip
    - id: micro-behaviors/os/package-manager/sideload::macpkg-installer-downloaded-pkg

