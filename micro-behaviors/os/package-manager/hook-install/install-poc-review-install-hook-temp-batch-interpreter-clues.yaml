defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]
composite_rules:
  - id: install-hook-temp-batch-interpreter-clues
    for: [python, javascript, ruby, php, powershell]
    desc: Install hook has temp, batch, and interpreter clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
      - id: micro-behaviors/os/env/read/named::temp-environment-variable-read
      - id: micro-behaviors/data/format/script::embedded-batch-script-header
    any:
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-cmd-c
      - id: micro-behaviors/process/argument/interpreter::cmd-k-persistent-console
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name

