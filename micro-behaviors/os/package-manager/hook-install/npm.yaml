# npm lifecycle scripts that run a JavaScript file shipped in the package:
# `"postinstall": "node install.js"`. This is how esbuild, sharp and other
# native-binary packages fetch or build platform pieces, so the atom only
# records that install-time code runs from a bundled file. Whether that file
# is a loader is decided by the composites that inspect what it does.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.96
  attack: T1195.002
traits:
  - id: npm-install-runs-bundled-script
    desc: npm install runs a bundled JS file
    if:
      type: value
      path: scripts.install
      regex: (^|[;&]{1,2})\s*node\s+(\./)?(install|preinstall|postinstall)\.([cm]?js)(\s|$)
  - id: npm-preinstall-runs-bundled-script
    desc: npm preinstall runs a bundled JS file
    if:
      type: value
      path: scripts.preinstall
      regex: (^|[;&]{1,2})\s*node\s+(\./)?(install|preinstall|postinstall)\.([cm]?js)(\s|$)
  - id: npm-postinstall-runs-bundled-script
    desc: npm postinstall runs a bundled JS file
    if:
      type: value
      path: scripts.postinstall
      regex: (^|[;&]{1,2})\s*node\s+(\./)?(install|preinstall|postinstall)\.([cm]?js)(\s|$)
