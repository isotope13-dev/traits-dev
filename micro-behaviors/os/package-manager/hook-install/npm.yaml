# npm lifecycle scripts that run a JavaScript file shipped in the package:
# `"postinstall": "node install.js"`. This is how esbuild, sharp and other
# native-binary packages fetch or build platform pieces, so the atom only
# records that install-time code runs from a bundled file. Whether that file
# is a loader is decided by the composites that inspect what it does.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.96
traits:
  - id: npm-install-runs-bundled-script
    desc: npm install runs a bundled JS file
    if:
      type: value
      path: scripts.install
      regex: (^|[;&]{1,2})\s*node\s+(\./)?(install|preinstall|postinstall)\.([cm]?js)(\s|$)
  - id: npm-preinstall-runs-bundled-script
    desc: npm preinstall runs a bundled JS file
    if:
      type: value
      path: scripts.preinstall
      regex: (^|[;&]{1,2})\s*node\s+(\./)?(install|preinstall|postinstall)\.([cm]?js)(\s|$)
  - id: npm-postinstall-runs-bundled-script
    desc: npm postinstall runs a bundled JS file
    if:
      type: value
      path: scripts.postinstall
      regex: (^|[;&]{1,2})\s*node\s+(\./)?(install|preinstall|postinstall)\.([cm]?js)(\s|$)
  - id: npm-postinstall-runs-index-entry
    desc: npm postinstall runs package index.js
    if:
      type: value
      path: scripts.postinstall
      regex: (^|[;&]{1,2})\s*node\s+(\./)?index\.([cm]?js)(\s|$)

composite_rules:
  - id: npm-install-runs-bundled-script-any
    desc: npm install lifecycle runs bundled JavaScript
    any:
      - id: npm-install-runs-bundled-script
      - id: npm-preinstall-runs-bundled-script
      - id: npm-postinstall-runs-bundled-script
      - id: npm-postinstall-runs-index-entry
  # A postinstall that targets the installing project (INIT_CWD), writes
  # files, and assigns package script entries rewrites the consumer's build
  # pipeline. This is setup context (scaffolders, lint guards), not proof of
  # an implant: there is no detached child, remote fetch, credential access,
  # or deletion here.
  - id: install-hook-rewrites-consumer-package-scripts
    desc: Install hook rewrites consumer package scripts
    crit: notable
    conf: 0.9
    for: [npm, shell, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/env/read::npm-init-cwd-read
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/fs/path/package-manager::scripts-member-assignment
