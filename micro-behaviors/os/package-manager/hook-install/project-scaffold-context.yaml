# Benign context for install-time project scaffolders. A package whose install
# hook copies its own files into the invoking project (INIT_CWD) and rewrites
# that project's package.json does what a project generator does. Its detached
# re-run of the same setup is a retry, not a payload stage. Nothing here reads
# or fetches remote content, so the hostile silent-detached-child composite
# must not treat this shape as a dropper. A dropper that uses only the bare
# detached spawn keeps its conviction, because all three legs are required.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]

composite_rules:
  - id: install-project-scaffold-context
    desc: Install hook copies files and rewrites invoking project package.json
    crit: exception
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/os/env/path::npm-init-cwd-read
      - id: micro-behaviors/fs/file/copy/call::fs-copy
      - id: micro-behaviors/fs/path/package-manager::package-json-path-join
