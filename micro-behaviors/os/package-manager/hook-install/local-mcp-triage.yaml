defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: bundled-install-script-hook-with-files-list
    desc: Install-script declaration with files allowlist
    crit: notable
    conf: 0.9
    all:
    - id: metadata/package/files/package-json::files-array-present
    any:
    - id: micro-behaviors/os/package-manager/hook-install::npm-install-runs-bundled-script
    - id: micro-behaviors/os/package-manager/hook-install::npm-preinstall-runs-bundled-script
    - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-bundled-script
    - id: metadata/package/scripts/lifecycle::postinstall-runs-init-js

  - id: hook-with-background-process
    desc: Hook declaration beside background process
    crit: notable
    conf: 0.9
    for: [npm, tar, javascript, package.json, zip, powershell, batch]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::npm-pre-or-postinstall-hook
    any:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
    unless:
      # scope: archive pools both legs across every bundled dependency of an
      # Electron app, so a hook in one package and a detached launcher in
      # another (Karma spawns browsers detached) read as one package.
      - id: well-known/lib/runtime/scripted/electron::electron-app-bundle-exception
      - id: micro-behaviors/process/create/self-respawn::cli-daemon-self-relaunch-context
      - id: micro-behaviors/process/create/shell/script-host::interactive-setup-wizard-launch
      - id: well-known/app/ai/coding-agent/omnius/
      # agent-glovebox postinstall regenerates committed artifacts; a sibling
      # helper opens the system browser with detached+stdio:ignore and is not
      # an install-time hidden launcher.
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/app/ai/knowledge/lean-ctx::source-tree-identity
      # TeamX postinstall detaches `teamx-agent sync-history` when a prior
      # `.teamx-config.json` exists; that is the product's documented import,
      # not a hidden payload launcher.
      - id: well-known/app/ai/agent-runtime/teamx-agent/
      - id: well-known/tool/development/vcs/facebook-sapling::facebook-sapling-source-archive-context
      - id: well-known/tool/development/vcs/facebook-sapling::go-module-zip-basename

  - id: hook-with-agent-config-path
    desc: Node hook declaration beside agent config path
    crit: notable
    conf: 0.9
    for: [npm, shell, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/fs/path/agent-config/
    unless:
      - id: metadata/package/description/function::agent-tool-purpose-description-context
      - id: well-known/app/ai/coding-agent/nextspark::archive-context
      - id: well-known/tool/development/agent/rigxyz::archive-context
      - id: well-known/app/ai/coding-agent/novahiz::archive-context
      - id: well-known/tool/development/agent/sap-ai-dev-toolkit::archive-context

