defaults:
  platforms: [unix, windows]
  for: [package.json]

composite_rules:
  - id: lifecycle-hook-runs-node-script
    desc: Install lifecycle hook runs a local Node.js script
    crit: notable
    conf: 0.96
    for: [npm, tar, package.json]
    any:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: metadata/package/scripts/entrypoint::preinstall-runs-node-local-script

  - id: local-install-script-hook-with-files-list
    desc: Install-script declaration with files allowlist
    crit: notable
    conf: 0.9
    all:
    - id: metadata/package/files/package-json::files-array-present
    any:
    - id: micro-behaviors/os/package-manager/hook-install::npm-install-runs-bundled-script
    - id: micro-behaviors/os/package-manager/hook-install::npm-preinstall-runs-bundled-script
    - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-bundled-script
    - id: micro-behaviors/os/package-manager/hook-install::npm-install-local-shell-script-command
    - id: micro-behaviors/os/package-manager/hook-install::npm-preinstall-runs-bundled-shell-script
    - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-bundled-shell-script
    - id: metadata/package/scripts/entrypoint::postinstall-runs-init-js

  - id: hook-with-background-process
    desc: Hook declaration beside background process
    crit: notable
    conf: 0.9
    for: [npm, tar, javascript, package.json, zip, powershell, batch]
    scope: archive
    all:
      - id: lifecycle-hook-runs-node-script
    any:
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option

  - id: hook-with-agent-config-path
    desc: Node hook declaration beside agent config path
    crit: notable
    conf: 0.9
    for: [npm, shell, javascript, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/fs/path/agent-config/
    unless:
      - id: metadata/package/description/ai-tooling::agent-tool-purpose-description-context
      - id: well-known/app/ai/coding-agent/nextspark/
      - id: well-known/tool/development/agent/rigxyz/
      - id: well-known/app/ai/coding-agent/novahiz/
      - id: well-known/tool/development/agent/sap-ai-dev-toolkit/

  # A dangling local hook can simply be a broken release. No payload bytes or
  # hostile effect are required here; consumers must supply that evidence.
  # file scope keeps the hook and files list in the same manifest.
  - id: install-hook-omits-companion-from-files-list
    desc: Hook loader lacks explicit files-list entry
    crit: notable
    conf: 0.97
    all:
      - id: local-install-script-hook-with-files-list
    unless:
      - id: metadata/package/files/package-json::files-list-allows-hook-javascript
      - id: metadata/package/files/package-json::files-list-hook-shell-script
      - id: metadata/file/format/conformance::npm-package-parse-error
