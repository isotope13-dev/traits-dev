defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
composite_rules:
  - id: preinstall-https-authorization-clues
    desc: Preinstall hook has HTTPS, remote host, and authorization clues
    crit: notable
    conf: 0.9
    scope: archive
    mbc: B0024
    all:
      - id: metadata/package/scripts/entrypoint::preinstall-node-index-hook
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
