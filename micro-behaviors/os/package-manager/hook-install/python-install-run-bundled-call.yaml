# An install or develop command whose run() method calls a name bound by a
# from-import, either deferred inside the hook body (often in a try block so
# a missing payload never fails the install) or at module top level. The
# call executes the imported function when setuptools dispatches the
# command. Bare-name calls only: method calls such as install.run(self) or
# time.sleep(2) do not match. Attribute calls (module.attr()) are a
# separate shape and do not match.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-install-run-bundled-call
    desc: Install run invokes imported bundled name
    crit: notable
    conf: 0.92
    attack: T1195.002
    if:
      type: tree-sitter
      language: python
      query: |
        (
         (class_definition
          name: (identifier) @hook
          superclasses: (argument_list (identifier) @base)
          body: (block
           (function_definition
            name: (identifier) @method
            parameters: (parameters (identifier) @self)
            body: (block
             (import_from_statement
              module_name: (dotted_name) @module
              name: (dotted_name (identifier) @imported))
             (expression_statement
              (call function: (identifier) @called))))))
         (#eq? @method "run")
         (#eq? @imported @called)
         (#any-of? @base "install" "develop")
        )
        (
         (class_definition
          name: (identifier) @hook
          superclasses: (argument_list (identifier) @base)
          body: (block
           (function_definition
            name: (identifier) @method
            parameters: (parameters (identifier) @self)
            body: (block
             (try_statement
              body: (block
               (import_from_statement
                module_name: (dotted_name) @module
                name: (dotted_name (identifier) @imported))
               (expression_statement
                (call function: (identifier) @called))))))))
         (#eq? @method "run")
         (#eq? @imported @called)
         (#any-of? @base "install" "develop")
        )
        (
         (module
          (import_from_statement
           module_name: (dotted_name) @module
           name: (dotted_name (identifier) @imported))
          (class_definition
           name: (identifier) @hook
           superclasses: (argument_list (identifier) @base)
           body: (block
            (function_definition
             name: (identifier) @method
             parameters: (parameters (identifier) @self)
             body: (block
              (expression_statement
               (call function: (identifier) @called)))))))
         (#eq? @method "run")
         (#eq? @imported @called)
         (#any-of? @base "install" "develop")
        )
        (
         (module
          (import_from_statement
           module_name: (dotted_name) @module
           name: (dotted_name (identifier) @imported))
          (class_definition
           name: (identifier) @hook
           superclasses: (argument_list (identifier) @base)
           body: (block
            (function_definition
             name: (identifier) @method
             parameters: (parameters (identifier) @self)
             body: (block
              (try_statement
               body: (block
                (expression_statement
                 (call function: (identifier) @called)))))))))
         (#eq? @method "run")
         (#eq? @imported @called)
         (#any-of? @base "install" "develop")
        )
