defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: runs-at-import-or-install
  desc: Python init, setup or install hook clues
  crit: component
  conf: 0.9
  size_min: 64
  any:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/os/package-manager/hook-install::package-install-hook-present
  - id: metadata/build/pip::root-setup-py
  unless:
  - id: metadata/package/files/system-package::app-bundled-example-source
