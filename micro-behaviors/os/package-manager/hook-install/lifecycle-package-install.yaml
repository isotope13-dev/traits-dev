# Lifecycle command text proves package installation capability, not a trust violation.
# Preserve the reviewed matchers and exclusions used by stronger attack composites.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: postinstall-nested-subdir-bare-install
  desc: Postinstall installs nested subdir dependencies
  crit: notable
  conf: 0.97
  if:
    type: value
    path: scripts.postinstall
    regex: (^|&&)\s*cd\s+(\./)?[^.\s&;]+\s*&&[^&;]*\bnpm\s+install(\s+--\S+)*\s*([&;]|$)
    not:
    - regex: \$\(|`
- id: postinstall-runs-npm-install
  desc: Postinstall declares npm install command
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.postinstall
    regex: (^|[\n;&|]\s*|\$\()\s*(sudo\s+)?npm\s+(install|i|add)(\s|$)
  unless:
  - id: metadata/package/runtime::vscode-extension
  - id: metadata/package/runtime::vscode-workspace-install-extension
  - id: metadata/package/scripts/lifecycle::postinstall-local-prefix-install
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-nested-subdir-bare-install
  - id: metadata/package/scripts/lifecycle::postinstall-host-runtime-bootstrap
- id: postinstall-runs-yarn-add
  desc: Postinstall declares yarn add command
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.postinstall
    regex: (^|[\n;&|]\s*|\$\()\s*(sudo\s+)?yarn\s+(add|global\s+add)(\s|$)
- id: postinstall-runs-pnpm-add
  desc: Postinstall declares pnpm add command
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.postinstall
    regex: (^|[\n;&|]\s*|\$\()\s*(sudo\s+)?pnpm\s+(add|install)(\s|$)
- id: preinstall-runs-npm-install
  desc: Preinstall declares npm install command
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.preinstall
    regex: (^|[\n;&|]\s*|\$\()\s*(sudo\s+)?npm\s+(install|i|add)(\s|$)
  unless:
  - id: metadata/package/testing/presence/harness::example-directory
  - id: metadata/package/scripts/lifecycle::preinstall-addon-builder-bootstrap
  - id: metadata/package/scripts/lifecycle::preinstall-local-subdirectory-install
  - type: value
    path: scripts.preinstall
    regex: npm_config_user_agent
- id: preinstall-runs-yarn-add
  desc: Preinstall declares yarn add command
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.preinstall
    regex: (^|[\n;&|]\s*|\$\()\s*(sudo\s+)?yarn\s+(add|global\s+add)(\s|$)
  unless:
  - id: metadata/package/testing/presence/harness::example-directory
  - type: value
    path: scripts.preinstall
    regex: npm_config_user_agent
- id: preinstall-runs-pnpm-add
  desc: Preinstall declares pnpm add command
  crit: notable
  conf: 0.95
  if:
    type: value
    path: scripts.preinstall
    regex: (^|[\n;&|]\s*|\$\()\s*(sudo\s+)?pnpm\s+(add|install)(\s|$)
  unless:
  - id: metadata/package/testing/presence/harness::example-directory
  - type: value
    path: scripts.preinstall
    regex: npm_config_user_agent
composite_rules:
- id: install-hook-runs-pkg-install
  desc: Lifecycle hook declares package installation command
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-runs-npm-install
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-runs-yarn-add
  - id: micro-behaviors/os/package-manager/hook-install::postinstall-runs-pnpm-add
  - id: micro-behaviors/os/package-manager/hook-install::preinstall-runs-npm-install
  - id: micro-behaviors/os/package-manager/hook-install::preinstall-runs-yarn-add
  - id: micro-behaviors/os/package-manager/hook-install::preinstall-runs-pnpm-add
