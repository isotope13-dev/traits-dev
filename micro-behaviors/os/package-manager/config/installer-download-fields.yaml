defaults:
  for: [plist]
  platforms: [macos]
traits:
- id: download-config-url
  desc: "Application package download URL field"
  crit: notable
  if:
    type: value
    path: "DownloadApplicationPackageURL"
    substr: 'http'
- id: download-config-spare
  desc: "Spare package download URL field"
  crit: notable
  conf: 1.0
  if:
    type: value
    path: "SpareDownloadPackageURL"
    substr: 'http'
