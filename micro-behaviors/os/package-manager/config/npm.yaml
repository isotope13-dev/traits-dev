defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: npm-config-set-command
    desc: npm configuration assignment command string
    if:
      type: literal
      kind: string
      regex: '^npm[ \t]+config[ \t]+set[ \t]'
  # This records the requested policy, not enforcement on every install path.
  # Lifecycle suppression does not prevent later imported code from running.
  - id: npm-ignore-scripts-object-option
    desc: Options request lifecycle script suppression
    if:
      type: tree-sitter
      query: |
        (pair
          key: [(property_identifier) (string)] @key
          value: [(true) (unary_expression)] @value
          (#match? @key "^[\"']?ignoreScripts[\"']?$")
          (#match? @value "^(true|!\\s*0)$"))
  - id: npm-config-get-registry-command
    desc: npm command queries the configured registry URL
    if:
      type: literal
      kind: string
      regex: '^npm[ \t]+config[ \t]+get[ \t]+registry$'
  - id: npm-ignore-scripts-option
    desc: npm lifecycle-script suppression option
    # An option literal is observable; enforcement on every install path is not.
    if:
      type: literal
      kind: string
      regex: '^--ignore-scripts(=true)?$'
  - id: npm-set-registry-auth-token
    desc: npm registry auth-token configuration command
    if:
      type: literal
      kind: string
      substr: 'npm config set //registry.npmjs.org/:_authToken'
  # The per-command registry override (`npm i -g pkg --registry=https://…`,
  # documented in agent-skill bootstrap guidance as well as CI scripts).
  # Mirrors are common and legitimate (npmmirror); attacker registries ride
  # the same flag, so the redirection itself stays a notable observation.
  - id: registry-override-flag-text
    desc: Package install registry override flag text
    conf: 0.9
    for: [javascript, typescript, shell, batch, powershell, markdown]
    if:
      type: text
      regex: '(?i)--registry=(https?:)?//'
  - id: npmrc-registry-authtoken-line
    desc: npmjs registry _authToken config line
    conf: 0.9
    if:
      type: text
      regex: '//(registry\.npmjs\.org|\$\{[a-zA-Z0-9_]+\})/:_authToken='
  # CI/setup helpers write this template so later npm installs pick up
  # NODE_AUTH_TOKEN from the environment — credential provisioning, not theft.
  # Tests often escape the `$` inside template literals (`\${...}`).
  - id: npmrc-authtoken-env-template
    desc: npmrc authToken references NODE_AUTH_TOKEN
    conf: 0.95
    if:
      type: text
      regex: ':_authToken=\\?\$\{NODE_AUTH_TOKEN\}'
  - id: npm-config-list-command
    desc: NPM configuration listing command
    crit: notable
    conf: 0.9
    for: [javascript, typescript, shell, batch]
    if:
      type: text
      substr: npm config list

  - id: npmrc-user-config-path
    desc: npm user configuration file path
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, ruby, powershell, batch, shell]
    if:
      type: literal
      kind: string
      substr: .npmrc
    unless:
      - id: objectives/supply-chain/install-hook/extconf::ruby-extconf-dev-home-artifacts-probe

  - id: npmrc-unix-global-config-path
    desc: Unix global npm configuration path
    crit: notable
    conf: 0.92
    for: [javascript, typescript, python, ruby, powershell, batch, shell]
    if:
      type: literal
      kind: string
      substr: /etc/npmrc

  - id: npmrc-windows-global-config-path
    desc: Windows global npm configuration path
    crit: notable
    conf: 0.92
    for: [javascript, typescript, python, ruby, powershell, batch]
    if:
      type: literal
      kind: string
      regex: '(?i)C:[/\\]ProgramData[/\\][^"''\\s]{0,80}npmrc'

  - id: npm-cooldown-key
    desc: npm minimum release age configuration key
    crit: notable
    conf: 0.94
    for: [javascript, typescript, python, ruby, powershell, batch, shell]
    if:
      type: literal
      kind: string
      exact: min-release-age

  - id: npm-token-local-ci-missing-check
    desc: Checks missing CI and npm tokens
    if:
      type: text
      substr: '!process.env.CIRCLECI && !process.env.NPM_TOKEN'

  - id: npm-token-numeric-fallback-assignment
    desc: Assigns numeric npm token fallback
    if:
      type: text
      regex: 'process\.env\.NPM_TOKEN\s*=\s*[01]\b'

  # The allowScripts map is npm's install-script consent gate: entries decide
  # which packages may run lifecycle scripts. Assigning the key (as opposed
  # to reading it) grants or replaces approvals, so the matcher requires the
  # member-expression assignment rather than a bare mention.
  - id: npm-allowscripts-policy-assignment
    desc: Sets npm allowScripts install approvals
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.allowScripts\s*=[^=]'
