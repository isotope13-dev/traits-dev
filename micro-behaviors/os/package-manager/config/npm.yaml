defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: npm-set-registry-auth-token
    desc: npm registry auth-token configuration command
    if:
      type: literal
      kind: string
      substr: 'npm config set //registry.npmjs.org/:_authToken'
  - id: npmrc-registry-authtoken-line
    desc: npmjs registry _authToken config line
    conf: 0.9
    if:
      type: literal
      kind: string
      substr: '//registry.npmjs.org/:_authToken='
  - id: npm-config-list-command
    desc: NPM configuration listing command
    crit: notable
    conf: 0.9
    for: [javascript, typescript, shell, batch]
    if:
      type: text
      substr: npm config list

  - id: npmrc-user-config-path
    desc: npm user configuration file path
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, ruby, powershell, batch, shell]
    if:
      type: literal
      kind: string
      substr: .npmrc

  - id: npmrc-unix-global-config-path
    desc: Unix global npm configuration path
    crit: notable
    conf: 0.92
    for: [javascript, typescript, python, ruby, powershell, batch, shell]
    if:
      type: literal
      kind: string
      substr: /etc/npmrc

  - id: npmrc-windows-global-config-path
    desc: Windows global npm configuration path
    crit: notable
    conf: 0.92
    for: [javascript, typescript, python, ruby, powershell, batch]
    if:
      type: literal
      kind: string
      regex: 'C:[/\\]ProgramData'

  - id: npm-cooldown-key
    desc: npm minimum release age configuration key
    crit: notable
    conf: 0.94
    for: [javascript, typescript, python, ruby, powershell, batch, shell]
    if:
      type: literal
      kind: string
      exact: min-release-age
