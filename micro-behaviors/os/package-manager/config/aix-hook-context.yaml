defaults:
  platforms: [unix]
  for: [rust]
composite_rules:
  - id: lpp-hidden-hook-context
    desc: lpp_source hook and package clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/package-manager::lpp-source-hidden-hook-path
    any:
      - id: micro-behaviors/fs/path/executable::swinstall-local-bin-path
      - id: metadata/lang/natural/process-status::installp-invoked-text
      - id: micro-behaviors/fs/path/package-manager::lpp-bundles-directory
    needs: 1
