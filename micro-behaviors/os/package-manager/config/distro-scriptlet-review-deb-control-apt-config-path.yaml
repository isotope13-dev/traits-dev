defaults:
  platforms: [linux]
  for: [deb, shell]
composite_rules:
  - id: deb-control-apt-config-path
    desc: Debian script references an APT config drop-in
    crit: notable
    conf: 0.99
    # Only on the maintainer script itself. The file default includes `deb`
    # and `archives`, so the rule also ran on the CONTAINER node, where every
    # member's traits are rolled up -- which is how kali-menu's `rm_conffile`
    # cleanup and an unrelated apt path combined into a hostile finding.
    for: [shell]
    all:
      - id: metadata/path/installation::debian-control-hook-path
      - id: micro-behaviors/fs/path/config/system::apt-conf-dropin-path
    unless:
      # `dpkg-maintscript-helper rm_conffile /etc/apt/apt.conf.d/...` is the
      # documented Debian idiom for REMOVING a conffile the package no longer
      # ships -- the opposite of planting a hook. Kali's own kali-menu package
      # calls it from all four maintainer scripts to drop 99kali-menu.
      - id: metadata/build/package/maintainer-scripts::dpkg-conffile-removal-helper

