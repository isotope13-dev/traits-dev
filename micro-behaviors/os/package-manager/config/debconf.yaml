defaults:
  crit: notable
  conf: 0.95
  for: [shell]
  platforms: [unix]

composite_rules:
  - id: debconf-module-import-beside-db-get-call
    desc: Shell calls db_get beside debconf module import
    all:
      - id: micro-behaviors/process/interpreter/eval/source::shell-sources-debconf-confmodule
      - id: debconf-db-get-call
  - id: debconf-module-import-beside-db-input-call
    desc: Shell calls db_input beside debconf module import
    all:
      - id: micro-behaviors/process/interpreter/eval/source::shell-sources-debconf-confmodule
      - id: debconf-db-input-call
  - id: debconf-module-import-beside-db-go-call
    desc: Shell calls db_go beside debconf module import
    all:
      - id: micro-behaviors/process/interpreter/eval/source::shell-sources-debconf-confmodule
      - id: debconf-db-go-call

traits:
  - id: debconf-db-get-call
    desc: Shell calls Debconf database get operation
    if:
      type: symbol
      kind: call
      regex: ^(db_get|"db_get"|'db_get')$
    unless:
      - type: symbol
        kind: function
        exact: db_get
      - id: "metadata/lang/source/shape::shell-parser-recovery-node"
  - id: debconf-db-input-call
    desc: Shell calls Debconf database input operation
    if:
      type: symbol
      kind: call
      regex: ^(db_input|"db_input"|'db_input')$
    unless:
      - type: symbol
        kind: function
        exact: db_input
      - id: "metadata/lang/source/shape::shell-parser-recovery-node"
  - id: debconf-db-go-call
    desc: Shell calls Debconf database go operation
    if:
      type: symbol
      kind: call
      regex: ^(db_go|"db_go"|'db_go')$
    unless:
      - type: symbol
        kind: function
        exact: db_go
      - id: "metadata/lang/source/shape::shell-parser-recovery-node"
