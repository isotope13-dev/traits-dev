defaults:
  platforms: [unix]
  for: [java, class, jar]
traits:
  - id: micro-behaviors/os/package-manager/config::java-apt-alias-hook
    desc: Package-manager apt alias to named function
    crit: notable
    conf: 0.94
    for: [java, class]
    if:
      type: text
      regex: 'alias apt=[^;\n]{0,80}_supply_hook'

  - id: micro-behaviors/os/package-manager/config::java-npm-alias-hook
    desc: Package-manager npm alias to named function
    crit: notable
    conf: 0.94
    for: [java, class]
    if:
      type: text
      regex: 'alias npm=[^;\n]{0,80}_supply_hook'

composite_rules:
  - id: micro-behaviors/os/package-manager/config::java-package-manager-hook-clues
    desc: Package-manager hook and path clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/function/name-form::java-supply-hook-function
    any:
      - id: micro-behaviors/os/package-manager/config::java-apt-alias-hook
      - id: micro-behaviors/os/package-manager/config::java-npm-alias-hook
      - id: micro-behaviors/fs/path/executable::java-localbin-apt-path
      - id: micro-behaviors/fs/path/config/shell::java-supply-hook-profile
