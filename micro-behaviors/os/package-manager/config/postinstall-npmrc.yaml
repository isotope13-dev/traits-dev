defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: postinstall-npmrc-before-command
    desc: Postinstall npmrc precedes command invocation
    crit: notable
    conf: 0.97
    if:
      type: value
      path: scripts.postinstall
      regex: '(?is)\.npmrc.{0,120}(npm.{0,8}publish|\$\(printf)'
