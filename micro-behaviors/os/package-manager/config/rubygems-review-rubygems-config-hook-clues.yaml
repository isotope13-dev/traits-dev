defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: rubygems-config-hook-clues
    desc: RubyGems hook, wrapper or cache text clues
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/config::ruby-gemrc-post-install-hook
    any:
      - id: micro-behaviors/os/package-manager/config::ruby-gem-wrapper-path-clues
      - id: metadata/lang/source/naming/variable::ruby-gem-cached-sources-reference
  # GuardDog: Any gem installation hook
