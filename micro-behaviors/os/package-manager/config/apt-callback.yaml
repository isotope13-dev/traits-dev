defaults:
  for: [shell]
  platforms: [linux]
composite_rules:
  - id: gated-apt-callback-registration
    desc: Marker-gated APT hook installs a network callback
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/config::apt-dpkg-invoke-hook
      - id: micro-behaviors/os/package-manager/config::deb-control-apt-config-path
      - id: micro-behaviors/communications/http/request/beacon::file-gated-http-helper-write
