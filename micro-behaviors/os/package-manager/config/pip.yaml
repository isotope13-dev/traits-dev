defaults:
  platforms: [unix, windows]
  for: [python, shell]
  crit: notable
  conf: 0.8

traits:
  - id: pip-config-directory-reference
    desc: Python pip configuration directory reference
    for: [python]
    if:
      type: string_literal
      exact: .pip
  - id: pip-config-file-reference
    desc: Python pip configuration file reference
    if:
      type: string_literal
      regex: '(?i)(^|[/\\])pip\.conf$'
