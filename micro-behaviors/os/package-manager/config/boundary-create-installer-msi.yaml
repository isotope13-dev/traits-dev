defaults:
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]
  attack: T1105,T1218.007

  crit: notable
  conf: 0.9
traits:
- id: msiexec-norestart-switch
  desc: msiexec uses the no-restart switch
  attack: T1218.007
  for: [powershell, batch, pe]
  if:
    type: text
    word: /norestart
- id: msiexec-quiet-switch
  desc: msiexec user-interface level option
  for: [scripts, lnk, pe, dll]
  if:
    type: text
    regex: '(?i)\bmsiexec(\.exe)?\b[^\r\n]{0,200}[/\-](Q[NBRF]?|quiet)\b'
