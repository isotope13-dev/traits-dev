defaults:
  platforms: [windows]
  crit: notable
  conf: 0.9
  for: [pe, dll, batch, powershell, vbs, javascript, python]
traits:
  - id: quiet-norestart-switch-combo
    desc: Unattended install switch paired with no-restart
    if:
      type: text
      regex: '(?i)(^|[\s"''])/(qn|S|verysilent|silent)\s+/norestart'
