---
defaults:
  platforms:
  - macos
composite_rules:
- id: macos-root-package-install-references
  for:
  - macho
  - swift
  - objectivec
  - applescript
  desc: macOS root package-install and temporary path references
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/os/package-manager/config::macos-pkg-root-command-reference
  - id: micro-behaviors/fs/path/archive::macos-package-temp-path-reference
  any:
  - id: micro-behaviors/os/package-manager/config::installer-target-root-flag
  - id: micro-behaviors/communications/url/resource-path/automation::macos-interface-api-url
  - id: well-known/app/infrastructure/ppdserver::ppdserver-failure-endpoint
  - id: micro-behaviors/fs/path/temporary-artifact::macos-package-archive-path
  - id: micro-behaviors/os/handler/open::usr-bin-open-command
