defaults:
  platforms: [unix, windows]
  for: [javascript, text, markdown]
composite_rules:
  - id: cli-registry-template-http-ip-clues
    desc: CLI package has registry template and HTTP IP clues
    crit: notable
    conf: 0.96
    for: [npm, package.json, javascript, text, markdown]
    scope: archive
    all:
      - id: metadata/package/entrypoint/command::bin-field-declared
      - id: micro-behaviors/communications/http/services/registry::http-ip-registry-reference
      - id: metadata/lang/source/syntax/assignment/value::registry-template-assignment
