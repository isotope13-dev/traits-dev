defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: node-npm-init-file-write
    desc: Node writes npm initialization file
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(writeFile|appendFile|createWriteStream)\s*\([^)]{0,160}\.npm-init\.js'
    unless:
      - id: well-known/lib/runtime/scripted/node-runtime::bundled-npm-source
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
      - id: well-known/tool/development/cli/socket-cli::socket-dev-cli-bundle

composite_rules:
  - id: node-npm-init-fake-registry-clues
    desc: npm init file write and fake-registry label
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/literal/string/label::node-fake-registry-label
      - id: micro-behaviors/os/package-manager/config::node-npm-init-file-write
