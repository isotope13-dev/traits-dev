traits:
- id: pip-config-echo-write-command-string
  desc: String contains echo writing pip.conf
  crit: notable
  conf: 0.95
  platforms:
  - unix
  for:
  - scripts
  - source
  - -shell
  - -batch
  if:
    type: literal
    kind: string
    regex: (^|[;&|]\s*)echo\s+["'][^"']{0,160}["']\s*>\s*\S{1,100}/pip\.conf\b
    exclude_docstrings: true
