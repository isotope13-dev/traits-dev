# A real msiexec command property, rather than a comment or a bare name.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  crit: notable
traits:
  - id: msiexec-system-component-property
    desc: msiexec app-entry hiding property
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*(start[^\r\n]{0,40})?msiexec(\.exe)?\s+[^;\n]{0,200}ARPSYSTEMCOMPONENT\s*=\s*1\b'
