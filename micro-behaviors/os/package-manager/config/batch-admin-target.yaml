defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.98
traits:
  - id: batch-msiexec-user-target
    desc: MSI target is a user-writable directory
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bmsiexec\b.{0,240}\bTARGETDIR\s*=\s*"?%(LOCALAPPDATA|APPDATA|TEMP|TMP)%'
