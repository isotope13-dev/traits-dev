defaults:
  platforms: [netbsd, unix]
  for: [javascript, typescript]
traits:
  - id: micro-behaviors/os/package-manager/config::node-npm-script-shell-hook
    desc: npm script-shell configuration command
    crit: notable
    conf: 0.94
    if:
      type: text
      # A concrete shell path or variable, not help text telling the user to
      # run it with a "<full path to pwsh.exe>" placeholder.
      regex: 'npm config set script-shell\s+["''`]?(/|[A-Za-z]:\\|\$\{?\w)'

composite_rules:
  - id: micro-behaviors/os/package-manager/config::node-npm-shell-hook-clues
    desc: npm shell configuration and hook name
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/config::node-npm-script-shell-hook
      - id: micro-behaviors/fs/path/script::node-npm-postinstall-hook-file

