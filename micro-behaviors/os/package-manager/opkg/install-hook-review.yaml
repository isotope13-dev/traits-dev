defaults:
  platforms: [openwrt]
  for: [php, shell, javascript, typescript]
traits:
  - id: micro-behaviors/os/package-manager/opkg::openwrt-opkg-force-overwrite
    desc: OpenWrt opkg forced package overwrite
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: opkg install --force-overwrite
    not:
      - regex: 'opkg\s+install\s+--force-overwrite\s+(gzip|coreutils-sort)\b'

  - id: micro-behaviors/os/package-manager/opkg::openwrt-opkg-list-installed
    desc: OpenWrt opkg installed package enumeration
    crit: notable
    conf: 0.82
    if:
      type: text
      substr: opkg list-installed

composite_rules:
  - id: openwrt-opkg-hook-binpath-clues
    desc: opkg post-install path and BINPATH redirect
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/package-manager::openwrt-opkg-post-install-dir
      - id: micro-behaviors/fs/write/file/redirect::shell-cat-to-binpath-variable

  - id: openwrt-opkg-preinstall-shell-clues
    desc: opkg pre-install path and shell launch
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/package-manager::openwrt-opkg-pre-install-dir
      - id: micro-behaviors/process/create/shell/command-mode::openwrt-preinstall-temp-shell

  - id: openwrt-opkg-enumerate-force-overwrite
    desc: opkg lists packages and forces overwrite
    crit: suspicious
    conf: 0.9
    near_lines: 20
    all:
      - id: micro-behaviors/os/package-manager/opkg::openwrt-opkg-list-installed
      - id: micro-behaviors/os/package-manager/opkg::openwrt-opkg-force-overwrite
