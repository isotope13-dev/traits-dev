# Same-command parent-directory package installation; scoped to a lifecycle value.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: preinstall-parent-npm-dependency-command
  desc: Preinstall adds dependency above package
  crit: notable
  conf: 0.96
  if:
    type: value
    path: scripts.preinstall
    regex: ^ *(cd|pushd) +["']?(\.\.[/\\]){2,}(\.\.)?["']? *&& *npm +(i|install|add) +[@\w]
    not:
    - regex: --(prefix|cwd|dir)\b
- id: preinstall-parent-pnpm-dependency-command
