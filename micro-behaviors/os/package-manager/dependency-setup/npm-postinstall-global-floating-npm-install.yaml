defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-global-floating-npm-install
  desc: Postinstall globally installs latest npm package
  crit: notable
  conf: 0.98
  if:
    type: value
    path: "scripts.postinstall"
    regex: '\bnpm\s+install\s+-(g|global)\s+[^;&]{1,120}@latest\b'
