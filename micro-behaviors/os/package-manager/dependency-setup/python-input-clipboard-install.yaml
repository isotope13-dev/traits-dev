defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: input-clipboard-libraries-install
  desc: Input, screen and clipboard library installs
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/package-manager/dependency-setup::input-screen-library-install
  - id: micro-behaviors/os/package-manager/dependency-setup::clipboard-keyboard-library-install
- id: input-screen-library-install
  desc: Python executes a pip install for a screen or input library
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/package-manager/dependency-setup::surveillance-dependency-name-1
  any:
  - id: micro-behaviors/process/create/subprocess/launch::python-subprocess-string-command
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
  - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
  near_lines: 4
- id: clipboard-keyboard-library-install
  desc: Python executes a pip install for a clipboard or keyboard library
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/package-manager/dependency-setup::surveillance-dependency-name-2
  any:
  - id: micro-behaviors/process/create/subprocess/launch::python-subprocess-string-command
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system-string-command
  - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
  near_lines: 4
