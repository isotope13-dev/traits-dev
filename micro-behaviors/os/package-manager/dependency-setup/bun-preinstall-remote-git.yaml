defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]
composite_rules:
  - id: micro-behaviors/os/package-manager/dependency-setup::preinstall-bun-add-remote-git-trusted
    desc: Preinstall, Bun Git and trusted dependency clues
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: micro-behaviors/os/package-manager/runtime-install::exec-bun-add-remote-git
      - id: micro-behaviors/os/package-manager/config::bun-trusted-dependencies-config

  - id: micro-behaviors/os/package-manager/dependency-setup::preinstall-bun-remote-git-temp-staging
    desc: Preinstall and Bun remote Git staging clues
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: micro-behaviors/os/package-manager/runtime-install::exec-bun-add-remote-git
      - id: micro-behaviors/fs/path/package-manager::package-json-path-join
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call

  - id: micro-behaviors/os/package-manager/dependency-setup::preinstall-bun-probe-remote-git-install
    desc: Preinstall, Bun probe and Git install clues
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: micro-behaviors/os/package-manager/runtime-install::exec-bun-add-remote-git
      - id: micro-behaviors/fs/search/content::posix-interpreter-lookup
