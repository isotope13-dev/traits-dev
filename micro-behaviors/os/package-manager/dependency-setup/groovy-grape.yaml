# A Grape resolver declaration configures the repository used for Groovy
# dependency resolution. The repository setting alone does not establish
# parse-time code execution or malicious intent.
defaults:
  platforms: [unix, windows]
  for: [groovy]

traits:
  - id: groovy-grab-resolver-root
    desc: Groovy Grape resolver sets repository root
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '@GrabResolver\s*\(\s*[^)]{0,60}root\s*='
