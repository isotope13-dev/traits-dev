defaults:
  platforms: [unix, windows]
  for: [json, javascript, typescript]
composite_rules:
  - id: node-postinstall-injection-name-clues
    desc: Postinstall and injection function-name clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/scripts/reference::node-postinstall-buffer-from-text
    any:
      - id: metadata/lang/source/naming/function/name-form::node-drop-trojan-name-text
      - id: metadata/lang/source/naming/function/name-form::node-inject-dependency-name-text
