# This is the installer-side URL-to-argv edge, not a claim that the caller is
# remote or that approval/integrity checks are absent. Local CLIs may expose it.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-wheel-url-install-arguments
    desc: URL parameter feeds wheel install argv
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((function_definition
          parameters: (parameters (identifier) @url)
          body: (block
            (expression_statement (assignment
              left: (identifier) @path
              right: (call function: (attribute
                object: (attribute
                  object: (call function: (_) @parse
                    arguments: (argument_list (identifier) @parsed))
                  attribute: (identifier) @path_field)
                attribute: (identifier) @lower))))
            (if_statement
              condition: (call function: (attribute
                object: (identifier) @tested
                attribute: (identifier) @suffix)
                arguments: (argument_list (string) @wheel))
              consequence: (block
                (expression_statement (call
                  arguments: (argument_list
                    (list (string) @verb (identifier) @installed))))))))
         (#eq? @url @parsed) (#eq? @url @installed)
         (#eq? @path @tested) (#eq? @path_field "path")
         (#eq? @lower "lower") (#eq? @suffix "endswith")
         (#match? @parse "(^|[.])url(parse|split)$")
         (#match? @wheel "^['\"][.]whl['\"]$")
         (#match? @verb "^['\"]install['\"]$"))
