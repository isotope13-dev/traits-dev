defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-maintainer-script-toolchain-install
    # `cargo install` runs the crate's build.rs and `go install ...@latest`
    # pulls and compiles a module -- remote code execution as root, chosen by
    # whatever the named target resolves to today.
    desc: Debian maintainer script installs via cargo/go toolchain
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
      - id: micro-behaviors/os/package-manager/install::native-toolchain-install-command

