defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-maintainer-script-foreign-package-bootstrap
    # The .deb equivalent of the AUR bun/npm bootstrap: a root install hook
    # installs a named foreign-ecosystem package whose hooks may run as root.
    # Remote shell pipelines have a separate interpreter-stdin detection.
    desc: Debian maintainer script bootstraps a foreign-ecosystem package
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
    any:
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-maintainer-script-npm-install
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-maintainer-script-pip-install
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-maintainer-script-gem-install
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-maintainer-script-js-runtime-install
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-maintainer-script-runtime-fetch-install
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-maintainer-script-toolchain-install
    unless:
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-pip-venv-requirements-bootstrap
      - id: well-known/app/security/opensnitch::opensnitch-package-context

