defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-maintainer-script-js-runtime-install
    # bun/pnpm/yarn fetch npm packages whose own lifecycle scripts then run as
    # root, exactly like `npm install` does.
    desc: Debian maintainer script adds a package via bun/pnpm/yarn
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
      - id: micro-behaviors/os/package-manager/install::js-runtime-named-package-install-command

