defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-pip-requirements-install
    desc: Maintainer script pip-installs a requirements file
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
    any:
      - id: micro-behaviors/os/package-manager/install::pip-requirements-file-install-command
      - id: micro-behaviors/os/package-manager/install::pip3-requirements-file-install-command

