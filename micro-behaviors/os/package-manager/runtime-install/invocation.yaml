defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: js-npm-install-invocation
  desc: JavaScript runs npm install for a package
  crit: notable
  conf: 0.85
  for:
  - javascript
  - typescript
  near_bytes: 512
  all:
  - id: micro-behaviors/os/package-manager/reference-install::npm-install-command-text
  any:
  - id: micro-behaviors/process/create/cmdlet::start-process-call
  - id: micro-behaviors/process/create/cmdlet::start-process-filepath-text
  - id: micro-behaviors/process/create/cmdlet::start-process-symbol-call
  - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
  - id: micro-behaviors/process/create/hidden::wsh-hidden-async-run
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
  - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-child-process-js
  - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-exec-js
  - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: metadata/file/profile/script/evaluation::urlencoded-groovy-processbuilder
  - id: micro-behaviors/process/create/exec/
  - id: metadata/lang/source/naming/function/runtime::node-exec-file-async-call
  - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
  - id: metadata/file/profile/process/creation-api::node-spawn-explorer-text
  - id: metadata/file/profile/process/creation-api::android-linker-direct-exec
  - id: micro-behaviors/os/package-manager/run::node-npm-spawn-target
  - id: metadata/file/profile/process/creation-api::whisper-cli-spawn
  - id: micro-behaviors/process/interpreter/node::spawn-node-process
  - id: micro-behaviors/process/interpreter/scripting::node-spawn-osascript
  - id: micro-behaviors/process/interpreter/lua::javascript-interpreter-name
  - id: micro-behaviors/os/package-manager/run::node-npx-target
  - id: micro-behaviors/process/interpreter/python::node-spawn-python-interpreter
  # Review this selection if the variable-target category grows.
  - id: micro-behaviors/process/create/variable/
  - id: micro-behaviors/process/create/path-execution::node-launch-exe-literal
  - id: micro-behaviors/process/create/shell/interpreter::node-powershell-launch
  - id: metadata/file/profile/script/evaluation::javascript-generated-source-process
  - id: micro-behaviors/process/create/wmi::js-wmi-process-create
  - id: micro-behaviors/process/create/subprocess/capture/
  - id: micro-behaviors/process/create/subprocess/configure::nstask-launch-path
  - id: micro-behaviors/process/create/subprocess/configure::rust-command-curl-wget
  - id: micro-behaviors/process/config/target::rust-command-path-variable
  - id: micro-behaviors/process/create/subprocess/launch/
  - id: micro-behaviors/process/create/shell/variable-command::ruby-io-popen-interpolated
  - id: micro-behaviors/process/create/shell/variable-command::ruby-open3-interpolated-command
  - id: micro-behaviors/revision-control/git/read::git-diff-argv-call
  - id: micro-behaviors/process/replace/
  unless:
  - id: well-known/app/development/calvyn-code
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/package/testing/presence/harness::regression-directory-path
  - id: micro-behaviors/os/package-manager/reference-install::platform-install-command-map-context
  downgrade:
    all:
    - id: micro-behaviors/communications/websocket/library::feishu-lark-event-websocket-client
    - id: micro-behaviors/data/llm/session::codex-cli-or-agent-session
