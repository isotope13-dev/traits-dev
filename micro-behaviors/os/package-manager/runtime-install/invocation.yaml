defaults:
  platforms: [unix, windows]
composite_rules:
- id: js-npm-install-invocation
  desc: JavaScript runs npm install for a package
  crit: notable
  conf: 0.85
  for: [javascript, typescript]
  # The command string alone is documentation far more often than execution;
  # pairing it with a child-process API is what makes it an invocation.
  # Keep both observations in one call-sized region so CLI help that recommends
  # `npm install` cannot combine with an unrelated version-check subprocess.
  near_bytes: 512
  all:
    - id: micro-behaviors/os/package-manager/reference-install::npm-install-command-text
  any:
    - id: micro-behaviors/process/create/exec/
    - id: micro-behaviors/process/create/hidden::wsh-run-hidden-async-statement
    - id: micro-behaviors/process/create/shell/bridge::execSync-call
    - id: micro-behaviors/process/create/spawn/
    - id: micro-behaviors/process/create/subprocess/
  unless:
    - id: well-known/app/development/calvyn-code
    - id: metadata/build/minifier::js-large-minified-bundle
    - id: metadata/package/testing/presence/harness::test-directory-path
    - id: metadata/package/testing/presence/harness::regression-directory-path
    - id: micro-behaviors/os/package-manager/reference-install::platform-install-command-map-context
  # A chat-controlled Codex host may provision its declared agent runtime into
  # an isolated prefix on first use. Keep the child-process/network behavior
  # visible as notable, while the broader remote-agent capability remains the
  # suspicious finding security engineers should triage.
  downgrade:
    all:
      - id: micro-behaviors/communications/websocket/library::feishu-lark-event-websocket-client
      - id: micro-behaviors/process/create/agent::codex-cli-or-agent-session
