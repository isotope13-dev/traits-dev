defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: js-npm-install-invocation
  desc: JavaScript runs npm install for a package
  crit: notable
  conf: 0.85
  for:
  - javascript
  - typescript
  near_bytes: 512
  all:
  - id: micro-behaviors/os/package-manager/reference-install::npm-install-command-text
  any:
  - id: micro-behaviors/process/create/exec
  - id: micro-behaviors/process/create/start-process::start-process-call
  - id: micro-behaviors/process/create/start-process::start-process-filepath-text
  - id: micro-behaviors/process/create/start-process::start-process-symbol-call
  - id: micro-behaviors/process/create/subprocess/launch
  - id: micro-behaviors/process/replace
  - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
  - id: micro-behaviors/process/create/hidden::wsh-hidden-async-run
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
  - id: micro-behaviors/process/create/shell/encoded::encodedcommand-child-process-js
  - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: micro-behaviors/process/create/subprocess/capture
  - id: micro-behaviors/process/create/subprocess/configure::nstask-launch-path
  - id: micro-behaviors/process/create/subprocess/configure::rust-command-curl-wget
  - id: micro-behaviors/process/create/subprocess/configure::rust-command-path-variable
  - id: metadata/file/profile/script-evaluation::urlencoded-groovy-processbuilder
  unless:
  - id: well-known/app/development/calvyn-code
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/package/testing/presence/harness::regression-directory-path
  - id: micro-behaviors/os/package-manager/reference-install::platform-install-command-map-context
  downgrade:
    all:
    - id: micro-behaviors/communications/websocket/library::feishu-lark-event-websocket-client
    - id: micro-behaviors/data/llm/session::codex-cli-or-agent-session
