defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell]

traits:
  - id: computed-spawn-global-package-install-clues
    desc: Computed spawn and global package argument clues
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: "child_process_\\d+\\s*\\[\\s*['\"]spawn['\"]\\s*\\][\\s\\S]{0,320}['\"]-g['\"]\\s*,\\s*PACKAGE_NAME"
