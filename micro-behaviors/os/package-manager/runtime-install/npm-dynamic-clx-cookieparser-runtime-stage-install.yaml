defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: clx-cookieparser-runtime-stage-install
    desc: Runtime npm and companion install command clues
    crit: suspicious
    conf: 0.995
    all:
      - id: micro-behaviors/os/package-manager/runtime-install::runtime-npm-install-comp
      - id: micro-behaviors/os/package-manager/reference-install::runtime-clx-cookie-signature-install
    any:
      - id: metadata/lang/source/syntax/command/options::npm-no-save-option
      - id: metadata/lang/source/syntax/command/options::npm-silent-loglevel-option
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
