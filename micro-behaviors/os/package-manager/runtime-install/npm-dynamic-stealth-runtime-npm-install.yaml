defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: stealth-runtime-npm-install
    desc: Runtime npm install with quiet options
    crit: notable
    conf: 0.97
    near_lines: 40
    all:
      - id: micro-behaviors/os/package-manager/runtime-install::runtime-npm-install-comp
    any:
      - id: micro-behaviors/os/package-manager/runtime-install::npm-no-save-option
      - id: micro-behaviors/os/package-manager/runtime-install::npm-silent-loglevel-option
      - id: micro-behaviors/os/package-manager/runtime-install::npm-no-progress-option
    needs: 2
    unless:
      - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
      - id: well-known/app/ai/coding-agent/agenthippo/
