defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  # Bind npm Arborist's add and saveType options to the same reify call.
  # Arbitrary .reify() methods or nearby install words do not suffice.
  # This does not claim a specific receiver identity or successful install.
  - id: npm-reify-add-save-call
    desc: Calls reify with package add/save options
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (member_expression
            property: (property_identifier) @method)
          arguments: (arguments [
            (object
              (pair key: [(property_identifier) (string)] @add)
              (pair key: [(property_identifier) (string)] @save
                value: (string) @mode))
            (object
              (pair key: [(property_identifier) (string)] @save
                value: (string) @mode)
              (pair key: [(property_identifier) (string)] @add))])
          (#eq? @method "reify")
          (#match? @add "^[\"']?add[\"']?$")
          (#match? @save "^[\"']?saveType[\"']?$")
          (#match? @mode "^[\"'](prod|dev|optional|peer)[\"']$"))
