defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: secondary-tgz-npm-bootstrap
    desc: Runtime npm install and tar extraction
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/runtime-install::runtime-npm-install-process-call
      - id: micro-behaviors/data/archive/extract/tar::node-tar-gzip-strip-array
    any:
      - id: micro-behaviors/data/archive/extract/tar::gzip-extract-strip-one-component
      - id: micro-behaviors/fs/write/file/unspecified::node-downloaded-tgz-write
      - id: metadata/lang/source/syntax/command/options::npm-no-audit-no-fund-command
      - id: metadata/lang/source/syntax/command/options::npm-omit-dev-option
    needs: 2
    unless:
      - id: micro-behaviors/os/package-manager/runtime-install::npm-install-build-combo
