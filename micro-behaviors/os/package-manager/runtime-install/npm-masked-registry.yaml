defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, npm]
  conf: 0.99

composite_rules:
  - id: npm-hook-installs-from-xor-masked-registry
    desc: npm hook registry install and XOR decoding clues
    crit: suspicious
    conf: 0.96
    attack: T1027
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: metadata/lang/source/syntax/command/options::npm-install-separate-registry-flag
