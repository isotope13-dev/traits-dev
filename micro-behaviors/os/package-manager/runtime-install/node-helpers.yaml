defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-runtime-package-name-symbol
    desc: Runtime package name constant
    conf: 0.84
    if:
      type: symbol
      exact: RUNTIME_PACKAGE_NAME
  - id: node-runtime-manifest-url-symbol
    desc: Runtime manifest URL constant
    conf: 0.84
    if:
      type: symbol
      exact: RUNTIME_MANIFEST_URL
  - id: node-download-tarball-symbol
    desc: Runtime tarball download helper name
    conf: 0.84
    if:
      type: symbol
      exact: downloadTarball
  - id: node-install-downloaded-runtime-symbol
    desc: Runtime install helper name
    conf: 0.84
    if:
      type: symbol
      exact: installDownloadedRuntime
  - id: node-validate-runtime-stage-symbol
    desc: Runtime stage validation helper name
    conf: 0.88
    if:
      type: symbol
      exact: validateRuntimeStage
  - id: node-promote-runtime-stage-symbol
    desc: Runtime promotion helper name
    conf: 0.84
    if:
      type: symbol
      exact: promoteRuntimeStage

composite_rules:
  - id: node-runtime-install-helper-names
    desc: Node runtime install and validation helper-name cluster
    conf: 0.9
    near_bytes: 32768
    all:
      - id: node-runtime-package-name-symbol
      - id: node-runtime-manifest-url-symbol
      - id: node-download-tarball-symbol
      - id: node-install-downloaded-runtime-symbol
      - id: node-validate-runtime-stage-symbol
      - id: node-promote-runtime-stage-symbol
