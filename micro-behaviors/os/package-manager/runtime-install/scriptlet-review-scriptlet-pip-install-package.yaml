defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: scriptlet-pip-install-package
    desc: Scriptlet installs a pip package
    crit: notable
    conf: 0.8
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-scriptlet-hook
    any:
      - id: micro-behaviors/os/package-manager/install::pip-named-package-install-command
      - id: micro-behaviors/os/package-manager/install::pip3-named-package-install-command
