---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
traits:
- id: npm-install-package-command
  desc: Source invokes npm install package
  for:
  - shell
  - makefile
  if:
    type: text
    regex: (?m)(^|[;&|'"`])[ \t]*npm[ \t]+install[ \t]+[A-Za-z0-9@][A-Za-z0-9._/-]{1,79}
  not:
  - regex: "\\bnpm[ \\t]+install[ \\t]+(failed|failing|fails|succeeded|completed|finished|command|first|again|before|after|instead|works|worked|will|would|should|could|may|might|error|errors|output|here|now|step|script|process)\\b"
  unless:
  - id: well-known/app/development/calvyn-code
  - id: metadata/build/minifier::js-large-minified-bundle
- id: yarn-dlx-package-command
  desc: Source yarn dlx transient package
  for:
  - shell
  - javascript
  - typescript
  - makefile
  if:
    type: text
    regex: "\\byarn\\s+dlx\\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}"
  unless:
  - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
  - id: well-known/lib/ai/
