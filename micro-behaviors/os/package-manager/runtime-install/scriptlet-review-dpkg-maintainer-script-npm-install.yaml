defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-maintainer-script-npm-install
    desc: Debian maintainer script installs a named npm package
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
      - id: micro-behaviors/os/package-manager/reference-install::npm-named-install-shell-boundary-text

