defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
traits:
- id: npm-force-install
  desc: Executes npm install with force option
  crit: notable
  conf: 0.85
  if:
    type: tree-sitter
    language: javascript
    kind: call
    regex: (?i)(exec|spawn)(File)?(Sync)?\([^)]{0,180}npm.{0,8}install[^)]{0,80}--force
composite_rules:
# `npm-registry-url-option` was a strict subset of
# micro-behaviors/os/package-manager/config::registry-override-flag-text (same
# flag text without the case fold or protocol-relative form), so the atom was
# retired and this composite now references the canonical matcher.
- id: npm-forced-registry-install-with-api-key
  desc: Forced npm install beside API-key reference
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-force-install
  - id: micro-behaviors/os/package-manager/config::registry-override-flag-text
  - id: micro-behaviors/os/env/ai-provider::openai-api-key-name-reference
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/presence/fixture::test-underscore-js-filename
