defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: detached-ignored-npm-install-call
    desc: Spawns detached npm install with ignored output
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [(identifier) @callee
            (member_expression property: (property_identifier) @callee)]
          arguments: (arguments . [(string) (identifier)] @program .
            (array . (string) @verb) . (object) @options))
          (#eq? @callee "spawn")
          (#match? @program "^(['\"]npm['\"]|npm)$")
          (#match? @verb "^['\"](install|i|ci)['\"]$")
          (#match? @options "(?s)\\bdetached[ \\t\\r\\n]*:[ \\t\\r\\n]*true\\b")
          (#match? @options "(?s)\\bstdio[ \\t\\r\\n]*:[ \\t\\r\\n]*['\"]ignore['\"]"))
