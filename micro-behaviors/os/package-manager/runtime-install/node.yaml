traits:
- id: npm-install-build-combo
  desc: Npm install and build command sequence
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: npm\s+install[\s\S]{0,800}(npm\s+run\s+build|npx\s+tree-sitter\s+build\s+--wasm)
- id: exec-npm-install
  desc: Exec or spawn contains npm install command
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (execSync|exec|spawn)\s*\([^)]{0,60}npm\s+install[^'")]{0,40}(\$|--)
  not:
  - substr: // 'npm install --
  downgrade:
    any:
    - id: npm-install-build-combo
- id: exec-npm-install-package
  desc: Literal npm package-install command
  crit: notable
  conf: 0.92
  if:
    type: string_literal
    regex: ^npm\s+install\s+(@?[a-z0-9._-]+/)?[a-z0-9._-]+$
  unless:
  - id: "metadata/file/naming::readme-requirements-install-basename"
- id: exec-npm-install-array
  desc: execFileSync invokes npm install
  crit: notable
  conf: 0.94
  # Text over call-graph: the same literal call shape must still match when
  # flow analysis is limited (flow-call-unavailable), where kind:call
  # matchers go blind. The argv-array shape keeps comment-only mentions out.
  if:
    type: text
    regex: 'execFileSync\s*\(\s*["'']npm["'']\s*,\s*\[\s*["''](install|i|ci)["'']'
  unless:
  - id: well-known/tool/development/vscode-extension/zephyr-ide::zephyr-ide-extension
  - id: metadata/package/files/dependency::node-modules-path
- id: exec-npm-install-global-array
  desc: execFileSync installs npm package globally
  crit: notable
  conf: 0.93
  # Shell-free global install via argv: execFileSync("npm", ["install",
  # "-g", pkg]). Split command/argv shape that inline-array matchers miss;
  # the install verb plus -g/--global inside one argv array keeps
  # non-install global queries (npm root -g) out.
  if:
    type: text
    regex: 'execFileSync\(\s*["'']npm["''],\s*\[["''](install|i)["''][^\]\n]{0,40}["'']-g["'']'
  unless:
  - id: well-known/tool/development/vscode-extension/zephyr-ide::zephyr-ide-extension
  - id: metadata/package/files/dependency::node-modules-path
- id: bun-git-package-install-command
  desc: Spawns Bun add command
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'spawn\s*\(\s*bun\s*,\s*\[\s*["'']add["'']'
- id: exec-bun-add-remote-git
  desc: Executes Bun add of remote git URL
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'exec(Sync|FileSync)?\s*\([^)]{0,200}\badd\b[^)]{0,200}(\.git\b|https?://|github:)'
- id: spawn-npm-install-command
  desc: Spawns npm install command
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'spawn\s*\(\s*(npm|["'']npm["''])\s*,\s*\[\s*["''](install|i|ci)["'']'
composite_rules:
- id: runtime-npm-install-comp
  desc: Node process API beside npm install command
  crit: notable
  conf: 0.93
  all:
  - id: metadata/import/builtin::child-process-api-destructure
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install
  - id: micro-behaviors/process/create/shell/build::js-npm-install-alias-via-child-process
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-package
  - id: micro-behaviors/process/create/shell/build::npm-install-save-command
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/app/ai/assistant/apliarte-ai::apliarte-ai-local-setup-context
  - id: micro-behaviors/process/create/shell/build::npm-install-production-command-literal
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
