traits:
- id: npm-install-build-combo
  desc: Npm install and build command sequence
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: npm\s+install[\s\S]{0,800}(npm\s+run\s+build|npx\s+tree-sitter\s+build\s+--wasm)
- id: exec-npm-install
  desc: Exec or spawn contains npm install command
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (execSync|exec|spawn)\s*\([^)]{0,60}npm\s+install[^'")]{0,40}(\$|--)
  not:
  - substr: // 'npm install --
  downgrade:
    any:
    - id: npm-install-build-combo
- id: exec-npm-install-package
  desc: Literal npm package-install command
  crit: notable
  conf: 0.92
  if:
    type: string_literal
    regex: ^npm\s+install\s+(@?[a-z0-9._-]+/)?[a-z0-9._-]+$
  unless:
  - id: metadata/package/documentation/page::install-doc-basename
- id: exec-npm-install-array
  desc: ExecFileSync invokes npm command
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: execFileSync('npm'
  unless:
  - id: well-known/tool/development/vscode-extension/zephyr-ide::zephyr-ide-extension
  - id: metadata/package/files/dependency::node-modules-path
composite_rules:
- id: runtime-npm-install-comp
  desc: Node process API beside npm install command
  crit: notable
  conf: 0.93
  all:
  - id: metadata/import/builtin::child-process-api-destructure
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install
  - id: micro-behaviors/process/create/shell/build::js-npm-install-alias-via-child-process
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-package
  - id: micro-behaviors/process/create/shell/build::npm-install-save-command
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/app/ai/assistant/apliarte-ai::apliarte-ai-local-setup-context
  - id: micro-behaviors/process/create/shell/build::npm-install-production-command-literal
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
