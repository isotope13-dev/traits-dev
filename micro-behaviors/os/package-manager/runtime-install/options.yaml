defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: npm-no-save-option
  desc: npm no-save option reference
  crit: notable
  conf: 0.94
  if:
    type: literal
    substr: --no-save
- id: npm-silent-loglevel-option
  desc: npm silent loglevel option reference
  crit: notable
  conf: 0.92
  if:
    type: literal
    substr: --loglevel silent
- id: npm-no-progress-option
  desc: npm no-progress option reference
  crit: notable
  conf: 0.9
  if:
    type: literal
    substr: --no-progress
- id: npm-no-audit-no-fund-command
  desc: npm install disables audit and funding output
  crit: notable
  conf: 0.9
  if:
    type: literal
    regex: npm\s+install[\s\S]{0,120}--no-audit[\s\S]{0,80}--no-fund
- id: npm-omit-dev-option
  desc: npm omit-dev option reference
  crit: notable
  conf: 0.88
  if:
    type: literal
    substr: --omit=dev
