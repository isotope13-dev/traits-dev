defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: runtime-npm-install-process-call
  desc: Runtime npm install through child process
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/process/create/system::js-execfile-call
  any:
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-array
  - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-package
  unless:
  - id: well-known/tool/development/vscode-extension/zephyr-ide::zephyr-ide-extension
  - id: metadata/package/files/dependency::node-modules-path
