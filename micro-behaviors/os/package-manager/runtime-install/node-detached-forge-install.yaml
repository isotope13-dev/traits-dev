defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-detached-forge-install-clues
    desc: Detached package install and forge URL clues
    crit: notable
    conf: 0.98
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/fs/path/package-manager::package-json-path-join
      - id: micro-behaviors/communications/http/url/forge::public-code-forge-url
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
    any:
      - id: micro-behaviors/os/package-manager/runtime-install::bun-git-package-install-command
      - id: micro-behaviors/os/package-manager/runtime-install::spawn-npm-install-command
