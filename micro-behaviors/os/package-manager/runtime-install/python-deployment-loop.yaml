# Bind a list-provided URL to a wheel installer defined in the same module,
# and bind the list's component ID to a subsequent daemon/worker/service start.
# The capability is suspicious, not proof of malicious intent or absent consent.
# No vendor/domain, collector filename, or deployment-helper name is required.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-url-deployment-installs-and-starts-code
    desc: Deployment loop installs URLs and starts code
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @installer
            parameters: (parameters . (identifier) . (identifier) @url)
            body: (block
              (expression_statement (assignment
                left: (identifier) @path
                right: (call function: (attribute
                  object: (attribute
                    object: (call function: (_) @parse
                      arguments: (argument_list (identifier) @parsed))
                    attribute: (identifier) @path_field)
                  attribute: (identifier) @lower))))
              (if_statement
                condition: (call function: (attribute
                  object: (identifier) @tested
                  attribute: (identifier) @suffix)
                  arguments: (argument_list (string) @wheel))
                consequence: (block (expression_statement (call
                  arguments: (argument_list
                    (list (string) @verb (identifier) @installed))))))))
          (function_definition body: (block
            (for_statement
              left: [
                (pattern_list . (identifier) @component (identifier)
                  (_)* (identifier) @record_url (_)* )
                (tuple_pattern . (identifier) @component (identifier)
                  (_)* (identifier) @record_url (_)* )
              ]
              right: (call)
              body: (block (try_statement body: (block
                (if_statement consequence: (block
                  (with_statement body: (block
                    (expression_statement (call
                      function: (identifier) @install_call
                      arguments: (argument_list
                        . (_) . (identifier) @forwarded)))))
                  (try_statement body: (block
                    (if_statement consequence: (block
                      (if_statement consequence: (block
                        (expression_statement (call
                          function: (attribute attribute: (identifier) @start)
                          arguments: (argument_list . (identifier) @started))))))))))))))))))
         (#eq? @url @installed) (#eq? @installer @install_call)
         (#eq? @url @parsed) (#eq? @path @tested)
         (#eq? @path_field "path") (#eq? @lower "lower")
         (#match? @parse "(^|[.])url(parse|split)$")
         (#eq? @record_url @forwarded) (#eq? @component @started)
         (#eq? @suffix "endswith")
         (#match? @wheel "^['\"][.]whl['\"]$")
         (#match? @verb "^['\"]install['\"]$")
         (#match? @start "(?i)^start_?(daemon|worker|service)$"))
