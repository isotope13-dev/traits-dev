defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # The call projection omits the target of transpiled (0, alias.method)(...)
  # calls. A call-node matcher preserves those and excludes comments/strings.
  # This reports the helper call, not a successful install or hostile loader.
  - id: ensure-package-helper-call
    desc: Calls ensurePackage dependency bootstrap helper
    if:
      type: tree-sitter
      kind: call
      regex: '^(\(0,\s*)?[$\w.]*\bensurePackage\)?\s*\('
