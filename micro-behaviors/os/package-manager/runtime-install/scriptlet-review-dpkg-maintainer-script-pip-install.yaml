defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-maintainer-script-pip-install
    desc: Debian maintainer script installs a pip package
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
    any:
      - id: micro-behaviors/os/package-manager/install::pip-named-package-install-command
      - id: micro-behaviors/os/package-manager/install::pip3-named-package-install-command

