defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-maintainer-script-runtime-fetch-install
    desc: Debian maintainer script installs via deno/pipx/uv
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
      - id: micro-behaviors/os/package-manager/install::runtime-package-install-command-text

