defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: npm-postinstall-spawns-alternate-registry-install
    desc: Postinstall and alternate registry install clues
    crit: suspicious
    conf: 0.98
    scope: archive
    for: [npm, package.json, javascript, typescript]
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: metadata/lang/source/syntax/command/options::npm-install-separate-registry-flag
    any:
      - id: metadata/lang/source/syntax/command/options::npm-no-save-option
      - id: micro-behaviors/data/decode/xor/repeating-key::js-buffer-repeating-key-xor-decode
