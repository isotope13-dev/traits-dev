defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-maintainer-script-gem-install
    desc: Debian maintainer script installs a RubyGems package
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
      - id: micro-behaviors/os/package-manager/install::gem-named-package-install-command

