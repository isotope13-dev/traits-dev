traits:
- id: source-npx-versioned-package
  desc: Source references versioned npx command
  crit: notable
  for:
  - shell
  - javascript
  - typescript
  - makefile
  if:
    type: text
    regex: (?m)(^|[;&|'"])[ \t]*npx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}@[0-9]
  platforms:
  - unix
  - windows
