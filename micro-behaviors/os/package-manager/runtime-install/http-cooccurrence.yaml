defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.85

composite_rules:
  # No response/command join or executable-path equality is required. These
  # are capabilities of ordinary updaters, not proof of a staged attack.
  - id: forced-npm-install-with-http-client
    desc: Forced npm install and HTTP client co-occur
    all:
      - id: npm-force-install
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/get::node-http-get-reference
      - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: forced-mirror-install-with-http-and-spawn
    desc: Forced mirror install beside HTTP and process creation
    all:
      - id: npm-force-install
      - id: micro-behaviors/os/package-manager/config::registry-override-flag-text
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
