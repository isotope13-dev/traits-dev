defaults:
  platforms: [unix, windows]
composite_rules:
- id: npm-install-quiet-options
  desc: npm installation with quiet or no-save options
  crit: notable
  conf: 0.96
  for: [javascript, typescript]
  near_bytes: 512
  all:
    - id: micro-behaviors/os/package-manager/runtime-install::js-npm-install-invocation
  any:
    - id: metadata/lang/source/syntax/command/options::npm-no-save-option
    - id: metadata/lang/source/syntax/command/options::npm-silent-loglevel-option
    - id: metadata/lang/source/syntax/command/options::npm-no-progress-option
    - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
  needs: 2
  unless:
    - id: well-known/app/development/calvyn-code
    - id: metadata/build/minifier::js-large-minified-bundle
    - id: metadata/package/testing/presence/harness::regression-directory-path
