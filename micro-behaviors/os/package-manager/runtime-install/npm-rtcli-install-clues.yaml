defaults:
  platforms: [unix, windows]

composite_rules:
  - id: npm-rtcli-install-launch-clues
    desc: npm global install and rtcli launch clues
    crit: suspicious
    conf: 0.985
    for: [javascript, typescript, npm, tar]
    scope: archive
    attack: "T1059.007,T1105"
    all:
      - id: micro-behaviors/os/package-manager/runtime-install::npm-global-install-array
      - id: metadata/lang/source/syntax/argument::setup-api-download-key-options
      - id: micro-behaviors/process/daemonize/background::rtcli-background-or-start-process
      - id: metadata/lang/source/syntax/assignment/member::exported-child-process-exec
