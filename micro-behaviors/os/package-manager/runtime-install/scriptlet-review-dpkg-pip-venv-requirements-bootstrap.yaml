defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-pip-venv-requirements-bootstrap
    # Vendor .deb postinst that installs from a bundled requirements.txt into a
    # private venv (Intel SGX PCCS/PCS tools, etc.). The dependency list ships
    # in the archive; --require-virtualenv keeps the install off system Python.
    desc: Maintainer script bootstraps a venv from requirements
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-pip-requirements-install
      - id: micro-behaviors/os/package-manager/runtime-install::dpkg-pip-require-virtualenv

