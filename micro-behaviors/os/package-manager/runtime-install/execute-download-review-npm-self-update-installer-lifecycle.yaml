---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - shell
composite_rules:
- id: forced-npm-tarball-ip-registry-clues
  for:
  - javascript
  desc: Forced npm install, registry override, tarball URL and IP clues
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/package-manager/runtime-install::npm-force-install
  - id: micro-behaviors/os/package-manager/config::registry-override-flag-text
  - id: micro-behaviors/communications/url/resource-path/file::remote-tgz-url
  - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
- id: computed-global-package-detached-fetch-clues
  for:
  - javascript
  desc: Computed global package spawn, detached flag and fetch clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/package-manager/runtime-install::computed-spawn-global-package-install-clues
  - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
