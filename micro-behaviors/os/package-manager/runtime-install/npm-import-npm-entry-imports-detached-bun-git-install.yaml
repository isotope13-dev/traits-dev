defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, zip, tar]
composite_rules:
- id: npm-entry-imports-detached-bun-git-install
  desc: Entry, detached spawn and Bun Git install clues
  conf: 0.97
  scope: package
  for:
  - npm
  - package.json
  - javascript
  - tar
  - tgz
  all:
  - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/os/package-manager/runtime-install::bun-git-package-install-command
