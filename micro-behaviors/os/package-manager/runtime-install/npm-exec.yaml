# Package-runner command text does not establish unwanted execution. For
# example, a CI job may explicitly fetch commitlint to validate PR commits.
# Preserve the former autoinstall atom's matcher and scope, including -p.
defaults:
  platforms: [unix, windows]
  for: [shell, makefile]
  crit: notable
  conf: 0.9

traits:
- id: npm-exec-package-command-text
  desc: npm exec command declares transient package
  if:
    type: text
    regex: '(?m)(^|[;&|''"])[ \t]*npm\s+exec\s+(--package|-p)\s+@?[A-Za-z0-9._/-]{2,80}'
