defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: dpkg-pip-require-virtualenv
    desc: Maintainer script pip requires a virtualenv
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
    any:
      - id: micro-behaviors/os/package-manager/install::pip-require-virtualenv-flag
      - id: micro-behaviors/os/package-manager/install::pip3-require-virtualenv-flag

