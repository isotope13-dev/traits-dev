defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm, zip, tar]
composite_rules:
- id: npm-package-detached-npm-install
  desc: npm package has a detached silent npm install
  conf: 0.97
  scope: package
  for:
  - npm
  - package.json
  - javascript
  - tar
  - tgz
  all:
  - id: metadata/package/entrypoint/module::npm-publish-root-manifest-with-root-javascript-entry
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/os/package-manager/runtime-install::detached-ignored-npm-install-call
