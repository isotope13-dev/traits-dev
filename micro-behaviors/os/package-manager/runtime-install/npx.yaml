# npx package-runner command text. The versioned pin (`npx pkg@1.2.3`) is the
# sibling observation in versioned.yaml; this file holds the run command
# generally. npx fetches the package into the cache and executes it without an
# install record, so the command text is the package-runner capability --
# neither an install nor an execution by itself.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.85
  for: [shell, javascript, typescript, markdown]
traits:
- id: npx-package-command-text
  desc: npx package run command text
  # Command-position anchoring keeps prose like "run npx to install" silent;
  # a quote or backtick before `npx` counts as command position so fenced
  # agent-skill guidance and inline code mentions surface.
  if:
    type: text
    regex: '(?m)(^|[;&|`"''])[ \t]*npx[ \t]+(-[\w-]+[ \t]+){0,4}@?[A-Za-z0-9][\w./-]{1,60}'
