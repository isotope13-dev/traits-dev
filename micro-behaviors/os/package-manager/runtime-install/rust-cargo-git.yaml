defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  attack: T1105

traits:
  - id: cargo-install-git-command
    desc: Runs Cargo install from a Git repository
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"cargo"\s*\)[\s\S]{0,160}"install"[\s\S]{0,40}"--git"'
      exclude_comments: true
