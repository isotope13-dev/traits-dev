defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
composite_rules:
  - id: remote-gzip-package-stage
    desc: One script fetches, gunzips, writes, and installs an npm package
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/request/get::node-http-client-get
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/data/decompress/gzip::gunzip-call-text
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/os/package-manager/runtime-install::exec-npm-install-array

