defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: scriptlet-runtime-fetch-install
    # deno/pipx/uv fetch and run arbitrary remote code at install time the same
    # way npm/bun do. Anchored to shell command position like the other legs.
    desc: Scriptlet installs via deno/pipx/uv
    crit: notable
    conf: 0.8
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-scriptlet-hook
      - id: micro-behaviors/os/package-manager/install::runtime-package-install-command-text

