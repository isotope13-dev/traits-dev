defaults:
  platforms: [windows, unix]
composite_rules:
- id: bun-setup-zero-exits
  desc: Bun setup clues and repeated zero exits
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/script::bun-environment-javascript-name
  - id: micro-behaviors/process/exit/terminate::process-exit-zero-repeat
  any:
  - id: micro-behaviors/os/package-manager/install::bun-piped-installer-command
  - id: micro-behaviors/os/package-manager/install::bun-powershell-installer-command
  - id: micro-behaviors/os/env/read/named::shell-profile-path-refresh-text
  - id: micro-behaviors/os/env/write::bun-path-setup-reference
  unless:
  - id: well-known/app/development/cloudflare/
- id: bun-path-setup-zero-exits
  desc: Bun path setup and repeated zero exits
  crit: suspicious
  conf: 0.95
  scope: leaf
  all:
  - id: micro-behaviors/fs/path/script::bun-environment-javascript-name
  - id: micro-behaviors/process/exit/terminate::process-exit-zero-repeat
  any:
  - id: micro-behaviors/os/env/write::bun-path-setup-reference
  - id: micro-behaviors/os/env/read/named::shell-profile-path-refresh-text
  unless:
  - id: well-known/app/development/cloudflare/
- id: bun-hidden-temp-archive-provisioner
  desc: Bun release and hidden archive setup clues
  crit: suspicious
  conf: 0.96
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/fs/search/command::bun-which-where-probe
  - id: micro-behaviors/communications/url/reference::runtime-release-archive-reference
  - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
  - id: micro-behaviors/data/archive/extract/zip::js-unzip-extraction-command
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-string-755
