# Android app signing-certificate types returned in PackageInfo. Apps
# reference them for self-integrity and licence checks; signature spoofers
# reference them to fabricate the values those checks read.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.9
traits:
  - id: dex-android-signature-type
    desc: DEX references Android signing-certificate types
    if:
      type: text
      regex: '^Landroid/content/pm/(Signature|SigningInfo);$'
