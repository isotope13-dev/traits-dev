defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-skip-publisher-check
    desc: Bypasses PowerShell module publisher validation
    conf: 0.96
    if:
      type: text
      substr: -SkipPublisherCheck
  - id: powershell-authenticode-signature-api
    desc: Checks an Authenticode signature
    if:
      type: text
      substr: Get-AuthenticodeSignature
  - id: powershell-reject-invalid-python-signature
    desc: Rejects invalid Python installer signatures
    if:
      type: text
      regex: 'Status\s*-ne\s*["'']Valid["''][\s\S]{0,120}Python Software Foundation[\s\S]{0,120}throw'

composite_rules:
  - id: signed-python-installer-guard
    desc: Validates Python installer signature
    crit: exception
    near_lines: 4
    all:
      - id: powershell-authenticode-signature-api
      - id: powershell-reject-invalid-python-signature

