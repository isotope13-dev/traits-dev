# Android package removal through `pm uninstall` or `pm clear`. Device-manager
# desktop apps send these over ADB, as well as Android scripts. Each atom is a
# capability notable on its own; removal of a security or account app belongs
# in objectives/, not here.
defaults:
  platforms: [android, unix, windows]
  for: [source, scripts]
  crit: notable
  conf: 0.92

traits:
  - id: android-pm-uninstall-command
    desc: Android pm uninstall shell command
    if:
      type: text
      regex: '(?i)\bpm\s+uninstall\b'
      exclude_comments: true

  - id: android-pm-uninstall-argv
    desc: Android pm uninstall argument pair
    if:
      type: text
      regex: '(?i)["'']pm["'']\s*(,|<<)\s*["'']uninstall["'']'

  - id: android-pm-clear-command
    desc: Android pm clear shell command
    if:
      type: text
      regex: '(?i)\bpm\s+clear\b'
      exclude_comments: true

  - id: android-pm-clear-argv
    desc: Android pm clear argument pair
    if:
      type: text
      regex: '(?i)["'']pm["'']\s*(,|<<)\s*["'']clear["'']'
