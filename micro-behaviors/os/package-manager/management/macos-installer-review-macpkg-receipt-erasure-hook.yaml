defaults:
  platforms: [macos]
  for: [pkg]
composite_rules:
- id: macpkg-receipt-erasure-hook
  desc: Installer hook forgets package receipts
  crit: suspicious
  conf: 0.98
  scope: archive
  for: [pkg, shell]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/os/package-manager/management::macos-pkg-forget-receipts
  unless:
    # A remover/uninstaller script forgetting receipts is cleaning up its
    # own installation, not covering tracks.
    - id: micro-behaviors/os/package-manager/management::macos-remover-script-path

