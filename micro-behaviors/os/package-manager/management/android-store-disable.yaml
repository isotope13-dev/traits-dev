# Android package-state and installer-attribution APIs. These are ordinary
# capabilities; the consuming objective supplies scanner-suppression context.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.93
  attack: T1631

traits:
  - id: android-store-app-disable-call
    desc: Disables or restores an Android app package
    conf: 0.93
    if:
      type: text
      regex: '\.\s*setApplicationEnabledSetting\s*\('

  - id: android-set-installer-package-call
    desc: Sets Android installer package attribution
    for: [java]
    if:
      type: symbol
      kind: call
      exact: setInstallerPackageName

  - id: android-play-installer-attribution-call
    desc: Declares Google Play as the session installer
    for: [java]
    if:
      type: symbol
      kind: call
      exact: setInstallerPackageName
      arg:
        index: 0
        kind: string
        exact: com.android.vending

  - id: kotlin-play-installer-attribution-call
    desc: Kotlin sets Google Play as session installer
    for: [kotlin]
    if:
      # Kotlin call facts omit arguments; retain an exact call-and-literal
      # source matcher so other installer package values do not match.
      type: text
      regex: '\.\s*setInstallerPackageName\s*\(\s*"com\.android\.vending"\s*\)'
