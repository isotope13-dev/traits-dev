# Store-suppression and installer-forgery primitives used by privileged
# Android droppers. Disabling the Play Store package around a programmatic
# install keeps Play Protect verification from inspecting the staged payload;
# rewriting the installer identity afterwards makes the sideload look
# store-installed. Either call is a legitimate PackageManager surface on its
# own, so both stay notable here; the attack claim lives in the objective
# composites that bind them to a driven install session.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.93
  attack: T1631

traits:
  - id: android-store-app-disable-call
    desc: Disables or restores an Android app package
    conf: 0.93
    if:
      type: text
      regex: '\.\s*setApplicationEnabledSetting\s*\('

  - id: android-installer-identity-spoof-call
    desc: Sets a forged Android installer identity
    conf: 0.95
    if:
      type: text
      regex: '\b(setInstallerPackageName|setInstallSourceInfo)\s*\('
