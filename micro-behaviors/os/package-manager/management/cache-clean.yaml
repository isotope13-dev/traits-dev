defaults:
  crit: notable
  platforms: [unix]
  for: [shell]
traits:
  # System-maintenance scripts clean package-manager caches beside log
  # rotation. Cache cleaning (apt-get clean, dnf clean all, autoremove)
  # frees disk; it never hides activity, so beside log truncation it marks
  # maintenance, not indicator removal.
  - id: package-manager-cache-clean-command
    desc: Cleans package-manager caches
    conf: 0.9
    if:
      type: text
      regex: '(apt-get|nala|dnf|zypper|apk|eopkg)[\s\S]{0,120}?\bclean\b|\bautoremove\b'
