defaults:
  platforms:
  - android
  - unix
  for:
  - java
  - kotlin
  - go
  - rust
  - c
  - cpp
  - python
  - javascript
  - typescript
  conf: 0.98
composite_rules:
- id: android-launched-play-store-disable
  desc: Play Store disable command with process launch
  crit: notable
  all:
  - id: micro-behaviors/os/package-manager/management::android-play-store-disable-literal
  any:
  - id: micro-behaviors/process/create
  - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: metadata/lang/source/syntax/command/launch::rundll32-command-syntax-reference
  - id: micro-behaviors/process/replace/
