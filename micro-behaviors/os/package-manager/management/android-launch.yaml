# A package disable command plus a launch is capability evidence.
# It does not prove that an APK evades verification.
defaults:
  platforms: [android, unix]
  for: [java, kotlin, go, rust, c, cpp, python, javascript, typescript]
  conf: 0.98

composite_rules:
  - id: android-launched-play-store-disable
    desc: Play Store disable command with process launch
    crit: notable
    all:
      - id: micro-behaviors/os/package-manager/management::android-play-store-disable-literal
      - id: micro-behaviors/process/create

