defaults:
  platforms: [windows]
  for: [batch, powershell]
composite_rules:
  - id: quiet-msiexec-hidden-registration
    desc: Quiet MSI with app-entry hiding property
    crit: notable
    conf: 0.98
    near_lines: 1
    all:
      - id: msiexec-package-verb
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
      - id: micro-behaviors/os/package-manager/config::msiexec-system-component-property
