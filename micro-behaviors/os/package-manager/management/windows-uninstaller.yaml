# Windows uninstaller completion banners. An uninstaller that announces
# completion removes its own install directory including itself, so the
# self-deletion and hidden cleanup window nearby finish a declared removal
# rather than a concealed payload execution. Used as a suppressor leg for
# the self-delete composites, not a detection.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [powershell, batch]
traits:
  - id: windows-uninstaller-completion-banner
    desc: Uninstaller announces completion
    if:
      type: text
      regex: '(?i)\b(uninstall(ation)?|removal) (complete[ds]?|finished|successful)\b'
