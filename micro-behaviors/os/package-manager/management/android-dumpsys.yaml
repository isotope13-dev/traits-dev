defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: android-dumpsys-package-command
    desc: Passes Android package query command to call
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '.'
      arg:
        kind: string
        regex: '^dumpsys[ \t]+package[ \t]+[^ \t]'
