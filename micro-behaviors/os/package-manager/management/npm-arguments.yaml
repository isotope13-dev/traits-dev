defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-npm-invoke-with-args-array
    desc: Passes args array to npm process call
    conf: 0.95
    if:
      type: text
      regex: '\b(execFile|spawn)(Sync)?\s*\(\s*(\bNPM_BIN\b|["'']npm(\.cmd)?["''])\s*,\s*args\b'

