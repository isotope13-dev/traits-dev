defaults:
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]
  attack: T1105,T1218.007

  crit: notable
traits:
- id: msiexec-package-verb
  desc: Windows Installer operation command text
  conf: 0.92
  for: [scripts, html, pe, dll]
  if:
    type: text
    regex: '(?i)\bmsiexec(\.exe)?\b[^\r\n]{0,64}[-/](i|a|x|package)\b'
- id: python-msiexec-process-call
  desc: Python process call invokes Windows Installer
  conf: 0.96
  for: [python]
  if:
      # Parsing the call avoids treating comments and documentation as an
      # invocation. Package verbs and install options remain separate atoms.
    type: tree-sitter
    kind: call
    regex: '(?is)\b(subprocess\.\w+|os\.system)\s*\([^)]{0,240}\bmsiexec\b'
composite_rules:
- id: msiexec-quiet-package-operation-allusers
  desc: Quiet msiexec package operation with ALLUSERS
  crit: notable
  conf: 0.9
  for: [batch, powershell]
  all:
  - id: msiexec-package-verb
  - id: micro-behaviors/os/package-manager/config::installer-silent-switch
  - id: micro-behaviors/os/package-manager/config::msiexec-allusers-property
  unless:
  - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
  - id: well-known/tool/sysadmin/clusterfuzz::gce-windows-provisioner
