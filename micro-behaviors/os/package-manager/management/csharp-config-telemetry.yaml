defaults:
  for: [csharp]
  platforms: [windows]

traits:
  - id: csharp-applyset-telemetry-disabled
    desc: Disables telemetry and calls ApplySet
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ((method_declaration body: (block
          (expression_statement (assignment_expression
            left: (member_access_expression expression: (identifier) @processor name: (identifier) @telemetry)
            right: (boolean_literal) @disabled))
          (local_declaration_statement (variable_declaration (variable_declarator
            (invocation_expression function: (member_access_expression
              expression: (identifier) @applier name: (identifier) @apply)))))))
        (#eq? @processor @applier)
        (#eq? @telemetry "GenerateTelemetryEvents")
        (#eq? @disabled "false")
        (#eq? @apply "ApplySet")
        )
