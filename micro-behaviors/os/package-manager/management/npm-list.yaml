# Dependency-tree enumeration can explain network/install diagnostics.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: node-npm-dependency-tree-command
  desc: Node shell command lists npm dependencies
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    regex: '(^|\.)(exec|execSync)$'
    arg:
      index: 0
      regex: '(^|&&|;|\|\|)[ \t]*npm[ \t]+(ls|list)([ \t]|$)'
