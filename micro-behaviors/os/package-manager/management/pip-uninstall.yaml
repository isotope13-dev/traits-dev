defaults:
  platforms: [windows, unix]
  for: [python, shell]

traits:
  - id: pip-uninstall-command-text
    desc: References a pip uninstall command
    crit: notable
    conf: 0.9
    if:
      type: text
      # Versioned launchers and leading global options (`pip3 --verbose
      # uninstall`, `pip -q uninstall`) still name the uninstall subcommand.
      regex: '\bpip[0-9.]{0,5}(\s+--?[a-z-]{1,20}){0,3}\s+uninstall\b'

  # A parsed execution call whose command text includes a pip uninstall
  # subcommand. Because it reads the call's argument provenance, a commented
  # command or a string never handed to an executor does not match.
  - id: python-exec-pip-uninstall-call
    desc: Python process call runs pip uninstall
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.(call|run|Popen|check_\w{4,6}|get\w{6,12}))$'
      arg:
        index: 0
        from:
          value: '\bpip[0-9.]{0,5}\b.{0,40}\buninstall\b|^uninstall$'

  # Same call shape when the whole command is one string or f-string literal,
  # which the provenance form above leaves to the direct argument value.
  - id: python-exec-pip-uninstall-literal
    desc: Python process call passes pip uninstall literal
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.(call|run|Popen|check_\w{4,6}|get\w{6,12}))$'
      arg:
        index: 0
        regex: '\bpip[0-9.]{0,5}\b.{0,40}\buninstall\b'
    unless:
      - id: python-exec-pip-uninstall-call
