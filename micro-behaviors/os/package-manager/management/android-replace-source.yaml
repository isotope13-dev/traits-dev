# Android app-replacement primitives: reading another package's signing
# certificates and firing the system uninstaller for it. Each is a neutral
# capability on its own (app managers, MDM agents and self-update checks
# all query package info); the hostile replacement reading comes from
# composites that pair the uninstall with a driven reinstall.
defaults:
  crit: notable
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: android-package-info-query
    desc: Android source queries installed package info
    conf: 0.9
    if:
      type: text
      regex: '\bgetPackageInfo\s*\('

  - id: android-signing-cert-flag
    desc: Requests package signing certificates
    conf: 0.93
    if:
      type: text
      regex: '\bGET_SIGNING_CERTIFICATES\b|\bGET_SIGNATURES\b'

  - id: android-uninstall-package-intent
    desc: Android source fires the package uninstaller
    conf: 0.93
    if:
      type: text
      word: ACTION_UNINSTALL_PACKAGE
