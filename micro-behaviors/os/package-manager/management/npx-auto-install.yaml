---
defaults:
  platforms:
  - unix
  - windows
  for:
  - dockerfile
  - github-actions
  crit: notable
  conf: 0.9
traits:
- id: build-npx-yes-package
  desc: Build invokes npx with automatic confirmation
  if:
    type: text
    regex: "\\bnpx\\s+(-y|--yes)\\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}"
