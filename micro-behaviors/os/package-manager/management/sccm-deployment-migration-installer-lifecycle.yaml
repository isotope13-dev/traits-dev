---
defaults:
  platforms:
  - windows
  - unix
  for:
  - source
  - scripts
  - binaries
  - "-swift"
  - "-objectivec"
  - "-groovy"
  - "-scala"
  - "-elixir"
traits:
- id: sccm-application-assignment-class
  desc: References SCCM application assignment class
  crit: notable
  conf: 0.98
  if:
    type: text
    word: SMS_ApplicationAssignment
- id: sccm-app-management-digest
  desc: SCCM application management digest tag
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: "<AppMgmtDigest"
- id: sccm-install-command-field
  desc: References SCCM install command field
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: "<InstallCommandLine>"
- id: sccm-enforcement-deadline-field
  desc: References SCCM enforcement deadline field
  crit: notable
  conf: 0.96
  if:
    type: text
    word: EnforcementDeadline
