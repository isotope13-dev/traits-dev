defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
  crit: notable
  conf: 0.99
traits:
- id: jvm-package-disable-launch-pattern
  desc: ProcessBuilder package-disable launch text
  if:
    type: text
    regex: ProcessBuilder\s*\([^;]{0,256}\bdisable(-user)?\b[^;]{0,256}\.\s*start\s*\(
- id: android-play-store-disable-literal
  for: [java, kotlin, go, rust, c, cpp, python, javascript, typescript]
  platforms: [android, unix]
  desc: Play Store disable command literal
  if:
    type: literal
    kind: string
    regex: '^(pm|cmd\s+package)\s+disable(-user)?\s+(--user\s+\S+\s+)?com\.android\.vending\s*$'
- id: jvm-package-enable-launch-pattern
  desc: ProcessBuilder package-enable launch text
  if:
    type: text
    regex: ProcessBuilder\s*\([^;]{0,256}\benable\b[^;]{0,256}\.\s*start\s*\(
- id: android-play-store-enable-literal
  desc: Play Store enable command literal
  if:
    type: literal
    kind: string
    regex: '^(pm|cmd\s+package)\s+enable\s+(--user\s+\S+\s+)?com\.android\.vending\s*$'
- id: java-play-store-disable-command-argument
  desc: Passes Play Store disable command to sh
  for: [java]
  if:
    type: symbol
    kind: call
    exact: ProcessBuilder
    args:
    - index: 0
      kind: string
      regex: '^(/bin/)?sh$'
    - index: 1
      kind: string
      exact: '-c'
    - index: 2
      kind: string
      regex: '^(pm|cmd\s+package)\s+disable(-user)?\s+(--user\s+\S+\s+)?com\.android\.vending\s*$'
- id: java-play-store-enable-command-argument
  desc: Passes Play Store enable command to sh
  for: [java]
  if:
    type: symbol
    kind: call
    exact: ProcessBuilder
    args:
    - index: 0
      kind: string
      regex: '^(/bin/)?sh$'
    - index: 1
      kind: string
      exact: '-c'
    - index: 2
      kind: string
      regex: '^(pm|cmd\s+package)\s+enable\s+(--user\s+\S+\s+)?com\.android\.vending\s*$'
- id: kotlin-play-store-disable-command-argument
  desc: Kotlin sh arguments disabling Play Store
  for: [kotlin]
  if:
    # Kotlin facts omit arguments and the engine has no Kotlin AST matcher.
    # Preserve a bounded source fallback; the composite also requires the
    # parsed command literal and ProcessBuilder constructor as corroboration.
    type: text
    regex: '\bsh",\s*"-c",\s*"(pm|cmd package) disable(-user)? (--user \S+ )?com\.android\.vending"'
- id: kotlin-play-store-enable-command-argument
  desc: Kotlin sh arguments enabling Play Store
  for: [kotlin]
  if:
    type: text
    regex: '\bsh",\s*"-c",\s*"(pm|cmd package) enable (--user \S+ )?com\.android\.vending"'
- id: java-play-store-disable-argv
  desc: ProcessBuilder arguments disable Play Store
  for: [java]
  if:
    type: symbol
    kind: call
    exact: ProcessBuilder
    args:
    - index: 0
      kind: string
      regex: '^(/system/bin/)?pm$'
    - index: 1
      kind: string
      regex: '^disable(-user)?$'
    - index: 2
      kind: string
      exact: com.android.vending
- id: kotlin-play-store-disable-argv-text
  desc: Kotlin pm arguments disable Play Store
  for: [kotlin]
  if:
    # Kotlin currently omits constructor arguments from call facts. The
    # consuming rule binds this text to the parsed constructor at the same
    # byte offset; a commented constructor cannot borrow a nearby real call.
    type: text
    regex: 'ProcessBuilder\s*\(\s*"pm",\s*"disable(-user)?",\s*"com\.android\.vending"'
- id: java-play-store-enable-argv
  desc: ProcessBuilder arguments enable Play Store
  for: [java]
  if:
    type: symbol
    kind: call
    exact: ProcessBuilder
    args:
    - index: 0
      kind: string
      regex: '^(/system/bin/)?pm$'
    - index: 1
      kind: string
      exact: enable
    - index: 2
      kind: string
      exact: com.android.vending
- id: kotlin-play-store-enable-argv-text
  desc: Kotlin pm arguments enable Play Store
  for: [kotlin]
  if:
    # Kotlin currently omits constructor arguments from call facts. The
    # consuming rule binds this text to the parsed constructor at the same
    # byte offset; a commented constructor cannot borrow a nearby real call.
    type: text
    regex: 'ProcessBuilder\s*\(\s*"pm",\s*"enable",\s*"com\.android\.vending"'
- id: java-play-store-disable-cmd-argv
  desc: Cmd package arguments disable Play Store
  for: [java]
  if:
    type: symbol
    kind: call
    exact: ProcessBuilder
    args:
    - index: 0
      kind: string
      regex: '^(/system/bin/)?cmd$'
    - index: 1
      kind: string
      exact: package
    - index: 2
      kind: string
      regex: '^disable(-user)?$'
    - index: 3
      kind: string
      exact: com.android.vending
- id: kotlin-play-store-disable-cmd-argv-text
  desc: Kotlin cmd package arguments disable Play Store
  for: [kotlin]
  if:
    type: text
    regex: 'ProcessBuilder\("cmd", *"package", *"disable(-user)?", *"com\.android\.vending"'
- id: java-play-store-enable-cmd-argv
  desc: Cmd package arguments enable Play Store
  for: [java]
  if:
    type: symbol
    kind: call
    exact: ProcessBuilder
    args:
    - index: 0
      kind: string
      regex: '^(/system/bin/)?cmd$'
    - index: 1
      kind: string
      exact: package
    - index: 2
      kind: string
      exact: enable
    - index: 3
      kind: string
      exact: com.android.vending
- id: kotlin-play-store-enable-cmd-argv-text
  desc: Kotlin cmd package arguments enable Play Store
  for: [kotlin]
  if:
    type: text
    regex: 'ProcessBuilder\("cmd", *"package", *"enable", *"com\.android\.vending"'
composite_rules:
# Apps have no ordinary reason to switch off the Play Store from inside
# their own process; it silences the store's install-time scanning.
- id: android-play-store-disable-command
  desc: Launches command to disable Play Store
  crit: suspicious
  all:
  - id: jvm-package-disable-launch-pattern
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  any:
  - id: java-play-store-disable-command-argument
  - id: kotlin-play-store-disable-command-argument
  - id: java-play-store-disable-argv
  - id: kotlin-play-store-disable-argv
  - id: java-play-store-disable-cmd-argv
  - id: kotlin-play-store-disable-cmd-argv
  near_bytes: 256
- id: android-play-store-enable-command
  desc: Launches command to enable Play Store
  all:
  - id: jvm-package-enable-launch-pattern
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  any:
  - id: java-play-store-enable-command-argument
  - id: kotlin-play-store-enable-command-argument
  - id: java-play-store-enable-argv
  - id: kotlin-play-store-enable-argv
  - id: java-play-store-enable-cmd-argv
  - id: kotlin-play-store-enable-cmd-argv
  near_bytes: 256

- id: kotlin-play-store-disable-argv
  desc: Kotlin constructor arguments disable Play Store
  for: [kotlin]
  all:
  - id: kotlin-play-store-disable-argv-text
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  near_bytes: 1

- id: kotlin-play-store-disable-cmd-argv
  desc: Kotlin constructor arguments disable Play Store
  for: [kotlin]
  all:
  - id: kotlin-play-store-disable-cmd-argv-text
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  near_bytes: 1

- id: kotlin-play-store-enable-argv
  desc: Kotlin constructor arguments enable Play Store
  for: [kotlin]
  all:
  - id: kotlin-play-store-enable-argv-text
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  near_bytes: 1

- id: kotlin-play-store-enable-cmd-argv
  desc: Kotlin constructor arguments enable Play Store
  for: [kotlin]
  all:
  - id: kotlin-play-store-enable-cmd-argv-text
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  near_bytes: 1
