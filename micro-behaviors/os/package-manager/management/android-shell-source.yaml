defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
  crit: notable
  conf: 0.99
traits:
- id: jvm-package-disable-launch-pattern
  desc: ProcessBuilder launches package disable command
  if:
    type: text
    regex: ProcessBuilder\([^;]{0,100}\bdisable(-user)?\b[^;]{0,100}\.start\(
- id: android-play-store-disable-literal
  for: [java, kotlin, go, rust, c, cpp, python, javascript, typescript]
  platforms: [android, unix]
  desc: Command literal disables Play Store
  if:
    type: literal
    kind: string
    regex: '^(pm|cmd\s+package)\s+disable(-user)?\s+(--user\s+\d+\s+)?com\.android\.vending\s*$'
- id: jvm-package-enable-launch-pattern
  desc: ProcessBuilder launches a package enable command
  if:
    type: text
    regex: ProcessBuilder\([^;]{0,100}\benable\b[^;]{0,100}\.start\(
- id: android-play-store-enable-literal
  desc: Command literal enables Play Store
  if:
    type: literal
    kind: string
    regex: '^(pm|cmd\s+package)\s+enable\s+(--user\s+\d+\s+)?com\.android\.vending\s*$'
composite_rules:
- id: android-play-store-disable-command
  desc: Shell launch disables Play Store
  all:
  - id: jvm-package-disable-launch-pattern
  - id: android-play-store-disable-literal
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  near_bytes: 256
- id: android-play-store-enable-command
  desc: Shell launch enables Play Store
  all:
  - id: jvm-package-enable-launch-pattern
  - id: android-play-store-enable-literal
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  near_bytes: 256
