defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
  crit: notable
  conf: 0.99
traits:
- id: android-play-store-disable-launch-pattern
  desc: Source shell launch disables Play Store
  if:
    type: text
    regex: ProcessBuilder\([^;]{0,100}pm disable com\.android\.vending[^;]{0,10}\.start\(
- id: android-play-store-disable-literal
  desc: Command literal disables Play Store
  if:
    type: literal
    exact: pm disable com.android.vending
- id: android-play-store-enable-launch-pattern
  desc: Source shell launch enables Play Store
  if:
    type: text
    regex: ProcessBuilder\([^;]{0,100}pm enable com\.android\.vending[^;]{0,10}\.start\(
- id: android-play-store-enable-literal
  desc: Command literal enables Play Store
  if:
    type: literal
    exact: pm enable com.android.vending
composite_rules:
- id: android-play-store-disable-command
  desc: Shell launch disables Play Store
  all:
  - id: android-play-store-disable-launch-pattern
  - id: android-play-store-disable-literal
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  near_bytes: 256
- id: android-play-store-enable-command
  desc: Shell launch enables Play Store
  all:
  - id: android-play-store-enable-launch-pattern
  - id: android-play-store-enable-literal
  - id: micro-behaviors/process/create/subprocess::jvm-processbuilder-constructor-call
  near_bytes: 256
