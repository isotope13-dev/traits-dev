# Network references do not establish that downloaded bytes were installed.
---
defaults:
  platforms:
  - android
  - unix
  - windows
  for:
  - android_apk
  - zip
  - dex
composite_rules:
- id: android-network-sideload-control-clues
  desc: Network, sideload and process-control references
  crit: notable
  conf: 0.91
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-sideload-api-vocabulary
  - id: micro-behaviors/communications/http/client/exchange::android-http-response-or-post-reference
  any:
  - id: micro-behaviors/os/privilege/manifest::device-admin-receiver-class
  - id: micro-behaviors/process/terminate/kill::android-kill-background-processes-api
