# Android privileged-system installation surfaces. The priv-app directories
# and privapp-permissions allowlist files are platform-defined locations:
# an APK placed under */priv-app/ runs as a privileged system app, and a
# privapp-permissions XML under */etc/permissions/ is what grants it
# signature|privileged permissions. The paths and XML element names cannot
# be renamed by the installing code.
defaults:
  crit: notable
  platforms: [android, unix]
  for: [scripts, source]

traits:
  - id: android-privapp-path-reference
    desc: Android privileged system app path
    conf: 0.95
    if:
      type: text
      regex: '/(system|system_ext|product|vendor|odm)/priv-app/'

  - id: android-privapp-permissions-file-reference
    desc: Android privapp-permissions file path
    conf: 0.96
    if:
      type: text
      regex: '(privapp-permissions[-\w.]*\.xml|/etc/permissions/privapp)'

  - id: android-permission-xml-element
    desc: Android permission allowlist XML element
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '<permission\s+name="android\.permission\.'

  - id: android-privileged-permission-name
    desc: Privileged Android permission name
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'android\.permission\.(INSTALL_PACKAGES|DELETE_PACKAGES|REBOOT)"'

  - id: android-oem-staged-apk-path
    desc: APK staged in Android OEM partition
    conf: 0.9
    if:
      type: text
      regex: '/oem/[\w./-]*\.apk'

composite_rules:
  - id: android-privileged-permission-grant
    desc: Grants privileged Android permission
    conf: 0.96
    near_bytes: 80
    all:
      - id: android-permission-xml-element
      - id: android-privileged-permission-name
