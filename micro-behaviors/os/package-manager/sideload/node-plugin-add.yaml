defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  - id: node-spawn-plugin-add-temp-path
    desc: Spawns CLI plugin add with /tmp path
    conf: 0.96
    near_bytes: 1
    all:
      - id: micro-behaviors/process/argument/positional::node-spawn-plugin-subcommand-argument
      - id: micro-behaviors/process/argument/positional::node-spawn-add-action-argument
      - id: micro-behaviors/process/argument/positional::node-spawn-temp-path-arg
