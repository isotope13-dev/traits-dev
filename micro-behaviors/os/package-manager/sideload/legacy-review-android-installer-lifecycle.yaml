---
defaults:
  platforms:
  - android
  for:
  - apk
composite_rules:
- id: android-package-autogrant-temp-path
  for:
  - elf
  desc: Android auto-grant package install and temporary path co-occur
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-shell-package-install
  - id: micro-behaviors/os/package-manager/sideload::android-pm-install-auto-grant
  - id: micro-behaviors/fs/path/temp::android-local-tmp-path
