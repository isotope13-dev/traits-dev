defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, c, cpp, go, rust, dex]
  attack: T1021

traits:

  - id: adb-shell-apk-install
    desc: ADB shell service installs an APK
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+package|pm)\s+install\b.{0,200}\.apk\b'

  # `-r` replaces the installed package and `-g` grants every runtime
  # permission during installation. Match both option orders so the behavior
  # survives command-builder and implementation changes.
  - id: adb-shell-apk-reinstall-auto-grant
    desc: ADB reinstalls APK and grants permissions
    crit: notable
    conf: 0.99
    attack: T1631
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+package|pm)\s+install\b(.*\s-r\b.*\s-g\b|.*\s-g\b.*\s-r\b).{0,200}\.apk\b'

  # The -i option supplies installer attribution. It is also used by legitimate
  # provisioning tools and does not alone prove spoofing or a settings bypass.
  - id: adb-shell-apk-installer-attribution
    desc: ADB install specifies installer attribution
    crit: notable
    conf: 0.97
    attack: T1631
    if:
      type: literal
      kind: string
      regex: '^shell:(cmd\s+package|pm)\s+install\b.{0,200}\s-i\s+[a-z][a-z0-9_]*(\.[a-z0-9_]+)+'

  - id: adb-shell-system-apk-copy
    desc: Copies APK into Android system app path
    crit: suspicious
    conf: 0.99
    if:
      type: literal
      kind: string
      regex: '^shell:(cp|mv|install)\s+.{1,180}\.apk\s+/(system|product|vendor)/(priv-)?app/'
