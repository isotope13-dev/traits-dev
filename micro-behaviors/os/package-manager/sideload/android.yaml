defaults:
  platforms: [android, unix, windows]
  for: [apk, zip, dex]
  crit: notable
  conf: 0.88
traits:
  - id: android-apk-mime-type
    desc: Android APK MIME type
    for: [dex]
    if:
      type: text
      substr: "application/vnd.android.package-archive"
  - id: package-installer-service-class
    desc: Android package installer service class
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      word: "PackageInstallerService"
  - id: android-request-install-packages-permission
    desc: REQUEST_INSTALL_PACKAGES permission
    for: [xml, java, kotlin]
    crit: notable
    conf: 0.92
    attack: "T1631"
    if:
      type: text
      word: "REQUEST_INSTALL_PACKAGES"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
  - id: android-request-install-packages-manifest
    desc: Android manifest requests install permission
    for: [xml]
    crit: notable
    conf: 0.94
    attack: "T1631"
    if:
      type: text
      substr: "android.permission.REQUEST_INSTALL_PACKAGES"
  - id: android-request-delete-packages-permission
    desc: REQUEST_DELETE_PACKAGES permission
    for: [xml, java, kotlin]
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "REQUEST_DELETE_PACKAGES"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
  - id: android-package-installer-session-mode
    desc: PackageInstaller MODE_FULL_INSTALL session
    for: [java, kotlin]
    crit: notable
    conf: 0.93
    attack: "T1631"
    if:
      type: text
      word: "MODE_FULL_INSTALL"
  - id: android-packageinstaller-session-params
    desc: Android PackageInstaller session parameters
    crit: notable
    conf: 0.94
    attack: "T1631"
    for: [dex]
    if:
      type: text
      substr: "Landroid/content/pm/PackageInstaller$SessionParams;"
  - id: android-packageinstaller-create-session
    desc: PackageInstaller creates install session
    crit: notable
    conf: 0.94
    attack: "T1631"
    for: [dex]
    if:
      type: text
      exact: "createSession"
  - id: android-packageinstaller-open-write
    desc: PackageInstaller writes install payload
    crit: notable
    conf: 0.94
    attack: "T1631"
    for: [java, kotlin, dex]
    if:
      type: text
      word: "openWrite"
  - id: android-package-installer-no-user-action
    desc: Requests APK install without user action
    crit: notable
    conf: 0.96
    attack: "T1631"
    for: [java, kotlin]
    if:
      type: text
      word: "USER_ACTION_NOT_REQUIRED"
  - id: android-can-request-package-installs
    desc: Checks whether Android installs are allowed
    crit: notable
    conf: 0.92
    attack: "T1631"
    for: [xml, java, kotlin]
    if:
      type: text
      word: "canRequestPackageInstalls"
  - id: android-package-installer-session-api
    desc: PackageInstaller.Session usage
    for: [java, kotlin]
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "PackageInstaller.Session"
  - id: android-shell-package-install
    desc: Shell invokes Android APK package installation
    crit: notable
    conf: 0.94
    platforms: [unix, android]
    for: [shell, elf]
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*(cmd[ \t]+package|pm)[ \t]+install\b.{0,180}\.apk\b'
  - id: android-pm-install-auto-grant
    desc: Installs APK auto-granting permissions
    crit: notable
    conf: 0.95
    platforms: [unix, android]
    for: [shell, elf]
    if:
      type: text
      regex: '(?i)\bpm\s+install\b[^\n;]{0,120}\s-g\b'

  # A shell-UID agent may invoke `pm` directly rather than wrapping the
  # command in an ADB `shell:` service request. Keep this source matcher on a
  # parsed string literal so documentation and comments cannot satisfy it.
  - id: android-source-pm-apk-reinstall-auto-grant
    desc: Source reinstalls APK with permission grants
    crit: notable
    conf: 0.99
    attack: T1631
    platforms: [android]
    for: [java, kotlin, go, rust, c, cpp]
    if:
      type: literal
      kind: string
      regex: '^(cmd\s+package|pm)\s+install\b(.*\s-r\b.*\s-g\b|.*\s-g\b.*\s-r\b).{0,200}\.apk\b'

  - id: android-source-pm-apk-install-source-spoof
    desc: Source command spoofs APK installer package
    crit: notable
    conf: 0.97
    attack: T1631
    platforms: [android]
    for: [java, kotlin, go, rust, c, cpp]
    if:
      type: literal
      kind: string
      regex: '^(cmd\s+package|pm)\s+install\b.{0,200}\s-i\s+[a-z][a-z0-9_]*(\.[a-z0-9_]+)+'
  - id: android-shell-enable-package
    desc: Shell enables an Android package
    crit: notable
    conf: 0.9
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*pm[ \t]+enable[ \t]+\S{1,120}'
composite_rules:
  - id: android-apk-reinstall-auto-grant
    desc: Android shell command reinstalls an APK and grants permissions
    crit: notable
    conf: 0.99
    for: [source, binaries]
    any:
      - id: android-source-pm-apk-reinstall-auto-grant
      - id: micro-behaviors/communications/socket/tcp::adb-shell-apk-reinstall-auto-grant

  - id: android-apk-install-source-spoof
    desc: Android shell command supplies a spoofed APK installer identity
    crit: notable
    conf: 0.97
    for: [source, binaries]
    any:
      - id: android-source-pm-apk-install-source-spoof
      - id: micro-behaviors/communications/socket/tcp::adb-shell-apk-install-source-spoof

  # Actually driving the installer, as opposed to declaring the permission that
  # allows it. Named once so persistence objectives can require the behaviour:
  # `REQUEST_INSTALL_PACKAGES` on its own is what every self-updating app holds.
  - id: package-installer-driven
    desc: Code drives the Android package installer
    crit: notable
    conf: 0.92
    # Only legs that name the PackageInstaller API itself. `createSession` and
    # `openWrite` are deliberately excluded: both are bare method names that
    # any session-based API uses -- Telegram's Android source has 13
    # `createSession` calls and never touches PackageInstaller -- so including
    # them would reintroduce the false positive this composite exists to stop.
    any:
      - id: android-package-installer-session-mode
      - id: android-packageinstaller-session-params
      - id: android-package-installer-no-user-action
      - id: android-package-installer-session-api

  - id: android-programmatic-apk-install
    desc: Programmatic full APK install session
    crit: notable
    conf: 0.95
    attack: "T1631"
    for: [java, kotlin]
    all:
      - id: android-package-installer-session-mode
      - id: android-package-installer-session-api
  - id: android-silent-apk-install
    desc: APK install requests no user action
    crit: suspicious
    conf: 0.97
    attack: "T1631"
    for: [java, kotlin]
    all:
      - id: android-programmatic-apk-install
      - id: android-package-installer-no-user-action
  - id: android-install-permission-boot-foreground
    for: [android_apk, dex, zip, xml]
    desc: Android install permission with boot foreground persistence
    crit: suspicious
    conf: 0.95
    attack: "T1631, T1624.001"
    all:
      - id: android-request-install-packages-permission
      - id: micro-behaviors/os/service/daemon::android-boot-completed-permission
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission-text
