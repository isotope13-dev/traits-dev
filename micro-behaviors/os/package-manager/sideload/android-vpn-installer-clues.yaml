defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
composite_rules:
  # A VPN and package installer may be unrelated; these references do not
  # establish interception, verifier evasion or a successful installation.
  - id: android-vpn-install-session-clues
    desc: VPN and package installer session references
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/network/tunnel::android-vpn-service-class
      - id: micro-behaviors/network/tunnel::android-vpn-builder
      - id: micro-behaviors/network/tunnel::android-add-route-method
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-create-session
