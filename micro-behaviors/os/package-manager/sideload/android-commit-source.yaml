defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
  crit: notable
  conf: 0.98
traits:
- id: android-session-payload-write-commit
  desc: APK openWrite/commit source sequence
  if:
    type: text
    regex: (?s)\.\s*openWrite\s*\(\s*"[^"\n]{1,80}\.apk".{0,750}[\n;}][ \t]*\w+\.\s*commit\s*\(

- id: android-store-disable-before-apk-write
  desc: Play Store disable text before openWrite
  if:
    type: text
    regex: '(?s)disable(-user)?\s+(--user\s+\S+\s+)?com\.android\.vending.{0,800}\.\s*openWrite\s*\('
- id: android-apk-openwrite-call
  desc: Calls openWrite with APK filename
  for: [java]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)openWrite$'
    arg:
      index: 0
      kind: string
      regex: '\.apk$'
- id: android-kotlin-apk-openwrite-call
  desc: Kotlin APK openWrite source text
  for: [kotlin]
  if:
    # Source fallback until Kotlin member-call facts are available.
    type: text
    regex: '\.\s*openWrite\s*\(\s*"[^"\n]{1,80}\.apk"'
composite_rules:
- id: android-apk-session-commit
  desc: Opens APK write stream and commits session
  all:
  - id: android-session-payload-write-commit
  - id: android-package-installer-session-api
  - id: android-package-installer-session-mode
  any:
  - id: android-apk-openwrite-call
  - id: android-kotlin-apk-openwrite-call
  near_bytes: 1400

