defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
  crit: notable
  conf: 0.98
traits:
- id: android-session-payload-write-commit
  desc: APK stream open precedes session commit
  if:
    type: text
    regex: (?s)\.openWrite\("[^"\n]{1,80}\.apk".{0,750}\n[ \t]*\w+\.commit\(

- id: android-store-disable-before-apk-write
  desc: Play Store disable precedes APK stream write
  if:
    type: text
    regex: '(?s)disable(-user)?\s+(--user\s+\d+\s+)?com\.android\.vending.{0,800}\.openWrite\('
composite_rules:
- id: android-apk-session-commit
  desc: PackageInstaller session writes an APK and commits
  all:
  - id: android-session-payload-write-commit
  - id: android-package-installer-session-api
  - id: android-package-installer-session-mode
  near_bytes: 1400

