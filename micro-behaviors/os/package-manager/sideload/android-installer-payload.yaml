defaults:
  platforms: [android, unix, windows]
  for: [android_apk, zip]
  crit: suspicious
  conf: 0.94

composite_rules:
- id: android-opaque-package-installer
  desc: Android opaque package installer
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-session
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name
  any:
  - id: micro-behaviors/os/package-manager/reference-install::android-install-receiver-class
  - id: micro-behaviors/os/package-manager/reference-install::android-install-activity-class
  - id: micro-behaviors/os/package-manager/reference-install::android-install-telemetry-event
- id: android-packageinstaller-with-opaque-asset
  desc: PackageInstaller APIs and install permission coexist with opaque APK assets
  crit: suspicious
  conf: 0.99
  scope: outer
  for: [android_apk, zip, xml, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-session-params
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-create-session
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
  - id: metadata/permission/management::android-request-install-packages-request
  any:
  - id: metadata/package/files/mobile-package::apk-assets-data-member
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: metadata/package/files/android-assets::apk-opaque-shortext-asset
  - id: metadata/package/files/android-assets::apk-alphanumeric-data-asset
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name
- id: android-cipher-asset-packageinstaller-clues
  desc: Android asset, Cipher and installer session clues
  crit: suspicious
  conf: 0.96
  scope: outer
  for: [android_apk, zip, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-session-params
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-create-session
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
  - id: micro-behaviors/data/embedded/resource::dalvik-get-assets-reference
  - id: micro-behaviors/crypto/provider/library::android-cipher-class
  any:
  - id: metadata/package/files/mobile-package::apk-assets-data-member
  - id: metadata/package/files/android-assets::apk-opaque-extensionless-asset
  - id: metadata/package/files/android-assets::apk-opaque-shortext-asset
  - id: metadata/package/files/android-assets::apk-alphanumeric-data-asset
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name
- id: android-cipher-installer-evasion-clues
  desc: Android cipher installer and evasion clues
  crit: suspicious
  conf: 0.98
  scope: outer
  for: [android_apk, zip, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-cipher-asset-packageinstaller-clues
  any:
  - id: metadata/archive/member/path::path-traversal-members
  - id: metadata/archive/layout::archive-misplaced-executable-member
  - id: micro-behaviors/os/application/target/security::android-oem-security-center-target
  - id: micro-behaviors/network/tunnel::android-vpn-builder
