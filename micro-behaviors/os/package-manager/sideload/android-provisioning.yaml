composite_rules:
  - id: android-reinstall-accessibility-configuration
    platforms: ['android']
    desc: APK reinstall and Accessibility setup
    crit: notable
    conf: 0.995
    for: [source, binaries]
    all:
      - id: micro-behaviors/os/package-manager/sideload::android-apk-reinstall-auto-grant
      - id: micro-behaviors/os/application/desktop-settings::android-accessibility-settings-command-enable
