# Installing a package *file* the program already has on disk, as opposed to
# pulling a named package from a configured repository. The distinction is the
# whole point: `apt-get install curl` takes what the distro signed, while
# `dpkg -i /tmp/x.deb` or `apt install ./x.deb` installs bytes the program chose
# and brought with it, as root, running that package's maintainer scripts.
#
# Nothing covered this. The apt/ directory matches `apt-get install` generally
# and micro-behaviors/fs/path/package-manager/ matches the dpkg status path, so
# a program that downloads a .deb and installs it produced no finding tying the
# two together -- which is the shape of both a legitimate self-updater and a
# backdoored one. Neutral here; the objectives supply where the file came from.
#
# Its own directory rather than a file under install/: sideloading is a distinct
# technique from pulling a named package off a configured repo, and install/ was
# already at the 80-trait leaf cap.
defaults:
  platforms: [unix]
  for: [binaries, scripts, source, -applescript]
  crit: notable
  conf: 0.9

traits:
  - id: dpkg-install-file
    desc: Installs a Debian package file with dpkg
    if:
      type: text
      regex: '(?m)(^|[;&|`$(\s])dpkg\s[^\n]{0,60}(-i\b|--install\b)'

  # `apt`/`apt-get install` given a path or a .deb rather than a package name.
  - id: apt-install-local-deb
    desc: Installs a local .deb through apt
    if:
      type: text
      regex: '(?i)apt(-get)?\s[^\n]{0,40}install\s[^\n]{0,60}(\.deb\b|\s\./)'

  - id: rpm-install-file
    desc: Installs an RPM package file
    if:
      type: text
      regex: '(?m)(^|[;&|`$(\s])rpm\s[^\n]{0,40}-(i|U)[vh]{0,2}\s[^\n]{0,40}\.rpm'

  - id: macos-installer-pkg
    desc: Installs a macOS package with installer
    platforms: [macos]
    if:
      type: text
      regex: '(?m)(^|[;&|`$(\s])installer\s[^\n]{0,60}-pkg\b'

# No `downloaded-package-artifact-name` atom: a filename like
# `foo-update.deb` is a fragment that only means something inside a
# fetch-then-install composite, and writing the fragment without the composite
# leaves an orphan. The four atoms above already carry the analyst-relevant
# fact -- that a package file gets installed.
