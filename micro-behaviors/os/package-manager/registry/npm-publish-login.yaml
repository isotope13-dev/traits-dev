defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json, npm]
traits:
  - id: node-cli-publish-login-registry-flag-injection
    desc: CLI injects --registry for publish/login
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '(\x27publish\x27|"publish"|\x27login\x27|"login")[\s\S]{0,300}\.push\(\s*[''"]--registry'
    unless:
      # Benign CLI wrappers forward a user-specified registry option/flag to npm publish
      - type: text
        regex: '\.push\(\s*[''"]--registry[''"]\s*,\s*[\w$?.]{1,30}\.registry\b'
      # The optional-forward idiom: the flag is added only when the caller
      # passed a registry (`registry && args.push("--registry", registry)`).
      # A hijack adds its own registry unconditionally.
      - type: text
        regex: '&&\s*[\w$]+\.push\(\s*[''"]--registry[''"]\s*,\s*[\w$]+\)'
      # The same guard as an if block (`if (registryUrl !== undefined) {
      # args.push('--registry', registryUrl); }` in Angular's ng-dev release).
      - type: text
        regex: 'if\s*\(\s*[\w$.]+\s*(!==?\s*(undefined|null)\s*)?\)\s*\{?\s*\w+\.push\(\s*[''"]--registry'

  - id: node-registry-flag-push-url-literal-origin
    desc: Pushes --registry flag from HTTP URL literal
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '\.push$'
      args:
        - index: 0
          kind: string
          exact: --registry
        - index: 1
          from:
            value: '^https?://'

  - id: node-publish-login-subcommand-comparison
    desc: Compares subcommand with publish or login
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      exclude_comments: true
      regex: '===?\s*[''"](publish|login|adduser)[''"]'

composite_rules:
  - id: node-publish-login-registry-url-default
    desc: Publish/login branch pushes registry URL
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    near_lines: 6
    all:
      - id: node-publish-login-subcommand-comparison
      - id: node-registry-flag-push-url-literal-origin

  - id: node-publish-login-registry-flag-override
    desc: Node CLI overrides publish/login registry flag
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    any:
      - id: node-cli-publish-login-registry-flag-injection
      - id: node-publish-login-registry-url-default

