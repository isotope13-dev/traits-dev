# Recognized software installers fetched over HTTP and run -- `install.sh`,
# `*-installer.sh` and `get-*.sh` piped to a shell, the ClickHouse and
# linuxdeploy installers, release-asset downloads. These describe an installer, which
# is why they live here and not in process/create/shell/pipeline/: that
# directory holds the curl|sh *detection* traits, and rules that suppress
# on a recognized installer have curl|sh in their own evidence.
defaults:
  platforms:
    - unix
    - windows
  crit: baseline
  for: [shell, powershell, python, javascript, github-actions]
  size_max: 5242880
traits:
  - id: backup-script
    desc: HTTP backup script pattern
    conf: 0.8
    if:
      type: text
      regex: curl\s+.{0,100}backup|wget\s+.{0,100}backup|aws\s+s3\s+cp.{0,100}backup
  - id: installer-script
    desc: HTTP installer script pattern
    conf: 0.8
    if:
      type: text
      regex: '(curl|wget)\s+.{0,100}install|install\.sh|(apt-get|dnf|yum|zypper)\s+.{0,30}install'
  # Vendor offline installers (Intel oneAPI, similar GPU/SDK bootstraps) download
  # a local .sh/.run payload, chmod it, then invoke it with the documented
  # silent + EULA-accept flags. That shape is installer UX, not a dropper.
  - id: silent-eula-accept-installer
    desc: Silent installer accepts EULA
    crit: notable
    conf: 0.92
    for: [shell]
    if:
      type: text
      regex: '(?i)--silent\b[^\n]{0,80}--eula\s+accept|--eula\s+accept[^\n]{0,80}--silent\b'
  # Installer-vs-dropper line: a remote script PIPED into a shell is the
  # universal install idiom (golangci-lint, helm, rustup, kustomize, kubevela,
  # CodSpeed's `codspeed-runner-installer.sh`, …). What separates a
  # legitimate installer from a `curl $C2/api | bash` dropper is the fetched
  # script's NAME: legitimate installers fetch a conventionally-named
  # `install.sh` / `*-installer.sh` / `get-*` / `setup_*` script, a path
  # malware almost never uses for its payload. These atoms recognize that
  # benign shape so the C2/dropper objectives can DOWNGRADE (not suppress) the
  # generic curl|bash signal — an unknown URL stays suspicious, a named
  # installer drops to notable.
  - id: install-script-pipe
    desc: install-named remote script piped to a shell
    crit: baseline
    conf: 0.9
    for: [shell, github-actions, makefile, dockerfile, powershell]
    if:
      type: text
      # The fetched URL is routinely shell-quoted in composite actions
      # (`curl -fsSL "https://host/install.sh" | bash`), so allow one
      # closing quote between the script name and the pipe.
      regex: '(curl|wget)\b[^\n|]{0,200}/(install|[\w.-]*-installer)[\w.-]*["'']?\s*\|\s*(bash|sh)\b'
  # Setup scripts assign the installer URL, then pipe curl of that variable.
  # The one-line pattern above never sees install.sh on the pipe line.
  - id: quoted-remote-install-sh
    desc: Quoted remote install.sh URL
    crit: baseline
    conf: 0.9
    for: [shell, github-actions]
    if:
      type: text
      regex: 'https?://\S+/install\.sh'
  # Relocated from objectives/command-and-control/dropper/delivery/pipe,
  # where it was `curl-pipe-install-sh-url`. Covers the same idiom quoted in
  # help text and install hints of non-shell sources (huggingface_hub prints
  # `curl -LsSf https://hf.co/cli/install.sh | bash`).
  - id: curl-install-sh-pipe
    desc: curl/wget install.sh output piped
    crit: notable
    conf: 0.86
    for: [shell, python, javascript, typescript, ruby, go, rust]
    if:
      type: text
      regex: '(curl|wget)(\.exe)?\s+[^\n|]{0,160}/install\.sh[^\n|]{0,80}\|'
  - id: getter-script-pipe
    desc: get/setup-named remote script piped to a shell
    crit: baseline
    conf: 0.9
    for: [shell, github-actions, makefile, dockerfile, powershell]
    if:
      type: text
      # Same shell-quoted-URL allowance as install-script-pipe above.
      regex: '(curl|wget)\b[^\n|]{0,200}/(get|setup|[\w.-]*[-_]setup)[\w.-]*["'']?\s*\|\s*(bash|sh)\b'
  - id: karajan-code-posix-installer-header
    desc: Karajan Code POSIX installer script header
    crit: notable
    conf: 0.98
    for: [shell]
    if:
      type: text
      regex: '(?m)^#\s*Karajan Code installer\b.{0,500}manufosela/karajan-code'

  - id: clickhouse-installer-pipe
    desc: ClickHouse installer piped to shell
    crit: notable
    conf: 0.98
    for: [github-actions, shell]
    if:
      type: text
      regex: '(curl https://clickhouse\.com \| sh)'
  - id: rustup-installer-pipe
    desc: rustup installer piped to shell
    crit: notable
    conf: 0.98
    for: [scripts, build, source, github-actions]
    if:
      type: text
      regex: 'https?://(sh\.rustup\.rs|static\.rust-lang\.org/rustup(\.sh)?)[^\n|]{0,80}\|\s*(bash|sh)\b'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  # The official rustup-init binary from Rust's own distribution host, fetched
  # by a build script that bootstraps its pinned toolchain (Meson/CMake glue).
  - id: rustup-init-official-download
    desc: rustup-init fetched from rust-lang.org
    crit: notable
    conf: 0.97
    for: [python, scripts, build, source]
    if:
      type: text
      regex: 'https://static\.rust-lang\.org/rustup/dist/[^\s''"]{0,80}rustup-init'
  # Official Android SDK command-line tools archive from Google.
  - id: android-commandline-tools-official-download
    desc: Android tools from dl.google.com
    crit: notable
    conf: 0.97
    for: [python, scripts, build, source]
    if:
      type: text
      regex: 'https://dl\.google\.com/android/repository/commandlinetools-[\w.-]{0,40}'
  # jbang's documented bootstrap (`curl -Ls https://sh.jbang.dev | bash -s -
  # app setup`) — the canonical install command for the Java script runner,
  # used by project CI (Quarkus's action helpers) the same way as rustup's.
  - id: jbang-installer-pipe
    desc: jbang installer piped to shell
    crit: notable
    conf: 0.98
    for: [scripts, build, source, github-actions]
    if:
      type: text
      regex: 'https?://sh\.jbang\.dev[^\n|]{0,80}\|\s*(bash|sh)\b'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: pyenv-installer-pipe
    desc: pyenv installer piped to shell
    crit: notable
    conf: 0.98
    for: [scripts, build, source, github-actions]
    if:
      type: text
      regex: 'https?://pyenv\.run[^\n|]{0,80}\|\s*(bash|sh)\b'
  - id: elan-installer-pipe
    desc: elan installer piped to shell
    crit: notable
    conf: 0.98
    for: [scripts, build, source, github-actions]
    if:
      type: text
      regex: 'https?://elan\.lean-lang\.org/elan-init\.sh[^\n|]{0,80}\|\s*(bash|sh)\b'
  - id: elan-github-raw-installer-pipe
    desc: elan installer from GitHub piped to shell
    crit: notable
    conf: 0.98
    for: [scripts, build, source, github-actions]
    if:
      type: text
      regex: 'githubusercontent\.com/leanprover/elan/master/elan-init\.sh[^\n|]{0,60}\|\s*(bash|sh)\b'
  - id: install-node-vercel-bootstrap-url
    desc: Vercel install-node bootstrap host
    crit: notable
    conf: 0.98
    for: [shell, markdown, text, github-actions]
    if:
      type: text
      substr: install-node.vercel.app
  - id: precc-peria-install-script-url
    desc: PRECC peria.ai install script URL
    crit: notable
    conf: 0.98
    for: [shell, markdown, text]
    if:
      type: text
      substr: peria.ai/install.sh
  - id: browser-use-profile-installer-pipe
    desc: browser-use profile installer piped to shell
    crit: notable
    conf: 0.98
    for: [scripts, build, source, github-actions]
    if:
      type: text
      regex: 'https?://browser-use\.com/profile\.sh[^\n|]{0,80}\|\s*(bash|sh)\b'
  # Microsoft's documented Dev Tunnels CLI bootstrap: aka.ms short links for
  # the install script and the platform zip/exe. Same vendor-installer shape
  # as the ClickHouse pipe above.
  - id: devtunnel-cli-installer
    desc: Microsoft Dev Tunnels CLI installer
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: aka\.ms/(DevTunnelCliInstall|TunnelsCliDownload)

  - id: linuxdeploy-appimage-release-download
    desc: linuxdeploy AppImage release download
    crit: notable
    conf: 0.96
    for: [shell]
    if:
      type: text
      substr: github.com/linuxdeploy/releases/download/continuous

  - id: linuxdeploy-appimage-build-command
    desc: linuxdeploy AppImage build command
    crit: notable
    conf: 0.96
    for: [shell]
    if:
      type: text
      regex: '\./linuxdeploy-[^[:space:]]+\.AppImage|--appdir[^\n]{0,60}--output[[:space:]]+appimage'

  - id: appimagetool-release-download
    desc: Official appimagetool release download
    crit: notable
    conf: 0.96
    for: [shell]
    if:
      type: text
      regex: 'github\.com/AppImage/(appimagetool|AppImageKit)/releases/download/'

  - id: appimagetool-build-command
    desc: "appimagetool name or --appimage-extract option"
    crit: notable
    conf: 0.96
    for:
      - shell
      - scripts
      - source
      - javascript
      - typescript
    if:
      type: text
      regex: '(?i)(^|[/\s"''`])\.?/?appimagetool\b|--appimage-extract\b'

  - id: dotnet-local-publish
    desc: Local dotnet publish build
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'dotnet\s+publish\b'
  - id: pyinstaller-local-build
    desc: Local PyInstaller build
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'PyInstaller\s+--clean'
  - id: staged-dir-var
    desc: Staged package directory variable
    conf: 0.86
    for: [shell]
    if:
      type: text
      word: STAGE_DIR
  - id: tar-gzip-create
    desc: Creates gzip tar archive
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: 'tar\s+-czf'
  - id: staged-new-binary-copy-to-new
    desc: Copies downloaded binary to .new path
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      substr: 'cp "$TMPDIR/$BINARY_NAME" "$INSTALL_DIR/$BINARY_NAME.new"'
  - id: staged-new-binary-rename
    desc: Renames .new binary into install path
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      substr: 'mv -f "$INSTALL_DIR/$BINARY_NAME.new" "$INSTALL_DIR/$BINARY_NAME"'
  - id: tool-class-inheritance
    desc: Tool class inheritance
    conf: 0.88
    for: [python]
    if:
      type: text
      regex: 'class\s+\w+Tool\((BinaryTool|BaseTool|McpTool)\)'
  - id: tool-cli-help-install
    desc: Tool install CLI help
    conf: 0.88
    for: [python]
    if:
      type: text
      regex: 'cli_help\s*=\s*["'']Install'
  - id: tool-install-update-text
    desc: Tool install update text
    conf: 0.88
    for: [python]
    if:
      type: text
      regex: 'Install or update .{0,80}(CLI|tool|server|application)'
  - id: package-manager
    desc: Package manager command
    conf: 0.9
    if:
      type: text
      regex: apt-get\s+update|apk\s+add|brew\s+install
  - id: ci-cd-pipeline
    desc: Names a CI/CD system
    conf: 0.8
    if:
      type: text
      regex: jenkins|gitlab-ci|github-actions|travis-ci
  - id: health-check-fetch
    desc: HTTP health check fetch command
    conf: 0.9
    if:
      type: text
      regex: '(curl|wget)\s+[^|&]{0,80}health'
  - id: health-check-local
    desc: Localhost health endpoint
    conf: 0.9
    if:
      type: text
      regex: http://(localhost|127\.0\.0\.1).{0,50}/health
  - id: shell-uninstall-function-marker
    desc: Shell uninstall function defined
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?i)\buninstall_[a-z0-9_-]+\s*\(\)|\bfunction\s+uninstall_'
  - id: systemd-unit-file-removal
    desc: Shell removes a systemd unit file
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'rm\s+-f\s+/etc/systemd/system/\S+\.service'
composite_rules:
  # The installer URL is assigned, then curl of that variable is piped to sh.
  # The one-line install-script-pipe matcher never sees install.sh on the pipe line.
  - id: install-sh-url-near-shell-pipe
    desc: install.sh URL near a curl pipe to a shell
    crit: baseline
    conf: 0.92
    for: [shell]
    near_lines: 16
    all:
      - id: quoted-remote-install-sh
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
  # One reference for the recognized vendor/toolchain bootstrap downloads that
  # download-and-run rules would otherwise each carry as a separate unless:.
  - id: vendor-bootstrap-download-context
    desc: Recognized vendor or toolchain bootstrap download
    crit: exception
    conf: 0.95
    any:
      - id: rustup-init-official-download
      - id: android-commandline-tools-official-download
      - id: devtunnel-cli-installer
      - id: well-known/tool/development/toolchain/dotnet-sdk::dotnet-install-script-url
      - id: well-known/lib/ai/whisper-cpp::whisper-cpp-github-release-download-url
      - id: well-known/tool/browser::single-file-cli-bootstrap-installer-context
      - id: well-known/app/utility/fastfetch::fastfetch-bootstrap-installer-context
      - id: micro-behaviors/communications/url/external/github::frp-release-download-url
  - id: tool-installer-framework
    desc: Tool installer framework
    conf: 0.88
    for: [python]
    any:
      - id: tool-class-inheritance
      - id: tool-cli-help-install
      - id: tool-install-update-text
  - id: health-check
    desc: HTTP health check pattern
    conf: 0.9
    any:
      - id: health-check-fetch
      - id: health-check-local
  - id: verified-release-installer
    desc: Installer release URL and checksum label
    conf: 0.94
    any:
      - id: installer-script
    all:
      - id: micro-behaviors/communications/http/download/release::release-download-path-reference
      - id: "metadata/package/integrity::sha256sums-checksums-or-compute-label"

  - id: verified-github-release-installer
    desc: GitHub release installer verifies downloaded artifact
    crit: exception
    conf: 0.96
    for: [shell]
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
    any:
      - id: micro-behaviors/crypto/hash/file::downloaded-artifact-sha256-compare
      - id: micro-behaviors/crypto/hash/file::downloaded-artifact-sha256-helper-compare
      - id: micro-behaviors/crypto/hash/file::shell-sha256-actual-expected-equal
  - id: linuxdeploy-appimage-build-context
    desc: Recognized linuxdeploy AppImage build context
    crit: exception
    conf: 0.97
    for: [shell]
    all:
      - id: linuxdeploy-appimage-release-download
      - id: linuxdeploy-appimage-build-command
  - id: appimagetool-appimage-build-context
    desc: Recognized appimagetool AppImage build context
    crit: exception
    conf: 0.97
    for: [shell]
    all:
      - id: appimagetool-release-download
      - id: appimagetool-build-command
  - id: staged-new-binary-install
    desc: Staged .new binary install before atomic rename
    crit: notable
    conf: 0.9
    for: [shell]
    near_bytes: 1600
    all:
      - id: staged-new-binary-copy-to-new
      - id: staged-new-binary-rename
  - id: macos-quarantine-repair-installer
    desc: Release labels and quarantine/codesign co-occur
    crit: notable
    conf: 0.96
    platforms: [macos]
    for: [shell]
    all:
      - id: micro-behaviors/communications/http/download/release::release-download-path-reference
      - id: "metadata/package/integrity::sha256sums-checksums-or-compute-label"
      - id: micro-behaviors/os/security/gatekeeper::quarantine-clear-codesign-cooccurrence
  - id: macos-local-build-quarantine-repair-installer
    desc: Local publish, staged install and xattr co-occur
    crit: notable
    conf: 0.95
    platforms: [macos]
    for: [shell]
    all:
      - id: dotnet-local-publish
      - id: staged-new-binary-install
      - id: micro-behaviors/os/security/gatekeeper::quarantine-clear-codesign-cooccurrence
  - id: macos-local-pyinstaller-quarantine-repair
    desc: PyInstaller archive build and xattr co-occur
    crit: notable
    conf: 0.94
    platforms: [macos]
    for: [shell]
    all:
      - id: pyinstaller-local-build
      - id: staged-dir-var
      - id: tar-gzip-create
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
