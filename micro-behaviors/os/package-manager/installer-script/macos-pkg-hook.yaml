defaults:
  platforms: [macos]
  for: [macho, objc, swift, shell, applescript]

traits:
  - id: pkg-scripts-hook-path
    desc: macOS package Scripts hook path
    crit: notable
    conf: 0.9
    for: [pkg]
    if:
      type: text
      regex: '[^/\s]{1,120}\.pkg/Scripts\b|Scripts/(preinstall|postinstall)'
