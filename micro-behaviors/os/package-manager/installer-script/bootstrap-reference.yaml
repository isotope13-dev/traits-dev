defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - shell
  - python
  - javascript
  - ruby
  - perl
  - applescript
  crit: notable
traits:
- id: ollama-install-script-reference
  desc: Ollama install script reference
  conf: 0.92
  if:
    type: text
    substr: ollama.com/install.sh
- id: phone-bridge-installer-reference
  desc: Phone bridge installer reference
  conf: 0.9
  if:
    type: text
    substr: install-phone-bridge.sh
composite_rules:
- id: curl-pipe-obvious-installer
  desc: Remote install.sh piped into shell
  crit: notable
  conf: 0.86
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, rust]
  all:
  - id: micro-behaviors/os/package-manager/installer-script::curl-install-sh-pipe
  - id: metadata/lang/source/syntax/command/pipeline::pipe-to-shell
  unless:
  - id: micro-behaviors/os/package-manager/installer-script::installer-script
  - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
  - id: well-known/app/ai/coding-agent/vtcode::install-script-url
  - id: well-known/app/ai/coding-agent/vtcode::vtcode-agent-package
  - id: recognized-official-install-script
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
- id: recognized-official-install-script
  desc: Recognized official CLI install context
  crit: exception
  conf: 0.99
  platforms: [unix]
  for: [python, javascript, typescript, ruby, go, rust, shell]
  any:
  - id: well-known/tool/development/cli/dotenvx::dotenvx-install-script-url
  - id: well-known/tool/development/cli/abra::abra-install-script-url
  - id: well-known/tool/development/cli/scc::scc-install-script-url
  - id: micro-behaviors/communications/url/host/domain-http::opencode-install-script-url
  - id: well-known/app/ai/coding-agent/factory-droid::factory-droid-install-script-url
  - id: well-known/app/ai/coding-agent/forge::forge-install-script-url
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-install-script-url
  - id: well-known/tool/development/vscode-extension/snowflake::coco-cli-terminal-install-command
  - id: well-known/tool/packaging/nix::nixos-install-script-url
  - id: well-known/tool/detection/cert-x-gen::install-script-url
