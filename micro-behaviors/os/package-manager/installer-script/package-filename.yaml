# References to a client/installer/update package file by name.
defaults:
  platforms: [unix, windows]
traits:
- id: installer-package-filename
  desc: Names a client or installer package file
  for: [scripts, binaries]
  crit: notable
  conf: 0.92
  if:
    type: text
    # Exclude dotted spans so JS spread syntax like `{ ...pkg }` cannot
    # satisfy the extension suffix after an `update` token match.
    regex: '(?i)(client|installer|setup|update)[^\\/"''\r\n.]{0,60}\.(dmg|pkg|deb|rpm)\b'
