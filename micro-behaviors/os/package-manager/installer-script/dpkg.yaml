defaults:
  for: [shell]
  platforms: [linux]

composite_rules:
  - id: dpkg-maintainer-script-hook
    desc: Debian maintainer-script execution context
    crit: notable
    conf: 0.9
    all:
      - id: metadata/package/files/system-package::dpkg-maintainer-script
    any:
      - id: metadata/package/files/system-package::dpkg-lifecycle-argument-test
      - id: metadata/package/files/system-package::dpkg-lifecycle-case-branch
      - id: metadata/build/package/maintainer-scripts::debhelper-auto-section-end
      # Minimal malicious postinst files often omit normal dpkg argument
      # handling entirely. A remote response piped to an interpreter is itself
      # sufficient proof that the basename-identified maintainer script runs.
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-sh-text
    unless:
      - id: metadata/build/package/maintainer-scripts::selinux-postinst-maintenance
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context

