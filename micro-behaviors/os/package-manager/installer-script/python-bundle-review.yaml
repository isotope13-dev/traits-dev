# Evidence describes ordinary capabilities or static properties.
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
traits:
- for:
  - github-actions
  id: gha-golangci-pipe-installer
  desc: golangci-lint installer endpoint reference
  if:
    type: value
    path: jobs.*.steps[*].run
    substr: raw.githubusercontent.com/golangci/golangci-lint/
- for:
  - github-actions
  id: gha-apm-pipe-installer
  desc: Microsoft APM installer endpoint reference
  if:
    type: value
    path: jobs.*.steps[*].run
    substr: raw.githubusercontent.com/microsoft/apm/
- for:
  - github-actions
  id: gha-nodesource-pipe-installer
  desc: NodeSource installer endpoint reference
  if:
    type: value
    path: jobs.*.steps[*].run
    substr: https://deb.nodesource.com/setup_
- for:
  - github-actions
  id: gha-anchore-grype-pipe-installer
  desc: Anchore Grype installer endpoint reference
  if:
    type: value
    path: jobs.*.steps[*].run
    substr: raw.githubusercontent.com/anchore/grype/main/install.sh
- for:
  - github-actions
  id: gha-cargo-binstall-pipe-installer
  desc: cargo-binstall installer endpoint reference
  if:
    type: value
    path: jobs.*.steps[*].run
    substr: raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh
- for:
  - github-actions
  id: gha-chainloop-pipe-installer
  desc: Chainloop installer endpoint reference
  if:
    type: value
    path: jobs.*.steps[*].run
    substr: dl.chainloop.dev/cli/install.sh
- for:
  - github-actions
  id: gha-dagger-pipe-installer
  desc: Dagger installer endpoint reference
  if:
    type: value
    path: jobs.*.steps[*].run
    substr: https://dl.dagger.io/dagger/install.sh
- for:
  - github-actions
  id: gha-curl-pipe-installer
  desc: curl getter-host root piped to shell
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: curl\b[^|]{0,160}//(get|install|setup)[\w.-]*/?\s*\|\s*(bash|sh)\b
  unless:
  - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
- for:
  - github-actions
  id: gha-wget-pipe-installer
  desc: wget getter-host root piped to shell
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: wget\b[^|]{0,160}//(get|install|setup)[\w.-]*/?\s*\|\s*(bash|sh)\b
composite_rules:
- for:
  - github-actions
  - shell
  id: gha-recognized-pipe-installer
  desc: Installer endpoint or shell-pipe markers
  unless:
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
  any:
  - id: micro-behaviors/os/package-manager/installer-script::gha-golangci-pipe-installer
  - id: micro-behaviors/os/package-manager/installer-script::gha-apm-pipe-installer
  - id: micro-behaviors/process/create/shell/pipeline::rustup-installer-pipe
  - id: micro-behaviors/os/package-manager/installer-script::gha-nodesource-pipe-installer
  - id: micro-behaviors/os/package-manager/installer-script::gha-cargo-binstall-pipe-installer
  - id: micro-behaviors/os/package-manager/installer-script::gha-chainloop-pipe-installer
  - id: micro-behaviors/os/package-manager/installer-script::gha-dagger-pipe-installer
  - id: micro-behaviors/os/package-manager/installer-script::gha-curl-pipe-installer
  - id: micro-behaviors/os/package-manager/installer-script::gha-wget-pipe-installer
  - id: micro-behaviors/os/package-manager/installer-script::pyenv-installer-pipe
  - id: micro-behaviors/os/package-manager/installer-script::install-sh-url-near-shell-pipe
  - id: micro-behaviors/os/package-manager/installer-script::elan-installer-pipe
  - id: micro-behaviors/os/package-manager/installer-script::elan-github-raw-installer-pipe
  - id: micro-behaviors/os/package-manager/installer-script::karajan-code-posix-installer-header
