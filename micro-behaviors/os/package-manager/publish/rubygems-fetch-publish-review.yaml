defaults:
  platforms: [windows, unix]
  for: [ruby, gem]

composite_rules:
  - id: rubygems-fetch-build-publish
    desc: Fetch, gem build and RubyGems push
    crit: suspicious
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/format/credentials::rubygems-api-token-shaped-text
      - id: micro-behaviors/communications/http/lib/netlib::net-http-get
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
      - id: micro-behaviors/os/package-manager/publish::rubygems-push-system-call
    any:
      - id: micro-behaviors/os/package-manager/run::rubygems-build-system-call
      - id: micro-behaviors/data/archive/create/package::gem-package-build-call
  - id: embedded-rubygems-credential-publish
    desc: RubyGems credential write and gem push
    crit: suspicious
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/format/credentials::rubygems-api-token-shaped-text
      - id: micro-behaviors/fs/write/credential::ruby-writes-rubygems-credentials
      - id: micro-behaviors/os/env/write::ruby-assigns-home-environment
      - id: micro-behaviors/os/package-manager/publish::rubygems-push-system-call
  - id: rubygems-direct-api-publish
    desc: RubyGems token and gem API upload clues
    crit: suspicious
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/format/credentials::rubygems-api-token-shaped-text
      - id: micro-behaviors/communications/http/services/registry::rubygems-api-v1-gems-path
      - id: micro-behaviors/communications/http/post::ruby-octet-stream-post
      - id: micro-behaviors/fs/read/file/content/bytes::ruby-file-binread-content
  - id: rubygems-fetch-build-api-publish
    desc: Fetch and gem API publish clues
    crit: suspicious
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/package-manager/publish::rubygems-direct-api-publish
      - id: micro-behaviors/communications/http/lib/netlib::net-http-get
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
      - id: metadata/package/config/manifest::gemspec-name-assignment
  - id: rubygems-token-rebuild-upload
    desc: Gem token, build and HTTP POST clues
    crit: suspicious
    conf: 0.98
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/format/credentials::rubygems-api-token-shaped-text
      - id: micro-behaviors/os/package-manager/run::rubygems-build-system-call
      - id: micro-behaviors/communications/http/post::ruby-octet-stream-post
  - id: rubygems-generated-package-fetch-publish
    desc: Fetch, generated gem name and publish clues
    crit: suspicious
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/lib/netlib::net-http-get
      - id: metadata/package/config/manifest::gemspec-interpolated-name
      - id: micro-behaviors/data/archive/create/package::gem-package-build-call
    any:
      - id: micro-behaviors/communications/http/services/registry::rubygems-api-v1-gems-path
      - id: micro-behaviors/os/package-manager/publish::rubygems-push-system-call
  - id: packaged-rubygems-republisher
    desc: RubyGem builds and publishes another gem
    crit: suspicious
    conf: 0.98
    for: [gem, tar, zip, pkginfo, ruby]
    scope: outer
    all:
      - id: metadata/package/ecosystem::rubygems-spec-yaml-marker
      - id: metadata/package/config/manifest::gemspec-name-assignment
      - id: micro-behaviors/os/package-manager/run::rubygems-build-system-call
      - id: micro-behaviors/os/package-manager/publish::rubygems-push-system-call
