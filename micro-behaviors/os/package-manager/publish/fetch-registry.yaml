defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: javascript-pypi-upload-request
    desc: Calls PyPI package upload endpoint
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 0
        kind: string
        exact: https://upload.pypi.org/legacy/
  - id: javascript-rubygems-upload-request
    desc: Calls RubyGems package publication endpoint
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 0
        kind: string
        exact: https://rubygems.org/api/v1/gems
