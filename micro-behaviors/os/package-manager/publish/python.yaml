# The Python distribution publish step. twine is the canonical PyPI upload
# client, and reading a registry token to feed it is the client's ordinary
# operation — `TWINE_PASSWORD` and `TWINE_REPOSITORY_URL` exist only for that
# upload, and PyPI's OIDC mint-token endpoint is trusted-publisher
# infrastructure. Credential atoms that key on registry-token reads use this
# context to separate publishing tools from harvesters.
defaults:
  platforms: [unix, windows]
  for: [python, shell, batch, powershell, github-actions, text, data]
  crit: notable
  conf: 0.9

traits:
  # `twine upload` already has an atom in release-pipeline.yaml.

  - id: twine-credential-env
    desc: Twine credential environment reference
    # These variables exist solely as twine upload inputs; a file that names
    # them is implementing or configuring the publish step.
    if:
      type: text
      regex: '\bTWINE_(PASSWORD|USERNAME|REPOSITORY_URL)\b'

  - id: pypi-trusted-publisher-mint-endpoint
    desc: PyPI trusted-publisher mint-token endpoint
    if:
      type: text
      substr: pypi.org/_/oidc/github/mint-token
