defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
traits:
  - id: package-artifact-publish-helper-reference
    desc: Package artifact publish helper name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bpublish(Repacked|Modified|Tarball)\b'

  - id: package-artifact-republish-helper-reference
    desc: Package artifact republish helper name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\brepublish(Repacked|Modified|Tarball)\b'

composite_rules:
  - id: package-artifact-publication-helper-reference
    desc: Package artifact publication helper reference
    crit: notable
    conf: 0.95
    any:
      - id: package-artifact-publish-helper-reference
      - id: package-artifact-republish-helper-reference
