# RubyGems publishing invocations. These are neutral release mechanics; the
# supply-chain objectives that consume them add data-staging or credential
# evidence before assigning malicious intent.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 0.96
  attack: T1059

traits:
  - id: rubygems-push-system-call
    desc: Ruby system call publishes a gem
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        kind: string
        regex: '^gem\s+push\s+\S+\.gem(?:\s|$)'

