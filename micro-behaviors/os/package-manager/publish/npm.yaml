defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # Relocated from objectives/supply-chain/hidden-payload/worm/, for the same
  # reason package-manifest-version-bump was: the matcher reads a
  # publish-permission flag by name, and "may this user publish?" is asked by
  # release tooling, CMS article workflows and any UI with a publish button --
  # an npm package's CRM/knowledge-base templates matched on a `canPublish`
  # prop. The worm intent comes from pairing it with writable-package
  # enumeration and lifecycle-hook rewriting in the composite there.
  - id: publish-permission-flag
    desc: Publish-permission flag reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '(?i)\b(can[_-]?publish|publish[_-]?permission)\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: npm-publish-call
    desc: Parsed npm package publish call
    # Release helpers commonly invoke npm from shell scripts; keep this atom
    # on the command itself rather than limiting it to JavaScript source.
    for: [javascript, typescript, shell]
    if:
      type: symbol
      kind: call
      exact: npm
      arg:
        kind: identifier
        name: publish

  - id: npm-publish-command-line
    desc: Shell or workflow npm publish command
    for: [shell, github-actions]
    if:
      type: text
      regex: '(?m)^\s*(-\s*)?(run:\s*[>|-]?\s*)?npm\s+publish(\s|$)'

  - id: js-npm-publish-argv
    desc: Node child process invokes npm publish
    conf: 0.97
    if:
      type: text
      regex: '\b(execFile(Sync)?|spawn(Sync)?)\s*\(\s*["'']npm(\.cmd)?["'']\s*,\s*\[\s*["'']publish["'']'

  # `exec`/`execSync` take a whole command line as one string, so the array
  # forms above miss them entirely -- `exec("npm publish --access public")` is
  # the spelling a script reaches for when it shells out rather than building an
  # argv. Same behaviour, different call shape.
  - id: js-npm-publish-exec-string
    desc: Node exec runs an npm publish command
    conf: 0.96
    if:
      type: text
      regex: '\bexec(Sync)?\s*\(\s*["''`][^"''`]{0,60}npm\s+publish\b'

  - id: js-npm-publish-args-array
    desc: Assigns npm publish to an args array
    conf: 0.95
    if:
      type: text
      regex: '\bargs\s*=\s*\[\s*["'']publish["'']'

  - id: js-npm-invoke-with-args-array
    desc: Passes args array to npm process call
    conf: 0.95
    if:
      type: text
      regex: '\b(execFile|spawn)(Sync)?\s*\(\s*(\bNPM_BIN\b|["'']npm(\.cmd)?["''])\s*,\s*args\b'

  - id: python-npm-publish-run-argv
    desc: Python subprocess run invokes npm publish
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '\bsubprocess\.(run|call|Popen)\s*\(\s*\[\s*["'']npm(\.cmd)?["'']\s*,\s*["'']publish["'']'

  - id: python-npm-publish-check-argv
    desc: Python checked subprocess invokes npm publish
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: '\bsubprocess\.check_(call|output)\s*\(\s*\[\s*["'']npm(\.cmd)?["'']\s*,\s*["'']publish["'']'

  # Bumping the version field of a package manifest is an ordinary release step
  # — `npm version`, gulp-bump, semantic-release and hand-rolled release tasks
  # all do it (it fires on estraverse's gulpfile release task, bundled in the
  # Heroku CLI). It is only worm-shaped when paired with writable-package
  # enumeration, lifecycle rewriting and republication, which is what the
  # npm-package-propagation-worm composite in objectives/supply-chain requires.
  # Requiring a call, not the bare word, keeps prose like the comment
  # "bump the version number in those files" from matching.
  - id: package-manifest-version-bump
    desc: Updates a package manifest version field
    conf: 0.94
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '(?is)package(Json|_json|\.json).{0,120}version.{0,80}(increment|bump)[A-Za-z0-9_]*\('
    unless:
      - id: well-known/lib/core/process-bot::process-bot-rubygems-release-context

  - id: npm-variable-description-package
    desc: Builds package with variable description
    conf: 0.85
    if:
      type: text
      regex: '\{\s*name:\s*\w+,\s*version,\s*description,\s*license:'

  - id: npm-binary-data-package-construction
    desc: Builds npm package containing binary data
    conf: 0.96
    if:
      type: text
      regex: 'writeFileSync\([^)]{0,100}[/\\]data\.bin'

composite_rules:
  - id: js-npm-publish-variable-argv
    desc: Builds and invokes npm publish argument vector
    crit: notable
    conf: 0.95
    all:
      - id: js-npm-publish-args-array
      - id: js-npm-invoke-with-args-array
    near_bytes: 600

  - id: npm-publish-command
    desc: Invokes npm package publish
    crit: notable
    conf: 0.9
    any:
      - id: npm-publish-call
      - id: npm-publish-command-line
      - id: js-npm-publish-argv
      - id: js-npm-publish-variable-argv
      - id: js-npm-publish-exec-string
      - id: python-npm-publish-run-argv
      - id: python-npm-publish-check-argv
