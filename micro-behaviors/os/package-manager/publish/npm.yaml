defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: npm-publish-call
    desc: Parsed npm package publish call
    # Release helpers commonly invoke npm from shell scripts; keep this atom
    # on the command itself rather than limiting it to JavaScript source.
    for: [javascript, typescript, shell]
    if:
      type: symbol
      kind: call
      exact: npm
      arg:
        kind: identifier
        name: publish

  - id: npm-publish-command-line
    desc: Shell or workflow npm publish command
    for: [shell, github-actions]
    if:
      type: text
      regex: '(?m)^\s*(-\s*)?(run:\s*[>|-]?\s*)?npm\s+publish(\s|$)'

  # Bumping the version field of a package manifest is an ordinary release step
  # — `npm version`, gulp-bump, semantic-release and hand-rolled release tasks
  # all do it (it fires on estraverse's gulpfile release task, bundled in the
  # Heroku CLI). It is only worm-shaped when paired with writable-package
  # enumeration, lifecycle rewriting and republication, which is what the
  # npm-package-propagation-worm composite in objectives/supply-chain requires.
  # Requiring a call, not the bare word, keeps prose like the comment
  # "bump the version number in those files" from matching.
  - id: package-manifest-version-bump
    desc: Updates a package manifest version field
    conf: 0.94
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '(?is)package(Json|_json|\.json).{0,120}version.{0,80}(increment|bump)[A-Za-z0-9_]*\('
    unless:
      - id: well-known/lib/core/process-bot::process-bot-rubygems-release-context

  - id: npm-variable-description-package
    desc: Builds package with variable description
    conf: 0.85
    if:
      type: text
      regex: '\{\s*name:\s*\w+,\s*version,\s*description,\s*license:'

  - id: npm-binary-data-package-construction
    desc: Builds npm package containing binary data
    conf: 0.96
    if:
      type: text
      regex: 'writeFileSync\([^)]{0,100}[/\\]data\.bin'

composite_rules:
  - id: npm-publish-command
    desc: Invokes npm package publish
    crit: notable
    conf: 0.9
    any:
      - id: npm-publish-call
      - id: npm-publish-command-line
