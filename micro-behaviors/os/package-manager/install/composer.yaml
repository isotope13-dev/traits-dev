# Composer (PHP) install-lifecycle surfaces referenced from code rather than
# declared in a manifest. The manifest-side facts (`scripts.post-install-cmd`
# and friends) are parsed value reads and live in metadata/package/scripts/;
# these atoms cover the same event names appearing in PHP source or in a phar,
# which is what Composer itself and any package that wires up the hook do.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9
  attack: T1195.002

traits:
  # Names the event Composer fires after `composer install` completes. A
  # package that references it is registering (or dispatching) install-time
  # code. Neutral on its own — Composer's own phar defines the constant —
  # so intent comes from what the referencing composite adds.
  - id: composer-post-install-cmd-event
    desc: References the Composer post-install-cmd event
    if:
      type: text
      substr: post-install-cmd

  - id: composer-post-update-cmd-event
    desc: References the Composer post-update-cmd event
    if:
      type: text
      substr: post-update-cmd
