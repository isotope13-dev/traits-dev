defaults:
  platforms: [windows]
  for: [batch, powershell, python, javascript, typescript, rust, cpp, csharp]
  crit: notable
  conf: 0.96

traits:
  - id: msiexec-ssl-webdav-install
    desc: msiexec installs from SSL WebDAV path
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bmsiexec(\.exe)? +/i +"?\\{2}[^\s"\\]{1,180}@SSL\\'

  - id: msiexec-ssl-webdav-install-literal
    desc: Installer literal targets SSL WebDAV path
    for: [python, javascript, typescript, rust, cpp, csharp]
    if:
      type: literal
      regex: '(?i)\bmsiexec\b(\.exe)? +/i +"?\\{2}[^\s"\\]{1,180}@SSL\\'

composite_rules:
  - id: ssl-webdav-install-command
    desc: Installer command targets SSL WebDAV UNC path
    any:
      - id: msiexec-ssl-webdav-install
      - id: msiexec-ssl-webdav-install-literal
