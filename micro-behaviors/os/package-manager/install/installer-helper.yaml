defaults:
  crit: notable
  conf: 0.95
  for:
  - shell
  platforms:
  - linux
traits:
- id: shell-apt-install-invocation
  desc: Shell invokes installer package helper
  if:
    type: symbol
    kind: call
    regex: ^(apt-install|"apt-install"|'apt-install')$
  unless:
  - type: symbol
    kind: function
    exact: apt-install
  - id: "metadata/lang/source/shape::shell-parser-recovery-node"
