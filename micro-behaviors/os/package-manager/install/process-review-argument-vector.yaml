defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

composite_rules:
  - id: node-spawn-global-skills-add-arguments
    desc: Spawn arguments select global skill addition
    near_bytes: 1
    all:
      - id: micro-behaviors/process/argument/positional::node-spawn-skills-package-argument
      - id: micro-behaviors/process/argument/positional::node-spawn-add-action-argument
      - id: micro-behaviors/process/argument/option::node-spawn-global-option-argument

  - id: node-spawn-global-skills-add
    desc: Child-process spawn has global skill arguments
    all:
      - id: micro-behaviors/os/package-manager/install::node-spawn-global-skills-add-arguments
      - id: metadata/import/builtin::require-child-process
