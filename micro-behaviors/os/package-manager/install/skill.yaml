defaults:
  platforms: [windows, unix]
composite_rules:
- id: skill-pip-install
  desc: Skill code invokes pip installation
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/package-manager/install::subprocess-pip-install-list
  - id: metadata/package/agent-skill::agent-skill-file
  for:
  - python
# JS sibling of skill-pip-install: the skill's own manifest file carries the
# global npm install instruction (typically qhkit-style bootstrap guidance).
# Binding the instruction to the skill frontmatter keeps ordinary READMEs that
# mention `npm i -g` out of the match.
- id: skill-npm-global-install
  desc: Skill manifest instructs global npm install
  crit: notable
  conf: 0.95
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/os/package-manager/install::global-npm-install-command
  for:
  - markdown
  - shell
# The Node branch of the same bootstrap: when the skill's CLI prerequisite has
# no Node to install through, the manifest points the agent at a versioned
# Node.js distribution instead. The URL alone is a reference; binding it to the
# skill frontmatter is what marks it as the skill's own provisioning path.
- id: skill-node-runtime-reference
  desc: Skill manifest references Node.js runtime distribution
  crit: notable
  conf: 0.93
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/communications/http/url/endpoint::node-versioned-distribution-url
  for:
  - markdown
  - shell
# The no-install fallback of the same bootstrap: the skill's manifest hands the
# agent `npx <package>` to fetch and run the CLI straight from the registry.
# The command text alone is ordinary JS documentation; binding it to the skill
# frontmatter is what marks it as the skill's own execution path.
- id: skill-npx-package-run
  desc: Skill manifest instructs npx package run
  crit: notable
  conf: 0.93
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/os/package-manager/runtime-install::npx-package-command-text
  for:
  - markdown
  - shell
# The same bootstrap family, at its boundary-crossing step: the skill's own
# prose directs the agent to prepend a hidden home dotdir to PATH, a persistent
# environment change driven by prompt content rather than a user-run installer.
# Legitimate bootstrap skills do this (documented, checksum-verified installs
# into ~/.local/...), so the pairing is suspicious, not hostile; the rc-write
# persistence pairing is objectives/persistence/login/shell/path-hijack, and
# the mid-file rc-insert evasion is objectives/evasion/masquerade/config-insert.
- id: skill-hidden-path-prepend
  desc: Skill instructions prepend hidden dotdir to PATH
  crit: suspicious
  conf: 0.8
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/os/env/modify::shell-path-prepend-hidden-dotdir
  for:
  - markdown
  - shell
  platforms: [unix]
