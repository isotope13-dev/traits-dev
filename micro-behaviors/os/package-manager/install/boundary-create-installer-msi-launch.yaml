defaults:
  platforms: [windows]
  for: [oledoc, msi]
  attack: "T1204.002"
  conf: 0.92
traits:
  - id: lnk-msiexec-quiet-install
    desc: LNK invokes quiet MSI installation
    crit: notable
    conf: 0.97
    attack: T1218.007
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bmsiexec(\.exe)?\s+/i\b.{0,160}\s+/qn\b'
