defaults:
  platforms: [windows, unix]
  for:
    - python
    - shell
  mbc: C0002
traits:
  - id: jvm-pip-install-command
    desc: JVM code invokes pip install
    crit: notable
    conf: 0.9
    for: [class, java_class, java]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)\bpip3?\s+install\b'
  - id: pip-replace-package-command
    desc: pip replaces a package with an upgrade
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?is)\bpip(3)?\s+uninstall\b.{0,260}\bpip(3)?\s+install\s+-U\b'
  - id: subprocess-pip-install-list
    desc: Subprocess argument list invokes pip install
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'subprocess\.[a-z_]+\(\s*\[[^\]]{0,360}\bpip\b[^\]]{0,160}\binstall\b'
    unless:
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: python-pip-module-command
    desc: Python call receives pip install command
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(subprocess\.[a-z_]+|os\.(system|popen))$'
      arg:
        kind: string
        regex: '\bpython(3(\.\d+)?)?\s+-m\s+pip3?\s+install\b'
    unless:
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: python-runtime-pip-install
    desc: Python invokes pip module install
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(sys\.executable.{0,120}-m.{0,24}|["'']-m["'']\s*,\s*)["'']?pip["'']?.{0,24}install'
  - id: python-uv-pip-install-command
    desc: Python invokes uv pip install
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'asyncio\.create_subprocess_exec\s*\(\s*["'']uv["'']\s*,\s*["'']pip["'']\s*,\s*["'']install["'']'
  - id: pip-main-install
    desc: Direct pip.main(['install', ...]) call
    crit: notable
    conf: 0.85
    for:
      - python
    if:
      type: string_literal
      regex: pip\.main\(\[.{0,50}install
  - id: ensurepip-bootstrap
    desc: Calls ensurepip to bootstrap pip
    crit: notable
    conf: 0.98
    for:
      - python
    if:
      type: symbol
      kind: call
      exact: ensurepip.bootstrap
  - id: requirements-check-call
    desc: Calls requirements-check helper
    crit: notable
    conf: 0.7
    for: [python]
    if:
      type: symbol
      exact: check_requirements
  - id: python-legacy-dependency-link-url
    desc: Python legacy dependency link URL
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      # The URL has to sit inside the list. A list comprehension assigned to
      # dependency_links, followed by setup(url="https://..."), is the project's
      # homepage, not a direct dependency.
      regex: 'dependency_links\s*=\s*\[[^\]]{0,500}https?://'
  - id: os-system-pip-install-requests
    desc: os.system pip install requests
    for: [python]
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'os\.system\(\s*["'']pip install requests["'']\s*\)'
  - id: subprocess-pip-install-string
    desc: subprocess call passes a pip install string
    for: [python]
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.[a-z_]+$'
      arg:
        kind: string
        substr: pip install
  - id: os-system-pip-install
    desc: os.system runs pip install
    for: [python]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.system\(\s*["''][^"'']{0,220}\bpip\b[^"'']{0,120}\binstall\b'
    unless:
      - id: micro-behaviors/os/package-manager/install::os-system-pip-install-requests
  - id: break-system-packages-literal
    desc: "--break-system-packages string literal"
    for: [python]
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      exact: --break-system-packages
composite_rules:
  - id: pip-installation
    desc: Python package installation via pip
    for: [python, shell, text, markdown]
    crit: notable
    conf: 0.8
    any:
      - id: pip-main-install
      - id: ensurepip-bootstrap
      - id: subprocess-pip-install-list
      - id: python-pip-module-command
      - id: python-runtime-pip-install
      - id: python-uv-pip-install-command
      - id: metadata/lang/source/syntax/call/arguments::pip-requirements-wrapper-call
      - id: micro-behaviors/os/package-manager/reference-install::pip-install-cli-text
  - id: subprocess-pip-install-call
    desc: Runtime pip install via subprocess
    for: [python]
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/package-manager/install::subprocess-pip-install-list
      - id: micro-behaviors/os/package-manager/install::subprocess-pip-install-string
