# Editor extension installation through an IDE's command-line interface.
#
# `code --install-extension <file|id>` (and the identical CLI shipped by every
# VS Code fork: code-insiders, codium/vscodium, cursor, windsurf, positron) is
# the supported way to add an extension without the marketplace UI.  Devcontainer
# setup scripts and CI images use it legitimately, so the bare flag is a neutral
# package-management capability; objectives compose it with payload retrieval or
# multi-editor enumeration.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, batch, powershell, python, json, package.json]
  crit: notable

traits:
  - id: ide-cli-install-extension-flag
    desc: Installs an editor extension via the CLI
    conf: 0.95
    attack: T1059
    if:
      type: text
      substr: "--install-extension"

  # `--force` skips the "install this extension?" confirmation and silently
  # overwrites an already-installed extension of the same id.
  - id: ide-cli-install-extension-forced
    desc: Force-installs an editor extension silently
    conf: 0.93
    attack: T1059
    if:
      type: text
      regex: '--install-extension[\s\S]{0,200}--force'

  # The inline form catches short, adjacent fragments.
  - id: ide-cli-install-extension-obfuscated-inline
    desc: Builds inline forced extension install
    conf: 0.92
    attack: T1059
    if:
      type: text
      regex: '(?i)(nstal|install)[\s\S]{0,96}(ensio|extension)[\s\S]{0,120}(orce|force)'

  # In larger bundles the same flag is split around decoder calls. Keep the
  # fragments separate so their relationship can be constrained with
  # near_bytes rather than an expensive wide regular expression.
  - id: ide-cli-install-extension-prefix
    desc: Builds an extension install flag prefix
    conf: 0.9
    attack: T1059
    if:
      type: text
      regex: '["'']--ins["'']\s*\+[\s\S]{0,120}["'']exten["'']'

  - id: ide-cli-install-extension-force-suffix
    desc: Builds a forced extension install suffix
    conf: 0.9
    attack: T1059
    if:
      type: text
      # Common js-obfuscator splits of "--install-extension ... --force".
      regex: '["''](l-ext|tal-ext|all-ext|stall)["'']\s*\+[\s\S]{0,220}["'']orce["'']'

  # Some bundles decode the first and last flag fragments separately from the
  # rest of the CLI strings.  These are neutral components; the nearby pair
  # below is the install-specific observation.
  - id: ide-cli-install-extension-token-fragment
    desc: Builds split extension-install token
    crit: component
    conf: 0.9
    attack: T1059
    if:
      type: text
      regex: '["'']exten["'']\s*\+'

  - id: ide-cli-install-force-token-fragment
    desc: Builds split force flag
    crit: component
    conf: 0.9
    attack: T1059
    if:
      type: text
      regex: '["'']--for["'']\s*\+\s*["'']ce["'']'

  # A string-splitting obfuscator cuts `--install-extension` at whatever offset
  # its chunk size lands on, so the flag never appears as one token. Two
  # adjacent quoted fragments that spell the word across the cut are the
  # chunk-size-independent tell: no hand-written source concatenates
  # `"l-ext"` with `"ensio"`.
  - id: ide-cli-install-extension-word-split
    desc: Splits install-extension flag mid-word
    conf: 0.94
    attack: T1059
    if:
      type: text
      regex: '["''](l-ext|ll-ex)["'']\s*\+\s*["''](ensio|xtens)'

  # A decoder can leave the option as several short literals.  Requiring all
  # four fragments below keeps each atom useful on its own while the composite
  # proves that they reconstruct a forced install command in one file region.
  - id: ide-cli-install-extension-fragment-start
    desc: Contains split install command fragment
    crit: component
    conf: 0.88
    attack: T1059
    if:
      type: string_literal
      exact: nstal
  - id: ide-cli-install-extension-fragment-middle
    desc: Contains split extension flag fragment
    crit: component
    conf: 0.88
    attack: T1059
    if:
      type: string_literal
      exact: l-ext
  - id: ide-cli-install-extension-fragment-force
    desc: Contains split force flag fragment
    crit: component
    conf: 0.88
    attack: T1059
    if:
      type: string_literal
      exact: --for

  # An extension package pulled straight off the network, rather than resolved
  # through a marketplace client.
  - id: vsix-package-download-url
    desc: URL points at a .vsix extension package
    conf: 0.9
    attack: T1105
    mbc: E1105
    if:
      type: text
      regex: 'https?://[^\s''"<>]{1,150}\.vsix\b'

  # The local half of the same observation: a `.vsix` filename or path literal,
  # i.e. an extension package handled as a file rather than a marketplace id.
  # Extension build tooling (vsce, CI publish steps) does this legitimately;
  # the `not:` keeps this disjoint from the URL trait above.
  - id: vsix-package-file-literal
    desc: Names a .vsix extension package file
    conf: 0.9
    attack: T1105
    mbc: E1105
    if:
      type: text
      regex: '["''][^"''\s]{0,64}\.vsix["'']'
    not:
      - regex: 'https?://'

  # Native helpers retain the editor CLI tokens as ordinary strings. These
  # are capabilities only; the dropper objective combines them with release
  # retrieval and process creation.
  - id: native-ide-cli-install-extension-flag
    desc: Native binary has extension install flag
    crit: notable
    conf: 0.95
    attack: T1059
    for: [pe, macho]
    if:
      type: text
      regex: '(?i)--install-extension'
  - id: native-ide-cli-force-flag
    desc: Native binary has exact --force CLI flag
    crit: component
    conf: 0.9
    for: [pe, macho]
    if:
      type: text
      # Do not treat Chrome-style feature flags such as --force-fieldtest as
      # an editor's standalone --force option.
      regex: '(?i)(^|[^A-Za-z0-9_-])--force([^A-Za-z0-9_-]|$)'

composite_rules:
  - id: native-ide-cli-force-install
    desc: Native binary force-installs an extension
    crit: notable
    conf: 0.94
    attack: T1059
    for: [pe, macho]
    near_bytes: 4096
    all:
      - id: native-ide-cli-install-extension-flag
      - id: native-ide-cli-force-flag

  - id: ide-cli-install-extension-obfuscated-fragments
    desc: Builds split forced extension install
    crit: notable
    conf: 0.93
    near_bytes: 1300
    all:
      - id: ide-cli-install-extension-prefix
      - id: ide-cli-install-extension-force-suffix

  - id: ide-cli-install-extension-obfuscated-deep-fragments
    desc: Builds extension-install and force flags from split fragments
    crit: notable
    conf: 0.95
    near_bytes: 800
    all:
      - id: ide-cli-install-extension-token-fragment
      - id: ide-cli-install-force-token-fragment

  - id: ide-cli-install-extension-obfuscated
    desc: Builds split-string extension install
    crit: notable
    conf: 0.94
    any:
      - id: ide-cli-install-extension-obfuscated-inline
      - id: ide-cli-install-extension-obfuscated-fragments
      - id: ide-cli-install-extension-obfuscated-deep-fragments
      - id: ide-cli-install-extension-word-split
      - id: ide-cli-install-extension-obfuscated-literals

  - id: ide-cli-install-extension-obfuscated-literals
    desc: Reassembles split forced extension install literals
    crit: notable
    conf: 0.96
    near_bytes: 1300
    all:
      - id: ide-cli-install-extension-fragment-start
      - id: ide-cli-install-extension-fragment-middle
      - id: ide-cli-install-extension-fragment-force
      - id: ide-cli-install-force-token-fragment
