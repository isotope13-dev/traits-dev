composite_rules:
- for:
  - python
  crit: notable
  id: python-import-fallback-pip
  desc: Import-error handler with pip installation code
  conf: 0.9
  near_lines: 40
  all:
  - id: micro-behaviors/data/control-flow/error-handling::python-import-error-handler
  any:
  - id: micro-behaviors/os/package-manager/install::subprocess-pip-install-call
  - id: micro-behaviors/os/package-manager/install::os-system-pip-install
  - id: micro-behaviors/os/package-manager/install::pip-main-install
- for:
  - javascript
  - typescript
  - package.json
  - npm
  id: npm-hook-system-install-code
  desc: Postinstall hook with sudo system-install commands
  crit: notable
  conf: 0.97
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/os/package-manager/reference-install::system-package-install-command-text
  - id: micro-behaviors/os/privilege/elevation::sudo-command-string
defaults:
  platforms:
  - windows
  - unix
