defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
traits:
  # Office documents rarely need to start an unattended Windows Installer
  # transaction.  The same text in an MSI database is a helper script the
  # installer carries, comparable to the batch and VBScript quiet-install
  # observations, so the MSI system tables lower it to notable.
  - id: msiexec-quiet-install
    desc: Document text runs quiet msiexec install
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: (?i)msiexec(.{0,32})/q
    downgrade:
      any:
        - id: metadata/package/files/msi/identity::msi-database-system-tables
