defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - elf
    - shell
traits:
  - id: global-npm-install-command
    desc: Global npm package installation command text
    crit: notable
    conf: 0.93
    platforms: [unix, windows]
    # markdown: agent skills carry npm install guidance in bash fences, and a
    # SKILL.md member may be typed markdown or shell by content heuristics.
    for: [shell, dockerfile, github-actions, markdown]
    if:
      type: text
      regex: '(?i)\bnpm\s+(install|i)\b[^\n;&|]{0,180}\s(-g|--global)\b'
  # The floating-version facet of the same command text: the spec resolves to
  # whatever the registry serves at install time, so neither the skill text nor
  # a version diff can vouch for the code that actually runs. Distinct claim
  # from global-npm-install-command (scope -g vs version spec); both may fire
  # on one command.
  - id: npm-install-latest-tag-command-text
    desc: npm install command text with @latest tag
    crit: notable
    conf: 0.93
    platforms: [unix, windows]
    for: [shell, dockerfile, github-actions, markdown]
    if:
      type: text
      regex: '(?i)\bnpm\s+(install|i)\b[^\n;&|]{0,180}@latest\b'
  - id: build-npm-install
    desc: Build installs local npm dependencies
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [dockerfile, github-actions]
    if:
      type: text
      regex: '\bnpm[ \t]+install\b'
    unless:
      - id: global-npm-install-command
  - id: apt-get-install-cmd
    desc: apt-get install command
    crit: notable
    conf: 0.75
    for: [shell]
    if:
      type: tree-sitter
      kind: call
      regex: '^(sudo[ \t]+)?apt-get([ \t]+-[^ \t]{1,40}){0,3}[ \t]+install\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - type: basename
        regex: '(?i)^(readme|metadata|pkg-info)(\.|$)'
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: micro-behaviors/os/package-manager/reference-install::gha-apt-get-install-cmd
  - id: javascript-apt-get-install-argv
    desc: JavaScript apt-get install argv
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[[^\]\n]{0,100}["'']apt-get["'']\s*,\s*["'']install["'']'
  - id: apt-install-cmd
    desc: References an apt install command
    crit: notable
    conf: 0.75
    for: [shell, python]
    if:
      type: text
      regex: '(?im)(^|[;&|`"''\(\s])(sudo[ \t]+)?apt install\s+\S+'
    not:
      - substr: doover-pydoover
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
      - type: basename
        regex: '(?i)^(readme|metadata|pkg-info)(\.|$)'
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: micro-behaviors/os/package-manager/reference-install::gha-apt-install-cmd
  - id: yum-install-cmd
    desc: Installs a package with yum
    crit: notable
    conf: 0.75
    for: [shell]
    if:
      type: tree-sitter
      kind: call
      regex: '^(sudo[ \t]+)?yum([ \t]+-[^ \t]{1,40}){0,3}[ \t]+install\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: basename
        regex: '(?i)^(readme|metadata|pkg-info)(\.|$)'
      - id: micro-behaviors/os/package-manager/reference-install::gha-yum-install-cmd
  - id: yum-install-y-cmd
    desc: Installs a package non-interactively with yum
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: yum -y install
    unless:
      - type: basename
        regex: '(?i)^(readme|metadata|pkg-info)(\.|$)'
      - id: micro-behaviors/os/package-manager/reference-install::gha-yum-install-y-cmd
  - id: dnf-install-cmd
    desc: dnf install command
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?m)^(sudo )?dnf install|[;&|](sudo )?dnf install'
    unless:
      - type: basename
        regex: '(?i)^(readme|metadata|pkg-info)(\.|$)'
      - id: micro-behaviors/os/package-manager/reference-install::gha-dnf-install-cmd
  - id: dnf-install-y-cmd
    desc: dnf -y install command
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?m)^(sudo )?dnf -y install|[;&|](sudo )?dnf -y install'
    unless:
      - type: basename
        regex: '(?i)^(readme|metadata|pkg-info)(\.|$)'
      - id: micro-behaviors/os/package-manager/reference-install::gha-dnf-install-y-cmd
  - id: bsd-package-command-set
    desc: BSD package manager command set
    crit: notable
    conf: 0.85
    platforms: [unix]
    for: [shell, python, javascript, typescript, kotlin]
    if:
      type: text
      regex: 'pkg_add[\s\S]{0,180}pkg_delete[\s\S]{0,180}pkg_info'
composite_rules:
  - id: apt-get-install
    desc: apt-get package installation command
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/os/package-manager/reference-install::apt-get-install-cmd-binary-text
      - id: apt-get-install-cmd
      - id: apt-install-cmd
  - id: yum-install
    desc: yum package installation command
    crit: notable
    conf: 0.75
    any:
      - id: micro-behaviors/os/package-manager/reference-install::yum-install-cmd-binary-text
      - id: yum-install-cmd
      - id: yum-install-y-cmd
  - id: dnf-install
    desc: dnf package installation command
    crit: notable
    conf: 0.75
    any:
      - id: dnf-install-cmd
      - id: dnf-install-y-cmd
