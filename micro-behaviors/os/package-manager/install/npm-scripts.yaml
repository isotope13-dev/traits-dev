# Inspect individual script values, never the serialized scripts object.
# Command separators and package-token boundaries prevent pull-request matches.
defaults:
  platforms: [windows, unix]
  for: [package.json]
  crit: notable
  conf: 0.9
traits:
  - id: npm-script-install-axios
    desc: npm script installs axios
    if:
      type: value
      path: scripts[*]
      regex: '\bnpm\s+(i|install|add)\s+([^;&|\s]+\s+){0,12}axios($|[@\s;&|])'
  - id: npm-script-install-request
    desc: npm script installs request
    if:
      type: value
      path: scripts[*]
      regex: '\bnpm\s+(i|install|add)\s+([^;&|\s]+\s+){0,12}request($|[@\s;&|])'
  - id: npm-script-install-sqlite3
    desc: npm script installs sqlite3
    if:
      type: value
      path: scripts[*]
      regex: '\bnpm\s+(i|install|add)\s+([^;&|\s]+\s+){0,12}sqlite3($|[@\s;&|])'
  - id: npm-script-install-socket-io-client
    desc: npm script installs socket.io-client
    if:
      type: value
      path: scripts[*]
      regex: '\bnpm\s+(i|install|add)\s+([^;&|\s]+\s+){0,12}socket\.io-client($|[@\s;&|])'
