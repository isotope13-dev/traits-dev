defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable

traits:
  - id: shell-npm-install-call
    desc: Shell invokes npm package installation
    if:
      type: symbol
      kind: call
      exact: npm
      arg:
        index: 0
        kind: identifier
        name_regex: '^(install|i|add)$'
