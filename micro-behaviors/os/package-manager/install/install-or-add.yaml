defaults:
  platforms: [unix, windows]
traits:
  - id: package-manager-install-or-add-command
    desc: Package-manager install or add command
    crit: notable
    for: [shell, powershell]
    if:
      type: text
      regex: '(?im)^\s*(npm|pnpm|yarn|bun)\b.{0,60}\b(add|install|i)\s+[A-Za-z0-9@._/-]{1,120}'
