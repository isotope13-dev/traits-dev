# Advpack setup execution entry points (provider side).
#
# advpack.dll and IEAdvpack.dll implement INF-driven software installation;
# rundll32 targets their exported setup entries (LaunchINFSection*,
# RunSetupCommand, ExecuteCab*). A binary that EXPORTS these entries provides
# the setup engine itself, so the INF section vocabulary it embeds
# (DefaultInstall, RunPreSetupCommands, ...) is the engine's documented input
# language rather than a crafted attack INF. Callers that merely invoke these
# entries through rundll32 stay with the rundll32 command traits under
# process/create/exec/.
traits:
  - id: advpack-setup-entry-exports
    desc: Exports advpack setup execution entry points
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [pe, dll]
    if:
      type: export
      regex: '^(LaunchINFSection(Ex)?[AW]?|RunSetupCommand|ExecuteCab[AW]?)$'
