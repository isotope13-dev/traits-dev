defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-pip-install-command
    desc: Python subprocess pip install command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'subprocess\.(run|Popen|call)\([\s\S]{0,240}\bpip\b[\s\S]{0,120}["'']install["'']'
    unless:
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: python-package-upgrade-command
    desc: Python subprocess argv upgrades a pip package
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute object: (identifier) @module attribute: (identifier) @method)
          arguments: (argument_list (list
            (string (string_content) @pip)
            (string (string_content) @install)
            (string (string_content) @flag)))) @upgrade
          (#eq? @module "subprocess")
          (#match? @method "^(run|Popen|call)$")
          (#match? @pip "^pip[0-9.]*$")
          (#eq? @install "install")
          (#match? @flag "^(--upgrade|-U)$"))
