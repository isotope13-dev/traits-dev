defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.82
traits:
  - id: runtime-package-install-command-text
    desc: Deno, pipx or uv package-install command text
    if:
      type: text
      regex: '[\n;&|][ \t]*(sudo[ \t]+)?(deno|pipx|uv)[ \t]+(install|add)[ \t]+'
