defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: node-global-npm-install-spawn
  desc: Node spawns npm install --global
  conf: 0.93
  if:
    type: text
    regex: (execSync|spawnSync)\(\s*[`"']npm install[\s\S]{0,80}(-g|--global)
- id: node-global-npm-install-remote-tgz
  desc: Node global-installs remote npm tarball
  conf: 0.94
  if:
    type: text
    regex: npm install -g .{0,80}https?://.{0,120}\.tgz
