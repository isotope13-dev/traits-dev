defaults:
  platforms: [android, unix, windows]
  for: [apk, zip, dex]
  crit: notable
  conf: 0.88

traits:
  - id: android-apk-mime-type
    desc: Android APK MIME type
    if:
      type: text
      substr: "application/vnd.android.package-archive"

  - id: package-installer-service-class
    desc: Android package installer service class
    crit: component
    conf: 0.84
    if:
      type: text
      word: "PackageInstallerService"

  - id: android-request-install-packages-permission
    desc: REQUEST_INSTALL_PACKAGES permission
    for: [xml, java, kotlin, apk]
    crit: notable
    conf: 0.92
    attack: "T1631"
    if:
      type: text
      word: "REQUEST_INSTALL_PACKAGES"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

  - id: android-request-install-packages-manifest
    desc: Android manifest requests install permission
    for: [xml, apk, zip]
    crit: notable
    conf: 0.94
    attack: "T1631"
    if:
      type: text
      substr: "android.permission.REQUEST_INSTALL_PACKAGES"

  - id: android-request-delete-packages-permission
    desc: REQUEST_DELETE_PACKAGES permission
    for: [xml, java, kotlin, apk]
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "REQUEST_DELETE_PACKAGES"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

  - id: android-package-installer-session-mode
    desc: PackageInstaller MODE_FULL_INSTALL session
    for: [java, kotlin]
    crit: notable
    conf: 0.93
    attack: "T1631"
    if:
      type: text
      word: "MODE_FULL_INSTALL"

  - id: android-packageinstaller-session-params
    desc: Android PackageInstaller session parameters
    crit: notable
    conf: 0.94
    attack: "T1631"
    if:
      type: text
      substr: "Landroid/content/pm/PackageInstaller$SessionParams;"

  - id: android-packageinstaller-create-session
    desc: PackageInstaller creates install session
    crit: notable
    conf: 0.94
    attack: "T1631"
    if:
      type: text
      exact: "createSession"

  - id: android-packageinstaller-open-write
    desc: PackageInstaller writes install payload
    crit: notable
    conf: 0.94
    attack: "T1631"
    for: [java, kotlin, dex, apk]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)openWrite$'

  - id: android-package-installer-no-user-action
    desc: Requests APK install without user action
    crit: notable
    conf: 0.96
    attack: "T1631"
    for: [java, kotlin]
    if:
      type: text
      word: "USER_ACTION_NOT_REQUIRED"

  - id: android-can-request-package-installs
    desc: Checks whether Android installs are allowed
    crit: notable
    conf: 0.92
    attack: "T1631"
    if:
      type: text
      exact: "canRequestPackageInstalls"

  - id: android-package-installer-session-api
    desc: PackageInstaller.Session usage
    for: [java, kotlin]
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "PackageInstaller.Session"

  - id: android-shell-package-install
    desc: Shell invokes Android APK package installation
    crit: notable
    conf: 0.94
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*(cmd[ \t]+package|pm)[ \t]+install\b.{0,180}\.apk\b'
  - id: android-shell-enable-package
    desc: Shell enables an Android package
    crit: notable
    conf: 0.9
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*pm[ \t]+enable[ \t]+\S{1,120}'

composite_rules:
  - id: android-programmatic-apk-install
    desc: Programmatic full APK install session
    crit: notable
    conf: 0.95
    attack: "T1631"
    for: [java, kotlin]
    all:
      - id: android-package-installer-session-mode
      - id: android-package-installer-session-api

  - id: android-silent-apk-install
    desc: APK install requests no user action
    crit: suspicious
    conf: 0.97
    attack: "T1631"
    for: [java, kotlin]
    all:
      - id: android-programmatic-apk-install
      - id: android-package-installer-no-user-action
  - id: android-install-permission-boot-foreground
    desc: Android install permission with boot foreground persistence
    crit: suspicious
    conf: 0.95
    attack: "T1631, T1624.001"
    all:
      - id: android-request-install-packages-permission
      - id: micro-behaviors/os/service/daemon::android-boot-completed-permission
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission-text
