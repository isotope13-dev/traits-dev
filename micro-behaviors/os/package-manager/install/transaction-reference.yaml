defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.82
traits:
- id: homebrew-install-command
  platforms: [unix]
  # markdown covers skill guidance and READMEs offering brew as an
  # alternative install path.
  for: [shell, markdown]
  desc: References a Homebrew install command
  if:
    type: text
    substr: brew install
# Windows sibling of homebrew-install-command: agent-skill bootstrap guidance
# branches per OS ("macOS: brew, Windows: winget"), and `winget install` is the
# verb form those branches carry in fenced install commands. Requiring the
# install verb keeps bare tool-name mentions (a prose "use winget") silent.
- id: winget-install-command
  platforms: [windows]
  for: [powershell, batch, markdown, text]
  desc: References a winget install command
  if:
    type: text
    regex: '(?i)\bwinget(\.exe)?\s+install\b'
- id: package-manager-install-or-add-command
  desc: Package-manager install or add command
  for: [shell, powershell]
  if:
    type: text
    regex: '(?im)^\s*(p?npm|yarn|bun)\b.{0,60}\b(add|i(nstall)?)\s+[A-Za-z0-9@._/-]{1,120}'
