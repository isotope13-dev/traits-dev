# A command reference in a literal establishes neither execution nor IDE identity.
defaults:
  platforms: [windows, unix]
traits:
  - id: javascript-pip-install-text
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: JavaScript literal contains pip install
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: literal
      regex: 'pip\s+install'
