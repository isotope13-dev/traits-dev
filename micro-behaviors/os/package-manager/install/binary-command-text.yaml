defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
traits:
- id: apt-get-install-cmd-binary-text
  desc: apt-get install command text in binary
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?m)(^|[;&|])[ \t]*(\$[A-Za-z_]\w*|sudo)?[ \t]*apt-get([ \t]+\S+){0,3}[ \t]+install
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
  - type: basename
    regex: (?i)^(readme|metadata|pkg-info)(\.|$)
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/package/freeform::pkg-description-content-type-markdown
  - type: text
    substr: apt-get install svtplay-dl
  - id: gha-apt-get-install-cmd
- id: yum-install-cmd-binary-text
  desc: yum install command text in binary
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: yum install
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - type: basename
    regex: (?i)^(readme|metadata|pkg-info)(\.|$)
  - id: gha-yum-install-cmd
