defaults:
  for: [oledoc]
  platforms: [windows]
  crit: suspicious
  conf: 0.95

traits:
  - id: ai-file-download-action
    desc: Advanced Installer helper file download action
    crit: notable
    conf: 0.98
    for: [pe, dll]
    size_min: 4096
    size_max: 500000000
    if:
      type: text
      section: .rdata
      substr: AI_FileDownload
  - id: ai-expand-archive-action
    desc: Advanced Installer helper archive expansion
    crit: notable
    conf: 0.98
    for: [pe, dll]
    size_min: 4096
    size_max: 500000000
    if:
      type: text
      section: .rdata
      substr: AI_ExpandArchive
  - id: ai-powershell-script-launcher
    desc: Advanced Installer PowerShell script launcher
    crit: notable
    conf: 0.96
    for: [pe, dll]
    size_min: 4096
    size_max: 500000000
    if:
      type: text
      section: .rdata
      substr: PowerShellScriptLauncher
  - id: ai-enforced-embedded-exe-elevation
    desc: MSI forces embedded EXE elevation
    conf: 0.97
    if:
      id: micro-behaviors/os/privilege/request::msi-bytes-enforced-runasadmin
    unless:
      - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
      - id: well-known/app/storage/cloud-drive-mapper::cloud-drive-mapper-msi-context


composite_rules:
  - id: ai-installer-file-download
    crit: notable
    for: [oledoc, pe]
    desc: Advanced Installer MSI includes a file download action
    conf: 0.95
    scope: outer
    all:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
      - id: ai-file-download-action
      - id: well-known/lib/platform/advanced-installer::msi-bytes-advanced-installer-product
  - id: ai-installer-download-and-extract
    for: [oledoc, pe]
    desc: Advanced Installer MSI includes download and archive expansion actions
    conf: 0.9
    scope: outer
    all:
      - id: ai-installer-file-download
      - id: ai-expand-archive-action
  - id: ai-installer-powershell-download-helper
    for: [oledoc, pe]
    desc: Advanced Installer MSI includes PowerShell and file download actions
    conf: 0.94
    attack: T1059.001,T1105
    scope: outer
    all:
      - id: metadata/package/files/msi/identity::ole2-installer-kind
      - id: ai-powershell-script-launcher
      - id: ai-file-download-action
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
