defaults:
  platforms: [unix, windows]
traits:
  - id: package-manager-add-or-install-command
    desc: Package manager add or install command
    crit: notable
    for: [shell, powershell]
    if:
      type: text
      regex: '(?im)^\s*(npm|pnpm|yarn|bun)\b.{0,60}\b(add|install|i)\s+[A-Za-z0-9@._/-]{1,120}'
