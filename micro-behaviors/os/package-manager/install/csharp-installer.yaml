defaults:
  for: [csharp]
  platforms: [windows]

traits:
  - id: engine-download
    desc: Installer engine download handoff
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: engine.Download();
  - id: engine-install-file
    desc: Installer engine file deployment
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: engine.InstallFile();

composite_rules:
  - id: staged-installer-download-handoff
    desc: Installer source stages download flow
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/package-manager/before-install::csharp-beforeinstall-hook
      - id: engine-download
      - id: engine-install-file
  - id: userland-installer-download-source
    desc: Source-backed per-user installer download flow
    crit: suspicious
    conf: 0.99
    all:
      - id: staged-installer-download-handoff
      - id: micro-behaviors/fs/write/file/full/csharp-installer::userland-installer-state-write
      - id: micro-behaviors/communications/tls/initialize::force-modern-tls
