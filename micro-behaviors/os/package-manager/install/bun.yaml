defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, batch, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: bun-installer-url
    desc: Bun installer endpoint reference
    if:
      type: literal
      kind: string
      regex: 'bun\.(sh|com)/install'
  - id: bun-powershell-piped-installer-command
    desc: Bun PowerShell installer piped to IEX
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(irm|Invoke-RestMethod).{1,60}bun\.sh/install\.ps1\s*\|\s*(iex|Invoke-Expression)'
  - id: bun-piped-installer-command
    desc: Bun installer piped to a shell
    conf: 0.95
    if:
      type: text
      regex: '(https?://)?bun\.(sh|com)/install\s*\|\s*bash'
  # The installer command inside an exec/spawn/fetch call: the script runs
  # the bootstrap itself, rather than printing it as help output for the
  # user (buninu's jsmdcui prints the official curl/irm commands when run
  # under Node).
  - id: bun-installer-executed-command
    desc: Executes the Bun installer command
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(exec(Sync)?|spawn(Sync)?|fetch|download)\s*\([^)]{0,200}bun\.(sh|com)/install'
