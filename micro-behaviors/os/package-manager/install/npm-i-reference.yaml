defaults:
  platforms: [unix, windows]
  for: [shell, javascript, typescript, makefile]
  crit: notable
  conf: 0.9

traits:
  - id: npm-i-command-reference
    desc: Source references an npm i package command
    crit: notable
    # Anchored at command position, and one trailing character is captured so
    # the closing backtick of a markdown code span lands inside the match and can
    # be filtered below. Unanchored, a comment describing the flag parser --
    # npm's own `definitions.js` has `// npm i foo --save-bundle <-- should
    # bundle` -- read as an invocation.
    if:
      type: text
      regex: '(?m)(^|[;&|`])[ \t]*npm[ \t]+i[ \t]+(@?[\w.-]+/)?[A-Za-z0-9@][\w./-]{1,60}.?'
    not:
      # Driver/error copy that tells users how to install an optional peer
      # (`Please install it (e.g. \`npm i pg-query-stream\`)`) is documentation,
      # not an autoinstall execution vector.
      - regex: '(?i)(please install|e\.g\.|for example|optional peer)[^\n]{0,80}npm[ \t]+i[ \t]+'
      # A backtick-delimited code SPAN -- `npm i sass` -- is markdown rendered to
      # a human: Next.js's webpack/turbopack error formatters print "Run
      # `npm i sass` or `yarn add sass` inside your workspace", and oh-my-pi's
      # at-import test asserts on that copy. The executed form is written bare.
      - regex: '`$'
    unless:
      - id: metadata/package/testing/presence/scripted/
      - id: metadata/package/documentation/source::llms-txt-basename
      - id: metadata/package/documentation/source::readme-markdown-basename
      - id: "metadata/file/naming::readme-requirements-install-basename"
      - id: well-known/app/development/cloudflare::framework-autoconfig
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: well-known/lib/development/vscode::vscode-extension-marker

