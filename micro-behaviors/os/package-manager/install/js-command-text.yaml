# Command text may occur in executable scripts or skill installation guidance.
# It establishes neither project scope nor a new shell process.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell, markdown]
  crit: notable
  conf: 0.82
traits:
  - id: js-package-add-install-command-text
    desc: JS package add or install command text
    if:
      type: text
      regex: '(?im)^\s*(p?npm|yarn|bun)\s+(add|i(nstall)?)\s+(-\S+\s+){0,8}[\w@./]'
