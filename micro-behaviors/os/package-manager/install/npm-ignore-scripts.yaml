# Declared command text, including documentation, does not prove a shell launch.
defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: npm-install-ignore-scripts
    desc: npm install command disables lifecycle scripts
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*npm[ \t]+(install|ci)\b[^\n]{0,160}--ignore-scripts'
