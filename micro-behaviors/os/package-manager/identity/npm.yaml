# Who am I logged in to the registry as? Neutral by construction: this is the
# check npm's own documentation tells publishing tools to make before they
# publish, and the attacker objectives that consume it supply the owner-add,
# the mass republish, or the workflow write that carries the intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
  crit: notable
  conf: 0.92

traits:
  # Relocated from objectives/supply-chain/hidden-payload/worm/, which is where
  # `package-manifest-version-bump` and `publish-permission-flag` went before
  # it, and which had two traits — `npm-whoami-exec` and
  # `npm-token-whoami-validation` — matching this one command, so every release
  # script reported it twice from a worm directory. A third copy in
  # objectives/discovery/account/enum was already removed for the same reason;
  # the note left behind there records that it convicted the Heroku CLI's own
  # `isAuthenticated()`. Both spellings are folded in here: the CLI command and
  # the registry endpoint it calls.
  - id: npm-whoami-command
    desc: Checks npm registry login identity
    attack: T1098
    if:
      type: text
      regex: '\bnpm\s+whoami|registry\.npmjs\.org/-/whoami'
    unless:
      - id: well-known/tool/development/anthropic-claude-agent/
      - id: well-known/tool/development/yarn::yarn-cli-bundle-marker
