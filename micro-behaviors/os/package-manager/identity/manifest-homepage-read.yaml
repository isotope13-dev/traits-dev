# Code that loads its own package.json and reads the `homepage` field. CLIs
# print it in help text; it is a neutral manifest-identity read.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: node-own-manifest-homepage-read
    desc: Reads own package.json homepage field
    if:
      type: text
      regex: '(readPackageJson\(\)|package\.json[''"]\)|\bpkg(Json)?|\bmanifest)\.homepage\b'
