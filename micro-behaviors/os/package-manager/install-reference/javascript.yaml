defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: system-package-install-command-text
    desc: References a system package install command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(apt-get|apt|dnf|yum|brew|port|nix-env)\s+(install|-iA)\b[^\r\n]{0,100}'
