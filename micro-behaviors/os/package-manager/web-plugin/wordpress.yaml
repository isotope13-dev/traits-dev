# WordPress plugin-directory installation is a package-management capability.
# It is used by both legitimate plugin recommendations and malicious admin
# tooling, so intent belongs in an objective composite rather than here.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.92

traits:
  - id: wordpress-plugin-directory-query
    desc: Queries the WordPress plugin directory API
    if:
      type: symbol
      exact: plugins_api

  - id: wordpress-plugin-upgrader-install
    desc: Installs plugin from API download URL
    if:
      type: text
      regex: '(?is)\bPlugin_Upgrader\b.{0,520}\binstall\s*\([^;\n]{0,240}\bdownload_link\b'

  - id: wordpress-plugin-activation
    desc: Activates an installed WordPress plugin
    if:
      type: symbol
      exact: activate_plugin

  - id: wordpress-plugin-activation-call
    desc: Calls WordPress activate_plugin function
    if:
      type: text
      regex: '(?i)\bactivate_plugin\s*\('

  - id: wordpress-plugin-details-post-read
    desc: Reads WordPress plugin_details from POST
    if:
      type: text
      regex: '(?i)\$_POST\s*\[\s*[''"]plugin_details[''"]\s*\]'

  - id: wordpress-remote-plugin-archive-download
    desc: Downloads remote bytes into plugin archive path
    if:
      type: text
      regex: '(?i)wp_safe_remote_get\s*\([\s\S]{0,800}put_contents\s*\('

  - id: wordpress-plugin-archive-extract
    desc: Extracts plugin archive into plugins directory
    if:
      type: text
      regex: '(?i)WP_PLUGIN_DIR[\s\S]{0,400}unzip_file\s*\('

composite_rules:
  - id: wordpress-plugin-directory-install
    desc: Downloads and installs a WordPress plugin
    crit: notable
    conf: 0.95
    all:
      - id: wordpress-plugin-directory-query
      - id: wordpress-plugin-upgrader-install
