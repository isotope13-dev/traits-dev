defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: forced-install-extension-call-array
    desc: CLI arguments force extension installation
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call_expression
          arguments: (arguments
            (_)
            (array
              (string (string_fragment) @install)
              (_)
              (string (string_fragment) @force))))
          (#eq? @install "--install-extension")
          (#eq? @force "--force"))

composite_rules:
  - id: forced-extension-install-arguments
    desc: Editor extension install arguments include force
    crit: notable
    conf: 0.97
    any:
      - id: forced-install-extension-call-array
      - id: ide-cli-install-extension-forced
