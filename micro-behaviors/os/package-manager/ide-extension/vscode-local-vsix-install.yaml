defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: vscode-install-extension-from-file
    desc: Installs local extension through VS Code
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (call_expression function: (member_expression property: (property_identifier) @file))))
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.installExtension")
          (#eq? @file "file"))

        ((call_expression
          function: (member_expression property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (array
              . (call_expression
                function: (member_expression
                  object: (member_expression property: (property_identifier) @uri_type)
                  property: (property_identifier) @file)))))
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.command.installFromVSIX")
          (#eq? @uri_type "Uri")
          (#eq? @file "file"))

        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @uri_name
              value: (call_expression
                function: (member_expression
                  object: (member_expression property: (property_identifier) @uri_type)
                  property: (property_identifier) @uri_file))))
          (expression_statement
            (await_expression
              (call_expression
                function: (member_expression property: (property_identifier) @execute)
                arguments: (arguments
                  . (string (string_fragment) @command)
                  . (identifier) @uri_arg)))))
          (#eq? @uri_type "Uri")
          (#eq? @uri_file "file")
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.installExtension")
          (#eq? @uri_name @uri_arg))
  - id: vscode-extension-install-command
    desc: Calls VS Code extension install command
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (_) @extension))
          (#eq? @execute "executeCommand")
          (#any-of? @command "workbench.extensions.installExtension"
            "workbench.extensions.command.installFromVSIX"))
