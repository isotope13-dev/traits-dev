defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: vscode-install-extension-from-file
    desc: Installs local extension through VS Code
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (call_expression function: (member_expression property: (property_identifier) @file))))
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.installExtension")
          (#eq? @file "file"))
