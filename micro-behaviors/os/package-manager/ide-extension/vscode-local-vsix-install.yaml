defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: vscode-fetch-writes-installed-extension
    desc: Fetches bytes and installs written extension
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @path_source value: (string)))
          (lexical_declaration "const"
            (variable_declarator
              name: (identifier) @response
              value: (await_expression
                (call_expression function: (identifier) @fetch
                  arguments: (arguments . (string (string_fragment) @url @evidence) .)))))
          (lexical_declaration "const"
            (variable_declarator
              name: (identifier) @bytes
              value: (await_expression
                (call_expression function: (member_expression
                  object: (identifier) @received
                  property: (property_identifier) @array_buffer)
                  arguments: (arguments)))))
          (expression_statement
            (await_expression
              (call_expression function: (member_expression
                object: (member_expression object: (identifier) @fs
                  property: (property_identifier) @promises)
                property: (property_identifier) @write)
                arguments: (arguments . (identifier) @path_write . (identifier) @written .))))
          (expression_statement
            (await_expression
              (call_expression function: (member_expression
                object: (member_expression object: (identifier) @editor_commands
                  property: (property_identifier) @commands)
                property: (property_identifier) @execute)
                arguments: (arguments
                  . (string (string_fragment) @command)
                  . (call_expression function: (member_expression
                    object: (member_expression object: (identifier) @editor_uri
                      property: (property_identifier) @uri)
                    property: (property_identifier) @file)
                    arguments: (arguments . (identifier) @path_install .)))))))
          (#eq? @fetch "fetch")
          (#eq? @response @received)
          (#eq? @array_buffer "arrayBuffer")
          (#eq? @fs "fs")
          (#eq? @promises "promises")
          (#eq? @write "writeFile")
          (#eq? @bytes @written)
          (#eq? @path_source @path_write)
          (#eq? @editor_commands @editor_uri)
          (#eq? @editor_commands "vscode")
          (#eq? @commands "commands")
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.installExtension")
          (#eq? @uri "Uri")
          (#eq? @file "file")
          (#eq? @path_write @path_install))

  - id: vscode-install-extension-from-file
    desc: Installs local extension through VS Code
    crit: suspicious
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (_) @vsix))
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.command.installFromVSIX"))

        ((call_expression
          function: (member_expression property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (call_expression function: (member_expression
              object: (member_expression property: (property_identifier) @uri_type)
              property: (property_identifier) @file))))
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.installExtension")
          (#eq? @uri_type "Uri")
          (#eq? @file "file"))

        ((call_expression
          function: (member_expression property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (call_expression function: (member_expression
              object: (identifier) @uri_type
              property: (property_identifier) @file))))
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.installExtension")
          (#eq? @uri_type "Uri")
          (#eq? @file "file"))

        ((call_expression
          function: (member_expression property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (array
              . (call_expression
                function: (member_expression
                  object: (member_expression property: (property_identifier) @uri_type)
                  property: (property_identifier) @file)))))
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.command.installFromVSIX")
          (#eq? @uri_type "Uri")
          (#eq? @file "file"))

        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @uri_name
              value: (call_expression
                function: (member_expression
                  object: (member_expression property: (property_identifier) @uri_type)
                  property: (property_identifier) @uri_file))))
          (expression_statement
            (await_expression
              (call_expression
                function: (member_expression property: (property_identifier) @execute)
                arguments: (arguments
                  . (string (string_fragment) @command)
                  . (identifier) @uri_arg)))))
          (#eq? @uri_type "Uri")
          (#eq? @uri_file "file")
          (#eq? @execute "executeCommand")
          (#eq? @command "workbench.extensions.installExtension")
          (#eq? @uri_name @uri_arg))
  - id: vscode-extension-install-command
    desc: Calls VS Code extension install command
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            property: (property_identifier) @execute)
          arguments: (arguments
            . (string (string_fragment) @command)
            . (_) @extension))
          (#eq? @execute "executeCommand")
          (#any-of? @command "workbench.extensions.installExtension"
            "workbench.extensions.command.installFromVSIX"))
