# Building an npm command is a package-management capability. Remote control
# and persistence intent belong in objective composites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105

traits:
  - id: js-npm-install-command-builder
    desc: JavaScript defines npm install builder
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'function npmInstallCommand'
