# Building an npm command is a package-management capability. Remote control
# and persistence intent belong in objective composites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105

traits:
  - id: js-npm-install-command-builder
    desc: JavaScript defines npm install builder
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'function npmInstallCommand'

  # A self-updater that shells out to a package manager builds the global
  # install invocation from parts (manager binary resolved separately from
  # `['install', '-g', spec]` args), so neither a literal `npm install <pkg>`
  # command string nor a hardcoded builder name sees it. The quoted
  # `install', '-g` / `add', '-g` argument pair is the manager-CLI contract
  # (npm, pnpm, bun), not an attacker-chosen name, and survives renames.
  - id: js-global-install-args-array
    desc: Builds global install argument array
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[\x27"](install|add)[\x27"]\s*,\s*[\x27"]-g[\x27"]'

  # A quoted package spec whose version is the mutable latest tag. Installing
  # or launching it runs whatever the registry serves at that moment.
  - id: js-floating-package-spec-literal
    desc: Quoted npm package spec uses latest tag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']@?[a-z0-9_.-]{1,40}(/[a-z0-9_.-]{1,40})?@latest["'']'

  # An npx runner whose argument list starts with the auto-install flag. The
  # runner may be a literal or a helper that returns its name.
  - id: js-npx-yes-runner-args
    desc: npx runner receives auto-install flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']npx["'']\)?\s*,\s*\[\s*["''](--yes|-y)["'']'

  # A self-updater reads the registry's `latest` document for its own package
  # name. Each fragment is component evidence: a version check alone is common.
  - id: js-npm-registry-latest-url
    desc: Registry URL resolves the latest release
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'registry\.npmjs\.org/.{0,80}/latest'

  # The same package's tarball addressed by a templated name and version.
  - id: js-npm-registry-tarball-url
    desc: Registry tarball URL from name and version
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'registry\.npmjs\.org/\$\{[^}]{1,40}\}/-/'

  # npm's own CLI installs a resolved version into a fresh prefix folder. The
  # argument list is the contract; a plain `npm install` with a pinned spec
  # carries no prefix argument and no floating spec.
  - id: js-npm-install-prefix-args
    desc: npm install argv names a --prefix folder
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["'']install["''],\s*["'']--prefix["'']'

composite_rules:
  # Fetching the mutable latest release and its tarball in one file is the
  # self-replacement path: the new code is written over the installed files and
  # loaded without a pinned version. Notable, because the updater may be wanted.
  - id: js-npm-self-update-latest-tarball
    desc: Self-updater fetches npm latest and tarball
    crit: notable
    conf: 0.85
    all:
      - id: js-npm-registry-latest-url
      - id: js-npm-registry-tarball-url
  # The npm CLI resolves the floating latest version, then installs that version
  # into a new prefix folder and makes it active. A self-updater built on the
  # npm CLI has this shape, not the registry-URL shape above. Notable, because
  # the updater may be wanted; the install itself is not pinned.
  - id: js-npm-cli-self-update-floating
    desc: npm CLI self-updater resolves latest and installs a prefix
    crit: notable
    conf: 0.85
    all:
      - id: js-floating-package-spec-literal
      - id: js-npm-install-prefix-args
