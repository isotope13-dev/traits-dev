# Building an npm command is a package-management capability. Remote control
# and persistence intent belong in objective composites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105

traits:
  - id: js-npm-install-command-builder
    desc: JavaScript defines npm install builder
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'function npmInstallCommand'

  # A self-updater that shells out to a package manager builds the global
  # install invocation from parts (manager binary resolved separately from
  # `['install', '-g', spec]` args), so neither a literal `npm install <pkg>`
  # command string nor a hardcoded builder name sees it. The quoted
  # `install', '-g` / `add', '-g` argument pair is the manager-CLI contract
  # (npm, pnpm, bun), not an attacker-chosen name, and survives renames.
  - id: js-global-install-args-array
    desc: Builds global install argument array
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[\x27"](install|add)[\x27"]\s*,\s*[\x27"]-g[\x27"]'
