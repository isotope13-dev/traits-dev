---
defaults:
  crit: hostile
  platforms:
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: coding-agent-updater-context
  desc: Recognized coding-agent standalone updater context
  crit: exception
  conf: 0.98
  any:
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-standalone-updater-context
  - id: well-known/app/ai/coding-agent/pi-coding-agent::pi-standalone-updater-context
  - id: well-known/app/ai/coding-agent/hxf-coding-agent::hxf-standalone-updater-context
  - id: well-known/app/ai/observability/comprism::comprism-standalone-updater-context
- id: official-installer-command-context
  desc: Official vendor installer command context
  crit: exception
  conf: 0.97
  any:
  - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
  - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
  - id: micro-behaviors/os/package-manager/reference-install::platform-install-command-map-context
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::claude-code-powershell-piped-installer-command
  - id: well-known/tool/development/vscode-extension/sloppy::sloppy-powershell-piped-installer-command
  - id: metadata/lang/source/syntax/command/download::cargo-dist-powershell-installer-oneliner-text
  - id: metadata/lang/source/syntax/key-value::cargo-dist-npm-installer-template
  - id: well-known/tool/development/cli/buildercode::builder-io-powershell-piped-installer-command
