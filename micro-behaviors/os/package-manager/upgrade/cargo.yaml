defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.92

traits:
  - id: shell-cargo-update
    desc: Updates Cargo lockfile dependencies
    if:
      type: symbol
      kind: call
      exact: cargo
      arg:
        kind: identifier
        name: update

  - id: shell-cargo-upgrade
    desc: Upgrades Cargo manifest dependencies
    if:
      type: symbol
      kind: call
      exact: cargo
      arg:
        kind: identifier
        name: upgrade
