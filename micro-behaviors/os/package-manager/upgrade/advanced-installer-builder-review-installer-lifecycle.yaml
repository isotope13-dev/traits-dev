---
defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: updater-no-install-gui-name
  desc: NoUpdaterInstallGUI flag
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: NoUpdaterInstallGUI
    section: rdata
- id: updater-no-disable-auto-check-name
  desc: NoDisableAutoCheck flag
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: NoDisableAutoCheck
    section: rdata
- id: updater-check-frequency-one-text
  desc: CheckFrequency=1 text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "\\bCheckFrequency\\s*=\\s*1\\b"
    section: rdata
composite_rules:
- id: updater-option-reference-clues
  desc: Updater option names and frequency text
  crit: notable
  conf: 0.94
  needs: 2
  any:
  - id: micro-behaviors/os/package-manager/upgrade::updater-no-install-gui-name
  - id: micro-behaviors/os/package-manager/upgrade::updater-no-disable-auto-check-name
  - id: micro-behaviors/os/package-manager/upgrade::updater-check-frequency-one-text
