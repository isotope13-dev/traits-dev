defaults:
  platforms: [macos]
  for: [shell]

composite_rules:
  - id: macos-disk-image-app-update
    desc: macOS disk-image application updater
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/volume/mount::hdiutil-attach
      - id: micro-behaviors/fs/file/copy/command::macos-updater-app-copy
      - id: micro-behaviors/os/handler/open::macos-open-app-name-variable
