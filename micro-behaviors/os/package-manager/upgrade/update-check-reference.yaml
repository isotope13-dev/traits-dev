defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: update-check-worker-command
  desc: Names update-check worker subcommand
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(__|--)(check-update|update-check|refresh)\b'
# A background update checker fetches the registry's latest version and
# writes the response version into its local cache, not an executable payload.
- id: npm-registry-version-cache-fetch
  desc: Fetches registry version into an update cache
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?is)fetch\(.{0,400}/latest.{0,500}data\.version.{0,500}writeFileSync'
