defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: npm-registry-self-update-check-marker
  desc: References package update-check helpers
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \b(checkForUpdate|evaluateUpdate|updateCheckDisabled)\b
# A CLI subcommand literal that dispatches to a background update-cache
# refresh (argv-gated worker entry re-spawned via process.execPath). The
# name alone proves no network or execution behavior; it only lets an
# updater-context composite tell a self-check worker from a payload.
- id: update-check-worker-command
  desc: Names update-check worker subcommand
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(__|--)(check-update|update-check|refresh)\b'
