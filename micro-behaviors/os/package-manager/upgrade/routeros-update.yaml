defaults:
  platforms: [routeros, appliance, unix]
  for: [text, shell, python, javascript]
traits:
  - id: micro-behaviors/os/package-manager/upgrade::routeros-package-update-set
    desc: RouterOS package update setting
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /system package update set

composite_rules:
  - id: routeros-package-update-script-clues
    desc: RouterOS package update and script clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/upgrade::routeros-package-update-set
      - id: micro-behaviors/communications/http/download/routeros::routeros-hook-script-fetch
      - id: micro-behaviors/process/interpreter/scripting::routeros-script-import-or-run
