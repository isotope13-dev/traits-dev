# A shell wrapper that installs an npm package at a variable dist-tag runs
# whatever the registry serves under that tag. Package and tag come from
# separate variables, so no literal `@latest` appears and the JavaScript
# floating-spec rules never see it.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-npm-package-tag-variable
    desc: Shell npm spec interpolates package and tag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '^\s*"\$\{?[A-Za-z_]{1,30}\}?@\$\{?[A-Za-z_]{1,30}\}?"'

composite_rules:
  # The global install command and the quoted package@tag spec sit on
  # neighbouring continuation lines of one invocation. Global install alone
  # is common; a variable tag in the same call makes the install floating.
  - id: shell-npm-self-update-tag-install
    desc: Shell global npm install of a variable-tag package
    crit: notable
    conf: 0.88
    near_lines: 4
    all:
      - id: micro-behaviors/os/package-manager/install::global-npm-install-command
      - id: shell-npm-package-tag-variable
