defaults:
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-callback-dispatch
    desc: Calls a PHP callback dispatcher
    if:
      type: symbol
      kind: call
      exact: call_user_func

  - id: php-callback-array-dispatch
    desc: PHP callback dispatcher with argument array
    if:
      type: symbol
      kind: call
      exact: call_user_func_array
