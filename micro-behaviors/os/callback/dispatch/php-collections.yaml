defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-array-transform-api
    desc: Calls PHP array transformation API
    # Map/filter/walk/reduce are routine collection plumbing, not purpose.
    crit: baseline
    if:
      type: symbol
      kind: call
      regex: '(?i)^array_(map|filter|reduce|walk(_recursive)?)$'
  - id: php-array-callback-difference-api
    desc: Computes PHP array differences with callbacks
    if:
      type: symbol
      kind: call
      regex: '(?i)^array_(diff_u(assoc|key)|udiff(_u?assoc)?)$'
  - id: php-array-callback-intersection-api
    desc: Computes PHP array intersections with callbacks
    if:
      type: symbol
      kind: call
      regex: '(?i)^array_(intersect_u(assoc|key)|uintersect(_u?assoc)?)$'
  - id: php-array-callback-sort-api
    desc: Sorts PHP arrays using a comparison callback
    if:
      type: symbol
      kind: call
      regex: '(?i)^u[ak]?sort$'
  - id: php-regex-callback-api
    desc: Calls PHP regex callback replacement API
    if:
      type: symbol
      kind: call
      regex: '(?i)^(preg_replace|mb_ereg_replace)_callback$'
  - id: php-lifecycle-callback-api
    desc: Registers PHP lifecycle callback
    # Shutdown cleanup and autoload registration are routine runtime plumbing.
    crit: baseline
    if:
      type: symbol
      kind: call
      regex: '(?i)^(register_shutdown_function|register_tick_function|spl_autoload_register)$'
  - id: php-handler-registration-api
    desc: Registers PHP error or session handler
    if:
      type: symbol
      kind: call
      regex: '(?i)^(set_error_handler|set_exception_handler|session_set_save_handler)$'
  - id: php-iterator-callback-api
    desc: Applies PHP callback to iterator elements
    if:
      type: symbol
      kind: call
      exact: iterator_apply
  - id: php-sqlite-callback-api
    desc: Registers PHP callback with SQLite
    if:
      type: symbol
      kind: call
      regex: '(?i)^sqlite_create_(aggregate|function)$'
  - id: php-assert-options-api
    desc: Configures PHP assertion behavior
    if:
      type: symbol
      kind: call
      exact: assert_options
  - id: php-filter-callback-mode
    desc: Uses PHP callback filtering mode
    if:
      type: tree-sitter
      node: function_call_expression
      regex: '^filter_var\s*\([^,]{1,80},\s*FILTER_CALLBACK\b'
