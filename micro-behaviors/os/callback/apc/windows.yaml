# User-mode asynchronous procedure call scheduling. QueueUserAPC is a neutral
# callback primitive used by event loops and asynchronous I/O as well as by
# cross-process injection; objective composites provide the injection context.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, powershell, batch, vbs, javascript, xml]

traits:
  - id: queue-user-apc
    desc: QueueUserAPC callback scheduling reference
    crit: notable
    conf: 0.95
    # Python implants reach the same primitive through ctypes
    # (kernel32.QueueUserAPC for Early Bird injection); the callback itself
    # is neutral either way, injection context comes from composites.
    for: [pe, dll, c, cpp, powershell, batch, vbs, javascript, xml, python]
    if:
      type: text
      word: QueueUserAPC
