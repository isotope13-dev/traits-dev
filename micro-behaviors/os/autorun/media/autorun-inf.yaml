defaults:
  platforms:
  - windows
  for:
  - text
  crit: notable
  conf: 0.88
traits:
- id: autorun-open-executable
  desc: AutoRun Open directive names executable
  conf: 0.94
  for: [pe, batch, powershell, vbs, text]
  if:
    type: text
    regex: '(?i)^Open\s*=\s*[\w.$ \\-]{1,96}\.(exe|com|scr|pif)(\s|$)'
# Custom verbs add menu commands; they do not replace Open or Explore.
# Keep the observation for both legitimate installers and hostile launchers.
- id: autorun-shell-verb-command
  desc: AutoRun declares a drive-menu command
  conf: 0.94
  for: [pe, batch, powershell, vbs, text]
  if:
    type: text
    regex: '(?im)^\s*shell\\[a-z0-9_.-]+\\command\s*='
- id: autorun-section-header
  desc: Declares autorun configuration section
  if:
    type: text
    regex: (^|\n)\[autorun\]
    case_insensitive: true
- id: autorun-action-label
  desc: Autorun declares AutoPlay action display text
  conf: 0.9
  for:
  - pe
  - batch
  - powershell
  - vbs
  - text
  if:
    type: text
    regex: (?is)\[autorun\].{0,200}?\bAction\s*=
- id: autorun-shellexecute-executable
  desc: Autorun ShellExecute declares executable target
  conf: 0.94
  for:
  - pe
  - batch
  - powershell
  - vbs
  - text
  if:
    type: text
    regex: (?im)^ShellExecute\s*=\s*[\w.$ -]{1,96}\.(exe|com|scr|pif)(\s|$)
- id: autorun-shell-verb-executable
  desc: Autorun shell command targets executable
  conf: 0.94
  for:
  - pe
  - batch
  - powershell
  - vbs
  - text
  if:
    type: text
    regex: '(?im)^shell\\[a-z0-9_.-]+\\command\s*=[^\r\n]{1,80}\.(exe|com|scr|pif)\b'
- id: autorun-document-action-label
  desc: AutoRun action displays Documents label
  size_max: 4096
  conf: 0.95
  if:
    type: yara
    source: |
      rule autorun_document_action_label {
        strings:
          $label = /\[autorun\][^\x5b]{0,1024}[\r\n]action[ \t]*=[ \t]*documents[ \t]*(\r?\n|$)/ nocase
        condition:
          $label
      }
- id: autorun-section-launch-directive
  desc: AutoRun section contains a launch directive
  if:
    type: yara
    source: |
      rule autorun_section_launch_directive {
        strings:
          $launch = /\[autorun\][^\x5b]{0,2048}[\r\n][ \t]*(open|shellexecute)[ \t]*=[ \t]*[^ \t\r\n]/ nocase
        condition:
          $launch
      }
- id: autorun-csrss-like-root-directive
  desc: CSRSS-like relative executable launch directive
  size_max: 4096
  conf: 0.9
  if:
    type: text
    regex: (?im)^(open|shellexecute)[ \t]*=[ \t]*"?csrs[a-z]\.exe"?[ \t]*\r?$
composite_rules:
- id: autorun-inf-launch-program
  desc: Declares removable-media program launch
  conf: 0.9
  all:
  - id: autorun-section-header
  - id: autorun-section-launch-directive
  near_bytes: 2048
- id: autorun-fields-without-filesystem-observation
  desc: Autorun fields without other filesystem observations
  for:
  - pe
  - batch
  - powershell
  - vbs
  - text
  any:
  - id: autorun-action-label
  - id: autorun-shellexecute-executable
  - id: autorun-open-executable
  - id: autorun-shell-verb-command
  unless:
  - id: micro-behaviors/fs
