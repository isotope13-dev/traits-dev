# Removable-media autorun files: an [autorun] section whose open= or
# shellexecute= directive names the program the OS launches on media
# insert. The classic USB-worm spread primitive — and, before autoplay was
# retired, the ordinary software-CD installer hook — so the observation
# stays a neutral capability here; intent comes from whatever the
# designated program is, not from this file.
defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.88
traits:
  - id: autorun-section-header
    desc: Declares autorun configuration section
    if:
      type: text
      # Windows parses the section name case-insensitively, and worm-written
      # autorun.inf files use `[Autorun]` as often as `[autorun]`.
      regex: '(^|\n)\[autorun\]'
      case_insensitive: true
  - id: autorun-launch-directive
    desc: Autorun names program to launch
    if:
      type: text
      regex: '(^|\n)\s*(open|shellexecute)\s*=\s*\S'
      case_insensitive: true
  - id: autorun-action-label
    desc: Autorun declares AutoPlay action display text
    crit: notable
    conf: 0.9
    # autorun.inf is sniffed as text. The section guard below already keeps
    # a bare "Action =" label from matching outside that file.
    for: [pe, batch, powershell, vbs, text]
    if:
      type: text
      # `Action = ` is also a generated Kubernetes API property's ToString()
      # label. Require the Autorun section in the same text block so an API
      # field name cannot stand in for an autorun.inf directive.
      regex: '(?is)\[autorun\].{0,200}?\bAction\s*='

  - id: autorun-shellexecute-executable
    desc: Autorun ShellExecute declares executable target
    crit: notable
    conf: 0.94
    for: [pe, batch, powershell, vbs, text]
    if:
      type: text
      regex: '(?im)^ShellExecute\s*=\s*[\w.$ -]{1,96}\.(exe|com|scr|pif)(\s|$)'

  - id: autorun-document-action-label
    desc: AutoRun action displays Documents label
    size_max: 4096
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule autorun_document_action_label {
          strings:
            $label = /\[autorun\][^\x5b]{0,1024}[\r\n]action[ \t]*=[ \t]*documents[ \t]*(\r?\n|$)/ nocase
          condition:
            $label
        }
  - id: autorun-section-launch-directive
    desc: AutoRun section contains a launch directive
    if:
      type: yara
      source: |
        rule autorun_section_launch_directive {
          strings:
            $launch = /\[autorun\][^\x5b]{0,2048}[\r\n][ \t]*(open|shellexecute)[ \t]*=[ \t]*[^ \t\r\n]/ nocase
          condition:
            $launch
        }

  - id: autorun-csrss-like-root-directive
    desc: CSRSS-like relative executable launch directive
    size_max: 4096
    conf: 0.9
    if:
      type: text
      regex: '(?im)^(open|shellexecute)[ \t]*=[ \t]*"?csrs[a-z]\.exe"?[ \t]*\r?$'

composite_rules:
  - id: autorun-inf-launch-program
    desc: Removable-media autorun launches program
    conf: 0.9
    all:
      - id: autorun-section-header
      - id: autorun-launch-directive
      - id: autorun-section-launch-directive
    near_bytes: 2048

  # Compatibility union for consumers of the former fs/path home. This
  # alternative is disjoint from fs/, so needs:N still counts one old role.
  - id: autorun-fields-without-filesystem-observation
    desc: Autorun fields without other filesystem observations
    for: [pe, batch, powershell, vbs, text]
    any:
      - id: autorun-action-label
      - id: autorun-shellexecute-executable
    unless:
      - id: micro-behaviors/fs/
