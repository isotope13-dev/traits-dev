# Registry policy names are neutral references until code also demonstrates
# changing the policy. Objective composites add the write operation and other
# policy-specific context before inferring degradation.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1562

traits:
  - id: autorun-policy-value
    desc: Windows AutoRun policy value reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: NoDriveTypeAutoRun
