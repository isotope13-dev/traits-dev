defaults:
  platforms: [windows, unix]
  for: [go, elf, macho, shell, python]

traits:
  - id: crontab-at-reboot
    desc: Cron entry uses the reboot directive
    crit: notable
    conf: 0.9
    if:
      # Match a cron entry's macro line, not parser prose such as
      # `case "@reboot"` or `@reboot is not supported`.
      type: text
      regex: '(?m)(^|[;\n])[ \t]*@reboot[ \t]+\S'

  - id: native-root-reboot-entry
    desc: Native root reboot cron entry template
    crit: notable
    conf: 0.98
    for: [elf]
    if:
      type: hex
      pattern: "40 72 65 62 6F 6F 74 20 72 6F 6F 74 20"
      section: rodata
