defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: echo-reboot
    desc: Emits cron entry for system reboot
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\becho\s+["']?@reboot\s+
  - id: echo-cron-fields
    desc: Echo emits five numeric cron fields
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \becho\s+["']?([0-9\*/,\-]+\s+){4}[0-9\*/,\-]+\s+
  - id: echo-root-system-cron-entry
    desc: Echo embeds root system cron entry
    crit: notable
    conf: 0.96
    for: [elf]
    if:
      type: raw
      regex: '(?s)\*/\d+\s+\*\s+\*\s+\*\s+\*\s+root\s+/\S+.{0,120}>>\s*/etc/crontab'
composite_rules:
  - id: echo-command
    desc: Echo emits cron schedule fields
    crit: notable
    conf: 0.5
    any:
      - id: echo-reboot
      - id: echo-cron-fields
