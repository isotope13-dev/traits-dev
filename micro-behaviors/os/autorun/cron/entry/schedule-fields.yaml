# A schedule assembled separately from its command is still a cron capability.
# Require the entire literal to be exactly five numeric/wildcard cron fields.
defaults:
  platforms: [unix]
  for: [scripts, source]

traits:
  - id: cron-schedule-fields-literal
    desc: Five numeric or wildcard cron-shaped fields
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '^([\d*/,\-]+[ \t]+){4}[\d*/,\-]+$'
      exclude_docstrings: true
    not:
      - regex: '\d{3}'

  - id: cron-scheduled-command-literal
    desc: String contains cron-shaped fields and command
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      # A sixth bare star is a decoration, not an executable command token.
      # Keep wildcard executable names such as *.sh, but reject star banners.
      regex: '^([\d*/,\-]+[ \t]+){5}([^* \t\r\n]|\*[^* \t\r\n])[^\r\n]{0,512}$'
      exclude_docstrings: true
    not:
      - regex: '^([\d*/,\-]+[ \t]+){0,4}[\d*/,\-]*\d{3}'
