defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: every-minute-hidden-script-command
    desc: Every-minute cron command invokes dotfile script
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\* \* \* \* \* /bin/sh \\?"\$\w+/\.[\w.-]+\\?"'
  - id: recurring-cron-dotfile-script-command
    desc: Recurring cron command invokes dotfile script
    crit: notable
    conf: 0.95
    # Minute field is every minute or a step (*/N); the script path has a dot-named directory.
    if:
      type: text
      regex: '(\*/[1-9][0-9]?|\*)[ \t]+\*[ \t]+\*[ \t]+\*[ \t]+\*[ \t]+\S+[ \t]+\S*/\.[\w.-]+/\S+'
