defaults:
  platforms: [linux]
  for: [elf]
traits:
  # Native installers may append the executable separately. This prefix is
  # deliberately described as incomplete, not as an installed cron command.
  - id: native-recurring-cron-prefix
    desc: Native recurring cron schedule prefix
    crit: notable
    conf: 0.96
    if:
      # Incomplete, whitespace-heavy prefixes are omitted from text facts.
      type: raw
      section: .rodata
      regex: '\*/[1-9][0-9]? \* \* \* \* (root )?\x00'
