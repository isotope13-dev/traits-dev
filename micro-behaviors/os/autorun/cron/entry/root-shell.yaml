defaults:
  platforms: [unix]
  for: [source, scripts, binaries]
  crit: notable
  conf: 0.98
traits:
  - id: root-shell-command-output-job
    desc: Cron root shell job redirects command output
    if:
      type: literal
      kind: string
      regex: '(\*\s+){5}root\s+/(usr/)?bin/(ba|da|k|z)?sh\s+-c\s+["''].{1,300}>\s*/.{1,180}2>&1'
