# This describes the scheduled payload, not local execution by the sender.
# Routine root auditing can use the same job; traversal supplies hostile intent.
defaults:
  platforms: [unix]
  for: [scripts, source]
  crit: notable
  conf: 0.97
traits:
  - id: root-cron-identity-output-job
    desc: Root cron job redirects identity output
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '([\d*/,\-]+\s+){5}root\s+(/usr/bin/)?(id|whoami)\s+>{1,2}\s*/'
