defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.5
traits:
  - id: shell-cron-schedule-entry
    desc: Shell embeds recurring cron schedule
    crit: notable
    conf: 0.97
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|\s|")(\*/[0-9]{1,2}|[0-9*]{1,2})\s+\*\s+\*\s+\*\s+\*'
  - id: recurring-minute-cron-command-literal
    desc: Embeds recurring minute cron command
    crit: notable
    conf: 0.96
    for: [scripts, source, binaries]
    if:
      # An extracted string containing all five cron fields and a command.
      # This covers fixed, comma-separated, and interval minute schedules.
      type: literal
      kind: string
      regex: '^(\*/[1-9][0-9]?|[0-5]?[0-9](,[0-5]?[0-9])*)\s+\*\s+\*\s+\*\s+\*\s+\S'
  - id: go-cron-schedule-literal
    desc: Go embeds a recurring cron schedule
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: string_literal
      substr: '* * * * *'
  - id: crontab-wildcard-entry-command
    desc: Wildcard crontab entry with command
    crit: component
    conf: 0.85
    for: [scripts, source, binaries, -python, -javascript, -typescript]
    if:
      type: text
      regex: '(?m)(^|["''])[ \t]*(\*[ \t]+){4}\*[ \t]+(\.?/|\$|[A-Za-z_])[^\r\n]{0,500}$'
  - id: crontab-wildcard-entry-string
    desc: Wildcard crontab entry with command
    crit: component
    conf: 0.85
    for: [python, javascript, typescript]
    if:
      type: literal
      regex: '(?m)(^|["''])[ \t]*(\*[ \t]+){4}\*[ \t]+(\.?/|\$|[A-Za-z_])[^\r\n]{0,500}$'
  - id: crontab-schedule-format
    desc: Crontab schedule format string
    crit: notable
    conf: 0.9
    for: [shell, python, ruby, perl, go]
    if:
      type: text
      regex: '%d\s+%d\s+\*\s+\*\s+\*\s+%s'
  - id: source-cron-schedule-entry-command
    desc: Recurring Unix cron schedule
    crit: component
    conf: 0.92
    for: [scripts, source, -python, -javascript, -typescript]
    if:
      type: text
      regex: '(?m)^\s*(\*/[0-9]{1,2}|[0-9]{1,2})\s+\*\s+\*\s+\*\s+\*\s+\S+'
  - id: source-cron-schedule-entry-string
    desc: Recurring Unix cron schedule
    crit: component
    conf: 0.92
    for: [python, javascript, typescript]
    if:
      type: literal
      regex: '(?m)^\s*(\*/[0-9]{1,2}|[0-9]{1,2})\s+\*\s+\*\s+\*\s+\*\s+\S+'
composite_rules:
  # Language-neutral "a recurring cron schedule is present" component. The
  # shell and generic-source matchers differ only in whether a command word is
  # required after the five fields; composites that just need "cron schedules
  # this" reference this rather than picking one of the two by hand.
  - id: source-cron-schedule-entry
    desc: Recurring Unix cron schedule
    crit: notable
    conf: 0.92
    for: [scripts, source]
    any:
      - id: source-cron-schedule-entry-command
      - id: source-cron-schedule-entry-string
  - id: crontab-wildcard-entry
    desc: Wildcard crontab entry with command
    crit: notable
    conf: 0.85
    for: [scripts, source, binaries]
    any:
      - id: crontab-wildcard-entry-command
      - id: crontab-wildcard-entry-string
  - id: cron-schedule-entry
    desc: Unix cron schedule entry
    crit: notable
    conf: 0.92
    for: [scripts, source]
    any:
      - id: shell-cron-schedule-entry
      - id: source-cron-schedule-entry
