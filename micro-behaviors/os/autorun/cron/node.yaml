defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-crontab-input-pipeline
    desc: Executes pipeline into crontab input
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)execSync$'
      arg:
        index: 0
        regex: '\|\s*crontab\s+-(\s|$)'
