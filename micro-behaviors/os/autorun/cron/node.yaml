defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-crontab-input-pipeline
    desc: Executes pipeline into crontab input
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)execSync$'
      arg:
        index: 0
        regex: '\|\s*crontab\s+-(\s|$)'
  - id: node-crontab-variable-file-command
    desc: Node exec constructs crontab file command
    crit: component
    if:
      type: text
      regex: '\bexec(Sync)?\s*\(\s*["'']crontab\s+["'']\s*\+'

composite_rules:
  - id: node-reboot-crontab-file-indicators
    desc: Node reboot entry and crontab install text
    conf: 0.9
    all:
      - id: node-crontab-variable-file-command
      - id: micro-behaviors/os/autorun/cron::echo-reboot
