defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
  - id: cron-reference-clues
    desc: Cron path or crontab keyword
    crit: notable
    any:
      - id: micro-behaviors/os/autorun/cron::crontab-keyword
      - id: micro-behaviors/fs/path/config/scheduled::etc-cron-path
    unless:
      - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
      - id: well-known/app/infrastructure/ansible::ansible-python-package-path
      - id: well-known/app/productivity/notepad-plus-plus/
      - id: well-known/lib/web/authoring/syntaxhighlighter::prismjs-core
