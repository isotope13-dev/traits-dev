# A system-wide cron entry (/etc/crontab, /etc/cron.d drop-in) carries a user
# field between the schedule and the command, unlike a per-user crontab line.
# An entry whose user field is `root` schedules the command to run as uid=0.
# This is the structural artifact the Syncrify PublicLink traversal plants, and
# the one defenders are told to alert on ("any new file in a scheduler
# directory whose content includes a user field of root"). The fact is neutral
# on its own — distro packages ship such lines — so the objective composites
# decide intent from the delivery (path traversal) or the command (reverse or
# download shell).
defaults:
  platforms: [unix]
  for: [shell, scripts, source, python]
  attack: T1053.003

# Keep macro names grammatical: JSDoc's `@param root The...` is not cron.
traits:
  - id: numeric-system-cron-root-entry
    desc: Numeric cron schedule with root user field
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '([\d*/,\-]+[ \t]+){4}[\d*/,\-]+[ \t]+root[ \t]+\S'
      exclude_docstrings: true

  - id: short-macro-system-cron-root-entry
    desc: Root cron entry with short schedule macro
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '(?i)@(reboot|hourly|daily|weekly)[ \t]+root[ \t]+\S'
      exclude_docstrings: true

  - id: long-macro-system-cron-root-entry
    desc: Root cron entry with calendar schedule macro
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '(?i)@(monthly|yearly|annually|midnight)[ \t]+root[ \t]+\S'
      exclude_docstrings: true

composite_rules:
  - id: system-cron-root-user-field-entry
    desc: System cron entry runs command as root
    crit: notable
    conf: 0.9
    any:
      - id: numeric-system-cron-root-entry
      - id: short-macro-system-cron-root-entry
      - id: long-macro-system-cron-root-entry
