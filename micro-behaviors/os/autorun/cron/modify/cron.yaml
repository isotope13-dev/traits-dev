defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.5
traits:
  - id: desktop-exec-crontab-rewrite
    desc: Desktop Exec installs generated crontab
    crit: notable
    conf: 0.97
    for: [desktop-entry]
    platforms: [linux]
    if:
      type: value
      path: desktop_entry.exec
      regex: '\(crontab -l;\s*echo [^)]+\)\s*\|\s*crontab -'
  - id: desktop-exec-reboot-crontab-file
    desc: Desktop Exec installs reboot crontab file
    crit: notable
    conf: 0.99
    for: [desktop-entry]
    platforms: [linux]
    if:
      type: text
      regex: '@reboot\b[^\r\n]{0,999}\bcrontab\s+-u\s+\S+\s+/dev/shm/'
  - id: crontab-remove
    desc: Removes the current user's crontab
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bcrontab\s+-r\b'
  - id: perl-crontab-user-remove
    desc: Perl invokes crontab with removal flag
    crit: notable
    conf: 0.94
    for: [perl]
    if:
      type: text
      regex: '\bsystemcall(_silent|_or_warn)?\([^;\n]{0,40}/usr/bin/crontab[^;\n]{0,40}-u[^;\n]{0,20}-r'
  - id: crontab-echo-pipe
    desc: Pipes generated entries into crontab
    crit: notable
    conf: 0.9
    for: [shell, python, ruby, perl]
    if:
      type: text
      regex: '(echo|printf).{0,140}(\n.{0,24})?\|\s*crontab\b|crontab.{0,40}(echo|printf)'
    unless:
      - id: micro-behaviors/os/security/scan/signature::scanner-module-wording-context
  - id: crontab-path-file-install
    desc: Installs crontab from path or variable
    crit: notable
    conf: 0.85
    for: [shell, python, ruby, perl, groovy]
    if:
      type: text
      regex: '\bcrontab\s+(["'']?/[^\s|;&"'']{3,60}|["'']?\$\{?\w+\}?["'']?)'
  - id: crontab-relative-file-install
    desc: Installs crontab from relative filename
    crit: notable
    conf: 0.97
    for: [shell]
    if:
      type: text
      regex: '(?m)^[ \t]*crontab[ \t]+["'']?[A-Za-z0-9_.][\w./-]{0,100}["'']?[ \t]*$'
      exclude_comments: true
  - id: crontab-list-filtered-to-file
    desc: Rewrites crontab through a filtered temp file
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '\bcrontab\s+-l[^\r\n|]{0,40}\|\s*grep\s+-v\b[^\r\n>]{0,120}>\s*\S'
  - id: crontab-filtered-removal
    desc: Removes matching entries while rewriting crontab
    crit: notable
    conf: 0.92
    for: [shell, python, ruby, perl]
    if:
      type: text
      # Trailing `\b` after `crontab -` fails at EOL (non-word then end).
      regex: '\bcrontab\s+-l\s*\|\s*grep\s+-v\b[^\r\n]{0,80}\|\s*crontab\s+-'
  - id: crontab-edit-command
    desc: crontab -e edit command
    platforms: [unix, windows]
    conf: 0.8
    for: [go, elf, macho, shell, python]
    if:
      type: text
      regex: crontab.{0,10}-e
    unless:
      - id: micro-behaviors/os/security/scan/documentation/
      - id: well-known/app/system/olares::cli-source-tree

composite_rules:
  # Language-neutral "a recurring cron schedule is present" component. The
  # shell and generic-source matchers differ only in whether a command word is
  # required after the five fields; composites that just need "cron schedules
  # this" reference this rather than picking one of the two by hand.
  - id: crontab-file-install
    desc: Installs crontab entries from a file
    crit: notable
    conf: 0.95
    for: [shell, python, ruby, perl, groovy]
    any:
      - id: crontab-path-file-install
      - id: crontab-relative-file-install
