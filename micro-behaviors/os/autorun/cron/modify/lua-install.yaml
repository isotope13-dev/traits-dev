defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-installs-crontab-file"
    desc: "Lua installs crontab from a file"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "os.execute"
      arg:
        from:
          value: "^crontab\\s"
