defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
traits:
  - id: crontab-stdin-command-string
    desc: String pipes into crontab stdin
    crit: notable
    conf: 0.95
    for: [scripts, source, -shell]
    if:
      type: literal
      regex: '\|[ \t]*crontab[ \t]+-([ \t;"\x27]|$)'
      exclude_docstrings: true
  - id: binary-crontab-stdin-command
    desc: Binary embeds crontab stdin command
    crit: notable
    conf: 0.95
    for: [binaries]
    if:
      type: text
      regex: '\|[ \t]*crontab[ \t]+-([ \t;"\x27]|$)'
  - id: shell-crontab-stdin-call
    desc: Shell invokes crontab with stdin input
    crit: notable
    conf: 0.98
    for: [shell]
    platforms: [unix]
    if:
      type: tree-sitter
      query: |
        ((command name: (command_name) @install argument: (word) @input)
        (#eq? @install "crontab")
        (#eq? @input "-"))
        ; Bash can attach the standalone dash to the following redirection,
        ; outside the command span. Confirm the final callee and parent text.
        ((redirected_statement body: (pipeline
          (command name: (command_name) @install) .)) @statement
        (#eq? @install "crontab")
        (#match? @statement "\\|[ \\t]*crontab[ \\t]+-([ \\t;]|$)"))

composite_rules:
  - id: shell-stdin-install
    desc: Crontab stdin installation command
    crit: notable
    conf: 0.95
    any:
      - id: crontab-stdin-command-string
      - id: binary-crontab-stdin-command
      - id: shell-crontab-stdin-call
