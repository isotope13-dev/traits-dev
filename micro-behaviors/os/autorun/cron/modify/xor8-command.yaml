# The unpacked ELF keeps command text under a repeating eight-byte XOR key.
# XORing neighboring qwords cancels that key. Two independent equalities
# recognize 24 command bytes without pinning the key, family, name or C2.
# Parsed literals/encoded facts do not recover these native XOR strings.
# Only data sections are searched; encrypted data is not claimed executed.
defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: xor8-crontab-delete-command
    desc: XOR8 crontab deletion command
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "elf"
        rule xor8_crontab_delete_command {
          condition:
            for any s in elf.sections : (
              (s.name == ".rodata" or s.name == ".data" or s.name == ".tdata") and
              s.size >= 24 and
              for any p in (s.offset..s.offset+s.size-24) : (
                uint64(p) != 0x206261746e6f7263 and
                uint64(p) ^ uint64(p+8) == 0x5607055b504f004e and
                uint64(p) ^ uint64(p+16) == 0x1e504118021a1c4c
              )
            )
        }
