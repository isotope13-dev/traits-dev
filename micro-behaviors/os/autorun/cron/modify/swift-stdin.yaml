defaults:
  platforms: [unix]
  for: [swift]
traits:
  - id: swift-crontab-stdin-configuration
    desc: Swift configures crontab to read stdin
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        (_
          (property_declaration
            name: (pattern bound_identifier: (simple_identifier) @binding)
            value: (call_expression (simple_identifier) @constructor))
          (assignment
            target: (directly_assignable_expression
              (navigation_expression target: (simple_identifier) @path_receiver
                suffix: (navigation_suffix suffix: (simple_identifier) @path_property)))
            result: (line_string_literal) @path)
          (assignment
            target: (directly_assignable_expression
              (navigation_expression target: (simple_identifier) @args_receiver
                suffix: (navigation_suffix suffix: (simple_identifier) @args_property)))
            result: (array_literal element: (line_string_literal) @argument))
          (#eq? @constructor "Process")
          (#eq? @binding @path_receiver)
          (#eq? @binding @args_receiver)
          (#eq? @path_property "launchPath")
          (#eq? @args_property "arguments")
          (#match? @path "^\"/(usr/)?bin/crontab\"$")
          (#eq? @argument "\"-\""))
