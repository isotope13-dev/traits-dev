defaults:
  platforms: [unix]
  for: [lua]
traits:
  - id: lua-crontab-modification-call
    desc: Lua invokes a crontab modification command
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(os\.execute|io\.popen|luci\.sys\.(call|exec))$'
      arg:
        index: 0
        kind: string
        regex: 'crontab\s+(-[eir]\b|-(\s|$))|\|\s*crontab\b'
