defaults:
  platforms: [unix, android, ios]
  for: [shell]
traits:
  - id: cron-entry-downloader-shell
    desc: Cron entry pipes downloader output to shell
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '([0-9*]{1,2}|\*/\d{1,2}) +\* +\* +\* +\*.{0,80}(https?://|curl |wget ).{0,48}\| *(ba)?sh'
    unless:
      - id: metadata/file/format/security-corpus::labeled-action-benchmark
  - id: cron-entry-download-execute-shell
    desc: Cron entry downloads and executes shell script
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '([0-9*,-/]+\s+){5}(curl|wget)\b.{0,60}[;&]+\s*(ba)?sh\b'
    unless:
      - id: metadata/file/format/security-corpus::labeled-action-benchmark
