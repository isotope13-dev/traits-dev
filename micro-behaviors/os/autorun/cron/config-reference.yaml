defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

composite_rules:
  - id: cron-config-or-command-reference
    desc: Cron configuration path or crontab option
    crit: notable
    any:
      - id: micro-behaviors/fs/path/config/system::cron-d-path-reference
      - id: micro-behaviors/fs/path/config/system::var-spool-cron-path
      - id: micro-behaviors/os/autorun/cron::crontab-option
  - id: cron-download-command-reference
    desc: Cron reference with quiet download command
    crit: notable
    conf: 0.85
    near_lines: 6
    all:
      - id: micro-behaviors/os/autorun/cron::cron-config-or-command-reference
    any:
      - id: micro-behaviors/communications/http/curl::curl-s-flag
      - id: micro-behaviors/communications/http/download/cli::wget-q-flag
