defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: reboot-hidden-file-relaunch-command
    desc: Reboot job chmods and relaunches hidden file
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '@reboot[^\n]{0,500};chmod 777 \.[^;]{1,24};\(while (true|:);do \./\.'
      section: .rodata
