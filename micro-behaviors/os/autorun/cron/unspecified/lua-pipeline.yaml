defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-crontab-pipeline-command"
    desc: "Lua passes a crontab replacement pipeline"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      regex: ".+"
      arg:
        from:
          value: "^crontab\\s+-l"
  - id: "lua-recurring-fetch-shell-command"
    desc: "Lua schedules recurring HTTP-to-shell command"
    crit: "notable"
    conf: 0.96
    if:
      type: "literal"
      regex: "\\*/\\d+\\s+\\*\\s+\\*\\s+\\*\\s+\\*\\s+curl\\b"
  - id: "lua-fetch-shell-pipe-fragment"
    desc: "Lua literal pipes HTTP fetch to shell"
    crit: "notable"
    conf: 0.96
    if:
      type: "literal"
      regex: "\\|\\s*/bin/sh\\b"
