# Co-occurrence in native source; not proof of registration or unwanted access.
defaults:
  platforms: [unix]
  for: [c, cpp, objc]
composite_rules:
  - id: native-crontab-curl-shell-text
    desc: Native text combines crontab and curl-to-shell
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/autorun/cron/unspecified::crontab-string
      - id: micro-behaviors/communications/http/download/curl::curl-silent-fail-flags-embedded-text
    any:
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-absolute-shell-path
    # Proximity bounds the co-occurrence; it does not establish data flow.
    near_bytes: 512
    unless:
      - id: metadata/package/documentation/security-exercise::assessment-playbook-examples
