defaults:
  platforms: [unix]
  for: [php]
traits:
  - id: php-crontab-pipe-command
    desc: PHP text pipes into crontab command
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      regex: '(?i)\|\s*crontab\b'
  - id: php-crontab-absolute-command
    desc: PHP text references absolute crontab command
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      regex: '(?i)/usr/(local/)?bin/crontab\b'
  - id: php-crontab-argument-command
    desc: "PHP text invokes crontab with command args"
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      # `-l`, `-e` and `-r` list, edit and remove a crontab; only
      # `crontab <file>`, `crontab -` (stdin) and `crontab -u <user> <file>`
      # install one. AVideo's getValidCrontabLines() runs
      # `shell_exec('crontab -l')` to show scheduled jobs in its admin UI, and
      # that read plus any file write elsewhere in the same 235 KB
      # objects/functions.php scored the package hostile. This has to be
      # excluded in the pattern, not a `not:`: the span the bare `-` alternative
      # captures is just `crontab -`, so a span-scoped exclusion never sees the
      # `l` that would distinguish it.
      regex: '(?i)\bcrontab\s+(-[^ler]|/|\w+\.)'
  - id: php-etc-cron-path-string
    desc: PHP string names an /etc/cron persistence target
    crit: notable
    conf: 0.86
    if:
      type: string_literal
      regex: '(?i)(^|[^A-Za-z0-9_])/etc/cron([./]|$)'
  - id: php-var-spool-cron-path-string
    desc: PHP string names a cron spool target
    crit: notable
    conf: 0.86
    if:
      type: string_literal
      regex: '(?i)(^|[^A-Za-z0-9_])/var/spool/cron(/|$)'
composite_rules:
  - id: php-cron-path-or-command
    desc: PHP cron path or command reference
    crit: notable
    conf: 0.86
    any:
      - id: php-etc-cron-path-string
      - id: php-var-spool-cron-path-string
      - id: php-crontab-command-text
  - id: php-crontab-command-text
    desc: PHP crontab command text
    crit: notable
    conf: 0.82
    any:
      - id: php-crontab-pipe-command
      - id: php-crontab-absolute-command
      - id: php-crontab-argument-command
