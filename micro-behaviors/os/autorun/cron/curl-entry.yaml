defaults:
  platforms: [linux, macos]
  for: [shell, python, ruby, perl, javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: cron-curl-shell-entry
    desc: Cron entry contains curl-to-shell pipeline
    if:
      type: text
      regex: '(@reboot[ \t]+|([\d*/,-]+\s+){5})curl[^\r\n"'']{0,160}\|[ \t]*(ba)?sh\b'
