defaults:
  platforms: [windows, unix]
  for: [go, elf, macho, shell, python]

traits:
  - id: crontab-at-reboot
    desc: Cron entry uses the reboot directive
    crit: notable
    conf: 0.9
    if:
      # Match a cron entry's macro line, not parser prose such as
      # `case "@reboot"` or `@reboot is not supported`.
      type: text
      regex: '(?m)(^|[;\n])[ \t]*@reboot[ \t]+\S'
