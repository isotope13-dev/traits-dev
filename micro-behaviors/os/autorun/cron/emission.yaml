defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: echo-reboot
    desc: echo @reboot cron command
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\becho\s+["']?@reboot\s+
  - id: echo-cron-fields
    desc: Echo emits five numeric cron fields
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \becho\s+["']?([0-9\*/,\-]+\s+){4}[0-9\*/,\-]+\s+
  - id: guarded-reboot-check
    desc: Grep checks for reboot cron entries
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: "grep '@reboot"
composite_rules:
  - id: echo-command
    desc: Echo emits cron schedule fields
    crit: notable
    conf: 0.5
    any:
      - id: echo-reboot
      - id: echo-cron-fields
  - id: crontab-append-pipeline
    for: [shell, python, javascript, ruby, php, lua, perl, applescript]
    desc: Appends to crontab by piping
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/autorun/cron::crontab-string
      - id: echo-command
      - id: shell-stdin-install
    unless:
      - id: micro-behaviors/fs/path/location::jenkins-cron-installer-path
      - id: micro-behaviors/fs/path/location::home-cleanup-cron-script
      - id: guarded-reboot-check
      - id: micro-behaviors/fs/path/location::xenserver-telemetry-cron-marker
