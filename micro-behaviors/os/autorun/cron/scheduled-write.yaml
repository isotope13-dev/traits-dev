defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: echo-system-cron-file
    desc: Echo redirects output into system cron
    if:
      type: text
      regex: 'echo[^\n]{0,250}>{1,2}\s*/etc/cron[./]'
composite_rules:
  - id: echo-cron-file-write
    desc: Echo writes a scheduled job into system cron
    all:
      - id: echo-system-cron-file
      - id: micro-behaviors/os/autorun/cron::echo-cron-fields
    near_lines: 1
