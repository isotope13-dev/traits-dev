# A schedule assembled separately from its command is still a cron capability.
# Require the entire literal to be exactly five numeric/wildcard cron fields.
defaults:
  platforms: [unix]
  for: [scripts, source]

traits:
  - id: cron-schedule-fields-literal
    desc: String contains five cron schedule fields
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '^([\d*/,\-]+[ \t]+){4}[\d*/,\-]+$'
      exclude_docstrings: true

  - id: cron-scheduled-command-literal
    desc: String contains cron schedule and command
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '^([\d*/,\-]+[ \t]+){5}\S[^\r\n]{0,512}$'
      exclude_docstrings: true
