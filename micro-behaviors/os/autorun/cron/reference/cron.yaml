defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.5
traits:
  - id: go-crontab-command-literal
    desc: Go embeds a crontab command
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: string_literal
      word: crontab
  - id: go-exec-crontab-command
    desc: Go runs the crontab command
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'exec\.Command\(\s*"crontab"'
  - id: crontab-keyword
    desc: Contains crontab keyword
    # A bare prose/API keyword is not an autorun action. Keep concrete
    # crontab commands and wildcard entries notable below.
    crit: component
    platforms: [unix, windows]
    for: [scripts, binaries, groovy]
    if:
      type: text
      word: crontab
  - id: crontab-option
    desc: crontab command option
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '\bcrontab\s+-[A-Za-z][A-Za-z-]*\b'
  - id: crontab-string
    desc: Crontab list or input command
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      regex: '(\bcrontab\s*-[lr]\b|[|]\s*crontab\s*-(\s|["'']|$))'
