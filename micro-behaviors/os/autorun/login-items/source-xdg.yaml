defaults:
  crit: notable
  platforms: [unix]
  for: [c, ruby, elf, python]
  attack: T1547.013

composite_rules:
  - id: source-xdg-autostart-entry-reference
    desc: XDG autostart path near Desktop Entry header
    conf: 0.94
    near_bytes: 512
    all:
      - id: micro-behaviors/os/autorun/login-items::xdg-user-autostart-path
      - id: micro-behaviors/os/autorun/login-items::desktop-entry-header

  - id: source-hidden-xdg-autostart-entry
    desc: Hidden Desktop Entry with XDG autostart path
    # NoDisplay=true is useful for tray agents and other background GUI
    # applications; Terminal=false only suppresses a console window and is
    # not evidence of concealment.  Keep this as an analyst-visible
    # persistence capability, not an automatic malware conviction.
    conf: 0.9
    all:
      - id: source-xdg-autostart-entry-reference
      - id: micro-behaviors/os/autorun/login-items::embedded-desktop-entry-exec
    any:
      - id: micro-behaviors/os/autorun/login-items::source-nodisplay-desktop-entry
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
