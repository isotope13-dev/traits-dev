defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: self-deleting-copy-run-script-references
  desc: Self-deleting VBS copy and Run-key statements
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |
      rule self_deleting_copy_run_script_references {
        strings:
          $copy = /[A-Za-z][A-Za-z0-9_]{0,23}\.CopyFile[ \t]/ wide ascii nocase
          $reg = /[A-Za-z][A-Za-z0-9_]{0,23}\.regwrite[ \t]/ wide ascii nocase
          $run = "\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\" wide ascii nocase
          $delete = /[A-Za-z][A-Za-z0-9_]{0,23}\.DeleteFile WScript\.ScriptFullName/ wide ascii nocase
        condition:
          all of them
      }
