defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: auto-launch-enable-call
    desc: Calls an auto-launch enable method
    if:
      type: symbol
      kind: call
      regex: '\.autoLaunch\.enable$'

  - id: auto-launch-disable-call
    desc: Calls an auto-launch disable method
    if:
      type: symbol
      kind: call
      regex: '\.autoLaunch\.disable$'

  - id: auto-launch-setter-identifier
    desc: Auto-launch setter API identifier
    if:
      type: symbol
      kind: identifier
      exact: setAutoLaunch

  - id: auto-launch-status-identifier
    desc: Auto-launch status API identifier
    if:
      type: symbol
      kind: identifier
      exact: isAutoLaunchEnabled

composite_rules:
  - id: auto-launch-toggle-controls
    desc: Desktop helper exposes both auto-launch controls
    crit: exception
    all:
    - id: desktop-entry-header
    - id: auto-launch-controls-pair
    any:
    - id: xdg-user-autostart-path
    - id: xdg-config-home-autostart-path
  - id: auto-launch-controls-pair
    desc: Desktop helper exposes auto-launch controls
    crit: exception
    any:
      - id: auto-launch-method-pair
      - id: auto-launch-setter-status-pair

  - id: auto-launch-method-pair
    desc: Desktop helper exposes enable and disable calls
    crit: exception
    all:
      - id: auto-launch-enable-call
      - id: auto-launch-disable-call

  - id: auto-launch-setter-status-pair
    desc: Desktop helper names setter and status APIs
    crit: exception
    all:
      - id: auto-launch-setter-identifier
      - id: auto-launch-status-identifier
