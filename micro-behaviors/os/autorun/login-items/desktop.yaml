defaults:
  platforms: [unix]
  for: [binaries, scripts, c, cpp, go, typescript]
  attack: T1547.013

traits:
  # Canonical atom for the per-user XDG autostart directory. Naming the
  # directory is a complete, analyst-relevant observation (a login persistence
  # surface), so it is notable rather than a fragment; desktop-environment
  # setup tools legitimately offer to install an entry there.
  - id: xdg-user-autostart-path
    desc: References an XDG user autostart path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .config/autostart

  - id: xdg-system-autostart-path
    desc: References the system XDG autostart path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /etc/xdg/autostart

  - id: package-build-root-autostart-path
    desc: Package build root XDG autostart path
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '(?i)\$\{?[A-Z0-9_]*(ROOT|PKGDIR)\}?/etc/xdg/autostart/'

  - id: xdg-config-home-autostart-path
    desc: Constructs an XDG config autostart path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'XDG_CONFIG_HOME.{0,50}autostart'

  - id: source-nodisplay-desktop-entry
    desc: Source embeds a hidden desktop entry
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'NoDisplay=true[\s\S]{0,260}Exec='

  - id: gnome-autostart-enabled-marker
    desc: X-GNOME-Autostart-enabled desktop flag
    crit: notable
    conf: 0.9
    platforms: [qnx, unix]
    for: [elf, macho, class, pyc, beam, wasm, shell, python, javascript, java, ruby, c, go, php, lua, perl, applescript, static-lib]
    if:
      type: text
      substr: X-GNOME-Autostart-enabled=true

  - id: launch-at-login-label
    desc: Launch-at-login user interface label
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Launch at Login
      case_insensitive: true

  - id: start-app-on-login-label
    desc: Start-app-on-login user interface label
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Start app on login
      case_insensitive: true

  - id: open-at-login-label
    desc: Open-at-login user interface label
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Open at Login
      case_insensitive: true

  # `auto-launch` is the npm package Electron applications use to implement
  # exactly the setting the labels above name. Its whole API is `enable()` /
  # `disable()` driven by a checkbox, and its Linux backend writes the XDG
  # autostart entry -- so the library file carries the mechanism while the
  # user-facing label lives in the application's own bundle, often a separate
  # asar. Element ships `auto-launch` in app.asar and the setting text in
  # webapp.asar, so no label trait could ever co-occur with the path.
  - id: auto-launch-package-path
    desc: auto-launch npm package path
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: path
      regex: 'auto-launch/dist/AutoLaunch'

composite_rules:
  - id: gtk-desktop-autostart-installer-context
    desc: GTK source installs user login autostart entry
    crit: exception
    all:
      - id: micro-behaviors/process/create/launch::embedded-desktop-entry-exec-field
      - id: xdg-user-autostart-path
      - id: gnome-autostart-enabled-marker

  - id: user-controlled-xdg-autostart
    desc: Application exposes a user-controlled XDG login-start setting
    crit: exception
    # Desktop applications commonly keep the menu label and platform-specific
    # XDG implementation in separate source files within the same input.
    scope: outer
    all:
      - id: xdg-user-autostart-path
    any:
      - id: launch-at-login-label
      - id: start-app-on-login-label
      - id: open-at-login-label
      - id: auto-launch-package-path
