defaults:
  platforms:
  - ios
  - unix
  for:
  - macho
traits:
- id: session-loginitems-key-reference
  desc: References legacy macOS Login Items session key
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: kLSSharedFileListSessionLoginItems
- id: lssharedfilelist-insert-item
  desc: 'lssharedfilelist insert item'
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: LSSharedFileListInsertItemURL
- id: smappservice-import
  desc: Imports macOS SMAppService login-item API
  crit: notable
  conf: 0.95
  for: [python]
  platforms: [macos]
  if:
    type: import
    exact: SMAppService
- id: sm-login-item-set-enabled-call
  desc: References macOS login-item API
  crit: notable
  conf: 0.95
  platforms: [macos]
  if:
    type: symbol
    exact: SMLoginItemSetEnabled
- id: loginwindow-preference-domain
  desc: macOS loginwindow preferences domain
  crit: notable
  conf: 0.95
  for: [macho, c, shell, scripts, plist]
  platforms: [macos]
  if:
    type: text
    regex: 'com\.apple\.loginwindow(\.plist)?'
