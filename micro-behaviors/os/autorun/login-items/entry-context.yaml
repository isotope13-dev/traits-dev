composite_rules:
- platforms:
  - linux
  - macos
  for:
  - elf
  - shell
  - python
  - javascript
  - ruby
  - c
  - go
  - php
  id: xdg-autostart-entry-reference
  desc: XDG autostart path near embedded desktop entry
  crit: notable
  conf: 0.9
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/autorun/login-items::desktop-entry-header
  any:
  - id: micro-behaviors/os/autorun/login-items::xdg-user-autostart-path
  - id: micro-behaviors/os/autorun/login-items::xdg-system-autostart-path
  - id: micro-behaviors/os/autorun/login-items::xdg-config-home-autostart-path
  unless:
  - id: micro-behaviors/os/autorun/login-items::user-controlled-xdg-autostart
  - id: micro-behaviors/os/autorun/login-items::auto-launch-toggle-controls
