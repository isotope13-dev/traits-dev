---
defaults:
  platforms:
  - windows
  crit: notable
composite_rules:
- id: generated-reg-file-run-key-install
  for:
  - batch
  - ne
  desc: Generated registry file with Run-key import
  conf: 0.94
  all:
  - id: micro-behaviors/fs/write/file/redirect::echo-file-output-or-regedit-header
  - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
  - id: micro-behaviors/os/registry/write::regedit-silent-import
- id: ruby-run-key-command-registration
  for:
  - ruby
  desc: Ruby executes Run-key registration command
  conf: 0.98
  unless:
  - id: metadata/package/testing/presence/path::benign-testdata-directory-path
  all:
  - id: micro-behaviors/process/create/system::system-process-call
  any:
  - id: micro-behaviors/os/registry/write::ruby-system-run-key-command
  - id: micro-behaviors/os/registry/write::ruby-system-run-key-argv
- id: vbs-wscript-run-key-registration
  for:
  - vbs
  desc: VBScript registers wscript through Run key
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/write::regwrite-run-wscript-command
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
