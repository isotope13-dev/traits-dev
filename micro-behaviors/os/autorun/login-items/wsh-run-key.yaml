# A Run-key reference plus a WSH executable is not AgentHub identity.
defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: wsh-run-key-reference
    desc: Run-key path alongside Windows Script Host
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/registry/keys::windows-run-key-path
      - id: micro-behaviors/fs/path/application/executable::windows-script-host-executable-reference
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
