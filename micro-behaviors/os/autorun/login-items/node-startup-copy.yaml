defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: js-joined-startup-script-copy
    desc: Copies script to a constructed Startup path
    crit: notable
    conf: 0.97
    # Declarations may use var, let, or const. Bind the destination in both
    # inline joins and separately declared paths; async copies use the same sink.
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (_ (variable_declarator
            name: (identifier) @folder
            value: (call_expression
              function: (member_expression property: (property_identifier) @join)
              arguments: (arguments
                (string (string_fragment) @menu) .
                (string (string_fragment) @programs) .
                (string (string_fragment) @startup)))))
          (expression_statement (call_expression
            function: (member_expression property: (property_identifier) @copy)
            arguments: (arguments (_) . (call_expression
              function: (member_expression property: (property_identifier) @join2)
              arguments: (arguments . (identifier) @folder_use .
                (string (string_fragment) @script) .))))))
          (#eq? @join "join") (#eq? @join2 "join")
          (#eq? @menu "Start Menu") (#eq? @programs "Programs")
          (#eq? @startup "Startup") (#eq? @folder @folder_use)
          (#match? @copy "^copyFile(Sync)?$")
          (#match? @script "\\.(vbs|js|cmd|bat|ps1)$")) @installation
        (statement_block
          (_ (variable_declarator
            name: (identifier) @folder
            value: (call_expression
              function: (member_expression property: (property_identifier) @join)
              arguments: (arguments
                (string (string_fragment) @menu) .
                (string (string_fragment) @programs) .
                (string (string_fragment) @startup)))))
          (_ (variable_declarator
            name: (identifier) @destination
            value: (call_expression
              function: (member_expression property: (property_identifier) @join2)
              arguments: (arguments (identifier) @folder-use .
                (string (string_fragment) @script)))))
          (expression_statement (call_expression
            function: (member_expression property: (property_identifier) @copy)
            arguments: (arguments (_) . (identifier) @destination-use)))
          (#eq? @join "join")
          (#eq? @join2 "join")
          (#eq? @menu "Start Menu")
          (#eq? @programs "Programs")
          (#eq? @startup "Startup")
          (#match? @script "\\.(vbs|js|cmd|bat|ps1)$")
          (#match? @copy "^copyFile(Sync)?$")
          (#eq? @folder @folder-use)
          (#eq? @destination @destination-use)) @installation
  - id: js-startup-path-under-appdata
    desc: Startup folder path uses APPDATA
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)process\.env\.APPDATA.{0,120}["'']Startup["'']'
  - id: js-batch-path-joined-to-startup-dir
    desc: Batch path joins the Startup directory
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)startupBat\s*=\s*join\(\s*startupDir\s*,\s*`[^`]{0,80}\.bat`'
  - id: js-write-startup-batch-file
    desc: Writes batch content to Startup path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)writeFileSync\(\s*startupBat\s*,\s*batContent\s*\)'

composite_rules:
  - id: js-writes-batch-to-startup-folder
    desc: Writes a batch file into Startup
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/os/autorun/login-items::js-startup-path-under-appdata
      - id: micro-behaviors/fs/write/file/content::js-file-write
    any:
      - id: micro-behaviors/data/format/script::embedded-batch-script-header
      - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
      - id: micro-behaviors/os/autorun/login-items::js-batch-path-joined-to-startup-dir
