# A Run-key success diagnostic, own-path lookup, registry/file APIs and a runas
# token describe autorun registration with an elevation reference. They neither
# bind the looked-up path to the written value nor establish unwanted startup.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: hklm-run-write-with-runas-reference
    desc: HKLM Run write diagnostic with runas reference
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/registry/manipulate::own-image-hklm-run-write-success
      - id: micro-behaviors/os/privilege/elevation::runas-verb-token
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile

  # A binary that pads its own image to change its hash and relaunches a
  # standby copy, and also registers elevated HKLM Run autostart, combines
  # hash-based detection evasion with privileged persistence. Legitimate
  # updaters replace their image; they do not mutate it to change its hash.
  - id: self-mutating-elevated-run-autostart
    desc: Self-hash-rotating binary with elevated HKLM Run autostart
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: hklm-run-write-with-runas-reference
