defaults:
  platforms: [unix]
  # Keep this to the source families that have existing XDG persistence
  # composites; a broad group expansion would exceed the text-matcher cap.
  for: [elf, shell, python, javascript, typescript, go, c, cpp, php, ruby]

traits:
  # A header fragment is only evidence that source or an embedded resource
  # contains a desktop-entry record. Persistence requires the separate XDG
  # path and write-operation atoms in objective composites.
  - id: desktop-entry-header
    desc: Embedded Desktop Entry header fragment
    crit: component
    conf: 0.6
    if:
      type: text
      substr: '[Desktop Entry]'
