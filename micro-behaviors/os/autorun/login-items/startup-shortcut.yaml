# Shortcut registration alone establishes autostart, not unwanted persistence.
defaults:
  platforms: [windows]
composite_rules:
- id: shortcut-creation-startup-reference
  desc: Shortcut creation alongside Windows Startup reference
  crit: notable
  conf: 0.95
  for: [powershell, javascript, go, html]
  all:
  - id: micro-behaviors/fs/file/create::shortcut-creation
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/fs/path/autostart::windows-startup-folder-reference
  any:
  - id: micro-behaviors/fs/file/create::shortcut-target-path
  - id: micro-behaviors/fs/file/create::shortcut-save
