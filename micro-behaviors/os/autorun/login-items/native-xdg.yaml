# A packed Go string pool may not expose this pathname as a text run.
defaults:
  platforms: [unix]
  for: [elf]
traits:
  - id: native-xdg-autostart-path
    desc: Native binary references XDG autostart path
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "2E 63 6F 6E 66 69 67 2F 61 75 74 6F 73 74 61 72 74"
      section: rodata
