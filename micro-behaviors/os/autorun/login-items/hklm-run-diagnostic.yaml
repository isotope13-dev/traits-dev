defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable

traits:
  - id: hklm-run-set-diagnostic
    desc: Diagnostic reports setting HKLM Run autostart
    conf: 0.96
    if:
      type: text
      regex: '(?i)autostart: HKLM Run set\s*->'

composite_rules:
  # Hash mutation plus Run registration does not establish malicious
  # persistence or an attack on antivirus. Keep the unusual mutation in its
  # suspicious capability trait and report this registration neutrally.
  - id: native-standby-self-mutation-run-key
    desc: Hash-rotation diagnostics with HKLM Run registration
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: hklm-run-set-diagnostic
