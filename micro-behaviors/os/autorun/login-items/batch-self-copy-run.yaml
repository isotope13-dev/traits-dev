defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: micro-behaviors/os/autorun/login-items::systemroot-self-copy-wrapper-run-entry
  desc: Run entry names the self-copied script wrapper
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule systemroot_self_copy_wrapper_run_entry {\n strings:\n$mown = /call:[A-Za-z_][A-Za-z0-9_]{0,23}\
      \ \"%~dpnx0\" \"%systemroot%\\\\\"/ nocase\n$head = /call:[A-Za-z_][A-Za-z0-9_]{0,23} / nocase\n$copydef =\
      \ /:[A-Za-z_][A-Za-z0-9_]{0,23}\\r?\\n([^:\\r\\n]{0,240}\\r?\\n){0,3}copy \"%~1\" \"%~dp2\"\\r?\\nattrib \"\
      %~1\" \\+s \\+h\\r?\\nattrib \"%~dp2%~nx1\" \\+s \\+h\\r?\\ngoto :eof/ nocase\n$mvb = /call:[A-Za-z_][A-Za-z0-9_]{0,23}\
      \ >\"%systemroot%\\\\%~n0\\.vbe\"/ nocase\n$vbdef = /:[A-Za-z_][A-Za-z0-9_]{0,23}\\r?\\necho\\.set [A-Za-z_][A-Za-z0-9_]{0,23}=wscript\\\
      .createobject\\(\"wscript\\.shell\"\\)\\r?\\necho\\.[A-Za-z_][A-Za-z0-9_]{0,23}\\.run \"%~nx0 \\/start\",0\\\
      r?\\ngoto :eof/ nocase\n$obj = /echo\\.set [A-Za-z_][A-Za-z0-9_]{0,23}=/ nocase\n$run = /echo\\.[A-Za-z_][A-Za-z0-9_]{0,23}\\\
      .run/ nocase\n$reg = /reg add (HKEY_LOCAL_MACHINE|HKLM)\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\
      \\Run \\/v [A-Za-z_][A-Za-z0-9_]{0,23} \\/t REG_SZ \\/d \"%systemroot%\\\\%~n0\\.vbe\" \\/f/ nocase\n condition:\n\
      #mown > 0 and #mown <= 32 and #head > 0 and #head <= 32 and #copydef > 0 and #copydef <= 32 and #mvb > 0 and\
      \ #mvb <= 32 and #vbdef > 0 and #vbdef <= 32 and #obj > 0 and #obj <= 32 and #run > 0 and #run <= 32 and #reg\
      \ > 0 and #reg <= 32 and\nfor any c in (1..#mown) : (\nfor any ch in (1..#head) : (\nfor any cd in (1..#copydef)\
      \ : (\nfor any v in (1..#mvb) : (\nfor any vh in (1..#head) : (\nfor any vd in (1..#vbdef) : (\nfor any o\
      \ in (1..#obj) : (\nfor any r in (1..#run) : (\nfor any z in (1..#reg) : (\n(@mown[c] == 0 or uint8(@mown[c]-1)\
      \ == 10) and\n@head[ch] == @mown[c] and\n(@copydef[cd] == 0 or uint8(@copydef[cd]-1) == 10) and (uint8(@copydef[cd]+1+(!head[ch]-6))\
      \ == 13 or uint8(@copydef[cd]+1+(!head[ch]-6)) == 10) and (!head[ch]-6) == (!head[ch]-6) and for all k in\
      \ (0..(!head[ch]-6)-1) : ((uint8(@head[ch]+5+k) | 32) == (uint8(@copydef[cd]+1+k) | 32)) and\n(@mvb[v] ==\
      \ 0 or uint8(@mvb[v]-1) == 10) and\n@head[vh] == @mvb[v] and\n(@vbdef[vd] == 0 or uint8(@vbdef[vd]-1) == 10)\
      \ and (uint8(@vbdef[vd]+1+(!head[vh]-6)) == 13 or uint8(@vbdef[vd]+1+(!head[vh]-6)) == 10) and (!head[vh]-6)\
      \ == (!head[vh]-6) and for all k in (0..(!head[vh]-6)-1) : ((uint8(@head[vh]+5+k) | 32) == (uint8(@vbdef[vd]+1+k)\
      \ | 32)) and\n@obj[o] > @vbdef[vd] and @obj[o]+!obj[o] < @vbdef[vd]+!vbdef[vd] and\n(@obj[o] == 0 or uint8(@obj[o]-1)\
      \ == 10) and\n@run[r] > @obj[o] and @run[r]+!run[r] < @vbdef[vd]+!vbdef[vd] and\n(@run[r] == 0 or uint8(@run[r]-1)\
      \ == 10) and\n(!obj[o]-10) == (!run[r]-9) and for all k in (0..(!obj[o]-10)-1) : ((uint8(@obj[o]+9+k) | 32)\
      \ == (uint8(@run[r]+5+k) | 32)) and\n(@reg[z] == 0 or uint8(@reg[z]-1) == 10) and\n@mown[c] < @mvb[v] and\
      \ @mvb[v]+!mvb[v] < @reg[z] and @reg[z]-@mown[c] < 2048\n)\n)\n)\n)\n)\n)\n)\n)\n)\n}"
