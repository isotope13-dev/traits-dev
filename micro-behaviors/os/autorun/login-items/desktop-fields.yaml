defaults:
  platforms: [linux]
  for: [desktop-entry]
traits:
- id: desktop-gnome-autostart-enabled
  desc: GNOME autostart explicitly enabled
  crit: notable
  conf: 0.9
  if:
    type: value
    path: desktop_entry.x_gnome_autostart_enabled
    exact: 'true'
- id: desktop-gnome-autostart-delay
  desc: GNOME autostart delay configured
  crit: notable
  conf: 0.75
  if:
    type: value
    path: desktop_entry.x_gnome_autostart_delay
    exists: true
- id: desktop-kde-autostart-script
  desc: KDE autostart script flag
  crit: notable
  conf: 0.85
  if:
    type: value
    path: desktop_entry.x_kde_autostart_script
    exact: 'true'
- id: desktop-kde-autostart-after
  desc: KDE autostart ordering directive
  crit: notable
  conf: 0.75
  if:
    type: value
    path: desktop_entry.x_kde_autostart_after
    exists: true
- id: desktop-kde-autostart-condition
  desc: KDE autostart conditional activation
  crit: notable
  conf: 0.75
  if:
    type: value
    path: desktop_entry.x_kde_autostart_condition
    exists: true
composite_rules:
- id: desktop-autostart-enabled
  desc: Desktop Entry autostart configured
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/autorun/login-items::desktop-gnome-autostart-enabled
  - id: micro-behaviors/os/autorun/login-items::desktop-kde-autostart-script
  - id: micro-behaviors/os/autorun/login-items::desktop-kde-autostart-after
  - id: micro-behaviors/os/autorun/login-items::desktop-kde-autostart-condition
  - id: micro-behaviors/os/autorun/login-items::desktop-gnome-autostart-delay
