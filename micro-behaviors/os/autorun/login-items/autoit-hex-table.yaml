defaults:
  platforms:
  - windows
  for:
  - text
traits:
- id: autoit-hex-run-key-fallback-profile
  desc: AutoIt registry write and encoded Run key
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |
      rule autoit_clipper_run_key_fallback {
        strings:
          $write = /\bRegWrite\s*\(/ nocase
          $run = "43757272656E7456657273696F6E5C52756E" nocase
          $exists = "_TASKEXISTS (" nocase
        condition:
          all of them
      }
  attack: T1547.001
