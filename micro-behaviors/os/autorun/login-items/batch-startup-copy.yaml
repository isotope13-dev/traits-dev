# Startup installation is also used by ordinary login scripts. These observations
# establish commands and paths, without establishing unwanted reactivation.
# The former hostile self-copy composite added only a path already required by
# its atom; consolidate it into the canonical neutral observation.
defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: batch-self-copy-startup-reference
  desc: Batch self-copy command references Startup
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)copy\s+"?%~f0"?[^\r\n]{0,160}Start Menu\\Programs\\Startup

composite_rules:
- id: batch-copy-startup-reference
  desc: Batch COPY destination alongside Startup reference
  crit: notable
  conf: 0.98
  attack: T1547.001
  all:
  - id: micro-behaviors/fs/file/copy/command::batch-quoted-startup-copy-destination
  - id: micro-behaviors/fs/path/autostart::windows-startup-reference
