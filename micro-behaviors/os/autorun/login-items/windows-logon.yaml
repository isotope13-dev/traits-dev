# Neutral observations and discriminating identities.
defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
composite_rules:
- id: windows-logon-script-reference
  desc: Windows logon script configuration references
  crit: notable
  conf: 0.86
  any:
  - id: micro-behaviors/os/registry/keys::userinit-mpr-logon-script-value
  - id: micro-behaviors/fs/path/autostart::group-policy-logon-script-path
  - id: micro-behaviors/fs/path/autostart::windows-logon-script-path
  - id: micro-behaviors/fs/path/autostart::policy-system-scripts-path
