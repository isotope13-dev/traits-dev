defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: managed-startup-batch-self-launch-profile
    desc: Managed Startup batch self-launch code profile
    crit: notable
    conf: 0.95
    # Enum 7 is SpecialFolder.Startup. Require a path stored in a local,
    # then that same local used beside batch-body construction and a write.
    # Metadata names corroborate calls whose tokens remain unresolved here.
    if:
      type: yara
      source: |
        import "pe"
        rule managed_startup_batch_self_launch_profile {
          strings:
            $folder = "GetFolderPath\x00"
            $self = "get_ExecutablePath\x00"
            $write = "WriteAllText\x00"
            $combine = "Combine\x00"
            $batch = "@echo off\nstart \"\" \"" wide
            $body = { 1D 28 ?? ?? ?? 0A 72 ?? ?? ?? 70
                      28 ?? ?? ?? 0A (0A|0B|0C|0D)
                      (06|07|08|09) 72 ?? ?? ?? 70
                      28 ?? ?? ?? 0A 72 ?? ?? ?? 70
                      28 ?? ?? ?? 0A 28 ?? ?? ?? 0A }
          condition:
            all of them and
            for any i in (1..#body) : (
              uint8(@body[i] + 16) == uint8(@body[i] + 17) + 4 and
              for any s in pe.sections : (
                s.name == ".text" and
                for all of them : (
                  $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
                )
              )
            )
        }
