defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: managed-startup-batch-self-launch-profile
    desc: Managed Startup batch self-launch code profile
    crit: notable
    conf: 0.95
    # Enum 7 is SpecialFolder.Startup. Require a path stored in a local,
    # then that same local used beside batch-body construction and a write.
    # The field variant stores the Startup path in an extended local and
    # embeds a captured entry-assembly path in the batch body. Metadata names
    # corroborate calls whose tokens remain unresolved here. Neither variant
    # depends on the chosen batch filename or registry value name.
    if:
      type: yara
      source: |
        import "pe"
        rule managed_startup_batch_self_launch_profile {
          strings:
            $folder = "GetFolderPath\x00"
            $self_executable = "get_ExecutablePath\x00"
            $self_assembly = "GetEntryAssembly\x00"
            $self_location = "get_Location\x00"
            $write = "WriteAllText\x00"
            $combine = "Combine\x00"
            $batch = "@echo off\nstart \"\" \"" wide
            $body = { 1D 28 ?? ?? ?? 0A 72 ?? ?? ?? 70
                      28 ?? ?? ?? 0A (0A|0B|0C|0D)
                      (06|07|08|09) 72 ?? ?? ?? 70
                      28 ?? ?? ?? 0A 72 ?? ?? ?? 70
                      28 ?? ?? ?? 0A 28 ?? ?? ?? 0A }
            $field_body = { 1D 28 ?? ?? ?? 0A 13 ??
                            11 ?? 72 ?? ?? ?? 70 28 ?? ?? ?? 0A
                            72 ?? ?? ?? 70 11 ?? 7B ?? ?? ?? 04
                            72 ?? ?? ?? 70 28 ?? ?? ?? 0A
                            28 ?? ?? ?? 0A }
            $assembly_path = { 11 ?? 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A
                               7D ?? ?? ?? 04 }
          condition:
            $folder and $write and $combine and $batch and
            (
              ($self_executable and for any i in (1..#body) : (
                uint8(@body[i] + 16) == uint8(@body[i] + 17) + 4 and
                for any s in pe.sections : (
                  s.name == ".text" and
                  @body[i] >= s.raw_data_offset and
                  @body[i] + !body[i] <= s.raw_data_offset + s.raw_data_size and
                  $self_executable in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
                )
              )) or
              ($self_assembly and $self_location and
                for any i in (1..#field_body) : (
                  uint8(@field_body[i] + 7) == uint8(@field_body[i] + 9) and
                  for any j in (1..#assembly_path) : (
                    @assembly_path[j] < @field_body[i] and
                    @field_body[i] - @assembly_path[j] < 1024 and
                    uint8(@assembly_path[j] + 1) == uint8(@field_body[i] + 26) and
                    uint32(@assembly_path[j] + 13) == uint32(@field_body[i] + 28)
                  ) and
                  for any s in pe.sections : (
                    s.name == ".text" and
                    @field_body[i] >= s.raw_data_offset and
                    @field_body[i] + !field_body[i] <= s.raw_data_offset + s.raw_data_size and
                    $self_assembly in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1) and
                    $self_location in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
                  )
                )
              )
            ) and
            for any s in pe.sections : (
              s.name == ".text" and
              for all of ($folder, $write, $combine, $batch) : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              )
            )
        }
