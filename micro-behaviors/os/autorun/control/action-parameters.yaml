# Neutral observations and discriminating identities.
traits:
- id: scheduled-task-action-argument-option
  desc: Scheduled task action Argument parameter
  crit: notable
  conf: 0.92
  if:
    type: text
    case_insensitive: true
    regex: New-ScheduledTaskAction[^\n]{0,200}-Argument\b
- id: scheduled-task-action-execute-option
  desc: Scheduled task action Execute parameter
  crit: notable
  conf: 0.92
  if:
    type: text
    case_insensitive: true
    regex: New-ScheduledTaskAction[^\n]{0,200}-Execute\b
- id: scheduled-task-force-after-cmdlet
  desc: Force flag following scheduled task cmdlet
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: ScheduledTask\w*[^\n]{0,120}-Force\b
    case_insensitive: true
- id: register-scheduledtask-reference
  desc: Register-ScheduledTask cmdlet reference
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: Register-ScheduledTask
    case_insensitive: true
- id: schtask-execution-time-limit-zero
  desc: Scheduled task with no execution time limit
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: -ExecutionTimeLimit\s+\(\[TimeSpan\]::Zero\)
    case_insensitive: true
  unless:
    - id: well-known/app/utility/eraigosa-dotfiles/
    - id: metadata/file/extension/identity::markdown-file-basename
    - id: metadata/file/extension/identity::markdown-powershell-basename
    - id: metadata/package/documentation/
- id: schtask-trigger-periodic-repeat
  desc: Scheduled task short -RepetitionInterval
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: -RepetitionInterval\b[^\n]{0,80}-Minutes\s+([1-9]|[12]?\d|3\d)\b
    case_insensitive: true
  unless:
    - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
defaults:
  for:
  - powershell
  - batch
  - go
  platforms:
  - windows
