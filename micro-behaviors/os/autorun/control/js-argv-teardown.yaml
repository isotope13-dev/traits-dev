# Teardown verbs for per-user autostart entries, as written by Node service
# managers: spawn("schtasks", ["/End", ...]) or an argv allowlist that checks
# command === "schtasks" && args[0] === "/End". The command literal must
# precede the verb within a short window. Shell-string forms live in
# windows.yaml / service/configure.
defaults:
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: js-schtasks-end-or-delete
    desc: Ends or deletes a schtasks task
    platforms: [windows]
    attack: T1053.005
    if:
      type: text
      regex: '["'']schtasks["''][\s\S]{0,300}["'']/(End|Delete)["'']'

  - id: js-launchctl-unload
    desc: Unloads a launchd job via launchctl
    platforms: [macos]
    attack: T1543.004
    if:
      type: text
      regex: '["'']launchctl["''][\s\S]{0,200}["''](unload|bootout)["'']'

  - id: js-systemctl-user-stop
    desc: Stops a systemd user unit
    platforms: [linux]
    attack: T1543.002
    if:
      type: text
      regex: '["'']systemctl["''][\s\S]{0,40}["'']--user["''][\s\S]{0,300}["''](stop|disable)["'']'
