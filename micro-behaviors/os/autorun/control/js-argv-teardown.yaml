# Teardown verbs for autostart entries and services, as written by Node service
# managers: spawn("schtasks", ["/End", ...]) or an argv allowlist that checks
# command === "schtasks" && args[0] === "/End". The command literal must
# precede the verb within a short window. Shell-string forms live in
# windows.yaml / service/configure.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: js-schtasks-end-or-delete
    desc: Ends or deletes a schtasks task
    attack: T1053.005
    if:
      type: text
      regex: '(?i)["''`]schtasks\b[\s\S]{0,300}/(end|delete)\b'

  - id: js-launchctl-unload
    desc: Unloads a launchd job via launchctl
    attack: T1543.004
    if:
      type: text
      regex: '(?i)["''`]launchctl\b[\s\S]{0,200}\b(unload|bootout)\b'

  # User units put --user before the verb; system units (a root daemon
  # installer) pass the verb first: spawn("systemctl", ["disable", ...]).
  - id: js-systemctl-unit-stop
    desc: Stops or disables a systemd unit
    attack: T1543.002
    if:
      type: text
      regex: '(?i)["''`]systemctl\b([\s\S]{0,40}--user\b[\s\S]{0,300}\b|[\s"''`,\[]{1,8})(stop|disable)\b'

  - id: js-scheduled-task-powershell-teardown
    desc: Stops scheduled task via PowerShell
    attack: T1053.005
    if:
      type: text
      regex: '(?i)\b(Stop|Unregister)-ScheduledTask\b'

composite_rules:
  # The Run/RunOnce key is what makes this an autorun deletion: a bare
  # `reg ... delete` also matches policy-key teardown (e.g. removing a
  # HKCU\SOFTWARE\Policies vendor key), which is configuration cleanup,
  # not persistence removal. Service managers often bind the Run key path
  # once above the install/uninstall branches, so pair the reg delete
  # invocation with the Run/RunOnce key within a local window.
  - id: js-reg-delete-autorun
    desc: Deletes autorun registry entry via reg
    attack: T1547.001
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/registry/delete::js-reg-delete-command
    any:
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
      - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
