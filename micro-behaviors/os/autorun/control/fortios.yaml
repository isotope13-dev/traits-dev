defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json]
  crit: notable
  conf: 0.96

traits:
  - id: fortios-auto-script-cli-config
    desc: Enters FortiOS system auto-script configuration
    if:
      type: text
      regex: '(?i)\bconfig\s+system\s+auto-script\b'

  - id: fortios-auto-script-audit-config
    desc: FortiOS auto-script creation audit event
    if:
      type: text
      regex: '\baction="Add"[^\r\n]{0,80}\bcfgpath="system\.auto-script"'

  - id: cli-script-body-assignment
    desc: CLI script body assignment token
    crit: component
    if:
      type: text
      regex: '(?i)\bset\s+script\s+["'']'

  - id: audit-script-body-assignment
    desc: Audit script body assignment token
    crit: component
    if:
      type: text
      regex: '\bcfgattr="script\['
