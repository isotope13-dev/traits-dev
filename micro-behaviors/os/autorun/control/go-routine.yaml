defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
- id: go-main-autorun
  desc: Go main autorun installer function name
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: main\.(makeAutoRun|setupAutoStart|installPersistence)(\.|$)
- id: go-registry-persistence-installer
  desc: Go registry persistence installer function
  crit: notable
  conf: 0.95
  platforms: [windows]
  for: [pe]
  if:
    type: text
    exact: main.installRegistryPersistence
    section: .rdata
