# Shell startup configuration operations do not establish unwanted persistence.
defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: zshrc-operation
    desc: References .zshrc modification or sourcing
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(>>?|source|touch|chmod|cp|mv|sed|perl)[^\r\n]{0,16}\.zshrc\b'
    unless:
    - id: metadata/package/files/ecosystem::conda-shell-activation-layout
    - id: well-known/app/infrastructure/nvidia-nvcf::developer-setup-script
    - id: well-known/app/ai/gateway/opencode-router
    - id: well-known/tool/development/cli/bridge-cli::install-script-header
    - type: text
      substr: .zshrc.d/
    # Installer advice telling the USER what to do with their own shell
    # config (append a line, reload the shell); the program neither modifies
    # nor sources the rc file itself.
    - type: text
      regex: '(?i)(appending this line to your shell profile|add this to your shell config)'
    - type: text
      regex: '(?i)reload shell\s*\(\s*source'
    - id: micro-behaviors/os/env/write::export-install-dir-path
    downgrade:
      any:
      - id: micro-behaviors/dylib/library/family/
  - id: zshrc-output-write-reference
    desc: Zsh startup path near output-write syntax
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(>>?|tee)[^\r\n]{0,20}\.zshrc|\.zshrc[^\r\n]{0,20}(>>?|tee)'
    not:
    # A descriptor redirect after the path discards the command's own stream
    # (`grep -l tag ~/.zshrc ~/.bashrc 2>/dev/null`); the rc file is read.
    - regex: '\.zshrc[^\r\n]{0,20}[0-9&]>>?$'
    unless:
    - id: metadata/package/files/ecosystem::conda-shell-activation-layout
    # A shell startup file is itself configuration; this rule is for a
    # program that modifies the startup target.
    - type: basename
      exact: .zshrc
