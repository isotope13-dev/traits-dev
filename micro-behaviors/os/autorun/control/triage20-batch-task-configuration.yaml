traits:
- crit: suspicious
  for:
  - pe
  - oledoc
  - powershell
  - batch
  - csharp
  - python
  - java
  - class
  - java_class
  id: schtasks-onlogon-highest-flags
  desc: Scheduled task ONLOGON highest flags
  conf: 0.97
  if:
    type: text
    exact: '" /SC ONLOGON /RL HIGHEST /F'
- crit: suspicious
  for:
  - batch
  - lua
  - text
  id: scheduled-task-user-path
  desc: Task action references user-directory text
  conf: 0.94
  if:
    type: text
    regex: (?i)/tr.{0,80}(%TEMP%|%APPDATA%|AppData|Local\\Programs)
- for:
  - pe
  - batch
  - powershell
  - scripts
  id: schtasks-action-temp-path
  desc: schtasks action under TEMP path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)/tr\s+"?[^"\n]{0,160}(%TEMP%|\\Temp\\|\\Windows\\Temp\\)
- for:
  - batch
  id: batch-system-logon-task-text
  desc: Batch SYSTEM logon-task creation text
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: schtasks(\.exe)? /create[\s\S]{0,160}/sc onlogon[\s\S]{0,80}/ru SYSTEM
- for:
  - batch
  - lua
  id: schtasks-highest-runlevel-text
  desc: Scheduled-task highest run-level flag
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: /rl (highest|HIGHEST)
  unless:
  - id: well-known/app/infrastructure/virtualbox::unattended-template
composite_rules:
- crit: notable
  for:
  - pe
  - batch
  - csharp
  - powershell
  id: windows-schtasks-onlogon-highest
  desc: Logon task creation requests highest run level
  conf: 0.95
  all:
  - id: micro-behaviors/os/autorun/scheduled::windows-schtasks-create
  - id: micro-behaviors/os/autorun/task-trigger::schtasks-logon-trigger
  any:
  - id: micro-behaviors/os/autorun/control::schtasks-onlogon-highest-flags
  - id: micro-behaviors/os/autorun/scheduled::schtasks-runlevel-highest
  unless:
  - id: well-known/app/development/calvyn-code
  - id: well-known/tool/development/ci/skia-buildbot/
- for:
  - pe
  - batch
  - python
  - powershell
  id: task-create-user-directory-action-text
  desc: Task creation and user-directory action observations
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/autorun/scheduled::windows-schtasks-create
  any:
  - id: micro-behaviors/os/autorun/control::register-scheduledtask-appdata-target
  - id: micro-behaviors/os/autorun/control::register-scheduledtask-public-target
  - id: micro-behaviors/os/autorun/control::register-scheduledtask-temp-target
  - id: micro-behaviors/os/autorun/control::schtasks-action-appdata-path
  - id: micro-behaviors/os/autorun/control::schtasks-action-programdata-path
  - id: micro-behaviors/os/autorun/control::schtasks-action-public-path
  - id: micro-behaviors/os/autorun/control::schtasks-action-temp-path
  - id: micro-behaviors/os/autorun/control::schtasks-action-userprofile-path
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
defaults:
  platforms:
  - windows
