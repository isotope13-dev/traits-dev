traits:
- crit: notable
  id: schtasks-task-name-format
  desc: Task creation command formats its task name
  conf: 0.97
  if:
    type: text
    regex: (?i)schtasks\.exe\s+/create\s+/tn\s+"%s"
composite_rules:
- crit: notable
  id: schtasks-elevated-logon-action-format
  desc: Elevated logon task command formats its action
  conf: 0.97
  all:
  - id: micro-behaviors/os/autorun/control::schtasks-action-format-placeholder
  - id: micro-behaviors/os/autorun/task-trigger::schtasks-logon-highest-force
  any:
  - id: micro-behaviors/os/autorun/control::schtasks-task-name-format
  - id: micro-behaviors/os/autorun/scheduled::schtasks-create-task-name
  near_bytes: 128
defaults:
  for:
  - pe
  - oledoc
  - powershell
  - batch
  - csharp
  - python
  - java
  - class
  - java_class
  platforms:
  - windows
