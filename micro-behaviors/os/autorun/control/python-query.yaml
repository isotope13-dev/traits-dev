defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-schtasks-query-argument
    desc: Python uses schtasks query argument
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      regex: '(?i)^/query$'

composite_rules:
  - id: python-schtasks-query-command
    desc: Python queries scheduled tasks
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-command-token
      - id: python-schtasks-query-argument

