# Original matchers and effective scopes are retained.
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
traits:
- id: shell-profile-source-operation
  desc: Sources a .profile shell configuration file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(source|\.)\s+(~|[$]HOME|\.?/)?\.profile\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: shell-profile-redirect-operation
  desc: Redirects content to a .profile file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)>>?\s*(~|[$]HOME|\.?/)?\.profile\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: shell-profile-read-command
  desc: Reads a .profile shell configuration file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bcat\s+(~|[$]HOME|\.?/)?\.profile\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: shell-profile-write-command
  desc: Changes a .profile shell configuration file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(touch|chmod)\s+(~|[$]HOME|\.?/)?\.profile\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: shell-profile-copy-command
  desc: Copy-style command targets a .profile file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(cp|mv)\s+[^\r\n]{1,80}\s+(~|[$]HOME|\.?/)?\.profile\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: shell-profile-remove-command
  desc: Removal-style command targets a .profile file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(rm|sed)\s+[^\r\n]{1,80}\s+(~|[$]HOME|\.?/)?\.profile\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: shell-zprofile-command-text
  desc: Command text operates on .zprofile
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)(>>?|source|touch|chmod|cp|mv|sed|perl)[^\r\n]{0,16}\.zprofile\b
  downgrade:
    any:
    - id: micro-behaviors/dylib/library/family/
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: well-known/tool/development/cli/bridge-cli::install-script-header
  - id: micro-behaviors/os/env/write::export-install-dir-path
composite_rules:
- id: multiple-shell-config-references
  desc: Multiple shell configuration references
  crit: notable
  conf: 0.9
  needs: 3
  any:
  - id: micro-behaviors/fs/path/config/shell::shell-bash-login-literal
  - id: micro-behaviors/os/autorun/control::shell-profile-file-operation
  - id: micro-behaviors/fs/path/config/shell::bash-profile-filename
  - id: micro-behaviors/fs/path/config/shell::bashrc-filename
  - id: micro-behaviors/os/autorun/control::zshrc-operation
  - id: micro-behaviors/os/autorun/control::shell-zprofile-command-text
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: micro-behaviors/os/env/runtime::posixly-correct-shell-literal
  - id: micro-behaviors/fs/path/config/shell::shell-cshrc-literal
  - id: metadata/lang/source/naming/target::shell-tcsh-literal
  - id: metadata/build/config::apm-runtime-path-setup-banner
  - id: metadata/package/testing/presence/path::shell-crate-test-path
- id: shell-profile-file-operation
  desc: Shell .profile file operation
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/autorun/control::shell-profile-source-operation
  - id: micro-behaviors/os/autorun/control::shell-profile-redirect-operation
  - id: micro-behaviors/os/autorun/control::shell-profile-read-command
  - id: micro-behaviors/os/autorun/control::shell-profile-write-command
  - id: micro-behaviors/os/autorun/control::shell-profile-copy-command
  - id: micro-behaviors/os/autorun/control::shell-profile-remove-command
