# COM task-definition control vocabulary, alongside registration methods.
# A method-name reference establishes neither invocation nor a trigger.
defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable

traits:
  - id: task-scheduler-newtask-token
    desc: References Task Scheduler NewTask method name
    conf: 0.88
    if:
      type: text
      word: NewTask
