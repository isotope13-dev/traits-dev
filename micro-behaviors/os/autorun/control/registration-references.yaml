defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: task-registration-configuration-reference-cluster
    desc: Task registration or configuration references
    crit: notable
    conf: 0.95
    attack: "T1053.005"
    needs: 2
    any:
      - id: micro-behaviors/os/autorun/control::task-logon-service-account-token
      - id: micro-behaviors/os/autorun/control::task-runlevel-highest-token
      - id: micro-behaviors/os/autorun/control::register-task-definition
      - id: micro-behaviors/os/autorun/control::create-service-task-name
    unless:
      # Wine's schtasks implementation exposes the task interfaces and
      # service-account tokens as its normal compatibility API surface.
      - id: well-known/lib/platform/wine/
      # The upstream MeshCentral agent creates the same SYSTEM task tokens.
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-binary-context

