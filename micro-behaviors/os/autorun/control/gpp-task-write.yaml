defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.97

traits:
  - id: powershell-scheduledtasks-xml-write
    desc: Set-Content targets GPP ScheduledTasks XML file
    if:
      type: text
      regex: '(?i)\bSet-Content\s+-Path\s+[^\r\n]{0,160}\\ScheduledTasks\.xml["'']'

