# Distinct startup-surface references. Names and paths alone prove no writes.
# Retires the old hostile binary profile built from unbound routine names.
defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: go-elf-multiple-autorun-surface-references
    desc: Go ELF references multiple autorun surfaces
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/compiler/systems::go-binary
    any:
      - id: micro-behaviors/os/service/config::etc-rc-local
      - id: micro-behaviors/fs/path/binary::systemctl-utility-path
      - id: micro-behaviors/fs/path/binary::crontab-utility-path
      - id: micro-behaviors/fs/path/config/system::system-profile-path
    needs: 3
