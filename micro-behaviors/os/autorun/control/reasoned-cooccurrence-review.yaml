# References and API co-occurrence do not establish bound data flow.
defaults:
  for:
  - scripts
  - binaries
  platforms:
  - windows
  crit: notable
  conf: 0.88
traits:
- id: netsh-add-helper-command
  desc: Netsh helper registration command reference
  if:
    type: text
    regex: (?i)netsh\s+add\s+helper\b
composite_rules:
- id: netsh-helper-registration-references
  desc: Netsh helper key or registration-command references
  any:
  - id: micro-behaviors/os/registry/keys/execution::netsh-helper-registry-path
  - id: netsh-add-helper-command
