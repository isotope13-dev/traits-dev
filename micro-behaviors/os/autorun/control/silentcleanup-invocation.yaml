defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: silentcleanup-task-invocation
    desc: Starts the SilentCleanup scheduled task
    if:
      type: text
      regex: '(?i)/Run\s+/TN\s+["\x27]?\\Microsoft\\Windows\\DiskCleanup\\SilentCleanup'

  - id: python-silentcleanup-task-launch
    desc: Process launch names SilentCleanup task
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)subprocess\.(run|call|Popen|check_call|check_output)$'
      arg:
        index: 0
        from:
          value: '\\Microsoft\\Windows\\DiskCleanup\\SilentCleanup'
