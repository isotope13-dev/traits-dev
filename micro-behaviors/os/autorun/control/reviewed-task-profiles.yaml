traits:
- id: schtasks-run-task-command
  desc: Runs a registered Windows scheduled task
  crit: notable
  conf: 0.9
  unless:
    - id: metadata/file/format/log::windows-event-csv-records
  if:
    type: text
    regex: (?i)\bschtasks(\.exe)?\s+/run\b
  attack: T1053.005
  mbc: F0012
- id: schtasks-interpreter-action
  desc: Task action names a command interpreter
  conf: 0.92
  if:
    type: text
    regex: (?i)\s/tr\s+"?(cmd|powershell|wscript|mshta)(\.exe)?\b
  crit: notable
defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
