# Reviewed source observations; no malicious intent is implied.
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - shell
  id: shell-profile-reference-or-operation
  desc: Shell profile reference or file operation
  crit: notable
  conf: 0.7
  any:
