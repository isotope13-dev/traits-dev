defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-scheduler-boot-service-account-profile
    desc: Scheduler GUIDs and boot-registration code
    crit: notable
    conf: 0.98
    attack: T1053.005
    if:
      type: yara
      source: |
        import "pe"
        rule x64_scheduler_service_account_registration_profile {
          strings:
            $clsid = { 9F 36 87 0F E5 A4 FC 4C BD 3E 73 E6 15 45 72 DD }
            $iid = { C7 A4 AB 2F A9 4D 13 40 96 97 20 CC 3F D4 0F 85 }
            $boot_create = { 4C 8D 84 24 ?? ?? ?? ?? BA 08 00 00 00 FF 10 }
            $register = {
              41 B9 06 00 00 00 4C 89 54 24 20 4C 89 5C 24 28
              C7 44 24 30 03 00 00 00 48 89 74 24 38
              48 89 7C 24 40 FF 90 88 00 00 00
            }
          condition:
            pe.is_64bit() and all of them and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              $boot_create in (pe.sections[s].raw_data_offset..pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size-1) and
              $register in (pe.sections[s].raw_data_offset..pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size-1)
            )
        }
