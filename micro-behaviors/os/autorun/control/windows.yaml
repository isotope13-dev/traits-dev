defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  crit: notable
  attack: T1053.005

traits:
  - id: schtasks-disable-command
    desc: Disables a task with schtasks
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\b[^\r\n]{0,160}/change\b[^\r\n]{0,160}/disable\b'
