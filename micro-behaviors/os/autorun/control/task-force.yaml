# Force controls are neutral scheduler capabilities, independent of the task's
# trigger or purpose. Moved from the login scheduled-task objective leaf.
defaults:
  platforms: [windows]
  for: [powershell, batch, go]
  crit: notable
  conf: 0.8

traits:
  - id: scheduled-task-force-before-cmdlet
    desc: Force flag before ScheduledTask cmdlet
    if:
      type: text
      regex: '-Force\b[^\n]{0,120}ScheduledTask\w*'
      case_insensitive: true

