defaults:
  platforms: [windows]
  for: [lua]
composite_rules:
  - id: lua-elevated-logon-task
    desc: Lua configures an elevated logon task
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-logon-trigger
      - id: micro-behaviors/os/autorun/control::schtasks-highest-runlevel-text
