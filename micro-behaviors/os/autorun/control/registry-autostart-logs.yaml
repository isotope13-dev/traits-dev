---
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
traits:
- id: create-reg-autostart-path-log
  desc: Registry autostart path log
  conf: 0.96
  if:
    type: text
    exact: "@[createRegAutoStart] path="
- id: create-reg-autostart-setvalue-log
  desc: Registry SetValue result log
  conf: 0.96
  if:
    type: text
    exact: "@[createRegAutoStart] SetValue result="
- id: create-reg-autostart-verified-log
  desc: Registry autostart verified log
  conf: 0.96
  if:
    type: text
    exact: "@[createRegAutoStart] VERIFIED: value exists, type="
composite_rules:
- id: registry-autostart-log-profile
  desc: Autostart routine logs path and value writes
  conf: 0.97
  all:
  - id: micro-behaviors/os/autorun/control::create-reg-autostart-path-log
  - id: micro-behaviors/os/autorun/control::create-reg-autostart-setvalue-log
  - id: micro-behaviors/os/autorun/control::create-reg-autostart-verified-log
  unless:
  - id: metadata/signed/platform/
