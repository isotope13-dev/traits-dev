# Enum definitions are references, not evidence of task registration.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: task-logon-service-account-token
    desc: Task Scheduler service-account enum reference
    conf: 0.93
    if:
      type: text
      word: TASK_LOGON_SERVICE_ACCOUNT
    unless:
      - id: metadata/build/generated::winmd-metadata

  - id: task-runlevel-highest-token
    desc: Task Scheduler highest-privilege enum reference
    conf: 0.92
    if:
      type: text
      word: TASK_RUNLEVEL_HIGHEST
    unless:
      - id: metadata/build/generated::winmd-metadata

