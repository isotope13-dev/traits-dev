defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-self-copy-autoexec-call-append
  desc: Startup CALL targets a copied current script
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: "rule batch_self_copy_autoexec_call_append {\n strings:\n  $copy = /copy( \\/y)? %(0|~f0) %[A-Za-z_][A-Za-z0-9_]{0,31}%\\\
      \\[A-Za-z0-9_.~\\-]{1,80}\\.(bat|cmd) >nul/ nocase\n  $copyhead = /copy( \\/y)? %(0|~f0) / nocase\n  $copydst\
      \ = /%[A-Za-z_][A-Za-z0-9_]{0,31}%\\\\[A-Za-z0-9_.~\\-]{1,80}\\.(bat|cmd) >nul/ nocase\n  $echo = /echo if\
      \ not exist %[A-Za-z_][A-Za-z0-9_]{0,31}%\\\\[A-Za-z0-9_.~\\-]{1,80} call %[A-Za-z_][A-Za-z0-9_]{0,31}%\\\\\
      [A-Za-z0-9_.~\\-]{1,80}\\.(bat|cmd) [^\\r\\n&|>]{0,80}>> [A-Za-z]:\\\\autoexec\\.bat/ nocase\n  $call = /call\
      \ %[A-Za-z_][A-Za-z0-9_]{0,31}%\\\\[A-Za-z0-9_.~\\-]{1,80}\\.(bat|cmd) / nocase\n condition:\n  #copy > 0\
      \ and #copy <= 32 and #copyhead <= 32 and #copydst <= 32 and #echo > 0 and #echo <= 32 and #call <= 32 and\n\
      \  for any a in (1..#copy) : (\n   (@copy[a] == 0 or uint8(@copy[a]-1) == 10) and\n   for any h in (1..#copyhead)\
      \ : (\n   @copyhead[h] == @copy[a] and\n   for any b in (1..#copydst) : (\n    @copydst[b] == @copy[a]+!copyhead[h]\
      \ and @copydst[b]+!copydst[b] == @copy[a]+!copy[a] and\n    for any c in (1..#echo) : (\n     (@echo[c] ==\
      \ 0 or uint8(@echo[c]-1) == 10) and\n     @echo[c] > @copy[a]+!copy[a] and @echo[c]-@copy[a] < 512 and\n \
      \    for any d in (1..#call) : (\n      @call[d] > @echo[c] and @call[d]+!call[d] < @echo[c]+!echo[c] and\n\
      \      !copydst[b]-5 == !call[d]-6 and\n      for all k in (0..!copydst[b]-6) : ((uint8(@copydst[b]+k)|32)\
      \ == (uint8(@call[d]+5+k)|32))\n     )\n    )\n   )\n  )\n  )\n}"
