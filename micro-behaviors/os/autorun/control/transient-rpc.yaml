# Remote Task Scheduler RPC execution inspired by observed Impacket atexec.py
# deployment. The task name, payload, and client language are intentionally
# unconstrained: the create/run/delete lifecycle over the ATSVC endpoint is
# the reusable technique.
defaults:
  for: [python, pyc, powershell, pe, dll, c, cpp, csharp]
  platforms: [windows, linux, macos]
  attack: T1021,T1053.005

composite_rules:
  - id: transient-remote-task-execution
    desc: Executes then deletes a remote scheduled task over RPC
    crit: notable
    conf: 0.99
    all:
      - id: metadata/file/profile/rpc::atsvc-rpc-named-pipe-binding
      - id: metadata/file/profile/rpc::tsch-register-task-call
      - id: metadata/file/profile/rpc::tsch-run-task-call
      - id: metadata/file/profile/rpc::tsch-delete-task-call
    near_lines: 100

  - id: polled-transient-remote-task-execution
    desc: Polls completion of a disposable remote scheduled task
    crit: notable
    conf: 0.99
    all:
      - id: transient-remote-task-execution
      - id: metadata/file/profile/rpc::tsch-last-run-query
    near_lines: 100
