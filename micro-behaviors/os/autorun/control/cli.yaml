defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.95
traits:
- id: disable-autorun-option
  desc: CLI option disables autorun registration
  if:
    type: text
    exact: --disable-autorun
    section: .rdata
- id: autorun-registration-log
  desc: Autorun registration success log format
  if:
    type: text
    substr: 'added to autorun:'
    section: .rdata
