defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.5
traits:
  - id: go-cron-schedule-literal
    desc: Go embeds a recurring cron schedule
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: string_literal
      substr: '* * * * *'

  - id: go-crontab-command-literal
    desc: Go embeds a crontab command
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: string_literal
      word: crontab

  - id: crontab-keyword
    desc: Contains crontab keyword
    # A bare prose/API keyword is not an autorun action. Keep concrete
    # crontab commands and wildcard entries notable below.
    crit: component
    if:
      type: text
      word: crontab
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/file/format/
      - id: metadata/file/catalog/identity/
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/tool/detection/skill-scanner::source-context
  - id: crontab-remove
    desc: Removes the current user's crontab
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bcrontab\s+-r\b'
  - id: perl-crontab-user-remove
    desc: Perl invokes crontab with removal flag
    crit: notable
    conf: 0.94
    for: [perl]
    if:
      type: text
      regex: '\bsystemcall(_silent|_or_warn)?\([^;\n]{0,40}/usr/bin/crontab[^;\n]{0,40}-u[^;\n]{0,20}-r'
  - id: crontab-option
    desc: crontab command option
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '\bcrontab\s+-[A-Za-z][A-Za-z-]*\b'
  - id: crontab-wildcard-entry
    desc: Wildcard crontab entry with command
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)(^|["''])[ \t]*(\*[ \t]+){4}\*[ \t]+(\.?/|\$|[A-Za-z_])[^\r\n]{0,500}$'
