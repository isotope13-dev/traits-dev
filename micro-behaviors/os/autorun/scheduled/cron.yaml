defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.5
traits:
  - id: shell-cron-schedule-entry
    desc: Shell embeds recurring cron schedule
    crit: notable
    conf: 0.97
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*(\*/[0-9]{1,2}|[0-9]{1,2})\s+\*\s+\*\s+\*\s+\*'

  - id: go-cron-schedule-literal
    desc: Go embeds a recurring cron schedule
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: string_literal
      substr: '* * * * *'

  - id: go-crontab-command-literal
    desc: Go embeds a crontab command
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: string_literal
      word: crontab

  - id: crontab-keyword
    desc: Contains crontab keyword
    # A bare prose/API keyword is not an autorun action. Keep concrete
    # crontab commands and wildcard entries notable below.
    crit: component
    if:
      type: text
      word: crontab
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/file/format/
      - id: metadata/file/catalog/identity/
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/tool/detection/skill-scanner::source-context
  - id: desktop-exec-crontab-rewrite
    desc: Desktop Exec installs generated crontab
    crit: notable
    conf: 0.97
    for: [desktop-entry]
    platforms: [linux]
    if:
      type: value
      path: desktop_entry.exec
      regex: '\(crontab -l;\s*echo [^)]+\)\s*\|\s*crontab -'
  - id: crontab-remove
    desc: Removes the current user's crontab
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bcrontab\s+-r\b'
  - id: perl-crontab-user-remove
    desc: Perl invokes crontab with removal flag
    crit: notable
    conf: 0.94
    for: [perl]
    if:
      type: text
      regex: '\bsystemcall(_silent|_or_warn)?\([^;\n]{0,40}/usr/bin/crontab[^;\n]{0,40}-u[^;\n]{0,20}-r'
  - id: crontab-option
    desc: crontab command option
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '\bcrontab\s+-[A-Za-z][A-Za-z-]*\b'
  - id: crontab-wildcard-entry
    desc: Wildcard crontab entry with command
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)(^|["''])[ \t]*(\*[ \t]+){4}\*[ \t]+(\.?/|\$|[A-Za-z_])[^\r\n]{0,500}$'

  - id: crontab-string
    desc: Crontab list or input command
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      regex: '(\bcrontab\s*-[lr]\b|[|]\s*crontab\s*-(\s|["'']|$))'

  - id: crontab-schedule-format
    desc: Crontab schedule format string
    crit: notable
    conf: 0.9
    for: [shell, python, ruby, perl, go]
    if:
      type: text
      regex: '%d\s+%d\s+\*\s+\*\s+\*\s+%s'

  - id: crontab-echo-pipe
    desc: Echoes a generated entry into crontab
    crit: notable
    conf: 0.9
    for: [shell, python, ruby, perl]
    if:
      type: text
      regex: 'echo.{0,80}\|\s*crontab|crontab.{0,40}echo'
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog

  - id: crontab-file-install
    desc: Installs crontab entries from a file
    crit: notable
    conf: 0.85
    for: [shell, python, ruby, perl]
    unless:
      - id: well-known/app/infrastructure/pihole::pihole-artifact
      - id: well-known/app/system/aks-engine/
      - id: metadata/package/files/dependency::os-image-root-file-path
    if:
      type: text
      regex: '\bcrontab\s+/[^\s|]{3,60}'

  - id: crontab-filtered-removal
    desc: Removes matching entries while rewriting crontab
    crit: notable
    conf: 0.92
    for: [shell, python, ruby, perl]
    if:
      type: text
      # Trailing `\b` after `crontab -` fails at EOL (non-word then end).
      regex: '\bcrontab\s+-l\s*\|\s*grep\s+-v\b[^\r\n]{0,80}\|\s*crontab\s+-'

  - id: source-cron-schedule-entry
    desc: Recurring Unix cron schedule
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      regex: '(?m)^\s*(\*/[0-9]{1,2}|[0-9]{1,2})\s+\*\s+\*\s+\*\s+\*\s+\S+'
