# Neutral scheduled-task XML observations. The elevated event-triggered
# combination is assembled by objective rules, because each XML element can
# also occur in legitimate enterprise task definitions.
defaults:
  platforms: [windows]
  for: [powershell, csharp, c, cpp, data, pe, dll, javascript, typescript]
  crit: notable
  conf: 0.93
  attack: T1053.005

traits:
  - id: scheduled-task-logon-trigger-xml
    desc: Scheduled task XML user-logon trigger
    if:
      type: text
      regex: '(?i)<LogonTrigger\s*(>|\s[A-Za-z-]{1,20}=)'

  - id: scheduled-task-hidden-xml
    desc: Scheduled task XML hidden element
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<Hidden>\s*true\s*</Hidden>'

  # The `for:` list includes C and C++, where `<Name` is a template argument
  # list rather than an XML tag: ASC registers a game trigger as
  # `ObjectCreator<EventTrigger, TriggerType>`. Requiring the tag to close or
  # carry an attribute keeps this an XML observation, matching the sibling
  # rules here which all anchor on a full element.
  - id: scheduled-task-event-trigger-xml
    desc: Scheduled task XML event trigger
    if:
      type: text
      regex: '(?i)<EventTrigger\s*(/?>|\s[A-Za-z-]{1,20}=)'

  - id: scheduled-task-system-principal-xml
    desc: Scheduled task XML SYSTEM principal
    if:
      type: text
      regex: '(?i)<UserId>\s*(S-1-5-18|SYSTEM|NT AUTHORITY\\SYSTEM)\s*</UserId>'

  - id: scheduled-task-highest-runlevel-xml
    desc: Scheduled task XML highest available run level
    if:
      type: text
      regex: '(?i)<RunLevel>\s*HighestAvailable\s*</RunLevel>'
