# Neutral Windows scheduled-task capabilities and persistence-related markers.
# Objective rules combine these observations with intent-specific evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1053.005
  mbc: F0012
traits:
  - id: register-task-definition
    desc: Scheduled-task registration COM method
    conf: 0.92
    for: [pe, dll, scripts, binaries, mp3]
    if:
      type: text
      word: RegisterTaskDefinition
    unless:
      - id: metadata/build/generated::winmd-metadata

  # Some WSH loaders hide the COM ProgID behind a small hex decoder. Keep the
  # fragments neutral; the complete scheduler shape and the surrounding
  # execution context supply intent in objective composites.
  - id: hex-task-scheduler-service-sche
    desc: Hex fragment for Task Scheduler service
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)["'']53636865["'']'

  - id: hex-task-scheduler-service-dule-se
    desc: Hex fragment for Task Scheduler service
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)["'']64756c652e5365["'']'

  - id: hex-task-scheduler-service-rvice
    desc: Hex fragment for Task Scheduler service
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)["'']7276696365["'']'

  - id: hex-task-scheduler-time-trigger-time
    desc: Hex fragment for Task Scheduler time trigger
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)["'']54696d65["'']'

  - id: hex-task-scheduler-time-trigger-trigger
    desc: Hex fragment for Task Scheduler time trigger
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)["'']54726967676572["'']'

  - id: silentcleanup-task-path
    desc: SilentCleanup scheduled task path reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '\Microsoft\Windows\DiskCleanup\SilentCleanup'

  - id: task-scheduler-com-progid
    desc: Windows Task Scheduler COM service
    crit: notable
    conf: 0.9
    for: [scripts, binaries, mp3]
    if:
      type: text
      substr: Schedule.Service
    unless:
      - id: metadata/file/string/application-name::microsoft-activation-script-benign-context

  - id: task-scheduler-register-task-call
    desc: Task Scheduler COM RegisterTask method call
    crit: notable
    conf: 0.95
    for: [javascript, vbs, powershell, csharp]
    if:
      type: text
      regex: '\.RegisterTask\s*\('

  - id: win32-scheduledjob-wmi-class
    desc: Win32 scheduled-job WMI class
    crit: notable
    conf: 0.9
    for: [scripts, binaries, mp3]
    if:
      type: text
      substr: Win32_ScheduledJob
    unless:
      - type: text
        exact: WMI Win32 Provider
        section: .rsrc

  - id: python-task-scheduler-com-dispatch
    desc: Python opens Task Scheduler COM service
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'win32com\.client\.Dispatch\(\s*["'']Schedule\.Service["'']\s*\)'

  - id: python-schtasks-command-token
    desc: Python references schtasks utility
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      exact: schtasks

  - id: python-schtasks-query-argument
    desc: Python uses schtasks query argument
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      regex: '(?i)^/query$'

  - id: python-schtasks-create-argument
    desc: Python uses schtasks create argument
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      regex: '(?i)^/create$'

  - id: python-schtasks-delete-argument
    desc: Python uses schtasks delete argument
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      regex: '(?i)^/delete$'

  - id: python-schtasks-change-argument
    desc: Python uses schtasks change argument
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      regex: '(?i)^/change$'

  # Process APIs often split arguments across an argv array, while native
  # wrappers keep one command string. The extracted text stream preserves both
  # layouts; punctuation-tolerant gaps cover source and JVM constant pools.
  - id: schtasks-minute-create-sequence
    desc: Creates a minute-based Windows scheduled task
    crit: notable
    conf: 0.96
    for: [scripts, source, class, java_class]
    if:
      type: text
      regex: '(?is)\bschtasks([.]exe)?\b.{0,180}/create\b.{0,180}/sc.{0,24}minute\b'

  - id: schtasks-minute-create-before-command
    desc: Builds a minute task before schtasks launch
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(?is)/create\b.{0,180}/sc.{0,24}minute\b.{0,400}\bschtasks([.]exe)?\b'

  - id: jvm-schtasks-create-argument
    desc: JVM schtasks create argument
    crit: component
    conf: 0.96
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^/create$'

  - id: jvm-schtasks-minute-value
    desc: JVM schtasks minute schedule
    crit: component
    conf: 0.96
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^minute$'

  - id: schtasks-utility-token
    desc: Windows schtasks utility reference
    ref: sha256:1fa1e028b2cad5297edcae7d505456d187bdf1bc29acba1e90d17f355951bca7
    crit: notable
    conf: 0.7
    # text/html included: ClickFix lures are plain text or HTML pages that
    # instruct the victim to run schtasks themselves.
    for: [binaries, scripts, source, text, html]
    if:
      type: text
      word: schtasks
    unless:
      # A name reached through a string is the reflective spelling; where the
      # direct form is already recorded, this would be the same call twice.
      - id: python-schtasks-command-token
      - id: well-known/app/data/xore-honeypot::benign-context

  # Compiled JVM packages expose command literals through the cached
  # class.strings value set rather than source text. Keep this alongside the
  # source token so objective rules see the same scheduler capability in both
  # representations.
  - id: jvm-schtasks-utility-token
    desc: JVM contains schtasks utility literal
    crit: notable
    conf: 0.9
    for: [class]
    if:
      type: value
      path: class.strings[*]
      regex: '^schtasks([.]exe)?$'
  - id: persist-marker
    desc: Persistence configuration marker string
    if:
      type: text
      exact: "[PERSIST:1]"
  - id: windows-maintenance-path
    desc: "Win Maintenance scheduled task path reference"
    if:
      type: text
      substr: "\\Microsoft\\Windows\\Maintenance\\"

  - id: powershell-scheduled-task-arguments
    desc: Scheduled task action arguments read
    crit: notable
    conf: 0.93
    for: [powershell]
    if:
      type: text
      regex: '\.Actions\s*\.\s*Arguments'

  - id: powershell-schtasks-xml-create
    desc: Scheduled task XML creation
    crit: notable
    conf: 0.95
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)schtasks\s+/create[^\r\n]{0,180}/xml'

  - id: javascript-schtasks-xml-create
    desc: JavaScript schtasks XML create command
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: '(?i)\bschtasks\s*/create\s*/tn\b[\s\S]{0,160}/xml\b[\s\S]{0,80}/f\b'

  - id: schtasks-xml-command
    desc: schtasks command uses XML definition
    crit: notable
    conf: 0.85
    for: [go, pe, dll]
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\b.{0,20}/xml\b'

  - id: schtasks-create-task-name
    desc: Scheduled task creation name flag
    conf: 0.96
    for: [pe, oledoc, powershell, batch, csharp, python, java, class, java_class]
    if:
      type: text
      # C#/Java source keeps the quote escaped (\"), while compiled strings
      # and shell commands contain the plain quote.
      regex: '(?i)/create\s+/tn\s+\\?"'

  - id: schtasks-create-cmd
    desc: Windows schtasks create command
    crit: notable
    conf: 0.92
    for: [pe, dll, powershell, batch, vbs, csharp, python, java, class, java_class]
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\s+/create\b'

  # `/TR` names the program the task will run. Naming an action is an ordinary
  # part of every schtasks invocation — installers and uninstallers included —
  # so this is the neutral flag observation next to its siblings; the intent
  # comes from what the action points at (see the ADS loader composite).
  - id: schtasks-action-argument
    desc: schtasks command supplies a /TR action
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell, batch, vbs, javascript, csharp, python]
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\b[^\r\n]{0,120}/tr\b'

  # `/SC MINUTE` and `/SC HOURLY` are the two schtasks schedule types that
  # re-launch the action many times a day. Ordinary software schedules daily,
  # weekly, or logon tasks; a sub-daily repeat is how an implant gets itself
  # restarted quickly after a kill or a reboot.
  - id: schtasks-short-repeat-schedule
    desc: Scheduled task repeats every minute or hour
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)/sc\s+(MINUTE|HOURLY)\b'

  - id: schtasks-runlevel-highest
    desc: Scheduled task requests highest run level
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell, batch, csharp, python, go, class]
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?[^\r\n]{0,200}/rl\s+highest\b'

  - id: schtasks-system-runas
    desc: Scheduled task runs as SYSTEM
    crit: notable
    conf: 0.92
    for: [pe, dll, powershell, batch, csharp, python, go, class]
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?[^\r\n]{0,200}/ru\s+["\x27]?(SYSTEM|NT AUTHORITY\\SYSTEM)["\x27]?'

  - id: schtasks-force-flag
    desc: Scheduled task command uses force flag
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell, batch, csharp, python, go, class]
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?[^\r\n]{0,120}/f\b'

  - id: go-schtasks-create-command
    desc: Go invokes schtasks.exe task creation
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: '(?i)exec\.Command\(\s*["'']schtasks(\.exe)?["'']\s*,\s*["'']/create["'']'

  - id: itaskscheduler-interface
    desc: ITaskScheduler interface reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: ITaskScheduler
    unless:
      - id: metadata/signed/platform::microsoft

  - id: itaskservice-interface
    desc: Task Scheduler service interface reference
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      word: ITaskService

  - id: registered-task-run
    desc: Runs a registered Windows scheduled task
    crit: notable
    conf: 0.94
    for: [binaries, source]
    if:
      type: text
      regex: '(?is)\bIRegisteredTask\b.{0,256}\bRun\s*\('

  - id: task-scheduler-keyword
    desc: Windows TaskScheduler API keyword
    crit: notable
    conf: 0.85
    if:
      type: text
      word: TaskScheduler

  - id: task-restart-on-failure-property
    desc: Task Scheduler restart-on-failure property
    crit: notable
    conf: 0.9
    if:
      type: text
      word: RestartOnFailure

  - id: task-scheduler-newtask-call
    desc: Task Scheduler creates a new task definition
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)\.NewTask\s*\('

  - id: task-scheduler-time-trigger-call
    desc: Task Scheduler creates a time trigger
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      # WSH commonly stores the trigger type in a Const or variable before
      # calling Create, so the argument is not necessarily the literal `1`.
      # The scheduler composite supplies the surrounding API context.
      regex: '(?i)\bTriggers?\s*\.\s*Create\s*\(\s*[A-Za-z_0-9]+\s*\)'

  - id: task-scheduler-action-create-call
    desc: Task Scheduler creates an executable action
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)\.Actions\s*\.\s*Create\s*\('

composite_rules:
  - id: jvm-schtasks-minute-create
    desc: JVM creates a minute-based scheduled task
    crit: notable
    conf: 0.97
    for: [class, java_class]
    all:
      - id: jvm-schtasks-utility-token
      - id: jvm-schtasks-create-argument
      - id: jvm-schtasks-minute-value

  - id: schtasks-minute-creation
    desc: Creates a minute-based Windows scheduled task
    crit: notable
    conf: 0.96
    for: [scripts, source, class, java_class]
    any:
      - id: schtasks-minute-create-sequence
      - id: schtasks-minute-create-before-command
      - id: jvm-schtasks-minute-create

  - id: hex-task-scheduler-service
    desc: Hex-reconstructed Task Scheduler COM service
    crit: notable
    conf: 0.97
    for: [scripts, binaries, mp3]
    near_bytes: 1024
    all:
      - id: hex-task-scheduler-service-sche
      - id: hex-task-scheduler-service-dule-se
      - id: hex-task-scheduler-service-rvice

  - id: hex-task-scheduler-time-trigger
    desc: Hex-reconstructed Task Scheduler time trigger
    crit: notable
    conf: 0.97
    for: [scripts, binaries, mp3]
    near_bytes: 1024
    all:
      - id: hex-task-scheduler-time-trigger-time
      - id: hex-task-scheduler-time-trigger-trigger

  - id: schtasks-split-exe-create
    desc: schtasks.exe with nearby create /tn args
    conf: 0.92
    for: [pe, powershell, batch, csharp, python, java, class, java_class]
    # Object-initializer source commonly assigns FileName, stdio/window
    # options, and Arguments across several statements before constructing the
    # command string. Keep the two schtasks-specific legs in the same small
    # source region without requiring command-line adjacency.
    near_bytes: 768
    all:
      - id: schtasks-utility-token
      - id: schtasks-create-task-name

  - id: windows-schtasks-create
    desc: Creates a Windows scheduled task
    conf: 0.85
    for: [pe, oledoc, powershell, batch, csharp, python, java, class, java_class]
    size_max: 500000
    any:
      - id: schtasks-create-cmd
      - id: schtasks-split-exe-create

  - id: python-schtasks-query-command
    desc: Python queries scheduled tasks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-schtasks-command-token
      - id: python-schtasks-query-argument

  - id: python-schtasks-create-command
    desc: Python creates scheduled tasks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-schtasks-command-token
      - id: python-schtasks-create-argument

  - id: python-schtasks-delete-command
    desc: Python deletes scheduled tasks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-schtasks-command-token
      - id: python-schtasks-delete-argument

  - id: python-schtasks-change-command
    desc: Python changes scheduled tasks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-schtasks-command-token
      - id: python-schtasks-change-argument
