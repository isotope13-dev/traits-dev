# Neutral Windows scheduled-task capabilities and persistence-related markers.
# Objective rules combine these observations with intent-specific evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1053.005
  mbc: F0012
traits:
  - id: register-task-definition
    desc: Scheduled-task registration COM method
    conf: 0.92
    if:
      type: text
      word: RegisterTaskDefinition
    unless:
      - id: metadata/library/generated::winmd-metadata

  - id: silentcleanup-task-path
    desc: SilentCleanup scheduled task path reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '\Microsoft\Windows\DiskCleanup\SilentCleanup'

  - id: task-scheduler-com-progid
    desc: Windows Task Scheduler COM service
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      substr: Schedule.Service
    unless:
      - id: metadata/file/string/identity::microsoft-activation-script-benign-context

  - id: task-scheduler-register-task-call
    desc: Task Scheduler COM RegisterTask method call
    crit: notable
    conf: 0.95
    for: [javascript, vbs, powershell, csharp]
    if:
      type: text
      regex: '\.RegisterTask\s*\('

  - id: win32-scheduledjob-wmi-class
    desc: Win32 scheduled-job WMI class
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      substr: Win32_ScheduledJob
    unless:
      - type: text
        exact: WMI Win32 Provider
        section: .rsrc

  - id: python-task-scheduler-com-dispatch
    desc: Python opens Task Scheduler COM service
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'win32com\.client\.Dispatch\(\s*["'']Schedule\.Service["'']\s*\)'

  - id: python-schtasks-command-token
    desc: Python references schtasks utility
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      exact: schtasks

  - id: python-schtasks-query-argument
    desc: Python uses schtasks query argument
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      regex: '(?i)^/query$'

  - id: python-schtasks-create-argument
    desc: Python uses schtasks create argument
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      regex: '(?i)^/create$'

  - id: python-schtasks-delete-argument
    desc: Python uses schtasks delete argument
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      regex: '(?i)^/delete$'

  - id: python-schtasks-change-argument
    desc: Python uses schtasks change argument
    crit: component
    conf: 0.95
    for: [python]
    if:
      type: string_literal
      regex: '(?i)^/change$'

  - id: python-task-scheduler-highest-runlevel
    desc: Python task requests highest run level
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?i)<RunLevel>\s*HighestAvailable\s*</RunLevel>'

  - id: schtasks-utility-token
    desc: Windows schtasks utility reference
    ref: sha256:1fa1e028b2cad5297edcae7d505456d187bdf1bc29acba1e90d17f355951bca7
    crit: notable
    conf: 0.7
    if:
      type: text
      word: schtasks
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: persist-marker
    desc: Persistence configuration marker string
    if:
      type: text
      exact: "[PERSIST:1]"
  - id: windows-maintenance-path
    desc: "Win Maintenance scheduled task path reference"
    if:
      type: text
      substr: "\\Microsoft\\Windows\\Maintenance\\"

  - id: powershell-scheduled-task-arguments
    desc: Scheduled task action arguments read
    crit: notable
    conf: 0.93
    for: [powershell]
    if:
      type: text
      regex: '\.Actions\s*\.\s*Arguments'

  - id: powershell-schtasks-xml-create
    desc: Scheduled task XML creation
    crit: notable
    conf: 0.95
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)schtasks\s+/create[^\r\n]{0,180}/xml'

  - id: javascript-schtasks-xml-create
    desc: JavaScript schtasks XML create command
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: text
      regex: '(?i)\bschtasks\s*/create\s*/tn\b[\s\S]{0,160}/xml\b[\s\S]{0,80}/f\b'

  - id: schtasks-xml-command
    desc: schtasks command uses XML definition
    crit: notable
    conf: 0.85
    for: [go, pe, dll]
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\b.{0,20}/xml\b'

  - id: schtasks-create-cmd
    desc: Windows schtasks create command
    crit: notable
    conf: 0.92
    for: [pe, dll, powershell, batch, vbs, csharp, python, java, class, java_class]
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\s+/create\b'

  # `/TR` names the program the task will run. Naming an action is an ordinary
  # part of every schtasks invocation — installers and uninstallers included —
  # so this is the neutral flag observation next to its siblings; the intent
  # comes from what the action points at (see the ADS loader composite).
  - id: schtasks-action-argument
    desc: schtasks command supplies a /TR action
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell, batch, vbs, javascript, csharp, python]
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\b[^\r\n]{0,120}/tr\b'

  # `/SC MINUTE` and `/SC HOURLY` are the two schtasks schedule types that
  # re-launch the action many times a day. Ordinary software schedules daily,
  # weekly, or logon tasks; a sub-daily repeat is how an implant gets itself
  # restarted quickly after a kill or a reboot.
  - id: schtasks-short-repeat-schedule
    desc: Scheduled task repeats every minute or hour
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell, batch, csharp, python, go, class]
    if:
      type: text
      regex: '(?i)/sc\s+(MINUTE|HOURLY)\b'

  - id: schtasks-runlevel-highest
    desc: Scheduled task requests highest run level
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell, batch, csharp, python, go, class]
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?[^\r\n]{0,200}/rl\s+highest\b'

  - id: schtasks-system-runas
    desc: Scheduled task runs as SYSTEM
    crit: notable
    conf: 0.92
    for: [pe, dll, powershell, batch, csharp, python, go, class]
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?[^\r\n]{0,200}/ru\s+["\x27]?(SYSTEM|NT AUTHORITY\\SYSTEM)["\x27]?'

  - id: schtasks-force-flag
    desc: Scheduled task command uses force flag
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell, batch, csharp, python, go, class]
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?[^\r\n]{0,120}/f\b'

  - id: schtasks-exe-create
    desc: Windows schtasks.exe create command
    crit: notable
    conf: 0.92
    for: [pe, dll, powershell, batch, csharp, python, java, class, java_class]
    if:
      type: text
      regex: '(?i)schtasks\.exe.{0,30}create'

  - id: go-schtasks-create-command
    desc: Go invokes schtasks.exe task creation
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: '(?i)exec\.Command\(\s*["'']schtasks(\.exe)?["'']\s*,\s*["'']/create["'']'

  - id: itaskscheduler-interface
    desc: ITaskScheduler interface reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: ITaskScheduler
    unless:
      - id: metadata/signed/platform::microsoft

  - id: itaskservice-interface
    desc: Task Scheduler service interface reference
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      word: ITaskService

  - id: task-scheduler-keyword
    desc: Windows TaskScheduler API keyword
    crit: notable
    conf: 0.85
    if:
      type: text
      word: TaskScheduler

  - id: task-restart-on-failure-property
    desc: Task Scheduler restart-on-failure property
    crit: notable
    conf: 0.9
    if:
      type: text
      word: RestartOnFailure

composite_rules:
  - id: python-schtasks-query-command
    desc: Python queries scheduled tasks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-schtasks-command-token
      - id: python-schtasks-query-argument

  - id: python-schtasks-create-command
    desc: Python creates scheduled tasks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-schtasks-command-token
      - id: python-schtasks-create-argument

  - id: python-schtasks-delete-command
    desc: Python deletes scheduled tasks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-schtasks-command-token
      - id: python-schtasks-delete-argument

  - id: python-schtasks-change-command
    desc: Python changes scheduled tasks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-schtasks-command-token
      - id: python-schtasks-change-argument
