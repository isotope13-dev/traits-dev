---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-url-and-schtasks-reference
  desc: LNK HTTPS and schtasks references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/url/scheme::lnk-https-scheme-argument
  - id: micro-behaviors/os/autorun/scheduled::kv-schtasks-reference
  - id: micro-behaviors/process/config/launch::lnk-has-arguments
