defaults:
  platforms: [windows]

composite_rules:
- id: schtasks-remote-xml-argument-clues
  desc: Schtasks and remote XML option clues
  crit: suspicious
  conf: 0.93
  for: [batch, powershell, text, html, javascript, pe, dll]
  all:
  # The scheduler mention is the canonical micro-behavior atom (which already
  # covers text/html ClickFix lure formats); the remote-definition reference
  # supplies the "remote" part of this composite's claim.
  - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
  - id: micro-behaviors/process/argument/file::task-xml-remote-argument
  near_bytes: 4096
