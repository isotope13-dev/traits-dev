defaults:
  platforms: [windows]
  for: [c, cpp, rust, go]
  attack: T1053.005

traits:
  - id: schtasks-create-source
    desc: Scheduled task creation command in source
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\s*/create\b'

  - id: schtasks-appdata-executable-command
    desc: schtasks command targets AppData executable
    crit: suspicious
    conf: 0.9
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?[^\r\n]{0,320}/TR\s+"?%LocalAppData%\\[^"\r\n]{1,180}\.exe\b'
