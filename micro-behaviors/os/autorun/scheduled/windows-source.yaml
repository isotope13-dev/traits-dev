defaults:
  platforms: [windows]
  for: [scripts, source, pe, dll]
  attack: T1053.005

traits:
  - id: schtasks-appdata-executable-command
    desc: schtasks action targets AppData executable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Bind the path to /TR. Accept environment variables, expanded paths,
      # and source-escaped separators without requiring an attacker filename.
      regex: '\bschtasks.{0,320}/tr\W+[^"\n]{0,99}[%\\](Local)?AppData%?\\[^"\n]{1,180}\.exe\b'
      case_insensitive: true
