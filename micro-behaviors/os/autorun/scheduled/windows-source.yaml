defaults:
  platforms: [windows]
  for: [c, cpp, rust, go]
  attack: T1053.005

traits:
  - id: schtasks-appdata-executable-command
    desc: schtasks action targets AppData executable
    crit: suspicious
    conf: 0.9
    for: [batch, powershell, javascript, typescript, python, go, pe, dll]
    if:
      type: text
      regex: '(?i)\bschtasks[^\n]{0,320}/TR\s+"?%(Local)?AppData%\\[^"\n]{1,180}\.exe\b'
