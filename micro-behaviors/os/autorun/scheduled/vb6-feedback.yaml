defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: feedback-coded-schtasks-create
    desc: Feedback-coded schtasks create command prefix
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # UTF-16 BSTR; feedback triplets from the shared decoder. This is the
      # standard path/command, independent of any dropped filename or host.
      pattern: '79 00 4C 00 62 00 D1 00 A1 00 A8 00 70 00 4E 00 5C 00 A0 00 74 00 81 00 B9 00 A2 00 8F 00 14 20 79 00 70 00 C7 00 22 21 14 20 A3 00 39 20 7D 00 68 00 73 00 56 00 A1 00 C0 00 19 20 D1 00 F2 00 B4 00 70 00 A2 00 7F 00 37 00 12 00 5A 00 B9 00 1E 20 AD 00 AC 00 68 00 A2 00 49 00 2D 00 5F 00 62 00 4C 00 6B 00 D1 00 22 21 AE 00 7D 01 52 01 AA 00 16 00 47 00 5A 00 44 00 70 00 7D 00 74 00 1C 20 13 20'
