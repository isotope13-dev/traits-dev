composite_rules:
- id: task-create-external-ip-url-cooccurrence
  desc: Task creation and external-IP HTTP URL
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  any:
  - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
  for:
  - scripts
- id: system-interpreter-task
  desc: SYSTEM task action names a command interpreter
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
  - id: micro-behaviors/os/autorun/control::schtasks-interpreter-action
  - id: micro-behaviors/os/autorun/scheduled::windows-schtasks-create
  near_bytes: 512
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  mbc: F0012
  for:
  - scripts
  - binaries
traits: []
defaults:
  platforms:
  - windows
  attack: T1053.005
