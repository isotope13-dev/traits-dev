defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: register-scheduledtask
    desc: Registers a Windows scheduled task
    # A PS2EXE binary embeds the same cmdlet text as a .ps1, and opaque or
    # unknown-typed scripts (encoded launchers, setup scripts) carry it in
    # their string layer.
    for: [scripts, source, lnk, pe, dll, text, data]
    if:
      type: text
      regex: '(^|[^\{A-Za-z0-9_-])Register-ScheduledTask\b'
      case_insensitive: true
  - id: register-scheduledtask-encoded
    desc: Decoded layer registers a scheduled task
    crit: notable
    conf: 0.97
    for: [oledoc]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      substr: Register-ScheduledTask
      case_insensitive: true
composite_rules:
  - id: scheduled-task-registration
    desc: Registers a Windows scheduled task
    crit: notable
    conf: 0.92
    all:
      - id: register-scheduledtask
    any:
      - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction
      - id: micro-behaviors/os/autorun/task-trigger::new-scheduledtasktrigger
