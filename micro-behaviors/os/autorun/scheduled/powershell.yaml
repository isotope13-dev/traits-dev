# Neutral PowerShell scheduled-task API and trigger observations.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: register-scheduledtask
    desc: Registers a Windows scheduled task
    # A PS2EXE binary embeds the same cmdlet text as a .ps1, and opaque or
    # unknown-typed scripts (encoded launchers, setup scripts) carry it in
    # their string layer.
    for: [scripts, source, lnk, pe, dll, text, data]
    if:
      type: text
      regex: '(^|[^\{A-Za-z0-9_-])Register-ScheduledTask\b'
      case_insensitive: true

  - id: new-scheduledtaskaction
    desc: Scheduled-task action cmdlet text
    conf: 0.97
    for: [powershell, batch, oledoc]
    if:
      type: text
      substr: New-ScheduledTaskAction
      case_insensitive: true

  - id: new-scheduledtask-principal-system
    desc: Scheduled-task SYSTEM principal text
    conf: 0.93
    for: [powershell, batch]
    if:
      type: text
      regex: 'New-ScheduledTaskPrincipal[\s\S]{0,240}-UserId\s+["'']?SYSTEM'
      case_insensitive: true

  - id: new-scheduledtask-principal-local-system
    desc: Assigns a scheduled task to LocalSystem
    conf: 0.93
    if:
      type: text
      regex: 'New-ScheduledTaskPrincipal[\s\S]{0,240}LocalSystem'
      case_insensitive: true

  - id: new-scheduledtask-principal-authority-system
    desc: Assigns task to NT AUTHORITY SYSTEM
    conf: 0.93
    if:
      type: text
      regex: 'New-ScheduledTaskPrincipal[\s\S]{0,240}NT AUTHORITY\\SYSTEM'
      case_insensitive: true

  # Node/provisioning scripts embed the same cmdlet spelling in a string
  # passed to powershell.exe (observed registering an elevated trim task);
  # the spelling, not the host language, is the observation. The value may
  # be quoted (-RunLevel "Highest" is idiomatic PowerShell).
  - id: schtask-runlevel-highest
    desc: Requests highest scheduled-task run level
    for: [powershell, javascript, typescript, pe, text, data]
    if:
      type: text
      regex: -RunLevel\s+"?Highest\b
      case_insensitive: true

  - id: scheduledtask-hidden-settings
    desc: Creates hidden scheduled-task settings
    crit: notable
    conf: 0.92
    for: [scripts, source, lnk, pe, dll]
    if:
      type: text
      regex: New-ScheduledTaskSettingsSet\b[^\n]{0,160}-Hidden\b
      case_insensitive: true

  - id: new-scheduledtaskaction-encoded
    desc: Decoded layer builds scheduled-task action
    crit: notable
    conf: 0.97
    for: [oledoc, msi]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      substr: New-ScheduledTaskAction
      case_insensitive: true
  - id: register-scheduledtask-encoded
    desc: Decoded layer registers a scheduled task
    crit: notable
    conf: 0.97
    for: [oledoc]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      substr: Register-ScheduledTask
      case_insensitive: true
  - id: scheduledtask-hidden-settings-base64
    desc: Decoded hidden task settings
    crit: notable
    conf: 0.97
    for: [oledoc]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      regex: 'New-ScheduledTaskSettingsSet[\s\S]{0,160}-Hidden\b'
      case_insensitive: true

composite_rules:
  - id: scheduledtask-system-principal
    desc: Scheduled task uses a system principal
    crit: notable
    conf: 0.93
    any:
      - id: new-scheduledtask-principal-system
      - id: new-scheduledtask-principal-local-system
      - id: new-scheduledtask-principal-authority-system
      - id: micro-behaviors/os/autorun/control::scheduled-task-user-system

  - id: scheduled-task-registration
    desc: Registers a Windows scheduled task
    crit: notable
    conf: 0.92
    all:
      - id: register-scheduledtask
    any:
      - id: new-scheduledtaskaction
      - id: micro-behaviors/os/autorun/task-trigger::new-scheduledtasktrigger
