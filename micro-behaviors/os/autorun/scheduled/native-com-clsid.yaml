defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.99
traits:
  - id: task-scheduler-com-class-guid
    desc: Windows Task Scheduler COM class GUID
    if:
      type: hex
      section: text
      pattern: '9F 36 87 0F E5 A4 FC 4C BD 3E 73 E6 15 45 72 DD'
  - id: task-scheduler-com-class-guid-rdata
    desc: Task Scheduler COM CLSID in rdata
    if:
      type: hex
      section: .rdata
      pattern: '9F 36 87 0F E5 A4 FC 4C BD 3E 73 E6 15 45 72 DD'

composite_rules:
  - id: task-scheduler-com-clsid
    desc: Task Scheduler COM CLSID in text or rdata
    crit: component
    any:
      - id: task-scheduler-com-class-guid
      - id: task-scheduler-com-class-guid-rdata
