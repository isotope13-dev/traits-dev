defaults:
  platforms: [windows]
  for: [perl]
  crit: notable
  conf: 0.98
  attack: T1053.005

traits:
  - id: perl-schtasks-create-call
    desc: Perl invokes scheduled task creation
    if:
      type: symbol
      kind: call
      exact: system
      args:
        - index: 0
          regex: '(?i)^schtasks([.]exe)?$'
        - index: 1
          regex: '(?i)^/create$'
        - regex: '(?i)^/tr$'
