defaults:
  for: [text, xml]
  platforms: [windows]
  crit: notable
  conf: 0.98
  attack: T1053.005

traits:
  - id: task-xml-namespace-reference
    desc: References Task Scheduler XML namespace
    if:
      type: text
      substr: 'xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task"'

  - id: task-rundll32-command-xml
    desc: Task XML configures rundll32 command
    if:
      type: text
      regex: '(?i)<Command>\s*"?([^<"\r\n]{1,160}\\)?rundll32(\.exe)?"?\s*</Command>'
