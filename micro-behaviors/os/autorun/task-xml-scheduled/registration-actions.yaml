# Task Scheduler XML (the schtasks /xml and Register-ScheduledTask format):
# registration identity, action command and termination settings. Each is an
# ordinary task field; objective rules decide when a combination is a
# masquerade or an unwanted persistence watchdog.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.95
  attack: T1053.005

traits:
  - id: scheduled-task-xml-root
    desc: Task Scheduler XML task definition
    if:
      type: value
      path: Task.@xmlns
      exact: http://schemas.microsoft.com/windows/2004/02/mit/task

  - id: scheduled-task-microsoft-author-xml
    desc: Task XML claims Microsoft authorship
    if:
      type: text
      regex: '(?i)<Author>\s*Microsoft(\s+Corporation)?\s*</Author>'

  - id: scheduled-task-absolute-exe-command-xml
    desc: Task XML runs an absolute-path executable
    if:
      type: text
      regex: '(?i)<Command>\s*"?[A-Z]:\\[^<"\r\n]{1,240}\.exe"?\s*</Command>'

  - id: scheduled-task-hard-terminate-disabled-xml
    desc: Task XML forbids hard termination
    if:
      type: text
      regex: '(?i)<AllowHardTerminate>\s*false\s*</AllowHardTerminate>'

  # Locations Windows and Microsoft products install their own task
  # binaries under: the Windows directory, Microsoft-named Program Files
  # trees, Microsoft Shared and the Microsoft folders under AppData and
  # ProgramData (Defender platform, OneDrive, Teams).
  - id: task-command-windows-dir-xml
    desc: Task XML command in Windows directory
    crit: baseline
    if:
      type: text
      regex: '(?i)<Command>\s*"?([A-Z]:\\+Windows\\|%(windir|SystemRoot)%)'

  - id: task-command-microsoft-program-files-xml
    desc: Task XML command in Microsoft Program Files
    crit: baseline
    if:
      type: text
      regex: '(?i)<Command>\s*"?[^<"]{0,30}Program Files[^\\<]{0,6}\\(Microsoft|Windows)'

  - id: task-command-microsoft-program-files-env-xml
    desc: Task XML command in ProgramFiles Microsoft tree
    crit: baseline
    if:
      type: text
      regex: '(?i)<Command>\s*"?%ProgramFiles[^%]{0,5}%\\(Microsoft|Windows)'

  - id: task-command-microsoft-shared-xml
    desc: Task XML command in Microsoft Shared
    crit: baseline
    if:
      type: text
      regex: '(?i)<Command>\s*"?[^<"]{0,60}\\Microsoft Shared\\'

  - id: task-command-appdata-microsoft-env-xml
    desc: Task XML command in data Microsoft folder
    crit: baseline
    if:
      type: text
      regex: '(?i)<Command>\s*"?(%LocalAppData%|%AppData%|%ProgramData%)\\Microsoft\\'

  - id: task-command-appdata-microsoft-xml
    desc: Task XML command in user Microsoft folder
    crit: baseline
    if:
      type: text
      regex: '(?i)<Command>\s*"?[^<"]{0,80}\\(AppData\\(Local|Roaming)|ProgramData)\\Microsoft\\'

  # Common Files\System holds Windows' shared data-access components (ADO,
  # MSADC, OLE DB) as DLLs; a scheduled executable inside it is unusual.
  - id: task-common-files-system-exe-xml
    desc: Task runs exe from Common Files System
    if:
      type: text
      regex: '(?i)<Command>[^<]{0,80}\\Common Files\\System\\[^<]{1,200}\.exe'

  - id: task-common-files-system-env-exe-xml
    desc: Task runs exe from CommonProgramFiles System
    if:
      type: text
      regex: '(?i)<Command>[^<]{0,9}%CommonProgramFiles[^%]{0,5}%\\System\\[^<]{1,200}\.exe'

composite_rules:
  - id: scheduled-task-microsoft-location-command-xml
    desc: Task XML command in a Microsoft location
    crit: baseline
    any:
      - id: task-command-windows-dir-xml
      - id: task-command-microsoft-program-files-xml
      - id: task-command-microsoft-program-files-env-xml
      - id: task-command-microsoft-shared-xml
      - id: task-command-appdata-microsoft-env-xml
      - id: task-command-appdata-microsoft-xml

  - id: scheduled-task-common-files-system-exe-xml
    desc: Task runs exe from Common Files System
    any:
      - id: task-common-files-system-exe-xml
      - id: task-common-files-system-env-exe-xml
