defaults:
  for: [xml, text]
  platforms: [windows]
  crit: notable
  attack: T1053.005

traits:
  - id: scheduled-task-windows-root-script-command-xml
    desc: Task XML runs Windows-root script
    if:
      type: text
      regex: '(?i)<Command>\s*"?[A-Z]:\\Windows\\[^\\<"]{1,80}\.(vbs|js)"?\s*</Command>'
