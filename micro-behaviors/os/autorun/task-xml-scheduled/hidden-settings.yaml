defaults:
  platforms:
  - windows
  for:
  - go
  - pe
  - dll
  mbc: F0012
  attack: T1053.005
  crit: notable
traits:
- id: task-hidden-pattern
  desc: Scheduled task hidden setting references
  conf: 0.8
  if:
    type: text
    regex: (?i)(schtasks|scheduledtask).{0,64}hidden.{0,10}(true|\$true)
composite_rules:
- id: task-hidden
  desc: Scheduled task hidden setting references
  conf: 0.85
  any:
  - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hidden-xml
  - id: micro-behaviors/os/autorun/task-xml-scheduled::task-hidden-pattern
