defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
traits:
  - id: schtasks-service-start-action
    desc: Task action contains service-start command
    if:
      type: text
      regex: '(?i)/TR\s+["''][^"''\r\n]{0,80}\b(sc(\.exe)?\s+start|Start-Service)\s+'
      exclude_comments: true
