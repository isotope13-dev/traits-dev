# The /TR action itself launches PowerShell with a hidden window. Hidden
# PowerShell elsewhere in a file says nothing about what the task runs.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
traits:
  - id: schtasks-hidden-powershell-action
    desc: Task action runs hidden PowerShell
    crit: notable
    conf: 0.95
    attack: T1053.005,T1564.003
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      case_insensitive: true
      regex: '/tr\s+\\?["'']?[^"''\n]{0,80}\bp(owershell|wsh)\b.{0,160}[-/]w[a-z]{0,10}\s+(h\w*|1)\b'
