defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll, javascript, typescript, python, go]
traits:
  - id: schtasks-headless-powershell-action
    desc: Task action hosts headless PowerShell
    crit: notable
    conf: 0.97
    if:
      type: text
      case_insensitive: true
      regex: '/tr\s+["''][^"''\r\n]{1,220}--headless\s+(powershell|pwsh)(\.exe)?\b'
