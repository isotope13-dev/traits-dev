traits:
- id: schtasks-action-variable
  desc: schtasks action uses a variable
  crit: notable
  conf: 0.9
  for: [powershell, scripts]
  if:
    type: text
    regex: '(?is)\bschtasks(\.exe)?\b[^\r\n]{0,200}/tr\s+[^\r\n]{0,160}\\?\$[A-Za-z_][A-Za-z0-9_]*'
- for:
  - powershell
  - scripts
  - pe
  id: register-scheduledtask-appdata-target
  desc: Register-ScheduledTask APPDATA target
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)Register-ScheduledTask[^\r\n;]{0,400}\$env:APPDATA
- for:
  - powershell
  - scripts
  - pe
  id: register-scheduledtask-public-target
  desc: Register-ScheduledTask Users\Public target
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)Register-ScheduledTask[^\r\n;]{0,400}\\Users\\Public
- for:
  - powershell
  - scripts
  - pe
  id: register-scheduledtask-temp-target
  desc: Register-ScheduledTask TEMP target
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)Register-ScheduledTask[^\r\n;]{0,400}\$env:TEMP
- for:
  - powershell
  - scripts
  - pe
  - batch
  id: new-scheduledtaskaction-appdata-path
  desc: New-ScheduledTaskAction references AppData path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)New-ScheduledTaskAction\b[^\r\n]{0,240}(APPDATA|\\AppData\\)
- for:
  - powershell
  - scripts
  - pe
  - batch
  id: new-scheduledtaskaction-temp-path
  desc: New-ScheduledTaskAction references temp path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)New-ScheduledTaskAction\b[^\r\n]{0,240}(\$env:TE?MP\b|%TE?MP%|\\Temp\\)
- for:
  - powershell
  - scripts
  - pe
  - batch
  id: new-scheduledtaskaction-powershell-execute
  desc: New-ScheduledTaskAction executes PowerShell
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)New-ScheduledTaskAction\b[^\r\n]{0,90}-Execute\s+[^\r\n;]{0,40}\b(powershell|pwsh)\b
- for: &id001
  - pe
  - batch
  - powershell
  - scripts
  id: schtasks-action-appdata-path
  desc: schtasks action under APPDATA path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)/tr\s+"?[^"\n]{0,160}(%APPDATA%|\\AppData\\)
- for: *id001
  id: schtasks-action-programdata-path
  desc: schtasks action under ProgramData path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)/tr\s+"?[^"\n]{0,160}(%ProgramData%|\\ProgramData\\)
- for: *id001
  id: schtasks-action-public-path
  desc: schtasks action under Users\Public
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)/tr\s+"?[^"\n]{0,160}(C:\\Users\\Public\\|\\Users\\Public\\)
- for: *id001
  id: schtasks-action-userprofile-path
  desc: schtasks action under the current user's profile
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)/tr\s+.{0,160}%USERPROFILE%[\\/]
defaults:
  platforms:
  - windows
