defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: new-scheduledtaskaction
    desc: Scheduled-task action cmdlet text
    conf: 0.97
    for: [powershell, batch, oledoc]
    if:
      type: text
      substr: New-ScheduledTaskAction
      case_insensitive: true
  - id: new-scheduledtaskaction-encoded
    desc: Decoded layer builds scheduled-task action
    crit: notable
    conf: 0.97
    for: [oledoc, msi]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      substr: New-ScheduledTaskAction
      case_insensitive: true
