defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  attack: T1053.005

traits:
  - id: schtasks-iis-webroot-reverse-socks-action
    desc: Webroot task action requests reverse SOCKS
    if:
      type: text
      regex: '/tr\s+"[A-Z]:\\inetpub\\wwwroot\\[^"\r\n]{1,160} R(:[0-9]{1,5})?:socks"'
      case_insensitive: true
      exclude_comments: true
