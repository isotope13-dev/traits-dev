# A user-writable AutoIt source is a task action, not merely a filename found
# elsewhere in the file. No task name, interpreter basename, or script basename
# is required. Scheduling alone does not establish malicious persistence.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts, source, binaries]
  crit: notable
  conf: 0.92
  attack: T1053.005

traits:
  - id: schtasks-programdata-autoit-action
    desc: Task action references ProgramData AutoIt source
    crit: notable
    if:
      type: text
      regex: '(?i)/tr\s+[^/;&\r\n]{0,160}ProgramData%?\\[^/;&\r\n]{1,160}\.au3\b'

composite_rules:
  - id: scheduled-programdata-autoit-source
    desc: Creates task targeting ProgramData AutoIt
    all:
      - id: micro-behaviors/os/autorun/task-registration::windows-schtasks-create
      - id: schtasks-programdata-autoit-action
