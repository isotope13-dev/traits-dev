defaults:
  platforms: [windows]
  for: [batch, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: headless-conhost-action
    desc: Task action launches headless conhost
    if:
      type: text
      regex: '(?i)/tr +"conhost(\.exe)? +--headless\b'

  - id: piped-file-action-text
    desc: Task action pipes file contents into cmd
    if:
      type: text
      regex: '(?i)/tr +"[^"\r\n]{0,90}\b(more|type) +[^"|]{1,90}\|[ ^]*c\^?m\^?d\b'

  - id: piped-file-action-literal
    desc: Task literal pipes file contents into cmd
    for: [python, javascript, typescript, rust, cpp, csharp]
    if:
      type: literal
      regex: '(?i)/tr +"{1,2}[^"\r\n]{0,90}\b(more|type) +[^"|]{1,90}\|[ ^]*c\^?m\^?d\b'

composite_rules:
  - id: piped-file-action
    desc: Task action pipes file contents into cmd
    for: [batch, powershell, python, javascript, typescript, rust, cpp, csharp]
    any:
      - id: piped-file-action-text
      - id: piped-file-action-literal
