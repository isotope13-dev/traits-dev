defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: system-task-principal-webrequest-text
    desc: SYSTEM task principal and web request text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: "New-ScheduledTaskPrincipal.{0,180}NT AUTHORITY\\\\SYSTEM.{0,320}Invoke-WebRequest"
