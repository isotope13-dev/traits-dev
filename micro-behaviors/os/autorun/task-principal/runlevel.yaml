# Elevation requested through Task Scheduler is a capability. Masquerade and
# hidden-task composites require their own independent evidence.
defaults:
  platforms: [windows]
  for: [pe, dll, go, python, csharp, xml, powershell, batch]
  crit: notable
  conf: 0.9

traits:
  - id: task-runlevel-highest-assignment
    desc: Assigns highest scheduled-task run level
    if:
      type: text
      regex: '\bRunLevel["'']?\s*[:=]\s*["'']?Highest(Available)?\b'

composite_rules:
  - id: task-runlevel-highest-setting
    desc: Scheduled task requests highest run level
    any:
      - id: task-runlevel-highest-assignment
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-highest-runlevel-xml
