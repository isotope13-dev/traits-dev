defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: new-scheduledtask-principal-system
    desc: Scheduled-task SYSTEM principal text
    conf: 0.93
    for: [powershell, batch]
    if:
      type: text
      regex: 'New-ScheduledTaskPrincipal[\s\S]{0,240}-UserId\s+["'']?SYSTEM'
      case_insensitive: true
  - id: new-scheduledtask-principal-local-system
    desc: Assigns a scheduled task to LocalSystem
    conf: 0.93
    if:
      type: text
      regex: 'New-ScheduledTaskPrincipal[\s\S]{0,240}LocalSystem'
      case_insensitive: true
  - id: new-scheduledtask-principal-authority-system
    desc: Assigns task to NT AUTHORITY SYSTEM
    conf: 0.93
    if:
      type: text
      regex: 'New-ScheduledTaskPrincipal[\s\S]{0,240}NT AUTHORITY\\SYSTEM'
      case_insensitive: true

  # Node/provisioning scripts embed the same cmdlet spelling in a string
  # passed to powershell.exe (observed registering an elevated trim task);
  # the spelling, not the host language, is the observation. The value may
  # be quoted (-RunLevel "Highest" is idiomatic PowerShell).
  - id: schtask-runlevel-highest
    desc: Requests highest scheduled-task run level
    for: [powershell, javascript, typescript, pe, text, data]
    if:
      type: text
      regex: -RunLevel\s+"?Highest\b
      case_insensitive: true
composite_rules:
  - id: scheduledtask-system-principal
    desc: Scheduled task uses a system principal
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/os/autorun/task-principal::new-scheduledtask-principal-system
      - id: micro-behaviors/os/autorun/task-principal::new-scheduledtask-principal-local-system
      - id: micro-behaviors/os/autorun/task-principal::new-scheduledtask-principal-authority-system
      - id: micro-behaviors/os/autorun/control::scheduled-task-user-system
