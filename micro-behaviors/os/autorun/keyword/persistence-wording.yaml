# Prose that pairs install/management or persistence wording with a
# service-manager noun. Vocabulary only; the objectives/persistence
# composites pair it with concrete persistence surfaces.
defaults:
  platforms: [linux]
  for: [scripts, binaries]
  crit: notable
  conf: 0.84
traits:
# Gaps are limited to words, spaces and light punctuation so identifiers in
# code (`_supportIsInstalled",!1)}async init(`) do not read as a phrase.
- id: installed-service-cron-phrase
  desc: Installed/managed near service or cron
  if:
    type: text
    regex: '(?i)\b(managed|installed)\b[ \t\w,/-]{0,24}\b(service|cron)'
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: installed-init-autostart-phrase
  desc: Installed/managed near init or autostart
  if:
    type: text
    regex: '(?i)\b(managed|installed)\b[ \t\w,/-]{0,24}\b(init|autostart)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
- id: persistence-service-cron-phrase
  desc: Persistence/autorun near service or cron
  if:
    type: text
    regex: '(?i)\b(persistence|autorun)\b[ \t\w,/-]{0,24}\b(service|cron)'
- id: persistence-init-autostart-phrase
  desc: Persistence/autorun near init or autostart
  if:
    type: text
    regex: '(?i)\b(persistence|autorun)\b[ \t\w,/-]{0,24}\b(init|autostart)\b'
- id: service-cron-installed-phrase
  desc: Service or cron near installed/managed
  if:
    type: text
    regex: '(?i)\b(service|cron)\b[^.!?\r\n]{0,24}\b(managed|installed)\b'
- id: init-autostart-installed-phrase
  desc: Init or autostart near installed/managed
  if:
    type: text
    regex: '\b(init|autostart)\b[ \t\w,/-]{0,24}\b(managed|installed)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  # "removes the init script installed via page.addInitScript" is API prose.
  - id: metadata/lang/scripted::dts-declaration-file
- id: service-cron-persistence-phrase
  desc: Service or cron near persistence/autorun
  if:
    type: text
    regex: '\b(service|cron)[ \t\w,/-]{0,24}\b(persistence|autorun)\b'
- id: init-autostart-persistence-phrase
  desc: Init or autostart near persistence/autorun
  if:
    type: text
    # Exclude analytics config keys like `persistence:"localStorage"`.
    regex: '(?i)\b(init|autostart)\b[ \t\w,/-]{0,24}\b(persistence|autorun)\b([^:"]|$)'
