defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.5
traits:
  - id: startup-keyword
    desc: Startup directory keyword
    crit: baseline
    if:
      type: text
      word: Startup
  - id: launchd-keyword
    desc: References the macOS launchd service manager
    if:
      type: text
      word: launchd
    unless:
    # A name reached through a string is the reflective spelling; where the
    # direct form is already recorded, this would be the same call twice.
    - id: metadata/file/string/process-name::launchd-daemon
