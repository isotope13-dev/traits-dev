defaults:
  platforms: [windows]
  for: [javascript]

traits:
  - id: task-author-property-assignment
    desc: Assigns scheduled task author property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.RegistrationInfo\.Author\s*='
  - id: windows-defrag-task-path
    desc: Windows Defrag scheduled task path
    crit: notable
    conf: 0.9
    for: [pe, batch, powershell]
    if:
      type: text
      regex: '(?i)(\\Windows\\Defrag\\|/tn\s+["'']?\\?Windows\\Defrag\\)'
  - id: task-microsoft-author-assignment
    desc: Sets Microsoft Corporation as task author
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      # Binding the literal to Author and an alias to RegistrationInfo cannot
      # be expressed by the available call facts or unrelated nearby tokens.
      query: |
        (assignment_expression
          left: (member_expression
            object: (member_expression property: (property_identifier) @info)
            property: (property_identifier) @author)
          right: (string (string_fragment) @value)
          (#eq? @info "RegistrationInfo")
          (#eq? @author "Author")
          (#eq? @value "Microsoft Corporation")) @match
        (statement_block
          [(variable_declaration
            (variable_declarator
              name: (identifier) @alias
              value: (member_expression property: (property_identifier) @info)))
           (lexical_declaration
            (variable_declarator
              name: (identifier) @alias
              value: (member_expression property: (property_identifier) @info)))]
          (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @author)
              right: (string (string_fragment) @value)))
          (#eq? @info "RegistrationInfo")
          (#eq? @author "Author")
          (#eq? @alias @receiver)
          (#eq? @value "Microsoft Corporation")) @match
        (program
          [(variable_declaration
            (variable_declarator
              name: (identifier) @alias
              value: (member_expression property: (property_identifier) @info)))
           (lexical_declaration
            (variable_declarator
              name: (identifier) @alias
              value: (member_expression property: (property_identifier) @info)))]
          (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @author)
              right: (string (string_fragment) @value)))
          (#eq? @info "RegistrationInfo")
          (#eq? @author "Author")
          (#eq? @alias @receiver)
          (#eq? @value "Microsoft Corporation")) @match
