defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: scheduledtask-hidden-settings
    desc: Creates hidden scheduled-task settings
    crit: notable
    conf: 0.92
    for: [scripts, source, lnk, pe, dll]
    if:
      type: text
      regex: New-ScheduledTaskSettingsSet\b[^\n]{0,160}-Hidden\b
      case_insensitive: true
  - id: scheduledtask-hidden-settings-base64
    desc: Decoded hidden task settings
    crit: notable
    conf: 0.97
    for: [oledoc]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      regex: 'New-ScheduledTaskSettingsSet[\s\S]{0,160}-Hidden\b'
      case_insensitive: true
