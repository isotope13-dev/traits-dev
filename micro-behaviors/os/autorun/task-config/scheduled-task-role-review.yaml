# Neutral Windows scheduled-task capabilities and persistence-related markers.
# Objective rules combine these observations with intent-specific evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1053.005
  mbc: F0012
traits:
  - id: schtasks-xml-command
    desc: schtasks command uses XML definition
    crit: notable
    conf: 0.85
    for: [go, pe, dll]
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\b.{0,20}/xml\b'

  - id: schtasks-force-flag
    desc: Scheduled task command uses force flag
    crit: notable
    conf: 0.9
    for: [pe, dll, powershell, batch, csharp, python, go, class]
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?[^\r\n]{0,120}/f\b'

  - id: task-restart-on-failure-property
    desc: Task Scheduler restart-on-failure property
    crit: notable
    conf: 0.9
    if:
      type: text
      word: RestartOnFailure

  - id: task-scheduler-newtask-call
    desc: Task Scheduler creates a new task definition
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)\.NewTask\s*\('

