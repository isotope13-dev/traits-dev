defaults:
  platforms: [windows]
  for: [pe, dll, csharp, go]
  crit: notable
  conf: 0.9
  attack: T1053.005
  mbc: F0012

traits:
  - id: schtasks-logon-trigger
    desc: Scheduled task uses a user-logon trigger
    if:
      type: text
      regex: '(?i)/sc\s+onlogon\b'
    unless:
      - id: well-known/app/development/calvyn-code

  - id: schtasks-boot-trigger
    desc: Scheduled task uses a system-start trigger
    if:
      type: text
      regex: '(?i)/sc\s+onstart\b'
    unless:
      - id: well-known/app/storage/peazip::peazip-main-executable
      - id: well-known/app/development/nvm-windows::nvm4w-registration-task-name
      - id: well-known/app/system/iobit::iobit-component-context

  - id: scheduled-task-boot-trigger-xml
    desc: Scheduled task XML system-start trigger
    if:
      type: text
      regex: '(?i)<BootTrigger\s*(>|\s[A-Za-z-]{1,20}=)'

composite_rules:
  - id: scheduled-task-logon-trigger
    desc: Scheduled task runs at user logon
    any:
      - id: schtasks-logon-trigger
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-logon-trigger-xml

  - id: scheduled-task-startup-trigger
    desc: Scheduled task runs at logon or system start
    any:
      - id: scheduled-task-logon-trigger
      - id: schtasks-boot-trigger
      - id: scheduled-task-boot-trigger-xml
