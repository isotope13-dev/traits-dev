# Privileged boot tasks also provision SSH keys and run ordinary services.
# These file-scoped settings do not establish unwanted persistence, concealment,
# escalation from a lower privilege, or that every setting belongs to one task.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: system-startup-task-settings
    desc: Task registration with SYSTEM startup settings
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: micro-behaviors/os/autorun/scheduled::scheduledtask-system-principal
      - id: micro-behaviors/os/autorun/scheduled::schtask-runlevel-highest
      - id: micro-behaviors/os/autorun/scheduled::schtask-trigger-at-startup
