defaults:
  platforms:
  - windows
  for:
  - python
traits:
- id: python-periodic-remote-eval-registration
  desc: Periodic hidden script-eval task registration
  crit: notable
  conf: 0.99
  attack: T1053.005
  if:
    type: tree-sitter
    query: |-
      ((call
        function: (attribute
          object: (identifier) @_module
          attribute: (identifier) @_method)
        arguments: (argument_list
          (list
            . (string (string_content) @_tool)
            (string (string_content) @_create)
            (string (string_content) @_sc)
            . (string (string_content) @_trigger)
            (string (string_content) @_tr)
            . [(string) (concatenated_string)] @action))) @registration
        (#eq? @_module "subprocess")
        (#match? @_method "^(run|Popen|call|check_call)$")
        (#match? @_tool "(?i)^schtasks(\\.exe)?$")
        (#match? @_create "(?i)^/create$")
        (#match? @_sc "(?i)^/sc$")
        (#match? @_trigger "(?i)^(minute|hourly)$")
        (#match? @_tr "(?i)^/tr$")
        (#match? @action "(?is)-(w|windowstyle) +hidden")
        (#match? @action "(?is)powershell.{0,160}\\biwr\\b")
        (#match? @action "(?is)iwr.{0,64}https?://[^|]{1,300}\\| *iex"))
