defaults:
  platforms:
  - windows
  for:
  - powershell
  crit: notable
  conf: 0.9

traits:
  - id: new-scheduledtasktrigger
    desc: Builds a scheduled-task trigger
    if:
      type: text
      substr: New-ScheduledTaskTrigger
      case_insensitive: true

  - id: scheduledtask-daily-fixed-time
    desc: Creates a daily fixed-time task trigger
    if:
      type: text
      regex: '(?i)\bNew-ScheduledTaskTrigger\b[^\r\n]{0,160}-Daily\b[^\r\n]{0,80}-At\b'

  - id: schtask-trigger-at-startup
    desc: Scheduled-task startup trigger text
    crit: notable
    for: [powershell, batch]
    if:
      type: text
      regex: New-ScheduledTaskTrigger\b[^\n]{0,80}-AtStartup\b
      case_insensitive: true

  - id: schtask-trigger-at-logon
    desc: Creates an at-logon task trigger
    crit: notable
    for: [powershell, pe, text, data]
    if:
      type: text
      regex: New-ScheduledTaskTrigger\b[^\n]{0,80}-AtLogon\b
      case_insensitive: true

  - id: scheduledtask-repeating-trigger
    for: [scripts, source, lnk, pe, dll]
    desc: Scheduled task repetition trigger
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: New-ScheduledTaskTrigger\b[^\n]{0,160}-RepetitionInterval\b
      case_insensitive: true

  - id: new-scheduledtasktrigger-encoded
    desc: Decoded layer builds scheduled-task trigger
    crit: notable
    conf: 0.97
    for: [oledoc, msi]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      substr: New-ScheduledTaskTrigger
      case_insensitive: true
  - id: scheduledtask-repetition-interval-encoded
    desc: Decoded layer sets task repetition interval
    crit: notable
    conf: 0.97
    for: [oledoc, msi]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      substr: -RepetitionInterval
      case_insensitive: true

  - id: scheduledtask-repeating-trigger-base64
    desc: Decoded repeating task trigger
    crit: notable
    conf: 0.97
    for: [oledoc]
    attack: T1053.005
    if:
      type: encoded
      encoding: base64
      regex: '-(RepetitionInterval|RepetitionDuration)\b'
      case_insensitive: true

