# Neutral Windows scheduled-task capabilities and persistence-related markers.
# Objective rules combine these observations with intent-specific evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1053.005
  mbc: F0012
traits:
  - id: hex-task-scheduler-time-trigger-time
    desc: Hex fragment for Task Scheduler time trigger
    crit: component
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)["'']54696d65["'']'

  - id: hex-task-scheduler-time-trigger-trigger
    desc: Hex fragment for Task Scheduler time trigger
    crit: component
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      regex: '(?i)["'']54726967676572["'']'

  - id: htmlhelp-schtasks-minute-entity
    desc: HTML numeric references spell a minute schedule
    crit: component
    conf: 0.95
    for: [html]
    if:
      type: text
      substr: '&#x2f;&#x73;&#x63;&#x20;&#x6d;&#x69;&#x6e;&#x75;&#x74;&#x65;'
      case_insensitive: true
  - id: htmlhelp-schtasks-minute-text
    desc: HTML command contains a minute schedule option
    crit: component
    conf: 0.95
    for: [html]
    if:
      type: text
      substr: /sc minute
      case_insensitive: true

  - id: jvm-schtasks-minute-value
    desc: JVM schtasks minute schedule
    crit: component
    conf: 0.96
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^minute$'

  - id: task-scheduler-trigger-create-call
    desc: Task Scheduler trigger-creation call
    crit: notable
    conf: 0.94
    for: [scripts, binaries, mp3]
    if:
      type: text
      # WSH commonly stores the trigger type in a Const or variable before
      # calling Create, so the argument is not necessarily the literal `1`.
      # The scheduler composite supplies the surrounding API context.
      regex: '(?i)\bTriggers?\s*\.\s*Create\s*\(\s*[A-Za-z_0-9]+\s*\)'

composite_rules:
  - id: hex-task-scheduler-time-trigger
    desc: Hex-reconstructed Task Scheduler time trigger
    crit: notable
    conf: 0.97
    for: [scripts, binaries, mp3]
    near_bytes: 1024
    all:
      - id: hex-task-scheduler-time-trigger-time
      - id: hex-task-scheduler-time-trigger-trigger

  - id: htmlhelp-schtasks-minute-option
    desc: HTML Help command contains a minute schedule
    crit: component
    conf: 0.95
    for: [html]
    any:
      - id: htmlhelp-schtasks-minute-entity
      - id: htmlhelp-schtasks-minute-text
