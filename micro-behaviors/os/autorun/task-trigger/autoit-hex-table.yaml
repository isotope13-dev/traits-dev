defaults:
  platforms:
  - windows
  for:
  - text
traits:
- id: autoit-hex-recurring-self-task-profile
  desc: AutoIt task with encoded one-minute interval
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |
      rule autoit_clipper_recurring_self_task {
        strings:
          $create = "_TASKCREATE (" nocase
          $exists = "_TASKEXISTS (" nocase
          $minute = "5054314D" nocase
          $self = "204053637269707446756C6C5061746820" nocase
        condition:
          all of them
      }
  attack: T1053.005
