composite_rules:
- id: elevated-short-interval-task
  desc: Sub-10-minute task with elevated run account
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
  any:
  - id: micro-behaviors/os/autorun/scheduled::schtasks-runlevel-highest
  - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
  unless:
  - id: metadata/package/testing/presence/harness::shell-example-directory
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - powershell
  attack: T1053.005
  mbc: F0012
