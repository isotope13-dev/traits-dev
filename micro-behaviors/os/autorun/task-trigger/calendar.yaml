defaults:
  for: [powershell, batch, pe, dll, csharp]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: schtasks-daily-trigger-option
    desc: Task command specifies a daily trigger
    if:
      type: text
      regex: '(?i)/sc\s+daily\b'
  - id: schtasks-idle-trigger-option
    desc: Task command specifies an idle trigger
    if:
      type: text
      regex: '(?i)/sc\s+onidle\b'
