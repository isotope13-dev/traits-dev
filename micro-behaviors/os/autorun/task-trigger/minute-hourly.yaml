# The schedule class does not fix its interval: /MO can be 30 or more.
# Preserve the existing matcher, scope and severity from scheduled/.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.9
  attack: T1053.005
  mbc: F0012

traits:
  - id: schtasks-minute-or-hourly-option
    desc: Minute- or hour-based scheduled-task option
    if:
      type: text
      # Accept both a command line and adjacent quoted argv elements.
      regex: '(?i)/sc(\s+|["'']\s*,\s*["''])(MINUTE|HOURLY)\b'
