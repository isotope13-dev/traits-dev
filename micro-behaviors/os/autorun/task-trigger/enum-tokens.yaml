# Enum definitions are references, not evidence of task registration.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: task-trigger-boot-token
    desc: Task Scheduler boot-trigger enum reference
    conf: 0.92
    if:
      type: text
      word: TASK_TRIGGER_BOOT
    unless:
      - id: metadata/build/generated::winmd-metadata

  - id: task-trigger-logon-token
    desc: Task Scheduler logon-trigger enum reference
    conf: 0.9
    if:
      type: text
      word: TASK_TRIGGER_LOGON
    unless:
      - id: metadata/build/generated::winmd-metadata

