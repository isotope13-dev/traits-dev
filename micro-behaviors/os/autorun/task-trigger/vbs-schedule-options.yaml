defaults:
  platforms: [windows]
  for: [vbs]
traits:
  - id: schtasks-minute-trigger
    desc: Minute-based task schedule option
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)/sc\s+minute\b'
  - id: schtasks-small-schedule-modifier
    desc: Task schedule modifier from 1 through 59
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)/mo\s+([1-9]|[1-5][0-9])\b'
