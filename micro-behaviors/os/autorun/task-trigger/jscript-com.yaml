defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
  conf: 0.98
traits:
  - id: wsh-com-boot-trigger
    desc: Task Scheduler COM creates a system-boot trigger
    if:
      type: symbol
      kind: call
      regex: '\.Triggers\.Create$'
      arg:
        index: 0
        kind: number
        value: 8
  - id: wsh-com-logon-trigger
    desc: Task Scheduler COM creates a user-logon trigger
    if:
      type: symbol
      kind: call
      regex: '\.Triggers\.Create$'
      arg:
        index: 0
        kind: number
        value: 9
