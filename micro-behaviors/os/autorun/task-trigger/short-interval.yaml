defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell, javascript, typescript, python, go]
  attack: T1053.005
traits:
  - id: schtasks-minute-short-interval
    desc: schtasks /sc MINUTE with sub-10-min interval
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'schtasks[^\n]{0,80}/sc\s+MINUTE[^\n]{0,80}/mo\s+[1-9]\b'
      case_insensitive: true
