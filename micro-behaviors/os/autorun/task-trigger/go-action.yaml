defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.99
traits:
  - id: go-schtasks-boot-action
    desc: Go startup task trigger and action
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - {index: 0, kind: string, exact: schtasks}
        - {index: 1, kind: string, exact: /Create}
        - {index: 2, kind: string, exact: /SC}
        - {index: 3, kind: string, exact: ONSTART}
        - {index: 6, kind: string, exact: /TR}
  - id: go-schtasks-logon-action
    desc: Go logon task trigger and action
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - {index: 0, kind: string, exact: schtasks}
        - {index: 1, kind: string, exact: /Create}
        - {index: 2, kind: string, exact: /SC}
        - {index: 3, kind: string, exact: ONLOGON}
        - {index: 6, kind: string, exact: /TR}
