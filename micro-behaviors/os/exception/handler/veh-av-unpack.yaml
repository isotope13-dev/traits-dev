# x64 Vectored Exception Handler callback that filters STATUS_ACCESS_VIOLATION
# (0xC0000005), sets PAGE_EXECUTE_READWRITE (0x40), XOR-decrypts the faulting
# region in place with a non-zero key, and returns EXCEPTION_CONTINUE_EXECUTION.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

traits:
  - id: x64-veh-av-xor-unpack-continue
    desc: x64 AV handler XOR-decrypts page and continues
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '48 8B ?? [0-4] 81 (38|39|3A|3B|3E|3F) 05 00 00 C0 (75|0F 85) [60-140] BA 40 00 00 00 [6-24] 80 34 ?? ~00 [2-16] 75 ?? [24-72] B8 FF FF FF FF'
