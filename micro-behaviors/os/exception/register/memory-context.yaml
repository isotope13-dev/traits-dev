defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
- id: unwind-and-memory-api-profile
  desc: Unwind registration and virtual memory APIs
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/mem/protect/modify::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/os/exception/register::rtl-add-function-table
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: metadata/signed/platform/
  - id: metadata/lang/compiler/aot::native-runtime-large-file
  - id: metadata/lang/compiler/aot::huge-runtime-function-count
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-windows-package-context
  # V8 and the sandbox register unwind tables and change page protection.
  - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
  - id: well-known/lib/runtime/scripted/bun-runtime::bun-windows-runtime-binary
