defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: unwind-and-memory-api-profile
    desc: Unwind registration and virtual memory APIs
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
