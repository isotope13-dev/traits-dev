# Mach exception-port registration is a neutral OS capability.  Crash
# reporters and runtimes use it to turn fatal signals into stack traces.
defaults:
  platforms: [macos, ios]
  for: [macho, c]
  attack: T1622

traits:
- id: task-set-exception-ports
  desc: Register Mach task exception ports
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: task_set_exception_ports
- id: thread-set-exception-ports
  desc: Register Mach thread exception ports
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: thread_set_exception_ports

composite_rules:
# Breakpad, Crashpad, PLCrashReporter and every JIT that traps EXC_BAD_ACCESS
# register at both scopes, so the pair on its own is a crash-handler
# capability, not an intent signal.  Objectives that read it as a backdoor
# supply the foreign-task leg themselves.
- id: task-and-thread-exception-ports
  desc: Registers Mach task and thread exception ports
  crit: notable
  conf: 0.9
  all:
  - id: task-set-exception-ports
  - id: thread-set-exception-ports
