defaults:
  platforms:
    - windows
composite_rules:
  - id: small-mingw-thread-exception-memory-profile
    desc: Small loader-named MinGW PE with thread and memory APIs
    crit: suspicious
    conf: 0.75
    for:
      - pe
    all:
      - id: micro-behaviors/fs/path/file::small-loader-executable-name-text
      - id: metadata/lang/compiler/native::mingw-runtime-marker
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
