defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: errno-esrch-assignment
    desc: Sets errno to no-such-process
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\berrno\s*=\s*ESRCH\s*;'

  - id: negative-errno-assignment-repeated
    desc: Repeated negative errno constant assignments
    platforms: [unix, windows]
    crit: notable
    conf: 0.85
    for: [c, cpp, text]
    # `retval = -EINVAL;`. Counted rather than located: two of these in a row
    # means the first one never survives.
    if:
      type: text
      regex: '^[+\s]*\w{1,16}\s*=\s*-E[A-Z]{2,10}\s*;'
    count_min: 2

  - id: negative-errno-return
    desc: Returns a negative errno constant
    platforms: [linux]
    crit: notable
    conf: 0.6
    for:
      - c
    # `return -E<NAME>` — the negative-errno return idiom. The `return -E`
    # prefix is the discriminator (a bare `E[A-Z]+` identifier would FP on
    # EXIT/ERROR/etc.), so this stays a source-text match.
    if:
      type: text
      regex: 'return\s+-E[A-Z]{2,}\b'
