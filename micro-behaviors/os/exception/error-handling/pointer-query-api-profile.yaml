defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: seh-debug-output-pointer-query-api-profile
  desc: Exception, debug-output and pointer-query APIs
  crit: notable
  conf: 0.9
  all:
    - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
    - id: micro-behaviors/process/debug/event::output-debug-string
  any:
    - id: micro-behaviors/mem/query::is-bad-read-ptr
    - id: micro-behaviors/mem/query::is-bad-write-ptr
