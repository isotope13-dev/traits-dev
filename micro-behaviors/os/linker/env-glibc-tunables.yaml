defaults:
  platforms: [unix, android, ios]
  for: [elf, shell, source]
traits:
  - id: glibc-tunables-reference
    desc: References the GLIBC_TUNABLES loader variable
    crit: notable
    conf: 0.85
    if:
      type: text
      word: GLIBC_TUNABLES
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: path
        basename: true
        exact: ldconfig
      - id: well-known/lib/native/glibc
      - id: metadata/binary/linking/static/
      - id: well-known/tool/development/runtime/qemu
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
