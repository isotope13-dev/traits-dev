defaults:
  platforms: [aix]
  for: [c, cpp, elf, shell, php]
traits:
  - id: libpath
    desc: LIBPATH environment variable (AIX)
    crit: notable
    conf: 0.7
    mbc: F0015
    attack: T1574.006
    if:
      type: text
      # Match the AIX loader variable as a standalone token.  In particular,
      # do not treat the Windows linker option /LIBPATH: as an AIX variable.
      regex: '(^|[^A-Za-z0-9_/])LIBPATH([^A-Za-z0-9_:]|$)'
