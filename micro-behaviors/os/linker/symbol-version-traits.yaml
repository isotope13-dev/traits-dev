# Symbol versioning as expressed in source: the attributes and directives that
# bind an exported function to a named ABI version set.
defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  # `__attribute__((version("PAM_1.0")))`, or the `.symver` directive it lowers
  # to, places a symbol into a named version set. Real libraries maintaining a
  # stable ABI use this, and so does a shim built to be loaded in place of one: a
  # versioned symbol is what lets the replacement satisfy a consumer linked
  # against the original's versioned reference. Neutral on its own -- the
  # impersonation is established by which ABI is being claimed.
  - id: source-symbol-version-binding
    desc: Binds a symbol to an ABI version
    if:
      type: text
      regex: '(__attribute__\s*\(\s*\(\s*version\s*\(|\.symver\s+[A-Za-z_])'
