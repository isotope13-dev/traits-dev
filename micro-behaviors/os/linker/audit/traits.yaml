# ELF dynamic-linker audit callbacks are a neutral instrumentation capability.
# A hostile execution-flow interpretation requires additional context; the
# objective layer combines these callbacks and excludes recognized tracers.
defaults:
  platforms: [linux]
  for: [elf, so]
  crit: notable
  conf: 0.95

traits:
  - id: audit-version-callback
    desc: ELF linker-audit version callback
    if:
      type: export
      exact: la_version

  - id: audit-object-open-callback
    desc: ELF linker-audit object-open callback
    if:
      type: export
      exact: la_objopen

  - id: audit-symbol-bind-callback
    desc: ELF linker-audit symbol-bind callback
    if:
      type: export
      regex: '^la_symbind(32|64)$'

  - id: audit-plt-enter-callback
    desc: ELF linker-audit PLT-entry callback
    if:
      type: export
      regex: '^la_[a-z0-9]+_gnu_pltenter$'

  - id: audit-plt-exit-callback
    desc: ELF linker-audit PLT-exit callback
    if:
      type: export
      regex: '^la_[a-z0-9]+_gnu_pltexit$'
