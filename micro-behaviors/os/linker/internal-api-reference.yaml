defaults:
  platforms: [unix, android, ios]
  for: [elf, shell]
  crit: notable
  conf: 0.8
traits:
  - id: next-symbol-lookup-reference
    desc: References next-definition symbol lookup call
    if:
      type: text
      substr: dlsym(RTLD_NEXT
  - id: libc-internal-symbol-lookup-reference
    desc: References internal libc symbol lookup API
    if:
      type: text
      substr: __libc_dlsym
  - id: libc-internal-library-loader-reference
    desc: References internal libc library loading API
    if:
      type: text
      substr: __libc_dlopen_mode
composite_rules:
  - id: dynamic-linker-api-reference
    desc: Interposition or internal linker API reference
    # Preserve one alternative in the existing needs: 2 consumer. These API
    # references also occur in auditing/instrumentation; intent is separate.
    any:
      - id: next-symbol-lookup-reference
      - id: libc-internal-symbol-lookup-reference
      - id: libc-internal-library-loader-reference
    unless:
      - id: micro-behaviors/dylib/library/libc/
      - id: well-known/tool/reverse-engineering/frida/
      - id: micro-behaviors/dylib/library/family/
      - id: well-known/tool/sysadmin/ripgrep::repository-marker
      - id: micro-behaviors/metaprogramming/generation::configured-source-builder
      - id: well-known/lib/native/jemalloc/
