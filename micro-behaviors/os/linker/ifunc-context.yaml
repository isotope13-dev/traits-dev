# Same-file capabilities; no resolver-body binding or hijack is established.
defaults:
  platforms: [linux, unix, android]
  for: [elf]
  crit: notable
  conf: 0.95
composite_rules:
  - id: ifunc-with-environment-api
    desc: IFUNC symbols coexist with environment-query APIs
    all:
      - id: metadata/binary/linking/runtime::ifunc
      - id: micro-behaviors/os/env/read::getenv
  - id: ifunc-with-process-identity-api
    desc: IFUNC symbols coexist with process-identity APIs
    all:
      - id: metadata/binary/linking/runtime::ifunc
      - id: micro-behaviors/process/identity/query
