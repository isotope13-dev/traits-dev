defaults:
  platforms: [windows]
  for: [scripts, go, pe, html, lnk]
traits:
  - id: create-shortcut
    desc: Creates a Windows shortcut from script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.CreateShortcut.{0,160}\.lnk\b|\.lnk.{0,240}\.CreateShortcut'
      case_insensitive: true
    unless:
      - type: text
        substr: ShortcutService/CreateShortcut
      - type: text
        substr: ServiceClient.createShortcut(
      - type: text
        substr: "ServiceClient.createShortcut("
  - id: go-formatted-or-computed-path-shortcut
    desc: Go creates shortcut at variable path
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '\.CreateShortcut\(\s*(["'']%s["'']|[^\r\n]{0,80}\+\s*\w+)'
  - id: shortcut-target-path
    desc: Assigns a shortcut target path
    crit: component
    conf: 0.75
    if:
      type: text
      substr: .TargetPath
  - id: browser-target-path
    desc: Shortcut target references browser executable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\.TargetPath\s*=.{0,240}\b(chrome|msedge|brave|firefox)(\.exe)?\b'
  - id: shortcut-arguments
    desc: Assigns shortcut launch arguments
    crit: component
    conf: 0.75
    if:
      type: text
      substr: .Arguments
  - id: shortcut-icon-location-assign
    desc: Assigns shortcut IconLocation property
    crit: notable
    conf: 0.88
    for: [vbs, powershell, batch, javascript, python]
    if:
      type: text
      regex: '(?i)\.IconLocation\s*='
  - id: shortcut-quoted-path-argument
    desc: Assigns a quoted path as shortcut arguments
    crit: notable
    conf: 0.88
    for: [vbs, powershell, batch, javascript, python, go]
    if:
      type: text
      regex: '(?i)\.Arguments\s*=\s*("{2,4}|chr\(\s*34\s*\))'
  - id: shortcut-save
    desc: Creates then saves Windows shortcut
    crit: notable
    conf: 0.9
    if:
      type: text
      # `.Save()` alone is a generic method used by configuration libraries.
      regex: '(?is)\.CreateShortcut.{0,800}\.Save\s*(\(\s*\))?'
      case_insensitive: true
  - id: shortcut-save-symbol
    desc: Calls a shortcut object's Save method
    crit: component
    conf: 0.8
    for: [python]
    if:
      type: symbol
      kind: call
      regex: 'Save$'
  # A shortcut configured to launch via `cmd /c start ...` — the weaponized-LNK
  # idiom where the payload runs hidden while a decoy file opens for the victim.
  - id: lnk-arguments-cmd-start
    desc: Shortcut arguments run cmd start launcher
    crit: suspicious
    conf: 0.88
    for: [javascript, vbs, html]
    if:
      type: text
      regex: '\.Arguments\s*=\s*["''][^"''\n]{0,40}/c\b[^"''\n]{0,80}\bstart\b'
  - id: shortcut-creates-lnk
    desc: Creates a shortcut for an LNK path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\.CreateShortcut\s*\([^)\r\n]{0,120}\.lnk\b'
      case_insensitive: true

composite_rules:
  - id: shortcut-creation
    desc: Creates a Windows shortcut
    crit: notable
    conf: 0.92
    any:
      - id: create-shortcut
      - id: go-formatted-or-computed-path-shortcut
