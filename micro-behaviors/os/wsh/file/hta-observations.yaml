defaults:
  platforms: [windows]
  for: [vbs, html]

traits:
  - id: html-create-shortcut-call
    desc: HTML creates Windows shortcut
    crit: notable
    conf: 0.94
    for: [html]
    if:
      type: text
      regex: '\.CreateShortcut\s*\('


  - id: html-shortcut-target-path
    desc: HTML assigns shortcut TargetPath
    crit: notable
    conf: 0.93
    for: [html]
    if:
      type: text
      regex: '\.TargetPath\s*='

  # micro-behaviors/process/interpreter/eval/direct::js-eval-variable-text is a
  # tree-sitter AST query scoped `for: [javascript, typescript]` -- it never
  # evaluates on an html-typed leaf. hta-hex-xor-string-decoder below requires
  # the html-only <hta:application> marker, so any composite built on it can
  # only ever fire on html; this is the text-mode equivalent for that type.

