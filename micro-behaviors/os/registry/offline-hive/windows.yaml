defaults:
  platforms: [windows]
  for: [scripts, binaries, pe, dll, python]
  crit: notable
  conf: 0.92

traits:
  - id: reg-load-app-key-api
    desc: References private-hive RegLoadAppKey API
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bRegLoadAppKey[AW]?\b'

  - id: offreg-create-key-api
    desc: References offline-key ORCreateKey API
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bORCreateKey\b'

  - id: offreg-set-value-api
    desc: References offline-value ORSetValue API
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bORSetValue\b'

  - id: offreg-save-hive-api
    desc: References offline-hive ORSaveHive API
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bORSaveHive\b'
