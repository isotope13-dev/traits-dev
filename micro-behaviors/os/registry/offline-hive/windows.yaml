# Offline registry hive forging via RegLoadAppKeyW and Microsoft offreg.dll.
# Used to build mandatory profile hives (NTUSER.MAN) without admin rights and
# without live RegSetValue events — "Corrupting the Hive Mind" class persist.
defaults:
  platforms: [windows]
  for: [scripts, binaries, pe, dll, python]
  attack: T1112,T1547.001
  crit: notable
  conf: 0.92

traits:
  - id: reg-load-app-key-api
    desc: References private-hive RegLoadAppKey API
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bRegLoadAppKey[AW]?\b'

  - id: offreg-dll-load
    desc: References offline registry library offreg.dll
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\boffreg\.dll\b'

  - id: offreg-create-key-api
    desc: References offline-key ORCreateKey API
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bORCreateKey\b'

  - id: offreg-set-value-api
    desc: References offline-value ORSetValue API
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bORSetValue\b'

  - id: offreg-save-hive-api
    desc: References offline-hive ORSaveHive API
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bORSaveHive\b'

  - id: ntuser-man-profile-path
    desc: Mandatory profile hive NTUSER.MAN path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bNTUSER\.MAN\b'
