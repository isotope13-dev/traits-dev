defaults:
  platforms: [windows]
  for: [c, cpp, python]
  crit: notable
  conf: 0.96

traits:
  - id: native-load-default-user-hive
    desc: Loads the Default User NTUSER.DAT registry hive
    for: [c, cpp]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)RegLoadKey[AW]?\s*\(([^,]{1,64},){2}.{0,99}\\Users\\+Default\\+NTUSER\.DAT"'
  - id: winreg-load-default-user-hive
    desc: winreg loads the Default User NTUSER.DAT hive
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)LoadKey$'
      arg:
        index: 2
        kind: string
        regex: '(?i)[\\/]Users[\\/]+Default[\\/]+NTUSER\.DAT$'

composite_rules:
  - id: default-user-hive-load
    desc: Loads the Default User NTUSER.DAT registry hive
    any:
      - id: native-load-default-user-hive
      - id: winreg-load-default-user-hive
