defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96

traits:
  - id: sam-domains-account-subpath
    desc: SAM Domains Account registry subpath
    if:
      type: text
      exact: 'SAM\Domains\Account'

  - id: lsa-policy-secrets-subpath
    desc: LSA Policy Secrets registry subpath
    if:
      type: text
      exact: 'Policy\Secrets'
