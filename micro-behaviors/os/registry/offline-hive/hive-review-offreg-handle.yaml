defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: offreg-open-hive-by-handle-call
    desc: Calls offline registry OROpenHiveByHandle
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])OROpenHiveByHandle$'

