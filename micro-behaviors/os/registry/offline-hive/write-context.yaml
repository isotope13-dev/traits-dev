composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  - python
  id: offreg-hive-write-api-context
  desc: Offline registry hive write API references
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/registry/offline-hive::offreg-dll-load
  - id: micro-behaviors/os/registry/offline-hive::offreg-create-key-api
  - id: micro-behaviors/os/registry/offline-hive::offreg-set-value-api
  - id: micro-behaviors/os/registry/offline-hive::offreg-save-hive-api
  unless:
  - id: metadata/build/generated::winmd-metadata
  - id: well-known/lib/platform/rust-system-bindings::windows-rs-binding-crate
  - id: metadata/binary/symbols/compiler::coff-import-pointer-prefix
