# Internet Explorer's low-integrity InternetRegistry key: where IE's
# Protected Mode virtualizes registry writes. Legitimate inside IE; other
# programs storing state there are hiding it among browser plumbing.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: ie-internetregistry-key
    desc: IE low-integrity InternetRegistry key path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '^Software\\Microsoft\\Internet Explorer\\InternetRegistry(\\\w{1,16})?$'
