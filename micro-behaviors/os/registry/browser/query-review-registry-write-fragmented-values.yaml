defaults:
  platforms:
  - windows
  for:
  - html
  - vbs
  crit: notable
  conf: 0.97

composite_rules:
  - id: fragmented-regwrite-homepage-lock
    desc: RegWrite enables fragmented homepage lock
    near_lines: 0
    all:
      - id: micro-behaviors/os/registry/write::regwrite-enable-dword
      - id: micro-behaviors/os/registry/keys/policy::fragmented-homepage-value
      - id: micro-behaviors/os/registry/keys/browser::fragmented-internet-explorer-path
  - id: fragmented-regwrite-start-page
    desc: RegWrite targets a fragmented Start Page value
    near_lines: 0
    all:
      - id: micro-behaviors/os/registry/write::wscript-regwrite
      - id: micro-behaviors/os/registry/keys/browser::fragmented-ie-start-page
      - id: micro-behaviors/os/registry/keys/browser::fragmented-internet-explorer-path
