# Windows Internet Settings registry key. WinINet proxies, autodial and
# per-connection settings live under this key; referencing it identifies the
# configuration surface, while modification requires a registry write API.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: internet-settings-key
    desc: Windows Internet Settings registry key path
    if:
      type: text
      case_insensitive: true
      substr: 'Software\Microsoft\Windows\CurrentVersion\Internet Settings'
