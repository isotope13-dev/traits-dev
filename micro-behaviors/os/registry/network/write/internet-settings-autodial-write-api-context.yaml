# WinINet autodial configuration below the registry API. The autodial
# reference alone names the dial-on-demand setting; paired with the registry
# write chain it is a program configuring autodial through the registry
# rather than through the WinINet API.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.88

traits:
  - id: internet-settings-autodial-path
    desc: Internet Settings autodial reference
    if:
      type: text
      case_insensitive: true
      substr: autodial

composite_rules:
  - id: internet-settings-autodial-write-api-context
    desc: Autodial reference with registry write API
    all:
      - id: internet-settings-autodial-path
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
