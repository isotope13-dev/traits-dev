defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: internet-settings-autodial-write-api-context
  desc: Internet Settings autodial and registry-write APIs
  crit: notable
  conf: 0.9
  attack: T1112
  all:
  - id: micro-behaviors/os/registry/network/reference::internet-settings-key
  - id: micro-behaviors/os/registry/value-name::enable-autodial-value
  - id: micro-behaviors/os/registry/open::reg-open-key-w
  any:
  - id: metadata/binary/symbols/name/registry/write::reg-set-value-ex-a
  - id: metadata/binary/symbols/name/registry/write::reg-set-value-ex-w
