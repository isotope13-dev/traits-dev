# May match a reader: registry opening satisfies the original API alternative.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
composite_rules:
  - id: ipv6-disable-setting-registry-api-profile
    desc: IPv6 disable-setting and registry API references
    conf: 0.92
    all:
      - id: "micro-behaviors/os/registry/network/reference::tcpip6-parameters-key"
      - id: "micro-behaviors/os/registry/network/reference::disabled-components-value"
    any:
      - id: micro-behaviors/os/registry/open::registry-open-key-api
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-a
