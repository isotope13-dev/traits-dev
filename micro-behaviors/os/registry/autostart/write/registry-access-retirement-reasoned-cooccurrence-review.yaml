# References and API co-occurrence do not establish bound data flow.
defaults:
  platforms:
  - windows
composite_rules:
- for:
  - pe
  id: system-autorun-write-api-cooccurrence
  desc: System autorun references beside registry-write APIs
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  any:
  - id: micro-behaviors/os/registry/autostart/reference::appinit-registry-values
  - id: micro-behaviors/os/registry/autostart/reference::lsa-package-registry-path
  - id: micro-behaviors/os/registry/credential/reference::lsa-package-list-value-name
  - id: micro-behaviors/os/registry/print/reference::print-monitor-registry-path-reference
  - id: micro-behaviors/os/registry/print/reference::print-processor-registry-path-reference
  - id: micro-behaviors/os/registry/service/reference::time-provider-registry
  - id: micro-behaviors/os/autorun/control::netsh-helper-registration-references
  - id: micro-behaviors/os/registry/network/reference::winsock-provider-catalog-path-reference
  - id: micro-behaviors/os/registry/autostart/reference::screensaver-registry-values
  - id: micro-behaviors/os/registry/process/reference::silentprocessexit-registry-surface
