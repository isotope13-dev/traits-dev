defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
traits:
  - id: reg-add-userinit-logon-script-command
    desc: REG ADD sets user logon script
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)reg\s+add\s+"HKCU\\Environment"\s+/v\s+"?UserInitMprLogonScript"?\s+/t\s+REG_SZ'
