defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: wscript-run-key-write-references
    desc: Nearby WScript, Run-key and RegWrite references
    crit: notable
    conf: 0.95
    near_bytes: 384
    all:
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: metadata/binary/symbols/name/registry/write::regwrite-pe-token
