defaults:
  for: ["python"]
  platforms: ["windows"]
composite_rules:
  - id: run-key-set-delete-cooccurrence
    desc: Run-key, set-value and delete-value references
    crit: notable
    conf: 0.97
    scope: file
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/registry/value/write::winreg-setvalue
      - id: micro-behaviors/os/registry/delete::winreg-delete-value
