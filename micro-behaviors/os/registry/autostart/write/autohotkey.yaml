# AutoHotkey's RegWrite statement whose target path is a logon Run key. One
# statement carries both the write and the autostart surface, so the pair is
# one observation; a bare RegWrite statement for any other value is not.
defaults:
  platforms: [windows]
  for: [pe, text]
  crit: notable
  conf: 0.93

traits:
  - id: autohotkey-regwrite-run-key
    desc: RegWrite statement targets a Run key
    if:
      type: text
      regex: '(?im)^[ \t]*RegWrite[ \t]*,[^\r\n]{0,200}CurrentVersion\\+Run\b'
