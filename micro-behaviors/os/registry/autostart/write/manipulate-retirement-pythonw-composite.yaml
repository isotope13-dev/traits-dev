defaults:
  platforms: [windows]
  for: [python, pyc]

composite_rules:
  - id: python-run-key-write-pythonw-reference
    desc: Run-key write near a pythonw reference
    crit: notable
    conf: 0.98
    near_lines: 90
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
    # Source reaches the value write through the winreg module; bundled
    # bytecode reaches it through the constant names the marshal keeps.
    any:
      - id: micro-behaviors/os/registry/value/write::winreg-setvalue
      - id: metadata/binary/code/bytecode::pyc-setvalueex-name
      - id: metadata/binary/code/bytecode::python-bytecode-winreg-value-write
