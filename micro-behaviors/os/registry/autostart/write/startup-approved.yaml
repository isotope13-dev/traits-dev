defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9
composite_rules:
  # Co-location is not a handle/data-flow proof. In particular, this does not
  # assert that a specific approval byte was written or disablement prevented.
  - id: startup-approved-binary-write-clues
    desc: Startup approval key and binary setter
    near_bytes: 768
    all:
      - id: micro-behaviors/os/registry/autostart/reference::startup-approved-run-source
      - id: micro-behaviors/os/registry/value/write::native-registry-binary-write
