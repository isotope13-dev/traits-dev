defaults:
  platforms: [windows]
  for: [text, powershell, batch]

composite_rules:
  - id: encoded-startup-folder-write-profile
    desc: Decoded Startup folder registry-write profile
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/keyword::encoded-startup-folder-value
      - id: "micro-behaviors/os/registry/explorer/reference::encoded-shell-folder-key"
      - id: micro-behaviors/os/registry/value/write::encoded-set-itemproperty-value
