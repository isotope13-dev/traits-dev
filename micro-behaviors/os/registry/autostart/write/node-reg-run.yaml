defaults:
  platforms: [windows]
  for: [javascript, typescript]

traits:
  - id: node-reg-add-run-value
    desc: Node reg command adds a Run-key value
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
           function: (member_expression property: (property_identifier) @method)
           arguments: (arguments
             . (string (string_fragment) @program)
             . (array
                 . (string (string_fragment) @verb)
                 . (string) @key
                 (string (string_fragment) @data_flag))))
         (#match? @method "^(spawn|spawnSync|execFile|execFileSync)$")
         (#match? @program "(?i)^reg(\\.exe)?$")
         (#match? @verb "(?i)^add$")
         (#match? @key "(?i)CurrentVersion[\\\\/]+Run.$")
         (#match? @data_flag "(?i)^/d$"))
