defaults:
  for: [vbs]
  platforms: [windows]
traits:
  - id: vbs-wmi-run-key-string-write
    desc: VBS writes Run value through WMI registry
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.SetStringValue[ \t]+\w+,[ \t]*"Software\\Microsoft\\Windows\\CurrentVersion\\Run",'
