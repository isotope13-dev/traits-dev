  unless:
  - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-microsoft-signed-component
  - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
  - id: well-known/app/utility/siw::siw-family-identity
  - id: well-known/app/system/reactos::system-component
