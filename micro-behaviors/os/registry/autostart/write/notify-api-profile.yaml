defaults:
  platforms:
  - windows
  for:
  - go
  - pe
  - dll
composite_rules:
- id: winlogon-notify-write-api-cooccurrence
  for:
  - pe
  desc: Winlogon Notify path beside registry-write APIs
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/os/registry/autostart/reference::winlogon-notify-subkey
