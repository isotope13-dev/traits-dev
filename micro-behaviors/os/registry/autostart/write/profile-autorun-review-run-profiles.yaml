defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: own-image-hklm-run-write-success
  desc: Run-key write success diagnostic with current-image path lookup
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/autorun/login-items::hklm-run-set-diagnostic
  - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
  - id: micro-behaviors/process/info/current::get-module-filename

- id: run-key-set-delete-api-profile
  desc: Run-key path co-occurs with registry value set/delete APIs
  crit: notable
  conf: 0.94
  all:
  - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
  - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
  - id: micro-behaviors/os/registry/delete::reg-delete-value-w-symbol
- id: run-key-copy-own-path-api-profile
  desc: Run-key path co-occurs with copy, own-path and registry-write APIs
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  - id: micro-behaviors/fs/file/copy/call::copyfile-w
  - id: micro-behaviors/fs/path/check::get-module-filename
  any:
  - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
  - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"
- id: run-key-file-operation-api-profile
  desc: Run-key and registry-write APIs with own-path and file-operation APIs
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/os/registry/autostart/write::run-path-write-api-references
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  - id: micro-behaviors/os/registry/create::registry-create-key-api
  - id: micro-behaviors/process/info/current::get-module-filename
  - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
  any:
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/file/move::move-file
  - id: micro-behaviors/fs/file/copy/call::copyfile-a
  for:
  - pe
