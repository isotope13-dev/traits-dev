# A path reference is not evidence of a registry write.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: run-or-runonce-key-reference
    desc: Run or RunOnce registry key reference
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
