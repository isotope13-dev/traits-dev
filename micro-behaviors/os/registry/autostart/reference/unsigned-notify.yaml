defaults:
  for:
  - python
  - javascript
  - vbs
  - powershell
  - pe
  - c
  - cpp
  conf: 0.7
  platforms:
  - windows
composite_rules:
- id: unsigned-winlogon-notify-reference
  desc: Unsigned PE references Winlogon Notify
  crit: notable
  conf: 0.9
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/registry/autostart/reference::winlogon-notify-subkey
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: well-known/tool/sysadmin/nirsoft/
