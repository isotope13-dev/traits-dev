defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: appinit-value-stack-byte-stores
    desc: Stack byte stores form AppInit DLL value
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule appinit_stack_value {
          strings:
            $prefix = { C6 45 ?? 41 C6 45 ?? 70 C6 45 ?? 70 C6 45 ?? 49 }
            $suffix = { C6 45 ?? 74 C6 45 ?? 5F C6 45 ?? 44 B1 4C 88 4D ?? 88 4D ?? C6 45 ?? 73 }
          condition:
            $prefix and $suffix and @suffix > @prefix and @suffix - @prefix < 64
        }
