defaults:
  platforms: [windows]
traits:
- id: currentversion-run-key-path
  desc: References Windows CurrentVersion Run key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)Software[\\/]Microsoft[\\/]Windows[\\/]CurrentVersion[\\/]Run([\\/]|$|["'\s])
  for: [scripts, source, binaries, oledoc]
