# These strings have the shape of Shell/Userinit values containing another
# executable. They do not establish a registry write or persistence intent.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
traits:
  - id: shell-additional-executable-value
    desc: Explorer value names an additional executable
    if:
      type: text
      regex: '^Explorer\.exe\s+[A-Za-z0-9_.-]+\.exe$'
      case_insensitive: true
  - id: userinit-additional-executable-value
    desc: Userinit value names an additional executable
    if:
      type: text
      regex: '(?i)userinit\.exe\s*,\s*["'']?[A-Za-z0-9_.\\: -]+\.exe'
