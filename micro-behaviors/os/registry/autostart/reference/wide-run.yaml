defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: utf16-currentversion-run-key
    desc: UTF-16 Windows Run registry key reference
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: wide
      exact: 'Software\Microsoft\Windows\CurrentVersion\Run'
      case_insensitive: true
