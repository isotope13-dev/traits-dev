# References and API co-occurrence do not establish bound data flow.
defaults:
  for:
  - scripts
  - binaries
  platforms:
  - windows
  crit: notable
composite_rules:
- id: dll-autorun-surface-references
  desc: DLL autorun registry surface references
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/autostart/reference::appinit-dlls-value-name
  - id: micro-behaviors/os/registry/autostart/reference::loadappinit-policy-value
  - id: micro-behaviors/os/registry/autostart/reference::appcert-dlls-registry-path
  - id: micro-behaviors/os/registry/autostart/reference::lsa-package-registry-path
  - id: micro-behaviors/os/registry/print/reference::print-monitor-registry-path-reference
  - id: micro-behaviors/os/registry/print/reference::print-processor-registry-path-reference
  - id: micro-behaviors/os/registry/service/reference::time-provider-registry
  - id: micro-behaviors/os/autorun/control::netsh-helper-registration-references
  - id: micro-behaviors/os/registry/network/reference::winsock-provider-catalog-path-reference
