defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: shellserviceobjectdelayload-path
    desc: ShellServiceObjectDelayLoad registry path
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\ShellServiceObjectDelayLoad

  # ATL .rgs scripts split a key path into one NoRemove line per component,
  # so the full path above never appears as a single string.
  - id: shellservice-delayload-atl-script
    desc: ATL script sets ShellServiceObjectDelayLoad key
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: NoRemove ShellServiceObjectDelayLoad

  # CLSID of the Windows system-tray shell service (stobject.dll).
  - id: systray-stobject-clsid-literal
    desc: Windows system-tray stobject CLSID literal
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '{35CEC8A3-2BE6-11D2-8773-92E220524153}'
