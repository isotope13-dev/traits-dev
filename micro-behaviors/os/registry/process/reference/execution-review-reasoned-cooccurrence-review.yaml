# References and API co-occurrence do not establish bound data flow.
defaults:
  for:
  - scripts
  - source
  - binaries
  - reg
  platforms:
  - windows
  crit: notable
traits:
- id: silentprocessexit-registry-path-reference
  desc: SilentProcessExit registry path reference
  conf: 0.9
  if:
    type: text
    regex: (?i)\\SilentProcessExit(\\|\b)
- id: ifeo-globalflag-registry-reference
  desc: IFEO GlobalFlag registry reference
  conf: 0.9
  if:
    type: text
    regex: \\Image File Execution Options\\[^\\\n]{1,80}\\GlobalFlag\b
- id: wer-hangs-registry-path-reference
  desc: WER Hangs registry key path
  conf: 0.94
  if:
    type: text
    exclude_comments: true
    regex: (?i)\\Windows Error Reporting\\Hangs\b
- id: silentprocessexit-dump-config-value
  desc: SilentProcessExit dump config value name
  conf: 0.92
  if:
    type: text
    exclude_comments: true
    regex: (?i)\b(LocalDumpFolder|ReportingMode)\b
- id: globalflag-value-reference
  desc: IFEO GlobalFlag registry value name
  conf: 0.9
  if:
    type: text
    exclude_comments: true
    regex: (?i)(["']GlobalFlag["']|/v\s+GlobalFlag\b|-Name\s+["']?GlobalFlag\b)
- id: silent-process-exit-gflag-mask
  desc: SilentProcessExit 0x200 GlobalFlag mask
  crit: component
  conf: 0.85
  if:
    type: text
    exclude_comments: true
    regex: (?i)(\b0x0*200\b|\bFLG_MONITOR_SILENT_PROCESS_EXIT\b|dword:00000200\b|\b512\b)
composite_rules:
- id: silentprocessexit-registry-surface
  desc: SilentProcessExit path or monitor-value references
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/process/reference::silentprocessexit-registry-path-reference
  - id: micro-behaviors/os/registry/process/reference::ifeo-globalflag-registry-reference
  - id: micro-behaviors/os/registry/value-name::monitorprocess-value-name
  unless:
  - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
