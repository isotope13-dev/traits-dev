defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: ifeo-key-debugger-proximity
  desc: Debugger value name near IFEO key path
  crit: notable
  conf: 0.92
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/registry/process/reference::ifeo-key-reference
  - id: micro-behaviors/os/registry/value-name::debugger-value-name-token
