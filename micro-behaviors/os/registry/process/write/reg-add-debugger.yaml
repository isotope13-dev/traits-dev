defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  crit: notable
  conf: 0.96
traits:
  - id: ifeo-reg-add-target-command
    desc: REG ADD targets executable IFEO subkey
    if:
      type: text
      regex: '(?i)reg\s+add\s+"HKLM\\[^"\r\n]{1,90}\\Image File Execution Options\\[^"\r\n]{1,80}"'
  - id: reg-add-debugger-value-command
    desc: REG ADD writes Debugger string value
    if:
      type: text
      regex: '(?i)/v\s+"?Debugger"?\s+/t\s+REG_SZ\s+/d\s+'
composite_rules:
  - id: ifeo-reg-add-debugger-command
    desc: REG ADD command sets executable IFEO Debugger
    near_bytes: 256
    all:
      - id: ifeo-reg-add-target-command
      - id: reg-add-debugger-value-command
