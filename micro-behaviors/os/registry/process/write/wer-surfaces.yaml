# Registry write primitives for Windows Error Reporting Hangs\Debugger and
# Image File Execution Options SilentProcessExit monitoring flags.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source, reg]

composite_rules:
  - id: registry-mutation-surface
    desc: Writes Windows registry values via API, CLI, script provider, or .reg import
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
      - id: micro-behaviors/os/registry/value/write::reg-exe-add-command
      - id: micro-behaviors/os/registry/value/write::structured-reg-add-command
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: micro-behaviors/os/registry/value/write::registry-set-value-source
      - id: micro-behaviors/os/registry/value/write::csharp-open-key-set-value
      - id: micro-behaviors/os/registry/value/write::registry-managed-set-value-source
      - id: micro-behaviors/os/registry/value/write::registry-setvalue-executable
      - id: micro-behaviors/os/registry/value/write::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/os/registry/value/write::winreg-setvalue
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
      - id: micro-behaviors/os/registry/value/write::com-registry-set-value
      - id: micro-behaviors/os/registry/value/write::rust-winreg-write
      - id: micro-behaviors/os/registry/value/write::go-registry-string-value-writer-reference
      - id: metadata/file/format/structured::reg-script-header-and-key-section

  - id: wer-hangs-debugger-write
    desc: Writes Debugger value under Windows Error Reporting Hangs key
    crit: suspicious
    conf: 0.95
    attack: T1546
    all:
      - id: micro-behaviors/os/registry/process/reference::wer-hangs-registry-path-reference
      - id: micro-behaviors/os/registry/value-name::debugger-value-reference
      - id: registry-mutation-surface
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context

  - id: ifeo-silent-exit-flag-write
    desc: Sets FLG_MONITOR_SILENT_PROCESS_EXIT (0x200) under Image File Execution Options
    crit: suspicious
    conf: 0.94
    attack: T1546.012
    all:
      - id: micro-behaviors/os/registry/process/reference::ifeo-key-reference
      - id: micro-behaviors/os/registry/process/reference::silent-process-exit-gflag-mask
      - id: registry-mutation-surface
    any:
      - id: micro-behaviors/os/registry/process/reference::globalflag-value-reference
      - id: micro-behaviors/os/registry/process/reference::ifeo-globalflag-registry-reference
    unless:
      - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
      - id: metadata/file/format/log::windows-event-csv-records
