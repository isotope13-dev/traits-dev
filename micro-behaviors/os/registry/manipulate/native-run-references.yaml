# Require a key-path encoding usable by the registry write API. A native
# wrapper can embed a managed payload's UTF-16 Run key without writing it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

composite_rules:
  - id: ansi-run-path-write-api-references
    desc: ANSI Run-key path and registry write API
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::ansi-run-key-path"
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
  - id: wide-run-path-write-api-references
    desc: Run-key path and Unicode registry write API
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
    # Managed writers (VB/C# keyloggers and installers) reach the Run key
    # through Microsoft.Win32 RegistryKey.SetValue; the API identity lives in
    # the assembly's metadata rather than the import table.
  - id: managed-run-path-write-api-references
    desc: Run-key path and managed registry setter
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
      - id: micro-behaviors/os/registry/write::managed-registry-setter-token
  - id: run-path-write-api-references
    desc: Run-key path and registry write API references
    any:
      - id: ansi-run-path-write-api-references
      - id: wide-run-path-write-api-references
      - id: managed-run-path-write-api-references
