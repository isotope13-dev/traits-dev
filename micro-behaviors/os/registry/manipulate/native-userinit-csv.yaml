defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: native-userinit-comma-joined-write
    desc: Writes comma-joined Userinit registry paths
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule native_userinit_comma_joined_write {
          strings:
            $name = "Userinit" fullword nocase
            $key = "Software\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon" nocase
            $format = "%s%s%s" fullword
            $code = {
              51 68 ?? ?? ?? ?? 52 68 ?? ?? ?? ?? 50 FF D6 83 C4 14
              B9 ?? ?? ?? ?? BE ?? ?? ?? ?? 8D 7C 24 ?? 8D 54 24 ??
              F3 A5 8D 4C 24 ?? 51 52 68 02 00 00 80 66 A5 FF 15 ?? ?? ?? ??
              8B 4C 24 ?? 8D 84 24 ?? ?? ?? ?? 6A ?? 50 6A 01 6A 00
              68 ?? ?? ?? ?? 51 FF 15 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and all of them and
            uint16(pe.rva_to_offset(uint32(@code+2)-pe.image_base)) == 0x002c and
            pe.rva_to_offset(uint32(@code+8)-pe.image_base) == @format and
            pe.rva_to_offset(uint32(@code+24)-pe.image_base) == @key and
            pe.rva_to_offset(uint32(@code+76)-pe.image_base) == @name
        }
