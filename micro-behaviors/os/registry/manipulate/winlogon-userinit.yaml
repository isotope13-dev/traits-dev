defaults:
  platforms: [windows]
  for: [go, pe, dll]
composite_rules:
  - id: winlogon-userinit-write-api-context
    desc: Winlogon Userinit reference with registry-write APIs
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/os/registry/keys::winlogon-registry-path
      - id: micro-behaviors/os/registry/keys::userinit-value-reference
    any:
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/os/registry/manipulate::go-registry-set-string-value-call
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      # Startup Cleaner builds Userinit as a row in its supported startup
      # locations; the string is catalog data, not a new persistence value.
      - id: well-known/app/system/winutilities::winutilities-startup-cleaner-identity
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/app/system/reactos::system-component
      - id: well-known/app/system/kuerpe::kuerpe-peboot-identity
