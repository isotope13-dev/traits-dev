defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - class
    - java
    - kotlin
    - jar
traits:
  - id: java-registry-preferences
    desc: 'Usage of java.util.prefs.Prefs (Win Registry)'
    if:
      type: text
      substr: java/util/prefs/Preferences

  - id: jvm-reg-add-reg-sz-force-command
    desc: JVM reg.exe forced string-value write
    conf: 0.93
    for: [java, kotlin]
    if:
      type: text
      regex: 'reg add[\s\S]{0,260}/t REG_SZ[\s\S]{0,260}/f'

  - id: jvm-reg-sz-token
    desc: JVM REG_SZ value-type token
    conf: 0.9
    for: [class]
    if:
      type: hex
      pattern: 52 45 47 5F 53 5A
