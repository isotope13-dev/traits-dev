defaults:
  platforms: [windows]
composite_rules:
- id: runkey-own-path-api-profile
  desc: Run-key write and own-path API references
  crit: notable
  conf: 0.92
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/registry/manipulate::run-path-write-api-references
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  any:
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  - id: micro-behaviors/fs/path/check::get-module-filename
  needs: 2
  unless:
  - id: well-known/tool/browser::google-chrome-installer
  # Electron's app.setLoginItemSettings() writes the Run key and resolves its
  # own image path to do so -- the documented auto-launch API, not persistence.
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
