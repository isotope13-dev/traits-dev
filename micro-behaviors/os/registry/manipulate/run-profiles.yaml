defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: run-key-set-delete-api-profile
  desc: Run-key path co-occurs with registry value set/delete APIs
  crit: notable
  conf: 0.94
  size_max: 5242880
  all:
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
  - id: micro-behaviors/os/registry/manipulate::reg-delete-value-w-symbol
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: metadata/signed/certificate/subject::glarysoft-ltd
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/app/system/reactos/
  - id: well-known/app/security/itop-vpn::benign-context
- id: run-key-copy-own-path-api-profile
  desc: Run-key path co-occurs with copy, own-path and registry-write APIs
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: micro-behaviors/fs/file/copy::copyfile-w
  - id: micro-behaviors/fs/path/check::get-module-filename
  any:
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  - id: "micro-behaviors/os/registry/keys/autostart::windows-run-key-path"
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: well-known/tool/browser::google-chrome-installer
  - id: well-known/app/browser/chromium-updater::chromiumbrowser-updater-binary
- id: run-key-file-operation-api-profile
  desc: Run-key and registry-write APIs with own-path and file-operation APIs
  crit: notable
  conf: 0.85
  size_max: 1000000
  all:
  - id: micro-behaviors/os/registry/manipulate::run-path-write-api-references
  - id: micro-behaviors/os/registry/access::registry-set-value-api
  - id: micro-behaviors/os/registry/access::registry-create-key-api
  - id: micro-behaviors/process/info/current::get-module-filename
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  any:
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/file/move::move-file
  - id: micro-behaviors/fs/file/copy::copyfile-a
  for:
  - pe
