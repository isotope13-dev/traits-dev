# Required references share a file; no resource-to-launch or persistence link.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: resource-shell-temp-run-key-api-profile
    desc: Run-key, resource, temp-path and ShellExecute API profile
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/fs/temp/directory::get-temp-path-name
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/manipulate::reg-create-key-ex-a
    any:
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/framework/
      - id: well-known/app/system/iobit::iobit-signed-component-context
