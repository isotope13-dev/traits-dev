defaults:
  for:
    - vbs
  platforms:
    - windows
  crit: notable
  conf: 0.88
traits:
  - id: regwrite-call
    desc: VBA RegWrite registry write
    attack: T1112
    if:
      type: string_literal
      regex: (?i)\.RegWrite\b
  - id: regread-call
    desc: VBA RegRead registry read
    crit: notable
    if:
      type: string_literal
      regex: (?i)\.RegRead\b
  - id: regdelete-call
    desc: VBA RegDelete registry delete
    attack: T1112
    if:
      type: string_literal
      regex: (?i)\.RegDelete\b
# NOTE: the former `run-key-path` here duplicated the canonical
# micro-behaviors/os/registry/keys::currentversion-run matcher (same
# `CurrentVersion\Run` path text) while grading it `suspicious`. A path
# reference is neutral — uninstallers name the Run key to *delete* stale
# values — so the duplicate was removed and its consumers now reference the
# canonical notable trait directly.
