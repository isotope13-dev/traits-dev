defaults:
  for: [class]
  platforms: [windows]
  crit: component
  conf: 0.95
traits:
  - id: jvm-reg-command-argument
    desc: JVM constant pool contains reg argument
    if:
      type: hex
      pattern: 01 00 03 72 65 67
  - id: jvm-add-command-argument
    desc: JVM constant pool contains add argument
    if:
      type: hex
      pattern: 01 00 03 61 64 64
