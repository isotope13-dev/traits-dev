defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: unsigned-run-key-own-path-file-api-profile
  desc: Run-key and registry-write APIs with own-path and file-operation APIs
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/manipulate::run-path-write-api-references
  - id: metadata/signed/trust-level::unsigned
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/fs/path/check::get-module-filename
  any:
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  - id: micro-behaviors/fs/file/move::move-file
  - id: micro-behaviors/fs/file/move::move-file-ex
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
