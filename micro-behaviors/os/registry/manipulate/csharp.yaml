defaults:
  crit: notable
  for: [csharp]
  platforms: [windows]
traits:
  - id: registry-get-value
    desc: Registry.GetValue read access
    conf: 0.85
    if:
      type: text
      substr: "Registry.GetValue("
  - id: open-subkey-writable
    desc: Registry OpenSubKey with write access
    conf: 0.9
    if:
      type: text
      regex: 'OpenSubKey\(.{1,200}true\)'
  - id: create-subkey
    desc: Registry CreateSubKey usage
    conf: 0.9
    if:
      type: text
      substr: ".CreateSubKey("
composite_rules:
  - id: registry-write-marker
    desc: Registry key creation with value write
    conf: 0.92
    attack: "T1112"
    all:
      - id: create-subkey
      - id: micro-behaviors/os/registry/write::registry-managed-set-value-source
