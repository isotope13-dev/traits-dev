defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data]
traits:
  - id: machine-registry-add-command
    desc: reg.exe adds a machine registry entry
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+add\s+["'']?(HKLM|HKEY_LOCAL_MACHINE)\\+SOFTWARE\\+'
