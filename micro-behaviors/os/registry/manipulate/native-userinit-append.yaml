defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: native-userinit-appended-path-writer
    desc: Builds appended Winlogon Userinit arguments
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule native_userinit_appended_path_writer {
          strings:
            $prefix = "C:\\WINDOWS\\system32\\userinit.exe, " wide nocase
            $name = "Userinit" wide nocase fullword
            $key = "Software\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\" wide nocase
            $code = {
              68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 50 8D 45 ?? 50 E8 ?? ?? ?? ??
              83 C4 0C 50 8D 45 ?? 50 E8 ?? ?? ?? ?? 83 C4 0C 50 53
              E8 ?? ?? ?? ?? 83 C4 0C 68 ?? ?? ?? ?? 68 ?? ?? ?? ??
              68 02 00 00 80 E8 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and all of them and
            for any c in (1..#code) : (
              @code[c] >= pe.sections[pe.section_index(".text")].raw_data_offset and
              @code[c]+!code[c] <= pe.sections[pe.section_index(".text")].raw_data_offset+
                pe.sections[pe.section_index(".text")].raw_data_size and
              pe.rva_to_offset(uint32(@code[c]+1)-pe.image_base) == @prefix and
              pe.rva_to_offset(uint32(@code[c]+48)-pe.image_base) == @name and
              pe.rva_to_offset(uint32(@code[c]+53)-pe.image_base) == @key
            )
        }
