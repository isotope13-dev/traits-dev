defaults:
  platforms: [windows]
  for: [scripts, csharp, c, cpp, go, rust]
  attack: T1112
traits:
  - id: registry-write-request-token
    desc: Registry-write request command token
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, python]
    if:
      type: literal
      exact: SetRegistryValue
  # Shell dialects only: there, a bare `reg` at a command position *is* reg.exe.
  # In C/C++/Go/Rust/C# a call target named `reg` is an ordinary local function
  # (a regex engine's `reg()` recursive-descent parser, a register accessor);
  # those languages reach reg.exe through system()/Process.Start()/exec.Command
  # with the tool name in a string, which `reg-exe-add-command` matches instead.
  - id: reg-cli-command
    desc: Windows reg.exe command invocation
    crit: notable
    conf: 0.9
    for: [batch, powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^reg$'
  - id: reg-exe-add-command
    desc: reg.exe add command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\breg(\.exe)?[ \t]+add\b'
  - id: reg-exe-safeboot-path
    desc: reg.exe SafeBoot service path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+add\b.{0,80}\bSafeBoot[\\/]+(Minimal|Network)[\\/].{2,50}'
  - id: reg-exe-service-value
    desc: reg.exe writes a Service value
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+add\b.{0,100}/(ve|v)\s+/d\s+["'' ]?Service\b'

  - id: hkcu-software-classes-path
    desc: HKCU Software Classes path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)HKCU\\+Software\\+Classes'
  - id: url-protocol-registry-value
    desc: URL Protocol registry value
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "URL Protocol"
  - id: shell-open-command-key
    desc: shell open command registry key
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)shell\\+open\\+command'
  - id: com-apartment-threading-model
    desc: Registers COM apartment threading model
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)ThreadingModel.{0,60}Apartment'
  # Registers a file-type class in HKEY_CLASSES_ROOT with an icon and/or open
  # command. This is what every installer that owns a file extension does
  # (RustDesk's `.<ext>` recording handler, image viewers, editors); ransomware
  # also does it for its encrypted-file extension, so the intent comes from the
  # ransom composite that pairs this with a ransom note / extension / shadow
  # delete -- not from the registration itself. Relocated here from
  # objectives/impact/ransom (matcher detects a generic capability).
  - id: file-class-shell-registration
    desc: HKCR file-class registration
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(HKEY_CLASSES_ROOT|HKCR).{0,160}(DefaultIcon|shell\\\\open\\\\command|\.ico)'
    not:
    - regex: (?i)PhotoViewer\.FileAssoc
    unless:
    - id: metadata/lang/source/

composite_rules:
  - id: reg-exe-safeboot-service-registration
    desc: reg.exe SafeBoot service registration
    crit: notable
    conf: 0.97
    # A SafeBoot entry whose service value is written through reg.exe is a
    # concrete form of service smuggling into the reduced Safe Mode allow-list.
    all:
      - id: reg-exe-safeboot-path
      - id: reg-exe-service-value
    near_lines: 1
