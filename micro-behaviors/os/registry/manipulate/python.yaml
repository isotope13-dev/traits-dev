# Python Registry Capabilities
defaults:
  for: ["python"]
  platforms: ["windows"]
traits:
  - id: winreg-setvalue
    desc: Sets a Windows registry value
    crit: notable
    conf: 0.8
    if:
      # Migrated from a tree-sitter query to a `kind: call` match on
      # the pre-extracted call fact (no per-member cursor walk).
      type: symbol
      kind: call
      regex: '(^|\.)winreg\.SetValue(Ex)?$'
  - id: winreg-delete-value
    desc: Deletes a Windows registry value
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '(^|\.)winreg\.DeleteValue(Key)?$'

composite_rules:
  # Malware persists and never looks back; an installer module that ships
  # both the Run-key write and the matching Run-key delete (install plus
  # uninstall) is transparent autostart management, not stealth persistence.
  - id: run-key-write-with-uninstaller
    desc: Run key writer ships a matching uninstaller
    crit: exception
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::winreg-setvalue
      - id: micro-behaviors/os/registry/manipulate::winreg-delete-value
