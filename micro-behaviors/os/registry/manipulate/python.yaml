# Python Registry Capabilities
defaults:
  for: ["python"]
  platforms: ["windows"]
composite_rules:
  # Malware persists and never looks back; an installer module that ships
  # both the Run-key write and the matching Run-key delete (install plus
  # uninstall) is transparent autostart management, not stealth persistence.
  - id: run-key-write-with-uninstaller
    desc: Run key writer ships a matching uninstaller
    crit: exception
    conf: 0.97
    scope: file
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/write::winreg-setvalue
      - id: micro-behaviors/os/registry/delete::winreg-delete-value
