defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # Bind the actual Shell value, key and comma-terminated executable prefix
  # to the same argument-construction sequence. This is not Userinit: some
  # agents even put a userinit.exe prefix into their Shell value.
  - id: native-winlogon-shell-appended-path-writer
    desc: Builds appended Winlogon Shell write arguments
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule native_winlogon_shell_appended_path_writer {
          strings:
            $explorer = "explorer.exe, " wide nocase
            $userinit = "C:\\WINDOWS\\system32\\userinit.exe, " wide nocase
            $name = "Shell" wide nocase fullword
            $key = "Software\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\" wide nocase
            $code = {
              68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 50 8D 45 ?? 50 E8 ?? ?? ?? ??
              83 C4 0C 50 8D 45 ?? 50 E8 ?? ?? ?? ?? 83 C4 0C 50 53
              E8 ?? ?? ?? ?? 83 C4 0C 68 ?? ?? ?? ?? 68 ?? ?? ?? ??
              68 02 00 00 80 E8 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and $name and $key and
            for any c in (1..#code) : (
              @code[c] >= pe.sections[pe.section_index(".text")].raw_data_offset and
              @code[c]+!code[c] <= pe.sections[pe.section_index(".text")].raw_data_offset+
                pe.sections[pe.section_index(".text")].raw_data_size and
              for any n in (1..#name) : (
                pe.rva_to_offset(uint32(@code[c]+48)-pe.image_base) == @name[n]
              ) and
              for any k in (1..#key) : (
                pe.rva_to_offset(uint32(@code[c]+53)-pe.image_base) == @key[k]
              ) and
              (
                ($explorer and pe.rva_to_offset(uint32(@code[c]+1)-pe.image_base) == @explorer) or
                ($userinit and pe.rva_to_offset(uint32(@code[c]+1)-pe.image_base) == @userinit)
              )
            )
        }
