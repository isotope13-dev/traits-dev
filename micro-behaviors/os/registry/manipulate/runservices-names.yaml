defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: runservices-system-name-api-references
    desc: RunServices names and registry write APIs
    crit: notable
    conf: 0.98
    for: [pe]
    all:
      - id: micro-behaviors/process/info/name::iexplore-exe-name
      - id: micro-behaviors/process/info/name::internat-name
      - id: "micro-behaviors/os/registry/keys/autostart::runservices-key-path"
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/fs/path/check::get-module-filename
    any:
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
