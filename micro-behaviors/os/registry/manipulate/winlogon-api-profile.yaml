defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: winlogon-key-create-session-exit-api-profile
  desc: Winlogon path co-occurs with registry-key creation and session-exit APIs
  crit: notable
  conf: 0.93
  scope: file
  all:
  - id: "micro-behaviors/os/registry/keys/autostart::winlogon-registry-path"
  - id: micro-behaviors/os/registry/access::registry-create-key-api
  - id: micro-behaviors/ui/window/control::exit-windows-ex
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: micro-behaviors/os/registry/manipulate::winlogon-key-restart-known-benign-context
- id: winlogon-key-restart-known-benign-context
  desc: Recognized system component or startup manager
  crit: exception
  conf: 0.93
  scope: file
  any:
  - id: metadata/binary/vendor::microsoft-signed-system-component-context
  - id: well-known/app/system/iobit::iobit-signer
  - id: well-known/app/system/winutilities::winutilities-startup-cleaner-identity
  - id: well-known/app/utility/siw::siw-family-identity
  - id: well-known/app/storage/syncback::syncback-backup-benign-context
  - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
  - id: well-known/app/system/reactos::system-component
