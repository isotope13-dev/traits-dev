defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, csharp, c, cpp, go, rust]
  attack: T1112
traits:
  - id: reg-cli-command
    desc: Windows reg.exe command invocation
    conf: 0.9
    for: [batch, powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^reg$'
  - id: php-reg-variable-command
    desc: PHP runs reg with constructed arguments
    conf: 0.9
    for: [php]
    if:
      type: text
      regex: '(?i)shell_exec\s*\(\s*["'']reg\s*["'']\s*[.]'
