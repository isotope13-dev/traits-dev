# Bind the literal initializer to the registry data argument. Proximity alone
# would misidentify an unrelated 08 buffer beside an ordinary approval write.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98
traits:
  - id: leading-eight-zero-array-binary-write
    desc: Binary setter uses leading-08 zeroed array
    if:
      type: tree-sitter
      query: |
        (function_definition
          body: (compound_statement
            (declaration
              (init_declarator
                declarator: (array_declarator
                  declarator: (identifier) @state_name)
                value: (initializer_list) @state))
            (expression_statement
              (call_expression
                function: (identifier) @setter
                arguments: (argument_list
                  (_) (_) (_) (identifier) @kind
                  (identifier) @data (_))) @evidence))
          (#match? @setter "^RegSetValueEx[AW]$")
          (#eq? @kind "REG_BINARY")
          (#eq? @state_name @data)
          (#match? @state "^\\{\\s*(8|0[xX]0?8)\\s*(,\\s*(0|0[xX]0+)\\s*){11}\\}$"))
