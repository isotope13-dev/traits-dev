defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, csharp, c, cpp, go, rust]
  attack: T1112
traits:
  - id: reg-exe-add-command
    desc: reg.exe add command
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?[ \t]+add\b'
  - id: structured-reg-add-command
    desc: Process builder runs reg add
    conf: 0.94
    for: [scripts, source]
    if:
      # Process APIs commonly hold the executable and verb in separate
      # arguments rather than one shell command.
      type: text
      regex: '(?is)["'']([^"'']{0,120}[/\\])?reg([.]exe)?["''].{0,160}["'']add["'']'
  - id: reg-exe-service-value
    desc: reg.exe writes a Service value
    conf: 0.96
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?["'']?\s+add\b.{0,110}/(ve|v)\b.{0,30}/d\s+["'']?Service\b'
  # /ve selects the value a shell verb actually executes; a named value would
  # not redirect the verb. Widely used by installers and repair scripts.
  - id: reg-add-default-value-flag
    desc: reg add writes the default value
    conf: 0.95
    for: [scripts, source, text, data]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+add\b.{0,140}/ve\b'

