defaults:
  crit: notable
  for: [rust]
  platforms: [windows]
  attack: T1112

composite_rules:
  - id: rust-winreg-write
    desc: Rust registry create and write
    conf: 0.93
    all:
      - id: micro-behaviors/data/property/write::rust-set-value-call-text
    any:
      - id: micro-behaviors/os/registry/hive/reference::regkey-predef-hklm
      - id: micro-behaviors/os/registry/create::regkey-create-subkey
