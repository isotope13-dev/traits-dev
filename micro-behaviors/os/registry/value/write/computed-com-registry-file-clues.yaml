defaults:
  platforms: [windows]
composite_rules:
- id: computed-com-registry-file-clues
  desc: Computed COM registry and file clues
  crit: suspicious
  conf: 0.93
  for: [javascript, vbs, static-lib]
  all:
  - id: micro-behaviors/os/com/instantiation::vbs-createobject-call-result
  - id: micro-behaviors/os/registry/value/write::wscript-regwrite
  any:
  - id: micro-behaviors/fs/write/content::create-text-file-method-name
  - id: micro-behaviors/fs/write/content::create-text-file-literal
