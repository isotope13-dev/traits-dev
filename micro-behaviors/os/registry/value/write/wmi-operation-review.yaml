defaults:
  platforms: [windows]
  conf: 0.9
  for: [powershell, batch, vbs]
  attack: "T1112"
traits:
  - id: modify-registry-wmi
    desc: Modifies registry via WMI StdRegProv
    crit: notable
    if:
      type: text
      regex: 'StdRegProv.{0,100}Set.{0,50}Value'
      case_insensitive: true
  # A JavaScript host builds the WMI script as a string; the call and the Set
  # method sit on different lines, so this leg allows line breaks.
  - id: modify-registry-wmi-js
    desc: Modifies registry via WMI StdRegProv (JS)
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'StdRegProv[\s\S]{0,400}Set[A-Za-z]{0,12}Value'
      case_insensitive: true
