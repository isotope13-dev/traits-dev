defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: go-registry-string-value-writer-function
    desc: Compiled Go registry setter function
    crit: notable
    conf: 0.98
    if:
      type: function
      substr: windows_registry.Key.setStringValue
  # Function/symbol recovery yields nothing on dumped or stripped Go
  # images, but the qualified routine name stays in pclntab strings.
  - id: go-registry-set-string-value-text
    desc: Go SetStringValue routine-name reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: registry.Key.SetStringValue
composite_rules:
  - id: go-registry-string-value-writer-reference
    desc: Go registry setter call or implementation
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/os/registry/value/write::go-registry-string-value-writer-function
      - id: micro-behaviors/os/registry/value/write::go-registry-string-value-call-context
      - id: micro-behaviors/os/registry/value/write::go-registry-set-string-value-text

  - id: go-registry-string-value-call-context
    desc: Go registry package and SetStringValue call
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/property/write::go-set-string-value-call
      - id: metadata/binary/symbols/name/registry/package::go-registry-package-path-reference
