defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1112
traits:
- id: reg-set-value-ex-text
  desc: Set registry value API name in text
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: RegSetValueEx
- id: reg-set-key-value
  desc: RegSetKeyValue API symbol
  crit: notable
  conf: 0.85
  for:
  - pe
  - dll
  - c
  - cpp
  if:
    type: symbol
    regex: ^RegSetKeyValue[AW]$
composite_rules:
- id: registry-set-value-api
  desc: Registry value write API
  crit: notable
  conf: 0.9
  for:
  - pe
  - dll
  - c
  - cpp
  any:
  - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-a
  - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
  - id: micro-behaviors/os/registry/value/write::reg-set-key-value
  - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-text
- id: registry-write-api-chain
  desc: Registry open/create and value-write API references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  any:
  - id: micro-behaviors/os/registry/create::registry-create-key-api
  - id: micro-behaviors/os/registry/open::registry-open-key-api
