defaults:
  platforms:
  - windows
traits:
- for:
  - binaries
  - scripts
  - c
  - cpp
  - csharp
  - go
  - rust
  crit: notable
  conf: 0.9
  id: registry-winapi-executable
  desc: RegSetValueEx reference near executable path
  if:
    type: text
    regex: "(?i)RegSetValueEx(A|W)?[^\\r\\n]{0,240}\\.exe\\b"
- for:
  - scripts
  - batch
  - powershell
  - text
  - data
  crit: notable
  conf: 0.9
  id: registry-cli-executable
  desc: Registry add command near executable path
  if:
    type: text
    regex: "(?i)reg(\\.exe)?\\s+add[^\\r\\n]{0,180}\\.exe\\b"
