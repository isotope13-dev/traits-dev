traits:
- for:
  - binaries
  - scripts
  - oledoc
  - batch
  - powershell
  - vbs
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  - java
  - ruby
  - php
  - perl
  - shell
  crit: notable
  conf: 0.9
  id: registry-setvalue-executable
  desc: SetValue call near executable path
  if:
    type: text
    regex: "(?i)SetValue\\s*\\([^\\r\\n]{0,180}\\.exe\\b"
- for:
  - powershell
  - batch
  crit: notable
  conf: 0.9
  id: registry-powershell-executable
  desc: Registry property write near executable path
  if:
    type: text
    regex: "(?i)(Set-ItemProperty|New-ItemProperty)[^\\r\\n]{0,180}\\.exe\\b"
- for:
  - go
  crit: notable
  conf: 0.9
  id: registry-setstring-executable
  desc: SetStringValue call near executable path
  if:
    type: text
    regex: "(?i)SetStringValue\\s*\\([^\\r\\n]{0,180}\\.exe\\b"
- for:
  - python
  - rust
  crit: notable
  conf: 0.9
  id: registry-set-value-executable
  desc: set_value call near executable path
  if:
    type: text
    regex: "(?i)set_value\\s*\\([^\\r\\n]{0,180}\\.exe\\b"
composite_rules:
- for:
  - binaries
  - scripts
  - oledoc
  - batch
  - powershell
  - vbs
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  - java
  - ruby
  - php
  - perl
  - shell
  crit: notable
  conf: 0.92
  id: registry-executable-value-write
  desc: Registry write reference near executable path
  any:
  - id: micro-behaviors/os/registry/value/write::registry-setvalue-executable
  - id: micro-behaviors/os/registry/value/write::registry-winapi-executable
  - id: micro-behaviors/os/registry/value/write::registry-powershell-executable
  - id: micro-behaviors/os/registry/value/write::registry-cli-executable
  - id: micro-behaviors/os/registry/value/write::registry-setstring-executable
  - id: micro-behaviors/os/registry/value/write::registry-set-value-executable
defaults:
  platforms:
  - windows
