# Obfuscated PowerShell scripts reach for the built-in `sp` alias instead of
# the spelled-out Set-ItemProperty cmdlet so cmdlet-text matchers stay quiet.
# The alias with ItemProperty's -Type/-Force parameters is a registry value
# write; the alias alone is too generic to trust.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: sp-alias-invocation
  desc: Statement invokes the sp alias
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?im)^[ \t]*sp\s+\S'
- id: itemproperty-string-force-parameters
  desc: ItemProperty String and Force parameters
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)-Type\s+String\s+-Force'

composite_rules:
- id: sp-alias-property-write
  desc: Registry property write through the sp alias
  crit: notable
  conf: 0.92
  near_lines: 2
  all:
  - id: sp-alias-invocation
  - id: itemproperty-string-force-parameters
