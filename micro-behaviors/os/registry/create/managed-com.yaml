defaults:
  for: [csharp]
  platforms: [windows]
  crit: notable
traits:
  - id: managed-current-user-subkey
    desc: Creates a current-user registry subkey
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Registry\.CurrentUser\.CreateSubKey$'
  - id: managed-treatas-subkey
    desc: Creates a TreatAs registry subkey
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CreateSubKey$'
      arg: {index: 0, exact: TreatAs}
