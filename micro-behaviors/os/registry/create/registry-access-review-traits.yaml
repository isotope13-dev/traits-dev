defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1112
traits:
- id: reg-create-key-ex-w
  desc: Registry key creation API reference
  crit: notable
  conf: 0.92
  for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  - go
  - rust
  if:
    type: symbol
    exact: RegCreateKeyExW

- id: reg-create-key-a
  desc: RegCreateKey API-name reference
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: ^RegCreateKey[AW]$
composite_rules:
- id: registry-create-key-api
  desc: Registry key creation API
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/create::reg-create-key-ex-a
  - id: micro-behaviors/os/registry/create::reg-create-key-ex-w
  - id: micro-behaviors/os/registry/create::reg-create-key-a
