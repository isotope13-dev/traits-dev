defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: reg-enum-key-ex-a-symbol
  desc: Enumerate registry subkeys via import
  crit: notable
  conf: 0.88
  if:
    type: symbol
    exact: RegEnumKeyExA
composite_rules:
- id: registry-enumeration-api-chain
  desc: Registry key enumeration API chain
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/open::registry-open-key-api
  any:
  - id: micro-behaviors/os/registry/read::reg-query-info-key-a-symbol
  - id: micro-behaviors/os/registry/read::reg-enum-value-a-symbol
  - id: micro-behaviors/os/registry/enumerate::reg-enum-key-ex-a-symbol
  needs: 2
