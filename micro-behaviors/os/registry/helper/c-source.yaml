# Registry helper declarations in C/C++ source. The prototype shows a
# registry-facing helper that takes a hive handle and a string; it does not
# show whether the helper reads, writes, or configures a Run key. Persistence
# claims need the composites in objectives/persistence/login/startup/registry.
defaults:
  for: [c, cpp]
  platforms: [windows]

traits:
  - id: c-registry-string-helper-prototype
    desc: Registry helper prototype takes HKEY and string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'HKEY\s{1,3}\w{1,20}\s{0,2},\s{0,2}char\s{0,2}\*'
