defaults:
  platforms: [windows]
  for: [powershell, batch]
traits:
- id: powershell-registry-deny-fullcontrol
  desc: Constructs a registry deny-full-control ACL
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: 'RegistryAccessRule[\s\S]{0,300}["'']FullControl["''][\s\S]{0,220}["'']Deny["'']'

