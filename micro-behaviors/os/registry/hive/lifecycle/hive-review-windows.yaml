defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1112"
composite_rules:
- id: registry-hive-load-unload
  desc: Registry hive load and unload
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/hive/load::load-registry-hive
  - id: micro-behaviors/os/registry/hive/unload::unload-registry-hive
  downgrade:
    any:
    - id: metadata/vendor/identity::microsoft-corp-versioninfo
    - id: metadata/signed/leaf::microsoft-corporation
    - id: metadata/signed/platform::microsoft
    - id: well-known/tool/sysadmin/sandboxie/
    - id: metadata/binary/symbols/name/registry/hive::nt-initialize-registry
    - id: well-known/app/system/reactos::system-component
