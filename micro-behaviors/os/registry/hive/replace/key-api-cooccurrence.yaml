defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: hive-replace-and-key-operation-api-names
    desc: Hive replace and registry key API names
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/os/registry/hive/replace::registry-hive-swap-apis
    any:
      - id: micro-behaviors/os/registry/create::registry-create-key-api
      - id: micro-behaviors/os/registry/open::registry-open-key-api
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
    needs: 2
