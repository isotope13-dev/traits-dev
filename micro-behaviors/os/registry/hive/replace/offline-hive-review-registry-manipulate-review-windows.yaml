defaults:
  platforms:
  - windows
  for: [pe, c, cpp]
  attack: T1112
traits:
- id: reg-replace-key
  desc: RegReplaceKey API-name reference
  crit: notable
  conf: 0.92
  for:
  - pe
  if:
    type: text
    regex: ^RegReplaceKey[AW]?$
composite_rules:
- id: registry-hive-swap-apis
  for: [pe]
  desc: Hive replace and save or restore API names
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/os/registry/hive/replace::reg-replace-key
  any:
  - id: micro-behaviors/os/registry/hive/save::reg-save-key
  - id: micro-behaviors/os/registry/hive/restore::reg-restore-key
