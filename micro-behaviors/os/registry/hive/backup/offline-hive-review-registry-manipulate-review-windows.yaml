defaults:
  platforms:
  - windows
  for: [pe, c, cpp]
composite_rules:
- id: registry-hive-backup-restore-privileges
  for: [pe]
  desc: Hive save, restore and privilege references
  crit: notable
  conf: 0.9
  attack: T1112
  all:
  - id: micro-behaviors/os/registry/hive/save::reg-save-key
  - id: micro-behaviors/os/registry/hive/restore::reg-restore-key
  - id: metadata/file/system-info/privilege-name::backup-privilege-name
  - id: metadata/file/system-info/privilege-name::restore-privilege-name
