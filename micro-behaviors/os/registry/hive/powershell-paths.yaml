# A hive-qualified path reference proves neither reading nor writing.
defaults:
  crit: notable
  platforms:
  - windows
  for:
  - powershell
  conf: 0.9
traits:
- id: powershell-machine-registry-path
  desc: PowerShell HKLM registry path
  if:
    type: text
    regex: '(?i)-Path\s+[''"'']?HKLM:'
- id: powershell-machine-registry-root
  desc: PowerShell machine registry root
  if:
    type: text
    regex: '(?i)-Path\s+[''"'']?HKEY_LOCAL_MACHINE:'
- id: powershell-user-registry-path
  desc: PowerShell HKCU registry path
  if:
    type: text
    regex: '(?i)-Path\s+[''"'']?HKCU:'
- id: powershell-user-registry-root
  desc: PowerShell user registry root
  if:
    type: text
    regex: '(?i)-Path\s+[''"'']?HKEY_CURRENT_USER:'
