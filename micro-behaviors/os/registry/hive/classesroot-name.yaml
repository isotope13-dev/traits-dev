# CLR field names are stored separately from declaring types. This records
# the hive name only; it neither resolves a field owner nor proves access.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: classesroot-hive-member-name
    desc: ClassesRoot registry-hive name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: ClassesRoot
      section: .text
