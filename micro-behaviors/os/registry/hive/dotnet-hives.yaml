# Bare CLR names such as Users or CurrentUser also name directories, enum
# values and application properties. Require the qualified Registry receiver.
# These observations identify hive references, not reads or writes to those hives.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [pe, dll, csharp]

traits:
  - id: dotnet-classes-root-hive
    desc: References Registry.ClassesRoot hive member
    if:
      type: text
      regex: '\bMicrosoft\.Win32\.Registry\]?([.]|::)ClassesRoot\b'
  - id: dotnet-current-user-hive
    desc: References Registry.CurrentUser hive member
    if:
      type: text
      regex: '\bMicrosoft\.Win32\.Registry\]?([.]|::)CurrentUser\b'
  - id: dotnet-local-machine-hive
    desc: References Registry.LocalMachine hive member
    if:
      type: text
      regex: '\bMicrosoft\.Win32\.Registry\]?([.]|::)LocalMachine\b'
  - id: dotnet-users-hive
    desc: References Registry.Users hive member
    if:
      type: text
      regex: '\bMicrosoft\.Win32\.Registry\]?([.]|::)Users\b'
  - id: dotnet-current-config-hive
    desc: References Registry.CurrentConfig hive member
    if:
      type: text
      regex: '\bMicrosoft\.Win32\.Registry\]?([.]|::)CurrentConfig\b'

composite_rules:
  - id: dotnet-multiple-registry-hives
    desc: References four distinct Registry hive members
    conf: 0.95
    any:
      - id: dotnet-classes-root-hive
      - id: dotnet-current-user-hive
      - id: dotnet-local-machine-hive
      - id: dotnet-users-hive
      - id: dotnet-current-config-hive
    needs: 4
