# References to the SAM/SECURITY hive roots, including hive-qualified paths.
defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
traits:
- id: hklm-sam-security-hive
  desc: HKLM SAM or SECURITY hive key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)(HKLM|HKEY_LOCAL_MACHINE)\\+(SAM|SECURITY)\b
- id: sam-security-hive-subkey
  desc: SAM or SECURITY hive subkey string
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[''"](SAM|SECURITY)\\'
