defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1112"
traits:
- id: load-registry-hive
  desc: Load registry hive from disk
  crit: notable
  conf: 0.97
  if:
    type: symbol
    exact: "ZwLoadKey"
  downgrade:
    any:
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
- id: unload-registry-hive
  desc: Unload registry hive from disk
  crit: notable
  conf: 0.97
  if:
    type: symbol
    exact: "ZwUnloadKey"
  downgrade:
    any:
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
- id: nt-initialize-registry
  desc: NtInitializeRegistry symbol
  crit: notable
  conf: 0.98
  if:
    type: symbol
    exact: "NtInitializeRegistry"
composite_rules:
- id: registry-hive-load-unload
  desc: Registry hive load and unload
  crit: suspicious
  conf: 0.98
  all:
  - id: load-registry-hive
  - id: unload-registry-hive
  downgrade:
    any:
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: metadata/signed/leaf::microsoft-corporation
    - id: metadata/signed/platform::microsoft
    - id: well-known/tool/sysadmin/sandboxie/
    - id: nt-initialize-registry
    - id: well-known/app/system/reactos::system-component
