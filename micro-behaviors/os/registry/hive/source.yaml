# Registry hive strings in C/C++ source. A bare hive string is a neutral
# capability observation: profilers, installers, and malware alike name a
# hive. Objective rules add the Run-key path plus a value write before
# treating it as persistence.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.85
  attack: T1547.001

traits:
  - id: hklm-registry-hive-source
    desc: HKLM registry hive string in source
    if:
      type: text
      substr: "HKEY_LOCAL_MACHINE"
  - id: hkcu-registry-hive-source
    desc: HKCU registry hive string in source
    if:
      type: text
      substr: "HKEY_CURRENT_USER"
