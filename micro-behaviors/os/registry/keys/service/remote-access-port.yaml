defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: telnet-server-port-reference
    desc: Telnet server port registry value reference
    if:
      type: text
      substr: 'Microsoft\TelnetServer\1.0\TelnetPort'
      case_insensitive: true

  - id: terminal-server-port-reference
    desc: Terminal Server port registry value reference
    if:
      type: text
      substr: 'Terminal Server\Wds\rdpwd\Tds\tcp\PortNumber'
      case_insensitive: true
