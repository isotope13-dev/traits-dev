# Internet Explorer / Windows Shell browser-settings registry keys.
#
# These are the keys that hold the user's chosen home page and search
# providers. Referencing one is not by itself wrong -- a browser reads its own
# settings and a migration tool copies them -- so every trait here is a plain
# key-path observation at notable. What makes them worth naming is that they
# are the concrete storage a search hijacker has to write, and no rule in the
# tree named them before.
#
# `substr` rather than `exact`: in a PE the extracted run is the whole
# null-terminated key path, and in a script it is the surrounding source line;
# an `exact` match would only ever fire on one of the two. In this binary the
# paths are UTF-16LE, which `type: text` normalizes -- an ASCII-only matcher
# sees nothing at all.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell, vbs, javascript, csharp, python]
  attack: T1112

traits:
  - id: ie-main-settings-registry-key
    desc: Internet Explorer Main settings key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Internet Explorer\\Main'

  - id: ie-search-scopes-registry-key
    desc: Internet Explorer search providers key
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Internet Explorer\\SearchScopes'

  # IE's browser-helper-object allowlist: an add-on listed here loads without
  # the "an add-on wants to run" prompt.
  - id: ie-approved-extensions-registry-key
    desc: Internet Explorer approved add-ons key
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Internet Explorer\\Approved Extensions'
