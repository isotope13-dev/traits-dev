defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-microsoft-run-key-apis
    desc: Unsigned Microsoft-claim PE with Run-key APIs
    crit: notable
    conf: 0.96
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
    # A Run-key string and a claimed vendor do not establish a writer.
    any:
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-text
      - id: micro-behaviors/os/registry/access::xor-registry-value-write-api
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: well-known/app/enterprise/microsoft-office-c2r::skype-business-recording-manager
      - id: well-known/lib/platform/microsoft-wow64::microsoft-wow64-system-context
      - id: well-known/app/system/windows-migration::mighost-binary-identity
