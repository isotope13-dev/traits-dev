defaults:
  platforms: [windows]

composite_rules:
- id: run-key-path-reference
  desc: Run-key path reference
  conf: 0.9
  crit: notable
  any:
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  - id: "micro-behaviors/os/registry/keys/autostart::hkcu-run-path-reference"
  for: [pe, oledoc, powershell, batch, csharp, python, go]
- id: run-or-winlogon-key-reference
  desc: Run or Winlogon key reference
  conf: 0.85
  crit: notable
  for: [pe, dll]
  any:
  - id: "micro-behaviors/os/registry/keys/autostart::windows-run-key-path"
  - id: "micro-behaviors/os/registry/keys/autostart::winlogon-registry-path"
