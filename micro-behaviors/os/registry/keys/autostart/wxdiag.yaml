defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
traits:
  - id: wxdiag-run-key-path-reference
    desc: WxDiag Windows Run-key path reference
    crit: component
    conf: 0.97
    size_min: 100000
    size_max: 5000000
    if:
      type: text
      substr: CurrentVersion\Run\WxDiag
      section: __cstring
