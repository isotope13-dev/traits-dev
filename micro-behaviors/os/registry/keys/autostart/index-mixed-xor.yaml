# Reconstruct the Run-key path from RIP-loaded vectors and stack immediates.
# Both decoder operands remain variable; no ciphertext or campaign name gates.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: index-mixed-xor-run-key-path
    desc: Index-XOR concealed CurrentVersion Run key
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule index_mixed_xor_current_user_run_path {
          strings:
            $init = { 66 0F 6F 05 ?? ?? ?? ?? F3 0F 7F 45 ?? 66 0F 6F 0D ?? ?? ?? ?? F3 0F 7F 4D ?? C7 45 ?? ?? ?? ?? ?? C7 45 ?? ?? ?? ?? ?? C7 45 ?? ?? ?? ?? ?? 66 C7 45 ?? ?? ?? }
            $loop = { 49 8B D0 41 69 C0 ?? ?? ?? ?? B9 ?? ?? ?? ?? 2B C8 8B C1 C1 E8 0F 33 C1 42 32 44 05 ?? 43 88 04 08 49 FF C0 48 8D 42 02 48 83 F8 2E }
          condition:
            pe.is_pe and $init and $loop and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".text" and
              for any l in (1..#loop) : (
                @loop[l] >= pe.sections[s].raw_data_offset and
                @loop[l]+!loop[l] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
                for any i in (1..#init) : (
                  @init[i] >= @loop[l]-256 and @init[i]+!init[i] < @loop[l] and
                  ((uint8(@init[i]+12)+16) & 255) == uint8(@init[i]+25) and
                  uint8(@init[i]+28) == ((uint8(@init[i]+12)+32) & 255) and
                  uint8(@init[i]+35) == ((uint8(@init[i]+12)+36) & 255) and
                  uint8(@init[i]+42) == ((uint8(@init[i]+12)+40) & 255) and
                  uint8(@init[i]+50) == ((uint8(@init[i]+12)+44) & 255) and
                  uint8(@loop[l]+28) == uint8(@init[i]+12) and
                  with first = pe.rva_to_offset(pe.sections[s].virtual_address+@init[i]-pe.sections[s].raw_data_offset+8+int32(@init[i]+4)),
                       second = pe.rva_to_offset(pe.sections[s].virtual_address+@init[i]-pe.sections[s].raw_data_offset+21+int32(@init[i]+17)) : (
                    for all j in (0..44) : (
                      with state = (uint32(@loop[l]+11)-j*uint32(@loop[l]+6)) & 0xffffffff : (
                        (
                          j < 16 and with decoded = uint8(first+j) ^ ((state ^ (state >> 15)) & 255) : (
                            (j >= 0 and j < 8 and decoded == ((0x6572617774666f53 >> ((j-0)*8)) & 255)) or
                            (j >= 8 and j < 16 and decoded == ((0x6f736f7263694d5c >> ((j-8)*8)) & 255))
                          )
                        ) or (
                          j >= 16 and j < 32 and with decoded = uint8(second+j-16) ^ ((state ^ (state >> 15)) & 255) : (
                            (j >= 16 and j < 24 and decoded == ((0x6f646e69575c7466 >> ((j-16)*8)) & 255)) or
                            (j >= 24 and j < 32 and decoded == ((0x65727275435c7377 >> ((j-24)*8)) & 255))
                          )
                        ) or (
                          j >= 32 and j < 44 and with decoded = uint8(@init[i]+29+((j-32)\4)*7+(j-32)%4) ^ ((state ^ (state >> 15)) & 255) : (
                            (j >= 32 and j < 40 and decoded == ((0x6f6973726556746e >> ((j-32)*8)) & 255)) or
                            (j >= 40 and j < 44 and decoded == ((0x75525c6e >> ((j-40)*8)) & 255))
                          )
                        ) or (
                          j == 44 and (uint8(@init[i]+51) ^ ((state ^ (state >> 15)) & 255)) == 110
                        )
                      )
                    )
                  )
                )
              )
            )
        }
