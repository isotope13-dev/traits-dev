defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: native-run-key-write-profile
    desc: Run-key path beside registry-write API
    crit: notable
    conf: 0.95
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/access::registry-set-value-source
    near_bytes: 1200
