defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: feedback-coded-currentversion-run
    desc: Feedback-coded Windows CurrentVersion Run path
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # UTF-16 BSTR; feedback triplets from the shared decoder. This is the
      # standard path/command, independent of any dropped filename or host.
