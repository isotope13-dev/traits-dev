defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # UTF-16 stack stores spell CurrentVersion\Run. Some repeated letters and
  # the separator come from registers; this observes the construction idiom,
  # without claiming a registry write. Stack displacements remain variable.
  - id: stack-currentversion-run-key-x86
    desc: x86 stack-built CurrentVersion Run key
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '66 C7 45 ?? 43 00 66 C7 45 ?? 75 00 66 C7 45 ?? 72 00 66 C7 45 ?? 72 00 66 C7 45 ?? 65 00 66 C7 45 ?? 74 00 66 C7 45 ?? 56 00 66 C7 45 ?? 65 00 66 C7 45 ?? 72 00 66 C7 45 ?? 73 00 66 C7 45 ?? 69 00 66 89 4D ?? 66 89 55 ?? 66 C7 45 ?? 52 00 66 C7 45 ?? 75 00 66 89 7D ??'
