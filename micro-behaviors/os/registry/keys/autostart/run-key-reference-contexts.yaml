---
defaults:
  crit: notable
traits:
- id: go-hkcu-run-key-path
  platforms:
  - windows
  desc: References HKCU CurrentVersion Run path
  conf: 0.8
  for:
  - go
  - pe
  - dll
  if:
    type: text
    regex: HKCU.{0,20}\\Software\\Microsoft\\Windows\\CurrentVersion\\Run
  unless:
  - id: well-known/tool/sysadmin/conemu/
  - id: metadata/signed/certificate/subject::glarysoft-ltd
- id: go-hklm-run-key-path
  platforms:
  - windows
  desc: References HKLM CurrentVersion Run path
  conf: 0.8
  for:
  - go
  - pe
  - dll
  if:
    type: text
    regex: HKLM.{0,20}\\Software\\Microsoft\\Windows\\CurrentVersion\\Run
  unless:
  - id: metadata/signed/certificate/subject::glarysoft-ltd
- id: js-currentversion-run-escaped-tail
  platforms:
  - windows
  for:
  - javascript
  desc: Escaped CurrentVersion Run key tail
  conf: 0.9
  if:
    type: text
    substr: ersion\x5cRun
- id: perl-currentversion-run-text
  platforms:
  - windows
  for:
  - perl
  desc: Perl references HKCU CurrentVersion Run
  conf: 0.98
  if:
    type: text
    regex: "(?i)HKCU\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run"
- id: base64-run-key-reference
  platforms:
  - windows
  desc: Base64-encoded Run or RunOnce path
  conf: 0.97
  for:
  - data
  if:
    type: encoded
    encoding: base64
    regex: "(?is)\\bcurrentversion\\\\(run|runonce)\\b"
- id: rust-hkcu-run-key-reference
  platforms:
  - windows
  - unix
  for:
  - rust
  desc: Rust references HKCU CurrentVersion Run
  conf: 0.9
  if:
    type: text
    substr: HKCU\Software\Microsoft\Windows\CurrentVersion\Run
composite_rules:
- id: go-appdata-run-key-name-context
  platforms:
  - windows
  desc: AppData image, Run key and system names
  conf: 0.95
  for:
  - go
  all:
  - id: micro-behaviors/fs/path/app-data::roaming-appdata-executable-path
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/process/info/name::windows-system-name-references
- id: jvm-run-key-process-context
  conf: 0.98
  platforms:
  - windows
  for:
  - class
  - jar
  - data
  desc: JVM Run path, REG_SZ and execution co-occur
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/manipulate::jvm-reg-sz-token
  any:
  - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
  - id: micro-behaviors/process/create/exec::java-runtime-exec-bytecode-reference
  unless:
  - id: metadata/file/magic/identity::gzip
  - id: metadata/file/entropy::high-entropy-archive
- id: ruby-self-copy-run-key-reference-context
  platforms:
  - windows
  for:
  - ruby
  desc: Ruby self-copy and Run path co-occur
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/fs/file/copy::ruby-copy-packaged-exe
- id: rust-run-key-value-type-context
  platforms:
  - windows
  for:
  - rust
  desc: Rust Run path, value name and type co-occur
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/keys/autostart::rust-hkcu-run-key-reference
  - id: micro-behaviors/os/registry/value-name::rust-securityupdate-value-literal
  - id: micro-behaviors/os/registry/value-type::rust-reg-sz-token
