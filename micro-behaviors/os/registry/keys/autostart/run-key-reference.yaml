# A path reference is not evidence of a registry write.
defaults:
  platforms: [windows]
  for: [pe]
  size_min: 50000
  size_max: 4194304
composite_rules:
  - id: run-or-runonce-key-reference
    desc: Run or RunOnce registry key reference
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
