defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]

traits:
  - id: ps-lsa-secrets-registry-path
    desc: PowerShell LSA secrets registry path
    conf: 0.94
    if:
      type: text
      substr: 'HKLM:\SECURITY\Policy\Secrets'

  - id: ps-winlogon-secret-values
    desc: Winlogon password and username value references
    conf: 0.92
    if:
      type: text
      regex: 'DefaultPassword.{0,80}DefaultUserName'

composite_rules:
  - id: ps-winlogon-autologon-secrets
    desc: Winlogon key and credential-value references
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/keys::winlogon-registry-path
      - id: micro-behaviors/os/registry/keys::ps-winlogon-secret-values
