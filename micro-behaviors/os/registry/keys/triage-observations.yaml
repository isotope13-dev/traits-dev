defaults:
  platforms: [windows]
traits:
- id: currentversion-run-key-path
  desc: References Windows CurrentVersion Run key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)Software[\\/]Microsoft[\\/]Windows[\\/]CurrentVersion[\\/]Run([\\/]|$|["'\s])
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: well-known/app/storage/peazip/
  - id: well-known/app/network/juniper-setup-client::juniper-setup-client-identity
  for: [python, javascript, vbs, powershell, pe, c, cpp]
- id: software-run-key-reference
  desc: References Windows CurrentVersion Run key
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (?i)SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run(\\|$|["'\s])
  unless:
  - id: metadata/signed/unknown::tencent-technologyshenzhen-company-limited
  - id: well-known/lib/platform/wmi::wmi-win32-provider-versioninfo
  - id: metadata/binary/installer/family/
  for:
  - pe
  - oledoc
  - powershell
  - batch
  - csharp
  - python
  - go
