defaults:
  platforms: [windows]
traits:
- id: currentversion-run-key-path
  desc: References Windows CurrentVersion Run key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)Software[\\/]Microsoft[\\/]Windows[\\/]CurrentVersion[\\/]Run([\\/]|$|["'\s])
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: well-known/app/storage/peazip/
  - id: well-known/app/network/juniper-setup-client::juniper-setup-client-identity
  for: [scripts, source, binaries, oledoc]
