# Chromium Native Messaging Host registration lives below per-user registry
# keys.  The key is a neutral platform surface; persistence or execution intent
# is expressed by objective composites that pair it with a host value/write.
defaults:
  platforms: [windows]
  for: [scripts, source, data, pe, dll, elf]
  crit: notable
  conf: 0.95
  attack: T1112

traits:
  - id: chromium-native-messaging-hosts-subkey
    desc: Chromium Native Messaging Hosts key
    if:
      type: text
      regex: '(?i)(Google[/\\]+)?(Chrome|Chromium|Microsoft[/\\]+Edge)[/\\]+NativeMessagingHosts\b'
