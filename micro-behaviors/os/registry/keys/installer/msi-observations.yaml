defaults:
  platforms: [windows]
  for: [oledoc]
traits:
  - id: ansi-run-key-path
    desc: ANSI Windows Run-key path
    for: [oledoc, pe, dll]
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)Software\\Microsoft\\Windows\\CurrentVersion\\Run'
    unless:
      - id: well-known/app/storage/cloud-drive-mapper::cloud-drive-mapper-msi-context
  - id: msi-run-key-reference-encoded
    desc: Encoded MSI contains Windows Run-key path
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      substr: 'Software\Microsoft\Windows\CurrentVersion\Run'
      case_insensitive: true
