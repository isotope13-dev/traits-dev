---
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
  crit: notable
traits:
- id: dotnet-install-registry-path-accessor
  desc: Installation registry path accessor reference
  conf: 0.9
  if:
    type: text
    word: get_InstallationRegisteryPath
- id: dotnet-install-key-name-accessor
  desc: Installation key-name accessor reference
  conf: 0.88
  if:
    type: text
    word: get_InstallationKeyName
- id: hidden-startup-registry-accessors
  desc: Hidden startup registry accessor references
  conf: 0.9
  if:
    type: text
    regex: get_HiddenStartup(Reg|Key)
