# Uninstall-key paths of named security products. Reading one tells a
# program whether that product is installed: bundle installers use it to
# skip an offer already present, droppers to adapt to the resident AV. The
# path is the observation; consumers supply the intent.
defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: avast-uninstall-key
  desc: Avast uninstall registry probe
  crit: notable
  conf: 0.94
  attack: T1518.001
  if:
    type: text
    regex: (?i)uninstall\\avast
  unless:
  - type: text
    substr: "IObit Unlocker"
  - type: text
    substr: "IObit CO."
