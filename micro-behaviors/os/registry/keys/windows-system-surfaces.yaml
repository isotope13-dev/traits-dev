defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: user-environment-registry-key
    desc: Windows per-user Environment registry key
    for: [scripts, binaries, c, cpp, csharp, go, rust]
    conf: 0.96
    if:
      type: text
      substr: 'HKCU:\Environment'

  - id: system-services-registry-path
    desc: Windows system services registry path
    for: [binaries, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)SYSTEM[\\\\/]{1,4}CurrentControlSet[\\\\/]{1,4}Services[\\\\/]{1,4}'

  - id: winlogon-registry-path
    desc: Windows Winlogon registry key path
    for: [powershell, pe, dll, csharp, batch, vbs, go]
    if:
      type: text
      substr: 'Windows NT\CurrentVersion\Winlogon'

  - id: winlogon-shell-value-name
    desc: Windows Winlogon Shell registry value name
    for: [powershell, pe, dll, csharp, batch, vbs, go]
    if:
      type: text
      regex: 'Winlogon.{0,50}Shell'

  - id: winlogon-notify-subkey
    desc: Windows Winlogon Notify registry subkey
    for: [powershell, pe, dll, csharp, batch, vbs, go]
    if:
      type: text
      regex: 'Winlogon.{0,30}Notify'

  - id: screensaver-executable-value-name
    desc: Screensaver executable registry value
    if:
      type: text
      word: SCRNSAVE.EXE
      case_insensitive: true

  - id: screensaver-active-value-name
    desc: Screensaver activation registry value
    if:
      type: text
      word: ScreenSaveActive
      case_insensitive: true

  - id: picture-password-logonui-path
    desc: Windows LogonUI picture-password registry path
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      substr: 'Authentication\LogonUI\PicturePassword'

  - id: currentversion-windows-load-run-path
    desc: Windows CurrentVersion Load or Run key path
    for: [powershell, pe, dll, csharp, batch, vbs]
    if:
      type: text
      regex: '(?is)CurrentVersion\\Windows.{0,96}\b(load|run)\b'

  # The per-SID Windows Installer bookkeeping hive: which products are
  # registered and which patches they carry. Admin tooling reads and prunes it
  # (Office deployment ships unPatches*.vbs to clear patch records before a
  # slipstreamed reinstall), and the same keys are what an attacker rewrites to
  # make a product accept a downgraded package or to drop it from inventory.
  - id: installer-userdata-registry-path
    desc: Windows Installer UserData registry path
    for: [powershell, pe, dll, csharp, batch, vbs, javascript]
    if:
      type: text
      regex: '(?i)CurrentVersion\\Installer\\UserData\\'

  - id: appinit-dlls-value-name
    desc: AppInit DLL registry value name
    if:
      type: text
      word: AppInit_DLLs

  - id: loadappinit-policy-value
    desc: LoadAppInit DLL policy value name
    if:
      type: text
      word: LoadAppInit_DLLs

  - id: appcert-dlls-registry-path
    desc: AppCert DLL registry value path
    if:
      type: text
      regex: '(?i)\\Control\\Session Manager\\AppCertDlls\b|\\AppCertDlls\b'

  - id: appcompatflags-layers-registry-key
    desc: AppCompatFlags Layers registry key path
    for: [powershell, pe, dll, csharp, batch, vbs]
    if:
      type: text
      regex: '(?i)SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\Layers'

composite_rules:
  - id: appinit-registry-values
    desc: AppInit DLL registry values
    any:
      - id: appinit-dlls-value-name
      - id: loadappinit-policy-value
      - id: appcert-dlls-registry-path

  - id: screensaver-registry-values
    desc: Windows screensaver registry values
    any:
      - id: screensaver-executable-value-name
      - id: screensaver-active-value-name
