defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:

  - id: picture-password-logonui-path
    desc: Windows LogonUI picture-password registry path
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      substr: 'Authentication\LogonUI\PicturePassword'
  - id: lsa-package-list-value-name
    desc: LSA package list value name
    conf: 0.84
    if:
      type: literal
      regex: '(?i)^(Authentication Packages|Security Packages|Notification Packages)$'
