# Outlook keeps its MAPI profiles, and the account settings and password blobs
# inside them, under the per-version Office key and the legacy Windows Messaging
# Subsystem key.
defaults:
  platforms: [windows]
  for: [binaries, scripts, csharp]
  crit: notable
  conf: 0.85

traits:
  - id: outlook-profile-registry-key
    desc: Outlook MAPI profile registry key path
    if:
      type: text
      regex: 'Software\\Microsoft\\(Office\\[0-9]{2}\.0\\Outlook|Windows Messaging Subsystem)\\Profiles'
      case_insensitive: true
