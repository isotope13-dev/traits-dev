defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-shell-runkey-reference
    desc: VB6 shell capability with Run-key reference
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
      - id: currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-runkey-exe-reference
    desc: VB6 Run-key and executable suffix clues
    crit: notable
    conf: 0.94
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: currentversion-run
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
      - id: metadata/package/tooling::librehardwaremonitor-binary
      - id: metadata/package/tooling::shadowsocks-windows-binary
