# Evidence describes ordinary capabilities or static properties.
defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.84
traits:
- id: office-addin-key-path
  desc: Office add-in registry key path
  if:
    type: text
    regex: \\Office\\[^\\\n]{1,80}\\Addins\\
- id: outlook-addin-key-path
  desc: Outlook add-in registry key path
  if:
    type: text
    substr: \Outlook\Addins\
