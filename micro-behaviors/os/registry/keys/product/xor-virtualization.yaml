traits:
- id: encoded-vm-artifact-vmware
  desc: Encoded VMware artifact probe
  crit: notable
  conf: 0.98
  if:
    type: encoded
    encoding: xor
    regex: (?i)SOFTWARE\\VMware, Inc\\VMware Tools
- id: encoded-vm-artifact-virtualbox
  desc: Encoded VirtualBox artifact probe
  crit: notable
  conf: 0.98
  if:
    type: encoded
    encoding: xor
    regex: (?i)SOFTWARE\\Oracle\\VirtualBox Guest Additions
- id: encoded-vm-artifact-services
  desc: Encoded VirtualBox service probes
  crit: notable
  conf: 0.98
  if:
    type: encoded
    encoding: xor
    regex: (?i)SYSTEM\\CurrentControlSet\\Services\\VBox(Guest|SF|Video)
composite_rules:
- id: encoded-vm-artifact-probe-set
  desc: XOR-decoded VM registry path cluster
  crit: notable
  conf: 0.99
  any:
  - id: micro-behaviors/os/registry/keys/product::encoded-vm-artifact-vmware
  - id: micro-behaviors/os/registry/keys/product::encoded-vm-artifact-virtualbox
  - id: micro-behaviors/os/registry/keys/product::encoded-vm-artifact-services
  needs: 2
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
