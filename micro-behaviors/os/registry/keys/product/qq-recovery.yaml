defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: qq-registry-target
    desc: References Tencent QQ installation registry key
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: SOFTWARE\TENCENT\QQ
      section: .text
  - id: recovery-genius-registry-key
    desc: Recovery Genius installation registry key
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '^SOFTWARE\\(GoldenSoft|YuanZhi)\\Recovery Genius$'
      section: .text
  - id: qq-registry-target-blank-section
    desc: Tencent QQ registry key in unnamed section
    crit: notable
    conf: 0.98
    size_min: 70000
    size_max: 140000
    if:
      type: text
      exact: SOFTWARE\TENCENT\QQ
      section: ""
