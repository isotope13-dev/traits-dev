defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: per-user-msc-exe-shell-command-path
    desc: Per-user MSC/EXE shell-command override path
    if:
      type: text
      regex: '(?i)HKCU:.{0,30}\\(mscfile\\shell\\open|exefile\\shell\\runas)\\command'
