defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: network-provider-order-path
    desc: NetworkProvider order registry path
    if:
      type: text
      substr: '\NetworkProvider\Order'
  - id: network-provider-key-path
    desc: NetworkProvider registry key path
    if:
      type: text
      substr: '\NetworkProvider'
  - id: network-provider-order-value
    desc: ProviderOrder string or registry value argument
    if:
      type: text
      # Bare source identifiers also name ordinary application provider lists.
      # Retain standalone binary strings, quoted value names, and unquoted
      # PowerShell/reg.exe value-name arguments (Windows names ignore case).
      regex: '(?i)(^ProviderOrder$|["'']ProviderOrder["'']|(-Name|/v)\s+ProviderOrder\b)'

composite_rules:
  - id: network-provider-path-and-value-references
    desc: NetworkProvider path and ProviderPath references
    all:
    - id: "micro-behaviors/os/registry/value-name::providerpath-value-name"
    unless:
    - id: well-known/lib/platform/wine/
    - id: well-known/tool/sysadmin/sysinternals/
    - id: well-known/app/system/reactos::system-component
    - id: well-known/lib/native/win32-bindings::win32more-generated-bindings
    - id: well-known/lib/crypto/mit-krb5::source-tree-context
    - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
    any:
    - id: micro-behaviors/os/registry/keys/execution::network-provider-order-path
    - id: micro-behaviors/os/registry/keys/execution::network-provider-key-path
    - id: micro-behaviors/os/registry/keys/execution::network-provider-order-value
    downgrade:
      any:
      - id: well-known/tool/offensive/psbits::source-tree-member
  - id: network-provider-order-and-dll-path-references
    desc: NetworkProvider order and ProviderPath references
    all:
    - id: micro-behaviors/os/registry/keys/execution::network-provider-order-path
    - id: "micro-behaviors/os/registry/value-name::providerpath-value-name"
    unless:
    - id: well-known/lib/platform/wine/
    - id: well-known/tool/sysadmin/sysinternals/
    - id: well-known/app/system/reactos::system-component
    - id: well-known/lib/native/win32-bindings::win32more-generated-bindings
    - id: well-known/lib/crypto/mit-krb5::source-tree-context
    - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
    - id: well-known/tool/offensive/psbits::source-tree-member
  - id: network-provider-key-and-dll-path-references
    desc: NetworkProvider key and ProviderPath references
    all:
    - id: micro-behaviors/os/registry/keys/execution::network-provider-key-path
    - id: "micro-behaviors/os/registry/value-name::providerpath-value-name"
    unless:
    - id: well-known/lib/platform/wine/
    - id: well-known/tool/sysadmin/sysinternals/
    - id: well-known/app/system/reactos::system-component
    - id: well-known/lib/native/win32-bindings::win32more-generated-bindings
    - id: well-known/lib/crypto/mit-krb5::source-tree-context
    - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
    - id: well-known/tool/offensive/psbits::source-tree-member
  - id: network-provider-order-value-and-key-references
    desc: ProviderOrder and NetworkProvider key references
    all:
    - id: micro-behaviors/os/registry/keys/execution::network-provider-order-value
    - id: micro-behaviors/os/registry/keys/execution::network-provider-key-path
    unless:
    - id: well-known/lib/platform/wine/
    - id: well-known/tool/sysadmin/sysinternals/
    - id: well-known/app/system/reactos::system-component
    - id: well-known/lib/native/win32-bindings::win32more-generated-bindings
    - id: well-known/lib/crypto/mit-krb5::source-tree-context
    - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
    - id: well-known/tool/offensive/psbits::source-tree-member
    - id: metadata/package/tooling::dependencies-clrph-library

