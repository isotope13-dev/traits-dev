defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: ifeo-key-debugger-proximity
  desc: Debugger value name near IFEO key path
  crit: notable
  conf: 0.92
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/registry/keys/execution::ifeo-key-reference
  - id: micro-behaviors/os/registry/value-name::debugger-value-name-token
- id: ifeo-debugger-write-api-evidence
  desc: IFEO Debugger references with registry-write APIs
  crit: notable
  conf: 0.92
  all:
  - id: ifeo-key-debugger-proximity
  any:
  - id: micro-behaviors/os/registry/access::registry-set-value-api
  - id: micro-behaviors/os/registry/access::dotnet-registrykey-setvalue-references
