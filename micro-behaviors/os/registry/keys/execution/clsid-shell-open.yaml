# Shell verb commands registered under a COM class key. This is the same
# neutral registry-path observation as the exefile and mscfile atoms beside
# it, for the CLSID form: CLSID\{guid}\shell\<verb>\command. Installers of
# shell namespace classes reference it, and hijacks (a payload exe written
# as the open command of a system class such as the Recycle Bin) are detected
# by consumers that pair this path with a registry-write command.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.95
  for: [scripts, source, pe, dll, text, data]
traits:
  - id: clsid-shell-open-command-path
    desc: CLSID shell open-command registry path
    if:
      type: text
      regex: '(?i)clsid\\[{][0-9a-f-]{8,40}[}]\\shell\\open\\command'

  # The Recycle Bin class is a fixed Windows platform constant; rewriting its
  # open verb has no installer role, which is why consumers can require it.
  - id: recycle-bin-shell-open-command-path
    desc: Recycle Bin shell open-command registry path
    conf: 0.98
    if:
      type: text
      regex: '(?i)645FF040-5081-101B-9F08-00AA002F954E[}]\\shell\\open\\command'
