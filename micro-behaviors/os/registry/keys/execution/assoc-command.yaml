defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-assoc-extension-assignment
    desc: Assigns a file-extension association with assoc
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*assoc\s+\.[A-Za-z0-9]{1,8}='

    unless:
    - id: well-known/lib/platform/wine::wine-source-tree
    - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
