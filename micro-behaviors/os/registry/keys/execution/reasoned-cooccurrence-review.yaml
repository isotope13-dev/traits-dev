# References and API co-occurrence do not establish bound data flow.
defaults:
  for:
  - scripts
  - binaries
  platforms:
  - windows
  crit: notable
traits:
- id: print-processor-registry-path-reference
  desc: Print processor registry path reference
  conf: 0.88
  unless:
  - id: well-known/lib/platform/wine/
  if:
    type: text
    regex: (?i)\\Control\\Print\\Environments\\[^\\\n]{1,160}\\Print Processors\\
- id: silentprocessexit-registry-path-reference
  desc: SilentProcessExit registry path reference
  conf: 0.9
  if:
    type: text
    regex: (?i)\\SilentProcessExit\\
- id: ifeo-globalflag-registry-reference
  desc: IFEO GlobalFlag registry reference
  conf: 0.9
  if:
    type: text
    regex: \\Image File Execution Options\\[^\\\n]{1,80}\\GlobalFlag\b
- id: netsh-helper-registry-path
  desc: Netsh helper registry path reference
  conf: 0.88
  if:
    type: text
    regex: (?i)\\Microsoft\\NetSh\\
composite_rules:
- id: silentprocessexit-registry-surface
  desc: SilentProcessExit path or monitor-value references
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/keys/execution::silentprocessexit-registry-path-reference
  - id: micro-behaviors/os/registry/keys/execution::ifeo-globalflag-registry-reference
  - id: micro-behaviors/os/registry/value-name::monitorprocess-value-name
  unless:
  - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
- id: dll-autorun-surface-references
  desc: DLL autorun registry surface references
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/keys/autostart::appinit-dlls-value-name
  - id: micro-behaviors/os/registry/keys/autostart::loadappinit-policy-value
  - id: micro-behaviors/os/registry/keys/execution::appcert-dlls-registry-path
  - id: micro-behaviors/os/registry/keys/policy::lsa-package-registry-path
  - id: micro-behaviors/os/registry/keys/execution::print-monitor-registry-path-reference
  - id: micro-behaviors/os/registry/keys/execution::print-processor-registry-path-reference
  - id: micro-behaviors/os/registry/keys/service::time-provider-registry
  - id: micro-behaviors/os/autorun/control::netsh-helper-registration-references
  - id: micro-behaviors/os/registry/keys/execution::winsock-provider-catalog-path-reference
