defaults:
  platforms: [windows]
traits:
- crit: notable
  for:
  - scripts
  - pe
  - rust
  id: shell-association-command-path
  desc: Shell association command registry path
  conf: 0.95
  if:
    type: text
    regex: (?i)(ms-settings\\Shell\\Open|mscfile\\shell\\open|exefile\\shell\\runas)\\command

- id: mscfile-open-command-path
  desc: mscfile shell open-command registry path
  crit: notable
  conf: 0.99
  for: [pe, dll, c, cpp, csharp, powershell]
  if:
    type: text
    regex: '(?i)mscfile\\shell\\open\\command'
