defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:

  - id: appcert-dlls-registry-path
    desc: AppCert DLL registry value path
    if:
      type: text
      regex: '(?i)\\Control\\Session Manager\\AppCertDlls\b|\\AppCertDlls\b'

  - id: appcompatflags-layers-registry-key
    desc: AppCompatFlags Layers registry key path
    for: [powershell, pe, dll, csharp, batch, vbs]
    if:
      type: text
      regex: '(?i)SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\Layers'
  - id: print-monitor-registry-path-reference
    desc: Windows print monitor registry path reference
    if:
      type: text
      regex: '(?i)\\Control\\Print\\Monitors\\|\\Print\\Monitors\\[^\\\n]{1,80}\\Driver\b'
  - id: winsock-provider-catalog-path-reference
    desc: Winsock provider catalog registry path reference
    if:
      type: text
      regex: '(?i)\\WinSock2\\Parameters\\(Protocol_Catalog9|Namespace_Catalog5)\b'
  - id: providerpath-value-name
    desc: ProviderPath registry value name
    if:
      type: text
      word: ProviderPath
      case_insensitive: true
  - id: ifeo-key-reference
    desc: Image File Execution Options key reference
    for: [go, pe, powershell, batch, vbs, csharp, python]
    if:
      type: text
      regex: 'Image File Execution Options|\bIFEO\b'

