defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: ifeo-process-tool-write-api-profile
  desc: IFEO write APIs and process-tool names
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/registry/keys/execution::ifeo-debugger-write-api-evidence
  any:
  - id: micro-behaviors/process/info/name::taskmgr-process
  - id: micro-behaviors/process/debug/tool-markers::process-hacker-name-reference
  unless:
  - id: well-known/tool/detection/rkill::repair-tool-identity
