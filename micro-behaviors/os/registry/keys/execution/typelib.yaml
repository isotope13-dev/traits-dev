defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.95
traits:
  - id: typelib-registry-path
    desc: TypeLib registry key path
    crit: notable
    if:
      type: text
      # CLSID\{guid}\TypeLib redirects the typelib pointer under a CLSID; the
      # Classes\TypeLib\{guid}\... hive is the direct TypeLib registration
      # surface used by scriptlet hijacks (including TWINLOOT-style persist).
      regex: '(?i)(CLSID\\\{[0-9A-F-]{36}\}\\TypeLib|TypeLib\\\{[0-9A-F-]{36}\})'
    unless:
      - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
