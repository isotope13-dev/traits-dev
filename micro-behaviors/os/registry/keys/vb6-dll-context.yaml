# Dynamic DLL call and Run-key name without evidence of a registry write.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vb6-dll-runkey
  desc: VB6 DLL call near Run-key name
  attack: T1547.001
  all:
  - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
  - id: micro-behaviors/os/registry/keys::currentversion-run
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: notable
