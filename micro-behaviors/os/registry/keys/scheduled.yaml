# Windows Task Scheduler registry surfaces.  These are neutral observations;
# persistence intent is inferred by the objective composite that combines the
# path with a registry write whose data names an executable.
defaults:
  platforms: [windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.9
  attack: T1053.005

traits:
  - id: task-scheduler-registry-path
    desc: Windows Task Scheduler registry path
    crit: notable
    conf: 0.94
    for: [binaries, scripts, oledoc, batch, powershell, vbs, javascript, typescript, c, cpp, csharp, go, rust, python, java, ruby, php, perl, shell]
    if:
      type: text
      regex: '(?i)CurrentVersion\\+Schedule(\\|$|["''\s])'

  # Call form plus a terminated `.exe`.  The unanchored original matched
  # `thread.setValues(hook.execute(...))` in ordinary Java: `setValues` for
  # the method name and `.exe` from `.execute`.  Every sibling here already
  # required `\.exe\b`.
  - id: registry-setvalue-executable
    desc: SetValue writes executable path
    crit: notable
    conf: 0.9
    for: [binaries, scripts, oledoc, batch, powershell, vbs, javascript, typescript, c, cpp, csharp, go, rust, python, java, ruby, php, perl, shell]
    if:
      type: text
      regex: '(?i)SetValue\s*\([^\r\n]{0,180}\.exe\b'

  - id: registry-winapi-executable
    desc: WinAPI registry write stores an executable path
    crit: notable
    conf: 0.9
    for: [binaries, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)RegSetValueEx(A|W)?[^\r\n]{0,240}\.exe\b'

  - id: registry-powershell-executable
    desc: PowerShell writes executable registry value
    crit: notable
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)(Set-ItemProperty|New-ItemProperty)[^\r\n]{0,180}\.exe\b'

  - id: registry-cli-executable
    desc: reg.exe registry write stores an executable path
    crit: notable
    conf: 0.9
    for: [scripts, batch, powershell]
    if:
      type: text
      regex: '(?i)reg(\.exe)?\s+add[^\r\n]{0,180}\.exe\b'

  - id: registry-setstring-executable
    desc: SetStringValue writes executable path
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '(?i)SetStringValue\s*\([^\r\n]{0,180}\.exe\b'

  - id: registry-set-value-executable
    desc: set_value writes executable path
    crit: notable
    conf: 0.9
    for: [python, rust]
    if:
      type: text
      regex: '(?i)set_value\s*\([^\r\n]{0,180}\.exe\b'

composite_rules:
  - id: registry-executable-value-write
    desc: Registry write stores an executable path
    crit: notable
    conf: 0.92
    for: [binaries, scripts, oledoc, batch, powershell, vbs, javascript, typescript, c, cpp, csharp, go, rust, python, java, ruby, php, perl, shell]
    any:
      - id: registry-setvalue-executable
      - id: registry-winapi-executable
      - id: registry-powershell-executable
      - id: registry-cli-executable
      - id: registry-setstring-executable
      - id: registry-set-value-executable
