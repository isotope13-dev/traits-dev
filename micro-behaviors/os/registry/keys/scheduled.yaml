# Windows Task Scheduler registry surfaces.  These are neutral observations;
# persistence intent is inferred by the objective composite that combines the
# path with a registry write whose data names an executable.
defaults:
  platforms: [windows]
  for: [binaries, scripts]
  crit: notable
  conf: 0.9
  attack: T1053.005

traits:
  - id: task-scheduler-registry-path
    desc: Windows Task Scheduler registry path
    crit: notable
    conf: 0.94
    for: [binaries, scripts, oledoc, batch, powershell, vbs, javascript, typescript, c, cpp, csharp, go, rust, python, java, ruby, php, perl, shell]
    if:
      type: text
      regex: '(?i)CurrentVersion\\+Schedule(\\|$|["''\s])'

  # Call form plus a terminated `.exe`.  The unanchored original matched
  # `thread.setValues(hook.execute(...))` in ordinary Java: `setValues` for
  # the method name and `.exe` from `.execute`.  Every sibling here already
  # required `\.exe\b`.
