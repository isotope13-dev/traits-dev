defaults:
  platforms: [windows]
  for: [pe, dll, csharp, vbs, batch, powershell]
  conf: 0.85
traits:
- id: active-setup-key
  desc: Windows Active Setup registry key
  crit: notable
  if:
    type: text
    case_insensitive: true
    substr: Active Setup\Installed Components
  unless:
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: metadata/signed/platform::microsoft
    - id: metadata/signed/unknown::microsoft-code-signing-pca-2011
  downgrade:
    any:
      - id: metadata/binary/symbols/count::many-imports
