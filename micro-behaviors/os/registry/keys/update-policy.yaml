# Neutral observations and discriminating identities.
traits:
- id: windows-update-policy-registry-path
  desc: Windows Update machine-policy registry path
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?i)(HKLM\\+)?SOFTWARE\\+Policies\\+Microsoft\\+Windows\\+WindowsUpdate(\\+AU)?\b
- id: no-auto-update-policy-value
  desc: NoAutoUpdate registry policy value name
  crit: notable
  conf: 0.97
  if:
    type: text
    word: NoAutoUpdate
defaults:
  for:
  - binaries
  - scripts
  - c
  - cpp
  - csharp
  - go
  - rust
  platforms:
  - windows
