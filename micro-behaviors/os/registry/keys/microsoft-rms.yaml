# AD RMS clients record cluster discovery locations under this key. Referencing
# it is a registry capability; attacker intent is added only by recon composites.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.97
  attack: T1012

traits:
  - id: ad-rms-service-location-key
    desc: References AD RMS service-location registry key
    if:
      type: text
      regex: '(?i)SOFTWARE[\\/]+Microsoft[\\/]+MSIPC[\\/]+ServiceLocation\b'

  - id: ad-rms-enterprise-certification-value
    desc: References AD RMS certification location value
    if:
      type: text
      word: EnterpriseCertification

  - id: ad-rms-enterprise-publishing-value
    desc: References AD RMS publishing location value
    if:
      type: text
      word: EnterprisePublishing

composite_rules:
  - id: ad-rms-enterprise-location-values
    desc: References AD RMS enterprise location values
    all:
      - id: ad-rms-enterprise-certification-value
      - id: ad-rms-enterprise-publishing-value
    near_bytes: 240
