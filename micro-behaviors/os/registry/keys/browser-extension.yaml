# Chromium's *external extension* registry surface. Distinct from the
# enterprise `ExtensionInstallForcelist` policy in policies.yaml: this is the
# per-user/per-machine key a third-party installer writes so the browser picks
# up an extension it never fetched from the store. The key is a neutral
# platform surface -- Chrome documents it for OEM and application bundling --
# so intent comes from the objective composites that pair it with the payload
# location or with the other persistence surfaces.
defaults:
  platforms: [windows]
  for: [scripts, source, data, pe, dll, elf]
  crit: notable
  conf: 0.95
  attack: T1176,T1112

traits:
  - id: chromium-external-extensions-subkey
    desc: Chromium external extension registration key
    if:
      # Anchored on the `Software\...` registry prefix so this stays the
      # registry key and does not collide with the profile's on-disk
      # `Extensions` directory (which has its own atom under fs/path). The
      # generic intermediate segments take in the Wow6432Node and vendor
      # spellings (`Software\Wow6432Node\Google\Chrome\Extensions`,
      # `Software\Microsoft\Edge\Extensions`). The per-extension leaf is left
      # open: installers build it by appending an id variable at least as often
      # as they spell it out.
      type: text
      regex: '(?i)Software[/\\]+([A-Za-z0-9]+[/\\]+){0,2}(Chrome|Chromium|Edge)[/\\]+Extensions\b'
