defaults:
  platforms: [windows]
  for: [php]

traits:
  - id: php-winlogon-registry-path
    desc: PHP Winlogon registry path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon'
  - id: php-default-password-value
    desc: Winlogon DefaultPassword value-name reference
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      exact: DefaultPassword
composite_rules:
  - id: php-autologon-credential-query
    desc: Winlogon key and password-value references
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/keys::php-winlogon-registry-path
      - id: micro-behaviors/os/registry/keys::php-default-password-value
