defaults:
  platforms: [windows]
  for: [pe, oledoc, powershell, batch, csharp, python, go]
traits:
- id: hkcu-run-path-reference
  desc: References HKCU Run registry path
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: HKCU.{0,50}\\Run(\\|$|["'\s])
  unless:
  - id: well-known/tool/detection/malware-config-parser
