defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: user-environment-path-regpath
  desc: User Environment PATH registry target
  crit: notable
  conf: 0.96
  for: [python]
  if:
    type: text
    regex: 'HKEY_CURRENT_USER[\s\S]{0,500}["'']Environment["''][\s\S]{0,300}["'']PATH["'']'

- id: user-shell-folders-regpath
  desc: Explorer User Shell Folders registry path
  crit: baseline
  conf: 0.92
  if:
    type: text
    exact: SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
- id: explorer-shell-folders-desktop-value
  desc: References Explorer Shell Folders Desktop value
  crit: notable
  conf: 0.92
  for: [c, cpp]
  if:
    type: text
    regex: '(?is)Shell Folders.{0,512}(Common )?Desktop'
- id: lanmanserver-parameters-regpath
  desc: LanmanServer service Parameters registry path
  crit: baseline
  conf: 0.9
  if:
    type: text
    exact: SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
- id: safeboot-network-base-regpath
  desc: SafeBoot Network registry base path
  crit: notable
  conf: 0.98
  for: [pe, dll, csharp, powershell, batch]
  if:
    type: text
    exact: System\CurrentControlSet\Control\SafeBoot\Network

- id: putty-sessions-registry-path
  desc: PuTTY saved-session registry path
  crit: notable
  conf: 0.9
  for: [pe, dll, python, powershell, csharp]
  if:
    type: text
    substr: Software\SimonTatham\PuTTY\Sessions
