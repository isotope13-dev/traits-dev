defaults:
  platforms: [windows]
traits:
  - id: escaped-service-imagepath-registry-path
    desc: Escaped service ImagePath registry path
    crit: notable
    conf: 0.85
    for:
      - pe
      - dll
      - batch
      - powershell
    if:
      type: text
      regex: (?i)SYSTEM\\\\CurrentControlSet\\\\Services\\\\.{1,50}\\\\ImagePath
