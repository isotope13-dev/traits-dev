defaults:
  platforms: [windows]
traits:
  - id: lsa-package-registry-path
    desc: LSA authentication package registry
    crit: notable
    conf: 0.9
    for: [scripts, binaries, csharp, powershell, c, cpp, batch, vbs]
    attack: T1547.002
    if:
      type: text
      regex: '(?i)\\Control\\Lsa\\(Authentication Packages|Security Packages|Notification Packages)\b'
