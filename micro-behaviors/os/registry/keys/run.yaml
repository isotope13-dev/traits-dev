defaults:
  platforms: [windows]
  for: [binaries, scripts, oledoc, batch, powershell, vbs, javascript, typescript]

traits:
  # `oledoc` covers MSI/OLE installer databases, whose CustomAction and Registry
  # tables carry the Run-key path as a plain string.
  - id: currentversion-run
    desc: Accesses Windows CurrentVersion Run key
    crit: notable
    conf: 0.75
    for: [binaries, scripts, source, oledoc]
    if:
      type: text
      regex: '(?i)CurrentVersion\\+Run(\\|$|["''\s])'
    unless:
      - id: metadata/signed/platform::microsoft-corporation
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/signed/leaf::valve-corp.
  - id: currentversion-run-wide
    desc: UTF-16 Windows CurrentVersion Run key
    crit: notable
    conf: 0.86
    for: [pe, dll]
    if:
      type: encoded
      encoding: wide
      exact: 'Software\Microsoft\Windows\CurrentVersion\Run'
    unless:
      - id: metadata/signed/platform::microsoft-corporation
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/signed/leaf::valve-corp.

  - id: jvm-currentversion-run-bytes
    desc: JVM CurrentVersion Run key bytes
    crit: notable
    conf: 0.93
    for: [class, jar]
    if:
      type: hex
      pattern: 43 75 72 72 65 6E 74 56 65 72 73 69 6F 6E 5C 52 75 6E
    unless:
      - id: well-known/app/communication/thunderbird::librewolf-omni-runtime-path
      - type: basename
        exact: omni.ja

  - id: go-currentversion-run
    desc: Go CurrentVersion Run path
    crit: notable
    conf: 0.8
    for: [go]
    if:
      type: text
      regex: '(?i)CurrentVersion\\+Run'

  - id: run-value-name
    desc: Windows Run registry value name string
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '(?i)(currentversion\\+run|\\+runonce\b|\\+run\b)'
  - id: currentversion-run-perl-escaped
    desc: Escaped CurrentVersion Run path
    crit: notable
    conf: 0.85
    for: [perl]
    platforms: [windows, unix]
    if:
      type: text
      substr: 'Software\\Microsoft\\Windows\\CurrentVersion\\Run'
