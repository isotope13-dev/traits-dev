defaults:
  crit: notable
  platforms: [windows]
  for: [binaries, scripts, oledoc, batch, powershell, vbs, javascript, typescript]

traits:
  # `oledoc` covers MSI/OLE installer databases, whose CustomAction and Registry
  # tables carry the Run-key path as a plain string.
  - id: currentversion-run
    desc: References Windows CurrentVersion Run key
    conf: 0.75
    for: [binaries, scripts, source, oledoc, html, text]
    if:
      type: text
      regex: '(?i)CurrentVersion\\+Run(\\|$|["''\s])'
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/signed/leaf::valve-corp.
  - id: go-currentversion-run
    desc: Go CurrentVersion Run path
    conf: 0.8
    for: [go]
    if:
      type: text
      regex: '(?i)CurrentVersion\\+Run'

  # The bare `\run` alternative matched any Windows path whose last segment is
  # named run -- `path_to(r"...\_execute\run.py")` in an ordinary library read
  # as Run-key persistence. Anchor the short forms to the registry key they
  # belong to; `currentversion\run` already covers the full path.
  - id: windows-run-key-path
    for: [binaries, scripts, oledoc, text, reg, ne]
    desc: Windows Run or RunOnce registry key path
    conf: 0.6
    if:
      type: text
      regex: '(?i)currentversion\\+run(once)?\b|\bwindows\\+run(once)?\b'
  - id: currentversion-run-perl-escaped
    desc: Escaped CurrentVersion Run path
    conf: 0.85
    for: [perl]
    platforms: [windows, unix]
    if:
      type: text
      substr: 'Software\\Microsoft\\Windows\\CurrentVersion\\Run'
