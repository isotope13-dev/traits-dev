# Windows network configuration registry surfaces. These strings identify
# configuration fields; a registry API operation is required before an
# objective can infer modification or persistence.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: component
  conf: 0.84

traits:
  - id: tcpip6-parameters-key
    desc: Tcpip6 parameters registry path
    if:
      type: text
      exact: SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
    unless:
      - id: well-known/lib/runtime/v8::isolate-symbol

  - id: disabled-components-value
    desc: IPv6 DisabledComponents registry value
    if:
      type: text
      exact: DisabledComponents
