defaults:
  platforms: [windows]
  for: [html, vbs]
  crit: notable
  conf: 0.96
traits:
  - id: fragmented-ie-start-page
    desc: Start Page name allowing string fragments
    if:
      type: text
      case_insensitive: true
      regex: '\\S\W*t\W*a\W*r\W*t\W*P\W*a\W*g\W*e"'
  # The match runs into the next path segment so the per-user Quick Launch
  # folder (%APPDATA%\Microsoft\Internet Explorer\Quick Launch, where pinned
  # taskbar shortcuts live) is dropped: that is a filesystem path, not a key.
  - id: fragmented-internet-explorer-path
    desc: Internet Explorer key path, fragments allowed
    if:
      type: text
      case_insensitive: true
      regex: '\\I\W*n\W*t\W*e\W*r\W*n\W*e\W*t\W*E\W*x\W*p\W*l\W*o\W*r\W*e\W*r\\\W*\w+'
    not:
      - regex: '(?i)\\Quick$'
