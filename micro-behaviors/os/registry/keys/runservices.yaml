traits:
- id: runservices-key-path
  desc: RunServices registry key path reference
  crit: notable
  if:
    type: text
    regex: (?i)\\RunServices\b
  unless:
  - type: text
    exact: WMI Win32 Provider
    section: .rsrc
  platforms:
  - windows
  for:
  - python
  - javascript
  - vbs
  - powershell
  - pe
  - c
  - cpp
  conf: 0.7
