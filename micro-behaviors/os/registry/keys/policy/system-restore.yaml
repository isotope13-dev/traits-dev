defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: systemrestore-policy-key-reference
    desc: System Restore policy registry key reference
    conf: 0.98
    if:
      type: text
      substr: SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore
      case_insensitive: true
  # A key reference, not a write, disabling action or recovery attack.
  - id: systemrestore-currentversion-key-reference
    desc: System Restore CurrentVersion key reference
    conf: 0.92
    for: [html, text]
    if:
      type: text
      substr: CurrentVersion\SystemRestore
composite_rules:
  - id: systemrestore-disable-value-cooccurrence
    desc: System Restore key and DisableSR name co-occur
    crit: notable
    conf: 0.95
    for: [html, text]
    all:
      - id: systemrestore-currentversion-key-reference
      - id: micro-behaviors/os/registry/value-name::disablesr-source-value-reference
