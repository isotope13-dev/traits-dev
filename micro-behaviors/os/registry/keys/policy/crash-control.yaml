# The CrashControl path names OS dump/hibernation configuration; a reference
# alone establishes neither registry access nor modification (T1112).
defaults:
  platforms: [windows]
  for: [scripts, binaries, source]

traits:
  - id: crash-control-registry-path
    desc: References the Windows CrashControl key
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(CurrentControlSet|ControlSet\d{3})[\\/]+Control[\\/]+CrashControl\b'

