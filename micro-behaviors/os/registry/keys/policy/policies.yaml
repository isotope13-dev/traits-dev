defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, batch, powershell, vbs, javascript, csharp]
traits:
  - id: uac-policy-registry-path
    desc: Windows UAC policy registry path
    conf: 0.95
    for: [csharp, python]
    if:
      type: string_literal
      exact: HKEY_Local_Machine\\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\System

  - id: uac-policy-registry-path-python
    desc: Python Windows UAC policy path
    conf: 0.95
    for: [python]
    if:
      type: text
      substr: SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System

  - id: uac-enablelua-value
    desc: Windows UAC EnableLUA policy value name
    conf: 0.95
    for: [csharp, python]
    if:
      type: string_literal
      exact: EnableLUA

  - id: uac-enablelua-token
    desc: Windows UAC EnableLUA policy value name
    conf: 0.85
    for: [pe, dll, powershell, c, cpp]
    if:
      type: text
      word: EnableLUA
    unless:
      - id: well-known/lib/ui/
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
      - id: well-known/app/utility/rufus::rufus-official-context

  - id: uac-consent-prompt-value
    desc: Windows UAC consent prompt policy value name
    conf: 0.95
    for: [csharp, python]
    if:
      type: string_literal
      exact: ConsentPromptBehaviorAdmin

  - id: uac-installer-detection-value
    desc: Windows UAC installer detection value
    conf: 0.95
    for: [csharp, python]
    if:
      type: string_literal
      exact: EnableInstallerDetection

  - id: insecure-guest-auth-policy-value
    desc: Windows insecure guest authentication value
    conf: 0.95
    for: [csharp, python]
    if:
      type: string_literal
      exact: AllowInsecureGuestAuth

  - id: low-risk-file-types-policy-value
    desc: Windows LowRiskFileTypes policy value name
    conf: 0.95
    for: [csharp, python]
    if:
      type: literal
      exact: LowRiskFileTypes

  - id: disable-taskmgr
    desc: Disable Task Manager registry policy
    conf: 0.95
    if:
      type: text
      word: DisableTaskMgr
  - id: disable-cmd
    desc: Disable Command Prompt registry policy
    conf: 0.95
    if:
      type: text
      word: DisableCMD
  - id: disable-registry-tools
    for: [binaries, scripts, csharp, html, text]
    desc: Disable Registry Editor policy value name
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bDisableRegistryTools\b'
  # The enterprise policy that installs an extension without asking and blocks
  # the user from removing it. Legitimately written by management tooling, so
  # notable on its own -- but it is also how adware pins a hijacker extension,
  # and the old `for: [python]` restriction meant the native installers that
  # actually use it were never looked at.
  #
  # `substr`, not `exact`: the value name never stands alone, it is the tail of
  # the full `Software\Policies\Google\Chrome\...` key in both source and the
  # null-terminated run extracted from a binary.
  - id: chrome-extension-force-install-policy-key
    desc: Chrome force-install policy key reference
    conf: 0.9
    for: [pe, dll, batch, powershell, vbs, javascript, csharp, python]
    if:
      type: text
      substr: ExtensionInstallForcelist

  - id: chrome-extension-whitelist-policy-key
    desc: Chrome extension allowlist policy key reference
    conf: 0.9
    for: [pe, dll, batch, powershell, vbs, javascript, csharp, python]
    if:
      type: text
      substr: ExtensionInstallWhitelist

  - id: uac-consent-prompt-token
    desc: UAC ConsentPromptBehaviorAdmin value name
    conf: 0.95
    for: [pe, dll, c, cpp, go, rust, powershell, batch, vbs, javascript]
    if:
      type: text
      word: ConsentPromptBehaviorAdmin

  - id: uac-policies-system-key
    desc: Windows UAC Policies System key
    conf: 0.92
    for: [pe, dll, c, cpp, go, rust, powershell, batch, vbs, javascript]
    if:
      type: text
      regex: '(?i)SOFTWARE\\+Microsoft\\+Windows\\+CurrentVersion\\+Policies\\+System'

composite_rules:
  # These separate facts show only that the policy marker and registry-write
  # APIs co-occur; they do not establish that the code writes this policy.
  - id: chrome-force-install-policy-write-api-cooccurrence
    desc: Chrome force-install policy marker co-occurs with registry write APIs
    crit: notable
    conf: 0.9
    for: [pe, dll, batch, python, javascript, csharp, powershell, vbs]
    all:
      - id: chrome-extension-force-install-policy-key
    any:
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/os/registry/manipulate::registry-write-marker
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/os/registry/write::powershell-registry-property-write
