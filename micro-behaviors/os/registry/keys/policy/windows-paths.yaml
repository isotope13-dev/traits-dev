defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: safeboot-base-regpath
  desc: SafeBoot configuration registry path reference
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: SYSTEM\CurrentControlSet\Control\SafeBoot
    case_insensitive: true
- id: safeboot-network-base-regpath
  desc: SafeBoot Network registry base path
  crit: notable
  conf: 0.98
  for: [pe, dll, csharp, powershell, batch]
  if:
    type: text
    exact: System\CurrentControlSet\Control\SafeBoot\Network

- id: safeboot-service-subkey-reference
  desc: SafeBoot mode service subkey reference
  crit: notable
  conf: 0.96
  for: [pe, dll, scripts, source, data, text, msi, oledoc]
  if:
    type: text
    regex: '(?i)SafeBoot[\\/]+(Minimal|Network)[\\/]+[^''"\r\n]{3,80}'
- id: safeboot-mode-key-path
  desc: SafeBoot Minimal or Network key reference
  crit: notable
  conf: 0.9
  for: [binaries, scripts, c, cpp]
  if:
    type: text
    regex: '(?i)SafeBoot[\\/]+(Minimal|Network)\b'
