# Removing a value is deletion, independently of the security-sensitive target.
defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1112
traits:
  - id: powershell-delete-dump-filters
    desc: PowerShell deletes the dump-filter value
    crit: suspicious
    conf: 0.98
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)Remove-ItemProperty.{0,160}-Name\s+[''\"]?DumpFilters\b'

  - id: reg-delete-dump-filters
    desc: Reg.exe deletes the dump-filter value
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+delete\b.{0,180}/v\s+[''\"]?DumpFilters\b'

  - id: registry-api-delete-dump-filters
    desc: Registry API deletes the dump-filter value
    crit: suspicious
    conf: 0.97
    for: [binaries, source]
    if:
      type: text
      regex: '(?i)(DeleteValue|RegDeleteValue(Ex)?[AW]?).{0,100}[''\"]DumpFilters[''\"]'

