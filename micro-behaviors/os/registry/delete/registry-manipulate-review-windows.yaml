defaults:
  platforms:
  - windows
  for: [pe, c, cpp]
  attack: T1112
traits:
- id: reg-delete-value-w-symbol
  desc: RegDeleteValueW registry value deletion
  crit: notable
  conf: 0.88
  if:
    type: symbol
    exact: RegDeleteValueW
- id: reg-delete-key-value-w-symbol
  desc: RegDeleteKeyValueW registry value deletion
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: symbol
    exact: RegDeleteKeyValueW
- id: reg-delete-value-a-symbol
  desc: RegDeleteValueA API import
  crit: notable
  conf: 0.88
  if:
    type: symbol
    exact: RegDeleteValueA
- id: sh-delete-key-a
  desc: Recursively delete registry key tree
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: symbol
    exact: "SHDeleteKeyA"
- id: reg-delete-key-a-symbol
  desc: Delete registry key via import
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: symbol
    exact: RegDeleteKeyA
composite_rules:
- id: registry-delete-key-or-value-api
  desc: Registry key or value deletion API
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/delete::reg-delete-key-a-symbol
  - id: micro-behaviors/os/registry/delete::reg-delete-value-w-symbol
  - id: micro-behaviors/os/registry/delete::reg-delete-value-a-symbol
  - id: micro-behaviors/os/registry/delete::sh-delete-key-a
  - id: micro-behaviors/os/registry/delete::sh-delete-key-w
