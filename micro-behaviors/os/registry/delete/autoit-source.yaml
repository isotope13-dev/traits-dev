# AutoIt is currently exposed as unparsed text; require call syntax.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.95
traits:
  - id: autoit-registry-delete-call
    desc: AutoIt RegDelete call with registry path
    if:
      type: raw
      regex: '(?i)\bRegDelete\s*\(\s*"HK'
