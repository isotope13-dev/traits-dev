# RegDelete of a named value under the machine or user Run key: that program
# no longer starts at logon.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1112

traits:
  - id: wsh-regdelete-run-value
    desc: Script deletes a Run key autostart value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)RegDelete\s*\(?\s*"HK[^"]{0,70}\\CurrentVersion\\Run\\[^"\\]{1,60}"'
