defaults:
  platforms: [windows]
traits:
  # Competitor-removal: wiping the shared Browser Helper Objects key kills
  # other residents that hook the browser. Legitimate uninstallers remove
  # their own CLSID subkey, never the whole shared key with /f.
  - id: bho-delete-command
    desc: reg deletes Browser Helper Objects
    crit: notable
    conf: 0.9
    for: [pe, batch]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+delete\b[^\n]{0,80}Browser Helper Objects'
