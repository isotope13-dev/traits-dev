traits:
- id: winreg-delete-value
  desc: Deletes a Windows registry value
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    regex: (^|\.)winreg\.DeleteValue$
- id: winreg-delete-key
  desc: Deletes a Windows registry key
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    regex: (^|\.)winreg\.DeleteKey$
defaults:
  for:
  - python
  platforms:
  - windows
