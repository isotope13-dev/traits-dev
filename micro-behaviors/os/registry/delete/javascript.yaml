defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-regdelete-method-call
    desc: JavaScript RegDelete method call
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [
            (member_expression property: (property_identifier) @method)
            (subscript_expression index: (string (string_fragment) @method))
          ]
          arguments: (arguments . (_))) @call
          (#eq? @method "RegDelete"))
