defaults:
  platforms: [windows]
  crit: notable
  conf: 0.9
  attack: T1112

traits:
  - id: sh-delete-key-w
    desc: Recursively delete registry key tree (wide)
    for: [pe]
    if:
      type: symbol
      exact: SHDeleteKeyW
  - id: sh-delete-value-w
    desc: Unicode registry value deletion API reference
    for: [pe, dll, c, cpp, csharp, python, go, rust]
    if:
      type: symbol
      exact: SHDeleteValueW
