defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: delete-subkey-tree-member-name
    desc: DeleteSubKeyTree member-name reference
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: DeleteSubKeyTree
      section: .text

composite_rules:
  - id: managed-registry-subtree-delete-references
    desc: Managed RegistryKey and DeleteSubKeyTree references
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/registry/access::dotnet-registry-key-type
      - id: delete-subkey-tree-member-name
