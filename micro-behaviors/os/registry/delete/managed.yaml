defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: delete-subkey-tree-member-name
    desc: DeleteSubKeyTree member-name reference
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: DeleteSubKeyTree
      section: .text

composite_rules:
  # A bare method name also occurs in Go reflection tables. Managed and
  # RegistryKey context support an API-reference cluster, not a bound call.
  - id: managed-registry-delete-value-references
    desc: Managed RegistryKey and DeleteValue references
    crit: notable
    conf: 0.95
    for: [pe]
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/symbols/name/registry/key::dotnet-registry-key-type
      - id: metadata/binary/symbols/name/token/filesystem::delete-value-member-name

  - id: managed-registry-subtree-delete-references
    desc: Managed RegistryKey and DeleteSubKeyTree references
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/symbols/name/registry/key::dotnet-registry-key-type
      - id: delete-subkey-tree-member-name
