# WScript registry deletion is a neutral script capability.  Impact or
# persistence intent is inferred only when combined with stronger evidence.
#
# Text matchers, not parsed literals: cleave extracts no literal or symbol
# facts from VBScript, so a `type: literal` condition here never ran.  The
# leading `\.` keeps each match to a method call rather than a bare mention.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.9
  attack: T1112
  mbc: E1563

traits:
  - id: wscript-regdelete
    desc: WScript RegDelete registry removal
    if:
      type: text
      regex: '\.\s*RegDelete\b'

  - id: com-registry-deletekey
    desc: Deletes a registry key via COM DeleteKey
    conf: 0.9
    for: [vbs, powershell, javascript, csharp]
    if:
      type: text
      # DeleteKey may use VBScript's no-parentheses call form; retain the hive
      # proximity requirement in the text matcher.
      regex: '(?i)\.\s*DeleteKey.{0,24}(HK|&H8)'

  - id: js-reg-delete-command
    desc: Deletes registry entry via reg command
    platforms: [unix, windows]
    for: [javascript, typescript]
    conf: 0.85
    if:
      type: text
      regex: '(?i)["''`]reg(\.exe)?\b[\s\S]{0,100}\bdelete\b'

  # Legs of the user-environment credential delete below: a reg.exe delete
  # whose target key is HKCU\Environment (the persisted per-user environment)
  # and whose value name is a credential variable. Uninstallers delete their
  # own tool's variables, so this stays a capability; the AI-credential
  # target and hijack context are supplied by consumers.
  - id: reg-delete-command-shape
    desc: reg command line with a delete verb
    crit: component
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\breg(\.exe)?["'']?\s*[,;]?[\s\S]{0,120}\bdelete\b'
  - id: user-env-credential-value-name
    desc: Credential value named near Environment key
    crit: component
    for: [javascript, typescript, powershell, batch]
    if:
      type: text
      regex: '\bEnvironment\b[\s\S]{0,120}(API_KEY|AUTH_TOKEN|ACCESS_TOKEN|_SECRET|_TOKEN)'

composite_rules:
  - id: reg-delete-user-env-credential
    desc: reg.exe deletes a user-environment credential
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: reg-delete-command-shape
      - id: user-env-credential-value-name
    near_bytes: 300
