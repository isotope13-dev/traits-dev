defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: session-manager-rename-registry-api-profile
  desc: Registry write APIs with Session Manager rename references
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  any:
  - id: micro-behaviors/os/registry/session-manager/reference::pending-file-rename-ops
  - id: micro-behaviors/os/registry/value-name::pending-file-rename-value-name
  - id: micro-behaviors/os/registry/session-manager/reference::file-rename-ops
  - id: micro-behaviors/os/registry/session-manager/reference::session-manager-key
  needs: 2
