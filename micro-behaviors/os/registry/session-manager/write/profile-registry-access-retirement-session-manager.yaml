defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: unsigned-microsoft-session-rename-api-profile
  desc: Unsigned Microsoft-version PE with rename registry APIs
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/session-manager/write::session-manager-rename-registry-api-profile
  - id: metadata/signature/absent::unsigned-pe-microsoft-version-fields
  unless:
  - id: metadata/signature/verified/platform::microsoft
  - id: metadata/installer/product/
  # The INF setup engine (advpack.dll) queues PendingFileRenameOperations by
  # design; installers redistribute it unsigned.
  - id: micro-behaviors/os/package-manager/install::advpack-setup-entry-exports
- id: google-truncated-cert-session-rename-api-profile
  desc: Google-version truncated-cert PE with rename registry APIs
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/session-manager/write::session-manager-rename-registry-api-profile
  - id: metadata/vendor/identity::google-corp-versioninfo
  - id: metadata/binary/layout/checksum::cert-table-truncated
  unless:
  - id: metadata/signature/verified/platform::microsoft
  - id: metadata/installer/product/
