# Opening another machine's registry: the Remote Registry service surface
# (winreg over RPC). Neutral capability — fleet administration, deployment
# and inventory tooling all read \\host\HKLM. Credential-access intent is
# expressed by rules under objectives/credential-access/registry/.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable

traits:
  - id: open-remote-registry-base-key
    desc: .NET opens remote registry base key
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bOpenRemoteBaseKey\s*\('

  - id: winreg-connect-registry-call
    desc: Python winreg.ConnectRegistry call
    conf: 0.92
    if:
      type: text
      regex: '\bwinreg\.ConnectRegistry\s*\('

  - id: reg-cli-unc-host-operation
    desc: reg.exe targets a remote host registry
    conf: 0.9
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+(query|save|load|add|export)\s+\\\\[A-Za-z0-9_.-]{1,60}\\HK'

  - id: remote-registry-service-start
    desc: Starts the Remote Registry service
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(sc(\.exe)?\s+(config|start)\s+RemoteRegistry|net\s+start\s+RemoteRegistry)'

composite_rules:
  - id: remote-registry-session
    desc: Opens a remote machine's registry
    crit: notable
    conf: 0.93
    any:
      - id: open-remote-registry-base-key
      - id: winreg-connect-registry-call
      - id: reg-cli-unc-host-operation

  # Preserve the former remote-registry-hive-credential-read observation at
  # its actual evidentiary level. A remote-registry operation near a hive/path
  # reference does not establish a read from that path, much less credentials:
  # Control\Lsa\FipsAlgorithmPolicy is an ordinary administration target.
  - id: remote-registry-hive-references
    desc: Remote registry and sensitive-key references
    conf: 0.96
    all:
      - id: remote-registry-session
    any:
      - id: micro-behaviors/os/registry/hive::hklm-sam-security-hive
      - id: micro-behaviors/os/registry/hive::sam-security-hive-subkey
      - id: micro-behaviors/os/registry/keys/policy::lsa-control-key-path
    near_lines: 40
