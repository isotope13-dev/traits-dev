defaults:
  crit: suspicious
  platforms: [windows]
  for: [vbs]
composite_rules:
  - id: script-registry-operations
    desc: Script references multiple registry operations
    crit: notable
    conf: 0.8
    attack: T1012
    mbc: E1563
    needs: 2
    any:
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
      - id: micro-behaviors/os/registry/read::wscript-regread
      - id: micro-behaviors/os/registry/delete::wscript-regdelete
