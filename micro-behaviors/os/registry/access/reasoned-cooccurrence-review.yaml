# References and API co-occurrence do not establish bound data flow.
defaults:
  platforms:
  - windows
composite_rules:
- for:
  - pe
  id: system-autorun-write-api-cooccurrence
  desc: System autorun references beside registry-write APIs
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  unless:
  - id: micro-behaviors/os/registry/access::native-system-registry-product-context
  - id: metadata/signed/certificate/signature::digest-verified-signing-context
  - id: well-known/app/utility/
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/unwanted/desktopmania::autonavigator-desktopmania-registry-key
  any:
  - id: micro-behaviors/os/registry/keys/autostart::appinit-registry-values
  - id: micro-behaviors/os/registry/keys/policy::lsa-package-registry-path
  - id: micro-behaviors/os/registry/keys/credential::lsa-package-list-value-name
  - id: micro-behaviors/os/registry/keys/execution::print-monitor-registry-path-reference
  - id: micro-behaviors/os/registry/keys/execution::print-processor-registry-path-reference
  - id: micro-behaviors/os/registry/keys/service::time-provider-registry
  - id: micro-behaviors/os/autorun/control::netsh-helper-registration-references
  - id: micro-behaviors/os/registry/keys/execution::winsock-provider-catalog-path-reference
  - id: micro-behaviors/os/registry/keys/autostart::screensaver-registry-values
  - id: micro-behaviors/os/registry/keys/execution::silentprocessexit-registry-surface
- for:
  - scripts
  - binaries
  id: native-system-registry-product-context
  desc: Known system and diagnostic registry implementations
  crit: exception
  conf: 0.99
  any:
  - id: well-known/tool/reverse-engineering/dynamorio::balloon-memory-test-utility
  - id: well-known/app/system/reactos::system-component
  - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
