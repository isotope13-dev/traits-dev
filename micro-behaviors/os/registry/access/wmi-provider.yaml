# StdRegProv is the WMI class that exposes the registry to scripts.  Binding
# it (`GetObject("winmgmts:\\.\root\default:StdRegProv")`, or the PowerShell /
# .NET equivalents) is the non-WScript.Shell route to registry access, and the
# only one that works against a remote machine.  Installer and servicing
# scripts use it, and so does WMI-capable script malware; the binding itself is
# neutral, the EnumKey/SetValue/DeleteKey operation carries the intent.
defaults:
  platforms: [windows]
  for: [vbs, powershell, javascript, csharp]
  crit: notable
  conf: 0.92
  attack: T1012
  mbc: E1563

traits:
  - id: wmi-stdregprov-binding
    desc: Binds the WMI StdRegProv registry provider
    if:
      type: text
      word: StdRegProv
      case_insensitive: true
