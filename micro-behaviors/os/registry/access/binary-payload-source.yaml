# A registry REG_BINARY write is a neutral storage capability.  Payload intent
# is asserted only when this capability is combined with execution primitives.
defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  attack: T1112

traits:
  - id: registry-set-value-source
    desc: Registry value setter in source
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bRegSetValueEx[AW]?\s*\('

  - id: registry-managed-set-value-source
    desc: Managed registry setter in source
    conf: 0.9
    # Bare SetValue is also reflection, configuration, and UI state mutation.
    # Require an explicit .NET registry type at the call site.
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)\b(Microsoft\.Win32\.)?Registry(Key)?\s*(\.|::)\s*SetValue\s*\('

  # One matcher, one trait: this was split in two by `for:` under the reasoning
  # that the halves covered different file types, but splitting by file type is
  # what `for:` already expresses -- the split is the duplication it was meant
  # to avoid. Renamed off "-source" since it now covers batch and pe too.
  - id: registry-binary-value-type
    desc: REG_BINARY value type name
    conf: 0.88
    for: [c, cpp, powershell, batch, pe]
    if:
      type: text
      word: REG_BINARY

  - id: registry-binary-kind-source
    desc: Binary registry kind in source
    conf: 0.88
    for: [csharp, go, rust, python, powershell]
    if:
      type: text
      regex: '(?i)RegistryValueKind\.Binary'

composite_rules:
  - id: native-registry-binary-write
    desc: Native binary registry write
    conf: 0.95
    all:
      - id: registry-set-value-source
      - id: registry-binary-value-type
    near_lines: 12

  - id: managed-registry-binary-write
    desc: Managed binary registry write
    conf: 0.95
    all:
      - id: registry-managed-set-value-source
      - id: registry-binary-kind-source
    near_lines: 12

  - id: registry-binary-value-write-source
    desc: Binary registry value write in source
    conf: 0.95
    any:
      - id: native-registry-binary-write
      - id: managed-registry-binary-write
