defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: session-manager-rename-registry-api-profile
  desc: Registry write APIs with Session Manager rename references
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  any:
  - id: micro-behaviors/os/registry/keys/path::pending-file-rename-ops
  - id: micro-behaviors/os/registry/value-name::pending-file-rename-value-name
  - id: micro-behaviors/os/registry/keys/path::file-rename-ops
  - id: micro-behaviors/os/registry/keys/path::session-manager-key
  needs: 2
  unless:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/sfx::wextract-tool
  - id: metadata/signed/platform::adobe-inc-digicert-issued-chain
- id: bootexecute-registry-api-profile
  desc: Registry write APIs and BootExecute reference
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/registry/value-name::bootexecute-value-reference
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  unless:
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-tool
  - id: metadata/signed/certificate/subject::glarysoft-ltd
  - id: metadata/binary/installer/sfx::wextract-tool
  - id: well-known/app/system/iobit::advanced-systemcare-component-context
  downgrade:
    any:
    - id: metadata/signed/platform::microsoft
    - id: metadata/binary/installer/family/
- id: unsigned-microsoft-session-rename-api-profile
  desc: Unsigned Microsoft-version PE with rename registry APIs
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/access::session-manager-rename-registry-api-profile
  - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
  unless:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/installer/family/
- id: google-truncated-cert-session-rename-api-profile
  desc: Google-version truncated-cert PE with rename registry APIs
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/access::session-manager-rename-registry-api-profile
  - id: metadata/binary/vendor::google-corp-versioninfo
  - id: metadata/binary/layout/checksum::cert-table-truncated
  unless:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/installer/family/
