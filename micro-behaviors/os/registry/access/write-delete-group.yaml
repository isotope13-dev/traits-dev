# Preserve the PE consumer's former write-directory members during relocation.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:

  - id: registry-write-or-dumpfilter-delete
    desc: Registry write/delete capability references
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/os/registry/value/write/
      - id: micro-behaviors/os/registry/autostart/write/
      - id: micro-behaviors/os/registry/policy/write/
