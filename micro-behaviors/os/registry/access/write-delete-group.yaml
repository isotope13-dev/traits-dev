# Preserve the PE consumer's former write-directory members during relocation.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:

  - id: registry-write-or-dumpfilter-delete
    desc: Registry write/delete capability references
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/os/registry/write/
      - id: micro-behaviors/os/registry/explorer::batch-reg-add-explorer-policy-path
      - id: micro-behaviors/os/registry/explorer::explorer-folder-options-write-context
      - id: micro-behaviors/os/registry/policy-write::taskmgr-policy-write-api-cooccurrence
      - id: micro-behaviors/os/registry/policy-write::cmd-policy-write-api-cooccurrence
      - id: micro-behaviors/os/registry/delete::reg-delete-dump-filters
      - id: micro-behaviors/os/registry/delete::registry-api-delete-dump-filters
