# Windows registry access in native source. The paths are host-profile
# targets; the composite below keeps either path alone from becoming a verdict.
defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp]

traits:
  - id: source-registry-open-key-api
    desc: Native source opens a registry key
    conf: 0.9
    if:
      type: text
      regex: '\bRegOpenKeyEx[AW]?\s*\('

  - id: source-registry-query-value-api
    desc: Native source queries a Windows registry value
    conf: 0.9
    if:
      type: text
      regex: '\bRegQueryValueEx[AW]?\s*\('

  - id: source-registry-enumerate-keys-api
    desc: Native source enumerates registry keys
    conf: 0.9
    if:
      type: text
      regex: '\bRegEnumKeyEx[AW]?\s*\('

  - id: source-cpu-profile-registry-path
    desc: CPU profile registry path in source
    conf: 0.9
    if:
      type: text
      substr: HARDWARE\DESCRIPTION\System\CentralProcessor\0

  - id: reg-set-value-ex-source
    desc: RegSetValueEx registry write API
    conf: 0.88
    attack: T1112
    if:
      type: symbol
      exact: "RegSetValueExA"
    unless:
      - type: text
        substr: 'CurrentVersion\\Uninstall'

  - id: reg-open-key-ex-source
    desc: RegOpenKeyEx registry access API
    conf: 0.88
    if:
      type: symbol
      exact: "RegOpenKeyExA"
    unless:
      - type: text
        substr: 'CurrentVersion\\Uninstall'

  - id: reg-notify-change-key-value-source
    desc: RegNotifyChangeKeyValue registry watch API
    conf: 0.88
    if:
      type: symbol
      exact: "RegNotifyChangeKeyValueA"

composite_rules:
  - id: source-host-profile-registry-query
    attack: T1012,T1082
    desc: Native source reads CPU and installed-software registry inventory
    conf: 0.96
    all:
      - id: source-registry-open-key-api
      - id: source-registry-query-value-api
      - id: source-cpu-profile-registry-path
      - id: micro-behaviors/os/registry/access::windows-uninstall-key-path
