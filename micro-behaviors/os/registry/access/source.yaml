# Windows registry reads in native source. The paths are host-profile
# targets; the composite below keeps either path alone from becoming a verdict.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1012,T1082

traits:
  - id: source-registry-open-read-api
    desc: Native source opens registry for read
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bRegOpenKeyEx[AW]?\s*\('

  - id: source-registry-query-value-api
    desc: Native source queries a Windows registry value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bRegQueryValueEx[AW]?\s*\('

  - id: source-cpu-profile-registry-path
    desc: CPU profile registry path in source
    crit: component
    conf: 0.9
    if:
      type: text
      substr: HARDWARE\DESCRIPTION\System\CentralProcessor\0

  - id: source-installed-software-registry-path
    desc: Installed-software registry path in source
    crit: component
    conf: 0.9
    if:
      type: text
      substr: SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall

composite_rules:
  - id: source-host-profile-registry-query
    desc: Native source reads CPU and installed-software registry inventory
    crit: notable
    conf: 0.96
    all:
      - id: source-registry-open-read-api
      - id: source-registry-query-value-api
      - id: source-cpu-profile-registry-path
      - id: source-installed-software-registry-path
