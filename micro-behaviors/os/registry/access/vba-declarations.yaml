defaults:
  platforms: [windows]
  for: [oledoc, ooxml, vbs]
  crit: notable
  conf: 0.94
traits:
  - id: vba-declare-regcreatekeyex
    desc: VBA Declare imports RegCreateKeyEx
    crit: notable
    conf: 0.94
    if:
      type: import
      regex: '^RegCreateKeyEx[AW]?$'

  - id: vba-declare-regopenkeyex
    desc: VBA Declare imports RegOpenKeyEx
    crit: notable
    conf: 0.94
    if:
      type: import
      regex: '^RegOpenKeyEx[AW]?$'

  - id: vba-regopenkeyex-call
    desc: Calls RegOpenKeyEx from VBA source
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bRegOpenKeyEx[AW]?\s*\('
