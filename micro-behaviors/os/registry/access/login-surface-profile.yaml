defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: unsigned-explorer-run-winlogon-api-profile
  desc: Explorer Run and Winlogon paths with registry-open/create APIs
  crit: notable
  conf: 0.98
  all:
  - id: "micro-behaviors/os/registry/keys/autostart::policies-explorer-run-key-path"
  - id: "micro-behaviors/os/registry/keys/autostart::winlogon-registry-path"
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/os/registry/manipulate::reg-create-key-ex-a
  - id: micro-behaviors/os/registry/access::registry-open-key-api
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
