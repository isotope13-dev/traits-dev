defaults:
  crit: component
  conf: 0.88
  platforms: [windows]
  for: [pe, dll, csharp]

traits:
  - id: dotnet-classes-root-hive
    desc: .NET ClassesRoot hive member
    if:
      type: text
      exact: ClassesRoot
  - id: dotnet-current-user-hive
    desc: .NET CurrentUser hive member
    if:
      type: text
      exact: CurrentUser
  - id: dotnet-local-machine-hive
    desc: .NET LocalMachine hive member
    if:
      type: text
      exact: LocalMachine
  - id: dotnet-users-hive
    desc: .NET Users hive member
    if:
      type: text
      exact: Users
  - id: dotnet-current-config-hive
    desc: .NET CurrentConfig hive member
    if:
      type: text
      exact: CurrentConfig

composite_rules:
  - id: dotnet-multiple-registry-hives
    desc: .NET accesses multiple registry hives
    crit: notable
    conf: 0.95
    any:
      - id: dotnet-classes-root-hive
      - id: dotnet-current-user-hive
      - id: dotnet-local-machine-hive
      - id: dotnet-users-hive
      - id: dotnet-current-config-hive
    needs: 4
