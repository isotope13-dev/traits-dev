defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-winreg-import
    desc: Python winreg import
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '(import|from)\s+(winreg|_winreg)\b'
  - id: winreg-openkey
    desc: Opens a Windows registry key
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '(^|\.)winreg\.OpenKey(Ex)?$'
  - id: python-bytecode-winreg-value-write
    desc: Python bytecode winreg value-write name
    crit: notable
    conf: 0.94
    for: [pyc]
    if:
      type: text
      regex: '\bSetValue(Ex)?\b'

composite_rules:
  - id: python-reg-run-access
    desc: Python Windows registry Run key access
    crit: notable
    conf: 0.95
    mbc: F0006
    all:
      - id: python-winreg-import
      - id: micro-behaviors/os/registry/keys::currentversion-run
