defaults:
  for: [batch, vbs, powershell, pe, python, rust]
  platforms: [windows]
traits:
  - id: powershell-windir-property-access
    desc: Accesses the windir property through a cmdlet
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(Get|Set|New)-ItemProperty.{0,100}-Name\s+["\x27]?windir\b'
composite_rules:
  - id: user-windir-property-reference
    desc: Accesses the per-user windir property
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/keys::user-environment-registry-key
      - id: powershell-windir-property-access
    near_bytes: 180
