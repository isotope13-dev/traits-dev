defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.98
  attack: T1112

traits:
  - id: python-user-environment-create
    desc: Creates the user Environment registry key
    if:
      # Python call facts do not retain HKEY_CURRENT_USER as an argument value.
      type: tree-sitter
      kind: call
      regex: 'CreateKey(Ex)?\(\w+\.HKEY_CURRENT_USER,\s*[rR]?.Environment.'
  - id: python-user-folder-command-create
    desc: Creates the user Folder command key
    if:
      # Bind the hive and path to the creation call, without claiming a write.
      type: tree-sitter
      kind: call
      regex: 'CreateKey\(\w+\.HKEY_CURRENT_USER,\s*r?.Software\\Classes\\Folder\\shell\\open\\command.'
