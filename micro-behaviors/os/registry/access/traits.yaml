defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: reg-enum-key-ex-a-symbol
  desc: Enumerate registry subkeys via import
  crit: notable
  conf: 0.88
  attack: T1112
  if:
    type: symbol
    exact: RegEnumKeyExA
- id: reg-create-key-ex-w
  desc: Registry key creation API reference
  crit: notable
  conf: 0.92
  for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  - go
  - rust
  attack: T1112
  if:
    type: symbol
    exact: RegCreateKeyExW

- id: reg-create-key-a
  desc: Create registry key via WinAPI
  crit: notable
  conf: 0.85
  attack: T1112
  if:
    type: text
    regex: ^RegCreateKey[AW]$
- id: reg-set-value-ex-text
  desc: Set registry value API name in text
  crit: notable
  conf: 0.9
  attack: T1112
  if:
    type: text
    substr: RegSetValueEx
  unless:
  - id: metadata/lang/compiler/systems::go-binary-comp
- id: reg-set-key-value
  desc: Sets a registry value with RegSetKeyValue
  crit: notable
  conf: 0.85
  attack: T1112
  for:
  - pe
  - dll
  - c
  - cpp
  if:
    type: symbol
    regex: ^RegSetKeyValue[AW]$
- id: reg-notify-change-key-value
  desc: Monitor registry key changes
  crit: notable
  conf: 0.85
  attack: T1112
  if:
    type: symbol
    exact: RegNotifyChangeKeyValue
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
- id: reg-set-key-security
  desc: Modify registry key security
  crit: notable
  conf: 0.9
  attack: T1112
  if:
    type: symbol
    exact: RegSetKeySecurity
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
- id: reg-create-key-transacted-name
  desc: Transacted registry create API lookup
  crit: notable
  conf: 0.9
  attack: T1112
  if:
    type: text
    exact: RegCreateKeyTransactedW
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
- id: reg-open-key-transacted-name
  desc: Transacted registry open API lookup
  crit: notable
  conf: 0.9
  attack: T1112
  if:
    type: text
    exact: RegOpenKeyTransactedW
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
- id: reg-delete-key-transacted-name
  desc: Transacted registry delete API lookup
  crit: notable
  conf: 0.9
  attack: T1112
  if:
    type: text
    exact: RegDeleteKeyTransactedW
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
- id: legacy-netscape-marker
  desc: Legacy Netscape browser marker
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(Netscape Navigator|Netscape Communicator)
    section: .text
composite_rules:
- id: registry-query-value-api
  desc: Registry value query API
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/registry/read::reg-query-value-ex-a-symbol
  - id: micro-behaviors/os/registry/read::reg-query-value-ex-w-symbol
- id: registry-read-api-chain
  desc: Registry open/query API references coexist
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/open::registry-open-key-api
  - id: micro-behaviors/os/registry/access::registry-query-value-api
- id: registry-enumeration-api-chain
  desc: Registry key enumeration API chain
  crit: notable
  conf: 0.9
  attack: T1112
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
  all:
  - id: micro-behaviors/os/registry/open::registry-open-key-api
  any:
  - id: micro-behaviors/os/registry/read::reg-query-info-key-a-symbol
  - id: micro-behaviors/os/registry/read::reg-enum-value-a-symbol
  - id: micro-behaviors/os/registry/access::reg-enum-key-ex-a-symbol
  needs: 2
- id: registry-create-key-api
  desc: Registry key creation API
  crit: notable
  conf: 0.9
  attack: T1112
  any:
  - id: micro-behaviors/os/registry/manipulate::reg-create-key-ex-a
  - id: micro-behaviors/os/registry/access::reg-create-key-ex-w
  - id: micro-behaviors/os/registry/access::reg-create-key-a
- id: registry-set-value-api
  desc: Registry value write API
  crit: notable
  conf: 0.9
  attack: T1112
  for:
  - pe
  - dll
  - c
  - cpp
  any:
  - id: metadata/binary/symbols/name/registry/write::reg-set-value-ex-a
  - id: metadata/binary/symbols/name/registry/write::reg-set-value-ex-w
  - id: micro-behaviors/os/registry/access::reg-set-key-value
  - id: micro-behaviors/os/registry/access::reg-set-value-ex-text
- id: registry-write-api-chain
  desc: Registry open/create and value-write API references
  crit: notable
  conf: 0.9
  attack: T1112
  all:
  - id: micro-behaviors/os/registry/access::registry-set-value-api
  any:
  - id: micro-behaviors/os/registry/access::registry-create-key-api
  - id: micro-behaviors/os/registry/open::registry-open-key-api
- id: registry-transacted-api-name-chain
  desc: References the transacted registry API name fallback chain
  crit: notable
  conf: 0.9
  attack: T1112
  unless:
  - id: metadata/binary/symbols/count::many-exports-100
  all:
  - id: micro-behaviors/os/registry/access::reg-open-key-transacted-name
  - id: micro-behaviors/os/registry/access::reg-create-key-transacted-name
  - id: micro-behaviors/os/registry/access::reg-delete-key-transacted-name
