defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: xor-run-key-registration-api-pair
    desc: XOR Run-key and registration API references
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule xor_run_key_registration_api_pair {
          strings:
            $run = "Software\\Microsoft\\Windows\\CurrentVersion\\Run" xor(1-255)
            $create = "RegCreateKeyExW" xor(1-255)
            $set = "RegSetValueExW" xor(1-255)
          condition:
            all of them and
            for any s in pe.sections : (
              s.characteristics & 0x20000000 == 0 and
              for all of them : (
                $ in (s.raw_data_offset..s.raw_data_offset + s.raw_data_size)
              )
            )
        }
