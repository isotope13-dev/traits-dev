defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, rust, go, csharp]
  attack: "T1112"

traits:
  - id: set-value-notification
    desc: Handle registry value-set callback notification
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bRegNt(Pre|Post)SetValueKey\b'
    unless:
      - id: metadata/library/generated::winmd-metadata
  - id: set-value-information
    desc: Inspect registry value callback payload
    crit: notable
    conf: 0.96
    if:
      type: text
      word: REG_SET_VALUE_KEY_INFORMATION
  # A filter that intercepts the enumeration classes is positioned to change
  # what a caller sees listed, rather than to audit or block a write. Registry
  # filters in endpoint products do use these classes, so this stays neutral.
  - id: enumeration-notification
    desc: Handle registry enumeration notification
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bRegNtPre(Enumerate(Key|ValueKey)|QueryMultipleValueKey)\b'
    unless:
      - id: metadata/library/generated::winmd-metadata
