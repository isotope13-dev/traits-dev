defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
- id: providerpath-value-name
  desc: ProviderPath registry value name
  if:
    type: text
    # Preserve binary strings, quoted names and CLI value-name operands.
    regex: '(?i)(^ProviderPath$|["'']ProviderPath["'']|(-Name|/v)\s+ProviderPath\b)'
