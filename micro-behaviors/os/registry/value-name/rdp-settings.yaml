defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
  crit: notable
traits:
  - id: rdp-deny-connections-value
    desc: RDP fDenyTSConnections value-name reference
    conf: 0.99
    if:
      type: text
      exact: fDenyTSConnections
  - id: rdp-concurrent-sessions-value
    desc: EnableConcurrentSessions registry value name
    conf: 0.99
    if:
      type: text
      exact: EnableConcurrentSessions
  - id: rdp-multiple-sessions-value
    desc: RDP AllowMultipleTSSessions value-name reference
    conf: 0.99
    if:
      type: text
      exact: AllowMultipleTSSessions
