defaults:
  platforms: [windows]
  for: [pe, batch, powershell]
  crit: notable
  conf: 0.95

traits:
  - id: linked-connections-policy-value
    desc: Linked-drive policy registry path and value
    if:
      # Rust pools adjacent constants without separators. This observes the
      # value name, not a bound registry write or a particular DWORD value.
      type: raw
      regex: '(?i)Policies\\System\\?EnableLinkedConnections'
