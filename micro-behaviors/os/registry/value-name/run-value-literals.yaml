---
defaults:
  platforms:
  - windows
  crit: notable
traits:
- id: php-svchost-update-value
  for:
  - php
  desc: SvcHost_Update value-name literal
  conf: 0.88
  if:
    type: literal
    substr: SvcHost_Update_
- id: rust-securityupdate-value-literal
  for:
  - rust
  desc: SecurityUpdate value-name literal
  conf: 0.93
  if:
    type: literal
    exact: SecurityUpdate
- id: interleaved-java-update-value-marker
  desc: Interleaved Java-update value marker
  conf: 0.96
  for:
  - pe
  if:
    type: text
    regex: "^JUth(1)?naac[,_\\.-]?uvdSdSapee$"
    section: ".rdata"
