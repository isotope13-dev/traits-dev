# A value-name reference does not establish a write or its direction.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll, csharp]
  crit: notable
  conf: 0.98

traits:
  - id: speculation-mitigation-override-value-reference
    desc: Windows CPU mitigation override value names
    if:
      type: text
      regex: '\bFeatureSettingsOverride(Mask)?\b'
