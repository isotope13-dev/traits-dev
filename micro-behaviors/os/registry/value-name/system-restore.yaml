defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: disablesr-value-reference
    desc: DisableSR restore-policy value name
    conf: 0.98
    if:
      type: text
      exact: DisableSR
  # Source text exposes whole code lines rather than isolated constants.
  - id: disablesr-source-value-reference
    desc: DisableSR restore-policy name in source text
    conf: 0.92
    for: [html, text]
    if:
      type: text
      word: DisableSR
