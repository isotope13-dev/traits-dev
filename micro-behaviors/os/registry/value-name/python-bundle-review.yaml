# Evidence describes ordinary capabilities or static properties.
traits:
- for:
  - go
  - pe
  - powershell
  - batch
  - vbs
  - csharp
  - python
  platforms:
  - windows
  id: debugger-value-reference
  desc: Quoted Debugger name or registry value option
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (['"]Debugger['"]|(?i:/v\s+Debugger\b)|(?i:-Name\s+["']?Debugger\b))
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
