defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: pending-file-rename-value-name
  desc: PendingFileRenameOperations value name
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: PendingFileRenameOperations
    case_insensitive: true
  unless:
  - id: micro-behaviors/os/registry/software/reference::advanced-inf-setup-regpath
  - id: metadata/signature/verified/platform::microsoft
- id: bootexecute-value-reference
  desc: References BootExecute registry value
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)\bBootExecute\b
