defaults:
  platforms: [windows, macos]
  for: [pe, dll, macho]

traits:
  - id: java-home-token
    desc: JavaHome registry value-name token
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: JavaHome
      section: .rdata

composite_rules:
  - id: java-home-executable-localhost-references
    desc: JavaHome, executable and localhost URL references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/registry/value-name::java-home-token
      - id: micro-behaviors/fs/path/executable::java-bin-executable-path
      - id: micro-behaviors/communications/url/host/http::localhost-format-url
