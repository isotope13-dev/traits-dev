defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  crit: notable
traits:
  - id: disable-smartscreen-policy-name
    desc: DisableSmartScreen policy-name reference
    conf: 0.9
    if:
      type: text
      substr: DisableSmartScreen
  - id: smartscreen-enabled-policy-name
    desc: SmartScreenEnabled policy-name reference
    conf: 0.9
    if:
      type: text
      substr: SmartScreenEnabled
composite_rules:
  - id: smartscreen-policy-reference-cluster
    desc: SmartScreen policy-name and key references
    conf: 0.92
    any:
      - id: disable-smartscreen-policy-name
      - id: smartscreen-enabled-policy-name
      - id: micro-behaviors/os/registry/keys/policy::phishingfilter-policy-key
    needs: 2
    unless:
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
