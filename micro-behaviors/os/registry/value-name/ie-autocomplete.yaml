defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: ie-password-autocomplete-setting
    desc: IE password AutoComplete setting-name reference
    conf: 0.94
    # This is an IE preference, not a saved-password data-store reference.
    if:
      type: text
      exact: FormSuggest Passwords
    unless:
      - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
