defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, csharp, c, cpp, go, rust, pe, dll]

traits:
  # This names a registry value; it does not establish a write or persistence.
  # Preserve the source matcher formerly in registry/manipulate and also cover
  # the UTF-16 value-name constants extracted from compiled Windows programs.
  - id: url-protocol-registry-value
    desc: URL Protocol registry value-name reference
    conf: 0.9
    if:
      type: text
      substr: "URL Protocol"
