# A policy value name is a reference, independent of reads or writes.
defaults:
  platforms: [windows]
  crit: notable
traits:
  - id: disable-registry-tools
    for:
    - binaries
    - scripts
    - csharp
    - html
    - text
    desc: Disable Registry Editor policy value name
    conf: 0.95
    if:
      type: text
      regex: (?i)\bDisableRegistryTools\b
