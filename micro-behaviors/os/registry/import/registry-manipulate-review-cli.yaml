defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, csharp, c, cpp, go, rust]
  attack: T1112
traits:
  - id: reg-exe-import-command
    desc: reg.exe import command
    conf: 0.94
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+import\b'
composite_rules:
  - id: reg-import-user-writable-file
    desc: reg.exe import and AppData references
    crit: notable
    conf: 0.97
    near_lines: 1
    all:
      - id: micro-behaviors/os/registry/import::reg-exe-import-command
      - id: micro-behaviors/os/env/path::appdata-path-lookup
