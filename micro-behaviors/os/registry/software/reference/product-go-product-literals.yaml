---
defaults:
  platforms:
  - windows
  for:
  - go
  crit: notable
  conf: 0.85
traits:
- id: go-lotus-approach-key-literal
  desc: Lotus Approach registry path literal
  if:
    type: string_literal
    substr: Software\Lotus\Approach
- id: go-borland-delphi-key-literal
  desc: Borland Delphi registry path literal
  if:
    type: string_literal
    substr: Software\Borland\Delphi
  downgrade:
    any:
    - id: metadata/lang/compiler/managed::borland-rtl-regkey
- id: go-netscape-navigator-key-literal
  desc: Netscape Navigator registry path literal
  if:
    type: string_literal
    substr: Software\Netscape\Netscape Navigator
