defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: msi-edgeupdate-config-value-reference
  desc: MSI EdgeUpdate registry config value
  crit: notable
  conf: 0.96
  attack: T1112
  for:
  - oledoc
  - ole
  if:
    type: raw
    regex: (?i)Software\\Microsoft\\EdgeUpdatecfg
- id: windows-uninstall-key-path
  desc: Windows uninstall registry key path string
  crit: notable
  conf: 0.9
  for:
  - pe
  - dll
  - c
  - cpp
  if:
    type: text
    # One or two backslashes per separator: C/C++ source spells the path
    # with escaped backslashes inside string literals, while extracted
    # binary strings carry single separators.
    regex: 'SOFTWARE\\+Microsoft\\+Windows\\+CurrentVersion\\+Uninstall'
