defaults:
  platforms:
    - windows
  for: [scripts, python, pyc, binaries]
traits:
  - id: roblox-studio-registry-key
    desc: References Roblox Studio registry key
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)SOFTWARE[\\/]Roblox[\\/]RobloxStudioBrowser[\\/]roblox\.com
