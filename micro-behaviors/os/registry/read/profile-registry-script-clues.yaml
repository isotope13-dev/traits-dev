defaults:
  platforms:
  - windows
composite_rules:
- for:
  - powershell
  id: powershell-hkcu-read-base64-clues
  desc: PowerShell HKCU read and Base64 clues
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
  - id: micro-behaviors/os/registry/read::powershell-hkcu-registry-read
  near_lines: 4
  near_bytes: 500
  unless:
  - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
  - id: well-known/lib/vendor-sdk/posh-ovirt::posh-ovirt-module-source
