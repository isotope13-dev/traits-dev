# Windows reg.exe query invocation from JavaScript/TypeScript child processes.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: js-reg-query-command
    desc: References Windows reg query command
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+query\b'

  - id: js-hklm-software-registry-path
    desc: References HKLM\SOFTWARE Windows registry hive
    if:
      type: text
      regex: '(?i)\bHK(LM|EY_LOCAL_MACHINE)\\+SOFTWARE\\+'

composite_rules:
  - id: node-exec-reg-query
    desc: Executes Windows reg query via child_process
    conf: 0.94
    attack: T1012
    mbc: C0036
    near_bytes: 512
    all:
      - id: js-reg-query-command
    any:
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: metadata/import/builtin::child-process-exec-destructure
