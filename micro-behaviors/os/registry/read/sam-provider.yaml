defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-sam-account-key-read
    desc: Get-Item reads the SAM account registry key
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(?i)^Get-Item$'
      arg:
        kind: identifier
        name: 'HKLM:\SAM\SAM\Domains\Account'
