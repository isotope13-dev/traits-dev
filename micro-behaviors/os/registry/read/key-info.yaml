# Registry class names are returned by this API along with other metadata.
# Match calls rather than declarations, comments, or API-name string literals.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: query-key-info-call
    desc: Queries Windows registry key metadata
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])RegQueryInfoKey[AW]?$'
