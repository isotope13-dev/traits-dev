# WScript registry access is a neutral script capability.  Keep the atom in a
# micro-behavior tier and restrict it to executable VBScript: JavaScript
# bundles often embed old-IE VBScript fallback text as inert string literals,
# and `for: [vbs]` is what keeps those out.
#
# The matchers scan text, not parsed literals.  cleave extracts no literal or
# symbol facts at all from VBScript (`cleave facts` on a .vbs yields
# "literals": [], "symbols": []), so a `type: literal` condition here never
# ran -- a script calling RegRead outright matched nothing.  The leading `\.`
# keeps the match to a method call rather than a bare mention.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.9
  attack: T1012
  mbc: E1563

traits:
  - id: wscript-regread
    desc: WScript RegRead registry query
    if:
      type: text
      regex: '\.\s*RegRead\b'

  - id: com-registry-enumkey
    desc: Enumerates registry subkeys via COM EnumKey
    conf: 0.9
    for: [vbs, powershell, javascript, csharp]
    if:
      type: text
      # WMI StdRegProv calls take the hive as their first argument.  Keeping it
      # near the method separates registry enumeration from an unrelated
      # helper with the same method name, including VBScript calls without ()
      # such as `oReg.EnumKey HKLM, key, result`.
      regex: '(?i)\.\s*EnumKey.{0,24}(HK|&H8)'
