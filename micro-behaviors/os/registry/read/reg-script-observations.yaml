defaults:
  platforms: [windows]
  for: [text, reg, ne, batch]
traits:
  - id: regedit-export-switch
    desc: regedit export switch
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bregedit\s+/e\b'
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
  - id: regedit-export-run-key
    desc: regedit exports Run-key branch to loop variable
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)regedit\s+/e\s+%[a-z]\s+HKEY_[^\r\n]{0,100}CurrentVersion\\+Run\b'
