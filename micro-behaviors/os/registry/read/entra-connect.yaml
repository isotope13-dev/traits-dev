defaults:
  for: [scripts, source, pe, dll]
  platforms: [windows]
  attack: T1012

traits:
  - id: entra-connect-database-parameters
    desc: References Entra Connect database parameters key
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'SYSTEM\CurrentControlSet\Services\ADSync\Parameters'
      case_insensitive: true

  - id: entra-connect-shared-key
    desc: References Entra Connect shared key registry
    crit: suspicious
    conf: 0.98
    attack: T1552.002
    if:
      type: text
      regex: '(?i)SOFTWARE\\Microsoft\\Ad\s+Sync\\Shared\\'
