defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-sam-account-property-read
    desc: PowerShell reads SAM account registry properties
    conf: 0.98
    if:
      type: tree-sitter
      node: command
      regex: '(?i)^Get-ItemProperty\s+(-Path\s+)?["'']?HKLM:\\?SAM\\SAM\\Domains\\Account\b'
composite_rules:
  - id: powershell-sam-account-data-read
    desc: PowerShell reads SAM account registry data
    conf: 0.98
    any:
      - id: powershell-sam-account-key-read
      - id: powershell-sam-account-property-read
