defaults:
  platforms: [windows]

traits:
  - id: powershell-registry-read
    desc: PowerShell reads a registry value
    crit: notable
    conf: 0.9
    # PowerShell is often embedded in HTA/JScript/VBScript strings. The matcher
    # is still the concrete PowerShell registry-read syntax, so those host
    # formats can contribute the same capability without a language-specific
    # duplicate.
    for: [powershell, oledoc, html, javascript, vbs]
    attack: T1012
    if:
      type: text
      # A PowerShell syntax catalogue lists Get-ItemProperty as a bare command;
      # a registry read names the HKCU/HKLM provider in the same expression.
      regex: '(?i)\b(gp|Get-ItemProperty)\s+(-Path\s+)?["'']?(HKCU|HKLM):\\'
    unless:
    - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
