# AutoIt is currently exposed as unparsed text; require call syntax.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.95
traits:
  - id: autoit-registry-read-call
    desc: AutoIt RegRead call with registry path
    if:
      type: raw
      # AutoIt RegRead is a bare function; WSH/VBA `obj.RegRead(...)` is a method.
      regex: '(?im)(^|[^.\w])RegRead\s*\(\s*"HK'
