defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]

traits:
  - id: ps-lsa-get-childitem
    desc: Get-ChildItem on a named LSA path variable
    conf: 0.92
    if:
      type: text
      regex: 'Get-ChildItem\s+\$lsaPath'

  # Registry-stage loaders read user-writable HKCU values (plantable without
  # elevation); an HKLM machine-settings read is ordinary provisioning, not
  # an attacker-controlled stage source.
  - id: powershell-hkcu-registry-read
    desc: PowerShell reads a HKCU value
    conf: 0.92
    attack: T1012
    if:
      type: text
      regex: '(?i)\b(gp|Get-ItemProperty|Get-Item)\s+(-Path\s+)?["'']?HKCU:\\'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
