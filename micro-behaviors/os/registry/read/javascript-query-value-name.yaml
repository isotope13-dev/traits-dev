# JavaScript source that names the registry query export. A bare name only
# shows the API surface; consumers pair it with the behavior that uses it.
defaults:
  for: [javascript]
  platforms: [windows]
  crit: notable
  conf: 0.85

traits:
  - id: js-reg-query-value-w-name
    desc: JavaScript source names RegQueryValueExW
    if:
      type: text
      substr: RegQueryValueExW
