# A COM interface registration key, `Interface\{IID}` under HKCR: where
# Windows records an interface's proxy/stub and type library. Programs that
# marshal COM interfaces name these; so do probes checking that a real
# Windows install, not an emulator, is underneath.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: interface-iid-registry-key-path
    desc: COM Interface\{IID} registry key path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)^interface\\\{[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\}$'
