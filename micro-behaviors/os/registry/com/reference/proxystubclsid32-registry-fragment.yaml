defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9

traits:
  - id: proxystubclsid32-registry-fragment
    desc: ProxyStubClsid32 registry fragment
    crit: notable
    for: [pe]
    if:
      type: text
      exact: \ProxyStubClsid32
    unless:
      - id: metadata/installer/builder/wix::standard-bootstrapper-product
      - type: text
        exact: Software\Microsoft\OleAut
