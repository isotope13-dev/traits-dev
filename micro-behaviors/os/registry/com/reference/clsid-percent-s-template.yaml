defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: clsid-percent-s-template
    desc: CLSID registry format-string template
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?i)CLSID\\\{%s\}
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
