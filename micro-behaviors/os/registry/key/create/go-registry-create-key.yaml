# Go registry key creation. The x/sys registry package exposes CreateKey;
# calling it from Go source establishes key creation through the Go
# registry binding. Persistence and installer composites add the autorun
# target that turns the capability into an install.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [go]
  attack: T1112

traits:
  - id: go-registry-create-key
    desc: Go registry CreateKey call
    if:
      type: symbol
      kind: call
      regex: '(\.)?CreateKey$'
