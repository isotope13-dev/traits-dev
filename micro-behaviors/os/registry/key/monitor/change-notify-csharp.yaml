# User-mode registry change notification from C#. Settings panels, device
# managers and game launchers watch keys to refresh their UI; malware watches
# its own autorun entry to put it back. The watch alone is neutral.
defaults:
  for: [csharp]
  platforms: [windows]
  crit: notable

traits:
  - id: regnotify-change-key-value-pinvoke
    desc: RegNotifyChangeKeyValue symbol reference
    conf: 0.95
    if:
      type: symbol
      exact: RegNotifyChangeKeyValue
  # A class name only: it says the source organizes a registry watch, not how.
  - id: registry-watcher-class-name
    desc: Registry watcher class-name text
    conf: 0.9
    if:
      type: text
      regex: 'class\s+Registry\w*Watcher'
