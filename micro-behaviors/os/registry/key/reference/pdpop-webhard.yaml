# PDPOP's WebHard client keeps its settings under this key; a reference to it
# identifies the client's configuration, not a registry write.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99

traits:
  - id: webhard-registry-path
    desc: PDPOP WebHard registry path
    if:
      type: text
      exact: Software\pdpop\WebHard
      section: .rdata
