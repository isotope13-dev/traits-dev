defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: pcanywhere-data-port-reference
    desc: pcAnywhere data port registry value reference
    if:
      type: text
      substr: 'Symantec\pcAnywhere\CurrentVersion\System\TCPIPDataPort'
      case_insensitive: true
