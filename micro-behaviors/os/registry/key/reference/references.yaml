defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: syncmgr-registry-cluster
    desc: Windows SyncMgr\Handlers registry key string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'SyncMgr\Handlers'
      section: rdata

  - id: syncmgr-handler-clsid
    desc: Windows SyncMgr handler CLSID string
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: "{F897AA24-BDC3-11d1-B85B-00C04FB93981}"
      section: rdata

  - id: mobsync-pdb-path
    desc: Windows mobsync PDB path
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.debug.pdb.path
      regex: (?i)(^|[\\/])mobsync\.pdb$

  - id: mobsync-version-name
    desc: Windows mobsync.exe string
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: mobsync.exe
      section: rdata

composite_rules:
- id: syncmgr-mobsync-identity
  desc: Mobsync SyncMgr reference cluster
  crit: notable
  conf: 0.92
  all:
  - id: syncmgr-registry-cluster
  - id: syncmgr-handler-clsid
  - id: mobsync-pdb-path
  - id: mobsync-version-name
