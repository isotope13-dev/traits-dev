# References and API co-occurrence do not establish bound data flow.
defaults:
  for:
  - scripts
  - binaries
  platforms:
  - windows
  crit: notable
traits:
- id: print-processor-registry-path-reference
  desc: Print processor registry path reference
  conf: 0.88
  if:
    type: text
    regex: (?i)\\Control\\Print\\Environments\\[^\\\n]{1,160}\\Print Processors\\
