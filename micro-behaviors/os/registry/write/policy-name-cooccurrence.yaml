defaults:
  platforms: [windows]

composite_rules:
- id: taskmgr-policy-write-api-cooccurrence
  for: [pe, batch, csharp, vbs, powershell]
  desc: DisableTaskMgr name co-occurs with registry-write APIs
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/os/registry/keys::disable-taskmgr
  any:
  - id: micro-behaviors/os/registry/manipulate::registry-write-marker
  - id: micro-behaviors/os/registry/manipulate::set-value
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
  - id: micro-behaviors/os/registry/write::wsh-regwrite-dword
  - id: micro-behaviors/os/registry/write::powershell-registry-property-write
  unless:
  - id: well-known/app/utility/installer::startallback-installer

- id: cmd-policy-write-api-cooccurrence
  for: [pe, batch, csharp, powershell]
  desc: DisableCMD name co-occurs with registry-write APIs
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/keys::disable-cmd
  any:
  - id: micro-behaviors/os/registry/manipulate::registry-write-marker
  - id: micro-behaviors/os/registry/manipulate::set-value
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
  - id: micro-behaviors/os/registry/write::powershell-registry-property-write

