traits:
- for:
  - batch
  crit: suspicious
  conf: 0.94
  platforms:
  - windows
  id: batch-reg-add-run-key-direct
  desc: Batch REG ADD references a Run-key path
  if:
    type: text
    regex: (?i)\breg\s+add\b[^\r\n]{0,120}\\CurrentVersion\\Run\b
  unless:
  - id: metadata/file/string/application-name::windows11-defender-disable-tweak
  - id: well-known/app/system/reactos::test-harness-script
