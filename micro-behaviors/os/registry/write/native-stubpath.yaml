defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # Bind the pushed value name and called IAT slot. A StubPath read/delete
  # accompanied by an unrelated ServiceDLL writer must not satisfy this.
  - id: x86-stubpath-expand-string-write
    desc: x86 writes StubPath as REG_EXPAND_SZ
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_stubpath_expand_string_write {
          strings:
            $value = "stubpath\x00" ascii nocase
            $write = { 6A 02 6A 00 68 [4] (50|51|52|53|55|56|57)
                       FF 15 ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_I386 and
            for any s in pe.sections : (
              s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any w in (1..#write) : (
                @write[w] >= s.raw_data_offset and
                @write[w] + !write[w] <= s.raw_data_offset + s.raw_data_size and
                uint32(@write[w] + 12) == pe.image_base +
                  pe.import_rva("ADVAPI32.dll", "RegSetValueExA") and
                $value at pe.rva_to_offset(uint32(@write[w] + 5) - pe.image_base)
              )
            )
        }
