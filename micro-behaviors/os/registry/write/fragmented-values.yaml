defaults:
  platforms: [windows]
  for: [html, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: regwrite-enable-dword
    desc: RegWrite sets a DWORD value to one
    if:
      type: text
      regex: '(?i)\.RegWrite[^\r\n]{0,240},\s*"?1"?\s*,\s*"REG_DWORD"'
composite_rules:
  - id: fragmented-regwrite-homepage-lock
    desc: RegWrite enables fragmented homepage lock
    near_lines: 0
    all:
      - id: regwrite-enable-dword
      - id: micro-behaviors/os/registry/keys/policy::fragmented-homepage-value
      - id: micro-behaviors/os/registry/keys/browser::fragmented-internet-explorer-path
  - id: fragmented-regwrite-registrytools-lock
    desc: RegWrite enables fragmented Registry Editor lockout
    near_lines: 0
    all:
      - id: regwrite-enable-dword
      - id: micro-behaviors/os/registry/keys/policy::fragmented-disable-registrytools-value
      - id: micro-behaviors/os/registry/keys/policy::fragmented-policies-system-path
  - id: fragmented-regwrite-start-page
    desc: RegWrite targets a fragmented Start Page value
    near_lines: 0
    all:
      - id: wscript-regwrite
      - id: micro-behaviors/os/registry/keys/browser::fragmented-ie-start-page
      - id: micro-behaviors/os/registry/keys/browser::fragmented-internet-explorer-path
