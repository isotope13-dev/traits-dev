---
defaults:
  crit: notable
traits:
- id: reg-add-command-token
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
  desc: REG ADD command token
  conf: 0.86
  if:
    type: text
    exact: 'REG ADD '
- id: reg-add-reg-sz-data
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
  desc: REG ADD REG_SZ data
  conf: 0.86
  if:
    type: text
    exact: " /t REG_SZ /d "
- id: perl-run-key-variable-launcher-write
  platforms:
  - windows
  - unix
  for:
  - perl
  desc: Assigns launcher through run_key variable
  conf: 0.92
  if:
    type: text
    regex: "\\$run_key->\\{[^}]{1,80}\\}\\s*=\\s*\\$launcher"
- id: php-reg-add-command
  platforms:
  - windows
  for:
  - php
  desc: PHP references reg add value command
  conf: 0.92
  if:
    type: text
    regex: "\\breg add\\b[\\s\\S]{0,220}/v"
- id: regwrite-run-wscript-command
  platforms:
  - windows
  for:
  - vbs
  - html
  desc: RegWrite associates Run key with wscript
  conf: 0.96
  if:
    type: text
    regex: "(?i)\\bRegWrite\\b[^\\r\\n]{0,160}CurrentVersion\\\\Run[^\\r\\n]{0,120}wscript\\.exe"
composite_rules:
- id: powershell-appdata-run-key-write-context
  platforms:
  - windows
  for:
  - powershell
  desc: AppData image and Run-key write co-occur
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
  - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
  near_lines: 20
- id: powershell-appdata-script-run-write-context
  platforms:
  - windows
  for:
  - powershell
  desc: AppData script and Run-key write co-occur
  conf: 0.98
  near_lines: 40
  all:
  - id: micro-behaviors/os/env/user-paths::env-appdata
  - id: micro-behaviors/fs/write/file/full::powershell-set-content-call
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
- id: delphi-run-write-system-copy-context
  platforms:
  - windows
  desc: Run-key writer and system copy co-occur
  conf: 0.99
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/write::load32-run-write-source
  - id: micro-behaviors/fs/file/copy::system-dir-lorena-copy
- id: dotnet-hkcu-string-write-context
  platforms:
  - windows
  for:
  - pe
  desc: Managed HKCU string-write context
  conf: 0.96
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/os/registry/write::reg-add-command-token
  - id: micro-behaviors/os/registry/hive::quoted-hkcu-hive-reference
  - id: micro-behaviors/os/registry/write::reg-add-reg-sz-data
  any:
  - id: micro-behaviors/os/registry/keys/installer::dotnet-install-registry-path-accessor
  - id: micro-behaviors/os/registry/keys/installer::dotnet-install-key-name-accessor
  - id: micro-behaviors/os/registry/keys/installer::hidden-startup-registry-accessors
  - id: micro-behaviors/os/autorun/keyword::dotnet-startup-persistence-config-token
  unless:
  - id: metadata/binary/installer/
  - id: metadata/signed/platform/
- id: go-run-key-value-write-context
  platforms:
  - windows
  desc: Run path and Go registry writes co-occur
  conf: 0.8
  for:
  - go
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  any:
  - id: micro-behaviors/os/registry/manipulate::go-registry-set-string-value-call
  - id: micro-behaviors/os/registry/manipulate::go-registry-set-dword-value-call
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/testing/harness/unit::go-test
  - id: metadata/file/naming::test-directory-component
- id: go-run-key-reg-command-context
  platforms:
  - windows
  desc: HKCU Run path and reg.exe add co-occur
  conf: 0.94
  for:
  - go
  all:
  - id: micro-behaviors/os/registry/keys/autostart::go-hkcu-run-key-path
  - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
  unless:
  - id: well-known/app/ai/agent-runtime/nagobot::nagobot-windows-autostart-context
- id: go-winreg-run-key-write-context
  platforms:
  - windows
  desc: Go winreg import and Run write co-occur
  conf: 0.9
  for:
  - go
  all:
  - id: micro-behaviors/os/registry/access::go-registry-package-import
  - id: micro-behaviors/os/registry/write::go-run-key-value-write-context
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/testing/harness/unit::go-test
  - id: metadata/file/naming::test-directory-component
- id: go-run-key-system-name-write-context
  platforms:
  - windows
  desc: Run write and system names co-occur
  conf: 0.95
  for:
  - go
  all:
  - id: micro-behaviors/os/registry/access::go-registry-package-import
  - id: micro-behaviors/os/registry/write::go-run-key-value-write-context
  - id: micro-behaviors/process/info/name::windows-system-name-references
- id: jvm-source-run-key-write-context
  conf: 0.98
  platforms:
  - windows
  for:
  - java
  - kotlin
  desc: JVM source Run path and string-write command
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/manipulate::jvm-reg-add-reg-sz-force-command
- id: perl-run-key-launcher-write-context
  platforms:
  - windows
  - unix
  for:
  - perl
  desc: Perl Run path and launcher write co-occur
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/access::perl-win32-tieregistry
  - id: micro-behaviors/os/registry/access::perl-registry-key-write
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-perl-escaped
  - id: micro-behaviors/os/registry/write::perl-run-key-variable-launcher-write
- id: php-run-key-temp-image-write-context
  platforms:
  - windows
  for:
  - php
  desc: Run-key write and Windows Temp path co-occur
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/write::php-reg-add-command
  - id: micro-behaviors/fs/path/temp::win-temp-path
- id: php-run-key-interpreter-write-context
  platforms:
  - windows
  for:
  - php
  desc: Run-key write and PHP command co-occur
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/write::php-reg-add-command
  - id: micro-behaviors/process/info/name::php-executable-template
  any:
  - id: micro-behaviors/fs/read/self::self-file-reference
  - id: micro-behaviors/os/registry/value-name::php-svchost-update-value
- id: run-key-write-launcher-context
  platforms:
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
  desc: Run-key writer with script or image context
  conf: 0.98
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
  any:
  - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/app/infrastructure/
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
- id: pyc-run-key-setter-image-context
  platforms:
  - windows
  for:
  - pyc
  desc: Run path, setter and image name in bytecode
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/keys/autostart::pyc-hkcu-run-key
  - id: micro-behaviors/os/registry/access::pyc-setvalueex-name
  - id: micro-behaviors/fs/path/basename::pyc-nsedge-filename
- id: python-run-key-value-write-context
  platforms:
  - windows
  for:
  - python
  desc: Run path and Python value write co-occur
  conf: 0.96
  near_lines: 90
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/manipulate::winreg-setvalue
- id: wsh-run-path-dword-write-context
  platforms:
  - windows
  for:
  - vbs
  desc: Run path and DWORD value write co-occur
  conf: 0.95
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/write::wsh-regwrite-dword
