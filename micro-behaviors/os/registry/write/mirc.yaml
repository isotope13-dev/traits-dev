defaults:
  platforms: [windows]
  for: [mirc, lua, text, data]
  crit: notable
traits:
  - id: mirc-regwrite-run-client-path
    desc: mIRC Run-key write uses client executable path
    conf: 0.99
    if:
      type: text
      regex: '(?i)\$RegWrite\(HK[LC]M\\[^,\r\n]{1,90}\\Run\\[^,]{1,40},[^\r\n]{0,30}\$mircexe'
  - id: mirc-stages-run-client-value
    desc: mIRC stages Run-key client executable
    if:
      type: text
      regex: '(?i)write %\w+ \[HKEY_[^\n]{1,100}\\Run\][^\n]{0,20}\n[^\n]{0,90}\$mircexe'

  - id: mirc-stages-registry-file-header
    desc: mIRC writes a REGEDIT4 registry import header
    if:
      type: text
      regex: '(?i)\bwrite\s+-[ac]\s+\S+\.reg\s+REGEDIT4\b'
  - id: mirc-stages-executable-registry-value
    desc: mIRC stages an executable registry value
    if:
      type: text
      regex: '(?i)\bwrite\s+-a\s+\S+\.reg\s+"[^"\r\n]{1,40}"="[^|\r\n]{1,100}\.exe"'
