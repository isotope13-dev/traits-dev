defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1112
composite_rules:
  - id: mirc-reg-import-with-cleanup
    desc: mIRC registry import near deferred removal
    crit: notable
    conf: 0.92
    near_lines: 8
    all:
      - id: micro-behaviors/os/registry/write::regedit-silent-import
      - id: micro-behaviors/fs/delete/file/deferred::mirc-timer-deferred-remove
  - id: mirc-staged-client-run-import
    desc: mIRC Run staging near silent registry import
    crit: notable
    near_lines: 4
    all:
      - id: mirc-stages-run-client-value
      - id: regedit-silent-import

  - id: mirc-staged-executable-run-import
    desc: mIRC Run-key staging near registry file import
    crit: notable
    near_lines: 1
    all:
      - id: mirc-stages-registry-file-header
      - id: mirc-stages-executable-registry-value
      - id: micro-behaviors/os/registry/keys::windows-run-key-path
      - id: regedit-silent-import
  - id: mirc-executable-autorun-registration
    for: [mirc, lua, data]
    desc: mIRC registers an executable for autorun
    crit: notable
    any:
      - id: mirc-regwrite-run-client-path
      - id: mirc-staged-client-run-import
      - id: mirc-staged-executable-run-import
