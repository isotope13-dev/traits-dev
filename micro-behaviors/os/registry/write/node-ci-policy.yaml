defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: node-silent-ci-policy-command
    desc: Silently writes CI policy through execSync
    crit: notable
    conf: 0.98
    attack: T1112
    if:
      type: tree-sitter
      query: |
        ((program
          (if_statement
            condition: (parenthesized_expression (binary_expression
              left: (member_expression) @platform right: (string) @windows))
            consequence: (statement_block
              (try_statement body: (statement_block
                (expression_statement (call_expression
                  function: (identifier) @exec
                  arguments: (arguments (string) @command
                    (object (pair key: (property_identifier) @option
                      value: (string) @silent)))))))))) @call
          (#eq? @platform "process.platform")
          (#match? @windows "win32")
          (#eq? @exec "execSync")
          (#match? @command "reg(\\.exe)? add .{0,100}Control.{1,4}CI.{1,4}Policy")
          (#eq? @option "stdio")
          (#match? @silent "^['\"]ignore['\"]$"))
