defaults:
  platforms: [windows]
  for: [text, powershell, batch]
traits:
  - id: encoded-set-itemproperty-value
    desc: Decoded variable-based registry property write
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: hex
      regex: '(?i)Set-ItemProperty -Path \$\w+ -Name \$\w+ -Value \$\w+'
composite_rules:
  - id: encoded-startup-folder-write-profile
    desc: Decoded Startup folder registry-write profile
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/keyword::encoded-startup-folder-value
      - id: micro-behaviors/os/registry/keys::encoded-shell-folder-key
      - id: micro-behaviors/os/registry/write::encoded-set-itemproperty-value
