defaults:
  platforms: [windows]
  for: [pe, dll]

# Registry write evidence is required. Service creation is only one optional
# API; dispatch or start references can satisfy the same alternative.
composite_rules:
- id: servicedll-registry-write-api-cluster
  desc: ServiceDLL and service registry-write API cluster
  crit: notable
  conf: 0.94
  all:
  - id: "micro-behaviors/os/registry/keys/service::system-services-registry-path"
  - id: micro-behaviors/os/registry/access::service-dll-value
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  any:
  - id: micro-behaviors/os/service/create::create-service
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  - id: micro-behaviors/os/service/start::start-service
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/symbols/count::many-exports-100
