# Compiled managed assemblies carry their registry setter as metadata strings:
# the Microsoft.Win32 registry type name and the SetValue member name land in
# separate string runs near each other. A native wrapper that embeds a wrapped
# managed payload carries those strings too, so this is a writer-identity
# observation, not proof that this image performs the write; consumers pair it
# with the key path being written.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
composite_rules:
- id: managed-registry-setter-token
  desc: Managed RegistryKey setter in binary metadata
  crit: notable
  conf: 0.9
  near_bytes: 768
  all:
    - id: micro-behaviors/os/registry/access::dotnet-registry-key-type
    - id: "metadata/lang/source/naming/function::setvalue-member-token"
