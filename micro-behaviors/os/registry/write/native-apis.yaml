defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: set-registry-value
    desc: References ZwSetValueKey value write API
    crit: notable
    conf: 0.93
    if:
      type: symbol
      exact: ZwSetValueKey
  - id: write-registry-value
    desc: References RtlWriteRegistryValue helper API
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: RtlWriteRegistryValue

