defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1112
  mbc: C0036
traits:
  # The value-type token `REG_DWORD` on its own says nothing about a write:
  # it is just as common in RegRead / StdRegProv *read* helpers, which is how
  # Microsoft's Office removal scripts were reported as installing Run-key
  # persistence. Require the RegWrite call itself on the same line so the
  # description ("RegWrite with REG_DWORD") matches what is detected.
  - id: wsh-regwrite-dword
    desc: WScript.Shell RegWrite with REG_DWORD
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bRegWrite\b[^\r\n]{0,200}\bREG_DWORD\b'
