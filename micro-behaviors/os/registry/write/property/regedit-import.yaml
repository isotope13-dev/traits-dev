# `regedit /s file.reg` -- a silent registry import from a file.
#
# The /s switch exists so an installer can apply a .reg without a prompt, so
# the call itself is a normal administrative capability. It becomes worth
# noticing when the .reg is one the same script just wrote line by line with
# echo, because then the registry change is being laundered through a file
# that exists for a fraction of a second and is deleted afterwards -- there is
# no `reg add` command line for anything watching process arguments to see.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries, mirc]
  attack: T1112
traits:
  - id: regedit-silent-import
    desc: Silent regedit file import
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bregedit(\.exe)?\s+/s\b'
