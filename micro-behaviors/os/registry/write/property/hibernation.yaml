# CrashControl's DumpFilters REG_MULTI_SZ selects the drivers used to encrypt
# crash dumps and hibernation images. Access is a notable registry capability;
# explicitly emptying or deleting the list is a rare security-relevant change.
defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1112

traits:
  - id: crash-control-registry-path
    desc: References the Windows CrashControl key
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(CurrentControlSet|ControlSet\d{3})[\\/]+Control[\\/]+CrashControl\b'

  - id: powershell-empty-dump-filters
    desc: PowerShell empties the dump-filter list
    crit: suspicious
    conf: 0.98
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)Set-ItemProperty.{0,160}-Name\s+[''\"]?DumpFilters.{0,100}-Value\s+@\(\)'

  - id: powershell-delete-dump-filters
    desc: PowerShell deletes the dump-filter value
    crit: suspicious
    conf: 0.98
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)Remove-ItemProperty.{0,160}-Name\s+[''\"]?DumpFilters\b'

  - id: reg-delete-dump-filters
    desc: Reg.exe deletes the dump-filter value
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+delete\b.{0,180}/v\s+[''\"]?DumpFilters\b'

  - id: registry-api-delete-dump-filters
    desc: Registry API deletes the dump-filter value
    crit: suspicious
    conf: 0.97
    for: [binaries, source]
    if:
      type: text
      regex: '(?i)(DeleteValue|RegDeleteValue(Ex)?[AW]?).{0,100}[''\"]DumpFilters[''\"]'

composite_rules:
  - id: dump-filters-value-clear
    desc: Clears the Windows dump-filter list
    crit: suspicious
    conf: 0.98
    any:
      - id: powershell-empty-dump-filters
      - id: powershell-delete-dump-filters
      - id: reg-delete-dump-filters
      - id: registry-api-delete-dump-filters
