# PowerShell registry writes are a neutral capability.  Persistence or
# payload-storage intent comes from objective composites that add the key and
# surrounding execution context.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1112
  mbc: C0036

traits:
  - id: powershell-registry-property-cmd
    desc: PowerShell New or Set-ItemProperty command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(New|Set)-ItemProperty\b'

  # Batch/binary counterpart to powershell-registry-property-cmd above, scoped to
  # the file types that one does not cover so the matcher is defined once.
  - id: registry-property-cmd-text
    desc: Set-ItemProperty cmdlet name in text
    crit: notable
    conf: 0.9
    for: [batch, pe]
    if:
      type: text
      substr: Set-ItemProperty
    count_max: 1008471

  - id: powershell-machine-registry-path
    desc: PowerShell HKLM registry path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-Path\s+[''"'']?HKLM:'

  - id: powershell-machine-registry-root
    desc: PowerShell machine registry root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-Path\s+[''"'']?HKEY_LOCAL_MACHINE:'

  - id: powershell-user-registry-path
    desc: PowerShell HKCU registry path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-Path\s+[''"'']?HKCU:'

  - id: powershell-user-registry-root
    desc: PowerShell user registry root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-Path\s+[''"'']?HKEY_CURRENT_USER:'

composite_rules:
  - id: powershell-registry-property-write
    desc: PowerShell writes a registry property
    crit: notable
    conf: 0.92
    all:
      - id: powershell-registry-property-cmd
    any:
      - id: powershell-machine-registry-path
      - id: powershell-machine-registry-root
      - id: powershell-user-registry-path
      - id: powershell-user-registry-root
    near_lines: 1
