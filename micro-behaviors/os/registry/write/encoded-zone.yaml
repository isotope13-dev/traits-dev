defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: percent-quoted-regwrite-1201-zero
    desc: Encoded RegWrite allows unsafe ActiveX
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'RegWrite\(%22.{0,160}Internet Settings\\+Zones\\+[0-4]\\+1201%22 *, *0\b'
