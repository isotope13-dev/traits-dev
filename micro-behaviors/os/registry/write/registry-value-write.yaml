defaults:
  platforms: [windows]
  attack: T1112

traits:
  - id: win32-reg-set-value-call
    desc: Calls Win32 RegSetValueEx or SetValueEx
    crit: notable
    conf: 0.94
    for: [lua, python, c, cpp, rust, go, csharp]
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(RegSetValueEx[AW]?|RegSetKeyValue[AW]?|SetValueEx)$'

composite_rules:
# A registry value write with no target claim: API imports, source-level
# setters and reg.exe/powershell spellings all establish that a value can be
# written, not which key. Policy composites reference this for their write
# leg; their key-path legs supply the target.
- id: registry-value-write
  desc: Registry value write via API or command
  crit: notable
  conf: 0.94
  for: [binaries, scripts, source]
  any:
  - id: win32-reg-set-value-call
  - id: micro-behaviors/os/registry/value/write/
  - id: micro-behaviors/os/registry/association/write/
  - id: micro-behaviors/os/registry/autostart/write/
  - id: micro-behaviors/os/registry/session-manager/write::bootexecute-registry-api-profile
  - id: micro-behaviors/os/registry/explorer/write::encoded-startup-folder-write-profile
  - id: micro-behaviors/os/autorun/login-items::native-constructed-userinit-command-write
  - id: micro-behaviors/os/registry/policy/write/
  - id: micro-behaviors/os/security/execution-policy::powershell-executionpolicy-write-chain
  - id: micro-behaviors/os/security/firewall::windows-firewall-authorizedapps-write-chain
  - id: micro-behaviors/os/security/kernel::node-silent-ci-policy-command
  - id: micro-behaviors/os/registry/environment/write/
