defaults:
  platforms: [windows]
composite_rules:
# A registry value write with no target claim: API imports, source-level
# setters and reg.exe/powershell spellings all establish that a value can be
# written, not which key. Policy composites reference this for their write
# leg; their key-path legs supply the target.
- id: registry-value-write
  desc: Registry value write via API or command
  crit: notable
  conf: 0.94
  attack: T1112
  for: [binaries, scripts, c, cpp, csharp, go, rust]
  any:
  - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
  - id: micro-behaviors/os/registry/access::registry-set-value-api
  - id: micro-behaviors/os/registry/value/write/
  - id: micro-behaviors/os/registry/association/write/
  - id: micro-behaviors/os/registry/autostart/write/
  - id: micro-behaviors/os/registry/policy/write/
  - id: micro-behaviors/os/registry/environment/write/
