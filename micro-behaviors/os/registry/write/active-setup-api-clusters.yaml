defaults:
  platforms: [windows]
  for: [pe, dll, csharp, vbs, batch, powershell]
composite_rules:
- id: active-setup-write-api-cluster
  for: [pe]
  desc: Active Setup path and registry write APIs
  crit: notable
  conf: 0.8
  all:
    - id: micro-behaviors/os/registry/access::active-setup-fragment
    - id: micro-behaviors/os/registry/access::registry-write-api-chain
  unless:
    - id: well-known/lib/platform/advanced-inf::advanced-inf-setup-context
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: well-known/tool/browser::google-chrome-installer
    - id: metadata/lang/upstream::windows-system-implementer-dll
    - id: well-known/lib/platform/wine/
    - id: well-known/app/utility/sony-ps-remote-play::sony-ps-remote-play-installer-context
  downgrade:
    any:
      - id: metadata/signed/platform/
