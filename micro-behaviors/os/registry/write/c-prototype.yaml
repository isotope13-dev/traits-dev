# C source prototype for RegSetValueEx. The win32-reg-set-value-call symbol
# atom in registry-value-write.yaml cannot see a function-pointer typedef,
# which is how a registry write is declared when the API is resolved at run
# time. Its key target is not established here.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.93
  attack: T1112

traits:
  - id: reg-set-value-prototype-typedef
    desc: RegSetValueEx prototype typedef
    if:
      type: text
      regex: 'LONG \(__stdcall ?\*\w+\)\(HKEY,LPCTSTR,DWORD,DWORD,const BYTE ?\*,DWORD\)'
      exclude_comments: true
