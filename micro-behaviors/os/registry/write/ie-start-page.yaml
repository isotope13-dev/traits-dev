defaults:
  platforms: [windows]
  for: [html, javascript, vbs, batch, powershell, data, static-lib]
traits:
  - id: regwrite-ie-start-page
    desc: RegWrite targets the IE Start Page value
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.RegWrite.{0,120}Internet.{1,6}Explorer.{0,40}Start.{1,6}Page'

  - id: regwrite-ie-search-settings
    desc: RegWrite targets IE search settings
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.RegWrite.{0,80}Internet Explorer.{1,20}(Search|Default_Search)'
