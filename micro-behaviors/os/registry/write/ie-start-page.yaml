defaults:
  platforms: [windows]
  for: [html, javascript, vbs, batch, powershell]
traits:
  - id: regwrite-ie-start-page
    desc: RegWrite targets the IE Start Page value
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.RegWrite.{0,120}Internet.{1,6}Explorer.{0,40}Start.{1,6}Page'
