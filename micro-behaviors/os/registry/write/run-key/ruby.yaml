# The Run key is the destination argument of the registry write command.
defaults:
  for: [ruby]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: ruby-system-run-key-command
    desc: Ruby system passes a Run-key registry command
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        regex: '(?i)^\s*reg(?:\.exe)?\s+add\s+["'']?HK(?:CU|LM)\\+Software\\+Microsoft\\+Windows\\+CurrentVersion\\+Run(["'']|\s|$)'
    unless:
      - id: metadata/package/testing/presence/path::benign-testdata-directory-path

  - id: ruby-system-run-key-argv
    desc: Ruby system passes Run-key registry arguments
    if:
      type: symbol
      kind: call
      exact: system
      args:
        - index: 0
          regex: '(?i)^reg(?:\.exe)?$'
        - index: 1
          regex: '(?i)^add$'
        - index: 2
          regex: '(?i)^HK(?:CU|LM)\\+Software\\+Microsoft\\+Windows\\+CurrentVersion\\+Run$'
    unless:
      - id: metadata/package/testing/presence/path::benign-testdata-directory-path
