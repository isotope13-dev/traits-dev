# Windows registry-script (.reg file) observations.
#
# A REGEDIT / Version 5.00 header identifies registry-script text. Importing
# requires a separate command, and a header alone does not establish silent
# import, autorun configuration, or propagation.
defaults:
  platforms: [windows]
  for: [text, reg, ne, batch]
traits:
  - id: echo-regedit-header-redirect
    desc: Echo writes REGEDIT header to file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\becho\s+REGEDIT\s?4?\s*>>?'
  - id: reg-default-shell-command
    desc: Default registry value contains shell command
    crit: notable
    conf: 0.91
    for: [text, reg, registry]
    if:
      type: text
      regex: '(?i)@="(command(\.com)?|cmd(\.exe)?)\s+/[ck]\b'
