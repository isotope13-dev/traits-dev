# Windows registry-script (.reg file) observations.
#
# A REGEDIT 4 / Version 5.00 header line marks a registry script: importing
# it writes keys without a confirmation prompt. On its own that is an
# administrative capability; it turns hostile when the script plants an
# autorun command in a Run key (default-value `@=` shell command) or loops
# `regedit /e` over other .reg files to spread its own payload.
defaults:
  platforms: [windows]
  for: [text, reg]
traits:
  - id: regedit-header-line
    desc: Registry script REGEDIT header
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[\r\n])(REGEDIT\s?4?|Windows Registry Editor Version 5\.00)[\r\n]'
  - id: reg-hkey-section
    desc: Registry script key section
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '[HKEY_'
  - id: reg-run-key-path
    desc: Run key path text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)currentversion\\run'
  - id: reg-for-in-loop
    desc: Batch for-in file loop
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bfor\s+%%?\w+\s+in\s*\('
  - id: reg-wildcard-target
    desc: Wildcard targets .reg files
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '*.reg'
  - id: regedit-export-switch
    desc: regedit export switch
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bregedit\s+/e\b'
  - id: reg-default-shell-command
    desc: Default registry value runs shell
    crit: notable
    conf: 0.91
    for: [text, reg, registry]
    if:
      type: text
      regex: '(?i)@="(command(\.com)?|cmd(\.exe)?)\s+/[ck]\b'
