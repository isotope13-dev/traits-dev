# Windows registry-script (.reg file) observations.
#
# A REGEDIT / Version 5.00 header identifies registry-script text. Importing
# requires a separate command, and a header alone does not establish silent
# import, autorun configuration, or propagation.
defaults:
  platforms: [windows]
  for: [text, reg, ne, batch]
traits:
  - id: regedit-header-line
    desc: Registry script REGEDIT header
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[\r\n])(REGEDIT\s?4?|Windows Registry Editor Version 5\.00)[\r\n]'
  - id: reg-hkey-section
    desc: Registry script key section
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '[HKEY_'
  - id: reg-run-key-path
    desc: Run key path text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)currentversion\\run'
  - id: reg-wildcard-target
    desc: Wildcard targets .reg files
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '*.reg'
  - id: regedit-export-switch
    desc: regedit export switch
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bregedit\s+/e\b'
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog

  - id: echo-regedit-header-redirect
    desc: Echo writes REGEDIT header to file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\becho\s+REGEDIT\s?4?\s*>>?'
  - id: reg-default-shell-command
    desc: Default registry value runs shell
    crit: notable
    conf: 0.91
    for: [text, reg, registry]
    if:
      type: text
      regex: '(?i)@="(command(\.com)?|cmd(\.exe)?)\s+/[ck]\b'
composite_rules:
  # Either spelling of the same act: streaming a .reg file through echo,
  # at a line start in a batch script or mid-blob in an embedded carrier.
  - id: run-key-path-signal
    desc: Run key path in any spelling
    crit: notable
    conf: 0.92
    for: [batch, ne]
    any:
      - id: micro-behaviors/os/registry/keys::windows-run-key-path
      - id: reg-run-key-path
