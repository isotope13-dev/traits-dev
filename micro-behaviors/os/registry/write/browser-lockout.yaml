defaults:
  platforms: [windows]
  for: [html, vbs, javascript, batch, powershell]
  crit: notable
  conf: 0.98
traits:
  - id: regwrite-disable-registry-tools
    desc: RegWrite enables the DisableRegistryTools policy
    if:
      type: text
      regex: '(?i)\.RegWrite[^\r\n]{0,150}\\DisableRegistryTools"\s*,\s*"?1"?\s*,'
  - id: regwrite-browser-run-url
    desc: RegWrite autoruns IE with an HTTP URL
    if:
      type: text
      regex: '(?i)RegWrite.{0,160}\\Run\\[^"]{1,60}"\s*,\s*"IEXPLORE\.EXE https?://'
  - id: regwrite-lock-ie-homepage
    desc: RegWrite blocks IE homepage editing
    if:
      type: text
      regex: '(?i)\.RegWrite[^\r\n]{0,150}\\Control Panel\\HomePage"\s*,\s*"?1"?\s*,'
