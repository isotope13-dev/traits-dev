# WScript registry writes are a neutral script capability.  Persistence is
# inferred by objective composites when a write is paired with an autostart key.
defaults:
  platforms: [windows]
  for: [vbs, javascript, html]
  crit: notable
  conf: 0.9
  attack: T1112
  mbc: E1563

traits:
  # Text matcher, not a parsed literal: cleave extracts no literal or symbol
  # facts from VBScript, so a `type: literal` condition here never ran.  The
  # leading `\.` keeps the match to a method call rather than a bare mention.
  - id: wscript-regwrite
    desc: WScript RegWrite registry modification
    if:
      type: text
      regex: '\.\s*RegWrite\b'

  - id: com-registry-set-value
    desc: Writes a registry value via COM SetValue
    conf: 0.88
    # WMI StdRegProv's typed setters (SetStringValue / SetDWORDValue /
    # SetBinaryValue / SetExpandedStringValue / SetMultiStringValue), reached
    # with a hive constant.  Sibling of the WScript.Shell RegWrite route.
    for: [vbs, powershell, javascript, csharp]
    if:
      type: text
      # StdRegProv's typed setters may also use VBScript's no-parentheses
      # call form, so bind the operation to a nearby hive argument.
      regex: '(?i)\.\s*Set[A-Za-z0-9]{1,20}Value.{0,24}(HK|&H8)'
