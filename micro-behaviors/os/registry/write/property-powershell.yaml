# PowerShell registry writes are a neutral capability.  Persistence or
# payload-storage intent comes from objective composites that add the key and
# surrounding execution context.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
  attack: T1112
  mbc: C0036

composite_rules:
  - id: powershell-registry-property-write
    desc: PowerShell writes a registry property
    conf: 0.92
    all:
      - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
    any:
      - id: micro-behaviors/os/registry/hive::powershell-machine-registry-path
      - id: micro-behaviors/os/registry/hive::powershell-machine-registry-root
      - id: micro-behaviors/os/registry/hive::powershell-user-registry-path
      - id: micro-behaviors/os/registry/hive::powershell-user-registry-root
    near_lines: 1
