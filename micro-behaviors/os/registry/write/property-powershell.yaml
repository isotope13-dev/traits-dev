# PowerShell registry writes are a neutral capability.  Persistence or
# payload-storage intent comes from objective composites that add the key and
# surrounding execution context.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
  attack: T1112
  mbc: C0036

traits:
  - id: powershell-registry-property-cmd
    for: [powershell, html]
    desc: PowerShell New or Set-ItemProperty command
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(New|Set)-ItemProperty\b'

  - id: powershell-sp-registry-string-write
    desc: PowerShell sp alias string registry write
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsp\s+\(.{0,80}\)\s+\(.{0,240}\).{0,160}-Type\s+String'

  - id: powershell-new-itemproperty-variable-path
    desc: New-ItemProperty uses path variable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bNew-ItemProperty\s+-Path\s+\$[A-Za-z_]\w*'

  # Batch/binary counterpart to powershell-registry-property-cmd above, scoped to
  # the file types that one does not cover so the matcher is defined once.
  - id: registry-property-cmd-text
    desc: Set-ItemProperty cmdlet name in text
    conf: 0.9
    for: [batch, pe]
    if:
      type: text
      substr: Set-ItemProperty

composite_rules:
  - id: powershell-registry-property-write
    desc: PowerShell writes a registry property
    conf: 0.92
    all:
      - id: powershell-registry-property-cmd
    any:
      - id: micro-behaviors/os/registry/hive::powershell-machine-registry-path
      - id: micro-behaviors/os/registry/hive::powershell-machine-registry-root
      - id: micro-behaviors/os/registry/hive::powershell-user-registry-path
      - id: micro-behaviors/os/registry/hive::powershell-user-registry-root
    near_lines: 1
