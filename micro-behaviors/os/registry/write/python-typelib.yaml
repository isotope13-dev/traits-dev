defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  # Bind the TypeLib path and script moniker to the same registry write.
  - id: python-typelib-script-moniker-write
    desc: Writes script moniker to TypeLib path
    if:
      type: symbol
      kind: call
      regex: '(^|\.)winreg\.SetValue$'
      args:
        - index: 1
          from:
            value: '(?i)(^|\\)TypeLib\\\{[0-9a-f-]{36}\}\\'
        - index: 3
          from:
            value: '(?i)^script:'
  - id: python-typelib-script-moniker-setvalueex
    desc: Sets TypeLib default to script moniker
    if:
      type: symbol
      kind: call
      regex: '(^|\.)winreg\.SetValueEx$'
      args:
        - index: 0
          from:
            call: '(^|\.)winreg\.(CreateKey(Ex)?|OpenKey(Ex)?)$'
            argument: 1
            literal: '(?i)(^|\\)TypeLib\\\{[0-9a-f-]{36}\}\\'
        - index: 1
          exact: ''
        - index: 4
          from:
            value: '(?i)^script:'
