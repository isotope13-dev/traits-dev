defaults:
  platforms: [windows]
  crit: notable
  conf: 0.98
  attack: T1112

traits:
  - id: python-user-environment-create
    desc: Creates the user Environment registry key
    for: [python]
    if:
      # Python call facts do not retain HKEY_CURRENT_USER as an argument value.
      type: tree-sitter
      kind: call
      regex: 'CreateKey(Ex)?\(\w+\.HKEY_CURRENT_USER,\s*[rR]?.Environment.'

  - id: python-windir-value-write
    desc: Sets a windir registry value with winreg
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)winreg\.SetValueEx$'
      arg:
        index: 1
        kind: string
        exact: windir

  - id: python-user-folder-command-create
    desc: Creates the user Folder command key
    for: [python]
    if:
      # Python facts retain the path argument but not member provenance for
      # HKEY_CURRENT_USER. Inspect the call node to bind the hive and path.
      type: tree-sitter
      kind: call
      regex: 'CreateKey\(\w+\.HKEY_CURRENT_USER,\s*r?.Software\\Classes\\Folder\\shell\\open\\command.'

  - id: powershell-user-windir-write
    desc: Writes the per-user windir registry value
    for: [powershell]
    if:
      type: text
      regex: '(?i)(Set|New)-ItemProperty\s+-Path\s+.HKCU:\\Environment.\s+-Name\s+.windir.\s+-Value\b'

  - id: powershell-piped-windir-write
    desc: Creates windir value via New-ItemProperty
    for: [powershell]
    if:
      type: text
      regex: '(?i)New-ItemProperty\s+.{0,60}-Name\s+.windir.\s+-Value\b'
