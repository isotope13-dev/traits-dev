# Registry hive names are neutral WScript references.  The surrounding
# operation determines whether the reference has persistence or impact intent.
#
# Text matchers, not parsed literals: cleave extracts no literal or symbol
# facts from VBScript, so a `type: literal` condition here never ran.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.9
  attack: T1012
  mbc: E1563

traits:
  - id: hkey-local-machine
    desc: HKLM system-wide registry hive reference
    if:
      type: text
      word: HKEY_LOCAL_MACHINE

  - id: hkey-current-user
    desc: HKCU per-user registry hive reference
    if:
      type: text
      word: HKEY_CURRENT_USER
