defaults:
  for:
  - batch
  - vbs
  - powershell
  - pe
  - python
  - rust
  platforms:
  - windows
  crit: notable
  conf: 0.94
traits:
- id: powershell-windir-property-access
  desc: Per-user windir registry property command
  if:
    type: text
    regex: (?i)ItemProperty\s+-Path\s+.HKCU:\\Environment.\s+-Name\s+.windir\b
