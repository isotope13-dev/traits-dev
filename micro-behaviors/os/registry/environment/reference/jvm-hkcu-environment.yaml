# JVM-class environment-key reference. The SilentCleanup windir-env UAC
# hijack writes HKCU\Environment from a Java class (via a reg argv array),
# and the class constant pool keeps the key path as a single string. The
# reference alone is a neutral registry fact; the hijack composite in
# objectives/privilege-escalation/elevation-control/uac-bypass/hijack/
# joins it with the scheduled-task launch.
defaults:
  platforms: [windows]
  for: [class]
  crit: notable
  conf: 0.9
traits:
- id: jvm-hkcu-environment-key-path
  desc: References per-user environment registry key
  if:
    type: text
    regex: '(?i)HKCU\\+Environment\b'
