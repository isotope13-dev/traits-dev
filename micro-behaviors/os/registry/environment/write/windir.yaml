defaults:
  platforms: [windows]
  crit: notable
  conf: 0.98
  attack: T1112

traits:
  - id: python-windir-value-write
    desc: Sets a windir registry value with winreg
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)winreg\.SetValueEx$'
      arg:
        index: 1
        kind: string
        exact: windir

  - id: powershell-user-windir-write
    desc: Writes the per-user windir registry value
    for: [powershell]
    if:
      type: text
      regex: '(?i)(Set|New)-ItemProperty\s+-Path\s+.HKCU:\\Environment.\s+-Name\s+.windir.\s+-Value\b'
