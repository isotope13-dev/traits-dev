# Feedback-coded firewall service key path from the shared VB6 triplet
# decoder. Key-path reference only; the consuming objective composite
# supplies the write evidence.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: feedback-coded-sharedaccess-service-key
    desc: Feedback-coded SharedAccess service key path
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # UTF-16 BSTR; feedback triplets from the shared decoder. This is the
      # standard service key path, independent of any dropped filename.
      pattern: '4D 00 47 00 3F 00 D1 00 7E 01 53 01 59 00 59 00 53 00 74 00 6F 00 64 00 E3 00 B3 00 AC 00 BF 00 A5 00 8F 00 5C 00 73 00 47 00 CB 00 B4 00 61 01 D3 00 AE 00 14 20 64 00 90 00 70 00 6A 00 22 21 78 00 31 00 78 00 55 00 22 00 08 00 49 00 A6 00 5F 00 9D 00 BF 00 1E 20 AA 00 49 00 30 00 55 00 3A 00 2C 00 59 00 BE 00 92 01 AC 00 64 00 72 00 90 00 2B 00 54 00 67 00 C4 00 B5 00 C8 00 5F 00 22 20 20 20 3D 00 6C 00 73 00 AC 00 B9 00 BF 00 5C 00 37 00 92 01 77 00 4A 00 48 00 55 00 21 00 28 00 64 00 54 00 57 00 BE 00 18 20 DC 02 26 20 70 00 73 00 DD 00 C8 00 A9 00 3D 00 4E 00 43 00 14 20 7D 01 76 00 5C 00 C6 02 57 00 77 00 3A 20 66 00 1D 20 22 21 79 00 A1 00 E4 00 78 01 6A 00 3F 00 74 00 31 00 1E 00 57 00 22 00 1A 00 46 00 8F 00 76 00 8F 00 E9 00 BC 00 C5 00 EF 00 C5 00 D5 00 4F 00 4B 00 5F 00 A9 00 39 20 DC 02 79 00 1D 20 78 01'
