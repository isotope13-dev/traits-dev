defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
- id: reg-open-key-w
  desc: Open registry key via WinAPI
  crit: notable
  conf: 0.85
  if:
    type: symbol
    exact: RegOpenKeyW
- id: reg-open-key-ex-w-symbol
  desc: Open registry key via import symbol
  crit: notable
  conf: 0.9
  if:
    type: import
    exact: RegOpenKeyExW
- id: reg-open-key-a-symbol
  desc: Open registry key via import symbol
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: RegOpenKeyA
- id: reg-open-key-ex-a-symbol
  desc: Open registry key via import symbol ANSI
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: RegOpenKeyExA
- id: go-registry-openkey-call
  desc: Open registry key via Go API
  crit: notable
  conf: 0.88
  for:
  - go
  if:
    type: symbol
    kind: call
    regex: (^|\.)(registry\.OpenKey|OpenKey)$
composite_rules:
- id: registry-open-key-api
  desc: Registry key open API
  crit: notable
  conf: 0.9
  any:
  - id: reg-open-key-w
  - id: reg-open-key-a-symbol
  - id: reg-open-key-ex-w-symbol
  - id: reg-open-key-ex-a-symbol
  - id: micro-behaviors/os/api-resolution/dynamic::reg-open-key-a-resolved-name
  - id: go-registry-openkey-call
