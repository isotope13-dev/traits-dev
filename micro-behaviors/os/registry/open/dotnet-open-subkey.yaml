# not establish either a value read or a write.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: dotnet-open-subkey-reference
    desc: .NET registry OpenSubKey API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: OpenSubKey
      section: .text
