defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp]

traits:
  - id: source-registry-open-key-api
    desc: Native source opens a registry key
    conf: 0.9
    if:
      type: text
      regex: '\bRegOpenKeyEx[AW]?\s*\('

  - id: reg-open-key-ex-source
    desc: RegOpenKeyEx registry access API
    conf: 0.88
    if:
      type: symbol
      exact: "RegOpenKeyExA"

