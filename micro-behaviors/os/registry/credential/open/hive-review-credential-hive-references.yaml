# References to the SAM/SECURITY hive roots, including hive-qualified paths.
defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
traits:
- id: dotnet-open-sam-hive
  desc: .NET opens the Windows SAM registry hive
  crit: notable
  conf: 0.95
  for: [csharp]
  if:
    type: symbol
    kind: call
    substr: OpenSubKey
    arg:
      kind: string
      exact: SAM
