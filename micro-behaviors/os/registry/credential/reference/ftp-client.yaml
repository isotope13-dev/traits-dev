defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp]
  crit: notable
  conf: 0.9

traits:
  - id: smartftp-client-settings-key
    desc: References SmartFTP saved-settings registry key
    if:
      type: text
      regex: '(?i)SOFTWARE\\smartftp\\client'
  - id: winscp-sessions-key
    desc: References WinSCP saved-sessions registry key
    if:
      type: text
      regex: '(?i)SOFTWARE\\martin prikryl\\winscp'
  - id: far-manager-ftp-hosts-key
    desc: References FAR Manager FTP hosts registry key
    if:
      type: text
      regex: '(?i)SOFTWARE\\Far2?\\Plugins\\ftp\\hosts'
  - id: flashfxp-client-key
    desc: References FlashFXP client registry key
    if:
      type: text
      regex: '(?i)SOFTWARE\\FlashFXP\\'
  - id: total-commander-client-key
    desc: References Total Commander registry key
    if:
      type: text
      regex: '(?i)SOFTWARE\\Ghisler\\Total Commander'
