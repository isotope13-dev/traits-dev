defaults:
  attack: T1003.005
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: nlkm-lsa-secret-path
  desc: NL$KM LSA secret registry path
  crit: notable
  conf: 0.97
  for: [pe, dll, powershell, csharp]
  if:
    type: text
    substr: 'SECURITY\Policy\Secrets\NL$KM'
- id: security-cache-registry-path
  desc: Domain cached-logon registry path
  crit: notable
  conf: 0.94
  for: [pe, dll, powershell, csharp]
  if:
    type: text
    substr: 'SECURITY\CACHE'
