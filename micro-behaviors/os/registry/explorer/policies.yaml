defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
traits:
  - id: explorer-policy-path
    desc: Explorer policies registry path
    conf: 0.95
    # VB6 strings can live in .text, and serialized paths may retain doubled
    # separators. Neither the section nor the spelling changes the reference.
    if:
      type: text
      regex: '(?i)Software\\+Microsoft\\+Windows\\+CurrentVersion\\+Policies\\+Explorer'
  - id: no-folder-options
    desc: Explorer NoFolderOptions policy value
    conf: 0.96
    for: [pe]
    if:
      type: text
      exact: NoFolderOptions
