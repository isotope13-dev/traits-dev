defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: user-shell-folders-regpath
  desc: Explorer User Shell Folders registry path
  crit: baseline
  conf: 0.92
  if:
    type: text
    exact: SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders
- id: explorer-shell-folders-desktop-value
  desc: References Explorer Shell Folders Desktop value
  crit: notable
  conf: 0.92
  for: [c, cpp]
  if:
    type: text
    regex: '(?is)Shell Folders.{0,512}(Common )?Desktop'
