# Feedback-coded Explorer visibility strings from the shared VB6 triplet
# decoder. Value-name and key-path references only; the consuming objective
# composites supply the write evidence.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: feedback-coded-explorer-advanced-path
    desc: Feedback-coded Explorer Advanced registry path
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # UTF-16 BSTR; feedback triplets from the shared decoder. This is the
      # standard policy key, independent of any dropped filename or host.
      pattern: '4D 00 47 00 3F 00 2B 00 21 00 35 00 46 00 34 00 43 00 A0 00 74 00 7E 00 E5 00 A4 00 AC 00 BF 00 AB 00 14 20 C6 02 75 00 6F 00 4F 00 54 00 48 00 68 00 26 20 50 00 A1 00 C9 00 A4 00 7F 00 A3 00 21 20 D7 00 FB 00 C5 00 76 00 3C 00 7B 00 3D 00 1E 00 59 00 14 20 5B 00 18 20 49 00 30 00 62 00 64 00 43 00 71 00 BE 00 92 01 A5 00 38 00 70 00 72 00 A7 00 B7 00 BB 00 26 20 7D 01 78 01 22 00 59 00 5F 00 28 00 5F 00 69 00 43 00 78 00 79 00 F1 00 7A 00 E9 00 A3 00 4F 00 6C 00 68 00 49 00 45 00 A1 00 60 01 81 00 A9 00 1E 20 30 20 70 00 66 00 5D 00 76 00 6F 00 6A 00 3D 00 4E 00 3C 00 2E 00 4D 00 31 00 B2 00 A4 00 60 01 B6 00 C2 00 30 20 55 00 72 00 4C 00 64 00 A5 00 7D 00 7F 00 4C 00 21 20 26 20 52 00 30 20 37 00 2A 00 57 00 28 00 26 00 51 00 56 00 61 00 6D 00 EF 00 BC 00 CD 00 3A 00 44 00 4D 00 6A 00 64 00 72 00 B8 00 B8 00 CC 00 2B 00 69 00 71 00 70 00 22 21 78 01 37 00 78 00 71 00 7C 00 3C 00 7E 01 56 00 43 00 52 01 3A 20 6A 00 63 00 3A 00 20 00 21 00 E8 00 1D 20 14 20 A1 00 A8 00 26 20 16 00 3E 00 2A 00 D7 00 D4 00 B3 00 37 00 5A 00 38 00 28 00 56 00 2E 00'
  - id: feedback-coded-superhidden-value
    desc: Feedback-coded SuperHidden value name
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '4D 00 47 00 47 00 6A 00 45 00 5B 00 31 00 2A 00 34 00 DF 00 3A 20 A8 00 65 00 6B 00 5F 00 C1 00 1C 20 52 01 5E 00 5B 00 51 00 4F 00 54 00 47 00 1D 20 21 20 76 00 38 00 C6 02 56 00 7F 00 A3 00 1A 20 1C 00 6B 00 44 00 22 00 05 00 48 00 3D 00 1B 00 52 00 2E 00 1A 00 4F 00'
