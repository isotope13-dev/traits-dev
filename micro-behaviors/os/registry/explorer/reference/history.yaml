defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: explorer-runmru-history-path
    desc: References the Explorer Run dialog history
    crit: notable
    conf: 0.92
    for: [pe, dll, scripts, source]
    if:
      type: text
      substr: 'Explorer\RunMRU'

  - id: explorer-userassist-history-path
    desc: References Explorer UserAssist history
    crit: notable
    conf: 0.94
    for: [pe, dll, scripts, source]
    if:
      type: text
      substr: 'Explorer\UserAssist\'

  - id: explorer-open-save-history-path
    desc: References the Explorer OpenSavePidlMRU history
    crit: notable
    conf: 0.94
    for: [pe, dll, scripts, source]
    if:
      type: text
      substr: 'Explorer\ComDlg32\OpenSavePidlMRU'

  - id: explorer-no-instrumentation-value
    desc: References the Explorer NoInstrumentation value
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: NoInstrumentation

