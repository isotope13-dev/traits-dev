defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: explorer-advanced-path
    desc: Explorer Advanced registry path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      case_insensitive: true
  - id: explorer-cabinet-state-path
    desc: Explorer CabinetState registry path
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState
      case_insensitive: true
  - id: hide-file-ext-value
    desc: Explorer HideFileExt value name
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: HideFileExt
  - id: hidden-value-token
    desc: Hidden string token
    crit: component
    conf: 0.5
    if:
      type: text
      exact: Hidden
composite_rules:
  - id: hidden-files-value
    desc: Explorer Hidden setting with Advanced key
    crit: notable
    conf: 0.94
    all:
      - id: explorer-advanced-path
      - id: hidden-value-token
