defaults:
  platforms: [windows]
  for: [scripts, source]
composite_rules:
- id: url-protocol-handler-registration
  for: [scripts, '!applescript', '!jcl', '!shell', c, csharp, go, rust]
  desc: Windows URL-handler registry registration references
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/os/registry/manipulate::hkcu-software-classes-path
  - id: micro-behaviors/os/registry/value-name::url-protocol-registry-value
  - id: micro-behaviors/os/registry/association::qualified-shell-open-command-key
