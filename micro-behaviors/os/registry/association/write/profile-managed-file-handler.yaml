# Member names are not resolved calls. This file-scoped API/path profile
# supports association registration, not the identity of the chosen handler.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-file-handler-registration-references
    desc: Managed file-handler setter API references
    crit: notable
    conf: 0.93
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/os/registry/hive/reference::classesroot-hive-member-name
      - id: micro-behaviors/os/registry/association/reference::shell-open-command-key
      - id: metadata/binary/symbols/name/registry/key::dotnet-registry-create-subkey-member
      - id: micro-behaviors/os/registry/value/write::managed-registry-setter-token
