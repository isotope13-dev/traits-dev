# This API/path cluster supports URL-handler registration capability. It does
# not bind a key handle to SetValue, identify the handler command, or establish
# persistence, hijacking, or successful registration.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.93

composite_rules:
  - id: managed-url-handler-registration-references
    desc: Managed URL-handler registration API and key references
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/os/registry/value-name::url-protocol-registry-value
      - id: micro-behaviors/os/registry/association/reference::shell-open-command-key
      - id: metadata/binary/symbols/name/registry/key::dotnet-registry-create-subkey-member
      - id: micro-behaviors/os/registry/value/write::managed-registry-setter-token
