defaults:
  for: [text, reg]
  platforms: [windows]
  crit: notable
  conf: 0.98

traits:
  - id: reg-ms-settings-command-delegation
    desc: Sets ms-settings command and delegation
    if:
      type: text
      regex: '(?i)\\ms-settings\\shell\\open\\command\]\s*@="[^"\r\n]{1,160}"\s*"DelegateExecute"=""'

  - id: reg-mscfile-open-command
    desc: Assigns mscfile open command
    if:
      type: text
      regex: '(?i)\\mscfile\\shell\\open\\command\]\s*@="[^"\r\n]{1,160}"'
