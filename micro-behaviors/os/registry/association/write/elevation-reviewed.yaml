defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.96
  attack: T1112
traits:
- id: powershell-folder-command-variable-write
  desc: Set-Item bound to user Folder command key
  if:
    type: tree-sitter
    query: |
      (statement_list
        (pipeline (assignment_expression
          (left_assignment_expression) @binding
          value: (pipeline) @path))
        . (pipeline)* @between
        . (pipeline (pipeline_chain (command
          command_name: (command_name) @operation
          command_elements: (command_elements
            (command_parameter) @parameter
            . (command_argument_sep)
            . (array_literal_expression (unary_expression (variable) @target))))))
        (#not-match? @between "(?m)^\\s*\\$[A-Za-z_]\\w*\\s*=")
        (#eq? @binding @target)
        (#match? @path "(?i)^['\"]HKCU:\\\\Software\\\\Classes\\\\Folder\\\\shell\\\\open\\\\command['\"]$")
        (#match? @parameter "(?i)^-Path$")
        (#match? @operation "(?i)^Set-Item$"))
