defaults:
  platforms: [windows]
  for: [batch, vbs, powershell, pe, python, rust, class]
traits:
  - id: delegateexecute-qualified-reference
    desc: DelegateExecute near registry-root text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(HKCU|Classes).{0,80}DelegateExecute'

  - id: jvm-delegateexecute-value-name
    desc: References DelegateExecute registry value
    crit: notable
    conf: 0.9
    for: [class]
    if:
      type: text
      substr: DelegateExecute
