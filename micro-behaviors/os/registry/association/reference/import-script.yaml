defaults:
  for: [text, reg]
  platforms: [windows]
  crit: notable
  conf: 0.99

traits:
  - id: reg-user-ms-settings-command-key
    desc: Declares per-user ms-settings command key
    if:
      type: text
      substr: '[HKEY_CURRENT_USER\Software\Classes\ms-settings\shell\open\command]'
      case_insensitive: true

  - id: reg-user-mscfile-command-key
    desc: Declares per-user mscfile command key
    if:
      type: text
      substr: '[HKEY_CURRENT_USER\Software\Classes\mscfile\shell\open\command]'
      case_insensitive: true
