# Platform-defined path, not a family string or chosen payload name.
# Decode each byte with state = state * 0x08088405 + 1 (mod 2^32),
# key = high32(state * 255), initial state = path length (26).
# The complete plaintext is exefile\shell\open\command. This records the
# encoded reference only, not a registry write or successful persistence.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: lcg-exefile-open-command-key
    desc: LCG-encoded EXE association open-command path
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: DATA
      pattern: 'B5 E1 D9 6E CA 12 58 FD B1 15 2E 9A 74 DB 4E F3 C4 9E 74 93 EE E2 68 EE 11 84'
