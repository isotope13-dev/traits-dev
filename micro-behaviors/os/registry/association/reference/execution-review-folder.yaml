defaults:
  for: [batch, vbs, powershell, pe, python, rust]
  platforms: [windows]
traits:
  - id: user-folder-open-command-path
    desc: Per-user Folder open-command registry path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)HKCU:[\\]+Software[\\]+Classes[\\]+Folder[\\]+shell[\\]+open[\\]+command'
