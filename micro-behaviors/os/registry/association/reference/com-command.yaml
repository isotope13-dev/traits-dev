defaults:
  platforms: [windows]
  for: [scripts, source, class]
  crit: notable
  conf: 0.97
traits:
  - id: open-command-rundll32-sta
    desc: Open-command specifies Rundll32 COM activation
    if:
      type: text
      regex: '(?i)\\open\\command\b[^\r\n]{0,64}rundll32(\.exe)?\s+/sta\b'

  - id: jvm-ms-settings-open-command-key
    desc: References ms-settings Shell open command key
    conf: 0.95
    for: [class]
    if:
      type: text
      regex: '(?i)Classes\\+ms-settings\\+Shell\\+Open\\+command'
