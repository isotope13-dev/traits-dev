traits:
- crit: notable
  platforms:
  - windows
  for:
  - scripts
  - csharp
  - c
  - cpp
  - go
  - rust
  id: qualified-shell-open-command-key
  desc: Registry-rooted shell open-command key text
  conf: 0.88
  if:
    type: text
    regex: (?i)(HK(CR|CU|LM)|HKEY_\w+)\\[^\r\n]{0,120}shell\\+open\\+command
