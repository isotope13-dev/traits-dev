defaults:
  platforms: [windows]
  for: [batch, vbs, powershell, pe, python, rust]
traits:
  - id: ms-settings-curver
    desc: Per-user ms-settings CurVer path reference
    crit: notable
    conf: 0.95
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: '(?i)HKCU\\\\?Software\\\\?Classes\\\\?ms-settings\\\\?CurVer'
