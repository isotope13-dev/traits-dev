defaults:
  platforms: [windows]
  for: [batch, vbs, powershell, pe, python, rust]
traits:
  - id: delegateexecute-qualified-reference
    desc: DelegateExecute near registry-root text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(HKCU|Classes).{0,80}DelegateExecute'
    unless:
      - id: well-known/app/utility/eraigosa-dotfiles/
