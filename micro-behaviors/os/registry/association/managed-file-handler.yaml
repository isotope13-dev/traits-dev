# Member names are not resolved calls. This file-scoped API/path profile
# supports association registration, not the identity of the chosen handler.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-file-handler-registration-references
    desc: Managed file-handler setter API references
    crit: notable
    conf: 0.93
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/registry/hive::classesroot-hive-member-name
      - id: shell-open-command-key
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-create-subkey-member
      - id: micro-behaviors/os/registry/write::managed-registry-setter-token
