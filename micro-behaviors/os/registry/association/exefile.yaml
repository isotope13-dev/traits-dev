defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: exefile-open-command-key
    desc: Executable file-association open command key
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(Software\\Classes\\)?exefile\\shell\\open\\command'

  # Single-byte XOR sometimes leaves this path below the string decoder's
  # recovery threshold. Match the platform-defined association path under any
  # nonzero key, without attributing a write or a hijack to the reference.
  - id: xor-exefile-open-command-key
    desc: XOR-encoded executable association command key
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule xor_exefile_open_command_key {
          strings:
            $key = "exefile\\shell\\open\\command" ascii xor(1-255)
          condition:
            $key
        }
