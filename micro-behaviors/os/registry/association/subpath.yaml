traits:
- id: shell-open-command-key
  desc: Shell open-command subpath reference
  for:
  - batch
  - vbs
  - powershell
  - pe
  - dll
  - python
  - rust
  platforms:
  - windows
  crit: notable
  conf: 0.7
  size_max: 10485760
  if:
    type: text
    # CreateSubKey can receive this relative to an already-open class key.
    # Keep rooted paths and escaped source spellings as well.
    regex: '(?i)\bshell\\+open\\+command\b'
