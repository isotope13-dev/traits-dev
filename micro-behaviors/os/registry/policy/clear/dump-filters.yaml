# CrashControl's DumpFilters REG_MULTI_SZ selects the drivers used to encrypt
# crash dumps and hibernation images. Access is a notable registry capability;
# explicitly emptying or deleting the list is a rare security-relevant change.
defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1112

composite_rules:
  - id: dump-filters-value-clear
    desc: Clears the Windows dump-filter list
    crit: suspicious
    conf: 0.98
    any:
      - id: micro-behaviors/os/registry/policy/write::powershell-empty-dump-filters
      - id: micro-behaviors/os/registry/delete::powershell-delete-dump-filters
      - id: micro-behaviors/os/registry/delete::reg-delete-dump-filters
      - id: micro-behaviors/os/registry/delete::registry-api-delete-dump-filters
