# PowerShell execution-policy registry location. The ShellIds key holds the
# ExecutionPolicy value that controls which scripts may run; naming the key
# identifies the policy surface, while changing it requires a registry write
# API (see the write-chain composite beside this reference).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-executionpolicy-registry-path
    desc: PowerShell execution policy registry path
    if:
      type: text
      exact: 'SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell'
