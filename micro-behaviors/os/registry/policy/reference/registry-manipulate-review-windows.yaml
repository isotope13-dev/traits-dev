defaults:
  platforms:
  - windows
  for: [pe, c, cpp]
traits:
- id: wallpaper-policy-value
  desc: Windows policy Wallpaper value
  crit: notable
  conf: 0.9
  for: [binaries, source, scripts, xml, text]
  if:
    type: text
    regex: '(?i)(CurrentVersion\\+Policies\\+System|Policies\\+System)[^\r\n]{0,160}\bWallpaper\b'
