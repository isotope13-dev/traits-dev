# Agent software-policy registry paths (HKCU\SOFTWARE\Policies\<vendor>).
#
# Group Policy registry keys override user and application settings and
# survive application reinstalls, which is why installers that pin AI-agent
# inference endpoints there are a persistence surface. The path alone is
# neutral: enterprise tools register their own vendors' policies here.
# Hostile inference comes from objective-tier composites that bind this
# surface to a lookalike endpoint and credential.
defaults:
  crit: notable
  platforms: [windows]
  for: [javascript, typescript, powershell, batch, csharp]

traits:
  - id: software-policies-key-path
    desc: Software policy registry key path
    conf: 0.93
    if:
      type: text
      regex: 'SOFTWARE\\\\Policies\\\\[A-Za-z0-9_]+'
