# Browser management policy names that decide who controls the browser and
# which extensions it must run: Chrome's cloud-management enrollment token and
# the Firefox ExtensionSettings policy.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, scripts, csharp, reg, json]

traits:
  - id: chrome-cloud-management-token
    desc: Chrome cloud management enrollment token name
    conf: 0.9
    if:
      type: text
      word: CloudManagementEnrollmentToken

  - id: firefox-force-installed-mode
    desc: Firefox policy forces an extension install
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']installation_mode\\{0,2}["'']\s*(:|=>|=)\s*\\{0,2}["'']force_installed'

  - id: firefox-install-url-remote
    desc: Extension policy installs from a remote URL
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']install_url\\{0,2}["'']\s*(:|=>|=)\s*\\{0,2}["'']https?://[^"''\\]{1,80}'
      not:
        - regex: '(?i)(addons|ftp|download)\.mozilla\.(org|net)'

  - id: firefox-disable-developer-tools
    desc: Firefox policy disables developer tools
    conf: 0.9
    if:
      type: text
      word: DisableDeveloperTools
    unless:
      - type: text
        regex: '(?i)DisableDeveloperTools["'']?\s*[:=]\s*(false|dword:0+|0)\b'
      - type: text
        regex: '(?i)DisableDeveloperTools["'']?\s+(-Value|(/t\s+\S+\s+)?/d)\s+0+\b'

composite_rules:
  - id: firefox-remote-force-install-policy
    desc: Firefox policy force-installs an extension from a remote URL
    conf: 0.92
    near_bytes: 600
    for: [scripts, reg, json]
    all:
      - id: firefox-force-installed-mode
      - id: firefox-install-url-remote
