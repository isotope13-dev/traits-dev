defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
traits:
  - id: winlogon-special-accounts-user-list
    desc: Winlogon SpecialAccounts UserList key reference
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: '\Winlogon\SpecialAccounts\UserList'
      case_insensitive: true
