defaults:
  platforms: [windows]
  for: [html, vbs]
  crit: notable
  conf: 0.96
traits:
  - id: fragmented-homepage-value
    desc: HomePage name allowing string fragments
    if:
      type: text
      case_insensitive: true
      regex: '\\H\W*o\W*m\W*e\W*P\W*a\W*g\W*e"'
  - id: fragmented-disable-registrytools-value
    desc: DisableRegistryTools name with string fragments
    if:
      type: text
      case_insensitive: true
      regex: '\\D\W*i\W*s\W*a\W*b\W*l\W*e\W*R\W*e\W*g\W*i\W*s\W*t\W*r\W*y\W*T\W*o\W*o\W*l\W*s"'
  - id: fragmented-policies-system-path
    desc: Policies System registry path with fragments
    if:
      type: text
      case_insensitive: true
      regex: '\\P\W*o\W*l\W*i\W*c\W*i\W*e\W*s\W*S\W*y\W*s\W*t\W*e\W*m\\'
