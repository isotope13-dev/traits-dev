traits:
  - id: phishingfilter-policy-key
    desc: References IE PhishingFilter registry key
    platforms: [windows]
    for: [c, cpp, pe, dll]
    crit: notable
    conf: 0.9
    if:
      type: text
      # Registry path segment only ('...\\Internet Explorer\\PhishingFilter');
      # 'SetPhishingFilterStatus' is the WebBrowser COM event every WPF and
      # WinForms browser host implements.
      regex: '(?i)\\\\?PhishingFilter\b'
