defaults:
  for: [text, static-lib, batch, reg]
  platforms: [windows]
traits:
  - id: ipsec-local-policy-path
    desc: Local IPsec policy registry path reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'IPSec\Policy\Local'
  - id: ipsec-active-policy-value
    desc: ActivePolicy registry value reference
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: '"ActivePolicy"='
composite_rules:
  - id: ipsec-policy-configuration-clues
    desc: Local IPsec policy, active value, and negotiation policy references
    crit: notable
    conf: 0.94
    all:
      - id: ipsec-local-policy-path
      - id: ipsec-active-policy-value
      - id: metadata/lang/source/naming/setting::ipsec-negotiation-policy-name
