# Configuration references also occur in authorized performance tuning.
# These observations do not infer that a protection is disabled.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.97

traits:
  - id: hvci-scenario-registry-path
    desc: HVCI memory-integrity scenario registry path
    if:
      type: text
      regex: '(?i)\bDeviceGuard\\+Scenarios\\+HypervisorEnforcedCodeIntegrity\b'

  - id: vbs-enable-policy-value
    desc: VBS enablement registry value reference
    if:
      type: text
      word: EnableVirtualizationBasedSecurity
      case_insensitive: true

  - id: speculative-execution-mitigation-policy-value
    desc: CPU speculation mitigation override value
    for: [pe, dll, powershell, batch]
    if:
      # Short PowerShell hashtable rows can be filtered out of a PE's text
      # facts. Match both encodings directly so resource carriers retain it.
      type: yara
      source: |
        rule speculative_execution_mitigation_value {
          strings:
            $value = "FeatureSettingsOverride" ascii wide nocase fullword
            $mask = "FeatureSettingsOverrideMask" ascii wide nocase fullword
          condition:
            any of them
        }
