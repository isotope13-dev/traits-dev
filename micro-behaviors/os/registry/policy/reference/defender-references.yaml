# A path is a reference, not a mutation or security-control bypass.
# Matchers and type/platform scopes preserved from anti-av/registry.
defaults:
  platforms: [windows]
  for: [scripts, binaries, data]
  crit: notable
  conf: 0.95
traits:
  - id: defender-realtime-registry-key-reference
    desc: Defender real-time registry key reference
    if:
      # Separators accept one or two backslashes: Python (and JSON) source
      # doubles them, so the runtime path `HKLM\SOFTWARE\...` is written
      # `HKLM\\SOFTWARE\\...` in code.
      type: text
      regex: '(?i)HKLM:\\{1,2}SOFTWARE\\{1,2}Microsoft\\{1,2}Windows Defender\\{1,2}Real-Time Protection'
  - id: defender-policy-registry-key-reference
    desc: Microsoft Defender policy registry key reference
    if:
      # Separators accept one or two backslashes: Python (and JSON) source
      # doubles them, so the runtime path `HKLM\SOFTWARE\...` is written
      # `HKLM\\SOFTWARE\\...` in code.
      type: text
      regex: '(?i)(HKLM[:\\]\\?|\b)SOFTWARE\\{1,2}Policies\\{1,2}Microsoft\\{1,2}Windows Defender\b'
