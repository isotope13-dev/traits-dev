defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: disable-lock-workstation-value
    desc: DisableLockWorkstation registry policy name
    if:
      type: text
      word: DisableLockWorkstation

  - id: disable-change-password-value
    desc: DisableChangePassword registry policy name
    if:
      type: text
      word: DisableChangePassword
