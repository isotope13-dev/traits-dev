# Windows Firewall authorized-applications list location. Programs listed
# under this key are exempt from firewall blocking; naming the list location
# identifies the exemption surface, while adding an entry requires a
# registry write API (see the write-chain composite beside this reference).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: windows-firewall-authorizedapps-path
    desc: Firewall authorized applications registry path
    if:
      type: text
      regex: '(?i)FirewallPolicy[\\]+(StandardProfile|DomainProfile)[\\]+AuthorizedApplications'
