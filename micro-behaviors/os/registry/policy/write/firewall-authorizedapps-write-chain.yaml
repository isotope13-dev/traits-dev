# Firewall authorized-applications list configured through the registry
# write chain: the list location plus open/create and value-write API
# references. Legitimate firewall management uses the INetFwPolicy2 API;
# carrying the raw list path with the write chain is direct registry tamper.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

composite_rules:
  - id: windows-firewall-authorizedapps-write-chain
    desc: Firewall authorized applications path with write API
    all:
      - id: micro-behaviors/os/registry/policy/reference::windows-firewall-authorizedapps-path
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
