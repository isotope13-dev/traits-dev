# Command assignments only: reading or clearing a blocking policy does not
# enable it. File-local location windows keep unrelated registry writes out.
defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp, csharp, go, rust]
  crit: notable
  conf: 0.98
  attack: T1112
traits:
  - id: update-policy-writer-command
    desc: Registry value setter command
    crit: component
    if:
      type: text
      regex: '(?i)\b(reg(\.exe)?\s+add|(Set|New)-ItemProperty)\b'
  - id: policy-command-value-one
    desc: Command sets registry data to one
    crit: component
    if:
      type: text
      regex: '(?i)(/d|-Value)\s+["'']?1(["'']|\b)'
  - id: no-auto-update-value-option
    desc: Names NoAutoUpdate policy
    crit: component
    if:
      type: text
      regex: '(?i)(/v|-Name)\s+["'']?NoAutoUpdate(["'']|\b)'
  - id: update-internet-block-value-option
    desc: Names update connection blocking policy
    crit: component
    if:
      type: text
      regex: '(?i)(/v|-Name)\s+["'']?DoNotConnectToWindowsUpdateInternetLocations(["'']|\b)'
  - id: update-access-disable-value-option
    desc: Names update access blocking policy
    crit: component
    if:
      type: text
      regex: '(?i)(/v|-Name)\s+["'']?DisableWindowsUpdateAccess(["'']|\b)'
composite_rules:
  - id: no-auto-update-enabled
    desc: Sets NoAutoUpdate policy to one
    near_lines: 0
    all:
      - id: update-policy-writer-command
      - id: policy-command-value-one
      - id: no-auto-update-value-option
      - id: micro-behaviors/os/registry/policy/reference::windows-update-policy-registry-path
  - id: update-internet-block-enabled
    desc: Sets update connection block to one
    near_lines: 0
    all:
      - id: update-policy-writer-command
      - id: policy-command-value-one
      - id: update-internet-block-value-option
      - id: micro-behaviors/os/registry/policy/reference::windows-update-policy-registry-path
  - id: update-access-disable-enabled
    desc: Sets update access block to one
    near_lines: 0
    all:
      - id: update-policy-writer-command
      - id: policy-command-value-one
      - id: update-access-disable-value-option
      - id: micro-behaviors/os/registry/policy/reference::windows-update-policy-registry-path
