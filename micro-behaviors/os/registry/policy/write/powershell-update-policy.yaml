defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.94
  attack: T1112
traits:
  - id: powershell-no-auto-update-property-one
    desc: PowerShell NoAutoUpdate value 1 command
    if:
      type: text
      regex: '(?im)^\s*New-ItemProperty[^#\n]{0,90}-Name\s+["'']?NoAutoUpdate["'']?\s+-Value\s+1([ \t]|$)'
  - id: powershell-auto-update-options-four
    desc: PowerShell AUOptions value 4 command
    if:
      type: text
      regex: '(?im)^\s*New-ItemProperty[^#\n]{0,90}-Name\s+["'']?AUOptions["'']?\s+-Value\s+4([ \t]|$)'
