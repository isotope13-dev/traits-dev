# Byte patterns in a serialized script; they do not assert execution.
defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.94
traits:
  - id: s0m-taskmgr-policy-value
    desc: Serialized DisableTaskMgr policy value bytes
    if:
      type: hex
      pattern: 'A4 44 69 73 61 62 6C 65 54 61 73 6B 4D 67 72 00 08 00 00 00 04 00 00 00 01 00 00 00'
  - id: s0m-registry-tools-policy-value
    desc: Serialized DisableRegistryTools value bytes
    if:
      type: hex
      pattern: 'A4 44 69 73 61 62 6C 65 52 65 67 69 73 74 72 79 54 6F 6F 6C 73 00 08 00 00 00 04 00 00 00 01 00 00 00'
  - id: s0m-control-panel-policy-value
    desc: Serialized NoControlPanel policy value bytes
    if:
      type: hex
      pattern: 'A4 4E 6F 43 6F 6E 74 72 6F 6C 50 61 6E 65 6C 00 08 00 00 00 04 00 00 00 01 00 00 00'
  - id: s0m-run-policy-value
    desc: Serialized NoRun policy value bytes
    if:
      type: hex
      pattern: 'A4 4E 6F 52 75 6E 00 08 00 00 00 04 00 00 00 01 00 00 00'
