defaults:
  platforms:
  - windows

composite_rules:
- id: taskmgr-policy-write-api-cooccurrence
  for: [pe, batch, csharp, vbs, powershell]
  desc: DisableTaskMgr name co-occurs with registry-write APIs
  crit: notable
  conf: 0.85
  all:
  - id: "micro-behaviors/os/registry/policy/reference::disable-taskmgr"
  any:
  - id: micro-behaviors/os/registry/value/write::registry-write-marker
  - id: micro-behaviors/os/registry/value/write::registry-managed-set-value-source
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  - id: micro-behaviors/os/registry/value/write::dotnet-registrykey-setvalue-references
  - id: micro-behaviors/os/registry/value/write::regwrite-dword-source
  - id: micro-behaviors/os/registry/value/write::powershell-registry-property-write

- id: cmd-policy-write-api-cooccurrence
  for: [pe, batch, csharp, powershell]
  desc: DisableCMD name co-occurs with registry-write APIs
  crit: notable
  conf: 0.9
  all:
  - id: "micro-behaviors/os/registry/policy/reference::disable-cmd"
  any:
  - id: micro-behaviors/os/registry/value/write::registry-write-marker
  - id: micro-behaviors/os/registry/value/write::registry-managed-set-value-source
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  - id: micro-behaviors/os/registry/value/write::dotnet-registrykey-setvalue-references
  - id: micro-behaviors/os/registry/value/write::powershell-registry-property-write

