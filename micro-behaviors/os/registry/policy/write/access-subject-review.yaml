defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: windows-firewall-authorizedapps-write-chain
  for:
  - pe
  desc: Firewall authorized apps registry write chain
  crit: notable
  conf: 0.92
  attack: T1562.004
  all:
  - id: micro-behaviors/os/registry/policy/reference::windows-firewall-authorizedapps-path
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  any:
  - id: micro-behaviors/os/registry/open::reg-open-key-w
  - id: micro-behaviors/os/registry/key/create::registry-create-key-api
- id: powershell-executionpolicy-write-chain
  desc: PowerShell execution-policy and registry-write APIs
  crit: notable
  conf: 0.94
  attack: T1112
  all:
  - id: micro-behaviors/os/registry/policy/reference::powershell-shellids-path
  - id: micro-behaviors/os/registry/value-name::powershell-executionpolicy-value
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  any:
  - id: micro-behaviors/os/registry/open::reg-open-key-w
  - id: micro-behaviors/os/registry/key/create::registry-create-key-api
  - id: micro-behaviors/os/registry/read::registry-query-value-api
