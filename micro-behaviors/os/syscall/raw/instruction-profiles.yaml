defaults:
  platforms: [linux, macos, windows]
  for: [pe, dll, elf, macho]
  attack: T1106
traits:
  - id: syscall-x64-instruction
    desc: Direct syscall instruction (x64)
    crit: notable
    conf: 0.8
    platforms:
      - linux
      - windows
    for:
      - pe
      - elf
    count_min: 8
    per_kb_min: 0.03
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 0F 05
    unless:
      - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: windows-direct-syscall-x64
    desc: Windows direct syscall instruction sequence
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    arch: [x86-64]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # Preserve the RCX-to-R10 form and recognize the variadic gateway:
      # RCX supplies EAX, RDX the argument count, and R8 supplies R10.
      # Both alternatives execute SYSCALL with the Windows argument ABI.
      pattern: '(49 89 CA 0F 05 | 48 89 C8 48 89 D1 48 89 74 24 F8 48 89 7C 24 F0 4D 89 C2 4C 89 CA 4C 8B 44 24 28 4C 8B 4C 24 30 48 83 E9 04 7E ?? 48 8D 74 24 38 48 8D 7C 24 28 F3 48 A5 0F 05 48 8B 74 24 F8 48 8B 7C 24 F0 C3)'
    unless:
      - id: metadata/binary/linking/runtime::ape-binary-marker
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: metadata/binary/linking/runtime::cosmopolitan-ape-runtime
      - id: metadata/binary/linking/runtime::cosmopolitan-marker
  - id: sysenter-instruction
    desc: Direct sysenter syscall
    crit: notable
    conf: 0.8
    platforms:
      - linux
      - windows
    for:
      - pe
      - elf
    count_min: 5
    per_kb_min: 0.03
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 0F 34
  - id: windows-x64-syscall-stub
    desc: Windows x64 syscall stub pattern
    crit: notable
    conf: 0.95
    platforms:
      - windows
    for:
      - pe
    if:
      type: hex
      section: text
      pattern: 4C 8B D1 B8 ?? ?? ?? 00 0F 05
    unless:
      - id: well-known/lib/crypto/workink::workink-key-validation-anti-tamper
  - id: dense-syscalls
    for: [elf, macho, pe]
    desc: High density of syscall instructions
    crit: notable
    conf: 0.85
    per_kb_min: 5.0
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 0F 05
composite_rules:
  - id: windows-direct-syscall-profile
    desc: Multiple Windows direct-syscall instruction patterns
    crit: notable
    conf: 0.95
    for:
      - pe
    platforms:
      - windows
    needs: 2
    any:
      - id: syscall-x64-instruction
      - id: sysenter-instruction
      - id: micro-behaviors/os/syscall/invoke::immediate-number-x86-64
      - id: windows-x64-syscall-stub
      - id: dense-syscalls
