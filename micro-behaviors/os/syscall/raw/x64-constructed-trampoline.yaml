defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.99
traits:
  - id: x64-ssn-dword-prologue-extraction
    desc: Extracts SSN after native-prologue check
    if:
      type: hex
      section: .text
      pattern: '41 8B 00 3D 4C 8B D1 B8 75 ?? 41 8B 40 04 C3'
  - id: x64-syscall-ret-word-scan
    desc: Scans memory for syscall-return opcode sequence
    if:
      type: hex
      section: .text
      pattern: 'BA 0F 05 00 00 8B D9 48 03 DF 66 39 13 75 ?? 80 7B 02 C3 74 ?? FF C1 83 F9 ?? 7C ??'
  - id: x64-push-ssn-indirect-trampoline-builder
    desc: Builds SSN indirect-jump trampoline
    if:
      type: hex
      section: .text
      # Emits push rcx; pop r10; push SSN; pop rax; jmp [rip+0],
      # followed by the located syscall gadget pointer. No SSN is fixed.
      pattern: 'C7 00 51 41 5A 68 89 70 04 66 C7 40 08 58 FF C6 40 0A 25 C7 40 0B 00 00 00 00 48 89 58 0F'
