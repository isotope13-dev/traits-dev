# SuperH/Linux direct system-call trap observations.
# A single trap is neutral; objective rules combine it with a tiny stripped
# ELF and protocol evidence when identifying a native downloader/stager.
defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: sh-trapa-syscall
    desc: SuperH direct system-call trap stub
    crit: notable
    conf: 0.98
    size_max: 500000
    if:
      type: hex
      section: ".text"
      # trapa #0x16 followed by the common uClibc/syscall return sequence.
      # Bare "16 C3" is too short for the hex matcher; keep the stub unique.
      pattern: "16 C3 (0E|0F) 91 03 68"
