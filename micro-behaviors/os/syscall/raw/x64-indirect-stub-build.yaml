defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-build-indirect-syscall-stub
    desc: Builds service-number and indirect-jump stub
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # Emit MOV R10,RCX; MOV EAX,ssn; JMP [RIP+0], followed by the
      # saved target address. This is construction, not observed invocation.
      pattern: 'C7 00 4C 8B D1 B8 89 48 04 66 C7 40 08 FF 25 C7 40 0A 00 00 00 00 48 89 50 0E'
