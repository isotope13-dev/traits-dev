defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: syscall-gadget-entropy-process-clues
    desc: Syscall gadget entropy and process clues
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/time/sleep/interval::sleep-dup
      - id: micro-behaviors/os/syscall/raw::syscall-ret-gadget
      - id: metadata/binary/symbols/count::imported-functions-under-80
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: metadata/binary/section/ratio::rdata-ratio-over-2pt5x
    any:
      - id: metadata/binary/provenance/build::unusual-pe-header-timestamp
      - id: metadata/binary/symbols/count::low-import-pe-without-heavy-rsrc
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
    unless:
      - id: metadata/signature/verified/platform::microsoft
