# RISC-V Linux direct syscall observations.  These are neutral capabilities;
# objective rules provide the intent when a syscall is correlated with
# procfs process filtering.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [riscv]

traits:
  - id: riscv-kill-syscall
    desc: RISC-V direct kill(2) syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "93 08 10 08 73 00 00 00"
  - id: riscv-socket-syscall
    desc: RISC-V direct socket syscall setup
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: ".text"
      pattern: "93 08 60 0C"
