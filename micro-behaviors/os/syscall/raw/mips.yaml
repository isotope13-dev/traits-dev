# Raw MIPS O32 syscall instruction. This is a neutral capability; intent is
# inferred only when it is composed with a specific operation or objective.
defaults:
  platforms: [unix, android]
  for: [elf]
  arch: [mips]
traits:
  - id: mips-direct-syscall-instruction-be
    desc: Big-endian MIPS direct system-call instruction
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      pattern: "00 00 00 0c"
    unless:
      # cleave normalizes unsupported ELF machine IDs to `unknown`; opcode
      # bytes alone must not classify an unknown-architecture ELF as MIPS.
      - type: value
        path: elf.machine
        exact: unknown
      - type: value
        path: elf.machine
        exact: s390
      # LoongArch binaries may contain this byte sequence as ordinary data.
      - type: value
        path: elf.machine
        exact: loongarch
      - type: value
        path: elf.endian
        exact: little
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-direct-syscall-instruction-le
    desc: Little-endian MIPS syscall instruction
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: ".text"
      pattern: "0c 00 00 00"
    unless:
      - type: value
        path: elf.machine
        exact: unknown
      - type: value
        path: elf.machine
        exact: s390
      - type: value
        path: elf.machine
        exact: loongarch
      - type: value
        path: elf.endian
        exact: big
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-o32-execve-syscall
    desc: Big-endian MIPS O32 direct execve syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "24 02 0f ab 00 00 00 0c"
    unless:
      - type: value
        path: elf.machine
        exact: unknown
      - type: value
        path: elf.machine
        exact: s390
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-o32-open-syscall
    desc: Big-endian MIPS O32 direct open syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "24 02 0f a5 00 00 00 0c"
    unless:
      - type: value
        path: elf.machine
