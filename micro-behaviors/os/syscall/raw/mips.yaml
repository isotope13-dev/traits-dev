      - type: value
        path: elf.machine
        exact: s390
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-o32-write-syscall
    desc: Big-endian MIPS O32 direct write syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "24 02 0f a4 00 00 00 0c"
    unless:
      - type: value
        path: elf.machine
        exact: unknown
      - type: value
        path: elf.machine
        exact: s390
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-o32-fork-syscall
    desc: Big-endian MIPS O32 direct fork syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "24 02 0f a2 00 00 00 0c"
    unless:
      - type: value
        path: elf.machine
        exact: unknown
      - type: value
        path: elf.machine
        exact: s390
      - type: metrics
        field: elf.parse_failed
        min: 1
  - id: mips-o32-unlink-syscall
    desc: Big-endian MIPS O32 direct unlink syscall
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: ".text"
      pattern: "24 02 0f aa 00 00 00 0c"
    unless:
      - type: value
        path: elf.machine
