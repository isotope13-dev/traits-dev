defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-resolver-preserved-arguments-syscall
    desc: Resolves syscall with preserved arguments
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      # Discard wrapper return, save four NT arguments, resolve EAX, then
      # restore arguments and execute syscall directly. RIP deltas vary.
      pattern: '58 48 89 4C 24 08 48 89 54 24 10 4C 89 44 24 18 4C 89 4C 24 20 48 83 EC 28 8B 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 83 C4 28 48 8B 4C 24 08 48 8B 54 24 10 4C 8B 44 24 18 4C 8B 4C 24 20 4C 8B D1 0F 05 C3'
