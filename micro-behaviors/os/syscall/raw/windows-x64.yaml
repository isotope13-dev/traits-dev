defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1106
  mbc: F0004
traits:
- id: syscall-ret-gadget
  desc: syscall; ret gadget (0F 05 C3)
  crit: notable
  conf: 0.8
  arch:
  - x86-64
  size_max: 5000000
  if:
    type: hex
    section: .text
    pattern: 0f 05 c3
  unless:
  - id: metadata/signed/platform/
- id: ssn-stub-validation
  desc: Syscall stub signature check (4C/B8)
  crit: component
  conf: 0.9
  arch:
  - x86-64
  size_max: 5000000
  if:
    type: hex
    section: .text
    pattern: 80 3? 4C 8B D1 B8
# Runtime variant: instead of an inline cmp/mov stub check, the code loads
# candidate bytes (movzx) and compares them against the stub prologue
# constants (0x4C at offset 0, 0xB8 at offset 3) before reading the SSN at
# +4 — the byte-compare shape used when walking a resolved ntdll stub.
- id: ssn-stub-runtime-bytecheck
  desc: Runtime byte-check of syscall stub prologue
  crit: notable
  conf: 0.9
  arch:
  - x86-64
  size_max: 5000000
  if:
    type: hex
    section: .text
    pattern: 0f b6 0? 83 f8 4c [0-24] 0f b6 4? 03 3d b8
# Hunting for a `syscall; ret` gadget by scanning memory and comparing
# loaded bytes against the opcode constants (0x05, then 0xC3) — the runtime
# analogue of an inline 0F 05 C3 sequence, used to build indirect syscalls.
- id: syscall-gadget-byte-scan
  desc: Byte-scan for syscall;ret gadget constants
  crit: notable
  conf: 0.85
  arch:
  - x86-64
  size_max: 5000000
  if:
    type: hex
    section: .text
    pattern: 83 f8 05 75 [0-12] 0f b6 4? 0? [0-1] 3d c3 00 00 00
- id: mov-eax-syscall
  desc: mov eax, imm32; syscall pattern
  crit: component
  conf: 0.85
  arch:
  - x86-64
  count_min: 2
  if:
    type: hex
    section: .text
    pattern: b8 ?? ?? 00 00 [0-10] 0f 05
- id: nt-write-ssn
  desc: NtWriteVirtualMemory API name reference
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: NtWriteVirtualMemory
- id: nt-create-thread-ssn
  desc: NtCreateThreadEx API name reference
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: NtCreateThreadEx
- id: nt-protect-ssn
  desc: NtProtectVirtualMemory API name reference
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: NtProtectVirtualMemory
# Stack-constructed consecutive NT memory API names (common in direct-syscall
# loaders that avoid import tables). Distinct from separate plaintext refs.
- id: nt-alloc-protect-stack-pair
  desc: Stack-built NtAllocate and NtProtect pair
  crit: suspicious
  conf: 0.92
  if:
    type: encoded
    encoding: stack
    substr: NtAllocateVirtualMemoryNtProtectVirtualMemory
- id: nt-query-info-ssn
  desc: NtQueryInformationProcess API reference
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: NtQueryInformationProcess
  unless:
  - id: well-known/tool/development/fzf::fzf-binary
- id: nt-open-process-ssn
  desc: NtOpenProcess syscall setup
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: NtOpenProcess
  downgrade:
    any:
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
- id: ssn-resolution-str
  desc: Direct-syscall SSN resolver string
  crit: suspicious
  conf: 0.85
  if:
    type: text
    # Direct-syscall resolvers commonly expose GetSSN/FindSSN/ResolveSSN
    # names.  Do not match FindSSNs...: that is a common Social Security
    # Number detector spelling.
    regex: (?i)\b(get|find|resolve)[_-]?ssn($|[^s])
  unless:
  - id: metadata/binary/framework::dotnet-metadata
- id: syscall-stub-str
  desc: Syscall stub string indicator
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)syscall.?stub
- id: direct-syscall-pattern-cond-0--inline-7330
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    substr: supR3Hardened
  count_max: 1007331
composite_rules:
- id: nt-functions-set
  desc: Multiple Nt* syscall functions referenced
  needs: 3
  any:
  - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
  - id: nt-write-ssn
  - id: nt-create-thread-ssn
  - id: nt-protect-ssn
  - id: nt-query-info-ssn
  - id: nt-open-process-ssn
- id: direct-syscall-pattern
  desc: Direct syscall invocation pattern
  crit: notable
  conf: 0.9
  all:
  - id: syscall-ret-gadget
  - id: mov-eax-syscall
  - id: nt-functions-set
  downgrade:
    any:
    - id: direct-syscall-pattern-cond-0--inline-7330
  unless:
  - id: metadata/binary/metrics/threshold::many-exports-200
  - id: metadata/signed/platform/
