defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-stack-builds-indirect-syscall-gateway
    desc: Builds syscall prologue and indirect jump
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # MOV R10,RCX; MOV EAX,<SSN>; JMP [RIP+0]. Both stack vectors
      # are copied to the returned gateway. No execution is asserted.
      pattern: 'C7 44 24 ?? 4C 8B D1 B8 89 54 24 ?? C7 44 24 ?? FF 25 00 00 66 C7 44 24 ?? 00 00 0F 10 44 24 ?? 48 89 0D ?? ?? ?? ?? 0F 11 00 0F 11 48 10'
