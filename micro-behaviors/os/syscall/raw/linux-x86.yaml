defaults:
  for: [elf]
  platforms: [linux]
  crit: notable
  conf: 0.86
  arch: [x86]

traits:
  - id: x86-interrupt-or-sysenter-literal
    desc: x86 interrupt or fast-entry assembly literal
    crit: notable
    conf: 0.85
    for: [c]
    if:
      type: text
      regex: '"(int\s+\$?0x80|sysenter)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/package/license::linux-syscall-note-license
  - id: x86-int80-wrapper
    desc: x86 int80 syscall wrapper
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: ".text"
      # Accept direct return, errno epilogues, and libc trampoline fallbacks.
      pattern: "(8B 44 24 14 CD 80 5B 5E 5F 5D C3|8B 44 24 14 CD 80 5B 5E 5F 5D 3D 01 F0 FF FF 0F 83 ?? ?? ?? ?? C3|85 C0 74 06 50 8B 44 24 08 C3 8B 44 24 04 CD 80 C3)"
  - id: i386-prctl-setname-markers
    desc: i386 prctl PR_SET_NAME code markers
    crit: notable
    conf: 0.85
    if:
      type: hex
      section: ".text"
      pattern: "6A 0F [0-16384] B8 AC 00 00 00"
