defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-hard-error-shutdown-call
    desc: Calls NtRaiseHardError with OptionShutdownSystem
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|[.])_?NtRaiseHardError$'
      arg:
        index: 4
        kind: number
        value: 6
