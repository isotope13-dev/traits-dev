# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: ptrace-traceme-syscall
    desc: Requests tracing by the parent process
    crit: notable
    if:
      type: syscall
      name: [ptrace]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          value: 0
  - id: ptrace-attach-syscall
    desc: Requests attachment to another process
    crit: notable
    if:
      type: syscall
      name: [ptrace]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          value: 16
  - id: ptrace-seize-syscall
    desc: Requests non-stopping process attachment
    crit: notable
    if:
      type: syscall
      name: [ptrace]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          value: 16902
  - id: ptrace-pokedata-syscall
    desc: Requests a traced-process data write
    crit: notable
    if:
      type: syscall
      name: [ptrace]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          value: 5
  - id: ptrace-poketext-syscall
    desc: Requests a traced-process text write
    crit: notable
    if:
      type: syscall
      name: [ptrace]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          value: 4
  - id: ptrace-setregs-syscall
    desc: Requests replacement of traced registers
    crit: notable
    if:
      type: syscall
      name: [ptrace]
      arch: [x86_64]
      args:
        - index: 0
          value: 13
  - id: ptrace-setregset-syscall
    desc: Requests a traced-process register-set write
    crit: notable
    if:
      type: syscall
      name: [ptrace]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          value: 16901
