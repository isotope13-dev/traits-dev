# ARM Direct Execution Syscalls
# Detects hand-written ARM assembly making direct I/O syscalls
# ATT&CK: T1059 (Command and Scripting Interpreter)
defaults:
  platforms: [unix, android]
  for: [elf]
  crit: notable
traits:
  - id: svc-linux-arm64
    desc: Linux ARM64 direct SVC syscall instruction
    crit: notable
    conf: 0.85
    platforms: [linux]
    arch: [aarch64]
    count_min: 8
    per_kb_min: 0.03
    if:
      type: hex
      section: text
      pattern: "01 00 00 D4"
    unless:
      # GPU code objects can expose an ELF text section without implementing
      # the ARM64 ISA; byte coincidences there are not system calls.
      - type: value
        path: elf.machine
        exact: unknown
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
  - id: svc-read
    desc: "ARM direct read(2) syscall"
    if:
      type: hex
      section: ".text"
      # mov r7, 3 (read); svc 0
      pattern: "03 70 a0 e3 00 00 00 ef"
  - id: svc-write
    desc: "ARM direct write(2) syscall"
    if:
      type: hex
      section: ".text"
      # mov r7, 4 (write); svc 0
      pattern: "04 70 a0 e3 00 00 00 ef"
  # Thumb stagers dispatch syscalls through the libc `syscall()` wrapper
  # instead of a direct SVC: `movs r0, #11` (execve) followed by a BL/BLX to
  # the PLT stub. The immediate load plus a branch-and-link within a few
  # bytes is compiler-emitted but only meaningful when the loaded number is
  # a syscall opcode.
  - id: execve-syscall-wrapper-thumb
    desc: "execve dispatched via syscall wrapper (Thumb)"
    platforms: [linux, android]
    arch: [arm]
    if:
      type: hex
      section: ".text"
      pattern: "0B 20 ?? F? ?? E?"
