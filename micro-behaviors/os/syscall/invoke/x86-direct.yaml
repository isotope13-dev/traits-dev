defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [elf, pe]

traits:
  - id: immediate-number-x86-64
    desc: Invokes x86-64 syscall by immediate number
    size_max: 10485760
    count_min: 2
    per_kb_min: 0.002
    if:
      type: hex
      section: text
      pattern: B8 ?? ?? ?? ?? 0F 05
