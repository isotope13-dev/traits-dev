defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_min: 16
  size_max: 2048

traits:
  - id: dos-lodsw-before-int21
    desc: DOS word load precedes INT 21h
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "AD [0-12] CD 21"

  - id: dos-lodsw-dx-dispatch-loop
    for: [dos_com, data]
    desc: DOS word-load loop computes interrupt argument
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "AD 99 8A D0 D1 E2 [0-16] CD 21 93 EB"

  - id: dos-int21-handle-exchange-loop
    desc: Tiny DOS interrupt loop exchanges AX/BX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "CD 21 [0-2] 93 [0-8] (EB|73|72|75|E9)"
