traits:
- id: sys-memfd-create-constant
  desc: References the memfd_create syscall constant
  crit: notable
  conf: 0.6
  for:
  - scripts
  - pe
  - macho
  if:
    type: string_literal
    substr: SYS_memfd_create
  unless:
  - id: well-known/tool/offensive/pwntools::pwntools-distribution
- id: syscall-319-call
  desc: Calls syscall with number 319
  crit: notable
  conf: 0.4
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: syscall\s*\(\s*319
composite_rules: []
defaults:
  platforms:
  - unix
  - windows
