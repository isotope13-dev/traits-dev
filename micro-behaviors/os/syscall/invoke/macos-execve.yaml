# The current analyzer emits direct syscall records for ELF only. Keep the
# Mach-O rule explicit for a future producer; no Mach-O match is assumed today.
defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: syscall-execve-macos
    desc: macOS execve syscall record
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: [execve]
