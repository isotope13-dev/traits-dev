defaults:
  for: [elf]
  platforms: [linux]
  arch: [arm]
  crit: notable

traits:
  - id: arm-variadic-syscall-dispatch
    desc: ARM variadic syscall argument forwarding and SVC
    conf: 0.99
    if:
      type: hex
      offset_range: [0, null]
      # libc syscall(number, ...): save r4-r7, shift the register arguments,
      # load remaining arguments from the original stack, and enter Linux.
      # Works on stripped and truncated images without section headers.
      pattern: "0D C0 A0 E1 F0 00 2D E9 00 70 A0 E1 01 00 A0 E1 02 10 A0 E1 03 20 A0 E1 78 00 9C E8 00 00 00 EF F0 00 BD E8"
