defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: bsd-syscall-argument-access
  desc: Extracts BSD syscall arguments
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [c]
  if:
    type: symbol
    exact: SCARG
- id: ntdll-import
  desc: Direct NT API access
  crit: baseline
  conf: 0.85
  for: [pe, dll, python]
  if:
    type: text
    substr: ntdll
- id: nt-raise-hard-error-reference
  desc: NtRaiseHardError API reference
  crit: notable
  conf: 0.98
  for: [pe, dll, python]
  if:
    type: text
    substr: NtRaiseHardError
- id: ntdll-direct-process-op
  desc: Nt process/thread API import
  crit: notable
  conf: 0.9
  if:
    type: symbol
    regex: ^Nt(Create|Open)(Process|Thread)(Ex)?$
  downgrade:
    any:
    - type: metrics
      field: exports.count
      min: 256
- id: encode-pointer
  desc: Pointer value encoding
  crit: baseline
  conf: 0.85
  if:
    type: symbol
    exact: EncodePointer
- id: linux-vdso-symbol
  desc: References a Linux VDSO entry-point name
  crit: notable
  conf: 0.95
  platforms:
    - linux
  for:
    - elf
  if:
    type: text
    regex: __vdso_[a-z_]+
  # Go embeds VDSO entry names as near-universal runtime inventory.
  # The name does not establish a call site in the analyzed program.
  downgrade:
    any:
      - id: metadata/lang/compiler/systems::go-binary
- id: taskstats-pid-attribute
  desc: TaskStats PID attribute reference
  crit: notable
  conf: 0.8
  platforms:
  - unix
  for:
  - c
  - elf
  if:
    type: text
    substr: TASKSTATS_CMD_ATTR_PID
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
