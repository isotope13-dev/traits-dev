defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: bsd-syscall-argument-access
  desc: Extracts BSD syscall arguments
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [c]
  if:
    type: symbol
    exact: SCARG
- id: ntdll-import
  desc: Direct NT API access
  crit: baseline
  conf: 0.85
  for: [pe, dll, python]
  if:
    type: text
    substr: ntdll
- id: nt-raise-hard-error-reference
  desc: NtRaiseHardError API reference
  crit: notable
  conf: 0.98
  for: [pe, dll, python]
  if:
    type: text
    substr: NtRaiseHardError
# Source-side sibling of ntdll-import: naming the module is how C/C++/C#/Go/
# Rust/Python/PowerShell source reaches the NT API surface at all. Relocated
# from objectives/evasion/anti-av/ntdll-unhook, where every program that
# resolves RtlGetVersion through ntdll.dll — OpenSCAP's system_info probe among
# them — earned an AV-evasion feature for an ordinary module lookup.
- id: ntdll-module-name-source
  desc: Source names the ntdll.dll module
  crit: notable
  conf: 0.9
  for: [c, cpp, csharp, go, rust, python, powershell]
  if:
    type: text
    regex: '(?i)\bntdll\.dll\b'
  unless:
  - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
- id: ntdll-direct-process-op
  desc: Nt process/thread API import
  crit: notable
  conf: 0.9
  if:
    type: symbol
    regex: ^Nt(Create|Open)(Process|Thread)(Ex)?$
  downgrade:
    any:
    - type: metrics
      field: exports.count
      min: 256
- id: encode-pointer
  desc: Pointer value encoding
  crit: baseline
  conf: 0.85
  if:
    type: symbol
    exact: EncodePointer
- id: linux-vdso-symbol
  desc: __vdso exported symbol string
  crit: baseline
  conf: 0.95
  platforms:
    - linux
  for:
    - elf
  if:
    type: text
    regex: __vdso_[a-z_]+
  # Go's runtime calls __vdso_clock_gettime directly, so the symbol ships in
  # every Go binary; on its own it is runtime inventory, not a syscall claim.
  downgrade:
    any:
      - id: metadata/lang/compiler/systems::go-binary
- id: taskstats-pid-attribute
  desc: TaskStats PID attribute reference
  crit: notable
  conf: 0.8
  platforms:
  - unix
  for:
  - c
  - elf
  if:
    type: text
    substr: TASKSTATS_CMD_ATTR_PID
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
