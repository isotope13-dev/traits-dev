defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: ntdll-import
  desc: Direct NT API access
  crit: baseline
  conf: 0.85
  for: [pe, dll, python]
  if:
    type: text
    substr: ntdll
- id: nt-raise-hard-error-reference
  desc: NtRaiseHardError API reference
  crit: notable
  conf: 0.98
  for: [pe, dll, python]
  if:
    type: text
    substr: NtRaiseHardError
# Source-side sibling of ntdll-import: naming the module is how C/C++/C#/Go/
# Rust/Python/PowerShell source reaches the NT API surface at all. Relocated
# from objectives/evasion/anti-av/ntdll-unhook, where every program that
# resolves RtlGetVersion through ntdll.dll — OpenSCAP's system_info probe among
# them — earned an AV-evasion feature for an ordinary module lookup.
- id: ntdll-module-name-source
  desc: Source names the ntdll.dll module
  crit: notable
  conf: 0.9
  for: [c, cpp, csharp, go, rust, python, powershell]
  if:
    type: text
    regex: '(?i)\bntdll\.dll\b'
  unless:
  - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
- id: all-ones-handle-constant
  desc: All-ones x64 handle constant
  crit: component
  conf: 0.8
  arch:
  - x86-64
  count_min: 2
  if:
    type: hex
    section: .text
    pattern: 48 C7 C1 FF FF FF FF
  unless:
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/nvidia::ngx-dll-basename
- id: ntdll-direct-process-op
  desc: Nt process/thread API import
  crit: notable
  conf: 0.9
  if:
    type: symbol
    regex: ^Nt(Create|Open)(Process|Thread)(Ex)?$
  downgrade:
    any:
    - type: metrics
      field: exports.count
      min: 256
- id: encode-pointer
  desc: Pointer value encoding
  crit: baseline
  conf: 0.85
  if:
    type: symbol
    exact: EncodePointer
- id: linux-vdso-symbol
  desc: __vdso exported symbol string
  crit: component
  conf: 0.95
  platforms:
    - linux
  for:
    - elf
  if:
    type: text
    regex: __vdso_[a-z_]+
- id: taskstats-pid-attribute
  desc: TaskStats PID attribute reference
  crit: notable
  conf: 0.8
  platforms:
  - unix
  for:
  - c
  - elf
  if:
    type: text
    substr: TASKSTATS_CMD_ATTR_PID
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

composite_rules:
# NtAllocateVirtualMemory is deliberately absent: reserving or reprotecting
# memory through the NT layer is normal for runtimes and allocators. Keep those
# names notable in os/syscall/raw; a direct ntdll memory write is the stronger
# cross-process signal.
- id: ntdll-direct-memory-op-a
  desc: Direct NT virtual-memory write
  crit: suspicious
  conf: 0.9
  mbc: C0021
  all:
    - id: ntdll-import
    - id: micro-behaviors/os/syscall/raw::nt-write-ssn
  unless:
    # Wine/ReactOS builtins implement these NT syscalls (ntdll/kernelbase) — they
    # provide the API, not abuse it, so suppress rather than merely downgrade.
    - id: metadata/binary/vendor/
    - id: well-known/tool/sysadmin/chroot-win/
    - id: well-known/app/development/wu-framework::wu-framework-native-cli
    - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
    - id: well-known/app/system/iobit::iobit-component-context
    - id: well-known/tool/reverse-engineering/
    - id: well-known/app/utility/locale-emulator::locale-emulator-native-context
  downgrade:
    any:
    - type: metrics
      field: exports.count
      min: 256
    - id: well-known/tool/sysadmin/systeminformer::systeminformer-product
