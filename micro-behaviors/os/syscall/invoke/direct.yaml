defaults:
  platforms: [windows, unix]
  attack: T1106
traits:
  - id: syscall-definitions-header
    desc: Includes system syscall definitions
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: symbol
      kind: import
      exact: sys/syscall.h
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: nr-getdents
    desc: Direct __NR_getdents syscall reference
    crit: component
    conf: 0.9
    for:
      - c
      - elf
    if:
      type: text
      substr: __NR_getdents
  - id: nr-getdents64
    desc: Direct __NR_getdents64 syscall reference
    crit: component
    conf: 0.9
    for:
      - c
      - elf
    if:
      type: text
      substr: __NR_getdents64
  - id: nr-openat
    desc: Direct __NR_openat syscall reference
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      substr: __NR_openat
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: metadata/file/string/artifact::linux-syscall-note-license
      - id: metadata/lang/source::linux-kernel-header-source-path
  - id: nr-close
    desc: Direct __NR_close syscall reference
    crit: baseline
    conf: 0.5
    for:
      - c
      - elf
    if:
      type: text
      substr: __NR_close
  - id: syscall-fn
    desc: Direct syscall() function invocation
    crit: notable
    conf: 0.85
    for:
      - c
    if:
      type: symbol
      kind: call
      exact: syscall
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: go-syscall-wrapper-call
    desc: Go syscall wrapper call
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(?i)^syscall\.(Syscall|Syscall6|RawSyscall|RawSyscall6)$'
  - id: go-readv-syscall-reference
    desc: Go readv scatter-gather syscall reference
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: symbol
      kind: member
      exact: syscall.SYS_READV
  - id: python-dot-syscall
    desc: Python .syscall() method invocation
    crit: notable
    conf: 0.6
    for:
      - python
    if:
      type: text
      substr: .syscall(
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: libc-syscall
    desc: Raw syscall via libc binding
    crit: notable
    conf: 0.5
    for:
      - scripts
      - binaries
    if:
      type: string_literal
      substr: libc.syscall
  - id: dirent64-struct
    desc: struct dirent64 usage
    crit: component
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      substr: dirent64
  - id: d-reclen-field
    desc: d_reclen field access
    crit: component
    conf: 0.85
    for:
      - c
      - elf
    if:
      type: text
      substr: d_reclen
  - id: d-reclen-modification
    desc: d_reclen field modification
    crit: component
    conf: 0.9
    for:
      - c
      - elf
    if:
      type: text
      regex: \bd_reclen\s*([+\-*/|&^]?=|\+\+|--)
  - id: d-name-field
    desc: d_name field access
    crit: baseline
    conf: 0.5
    for:
      - c
      - elf
    if:
      type: text
      word: d_name
  - id: linux-uinteger-alias-reference
    desc: Linux __u integer alias references in source
    crit: component
    conf: 0.6
    for: [c, cpp]
    if:
      type: text
      regex: \b__u(8|16|32|64)\b
  - id: export-symbol-macro
    desc: EXPORT_SYMBOL macro
    crit: baseline
    conf: 0.95
    for:
      - c
      - elf
    if:
      type: text
      substr: EXPORT_SYMBOL(
  - id: syscall-define-macro
    desc: SYSCALL_DEFINE macro
    crit: baseline
    conf: 0.95
    for:
      - c
      - elf
    if:
      type: text
      regex: \bSYSCALL_DEFINE\d+\b
  - id: dir-context-struct
    desc: Linux dir_context struct
    crit: baseline
    conf: 0.95
    for:
      - c
      - elf
    if:
      type: text
      substr: struct dir_context
  # Anchored two levels deep: a bare `include/`, `net/` or `kernel/` segment
  # occurs in most C projects and would make this a blanket suppressor, whereas
  # include/linux and include/uapi name the Linux kernel's own header tree.
  - id: kernel-header-tree-path
    desc: Linux kernel include/linux header tree path
    crit: baseline
    conf: 0.99
    for:
      - c
      - elf
    if:
      type: path
      regex: '(^|[\\/])include[\\/](linux|uapi)'
  - id: linux-kernel-tree-path-mmfs
    desc: Linux kernel mm/fs/lib tree path
    crit: baseline
    conf: 0.98
    for: [c, elf, shell, python]
    if:
      type: path
      # A bare `lib/` (or `fs/`, `mm/`, etc.) directory is common in ordinary
      # projects and package layouts. Require a Linux/kernel source-tree root
      # before treating the component as kernel context.
      regex: '(^|[\\/])(linux|kernel)(-[a-z0-9_.-]+)?[\\/](block|fs|mm|lib)\b'
  - id: linux-kernel-extra-tree-directory
    desc: Linux-kernel extra-tree directory component
    crit: baseline
    conf: 0.98
    for: [c, elf, shell, python]
    if:
      type: path
      regex: '(^|[\\/])(crypto|sound|virt|tools|init|ipc)([\\/]|$)'
  - id: linux-kernel-tree-path-scripts
    desc: Linux kernel source-tree directory marker
    crit: baseline
    conf: 0.98
    for: [c, elf, shell, python]
    if:
      type: path
      # A fixture directory named `samples` is not kernel context. Match the
      # distinctive Linux/kernel source-tree root instead. Kept shallow (≤2 '/'
      # in the pattern so it matches the same inside an archive or on disk): a
      # bare `linux`/`kernel` component prefix already catches versioned roots
      # (linux-6.1, kernel-source), and this baseline marker is always AND-gated
      # by a genuine in-tree marker in linux-kernel-source-context.
      # Require the complete root directory component. Without the trailing
      # separator, ordinary paths such as linux_mint/ or kernel-tools/ were
      # mistaken for the kernel tree and suppressed unrelated source traits.
      regex: '(^|[\\/])(linux|kernel)(-[a-z0-9_.-]+)?[\\/]'
  # Windows NT native API (ntdll Nt*/Zw*) names appearing in source. These are
  # the userland syscall stubs, so naming them is the source-level equivalent
  # of a direct syscall -- but naming them is all this detects. Windows
  # internals projects, ReactOS/Wine, debuggers, and reverse-engineering tools
  # that ship syscall tables (radare2 carries the full ntdll table in
  # share/radare2/<ver>/syscall/windows-x86-*.sdb) all reference them, so the
  # EDR-bypass reading belongs to the co-location composite in
  # objectives/evasion/anti-av/syscall/, not to these atoms.
  - id: nt-native-memory-api-source
    desc: Source names ntdll virtual-memory syscall stubs
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [c, cpp, csharp, go, rust, python]
    if:
      type: text
      regex: '(?i)\bNt(AllocateVirtualMemory|ProtectVirtualMemory|WriteVirtualMemory)\b'

  - id: nt-native-thread-api-source
    desc: Source names ntdll thread-context syscall stubs
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [c, cpp, csharp, go, rust, python]
    if:
      type: text
      regex: '(?i)\bNt(GetContextThread|SetContextThread|ResumeThread)\b'

composite_rules:
  - id: linux-kernel-tree-path-extra
    desc: Linux kernel crypto/sound/tools tree path
    crit: baseline
    conf: 0.98
    all:
      - id: linux-kernel-tree-path-scripts
      - id: linux-kernel-extra-tree-directory

  - id: direct-getdents
    desc: Direct getdents syscall bypassing libc
    crit: suspicious
    conf: 0.95
    for:
      - c
      - elf
    all:
      - id: syscall-fn
    any:
      - id: nr-getdents
      - id: nr-getdents64
    unless:
      - id: well-known/lib/native/dietlibc::source-tree-path
      - id: well-known/lib/native/box64/
  - id: dirent-manipulation
    desc: Dirent structure manipulation
    crit: suspicious
    conf: 0.9
    for:
      - c
      - elf
    all:
      - id: dirent64-struct
      - id: d-reclen-modification
    unless:
      - id: micro-behaviors/os/kernel/headers::kernel-module-include-detect
      - id: kernel-module-spdx-license-header
      - id: syscall-define-macro
      - id: dir-context-struct
      - id: well-known/lib/native/glibc
      - id: well-known/lib/native/dietlibc::source-tree-path
      - id: well-known/lib/native/vsi-preload::virtual-filesystem-preload-wrapper-context
      - id: metadata/package/testing/compiled::c-test-framework-marker
      - id: well-known/lib/native/box64/
  - id: linux-kernel-tree-path-any
    desc: Linux kernel source tree path (any top-level)
    crit: baseline
    conf: 0.99
    for: [c, elf, shell, python]
    any:
      - id: metadata/lang/source::linux-kernel-source-tree-path
      - id: linux-kernel-tree-path-mmfs
      - id: linux-kernel-tree-path-extra
      - id: linux-kernel-tree-path-scripts
  - id: linux-kernel-source-context
    desc: Linux kernel source context
    crit: baseline
    conf: 0.99
    for:
      - c
      - elf
    # Evidence never pools across archive members for `unless:` — suppression
    # resolves per-file — so both legs must hold in the file being cleared.
    #
    # A kernel-tree PATH ALONE is not context: `linux-kernel-tree-path-any`
    # accepts ~22 near-universal directory names (lib, fs, net, tools, usr,
    # scripts, include...), so any project has one. It must always be paired
    # with a marker that only genuinely in-tree code carries.
    #
    # The marker list is deliberately short. An SPDX line, `<linux/module.h>`
    # and a bare `<linux/*.h>` include are all present in EVERY out-of-tree LKM
    # rootkit, so accepting them as "this is in-tree kernel source" hands an
    # attacker a one-line bypass of the whole kernel-hide family. Only markers
    # an out-of-tree module has no reason to carry qualify: the kernel's own
    # header tree, EXPORT_SYMBOL, SYSCALL_DEFINE, or struct dir_context.
    all:
      - id: linux-kernel-tree-path-any
    needs: 1
    any:
      - id: kernel-header-tree-path
      - id: export-symbol-macro
      - id: syscall-define-macro
      - id: dir-context-struct
  # A release-tree source file carries the GPL SPDX header even when it does
  # not contain one of the stronger in-tree-only markers above. Keep this
  # context separate so adding it does not expand every existing suppressor
  # that references linux-kernel-source-context.
  - id: linux-kernel-spdx-source-context
    desc: Linux kernel tree path with GPL SPDX header
    crit: baseline
    conf: 0.99
    for: [c, elf, shell, python]
    all:
      - id: linux-kernel-tree-path-any
      - id: metadata/package/license::gpl-2-spdx-identifier
  - id: kernel-module-spdx-license-header
    desc: Kernel module source SPDX license header
    crit: baseline
    conf: 0.99
    for: [c, cpp, elf]
    any:
      - id: metadata/package/license::gpl-2-spdx-identifier
      - id: metadata/file/string/artifact::cddl-spdx-header
