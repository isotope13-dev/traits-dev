# A terminated native-API lookup name is distinct from a parsed import/symbol.
# The rootkit resolves this target with GetProcAddress rather than importing it.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: nt-query-system-information-cstring
    desc: Nt/ZwQuerySystemInformation C-string reference
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(Nt|Zw)QuerySystemInformation\x00'
