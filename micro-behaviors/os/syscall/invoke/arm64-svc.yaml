# ARM64 supervisor-call instruction bytes (composite leg for obfuscation rules)
defaults:
  platforms: [macos, linux]
  for: [macho, elf]
  crit: component
  conf: 0.3

traits:
  - id: svc-hex-pattern
    desc: ARM64 svc instruction bytes in text
    count_min: 4
    unless:
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-bundle-runtime-marker
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-platform-archive
      - id: well-known/lib/runtime/scripted/bun-runtime::unix-runtime-context
      - id: metadata/binary/section/name::bun-section-name
      - id: well-known/lib/network/push-rocks::smartmta-rust-mailer-binary-path
      - id: well-known/lib/network/push-rocks::smartnetwork-rustnetwork-binary-path
    if:
      type: hex
      pattern: "01 00 00 d4"
      section: "text"
