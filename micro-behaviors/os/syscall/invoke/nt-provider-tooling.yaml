# Benign-context group for legitimate Windows tooling that implements the NT
# native API rather than abusing it. Sandboxie isolates processes through NT
# syscall virtualization, IObit and Locale Emulator ship signed helpers that
# walk the same surfaces, and the Wu Framework CLI links ntdll directly. Each
# member is an individually-recognized benign identity; grouping them lets the
# NT-syscall rules name one suppression instead of growing past the budget.
composite_rules:
  - id: nt-api-provider-tooling
    desc: Legitimate NT API provider tooling context
    crit: exception
    conf: 0.98
    platforms: [windows]
    for: [pe, dll]
    any:
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
      - id: well-known/app/system/iobit::iobit-component-context
      - id: well-known/app/utility/locale-emulator::locale-emulator-native-context
      - id: well-known/app/development/wu-framework::wu-framework-native-cli
