defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
traits:
  - id: ptrace-import
    desc: Imports ptrace process-tracing API
    conf: 0.8
    platforms: [linux, macos, android]
    for: [elf, macho]
    if:
      type: import
      exact: "ptrace"
    downgrade:
      any:
        - id: metadata/signed/entitlements::debugger
        - id: metadata/signed/platform::apple
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
  - id: ptrace-pokedata-constant-reference
    desc: References PTRACE_POKEDATA operation constant
    conf: 0.9
    for: [elf, c, cpp]
    if:
      type: text
      substr: PTRACE_POKEDATA
    unless:
      - id: metadata/file/catalog/identity::linux-ptrace-system-header
  - id: ptrace-dup
    desc: Invokes ptrace system call directly
    conf: 0.85
    if:
      type: syscall
      name: ["ptrace"]
    unless:
      # Recovered numbers resolve through the Linux table, which is wrong
      # for BSD kernels: a BSD OSABI number resolving to a Linux-only name
      # is an ordinary BSD syscall mislabelled, not process tracing.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: process-memory-read
    desc: Reads another process memory
    conf: 0.9
    if:
      type: syscall
      name: [process_vm_readv]
    unless:
      # Same Linux-table caveat as ptrace-dup above: process_vm_readv is
      # Linux-only, so this name on a BSD OSABI binary is unsound.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: process-memory-write
    desc: Writes another process memory
    conf: 0.9
    if:
      type: syscall
      name: [process_vm_writev]
    unless:
      # Same Linux-table caveat as ptrace-dup above: process_vm_writev is
      # Linux-only, so this name on a BSD OSABI binary is unsound.
      - id: metadata/vendor/identity::bsd-elf-osabi
composite_rules:
  - id: process-memory-access
    desc: Accesses another process memory
    conf: 0.9
    any:
    - id: process-memory-read
    - id: process-memory-write
