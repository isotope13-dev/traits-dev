defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: ptrace-import
    desc: Imports ptrace process-tracing API
    conf: 0.8
    crit: notable
    platforms: [linux, macos, android]
    for: [elf, macho]
    if:
      type: import
      exact: "ptrace"
    downgrade:
      any:
        - id: metadata/signed/entitlements::debugger
        - id: metadata/signed/platform::apple
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
  - id: ptrace-pokedata-constant-reference
    desc: References PTRACE_POKEDATA operation constant
    crit: notable
    conf: 0.9
    for: [elf, c, cpp]
    if:
      type: text
      substr: PTRACE_POKEDATA
    unless:
      - id: metadata/file/catalog/identity::linux-ptrace-system-header
  - id: ptrace-dup
    desc: Invokes ptrace system call directly
    conf: 0.85
    crit: notable
    if:
      type: syscall
      name: ["ptrace"]
  - id: process-memory-read
    desc: Reads another process memory
    conf: 0.9
    crit: notable
    if:
      type: syscall
      name: [process_vm_readv]
  - id: process-memory-write
    desc: Writes another process memory
    conf: 0.9
    crit: notable
    if:
      type: syscall
      name: [process_vm_writev]
composite_rules:
  - id: process-memory-access
    desc: Accesses another process memory
    crit: notable
    conf: 0.9
    any:
    - id: process-memory-read
    - id: process-memory-write
