defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: syscall-setns
    desc: Invokes setns to enter a namespace
    crit: suspicious
    conf: 0.8
    if:
      type: syscall
      name: ["setns"]
    unless:
      - id: well-known/lib/native/glibc::libc-soname
      - id: micro-behaviors/dylib/library/libc::glibc-versioned-libc
      - id: micro-behaviors/dylib/library/libc::is-libc-binary
      # BusyBox is a multi-call binary: one image carries the unshare,
      # nsenter and insmod applets whether or not the system ever runs them,
      # so its syscall surface is the applet table, not behaviour. The libc
      # carve-outs above already make this argument for libc itself.
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      # Recovered numbers are resolved through the Linux x86-64/AArch64
      # table, which is wrong for BSD kernels: NetBSD has no setns, so a
      # NetBSD OSABI binary (e.g. a Go toolchain runtime) resolving to 308
      # is an ordinary BSD syscall, not a namespace entry. Gate every
      # Linux-number claim in this file on a Linux-targeting header.
      - id: metadata/vendor/identity::bsd-elf-osabi
      # An ELF core dump embeds the crashed process's own code (including
      # libc syscall wrappers), so recovered numbers there describe dumped
      # memory, not behavior the file performs.
      - id: metadata/binary/header/identity::elf-core-dump
  - id: syscall-unshare
    desc: Invokes unshare to create namespaces
    crit: suspicious
    conf: 0.8
    if:
      type: syscall
      name: ["unshare"]
    unless:
      - id: well-known/lib/native/glibc::libc-soname
      - id: micro-behaviors/dylib/library/libc::glibc-versioned-libc
      - id: micro-behaviors/dylib/library/libc::is-libc-binary
      # BusyBox is a multi-call binary: one image carries the unshare,
      # nsenter and insmod applets whether or not the system ever runs them,
      # so its syscall surface is the applet table, not behaviour. The libc
      # carve-outs above already make this argument for libc itself.
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      # sandbox-runtime (Anthropic and @vscode) vendors a helper that
      # unshares namespaces only to install a seccomp filter, then execs
      # the child. That is sandbox setup, not container escape.
      - type: text
        substr: "apply-seccomp: unshare("
      # Same Linux-table caveat as syscall-setns above: unshare does not
      # exist on BSD kernels, so a BSD OSABI number resolving to it is an
      # ordinary BSD syscall mislabelled.
      - id: metadata/vendor/identity::bsd-elf-osabi
      # An ELF core dump embeds the crashed process's own code (including
      # libc syscall wrappers), so recovered numbers there describe dumped
      # memory, not behavior the file performs.
      - id: metadata/binary/header/identity::elf-core-dump
  - id: syscall-clone
    desc: Invokes clone/clone3 to spawn process
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["clone", "clone3"]
    unless:
      # Go includes a direct clone wrapper for ordinary runtime thread
      # creation, which is not application-level process spawning.
      - id: metadata/lang/compiler/systems::go-binary
      # Linux-number claim, wrong table for BSD kernels (see
      # syscall-setns): a BSD OSABI number resolving to clone/clone3 is
      # an ordinary BSD syscall, not process spawning.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: syscall-chroot
    desc: Invokes chroot to change root directory
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["chroot"]
    unless:
      # Linux-number claim, wrong table for BSD kernels (see
      # syscall-setns): BSD syscall numbers differ, so a Linux-table
      # chroot name on a BSD OSABI binary is unsound even where the
      # numbers happen to coincide.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: syscall-chdir
    desc: Invokes chdir/fchdir to change directory
    crit: notable
    conf: 0.7
    if:
      type: syscall
      name: ["chdir", "fchdir"]
    unless:
      # Same Linux-table caveat as syscall-chroot above.
      - id: metadata/vendor/identity::bsd-elf-osabi
composite_rules:
  - id: namespace-manipulation
    desc: Manipulates Linux namespaces
    conf: 0.85
    crit: suspicious
    any:
      - id: syscall-setns
      - id: syscall-unshare
