defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: syscall-setns
    desc: Invokes setns to enter a namespace
    crit: suspicious
    conf: 0.8
    if:
      type: syscall
      name: ["setns"]
    unless:
      # libc wrappers, and Linux syscall numbers read on a non-Linux header,
      # are not namespace behavior this file performs.
      - id: micro-behaviors/dylib/library/libc::libc-implementation-binary
      - id: metadata/vendor/identity::bsd-elf-osabi
      - id: metadata/binary/header/identity::elf-core-dump
      # Android's init enters mount namespaces during first-stage boot.
      # The log line is unique to that binary.
      - type: text
        substr: "init second stage started"
      - id: namespace-syscall-carrier-context
  - id: syscall-unshare
    desc: Invokes unshare to create namespaces
    crit: suspicious
    conf: 0.8
    if:
      type: syscall
      name: ["unshare"]
    unless:
      # libc wrappers, and Linux syscall numbers read on a non-Linux header,
      # are not namespace behavior this file performs.
      - id: micro-behaviors/dylib/library/libc::libc-implementation-binary
      - id: metadata/vendor/identity::bsd-elf-osabi
      - id: metadata/binary/header/identity::elf-core-dump
      # Sandbox helpers that unshare namespaces for unprivileged building or seccomp.
      - type: text
        regex: 'apply-seccomp: unshare\(|Usage: sandbox --rootfs <dir>'
      - id: namespace-syscall-carrier-context
  - id: syscall-clone
    desc: Invokes clone/clone3 to spawn process
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["clone", "clone3"]
    unless:
      # Go includes a direct clone wrapper for ordinary runtime thread
      # creation, which is not application-level process spawning.
      - id: metadata/lang/compiler/systems::go-binary
      # Linux-number claim, wrong table for BSD kernels (see
      # syscall-setns): a BSD OSABI number resolving to clone/clone3 is
      # an ordinary BSD syscall, not process spawning.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: syscall-chroot
    desc: Invokes chroot to change root directory
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["chroot"]
    unless:
      # Linux-number claim, wrong table for BSD kernels (see
      # syscall-setns): BSD syscall numbers differ, so a Linux-table
      # chroot name on a BSD OSABI binary is unsound even where the
      # numbers happen to coincide.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: syscall-chdir
    desc: Invokes chdir/fchdir to change directory
    crit: notable
    conf: 0.7
    if:
      type: syscall
      name: ["chdir", "fchdir"]
    unless:
      # Same Linux-table caveat as syscall-chroot above.
      - id: metadata/vendor/identity::bsd-elf-osabi
composite_rules:
  # Runtimes, multi-call binaries, emulators and libmount all carry setns
  # and unshare as capability surface. One exception so the syscall atoms
  # stay under the suppression limit.
  - id: namespace-syscall-carrier-context
    desc: Known namespace-operator carrier contexts
    crit: exception
    any:
      - id: well-known/app/infrastructure/runc::oci-runtime-lifecycle-binary
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/development/runtime/qemu::qemu-user-mode-emulator
      - id: well-known/tool/sysadmin/bubblewrap::bubblewrap-sandbox-binary
      - id: well-known/lib/runtime/native-platform/uruntime/
      - id: well-known/app/utility/util-linux::libmount-linked-mount-utility
      - id: well-known/app/utility/util-linux::util-linux-unshare-summary
      - id: well-known/app/ai/coding-agent/cursor-sandbox::cursor-sandbox-context
      # iproute2 (ip, tc) enters a named network namespace for `-n <netns>`.
      - id: well-known/tool/sysadmin/network::iproute2-utility-banner

  - id: namespace-manipulation
    desc: Manipulates Linux namespaces
    conf: 0.85
    crit: suspicious
    any:
      - id: syscall-setns
      - id: syscall-unshare
