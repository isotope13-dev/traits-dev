defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: syscall-setns
    desc: Setns syscall reference
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["setns"]
    unless:
      # libc wrappers, and Linux syscall numbers read on a non-Linux header,
      # are not namespace behavior this file performs.
      - id: metadata/binary/symbols/name/c-runtime::libc-implementation-binary
      - id: metadata/vendor/identity::bsd-elf-osabi
      - id: metadata/binary/header/identity::elf-core-dump
  - id: syscall-unshare
    desc: Unshare syscall reference
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["unshare"]
    unless:
      # libc wrappers, and Linux syscall numbers read on a non-Linux header,
      # are not namespace behavior this file performs.
      - id: metadata/binary/symbols/name/c-runtime::libc-implementation-binary
      - id: metadata/vendor/identity::bsd-elf-osabi
      - id: metadata/binary/header/identity::elf-core-dump
  - id: syscall-chroot
    desc: Invokes chroot to change root directory
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["chroot"]
    unless:
      # Linux-number claim, wrong table for BSD kernels (see
      # syscall-setns): BSD syscall numbers differ, so a Linux-table
      # chroot name on a BSD OSABI binary is unsound even where the
      # numbers happen to coincide.
      - id: metadata/vendor/identity::bsd-elf-osabi
composite_rules:
  - id: namespace-manipulation
    desc: Linux namespace syscall reference
    conf: 0.85
    crit: notable
    any:
      - id: syscall-setns
      - id: syscall-unshare
