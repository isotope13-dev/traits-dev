defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: syscall-setns
    desc: Invokes setns to enter a namespace
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["setns"]
  - id: syscall-unshare
    desc: Invokes unshare to create namespaces
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["unshare"]
  - id: syscall-clone
    desc: Invokes clone/clone3 to spawn process
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["clone", "clone3"]
    unless:
      # Go includes a direct clone wrapper for ordinary runtime thread
      # creation, which is not application-level process spawning.
      - id: metadata/lang/compiler/systems::go-binary
  - id: syscall-chroot
    desc: Invokes chroot to change root directory
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["chroot"]
  - id: syscall-chdir
    desc: Invokes chdir/fchdir to change directory
    crit: notable
    conf: 0.7
    if:
      type: syscall
      name: ["chdir", "fchdir"]
composite_rules:
  - id: namespace-manipulation
    desc: Manipulates Linux namespaces
    conf: 0.85
    crit: suspicious
    any:
      - id: syscall-setns
      - id: syscall-unshare
  - id: container-escape
    desc: clone plus setns container-escape pattern
    conf: 0.9
    crit: suspicious
    all:
      - id: syscall-clone
      - id: syscall-setns
  - id: chroot-escape
    desc: chroot plus chdir escape pattern
    conf: 0.8
    crit: suspicious
    all:
      - id: syscall-chroot
      - id: syscall-chdir
