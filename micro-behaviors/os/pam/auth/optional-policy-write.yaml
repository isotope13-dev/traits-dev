defaults:
  platforms: [linux]
  for: [scripts, -batch, -jcl, -powershell, -vbs, elf, macho]
  crit: notable
composite_rules:
  - id: pam-policy-optional-module-write
    desc: PAM policy write adds an optional module
    conf: 0.9
    all:
      - id: pam-config-write
      - id: pam-optional-control
    unless:
      - id: well-known/app/utility/sudo::source-tree
      - id: metadata/path/software::distrobox-source-tree
      - id: well-known/app/communication/ntfy::ntfy-binary
      - id: well-known/app/security/gaze/
