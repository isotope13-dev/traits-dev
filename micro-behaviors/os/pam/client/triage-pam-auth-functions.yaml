defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  - id: pam-auth-functions
    desc: PAM authentication or session API references
    crit: notable
    any:
    - id: micro-behaviors/os/pam/client::pam-authenticate-api
    - id: micro-behaviors/os/pam/client::pam-chauthtok-api
    - id: micro-behaviors/os/pam/auth::pam-acct-mgmt
    - id: micro-behaviors/os/pam/auth::pam-setcred-symbol
    - id: micro-behaviors/os/pam/client::pam-open-session
  # Reference PAM consumers and the Linux-PAM tree itself legitimately read
  # back conversation responses: password helpers, test programs and the
  # libpam_misc conversation function. Grouped so each rule carries one carve-out.
