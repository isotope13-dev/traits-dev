defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  - id: pam-token-library-context
    desc: PAM library and authentication-token API references
    crit: notable
    conf: 0.8
    all:
    - id: micro-behaviors/os/pam/client::pam-library
    any:
        # Real credential interception should touch credential-bearing token APIs.
        # Ordinary login tools commonly combine libpam, pam_authenticate,
        # pam_acct_mgmt, pam_open_session, pam_setcred, and pam_set_item.
    - id: micro-behaviors/os/pam/client::pam-get-authtok
    - id: micro-behaviors/os/pam/client::pam-authtok-constant
    downgrade:
      any:
      - id: metadata/binary/provenance/
