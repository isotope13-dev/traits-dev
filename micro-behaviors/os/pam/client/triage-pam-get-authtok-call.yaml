defaults:
  platforms: [unix]
  for: [elf]
traits:
  - id: pam-get-authtok-call
    desc: Calls pam_get_authtok in C source
    crit: notable
    conf: 0.85
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: pam_get_authtok
  # A PAM conversation callback fills reply[i].resp (or frees it) as its API
  # contract, so a bare reply[i].resp mention is not interception. These atoms
  # fire only when the filled-in response is read back OUT to a second
  # location: duplicated into another buffer, written to a log, sent over a
  # descriptor, or stashed into a variable.
