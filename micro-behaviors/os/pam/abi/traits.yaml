# PAM entry points that a file *publishes* as its own ABI, as opposed to calls.
#
# The atoms in micro-behaviors/os/pam/client/ match `kind: call` -- a program
# consuming PAM to authenticate someone, which sshd, login, su, sudo, gdm and
# cockpit all do by design. Publishing the ABI is a different fact, and only
# libpam itself or an object built to be loaded in its place does it.
defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
  conf: 0.92

traits:
  # A pam_* name bound to a PAM version set ("PAM_1.0", "LIBPAM_MISC_1.0"), which
  # is how an exported symbol claims the versioned reference a consumer's
  # DT_NEEDED entry resolves against. Matched as text rather than as a parsed
  # function symbol because these are routinely emitted through a macro -- a
  # `FAKE_FUNCTION(pam_start, "PAM_1.0")` expansion is a call expression to
  # tree-sitter, not a definition -- and the text form also catches `.symver`
  # spellings. A PAM *consumer* never writes a version-set string, so this does
  # not fire on programs that merely authenticate.
  - id: pam-abi-version-set-binding
    desc: Binds PAM symbols to a version set
    count_min: 4
    if:
      type: text
      regex: '\bpam_[a-z_]{2,20}\b[^\n]{0,40}"[A-Z_]{0,12}PAM[A-Z_]{0,12}_[0-9]'
