defaults:
  for: [text, xml]
  platforms: [windows]
  crit: notable
  conf: 0.98

traits:
  - id: task-url-handler-exe-arguments
    desc: Task arguments specify URL-handler executable
    if:
      type: text
      regex: '(?i)url\.dll,\s*FileProtocolHandler\s+"?[A-Z]:\\[^<"]{1,200}\.exe"?\s*</Arguments>'
