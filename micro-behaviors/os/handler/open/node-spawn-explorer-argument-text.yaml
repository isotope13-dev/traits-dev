defaults:
  # Node's spawn() API text appears in JavaScript/TypeScript source and in
  # binaries that embed bundled JS strings; non-JS script dialects and
  # bytecode containers cannot host this call form, so they are excluded
  # to stay within the text-matcher file-type cap.
  for: [javascript, typescript, pe, elf, macho]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: node-spawn-explorer-argument-text
    desc: Spawn call names Windows Explorer
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bspawn\s*\(\s*["\x27]explorer(\.exe)?["\x27]'
