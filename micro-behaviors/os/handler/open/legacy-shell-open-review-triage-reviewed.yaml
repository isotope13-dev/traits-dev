defaults:
  platforms: [windows]
  crit: notable
traits:
- for:
  - javascript
  - vbs
  - html
  - ruby
  id: shellexecute-method-reference
  desc: ShellExecute member name reference
  conf: 0.9
  if:
    type: text
    regex: (?i)\.ShellExecute\b
- for:
  - c
  - cpp
  id: shell-execute-source
  desc: ShellExecute name text in source
  conf: 0.9
  if:
    type: text
    word: ShellExecute
