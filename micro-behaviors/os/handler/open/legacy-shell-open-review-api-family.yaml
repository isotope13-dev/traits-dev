# ShellExecute opens targets, including URLs and associated documents; it
# does not establish command-shell execution.
defaults:
  platforms: [unix, windows]
composite_rules:
- id: win-shellexecute
  desc: Windows ShellExecute API references
  crit: notable
  conf: 0.9
  for: [scripts, binaries]
  any:
  - id: micro-behaviors/os/handler/open::shell-execute-a
  - id: micro-behaviors/os/handler/open::shell-execute
  - id: micro-behaviors/os/handler/open::shell-execute-ex
  - id: metadata/binary/symbols/name/process::shell-execute-ex-a
