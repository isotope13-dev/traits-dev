defaults:
  crit: notable
  for:
    - python
    - shell
    - macho
  platforms:
    - macos
traits:
  - id: applescript-open-app
    desc: AppleScript opens an application bundle
    conf: 0.92
    for: [applescript]
    if:
      type: text
      regex: '(?i)\bopen\b[^\nb]{0,180}\.app\b'
  - id: open-file-command
    desc: macOS open command invocation
    conf: 0.8
    # This is a shell command-line matcher.  Python source frequently uses
    # "open ..." in prose/docstrings, which is not an invocation.
    for: [shell]
    if:
      type: text
      regex: '(?m)^[[:space:]]*open[[:space:]]+\S+'
  - id: nsworkspace-swift-open
    desc: Swift NSWorkspace opens a URL or file
    conf: 0.85
    for: [swift]
    if:
      type: text
      regex: 'NSWorkspace\.shared\.open\s*\('

  - id: nsworkspace-swift-launch-application
    desc: Swift NSWorkspace launches an application
    conf: 0.9
    for: [swift]
    if:
      type: text
      regex: 'NSWorkspace\.shared\.(openApplication|launchApplication)\s*\('
