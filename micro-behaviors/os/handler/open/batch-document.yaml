defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-start-local-document
    desc: Batch START opens a local document path
    crit: notable
    conf: 0.96
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^start\s+""\s+"[^"\r\n]+\\[^"\r\n]+\.(pdf|docx?|xlsx?)"\s*$'
