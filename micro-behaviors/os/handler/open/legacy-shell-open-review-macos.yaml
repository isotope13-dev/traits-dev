defaults:
  crit: notable
  for:
    - python
    - shell
    - macho
  platforms:
    - macos
traits:
  - id: open-app-quoted
    desc: Quoted macOS open application text
    conf: 0.78
    if:
      type: string_literal
      # Require a quoted bundle name/path so prose such as "open panels" and
      # unrelated dotted names such as ``bpy.app`` do not match.
      regex: \bopen\s+(-a\s+)?["'][^"\n]{1,120}\.app["']
  - id: open-app-absolute-path
    desc: macOS open absolute application text
    conf: 0.8
    if:
      type: string_literal
      # Anchor to the literal start: the atom fires on quoted command strings
      # (sh -c "...", exec("...")), and an unanchored open also matches usage
      # prose inside larger literals (echo "run: open /X.app"), where the
      # bundle is mentioned, not passed to open.
      regex: ^\s*(sudo\s+)?open\s+(-a\s+)?/[^\s"\n]{1,120}\.app\b
  - id: open-app-argv
    desc: macOS open application argv text
    conf: 0.82
    if:
      type: string_literal
      regex: \['open'\s*,\s*['"][^'"\n]{1,120}\.app['"]
  - id: open-command
    desc: macOS open command string
    conf: 0.75
    if:
      type: literal
      kind: string
      regex: ^open\s+(-a\b|["'])
  - id: usr-bin-open-command
    desc: macOS /usr/bin/open command text
    conf: 0.85
    if:
      type: text
      regex: /usr/bin/open\s+(-[A-Za-z][A-Za-z0-9-]*\s+){0,4}(["'][^"'\n]{0,240}|[^"'\s\n]{1,240})
  - id: nsworkspace-open-file
    desc: NSWorkspace openFile string reference
    conf: 0.8
    if:
      type: string_literal
      regex: (openFile:withApplication|\[NSWorkspace.{0,30}openFile)
  # A selector string is not bound to NSWorkspace or to a call site.
  - id: launch-application-selector-text
    desc: launchApplication selector text
    conf: 0.9
    for: [macho, dylib, objc]
    if:
      type: text
      exact: 'launchApplication:'

  - id: nsworkspace-shared
    crit: component
    desc: sharedWorkspace string reference
    conf: 0.7
    if:
      type: string_literal
      substr: sharedWorkspace
composite_rules:
  - id: open-app-string-references
    desc: macOS open application string references
    conf: 0.7
    any:
      - id: open-app-quoted
      - id: open-app-absolute-path
      - id: open-app-argv
  - id: nsworkspace-open-file-reference-context
    desc: NSWorkspace openFile and singleton clues
    conf: 0.85
    all:
      - id: nsworkspace-open-file
      - id: nsworkspace-shared
  - id: macos-open-reference-clues
    desc: macOS open and NSWorkspace reference clues
    conf: 0.85
    any:
      - id: open-app-string-references
      - id: open-command
      - id: usr-bin-open-command
      - id: nsworkspace-open-file-reference-context
