defaults:
  platforms: [windows]
  for: [javascript, text, data]
composite_rules:
- id: wsh-env-shellexecute-clues
  for: [javascript]
  desc: WSH environment and ShellExecute clues
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/source/syntax/assignment/call::call-assigned-long-string-text
  - id: micro-behaviors/os/env/read/variable::wsh-environment-symbol
  - id: micro-behaviors/os/handler/open::shellexecute-method-reference
  - id: metadata/file/text-distribution::source-non-ascii-ratio-40
  any:
  - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
  - id: micro-behaviors/os/env/write::env-dynamic-assignment
  - id: metadata/file/line::source-lines-over-1000
  - id: metadata/lang/source/naming/population::low-identifier-reuse
  needs: 2
