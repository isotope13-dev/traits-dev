# Shell.Application.ShellExecute whose file argument is a literal .cmd/.bat
# path: the call starts a batch script through the shell.
defaults:
  platforms: [windows]
  for: [vbs, html, javascript]
  attack: T1059.003

traits:
  - id: shellexecute-batch-file-target
    desc: ShellExecute starts a batch script file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.ShellExecute\s*\(?\s*["''][^"''\r\n]{1,120}\.(cmd|bat)["'']'
