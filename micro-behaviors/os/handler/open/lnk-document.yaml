defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-start-document-command
    desc: Shortcut START command opens a document
    crit: notable
    conf: 0.96
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^/c|[&|])\s*start\s+("" *)?"?[^"&|\r\n]+\.(pdf|docx?|xlsx?)"?(\s|$)'
