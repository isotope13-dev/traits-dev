# Default-action item opening through PowerShell.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.9
traits:
  - id: powershell-invoke-item
    desc: Invoke-Item command name reference
    for: [powershell, batch, pe, ruby]
    if:
      type: text
      word: Invoke-Item
      case_insensitive: true
