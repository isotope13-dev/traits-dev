# Matches API syntax in hex-recovered bytes before the runtime XOR-23 pass.
# No campaign domain, variable name or dropped filename is required.
defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
- id: xor23-shellexecute-method
  desc: Hex/XOR-23 ShellExecute text
  if:
    type: encoded
    encoding: hex
    regex: "9[dD][\u007f_][rR][\\{\\[][\\{\\[][rR][oO][rR][tT][bB][cC][rR]7"
# Raw form for multi-line payloads the hex decoder rejects.
- id: xor23-hex-text-shellexecute
  desc: .ShellExecute spelled as XOR-23 hex text
  if:
    type: text
    regex: "(?i)39[46]4[57]F[57]2[57]B[57]B[57]2[46]F[57]2[57]4[46]2[46]3[57]2"
