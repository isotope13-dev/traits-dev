defaults:
  platforms:
  - windows
traits:
- for:
  - pe
  id: create-ip-forward-entry
  desc: Create IP forward entry (route manipulation)
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: CreateIpForwardEntry
- for:
  - pe
  id: create-ip-forward-entry2
  desc: Create IP forward entry v2
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: CreateIpForwardEntry2
- for:
  - pe
  id: delete-ip-forward-entry
  desc: Delete IP forward entry (route manipulation)
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: DeleteIpForwardEntry
- for:
  - pe
  id: delete-ip-forward-entry2
  desc: Delete IP forward entry v2
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: DeleteIpForwardEntry2
- for:
  - pe
  id: set-ip-forward-entry2
  desc: Modify IP forward entry v2
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: SetIpForwardEntry2
- for:
  - pe
  - dll
  - c
  - cpp
  attack: T1016
  id: get-ip-forward-table
  desc: Enumerate IP forward table
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: GetIpForwardTable
- id: get-best-interface-ex
  desc: Resolve best outbound interface
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: GetBestInterfaceEx
  for:
  - pe
  - dll
  - c
  - cpp
  attack: T1016
composite_rules:
- for:
  - pe
  id: route-table-manipulation
  desc: Programmatic route table modification
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: create-ip-forward-entry
  - id: create-ip-forward-entry2
  - id: delete-ip-forward-entry
  - id: delete-ip-forward-entry2
  - id: set-ip-forward-entry2
  downgrade:
    any:
    - id: metadata/binary/symbols/count::high-export-count-marker
    - id: metadata/signed/trust-level::signer-evidence-present
    - id: well-known/dual-use/tunnel/netch/
