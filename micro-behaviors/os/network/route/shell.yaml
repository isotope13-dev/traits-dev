defaults:
  platforms:
  - unix
  for:
  - shell
  - elf
  - swift
traits:
- crit: notable
  conf: 0.75
  id: ip-route-show
  desc: Queries routes with ip route
  attack: T1016
  if:
    type: text
    regex: (ip route show|ip route list|/sbin/ip route)
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - type: text
    regex: ip route (show|list).{0,40}\|\s*(grep|sed|awk)\b
  - type: text
    regex: GET_STATE\[[0-9]\]="ip (addr|route) show dev \$IFACE
  - id: micro-behaviors/fs/path/binary::bin-busybox-path
