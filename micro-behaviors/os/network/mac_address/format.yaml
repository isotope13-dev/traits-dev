defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: qemu-kvm-prefix
    desc: References QEMU/KVM MAC address prefix 52:54:00
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [elf, macho, pe, dll, so, dylib]
    if:
      type: text
      substr: '52:54:00'
  - id: mac-format-string
    desc: MAC address format string
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: '%02X-%02X-%02X-%02X-%02X-%02X'
