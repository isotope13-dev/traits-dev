defaults:
  for:
  - pe
  platforms:
  - windows
traits:
- id: flush-ip-net-table
  desc: Flush ARP or neighbor cache
  crit: suspicious
  conf: 0.88
  if:
    type: symbol
    exact: FlushIpNetTable
  downgrade:
    any:
    - type: metrics
      field: exports.count
      min: 50
    - id: metadata/signed/developer
    - id: metadata/signed/leaf
    - id: metadata/signed/platform
    - id: metadata/lang/upstream::windows-system-implementer-dll
    - id: well-known/lib/platform/wine/
