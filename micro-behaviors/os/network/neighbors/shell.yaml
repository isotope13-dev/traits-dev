defaults:
  platforms: [unix]
  for: [shell, elf]

traits:
  - id: arp-table-query
    desc: Queries the local ARP table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|[;&|(){}\[\]\s]|/)(arp\s+-[A-Za-z]*[ane][A-Za-z]*\b)'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - type: text
        regex: 'COMPREPLY[+]?=.*(arp -an|ip neigh show)'
      - type: text
        substr: 'Dummy "arp -an" emulator'
