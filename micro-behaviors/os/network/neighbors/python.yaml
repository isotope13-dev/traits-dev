defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-arp-display-call
    desc: Python executes an arp ARP table command
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(subprocess\.[a-z_]+|os\.(system|popen))$'
      arg:
        kind: string
        substr: 'arp -'
    attack: T1018
