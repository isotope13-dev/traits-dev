# Tunnel-interface capability evidence; matcher scopes retain platform and language.
defaults:
  platforms:
  - android
  for:
  - apk
  - zip
  - xml
  - dex
  crit: component
  conf: 0.9
traits:
- id: android-vpn-service-class
  desc: Android VpnService implementation
  crit: notable
  conf: 0.94
  for:
  - xml
  - dex
  if:
    type: text
    substr: Landroid/net/VpnService;
  unless:
  - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
- id: android-vpn-builder
  desc: Android VpnService.Builder reference
  crit: notable
  conf: 0.94
  for:
  - xml
  - dex
  if:
    type: text
    substr: Landroid/net/VpnService$Builder;
  unless:
  - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
- id: android-vpn-manifest-binding
  desc: VPN service binding permission
  crit: notable
  conf: 0.94
  for:
  - xml
  - dex
  if:
    type: text
    substr: android.permission.BIND_VPN_SERVICE
- id: android-vpn-disallowed-application
  desc: VPN excludes apps from tunnel
  crit: notable
  conf: 0.94
  for:
  - xml
  - dex
  if:
    type: text
    exact: addDisallowedApplication
- id: android-vpn-allowed-application
  desc: VPN application allowlist method
  crit: notable
  conf: 0.94
  for:
  - xml
  - dex
  if:
    type: text
    exact: addAllowedApplication
- id: android-vpn-service-source
  desc: Android VpnService subclass or import
  crit: notable
  conf: 0.94
  for:
  - java
  - kotlin
  if:
    type: text
    regex: (?i)(import\s+android\.net\.VpnService\b|(extends|:)\s*VpnService\b)
- id: android-vpn-builder-source
  desc: Android VpnService.Builder construction
  crit: notable
  conf: 0.94
  for:
  - java
  - kotlin
  if:
    type: text
    regex: \b(new\s+Builder\s*\(|VpnService\s*\.\s*Builder\b)
- id: android-vpn-disallowed-application-source
  desc: Android VPN addDisallowedApplication call
  crit: notable
  conf: 0.94
  for:
  - java
  - kotlin
  if:
    type: text
    regex: \.addDisallowedApplication\s*\(
- id: android-vpn-play-services-allowlist-call
  desc: VPN routes Google Play apps through tunnel
  crit: notable
  conf: 0.98
  for:
  - java
  - kotlin
  if:
    type: text
    regex: \.addAllowedApplication\s*\(\s*["']com\.(android\.vending|google\.android\.gms)["']\s*\)
- id: android-add-route-method
  desc: Android addRoute method reference
  crit: notable
  conf: 0.9
  for:
  - xml
  - dex
  if:
    type: text
    exact: addRoute
- id: android-vpn-add-route-source
  desc: Android VPN builder addRoute call
  crit: notable
  conf: 0.92
  for:
  - java
  - kotlin
  if:
    type: text
    regex: \.addRoute\s*\(
composite_rules:
- id: android-vpn-application-exclusion-filter
  desc: Android VPN application-exclusion filter
  crit: notable
  conf: 0.94
  unless:
  - id: well-known/dual-use/tunnel/mullvad::android-apk
  - id: well-known/dual-use/tunnel/shadowsocks-android::shadowsocks-android-apk
  all:
  - id: micro-behaviors/os/network/tunnel::android-vpn-builder
  - id: micro-behaviors/os/network/tunnel::android-add-route-method
  - id: micro-behaviors/os/network/tunnel::android-vpn-disallowed-application
- id: android-vpn-application-exclusion-filter-source
  desc: Android source VPN application-exclusion filter
  crit: notable
  conf: 0.95
  for:
  - java
  - kotlin
  unless:
  - id: well-known/dual-use/tunnel/mullvad::android-apk
  - id: well-known/dual-use/tunnel/shadowsocks-android::shadowsocks-android-apk
  all:
  - id: micro-behaviors/os/network/tunnel::android-vpn-service-source
  - id: micro-behaviors/os/network/tunnel::android-vpn-builder-source
  - id: micro-behaviors/os/network/tunnel::android-vpn-add-route-source
  - id: micro-behaviors/os/network/tunnel::android-vpn-disallowed-application-source
- id: android-vpn-play-services-exclusion
  desc: VPN excludes Google Play or Play Services packages
  crit: suspicious
  conf: 0.96
  for:
  - java
  - kotlin
  all:
  - id: micro-behaviors/os/network/tunnel::android-vpn-disallowed-application-source
  any:
  - id: micro-behaviors/os/application/target::android-play-store-package-literal
  - id: micro-behaviors/os/application/target::android-play-services-package-literal
  needs: 1
- id: android-vpn-play-services-allowlist-bytecode
  desc: VPN bytecode routes Google Play apps
  crit: notable
  conf: 0.97
  for:
  - android_apk
  - zip
  - dex
  all:
  - id: micro-behaviors/os/network/tunnel::android-vpn-service-class
  - id: micro-behaviors/os/network/tunnel::android-vpn-builder
  - id: micro-behaviors/os/network/tunnel::android-vpn-allowed-application
  any:
  - id: micro-behaviors/os/application/target::android-play-store-package-literal
  - id: micro-behaviors/os/application/target::android-play-services-package-literal
  needs: 1
