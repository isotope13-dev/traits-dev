# Tunnel-interface capability evidence; matcher scopes retain platform and language.
defaults:
  crit: notable
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1090
traits:
- id: wintun-create-adapter
  desc: WintunCreateAdapter virtual adapter creation
  conf: 0.86
  if:
    type: symbol
    exact: WintunCreateAdapter
- id: wintun-dll-reference
  desc: WinTun virtual adapter library reference
  conf: 0.86
  if:
    type: text
    exact: wintun.dll
- id: tap0901-adapter-reference
  desc: TAP-Windows tap0901 adapter reference
  conf: 0.86
  if:
    type: text
    exact: tap0901
composite_rules:
- id: windows-virtual-tunnel-adapter
  desc: Windows virtual tunnel adapter support
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/os/network/tunnel::wintun-dll-reference
  - id: micro-behaviors/os/network/tunnel::wintun-create-adapter
  - id: micro-behaviors/os/network/tunnel::tap0901-adapter-reference
  downgrade:
    any:
    - id: metadata/signed/trust-level::signer-evidence-present
