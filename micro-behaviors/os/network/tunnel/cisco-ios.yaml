# Tunnel-interface capability evidence; matcher scopes retain platform and language.
defaults:
  platforms:
  - unix
  - appliance
  for:
  - c
  - cpp
  - elf
  - scripts
traits:
- id: ios-tunnel-interface-token
  desc: Cisco IOS tunnel-interface configuration token
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \binterface\s+tunnel\b
- id: ios-tunnel-source-token
  desc: Cisco IOS tunnel-source configuration token
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \btunnel\s+source\b
- id: ios-tunnel-destination-token
  desc: Cisco IOS tunnel-destination configuration token
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \btunnel\s+destination\b
- id: ios-tunnel-vrf-token
  desc: Cisco IOS tunnel-VRF configuration token
  crit: component
  conf: 0.96
  if:
    type: text
    regex: \btunnel\s+vrf\b
composite_rules:
- id: ios-tunnel-configuration-vocabulary
  desc: Contains multiple Cisco IOS tunnel configuration tokens
  crit: notable
  conf: 0.98
  needs: 3
  any:
  - id: micro-behaviors/os/network/tunnel::ios-tunnel-interface-token
  - id: micro-behaviors/os/network/tunnel::ios-tunnel-source-token
  - id: micro-behaviors/os/network/tunnel::ios-tunnel-destination-token
  - id: micro-behaviors/os/network/tunnel::ios-tunnel-vrf-token
