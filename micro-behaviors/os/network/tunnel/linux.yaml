# Tunnel-interface capability evidence; matcher scopes retain platform and language.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - c
  - cpp
  - go
  - rust
  attack: T1090
traits:
- id: dev-tun
  desc: /dev/tun device
  conf: 0.5
  if:
    type: text
    substr: /dev/tun
- id: dev-net-tun
  desc: /dev/net/tun device
  conf: 0.6
  if:
    type: text
    substr: /dev/net/tun
- id: dev-tap
  desc: /dev/tap device
  conf: 0.5
  if:
    type: text
    substr: /dev/tap
- id: tunsetiff-ioctl
  desc: TUN/TAP virtual NIC setup ioctl
  conf: 0.6
  if:
    type: text
    substr: TUNSETIFF
composite_rules:
- id: tun
  desc: TUN/TAP device usage
  conf: 0.66
  any:
  - id: micro-behaviors/os/network/tunnel::dev-tun
  - id: micro-behaviors/os/network/tunnel::dev-net-tun
  - id: micro-behaviors/os/network/tunnel::dev-tap
  - id: micro-behaviors/os/network/tunnel::tunsetiff-ioctl
