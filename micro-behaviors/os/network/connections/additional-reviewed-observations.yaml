composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  id: tcp-udp-table-api-surface
  desc: TCP and UDP connection-table API surface
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/os/network/connections::get-tcp-table
  - id: micro-behaviors/os/network/connections::get-udp-table
  downgrade:
    any:
    - id: metadata/binary/installer/
    - id: metadata/binary/vendor/
  unless:
  - id: metadata/package/vendor::bitdefender-ctc-module
