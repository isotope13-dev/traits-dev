# Windows QoS policy surfaces. These are neutral network-management
# capabilities; malicious intent comes from pairing them with WFP filtering
# and endpoint-agent targeting.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

traits:
  - id: msft-netqos-policy-query
    desc: WMI query for Windows QoS policy data
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bMSFT_NetQosPolicySettingData\b'
