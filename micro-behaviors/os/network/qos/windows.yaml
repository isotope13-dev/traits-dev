# Windows QoS policy class references; this text does not prove a query.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

traits:
  - id: msft-netqos-policy-class
    desc: References Windows QoS policy class
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bMSFT_NetQosPolicySettingData\b'
