defaults:
  platforms: [unix]
  for: [python, pyc]
  attack: T1021.002

traits:
  - id: python-smbclient-share-list
    desc: Python invokes smbclient share listing
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '"smbclient"[\s\S]{0,180}"-L"'

  - id: python-smbclient-no-password
    desc: Python invokes smbclient without password
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '"smbclient"[\s\S]{0,180}"-L"[\s\S]{0,120}"-N"'
