# Windows network share connection APIs (symbol-based)
# WNetAddConnection/WNetCancelConnection from mpr.dll
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  # The host component must start AND end on an alphanumeric (so at least two
  # characters, no trailing dot). A one-character host followed by dots is not
  # a UNC server name but a regex backreference: `'\\1...\n\\2'` in a Python
  # `re.sub()` replacement is two backslashes, a group number, and gap dots.
  - id: unc-path-reference
    desc: String literal containing UNC path syntax
    crit: notable
    conf: 0.9
    for: [scripts, c, cpp, csharp, go, rust, python, javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[\s"''=(:,])\\\\[a-z0-9][a-z0-9.-]*[a-z0-9]\\[a-z0-9$_. -]+(\\|["''\s,;)]|$)'
    unless:
      - id: well-known/lib/core/icu4x::icu4x-generated-data-context

  - id: windows-admin-share-path
    desc: Reference to a Windows administrative SMB share
    crit: notable
    conf: 0.94
    for: [scripts, c, cpp, csharp, go, rust, python, javascript, typescript]
    if:
      type: text
      regex: '(?i)\\\\[a-zA-Z0-9_.-]+(\\\\|\\)[a-zA-Z]\$(\\\\|\\)'

  - id: net-use-admin-share-credentials
    desc: Connects to admin share with credentials
    crit: notable
    conf: 0.95
    for: [batch, powershell, scripts]
    if:
      type: text
      regex: '(?i)net\s+use\s+\\\\[^\\\r\n]{1,80}\\[a-z]\$\s+/user:'

  - id: wnet-add-connection
    desc: Network share connection API import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      substr: WNetAddConnection

  - id: wnet-use-connection
    desc: WNetUseConnectionW share mapping import
    crit: notable
    conf: 0.93
    attack: T1570
    if:
      type: import
      exact: WNetUseConnectionW

  - id: wnet-get-connection
    desc: Mapped drive UNC query import
    crit: notable
    conf: 0.9
    attack: T1135
    if:
      type: import
      exact: WNetGetConnectionA

  - id: wnet-cancel-connection
    desc: Network share disconnect API import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      substr: WNetCancelConnection

  - id: net-view-share-enum
    desc: Enumerates network shares with net view
    crit: notable
    conf: 0.9
    for: [batch, powershell, scripts]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+view\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: net-view-all-flag
    desc: net view /all share listing
    crit: notable
    conf: 0.9
    for: [batch, powershell, scripts]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+view\b[^\r\n]{0,80}/all\b'

  - id: net-view-domain-flag
    desc: net view domain-wide share listing
    crit: notable
    conf: 0.9
    for: [batch, powershell, scripts]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?\s+view\b[^\r\n]{0,80}/domain\b'

composite_rules:
  - id: wnet-share-connect-cycle
    desc: Network share connect and disconnect cycle
    crit: suspicious
    conf: 0.92
    all:
      - id: wnet-add-connection
      - id: wnet-cancel-connection
    downgrade:
      any:
        - id: metadata/lang/compiled::autoit-compiled-script
        - id: metadata/signed/platform/
        - id: micro-behaviors/communications/socket/share::pywin32-wnet-extension
        - id: metadata/binary/vendor/
        - id: metadata/signed/trust-level/
        - id: well-known/lib/platform/wine/

  - id: net-view-share-discovery
    desc: net view enumerates shares broadly
    crit: notable
    conf: 0.92
    for: [batch, powershell, scripts]
    all:
      - id: net-view-share-enum
    any:
      - id: net-view-all-flag
      - id: net-view-domain-flag
