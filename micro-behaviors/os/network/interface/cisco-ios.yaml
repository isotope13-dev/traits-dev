# Cisco IOS tunnel-configuration tokens. Individual tokens are incomplete
# clues; several together establish that code contains a GRE/VRF configuration
# selector without treating ordinary documentation prose as behavior.
defaults:
  platforms: [unix, appliance]
  for: [c, cpp, elf, scripts]

traits:
  - id: ios-tunnel-interface-token
    desc: Cisco IOS tunnel-interface configuration token
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\binterface\s+tunnel\b'

  - id: ios-tunnel-source-token
    desc: Cisco IOS tunnel-source configuration token
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\btunnel\s+source\b'

  - id: ios-tunnel-destination-token
    desc: Cisco IOS tunnel-destination configuration token
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\btunnel\s+destination\b'

  - id: ios-tunnel-vrf-token
    desc: Cisco IOS tunnel-VRF configuration token
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\btunnel\s+vrf\b'

composite_rules:
  - id: ios-tunnel-configuration-vocabulary
    desc: Contains multiple Cisco IOS tunnel configuration tokens
    crit: notable
    conf: 0.98
    needs: 3
    any:
      - id: ios-tunnel-interface-token
      - id: ios-tunnel-source-token
      - id: ios-tunnel-destination-token
      - id: ios-tunnel-vrf-token
