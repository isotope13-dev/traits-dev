defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: non-promiscuous-mode-phrase
    desc: Network interface is not in promiscuous mode
    crit: component
    conf: 0.9
    if:
      type: text
      substr: not in promiscuous mode

  - id: fortios-interface-config-read
    desc: Reads FortiOS interface configuration
    platforms: [fortios, unix]
    for: [shell]
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*show\s+system\s+interface(\s*\|.{0,120})?$'

  - id: fortios-interface-https-management
    desc: FortiOS interface permits HTTPS management
    platforms: [fortios, unix]
    for: [shell]
    conf: 0.96
    if:
      type: text
      regex: 'config system interface[\s\S]{1,240}set allowaccess[^\n]{0,80}\bhttps\b'

  - id: clojure-network-interface-enumeration
    desc: Clojure enumerates local network interfaces
    for: [clojure]
    if:
      type: symbol
      kind: call
      regex: '^(java\.net\.)?NetworkInterface/getNetworkInterfaces$'
  - id: python-local-ip-helper
    desc: Retrieves the host's local IP address
    for: [python, pe, dll]
    if:
      type: text
      regex: '\bget_local_ip\s*\('
  - id: python-interface-command
    desc: Python runs an interface command
    for: [python]
    if:
      type: text
      regex: '(?i)subprocess\.(run|call|Popen)\([^\n]{0,100}(ifconfig|ip\s+(addr|link|route|neigh))'
  - id: rust-interface-command
    desc: Rust launches interface commands
    for: [rust]
    if:
      type: text
      regex: 'Command::new[\s\S]{0,160}["''](ip|ifconfig)["'']'
    unless:
      - type: text
        regex: 'pgy_probe|pgy_ipv4_candidates|POINTOPOINT|virtual IP'
  - id: ifconfig
    desc: ifconfig command reference
    if:
      type: text
      regex: '(^|[[:space:]/"''])ifconfig([[:space:]"'']|$)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/format/
      - id: metadata/package/testing/harness/runtime/
  - id: ip-addr
    desc: ip addr command
    crit: notable
    if:
      type: text
      regex: (^|[^[:alnum:]])ip addr( show)?([^[:alnum:]]|$)
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: ip-link
    desc: Uses ip link for network interfaces
    if:
      type: text
      regex: \bip\s+link\s+(show|set|add|del)\b
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: ip-route-show
    desc: Queries routes with ip route
    platforms: [unix]
    for: [shell, elf]
    conf: 0.75
    attack: T1016
    if:
      type: text
      regex: (ip route show|ip route list|/sbin/ip route)
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - type: text
        regex: ip route (show|list).{0,40}\|\s*(grep|sed|awk)\b
      - type: text
        regex: GET_STATE\[[0-9]\]="ip (addr|route) show dev \$IFACE
      - id: micro-behaviors/fs/path/binary::bin-busybox-path
  - id: ip-neigh-show
    desc: Queries the local IP neighbor table
    crit: notable
    conf: 0.85
    for: [shell, elf]
    attack: T1018
    if:
      type: text
      regex: '(?i)\bip\s+neigh\s+(show|list)\b'
  - id: powershell-get-netipaddress
    desc: PowerShell local IP discovery
    platforms: [windows]
    if:
      type: text
      substr: Get-NetIPAddress
  - id: ifconfig-a
    desc: ifconfig -a command
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: ifconfig -a
  - id: python-getsockname-local-ip
    desc: Extracts local IP via socket
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: 'getsockname\s*\(\s*\)\s*\[\s*0\s*\]'
composite_rules:
  - id: local-interface-query-command
    desc: Queries local network interfaces
    crit: notable
    conf: 0.9
    any:
      - id: ifconfig
      - id: powershell-get-netipaddress
      - id: python-interface-command
