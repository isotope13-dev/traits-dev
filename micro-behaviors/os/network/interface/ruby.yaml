# Network Interface Discovery - Ruby
# Retrieving network interface IP addresses
defaults:
  crit: notable
  conf: 0.75
  platforms: [unix, windows]
  for: [ruby]
  attack: "T1016"
traits:
  - id: socket-ip-address-list
    desc: Socket IP address discovery
    if:
      type: symbol
      kind: call
      exact: "ip_address_list"
      arg: {}
  - id: socket-ip-address-single
    desc: Socket IP address discovery
    if:
      type: symbol
      kind: call
      exact: "ip_address"
      arg: {}
  - id: ruby-udp-connect-local-ip
    desc: Ruby UDP connect trick for local IP
    conf: 0.9
    if:
      type: text
      regex: 'UDPSocket\.open.{0,120}connect.{0,80}addr'
composite_rules:
  - id: socket-ip-address
    desc: Socket IP address discovery
    any:
      - id: socket-ip-address-list
      - id: socket-ip-address-single
      - id: ruby-udp-connect-local-ip
