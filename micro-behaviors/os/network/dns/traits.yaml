defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: dns-txt-query-fn
    desc: DNS TXT record query function
    if:
      type: symbol
      exact: "Resolve-DnsName"
  - id: resolve-dns-name
    desc: PowerShell Resolve-DnsName
    crit: baseline
    conf: 0.8
    if:
      type: text
      word: Resolve-DnsName
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: dns-txt-query-fn
