defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: premium-proxy-node-entry
  desc: Premium proxy node entry
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      ((object
        (pair key: [(property_identifier) @premium (string (string_fragment) @premium)] value: (true))
        (pair key: [(property_identifier) @host (string (string_fragment) @host)] value: (string))) @node
        (#eq? @premium "premium")
        (#eq? @host "host"))

      ((object
        (pair key: [(property_identifier) @host (string (string_fragment) @host)] value: (string))
        (pair key: [(property_identifier) @premium (string (string_fragment) @premium)] value: (true))) @node
        (#eq? @premium "premium")
        (#eq? @host "host"))
- id: proxy-route-action
  desc: Proxy route action literal
  crit: notable
  conf: 0.93
  if:
    type: literal
    kind: string
    regex: ^(ROUTE_APPLY|APPLY_ROUTE)$
- id: proxy-resolver-ip-selection
  desc: Config enables hostname-to-IP resolution
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      (pair
        key: [(property_identifier) @key (string (string_fragment) @key)]
        value: (true) @value
        (#eq? @key "useDnsResolve"))
- id: proxy-endpoint-country-subdomain-fleet
  desc: Endpoint list uses country-code subdomains
  crit: notable
  conf: 0.9
  count_min: 5
  if:
    type: text
    regex: '"host"\s*:\s*"[a-z]{2}\.[a-z0-9-]{3,40}\.[a-z]{2,12}"'
composite_rules:
- id: extension-proxy-doh-endpoint
  desc: Proxy settings with DNS-over-HTTPS endpoint
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
  any:
  - id: micro-behaviors/communications/dns/doh::doh-cloudflare-json
  - id: micro-behaviors/communications/dns/doh::doh-google-json
- id: extension-proxy-host-doh-resolution
  desc: Proxy host assignment with DNS-over-HTTPS APIs
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
  - id: micro-behaviors/os/network/webextension::proxy-host-assignment-from-call
  - id: proxy-resolver-ip-selection
  any:
  - id: micro-behaviors/communications/dns/doh::doh-cloudflare-json
  - id: micro-behaviors/communications/dns/doh::doh-google-json
- id: premium-non-routable-proxy-node
  desc: Premium proxy catalog with nearby loopback host
  crit: notable
  conf: 0.98
  near_bytes: 256
  all:
  - id: premium-proxy-node-entry
  - id: micro-behaviors/communications/ip/endpoint::javascript-loopback-host-property
- id: proxy-route-failure-reply
  desc: Route action and nearby failure reply
  crit: notable
  conf: 0.96
  near_lines: 8
  all:
  - id: proxy-route-action
  - id: micro-behaviors/communications/ipc/message::extension-message-failure-reply
- id: premium-raw-ip-proxy-node-table
  desc: Premium proxy tier uses a raw-IP node table
  crit: notable
  conf: 0.97
  all:
  - id: premium-proxy-node-entry
  - id: micro-behaviors/communications/ip/endpoint::javascript-non-resolver-ipv4-host-table
- id: extension-raw-ip-proxy-relay
  desc: Browser SOCKS5 relay with IPv4 endpoint catalog
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/network/webextension::extension-fixed-socks5-browser-relay
  - id: micro-behaviors/communications/ip/endpoint::javascript-non-resolver-ipv4-host-table
- id: extension-premium-raw-ip-proxy-catalog
  desc: Browser SOCKS5 relay with premium IPv4 nodes
  crit: notable
  conf: 0.98
  all:
  - id: extension-raw-ip-proxy-relay
  - id: premium-raw-ip-proxy-node-table
- id: extension-doh-resolved-socks5-proxy
  desc: Browser SOCKS5 proxy resolves its host through DoH
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/network/webextension::extension-fixed-socks5-browser-relay
  - id: extension-proxy-host-doh-resolution
- id: extension-country-socks5-proxy-catalog
  for:
  - javascript
  - typescript
  - crx
  - xpi
  - zip
  desc: Browser SOCKS5 relay with country endpoint catalog
  crit: notable
  conf: 0.95
  scope: archive
  all:
  - id: micro-behaviors/os/network/webextension::extension-fixed-socks5-browser-relay
  - id: proxy-endpoint-country-subdomain-fleet
  any:
  - id: premium-proxy-node-entry
  - id: micro-behaviors/browser-extension/tabs::install-https-tab-open
- id: premium-proxy-loopback-failure-profile
  desc: Premium proxy loopback nodes and failure replies
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/os/network/webextension::extension-fixed-socks5-browser-relay
  - id: micro-behaviors/os/network/webextension::premium-non-routable-proxy-node
  - id: micro-behaviors/os/network/webextension::proxy-route-failure-reply
