# Browser-extension proxy configuration (chrome.proxy.settings). Generic
# technique: changing the network proxy configuration. The change affects all
# browser traffic and is security-relevant even for legitimate VPN extensions.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: chrome-proxy-api
    desc: Chrome proxy API usage
    if:
      type: text
      regex: '(chrome|browser)\.proxy\.[A-Za-z_]'
  - id: chrome-proxy-settings-set
    desc: Chrome proxy settings modification
    if:
      type: text
      regex: '(chrome|browser)\.proxy\.settings\.set\s*\('
  - id: chrome-proxy-settings-clear
    desc: Chrome proxy settings cleared
    if:
      type: text
      regex: '(chrome|browser)\.proxy\.settings\.clear\s*\('

  - id: chrome-pac-script-config
    desc: Configures PAC script browser proxy
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'pac_script[\s\S]{0,200}FindProxyForURL\s*\('

  - id: chrome-dnr-user-agent-header-set
    desc: DNR session rule sets User-Agent header
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'modifyHeaders[\s\S]{0,320}\buser-agent\b[\s\S]{0,120}\boperation\b\s*:\s*["'']set["'']'

  # These are neutral WebExtension configuration mechanics.  The objective
  # layer combines them before inferring that an add-on is forcing all
  # browser destinations through an operator-selected relay.
  - id: chrome-proxy-fixed-server-mode
    desc: Uses fixed browser proxy mode
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bmode\s*:\s*["'']fixed_servers["'']'

  - id: chrome-proxy-socks5-scheme
    desc: Uses SOCKS5 browser proxy scheme
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bscheme\s*:\s*["'']socks5["'']'

  - id: chrome-proxy-bypass-list-key
    desc: Sets a browser proxy bypass list
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bbypassList\s*:'

  - id: chrome-proxy-loopback-value-list
    desc: Browser proxy bypass list contains loopback
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bbypassList\s*:\s*\[[^\]]{0,120}(localhost|127\.0\.0\.1|::1|<-loopback>)[^\]]{0,40}\]'

  - id: chrome-proxy-loopback-bypass-constant
    desc: Browser proxy loopback bypass constant
    crit: component
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      regex: '\b(bypass|exclude)\w*\s*=\s*\[[^]]{0,80}["'']localhost["'']'

  # The assignment target must itself name a proxy. Two earlier spellings were
  # too wide: a bare `hostname = fn(...)` / `x = await resolveAnything(...)`
  # (a 2FA add-on's `hostname = extractHostnameFromUrl(url)` matched), and then
  # a `resolved(host|ip|addr)` branch that still had no proxy in it -- a wallet
  # SDK's `resolvedAddress = await adapter.getAddress(...)` matched. Requiring
  # `proxy` inside the identifier keeps `resolvedProxyHost` and drops both.
  - id: proxy-host-assignment-from-call
    desc: Proxy host assigned from a call
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\b\w*proxy(host|ip|addr\w*)\s*=\s*(await\s+)?[\w$.]+\s*\('

composite_rules:
  - id: chrome-proxy-loopback-bypass
    desc: Browser proxy bypass includes loopback
    crit: component
    conf: 0.93
    any:
      - id: chrome-proxy-loopback-value-list
      - id: chrome-proxy-loopback-bypass-constant

  - id: chrome-proxy-fixed-socks5-config
    desc: Configures a fixed SOCKS5 browser proxy
    crit: notable
    conf: 0.96
    near_lines: 12
    all:
      - id: chrome-proxy-fixed-server-mode
      - id: chrome-proxy-socks5-scheme
