# Browser-extension proxy configuration (chrome.proxy.settings). Generic
# technique: changing the network proxy configuration. Routing browser traffic
# through an attacker proxy is a real abuse, so notable.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: chrome-proxy-api
    desc: Chrome proxy API usage
    if:
      type: text
      regex: '(chrome|browser)\.proxy\.[A-Za-z_]'
  - id: chrome-proxy-settings-set
    desc: Chrome proxy settings modification
    if:
      type: text
      regex: '(chrome|browser)\.proxy\.settings\.set\s*\('
  - id: chrome-proxy-settings-clear
    desc: Chrome proxy settings cleared
    if:
      type: text
      regex: '(chrome|browser)\.proxy\.settings\.clear\s*\('

  # These are neutral WebExtension configuration mechanics.  The objective
  # layer combines them before inferring that an add-on is forcing all
  # browser destinations through an operator-selected relay.
  - id: chrome-proxy-fixed-server-mode
    desc: Uses fixed browser proxy mode
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bmode\s*:\s*["'']fixed_servers["'']'

  - id: chrome-proxy-socks5-scheme
    desc: Uses SOCKS5 browser proxy scheme
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bscheme\s*:\s*["'']socks5["'']'

  - id: chrome-proxy-bypass-list-key
    desc: Sets a browser proxy bypass list
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\bbypassList\s*:'

  - id: chrome-proxy-loopback-value-list
    desc: Proxy bypass value contains loopback
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\[[^\]]{0,120}(localhost|127\.0\.0\.1|::1|<-loopback>)[^\]]{0,40}\]'

  - id: browser-proxy-async-resolution-result
    desc: Assigns an asynchronous resolution result
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[\w$]+\s*=\s*await\s+(resolve\w*|lookup\w*|getaddrinfo)\s*\('

  - id: browser-proxy-host-selection
    desc: Selects a resolved proxy host
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\b(hostname|(proxy|resolved)(Host|Ip|Address))\s*=\s*(await\s+)?\w+\s*\('

composite_rules:
  - id: chrome-proxy-fixed-socks5-config
    desc: Configures a fixed SOCKS5 browser proxy
    crit: notable
    conf: 0.96
    near_lines: 12
    all:
      - id: chrome-proxy-fixed-server-mode
      - id: chrome-proxy-socks5-scheme

  - id: chrome-proxy-loopback-bypass-list
    desc: Proxy bypass list includes loopback
    crit: notable
    conf: 0.94
    near_lines: 24
    all:
      - id: chrome-proxy-bypass-list-key
      - id: chrome-proxy-loopback-value-list

  - id: browser-proxy-host-from-resolution
    desc: Async resolution result feeds proxy host
    crit: notable
    conf: 0.9
    near_lines: 12
    all:
      - id: browser-proxy-async-resolution-result
      - id: browser-proxy-host-selection
