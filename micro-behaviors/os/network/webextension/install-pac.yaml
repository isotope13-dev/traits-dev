# Co-occurring installation listener and PAC configuration are neutral.
# The PAC program and authorization remain outside this static evidence.
defaults:
  platforms: [unix, windows]
  for: [xpi, javascript, chrome-manifest]

composite_rules:
- id: extension-install-listener-remote-pac-settings
  desc: Install listener with remote PAC settings
  crit: notable
  conf: 0.95
  scope: archive
  all:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
  - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
  - id: micro-behaviors/os/network/webextension::chrome-pac-script-literal-url
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: metadata/permission/extension-api::permission-proxy

