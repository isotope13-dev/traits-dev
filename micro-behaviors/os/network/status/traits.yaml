defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: ipconfig
    desc: Windows ipconfig command reference
    conf: 0.75
    if:
      type: text
      regex: '(?i)(^|[\s"'';&|])ipconfig(\.exe)?([\s/-]|$)'
  - id: netstat
    desc: netstat command
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      regex: '(?i)(^|[\s"'';&|])netstat(\.exe)?([\s/-]|$)'
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
    downgrade:
      any:
        - id: metadata/binary/resource/
  - id: rust-netstat-command
    desc: Rust launches netstat for network status
    for: [rust]
    if:
      type: text
      regex: 'Command::new\("netstat"\)'
  - id: rust-ss-command
    desc: Rust launches ss for socket status
    for: [rust]
    platforms: [linux]
    if:
      type: text
      regex: 'Command::new\("ss"\)'
  - id: rust-lsof-network-command
    desc: Rust launches lsof network listing
    for: [rust]
    platforms: [macos]
    if:
      type: text
      regex: 'Command::new\("lsof"\)[\s\S]{0,100}\.args\(\["-i"'
  - id: rust-nettop-command
    desc: Rust launches nettop network monitor
    for: [rust]
    platforms: [macos]
    if:
      type: text
      regex: 'Command::new\("nettop"\)'
  - id: netstat-an
    desc: netstat -an command
    if:
      type: text
      regex: '(?i)(^|[\s"'';&|])netstat(\.exe)?\s+-an\b'
  - id: ss
    desc: ss socket statistics
    if:
      type: text
      regex: \bss\s+-[atnlup]
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: lsof-i
    desc: lsof network listing
    if:
      type: text
      substr: lsof -i
  - id: rp-filter-kernel-path
    desc: Linux reverse-path-filter sysctl path reference
    crit: notable
    conf: 0.9
    for: [elf, c, cpp, scripts, binaries]
    platforms: [linux]
    if:
      type: text
      regex: '/proc/sys/net/ipv4/conf/(all|default)/rp_filter'
