defaults:
  platforms: [routeros, appliance, unix]
  for: [python, pyc, c, cpp, objc, rust, go, elf]
  attack: T1082

traits:
  - id: routeros-api-network-profile-query
    desc: RouterOS API network profile query
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '/ip/(address|route|arp|dns)/print'
