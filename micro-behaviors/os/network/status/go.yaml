defaults:
  platforms: [unix]
  for: [go, elf, macho]
  attack: T1082

traits:
  - id: go-netstat-command
    desc: Go invokes Unix netstat command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/usr/bin/netstat([^A-Za-z0-9._/-]|$)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/platform/gopsutil::gopsutil-library-context
      - id: metadata/file/naming::busybox-versions-source-file
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-apko-binary
      - type: path
        regex: 'github\.com/shirou/gopsutil(@|@v)'
