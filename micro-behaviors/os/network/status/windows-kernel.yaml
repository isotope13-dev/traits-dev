# Kernel-side network status providers. netstat, Get-NetTCPConnection, resource
# monitor and every connection viewer ultimately ask nsiproxy / tcpip for the
# TCP and UDP tables, so naming those driver and device objects is normal for
# network tooling and filter drivers. Composites that pair the name with a
# dispatch-table overwrite express the intent to filter rows out of the answer.
defaults:
  platforms: [windows]
  for: [binaries, c, cpp, rust, go, csharp]
  crit: notable
traits:
  # Object paths reach the scanner both as raw kernel strings and as C source
  # literals, where every separator is doubled, so the separator is matched one
  # or two characters wide rather than exactly one.
  - id: network-status-provider-driver-object
    desc: Kernel network-status provider driver object
    conf: 0.95
    if:
      type: text
      regex: '(?i)\\{1,2}(Driver|Device)\\{1,2}(nsiproxy|Nsi|Tcpip|Udp)\b'
