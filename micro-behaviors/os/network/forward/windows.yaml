defaults:
  platforms: [windows]
  for: [batch, powershell, csharp, python, javascript, pe, dll]
  crit: notable
  conf: 0.98
  attack: T1090

traits:
  - id: netsh-portproxy-add
    desc: Configures TCP forwarding with netsh portproxy
    if:
      type: text
      regex: '(?i)\bnetsh(\.exe)?\s+interface\s+portproxy\s+add\s+v[46]tov[46]\b'
