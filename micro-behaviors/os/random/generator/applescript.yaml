# The bounds establish a random-number operation, without inferring the
# generator algorithm, cryptographic strength, or purpose of the result.
defaults:
  platforms: [macos]
  for: [applescript, macho]
traits:
  - id: applescript-bounded-random-number
    desc: AppleScript random number with literal bounds
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\(\s*random number from [0-9]+ to [0-9]+\s*\)'
