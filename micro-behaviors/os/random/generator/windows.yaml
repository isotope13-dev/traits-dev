# Cryptographic random number generation - Windows
# Used for encryption key generation
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: vb6-rtc-randomize
    desc: VB6 randomize helper
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: rtcRandomize
  - id: vb6-rtc-random-next
    desc: VB6 random number helper
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: rtcRandomNext
  - id: crypt-gen-random
    desc: Generate cryptographic random bytes
    crit: baseline
    conf: 0.9
    attack: "T1486"
    mbc: "C0027"
    if:
      type: text
      regex: (^|[./])CryptGenRandom$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
  - id: rtl-gen-random
    desc: Generate random bytes (RtlGenRandom)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "RtlGenRandom"
  - id: system-function-036-symbol
    desc: "SystemFunction036 imported"
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "SystemFunction036"

  # SystemFunction036 (RtlGenRandom) named next to the advapi32 DLL name: the
  # LoadLibrary("advapi32.dll") + GetProcAddress(..., "SystemFunction036")
  # pair. Raw bytes, both orders, because string tables put either first.
  # An import table holds the same two names side by side, so a rule that
  # means "resolved at runtime" pairs this with `unless:
  # system-function-036-symbol` (the imported form).
  - id: system-function-036-advapi32-name-pair
    desc: SystemFunction036 named beside advapi32
    crit: notable
    conf: 0.85
    for: [pe]
    if:
      type: raw
      regex: '(?i)advapi32(\.dll)?\x00[\x00-\xff]{0,128}?SystemFunction036\x00'
  - id: system-function-036-advapi32-name-pair-reversed
    desc: SystemFunction036 named before advapi32
    crit: notable
    conf: 0.85
    for: [pe]
    if:
      type: raw
      regex: '(?i)SystemFunction036\x00[\x00-\xff]{0,128}?advapi32(\.dll)?\x00'

composite_rules:
  - id: vb6-runtime-prng
    desc: VB6 runtime PRNG helpers
    crit: baseline
    conf: 0.92
    all:
      - id: vb6-rtc-randomize
      - id: vb6-rtc-random-next
