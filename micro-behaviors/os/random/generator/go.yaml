defaults:
  platforms: [windows, unix]
  for: [go]

traits:
  - id: go-bounded-random-integer-call
    desc: Go bounded random integer helper call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.RandBetween$'

  - id: go-random-byte-range-fill-call
    desc: Go random byte range fill helper call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.RandBytesBetween$'

  - id: go-rand-read-call
    desc: Go fills bytes from rand.Read
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: rand.Read

  - id: go-random-string-bytes-helper
    desc: Go random string byte helper name
    crit: notable
    conf: 0.82
    for: [go, pe, elf, macho]
    if:
      type: text
      word: RandStringBytes
