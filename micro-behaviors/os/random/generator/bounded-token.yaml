# Bounded 257-1024 character random token generation across scripting and source
# languages. Used by session-token generators and length-boundary authentication
# exploits that avoid repeated-character strings; consumers supply protocol intent.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.93

traits:
  - id: python-token-hex-129-to-499
    desc: Generates 258-998 hex chars via token_hex
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '\btoken_hex\s*\(\s*(1(29|[3-9]\d)|[2-4]\d\d)\s*\)'

  - id: random-bytes-500-to-512-token
    desc: Generates 1000-1024 hex chars from 500-512 bytes
    for: [python, javascript, typescript]
    if:
      type: text
      exclude_comments: true
      regex: '\b(token_hex|randomBytes)\s*\(\s*5(0\d|1[0-2])\s*\)'

  - id: python-token-urlsafe-193-to-768
    desc: Generates 258-1024 URL-safe token chars
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '\btoken_urlsafe\s*\(\s*(19[3-9]|[2-6]\d\d|7([0-5]\d|6[0-8]))\s*\)'

  - id: python-random-choices-257-to-999
    desc: Samples 257-999 random chars via choices
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '\brandom\.choices\s*\([^)\n]{1,64}\bk\s*=\s*(25[7-9]|2[6-9]\d|[3-9]\d\d)\b'

  - id: js-randombytes-hex-129-to-499
    desc: Encodes 129-499 random bytes as hex
    for: [javascript, typescript]
    if:
      type: text
      exclude_comments: true
      regex: '\brandomBytes\s*\(\s*(1(29|[3-9]\d)|[2-4]\d\d)\s*\)[^\r\n]{0,24}hex'

  - id: shell-urandom-head-257-to-1019
    desc: Reads 257-1019 bytes from /dev/urandom
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: '/dev/urandom[^\r\n]{0,48}\bhead\s+-c\s*(25[7-9]|2[6-9]\d|[3-9]\d\d|10[01]\d)\b'

composite_rules:
  - id: random-token-257-to-1024
    desc: Generates 257-1024 character random token
    conf: 0.94
    any:
      - id: python-token-hex-129-to-499
      - id: random-bytes-500-to-512-token
      - id: python-token-urlsafe-193-to-768
      - id: python-random-choices-257-to-999
      - id: js-randombytes-hex-129-to-499
      - id: shell-urandom-head-257-to-1019
