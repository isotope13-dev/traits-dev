defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-bounded-random-value
    desc: PowerShell generates a bounded random value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGet-Random\b[^\r\n]{0,100}-Minimum\s+\d+[^\r\n]{0,60}-Maximum\s+\d+'
