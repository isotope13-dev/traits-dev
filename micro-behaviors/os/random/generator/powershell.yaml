defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-bounded-random-value
    desc: PowerShell generates a bounded random value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGet-Random\b[^\r\n]{0,100}-Minimum\s+\d+[^\r\n]{0,60}-Maximum\s+\d+'

  - id: powershell-random-alphanumeric-character-selection
    desc: PowerShell selects random alphanumeric chars
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\(48\.\.57\).{0,100}\(65\.\.90\).{0,100}\(97\.\.122\).{0,100}\bGet-Random\b'
