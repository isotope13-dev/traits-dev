defaults:
  platforms: [windows]
  for: [pe]
composite_rules:

- id: rtlgenrandom-name-pair-with-resolver
  desc: RtlGenRandom name pair with API resolver import
  crit: notable
  conf: 0.92
  all:
    - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  any:
    - id: micro-behaviors/os/random/generator::system-function-036-advapi32-name-pair
    - id: micro-behaviors/os/random/generator::system-function-036-advapi32-name-pair-reversed
  unless:
    # Imported, not resolved: the import table carries the same name pair.
    - id: micro-behaviors/os/random/generator::system-function-036-symbol
    - id: micro-behaviors/os/random/generator::rtl-gen-random
    # The Go runtime resolves SystemFunction036 from LoadLibrary("advapi32.dll")
    # in every Windows binary it builds.
    - id: metadata/lang/compiler/systems::go-binary
    # P/Invoke metadata names both; the assembly imports only mscoree.
    - id: metadata/binary/framework::dotnet-assembly
    - id: well-known/lib/platform/node-notifier/
    - id: well-known/tool/reverse-engineering/x64dbg/
    # Intel compiler math runtime dynamically resolves SystemFunction036 for RtlGenRandom
    - id: metadata/signed/certificate/subject::pe-signer-intel-corporation
