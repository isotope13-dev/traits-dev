# A UUID-generation call is useful behavior even inside a server template.
defaults:
  platforms: [unix, windows]
  for: [jsp]
traits:
  - id: jsp-java-random-uuid-call
    desc: JSP calls Java random UUID generator
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bUUID\.randomUUID\s*\(\s*\)'
