# Weak seed-source mechanics.  Wallet intent is supplied by the consuming
# objective, not inferred from a generic seed assignment.
defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [javascript, typescript, python, c, cpp, rust, go]

traits:
  - id: seed-date-now-assignment
    desc: PRNG seed assigned from Date.now
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\bDate\.now\b'

  - id: seed-time-call-assignment
    desc: PRNG seed assigned from time call
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\btime\s*\('

  - id: seed-clock-token-assignment
    desc: PRNG seed assigned from clock token
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\bclock\b'

  - id: seed-device-id-assignment
    desc: PRNG seed assigned from device identifier
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\bdevice[_-]u?id\b'

  - id: seed-hardware-id-assignment
    desc: PRNG seed assigned from hardware identifier
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\bhardware[_-]u?id\b'

  - id: seed-machine-id-assignment
    desc: PRNG seed assigned from machine identifier
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\bmachine[_-]u?id\b'
