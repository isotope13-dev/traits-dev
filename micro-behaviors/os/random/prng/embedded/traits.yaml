# Embedded PRNG mechanics.  These observations are neutral capabilities; the
# wallet weak-randomness objective combines them with wallet key-material use.
defaults:
  platforms: [windows, linux, macos]
  for: [source, binaries]

traits:
  - id: embedded-prng-source-api
    desc: Embedded PRNG source API
    crit: notable
    conf: 0.88
    for: [c, cpp, rust, elf, macho, pe]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(rng_get|pyb_rng_yasmarang)$'

  - id: state-device-uid-assignment
    desc: State assigned from device UID
    crit: notable
    conf: 0.9
    for: [c]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)\b(state|seed|pad)\w*\s*=\s*[^;\n]{0,80}(UID|UNIQUE_ID)'

  - id: state-timer-assignment
    desc: State assigned from timer state
    crit: notable
    conf: 0.9
    for: [c]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)\b(state|seed|pad)\w*\s*=\s*[^;\n]{0,80}\b(SysTick|RTC)\b'

  - id: state-clock-assignment
    desc: State assigned from clock
    crit: notable
    conf: 0.9
    for: [c]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)\b(state|seed|pad)\w*\s*=\s*[^;\n]{0,80}\b(timer|clock)\b'

  - id: hardware-rng-disabled-compile-config
    desc: Hardware RNG disabled by compile flag
    crit: notable
    conf: 0.92
    for: [c, cpp, rust]
    if:
      type: text
      regex: '(?im)^\s*#\s*define\s+\w*_?(RNG|TRNG)(_\w+)?\s+(\(0\)|0)\s*$'

  - id: software-rng-fallback-branch
    desc: Software RNG fallback branch
    crit: notable
    conf: 0.9
    for: [c, cpp, rust]
    if:
      type: text
      regex: '(?is)#\s*if\s+\w*(RNG|TRNG)\w*.{0,40}\n.{0,280}?#\s*else\b'

  - id: rng-presence-guard
    desc: RNG feature presence compile guard
    crit: notable
    conf: 0.9
    for: [c, cpp, rust]
    if:
      type: text
      regex: '(?is)#\s*ifndef\s+\w*(RNG|TRNG)\w*.{0,80}#\s*error'

  - id: prng-reseed-call
    desc: PRNG reseed call
    crit: notable
    conf: 0.9
    for: [python, javascript, c, cpp, rust, go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)reseed$'

  - id: prng-32bit-reseed-input
    desc: Reseed function accepts 32-bit value
    crit: notable
    conf: 0.9
    for: [c]
    if:
      type: tree-sitter
      kind: function
      regex: '(?is)\b(uint32_t|uint32|u32)\b[^{}]{0,80}\b(reseed|seed)\s*\('

  - id: prng-32bit-unpack
    desc: 32-bit word unpack for reseeding
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)unpack$'
      arg:
        kind: string
        exact: I
