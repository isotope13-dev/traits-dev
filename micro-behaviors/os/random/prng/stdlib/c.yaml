# C-family pseudo-random number generator calls.  This is a neutral source
# capability; network-spoofing objectives may use it only with their own
# packet-construction evidence.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, elf, macho, pe, dll]
  crit: baseline

traits:
  - id: c-rand-family-call
    desc: C rand-family pseudo-random generator call
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^(rand|rand_r|rand_cmwc)$'
