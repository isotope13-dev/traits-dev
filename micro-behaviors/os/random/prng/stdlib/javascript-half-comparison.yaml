# Neutral evidence; intent requires additional context.
traits:
- id: math-random-half-comparison
  desc: Compares Math.random output with 0.5
  crit: notable
  conf: 0.94
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
  if:
    type: tree-sitter
    query: |
      ((binary_expression
        left: (call_expression function: (member_expression
          object: (identifier) @object property: (property_identifier) @method))
        operator: ">" right: (number) @half) @evidence
        (#eq? @object "Math") (#eq? @method "random") (#eq? @half "0.5"))
