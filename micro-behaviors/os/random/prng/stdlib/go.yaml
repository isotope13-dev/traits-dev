# Go math/rand (non-crypto PRNG) import. A neutral RNG capability present in
# countless benign Go programs; relocated here from objectives/impact/wipe so it
# no longer surfaces as a standalone wipe finding. The overwrite-randomizer wipe
# composite references it cross-directory alongside actual secure-wipe evidence.
defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe]
traits:
- id: go-math-rand-pkg
  desc: Go math/rand import
  crit: baseline
  if:
    type: text
    word: math/rand
- id: go-math-rand-int-call
  desc: Go math/rand integer generation call
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: rand.Intn
- id: go-new-source-call
  desc: Constructs a seeded Go PRNG source
  crit: notable
  conf: 0.9
  if:
    type: symbol
    regex: '(^|\.)NewSource$'
- id: go-intn-method-call
  desc: Calls a bounded Go PRNG method
  crit: notable
  conf: 0.85
  if:
    type: symbol
    regex: '(^|\.)Intn$'
  not:
    # The package-level stdlib call has its own more precise atom above.
    - exact: rand.Intn
