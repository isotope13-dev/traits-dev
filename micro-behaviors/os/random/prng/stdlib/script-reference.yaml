defaults:
  platforms: [windows]
  for: [javascript, text]
traits:
- id: js-random-near-js-reference
  desc: Math.random() near a .js reference
  crit: notable
  conf: 0.88
  if:
    type: text
    # Require a .js path/token suffix, not longer extensions such as .jsonl.
    regex: "Math\\.random\\(\\)[\\s\\S]{0,80}\\.js([\"'?]|$|[\\s/\\\\])"
