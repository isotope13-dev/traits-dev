defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: baseline
traits:
  - id: math-random-call
    desc: Calls Math.random()
    conf: 1.0
    if:
      type: symbol
      kind: call
      exact: Math.random
  - id: math-random-bounded-floor
    desc: Small bounded Math.random floor
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: 'Math\.floor\(\s*Math\.random\(\)\s*\*\s*(1[0-9]|2[0-9])\s*\)'
  - id: math-random-index
    desc: 'Math.random used for indexing'
    conf: 1.0
    # `arr[Math.floor(Math.random()…)]` — a random array/string index. The
    # `[`-anchored `Math.floor(Math.random(` run is distinctive as source text.
    if:
      type: text
      regex: '\[\s*Math\.floor\s*\(\s*Math\.random\s*\('

  - id: seedrandom-call
    desc: JavaScript seedrandom PRNG call
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Math\.seedrandom$'

  # This observes variable naming, not wallet use. A later object field
  # (`password: Math.random()`) is a different assignment, and the comma
  # stops the span before that sibling.
  - id: seed-key-math-random-assignment
    desc: Math.random in seed/key/mnemonic assignment
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(mnemonic|seed|private.?key)\s*[:=]\s*[^,\n]{0,80}Math\.random\('
  - id: generate-mnemonic-math-random-arg
    desc: generateMnemonic called with Math.random
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'generateMnemonic\(\s*Math\.random\('
