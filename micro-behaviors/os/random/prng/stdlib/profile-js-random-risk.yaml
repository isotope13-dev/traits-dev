defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]


traits:
  - id: js-random-integer-addition
    desc: Random integer followed by addition
    crit: component
    conf: 0.97
    if:
      type: text
      regex: 'Math\.floor\(Math\.random\(\)\s*\*\s*\d+\)\s*\+'
composite_rules:
  - id: random-risk-score-clues
    desc: Random addition and risk-score wording
    crit: notable
    conf: 0.97
    near_bytes: 400
    all:
      - id: micro-behaviors/os/random/prng/stdlib::js-random-integer-addition
      - id: micro-behaviors/os/security/scan/risk::risk-score-wording
