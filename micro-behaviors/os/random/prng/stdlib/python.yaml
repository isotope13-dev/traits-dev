defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: import-random
    desc: Python random module import
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: ^\s*import\s+random\b

  - id: weak-random-source-call
    desc: Python non-cryptographic random source call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)random\.(getrandbits|randbytes|bytes)$'
