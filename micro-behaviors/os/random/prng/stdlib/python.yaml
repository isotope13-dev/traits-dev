defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: import-random
    desc: Python random module import
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: ^\s*import\s+random\b

  - id: weak-random-source-call
    desc: Python non-cryptographic random generation call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)random\.(getrandbits|randbytes|bytes)$'

  - id: random-integer-call
    desc: Python random integer generation call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: random.randint

  - id: python-random-digit-choices
    desc: Python chooses random decimal digits
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'random\.choices\(\s*["'']0123456789["'']'
