defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: javascript-prefixed-random-id
    desc: Builds prefixed user, install or client ID
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(userId|installId|clientId)\s*=\s*["''][^"'']{1,24}["'']\s*\+\s*Math\.random\(\)'

  - id: javascript-makeuid-random-function
    desc: makeUid function or call occurs near Math.random
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(function\s+makeUid\b|\bmakeUid\s*\()[\s\S]{0,700}\bMath\.random\s*\('
