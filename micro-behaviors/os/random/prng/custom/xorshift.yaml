defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: xorshift-left-23
    desc: XOR-shift update with 23-bit left shift
    for: [python, javascript, typescript]
    if:
      type: tree-sitter
      kind: assignment
      regex: '\b[A-Za-z_]\w{0,63}\s*\^=\s*\w{1,64}\s*<<\s*23\b'
  - id: xorshift-logical-right-17
    desc: XOR-shift update with 17-bit logical shift
    if:
      type: text
      regex: '\b\w+\s*\^=\s*(LShR\s*\(\s*\w+\s*,\s*17\s*\)|\w+\s*>>>\s*17\b)'
  - id: xorshift-logical-right-26
    desc: XOR-shift update with 26-bit logical shift
    if:
      type: text
      regex: '\b\w+\s*\^=\s*(LShR\s*\(\s*\w+\s*,\s*26\s*\)|\w+\s*>>>\s*26\b)'
  - id: smt-floating-output-constraint
    desc: Constrains state against 52-bit floating output
    if:
      type: text
      regex: '\.add\s*\(LShR\s*\(\s*\w+\s*,\s*12\s*\)\s*==\s*int\s*\(\s*\w+\s*\*\s*\(\s*1\s*<<\s*52\s*\)'
composite_rules:
  - id: symbolic-xorshift128-state-solving
    desc: Solves xorshift128 state from floating outputs
    all:
      - id: xorshift-left-23
      - id: xorshift-logical-right-17
      - id: xorshift-logical-right-26
      - id: smt-floating-output-constraint
    near_bytes: 1024
