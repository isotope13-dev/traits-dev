defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  crit: notable

traits:
  - id: mersenne-twister-seed-multiplier
    desc: Mersenne Twister 1812433253 seed multiplier
    conf: 0.96
    if:
      type: text
      regex: '\b(1812433253|0x6[cC]078965)[UuLl]*\b'

  - id: sfmt-array-seed-multipliers
    desc: SFMT 1664525 and 1566083941 seed multipliers
    conf: 0.97
    if:
      type: text
      regex: '\b1664525[UuLl)]*\s*;[\s\S]{0,200}\b1566083941\b'
