# LCG state update followed by high-byte extraction; use is not established.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho]

traits:
  - id: lcg-high-byte-extraction-x86
    desc: LCG high-byte extraction in x86 code
    crit: notable
    conf: 0.85
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      # imul r32, r32, 0x19660D ; ... ; add r32, 0x3C6EF35F ; ... ; shr r32, 24
      pattern: '69 ?? 0D 66 19 00 [0-12] 81 C? 5F F3 6E 3C [0-8] C1 E? 18'
