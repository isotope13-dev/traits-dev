defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: node-random-uuid-import
    desc: Imports Node crypto randomUUID generator
    if:
      type: tree-sitter
      language: javascript
      query: |
        (import_statement
          (import_clause
            (named_imports
              (import_specifier name: (identifier) @api)))
          source: (string (string_fragment) @module)
          (#eq? @api "randomUUID")
          (#match? @module "^(node:)?crypto$")) @import
