# Node.js cryptographic random-value generation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-random-bytes
    desc: Node.js random byte generation
    conf: 0.65
    if:
      type: symbol
      regex: (^|\.)randomBytes$
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure/
  - id: node-random-32-byte-value
    desc: Node.js 32-byte random value
    conf: 0.84
    if:
      type: text
      regex: 'randomBytes\s*\(\s*(32|0x20)\s*\)'
    unless:
      - id: metadata/package/testing/harness/runtime/
  # The symbol view carries no target for `crypto['randomBytes'](n)`, so
  # node-random-bytes above goes dark on minified and obfuscator.io-packed code
  # where every member access is a string-table lookup. Matched on text instead,
  # with the call parens required so property tables and typings stay out.
  #
  # `type: encoded` is required: obfuscator.io ships the property name as a
  # `\xNN` hex escape inside the bracket (`obj['\x72\x61\x6e\x64\x6f\x6d\x42\x79\x74\x65\x73'](n)`),
  # which a raw-text search never sees. The encoded view decodes those escapes
  # (and the XOR string table) before matching.
  - id: node-bracket-random-bytes-call
    desc: Node bracket-named random byte call
    crit: notable
    conf: 0.86
    if:
      type: encoded
      regex: '[A-Za-z_$][\w$]{0,24}\[[''"]randomBytes[''"]\]\s*\('
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: node-random-fill
    desc: Node.js random buffer fill
    conf: 0.65
    if:
      type: symbol
      regex: (^|\.)(randomFill|randomFillSync)$
    unless:
      - id: metadata/package/testing/harness/runtime/

composite_rules:
  - id: node-random-generation
    desc: Node.js cryptographic random-value generation
    crit: notable
    conf: 0.72
    any:
      - id: node-random-bytes
      - id: node-random-32-byte-value
      - id: node-bracket-random-bytes-call
      - id: node-random-fill
