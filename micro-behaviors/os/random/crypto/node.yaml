defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: node-random-bytes
  desc: Node.js random byte generation
  conf: 0.65
  if:
    type: symbol
    regex: (^|\.)randomBytes$
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/build
- id: node-random-32-byte-value
  desc: Node.js 32-byte random value
  conf: 0.84
  if:
    type: text
    regex: randomBytes\s*\(\s*(32|0x20)\s*\)
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: node-bracket-random-bytes-call
  desc: Node bracket-named random byte call
  conf: 0.86
  if:
    type: encoded
    regex: '[A-Za-z_$][\w$]{0,24}\[[''"]randomBytes[''"]\]\s*\('
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: node-random-fill
  desc: Node.js random buffer fill
  conf: 0.65
  if:
    type: symbol
    regex: (^|\.)(randomFill|randomFillSync)$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: node-unbound-random-bytes-call
  desc: Invokes an unbound randomBytes method
  conf: 0.9
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (parenthesized_expression
          (sequence_expression
            . (number) @zero
            . (member_expression
              property: (property_identifier) @method) .))) @call
       (#eq? @zero "0")
       (#eq? @method "randomBytes"))
composite_rules:
- id: node-random-generation
  desc: Node.js cryptographic random-value generation
  conf: 0.72
  any:
  - id: node-random-bytes
  - id: node-random-32-byte-value
  - id: node-bracket-random-bytes-call
  - id: node-random-fill
  - id: node-unbound-random-bytes-call
