defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
- id: x86-cpuid-hardware-rng-probe-a
  desc: x86 CPUID-gated RDRAND instruction pair
  crit: notable
  conf: 0.92
  if:
    type: hex
    section: text
    pattern: C3 8B FF 53 51 6A 01 58 0F A2 F7 C1 00 00 00 40 0F 95 C0 84 C0 74 09
      0F C7 F0 0F C7 F2 59 5B C3
- id: x86-cpuid-rdseed-probe
  desc: x86 CPUID-gated RDSEED instruction pair
  crit: notable
  conf: 0.92
  if:
    type: hex
    section: text
    pattern: C3 6A 07 58 33 C9 0F A2 F7 C3 00 00 04 00 0F 95 C0 84 C0 74 09 0F C7
      F8 0F C7 FA 59 5B C3
