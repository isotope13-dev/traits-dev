defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
  - id: webcrypto-get-random-values
    desc: Generates Web Crypto random bytes
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bcrypto\.getRandomValues\s*\('

# A block-page or download token can call crypto.randomUUID() and keep the
# result in session storage. An install identifier is the call next to a
# local-storage write. The window stays inside one function: SafeHop's block
# token is thousands of bytes from its blocklist and stats writes.
composite_rules:
  - id: webcrypto-uuid-local-persist
    desc: Web Crypto UUID written to local storage
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    near_bytes: 1600
    all:
      - id: webcrypto-random-uuid
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
