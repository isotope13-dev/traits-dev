defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: node-compiled-random-uuid-call
    desc: Compiled Node crypto randomUUID call
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (parenthesized_expression
            (sequence_expression
              . (number) @zero
              . (member_expression
                  object: (identifier) @receiver
                  property: (property_identifier) @api) .))) @call
          (#eq? @zero "0")
          (#eq? @api "randomUUID")
          (#match? @receiver "^(node_)?crypto(_[0-9]+)?$"))
