defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: dev-random
    desc: /dev/random path reference
    conf: 0.7
    if:
      type: text
      substr: /dev/random
  - id: rand-bytes
    desc: RAND_bytes function
    conf: 0.8
    if:
      type: text
      substr: RAND_bytes
  - id: getrandom
    crit: notable
    desc: References the getrandom randomness API
    for: [elf, macho, pe, static-lib, python]
    conf: 0.8
    if:
      type: symbol
      regex: '(^|\.)getrandom$'
  - id: arc4random
    desc: arc4random function
    conf: 0.8
    if:
      type: text
      substr: arc4random
  - id: getentropy
    crit: notable
    desc: References the getentropy randomness API
    conf: 0.8
    if:
      type: text
      substr: getentropy
  - id: secrandomcopybytes
    desc: Apple SecRandomCopyBytes API reference
    crit: notable
    for: [scripts, binaries, swift]
    platforms: [unix, windows, ios]
    conf: 0.8
    if:
      type: text
      substr: SecRandomCopyBytes
  - id: cryptdll-cdlocaterng
    desc: Windows cryptdll.dll CDLocateRng reference
    crit: notable
    conf: 0.8
    for:
      - pe
    platforms:
      - windows
    if:
      type: text
      substr: CDLocateRng
  - id: rdrand-instruction
    desc: RDRAND hardware random instruction
    crit: notable
    conf: 0.45
    count_min: 2
    size_max: 10485760
    for: [pe, elf, macho]
    if:
      type: hex
      section: text
      pattern: "0F C7 (F0|F1|F2|F3|F4|F5|F6|F7)"
    # A managed .text section contains IL, metadata and compressed resources,
    # not an x86 instruction stream. Random resource bytes are not RDRAND.
    unless:
      - id: metadata/binary/framework::dotnet-assembly
