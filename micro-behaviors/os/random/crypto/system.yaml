defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: dev-random
    desc: /dev/random path reference
    conf: 0.7
    if:
      type: text
      substr: /dev/random
  - id: rand-bytes
    desc: RAND_bytes function
    conf: 0.8
    if:
      type: text
      substr: RAND_bytes
  - id: getrandom
    desc: getrandom syscall
    conf: 0.8
    if:
      type: text
      substr: getrandom
    # Go's runtime references getrandom unconditionally; the bare token in a
    # Go binary is toolchain inventory, not a randomness call.
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
  - id: arc4random
    desc: arc4random function
    conf: 0.8
    if:
      type: text
      substr: arc4random
  - id: getentropy
    desc: getentropy function
    conf: 0.8
    if:
      type: text
      substr: getentropy
  - id: secrandomcopybytes
    desc: SecRandomCopyBytes (macOS)
    conf: 0.8
    if:
      type: text
      substr: SecRandomCopyBytes
  - id: cryptdll-cdlocaterng
    desc: Windows cryptdll.dll CDLocateRng reference
    crit: notable
    conf: 0.8
    for:
      - pe
    platforms:
      - windows
    if:
      type: text
      substr: CDLocateRng
  - id: rdrand-instruction
    desc: RDRAND hardware random instruction
    crit: notable
    conf: 0.45
    count_min: 2
    size_max: 10485760
    for: [pe, elf, macho]
    if:
      type: hex
      section: text
      pattern: "0F C7 (F0|F1|F2|F3|F4|F5|F6|F7)"
    # A managed .text section contains IL, metadata and compressed resources,
    # not an x86 instruction stream. Random resource bytes are not RDRAND.
    unless:
      - id: metadata/binary/framework::dotnet-assembly
composite_rules:
  - id: random-source-reference
    desc: Randomness API/device/instruction references
    conf: 0.8
    any:
      - id: micro-behaviors/os/random/crypto::urandom
      - id: dev-random
      - id: rand-bytes
      - id: getrandom
      - id: arc4random
      - id: getentropy
      - id: secrandomcopybytes
      - id: rdrand-instruction
