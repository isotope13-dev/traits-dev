defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.82

traits:
  - id: php-random-bytes
    desc: PHP cryptographic random byte generation
    if:
      type: symbol
      kind: call
      exact: random_bytes

  - id: php-openssl-random-pseudo-bytes
    desc: PHP OpenSSL random byte generation
    if:
      type: symbol
      kind: call
      exact: openssl_random_pseudo_bytes
