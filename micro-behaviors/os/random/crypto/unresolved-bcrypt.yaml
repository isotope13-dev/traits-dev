defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.9
traits:
  - id: bcrypt-genrandom-name-without-symbol
    desc: BCryptGenRandom string lacks a symbol match
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: BCryptGenRandom
      section: rdata
    unless:
      - type: basename
        regex: (?i)(\.dll($|_)|^Microsoft\.AspNetCore\.Cryptography\.Internal\.dll$)
      - type: symbol
        exact: BCryptGenRandom
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/signature/verified/signer::johannes-schindelin
    # A name string without a matching import is not proof of dynamic loading.

