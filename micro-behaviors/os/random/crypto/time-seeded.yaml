# A wall-clock-seeded libc PRNG is not inherently malicious, but it is a
# precise and security-relevant source shape when used to generate key
# material.  Ransomware-specific intent is expressed by consumers under
# objectives/impact/ransom/.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, rust, go, elf, macho, pe, dll]

traits:
  - id: time-seeded-prng-source
    desc: PRNG seeded from wall-clock time
    crit: notable
    conf: 0.92
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '(?i)\bsrand\s*\([^;\n]{0,80}\btime\s*\(\s*(NULL|0)?\s*\)'
