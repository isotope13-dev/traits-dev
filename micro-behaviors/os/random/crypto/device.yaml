defaults:
  for: [scripts, binaries]
  platforms:
    - unix
    - windows
traits:
  - id: urandom
    desc: Access /dev/urandom
    crit: baseline
    conf: 1.0
    platforms:
      - unix
    if:
      type: text
      substr: /dev/urandom
    # Go's runtime falls back to /dev/urandom on its own; the path in a Go
    # binary is toolchain inventory, not program randomness behavior.
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
