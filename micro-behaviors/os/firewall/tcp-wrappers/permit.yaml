defaults:
  platforms: [unix]
  for: [shell, python, perl, ruby, javascript, go, elf]

traits:
  - id: hosts-allow-permit-all
    desc: References a permit-all tcp_wrappers rule
    conf: 0.94
    if:
      type: text
      regex: '(?i)(hosts\.allow.{0,40}ALL\s*:\s*ALL|ALL\s*:\s*ALL.{0,40}hosts\.allow)'

