defaults:
  platforms: [unix]
  for: [shell, python, perl, ruby, javascript, go, elf]

composite_rules:
  - id: tcp-wrappers-deny-list-cleared
    desc: Clears the tcp_wrappers deny list
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/os/firewall/tcp-wrappers::hosts-deny-truncate
      - id: micro-behaviors/os/firewall/tcp-wrappers::hosts-deny-delete
      - id: micro-behaviors/os/firewall/tcp-wrappers::hosts-deny-open-write

