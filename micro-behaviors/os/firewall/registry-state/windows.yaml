# Windows Firewall per-profile state managed through the registry, below the
# supported netsh/INetFwPolicy2 management surface. The profile key path and
# the EnableFirewall/DoNotAllowExceptions/DisableNotifications value names are
# neutral references; the impairment composite in
# objectives/impact/degrade/firewall adds the write evidence.
defaults:
  for: [pe, dll, batch, powershell]
  platforms: [windows]
  crit: notable
  attack: T1562.004

traits:
  - id: firewall-profile-policy-path
    desc: Windows Firewall profile policy registry path
    conf: 0.9
    if:
      type: text
      substr: FirewallPolicy\StandardProfile
      case_insensitive: true

  - id: firewall-enable-state-value
    desc: Firewall EnableFirewall state value name
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bEnableFirewall\b'

  - id: firewall-exceptions-state-value
    desc: Firewall DoNotAllowExceptions value name
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bDoNotAllowExceptions\b'

  - id: firewall-notify-state-value
    desc: Firewall DisableNotifications value name
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bDisableNotifications\b'

composite_rules:
  - id: firewall-profile-state-values
    desc: Firewall profile state value names
    conf: 0.92
    any:
      - id: firewall-enable-state-value
      - id: firewall-exceptions-state-value
      - id: firewall-notify-state-value
    needs: 2
