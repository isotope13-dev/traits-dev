# `source` is in `for:` alongside scripts and PE: the registry values and
# service names below identify RDP enablement wherever they are written, and
# compiled-language implants (C#, Go, Rust, C++) reach the same keys through
# the registry API rather than through reg.exe.
defaults:
  platforms: [windows]
  for: [scripts, source, pe]
  attack: T1021.001
  mbc: B0022

traits:
  - id: rdp-firewall-remote-desktop
    desc: Firewall command targets Remote Desktop
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bnetsh(\.exe)?\b[^\r\n]{0,120}\bremote[ -]?desktop\b'
    unless:
      - id: well-known/app/infrastructure/facterdb::facterdb-packer-image-build-context
      - id: well-known/app/infrastructure/facterdb::facterdb-windows-packer-tree

