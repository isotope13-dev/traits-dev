defaults:
  platforms:
  - windows
traits:
- id: batch-netsh-remotedesktop-enable
  desc: Batch enables RDP firewall service
  for:
  - batch
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)netsh\s+firewall\s+set\s+service.{0,80}remotedesktop.{0,80}mode\s*=\s*enable
- id: batch-netsh-open-rdp-port
  desc: Batch opens RDP port
  for:
  - batch
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)netsh\s+firewall\s+add\s+portopening.{0,80}\b3389\b
- id: batch-advfirewall-add-rule
  desc: Batch advfirewall add rule command
  for:
  - batch
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)netsh\s+advfirewall\s+firewall\s+add\s+rule\b
- id: batch-firewall-localport-3389
  desc: Firewall rule sets localport 3389
  for:
  - batch
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)localport\s*=\s*3389
- id: batch-firewall-action-allow
  desc: Firewall rule sets action allow
  for:
  - batch
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (?i)action\s*=\s*allow
- id: batch-advfirewall-set-rule
  desc: Batch advfirewall set rule command
  for:
  - batch
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)netsh\s+advfirewall\s+firewall\s+set\s+rule\b
- id: batch-wmi-firewall-group-name
  desc: Windows Management Instrumentation rule group
  for:
  - batch
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: windows management instrumentation
    case_insensitive: true
- id: batch-firewall-enable-yes
  desc: Firewall rule enable equals yes
  for:
  - batch
  crit: component
  conf: 0.88
  if:
    type: text
    regex: (?i)enable\s*=\s*yes
- id: rdp-firewall-remote-desktop
  desc: Firewall command targets Remote Desktop
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\bnetsh(\.exe)?\b[^\r\n]{0,120}\bremote[ -]?desktop\b
  unless:
  - id: well-known/app/infrastructure/facterdb::facterdb-packer-image-build-context
  - id: well-known/app/infrastructure/facterdb::facterdb-windows-packer-tree
- id: rdp-firewall-enabled-tcp-3389-value
  desc: Enabled TCP 3389 firewall exception value
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)3389:TCP:[^"\r\n]{0,24}:Enabled
composite_rules:
- id: batch-advfirewall-rdp-allow-rule
  desc: Batch advfirewall allows inbound TCP 3389
  for:
  - batch
  crit: notable
  conf: 0.95
  near_lines: 1
  all:
  - id: micro-behaviors/os/firewall/netsh::batch-advfirewall-add-rule
  - id: micro-behaviors/os/firewall/netsh::batch-firewall-localport-3389
  - id: micro-behaviors/os/firewall/netsh::batch-firewall-action-allow
- id: batch-advfirewall-wmi-enable
  desc: Batch enables remote WMI firewall group
  for:
  - batch
  crit: notable
  conf: 0.94
  near_lines: 1
  all:
  - id: micro-behaviors/os/firewall/netsh::batch-advfirewall-set-rule
  - id: micro-behaviors/os/firewall/netsh::batch-wmi-firewall-group-name
  - id: micro-behaviors/os/firewall/netsh::batch-firewall-enable-yes
- id: rdp-firewall-enable
  desc: Firewall command enables a Remote Desktop rule
  for:
  - scripts
  - source
  - pe
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/os/firewall/netsh::netsh-firewall-rule-enable
  - id: micro-behaviors/os/firewall/netsh::rdp-firewall-remote-desktop
  near_lines: 1
