defaults:
  platforms: [windows]
  for: [batch]
  attack: T1219
  mbc: B0022

traits:
  - id: batch-netsh-remotedesktop-enable
    desc: Batch enables RDP firewall service
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?im)^\s*@?netsh\s+firewall\s+set\s+service.{0,80}remotedesktop.{0,80}mode\s*=\s*enable'

  - id: batch-netsh-open-rdp-port
    desc: Batch opens RDP port
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?im)^\s*@?netsh\s+firewall\s+add\s+portopening.{0,80}\b3389\b'

