# `netsh advfirewall` is shelled out from every language that ships Windows
# support, not just Python: Rust/Go/C# services opening their own listening
# port, installers, and malware punching an inbound hole all emit the same
# command text.  Keep the matcher defined once and let the file types be broad.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.92
  attack: T1562.004

traits:
  - id: netsh-advfirewall-rule-query
    desc: Queries Windows firewall rule
    if:
      type: text
      regex: '(?i)netsh.{0,120}advfirewall.{0,120}(show|query).{0,40}rule'

  - id: netsh-advfirewall-rule-delete
    desc: Deletes Windows firewall rule
    if:
      type: text
      regex: '(?i)netsh.{0,120}advfirewall.{0,120}delete.{0,40}rule'

  - id: netsh-advfirewall-rule-allow
    desc: Adds Windows firewall allow rule
    if:
      type: text
      regex: '(?i)netsh.{0,120}advfirewall.{0,120}add.{0,40}rule.{0,80}action[= ]allow'

  - id: netsh-legacy-allowedprogram-add
    desc: Adds legacy netsh allowed-program exception
    if:
      type: text
      regex: '(?i)netsh\s+firewall\s+add\s+allowedprogram\b'
