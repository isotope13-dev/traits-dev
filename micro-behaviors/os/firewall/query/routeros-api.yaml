defaults:
  platforms: [routeros, appliance, unix]
  for: [python, pyc, c, cpp, objc, rust, go, elf]
  attack: T1082

traits:
  - id: routeros-api-firewall-query
    desc: RouterOS API firewall query
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '/ip/firewall/(filter|nat|connection)/print'
