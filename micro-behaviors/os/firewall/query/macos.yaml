defaults:
  platforms: [macos]
  for: [shell, macho, applescript]
  crit: notable
  conf: 0.95

traits:
  - id: socketfilterfw-globalstate-query
    desc: Queries macOS application firewall state
    if:
      type: text
      regex: '\bsocketfilterfw\s+--getglobalstate\b'

  - id: defaults-firewall-globalstate-read
    desc: Reads macOS firewall globalstate preference
    if:
      type: text
      regex: '\bdefaults\s+read\s+\S*com\.apple\.alf\s+globalstate\b'
