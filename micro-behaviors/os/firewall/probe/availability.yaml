defaults:
  platforms: [unix, android, ios]
  for: [elf, shell]

traits:
  - id: firewall-command-v-lookup
    desc: Firewall tool lookup via command -v
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bcommand -v\s+(firewalld|ufw|iptables|nft)\b'
  - id: firewall-which-lookup
    desc: Looks up a firewall tool with which
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bwhich\s+(firewalld|ufw|iptables|nft)\b'
  - id: firewall-systemctl-is-active
    desc: Checks firewall service state via is-active
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bsystemctl\s+is-active\s+(firewalld|ufw|iptables|nft)\b'
  - id: firewall-systemctl-status
    desc: Queries firewall service status via systemctl
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bsystemctl\s+status\s+(firewalld|ufw|iptables|nft)\b'
