defaults:
  conf: 0.5
  platforms:
    - unix
  for:
    - shell
    - elf
  crit: notable
traits:
  - id: which-firewall-cmd
    desc: which firewall-cmd
    if:
      type: text
      substr: which firewall-cmd
  - id: which-ufw
    desc: which ufw
    if:
      type: text
      substr: which ufw
  - id: command-v-ufw
    desc: command -v ufw
    if:
      type: text
      substr: command -v ufw
  - id: which-iptables
    desc: which iptables
    if:
      type: text
      substr: which iptables
