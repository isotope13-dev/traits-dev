# IPsec filter policy objects installed through the local policy store select
# their filter action by GUID. MS-GPIPSEC fixes
# {3F91A819-7647-11D1-864D-D46A00000000} as the Block negotiation action, so a
# policy carrying it drops matched traffic instead of negotiating or
# permitting it. A filter blob holding several 255.255.255.255 (/32) masks is
# a list of single-host filters, the blocklist shape the AntiFireWall trojan
# construction (REGEDIT import + activation, convicted by multiple vendors as
# Trojan.WinREG.AntiFireWall / REG_ANTIFIREWA) uses to cut off enumerated
# remote hosts on all ports and protocols. Either observation alone is neutral
# administration; the impairment composite in
# objectives/impact/degrade/firewall/policy combines them with activation.
defaults:
  platforms: [windows]
  for: [reg]
  crit: notable
  conf: 0.94
  attack: T1562.004

traits:
  - id: ipsec-block-negotiation-action
    desc: IPsec Block negotiation action GUID
    if:
      type: text
      regex: '(?i)\b3f91a819-7647-11d1-864d-d46a00000000\b'

  - id: ipsec-single-host-filter-masks
    desc: Repeated /32 masks in IPsec filter data
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)ff,ff,ff,ff'

composite_rules:
  - id: ipsec-local-block-policy-activated
    desc: Activates local IPsec policy with Block action
    conf: 0.96
    scope: file
    all:
      - id: ipsec-block-negotiation-action
      - id: micro-behaviors/os/registry/policy/reference::ipsec-local-policy-path
      - id: micro-behaviors/os/registry/policy/reference::ipsec-active-policy-value
