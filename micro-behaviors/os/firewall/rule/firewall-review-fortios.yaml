defaults:
  platforms: [fortios, windows]
  for: [java, kotlin, class, jar, zip, powershell]

traits:
  - id: fortios-deny-any-policy
    desc: FortiOS deny-any firewall policy
    crit: notable
    conf: 0.92
    for: [java, kotlin, class, powershell]
    if:
      type: text
      regex: '"srcintf".{0,80}"any".{0,160}"dstintf".{0,80}"any".{0,160}"action".{0,40}"deny"'

composite_rules:
  - id: fortios-policy-disable
    desc: FortiOS policy endpoint and disabled status
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/services/fortios::fortios-firewall-policy-api
      - id: metadata/lang/source/syntax/assignment/value::disabled-status-assignment

  - id: fortios-policy-config-clues
    desc: FortiOS firewall policy configuration clues
    crit: suspicious
    conf: 0.98
    needs: 2
    any:
      - id: micro-behaviors/communications/http/services/fortios::fortios-firewall-policy-api
      - id: micro-behaviors/communications/http/services/fortios::fortios-firewall-policy-api-bytecode
      - id: micro-behaviors/os/firewall/rule::fortios-deny-any-policy
      - id: metadata/binary/code/bytecode::deny-action-json-bytecode
      - id: micro-behaviors/os/firewall/rule::fortios-policy-disable
      - id: micro-behaviors/communications/http/services/fortios::fortios-ip-pool-api
