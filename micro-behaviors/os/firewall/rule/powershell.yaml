# Instantiation proves access to the firewall management surface, not that a
# rule was installed or that the firewall was disabled.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-firewall-policy-object
    desc: PowerShell creates a firewall policy object
    if:
      type: symbol
      kind: call
      exact: New-Object
      arg:
        kind: identifier
        name_regex: '(?i)^HNetCfg\.FwPolicy2$'
  - id: powershell-firewall-rule-object
    desc: PowerShell creates a firewall rule object
    if:
      type: symbol
      kind: call
      exact: New-Object
      arg:
        kind: identifier
        name_regex: '(?i)^HNetCfg\.FWRule$'
