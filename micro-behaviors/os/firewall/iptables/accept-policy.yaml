defaults:
  platforms: [unix]
  for: [shell, python, javascript, elf, macho]
  crit: notable
  conf: 0.95
traits:
  - id: iptables-policy-accept
    desc: iptables sets INPUT or OUTPUT ACCEPT policy
    if:
      type: text
      regex: 'iptables\s+(-P|--policy)\s+(INPUT|OUTPUT)\s+ACCEPT'
  - id: ip6tables-policy-accept
    desc: ip6tables sets INPUT or OUTPUT ACCEPT policy
    if:
      type: text
      regex: 'ip6tables\s+(-P|--policy)\s+(INPUT|OUTPUT)\s+ACCEPT'
