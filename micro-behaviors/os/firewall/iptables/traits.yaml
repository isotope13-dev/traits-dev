defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: iptables
    desc: iptables command
    if:
      type: text
      # Require a command option; a MIME description such as
      # "iptables configuration file" is not command execution.
      regex: '(?im)(^|[;&|\s])(sudo\s+)?(/sbin/)?iptables\s+-[A-Za-z-]+'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: iptables-prerouting-redirect
    desc: Uses iptables PREROUTING REDIRECT rule
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?im)(^|[;&|])\s*(sudo\s+)?iptables.{0,100}PREROUTING.{0,100}REDIRECT

  - id: native-iptables-prerouting-redirect
    desc: Native source redirects inbound traffic
    crit: notable
    conf: 0.9
    for: [c, cpp, elf]
    platforms: [unix]
    if:
      type: text
      regex: '(?i)\biptables\b[^\n]{0,100}\bPREROUTING\b[^\n]{0,100}\bREDIRECT\b'
  - id: iptables-policy-change
    desc: Changes an iptables chain policy
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?im)(^|[;&|])\s*(sudo\s+)?iptables\s+(-P|--policy)
  - id: iptables-accept-dport
    desc: Adds an inbound iptables port allow rule
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\biptables\b[^\n]{0,100}\bINPUT\b[^\n]{0,80}--dport\s+[0-9]{2,5}[^\n]{0,40}\bACCEPT\b'
  - id: ip6tables
    desc: ip6tables command
    if:
      type: text
      substr: ip6tables
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: iptables-save
    desc: iptables-save command
    if:
      type: text
      substr: iptables-save
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: ip6tables-save
    desc: ip6tables-save command
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    if:
      type: text
      substr: ip6tables-save
  - id: iptables-save-system-rules
    desc: iptables-save writes system rules
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    if:
      type: text
      regex: '\biptables-save\s*>\s*/etc/iptables/iptables\.rules\b'
  - id: ip6tables-save-system-rules
    desc: ip6tables-save writes system rules
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    if:
      type: text
      regex: '\bip6tables-save\s*>\s*/etc/iptables/ip6tables\.rules\b'
  - id: iptables-flush-flag
    desc: iptables flush flag
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: iptables\s+(-F|--flush)
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: ip6tables-flush-flag
    desc: ip6tables flush flag
    crit: notable
    conf: 0.85
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    if:
      type: text
      regex: ip6tables\s+(-F|--flush)
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: iptables-delete-chain-flag
    desc: iptables delete chain flag
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: iptables\s+(-X|--delete-chain)
  - id: ip6tables-delete-chain-flag
    desc: ip6tables delete chain flag
    crit: notable
    conf: 0.8
    ref: sha256:4f2559adefb2c0f7a7efa5d9395565bb1a0e4e9f5ce62a8b8be433facbb2d3be
    if:
      type: text
      regex: ip6tables\s+(-X|--delete-chain)
  # Netfilter rule fragments assembled programmatically (python-iptables,
  # Popen argument lists, Go/C netfilter bindings) never carry the literal
  # `iptables` token, so the command-anchored rules above miss them.  These
  # two target names identify the rule itself: MASQUERADE turns the host into
  # a NAT gateway and REDIRECT bends inbound traffic to a local port -- the
  # setup step for tethering, traffic relays, and proxyjacking implants.
  - id: nat-masquerade-target
    desc: Netfilter MASQUERADE NAT rule target
    crit: notable
    conf: 0.9
    platforms: [unix]
    if:
      type: text
      regex: '-j\s{1,4}MASQUERADE\b'
  - id: nat-postrouting-source-rule
    desc: Netfilter POSTROUTING chain with source selector
    crit: notable
    conf: 0.8
    platforms: [unix]
    if:
      type: text
      regex: '\bPOSTROUTING\b[^\n]{0,80}(-s|--source|-o)\s'
