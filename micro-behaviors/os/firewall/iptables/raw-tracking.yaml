defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
traits:
  - id: raw-table-flush
    desc: Flushes iptables raw table
    if:
      type: text
      regex: '\biptables\s+-t\s+raw\s+(-F|--flush)\b'
  - id: raw-notrack-rule-append
    desc: Appends raw connection tracking bypass
    if:
      type: text
      regex: '\biptables\s+-t\s+raw\s+-A\s+(OUTPUT|PREROUTING)\b[^;\n]{1,120}-j\s+NOTRACK\b'
