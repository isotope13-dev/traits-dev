defaults:
  platforms: [linux]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.95

# Matches references to complete rule text, including checks (-C) and
# removals (-D). It does not claim that a rule was installed or took effect.
# Permit table selection and match options; never cross shell separators.
traits:
  - id: output-tcp-reset-drop-rule
    desc: References outbound TCP reset drop rule
    if:
      type: text
      regex: '\biptables[^\n;&|]{1,28}\sOUTPUT\s[^\n;&|]{0,32}--tcp-flags\s+RST\s+RST\s+-j\s+DROP\b'
  - id: output-icmp-unreachable-drop-rule
    desc: References ICMP unreachable drop rule
    if:
      type: text
      regex: '\biptables[^\n;&|]{1,28}\sOUTPUT\s[^\n;&|]{0,32}--icmp-type\s+3\s+-j\s+DROP\b'
