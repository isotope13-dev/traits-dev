# WFP source-call evidence; no defense-evasion mapping on component or text clues.
defaults:
  platforms: [windows]

traits:
  - id: fwpm-engine-open-parsed-call
    desc: Parsed FwpmEngineOpen source call
    crit: component
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])FwpmEngineOpen[A-Za-z0-9_]*$'

  - id: fwpm-engine-open-powershell-static-call
    desc: PowerShell static FwpmEngineOpen call
    crit: component
    for: [powershell]
    if:
      type: tree-sitter
      query: |
        (invokation_expression
          (type_literal)
          (member_name (simple_name) @api)
          (argument_list)
          (#match? @api "(?i)^FwpmEngineOpen[A-Za-z0-9_]*$"))

  - id: fwpm-filter-add-parsed-call
    desc: Parsed FwpmFilterAdd source call
    crit: component
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])FwpmFilterAdd[A-Za-z0-9_]*$'

  - id: fwpm-filter-add-powershell-static-call
    desc: PowerShell static FwpmFilterAdd call
    crit: component
    for: [powershell]
    if:
      type: tree-sitter
      query: |
        (invokation_expression
          (type_literal)
          (member_name (simple_name) @api)
          (argument_list)
          (#match? @api "(?i)^FwpmFilterAdd[A-Za-z0-9_]*$"))

  - id: fwpm-engine-open-call-text-reference
    desc: Source contains WFP engine-open call text
    crit: notable
    conf: 0.75
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: text
      regex: '(?i)\bFwpmEngineOpen[A-Za-z0-9_]*\s*\('
    unless:
      - id: fwpm-engine-open-source
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context
      - id: well-known/lib/platform/wireguard/

  - id: fwpm-filter-add-call-text-reference
    desc: Source contains WFP filter-add call text
    crit: notable
    conf: 0.75
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: text
      regex: '(?i)\bFwpmFilterAdd[A-Za-z0-9_]*\s*\('
    unless:
      - id: fwpm-filter-add-source
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context
      - id: well-known/lib/platform/wireguard/
