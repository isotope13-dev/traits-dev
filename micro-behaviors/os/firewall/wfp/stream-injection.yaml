defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: fwps-stream-inject-async
    desc: WFP asynchronous stream injection API reference
    if:
      type: symbol
      exact: FwpsStreamInjectAsync0
  - id: fwps-copy-stream-data-to-buffer
    desc: WFP stream-to-buffer copy API reference
    if:
      type: symbol
      exact: FwpsCopyStreamDataToBuffer0
composite_rules:
  - id: wfp-stream-copy-injection-api-set
    desc: WFP stream copy and injection API references
    all:
      - id: fwps-stream-inject-async
      - id: fwps-copy-stream-data-to-buffer
