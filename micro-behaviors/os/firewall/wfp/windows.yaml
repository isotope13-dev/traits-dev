defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1562.004"
traits:
  - id: fwpm-engine-open
    desc: Open Windows Filtering Platform engine
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "FwpmEngineOpen0"
  - id: fwpm-provider-add
    desc: Add Windows Filtering Platform provider
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "FwpmProviderAdd0"
  - id: fwpm-sublayer-add
    desc: Add Windows Filtering Platform sublayer
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "FwpmSubLayerAdd0"
  - id: fwpm-filter-add
    desc: Install Windows Filtering Platform filter
    crit: notable
    conf: 0.93
    if:
      type: symbol
      exact: "FwpmFilterAdd0"
  - id: fwpm-filter-enum
    desc: Enumerate Windows Filtering Platform filters
    crit: notable
    conf: 0.86
    if:
      type: symbol
      exact: "FwpmFilterEnum0"
  - id: fwpm-filter-delete-by-id
    desc: Remove Windows Filtering Platform filter
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: "FwpmFilterDeleteById0"
  - id: fwpm-sublayer-delete-by-key
    desc: Remove Windows Filtering Platform sublayer
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "FwpmSubLayerDeleteByKey0"
  - id: fwpm-engine-close
    desc: Close Windows Filtering Platform engine
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: "FwpmEngineClose0"
  - id: fwpm-free-memory
    desc: Free Windows Filtering Platform buffers
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      exact: "FwpmFreeMemory0"

  # Source and managed loaders often resolve WFP APIs by name rather than
  # importing them into a PE.  Keep these as source-level counterparts to the
  # symbol traits above so reimplementations do not need the original binary.
  - id: fwpm-engine-open-source
    desc: Source calls WFP engine open API
    crit: notable
    conf: 0.9
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: text
      regex: '(?i)\bFwpmEngineOpen[A-Za-z0-9_]*\s*\('
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context

  - id: fwpm-filter-add-source
    desc: Source adds WFP filter
    crit: notable
    conf: 0.93
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: text
      regex: '(?i)\bFwpmFilterAdd[A-Za-z0-9_]*\s*\('
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context

  - id: fwpm-provider-add-source
    desc: Source adds WFP provider
    crit: notable
    conf: 0.9
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: text
      regex: '(?i)\bFwpmProviderAdd[A-Za-z0-9_]*\s*\('
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context

  - id: wfp-outbound-block-action-source
    desc: WFP outbound block action reference
    crit: suspicious
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: text
      regex: '(?i)[=(,]\s*FWP_ACTION_BLOCK\b'
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context

  - id: wfp-outbound-connect-layer-source
    desc: WFP AUTH_CONNECT layer on filter LayerKey
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: text
      regex: '(?i)\.LayerKey\s*=\s*[\w.]*FWPM_LAYER_ALE_AUTH_CONNECT_V[46]\b'
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context

  - id: wfp-process-appid-condition-source
    desc: WFP process application identity condition
    crit: notable
    conf: 0.9
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    if:
      type: text
      regex: '(?i)\bFWPM_CONDITION_ALE_APP_ID\b'
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context

composite_rules:
  - id: wfp-filter-lifecycle
    desc: Build and install WFP filter pipeline
    crit: notable
    conf: 0.94
    all:
      - id: fwpm-engine-open
      - id: fwpm-filter-add
    any:
      - id: fwpm-provider-add
      - id: fwpm-sublayer-add
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context
  - id: wfp-filter-teardown
    desc: Remove installed WFP filter pipeline
    crit: notable
    conf: 0.93
    all:
      - id: fwpm-filter-delete-by-id
      - id: fwpm-sublayer-delete-by-key
    any:
      - id: fwpm-engine-close
      - id: fwpm-free-memory

  - id: wfp-filter-lifecycle-source
    desc: Source builds and installs WFP filters
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    all:
      - id: fwpm-engine-open-source
      - id: fwpm-filter-add-source
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context

  - id: wfp-outbound-process-block-source
    desc: Source installs outbound process block filter
    crit: suspicious
    conf: 0.96
    for: [c, cpp, csharp, go, rust, powershell, batch, python]
    all:
      - id: wfp-filter-lifecycle-source
      - id: wfp-outbound-block-action-source
      - id: wfp-outbound-connect-layer-source
      - id: wfp-process-appid-condition-source
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
      - id: well-known/dual-use/tunnel/sing-box::sing-tun-source-context
