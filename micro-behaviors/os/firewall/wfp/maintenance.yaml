# Maintenance operations remain neutral even in a security-agent silencer.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, powershell, batch]
  crit: notable
  conf: 0.95

traits:
  - id: fwpm-filter-enum-source
    desc: Calls WFP filter enumeration API
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])FwpmFilterEnum[0-9]*$'

  - id: fwpm-filter-delete-by-id-source
    desc: Calls WFP filter removal API
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])FwpmFilterDeleteById[0-9]*$'

  - id: fwpm-provider-delete-by-key-source
    desc: Calls WFP provider removal API
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])FwpmProviderDeleteByKey[0-9]*$'

  - id: wfp-persistent-filter-flag
    desc: References persistent WFP filter flag
    if:
      type: text
      word: FWPM_FILTER_FLAG_PERSISTENT

  - id: wfp-persistent-provider-flag
    desc: References persistent WFP provider flag
    if:
      type: text
      word: FWPM_PROVIDER_FLAG_PERSISTENT
