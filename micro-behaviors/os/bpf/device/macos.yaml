defaults:
  platforms: [unix]
  for: [go, shell]
  crit: notable
  conf: 0.9

traits:
  - id: bpf-device-path
    desc: References BSD BPF device nodes
    if:
      type: text
      regex: '/dev/bpf([0-9]+|\*)'

  - id: bpf-device-count-query
    desc: Queries the maximum BPF device count
    if:
      type: text
      substr: debug.bpf_maxdevices

  - id: bpf-device-group-management
    desc: Manages a BPF access group
    if:
      type: text
      regex: 'dseditgroup\s+-o\s+(create|edit)'

  - id: bpf-device-permission-change
    desc: Changes BPF device group permissions
    if:
      type: text
      regex: '(chgrp|chmod)\s+[^\n]{0,80}/dev/bpf\*'

composite_rules:
  - id: bpf-permission-management
    desc: Manages BPF device access permissions
    crit: notable
    conf: 0.94
    all:
      - id: bpf-device-path
      - id: bpf-device-permission-change
    any:
      - id: bpf-device-group-management
      - id: bpf-device-count-query
