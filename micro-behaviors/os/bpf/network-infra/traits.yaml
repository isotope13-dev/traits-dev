# Neutral libpcap / BPF surface, scoped to C source and ELF.
#
# The named libpcap entry points (pcap_open_live, pcap_compile, pcap_setfilter,
# pcap_loop, …) are defined once, canonically, in
# micro-behaviors/communications/capture/pcap/ — this file deliberately does
# not restate them. What lives here is the generic "some libpcap symbol is
# referenced" fact that the BPF-infrastructure composite needs.
#
# Man pages for these very APIs (pcap_loop(3pcap), bpf(2), tcpdump(1)) are
# guessed as C by the language detector, so their prose is scanned as source
# and every symbol-shaped mention becomes a "capability". Each atom therefore
# excludes documentation context.
defaults:
  platforms:
    - unix
    - windows
  crit: baseline
  for:
    - elf
    - c
traits:
  - id: bpf-program
    desc: References the bpf_program filter struct
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (^|[^A-Za-z0-9_])bpf_program([^A-Za-z0-9_]|$)
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: bpf-prefix
    desc: References a BPF_ constant or macro
    conf: 0.4
    if:
      type: text
      word: BPF_
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
  # Replaces the former pcap-prefix-a / pcap-prefix-b pair, whose names carried
  # no meaning, whose descriptions were identical, and whose matches were
  # nested: the `pcap_(open_live|compile|setfilter|loop)` regex was a strict
  # subset of `substr: pcap_`, so both always fired together on the same
  # evidence. The specific capture calls are covered at notable by
  # communications/capture/pcap/; what remains here is the generic reference.
  - id: pcap-api-symbol
    desc: References a libpcap API symbol
    conf: 0.5
    if:
      type: symbol
      substr: pcap_
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
composite_rules:
  - id: has-bpf-infra
    desc: Has BPF infrastructure components
    crit: notable
    conf: 0.6
    needs: 2
    any:
      - id: bpf-program
      - id: bpf-prefix
      - id: pcap-api-symbol
      - id: micro-behaviors/communications/socket/receive::receive
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
