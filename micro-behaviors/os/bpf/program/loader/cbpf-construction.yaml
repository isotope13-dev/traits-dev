defaults:
  for: [c, cpp]
  platforms: [linux]
  crit: notable
  conf: 0.85

traits:
  - id: cbpf-forward-jump-chain
    desc: Constructs a cBPF forward-jump chain
    count_min: 8
    if:
      type: text
      regex: '\bBPF_STMT\s*\(\s*BPF_JMP\s*[+|]\s*BPF_JA\s*,'

  - id: cbpf-register-shift-statement
    desc: Constructs a cBPF register-count shift
    if:
      type: text
      regex: '\bBPF_STMT\s*\(\s*BPF_ALU\s*[+|]\s*BPF_LSH\s*[+|]\s*BPF_X\s*,\s*0\s*\)'
