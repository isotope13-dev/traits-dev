defaults:
  platforms:
    - unix
    - android
traits:
  - id: bpf-object-open
    desc: Load BPF object from file
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: symbol
      regex: bpf_object__open(_file)?
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: bpf-object-load
    desc: Load BPF object into kernel
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: symbol
      regex: bpf_object__load
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: bpf-prog-load-command
    desc: References BPF_PROG_LOAD kernel command
    crit: notable
    conf: 0.85
    for: [c, cpp, rust, go, elf]
    if:
      type: text
      word: BPF_PROG_LOAD
  - id: bpf-program-find
    desc: Find BPF program in object by name
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: symbol
      regex: bpf_object__find_program_by_name
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: bpf-skeleton
    desc: BPF skeleton pattern
    crit: notable
    conf: 0.6
    for:
      - c
      - elf
    if:
      type: text
      regex: \w+_bpf__(open|load|attach|destroy)
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: bpf-ring-buffer
    desc: BPF ring buffer usage
    crit: notable
    conf: 0.5
    for:
      - c
      - elf
    if:
      type: text
      regex: ring_buffer__(new|poll|free)
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: bpf-ringbuf
    desc: eBPF ringbuf helpers
    crit: notable
    conf: 0.7
    for:
      - c
      - elf
    if:
      type: symbol
      regex: bpf_ringbuf_(reserve|submit|discard|output)
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: vmlinux-h
    desc: vmlinux.h CO-RE eBPF header
    crit: notable
    conf: 0.8
    for:
      - c
    if:
      type: string_literal
      substr: vmlinux.h
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: bpf-helpers-h
    desc: bpf/bpf_helpers.h include
    crit: notable
    conf: 0.85
    for:
      - c
    if:
      type: text
      substr: bpf/bpf_helpers.h
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: bpf-helper-defs-catalog
    desc: Auto-generated BPF helper prototype catalog
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      substr: See bpf_doc.py for details
  # Hand-maintained sibling of bpf_helper_defs.h — bcc's src/cc/export/helpers.h
  # and the various bpf_helpers.h forks declare one function pointer per helper
  # as `... = (void *) BPF_FUNC_<name>;`. A BPF program inlines a handful of
  # these prototypes for the helpers it actually calls; only a catalog header
  # declares the kernel's entire helper surface, so the count gate is what
  # separates "declares every helper" from "uses a few".
  - id: bpf-helper-prototype-catalog
    desc: BPF helper prototype declaration catalog
    crit: notable
    conf: 0.95
    for: [c, cpp]
    count_min: 40
    if:
      type: text
      regex: '=\s*\(void \*\)\s*BPF_FUNC_'
  - id: ebpf-vdso-test-fixture-path
    desc: eBPF VDSO parsing test fixture path
    crit: component
    conf: 0.95
    for: [elf]
    if:
      type: path
      regex: '(^|[\\/])testdata[\\/]vdso'
  - id: sec-license
    desc: eBPF license section declaration
    crit: notable
    conf: 0.8
    for:
      - c
    if:
      type: text
      regex: SEC\s*\(\s*"license
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: sec-xdp
    desc: SEC("xdp") section marker
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      substr: SEC("xdp
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: rb-event-struct
    desc: Ring buffer event struct schema
    crit: notable
    conf: 0.78
    for:
      - c
    if:
      type: text
      regex: \bstruct\s+rb_event\b
  - id: event-type-enum
    desc: Event type enum declaration
    crit: notable
    conf: 0.72
    for:
      - c
    if:
      type: text
      word: event_type_t
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: data-event-struct
    desc: eBPF data event structure
    crit: notable
    conf: 0.75
    for:
      - c
      - elf
    if:
      type: text
      word: data_event
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: kernel-userspace-transfer
    desc: Kernel to userspace data transfer
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      regex: (?i)kernel\s+to\s+user\s*space|user\s*space.{0,30}kernel
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/string/artifact::linux-syscall-note-license
      - id: metadata/lang/source::linux-kernel-header-source-path
  - id: bpf-rlimit-memlock
    desc: High RLIMIT_MEMLOCK for BPF
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      regex: (?s)RLIMIT_MEMLOCK.{0,200}(\d+UL\s*<<\s*20|1\s*<<\s*30)
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: bpf-rlimit-memlock-reversed
    desc: "RLIMIT_MEMLOCK near high limits"
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      regex: (?s)(\d+UL\s*<<\s*20|1\s*<<\s*30).{0,200}RLIMIT_MEMLOCK
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
composite_rules:
  - id: ebpf-core-header
    desc: eBPF CO-RE development header
    crit: notable
    conf: 0.85
    for:
      - c
    all:
      - id: vmlinux-h
      - id: bpf-helpers-h
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: ebpf-program-header
    desc: eBPF program with license section
    crit: notable
    conf: 0.8
    for:
      - c
    needs: 2
    any:
      - id: vmlinux-h
      - id: bpf-helpers-h
      - id: sec-license
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: ring-buffer-event-schema
    desc: eBPF ring buffer event schema
    crit: notable
    conf: 0.84
    for:
      - c
    all:
      - id: micro-behaviors/os/syscall/invoke::linux-uinteger-alias-reference
      - id: rb-event-struct
      - id: event-type-enum
  - id: xdp-helper-header
    desc: eBPF XDP/TC packet helper header
    crit: notable
    conf: 0.9
    for:
      - c
    all:
      - id: ebpf-program-header
      - id: micro-behaviors/os/bpf/network-manip::has-packet-manip
    unless:
      - id: well-known/tool/sysadmin/cubesandbox::cubesandbox-source-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
