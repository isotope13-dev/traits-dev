# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: bpf-syscall
    desc: Invokes the Linux BPF interface
    crit: notable
    if:
      type: syscall
      name: [bpf]
      arch: [x86_64, aarch64]
  - id: bpf-program-load-syscall
    desc: Requests a BPF program load
    crit: notable
    if:
      type: syscall
      name: [bpf]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          value: 5
