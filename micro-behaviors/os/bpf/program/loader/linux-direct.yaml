# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: bpf-syscall
    desc: Invokes the Linux BPF interface
    if:
      type: syscall
      name: [bpf]
      arch: [x86_64, aarch64]
    unless:
      # Recovered numbers resolve through the Linux table, which is wrong
      # for BSD kernels: bpf(2) is Linux-only, so this name on a BSD OSABI
      # binary is an ordinary BSD syscall mislabelled.
      - id: metadata/vendor/identity::bsd-elf-osabi
  - id: bpf-program-load-syscall
    desc: Requests a BPF program load
    if:
      type: syscall
      name: [bpf]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          value: 5
    unless:
      # Same Linux-table caveat as bpf-syscall above.
      - id: metadata/vendor/identity::bsd-elf-osabi
