defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, elf]

traits:
  - id: bpf-prog-get-next-id
    desc: BPF_PROG_GET_NEXT_ID enumeration
    crit: notable
    conf: 0.9
    if:
      type: text
      word: BPF_PROG_GET_NEXT_ID

  - id: bpf-map-get-next-id
    desc: Enumerates BPF maps with BPF_MAP_GET_NEXT_ID
    crit: notable
    conf: 0.9
    if:
      type: text
      word: BPF_MAP_GET_NEXT_ID

  - id: bpf-link-get-next-id
    desc: Enumerates BPF links with BPF_LINK_GET_NEXT_ID
    crit: notable
    conf: 0.9
    if:
      type: text
      word: BPF_LINK_GET_NEXT_ID

composite_rules:
  - id: bpf-next-id-enumeration
    desc: Enumerates eBPF objects by successive IDs
    crit: notable
    conf: 0.9
    any:
      - id: bpf-prog-get-next-id
      - id: bpf-map-get-next-id
      - id: bpf-link-get-next-id
