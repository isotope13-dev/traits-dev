# Rarely-used eBPF helpers. Match structured call sites so generated bindings,
# prototype catalogs, kernel headers, and documentation remain definitions or
# references rather than being misreported as helper use.
defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, elf]

traits:
  - id: bpf-override-return
    desc: Calls eBPF return-value override helper
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: bpf_override_return

  - id: bpf-send-signal
    desc: Calls eBPF task-signal helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: bpf_send_signal

  - id: bpf-send-signal-thread
    desc: Calls eBPF thread-signal helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: bpf_send_signal_thread

composite_rules:
  # Shared abstraction for intent rules that need either signal helper. The
  # helper alone remains a capability; rootkit interpretation requires the
  # additional legs supplied by those consuming composites.
  - id: bpf-signal-helper
    desc: eBPF process-signal helper use
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
    any:
      - id: bpf-send-signal
      - id: bpf-send-signal-thread
  - id: bpf-rare-helper-pair
    desc: Rare eBPF helper pair
    crit: suspicious
    conf: 0.93
    needs: 2
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
    any:
      - id: bpf-override-return
      - id: bpf-send-signal
      - id: bpf-send-signal-thread
