defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, elf]

traits:
  - id: bpf-override-return
    desc: eBPF return-value override helper
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: bpf_override_return
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-defs-catalog

  - id: bpf-send-signal
    desc: eBPF task-signal helper
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: bpf_send_signal
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-defs-catalog

  - id: bpf-send-signal-thread
    desc: eBPF thread-signal helper
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: bpf_send_signal_thread
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-defs-catalog

composite_rules:
  - id: bpf-signal-helper
    desc: eBPF signal helper
    crit: suspicious
    conf: 0.9
    any:
      - id: bpf-send-signal
      - id: bpf-send-signal-thread
  - id: bpf-rare-helper-pair
    desc: Rare eBPF helper pair
    crit: suspicious
    conf: 0.93
    needs: 2
    any:
      - id: bpf-override-return
      - id: bpf-send-signal
      - id: bpf-send-signal-thread
