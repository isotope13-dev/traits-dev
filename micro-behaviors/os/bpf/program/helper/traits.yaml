# Rarely-used eBPF helpers. Signal helpers are process-control capabilities;
# override-return can alter syscall behavior. In every case the helper NAME
# also appears verbatim in three benign places that are not uses of it:
#   * the kernel's own uapi/linux/bpf.h, which documents every helper in a
#     comment block and is vendored verbatim by libbpf, bpftool and bcc;
#   * BPF helper prototype catalogs (libbpf bpf_helper_defs.h, bcc
#     src/cc/export/helpers.h) that declare a function pointer per helper;
#   * feature-probe and documentation comments — bpftool's feature.c names
#     bpf_override_return() when listing the kernel config it needs.
# The matchers therefore capture the rest of the line before the helper name
# so `not:` can drop matches that sit behind a comment leader, and the
# declaration-catalog / UAPI-header identities are consulted in `unless:`.
defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, elf]

traits:
  - id: bpf-override-return
    desc: eBPF return-value override helper
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[^\n]{0,200}\bbpf_override_return\b'
    not:
      - regex: '^\s*(/\*|//|\*|#)'
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-defs-catalog
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-prototype-catalog
      - id: metadata/file/string/artifact::linux-uapi-bpf-header

  - id: bpf-send-signal
    desc: eBPF task-signal helper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[^\n]{0,200}\bbpf_send_signal\b'
    not:
      - regex: '^\s*(/\*|//|\*|#)'
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-defs-catalog
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-prototype-catalog
      - id: metadata/file/string/artifact::linux-uapi-bpf-header

  - id: bpf-send-signal-thread
    desc: eBPF thread-signal helper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[^\n]{0,200}\bbpf_send_signal_thread\b'
    not:
      - regex: '^\s*(/\*|//|\*|#)'
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-defs-catalog
      - id: micro-behaviors/os/bpf/program/loader::bpf-helper-prototype-catalog
      - id: metadata/file/string/artifact::linux-uapi-bpf-header

composite_rules:
  # Shared abstraction for intent rules that need either signal helper. The
  # helper alone remains a capability; rootkit interpretation requires the
  # additional legs supplied by those consuming composites.
  - id: bpf-signal-helper
    desc: eBPF process-signal helper use
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
    any:
      - id: bpf-send-signal
      - id: bpf-send-signal-thread
  - id: bpf-rare-helper-pair
    desc: Rare eBPF helper pair
    crit: suspicious
    conf: 0.93
    needs: 2
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
    any:
      - id: bpf-override-return
      - id: bpf-send-signal
      - id: bpf-send-signal-thread
