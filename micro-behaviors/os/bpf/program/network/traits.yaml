defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: classic-bpf-filter-array-source
    desc: Classic BPF socket-filter instruction array
    crit: notable
    conf: 0.9
    platforms: [linux]
    for: [c, cpp]
    if:
      type: text
      regex: 'struct\s+sock_filter\s+\w+\s*\[\]\s*='
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/package/documentation::unix-manpage

  - id: so-attach-bpf
    desc: SO_ATTACH_BPF socket option
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: SO_ATTACH_BPF
  - id: af-packet
    desc: AF_PACKET raw socket
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: AF_PACKET
    unless:
      - id: metadata/lang/compiler/systems::go-binary
  - id: af-packet-source
    desc: AF_PACKET packet socket constant
    crit: notable
    conf: 0.76
    for:
      - c
      - cpp
    if:
      type: text
      substr: AF_PACKET
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: sequence-string
    desc: knock sequence string reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: \b(knock|port|packet)[_-]?sequence\b
      case_insensitive: true
  - id: xdp-tx
    desc: XDP_TX return action
    crit: notable
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      substr: XDP_TX
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: xdp-drop
    desc: XDP_DROP packet discard
    crit: notable
    conf: 0.5
    for:
      - c
      - elf
    if:
      type: text
      substr: XDP_DROP
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: xdp-pass
    desc: XDP_PASS packet passthrough
    crit: notable
    conf: 0.5
    for:
      - c
      - elf
    if:
      type: text
      substr: XDP_PASS
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: xdp-md-struct
    desc: struct xdp_md packet context
    crit: notable
    conf: 0.7
    for:
      - c
      - elf
    if:
      type: text
      substr: struct xdp_md
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      # A generated vmlinux.h declares struct xdp_md as one of thousands of
      # kernel types; that is a type dump, not a program using XDP.
      - id: metadata/file/string/artifact::linux-btf-vmlinux-type-dump
      - id: metadata/file/string/file::linux-vmlinux-header-basename
  - id: xdp-data-end
    desc: XDP data_end pointer
    crit: component
    conf: 0.5
    for:
      - c
      - elf
    if:
      type: text
      word: data_end
  - id: xdp-attach
    desc: XDP program attachment to interface
    crit: notable
    conf: 0.9
    for:
      - c
      - elf
    if:
      type: text
      substr: bpf_xdp_attach
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: xdp-flags
    desc: XDP attachment flags
    crit: notable
    conf: 0.6
    for:
      - c
      - elf
    if:
      type: text
      regex: XDP_FLAGS_(UPDATE_IF_NOEXIST|SKB_MODE|DRV_MODE|HW_MODE)
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: bpf-skeleton-include
    desc: BPF skeleton header include
    crit: notable
    conf: 0.9
    for:
      - c
    if:
      type: text
      regex: '#include\s+"[^"]{1,120}\.skel\.h"'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: ethhdr-struct
    desc: Ethernet header structure
    crit: notable
    conf: 0.5
    for:
      - c
      - elf
    if:
      type: text
      regex: struct\s+ethhdr|ethhdr\s*\*
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: ip-addr-swap
    desc: IP address swap operation
    crit: notable
    conf: 0.75
    for:
      - c
    if:
      type: text
      regex: swap.{0,30}(saddr|daddr)|(saddr|daddr).{0,30}swap
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: knock-string-port-knock
    desc: knock string reference
    crit: notable
    conf: 0.6
    for:
      - elf
      - c
    if:
      type: text
      regex: (?i)port[_-]?knock
  - id: knock-string-knock-terms
    desc: knock string reference
    crit: notable
    conf: 0.6
    for:
      - elf
      - c
    if:
      type: text
      regex: (?i)knock[_-]?(sequence|packet)
composite_rules:
  - id: af-packet-dgram-filter-source
    desc: Datagram packet socket filtering
    crit: notable
    conf: 0.88
    for:
      - c
      - cpp
    all:
      - id: af-packet-source
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/reverse-engineering/radare2::radare2-go-module-source-path
      - id: micro-behaviors/communications/socket/udp::sock-dgram
      - id: micro-behaviors/communications/socket/options::options-filter
      - id: well-known/dual-use/tunnel/openvpn::openvpn-source-tree
  - id: knock-string
    desc: knock string reference
    crit: notable
    conf: 0.6
    for:
      - elf
      - c
    any:
      - id: knock-string-port-knock
      - id: knock-string-knock-terms
  - id: xdp-packet-reflection
    desc: XDP packet reply rewrite
    crit: suspicious
    conf: 0.9
    attack: T1205.001
    for:
      - c
    all:
      - id: xdp-tx
      - id: ip-addr-swap
    any:
      - id: micro-behaviors/os/bpf/network-manip::eth-swap
      - id: micro-behaviors/os/bpf/network-manip::csum-helper
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: xdp-packet-inspection
    desc: XDP packet header inspection primitives
    crit: notable
    conf: 0.7
    for:
      - c
      - elf
    needs: 3
    any:
      - id: xdp-data-end
      - id: micro-behaviors/communications/ip/construct::ip-header-struct
      - id: micro-behaviors/communications/ip/construct::tcp-header-struct
