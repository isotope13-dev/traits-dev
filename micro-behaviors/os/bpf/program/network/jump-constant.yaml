defaults:
  platforms: [unix]
  for: [c, cpp, elf]
traits:
  - id: bpf-jump-9999-operand
    desc: BPF jump compares 9999 byte sequence
    crit: notable
    conf: 0.82
    if:
      type: text
      # Require the immediate operand in a BPF conditional jump, not an AES table.
      regex: 'BPF_JUMP\([^\n]{0,70}0x39393939\b'
