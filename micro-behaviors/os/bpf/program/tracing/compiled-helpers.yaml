# BPF helper calls are numeric, not ELF imports. Require EM_BPF and an
# instruction-aligned call in executable section bytes. Strings, BTF prototypes,
# map data and ordinary native binaries cannot satisfy this test.
defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: bpf-probe-write-user-bytecode
    desc: BPF bytecode calls userspace write helper
    crit: notable
    conf: 1.0
    if:
      type: yara
      source: |
        import "elf"
        rule bpf_user_write {
          strings:
            $call = { 85 00 00 00 24 00 00 00 }
          condition:
            elf.machine == 247 and uint8(5) == 1 and
            for any s in (0..elf.number_of_sections - 1): (
              elf.sections[s].flags & 4 != 0 and
              for any i in (1..#call): (
                @call[i] >= elf.sections[s].offset and
                @call[i] + 8 <= elf.sections[s].offset + elf.sections[s].size and
                (@call[i] - elf.sections[s].offset) % 8 == 0
              )
            )
        }
