defaults:
  platforms: [unix, windows]
  for: [c, elf]
composite_rules:
  - id: tls-library-uprobe-context
    desc: TLS read/write APIs with uprobe attachment
    crit: notable
    conf: 0.96
    # Read-only TLS observability is also shipped by audit and tracing tools.
    # Separate malicious consumers require tampering or another abuse signal.
    all:
      - id: micro-behaviors/communications/socket/ssl::tls-library-io-api-pair
    any:
      - id: uprobe-attach
      - id: uprobe-sec
