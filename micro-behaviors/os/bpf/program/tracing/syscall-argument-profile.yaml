defaults:
  platforms:
  - unix
  - windows
  for: [scripts, binaries]

composite_rules:
  - id: kprobe-syscall-argument-profile
    desc: Syscall kprobe and register-argument references
    crit: notable
    conf: 0.9
    for: [c]
    all:
    - id: micro-behaviors/os/bpf/program/tracing::syscall-kprobe-macro
    - id: micro-behaviors/os/bpf/program/tracing::pt-regs-parm
    unless:
    - id: well-known/tool/sysadmin/alpine-packages/package::alpine-datadog-agent-member
