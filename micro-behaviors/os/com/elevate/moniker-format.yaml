defaults:
  platforms: [windows]
  for: [batch, vbs, powershell, pe, python, rust]

traits:
- id: elevation-moniker-format
  desc: COM administrator elevation moniker format
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: Elevation:Administrator!new:%s
# C/C++ and other native source variants expose the same per-user hijack as
# a registry API call rather than a PowerShell path.  Keep the two legs
# separate so a string mention of either key or value is not a conviction.
