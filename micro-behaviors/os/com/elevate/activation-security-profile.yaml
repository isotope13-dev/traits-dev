defaults:
  platforms: [windows]
composite_rules:
- id: elevation-moniker-activation-security-profile
  for:
  - pe
  desc: COM elevation moniker and activation APIs
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/os/com/elevate::elevation-moniker-format
  - id: micro-behaviors/os/com/instantiation::co-get-object
  any:
  - id: micro-behaviors/os/com/runtime::co-initialize-security
  - id: micro-behaviors/os/com/invoke::co-set-proxy-blanket
  - id: micro-behaviors/os/com/invoke::com-object-activation-security-chain
  needs: 3
  unless:
  - id: well-known/tool/browser::idm-download-manager-context
