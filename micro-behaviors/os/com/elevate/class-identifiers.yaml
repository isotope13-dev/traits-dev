defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  # A class identifier is a reference, not evidence of activation or bypass.
  # The objective requires the elevation moniker and CoGetObject separately.
  - id: cmstplua-clsid
    desc: CMSTPLUA elevation class identifier reference
    conf: 0.95
    if:
      type: text
      substr: "{3E5FC7F9-9A51-4367-9063-A120244FBEC7}"

  - id: cmstplua-clsid-source
    desc: Source CMSTPLUA elevation class reference
    conf: 0.96
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\{?3e5fc7f9[-, ]+9a51[-, ]+4367[-, ]+9063[-, ]+a120244fbec7\}?'
    unless:
      - id: metadata/lang/generated/
