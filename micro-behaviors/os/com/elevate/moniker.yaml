# The COM elevation moniker is Microsoft's *documented* way for an application
# to obtain an already-elevated COM object: build "Elevation:Administrator!new:
# {CLSID}" (usually with StringFromGUID2) and hand it to CoGetObject. Every
# product that needs an admin helper for one operation uses it -- VPN clients
# reconfiguring network adapters, updaters, driver installers.
#
# What turns that into a UAC *bypass* is the CLSID: naming an auto-elevating,
# Microsoft-whitelisted interface (CMSTPLUA/ICMLuaUtil and friends) gets the
# elevated object with no consent prompt. The bypass composites in
# objectives/privilege-escalation/elevation-control/uac-bypass/com/ therefore
# key on that CLSID and reference these atoms for the moniker half. The atoms
# themselves see only the documented API, so they live here: filed under
# uac-bypass/ they reported a CA-signed Bitdefender VPN component as a UAC
# bypass on the strength of using the public interface as designed.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1548.002

traits:
  - id: elevation-moniker
    desc: Elevation COM moniker
    crit: component
    conf: 0.85
    if:
      type: text
      substr: "Elevation:Administrator!new"

  - id: elevation-administrator-moniker
    desc: Elevation Administrator COM moniker
    crit: component
    conf: 0.88
    if:
      type: hex
      section: .rdata
      pattern: "45 00 6c 00 65 00 76 00 61 00 74 00 69 00 6f 00 6e 00 3a 00 41 00 64 00 6d 00 69 00 6e 00 69 00 73 00 74 00 72 00 61 00 74 00 6f 00 72 00 21 00"

  - id: elevation-moniker-source
    desc: Source builds an administrator elevation moniker
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)Elevation\s*:\s*Administrator!new'

composite_rules:
  # Notable rather than suspicious: this is the sanctioned elevation path, and
  # an analyst wants to see "this binary asks for an elevated COM object" in a
  # diff without it reading as an attack.
  - id: elevated-com-object-binding
    desc: Binds an elevated COM object via moniker
    crit: notable
    conf: 0.93
    all:
      - id: elevation-administrator-moniker
      - id: micro-behaviors/os/com/invoke::co-get-object
      - id: micro-behaviors/os/com/invoke::co-initialize-ex
    any:
      - id: micro-behaviors/os/com/invoke::string-from-guid2
      - id: elevation-moniker
