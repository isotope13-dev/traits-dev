# Windows Script Component (.wsc/.sct) markup: a <package> wrapping one or
# more <component> elements, or a bare <component> whose body opens with its
# registration, public interface or script block. scrobj.dll exposes each
# component as a COM object (regsvr32 /i:, GetObject("script:...")).
# The legacy single-object form, <scriptlet>, is
# micro-behaviors/os/com/automation::windows-com-scriptlet-element.
defaults:
  for: [xml, javascript, vbs, html]
  platforms: [windows]
  crit: notable
  conf: 0.93

traits:
  - id: script-component-package-element
    desc: Script Component package wraps a component
    if:
      type: text
      regex: '(?i)<package\s*>\s*<component\b'
  - id: script-component-body-element
    desc: Script Component body opens with script
    if:
      type: text
      regex: '(?i)<component\b[^<>]{0,200}>\s*<(registration|public|script)\b'

composite_rules:
  - id: windows-script-component-element
    desc: Windows Script Component markup
    any:
      - id: script-component-package-element
      - id: script-component-body-element
  - id: windows-scriptlet-or-script-component
    desc: COM scriptlet or Windows Script Component markup
    any:
      - id: micro-behaviors/os/com/automation::windows-com-scriptlet-element
      - id: windows-script-component-element
