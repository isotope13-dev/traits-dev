defaults:
  for: [csharp]
  platforms: [windows]
  crit: notable
traits:
  - id: managed-inproc-subkey
    desc: Creates an InProcServer32 subkey
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CreateSubKey$'
      arg: {index: 0, exact: InProcServer32}
  - id: managed-clr-server-value
    desc: Sets default value to mscoree.dll
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetValue$'
      args:
        - {index: 0, kind: "null"}
        - {index: 1, exact: mscoree.dll}
  - id: managed-codebase-value
    desc: Calls SetValue with CodeBase name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetValue$'
      arg: {index: 0, exact: CodeBase}
  - id: managed-v4-runtime-value
    desc: Sets RuntimeVersion to CLR v4
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetValue$'
      args:
        - {index: 0, exact: RuntimeVersion}
        - {index: 1, exact: v4.0.30319}
composite_rules:
  - id: managed-codebase-registration
    desc: Registers an in-process managed COM assembly by CodeBase
    near_bytes: 1024
    all:
      - id: managed-inproc-subkey
      - id: managed-clr-server-value
      - id: managed-codebase-value
      - id: managed-v4-runtime-value
