defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: shell-hooks-registry-api-profile
  desc: Shell-hook registry and COM write references
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/keys/execution::shellexecutehooks-registry-path
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  any:
  - id: micro-behaviors/os/com/registration::clsid-percent-s-template
  - id: micro-behaviors/os/com/registration::clsid-registry-key-path
  - id: micro-behaviors/os/com/registration::inprocserver32-word
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
