defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: shell-hooks-registry-api-profile
  desc: Shell-hook registry and COM write references
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/registry/autostart/reference::shellexecutehooks-registry-path
  - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
  any:
  - id: micro-behaviors/os/registry/com/reference::clsid-percent-s-template
  - id: micro-behaviors/os/registry/com/reference::clsid-registry-key-path
  - id: micro-behaviors/os/registry/com/reference::inprocserver32-word
  unless:
  - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
