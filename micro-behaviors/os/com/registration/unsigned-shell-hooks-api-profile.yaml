defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: unsigned-shell-hooks-com-api-profile
  desc: Unsigned PE has ShellExecuteHooks COM API references
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/com/registration::shell-hooks-registry-api-profile
  - id: metadata/file/profile/com/registration::inprocserver32-word
  - id: metadata/file/profile/com/registration::clsid-registry-key-path
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/installer/product/
