  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/com/registration::shell-hooks-registry-api-profile
  - id: micro-behaviors/os/registry/com/reference::inprocserver32-word
  - id: micro-behaviors/os/registry/com/reference::clsid-registry-key-path
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: metadata/installer/product/
