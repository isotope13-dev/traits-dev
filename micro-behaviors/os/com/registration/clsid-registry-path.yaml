# Registry key paths under HKCR\CLSID. Referencing one is how every COM
# server registers itself; hijack intent comes from the objectives/persistence
# composites that pair a path with a user-writable DLL or a write chain.
defaults:
  platforms: [windows]
  crit: notable
traits:
- id: clsid-registry-key-path
  desc: CLSID registry key path
  for: [c, cpp, pe, dll]
  conf: 0.88
  if:
    type: text
    regex: (?i)CLSID\\(%s|\{[0-9A-F-]{36}\})
  unless:
    - id: metadata/binary/installer/sfx::7zip-shell-extension-clsid
    - type: text
      substr: Java Plug-in %VERSION%
    - type: text
      substr: shellex\ContextMenuHandlers
    - type: text
      substr: Shell Extensions\Approved
- id: clsid-inprocserver32-key-path
  desc: CLSID InProcServer32 registry key path
  for: [c, cpp, pe, dll]
  conf: 0.82
  attack: T1546.015
  if:
    type: text
    regex: (?i)CLSID\\(%s|\{[0-9A-F-]{36}\})\\InprocServer32
  not:
    - regex: '%MODULE%'
    - substr: DefaultIcon
    - substr: ContextMenuHandlers
    - substr: ShellEx
    - substr: DragDropHandlers
  unless:
    - id: metadata/binary/installer/sfx::7zip-shell-extension-clsid
    - type: text
      substr: Java Plug-in %VERSION%
    - type: text
      substr: shellex\ContextMenuHandlers
    - type: text
      substr: Shell Extensions\Approved
- id: clsid-guid-near-inprocserver32
  desc: CLSID GUID near InprocServer32
  for: [source, scripts, binaries]
  conf: 0.94
  if:
    type: text
    regex: '(?i)CLSID.{0,50}\{[0-9A-F-]{36}\}.{0,20}InprocServer32'
