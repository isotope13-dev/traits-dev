# COM registration markers are neutral capabilities. Persistence or hijack
# intent belongs to composites under objectives/persistence/.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9

traits:
  - id: inprocserver32-word
    desc: References InProcServer32 registration value
    crit: notable
    if:
      type: text
      word: InprocServer32

  - id: localserver32-assignment
    desc: Out-of-proc COM server assignment
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bLocalServer32\s*(=|:)\s*(%[^%\r\n]{1,80}%|[^\s;\r\n]{2,80})'

  - id: appid-word
    desc: References AppID COM registration value
    crit: component
    if:
      type: text
      word: AppID

  - id: threadingmodel-word
    desc: References the COM ThreadingModel registry value
    crit: notable
    if:
      type: text
      word: ThreadingModel

  - id: threadingmodel-both-word
    desc: References the COM Both threading model
    crit: component
    if:
      type: text
      word: Both

  # Neutral registration fragment: every ATL/COM server carries a
  # ProxyStubClsid32 key for its marshaler. Hijack or staging intent comes
  # from the objectives/persistence and wrapper composites that reference
  # this marker alongside attack-specific evidence — never from this string.
  - id: proxystubclsid32-registry-fragment
    desc: ProxyStubClsid32 registry fragment
    crit: notable
    for: [pe]
    if:
      type: text
      exact: \ProxyStubClsid32
    unless:
      - id: metadata/binary/vendor/
      # WiX Toolset binaries carry ProxyStubClsid32 for the COM registration
      # they author — installer toolchain, not a registered server.
      - id: well-known/tool/packaging/wix::standard-bootstrapper-product
      - type: text
        exact: Software\Microsoft\OleAut

composite_rules:
  - id: com-inproc-self-registration
    desc: COM self-registration entry points and InProcServer32 value
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/symbols/exports::export-dll-register-server
      - id: metadata/binary/symbols/exports::export-dll-unregister-server
      - id: inprocserver32-word
