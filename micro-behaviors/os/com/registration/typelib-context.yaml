# A CLSID and a TypeLib path are references, not evidence of modification.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
composite_rules:
  - id: browser-clsid-typelib-path
    desc: Browser CLSID co-occurs with TypeLib path
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/class-factory::web-browser-control-clsid
      - id: micro-behaviors/os/registry/keys/execution::typelib-registry-path
