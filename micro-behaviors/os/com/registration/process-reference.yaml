defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.94

composite_rules:
- id: com-self-registration-and-process-api
  desc: COM self-registration and process API references
  crit: suspicious
  scope: file
  all:
  - id: micro-behaviors/os/com/registration::com-inproc-self-registration
  - id: metadata/binary/symbols/name/process::create-process-a
  unless:
  - id: metadata/signature/verified/
  - id: well-known/tool/sysadmin/autoit::autoitx-official-control
  - id: well-known/app/browser/adobe-flash-player::adobe-flash-player-runtime
  - id: well-known/app/system/winutilities/
