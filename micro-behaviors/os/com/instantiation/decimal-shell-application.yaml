# Delimited decimal character codes (any one-character separator) that spell
# the Shell.Application ProgID, decoded at runtime with Chr/fromCharCode.
defaults:
  for: [html, javascript, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: decimal-shell-application-progid
    desc: Decimal char codes spell Shell.Application
    if:
      type: text
      regex: '(^|\D)83\D104\D101\D108\D108\D46\D65\D112\D112\D108\D105\D99\D97(\D|$)'
