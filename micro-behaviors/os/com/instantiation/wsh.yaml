defaults:
  crit: notable
  platforms: [windows]
  for: [vbs, javascript]
traits:
  - id: wsh-shell-clsid-moniker
    desc: WScript.Shell CLSID moniker resolution
    conf: 0.93
    if:
      type: text
      # Droppers resolve WScript.Shell through its CLSID
      # ({72C24DD5-D70A-438B-8A42-98424B88AFB8}) inside GetObject instead of
      # naming it, often fragmented across string concatenations -- so only
      # the leading group is matched. That group is unique to WScript.Shell.
      regex: '(?i)GetObject\(.{0,120}72C24DD5'
