# Codec-specific ciphertext of the escaped API token below, split only at
# carrier boundaries. Key: ASCII hex MD5 of the encoder default password.
# \55\71\70\63\101\55\60\60\103\60\64\106\103\62\71\105\63\66
# These signatures describe encoded tokens, not observed API execution.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: md5-xor-rds-clsid-part-1
    desc: "Default MD5-XOR fragment of RDS DataSpace CLSID"
    crit: component
    if:
      type: text
      substr: "kP%03n%05Wd%0FUj%04%00eSU%08%3D%0C%06nSRi%07%00%3DW%00Rj%04%08kS%02n"
  - id: md5-xor-rds-clsid-part-2
    desc: "Default MD5-XOR fragment of RDS DataSpace CLSID"
    crit: component
    if:
      type: text
      substr: "%03V%0EdT%06%01o%0FP9%0EPe%02%02P%3E%03%02lWP"
composite_rules:
  - id: md5-xor-rds-clsid
    desc: "Default MD5-XOR encoding of RDS DataSpace CLSID"
    crit: notable
    all:
      - id: micro-behaviors/os/com/instantiation::md5-xor-rds-clsid-part-1
      - id: micro-behaviors/os/com/instantiation::md5-xor-rds-clsid-part-2
      - id: micro-behaviors/crypto/key/representation::md5-browser-default-passphrase
      - id: micro-behaviors/data/decode/custom::unescape-input-md5-argument-call
      - id: micro-behaviors/data/decode/xor::js-repeating-key-charcode-xor-decoder
