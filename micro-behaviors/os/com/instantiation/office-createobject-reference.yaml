defaults:
  for: [oledoc, ooxml, xlsx]
  platforms: [windows]
  crit: notable
  conf: 0.88
traits:
  - id: office-createobject-reference-text
    desc: Office CreateObject call text
    if:
      type: text
      regex: '(?i)\bCreateObject\s*\('
    unless:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
    not:
      - regex: createObjectURL
