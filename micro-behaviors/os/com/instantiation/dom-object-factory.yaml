# A script-created <object> element given a "clsid:" classid and then asked
# for CreateObject(progid, "") is the RDS DataSpace factory call shape: the
# second argument names the (empty, local) server. Kits split the CLSID into
# reordered fragments, so these traits record the call shape, not the CLSID.
defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.94
traits:
- id: dom-create-object-element
  desc: Script creates an <object> DOM element
  for: [html]
  if:
    type: text
    regex: '(?i)\.createElement\s*\(\s*["'']object["'']\s*\)'
- id: clsid-moniker-string-literal
  desc: Quoted string begins with clsid moniker
  for: [html]
  if:
    type: text
    regex: '(?i)["'']clsid:'
- id: createobject-empty-server-argument
  desc: Member CreateObject passes empty server string
  if:
    type: text
    regex: '(?i)\.createobject\s*\(\s*[^,()]{1,120},\s*(""|'''')\s*\)'
# Raw XOR-23 hex text of the same three operations, for multi-line payloads
# whose decoded bytes (CR/LF become 0x1A/0x1D) the hex decoder rejects.
- id: xor23-hex-text-object-element
  desc: element("object") spelled as XOR-23 hex text
  if:
    type: text
    regex: (?i)[57]2[57]B[57]2[57]A[57]2[57]9[46]33F35[57]8[57]5[57]D[57]2[57]4[46]335
- id: xor23-hex-text-clsid-moniker
  desc: '"clsid: spelled as XOR-23 hex text'
  if:
    type: text
    regex: (?i)35[57]4[57]B[46]4[57]E[57]32D
- id: xor23-hex-text-createobject-empty-server
  desc: CreateObject(x,"") spelled as XOR-23 hex text
  if:
    type: text
    regex: (?i)39[57]4[46]5[57]2[57]6[46]3[57]2[57]8[57]5[57]D[57]2[57]4[46]33F(..){1,60}3B(37)*3535
