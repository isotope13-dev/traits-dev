# The Script Encoder conceals the RDS DataSpace CLSID from raw-byte scans;
# the engine-decoded layer carries it literally. Sibling spellings of the
# same CLSID live here (nested-decimal, md5-xor) beside the raw-form scan in
# automation/rds.yaml.
defaults:
  for: [html, javascript, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: rds-dataspace-clsid-script-decoded
    desc: Script-decoded RDS DataSpace CLSID
    if:
      type: encoded
      encoding: script
      regex: '(?i)BD96C556-65A3'
composite_rules:
  - id: rds-dataspace-clsid-raw-or-script-decoded
    desc: RDS DataSpace CLSID, raw or script-decoded
    crit: notable
    conf: 0.97
    any:
      - id: micro-behaviors/os/com/automation::rds-dataspace-clsid
      - id: rds-dataspace-clsid-script-decoded
