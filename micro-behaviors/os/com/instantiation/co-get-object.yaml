defaults:
  for: ["pe", "c", "cpp"]
  platforms: ["windows"]
traits:
  - id: co-get-object
    desc: CoGetObject symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CoGetObject"
  # Native CoGetObject must receive a writable fourth argument to return the
  # requested interface. A NULL output argument is an inert/invalid call and
  # must not turn a CLSID reference into a claimed UAC bypass.
