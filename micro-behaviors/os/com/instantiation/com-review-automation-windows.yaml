defaults:
  for:
    - pe
    - dll
    - javascript
    - vbs
    - batch
    - lua
    - html
    - asp
  platforms:
    - windows
traits:
  - id: activex-object-variable-progid
    desc: Constructs ActiveX object from variable ProgID
    crit: notable
    conf: 0.88
    for: [javascript, vbs, html]
    if:
      type: text
      # Obfuscators emit one-letter ProgID variables (`new ActiveXObject(v)`).
      regex: '\bnew\s+ActiveXObject\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]{0,80}\s*\)'

  - id: filesystemobject-constructor
    desc: WSH instantiates FileSystemObject
    crit: notable
    conf: 0.94
    for: [html, vbs, javascript, batch]
    if:
      type: text
      regex: '(?i)(CreateObject|ActiveXObject)\s*\(\s*["'']Scripting\.FileSystemObject["'']\s*\)'
    unless:
      - id: well-known/lib/web/authoring/syntaxhighlighter::codepress-snippet-template-context
