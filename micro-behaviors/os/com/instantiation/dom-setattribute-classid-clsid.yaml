defaults:
  for:
    - html
    - makefile
    - vbs
  platforms:
    - windows
  crit: notable
  conf: 0.98
traits:
  - id: dom-setattribute-classid-clsid
    desc: Sets DOM classid attribute to CLSID
    conf: 0.95
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)\.setAttribute\s*\(\s*["'']classid["'']\s*,\s*["'']clsid:'
