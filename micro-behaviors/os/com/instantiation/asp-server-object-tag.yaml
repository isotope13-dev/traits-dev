# Classic ASP can instantiate a COM object with a server-side <object> tag
# and a CLSID instead of Server.CreateObject("ProgID"). The two CLSIDs here
# are WScript.Shell and Shell.Application.
defaults:
  platforms: [windows]
  for: [asp, vbs, html]
  crit: notable
  conf: 0.92

traits:
  - id: asp-server-object-tag-classid
    desc: ASP server object tag instantiates a CLSID
    if:
      type: text
      regex: '(?i)<object\s[^>]{0,80}\brunat\s*=\s*"?server\b[^>]{0,120}\bclassid\s*=\s*"?clsid:'

  - id: shell-automation-clsid-text
    desc: Names a shell automation object CLSID
    if:
      type: text
      regex: '(?i)\bclsid:\{?(72C24DD5-D70A-438B-8A42|13709620-C279-11CE-A49E)'
