# Outlook automation spelled in script blocks inside HTML pages or VBS files.
# The existing Outlook atoms are scoped to plain text; HTML mail worms embed
# the same calls in a <script language="vbscript"> block.
defaults:
  platforms: [windows]
  for: [html, vbs]
  crit: notable
  conf: 0.9

traits:
  - id: html-outlook-application-progid
    desc: Script creates Outlook.Application object
    if:
      type: text
      regex: '(?i)CreateObject\s*\(\s*"Outlook\.Application"\s*\)'

  - id: outlook-contacts-folder-read
    desc: Script opens the Outlook Contacts folder
    if:
      type: text
      regex: '(?i)GetDefaultFolder\s*\(\s*10\s*\)'

  - id: outlook-contact-email-loop
    desc: Script iterates Outlook contact email addresses
    if:
      type: text
      regex: '(?is)For\s+\w+\s*=\s*1\s+to\s+\w+[\s\S]{0,160}\.Email1Address'

  - id: outlook-recipients-add-call
    desc: Script adds Outlook mail recipients
    if:
      type: text
      regex: '(?i)\.Recipients\.Add\s*\('

  - id: outlook-attachments-add-call
    desc: Script attaches file to Outlook mail
    if:
      type: text
      regex: '(?i)Attachments\w*\.Add\s+["(]'

  - id: outlook-attachment-save-as-file
    desc: Script saves mail attachment to disk
    if:
      type: text
      regex: '(?i)Attachments\w*\.Item\s*\(\s*1\s*\)\.SaveAsFile\b'

  - id: outlook-mail-send-call
    desc: Script calls Send in Outlook automation
    crit: notable
    if:
      type: text
      # XMLHTTP has the same `.send` spelling. Require the Outlook ProgID
      # near the call so an HTTP request is not labeled as email delivery.
      regex: '(?is)Outlook\.Application[\s\S]{0,500}\.Send\b'

  - id: outlook-mail-send-call-wide-context
    desc: Outlook Send call in application context
    if:
      type: text
      regex: '(?is)Outlook\.Application[\s\S]{0,700}\.Send\b'
