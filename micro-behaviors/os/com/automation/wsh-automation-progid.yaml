defaults:
  for:
    - pe
    - dll
    - javascript
    - vbs
    - batch
    - lua
    - html
    - asp
  platforms:
    - windows
composite_rules:
  - id: wsh-automation-progid
    desc: WSH shell or filesystem automation ProgID
    crit: component
    conf: 0.85
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
