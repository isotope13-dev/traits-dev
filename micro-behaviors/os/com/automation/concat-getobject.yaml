defaults:
  platforms: [windows, unix]
  for: [batch, shell, javascript, vbs, html, text, data]
traits:
- id: getobject-concat-url-clue
  desc: GetObject with concatenated URL clue
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(?i)GetObject\([^)\r\n]{0,80}\+[^)\r\n]{0,80}//[A-Za-z0-9]'

