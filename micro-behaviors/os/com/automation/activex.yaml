defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [javascript, vbs, html, xml]

traits:
  - id: computed-activex-progid
    desc: ActiveX ProgID uses a computed expression
    conf: 0.88
    if:
      type: text
      regex: 'new\s+ActiveXObject\s*\(\s*[A-Za-z_$][\w$]{0,30}\s*(\(|\[)'

  # Obfuscator.io / hex-index WSH droppers resolve ProgIDs via helper calls
  # (`ActiveXObject(_0x…[…](…))`) rather than a bare array index + `)`.
  - id: activex-obfuscated-progid
    desc: ActiveXObject with obfuscated ProgID expression
    crit: notable
    if:
      type: text
      regex: 'new\s+ActiveXObject\(_0x[0-9a-fA-F]+'
