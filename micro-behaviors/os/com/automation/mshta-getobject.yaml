# These observations need not use the same value. A workbook COM binding
# can coexist with a tool-name reference; this does not prove a macro launch.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: mshta-reference-variable-getobject
    desc: MSHTA name and variable GetObject call
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/executable::mshta-name-reference
      - id: micro-behaviors/process/script/wsh::wsh-getobject-variable-argument
