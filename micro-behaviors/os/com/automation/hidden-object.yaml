defaults:
  for: [html, text]
  platforms: [windows]
traits:
  - id: display-hidden-activex-object
    desc: ActiveX object tag declares display none
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)<object\b[^>]{0,100}clsid:[^>]{0,100}display\s*:\s*none'
      exclude_html_comments: true
