# SAP GUI Scripting COM automation via the Windows Running Object Table
# (`SAPGUI` moniker or `SapROTWr.SapROTWrapper`) and `GetScriptingEngine`.
defaults:
  platforms: [windows]
  for: [vbs, javascript, powershell, python, csharp]
  crit: notable

traits:
  - id: sapgui-rot-object-lookup
    desc: Resolves SAPGUI automation object from ROT
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(Get(Active)?Object\s*\([^)\r\n]{0,50}["'']SAPGUI["'']|SapROTWr\.SapROTWrapper)'

  - id: sapgui-get-scripting-engine
    desc: Acquires SAP GUI COM scripting engine
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(\.GetScriptingEngine\b|["'']GetScriptingEngine["''])'

composite_rules:
  - id: sapgui-com-session-automation
    desc: Automates SAP GUI client via COM scripting
    conf: 0.96
    all:
      - id: sapgui-rot-object-lookup
      - id: sapgui-get-scripting-engine
