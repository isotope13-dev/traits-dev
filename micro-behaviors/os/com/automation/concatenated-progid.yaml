defaults:
  platforms: [windows]
  for: [html, javascript, elixir, scala]
traits:
  - id: activex-concatenated-progid
    desc: ActiveX constructor concatenates ProgID parts
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)ActiveXObject\s*\(\s*["''][A-Za-z.]{1,32}["'']\s*\+'

    unless:
      - id: metadata/build/bundler/vscode::javascript-source-map-file
