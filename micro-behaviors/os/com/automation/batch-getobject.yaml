defaults:
  platforms: [windows]
  for: [batch, vbs, javascript, html, text, data]
traits:
- id: script-protocol-getobject
  desc: Global GetObject binds HTTP URL moniker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    # Require a global call and its literal first argument. API documentation
    # links named GetObject and URLs in later expressions are not COM binds.
    regex: '(?i)(^|[^.\w])GetObject\s*\(\s*["''](script:)?https?://'
