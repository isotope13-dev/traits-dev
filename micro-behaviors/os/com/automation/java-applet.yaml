defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: microsoft-java-activex-bridge-reference
    desc: References Microsoft's Java ActiveX bridge
    if:
      type: text
      substr: com.ms.activeX.ActiveXComponent
  - id: set-wscript-shell-clsid
    desc: setCLSID selects the WScript.Shell COM class
    if:
      type: text
      regex: '(?i)\.setCLSID.{0,24}F935DC22-1CF0-11D0-ADB9-00C04FD58A0B'
  - id: com-create-instance-call
    desc: Calls the COM CreateInstance method
    if:
      type: text
      regex: '\b[\w$]{1,40}\.CreateInstance\s*\(\s*\)'
