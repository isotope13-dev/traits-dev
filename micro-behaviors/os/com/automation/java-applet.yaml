defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: microsoft-java-activex-bridge-reference
    desc: References Microsoft's Java ActiveX bridge
    if:
      type: text
      substr: com.ms.activeX.ActiveXComponent
  - id: set-wscript-shell-clsid
    desc: setCLSID selects the WScript.Shell COM class
    if:
      type: text
      regex: '(?i)\.setCLSID.{0,24}F935DC22-1CF0-11D0-ADB9-00C04FD58A0B'
  - id: com-create-instance-call
    # A bare `X.CreateInstance()` is not COM on its own: i18next's documented
    # factory API is `i18next.createInstance()`, which every react-i18next
    # bundle contains and which has nothing to do with COM automation. Require
    # the class-selection step this call belongs to -- the MS Java ActiveX
    # bridge, a setCLSID call, or a CLSID: URL -- within the same small script
    # window, as the exploit-kit fixtures spell it.
    desc: Instantiates a COM class via ActiveX bridge
    if:
      type: text
      regex: '(?i)(activex|setclsid|clsid:)[\s\S]{0,120}\b[\w$]{1,40}\.CreateInstance\s*\(\)'
