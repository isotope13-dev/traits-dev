defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: set-wscript-shell-clsid
    desc: setCLSID selects the WScript.Shell COM class
    if:
      type: text
      regex: '(?i)\.setCLSID.{0,24}F935DC22-1CF0-11D0-ADB9-00C04FD58A0B'
  - id: fso-clsid
    desc: References FileSystemObject COM class ID
    if:
      type: text
      substr: '0D43FE01-F093-11CF-8940-00A0C9054228'
      case_insensitive: true
  # Page authors split the CLSID string across concatenations, which the text
  # atoms above cannot join. The call facts fold the constant argument, so the
  # same selection is read from the setCLSID call itself.
  - id: java-applet-set-clsid-shell-call
    desc: setCLSID call selects WScript.Shell
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)setCLSID$'
      arg:
        index: 0
        regex: '(?i)F935DC22-1CF0-11D0-ADB9-00C04FD58A0B'
  - id: java-applet-set-clsid-fso-call
    desc: setCLSID call selects FileSystemObject
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)setCLSID$'
      arg:
        index: 0
        regex: '(?i)0D43FE01-F093-11CF-8940-00A0C9054228'
