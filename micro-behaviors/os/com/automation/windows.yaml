defaults:
  for:
    - pe
    - dll
    - javascript
    - vbs
    - batch
    - lua
    - html
  platforms:
    - windows
traits:
  - id: windows-actctx-manifest-class
    desc: Windows ActCtx manifest class activation
    crit: notable
    conf: 0.95
    for: [xml, javascript]
    if:
      type: text
      regex: '(?i)Microsoft\.Windows\.ActCtx|\bManifestText\b'

  - id: activex-object-variable-progid
    desc: Constructs ActiveX object from variable ProgID
    crit: notable
    conf: 0.88
    for: [javascript, vbs, html]
    if:
      type: text
      regex: '\bnew\s+ActiveXObject\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]{1,80}\s*\)'

  - id: clsid-from-progid
    desc: Resolve COM class from ProgID
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: CLSIDFromProgID
  - id: variant-change-type
    desc: Convert OLE automation variant
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: VariantChangeType
  - id: shell-application-progid
    desc: Shell.Application ProgID string
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    crit: notable
    conf: 0.85
    if:
      type: text
      word: Shell.Application
      case_insensitive: true
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/process/create/macro/office::createobject-shell-application
  - id: filesystemobject-progid
    desc: FileSystemObject ProgID string
    crit: notable
    conf: 0.85
    for: [pe, dll, javascript, vbs, batch, lua, html, static-lib]
    if:
      type: text
      regex: '\bScripting\.FileSystemObject\b'
  - id: filesystemobject-split-progid
    desc: Split FileSystemObject ProgID string
    crit: notable
    conf: 0.94
    for: [javascript, vbs, html]
    if:
      type: text
      regex: 'Scripting\.File["'']\s*\+\s*["'']SystemObject'
  - id: adodb-connection-progid
    desc: ADODB.Connection ProgID string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bADODB\.Connection\b'
  - id: adox-catalog-progid
    desc: ADOX.Catalog ProgID string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bADOX\.Catalog\b'
  - id: filesystemobject-constructor
    desc: WSH instantiates FileSystemObject
    crit: notable
    conf: 0.94
    for: [html, vbs, javascript, batch]
    if:
      type: text
      regex: '(?i)(CreateObject|ActiveXObject)\s*\(\s*["'']Scripting\.FileSystemObject["'']\s*\)'
  - id: shell-explorer-progid
    desc: Shell Explorer ActiveX ProgID
    crit: notable
    conf: 0.92
    if:
      type: text
      word: Shell.Explorer.1
  - id: mozilla-browser-progid
    desc: Mozilla browser ActiveX ProgID
    crit: notable
    conf: 0.9
    if:
      type: text
      word: Mozilla.Browser.1
  - id: webbrowser-activex-clsid
    desc: WebBrowser ActiveX CLSID
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: '{8856F961-340A-11D0-A96B-00C04FD705A2}'
  - id: mfc-cwebbrowser2-class
    desc: MFC CWebBrowser2 class marker
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: CWebBrowser2
  - id: atlax-win-init
    desc: ATL ActiveX host initialization
    crit: notable
    conf: 0.88
    if:
      type: text
      word: AtlAxWinInit
  - id: atlax-get-control
    desc: AtlAxGetControl named, not imported
    crit: notable
    conf: 0.88
    if:
      type: text
      word: AtlAxGetControl
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: atlax-get-control-import
  - id: atlax-get-control-import
    desc: ATL ActiveX control import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: AtlAxGetControl
  - id: atl-library-import
    desc: ATL library import
    crit: notable
    conf: 0.86
    if:
      type: text
      word: ATL.DLL
  - id: atl-ordinal-47-import
    desc: ATL ordinal 47 import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "ORDINAL 47"
  - id: namespace-method
    desc: Shell namespace method string
    crit: notable
    conf: 0.8
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    if:
      type: text
      regex: '(?i)\.(Name)?space\s*\('
  - id: shell-application-namespace
    desc: Shell.Application namespace access
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)Shell\.Application.{0,40}\.Namespace
  - id: copyhere-method
    desc: Shell CopyHere archive extraction method
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b[A-Za-z_][A-Za-z0-9_]{0,40}\.\s*CopyHere\b'
  # Bare-token sibling of copyhere-method for obfuscated WSH string tables,
  # where method names are stored as standalone strings and invoked through
  # computed bracket access (obj[table(0x104)](...)), so no literal
  # `X.CopyHere` call site exists in the text. 'CopyHere' is unambiguous —
  # there is no benign concept of the same name — so the bare reference is
  # standalone evidence of archive-extraction intent.
  - id: copyhere-method-token
    desc: CopyHere archive-extraction method token
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)\bCopyHere\b
  # VBA late-bound dispatch where the method name itself is assembled from
  # string fragments: CallByName obj, "sav" + caption, VbMethod or
  # CallByName(obj, "re" + "sponseBody", VbGet). The invoked API never appears
  # whole in the file, which defeats name-based signatures for SaveToFile,
  # responseBody, Open, and Send. Assembling a method name at the call site
  # has no ordinary VBA use.
  - id: vba-callbyname-invocation
    desc: VBA CallByName indirect invocation
    for: [vbs]
    crit: notable
    conf: 0.92
    if:
      # Text, not literal: CallByName is code (CallByName obj, name,
      # VbMethod), not a quoted constant.
      type: text
      regex: (?i)\bCallByName\b

  - id: vba-callbyname-split-method
    desc: CallByName dispatches a split-string method name
    for: [vbs]
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bCallByName\s+\(?[A-Za-z_]\w*\s*,\s*"[^"\r\n]{0,24}"\s*\+'
composite_rules:
  # Internal grouping for WSH dropper composites. Either ProgID is a neutral
  # automation capability; network retrieval and execution establish intent.
  - id: wsh-automation-progid
    desc: WSH shell or filesystem automation ProgID
    crit: component
    conf: 0.85
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: filesystemobject-progid

  - id: ole-automation-setup
    desc: Resolve COM object automation
    crit: notable
    conf: 0.85
    all:
      - id: clsid-from-progid
      - id: variant-change-type
  - id: shell-namespace-copyhere
    desc: Shell COM archive copy pattern
    crit: notable
    conf: 0.88
    for: [pe, dll, javascript, vbs, batch, lua, html, powershell]
    all:
      - id: shell-application-progid
      - id: namespace-method
      - id: copyhere-method
  - id: activex-browser-host
    desc: ATL hosted browser control ProgID
    crit: notable
    conf: 0.93
    any:
      - id: shell-explorer-progid
      - id: mozilla-browser-progid
    all:
      - id: atlax-win-init
      - id: atlax-get-control
  - id: atl-activex-com-access
    for: [pe]
    desc: ATL ActiveX COM access
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/com/invoke::co-initialize
      - id: atlax-get-control-import
  - id: atl-activex-ordinal-com-access
    for: [pe]
    desc: ATL ordinal ActiveX COM access
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/com/invoke::co-initialize
      - id: atl-library-import
      - id: atl-ordinal-47-import
