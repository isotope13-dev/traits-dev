defaults:
  for: [text]
  platforms: [windows]
traits:
  - id: matlab-automation-server
    desc: Activates MATLAB COM automation server
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "\\bactxserver\\('matlab\\.application'\\)"
  - id: matlab-source-workspace-transfer
    desc: Constructs MATLAB script workspace transfer
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "\\.PutWorkspaceData\\([^\\r\\n]{1,40}mfilename\\)"
