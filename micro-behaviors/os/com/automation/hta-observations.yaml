defaults:
  platforms: [windows]
  for: [vbs, html]

traits:
  - id: script-computed-activex-object
    desc: Script constructs computed ActiveXObject
    crit: suspicious
    conf: 0.95
    for: [html, text, data]
    if:
      type: text
      regex: 'new\s+ActiveXObject\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]{1,40}\s*\('

