# CreateObject and selected COM ProgID references co-occur in the file.
# This does not bind the referenced class to the factory call.
composite_rules:
- platforms:
  - windows
  for:
  - vbs
  - asp
  crit: notable
  id: createobject-with-com-progid-references
  desc: CreateObject and COM ProgID references co-occur
  conf: 0.85
  all:
  - id: micro-behaviors/os/com/automation::createobject-reference
  any:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: metadata/lang/scripted::adodb-stream
  - id: metadata/lang/scripted::msxml-xmlhttp
  - id: metadata/lang/scripted::shell-application
