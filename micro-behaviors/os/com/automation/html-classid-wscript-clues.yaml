# Nearby references do not prove a launch or malicious intent; HTA utilities
# can use both an embedded COM object and WScript.Shell for user actions.
defaults:
  platforms: [windows]
  for: [html]
composite_rules:
  - id: html-classid-wscript-shell-clues
    desc: HTML class ID near WScript.Shell reference
    crit: notable
    conf: 0.9
    near_bytes: 3000
    all:
      - id: micro-behaviors/os/com/automation::html-activex-classid-object
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
