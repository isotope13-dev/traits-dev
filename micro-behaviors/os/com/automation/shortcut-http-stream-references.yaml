defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-arg-adodb-stream
    desc: LNK arg uses ADODB.Stream
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: 'ADODB\.Stream'
      case_insensitive: true
composite_rules:
  - id: lnk-com-http-stream-reference-profile
    desc: LNK contains two COM HTTP or stream references
    crit: suspicious
    conf: 0.97
    needs: 2
    any:
      - id: micro-behaviors/communications/http/client/xmlhttp::lnk-arg-msxml-serverhttp
      - id: micro-behaviors/communications/http/client/winhttp::lnk-arg-winhttp-request
      - id: micro-behaviors/os/com/automation::lnk-arg-adodb-stream
      - id: micro-behaviors/data/stream/write::lnk-arg-savetofile
      - id: micro-behaviors/communications/http/client/response-body::lnk-arg-responsebody
