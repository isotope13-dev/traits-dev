# WScript.Network is the Windows Script Host object that exposes the machine
# name, the logged-on user, and drive/printer mapping. Instantiating it is
# ordinary administrative scripting, so the object reference stays a neutral
# capability; recon intent is assembled by composites elsewhere.
defaults:
  for: [javascript, vbs, html]
  platforms: [windows]

traits:
  - id: wscript-network-progid
    desc: References the WScript.Network COM object
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)WScript\.Network(\.1)?'
