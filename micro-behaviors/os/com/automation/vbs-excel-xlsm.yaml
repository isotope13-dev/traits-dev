defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: excel-display-fullscreen
    desc: Sets Excel DisplayFullScreen property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.DisplayFullScreen\s*='

composite_rules:
  - id: vbs-excel-xlsm-open-profile
    desc: VBS opens XLSM through Excel COM
    crit: suspicious
    conf: 0.98
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/com/instantiation::createobject-excel-application-text
      - id: micro-behaviors/fs/read/file/target::excel-workbooks-open-call
      - id: micro-behaviors/fs/path/extension::xlsm-quoted-path
    any:
      - id: excel-display-fullscreen
      - id: micro-behaviors/os/com/instantiation::filesystemobject-constructor
