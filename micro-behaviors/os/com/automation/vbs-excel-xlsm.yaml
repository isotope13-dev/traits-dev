defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: createobject-excel-application-text
    desc: CreateObject Excel.Application call
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(CreateObject|GetObject)\s*\(\s*["'']Excel\.Application["'']\s*\)'

  - id: excel-workbooks-open-call
    desc: Excel Workbooks.Open method call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.Workbooks\.Open\s*\('

  - id: excel-display-fullscreen
    desc: Sets Excel DisplayFullScreen property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.DisplayFullScreen\s*='

composite_rules:
  - id: vbs-excel-xlsm-open-profile
    desc: VBS opens XLSM through Excel COM
    crit: suspicious
    conf: 0.98
    near_bytes: 2048
    all:
      - id: createobject-excel-application-text
      - id: excel-workbooks-open-call
      - id: micro-behaviors/fs/path/extension::xlsm-quoted-path
    any:
      - id: excel-display-fullscreen
      - id: micro-behaviors/os/com/automation::filesystemobject-constructor
