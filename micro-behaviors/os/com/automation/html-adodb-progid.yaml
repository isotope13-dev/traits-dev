# This is a ProgID mention; object creation requires a separate call matcher.
defaults:
  platforms: [windows]
  for: [html]

traits:
  - id: html-adodb-stream-progid-reference
    desc: HTML references the ADODB.Stream ProgID
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)ADODB\.Stream|\\101\\144\\157\\144\\142\\56\\123\\164\\162\\145\\141\\155'
