traits:
- id: vbs-computed-createobject
  for:
  - vbs
  - mp3
  attack: T1027
  mbc: B0032
  desc: CreateObject receives a variable or call result
  conf: 0.88
  if:
    type: text
    regex: (?i)(^|[^.\w])CreateObject\s*\(\s*[A-Za-z_]\w{1,30}(\s*\([^)]{0,80}\))?\s*\)
- id: createobject-reference
  for:
  - vbs
  - asp
  desc: VBScript CreateObject call
  conf: 0.9
  if:
    type: text
    regex: (?i)\bCreateObject\s*\(
defaults:
  platforms:
  - windows
  crit: notable
