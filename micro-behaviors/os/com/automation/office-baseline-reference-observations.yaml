composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: filesystemobject-or-shellapplication-reference
  desc: FileSystemObject or Shell.Application reference
  any:
  - id: well-known/lib/runtime/scripted/windows-script-host::filesystemobject-progid
  - id: well-known/app/system/microsoft/platform::shell-application-progid
- platforms:
  - windows
  for:
  - html
  - vbs
  id: filesystemobject-api-or-progid-reference
  desc: FileSystemObject API or ProgID references
  conf: 0.85
  any:
  - id: well-known/lib/runtime/scripted/windows-script-host::filesystemobject-progid
  - id: well-known/lib/runtime/scripted/windows-script-host::createobject-scripting-fso
defaults:
  crit: component
