composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: filesystemobject-or-shellapplication-reference
  desc: FileSystemObject or Shell.Application reference
  any:
  - id: metadata/file/profile/com-progid::filesystemobject-progid
  - id: metadata/file/profile/com-progid::shell-application-progid
- platforms:
  - windows
  for:
  - html
  - vbs
  id: filesystemobject-api-or-progid-reference
  desc: FileSystemObject API or ProgID references
  conf: 0.85
  any:
  - id: metadata/file/profile/com-progid::filesystemobject-progid
  - id: metadata/file/profile/com-api::createobject-scripting-fso
defaults:
  crit: component
