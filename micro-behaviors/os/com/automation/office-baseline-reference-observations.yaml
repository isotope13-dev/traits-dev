composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: filesystemobject-or-shellapplication-reference
  desc: FileSystemObject or Shell.Application reference
  any:
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/os/com/automation::shell-application-progid
- platforms:
  - windows
  for:
  - html
  - vbs
  id: filesystemobject-api-or-progid-reference
  desc: FileSystemObject API or ProgID references
  conf: 0.85
  any:
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/process/create/macro/office::createobject-scripting-fso
defaults:
  crit: component
