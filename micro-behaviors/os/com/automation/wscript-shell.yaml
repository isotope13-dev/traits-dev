defaults:
  crit: notable
  for: [scripts, go, pe, html, xml]
  platforms:
    - windows
traits:
  - id: windows-com-scriptlet-element
    desc: Windows COM scriptlet element
    conf: 0.95
    for: [media, xml, html, text, scripts, binaries]
    if:
      type: text
      regex: '(?i)<scriptlet>'
  - id: wscript-dynamic-com-member
    desc: WScript COM method via computed member
    conf: 0.92
    for: [javascript, vbs]
    if:
      type: text
      regex: '\bWScript\s*\[\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\]\s*\('
