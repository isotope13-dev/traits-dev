defaults:
  crit: notable
  conf: 0.94
  platforms: [windows]
  for: [scripts, binaries]

traits:
  - id: mapi-namespace-access
    for: [text]
    desc: Outlook MAPI namespace access
    if:
      type: text
      regex: '(?i)\bGetNameSpace\s*\(\s*["'']MAPI["'']\s*\)'
  - id: outlook-application-progid
    for: [text]
    desc: Outlook.Application COM ProgID string
    if:
      type: text
      regex: '(?i)\bOutlook\.Application(\.\d+)?\b'
  # UTF-16LE forms for binaries cleave cannot parse as PE (a VB6 image with a
  # truncated MZ header sniffs as dos_com), where no wide strings are extracted.
  - id: outlook-application-progid-utf16
    for: [dos_com, static-lib]
    desc: UTF-16 Outlook.Application ProgID
    if:
      type: hex
      pattern: '4F 00 75 00 74 00 6C 00 6F 00 6F 00 6B 00 2E 00 41 00 70 00 70 00 6C 00 69 00 63 00 61 00 74 00 69 00 6F 00 6E 00'
  - id: address-entries-utf16
    for: [dos_com, static-lib]
    desc: UTF-16 Outlook AddressEntries member
    if:
      type: hex
      pattern: '41 00 64 00 64 00 72 00 65 00 73 00 73 00 45 00 6E 00 74 00 72 00 69 00 65 00 73 00'
  - id: iam-accounts-key-utf16
    for: [dos_com, static-lib]
    desc: UTF-16 mail account registry key
    if:
      type: hex
      pattern: '49 00 6E 00 74 00 65 00 72 00 6E 00 65 00 74 00 20 00 41 00 63 00 63 00 6F 00 75 00 6E 00 74 00 20 00 4D 00 61 00 6E 00 61 00 67 00 65 00 72 00 5C 00 41 00 63 00 63 00 6F 00 75 00 6E 00 74 00 73 00'
