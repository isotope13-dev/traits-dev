# The `WScript` root object is what the Windows Script Host injects into a
# JScript/VBScript engine, so any member access on it says the file is a WSH
# script rather than browser or Node JavaScript. The sibling files here name
# individual ProgIDs (`WScript.Shell`, `WScript.Network`); this one is the
# host-identity fact the dropper composites use to scope themselves to WSH.
#
# Baseline on purpose: every WSH script touches the root object at least once
# (`WScript.Echo`, `WScript.Sleep`, `WScript.Arguments`), so the match is
# universal within the population it targets and carries no intent by itself.
# The referencing composites supply the intent; widening this matcher's own
# criticality would flag every benign VBScript that prints a line.
#
# Scripts only, on purpose. An earlier pe/dll-scoped `WScript.` substring trait
# fired on ordinary binaries that merely mention the host and was removed; the
# script-host statement is only reliable where the engine actually exists.
defaults:
  crit: baseline
  platforms: [windows]
  for: [javascript, vbs]
traits:
  - id: wscript-host-object
    desc: References the Windows Script Host root object
    conf: 0.9
    if:
      type: text
      regex: '\bWScript\s*\.\s*[A-Za-z_]'
