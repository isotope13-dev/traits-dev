defaults:
  platforms: [windows]
  for: [html, javascript, typescript, vbs]
  crit: notable
  conf: 0.95

traits:
  - id: activex-htmlfile-constructor
    desc: Constructs an ActiveX HTML document
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)ActiveXObject\s*\(\s*["'']htmlfile["'']\s*\)'

  - id: activex-microsoft-xmldom-constructor
    desc: Constructs the Microsoft XMLDOM parser
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)ActiveXObject\s*\(\s*["'']Microsoft\.XMLDOM["'']\s*\)'

  - id: activex-codebase-version-fragment
    desc: ActiveX codebase version URL fragment
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)#version=\d+,\d+,\d+,\d+'
