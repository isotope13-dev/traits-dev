defaults:
  for: [javascript, html, text]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: baidubar-tool-progid
    desc: BaiduBar automation control ProgID
    if:
      type: text
      substr: BaiduBar.Tool
  - id: baidubar-dloadds-method
    desc: DloadDS method name or hex spelling
    if:
      type: text
      regex: 'DloadDS|\\x44\\x6c\\x6f\\x61\\x64\\x44\\x53'
  - id: playerproperty-build-comparison
    desc: Compares RealPlayer product build threshold
    if:
      type: text
      regex: 'PlayerProperty\("PRODUCTVERSION"\)\s*<=\s*"6\.0\.14\.[0-9]+"'
