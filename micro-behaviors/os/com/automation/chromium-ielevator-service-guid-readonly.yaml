defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: chromium-ielevator-service-guid-readonly
    desc: Read-only Chromium IElevator interface GUID
    if:
      type: hex
      section: .rdata
      pattern: "CF BE 3A 46 0D 41 7F 40 8A F5 0D F3 5A 00 5C C8"
# Go and C++ clients that call IElevator keep the interface's vtable type
# name in type/string data even when they resolve COM APIs dynamically
# instead of importing them, so import-based COM atoms never fire.
