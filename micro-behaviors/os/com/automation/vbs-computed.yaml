defaults:
  for: [vbs, mp3]
  platforms: [windows]
traits:

  - id: vbs-computed-progid
    desc: CreateObject receives a variable or call result
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[^.\w])CreateObject\s*\(\s*[A-Za-z_]\w{1,30}(\s*\([^)]{0,80}\))?\s*\)'

  # `"w"&D&"sc"&D&"ri"&D&"pt.s"&D&"he"&D&"ll"` -- a ProgID chopped into two- and
  # three-character pieces and glued back together with a variable (usually an
  # empty string) between each one. The only thing this defeats is a scanner
  # looking for the literal `WScript.Shell` / `Scripting.FileSystemObject`, so
  # the shape is the intent. Ordinary VBScript that builds strings from parts
  # uses markup or punctuation in the fragments (`"<td>" & v & "</td>"`), which
  # the word-and-dot character class here does not accept.
