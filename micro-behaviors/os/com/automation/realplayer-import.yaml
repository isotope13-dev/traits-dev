defaults:
  platforms: [windows]
  for: [javascript, html, text]
traits:
- id: wav-variable-playlist-import-call
  desc: Calls WAV Import with variable playlist
  crit: notable
  conf: 0.98
  if:
    type: text
    case_insensitive: true
    regex: '\.Import\(\s*["''][^"'']{1,180}\.wav["'']\s*,\s*\w+\s*,\s*["'']["'']\s*,\s*0,\s*0\)'
