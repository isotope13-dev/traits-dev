defaults:
  platforms: [windows, unix]
  for: [html, javascript, elf]
traits:
  - id: rds-dataspace-clsid
    desc: RDS CLSID prefix, plain or concealed
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule rds_prefix_forms {
          strings:
            $plain = "BD96C556-65A3-11D0" nocase
            $xor = /CE.{1,6}87B4.{1,6}47,74@2,0/ nocase
            $split = /C["+& ]*5["+& ]*5["+& ]*6["+& -]*65["+& ]*A3/ nocase
            $htmlship = "\\/\\?\\!\\!j\\/2\\/e\\/2\\/j\\!B6\\/2\\/e\\/"
          condition:
            any of them
        }
