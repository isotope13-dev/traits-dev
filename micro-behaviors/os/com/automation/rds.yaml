defaults:
  platforms: [windows, unix]
  for: [html, javascript, elf]
traits:
  - id: rds-dataspace-clsid
    desc: References RDS DataSpace CLSID prefix
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'BD96C556-65A3-11D0|CE.{1,6}87B4.{1,6}47,74@2,0'
      case_insensitive: true

