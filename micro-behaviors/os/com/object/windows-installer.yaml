# Windows Installer (MSI) automation objects.  The Installer/Database COM
# interface is how installer packages are inspected and edited without
# msiexec: OpenDatabase yields an MSI database handle whose OpenView/Execute
# pair runs SQL against the package tables.  Neutral capability -- it is the
# documented packaging API (Microsoft ships WiRunSQL.vbs in the Windows SDK)
# and equally the primitive for editing a signed installer's InstallExecute
# sequence or custom-action table.  Tampering intent belongs to composites
# under objectives/supply-chain/trojanized/ and objectives/execution/.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.92

traits:
  - id: windows-installer-progid
    desc: WindowsInstaller COM automation ProgID
    if:
      type: text
      regex: '(?i)\bWindowsInstaller\.(Installer|Database|Record)\b'

  - id: msi-database-open-call
    desc: MSI automation OpenDatabase call
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.OpenDatabase\s*\('

  # Export/Import move whole MSI tables to and from .idt text files. The `.idt`
  # extension is what makes these the MSI table API rather than any method
  # named Export — an unanchored `.Export("` matched ordinary SDK calls in
  # JavaScript. Export/Import are
  # the documented way to edit a package without SQL (the Windows Installer SDK
  # ships WiCodepage.vbs, which round-trips _ForceCodepage through a temp .idt),
  # and it is also how a table is rewritten in place — swapping a CustomAction
  # row or an InstallExecuteSequence entry — on an installer that was signed
  # before the edit. Neutral on its own; the tampering verdict comes from the
  # composites that pair it with signing or delivery evidence.
  - id: msi-database-export-call
    desc: MSI automation Export table call
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Export\s*\(?\s*["''][^\n]{0,90}\.idt\b'

  - id: msi-database-import-call
    desc: MSI automation Import table call
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Import\s*\(?\s*[^\n]{0,90}\.idt\b'
