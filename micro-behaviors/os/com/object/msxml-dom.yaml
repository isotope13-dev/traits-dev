# MSXML DOM document COM class references.
#
# MSXML2.DOMDocument is the Windows XML parser's COM ProgID. On its own it is
# an ordinary XML-parsing capability — vendor services, installers, and Office
# tooling all instantiate it. It is a building block for the bin.base64 codec
# trick (a DOM node typed `bin.base64` decodes its text), but that intent comes
# from the dataType/nodeTypedValue legs, not from this ProgID: composites in
# micro-behaviors/data/decode/base64/ and objectives/ reference this atom and
# supply that context themselves.
defaults:
  platforms: [windows]
  for: [javascript, vbs, powershell, pe, oledoc, ooxml]

traits:
  - id: msxml-domdocument-progid
    desc: References the MSXML DOM document COM class
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: "MSXML2.DOMDocument"
      case_insensitive: true
