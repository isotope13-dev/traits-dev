defaults:
  crit: notable
  for: [scripts, go, pe, html, xml]
  platforms:
    - windows
traits:
  - id: wscript-createobject-call
    desc: Calls the WScript.CreateObject COM factory
    conf: 0.9
    for: [javascript, vbs, html]
    if:
      type: text
      regex: 'WScript\.CreateObject\s*\('
  - id: wscript-shell-createobject
    desc: CreateObject instantiates WScript.Shell
    conf: 0.85
    # Relocated from objectives/persistence/login/startup/registry/, where a
    # bare instantiation was filed as persistence evidence. Creating the
    # object names no Run key or startup path; persistence composites
    # reference this atom and add the registry-write leg themselves.
    for: [vbs, csharp]
    if:
      type: text
      regex: 'CreateObject\(.{1,60}WScript\.Shell'
      case_insensitive: true
  - id: wscript-shell-literal
    desc: References the WScript.Shell COM object
    conf: 0.8
    if:
      type: text
      regex: WScript\.Shell(\.1)?
  - id: wscript-shell-split-progid
    desc: Split WScript.Shell ProgID string
    conf: 0.94
    for: [javascript, vbs, html]
    if:
      type: text
      regex: 'WScript\.Sh["'']\s*\+\s*["'']ell'
  - id: wscript-shell-activex-constructor
    desc: ActiveXObject instantiates WScript.Shell
    conf: 0.94
    for: [javascript, vbs, html, text, data]
    if:
      type: text
      regex: '(?i)ActiveXObject.{0,100}WScript\.Shell'
  - id: wscript-dynamic-com-member
    desc: WScript COM method via computed member
    conf: 0.92
    for: [javascript, vbs]
    if:
      type: text
      regex: '\bWScript\s*\[\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\]\s*\('

