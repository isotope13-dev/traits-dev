defaults:
  for: [scripts, go, pe, html, xml]
  platforms:
    - windows
traits:
  - id: wscript-shell-literal
    desc: References the WScript.Shell COM object
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: WScript\.Shell(\.1)?
  - id: wscript-shell-split-progid
    desc: Split WScript.Shell ProgID string
    crit: notable
    conf: 0.94
    for: [javascript, vbs, html]
    if:
      type: text
      regex: 'WScript\.Sh["'']\s*\+\s*["'']ell'
  - id: wscript-shell-activex-constructor
    desc: ActiveXObject instantiates WScript.Shell
    crit: notable
    conf: 0.94
    for: [javascript, vbs, html, text, data]
    if:
      type: text
      regex: '(?i)ActiveXObject.{0,100}WScript\.Shell'
  - id: wscript-dynamic-com-member
    desc: WScript COM method via computed member
    crit: notable
    conf: 0.92
    for: [javascript, vbs]
    if:
      type: text
      regex: '\bWScript\s*\[\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\]\s*\('
  - id: wscript-com-progid
    desc: WScript COM ProgID reference
    crit: notable
    conf: 0.8
    for: [pe, dll]
    if:
      type: text
      substr: WScript.
