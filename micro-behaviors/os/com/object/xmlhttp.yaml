defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, xml]
traits:
  - id: clsid-xmlhttp-b64-unicode
    desc: "Msxml2.XMLHTTP CLSID (b64 + Unicode encoded)"
    crit: suspicious
    conf: 1.0
    if:
      type: text
      substr: RgA1ADAANwA4AEYAMwA1AC0AQwA1ADUAMQAtADEAMQBEADMALQA4ADkAQgA5AC0AMAAwADAAMABGADgAMQBGAEUAMgAyADEA
  - id: clsid-xmlhttp-generic
    desc: References an XMLHTTP COM class identifier
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Msxml2\.XMLHTTP
  - id: activex-http-progid
    desc: Creates legacy ActiveX HTTP object
    crit: notable
    conf: 0.9
    if:
      type: text
      # Bundled browser clients also use JavaScript template quotes for the
      # legacy IE fallback (for example `Microsoft.XMLHTTP`).  It is still a
      # concrete HTTP ProgID, not evidence of a dropper by itself.
      regex: '(?i)(ActiveX|Create)Object\s*\(\s*["''`](MSXML2?\.XMLHTTP|Microsoft\.XMLHTTP)'
  - id: activex-winhttp-progid
    desc: WinHTTP ActiveX request object
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      substr: WinHTTP.WinHTTPRequest
  - id: activex-indexed-progid
    desc: Indexed ActiveX ProgID selection
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'new\s+ActiveXObject\(.{0,100}\[[^]]{1,80}\]\)'
  # Obfuscator.io / hex-index WSH droppers resolve ProgIDs via helper calls
  # (`ActiveXObject(_0x…[…](…))`) rather than a bare array index + `)`.
  - id: activex-obfuscated-progid
    desc: ActiveXObject with obfuscated ProgID expression
    crit: notable
    conf: 0.9
    for: [javascript, xml]
    if:
      type: text
      regex: 'new\s+ActiveXObject\(_0x[0-9a-fA-F]+'
  - id: xmlhttp-join-fragments
    desc: Fragmented MSXML2 XMLHTTP ProgID
    crit: suspicious
    conf: 0.94
    for: [powershell]
    if:
      type: text
      substr: 'MSX", "ML2.", "XMLHTTP'
  - id: clsid-xmlhttp-raw
    desc: Msxml2.XMLHTTP CLSID (Raw string)
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: F5078F35-C551-11D3-89B9-0000F81FE221
    unless:
      - id: well-known/lib/platform/wine/

composite_rules:
  - id: msxml-http-variable-progid
    desc: Indexed MSXML HTTP ProgID selection
    crit: notable
    conf: 0.9
    all:
      - id: clsid-xmlhttp-generic
      - id: activex-indexed-progid
  - id: msxml-http-variants
    desc: MSXML HTTP request object variants
    crit: notable
    conf: 0.7
    any:
      - id: clsid-xmlhttp-generic
      - id: activex-http-progid
      - id: activex-winhttp-progid
      - id: msxml-http-variable-progid
      - id: activex-obfuscated-progid
      - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: activex-network-access
    desc: ActiveX network access
    crit: notable
    conf: 0.8
    for: [javascript]
    platforms: [windows]
    attack: T1071
    mbc: C0005
    any:
      - id: clsid-xmlhttp-generic
      - id: activex-http-progid
