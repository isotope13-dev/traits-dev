# Microsoft Remote Desktop ActiveX (mstscax) control references. Legitimate
# RDP clients and some installers embed these ProgIDs; composites supply
# malware intent (VB6 Beebone-style stubs pair them with opaque VERSIONINFO).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: mstscax-dll-literal
    desc: mstscax.dll Remote Desktop ActiveX module
    if:
      type: text
      exact: mstscax.dll

  - id: msrdp-client-progid
    desc: MsRdpClient ActiveX ProgID reference
    conf: 0.96
    count_min: 2
    if:
      type: text
      regex: 'MsRdpClient[0-9a-zA-Z]{0,4}'

  - id: mstsclib-ctl-namespace
    desc: MSTSCLibCtl ActiveX type library name
    if:
      type: text
      exact: MSTSCLibCtl
