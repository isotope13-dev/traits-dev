defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

# SafeArray APIs in an import table show that a caller uses COM automation.
# The provider DLL itself exports the same APIs; matching generic symbols here
# would misclassify oleaut32.dll and other implementation DLLs as callers.
traits:
  - id: safearray-access-data
    desc: Imports SafeArray data access API
    if:
      type: import
      exact: SafeArrayAccessData

  - id: safearray-unaccess-data
    desc: Imports SafeArray data release API
    if:
      type: import
      exact: SafeArrayUnaccessData

  - id: safearray-get-element
    desc: Imports SafeArray element retrieval API
    if:
      type: import
      exact: SafeArrayGetElement

  - id: safearray-copy-data
    desc: Imports SafeArray bulk-copy API
    if:
      type: import
      exact: SafeArrayCopyData

  - id: safearray-put-element
    desc: Imports SafeArray element mutation API
    if:
      type: import
      exact: SafeArrayPutElement

composite_rules:
  - id: safearray-data-manipulation-cluster
    desc: Imports SafeArray data manipulation APIs
    crit: notable
    conf: 0.95
    needs: 3
    any:
      - id: safearray-access-data
      - id: safearray-unaccess-data
      - id: safearray-get-element
      - id: safearray-put-element

  - id: com-safearray-automation-triad
    desc: Imports SafeArray access, mutation, and release APIs
    crit: notable
    conf: 0.98
    all:
      - id: safearray-access-data
      - id: safearray-put-element
      - id: safearray-unaccess-data
    # Common in benign COM automation too; keep this as a notable behavior.

  - id: com-safearray-copy-extract-cluster
    desc: Imports SafeArray copy, extraction, and release APIs
    crit: notable
    conf: 0.97
    all:
      - id: safearray-copy-data
      - id: safearray-get-element
      - id: safearray-unaccess-data
    downgrade:
      any:
        - id: well-known/lib/wine/
