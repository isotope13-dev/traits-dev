# A class-factory export that serves nothing: DllGetClassObject clears *ppv
# and returns CLASS_E_CLASSNOTAVAILABLE for every CLSID. Real in-process
# servers look the CLSID up first; an unconditional failure means the COM
# exports exist only so the DLL can be registered as an InprocServer32.
defaults:
  platforms: [windows]
  for: [dll]
  attack: T1546.015

traits:
  - id: dllgetclassobject-always-unavailable-x64
    desc: Class factory always returns unavailable
    crit: notable
    conf: 0.88
    arch: [x86-64]
    if:
      type: hex
      section: .text
      # mov qword [r8], 0 ; mov eax, 0x80040111 ; ret
      pattern: '49 C7 00 00 00 00 00 B8 11 01 04 80 C3'
