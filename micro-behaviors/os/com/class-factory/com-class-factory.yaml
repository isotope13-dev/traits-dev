defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: export-dll-can-unload-now
    desc: COM unload export present
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: DllCanUnloadNow
  - id: export-dll-get-class-object
    desc: COM class factory export
    crit: notable
    conf: 0.95
    if:
      type: export
      exact: DllGetClassObject
composite_rules:
  - id: com-export-pair
    desc: DLL exports the COM unload and class-factory pair
    crit: notable
    conf: 0.95
    all:
      - id: export-dll-can-unload-now
      - id: export-dll-get-class-object
  - id: standard-com-server-exports
    desc: Standard COM server export set
    crit: baseline
    conf: 0.95
    all:
      - id: export-dll-can-unload-now
      - id: export-dll-get-class-object
      - id: micro-behaviors/os/com/registration::export-dll-register-server
      - id: micro-behaviors/os/com/registration::export-dll-unregister-server
    unless:
      - id: metadata/binary/symbols/count::many-exports-9
