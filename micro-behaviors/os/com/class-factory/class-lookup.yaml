# Class-object lookup evidence in native PE files. A CLSID in binary GUID
# layout is a reference, not proof the class is created.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  - id: cogetclassobject-name-string
    desc: CoGetClassObject API name string
    conf: 0.85
    if:
      type: text
      exact: CoGetClassObject
  - id: vbscript-engine-clsid-binary
    desc: VBScript engine CLSID in binary GUID form
    conf: 0.95
    if:
      # {B54F3741-5B07-11CF-A4B0-00AA004A55E8} as little-endian GUID bytes;
      # binary layout is not reachable by text extraction.
      type: raw
      regex: '(?-u)\x41\x37\x4F\xB5\x07\x5B\xCF\x11\xA4\xB0\x00\xAA\x00\x4A\x55\xE8'
