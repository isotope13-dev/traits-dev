# DllGetActivationFactory is the shared WinRT activation entry point. Its
# export identifies a capability, independently of the implementing product.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: dll-get-activation-factory-export
    desc: Exports the WinRT activation-factory entry
    crit: notable
    conf: 0.99
    if:
      type: export
      exact: DllGetActivationFactory
