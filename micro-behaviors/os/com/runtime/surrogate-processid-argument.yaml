# DcomLaunch starts the COM surrogate as `dllhost.exe /Processid:{AppID}`.
# Applications normally never build this command line themselves; the
# literal is a COM-surrogate argument observation, not a launch.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp, c, cpp, powershell]
traits:
  - id: com-surrogate-processid-argument
    desc: COM surrogate /Processid argument literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)/Processid:(\{|$)'
