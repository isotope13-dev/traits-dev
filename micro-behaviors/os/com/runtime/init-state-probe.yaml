# Two back-to-back two-argument calls through one register where the first
# result must be S_OK (test/jnz) and the second S_FALSE (dec/jnz). This is
# CoInitializeEx(NULL, 0) called twice to confirm real per-thread COM state;
# ordinary callers check SUCCEEDED once and never require S_FALSE. Crypter
# stubs carry the code in .text or in a populated UPX0 section.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
  conf: 0.9

traits:
  - id: coinitialize-twice-sok-sfalse-check-x86
    desc: Double COM init expecting S_OK then S_FALSE
    if:
      type: hex
      section: text
      pattern: '6A 00 6A 00 FF D? 85 C0 75 ?? 6A 00 6A 00 FF D? 48 75 ??'
  - id: coinitialize-twice-sok-sfalse-check-upx0
    desc: Double COM init S_OK/S_FALSE check in UPX0
    if:
      type: hex
      section: UPX0
      pattern: '6A 00 6A 00 FF D? 85 C0 75 ?? 6A 00 6A 00 FF D? 48 75 ??'
