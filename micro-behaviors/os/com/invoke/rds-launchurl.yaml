# RDS launchURL invocation: calling the method opens the argument URL
# with the control's privileges. The CLSID atom in
# micro-behaviors/os/com/instantiation names the control being driven.
defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: rds-launchurl-call
    desc: Invokes RDS launchURL method
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.launchURL\s*\('
