defaults:
  for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: browser-control-createprocess
  desc: Script calls a CreateProcess method
  if:
    type: text
    regex: \.CreateProcess\s*\(
- id: browser-control-startprocess
  desc: Script calls a StartProcess method
  if:
    type: text
    regex: \.StartProcess\s*\(
- id: browser-control-external-player
  desc: Script calls SetExternalPlayer
  if:
    type: text
    regex: \.SetExternalPlayer\s*\(
- id: browser-control-weblaunch
  desc: Script calls DoWebLaunch
  if:
    type: text
    regex: \.DoWebLaunch\s*\(
- id: browser-control-openwebfile
  desc: Script calls OpenWebFile
  if:
    type: text
    regex: \.OpenWebFile\s*\(
- id: browser-control-executeasync
  desc: Script calls ExecuteAsync
  if:
    type: text
    regex: \.ExecuteAsync\s*\(
- id: browser-control-createjob
  desc: Script calls CreateJob on a control
  if:
    type: text
    regex: \.CreateJob\s*\(
- id: activex-addstring-call
  desc: Script calls AddString
  if:
    type: text
    regex: (?i)\.AddString\s+
- id: xul-init-with-path
  desc: Script calls initWithPath
  if:
    type: text
    regex: (?i)\.initWithPath\s*\(
- id: xul-process-run
  desc: Script calls run with Boolean argument
  if:
    type: text
    regex: (?i)\.run\s*\(\s*true\s*,
- for:
  - html
  id: addstring-single-a-call
  desc: AddString receives a single ASCII A
  if:
    type: text
    regex: (?i)\.AddString\s+["']A["']
