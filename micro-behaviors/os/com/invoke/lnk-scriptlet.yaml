defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-remote-scriptlet-exec-call
    desc: LNK calls Exec on remote scriptlet object
    crit: notable
    conf: 0.99
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)GetObject\([''"]script:https?://[^''"]+[''"]\)\.Exec\(\)'
