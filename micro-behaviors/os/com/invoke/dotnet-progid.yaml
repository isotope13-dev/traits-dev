defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

composite_rules:
  - id: managed-admin-checked-com-progid-invoke
    desc: Admin-role check with reflective COM ProgID invocation
    all:
      - id: micro-behaviors/process/identity/query/principal::dotnet-windows-current-identity-import
      - id: micro-behaviors/os/privilege/check::dotnet-windows-role-query-import
      - id: micro-behaviors/os/com/interface::dotnet-get-type-from-progid-import
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::managed-activator-createinstance-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::cil-reflective-member-dispatch
