defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # BIND_OPTS3.cbStruct=36, CLSCTX_LOCAL_SERVER=4, a factory call with
  # HRESULT handling, followed by ShellExec at interface vtable offset 0x24.
  # Object/stack addresses and calls are intentionally not fixed.
  - id: x86-local-server-vtable-call
    desc: Local-server COM options and vtable call
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: 'C7 45 ?? 24 00 00 00 [12-24] C7 45 ?? 04 00 00 00 FF 15 ?? ?? ?? ?? 85 C0 79 ?? [0-32] 8B 45 ?? 6A 05 53 53 8B 08 53 FF 75 ?? 50 FF 51 24'
composite_rules:
  - id: icmluautil-shell-exec-code-profile
    desc: ICMLuaUtil IID and COM call profile
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/elevate::icmluautil-iid-bytes
      - id: x86-local-server-vtable-call
