defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.96

traits:
  - id: xul-local-file-launch
    desc: Calls the XUL local-file launch method
    # nsIFile.launch() runs in privileged XUL documents. The receiver name is
    # not constrained: droppers use short names (f.launch, x.launch). In
    # JavaScript, `.launch(` mostly means browser automation (puppeteer,
    # playwright), so the trait is limited to HTML/XUL documents.
    for: [html]
    if:
      type: text
      regex: '\.launch\s*\('
