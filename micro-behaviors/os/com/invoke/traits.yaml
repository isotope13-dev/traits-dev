# COM/OLE Operations
# Component Object Model and Object Linking and Embedding
defaults:
  for: ["pe", "c", "cpp"]
  platforms: ["windows"]
traits:
  # === COM Initialization ===
  - id: co-get-object-output-pointer-source
    desc: CoGetObject receives writable output pointer
    crit: notable
    conf: 0.96
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bCoGetObject\s*\([^;]{1,320},\s*&[A-Za-z_]\w*\s*\)'
  - id: getobject-wmi-call
    desc: JavaScript GetObject WMI moniker call
    crit: notable
    conf: 0.92
    for: [javascript]
    if:
      type: symbol
      kind: call
      exact: GetObject
      arg:
        kind: string
        substr: "winmgmts:"
composite_rules:
  - id: com-object-activation-security-chain
    desc: COM object activation with proxy security
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/com/instantiation::co-get-object
    any:
      - id: micro-behaviors/os/com/runtime::co-initialize-security
      - id: micro-behaviors/os/com/invoke::co-set-proxy-blanket
    unless:
      - id: well-known/app/utility/installer::uniextract-installer
      - id: well-known/tool/sysadmin/universal-extractor/
      - id: well-known/tool/browser::google-chrome-installer
      - id: well-known/tool/browser::google-chrome-runtime-component
      - id: well-known/lib/platform/microsoft-comsvcs::microsoft-comsvcs-library-context
  - id: wmi-com-proxy-setup
    desc: COM proxy setup for WMI automation
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/com/instantiation::co-create-instance
      - id: micro-behaviors/os/com/runtime::co-initialize-ex
      - id: micro-behaviors/os/com/invoke::co-set-proxy-blanket
    any:
      - id: micro-behaviors/os/com/runtime::co-initialize-security
      - id: micro-behaviors/os/com/array::safe-array-lock
      - id: micro-behaviors/os/com/array::safearray-put-element
      - id: micro-behaviors/os/com/automation::variant-copy
