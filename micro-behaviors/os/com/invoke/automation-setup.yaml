# Native COM/OLE API operations belong with COM invocation, alongside
# CLSIDFromString and VariantCopy, rather than script/control automation.
# Matchers and effective scope are preserved from automation/windows.yaml.
defaults:
  for: [pe, dll, javascript, vbs, batch, lua, html, asp]
  platforms: [windows]

traits: []
composite_rules:
  - id: ole-automation-setup
    desc: Resolve COM object automation
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/com/interface::clsid-from-progid
      - id: micro-behaviors/os/com/automation::variant-change-type
