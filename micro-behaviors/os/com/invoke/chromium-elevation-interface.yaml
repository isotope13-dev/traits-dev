defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
# Unscoped: Go clients keep the GUID in a writable global, and dumped or
# repacked images lose the original section names. The readonly variant
# below keeps the placement-specific claim for normally built images.
- id: chromium-ielevator-service-guid
  desc: Chromium IElevator service interface GUID
  if:
    type: hex
    section: any
    pattern: "CF BE 3A 46 0D 41 7F 40 8A F5 0D F3 5A 00 5C C8"
- id: chromium-ielevator-service-guid-readonly
  desc: Read-only Chromium IElevator interface GUID
  if:
    type: hex
    section: .rdata
    pattern: "CF BE 3A 46 0D 41 7F 40 8A F5 0D F3 5A 00 5C C8"
# Go and C++ clients that call IElevator keep the interface's vtable type
# name in type/string data even when they resolve COM APIs dynamically
# instead of importing them, so import-based COM atoms never fire.
- id: ielevator-vtbl-type-name
  desc: IElevator COM vtable type-name reference
  conf: 0.97
  if:
    type: hex
    section: any
    pattern: "49 45 6C 65 76 61 74 6F 72 56 74 62 6C"
