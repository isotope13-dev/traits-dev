# Binary BSTR operations are also used by legitimate COM clients. They do
# not establish decryption, secret recovery, or the destination of the data.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: sys-alloc-string-byte-len
    desc: Allocates a binary BSTR from bytes
    if:
      type: import
      exact: SysAllocStringByteLen
  - id: sys-string-byte-len
    desc: Queries a BSTR byte length
    if:
      type: import
      exact: SysStringByteLen

composite_rules:
  - id: chromium-ielevator-file-blob-api-profile
    desc: IElevator COM and binary BSTR APIs with file I/O
    all:
      - id: chromium-ielevator-service-guid-readonly
      - id: co-create-instance
      - id: co-set-proxy-blanket
      - id: sys-alloc-string-byte-len
      - id: sys-string-byte-len
      - id: micro-behaviors/fs/read/file/handle::c-fread
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
