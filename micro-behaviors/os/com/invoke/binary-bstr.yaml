# Binary BSTR operations are also used by legitimate COM clients. They do
# not establish decryption, secret recovery, or the destination of the data.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98

traits: []
composite_rules:
  - id: chromium-ielevator-file-blob-api-profile
    desc: IElevator COM and binary BSTR APIs with file I/O
    all:
      - id: metadata/file/profile/com-interface::chromium-ielevator-service-guid-readonly
      - id: metadata/file/profile/com-api::co-create-instance
      - id: metadata/file/profile/com-api::co-set-proxy-blanket
      - id: metadata/file/profile/com-api::sys-alloc-string-byte-len
      - id: metadata/file/profile/com-api::sys-string-byte-len
      - id: micro-behaviors/fs/read/file/handle::c-fread
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
