# GUIDs may be built by immediate DWORD stores instead of held contiguously.
# These are interface references; neither the GUID nor its layout proves theft.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.98

traits:
  - id: chromium-ielevator-guid-stack-dwords
    desc: Builds IElevator GUID with DWORD stores
    if:
      type: hex
      section: .text
      pattern: 'C7 (45 ?? | 85 [4] | 44 24 ?? | 84 24 [4]) CF BE 3A 46 C7 (45 ?? | 85 [4] | 44 24 ?? | 84 24 [4]) 0D 41 7F 40 C7 (45 ?? | 85 [4] | 44 24 ?? | 84 24 [4]) 8A F5 0D F3 C7 (45 ?? | 85 [4] | 44 24 ?? | 84 24 [4]) 5A 00 5C C8'
