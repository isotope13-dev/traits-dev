# Custom COM marshaling lets an object choose the CLSID instantiated while the
# object is unmarshaled in another process. The individual API references are
# legitimate COM mechanics; attack intent belongs in composites that pair this
# provider with a privileged destination and a plantable server DLL.
defaults:
  platforms: [windows]
  for: [source, binaries]
  attack: T1559.001

traits:
  - id: imarshal-interface-reference
    desc: References the COM IMarshal interface
    crit: notable
    conf: 0.9
    if:
      type: text
      word: IMarshal

  - id: get-unmarshal-class-method
    desc: References the IMarshal GetUnmarshalClass method
    crit: notable
    conf: 0.95
    if:
      type: text
      word: GetUnmarshalClass

composite_rules:
  - id: custom-unmarshal-class-provider
    desc: Custom COM marshaler supplies an unmarshaling CLSID
    crit: notable
    conf: 0.97
    near_bytes: 2048
    all:
      - id: imarshal-interface-reference
      - id: get-unmarshal-class-method
      - id: micro-behaviors/os/com/invoke::clsid-from-string
