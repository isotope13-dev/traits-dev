# Custom COM marshaling lets an object choose the CLSID instantiated while the
# object is unmarshaled in another process. The individual API references are
# legitimate COM mechanics; attack intent belongs in composites that pair this
# provider with a privileged destination and a plantable server DLL.
defaults:
  platforms: [windows]
  for: [source, binaries]
  attack: T1559.001

traits: []
composite_rules:
  - id: custom-unmarshal-class-provider
    desc: Custom COM marshaler supplies an unmarshaling CLSID
    crit: notable
    conf: 0.97
    near_bytes: 2048
    all:
      - id: metadata/file/profile/com-api::imarshal-interface-reference
      - id: metadata/file/profile/com-api::get-unmarshal-class-method
      - id: metadata/file/profile/com-api::clsid-from-string
