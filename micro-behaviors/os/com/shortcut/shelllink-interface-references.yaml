---
defaults:
  for:
  - c
  - cpp
  platforms:
  - windows
  crit: notable
  conf: 0.88
traits:
- id: ishelllink-interface
  desc: IShellLink COM interface in C source
  if:
    type: text
    substr: IShellLink
- id: clsid-shelllink-constant
  desc: CLSID_ShellLink COM class identifier
  if:
    type: text
    substr: CLSID_ShellLink
- id: ishelllink-get-description
  desc: IShellLink and GetDescription text
  if:
    type: text
    regex: IShellLink.{0,500}GetDescription
- id: ishelllink-get-path
  desc: IShellLink and GetPath text
  if:
    type: text
    regex: IShellLink.{0,500}GetPath
