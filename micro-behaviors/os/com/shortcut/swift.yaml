defaults:
  crit: notable
  platforms: [windows, unix]
  for: [swift]

traits: []
composite_rules:
  - id: swift-shelllink-shortcut-builder
    desc: Swift ShellLink shortcut builder
    conf: 0.94
    all:
      - id: micro-behaviors/os/com/shortcut::swift-shelllink-clsid
      - id: micro-behaviors/os/com/shortcut::swift-ishelllink-slot-table
      - id: micro-behaviors/os/com/shortcut::swift-shelllink-setpath-slot
      - id: micro-behaviors/os/com/interface::swift-ipersistfile-save-slot
    any:
      - id: micro-behaviors/os/com/shortcut::swift-shelllink-setargs-slot
      - id: micro-behaviors/os/com/interface::ipersistfile-interface
