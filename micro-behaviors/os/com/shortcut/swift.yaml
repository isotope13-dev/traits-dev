defaults:
  crit: notable
  platforms: [windows, unix]
  for: [swift]
  attack: T1547.009

traits: []
composite_rules:
  - id: swift-shelllink-shortcut-builder
    desc: Swift ShellLink shortcut builder
    conf: 0.94
    all:
      - id: metadata/file/profile/com-shortcut::swift-shelllink-clsid
      - id: metadata/file/profile/com-shortcut::swift-ishelllink-slot-table
      - id: metadata/file/profile/com-shortcut::swift-shelllink-setpath-slot
      - id: metadata/file/profile/com-shortcut::swift-ipersistfile-save-slot
    any:
      - id: metadata/file/profile/com-shortcut::swift-shelllink-setargs-slot
      - id: metadata/file/profile/com-shortcut::ipersistfile-interface
