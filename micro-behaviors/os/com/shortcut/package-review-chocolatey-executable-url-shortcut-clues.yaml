defaults:
  platforms: [windows]
  for: [nupkg]
composite_rules:
  - id: chocolatey-executable-url-shortcut-clues
    desc: Chocolatey hook has executable URL and shortcut clues
    crit: suspicious
    conf: 0.99
    scope: archive
    platforms: [windows, linux, macos]
    for: [scripts, '!jcl', csharp, go, html, lnk, nupkg, pe]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/communications/url/resource-path/file::executable-url-reference-b
      - id: micro-behaviors/os/com/shortcut::powershell-appdata-near-shortcut-exe-target
      - id: micro-behaviors/fs/file/create::shortcut-target-path

