# IShellLink COM interface for Windows shortcut manipulation
defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.88
  attack: T1547.009
traits: []
composite_rules:
  - id: ishelllink-shortcut-configuration
    desc: IShellLink COM shortcut target configuration
    crit: notable
    conf: 0.93
    all:
      - id: metadata/file/profile/com-shortcut::ishelllink-interface
      - id: metadata/file/profile/com-shortcut::clsid-shelllink-constant
      - id: metadata/file/profile/com-shortcut::ishelllink-set-path
    any:
      - id: metadata/file/profile/com-shortcut::ishelllink-set-arguments
      - id: metadata/file/profile/com-shortcut::ipersistfile-interface
  - id: ishelllink-description-path-api-profile
    desc: Shell-link description read, write and path APIs
    crit: notable
    conf: 0.92
    all:
      - id: metadata/file/profile/com-shortcut::ishelllink-set-description
      - id: metadata/file/profile/com-shortcut::ishelllink-get-description
      - id: metadata/file/profile/com-shortcut::ishelllink-set-path
    unless:
      - id: metadata/file/profile/source-indications/
      - id: metadata/path::wine-include-source-path
      - id: metadata/file/extension/identity::c-family-header-basename
