# IShellLink COM interface for Windows shortcut manipulation
defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.88
traits: []
composite_rules:
  - id: ishelllink-shortcut-configuration
    desc: IShellLink COM shortcut target configuration
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/os/com/shortcut::ishelllink-interface
      - id: micro-behaviors/os/com/shortcut::clsid-shelllink-constant
      - id: micro-behaviors/fs/path/file::set-path-method-reference
    any:
      - id: micro-behaviors/data/property/write::set-arguments-method-reference
      - id: micro-behaviors/os/com/interface::ipersistfile-interface
  - id: ishelllink-description-path-api-profile
    desc: Shell-link description read, write and path APIs
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/data/property/write::set-description-method-reference
      - id: micro-behaviors/os/com/shortcut::ishelllink-get-description
      - id: micro-behaviors/fs/path/file::set-path-method-reference
