defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: managed-shortcut-target-and-save-references
    desc: Managed shortcut target and save references
    crit: notable
    conf: 0.92
    if:
      type: yara
      source: |
        import "pe"
        rule managed_shortcut_target_and_save_references {
          strings:
            $create = "CreateShortcut" wide fullword
            $target = "TargetPath" wide fullword
            $save = "Save" wide fullword
            $late_set = "LateSetComplex" ascii fullword
            $late_call = "LateCall" ascii fullword
          condition:
            for any s in pe.sections : (
              s.name == ".text" and
              for all of them : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              )
            )
        }
