# Neutral observations and discriminating identities.
traits:
- crit: notable
  conf: 0.96
  id: powershell-shortcut-exe-target-value
  desc: Shortcut TargetPath assigned an EXE path
  if:
    type: text
    regex: \.TargetPath\s*=\s*"[^"\r\n]{1,160}\.exe"
composite_rules:
- crit: notable
  conf: 0.96
  id: powershell-appdata-near-shortcut-exe-target
  desc: AppData reference near EXE shortcut target
  near_lines: 12
  all:
  - id: micro-behaviors/os/env/user-paths::env-appdata
  - id: micro-behaviors/os/com/shortcut::powershell-shortcut-exe-target-value
defaults:
  for:
  - powershell
  platforms:
  - windows
