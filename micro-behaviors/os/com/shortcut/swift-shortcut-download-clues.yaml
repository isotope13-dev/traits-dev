---
defaults:
  platforms:
  - windows
  - unix
  for:
  - swift
composite_rules:
- id: swift-shortcut-curl-temp-exe-profile
  desc: Shortcut creation with curl download/launch clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/os/com/shortcut::swift-shelllink-shortcut-builder
  - id: micro-behaviors/communications/icmp::swift-cmd-ping-argument-reference
  - id: micro-behaviors/communications/http/download/cli/curl-wget::swift-curl-temp-output-reference
  - id: micro-behaviors/fs/path/temporary-artifact::swift-temp-exe-pair-reference
