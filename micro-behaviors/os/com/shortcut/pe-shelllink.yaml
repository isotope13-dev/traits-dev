# Native Windows PE shortcut manipulation via ShellLink and IPersistFile COM GUIDs.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: component
  conf: 0.99

traits:
  - id: pe-clsid-shelllink-rdata
    desc: ShellLink COM class GUID in rdata
    if:
      type: hex
      section: .rdata
      pattern: '01 14 02 00 00 00 00 00 C0 00 00 00 00 00 00 46'

  - id: pe-iid-ishelllinkw-rdata
    desc: IShellLinkW COM interface GUID in rdata
    if:
      type: hex
      section: .rdata
      pattern: 'F9 14 02 00 00 00 00 00 C0 00 00 00 00 00 00 46'

  - id: pe-iid-ipersistfile-rdata
    desc: IPersistFile COM interface GUID in rdata
    if:
      type: hex
      section: .rdata
      pattern: '0B 01 00 00 00 00 00 00 C0 00 00 00 00 00 00 46'

composite_rules:
  - id: pe-shelllink-com-api
    desc: PE manipulates Windows shortcuts via ShellLink COM
    crit: notable
    conf: 0.95
    all:
      - id: pe-clsid-shelllink-rdata
      - id: pe-iid-ipersistfile-rdata
      - id: micro-behaviors/os/com/instantiation::co-create-instance
    any:
      - id: pe-iid-ishelllinkw-rdata
      - id: micro-behaviors/fs/path/extension::lnk-extension-reference
