defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: base64-reagentc-disable-command
    desc: Base64-embedded Windows recovery disable command
    crit: notable
    conf: 0.99
    attack: T1490
    if:
      type: yara
      source: |
        import "pe"
        rule base64_reagentc_disable_command {
          strings:
            $command = "reagentc /disable" base64
          condition:
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".rdata" and
              for any i in (1..#command) : (
                @command[i] >= pe.sections[s].raw_data_offset and
                @command[i] + !command[i] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size
              )
            )
        }
