defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

traits:
  - id: sr-remove-restore-point
    desc: Windows restore-point removal API reference
    crit: notable
    conf: 0.96
    if:
      type: text
      word: SRRemoveRestorePoint
    unless:
      - type: basename
        regex: '(?i)\.(h|hh|hpp|hxx)$'
      - id: metadata/file/profile/source-indications/

composite_rules:
  - id: native-restore-point-api-profile
    desc: Restore-point removal API with loader references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/library::srclient-dll-reference
      - id: sr-remove-restore-point
    any:
      - id: micro-behaviors/os/recovery::sr-set-restore-point
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/load/source::load-library-source
    unless:
      # A DLL that *exports* SRRemoveRestorePoint is the System Restore API
      # provider, not a caller of it -- ReactOS's srclient.dll is 31KB with ten
      # exports and no version resource, so no vendor identity applies. The
      # generic implementer umbrella needs two offensive export families and
      # this one has only the restore family, which is precisely the family
      # this rule is about.
      - id: metadata/lang/upstream::exports-system-restore-api
      - id: metadata/file/profile/source-indications/
      - id: metadata/binary/vendor/
      - id: metadata/vendor/string::microsoft-corporation-name-reference
      - id: well-known/tool/detection/wireshark/
      - id: micro-behaviors/os/recovery::checkpoint-computer-restore-point
