defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

traits:
  - id: sr-remove-restore-point
    desc: Windows restore-point removal API reference
    crit: notable
    conf: 0.96
    if:
      type: text
      word: SRRemoveRestorePoint
    unless:
      - type: basename
        regex: '(?i)\.(h|hh|hpp|hxx)$'
composite_rules:
  - id: native-restore-point-api-profile
    desc: Restore-point removal API with loader references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/library::srclient-dll-reference
      - id: sr-remove-restore-point
    any:
      - id: micro-behaviors/os/recovery::sr-set-restore-point
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/load/source::load-library-source
