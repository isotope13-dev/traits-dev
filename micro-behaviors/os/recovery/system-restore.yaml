# System Restore is a Windows OS control API. Recovery-impact intent belongs
# in objectives/impact/degrade/system/recovery/ and references this atom.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: sr-set-restore-point
    desc: Windows System Restore create API reference
    if:
      type: text
      substr: SRSetRestorePoint
  - id: reagentc-disable-winre
    desc: ReAgentC disables Windows Recovery Environment
    crit: suspicious
    conf: 0.97
    attack: T1490
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\breagentc(\.exe)?\s+/disable\b'
