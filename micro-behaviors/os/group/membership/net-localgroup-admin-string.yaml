defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.9
  attack: T1098

traits:
  - id: embedded-net-localgroup-admin-add
    desc: Embedded command adds an Administrators member
    if:
      type: text
      regex: '(?i)\bnet1?(\.exe)?\s+localgroup\s+administrators\s+[^\s"/]{1,40}\s+/add\b'
