# Windows account additions to privileged local or domain groups.
defaults:
  platforms: [windows]
  for: [scripts, source, pe, dll]
  attack: T1098

traits:
  - id: net-add-group-command
    desc: Uses net to add group membership
    crit: notable
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?[ \t]+(group|localgroup)[ \t]+.{0,80}/add\b'

  - id: privileged-domain-group-name
    desc: References a privileged domain group
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(Domain Admins|DnsAdmins|Enterprise Admins|Schema Admins)\b'

  - id: privileged-local-group-name
    desc: References a privileged local group
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(Administrators|Hyper-V Administrators)\b'

  - id: powershell-add-group-command
    desc: Uses PowerShell to add group membership
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\b(Add-ADGroupMember|Add-LocalGroupMember)\b'

  - id: windows-group-membership-api
    desc: Calls Windows group membership API
    crit: notable
    conf: 0.9
    for: [c, cpp, csharp, pe, dll]
    if:
      type: symbol
      regex: '^(NetGroupAddUser|NetLocalGroupAddMembers)$'

composite_rules:
  - id: net-privileged-group-add
    desc: Uses net to add privileged group membership
    crit: suspicious
    conf: 0.96
    all:
      - id: net-add-group-command
    any:
      - id: privileged-domain-group-name
      - id: privileged-local-group-name
    needs: 1
    near_lines: 1
    unless:
      - id: well-known/tool/development/go-x-build::go-x-build-infra-context
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
      - id: well-known/tool/offensive/bingo/
      - id: metadata/build/ci/agent::packer-windows-ci-image-context
    downgrade:
      any:
        - id: well-known/app/development/vscode-extension/database-client::extension-context

  - id: powershell-privileged-group-add
    desc: PowerShell adds privileged group membership
    crit: suspicious
    conf: 0.94
    all:
      - id: powershell-add-group-command
    any:
      - id: privileged-domain-group-name
      - id: privileged-local-group-name
    needs: 1
    near_lines: 1
    unless:
      - id: well-known/app/enterprise/dotmatics-dtx::dtx-cloud-management-context
