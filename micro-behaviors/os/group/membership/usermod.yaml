# The group must occur in the -G argument. A later sudo command, or a user
# named sudo, does not establish membership in the sudo group.
defaults:
  platforms: [unix, android, ios]
  for: [elf, shell]
  crit: notable
  conf: 0.85
traits:
  - id: usermod-wheel
    desc: usermod names wheel in group list
    if:
      type: text
      regex: '\busermod\s+(-a\s+)?-a?G\s+([\w,-]{1,40},)?wheel([,\s]|$)'
    unless:
      - id: metadata/build/docker::dockerfile-basename
  - id: usermod-sudo
    desc: usermod names sudo in group list
    if:
      type: text
      regex: '\busermod\s+(-a\s+)?-a?G\s+([\w,-]{1,40},)?sudo([,\s]|$)'
    unless:
      - id: well-known/lib/ai/tensorflow::tensorflow-user-wrapper
      - id: metadata/build/docker::dockerfile-basename
