defaults:
  platforms: [windows]
  for: [powershell, batch, scripts, pe]
  attack: "T1484.001"
composite_rules:
  - id: privileged-group-netlogon-copy-clues
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: Privileged group add near NETLOGON file copy
    crit: suspicious
    conf: 0.97
    attack: T1098,T1570
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::netlogon-path-copy-command-clues
    any:
      - id: micro-behaviors/os/group/membership::net-privileged-group-add
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add
    needs: 1
    near_lines: 24

  - id: privileged-group-sysvol-copy-clues
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: Privileged group addition near SYSVOL file copy
    crit: suspicious
    conf: 0.97
    attack: T1098,T1570
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::sysvol-script-file-transfer
    any:
      - id: micro-behaviors/os/group/membership::net-privileged-group-add
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add
    needs: 1
    near_lines: 32
