defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-net-admin-add-literal
    desc: PowerShell administrator-add command string
    conf: 0.95
    if:
      type: literal
      regex: '(?i)\bnet\s+localgroup\s+administrators\s+\S+\s+/add\b'

  - id: powershell-net-group-add-literal
    desc: PowerShell net group-add command string
    conf: 0.95
    if:
      type: literal
      regex: '(?i)\bnet(\.exe)?[ \t]+(group|localgroup)[ \t]+.{0,80}/add\b'

  - id: powershell-net-group-add-call
    desc: PowerShell calls net group membership addition
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i)^net(\.exe)?$'
      args:
        - index: 0
          kind: identifier
          name_regex: '(?i)^(group|localgroup)$'
        - kind: identifier
          name_regex: '(?i)^/add$'


  - id: powershell-net-admin-add-call
    desc: PowerShell calls net administrator addition
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i)^net(\.exe)?$'
      args:
        - index: 0
          kind: identifier
          name_regex: '(?i)^localgroup$'
        - index: 1
          kind: identifier
          name_regex: '(?i)^administrators$'
        - kind: identifier
          name_regex: '(?i)^/add$'
