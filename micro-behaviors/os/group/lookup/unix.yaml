defaults:
  platforms: [linux, macos]
  for: [elf, macho, c]
  crit: notable
  conf: 0.8
traits:
  # No "GNU coreutils"-string carve-out here: a self-declared identity string
  # must not hide a real capability (ls genuinely reads xattrs / resolves
  # groups for -l), and the string is trivially plantable by a masquerader.
  - id: getgrgid
    desc: Read group record by GID
    if:
      type: symbol
      exact: getgrgid
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/fs/path/application/interpreter::python3-interpreter-basename
  - id: getgrnam
    desc: Resolve group name to GID
    if:
      type: symbol
      exact: getgrnam
  - id: group-from-gid
    desc: Resolve GID to group name
    if:
      type: symbol
      exact: group_from_gid
  - id: getgroups
    desc: Read supplementary group list
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: getgroups
composite_rules:
  - id: gid-resolution
    desc: Resolve group ID to group name
    any:
      - id: getgrgid
      - id: getgrnam
      - id: group-from-gid
