# Group ID Resolution (Perl)
# Resolves GIDs to group names via built-in functions
defaults:
  platforms: [unix]
  for: [perl]
  crit: notable
  conf: 0.8
traits:
  - id: perl-getgrgid
    desc: Resolve GID to group
    if:
      type: text
      regex: '\bgetgrgid\s*'
  - id: perl-getgrnam
    desc: Resolve group name to GID
    if:
      type: text
      regex: '\b(e)?getgrnam\s*\('
  - id: perl-getgrent
    desc: Iterate group entries
    if:
      type: symbol
      exact: getgrent
