# Group ID Resolution (Ruby)
# Resolves GIDs to group names via Etc module
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 0.8
traits:
  - id: etc-getgrgid
    desc: Resolve GID to group
    if:
      type: text
      regex: "Etc\\.getgrgid\\s*\\(?\\d*\\)?"
  - id: etc-getgrnam
    desc: Resolve group name to GID
    if:
      type: text
      regex: "Etc\\.getgrnam\\s*\\("
  - id: etc-group-dup
    desc: Iterate all groups
    if:
      type: text
      regex: "Etc\\.group\\b"
