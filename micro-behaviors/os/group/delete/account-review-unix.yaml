# Unix account-management command references.  Account creation is a neutral
# capability; attacker intent requires additional context in objectives/.
defaults:
  platforms: [unix]
  for: [python, shell]
  crit: notable
  conf: 0.9
  attack: T1136.001

traits:
  - id: groupdel-command
    desc: Deletes Unix group with groupdel or delgroup
    crit: notable
    conf: 0.9
    attack: T1531
    for: [python, shell, elf]
    if:
      type: text
      regex: "(^|[\\n;&|`$({])\\s*(/usr/sbin/)?(groupdel|delgroup)\\b"
    not:
      - regex: '^\s*(\*|//|#)'
  - id: perl-groupdel-command-resolution
    desc: Perl resolves groupdel utility path
    crit: notable
    conf: 0.9
    for: [perl]
    if:
      type: text
      regex: "\\bwhich\\s*\\(\\s*['\"]groupdel['\"]\\s*\\)"
  - id: perl-groupdel-systemcall
    desc: Perl wrapper invokes resolved groupdel
    crit: notable
    conf: 0.9
    attack: T1531
    for: [perl]
    if:
      type: text
      substr: systemcall($groupdel
composite_rules:
  - id: perl-groupdel-command
    desc: Deletes Unix group through Perl wrapper
    crit: notable
    conf: 0.94
    attack: T1531
    for: [perl]
    all:
      - id: perl-groupdel-command-resolution
      - id: perl-groupdel-systemcall
