defaults:
  platforms: [unix, windows]
  crit: notable
  for: [java, class]
traits:
  - id: jvm-transferable-data-read-import
    desc: JVM imports Transferable.getTransferData
    for: [class]
    conf: 0.99
    if:
      type: import
      exact: java/awt/datatransfer/Transferable.getTransferData
  - id: java-transferable-text-read-call
    desc: Calls getTransferData with stringFlavor
    for: [java]
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: '\.getTransferData\s*\(\s*DataFlavor\.stringFlavor\s*\)'
composite_rules:
  - id: java-transferable-data-read
    desc: Java Transferable data-extraction API call
    conf: 0.98
    any:
      - id: jvm-transferable-data-read-import
      - id: java-transferable-text-read-call
