defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: clipboard-getdata-reference
    desc: Names clipboard.GetData in a literal
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: clipboard.GetData
composite_rules:
  - id: python-clipboard-data-read
    desc: Python clipboard data retrieval APIs
    conf: 0.8
    crit: notable
    any:
      - id: micro-behaviors/os/clipboard/read::python-get-clipboard-data-call
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/os/clipboard/read::clipboard-getdata-reference
