defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1115
traits:
  - id: node-pbpaste-read
    desc: Reads clipboard via pbpaste
    conf: 0.95
    if:
      # Match an actual child-process invocation with pbpaste as an argument.
      # A literal-only rule also fires on documentation such as "pbpaste | ..."
      # and does not establish clipboard access.
      type: symbol
      kind: call
      regex: '(^|\.)(exec(File)?(Sync)?|spawnSync)$'
      arg:
        kind: string
        exact: pbpaste
    unless:
      - id: metadata/package/files/system-package::julia-runtime-path
      - id: well-known/lib/platform/clipboardy::clipboardy-package-path
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
      - id: well-known/app/ai/agent-runtime/guangnao-agent-cli::guangnao-agent-cli-context
  - id: node-powershell-get-clipboard
    desc: Reads clipboard via PowerShell
    conf: 0.95
    if:
      type: literal
      regex: powershell.{0,50}Get-Clipboard
  - id: node-xclip-read
    desc: Reads clipboard via xclip
    conf: 0.95
    if:
      type: literal
      regex: 'xclip.{0,80}(-o|-out|--out)'
    not:
      - substr: "pbcopy/xclip"
      - substr: "xclip/pbcopy"
  # Array-dispatched invocations (`['pbpaste', []]` spread into spawn) never
  # place the tool name and its flags in one literal, so the call/arg and
  # single-literal atoms above miss them. Each spelling below keeps the
  # quoted tool name in argument position of a command tuple: dedicated
  # read binaries imply the direction, while dual-use X11 tools additionally
  # require their read flag in the same tuple and PowerShell requires
  # Get-Clipboard in its argv.
  - id: node-read-helper-command-tuple
    desc: Clipboard read helper passed as command
    conf: 0.87
    if:
      type: text
      case_insensitive: true
      regex: '[''"](pbpaste|wl-paste|termux-clipboard-get)[''"]\s*,\s*\['
  - id: node-x11-read-command-tuple
    desc: X11 read helper passed as command
    conf: 0.87
    if:
      type: text
      case_insensitive: true
      regex: '[''"](xclip|xsel)[''"]\s*,\s*\[[^\]]{0,120}(-o\b|-out\b|--output\b)'
  - id: node-powershell-read-command-tuple
    desc: PowerShell clipboard read passed as command
    conf: 0.87
    if:
      type: text
      case_insensitive: true
      regex: '[''"]powershell[''"]\s*,\s*\[[\s\S]{0,200}Get-Clipboard'
composite_rules:
  - id: node-cli-clipboard-read
    crit: notable
    platforms: [android, ios, linux, macos, unix, windows]
    desc: Reads clipboard via CLI helper
    conf: 0.9
    any:
    - id: node-pbpaste-read
    - id: node-xclip-read
    - id: node-powershell-get-clipboard
    - id: node-read-helper-command-tuple
    - id: node-x11-read-command-tuple
    - id: node-powershell-read-command-tuple
