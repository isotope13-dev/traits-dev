defaults:
  platforms: [unix, windows]
  for: [java, class]
  attack: T1115
traits:
  - id: java-clipboard-get-contents
    desc: Java clipboard contents read
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: getContents
composite_rules:
  - id: java-clipboard-text-read
    desc: Java reads system clipboard text
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/os/clipboard/reference::java-awt-system-clipboard
      - id: java-clipboard-get-contents
    any:
      - id: micro-behaviors/os/clipboard/reference::java-string-data-flavor
    unless:
      - id: well-known/app/media/plantuml::vscode-extension-member
      - id: well-known/app/media/plantuml::jar-member
      - id: well-known/app/media/plantuml::clipboard-loop-class
