defaults:
  platforms: [macos]
  for: [swift]
  crit: notable
  conf: 0.97

traits:
  - id: swift-general-pasteboard-content-read
    desc: Reads contents of the general clipboard
    if:
      type: symbol
      kind: call
      regex: '^NSPasteboard\.+general\.+(string|data|readObjects|propertyList)$'
