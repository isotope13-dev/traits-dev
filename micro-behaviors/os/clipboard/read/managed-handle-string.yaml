# Lock a clipboard handle, convert its pointer to text, unlock, then test
# the string. This does not assert a valid clipboard format or a file sink.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: managed-clipboard-handle-string-read
    desc: Managed clipboard handle and string-read layout
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        import "pe"
        rule managed_clipboard_handle_string_read {
          strings:
            $clr = "BSJB"
            $get = "GetClipboardData" ascii fullword
            $lock = "GlobalLock" ascii fullword
            $unlock = "GlobalUnlock" ascii fullword
            $convert = "PtrToStringUni" ascii fullword
            $close = "CloseClipboard" ascii fullword
            $read = { 07 28 ?? ?? ?? 0A 0C 06 28 ?? ?? ?? 06 26 08 28 ?? ?? ?? 0A }
          condition:
            all of them and
            for any s in pe.sections : (
              s.name == ".text" and
              $read in (s.raw_data_offset .. s.raw_data_offset+s.raw_data_size-1)
            )
        }
