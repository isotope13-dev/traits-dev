defaults:
  platforms: [windows]
  for: [scripts, binaries, csharp]
traits:
  - id: clipboard-get-name
    desc: Clipboard retrieval name clipboard_get
    crit: notable
    conf: 0.86
    if:
      type: text
      word: clipboard_get
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/os/clipboard/read::tkinter-clipboard-get-func
