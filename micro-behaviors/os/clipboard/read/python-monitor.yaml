defaults:
  platforms: [windows]
  for: [python]
  attack: T1115
  crit: notable
  conf: 0.9

traits:
  - id: python-get-clipboard-data-call
    desc: Python reads Win32 clipboard data
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetClipboardData$'
  - id: python-save-clipboard-files-or-images
    desc: Saves clipboard files or images to disk
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(copy_files_parallel|save_image_as_png)$'
