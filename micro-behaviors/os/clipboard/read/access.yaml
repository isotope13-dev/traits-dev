defaults:
  crit: notable
  platforms:
    - windows
  for:
    - pe
    - rust
    - c
    - cpp
traits:
  - id: get-clipboard-data
    desc: Read data from clipboard
    conf: 0.75
    if:
      type: symbol
      exact: GetClipboardData
  - id: get-clipboard-data-text
    desc: GetClipboardData named, not imported
    conf: 0.76
    for: [data, binaries, '!dex', '!elf', '!macho', c, csharp, go, rust]
    if:
      type: text
      word: GetClipboardData
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: get-clipboard-data
  - id: python-win32-get-clipboard-data
    desc: Python reads Windows clipboard
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      exact: win32clipboard.GetClipboardData
  - id: python-ctypes-get-clipboard-data
    desc: Python ctypes reads Windows clipboard
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      exact: user32.GetClipboardData
  - id: dotnet-clipboard-gettext-helper
    desc: Managed clipboard read helper
    conf: 0.78
    if:
      type: text
      word: ClipboardGetText
  - id: source-winforms-clipboard-gettext
    desc: Code reads WinForms clipboard text
    for: [scripts, source]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'Clipboard[^\r\n]{0,40}GetText[(]'
  - id: class-winforms-clipboard-gettext
    desc: JVM class embeds WinForms clipboard read
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: 'Clipboard[^\r\n]{0,40}GetText[(]'
  - id: macos-pasteboard-items
    desc: Iterates macOS pasteboard items
    conf: 0.8
    for:
      - macho
    platforms:
      - macos
    if:
      type: text
      substr: pasteboardItems
composite_rules:
  - id: win32-unicode-clipboard-read
    desc: Win32 Unicode clipboard text read
    conf: 0.9
    for: [rust, c]
    all:
      - id: micro-behaviors/os/clipboard/reference::open-clipboard
      - id: micro-behaviors/os/clipboard/reference::is-clipboard-format-available
      - id: get-clipboard-data
      - id: micro-behaviors/os/clipboard/reference::unicode-text-format
  # `copy-to-clipboard-helper-identifier` is deliberately NOT a member: it is
  # language-neutral, and as an `any:` leg it alone would let this composite
  # claim .NET clipboard helpers in a Rust or JavaScript file. The two members
  # below both echo the WinForms `Clipboard.GetText`/`SetText` spelling.
