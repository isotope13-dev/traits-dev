# AppleScript clipboard reads: "the clipboard" used as a value (write/get/
# return/set-to, optionally coerced with "as"), or a "clipboard info" type
# query. Setting the clipboard ("set the clipboard to") is a write and must
# not match.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.92
  attack: T1115

traits:
  - id: applescript-the-clipboard-value
    desc: AppleScript reads the clipboard as a value
    if:
      type: text
      regex: '(?im)\b(write|get|return|to)[ \t]+\(?the clipboard([ \t]+as\b|\)|[ \t]*\r?$)'

  - id: applescript-clipboard-info-query
    desc: AppleScript queries clipboard content types
    if:
      type: text
      regex: '(?im)\b(in|to|get|return)[ \t]+\(?clipboard info\b'

composite_rules:
  - id: applescript-clipboard-read
    desc: AppleScript reads or inspects the clipboard
    any:
      - id: applescript-the-clipboard-value
      - id: applescript-clipboard-info-query
