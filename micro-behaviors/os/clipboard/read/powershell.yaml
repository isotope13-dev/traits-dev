defaults:
  platforms: [windows]
  for: [powershell, pe]
  attack: T1115
traits:
  # PE only: the matcher is pinned to `.text`, which a script has no section
  # for. It was listed for powershell too and never fired there; scripts use
  # the call-site atom below.
  - id: powershell-get-clipboard
    desc: PowerShell Get-Clipboard cmdlet
    crit: notable
    conf: 0.7
    for: [pe]
    if:
      type: text
      section: .text
      substr: Get-Clipboard
    unless:
      - type: raw
        regex: fish_clipboard_paste|powershell\.exe Get-Clipboard|string collect -N
  # The cmdlet as a parsed call. Cmdlet names are case-insensitive, and
  # stealers write `get-clipboard` as often as `Get-Clipboard`.
  - id: powershell-get-clipboard-call
    desc: PowerShell script calls Get-Clipboard
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      regex: '(?i)^Get-Clipboard$'
  # The same read through .NET, which is what a script uses when it wants to
  # avoid the cmdlet name or runs on Windows PowerShell 2.0-4.0.
  - id: powershell-dotnet-clipboard-read
    desc: PowerShell reads the clipboard through .NET
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bClipboard\]::(GetText|GetDataObject|GetData|GetFileDropList|GetImage)\s*\('
composite_rules:
  - id: powershell-clipboard-read
    desc: PowerShell script reads the clipboard
    crit: notable
    conf: 0.9
    for: [powershell]
    any:
      - id: powershell-get-clipboard-call
      - id: powershell-dotnet-clipboard-read
