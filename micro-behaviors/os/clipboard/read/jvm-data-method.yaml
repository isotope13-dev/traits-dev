defaults:
  for: [class, java_class]
  platforms: [windows, unix]
traits:
  - id: jvm-clipboard-get-data-reference
    desc: JVM clipboard class with getData reference
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule jvm_clipboard_get_data_reference {
          strings:
            $class = "java/awt/datatransfer/Clipboard"
            $method = "getData"
            $signature = "(Ljava/awt/datatransfer/DataFlavor;)Ljava/lang/Object;"
          condition:
            all of them
        }
