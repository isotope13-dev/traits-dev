defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1115
traits:
  - id: dotnet-pbpaste-read
    desc: Reads clipboard via pbpaste
    conf: 0.9
    platforms: [unix, windows]
    for: [pe]
    if:
      type: text
      exact: pbpaste

  - id: clipboard-read-command
    desc: X11 clipboard read command
    crit: notable
    conf: 0.84
    platforms: [linux]
    for: [source, scripts]
    if:
      type: text
      regex: '\b(xclip|xsel)\b[^\n]{0,100}(\s-o\b|\s--out(put)?\b)'

composite_rules:
  - id: dotnet-xclip-read
    desc: Reads clipboard via xclip
    conf: 0.88
    platforms: [unix, windows]
    for: [pe]
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/clipboard/reference::dotnet-xclip-program
      - id: metadata/lang/source/naming/function/runtime::run-process-output-helper

