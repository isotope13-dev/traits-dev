defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1115
traits:
  - id: dotnet-pbpaste-read
    desc: Reads clipboard via pbpaste
    conf: 0.9
    platforms: [unix, windows]
    for: [pe]
    if:
      type: text
      exact: pbpaste

composite_rules:
  - id: dotnet-xclip-read
    desc: Reads clipboard via xclip
    conf: 0.88
    platforms: [unix, windows]
    for: [pe]
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/clipboard/reference::dotnet-xclip-program
      - id: micro-behaviors/process/io/buffer::run-process-output-helper

