defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable

traits:
  - id: capture-phase-paste-template-record
    desc: Captures pasted text into template records
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @document
            property: (property_identifier) @listen)
          arguments: (arguments
            . (string (string_fragment) @event)
            . (arrow_function
              body: (statement_block
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @text
                    value: (binary_expression
                      left: (call_expression) @read)))
                (expression_statement
                  (call_expression
                    arguments: (arguments
                      (template_string
                        (template_substitution
                          (call_expression
                            arguments: (arguments . (identifier) @used .)))))))))
            . (true) @capture)
          (#eq? @document "document")
          (#eq? @listen "addEventListener")
          (#eq? @event "paste")
          (#match? @read "[.]clipboardData[?]?[.]getData")
          (#eq? @text @used))
