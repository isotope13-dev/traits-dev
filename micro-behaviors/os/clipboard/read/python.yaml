defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: tkinter-clipboard-get-func
    desc: clipboard_get function
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/library/python-stdlib
    if:
      type: symbol
      exact: "clipboard_get"
  - id: tkinter-clipboard-get-method
    desc: clipboard_get method call
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/library/python-stdlib
    if:
      type: symbol
      substr: '.clipboard_get'
  # === Pyperclip ===
  - id: pyperclip-paste
    desc: Reads text from clipboard (pyperclip)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      substr: 'pyperclip.paste'
  - id: pil-imagegrab-clipboard
    desc: Reads image from clipboard (PIL ImageGrab)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: ImageGrab.grabclipboard

  # === GuardDog: pandas clipboard access ===
  - id: pandas-read-clipboard
    desc: pandas read_clipboard function
    crit: notable
    conf: 0.9
    if:
      # Migrated from a tree-sitter call query to a `kind: call`
      # match on the pre-extracted call fact (no per-member
      # tree-sitter cursor walk; same name semantics).
      type: symbol
      kind: call
      exact: 'pandas.read_clipboard'
composite_rules:
  - id: tkinter-clipboard-get
    desc: Reads clipboard content (Tkinter)
    crit: notable
    conf: 0.9
    any:
      - id: tkinter-clipboard-get-func
      - id: tkinter-clipboard-get-method
  # Read/write access is neutral by itself. Crypto-manipulation composites
  # add address recognition and a replacement operation before inferring a
  # clipboard clipper.
