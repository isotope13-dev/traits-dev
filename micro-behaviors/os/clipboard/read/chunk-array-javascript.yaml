          (#any-of? @foreach "forEach" "\"forEach\"" "\"\\u0066\\u006f\\u0072\\u0045\\u0061\\u0063\\u0068\"" "\"\\u0066\\u006F\\u0072\\u0045\\u0061\\u0063\\u0068\"" "'forEach'" "'\\u0066\\u006f\\u0072\\u0045\\u0061\\u0063\\u0068'" "'\\u0066\\u006F\\u0072\\u0045\\u0061\\u0063\\u0068'")
          (#any-of? @map "map" "\"map\"" "\"\\u006d\\u0061\\u0070\"" "\"\\u006D\\u0061\\u0070\"" "'map'" "'\\u006d\\u0061\\u0070'" "'\\u006D\\u0061\\u0070'")
          (#any-of? @join "join" "\"join\"" "\"\\u006a\\u006f\\u0069\\u006e\"" "\"\\u006A\\u006F\\u0069\\u006E\"" "'join'" "'\\u006a\\u006f\\u0069\\u006e'" "'\\u006A\\u006F\\u0069\\u006E'")
