                      object: (identifier) @navigator
                      index: (string) @clipboard) ]
                    property: (property_identifier) @read) (subscript_expression
                    object: [ (member_expression
                      object: (identifier) @navigator
                      property: (property_identifier) @clipboard) (subscript_expression
                      object: (identifier) @navigator
                      index: (string) @clipboard) ]
                    index: (string) @read) ]))))
          (if_statement
            consequence: (statement_block
              (for_statement
                body: (expression_statement
                  (call_expression
                    function: [ (member_expression
                      object: (identifier) @chunks
                      property: (property_identifier) @push) (subscript_expression
                      object: (identifier) @chunks
                      index: (string) @push) ]
                    arguments: (arguments
                      (call_expression
                        function: [ (member_expression
                          object: (identifier) @source
                          property: (property_identifier) @slice) (subscript_expression
                          object: (identifier) @source
                          index: (string) @slice) ])))))
              (expression_statement
                (call_expression
          function: [ (member_expression object: (identifier) @iterated property: (property_identifier) @foreach) (subscript_expression object: (identifier) @iterated index: (string) @foreach) ]
          arguments: (arguments
            (arrow_function
              parameters: (formal_parameters . (identifier) @chunk)
              body: (statement_block
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @url
                    value: (binary_expression
                      right: (call_expression
                        function: [ (member_expression
                          object: (call_expression
                            function: [ (member_expression property: (property_identifier) @map) (subscript_expression index: (string) @map) ]
                            arguments: (arguments
                              (arrow_function
                                body: (binary_expression
                                  right: (call_expression
                                    function: (identifier) @encode
                                    arguments: (arguments .
                                      (ternary_expression
                                        alternative: (ternary_expression
                                          alternative: (ternary_expression
                                            alternative: (identifier) @encoded_chunk)))))))))
                          property: (property_identifier) @join) (subscript_expression
                          object: (call_expression
                            function: [ (member_expression property: (property_identifier) @map) (subscript_expression index: (string) @map) ]
                            arguments: (arguments
                              (arrow_function
                                body: (binary_expression
                                  right: (call_expression
                                    function: (identifier) @encode
                                    arguments: (arguments .
                                      (ternary_expression
                                        alternative: (ternary_expression
                                          alternative: (ternary_expression
                                            alternative: (identifier) @encoded_chunk)))))))))
                          index: (string) @join) ]))))
                (expression_statement
                  [
                    (call_expression
                      function: (member_expression) @fetch
                      arguments: (arguments . (identifier) @sent_url))
                    (call_expression
                      function: (identifier) @fetch
                      arguments: (arguments . (identifier) @sent_url))
                    (call_expression
                      function: [ (member_expression
                        object: (call_expression
                          function: (identifier) @fetch
                          arguments: (arguments . (identifier) @sent_url))) (subscript_expression
                        object: (call_expression
                          function: (identifier) @fetch
                          arguments: (arguments . (identifier) @sent_url))) ])
                  ]))) @sender)))))) @collection
          (#eq? @navigator "navigator")
          (#any-of? @clipboard "clipboard" "\"clipboard\"" "\"\\u0063\\u006c\\u0069\\u0070\\u0062\\u006f\\u0061\\u0072\\u0064\"" "\"\\u0063\\u006C\\u0069\\u0070\\u0062\\u006F\\u0061\\u0072\\u0064\"" "'clipboard'" "'\\u0063\\u006c\\u0069\\u0070\\u0062\\u006f\\u0061\\u0072\\u0064'" "'\\u0063\\u006C\\u0069\\u0070\\u0062\\u006F\\u0061\\u0072\\u0064'")
          (#any-of? @read "readText" "\"readText\"" "\"\\u0072\\u0065\\u0061\\u0064\\u0054\\u0065\\u0078\\u0074\"" "'readText'" "'\\u0072\\u0065\\u0061\\u0064\\u0054\\u0065\\u0078\\u0074'")
          (#any-of? @push "push" "\"push\"" "\"\\u0070\\u0075\\u0073\\u0068\"" "'push'" "'\\u0070\\u0075\\u0073\\u0068'")
          (#any-of? @slice "slice" "\"slice\"" "\"\\u0073\\u006c\\u0069\\u0063\\u0065\"" "\"\\u0073\\u006C\\u0069\\u0063\\u0065\"" "'slice'" "'\\u0073\\u006c\\u0069\\u0063\\u0065'" "'\\u0073\\u006C\\u0069\\u0063\\u0065'")
          (#eq? @clip @source)
