defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
  attack: T1115

traits:
  - id: browser-clipboard-chunk-array
    desc: Clipboard chunks iterated by HTTP callback
    if:
      # Call facts do not preserve loop-carried array pushes. Bind the read
      # variable to the slice receiver in the same surrounding block instead
      # of treating an unrelated string.slice() as clipboard collection.
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @clip
              value: (await_expression
                (call_expression
                  function: (member_expression
                    object: (member_expression
                      object: (identifier) @navigator
                      property: (property_identifier) @clipboard)
                    property: (property_identifier) @read)))))
          (if_statement
            consequence: (statement_block
              (for_statement
                body: (expression_statement
                  (call_expression
                    function: (member_expression
                      object: (identifier) @chunks
                      property: (property_identifier) @push)
                    arguments: (arguments
                      (call_expression
                        function: (member_expression
                          object: (identifier) @source
                          property: (property_identifier) @slice))))))
              (expression_statement
                (call_expression
                  function: (member_expression
                    object: (identifier) @iterated
                    property: (property_identifier) @foreach)
                  arguments: (arguments
                    (arrow_function
                      body: (statement_block
                        (expression_statement
                          [
                            (call_expression function: (_) @send)
                            (call_expression
                              function: (member_expression
                                object: (call_expression function: (_) @send)))
                          ])) @sender))))))) @collection
          (#eq? @navigator "navigator")
          (#eq? @clipboard "clipboard")
          (#eq? @read "readText")
          (#eq? @push "push")
          (#eq? @slice "slice")
          (#eq? @clip @source)
          (#eq? @chunks @iterated)
          (#eq? @foreach "forEach")
          (#match? @send "^(fetch|navigator\\.sendBeacon)$")
          (#match? @sender "encodeURIComponent\\s*\\("))
