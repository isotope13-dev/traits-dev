defaults:
  crit: notable
  platforms: [unix, windows]
  for: [java, class]
traits:
  - id: jvm-clipboard-get-contents-import
    desc: JVM imports Clipboard.getContents
    conf: 0.99
    for: [class]
    if:
      type: import
      exact: java/awt/datatransfer/Clipboard.getContents
composite_rules:
  - id: java-clipboard-get-contents-context
    desc: System clipboard and getContents references cooccur
    conf: 0.92
    all:
      - id: micro-behaviors/os/clipboard/reference::java-awt-system-clipboard
      - id: metadata/lang/source/naming/function::java-getcontents-text
