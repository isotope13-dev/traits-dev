# Command names and source terms are neutral clipboard indicators. Collection
# or theft intent belongs in objective composites that reference these atoms.
defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, python, javascript, c, cpp]
  crit: component
  conf: 0.7
traits:
  - id: str-pasteboard
    desc: Pasteboard string
    platforms: [unix]
    for: [shell, python, javascript, c, cpp]
    if:
      type: text
      substr: pasteboard
      case_insensitive: true
  - id: str-pbcopy
    desc: pbcopy string
    platforms: [unix]
    for: [shell, python, c, cpp]
    if:
      type: text
      substr: pbcopy
      case_insensitive: true
  - id: str-pbpaste
    desc: pbpaste string
    platforms: [unix]
    for: [shell, python, javascript, c, cpp]
    if:
      type: text
      substr: pbpaste
      case_insensitive: true
  - id: str-xclip
    desc: xclip string
    platforms: [unix]
    for: [shell, python, javascript, c, cpp]
    if:
      type: text
      substr: xclip
      case_insensitive: true
  - id: str-xsel
    desc: xsel string
    platforms: [unix]
    for: [shell, python, javascript, c, cpp]
    if:
      type: string_literal
      word: xsel
  - id: str-wl-copy
    desc: wl-copy string
    platforms: [unix]
    for: [shell, python, javascript, c, cpp]
    if:
      type: text
      substr: wl-copy
      case_insensitive: true
  - id: str-wl-paste
    desc: wl-paste string
    platforms: [unix]
    for: [shell, python, javascript, c, cpp]
    if:
      type: text
      substr: wl-paste
      case_insensitive: true

composite_rules:
  - id: clipboard-marker
    desc: Clipboard command or source marker
    crit: baseline
    conf: 0.7
    any:
      - id: micro-behaviors/os/clipboard/access::clipboard-keyword
      - id: str-pasteboard
      - id: str-pbcopy
      - id: str-pbpaste
      - id: str-xclip
      - id: str-xsel
      - id: str-wl-copy
      - id: str-wl-paste
      - id: micro-behaviors/os/clipboard/access::node-pbpaste-read
      - id: micro-behaviors/os/clipboard/access::node-xclip-read
