# macOS Python utilities commonly reach the system clipboard through the
# built-in pbpaste/pbcopy helpers. Require an actual subprocess call shape so
# documentation that merely names the commands does not report access.
defaults:
  platforms: [macos]
  for: [python]
  attack: T1115

traits:
  - id: python-pbpaste-subprocess-read
    desc: Python reads the macOS clipboard through pbpaste
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'subprocess\.(run|Popen|check_output)\s*\(\s*\[\s*["'']pbpaste["'']'

  - id: python-pbcopy-subprocess-write
    desc: Python writes the macOS clipboard through pbcopy
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'subprocess\.(run|Popen|check_call)\s*\(\s*\[\s*["'']pbcopy["'']'
