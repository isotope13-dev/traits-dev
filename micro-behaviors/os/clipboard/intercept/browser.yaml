defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: clipboard-text-method-override
    desc: Overrides clipboard text API methods
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((_ (_ (variable_declarator name: (identifier) @alias
          value: (member_expression
            object: [(identifier) @nav (member_expression property: (property_identifier) @nav)]
            property: (property_identifier) @clip)))
          (expression_statement (assignment_expression
          left: (member_expression object: (identifier) @used
            property: (property_identifier) @method)
          right: [(function_expression) (arrow_function)]))) @hook
          (#eq? @nav "navigator") (#eq? @clip "clipboard")
          (#eq? @alias @used) (#match? @method "^(readText|writeText)$"))
        ((_ (_ (variable_declarator name: (identifier) @alias
          value: (member_expression
            object: [(identifier) @nav (member_expression property: (property_identifier) @nav)]
            property: (property_identifier) @clip)))
          (if_statement consequence: (statement_block (expression_statement (assignment_expression
          left: (member_expression object: (identifier) @used
            property: (property_identifier) @method)
          right: [(function_expression) (arrow_function)]))))) @hook
          (#eq? @nav "navigator") (#eq? @clip "clipboard")
          (#eq? @alias @used) (#match? @method "^(readText|writeText)$"))
  - id: reversed-base64-read-hook
    desc: Encoded clipboard read syntax
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: 'vlGdj5WdmBSPgQHelRFZhVmc|pR3YuVnZg0DI0hXZURWY|u9Wa0Nmb1ZGI9ACd4VGVkFWZ'
  - id: reversed-base64-write-hook
    desc: Encoded clipboard write syntax
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: 'pR3YuVnZg0DI0hXZUVGdpJ3d|u9Wa0Nmb1ZGI9ACd4VGVlRXa|vlGdj5WdmBSPgQHelRVZ0lmc'
  - id: reversed-base64-navigator-hook
    desc: Encoded clipboard navigator syntax
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: 'yF2biBXasNmLy9GdhdWa2Fmb|h9mYwlGbj5icvRXYnlmd|kJXYvJGcpx2YuI3b0F2ZpZXY'
  # Interior Base64 fragments for each of the three byte alignments.
  - id: reversed-base64-clipboard-event-write
    desc: Encoded clipboard event data write
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: 'hRXYERXZz5SY0FGRkJXYvJGcpx2Y|0FGR0V2cuEGdhREZyF2biBXa|hREdlNnLhRXYERmch9mYwlGb'
  - id: reversed-base64-cancel-default
    desc: Encoded browser event cancellation
    crit: notable
    conf: 0.96
    if:
      type: literal
      regex: '1FmZlREduVmdlJHc|0xWdhZWZERnblZXZ|sVXYmVGR05WZ2Vmc'
composite_rules:
  - id: crypto-aware-clipboard-method-override
    desc: Crypto-aware clipboard method overrides
    crit: suspicious
    conf: 0.95
    all:
      - id: clipboard-text-method-override
      - id: micro-behaviors/data/string/replace::callback-retains-unmatched-text
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
      - id: micro-behaviors/data/format/crypto-address::trx-address-regex
      - id: micro-behaviors/os/clipboard/reference::browser-clipboard-api-marker
  - id: encoded-clipboard-method-interposition
    desc: Concealed clipboard API interposition
    crit: suspicious
    conf: 0.98
    all:
      - id: reversed-base64-read-hook
      - id: reversed-base64-write-hook
      - id: reversed-base64-navigator-hook
      - id: micro-behaviors/process/deploy/script-eval/transformed::function-atob-literal
      - id: micro-behaviors/data/string/reverse::literal-split-reverse-join
