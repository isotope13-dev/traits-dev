defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1115
traits:
  - id: browser-clipboard-api-marker
    desc: References a browser clipboard API
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)navigator\.clipboard|clipboardData'

  - id: browser-execcommand-copy
    desc: Browser execCommand clipboard copy
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "document\\.execCommand\\s*\\(\\s*['\"]copy['\"]"
  - id: browser-clipboard-write
    desc: Writes to the browser clipboard
    crit: notable
    conf: 0.92
    if:
      type: symbol
      regex: '(^|\.)(navigator|browser)\.clipboard\.writeText$'
  - id: browser-clipboard-read
    desc: Reads from the browser clipboard
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: navigator.clipboard.readText
  - id: browser-clipboarddata-get
    desc: Reads pasted text through clipboardData
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: "clipboardData\\.getData\\s*\\("
  - id: browser-paste-event-handler
    desc: Registers a browser paste-event handler
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: paste
  - id: browser-execcommand-inserttext
    desc: Inserts text with browser execCommand
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: "document\\.execCommand\\s*\\(\\s*['\"]insertText['\"]"
  - id: browser-obfuscated-execcommand-copy
    desc: Obfuscated browser clipboard copy command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'execCommand.{0,80}99\s*,\s*111\s*,\s*112\s*,\s*121'
  - id: browser-select-before-copy
    desc: Calls select() on a browser element
    crit: component
    conf: 0.78
    if:
      type: symbol
      regex: "\\.select$"
composite_rules:
  - id: browser-clipboard-copy-command
    desc: Browser clipboard copy command
    crit: notable
    conf: 0.92
    any:
      - id: browser-execcommand-copy
      - id: browser-obfuscated-execcommand-copy
  - id: browser-dom-clipboard-copy
    desc: Browser DOM clipboard copy flow
    crit: notable
    conf: 0.9
    all:
      - id: browser-clipboard-copy-command
    any:
      - id: browser-clipboard-write
      - id: browser-select-before-copy
      - id: browser-obfuscated-execcommand-copy
  - id: browser-dom-clipboard-paste
    desc: Handles pasted text with browser clipboard APIs
    crit: notable
    conf: 0.9
    near_bytes: 1024
    all:
      - id: browser-paste-event-handler
    any:
      - id: browser-clipboard-read
      - id: browser-clipboarddata-get
      - id: micro-behaviors/ui/window/data-transfer::browser-data-transfer-text-read
      - id: browser-execcommand-inserttext
