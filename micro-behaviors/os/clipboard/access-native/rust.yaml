defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1115

traits:
  # Rust clipboard providers expose read/write methods with stable operation
  # names even when the provider crate or OS backend changes. Keep the type
  # context separate from the generic text-access calls so a receiver-context
  # composite, rather than a method name alone, establishes clipboard access.
  - id: rust-clipboard-provider-type
    desc: Rust clipboard provider type
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: Clipboard

composite_rules:
  - id: rust-clipboard-read
    desc: Rust reads clipboard text
    crit: notable
    conf: 0.92
    all:
      - id: rust-clipboard-provider-type
      - id: micro-behaviors/data/string/access::rust-text-getter-call

  - id: rust-clipboard-write
    desc: Rust writes clipboard text
    crit: notable
    conf: 0.92
    all:
      - id: rust-clipboard-provider-type
      - id: micro-behaviors/data/string/access::rust-text-setter-call
