defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: tkinter-clipboard-append-func
    desc: clipboard_append function
    conf: 0.9
    unless:
      - id: well-known/lib/stdlib/python-stdlib
    if:
      type: symbol
      exact: "clipboard_append"
  - id: tkinter-clipboard-append-method
    desc: clipboard_append method call
    conf: 0.9
    unless:
      - id: well-known/lib/stdlib/python-stdlib
    if:
      type: symbol
      substr: '.clipboard_append'
  - id: tkinter-clipboard-clear-func
    desc: clipboard_clear function
    conf: 0.9
    unless:
      - id: well-known/lib/stdlib/python-stdlib
    if:
      type: symbol
      exact: "clipboard_clear"
  - id: tkinter-clipboard-clear-method
    desc: clipboard_clear method call
    conf: 0.9
    unless:
      - id: well-known/lib/stdlib/python-stdlib
    if:
      type: symbol
      substr: '.clipboard_clear'
  - id: pyperclip-copy
    desc: Copies text to clipboard (pyperclip)
    conf: 0.9
    if:
      type: symbol
      substr: 'pyperclip.copy'
  - id: pandas-to-clipboard
    desc: pandas DataFrame to_clipboard method
    conf: 0.9
    if:
      # Migrated from a tree-sitter call query to a `kind: call`
      # match on the pre-extracted call fact (no per-member
      # tree-sitter cursor walk; same call-name semantics).
      type: symbol
      kind: call
      regex: '\.to_clipboard$'

composite_rules:
  - id: tkinter-clipboard-append
    desc: Appends text to clipboard (Tkinter)
    conf: 0.9
    any:
      - id: tkinter-clipboard-append-func
      - id: tkinter-clipboard-append-method
  - id: tkinter-clipboard-clear
    desc: Clears clipboard content (Tkinter)
    conf: 0.9
    any:
      - id: tkinter-clipboard-clear-func
      - id: tkinter-clipboard-clear-method
  - id: python-pyperclip-readwrite
    desc: Python reads and writes clipboard with pyperclip
    conf: 0.9
    all:
      - id: micro-behaviors/os/clipboard/read::pyperclip-paste
      - id: pyperclip-copy
  - id: python-tkinter-readwrite
    desc: Python reads and writes clipboard with Tkinter
    conf: 0.9
    all:
      - id: micro-behaviors/os/clipboard/read::tkinter-clipboard-get
      - id: tkinter-clipboard-append
  - id: python-win32clipboard-readwrite
    desc: Python reads and writes the Windows clipboard
    conf: 0.95
    platforms: [windows]
    all:
      - id: micro-behaviors/os/clipboard/read::python-win32-get-clipboard-data
      - id: python-win32-set-clipboard-data
  - id: python-pb-command-readwrite
    desc: Python reads and writes the macOS clipboard through command helpers
    conf: 0.96
    platforms: [macos]
    all:
      - id: micro-behaviors/os/clipboard/read::python-pbpaste-subprocess-read
      - id: micro-behaviors/os/clipboard/write::python-pbcopy-subprocess-write
  - id: python-clipboard-readwrite
    desc: Python reads and writes text clipboard
    conf: 0.9
    any:
      - id: python-pyperclip-readwrite
      - id: python-tkinter-readwrite
      - id: python-win32clipboard-readwrite
      - id: python-pb-command-readwrite
