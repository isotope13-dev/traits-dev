defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1115
traits:
  # The terminal clipboard-write channel: `ESC]52;<selection>;<payload>BEL`
  # sets the system clipboard from inside any TTY program — the mechanism
  # tools use for copy-over-SSH, and the same channel a payload abuses to
  # swap clipboard contents without any clipboard API. Match the escaped
  # spellings source emits (`\x1b`, `\u001b`, `\033`, `\e`) as well as a raw
  # ESC byte. The `[^?]` payload byte keeps the read-back query form
  # (`]52;c;?`) out of a write claim; the linear engine has no lookaround.
  - id: terminal-osc52-write
    desc: Writes clipboard via OSC 52 sequence
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\\x1b|\\u00?0?1b|\\033|\\e|\x1b)\]52;[cps0-9]{0,2};[^?]'
