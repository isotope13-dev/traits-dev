defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: browser-clipboard-write-dom-text
    desc: Copies DOM textContent to the browser clipboard
    if:
      # The call facts do not retain this member-read argument provenance.
      type: tree-sitter
      kind: call
      regex: '^navigator\.clipboard\.writeText\(\w+\.textContent\)$'
