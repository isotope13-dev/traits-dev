defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: browser-regexp-table-clipboard-rewrite
    desc: Clipboard text rewritten by a regex table
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @text
            value: (await_expression (call_expression
              function: (member_expression
                object: (member_expression object: (identifier) @nav_read property: (property_identifier) @clip_read)
                property: (property_identifier) @read)
              arguments: (arguments)))))
          (for_in_statement left: (identifier) @entry
            body: (statement_block
              (lexical_declaration (variable_declarator name: (identifier) @pattern
                value: (new_expression constructor: (identifier) @regexp
                  arguments: (arguments (member_expression object: (identifier) @entry_pattern)))))
              (if_statement condition: (parenthesized_expression (call_expression
                function: (member_expression object: (identifier) @pattern_test property: (property_identifier) @test)
                arguments: (arguments (identifier) @checked)))
                consequence: (statement_block (expression_statement (await_expression
                  (call_expression function: (member_expression
                    object: (member_expression object: (identifier) @nav_write property: (property_identifier) @clip_write)
                    property: (property_identifier) @write)
                    arguments: (arguments (call_expression
                      function: (member_expression object: (identifier) @replaced property: (property_identifier) @replace)
                      arguments: (arguments (identifier) @pattern_replace
                        (member_expression object: (identifier) @entry_replace)))))))))))) @rewrite
          (#eq? @nav_read "navigator") (#eq? @nav_read @nav_write)
          (#eq? @clip_read "clipboard") (#eq? @clip_read @clip_write)
          (#eq? @read "readText") (#eq? @write "writeText")
          (#eq? @entry @entry_pattern) (#eq? @entry @entry_replace)
          (#eq? @regexp "RegExp") (#eq? @pattern @pattern_test)
          (#eq? @pattern @pattern_replace) (#eq? @test "test")
          (#eq? @text @checked) (#eq? @text @replaced) (#eq? @replace "replace"))
