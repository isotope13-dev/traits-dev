defaults:
  platforms: [unix, windows]
  for: [java, class]
  attack: T1115
traits:
  - id: java-clipboard-set-contents
    desc: Java clipboard contents write
    crit: component
    conf: 0.88
    if:
      type: text
      substr: setContents
composite_rules:
  # An editor's copy action writes a selection to the system clipboard
  # (setContents with a ClipboardOwner). Paired with a clipboard read this is
  # user-facing copy/paste support; capture composites suppress on the pair.
  - id: java-clipboard-text-write
    desc: Java writes text to the system clipboard
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/clipboard/access::java-awt-system-clipboard
      - id: java-clipboard-set-contents
