# Command copying and installation instructions can be honest UI.
# These profiles state co-occurrence; they do not resolve a dynamic clipboard value.
defaults:
  for: [html, javascript]
  platforms: [windows, macos, linux]
  crit: notable

composite_rules:
- id: browser-mshta-useragent-run-instructions
  desc: User-Agent test with clipboard MSHTA and Run instructions
  crit: notable
  conf: 0.99
  platforms: [windows]
  scope: leaf
  near_bytes: 1800
  all:
  - id: micro-behaviors/communications/http/user-agent::navigator-useragent-regex-test-branch
  - id: micro-behaviors/ui/help::html-winr-shortcut-instruction
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  - id: metadata/lang/source/syntax/command/invocation::mshta-remote-url-command
- id: browser-shell-mshta-useragent-clipboard
  desc: User-Agent test with clipboard, shell and MSHTA command text
  crit: notable
  conf: 0.995
  scope: leaf
  near_bytes: 2200
  all:
  - id: micro-behaviors/communications/http/user-agent::navigator-useragent-regex-test-branch
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
  - id: metadata/lang/source/syntax/command/invocation::mshta-remote-url-command
- id: browser-shell-terminal-paste-instructions
  desc: Clipboard write with shell pipeline and Terminal paste instructions
  crit: notable
  conf: 0.99
  platforms: [macos]
  for: [html]
  scope: leaf
  near_bytes: 1800
  all:
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  - id: micro-behaviors/ui/help::macos-terminal-command-paste
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
- id: browser-mshta-run-paste-instructions
  desc: Clipboard write with remote MSHTA and Run paste instructions
  all:
  - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
  - id: metadata/lang/source/syntax/command/invocation::mshta-remote-url-command
  - id: micro-behaviors/ui/help::html-winr-shortcut-instruction
  - id: micro-behaviors/ui/help::paste-enter-instruction-generic
  near_bytes: 2400
  crit: notable
  conf: 0.99
  platforms:
  - windows
