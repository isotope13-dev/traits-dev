defaults:
  platforms: [windows, unix]
  for: [html, javascript, text]
traits:
  - id: clipboard-copies-short-literal
    desc: Copies a short literal to clipboard
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'navigator\.clipboard\.writeText\s*\(\s*("[^"\\\r\n]{1,16}"|''[^''\\\r\n]{1,16}'')\s*\)'

