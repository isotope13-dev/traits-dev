# API co-occurrence does not establish clipboard replacement.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: win32-clipboard-readwrite-with-crypto-pattern
    desc: Win32 clipboard APIs with crypto-address patterns
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/clipboard/reference::open-clipboard-text
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
      - id: micro-behaviors/os/clipboard/write::set-clipboard-data-text
      - id: micro-behaviors/data/format/crypto-address/
    unless:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: metadata/lang/compiled::autoit-resource-magic
