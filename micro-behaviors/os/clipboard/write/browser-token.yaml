defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: browser-token-variable-write
    desc: Copies token variable to browser clipboard
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)clipboard\.writeText$'
      arg:
        index: 0
        kind: identifier
        name_regex: '(?i).*(jwt|token).*'
