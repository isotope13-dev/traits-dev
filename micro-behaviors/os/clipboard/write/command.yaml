defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1115
traits:
  - id: pipe-to-clip-command
    desc: Shell pipe to clip command
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\|\s*clip(\.exe)?\b(\s|[&;<>]|$)'

  - id: dotnet-pbcopy-write
    desc: Writes clipboard via pbcopy
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [pe]
    if:
      type: text
      exact: pbcopy

composite_rules:
  - id: clip-exe-write
    desc: Writes clipboard via clip.exe
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/os/clipboard/reference::clip-exe-command-ref
      - id: pipe-to-clip-command

  - id: dotnet-xclip-write
    desc: Writes clipboard via xclip
    crit: notable
    conf: 0.88
    platforms: [unix, windows]
    for: [pe]
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/clipboard/reference::dotnet-xclip-program
      - id: micro-behaviors/process/io/buffer::run-process-input-helper

  - id: dotnet-clip-write
    desc: Writes clipboard via clip
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [pe]
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/clipboard/reference::dotnet-clip-program
      - id: micro-behaviors/process/io/buffer::run-process-input-helper
