defaults:
  for: [c, cpp]
  platforms: [windows]

traits:
  - id: source-regex-match-call
    desc: Native regex-match call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: std::regex_match
  - id: source-set-clipboard-text-call
    desc: Native SetClipboardText call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: SetClipboardText
      arg:
        index: 0
        kind: identifier
        name_regex: '^Address$'
  - id: source-input-differs-address
    desc: Input compared against replacement address
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\binput\s*!=\s*Address\b'

composite_rules:
  - id: source-regex-match-near-clipboard-text
    desc: Regex matching near clipboard text replacement
    crit: notable
    conf: 0.85
    near_lines: 5
    all:
      - id: source-regex-match-call
      - id: source-set-clipboard-text-call
      - id: source-input-differs-address
