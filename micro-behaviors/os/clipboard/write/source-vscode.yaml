# Some editor extensions deliberately copy extracted email addresses to the
# clipboard after a user invokes their command. This is useful analyst context,
# but it is not email-account collection or evidence of covert exfiltration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1114,T1115

traits:
  - id: email-list-clipboard-write
    desc: Copies extracted emails to clipboard
    crit: notable
    conf: 0.96
    attack: T1115
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writeText$'
      arg:
        index: 0
        kind: identifier
        name_regex: '(?i).*(email|address).*(list|all|unique|set|result|item)?'
