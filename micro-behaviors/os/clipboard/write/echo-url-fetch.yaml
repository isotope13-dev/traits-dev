# The same clipboard string announces a URL, then fetches a substituted URL.
# Neither a status message nor a copy button alone is a deception finding.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: clipboard-echo-url-substituted-curl
    desc: Copies URL announcement then substituted curl
    if:
      type: text
      regex: 'writeText\([''"]echo [''"][^''"\n]{0,96}https?://[^''"\n]{1,99}[''"] && curl -s \$\('
