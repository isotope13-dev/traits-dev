# Bind the copied value to a helper that selects a replacement from a table
# under a regex match. Names of the helper, variables and tables are arbitrary.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-matched-table-clipboard-overwrite
    desc: Clipboard loop writes matched table values
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment
            left: (identifier) @table
            right: (dictionary (pair value: (string) @destination))))
          (function_definition
            name: (identifier) @helper
            parameters: (parameters (identifier) @value)
            body: (block
              (for_statement
                left: (pattern_list (identifier) @rx (identifier) @chain)
                right: (identifier)
                body: (block
                  (if_statement
                    condition: (call
                      function: (attribute object: (identifier) @rx_use attribute: (identifier) @match)
                      arguments: (argument_list (call
                        function: (attribute object: (identifier) @value_use attribute: (identifier) @strip)
                        arguments: (argument_list))))
                    consequence: (block (return_statement
                      (subscript value: (identifier) @table_use subscript: (identifier) @chain_use))))))))
          (function_definition body: (block
            (while_statement body: (block
              (expression_statement (assignment
                left: (identifier) @current
                right: (boolean_operator left: (call
                  function: (attribute object: (identifier) @reader attribute: (identifier) @paste)
                  arguments: (argument_list)))))
              (if_statement consequence: (block
                (expression_statement (assignment
                  left: (identifier) @replacement
                  right: (call function: (identifier) @helper_use
                    arguments: (argument_list (identifier) @current_use))))
                (if_statement consequence: (block
                  (expression_statement (call
                    function: (attribute object: (identifier) @writer attribute: (identifier) @copy)
                    arguments: (argument_list (identifier) @replacement_use)))))))))))) @overwrite
          (#eq? @table @table_use)
          (#match? @destination "0x[a-fA-F0-9]{40}|T[1-9A-HJ-NP-Za-km-z]{33}|[13][a-km-zA-HJ-NP-Z1-9]{25,34}")
          (#eq? @helper @helper_use) (#eq? @value @value_use)
          (#eq? @rx @rx_use) (#eq? @chain @chain_use)
          (#eq? @current @current_use) (#eq? @replacement @replacement_use)
          (#match? @match "^(fullmatch|match|search)$") (#eq? @strip "strip")
          (#match? @reader "^(pyperclip|clipboard)$") (#eq? @reader @writer)
          (#eq? @paste "paste") (#eq? @copy "copy"))
