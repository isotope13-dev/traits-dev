defaults:
  crit: notable
  for: [javascript, typescript, html]
  platforms: [macos, unix, windows]

composite_rules:
  - id: browser-clipboard-write-near-base64-decode
    desc: Browser clipboard write occurs near Base64 decoding
    conf: 0.95
    all:
      - id: browser-clipboard-write
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
    near_bytes: 768
