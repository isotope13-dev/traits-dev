defaults:
  platforms:
    - windows
  for:
    - pe
    - rust
    - c
    - cpp
traits:
  - id: set-clipboard-data
    desc: Write data to clipboard
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: SetClipboardData
  - id: empty-clipboard
    desc: Clear clipboard contents
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: EmptyClipboard
  - id: set-clipboard-data-text
    desc: SetClipboardData named, not imported
    crit: notable
    conf: 0.78
    for: [binaries, source]
    if:
      type: text
      word: SetClipboardData
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: set-clipboard-data
  # `for:` also covers archive/data so the same observation survives inside
  # carriers cleave cannot descend (ISO-9660 images) -- that is what
  # metadata/file/format/iso::iso-getclipboarddata used to do from a
  # file-format metadata path, where it reported as an ISO fact. The source
  # types are spelled out rather than using the `source` group so the list
  # stays under the type cap; a Win32 clipboard call only appears in the
  # languages that bind to user32 directly.
  - id: empty-clipboard-text
    desc: EmptyClipboard named, not imported
    crit: notable
    conf: 0.74
    for: [binaries, source]
    if:
      type: text
      word: EmptyClipboard
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: empty-clipboard
  - id: python-win32-set-clipboard-data
    desc: Python writes Windows clipboard
    crit: notable
    conf: 0.82
    for: [python]
    if:
      type: symbol
      kind: call
      exact: win32clipboard.SetClipboardData
  - id: python-win32-empty-clipboard
    desc: Python clears Windows clipboard
    crit: notable
    conf: 0.78
    for: [python]
    if:
      type: symbol
      kind: call
      exact: win32clipboard.EmptyClipboard
  - id: dotnet-clipboard-settext-helper
    desc: Managed clipboard write helper
    crit: notable
    conf: 0.78
    if:
      type: text
      word: ClipboardSetText
  # `CopyToClipboard` is nobody's framework API — the .NET BCL spells it
  # `Clipboard.SetText` — it is the name developers give their own helper in
  # every language, so the `dotnet-` id and "Managed" description asserted a
  # runtime the matcher never checked. It matched a Rust TUI's
  # `ViewEvent::CopyToClipboard` enum variant. Renamed and re-described for
  # what it is: a clipboard-write helper identifier, still notable because the
  # identifier does name a real clipboard write.
  - id: copy-to-clipboard-helper-identifier
    desc: Copy-to-clipboard helper identifier
    crit: notable
    conf: 0.76
    if:
      type: text
      word: CopyToClipboard
composite_rules:
  - id: dotnet-clipboard-read-write-helper
    desc: .NET clipboard read/write helpers
    crit: notable
    conf: 0.82
    any:
      - id: micro-behaviors/os/clipboard/read::dotnet-clipboard-gettext-helper
      - id: dotnet-clipboard-settext-helper
