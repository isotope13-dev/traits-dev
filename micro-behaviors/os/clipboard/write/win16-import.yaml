defaults:
  platforms: [windows]
  for: [ne]
  crit: notable
  conf: 0.95
traits:
  - id: win16-empty-clipboard-import
    desc: Imports Win16 clipboard-clear API
    if:
      type: symbol
      kind: import
      exact: EmptyClipboard
  - id: win16-set-clipboard-import
    desc: Imports Win16 clipboard-data API
    if:
      type: symbol
      kind: import
      exact: SetClipboardData
