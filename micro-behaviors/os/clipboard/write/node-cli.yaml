defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1115
traits:
  - id: node-pbcopy-write
    desc: Writes clipboard via pbcopy
    crit: notable
    conf: 0.9
    if:
      type: literal
      substr: pbcopy
    not:
      - substr: "pbcopy/xclip"
      - substr: "xclip/pbcopy"
  - id: node-xclip-write
    desc: Writes clipboard via xclip
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: 'xclip\s+-selection\s+clipboard'
    not:
      - regex: '(-o|-out|--out)'
      - substr: "pbcopy/xclip"
      - substr: "xclip/pbcopy"
  - id: node-set-clipboard-write
    desc: Writes clipboard via Set-Clipboard
    crit: notable
    conf: 0.95
    if:
      type: literal
      substr: Set-Clipboard
composite_rules:
  - id: node-cli-clipboard-write
    desc: Writes clipboard via CLI helper
    crit: notable
    conf: 0.9
    any:
      - id: node-pbcopy-write
      - id: node-xclip-write
      - id: node-set-clipboard-write
  - id: node-cli-clipboard-readwrite
    desc: Reads and writes clipboard via CLI helpers
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/clipboard/read::node-cli-clipboard-read
      - id: node-cli-clipboard-write
