defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1115

traits:
  - id: clipboard-enabled-config-field
    desc: Clipboard collection enabled field
    if:
      type: text
      word: clipboardEnabled

composite_rules:
  - id: javascript-clipboard-polling
    desc: JavaScript polls clipboard contents on a timer
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/clipboard/read::browser-clipboard-read
    any:
      - id: micro-behaviors/time/schedule/interval::setInterval
  # Clipboard managers poll on a fixed tick. Randomising the period (and the
  # back-off between reads) only serves to break the regular request cadence
  # that network and behavioural monitors key on -- the clipper/stealer shape.
  - id: jittered-clipboard-polling
    desc: Polls the clipboard on a randomized timer
    crit: suspicious
    conf: 0.9
    attack: T1115,T1029
    scope: file
    near_bytes: 2048
    all:
      - id: javascript-clipboard-polling
    any:
      - id: micro-behaviors/time/schedule/interval::timer-random-period-argument
      - id: micro-behaviors/time/schedule/interval::jittered-timeout-delay
      - id: micro-behaviors/time/schedule/delay::settimeout-random-delay

