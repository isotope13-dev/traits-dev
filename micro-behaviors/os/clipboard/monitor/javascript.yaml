defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1115

traits:
  - id: clipboard-enabled-config-field
    desc: Clipboard collection enabled field
    crit: notable
    conf: 0.9
    if:
      type: text
      word: clipboardEnabled

composite_rules:
  # Polling is a neutral clipboard capability. Collection, manipulation, and
  # exfiltration composites add their own intent-specific evidence.
  - id: javascript-clipboard-polling
    desc: JavaScript polls clipboard contents on a timer
    crit: notable
    conf: 0.9
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-read
    any:
      - id: micro-behaviors/time/schedule/interval::setInterval
