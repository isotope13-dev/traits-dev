defaults:
  platforms:
    - windows
  for:
    - pe
    - rust
    - c
    - cpp
traits:
  - id: clipboard-sequence-number
    desc: Poll clipboard change counter
    crit: notable
    conf: 0.85
    attack: T1115
    if:
      type: symbol
      exact: GetClipboardSequenceNumber
  - id: add-clipboard-format-listener-reference
    desc: References AddClipboardFormatListener API
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      exact: AddClipboardFormatListener
  - id: macos-pasteboard-change-count
    desc: Reads macOS pasteboard change count
    crit: notable
    conf: 0.8
    for:
      - macho
    platforms:
      - macos
    if:
      type: text
      substr: changeCount
