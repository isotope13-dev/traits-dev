defaults:
  platforms:
    - windows
  for:
    - pe
    - rust
    - c
    - cpp
traits:
  - id: clipboard-sequence-number
    desc: Poll clipboard change counter
    crit: notable
    conf: 0.85
    attack: T1115
    if:
      type: symbol
      exact: GetClipboardSequenceNumber
  - id: dotnet-add-clipboard-listener
    desc: Adds clipboard format listener (P/Invoke)
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    platforms:
      - unix
      - windows
    if:
      type: text
      exact: AddClipboardFormatListener
  - id: hwnd-message-const
    desc: HWND_MESSAGE constant
    crit: notable
    if:
      type: text
      regex: IntPtr\(-3\)|HWND_MESSAGE
  - id: macos-pasteboard-change-count
    desc: Reads macOS pasteboard change count
    crit: notable
    conf: 0.8
    for:
      - macho
    platforms:
      - macos
    if:
      type: text
      substr: changeCount
composite_rules:
  - id: dotnet-set-parent-message
    for: [pe]
    desc: Sets parent to HWND_MESSAGE for invisible window
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/control::set-parent-api
      - id: hwnd-message-const
