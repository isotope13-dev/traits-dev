defaults:
  platforms: [windows]
  for: [powershell, scripts, source]
composite_rules:
  - id: powershell-loop-clipboard-read
    desc: PowerShell clipboard read-loop with sleep
    crit: notable
    conf: 0.95
    attack: T1115
    all:
      - id: micro-behaviors/os/clipboard/read::source-winforms-clipboard-gettext
      - id: micro-behaviors/data/control-flow/loop::embedded-powershell-while-true
      - id: micro-behaviors/time/sleep/interval::ps-tight-ms-sleep
