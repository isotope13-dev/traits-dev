defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1115

traits:
  # Rust clipboard providers expose read/write methods with stable operation
  # names even when the provider crate or OS backend changes. Keep the type
  # context separate from the method calls so objective rules can require both
  # sides of a replacement flow without keying on one crate.
  - id: rust-clipboard-provider-type
    desc: Rust clipboard provider type
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: Clipboard

  - id: rust-clipboard-read-call
    desc: Rust clipboard text read method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)((get_text)|(get_contents))$'

  - id: rust-clipboard-write-call
    desc: Rust clipboard text write method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)((set_text)|(set_contents))$'

composite_rules:
  - id: rust-clipboard-read
    desc: Rust reads clipboard text
    crit: notable
    conf: 0.92
    all:
      - id: rust-clipboard-provider-type
      - id: rust-clipboard-read-call

  - id: rust-clipboard-write
    desc: Rust writes clipboard text
    crit: notable
    conf: 0.92
    all:
      - id: rust-clipboard-provider-type
      - id: rust-clipboard-write-call
