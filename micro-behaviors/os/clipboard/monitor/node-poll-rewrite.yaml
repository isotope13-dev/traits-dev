# A Node timer callback that reads the clipboard through a clipboard module
# (clipboardy-style read()/write()) and, later in the same callback,
# writes the clipboard again: a poll-and-replace loop over copied text.
# Clipboard history managers read on a timer but do not write back.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1115

traits:
  - id: node-interval-clipboard-read-rewrite
    desc: Node timer polls and rewrites clipboard
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'setInterval\([\s\S]{0,80}clipboardy?\.read\(\)[\s\S]{0,300}clipboardy?\.write\(\w'
