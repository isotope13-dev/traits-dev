defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1115
traits:
  - id: browser-clipboard-state-tracking
    desc: Tracks changes to awaited clipboard text
    crit: notable
    conf: 0.97
    if:
      # Bind the awaited read, comparison, and saved value. Variable names
      # such as lastClipboard alone establish neither a read nor tracking.
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @current
              value: (await_expression
                (call_expression
                  function: [
                    (member_expression
                      object: [
                        (member_expression object: (identifier) @nav
                          property: (property_identifier) @clip)
                        (subscript_expression object: (identifier) @nav
                          index: (string) @clip)]
                      property: (property_identifier) @read)
                    (subscript_expression
                      object: [
                        (member_expression object: (identifier) @nav
                          property: (property_identifier) @clip)
                        (subscript_expression object: (identifier) @nav
                          index: (string) @clip)]
                      index: (string) @read)]))))
          (if_statement
            condition: (parenthesized_expression
              (binary_expression
                left: (identifier) @nonempty
                operator: "&&"
                right: (binary_expression
                  left: (identifier) @compared
                  operator: "!=="
                  right: (identifier) @previous)))
            consequence: (statement_block
              (expression_statement
                (assignment_expression
                  left: (identifier) @saved
                  right: (identifier) @value))))) @tracking
          (#eq? @nav "navigator")
          (#any-of? @clip "clipboard" "\"clipboard\"" "'clipboard'" "'\\u0063\\u006C\\u0069\\u0070\\u0062\\u006F\\u0061\\u0072\\u0064'" "\"\\u0063\\u006C\\u0069\\u0070\\u0062\\u006F\\u0061\\u0072\\u0064\"" "'\\u0063\\u006c\\u0069\\u0070\\u0062\\u006f\\u0061\\u0072\\u0064'" "\"\\u0063\\u006c\\u0069\\u0070\\u0062\\u006f\\u0061\\u0072\\u0064\"")
          (#any-of? @read "readText" "\"readText\"" "'readText'" "'\\u0072\\u0065\\u0061\\u0064\\u0054\\u0065\\u0078\\u0074'" "\"\\u0072\\u0065\\u0061\\u0064\\u0054\\u0065\\u0078\\u0074\"")
          (#eq? @current @nonempty)
          (#eq? @current @compared)
          (#eq? @current @value)
          (#eq? @previous @saved))
