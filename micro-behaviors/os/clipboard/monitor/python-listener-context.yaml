defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-win32-format-listener-monitor
    desc: Win32 clipboard listener with data reads
    conf: 0.94
    # A listener plus GetClipboardData proves continuous clipboard access, but
    # not theft: clipboard managers, automation frameworks, and accessibility
    # tools implement this exact mechanism. Keep the observable behavior
    # analyst-visible; elevate only when a separate rule proves misuse.
    crit: notable
    platforms: [windows]
    all:
      - id: micro-behaviors/os/clipboard/monitor::python-add-clipboard-format-listener
      - id: micro-behaviors/os/clipboard/read::python-get-clipboard-data-call
      - id: micro-behaviors/os/clipboard/monitor::python-get-message-call
  - id: python-clipboard-save-with-keyboard-listener
    desc: Clipboard saving alongside keyboard listener
    conf: 0.98
    crit: notable
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-listener-constructor
      - id: micro-behaviors/os/clipboard/monitor::python-start-clipboard-watcher
      - id: micro-behaviors/os/clipboard/read::python-clipboard-data-read
      - id: micro-behaviors/os/clipboard/read::python-save-clipboard-files-or-images
