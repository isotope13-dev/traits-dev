# API co-occurrence establishes a monitoring capability, not theft.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: windows-clipboard-read-monitor-api-set
    desc: Clipboard read and change-monitoring APIs
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
    any:
      - id: micro-behaviors/os/clipboard/monitor::clipboard-sequence-number
      - id: micro-behaviors/os/clipboard/monitor::add-clipboard-format-listener-reference
