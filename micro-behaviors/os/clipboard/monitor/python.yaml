defaults:
  platforms: [windows]
  for: [python]
  attack: T1115
  crit: notable
  conf: 0.9

traits:
  - id: python-clipboard-polling-loop
    desc: Python polls clipboard contents in a loop
    crit: notable
    conf: 0.8
    platforms: [unix, windows]
    if:
      type: text
      regex: while.{0,50}clipboard|clipboard.{0,50}while

  - id: python-add-clipboard-format-listener
    desc: Python registers a Win32 clipboard listener
    if:
      type: symbol
      kind: call
      regex: '(^|\.)AddClipboardFormatListener$'
  - id: python-get-message-call
    desc: Python receives Win32 window messages
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetMessageW$'
  - id: python-start-clipboard-watcher
    desc: Starts a Python background clipboard watcher
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)start_clipboard$'
