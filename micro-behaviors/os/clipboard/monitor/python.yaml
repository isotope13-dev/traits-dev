defaults:
  platforms: [windows]
  for: [python]
  attack: T1115
  crit: notable
  conf: 0.9

traits:
  # Polling is a neutral clipboard capability.  Collection/exfiltration
  # composites add the intent-specific network or theft context.
  - id: python-clipboard-polling-loop
    desc: Python polls clipboard contents in a loop
    crit: notable
    conf: 0.8
    platforms: [unix, windows]
    if:
      type: text
      regex: while.{0,50}clipboard|clipboard.{0,50}while

  - id: python-add-clipboard-format-listener
    desc: Python registers a Win32 clipboard listener
    if:
      type: symbol
      kind: call
      regex: '(^|\.)AddClipboardFormatListener$'
  - id: python-get-clipboard-data-call
    desc: Python reads Win32 clipboard data
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetClipboardData$'
  - id: python-get-message-call
    desc: Python receives Win32 window messages
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetMessageW$'
