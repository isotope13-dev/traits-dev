defaults:
  platforms: [windows]
  for: [pe]

traits:
  # PyInstaller records imported Python modules in its appended PYZ table.
  # The closing parenthesis is part of that table representation and keeps a
  # generic prose mention of "clipboard" from becoming clipboard access.
  - id: clipboard-module
    desc: PyInstaller archive bundles clipboard module
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: clipboard)
