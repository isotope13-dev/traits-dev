defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1115
traits:
  - id: browser-clipboard-read-name
    desc: Clipboard readText method name
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      exact: readText
  - id: browser-clipboard-write-name
    desc: Clipboard writeText method name
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      exact: writeText
  - id: browser-computed-navigator-call
    desc: Computed navigator method call
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bnavigator\s*\[.{0,80}\]\s*\[.{0,80}\]\s*\('
  - id: browser-computed-clipboard-member-call
    desc: Computed browser clipboard member call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bnavigator\s*\[.{0,80}\bclipboard\b.{0,80}\]\s*\[.{0,80}\]\s*\('
  - id: browser-clipboard-state-tracking
    desc: Tracks previously read clipboard content
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\b(last|previous|old)[A-Za-z_$]{0,40}[Cc]lipboard[A-Za-z_$]{0,40}\b'
composite_rules:
  - id: browser-computed-clipboard-read
    desc: Obfuscated browser clipboard read
    crit: notable
    conf: 0.94
    all:
      - id: browser-clipboard-read-name
      - id: browser-computed-navigator-call
