defaults:
  platforms:
    - windows
  for:
    - pe
    - rust
    - c
    - cpp
traits:
  - id: clipboard-keyword
    desc: Clipboard keyword
    crit: notable
    conf: 0.7
    platforms: [unix, windows]
    for: [pe, class, shell, python, javascript, java, csharp, powershell]
    if:
      type: text
      substr: clipboard
      case_insensitive: true
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: open-clipboard
    desc: Open clipboard access
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: OpenClipboard
  - id: close-clipboard
    desc: Close clipboard
    crit: notable
    conf: 0.65
    if:
      type: symbol
      exact: CloseClipboard
  - id: is-clipboard-format-available
    desc: Check clipboard format availability
    crit: notable
    conf: 0.78
    if:
      type: symbol
      exact: IsClipboardFormatAvailable
  - id: register-clipboard-format-a
    desc: Register custom clipboard format
    crit: notable
    conf: 0.78
    if:
      type: symbol
      exact: RegisterClipboardFormatA
  - id: register-clipboard-format-w
    desc: Register custom clipboard format
    crit: notable
    conf: 0.78
    if:
      type: symbol
      exact: RegisterClipboardFormatW
  - id: open-clipboard-text
    desc: OpenClipboard named, not imported
    crit: notable
    conf: 0.74
    for: [binaries, source]
    if:
      type: text
      word: OpenClipboard
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: open-clipboard
  - id: close-clipboard-text
    desc: CloseClipboard named, not imported
    crit: notable
    conf: 0.7
    for: [binaries, source]
    if:
      type: text
      word: CloseClipboard
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: close-clipboard
  # These three text atoms each establish a complete clipboard data operation
  # on their own, exactly as their symbol-matched siblings above do; the text
  # spelling only exists to cover binaries whose imports cleave cannot resolve
  # and source that declares the API. They are notable for the same reason the
  # symbol forms are -- being legs of win32-clipboard-access is not a reason to
  # demote a standalone behavior to a fragment.
  - id: python-import-win32clipboard
    desc: Python win32clipboard import
    crit: notable
    conf: 0.72
    for: [python]
    if:
      type: text
      substr: import win32clipboard
  - id: python-win32-open-clipboard
    desc: Python opens Windows clipboard
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: symbol
      kind: call
      exact: win32clipboard.OpenClipboard
  - id: unicode-text-format
    desc: Unicode clipboard text format constant
    crit: notable
    conf: 0.76
    for: [source]
    if:
      type: text
      word: CF_UNICODETEXT
  - id: macos-nspasteboard-class
    desc: NSPasteboard class reference
    crit: notable
    conf: 0.8
    for:
      - macho
    platforms:
      - macos
    if:
      type: text
      substr: NSPasteboard
  - id: macos-general-pasteboard
    desc: generalPasteboard reference
    crit: notable
    conf: 0.8
    for:
      - macho
    platforms:
      - macos
    if:
      type: text
      substr: generalPasteboard
  - id: dotnet-clipboard-class
    desc: Qualified .NET Clipboard API reference
    crit: notable
    conf: 0.85
    for:
      - pe
      - csharp
    if:
      type: text
      regex: 'System\.Windows\.Forms\.Clipboard|System\.Windows\.Clipboard'
    not:
      - substr: ClipboardFormat
      - substr: AddClipboardFormatListener
      - substr: RegisterClipboardFormat
      - substr: EmptyClipboard
      - substr: OpenClipboard
      - substr: CloseClipboard
      - substr: SetClipboardData
      - substr: GetClipboardData
      # MFC AppWizard resource strings (benign UI text)
      - substr: on the Clipboard
      - substr: to the Clipboard
      - substr: clipboard format
      - substr: Clipboard does not support
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::winforms-ui
        - id: objectives/anti-static/pack/detect::enigma-protector

composite_rules:
  - id: macos-nspasteboard-access
    desc: Accesses macOS NSPasteboard
    crit: notable
    conf: 0.8
    for:
      - macho
    platforms:
      - macos
    any:
      - id: macos-nspasteboard-class
      - id: macos-general-pasteboard
    unless:
      - id: well-known/lib/vendor-sdk/sogen/
      - id: well-known/tool/development/agent/codewhale::codewhale-application-context
  - id: register-clipboard-format
    desc: Custom clipboard format registration
    crit: notable
    conf: 0.78
    any:
      - id: register-clipboard-format-a
      - id: register-clipboard-format-w
  - id: win32-clipboard-access
    desc: Win32 clipboard access
    crit: notable
    conf: 0.82
    for: [binaries, source]
    all:
      - id: open-clipboard-text
    any:
      - id: micro-behaviors/os/clipboard/write::set-clipboard-data-text
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data-text
      - id: micro-behaviors/os/clipboard/write::empty-clipboard-text
