defaults:
  platforms: [unix, windows]
  for: [class, jar, zip]
  attack: T1115

traits:
  - id: java-xclip-utility-reference
    desc: Java bytecode references xclip utility
    crit: notable
    conf: 0.92
    platforms: [linux]
    for: [class]
    if:
      type: text
      substr: xclip
  - id: java-dataflavor-class
    desc: Java clipboard DataFlavor class
    crit: notable
    conf: 0.88
    for: [class]
    if:
      type: text
      substr: java/awt/datatransfer/DataFlavor

composite_rules:
  - id: java-clipboard-dataflavor-references
    desc: Java clipboard and DataFlavor API references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/clipboard/reference::java-awt-system-clipboard
      - id: java-dataflavor-class
    unless:
      - id: well-known/app/media/plantuml::vscode-extension-member
      - id: well-known/app/media/plantuml::jar-member
      - id: well-known/app/media/plantuml::clipboard-loop-class
      - id: well-known/lib/stdlib/hutool::hutool-core-library
      - id: well-known/lib/stdlib/hutool::hutool-core-class-member
      - id: well-known/tool/development/vscode-extension/redhat-java/
  - id: java-clipboard-xclip-references
    desc: Java clipboard and xclip utility references
    crit: notable
    conf: 0.96
    all:
      - id: java-clipboard-dataflavor-references
      - id: java-xclip-utility-reference
