# Clipboard utility and cmdlet names in script text. A name alone does not
# show a read or write; clipper composites pair it with a rewrite operation.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, shell]
  attack: T1115
traits:
  - id: unix-clipboard-utility-name
    desc: Unix clipboard utility name
    crit: component
    conf: 0.8
    if:
      type: text
      regex: (?i)\b(pbpaste|pbcopy|xclip|xsel)\b
  - id: windows-clipboard-command-name
    desc: Windows clipboard command or cmdlet name
    crit: component
    conf: 0.8
    if:
      type: text
      regex: (?i)\b(clip\.exe|get-clipboard|set-clipboard)\b
