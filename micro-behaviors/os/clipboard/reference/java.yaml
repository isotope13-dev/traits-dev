defaults:
  crit: notable
  platforms: [unix, windows]
  for: [java, class]
  attack: T1115
traits:
  - id: java-swing-popup-menu-reference
    desc: Java Swing popup menu class
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: javax/swing/JPopupMenu
  - id: java-paste-menu-label
    desc: Paste menu label text
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: Paste
  - id: java-text-component-reference
    desc: Java Swing text component reference
    conf: 0.9
    if:
      type: text
      substr: javax/swing/text/JTextComponent
  - id: java-paste-token-reference
    desc: Java paste identifier token
    conf: 0.9
    if:
      type: text
      substr: paste
  - id: java-awt-system-clipboard
    desc: Java AWT system clipboard access
    conf: 0.9
    if:
      type: text
      substr: getSystemClipboard
  - id: java-string-data-flavor
    desc: Java string clipboard flavor
    conf: 0.86
    if:
      type: text
      substr: stringFlavor
