defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1115
traits:
  - id: clip-exe-command-ref
    desc: clip.exe command reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(^|[\s"`''&;<>])clip\.exe(\s|[&;<>]|$)'
    unless:
      - type: text
        substr: clip.exe /?
  - id: dotnet-xclip-program
    desc: .NET xclip program token
    crit: notable
    conf: 0.78
    platforms: [unix, windows]
    for: [pe]
    if:
      type: text
      exact: xclip

  - id: dotnet-clip-program
    desc: .NET clip program token
    crit: component
    conf: 0.8
    platforms: [unix, windows]
    for: [pe]
    if:
      type: text
      exact: clip

