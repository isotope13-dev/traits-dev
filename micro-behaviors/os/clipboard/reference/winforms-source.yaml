# An explicit WinForms assembly load in otherwise non-.NET code is useful
# runtime context for clipboard APIs embedded in cross-language packages.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: winforms-assembly-reference
    desc: Code references Windows Forms assembly
    if:
      type: text
      substr: System.Windows.Forms

