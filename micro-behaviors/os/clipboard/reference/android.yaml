defaults:
  platforms: [android]
  for: [android_apk]
  crit: notable
  conf: 0.86
  attack: T1115

traits:
  - id: clipboard-manager
    desc: Android ClipboardManager reference
    if:
      type: text
      substr: "Landroid/content/ClipboardManager;"

  - id: clip-data
    desc: Android ClipData reference
    if:
      type: text
      substr: "Landroid/content/ClipData;"

  - id: android-clipboard-manager-import
    desc: Imports Android ClipboardManager
    for: [java, class]
    conf: 0.84
    if:
      type: symbol
      kind: import
      exact: android.content.ClipboardManager
