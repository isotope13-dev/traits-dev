defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.8
traits:
- id: dotnet-clipboard-type-token
  desc: Standalone Clipboard type-name token
  if:
    type: text
    exact: Clipboard
composite_rules:
- id: dotnet-clipboard-text-read-write-members
  desc: .NET Clipboard type with GetText and SetText members
  crit: notable
  conf: 0.8
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: dotnet-clipboard-type-token
  - id: metadata/binary/symbols/name::dotnet-gettext-member-name
  - id: metadata/binary/symbols/name::dotnet-settext-member-name
