defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.8
traits:
  - id: dotnet-clipboard-type-token
    desc: Standalone Clipboard type-name token
    if:
      type: text
      exact: Clipboard
  - id: dotnet-gettext-member-token
    desc: Standalone GetText member-name token
    if:
      type: text
      exact: GetText
  - id: dotnet-settext-member-token
    desc: Standalone SetText member-name token
    if:
      type: text
      exact: SetText
composite_rules:
  - id: dotnet-clipboard-text-read-write-members
    desc: .NET Clipboard type with GetText and SetText members
    crit: notable
    conf: 0.8
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-clipboard-type-token
      - id: dotnet-gettext-member-token
      - id: dotnet-settext-member-token
