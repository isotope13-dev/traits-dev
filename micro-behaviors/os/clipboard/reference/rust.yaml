defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1115
traits:
  - id: rust-xclip-command
    desc: Rust invokes xclip clipboard
    crit: notable
    conf: 0.85
    # Command names are quoted literals. Bare xclip identifiers and comments
    # name the AutoCAD XCLIP frame, not the clipboard tool.
    if:
      type: text
      regex: '"xclip[" ]'
