# Browser clipboard writeText() in page or extension scripts. Shared by HTML
# InstallFix/ClickFix lures and standalone .js delivery scripts.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1115

traits:
  - id: browser-html-clipboard-write
    desc: Script writes text to browser clipboard
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(navigator|browser)\.clipboard\.writeText\s*\('
