# WebExtension-only clipboard surface (`browser.clipboard`), available to
# add-ons holding the clipboardWrite permission. It writes image bytes rather
# than text, so the navigator.clipboard.writeText matchers never see it —
# an extension that plants attacker-supplied image data on the clipboard
# otherwise shows only its declared permission and no behaviour at all.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1115

traits:
  - id: webextension-clipboard-set-image
    desc: Writes image data to the clipboard
    crit: notable
    conf: 0.92
    if:
      type: symbol
      regex: '(^|\.)clipboard\.setImageData$'
