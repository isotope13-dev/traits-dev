defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: browser-copy-cut-event-handler
    desc: Registers browser copy or cut handler
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        regex: '^(copy|cut)$'

