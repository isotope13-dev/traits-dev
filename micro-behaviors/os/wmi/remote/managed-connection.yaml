# System.Management ConnectionOptions carries the username, password and
# impersonation level for a ManagementScope; local WMI queries never need
# one, so it marks a connection to another host's WMI service.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1047

traits:
  - id: managed-wmi-connection-options
    desc: Managed WMI connection credential options
    crit: notable
    conf: 0.85
    if:
      type: text
      word: ConnectionOptions

  - id: managed-wmi-management-scope
    desc: Managed WMI ManagementScope type name
    crit: notable
    conf: 0.85
    if:
      type: text
      word: ManagementScope
