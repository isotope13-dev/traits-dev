# SWbemLocator.ConnectServer called with a host, a namespace literal and
# separate user and password arguments: WMI on another machine is opened
# under explicitly supplied credentials.
defaults:
  platforms: [windows]
  for: [vbs, html, javascript]
  attack: T1047

traits:
  - id: swbemlocator-connectserver-with-credentials
    desc: Opens remote WMI with supplied credentials
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.ConnectServer\s*\(\s*\w+\s*,\s*"root[\\/]\w+"\s*,\s*\w+\s*,\s*\w+\s*\)'
