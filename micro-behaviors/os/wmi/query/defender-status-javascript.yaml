# Defender's MSFT_MpComputerStatus WMI class reports protection state and,
# through its IsVirtualMachine property, whether the host is a VM. Node code
# reaches it through native WMI modules such as @intelcorp/wmi-native-module.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  attack: T1518.001

traits:
  - id: defender-computer-status-class
    desc: References Defender MSFT_MpComputerStatus class
    conf: 0.95
    if:
      type: text
      word: MSFT_MpComputerStatus

  - id: defender-isvirtualmachine-property
    desc: References Defender IsVirtualMachine property
    conf: 0.9
    if:
      type: text
      word: IsVirtualMachine
