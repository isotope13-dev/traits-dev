composite_rules:
- id: wmi-moniker-or-swbemlocator-reference
  desc: Winmgmts moniker or SWbemLocator references
  conf: 0.7
  for:
  - scripts
  - binaries
  any:
  - id: micro-behaviors/os/wmi/query::wmi-moniker-string
  - id: micro-behaviors/os/wmi/query::swbemlocator-progid-text-reference
traits:
- conf: 0.8
  for:
  - javascript
  - vbs
  - html
  id: swbemlocator-progid-text-reference
  desc: SWbemLocator ProgID string reference
  if:
    type: string_literal
    substr: WbemScripting.SWbemLocator
defaults:
  platforms:
  - windows
  crit: notable
