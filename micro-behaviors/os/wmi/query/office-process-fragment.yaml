# The old document-dropper atom matched this substring, including AHK code.
# Preserve its original scope and matcher; it establishes neither VBA nor spawn.
defaults:
  platforms: [windows]
  for: [documents, vbs, ooxml, oledoc]
traits:
  - id: win32-process-class-fragment
    desc: Win32_Process WMI class-name fragment
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Win32_Process
