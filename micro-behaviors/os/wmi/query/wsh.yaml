defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.9

traits:
- id: wmi-process-create-call
  desc: Win32_Process Get result invokes Create
  crit: notable
  conf: 0.96
  attack: T1047
  for: [javascript, vbs]
  if:
    type: text
    # Require the specific process class in the Get(...).Create(...) chain;
    # generic service locators such as injector.get(...).create() are not WMI.
    regex: '(?i)\.\s*Get\s*\(\s*["\x27]Win32_Process["\x27]\s*\)\s*\.\s*Create\s*\('

- id: wmi-spawninstance-fragmented-access
  desc: Fragmented WMI SpawnInstance member access
  crit: notable
  conf: 0.96
  attack: T1047
  for: [javascript, vbs]
  if:
    type: text
    regex: '(?i)\(\s*["'']Sp["'']\s*\+\s*["'']awn["'']\s*\)\s*\+\s*\(\s*["'']Inst["'']\s*\+\s*["'']ance'

- id: wmi-process-startup-instance
  desc: WMI process-startup object instance
  crit: notable
  conf: 0.94
  attack: T1047
  for: [javascript, vbs]
  if:
    type: text
    regex: '(?i)\bSpawnInstance_\s*\(\s*\)'

- id: wmi-showwindow-zero-variable
  desc: WMI startup ShowWindow set to zero
  crit: notable
  conf: 0.84
  for: [javascript, vbs]
  attack: T1047
  if:
    type: tree-sitter
    # Bind the zero-valued local and startup object to the assignment; mere
    # file-wide proximity would not establish the hidden setting.
    query: |
      (program
        (variable_declaration
          (variable_declarator
            name: (identifier) @startup_name
            value: (call_expression
              function: (member_expression property: (property_identifier) @spawn_method))))
        (variable_declaration
          (variable_declarator name: (identifier) @zero_name value: (number) @zero_value))
        (expression_statement
          (assignment_expression
            left: (member_expression
              object: (identifier) @startup_target
              property: (property_identifier) @property)
            right: (identifier) @assigned))
        (#eq? @zero_value "0")
        (#eq? @spawn_method "SpawnInstance_")
        (#eq? @startup_name @startup_target)
        (#eq? @property "ShowWindow")
        (#eq? @zero_name @assigned))

- id: wmi-execmethod-invocation
  desc: WMI ExecMethod dispatch call
  crit: notable
  conf: 0.92
  attack: T1047
  for: [javascript, vbs]
  if:
    type: text
    regex: '(?i)\bExecMethod_?\s*\('

- id: wmi-impersonation-moniker
  desc: WMI moniker requests impersonation
  if:
    type: text
    substr: 'impersonationLevel=impersonate'

composite_rules:
- id: wmi-hidden-process-create
  desc: WSH creates a hidden process through WMI
  crit: suspicious
  conf: 0.97
  attack: T1564.003,T1047
  for: [javascript, vbs]
  # Obfuscators can insert a long reconstructed class name between the
  # startup instance and Create call; the composite still requires both WMI
  # startup markers and the hidden-window setting.
  near_bytes: 20000
  all:
  - id: wmi-process-create-call
  - id: micro-behaviors/process/create/hidden::wmi-hidden-process-startup
