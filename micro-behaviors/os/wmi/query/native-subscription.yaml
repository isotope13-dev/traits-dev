defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
traits:
  - id: native-commandline-consumer-class
    desc: WMI command-line consumer class reference
    if:
      type: text
      substr: CommandLineEventConsumer
  - id: native-filter-consumer-binding-class
    desc: WMI filter-consumer binding class reference
    if:
      type: text
      substr: __FilterToConsumerBinding
  - id: native-command-line-template-property
    desc: WMI command consumer template property reference
    if:
      type: text
      substr: CommandLineTemplate
  - id: native-event-filter-class
    desc: WMI event filter class reference
    if:
      type: text
      substr: __EventFilter
  - id: native-subscription-namespace
    desc: WMI permanent subscription namespace reference
    if:
      type: text
      substr: 'root\subscription'
  - id: native-wmi-command-consumer-sequence
    desc: WMI command consumer construction sequence
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\[wmiclass\].{0,300}__EventFilter.{0,600}CommandLineEventConsumer'
