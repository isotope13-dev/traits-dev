defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
traits:
  - id: native-commandline-consumer-class
    desc: WMI command-line consumer class reference
    if:
      type: text
      section: .rdata
      exact: CommandLineEventConsumer
  - id: native-filter-consumer-binding-class
    desc: WMI filter-consumer binding class reference
    if:
      type: text
      section: .rdata
      exact: __FilterToConsumerBinding
  - id: native-command-line-template-property
    desc: WMI command consumer template property reference
    if:
      type: text
      section: .rdata
      exact: CommandLineTemplate
