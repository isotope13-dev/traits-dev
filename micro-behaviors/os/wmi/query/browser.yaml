# WMI query strings embedded in browser-facing code. A page cannot execute
# WMI directly, but these queries are meaningful when sent to a local helper
# through a browser-to-loopback bridge.
defaults:
  platforms: [windows]
  for: [javascript, typescript, html]

traits:
  - id: browser-wql-query
    desc: Browser script contains a WMI WQL query
    crit: notable
    conf: 0.9
    attack: T1082
    if:
      type: text
      regex: '(?i)\bSELECT\s+[^;\r\n]{1,180}\s+FROM\s+Win32_[A-Za-z0-9_]+'
