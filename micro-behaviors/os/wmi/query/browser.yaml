# Win32-class WQL literals also occur in Windows Script Host programs.
defaults:
  platforms: [windows]
  for: [javascript, typescript, html]

traits:
  - id: win32-wql-query
    desc: Script contains a Win32-class WQL query
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSELECT\s+[^;\r\n]{1,180}\s+FROM\s+Win32_[A-Za-z0-9_]+'
