defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
traits:
  - id: shadowcopy-cmdlet-query
    desc: WMI/CIM query for a shadow-copy object
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)\b(Get-WmiObject|Get-CimInstance)\b.{0,240}\bWin32_Shadowcopy\b'
  - id: shadowcopy-class-reference
    desc: Win32_Shadowcopy WMI class
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bWin32_Shadowcopy\b'
