defaults:
  platforms: [windows]
  for: [javascript, vbs]
  crit: notable
  conf: 0.95
traits:
  - id: wmi-notification-query-call
    desc: Subscribes to WMI event notifications
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ExecNotificationQuery$'
  - id: wmi-next-event-call
    desc: Waits for a WMI subscription event
    if:
      type: symbol
      kind: call
      regex: '\.NextEvent$'
