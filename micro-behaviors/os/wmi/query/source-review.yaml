# Neutral observations relocated from attack and product-identity rules.
traits:
- platforms:
  - windows
  for:
  - powershell
  - batch
  id: get-wmiobject-remote-process
  desc: Queries Win32_Process with ComputerName
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\bGet-WmiObject\b[^\n]{0,160}\bWin32_Process\b[^\n]{0,160}[ \t]-ComputerName\b
