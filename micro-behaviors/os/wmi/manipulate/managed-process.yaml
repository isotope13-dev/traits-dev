defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: managed-wmi-process-method-api-profile
    desc: Managed WMI process-create API references
    crit: notable
    conf: 0.94
    # The matcher sees WMI class/method/parameter references without binding
    # InvokeMethod to Create. Keep this at the WMI interface, rather than
    # claiming a process-launch call, remote execution or a bypass.
    if:
      type: yara
      source: |
        import "pe"
        rule managed_wmi_process_create_api_profile {
          strings:
            $class = "Win32_Process" wide fullword
            $method = "Create" wide fullword
            $argument = "CommandLine" wide fullword
            $object = "ManagementObject\x00"
            $parameters = "GetMethodParameters\x00"
            $invoke = "InvokeMethod\x00"
          condition:
            for any s in pe.sections : (
              s.name == ".text" and
              for all of them : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              )
            )
        }
