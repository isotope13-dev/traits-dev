defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: powershell-wmi-process-class-argument
  desc: WMI Win32_Process class argument
  if:
    type: text
    substr: Class = 'Win32_Process'
- id: powershell-wmi-create-method-argument
  desc: WMI Create method argument
  if:
    type: text
    substr: Name = 'Create'
composite_rules:
- id: powershell-wmi-process-create-argument-map
  desc: WMI process-creation argument map
  all:
  - id: powershell-wmi-process-class-argument
  - id: powershell-wmi-create-method-argument
