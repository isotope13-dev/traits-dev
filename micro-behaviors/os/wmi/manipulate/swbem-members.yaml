# SWbem object-model member names as they appear in compiled string tables
# (`@Methods_`). Neutral; com-wmi-process-create in objectives/execution/wmi
# pairs them with the Win32_Process and CommandLine strings. The bare `@Create`
# and `@Value` alternatives were dropped: every .NET string table has them.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.86
traits:
- id: swbem-methods-member
  desc: SWbem Methods_ member name
  if:
    type: text
    substr: '@Methods_'
- id: swbem-spawninstance-member
  desc: SWbem InParameters or SpawnInstance_ member
  if:
    type: text
    regex: '@(InParameters|SpawnInstance_)'
- id: swbem-properties-member
  desc: SWbem Properties_ member name
  if:
    type: text
    substr: '@Properties_'
