defaults:
  platforms: [windows]
  conf: 0.9
  for: [powershell, batch, vbs]
traits:
  - id: modify-service-wmi
    desc: Modifies service via WMI Change
    crit: suspicious
    attack: "T1543.003"
    if:
      type: text
      regex: 'Win32_Service.{0,100}Change'
      case_insensitive: true
  - id: start-service-wmi
    desc: Starts service via WMI StartService
    crit: notable
    attack: "T1543.003"
    if:
      type: text
      regex: 'Win32_Service.{0,100}StartService'
      case_insensitive: true
  # The WQL query and the method call it feeds are always separated by the
  # `For Each ... In` loop header, so these two windows span lines where
  # start-service-wmi above only needs the single-line PowerShell spelling.
  - id: stop-service-wmi
    desc: Stops a service via WMI StopService
    crit: notable
    attack: "T1489"
    if:
      type: text
      regex: '(?i)Win32_Service[\s\S]{0,320}\.StopService\b'
  - id: terminate-process-wmi
    desc: Kills a process via WMI Win32_Process Terminate
    crit: notable
    attack: "T1047"
    if:
      type: text
      regex: '(?i)Win32_Process[\s\S]{0,300}\.Terminate\s*\('
  - id: modify-registry-wmi
    desc: Modifies registry via WMI StdRegProv
    crit: suspicious
    attack: "T1112"
    if:
      type: text
      regex: 'StdRegProv.{0,100}Set.{0,50}Value'
      case_insensitive: true
