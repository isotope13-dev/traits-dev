defaults:
  platforms: [windows]
  conf: 0.9
  for: [powershell, batch, vbs]
traits:
  - id: modify-service-wmi
    desc: Modifies service via WMI Change
    crit: suspicious
    attack: "T1543.003"
    if:
      type: text
      regex: 'Win32_Service.{0,100}Change'
      case_insensitive: true
    unless:
      # Completion/parser tests keep command lines as inert string literals.
      - id: metadata/package/testing/
  - id: start-service-wmi
    desc: Starts service via WMI StartService
    crit: notable
    attack: "T1543.003"
    if:
      type: text
      regex: 'Win32_Service.{0,100}StartService'
      case_insensitive: true
  # The WQL query and the method call it feeds are always separated by the
  # `For Each ... In` loop header, so these two windows span lines where
  # start-service-wmi above only needs the single-line PowerShell spelling.
  - id: stop-service-wmi
    desc: Stops a service via WMI StopService
    crit: notable
    attack: "T1489"
    if:
      type: text
      regex: '(?i)Win32_Service[\s\S]{0,320}\.StopService\b'
  - id: terminate-process-wmi
    desc: Kills a process via WMI Win32_Process Terminate
    crit: notable
    attack: "T1047"
    if:
      type: text
      regex: '(?i)Win32_Process[\s\S]{0,300}\.Terminate\s*\('

  # Win32_Process.Create is the WMI process-execution primitive and the
  # canonical spelling of "run this command", locally or -- with -ComputerName
  # or a remote moniker -- on another host. It is equally the documented admin
  # path (Microsoft's own remoting examples) and ATT&CK T1047, so the atoms stay
  # neutral capabilities here; the objectives under objectives/execution/wmi/
  # and objectives/lateral-movement/ add the remote target and the attack
  # context. Defined once so the three objective directories that used to carry
  # their own copy of this regex now reference a single fact.
  - id: create-process-wmi-cmdlet
    desc: Invoke-WmiMethod creates a Win32_Process
    crit: notable
    conf: 0.96
    attack: "T1047"
    for: [powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bInvoke-WmiMethod\b[^\r\n]{0,220}\bWin32_Process\b[^\r\n]{0,90}Create'

  - id: create-process-cim-cmdlet
    desc: Invoke-CimMethod creates a Win32_Process
    crit: notable
    conf: 0.96
    attack: "T1047"
    for: [powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bInvoke-CimMethod\b[^\r\n]{0,220}\bWin32_Process\b[^\r\n]{0,90}Create'
    unless:
      # Ansible's win_command/psexec modules build a Win32_Process call from a
      # ProcessStartupInformation object; that is the module, not an attacker.
      - type: text
        substr: 'ProcessStartupInformation = $psi'
      - id: metadata/file/profile/identity::ansible-python-package-path
      - id: metadata/file/profile/identity::ansible-powershell-context
  - id: modify-registry-wmi
    desc: Modifies registry via WMI StdRegProv
    crit: suspicious
    attack: "T1112"
    if:
      type: text
      regex: 'StdRegProv.{0,100}Set.{0,50}Value'
      case_insensitive: true
