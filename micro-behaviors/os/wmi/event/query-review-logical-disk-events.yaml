defaults:
  for: [pe, dll, csharp, powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: wmi-logical-disk-event-filter
    desc: WMI event filter targets logical disks
    if:
      type: text
      regex: '(?i)TargetInstance\s+ISA\s+["'']Win32_LogicalDisk["'']'
  - id: wmi-instance-creation-event
    desc: WMI instance-creation event class reference
    if:
      type: text
      exact: __InstanceCreationEvent
