defaults:
  platforms: [windows]
  for: [javascript, vbs]
  crit: notable
  conf: 0.95
traits:
  - id: wmi-notification-query-call
    desc: Subscribes to WMI event notifications
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ExecNotificationQuery$'
  - id: wmi-next-event-call
    desc: Waits for a WMI subscription event
    if:
      type: symbol
      kind: call
      regex: '\.NextEvent$'
  - id: wmi-local-time-notification-query
    desc: WMI event query targets local time
    # Clock-change subscriptions can pace a script without WScript.Sleep.
    # This is an event-query capability, not persistence or anti-analysis.
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ExecNotificationQuery$'
      arg:
        index: 0
        kind: string
        regex: '(?i)\bTargetInstance\s+ISA\s+[\x27"]Win32_LocalTime[\x27"]'
