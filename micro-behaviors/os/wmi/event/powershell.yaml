# Construction of subscription objects; the relationship is evaluated separately.
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs]
traits:
  - id: set-wmiinstance-eventfilter
    desc: Set-WmiInstance creates __EventFilter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)Set-WmiInstance\b[^\n]{0,200}__EventFilter
  - id: set-wmiinstance-commandline-consumer
    desc: "Set-WmiInstance CommandLineEventConsumer"
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)Set-WmiInstance\b[^\n]{0,200}CommandLineEventConsumer
  - id: set-wmiinstance-filter-binding
    desc: "Set-WmiInstance __FilterToConsumerBinding"
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)Set-WmiInstance\b[^\n]{0,200}__FilterToConsumerBinding
composite_rules:
  - id: command-consumer-process-start-query
    for: [powershell, vbs]
    desc: WMI command consumer and process-start query
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/wmi/query::process-start-trace-class-name
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-commandline-consumer
    any:
      - id: micro-behaviors/os/wmi/query::subscription-namespace
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-filter-binding
