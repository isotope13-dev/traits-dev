# Construction of subscription objects; the relationship is evaluated separately.
defaults:
  platforms: [windows]
  for: [go, powershell, batch, vbs]
traits:
  - id: wmi-instance-write-api
    desc: WMI instance creation or commit API
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(Set-WmiInstance|New-CimInstance)|__FilterToConsumerBinding.{0,130}\.Put_?\('
  - id: subscription-spawn-and-commit
    desc: WMI instance is spawned and committed
    crit: notable
    conf: 0.95
    for: [vbs, powershell]
    if:
      type: text
      regex: '(?is)SpawnInstance_\s*\(\s*\).{0,120}\.Put_?\s*\('
  - id: set-wmiinstance-eventfilter
    desc: Set-WmiInstance creates __EventFilter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)Set-WmiInstance\b[^\n]{0,200}__EventFilter
  - id: set-wmiinstance-commandline-consumer
    desc: "Set-WmiInstance CommandLineEventConsumer"
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)Set-WmiInstance\b[^\n]{0,200}CommandLineEventConsumer
  - id: set-wmiinstance-filter-binding
    desc: "Set-WmiInstance __FilterToConsumerBinding"
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)Set-WmiInstance\b[^\n]{0,200}__FilterToConsumerBinding
  - id: wmic-instance-create
    desc: WMIC creates a WMI class instance
    crit: notable
    conf: 0.97
    for: [powershell, batch]
    if:
      type: text
      regex: '(?im)^\s*wmic\s+[^\r\n]{0,70}\bPATH\s+\w+\s+CREATE\b'
composite_rules:
  - id: command-consumer-process-start-query
    for: [powershell, vbs]
    desc: WMI command consumer and process-start query
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/wmi/event::process-start-trace-class-name
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-commandline-consumer
    any:
      - id: micro-behaviors/os/wmi/event::subscription-namespace
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-filter-binding
