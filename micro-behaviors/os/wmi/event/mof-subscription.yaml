# Managed Object Format source declaring permanent WMI event subscription
# objects. mofcomp (or an autocompiled MOF drop) registers them; WMI then runs
# the consumer as LocalSystem whenever the filter fires. Filefacts types MOF
# source as plain text.
defaults:
  platforms: [windows]
  for: [text, vbs]
  crit: notable
  conf: 0.93
  attack: T1546.003

traits:
  - id: mof-event-filter-instance
    desc: MOF declares a WMI event filter
    if:
      type: text
      regex: '(?i)\binstance\s+of\s+__EventFilter\b'

  - id: mof-script-consumer-instance
    desc: MOF declares a script or command consumer
    if:
      type: text
      regex: '(?i)\binstance\s+of\s+(ActiveScript|CommandLine)EventConsumer\b'

  - id: mof-filter-consumer-binding-instance
    desc: MOF binds WMI filter to consumer
    if:
      type: text
      regex: '(?i)\binstance\s+of\s+__FilterToConsumerBinding\b'
