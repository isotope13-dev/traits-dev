# Event class references do not establish startup or permanent persistence.
defaults:
  platforms: [windows]
  for: [go, powershell, vbs]
  crit: notable
  conf: 0.9
traits:
  - id: instance-modification-event-class-name
    desc: WMI instance-modification event class reference
    if:
      type: literal
      word: __InstanceModificationEvent
  - id: process-start-trace-class-name
    desc: WMI process-start trace class reference
    if:
      type: literal
      word: Win32_ProcessStartTrace
  - id: interval-timer-instruction-class-name
    desc: WMI interval-timer instruction class reference
    for: [go]
    conf: 0.8
    if:
      type: literal
      word: __IntervalTimerInstruction
