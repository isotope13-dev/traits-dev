defaults:
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- for:
  - dos_com
  - static-lib
  - data
  id: dos-ivt-int21-set-direct
  desc: IVT offset and segment store instruction bytes
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: C7 06 84 00 ?? ?? 8C ?? 86 00
- for:
  - dos_com
  - static-lib
  - data
  id: dos-int21-exec-intercept
  desc: DOS exec-service test and branch bytes
  crit: notable
  conf: 0.88
  if:
    type: hex
    # CMP AX,4B00h and CMP AH,4Bh compare the exec service. SUB AX,4B00h
    # is the same equality test when the handler also clears AX.
    pattern: (3D 00 4B|2D 00 4B|80 FC 4B|FE C4 80 FC 4C [0-6]) (74|75)
- for:
  - dos_com
  - static-lib
  - data
  id: dos-int21-set-vector-ah
  desc: DOS vector-service load and interrupt bytes
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: B4 25 [0-8] CD 21
- for:
  - dos_com
  - static-lib
  - data
  id: dos-ivt-int21-store
  desc: DOS stores a handler in the IVT
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: 89 ?? 84 00 [0-4] 8C ?? 86 00
- for:
  - dos_com
  - static-lib
  - data
  id: dos-ivt-int21-store-seg-imm
  desc: DOS stores IVT handler segment first
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: (8C|89) ?? 86 00 [0-4] C7 06 84 00
- for:
  - dos_com
  - static-lib
  - data
  id: dos-ivt-int21-swap-bx
  desc: DOS swaps INT 21h vector via BX
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: BB 84 00 (C4|C5) ?? [0-8] C7 07 ?? ?? (89|8C) ?? 02
- for:
  - dos_com
  - static-lib
  id: dos-ivt-int21-swap-imm
  desc: DOS swaps IVT INT 21h vector
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: (C4|C5) ?? 84 00 [0-32] C7 06 84 00
- for:
  - dos_com
  - static-lib
  id: dos-ivt-int21-swap-reg
  desc: DOS swaps INT 21h vector via register
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: (C4|C5) ?? 84 00 [0-32] (89|8C) ?? 84 00
- for:
  - dos_com
  - static-lib
  - data
  id: dos-set-int21-vector
  desc: DOS INT21 handler installation service sequence
  crit: suspicious
  conf: 0.93
  if:
    type: hex
    pattern: B8 21 25 [0-8] CD 21
composite_rules:
- for:
  - dos_com
  - static-lib
  - data
  - text
  id: dos-ivt-int21-swap
  desc: IVT INT21 access and store instruction sequences
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-swap-imm
  - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-swap-reg
  - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-swap-bx
  - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-store
  - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-store-seg-imm
  - id: micro-behaviors/os/msdos/interrupt::ivt-int21-store-imm
- for:
  - dos_com
  - static-lib
  - data
  id: dos-set-int21-call
  desc: DOS vector-service setup or IVT store bytes
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-vector
  - id: micro-behaviors/os/msdos/interrupt::dos-int21-set-vector-ah
  - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-set-direct
