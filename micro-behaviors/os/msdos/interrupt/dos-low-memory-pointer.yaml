defaults:
  for:
  - data
  - dos_com
  - static-lib
  platforms:
  - windows
  - unix
  size_max: 8192
traits:
- id: dos-zero-segment-pointer-swap-copy
  desc: Copies and swaps low-memory far pointer
  crit: notable
  conf: 0.99
  if:
    type: hex
    pattern: BE ?? ?? FC 6A 00 1F 83 7C 02 FF 74 ?? A5 A5 89 44 FC 8C 44 FE
    offset_range:
    - 0
    - 8192
