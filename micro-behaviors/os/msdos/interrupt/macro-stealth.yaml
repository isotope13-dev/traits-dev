# MASM macros that invoke DOS interrupts without an INT mnemonic.
#
# DOS virus sources ship include files defining int86/int21h wrapper macros
# whose bodies emit the call as raw db bytes (0EDh sequences) instead of an
# `int` instruction, so opcode-signature scanners keyed on CD 86 / CD 21 see
# no interrupt call. The same kits emit invalid-opcode bytes (0F FF = UD0)
# from breaker-named macros to trip up emulators and disassemblers.
defaults:
  platforms: [windows, unix]
  for: [text]
traits:
  - id: int-macro-wrapper
    desc: MASM macro wraps INT 86h/21h call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bint(86|21h)\s+macro\b'
  - id: raw-opcode-db-emission
    desc: Macro emits raw EDh bytes via db
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdb\s+0edh\s*,\s*0(fd|ed)h'
  - id: invalid-opcode-macro-bytes
    desc: Macro emits UD0 invalid-opcode bytes
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?is)\bmacro\b[\s\S]{0,200}?\bdb\s+0fh\s*,\s*0ffh'
