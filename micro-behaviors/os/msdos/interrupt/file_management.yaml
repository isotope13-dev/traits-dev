defaults:
  platforms: [unix, windows]
  for: [dos_com, data, c]
traits:
  # Write service loaded (AH=40h) followed almost immediately by a
  # conditional short branch (Jcc rel8) with a small negative displacement:
  # the body repeats its file operation instead of falling through. The
  # -32..-1 window covers tight destroyer loops; copy loops share the shape,
  # so this is only a leg for looping destroyer/infector composites.
  # High bytes also match the sanitizer replacement (EF BF BD), which is how
  # they appear once a C-typed body has been through UTF-8 cleanup.
  - id: int21-write-loop-branch
    desc: DOS loops back after a write setup
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "(B4|EF BF BD) 40 [0-3] (70|71|72|73|74|75|76|77|78|79|7A|7B|7C|7D|7E|7F) (E0|E1|E2|E3|E4|E5|E6|E7|E8|E9|EA|EB|EC|ED|EE|EF|F0|F1|F2|F3|F4|F5|F6|F7|F8|F9|FA|FB|FC|FD|FE|FF|EF BF BD)"
