defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  size_max: 65536

traits:
  - id: dos-memory-004c-exchange
    desc: DOS exchanges a word at offset 004Ch
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: '87 06 4C 00'

  - id: dos-zero-ds-near-004c-exchange
    desc: DOS zeroes DS near 004Ch exchange
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: '33 C0 8E D8 [0-128] 87 06 4C 00'

composite_rules:
  - id: dos-004c-exchange-file-write
    desc: DOS 004Ch exchange and file-write code
    crit: notable
    conf: 0.9
    all:
      - id: dos-memory-004c-exchange
      - id: micro-behaviors/fs/write/file/handle/int21::dos-write-dispatch
