traits:
- platforms:
  - windows
  - unix
  for:
  - dos_com
  - static-lib
  - data
  size_max: 65536
  id: dos-ah40-private-interrupt
  desc: AH40 before a non-INT21 interrupt
  crit: notable
  conf: 0.92
  if:
    type: hex
    # Only straight-line register setup may separate AH=40h from INT.
    # An arbitrary gap can cross INT 21h and mistake an EB CD branch
    # displacement plus the next data byte for another interrupt.
    pattern: B4 40 (BA ?? ?? B9 ?? ??|B9 ?? ?? BA ?? ??|B1 ?? BA ?? ??|BA ?? ?? B1 ??|BA ?? ??|B9 ?? ??|B1 ??|8B D6|8B D5|8B D7|99|90) CD ~21
