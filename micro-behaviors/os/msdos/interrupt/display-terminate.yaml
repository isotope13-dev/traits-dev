# Neutral real-mode DOS service idioms in raw COM images (and untyped dumps
# of one): printing a $-terminated string (AH=09h) and leaving via INT 20h.
# These establish console output and clean exit only. Infection, residency,
# and destructive behavior live in objectives/impact/... and require their
# own file, interrupt, or disk evidence.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-display-string
    desc: DOS display-string call (INT 21h AH=09h)
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 09 [0-32] CD 21"
    unless:
      - type: hex
        pattern: "4D 53 57 49 4D 00 00 00"
        offset: 0

  # Tiny COM programs commonly invoke one last DOS service and fall through
  # to INT 20h. The adjacent pair clears the 3-concrete-byte floor while
  # staying a single exit idiom, not a claim about which service ran.
  - id: dos-terminate-after-service
    desc: DOS program terminate after service call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "CD 21 CD 20"
