# Neutral real-mode DOS service idioms in raw COM images (and untyped dumps
# of one): printing a $-terminated string (AH=09h) and leaving via INT 20h.
# These establish console output and clean exit only. Infection, residency,
# and destructive behavior live in objectives/impact/... and require their
# own file, interrupt, or disk evidence.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-display-string
    desc: DOS display-string call (INT 21h AH=09h)
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 09 [0-32] CD 21"
    unless:
      - type: hex
        pattern: "4D 53 57 49 4D 00 00 00"
        offset: 0

  # Tiny COM programs commonly invoke one last DOS service and fall through
  # to INT 20h. The adjacent pair clears the 3-concrete-byte floor while
  # staying a single exit idiom, not a claim about which service ran.
  - id: dos-terminate-after-service
    desc: DOS program terminate after service call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "CD 21 CD 20"

  - id: dos-terminate-process
    desc: DOS program exit with return code
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4C [0-8] CD 21"

  # INT 21h AH=00h is the original terminate-program service; a tiny COM
  # image ends with it where later code uses AH=4Ch.
  - id: dos-terminate-ah00
    desc: DOS program terminate via AH=00h
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "B4 00 CD 21"

  # INT 19h reloads the boot sector and restarts the machine. Following a
  # BIOS disk service directly, it leaves the system to reboot from whatever
  # the disk call just changed. Written as YARA so the sequence is evaluated
  # on images under the engine's size floor.
  - id: dos-reboot-after-bios-disk-call
    desc: DOS reboots after BIOS disk call
    crit: notable
    conf: 0.88
    if:
      type: yara
      source: |
        rule dos_reboot_after_bios_disk_call {
          meta:
            filetypes = "dos_com,data"
          strings:
            $reboot = { CD 13 CD 19 }
          condition:
            $reboot in (0..512)
        }

  # MOV AX,4C00h / INT 21h: terminate with return code 0 loaded as one word.
  - id: dos-terminate-ax4c00
    desc: DOS program terminate via AX=4C00h
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B8 00 4C CD 21"
