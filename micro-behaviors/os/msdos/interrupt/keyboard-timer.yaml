defaults:
  platforms: [windows, unix]
  for: [dos_com]
  crit: notable
  conf: 0.95
traits:
  - id: dos-int09-vector-get-then-set
    desc: Saves and replaces keyboard interrupt vector
    if:
      type: hex
      pattern: >-
        (B4 35 B0 09 CD 21 2E 89 1E ?? ?? 2E 8C 06 ?? ?? B4 25 B0 09 0E 1F BA ?? ?? CD 21|B8 09 35 CD 21 89 1E ?? ?? 8C 06 ?? ?? B8 09 25 BA ?? ?? CD 21)
  - id: dos-int08-vector-get-then-set
    desc: Saves and replaces timer interrupt vector
    if:
      type: hex
      pattern: >-
        B4 35 B0 08 CD 21 2E 89 1E ?? ?? 2E 8C 06 ?? ??
        B4 25 B0 08 0E 1F BA ?? ?? CD 21
  - id: dos-timer-divided-chain
    desc: Timer handler periodically chains saved vector
    if:
      type: hex
      pattern: >-
        2E FE 0E ?? ?? 75 ?? 2E C6 06 ?? ?? ??
        58 9D 9C 2E FF 1E ?? ?? CF B0 20 E6 20 58 9D CF
  - id: dos-int1c-ax-vector-get-then-set
    desc: Timer vector read and set sequences
    if:
      type: hex
      pattern: 'B8 1C 35 CD 21 89 1E ?? ?? 8C 06 ?? ?? B8 1C 25 BA ?? ?? CD 21'
  - id: dos-int24-vector-get-then-set
    for: [dos_com, static-lib, data]
    desc: Saves and replaces DOS INT 24h vector
    if:
      type: hex
      pattern: >-
        (B8 24 35|B4 35 B0 24) CD 21 [0-2]
        (89 1E ?? ?? [0-2] 8C 06 ?? ??|8C 06 ?? ?? [0-2] 89 1E ?? ??)
        [0-4] (B4 25|B8 24 25) [0-4] BA ?? ?? CD 21
