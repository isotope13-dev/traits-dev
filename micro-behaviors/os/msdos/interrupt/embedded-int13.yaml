# Real-mode instructions embedded in a Windows driver's writable data.
# Match the IVT slot for INT 13h, rather than a filename or build address.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: embedded-int13-vector-replacement
    desc: Embedded INT 13h vector save/replacement
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .data
      # Save the offset:segment dword at IVT+0x4c, install a new offset,
      # then write ES as the handler segment at IVT+0x4e.
      pattern: '66 8B 47 4C 67 66 26 A3 ?? ?? ?? ?? C7 47 4C ?? ?? 8C 47 4E'
