# Generic DOS interrupt-vector and file services also occur in benign TSRs.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-get-int21-vector
    desc: DOS reads the INT 21h vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 'B8 21 35 [0-8] CD 21'

composite_rules:
  - id: dos-vector-and-file-service-sequences
    desc: DOS vector, file-write or search sequences
    crit: suspicious
    conf: 0.95
    all:
      - id: dos-get-int21-vector
      - id: micro-behaviors/os/msdos/interrupt::dos-set-int21-call
    any:
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-call
      - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
    needs: 1
