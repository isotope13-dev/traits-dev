# LES DI,[000Ah] loads the PSP terminate address, the parent's return point.
# DEC DI / MOV AL,imm8 / STOSB then rewrites the byte just before it, which
# is the interrupt number of the parent's INT instruction. The sequence
# redirects the parent's next call without touching the vector table.
# Written as YARA so the sequence is evaluated on images under the engine's
# size floor.
traits:
  - id: dos-psp-return-address-byte-patch
    desc: DOS patches byte before PSP return address
    crit: suspicious
    conf: 0.93
    platforms: [windows, unix]
    for: [dos_com, data]
    size_max: 4096
    if:
      type: yara
      source: |
        rule dos_psp_return_address_byte_patch {
          meta:
            filetypes = "dos_com,data"
          strings:
            $patch = { C4 3E 0A 00 4F B0 ?? AA }
          condition:
            $patch in (0..512)
        }
