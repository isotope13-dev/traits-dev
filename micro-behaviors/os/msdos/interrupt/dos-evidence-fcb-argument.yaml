defaults:
  platforms:
  - windows
  - unix
  for:
  - dos_com
  - data
  size_max: 65536

traits:
  - id: dos-set-dta-from-si
    desc: DOS sets DTA from SI
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "B4 1A 8B D6 CD 21"
      offset_range: [0, 16]

  - id: dos-fcb-open-command-line-file
    desc: DOS FCB opens the command-line file
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "B4 0F BA 5C 00 CD 21"
      offset_range: [0, 32]

