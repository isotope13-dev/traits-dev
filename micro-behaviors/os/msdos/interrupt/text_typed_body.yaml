# Resident DOS bodies padded with long printable filler runs (e.g. a
# 5 KB run of 'A' ahead of the virus code) sniff as text, so the
# dos_com/data-typed byte atoms never run on them. Hex matchers cap at
# three file types; these text-only legs feed the
# objectives/impact/infect/binary/dos resident-infector chain.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [text]
  size_max: 65536
traits:
  # MOV WORD [0084],imm16 / MOV [0086],sreg: installs a handler straight
  # into the INT 21h IVT slot.
  - id: ivt-int21-store-imm
    desc: DOS stores an immediate IVT handler
    conf: 0.9
    if:
      type: hex
      pattern: "C7 06 84 00 ?? ?? 8C ?? 86 00"

  # MOV AH,40h, then a relocated DOS call and a JC on the carry flag.
  - id: int21-write-carry-check
    desc: DOS write checked for a carry error
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-12] E8 ?? ?? 72"

  # Hooked handler filtering handle find-first/next and FCB find-first/next,
  # the directory-listing size stealth of resident infectors.
  - id: int21-dir-search-intercept
    desc: DOS handler intercepts directory searches
    conf: 0.9
    if:
      type: hex
      pattern: "80 FC 4E (74|75) ?? 80 FC 4F (74|75) ?? 80 FC 11 (74|75) ?? 80 FC 12"
