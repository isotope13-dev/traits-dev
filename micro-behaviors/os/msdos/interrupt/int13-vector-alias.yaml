# INT 21h AH=35h returns another interrupt's handler in ES:BX; copying that
# into DS:DX and calling AH=25h AL=13h makes the disk BIOS vector point at
# a handler that is not a disk service. A real INT 13h hook installs its own
# routine (DX = own offset), so the aliased vector only breaks disk I/O.
defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536
  attack: T1499
traits:
- id: int13-set-to-other-vector-handler
  desc: Points INT 13h at another vector's handler
  crit: suspicious
  conf: 0.93
  if:
    type: hex
    pattern: (B4 35 B0 ??|B0 ?? B4 35|B8 ?? 35) CD 21 [0-8] (89 DA|8B D3) [0-8] (B4 25 B0 13|B0 13 B4 25|B8 13 25) CD 21
# AH=35h/AL=13h reads the current disk vector, later AH=25h/AL=13h installs
# a new handler; saves, alias installs and chained calls may sit between,
# so only the install pair is pinned. One alternative per spelling pair,
# all wrapped in one outer alternation group.
- id: dos-int13-vector-get-then-set
  desc: DOS saves, replaces INT 13h vector
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: "(B8 13 35 CD 21 [0-32] B8 13 25 [0-8] BA ?? ?? [0-8] CD 21|B4 35 B0 13 CD 21 [0-32] B4 25 B0 13 CD 21|B0 13 B4 35 CD 21 [0-32] B0 13 B4 25 CD 21|B8 13 35 CD 21 [0-32] B8 13 25 [0-8] CD 21)"
