# INC BX twice, call INT 21h, then LOOP. Polymorphic decryptors walk a
# word pointer this way while a harmless DOS service fills the gap.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 4096
traits:
  - id: dos-inc-bx-int21-loop
    desc: DOS loops an INT 21h pointer walk
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_inc_bx_int21_loop {
          meta:
            filetypes = "dos_com,data"
          strings:
            $loop = { 43 43 [0-12] CD 21 [0-4] E2 }
          condition:
            $loop
        }
