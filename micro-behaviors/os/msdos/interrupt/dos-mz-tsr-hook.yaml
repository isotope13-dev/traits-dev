defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
traits:
  - id: dos-int21-get-set-vector-any
    desc: Gets and replaces DOS INT 21h vector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B8 21 35 CD 21 [0-24] B8 21 25 CD 21"
  # `data` is the catch-all type, so a bare 3-byte prefix fires inside large opaque blobs
  # (a 26 MB V8 startup snapshot matched here). A DOS TSR hook is a small image.
  - id: dos-int21-exec-open-intercept
    desc: Intercepts DOS EXEC and OPEN calls
    crit: suspicious
    conf: 0.94
    size_max: 524288
    if:
      type: hex
      pattern: "3D 00 4B [0-16] 3D 00 3D"
  - id: dos-int21-ivt-direct-hook
    desc: Hooks INT 21h directly in IVT
    crit: suspicious
    conf: 0.93
    if:
      type: hex
      pattern: "(33 C0|2B C0) 8E C0 BF 84 00 B8 ?? ?? AB"
  - id: dos-int21-exec-service-intercept
    desc: Resident handler intercepts DOS EXEC (4Bh)
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "9C 50 [0-12] 80 FC 4B (74|75) ??"
