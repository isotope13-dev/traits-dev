defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
traits:
  - id: dos-int21-get-set-vector-any
    desc: Gets and replaces DOS INT 21h vector
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B8 21 35 CD 21 [0-24] B8 21 25 CD 21"
  - id: dos-int21-exec-open-intercept
    desc: Intercepts DOS EXEC and OPEN calls
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "3D 00 4B [0-16] 3D 00 3D"
