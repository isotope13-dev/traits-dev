defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: ivt-segment-val
    desc: DOS interrupt-vector query sequence
    crit: notable
    if:
      type: text
      regex: '(?i)mov\s+ax,\s*24h[^\r\n]{0,80}int\s+21h'
  - id: ivt-segment-reg
    desc: DOS interrupt-vector segment assignment
    crit: notable
    if:
      type: text
      regex: '(?i)mov\s+es,\s*ax[^\r\n]{0,80}int\s+21h'
