defaults:
  for: [dos_com, data]
  platforms: [windows, unix]

traits:
  # Copies the INT 21h vector and installs a handler in segment zero.
  - id: dos-int21-low-memory-vector-swap
    desc: Replaces DOS interrupt vector in low memory
    crit: notable
    if:
      type: hex
      pattern: '56 BE 84 00 56 26 A5 26 A5 5F B8 ?? 00 AB AB'

  # The handler filters create-file requests by the final two filename bytes.
  - id: dos-create-com-suffix-filter
    desc: Filters DOS creation by om suffix
    crit: notable
    if:
      type: hex
      pattern: '80 FC 3C 75 ?? 8B FA 32 C0 AE 75 FD 81 7D FD 6F 6D 75 ??'
