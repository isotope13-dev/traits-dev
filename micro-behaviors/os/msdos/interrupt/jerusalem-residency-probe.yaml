defaults:
  platforms: [windows, unix]
  for: [data]
  size_min: 512
  size_max: 1048576

traits:
  # AH=FFh INT 21h answers 'RO' from a resident copy of the Jerusalem family.
  # The probe is a family-specific self-identification, not a generic TSR check.
  - id: dos-jerusalem-ro-residency-probe
    desc: Jerusalem INT 21h 'RO' residency probe
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 FF CD 21 3D 52 4F"
