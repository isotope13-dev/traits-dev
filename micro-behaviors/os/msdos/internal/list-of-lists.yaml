# DOS query evidence is neutral. A near call alone does not prove an interrupt.
defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - dos_com
  - static-lib
  - data
  size_max: 65536
  id: ah52-near-call
  desc: Loads AH=52h before a near call
  crit: component
  conf: 0.88
  if:
    type: hex
    pattern: B4 52 E8
- for:
  - dos_com
  - static-lib
  size_max: 65536
  id: list-of-lists-int
  desc: AH=52h interrupt dispatch sequence
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B4 52 [0-6] CD 21
- for:
  - dos_com
  - static-lib
  - data
  id: list-of-lists-int-short-gap
  desc: AH=52h interrupt dispatch sequence
  crit: notable
  conf: 0.85
  if:
    type: hex
    pattern: B4 52 [0-4] CD 21
composite_rules:
- for:
  - dos_com
  - static-lib
  - data
  size_max: 65536
  id: list-of-lists-dispatch-short-gap
  desc: DOS table-query dispatch indicators
  crit: component
  conf: 0.84
  any:
  - id: micro-behaviors/os/msdos/internal::list-of-lists-int-short-gap
  - id: micro-behaviors/os/msdos/internal::ah52-near-call
- for:
  - dos_com
  - static-lib
  size_max: 65536
  id: list-of-lists-dispatch
  desc: DOS table-query dispatch indicators
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/os/msdos/internal::list-of-lists-int
  - id: micro-behaviors/os/msdos/internal::ah52-near-call
