# Queries the DOS InDOS flag pointer (INT 21h AH=34h) to obtain the DOS kernel
# segment in ES, then scans that segment in a counted loop for an internal
# dispatcher byte sequence and stores the matched offset:ES far pointer.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, static-lib]
  size_max: 65536

traits:
  - id: dos-indos-segment-kernel-scan
    desc: Scans InDOS segment for kernel far pointer
    crit: suspicious
    conf: 0.94
    if:
      type: yara
      source: |
        rule dos_indos_segment_kernel_scan {
          meta:
            filetypes = "dos_com,data,static-lib"
          strings:
            $indos = { ( B4 34 | B8 ?? 34 ) [0-6] CD 21 }
            $scan = {
              B9 ?? ??
              26 ( 8B | 8A | 3B | 3A ) ??
              [2-16]
              ( 46 | 47 | 43 ) E2 ??
              [0-6]
              89 ( B5 | B4 | 9D | 9C | 36 | 3E | 1E ) ?? ??
              8C ( 85 | 84 | 06 ) ?? ??
            }
          condition:
            for any i in (1..#indos) : (
              for any j in (1..#scan) : (
                @scan[j] > @indos[i] and @scan[j] - @indos[i] <= 128
              )
            )
        }
