# Memory carving and vector placement for a DOS resident install: cut
# memory away from DOS and the BIOS so the resident copy is invisible to MEM
# and is not overwritten, and write the INT 21h vector straight into the
# low-memory interrupt table. Headerless resident bodies sniff as data.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, static-lib]
  size_max: 65536

traits:
  # DEC AX; MOV DS,AX selects the program's own memory control block, then
  # SUB WORD [0003h],n cuts its paragraph count.
  - id: dos-own-mcb-size-shrink
    desc: Shrinks its own DOS memory control block
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "48 8E D8 [0-6] (81 2E 03 00 ?? ??|83 2E 03 00 ??)"

  # SUB/DEC WORD [0413h] with DS=0: lowers the BIOS-reported base memory
  # size so the top kilobytes belong to nobody.
  - id: dos-bios-base-memory-shrink
    desc: Lowers BIOS base memory size at 0:0413h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "(83 2E 13 04 ??|81 2E 13 04 ?? ??|FF 0E 13 04)"

  # MOV [0084h],AX ... MOV [0086h],seg: the INT 21h vector written directly
  # into the table, without INT 21h AH=25h.
  - id: dos-direct-ivt-int21-write
    desc: Writes INT 21h vector into the IVT
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "(A3 84 00|C7 06 84 00 ?? ??|89 1E 84 00|89 16 84 00) [0-6] (A3 86 00|8C 06 86 00|8C 0E 86 00|89 ?? 86 00)"
