# Memory carving and vector placement for a DOS resident install: cut
# memory away from DOS and the BIOS so the resident copy is invisible to MEM
# and is not overwritten, and write the INT 21h vector straight into the
# low-memory interrupt table. Headerless resident bodies sniff as data.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, static-lib]
  size_max: 65536

traits:
  # DEC AX; MOV DS,AX selects the program's own memory control block, then
  # SUB WORD [0003h],n cuts its paragraph count.
  - id: dos-own-mcb-size-shrink
    desc: Shrinks its own DOS memory control block
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "48 8E D8 [0-6] (81 2E 03 00 ?? ??|83 2E 03 00 ??)"

  # SUB/DEC WORD [0413h] with DS=0: lowers the BIOS-reported base memory
  # size so the top kilobytes belong to nobody.
  - id: dos-bios-base-memory-shrink
    desc: Lowers BIOS base memory size at 0:0413h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "(83 2E 13 04 ??|81 2E 13 04 ?? ??|FF 0E 13 04)"

  # MOV [0084h],AX ... MOV [0086h],seg: the INT 21h vector written directly
  # into the table, without INT 21h AH=25h. The string-store form points DI
  # at 0084h and lays down the handler offset and then a segment register
  # with two STOSW (Larry.491), again bypassing AH=25h.
  - id: dos-direct-ivt-int21-write
    desc: Writes INT 21h vector into the IVT
    crit: notable
    conf: 0.88
    if:
      type: yara
      source: |
        rule dos_direct_ivt_int21_write {
          meta:
            filetypes = "dos_com,data,static-lib"
          strings:
            $mov = { ( A3 84 00 | C7 06 84 00 ?? ?? | 89 1E 84 00 | 89 16 84 00 ) [0-6] ( A3 86 00 | 8C 06 86 00 | 8C 0E 86 00 | 89 ?? 86 00 ) }
            $stos = { BF 84 00 [0-10] AB [0-10] 8C ( C0 | C8 | D0 | D8 ) AB }
          condition:
            any of them
        }

  # Steps back one paragraph from the PSP segment to the MCB, verifies the
  # last-block marker ('Z' = 5Ah), subtracts the resident size in paragraphs
  # from both MCB size (+03h) and PSP top-of-memory (+12h), loads ES with the
  # carved top segment (+12h), and copies its body into high memory.
  - id: dos-mcb-psp-top-memory-carve
    desc: Shrinks MCB and PSP top-of-memory
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_mcb_psp_top_memory_carve {
          meta:
            filetypes = "dos_com,data,static-lib"
          strings:
            $carve = {
              ( 48 | 49 | 4A | 4B | 4D | 4E | 4F ) 8E ( C0 | C1 | C2 | C3 | C5 | C6 | C7 )
              [0-6]
              26 80 ( 3F | 3D | 3C | 3E 00 00 ) 5A
              [2-10]
              26 ( 29 | 81 2F | 81 6F | 81 2E ) ( 47 03 | 45 03 | 44 03 | 06 03 00 )
              [0-8]
              26 ( 29 | 81 2F | 81 6F | 81 2E ) ( 47 12 | 45 12 | 44 12 | 06 12 00 )
              [0-4]
              26 8E ( 47 12 | 45 12 | 44 12 | 06 12 00 )
              [0-20]
              F3 ( A4 | A5 )
            }
          condition:
            $carve
        }
