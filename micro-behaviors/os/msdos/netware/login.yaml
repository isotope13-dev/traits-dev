defaults:
  for: [data]
  platforms: [windows]
  size_min: 1024
  size_max: 524288

traits:
  - id: novell-netware-copyright
    desc: References Novell NetWare copyright string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Novell, Inc.'

  - id: novell-netware-login-prompt
    desc: Prompts for NetWare login credentials
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'NetWare shell not loaded.'

  - id: novell-netware-bindery-login-fields
    desc: References NetWare bindery login properties
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'LOGIN_CONTROL'

composite_rules:
  - id: novell-netware-login-utility
    desc: Novell NetWare DOS LOGIN utility
    crit: notable
    conf: 0.95
    all:
      - id: novell-netware-copyright
      - id: novell-netware-login-prompt
      - id: novell-netware-bindery-login-fields
