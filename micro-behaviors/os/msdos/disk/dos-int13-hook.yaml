# Resident BIOS INT 13h vector installation and sector-write (AH=03h)
# interception primitives.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, static-lib]
  size_max: 65536

traits:
  - id: dos-int13-vector-get-and-set
    desc: Gets and sets BIOS INT 13h vector
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule dos_int13_vector_get_and_set {
          meta:
            filetypes = "dos_com,data,static-lib"
          strings:
            $get = { B8 13 35 [0-6] CD 21 }
            $set = { B8 13 25 [0-10] CD 21 }
          condition:
            $get and $set
        }

  # Intercepts BIOS INT 13h sector writes (CMP AH, 03h), chains non-matching
  # calls to the saved vector, and on the matched path pops saved registers
  # and executes CLC; IRET (F8 CF) to report success without writing sectors.
  - id: dos-int13-write-intercept-clc-iret
    desc: INT 13h write hook returns CLC IRET
    crit: suspicious
    conf: 0.96
    for: [dos_com, data]
    if:
      type: yara
      source: |
        rule dos_int13_write_intercept_clc_iret {
          meta:
            filetypes = "dos_com,data"
          strings:
            $hook = {
              80 FC 03 ( 74 | 75 ) ??
              [0-8]
              2E FF ( 2E | 1E ) ?? ??
              [2-24]
              ( 58 | 59 | 5A | 5B | 5E | 5F | 9D )
              F8 CF
            }
          condition:
            $hook
        }
