# BIOS disk API byte sequences are observations, not proof of a wipe.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-int13-fixed-disk-write
    desc: BIOS writes raw sectors to fixed disk
    crit: notable
    conf: 0.92
    for: [dos_com, data, ole]
    if:
      type: hex
      pattern: "(B8 ?? 03 [0-16] BA 80 00|B8 ?? 03 [0-16] B2 80|BA 80 00 [0-16] B8 ?? 03|B2 80 [0-16] B8 ?? 03) [0-16] CD 13"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  - id: dos-int13-raw-disk-copy-loop
    desc: BIOS reads and writes raw sectors
    crit: notable
    conf: 0.95
    for: [dos_com, data, ole]
    if:
      type: hex
      pattern: "B8 ?? 02 [0-16] CD 13 [0-8] 72 ?? B8 ?? 03 [0-16] CD 13"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # MOV AX,xx02h with AL other than 1: BIOS read of more than one sector.
  # Mislabeled dumps are often typed data or static-lib rather than dos_com.
  - id: dos-int13-multisector-read
    desc: BIOS reads multiple disk sectors
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ~01 02 [0-40] CD 13"
      offset_range: [0, 512]

  # MOV AX,xx03h / INT 13h writes any sector count. Floppy erasers use DL
  # below 80h, so the fixed-disk atom above does not see them.
  - id: dos-int13-ax-sector-write-any
    desc: BIOS writes sectors via AX immediate
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 03 [0-24] CD 13"
      offset_range: [0, 512]

  # AL other than 1 overwrites more than a single boot sector.
  - id: dos-int13-multisector-write
    desc: BIOS writes multiple disk sectors
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "B8 ~01 03 [0-24] CD 13"
      offset_range: [0, 512]

  # INT 13h then INT 21h AH=4Ch. The gap allows another sector call
  # between the disk service and MOV AH,4Ch / MOV AL,imm / INT 21h.
  - id: dos-int13-then-dos-exit
    desc: DOS exits after BIOS disk call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "CD 13 [0-64] B4 4C [0-8] CD 21"
      offset_range: [0, 512]

  - id: dos-int13-sector-write-exit
    desc: BIOS INT 13h call then immediately exits
    crit: notable
    conf: 0.92
    for: [dos_com, data, ole]
    if:
      type: hex
      pattern: "CD 13 [0-28] (CD 20|B4 4C CD 21|B8 00 4C CD 21|31 C0 CD 21|33 C0 CD 21|CD 21|B0 ?? C3|C3|FA F4|F4)"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker
      - id: metadata/path/directory::test-directory-component

  - id: dos-fixed-disk-chs-setup
    desc: Fixed-disk CHS register setup sequence
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "B2 80 B6 00 B5 ?? B1 ??"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  - id: dos-int13-boot-sector-target
    desc: BIOS write targets a boot-sector address
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "B8 01 03 BB 00 7C B9 01 00"
      offset_range: [0, 512]

  - id: dos-int13-mbr-sector-target
    desc: BIOS accesses the hard-disk first sector
    crit: notable
    conf: 0.92
    for: [dos_com, data, ole]
    if:
      type: hex
      pattern: "B8 ?? (02|03) [0-8] (B9 01 00 [0-4] BA 80 00|BA 80 00 [0-4] B9 01 00) [0-4] CD 13"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  - id: dos-int13-drive0-write-exit
    desc: Drive-zero disk call then exit
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "(31|33) D2 CD 13 [0-4] B8 00 4C CD 21"
      offset_range: [0, 512]

  - id: dos-int13-fixed-disk-mbr-write
    desc: BIOS writes to hard-disk first sector
    crit: notable
    conf: 0.95
    for: [dos_com, data, static-lib, ole]
    if:
      type: yara
      source: |
        rule dos_int13_fixed_disk_mbr_write {
          meta:
            filetypes = "dos_com,data,static-lib,ole"
          strings:
            $fn_ax  = { B8 ~00 03 }
            $fn_ah  = { ( B4 03 [0-6] B0 ~00 | B0 ~00 [0-6] B4 03 ) }
            $chs_cx = { ( B9 01 00 | 31 C9 41 | 33 C9 41 | ( B5 00 | 30 ED | 32 ED ) [0-6] B1 01 | B1 01 [0-6] ( B5 00 | 30 ED | 32 ED ) ) }
            $hdd_dx = { ( BA 80 00 | 31 D2 B2 80 | 33 D2 B2 80 | ( B6 00 | 30 F6 | 32 F6 ) [0-6] B2 80 | B2 80 [0-6] ( B6 00 | 30 F6 | 32 F6 ) ) }
            $int13  = { CD 13 }
          condition:
            (#fn_ax > 0 or #fn_ah > 0) and #chs_cx > 0 and #hdd_dx > 0 and #int13 > 0 and
            for any i in (1..#int13) : (
              @int13[i] >= 8 and @int13[i] <= 512 and
              (
                for any a in (1..#fn_ax) : (
                  @fn_ax[a] + 3 <= @int13[i] and @int13[i] - @fn_ax[a] <= 32 and
                  (i == 1 or @fn_ax[a] >= @int13[i - 1] + 2)
                ) or
                for any b in (1..#fn_ah) : (
                  @fn_ah[b] + 4 <= @int13[i] and @int13[i] - @fn_ah[b] <= 32 and
                  (i == 1 or @fn_ah[b] >= @int13[i - 1] + 2)
                )
              ) and
              for any c in (1..#chs_cx) : (
                @chs_cx[c] + 3 <= @int13[i] and @int13[i] - @chs_cx[c] <= 32 and
                (i == 1 or @chs_cx[c] >= @int13[i - 1] + 2)
              ) and
              for any d in (1..#hdd_dx) : (
                @hdd_dx[d] + 3 <= @int13[i] and @int13[i] - @hdd_dx[d] <= 32 and
                (i == 1 or @hdd_dx[d] >= @int13[i - 1] + 2)
              )
            )
        }
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  - id: dos-first-int13-immediate-finish
    desc: First BIOS disk call immediately finishes
    crit: notable
    conf: 0.92
    for: [dos_com, data, static-lib, ole]
    size_max: 512
    if:
      type: yara
      source: |
        rule dos_first_int13_immediate_finish {
          meta:
            filetypes = "dos_com,data,static-lib,ole"
          strings:
            $int13_finish = { CD 13 [0-12] ( CD 20 | CD 19 | B4 4C [0-4] CD 21 | B8 ?? 4C CD 21 | B4 00 CD 21 | 31 C0 CD 21 | 33 C0 CD 21 | C3 | FA F4 | EB FE ) }
            $int13_any = { CD 13 }
          condition:
            filesize <= 512 and
            #int13_finish > 0 and #int13_any > 0 and
            @int13_finish[1] == @int13_any[1] and
            @int13_finish[1] >= 8 and @int13_finish[1] <= 48
        }
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  - id: dos-int13-head-cylinder-write-loop
    desc: BIOS head and cylinder sector-write loop
    crit: notable
    conf: 0.96
    for: [dos_com]
    if:
      type: yara
      source: |
        rule dos_int13_head_cylinder_write_loop {
          strings:
            $loop = {
              ( B8 ~00 03 | B4 03 ) [0-36] CD 13 [0-16]
              FE C6 [0-12] ( 72 | 75 | 7C | 7E ) ?? [0-12]
              FE C5 [0-12] ( 72 | 75 | 7C | 7E | EB ) ??
            }
          condition:
            $loop
        }

  # Hex twins of the inline-YARA tiny-stub legs above. Inline YARA does not
  # run on files typed ole/msi by extension (e.g. a COM renamed *.mst), while
  # hex does. Write function and DL=80h in either order, INT 13h, then an
  # immediate exit, reboot, halt or hang, within the first 48 bytes.
  - id: dos-int13-fixed-disk-write-then-finish
    desc: Leading fixed-disk BIOS write then exits
    crit: notable
    conf: 0.94
    for: [dos_com, data, ole]
    size_max: 512
    if:
      type: hex
      pattern: "(B8 ~00 03 [0-8] BA 80 00|B8 ~00 03 [0-8] 31 D2 B2 80|B8 ~00 03 [0-8] 33 D2 B2 80|B8 ~00 03 [0-8] B6 00 B2 80|B8 ~00 03 [0-8] B2 80 B6 00|B8 ~00 03 [0-8] 30 F6 B2 80|B8 ~00 03 [0-8] 32 F6 B2 80|B4 03 B0 ~00 [0-8] BA 80 00|B4 03 B0 ~00 [0-8] 31 D2 B2 80|B4 03 B0 ~00 [0-8] 33 D2 B2 80|B4 03 B0 ~00 [0-8] B6 00 B2 80|B4 03 B0 ~00 [0-8] B2 80 B6 00|B4 03 B0 ~00 [0-8] 30 F6 B2 80|B4 03 B0 ~00 [0-8] 32 F6 B2 80|B0 ~00 B4 03 [0-8] BA 80 00|B0 ~00 B4 03 [0-8] 31 D2 B2 80|B0 ~00 B4 03 [0-8] 33 D2 B2 80|B0 ~00 B4 03 [0-8] B6 00 B2 80|B0 ~00 B4 03 [0-8] B2 80 B6 00|B0 ~00 B4 03 [0-8] 30 F6 B2 80|B0 ~00 B4 03 [0-8] 32 F6 B2 80|BA 80 00 [0-8] B8 ~00 03|31 D2 B2 80 [0-8] B8 ~00 03|33 D2 B2 80 [0-8] B8 ~00 03|B6 00 B2 80 [0-8] B8 ~00 03|B2 80 B6 00 [0-8] B8 ~00 03|30 F6 B2 80 [0-8] B8 ~00 03|32 F6 B2 80 [0-8] B8 ~00 03|BA 80 00 [0-8] B4 03 B0 ~00|31 D2 B2 80 [0-8] B4 03 B0 ~00|33 D2 B2 80 [0-8] B4 03 B0 ~00|B6 00 B2 80 [0-8] B4 03 B0 ~00|B2 80 B6 00 [0-8] B4 03 B0 ~00|30 F6 B2 80 [0-8] B4 03 B0 ~00|32 F6 B2 80 [0-8] B4 03 B0 ~00|BA 80 00 [0-8] B0 ~00 B4 03|31 D2 B2 80 [0-8] B0 ~00 B4 03|33 D2 B2 80 [0-8] B0 ~00 B4 03|B6 00 B2 80 [0-8] B0 ~00 B4 03|B2 80 B6 00 [0-8] B0 ~00 B4 03|30 F6 B2 80 [0-8] B0 ~00 B4 03|32 F6 B2 80 [0-8] B0 ~00 B4 03) [0-8] CD 13 [0-12] (CD 20|CD 19|B4 4C [0-4] CD 21|B8 ?? 4C CD 21|B4 00 CD 21|31 C0 CD 21|33 C0 CD 21|C3|FA F4|EB FE|EA F0 FF 00 F0)"
      offset_range: [0, 48]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # CX=0001h (cylinder 0, sector 1) loaded shortly before INT 13h in the
  # first bytes of a tiny image: a BIOS disk call addressing a disk's first
  # sector (MBR or floppy boot sector, depending on DL and DH).
  - id: dos-int13-chs-first-sector-call
    desc: BIOS disk call addresses CHS sector 1
    crit: notable
    conf: 0.88
    for: [dos_com, data, ole]
    size_max: 512
    if:
      type: hex
      pattern: "(B9 01 00|31 C9 41|33 C9 41|B1 01 B5 00|B5 00 B1 01|B1 01 30 ED|B1 01 32 ED|30 ED B1 01|32 ED B1 01) [0-16] CD 13"
      offset_range: [0, 48]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # Any BIOS read-class service (02h read, 0Ah long read, 42h extended read)
  # in a tiny image. A stub that reads before writing can preserve or restore
  # disk contents, so this vetoes blind-overwrite conclusions.
  - id: dos-int13-read-service-call
    desc: BIOS disk read service call
    crit: notable
    conf: 0.9
    for: [dos_com, data, ole]
    size_max: 512
    if:
      type: hex
      pattern: "(B8 ?? 02|B8 ?? 0A|B8 ?? 42|B4 02|B4 0A|B4 42) [0-28] CD 13"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker


composite_rules:
  - id: dos-fixed-disk-write-and-exit
    desc: Fixed-disk write and exit sequences
    crit: notable
    conf: 0.98
    for: [dos_com, data, ole]
    all:
      - id: dos-int13-fixed-disk-write
      - id: dos-int13-sector-write-exit

  - id: dos-raw-sector-copy-and-exit
    desc: Raw-sector copy and exit sequences
    crit: notable
    conf: 0.97
    for: [dos_com, data, ole]
    all:
      - id: dos-int13-raw-disk-copy-loop
      - id: dos-int13-sector-write-exit

  # Independent byte patterns do not establish the control-flow path.
  - id: dos-multisector-read-write-and-exit
    desc: Sector read, write and exit sequences
    crit: notable
    conf: 0.96
    size_max: 2048
    all:
      - id: dos-int13-multisector-read
      - id: dos-int13-ax-sector-write-any
      - id: dos-int13-then-dos-exit

  # Multi-sector writes also occur in legitimate disk utilities.
  - id: dos-multisector-write-and-exit
    desc: Multi-sector write and exit sequences
    crit: notable
    conf: 0.95
    size_max: 2048
    all:
      - id: dos-int13-multisector-write
      - id: dos-int13-then-dos-exit

  - id: dos-boot-sector-write-and-exit
    desc: Boot-sector write and exit sequences
    crit: notable
    conf: 0.96
    all:
      - id: dos-int13-boot-sector-target
      - id: dos-int13-drive0-write-exit

  - id: dos-first-sector-access-and-exit
    desc: First-sector access and exit sequences
    crit: notable
    conf: 0.98
    for: [dos_com, data, ole]
    all:
      - id: dos-int13-mbr-sector-target
      - id: dos-int13-sector-write-exit

  - id: dos-fixed-disk-mbr-write-and-exit
    desc: Hard-disk MBR write and exit sequences
    crit: notable
    conf: 0.98
    for: [dos_com, data, static-lib, ole]
    all:
      - id: dos-int13-fixed-disk-mbr-write
    any:
      - id: dos-int13-sector-write-exit
      - id: dos-int13-then-dos-exit
      - id: micro-behaviors/process/exit/terminate::dos-terminate-after-disk-service

