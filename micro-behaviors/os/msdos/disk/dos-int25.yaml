# DOS absolute disk read (INT 25h) in tiny real-mode images. INT 25h leaves
# the caller's flags on the stack, so callers pop them right after.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, ole]
  size_max: 512

traits:
  - id: dos-int25-absolute-disk-read
    desc: DOS absolute disk read call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "CD 25 (9D|58|59|5A|5B|5D|5E|5F|83 C4 02)"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker
