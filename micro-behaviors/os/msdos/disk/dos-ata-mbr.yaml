# CHS 0/0/1 on the primary master, one sector. The code starts at COM entry.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-ata-first-sector-setup
    desc: ATA primary disk first sector setup
    crit: notable
    if:
      type: hex
      pattern: 'BA F6 01 B0 A0 EE BA F2 01 B0 01 EE BA F3 01 B0 01 EE BA F4 01 B0 00 EE BA F5 01 B0 00 EE'
      offset: 0

  # COM's SI address is relative to the PSP, 100h bytes before the image.
  # Require the actual 512-byte transfer buffer to consist of one repeated byte.
  - id: dos-ata-repeated-sector-write
    desc: ATA writes repeated-byte sector
    crit: notable
    if:
      type: yara
      source: |
        rule dos_ata_repeated_sector_write {
          strings:
            $write = { BA F7 01 B0 30 EE EC A8 08 74 FB B9 00 01 BE ?? ?? BA F0 01 F3 6F }
          condition:
            $write at 30 and uint16(45) >= 0x100 and
            uint16(45) - 0x100 + 512 <= filesize and
            for all i in (0..511) : (
              uint8(uint16(45) - 0x100 + i) == uint8(uint16(45) - 0x100)
            )
        }
