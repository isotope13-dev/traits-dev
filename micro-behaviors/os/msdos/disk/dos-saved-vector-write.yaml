defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
  crit: notable

traits:
  - id: dos-save-int13-vector
    desc: Saves BIOS disk interrupt vector
    if:
      type: hex
      pattern: "B8 13 35 CD 21 89 1E ?? ?? 8C 06 ?? ??"

  - id: dos-saved-vector-disk-write-loop
    desc: Loops far calls with disk-write function
    if:
      type: hex
      pattern: "BA 81 00 B8 02 03 9C 9A ?? ?? ?? ?? FE C6 75 F3 FE CA 78 EF"
