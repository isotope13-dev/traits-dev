# INT 21h AX=440Dh generic block-device IOCTL with CH=08h, CL=4Ah/4Bh:
# lock a logical or physical volume. Windows 9x requires this lock before a
# DOS program may write raw sectors, so disk utilities (ScanDisk, FDISK,
# defragmenters) use it as well as disk-damaging code.
defaults:
  platforms: [windows]
  for: [dos_com, data, static-lib]
  size_max: 65536

traits:
  - id: dos-ioctl-volume-lock
    desc: DOS IOCTL locks a disk volume
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_ioctl_volume_lock {
          strings:
            $lock = { ( B8 0D 44 [0-12] B9 ( 4A | 4B ) 08 | B9 ( 4A | 4B ) 08 [0-12] B8 0D 44 ) [0-12] CD 21 }
          condition:
            $lock
        }
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker
