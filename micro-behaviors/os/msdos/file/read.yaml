# DOS file open/read services in tiny real-mode images. A stub that reads a
# file before writing a disk sector can be restoring a saved sector, so this
# vetoes blind-overwrite conclusions.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, ole]
  size_max: 512

traits:
  # AH=0Fh/14h/21h/27h FCB open/read, 3Dh/3Fh handle open/read, via AH or AX.
  - id: dos-int21-file-open-or-read
    desc: DOS file open or read call
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "(B4 0F|B4 14|B4 21|B4 27|B4 3D|B4 3F|B8 ?? 0F|B8 ?? 14|B8 ?? 21|B8 ?? 27|B8 ?? 3D|B8 ?? 3F) [0-16] CD 21"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker
