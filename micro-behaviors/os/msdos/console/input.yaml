# Console input in tiny real-mode images: DOS INT 21h keyboard services and
# BIOS INT 16h keystroke waits. A stub that waits for the user before a disk
# write is a confirmed action, so these veto blind-overwrite conclusions.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, ole]
  size_max: 512
  crit: notable
  conf: 0.9

traits:
  # AH=01/06/07/08/0Ah/0Ch console input, loaded via AH or AX, then INT 21h.
  - id: dos-int21-console-input
    desc: DOS console input call
    if:
      type: hex
      pattern: "(B4 01|B4 06|B4 07|B4 08|B4 0A|B4 0C|B8 ?? 01|B8 ?? 06|B8 ?? 07|B8 ?? 08|B8 ?? 0A|B8 ?? 0C) [0-16] CD 21"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker

  # AH=00h/10h (or zeroed AX) then INT 16h: wait for a keystroke.
  - id: bios-int16-keystroke-wait
    desc: BIOS waits for a keystroke
    if:
      type: hex
      pattern: "(B4 00|B4 10|31 C0|33 C0) [0-4] CD 16"
      offset_range: [0, 512]
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker
