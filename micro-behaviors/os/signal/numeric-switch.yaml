defaults:
  platforms:
  - windows
  - unix
  for:
  - c

traits:
  - id: numeric-signal-switch-source
    desc: Source switches on a numeric signal value
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'switch\s*\(\s*sig\s*\)\s*\{[\s\S]{0,500}case\s+[0-9]{2,3}\s*:'
    unless:
    - id: well-known/tool/development/toolchain/binutils-gdb-source::source-archive-member
