defaults:
  platforms: [unix, windows]
  for: [scripts, -javascript, -typescript, binaries]
traits:
  - id: kill-command-signal-option
    desc: kill command text specifies an explicit signal
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(^|[\s"'';&|])(/[A-Za-z0-9_.-]+/)?kill(\.exe)?\s+-[0-9A-Z]+\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/document/html/
