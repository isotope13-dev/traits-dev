# Exact signal-dispatch symbols are neutral capabilities. Objective rules add
# the kill-hook context that gives them hostile meaning.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.82

traits:
  - id: send-sig
    desc: Signal dispatch function send_sig
    if:
      type: symbol
      kind: function
      regex: '(^|[^A-Za-z])send_sig'
    unless:
      - id: metadata/lang/upstream::linux-kernel-source-tree-path
