defaults:
  platforms: [linux, macos, windows]
# Signal Handling
# C runtime signal handlers (Windows and Unix)
traits:
  - id: signal
    desc: Install signal handler
    crit: baseline
    conf: 0.90
    for: ["pe", "elf", "macho"]
    if:
      type: symbol
      exact: "signal"
  - id: sigaction
    desc: Install signal handler (POSIX sigaction)
    crit: baseline
    conf: 0.90
    for: ["elf", "macho"]
    platforms: [linux, macos, android]
    if:
      type: symbol
      exact: "sigaction"
  - id: sigaltstack
    desc: Configure alternate signal stack
    crit: baseline
    conf: 0.86
    for: [elf, macho]
    platforms: [linux, macos, android]
    if:
      type: symbol
      exact: "sigaltstack"
  # Source-level signal-handler installation and inspection are neutral C
  # capabilities. The inline-hook objective composite references these and
  # supplies the RWX/context-hijack evidence for intent.
  - id: sigaction-source-call
    desc: sigaction() handler-install source call
    crit: baseline
    conf: 0.85
    for: ["c", "cpp", "objc", "elf"]
    platforms: [linux, macos]
    if:
      type: text
      regex: 'sigaction\([A-Za-z_][A-Za-z0-9_]*\s*,\s*&'
  - id: sigaction-handler-inspection
    desc: Reads an installed POSIX signal handler
    crit: notable
    conf: 0.9
    for: ["c", "cpp", "objc", "elf"]
    platforms: [linux, macos]
    if:
      type: text
      regex: 'sigaction\([A-Za-z_][A-Za-z0-9_]*\s*,\s*NULL\s*,\s*&'
  - id: cpython-signal-handler-type
    desc: CPython signal-handler API type
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      substr: PyOS_sighandler_t
  - id: sa-siginfo-flag
    desc: SA_SIGINFO sigaction flag
    crit: notable
    conf: 0.8
    for: ["c", "cpp", "objc", "elf"]
    platforms: [linux, macos]
    if:
      type: text
      substr: SA_SIGINFO
  - id: signal-ignore-sighup-call
    desc: Calls signal with SIGHUP ignored
    crit: notable
    conf: 0.9
    for: [elf, macho, c, cpp, objc, swift]
    platforms: [unix]
    if:
      type: symbol
      kind: call
      exact: signal
      args:
        - kind: identifier
          name: SIGHUP
        - kind: identifier
          name: SIG_IGN
  - id: signal-ignore-sigpipe-call
    desc: Calls signal with SIGPIPE ignored
    crit: notable
    conf: 0.9
    for: [elf, macho, c, cpp, objc, swift]
    platforms: [unix]
    if:
      type: symbol
      kind: call
      exact: signal
      args:
        - kind: identifier
          name: SIGPIPE
        - kind: identifier
          name: SIG_IGN
  - id: signal-number-switch
    desc: Switches on a signal number
    for: [c]
    platforms: [windows, unix]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'switch\s*\(\s*sig\s*\)\s*\{[\s\S]{0,500}case\s+SIG[A-Z_]+'
    not:
    - regex: 'case\s+SIG[A-Z_]+:\s*name\s*=\s*"SIG[A-Z_]+"\s*;'
composite_rules:
  - id: signal-ignore-call
    desc: Installs SIG_IGN for SIGHUP or SIGPIPE
    crit: notable
    conf: 0.9
    for: [elf, macho, c, cpp, objc, swift]
    platforms: [unix]
    any:
      - id: signal-ignore-sighup-call
      - id: signal-ignore-sigpipe-call
