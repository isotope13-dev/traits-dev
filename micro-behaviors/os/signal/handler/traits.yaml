defaults:
  platforms: [linux, macos, windows]
# Signal Handling
# C runtime signal handlers (Windows and Unix)
traits:
  # === Signal Management ===
  - id: signal
    desc: Install signal handler
    crit: baseline
    conf: 0.90
    for: ["pe", "elf", "macho"]
    if:
      type: symbol
      exact: "signal"
  - id: sigaction
    desc: Install signal handler (POSIX sigaction)
    crit: baseline
    conf: 0.90
    for: ["elf", "macho"]
    platforms: [linux, macos, android]
    if:
      type: symbol
      exact: "sigaction"
  - id: sigaltstack
    desc: Configure alternate signal stack
    crit: baseline
    conf: 0.86
    for: [elf, macho]
    platforms: [linux, macos, android]
    if:
      type: symbol
      exact: "sigaltstack"
  # Source-level signal-handler installation and inspection are neutral C
  # capabilities. The inline-hook objective composite references these and
  # supplies the RWX/context-hijack evidence for intent.
  - id: sigaction-source-call
    desc: sigaction() handler-install source call
    crit: baseline
    conf: 0.85
    for: ["c", "cpp", "objc", "elf"]
    platforms: [linux, macos]
    if:
      type: text
      regex: 'sigaction\([A-Za-z_][A-Za-z0-9_]*\s*,\s*&'
  - id: sigaction-handler-inspection
    desc: Reads an installed POSIX signal handler
    crit: notable
    conf: 0.9
    for: ["c", "cpp", "objc", "elf"]
    platforms: [linux, macos]
    if:
      type: text
      regex: 'sigaction\([A-Za-z_][A-Za-z0-9_]*\s*,\s*NULL\s*,\s*&'
  - id: sa-siginfo-flag
    desc: SA_SIGINFO sigaction flag
    crit: component
    conf: 0.8
    for: ["c", "cpp", "objc", "elf"]
    platforms: [linux, macos]
    if:
      type: text
      substr: SA_SIGINFO
  - id: raise
    desc: Send signal to self
    crit: baseline
    conf: 0.85
    for: ["pe", "elf", "macho"]
    if:
      type: symbol
      exact: "raise"
  - id: abort
    desc: Abort program execution
    crit: baseline
    conf: 0.90
    for: ["pe", "elf", "macho"]
    if:
      type: symbol
      exact: "abort"

  # Match the two arguments on the same signal() call.  The former native
  # byte-pattern atoms only saw `mov <reg>, 1; mov <reg>, 1`, which also occurs
  # in ordinary allocators (for example calloc(1, 1)) and is not evidence of
  # SIG_IGN.
  - id: signal-ignore-sighup-call
    desc: Calls signal with SIGHUP ignored
    crit: notable
    conf: 0.9
    for: [elf, macho, c, cpp, objc, swift]
    platforms: [unix]
    if:
      type: symbol
      kind: call
      exact: signal
      args:
        - kind: identifier
          name: SIGHUP
        - kind: identifier
          name: SIG_IGN
  - id: signal-ignore-sigpipe-call
    desc: Calls signal with SIGPIPE ignored
    crit: notable
    conf: 0.9
    for: [elf, macho, c, cpp, objc, swift]
    platforms: [unix]
    if:
      type: symbol
      kind: call
      exact: signal
      args:
        - kind: identifier
          name: SIGPIPE
        - kind: identifier
          name: SIG_IGN
composite_rules:
  - id: signal-ignore-call
    desc: Installs SIG_IGN for SIGHUP or SIGPIPE
    crit: notable
    conf: 0.9
    for: [elf, macho, c, cpp, objc, swift]
    platforms: [unix]
    any:
      - id: signal-ignore-sighup-call
      - id: signal-ignore-sigpipe-call
