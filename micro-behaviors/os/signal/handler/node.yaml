defaults:
  platforms: [unix, android]
  for: [javascript, typescript]

traits:
  - id: node-sigint-handler
    desc: Node CLI handles SIGINT
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'process.on("SIGINT"'

  - id: node-sigtstp-handler
    desc: Node CLI handles SIGTSTP
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'process.on("SIGTSTP"'

  - id: node-sigquit-handler
    desc: Node CLI handles SIGQUIT
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'process.on("SIGQUIT"'

