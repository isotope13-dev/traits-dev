# Source-level FreeBSD signal-disposition mechanics used by shellcode builders.
# Each atom is neutral by itself: crash handlers are also changed by debuggers,
# runtimes, and fault-injection harnesses. The evasion objective supplies the
# combination that identifies deliberate crash-supervision suppression.
defaults:
  platforms: [freebsd, unix]
  for: [python]
  crit: notable
  attack: T1562.001

traits:
  - id: freebsd-sigaction-syscall-number
    desc: Declares the FreeBSD sigaction syscall number
    conf: 0.98
    if:
      type: tree-sitter
      kind: assignment
      regex: '\bSYS_sigaction\s*=\s*416\b'

  - id: shellcraft-ignore-signal-call
    desc: Builds ignored sigaction shellcode
    conf: 0.97
    if:
      type: tree-sitter
      kind: call
      regex: '\bshellcraft\.syscall\s*\(\s*SYS_sigaction\s*,[^)]{0,120}\bSIG_IGN\b'

  - id: synchronous-crash-signal-set
    desc: Assigns synchronous crash signals
    conf: 0.96
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?is)\bsignals\s*=\s*\[\s*4\s*,\s*5\s*,\s*6\s*,\s*8\s*,\s*10\s*,\s*11\s*\]'
