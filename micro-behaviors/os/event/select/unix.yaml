# Native select(2) — baseline like epoll_*; not socket-specific by itself.
defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: select-multiplex
    desc: select() I/O multiplexing
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      exact: select
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
