# Native select(2) — baseline like epoll_*; not socket-specific by itself.
defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: select-multiplex
    desc: select() I/O multiplexing
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      exact: select
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  # NOTE: a text-shape twin of the atom above (`select\s*\(`) was removed:
  # Go binaries embed `select (` diagnostics for the language-level select
  # statement (e.g. "select (no cases)"), which is not the select(2) syscall,
  # so the text form false-positived on every Go binary; on AST source types
  # the engine requires the symbol form above instead.
