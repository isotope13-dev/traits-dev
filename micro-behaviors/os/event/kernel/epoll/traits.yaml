defaults:
  platforms: [unix, android]
  for: [elf, c, cpp]
traits:
  - id: epoll-create
    desc: epoll_create function
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      regex: epoll_create
  - id: epoll-ctl
    desc: epoll_ctl function
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      regex: epoll_ctl
  - id: epoll-wait
    desc: epoll_wait function
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      regex: epoll_wait
  # epoll_pwait/epoll_pwait2 are the signal-mask variants; `regex: epoll_wait`
  # above does not match them, so an event loop built on pwait looked like it
  # had no wait call at all.
  - id: epoll-pwait
    desc: epoll_pwait function
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      regex: epoll_pwait
composite_rules:
  - id: epoll-usage
    desc: Uses multiple epoll event APIs
    crit: notable
    conf: 0.65
    needs: 2
    any:
      - id: micro-behaviors/os/event/kernel/epoll::epoll-create
      - id: micro-behaviors/os/event/kernel/epoll::epoll-ctl
      - id: micro-behaviors/os/event/kernel/epoll::epoll-wait
