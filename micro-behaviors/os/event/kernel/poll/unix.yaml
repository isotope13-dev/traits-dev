# Native poll(2) — same tier as epoll_* (baseline atom). Socket-oriented
# multiplex composites live under communications/socket/multiplex and must
# combine this with socket create/connect evidence.
defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: poll-multiplex
    desc: poll() I/O multiplexing
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      exact: poll
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
