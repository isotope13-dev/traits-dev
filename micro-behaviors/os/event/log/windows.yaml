defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
traits:
  - id: powershell-operational-log-name
    desc: PowerShell operational event log name reference
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      substr: Microsoft-Windows-PowerShell/Operational

  - id: register-event-source
    desc: Register Windows event source
    crit: baseline
    conf: 0.88
    if:
      type: symbol
      regex: ^RegisterEventSource[AW]?$
  - id: report-event
    desc: Write Windows event log entry
    crit: baseline
    conf: 0.92
    if:
      type: symbol
      regex: ^ReportEvent[AW]?$

  - id: open-event-log-api
    desc: Opens a Windows event log
    crit: notable
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      regex: '\bOpenEventLog[AW]?\s*\('
  - id: open-event-log-import
    desc: Imports Windows event log opener
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: symbol
      kind: import
      regex: '^OpenEventLog[AW]$'

  - id: clear-event-log-api
    desc: Clears a Windows event log
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^ClearEventLog[AW]?$'

  - id: clear-event-log-import
    desc: Imports Windows event log clearer
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: symbol
      kind: import
      regex: '^ClearEventLog[AW]?$'

  - id: wevtapi-library-reference
    desc: Loads the wevtapi event-log library
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)LoadLibrary[AW]?\s*\([^;\r\n]{0,80}wevtapi\.dll'

  - id: evt-open-channel-enum
    desc: EvtOpenChannelEnum channel enumerator token
    crit: notable
    conf: 0.95
    for: [binaries, source, scripts]
    if:
      type: text
      word: EvtOpenChannelEnum

  - id: evt-next-channel-path
    desc: EvtNextChannelPath channel iterator token
    crit: notable
    conf: 0.95
    for: [binaries, source, scripts]
    if:
      type: text
      word: EvtNextChannelPath

  - id: evt-clear-log
    desc: References EvtClearLog event channel clearer
    crit: notable
    conf: 0.95
    for: [binaries, source, scripts]
    if:
      type: text
      word: EvtClearLog

  - id: evt-open-channel-enum-call
    desc: Calls EvtOpenChannelEnum with a session argument
    crit: notable
    conf: 0.93
    for: [c, cpp, csharp, python, go, rust, powershell]
    if:
      type: text
      regex: '\w*EvtOpenChannelEnum(\.Call)?\s*\(\s*[\w.()\[\]:$&]+\s*,'

  - id: evt-next-channel-path-call
    desc: Calls EvtNextChannelPath on a channel handle
    crit: notable
    conf: 0.93
    for: [c, cpp, csharp, python, go, rust, powershell]
    if:
      type: text
      regex: '\w*EvtNextChannelPath(\.Call)?\s*\(\s*[\w.()\[\]:$&]+\s*,'

  - id: evt-clear-log-call
    desc: Calls EvtClearLog with a session argument
    crit: notable
    conf: 0.93
    for: [c, cpp, csharp, python, go, rust, powershell]
    if:
      type: text
      regex: '\w*EvtClearLog(\.Call)?\s*\(\s*[\w.()\[\]:$&]+\s*,'

  - id: evt-render-reference
    desc: References EvtRender event renderer
    crit: notable
    conf: 0.93
    for: [binaries, source, scripts]
    if:
      type: text
      word: EvtRender

  - id: evt-export-log-reference
    desc: References wevtapi event log export APIs
    crit: notable
    conf: 0.93
    for: [binaries, source, scripts]
    if:
      type: text
      regex: '\bEvt(ExportLog|ArchiveExportedLog)\b'

composite_rules:
  - id: event-log-write
    desc: References event source registration and event logging APIs
    crit: notable
    conf: 0.93
    all:
      - id: register-event-source
      - id: report-event
  - id: event-log-open
    desc: Windows event log access
    crit: notable
    conf: 0.94
    any:
      - id: open-event-log-api
      - id: open-event-log-import
  - id: event-log-clear
    desc: Windows event log clearing
    crit: notable
    conf: 0.96
    any:
      - id: clear-event-log-api
      - id: clear-event-log-import
  - id: evt-channel-enumeration
    desc: Enumerates Windows Event Log channels via wevtapi
    crit: notable
    conf: 0.96
    for: [binaries, source, scripts]
    all:
      - id: evt-open-channel-enum
      - id: evt-next-channel-path
  - id: evt-event-read-surface
    desc: References wevtapi event query and render APIs
    crit: notable
    conf: 0.94
    for: [binaries, source, scripts]
    all:
      - id: micro-behaviors/os/event/log::windows-event-query-reference
      - id: evt-render-reference
