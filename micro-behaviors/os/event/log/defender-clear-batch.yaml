defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-clear-defender-operational-log
    desc: Batch clears Defender Operational event log
    crit: notable
    conf: 0.96
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^wevtutil(\.exe)?\s+(cl|clear-log)\s+"?Microsoft-Windows-Windows Defender/Operational'
