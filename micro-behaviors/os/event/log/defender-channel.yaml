defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
traits:
  - id: defender-operational-log-channel
    desc: Defender Operational event log channel name
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)Microsoft-Windows-(Windows\s+)?Defender/Operational\b'
