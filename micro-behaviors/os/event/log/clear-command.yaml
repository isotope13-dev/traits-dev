defaults:
  platforms:
  - windows
traits:
- id: clear-eventlog
  desc: Clear-EventLog cmdlet reference
  crit: notable
  conf: 0.56
  for:
  - powershell
  if:
    type: text
    substr: Clear-EventLog
  unless:
  - id: metadata/file/naming::test-directory-component
  - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: well-known/app/utility/quicklook::release-path
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
composite_rules:
- id: windows-eventlog-clear-command-reference
  desc: Windows event-log clear command reference
  crit: notable
  conf: 0.9
  for:
  - binaries
  - scripts
  - source
  any:
  - id: wevtutil-clear-log-command
  - id: clear-eventlog
