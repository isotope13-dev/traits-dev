# Generic event-log operations; the channel supplies WebAuthn context in
# micro-behaviors/os/security/auth/passkey::windows-webauthn-event-query.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell, csharp, cpp, python, go, rust, pe, dll]
traits:
  - id: windows-event-query-call
    desc: Queries a Windows event log result set
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^(Get-WinEvent|EvtQuery|EvtNext)$'
  - id: windows-event-query-reference
    desc: References a Windows event log query API
    conf: 0.82
    if:
      type: text
      regex: '\b(EvtQuery|EvtNext)\b'
