# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - windows
  for:
  - powershell
  - batch
  - c
  - cpp
  - pe
  - dll
  - rust
traits:
- id: wevtutil-clear-log-command
  desc: Wevtutil clear-log command reference
  crit: notable
  conf: 0.9
  for:
  - binaries
  - scripts
  - source
  if:
    type: text
    # A printf-built command line glues the tool to its format placeholder
    # ("%wswevtutil cl %ws"), which defeats a plain leading word boundary.
    regex: '(?i)(^|[^a-z0-9]|%[lw]?s)wevtutil(\.exe)?\b[^\r\n]{0,30}\b(cl|clear-log)\b'
- id: rust-wevtutil-clear-argument-array
  desc: Rust passes clear-log arguments to wevtutil
  crit: notable
  conf: 0.92
  for: [rust]
  if:
    type: text
    regex: '(?i)wevtutil.{0,48}&\[\s*.{0,4}cl\b'
