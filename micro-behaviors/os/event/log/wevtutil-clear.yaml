# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - windows
  for:
  - powershell
  - batch
  - c
  - cpp
  - pe
  - dll
  - rust
traits:
- id: wevtutil-clear-log-command
  desc: Wevtutil clear-log command reference
  crit: notable
  conf: 0.9
  for:
  - binaries
  - scripts
  - source
  if:
    type: text
    regex: '(?i)\bwevtutil(\.exe)?\b[^\r\n]{0,30}\b(cl|clear-log)\b'
  unless:
  - id: metadata/build/docker::windows-container-agent-image-marker
  - id: micro-behaviors/process/create/shell/guard/
  - id: well-known/tool/detection/
  - id: well-known/app/ai/coding-agent/
- id: rust-wevtutil-clear-argument-array
  desc: Rust passes clear-log arguments to wevtutil
  crit: notable
  conf: 0.92
  for: [rust]
  if:
    type: text
    regex: '(?i)wevtutil.{0,48}&\[\s*.{0,4}cl\b'
