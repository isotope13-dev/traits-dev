# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  conf: 0.95
traits:
- id: wevtutil-disable-channel-command
  desc: Wevtutil channel-disable command reference
  if:
    type: text
    regex: \bwevtutil(\.exe)?['"]?\s+(sl|set-log)\b[^\r\n;|&]{0,256}[/-]e:false\b
    case_insensitive: true
  crit: notable
