# Windows Error Reporting queue and task references. Writing a report into
# ReportQueue and manually running QueueReporting is a rare diagnostic
# workflow; the hostile objective also requires the Defender exploit chain.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust]
  crit: notable
  conf: 0.94

traits:
  - id: wer-report-queue-path
    desc: References the Windows Error Reporting queue
    if:
      type: text
      regex: '(?i)ProgramData.{0,120}Microsoft.{0,48}Windows.{0,48}WER.{0,48}ReportQueue'

  - id: wer-report-file
    desc: References a Windows Error Reporting report file
    if:
      type: text
      substr: Report.wer

  - id: wer-queue-reporting-task
    desc: References the Windows WER QueueReporting task
    if:
      type: text
      word: QueueReporting

  - id: wer-registered-task-run
    desc: Runs a registered task through WER
    if:
      type: text
      regex: '(?is)IRegisteredTask.{0,256}\bRun\s*\('

composite_rules:
  - id: wer-report-queue-task-trigger
    desc: Queues a WER report and runs its task
    crit: notable
    conf: 0.97
    all:
      - id: wer-report-queue-path
      - id: wer-report-file
      - id: wer-queue-reporting-task
      - id: micro-behaviors/os/autorun/scheduled::itaskservice-interface
      - id: wer-registered-task-run
    near_bytes: 4096
