defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: dotnet-eventlog-session-type
    desc: References .NET event log session
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '(?i)EventLogSession'
  - id: dotnet-global-session-clear-call
    desc: Calls global session log clearer
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '(?i)::GlobalSession\s*\.\s*ClearLog\s*\('
  - id: winevent-all-log-pipeline
    desc: Enumerates all Windows event logs
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bGet-WinEvent\s+-ListLog\s+\*\s*\|'
  - id: pipeline-process-block
    desc: Pipeline invokes a typed process block
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\|\s*(ForEach-Object|%)\s*(-Process\s*)?\{\s*\['
  - id: clear-current-log-name
    desc: Clears current pipeline log name
    crit: component
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\.\s*ClearLog\s*\(\s*\$_\s*\.\s*LogName\s*\)'
composite_rules:
  - id: dotnet-eventlog-clear
    desc: Clears event logs through the .NET global session
    crit: notable
    near_bytes: 160
    all:
      - id: dotnet-eventlog-session-type
      - id: dotnet-global-session-clear-call
  - id: dotnet-pipeline-eventlog-clear
    desc: Clears enumerated event logs through a .NET session
    crit: notable
    near_bytes: 512
    all:
      - id: dotnet-eventlog-session-type
      - id: pipeline-process-block
      - id: clear-current-log-name
