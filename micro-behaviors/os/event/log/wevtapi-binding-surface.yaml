# Event-log binding libraries (.NET System.Diagnostics.EventLog, pywin32
# win32evtlog) expose the whole wevtapi surface: subscription, rendering,
# message formatting and publisher metadata beside channel enumeration and
# clearing. A wiper needs only the enumerate-and-clear trio.
defaults:
  platforms: [windows]
  for: [binaries, source, scripts]
  crit: baseline
  conf: 0.9
traits:
  - id: evt-subscribe-token
    desc: EvtSubscribe event subscription token
    if:
      type: text
      word: EvtSubscribe
  - id: evt-format-message-token
    desc: EvtFormatMessage message formatter token
    if:
      type: text
      word: EvtFormatMessage
  - id: evt-open-publisher-metadata-token
    desc: EvtOpenPublisherMetadata token
    if:
      type: text
      word: EvtOpenPublisherMetadata
composite_rules:
  - id: wevtapi-full-binding-surface
    desc: Exposes the full wevtapi event-log API
    all:
      - id: evt-subscribe-token
      # The canonical EvtRender atom lives beside the other wevtapi references.
      - id: evt-render-reference
      - id: evt-format-message-token
      - id: evt-open-publisher-metadata-token
