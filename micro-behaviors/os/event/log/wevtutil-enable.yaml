# Enabling a channel is distinct from querying, clearing, or disabling it.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.95

traits:
  - id: wevtutil-enable-channel-command
    desc: Wevtutil channel-enable command text
    if:
      type: text
      regex: '\bwevtutil(\.exe)?\s+(sl|set-log)\s+[^\r\n;|&]{1,180}\s+/e:true\b'
      case_insensitive: true
