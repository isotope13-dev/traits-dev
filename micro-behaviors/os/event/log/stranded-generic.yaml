composite_rules:
- id: native-open-and-clear-api-set
  desc: Native event-log open and clear API set
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/os/event/log::event-log-clear
  - id: micro-behaviors/os/event/log::event-log-open
  unless:
  - id: well-known/tool/reverse-engineering/dynamorio::balloon-memory-test-utility
  - id: well-known/lib/platform/microsoft-imagehlp::microsoft-debug-helper-dll
  - id: well-known/lib/platform/wine/
  - id: well-known/app/system/reactos::system-component
  - id: well-known/lib/native/pywin32::pywin32-binding-module
  for:
  - pe
  - dll
  - c
  - cpp
  platforms:
  - windows
