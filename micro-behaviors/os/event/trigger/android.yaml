defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
  crit: notable
  conf: 0.88

traits:
  - id: android-user-present-action
    desc: Android user-present event action
    for: [dex]
    if:
      type: text
      substr: "android.intent.action.USER_PRESENT"

  - id: android-screen-off-action
    desc: Android screen-off event action
    attack: T1628
    for: [dex]
    if:
      type: text
      substr: "android.intent.action.SCREEN_OFF"
