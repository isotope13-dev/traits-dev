defaults:
  platforms: [unix]
  for: [javascript]
  crit: notable
traits:
  - id: node-appends-immediate-shutdown
    desc: Appends an immediate shutdown command
    if:
      type: symbol
      kind: call
      regex: '(^|\.)appendFileSync$'
      arg:
        index: 1
        kind: string
        regex: '(^|\n)sudo[ \t]+shutdown[ \t]+-h[ \t]+0(\n|$)'
