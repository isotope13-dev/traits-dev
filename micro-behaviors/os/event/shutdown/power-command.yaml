defaults:
  platforms: [unix, windows]

traits:
  - id: shell-power-command
    desc: Shell invokes a power command
    for: [javascript, typescript, shell]
    crit: notable
    conf: 0.98
    if:
      type: text
      # A quoted property such as `key:"shutdown"` is a lifecycle API name,
      # not a shell command.  Shell command construction is still covered by
      # the command separators and js-exec-power-command.
      # A single '|' is not a separator here: keyword tables written as
      # 'shiftOut|shutdown|sin' (syntax highlighters) matched as commands.
      regex: '(?im)(^|[;&]|\|\|)[ \t]*(sudo[ \t]+)?(shutdown|reboot|poweroff|halt)(\s|$|[;&|])'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/lang/generated::generated-apollo-icon-enum-source
  - id: js-exec-power-command
    desc: JavaScript exec/spawn runs a power command
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      # Require exec/spawn as the callee name — `executeFlush(FlushType.Shutdown)`
      # in telemetry SDKs is not a shell power command.
      regex: '(?i)\b(exec|spawn)\s*\([^)]{0,80}\b(shutdown|reboot|poweroff|halt)\b'
