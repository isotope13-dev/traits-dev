defaults:
  platforms: [windows, unix]
  for: [javascript]
  size_min: 200
  size_max: 1000000

traits:
  - id: encoded-forced-shutdown-command
    desc: Base64 text contains forced shutdown command
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: base64
      exact: shutdown.exe /f /s /t 0
