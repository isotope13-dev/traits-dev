# These calls construct a Cmd; only Run/Start launches it. Windows power
# flags alone establish neither execution nor destructive intent.
defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.95
traits:
  - id: go-shutdown-restart-argument
    desc: Go constructs shutdown with restart argument
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '^shutdown(\.exe)?$'
        - kind: string
          exact: /r
  - id: go-shutdown-force-argument
    desc: Go constructs shutdown with force argument
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '^shutdown(\.exe)?$'
        - kind: string
          exact: /f
  - id: go-shutdown-zero-timeout-arguments
    desc: Go constructs shutdown with zero timeout
    if:
      type: tree-sitter
      language: go
      query: |
        (call_expression
          function: (selector_expression
            operand: (identifier) @pkg
            field: (field_identifier) @callee)
          arguments: (argument_list . (interpreted_string_literal) @exe
            (_)* (interpreted_string_literal) @timer .
            (interpreted_string_literal) @seconds)
          (#eq? @pkg "exec")
          (#eq? @callee "Command")
          (#match? @exe "^\"shutdown(\\.exe)?\"$")
          (#eq? @timer "\"/t\"")
          (#eq? @seconds "\"0\"")) @command
  - id: go-shutdown-restart-argument-context
    desc: Go constructs shutdown with restart argument
    if:
      type: symbol
      kind: call
      exact: exec.CommandContext
      args:
        - index: 1
          kind: string
          regex: '^shutdown(\.exe)?$'
        - kind: string
          exact: /r
  - id: go-shutdown-force-argument-context
    desc: Go constructs shutdown with force argument
    if:
      type: symbol
      kind: call
      exact: exec.CommandContext
      args:
        - index: 1
          kind: string
          regex: '^shutdown(\.exe)?$'
        - kind: string
          exact: /f
  - id: go-shutdown-zero-timeout-arguments-context
    desc: Go constructs shutdown with zero timeout
    if:
      type: tree-sitter
      language: go
      query: |
        (call_expression
          function: (selector_expression
            operand: (identifier) @pkg
            field: (field_identifier) @callee)
          arguments: (argument_list . (_) . (interpreted_string_literal) @exe
            (_)* (interpreted_string_literal) @timer .
            (interpreted_string_literal) @seconds)
          (#eq? @pkg "exec")
          (#eq? @callee "CommandContext")
          (#match? @exe "^\"shutdown(\\.exe)?\"$")
          (#eq? @timer "\"/t\"")
          (#eq? @seconds "\"0\"")) @command
