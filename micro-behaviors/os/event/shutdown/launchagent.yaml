defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class, c, cpp]
  crit: suspicious
  conf: 0.95
  attack: T1529

traits: []

composite_rules:
  - id: launchagent-power-onload
    desc: Loaded LaunchAgent runs power action at startup
    crit: suspicious
    conf: 0.95
    attack: T1543.004,T1529
    all:
      - id: micro-behaviors/os/event/shutdown::source-shutdown-command
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/start::launchctl-load-command

  - id: perl-launchagent-power-action
    desc: Perl package installs power-action LaunchAgent
    crit: suspicious
    conf: 0.95
    for: [perl, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/event/shutdown::source-shutdown-command
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/data/config/schema::plist-programarguments-key
      - id: micro-behaviors/process/create/system::system-process-call

  - id: jvm-launchagent-power-action
    desc: JVM LaunchAgent schedules power action
    crit: suspicious
    conf: 0.95
    for: [class, java_class, jar]
    scope: archive
    all:
      - id: micro-behaviors/os/event/shutdown::source-shutdown-command
      - id: micro-behaviors/os/service/launchagent::jvm-runatload-enabled-string
      - id: micro-behaviors/os/service/launchagent::jvm-startinterval-string
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode

  - id: launchagent-short-interval-power-action
    desc: LaunchAgent repeats power action within 15 min
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/os/event/shutdown::source-shutdown-command
      - id: micro-behaviors/os/service/launchagent::short-startinterval-setting
      - id: micro-behaviors/os/service/start::launchctl-load-command
