defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class, c, cpp]
  crit: suspicious
  conf: 0.95
  attack: T1529

composite_rules:
  - id: launchagent-power-onload
    desc: Startup LaunchAgent includes power-action code
    crit: suspicious
    conf: 0.95
    attack: T1543.004,T1529
    # Require a power action embedded in a plist argument or mapping.
    # Package bundles can separately implement remote power controls and a
    # RunAtLoad daemon; same-file co-occurrence does not mean startup shutdown.
    near_lines: 60
    all:
      - id: micro-behaviors/os/event/shutdown::launchd-power-command-argument
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key
      - id: micro-behaviors/os/service/start::launchctl-load-command

  - id: perl-launchagent-power-action
    desc: Perl package installs power-action LaunchAgent
    crit: suspicious
    conf: 0.95
    for: [perl, tar, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/event/shutdown::source-shutdown-command
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key
      - id: micro-behaviors/data/config/schema::plist-programarguments-key
      - id: micro-behaviors/process/create/exec::system-process-call

  - id: jvm-launchagent-power-action
    desc: JVM LaunchAgent configures power action
    crit: suspicious
    conf: 0.95
    for: [class, java_class, jar]
    scope: archive
    all:
      - id: micro-behaviors/os/event/shutdown::launchd-power-command-argument
      - id: micro-behaviors/os/service/launchagent::jvm-runatload-enabled-string
      - id: micro-behaviors/os/service/launchagent::jvm-startinterval-string
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode

  - id: launchagent-short-interval-power-action
    desc: LaunchAgent configures power action within 15 min
    crit: suspicious
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/os/event/shutdown::launchd-power-command-argument
      - id: micro-behaviors/os/service/launchagent::short-startinterval-setting
      - id: micro-behaviors/os/service/start::launchctl-load-command
