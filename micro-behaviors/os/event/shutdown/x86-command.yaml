traits:
- id: x86-forced-reboot-command-call
  desc: x86 call passes forced-reboot command
  crit: notable
  conf: 0.99
  platforms:
  - windows
  for:
  - pe
  if:
    type: yara
    source: "import \"pe\"\nrule x86_forced_reboot_command_argument {\n strings:\n  $command = \"shutdown -r -t 0 -f\" ascii\n\
      \  $invoke = { 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 59 6A 04 53 FF 15 ?? ?? ?? ?? E9 ?? ?? ?? ?? }\n condition:\n  for any\
      \ s in (0..pe.number_of_sections-1) : (\n   pe.sections[s].name == \".data\" and\n   for any c in (1..#invoke) : (\n\
      \    @invoke[c] >= pe.sections[s].raw_data_offset and\n    @invoke[c] < pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size\
      \ and\n    for any t in (1..#command) : (\n     pe.rva_to_offset(uint32(@invoke[c]+1)-pe.image_base) == @command[t]\n\
      \    )\n   )\n  )\n}"
