defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, elf, macho, shell]
  attack: T1529

traits:
  - id: unix-forced-reboot-command
    desc: Invokes forced Unix reboot command
    crit: notable
    conf: 0.94
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\breboot\s+-[a-z]*f[a-z]*\b'

  - id: unix-reboot-api
    desc: Invokes Unix reboot operation
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: reboot

  # The same import where the call graph does not resolve. A 32-bit ELF with
  # `reboot` in its symbol table imports it whether or not rizin can tie the
  # call site to it, and `kind: call` alone missed vxheaven's
  # Trojan.Linux.Reboot.a entirely. Almost nothing imports reboot(2): init
  # systems, shutdown tooling, and programs that want the machine to restart.
  - id: unix-reboot-import
    desc: Imports the Unix reboot function
    crit: notable
    conf: 0.85
    for: [elf, macho]
    if:
      type: symbol
      exact: reboot
