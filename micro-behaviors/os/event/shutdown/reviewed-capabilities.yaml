traits:
- platforms: &id001
  - windows
  for: &id002
  - pe
  id: shutdown-restart-flag
  desc: Binary text contains shutdown restart flags
  conf: 0.9
  if:
    type: text
    regex: shutdown.{0,30}-r
- platforms: *id001
  for: *id002
  id: shutdown-force-flag-pe
  desc: Binary text contains shutdown force flags
  conf: 0.9
  if:
    type: text
    regex: shutdown.{0,30}-f
- platforms: *id001
  for: *id002
  id: shutdown-zero-delay
  desc: Binary text contains shutdown with zero delay
  conf: 0.85
  if:
    type: text
    regex: shutdown.{0,50}-t\s*0\b
- platforms: [windows, unix]
  for: [go]
  id: go-shutdown-command-call
  desc: Go exec.Command targets shutdown executable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: exec.Command
    arg:
      index: 0
      kind: string
      regex: '^shutdown(\.exe)?$'
- platforms: [windows, unix]
  for: [go]
  id: go-shutdown-command-context-call
  desc: Go CommandContext targets shutdown
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: exec.CommandContext
    arg:
      index: 1
      kind: string
      regex: '^shutdown(\.exe)?$'
composite_rules:
- platforms: [windows, unix]
  for: [go]
  id: go-shutdown-command-construction
  desc: Go constructs shutdown process command
  conf: 0.95
  any:
  - id: go-shutdown-command-call
  - id: go-shutdown-command-context-call
- platforms: *id001
  for: *id002
  id: forced-reboot-command-pattern
  desc: Shutdown restart, force and zero-delay text co-occur
  conf: 0.93
  all:
  - id: micro-behaviors/os/event/shutdown::shutdown-restart-flag
  - id: micro-behaviors/os/event/shutdown::shutdown-force-flag-pe
  - id: micro-behaviors/os/event/shutdown::shutdown-zero-delay
defaults:
  crit: notable
