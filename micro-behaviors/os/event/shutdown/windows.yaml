defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
traits:
  # WSH/WMI reboot operations are neutral servicing capabilities.  Impact
  # intent belongs in composites that combine this with destructive behavior.
  - id: wmi-operatingsystem-reboot
    desc: Reboots the host via WMI Win32_OperatingSystem
    conf: 0.9
    attack: T1529
    mbc: B0029
    for: [vbs, javascript, powershell, batch]
    if:
      type: text
      regex: '(?i)Win32_OperatingSystem[\s\S]{0,240}\.Reboot\s*\('
  - id: wmi-win32shutdown-method
    desc: Calls the WMI Win32Shutdown method
    conf: 0.9
    attack: T1529
    mbc: B0029
    for: [vbs, javascript, powershell, batch]
    if:
      type: text
      regex: '(?i)\.Win32Shutdown\b'
  - id: shutdown-command-source
    desc: Windows shutdown command in source
    conf: 0.9
    for: [pe, dll, c, cpp, batch, powershell, python, javascript]
    if:
      type: text
      regex: '(?i)\bshutdown(\.exe)?\b[^\r\n]{0,100}/[srf]\b'
  - id: shutdown-hibernate-command
    desc: Shutdown command requests hibernation
    conf: 0.95
    attack: T1529
    mbc: B0029
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)\bshutdown(\.exe)?\s+/h\b'
  - id: rundll32-hibernate-command
    desc: Rundll32 requests system hibernation
    conf: 0.96
    attack: T1529
    mbc: B0029
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)\brundll32(\.exe)?\s+powrprof\.dll,\s*SetSuspendState\b'
  - id: set-suspend-state-api
    desc: Windows power API requests system suspension
    conf: 0.92
    attack: T1529
    mbc: B0029
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: symbol
      exact: SetSuspendState
  - id: dotnet-shutdown-command-start
    desc: .NET starts the Windows shutdown command
    conf: 0.9
    for: [csharp]
    if:
      type: symbol
      kind: call
      exact: Process.Start
      arg:
        kind: string
        exact: shutdown
  - id: dotnet-logoff-command-start
    desc: .NET starts the Windows logoff command
    conf: 0.9
    for: [csharp]
    if:
      type: symbol
      kind: call
      exact: Process.Start
      arg:
        kind: string
        exact: /l

  # AbortSystemShutdownW cancels an in-progress system shutdown started by
  # InitiateSystemShutdown.  Rare outside system utilities; seeing it appear
  # in a supply-chain diff is a strong purpose-change signal.
  - id: abort-system-shutdown-w
    desc: Cancel an in-progress system shutdown
    conf: 0.8
    if:
      type: symbol
      kind: import
      exact: AbortSystemShutdownW
  - id: register-application-restart
    desc: Import RegisterApplicationRestart API
    conf: 0.85
    if:
      type: import
      exact: RegisterApplicationRestart
  - id: set-process-shutdown-parameters
    desc: Import SetProcessShutdownParameters API
    conf: 0.85
    if:
      type: import
      exact: SetProcessShutdownParameters
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: ewx-restartapps-flag
    desc: EWX_RESTARTAPPS restart flag
    conf: 0.85
    for: [pe, dll, source]
    if:
      type: text
      substr: EWX_RESTARTAPPS

  - id: restart-manager-start-session
    desc: Starts a Restart Manager session
    conf: 0.95
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: RmStartSession

  - id: restart-manager-register-resources
    desc: Registers resources with Restart Manager
    conf: 0.95
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: RmRegisterResources

  - id: restart-manager-get-list
    desc: Lists apps using Restart Manager resources
    conf: 0.95
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: RmGetList

  - id: restart-manager-shutdown
    desc: Requests Restart Manager application shutdown
    conf: 0.95
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: RmShutdown

  - id: abort-system-shutdown-text
    desc: AbortSystemShutdown API reference
    conf: 0.82
    for: [pe, dll, source]
    if:
      type: text
      regex: AbortSystemShutdown[AW]?

composite_rules:
  - id: application-restart-registration
    desc: Registers Windows application restart behavior
    conf: 0.92
    all:
      - id: register-application-restart
      - id: set-process-shutdown-parameters
