defaults:
  platforms: [windows]
  for: [html, javascript, vbs, batch, powershell]
  attack: T1529
traits:
  - id: rundll-user-exitwindows-command
    desc: RUNDLL command invokes USER ExitWindows
    crit: notable
    conf: 0.99
    for: [text, batch, html, javascript, vbs, powershell]
    if:
      type: text
      exclude_html_comments: true
      # ExitWindowsExec is the same USER logoff export with an optional
      # restart program. A bare name still only logs the session off.
      # Both loader spellings reach the same USER export: the 16-bit
      # `rundll` and the Win9x `rundll32`.
      regex: '(?i)\brundll(32)?(\.exe)?\s+([^\s,]{0,80}\\)?user(\.exe)?\s*,\s*exitwindows(exec)?\b'
  # Win16 user.exe ordinal 7 is ExitWindows. Batch logoff trojans call it
  # as `rundll user,#7` or `rundll32 user.exe,#7` instead of the named
  # export.
  - id: rundll-user-ordinal-exitwindows
    desc: RUNDLL calls USER ExitWindows by ordinal
    crit: suspicious
    conf: 0.97
    for: [text, batch, html, javascript, vbs, powershell]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\brundll(32)?(\.exe)?\s+([^\s,]{0,80}\\)?user(\.exe)?\s*,\s*#7\b'
