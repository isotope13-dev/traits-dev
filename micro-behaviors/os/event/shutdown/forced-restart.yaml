defaults:
  platforms: [windows]
  for: [scripts, source, binaries, oledoc]
  crit: notable
  conf: 0.96
traits:
  - id: shutdown-forced-restart-command
    desc: Shutdown command forces a Windows restart
    if:
      type: text
      regex: '(?i)\bshutdown(\.exe)?\b[^\r\n]{0,40}[-/]r\b[^\r\n]{0,40}[-/]f\b'
  # Win32 source defining a forced ExitWindowsEx reboot or power-off mask.
  # Either flag order counts, and EWX_FORCE alone is ordinary logoff code.
  - id: ewx-reboot-force-flags
    desc: Source ORs reboot or power-off with EWX_FORCE
    for: [c, cpp]
    if:
      type: text
      regex: 'EWX_(REBOOT|SHUTDOWN|POWEROFF)\b[^\r\n]{0,40}EWX_FORCE\b'
  - id: ewx-force-reboot-flags
    desc: Source ORs EWX_FORCE with reboot or power-off
    for: [c, cpp]
    if:
      type: text
      regex: 'EWX_FORCE\b[^\r\n]{0,40}EWX_(REBOOT|SHUTDOWN|POWEROFF)\b'
  - id: rust-shutdown-forced-restart-argument-array
    desc: Rust source passes forced-restart arguments
    for: [rust]
    if:
      type: text
      regex: '(?i)shutdown.{0,40}&\[[^\]]{0,180}/r[^\]]{0,120}/f'
