defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.96
traits:
  - id: shutdown-forced-restart-command
    desc: Shutdown command forces a Windows restart
    if:
      type: text
      regex: '(?i)\bshutdown(\.exe)?\b[^\r\n]{0,40}[-/]r\b[^\r\n]{0,40}[-/]f\b'
  - id: rust-shutdown-forced-restart-argument-array
    desc: Rust source passes forced-restart arguments
    for: [rust]
    if:
      type: text
      regex: '(?i)shutdown.{0,40}&\[[^\]]{0,180}/r[^\]]{0,120}/f'
