# A far transfer to the BIOS reset vector restarts the CPU without DOS
# cleanup. The physical address has more than one segment:offset spelling.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1529
traits:
  - id: dos-reset-vector-reboot-jump
    desc: DOS transfers to the BIOS reset vector
    conf: 0.92
    if:
      type: yara
      source: |
        rule dos_reset_vector_reboot_jump {
          meta:
            filetypes = "dos_com,data"
          strings:
            $reset = { ( EA 00 00 FF FF | EA F0 FF 00 F0 | 68 00 F0 68 F0 FF CB | B8 00 F0 50 B8 F0 FF 50 CB ) }
          condition:
            $reset
        }
