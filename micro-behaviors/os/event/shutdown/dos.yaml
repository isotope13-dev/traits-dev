# A far jump to FFFFh:0000h restarts the CPU through the reset vector: the
# DOS-era forced reboot that destructive payloads use once the damage is
# written, since no DOS API call is needed and no cleanup runs.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
  attack: T1529
traits:
  - id: dos-reset-vector-reboot-jump
    desc: DOS jumps to the CPU reset vector
    conf: 0.92
    if:
      type: hex
      pattern: "EA 00 00 FF FF"
