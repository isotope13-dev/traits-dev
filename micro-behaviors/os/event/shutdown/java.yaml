defaults:
  platforms: [unix]
  for: [class, java_class]
  attack: T1529
  mbc: B0029

traits:
  - id: jvm-reboot-command-string
    desc: JVM reboot command string
    crit: notable
    conf: 0.88
    if:
      # Class strings are pre-cached. Require command position so a cron
      # schedule such as `@reboot /usr/bin/agent` is not a reboot command.
      type: value
      path: class.strings[*]
      regex: '(?i)(^|[;&|]\s*|(sudo|exec)\s+)(/(usr/)?sbin/)?reboot(\s|$)'
