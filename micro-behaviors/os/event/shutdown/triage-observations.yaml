defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: shutdown-privilege-reboot-api
  desc: Shutdown privilege and reboot API references
  crit: notable
  conf: 0.94
  all:
    - id: micro-behaviors/ui/window/control::exit-windows-ex
    - id: micro-behaviors/os/privilege/reference::shutdown-privilege-name
    - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
    - id: micro-behaviors/os/privilege/token/use::lookup-privilege-value
  downgrade:
    any:
      - id: metadata/signature/verified/signer::x-ways-software-technology-aktiengesellschaft
      # Endpoint-security and OEM tools (Norton, antivirus installers)
      # legitimately enable SeShutdownPrivilege + ExitWindowsEx to reboot
      # after definition/driver updates.
      - id: metadata/signature/verified/signer::nortonlifelock-inc.
