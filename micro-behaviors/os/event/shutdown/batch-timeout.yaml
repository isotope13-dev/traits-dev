defaults:
  for: [batch]
  platforms: [windows]
  crit: notable
traits:
  - id: batch-positive-shutdown-timeout
    desc: Batch shutdown has positive timeout
    conf: 0.96
    # Literal argument presence, not successful scheduling. Current Windows
    # implies /f when /t > 0; the timeout alone is a normal power capability.
    if:
      type: tree-sitter
      language: batch
      query: |
        (cmd
          (command_name) @tool
          (argument_list
            [(command_option) (argument_value)] @timer
            . (argument_value) @seconds)
          (#match? @tool "(?i)^shutdown(\\.exe)?$")
          (#match? @timer "(?i)^[-/]t$")
          (#match? @seconds "^[0-9]*[1-9][0-9]*$"))
