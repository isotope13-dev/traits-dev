# Require the power command inside a plist argument, rather than an unrelated
# restart helper elsewhere in a service installer. Source may split XML into
# separately quoted strings; each command argument is still a single fragment.
defaults:
  platforms: [macos]
  for: [scripts, source, class]
  crit: notable
  conf: 0.96
traits:
  - id: launchd-applescript-power-argument
    desc: Plist argument contains AppleScript power action
    if:
      type: text
      regex: '<string>tell application [^<]{1,80} to (restart|shut down)</string>'
  - id: launchd-shutdown-power-argument
    desc: Plist argument contains shutdown command
    if:
      type: text
      regex: '<string>[^<]{0,80}shutdown\s+-h[^<]{0,40}</string>'
  - id: launchd-mapping-power-argument
    desc: ProgramArguments mapping includes power action
    for: [python, javascript, ruby]
    if:
      type: text
      regex: '[''"]ProgramArguments[''"]\s*:\s*\[[^\]]{1,180}to (restart|shut down)'
  - id: launchd-mapping-shutdown-argument
    desc: ProgramArguments mapping contains shutdown
    for: [python, javascript, ruby]
    if:
      type: text
      regex: '[''"]ProgramArguments[''"]\s*:\s*\[[^\]]{1,180}shutdown\s+-h'
composite_rules:
  - id: launchd-power-command-argument
    desc: Launchd argument configures a power action
    any:
      - id: launchd-applescript-power-argument
      - id: launchd-shutdown-power-argument
      - id: launchd-mapping-power-argument
      - id: launchd-mapping-shutdown-argument
