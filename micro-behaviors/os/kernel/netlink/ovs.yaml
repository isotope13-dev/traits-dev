# Open vSwitch Generic Netlink and action construction capabilities. These are
# neutral mechanics; the malformed-length and kernel-credential combinations
# belong to the privilege-escalation composites that consume them.
defaults:
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]

traits:
  - id: ovs-family-name
    desc: Open vSwitch Generic Netlink family name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bovs_(datapath|flow|packet)\b'

  - id: ovs-flow-action-list
    desc: OVS flow action-list transport field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(OVS_FLOW_ATTR_ACTIONS|OVS_FLOW_CMD_(NEW|SET|GET))\b'

  - id: ovs-clone-action
    desc: OVS CLONE action constant
    crit: notable
    conf: 0.92
    if:
      type: text
      word: OVS_ACTION_ATTR_CLONE

  - id: ovs-conntrack-action
    desc: OVS conntrack action constant
    crit: notable
    conf: 0.92
    if:
      type: text
      word: OVS_ACTION_ATTR_CT

  - id: ovs-conntrack-builder-call
    desc: Builds an OVS conntrack action
    crit: notable
    conf: 0.9
    if:
      type: text
      # (^|[^a-zA-Z]) rather than \w* before the token: a bare \w* prefix lets
      # this match the tail of unrelated identifiers like inject_action( or
      # correct_action( (both end in "ct_action("), which is not OVS at all.
      # Lookbehind isn't available in the linear-time engine, so an anchored
      # alternation stands in for it.
      regex: '(^|[^a-zA-Z])ct_action\s*\('

  - id: ovs-conntrack-repeat
    desc: Repeats OVS conntrack action construction
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(^|[^a-zA-Z])ct_action\s*\([^\n]{0,80}\)\s*\*\s*\('

  - id: ovs-conntrack-c-loop
    desc: C loop builds OVS conntrack actions
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'for\s*\([^)]{0,40}\)\s*\{[\s\S]{0,40}(^|[^a-zA-Z])ct_action\s*\('

  - id: ovs-conntrack-python-loop
    desc: Python loop builds OVS conntrack actions
    crit: suspicious
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'for\s+\w+\s+in\s+.{0,70}:[\s\S]{0,120}(^|[^a-zA-Z])ct_action\s*\('

  - id: netlink-length-header-serialization
    desc: 16-bit Netlink header serialization
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'NLA_HDR\s*=\s*["'']HH["'']'

  - id: c-nla-length-field
    desc: References or writes the nla_len field
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, elf]
    if:
      type: text
      regex: '(?is)\bstruct\s+nlattr\b.{0,160}\bnla_len\b|\bnla_len\s*(=|&=|\|=)'

  - id: ovs-set-action
    desc: OVS SET action constant
    crit: notable
    conf: 0.9
    if:
      type: text
      word: OVS_ACTION_ATTR_SET

  - id: ovs-output-action
    desc: OVS OUTPUT action constant
    crit: notable
    conf: 0.9
    if:
      type: text
      word: OVS_ACTION_ATTR_OUTPUT

  - id: ovs-tunnel-info-key
    desc: OVS tunnel-info key constant
    crit: notable
    conf: 0.9
    if:
      type: text
      word: OVS_KEY_ATTR_TUNNEL_INFO

  - id: ovs-conntrack-helper
    desc: OVS conntrack helper attribute
    crit: notable
    conf: 0.9
    if:
      type: text
      word: OVS_CT_ATTR_HELPER

composite_rules:
  - id: netlink-attribute-header
    desc: Netlink attribute header structure
    crit: notable
    conf: 0.92
    any:
      - id: netlink-length-header-serialization
      - id: c-nla-length-field

  - id: ovs-conntrack-expansion
    desc: Repeated OVS conntrack action expansion
    crit: suspicious
    conf: 0.96
    all:
      - id: ovs-conntrack-builder-call
    any:
      - id: ovs-conntrack-repeat
      - id: ovs-conntrack-c-loop
      - id: ovs-conntrack-python-loop
    near_lines: 48
