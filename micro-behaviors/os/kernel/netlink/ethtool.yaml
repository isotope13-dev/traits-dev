# Linux ethtool Generic Netlink and stacked virtual-interface RTNetlink
# capabilities. These primitives are legitimate in network-management tools;
# privilege-escalation composites supply the unprivileged namespace race and
# kernel-heap reclamation context.
defaults:
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]

traits:
  - id: ethtool-genl-family-source
    desc: Selects ethtool Generic Netlink family
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, python]
    if:
      type: text
      regex: '["'']ethtool["'']|\bETHTOOL_GENL_NAME\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: ethtool-genl-family-elf
    desc: Embeds ethtool Netlink family string
    crit: notable
    conf: 0.88
    for: [elf]
    if:
      type: text
      exact: ethtool

  - id: ethtool-features-set-constant
    desc: References ETHTOOL_MSG_FEATURES_SET constant
    crit: notable
    conf: 0.94
    for: [c, cpp, rust, go, python]
    if:
      type: text
      regex: '\b(ETHTOOL_MSG_FEATURES_SET|ETHTOOL_A_FEATURES_(HEADER|WANTED))\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: virt-wifi-link-kind
    desc: References Linux virt_wifi link driver
    crit: notable
    conf: 0.94
    if:
      type: text
      # Matches "virt_wifi" in source/scripts and 8-byte immediate "virt_wif"
      # emitted when optimizing compilers inline 9-byte memcpy(..., "virt_wifi", 9).
      substr: virt_wif
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/compiled::linux-kernel-banner

  - id: rtm-dellink-constant
    desc: References RTM_DELLINK Netlink constant
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, python]
    if:
      type: text
      word: RTM_DELLINK
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

composite_rules:
  - id: ethtool-genl-family
    desc: Targets Linux ethtool Generic Netlink
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/socket/family::linux-generic-netlink
    any:
      - id: ethtool-genl-family-source
      - id: ethtool-genl-family-elf
      - id: ethtool-features-set-constant
