# Kernel code writing 0 into a process credential's real or saved UID:
# handing an arbitrary process root without setuid(2)'s checks.
defaults:
  platforms: [unix]
  for: [c]
  conf: 0.9

traits:
  - id: posix-cred-uid-zeroed
    desc: Writes UID 0 into a process credential
    crit: notable
    attack: T1068
    if:
      type: text
      regex: '->cr_(ruid|svuid|uid)\s*=\s*0\s*;[\s\S]{0,120}->cr_(ruid|svuid|uid)\s*=\s*0\s*;'

  # Taking a reference on another process's kauth credential and reaching
  # its POSIX view: the lookup that precedes rewriting it in place.
  - id: xnu-process-posix-cred-lookup
    desc: Reads a process's kauth POSIX credential
    crit: notable
    if:
      type: text
      regex: 'kauth_cred_proc_ref\s*\([\s\S]{0,200}posix_cred_get\s*\('
