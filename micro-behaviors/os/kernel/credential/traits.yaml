# Kernel credential structure fields are neutral observations. The
# privilege-escalation objective supplies the corruption/decrement context.
defaults:
  crit: notable
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]

traits:
  - id: prepare-kernel-cred
    desc: prepare_kernel_cred symbol reference
    platforms: [linux, openwrt]
    if:
      type: text
      word: prepare_kernel_cred

  - id: task-credential-pointer
    desc: References a task credential pointer
    conf: 0.92
    if:
      type: text
      regex: '\btask[_-]cred\b|\btask\s*\+\s*(offsets\.)?task[_-]cred\b'

  - id: credential-fsuid-field
    desc: References the credential fsuid field
    conf: 0.92
    if:
      type: text
      regex: '\bcred_fsuid\b|->fsuid\b'

  - id: credential-fsgid-field
    desc: References the credential fsgid field
    conf: 0.92
    if:
      type: text
      regex: '\bcred_fsgid\b|->fsgid\b'

  - id: bsd-credential-uid-field
    desc: References BSD kernel cr_uid field
    conf: 0.95
    platforms: [unix]
    for: [c]
    if:
      type: text
      word: cr_uid


  - id: bsd-credential-uid-write
    desc: Writes a BSD kernel cr_uid field
    conf: 0.95
    platforms: [unix]
    for: [c]
    if:
      type: tree-sitter
      query: |
        (assignment_expression
          left: (field_expression field: (field_identifier) @field)
          (#eq? @field "cr_uid")) @write
        (update_expression
          argument: (field_expression field: (field_identifier) @field)
          (#eq? @field "cr_uid")) @update

  - id: bsd-process-pcred-field-access
    desc: References BSD process p_cred field
    conf: 0.95
    platforms: [unix]
    for: [c]
    if:
      type: text
      regex: '(->|\.)p_cred\b'

  - id: bsd-process-ucred-field-access
    desc: References BSD process credential field
    conf: 0.95
    platforms: [unix]
    for: [c]
    if:
      type: text
      regex: '(->|\.)pc?_ucred\b'

  - id: commit-creds
    desc: commit_creds primitive reference
    platforms: [linux, openwrt]
    for: [elf, c, cpp]
    conf: 0.8
    if:
      type: text
      word: commit_creds

composite_rules:
  - id: commit-creds-prepare-kernel-cred-pair
    desc: commit_creds beside prepare_kernel_cred
    crit: notable
    conf: 0.94
    platforms: [linux, openwrt]
    for: [elf, c, cpp]
    near_bytes: 128
    all:
      - id: micro-behaviors/os/kernel/credential::commit-creds
      - id: micro-behaviors/os/kernel/credential::prepare-kernel-cred
    unless:
      # GEF resolves kernel symbols such as commit_creds/prepare_kernel_cred in
      # order to print their addresses; the recognized tool identity carries
      # this reference data.
      - id: well-known/tool/offensive/gef::gef-gdb-script
