# Kernel credential structure fields are neutral observations. The
# privilege-escalation objective supplies the corruption/decrement context.
defaults:
  crit: notable
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]

traits:
  - id: task-credential-pointer
    desc: References a task credential pointer
    conf: 0.92
    if:
      type: text
      regex: '\btask[_-]cred\b|\btask\s*\+\s*(offsets\.)?task[_-]cred\b'

  - id: credential-fsuid-field
    desc: References the credential fsuid field
    conf: 0.92
    if:
      type: text
      regex: '\bcred_fsuid\b|->fsuid\b'

  - id: credential-fsgid-field
    desc: References the credential fsgid field
    conf: 0.92
    if:
      type: text
      regex: '\bcred_fsgid\b|->fsgid\b'

  - id: bsd-credential-uid-field
    desc: References BSD kernel cr_uid field
    conf: 0.95
    platforms: [unix]
    for: [c]
    if:
      type: text
      word: cr_uid
