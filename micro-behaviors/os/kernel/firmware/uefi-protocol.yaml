# UEFI protocol GUIDs embedded as 16-byte constants. A UEFI image imports
# nothing: it reaches every platform service through gBS->LocateProtocol /
# HandleProtocol keyed on a GUID, so the GUID table is the only static view of
# what a firmware image can actually do. Symbol- and import-based capability
# traits are structurally blind here — metadata/binary/metrics/structural
# ::no-imports fires on every EFI image.
#
# These are neutral capabilities: EDK2's own drivers and every vendor boot
# application carry them. They exist so a firmware sample stops reading as
# "structure only" in triage, and so firmware-implant composites have real legs
# to stand on — an ESP dropper is simple-filesystem, a beaconing bootkit is
# simple-network, a chainloader is load-file plus loaded-image.
#
# The mixed-endian UEFI GUID encoding is used (first three fields little-endian,
# last two big-endian), which is how the constant is laid out in the image.
# `section: data` is a fuzzy name match covering .data / .rdata / .rodata, where
# both EDK2/GNU-EFI and MSVC toolchains emit the protocol GUID table.
#
# `platforms: [windows]` is a schema requirement of `for: [pe]`, not a claim
# about where these run — EFI images are PE/COFF but execute pre-boot.
defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: uefi-loaded-image-protocol
    desc: EFI loaded-image protocol GUID
    if:
      type: hex
      section: data
      pattern: "A1 31 1B 5B 62 95 D2 11 8E 3F 00 A0 C9 69 72 3B"

  - id: uefi-simple-file-system-protocol
    desc: EFI simple-filesystem protocol GUID
    if:
      type: hex
      section: data
      pattern: "22 5B 4E 96 59 64 D2 11 8E 39 00 A0 C9 69 72 3B"

  - id: uefi-simple-network-protocol
    desc: EFI simple-network protocol GUID
    if:
      type: hex
      section: data
      pattern: "B9 32 98 A1 25 AC D3 11 9A 2D 00 90 27 3F C1 4D"

  - id: uefi-load-file-protocol
    desc: EFI load-file protocol GUID
    if:
      type: hex
      section: data
      pattern: "91 30 EC 56 4C 95 D2 11 8E 3F 00 A0 C9 69 72 3B"
