defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-driver-device-control-dispatch-replacement
    desc: Saves and replaces device-control dispatch
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '48 8B 81 E0 00 00 00 48 89 05 ?? ?? ?? ?? [0-20] 48 8D 05 ?? ?? ?? ?? 48 89 81 E0 00 00 00'
  - id: x64-smart-storage-query-dispatch
    desc: SMART and storage-property IOCTL comparisons
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8B 47 18 3D 88 C0 07 00 74 ?? 3D 00 14 2D 00'
  - id: x64-irp-status-not-supported-completion
    desc: IRP completion returns STATUS_NOT_SUPPORTED
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'B8 BB 00 00 C0 C7 43 30 BB 00 00 C0'
