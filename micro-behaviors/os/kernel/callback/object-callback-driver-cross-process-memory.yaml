# A kernel driver that both intercepts handle opens and copies memory across
# processes.
#
# ObRegisterCallbacks lets a driver see -- and rewrite -- the access mask on
# every handle opened to a process or thread, and MmCopyVirtualMemory is the
# undocumented ntoskrnl export that reads or writes another process's address
# space from kernel mode. Endpoint products register the callbacks; debuggers
# and cheat engines want the memory copy. A driver carrying both is positioned
# to decide who may touch a process *and* to touch it itself, without the
# usual user-mode handle and protection checks.
#
# Scored notable: an EDR driver legitimately registers object callbacks and
# does read process memory, so this pairing describes the capability rather
# than settling intent. What settles it is context the composite deliberately
# leaves to its neighbours -- who signed the driver, and what loads it. The
# SharpOD debugger plugin ships exactly this driver alongside a revoked
# signing certificate.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: object-callback-driver-cross-process-memory
    desc: Driver callback and cross-process memory APIs
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/os/kernel/callback::object-handle-callback-registration
      - id: micro-behaviors/mem/read/cross-process::mm-copy-virtual-memory
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-nt-kernel-image
