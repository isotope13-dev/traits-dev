defaults:
  platforms: [windows]
  for: [binaries, c, cpp]

traits:
- id: filesystem-minifilter-control--ioregisterfsregistrationchange
  desc: Filesystem (IoRegisterFsRegistrationChange)
  crit: notable
  conf: 0.95
  if:
    type: text
    word: IoRegisterFsRegistrationChange
  unless:
  - id: metadata/library/generated::winmd-metadata
- id: filesystem-minifilter-control--fltregisterfilter
  desc: Filesystem filter (FltRegisterFilter)
  crit: notable
  conf: 0.95
  if:
    type: text
    word: FltRegisterFilter
  unless:
  - id: metadata/library/generated::winmd-metadata
- id: filesystem-minifilter-control--fltstartfiltering
  desc: Filesystem filter (FltStartFiltering)
  crit: notable
  conf: 0.95
  if:
    type: text
    word: FltStartFiltering
  unless:
  - id: metadata/library/generated::winmd-metadata
- id: filesystem-directory-control-operation
  desc: Intercept directory enumeration IRP
  crit: notable
  conf: 0.96
  for: [binaries, c, cpp, rust, go, csharp]
  if:
    type: text
    word: IRP_MJ_DIRECTORY_CONTROL
  unless:
  - id: metadata/library/generated::winmd-metadata
- id: directory-entry-information-structure
  desc: Reference directory entry information structure
  crit: notable
  conf: 0.94
  for: [binaries, c, cpp, rust, go, csharp]
  if:
    type: text
    regex: '\bP?FILE_(DIRECTORY|FULL_DIR|BOTH_DIR|ID_BOTH_DIR)_INFORMATION\b'
  unless:
  - id: metadata/library/generated::winmd-metadata
- id: directory-entry-offset-field
  desc: Advance directory entry buffer by offset
  crit: notable
  conf: 0.94
  for: [binaries, c, cpp, rust, go, csharp]
  if:
    type: text
    word: NextEntryOffset
  unless:
  - id: metadata/library/generated::winmd-metadata
- id: directory-entry-name-length-field
  desc: Read directory entry name length
  crit: notable
  conf: 0.94
  for: [binaries, c, cpp, rust, go, csharp]
  if:
    type: text
    word: FileNameLength
  unless:
  - id: metadata/library/generated::winmd-metadata
composite_rules:
- id: directory-entry-buffer-walk
  desc: Walk directory entry information buffer
  crit: notable
  conf: 0.96
  all:
  - id: directory-entry-information-structure
  - id: directory-entry-offset-field
  - id: directory-entry-name-length-field
  unless:
  - id: metadata/library/generated::winmd-metadata
- id: filesystem-minifilter-control
  desc: Filesystem filter registration
  crit: notable
  conf: 0.95
  any:
  - id: filesystem-minifilter-control--ioregisterfsregistrationchange
  - id: filesystem-minifilter-control--fltregisterfilter
  - id: filesystem-minifilter-control--fltstartfiltering
  unless:
  - id: metadata/library/generated::winmd-metadata
