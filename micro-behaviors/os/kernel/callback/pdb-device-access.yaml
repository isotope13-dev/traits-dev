defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust]

composite_rules:
  - id: pdb-driver-callback-access
    desc: Kernel PDB symbol APIs, callback-array names and device I/O co-occur
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/fs/file/handle::kernel-device-io-control
      - id: micro-behaviors/os/kernel/debug::windows-kernel-pdb-symbol-resolution
      - id: micro-behaviors/os/kernel/callback::internal-notify-callback-arrays

  # Symbol lookup plus a writable driver channel warrants investigation.
  # It does not bind an IOCTL write to a notification-array slot: debuggers,
  # forensic clients and incomplete reconstructions share these primitives.
  - id: pdb-callback-writable-driver-access
    desc: Kernel callback lookup with driver read/write IOCTL references
    crit: suspicious
    conf: 0.99
    for: [pe, dll, c, cpp]
    all:
      - id: micro-behaviors/os/kernel/device::vulnerable-driver-device-client
      - id: micro-behaviors/os/kernel/device::pdfwkrnl-kernel-memory-ioctl-pair
      - id: micro-behaviors/os/kernel/debug::windows-kernel-pdb-symbol-resolution
      - id: micro-behaviors/os/kernel/callback::internal-notify-callback-arrays

