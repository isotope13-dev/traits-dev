defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust]

composite_rules:
  - id: pdb-driver-callback-access
    desc: Kernel PDB symbol APIs, callback-array names and device I/O co-occur
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/kernel/device::kernel-device-io-control
      - id: micro-behaviors/os/kernel/debug::windows-kernel-pdb-symbol-resolution
      - id: micro-behaviors/os/kernel/callback::internal-notify-callback-arrays

  # Symbol lookup plus a writable driver channel warrants investigation.
  # It does not bind an IOCTL write to a notification-array slot: debuggers,
  # forensic clients and incomplete reconstructions share these primitives.
  - id: pdb-callback-writable-driver-access
    desc: Kernel callback lookup with driver read/write IOCTL references
    crit: suspicious
    conf: 0.99
    for: [pe, dll, c, cpp]
    all:
      - id: micro-behaviors/os/kernel/device::vulnerable-driver-device-client
      - id: micro-behaviors/os/kernel/device::pdfwkrnl-kernel-memory-ioctl-pair
      - id: micro-behaviors/os/kernel/debug::windows-kernel-pdb-symbol-resolution
      - id: micro-behaviors/os/kernel/callback::internal-notify-callback-arrays


  # A user-mode program that names the undocumented Psp*/Cm* callback tables,
  # resolves the kernel image, and talks to a driver can read those tables
  # through that driver. Anti-rootkit scanners and malware removers (which
  # inspect callbacks registered by rootkits) share this shape with EDR
  # killers; nothing here proves the slots are modified or whose callbacks
  # are targeted, so intent is left to objectives/evasion/anti-av/driver.
  - id: userland-driver-callback-array-access
    desc: Driver client resolves kernel callback arrays
    crit: suspicious
    conf: 0.95
    attack: T1562.001
    for: [pe, dll, c, cpp, rust, go, csharp, python, powershell]
    all:
      - id: micro-behaviors/os/kernel/callback::any-internal-kernel-callback-table
      - id: micro-behaviors/fs/file/handle::device-io-control-win32-or-nt
      - id: micro-behaviors/os/kernel/callback::kernel-base-or-image-resolution
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
      - id: micro-behaviors/os/kernel/device::vulnerable-driver-device
      - id: micro-behaviors/os/service/start::start-service
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-nt-kernel-image
      - id: metadata/signature/verified/platform::microsoft
