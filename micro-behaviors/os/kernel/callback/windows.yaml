defaults:
  platforms: [windows]
  # Driver source declares these registrations with the same API names the
  # compiled import table carries, so the atoms are scoped to both.
  for: [pe, dll, c, cpp, rust]
traits:
  - id: process-notify-routine
    desc: Register process creation callback
    crit: notable
    conf: 0.95
    attack: "T1057"
    if:
      type: symbol
      exact: "PsSetCreateProcessNotifyRoutine"
  - id: process-notify-routine-ex
    desc: Register extended process callback
    crit: notable
    conf: 0.95
    attack: "T1057"
    if:
      type: symbol
      exact: "PsSetCreateProcessNotifyRoutineEx"
  - id: image-load-notify-routine
    desc: Register image load callback
    crit: notable
    conf: 0.95
    attack: "T1574"
    if:
      type: symbol
      exact: "PsSetLoadImageNotifyRoutine"
  - id: registry-callback
    desc: Register registry operation callback
    crit: notable
    conf: 0.97
    attack: "T1112"
    if:
      type: symbol
      exact: "CmRegisterCallback"
  - id: registry-callback-ex
    desc: Register extended registry operation callback
    crit: notable
    conf: 0.98
    attack: "T1112"
    for: [pe, dll, c, cpp, rust, go, csharp]
    if:
      type: symbol
      exact: "CmRegisterCallbackEx"
  - id: registry-callback-remove
    desc: Remove registry operation callback
    crit: baseline
    conf: 0.95
    attack: "T1112"
    if:
      type: symbol
      exact: "CmUnRegisterCallback"
  - id: thread-notify-routine
    desc: Register thread creation callback
    crit: notable
    conf: 0.95
    attack: "T1057"
    if:
      type: symbol
      exact: "PsSetCreateThreadNotifyRoutine"
  - id: thread-notify-routine-remove
    desc: Remove thread creation callback
    crit: baseline
    conf: 0.95
    attack: "T1057"
    if:
      type: symbol
      exact: "PsRemoveCreateThreadNotifyRoutine"
  - id: shutdown-notification
    desc: Register driver shutdown notification
    crit: notable
    conf: 0.92
    attack: "T1547.006"
    if:
      type: symbol
      exact: "IoRegisterShutdownNotification"
  - id: bugcheck-reason-callback
    desc: Register kernel bugcheck reason callback
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: "KeRegisterBugCheckReasonCallback"
  # Object-manager handle callbacks. Anti-cheat and endpoint products register
  # these to guard their own processes, so the registration alone is neutral.
  - id: object-handle-callback-registration
    desc: Register object-manager handle callbacks
    crit: notable
    conf: 0.96
    attack: "T1562.001"
    if:
      type: text
      word: ObRegisterCallbacks
  # Writing the mask a caller asked for is how a pre-operation callback removes
  # rights (typically PROCESS_TERMINATE / PROCESS_VM_WRITE) from every handle
  # opened to a chosen process.
  - id: handle-access-mask-rewrite
    desc: Rewrites DesiredAccess mask in object callback
    crit: notable
    conf: 0.95
    attack: "T1562.001"
    for: [c, cpp, rust]
    if:
      type: symbol
      kind: bind
      regex: 'HandleInformation\.DesiredAccess$'
  # These Psp* arrays are undocumented kernel internals. Kernel debuggers and
  # endpoint products may inspect them, so each reference remains a neutral
  # capability; a hostile objective must additionally establish how they are
  # being reached and modified.
  - id: process-notify-array-internal
    desc: Internal process-notification callback array
    crit: notable
    conf: 0.97
    if:
      type: text
      word: PspCreateProcessNotifyRoutine
  - id: thread-notify-array-internal
    desc: Internal thread-notification callback array
    crit: notable
    conf: 0.97
    if:
      type: text
      word: PspCreateThreadNotifyRoutine
  - id: image-notify-array-internal
    desc: Internal image-load callback array
    crit: notable
    conf: 0.97
    if:
      type: text
      word: PspLoadImageNotifyRoutine
composite_rules:
  - id: process-lifecycle-callback
    desc: Process lifecycle callback registration
    crit: notable
    conf: 0.95
    any:
      - id: process-notify-routine
      - id: process-notify-routine-ex
  - id: rootkit-callback-triad
    desc: Process image and registry callbacks
    crit: notable
    conf: 0.98
    all:
      - id: process-lifecycle-callback
      - id: image-load-notify-routine
      - id: registry-callback
  - id: registry-and-thread-callbacks
    desc: Registry and thread callbacks
    crit: notable
    conf: 0.97
    all:
      - id: registry-callback
      - id: thread-notify-routine
  - id: registry-thread-callback-lifecycle
    desc: Registry and thread callback lifecycle
    crit: notable
    conf: 0.98
    all:
      - id: registry-callback
      - id: registry-callback-remove
      - id: thread-notify-routine
      - id: thread-notify-routine-remove
  - id: internal-notify-callback-arrays
    desc: References process, thread, and image-load callback arrays
    crit: notable
    conf: 0.99
    all:
      - id: process-notify-array-internal
      - id: thread-notify-array-internal
      - id: image-notify-array-internal
