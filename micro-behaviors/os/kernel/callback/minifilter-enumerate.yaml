# Reading back the installed filesystem-filter stack, as opposed to
# registering one (those atoms live in compat_missing.yaml next to this file).
#
# FltEnumerateFilters walks every registered minifilter, FltGetFilterInformation
# names each one, and IoEnumerateRegisteredFiltersList is the legacy
# ntoskrnl equivalent. Enumerating is neutral -- fltmc.exe does it, and
# security and backup products inspect their own instances -- so these stay
# capability atoms; the objective that reads the stack as an AV/EDR inventory
# lives in objectives/discovery/host/security/.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  attack: T1518.001

traits:
  - id: minifilter-enumerate-filters
    desc: Enumerates registered filesystem minifilters
    if:
      type: symbol
      exact: FltEnumerateFilters

  - id: minifilter-filter-information-query
    desc: Reads a registered minifilter's identity
    if:
      type: symbol
      exact: FltGetFilterInformation

  - id: legacy-registered-filter-list
    desc: Enumerates legacy registered filter drivers
    if:
      type: symbol
      exact: IoEnumerateRegisteredFiltersList
