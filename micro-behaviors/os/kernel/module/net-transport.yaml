# Kernel networking transports loaded by module name.
#
# esp4/esp6 (IPsec ESP) and rxrpc (AFS RxRPC) autoload on demand, so naming one
# on a modprobe/insmod command line, or pointing at its .ko, says the caller
# wants that receive path resident rather than merely using a service that
# happens to need it. Both are ordinary modules, and a VPN or AFS deployment
# script is the common case, so this stays a neutral capability.
#
# Kept apart from the generic insmod/modprobe atoms in tools.yaml because these
# three modules are the reachable surface for the shared-page decrypt exploits
# in objectives/privilege-escalation/exploit/kernel/, which need the module
# present before their write primitive exists.
defaults:
  platforms: [linux]
  for: [shell, python, go, rust, elf]
  crit: notable
  conf: 0.9

traits:
  - id: esp-rxrpc-modprobe-command
    desc: Loads esp4, esp6 or rxrpc by name
    if:
      type: text
      regex: '\b(modprobe|insmod)\b[^\n]{0,120}\b(esp[46]|rxrpc)\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: esp-rxrpc-module-object-path
    desc: esp4, esp6 or rxrpc module path
    if:
      type: text
      regex: '/kernel/net/(ipv[46]/esp[46]|rxrpc/rxrpc)\.ko'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

composite_rules:
  - id: esp-rxrpc-module-load
    desc: Loads esp4, esp6 or rxrpc kernel module
    crit: notable
    conf: 0.9
    any:
      - id: esp-rxrpc-modprobe-command
      - id: esp-rxrpc-module-object-path
