# The kprobes API header. Moved from objectives/evasion/kernel-hide/lkm/headers
# (as kprobes-include-str): wolfSSL's linuxkm module includes it to hook
# get_random_bytes() for its FIPS DRBG, so the include alone is a capability.
traits:
- id: kprobes-header-include
  desc: Includes linux/kprobes.h
  for: [c]
  platforms: [linux]
  crit: notable
  conf: 0.95
  if:
    type: string_literal
    substr: 'linux/kprobes.h'
  unless:
    - id: metadata/lang/upstream::linux-kernel-source-tree-path
