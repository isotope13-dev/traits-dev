defaults:
  platforms:
  - linux
  crit: notable
traits:
- id: finit-module-direct-call
  desc: Calls finit_module kernel-module loader
  for:
  - c
  - cpp
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: finit_module
- id: finit-module-syscall-call
  desc: Invokes finit_module through syscall
  for:
  - c
  - cpp
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: syscall
    arg:
      index: 0
      kind: identifier
      name: SYS_finit_module
- id: finit-module-import
  desc: Imports finit_module kernel loader
  for:
  - elf
  conf: 0.95
  if:
    type: symbol
    kind: import
    exact: finit_module
- id: finit-module-nr-syscall-call
  desc: Invokes finit_module through syscall
  for:
  - c
  - cpp
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: syscall
    arg:
      index: 0
      kind: identifier
      name: __NR_finit_module
composite_rules:
- id: finit-module-operation
  desc: Kernel-module loader call or import
  for:
  - c
  - cpp
  - elf
  any:
  - id: finit-module-direct-call
  - id: finit-module-syscall-call
  - id: finit-module-import
  - id: finit-module-nr-syscall-call
