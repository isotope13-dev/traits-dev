# FreeBSD kernel-module (KLD) interface facts.
#
# Including <sys/module.h> / <sys/linker.h>, or naming the kernel linker's own
# `linker_kernel_file` global, says only "this source speaks the FreeBSD KLD
# interface". Every in-tree driver does, and so do the FreeBSD system headers
# themselves — <sys/linker.h> declares the symbol and fs/nfs/nfsport.h pulls in
# the module + sysent headers, which is how a stock Zig/clang libc tree ended
# up carrying an evasion/kernel-hide feature. The rootkit composites in
# objectives/evasion/kernel-hide/lkm/ reference these atoms and supply the
# intent (syscall-table writes, sysctl handler swaps, linker_files walks).
defaults:
  for: [c]
  platforms: [unix]

traits:
  - id: freebsd-sys-module-header
    desc: FreeBSD kernel module header include
    crit: component
    conf: 0.95
    if:
      type: text
      substr: sys/module.h

  - id: freebsd-sys-linker-header
    desc: FreeBSD kernel linker header include
    crit: component
    conf: 0.95
    if:
      type: text
      substr: sys/linker.h

  # Declared `extern` in sys/linker.h itself, so this marks the FreeBSD
  # kernel-linker interface generally, not kern_linker.c specifically.
  - id: freebsd-linker-kernel-file-symbol
    desc: FreeBSD linker_kernel_file kernel symbol
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: linker_kernel_file

composite_rules:
  - id: freebsd-kmod-headers
    desc: FreeBSD kernel module and syscall-table header set
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/kernel/syscall::sys-sysent-header
    any:
      - id: freebsd-sys-module-header
      - id: freebsd-sys-linker-header
