defaults:
  platforms: [linux]
  for: [makefile]

# Kbuild object lists name what a module compiles. These are build-file clues
# to a capability; the composite that makes a module hostile lives under
# objectives/evasion/kernel-hide/rootkit.
traits:
  - id: kbuild-hide-module-object
    desc: Kbuild object list names a module-hiding source
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bhide_module\b|/hiders/'

  - id: kbuild-netfilter-object
    desc: Kbuild object list names netfilter hook source
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bnetfilter\w*\.o\b'

  - id: kbuild-icmp-module-name
    desc: Kernel module name carries data over ICMP
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\w*over_icmp\b'
