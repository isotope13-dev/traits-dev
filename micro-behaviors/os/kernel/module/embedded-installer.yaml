# Embedded driver images plus a loader reference do not prove rootkit intent.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: zwload-embedded-kernel-driver-profile
    desc: ZwLoadDriver with embedded PE and driver paths
    crit: notable
    conf: 0.98
    all:
      - id: zwload-driver-api-reference
      - id: driver-image-reference
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
  - id: embedded-driver-security-api-profile
    desc: Embedded drivers with security and process APIs
    crit: notable
    conf: 0.98
    all:
    - id: metadata/binary/layout/embedded::embedded-pe-three-plus
    - id: micro-behaviors/os/kernel/module::driver-image-reference
    - id: micro-behaviors/os/security/product::chinese-av-product-extended
    - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    - id: micro-behaviors/process/terminate/kill::terminate-process
