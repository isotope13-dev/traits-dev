defaults:
  crit: notable
  conf: 0.8
traits:
  - id: modprobe-install-command-line
    desc: modprobe.d install or remove directive syntax
    crit: notable
    conf: 0.8
    platforms: [linux, openwrt]
    for: [text]
    # modprobe.d `install <module> <command>`: the module token is a kernel
    # module name, which never starts with a dash. Anchoring the first char to a
    # module-name char rejects coreutils `install -Dm644 ...` and other CLI flags.
    if:
      type: text
      regex: '(?m)^[ \t]*(install|remove)[ \t]+[A-Za-z0-9_.][\w.-]{0,63}[ \t]+/[^/ \t\n][^ \t\n]{0,98}'
  - id: modprobe-config-path
    desc: Linux modprobe.d configuration file path
    crit: notable
    conf: 0.94
    platforms: [linux, openwrt]
    for: [text]
    if:
      type: path
      regex: '(^|/)modprobe\.d/[^\x2f]+\.conf$'
  - id: modprobe-ignore-install-flag
    desc: modprobe ignore-install option
    crit: notable
    conf: 0.82
    platforms: [linux, openwrt]
    for: [text, shell, python, elf]
    # Keep the option distinct from pip's `--ignore-installed` spelling.
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--ignore-install([^A-Za-z0-9_-]|$)'
  - id: modprobe-shell-metachar
    desc: modprobe.d command chains shell operations
    crit: notable
    conf: 0.82
    platforms: [linux, openwrt]
    for: [text]
    if:
      type: text
      # Require the complete modprobe.d directive shape. The earlier expression
      # also matched JavaScript identifiers such as `removeShortcut(...)`.
      regex: '(?m)^[ \t]*(install|remove)[ \t]+[A-Za-z0-9_.-]+[ \t]+/[^/\n][^\n]{0,219}[;&|]'
  - id: modprobe-install-modprobe-target
    desc: modprobe.d install delegates to modprobe itself
    crit: notable
    conf: 0.85
    platforms: [linux, openwrt]
    for: [text]
    # The documented aliasing mechanism: `install <mod> /sbin/modprobe ...`
    # chains one module name onto another without invoking a foreign binary.
    # Persistence requires diverting the load elsewhere; self-delegation is
    # stock distro configuration (LFS usb.conf, Debian aliases).
    if:
      type: text
      regex: '(?m)^[ \t]*(install|remove)[ \t]+[A-Za-z0-9_.][\w.-]{0,63}[ \t]+(\S*/)?modprobe([ \t;#]|$)'
  - id: insmod-cmd
    desc: insmod kernel module loader
    platforms:
      - linux
      - openwrt
    for:
      - shell
      - python
      - elf
    if:
      type: text
      regex: \binsmod\s+
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: insmod-force-load-cmd
    desc: Forces a kernel module load with insmod
    crit: notable
    conf: 0.97
    platforms:
      - linux
      - openwrt
    for:
      - shell
      - elf
    if:
      type: text
      regex: '\binsmod\s+-f\b'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: modprobe-cmd
    desc: modprobe kernel module loader
    platforms:
      - linux
      - openwrt
    for:
      - shell
      - python
      - elf
    if:
      # Command position only: leading anchor excludes hyphenated binary names
      # like `nvidia-modprobe` and config dirs like `modprobe.d`.
      type: text
      regex: '(^|[\s;&|(])modprobe\s+'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: rmmod-cmd
    desc: rmmod kernel module unloader
    platforms:
      - linux
      - openwrt
    for:
      - shell
      - python
      - elf
    if:
      type: text
      regex: \brmmod\s+
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: dkms-cmd
    desc: DKMS dynamic kernel module management
    # Inherits the file's `notable`, like the insmod/modprobe/rmmod siblings:
    # DKMS is the same act (building and loading an out-of-tree module), and is
    # no more universal in shell than they are.
    platforms:
      - linux
      - openwrt
    for:
      - shell
      - python
      - elf
    if:
      type: text
      regex: \bdkms\s+(install|add|build)\b
  - id: kextload-cmd
    desc: kextload kernel extension loader
    platforms:
      - macos
    for:
      - shell
      - python
      - macho
    if:
      type: text
      regex: \bkextload\s+
  - id: kextutil-cmd
    desc: kextutil kernel extension utility
    platforms:
      - macos
    for:
      - shell
      - python
      - macho
    if:
      type: text
      regex: \bkextutil\s+
  - id: kextunload-cmd
    desc: kextunload kernel extension unloader
    platforms:
      - macos
    for:
      - shell
      - python
      - macho
    if:
      type: text
      regex: \bkextunload\s+
  - id: systemextensionsctl-cmd
    desc: systemextensionsctl system extension manager
    platforms:
      - macos
    for:
      - shell
      - python
      - macho
      - javascript
      - typescript
    if:
      type: text
      regex: \bsystemextensionsctl\s+
composite_rules:
  - id: linux-kmod-load
    desc: Linux kernel module loading tool
    conf: 0.85
    platforms:
      - linux
      - openwrt
    any:
      - id: insmod-cmd
      - id: modprobe-cmd
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: macos-kext-load
    desc: macOS kernel extension loading tool
    conf: 0.85
    platforms:
      - macos
    any:
      - id: kextload-cmd
      - id: kextutil-cmd
