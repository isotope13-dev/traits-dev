# Kernel-module load via the insmod shell command. The syscall-level loaders
# (init_module/finit_module) live in kernel-module.yaml; this catches the
# command-line form embedded in scripts, droppers, and exploit payloads.
defaults:
  platforms: [android, linux]
  for: [shell, java, kotlin, python, javascript, ruby, perl, groovy]

traits:
  - id: insmod-command
    desc: insmod command targets a kernel module
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\binsmod\s+\S+\.ko\b'
