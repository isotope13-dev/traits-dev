defaults:
  platforms:
  - linux
composite_rules:
- id: finit-module-reference-group
  desc: Kernel-module API or syscall references
  crit: notable
  conf: 0.95
  for:
  - elf
  - c
  any:
  - id: micro-behaviors/os/kernel/module::finit-module-reference
  - id: metadata/lang/source/naming/interface::sys-finit-module-reference
  unless:
  - id: well-known/tool/offensive/pwntools::pwntools-distribution
  - id: well-known/app/infrastructure/pihole::ftl-binary
  - id: metadata/package/files/system-package::libc-syscall-number-header
  - id: well-known/tool/reverse-engineering/e9patch::source-context
