defaults:
  platforms: [linux]
  for: [elf, shell]
  crit: notable
  conf: 0.99

traits:
  # MSR writes are also used by legitimate CPU tuning tools and miners.
  # Require the enabling argument; a module/path reference alone is weaker.
  - id: modprobe-msr-enable-writes
    desc: modprobe command enables CPU MSR writes
    if:
      type: text
      regex: '\bmodprobe[ \t]+msr[ \t]+allow_writes=(on|1)([ \t;&]|$)'
