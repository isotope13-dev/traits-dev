# Names a user-mode program needs in order to read the kernel's System Service
# Descriptor Table out of physical memory: the section object that exposes RAM
# and the exported table symbol, resolved by name from the kernel image.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9
  attack: T1014
traits:
  - id: physical-memory-device-path
    desc: References the PhysicalMemory device object
    if:
      type: text
      regex: '(?i)\\Device\\PhysicalMemory'

  - id: ke-service-descriptor-table-name
    desc: Names KeServiceDescriptorTable as a string
    if:
      type: text
      substr: KeServiceDescriptorTable
