defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: suspicious
  conf: 0.98
traits:
  # These are caller-side request blocks, not the driver's own version strings
  # or a bare IOCTL constant. The request selector and packet length belong to
  # the same bounded native indirect-call sequence.
  - id: intel-kernel-copy-request-call
    desc: Intel raw-memory copy IOCTL call block
    if:
      type: hex
      section: .text
      pattern: 'BA 07 20 86 80 [0-64] 41 B9 28 00 00 00 [0-16] 49 C7 43 ?? 33 00 00 00 FF 15 ?? ?? ?? ??'
  - id: intel-physical-map-request-call
    desc: Intel physical-memory map IOCTL call block
    if:
      type: hex
      section: .text
      pattern: '41 B9 30 00 00 00 [0-32] BA 07 20 86 80 [0-40] 48 C7 45 ?? 19 00 00 00 [0-16] FF 15 ?? ?? ?? ??'
