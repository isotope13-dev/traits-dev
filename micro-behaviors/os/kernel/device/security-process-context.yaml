defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, powershell]
composite_rules:
  - id: driver-client-security-process-references
    desc: Driver control beside security process names
    crit: notable
    conf: 0.98
    # `kernel-device-handle` has no Batch or Python spelling.
    all:
      - id: micro-behaviors/os/kernel/driver::kernel-driver-service-registration
      - id: micro-behaviors/fs/path/system::driver-image-reference
      # Vulnerable-driver clients normally open a vendor-defined Win32 device
      # path (for example, \\.\CcProtect), not a path whose first component is
      # literally "Device" or "Harddisk". Use the canonical arbitrary device-
      # handle atom so renamed driver lineages remain covered.
      - id: micro-behaviors/fs/path/device/kernel::windows-kernel-device-path-reference
      - id: micro-behaviors/os/security/product::security-process-name-reference
    any:
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/fs/file/handle::device-io-control-api-reference
