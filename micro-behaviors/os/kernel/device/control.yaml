defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

composite_rules:
  - id: kernel-device-io-control
    desc: Controls a Windows kernel device
    crit: notable
    conf: 0.94
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    all:
      - id: micro-behaviors/fs/path/device/kernel::windows-kernel-device-path-reference
    any:
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/fs/file/handle::device-io-control-api-reference
