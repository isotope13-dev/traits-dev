defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # These identifiers name drivers with exposed kernel-memory primitives.
  # A name alone is useful analyst context, not proof that the driver is
  # being abused; the neutral client composite below supplies registration,
  # startup, device-handle, and IOCTL evidence.
  - id: vulnerable-driver-device--rtcore64
    desc: RTCore64 vulnerable-driver identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      word: RTCore64
    unless:
      - id: metadata/signature/verified/

  - id: vulnerable-driver-device--dbutil-2-3
    desc: DBUtil_2_3 vulnerable-driver identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      word: DBUtil_2_3

  - id: vulnerable-driver-device--defaultrtcoreconfig
    desc: Default RTCore configuration identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      word: DefaultRTCoreConfig

  - id: vulnerable-driver-device--defaultdbutilconfig
    desc: Default DBUtil configuration identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      word: DefaultDBUtilConfig

  - id: vulnerable-driver-device--iqvw64
    desc: Intel iQVW64 vulnerable-driver reference
    crit: notable
    conf: 0.99
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)\b(iQVW64\.SYS|iqvw64e\.sys|IQVW32\.sys|NalDrv\.sys)\b'

  - id: vulnerable-driver-device--pdfwkrnl
    desc: AMD PDFWKRNL vulnerable-driver reference
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)\b(PDFWKRNL\.sys|PdFwKrnl)\b'

  - id: vulnerable-driver-device--tpwsav
    desc: Compal TPwSav vulnerable-driver reference
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)\bTPwSav\.sys\b'

  - id: vulnerable-driver-image-source--rtcore64
    desc: RTCore64 vulnerable driver image reference
    crit: notable
    conf: 0.97
    for: [c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      word: RTCore64.sys

  - id: vulnerable-driver-image-source--dbutil-2-3
    desc: DBUtil_2_3 vulnerable driver image reference
    crit: notable
    conf: 0.97
    for: [c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      word: DBUtil_2_3.sys

  - id: vulnerable-driver-device--xhunter1
    desc: XIGNCODE3 xhunter1 vulnerable-driver reference
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)(\bxhunter1\.sys\b|\\{2,4}\.\\{1,2}xhunter1\b)'
    unless:
      - id: metadata/signature/verified/

  - id: vulnerable-driver-device--bdapiutil64
    desc: Baidu BdApiUtil64 vulnerable-driver reference
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)\bbdapiutil(64)?\.sys\b'
    unless:
      - id: metadata/signature/verified/

  - id: vulnerable-driver-device--monprocessex
    desc: monprocessex vulnerable-driver image reference
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)\bmonprocessex\.sys\b'
    unless:
      - id: metadata/signature/verified/

  - id: vulnerable-driver-device--havoc-fly
    desc: havoc.sys or fly.sys driver reference
    crit: notable
    conf: 0.95
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)[\\/"''](havoc|fly)\.sys\b'
    unless:
      - id: metadata/signature/verified/

  - id: vulnerable-driver-device--bstkdrv
    desc: BlueStacks BstkDrv vulnerable driver
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)\bBstkDrv(_[a-z0-9]+)?\.sys\b'

composite_rules:
  - id: vulnerable-driver-device
    desc: Known vulnerable-driver identifier
    crit: notable
    conf: 0.96
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    any:
      - id: vulnerable-driver-device--rtcore64
      - id: vulnerable-driver-device--dbutil-2-3
      - id: vulnerable-driver-device--defaultrtcoreconfig
      - id: vulnerable-driver-device--defaultdbutilconfig
      - id: vulnerable-driver-device--iqvw64
      - id: vulnerable-driver-device--pdfwkrnl
      - id: vulnerable-driver-device--tpwsav
      - id: vulnerable-driver-image-source--rtcore64
      - id: vulnerable-driver-image-source--dbutil-2-3
      - id: vulnerable-driver-device--xhunter1
      - id: vulnerable-driver-device--bdapiutil64
      - id: vulnerable-driver-device--monprocessex
      - id: vulnerable-driver-device--havoc-fly
      - id: vulnerable-driver-device--bstkdrv
      - id: bdapiutil-device-path

  - id: vulnerable-driver-device-client
    desc: Vulnerable-driver reference with service setup and device I/O
    crit: notable
    conf: 0.99
    for: [pe, dll, c, cpp]
    all:
      - id: vulnerable-driver-device
      - id: micro-behaviors/os/kernel/driver::kernel-driver-service-configuration
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/os/kernel/device::kernel-device-io-control

