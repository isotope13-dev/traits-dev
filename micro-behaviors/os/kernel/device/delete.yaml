defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, rust]
  crit: notable
  conf: 0.96

traits:
  - id: delete-device-object
    desc: References kernel device deletion API
    if:
      type: symbol
      exact: IoDeleteDevice
  - id: delete-device-symbolic-link
    desc: References kernel symbolic-link deletion API
    if:
      type: symbol
      exact: IoDeleteSymbolicLink
