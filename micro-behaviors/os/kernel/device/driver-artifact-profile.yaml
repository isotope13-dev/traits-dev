defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: kernel-driver-artifact-reference
  desc: Kernel-driver name or device-path references
  crit: notable
  conf: 0.97
  any:
  - id: micro-behaviors/fs/path/system/driver::ntiolib-driver-name-reference
  - id: micro-behaviors/os/kernel/device::procexp-driver-device-reference
  - id: micro-behaviors/fs/path/system/driver::procexp-driver-filename-reference
  - id: micro-behaviors/fs/path/system/library::ntoskrnl-system-image-path
  unless:
  - id: well-known/tool/development/editor/jetbrains::signed-jetbrains-binary
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-process-explorer
  - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-process-explorer-driver
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-handle
  - id: well-known/game/cs2::lust-cs2-cheat-loader
