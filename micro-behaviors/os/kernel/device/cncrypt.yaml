defaults:
  platforms: [windows]
traits:
- id: ccprotect-alinubx-device-reference
  desc: CcProtect or Alinubx device-path reference
  crit: suspicious
  conf: 0.97
  for: [binaries, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    # A device-path reference does not establish an open or a successful IOCTL.
    regex: '(?i)(\\\\\.\\(CcProtect|Alinubx)|\\\\\\\\\.\\\\(CcProtect|Alinubx))\b'
