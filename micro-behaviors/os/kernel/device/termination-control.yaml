# Control-code compatibility does not establish the target driver or an attack.
defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp]

traits:
- id: poisonx-compatible-ioctl-constant
  desc: PoisonX-compatible IOCTL constant reference
  crit: suspicious
  conf: 0.9
  # These values are ordinary hexadecimal constants in JavaScript libraries;
  # BYOVD interpretation requires native driver-facing code or an executable.
  # The boundary matters: packed data tables (Unicode grapheme properties)
  # embed longer words such as 0x22E008CA that merely contain the code.
  for: [c, cpp, csharp, pe]
  if:
    type: text
    regex: (?i)0x22E008\b|0x22E010\b
- id: dcrcv-compatible-termination-ioctl
  desc: DCRCV-compatible termination IOCTL constant
  crit: suspicious
  conf: 0.94
  for: [binaries, scripts, c, cpp, csharp, go, rust, powershell]
  if:
    type: text
    regex: '(?i)\b(0x2205C0|2205C0h)\b'

composite_rules:
- id: ccprotect-device-termination-control
  desc: CcProtect device and termination IOCTL
  crit: suspicious
  conf: 0.95
  for: [pe, dll]
  all:
  - id: micro-behaviors/os/kernel/device::ccprotect-alinubx-device-reference
  - id: metadata/binary/instruction/operand::ioctl-222024-immediate
  any:
  - id: micro-behaviors/fs/file/handle::device-io-control-win
  - id: micro-behaviors/fs/file/handle::device-io-control-api-reference
- id: termination-compatible-control-clues
  desc: Process-termination-compatible IOCTL clues
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/source/literal/value::hex-22201c-token
  - id: micro-behaviors/os/kernel/device::poisonx-compatible-ioctl-constant
  - id: micro-behaviors/os/kernel/device::dcrcv-compatible-termination-ioctl
  - id: metadata/lang/source/literal/value::hex-222024-token
  - id: micro-behaviors/os/kernel/device::ccprotect-device-termination-control
- id: termination-compatible-device-control
  desc: DeviceIoControl beside termination IOCTL clue
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/os/kernel/device::termination-compatible-control-clues
  any:
  - id: micro-behaviors/fs/file/handle::device-io-control-win
  - id: micro-behaviors/fs/file/handle::device-io-control-api-reference
  # 0x222024 collides with libusb0's own driver control code: stock libusb0
  # passes it to libusb0.sys for USB transfers, which is not EDR teardown.
  unless:
  - id: micro-behaviors/dylib/library/usb::libusb-api-export
