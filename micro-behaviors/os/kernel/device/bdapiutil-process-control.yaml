defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, powershell, python]
traits:
  - id: bdapiutil-device-path
    desc: References the BdApiUtil kernel device path
    crit: notable
    conf: 0.98
    if:
      type: string_literal
      regex: '(?i)\\{2,4}\.\\{1,2}BdApiUtil\b'
  - id: bdapiutil-four-byte-termination-request
    desc: BdApiUtil kill IOCTL with four-byte input
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])DeviceIoControl$'
      args:
        - index: 1
          kind: number
          value: 2147493044
        - index: 3
          kind: number
          value: 4
