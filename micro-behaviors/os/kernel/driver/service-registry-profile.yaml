# Path/API co-occurrence; no service startup mode or registry write is required.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
composite_rules:
  - id: driver-path-service-registry-api-profile
    desc: Driver path and service registry API references
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/system/driver::driver-image-template
      - id: "micro-behaviors/os/registry/service/reference::service-key-format-string"
      - id: micro-behaviors/os/registry/service/reference::grouporderlist-key-reference
    any:
      - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
      - id: micro-behaviors/os/registry/open::registry-open-key-api
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-a
