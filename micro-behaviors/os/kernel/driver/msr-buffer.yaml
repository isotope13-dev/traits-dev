# Privileged MSR access in x64 driver routines. These are ordinary tuning
# capabilities in WinRing0; they do not establish driver exploitation.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  crit: notable
  conf: 0.95

traits:
  - id: x64-msr-read-to-buffer
    desc: Driver routine reads MSR into output buffer
    if:
      type: hex
      section: .text
      pattern: '0F 32 48 C1 E2 20 48 0B C2 49 89 00'
  - id: x64-msr-write-from-buffer
    desc: Driver routine writes MSR from input buffer
    if:
      type: hex
      section: .text
      pattern: '48 C1 EA 20 8B 09 8B 40 04 0F 30'
