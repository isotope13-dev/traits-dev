# Privileged port I/O instructions with an explicit buffer transfer. Match
# code-section instruction sequences, rather than a lone IN/OUT opcode.
# Hardware monitors legitimately use these; no exploitation is inferred.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  crit: notable
  conf: 0.96

traits:
  - id: x64-io-port-read-to-buffer
    desc: I/O-port read then buffer-store instructions
    if:
      type: hex
      section: .text
      pattern: '66 ED 66 89 01'
  - id: x64-io-port-write-from-buffer
    desc: Buffer-load then I/O-port write instructions
    if:
      type: hex
      section: .text
      pattern: '0F B7 41 ?? 66 EF'
