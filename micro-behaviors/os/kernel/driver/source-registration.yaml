defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, batch, go, rust, python]
  crit: notable
  conf: 0.94
traits:
  - id: native-driver-service-registration
    desc: Native code registers a kernel-driver service
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp]
    if:
      type: text
      regex: '(?is)\bCreateService[AW]?\s*\([\s\S]{0,320}(\bSERVICE_KERNEL_DRIVER\b|\.sys\b)'
  - id: native-driver-service-type-constant
    desc: CreateService with numeric kernel-driver type
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '\bCreateService[AW]?\s*\(([^,()]{1,80},){4}\s*(0x0*)?1u?\s*,\s*[0-4]u?\s*,'
composite_rules:
  - id: kernel-driver-service-configuration
    desc: Kernel-driver service type or registration references
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/os/kernel/driver::kernel-driver-service-type
      - id: micro-behaviors/os/kernel/driver::sc-driver-service-create
      - id: micro-behaviors/os/kernel/driver::powershell-driver-service-command
      - id: micro-behaviors/os/kernel/driver::powershell-driver-service-variable-command
      - id: native-driver-service-registration
      - id: native-driver-service-type-constant
