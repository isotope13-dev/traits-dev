defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  size_min: 50000
  size_max: 5000000

traits:
  - id: difxapi-driver-imports
    desc: Driver installation API imports (DIFXAPI)
    conf: 0.95
    if:
      type: import
      regex: "^(DriverPackagePreinstall|DriverPackageUninstall|DriverPackageGetPath)[AW]?$"

  - id: setupapi-driver-install-imports
    desc: SETUPAPI driver installation imports
    conf: 0.94
    if:
      type: import
      regex: "^(SetupCopyOEMInf|SetupDiGetClassDescriptionEx)[AW]?$"
