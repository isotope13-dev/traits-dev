# WinRing0 / WinRing0x64 (OpenLibSys) is a signed OEM kernel driver that
# exposes model-specific-register (MSR) reads/writes and port I/O to user
# mode. It ships inside legitimate hardware monitors (LibreHardwareMonitor,
# OpenHardwareMonitor, CPU-Z), so a bare reference is only notable; the
# cryptojacking objective infers abuse by pairing it with miner context,
# where the driver is loaded to tune the CPU for extra hashrate.
defaults:
  platforms: [windows]
  for: [scripts, binaries, c, cpp, csharp, go, rust, python]
  crit: notable
  conf: 0.9
traits:
  - id: winring0-driver-reference
    desc: References WinRing0 MSR kernel driver
    if:
      type: text
      regex: '(?i)\bWinRing0(x64)?(\.sys)?\b'
