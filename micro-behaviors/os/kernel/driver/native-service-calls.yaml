defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: x86-demand-driver-service-calls
    desc: Demand-start kernel service create/start calls
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule demand_driver_service_calls {
          strings:
            // CreateServiceW: SERVICE_KERNEL_DRIVER (1), DEMAND_START (3).
            // Preserve the returned service handle in ESI; an intervening
            // OpenService fallback may replace it before StartServiceW.
            $create = {
              6A 00 6A 00 6A 00 6A 00 6A 00 68 ?? ?? ?? ??
              6A 00 6A 03 6A 01 68 FF 01 0F 00 57 57 55
              FF 15 ?? ?? ?? ?? 8B F0
            }
            $start = { 6A 00 6A 00 56 FF 15 ?? ?? ?? ?? 85 C0 }
          condition:
            pe.machine == pe.MACHINE_I386 and
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".text" and
              for any c in (1..#create) : (
                @create[c] >= pe.sections[s].raw_data_offset and
                @create[c] + !create[c] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                uint32(@create[c]+31) == pe.image_base + pe.import_rva("ADVAPI32.dll", "CreateServiceW") and
                for any t in (1..#start) : (
                  @start[t] >= @create[c] + !create[c] and
                  @start[t] <= @create[c] + 160 and
                  @start[t] + !start[t] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                  uint32(@start[t]+7) == pe.image_base + pe.import_rva("ADVAPI32.dll", "StartServiceW")
                )
              )
            )
        }
