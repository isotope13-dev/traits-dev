defaults:
  platforms: [windows]
  for: [batch, powershell, csharp, go]
  crit: notable
  conf: 0.94
traits:
  - id: sc-driver-service-create
    desc: sc registers a kernel or filesystem driver
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[^\r\n]{0,180}\btype\s*=\s*(kernel|filesys)\b'
