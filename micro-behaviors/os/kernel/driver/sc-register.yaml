defaults:
  platforms: [windows]
  for: [batch, powershell, csharp, go]
  crit: notable
  conf: 0.94
traits:
  - id: sc-driver-service-create
    desc: sc registers a kernel or filesystem driver
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\b[^\r\n]{0,180}\btype\s*=\s*(kernel|filesys)\b'

  - id: sc-exe-reference
    desc: References Windows sc.exe service utility
    crit: baseline
    for: [pe, dll]
    if:
      type: text
      word: sc.exe
      case_insensitive: true

  - id: sc-kernel-type-arg
    desc: Service command kernel-driver type flag
    for: [pe, dll, csharp, c, cpp, go, powershell, batch]
    if:
      type: text
      regex: '(?i)\btype\s*=\s*(kernel|filesys)\b'

composite_rules:
  - id: sc-split-driver-service-create
    desc: PE embeds sc.exe and kernel driver type flag
    conf: 0.93
    for: [pe, dll]
    attack: T1543.003
    all:
      - id: sc-exe-reference
      - id: sc-kernel-type-arg
