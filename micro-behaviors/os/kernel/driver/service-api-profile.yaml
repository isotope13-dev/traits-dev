defaults:
  platforms:
  - windows
  for:
  - pe
  crit: notable
composite_rules:
- id: unsigned-privileged-service-driver-api-set
  desc: Unsigned PE with driver, privilege and service API references
  conf: 0.96
  all:
  - id: micro-behaviors/os/kernel/module::zwload-driver-api-reference
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  - id: micro-behaviors/os/service/start::start-service
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: micro-behaviors/os/service/create::create-service-w-import
  - id: micro-behaviors/os/service/create::create-service-w-reference
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app
  - id: well-known/tool/sysadmin/
- id: unsigned-embedded-driver-service-api-set
  desc: Unsigned embedded driver and service configuration API references
  conf: 0.93
  all:
  - id: micro-behaviors/os/kernel/module::zwload-embedded-kernel-driver-profile
  - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
  - id: micro-behaviors/os/service/host::service-imagepath-value-name
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
