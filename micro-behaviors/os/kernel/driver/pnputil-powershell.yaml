# PowerShell call-operator invocations currently lack a callee in call facts.
# Query the parsed command and its own argument, so comments, help strings,
# and flags on other commands cannot supply driver-installation evidence.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.97
traits:
  - id: powershell-pnputil-add-driver
    desc: Invokes PnPUtil to add a driver package
    if:
      type: tree-sitter
      query: |
        (command
          command_name: (_) @tool
          command_elements: (command_elements (generic_token) @operation)
          (#match? @tool "(?i)^[\"']?pnputil(\\.exe)?[\"']?$")
          (#match? @operation "(?i)^/add-driver$"))
  - id: powershell-pnputil-update-device
    desc: Invokes PnPUtil to update a device driver
    if:
      type: tree-sitter
      query: |
        (command
          command_name: (_) @tool
          command_elements: (command_elements (generic_token) @operation)
          (#match? @tool "(?i)^[\"']?pnputil(\\.exe)?[\"']?$")
          (#match? @operation "(?i)^/update-device$"))
