defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: unsigned-embedded-driver-http-references
    desc: Unsigned driver/API and HTTP reference profile
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/kernel/module::zwload-driver-api-reference
      - id: micro-behaviors/fs/path/system::driver-image-reference
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
      - id: micro-behaviors/communications/url/http-scheme::http-url-shaped-text
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/communications/http/message::urlencoded-mac-address-field
      - id: micro-behaviors/os/security/product::chinese-av-product-extended
      - id: micro-behaviors/process/terminate/kill::terminate-process
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/
