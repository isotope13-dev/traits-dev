# Evidence-specific placement; matching does not imply attacker intent.
traits:
- id: shell-modprobe-variable
  desc: Shell modprobe command uses variable module
  conf: 0.8
  if:
    type: text
    exclude_comments: true
    regex: (^|[\n;&|(`!]|sudo )\s*(/(usr/)?s?bin/)?modprobe\s+(-[A-Za-z]{1,6} )?\$\{?[A-Za-z_]\w*
  not:
  - regex: \bmodprobe\s+(?:-[A-Za-z0-9-]+\s+)*\$\{?[A-Za-z_][A-Za-z0-9_]*FSTYPE\}?\b
  - regex: \bmodprobe\s+(?:-[A-Za-z0-9-]+\s+)*\$\{?driver\}?\b
- id: shell-insmod-path
  desc: Shell insmod command uses module path
  conf: 0.75
  if:
    type: text
    regex: \binsmod\s+([/$"]|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?/)
  not:
  - regex: \binsmod\s+/ventoy/drivers/\$\{?[A-Za-z_][A-Za-z0-9_]*\}?\.ko\b
- id: shell-insmod-ko
  desc: Shell insmod command names ko file
  conf: 0.75
  if:
    type: text
    regex: \binsmod\s+[^ \n]{1,80}\.ko\b
  not:
  - regex: \binsmod\s+/ventoy/drivers/\$\{?[A-Za-z_][A-Za-z0-9_]*\}?\.ko\b
composite_rules:
- id: shell-kernel-module-load
  desc: Shell kernel-module loading command references
  conf: 0.8
  any:
  - id: micro-behaviors/os/kernel/driver::shell-modprobe-variable
  - id: micro-behaviors/os/kernel/driver::shell-insmod-path
  - id: micro-behaviors/os/kernel/driver::shell-insmod-ko
  not:
  - regex: \bmodprobe\s+uvesafb\b
  - regex: \bmodprobe\s+vbox(guest|sf)\b
defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
