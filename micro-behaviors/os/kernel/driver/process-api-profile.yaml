defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-embedded-pe-kernel-process-api-set
    desc: Unsigned embedded PE with kernel and process-management references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/data/embedded/payload/header::dos-executable-header-in-data
      - id: micro-behaviors/process/enumerate/snapshot::process32-first
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/fs/path/library::windows-kernel-module-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/tool/sysadmin/
