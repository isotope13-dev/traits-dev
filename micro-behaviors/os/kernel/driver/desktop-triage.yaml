defaults:
  platforms: [macos]
  for: [scripts, binaries, source]

traits:
  - id: kext-management-tool-reference
    desc: References kernel extension management tool
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bkext(load|util)\b'
    unless:
    - id: metadata/package/files/ecosystem::conda-shell-activation-layout
    - id: micro-behaviors/os/kernel/driver::kextfind-tool-reference


  - id: kextfind-tool-reference
    desc: References kernel extension search tool
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: kextfind

composite_rules:
  - id: kext-path-or-tool-reference
    desc: Kernel extension path or tool reference
    crit: notable
    conf: 0.88
    any:
    - id: micro-behaviors/fs/path/extension::user-kext-path-reference
    - id: micro-behaviors/os/kernel/driver::kext-management-tool-reference
    unless:
    - id: metadata/package/files/ecosystem::conda-shell-activation-layout
    - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
    - id: well-known/tool/detection/google-santa::source-tree
    - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
    # Wikipedia / docs prose citing kextload is not a persistence implant.
    - id: metadata/package/documentation/page::static-html-shell
    - id: well-known/tool/development/toolchain/darling/
