# KSLDriver's caller authorization is configured through this registry value.
# A setter alone is configuration evidence; the bypass objective also requires
# driver registration and a device-control interface. Service/device names are
# deliberately absent because clients can rename them.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: native-allowed-process-name-write
    desc: Writes driver AllowedProcessName registry value
    for: [c, cpp]
    if:
      type: tree-sitter
      kind: call
      regex: '^RegSetValueEx[AW]?\s*\([^,]{1,80},\s*L?"AllowedProcessName"\s*,'
  - id: allowed-process-name-setter-call
    desc: Sets driver AllowedProcessName via API
    for: [python, csharp]
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(RegSetValueEx[AW]?|SetValueEx)$'
      arg:
        index: 1
        kind: string
        exact: AllowedProcessName
  - id: rust-allowed-process-name-write
    desc: Sets driver AllowedProcessName with string macro
    for: [rust]
    if:
      type: tree-sitter
      kind: call
      regex: '^([\w:]{1,64}::)?RegSetValueEx[AW]\([^,]{1,40},\s*[ws]!\("AllowedProcessName"\),'
  - id: go-allowed-process-name-write
    desc: Sets driver AllowedProcessName string
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetStringValue$'
      arg:
        index: 0
        kind: string
        exact: AllowedProcessName
