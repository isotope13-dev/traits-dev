defaults:
  platforms: [windows]
  for: [c, cpp]

traits:
  - id: native-auto-start-driver-registration
    desc: CreateServiceW automatic driver registration
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: CreateServiceW
      args:
        - index: 4
          kind: identifier
          name: SERVICE_KERNEL_DRIVER
        - index: 5
          kind: identifier
          name: SERVICE_AUTO_START
