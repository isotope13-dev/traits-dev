# Neutral observations and discriminating identities.
traits:
- id: inf-installer-directive-reference
  desc: INF co-installer or DRVINST reference
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\b(CoInstallers32|DRVINST)\b
  unless:
  - id: well-known/lib/platform/wintun::wintun-driver-component
  - id: well-known/lib/platform/wintun::wintun-driver-files
  - id: well-known/lib/platform/wintun::wintun-wireguard-company
  - id: well-known/lib/platform/wintun::wintun-driver-versioninfo
  - id: well-known/dual-use/tunnel/sing-box::sing-box-package-context
  - id: well-known/dual-use/tunnel/sing-box::wheel-distribution
  - type: value
    path: pe.go.module.path
    exact: github.com/sagernet/sing-box
  - type: value
    path: whl.distribution
    exact: sing_box_bin
  - type: basename
    exact: wintun.sys
composite_rules:
- id: inf-installer-reference-profile
  desc: INF driver installer directive references
  crit: notable
  conf: 0.94
  unless:
  - id: well-known/lib/platform/wintun::wintun-driver-component
  - id: well-known/lib/platform/wintun::wintun-driver-files
  - id: well-known/lib/platform/wintun::wintun-wireguard-company
  - id: well-known/lib/platform/wintun::wintun-driver-versioninfo
  - id: well-known/dual-use/tunnel/sing-box::sing-box-package-context
  - id: well-known/dual-use/tunnel/sing-box::wheel-distribution
  any:
  - id: micro-behaviors/os/kernel/driver::inf-installer-directive-reference
  - id: micro-behaviors/os/service/create::inf-add-service-directive
- id: inf-installer-near-http-url
  desc: INF installer reference near HTTP URL
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/kernel/driver::inf-installer-reference-profile
  any:
  - id: micro-behaviors/communications/http/url/domain::http-url-binary
  near_bytes: 1024
defaults:
  for:
  - python
  - c
  - cpp
  - csharp
  - rust
  - go
  - powershell
  - batch
  - pe
  - dll
  platforms:
  - windows
