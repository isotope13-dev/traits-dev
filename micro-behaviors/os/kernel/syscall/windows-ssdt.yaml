defaults:
  platforms: [windows]
  for: [pe, c, cpp]

traits:
  - id: ke-service-descriptor-table-ref
    desc: Imports KeServiceDescriptorTable
    crit: notable
    conf: 0.92
    if:
      type: import
      exact: KeServiceDescriptorTable
  - id: nt-shutdown-system-target
    desc: NtShutdownSystem syscall name reference
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: NtShutdownSystem
  - id: x86-ssdt-index-entry-read
    desc: x86 indexes an imported SSDT table
    crit: notable
    conf: 0.97
    for: [pe]
    arch: [x86]
    if:
      type: hex
      section: .text
      # mov ecx,[KeServiceDescriptorTable IAT]; mov ecx,[ecx];
      # mov eax,[ecx+eax*4]
      pattern: 8B 0D ?? ?? ?? ?? 8B 09 8B 04 81
