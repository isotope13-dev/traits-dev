# XNU kernel-extension source that rewrites sysent entries for the
# syscalls a rootkit needs to lie through: directory listing, signals,
# ptrace and sysctl process listing. Three or more such entries rewritten in
# one tree is the interception layer, not one compatibility shim.
defaults:
  platforms: [macos]
  for: [c]
  conf: 0.9

traits:
  - id: sysent-kill-overwritten
    desc: Rewrites the kill sysent entry
    crit: component
    if:
      type: text
      regex: 'sysent\w*\[\s*SYS_kill\s*\]\.sy_call\s*=\s*\(sy_call_t\s*\*\)'

  - id: sysent-getdirentries-overwritten
    desc: Rewrites the getdirentries sysent entry
    crit: component
    if:
      type: text
      regex: 'sysent\w*\[\s*SYS_getdirentries(64|attr)?\s*\]\.sy_call\s*=\s*\(sy_call_t\s*\*\)'

  - id: sysent-ptrace-overwritten
    desc: Rewrites the ptrace sysent entry
    crit: component
    if:
      type: text
      regex: 'sysent\w*\[\s*SYS_ptrace\s*\]\.sy_call\s*=\s*\(sy_call_t\s*\*\)'

  - id: sysent-sysctl-overwritten
    desc: Rewrites the sysctl sysent entry
    crit: component
    if:
      type: text
      regex: 'sysent\w*\[\s*SYS_sysctl\s*\]\.sy_call\s*=\s*\(sy_call_t\s*\*\)'

  - id: sysent-write-nocancel-overwritten
    desc: Rewrites the write_nocancel sysent entry
    crit: component
    if:
      type: text
      regex: 'sysent\w*\[\s*SYS_write_nocancel\s*\]\.sy_call\s*=\s*\(sy_call_t\s*\*\)'

  - id: sysent-open-overwritten
    desc: Rewrites the open sysent entry
    crit: component
    if:
      type: text
      regex: 'sysent\w*\[\s*SYS_open(_nocancel)?\s*\]\.sy_call\s*=\s*\(sy_call_t\s*\*\)'

  - id: sysent-stat-overwritten
    desc: Rewrites the stat64 sysent entry
    crit: component
    if:
      type: text
      regex: 'sysent\w*\[\s*SYS_l?stat64\s*\]\.sy_call\s*=\s*\(sy_call_t\s*\*\)'

composite_rules:
  - id: sysent-hiding-syscalls-overwritten
    desc: Rewrites listing, signal and trace sysent entries
    crit: notable
    attack: T1014
    needs: 3
    any:
      - id: sysent-kill-overwritten
      - id: sysent-getdirentries-overwritten
      - id: sysent-ptrace-overwritten
      - id: sysent-sysctl-overwritten
      - id: sysent-write-nocancel-overwritten
      - id: sysent-open-overwritten
      - id: sysent-stat-overwritten
