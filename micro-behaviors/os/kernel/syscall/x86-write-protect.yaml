defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-cr0-clear-write-protect
    desc: Disables interrupts and CR0 write protection
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: text
      pattern: 'FA 0F 20 C0 25 FF FF FE FF 0F 22 C0'
  - id: x86-cr0-restore-write-protect
    desc: Restores CR0 write protection and interrupts
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: text
      pattern: '0F 20 C0 0D 00 00 01 00 0F 22 C0 FB'
composite_rules:
  - id: native-ssdt-write-protection-bypass
    desc: SSDT access with write-protection bypass and restoration
    crit: suspicious
    conf: 0.99
    all:
      - id: ke-service-descriptor-table-ref
      - id: x86-cr0-clear-write-protect
      - id: x86-cr0-restore-write-protect
