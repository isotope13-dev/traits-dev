defaults:
  crit: notable
  platforms: [unix]
  for: [c]

traits:
  - id: reads-syscall-table-handler-address
    desc: Reads syscall handler addresses from table
    conf: 0.94
    platforms: [linux]
    if:
      type: text
      regex: '\bsyscall_addr\s*=\s*READ_KERN\s*\(\s*syscall_table_addr\s*\['
  - id: syscall-table-entry-assignment
    desc: Assigns a syscall table entry
    conf: 0.92
    if:
      type: text
      regex: '\b_{0,2}syscall_table\s*\[[^\]]{1,80}\]\s*='
  - id: sys-sysent-header
    desc: FreeBSD syscall entry table header
    conf: 0.98
    if:
      type: text
      substr: sys/sysent.h
  - id: sysent-raw
    desc: Sysent syscall entry table reference
    conf: 0.98
    if:
      type: text
      word: sysent
