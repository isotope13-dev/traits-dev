# API names, privilege references and diagnostics do not prove that code
# writes kernel memory or unlinks a process. Preserve the reference profile
# as a neutral observation; a DKOM objective needs an actual splice primitive.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: kernel-debug-eprocess-reference-profile
    desc: Kernel debug APIs with EPROCESS diagnostics
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/os/kernel/debug::zw-system-debug-control-api
      - id: micro-behaviors/mem/read/arbitrary::read-virtual-memory-name
      - id: micro-behaviors/mem/query::memory-address-diagnostic-format
      - id: micro-behaviors/os/kernel/struct::eprocess-pointer-diagnostic
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
      - id: micro-behaviors/os/sysinfo/process::zw-query-system-information
