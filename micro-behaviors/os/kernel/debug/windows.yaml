# User-mode access to the Windows kernel debugger interface. Debuggers and
# forensic tools can legitimately use this primitive; concealment intent is
# supplied by the rootkit composite that also requires EPROCESS lookup and
# explicit privilege adjustment.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]
  attack: T1014

traits:
  - id: zw-system-debug-control-api
    desc: Resolves ZwSystemDebugControl kernel interface
    conf: 0.98
    if:
      type: text
      exact: ZwSystemDebugControl

  - id: kernel-memory-read-diagnostic
    desc: Kernel memory read diagnostic
    conf: 0.96
    if:
      type: text
      exact: ReadVirtualMemory

  - id: kernel-memory-address-diagnostic
    desc: Kernel memory address diagnostic
    conf: 0.94
    if:
      type: text
      exact: 'memory address : %x'

  # DbgHelp is also usable outside debuggers: a program can load the matching
  # kernel PDB and resolve unexported ntoskrnl symbols for the running build.
  # Each API remains a neutral symbol-processing capability. The objective
  # composite that references the full stack supplies callback-tampering
  # intent by requiring a driver control channel and notification arrays.
  - id: dbghelp-symbol-module-load
    desc: Loads module into DbgHelp symbol handler
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: symbol
      exact: SymLoadModuleEx

  - id: dbghelp-symbol-name-lookup
    desc: Resolves a symbol by name through DbgHelp
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: symbol
      exact: SymFromName

  - id: dbghelp-symbol-type-query
    desc: Queries symbol type information through DbgHelp
    conf: 0.97
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: symbol
      regex: '^SymGetType(Info|FromName)$'

  - id: windows-kernel-pdb-reference
    desc: References a Windows kernel PDB file
    conf: 0.96
    for: [pe, dll, c, cpp, csharp, go, rust, powershell, python]
    if:
      type: text
      regex: '(?i)\bnt(krnlmp|oskrnl)\.pdb\b'

composite_rules:
  - id: windows-kernel-pdb-symbol-resolution
    desc: Resolves Windows kernel symbols from a PDB
    conf: 0.99
    for: [pe, dll, c, cpp, csharp, go, rust]
    all:
      - id: windows-kernel-pdb-reference
      - id: dbghelp-symbol-module-load
      - id: dbghelp-symbol-name-lookup
      - id: dbghelp-symbol-type-query
