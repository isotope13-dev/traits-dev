# Kernel symbol and type-layout inspection. These are neutral debugging and
# introspection capabilities; exploit intent comes from the consuming objective
# composite when they are paired with a kernel corruption primitive.
defaults:
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]

traits:
  - id: system-map-reference
    desc: Reads a Linux System.map file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(/boot/System\.map|/usr/src/linux.{0,80}System\.map)'

  - id: kernel-btf-reference
    desc: Reads Linux kernel BTF metadata
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/sys/kernel/btf(/[A-Za-z0-9_.-]+)?'

  - id: pahole-layout-inspection
    desc: Invokes pahole for kernel type layout
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'shutil\.which\s*\(\s*["'']pahole["'']\s*\)|["'']pahole["'']\s*,\s*["'']-(C|F)\b'

composite_rules:
  - id: kernel-symbol-map-reference
    desc: Reads Linux kernel symbol map data
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/fs/proc/system::proc-kallsyms
      - id: system-map-reference

  - id: kernel-layout-data-source
    desc: Kernel symbols and type-layout inspection
    crit: notable
    conf: 0.94
    all:
      - id: kernel-symbol-map-reference
      - id: kernel-btf-reference
      - id: pahole-layout-inspection
