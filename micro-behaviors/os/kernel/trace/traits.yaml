defaults:
  platforms: [unix]
  for: [c, cpp, elf, shell]

traits:
  - id: ftrace-ipmodify-hook
    desc: ftrace callback replaces a kernel function
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: identifier
      exact: FTRACE_OPS_FL_IPMODIFY
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: ftrace-enabled-variable
    desc: ftrace_enabled kernel variable
    crit: notable
    conf: 0.75
    if:
      type: text
      word: ftrace_enabled
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: tracing-on-variable
    desc: tracing_on kernel variable
    crit: notable
    conf: 0.75
    if:
      type: text
      word: tracing_on
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: tracing-on-control-file
    desc: References the tracefs tracing_on control file
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      exact: /sys/kernel/debug/tracing/tracing_on
  - id: set-event-control-file
    desc: References the tracefs set_event control file
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      exact: /sys/kernel/debug/tracing/set_event
  - id: current-tracer-control-file
    desc: References tracefs current_tracer control
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      exact: /sys/kernel/debug/tracing/current_tracer
