# binfmt_misc is a kernel table that maps file magic to an interpreter. A
# write to its register node installs a handler that runs any matching file,
# so it is a kernel-level execution hook. The path alone is a neutral
# reference; a read of .../status is not a registration.
defaults:
  platforms: [linux, android]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.95

traits:
  - id: linux-binfmt-misc-register-path
    desc: Names the binfmt_misc register handler path
    if:
      type: text
      substr: /proc/sys/fs/binfmt_misc/register
