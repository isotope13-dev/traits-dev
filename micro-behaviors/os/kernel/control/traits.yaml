# Sensitive Linux kernel helper paths cited by the CATana paper. The paths
# are neutral observations; execution intent is inferred only when they occur
# beside a SIM-originating AT channel and a command sink.
defaults:
  platforms: [linux, android, appliance]
  for: [source, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: procfs-pid-control-write
    desc: Writes process PID to procfs control node
    crit: suspicious
    conf: 0.98
    platforms: [linux]
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*echo\s+\$[A-Za-z_]*PID\w*\s*>\s*/proc/[A-Za-z][\w.-]*\s*$'

  - id: linux-uevent-helper-path
    desc: Linux uevent helper path reference
    if:
      type: literal
      kind: string
      exact: /sys/kernel/uevent_helper

  - id: linux-kernel-hotplug-path
    desc: Linux kernel hotplug path reference
    if:
      type: literal
      kind: string
      exact: /proc/sys/kernel/hotplug

  - id: object-manager-directory-create-api
    desc: Creates an NT object-manager directory
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: NtCreateDirectoryObjectEx

  - id: object-manager-symbolic-link-api
    desc: Creates an NT object-manager symbolic link
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: NtCreateSymbolicLinkObject

  - id: restricted-base-objects-namespace
    desc: Restricted BaseNamedObjects namespace reference
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      regex: '(?i)BaseNamedObjects.{0,48}Restricted'

  - id: globalroot-nt-path
    desc: References a Win32 globalroot NT path
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: globalroot

  - id: clfs-namespace-path
    desc: References a Common Log File System namespace
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    if:
      type: text
      word: CLFS

composite_rules:
  - id: object-manager-directory-alias
    desc: Builds an NT object-manager directory alias
    crit: notable
    conf: 0.97
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust, zig]
    all:
      - id: object-manager-directory-create-api
      - id: object-manager-symbolic-link-api
    any:
      - id: restricted-base-objects-namespace
      - id: globalroot-nt-path
