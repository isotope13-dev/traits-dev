defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  - id: physical-memory-device-path
    desc: References the PhysicalMemory device object
    if:
      type: text
      regex: '(?i)\\Device\\PhysicalMemory'

  # ZwOpenSection is a standard kernel API shared by section and
  # \Device\PhysicalMemory access; naming it is capability context, not by
  # itself kernel-object hiding. Rootkit composites that need it reference
  # this neutral capability.
  - id: zw-open-section-reference
    desc: References the ZwOpenSection kernel API
    conf: 0.94
    if:
      type: text
      word: ZwOpenSection

