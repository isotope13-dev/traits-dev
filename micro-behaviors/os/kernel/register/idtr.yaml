# x86 interrupt-descriptor-table register (IDTR) access.
#
# `sidt` stores IDTR to memory. It is an ordinary privileged-CPU accessor: every
# BSD/Linux `machine/cpufunc.h` declares an inline wrapper for it, hypervisors
# and VM-detection code read it, and kernel init loads it. Rootkit intent —
# reading the table in order to patch an entry — lives in
# objectives/evasion/kernel-hide/hook/, which composes this atom with the
# IDT-entry overwrite evidence.
defaults:
  platforms: [windows, linux]
  for: [c, cpp, elf]
  crit: notable
  conf: 0.9

traits:
  - id: sidt-instruction
    desc: References the x86 SIDT instruction
    if:
      type: text
      word: sidt
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
