# x86 CR0 control-register access. Reading and writing CR0 is a privileged
# operation, so it is analyst-relevant wherever it appears — but it is NOT by
# itself a rootkit signal. In-tree kernel code touches CR0 routinely for cache
# control (`drivers/cpufreq/powernow-k6.c` sets X86_CR0_CD around a frequency
# transition), suspend/resume register save-restore (`arch/x86/power/cpu.c`),
# and paging setup. What distinguishes a rootkit is clearing the *write-protect*
# bit (bit 16) to patch read-only kernel memory; that intent lives in
# objectives/evasion/kernel-hide/, which composes these atoms with WP evidence.
defaults:
  platforms: [unix]
  for: [c, cpp, elf]
  crit: notable
  conf: 0.95

traits:
  - id: cr0-read-call
    desc: Reads the x86 CR0 control register
    if:
      type: symbol
      kind: call
      exact: read_cr0
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: cr0-write-call
    desc: Writes the x86 CR0 control register
    if:
      type: symbol
      regex: ^write_cr0
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: native-cr0-write-call
    desc: Writes CR0 via native_write_cr0
    if:
      type: symbol
      regex: ^native_write_cr0
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  # GCC memory clobber used next to CR0/CR2/CR3/CR4 access so the compiler
  # cannot reorder the mov. Bootloaders (U-Boot) and the kernel share this
  # idiom; WP-bit clearing is the hide signal, not the barrier symbol.
  - id: force-order-variable
    desc: Compiler barrier for control-register access
    if:
      type: symbol
      kind: identifier
      exact: __force_order

  - id: cr0-inline-mov-source
    desc: Inline assembly writes CR0
    crit: notable
    conf: 0.94
    platforms: [linux]
    for: [c, cpp]
    if:
      type: string_literal
      substr: 'mov %0, %%cr0'
    unless:
      - type: text
        word: CR0_PG
      - type: text
        regex: 'mov %0, %%cr[34]'
      - id: metadata/lang/upstream::linux-kernel-arch-source-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: cr0-wp-complement-expression
    desc: CR0 beside complemented write-protect mask
    crit: suspicious
    conf: 0.99
    for:
    - c
    platforms: [linux]
    if:
      type: text
      regex: cr0\b[^\n]{0,48}~\s*0x0*10000\b|~\s*0x0*10000\b[^\n]{0,48}\bcr0
