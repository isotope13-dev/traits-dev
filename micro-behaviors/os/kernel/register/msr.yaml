# Formatted access-failure messages support MSR accessor capabilities, not
# successful execution, privilege escalation, or unauthorized CPU tuning.
defaults:
  platforms: [linux, windows]
  for: [elf, pe]
  crit: notable
  conf: 0.95

traits:
  - id: msr-read-failure-diagnostic
    desc: CPU MSR read failure diagnostic
    if:
      type: text
      substr: 'cannot read MSR 0x%'
  - id: msr-write-failure-diagnostic
    desc: CPU MSR write failure diagnostic
    if:
      type: text
      substr: 'cannot set MSR 0x%'
