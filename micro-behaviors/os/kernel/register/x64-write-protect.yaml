defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  arch: [x86-64]
traits:
  - id: x64-clears-cr0-write-protect
    desc: Native code clears CR0 write protection
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '0F 20 C0 48 25 FF FF FE FF 0F 22 C0'
