defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  arch: [x86-64]
traits:
  - id: x64-clears-cr0-write-protect
    desc: Native code clears CR0 write protection
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '0F 20 C0 48 25 FF FF FE FF 0F 22 C0'
    # UEFI images run in ring 0 with no OS to protect: EDK2's CPU and
    # page-table drivers drop CR0.WP to edit read-only page tables. Still
    # notable, since a bootkit patching the OS loader does the same.
    downgrade:
      any:
        - id: metadata/binary/header/characteristics::efi-pe-subsystem
