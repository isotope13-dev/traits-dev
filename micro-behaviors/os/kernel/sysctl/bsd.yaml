defaults:
  platforms: [unix]
  for: [shell, c, cpp, binaries]
traits:
  - id: kern-panic-write
    desc: BSD kern.panic sysctl write
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'sysctl\s+-w\s+kern\.panic=1'

  # `sysctl_handle_string()` is the stock BSD/XNU kernel helper a module calls
  # from its SYSCTL_PROC handler to copy a string node in or out -- it is how a
  # string sysctl is implemented, so FreeBSD's own kld examples, OpenZFS, and
  # every in-tree driver that exports a string knob call it. Neutral capability:
  # rootkits reach for it to build a sysctl command channel, but that inference
  # needs the rest of the cluster and lives in objectives/evasion/kernel-hide/.
  - id: bsd-sysctl-string-handler
    desc: Kernel module handles a string sysctl node
    crit: notable
    conf: 0.8
    for: [c, cpp]
    if:
      type: text
      regex: 'sysctl_handle_string\s*\(.{0,80},.{0,80}\)'
