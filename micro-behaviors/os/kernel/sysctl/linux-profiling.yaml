defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: sudo-shell-kptr-restrict-zero
    desc: Shell command requests kptr_restrict=0
    if:
      type: symbol
      kind: call
      regex: '(^|/)sudo$'
      args:
        - index: 0
          kind: identifier
          name_regex: '(^|/)(sh|bash|dash|zsh)$'
        - index: 1
          kind: identifier
          name: -c
        - index: 2
          kind: string
          regex: '^echo[ \t]+0[ \t]*>[ \t]*/proc/sys/kernel/kptr_restrict([ \t;]|$)'
  - id: sudo-shell-perf-event-paranoid-zero
    desc: Shell command requests perf_event_paranoid=0
    if:
      type: symbol
      kind: call
      regex: '(^|/)sudo$'
      args:
        - index: 0
          kind: identifier
          name_regex: '(^|/)(sh|bash|dash|zsh)$'
        - index: 1
          kind: identifier
          name: -c
        - index: 2
          kind: string
          regex: '^echo[ \t]+0[ \t]*>[ \t]*/proc/sys/kernel/perf_event_paranoid([ \t;]|$)'
  - id: shell-kptr-restrict-zero
    desc: Interpreter command requests kptr_restrict=0
    if:
      type: symbol
      kind: call
      regex: '(^|/)(sh|bash|dash|zsh)$'
      args:
        - index: 0
          kind: identifier
          name: -c
        - index: 1
          kind: string
          regex: '^echo[ \t]+0[ \t]*>[ \t]*/proc/sys/kernel/kptr_restrict([ \t;]|$)'
  - id: shell-perf-event-paranoid-zero
    desc: Interpreter requests perf_event_paranoid=0
    if:
      type: symbol
      kind: call
      regex: '(^|/)(sh|bash|dash|zsh)$'
      args:
        - index: 0
          kind: identifier
          name: -c
        - index: 1
          kind: string
          regex: '^echo[ \t]+0[ \t]*>[ \t]*/proc/sys/kernel/perf_event_paranoid([ \t;]|$)'
