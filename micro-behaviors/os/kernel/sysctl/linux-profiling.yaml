defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: sudo-shell-kernel-tunable-zero
    desc: Privileged shell zeros kernel profiling tunable
    if:
      type: symbol
      kind: call
      regex: '(^|/)sudo$'
      args:
        - index: 0
          kind: identifier
          name_regex: '(^|/)(sh|bash|dash|zsh)$'
        - index: 1
          kind: identifier
          name: -c
        - index: 2
          kind: string
          regex: '^echo[ \t]+0[ \t]*>[ \t]*/proc/sys/kernel/(kptr_restrict|perf_event_paranoid)([ \t;]|$)'
  - id: shell-kernel-tunable-zero
    desc: Shell zeros kernel profiling tunable
    if:
      type: symbol
      kind: call
      regex: '(^|/)(sh|bash|dash|zsh)$'
      args:
        - index: 0
          kind: identifier
          name: -c
        - index: 1
          kind: string
          regex: '^echo[ \t]+0[ \t]*>[ \t]*/proc/sys/kernel/(kptr_restrict|perf_event_paranoid)([ \t;]|$)'
