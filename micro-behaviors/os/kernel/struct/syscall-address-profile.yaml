defaults:
  platforms: [unix]
  for: [c, elf]

composite_rules:
  - id: syscall-table-address-close-profile
    desc: Syscall-table, address and close references
    crit: notable
    conf: 0.95
    size_max: 1048576
    all:
      - id: "micro-behaviors/os/kernel/struct::syscall-table-ref"
    any:
      - id: micro-behaviors/os/kernel/struct::kernel-addr-i386
      - id: micro-behaviors/os/kernel/struct::kernel-addr-x64
      - id: micro-behaviors/fs/file/handle::sys-close-reference
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
      # The crash dump analyser resolves the syscall table by design.
      - id: well-known/tool/reverse-engineering/crash-utility::crash-utility-source
