# Core Linux kernel structure usage — kernel-programming facts shared by
# drivers, tracers, and glibc-adjacent headers. Rootkit intent lives in
# objectives/evasion/kernel-hide composites that reference these cross-tier.
defaults:
  platforms: [linux, android]
  for: [c]
  crit: notable
  conf: 0.85
traits:
  - id: pipe-buffer-can-merge-flag-reference
    desc: References Linux pipe-buffer merge flag
    crit: notable
    conf: 0.96
    platforms: [linux]
    for: [c, cpp, go, rust, python, elf]
    if:
      type: text
      word: PIPE_BUF_FLAG_CAN_MERGE
    unless:
      - id: metadata/lang/upstream::linux-kernel-source-tree-path
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/offensive/gef::gef-gdb-script
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/
      - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
  - id: task-struct
    desc: Linux task_struct usage
    if:
      type: text
      substr: task_struct
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # daemonize() and other vanilla kernel code assign/read current->files;
  # no hiding intent without a composite pairing it with concealment.
  - id: current-files-access
    desc: Current process file table access
    if:
      type: symbol
      kind: member
      exact: current.files
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # task->files->fdt is the fdtable pointer every VFS walker uses to reach
  # an open struct file. Drivers, tracers, and buffer scrubbers read it
  # without hiding a descriptor. Moved from kernel-hide, where the member
  # alone was suspicious.
  - id: files-fdt-member
    desc: Reads task files_struct fdtable pointer
    if:
      type: symbol
      kind: member
      regex: (^|\.)files\.fdt$
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: cred-struct
    desc: Linux struct cred usage
    if:
      type: text
      regex: '\bstruct\s+cred\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # Reaching a struct file's dentry is the standard way to recover the name
  # of an open file. VFS tracers (bcc/libbpf-tools fsslower, filetop,
  # opensnoop), filesystem drivers and LSM hooks all do it, so the member
  # read on its own carries no hiding intent; kernel-hide composites supply
  # that by combining it with dirent rewriting or syscall-table patching.
  - id: file-path-dentry-member
    desc: Reads struct file f_path.dentry member
    if:
      type: symbol
      kind: member
      exact: f_path.dentry
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: dentry-inode-member
    desc: Reads dentry d_inode member
    if:
      type: symbol
      kind: member
      regex: '\.d_inode$'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: pt-regs-di-member
    desc: Kernel register struct RDI member access
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '\.di$'
  - id: pt-regs-si-member
    desc: Kernel register struct RSI member access
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '\.si$'
  - id: pt-regs-type
    desc: Linux pt_regs type reference
    conf: 0.95
    if:
      type: text
      regex: '\b(struct\s+)?pt_regs\b'

composite_rules:
  # Reading a probed function's first two arguments out of pt_regs: what
  # every kprobe, ftrace and syscall-table handler does, rootkit or not.
  # wolfSSL's linuxkm module does it to swap its FIPS DRBG in for
  # get_random_bytes(). Moved from objectives/evasion/kernel-hide, where it
  # convicted at suspicious with no hiding behaviour in either leg.
  - id: pt-regs-di-access
    desc: pt_regs RDI register access
    conf: 0.95
    all:
      - id: pt-regs-type
      - id: pt-regs-di-member
  - id: pt-regs-si-access
    desc: pt_regs RSI register access
    conf: 0.95
    all:
      - id: pt-regs-type
      - id: pt-regs-si-member
