# Core Linux kernel structure usage — kernel-programming facts shared by
# drivers, tracers, and glibc-adjacent headers. Rootkit intent lives in
# objectives/evasion/kernel-hide composites that reference these cross-tier.
defaults:
  platforms: [linux, android]
  for: [c]
  crit: notable
  conf: 0.85
traits:
  - id: task-struct
    desc: Linux task_struct usage
    if:
      type: text
      substr: task_struct
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: cred-struct
    desc: Linux struct cred usage
    if:
      type: text
      regex: '\bstruct\s+cred\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # Reaching a struct file's dentry is the standard way to recover the name
  # of an open file. VFS tracers (bcc/libbpf-tools fsslower, filetop,
  # opensnoop), filesystem drivers and LSM hooks all do it, so the member
  # read on its own carries no hiding intent; kernel-hide composites supply
  # that by combining it with dirent rewriting or syscall-table patching.
  - id: file-path-dentry-member
    desc: Reads struct file f_path.dentry member
    if:
      type: symbol
      kind: member
      exact: f_path.dentry
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
