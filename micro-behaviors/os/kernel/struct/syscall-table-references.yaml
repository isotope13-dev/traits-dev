traits:
- for:
  - c
  - elf
  id: syscall-table-ref
  desc: Reference to sys_call_table
  conf: 0.8
  if:
    type: text
    substr: sys_call_table
  unless:
  - id: micro-behaviors/os/kernel/struct::syscall-table-identifier
  - id: metadata/file/string/artifact::linux-btf-vmlinux-type-dump
  - id: metadata/file/naming::linux-vmlinux-header-basename
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: syscall-table-identifier
  desc: Uses sys_call_table identifier
  conf: 0.99
  for:
  - c
  if:
    type: symbol
    kind: identifier
    exact: sys_call_table
  unless:
  - id: well-known/app/system/xilinx-onload::onload-kernel-source-context
  - id: metadata/lang/upstream::linux-kernel-arch-source-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/lang/upstream::linux-kernel-source-tree-path
- platforms:
  - unix
  for:
  - c
  - cpp
  id: c-syscall-table-word-reference
  desc: C references the Linux syscall table
  conf: 0.85
  if:
    type: text
    word: sys_call_table
  unless:
  - id: micro-behaviors/os/kernel/struct::syscall-table-identifier
  - id: well-known/app/system/xilinx-onload::onload-kernel-source-context
  - id: metadata/lang/upstream::linux-kernel-arch-source-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
defaults:
  crit: notable
  platforms:
  - linux
