# Windows kernel object structure members. Naming an EPROCESS, DRIVER_OBJECT
# or LIST_ENTRY field is ordinary kernel-programming vocabulary — filter
# drivers, crash-dump parsers, WinDbg extensions and forensic tools all reach
# for the same members. Concealment intent is supplied by the
# objectives/evasion/kernel-hide composites that pair a named list with the
# write that splices an entry out of it.
defaults:
  platforms: [windows]
  for: [binaries, c, cpp, rust, go, csharp, zig]
  crit: notable
  conf: 0.94
traits:
  # Matched without a trailing boundary so the offset constants and helper
  # names that DKOM code builds around the member (ActiveProcessLinksOffset,
  # ACTIVE_PROCESS_LINKS) count as well as a plain member access.
  - id: active-process-links-field
    desc: EPROCESS ActiveProcessLinks list entry
    attack: "T1014"
    if:
      type: text
      regex: '(?i)\bActive_?Process_?Links'
  - id: eprocess-pointer-diagnostic
    desc: EPROCESS pointer diagnostic format
    crit: notable
    conf: 0.98
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)\bpEprocess\s+%u\b'
  - id: driver-section-field
    desc: DRIVER_OBJECT DriverSection loader entry
    conf: 0.92
    if:
      type: text
      word: DriverSection
  - id: driver-dispatch-table-field
    desc: Driver-object MajorFunction dispatch table
    conf: 0.9
    if:
      type: text
      word: MajorFunction
  # A doubly-linked-list splice writes the neighbours' cross pointers so the
  # entry between them disappears from a forward or backward walk. Kernel code
  # does this legitimately through RemoveEntryList; open-coding it against a
  # named kernel list is what the kernel-hide composites key on.
  - id: list-entry-splice-write
    desc: Writes a LIST_ENTRY neighbour cross pointer
    for: [c, cpp, rust]
    conf: 0.9
    if:
      type: symbol
      kind: bind
      regex: '\.(Flink\.Blink|Blink\.Flink)$'
