defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
- id: copy-key-buffer-to-user
  desc: "Copies named keyBuffer to user space"
  crit: suspicious
  conf: 0.94
  if:
    type: text
    substr: 'copy_to_user(buf, keyBuffer'

- id: printk-symbol
  desc: References the kernel printk routine
  crit: notable
  conf: 0.7
  for: [c]
  if:
    type: symbol
    exact: printk
  unless:
  - id: micro-behaviors/os/syscall/invoke/
  - id: metadata/lang/upstream::linux-kernel-arch-source-path
  - id: metadata/lang/upstream::linux-kernel-source-tree-path
  - id: metadata/package/documentation/manpage::unix-manpage
