defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: uefi-global-variable-namespace-guid
    desc: UEFI global-variable namespace GUID
    conf: 0.99
    if:
      type: text
      section: .text
      substr: 8BE4DF61-93CA-11D2-AA0D-00E098032B8C
  - id: uefi-boot-order-variable-name
    desc: UEFI BootOrder variable-name reference
    conf: 0.95
    if:
      type: text
      section: .text
      exact: BootOrder
composite_rules:
  - id: managed-uefi-zero-length-write-layout
    desc: UEFI setter with CIL zero-length call layout
    conf: 0.95
    all:
      - id: uefi-global-variable-namespace-guid
      - id: set-firmware-env-var
      - id: micro-behaviors/data/control-flow/sequence::cil-string-static-field-zero-call
