defaults:
  platforms: [linux]
  for: [c, elf]

traits:
  - id: proc-fill-cache-symbol
    desc: References Linux proc_fill_cache routine
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: proc_fill_cache

  - id: pid-getattr-symbol
    desc: References Linux pid_getattr routine
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: pid_getattr

  - id: proc-root-readdir-symbol
    desc: proc_root_readdir function symbol
    crit: notable
    conf: 0.85
    if:
      type: symbol
      substr: proc_root_readdir
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path

  - id: core-pattern-proc-path
    desc: Linux core-pattern proc path
    crit: notable
    conf: 0.92
    for: [c, cpp, rust, go, python, elf]
    if:
      type: literal
      kind: string
      substr: /proc/sys/kernel/core_pattern

  - id: core-pattern-pipe-fd
    desc: Core pipe handler uses proc fd
    crit: suspicious
    conf: 0.96
    for: [c, cpp, rust, go, python, elf]
    if:
      type: literal
      kind: string
      regex: '^\|/proc/%[pP]/fd/[0-9]{1,5}(\s|$)'
