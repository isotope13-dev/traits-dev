# XNU private process bookkeeping reached from a kernel extension: the
# unexported _allproc list resolved by symbol name, and a proc's links into
# it removed. Apple's KPIs give kexts neither.
defaults:
  platforms: [macos]
  for: [c]
  conf: 0.9

traits:
  - id: xnu-allproc-symbol-resolved
    desc: Resolves the unexported _allproc symbol
    crit: notable
    if:
      type: text
      regex: '\w+\(\s*[^,()]{1,60},\s*"_allproc"\s*\)'

  - id: xnu-proc-unlinked-from-lists
    desc: Unlinks a proc from process lists
    crit: notable
    if:
      type: text
      regex: 'LIST_REMOVE\(\s*\w+\s*,\s*p_list\s*\)[\s\S]{0,80}LIST_REMOVE\(\s*\w+\s*,\s*p_hash\s*\)'
