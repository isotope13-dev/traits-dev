defaults:
  platforms: [linux, openwrt]
  for: [elf]
traits:
  - id: syscall-kexec-load
    desc: "Invokes kexec_load for a kernel image"
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["kexec_load"]
    unless:
      # Linux syscall numbers are the wrong table for BSD kernels.
      - id: metadata/vendor/identity::bsd-elf-osabi
      # NetBSD libc's OSABI is often none; the soname is the library.
      - id: metadata/path/software::netbsd-libc-soname
      # A core dump is a memory image of a crashed process; syscall-shaped
      # bytes in it are data, not code that issues the call.
      - id: metadata/binary/header/identity::elf-core-dump
  - id: syscall-kexec-file-load
    desc: "Invokes kexec_file_load for a kernel image"
    crit: notable
    conf: 0.8
    if:
      type: syscall
      name: ["kexec_file_load"]
    unless:
      - id: metadata/binary/header/identity::elf-core-dump
composite_rules: []
