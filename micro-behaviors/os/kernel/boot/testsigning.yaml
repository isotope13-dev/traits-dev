# Windows test-signing boot configuration via bcdedit.
defaults:
  conf: 0.95
  platforms: [windows]
  for: [binaries, scripts, source]
  crit: notable

traits:
  - id: bcdedit-testsigning
    desc: Enables kernel driver test signing
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\W{1,24}/set[^\r\n]{1,80}\btestsigning\s+(on|yes)\b'

  - id: bcdedit-exe-reference
    desc: References Windows bcdedit utility
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\b'

  - id: bcdedit-testsigning-option
    desc: Enables kernel driver test signing flag
    if:
      type: text
      regex: '(?i)/set(\s+\{[^}\r\n]{1,40}\})?\s+testsigning\s+(on|yes)\b'

  - id: bcdedit-nointegritychecks-option
    desc: Disables kernel code integrity checks flag
    if:
      type: text
      regex: '(?i)/set(\s+\{[^}\r\n]{1,40}\})?\s+nointegritychecks\s+(on|yes)\b'

composite_rules:
  - id: bcdedit-signing-bypass-command
    desc: bcdedit disables kernel driver signing enforcement
    attack: T1553.006
    all:
      - id: bcdedit-exe-reference
    any:
      - id: bcdedit-testsigning-option
      - id: bcdedit-nointegritychecks-option
