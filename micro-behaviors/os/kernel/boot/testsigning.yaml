# Windows test-signing boot configuration via bcdedit.
defaults:
  conf: 0.95
  platforms: [windows]
  for: [binaries, scripts, source]
  crit: notable

traits:
  - id: bcdedit-testsigning
    desc: Enables kernel driver test signing
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\W{1,24}/set[^\r\n]{1,80}\btestsigning\s+(on|yes)\b'
