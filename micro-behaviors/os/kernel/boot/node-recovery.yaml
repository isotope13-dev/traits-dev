# Command arguments establish a requested boot configuration change, not
# ransomware or sabotage. Administrative repair tools may use these too.
# Match the argument independently of the callee name: wrappers and imported
# aliases retain this fact even when call-target resolution is unavailable.
# Passing command text does not establish that the recipient executes it.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-exec-bootrec-fixmbr
    desc: Passes boot repair command as argument
    if:
      type: symbol
      kind: call
      regex: '.+'
      arg:
        index: 0
        kind: string
        regex: '(?i)^bootrec(\.exe)?\s+/fixmbr\s*$'

  - id: node-exec-bcdedit-recovery-disable
    desc: Exec argument requests boot recovery disablement
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][\w$]*\.)*exec(Sync)?$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^bcdedit(\.exe)?\s+/set\s+.{0,48}\brecoveryenabled\s+no$'

  - id: node-exec-bcdedit-ignore-failures
    desc: Exec argument requests ignoring boot failures
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][\w$]*\.)*exec(Sync)?$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^bcdedit(\.exe)?\s+/set\s+.{0,48}\bbootstatuspolicy\s+ignoreallfailures$'
