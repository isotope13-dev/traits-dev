# Command arguments establish a requested boot configuration change, not
# ransomware or sabotage. Administrative repair tools may use these too.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-exec-bcdedit-recovery-disable
    desc: Exec argument requests boot recovery disablement
    if:
      type: symbol
      kind: call
      regex: '^(exec|execSync)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^bcdedit(\.exe)?\s+/set\s+.{0,48}\brecoveryenabled\s+no$'

  - id: node-exec-bcdedit-ignore-failures
    desc: Exec argument requests ignoring boot failures
    if:
      type: symbol
      kind: call
      regex: '^(exec|execSync)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^bcdedit(\.exe)?\s+/set\s+.{0,48}\bbootstatuspolicy\s+ignoreallfailures$'
