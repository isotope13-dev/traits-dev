# Windows Safe Mode boot configuration via bcdedit.
#
# Relocated from objectives/impact/degrade/edr/teardown and
# objectives/evasion/anti-av/safe-mode (2026-08). Both matchers read a bcdedit
# command line and nothing else: a one-line admin snippet that reboots a
# workstation into Safe Mode to troubleshoot a driver matches exactly what a
# ransomware pre-encryption stage runs. The teardown and anti-AV intent comes
# from the EDR service targets and persistence legs the composites add.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  crit: notable

traits:
  - id: bcdedit-safeboot-minimal
    desc: Sets the next boot to Safe Mode
    conf: 0.95
    unless:
    - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites
    if:
      # Any boot identifier ({current}, {default}, {bootmgr}, or a GUID) plus
      # either the Minimal or Network Safe Mode target. Allow only source-code
      # argument punctuation between tokens so Process.Start/exec.Command forms
      # are covered without matching descriptive prose.
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\W{1,24}/set[^\r\n]{1,80}\bsafeboot\W{1,8}(minimal|network)\b'

  - id: bcdedit-safeboot-alternate-shell
    desc: Sets Safe Mode shell to cmd.exe
    conf: 0.95
    # `safebootalternateshell yes` makes Safe Mode launch cmd.exe instead of
    # explorer.exe, giving an unattended command shell after the forced reboot.
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\s+/set\s+\{[^}\r\n]{1,40}\}\s+safebootalternateshell\s+yes\b'
