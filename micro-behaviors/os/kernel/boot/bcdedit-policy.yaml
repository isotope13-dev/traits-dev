defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

traits:
- id: bcdedit-ignore-failures
  desc: bcdedit ignore-all-boot-failures command text
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z])bcdedit.{0,16}/set.{0,16}bootstatuspolicy.{0,4}ignoreallfailures(z.?|\b)'
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: micro-behaviors/metaprogramming/generation/source::configured-source-builder
  - id: metadata/file/format/test-signature::eicar-test-string-reference
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
