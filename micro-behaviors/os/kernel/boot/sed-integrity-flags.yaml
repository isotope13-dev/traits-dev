defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.94
traits:
  - id: sed-remove-module-signature-enforcement-flag
    desc: sed expression removes module-signature flag
    if:
      type: text
      regex: '(?m)^\s*-e\s+["'']s/module\.sig_enforce=1//["'']'
  - id: sed-add-ima-appraisal-off-flag
    desc: sed expression adds IMA appraisal-off flag
    if:
      type: text
      regex: '(?m)^\s*-e\s+["'']s/[^/\n]{1,40}/[^/\n]{0,40}\bima_appraise=off/["'']'
