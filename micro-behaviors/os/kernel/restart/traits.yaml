# Userspace names for the kernel wait-restart path. Each string is a
# symbol the exploit looks up; intent comes from the econet composite.
defaults:
  platforms: [linux]
  for: [elf, c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: compat-sys-wait4-name
    desc: Names the compat_sys_wait4 syscall
    if:
      type: text
      substr: compat_sys_wait4
  - id: kernel-restart-block-name
    desc: Names the kernel restart_block
    if:
      type: text
      substr: restart_block
