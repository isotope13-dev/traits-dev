# DOS operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - dos_com
  - data
  size_max: 65536
traits:
- id: dos-reboot-after-bios-disk-call
  desc: DOS reboots after BIOS disk call
  crit: notable
  conf: 0.88
  if:
    type: yara
    source: |
      rule dos_reboot_after_bios_disk_call {
        meta:
          filetypes = "dos_com,data"
        strings:
          $reboot = { CD 13 CD 19 }
        condition:
          $reboot in (0..512)
      }
