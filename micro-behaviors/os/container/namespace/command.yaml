defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: notable
  conf: 0.95

traits:
  # Long-option argv, including the map-root-user option used by the report.
  # No dependency on the attacker-selected executable or interface name.
  - id: user-network-namespace-long-argv
    desc: Unshare argv selects user and network namespaces
    if:
      type: tree-sitter
      kind: call
      regex: '["'']--user["'']\s*,\s*(["'']--map-root-user["'']\s*,\s*)?["'']--net["'']'
