defaults:
  platforms:
    - unix
  for: [shell, python, go, c, cpp, elf]
traits:
  - id: runc-oci-str
    desc: OCI runc runtime
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: opencontainers/runc
  - id: libcontainer-str
    desc: libcontainer library
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: libcontainer
  - id: cri-api-str
    desc: Container Runtime Interface API
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: cri-api
  - id: runtimeservice-str
    desc: CRI RuntimeService
    crit: notable
    conf: 0.8
    if:
      type: text
      word: RuntimeService
  - id: opencontainers-str
    desc: opencontainers string
    crit: component
    if:
      type: text
      substr: opencontainers
  - id: oci-runtime-spec-str
    desc: oci-runtime-spec string
    crit: component
    if:
      type: text
      substr: oci-runtime-spec
  - id: image-spec-str
    desc: image-spec string
    crit: component
    if:
      type: text
      substr: image-spec
  - id: org-opencontainers-str
    desc: org.opencontainers annotation
    crit: component
    if:
      type: text
      substr: org.opencontainers
  - id: prestart-str
    desc: prestart hook
    crit: component
    if:
      type: text
      word: prestart
  - id: poststart-str
    desc: poststart hook
    crit: component
    if:
      type: text
      word: poststart
  - id: poststop-str
    desc: poststop hook
    crit: component
    if:
      type: text
      word: poststop
  - id: cni-github-str
    desc: containernetworking/cni string
    crit: component
    if:
      type: text
      substr: containernetworking/cni
  - id: cni-prefix-str
    desc: CNI_ environment prefix
    crit: component
    if:
      type: text
      substr: CNI_
  - id: cni-libcni-str
    desc: cni/libcni string
    crit: component
    if:
      type: text
      substr: cni/libcni
  - id: clone-newnet-str
    desc: CLONE_NEWNET constant
    crit: component
    if:
      type: text
      word: CLONE_NEWNET

  - id: unshare-namespace-call
    desc: Calls Linux unshare for namespaces
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, python, elf]
    platforms: [linux]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)unshare$'

  - id: new-user-namespace-flag
    desc: References CLONE_NEWUSER namespace flag
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, python, elf]
    platforms: [linux]
    if:
      type: text
      word: CLONE_NEWUSER
  - id: user-network-namespace-command
    desc: Unshares user and network namespaces
    crit: notable
    conf: 0.94
    for: [shell, python, c, cpp, rust, go, elf]
    platforms: [linux]
    if:
      type: text
      regex: '\bunshare\b[^\n]{0,80}(-Urn\b|["'']-Urn["''])'
  - id: setns-str
    desc: setns syscall
    crit: component
    if:
      type: text
      word: setns
  # Distributions gate unprivileged user-namespace creation behind these two
  # sysctl knobs, and raising either from zero re-opens the namespace path that
  # local kernel exploits use to reach otherwise privileged subsystems (the
  # esp4/xfrm route in Dirty Frag, CVE-2026-43284, is the current example).
  # Container hosts and CI runners set them legitimately, so this stays a
  # neutral configuration capability; intent comes from the composites that
  # pair it with an exploit target.  Keyed on a non-zero value so a hardening
  # script setting the same knob to 0 does not read as the opposite action.
  - id: unprivileged-userns-sysctl-enable
    desc: Raises unprivileged user-namespace sysctl
    crit: notable
    conf: 0.92
    for: [shell, python, go, rust, elf, systemd]
    platforms: [linux]
    if:
      type: text
      regex: '\b(user\.max_user_namespaces|kernel\.unprivileged_userns_clone)\s*=\s*[1-9]'
  - id: veth-str
    desc: veth interface
    crit: component
    if:
      type: text
      word: veth
  - id: bridge-str
    desc: Linux bridge interface marker
    crit: component
    if:
      type: text
      regex: '\b(brctl|docker0|virbr[0-9]+)\b|/sys/class/net/\w+/bridge'
  - id: k8s-apps-v1-str
    desc: Kubernetes apps/v1 API
    crit: notable
    conf: 0.85
    for: [python, javascript, go, java]
    if:
      type: text
      substr: apis/apps/v1
  - id: k8s-pods-v1-str
    desc: Kubernetes pods API
    crit: notable
    conf: 0.85
    for: [python, javascript, go, java]
    if:
      type: text
      substr: api/v1/pods
  - id: kubeconfig-env-str
    desc: KUBECONFIG environment variable
    crit: notable
    conf: 0.8
    for: [shell, python, javascript, go]
    if:
      type: text
      word: KUBECONFIG
  # `nsenter -t 1` is a shell command line, so gating it to JS/TS (as this trait
  # did until 2026-07) hid the canonical T1611 escape everywhere it is actually
  # written: a shell post-exploitation script, `os.system("nsenter -t 1 ...")` in
  # a Python dropper, exec.Command in a Go implant, or the same string in a
  # compiled binary. The sibling KUBECONFIG atom above already spans
  # shell/python/javascript/go for the same reason. Measured over 108,671 text
  # files under /usr/bin, /usr/share, /etc, /usr/lib, /usr/sbin and /opt: zero
  # occurrences, so the carrier widening costs nothing in precision.
  #
  # The stricter GTFOBins spelling in objectives/execution/lolbin/os
  # (`nsenter-namespace-shell`, which also demands a shell payload) stays
  # shell-only on purpose: this atom is the canonical "joins host PID 1
  # namespaces" capability and should not be double-reported.
  - id: nsenter-pid-one
    desc: Enters host PID 1 namespace
    crit: suspicious
    conf: 0.95
    attack: T1611
    unless:
      # Ginkgo e2e specs are ordinary .go files, so go-test-file misses them.
      - id: metadata/package/testing/compiled::ginkgo-spec-file
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/agent-glovebox::archive-context
      - id: well-known/app/infrastructure/lfk::lfk-k8s-navigator
      # Log assertions can quote this command as expected failed output without
      # ever launching nsenter.
      - type: text
        regex: '(?i)command failed:.{0,80}nsenter\s+(-t|--target)\s+1\b'
      - type: text
        regex: 'nsenter\s+(-t|--target)\s+1\s+-m\s+systemctl\b'
      - id: well-known/tool/offensive/bingo/
    for: [shell, python, javascript, typescript, powershell, go, rust, binaries]
    if:
      type: text
      regex: '\bnsenter\s+(-t|--target)\s+1\b'
  - id: nsenter-pid-one-argv
    desc: nsenter argv selects host PID 1
    crit: suspicious
    conf: 0.95
    attack: T1611
    unless:
      - id: well-known/app/infrastructure/lfk::lfk-k8s-navigator
    for: [python, javascript, typescript, go, rust, binaries]
    if:
      type: text
      regex: '["'']nsenter["'']\s*,\s*["'']--target["'']\s*,\s*["'']1["'']'
  - id: host-root-chroot-command
    desc: Command enters a mounted host root
    crit: notable
    conf: 0.96
    attack: T1611
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bchroot\s+/(host|mnt|rootfs)\b'
  - id: host-root-chroot-argv
    desc: Process argv enters a mounted host root
    crit: notable
    conf: 0.96
    attack: T1611
    for: [scripts, binaries]
    if:
      type: text
      regex: '["'']chroot["'']\s*,\s*["'']/(host|mnt|rootfs)["'']'
composite_rules:
  - id: host-root-chroot
    desc: Enters a mounted host root
    crit: notable
    conf: 0.97
    attack: T1611
    any:
      - id: host-root-chroot-command
      - id: host-root-chroot-argv
  - id: runc-refs
    desc: Runc references
    crit: notable
    conf: 0.9
    any:
      - id: runc-oci-str
      - id: libcontainer-str
  - id: cri-refs
    desc: CRI API references
    crit: notable
    conf: 0.85
    all:
      - id: cri-api-str
      - id: runtimeservice-str
  - id: runtime
    desc: Container runtime library usage
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/proc/container::runtime-keywords
      - id: runc-refs
      - id: cri-refs
  - id: oci-refs
    desc: OCI specification references
    crit: component
    any:
      - id: opencontainers-str
      - id: oci-runtime-spec-str
      - id: image-spec-str
  - id: hooks-refs
    desc: Container hooks
    crit: component
    needs: 2
    any:
      - id: prestart-str
      - id: poststart-str
      - id: poststop-str
  - id: hooks-with-config
    desc: Hooks with config.json
    crit: component
    all:
      - id: hooks-refs
      - id: metadata/package/config::config-json-file
  - id: oci
    desc: OCI specification compliance
    crit: notable
    conf: 0.9
    any:
      - id: oci-refs
      - id: org-opencontainers-str
      - id: hooks-with-config
  - id: cni-refs
    desc: CNI references
    crit: component
    any:
      - id: cni-github-str
      - id: cni-prefix-str
      - id: cni-libcni-str
  - id: ns-refs
    desc: Network namespace references
    crit: component
    any:
      - id: clone-newnet-str
      - id: setns-str
  - id: net-refs
    desc: Network interface references
    crit: component
    any:
      - id: veth-str
      - id: bridge-str
  - id: ns-clone-setns
    desc: Clone and setns combo
    crit: component
    all:
      - id: clone-newnet-str
      - id: setns-str

  - id: user-network-namespace-setup
    desc: Creates user and network namespaces
    crit: notable
    conf: 0.95
    for: [c, cpp, rust, go, python, elf]
    platforms: [linux]
    all:
      - id: unshare-namespace-call
      - id: new-user-namespace-flag
      - id: clone-newnet-str
  - id: net-with-ns
    desc: Network interfaces with namespace
    crit: component
    all:
      - id: net-refs
      - id: ns-refs
  - id: network
    desc: Container networking patterns
    crit: notable
    conf: 0.85
    any:
      - id: cni-refs
      - id: ns-clone-setns
      - id: net-with-ns
  - id: k8s-api-paths
    desc: Kubernetes API paths
    crit: notable
    conf: 0.85
    any:
      - id: k8s-apps-v1-str
      - id: k8s-pods-v1-str
  - id: kubernetes-comp
    desc: Kubernetes client library
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/container/runtime::kubernetes
      - id: k8s-api-paths
      - id: kubeconfig-env-str
