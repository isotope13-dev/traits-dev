# Namespace operations and namespace-specific evidence.
defaults: {}
traits:
- id: clone-newnet-str
  desc: CLONE_NEWNET constant
  crit: notable
  if:
    type: text
    word: CLONE_NEWNET
  platforms:
  - unix
  for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
- id: unshare-namespace-call
  desc: Calls Linux unshare for namespaces
  crit: notable
  conf: 0.9
  for:
  - c
  - cpp
  - rust
  - go
  - python
  - elf
  platforms:
  - linux
  if:
    type: symbol
    kind: call
    regex: (^|\.)unshare$
- id: new-user-namespace-flag
  desc: References CLONE_NEWUSER namespace flag
  crit: notable
  conf: 0.9
  for:
  - c
  - cpp
  - rust
  - go
  - python
  - elf
  platforms:
  - linux
  if:
    type: text
    word: CLONE_NEWUSER
- id: user-network-namespace-command
  desc: Unshares user and network namespaces
  crit: notable
  conf: 0.94
  for:
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - elf
  platforms:
  - linux
  if:
    type: text
    regex: \bunshare\b[^\n]{0,80}(-Urn\b|["']-Urn["'])
- id: setns-str
  desc: setns syscall
  crit: notable
  if:
    type: text
    word: setns
  platforms:
  - unix
  for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
- id: unprivileged-userns-sysctl-enable
  desc: Raises unprivileged user-namespace sysctl
  crit: notable
  conf: 0.92
  for:
  - shell
  - python
  - go
  - rust
  - elf
  - systemd
  platforms:
  - linux
  if:
    type: text
    regex: \bsysctl +-w +(kernel\.unprivileged_userns_clone|user\.max_user_namespaces)=[1-9]
- id: nsenter-pid-one
  desc: References nsenter targeting PID 1 namespaces
  crit: notable
  conf: 0.95
  attack: T1611
  unless:
  - id: metadata/package/testing/corpus/
  - id: metadata/package/testing/compiled::ginkgo-spec-file
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: well-known/app/infrastructure/lfk::lfk-k8s-navigator
  - type: text
    regex: (?i)command failed:.{0,80}nsenter\s+(-t|--target)\s+1\b
  - type: text
    regex: nsenter\s+(-t|--target)\s+1\s+-m\s+systemctl\b
  - id: well-known/tool/offensive/bingo/
  - id: metadata/file/extension/identity::markdown-file-basename
  for:
  - shell
  - python
  - javascript
  - typescript
  - powershell
  - go
  - rust
  - binaries
  if:
    type: text
    regex: \bnsenter\s+(-t|--target)\s+1\b
  platforms:
  - unix
- id: nsenter-pid-one-argv
  desc: nsenter argv selects PID 1 namespaces
  crit: notable
  conf: 0.95
  attack: T1611
  unless:
  - id: well-known/app/infrastructure/lfk::lfk-k8s-navigator
  for:
  - shell
  - python
  - javascript
  - typescript
  - go
  - rust
  - binaries
  if:
    type: text
    regex: '["'']nsenter["'']\s*,\s*["''](-t|--target)["'']\s*,\s*["'']1["'']'
  platforms:
  - unix
composite_rules:
- id: ns-refs
  desc: Network namespace references
  crit: component
  any:
  - id: clone-newnet-str
  - id: setns-str
  platforms:
  - unix
  for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
- id: ns-clone-setns
  desc: Clone and setns combo
  crit: notable
  all:
  - id: clone-newnet-str
  - id: setns-str
  platforms:
  - unix
  for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
- id: user-network-namespace-setup
  desc: Creates user and network namespaces
  crit: notable
  conf: 0.95
  for:
  - elf
  - python
  - c
  - go
  platforms:
  - linux
  all:
  - id: unshare-namespace-call
  - id: new-user-namespace-flag
  - id: clone-newnet-str
