# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: unshare-user-namespace-syscall
    desc: Requests a new user namespace
    crit: notable
    if:
      type: syscall
      name: [unshare]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          mask: 268435456
  - id: unshare-mount-namespace-syscall
    desc: Requests a new mount namespace
    crit: notable
    if:
      type: syscall
      name: [unshare]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          mask: 131072
  - id: clone-user-namespace-syscall
    desc: Creates a task in a user namespace
    crit: notable
    if:
      type: syscall
      name: [clone]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          mask: 268435456
  - id: clone-mount-namespace-syscall
    desc: Creates a task in a mount namespace
    crit: notable
    if:
      type: syscall
      name: [clone]
      arch: [x86_64, aarch64]
      args:
        - index: 0
          mask: 131072
