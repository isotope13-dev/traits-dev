defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: docker-api-container-kill-request
    desc: Calls Docker container kill endpoint
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (call_expression
          arguments: (arguments
            (string (string_fragment) @method)
            (binary_expression) @path)
          (#eq? @method "POST")
          (#match? @path "[\"']/containers/[\"']")
          (#match? @path "[\"']/kill[\"']")) @match
