# Neutral observations; attack consumers must supply intent-specific evidence.
composite_rules:
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  id: privileged-hostpath-chroot
  desc: Privileged hostPath spec with host chroot
  conf: 0.995
  all:
  - id: micro-behaviors/os/container/runtime::privileged-field-text
  - id: micro-behaviors/os/container/runtime::hostpath-volume-spec
  - id: micro-behaviors/fs/directory/root::host-root-chroot
  near_lines: 80
  unless:
  - id: micro-behaviors/os/container/runtime::ephemeral-hardened-check-pod-context
