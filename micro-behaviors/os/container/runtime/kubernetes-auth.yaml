# Kubernetes credential-minting and authorization-review API surfaces. These
# paths are neutral when used by token brokers and permission-audit tools;
# lateral-movement objectives combine them with the identity source and the
# downstream network pivot.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: serviceaccount-tokenrequest-path
    desc: Kubernetes TokenRequest service-account path
    attack: T1552.007
    if:
      type: text
      regex: '/api/v1/namespaces/[^"'' \n]{1,120}/serviceaccounts/[^"'' \n]{1,120}/token\b'

  - id: selfsubjectrulesreview-path
    desc: Kubernetes SelfSubjectRulesReview API path
    attack: T1613
    if:
      type: text
      regex: '/apis/authorization\.k8s\.io/v1(self)?/selfsubjectrulesreviews\b'
