# These predicates require references, not credential access or abuse.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

composite_rules:
  - id: serviceaccount-token-api-references
    desc: Service-account token and API references
    crit: notable
    conf: 0.96
    all:
    - id: micro-behaviors/fs/path/token::serviceaccount-token-path
    any:
    - id: micro-behaviors/os/container/runtime::api-enumeration
    - id: micro-behaviors/os/container/exec::pod-exec
    unless:
    - id: metadata/build/recognized-contexts::benign-app-fp-context
    - id: well-known/app/system/replicated-kots::replicated-kots-binary
    - id: metadata/build/generated::legitimate-kubernetes-incluster-client-marker
    - id: well-known/app/infrastructure/podman-desktop::builtin-podman-extension-path
    - id: well-known/app/infrastructure/podman-desktop::podman-desktop-main-bundle
    - id: well-known/tool/offensive/cdk::container-toolkit-binary

  - id: serviceaccount-cloud-metadata-api-references
    for: [shell, python, javascript]
    desc: Pod token, IMDS and API references co-occur
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/token::serviceaccount-token-path
      - id: micro-behaviors/os/security/auth/cloud::aws-imds-credential-reference
    any:
      - id: micro-behaviors/os/container/runtime::in-cluster-default-api-host
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
    near_lines: 120
