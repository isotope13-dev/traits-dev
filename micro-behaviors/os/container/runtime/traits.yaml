# Container Detection - Generic
# Generic container detection paths
# NOTE: /proc/1/cgroup and /proc/self/cgroup moved to micro-behaviors/fs/proc/container/linux
defaults:
  platforms: [unix]
  for: [python, shell, javascript]
traits:
  - id: container-runtime-secrets-path
    desc: Container runtime secrets path
    crit: notable
    conf: 0.82
    for: [scripts, shell, binaries]
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_])/(var/)?run/secrets(/|$)'
  - id: docker-socket-path-scripts-binaries
    desc: Docker daemon Unix socket path reference
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: string_literal
      exact: /var/run/docker.sock
  - id: docker-socket-path-source
    desc: Docker daemon socket path in source
    crit: notable
    conf: 0.9
    for: [source]
    if:
      type: string_literal
      kind: string
      exact: /var/run/docker.sock
  - id: docker-socket-path-percent-encoded
    desc: Percent-encoded Docker daemon socket path
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: string_literal
      regex: '(?i)%2fvar%2frun%2fdocker\.sock'
  - id: containerenv
    desc: Container marker file reference
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /run/.containerenv

composite_rules:
  - id: docker-socket-path
    desc: Docker daemon Unix socket path reference in any supported file
    crit: notable
    conf: 0.9
    for: [scripts, source, binaries]
    any:
      - id: docker-socket-path-scripts-binaries
      - id: docker-socket-path-source
      - id: docker-socket-path-percent-encoded
