defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9
traits:
  - id: lvmcluster-manifest-kind
    desc: Kubernetes LVMCluster storage manifest kind
    if:
      type: text
      regex: '(?m)^[ \t]*kind:[ \t]+LVMCluster\b'
composite_rules:
  - id: lvm-storage-partition-reset-context
    desc: Small partition-prefix reset with LVMCluster provisioning
    crit: exception
    all:
      - id: lvmcluster-manifest-kind
      - id: micro-behaviors/fs/disk/partition::small-partition-prefix-reset
