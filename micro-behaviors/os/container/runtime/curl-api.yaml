defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: curl-variable-host-docker-list
    desc: curl lists containers on variable TCP host
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: curl
      arg:
        kind: string
        regex: '^http://\$\{?\w+\}?(\.\$\{?\w+\}?)?:2375/containers/json$'
