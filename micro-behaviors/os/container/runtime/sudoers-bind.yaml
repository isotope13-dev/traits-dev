defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: javascript-privileged-sudoers-bind
    desc: Privileged container mounts host sudoers
    # Bind and privilege belong to the same HostConfig object. Strings in
    # separate container specifications must not supply one another's legs.
    if:
      type: tree-sitter
      query: |
        (pair
          key: [(property_identifier) @config (string (string_fragment) @config)]
          value: [
            (object
              (pair key: [(property_identifier) @priv (string (string_fragment) @priv)]
                value: [(true) @enabled
                  (unary_expression operator: "!" argument: (number)) @enabled])
              (pair key: [(property_identifier) @binds (string (string_fragment) @binds)]
                value: (array (string (string_fragment) @mount))))
            (object
              (pair key: [(property_identifier) @binds (string (string_fragment) @binds)]
                value: (array (string (string_fragment) @mount)))
              (pair key: [(property_identifier) @priv (string (string_fragment) @priv)]
                value: [(true) @enabled
                  (unary_expression operator: "!" argument: (number)) @enabled]))]
          (#eq? @config "HostConfig") (#eq? @priv "Privileged")
          (#eq? @binds "Binds") (#match? @mount "^/etc/sudoers(\\.d)?:/[^:]+(:rw)?$")
          (#match? @enabled "^(true|!\\s*(0x)?0)$")) @match
