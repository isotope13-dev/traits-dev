defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: javascript-privileged-sudoers-bind
    desc: Privileged container mounts host sudoers
    # Bind and privilege belong to the same HostConfig object. Strings in
    # separate container specifications must not supply one another's legs.
    if:
      type: tree-sitter
      query: |
        (pair
          key: (_) @config
          value: [
            (object
              (pair key: (_) @priv
                value: (_) @enabled)
              (pair key: (_) @binds
                value: (array (string (string_fragment) @mount))))
            (object
              (pair key: (_) @binds
                value: (array (string (string_fragment) @mount)))
              (pair key: (_) @priv
                value: (_) @enabled))]
          (#eq? @config "HostConfig") (#eq? @priv "Privileged")
          (#eq? @binds "Binds") (#match? @mount "^/etc/sudoers(\\.d)?:/[^:]+(:rw)?$")
          (#match? @enabled "^(true|!\\s*(0x)?0)$")) @match
