defaults:
  for: [javascript]
  platforms: [macos, windows, linux]
  crit: notable
traits:
  - id: extension-sdk-container-run
    desc: Extension SDK starts a container
    if:
      type: symbol
      kind: call
      regex: '\.docker\.cli\.exec$'
      arg: {index: 0, exact: run}
  - id: javascript-root-bind-literal
    desc: JavaScript host root bind mount literal
    if:
      type: literal
      regex: '^/:/[^:\s]{1,120}(:rw)?$'
  - id: extension-sdk-host-exec
    desc: Extension SDK executes host program
    if:
      type: symbol
      kind: call
      regex: '\.extension\.host\.cli\.exec$'
composite_rules:
  - id: extension-sdk-root-bind
    desc: Extension SDK container launch near a host root bind
    crit: suspicious
    near_bytes: 256
    all:
      - id: extension-sdk-container-run
      - id: javascript-root-bind-literal
