defaults:
  for: [shell]
  platforms: [linux]
  crit: notable

traits:
  - id: docker-cli-host-pid-mode
    desc: Docker command shares host PID namespace
    attack: T1611
    if:
      type: text
      regex: '\bdocker\s+(run|create)\b[^;\n]{0,160}--pid[= \t]+["'']?host($|[\s"''])'
      exclude_comments: true

  - id: docker-cli-auto-restart
    desc: Docker command enables automatic restart
    if:
      type: text
      regex: '\bdocker +(run|create)\b[^;\n]{0,160}--restart[= ]+["'']?(always|unless-stopped)($|[\s"''])'
      exclude_comments: true
