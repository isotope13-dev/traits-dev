traits:
  - id: action-docker-container-sleep-loop
    desc: Starts detached container with sleep loop
    crit: notable
    conf: 0.95
    for: [github-actions]
    platforms: [unix]
    if:
      type: value
      path: runs.steps[*].run
      regex: >-
        (?m)^ *docker run -d ([^\n]*\\\n)* *bash -c 'while true; do sleep \d+; done'$
