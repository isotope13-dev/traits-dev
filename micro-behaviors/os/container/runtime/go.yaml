defaults:
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for:
    - go
traits:
  - id: k8s-api-package
    desc: Kubernetes API package import
    if:
      type: import
      regex: '^k8s\.io/(api|apimachinery)(/|$)'
  - id: k8s-core-package
    desc: Kubernetes core package import
    if:
      type: import
      regex: '^k8s\.io/(kubernetes|kubectl|kubelet)(/|$)'
  - id: k8s-client-go-package
    desc: Kubernetes client-go package import
    if:
      type: import
      regex: '^k8s\.io/client-go(/|$)'
composite_rules:
  - id: kubernetes-package-imports
    desc: Kubernetes package imports
    any:
      - id: k8s-api-package
      - id: k8s-core-package
      - id: k8s-client-go-package
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
