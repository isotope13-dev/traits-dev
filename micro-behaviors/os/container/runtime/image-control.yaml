defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: docker-cli-pull-image
    desc: Docker CLI retrieves a container image
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: docker
      arg:
        index: 0
        kind: identifier
        name: pull
  - id: docker-cli-list-running
    desc: Docker CLI lists running containers
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: docker
      arg:
        index: 0
        kind: identifier
        name: ps
