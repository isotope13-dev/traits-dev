defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: docker-image-latest-tag
    desc: Floating Docker image tag
    if:
      type: literal
      kind: string
      regex: '^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_./-]+:latest$'
  - id: docker-runner-call
    desc: Invokes Docker through a runner
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @runner)
          arguments: (arguments . (string (string_fragment) @program)))
          (#eq? @runner "runner")
          (#eq? @program "docker"))
  - id: docker-run-array-literal
    desc: Declares Docker run command argument
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((array . (string (string_fragment) @run))
          (#eq? @run "run"))
composite_rules:
  - id: latest-docker-image-and-runner
    desc: Latest Docker image with Docker runner
    # Dev tools start vendor images (e.g. n8nio/n8n:latest) this way.
    crit: notable
    scope: file
    all:
      - id: docker-image-latest-tag
      - id: docker-runner-call
      - id: docker-run-array-literal
