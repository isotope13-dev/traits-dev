defaults:
  for: [shell]
  platforms: [macos, windows, linux]
  crit: notable
traits:
  - id: model-runner-configure-route
    desc: Model Runner configuration API path
    if:
      type: text
      substr: /engines/_configure
      exclude_comments: true
  - id: model-runner-completion-route
    desc: Model Runner chat completion API path
    if:
      type: text
      substr: /engines/llama.cpp/v1/chat/completions
      exclude_comments: true
  - id: model-runner-log-file-flag
    desc: Runtime flags select log output file
    if:
      type: text
      regex: '"raw-runtime-flags"\s*:\s*"[^"\n]{0,160}--log-file[ =]+[^\s"]{1,240}'
      exclude_comments: true
