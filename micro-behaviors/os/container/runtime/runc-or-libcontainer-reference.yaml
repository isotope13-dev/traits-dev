# Neutral container term references; names do not prove runtime use.
defaults:
  platforms:
  - unix
  for: [shell, python, go, c, cpp, elf]
composite_rules:
- id: runc-or-libcontainer-reference
  desc: Runc or libcontainer name reference
  crit: notable
  conf: 0.9
  any:
  - id: well-known/app/infrastructure/runc::runc-oci-str
  - id: well-known/lib/platform/libcontainer::libcontainer-str
