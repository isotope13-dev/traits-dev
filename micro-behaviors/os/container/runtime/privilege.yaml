# Container privilege configuration markers. Standalone text does not establish
# that a container is launched or that the configured privilege is exercised.
defaults:
  platforms: [windows, unix]
traits:
- for:
  - scripts
  - binaries
  - python
  id: privileged-field-text
  desc: Text enabling a privileged field
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)\bprivileged["']?\s*:\s*(true|1)\b
  unless:
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
- for:
  - scripts
  - binaries
  - go
  id: privileged-option-text
  desc: Enabled privileged option text
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (^|[^A-Za-z0-9_-])--privileged(=true)?($|[\s"'`,;)\]}])
- for:
  - scripts
  - binaries
  - go
  id: docker-hostconfig-privileged-field
  desc: Privileged Docker HostConfig field
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '"HostConfig"\s*:\s*\{[^{}]{0,400}(\{[^{}]{0,99}\}[^{}]{0,99})?"Privileged"\s*:\s*[tT]rue\b'
