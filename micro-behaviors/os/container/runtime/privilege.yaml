# Double-quoted HostConfig privilege configuration, with an optional nested sibling.
traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - go
  id: docker-hostconfig-privileged-field
  desc: Privileged Docker HostConfig field
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '"HostConfig"\s*:\s*\{[^{}]{0,400}(\{[^{}]{0,99}\}[^{}]{0,99})?"Privileged"\s*:\s*[tT]rue\b'
