defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, go]
traits:
  - id: docker-api-privileged-field
    desc: Docker privileged API field
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '"Privileged"\s*:\s*(true|True)'
  - id: docker-cli-run-create
    desc: Docker CLI run or create command
    crit: component
    conf: 0.74
    if:
      type: text
      regex: '\bdocker\s+(run|create)\b'
  - id: docker-cli-exec
    desc: Docker exec verb
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bdocker\s+exec\b'
  - id: docker-privileged-flag
    desc: Docker privileged CLI flag
    crit: notable
    conf: 0.8
    if:
      type: text
      word: --privileged
  - id: dockerenv
    desc: Docker marker file reference
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      substr: /.dockerenv
  - id: docker-sock
    desc: Docker socket path
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      substr: /run/docker.sock
  - id: docker-var-run-sock
    desc: Docker socket path
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: /var/run/docker.sock
  - id: docker-api-port-2375
    desc: Docker unauthenticated API port
    crit: component
    conf: 0.78
    if:
      type: text
      regex: ':2375\b|\b2375/tcp\b'
  - id: docker-api-port-2376
    desc: Docker TLS API port
    crit: component
    conf: 0.72
    if:
      type: text
      regex: ':2376\b|\b2376/tcp\b'
  - id: docker-root-bind-host
    desc: Docker root filesystem bind mount
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/development/luma::archive-member
      # Docker's upstream integration suite deliberately tests a host-root
      # bind mount; this is a benign test harness context.
      - type: path
        dirname: true
        regex: '(^|[\\/])integration-cli([\\/]|$)'
    if:
      type: text
      # Require a shell command boundary and Docker run/create context; a
      # prose mention of the mount is not a container operation.
      regex: '(^|[;&|]\s*)docker\s+(run|create)\s+[^\n]{0,120}(-v\s+/:/host\b|target=/host\b)'
  # Argv-array spellings of the two atoms above. `docker-cli-run-create` and
  # `docker-root-bind-host` both require `docker` and `run` to be adjacent text,
  # which is true of a shell command line but not of the argv list that
  # subprocess.run / child_process.spawn / exec.Command take -- there the tokens
  # are separated by `","`. A Python escape written the recommended (shell-free)
  # way, `subprocess.run(["docker","run","-v","/:/host","--privileged",...])`,
  # therefore matched neither, and scored notable at best.
  #
  # The host-root mount spec is the discriminating half: over 108,671 text files
  # under /usr/bin, /usr/share, /etc, /usr/lib, /usr/sbin and /opt there are zero
  # occurrences of `/:/host`, while a bare argv `["docker","run"]` appears 3
  # times in benign material (vim's terminal docs, Go stdlib test helpers) -- so
  # the run/create half stays a component, exactly like its shell twin.
  - id: docker-argv-run-create
    desc: Docker run or create as argv list
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["'']docker["'']\s*,\s*["''](run|create)["'']'
  - id: docker-argv-root-bind-host
    desc: Docker argv list binds host root filesystem
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/development/luma::archive-member
      - type: path
        dirname: true
        regex: '(^|[\\/])integration-cli([\\/]|$)'
    if:
      type: text
      regex: '["'']docker["'']\s*,[^\n]{0,160}/:/host'
  - id: docker-daemon-cli-start
    desc: Docker daemon CLI start
    crit: notable
    conf: 0.86
    ref: sha256:08296de3be194910931847709d8b0909836ed01961bc98d638f8fa7ed43378a8
    if:
      type: text
      regex: '(?i)\bdocker\s+-d\b|exec\.Command\([^)\n]{0,120}["'']-d["'']'
  - id: docker-sdk-python
    desc: Docker daemon control via Python SDK
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: text
      regex: 'python_on_whales|docker\.from_env\('
  - id: docker-sdk-container-exec
    desc: Executes command inside container via SDK
    crit: notable
    conf: 0.82
    attack: T1609
    for: [python]
    if:
      type: text
      regex: '\bdocker\.execute\(|\.exec_run\('
  - id: docker-sdk-privileged
    desc: Docker SDK privileged container kwarg
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: text
      regex: 'privileged\s*=\s*True'
composite_rules:
  - id: docker-privileged-cli-run-create
    desc: Docker privileged run or create
    crit: component
    conf: 0.84
    near_bytes: 160
    all:
      - id: docker-privileged-flag
    any:
      - id: docker-cli-run-create
      - id: docker-argv-run-create
  - id: docker-privileged-exec
    desc: Docker privileged exec flag
    crit: notable
    conf: 0.82
    near_bytes: 160
    all:
      - id: docker-cli-exec
      - id: docker-privileged-flag
  - id: docker-remote-api-ports
    desc: Docker remote API ports
    crit: notable
    conf: 0.82
    any:
      - id: docker-api-port-2375
      - id: docker-api-port-2376
    needs: 2
  - id: docker-host-escape-spec
    desc: Docker privileged host mount
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/development/luma::archive-member
    all:
      - id: docker-privileged-spec
    # Either spelling of the host-root bind satisfies this leg; the argv form
    # carries the same intent and the same FP carve-outs as the shell form.
    any:
      - id: docker-root-bind-host
      - id: docker-argv-root-bind-host
  - id: docker-privileged-spec
    desc: Docker privileged container spec
    crit: suspicious
    conf: 0.86
    unless:
      - id: well-known/tool/development/luma::archive-member
    any:
      - id: docker-api-privileged-field
      - id: docker-privileged-cli-run-create
    downgrade:
      any:
        - id: well-known/tool/sysadmin/container/
