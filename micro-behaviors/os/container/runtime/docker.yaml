defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, go]
traits:
  - id: docker-host-env-marker
    for: [powershell]
    desc: Docker environment variable reference
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(?i)(DOCKER_HOST|DOCKER_CONTAINER)'
  - id: docker-cli-run-create
    desc: Docker CLI run or create command
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bdocker\s+(run|create)\b'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
  # Neutral capability record of a CLI host-root bind, including global
  # client flags (`docker -H unix:///var/run/docker.sock run`) and mounts
  # renamed away from /host. The suspicious docker-root-bind-host below
  # keeps its benign-context carve-outs; this notable fact stays visible in
  # workflow paths so objectives composites can add their own context.
  - id: docker-cli-host-root-volume-mount
    desc: Docker CLI mounts host root filesystem
    crit: notable
    conf: 0.94
    for: [scripts, source, github-actions]
    if:
      type: text
      # Require an actual / source; target=/host alone could mount any source.
      # Global flags, renamed destinations, and embedded command strings work.
      regex: '\bdocker\b[^\n;]{0,80}\b(run|create)\s+[^\n;]{0,80}(-v|--volume)[= ]/:/'
  - id: dockerenv
    desc: Docker marker file reference
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      substr: /.dockerenv
  - id: docker-inspect-env-format
    desc: docker inspect Config.Env format string
    crit: notable
    conf: 0.85
    for: [scripts, source]
    if:
      type: string_literal
      exact: "{{json .Config.Env}}"
  - id: docker-api-container-create-path
    desc: Docker Engine container-create API path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/containers/create\b'
  - id: docker-api-container-start-path
    desc: Docker Engine container-start API path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/containers/[^/\s]{1,160}/start\b'
  - id: docker-api-container-exec-path
    desc: Docker Engine container-exec API path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/containers/[^/\s]{1,160}/exec\b'
  - id: docker-api-exec-start-path
    desc: Docker Engine exec-start API path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '/exec/[^/\s"'']{1,160}/start\b'
  - id: docker-api-container-list-path
    desc: Docker Engine container-list API path
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: /containers/json
  - id: docker-api-container-inspect-path
    desc: Docker Engine container-inspect API path
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '/containers/.{1,80}/json'
  - id: docker-api-host-pid-mode
    # The matcher sees a HostConfig field, not who set it: the same JSON is a
    # `docker run` request body *and* an inspect response, so describing it as
    # a request was false wherever the string came from reported container
    # state -- Ansible's docker dynamic-inventory script embeds a full inspect
    # response in its docstring. Either direction is worth surfacing: a
    # container sharing the host PID namespace is a container-escape primitive.
    desc: Docker HostConfig PidMode set to host
    crit: notable
    conf: 0.9
    attack: T1611
    if:
      type: text
      regex: '"PidMode"\s*:\s*"host"'
  - id: docker-root-bind-host
    desc: Docker root filesystem bind mount
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/development/luma::archive-member
      # Docker's upstream integration suite deliberately tests a host-root
      # bind mount; this is a benign test harness context.
      - type: path
        dirname: true
        regex: '(^|[\\/])integration-cli([\\/]|$)'
      - id: metadata/build/ci/github-actions::workflow-definition-path
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/rancher::rancher-agent-cleanup-context
      - id: metadata/path::test-directory-component
    if:
      type: text
      # Require a shell command boundary and Docker run/create context; a
      # prose mention of the mount is not a container operation.
      regex: '(^|[;&|]\s*)docker\s+(run|create)\s+[^\n]{0,120}(-v\s+/:/host\b|target=/host\b)'
  # The REST-API spelling of the same host-root mount. `docker-root-bind-host`
  # requires a `docker run|create` command boundary and the argv variant below
  # requires a literal "docker" token, so neither sees a container created
  # through the daemon API -- the shape a worm uses against an exposed :2375, or
  # any code driving docker-py / dockerode rather than the CLI:
  #   {"HostConfig": {"Binds": ["/:/host"], "Privileged": true}}
  # That left docker-privileged-host-root-mount-spec with its privileged leg satisfied and no
  # bind leg to pair it with, so the escape scored notable-only.
  #
  # Anchored on the Binds array and an exact `/` source so an ordinary volume
  # list does not match: "/data:/data" and the docker.sock mount are both
  # rejected. The destination is intentionally variable because host-escape
  # payloads use /host, /mnt/host, /rootfs, and arbitrary renamed mountpoints.
  - id: docker-api-root-bind-host
    desc: Docker bind spec exposes host root filesystem
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/development/luma::archive-member
      # This exact API payload is a unit-test fixture for a honeypot's Docker
      # request recorder, not a container operation performed by the package.
      - id: metadata/package/testing/presence/harness/
      - type: path
        dirname: true
        regex: '(^|[\\/])integration-cli([\\/]|$)'
      - id: metadata/build/ci/github-actions::workflow-definition-path
      - id: metadata/path::test-directory-component
    if:
      type: text
      regex: '"Binds"\s*:\s*\[[^\]]{0,160}["'']/:/[A-Za-z0-9_./-]{1,120}'
  # Argv-array spellings of the two atoms above. `docker-cli-run-create` and
  # `docker-root-bind-host` both require `docker` and `run` to be adjacent text,
  # which is true of a shell command line but not of the argv list that
  # subprocess.run / child_process.spawn / exec.Command take -- there the tokens
  # are separated by `","`. A Python escape written the recommended (shell-free)
  # way, `subprocess.run(["docker","run","-v","/:/host","--privileged",...])`,
  # therefore matched neither, and scored notable at best.
  #
  # The host-root mount spec is the discriminating half: over 108,671 text files
  # under /usr/bin, /usr/share, /etc, /usr/lib, /usr/sbin and /opt there are zero
  # occurrences of `/:/host`, while a bare argv `["docker","run"]` appears 3
  # times in benign material (vim's terminal docs, Go stdlib test helpers) -- so
  # the run/create half stays a component, exactly like its shell twin.
  - id: docker-argv-run-create
    desc: Docker run or create as argv list
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '["'']docker["'']\s*,\s*["''](run|create)["'']'
  - id: docker-argv-root-bind-host
    desc: Docker argv list binds host root filesystem
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/development/luma::archive-member
      # The package's security regression suite uses this argv fixture to
      # verify that host-root mounts are rejected; it does not invoke Docker.
      - id: metadata/package/testing/presence/harness/
      - type: path
        dirname: true
        regex: '(^|[\\/])integration-cli([\\/]|$)'
      - id: metadata/build/ci/github-actions::workflow-definition-path
      - id: metadata/path::test-directory-component
    if:
      type: text
      regex: '["'']docker["'']\s*,[^\n]{0,160}/:/host'
  - id: docker-daemon-cli-start
    desc: Docker daemon CLI command text
    crit: notable
    conf: 0.86
    ref: sha256:08296de3be194910931847709d8b0909836ed01961bc98d638f8fa7ed43378a8
    if:
      type: text
      regex: '(?i)\bdocker\s+-d\b|exec\.Command\(["'']docker["'']\s*,\s*["'']-d["'']'
  - id: docker-sdk-python
    desc: Docker daemon control via Python SDK
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: text
      regex: 'python_on_whales|docker\.from_env\('
  - id: node-docker-cli-invocation
    desc: Node.js invokes the Docker CLI
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'execFile(Sync)?\s*\(\s*["'']docker["'']\s*,'
  - id: node-docker-event-stream
    desc: Docker Engine container event stream
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: docker.getEvents
  - id: node-docker-list-containers-call
    desc: Calls Docker listContainers method
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: docker.listContainers
  # Require the Docker receiver: collection names and UI labels can also
  # contain listContainers, without invoking any container API.
  - id: node-docker-list-containers-fragment
    desc: Docker computed listContainers member access
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bdocker\s*\[\s*["'']listContai(ners)?["'']'
  - id: docker-compose-delete-volumes
    desc: Docker Compose deletes attached volumes
    crit: notable
    conf: 0.97
    for: [shell, powershell]
    if:
      type: text
      regex: '\b(docker-compose|docker\b.{0,60}\bcompose)\s+down\b[^\n]{0,80}(-v\b|--volumes\b)'
  - id: docker-volume-delete-command
    desc: Docker CLI deletes a named volume
    crit: notable
    conf: 0.97
    for: [shell, powershell]
    if:
      type: text
      regex: '\bdocker\b.{0,60}\bvolume\s+rm\b'
  - id: docker-volume-prune-command
    desc: Docker CLI prunes persistent volumes
    crit: notable
    conf: 0.97
    for: [shell, powershell]
    if:
      type: text
      regex: '\bdocker\b.{0,60}\b(system\s+prune\b[^\n]{0,80}--volumes|volume\s+prune\b)'

  # The Docker daemon socket handed into a container as a volume. A path
  # reference to docker.sock (chmod, curl --unix-socket, a client library) is
  # the broader `docker-var-run-sock`; only a mount gives the container the host
  # daemon, which is root on the host.
  - id: docker-socket-volume-mount
    desc: Docker socket mounted into a container
    crit: notable
    conf: 0.9
    for: [shell, powershell, yaml]
    if:
      type: text
      regex: '(-v|--volume)[ =]+["'']?/(var/)?run/docker\.sock:|--mount[^\n]{0,80}docker\.sock'

composite_rules:
  - id: docker-container-state-watcher
    desc: Watches Docker container state events and listings
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: node-docker-event-stream
    any:
      - id: node-docker-list-containers-call
      - id: node-docker-list-containers-fragment

  - id: docker-api-via-libcurl-unix-socket
    for: [elf, pe]
    desc: Docker Unix-socket path with libcurl APIs
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/fs/path/socket::docker-var-run-sock
      - id: micro-behaviors/communications/http/download/curl::curl-easy-init
      - id: micro-behaviors/communications/http/download/curl::curl-easy-perform

  - id: docker-privileged-cli-run-create
    desc: Docker privileged run or create
    crit: notable
    conf: 0.88
    near_bytes: 160
    all:
      - id: micro-behaviors/os/container/runtime::privileged-option-text
    any:
      - id: docker-cli-run-create
      - id: docker-argv-run-create
  - id: docker-api-container-lifecycle
    desc: Docker API container lifecycle routes
    crit: notable
    conf: 0.94
    all:
      - id: docker-api-container-create-path
      - id: docker-api-container-start-path
    near_bytes: 4096
  - id: docker-privileged-host-root-mount-spec
    desc: Docker privileged host mount
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/development/luma::archive-member
      - id: well-known/tool/sysadmin/rancher::rancher-agent-cleanup-context
    all:
      - id: docker-privileged-spec
    # Either spelling of the host-root bind satisfies this leg; the argv form
    # carries the same intent and the same FP carve-outs as the shell form.
    any:
      - id: docker-root-bind-host
      - id: docker-argv-root-bind-host
      - id: docker-api-root-bind-host
  - id: docker-privileged-spec
    desc: Docker privileged container spec
    crit: notable
    conf: 0.86
    unless:
      - id: metadata/path::test-directory-component
      - id: well-known/tool/development/luma::archive-member
    any:
      - id: docker-hostconfig-privileged-field
      - id: docker-privileged-cli-run-create
    downgrade:
      any:
        - id: well-known/tool/sysadmin/container/
