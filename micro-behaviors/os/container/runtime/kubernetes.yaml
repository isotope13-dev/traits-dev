defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: service-env
    desc: Kubernetes service environment variable
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      substr: KUBERNETES_SERVICE
  - id: api-namespaces-path
    desc: Kubernetes namespaced core resource API path
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: /api/v1/namespaces/[a-z0-9][-a-z0-9]{0,61}/(pods|secrets|services|configmaps)
  - id: in-cluster-default-api-host
    desc: Kubernetes in-cluster API host
    crit: notable
    conf: 0.86
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    if:
      type: text
      substr: https://kubernetes.default.svc
  - id: server-side-apply-patch
    desc: Kubernetes server-side apply patch
    crit: notable
    conf: 0.86
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    if:
      type: text
      substr: application/apply-patch+yaml
  - id: force-field-manager
    desc: Kubernetes forced field manager
    crit: notable
    conf: 0.78
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    if:
      type: text
      regex: 'fieldManager.{0,80}force.{0,20}(true|True)'
  - id: api-pods-path
    desc: Kubernetes pods API path
    crit: notable
    conf: 0.8
    for: [scripts, binaries, python]
    if:
      type: text
      regex: /api/v1/namespaces/[^"' \n]{1,120}/pods(\b|/)
  - id: api-statefulsets-path
    desc: Kubernetes StatefulSets API path
    crit: notable
    conf: 0.82
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    if:
      type: text
      regex: /apis/apps/v1/namespaces/[^"' \n]{1,120}/statefulsets(\b|/)
  - id: api-cronjobs-path
    desc: Kubernetes CronJobs API path
    crit: notable
    conf: 0.84
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    if:
      type: text
      regex: /apis/batch/v1/namespaces/[^"' \n]{1,120}/cronjobs(\b|/)
  - id: api-hpa-path
    desc: Kubernetes autoscaler API path
    crit: notable
    conf: 0.8
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    if:
      type: text
      regex: /apis/autoscaling/v2/namespaces/[^"' \n]{1,120}/horizontalpodautoscalers(\b|/)
  - id: api-nodes-path
    desc: Path resembles Kubernetes nodes API
    crit: notable
    conf: 0.78
    for: [scripts, binaries, python]
    if:
      type: text
      regex: /api/v1/nodes(\b|/)
    unless:
      # Compatibility endpoints commonly reuse this path shape without
      # talking to the Kubernetes API.
      - type: text
        substr: /api/v1/nodes/compat
  # These are Kubernetes target references, not Azure or HTTP operations.
  # Azure VM Run Command objectives compose this neutral context with the
  # Azure API operation rather than attributing Azure to this matcher.
  - id: kubernetes-near-node-target
    desc: Kubernetes marker near node target
    crit: notable
    conf: 0.86
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(aks|kubernetes|kubelet)\b[^\r\n]{0,120}\b(node|vm|instance|host)\b'
  - id: node-target-near-kubernetes
    desc: Node target near Kubernetes marker
    crit: notable
    conf: 0.86
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(node|vm|instance|host)\b[^\r\n]{0,30}\b(aks|kubernetes|kubelet)\b'
  - id: kubernetes-node-target-event
    desc: Kubernetes node target event field
    crit: notable
    conf: 0.9
    for: [json]
    if:
      type: text
      regex: '(?i)"(resource|target|vmName)"\s*:\s*".{0,120}(aks|kubernetes|kubelet).{0,120}"'
  - id: api-secrets-path
    desc: Kubernetes secrets API path
    crit: notable
    conf: 0.82
    for: [scripts, binaries, python]
    if:
      type: text
      regex: /api/v1/namespaces/[^"' \n]{1,120}/secrets(\b|/)
  - id: api-configmaps-path
    desc: Kubernetes ConfigMaps API path
    crit: notable
    conf: 0.82
    for: [scripts, binaries, python]
    if:
      type: text
      regex: /api/v1/namespaces/[^"' \n]{1,120}/configmaps(\b|/)
  - id: kube-system-namespace
    desc: Kubernetes kube-system namespace reference
    crit: notable
    conf: 0.75
    for: [scripts, binaries, python]
    if:
      type: text
      substr: kube-system
  - id: hostpath-volume-spec
    desc: Kubernetes hostPath volume spec
    crit: notable
    conf: 0.86
    for: [scripts, binaries, python]
    if:
      type: text
      # Azure DevOps metadata also uses a hostPath key.  A Kubernetes
      # hostPath volume has the surrounding volumes collection and a mount
      # path; require that structural combination.
      # Manifests normally put each field on its own line; dotall keeps the
      # structural relationship when embedded in source strings or YAML.
      regex: '(?is)volumes.{0,500}hostPath.{0,160}path["'']?\s*[:=]'
  - id: daemonset-workload-spec
    desc: Kubernetes DaemonSet workload manifest
    crit: notable
    conf: 0.9
    for: [scripts, binaries, python]
    if:
      type: text
      regex: '(?i)\bkind["'']?\s*:\s*["'']?DaemonSet\b'
  - id: serviceaccount-token-automount-disabled
    desc: Disables service-account token automount
    crit: notable
    conf: 0.9
    for: [scripts, binaries, python]
    if:
      type: text
      # Hardening marker: the pod declines the projected cluster credential.
      # Attackers staging a token pivot want the token, not this field.
      regex: '(?i)\bautomountServiceAccountToken["'']?\s*:\s*false\b'
  - id: ephemeral-check-pod-teardown
    desc: Deletes a Kubernetes pod tolerating absence
    crit: notable
    conf: 0.88
    for: [shell]
    if:
      type: text
      # Transient check-pod lifecycle: remove the pod when done, tolerating
      # an already-gone pod. Durable attacker infrastructure keeps its pods.
      regex: '(?is)\bkubectl\s+delete\s+pods?\b.{0,200}?--ignore-not-found'
  - id: host-root-hostpath-volume
    desc: Kubernetes hostPath exposes host root
    crit: notable
    conf: 0.95
    for: [scripts, binaries, python]
    if:
      type: text
      # Match an exact root path value, not ordinary subdirectory mounts.
      regex: '(?is)\bhostPath["'']?\s*:\s*(\{|\n).{0,160}\bpath["'']?\s*:\s*["'']?/["'']?(\s|,|\})'
    unless:
      - id: metadata/package/testing/corpus/
      - id: well-known/tool/sysadmin/kubernetes/minikube
      - id: well-known/app/system/aks-engine/
  - id: clusterrole-binding-manifest
    desc: Kubernetes ClusterRoleBinding kind field
    crit: notable
    conf: 0.82
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    if:
      type: text
      # API client assemblies contain ClusterRoleBinding type and method names.
      # Require the manifest's kind key/value instead of those code symbols.
      regex: '(?i)["'']?kind["'']?\s*:\s*["'']?ClusterRoleBinding\b'
  - id: custom-resource-definition-manifest
    desc: Kubernetes CRD manifest
    crit: notable
    conf: 0.8
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    if:
      type: text
      substr: CustomResourceDefinition
  - id: python-kubectl-get-secret
    desc: Python kubectl get-Secret operation
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)kubectl.{0,80}\bget\b.{0,50}\bsecrets?\b'
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/llm-scanner::mvar-security-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: python-cli-structured-output-option
    desc: Python CLI structured-output option
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(-o|--output[= ]).{0,20}(json|yaml|jsonpath|go-template)'
composite_rules:
  - id: python-kubectl-structured-secret-read
    desc: Python gets a Kubernetes Secret as structured data
    crit: notable
    conf: 0.96
    for: [python]
    all:
      - id: python-kubectl-get-secret
      - id: python-cli-structured-output-option
    near_lines: 6
  - id: kubernetes-secret-configmap-api
    desc: References Kubernetes Secret and ConfigMap API paths
    crit: notable
    conf: 0.9
    for: [scripts, binaries, python]
    any:
      - id: api-secrets-path
      - id: api-configmaps-path
    needs: 2
  - id: kubernetes-node-target-context
    desc: References a Kubernetes node target
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source, json]
    any:
      - id: kubernetes-near-node-target
      - id: node-target-near-kubernetes
      - id: kubernetes-node-target-event
  - id: api-enumeration
    desc: Kubernetes API enumeration paths
    crit: notable
    conf: 0.9
    any:
      - id: api-pods-path
      - id: api-secrets-path
      - id: api-nodes-path
    needs: 2
  - id: ephemeral-hardened-check-pod-context
    desc: Hardened ephemeral check pod with teardown
    crit: exception
    conf: 0.97
    for: [shell]
    # Defensive cluster-audit harness: it declines the projected service-
    # account credential and tears the check pod down when done. That
    # combination contradicts the token-pivot and persistence goals of a
    # real privileged-pod escape, so it suppresses the escape verdict
    # while leaving the underlying hostPath capability visible.
    all:
      - id: serviceaccount-token-automount-disabled
      - id: ephemeral-check-pod-teardown
  - id: privileged-hostpath-pod
    desc: Kubernetes privileged hostPath pod
    crit: suspicious
    conf: 0.95
    for:
    - scripts
    - binaries
    - python
    all:
    - id: micro-behaviors/os/container/runtime::privileged-field-text
    - id: hostpath-volume-spec
    - id: api-pods-path
    any:
    - id: kube-system-namespace
    - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
    unless:
    - id: well-known/app/infrastructure/kube-ovn::source-tree
    - id: well-known/tool/sysadmin/kubernetes/minikube
    - id: well-known/app/system/aks-engine/
    - id: metadata/lang/compiler/systems::go-binary
    - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-bootstrap-context
    - id: metadata/file/profile/markup::assessment-playbook-examples
  - id: workload-write-api
    desc: Kubernetes workload write APIs
    crit: notable
    conf: 0.9
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    any:
      - id: api-statefulsets-path
      - id: api-cronjobs-path
      - id: api-hpa-path
    needs: 2
  - id: incluster-apply-client
    desc: Kubernetes in-cluster apply client
    crit: suspicious
    conf: 0.93
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    all:
      - id: micro-behaviors/fs/path/credential::kubernetes-secret-directory-text
      - id: metadata/file/string/file::token-read-text-reference
      - id: in-cluster-default-api-host
      - id: server-side-apply-patch
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
    any:
      - id: force-field-manager
      - id: workload-write-api
  - id: operator-rbac-bundle
    desc: Kubernetes operator RBAC bundle
    crit: notable
    conf: 0.9
    ref: sha256:4eb19d990c31e47db5e857d5943f24c203dbb243277a1ccce761d8d657c33647
    all:
      - id: custom-resource-definition-manifest
      - id: clusterrole-binding-manifest
    any:
      - id: workload-write-api
      - id: api-cronjobs-path
