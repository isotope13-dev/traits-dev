defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, go]
  attack: T1609

traits:
  - id: docker-cli-exec
    desc: Docker CLI executes in container
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bdocker\s+exec\b'

  # Quoted argv is structurally different from a shell command line and is
  # the safe form emitted by subprocess and process-spawn APIs.
  - id: docker-argv-exec
    desc: Docker exec in argv array
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']docker["'']\s*,\s*["'']exec["'']'

  - id: docker-sdk-container-exec
    desc: Docker SDK executes in container
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bdocker\.execute\(|\.exec_run\('

composite_rules:
  - id: docker-privileged-exec
    desc: Docker privileged exec operation
    crit: notable
    conf: 0.9
    near_bytes: 160
    all:
      - id: micro-behaviors/os/container/runtime::docker-privileged-flag
    any:
      - id: docker-cli-exec
      - id: docker-argv-exec
