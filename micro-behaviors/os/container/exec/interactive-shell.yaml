# Interactive command execution in an already-running container. CLI and argv
# spellings are separate atoms; TTY allocation and shell selection are joined
# with proximity so unrelated flags or shell names cannot create the finding.
defaults:
  platforms: [windows, unix]
  for: [scripts]
  attack: T1609

traits:
  - id: kubernetes-cli-exec
    desc: Kubernetes CLI executes in pod
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|[;&|][ \t]*)(kubectl|oc)\b[^\r\n;&|]{0,160}\bexec\b'

  - id: kubernetes-argv-exec
    desc: Kubernetes exec in argv array
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["''](kubectl|oc)["'']\s*,(?s:.{0,240})["'']exec["'']\s*,'

  - id: oci-cli-exec
    desc: OCI CLI executes in container
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|[;&|][ \t]*)(podman|nerdctl)\b[^\r\n;&|]{0,160}\bexec\b'

  - id: oci-argv-exec
    desc: OCI exec in argv array
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["''](podman|nerdctl)["'']\s*,(?s:.{0,240})["'']exec["'']\s*,'

  # Option shapes include the exec verb so a nearby, unrelated list of CLI
  # flags cannot satisfy the TTY leg. Separate bounded forms avoid a broad
  # wildcard and cover the combined flag plus both two-flag orders.
  - id: cli-exec-combined-tty-option
    desc: Exec uses combined interactive TTY option
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bexec[ \t]+-(it|ti)\b'

  - id: cli-exec-interactive-then-tty
    desc: Exec uses interactive then TTY options
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bexec[ \t]+(-i|--interactive)[ \t]+(-t|--tty)\b'

  - id: cli-exec-tty-then-interactive
    desc: Exec uses TTY then interactive options
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bexec[ \t]+(-t|--tty)[ \t]+(-i|--interactive)\b'

  - id: argv-exec-combined-tty-option
    desc: Exec argv uses combined interactive TTY option
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '["'']exec["'']\s*,\s*["'']-(it|ti)["'']'

  - id: argv-exec-interactive-then-tty
    desc: Exec argv uses interactive then TTY options
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '["'']exec["'']\s*,\s*["''](-i|--interactive)["'']\s*,\s*["''](-t|--tty)["'']'

  - id: argv-exec-tty-then-interactive
    desc: Exec argv uses TTY then interactive options
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '["'']exec["'']\s*,\s*["''](-t|--tty)["'']\s*,\s*["''](-i|--interactive)["'']'

composite_rules:
  - id: cli-container-exec
    desc: Container CLI exec operation
    crit: notable
    conf: 0.94
    any:
      - id: kubernetes-cli-exec
      - id: oci-cli-exec
      - id: docker-cli-exec

  - id: argv-container-exec
    desc: Container argv exec operation
    crit: notable
    conf: 0.95
    any:
      - id: kubernetes-argv-exec
      - id: oci-argv-exec
      - id: docker-argv-exec

  - id: cli-attached-tty-option
    desc: CLI exec interactive TTY option shape
    crit: component
    conf: 0.94
    any:
      - id: cli-exec-combined-tty-option
      - id: cli-exec-interactive-then-tty
      - id: cli-exec-tty-then-interactive

  - id: argv-attached-tty-option
    desc: Argv exec interactive TTY option shape
    crit: component
    conf: 0.95
    any:
      - id: argv-exec-combined-tty-option
      - id: argv-exec-interactive-then-tty
      - id: argv-exec-tty-then-interactive

  - id: cli-exec-attached-tty
    desc: Container CLI exec requests attached TTY
    crit: notable
    conf: 0.96
    near_lines: 0
    all:
      - id: cli-container-exec
      - id: cli-attached-tty-option

  - id: argv-exec-attached-tty
    desc: Container argv exec requests attached TTY
    crit: notable
    conf: 0.96
    near_lines: 8
    all:
      - id: argv-container-exec
      - id: argv-attached-tty-option

  - id: cli-exec-shell-target
    desc: Container CLI exec targets shell
    crit: notable
    conf: 0.96
    # Pair near_bytes with near_lines: a source map or minified bundle is one
    # line, so a same-line window is the whole file and a comment `docker exec`
    # coinciding with an unrelated shell token would match. 256 bytes covers a
    # real `… exec … /bin/sh` argv and is layout-independent.
    near_lines: 0
    near_bytes: 256
    all:
      - id: cli-container-exec
    any:
      - id: metadata/file/string/identity::cli-posix-shell-common-token
      - id: metadata/file/string/identity::cli-posix-shell-alternate-token
      - id: metadata/file/string/identity::cli-windows-shell-token

  - id: argv-exec-shell-target
    desc: Container argv exec targets shell
    crit: notable
    conf: 0.96
    # Same minified/source-map failure mode as cli-exec-shell-target: an 8-line
    # window is the whole artifact when the file is one or two lines.
    near_lines: 8
    near_bytes: 512
    all:
      - id: argv-container-exec
    any:
      - id: metadata/file/string/identity::argv-posix-shell-common-token
      - id: metadata/file/string/identity::argv-posix-shell-alternate-token
      - id: metadata/file/string/identity::argv-windows-shell-token

  - id: cli-interactive-container-shell
    desc: CLI opens interactive container shell
    crit: notable
    conf: 0.98
    attack: "T1609,T1059"
    near_lines: 0
    all:
      - id: cli-exec-attached-tty
      - id: cli-exec-shell-target

  - id: argv-interactive-container-shell
    desc: Argv opens interactive container shell
    crit: notable
    conf: 0.98
    attack: "T1609,T1059"
    near_lines: 8
    all:
      - id: argv-exec-attached-tty
      - id: argv-exec-shell-target
