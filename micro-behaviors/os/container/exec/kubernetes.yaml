defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1609

traits:
  - id: api-pod-exec-path
    desc: Kubernetes pod exec API path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: /api/v1/namespaces/[^"' \n]{1,120}/pods/[^"' \n]{1,120}/exec\b

composite_rules:
  - id: pod-exec
    desc: Kubernetes pod exec API usage
    crit: notable
    conf: 0.94
    all:
      - id: api-pod-exec-path
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
