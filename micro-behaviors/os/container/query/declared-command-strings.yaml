traits:
- id: kubectl-get-secret-command-string
  desc: String contains kubectl get secrets command
  crit: notable
  conf: 0.95
  platforms:
  - unix
  for:
  - scripts
  - source
  - -shell
  - -batch
  if:
    type: literal
    kind: string
    regex: (^|[;&|]\s*)kubectl\s+get\s+secrets?\b
    exclude_docstrings: true
