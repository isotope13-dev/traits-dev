traits:
  - id: kubectl-configmap-token-filter
    desc: Filters a ConfigMap for a token field
    crit: notable
    conf: 0.95
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: '\bkubectl[ \t]+get[ \t]+(cm|configmaps?)\b[^|\n]{1,140}\|\s*grep[ \t]+["''][\w-]*token:'
