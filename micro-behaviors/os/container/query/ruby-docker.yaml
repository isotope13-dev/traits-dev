# Ruby's current symbol facts expose these calls as bare get/all names.
# Restrict the parsed call itself to its Docker SDK receiver instead.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.96

traits:
  - id: ruby-docker-container-lookup
    desc: Looks up Docker containers through Ruby SDK
    if:
      type: tree-sitter
      kind: call
      regex: '^(::)?Docker::Container\.(get|all|exist\?)(\s|\(|$)'
