defaults:
  # C-style `system("kubectl…"` call sites: every script/source language and
  # compiled string tables apply, but the chat-script dialects (mirc/ircii)
  # and Clojure have no such calling convention, so they are excluded to
  # stay within the text-matcher file-type cap.
  for: [scripts, source, binaries, -mirc, -ircii, -clojure]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: system-call-kubectl-parenthesized-text
    desc: System call text names kubectl
    conf: 0.96
    if:
      type: text
      regex: '\bsystem\s*\(\s*["\x27]kubectl([ \t]|["\x27])'
