defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.96

traits:
  - id: ruby-docker-image-build
    desc: Builds a Docker image through Ruby SDK
    if:
      type: tree-sitter
      kind: call
      regex: '^(::)?Docker::Image\.build(\s|\(|$)'
  - id: ruby-docker-image-create
    desc: Calls Ruby Docker image creation API
    if:
      type: tree-sitter
      kind: call
      regex: '^(::)?Docker::Image\.create(\s|\(|$)'
