defaults:
  platforms: [windows, unix]
  for: [php]
composite_rules:
  - id: php-dynamic-call-near-error-suppression
    desc: PHP variable call beside error suppression
    crit: suspicious
    conf: 0.85
    near_lines: 4
    all:
      - id: micro-behaviors/data/control-flow/dispatch::php-variable-function-call
      - id: micro-behaviors/os/stdio::error-suppress-prefix
    unless:
      - id: well-known/tool/packaging/composer/
      - id: well-known/lib/development/phpstan/
