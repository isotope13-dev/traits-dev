defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: virtualpc-backdoor-instruction-probe
    desc: Virtual PC instruction and exception recovery
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: any
      # EAX=1; Virtual PC's four-byte escape; normal and SEH paths
      # return different booleans. Frame offsets and branch distances vary.
      pattern: 'B8 01 00 00 00 0F 3F 07 0B C7 45 ?? FF FF FF FF [0-8] EB ?? B8 01 00 00 00 C3 8B 65 ?? C6 45 ?? 00'
