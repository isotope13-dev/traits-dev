defaults:
  platforms: [windows, unix]
  for: [pe, elf]
  arch: [x86, x86-64]
traits:
  - id: vmware-version-port-query
    desc: Queries VMware version through port 0x5658
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: B8 68 58 4D 56 [0-16] B9 0A 00 00 00 [0-16] BA 58 56 00 00 [0-16] ED
