defaults:
  platforms: [windows, unix]
  for: [pe, elf]
  arch: [x86, x86-64]
traits:
  - id: vmware-version-port-query
    desc: Queries VMware version through port 0x5658
    crit: suspicious
    conf: 0.99
    # The Linux kernel's own VMware hypercall tries this port after
    # vmcall/vmmcall. A vmlinux compression fixture is that probe, not
    # a sample hiding from analysis.
    unless:
      - id: metadata/lang/compiled::linux-kernel-banner
    if:
      type: hex
      # Unpacked images can retain packer section names. The complete magic,
      # version command, port and IN instruction identify the query regardless
      # of that label; loading DX is equivalent to loading EDX for port I/O.
      section: any
      pattern: B8 68 58 4D 56 [0-16] B9 0A 00 00 00 [0-16] (BA 58 56 00 00|66 BA 58 56) [0-16] ED
