defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: vm-mac-prefix-check
    desc: Checks MAC prefixes for virtual machines
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''`](00:0[cC]29|08:00:27|52:54:00|00:16:3[eE])(["''`]|$)'
    unless:
      - id: well-known/app/ai/coding-agent/baidu-comate::baidu-comate
      - id: metadata/document/html/
