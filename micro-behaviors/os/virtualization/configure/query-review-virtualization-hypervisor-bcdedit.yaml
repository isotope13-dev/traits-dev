defaults:
  crit: notable
  for:
  - pe
  - dll
  - powershell
  - batch
  platforms:
  - windows

traits:
  - id: bcdedit-disable-hypervisor-command
    desc: Command text disables hypervisor boot launch
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\s+/set\s+hypervisorlaunchtype\s+off\b'
  - id: batch-bcdedit-deletevalue
    desc: Batch bcdedit deletevalue
    crit: notable
    conf: 0.93
    for: [batch]
    unless:
      - id: metadata/lang/natural/phrasing/system::windows-safe-mode-toggle-title
    if:
      type: text
      substr: bcdedit /deletevalue
