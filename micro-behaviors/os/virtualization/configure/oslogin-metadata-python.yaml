defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96
traits:
  - id: python-oslogin-false-metadata-call
    desc: SetMetadata call specifies enable-oslogin false
    if:
      type: tree-sitter
      language: python
      query: |
        ((call function: (attribute attribute: (identifier) @method)
          arguments: (argument_list . (string (string_content) @key)
                                    . (false)))
          (#eq? @method "SetMetadata")
          (#eq? @key "enable-oslogin"))
