defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: terraform-state-mutation-command
    desc: Terraform command mutates saved state
    if:
      type: text
      regex: '(?i)\bterraform\b[^\n]{0,100}\b(state\s+(rm|mv)|taint|force-unlock)\b'

  - id: gcs-public-read-grant-command
    desc: GCS bucket grants public object access
    if:
      type: text
      regex: '(?i)\bgsutil\s+iam\s+ch\s+allUsers:objectViewer\b'

  - id: aws-public-access-block-disabled
    desc: AWS S3 public access block disabled
    if:
      type: text
      regex: '(?i)\bput-public-access-block\b[^\n]{0,160}BlockPublicAcls=false\b'
