# Proxmox VE hypervisor REST API and VNC WebSocket console endpoints.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe, text]
  crit: notable

traits:
  - id: proxmox-vncwebsocket-endpoint
    desc: Proxmox VE VNC WebSocket console endpoint
    conf: 0.98
    if:
      type: text
      regex: '/api2/json/nodes/[^/\s"''`]{1,64}/((qemu|lxc)/\d+/)?vncwebsocket\b'

  - id: proxmox-access-ticket-endpoint
    desc: Proxmox VE authentication ticket endpoint
    conf: 0.97
    if:
      type: text
      substr: /api2/json/access/ticket
