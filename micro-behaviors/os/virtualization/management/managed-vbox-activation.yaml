defaults:
  for: [csharp]
  platforms: [windows]
  crit: notable
traits:
  - id: virtualbox-client-class-literal
    desc: References VirtualBox client COM class
    if:
      type: literal
      exact: VirtualBoxClient Class
  - id: virtualbox-vm-host-literal
    desc: References VirtualBox VM host executable
    if:
      type: literal
      regex: '^(VBoxHeadless|VirtualBoxVM)\.exe$'
  - id: managed-startvm-argument
    desc: Configures a VM startup argument
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ProcessStartInfo$'
      arg: {index: 1, regex: '^--startvm\s'}
