# ESXi host-side VM lifecycle control through vim-cmd. Powering a VM off is
# routine administration (snapshot revert, maintenance, CI-fleet recovery);
# ransomware composites in objectives/impact/ransom/ pair it with encryption.
defaults:
  platforms: [unix]
  for: [shell, python, c, cpp, go, elf]
  crit: notable

traits:
  - id: vmsvc-power-off
    desc: ESXi vim-cmd powers off a virtual machine
    conf: 0.9
    if:
      type: text
      substr: vmsvc/power.off
