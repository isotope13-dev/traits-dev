defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: gcloud-compute-instance-stop
    desc: Shell gcloud instance-stop command
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @program
          . argument: (word) @compute . argument: (word) @instances
          . argument: (word) @action)
          (#match? @program "(^|/)gcloud$")
          (#eq? @compute "compute")
          (#eq? @instances "instances")
          (#eq? @action "stop"))
  - id: gcloud-compute-instance-detach-disk
    desc: Shell gcloud instance disk-detach command
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @program
          . argument: (word) @compute . argument: (word) @instances
          . argument: (word) @action)
          (#match? @program "(^|/)gcloud$")
          (#eq? @compute "compute")
          (#eq? @instances "instances")
          (#eq? @action "detach-disk"))
  - id: gcloud-compute-instance-attach-disk
    desc: Shell gcloud instance disk-attach command
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @program
          . argument: (word) @compute . argument: (word) @instances
          . argument: (word) @action)
          (#match? @program "(^|/)gcloud$")
          (#eq? @compute "compute")
          (#eq? @instances "instances")
          (#eq? @action "attach-disk"))
  - id: gcloud-compute-instance-delete
    desc: Shell gcloud instance-delete command
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @program
          . argument: (word) @compute . argument: (word) @instances
          . argument: (word) @action)
          (#match? @program "(^|/)gcloud$")
          (#eq? @compute "compute")
          (#eq? @instances "instances")
          (#eq? @action "delete"))
  - id: gcloud-windows-startup-script-file
    desc: gcloud VM creation supplies Windows startup file
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @program
          . argument: (word) @compute . argument: (word) @instances
          . argument: (word) @action argument: (_) @metadata)
          (#match? @program "(^|/)gcloud$")
          (#eq? @compute "compute")
          (#eq? @instances "instances")
          (#eq? @action "create")
          (#match? @metadata "^--metadata-from-file=windows-startup-script-ps1="))
