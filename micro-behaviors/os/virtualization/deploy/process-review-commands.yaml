defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: terraform-auto-approved-change
    desc: Terraform change bypasses confirmation
    if:
      type: text
      regex: '(?i)\b(terraform|tofu)\b[^\n]{0,120}\b(apply|destroy)\b[^\n]{0,120}-auto-approve\b'

  - id: vercel-production-deploy-command
    desc: Vercel production deployment command
    if:
      type: text
      regex: '(?i)\bvercel\s+--prod\b'

  - id: netlify-production-deploy-command
    desc: Netlify production deployment command
    if:
      type: text
      regex: '(?i)\bnetlify\s+deploy\b[^\n]{0,100}--prod\b'

  - id: serverless-production-deploy-command
    desc: Serverless production deployment command
    if:
      type: text
      regex: '(?i)\bserverless\s+deploy\b[^\n]{0,100}--stage\s+prod\b'

  - id: fly-deploy-command
    desc: Fly application deployment command
    if:
      type: text
      regex: '(?i)\bfly\s+deploy\b'

