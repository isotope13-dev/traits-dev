defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: vbox-token
  desc: Uppercase VBOX vendor token
  crit: notable
  conf: 0.5
  if:
    type: text
    word: VBOX
  unless:
  - id: metadata/signed/unknown::intel-corporation
  - id: metadata/package/compat::virtualbox-platform-component
  - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-viewer-bundle
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-asset-path
  - id: well-known/lib/ui/highlight-js::bundled-library
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
