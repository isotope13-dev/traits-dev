# A QEMU name alone establishes neither a probe nor artifact identity.
traits:
- id: qemu-name-reference
  desc: QEMU virtualization name reference
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: QEMU
  unless:
  - id: metadata/signed/unknown::intel-corporation
  - id: metadata/package/compat::virtualbox-platform-component
  - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
