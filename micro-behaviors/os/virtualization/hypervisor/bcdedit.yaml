# A boot setting operation; user-authorized tuning also uses this command.
defaults:
  crit: notable
  for: [pe, dll, powershell, batch]
  platforms: [windows]
traits:
  - id: bcdedit-disable-hypervisor-command
    desc: Command text disables hypervisor boot launch
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\s+/set\s+hypervisorlaunchtype\s+off\b'
