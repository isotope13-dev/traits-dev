# JavaScript/TypeScript sibling of qemu-vendor-word, relocated from
# objectives/anti-analysis/vm-detect/dmi/. As `node-vm-vendor-strings--kvm`
# ("Node VM vendor string set (KVM)") a bare mention of the word reported
# anti-analysis VM detection -- so tooling that manages KVM guests through
# libvirt/virsh surfaced as VM-aware. The detection intent stays in the
# composite that requires two different vendors.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: kvm-vendor-word
    desc: References the KVM hypervisor name
    crit: notable
    conf: 0.75
    if:
      type: text
      word: KVM
    unless:
      - id: well-known/lib/network/novnc::source-context
      - id: metadata/document/html/
      # Hypervisor names are ordinary prose in Unix manual pages (bhyve_config(5)
      # documents its QEMU-compatible knobs); documentation is not a DMI probe.
      - id: metadata/package/documentation/manpage::unix-manpage
