defaults:
  for: [scripts, binaries]
traits:
- platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.9
  size_max: 600000000
  id: virtualbox-product-name-reference
  desc: References the VirtualBox product name
  if:
    type: text
    regex: (^|[^a-z0-9-])virtualbox\b
    case_insensitive: true

# The product name outside known grammar, test-viewer and scanner bundles.
# A mention is not VirtualBox identity: malware VM checks carry the same word,
# so this lives here rather than under well-known/app (where directory-level
# `unless:` exclusions would let a VM-check string veto a conviction).
composite_rules:
- id: virtualbox-product-name-mention
  desc: Mentions VirtualBox outside grammar or scanner data
  platforms: [unix, windows]
  crit: notable
  conf: 0.6
  any:
  - id: virtualbox-product-name-reference
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-viewer-bundle
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-asset-path
  - id: well-known/app/infrastructure/virtualbox::gentoo-recipe-virtualbox-context
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
