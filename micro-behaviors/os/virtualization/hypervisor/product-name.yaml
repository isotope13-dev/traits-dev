traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.9
  size_max: 600000000
  id: virtualbox-product-name-reference
  desc: References the VirtualBox product name
  if:
    type: text
    regex: (^|[^a-z0-9-])virtualbox\b
    case_insensitive: true
