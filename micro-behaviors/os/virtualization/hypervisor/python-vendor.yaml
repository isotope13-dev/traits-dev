defaults:
  platforms: [routeros, appliance, unix]
  for: [python, pyc]
traits:
- id: python-virtualbox-word-reference
  desc: Python text references VirtualBox word
  crit: notable
  conf: 0.9
  if:
    type: text
    word: virtualbox
  unless:
  - type: path
    regex: '\.j$'


composite_rules:
- id: python-vmware-virtualbox-reference
  desc: Python VMware or VirtualBox reference
  crit: notable
  conf: 0.9
  not:
  - regex: '(?i)vmware\s*vmx'
  unless:
  - id: metadata/build/pip::python-packaging-vendored-source
  - id: metadata/build/pip::python-packaging-tool-tests
  - id: metadata/build/pip::pip-wheel-installer-source

  any:
  - id: metadata/vendor/string::vmware-keyword
  - id: micro-behaviors/os/virtualization/hypervisor::python-virtualbox-word-reference
