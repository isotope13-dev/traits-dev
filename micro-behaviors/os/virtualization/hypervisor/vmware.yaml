defaults:
  platforms: [unix]
  for: [shell, python, c, cpp, go, elf]

traits:
  # A bare vendor name is neutral: SDKs, compatibility layers, copyright
  # notices, and VM-management tools all reference VMware. Objective rules
  # combine this canonical fact with DMI, registry, WMI, or adapter probes
  # before inferring anti-analysis behavior.
  - id: vmware-vendor-name
    desc: References the VMware vendor name
    crit: notable
    conf: 0.75
    platforms: [unix, windows]
    for: [binaries, scripts]
    if:
      type: text
      word: VMware

  - id: eagerzeroedthick-disk-type
    desc: Creates eagerzeroedthick VMware virtual disk
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: eagerzeroedthick

  # These are hypervisor operations. Their malicious interpretations are
  # assembled by objective rules with datastore, persistence, or credential
  # context rather than being emitted as family signatures here.
  - id: vmware-hgfs-path
    desc: VMware HGFS shared-folder path
    crit: component
    conf: 0.72
    platforms: [unix, windows]
    for: [binaries, scripts]
    if:
      type: text
      substr: /vmhgfs

  - id: vmware-hgfs-mount-command
    desc: VMware HGFS shared-folder mount command
    crit: component
    conf: 0.9
    platforms: [unix, windows]
    for: [binaries, scripts]
    if:
      type: text
      regex: '(?i)(vmhgfs-fuse|mount -t vmhgfs)'

  - id: vmware-vmx-background-suppression
    desc: VMX launch hides output or backgrounds process
    crit: suspicious
    conf: 0.96
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?is)\bvmx\s+-x\b[^\n]{0,240}(2>/dev/null|0>/dev/null|&\s*$)'

  - id: vmware-esxi-local-startup-script
    desc: ESXi local startup script path
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      substr: /etc/rc.local.d/local.sh

  - id: vmware-vm-clone-operation
    desc: VMware VM clone operation
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?i)\b(CloneVM_Task|CreateCloneVM_Task|vmkfstools\s+-i\b|New-VM\b[^\n;]{0,220}\s-VM\b)'

  - id: vmware-vsphere-snapshot-task
    desc: VMware vSphere snapshot task marker
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      exact: CreateSnapshot_Task

  - id: vmware-powershell-snapshot-for-vm
    desc: VMware PowerShell snapshot command for VM
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?i)\bNew-Snapshot\b[^\r\n;]{0,220}\s-VM\b'

  - id: guest-time-sync-command
    desc: VMware guest-host time-sync command
    crit: notable
    conf: 0.95
    for: [binaries]
    if:
      type: text
      regex: '\b(BDOOR_CMD_GETTIME(FULL(_WITH_LAG)?)?|Time_Synchronize)\b'

composite_rules:
  - id: vmware-hgfs-shared-folder-mount
    desc: VMware HGFS shared-folder mount operation
    crit: notable
    conf: 0.92
    platforms: [unix, windows]
    for: [binaries, scripts]
    all:
      - id: vmware-hgfs-path
      - id: vmware-hgfs-mount-command

  - id: vmware-vm-snapshot-create-operation
    desc: VMware VM snapshot creation
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    platforms: [unix, windows]
    any:
      - id: vmware-vsphere-snapshot-task
      - id: vmware-powershell-snapshot-for-vm
