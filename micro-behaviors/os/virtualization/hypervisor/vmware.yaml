defaults:
  platforms: [unix]
  for: [shell, python, c, cpp, go, elf]

traits:
  - id: eagerzeroedthick-disk-type
    desc: Creates eagerzeroedthick VMware virtual disk
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: eagerzeroedthick

  # These are hypervisor operations. Their malicious interpretations are
  # assembled by objective rules with datastore, persistence, or credential
  # context rather than being emitted as family signatures here.
  - id: vmware-vmx-background-suppression
    desc: VMX launch hides output or backgrounds process
    crit: suspicious
    conf: 0.96
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?is)\bvmx\s+-x\b[^\n]{0,240}(2>/dev/null|0>/dev/null|&\s*$)'

  - id: vmware-esxi-local-startup-script
    desc: ESXi local startup script path
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      substr: /etc/rc.local.d/local.sh

  - id: vmware-vm-clone-operation
    desc: VMware VM clone operation
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?i)\b(CloneVM_Task|CreateCloneVM_Task|vmkfstools\s+-i\b|New-VM\b[^\n;]{0,220}\s-VM\b)'

  - id: vmware-vm-snapshot-create-operation
    desc: VMware VM snapshot creation
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?i)\b(CreateSnapshot_Task|CreateSnapshot|New-Snapshot|snapshot\.create)\b'

  - id: guest-time-sync-command
    desc: VMware guest-host time-sync command
    crit: notable
    conf: 0.95
    for: [binaries]
    if:
      type: text
      regex: '\b(BDOOR_CMD_GETTIME(FULL(_WITH_LAG)?)?|Time_Synchronize)\b'
