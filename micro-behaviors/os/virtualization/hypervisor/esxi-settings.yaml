# Neutral observations formerly filed as ESXi ransomware preparation.
defaults:
  platforms: [unix]
  for: [shell, python, perl]

traits:
  - id: esxcli-system-settings-advanced-set
    desc: esxcli advanced-setting modification command
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)esxcli\s+system\s+settings\s+advanced\s+set\b'

  - id: exec-installed-only-setting
    desc: ESXi runtime execution-control setting path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /User/execInstalledOnly

  - id: esxcli-tool
    desc: ESXi administration tool reference
    platforms: [unix, android]
    for: [scripts, binaries]
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: esxcli
