defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: node-vm-vendor-references
  desc: Multiple Node hypervisor vendor references
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::qemu-vendor-word
  - id: micro-behaviors/os/virtualization/hypervisor::kvm-vendor-word
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
  - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-reference
  needs: 2
  unless:
  - id: well-known/lib/network/novnc::source-context
  - id: metadata/document/html/
  # Hypervisor names are ordinary prose in Unix manual pages (bhyve_config(5)
  # documents its QEMU-compatible knobs); documentation is not a DMI probe.
  - id: metadata/package/documentation/manpage::unix-manpage
