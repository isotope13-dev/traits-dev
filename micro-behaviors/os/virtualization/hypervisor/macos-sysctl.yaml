# macOS reports whether it runs under a hypervisor through the
# kern.hv_vmm_present sysctl. Native code reads it to decide if it is inside a
# VM/sandbox; the key name is not something ordinary application code queries.
defaults:
  platforms: [macos]
  for: [c, cpp, objectivec, swift, macho, shell, python, go]
  crit: notable
  conf: 0.9
traits:
  - id: macos-hv-vmm-present-sysctl
    desc: macOS hypervisor-presence sysctl key
    attack: T1497.001
    if:
      type: text
      substr: hv_vmm_present
