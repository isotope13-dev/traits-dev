traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  id: vmxh-string
  desc: VMXH hardware string
  crit: notable
  conf: 0.5
  if:
    type: text
    exact: VMXH
  unless:
  - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-bin-path
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-tool-path
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-distribution
  - id: well-known/lib/development/llvm::llvm-lto-library
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  id: vmmouse-string
  desc: vmmouse hardware string
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: (?i)\bvmmouse\b
  unless:
  - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
  - id: well-known/app/utility/siw::siw-family-identity
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash--rx-1
  desc: Hyper-V name near detection/hypervisor terms
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(hyper-v.{0,40}(detect|hypervisor)|(detect|hypervisor).{0,40}hyper-v)
    case_insensitive: true
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash--rx-2
  desc: Hyper-V name with virtualization context
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(hyper-v.{0,40}(detect|hypervisor)|(virtual).{0,40}hyper-v)
    case_insensitive: true
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash--rx-3
  desc: Hyper-V name with virtualization context
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(hyper-v.{0,40}(virtual)|(detect|hypervisor|virtual).{0,40}hyper-v)
    case_insensitive: true
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash-cond-3--inline-17221
  desc: Hyper-V backup provider message
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (Cannot open WMI provider \{0\}\. Hyper-V|Hyper-V backup works)
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  id: vendor-microsoft-hv
  desc: Microsoft Hv hypervisor string
  crit: notable
  conf: 0.6
  if:
    type: text
    exact: Microsoft Hv
    case_insensitive: true
  unless:
  - id: well-known/lib/platform/klauspost-cpuid::go-cpuid-vendor-table
  - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: metadata/signed/platform/
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  id: vendor-kvm-repeat
  desc: KVMKVMKVM hypervisor signature
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: KVMKVMKVM
  unless:
  - id: well-known/lib/platform/klauspost-cpuid::go-klauspost-cpuid-library
  - id: well-known/app/system/quickemu
  - id: well-known/lib/platform/klauspost-cpuid::go-cpuid-vendor-table
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: cpuid-hypervisor-text-a
  desc: CPUID text near hypervisor names
  crit: notable
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: cpuid.{0,80}(hypervisor|vmware|kvm)
  unless:
  - id: well-known/lib/platform/klauspost-cpuid::go-klauspost-cpuid-library
  - id: well-known/app/infrastructure/virtualbox::package-member
  - id: well-known/app/infrastructure/xen::xen-hypervisor-context
  - id: well-known/app/infrastructure/open-vm-tools/
  - id: well-known/lib/platform/rust-kvm::kvm-ioctls-runtime
  - id: well-known/lib/platform/raw-cpuid/
  not:
  - regex: github\.com/klauspost/cpuid/v2\.(hypervisorVendorID|vendorID)
  - regex: (positive|negative) result
  - substr: CPUID hypervisor bit is set
  - substr: cpuid_vmm_
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: cpuid-hypervisor-text-b
  desc: CPUID text near hypervisor terms
  crit: notable
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: (?i)(^|[^A-Za-z])cpuid[^A-Za-z].{0,80}\b(xen|qemu|hypervisor)\b
  not:
  - regex: indicates
  - regex: CPUId[xX]
  unless:
  - id: well-known/lib/native/systemd::libsystemd-shared-library
  - id: well-known/tool/detection/falconet::falconet-env-config-marker
  - id: well-known/app/infrastructure/xen::xen-hypervisor-context
  - id: well-known/app/infrastructure/open-vm-tools/
  - id: well-known/app/infrastructure/vmware-tools/
  - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
  - id: well-known/lib/platform/rust-kvm::kvm-ioctls-runtime
  - id: well-known/lib/platform/raw-cpuid/
  - id: well-known/app/enterprise/ansys-licensing-client::ansys-licensing-client
composite_rules:
