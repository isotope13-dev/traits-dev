traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  id: vmxh-string
  desc: VMXH hardware string
  crit: notable
  conf: 0.5
  if:
    type: text
    exact: VMXH
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  id: vmmouse-string
  desc: vmmouse hardware string
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: (?i)\bvmmouse\b
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash--rx-1
  desc: Hyper-V name near detection/hypervisor terms
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(hyper-v.{0,40}(detect|hypervisor)|(detect|hypervisor).{0,40}hyper-v)
    case_insensitive: true
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash--rx-2
  desc: Hyper-V name with virtualization context
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(hyper-v.{0,40}(detect|hypervisor)|(virtual).{0,40}hyper-v)
    case_insensitive: true
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash--rx-3
  desc: Hyper-V name with virtualization context
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (?i)(hyper-v.{0,40}(virtual)|(detect|hypervisor|virtual).{0,40}hyper-v)
    case_insensitive: true
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash-cond-3--inline-17221
  desc: Hyper-V backup provider message
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: (Cannot open WMI provider \{0\}\. Hyper-V|Hyper-V backup works)
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  id: vendor-microsoft-hv
  desc: Microsoft Hv hypervisor string
  crit: notable
  conf: 0.6
  if:
    type: text
    exact: Microsoft Hv
    case_insensitive: true
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: cpuid-hypervisor-text-a
  desc: CPUID text near hypervisor names
  crit: notable
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: cpuid.{0,80}(hypervisor|vmware|kvm)
  not:
  - regex: github\.com/klauspost/cpuid/v2\.(hypervisorVendorID|vendorID)
  - regex: (positive|negative) result
  - substr: CPUID hypervisor bit is set
  - substr: cpuid_vmm_
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: cpuid-hypervisor-text-b
  desc: CPUID text near hypervisor terms
  crit: notable
  conf: 0.9
  if:
    type: text
    case_insensitive: true
    regex: (?i)(^|[^A-Za-z])cpuid[^A-Za-z].{0,80}\b(xen|qemu|hypervisor)\b
  not:
  - regex: indicates
  - regex: CPUId[xX]
composite_rules:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  id: vm-hardware
  desc: Multiple VM hardware name references
  crit: notable
  conf: 0.6
  needs: 2
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vmxh-string
  - id: micro-behaviors/os/sysinfo/virtualization::virtio-reference
  - id: micro-behaviors/os/virtualization/hypervisor::vmmouse-string
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  id: qemu-string
  desc: QEMU alongside multiple VM hardware names
  crit: notable
  conf: 0.5
  all:
  - id: micro-behaviors/os/virtualization/hypervisor::vm-hardware
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::qemu-vendor-string
- conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - binaries
  id: vm-vendor-hardware-references
  desc: Multiple VM vendor and hardware references
  crit: notable
  needs: 4
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
  - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-mention
  - id: micro-behaviors/os/virtualization/hypervisor::qemu-string
  - id: micro-behaviors/os/sysinfo/dmi::smbios-token
  - id: micro-behaviors/os/virtualization/hypervisor::vm-hardware
- conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - binaries
  id: vm-vendor-smbios-references
  desc: Multiple VM vendor and SMBIOS references
  crit: notable
  needs: 4
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
  - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-mention
  - id: micro-behaviors/os/virtualization/hypervisor::qemu-string
  - id: micro-behaviors/os/sysinfo/dmi::smbios-token
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash
  desc: Hyper-V hypervisor vendor string
  crit: notable
  conf: 0.6
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash--rx-1
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash--rx-2
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash--rx-3
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  id: vendor-hyperv
  desc: Hyper-V hypervisor vendor string
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-microsoft-hv
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  id: cpuid-hypervisor-text-references
  desc: CPUID and hypervisor text references
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-text-a
  - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-text-b
defaults: {}
