  - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/utility/siw::siw-family-identity
  - id: well-known/lib/native/systemd::systemd-native-library-context
- conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - binaries
  id: vm-vendor-smbios-references
  desc: Multiple VM vendor and SMBIOS references
  crit: notable
  needs: 4
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vmware-vendor-name
  - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-product-name-mention
  - id: micro-behaviors/os/virtualization/hypervisor::qemu-string
  - id: micro-behaviors/os/sysinfo/dmi::smbios-token
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv
  unless:
  - id: metadata/package/compat::virtualbox-platform-component
  - id: metadata/vendor/identity/
  - id: well-known/lib/runtime/scripted/electron/
  - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/lib/native/systemd::systemd-native-library-context
- platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  id: vendor-hyperv-dash
  desc: Hyper-V hypervisor vendor string
  crit: notable
  conf: 0.6
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash--rx-1
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash--rx-2
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash--rx-3
  unless:
  - id: metadata/binary/framework/
  - id: metadata/signed/unknown::broadcom-inc
  - id: metadata/signed/unknown::oracle-america
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash-cond-3--inline-17221
  - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  id: vendor-hyperv
  desc: Hyper-V hypervisor vendor string
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-hyperv-dash
  - id: micro-behaviors/os/virtualization/hypervisor::vendor-microsoft-hv
  unless:
  - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - id: well-known/lib/ai/ggml::ggml-native-debugger-helper-context
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  id: cpuid-hypervisor-text-references
  desc: CPUID and hypervisor text references
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-text-a
  - id: micro-behaviors/os/virtualization/hypervisor::cpuid-hypervisor-text-b
  unless:
