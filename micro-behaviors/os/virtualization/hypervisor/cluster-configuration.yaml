defaults:
  platforms: [linux, macos, windows]
  for: [pe, batch, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powercli-cluster-ha-disable
    desc: PowerCLI disables cluster high availability
    if:
      type: raw
      regex: '(?i)\bSet-Cluster[^\r\n;]{0,100}-HAEnabled[ :]+\$false\b'

  - id: powercli-cluster-drs-disable
    desc: PowerCLI disables cluster resource scheduling
    if:
      type: raw
      regex: '(?i)\bSet-Cluster[^\r\n;]{0,100}-DrsEnabled[ :]+\$false\b'
