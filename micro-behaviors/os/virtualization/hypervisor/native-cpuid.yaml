defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-cpuid-hypervisor-vendor-query
    desc: Queries the CPUID hypervisor vendor leaf
    conf: 0.98
    if:
      type: hex
      section: .text
      # Querying the hypervisor vendor is neutral; gating execution on the
      # answer requires separate evidence. Allow an intervening RBX save.
      pattern: 'B8 00 00 00 40 (31 C9|33 C9) [0-8] 0F A2'
