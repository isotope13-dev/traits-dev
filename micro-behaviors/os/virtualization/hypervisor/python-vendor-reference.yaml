traits:
- platforms:
  - routeros
  - appliance
  - unix
  for:
  - python
  - pyc
  id: python-xen-hyperv-bochs-reference
  desc: Python Xen, Hyper-V or Bochs vendor reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b(xen|hyper-v|bochs)\b
  unless:
  - id: metadata/build/pip::python-packaging-vendored-source
  - id: metadata/build/pip::python-packaging-tool-tests
  - id: metadata/build/pip::pip-wheel-installer-source
  - id: well-known/app/development/calvyn-code
  - type: path
    regex: \.j$
