traits:
- id: dotnet-vm-vendor-strings
  desc: C# VirtualBox name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: VirtualBox
- id: dotnet-qemu-proc-probes
  desc: C# QEMU command-line property reference
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: qemu,command-line
defaults:
  platforms:
  - unix
  - appliance
  - windows
  for:
  - csharp
composite_rules:
- id: dotnet-vm-reference-suite
  desc: C# VM, CPU-path and timing references
  crit: notable
  conf: 0.98
  platforms:
  - unix
  - windows
  all:
  - id: micro-behaviors/os/sysinfo/network::dotnet-network-interface-enumeration
  - id: micro-behaviors/os/virtualization/hypervisor::dotnet-vm-vendor-strings
  - id: micro-behaviors/os/virtualization/hypervisor::dotnet-qemu-proc-probes
  - id: micro-behaviors/fs/path/proc::dotnet-cpuinfo-vm-probe
  - id: micro-behaviors/time/timing/check::dotnet-timing-emulation-check
