# Preserve the former vendor group's package filter for intent consumers.
# The unfiltered, canonical vendor-hyperv observation remains available.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries]
composite_rules:
  - id: hyperv-vendor-reference
    desc: Hyper-V vendor reference with package filter
    crit: notable
    conf: 0.85
    all:
      - id: vendor-hyperv
    unless:
      - id: metadata/package/compat::virtualbox-platform-component
