traits:
- conf: 0.9
  id: virtualization-manager-marker--rx-1
  desc: virt-host-validate virtualization tool string
  crit: notable
  if:
    type: text
    substr: virt-host-validate
    case_insensitive: true
- conf: 0.9
  id: virtualization-manager-marker--rx-3
  desc: VBoxManager virtualization tool string
  crit: notable
  if:
    type: text
    substr: VBoxManager
    case_insensitive: true
- conf: 0.9
  id: virtualization-manager-marker--rx-4
  desc: qemu-kvm virtualization tool string
  crit: notable
  if:
    type: text
    substr: qemu-kvm
    case_insensitive: true
  unless:
  - id: well-known/tool/development/runtime/qemu::qemu-cli-utility
defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
