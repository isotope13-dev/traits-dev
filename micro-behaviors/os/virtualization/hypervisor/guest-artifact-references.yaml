defaults:
  for: [scripts, binaries]
  platforms: [linux, macos, windows]
traits:
  - id: virtualbox-guest-driver-reference
    desc: VirtualBox guest driver file or device reference
    # A path reference is only evidence consumed by a VM-detection composite;
    # installers and diagnostic tools legitimately name these files too.
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)VBoxGuest\.sys|/dev/vboxguest'
    unless:
    - id: micro-behaviors/os/virtualization/hypervisor::guest-agent-driver-roster
    - id: metadata/package/compat::virtualbox-platform-component
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository

  - id: virtualbox-mouse-driver-reference
    desc: VirtualBox mouse driver name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: VBoxMouse
    unless:
    - id: metadata/signed/unknown::intel-corporation
    - id: micro-behaviors/os/virtualization/hypervisor::guest-agent-driver-roster
    - type: text
      exact: SYSTEM\ControlSet001\Services\VBoxMouse

  - id: virtualbox-shared-folders-driver-reference
    desc: VirtualBox shared-folders driver name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: VBoxSF
    unless:
    - id: micro-behaviors/os/virtualization/hypervisor::guest-agent-driver-roster
    - type: text
      exact: SYSTEM\ControlSet001\Services\VBoxSF
    - id: well-known/app/utility/siw::siw-family-identity

  - id: vmware-tools-name-reference
    desc: VMware guest tools name reference
    crit: notable
    conf: 0.8
    for: [scripts, binaries, text, data]
    if:
      type: text
      regex: '\b(open-vm-tools|vmware-rpctool|vmware-tools)\b'
    unless:
    - id: metadata/signed/unknown::broadcom-inc
    - id: well-known/app/infrastructure/open-vm-tools/

  - id: guest-agent-driver-roster
    desc: QEMU agent and VirtualBox driver roster
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: qemu-ga.{0,256}VBoxSF.{0,256}VBoxMouse.{0,256}VBoxGuest
