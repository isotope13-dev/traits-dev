# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - pe
  - elf
  - shell
  - python
  - javascript
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.9
traits:
- id: vcpu-backdoor
  desc: VMware guest CPU backdoor interface
  if:
    type: text
    substr: VCPUInfoBackdoor
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/app/infrastructure/open-vm-tools/
- id: guest-backdoor-ops
  desc: VMware guest-host backdoor operations
  if:
    type: text
    substr: gGuestBackdoorOps
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/app/infrastructure/open-vm-tools/
