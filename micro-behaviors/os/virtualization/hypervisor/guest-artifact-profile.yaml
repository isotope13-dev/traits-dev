defaults:
  for: [scripts, binaries]
  platforms: [linux, macos, windows]
composite_rules:
  - id: guest-artifact-references
    desc: References VM guest names or device paths
    crit: notable
    conf: 0.85
    any:
    - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-guest-driver-reference
    - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-mouse-driver-reference
    - id: micro-behaviors/os/virtualization/hypervisor::virtualbox-shared-folders-driver-reference
    - id: micro-behaviors/os/virtualization/hypervisor::vmware-tools-name-reference
    - id: micro-behaviors/process/info/name::vmtoolsd-name
    - id: micro-behaviors/process/info/name::qemu-guest-agent-name-reference
    - id: micro-behaviors/fs/path/device/storage::dev-vda
    unless:
    - id: well-known/app/system/iobit::iobit-signed-component-context
    - id: well-known/app/infrastructure/
    downgrade:
      any:
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
