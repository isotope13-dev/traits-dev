# Vendor strings identify virtualization support; they do not prove evasion.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
composite_rules:
- id: multiple-hypervisor-indicators
  desc: Multiple virtualization references
  crit: notable
  conf: 0.95
  scope: leaf
  needs: 3
  any:
  - id: vmware-vendor-name
  - id: virtualbox-product-name-reference
  - id: vbox-token
  - id: qemu-vendor-string
  - id: qemu-vendor-word
  - id: well-known/app/infrastructure/xen::xenstore-marker
  - id: well-known/app/infrastructure/xen::xen-hypervisor-marker
  - id: micro-behaviors/os/sysinfo/dmi::smbios-token
  - id: micro-behaviors/os/container/runtime::dockerenv
