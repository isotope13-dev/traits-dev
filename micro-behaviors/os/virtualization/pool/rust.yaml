defaults:
  platforms: [unix]
  for: [rust]
  crit: notable
  conf: 0.9
traits:
  - id: pool-restore-on-release
    desc: Pool restore-on-release control
    if:
      type: text
      substr: restore_on_release
  - id: supermachine-pool-identifier
    desc: Supermachine worker pool identifier
    crit: notable
    if:
      type: text
      regex: '\bsupermachine[_-][A-Za-z0-9_-]{0,80}'
  - id: idle-timeout-field
    desc: Idle timeout configuration field
    crit: notable
    if:
      type: text
      word: idle_timeout
  - id: pool-acquire-timeout
    desc: Worker pool acquire timeout
    if:
      type: text
      substr: acquire_timeout
  - id: supermachine-worker
    desc: Supermachine worker process
    if:
      type: text
      substr: supermachine-worker
composite_rules:
  - id: pool-idle-timeout
    desc: Supermachine worker pool idle timeout
    near_bytes: 1200
    all:
      - id: supermachine-pool-identifier
      - id: idle-timeout-field
  - id: microvm-worker-pool
    desc: MicroVM worker pool controls
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/os/virtualization/pool::pool-acquire-timeout
      - id: micro-behaviors/process/create/workers::rust-pool-builder-type
      - id: micro-behaviors/os/virtualization/pool::pool-idle-timeout
      - id: micro-behaviors/os/virtualization/pool::pool-restore-on-release
      - id: micro-behaviors/os/virtualization/pool::supermachine-worker
