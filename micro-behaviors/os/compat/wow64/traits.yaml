defaults:
  for: [pe, dll, c, cpp]
  platforms:
    - windows
traits:
  - id: x86-heavens-gate-transition
    desc: x86 Heaven's Gate transition to x64 code
    crit: notable
    conf: 0.98
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '6A 33 E8 00 00 00 00 83 04 24 05 CB'
  - id: x86-heavens-gate-segment-read
    desc: Heaven's Gate reads an x64 segment base
    crit: notable
    conf: 0.97
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '65 48 8B 04 25 30 00 00 00'
  - id: x86-heavens-gate-stack-syscall-sequence
    desc: Heaven's Gate stack syscall sequence
    crit: suspicious
    conf: 0.98
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: 'C7 04 24 80 0F 05 FD'
  - id: wow64-fs-redirect
    desc: WoW64 filesystem redirection control
    crit: notable
    conf: 0.9
    attack: T1574
    if:
      type: text
      substr: Wow64EnableWow64FsRedirection
  - id: wow64-disable-redirect
    desc: Disable WoW64 filesystem redirection
    crit: notable
    conf: 0.9
    attack: T1574
    if:
      type: text
      substr: Wow64DisableWow64FsRedirection
  - id: wow64-revert-redirect
    desc: Revert WoW64 filesystem redirection
    conf: 0.8
    if:
      type: text
      substr: Wow64RevertWow64FsRedirection
  - id: is-wow64-process
    desc: Check if running under WoW64
    conf: 0.7
    if:
      type: text
      substr: IsWow64Process
  - id: wow64-process-stack
    desc: Wow64Process reference via stack string
    crit: notable
    conf: 0.75
    if:
      type: text
      exact: Wow64Process
  - id: ntwow64-query-information-process64
    desc: Imports NtWow64QueryInformationProcess64 API
    crit: notable
    conf: 0.93
    if:
      type: import
      exact: NtWow64QueryInformationProcess64
  - id: ntwow64-query-virtual-memory64
    desc: Imports NtWow64QueryVirtualMemory64 API
    crit: notable
    conf: 0.93
    if:
      type: import
      exact: NtWow64QueryVirtualMemory64
  - id: ntwow64-read-virtual-memory64
    desc: Imports NtWow64ReadVirtualMemory64 API
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: NtWow64ReadVirtualMemory64
  - id: ntwow64-write-virtual-memory64
    desc: Imports NtWow64WriteVirtualMemory64 API
    crit: notable
    conf: 0.96
    if:
      type: import
      exact: NtWow64WriteVirtualMemory64
  - id: process-basic-information-class
    desc: ProcessBasicInformation info class
    crit: notable
    conf: 0.88
    for:
      - c
      - cpp
    if:
      type: text
      substr: ProcessBasicInformation
composite_rules:
  - id: wow64-peb64-query
    desc: Query 64-bit PEB location from WoW64
    crit: notable
    conf: 0.95
    all:
      - id: ntwow64-query-information-process64
      - id: process-basic-information-class
  # Reading another process's 64-bit address space from a 32-bit (WoW64)
  # process is how every process lister recovers a 64-bit target's command
  # line, cwd and environment -- psutil, Process Explorer and Task Manager all
  # walk the PEB64 exactly this way. It crosses an architecture boundary but
  # not a trust boundary, so it is a capability observation, not an intent
  # signal. This was `suspicious` and fired on psutil's process_info.c.
  - id: wow64-cross-arch-memory-read
    desc: Read a 64-bit process address space from WoW64
    crit: notable
    conf: 0.95
    all:
      - id: is-wow64-process
    needs: 2
    any:
      - id: ntwow64-query-virtual-memory64
      - id: ntwow64-read-virtual-memory64
      - id: wow64-peb64-query
  # Writing is the half with no introspection use: locating a 64-bit target
  # from a 32-bit process and then writing into it is the WoW64 cross-arch
  # injection primitive (Heaven's Gate loaders, 32-bit droppers staging into
  # 64-bit hosts). Keyed on the write API rather than on any one loader.
  - id: wow64-cross-arch-memory-write
    desc: Write into a 64-bit process address space from WoW64
    crit: suspicious
    conf: 0.95
    attack: T1055
    all:
      - id: is-wow64-process
      - id: ntwow64-write-virtual-memory64
