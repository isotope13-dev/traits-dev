defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: ifconfig-hwaddr-field
    desc: References ifconfig HWaddr field
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: HWaddr
  - id: ether-mac-address-field
    desc: Parses ether MAC address field
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'ether\s+[0-9a-fA-F]{2}[:-][0-9a-fA-F]{2}[:-][0-9a-fA-F]{2}'
  # The two ioctl spellings add the compiled-source languages: SIOCGIFHWADDR
  # is written out by name in C/C++/Go/Rust, which the scripts+binaries pair
  # never reached.
  - id: siocgifhwaddr-ioctl
    desc: References MAC-address query ioctl
    crit: notable
    conf: 0.85
    platforms: [linux]
    for: [shell, python, perl, c, cpp, go, rust, elf]
    if:
      type: text
      substr: SIOCGIFHWADDR
  # Scripting languages have no SIOCGIFHWADDR constant, so they pass the
  # request number to ioctl() literally. 0x8927 has exactly one meaning.
  - id: siocgifhwaddr-request-number
    desc: Reads interface MAC via ioctl 0x8927
    crit: notable
    conf: 0.9
    platforms: [linux]
    for: [shell, python, perl, c, cpp, go, rust, elf]
    if:
      type: text
      regex: '(?i)ioctl\s*\([^;\n]{0,80}0x8927'

composite_rules:
  - id: mac-query-ioctl
    desc: Reads an interface MAC address via ioctl
    crit: notable
    conf: 0.9
    platforms: [linux]
    for: [shell, python, perl, c, cpp, go, rust, elf]
    any:
      - id: siocgifhwaddr-ioctl
      - id: siocgifhwaddr-request-number
