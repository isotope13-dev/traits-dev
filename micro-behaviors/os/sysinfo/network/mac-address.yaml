defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: ifconfig-hwaddr-field
    desc: References ifconfig HWaddr field
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: HWaddr
  - id: ether-mac-address-field
    desc: Parses ether MAC address field
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'ether\s+[0-9a-fA-F]{2}[:-][0-9a-fA-F]{2}[:-][0-9a-fA-F]{2}'
  # The two ioctl spellings add the compiled-source languages: SIOCGIFHWADDR
  # is written out by name in C/C++/Go/Rust, which the scripts+binaries pair
  # never reached.
  - id: siocgifhwaddr-ioctl
    desc: References MAC-address query ioctl
    crit: notable
    conf: 0.85
    platforms: [linux]
    for: [shell, python, perl, c, cpp, go, rust, elf]
    if:
      type: text
      substr: SIOCGIFHWADDR
  # Scripting languages have no SIOCGIFHWADDR constant, so they pass the
  # request number to ioctl() literally. 0x8927 has exactly one meaning.
  - id: siocgifhwaddr-request-number
    desc: Reads interface MAC via ioctl 0x8927
    crit: notable
    conf: 0.9
    platforms: [linux]
    for: [shell, python, perl, c, cpp, go, rust, elf]
    if:
      type: text
      regex: '(?i)ioctl\s*\([^;\n]{0,80}0x8927'

  # Go reaches the same hardware address through the standard library instead
  # of ioctl: net.Interfaces() or net.InterfaceByName() returns a net.Interface
  # whose HardwareAddr field is the MAC. The field name belongs to that struct
  # alone, so reading it is unambiguous.
  - id: go-interface-hardware-addr
    desc: Reads interface MAC via HardwareAddr
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: text
      regex: '\.HardwareAddr\b'
  - id: python-uuid-getnode-call
    desc: Calls uuid.getnode() for node identifier
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: text
      substr: uuid.getnode()
    unless:
      - id: well-known/app/utility/ok-script::ok-script-framework-context

composite_rules:
  - id: mac-query-ioctl
    desc: Reads an interface MAC address via ioctl
    crit: notable
    conf: 0.9
    platforms: [linux]
    for: [shell, python, perl, c, cpp, go, rust, elf]
    any:
      - id: siocgifhwaddr-ioctl
      - id: siocgifhwaddr-request-number
