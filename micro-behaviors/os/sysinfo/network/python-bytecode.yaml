defaults:
  platforms: [qnx, unix]
  for: [python, pyc]
  attack: T1041

traits:
  # A single generic identifier, not a "bundle": `network_connections` appears
  # in Selenium's compiled remote_connection (mobile network-connection
  # commands), psutil-style inventory code, and any monitoring agent. Named and
  # levelled for what it is; the QNX family signature is the composite below
  # (ifconfig + sha256 exfil header + sendall).
  - id: pyc-network-connections-identifier
    desc: network_connections identifier in pyc
    crit: notable
    conf: 0.94
    for: [pyc]
    if:
      type: text
      substr: network_connections
