defaults:
  platforms:
  - linux
  for:
  - javascript
traits:
  - id: node-exec-host-network-recon-command
    desc: Exec command queries host and interface details
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        index: 0
        from:
          value: 'whoami.{0,80}ip addr show'
