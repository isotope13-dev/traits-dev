defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: get-network-params
    desc: Query Windows TCP/IP configuration parameters
    crit: notable
    conf: 0.9
    attack: T1016
    if:
      type: import
      exact: GetNetworkParams

  - id: net-statistics-get
    desc: Query Windows network statistics
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: NetStatisticsGet
  - id: lanmanserver-service
    desc: LanmanServer service marker
    crit: component
    conf: 0.8
    if:
      type: text
      exact: LanmanServer
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: lanmanworkstation-service
    desc: LanmanWorkstation service marker
    crit: component
    conf: 0.8
    if:
      type: text
      exact: LanmanWorkstation
  # Names of the pseudo-adapters Windows creates for tunnelling and
  # virtualisation. Code carrying several of them together is holding a filter
  # list: it walks the adapter table and skips these so whatever it does next
  # sees only physical NICs. Individually each is just a word, so they are
  # components and only the proximity composite below is an observation.
  - id: isatap-adapter-name
    desc: ISATAP tunnel adapter name
    crit: component
    conf: 0.9
    if:
      type: text
      word: isatap
      case_insensitive: true
  - id: teredo-adapter-name
    desc: Teredo tunnel adapter name
    crit: component
    conf: 0.9
    if:
      type: text
      word: teredo
      case_insensitive: true
  - id: hyperv-adapter-name
    desc: Hyper-V virtual adapter name
    crit: component
    conf: 0.9
    if:
      type: text
      word: hyper-v
      case_insensitive: true
  - id: loopback-adapter-name
    desc: Loopback adapter name
    crit: component
    conf: 0.9
    if:
      type: text
      word: loopback
      case_insensitive: true
composite_rules:
  - id: virtual-adapter-name-filter-table
    desc: Virtual adapter name filter table
    crit: notable
    conf: 0.9
    # One 192-byte window, so this is a packed table of names rather than four
    # unrelated mentions scattered through a large image.
    near_bytes: 192
    needs: 3
    any:
      - id: isatap-adapter-name
      - id: teredo-adapter-name
      - id: hyperv-adapter-name
      - id: loopback-adapter-name
  - id: windows-network-statistics
    desc: Windows network activity fingerprinting
    crit: notable
    conf: 0.92
    all:
      - id: net-statistics-get
    any:
      - id: lanmanserver-service
      - id: lanmanworkstation-service
