defaults:
  crit: notable
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: get-network-params
  desc: Query Windows TCP/IP configuration parameters
  conf: 0.9
  attack: T1016
  if:
    type: import
    exact: GetNetworkParams
- id: net-statistics-get
  desc: Query Windows network statistics
  conf: 0.9
  if:
    type: text
    exact: NetStatisticsGet
- id: lanmanserver-service
  desc: LanmanServer service marker
  conf: 0.8
  if:
    type: text
    exact: LanmanServer
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: lanmanworkstation-service
  desc: LanmanWorkstation service marker
  conf: 0.8
  if:
    type: text
    exact: LanmanWorkstation
composite_rules:
- id: windows-network-statistics
  desc: Windows network activity fingerprinting
  conf: 0.92
  all:
  - id: net-statistics-get
  any:
  - id: lanmanserver-service
  - id: lanmanworkstation-service
- id: route-and-adapter-discovery
  desc: Route table and adapter discovery
  for:
  - pe
  - dll
  - c
  - cpp
  attack: T1016
  conf: 0.92
  all:
  - id: micro-behaviors/os/network/route::get-ip-forward-table
  - id: micro-behaviors/os/network/route::get-best-interface-ex
  any:
  - id: micro-behaviors/network/interface::get-adapters-addresses
  - id: micro-behaviors/network/interface::get-adapters-info
  - id: micro-behaviors/network/interface::get-if-entry2
  - id: micro-behaviors/network/interface::get-ip-interface-entry
- id: host-network-fingerprint-surface
  desc: Multiple host network and domain clues
  for:
  - pe
  - dll
  - c
  - cpp
  attack: T1016
  conf: 0.9
  needs: 3
  any:
  - id: micro-behaviors/network/interface::get-adapters-info
  - id: micro-behaviors/network/interface::get-adapters-addresses
  - id: micro-behaviors/network/interface::get-if-table
  - id: micro-behaviors/network/interface::get-if-table2
  - id: micro-behaviors/network/interface::get-if-entry2
  - id: micro-behaviors/network/interface::get-ip-interface-table
  - id: micro-behaviors/network/interface::get-ip-interface-entry
  - id: micro-behaviors/os/network/route::get-ip-forward-table
  - id: micro-behaviors/os/network/route::get-best-interface-ex
  - id: micro-behaviors/os/sysinfo/hostname::net-domain-join-info
  - id: micro-behaviors/hardware/wireless/network::wlan-network-recon
  - id: micro-behaviors/hardware/wireless/network::bluetooth-device-recon
  downgrade:
    needs: 3
  unless:
  - id: well-known/dual-use/tunnel/swifttunnel_vpn/
  - id: well-known/app/utility/fastfetch/
