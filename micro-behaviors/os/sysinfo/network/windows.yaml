defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: get-network-params
    desc: Query Windows TCP/IP configuration parameters
    conf: 0.9
    attack: T1016
    if:
      type: import
      exact: GetNetworkParams

  - id: net-statistics-get
    desc: Query Windows network statistics
    conf: 0.9
    if:
      type: text
      exact: NetStatisticsGet
  - id: lanmanserver-service
    desc: LanmanServer service marker
    conf: 0.8
    if:
      type: text
      exact: LanmanServer
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: lanmanworkstation-service
    desc: LanmanWorkstation service marker
    conf: 0.8
    if:
      type: text
      exact: LanmanWorkstation
  # Names of the pseudo-adapters Windows creates for tunnelling and
  # virtualisation. Code carrying several of them together is holding a filter
  # list: it walks the adapter table and skips these so whatever it does next
  # sees only physical NICs. Individually each is just a word, so they are
  # components and only the proximity composite below is an observation.
  - id: isatap-adapter-name
    desc: ISATAP tunnel adapter name
    conf: 0.9
    if:
      type: text
      word: isatap
      case_insensitive: true
  - id: teredo-adapter-name
    desc: Teredo tunnel adapter name
    conf: 0.9
    if:
      type: text
      word: teredo
      case_insensitive: true
  - id: hyperv-adapter-name
    desc: Hyper-V virtual adapter name
    conf: 0.9
    if:
      type: text
      word: hyper-v
      case_insensitive: true
  - id: loopback-adapter-name
    desc: Loopback adapter name
    conf: 0.9
    if:
      type: text
      word: loopback
      case_insensitive: true
composite_rules:
  - id: virtual-adapter-name-filter-table
    desc: Virtual adapter name filter table
    conf: 0.9
    # One 192-byte window, so this is a packed table of names rather than four
    # unrelated mentions scattered through a large image.
    near_bytes: 192
    needs: 3
    any:
      - id: isatap-adapter-name
      - id: teredo-adapter-name
      - id: hyperv-adapter-name
      - id: loopback-adapter-name
  - id: windows-network-statistics
    desc: Windows network activity fingerprinting
    conf: 0.92
    all:
      - id: net-statistics-get
    any:
      - id: lanmanserver-service
      - id: lanmanworkstation-service

  - id: route-and-adapter-discovery
    desc: Route table and adapter discovery
    crit: notable
    for: [pe, dll, c, cpp]
    attack: T1016
    conf: 0.92
    all:
    - id: "micro-behaviors/os/network/route::get-ip-forward-table"
    - id: "micro-behaviors/os/network/route::get-best-interface-ex"
    any:
    - id: micro-behaviors/network/interface::get-adapters-addresses
    - id: micro-behaviors/network/interface::get-adapters-info
    - id: micro-behaviors/network/interface::get-if-entry2
    - id: micro-behaviors/network/interface::get-ip-interface-entry

  # Three IP Helper calls is the shape of any program that has to know about the
  # machine's interfaces: Wine's iphlpapi.dll IS that API, Bonjour's
  # mDNSResponder must enumerate adapters to answer on them, and CEF walks them
  # for its network service. A clear capability worth reporting, but reading the
  # adapter tables is not by itself an attempt to fingerprint a victim -- the
  # stealer composites that consume this supply the intent.
  - id: host-network-fingerprint-surface
    desc: Multiple host network and domain clues
    crit: notable
    for: [pe, dll, c, cpp]
    attack: T1016
    conf: 0.9
    needs: 3
    any:
    - id: micro-behaviors/network/interface::get-adapters-info
    - id: micro-behaviors/network/interface::get-adapters-addresses
    - id: micro-behaviors/network/interface::get-if-table
    - id: micro-behaviors/network/interface::get-if-table2
    - id: micro-behaviors/network/interface::get-if-entry2
    - id: micro-behaviors/network/interface::get-ip-interface-table
    - id: micro-behaviors/network/interface::get-ip-interface-entry
    - id: "micro-behaviors/os/network/route::get-ip-forward-table"
    - id: "micro-behaviors/os/network/route::get-best-interface-ex"
    - id: micro-behaviors/os/sysinfo/hostname::net-domain-join-info
    - id: micro-behaviors/hardware/wireless/network::wlan-network-recon
    - id: micro-behaviors/hardware/wireless/network::bluetooth-device-recon
    downgrade:
      needs: 3
    unless:
    - id: well-known/dual-use/tunnel/swifttunnel_vpn/
    - id: well-known/app/utility/fastfetch/
