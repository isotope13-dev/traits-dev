defaults:
  platforms: [unix, windows]
  for: [batch, powershell, shell, binaries]
  attack: T1082
traits:
  - id: sh-whoami-command--rx-3
    desc: whoami current-user enumeration command
    crit: component
    conf: 0.75
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: "(^|[\\n;&|`$({])\\s*whoami(\\s|[;&|)]|$)"
  - id: windows-systeminfo-command
    desc: Windows systeminfo command
    crit: notable
    conf: 0.72
    for: [batch, powershell, shell]
    if:
      type: text
      regex: (?i)(^|[\r\n&|({])\s*systeminfo(\.exe)?\b
  - id: systeminfo-token
    desc: systeminfo command/string token
    crit: notable
    conf: 0.72
    for: [batch, class, pe, powershell, pyc, python]
    platforms: [windows]
    if:
      type: text
      substr: systeminfo
  - id: pidof-display-manager
    desc: pidof looks up a display manager
    crit: notable
    conf: 0.88
    for: [elf, shell]
    platforms: [unix]
    if:
      type: text
      regex: 'pidof (gdm3?|lightdm|sddm|xdm)\b'
composite_rules:
  - id: sh-whoami-command
    desc: whoami command
    crit: baseline
    conf: 0.75
    for: [shell]
    platforms: [unix]
    any:
      - id: sh-whoami-command--rx-3
    unless:
      - id: metadata/package/testing/harness/runtime/
