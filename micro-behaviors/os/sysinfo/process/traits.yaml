# OS Information Gathering
# System information collection capabilities
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  - id: teb-fs-18h-source
    desc: Reads the Windows TEB via FS:[18h]
    crit: notable
    conf: 0.85
    for: [c, cpp]
    if:
      type: text
      regex: 'FS:\[0?x?18h?\]'
      case_insensitive: true
  # Inline-asm load of the +0Ch field of whatever EAX points at. On the PEB that
  # field is PEB->Ldr, which is why anti-debug/anti-dump composites want it —
  # but the operand alone proves only "reads a struct field at offset 12", so it
  # is a neutral structure read here and the PEB meaning comes from pairing it
  # with the FS:[30h] PEB fetch. Requiring the `mov` form keeps unrelated
  # `call [eax + 0xC]` dispatch stubs (QEMU's TCG trampoline builder) out.
  - id: struct-offset-0ch-load-source
    desc: Inline asm loads struct offset 0Ch
    crit: notable
    conf: 0.8
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\bmov\s+e[a-d]x\s*,[^;\n]{0,16}\[eax\s*\+\s*(0x)?0?[Cc]h?\]'
  # === Startup Information ===
  - id: get-startup-info
    desc: Get process startup information
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetStartupInfoW"
  - id: get-startup-info-a
    desc: Read startup info via GetStartupInfoA
    crit: baseline
    conf: 0.70
    if:
      type: symbol
      exact: "GetStartupInfoA"
  # === Module Information ===
  - id: get-module-filename-ex
    desc: Get module filename for process
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetModuleFileNameEx"

  # Windows host-inventory utilities as command strings or shell commands.
  # The command/quote boundary avoids treating a prose mention as execution
  # while still matching source passed to child_process/subprocess launchers.
  - id: windows-dxdiag-command
    desc: DirectX diagnostic command invocation
    crit: notable
    conf: 0.88
    for: [scripts, javascript, typescript, python, powershell, batch, shell]
    attack: T1082
    if:
      type: text
      regex: (?im)(^|[;&|])\s*dxdiag\b|\b(exec\w*|spawn|Popen|run)\(['"]dxdiag

  - id: windows-wmic-command
    desc: WMIC command-line invocation
    crit: notable
    conf: 0.88
    for: [scripts, javascript, typescript, python, powershell, batch, shell]
    attack: T1082
    if:
      type: text
      regex: (?im)(^|[;&|])\s*wmic\b|\b(exec\w*|spawn|Popen|run)\(['"]wmic
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
