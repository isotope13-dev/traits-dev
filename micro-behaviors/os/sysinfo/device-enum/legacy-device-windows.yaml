# A Windows PnP USB hardware identifier is a neutral device identity string.
# RDP and privilege-escalation composites add the transport and installer
# context; the identifier alone does not imply remote-device redirection.
defaults:
  platforms: [windows]
  for: [python, c, cpp, powershell, batch, pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: windows-usb-hardware-id
    desc: Windows USB VID/PID hardware identifier
    if:
      type: text
      regex: '(?i)USB\\+VID_.{2,24}&PID_.{2,24}'
