defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: setupapi-system-query-api-profile
  desc: SetupAPI enumeration and system-query APIs
  crit: notable
  conf: 0.88
  all:
    - id: micro-behaviors/os/sysinfo/device-enum::setupapi-device-enumeration
  any:
    - id: micro-behaviors/os/sysinfo/hardware::get-system-info
    - id: micro-behaviors/fs/device::query-dos-device-w
    - id: micro-behaviors/os/sysinfo/disk::freespace
  needs: 1
  unless:
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor/
    - id: well-known/lib/media/sdl/
