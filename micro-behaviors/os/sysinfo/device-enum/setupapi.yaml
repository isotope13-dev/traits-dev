# SETUPAPI device enumeration and registration APIs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: setupdi-get-class-devs-w
    desc: Enumerate device classes via SetupAPI wide API
    if:
      type: symbol
      exact: SetupDiGetClassDevsW
  - id: cm-locate-devnode-w
    desc: Locate hardware device node
    if:
      type: symbol
      exact: CM_Locate_DevNodeW
  - id: hid-manufacturer-string
    desc: Read HID manufacturer identifier
    if:
      type: symbol
      exact: HidD_GetManufacturerString
  - id: setupdi-get-class-devs
    desc: Enumerate device classes via SetupAPI
    if:
      type: symbol
      exact: SetupDiGetClassDevsA
  - id: setupdi-enum-device-interfaces
    desc: Enumerate device interfaces via SetupAPI
    if:
      type: symbol
      exact: SetupDiEnumDeviceInterfaces
  - id: setupdi-get-device-interface-detail
    desc: Get device interface detail via SetupAPI
    if:
      type: symbol
      regex: '^SetupDiGetDeviceInterfaceDetail(A|W)$'
  - id: setupdi-get-device-registry-property
    desc: Query device registry property via SetupAPI
    if:
      type: symbol
      regex: '^SetupDiGetDeviceRegistryProperty(A|W)$'
  - id: setupdi-open-device-registry-key
    desc: Open a device registry key via SetupAPI
    if:
      type: symbol
      exact: SetupDiOpenDevRegKey
  - id: setupdi-create-device-info
    desc: Creates a Windows device information set
    crit: notable
    conf: 0.92
    for: [python, c, cpp, csharp, rust, go, pe, dll]
    if:
      type: symbol
      regex: '^SetupDiCreateDeviceInfo(List)?[AW]?$'
  - id: setupdi-set-hardware-id
    desc: Sets a device hardware or compatible ID
    crit: notable
    conf: 0.94
    for: [python, c, cpp, csharp, rust, go, pe, dll]
    if:
      type: symbol
      regex: '^SetupDiSetDeviceRegistryProperty[AW]?$'
  - id: pnp-register-device
    desc: Registers a synthetic PnP device
    crit: notable
    conf: 0.95
    for: [python, c, cpp, csharp, rust, go, pe, dll]
    if:
      type: text
      regex: '(?i)\b(DIF_REGISTERDEVICE|DIF_REGISTER_DEVICE)\b'
  - id: cm-setup-devnode-call
    desc: Calls Configuration Manager device setup
    crit: notable
    conf: 0.94
    for: [python, c, cpp, csharp, rust, go, pe, dll]
    if:
      type: symbol
      exact: CM_Setup_DevNode
  - id: cm-setup-devnode-ready-flag
    desc: Requests a device node become ready
    crit: notable
    conf: 0.94
    for: [python, c, cpp, csharp, rust, go, pe, dll]
    if:
      type: text
      substr: CM_SETUP_DEVNODE_READY
  - id: pnp-driver-install-call
    desc: Installs a driver through SetupAPI
    crit: notable
    conf: 0.92
    for: [python, c, cpp, csharp, rust, go, pe, dll]
    if:
      type: symbol
      exact: DiInstallDevice
composite_rules:
  - id: setupapi-device-enumeration
    desc: SETUPAPI hardware device enumeration cluster
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: setupdi-get-class-devs
      - id: setupdi-enum-device-interfaces
      - id: setupdi-get-device-interface-detail
      - id: setupdi-get-device-registry-property
  - id: pnp-ready-install-trigger
    desc: Activates the Windows driver-install path
    crit: notable
    conf: 0.96
    for: [python, c, cpp, csharp, rust, go, pe, dll]
    all:
      - id: cm-setup-devnode-call
      - id: cm-setup-devnode-ready-flag
    near_bytes: 512
  - id: pnp-device-install-flow
    desc: Explicit Windows PnP device-install flow
    crit: notable
    conf: 0.97
    for: [python, c, cpp, csharp, rust, go, pe, dll]
    all:
      - id: setupdi-create-device-info
      - id: setupdi-set-hardware-id
      - id: pnp-register-device
    any:
      - id: pnp-ready-install-trigger
      - id: pnp-driver-install-call
