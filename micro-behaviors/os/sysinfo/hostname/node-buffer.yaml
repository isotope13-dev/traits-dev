defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: node-hostname-buffer
    desc: Copies the hostname into a buffer
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      arg:
        index: 0
        from:
          call: '(^|\.)hostname$'

  - id: node-hostname-buffer-sliced
    desc: Copies a sliced hostname into a buffer
    if:
      type: symbol
      kind: call
      exact: Buffer.from
      arg:
        index: 0
        from:
          call: '\.(slice|substring)$'
          through:
            - call: '(^|\.)hostname$'
              receiver: true
