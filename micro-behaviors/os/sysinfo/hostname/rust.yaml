# Hostname discovery - Rust
#
# Rust reaches the machine name by shelling out to the `hostname` utility
# through std::process::Command.  Neutral capability: build scripts, logging
# setups, and cluster tooling all do it.  Recon/exfil intent comes from the
# objective composites that pair it with a report destination.
#
# Matched as text, not as a call symbol: the Rust walker records no target
# name for `Command::new(...)`, so `type: symbol, kind: call` never fires.
defaults:
  platforms: [unix, windows]
  for: [rust]
  mbc: E1082
  attack: T1082
traits:
  - id: rust-command-hostname
    desc: Rust runs the hostname command
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Command::new("hostname")'
