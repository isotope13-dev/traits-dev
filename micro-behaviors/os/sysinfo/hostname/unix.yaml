defaults:
  for: [scripts, binaries]
  crit: baseline
  mbc: E1082
  attack: T1082
  platforms:
    - unix
    - windows
traits:
  - id: gethostname
    desc: Get hostname of current machine
    for:
      - elf
      - macho
      - c
      - cpp
      - objc
    conf: 0.5
    if:
      type: symbol
      regex: gethostname
  - id: python-socket-gethostname
    desc: Calls Python socket.gethostname
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      exact: socket.gethostname
  - id: python-bytecode-gethostname-name
    desc: Python bytecode gethostname name
    crit: notable
    conf: 0.92
    for: [pyc]
    if:
      type: text
      word: gethostname
  - id: python-host-name-mapping-call
    desc: Python host-name mapping calls gethostname
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '["'']host_name["'']\s*:\s*(lambda[^:\n]{0,80}:\s*)?socket\.gethostname\s*\('
  - id: getdomainname
    desc: Get NIS domain name
    for:
      - elf
      - macho
    conf: 0.5
    platforms:
      - linux
      - macos
    if:
      type: symbol
      regex: getdomainname
  - id: getfqdn
    desc: Get fully qualified domain name
    conf: 0.5
    platforms:
      - linux
      - macos
    if:
      type: text
      substr: getfqdn
