defaults:
  for: [scripts, binaries]
  crit: baseline
  mbc: E1082
  attack: T1082
  platforms:
    - unix
    - windows
traits:
  - id: gethostname
    desc: Get hostname of current machine
    for:
      - elf
      - macho
      - c
      - cpp
      - objc
    conf: 0.5
    if:
      type: symbol
      regex: gethostname
  - id: python-socket-gethostname
    desc: Calls Python socket.gethostname
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)gethostname$'
  # The other way Python asks the same question. `os.uname()` returns the
  # POSIX utsname struct and `.nodename` is its hostname field, so this is
  # `socket.gethostname()` by a different route -- no import of `socket`
  # required, which is presumably the appeal.
  - id: python-os-uname-nodename
    desc: Reads hostname via os.uname nodename
    crit: notable
    conf: 0.95
    for: [python]
    # `[1]` as well as `.nodename`: utsname is a named tuple, so the hostname
    # field is reachable either way and the indexed form is the one that turns
    # up in code trying to stay short.
    if:
      type: text
      regex: '\bos\.uname\s*\(\s*\)\s*(\.\s*nodename\b|\[\s*1\s*\])'

  - id: python-bytecode-gethostname-name
    desc: Python bytecode gethostname name
    crit: notable
    conf: 0.92
    for: [pyc]
    if:
      type: text
      word: gethostname
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: gethostname
  - id: python-host-name-mapping-call
    desc: Python host-name mapping calls gethostname
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '["'']host_name["'']\s*:\s*(lambda[^:\n]{0,80}:\s*)?socket\.gethostname\s*\('
  - id: getdomainname
    desc: Get NIS domain name
    for:
      - elf
      - macho
    conf: 0.5
    platforms:
      - linux
      - macos
    if:
      type: symbol
      regex: getdomainname
  - id: getfqdn
    desc: Get fully qualified domain name
    conf: 0.5
    platforms:
      - linux
      - macos
    if:
      type: text
      substr: getfqdn

  - id: python-hostname-domain-literal-compare
    desc: Conditional compares hostname to domain literal
    for: [python]
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      kind: conditional
      # The bare `hostname ==` form matched every cluster manager comparing
      # node names; require the other side to be a domain-name literal.
      regex: '(?i)\b(fqdn|hostname)[^"''\n]{0,24}["''][\w.-]*\.(com|net|org|local|corp|lan)["'']'

  - id: python-domain-literal-hostname-compare
    desc: Conditional compares domain literal to hostname
    for: [python]
    crit: component
    conf: 0.93
    if:
      type: tree-sitter
      kind: conditional
      regex: '(?i)["''][\w.-]*\.(com|net|org|local|corp|lan)["'']\s*(in|==|!=)\s*[\w.]*(fqdn|hostname)\b'

  - id: python-hostname-lookup-in-conditional
    desc: Conditional calls a hostname lookup
    for: [python]
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: conditional
      regex: '(?s)(gethostname\s*\(|platform\.node\s*\(|["'']HOSTNAME["''])'
