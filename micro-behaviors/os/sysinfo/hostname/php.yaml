defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: E1082
  attack: T1082

traits:
  - id: php-gethostname-call
    desc: Gets current host name in PHP
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: gethostname
  - id: php-uname-hostname-call
    desc: Reads the host name via php_uname('n')
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: php_uname
      arg:
        kind: string
        exact: n
  # md5(__DIR__ . php_uname('n') . ...): a digest keyed on the host name is a
  # stable per-machine identifier (a victim id, a run-once marker name).
  - id: php-hostname-digest
    desc: Hashes host name into a machine id
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(md5|sha1|hash)\s*\([^;\n]{0,120}(php_uname\s*\(\s*[''"]n[''"]|gethostname\s*\(\s*\))'
