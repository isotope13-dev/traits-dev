defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]
  mbc: E1082
  attack: T1082

traits:
  - id: php-hostname-digest
    desc: Hashes host name into a machine id
    conf: 0.9
    if:
      type: text
      regex: '(md5|sha1|hash)\s*\([^;\n]{0,120}(php_uname\s*\(\s*[''"]n[''"]|gethostname\s*\(\s*\))'
