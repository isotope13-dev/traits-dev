defaults:
  platforms: [unix, windows]
  for: [csharp, java, kotlin, elixir, ruby, swift, zig]
  crit: notable
  conf: 0.9
traits:
  - id: source-hostname-helper-call
    desc: Source calls a hostname-query helper
    if:
      type: text
      regex: '(?i)\b(gethostname|GetHostName|Socket[.]gethostname|os[.]hostname)\s*[(]'
