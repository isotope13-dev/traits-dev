# Hostname Identification
# Composite rules for hostname and domain identification
defaults:
  platforms: [unix, windows]
composite_rules:
  - id: host-identity-query
    desc: Queries a host identity value
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
      - id: micro-behaviors/os/sysinfo/hostname::gethostname
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/os/sysinfo/hostname::python-os-uname-nodename
      - id: micro-behaviors/os/sysinfo/hostname::ruby-socket-gethostname
      - id: micro-behaviors/os/sysinfo/hostname::dotnet-machine-name-read
      - id: micro-behaviors/os/sysinfo/hostname::powershell-computer-name-read
      - id: micro-behaviors/os/sysinfo/hostname::powershell-computer-system-query
      - id: micro-behaviors/os/sysinfo/hostname::powershell-environment-machine-name
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname
      - id: micro-behaviors/os/sysinfo/hostname::node-os-alias-hostname-call
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/sysinfo/hostname::php-gethostname-call
      - id: micro-behaviors/os/sysinfo/hostname::hostname-cmd
      - id: micro-behaviors/os/sysinfo/hostname::sh-hostname-command

  - id: hostname-identification
    desc: Identifies local hostname through multiple signals
    crit: notable
    conf: 0.7
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/hostname::gethostname
      - id: micro-behaviors/os/sysinfo/machine-id::etc-hostname
      - id: micro-behaviors/os/env/vars/system-info::hostname-var
      - id: micro-behaviors/os/sysinfo/hostname::getfqdn
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
