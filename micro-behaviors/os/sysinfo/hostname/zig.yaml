defaults:
  platforms: [unix, windows]
  for: [zig]
  mbc: E1082
  attack: T1082

traits:
  - id: zig-gethostname-reference
    desc: Zig source references gethostname
    crit: notable
    conf: 0.86
    if:
      type: text
      word: gethostname
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: gethostname
