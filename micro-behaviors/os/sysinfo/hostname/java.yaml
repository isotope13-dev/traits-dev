defaults:
  platforms: [unix]
  for: [class, jar, zip]
  attack: T1082
  mbc: E1082

traits:
  - id: jvm-local-host-name
    desc: JVM queries local host name
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: java/net/InetAddress.getHostName

  # A string constant alone is not proof that a process runs the command;
  # objective rules combine this neutral literal with ProcessBuilder and
  # network reporting evidence.
  - id: jvm-hostname-command-literal
    desc: JVM hostname command literal
    crit: component
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      exact: hostname

  - id: java-local-host-name-source
    desc: Java queries the local host name
    crit: notable
    conf: 0.96
    for: [java]
    platforms: [unix, windows]
    if:
      type: text
      substr: InetAddress.getLocalHost().getHostName()
