defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  attack: T1082
traits:
  - id: node-shell-hostname-command
    desc: Node passes hostname to a shell helper
    crit: notable
    conf: 0.9
    # Match exec/spawn receivers that take a literal "hostname" argument even
    # when further callback args follow (exec('hostname', cb)). Keep the same
    # receiver family as whoami-exec-argument to avoid cross-file alt-subset
    # validation failures.
    if:
      type: symbol
      kind: call
      regex: '^(system|popen|exec|run)\w*$'
      arg:
        kind: string
        exact: hostname

  - id: node-os-alias-hostname-call
    desc: Node os-alias hostname query
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.hostname$'
  - id: os-hostname-call
    desc: os.hostname() call
    conf: 0.75
    if:
      type: symbol
      exact: os.hostname
  - id: os-bracket-split-hostname-access
    desc: os hostname accessed via split bracket property
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'os\["host"\s*\+\s*"name"\]\s*\('
  - id: npm-postinstall-os-hostname-call
    desc: npm postinstall queries OS hostname
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: "require\\(['\"]os['\"]\\)[\\s\\S]{0,240}\\.hostname\\s*\\(\\s*\\)"
