defaults:
  platforms: [windows, unix]
  for: [csharp, xml]
  attack: T1082
traits:
  - id: dotnet-machine-name-read
    desc: Reads .NET local machine name
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(Environment\.MachineName|\[System\.Environment\]::MachineName)'
  # MSBuild resolves $(COMPUTERNAME) from the environment, so a .targets file
  # naming it is a build-script host-identity reference -- the build-time twin
  # of the PowerShell COMPUTERNAME reads in windows.yaml. Beacons embed it in
  # callback URLs; by itself it is only a reference, not a read.
  - id: msbuild-computername-property
    desc: MSBuild references COMPUTERNAME property
    crit: notable
    conf: 0.9
    for: [xml]
    if:
      type: text
      regex: '(\$\(COMPUTERNAME\)|%COMPUTERNAME%)'
  - id: getmachinename-method-name
    desc: GetMachineName method name in PE code
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      section: text
      word: GetMachineName
  - id: getdnsdomainname-method-name
    desc: GetDnsDomainName method name in PE code
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      section: text
      word: GetDnsDomainName
