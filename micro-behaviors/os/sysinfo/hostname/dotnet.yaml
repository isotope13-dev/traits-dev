defaults:
  platforms: [windows, unix]
  for: [csharp, xml]
  attack: T1082
traits:
  - id: dotnet-machine-name-read
    desc: Reads .NET local machine name
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(Environment\.MachineName|\[System\.Environment\]::MachineName)'
  - id: getmachinename-method-name
    desc: GetMachineName method name in PE code
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      section: text
      word: GetMachineName
  - id: getdnsdomainname-method-name
    desc: GetDnsDomainName method name in PE code
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      section: text
      word: GetDnsDomainName
