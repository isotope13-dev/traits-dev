# Classic ASP / VBScript reads the machine name as a property on a WScript
# Network or WMI object. The provider varies, the fact read does not.
defaults:
  for: [vbs]
  platforms: [windows]

traits:
  - id: vbscript-computername-property
    desc: Reads a ComputerName property in VBScript
    crit: notable
    conf: 0.85
    attack: T1082
    if:
      type: text
      regex: '(?i)\.ComputerName\b'
