# Decoded shell fragments retain text but do not always receive call facts.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: shell-hostname-command-text
    desc: Hostname command at a shell command boundary
    if:
      type: text
      regex: '(^|[;&|]\s*)hostname(\s|[;&|]|$)'
