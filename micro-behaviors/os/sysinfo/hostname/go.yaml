defaults:
  platforms: [windows, linux, macos]
  mbc: E1082
  attack: T1082
traits:
- id: os-hostname
  desc: os.Hostname() call
  crit: notable
  conf: 0.7
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: os.Hostname
- id: hostname-string-raw
  desc: Go binary contains hostname-related symbols
  crit: baseline
  conf: 0.65
  for: [go, elf, macho, pe]
  if:
    type: text
    word: Hostname
- id: user-current
  desc: user.Current() call
  crit: notable
  conf: 0.7
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: user.Current
- id: os-getpid
  desc: os.Getpid() call
  crit: baseline
  conf: 0.5
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: os.Getpid
composite_rules:
- id: host-and-user-identity-query
  desc: Host and user identity collection
  crit: notable
  conf: 0.85
  for:
  - go
  all:
  - id: os-hostname
  - id: user-current
- id: hostname-string
  desc: Hostname queried in Go source
    # Baseline: the `Hostname` word alone is transitively linked by most
    # stdlib paths (os/user, net/http, os/signal), so its string appearing
    # in gopclntab is the norm for any non-trivial Go program — not a
    # behavior claim. Require the os.Hostname() call so the composite only
    # fires when the program actually queries the hostname.
  crit: baseline
  conf: 0.65
  for: [go]
  all:
  - id: hostname-string-raw
  - id: os-hostname
