defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

traits:
- id: package-hostname-substitution
  desc: Package text uses hostname substitution
  crit: notable
  conf: 0.93
  attack: T1082
  for: [package.json]
  unless:
    - id: metadata/package/scripts/lifecycle::preinstall-echo-script
    - id: metadata/build/recognized-contexts::script-hostname-local-service-url
  if:
    type: text
    substr: $(hostname)

  # === Install hook curl (non-pre/post) ===
