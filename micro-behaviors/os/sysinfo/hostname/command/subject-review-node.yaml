defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  attack: T1082
traits:
  - id: js-shell-hostname-substitution
    desc: JS-embedded shell queries hostname
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "$(hostname)"
  - id: node-shell-hostname-command
    desc: Node passes hostname to a shell helper
    crit: notable
    conf: 0.9
    # Match exec/spawn receivers that take a literal "hostname" argument even
    # when further callback args follow (exec('hostname', cb)). Keep the same
    # receiver family as whoami-exec-argument to avoid cross-file alt-subset
    # validation failures.
    if:
      type: symbol
      kind: call
      regex: '^(system|popen|exec|run)\w*$'
      arg:
        kind: string
        exact: hostname

