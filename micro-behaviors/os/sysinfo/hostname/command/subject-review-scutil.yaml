defaults:
  platforms: [macos]
  for: [shell]
  crit: notable
  conf: 0.99
traits:
  - id: shell-scutil-computer-name
    desc: Shell queries macOS computer name
    unless:
      - type: function
        exact: scutil
    if:
      type: symbol
      kind: call
      regex: '^(/usr/sbin/)?scutil$'
      args:
        - index: 0
          kind: identifier
          name: --get
        - index: 1
          kind: identifier
          name: ComputerName
