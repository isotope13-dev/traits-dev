defaults:
  platforms: [windows, unix, appliance]
  for: [lua]

traits:
  - id: lua-host-info-hostname-field
    desc: Lua accesses hostname in host information
    crit: notable
    if:
      type: text
      regex: '\bhost_info\s*\[\s*["'']hostname["'']\s*\]'

composite_rules:
  - id: lua-hostname-data-reference
    desc: Lua hostname lookup or request-field expression
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/os/sysinfo/hostname/query::lua-hostname-lookup-assignment
      - id: micro-behaviors/communications/http/request/parameter::lua-hostname-request-field
      - id: lua-host-info-hostname-field
