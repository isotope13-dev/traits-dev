defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: preinstall-node-os-hostname
  desc: Preinstall queries Node hostname
  crit: notable
  conf: 0.94
  if:
    type: value
    path: "scripts.preinstall"
    # Also recognize the common `const os = require('os')` form. Requiring
    # the module reference keeps this scoped to an OS hostname query.
    regex: "require\\([\"']os[\"']\\)(\\.hostname\\(|.{0,300}\\b\\w+\\.hostname\\()"
