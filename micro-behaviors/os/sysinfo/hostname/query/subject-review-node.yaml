defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  attack: T1082
traits:
  - id: node-os-alias-hostname-call
    desc: Calls a hostname method
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.hostname$'
  - id: node-inline-os-hostname-call
    desc: Node inline os import queries the hostname
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'require\s*\(\s*["''](node:)?os["'']\s*\)\.hostname\s*\('
  - id: os-hostname-call
    desc: os.hostname() call
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: os.hostname
  # `os.hostname` named without being invoked — passed as a callback, stored in
  # a table of collectors, destructured for later use. The call-shaped atom above
  # anchors on the invocation, so a recon routine that defers it
  # (`safeGet(os.hostname)`) reads the same value and matches nothing.
  #
  # Component: a bare member reference is weaker evidence than a call, and
  # deferring it is a normal way to write a collector. It exists so the
  # directory answers "this code reaches for the hostname" whichever shape is
  # used, which is what composites referencing the directory actually mean.
  - id: os-bracket-split-hostname-access
    desc: os hostname accessed via split bracket property
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'os\["host"\s*\+\s*"name"\]\s*\('
  - id: npm-postinstall-os-hostname-call
    desc: npm postinstall queries OS hostname
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: "require\\(['\"]os['\"]\\)[\\s\\S]{0,240}\\.hostname\\s*\\(\\s*\\)"
