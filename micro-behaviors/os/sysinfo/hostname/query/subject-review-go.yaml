defaults:
  platforms: [windows, linux, macos]
  mbc: E1082
  attack: T1082
  for:
    - go
traits:
  - id: os-hostname
    desc: os.Hostname() call
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: os.Hostname
composite_rules:
  - id: host-and-user-identity-query
    desc: Host and user identity collection
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname
      - id: micro-behaviors/os/user/lookup::go-current-user
  - id: hostname-string
    desc: Hostname queried in Go source
    # Baseline: the `Hostname` word alone is transitively linked by most
    # stdlib paths (os/user, net/http, os/signal), so its string appearing
    # in gopclntab is the norm for any non-trivial Go program — not a
    # behavior claim. Require the os.Hostname() call so the composite only
    # fires when the program actually queries the hostname.
    crit: baseline
    conf: 0.65
    all:
      - id: micro-behaviors/os/sysinfo/hostname/reference::hostname-string-raw
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname
