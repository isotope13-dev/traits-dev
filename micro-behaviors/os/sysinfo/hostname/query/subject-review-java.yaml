defaults:
  crit: notable
  platforms: [unix]
  for: [class, jar, zip]
  attack: T1082
  mbc: E1082

traits:
  - id: jvm-local-host-name
    desc: JVM queries local host name
    conf: 0.94
    for: [class]
    if:
      type: import
      exact: java/net/InetAddress.getHostName

  # A string constant alone is not proof that a process runs the command;
  # objective rules combine this neutral literal with ProcessBuilder and
  # network reporting evidence.
  # The bare word: a JSON key, an SNI field or the `hostname` binary alike.
  - id: java-local-host-name-source
    desc: JVM source queries the local host name
    conf: 0.96
    for: [java, kotlin]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?i)(java[.]net[.])?InetAddress[.]getLocalHost\(\)([.]getHostName\(\)|[.]hostName)'
