defaults:
  crit: notable
  platforms: [unix, windows]
composite_rules:
  - id: host-identity-query
    desc: Queries a host identity value
    conf: 0.86
    any:
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
      - id: micro-behaviors/os/sysinfo/hostname/query::gethostname
      - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
      - id: micro-behaviors/os/sysinfo/hostname/query::python-os-uname-nodename
      - id: micro-behaviors/os/sysinfo/hostname/query::ruby-socket-gethostname
      - id: micro-behaviors/os/sysinfo/hostname/query::dotnet-machine-name-read
      - id: micro-behaviors/os/sysinfo/hostname/query::powershell-computer-name-read
      - id: micro-behaviors/os/sysinfo/hostname/query::powershell-computer-system-query
      - id: micro-behaviors/os/sysinfo/hostname/query::powershell-environment-machine-name
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname
      - id: micro-behaviors/os/sysinfo/hostname/query::node-os-alias-hostname-call
      - id: micro-behaviors/os/sysinfo/hostname/query::node-inline-os-hostname-call
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/os/sysinfo/hostname/query::php-gethostname-call
      - id: micro-behaviors/os/sysinfo/hostname/command::hostname-cmd
      - id: micro-behaviors/os/sysinfo/hostname/command::sh-hostname-command

  - id: hostname-identification
    desc: Identifies local hostname through multiple signals
    conf: 0.7
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/hostname/query::gethostname
      - id: micro-behaviors/os/sysinfo/machine-id::etc-hostname
      - id: micro-behaviors/os/env/system-info::hostname-var
      - id: micro-behaviors/os/sysinfo/hostname/query::getfqdn
    downgrade:
      any:
        - id: micro-behaviors/fs/path/application/interpreter::system-shell-basename
