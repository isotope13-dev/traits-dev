defaults:
  platforms: [windows, unix]
  for: [perl]
  attack: T1082

traits:
  - id: perl-hostname-call
    desc: Perl queries the local hostname
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(Sys::Hostname::)?hostname$'

  - id: perl-win32-node
    desc: Perl Win32 host name query
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: Win32::Node()
