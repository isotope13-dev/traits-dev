defaults:
  platforms: [windows, unix]
  for: [perl]
  attack: T1082

traits:
  # A hostname allowlist may be ordinary deployment targeting. Describe the
  # conditional return without inferring a sandbox or a malicious objective.
  - id: perl-hostname-regex-return-gate
    desc: Perl returns unless hostname matches regex
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'return\b[^\n;]{0,24}\bunless\s*\(hostname\(\)[^\n;]{0,32}=~\s*/'
      exclude_comments: true

  - id: perl-hostname-call
    desc: Perl queries the local hostname
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(Sys::Hostname::)?hostname$'

  - id: perl-win32-node
    desc: Perl Win32 host name query
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: Win32::Node()
