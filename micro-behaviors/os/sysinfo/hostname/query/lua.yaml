defaults:
  platforms: [windows, unix, appliance]
  for: [lua]

traits:
  - id: lua-hostname-lookup-assignment
    desc: Lua assigns a hostname lookup result
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bhostname\s*=\s*(socket\.dns\.gethostname|os\.getenv\s*\(\s*["'']HOSTNAME)'
