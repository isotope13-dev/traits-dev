defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-hostname-read
    desc: Script queries the machine hostname
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/os/sysinfo/hostname/query::node-inline-os-hostname-call
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/os/sysinfo/hostname/query::node-os-alias-hostname-call
