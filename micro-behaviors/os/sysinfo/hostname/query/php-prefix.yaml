defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-hostname-prefix-test
    desc: PHP tests local hostname prefix
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: str_starts_with
      arg:
        index: 0
        from:
          call: '^gethostname$'
