defaults:
  crit: notable
  platforms: [unix]
  for: [class, jar, zip]
  attack: T1082
  mbc: E1082

traits:
  - id: jvm-hostname-command-literal
    for: [class]
    desc: Class holds the bare string "hostname"
    crit: component
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      exact: hostname

