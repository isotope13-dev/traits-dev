defaults:
  for: [scripts, binaries]
  crit: baseline
  mbc: E1082
  attack: T1082
  platforms:
    - unix
    - windows
traits:
  - id: python-domain-literal-hostname-compare
    desc: Conditional compares domain literal to hostname
    for: [python]
    crit: component
    conf: 0.93
    if:
      type: tree-sitter
      kind: conditional
      regex: '(?i)["''][\w.-]*\.(com|net|org|local|corp|lan)["'']\s*(in|==|!=)\s*[\w.]*(fqdn|hostname)\b'

