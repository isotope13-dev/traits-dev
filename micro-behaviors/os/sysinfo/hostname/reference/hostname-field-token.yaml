defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: component
  conf: 0.95

traits:
  - id: hostname-field-token
    # One generic field name is useful only as evidence in a stronger
    # context-bearing composite.
    crit: component
    desc: Contains a hostname field token
    conf: 0.4
    for: [scripts, text]
    if:
      type: text
      word: hostname
      # Prose in a source comment names no field.
      exclude_comments: true
