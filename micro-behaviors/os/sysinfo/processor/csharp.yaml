# .NET anti-analysis gates that compare Environment.ProcessorCount to a
# small constant — common in sandbox/VM evasion before credential theft.
defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
  conf: 0.92
  attack: T1497.001

traits:
  - id: dotnet-processor-count-threshold
    desc: .NET compares Environment.ProcessorCount
    if:
      type: text
      regex: 'Environment\.ProcessorCount\s*<\s*[234]\b'
