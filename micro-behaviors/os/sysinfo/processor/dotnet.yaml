# Compiled .NET assemblies import Environment.get_ProcessorCount when
# querying logical CPU count; source rules live in csharp.yaml.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.92
  attack: T1082

traits:
  - id: dotnet-processor-count-import
    desc: .NET processor count import
    if:
      type: import
      exact: System.Environment.get_ProcessorCount
