# RDPMC returns a processor performance-monitoring counter, not elapsed time
# and not an MSR. Require 64-bit reconstruction and a store to an output buffer.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.96

traits:
  - id: x64-pmc-read-to-buffer
    desc: Reads processor performance counter into buffer
    if:
      type: hex
      section: .text
      pattern: '0F 33 48 C1 E2 20 48 0B C2 49 89 00'
