# Node's process/host resource readings.
#
# Relocated from objectives/discovery/system/fingerprint/runtime/. `os.totalmem`
# is one Node API call, and RULES.md is explicit that a single API call is never
# an objective: loggers, health checks, cache sizers and worker-pool planners all
# read total memory, and Cherry Studio's LoggerService matched on exactly that.
# The fingerprinting composites in objectives/discovery/system/fingerprint/
# reference this and add the rest of the host profile.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-os-totalmem
    desc: Reads total system memory
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: os.totalmem
    unless:
      # Application Insights Performance/HeartBeat collectors call os.totalmem
      # for telemetry, not host fingerprinting for malware.
      - type: path
        regex: '(?i)(^|[\\/])applicationinsights([\\/]|$)'
      - type: text
        substr: applicationinsights
