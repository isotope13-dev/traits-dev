defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: node-process-memory-usage
    desc: Reads Node.js process memory usage
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: process.memoryUsage
  - id: htop-tool
    desc: htop process monitor
    crit: notable
    conf: 0.9
    for: [shell, python, pe, elf, macho]
    if:
      type: text
      word: htop
  - id: atop-tool
    desc: atop process monitor
    crit: notable
    conf: 0.9
    for: [shell, python, pe, elf, macho]
    if:
      type: text
      word: atop
  - id: iotop-tool
    desc: iotop process monitor
    crit: notable
    conf: 0.9
    for: [shell, python, elf]
    if:
      # Raw bytes, not extracted words: NUL-padded single tokens are
      # utility-inventory entries (malware tool-name tables list iotop
      # alongside htop, vmstat, pidstat without invoking any of them),
      # not tool use. A genuine reference has a non-NUL token boundary
      # (whitespace, slash, quote, flag dash, newline) on at least one side.
      type: raw
      regex: '(?i)(^|[^\w\x00])iotop($|[^\w\x00])'
  - id: iftop-tool
    desc: iftop process monitor
    crit: notable
    conf: 0.9
    for: [shell, python, pe, elf, macho]
    if:
      type: text
      word: iftop
  - id: stat-tools
    desc: "System statistics tools"
    crit: baseline
    conf: 0.9
    if:
      type: text
      # sar requires a flag/interval argument: bare "sar" collides with the
      # word (e.g. "sar" = Synthetic Aperture Radar) far too often.
      # Require a non-dot prefix so LS_COLORS ".sar 01;31" does not match.
      regex: '\b(vmstat|iostat|mpstat)\b|(^|[^.\w])sar\s+[-\d]'
  - id: lsmem
    desc: Memory information tool
    crit: notable
    conf: 0.9
    if:
      type: text
      word: lsmem
  - id: pdh-open-query
    desc: Open Windows performance query
    for: [pe, dll]
    platforms: [windows]
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: PdhOpenQueryA
  - id: pdh-add-english-counter
    desc: Add Windows performance counter
    for: [pe, dll]
    platforms: [windows]
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: PdhAddEnglishCounterW
  - id: pdh-get-formatted-counter-value
    desc: Read formatted performance counter
    for: [pe, dll]
    platforms: [windows]
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: PdhGetFormattedCounterValue
composite_rules:
  - id: htop-atop
    desc: Interactive process monitors (htop/atop)
    crit: baseline
    conf: 0.9
    any:
      - id: htop-tool
      - id: atop-tool
      - id: iotop-tool
      - id: iftop-tool
  - id: pdh-performance-counters
    desc: Monitor Windows performance counters
    for: [pe, dll]
    platforms: [windows]
    crit: notable
    conf: 0.94
    all:
      - id: pdh-open-query
      - id: pdh-add-english-counter
      - id: pdh-get-formatted-counter-value
