defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: windows-resource-query-encoded-helper
    desc: PowerShell Windows resource query helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Get-CimInstance\s+Win32_OperatingSystem[\s\S]{0,300}TotalVisibleMemorySize'

