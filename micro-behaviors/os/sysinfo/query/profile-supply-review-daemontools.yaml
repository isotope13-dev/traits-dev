defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: host-recon-method-name-cluster
    desc: Host reconnaissance method-name cluster
    crit: suspicious
    conf: 0.97
    needs: 3
    any:
      - id: micro-behaviors/network/interface/query::getfirstnonzeromac-method
      - id: micro-behaviors/network/interface/identity::formatmac-method
      - id: micro-behaviors/os/sysinfo/query::collectinstalledsoftware-method
      - id: micro-behaviors/os/registry/software/reference::readuninstallkeys-method
      - id: micro-behaviors/process/enumerate/managed::collectprocessnames-method
      - id: micro-behaviors/communications/http/user-agent::tryurlmonua-method
      - id: micro-behaviors/communications/http/user-agent::tryregistryua-method
      - id: micro-behaviors/communications/http/user-agent::getsystemdefaultua-method
      - id: micro-behaviors/os/sysinfo/platform/locale::getsystemlanguage-method
      - id: micro-behaviors/os/sysinfo/hostname/reference::getmachinename-method-name
      - id: micro-behaviors/os/sysinfo/hostname/reference::getdnsdomainname-method-name
      - id: micro-behaviors/crypto/key/import::rc4-key-from-url
  - id: dotnet-network-useragent-references
    desc: Managed network and User-Agent references
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/network/interface/query::get-adapters-info-text
      - id: metadata/lang/compiler/managed::dotnet-assembly
    any:
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-user-agent-option
      - id: micro-behaviors/communications/http/client/urlmon::urlmk-get-session-option
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-dll-reference
