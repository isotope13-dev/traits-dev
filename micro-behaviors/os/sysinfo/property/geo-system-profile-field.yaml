# Neutral telemetry vocabulary. These field names and context words describe
# payload schemas; collection or exfiltration intent requires a higher-level
# objective that combines them with an actual source and transport.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component

composite_rules:
  - id: geo-system-profile-field
    desc: Geographic or system profile field name
    crit: component
    conf: 0.95
    any:
      - id: metadata/lang/source/naming/geography::country-profile-field
      - id: micro-behaviors/os/sysinfo/geolocation::geolocation-profile-field
      - id: metadata/lang/source/naming/record::region-profile-field
      - id: micro-behaviors/os/sysinfo/platform/string::os-profile-field
      - id: micro-behaviors/os/sysinfo/platform/string::platform-profile-field
