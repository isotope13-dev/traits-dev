defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1082

traits:
  - id: navigator-hardware-concurrency-read
    desc: Reads browser logical processor count
    if:
      type: symbol
      kind: member
      exact: navigator.hardwareConcurrency

  - id: navigator-device-memory-read
    desc: Reads browser-reported device memory
    if:
      type: symbol
      kind: member
      exact: navigator.deviceMemory

  - id: navigator-max-touch-points-read
    desc: Reads browser touch-point capacity
    if:
      type: symbol
      kind: member
      exact: navigator.maxTouchPoints

  # Touch-capability and narrow-viewport tests are ordinary responsive-UI
  # checks. Composites that run a stage only on such devices use them as the
  # gate that keeps desktop analysts and crawlers from seeing it.
  - id: browser-touch-event-support-test
    desc: Tests for touch event support
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '["'']ontouchstart["'']\s+in\s+(window|document)'

  - id: browser-coarse-or-narrow-media-test
    desc: Tests for coarse pointer or narrow viewport
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'matchMedia\(\s*["'']\(\s*(pointer:\s*coarse|max-width)'

composite_rules:
  - id: mobile-device-probe
    desc: Probes for a mobile or touch device
    crit: component
    for: [javascript, typescript, html]
    any:
      - id: navigator-max-touch-points-read
      - id: browser-touch-event-support-test
      - id: browser-coarse-or-narrow-media-test
      - id: micro-behaviors/communications/http/user-agent::mobile-device-regex-alternation
