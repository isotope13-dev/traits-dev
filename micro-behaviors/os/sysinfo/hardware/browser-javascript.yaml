defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1082

traits:
  - id: navigator-hardware-concurrency-read
    desc: Reads browser logical processor count
    if:
      type: symbol
      kind: member
      exact: navigator.hardwareConcurrency

  - id: navigator-device-memory-read
    desc: Reads browser-reported device memory
    if:
      type: symbol
      kind: member
      exact: navigator.deviceMemory

  - id: navigator-max-touch-points-read
    desc: Reads browser touch-point capacity
    if:
      type: symbol
      kind: member
      exact: navigator.maxTouchPoints
