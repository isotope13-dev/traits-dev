defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-memory-status-gib-threshold-branch
    desc: Branches on memory-status GiB threshold
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      # MEMORYSTATUSEX size=64; address passed to the query; total RAM at
      # struct+8 converted to GiB before a conditional threshold branch.
      pattern: 'C7 85 ?? ?? ?? ?? 40 00 00 00 48 8D 8D ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 48 8B 85 ?? ?? ?? ?? 48 C1 E8 1E 48 FF C0 48 83 F8 ?? 77 ??'
