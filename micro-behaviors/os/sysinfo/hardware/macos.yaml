defaults:
  conf: 0.9
  platforms: [macos]
  for: [python, scripts, binaries]
  crit: notable
  attack: T1082
  mbc: E1082

traits:
  - id: sysctl-hw-model-key
    desc: macOS hardware-model sysctl key
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '\bhw\.model\b'

  - id: system-profiler-display
    desc: macOS display hardware query
    if:
      type: text
      regex: 'system_profiler\s+SPDisplaysDataType'
  - id: system-profiler-hardware
    desc: macOS hardware information query
    for: [javascript, typescript, python, scripts, binaries]
    if:
      type: text
      regex: 'system_profiler\s+SPHardwareDataType'
  - id: system-profiler-memory
    desc: macOS memory information query
    for: [javascript, typescript, python, scripts, binaries]
    if:
      type: text
      regex: 'system_profiler\s+SPMemoryDataType'
