# Source-level Windows hardware queries. The APIs are capabilities; a
# stealer-specific worker-pool composite supplies the intent.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, python]
  attack: T1082

traits:
  - id: get-system-info-source
    desc: Calls Windows GetSystemInfo from source
    if:
      type: symbol
      kind: call
      exact: GetSystemInfo

  - id: global-memory-status-source
    desc: Source queries Windows available physical memory
    if:
      type: symbol
      kind: call
      exact: GlobalMemoryStatusEx
