defaults:
  for:
    - pe
    - dll
    - c
    - cpp
  platforms:
    - windows
  attack: T1082
traits:
  - id: rsmb-firmware-provider-probe-x64
    desc: x64 raw SMBIOS firmware query
    crit: notable
    conf: 0.98
    arch: [x86-64]
    if:
      type: hex
      offset_range: [0, 524288]
      pattern: 'B9 42 4D 53 52 31 D2 45 31 C0 45 31 C9 FF D0'
  - id: acpi-firmware-provider-probe-x64
    desc: x64 ACPI firmware query
    crit: notable
    conf: 0.98
    arch: [x86-64]
    if:
      type: hex
      offset_range: [0, 524288]
      pattern: 'B9 49 50 43 41 31 D2 45 31 C0 41 FF D1 85 C0 74 ?? 89 C7'
  - id: get-memory-status
    desc: Query system memory capacity
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: GlobalMemoryStatusEx
  - id: get-memory-status-legacy
    desc: Legacy system memory query
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: GlobalMemoryStatus
  - id: get-system-info
    desc: Calls Windows GetSystemInfo API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: GetSystemInfo
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary-comp
        - id: metadata/lang/compiler/systems::go-pe-symtab
  # WOW64-aware sibling of GetSystemInfo: it reports the *native* processor
  # architecture and page size even when the caller is a 32-bit process on a
  # 64-bit host. Ordinary programs querying CPU count call GetSystemInfo; code
  # that needs the true architecture and allocation granularity before it maps
  # something calls this one, which is why manual PE mappers reach for it.
  # Neutral here — the intent lives in the composites that pair it with the
  # mapping APIs.
  - id: get-native-system-info
    desc: Calls Windows GetNativeSystemInfo API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: GetNativeSystemInfo

  - id: is-processor-feature-present
    desc: Checks Windows processor feature availability
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: IsProcessorFeaturePresent
  - id: is-processor-feature-present-script
    desc: Checks processor features from script
    crit: notable
    conf: 0.96
    for: [javascript, typescript, powershell]
    if:
      type: text
      substr: IsProcessorFeaturePresent
  - id: get-system-firmware-table
    desc: Query system firmware table
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: GetSystemFirmwareTable
  - id: get-system-firmware-table-string
    desc: GetSystemFirmwareTable API name string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GetSystemFirmwareTable
  - id: enum-system-firmware-tables
    desc: Enumerate system firmware tables
    crit: notable
    conf: 0.92
    for:
      - c
      - cpp
    if:
      type: symbol
      exact: EnumSystemFirmwareTables
  - id: enum-system-firmware-tables-string
    desc: EnumSystemFirmwareTables API name string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: EnumSystemFirmwareTables
  - id: enumerate-display-devices
    desc: Enumerate Windows display devices
    crit: notable
    conf: 0.9
    if:
      type: import
      regex: '^EnumDisplayDevices(A|W)$'
  - id: gpu-vendor-marker-set
    desc: GPU vendor marker string set
    crit: baseline
    conf: 0.88
    count_min: 4
    if:
      type: text
      substr: nvidia
      case_insensitive: true

  - id: bios-systemmanufacturer-key
    desc: BIOS manufacturer registry path
    crit: component
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      exact: HARDWARE\DESCRIPTION\System\BIOS

  - id: bios-systemmanufacturer-value
    desc: SystemManufacturer registry value
    crit: component
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      exact: SystemManufacturer
composite_rules:
  - id: firmware-table-inspection
    desc: Enumerate and read firmware tables
    crit: notable
    conf: 0.94
    all:
      - id: enum-system-firmware-tables
      - id: get-system-firmware-table

  - id: bios-manufacturer-registry-query
    desc: Query BIOS manufacturer registry data
    crit: notable
    conf: 0.95
    for: [pe, dll]
    all:
      - id: bios-systemmanufacturer-key
      - id: bios-systemmanufacturer-value
      - id: micro-behaviors/os/registry/access::reg-open-key-ex-a-symbol
      - id: micro-behaviors/os/registry/access::reg-query-value-ex-a-symbol
