# Go Hardware Discovery
# Detects hardware information queries
# ATT&CK: T1082 (System Information Discovery)
defaults:
  platforms: [windows, unix]
  mbc: "E1082"
  attack: "T1082"
traits:
  - id: runtime-numcpu
    desc: runtime.NumCPU CPU count
    crit: baseline
    conf: 0.5
    for: [go]
    if:
      type: symbol
      kind: call
      exact: "runtime.NumCPU"
  - id: cpuid-field-access
    desc: Reads Go cpuid CPU fields
    crit: notable
    conf: 0.88
    for: [go]
    if:
      type: text
      regex: '\bcpuid\.CPU\.[A-Za-z_][A-Za-z0-9_]*\b'
  - id: ghw-import
    desc: jaypipes/ghw hardware info library
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: import
      regex: github\.com/jaypipes/ghw|jaypipes/ghw
    unless:
      - id: well-known/app/ai/localai/
  - id: ghw-string
    desc: ghw library in binary
    crit: notable
    conf: 0.85
    for: [go, elf, macho, pe]
    if:
      type: text
      substr: jaypipes/ghw
    unless:
      - id: well-known/app/ai/localai/
  - id: ghw-cpu
    desc: ghw.CPU() call
    crit: notable
    conf: 0.8
    for: [go]
    if:
      type: symbol
      kind: call
      exact: ghw.CPU
  - id: ghw-memory
    desc: ghw.Memory() call
    crit: notable
    conf: 0.8
    for: [go]
    if:
      type: symbol
      kind: call
      exact: ghw.Memory
  - id: ghw-block
    desc: ghw.Block() storage info
    crit: notable
    conf: 0.8
    for: [go]
    if:
      type: symbol
      kind: call
      exact: ghw.Block
  - id: ghw-gpu
    desc: ghw.GPU() call
    crit: notable
    conf: 0.8
    for: [go]
    if:
      type: symbol
      kind: call
      exact: ghw.GPU
  - id: ghw-network
    desc: ghw.Network() call
    crit: notable
    conf: 0.8
    for: [go]
    if:
      type: symbol
      kind: call
      exact: ghw.Network
  - id: gopsutil-hardware-import
    desc: gopsutil CPU or memory package import
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: import
      regex: 'github\.com/shirou/gopsutil(/v[0-9]+)?/(cpu|mem)$'
  - id: gopsutil-hardware-string
    desc: gopsutil CPU or memory package path
    crit: notable
    conf: 0.85
    for: [scripts, binaries]
    if:
      type: text
      regex: 'github\.com/shirou/gopsutil(/v[0-9]+)?/(cpu|mem)'

composite_rules:
  - id: hardware-enum-library
    desc: Hardware enumeration library
    crit: notable
    conf: 0.85
    any:
      - id: ghw-import
      - id: ghw-string
      - id: gopsutil-hardware-import
      - id: gopsutil-hardware-string
  - id: hardware-info-gathering
    desc: Hardware information gathering
    crit: notable
    conf: 0.9
    all:
      - id: hardware-enum-library
    any:
      - id: ghw-cpu
      - id: ghw-memory
      - id: ghw-block
      - id: ghw-gpu
