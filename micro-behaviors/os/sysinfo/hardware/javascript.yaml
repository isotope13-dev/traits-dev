defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
  attack: T1082
composite_rules:
  - id: js-sysinfo-multi
    desc: Multiple system info function calls
    crit: notable
    conf: 0.75
    for:
      - javascript
      - typescript
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: micro-behaviors/os/sysinfo/performance::node-os-totalmem
      - id: micro-behaviors/network/interface/query::node-network-interfaces-call
      - id: micro-behaviors/process/identity/query/principal::os-homedir-call
  - id: js-multisource-hardware-identifier-collection
    desc: Collects hardware identifiers from multiple sources
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    # Stable device identifiers, one per OS family plus portable fallbacks. Any
    # three establish a multi-source fingerprint; the objective tier infers
    # enrollment or theft only alongside transfer evidence. All legs are
    # escape-tolerant text matchers, so \u00xx / \xXX-obfuscated specimens
    # match the same plaintext evidence as clear ones.
    needs: 3
    any:
      - id: micro-behaviors/network/interface/query::node-network-interfaces-call
      - id: micro-behaviors/os/sysinfo/machine-id::macos-ioreg-platform-expert-query
      - id: micro-behaviors/os/wmi/query::query-computer-system-product
      - id: micro-behaviors/os/wmi/query::query-os-info
      - id: micro-behaviors/os/sysinfo/machine-id::js-machine-id-path-read
      - id: micro-behaviors/os/sysinfo/dmi::dmi-sysfs
      - id: micro-behaviors/os/sysinfo/dmi::dmidecode
      - id: micro-behaviors/os/sysinfo/hardware::system-profiler-hardware
      - id: micro-behaviors/os/sysinfo/hardware::sysctl-hw-model-key
      - id: micro-behaviors/os/sysinfo/hardware::dmi-product-name-path
      - id: micro-behaviors/os/sysinfo/dmi::board-serial
      - id: micro-behaviors/os/sysinfo/dmi::product-serial
