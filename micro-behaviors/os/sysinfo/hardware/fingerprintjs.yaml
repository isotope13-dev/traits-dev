defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: fingerprintjs-load-call
  desc: Calls FingerprintJS browser probe
  crit: notable
  conf: 0.88
  if:
    type: symbol
    kind: call
    exact: FingerprintJS.load
- id: python-embedded-fingerprintjs-load
  desc: Python embeds a FingerprintJS browser probe
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: '\bFingerprintJS\.load\s*\('

