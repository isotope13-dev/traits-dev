# A single inventory API call establishes a capability, not reconnaissance.
# Match the call target, excluding comments and longer lookalike names.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: si-chassis-call
    desc: Calls si.chassis hardware information query
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: si.chassis
  - id: si-baseboard-call
    desc: Calls si.baseboard hardware information query
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: si.baseboard
  - id: si-system-call
    desc: Calls si.system hardware information query
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: si.system
