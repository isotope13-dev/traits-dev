# Field names alone establish neither collection nor telemetry.
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
traits:
- id: hwid-field-name
  desc: HWID field-name reference
  crit: notable
  conf: 0.6
  if:
    type: text
    exact: hwid
- id: local-app-hwid-field-name
  desc: localAppHWID field-name reference
  crit: notable
  conf: 0.6
  if:
    type: text
    exact: localAppHWID
