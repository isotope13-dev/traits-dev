defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: ioplatformuuid
    desc: References macOS hardware UUID value
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: IOPlatformUUID
    unless:
    - id: well-known/app/security/securew2-joinnow::recognized-securew2-joinnow
