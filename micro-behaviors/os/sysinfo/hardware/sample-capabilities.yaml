composite_rules:
- id: cpu-info
  desc: References CPU information queries
  any:
  - id: micro-behaviors/os/sysinfo/hardware::cpu-proc-cpuinfo
  - id: micro-behaviors/os/sysinfo/hardware::lscpu-cmd
- id: cpu-proc-cpuinfo
  desc: CPU-info path co-occurs with CPU field names
  all:
  - id: micro-behaviors/fs/proc/system::system-cpuinfo
  any:
  - id: micro-behaviors/os/sysinfo/hardware::cpu-model-name
  - id: micro-behaviors/os/sysinfo/hardware::cpu-family
  - id: micro-behaviors/os/sysinfo/hardware::cpu-cores
  near_bytes: 65536
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.4
