# Source-level hardware resource field declarations. A dict key naming a
# hardware resource (cpu, memory, disk, gpu) is neutral config/reporting
# syntax used by every cloud SDK, autoscaler and monitoring client; the
# stealer/host-profile composites in objectives/ reference these atoms and
# supply the intent.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1082

traits:
  - id: python-cpu-resource-key
    desc: Python dict declares a CPU resource key
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '["'']cpu["'']\s*:'

  - id: python-memory-resource-key
    desc: Python dict declares a memory resource key
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '["'']memory["'']\s*:'

  - id: python-disk-resource-key
    desc: Python dict declares a disk resource key
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '["'']disk["'']\s*:'

  - id: python-gpu-resource-key
    desc: Python dict declares a GPU resource key
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '["'']gpu["'']\s*:'

composite_rules:
  - id: python-hardware-resource-field
    desc: Python declares cpu, memory, disk, or GPU resource field
    crit: notable
    conf: 0.9
    any:
      - id: python-cpu-resource-key
      - id: python-memory-resource-key
      - id: python-disk-resource-key
      - id: python-gpu-resource-key
