defaults:
  crit: notable
  conf: 0.9
  platforms: [macos]
  for: [applescript, shell]
traits:
- id: system-profiler-uuid
  desc: Queries the macOS hardware UUID
  if:
    type: text
    regex: system_profiler\s+SPHardwareDataType.{0,80}UUID
- id: system-profiler-summary
  desc: Queries macOS software, hardware, and displays
  if:
    type: text
    regex: system_profiler\s+SPSoftwareDataType\s+SPHardwareDataType\s+SPDisplaysDataType
