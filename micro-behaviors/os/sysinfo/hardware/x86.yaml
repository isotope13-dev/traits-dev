# SIDT reads the x86 interrupt-descriptor-table register. Debuggers, kernels,
# bootloaders, and diagnostic software use it legitimately; anti-VM intent
# requires additional evidence about how the returned address is interpreted.
#
# Both patterns are short opcode sequences matched against the `text` section.
# In a managed (.NET) assembly that section is not x86 code at all -- it holds
# IL, metadata tables and the embedded managed-resource blob (compressed BAML,
# fonts, PNGs) -- so a 3-byte opcode prefix is hit by chance in any sizeable
# WPF/WinForms application. `unless` keeps these off managed assemblies; a
# managed binary that really wants the IDT reads it through a native stub or
# P/Invoke, which these byte patterns would not describe anyway.
defaults:
  platforms: [windows, linux]
  for: [pe, elf]
  arch: [x86]
  crit: notable
  conf: 0.9

traits:
  - id: sidt-stack-destination
    desc: SIDT stores x86 IDT register on stack
    if:
      type: hex
      section: text
      pattern: "0F 01 4C 24 ??"
    unless:
      - id: metadata/binary/framework::dotnet-assembly

  - id: sidt-absolute-destination
    desc: SIDT stores x86 IDT register in memory
    conf: 0.88
    if:
      type: hex
      section: text
      pattern: "0F 01 0D ?? ?? ?? ??"
    unless:
      - id: metadata/binary/framework::dotnet-assembly
