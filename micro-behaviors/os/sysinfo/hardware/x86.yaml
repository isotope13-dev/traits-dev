# SIDT reads the x86 interrupt-descriptor-table register. Debuggers, kernels,
# bootloaders, and diagnostic software use it legitimately; anti-VM intent
# requires additional evidence about how the returned address is interpreted.
#
# Both patterns are short opcode sequences matched against the `text` section.
# In a managed (.NET) assembly that section is not x86 code at all -- it holds
# IL, metadata tables and the embedded managed-resource blob (compressed BAML,
# fonts, PNGs) -- so a 3-byte opcode prefix is hit by chance in any sizeable
# WPF/WinForms application. `unless` keeps these off managed assemblies; a
# managed binary that really wants the IDT reads it through a native stub or
# P/Invoke, which these byte patterns would not describe anyway.
defaults:
  platforms: [windows, linux]
  for: [pe, elf]
  arch: [x86]
  crit: notable
  conf: 0.9

traits:
  # Require a subsequent stack read: the isolated SIDT bytes also occur
  # inside ordinary MOV/ADD instruction encodings in obfuscated native code.
  - id: sidt-stack-destination
    desc: SIDT stack store followed by stack read
    if:
      type: hex
      section: text
      pattern: "0F 01 4C 24 ?? 8B ?? 24 ??"
    unless:
      - id: metadata/binary/framework::dotnet-assembly
      - type: value
        path: elf.machine
        exact: unknown

  - id: sidt-absolute-destination
    desc: SIDT absolute store followed by memory read/test
    conf: 0.88
    if:
      type: hex
      section: text
      # Go's pclntab can contain the seven-byte opcode shape as data in
      # .text. Require an adjacent absolute-memory load or byte test, as
      # used to inspect the stored IDT descriptor. This is operation context,
      # not proof that both instructions address the same buffer or detect VMs.
      pattern: '0F 01 0D [4] (A0|A1|8A 0D|8B 0D|0F B6 05|80 3D) [4]'
    unless:
      - id: metadata/binary/framework::dotnet-assembly
      - type: value
        path: elf.machine
        exact: unknown
