# NIK C2 queries these settings before staging its bootkit placeholder.
# Queries also occur in ordinary administration; neither implies a bootkit.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.95

traits:
  - id: secure-boot-state-query-cmdlet
    desc: References Secure Boot state query cmdlet
    if:
      type: text
      word: Confirm-SecureBootUEFI
      case_insensitive: true

  - id: bcdedit-enumerate-command
    desc: Boot configuration enumeration command text
    if:
      type: text
      # Accept shell commands and separately quoted argv across languages.
      regex: '(?i)\bbcdedit(\.exe)?[\s"'',]{1,24}/enum\b'
