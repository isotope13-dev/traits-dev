# Sysctl Kernel State Access
# Query or modify kernel parameters via sysctl
defaults:
  attack: T1082
  mbc: E1082
traits:
  - id: sysctl
    desc: References the sysctl kernel-state API
    crit: baseline
    conf: 0.6
    for: [elf, macho, c]
    if:
      type: symbol
      exact: sysctl
    platforms: [linux, macos]
  - id: sysctlbyname
    desc: References the sysctlbyname kernel-state API
    crit: baseline
    conf: 0.6
    for: [macho, c]
    if:
      type: symbol
      exact: sysctlbyname
    platforms: [macos]
