# Sysctl Kernel State Access
# Query or modify kernel parameters via sysctl
defaults:
  crit: baseline
  conf: 0.6
  attack: T1082
  mbc: E1082
traits:
  - id: sysctl
    desc: References the sysctl kernel-state API
    for: [elf, macho, c]
    if:
      type: symbol
      exact: sysctl
    platforms: [linux, macos]
    unless:
      - id: sysctl-source-call
  - id: sysctlbyname
    desc: References the sysctlbyname kernel-state API
    for: [macho, c]
    if:
      type: symbol
      exact: sysctlbyname
    platforms: [macos]

  - id: sysctl-source-call
    desc: Calls the sysctl kernel-state API
    crit: notable
    conf: 0.95
    for: [c, cpp, rust, python]
    platforms: [unix]
    if:
      type: symbol
      kind: call
      regex: '(^|\.|::)sysctl$'
