defaults:
  conf: 0.9
  platforms: [macos]
  for: [go, macho, shell]
  crit: notable
traits:
  - id: sw-vers-command
    desc: macOS sw_vers system-version query
    platforms: [unix]
    if:
      type: text
      regex: '(?i)\bsw_vers\b'

  - id: sw-vers-product-version
    desc: macOS sw_vers product-version query
    if:
      type: text
      regex: '(?i)\bsw_vers\s+--?productVersion\b'

  - id: sysctl-kern-osproductversion
    desc: macOS product-version sysctl key
    for: [scripts, source, binaries]
    if:
      type: text
      substr: kern.osproductversion
