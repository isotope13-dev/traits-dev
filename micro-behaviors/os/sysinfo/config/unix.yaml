defaults:
  conf: 0.4
  for: [elf, macho, c]
  crit: baseline
  mbc: E1082
  attack: T1082
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: sysconf
    desc: Query system configuration information
    if:
      type: symbol
      regex: sysconf
    platforms:
      - linux
      - macos
  - id: confstr
    desc: Get configuration-dependent string
    if:
      type: symbol
      regex: confstr
    platforms:
      - linux
      - macos
