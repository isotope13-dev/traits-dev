defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: notable
  conf: 0.86
traits:
  - id: set-local-time-pinvoke
    desc: .NET local system-clock setter reference
    for: [pe, dll]
    if:
      type: text
      exact: SetLocalTime
  - id: set-computer-name-api
    desc: Windows API that changes the computer name
    if:
      type: symbol
      kind: import
      regex: '^SetComputerName[AW]?$'

  - id: set-system-time-api
    desc: Windows API that sets system time
    if:
      type: symbol
      kind: import
      regex: '^SetSystemTime(Adjustment)?$'

  # NtSetSystemInformation is the generic native setter for system information
  # classes -- time adjustment, driver load, performance flags, and (with
  # SystemCiPolicyInformation) Code Integrity policy reload. The bare symbol is
  # the capability only; the CI-policy intent comes from the information-class
  # and option atoms in objectives/impact/degrade/windows-policy/.
  - id: nt-set-system-information
    desc: Sets a native system information class
    if:
      type: symbol
      exact: NtSetSystemInformation
