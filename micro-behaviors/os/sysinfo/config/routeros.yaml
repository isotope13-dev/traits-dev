defaults:
  platforms: [routeros, appliance, unix]
  for: [text, shell, python, javascript]
  attack: T1041

traits:
  - id: routeros-config-export-read
    desc: RouterOS config export read
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '/export (compact|terse)'
  - id: routeros-config-backup-save
    desc: RouterOS config backup save
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '/system[ /]backup[ /]save'
  - id: routeros-config-backup-unencrypted
    desc: RouterOS config backup saved unencrypted
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/system[ /]backup[ /]save[^\n]{0,120}dont-encrypt=yes'
