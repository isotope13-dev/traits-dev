# x86 CPU capability queries.
defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho]
  arch: [x86, x86-64]
  crit: notable
  conf: 0.9

traits:
  - id: extended-cpuid-long-mode-query
    desc: Queries x86 extended CPUID long-mode bit
    if:
      type: hex
      section: .text
      pattern: 'B8 01 00 00 80 53 0F A2 5B 0F BA E2 1D'
  - id: cpuid-feature-mask-test
    desc: Tests an x86 CPUID feature mask
    # `cpuid; not ecx; and ecx, 0x00080202` — the shape a library uses to pick
    # an SSE2/AVX implementation at startup. Baseline: ordinary in optimised
    # native code. It lived in objectives/supply-chain/trojanized/backdoor/ as
    # "xz-cpuid-mask-check", where its own note recorded that it appears in
    # *clean* liblzma 5.4.5 and 5.6.3 and is absent from the backdoored 5.6.0 —
    # so an `unless:` on the exact basename `liblzma.so.5.4.5` was holding the
    # false positive back. Filed for what it matches, the carve-out is not
    # needed and the pattern no longer accuses a clean library of a backdoor.
    crit: baseline
    conf: 0.4
    if:
      type: hex
      section: .text
      pattern: 0F A2 F7 D1 81 E1 02 02 08 00
