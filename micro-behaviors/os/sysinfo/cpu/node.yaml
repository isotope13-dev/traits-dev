defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-cpu-information-query
    desc: Queries Node CPU information
    crit: notable
    conf: 0.9
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(os\.cpus\(\)|\(0,\s*os_\d+\.cpus\)\(\))'
