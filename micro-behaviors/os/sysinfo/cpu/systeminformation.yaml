# A single inventory API call establishes a capability, not reconnaissance.
# Match the call target, excluding comments and longer lookalike names.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: si-cpu-call
    desc: Calls si.cpu CPU information query
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: si.cpu
