# Python host CPU-count queries. Reading the processor count and branching on
# it is ordinary capacity sizing (thread pools, executor selection, chunk
# counts); it carries no evasion intent on its own. The sandbox-detection
# objectives reference these atoms and supply the intent from the other legs
# (a nearby process exit, VM markers).
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1082
  crit: notable
  conf: 0.9

traits:
  # `os.cpu_count() < 2` and friends. Home Assistant picks an executor with
  # `multiprocessing.cpu_count() < 2`; malware uses the same comparison to
  # spot a one-vCPU analysis VM. The comparison alone does not distinguish
  # them, so it is recorded here as the plain observation.
  - id: python-cpu-count-low-threshold-compare
    desc: Python CPU count compared to low threshold
    if:
      type: text
      regex: '(os|multiprocessing|psutil)\.cpu_count\(\)(\s+or\s+0)?\)?\s*<\s*[1-3]\b'
