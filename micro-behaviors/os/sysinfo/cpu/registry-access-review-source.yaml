defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp]

traits:
  - id: source-cpu-profile-registry-path
    desc: CPU profile registry path in source
    conf: 0.9
    if:
      type: text
      # In C/C++ source the path appears inside a string literal, where each
      # separator is an escaped backslash; accept one or two so both the
      # literal spelling and compiled-string form match.
      regex: 'HARDWARE\\+DESCRIPTION\\+System\\+CentralProcessor\\+0'

