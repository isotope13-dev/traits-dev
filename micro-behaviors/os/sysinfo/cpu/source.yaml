defaults:
  platforms: [windows, unix]
  for: [c, cpp, rust]
  crit: notable
  conf: 0.9

traits:
  - id: cpuid-intrinsic-source-reference
    desc: Native source references the CPUID intrinsic
    count_min: 2
    if:
      type: text
      substr: __cpuid
  - id: cpuid-intrinsic-call
    desc: Calls x86 __cpuid intrinsic in source
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|::)_{0,2}cpuid(__count)?$'
