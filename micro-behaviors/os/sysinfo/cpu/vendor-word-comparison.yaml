# CPU-vendor comparison is ordinary runtime dispatch. In particular, Go's
# runtime.rt0_go sets isIntel and processorVersion here, then continues startup;
# runtime.init.1 consumes isIntel when selecting processor feature flags.
# Neither a stripped image nor an ELF parse diagnostic establishes VM evasion.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86, x86-64]
traits:
  - id: genuineintel-vendor-word-comparison
    desc: Compares GenuineIntel CPU vendor words
    crit: notable
    conf: 0.85
    if:
      type: hex
      offset_range: [0, null]
      pattern: "81 FB 47 65 6E 75 75 ?? 81 FA 69 6E 65 49 75 ?? 81 F9 6E 74 65 6C"
    # Present in Go's empty-program startup, including the repository's
    # does-nothing Linux/386 executable and its packaged copies. Retain the
    # observation, but use baseline for that ubiquitous compiler context.
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
