defaults:
  for:
    - elf
    - shell
    - python
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  - id: sys-devices
    desc: References Linux sysfs CPU information path
    crit: notable
    conf: 0.7
    attack: T1082
    platforms:
      - linux
    if:
      type: text
      substr: /sys/devices/system/cpu
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/compiler/systems::rustc-path
      - id: metadata/lang/compiler/systems::rust-src-path
      # Static glibc embeds the online/possible CPU paths for its own
      # sysconf implementation; the strings alone are not app behavior.
      - id: metadata/binary/linking/runtime::glibc-runtime-markers
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
