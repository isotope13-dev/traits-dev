defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-extended-cpuid-brand-range-check
    desc: Checks CPUID processor-brand leaf availability
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: >-
        B8 00 00 00 80 31 C9 49 89 D8 0F A2 4C 87 C3
        3D 04 00 00 80
