defaults:
  platforms: [routeros, appliance, unix]
  for: [javascript]
  attack: T1082

traits:
  - id: jvm-processor-count-reference
    desc: Java runtime processor count reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: availableProcessors
  - id: java-low-processor-count-comparison
    desc: Java compares processor count to low threshold
    crit: notable
    conf: 0.96
    for: [java]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'availableProcessors\(\)\s*<\s*[1-3]\b'
