composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  id: cpu-registry-query-api-profile
  desc: CPU registry references with registry read APIs
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/os/sysinfo/cpu::central-processor-registry-path
  - id: micro-behaviors/os/sysinfo/cpu::processor-name-registry-value
  - id: micro-behaviors/os/registry/access::registry-read-api-chain
  unless:
  - id: metadata/binary/installer/sfx/
  - id: well-known/app/system/cvte-crashrpt/
  - id: metadata/file/string/application-name::pe-product-name-7zip
