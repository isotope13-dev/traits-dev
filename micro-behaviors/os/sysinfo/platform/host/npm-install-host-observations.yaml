defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: preinstall-node-os-platform
  desc: Preinstall queries Node platform
  crit: notable
  conf: 0.92
  if:
    type: value
    path: "scripts.preinstall"
    regex: "require\\([\"']os[\"']\\)\\.platform\\("

- id: script-sysinfo-cmd-1--uname
  desc: Preinstall references uname command
  crit: notable
  conf: 0.8
  if:
    type: value
    path: "scripts.preinstall"
    regex: \buname\b
