defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  attack: T1082

traits:
  # `OS=$(uname -s)` in an installer and `K=$(hostname)` feeding a keyed
  # decoder look alike; the capture is the fact, and composites add the use.
  - id: shell-host-identity-var
    desc: Stores host identity output in a variable
    conf: 0.94
    if:
      type: text
      regex: '\b[A-Z_][A-Z0-9_]*\s*=\s*\$\(\s*(hostname|uname|sysctl|getconf)\b'
