defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-uname-report-field
    desc: Adds platform uname to report field
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((dictionary (pair key: (string (string_content) @key)) (pair value: (call arguments: (argument_list
          (call function: (attribute object: (identifier) @lib
            attribute: (identifier) @query)))))) @field
          (#eq? @key "ssh_command") (#eq? @lib "platform") (#eq? @query "uname"))
