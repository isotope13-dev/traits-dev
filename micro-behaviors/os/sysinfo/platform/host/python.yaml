defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: platform-system
    desc: Queries the OS with platform.system()
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: platform.system
    unless:
      - type: text
        regex: 'HEADER_NAME_USER_AGENT\s*=\s*[''"]User-Agent[''"]'
  - id: python-platform-machine
    desc: Queries CPU architecture with platform.machine()
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: platform.machine
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: platform-node
    desc: platform.node() hostname call
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: platform.node
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: platform-full
    desc: platform.platform() full info
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: platform.platform
  - id: platform-uname
    desc: Queries OS and machine information
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: platform.uname

  - id: os-uname-call
    desc: Queries system info with os.uname()
    crit: notable
    conf: 0.8
    mbc: E1082
    if:
      type: text
      regex: os\.uname\s*\(
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
