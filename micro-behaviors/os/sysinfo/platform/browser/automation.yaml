defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: browser-automation-evaluation-globals
  desc: References browser automation evaluation globals
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: __(webdriver|selenium|fxdriver)_(evaluate|unwrapped)
composite_rules:
- id: browser-environment-fingerprint-indicators
  desc: Multiple browser environment fingerprint checks
  crit: notable
  conf: 0.92
  needs: 3
  any:
  - id: micro-behaviors/os/sysinfo/platform/browser::navigator-webdriver-read
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-headlesschrome-useragent-check
  - id: browser-automation-evaluation-globals
  - id: browser-automation-global-references
  - id: micro-behaviors/os/sysinfo/platform/browser::browser-webgl-software-renderer-check
  - id: micro-behaviors/ui/graphics/image::canvas-empty-data-url-comparison
  - id: micro-behaviors/hardware/input/audio::offline-audio-compressor
  unless:
  - id: well-known/lib/vendor-sdk/shopify-perf-kit::shopify-perf-kit-context
  - id: well-known/app/system/human-security::human-security-antibot-client
- id: browser-automation-global-references
  desc: References browser automation globals
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/sysinfo/platform/browser::callphantom-global-reference
  - id: micro-behaviors/os/sysinfo/platform/browser::nightmare-automation-global-reference
  - id: micro-behaviors/os/sysinfo/platform/browser::chrome-automation-global-reference
