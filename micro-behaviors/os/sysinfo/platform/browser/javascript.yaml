defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1082"
traits:
  - id: browser-geolocation-current-position
    desc: Requests browser geolocation
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: navigator.geolocation.getCurrentPosition

  - id: browser-geolocation-coordinate-read
    desc: Reads browser geolocation coordinates
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      regex: '\.coords\.(latitude|longitude)$'

  - id: js-locale-discovery
    desc: Reads JavaScript environment locale
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: 'resolvedOptions\\(\\)\\.locale|Intl\\.DateTimeFormat'

  - id: js-locale-symbol
    desc: Reads locale through Intl.DateTimeFormat
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/lib/observability/sentry-js/
    if:
      type: symbol
      substr: DateTimeFormat.resolvedOptions

  - id: navigator-language
    desc: Reads browser UI language
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '\bnavigator\.language\b'

  - id: navigator-russian-language-test
    desc: Tests browser UI language for Russian
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '/\^ru\\b/[i]?\s*\.test\(\s*navigator\.language\s*\)'

  - id: navigator-battery-read
    desc: References browser battery-status API
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: getBattery

  - id: browser-screen-dimensions-read
    desc: Reads browser screen dimensions
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: screen.height

  - id: browser-webgl-vendor-parameter-read
    desc: Reads WebGL vendor identifier
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\.getParameter\(\s*\w+\.UNMASKED_VENDOR_WEBGL\s*\)'

  - id: browser-webgl-renderer-parameter-read
    desc: Reads WebGL renderer identifier
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\.getParameter\(\s*\w+\.UNMASKED_RENDERER_WEBGL\s*\)'

  - id: browser-webgl-software-renderer-check
    desc: Checks WebGL software renderer identifier
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(renderer|webgl)[^\r\n]{0,120}(SwiftShader|llvmpipe|softpipe)'

  - id: navigator-cookie-enabled-read
    desc: Reads browser cookieEnabled flag
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: cookieEnabled

  - id: navigator-platform-read
    desc: Reads navigator.platform browser identity
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: navigator.platform

  - id: navigator-appversion-read
    desc: Reads browser application version identity
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      exact: navigator.appVersion

  - id: ios-macintel-platform-check
    desc: Checks MacIntel browser platform
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)navigator\.platform\s*={2,3}\s*["'']MacIntel["'']'

  - id: ios-touch-capability-check
    desc: Checks iOS touch capability
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)navigator\.maxTouchPoints\s*>\s*1'

  - id: navigator-webdriver-read
    desc: Reads browser WebDriver automation flag
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: member
      exact: navigator.webdriver

  - id: js-webdriver-member-read
    desc: Reads a JavaScript WebDriver member
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.webdriver$'

  - id: automation-global-or-chain-probe
    desc: Chained check for headless automation globals
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: callPhantom||window.__nightmare||window.webdriver

  - id: browser-webdriver-check
    desc: Checks an aliased browser WebDriver flag
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'webdriverCheck.{0,400}webdriver'

  - id: browser-plugin-prototype-check
    desc: Checks the browser plugin prototype
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'PluginArray.{0,180}__proto__'

  - id: browser-mimetype-prototype-check
    desc: Checks the browser MIME-type prototype
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'MimeTypeArray.{0,180}__proto__'

  - id: browser-outer-dimensions-zero-check
    desc: Checks for zero browser outer dimensions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'outerWidth.{0,40}===\s*0.{0,80}outerHeight.{0,40}===\s*0'

  - id: electron-renderer-detect
    desc: Detects Electron renderer process
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bprocess\.type\s*={0,2}\s*["'']renderer["'']'

  - id: nwjs-detect
    desc: References NW.js process marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: __nwjs
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle

  - id: webkit-appearance-detect
    desc: "WebKit/Blink via WebkitAppearance style"
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: WebkitAppearance
  - id: browser-window-presence-check
    desc: Checks for browser window global
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: "(?i)typeof\\s+window\\s*!={1,2}\\s*['\"]undefined['\"]"
  # ClientJS is the open device-profiling library behind getBrowser/getOS/
  # getScreenPrint/getPlugins/getFonts calls. Instantiation alone may serve
  # risk scoring; the fill atom below shows the profile leaving the page.
  - id: clientjs-instantiation
    desc: Instantiates ClientJS device profiler
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: 'new\s+ClientJS\s*\(\s*\)'
  # A form field filled straight from a profiler call
  # (`$("[name='x']").val(client.getBrowser() ...)`) captures the device
  # profile into submittable state. Feature detection reads the profile and
  # branches; capture writes it into the form for exfiltration.
  - id: clientjs-filled-form-field
    desc: Form field filled from ClientJS profile call
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '\.val\(\s*client\s*\.\s*get[A-Za-z]*\s*\('
  # Legacy-plugin probes through ClientJS, one atom per family. A single
  # boolean check can be fallback detection; the probe composite below
  # requires breadth across families, which is exploit-surface enumeration:
  # no supported 2026 content needs to know the Flash version.
  - id: clientjs-java-version-probe
    desc: ClientJS Java version probe
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: 'client\s*\.\s*(isJava|getJavaVersion)\s*\('
  - id: clientjs-flash-version-probe
    desc: ClientJS Flash version probe
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: 'client\s*\.\s*(isFlash|getFlashVersion)\s*\('
  - id: clientjs-silverlight-version-probe
    desc: ClientJS Silverlight version probe
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: 'client\s*\.\s*(isSilverlight|getSilverlightVersion)\s*\('

composite_rules:
  - id: hybrid-browser-runtime-detect
    desc: Detects an Electron or NW.js browser runtime
    crit: notable
    conf: 0.95
    any:
      - id: electron-renderer-detect
      - id: nwjs-detect

  - id: browser-antibot-fingerprint
    desc: Browser anti-bot fingerprint checks
    crit: notable
    conf: 0.94
    needs: 2
    any:
      - id: browser-webdriver-check
      - id: browser-plugin-prototype-check
      - id: browser-mimetype-prototype-check
  - id: browser-identity-input
    desc: Reads browser identity or display input
    crit: notable
    conf: 0.9
    any:
      - id: navigator-platform-read
      - id: browser-screen-dimensions-read
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read

  - id: browser-webgl-renderer-read
    desc: Reads WebGL vendor and renderer identifiers
    crit: notable
    conf: 0.92
    near_bytes: 512
    all:
      - id: browser-webgl-vendor-parameter-read
      - id: browser-webgl-renderer-parameter-read

  - id: ios-device-capability-check
    desc: Checks iOS device capabilities
    crit: notable
    conf: 0.94
    all:
      - id: ios-macintel-platform-check
      - id: ios-touch-capability-check
    near_bytes: 320
  # Capture-only ClientJS pairing: the profiler is instantiated and its
  # readings are poured into form fields. Without a credential or POST
  # context this may be analytics, so it stays suspicious; the password
  # and POST legs in the harvest twin carry the conviction alone.
  - id: clientjs-profile-field-capture
    desc: ClientJS device profile captured into form fields
    crit: suspicious
    conf: 0.9
    for: [html]
    all:
      - id: clientjs-instantiation
      - id: clientjs-filled-form-field
  # Breadth across legacy-plugin families: two probed families rule out
  # single-technology fallback detection.
  - id: clientjs-legacy-plugin-probe
    desc: ClientJS probes multiple legacy plugin families
    crit: component
    conf: 0.92
    for: [html, javascript]
    needs: 2
    any:
      - id: clientjs-java-version-probe
      - id: clientjs-flash-version-probe
      - id: clientjs-silverlight-version-probe
