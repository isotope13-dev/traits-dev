traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: headlesschrome-string-test
  desc: HeadlessChrome string near a matching method
  conf: 0.8
  if:
    type: text
    regex: HeadlessChrome[\s\S]{0,80}(includes|indexOf|match)
- platforms:
  - unix
  - windows
  id: nightmare-automation-global-reference
  desc: Nightmare.js automation global reference
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: __nightmare
  unless:
  - id: micro-behaviors/os/sysinfo/platform/browser::automation-global-or-chain-probe
- platforms:
  - unix
  - windows
  id: chrome-automation-global-reference
  desc: Chrome automation global reference
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: domAutomationController
- platforms:
  - linux
  - macos
  - windows
  for:
  - csharp
  - go
  - python
  id: callphantom-global-reference
  desc: References the callPhantom automation global
  conf: 0.5
  size_max: 10485760
  count_min: 2
  if:
    type: text
    substr: callPhantom
defaults:
  crit: notable
