defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: puppeteer-evaluation-source-marker
    desc: References Puppeteer evaluation source marker
    for: [javascript, typescript]
    conf: 0.96
    if:
      type: text
      substr: __puppeteer_evaluation_script__

  - id: browser-headless-useragent-substring-check
    desc: Checks lowercased user agent for headless
    if:
      type: text
      regex: 'userAgent\s*\.toLowerCase\(\)\s*\.includes\([''"]headless[''"]\)'
