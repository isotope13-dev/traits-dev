defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: browser-plugin-list-empty-check
    desc: Checks for an empty browser plugin list
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'navigator\.plugins\.length\s*===?\s*0'

  - id: browser-languages-empty-check
    desc: Checks for an empty browser language list
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '!\s*navigator\.languages|navigator\.languages\.length\s*===?\s*0'

  - id: browser-chrome-runtime-absence-check
    desc: Checks for a missing Chrome runtime object
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'typeof\s+window\.chrome\s*===?\s*["'']undefined["'']'

  - id: browser-chrome-useragent-test
    desc: Tests the browser user agent for Chrome
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/chrome/i\.test\(\s*navigator\.userAgent\s*\)'

  - id: browser-outer-width-zero-check
    desc: Checks for zero browser outer width
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'window\.outerWidth\s*===?\s*0'
    unless:
      - id: metadata/library/automation::puppeteer-extra-stealth-plugin-import

  - id: browser-headlesschrome-useragent-check
    desc: Checks for HeadlessChrome in the user agent
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: HeadlessChrome/.test(navigator.userAgent)

  - id: browser-headless-detector-name
    desc: Names headless-browser detection logic
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?i)\bdetect.{0,20}headless.{0,40}\b(browser|webdriver|navigator)\b'

composite_rules:
  - id: browser-chrome-runtime-absence
    desc: Chrome user agent lacks its runtime object
    crit: notable
    conf: 0.94
    near_lines: 5
    all:
      - id: browser-chrome-runtime-absence-check
      - id: browser-chrome-useragent-test

  # These probes are also used by fraud prevention and compatibility code.
  # Treat the indicator suite as a neutral browser capability; anti-analysis
  # intent requires an evasive response such as page suppression or redirect.
  - id: browser-headless-indicator-suite
    desc: Checks multiple browser headless-state indicators
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-webdriver-read
      - id: browser-plugin-list-empty-check
      - id: browser-outer-width-zero-check
      - id: browser-headlesschrome-useragent-check
      - id: browser-languages-empty-check
      - id: browser-chrome-runtime-absence-check
