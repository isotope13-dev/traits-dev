# HTML's embedded JavaScript does not expose symbol/call facts. Require call
# syntax and skip markup comments; these probes alone establish no evasion.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: html-webgpu-adapter-request
    desc: HTML script requests a WebGPU adapter
    if:
      type: text
      exclude_html_comments: true
      regex: '\bnavigator\s*\.\s*gpu\s*\.\s*requestAdapter\s*\('

  - id: html-adblock-plus-dom-marker-read
    desc: HTML script reads Adblock Plus DOM marker
    if:
      type: text
      exclude_html_comments: true
      regex: '\.getAttribute\(\s*["'']abp["'']\s*\)'
