defaults:
  platforms: [unix]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.8

traits:
  - id: os-release-open
    desc: References opening the Linux release file
    if:
      type: text
      regex: 'open\(.{0,15}os-release|/rgp/bf-eryrnfr'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path

  - id: os-release-read
    desc: Reads Linux os-release file
    for: [shell]
    platforms: [unix, windows]
    crit: notable
    conf: 0.82
    mbc: E1082
    attack: T1082
    if:
      type: text
      regex: '\bcat\s+/etc/os-release\b'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
