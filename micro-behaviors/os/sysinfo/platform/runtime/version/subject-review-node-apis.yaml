defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
traits:
  - id: process-versions-content
    desc: Reads Node.js process.versions
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: process.versions
    unless:
      # Browserify's process shim initializes this field; initialization is
      # not host-version discovery.
      - type: text
        regex: '\bprocess\.(?:argv|version|versions)\s*='
  - id: os-release-call
    desc: Queries OS release with os.release()
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: os.release
  - id: process-version-access
    desc: Reads Node.js version through process.version
    crit: notable
    conf: 0.72
    if:
      type: symbol
      kind: member
      exact: process.version
    unless:
      - type: text
        regex: '\bprocess\.(?:argv|version|versions)\s*='
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
