defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-version-constant
    unless:
    - id: metadata/lang/source/syntax/markup/markdown::fires-quiet-lesson-table
    desc: References the Ruby runtime version constant
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: identifier
      exact: RUBY_VERSION
