# Whole Python string literals that name a runtime-profile field. Each is an
# ordinary key: `python_version` is also the PEP 508 environment-marker name
# that pip, setuptools and packaging evaluate. The runtime-profile record
# composite in objectives/discovery/system/profile requires all of them within
# a few lines.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python, pyc]
  conf: 0.9

traits:
  - id: python-version-string-key
    desc: Python string literal python_version
    if:
      type: literal
      kind: string
      exact: python_version
