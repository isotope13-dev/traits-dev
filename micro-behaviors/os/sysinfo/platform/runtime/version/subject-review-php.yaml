defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-version-constant
    desc: Reads the PHP runtime version constant
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: PHP_VERSION

  - id: phpversion-call
    desc: Reads the PHP runtime version
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: phpversion

