defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable
  conf: 0.9

composite_rules:
- id: go-host-and-platform-query
  desc: Go queries hostname and runtime platform
  crit: notable
  conf: 0.85
  all:
    - id: micro-behaviors/os/sysinfo/hostname::os-hostname
  any:
    - id: micro-behaviors/os/sysinfo/platform/runtime::runtime-goos
    - id: micro-behaviors/os/sysinfo/platform/runtime::runtime-goarch
  unless:
    - id: metadata/package/testing/presence/harness::go-test-file
    - id: metadata/package/testing/harness/unit::go-test
    - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
    - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-distribution
    - id: well-known/app/infrastructure/docker::source-tree
    - id: well-known/app/infrastructure/docker::docker-source-archive-context
