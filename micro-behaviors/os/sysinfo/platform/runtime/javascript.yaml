defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
# Host-environment feature checks. A script asking whether `document` or
# `window` exists is deciding which runtime it is in -- the ordinary
# isomorphic/SSR guard every dual-target library carries. Neutral and
# near-universal on its own; composites that infer a Windows Script Host gate
# (objectives/anti-analysis/environment-detect/wsh) reference these and supply
# the WScript evidence themselves.
- id: browser-document-absence-check
  desc: Checks whether the document global is absent
  crit: baseline
  conf: 0.8
  for: [javascript, typescript]
  if:
    type: text
    regex: "(?i)typeof\\s+document\\s*={2,3}\\s*['\"]undefined['\"]"
- id: browser-window-absence-check
  desc: Checks whether the window global is absent
  crit: baseline
  conf: 0.8
  for: [javascript, typescript]
  unless:
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/library/structure::js-emscripten-preamble-marker
  if:
    type: text
    regex: "(?i)typeof\\s+window\\s*={2,3}\\s*['\"]undefined['\"]"
- id: browser-document-typeof-assignment
  desc: Stores typeof document in a variable
  crit: baseline
  conf: 0.75
  for: [javascript, typescript]
  if:
    type: text
    regex: "(?i)\\b\\w+\\s*=\\s*typeof\\s+document"
- id: platform-type-query-cluster
  desc: Repeated runtime platform-type queries
  crit: notable
  conf: 0.9
  size_min: 20000
  count_min: 8
  if:
    type: text
    substr: platform.getType()
