traits:
- for:
  - javascript
  - typescript
  id: node-wsl-environment-access
  desc: Node reads WSL environment markers
  conf: 0.96
  if:
    type: symbol
    kind: member
    regex: ^process\.env\.(WSL_DISTRO_NAME|WSLENV)$
- for:
  - python
  id: python-wsl-environment-access
  desc: Python reads WSL environment markers
  conf: 0.96
  if:
    type: text
    regex: os\.(getenv|environ\.get)\s*\(\s*["'](WSL_DISTRO_NAME|WSLENV)["']
composite_rules:
- for:
  - shell
  - perl
  id: wsl-kernel-release-probe
  desc: Reads both Linux kernel release paths
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/os/identity::proc-version
  - id: micro-behaviors/fs/proc/system::system-osrelease
- for:
  - scripts
  - source
  id: wsl-runtime-detection
  desc: Detects a Windows Subsystem for Linux runtime
  conf: 0.97
  any:
  - id: micro-behaviors/os/sysinfo/platform/runtime::node-wsl-environment-access
  - id: micro-behaviors/os/sysinfo/platform/runtime::python-wsl-environment-access
  - id: micro-behaviors/os/sysinfo/platform/runtime::wsl-kernel-release-probe
defaults:
  platforms:
  - windows
  - unix
  crit: notable
