defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
traits:
  - id: os-uptime-call
    desc: os.uptime() system uptime query
    conf: 0.85
    if:
      type: symbol
      exact: os.uptime
  - id: os-loadavg-call
    desc: os.loadavg() load average query
    conf: 0.85
    if:
      type: symbol
      exact: os.loadavg
  - id: npm-postinstall-cwd-call
    desc: npm postinstall queries working directory
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: "process\\.cwd\\s*\\(\\s*\\)"
