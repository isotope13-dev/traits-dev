defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  attack: T1082

traits:
- id: js-os-platform
  desc: JavaScript detects operating system platform
  crit: notable
  conf: 0.88
  if:
    type: value
    path: "scripts.preinstall"
    substr: "os.platform()"
- id: js-os-arch
  desc: JavaScript detects CPU architecture
  crit: notable
  conf: 0.88
  if:
    type: value
    path: "scripts.preinstall"
    substr: "os.arch()"
