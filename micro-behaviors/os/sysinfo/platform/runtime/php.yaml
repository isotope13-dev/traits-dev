defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-version-constant
    desc: Reads the PHP runtime version constant
    crit: baseline
    conf: 0.5
    if:
      type: text
      word: PHP_VERSION

  - id: php-os-constant
    desc: Reads the PHP OS constant
    crit: notable
    conf: 0.7
    if:
      type: text
      # PHP_OS and PHP_OS_FAMILY are the runtime OS identity constants.
      regex: \bPHP_OS(_FAMILY)?\b

  # Relocated from objectives/discovery/system/fingerprint/info: a lone
  # php_sapi_name() call is how WordPress, Composer, Symfony and Laravel decide
  # "am I running under CLI or a web SAPI", not reconnaissance.  Fingerprint
  # composites reference it cross-tier, exactly as the note in that file
  # describes for php-getcwd.
  - id: php-sapi-name
    desc: Gets PHP SAPI name
    crit: notable
    conf: 0.6
    attack: T1082
    mbc: E1082
    if:
      type: symbol
      kind: call
      exact: php_sapi_name

  - id: phpversion-call
    desc: Reads the PHP runtime version
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: phpversion

  - id: php-uname-call
    desc: Reads OS information via php_uname()
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: php_uname

  - id: php-uname-symbol
    desc: References the php_uname OS information function
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: php_uname

  - id: server-software-access
    desc: Reads the web server software variable
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: \$_SERVER\s*\[['\"]SERVER_SOFTWARE['\"]\]

  - id: server-software-nginx-check
    desc: Checks for nginx in server software
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: strpos\s*\([^)]{0,50}SERVER_SOFTWARE[^)]{0,30}nginx

  - id: server-software-apache-check
    desc: Checks for Apache in server software
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: strpos\s*\([^)]{0,50}SERVER_SOFTWARE[^)]{0,30}(apache|Apache)

composite_rules:
  - id: server-software-type-check
    desc: Checks for a known web server type
    crit: notable
    conf: 0.85
    any:
      - id: server-software-nginx-check
      - id: server-software-apache-check
