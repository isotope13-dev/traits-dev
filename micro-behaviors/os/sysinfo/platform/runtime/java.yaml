# Java runtime platform queries expose host metadata; an objective composite
# may interpret them in context, but the property read alone is neutral.
defaults:
  platforms: [unix, windows]
  for: [class, java]
  crit: notable
  conf: 0.88

traits:
  - id: java-system-property-os-name
    desc: Reads the Java operating-system name property
    if:
      type: text
      exact: os.name

  - id: java-user-library-path-property
    desc: Reads the Java native library search path
    if:
      type: text
      exact: java.library.path
