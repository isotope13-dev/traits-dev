defaults:
  platforms: [windows, unix]
  for:
    - python
  crit: notable
  attack: T1082
traits:
  - id: python-win32-check
    desc: Checks for Windows platform
    conf: 0.8
    mbc: E1082
    if:
      type: string_literal
      regex: sys\.platform.{0,20}win32|platform.{0,20}win32|['"]win32['"].{0,20}sys\.platform
  # Go-style arch alias map (x86_64->amd64, aarch64->arm64): the mapping a
  # launcher applies when resolving a platform-specific native binary staged
  # under <platform>-<arch> directories. Legitimate install scripts fetch
  # prebuilds this way too, so it stays notable; composites add the launch.
  - id: python-arch-alias-go-map
    desc: Maps host arch names to Go names
    conf: 0.88
    if:
      type: text
      regex: '["'']x86_64["'']\s*:\s*["'']amd64["''].{0,200}["'']aarch64["'']\s*:\s*["'']arm64["'']'
  - id: python-osname-nt-check
    desc: Windows platform check via os.name == 'nt'
    conf: 0.8
    mbc: E1082
    if:
      type: text
      regex: os\.name\s*==\s*['"]nt['"]|from\s+os\s+import\s+name\b
  - id: sys-platform-check
    desc: Python sys.platform conditional check
    crit: baseline
    conf: 0.8
    if:
      type: text
      substr: sys.platform
  - id: python-platform-processor
    desc: platform.processor() processor identity
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: platform.processor
