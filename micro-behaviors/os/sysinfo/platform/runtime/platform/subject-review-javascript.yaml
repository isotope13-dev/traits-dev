defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: deno-build-os-read
    desc: Reads Deno runtime operating system
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: member
      exact: Deno.build.os
  - id: platform-type-query-cluster
    desc: Repeated runtime platform-type queries
    crit: notable
    conf: 0.9
    size_min: 20000
    count_min: 8
    if:
      type: text
      substr: platform.getType()
