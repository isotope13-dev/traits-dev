defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable
  conf: 0.9

composite_rules:
  - id: go-host-and-platform-query
    desc: Go queries hostname and runtime platform
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::runtime-goos
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::runtime-goarch
