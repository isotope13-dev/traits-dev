defaults:
  platforms: [unix, windows]
  for: [csharp]

traits:
  - id: dotnet-runtime-info
    desc: .NET reads the runtime OS description
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: RuntimeInformation.OSDescription

  - id: dotnet-machine-name-os-description
    desc: Reads machine name and OS description
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Environment\.MachineName[\s\S]{0,260}OSDescription'
