# A device-family list is platform-name evidence; it need not read a User-Agent.
defaults:
  platforms:
  - unix
  - windows
traits:
- id: ios-device-family-token-list
  desc: Lists iPad beside iPhone or iPod tokens
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  - python
  - php
  if:
    type: text
    regex: '["'']iPad["'']\s*,\s*["'']iP(hone|od)["'']|["'']iPhone["'']\s*,\s*["'']iPad["'']'
