# Android device and package identity reads in Java/Kotlin source. Country
# gating on the SIM operator (MCC/MNC) and self package checks are how
# staged payloads decide which devices decrypt and run the next stage.
defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: android-sim-operator-read
    desc: Reads Android SIM operator code
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getSimOperator\s*\(\s*\)'
  - id: android-package-name-read
    desc: Calls Android getPackageName API
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getPackageName\s*\(\s*\)'
  - id: android-network-operator-read
    for: [java]
    desc: Reads Android network operator code
    crit: notable
    if:
      type: symbol
      kind: call
      exact: getNetworkOperator
  - id: android-network-country-read
    for: [java]
    desc: Reads Android network country code
    crit: notable
    if:
      type: symbol
      kind: call
      exact: getNetworkCountryIso
