# Android device and package identity reads in Java/Kotlin source. Country
# gating on the SIM operator (MCC/MNC) and self package checks are how
# staged payloads decide which devices decrypt and run the next stage.
defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: android-sim-operator-read
    desc: Reads Android SIM operator code
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getSimOperator\s*\(\s*\)'
  - id: android-package-name-read
    desc: Calls Android getPackageName API
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getPackageName\s*\(\s*\)'
  - id: android-network-operator-read
    for: [java]
    desc: Reads Android network operator code
    crit: notable
    if:
      type: symbol
      kind: call
      exact: getNetworkOperator
  - id: android-network-country-read
    for: [java]
    desc: Reads Android network country code
    crit: notable
    if:
      type: symbol
      kind: call
      exact: getNetworkCountryIso

  - id: android-build-model-read
    desc: Reads Android Build model field
    crit: notable
    for: [java]
    if:
      type: symbol
      kind: member
      exact: Build.MODEL
  - id: android-build-hardware-read
    desc: Reads Android Build hardware field
    crit: notable
    for: [java]
    if:
      type: symbol
      kind: member
      exact: Build.HARDWARE
  - id: android-build-manufacturer-read
    desc: Reads Android Build manufacturer field
    crit: notable
    for: [java]
    if:
      type: symbol
      kind: member
      exact: Build.MANUFACTURER
composite_rules:
  - id: android-build-device-profile
    desc: Reads Android manufacturer, model and hardware fields
    crit: notable
    for: [java]
    near_lines: 12
    all:
      - id: android-build-model-read
      - id: android-build-hardware-read
      - id: android-build-manufacturer-read
