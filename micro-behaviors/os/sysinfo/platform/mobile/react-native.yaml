# React Native device-profile APIs.  These are neutral collection capabilities;
# intent is supplied by objective composites that pair them with a sink.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: react-native-location-profile-api
    desc: React Native foreground location query
    if:
      type: text
      substr: Location.getCurrentPositionAsync

  - id: react-native-device-profile-api
    desc: React Native device identity query
    if:
      type: text
      substr: DeviceInfo.getUniqueId

  - id: react-native-mobile-security-api
    desc: React Native emulator state query
    if:
      type: text
      substr: DeviceInfo.isEmulator

composite_rules:
  - id: react-native-mobile-device-profile
    desc: React Native device and location profile
    crit: notable
    conf: 0.96
    all:
      - id: react-native-location-profile-api
      - id: react-native-device-profile-api
      - id: react-native-mobile-security-api
