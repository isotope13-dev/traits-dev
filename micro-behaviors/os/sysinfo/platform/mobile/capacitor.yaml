# Capacitor's standard Geolocation and Device plugins return native location
# and device data to any page running inside the app's WebView, including
# pages smuggled in through origin confusion (CVE-2026-103922 family). These
# are neutral collection capabilities; intent is supplied by objective
# composites that pair them with a sink. Case-sensitive plugin names keep the
# lowercase browser geolocation API in its own browser-platform home.
defaults:
  platforms: [unix, windows, android]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: capacitor-geolocation-plugin-call
    desc: Capacitor geolocation plugin query
    if:
      type: symbol
      kind: call
      regex: '(Capacitor\.Plugins\.)?Geolocation\.(getCurrentPosition|watchPosition)$'

  - id: capacitor-device-plugin-query
    desc: Capacitor device info plugin query
    if:
      type: symbol
      kind: call
      regex: '(Capacitor\.Plugins\.)?Device\.(getInfo|getLanguageCode|getBatteryInfo)$'

  - id: capacitor-html-geolocation-plugin-call
    for: [html]
    desc: HTML queries Capacitor geolocation plugin
    if:
      type: text
      exclude_html_comments: true
      regex: '\bGeolocation\s*\.\s*(getCurrentPosition|watchPosition)\s*\('

  - id: capacitor-html-device-plugin-query
    for: [html]
    desc: HTML queries Capacitor device plugin
    if:
      type: text
      exclude_html_comments: true
      regex: '\bDevice\s*\.\s*(getInfo|getLanguageCode|getBatteryInfo)\s*\('
