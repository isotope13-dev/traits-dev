# DEX call sites that read persistent telephony device identifiers. A read
# alone does not establish where the identifier is sent.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.95
traits:
  - id: dex-telephony-device-identifier-call
    desc: DEX reads a telephony device identifier
    if:
      type: symbol
      kind: call
      regex: '^Landroid/telephony/TelephonyManager;->(getDeviceId|getImei|getMeid|getSubscriberId)$'
