defaults:
  platforms: [android]
  for: [java, csharp]
  conf: 0.93


traits:
  - id: android-build-emulator-hardware-check
    desc: Checks Android hardware emulator identifiers
    crit: notable
    if:
      type: tree-sitter
      kind: call
      case_insensitive: true
      regex: '^(android\.os\.)?Build\.HARDWARE\.(contains|equals)\(\s*"(goldfish|ranchu)"'
