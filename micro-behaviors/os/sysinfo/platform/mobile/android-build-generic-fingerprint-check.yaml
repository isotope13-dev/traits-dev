defaults:
  platforms: [android]
  for: [java, csharp]
  conf: 0.93


traits:
  - id: android-build-generic-fingerprint-check
    desc: Checks Android generic-build fingerprint
    crit: notable
    if:
      type: tree-sitter
      kind: call
      case_insensitive: true
      regex: '^(android\.os\.)?Build\.FINGERPRINT\.(startsWith|contains)\(\s*"generic"'
