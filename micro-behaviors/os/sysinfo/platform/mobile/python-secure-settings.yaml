# Android Python uses Linux; the engine rejects Android-only Python scope.
# Flow loses the ANDROID_ID member here; bind receiver and argument structurally.
defaults:
  for:
  - python
  platforms:
  - linux
  - android
traits:
- id: python-android-secure-settings-class
  desc: Loads Android secure-settings Java class
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    exact: jclass
    arg:
      kind: string
      exact: android.provider.Settings$Secure
- id: python-android-id-getstring
  desc: Reads ANDROID_ID through a Java getString call
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    query: |-
      ((call function: (attribute object: (identifier) @receiver attribute: (identifier) @getter)
        arguments: (argument_list (_) (attribute object: (identifier) @same attribute: (identifier) @setting))) @evidence
        (#eq? @receiver @same) (#eq? @getter "getString") (#eq? @setting "ANDROID_ID"))
composite_rules:
- id: python-android-id-read
  desc: Android secure ID read through Java bridge
  crit: notable
  conf: 0.97
  near_bytes: 512
  all:
  - id: python-android-secure-settings-class
  - id: python-android-id-getstring
