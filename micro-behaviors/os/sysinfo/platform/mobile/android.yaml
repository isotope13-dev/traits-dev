defaults:
  for:
    - shell
    - python
    - javascript
    - elf
  platforms: [android, unix]
  crit: notable
  conf: 0.95
traits:
  - id: android-platform-paths
    desc: Multiple Android platform paths
    unless:
      - type: path
        regex: '/\\.zig-cache/|/zig-cache/|/build$'
    if:
      type: text
      # Shared certificate and timezone paths occur in portable Unix
      # libraries. Require Android-specific runtime locations instead of
      # treating every /system or /apex string as Android identity.
      regex: '^/data/data/'
  - id: android-product-property-reference
    desc: Reads Android product build properties
    crit: notable
    conf: 0.9
    for: [python, pyc]
    if:
      type: text
      regex: 'ro\.product\.(brand|model|manufacturer)'
    unless:
      - id: well-known/lib/media/skia::source-tree
  - id: android-version-property-reference
    desc: Reads Android version build property
    crit: notable
    conf: 0.9
    for: [python, pyc]
    if:
      type: text
      substr: ro.build.version.release

  - id: android-property-setter-call
    desc: Android system property setter call
    crit: notable
    conf: 0.94
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: text
      # Android uses lowercase `setprop`/`resetprop`; case-insensitive
      # matching turns ordinary JavaScript methods such as `setProp` into a
      # false Android signal.
      regex: '\b(setprop|resetprop)\b|\bSystemProperties\.set\s*\(|\bproperty_set\s*\('
    unless:
      # A generated TextMate grammar is a symbol table, not program logic:
      # its per-language alternation lists every keyword the language has.
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: android-phone-profile-property-keys
    desc: Android phone profile property keys
    crit: notable
    conf: 0.93
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: text
      regex: '(?i)\bro\.product\.(brand|manufacturer|model)\b|\bro\.build\.fingerprint\b'

  - id: android-phone-brand-property-key
    desc: Android phone brand property key
    crit: notable
    conf: 0.9
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: string_literal
      exact: ro.product.brand

  - id: android-phone-manufacturer-property-key
    desc: Android phone manufacturer property key
    crit: notable
    conf: 0.9
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: string_literal
      exact: ro.product.manufacturer

  - id: android-phone-model-property-key
    desc: Android phone model property key
    crit: notable
    conf: 0.9
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: string_literal
      exact: ro.product.model

  - id: android-phone-fingerprint-property-key
    desc: Android build fingerprint property key
    crit: notable
    conf: 0.9
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: string_literal
      exact: ro.build.fingerprint

  - id: android-runtime-setprop-exec
    desc: Runtime executes Android property setter
    crit: notable
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      regex: '(?i)Runtime\.getRuntime\(\)\.exec.{0,80}\b(setprop|resetprop)\b'

  - id: android-resetprop-chipset-delete
    desc: Deletes Android chipset property
    crit: suspicious
    conf: 0.95
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: text
      regex: '(?i)\bresetprop\b.{0,64}--delete.{0,24}\bro\.(board\.platform|hardware)\b'

  - id: android-setprop-chipset-empty
    desc: Clears Android chipset property
    crit: suspicious
    conf: 0.95
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: text
      regex: '(?i)\bsetprop\b.{0,64}\bro\.(board\.platform|hardware)\b.{0,24}""'

  - id: android-chipset-property-clear-api
    desc: Android chipset property clear API
    crit: suspicious
    conf: 0.93
    for: [elf, apk, python, javascript, java, kotlin, c, cpp]
    if:
      type: text
      regex: '(?i)\b(SystemProperties\.set|property_set)\s*\(.{0,72}\bro\.(board|hardware)\b'
composite_rules:
  - id: android-build-property-profile
    desc: Reads multiple Android build properties
    crit: notable
    conf: 0.93
    for: [python, pyc]
    all:
      - id: android-product-property-reference
      - id: android-version-property-reference

  - id: android-chipset-property-clearing
    desc: Clears Android chipset identity properties
    crit: suspicious
    conf: 0.96
    any:
      - id: android-resetprop-chipset-delete
      - id: android-setprop-chipset-empty
      - id: android-chipset-property-clear-api

  - id: android-phone-profile-property-cluster
    desc: Android phone profile property cluster
    crit: notable
    conf: 0.95
    all:
      - id: android-phone-manufacturer-property-key
      - id: android-phone-model-property-key
      - id: android-phone-fingerprint-property-key
