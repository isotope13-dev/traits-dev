defaults:
  for: [java]
  platforms: [android]
  crit: notable

traits:
  - id: build-model-member
    desc: Reads Android Build model
    if:
      type: symbol
      kind: member
      exact: Build.MODEL

  - id: build-manufacturer-member
    desc: Reads Android Build manufacturer
    if:
      type: symbol
      kind: member
      exact: Build.MANUFACTURER

composite_rules:
  - id: build-device-profile
    desc: Reads Android manufacturer and model
    all:
      - id: build-model-member
      - id: build-manufacturer-member
