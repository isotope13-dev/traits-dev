# Timing-Based APIs - Windows
# ATT&CK: T1497.003 (Virtualization/Sandbox Evasion: Time Based Evasion)
# MBC: B0003.003 (Time Based Evasion)
#
# Additional timing-related APIs not covered by micro-behaviors/time/timing/delay.
# NOTE: GetTickCount64, GetSystemTime, GetLocalTime, QueryPerformanceCounter
# already exist in micro-behaviors/time/timing/delay/traits.yaml.
#
# Composite rules that reference objectives/ are in:
# objectives/anti-analysis/timing/evasion/windows.yaml
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: kuser-shared-data
    desc: KUSER_SHARED_DATA base instruction operand
    crit: notable
    conf: 0.85
    arch: [x86, x86-64]
    if:
      type: hex
      section: .text
      # A bare DWORD also occurs inside compressed streams. Require an
      # immediate-address or absolute-memory operand, including SIB addressing.
      # This records the base operand, not a timing query or an evasion check.
      pattern: >-
        (A0|A1|A2|A3|68|B8|B9|BA|
        BB|BC|BD|BE|BF|8B 05|8B 0D|8B 15|
        8B 1D|8B 25|8B 2D|8B 35|8B 3D|89 05|89 0D|89 15|
        89 1D|89 25|89 2D|89 35|89 3D|8D 05|8D 0D|8D 15|
        8D 1D|8D 25|8D 2D|8D 35|8D 3D|39 05|39 0D|39 15|
        39 1D|39 25|39 2D|39 35|39 3D|3B 05|3B 0D|3B 15|
        3B 1D|3B 25|3B 2D|3B 35|3B 3D|85 05|85 0D|85 15|
        85 1D|85 25|85 2D|85 35|85 3D|FF 05|FF 0D|FF 15|
        FF 1D|FF 25|FF 2D|FF 35|FF 3D|C7 05|8B 04 25|8B 0C 25|
        8B 14 25|8B 1C 25|8B 24 25|8B 2C 25|8B 34 25|8B 3C 25|89 04 25|89 0C 25|
        89 14 25|89 1C 25|89 24 25|89 2C 25|89 34 25|89 3C 25|8D 04 25|8D 0C 25|
        8D 14 25|8D 1C 25|8D 24 25|8D 2C 25|8D 34 25|8D 3C 25) 00 00 FE 7F
    unless:
      - id: metadata/binary/framework/

# NOTE: Composite rules moved to objectives/anti-analysis/timing/evasion/windows.yaml
# because they reference objectives-tier rules (rdtsc detection)
