defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
  attack: T1082

traits:
  # Reading these Linux pseudo-files is a neutral host-identification
  # capability. Anti-analysis rules must add independent evasion evidence.
  - id: linux-hypervisor-info-path
    desc: Linux hypervisor information path reference
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '/sys/hypervisor(/(type|uuid))?\b'
