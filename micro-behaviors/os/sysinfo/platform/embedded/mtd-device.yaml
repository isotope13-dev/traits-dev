defaults:
  for:
    - shell
    - python
    - javascript
    - elf
  platforms:
    - linux
    - embedded
  crit: notable
  conf: 0.9
traits:
  - id: mtd-device-paths
    desc: Multiple literal MTD device paths
    if:
      type: literal
      regex: '/dev/mtd|/mnt/mtd/'
    unless:
      - id: micro-behaviors/hardware/flash/device/
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - type: section
        exact: .modinfo
