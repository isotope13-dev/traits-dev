# Existing observations, grouped by the behavior they establish.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  attack: T1082

traits:
  - id: python-platform-branch
    desc: Python branches on OS platform
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)(platform\.system\(\)|sys\.platform)[^\n]{0,120}(Windows|Darwin|Linux)'
