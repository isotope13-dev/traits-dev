defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: npm-preinstall-platform-win32-check
  desc: JavaScript branches on Windows platform
  crit: notable
  conf: 0.85
  attack: "T1082"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "platform\\s*===\\s*['\"]win32['\"]"
- id: js-arch-x64-check
  desc: JavaScript checks for x64 architecture
  crit: notable
  conf: 0.85
  if:
    type: value
    path: "scripts.preinstall"
    regex: "arch\\s*===\\s*['\"]x64['\"]"
