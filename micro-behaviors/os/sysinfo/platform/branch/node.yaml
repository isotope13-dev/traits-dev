# Existing observations, grouped by the behavior they establish.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: baseline

traits:
  - id: js-platform-win32-check
    desc: Checks whether Node.js runs on Windows
    conf: 0.6
    crit: baseline
    if:
      type: text
      regex: "process\\.platform\\s*===?\\s*['\"]win32['\"]"
  - id: js-platform-darwin-check
    desc: process.platform macOS check
    conf: 0.6
    crit: baseline
    if:
      type: text
      regex: "(process\\.platform|os\\.platform\\(\\))\\s*===?\\s*['\"]darwin['\"]"
  - id: js-platform-linux-check
    desc: process.platform Linux check
    conf: 0.6
    crit: baseline
    if:
      type: text
      regex: "(process\\.platform|os\\.platform\\(\\))\\s*===?\\s*['\"]linux['\"]"
  - id: os-platform-switch
    desc: switch on os.platform()
    conf: 0.75
    crit: notable
    if:
      type: text
      regex: "switch\\s*\\(\\s*os\\.platform\\(\\)\\s*\\)"
  - id: node-platform-win32-branch
    desc: Branches on Windows platform value
    conf: 0.7
    crit: baseline
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]{0,32}\s*===?\s*[''"]win32[''"]'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: node-platform-darwin-branch
    desc: Branches on macOS platform value
    conf: 0.7
    crit: baseline
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]{0,32}\s*===?\s*[''"]darwin[''"]'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: node-platform-linux-branch
    desc: Branches on Linux platform value
    conf: 0.7
    crit: baseline
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]{0,32}\s*===?\s*[''"]linux[''"]'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/

composite_rules:
  - id: multi-platform-branch
    desc: Multi-platform OS branching logic
    crit: notable
    conf: 0.8
    mbc: E1082
    attack: T1082
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/platform/branch::js-platform-darwin-check
      - id: micro-behaviors/os/sysinfo/platform/branch::js-platform-linux-check
      - id: micro-behaviors/os/sysinfo/platform/branch::js-platform-win32-check
      - id: micro-behaviors/os/sysinfo/platform/branch::os-platform-switch
  - id: node-os-platform-alias-branch
    desc: Node OS alias platform branch
    crit: notable
    conf: 0.82
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::node-platform-method-call
    any:
      - id: micro-behaviors/os/sysinfo/platform/branch::node-platform-darwin-branch
      - id: micro-behaviors/os/sysinfo/platform/branch::node-platform-linux-branch
      - id: micro-behaviors/os/sysinfo/platform/branch::node-platform-win32-branch
    needs: 2
