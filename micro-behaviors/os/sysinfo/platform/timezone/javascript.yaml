# JavaScript timezone comparisons are ordinary locale/date behavior. They
# become geofencing only when a separate objective ties them to a hostile
# activation or termination path.
defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]
  attack: T1614

traits:
  - id: js-iana-timezone-comparison
    desc: JavaScript compares an IANA timezone value
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      kind: conditional
      regex: '(?is)\b(timezone|tz)\b\s*(===|!==|==|!=)\s*["''][A-Za-z_]+/[A-Za-z_]+'
    unless:
      # TZ is an explicit runtime/test selector, not a host-timezone query.
      - type: tree-sitter
        language: javascript
        kind: conditional
        regex: '(?is)\bprocess\.env\.TZ\b\s*(===|!==|==|!=)'
