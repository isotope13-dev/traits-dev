# Python host-timezone queries. These are neutral capabilities; the
# geofencing objective combines them with an actual timezone comparison.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1614.001

traits:
  - id: python-local-timezone-query
    desc: Python queries local timezone
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: datetime.now.astimezone

  - id: python-tzlocal-query
    desc: Python queries timezone through tzlocal
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: tzlocal.get_localzone

  # Alone this only proves an IANA zone appears in a conditional -- market-
  # hours checks are ordinary trading logic. The geofencing objective pairs it
  # with a host-timezone query (python-timezone-gate).
  - id: python-timezone-literal-comparison
    desc: Python compares a timezone to IANA literal
    platforms: [windows, linux, macos]
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[ \t]*if.{0,80}(zone|tz).{0,50}(==|!=|in).{0,50}["''][A-Za-z_]+/[A-Za-z_]+["'']'
    unless:
    # Constructed zone objects (pytz/ZoneInfo) are session calendars, not
    # host TZ geofencing against a string literal.
    - type: text
      regex: '(?im)(==|!=)\s*(pytz\.timezone|zoneinfo\.ZoneInfo)\s*\('
