defaults:
  platforms: [unix]

composite_rules:
  - id: shell-host-timezone-branch
    desc: Timezone query near a shell comparison
    crit: notable
    conf: 0.96
    for:
    - shell
    all:
    - id: micro-behaviors/os/sysinfo/platform/timezone::timedatectl-timezone-query
    - id: micro-behaviors/os/sysinfo/platform/timezone::shell-timezone-comparison
    near_lines: 12
