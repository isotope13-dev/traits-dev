# Unix shell host-timezone queries. The query itself is neutral; geofenced
# destructive behavior is inferred by an objective composite that combines it
# with a real timezone comparison and destructive payload.
defaults:
  crit: notable
  conf: 0.95
  platforms: [unix]
  for: [shell]
  attack: T1614.001

traits:
  - id: shell-timezone-comparison
    desc: Shell compares a timezone-specific variable
    if:
      type: text
      # ZONE alone commonly means a cloud availability zone.
      regex: '(?im)^\s*if\s+\[.{0,160}\b(TZ|TIMEZONE)\b.{0,160}\];\s*then\b'

  - id: timedatectl-timezone-query
    desc: Queries host timezone with timedatectl
    if:
      type: symbol
      kind: call
      exact: timedatectl
      arg:
        kind: identifier
        name: show
