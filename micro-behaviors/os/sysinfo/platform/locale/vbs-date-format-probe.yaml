# VBScript parses a fixed ambiguous short date such as "01/07/12" with Year,
# Month, Day, CDate or DateValue. The parse follows the system short-date
# order, so the result reveals the regional date format of the host.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1614.001

traits:
  - id: vbs-fixed-short-date-parse
    desc: VBScript parses a fixed ambiguous short date
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(Year|Month|Day|CDate|DateValue)\s*\(\s*"\d{1,2}/\d{1,2}/\d{2}"\s*\)'
