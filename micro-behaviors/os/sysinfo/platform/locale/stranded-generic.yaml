# Neutral observations reviewed from stranded members.
composite_rules:
- id: windows-locale-api-set
  desc: Windows locale API import set
  crit: baseline
  conf: 0.9
  for:
  - pe
  platforms:
  - windows
  all:
  - id: micro-behaviors/os/sysinfo/platform/locale::get-locale-info
  - id: micro-behaviors/os/sysinfo/platform/locale::get-user-default-lcid
  any:
  - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-locales-symbol
  - id: micro-behaviors/os/env/enumeration::environment-block-enumeration
  unless:
  - id: well-known/tool/browser::google-chrome-browser-context
  - id: well-known/app/browser/chromium-updater::chromiumbrowser-updater-binary
