defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: locale-memory-wpf-version-profile
    desc: Locale API memory APIs and WPF claim
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-time-formats-ex
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
    any:
      - id: metadata/binary/provenance/version-info::pe-version-wpf-description-claim
      - id: metadata/binary/provenance/version-info::pe-version-wpf-product-claim
    unless:
      - id: metadata/lang/compiler/managed::dotnet-assembly
