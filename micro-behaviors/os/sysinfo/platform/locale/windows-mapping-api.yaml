# Windows locale and character-mapping APIs. These sat under os/env/access
# because the environment block and the locale APIs are neighbours in the
# Win32 surface, but reading a locale ID is not reading an environment
# variable. The source file's `defaults:` travel with them so their
# effective scope is unchanged.
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  - id: locale-name-to-lcid
    desc: Locale name to code conversion
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: "LocaleNameToLCID"
  - id: lcmap-string-ex
    desc: Locale-aware string mapping
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: "LCMapStringEx"
  - id: lcmap-string-w
    desc: Unicode string locale mapping
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: "LCMapStringW"
  - id: get-string-type-w
    desc: Get Unicode character type
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: "GetStringTypeW"
  # === System Information ===
  - id: are-file-apis-ansi
    desc: File API ANSI check
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: "AreFileApisANSI"
