# Callback Execution via Enum APIs (Windows)
# Enumeration APIs that accept function pointers, often abused for stealthy code execution
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: enum-ui-languages
    desc: Enumerate UI languages API reference
    if:
      type: symbol
      regex: "^EnumUILanguages[AW]$"
  - id: enum-date-formats
    desc: Enumerate date formats API reference
    if:
      type: symbol
      exact: "EnumDateFormatsA"
  - id: enum-time-formats-ex
    desc: EnumTimeFormatsEx callback API import
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: import
      exact: EnumTimeFormatsEx
  - id: enum-time-formats-ex-call
    desc: EnumTimeFormatsEx callback call in source
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, rust]
    if:
      type: symbol
      kind: call
      exact: EnumTimeFormatsEx
  - id: enum-system-codepages
    desc: EnumSystemCodePages callback API import
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: import
      regex: '^EnumSystemCodePages[AW]$'
  - id: enum-system-codepages-call
    desc: EnumSystemCodePages callback call in source
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, rust]
    if:
      type: symbol
      kind: call
      regex: '^EnumSystemCodePages[AW]$'
  - id: enum-language-group-locales
    desc: 'Enumerate language group locales'
    if:
      type: symbol
      regex: "^EnumLanguageGroupLocales[AW]$"
  - id: enum-system-locales-symbol
    desc: EnumSystemLocales callback API import
    crit: notable
    conf: 0.7
    if:
      type: symbol
      regex: '^EnumSystemLocales[AW]$'
    unless:
      - id: well-known/app/system/drivers/nvidia::ngx-dll-basename
    downgrade:
      any:
        - id: metadata/signed/unknown::cisco-systems
        - id: metadata/signed/leaf::cisco-systems-inc.
