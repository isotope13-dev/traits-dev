traits:
- id: python-belarus-locale-reference
  desc: Belarus locale code marker
  if:
    type: text
    substr: be_BY
- id: python-kazakhstan-locale-reference
  desc: Kazakhstan locale code marker
  if:
    type: text
    substr: kk_KZ
- id: python-russian-locale-reference
  desc: Russian locale code marker
  if:
    type: text
    substr: ru_RU
- id: python-ukrainian-locale-reference
  desc: Ukrainian locale code marker
  if:
    type: text
    substr: uk_UA
composite_rules:
- id: python-query-with-cis-locale-reference
  desc: Python locale query beside CIS locale text
  all:
  - id: micro-behaviors/os/sysinfo/platform/locale::python-locale-query
  near_lines: 25
  any:
  - id: micro-behaviors/os/sysinfo/platform/locale::python-belarus-locale-reference
  - id: micro-behaviors/os/sysinfo/platform/locale::python-kazakhstan-locale-reference
  - id: micro-behaviors/os/sysinfo/platform/locale::python-russian-locale-reference
  - id: micro-behaviors/os/sysinfo/platform/locale::python-ukrainian-locale-reference
defaults:
  for:
  - python
  platforms:
  - windows
  - unix
  conf: 0.9
  crit: notable
