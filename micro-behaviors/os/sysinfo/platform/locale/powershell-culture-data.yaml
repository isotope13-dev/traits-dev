# Locale name text without a demonstrated key derivation.
defaults:
  platforms:
  - windows
  for:
  - data
traits:
- id: powershell-culture-english-name-text
  desc: PowerShell culture EnglishName text
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)Get-Culture.{0,80}EnglishName|et-Cul.{0,80}ture.{0,160}eN.{0,12}lIsHName
