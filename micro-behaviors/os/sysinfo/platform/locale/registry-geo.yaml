# The per-user Geo key holds the region the user selected in Windows,
# a common country gate for geofenced payload or config selection.
defaults:
  platforms: [windows]
  for: [batch, powershell, vbs, javascript]
  attack: T1614.001

traits:
  - id: registry-user-geo-key
    desc: Reads the per-user Windows region key
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)Control Panel\\International\\Geo\b'
