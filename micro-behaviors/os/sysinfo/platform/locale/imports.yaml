defaults:
  crit: baseline
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: get-locale-info-import
    desc: Query locale information
    conf: 0.86
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: "GetLocaleInfoW"
  - id: enum-system-locales-import
    desc: Enumerate installed locales
    conf: 0.84
    if:
      type: symbol
      exact: "EnumSystemLocalesW"
composite_rules:
  - id: locale-query-imports
    desc: Imports several locale query APIs
    conf: 0.92
    all:
      - id: get-locale-info-import
      - id: micro-behaviors/os/sysinfo/platform/locale::get-user-default-lcid
      - id: enum-system-locales-import
