# Source-level counterparts to the Win32 locale-query traits in windows-api.yaml,
# which only cover compiled PE/DLL imports. Querying the machine's locale is a
# neutral capability — SDL2's src/locale/windows/SDL_syslocale.c exists to do
# exactly this — so these stay here rather than in a malware-family directory.
# Locale-gated destructive or geofenced behaviour is expressed by composites in
# objectives/ that reference these atoms alongside their payload evidence.
defaults:
  platforms: [windows]
  for: [source]
  attack: T1614.001
  crit: baseline
  conf: 0.9

traits:
  - id: get-locale-info-source
    desc: GetLocaleInfoA reference in source
    if:
      type: text
      word: GetLocaleInfoA
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source

  - id: locale-icountry-source
    desc: LOCALE_ICOUNTRY constant in source
    if:
      type: text
      word: LOCALE_ICOUNTRY
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
