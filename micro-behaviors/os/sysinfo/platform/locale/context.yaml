composite_rules:
- id: windows-locale-time-process-api-cluster
  desc: Windows locale, time and process-context API references
  crit: notable
  conf: 0.9
  for:
  - pe
  platforms:
  - windows
  all:
  - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
  - id: micro-behaviors/time/query::get-system-time-as-filetime
  any:
  - id: micro-behaviors/os/env/enumeration::environment-block-enumeration
  - id: micro-behaviors/process/info/commandline::get-command-line
