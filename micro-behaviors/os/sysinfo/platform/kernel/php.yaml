defaults:
  platforms: [unix]
  for: [php]
  crit: notable
  conf: 0.97

traits:
  - id: php-uname-command-execution
    desc: PHP process command begins with uname -a
    if:
      type: symbol
      kind: call
      regex: '^(proc_open|system|shell_exec|exec)$'
      arg:
        index: 0
        from:
          whole_value: '^\s*(/usr/bin/)?uname\s+-a([;&| \t]|$)'
