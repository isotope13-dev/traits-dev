# Include decoded shell command text, which may lack a parsed call view.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: shell-uname-all-command-text
    desc: uname -a command at a shell boundary
    if:
      type: text
      regex: '(^|[;&|]\s*)uname\s+-a\b'
