defaults:
  for: [elf, macho, c, cpp]
  crit: notable
  platforms:
    - unix
traits:
  - id: uname
    desc: uname symbol reference
    conf: 0.6
    mbc: E1082
    attack: T1082
    if:
      type: symbol
      exact: uname

  - id: rust-uname-command
    desc: Rust runs uname for system information
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: text
      substr: 'Command::new("uname")'

  - id: arm-eabi-uname
    desc: ARM EABI direct uname(2) wrapper
    crit: notable
    conf: 0.99
    for: [elf]
    platforms: [linux]
    arch: [arm]
    if:
      type: hex
      section: ".text"
      # mov r7, 122; svc 0 (Linux ARM EABI uname)
      pattern: "7a 70 a0 e3 00 00 00 ef"

  - id: kernel-image-path
    desc: References Linux kernel image (vmlinux) paths

    for: [shell, python, c, cpp, elf]
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '/boot/vmlinux-|/sys/kernel/btf/vmlinux|/lib/modules/.{1,160}/vmlinux'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
  - id: kernel-vmlinux-reference
    desc: References vmlinux BTF kernel metadata

    for: [shell, python, c, cpp, elf]
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?i)vmlinux.{0,40}(BTF|kernel)'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script

  - id: kernel-build-config-path
    desc: References Linux kernel build config paths
    platforms: [linux]
    for: [shell, python, c, cpp, go, rust, elf]
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '/proc/config\.gz\b|/boot/config-[^"''\n]{1,50}|/lib/modules/[^"''\n]{1,80}/build/\.config'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
