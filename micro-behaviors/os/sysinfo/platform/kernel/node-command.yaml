defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: node-uname-command
    desc: Node exec call names uname command
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(execSync|exec)$'
      arg:
        index: 0
        kind: string
        regex: '^uname(\s|$)'
