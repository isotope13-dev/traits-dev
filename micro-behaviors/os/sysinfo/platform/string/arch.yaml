defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - elf
  crit: baseline
  mbc: E1082
  attack: T1082
traits:
- id: arch-x86-64
  desc: x86_64 architecture string
  conf: 0.3
  if:
    type: text
    substr: x86_64
  unless:
  - id: metadata/build/autotools::autoconf-m4-macro-definition
- id: arch-aarch64
  desc: aarch64 architecture string
  conf: 0.3
  platforms:
  - unix
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z0-9_.-])aarch64([^A-Za-z0-9_.-]|$)'
  unless:
  - id: metadata/build/autotools::autoconf-m4-macro-definition
- id: arch-i386
  desc: i386 architecture string
  conf: 0.3
  if:
    type: text
    word: i386
  unless:
  - id: metadata/build/autotools::autoconf-m4-macro-definition
- id: arch-arm-dup
  desc: arm architecture string
  conf: 0.3
  platforms:
  - unix
  if:
    type: text
    word: arm
  unless:
  - id: metadata/build/autotools::autoconf-m4-macro-definition
- id: riscv32-architecture-string
  desc: RISC-V32 architecture target string
  crit: component
  conf: 0.8
  if:
    type: text
    exact: riscv32
- id: mips64-architecture-string
  desc: MIPS64 architecture target string
  crit: component
  conf: 0.8
  if:
    type: text
    exact: mips64
- id: arm-family-architecture-targets
  desc: ARM architecture target strings
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)\\barm[4-8]\\b'
- id: mipsel-architecture-target-string
  desc: MIPS little-endian target string
  crit: component
  conf: 0.8
  if:
    type: text
    exact: mipsel
- id: sh4-architecture-target-string
  desc: SuperH4 architecture target string
  crit: component
  conf: 0.8
  if:
    type: text
    exact: sh4
- id: multi-architecture-payload-suffix-catalog
  desc: Multi-architecture payload suffix list
  crit: notable
  conf: 0.95
  platforms:
  - linux
  - android
  for:
  - elf
  if:
    type: hex
    section: .rodata
    pattern: '2E 61 72 6D [1-4] 2E 61 72 6D 34 [1-4] 2E 61 72 6D 35 [1-4] 2E 61 72 6D 36 [1-4] 2E 61 72 6D 37 [1-4] 2E 6D 69 70 73 [1-4] 2E 6D 69 70 73 65 6C'
- id: architecture-payload-arm-suffix
  desc: Architecture-suffixed ARM payload name
  crit: component
  conf: 0.9
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '(?i)\b[A-Za-z0-9_-]{3,32}\.arm[0-9]*\b'
- id: architecture-payload-mips-suffix
  desc: Architecture-suffixed MIPS payload name
  crit: component
  conf: 0.9
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '(?i)\b[A-Za-z0-9_-]{3,32}\.(mips|mpsl)\b'
- id: architecture-payload-x86-suffix
  desc: Architecture-suffixed x86 payload name
  crit: component
  conf: 0.9
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '(?i)\b[A-Za-z0-9_-]{3,32}\.(x86(_64)?|i[3-6]86)\b'
- id: architecture-payload-risc-suffix
  desc: RISC payload name with architecture suffix
  crit: component
  conf: 0.9
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '(?i)\b[A-Za-z0-9_-]{3,32}\.(ppc|sh4|m68k)\b'
- id: multi-architecture-payload-name-catalog--x86-or-mips
  desc: x86 or MIPS architecture-specific payload name
  crit: component
  conf: 0.95
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '\breal_(x86(_64)?|mips(el)?)\b'
- id: multi-architecture-payload-name-catalog--arm-or-x86
  desc: ARM or x86 architecture-specific payload name
  crit: component
  conf: 0.95
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '\breal_(armv[4-8]l|i[3-6]86)\b'
- id: multi-architecture-payload-name-catalog--power-or-sh
  desc: PowerPC or SH architecture-specific payload name
  crit: component
  conf: 0.95
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '\breal_(powerpc|ppc(64)?|sh4)\b'
- id: multi-arch-runtime-wordlist--x86-or-mips
  desc: Shell x86 or MIPS architecture selector
  crit: component
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)[._/|:-](x86(_64)?|mips[a-z]*|mpsl)\b'
- id: multi-arch-runtime-wordlist--arc-or-arm
  desc: Shell ARC or ARM architecture selector
  crit: component
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)[._/|:-](arc|arm\w*|i[3-6]86)\b'
- id: multi-arch-runtime-wordlist--m68k-or-power
  desc: Shell M68K, PowerPC, or SH architecture selector
  crit: component
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)[._/|:-](m68k|ppc\w*|sh4)\b'
composite_rules:
- id: repeated-architecture-suffixed-payload-names
  desc: Payload names span three processor families
  crit: notable
  conf: 0.96
  platforms: [linux, android]
  for: [elf]
  needs: 3
  any:
  - id: architecture-payload-arm-suffix
  - id: architecture-payload-mips-suffix
  - id: architecture-payload-x86-suffix
  - id: architecture-payload-risc-suffix
- id: multi-architecture-target-list
  desc: Multi-architecture executable target list
  crit: notable
  conf: 0.92
  platforms: [linux, android]
  for: [elf]
  needs: 3
  any:
  - id: arch-x86-64
  - id: arm-family-architecture-targets
  - id: mips64-architecture-string
  - id: mipsel-architecture-target-string
  - id: riscv32-architecture-string
  - id: sh4-architecture-target-string
- id: multi-architecture-payload-name-catalog
  desc: Architecture-specific payload name catalog
  crit: notable
  conf: 0.95
  platforms: [linux, android]
  for: [elf]
  any:
  - id: multi-architecture-payload-name-catalog--x86-or-mips
  - id: multi-architecture-payload-name-catalog--arm-or-x86
  - id: multi-architecture-payload-name-catalog--power-or-sh
- id: multi-arch-runtime-wordlist
  desc: Shell lists architecture selector names
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  any:
  - id: multi-arch-runtime-wordlist--x86-or-mips
  - id: multi-arch-runtime-wordlist--arc-or-arm
  - id: multi-arch-runtime-wordlist--m68k-or-power
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/lang/compiled/
  - id: metadata/file/extension/identity::squashfs-container-filename
