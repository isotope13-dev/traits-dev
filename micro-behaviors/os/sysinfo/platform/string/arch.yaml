defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - elf
  crit: baseline
  mbc: E1082
  attack: T1082
traits:
- id: arch-x86-64
  desc: x86_64 architecture string
  conf: 0.3
  if:
    type: text
    substr: x86_64
  unless:
  - id: metadata/build/autotools::autoconf-m4-macro-definition
# The linux_x86_64 platform tag names Python wheel and build targets; a
# botnet report lists it beside sample names, but so does any wheel index.
- id: linux-x86-64-platform-tag
  desc: linux_x86_64 platform tag
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [html]
  if:
    type: text
    word: linux_x86_64
    case_insensitive: true
- id: arch-aarch64
  desc: aarch64 architecture string
  conf: 0.3
  platforms:
  - unix
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z0-9_.-])aarch64([^A-Za-z0-9_.-]|$)'
  unless:
  - id: metadata/build/autotools::autoconf-m4-macro-definition
- id: arch-i386
  desc: i386 architecture string
  conf: 0.3
  if:
    type: text
    word: i386
  unless:
  - id: metadata/build/autotools::autoconf-m4-macro-definition
- id: arch-arm-dup
  desc: arm architecture string
  conf: 0.3
  platforms:
  - unix
  if:
    type: text
    word: arm
  unless:
  - id: metadata/build/autotools::autoconf-m4-macro-definition
- id: riscv32-architecture-string
  desc: RISC-V32 architecture target string
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: riscv32
- id: mips64-architecture-string
  desc: MIPS64 architecture target string
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: mips64
- id: arm-family-architecture-targets
  desc: ARM architecture target strings
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)\\barm[4-8]\\b'
- id: mipsel-architecture-target-string
  desc: MIPS little-endian target string
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: mipsel
- id: sh4-architecture-target-string
  desc: SuperH4 architecture target string
  crit: component
  conf: 0.8
  if:
    type: text
    exact: sh4
- id: multi-architecture-payload-suffix-catalog
  desc: Multi-architecture payload suffix list
  crit: notable
  conf: 0.95
  platforms:
  - linux
  - android
  for:
  - elf
  if:
    type: hex
    section: .rodata
    pattern: '2E 61 72 6D [1-4] 2E 61 72 6D 34 [1-4] 2E 61 72 6D 35 [1-4] 2E 61 72 6D 36 [1-4] 2E 61 72 6D 37 [1-4] 2E 6D 69 70 73 [1-4] 2E 6D 69 70 73 65 6C'
# The separator is `.`, `_` or `-`, not just `.`: Mirai-lineage droppers ship
# `bot.arm7`, `main_arm7` and `ohshit-arm7` interchangeably, and a dot-only
# matcher silently misses two thirds of them (Condi's catalogue is entirely
# `main_<arch>`). The arch token must end the run or be followed by a
# non-word, non-hyphen byte, which keeps target triples such as
# `ld-linux-armhf` and `arm-linux-gnueabi` out.
- id: multi-architecture-payload-name-catalog--x86-or-mips
  desc: x86 or MIPS architecture-specific payload name
  crit: notable
  conf: 0.95
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '\breal_(x86(_64)?|mips(el)?)\b'
- id: multi-architecture-payload-name-catalog--arm-or-x86
  desc: ARM or x86 architecture-specific payload name
  crit: notable
  conf: 0.95
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '\breal_(armv[4-8]l|i[3-6]86)\b'
- id: multi-architecture-payload-name-catalog--power-or-sh
  desc: PowerPC or SH architecture-specific payload name
  crit: notable
  conf: 0.95
  platforms: [linux, android]
  for: [elf]
  if:
    type: text
    regex: '\breal_(powerpc|ppc(64)?|sh4)\b'
- id: shell-x86-architecture-reference
  desc: Delimited shell x86 architecture reference
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)(^|[\s._/|:"''-])(x86(_64)?|i[3-6]86)\b'
- id: shell-mips-architecture-reference
  desc: Delimited shell mips architecture reference
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)(^|[\s._/|:"''-])(mips[a-z]*|mpsl)\b'
- id: shell-arm-architecture-reference
  desc: Delimited shell arm architecture reference
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)(^|[\s._/|:"''-])arm\w*\b'
- id: shell-arc-architecture-reference
  desc: Delimited shell arc architecture reference
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)(^|[\s._/|:"''-])arc\b'
- id: shell-m68k-architecture-reference
  desc: Delimited shell m68k architecture reference
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)(^|[\s._/|:"''-])m68k\b'
- id: shell-powerpc-architecture-reference
  desc: Delimited shell powerpc architecture reference
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)(^|[\s._/|:"''-])(ppc\w*|powerpc\w*)\b'
- id: shell-superh-architecture-reference
  desc: Delimited shell superh architecture reference
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  if:
    type: text
    regex: '(?i)(^|[\s._/|:"''-])sh4\b'
composite_rules:
- id: multi-architecture-target-list
  desc: Multi-architecture executable target list
  crit: notable
  conf: 0.92
  platforms: [linux, android]
  for: [elf]
  needs: 3
  any:
  - id: arch-x86-64
  - id: arm-family-architecture-targets
  - id: mips64-architecture-string
  - id: mipsel-architecture-target-string
  - id: riscv32-architecture-string
  - id: sh4-architecture-target-string
- id: multi-architecture-payload-name-catalog
  desc: Architecture-specific payload name catalog
  crit: notable
  conf: 0.95
  platforms: [linux, android]
  for: [elf]
  any:
  - id: multi-architecture-payload-name-catalog--x86-or-mips
  - id: multi-architecture-payload-name-catalog--arm-or-x86
  - id: multi-architecture-payload-name-catalog--power-or-sh
- id: multi-arch-runtime-wordlist
  needs: 2
  desc: "Shell references multiple CPU architecture families"
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix, android]
  any:
  - id: shell-x86-architecture-reference
  - id: shell-mips-architecture-reference
  - id: shell-arm-architecture-reference
  - id: shell-arc-architecture-reference
  - id: shell-m68k-architecture-reference
  - id: shell-powerpc-architecture-reference
  - id: shell-superh-architecture-reference
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/lang/compiled/
  - id: metadata/file/extension/identity::squashfs-container-filename
