defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: shell-target-linux-gnu
    desc: References linux-gnu target identifier
    crit: baseline
    conf: 0.8
    for: [shell]
    if:
      type: text
      word: linux-gnu
  - id: shell-platform-darwin
    desc: References Darwin platform token
    crit: baseline
    conf: 0.8
    for: [shell]
    if:
      type: text
      word: darwin
  - id: shell-platform-msys
    desc: References MSYS platform token
    crit: baseline
    conf: 0.8
    for: [shell]
    if:
      type: text
      word: msys
  - id: shell-platform-cygwin
    desc: References Cygwin platform token
    crit: baseline
    conf: 0.8
    for: [shell]
    if:
      type: text
      word: cygwin
  - id: os-string-windows
    desc: Windows platform string
    crit: baseline
    conf: 0.4
    if:
      type: string_literal
      substr: Windows
    unless:
      - id: metadata/file/catalog/identity/
      - id: metadata/lang/source/
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: well-known/lib/format/protobuf-ts
      - type: text
        substr: on Windows ensure PowerShell is available
      - type: text
        regex: 'User-Agent:\s*Mozilla/5\.0\s*\(Windows NT'
  - id: os-string-linux
    desc: Linux platform string
    crit: baseline
    conf: 0.6
    if:
      type: string_literal
      substr: Linux
    unless:
      - id: metadata/lang/source/
      - id: well-known/lib/cloud/aws-sdk-ruby::namespace
  - id: os-string-darwin
    desc: Darwin platform string
    crit: baseline
    conf: 0.6
    if:
      type: string_literal
      substr: Darwin
    unless:
      - id: metadata/lang/source/
