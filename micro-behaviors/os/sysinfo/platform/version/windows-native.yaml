defaults:
  platforms: [windows]
  crit: notable
  attack: T1082

traits:
  - id: rtl-get-version
    desc: Queries Windows build version via RtlGetVersion
    conf: 0.92
    for: [pe, dll, c, cpp, rust, go, csharp, python]
    if:
      type: text
      word: RtlGetVersion

  - id: get-version-ex-symbol
    desc: Queries Windows OS version via GetVersionEx
    conf: 0.88
    for: [pe, dll, c, cpp, rust, go, csharp]
    if:
      type: symbol
      regex: '^GetVersion(Ex)?[AW]?$'

composite_rules:
  - id: windows-os-version-query
    desc: Queries Windows operating system version
    conf: 0.9
    for: [pe, dll, c, cpp, rust, go, csharp, python, powershell]
    any:
      - id: rtl-get-version
      - id: get-version-ex-symbol
      - id: cim-operating-system-query
