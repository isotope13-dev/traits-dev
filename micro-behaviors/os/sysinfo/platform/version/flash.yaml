defaults:
  for: [data]
  platforms: [windows, unix]

traits:
  - id: flash-player-version-query
    desc: Compressed Flash queries player version
    crit: notable
    conf: 0.99
    # CWS compression hides both the ActionScript constants and bytecode from
    # normal string extraction. The first span encodes flashVersion and
    # /:$version; the second encodes the bytecode that reads those constants.
    if:
      type: hex
      pattern: >-
        43 57 53 [41]
        72 12 8B 33 C2 52 8B 8A 33 F3 F3 18 F4 AD 54 CA [40]
        69 2C 0C 1C 0C 1C 8C 32
      offset: 0
  - id: flash-version-identifier
    desc: Flash movie references flashVersion variable
    crit: notable
    conf: 0.9
    # The local that stores the player version in version-gated AVM1 loaders.
    # Survives host renames, recompression, and uncompressed (FWS) storage,
    # where the packed hex matcher above cannot reach. A renamed local defeats
    # this spelling; the /:$version path atom below covers the read itself.
    if:
      type: text
      substr: flashVersion
      case_insensitive: true
  - id: avm1-version-path-read
    desc: Movie references player version path
    crit: notable
    conf: 0.95
    # Byte form of the AVM1 /:$version system path read by GetVariable to
    # obtain the player version. String extraction drops this punctuation, so
    # a byte signature is required. Matches uncompressed (FWS) movies at any
    # offset; CWS compression hides it (the packed matcher above covers that).
    if:
      type: hex
      pattern: "2F 3A 24 76 65 72 73 69 6F 6E"
