# OS release-level queries on commercial Unix. These name the version-report
# utility itself; the shell that runs it is captured separately by
# micro-behaviors/process/create/shell/.
#
# Relocated from micro-behaviors/process/enumerate/shell (AIX), where the
# matcher's name and ATT&CK mapping claimed process enumeration. `oslevel`
# prints the AIX maintenance level and enumerates nothing; the reference turns
# up in every autoconf `config.guess` host-detection ladder.
defaults:
  platforms: [unix]
  for: [elf, macho, c, cpp, shell]
  attack: T1082
  mbc: E1082

traits:
  - id: aix-oslevel-query
    desc: Queries AIX release level via oslevel
    crit: notable
    conf: 0.8
    if:
      type: text
      word: oslevel
