# Short UA regex used by loaders and ordinary compatibility checks alike.
defaults:
  platforms: [ios]
  for: [javascript, typescript, html]
traits:
  - id: ios-underscore-version-regex
    desc: iOS underscore-version capture regex
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      substr: '/OS (\d+)_(\d+)/'
composite_rules:
  - id: ios-underscore-user-agent-version-parse
    desc: Reads User-Agent beside iOS version regex
    crit: notable
    conf: 0.95
    near_bytes: 400
    all:
      - id: ios-underscore-version-regex
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read

  - id: ios-version-parse-evidence
    desc: Reads iOS version from browser User-Agent
    crit: notable
    any:
      - id: micro-behaviors/os/sysinfo/platform/version::ios-user-agent-version-parse
      - id: micro-behaviors/os/sysinfo/platform/version::ios-parenthesized-short-user-agent-version-parse
      - id: micro-behaviors/os/sysinfo/platform/version::ios-underscore-user-agent-version-parse
