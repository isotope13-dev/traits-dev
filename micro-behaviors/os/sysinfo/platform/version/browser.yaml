# Full UA patterns identify iOS directly. A short /OS (major)_(minor)/
# capture needs a nearby parsed navigator.userAgent read to establish context.
# Co-location does not establish that the version gates a later payload.
defaults:
  platforms: [ios]
  for: [html, javascript, typescript]
  attack: T1082
  mbc: E1082
  crit: notable
  conf: 0.9

traits:
  - id: ios-user-agent-version-parse
    desc: Parses iOS version from a User-Agent string
    if:
      type: text
      exclude_comments: true
      regex: '(iPhone|CPU)( iPhone)? OS \((\[0-9_\]|\[\\d_\]|\\d)'

  - id: ios-short-version-capture-regex
    desc: iOS-style version capture expression
    if:
      type: text
      exclude_comments: true
      regex: '/OS \((\[0-9_?\]|\[\\d_\]|\\d)'

composite_rules:
  - id: ios-parenthesized-short-user-agent-version-parse
    desc: iOS version capture near User-Agent read
    near_bytes: 200
    all:
      - id: ios-short-version-capture-regex
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read

