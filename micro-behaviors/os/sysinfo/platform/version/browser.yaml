# OS version read from the browser User-Agent. The capture group follows the
# UA format itself ("iPhone OS 18_5", "CPU OS 15_1"), so it is a version
# query, not a device check. Exploit landing pages use it to pick a chain;
# compatibility shims use it too, so it stays a neutral capability.
defaults:
  platforms: [ios]
  for: [html, javascript, typescript]
  attack: T1082
  mbc: E1082

traits:
  - id: ios-user-agent-version-parse
    desc: Parses iOS version from a User-Agent string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(iPhone|CPU)( iPhone)? OS \((\[0-9_\]|\[\\d_\]|\\d)'
