defaults:
  platforms:
  - linux
  - macos
  for:
  - shell

composite_rules:
- id: shell-cpu-arch-fingerprint
  desc: Shell architecture query or download
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
  - id: micro-behaviors/os/sysinfo/platform/arch::sh-arch-query
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-aware-curl-download
