# Compile-time architecture selection in C preprocessor branches. These are
# portability guards, present in nearly every portable header that has to pick
# an inline-asm or word-size variant, so they are baseline facts about how a
# source tree was written -- not runtime discovery of the host.
#
# Relocated (2026-08) from objectives/discovery/host/software, where the same
# `#elif __x86_64__` regexes sat at notable under the name "Multi-architecture
# numeric constant mapping" -- a description that matches neither a constant
# nor a mapping. That file's own note had already ruled the `#ifdef` spelling
# neutral; the `#elif` spelling was left behind, so third_party/jitterentropy's
# `#elif __i386__` rdtsc guard scored as host-software discovery. The
# discovery intent stays with the arch-const-mapping composite there, which
# references these.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: baseline

traits:
  - id: elif-arch-macro-branch
    desc: Preprocessor elif on a CPU arch macro
    conf: 0.85
    if:
      type: text
      regex: '#elif\s+__(x86_64|arm|i386)__'

  - id: elif-aarch64-macro-branch
    desc: Preprocessor elif branch on the aarch64 macro
    conf: 0.85
    count_min: 2
    if:
      type: text
      regex: '#elif\s+__(aarch64)__'
