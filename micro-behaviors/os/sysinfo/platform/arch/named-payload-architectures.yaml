# Distinct architecture suffixes in referenced filenames. These do not
# identify the scanned file architecture or establish download/activation.
# ELF scope: bot images embed the dropper's cross-architecture payload
# table as strings, so the same observation is reported there.
defaults:
  platforms: [unix]

composite_rules:
  - id: multiarch-payload-suffix
    desc: Names payloads for multiple architectures
    crit: notable
    conf: 0.92
    for: [text, elf]
    needs: 2
    any:
      - id: micro-behaviors/fs/path/basename::payload-name-arm
      - id: micro-behaviors/fs/path/basename::payload-name-mips
      - id: micro-behaviors/fs/path/basename::payload-name-x86
      - id: micro-behaviors/fs/path/basename::payload-name-ppc
      - id: micro-behaviors/fs/path/basename::payload-name-sh4
