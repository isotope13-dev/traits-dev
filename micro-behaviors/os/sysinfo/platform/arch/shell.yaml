defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: component
traits:
  - id: sh-arch-query
    desc: Reads CPU architecture with uname -m
    crit: notable
    conf: 0.9
    attack: T1082
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)uname\s+-m\b'
  # Any `uname -<flag>` captured by command substitution. The flag is not
  # constrained, so this covers `-n` (nodename) and `-r` (release) as well as
  # `-s`/`-m`; describe it as "captures uname output" rather than claiming the
  # OS/CPU fields specifically, which only `sh-arch-query` above pins down.
  - id: sh-uname-fingerprint
    desc: Captures uname output in a shell substitution
    crit: notable
    conf: 0.8
    attack: T1082
    mbc: E1082
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/extension/identity::autotools-configure-basename
      - type: text
        substr: "case $(uname -s) in"
    if:
      type: text
      regex: "\\$\\(uname\\s+-[a-z]+\\)|`uname\\s+-[a-z]+`"
  - id: arch-aware-curl-download
    desc: Downloads a file after querying CPU architecture
    crit: notable
    conf: 0.9
    attack: T1082,T1105
    if:
      type: text
      regex: '(?is)\buname\s+-m\b.{0,260}\b(arm64|aarch64|x86_64)\b.{0,260}\bcurl\b'
    not:
      - regex: '(?is)\becho\s+curl\b'
  - id: os-release-read
    desc: Reads Linux os-release file
    crit: notable
    conf: 0.82
    mbc: E1082
    attack: T1082
    if:
      type: text
      regex: '\bcat\s+/etc/os-release\b'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: arch-mips
    desc: MIPS architecture string
    if:
      type: text
      word: mips
  - id: arch-m68k
    desc: Motorola 68000 architecture string
    if:
      type: text
      word: m68k
  - id: arch-arm
    desc: ARM architecture string
    # Large shell+binary SFX files match bare `arm` in archive bytes; real
    # arch-dispatch scripts that care about this atom are far smaller.
    size_max: 524288
    if:
      type: text
      regex: \barm[0-9]?\b
  - id: arch-aarch64
    crit: notable
    desc: AArch64 (ARM64) architecture string
    if:
      type: text
      word: aarch64
  - id: arch-arm64
    crit: notable
    desc: arm64 architecture string
    if:
      type: text
      word: arm64
  - id: arch-x86
    desc: x86 architecture string
    size_max: 524288
    if:
      type: text
      word: x86
  - id: arch-sh4
    desc: SH4 architecture string
    if:
      type: text
      word: sh4
  - id: arch-ppc
    desc: PPC architecture string
    if:
      type: text
      word: ppc
  - id: arch-arc
    desc: ARC architecture string
    if:
      type: text
      word: arc
  - id: multiple-architecture-references--x86-or-amd64
    desc: x86 or AMD64 architecture reference
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(x86_64|amd64)\b'
  - id: multiple-architecture-references--x86-or-arm
    desc: x86 or ARM architecture reference
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(i[3-6]86|aarch64|arm[0-9]+)\b'
  - id: multiple-architecture-references--risc-or-power
    desc: RISC or PowerPC architecture reference
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(riscv|mips|ppc)\b'

  # Relocated from objectives/command-and-control/dropper/delivery/fetch-exec,
  # where it was named `architecture-parameterized-fetch` ("Selects a payload
  # by host architecture") even though no leg of the matcher looks at a fetch,
  # a URL or a payload. It only pairs a machine-arch read with a nearby
  # `arch=`/`architecture` token — which OpenSCAP's system_info probe test does
  # (`OS_ARCHITECTURE="`uname -m`"` … `grep "os_architecture: …"`), as does any
  # portable build or install script. The dropper composites in
  # objectives/evasion/fileless/memory reference it and supply the fetch,
  # memfd and exec legs that carry the intent.
  - id: architecture-parameter-assignment
    desc: Architecture parameter assignment
    crit: baseline
    conf: 0.94
    for: [scripts]
    if:
      type: text
      regex: '(?i)\b(arch|architecture)\s*='

  # Relocated from objectives/discovery/system/architecture (2026-09): reading
  # `uname -m`, folding it to a normalized token and splicing an arch variable
  # into a URL or filename is how installers and build scripts pick the build
  # for this host -- a host-architecture capability, not reconnaissance.
  - id: arch-variable-in-url-or-artifact-name
    desc: Arch variable in URL or artifact name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(artifact|release|binary|asset|url)\w{0,12}\s*=[^\n]{0,90}\$\{?\w{0,12}arch'
  # `goboringcrypto_linux_$GOARCH.syso`, `node-$ARCH.tar.xz` -- the normalized
  # architecture spliced straight into a filename, which is the other half of the
  # same select-the-build-for-this-host idiom.
  - id: arch-variable-in-filename
    desc: Arch variable spliced into a filename
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\$\{?[A-Za-z_]{0,12}(ARCH|arch)\}?[A-Za-z0-9_.-]{0,40}\.[A-Za-z0-9]{1,6}\b'
  # `case "$(uname -m)" in x86_64) ... aarch64) ...` -- reading the machine type
  # and folding it to a normalized token. Every installer and cross-build helper
  # opens this way.
  - id: uname-arch-case-normalization
    desc: uname -m mapped in a case statement
    crit: notable
    conf: 0.92
    if:
      type: text
      # Both spellings: the probe inline in the case head (commonly guarded,
      # `case "$(uname -m 2>/dev/null || true)" in`) and the two-step form that
      # stores it first (`machine="$(uname -m)"` … `case "$machine" in`).
      regex: '(?s)case\s+"?\$\(\s*uname\s+-[mp]|uname\s+-[mp][^\n]{0,50}[\s\S]{0,200}?case\s+"?\$'
  # The Go toolchain's `crypto/internal/boring/build-goboring.sh` and oh-my-pi's
  # `scripts/install.sh` are the two shapes of this: read `uname -m`, fold it to a
  # normalized token in a `case`, then name the file to build or fetch after that
  # token. Selecting the build that matches the host is the point of an installer
  # and of a cross-build helper -- the arch probe is real, but attributing it to
  # an adversary enumerating targets is wrong.
  # `$( [ $(uname -m) = aarch64 ] && echo arm64 || echo amd64)` -- the same
  # normalisation written as a conditional instead of a case, which is how
  # nomad's client provisioning script and its CNI install docs pick the plugin
  # build to download.
  - id: uname-arch-conditional-select
    desc: uname -m folded by a shell conditional
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\[\s*\$\(\s*uname\s+-[mp][^)\n]{0,20}\)[^\n]{0,20}\]\s*&&\s*echo'

composite_rules:
  - id: uname-arch-normalization
    desc: Normalizes uname -m to an arch token
    conf: 0.9
    any:
      - id: uname-arch-case-normalization
      - id: uname-arch-conditional-select

  - id: arch-parameterized-variant
    desc: Host architecture selects a build variant
    crit: notable
    conf: 0.94
    for: [scripts]
    attack: T1082
    all:
      - id: architecture-parameter-assignment
    any:
      - id: sh-arch-query
      - id: sh-uname-fingerprint
      - id: micro-behaviors/os/sysinfo/platform/host::python-platform-machine
    near_bytes: 220

  - id: multiple-architecture-references
    desc: References multiple CPU architecture names
    crit: notable
    conf: 0.94
    # Two distinct architecture families, not one. With the default needs of 1
    # a lone `x86_64-linux-gnu` path in a comment satisfied this composite, so
    # the finding claimed "multiple" from a single token -- and it also handed
    # `multi-arch-target` below a free second leg (see its own comment, which
    # assumed this rule already required several tokens).
    needs: 2
    any:
      - id: multiple-architecture-references--x86-or-amd64
      - id: multiple-architecture-references--x86-or-arm
      - id: multiple-architecture-references--risc-or-power
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/build/autotools::autotools-config-basename
      - id: metadata/build/autotools::autoconf-m4-macro-definition
      - id: metadata/package/testing/
      - id: micro-behaviors/process/create/launch::shell-self-executable-jar
  - id: multi-arch-target
    desc: Script references multiple CPU architectures
    crit: notable
    conf: 0.85
    # Two legs suffice when one is multiple-architecture-references (already
    # requires 3 arch tokens). Keeps Install4J-style multi-arch JVM probes
    # without needing bare arm/x86 atoms that FP in embedded payloads.
    needs: 2
    any:
      - id: arch-mips
      - id: arch-arm
      - id: arch-aarch64
      - id: arch-arm64
      - id: arch-x86
      - id: arch-sh4
      - id: arch-ppc
      - id: arch-arc
      - id: multiple-architecture-references
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/build/autotools::autoconf-m4-macro-definition
      - id: metadata/build/autotools::autotools-config-basename
      - id: metadata/file/extension/identity::squashfs-container-filename
      - id: micro-behaviors/process/create/launch::shell-self-executable-jar
