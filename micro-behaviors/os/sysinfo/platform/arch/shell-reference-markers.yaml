defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: arch-args-arm--rx-16
  desc: arn reference repeated in shell source
  crit: component
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: arn
- id: arch-args-arm--rx-16--alt-2
  desc: arn5 reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: arn5
- id: arch-args-arm--rx-17
  desc: arn6 reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: arn6
- id: arch-args-arm--rx-17--alt-2
  desc: arn7 reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: arn7
- id: arch-args-arm--rx-18
  desc: splarm reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splarm
- id: arch-args-arm--rx-18--alt-2
  desc: splarm5 reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splarm5
- id: arch-args-arm--rx-19
  desc: splarm6 reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splarm6
- id: arch-args-arm--rx-19--alt-2
  desc: splarm7 reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splarm7
- id: arch-args-mips--rx-21
  desc: mpsl reference repeated in shell source
  crit: component
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: mpsl
- id: arch-args-mips--rx-22
  desc: splm68k reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splm68k
- id: arch-args-mips--rx-22--alt-2
  desc: splmips reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splmips
- id: arch-args-mips--rx-23
  desc: splmpsl reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splmpsl
- id: arch-args-mips--rx-23--alt-2
  desc: splppc reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splppc
- id: arch-args-misc--rx-24--alt-2
  desc: spc reference repeated in shell source
  crit: component
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: spc
- id: arch-args-misc--rx-25
  desc: x64 reference repeated in shell source
  crit: component
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: x64
- id: arch-args-misc--rx-26
  desc: splsh4 reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splsh4
- id: arch-args-misc--rx-26--alt-2
  desc: splspc reference repeated in shell source
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    word: splspc
- id: arch-args-misc--rx-27
  desc: Repeated architecture filename reference
  crit: component
  conf: 0.95
  count_min: 2
  if:
    type: text
    regex: '\b(splx86)\b'
- id: uname-m-arch-var
  desc: uname architecture variable
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: 'ARCH=$(uname -m)'
composite_rules:
- id: multi-arch-payload-bundle
  desc: Repeated names reference multiple architecture variants
  crit: notable
  conf: 0.95
  any:
  - id: micro-behaviors/fs/path/basename::supplysrv-payload-names
  - id: micro-behaviors/fs/path/basename::spl-payload-names
  needs: 2
  all:
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-mips
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-misc
- id: arch-args-arm
  desc: ARM-family payload selector arguments
  crit: component
  conf: 0.95
  any:
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm--rx-16
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm--rx-16--alt-2
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm--rx-17
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm--rx-17--alt-2
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm--rx-18
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm--rx-18--alt-2
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm--rx-19
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-arm--rx-19--alt-2
- id: arch-args-mips
  desc: MIPS-family payload selector arguments
  crit: component
  conf: 0.95
  any:
  - id: "micro-behaviors/os/sysinfo/platform/arch::arch-m68k"
  - id: "micro-behaviors/os/sysinfo/platform/arch::arch-mips"
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-mips--rx-21
  - id: "micro-behaviors/os/sysinfo/platform/arch::arch-ppc"
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-mips--rx-22
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-mips--rx-22--alt-2
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-mips--rx-23
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-mips--rx-23--alt-2
- id: arch-args-misc
  desc: Mixed architecture payload selector arguments
  crit: component
  conf: 0.95
  any:
  - id: "micro-behaviors/os/sysinfo/platform/arch::arch-sh4"
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-misc--rx-24--alt-2
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-misc--rx-25
  - id: "micro-behaviors/os/sysinfo/platform/arch::arch-x86"
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-misc--rx-26
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-misc--rx-26--alt-2
  - id: micro-behaviors/os/sysinfo/platform/arch::arch-args-misc--rx-27
