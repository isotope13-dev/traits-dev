# Python's platform.architecture() reports the interpreter's pointer width and
# linkage. Ordinary for build helpers and CPU-info libraries (py-cpuinfo,
# pycryptodome); a dropper that picks a payload by architecture pairs it with
# download evidence in objectives/command-and-control/dropper/delivery/http.
#
# Relocated (2026-09) from that objective directory, where the bare call was
# filed as "Platform architecture check" under dropper delivery.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  attack: T1082
  mbc: E1082

traits:
  - id: python-platform-architecture-call
    desc: Calls platform.architecture()
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)architecture$'
