defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: hdparm-cmd
    desc: hdparm -i command
    conf: 0.6
    if:
      type: text
      substr: hdparm -i
  - id: serial-short
    desc: serial_short udev field
    conf: 0.6
    if:
      type: text
      substr: serial_short
  - id: id-serial
    desc: ID_SERIAL udev field
    conf: 0.6
    if:
      type: text
      word: ID_SERIAL
  - id: wmic-disk-serial-command
    desc: References Windows disk serial query command
    conf: 0.84
    platforms: [windows]
    for: [scripts]
    if:
      type: text
      regex: '(?i)\bwmic\s+diskdrive\s+get\s+serialnumber\b'
  - id: lsblk-name-serial-command
    desc: References Linux disk serial query command
    conf: 0.82
    platforms: [linux]
    for: [scripts]
    if:
      type: text
      regex: '\blsblk\s+-o\s+NAME,SERIAL\b'
  - id: udevadm-disk-property-query-command
    desc: udevadm disk property query command reference
    conf: 0.9
    platforms: [linux]
    if:
      type: text
      regex: '\budevadm\s+info\s+--query=property\s+--name(=|\s+)/dev/'
composite_rules:
  - id: disk-identity-query-reference
    desc: Disk identity query API or command reference
    conf: 0.75
    any:
      - id: micro-behaviors/hardware/block/device::disk-identity-ioctl
      - id: udevadm-disk-property-query-command
      - id: micro-behaviors/os/sysinfo/disk::hdparm-cmd
      - id: micro-behaviors/os/sysinfo/disk::lsblk-name-serial-command
      - id: micro-behaviors/os/sysinfo/disk::wmic-disk-serial-command
    unless:
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-library
      - id: well-known/tool/development/toolchain/gcc-toolchain::gcc-bootstrap-benign-context
