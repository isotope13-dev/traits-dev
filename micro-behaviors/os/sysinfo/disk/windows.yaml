defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell]
  attack: T1082

traits:
  - id: get-volume-information
    desc: Queries a Windows volume serial number
    crit: notable
    conf: 0.92
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^GetVolumeInformation[AW]?$'
  - id: powershell-disk-serial
    desc: Reads disk serial via Windows management
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)Win32_DiskDrive.{0,160}SerialNumber|SerialNumber.{0,160}Win32_DiskDrive'
