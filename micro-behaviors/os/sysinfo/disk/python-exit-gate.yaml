defaults:
  for: [python]
  platforms: [windows, unix]
traits:
  - id: python-total-disk-threshold-exit
    desc: Python exits below a total-disk threshold
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        (_
          (expression_statement (assignment left: (identifier) @disk
            right: (attribute object: (call
              function: (attribute object: (identifier) @shutil
                attribute: (identifier) @usage))
              attribute: (identifier) @total)))
          . (if_statement condition: (comparison_operator
              (identifier) @tested "<" (_))
            consequence: (block
              (expression_statement (call function: (attribute
                object: (identifier) @sys attribute: (identifier) @exit)))))
          (#eq? @shutil "shutil") (#eq? @usage "disk_usage")
          (#eq? @total "total") (#eq? @disk @tested)
          (#eq? @sys "sys") (#eq? @exit "exit"))
