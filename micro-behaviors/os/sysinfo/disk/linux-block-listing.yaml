defaults:
  platforms: [linux]
  for: [c, elf, shell]
  crit: baseline
  conf: 0.5
  mbc: E1082
  attack: T1082
traits:
  - id: sys-block
    desc: References the Linux sysfs block-device listing
    if:
      type: text
      substr: /sys/block/
  - id: lsblk-command-reference
    desc: References the lsblk inventory command
    for: [c, elf]
    crit: component
    if:
      type: text
      word: lsblk
composite_rules:
  - id: lsblk-cmd
    desc: References or invokes the lsblk inventory command
    any:
      - id: lsblk-command-reference
      - id: shell-lsblk-call
