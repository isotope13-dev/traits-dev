defaults:
  platforms: [linux]
  for: [c, elf, shell]
  crit: baseline
  conf: 0.5
  mbc: E1082
  attack: T1082
traits:
  - id: sys-block
    desc: References the Linux sysfs block-device listing
    if:
      type: text
      substr: /sys/block/
  - id: lsblk-cmd
    desc: References the lsblk inventory command
    if:
      type: text
      word: lsblk
