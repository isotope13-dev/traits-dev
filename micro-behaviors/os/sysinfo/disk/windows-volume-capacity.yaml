# Windows volume information and capacity evidence.
defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
traits:
  - id: nt-query-volume-information-file
    desc: NtQueryVolumeInformationFile API reference
    crit: notable
    conf: 0.94
    for: [pe, dll, c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      word: NtQueryVolumeInformationFile

  - id: nt-full-size-information-class
    desc: Native full-volume-size information class
    crit: notable
    conf: 0.94
    for: [pe, dll, c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      regex: '\bFileFsFullSizeInformation(Ex)?\b'

  - id: actual-available-allocation-units
    desc: Reads actual available volume allocation units
    crit: notable
    conf: 0.96
    for: [c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      word: ActualAvailableAllocationUnits

  - id: sector-geometry-multiplication
    desc: Multiplies sector bytes by sectors per unit
    crit: notable
    conf: 0.96
    for: [c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      regex: 'BytesPerSector\s*\*\s*\w+\.SectorsPerAllocationUnit'

  - id: free-allocation-unit-multiplication
    desc: Multiplies by available allocation units
    crit: notable
    conf: 0.96
    for: [c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      regex: '\*\s*\w+\.ActualAvailableAllocationUnits\b'

  - id: get-volume-info
    desc: Windows volume-information API name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "(^|::)GetVolumeInformation[AW]?$"
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: get-disk-free-space
    desc: GetDiskFreeSpace API import
    crit: notable
    conf: 0.9
    attack: "T1082"
    if:
      type: import
      regex: "^GetDiskFreeSpace(Ex)?[AW]?$"
composite_rules:
  - id: available-volume-byte-calculation
    desc: Computes available volume bytes
    crit: notable
    conf: 0.96
    for: [c, cpp, csharp, go, rust, zig, python]
    near_lines: 2
    all:
      - id: sector-geometry-multiplication
      - id: free-allocation-unit-multiplication

  - id: native-free-volume-capacity-query
    desc: Queries free capacity via native volume info
    crit: notable
    conf: 0.97
    for: [c, cpp, csharp, go, rust, zig, python]
    all:
      - id: nt-query-volume-information-file
      - id: nt-full-size-information-class
      - id: actual-available-allocation-units

