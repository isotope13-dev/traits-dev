defaults:
  for: [shell]
  platforms: [linux]
  crit: notable
traits:
  - id: shell-lsblk-call
    desc: Invokes block device inventory command
    if:
      type: symbol
      kind: call
      exact: lsblk
  - id: shell-fdisk-list
    desc: Lists disk partition tables via fdisk
    if:
      type: symbol
      kind: call
      exact: fdisk
      arg:
        kind: identifier
        name: -l
