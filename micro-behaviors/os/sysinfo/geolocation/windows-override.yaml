defaults:
  platforms: [windows]
  for: [javascript, powershell, csharp]
  crit: notable

traits:
  - id: windows-geolocation-override
    desc: Overrides Windows geolocation coordinates
    conf: 0.95
    if:
      type: yara
      source: |
        rule windows_geolocation_override {
          strings:
            $provider = "Windows.Devices.Geolocation.Provider.GeolocationProvider" ascii
            $override = ".SetOverridePosition(" ascii
          condition:
            all of them
        }
