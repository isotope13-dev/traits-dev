# Paired latitude/longitude fields in one serialized payload. Location
# features legitimately build such payloads, so this is a notable source
# observation; an exfiltration objective must pair it with an upload
# route and transport evidence.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  crit: notable
  conf: 0.87

traits:
  - id: latitude-longitude-payload-fields
    desc: Payload pairs latitude and longitude fields
    if:
      type: text
      regex: '(?i)["''](lat|latitude)["'']\s*[:,=][^}]{0,160}?["''](lng|lon|long|longitude)["'']\s*[:,=]'
      exclude_comments: true
