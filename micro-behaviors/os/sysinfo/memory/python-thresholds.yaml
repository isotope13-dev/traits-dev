defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
  conf: 0.9
traits:
  - id: physical-memory-api-threshold
    desc: Physical-memory API and threshold text
    if:
      type: text
      regex: 'GetPhysicallyInstalledSystemMemory[^<\n]{0,60}<\s*([1-4]\s*\*\s*1024|[0-9]{7,10})'
  - id: psutil-memory-2gb-threshold
    desc: psutil 2GB memory threshold
    if:
      type: text
      regex: 'psutil\.virtual_memory.{0,80}2147483648'
  - id: psutil-memory-4gb-threshold
    desc: psutil 4GB memory threshold
    if:
      type: text
      regex: 'psutil\.virtual_memory.{0,80}4294967296'
composite_rules:
  - id: python-memory-threshold
    desc: Python physical-memory threshold text
    conf: 1.0
    any:
      - id: physical-memory-api-threshold
      - id: psutil-memory-2gb-threshold
      - id: psutil-memory-4gb-threshold
