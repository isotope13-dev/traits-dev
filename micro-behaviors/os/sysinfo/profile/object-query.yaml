defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-host-user-object-query-request-path
    desc: Host-user object query reaches HTTP path
    if:
      type: tree-sitter
      query: |
        (program
          (_ (variable_declarator
            name: (identifier) @profile
            value: (object
              (pair value: [
                (call_expression function: (member_expression
                  property: (property_identifier) @hostname))
                (call_expression arguments: (arguments
                  (function_expression body: (statement_block
                    (return_statement (call_expression function: (member_expression
                      property: (property_identifier) @hostname)))))))
              ])
              (pair value: [
                (member_expression object: (call_expression function: (member_expression
                  property: (property_identifier) @userinfo))
                  property: (property_identifier) @username)
                (call_expression arguments: (arguments
                  (function_expression body: (statement_block
                    (return_statement (member_expression
                      object: (call_expression function: (member_expression
                        property: (property_identifier) @userinfo))
                      property: (property_identifier) @username))))))
              ]))))
          (_ (variable_declarator name: (identifier) @query value: (call_expression
            function: (member_expression
              object: (call_expression
                function: (member_expression
                  object: (call_expression function: (member_expression
                    object: (identifier) @object
                    property: (property_identifier) @keys)
                    arguments: (arguments (identifier) @profile_keys))
                  property: (property_identifier) @map)
                arguments: (arguments (function_expression
                  parameters: (formal_parameters (identifier) @key)
                  body: (statement_block (return_statement
                    (binary_expression right: (call_expression
                      function: (identifier) @encode
                      arguments: (arguments (call_expression
                        function: (identifier) @string
                        arguments: (arguments (subscript_expression
                          object: (identifier) @profile_value
                          index: (identifier) @key_value)))))))))))
              property: (property_identifier) @join)
            arguments: (arguments (string (string_fragment) @separator)))))
          (_ (variable_declarator name: (identifier) @path
            value: (binary_expression right: (identifier) @query_path)))
          (function_declaration body: (statement_block
            (try_statement body: (statement_block
              (_ (variable_declarator value: (call_expression
                function: (member_expression property: (property_identifier) @request)
                arguments: (arguments (object
                  (pair key: (property_identifier) @path_key
                    value: (identifier) @path_use))))))))))
          (#eq? @hostname "hostname")
          (#eq? @userinfo "userInfo")
          (#eq? @username "username")
          (#eq? @object "Object")
          (#eq? @keys "keys")
          (#eq? @map "map")
          (#eq? @join "join")
          (#eq? @separator "&")
          (#eq? @encode "encodeURIComponent")
          (#eq? @string "String")
          (#eq? @profile @profile_keys)
          (#eq? @profile @profile_value)
          (#eq? @key @key_value)
          (#eq? @query @query_path)
          (#eq? @path @path_use)
          (#eq? @path_key "path")
          (#match? @request "^(get|request)$"))
