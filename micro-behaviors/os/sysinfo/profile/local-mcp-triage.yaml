defaults:
  platforms: [unix, windows]
  for: [npm, javascript, package.json]

composite_rules:
  - id: node-multi-sysinfo-with-hook
    desc: Hook beside hostname and runtime queries
    crit: notable
    conf: 0.9
    all:
    - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
    needs: 2
    any:
    - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
    - id: micro-behaviors/os/sysinfo/platform/runtime/

    # === Hostile: Postinstall Recon + Exfil ===

