defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: versioned-pe-locale-environment-api-set
    desc: Versioned PE contains locale and environment API set
    crit: notable
    conf: 0.97
    size_max: 524288
    all:
      - id: metadata/package/versioning/scheme::dotted-quad-version-pair
      - id: micro-behaviors/os/sysinfo/profile::locale-environment-launch-api-set
      - id: metadata/binary/section/entropy::elevated-text-entropy-section
    any:
      - id: metadata/binary/code/complexity::low-function-count-marker
      - id: micro-behaviors/process/debug/event::output-debug-string
      - id: metadata/binary/debug::pdb-numbered-path
      - id: micro-behaviors/process/terminate/kill::terminate-process
    needs: 2
    unless:
      - id: metadata/signed/platform
      - id: metadata/signed/certificate
      - id: metadata/signed/developer
      # Aha's sandbox helpers carry a dotted version resource and locale
      # strings because they are the VM runtime, not a locale-gated loader.
      - id: well-known/app/ai/trae::aha-sandbox-pdb
