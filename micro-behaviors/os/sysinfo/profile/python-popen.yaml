defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-systeminfo-popen
    desc: Python popen runs systeminfo
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?popen$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^systeminfo(\s|$)'
