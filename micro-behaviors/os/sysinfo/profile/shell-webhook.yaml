# Host queries beside a webhook POST can be disclosed telemetry. These rules
# assert co-occurrence, not source-to-body flow, execution of a specific member,
# secret collection, or unauthorized transfer.
defaults:
  platforms: [unix, windows]
  conf: 0.95
composite_rules:
  - id: shell-host-queries-discord-post
    desc: Shell identity queries accompany Discord POST
    crit: notable
    for: [shell]
    scope: file
    all:
      - id: shell-user-host-cwd-queries
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-split
    # The POST may be curl, or an inline Node heredoc (https.request with
    # method "POST") run from the same shell script.
    any:
      - id: micro-behaviors/communications/http/post::http-curl-post-request
      - id: micro-behaviors/communications/http/post::post

  - id: npm-install-shell-survey-webhook
    desc: Install hook accompanies shell profile webhook POST
    crit: suspicious
    for: [npm, tar, zip, package.json, shell]
    scope: archive
    all:
      - id: shell-host-queries-discord-post
    any:
      - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: metadata/package/scripts/lifecycle::has-install-script
