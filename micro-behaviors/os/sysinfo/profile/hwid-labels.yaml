# A grouping of hardware identifier labels, not a retrieval or send claim.
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
composite_rules:
- id: hardware-id-field-names
  desc: Hardware identifier field-name references
  crit: notable
  conf: 0.6
  any:
  - id: micro-behaviors/os/sysinfo/hardware::hwid-field-name
  - id: micro-behaviors/os/sysinfo/hardware::local-app-hwid-field-name
