# These fields and an alphabet establish capabilities, not a transmission.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: host-fields-base64-alphabet
  desc: Literal host fields beside a Base64 alphabet
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/data/encoding/base64::base64-alphabet
  - id: host-identity-literal
  any:
  - id: homedir-literal
  - id: arch-literal
  - id: endianness-literal
  - id: pid-literal
  - id: micro-behaviors/os/random/crypto::randombytes-literal
  - id: micro-behaviors/crypto/hash/digest::digest-literal
  needs: 3
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: well-known/lib/observability/sentry-js::sentry-js-bundled-sdk
- id: host-identity-literal
  desc: Literal names a host identity field
  crit: component
  conf: 0.8
  any:
  - id: homedir-literal
  - id: arch-literal
  - id: endianness-literal
traits:
- id: homedir-literal
  desc: homedir string literal
  crit: notable
  conf: 0.8
  if:
    type: string_literal
    exact: homedir
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
  - id: metadata/file/format/source-map::sourcemap
- id: arch-literal
  desc: arch string literal
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    exact: arch
  unless:
  - id: metadata/file/format/source-map::sourcemap
- id: endianness-literal
  desc: endianness string literal
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    exact: endianness
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
  - id: metadata/file/format/source-map::sourcemap
- id: pid-literal
  desc: pid string literal
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    word: pid
  unless:
  - id: metadata/file/format/source-map::sourcemap
