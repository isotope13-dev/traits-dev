defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:

  - id: process-one-docker-socket-references
    desc: Process-one and Docker socket references
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: "(/proc/1/cgroup|/proc/1/cmdline)[^\\r\\n]{0,260}/var/run/docker\\.sock"


composite_rules:
  - id: proc-docker-tunnel-post-cooccurrence
    desc: Process-one/Docker references and tunnel POST
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/proxy/tunnel::trycloudflare-domain
      - id: micro-behaviors/communications/http/post::request-post-option
    any:
      - id: micro-behaviors/os/sysinfo/profile::process-one-docker-socket-references
      - id: micro-behaviors/fs/path/socket::docker-var-run-sock
      - id: micro-behaviors/fs/path/stream::process-one-script-descriptor-path

