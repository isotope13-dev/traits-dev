# This is one command chain in decoded text, not separate facts pooled across
# unrelated strings. Encoding provenance does not by itself establish execution.
defaults:
  platforms: [unix]
  for: [shell, php, ruby, python, javascript, typescript, text]
  crit: notable
  conf: 0.96
traits:
  - id: encoded-unix-host-survey-command-text
    desc: Decoded hostname, kernel and OS survey commands
    if:
      type: encoded
      encoding: [base64, hex]
      regex: '\bhostname\s*;\s*uname\s+-a\s*;\s*cat\s+/etc/(os-release|issue)\b'
