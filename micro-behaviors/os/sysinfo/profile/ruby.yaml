defaults:
  for: [ruby]
  platforms: [unix, windows]

composite_rules:
  - id: ruby-system-identity-queries
    desc: Ruby queries multiple system identity sources
    crit: notable
    conf: 0.86
    needs: 2
    any:
      - id: micro-behaviors/os/sysinfo/hostname::ruby-socket-gethostname
      - id: micro-behaviors/os/sysinfo/platform/runtime::ruby-platform-const
      - id: micro-behaviors/process/user/query::ruby-etc-user-lookup
      - id: micro-behaviors/os/env/user-info::ruby-user-identity-env-reference
  - id: ruby-sysinfo-with-net-http-post
    desc: Ruby sysinfo queries accompany Net::HTTP POST syntax
    crit: notable
    conf: 0.9
    all:
      - id: ruby-system-identity-queries
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: micro-behaviors/communications/http/url/host::ruby-numeric-host-url-reference
      - id: micro-behaviors/data/encode/base64::ruby-base64-urlsafe-encode
      - id: micro-behaviors/os/env/user-info::ruby-user-identity-env-reference
    unless:
      # PKCE login: URL-safe Base64 is the code-challenge encoding.
      - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-pair-context
