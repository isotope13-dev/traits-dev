defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: node-three-host-query-kinds
  desc: Three nearby Node host or user query kinds
  crit: notable
  conf: 0.85
  near_lines: 120
  needs: 3
  any:
    - id: micro-behaviors/process/user/query::os-userinfo-call
    - id: micro-behaviors/network/interface::node-network-interfaces-call
    - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
    - id: micro-behaviors/process/user/query::os-homedir-call
    - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
  unless:
    - id: metadata/package/testing/presence/harness/
    - id: metadata/package/testing/presence/fixture::test-filename-pattern
    - id: metadata/lang/scripted::dts-declaration-file
    - id: "metadata/file/naming::test-directory-component"

- id: node-four-host-query-kinds
  desc: Four Node host or user query kinds
  crit: notable
  conf: 0.9
  size_max: 100000
  needs: 4
  any:
    - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
    - id: micro-behaviors/process/user/query::os-homedir-call
    - id: micro-behaviors/process/user/query::os-userinfo-call
    - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
    - id: micro-behaviors/fs/directory/cwd::process-cwd-call
    - id: micro-behaviors/network/interface::node-network-interfaces-call
    - id: micro-behaviors/communications/dns/client::js-dns-get-servers
  unless:
    - id: metadata/build/bundler/runtime::js-webpack-bundle
    - id: well-known/app/ai/coding-agent/gemini-cli/
