defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: json-windows-network-recon-command
    desc: Serializes Windows network survey commands
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (member_expression) @serialize
          arguments: (arguments . (object
            (pair key: [(property_identifier) (string)] @key
              value: (string) @command)) .)) @call
          (#eq? @serialize "JSON.stringify")
          (#match? @key "^['\"]?command['\"]?$")
          (#match? @command "(?i)ipconfig\\s+/all\\s*&&\\s*route\\s+print\\s*&&\\s*tasklist"))
