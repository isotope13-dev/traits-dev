defaults:
  platforms: [windows, unix]
  for: [package.json]
composite_rules:
  - id: node-host-profile-payload-fields
    desc: Payload object with host identity field names
    crit: notable
    conf: 0.97
    for: [javascript]
    all:
      - id: metadata/lang/source/syntax/assignment/name::js-payload-object-assignment
      - id: "metadata/lang/source/syntax/key-value::js-whoami-field"
      - id: micro-behaviors/communications/ip/endpoint::js-hostname-field
      - id: micro-behaviors/os/sysinfo/platform/string::platform-profile-field
      - id: micro-behaviors/fs/directory/cwd::node-payload-cwd-field
    near_lines: 24
