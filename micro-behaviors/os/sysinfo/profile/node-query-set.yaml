defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-host-information-query-set
    desc: At least three Node host-information query APIs
    crit: notable
    conf: 0.85
    needs: 3
    any:
      - id: micro-behaviors/process/user/query::os-homedir-call
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: micro-behaviors/os/sysinfo/performance::node-os-totalmem
      - id: micro-behaviors/network/interface::node-network-interfaces-call
  - id: small-node-host-user-post-cooccurrence
    desc: Small Node script has host/user queries and POST literal
    crit: notable
    conf: 0.92
    for: [javascript]
    all:
    - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
    - id: micro-behaviors/communications/http/post::post
    - id: metadata/file/size::javascript-small-file-5k
