composite_rules:
- id: shell-user-host-cwd-queries
  desc: Two user, hostname or cwd queries
  crit: notable
  conf: 0.92
  for:
  - shell
  scope: file
  needs: 2
  any:
  - id: micro-behaviors/process/user/query::identity-command-substitution
  - id: micro-behaviors/os/sysinfo/hostname::sh-hostname-command
  - id: micro-behaviors/fs/directory/cwd::shell-pwd-command-substitution
  platforms:
  - unix
  - windows
