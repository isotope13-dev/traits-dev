defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.93

composite_rules:
  - id: preinstall-node-host-user-query
    desc: Preinstall queries Node host and user identity
    all:
      - id: micro-behaviors/os/sysinfo/hostname/query::preinstall-node-os-hostname
      - id: micro-behaviors/process/identity/query/principal::preinstall-node-os-userinfo
