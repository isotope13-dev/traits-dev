# Diagnostics and reconnaissance use the same commands. These required
# observations do not establish an attacker or any outbound transfer.
defaults:
  platforms: [windows]
  for: [batch, powershell, shell, binaries]
composite_rules:
  - id: windows-survey-command-cluster
    desc: Multiple Windows host survey commands
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: micro-behaviors/network/status::netstat
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/process/identity/query::windows-whoami-command
      - id: micro-behaviors/os/sysinfo/profile::windows-systeminfo-command
    unless:
      - id: well-known/app/storage/peazip::peazip-main-executable
