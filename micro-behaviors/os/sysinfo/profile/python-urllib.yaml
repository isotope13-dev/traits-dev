# These observations also describe telemetry and enrollment clients. Neither
# same-file co-occurrence nor reading the username establishes unauthorized use.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable

composite_rules:
  - id: python-host-user-queries-with-urllib-post
    desc: Host/user queries and profile fields accompany urllib POST
    conf: 0.98
    near_lines: 60
    all:
      - id: python-host-information-query-combination
      - id: micro-behaviors/data/serialize/schema-object::python-host-profile-object-fields
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
    any:
      - id: micro-behaviors/process/identity/query::python-getpass-user
      - id: micro-behaviors/process/identity/query::python-imported-getpass-user
      - id: micro-behaviors/process/identity/query::os-getlogin-python
