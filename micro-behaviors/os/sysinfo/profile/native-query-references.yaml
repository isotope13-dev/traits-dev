# Host-query references in one program establish capabilities, not recon intent.
defaults:
  platforms: [unix, windows, macos]
  for: [scripts, binaries]

composite_rules:
  - id: cpu-network-disk-query-references
    desc: CPU, network and disk query references co-occur
    crit: notable
    conf: 0.85
    scope: leaf
    all:
      - id: micro-behaviors/os/sysinfo/hardware::cpu-info
      - id: micro-behaviors/communications/socket/interface::enumerate
      - id: micro-behaviors/os/sysinfo/disk::disk-identity-query-reference
