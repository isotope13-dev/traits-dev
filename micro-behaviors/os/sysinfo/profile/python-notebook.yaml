defaults:
  platforms: [windows, unix]
  for: [python]

# These queries can occur in mutually exclusive platform branches. Their
# co-occurrence establishes neither unauthorized collection nor data flow.
composite_rules:
  - id: notebook-browser-fingerprint-ip-context
    desc: Notebook fingerprint readback and IP-discovery endpoint coexist
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/hardware::python-embedded-fingerprintjs-load
      - id: micro-behaviors/process/interpreter/eval/indirect::notebook-js-result-readback
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: metadata/lang/source/syntax/member::visitor-id-arrow-callback

  - id: notebook-browser-host-identity-context
    desc: Notebook fingerprint near host and user queries
    crit: notable
    conf: 0.96
    near_lines: 120
    all:
      - id: notebook-browser-fingerprint-ip-context
      - id: micro-behaviors/process/identity/query/principal::python-current-username
      - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname

  - id: notebook-fingerprint-secret-error-identity-context
    desc: Notebook fingerprint and secret-error identity contexts coexist
    crit: notable
    conf: 0.97
    near_lines: 180
    all:
      - id: notebook-browser-host-identity-context
      - id: micro-behaviors/communications/http/post::kaggle-api-key-secret-request-context
      - id: micro-behaviors/data/parse/regex::secret-rpc-error-visitor-identity-context

  # This flow extracts an account identifier from an error, not a secret
  # value. Complete source review and synthetic success/error replays show
  # it is SDK tracking behavior. Keep the observations without treating
  # two overlapping identity profiles as independent suspicious signals.
  - id: secret-rpc-error-derived-visitor-identity
    desc: Secret-store errors supply a visitor identity
    crit: notable
    conf: 0.98
    near_lines: 45
    all:
      - id: micro-behaviors/data/parse/regex::python-response-error-derived-visitor-id
      - id: micro-behaviors/communications/http/post::kaggle-api-key-secret-request-context
      - id: micro-behaviors/communications/rpc::secret-read-rpc-session-token-context

  - id: notebook-secret-error-fingerprint-tracking
    desc: Notebook fingerprint with error-derived identity
    crit: notable
    conf: 0.97
    all:
      - id: secret-rpc-error-derived-visitor-identity
      - id: notebook-browser-host-identity-context
