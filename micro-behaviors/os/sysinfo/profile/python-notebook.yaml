defaults:
  platforms: [windows, unix]
  for: [python]

# These queries can occur in mutually exclusive platform branches. Their
# co-occurrence establishes neither unauthorized collection nor data flow.
composite_rules:
  - id: notebook-browser-fingerprint-ip-context
    desc: Notebook fingerprint readback and IP-discovery endpoint coexist
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/sysinfo/hardware::python-embedded-fingerprintjs-load
      - id: micro-behaviors/process/interpreter/eval/indirect::notebook-js-result-readback
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: metadata/lang/source/syntax/member::visitor-id-arrow-callback

  - id: notebook-browser-host-identity-context
    desc: Notebook fingerprint near host and user queries
    crit: notable
    conf: 0.96
    near_lines: 120
    all:
      - id: notebook-browser-fingerprint-ip-context
      - id: micro-behaviors/process/identity/query::python-current-username
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname

  - id: notebook-fingerprint-secret-error-identity-context
    desc: Notebook fingerprint and secret-error identity contexts coexist
    crit: notable
    conf: 0.97
    near_lines: 180
    all:
      - id: notebook-browser-host-identity-context
      - id: micro-behaviors/communications/http/post::kaggle-api-key-secret-request-context
      - id: micro-behaviors/data/parse/regex::secret-rpc-error-visitor-identity-context
