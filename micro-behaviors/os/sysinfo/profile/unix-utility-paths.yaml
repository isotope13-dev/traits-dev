defaults:
  platforms: [unix]
  for: [go, elf, macho]

composite_rules:
  - id: unix-profile-utility-path-set
    desc: References multiple Unix host-profile utilities
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/process/enumerate/ps::go-ps-command
      - id: micro-behaviors/network/status::go-netstat-command
      - id: micro-behaviors/os/sysinfo/disk::go-df-command
    needs: 2
