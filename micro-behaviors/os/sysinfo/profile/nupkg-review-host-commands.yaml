defaults:
  platforms: [windows]
  for: [powershell]
  size_max: 5242880
composite_rules:
  - id: powershell-host-query-command-set
    desc: PowerShell host profile command set
    crit: notable
    conf: 0.9
    attack: T1082,T1057,T1007,T1124
    needs: 3
    any:
    - id: micro-behaviors/os/sysinfo/profile::systeminfo-command-reference
    - id: micro-behaviors/process/enumerate/shell::tasklist
    - id: micro-behaviors/os/service/query::powershell-get-service
    - id: micro-behaviors/fs/enumerate/volume::powershell-get-psdrive
    - id: "micro-behaviors/network/neighbors::powershell-arp-display"
