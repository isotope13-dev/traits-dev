defaults:
  platforms: [unix, windows]
  for: [shell, package.json]
composite_rules:
- id: preinstall-host-profile-fields
  desc: Collects user, cwd and UID or home
  crit: notable
  conf: 0.985
  attack: "T1082"
  all:
  - id: micro-behaviors/process/identity/query/command::shell-user-field-capture
  - id: micro-behaviors/process/identity/query/command::shell-pwd-field-capture
  any:
  - id: micro-behaviors/process/identity/query/command::shell-capture-numeric-uid
  - id: micro-behaviors/process/identity/query/command::shell-home-field-capture
