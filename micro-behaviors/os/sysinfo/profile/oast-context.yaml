defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-oast-identity-query-cooccurrence
    desc: Node host and user queries beside an OAST endpoint
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/url/host::oob-endpoint-any
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/opena2a-arp/

