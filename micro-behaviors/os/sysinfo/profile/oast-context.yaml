defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # Hostname leg: a direct os.hostname() call, an aliased call, or a read of
  # /etc/hostname (the same value without the os module, e.g. fs.readFileSync).
  - id: node-hostname-query-any
    desc: Node hostname read by call or /etc/hostname
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/os/sysinfo/hostname/query::node-os-alias-hostname-call
      - id: micro-behaviors/fs/path/config/system::linux-hostname-path
  # User leg: os.userInfo(), an aliased userInfo() call, or a .username read.
  # Aliases such as `const o = require('os'); o.userInfo().username` are common.
  - id: node-userinfo-query-any
    desc: Node user identity by userInfo call or alias
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/process/identity/query/principal::node-os-alias-userinfo-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-username-read
  - id: node-oast-identity-query-cooccurrence
    desc: Node host and user queries beside an OAST endpoint
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
      - id: node-hostname-query-any
      - id: node-userinfo-query-any
