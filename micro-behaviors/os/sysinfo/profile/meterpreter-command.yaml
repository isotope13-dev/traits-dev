# A resource file is console input, not a native shell program. Match complete
# command lines rather than prose or a function with the same name. This is a
# query reference, not evidence of an unauthorized session or exfiltration.
defaults:
  platforms: [unix, windows]
  for: [scripts, text]
  crit: notable
  conf: 0.9

traits:
  - id: sysinfo-console-command-line
    desc: System-information console command line
    if:
      type: text
      regex: '(?m)^[ \t]*sysinfo[ \t]*\r?$'
