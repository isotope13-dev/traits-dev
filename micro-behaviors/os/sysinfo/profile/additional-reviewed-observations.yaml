composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: multiple-host-query-command-references
  desc: References multiple host-query commands
  conf: 0.6
  crit: notable
  needs: 2
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: well-known/lib/ui/highlight-js::bundled-library
  any:
  - id: micro-behaviors/process/user/query::whoami-cmd
  - id: micro-behaviors/fs/path/os/identity::uname-a-cmd
  - id: micro-behaviors/network/interface::javascript-interface-query-command
  - id: micro-behaviors/os/network/connections::tcp-udp-table-api-surface
  - id: micro-behaviors/process/enumerate/shell::ps-aux
  - id: micro-behaviors/process/enumerate/shell::ps-ef
  - id: micro-behaviors/process/enumerate/shell::tasklist
  - id: micro-behaviors/os/env/enumeration::printenv
  - id: micro-behaviors/process/user/query::id-cmd
  - id: micro-behaviors/os/env/enumeration::env-cmd
