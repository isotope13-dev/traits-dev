defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: vscode-extension-user-home-workdir-platform-profile
    desc: Collects VS Code user and host fields
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?s)username\s*:\s*username.{0,80}homeDir\s*:.{0,80}workingDir\s*:.{0,80}process\.platform'
