defaults:
  platforms: [unix, windows]
  for: [python]
  mbc: C0002

composite_rules:
  - id: python-cli-host-init-post
    desc: Host query near CLI init HTTP POST
    crit: notable
    conf: 0.98
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/url/telemetry::python-cli-init-api-path
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
    any:
      - id: micro-behaviors/os/sysinfo/hostname::python-os-uname-nodename
      - id: micro-behaviors/data/serialize/schema-object::host-field-key
