defaults:
  platforms: [freebsd, netbsd, unix]
  for: [swift]

traits:
  - id: swift-inventory-helper-call-sequence
    desc: Host, process and network inventory helper calls
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'querySystemInfo[\s\S]{0,400}enumerateProcesses[\s\S]{0,400}enumerateNetworkInterfaces'
