defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-host-user-query
    desc: Node queries host and user identity
    conf: 0.85
    all:
      - id: micro-behaviors/process/identity/query::os-userinfo-call
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/network/interface::node-network-interfaces-call

  - id: small-node-host-user-query
    desc: Small Node script queries host and user
    conf: 0.9
    all:
      - id: node-host-user-query
      - id: metadata/file/size::javascript-small-file-5k
