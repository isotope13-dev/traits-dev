defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-host-user-query
    desc: Node queries host and user identity
    conf: 0.85
    all:
      - id: micro-behaviors/process/user/query::os-userinfo-call
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/network/interface::node-network-interfaces-call
    unless:
      - id: well-known/lib/development/vscode::vscode-extension-uninstall-telemetry

  - id: small-node-host-user-query
    desc: Small Node script queries host and user
    conf: 0.9
    all:
      - id: node-host-user-query
      - id: metadata/file/size::javascript-small-file-5k
    unless:
      - id: metadata/lang/compiler/systems/
      - id: metadata/package/repository/
      - id: metadata/package/dependencies/manifest/name-form::platform-optional-native-wrapper
      - id: micro-behaviors/os/package-manager/publish::npm-native-binary-wrapper
      - id: well-known/lib/development/vscode::vscode-extension-uninstall-telemetry
