defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: locale-environment-launch-api-set
    desc: Locale, environment and launch-context APIs co-occur
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::locale-query-imports
      - id: micro-behaviors/os/env/enumerate::environment-block-enumeration
    any:
      - id: micro-behaviors/process/info/commandline::get-command-line
      - id: micro-behaviors/process/info/thread::get-current-thread-id
    unless:
      - id: well-known/app/system/drivers/nvidia::ngx-dll-basename
      - id: metadata/binary/symbols/count::many-exports-200
      - id: well-known/app/system/cvte-crashrpt/
