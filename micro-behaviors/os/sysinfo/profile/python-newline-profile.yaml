defaults:
  platforms: [unix, windows]
  for: [python, text]
  crit: notable

traits:
  - id: python-udp-dns-local-ip-probe
    desc: Probes local IP via 8.8.8.8 UDP socket
    conf: 0.94
    if:
      type: text
      regex: '(?s)8\.8\.8\.8.{0,180}SOCK_DGRAM'
  - id: python-login-node-uname-cwd-tuple
    desc: Joins getlogin, node, uname, and getcwd
    conf: 0.96
    if:
      type: text
      regex: 'getlogin\(\).{0,50}platform\.node\(\).{0,50}uname\(\).{0,50}getcwd\(\)'
