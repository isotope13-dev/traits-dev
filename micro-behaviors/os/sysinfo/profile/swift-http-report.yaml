defaults:
  platforms: [unix]
  for: [swift]

composite_rules:
  - id: swift-inventory-http-report-capability
    desc: Host inventory helpers and HTTP reporting
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/profile::swift-inventory-helper-call-sequence
      - id: micro-behaviors/communications/http/post::swift-urlrequest-post-method
      - id: micro-behaviors/communications/url/resource-path/collection::swift-collect-endpoint-literal
