# Installation context makes the combined survey worth investigating, but
# disclosed classroom canaries and telemetry can also perform these actions.
# These rules assert reconnaissance, not secret-value theft or C2.
#
# The survey and transport legs describe ONE script. Held flat under
# `scope: archive` alongside the hook declaration they were satisfiable by
# unrelated members of any large distribution, so the collection and transport
# legs are bound to one member below and only the manifest hook stays
# archive-scoped.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, package.json, tar, zip]
  crit: suspicious
  conf: 0.9

composite_rules:
  # Printing hostname, user, and interfaces while also opening an HTTPS
  # connection is a status or connectivity command. The install-hook composite
  # below is what makes the same survey worth a suspicious look.
  - id: node-host-survey-https-script
    desc: Script queries host identity and calls HTTPS
    crit: notable
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/process/user/query::node-os-alias-userinfo-call
      - id: micro-behaviors/network/interface::node-network-interfaces-call
      - id: micro-behaviors/communications/http/request/client::https-request

  - id: node-env-name-survey-https-script
    desc: Env keys, interfaces, and HTTPS calls coexist
    crit: notable
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/os/env/enumeration::js-object-keys-env
      - id: micro-behaviors/network/interface::node-network-interfaces-call
      - id: micro-behaviors/communications/http/request/client::https-request

  - id: npm-install-host-survey-with-https
    desc: Install hook combines host survey and HTTPS requests
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/sysinfo/profile::node-host-survey-https-script
    unless:
      - id: metadata/package/documentation/disclosure::bounded-depconf-research-beacon
      - id: metadata/package/documentation/disclosure::npm-config-diagnostic-research-beacon

  - id: npm-install-env-name-survey-with-https
    desc: Install hook enumerates env keys alongside host profiling
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/sysinfo/profile::node-env-name-survey-https-script
