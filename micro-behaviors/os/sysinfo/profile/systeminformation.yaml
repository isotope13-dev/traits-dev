defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: systeminformation-os-info-call
    desc: Calls systeminformation OS information API
    crit: component
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.osInfo\s*\('

  - id: systeminformation-versions-call
    desc: Calls systeminformation versions API
    crit: component
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.versions\s*\('

  - id: systeminformation-time-call
    desc: Calls systeminformation time API
    crit: component
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.time\s*\('

  - id: systeminformation-shell-call
    desc: Calls systeminformation shell API
    crit: component
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.shell\s*\('

  - id: systeminformation-system-call
    desc: Calls systeminformation system API
    crit: component
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.system\s*\('

composite_rules:
  - id: node-systeminformation-profile-query-set
    desc: Queries multiple systeminformation profile areas
    crit: notable
    conf: 0.9
    needs: 4
    any:
      - id: systeminformation-os-info-call
      - id: systeminformation-versions-call
      - id: systeminformation-time-call
      - id: systeminformation-shell-call
      - id: systeminformation-system-call
