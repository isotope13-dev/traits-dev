defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: windows-host-profile-api-set
  desc: Windows host profile API and endpoint set
  crit: notable
  conf: 0.94
  needs: 4
  any:
    - id: micro-behaviors/fs/enumerate/volume::get-disk-free-space
    - id: micro-behaviors/os/sysinfo/hostname::get-user-name
    - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-locales-symbol
    - id: micro-behaviors/time/query::get-timezone-information
    - id: micro-behaviors/communications/http/ip-discovery::ip-api-com
  unless:
    # A compiled AutoIt script carries the whole AutoIt runtime, and that runtime
    # is a Windows automation library: clipboard read/write, keyboard and mouse
    # state polling, window enumeration, host and locale queries, and temp-file
    # extraction of its own embedded script. Every compiled .au3 therefore shows
    # the full API surface regardless of what the script does -- Closure
    # Library's CI helper is 30 lines that close a dialog box.
    - id: metadata/lang/compiled::autoit-compiled-script
    - id: metadata/signed/platform/
    - id: metadata/signed/certificate/signature::pe-signature-verified-kv
    # Advanced Installer's unsigned bootstrapper checks OS and profile
    # properties as routine install prerequisites. Its framework imports
    # should not be treated as a victim-profiling cluster by themselves.
    - id: metadata/binary/installer/builder::advanced-installer-bootstrapper
    - id: desktop-app-profiling-context

- id: desktop-app-profiling-context
  desc: Desktop application runtime with expected host discovery
  crit: exception
  conf: 0.99
  any:
    - id: well-known/lib/runtime/scripted/electron::chrome-engine-binary-basename
    - id: well-known/lib/runtime/scripted/electron::cef-engine-binary-basename
    - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
    - id: well-known/app/storage/qbittorrent::qbittorrent-official-binary
    - id: well-known/app/utility/siw::siw-family-identity
    - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-windows-package-context
