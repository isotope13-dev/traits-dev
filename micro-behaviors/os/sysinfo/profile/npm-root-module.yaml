# Host queries and an empty export do not establish a dependency-confusion attack.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]

composite_rules:
  - id: root-javascript-host-survey-empty-exports
    desc: Root JavaScript module surveys host and exports an empty object
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: metadata/package/entrypoint::npm-root-javascript-source-member
      - id: micro-behaviors/data/control-flow/module-exec::module-empty-export
    needs: 4
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-arch-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-version-access

  - id: npm-root-host-survey-empty-exports
    desc: npm root module surveys host and exports an empty object
    crit: notable
    conf: 0.96
    for: [npm, tar, tgz, package.json, javascript, typescript]
    scope: archive
    all:
      - id: root-javascript-host-survey-empty-exports
      - id: metadata/package/entrypoint::npm-publish-root-manifest-with-root-javascript-entry
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/name/vocabulary::official-pm2-package
      - id: well-known/app/infrastructure/pm2/

