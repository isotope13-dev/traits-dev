defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
composite_rules:
  # Archive scope does not prove the hook executes the member with these calls,
  # or that the HTTP request sends the locally collected data.
  - id: npm-install-host-query-http-references
    desc: Install-hook package contains host queries and HTTP
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/sysinfo/profile::node-host-user-query
      - id: micro-behaviors/communications/http/request/client::node-https-get-dynamic
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
