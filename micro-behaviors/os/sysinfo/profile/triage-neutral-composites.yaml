---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - python
  id: python-host-queries-with-sha256
  desc: Host information queries co-occur with SHA-256 digest
  conf: 0.92
  near_lines: 30
  all:
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/crypto/hash/digest::python-sha256-hexdigest
- for:
  - python
  id: python-host-information-query-combination
  desc: Multiple host information query APIs co-occur
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/platform/host/
  - id: micro-behaviors/process/user/query::python-getpass-user
  - id: micro-behaviors/process/user/query::python-imported-getpass-user
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  - id: micro-behaviors/network/interface::python-getsockname-local-ip
  - id: micro-behaviors/process/user/query::os-getlogin-python
  - id: micro-behaviors/os/privilege/check::os-getuid-admin
  - id: micro-behaviors/os/privilege/check::ctypes-is-admin
  unless:
  - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
  - id: well-known/lib/ai/haystack-ai::haystack-package-path
- for:
  - scripts
  - binaries
  id: python-platform-query-combination
  desc: System platform profiling
  conf: 0.8
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/platform/host::platform-system
  - id: micro-behaviors/os/sysinfo/platform/host::platform-node
  - id: micro-behaviors/os/sysinfo/platform/host::platform-full
