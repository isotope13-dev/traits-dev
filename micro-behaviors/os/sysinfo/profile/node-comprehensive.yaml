defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-profile-identity-vector
    desc: Queries user identity or network interfaces
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: micro-behaviors/network/interface::node-network-interfaces-call
  - id: node-comprehensive-host-query-set
    desc: Queries at least four host profile dimensions
    crit: notable
    conf: 0.9
    mbc: E1082
    attack: T1082
    needs: 4
    all:
      - id: node-profile-identity-vector
    any:
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-arch-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-release-call
      - id: micro-behaviors/process/user/query::os-userinfo-call
      - id: micro-behaviors/os/sysinfo/cpu::node-cpu-information-query
      - id: micro-behaviors/os/sysinfo/performance::node-os-totalmem
      - id: micro-behaviors/network/interface::node-network-interfaces-call

  - id: node-host-user-or-ci-query-set
    desc: Queries host profile and user or CI context
    crit: notable
    conf: 0.98
    attack: T1082
    near_bytes: 2400
    all:
      - id: micro-behaviors/network/interface::node-network-interfaces-call
      - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-arch-call
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
    any:
      - id: micro-behaviors/os/env/read::ci-env-reference-set
      - id: micro-behaviors/process/user/query::os-userinfo-username-read
      - id: micro-behaviors/process/user/query::os-userinfo-call

