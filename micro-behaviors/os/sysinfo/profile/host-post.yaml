defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: os-hostname-json-field
    desc: JSON hostname field comes from os.hostname()
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: JSON.stringify
      arg:
        index: 0
        from:
          field: hostname
          call: '^os\.hostname$'

composite_rules:
- id: node-host-query-json-post-clues
  desc: Node host query accompanies HTTP(S) POST and JSON serialization
  crit: notable
  conf: 0.9
  scope: file
  all:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-identifier
  any:
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/request/client::https-request
