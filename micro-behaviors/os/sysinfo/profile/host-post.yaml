defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: node-host-query-json-post-clues
  desc: Node host query accompanies HTTPS POST and JSON serialization
  crit: notable
  conf: 0.9
  scope: file
  all:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-identifier
  any:
  - id: micro-behaviors/os/sysinfo/hostname::os-hostname-call
