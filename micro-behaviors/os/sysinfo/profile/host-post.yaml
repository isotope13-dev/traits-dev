defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: os-hostname-json-field
    desc: JSON hostname field comes from os.hostname()
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: JSON.stringify
      arg:
        index: 0
        from:
          field: hostname
          call: '^os\.hostname$'

  - id: os-homedir-json-field
    desc: Object home field reads os.homedir()
    conf: 0.97
    if:
      type: text
      regex: 'user_homeDir\s*:\s*os\.homedir\s*\(\s*\)'

  - id: os-platform-json-field
    desc: Object platform field reads os.platform()
    conf: 0.95
    if:
      type: text
      regex: 'user_platform\s*:\s*os\.platform\s*\(\s*\)'

  - id: os-hostname-device-json-field
    desc: Object device field reads os.hostname()
    conf: 0.97
    if:
      type: text
      regex: 'user_device\s*:\s*os\.hostname\s*\(\s*\)'

composite_rules:
- id: node-host-query-json-post-clues
  desc: Node host query accompanies HTTP(S) POST and JSON serialization
  crit: notable
  conf: 0.9
  scope: file
  all:
  # Co-occurrence is the supported claim: none of these atoms establishes
  # that the hostname is in the body or that reporting is unauthorized.
  - id: micro-behaviors/os/sysinfo/hostname/query::node-hostname-read
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  any:
  - id: micro-behaviors/communications/http/request/client::http-request
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/request/dynamic::node-scheme-selected-http-post-body
