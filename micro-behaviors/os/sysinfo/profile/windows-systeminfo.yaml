defaults:
  platforms: [unix, windows]
  for: [batch, powershell, shell, binaries]
  attack: T1082
traits:
  - id: windows-systeminfo-command
    desc: Windows systeminfo command
    crit: notable
    conf: 0.72
    for: [batch, powershell, shell]
    if:
      type: text
      regex: (?i)(^|[\r\n&|({])\s*systeminfo(\.exe)?\b
  - id: systeminfo-command-reference
    desc: References the Windows systeminfo utility
    crit: notable
    conf: 0.72
    for: [batch, class, pe, powershell, pyc, python]
    platforms: [windows]
    if:
      type: text
      # Exclude runtime.systeminfo and identifiers such as systeminformation.
      regex: '(?i)(^|[^a-z0-9_.])systeminfo(\.exe)?\b'
