# Android hardware serial-number accessor in JVM source: Build.getSerial()
# and the Build.SERIAL field read the device's factory serial. Device
# management reads it routinely; implants also use it as a per-victim
# identity. The accessor reference alone establishes no collection,
# transmission, or purpose.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: android-build-serial-accessor
    desc: Android Build serial-number accessor reference
    if:
      type: text
      regex: 'Build\.(getSerial\s*\(\s*\)|SERIAL\b)'
