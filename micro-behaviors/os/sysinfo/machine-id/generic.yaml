defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts]

traits:
  - id: hash-algorithms
    desc: JavaScript references MD5 or SHA-256 hashing
    crit: baseline
    conf: 0.6
    for: [javascript, typescript]
    if:
      type: string_literal
      regex: '(?i)\\b(md5|sha256)\\b'
  - id: python-hardware-fingerprint-call
    desc: Calls a Python hardware fingerprint helper
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      exact: get_hardware_fingerprint
  # Substring, not a word match: Cython-compiled modules abut identifiers in
  # one packed string table, so no word boundary survives compilation.
  - id: python-device-id-getter
    desc: Python device identifier getter reference
    crit: notable
    conf: 0.9
    for: [python, pe, dll, so]
    if:
      type: text
      substr: get_device_id
  - id: macos-ioreg-platform-expert-query
    desc: References macOS IOPlatformExpertDevice query
    crit: notable
    conf: 0.85
    for: [macho, c, shell, scripts, javascript, typescript]
    platforms: [macos]
    if:
      type: text
      regex: ioreg[^\n]{0,60}IOPlatformExpertDevice

  - id: generate-hwid
    desc: GenerateHardwareId function
    crit: notable
    conf: 0.65
    if:
      type: text
      substr: GenerateHardwareId
    downgrade:
      any:
        - id: metadata/signature/verified/platform::microsoft
  - id: get-hwid
    desc: GetHardwareId routine-name reference
    crit: notable
    conf: 0.65
    if:
      type: text
      substr: GetHardwareId
    downgrade:
      any:
        - id: metadata/signature/verified/platform::microsoft
  - id: hardware-id-string
    desc: hardware_id string
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)\bhardware_id\b
    not:
      - substr: V4_Driver_Hardware_IDs
    downgrade:
      any:
        - id: metadata/signature/verified/platform::microsoft
  - id: hwid-string
    desc: "Hardware ID (HWID) reference"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: (?i)\bhwid\b
    not:
      - substr: Failed to
    downgrade:
      any:
        - id: metadata/signature/verified/platform::microsoft
  # A machine-id field is a neutral host-identifier observation. Intent
  # (license binding, fingerprint exfiltration) comes from composites that
  # reference it. Match the common service/mac variants as well as the bare
  # field, without assigning product-specific credential meaning.
  - id: machineid-identifier-field
    desc: References a MachineId field
    crit: notable
    conf: 0.9
    for: [javascript, typescript, json, python, go, csharp, java, php]
    if:
      type: text
      regex: '(\.MachineId\b|["'']MachineId["''])'

  - id: initialize-fingerprint-helper
    desc: Initializes a client fingerprint helper
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    attack: T1082
    mbc: E1082
    if:
      type: text
      regex: '\binitialize(Client|Device|Machine)?Fingerprint\s*[:.(]'

  - id: get-fingerprint-helper-reference
    desc: References a client or device fingerprint getter
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    attack: T1082
    mbc: E1082
    if:
      type: text
      regex: '\bget(Client|Device|Machine)?(Footprint|Fingerprint)[A-Za-z0-9_]{0,24}\s*:'

  - id: machineguid
    desc: MachineGuid registry key
    crit: baseline
    conf: 0.7
    platforms: [windows]
    if:
      type: text
      word: MachineGuid
    unless:
      - id: objectives/anti-static/obfuscation/payload/self-read::vmware-tools-marker
  - id: cryptography-machineguid-path
    desc: Windows MachineGuid registry path
    crit: baseline
    conf: 0.86
    platforms: [windows]
    if:
      type: text
      substr: SOFTWARE\Microsoft\Cryptography\MachineGuid

  # The value-query spelling: the Cryptography key is opened and the
  # MachineGuid value is read by name, so the full registry path never
  # appears as one string. This establishes the query, not its purpose;
  # licensing, inventory and host binding all read the same value.
  - id: python-winreg-machineguid-query
    desc: Python queries MachineGuid via winreg
    crit: notable
    conf: 0.92
    for: [python]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)winreg\.QueryValueEx\s*\([^)]{0,80}[''"]MachineGuid[''"]'

  - id: powershell-machineguid-http-query
    desc: MachineGuid used as HTTP query
    crit: notable
    conf: 0.94
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?is)\bMachineGuid\b.{0,240}\?id='
  - id: microsoft-mrt-guid-path
    desc: Microsoft MRT GUID registry path
    crit: baseline
    conf: 0.9
    platforms: [windows]
    if:
      type: text
      substr: SOFTWARE\Microsoft\RemovalTools\MRT\GUID
  - id: ps-productid-registry-read-hklm-first
    desc: PowerShell reads Windows ProductID registry
    crit: baseline
    conf: 0.85
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: HKLM[:\\][^\n"']{0,8}SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion[^\n]{0,200}ProductID
      case_insensitive: true
  - id: ps-productid-registry-read-productid-first
    desc: PowerShell reads Windows ProductID registry
    crit: baseline
    conf: 0.85
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: ProductID[^\n]{0,200}HKLM[:\\][^\n"']{0,8}SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion
      case_insensitive: true

  - id: hash-of-host-identity
    desc: Hash call over hostname or machine serial
    for: [c, cpp, python, powershell, csharp, javascript, go, rust]
    crit: notable
    conf: 0.91
    if:
      type: text
      # No bare `serial`: that is a certificate serial in every X.509 tool
      # (wolfSSL's OCSP test-blob generator hashes one).
      regex: (?i)\b(md5|sha(1|256))\([^)]{0,80}\b(host(name)?|machine_?(name)?|(disk|volume)_?serial)\b
composite_rules:
  # Host-keyed execution gate: the MachineGuid is hashed, a file named by
  # that digest is looked for beside the script, and the process exits
  # when it is absent. The legs are close together because the digest of
  # the queried value is what the existence check consumes. This is a
  # capability observation only: license binding uses the same shape, so
  # intent is left to composites that add a payload.
  - id: python-machineguid-hash-marker-gate
    desc: Python gates on MachineGuid hash marker
    crit: notable
    conf: 0.9
    attack: T1082
    for: [python]
    platforms: [windows]
    near_lines: 30
    all:
      - id: python-winreg-machineguid-query
      - id: micro-behaviors/crypto/hash/digest/sha2::python-sha256-hexdigest
      - id: micro-behaviors/fs/file/stat::path-exists
      - id: micro-behaviors/process/exit/terminate::python-sys-exit-symbol
  - id: machine-id-generation
    desc: Generates a host identifier from system data and a hash
    crit: notable
    conf: 0.85
    mbc: E1592
    attack: T1082
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::createhash-api-name
      - id: hash-algorithms
    any:
      - id: micro-behaviors/os/sysinfo/hostname/query::os-hostname-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/network/interface/query::node-network-interfaces-call
  - id: ps-productid-registry-read
    desc: PowerShell reads Windows ProductID registry
    crit: baseline
    conf: 0.85
    for: [powershell]
    platforms: [windows]
    any:
      - id: ps-productid-registry-read-hklm-first
      - id: ps-productid-registry-read-productid-first
