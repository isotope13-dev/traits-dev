defaults:
  for: [binaries, c]
  crit: baseline
  mbc: E1082
  attack: T1082
  platforms:
    - unix
    - windows
traits:
  - id: dbus-machine-id-path
    desc: dbus machine-id path
    conf: 0.7
    platforms:
      - linux
    if:
      type: text
      substr: /var/lib/dbus/machine-id
  - id: etc-machine-id-path
    desc: /etc/machine-id path
    conf: 0.7
    platforms:
      - linux
    if:
      type: text
      substr: /etc/machine-id
  - id: machine-id-string
    desc: "Host /etc/machine-id reference"
    conf: 0.5
    platforms:
      - linux
    for:
      - elf
      - c
    if:
      type: text
      substr: machine-id
  - id: machineid-camel
    desc: MachineId string
    conf: 0.5
    platforms:
      - windows
      - linux
      - macos
    if:
      type: text
      substr: MachineId
  - id: product-uuid-string
    desc: "DMI product_uuid host fingerprint"
    conf: 0.5
    platforms:
      - linux
    for:
      - elf
      - c
    if:
      type: text
      substr: product_uuid
  - id: product-uuid-path
    desc: DMI product_uuid path
    conf: 0.7
    platforms:
      - linux
    for:
      - elf
      - c
    if:
      type: text
      substr: /sys/class/dmi/id/product_uuid
  - id: etc-hostname
    desc: /etc/hostname path
    conf: 0.5
    platforms:
      - unix
    for:
      - elf
      - c
    if:
      type: text
      substr: /etc/hostname
  - id: fingerprint-prefix-a
    desc: hardware/device fingerprint string
    conf: 0.4
    platforms:
      - linux
      - windows
      - macos
    if:
      type: text
      regex: (hardware|device|machine|system)[\s_-]?fingerprint
      case_insensitive: true
  - id: fingerprint-prefix-b
    desc: host fingerprint string
    conf: 0.4
    platforms:
      - linux
      - windows
      - macos
    if:
      type: text
      regex: host[\s_-]?fingerprint
      case_insensitive: true
  - id: fingerprint-suffix
    desc: fingerprint id/generation string
    conf: 0.4
    platforms:
      - linux
      - windows
      - macos
    if:
      type: text
      regex: fingerprint[\s_-]?(id|gen|collect)
      case_insensitive: true
  # Script runtimes read the same host identifiers directly: Node's
  # readFileSync("/etc/machine-id") or execSync("ioreg ..."). The
  # binaries/C atoms above cannot match those files, so JavaScript gets its
  # own atoms. A stable host-identifier read is version-diff signal whether
  # the consumer is license metering or fingerprint exfiltration; the
  # doubled-backslash alternation matches JS-escaped registry paths in raw
  # source as well as the unescaped form.
  - id: js-machine-id-path-read
    desc: JavaScript reads the Linux machine-id file
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    platforms: [linux]
    if:
      type: text
      regex: /etc/machine-id|/var/lib/dbus/machine-id
  - id: js-machineguid-registry-path
    desc: JS MachineGuid registry path reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    platforms: [windows]
    if:
      type: text
      regex: 'SOFTWARE\\{1,2}Microsoft\\{1,2}Cryptography[^\n]{0,24}MachineGuid'
composite_rules:
  - id: fingerprint-string
    desc: hardware/device fingerprint string
    conf: 0.4
    platforms:
      - linux
      - windows
      - macos
    any:
      - id: fingerprint-prefix
      - id: fingerprint-suffix
  - id: fingerprint-prefix
    desc: hardware/device fingerprint string
    conf: 0.4
    platforms:
      - linux
      - windows
      - macos
    any:
      - id: fingerprint-prefix-a
      - id: fingerprint-prefix-b
