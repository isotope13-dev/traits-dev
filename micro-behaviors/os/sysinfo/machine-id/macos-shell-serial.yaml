defaults:
  platforms: [macos]
  for: [scripts]
  crit: notable
  attack: T1082
traits:
  - id: shell-hardware-serial-query
    desc: system_profiler reads hardware serial
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: 'system_profiler\s+SPHardwareDataType[^\n]{0,60}Serial Number'
  - id: shell-ioreg-serial-query
    desc: Queries IOPlatformSerialNumber via ioreg
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: 'ioreg[^\n]{0,80}IOPlatformSerialNumber'
