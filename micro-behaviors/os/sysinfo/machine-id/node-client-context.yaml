# Co-occurrence does not establish data flow, destination, or malicious intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  - id: fingerprint-client-context-socket-clues
    desc: Fingerprint, client-context and socket-send references
    conf: 0.9
    near_bytes: 800
    all:
      - id: micro-behaviors/os/sysinfo/machine-id::get-fingerprint-helper-reference
      - id: metadata/lang/source/syntax/assignment/member::node-client-context-await-assignment
      - id: micro-behaviors/communications/socket/send/message::node-getsocket-send-call
  - id: fingerprint-client-context-header-clues
    desc: Fingerprint getter near client-context header reference
    conf: 0.9
    near_bytes: 800
    all:
      - id: micro-behaviors/os/sysinfo/machine-id::get-fingerprint-helper-reference
      - id: micro-behaviors/communications/http/header/client::x-client-context-header-map-entry
