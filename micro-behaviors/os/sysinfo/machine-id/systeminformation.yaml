# A single inventory API call establishes a capability, not reconnaissance.
# Match the call target, excluding comments and longer lookalike names.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: si-uuid-call
    desc: Calls si.uuid machine identifier query
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: si.uuid
