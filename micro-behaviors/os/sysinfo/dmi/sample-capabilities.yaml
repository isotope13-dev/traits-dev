traits:
- id: python-dmi-product-name-path
  desc: References DMI product-name sysfs path
  conf: 0.92
  if:
    type: text
    substr: /sys/class/dmi/id/product_name
  platforms:
  - unix
  for:
  - python
  - pyc
- id: product-serial
  desc: References a DMI product-serial sysfs path
  conf: 0.6
  if:
    type: string_literal
    regex: (?i)/sys/(class|devices/virtual)/dmi/id/product[_-]serial
  platforms: &id001
  - windows
  - unix
  for: &id002
  - scripts
  - binaries
- id: board-serial
  desc: References a DMI board-serial sysfs path
  conf: 0.6
  if:
    type: string_literal
    regex: (?i)/sys/(class|devices/virtual)/dmi/id/board[_-]serial
  platforms: *id001
  for: *id002
composite_rules:
- id: dmi-fields
  desc: Contains at least two DMI or SMBIOS observations
  conf: 0.5
  needs: 2
  any:
  - id: micro-behaviors/os/sysinfo/dmi::dmi-vendor-product
  - id: micro-behaviors/os/sysinfo/dmi::dmidecode
  - id: micro-behaviors/os/sysinfo/dmi::dmi-sysfs
  - id: micro-behaviors/os/sysinfo/dmi::product-serial
  - id: micro-behaviors/os/sysinfo/dmi::board-serial
  platforms: *id001
  for: *id002
- id: dmi-smbios
  desc: Contains DMI or SMBIOS information references
  conf: 0.75
  any:
  - id: micro-behaviors/os/sysinfo/dmi::dmi-fields
  - id: micro-behaviors/os/sysinfo/dmi::dmidecode
  platforms: *id001
  for: *id002
defaults:
  crit: notable
