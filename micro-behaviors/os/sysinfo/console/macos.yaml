defaults:
  platforms: [macos]
  for: [scripts, macho]

traits:
- id: macos-session-screen-lock-key
  desc: References macOS session screen-lock state key
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: CGSSessionScreenIsLocked
  downgrade:
    any:
    - id: metadata/binary/vendor/
    - id: metadata/signed/platform::apple
