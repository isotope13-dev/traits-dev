# .NET hostname checks against common VM/sandbox marker strings.
defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
  conf: 0.93
  attack: T1497.001

traits:
  - id: dotnet-vm-hostname-marker-sandbox
    desc: .NET sandbox hostname marker string
    conf: 0.85
    if:
      type: text
      substr: '"sandbox"'
  - id: dotnet-vm-hostname-marker-vmware
    desc: .NET VMware hostname marker string
    conf: 0.85
    if:
      type: text
      substr: '"vmware"'
  - id: dotnet-vm-hostname-marker-vbox
    desc: .NET VirtualBox hostname marker string
    conf: 0.85
    if:
      type: text
      substr: '"vbox"'

composite_rules:
  - id: dotnet-vm-hostname-markers
    desc: .NET VM hostname marker string set
    needs: 2
    any:
      - id: dotnet-vm-hostname-marker-sandbox
      - id: dotnet-vm-hostname-marker-vmware
      - id: dotnet-vm-hostname-marker-vbox
