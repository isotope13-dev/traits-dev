# Neutral observations and discriminating identities.
traits:
- id: hypervisor-name-literal
  desc: Hypervisor name as a whole string literal
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    regex: (?i)^(qemu|vmware|virtualbox|kvm)$
  unless:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
- id: vm-platform-bus-name-literal
  desc: VM platform or bus name string literal
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    regex: (?i)^(xen|parallels|virtio|vmbus)$
defaults:
  for:
  - javascript
  - powershell
  platforms:
  - windows
