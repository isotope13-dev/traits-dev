# Neutral observations and discriminating identities.
traits:
- platforms:
  - windows
  - unix
  for:
  - binaries
  id: virtio-reference
  desc: Virtio device identifier reference
  crit: notable
  conf: 0.5
  if:
    type: text
    word: virtio
    case_insensitive: true
  unless:
  - id: metadata/package/compat::virtualbox-platform-component
  - type: metrics
    field: sections.count
    max: 0
  - id: metadata/vendor/identity/
  - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/tool/development/runtime/qemu::qemu-system-emulator
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
