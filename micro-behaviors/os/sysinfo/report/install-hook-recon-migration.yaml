defaults:
  platforms:
  - unix
  - windows
traits:
- id: js-hostname-pwd-whoami-chain
  desc: JS contains hostname pwd whoami chain
  crit: suspicious
  conf: 0.97
  attack: T1082
  for:
  - javascript
  if:
    type: text
    regex: hostname\s*;\s*pwd\s*;\s*whoami
- id: js-host-profile-command-sequence
  desc: JS sequences host profile commands
  crit: suspicious
  conf: 0.96
  attack: T1082
  for:
  - javascript
  if:
    type: text
    regex: hostname.{0,80}pwd.{0,80}whoami
    not:
    - regex: hostname["']\s*:\s*case
    - regex: case["']hostname["']
    - regex: '(?i)\bhostname,\s*'
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name

composite_rules:
- id: js-shell-host-identity-pair
  desc: JS shell helper collects user and host identity
  crit: notable
  conf: 0.96
  attack: T1033,T1082
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/process/identity/query/command::node-shell-id-command
  - id: micro-behaviors/os/sysinfo/hostname/command::node-shell-hostname-command
