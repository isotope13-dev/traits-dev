defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]

traits:
- id: sysinfo-json-beacon-keys
  desc: System profile field-name sequence
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: "platform:.{0,50}host:.{0,50}uptime:.{0,50}load:"
composite_rules:
- id: npm-sysinfo-json-shape
  desc: System-profile fields and JSON stringification
  crit: notable
  conf: 0.92
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/os/sysinfo/report::sysinfo-json-beacon-keys
  - id: micro-behaviors/data/serialize/json::json-stringify-identifier
