defaults:
  for:
  - shell
  platforms:
  - macos
  conf: 0.9
  crit: notable
traits:
- id: system-info-collector-output--rx-1
  desc: Prints system-information output labels
  if:
    type: text
    regex: echo\s+"?(SYSTEM_INFO|HOST_INFO)=
- id: system-info-collector-output--rx-2
  desc: Prints system-information output labels
  if:
    type: text
    regex: echo\s+"?(HARDWARE_INFO|HOST_OS)=
- id: system-info-collector-output--rx-3
  desc: Prints system-information output labels
  if:
    type: text
    regex: echo\s+"?(HOST_ARCH|CPU_MODEL)=
- id: system-info-collector-output--rx-4
  desc: Prints CPU vendor output label
  if:
    type: text
    regex: echo\s+"?(CPU_VENDOR)=
composite_rules:
- id: system-info-collector-output
  desc: Prints system-information output labels
  any:
  - id: micro-behaviors/os/sysinfo/report::system-info-collector-output--rx-1
  - id: micro-behaviors/os/sysinfo/report::system-info-collector-output--rx-2
  - id: micro-behaviors/os/sysinfo/report::system-info-collector-output--rx-3
  - id: micro-behaviors/os/sysinfo/report::system-info-collector-output--rx-4
