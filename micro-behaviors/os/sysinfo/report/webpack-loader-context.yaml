# Encoded process and loader context fields.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: loader-process-identity-report-fields
  desc: Process PID and encoded cwd fields
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'pid\s*:\s*process\.pid[\s\S]{0,180}cwd\s*:\s*base64url\(process\.cwd\(\)\)'
- id: loader-root-context-report-field
  desc: Encoded loader root context field
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'rootContext\s*:\s*base64url\(loaderContext\.rootContext'
- id: loader-resource-report-field
  desc: Encoded loader resource path field
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'resource\s*:\s*base64url\(loaderContext\.resourcePath'

composite_rules:
- id: loader-context-report-fields
  desc: Encoded loader and process context fields
  crit: suspicious
  conf: 0.97
  near_lines: 10
  all:
  - id: loader-process-identity-report-fields
  - id: loader-root-context-report-field
  - id: loader-resource-report-field
