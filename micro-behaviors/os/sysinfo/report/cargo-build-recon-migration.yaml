defaults:
  attack: T1082
  platforms: [unix, windows]

traits:
  - id: micro-behaviors/os/sysinfo/report::rust-build-host-user-path-recon
    desc: Rust source queries host user and cwd
    crit: suspicious
    conf: 0.98
    for: [rust]
    if:
      type: text
      regex: 'Command::new\("hostname"\).{0,240}Command::new\("whoami"\).{0,240}current_dir'
  # `Command::new("hostname")` / `Command::new("whoami")` are neutral Rust
  # capabilities with no build-script context in the matcher, so they live in
  # micro-behaviors (os/sysinfo/hostname::rust-command-hostname,
  # process/identity/query::rust-command-whoami) and are referenced from the
  # composites below.

composite_rules:
  - id: micro-behaviors/os/sysinfo/report::rust-build-host-user-command-recon
    desc: Build script and host user command references
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/os/sysinfo/hostname/command::rust-command-hostname
      - id: micro-behaviors/process/identity/query/command::rust-command-whoami
