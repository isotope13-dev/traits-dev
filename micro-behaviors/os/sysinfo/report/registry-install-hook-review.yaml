defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: registry-recon-user-host-cwd
    desc: User, hostname and working-directory commands
    crit: notable
    conf: 0.97
    attack: "T1082"
    if:
      type: text
      regex: "whoami\\s*&&\\s*hostname\\s*&&\\s*pwd|hostname\\s*&&\\s*pwd\\s*&&\\s*whoami"
