defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

composite_rules:
- id: node-inline-exec-sysinfo
  desc: Inline preinstall references system information
  crit: suspicious
  conf: 0.95
  attack: "T1082"
  all:
  - id: metadata/package/scripts/command::preinstall-inline-node-const-reference
  - id: micro-behaviors/os/sysinfo/platform/runtime/environment::js-os-platform
  any:
  - id: micro-behaviors/os/sysinfo/platform/runtime/environment::js-os-arch
  - id: metadata/package/scripts/reference::js-execsync-command
  - id: micro-behaviors/os/sysinfo/command::js-execsync-systeminfo
  - id: micro-behaviors/fs/read/file/account::js-execsync-passwd
  - id: micro-behaviors/process/identity/query/principal::js-execsync-whoami
- id: postinstall-run-hostname-env-object
  desc: postinstall collects hostname and env
  crit: suspicious
  conf: 0.96
  attack: "T1082"
  all:
  - id: micro-behaviors/os/sysinfo/report::postinstall-run-hostname-field
  - id: micro-behaviors/os/sysinfo/report::postinstall-env-object-field
- id: postinstall-host-env-object
  desc: postinstall builds host env object
  crit: suspicious
  conf: 0.96
  attack: "T1082"
  any:
  - id: micro-behaviors/os/sysinfo/report::postinstall-os-host-env-object
  - id: micro-behaviors/os/sysinfo/report::postinstall-run-hostname-env-object
- id: postinstall-host-file-profile-object
  desc: Postinstall host file and directory references
  crit: suspicious
  conf: 0.97
  attack: "T1082,T1005"
  all:
  - id: micro-behaviors/fs/path/config/network::postinstall-etc-hosts-reference
  - id: micro-behaviors/fs/path/log/system::postinstall-cloud-init-read
  any:
  - id: micro-behaviors/os/sysinfo/command::postinstall-opt-listing
  - id: micro-behaviors/fs/path/package-manager::postinstall-root-npmrc-read
- id: node-oob-recon
  desc: Preinstall system clues and OASTify reference
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/package/scripts/command::preinstall-inline-node-const-reference
  - id: micro-behaviors/communications/url/host/oob/package::js-oastify-host
  any:
  - id: micro-behaviors/os/sysinfo/platform/runtime/environment::js-os-platform
  - id: micro-behaviors/os/sysinfo/platform/runtime/environment::js-os-arch
  - id: metadata/package/scripts/reference::js-execsync-command
- id: postinstall-inline-exec-recon
  desc: Inline postinstall with preinstall system references
  crit: suspicious
  conf: 0.95
  attack: "T1059.007"
  all:
  - id: metadata/package/scripts/command::postinstall-inline-node-const-reference
  - id: metadata/package/scripts/reference::js-require-child-process
  any:
  - id: micro-behaviors/os/sysinfo/command::js-execsync-systeminfo
  - id: micro-behaviors/fs/read/file/account::js-execsync-passwd
