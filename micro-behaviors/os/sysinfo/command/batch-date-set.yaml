# `date YYYY-M-D` with a value (no prompt) sets the system clock from a batch
# file. A bare `date` only prints it. Years before 2010 are the clock-rollback
# form, written year-first or month-first.
defaults:
  platforms: [windows]
  for: [batch, text]
traits:
  - id: batch-date-set-literal
    desc: Batch sets system date to a literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*date\s+\d{1,4}[-/.]\d{1,2}[-/.]\d{1,4}\s*$'
  - id: batch-date-year-before-2010
    desc: Batch date year is before 2010
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*date\s+(19\d\d|200\d)[-/.]\d{1,2}[-/.]\d{1,2}\s*$'
  - id: batch-date-month-first-before-2010
    desc: Month-first batch date before 2010
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*date\s+\d{1,2}[-/.]\d{1,2}[-/.](19\d\d|200\d)\s*$'
