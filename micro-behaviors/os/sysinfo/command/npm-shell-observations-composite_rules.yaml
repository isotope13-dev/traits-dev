defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: script-sysinfo-cmd-1
  desc: "Script runs system info"
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/os/sysinfo/platform/host::script-sysinfo-cmd-1--uname
  - id: metadata/package/scripts/discovery::preinstall-whoami
  - id: micro-behaviors/os/sysinfo/hostname/command::script-sysinfo-cmd-1--hostname

- id: script-sysinfo-cmd
  desc: Script runs system info command
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/os/sysinfo/command::script-sysinfo-cmd-1
  - id: micro-behaviors/os/sysinfo/network::script-sysinfo-cmd-2
  - id: micro-behaviors/os/sysinfo/command::script-sysinfo-cmd-3
