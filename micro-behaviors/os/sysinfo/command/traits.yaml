# Windows host-inventory utilities passed to process-launch APIs. Keeping this
# invocation form separate from the shell-command atoms lets composites cover
# both direct commands and source-level subprocess calls without broadening a
# directory match to unrelated system-information APIs.
defaults:
  platforms: [windows]
  for: [scripts, javascript, typescript, python, powershell, batch]
  attack: T1082

traits:
  - id: windows-systeminfo-command-string
    desc: systeminfo passed to a process-launch API
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)\b(exec\w*|spawn|Popen|run)\([^)]{0,60}['"]systeminfo['"]
