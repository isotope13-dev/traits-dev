# The whoami boundary excludes identifiers and method calls.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
traits:
- id: php-repeated-whoami-text
  desc: Matches whoami command token
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    regex: "[^A-Za-z0-9_-]whoami[^A-Za-z0-9_(]"
- id: php-repeated-uname-text
  desc: Matches 'uname -a'
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: uname -a
