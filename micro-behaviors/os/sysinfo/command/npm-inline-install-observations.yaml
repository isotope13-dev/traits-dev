defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  attack: T1082

traits:
- id: js-execsync-systeminfo
  desc: JavaScript runs Windows systeminfo command
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: "scripts.preinstall"
    substr: "systeminfo"
- id: postinstall-opt-listing
  desc: postinstall lists /opt
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: "scripts.postinstall"
    substr: "ls -la /opt/"
