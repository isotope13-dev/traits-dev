# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - perl
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.93
traits:
- id: perl-host-recon-command-list
  desc: Host, identity and working-directory commands
  if:
    type: string_literal
    regex: uname -a;.{0,50}id;.{0,50}pwd;
