# These APIs discover an existing directory; they do not create one.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
traits:
  - id: python-gettempdir-reference
    desc: Temp directory string lookup
    crit: notable
    conf: 0.66
    if:
      type: text
      substr: gettempdir
  - id: python-gettempdir-symbol
    desc: Gets temp directory path
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: tempfile.gettempdir
composite_rules:
  - id: python-temp-directory-lookup
    desc: Gets system temp directory
    crit: notable
    conf: 0.75
    any:
      - id: python-gettempdir-reference
      - id: python-gettempdir-symbol
