defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.7
traits:
  - id: rust-temp-dir
    desc: Rust std::env::temp_dir reference
    crit: baseline
    conf: 0.8
    for: [rust]
    if:
      type: text
      regex: 'std::env::temp_dir|env::temp_dir'
  - id: node-os-tmpdir
    desc: Node.js os.tmpdir() call
    crit: baseline
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: symbol
      exact: os.tmpdir
