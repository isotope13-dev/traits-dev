defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
traits:
  - id: win32-temp-path-import
    desc: Imports GetTempPath temp-directory API
    crit: notable
    conf: 0.88
    for: [pe, dll]
    if:
      type: import
      regex: '^GetTempPath(2)?[AW]?$'
  - id: temp-path-api-name
    desc: GetTempPath API-name reference
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: ^GetTempPath(2)?[AW]?$
    unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-source-call
    - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
  - id: win32-temp-path-rdata
    desc: GetTempPath name in .rdata section
    crit: notable
    conf: 0.7
    if:
      type: text
      exact: GetTempPathW
      section: rdata
  # The anchored text form above records an API name. On C/C++ source
  # the API appears as a call target, which a bare `type: text`/`symbol` never
  # sees — so a source-scoped call matcher is required to catch it.
  - id: win32-temp-path-source-call
    desc: Look up temp directory via GetTempPath call
    crit: notable
    conf: 0.66
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: ^GetTempPath(2)?[AW]?$
  # Listing fallback where no parser provides call facts (HTML/text views
  # of C source); combined with the symbol leg by the directory composite.
  - id: win32-temp-path-source-listing
    desc: Listing calls GetTempPath for temp path
    crit: notable
    conf: 0.66
    for: [html, text]
    if:
      type: text
      regex: '\bGetTempPath(2)?[AW]?\s*\('
composite_rules:
  - id: temp-path-api-reference
    desc: GetTempPath name or native API import
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/os/sysinfo/directories::temp-path-api-name
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
