defaults:
  platforms: [windows]
  for: [c, cpp, html, text]
  crit: notable
  conf: 0.9
traits:
  - id: system-directory-source-call
    desc: Calls GetSystemDirectory for system path
    if:
      type: symbol
      kind: call
      regex: '^GetSystemDirectory[AW]?$'
  - id: windows-directory-source-call
    desc: Calls GetWindowsDirectory for installation path
    if:
      type: symbol
      kind: call
      regex: '^GetWindowsDirectory[AW]?$'
  - id: copy-to-sysdir-source
    desc: GetSystemDirectoryA system directory API
    for: [c, cpp]
    conf: 0.88
    if:
      type: symbol
      exact: "GetSystemDirectoryA"

  # Source listings rendered where no language parser provides call facts
  # (HTML/text views of C source). Matches the symbol legs above by call
  # target and opening paren; the composite below combines the spellings.
  - id: system-directory-source-listing
    desc: Listing calls GetSystemDirectory for system path
    for: [html, text]
    if:
      type: text
      regex: '\bGetSystemDirectory[AW]?\s*\('
  - id: windows-directory-source-listing
    desc: Listing calls GetWindowsDirectory API
    for: [html, text]
    if:
      type: text
      regex: '\bGetWindowsDirectory[AW]?\s*\('
composite_rules:
  - id: windows-or-temp-directory-call
    desc: Calls a Windows directory query API
    any:
      - id: system-directory-source-call
      - id: windows-directory-source-call
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-source-call
      - id: system-directory-source-listing
      - id: windows-directory-source-listing
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-source-listing
