defaults:
  platforms: [android]
  for: [java, kotlin, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: android-document-framework-action
    desc: Android document selection or creation action
    if:
      type: text
      regex: '\bIntent\.ACTION_(OPEN_DOCUMENT(_TREE)?|CREATE_DOCUMENT)\b'

  - id: android-start-activity-for-result-call
    desc: Starts an Android activity expecting a result
    if:
      type: symbol
      kind: call
      regex: '(^|\.)startActivityForResult$'
