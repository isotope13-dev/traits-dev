defaults:
  platforms: [android]
  crit: notable
  conf: 0.9

traits:
  - id: android-boot-completed-code-reference
    desc: Android BOOT_COMPLETED action in bytecode
    for: [dex]
    if:
      type: text
      substr: android.intent.action.BOOT_COMPLETED

composite_rules:
  - id: android-boot-completed-reference
    desc: Android BOOT_COMPLETED action reference
    for: [dex, xml]
    any:
      - id: android-boot-completed-code-reference
      - id: metadata/package/entrypoint::android-boot-completed-action
