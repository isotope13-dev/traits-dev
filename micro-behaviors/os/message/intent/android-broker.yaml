defaults:
  platforms: [android]
  for: [java]
  crit: notable
  conf: 0.96

traits:
  - id: android-authenticator-account-chooser-target
    desc: Targets Microsoft Authenticator broker activity
    if:
      type: symbol
      kind: call
      exact: setClassName
      args:
        - index: 0
          kind: string
          exact: com.azure.authenticator
        - index: 1
          kind: string
          exact: com.microsoft.identity.client.AccountChooserActivity
  - id: android-broker-compressed-result-read
    desc: Reads compressed broker authentication result
    if:
      type: symbol
      kind: call
      exact: getStringExtra
      arg:
        index: 0
        kind: string
        exact: broker_result_v2_compressed
