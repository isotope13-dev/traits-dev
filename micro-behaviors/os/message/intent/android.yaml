defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.88

traits:
  - id: android-action-view-intent
    desc: Android ACTION_VIEW intent
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    if:
      type: text
      word: ACTION_VIEW

  - id: android-start-activity
    desc: Android starts activity
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    for: [apk, zip, java, kotlin]
    if:
      type: text
      word: startActivity

  - id: android-development-settings-action-constant
    desc: Android developer settings action constant
    crit: notable
    conf: 0.95
    if:
      type: text
      word: ACTION_APPLICATION_DEVELOPMENT_SETTINGS

  - id: android-development-settings-action-string
    desc: Android developer settings action string
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: android.settings.APPLICATION_DEVELOPMENT_SETTINGS

  - id: android-uri-parse
    desc: Android Uri parse call
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    if:
      type: text
      regex: '\bUri\s*\.\s*parse\s*\('

  - id: android-intent-extra-routing
    desc: Android intent extra routing
    crit: component
    conf: 0.86
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    if:
      type: text
      regex: 'getStringExtra\s*\(\s*"type"\s*\)[\s\S]{0,120}getStringExtra\s*\(\s*"value"\s*\)'

  - id: android-sms-received-action-source
    desc: Android source handles received SMS broadcasts
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'android\.provider\.Telephony\.SMS_(RECEIVED|DELIVER)'

  - id: android-sms-originating-address-read
    desc: Android source reads SMS sender address
    crit: notable
    conf: 0.94
    if:
      type: text
      word: getOriginatingAddress

  - id: android-sms-message-body-read
    desc: Android source reads SMS message body
    crit: notable
    conf: 0.94
    if:
      type: text
      word: getMessageBody

composite_rules:
  # Union of the two spellings of the same action; the matchers see the action
  # name only, not whether an activity was actually launched with it.
  - id: android-development-settings-intent
    desc: Android developer settings intent action
    crit: notable
    conf: 0.95
    any:
      - id: android-development-settings-action-constant
      - id: android-development-settings-action-string

  - id: android-uri-start-activity
    desc: Android URI starts activity
    crit: notable
    conf: 0.9
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    all:
      - id: android-action-view-intent
      - id: android-start-activity
      - id: android-uri-parse

  - id: android-sms-content-read-source
    desc: Android source reads SMS sender and body
    crit: notable
    conf: 0.95
    all:
      - id: android-sms-originating-address-read
      - id: android-sms-message-body-read

  - id: android-sms-message-collection-source
    desc: Android source collects received SMS content
    crit: notable
    conf: 0.96
    all:
      - id: android-sms-received-action-source
      - id: android-sms-content-read-source
