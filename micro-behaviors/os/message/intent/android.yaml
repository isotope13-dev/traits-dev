defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.88

traits:
  - id: android-intent-data-read
    desc: Reads Android intent data URI
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(\bgetIntent\s*\(\s*\)\s*\.\s*getData\s*\(\s*\)|\bintent\s*\.\s*data\b)'

  - id: android-uri-query-parameter-read
    desc: Reads Android URI query parameter
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: getQueryParameter

  - id: android-action-view-intent
    desc: Android ACTION_VIEW intent
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    if:
      type: text
      word: ACTION_VIEW

  - id: android-action-view-string
    desc: Android ACTION_VIEW intent string
    for: [dex]
    if:
      type: text
      exact: android.intent.action.VIEW

  - id: android-start-activity
    desc: Android starts activity
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    for: [apk, zip, dex, java, kotlin]
    if:
      type: text
      word: startActivity

  - id: android-package-launch-intent-method
    desc: Android package launch-intent method reference
    crit: component
    conf: 0.94
    for: [dex]
    if:
      type: text
      word: getLaunchIntentForPackage

  - id: android-current-package-name-method
    desc: Android current package-name method reference
    crit: component
    conf: 0.9
    for: [dex]
    if:
      type: text
      word: getPackageName

  - id: android-development-settings-action-constant
    desc: Android developer settings action constant
    crit: notable
    conf: 0.95
    if:
      type: text
      word: ACTION_APPLICATION_DEVELOPMENT_SETTINGS

  - id: android-development-settings-action-string
    desc: Android developer settings action string
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: android.settings.APPLICATION_DEVELOPMENT_SETTINGS

  - id: android-uri-parse
    desc: Android Uri parse call
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    if:
      type: text
      regex: '\bUri\s*\.\s*parse\s*\('

  - id: android-intent-extra-routing
    desc: Android intent extra routing
    crit: component
    conf: 0.86
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    if:
      type: text
      regex: 'getStringExtra\s*\(\s*"type"\s*\)[\s\S]{0,120}getStringExtra\s*\(\s*"value"\s*\)'

  - id: android-sms-received-action-source
    desc: Android source handles received SMS broadcasts
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'android\.provider\.Telephony\.SMS_(RECEIVED|DELIVER)'

  - id: android-sms-originating-address-read
    desc: Android source reads SMS sender address
    crit: notable
    conf: 0.94
    if:
      type: text
      word: getOriginatingAddress

  - id: android-sms-message-body-read
    desc: Android source reads SMS message body
    crit: notable
    conf: 0.94
    if:
      type: text
      word: getMessageBody

composite_rules:
  - id: android-current-package-launch
    desc: Android current-package launch API set
    crit: notable
    conf: 0.94
    for: [dex]
    all:
      - id: android-package-launch-intent-method
      - id: android-current-package-name-method
      - id: android-start-activity

  - id: android-deeplink-query-input
    desc: Android source reads query input from an incoming intent URI
    crit: notable
    conf: 0.96
    all:
      - id: android-intent-data-read
      - id: android-uri-query-parameter-read

  - id: android-exported-browsable-deeplink
    desc: Android manifest declares an exported browsable VIEW entry point
    crit: notable
    conf: 0.97
    for: [apk, zip, xml]
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/manifest::exported-application-component
      - id: metadata/file/policy/config/deeplink::android-view-intent-action
      - id: metadata/file/policy/config/deeplink::android-browsable-intent-category

  # Union of the two spellings of the same action; the matchers see the action
  # name only, not whether an activity was actually launched with it.
  - id: android-development-settings-intent
    desc: Android developer settings intent action
    crit: notable
    conf: 0.95
    any:
      - id: android-development-settings-action-constant
      - id: android-development-settings-action-string

  - id: android-uri-start-activity
    desc: Android URI starts activity
    crit: notable
    conf: 0.9
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    all:
      - id: android-action-view-intent
      - id: android-start-activity
      - id: android-uri-parse

  - id: android-sms-content-read-source
    desc: Android source reads SMS sender and body
    crit: notable
    conf: 0.95
    all:
      - id: android-sms-originating-address-read
      - id: android-sms-message-body-read

  - id: android-sms-message-collection-source
    desc: Android source collects received SMS content
    crit: notable
    conf: 0.96
    all:
      - id: android-sms-received-action-source
      - id: android-sms-content-read-source
