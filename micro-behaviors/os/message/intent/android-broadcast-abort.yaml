# BroadcastReceiver.abortBroadcast() stops an ordered broadcast from reaching
# lower-priority receivers. On SMS_RECEIVED (an ordered broadcast before
# Android 4.4) it keeps the message out of the inbox, which is how SMS
# stealers hide one-time codes and operator replies from the owner.
defaults:
  platforms: [android]
  for: [dex]
  conf: 0.92

traits:
  - id: dex-abort-broadcast-call
    desc: Receiver aborts an ordered broadcast
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '->abortBroadcast$'

