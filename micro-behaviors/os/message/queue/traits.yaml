# Windows Message Queue Operations
# Inter-thread communication via message queues
defaults:
  crit: baseline
  for: ["pe", "dll", "rust"]
  platforms: ["windows"]
traits:
  # === Message Queue Reading ===
  - id: peek-message-a
    desc: Peek message (ANSI)
    conf: 0.85
    if:
      type: symbol
      exact: "PeekMessageA"
  - id: peek-message-w
    desc: Peek message (Unicode)
    conf: 0.85
    if:
      type: symbol
      exact: "PeekMessageW"
  - id: get-message-a
    desc: Get message (ANSI)
    conf: 0.85
    if:
      type: symbol
      exact: "GetMessageA"
  - id: get-message-w
    desc: Get message (Unicode)
    conf: 0.85
    if:
      type: symbol
      exact: "GetMessageW"
  # === Message Queue Posting ===
  - id: post-thread-message-a
    desc: Post message to thread (ANSI)
    conf: 0.85
    if:
      type: symbol
      exact: "PostThreadMessageA"
  - id: post-thread-message-w
    desc: Post message to thread (Unicode)
    conf: 0.85
    if:
      type: symbol
      exact: "PostThreadMessageW"
  - id: post-message
    desc: Post message to window
    conf: 0.85
    if:
      type: symbol
      exact: "PostMessageA"
  - id: post-message-w
    desc: Post message to window (Unicode)
    conf: 0.85
    if:
      type: symbol
      exact: "PostMessageW"
  - id: post-message-text
    desc: Post message to window
    conf: 0.82
    if:
      type: text
      word: "PostMessage"
