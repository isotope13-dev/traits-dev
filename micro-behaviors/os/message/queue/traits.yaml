# Windows Message Queue Operations
# Inter-thread communication via message queues
defaults:
  crit: baseline
  for: ["pe", "dll", "rust"]
  platforms: ["windows"]
traits:
  # === Message Queue Reading ===
  - id: peek-message-a
    desc: Peek message (ANSI)
    conf: 0.85
    if:
      type: symbol
      exact: "PeekMessageA"
  - id: peek-message-w
    desc: Peek message (Unicode)
    conf: 0.85
    if:
      type: symbol
      exact: "PeekMessageW"
  - id: get-message-a
    desc: Get message (ANSI)
    conf: 0.85
    if:
      type: symbol
      exact: "GetMessageA"
  - id: get-message-w
    desc: Get message (Unicode)
    conf: 0.85
    if:
      type: symbol
      exact: "GetMessageW"
  # === Message Queue Posting ===
  - id: post-thread-message-a
    desc: Post message to thread (ANSI)
    conf: 0.85
    if:
      type: symbol
      exact: "PostThreadMessageA"
  - id: post-thread-message-w
    desc: Post message to thread (Unicode)
    conf: 0.85
    if:
      type: symbol
      kind: import
      exact: "PostThreadMessageW"
  - id: post-thread-message-w-text
    desc: PostThreadMessageW API name string
    crit: notable
    conf: 0.84
    for: [pe, dll, c, cpp]
    if:
      type: text
      substr: PostThreadMessageW
  - id: post-thread-message-w-rdata-name
    desc: PostThreadMessageW name in rdata
    crit: notable
    conf: 0.84
    for: [pe, dll]
    if:
      type: text
      substr: PostThreadMessageW
      section: rdata
  - id: post-thread-message-w-data-name
    desc: PostThreadMessageW name in data
    crit: notable
    conf: 0.84
    for: [pe, dll]
    if:
      type: text
      substr: PostThreadMessageW
      section: data
  - id: post-thread-message-w-text-name
    desc: PostThreadMessageW name in text
    crit: notable
    conf: 0.84
    for: [pe, dll]
    if:
      type: text
      substr: PostThreadMessageW
      section: text
  - id: post-thread-message-w-code-name
    desc: PostThreadMessageW name in CODE
    crit: notable
    conf: 0.84
    for: [pe, dll]
    if:
      type: text
      substr: PostThreadMessageW
      section: CODE
  - id: post-message
    desc: Post message to window
    conf: 0.85
    if:
      type: symbol
      exact: "PostMessageA"
  - id: post-message-w
    desc: Post message to window (Unicode)
    conf: 0.85
    if:
      type: symbol
      exact: "PostMessageW"
  - id: post-message-text
    desc: Post message to window
    conf: 0.82
    if:
      type: text
      word: "PostMessage"

composite_rules:
  - id: post-thread-message-w-mapped-name
    desc: PostThreadMessageW name in a mapped section
    crit: notable
    conf: 0.9
    for: [pe, dll]
    any:
      - id: post-thread-message-w-rdata-name
      - id: post-thread-message-w-data-name
      - id: post-thread-message-w-text-name
      - id: post-thread-message-w-code-name
