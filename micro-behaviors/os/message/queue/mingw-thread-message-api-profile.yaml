defaults:
  platforms:
    - windows
composite_rules:
  - id: mingw-thread-message-api-profile
    desc: Small MinGW PE with thread and message-queue APIs
    crit: suspicious
    conf: 0.85
    size_max: 102400
    all:
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/os/message/queue::peek-message-a
      - id: micro-behaviors/os/message/queue::post-thread-message-a
      - id: metadata/lang/compiler/native::mingw-runtime-marker
    unless:
      - id: metadata/binary/symbols/count::many-exports
    for: [pe, dll]
