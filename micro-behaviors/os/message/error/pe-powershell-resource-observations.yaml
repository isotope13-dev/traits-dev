defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: missing-vcruntime-error-text
    desc: Missing VCRUNTIME error text
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: The code execution cannot be continued because VCRUNTIME140.dll was not found. Reinstalling the
        program may fix this problem.
