defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: notable
traits:
- id: authentication-failed
  desc: Generic "Authentication failed" message
  conf: 0.5
  if:
    type: text
    substr: Authentication failed
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: authentication-failed-spinner-output
  desc: Prints Authentication failed via spinner.fail
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    exact: spinner.fail
    arg:
      kind: string
      exact: Authentication failed
  unless:
  - id: authentication-failed
