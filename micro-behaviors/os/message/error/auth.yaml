defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  # Printed by SSH, SMTP, HTTP and database clients alike; the SSH and
  # brute-force composites give it protocol context.
  - id: authentication-failed
    desc: Generic "Authentication failed" message
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: Authentication failed
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  # A source call displaying this exact string remains observable even when
  # an unrelated tool-name clue suppresses the broad text rule.
  - id: authentication-failed-spinner-output
    desc: Prints Authentication failed via spinner.fail
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: spinner.fail
      arg:
        kind: string
        exact: Authentication failed
    unless:
      - id: authentication-failed
