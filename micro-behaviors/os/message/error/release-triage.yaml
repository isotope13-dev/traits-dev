---
defaults:
  platforms: [unix, windows]
traits:
- for:
  - python
  - javascript
  - powershell
  - pe
  - elf
  id: too-many-authentication-failures
  desc: Authentication failure limit error message
  crit: notable
  conf: 0.6
  unless:
  - id: well-known/lib/network/push-rocks::smartmta-rust-mailer-binary-path
  if:
    type: text
    substr: Too many authentication failures
- crit: notable
  conf: 1.0
  for:
  - scripts
  - binaries
  id: token-user-recovery-failure
  desc: Token or user recovery failure wording
  if:
    type: text
    regex: "(token|user).{0,80}cannot.{0,30}recover"
    case_insensitive: true
