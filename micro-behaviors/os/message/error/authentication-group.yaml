defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, pe, elf]
composite_rules:
- id: authentication-error-message
  desc: Authentication error messages
  any:
  - id: micro-behaviors/os/message/error::authentication-failed
  - id: micro-behaviors/os/message/error::too-many-authentication-failures
  crit: notable
  unless:
  - id: well-known/tool/development/agent/kilocode::kilo-code-js-bundle
  - id: well-known/lib/network/paramiko::paramiko-source
  - id: well-known/tool/sysadmin/busybox::mingit-busybox-basename
  - id: well-known/tool/development/vcs/git-for-windows::mingit-gcmcore-dll
  - id: well-known/tool/development/vcs/git-for-windows::mingit-github-dll
