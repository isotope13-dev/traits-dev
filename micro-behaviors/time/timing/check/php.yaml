# PHP elapsed-time measurement.
defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  # `microtime(true) - $start > 0.1` is how PHP measures how long something
  # took: rate limiters, request timeouts, progress throttles and benchmarks all
  # look exactly like this (Composer's own download progress bar is one). It is
  # a neutral timing measurement; the cloaking composites in
  # objectives/evasion/decoy/cloaking/ supply the routing intent by pairing it
  # with the inbound User-Agent and geolocation checks.
  - id: php-microtime-elapsed-threshold
    desc: Elapsed microtime compared against a threshold
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'microtime\s*\(\s*true\s*\)\s*-\s*\$?\w+\s*>\s*[\d.]+'
