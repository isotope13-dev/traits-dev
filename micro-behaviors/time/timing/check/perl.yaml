# Timestamp arithmetic also appears in metadata parsers and socket timeouts.
# Consumers must supply any attack purpose.
defaults:
  platforms: [unix, windows]
  for: [perl]
traits:
  - id: perl-time-variable-expression
    desc: Perl time arithmetic or comparison
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\btime(\(\))?\s*([+-]|[<>]=?)\s*\$[A-Za-z_]\w*'
