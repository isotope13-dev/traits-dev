defaults:
  platforms: [windows, unix]
  for: [c, cpp, rust]
composite_rules:
  - id: cache-flush-rdtsc-timing-probe
    desc: Cache flush beside timestamp-counter reads
    crit: notable
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/mem/sync/cache::clflush-intrinsic-call
      - id: micro-behaviors/time/query::rdtsc-intrinsic-call

  - id: prefetch-rdtsc-source-probe
    desc: Prefetch beside RDTSC reads in source
    crit: notable
    conf: 0.94
    for: [c, cpp, rust, go]
    near_lines: 30
    all:
      - id: micro-behaviors/time/query::rdtsc-source-read
    any:
      - id: micro-behaviors/mem/sync/cache::prefetch-intrinsic-call
      - id: micro-behaviors/mem/sync/cache::x86-prefetch-inline-asm

  - id: prefetch-rdtsc-timing-probe
    desc: Measures cache prefetch latency with RDTSC
    crit: notable
    conf: 0.95
    for: [c, cpp, rust, go, pe, elf, macho]
    any:
      - id: prefetch-rdtsc-source-probe
      - id: micro-behaviors/mem/sync/cache::x86-rdtsc-prefetch-sequence
