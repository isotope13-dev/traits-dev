defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-session-state-reference
    desc: JavaScript session-state reference
    crit: component
    conf: 0.8
    if:
      type: text
      word: sessionState

  - id: js-multi-hour-ms-duration
    desc: Multi-hour JavaScript millisecond duration
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '[0-9]{1,4}\s*\*\s*60\s*\*\s*60\s*\*\s*1000'

  - id: js-multi-year-duration-arithmetic
    desc: Multi-year JavaScript duration arithmetic
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(365\s*\*\s*|3600\s*\*\s*24\s*\*\s*365\s*\*)([2-9]|[1-9][0-9])'

  # `performance.now()` is normally called by name; profiling and benchmark
  # code has no reason to reach it through a computed member. Reading the
  # elapsed delta through a bracket-computed property is how obfuscated code
  # measures how long its own routine took — the input to a "was I single
  # stepped?" decision. Neutral here: what the delta gates lives in
  # objectives/anti-analysis/timing/.
  - id: js-computed-performance-elapsed-check
    desc: Compares elapsed computed performance timer
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bperformance\s*\[[^\]\n]{1,40}\]\s*\(\s*\)\s*-\s*[\w$.]{1,24}\s*>'

  - id: js-date-now-relative-threshold
    desc: Date.now relative threshold comparison
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: 'Date\.now\(\)\s*>=?\s*[\w.$]+\s*\+\s*[\w.$]+'
    not:
      - substr: '_dragStartTime+this._getDragStartDelay'
      - substr: 'dragStartThreshold'
      - regex: 'Date\.now\(\)\s*>\s*\w+\.start_time\s*\+\s*\w+\.duration'

  - id: datenow-gated-fetch
    desc: Date.now gated fetch request
    crit: notable
    conf: 0.82
    size_max: 131072
    if:
      type: text
      regex: 'Date\.now\(\)\s*([-+]\s*[\w.$]+)?\s*([<>]=?|={2,3}|!={1,2})[^\n]{0,120}\bfetch\b'
    not:
      - regex: 'Date\.now\(\)\s*-\s*\d+e\d+\s*&&'
      - regex: '\.exp\s*-\s*Date\.now\(\)\s*<\s*\d+e\d+'
      - regex: 'Date\.now\(\)\s*<\s*\d+e\d+\s*\}\s*catch\s*\('
      - regex: 'Date\.now\(\)\s*-\s*[\w.$]+\s*<\s*\d+e?\d*\s*\)\s*return'
      - regex: '\w+\s*=\s*Date\.now\(\)[\s\S]{0,160}\w+\s*-\s*[\w.$]+\s*<\s*\d+e?\d*\s*\)\s*return[\s\S]{0,240}\bfetch\b'
      - regex: 'Date\.now\(\)\s*-\s*\d+(e\d+)?\s*,\s*\w+\s*=\s*\w+\.filter\s*\(\s*function'
      - regex: '\.append\(["'']timestamp["''],Date\.now\(\)\).{0,180}\bfetch\b'
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/structure::js-dist-asset-bundle
      - id: metadata/build/bundler::js-hashed-bundle-basename
      - id: metadata/library/structure/
      - id: well-known/lib/web/nextjs::next-server-build-path

  - id: newdate-gated-fetch
    desc: Date object gated fetch
    crit: notable
    conf: 0.82
    size_max: 131072
    if:
      type: text
      regex: 'new Date[^\n]{0,80}[<>!=]=?[^\n]{0,120}fetch\s*\('
    not:
      - regex: 'new Date\s*\(\s*\)[^\n]{0,80}\.getHours\s*\(\s*\)[^\n]{0,80}if\s*\(\s*\w+\s*={2,3}\s*\d{1,2}\s*\)\s*\{\s*fetch\s*\('
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/structure::js-large-minified-bundle
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/library/structure::js-dist-asset-bundle
      - id: metadata/build/bundler::js-hashed-bundle-basename
      - id: metadata/library/structure::js-vite-rollup-vendor-chunk
      - id: well-known/app/system/localguard::extension-runtime

  # `Date.now() - start > 500` measures how long something took. It is the
  # ordinary shape of a throttle, a timeout, a progress tick or a benchmark, so
  # it is a neutral timing measurement on its own. Traffic-distribution filters
  # in objectives/evasion/decoy/cloaking/ reference it as one leg alongside the
  # crawler and geolocation checks that supply the routing intent.
  - id: js-elapsed-time-threshold
    desc: Elapsed timer compared against a threshold
    crit: baseline
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?i)(Date|performance)\.now\s*\(\s*\)\s*-\s*[A-Za-z_$][\w$]*\s*>\s*\d{3,}'

  # The other direction of the same measurement: `Date.now() - cached.time <
  # TTL`, the freshness test in front of a cached value. `js-elapsed-time-
  # threshold` above only reads the `>` form against a numeric literal, so a
  # cache guarded by a named TTL constant — the way every hand-rolled client
  # cache is written — was invisible to it.
  #
  # Baseline: caching is ordinary. It matters only as the leg that shows a
  # remote fetch is re-issued on a schedule rather than performed once.
  - id: js-cache-freshness-check
    desc: Compares elapsed time against a TTL
    crit: baseline
    conf: 0.88
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?i)(Date|performance)\.now\(\)\s*-\s*[\w$.]{1,32}\)?\s*<\s*[\w$.]{1,40}'

  # `(now - stored) / 864e5 > 3` — a millisecond delta divided by the number of
  # milliseconds in a day and compared against a small integer. Dividing by the
  # day constant (rather than by 1000 or 60000) says the comparison is on a
  # calendar scale: "has it been N days since X". Ordinary code does this for
  # trial periods, cache expiry and update nags, so it is a neutral timing
  # measurement; what a multi-day gate defers lives in
  # objectives/anti-analysis/timing/.
  - id: js-elapsed-days-threshold
    desc: Elapsed milliseconds compared in days
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '/\s*(864e5|86400000)\s*\)?\s*[<>]=?\s*\d'
