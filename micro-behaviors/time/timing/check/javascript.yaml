defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: js-session-state-reference
  desc: JavaScript session-state reference
  crit: notable
  conf: 0.8
  if:
    type: text
    word: sessionState
- id: js-multi-hour-ms-duration
  desc: Multi-hour JavaScript millisecond duration
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '[0-9]{1,4}\s*\*\s*60\s*\*\s*60\s*\*\s*1000'
- id: js-multi-year-duration-arithmetic
  desc: Multi-year JavaScript duration arithmetic
  crit: component
  conf: 0.8
  if:
    type: text
    regex: (365\s*\*\s*|3600\s*\*\s*24\s*\*\s*365\s*\*)([2-9]|[1-9][0-9])
- id: js-computed-performance-elapsed-check
  desc: Compares elapsed computed performance timer
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bperformance\s*\[[^\]\n]{1,40}\]\s*\(\s*\)\s*-\s*[\w$.]{1,24}\s*>
- id: js-date-now-relative-threshold
  desc: Date.now relative threshold comparison
  crit: baseline
  conf: 0.85
  if:
    type: text
    regex: Date\.now\(\)\s*>=?\s*[\w.$]+\s*\+\s*[\w.$]+
  not:
  - substr: _dragStartTime+this._getDragStartDelay
  - substr: dragStartThreshold
  - regex: Date\.now\(\)\s*>\s*\w+\.start_time\s*\+\s*\w+\.duration
- id: datenow-gated-fetch
  desc: Date.now gated fetch request
  crit: notable
  conf: 0.82
  size_max: 131072
  if:
    type: text
    regex: Date\.now\(\)\s*([-+]\s*[\w.$]+)?\s*([<>]=?|={2,3}|!={1,2})[^\n]{0,120}\bfetch\b
  not:
  - regex: Date\.now\(\)\s*-\s*\d+e\d+\s*&&
  - regex: \.exp\s*-\s*Date\.now\(\)\s*<\s*\d+e\d+
  - regex: Date\.now\(\)\s*<\s*\d+e\d+\s*\}\s*catch\s*\(
  - regex: Date\.now\(\)\s*-\s*[\w.$]+\s*<\s*\d+e?\d*\s*\)\s*return
  - regex: \w+\s*=\s*Date\.now\(\)[\s\S]{0,160}\w+\s*-\s*[\w.$]+\s*<\s*\d+e?\d*\s*\)\s*return[\s\S]{0,240}\bfetch\b
  - regex: Date\.now\(\)\s*-\s*\d+(e\d+)?\s*,\s*\w+\s*=\s*\w+\.filter\s*\(\s*function
  - regex: \.append\(["']timestamp["'],Date\.now\(\)\).{0,180}\bfetch\b
  unless:
  - id: metadata/build
  - id: well-known/lib/web/site-platforms/nextjs::next-server-build-path
- id: newdate-gated-fetch
  desc: Date object gated fetch
  crit: notable
  conf: 0.82
  size_max: 131072
  if:
    type: text
    regex: new Date[^\n]{0,80}[<>!=]=?[^\n]{0,120}fetch\s*\(
  not:
  - regex: new Date\s*\(\s*\)[^\n]{0,80}\.getHours\s*\(\s*\)[^\n]{0,80}if\s*\(\s*\w+\s*={2,3}\s*\d{1,2}\s*\)\s*\{\s*fetch\s*\(
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: metadata/build/bundler/runtime::js-webpack-bundle
  - id: metadata/build/bundler/asset::js-dist-asset-bundle
  - id: metadata/build/bundler/asset::js-hashed-bundle-basename
  - id: metadata/build/bundler/asset::js-vite-rollup-vendor-chunk
  - id: well-known/app/system/localguard::extension-runtime
- id: js-elapsed-time-threshold
  desc: Elapsed timer compared against a threshold
  crit: baseline
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: (?i)(Date|performance)\.now\s*\(\s*\)\s*-\s*[A-Za-z_$][\w$]*\s*>\s*\d{3,}
- id: js-cache-freshness-check
  desc: Compares elapsed time against a TTL
  crit: baseline
  conf: 0.88
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: (?i)(Date|performance)\.now\(\)\s*-\s*[\w$.]{1,32}\)?\s*<\s*[\w$.]{1,40}
- id: js-elapsed-days-threshold
  desc: Elapsed milliseconds compared in days
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: /\s*(\(\s*1000\s*\*\s*60\s*\*\s*60\s*\*\s*24\s*\)|864e5|86400000)\s*\)?\s*[<>]=?\s*\d
- id: js-elapsed-days-1e3-divisor
  desc: Elapsed-ms day divisor uses 1e3
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: /\s*\(?\s*1e3\s*\*\s*60\s*\*\s*60\s*\*\s*24\s*\)?\s*[<>]=?\s*\d
- id: js-elapsed-days-reversed-threshold
  desc: Flipped elapsed-days comparison
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: \d\s*[<>]=?\s*\(\s*[A-Za-z0-9_$.() \-]{1,48}\s*\)\s*/\s*(864e5|86400000)
- id: saved-local-hour-range-branch
  desc: Branches on a saved hour range
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: getHours\(\)[\s\S]{0,80}if\s*\(\s*\w+\s*>\s*\d{1,2}\s*&&\s*\w+\s*<\s*\d{1,2}\s*\)
composite_rules:
- id: js-long-duration-threshold-check
  desc: Long-duration JavaScript time threshold check
  crit: notable
  conf: 0.85
  near_lines: 40
  all:
  - id: js-multi-hour-ms-duration
  - id: js-date-now-relative-threshold
- id: js-elapsed-days-gate
  desc: Elapsed time compared on a day scale
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  any:
  - id: js-elapsed-days-threshold
  - id: js-elapsed-days-1e3-divisor
  - id: js-elapsed-days-reversed-threshold
