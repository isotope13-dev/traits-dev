defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-fixed-unix-timestamp-comparison
    desc: Go fixed Unix timestamp comparison
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'time\.Now\(\)\.Unix\(\)\s*[<>]\s*1[5-9][0-9]{8}'
  - id: go-time-since-poll-loop
    desc: Go time.Since polling loop
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: 'for\s*\{\s*(if\s+time\.Since\s*\(|[A-Za-z_][A-Za-z0-9_]*\s*:=\s*time\.Since\s*\()'
