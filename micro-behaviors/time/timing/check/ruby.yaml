defaults:
  platforms: [unix, windows]
  for: [ruby]

# These atoms only establish that Ruby measures a computation and compares the
# elapsed time. Benchmark and timeout code can do both legitimately; the
# anti-analysis objective supplies intent by requiring them together in the
# compact self-check shape used by decoder wrappers.
traits:
  - id: ruby-timed-math-loop
    desc: Ruby times repeated math operations
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b\d+\.times\s*\{[^}]{0,80}Math\.(sqrt|sin|cos)'

  - id: ruby-subsecond-elapsed-threshold
    desc: Ruby compares subsecond elapsed time
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'Time\.now\s*-\s*[A-Za-z_]\w*\)?\s*(>|>=)\s*0\.\d+'
