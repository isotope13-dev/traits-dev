defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.96
traits:
  - id: reloc-clock-change-rdtsc-x86
    desc: Reloc code samples RDTSC after clock change
    if:
      type: hex
      section: .reloc
      # Poll an indirect clock function until its return changes, retain
      # that value while RDTSC replaces EDX:EAX, return with both samples.
      pattern: 'FF D7 3B F0 74 ?? 21 EE 42 42 50 0F 31 5E 86 C9 C3'
  - id: reloc-cycle-rate-threshold-x86
    desc: Reloc code compares elapsed cycle-rate quotient
    if:
      type: hex
      section: .reloc
      # Subtract saved low/high timestamp words, divide by elapsed ticks,
      # subtract variable rate threshold, dispatch to decision block.
      pattern: '2B 44 24 ?? 8D 4C 24 01 1B 51 ?? F7 FE 2D ?? ?? ?? ?? E9 ?? ?? ?? ??'
composite_rules:
  - id: reloc-clock-cycle-profiler-x86
    desc: Reloc code profiles clock and cycle deltas
    crit: notable
    conf: 0.97
    all:
      - id: reloc-clock-change-rdtsc-x86
      - id: reloc-cycle-rate-threshold-x86
