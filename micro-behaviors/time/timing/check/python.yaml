defaults:
  platforms: [windows, unix]
  for: [python]

# Comparing the current time with a variable is ordinary expiry, cache, and
# scheduling logic. Time-evasion objectives add an execution sink or a fixed,
# attacker-chosen timestamp; the comparison itself carries no such intent.
traits:
  - id: python-current-datetime-ordered-comparison
    desc: Python compares current datetime value
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'datetime\.(datetime\.)?(now|today)\s*\(\s*\)\s*(<=|>=)\s*[^>\n]{1,120}'

  - id: python-current-datetime-equality-comparison
    desc: Python compares current datetime equality
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'datetime\.(datetime\.)?(now|today)\s*\(\s*\)\s*(==|!=)\s*[^>\n]{1,120}'

  - id: python-current-datetime-strict-comparison
    desc: Python strictly compares current datetime
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'datetime\.(datetime\.)?(now|today)\s*\(\s*\)\s*(<|>)\s*[^>\n]{1,120}'

composite_rules:
  - id: python-current-datetime-comparison
    desc: Python compares the current datetime
    crit: baseline
    conf: 0.9
    any:
      - id: python-current-datetime-ordered-comparison
      - id: python-current-datetime-equality-comparison
      - id: python-current-datetime-strict-comparison
