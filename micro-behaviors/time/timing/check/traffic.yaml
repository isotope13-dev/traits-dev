# Neutral aggregate used by traffic-routing composites. An elapsed-time
# comparison is common in throttles, timeouts, and benchmarks; it is not a
# routing objective without the other inbound and selection signals.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, php, html]

composite_rules:
  - id: request-duration-check
    desc: Code compares an elapsed timer against a threshold
    crit: baseline
    conf: 0.9
    any:
      - id: micro-behaviors/time/timing/check::js-elapsed-time-threshold
      - id: micro-behaviors/time/timing/check::php-microtime-elapsed-threshold
