# The current time compared against a saved timestamp plus a whole number of
# days written out as `N * 24 * 60 * 60 * 1000`: code that waits until a
# stored moment is more than N days old before acting.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-stamp-plus-days-compare
    desc: Compares time to stored stamp plus days
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '[<>]=?\s*[\w$.]{1,48}\s*\+\s*\d{1,3}\s*\*\s*24\s*\*\s*60\s*\*\s*60\s*\*\s*1000\b'
