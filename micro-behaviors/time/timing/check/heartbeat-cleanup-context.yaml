defaults:
  platforms: [windows]
  for: [c, cpp, pe]

traits:
- id: stale-heartbeat-check
  desc: Day-interval comparison with heartbeat fields
  crit: notable
  conf: 0.9
  for: [c, cpp]
  if:
    type: tree-sitter
    query: |
      (binary_expression
        left: (_) @clock
        operator: [">" ">=" "<" "<="]
        right: (number_literal) @day
        (#match? @clock "(?i)(heartbeat|last_?checkin|filetime)")
        (#match? @day "^864000000000(ULL|LL|UL|L)?$"))
