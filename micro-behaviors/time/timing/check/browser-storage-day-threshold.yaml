# Relocated from objectives/anti-analysis/timing/delay.
# Storage reads/writes and day arithmetic do not establish an analysis target.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: browser-storage-day-threshold-timer
    desc: Browser storage with elapsed-day gate and timer
    crit: notable
    conf: 0.9
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
      - id: micro-behaviors/time/timing/check::js-elapsed-days-threshold
    any:
      - id: micro-behaviors/time/schedule/timeout::setTimeout
      - id: micro-behaviors/time/schedule/timeout::repeated-settimeout
