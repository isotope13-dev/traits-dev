# RDTSC Instruction Detection
# Used for timing-based VM detection
defaults:
  platforms: [linux, macos, windows]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.9
traits:
  - id: rdtsc-instruction
    desc: RDTSC instruction (read time-stamp counter)
    crit: notable
    conf: 0.95
    count_min: 2
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: "0F 31"
  - id: rdtsc-register-mix
    desc: RDTSC value mixed into registers
    crit: notable
    conf: 0.82
    count_min: 2
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: "0F 31 8B ?? C1 C?"
  - id: rdtsc-intrinsic-call
    desc: Reads x86 timestamp counter via intrinsic
    crit: notable
    conf: 0.92
    for: [c, cpp, rust]
    if:
      type: symbol
      kind: call
      regex: '(^|::)_{0,2}rdtscp?$'
  - id: x86-rdtsc-inline-asm
    desc: Emits x86 RDTSC in inline assembly
    crit: notable
    conf: 0.92
    platforms: [windows, unix]
    for: [c, cpp, rust, go]
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)(^|[\s;])rdtscp?([\s;]|$)'
composite_rules:
  - id: rdtsc-source-read
    desc: Reads x86 timestamp counter in source
    crit: notable
    conf: 0.92
    platforms: [windows, unix]
    for: [c, cpp, rust, go]
    any:
      - id: rdtsc-intrinsic-call
      - id: x86-rdtsc-inline-asm
