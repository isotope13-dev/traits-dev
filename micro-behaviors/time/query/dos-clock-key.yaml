# DOS INT 21h/AH=2Ch returns hundredths in DL. This code rejects a zero
# hundredths value and stores DL at 0108h, the XOR loop's key operand.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data, text]
  size_max: 65536

traits:
  - id: dos-time-hundredths-xor-key-update
    desc: DOS clock hundredths update memory XOR key
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_time_hundredths_xor_key_update {
          meta:
            filetypes = "dos_com,data,text"
          strings:
            $clock = "\xb4\x2c\xcd\x21\x80\x3e\x08\x01\x00\x74\x05\x80\xfe\x0f\x7f\x09\x80\xfa\x00\x74\xeb\x88\x16\x08\x01" xor(1-255)
          condition:
            $clock
        }
