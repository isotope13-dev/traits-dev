defaults:
  platforms: [linux, macos, windows]
  for: [pe, elf, macho]
  crit: notable
  conf: 0.95
traits:
- id: rdtscp
  desc: RDTSCP timestamp-counter and CPU-ID read
  crit: notable
  conf: 0.95
  arch: [x86-64]
  count_min: 2
  size_max: 52428800
  if:
    type: hex
    section: .text
    pattern: "0F 01 F9"
  unless:
    # Unknown-machine ELF files include GPU code objects whose instruction
    # stream is not x86, even when a byte sequence resembles this opcode.
    - type: value
      path: elf.machine
      exact: unknown
