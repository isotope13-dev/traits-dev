# Time Queries (Windows)
# System time retrieval APIs
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: baseline
  conf: 0.9
traits:
  - id: get-system-time-as-filetime
    desc: Get system time as FILETIME
    if:
      type: symbol
      exact: "GetSystemTimeAsFileTime"
  - id: get-system-time
    desc: Get system time
    if:
      type: symbol
      exact: "GetSystemTime"
  - id: get-local-time
    desc: Get local time
    if:
      type: symbol
      exact: "GetLocalTime"
  - id: filetime-to-systemtime
    desc: Convert FILETIME to SYSTEMTIME
    if:
      type: symbol
      exact: "FileTimeToSystemTime"
  - id: systemtime-to-filetime
    desc: Convert SYSTEMTIME to FILETIME
    if:
      type: symbol
      exact: "SystemTimeToFileTime"
  - id: systemtime-tz-convert
    desc: Convert time to local timezone
    if:
      type: symbol
      exact: "SystemTimeToTzSpecificLocalTime"
  - id: get-timezone-information
    desc: Query timezone configuration
    crit: notable
    if:
      type: symbol
      exact: "GetTimeZoneInformation"
  - id: get-tick-count
    desc: Get tick count
    crit: notable
    if:
      type: symbol
      regex: "^GetTickCount(64)?$"
  - id: powershell-environment-tickcount
    desc: PowerShell reads environment tick count
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\[Environment\]::TickCount\b'
  - id: kuser-shared-data-tick-count-x64
    desc: Reads KUSER_SHARED_DATA tick count directly
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '04 00 FE 7F [0-32] 20 03 FE 7F'
composite_rules:
  - id: local-timezone-conversion
    desc: Local timezone time conversion
    crit: notable
    conf: 0.9
    all:
      - id: filetime-to-systemtime
      - id: systemtime-tz-convert
      - id: get-timezone-information
