defaults:
  crit: notable
  conf: 0.5
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-date-now-timeout
    desc: Date.now with setTimeout
    if:
      type: string_literal
      # Keep the window tight: in minified bundles a 50-character span
      # crosses unrelated constructs (a clock read in one method, an
      # unrelated setTimeout in the next), and "resetTimeout" contains the
      # "setTimeout" substring outright. Sleep-acceleration probes keep the
      # clock read and the timed wait in one compact expression.
      regex: Date\.now\(\).{0,20}setTimeout
    unless:
      - id: metadata/lang/javascript-features::sourcemap-sources-content
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: well-known/lib/ui/react::react-license-banner
      - id: metadata/build/bundler/asset::has-sourcemap
  - id: js-performance-now-timeout
    desc: performance.now with setTimeout
    if:
      type: string_literal
      regex: performance\.now\(\).{0,20}setTimeout
    unless:
      - id: metadata/lang/javascript-features::sourcemap-sources-content
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: metadata/build/bundler/asset::has-sourcemap
