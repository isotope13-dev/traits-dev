defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: high-resolution-time-reference
    desc: High-resolution time API reference
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/time/query::query-performance-counter
      - id: metadata/binary/instruction/opcode::repeated-rdtsc-bytes
      - id: micro-behaviors/time/query::get-system-time-precise
  - id: multiple-clock-api-references
    desc: Multiple timing API references
    crit: component
    conf: 0.85
    needs: 2
    any:
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/time/query::query-performance-counter
      - id: micro-behaviors/time/query::timegettime
      - id: metadata/binary/instruction/opcode::repeated-rdtsc-bytes
