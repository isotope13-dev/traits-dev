defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: w32tm-local-stripchart-command
  desc: w32tm samples localhost clock offset
  crit: suspicious
  conf: 0.86
  if:
    type: tree-sitter
    language: batch
    query: "(cmd (command_name) @tool (argument_list) @args\n  (#match? @tool \"(?i)^w32tm(\\\\.exe)?$\")\n  (#match? @args \"(?i)(^|\\\\s)/stripchart($|\\\\s)\")\n  (#match? @args \"(?i)(^|\\\\s)/computer:localhost($|\\\\s)\")\n  (#match? @args \"(?i)(^|\\\\s)/samples:[0-9]+($|\\\\s)\"))"
