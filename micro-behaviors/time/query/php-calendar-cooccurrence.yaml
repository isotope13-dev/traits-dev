defaults:
  platforms: [windows, unix]
  for: [php]
composite_rules:
  - id: php-named-timezone-weekday-hour-queries
    desc: Named timezone, weekday and hour queries co-occur
    crit: notable
    conf: 0.9
    near_bytes: 600
    all:
      - id: micro-behaviors/time/query::php-named-timezone
      - id: micro-behaviors/time/query::php-weekday-of-week
      - id: micro-behaviors/time/query::php-hour-of-day
