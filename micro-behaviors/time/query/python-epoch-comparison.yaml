defaults:
  platforms: [unix, windows]
traits:
- id: python-time-epoch-comparison-context
  desc: Python time call beside epoch comparison
  crit: notable
  conf: 0.8
  for: [python]
  if:
    type: text
    regex: 'time\.time\s*\(\s*\)\s*[<>]=?\s*1[5-9][0-9]{8}'
  unless:
  - id: metadata/package/testing/presence/path::test-fixture-directory-path
  - id: metadata/lang/source/literal/value::python-quoted-epoch-comparison
