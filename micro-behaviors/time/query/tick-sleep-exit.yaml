defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: tick-sleep-exit-api-profile
    desc: Tick-count, sleep and exit API references
    crit: notable
    conf: 0.88
    near_lines: 80
    all:
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/time/sleep/interval::sleep-source
      - id: micro-behaviors/process/exit/terminate::exit-process-source
