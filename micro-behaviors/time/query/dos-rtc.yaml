# BIOS INT 1Ah AH=04h reads the real-time-clock date (CX=year, DH=month,
# DL=day). DOS date bombs poll it and compare the day against a trigger
# constant; the compare itself is campaign-specific, the clock read is not.
defaults:
  platforms: [unix, windows]
  for: [dos_com, static-lib, data]
  size_max: 65536
traits:
  - id: dos-bios-rtc-date-read
    desc: DOS reads the RTC date via BIOS
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_bios_rtc_date_read {
          meta:
            filetypes = "dos_com,data"
          strings:
            $rtc = { B4 04 CD 1A }
          condition:
            $rtc
        }

  # INT 21h AH=2Ah returns the weekday in AL; a CMP AL,imm8 right after it is
  # the "trigger day" test of a DOS date bomb.
  - id: dos-get-date-weekday-compare
    desc: DOS compares weekday from get-date
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 2A CD 21 3C ?? (74|75) ??"
