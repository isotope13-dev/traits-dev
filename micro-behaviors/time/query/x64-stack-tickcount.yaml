defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-stack-gettickcount64-name
    desc: Constructs GetTickCount64 API name on stack
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '48 B? 47 65 74 54 69 63 6B 43 [0-24] 48 B? 43 6F 75 6E 74 36 34 00'
