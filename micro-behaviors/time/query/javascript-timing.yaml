defaults:
  platforms: [windows, unix]
traits:
- id: js-performance-now-near-compute
  desc: performance.now near math or hash work
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'performance\.now\(\)[\s\S]{0,260}(Math\.(sqrt|sin)|createHash)'

composite_rules:
- id: js-date-now-difference-return
  desc: Date.now calls near a subtraction return
  for: [javascript]
  crit: notable
  near_bytes: 500
  unless:
    # A CLI that parses relative time windows (Date.parse + durationMs +
    # "Relative durations:" help) diffs Date.now() for its own reporting.
    # Name that context; the whole time/query/ directory also holds this
    # rule's own Date.now()/new Date() legs.
    - id: micro-behaviors/time/query::js-cli-duration-window
    # Bundled web assets accumulate Date.now()/new Date() timing checks from
    # frameworks and libraries; that is not sandbox jitter probing.
    - id: metadata/package/files/runtime::javascript-assets-tree-artifact
  all:
    - id: micro-behaviors/data/arithmetic::return-subtraction-expression
  any:
    - id: micro-behaviors/time/query::js-triple-date-now
    - id: micro-behaviors/time/query::js-triple-new-date
