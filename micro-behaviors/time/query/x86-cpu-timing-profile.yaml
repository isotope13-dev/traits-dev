defaults:
  platforms: [unix, windows, macos]
# Environmental Fingerprinting via Hardware Interrogation
# Detects clusters of instructions like CPUID, RDTSC, etc.
composite_rules:
  - id: hardware-interrogation-cluster
    desc: CPUID with nearby timestamp-counter queries
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/instruction::cpuid-instr
      - id: micro-behaviors/time/query::rdtsc-instruction
    near_bytes: 512
