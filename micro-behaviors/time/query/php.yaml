# PHP wall-clock queries. Reading the hour, the weekday, or constructing a
# specific named timezone are ordinary capabilities on their own; a cloaking
# composite combines them to gate behavior on a target's business hours.
defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
  conf: 0.85
traits:
  - id: php-named-timezone
    desc: Constructs a specific named timezone
    if:
      type: text
      regex: '(?i)new\s+DateTimeZone\s*\(\s*["''][A-Za-z]+/[A-Za-z_]+'
  - id: php-weekday-of-week
    desc: Reads the ISO day of week
    if:
      type: text
      regex: '(->format|\bdate|\bgmdate)\s*\(\s*["'']N["'']'
  - id: php-hour-of-day
    desc: Reads the 24-hour hour of day
    if:
      type: text
      regex: '(->format|\bdate|\bgmdate)\s*\(\s*["'']G["'']'
