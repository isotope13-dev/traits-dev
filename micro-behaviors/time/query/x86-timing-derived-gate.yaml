# An unpack gate that mixes process, timing, and thread identity
# (process ID, tick count, performance counter, thread ID) with arithmetic
# folding and a magic comparison. Ordinary programs query one clock;
# combining all four to derive a decode decision gates execution on a
# live, non-emulated environment.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-tick-qpc-derived-decode-gate
    desc: x86 tick and counter derived decode gate
    crit: suspicious
    conf: 0.9
    if:
      type: yara
      source: |
        import "pe"
        rule x86_tick_qpc_derived_decode_gate {
          strings:
            $magic = { 81 FE 40 BB 00 00 }
            $mix = { F7 D6 }
            $odd = { 83 C9 01 }
            $ind = { FF 15 ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_I386 and $magic and $mix and $odd and
            for any m in (1..#mix) : (
              for any o in (1..#odd) : (
                @odd[o] > @mix[m] and @odd[o] - @mix[m] <= 16 and
                for any g in (1..#magic) : (
                  @mix[m] > @magic[g] and @mix[m] - @magic[g] <= 96
                )
              ) and
              for any a in (1..#ind) : (
                for any b in (1..#ind) : (
                  for any c in (1..#ind) : (
                    a != b and b != c and a != c and
                    @ind[a] > @mix[m] - 96 and @ind[a] < @mix[m] + 64 and
                    @ind[b] > @mix[m] - 96 and @ind[b] < @mix[m] + 64 and
                    @ind[c] > @mix[m] - 96 and @ind[c] < @mix[m] + 64
                  )
                )
              )
            )
        }
