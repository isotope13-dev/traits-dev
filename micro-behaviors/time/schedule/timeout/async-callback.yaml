defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: named-callback-timer
    desc: Schedules a named timer callback
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)set(Timeout|Interval)\s*\(\s*[A-Za-z_$][\w$]*\s*,'

  - id: async-arrow-callback
    desc: Schedules an asynchronous callback
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'setTimeout\s*\(\s*async\s*\(\s*\)\s*=>'

