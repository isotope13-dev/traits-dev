defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
traits:
  - id: jittered-timeout-delay
    desc: Schedules timeout with randomized delay
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: 'setTimeout\([\s\S]{0,140}\w+\s*\+\s*(Math\.\w+\()?\s*Math\.random\(\)\s*\*'
  # `setInterval(async () => {...}, 2000 + ~~(Math.random() * 1000))`: the
  # callback spans lines, so match the call's tail -- a closing callback
  # followed by a base period plus a Math.random term.
  - id: setTimeout
    desc: Schedules a JavaScript callback with setTimeout
    crit: notable
    conf: 0.5
    if:
      type: symbol
      kind: call
      regex: '^(window\.|globalThis\.|global\.)?setTimeout$'
  - id: repeated-settimeout
    size_max: 262144
    for: [javascript, typescript]
    desc: Contains at least six setTimeout calls
    crit: notable
    conf: 0.9
    count_min: 6
    # A count on a trait reference is ignored. The validator also rejects
    # count_min on the equivalent qualified symbol alternatives. Capture one
    # parsed callee per call to retain both the exact receiver set and count.
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: [(identifier) (member_expression)] @callee)
          (#match? @callee "^(window\\.|globalThis\\.|global\\.)?setTimeout$"))
