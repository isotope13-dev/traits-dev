defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
traits:
  - id: jittered-timeout-delay
    desc: Schedules timeout with randomized delay
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: 'setTimeout\([\s\S]{0,140}\w+\s*\+\s*(Math\.\w+\()?\s*Math\.random\(\)\s*\*'
  # `setInterval(async () => {...}, 2000 + ~~(Math.random() * 1000))`: the
  # callback spans lines, so match the call's tail -- a closing callback
  # followed by a base period plus a Math.random term.
  - id: setTimeout
    desc: Schedules a JavaScript callback with setTimeout
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      kind: call
      exact: setTimeout
  - id: repeated-settimeout
    desc: Contains at least six setTimeout calls
    crit: notable
    conf: 0.9
    count_min: 6
    if:
      id: micro-behaviors/time/schedule/timeout::setTimeout
