defaults:
  platforms: [windows, unix]
  crit: notable
traits:
  - id: js-timer-string-callback
    desc: JavaScript timer schedules a string callback
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^(setTimeout|setInterval)$'
      arg:
        index: 0
        kind: string
  # JSP/HTML has no JavaScript call projection. Match the source form here,
  # while keeping ordinary callback-function timers out of this observation.
  - id: html-timer-string-callback
    desc: HTML timer schedules a string callback
    conf: 0.88
    for: [html, jsp]
    if:
      type: text
      regex: '\bset(Timeout|Interval)\s*\(\s*["\x27]'
      exclude_html_comments: true
