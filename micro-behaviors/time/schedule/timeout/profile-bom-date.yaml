defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: js-bom-date-timeout-clues
    desc: BOM literal with Date and timeout calls
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-date-method-call
      - id: micro-behaviors/data/string/unicode::js-bracketed-call-bom-prefix
      - id: micro-behaviors/time/schedule/timeout::setTimeout
