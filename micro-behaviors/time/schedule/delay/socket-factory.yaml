defaults:
  for: [javascript, typescript]
  platforms: [windows, unix]
traits:
  - id: socket-factory-direct-timeout
    desc: Socket factory directly schedules a callback
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((variable_declarator
          name: (identifier) @factory
          value: (arrow_function
            body: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @timer) @call))))
          (#match? @factory "^make[A-Za-z]*Socket$")
          (#eq? @timer "setTimeout"))
