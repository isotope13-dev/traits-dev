# JavaScript Timing Jitter
# Detects use of Math.random() in a setTimeout delay argument.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.8

traits:
  - id: long-settimeout-delay
    desc: JavaScript setTimeout with long delay
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'setTimeout\s*\(\s*[^,()]{1,80},\s*[0-9]{7,}\s*\)'
  # `long-settimeout-delay` above needs a 7-digit delay (~2.8 hours) AND a first
  # argument free of parens and commas, so it sees neither the ordinary
  # `setTimeout(() => { ... }, 60000)` shape nor the minute-scale delays malware
  # actually uses. This one anchors on the tail of the call -- the closing brace
  # of an inline callback, then the delay -- which is the same for arrow and
  # `function` callbacks, and sets the floor at 10 seconds.
  #
  # Neutral on its own: retry backoffs, poll loops and splash-screen timers all
  # defer work this way. The anti-analysis reading comes from the composites
  # that pair it with what happens after the wait.
  - id: settimeout-callback-long-delay
    desc: setTimeout defers callback ten or more seconds
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'setTimeout\s*\([\s\S]{0,800}\}\s*,\s*[0-9]{5,}\s*\)'

  - id: settimeout-random-delay
    desc: setTimeout delay uses Math.random jitter
    conf: 0.88
    if:
      type: text
      regex: 'setTimeout\s*\(\s*[^,\n]{1,120},\s*[^)\n]{0,80}Math\.random\s*\('
