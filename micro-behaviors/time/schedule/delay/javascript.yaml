# JavaScript Timing Jitter
# Detects use of Math.random() in a setTimeout delay argument.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.8

traits:
  # A setTimeout call with an install* or progress* name within 180 bytes --
  # progress bars and setup wizards do this constantly. The store-themed
  # update lure composites add the modal class change and update navigation.
  - id: settimeout-install-progress-name
    desc: setTimeout near an install or progress name
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '(?is)\bsetTimeout\s*\(.{0,180}\b(install|progress)[A-Za-z]*\b'
  - id: long-settimeout-delay
    desc: JavaScript setTimeout with long delay
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'setTimeout\s*\(\s*[^,()]{1,80},\s*[0-9]{7,}\s*\)'
  # Bind the callback and numeric delay to the same parsed call. A text
  # window can accidentally associate an earlier timer with a later delay.
  - id: settimeout-callback-long-delay
    desc: setTimeout defers callback ten or more seconds
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @timer
          arguments: (arguments
            . [(arrow_function) (function_expression)]
            . (number) @delay .)) @call
          (#eq? @timer "setTimeout")
          (#match? @delay "^[1-9][0-9]{4,}$"))

  # Forked Baileys clients defer auto-follow with `await sleep(delayMs)` where
  # the default delay is on the order of minutes, not a short poll interval.
  - id: js-await-delay-helper-call
    desc: Awaited delay-helper call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(await[^;]{0,60}\.delay\s*\)?\s*\(|await\s+delay\s*\()\s*[0-9][0-9_]*'
  - id: js-await-sleep-ten-second-plus
    desc: await sleep defers at least ten seconds
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'await\s+sleep\s*\(\s*(delayMs|[1-9][0-9]{4,})\s*\)'

  # Staggered per-item timers pass a computed variable instead of a numeric
  # literal, so neither long-delay leg resolves them. Bind the callback and
  # the variable delay to the same parsed call, as the long-delay sibling
  # does: staggering loops (base + index * step) are the shape forked
  # clients use to spread channel follows across rate-limit windows.
  - id: settimeout-callback-computed-delay
    desc: setTimeout defers callback with a computed delay
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @timer
          arguments: (arguments
            . [(arrow_function) (function_expression)]
            . (identifier) @delay .)) @call
          (#eq? @timer "setTimeout"))

  # Post-login channel boosters defer a few seconds after CB:success so the
  # follow runs once the session is authenticated but before the host app
  # handles connection.update — shorter than anti-analysis long delays.
  # Match the callback and delay in one call regardless of callback length.
  - id: settimeout-callback-short-delay
    desc: setTimeout three to nine second delay
    crit: notable
    conf: 0.84
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @timer
          arguments: (arguments
            . [(arrow_function) (function_expression)]
            . (number) @delay .)) @call
          (#eq? @timer "setTimeout")
          (#match? @delay "^[3-9]000$"))

  - id: settimeout-random-delay
    crit: notable
    desc: setTimeout delay uses Math.random jitter
    conf: 0.88
    if:
      type: text
      regex: 'setTimeout\s*\(\s*[^,\n]{1,120},\s*[^)\n]{0,80}Math\.random\s*\('
