defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: short-string-call-timeout
    desc: String callback scheduled within ten seconds
    if:
      type: text
      exclude_html_comments: true
      regex: "setTimeout\\(\\s*[\"\\x27]\\w+\\(\\)[\"\\x27]\\s*,\\s*[1-9]\\d{0,3}\\s*\\)"
