defaults:
  for: [c]
  platforms:
  - unix
  - windows
traits:
- id: udpblaster-rate-derived-delay
  desc: Computes delay from UDP host rate
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: delay\s*=\s*\([^;\r\n]{0,80}CONFIG_EXAMPLES_UDPBLASTER_HOSTRATE
- id: usleep-delay-variable
  desc: Sleeps for a delay variable
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: usleep\s*\(\s*delay\s*\)
