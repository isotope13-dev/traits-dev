# Remaining time until 24 hours after a stored timestamp (usually the
# install time): `(24*3600*1000)-(now - stamp)`, used as a setTimeout delay
# so the guarded code only starts a day after it was first recorded.
traits:
  - id: one-day-after-stamp-remaining-delay
    desc: Computes delay until a day after stamp
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, typescript]
    if:
      type: text
      regex: '\(24\s*\*\s*3600\s*\*\s*1000\)\s*-\s*\(\(?new Date(\(\))?\)?\.getTime\(\)\s*-\s*\w+\)'
