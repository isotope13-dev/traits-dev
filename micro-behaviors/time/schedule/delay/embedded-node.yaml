defaults:
  platforms: [windows, linux, macos]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
- id: embedded-node-timeout-callback
  desc: Embeds a one-shot Node timeout callback
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'setTimeout\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*,\s*[0-9]{4,}\s*\)'

  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
