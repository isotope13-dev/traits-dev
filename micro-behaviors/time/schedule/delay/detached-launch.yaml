defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: timer-with-detached-file-launch-apis
  for:
  - javascript
  - typescript
  - npm
  desc: Long or random timer with detached file-launch APIs
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/process/create/variable-spawn::node-write-chmod-detached-spawn-profile
  any:
  - id: micro-behaviors/time/schedule/delay::settimeout-random-delay
  - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  crit: notable
  near_bytes: 8192
