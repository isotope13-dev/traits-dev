# Call facts expose the timer and require individually, but the anonymous
# callback body is opaque in flow facts. Require the method invocation inside
# the timer callback; file-wide proximity would pair unrelated imports/timers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: timeout-calls-local-module-method
    desc: Timer loads and calls local module
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @timer
          arguments: (arguments
            . [(arrow_function body: (statement_block
                 (expression_statement (call_expression
                   function: (member_expression object: (call_expression
                     function: (identifier) @loader
                     arguments: (arguments . (string (string_fragment) @path) .)))))))
               (function_expression body: (statement_block
                 (expression_statement (call_expression
                   function: (member_expression object: (call_expression
                     function: (identifier) @loader
                     arguments: (arguments . (string (string_fragment) @path) .)))))))]
            . (_) .)) @operation
          (#eq? @timer "setTimeout")
          (#eq? @loader "require")
          (#match? @path "^\\.{1,2}/"))
