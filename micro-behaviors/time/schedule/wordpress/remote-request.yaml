# File-local co-occurrence leaves callback ownership and intent unresolved.
# Telemetry, update checks, and health checks routinely have this combination.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable

composite_rules:
  - id: scheduled-remote-request-context
    desc: WordPress scheduling and remote request cooccur
    conf: 0.98
    scope: file
    near_bytes: 2000
    all:
      - id: micro-behaviors/time/schedule/wordpress::wp-schedule-event
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-http-request
