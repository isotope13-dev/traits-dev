# Hardcoded ISO-8601 timestamps. A date literal is a neutral data fact; the
# Graph calendar dead-drop composites pair a far-future event window with
# calendar API paths before inferring a tasking channel.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]
traits:
  - id: far-future-iso-timestamp
    desc: ISO timestamp literal dated 2040-2099
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '20[4-9][0-9]-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}'
