defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  size_max: 2097152
traits:
  - id: clock-gated-cookie-update-and-call
    desc: Clock gates cookie update and call
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (_ (variable_declarator name: (identifier) @clock
            value: (call_expression
              function: (member_expression object: (identifier) @math
                property: (property_identifier) @floor)
              arguments: (arguments (binary_expression
                left: (call_expression function: (member_expression
                  object: (identifier) @date
                  property: (property_identifier) @now)))))))
          .
          (if_statement
            condition: (parenthesized_expression (binary_expression
              left: (binary_expression left: (identifier) @clock_use operator: ">=")
              operator: "||"))
            consequence: (statement_block
              (expression_statement (sequence_expression
                (assignment_expression left: (member_expression
                  object: (identifier) @cookie_document
                  property: (property_identifier) @cookie))
                (call_expression) @evidence)))))
          (#eq? @clock @clock_use)
          (#eq? @math "Math")
          (#eq? @floor "floor")
          (#eq? @date "Date")
          (#eq? @now "now")
          (#eq? @cookie_document "document")
          (#eq? @cookie "cookie")
          (#set! cleave.ignore-comments "true"))
