defaults:
  platforms: [windows]
  for: [pyc]

traits:
  - id: pyc-timerqueue-name
    desc: Bytecode references CreateTimerQueueTimer
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: CreateTimerQueueTimer

composite_rules:
  - id: pyc-memory-timerqueue-api-cluster
    desc: Python bytecode references timer callbacks and memory protection/copy API names
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/mem/protect/modify::pyc-virtualprotect-name
      - id: "micro-behaviors/mem/copy::pyc-rtlmovememory-name"
      - id: pyc-timerqueue-name
