# Timer Queue Callback APIs (Windows)
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: create-timer-queue-symbol
    desc: CreateTimerQueue API symbol reference
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: CreateTimerQueue
  - id: create-timer-queue-timer-sym
    desc: CreateTimerQueueTimer symbol
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "CreateTimerQueueTimer"
