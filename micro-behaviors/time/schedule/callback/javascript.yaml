defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, svg]
traits:
  # Markup analyzers do not project embedded JavaScript calls as symbols.
  - id: markup-timer-call-text
    desc: Timer syntax in HTML or SVG
    crit: notable
    conf: 0.7
    for: [html, svg]
    if:
      type: text
      exclude_html_comments: true
      regex: '\b(setInterval|setTimeout)\s*\('
composite_rules:
  # A timer callback that detaches a node: toasts and transient UI share
  # the shape, so this stays notable; a pointer-trap that schedules its own
  # teardown convicts in the clickjacking composites.
  - id: timed-dom-removal
    desc: Timer callback removes a DOM node
    crit: notable
    conf: 0.85
    for: [html]
    near_lines: 30
    all:
      - id: markup-timer-call-text
      - id: micro-behaviors/data/collection/dom::node-remove-call
  - id: javascript-timer-call
    desc: Calls a JavaScript timeout or interval timer
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: micro-behaviors/time/schedule/timeout::setTimeout
      - id: markup-timer-call-text
