# Tkinter's after() schedules a callback on the GUI event loop. Requiring a
# monitor- or poll-shaped callback distinguishes recurring observation loops
# from ordinary one-shot interface updates.
defaults:
  platforms:
    - unix
    - windows
  for:
    - python

traits:
  - id: tkinter-monitor-callback-schedule
    desc: Schedules Tkinter monitor callback
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.after\(.{0,48}(self\.)?\w{0,32}(monitor|poll)\w{0,32}\)'
