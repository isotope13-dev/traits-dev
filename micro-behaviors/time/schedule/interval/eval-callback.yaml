defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: interval-callback-eval-source
    desc: Interval call contains eval source syntax
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (identifier) @timer) @timer_call
          (#eq? @timer "setInterval")
          (#match? @timer_call "(?s)^setInterval\\s*\\(.{0,2400}\\beval\\s*\\("))
