defaults:
  crit: component
  conf: 0.7
  for: [binaries]
  platforms: [unix, windows]

traits:
  # Heartbeat and check-in loops are ordinary liveness and automation
  # mechanisms. They become C2 evidence only when an objective composite also
  # proves the relevant network behavior.
  - id: heartbeat-checkin-before-loop
    desc: Heartbeat or check-in precedes loop wording
    if:
      type: text
      regex: \b(beacon|heartbeat|checkin)\b.{0,50}\bloop\b
      case_insensitive: true

  - id: loop-before-heartbeat-checkin
    desc: Loop wording precedes heartbeat or check-in
    if:
      type: text
      regex: \bloop\b.{0,50}\b(beacon|heartbeat|checkin)\b
      case_insensitive: true
