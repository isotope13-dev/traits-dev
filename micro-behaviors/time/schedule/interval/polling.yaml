defaults:
  crit: component
  conf: 0.7
  for: [binaries]
  platforms: [unix, windows]

traits:
  # Heartbeat and check-in loops are ordinary liveness and automation
  # mechanisms. They become C2 evidence only when an objective composite also
  # proves the relevant network behavior.
  - id: heartbeat-checkin-before-loop
    crit: notable
    desc: Heartbeat or check-in precedes loop wording
    if:
      type: text
      regex: \b(beacon|heartbeat|checkin)\b.{0,50}\bloop\b
      case_insensitive: true

  - id: loop-before-heartbeat-checkin
    crit: notable
    desc: Loop wording precedes heartbeat or check-in
    if:
      type: text
      regex: \bloop\b.{0,50}\b(beacon|heartbeat|checkin)\b
      case_insensitive: true

  # Require a routine-role label; TLS enum and alert text can name heartbeat
  # without implementing a periodic check-in.
  - id: heartbeat-routine-label
    crit: notable
    desc: Heartbeat check-in routine label
    for: [binaries, python]
    if:
      type: text
      regex: '(?i)(heartbeat[_ .:]?(loop|thread)|(send|check)[_ .:]?heartbeat)'

  # A bare heartbeat field label. A compiled Python module packs the keys of
  # one record into a single string table (device_id, session_token,
  # heartbeat), so no word boundary or routine wording survives compilation
  # and the label alone is the observation. The match spans the surrounding
  # identifier run, the packed-table shape itself: TLS stacks name their
  # heartbeat extension inside protocol vocabulary (gnutls_heartbeat_ping,
  # heartbeat_extension, "heartbeat ping received"), and that vocabulary is
  # part of the match, so the exclusions below see and drop it.
  - id: heartbeat-field-label
    crit: notable
    conf: 0.75
    desc: Heartbeat field label packed between identifiers
    for: [binaries, python]
    if:
      type: text
      regex: '[a-z0-9_]+heartbeat[a-z0-9_]+'
    not:
      - regex: '(?i)(tls|dtls|ssl|heartbleed|handshake|extension|alert|ping|pong)'

composite_rules:
  # One heartbeat observation, in either readable or packed form: a named
  # group so consumers keep a single heartbeat leg without losing the
  # routine-wording or the packed-table form.
  - id: heartbeat-check-in-reference
    desc: Heartbeat routine or packed field label
    crit: notable
    conf: 0.9
    for: [binaries, python]
    any:
      - id: heartbeat-routine-label
      - id: heartbeat-field-label
