defaults:
  platforms: [windows, unix]
  for: [html, scripts]
traits:
  - id: interval-call-text
    desc: Repeated interval timer
    crit: notable
    if:
      type: text
      # Case-sensitive on purpose: the JS/DOM timer API is canonically spelled
      # setInterval. A case-insensitive scan also matched lowercase lookalikes
      # in other script languages, e.g. a Python `setinterval` alias of
      # sys.setswitchinterval (thread-switch tuning, not a repeating timer).
      regex: '\bsetInterval\s*\('
