defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: interval-countdown-decrement
    desc: Interval callback decrements countdown value
    if:
      type: text
      regex: '\bsetInterval\s*\([\s\S]{1,140}?(--\w+|\w+\s*(--|-=\s*\d+))'
