# `bread <file> <off> <len> &bin` stages local file bytes and
# `sockwrite <sock> &bin` pushes the staging variable to the peer: a raw
# socket file upload with no DCC handshake, the backdoor's quiet exfil path.
defaults:
  platforms: [unix, windows]
  for: [mirc]
traits:
  # `.filter -wf <query> <outfile> *` copies the query window's lines into a
  # staging file: the harvest half of chat-log theft.
- id: mirc-command-interval-timer
  desc: mIRC timer drips staged lines out
  crit: notable
  conf: 0.9
  for: [mirc, text, data]
  if:
    type: text
    regex: '(?i)\.timer\w*\s+\S+\s+\d+\s+/send'
  # `.msg %owner $read -l <n> <file>`: one staged line walks to the operator.
