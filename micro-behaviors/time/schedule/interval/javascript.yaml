defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
    - html
traits:
  # An interval named alongside a jitter value is how any client spreads its
  # polling load -- SDKs waiting on an async job, retry helpers, health checks.
  # Beacon intent comes from the C2 composites that pair this with a remote
  # task fetch, not from the schedule itself.
  - id: jittered-poll-interval
    desc: Poll interval paired with a jitter value
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*(poll|sleep|beacon)(Interval|Time)\b[\s\S]{0,160}\bjitter\w*\b'
  - id: jittered-timeout-delay
    desc: Schedules timeout with randomized delay
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: 'setTimeout\([\s\S]{0,140}\w+\s*\+\s*(Math\.\w+\()?\s*Math\.random\(\)\s*\*'
  - id: setInterval
    desc: Schedules a repeated callback with setInterval()
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      kind: call
      exact: setInterval
  - id: setInterval-reference
    desc: References setInterval in JavaScript
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: setInterval
  - id: setTimeout
    desc: Schedules a JavaScript callback with setTimeout
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      kind: call
      exact: setTimeout

  - id: timer-call-reference
    desc: Timer callback reference
    crit: baseline
    conf: 0.7
    # svg: deferred execution inside an SVG's inline script (setTimeout around
    # the loader) is the classic SVG-attachment evasion pattern, so the timer
    # must be visible in SVG documents too.
    for: [javascript, typescript, html, svg]
    if:
      type: text
      regex: '\b(setInterval|setTimeout)\s*\('
  - id: repeated-settimeout
    desc: Contains at least six setTimeout calls
    crit: notable
    conf: 0.9
    count_min: 6
    if:
      id: micro-behaviors/time/schedule/interval::setTimeout
  - id: nestjs-interval-decorator
    desc: NestJS interval-scheduled method
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '@Interval\s*\('
  - id: nestjs-cron-decorator
    desc: NestJS cron-scheduled method
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '@Cron\s*\('
