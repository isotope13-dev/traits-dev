defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
    - html
traits:
  - id: setInterval
    desc: Schedules a repeated callback with setInterval()
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      kind: call
      exact: setInterval
  - id: setInterval-reference
    desc: References setInterval in JavaScript
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: setInterval
  - id: setTimeout
    desc: Schedules a JavaScript callback with setTimeout
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      kind: call
      exact: setTimeout

  - id: timer-call-reference
    desc: Timer callback reference
    crit: baseline
    conf: 0.7
    # svg: deferred execution inside an SVG's inline script (setTimeout around
    # the loader) is the classic SVG-attachment evasion pattern, so the timer
    # must be visible in SVG documents too.
    for: [javascript, typescript, html, svg]
    if:
      type: text
      regex: '\b(setInterval|setTimeout)\s*\('
  - id: repeated-settimeout
    desc: Contains at least six setTimeout calls
    crit: notable
    conf: 0.9
    count_min: 6
    if:
      id: micro-behaviors/time/schedule/interval::setTimeout
  - id: nestjs-interval-decorator
    desc: NestJS interval-scheduled method
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '@Interval\s*\('
  - id: nestjs-cron-decorator
    desc: NestJS cron-scheduled method
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '@Cron\s*\('
