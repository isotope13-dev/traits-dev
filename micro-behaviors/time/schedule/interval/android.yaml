defaults:
  platforms: [android]
  for: [apk, zip, dex]
  crit: component
  conf: 0.86

traits:
  - id: android-source-idle-alarm-schedule
    desc: Android source schedules an idle alarm
    crit: notable
    conf: 0.98
    for: [java, kotlin]
    if:
      type: symbol
      kind: call
      exact: setAndAllowWhileIdle

  # `this` is the currently executing Runnable in the common Handler loop
  # shape. Reposting it at a subsecond interval is a concrete repeating
  # callback, not merely a one-shot UI delay.
  - id: android-subsecond-self-rescheduling-handler
    desc: Android Handler subsecond self-reschedule
    crit: notable
    conf: 0.96
    for: [java, kotlin]
    if:
      type: text
      regex: '\bpostDelayed\s*\(\s*this\s*,\s*([1-9][0-9]{0,2}|1000)[lL]?\s*\)'

  - id: android-job-scheduler-reference
    crit: notable
    desc: Android JobScheduler API reference
    if:
      type: text
      substr: "Landroid/app/job/JobScheduler;"

  - id: android-persisted-job-setting
    crit: notable
    desc: Android job requests reboot persistence
    if:
      type: text
      exact: setPersisted

  - id: android-timer-task-reference
    crit: notable
    desc: Android TimerTask reference
    if:
      type: text
      substr: "Ljava/util/TimerTask;"

  - id: android-fixed-rate-scheduler
    crit: notable
    desc: Android fixed-rate scheduler
    if:
      type: text
      substr: "scheduleAtFixedRate"

  - id: android-alarm-manager-reference
    crit: notable
    desc: Android AlarmManager reference
    if:
      type: text
      substr: "Landroid/app/AlarmManager;"

  - id: android-pending-intent-reference
    crit: notable
    desc: Android PendingIntent reference
    if:
      type: text
      substr: "Landroid/app/PendingIntent;"

composite_rules:
  - id: android-persisted-job-schedule
    desc: Android schedules a reboot-persistent job
    crit: notable
    conf: 0.93
    all:
      - id: android-job-scheduler-reference
      - id: android-persisted-job-setting

  - id: android-repeating-timer-task
    desc: Android repeating timer task
    crit: notable
    conf: 0.9
    all:
      - id: android-timer-task-reference
      - id: android-fixed-rate-scheduler

  - id: android-scheduled-pending-intent
    desc: Android scheduled pending intent
    crit: notable
    conf: 0.9
    all:
      - id: android-alarm-manager-reference
      - id: android-pending-intent-reference
