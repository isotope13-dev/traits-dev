# Timer autostart and an archive URL do not establish process creation.
defaults:
  platforms: [windows]
  for: [pe, data, php, xml]
composite_rules:
  - id: jphp-autostart-archive-url
    desc: JPHP auto-start timer with archive URL
    crit: notable
    conf: 0.97
    all:
    - id: metadata/lang/source/syntax/directive::jphp-timer-action-annotation
    - id: micro-behaviors/data/property/assign::jphp-autostart-timer-property
    - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
