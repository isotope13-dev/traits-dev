defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: timer1-control-marker
    desc: Timer1 control identifier in PE resources
    crit: component
    conf: 0.82
    if:
      type: text
      substr: Timer1

composite_rules:
  - id: vb6-timer-control
    desc: VB6 Timer1 control marker
    crit: notable
    conf: 0.82
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: timer1-control-marker
