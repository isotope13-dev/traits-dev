# Neutral observations and discriminating identities.
traits:
- for:
  - pe
  - elf
  - macho
  platforms:
  - windows
  - linux
  - macos
  id: beacon-interval-field
  desc: Beacon interval configuration field name
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: beacon[_-]?(interval|period|delay)
    case_insensitive: true
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
