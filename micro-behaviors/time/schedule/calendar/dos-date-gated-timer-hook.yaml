defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536

traits:
  # INT 21h AH=2Ah returns CX=year, DH=month, DL=day. Comparing the month,
  # day or year and, on the matching branch, reading or installing the timer
  # vector (INT 08h or 1Ch) arms a tick handler only on a calendar date: the
  # trigger half of a dated DOS payload, independent of what the tick does.
  - id: dos-date-gated-timer-hook
    desc: DOS date check arms a timer handler
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_date_gated_timer_hook {
          meta:
            filetypes = "dos_com,static-lib,data"
          strings:
            $gate = { B4 2A CD 21 [0-6] ( 80 ( FE | FA ) ?? | 81 F9 ?? ?? ) ( 72 | 73 | 74 | 75 | 76 | 77 ) ?? [0-24] ( B8 ( 08 | 1C ) ( 35 | 25 ) | B0 ( 08 | 1C ) B4 ( 35 | 25 ) ) }
          condition:
            $gate
        }
