# Resolve the code's real position-relative decoder, key and counted range.
# No decoded instruction is claimed from a differently keyed string elsewhere.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-xor-calendar-clock-banner
    desc: XOR-hidden date and time gates message display
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_calendar_clock_banner {
          strings:
            $decode = { E8 00 00 5F 81 EF ?? ?? B9 ?? ?? 8A 95 ?? ?? 30 95 ?? ?? 47 E2 F9 C3 }
            $date = "\xb4\x2a\xcd\x21\x80\xfa" xor(1-255)
          condition:
            for any d in (1..#decode) : (
              @decode[d]+3 >= uint16(@decode[d]+6) and
              (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+13) < filesize and
              @date >= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17) and
              @date+!date <= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17)+uint16(@decode[d]+9) and
              (uint8(@date) ^ 180) == uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13)) and
              (uint8(@date+7) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 116 and
              (uint8(@date+9) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 128 and
              (uint8(@date+10) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 250 and
              (uint8(@date+12) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 117 and
              (uint8(@date+14) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 180 and
              (uint8(@date+15) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 44 and
              (uint8(@date+16) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 205 and
              (uint8(@date+17) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 33 and
              (uint8(@date+18) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 128 and
              (uint8(@date+19) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 249 and
              (uint8(@date+21) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 127 and
              (uint8(@date+23) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 128 and
              (uint8(@date+24) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 254 and
              (uint8(@date+26) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 127 and
              (uint8(@date+28) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 180 and
              (uint8(@date+29) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 9 and
              (uint8(@date+30) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 141 and
              (uint8(@date+31) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 150 and
              (uint8(@date+34) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 205 and
              (uint8(@date+35) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 33
            )
        }
