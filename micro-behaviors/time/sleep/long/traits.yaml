defaults:
  platforms: [unix, windows]
traits:
  - id: process-sleep-60-seconds
    desc: Sleeps for 60 seconds
    crit: notable
    conf: 0.7
    for:
      - powershell
      - python
    if:
      type: text
      regex: (Start-Sleep\s+-Seconds\s+60|time\.sleep\(60\))
composite_rules:
  - id: python-long-sleep-near-process-call
    desc: Python long sleep near process execution
    crit: notable
    conf: 0.85
    for: [python]
    near_bytes: 512
    all:
      - id: micro-behaviors/time/sleep/interval::python-sleep-call
      - id: micro-behaviors/time/sleep/interval::python-long-sleep-call
    any:
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: metadata/file/profile/execution-api::spawn-call
  - id: python-long-sleep-curl-shell-profile
    desc: Long sleep and spawned curl-to-shell pipeline
    crit: notable
    conf: 0.9
    for: [python]
    all:
      - id: python-long-sleep-near-process-call
      - id: micro-behaviors/process/create/shell/pipeline::spawned-curl-shell-pipeline
