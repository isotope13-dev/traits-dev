defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell, c, cpp]
  crit: notable
  conf: 0.92

traits:
  - id: loopback-ping-count-delay-command
    desc: Loopback ping command with repeated probes
    if:
      type: text
      regex: '(?i)\bping(\.exe)?\s+127\.0\.0\.1\s+-n\s+[2-9][0-9]*\s*>\s*nul\b'
