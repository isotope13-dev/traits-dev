# Includes AppleScript reconstructed from native carriers. A numeric delay is
# a wait capability, not evidence of sandbox evasion or periodic C2.
defaults:
  platforms: [macos]
  for: [applescript, macho]
traits:
  - id: applescript-numeric-delay
    desc: AppleScript delay with numeric seconds
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)(^|& ")[ \t]*delay[ \t]+[0-9]+(\.[0-9]+)?\b'
