defaults:
  platforms: [unix]
  crit: notable
  conf: 0.85

traits:
  - id: shell-randomized-sleep-interval
    desc: Sleeps for a randomized interval
    for: [shell]
    if:
      type: text
      regex: '(?i)sleep\s[^\n]{0,60}(RANDOM|rand\()'

  - id: workflow-randomized-sleep-modulo
    desc: Workflow sleep uses RANDOM modulo arithmetic
    for: [github-actions]
    if:
      type: text
      regex: 'sleep\s+\$\(\(RANDOM\s*%'
