defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  # A `while True:` whose only body is a sleep, closed by an `except
  # KeyboardInterrupt:`: the foreground process idles until the operator
  # presses Ctrl-C (a CLI keeping background workers or a server alive).
  - id: python-sleep-until-interrupt-loop
    desc: Python loop sleeps until KeyboardInterrupt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'while True:\s*\n\s*time\.sleep\([^)\n]{1,20}\)\s*\n\s*except KeyboardInterrupt\b'
  # A literal sleep of 1000 seconds or more (`time.sleep(3600)`).
  - id: python-sleep-1000s-literal
    desc: Python time.sleep of 1000+ literal seconds
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'time\.sleep\s*\(\s*[0-9]{4,}\s*\)'
