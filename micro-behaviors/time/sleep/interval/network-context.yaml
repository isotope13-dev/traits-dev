# Co-occurrence alone establishes neither beaconing nor sandbox evasion.
defaults:
  platforms: [unix, windows, macos]
  crit: notable

composite_rules:
  - id: sleep-network-cooccurrence
    desc: Sleep and network API references coexist
    conf: 0.5
    all:
      - id: sleep
    any:
      - id: micro-behaviors/communications/socket/connect::socket-create-and-connect-syscalls
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
    unless:
      - id: metadata/lang/compiler/systems::go-version-string
      - id: metadata/lang/compiled/
      - id: micro-behaviors/communications/http/server/listener::libmicrohttpd-start-daemon
      - id: micro-behaviors/os/event/loop::tokio-crate-path
      - id: metadata/binary/linking/runtime::dotnet-host-runtime
      - id: metadata/signed/platform::apple
      - id: metadata/file/string/identity::system-shell-basename
      - id: well-known/app/data/mariadb/
