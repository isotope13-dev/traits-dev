# Co-occurrence alone establishes neither beaconing nor sandbox evasion.
defaults:
  platforms: [unix, windows, macos]
  crit: notable

composite_rules:
  - id: sleep-network-cooccurrence
    desc: Sleep and network API references coexist
    conf: 0.5
    all:
      - id: sleep
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-and-connect-syscalls
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
