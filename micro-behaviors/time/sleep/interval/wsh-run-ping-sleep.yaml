# WSH sleep helper: WScript.Shell Run launches a hidden loopback ping and
# waits for it (`wsh.run("ping.exe localhost -n " + sec, 0, true)`), the
# usual JScript/VBScript stand-in for a missing Sleep in hosted scripts.
# wsh-run-hidden-call-once pairs with it so a script whose one hidden Run is
# that delay can be told apart from one that also hides a real command.
defaults:
  for: [xml, javascript, vbs, html]
  platforms: [windows]
  crit: baseline
  conf: 0.9

traits:
  - id: wsh-run-hidden-loopback-ping-wait
    desc: WSH Run launches hidden loopback ping
    if:
      type: text
      regex: '(?i)\.run\W{1,4}ping(\.exe)?\s[^"\n]{0,24}(localhost|127\.0\.0\.1)[^,\n]{0,40},\s*0\b'
  - id: wsh-run-hidden-call-once
    desc: Single WSH Run call with hidden window
    crit: component
    count_max: 1
    if:
      type: text
      regex: '(?im)\.run\b[ \t(]+[^\n]{0,400}?,\s*0\s*(,|\)|$)'

composite_rules:
  - id: wsh-run-hidden-only-ping-sleep
    desc: Only hidden WSH Run is a ping sleep
    all:
      - id: wsh-run-hidden-loopback-ping-wait
      - id: wsh-run-hidden-call-once
