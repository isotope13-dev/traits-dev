defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  # Canonical multi-digit delay call.  The GitHub raw-mailbox directory used
  # to carry an identical copy named `fixed-interval-poll`, which described a
  # C2 poll loop that its `sleep(1000)` matcher never established; scripts are
  # in scope here so that composite can reference this atom instead.
  - id: numeric-delay-call
    desc: Delay call with multi-digit argument
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(time\.Sleep|time\.sleep|sleep|Start-Sleep|setTimeout)\s*\(\s*[0-9]{2,5}'
