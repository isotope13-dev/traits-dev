defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
  attack: T1497.003

traits:
  - id: csharp-delay-call
    desc: .NET execution delay call
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '\b(Task\.Delay|Thread\.Sleep)\s*\('

composite_rules:
  - id: csharp-randomized-sleep
    desc: .NET delay interval uses a random value
    crit: notable
    conf: 0.94
    near_lines: 4
    all:
      - id: csharp-delay-call
      - id: micro-behaviors/os/random/prng/stdlib::random-next
