defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable

traits:
  - id: csharp-delay-call
    desc: .NET execution delay call
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^(System\.Threading\.(Tasks\.)?)?(Task\.Delay|Thread\.Sleep)$'

composite_rules:
  - id: csharp-randomized-sleep
    desc: Nearby .NET delay and random-value calls
    crit: notable
    conf: 0.94
    near_lines: 4
    all:
      - id: csharp-delay-call
      - id: micro-behaviors/os/random/prng/stdlib::random-next
