# Proximity does not establish execution order or an evasion purpose.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-long-sleep-process-clues
    desc: Long sleep near process-start reference
    crit: notable
    conf: 0.85
    near_lines: 10
    all:
      - id: micro-behaviors/time/sleep/interval::python-sleep-1000s-literal
    any:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
      - id: micro-behaviors/process/create/subprocess/launch::call-ast
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
