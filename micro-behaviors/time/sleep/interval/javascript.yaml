defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-atomic-sleep-module
    desc: JavaScript atomic-sleep module reference
    crit: baseline
    conf: 0.75
    if:
      type: string_literal
      substr: atomic-sleep
  - id: js-sleep-ms-delay
    desc: JavaScript sleep call with millisecond delay
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(await\s+)?sleep\s*\(\s*[0-9]{3,6}\s*\)'
