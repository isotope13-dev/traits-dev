defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-loop-sleep-call
    desc: Python while loop contains a sleep call
    if:
      type: tree-sitter
      query: |
        ((while_statement
          body: (block
            (expression_statement
              (call function: (attribute
                object: (identifier) @_module
                attribute: (identifier) @_sleep))))) @loop
        (#eq? @_sleep "sleep"))
