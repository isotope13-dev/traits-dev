# Randomized sleep intervals in native and Go source.
#
# A poll cadence whose period is derived from rand() is traffic shaping:
# ordinary pollers hard-code their interval or back off on failure, while a
# randomized delay (Stadia's agents "make an HTTP/S request at random
# intervals of 2 to 5 minutes") breaks the fixed-period signature a network
# sensor keys on. The interval expression must be inline in the delay call,
# matching the house style of the neighboring language atoms.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, rust]
  crit: notable
  conf: 0.88
  attack: T1497.003

traits:
  - id: c-randomized-sleep
    desc: C delay interval uses rand
    if:
      type: text
      regex: '\b(Sleep|usleep|delay)\s*\([^;]{0,60}\brand\s*\('

  - id: go-randomized-sleep
    desc: Go time.Sleep uses a random duration
    for: [go]
    if:
      type: text
      regex: 'time\.Sleep\s*\([^)\n]{0,80}\brand\.\w+'
