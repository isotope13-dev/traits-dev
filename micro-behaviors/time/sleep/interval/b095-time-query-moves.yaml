traits:
- id: sleep-func
  desc: Sleep for specified duration
  crit: baseline
  conf: 0.3
  for:
  - pe
  - elf
  - macho
  if:
    type: symbol
    exact: sleep
  platforms:
  - linux
  - macos
  - windows
- id: usleep-func
  desc: Sleep for microsecond duration
  crit: baseline
  conf: 0.3
  for:
  - elf
  - macho
  - c
  - cpp
  if:
    type: symbol
    exact: usleep
  platforms:
  - linux
  - macos
- id: sleep-us-source-call
  desc: Calls an embedded microsecond sleep API
  crit: notable
  conf: 0.92
  for:
  - c
  - cpp
  platforms:
  - ios
  - macos
  - appliance
  if:
    type: symbol
    kind: call
    regex: ^(sleep_us|busy_wait_us|delayMicroseconds)$
- id: nanosleep-func
  desc: Sleep for nanosecond duration
  crit: baseline
  conf: 0.3
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: nanosleep
  platforms:
  - linux
  - macos
composite_rules:
- id: sleep
  desc: Suspend execution for interval
  crit: baseline
  conf: 0.4
  platforms:
  - linux
  - macos
  any:
  - id: micro-behaviors/time/sleep/interval::sleep-func
  - id: micro-behaviors/time/sleep/interval::usleep-func
  - id: micro-behaviors/time/sleep/interval::nanosleep-func
  for:
  - scripts
  - binaries
