defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: sleep-interval-before-call
    desc: Sleep follows an interval configuration term
    crit: notable
    conf: 0.65
    if:
      type: string_literal
      regex: (interval|delay|period|beacon).{0,50}sleep
  - id: sleep-interval-after-call
    desc: Sleep precedes an interval configuration term
    crit: notable
    conf: 0.65
    if:
      type: string_literal
      regex: sleep.{0,50}(interval|delay|period)
    unless:
      - id: well-known/app/system/crunr/
      - id: micro-behaviors/communications/http/services/aws-s3/
