defaults:
  platforms: [windows]
  for: [powershell]
  crit: baseline
traits:
  - id: ps-start-sleep
    desc: PowerShell Start-Sleep call
    conf: 0.7
    if:
      type: text
      substr: Start-Sleep
  - id: ps-multisecond-sleep
    desc: PowerShell sleeps for multiple seconds
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?im)^\s*(sleep|Start-Sleep(\s+-Seconds)?)\s+([2-9]\d|1[01]\d|120)\b'
  - id: embedded-sleep-before-web-request
    desc: Embedded sleep precedes web request
    crit: notable
    conf: 0.95
    for: [vbs, javascript, html]
    if:
      type: text
      regex: '(?i)\bStart-Sleep\b[^\r\n]{0,160}\b(Invoke-WebRequest|Invoke-RestMethod|iwr|irm)\b'
  - id: ps-tight-ms-sleep
    desc: Start-Sleep under 500 ms
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: Start-Sleep\s+-Milliseconds\s+([1-9]\d{0,2}|[1-4]\d{2}|500)\b
      case_insensitive: true
  - id: ps-randomized-sleep
    desc: PowerShell sleep interval uses Get-Random
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(Start-Sleep\b[^\r\n]{0,180}\bGet-Random|Get-Random\b[^\r\n]{0,180}\bStart-Sleep)\b'
