defaults:
  platforms: [windows]
traits:
  - id: vbs-sleep-in-loop
    desc: VBScript sleep inside loop syntax
    for: [vbs]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bDo\s+(Until|While)\b[\s\S]{0,500}\bWScript\.Sleep\s+\d{2,}'

  # A Do Until Now() loop whose only body grows a string spins the CPU
  # instead of sleeping; the string length then depends on elapsed time.
  - id: vbs-now-busy-wait-string-growth
    desc: Wall-clock busy-wait loop grows a string
    for: [vbs]
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)Do\s+Until\s*\(?Now\(\)\s*>\s*\w+\)?\s+\w+\s*=\s*\w+\s*[+&]\s*"[^"]{1,4}"\s+Loop\b'

  - id: wscript-sleep-literal
    desc: Literal references WScript.Sleep
    for: [javascript, vbs]
    crit: notable
    conf: 0.5
    if:
      type: literal
      substr: WScript.Sleep
