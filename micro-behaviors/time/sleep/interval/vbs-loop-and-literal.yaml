defaults:
  platforms: [windows]
traits:
  - id: vbs-sleep-in-loop
    desc: VBScript sleep inside loop syntax
    for: [vbs]
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bDo\s+(Until|While)\b[\s\S]{0,500}\bWScript\.Sleep\s+\d{2,}'

  # A Do Until Now() loop whose only body grows a string spins the CPU
  # instead of sleeping; the string length then depends on elapsed time.
  - id: vbs-now-busy-wait-string-growth
    desc: Wall-clock busy-wait loop grows a string
    for: [vbs]
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?is)\bDo\s+Until\s*\(?Now\(\).{0,90}\w+\s*=\s*\w+\s*[+&]\s*"[^"]{1,4}".{0,90}\bLoop\b'

  # The call form of the literal above: JScript and VBScript pass a numeric
  # millisecond delay to WScript.Sleep, in call or sub spelling. Sysadmin
  # polling and droppers both wait this way; the delay is the observation.
  - id: wscript-sleep-call
    desc: Calls WScript.Sleep with a numeric delay
    for: [javascript, vbs, html]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bWScript\s*\.\s*Sleep\s*(\(\s*|\s)\d{2,}'

  - id: wscript-sleep-literal
    desc: Literal references WScript.Sleep
    for: [javascript, vbs]
    crit: notable
    conf: 0.5
    if:
      type: literal
      substr: WScript.Sleep

composite_rules:
  - id: vbs-wall-clock-sleep-loop
    for: [vbs]
    desc: VBScript waits in a wall-clock sleep loop
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/time/query::vbs-dateadd-seconds
      - id: micro-behaviors/time/sleep/interval::vbs-sleep-in-loop
    near_bytes: 1100
