defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: git-apply-cli-reference
    desc: Git apply command-line reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bgit\s+apply\b'

  - id: git-apply-argv-reference
    desc: Git apply argument-list reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']git["'']\s*,\s*["'']apply["'']'

  - id: git-apply-builder-reference
    desc: Git apply builder reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(NewCommand|Command)\(\s*["'']apply["'']'

  # Individual options are incomplete evidence and remain components: a bare
  # `--cached` token is equally `git diff --cached` or `git status --cached`,
  # and none of these flags names the patch-application command itself. The
  # suspicious observation is the complete indexed three-way option cluster.
composite_rules:
  - id: git-apply-command-reference
    desc: Git apply command reference
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/revision-control/git/write::git-apply-cli-reference
      - id: micro-behaviors/revision-control/git/write::git-apply-argv-reference
      - id: micro-behaviors/revision-control/git/write::git-apply-builder-reference

  - id: git-indexed-three-way-fallback
    desc: Git apply indexed cached binary three-way fallback
    crit: suspicious
    conf: 0.97
    # near_lines alone treats a one-line terminal-suggestion corpus as one
    # command. The flags also have to sit in one short span.
    near_lines: 8
    near_bytes: 4096
    all:
      - id: micro-behaviors/revision-control/git/write::git-apply-command-reference
      - id: metadata/lang/source/syntax/command/options::git-index-option-token
      - id: metadata/lang/source/syntax/command/options::git-recount-option-token
      - id: metadata/lang/source/syntax/command/options::git-cached-option-token
      - id: metadata/lang/source/syntax/command/options::git-binary-option-token
      - id: metadata/lang/source/literal/string::quoted-minus-three-token
