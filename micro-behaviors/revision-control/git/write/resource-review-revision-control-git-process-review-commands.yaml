defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: git-removes-test-tree
    desc: Git removes test directory tree
    if:
      type: text
      regex: '(?im)^\s*git\s+rm\s+-r\s+(test|tests|spec)(/|\s|$)'

  - id: powershell-ci-skip-commit
    desc: Git commit skips continuous integration
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bgit\s+commit\b[^\n]{0,160}\[(skip ci|ci skip)\]'
