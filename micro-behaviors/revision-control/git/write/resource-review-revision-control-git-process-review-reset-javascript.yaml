defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: git-reset-hard-head-text
  desc: Git hard reset command text
  conf: 0.88
  if:
    type: literal
    kind: string
    regex: \bgit\s+reset\s+--hard\s+HEAD\b
composite_rules:
- id: git-reset-hard-head-argv
  desc: Git hard reset argv sequence
  conf: 0.9
  near_bytes: 96
  all:
  - id: metadata/file/profile/tool-reference::git-string-literal
  - id: metadata/lang/source/literal/string::git-reset-literal
  - id: micro-behaviors/revision-control/git/configure::git-hard-flag-literal
  - id: metadata/lang/source/literal/string::head-string-literal
