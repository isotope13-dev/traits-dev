defaults:
  platforms: [windows, linux, macos]
  for:
    - javascript
traits:
  - id: git-tag-annotate
    desc: Creates annotated git tag
    crit: notable
    conf: 0.82
    if:
      # String constants only: block comments that document a user's
      # `git tag -a v1.2.3` are not the program creating a tag. The operand
      # rejects a bare `git tag -a ...` placeholder in a command catalog.
      type: literal
      regex: "git\\s+tag\\s+-a\\s+['\\\"]?(\\$\\{?|[A-Za-z0-9_])"
