defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.88
  attack: T1059.006
  mbc: C0017

traits:
- id: python-subprocess-git-add
  desc: Python subprocess stages Git file
  conf: 0.95
  if:
    type: text
    regex: 'subprocess\.run\([\s\S]{0,120}[''\"]git[''\"][\s\S]{0,80}[''\"]add[''\"]'

- id: python-subprocess-git-commit
  desc: Python subprocess commits Git changes
  conf: 0.95
  if:
    type: text
    regex: 'subprocess\.run\([\s\S]{0,120}[''\"]git[''\"][\s\S]{0,80}[''\"]commit[''\"]'

  # The publishing half of the family: clone/pull/fetch bring code in, this is
  # the one that sends it out, to a remote the caller does not necessarily
  # control. Only the adjacent argv pair is matched here; the composite below
  # adds the parser's call fact, so a module that merely quotes the command in
  # a help string or a docstring — with no subprocess call anywhere — does not
  # report a push.
- id: git-reset-hard-argv-token
  desc: Git reset --hard argument sequence
  ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
  if:
    type: text
    substr: '"reset", "--hard"'

composite_rules:
- id: subprocess-git-reset-hard-argv
  desc: Python subprocess hard-resets git checkout
  conf: 0.88
  ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
  all:
  - id: micro-behaviors/process/create/subprocess::run-ast
  - id: micro-behaviors/revision-control/git/write::git-reset-hard-argv-token

