defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: node-git-commit-bypasses-hooks
    desc: Node runs a Git commit bypassing hooks
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(exec|execSync)$'
      arg:
        kind: string
        regex: '^git\s+commit\b[^\n]{0,120}--no-verify\b'
