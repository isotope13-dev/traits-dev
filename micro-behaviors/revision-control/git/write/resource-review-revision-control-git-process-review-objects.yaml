defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - python
  - javascript
  - typescript
  - go
  - c
  - cpp
  - text
traits:
- id: git-hash-object-write
  desc: Writes data into Git object database
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \bhash-object\s+-w\b
- id: git-mktree-command
  desc: Builds a Git tree object
  crit: notable
  conf: 0.94
  if:
    type: text
    word: mktree
- id: git-commit-tree-command
  desc: Creates a Git commit object
  crit: notable
  conf: 0.94
  if:
    type: text
    word: commit-tree
- id: git-update-ref-command
  desc: Updates a Git reference
  crit: notable
  conf: 0.94
  if:
    type: text
    word: update-ref
composite_rules:
- id: git-object-publication-chain
  desc: Git object-writing commands near process execution
  crit: notable
  conf: 0.98
  near_lines: 16
  all:
  - id: micro-behaviors/revision-control/git/write::git-hash-object-write
  - id: micro-behaviors/revision-control/git/write::git-mktree-command
  - id: micro-behaviors/revision-control/git/write::git-commit-tree-command
  - id: micro-behaviors/revision-control/git/write::git-update-ref-command
  any:
  - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: micro-behaviors/process/create/subprocess/launch::applescript-nstask-shell-exec
  - id: micro-behaviors/process/create/subprocess/launch::aspnet-source-process-static-start
  - id: micro-behaviors/process/create/subprocess/launch::asyncio-create-subprocess-exec
  - id: micro-behaviors/process/create/subprocess/launch::build-extension-subprocess-popen
  - id: micro-behaviors/process/create/exec::bun-spawn-call
  - id: micro-behaviors/process/create/subprocess/launch::call-ast
  - id: micro-behaviors/process/create/subprocess/launch::call-touch-argv
  - id: micro-behaviors/process/create/subprocess/launch::check-call-ast
  - id: micro-behaviors/process/create/subprocess/launch::check-call-content
  - id: micro-behaviors/process/create/exec::deno-run-call
  - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
  - id: micro-behaviors/process/create/subprocess/launch::dotnet-source-process-instance-start
  - id: micro-behaviors/revision-control/git/read::git-diff-argv-call
  - id: micro-behaviors/process/create/subprocess/launch::glib-get-text-command-argument
  - id: micro-behaviors/process/create/subprocess/launch::go-command-launch
  - id: micro-behaviors/process/create/subprocess/launch::go-command-start
