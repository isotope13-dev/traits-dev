defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-git-branch-delete-clues
    desc: Install-named script references Git branch deletion
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/revision-control/git/write::git-branch-delete-command
    any:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
