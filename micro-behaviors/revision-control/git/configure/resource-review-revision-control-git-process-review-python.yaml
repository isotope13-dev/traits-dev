defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.88
  attack: T1059.006
  mbc: C0017

traits:
- id: python-git-hook-write
  desc: Python writes a Git hook file
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: open
    arg:
      kind: string
      substr: '.git/hooks/'

- id: python-git-hook-chmod
  desc: Python changes Git hook permissions
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: os.chmod
    arg:
      kind: string
      substr: '.git/hooks/'

- id: git-no-tags-argv-token
  desc: Git no-tags argv token
  ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
  if:
    type: text
    substr: '"--no-tags"'

composite_rules:
- id: python-git-hook-install
  desc: Python installs an executable Git hook
  conf: 0.96
  all:
  - id: micro-behaviors/revision-control/git/configure::python-git-hook-write
  - id: micro-behaviors/revision-control/git/configure::python-git-hook-chmod

- id: subprocess-git-clone-hooks-disabled
  desc: Python subprocess invokes git clone with hooks disabled
  conf: 0.9
  ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
  all:
  - id: micro-behaviors/revision-control/git/transfer::subprocess-git-clone-argv
  - id: micro-behaviors/revision-control/git/configure::git-hooks-disabled-config-token

