defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.88

traits:
  - id: git-config-core-section
    desc: Git core configuration section
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*\[core\]\s*$'

  - id: git-config-fsmonitor-set
    desc: Git fsmonitor command assignment
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?m)^\s*fsmonitor\s*=\s*[^\r\n]{1,512}'
    not:
      - regex: '(?i)^\s*fsmonitor\s*=\s*["'']?(false|true|[01])["'']?\s*(#.*)?$'
      - regex: '(?i)^\s*fsmonitor\s*=\s*["'']?(yes|no|on|off)["'']?\s*(#.*)?$'

composite_rules:
  - id: git-config-fsmonitor-trigger
    desc: Git core.fsmonitor external command setting
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/revision-control/git/configure::git-config-core-section
      - id: micro-behaviors/revision-control/git/configure::git-config-fsmonitor-set
    near_lines: 8
