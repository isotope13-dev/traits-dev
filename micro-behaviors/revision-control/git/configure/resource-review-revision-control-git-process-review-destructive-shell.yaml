defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: git-hooks-disabled-command
    desc: Git command disables repository hooks
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\bconfig\s+core\.hooksPath\s+(/dev/null|NUL)\b'

