defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
traits:
  - id: git-log-last-commit-local-date-query
    desc: Queries last Git commit local date
    conf: 0.88
    if:
      type: text
      regex: 'git\s+log\s+-1\s+--date=format-local:'
  - id: git-log-last-commit-field-query
    desc: Queries last Git commit author or message
    conf: 0.88
    if:
      type: text
      regex: 'git\s+log\s+-1\s+--format=%{1,2}(cd|s|an|ae)'
  - id: git-current-branch-query
    desc: Queries current Git branch
    conf: 0.8
    if:
      type: text
      regex: 'git\s+rev-parse\s+--abbrev-ref\s+HEAD'
  - id: git-local-author-rewrite
    desc: Configures local Git author identity
    conf: 0.9
    if:
      type: text
      regex: 'git\s+config\s+--local\s+(--replace-all\s+)?user\.(name|email)'
  - id: git-amend-no-verify
    desc: Amends Git commit while bypassing hooks
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'git\s+commit\s+--amend.{0,120}--no-verify'
  - id: git-push-no-verify
    desc: Pushes Git branch while bypassing hooks
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # -u is valid without -f; the description must not imply force then.
      regex: 'git\s+(-c\s+\S+\s+){0,3}push\s+-u[f]?\s+origin.{0,120}--no-verify'
composite_rules:
  - id: git-log-last-commit-metadata
    desc: Queries last Git commit metadata
    conf: 0.88
    any:
      - id: git-log-last-commit-local-date-query
      - id: git-log-last-commit-field-query
