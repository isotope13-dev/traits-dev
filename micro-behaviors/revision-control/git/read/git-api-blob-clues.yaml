---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: gitapi-param
  desc: gitApi enabled parameter
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: gitApi=True
composite_rules:
- id: github-api-blob-fetch
  desc: gitApi parameter and 40-digit SHA field co-occur
  crit: component
  conf: 0.9
  all:
  - id: metadata/lang/encoding/hex::git-blob-sha
  - id: micro-behaviors/revision-control/git/read::gitapi-param
