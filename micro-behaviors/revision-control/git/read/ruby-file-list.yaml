# git-tracked file enumeration is a VCS operation, including in a gemspec.
# Relocated with identical matchers, platform/type scope and criticality.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 1.0
traits:
  - id: ruby-file-list-popen
    desc: Ruby file list uses git popen
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'spec\.(files|test_files)\s*=[\s\S]{0,160}IO\.popen\([^)]{0,80}git\s+ls-files'
  # Ruby gem recipes may assign the command output to an intermediate
  # files variable (including *_files_in_git) before assigning spec.files,
  # and may use git -C to anchor the source tree. Cover those forms as well as direct spec.files assignment.
  - id: ruby-file-list-backtick
    desc: Ruby file list uses git shell output
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)files\w*\s*\+?=.{0,160}(`|%x[({\[|!])\s*git(\s+-[^\n`]{1,80})?\s+ls-files'
  # `git_cmd = %(git -C "..." ls-files ...)` then `` `#{git_cmd}` ``. The
  # command is still git ls-files; it is just bound before the backticks.
  - id: ruby-file-list-command-variable
    desc: Ruby binds git file-list command text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '=\s*%[(\[]\s*git(\s+-C[^)\]]{0,80})?\s+ls-files[\s\S]{0,240}`#\{'
composite_rules:
  - id: ruby-git-file-list
    desc: Ruby file list uses git-tracked paths
    crit: notable
    conf: 0.95
    any:
      - id: ruby-file-list-popen
      - id: ruby-file-list-backtick
      - id: ruby-file-list-command-variable
