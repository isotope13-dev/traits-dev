defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: micro-behaviors/revision-control/git/read::rust-shell-git-query-command
    desc: Rust text names a git query
    conf: 0.9
    if:
      type: text
      regex: '"git\s+(show|describe|rev-parse|log|tag|status)\s[^"]{0,120}"'
