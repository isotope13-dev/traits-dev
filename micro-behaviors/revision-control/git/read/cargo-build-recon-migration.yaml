defaults:
  for: [rust]
  platforms: [unix, windows]

traits:
  - id: micro-behaviors/revision-control/git/read::rust-build-git-log-author-email
    desc: Git log author email format string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '--pretty=format:{"commit":"%H","author":"%an","email":"%ae"'
  - id: micro-behaviors/revision-control/git/read::rust-build-git-diff-head
    desc: Rust argument list contains Git diff range
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: '&["diff", "HEAD^", "HEAD"]'
