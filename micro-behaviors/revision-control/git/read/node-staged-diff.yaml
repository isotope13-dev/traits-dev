defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-git-helper-staged-diff
    desc: Calls Git helper with staged-diff arguments
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ((call_expression
           function: (identifier) @callee
           arguments: (arguments
             . (_)
             . (array
                 . (string (string_fragment) @command)
                 . (string (string_fragment) @option))))
         (#eq? @callee "git") (#eq? @command "diff") (#eq? @option "--cached"))
