defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-git-pull-npm-install
    desc: Install-named script references Git pull and npm install
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/revision-control/git/transfer::git-pull-origin-command
      - id: micro-behaviors/os/package-manager/reference-install::npm-install-shell-boundary-text
    any:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
