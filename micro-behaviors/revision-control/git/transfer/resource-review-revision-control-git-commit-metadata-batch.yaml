defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
traits:
  - id: git-push-no-verify
    desc: Pushes Git branch while bypassing hooks
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # -u is valid without -f; the description must not imply force then.
      regex: 'git\s+(-c\s+\S+\s+){0,3}push\s+-u[f]?\s+origin.{0,120}--no-verify'
