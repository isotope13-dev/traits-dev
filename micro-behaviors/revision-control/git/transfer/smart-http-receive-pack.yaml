# Git smart HTTP transport path, shared by clients, servers, and mirrors.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable

traits:
  - id: git-smart-http-receive-pack
    desc: Git smart-HTTP receive-pack path
    conf: 0.94
    if:
      type: text
      regex: '(?i)/git-receive-pack\b'
