defaults:
  crit: notable
  platforms: [unix, windows]
  for: [shell]
  attack: T1059.004
traits:
  - id: shell-git-clone
    desc: Shell command invokes git clone
    conf: 0.85
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo\s+|env\s+|command\s+|exec\s+)?git\s+clone\b'
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
  - id: shell-git-pull
    desc: Pulls changes from a Git remote
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: git
      arg:
        kind: identifier
        name: pull
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
  - id: shell-git-push
    desc: Pushes commits to a Git remote
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: git
      arg:
        kind: identifier
        name: push
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
