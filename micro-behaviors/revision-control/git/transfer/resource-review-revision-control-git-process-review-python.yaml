defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.88
  attack: T1059.006
  mbc: C0017

traits:
  - id: python-repeated-repo-clone-calls
    desc: Python repeats repository clone calls
    crit: notable
    conf: 0.85
    count_min: 2
    if:
      id: micro-behaviors/revision-control/git/transfer::python-git-clone-call
  - id: python-git-clone-call
    desc: Python invokes Git repository clone API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(clone_from|clone_repository)$'

  - id: python-git-clone-url
    desc: Git clone with URL
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(clone|clone_from|clone_repo)$'
      arg:
        kind: string
        regex: "^(https?|git|ssh)://[^\"'\\s]+(github|gitlab|bitbucket)\\.[^\"'\\s]+|^git@[^:]+:"
    unless:
      - id: well-known/app/infrastructure/pulumi::pulumi-python-provider-generated
      - id: well-known/app/infrastructure/openshift::cd-jobs-context
      - type: path
        regex: 'sandbox_namespaces\.py$'
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component

  - id: python-subprocess-git-pull
    desc: Python subprocess performs git pull
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'subprocess\.run\([\s\S]{0,120}[''\"]git[''\"][\s\S]{0,80}[''\"]pull[''\"]'

  - id: python-subprocess-git-clone
    desc: Python subprocess invokes git clone
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'subprocess\.run\(\s*\[\s*[''\"]git[''\"]\s*,\s*[''\"]clone[''\"]'

  - id: git-push-argv-token
    desc: Git push argv token
    crit: component
    if:
      type: text
      regex: '[''\"]git[''\"]\s*,\s*[''\"]push[''\"]'

  - id: git-fetch-origin-argv-token
    desc: Git fetch origin argv token
    ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
    crit: notable
    if:
      type: text
      substr: '"fetch", "--no-tags"'

composite_rules:
  - id: subprocess-git-push-argv
    desc: Python subprocess pushes to a Git remote
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/revision-control/git/transfer::git-push-argv-token
    any:
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/create/subprocess::check-call-ast
      - id: micro-behaviors/process/create/subprocess::popen-ast

  - id: subprocess-git-clone-argv
    desc: Python subprocess invokes git clone
    crit: notable
    conf: 0.9
    ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
    all:
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: metadata/lang/source/literal/string::git-clone-argv-token
      - id: micro-behaviors/revision-control/git/configure::git-no-tags-argv-token

  - id: subprocess-git-noninteractive-clone
    desc: Python subprocess runs git clone with credential prompts disabled
    crit: notable
    conf: 0.88
    ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
    all:
      - id: micro-behaviors/revision-control/git/transfer::subprocess-git-clone-argv
      - id: micro-behaviors/os/env/reference::git-terminal-prompt-disabled-env-token
      - id: micro-behaviors/os/env/reference::git-askpass-disabled-env-token

  - id: subprocess-git-fetch-origin-argv
    desc: Python subprocess fetches from git origin
    crit: notable
    conf: 0.86
    ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
    all:
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/revision-control/git/transfer::git-fetch-origin-argv-token

  - id: subprocess-git-fetch-reset-workflow
    desc: Python subprocess fetches and hard-resets git checkout
    crit: notable
    conf: 0.9
    ref: sha256:a8c0aa360bf7853ba5982fec675d5064e19729bf73094a3a54da5447e4919358
    all:
      - id: micro-behaviors/revision-control/git/transfer::subprocess-git-fetch-origin-argv
      - id: micro-behaviors/revision-control/git/write::subprocess-git-reset-hard-argv

