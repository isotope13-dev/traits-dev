defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  # The call facts expose the argv as an array, not its ordered members.
  # A text/fact proximity join could confuse a quoted clone example with an
  # actual git show invocation. Require clone as the first array element.
  - id: node-git-clone-argv
    desc: Node child process invokes git clone
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (member_expression property: (property_identifier) @api)
            (identifier) @api
          ]
          arguments: (arguments
            . (string (string_fragment) @git)
            . (array . (string (string_fragment) @verb)))
          (#match? @api "^(execFile(Sync)?|spawn(Sync)?)$")
          (#match? @git "^git(\\.exe)?$")
          (#eq? @verb "clone"))
