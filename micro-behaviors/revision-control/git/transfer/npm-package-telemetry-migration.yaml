defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: npm-postpublish-git-tag-push
    for:
      - npm
      - tar
      - package.json
      - javascript
    desc: npm publish helper creates and pushes git tags
    crit: notable
    conf: 0.88
    all:
      - id: metadata/package/scripts/build::npm-publish-hooks
      - id: micro-behaviors/revision-control/git/transfer::git-tag-and-push
    unless:
      - id: micro-behaviors/data/llm/agent::command-gate-classification-context
