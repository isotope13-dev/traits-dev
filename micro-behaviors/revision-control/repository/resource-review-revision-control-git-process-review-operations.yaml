defaults:
  platforms: [unix, windows]
  for: [shell, python, ruby, javascript]
  size_min: 512
  size_max: 500000000
  crit: notable
traits:
- id: git-shell-command-call
  desc: Executes a Git transfer or commit command
  if:
    type: symbol
    kind: call
    regex: '(^|\.)(exec(Sync)?|system)$'
    arg:
      kind: string
      regex: '\bgit (clone|pull|push|commit)\b'
  # Reading the configured remote URL identifies the repository (and, inside a
  # company, the internal host serving it). That is a clear, investigable read
  # rather than a universal one -- ordinary programs do not run it -- so it is
  # notable, not baseline. The file's 512-byte floor is meant for the noisier
  # generic git-verb atoms above; install hooks that grab the remote URL are
  # routinely shorter than that, so it is lifted here.
- id: jake-git-command-array
  desc: Jake executes a Git command array
  for: [javascript]
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression
          object: (identifier) @receiver
          property: (property_identifier) @method)
        arguments: (arguments
          (array (string (string_fragment) @command)))) @call
        (#eq? @receiver "jake")
        (#eq? @method "exec")
        (#match? @command "\\bgit (clone|pull|push|commit)\\b"))
composite_rules:
- id: git-operations-1
  desc: Executes a Git transfer or commit command
  any:
  - id: micro-behaviors/revision-control/repository::git-shell-command-call
  - id: micro-behaviors/revision-control/repository::jake-git-command-array
