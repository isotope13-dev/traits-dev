defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-git-config-remote-harvest
    desc: Git config and remote harvest
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'git config --list[\s\S]{0,260}git remote -v'
    unless:
      # Coding-agent Bash allowlists enumerate permitted git subcommands as
      # separate `Bash(git … *)` strings; the harvest regex spans both entries.
      - type: text
        regex: 'Bash\(git config --list \*\)'
