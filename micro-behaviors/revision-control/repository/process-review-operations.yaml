defaults:
  platforms: [unix, windows]
  for: [shell, python, ruby, javascript]
  size_min: 512
  size_max: 500000000
traits:
  - id: repository-branch-update-call
    desc: Updates repository branches programmatically
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, shell]
    size_min: 1
    if:
      type: symbol
      kind: call
      regex: '(?i)update[A-Za-z0-9_]*branches?'
  - id: repository-object-update-call
    desc: Updates repository objects programmatically
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, shell]
    size_min: 1
    if:
      type: symbol
      kind: call
      regex: '(?i)update[A-Za-z0-9_]*repositories?'
composite_rules:
  - id: github-issue-maintenance
    desc: GitHub issue maintenance script
    crit: notable
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/services/github/collaboration::gh-repository-workflow-command
    any:
      - id: micro-behaviors/data/parse/json::jq-processing
      - id: micro-behaviors/data/string/transform::sed-processing
      - id: micro-behaviors/data/string/transform::awk-processing
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
