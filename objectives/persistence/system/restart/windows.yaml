defaults:
  platforms: [windows]
  for: [pe, dll, source]
  attack: T1547
  mbc: F0004

composite_rules:
  - id: shutdown-hijack-restart-persistence
    desc: Shutdown hijack restart persistence chain
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/event/shutdown::application-restart-registration
    any:
      - id: micro-behaviors/os/event/shutdown::abort-system-shutdown-w
      - id: micro-behaviors/os/event/shutdown::ewx-restartapps-flag
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context

  # Layered recovery is a persistence-like behavior: one component recreates
  # the payload while a second component recreates the loader.  It is only
  # hostile when paired with a loader or payload technique.
  - id: dual-layer-loader-recovery
    desc: Independent payload and loader watchdogs restore malicious execution
    crit: hostile
    conf: 0.98
    for: [pe, dll, c, cpp, csharp, go, rust, python, powershell, batch]
    all:
      - id: micro-behaviors/process/lifecycle/supervise::windows-process-exit-supervision
      - id: micro-behaviors/process/lifecycle/supervise::windows-process-watchdog-loop
    any:
      - id: objectives/evasion/process/injection/thread-hijacking::source-thread-context-hijack
      - id: objectives/evasion/fileless/memory::registry-resident-shellcode-loader
    unless:
      - id: well-known/tool/reverse-engineering/

  - id: user-writable-loader-watchdog
    desc: Watchdog relaunches a loader from a user-writable path
    crit: suspicious
    conf: 0.95
    attack: T1053.005,T1036
    for: [pe, dll, c, cpp, csharp, go, rust, python, powershell, batch]
    all:
      - id: micro-behaviors/process/lifecycle/supervise::windows-process-watchdog-loop
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking::source-user-writable-executable-path
    unless:
      - id: well-known/tool/reverse-engineering/

  - id: scheduled-loader-watchdog
    desc: Scheduled task reinforces a loader watchdog
    crit: suspicious
    conf: 0.95
    attack: T1053.005,T1036
    for: [pe, dll, c, cpp, csharp, go, rust, python, powershell, batch]
    all:
      - id: user-writable-loader-watchdog
    any:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
    unless:
      - id: well-known/tool/reverse-engineering/
