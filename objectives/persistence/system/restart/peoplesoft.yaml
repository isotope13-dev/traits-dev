# Hub initialization reads every environment metadata file through XMLDecoder.
# A process-launch bean staged at that exact application surface reactivates
# under the service account. A metadata path or XMLDecoder alone is insufficient.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  attack: T1505

traits:
  - id: python-peoplesoft-environment-process-xml-write
    desc: Writes process XML to PeopleSoft startup
    crit: suspicious
    conf: 0.99
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)write_text$'
      receiver:
        from:
          call: '(^|\.)Path$'
          argument: 0
          literal: 'envmetadata[/\\]data[/\\]environment[/\\][^\r\n]{1,160}\.xml$'
      arg:
        index: 0
        from:
          value: '(?s)java\.lang\.ProcessBuilder.{0,1600}<void\s+method\s*=\s*["'']start["'']'

  - id: node-peoplesoft-environment-process-xml-write
    desc: Writes process XML to PeopleSoft startup
    crit: suspicious
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writeFileSync$'
      args:
        - index: 0
          from:
            value: 'envmetadata[/\\]data[/\\]environment[/\\][^\r\n]{1,160}\.xml$'
        - index: 1
          from:
            value: '(?s)java\.lang\.ProcessBuilder.{0,1600}<void\s+method\s*=\s*["'']start["'']'

composite_rules:
  - id: peoplesoft-environment-xml-process-persistence
    desc: Process XML staged in PeopleSoft startup
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/webapp::peoplesoft-environment-xml-path
      - id: objectives/execution/exploit/deserialization::xmldecoder-process-launch
    any:
      - id: python-peoplesoft-environment-process-xml-write
      - id: node-peoplesoft-environment-process-xml-write
    near_bytes: 4096
