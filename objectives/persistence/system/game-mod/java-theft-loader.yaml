defaults:
  platforms: [windows, unix]
  for: [class]
composite_rules:
  - id: minecraft-theft-loader-profile-propagation
    desc: Theft loader copies into multiple Minecraft mod profiles
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/game::minecraft-multiple-launcher-profile-roots
      - id: objectives/execution/payload/module-load::reflective-full-theft-entrypoint
    any:
      - type: yara
        source: |
          rule minecraft_theft_loader_profile_copy {
            strings:
              $source = "getCodeSource" ascii
              $location = "getLocation" ascii
              $input = "java/io/FileInputStream" ascii
              $output = "java/io/FileOutputStream" ascii
              $walk = "listFiles" ascii
              $mods = "mods" ascii
              $read = "read" ascii
              $write = "write" ascii
            condition:
              uint32be(0) == 0xcafebabe and all of them
          }
