defaults:
  platforms: [windows, unix]
  for: [class]
composite_rules:
  - id: minecraft-theft-loader-profile-propagation
    desc: Theft loader copies into multiple Minecraft mod profiles
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/game::minecraft-multiple-launcher-profile-roots
      - id: objectives/execution/payload/module-load::reflective-full-theft-entrypoint
      - id: metadata/import/jvm::protection-domain-code-source-reference
      - id: metadata/import/jvm::jvm-fileoutputstream-bytecode
      - id: micro-behaviors/fs/read/file/handle::java-fileinputstream-class
