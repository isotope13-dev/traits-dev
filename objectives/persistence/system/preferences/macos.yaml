# Preference-backed payload persistence on macOS.
#
# The technique is not tied to a fixed preference domain or key: a loader can
# generate both per host.  The useful discriminator is a value read from the
# defaults database, decoded, and immediately handed to a shell/interpreter.
defaults:
  platforms: [macos]
  for: [scripts, binaries]
  attack: T1547

traits:
  - id: defaults-write-variable-preference
    desc: Defaults writes variable-backed preference value
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bdefaults\s+write\b[^\n]{0,80}["'']?\$[A-Za-z_]\w*'

composite_rules:
  - id: defaults-read-base64-shell
    desc: Defaults value decoded into shell
    crit: suspicious
    conf: 0.96
    attack: T1140,T1059.004
    near_bytes: 320
    all:
      - id: micro-behaviors/fs/config/preferences::defaults-read-command
      - id: micro-behaviors/data/decode/base64::base64-decode-piped-shell

  - id: defaults-payload-reinfection
    desc: Preference-backed decoded payload execution
    crit: hostile
    conf: 0.98
    attack: T1547,T1140,T1059.004
    near_bytes: 900
    all:
      - id: micro-behaviors/fs/config/preferences::defaults-write-command
      - id: defaults-write-variable-preference
      - id: defaults-read-base64-shell
      - id: micro-behaviors/data/decode/base64::base64-decode-shell
