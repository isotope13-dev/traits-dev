# Inference-endpoint pinning through managed preference/policy stores.
#
# Sibling macos.yaml covers payloads staged in the defaults database and
# decoded into a shell. This file covers the other abuse of the same
# stores: pinning a lookalike third-party inference endpoint and its API
# key where the user cannot easily remove it — the Windows Group Policy
# registry hive (which overrides user and application settings and
# survives reinstalls) and the macOS managed-preferences domain. An
# enterprise tool pinning its own vendor's policy keys, or the official
# provider endpoint, matches the surface atoms but never the lookalike
# origin leg, so neither fires here.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1112,T1547

composite_rules:
  - id: policy-pinned-lookalike-inference-gateway
    desc: Policy-pinned lookalike inference gateway with API key
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/data/config/write::inference-gateway-base-url-assignment
      - id: micro-behaviors/data/config/write::inference-gateway-api-key-assignment
      - id: micro-behaviors/communications/http/llm::anthropic-branded-off-vendor-origin-literal
    any:
      - id: micro-behaviors/os/registry/keys/policy::software-policies-key-path
      - id: micro-behaviors/fs/config/preferences::defaults-write-array-argument
