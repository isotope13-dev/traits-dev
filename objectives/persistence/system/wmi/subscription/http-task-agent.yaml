defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
composite_rules:
  - id: http-task-agent-wmi-command-subscription
    desc: HTTP shell-task implant with WMI command subscription
    crit: hostile
    conf: 0.98
    attack: T1546.003
    all:
      - id: objectives/command-and-control/remote-command/tasking::http-file-inbox-shell-tasking
      - id: micro-behaviors/os/wmi/query::native-commandline-consumer-class
      - id: micro-behaviors/os/wmi/query::native-filter-consumer-binding-class
      - id: micro-behaviors/os/wmi/query::native-command-line-template-property
