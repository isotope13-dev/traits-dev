# WMI Event Subscription Persistence (PowerShell)
# Mirrors go.yaml's composite for PowerShell / batch delivery vectors.
# ATT&CK: T1546.003 (Event Triggered Execution: WMI Event Subscription)
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1546.003
  mbc: F0012
composite_rules:
  - id: ps-wmi-command-line-event-subscription
    desc: PowerShell configures WMI command-line event subscription
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/wmi/event::subscription-namespace
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-eventfilter
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-filter-binding
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-commandline-consumer

  - id: ps-wmi-event-subscription-install
    desc: WMI subscription beside concealed profile persistence
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-eventfilter
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-filter-binding
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-commandline-consumer
      - id: objectives/persistence/login/shell/config::powershell-compressed-profile-persistence

  - id: wmic-hidden-remote-script-subscription
    desc: WMIC subscription with a hidden remote script stage
    crit: hostile
    conf: 0.98
    for: [powershell, batch]
    near_lines: 30
    all:
      - id: micro-behaviors/os/wmi/event::wmic-instance-create
      - id: micro-behaviors/os/wmi/event::subscription-namespace
      - id: micro-behaviors/os/wmi/event::commandline-consumer-class-name
      - id: micro-behaviors/os/wmi/event::filter-consumer-binding-class-name
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-web-response-piped-eval-text
