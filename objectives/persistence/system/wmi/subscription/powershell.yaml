# WMI Event Subscription Persistence (PowerShell)
# Mirrors go.yaml's composite for PowerShell / batch delivery vectors.
# ATT&CK: T1546.003 (Event Triggered Execution: WMI Event Subscription)
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1546.003
  mbc: F0012
composite_rules:
  - id: ps-wmi-event-subscription-install
    desc: WMI subscription beside concealed profile persistence
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-eventfilter
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-filter-binding
      - id: micro-behaviors/os/wmi/event::set-wmiinstance-commandline-consumer
      - id: objectives/persistence/login/shell/config::powershell-compressed-profile-persistence
