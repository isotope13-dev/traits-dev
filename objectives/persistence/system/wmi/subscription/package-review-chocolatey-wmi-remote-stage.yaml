defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002
composite_rules:
  - id: chocolatey-wmi-remote-stage
    desc: Chocolatey hook creates WMI remote-stage subscription
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, '!objectivec', batch, class, javascript, lua, nupkg, pe, perl, php, powershell, python, ruby, vbs]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/os/wmi/event::subscription-namespace
      - id: micro-behaviors/os/wmi/event::commandline-consumer-class-name
      - id: micro-behaviors/os/wmi/event::filter-consumer-binding-class-name
      - id: objectives/execution/payload/script-eval/network/response-body::powershell-web-response-piped-eval-text

    any:
      - id: micro-behaviors/os/wmi/event::wmi-instance-write-api
      - id: micro-behaviors/os/wmi/event::wmic-instance-create
