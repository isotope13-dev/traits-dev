defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1546.003,T1547.001,T1070

composite_rules:
  - id: native-wmi-subscription-with-run-and-history
    desc: WMI subscription with Run key and UserAssist access
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/wmi/event::native-event-filter-class
      - id: micro-behaviors/os/wmi/event::native-filter-consumer-binding-class
      - id: micro-behaviors/os/wmi/event::native-commandline-consumer-class
      - id: micro-behaviors/os/wmi/event::native-command-line-template-property
      - id: micro-behaviors/os/registry/autostart/reference::utf16-currentversion-run-key
      - id: micro-behaviors/os/registry/explorer/reference::explorer-userassist-history-path
