defaults:
  platforms: [windows]
  for: [text, vbs]
  attack: T1546.003,T1136.001

traits:
  - id: mof-timed-consumer-local-account-change
    desc: WMI subscription runs local account command
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule mof_timed_consumer_local_account_change {
          strings:
            $filter = "__EventFilter" nocase
            $time = "Win32_LocalTime" nocase
            $consumer = "ActiveScriptEventConsumer" nocase
            $binding = "__FilterToConsumerBinding" nocase
            $shell = "WScript.Shell" nocase
            $account = /net(\.exe)?\s+(user\s+[^"\r\n]{1,100}|localgroup\s+administrators\s+[^"\r\n]{1,80})\/add/ nocase
          condition:
            all of them
        }
