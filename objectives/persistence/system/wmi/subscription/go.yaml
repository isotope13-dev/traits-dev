defaults:
  mbc: F0012
  attack: T1546.003
  platforms:
    - windows
traits:
  - id: wmi-eventfilter-create
    desc: Creates WMI EventFilter trigger
    crit: suspicious
    conf: 0.9
    for:
      - go
      - powershell
      - vbs
    if:
      type: string_literal
      regex: EventFilter.{0,20}CREATE|CREATE.{0,20}EventFilter
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
        - id: metadata/binary/vendor::microsoft-corp-marker-rdata
        - id: metadata/signed/platform/
  - id: wmic-namespace-create
    desc: Creates WMI namespace via wmic
    crit: suspicious
    conf: 0.85
    for:
      - go
      - powershell
      - vbs
      - batch
    if:
      type: string_literal
      regex: wmic.{0,30}/NAMESPACE.{0,30}CREATE
  - id: wmic-process-create
    desc: Spawns process via wmic call create
    crit: suspicious
    conf: 0.85
    for:
      - go
      - powershell
      - vbs
      - batch
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: string_literal
      regex: wmic.{0,30}process.{0,20}call.{0,20}create
composite_rules:
  - id: wmic-create
    desc: wmic CREATE commands
    crit: suspicious
    conf: 0.85
    for:
      - go
      - powershell
      - vbs
      - batch
    any:
      - id: wmic-namespace-create
      - id: wmic-process-create
  - id: wmi-persistence
    desc: WMI event subscription persistence
    crit: hostile
    conf: 0.95
    for:
      - go
      - powershell
      - vbs
    all:
      - id: micro-behaviors/os/wmi/query::event-filter-class-name
      - id: micro-behaviors/os/wmi/query::filter-consumer-binding-class-name
    any:
      - id: micro-behaviors/os/wmi/query::commandline-consumer-class-name
      - id: micro-behaviors/os/wmi/query::activescript-consumer-class-name
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
        - id: metadata/binary/vendor::microsoft-corp-marker-rdata
        - id: metadata/signed/platform/
  - id: wmi-command-persistence
    desc: WMI persistence with command execution
    crit: hostile
    conf: 0.95
    for:
      - go
      - powershell
      - vbs
    all:
      - id: micro-behaviors/os/wmi/query::subscription-namespace
      - id: micro-behaviors/os/wmi/query::commandline-consumer-class-name
    any:
      - id: micro-behaviors/os/wmi/query::event-filter-class-name
      - id: micro-behaviors/os/wmi/query::instance-modification-event-class-name
      - id: micro-behaviors/os/wmi/query::process-start-trace-class-name
      - id: micro-behaviors/os/wmi/query::interval-timer-instruction-class-name
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
        - id: metadata/binary/vendor::microsoft-corp-marker-rdata
        - id: metadata/signed/platform/
