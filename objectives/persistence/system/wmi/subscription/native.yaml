# Native PE artifacts can embed WMI permanent-subscription class names as
# strings in managed .text as well as in native read-only data sections.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.97
  attack: T1546.003
  mbc: F0012

composite_rules:
  - id: native-wmi-command-subscription-persistence
    desc: Native PE configures a WMI command-line event subscription
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/wmi/query::native-event-filter-class
      - id: micro-behaviors/os/wmi/query::native-filter-consumer-binding-class
      - id: micro-behaviors/os/wmi/query::native-commandline-consumer-class
      - id: micro-behaviors/os/wmi/query::native-command-line-template-property
      - id: micro-behaviors/os/wmi/query::native-subscription-namespace
      - id: micro-behaviors/os/wmi/query::native-wmi-command-consumer-sequence
