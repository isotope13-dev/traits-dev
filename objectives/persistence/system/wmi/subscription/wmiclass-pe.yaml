defaults:
  platforms: [windows]
  for: [pe]
  attack: T1546.003
  mbc: F0012
traits:
  - id: wmiclass-eventfilter-instance
    desc: wmiclass text creates WMI __EventFilter
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\[wmiclass\]\s*.root\\subscription:__EventFilter'
  - id: wmiclass-commandline-consumer-instance
    desc: wmiclass text creates CommandLine consumer
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\[wmiclass\]\s*.root\\subscription:CommandLineEventConsumer'
  - id: wmiclass-filter-binding-instance
    desc: wmiclass text creates WMI filter binding
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\[wmiclass\]\s*.root\\subscription:__FilterToConsumerBinding'
composite_rules:
  - id: pe-wmiclass-event-subscription-install
    desc: Embedded PowerShell installs WMI event-subscription persistence
    crit: hostile
    conf: 0.96
    all:
      - id: wmiclass-eventfilter-instance
      - id: wmiclass-commandline-consumer-instance
      - id: wmiclass-filter-binding-instance
