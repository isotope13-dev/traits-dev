# An HTA that never exits (a decoy window stays open) and, on a timer, asks
# WMI whether its agent process is alive, then downloads and relaunches it
# hidden if not. The survival logic lives in the page itself instead of a
# service or Run key, so nothing is registered for a defender to find.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1059.007,T1105,T1564.003
composite_rules:
  - id: hta-timer-wmi-liveness-agent-redeploy
    desc: HTA timer checks WMI and re-downloads a hidden agent
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/time/schedule/callback::javascript-timer-call
      - id: micro-behaviors/os/wmi/query::win32-process-query
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: micro-behaviors/process/create/flags::wscript-shell-hidden-run
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
