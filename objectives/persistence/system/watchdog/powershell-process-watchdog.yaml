defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1546
composite_rules:
  - id: powershell-reflective-payload-watchdog-loop
    desc: Unconditional loop monitors process absence to re-invoke reflective assembly
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-process-query-empty-check
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
      - id: objectives/execution/payload/module-load/transformed::powershell-xor-reflective-invoke-cluster

