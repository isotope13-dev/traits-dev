defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1546
composite_rules:
  - id: powershell-reflective-payload-watchdog-loop
    desc: Unconditional loop monitors process absence to re-invoke reflective assembly
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-process-query-empty-check
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
      - id: objectives/execution/payload/module-load/transformed::powershell-xor-reflective-invoke-cluster

  - id: powershell-wmi-commandline-sweep-respawn
    desc: Kills command-line-matched PowerShell processes, respawns them hidden via WMI
    crit: hostile
    conf: 0.98
    attack: T1047,T1059.001,T1546,T1564.003
    all:
      - id: micro-behaviors/process/terminate/kill::wmi-commandline-filtered-process-kill
      - id: micro-behaviors/process/create/wmi::powershell-wmi-win32-process-create-any
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
