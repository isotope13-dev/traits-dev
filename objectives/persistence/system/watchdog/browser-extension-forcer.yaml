defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1546,T1176
traits:
  - id: extension-commandline-protection-disabled
    desc: Disables extension command-line protection
    crit: notable
    if:
      type: text
      substr: '--disable-features=DisableLoadExtensionCommandLineSwitch'
  - id: wmi-browser-creation-monitor
    desc: WMI query monitors browser process creation
    crit: notable
    if:
      type: text
      regex: '(?i)__InstanceCreationEvent[^\r\n]{0,180}\b(chrome|msedge)\.exe'
  - id: register-wmi-process-event
    desc: Registers a WMI event handler
    crit: notable
    if:
      type: text
      substr: Register-WmiEvent
composite_rules:
  - id: browser-restart-forced-extension
    desc: Restarts browser to force extension loading
    crit: hostile
    conf: 0.99
    all:
      - id: extension-commandline-protection-disabled
      - id: wmi-browser-creation-monitor
      - id: register-wmi-process-event
      - id: micro-behaviors/process/terminate/kill::stop-process-force
      - id: micro-behaviors/os/application/config::browser-load-extension-flag
