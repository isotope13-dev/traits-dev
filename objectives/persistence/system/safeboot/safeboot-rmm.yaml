defaults:
  platforms: [windows]
  for: [pe, dll, scripts, source, data, text, msi, oledoc]
  attack: "T1543.003"

traits:
  # Explicit AnyDesk allow-list under SafeBoot\Network (Akira Safe Mode case).
  - id: safeboot-network-anydesk-key
    desc: AnyDesk registered under SafeBoot Network
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)SafeBoot[\\/]+Network[\\/]+AnyDesk\b'

  - id: rmm-service-config-file
    desc: RMM service config file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(serviceconfig\.xml|simplegateway\.service)'

composite_rules:
  - id: rmm-safeboot-service-persistence
    desc: RMM service registered to start in Safe Mode
    # Remote-support products legitimately expose this for recovery sessions,
    # so the behavior is high-risk operational context rather than proof of an
    # attack. Campaign-specific corroboration below can still make it hostile.
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/kernel/boot::safeboot-service-subkey-reference
    any:
      - id: micro-behaviors/os/service/name::remote-access-service-name
      - id: rmm-service-config-file
      - id: safeboot-network-anydesk-key
      # The incident used AnyDesk rather than a custom service name. Keep the
      # RMM identity directory here so the same SafeBoot abuse generalizes to
      # other remote-support agents already covered by that directory.
      - id: well-known/dual-use/remote-admin/rmm/
  - id: campaign-screenconnect-safeboot-service-persistence
    for: [pe]
    desc: Campaign-signed ScreenConnect runner installs a SafeBoot-capable Windows service
    crit: hostile
    conf: 0.99
    all:
      - id: "micro-behaviors/os/kernel/boot::safeboot-network-base-regpath"
      - id: micro-behaviors/os/service/control::service-admin-import-cluster
      - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-dotnet-service-runner-pdb
      - id: objectives/evasion/masquerade/cert::stephen-whang-cpa-authenticode-subject

  - id: screenconnect-safeboot-service-persistence
    desc: ScreenConnect installer configures Safe Mode persistence
    crit: suspicious
    conf: 0.98
    attack: T1543.003,T1219
    for: [msi, oledoc, pe, dll, text]
    scope: outer
    all:
      - id: micro-behaviors/os/kernel/boot::safeboot-service-subkey-reference
      - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-family
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer

  - id: revoked-signer-screenconnect-safeboot-persistence
    desc: Revoked-certificate ScreenConnect SafeBoot persistence
    crit: suspicious
    conf: 0.99
    attack: T1543.003,T1219
    for: [pe]
    scope: outer
    all:
      - id: micro-behaviors/os/kernel/boot::safeboot-service-subkey-reference
      - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-family
      - id: metadata/signature/certificate/security::connectwise-legacy-code-signing-cert-revoked

  - id: malware-relay-screenconnect-safeboot-service
    desc: ScreenConnect SafeBoot service targets reported malware relay
    crit: hostile
    conf: 0.99
    attack: T1543.003,T1219,T1071.001
    for: [msi, oledoc]
    scope: outer
    all:
      - id: micro-behaviors/os/kernel/boot::safeboot-service-subkey-reference
      - id: well-known/dual-use/remote-admin/screenconnect/client::screenconnect-family
      - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-service-persistence
      - id: objectives/command-and-control/infrastructure/domain/known::adminrolling-live-screenconnect-relay

  - id: screenconnect-covert-relay-safeboot-persistence
    desc: ScreenConnect MSI persists in Safe Mode for concealed external-relay access
    crit: hostile
    conf: 0.99
    attack: T1543.003,T1219,T1071.001,T1564
    for: [msi, oledoc, pe, dll, xml, cab]
    scope: outer
    all:
      - id: micro-behaviors/os/kernel/boot::safeboot-service-subkey-reference
      - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-service-persistence
      - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-nonvendor-domain-relay
      - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-unattended-access-launch-parameter

  # Pre-ransomware Safe Mode staging: registers a service under SafeBoot while
  # provisioning a backdoor local administrator account.
  - id: safeboot-service-with-account-provisioning
    desc: SafeBoot service registration paired with privileged local account creation
    crit: hostile
    conf: 0.98
    attack: T1543.003,T1136.001,T1098
    for: [binaries, scripts, source]
    all:
      - id: micro-behaviors/os/kernel/boot::safeboot-service-subkey-reference
      - id: micro-behaviors/os/user/create::privileged-local-account-setup
    any:
      - id: micro-behaviors/os/service/register::reg-exe-safeboot-service-registration
      - id: rmm-safeboot-service-persistence
      - id: micro-behaviors/os/registry/
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/

  # Unsigned wrapper or script smuggling an RMM service into SafeBoot via reg.exe.
  - id: unsigned-cli-rmm-safeboot-smuggling
    desc: Unsigned tool smuggles an RMM service into Safe Mode via reg.exe
    crit: hostile
    conf: 0.97
    attack: T1543.003,T1112,T1562.001
    for: [pe, dll, scripts, source]
    all:
      - id: rmm-safeboot-service-persistence
      - id: micro-behaviors/os/service/register::reg-exe-safeboot-service-registration
    any:
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/os/user/create::privileged-local-account-setup
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/
