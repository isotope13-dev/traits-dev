# Post-operation hook names shared by language-specific installers. A hook
# name alone is incomplete evidence; JavaScript and shell composites combine
# these fragments with concrete writes and automatic background execution.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell]
  attack: T1546

traits:
  - id: post-checkout-hook-ref
    desc: References post-checkout hook name
    crit: notable
    conf: 0.78
    if:
      type: text
      substr: post-checkout

  - id: post-merge-hook-ref
    desc: References post-merge hook name
    crit: notable
    conf: 0.78
    if:
      type: text
      substr: post-merge
