# Git hooks that relaunch a detached process after developer Git operations.
#
# Installing Git hooks is normal developer-tool behavior. Appending the same
# output-suppressed background launcher to both post-merge and post-checkout,
# however, makes routine pulls and branch switches persistent execution
# triggers. The payload name and implementation language are deliberately not
# part of the rule.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1546

composite_rules:
  - id: post-operation-hook-background-persistence
    desc: Appends a detached launcher to post-merge and post-checkout hooks
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/execution/trigger/repository::git-hook-path-reference
      - id: objectives/persistence/system/git-hooks::post-merge-hook-ref
      - id: objectives/persistence/system/git-hooks::post-checkout-hook-ref
      - id: micro-behaviors/fs/file/write/redirect::shell-file-write-command
      - id: micro-behaviors/process/create/background::detached-background-command
