# Git hooks that relaunch a detached process after developer Git operations.
#
# Installing Git hooks is normal developer-tool behavior. Appending the same
# output-suppressed background launcher to both post-merge and post-checkout,
# however, makes routine pulls and branch switches persistent execution
# triggers. The payload name and implementation language are deliberately not
# part of the rule.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1546

traits:
  # `git config core.hooksPath` without --global is how husky and other
  # per-repo tools point at .husky. --global redirects every repository on
  # the account, which is the persistence install, not a project setting.
  - id: git-config-global-hookspath
    desc: Sets global Git core.hooksPath
    crit: notable
    conf: 0.92
    for: [scripts]
    if:
      type: text
      regex: '\bgit\s+config\s+--global\b[^\n]{0,48}\bcore\.hooksPath\b'

composite_rules:
  # Pointing core.hooksPath at a directory that contains both a pre-commit
  # and a post-checkout hook makes ordinary commits and checkouts run
  # attacker code in every repository. Local husky configs do not use
  # --global and do not install that pair as account-wide hooks.
  - id: global-hookspath-commit-checkout
    desc: Global hooksPath installs commit and checkout hooks
    crit: suspicious
    conf: 0.94
    near_lines: 30
    all:
      - id: git-config-global-hookspath
      - id: pre-commit-hook-path
      - id: post-checkout-hook-ref
  - id: post-operation-hook-background-persistence
    desc: Appends a detached launcher to post-merge and post-checkout hooks
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/execution/trigger/repository::git-hook-path-reference
      - id: objectives/persistence/system/git-hooks::post-merge-hook-ref
      - id: objectives/persistence/system/git-hooks::post-checkout-hook-ref
      - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
      - id: micro-behaviors/process/create/background::detached-background-command
