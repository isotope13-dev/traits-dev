# The hook path and body share one write operation. Variable spellings and
# clearing core.hooksPath are not required. This identifies patch and upload
# commands in the generated hook, not a proven patch-to-network data flow.
defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: postcommit-target-patch-upload-writer
    desc: Writes post-commit patch/upload script
    crit: suspicious
    conf: 0.98
    attack: T1546,T1041
    if:
      type: tree-sitter
      language: bash
      query: |
        ((_ (variable_assignment name: (variable_name) @assigned value: (_) @path)
          (redirected_statement
          body: (command name: (command_name (word) @tool))
          redirect: (file_redirect destination: [(string [(simple_expansion (variable_name) @used) (expansion (variable_name) @used)])
          (simple_expansion (variable_name) @used) (expansion (variable_name) @used)])
          redirect: (heredoc_redirect (heredoc_body) @payload)))
          (#eq? @assigned @used)
          (#eq? @tool "cat")
          (#match? @path "/post-commit[\"']?$")
          (#match? @payload "(?m)^[ \\t]*(\\w+[ \\t]+)?git[ \\t]+diff[ \\t]+(--unified|--patch|-p)\\b")
          (#match? @payload "(^|[=(;\\n])[ \\t]*curl[ \\t]")
          (#match? @payload "(--data(-binary)?|-d)[ \\t]+[\"']?@|(--upload-file|-T)[ \\t]+"))
        ((redirected_statement
          body: (command name: (command_name (word) @tool))
          redirect: (file_redirect destination: (_) @path)
          redirect: (heredoc_redirect (heredoc_body) @payload))
          (#eq? @tool "cat")
          (#match? @path "/post-commit[\"']?$")
          (#match? @payload "(?m)^[ \\t]*(\\w+[ \\t]+)?git[ \\t]+diff[ \\t]+(--unified|--patch|-p)\\b")
          (#match? @payload "(^|[=(;\\n])[ \\t]*curl[ \\t]")
          (#match? @payload "(--data(-binary)?|-d)[ \\t]+[\"']?@|(--upload-file|-T)[ \\t]+"))
