# Git hook installation via JavaScript
# Hooks execute automatically during repository operations, but installing a
# documented development hook is common and does not itself establish attack
# persistence. Separate payload/delivery composites perform that escalation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: pre-commit-hook-ref
    desc: References pre-commit hook name
    crit: component
    conf: 0.7
    attack: T1546
    if:
      type: text
      substr: pre-commit
  - id: pre-push-hook-ref
    desc: References pre-push hook name
    crit: component
    conf: 0.7
    attack: T1546
    if:
      type: text
      substr: pre-push
  - id: post-checkout-hook-ref
    desc: References post-checkout hook name
    crit: component
    conf: 0.78
    attack: T1546
    if:
      type: text
      substr: post-checkout
  - id: post-merge-hook-ref
    desc: References post-merge hook name
    crit: component
    conf: 0.78
    attack: T1546
    if:
      type: text
      substr: post-merge
  - id: hook-executable-write-mode
    desc: writeFileSync executable mode
    crit: component
    conf: 0.9
    attack: T1546
    if:
      type: text
      regex: 'writeFileSync\([^;\n]{0,180}mode\s*:\s*0o?755'
composite_rules:
  - id: git-hook-installer
    desc: Installs Git hooks for automatic execution
    # Hook installation is an execution-surface change, but is also normal
    # functionality for developer tooling. Payload or delivery evidence must
    # provide the suspicious/hostile escalation.
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/create/shell/git::git-rev-parse-dir
      - id: micro-behaviors/fs/path/config/git::git-hooks-path
      - id: micro-behaviors/fs/write/file/direct::write-file-sync
    unless:
      - id: micro-behaviors/process/interpreter/vm/
      - id: metadata/library/runtime::acquire-vscode-api
    any:
      - id: pre-commit-hook-ref
      - id: pre-push-hook-ref
  - id: direct-git-hook-installer
    desc: Directly writes a git hook
    # Installing a hook is a persistence-capable behavior, but legitimate
    # developer tools do this too. Escalation requires a separate execution or
    # delivery objective; this observable remains notable for triage.
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/config/git::git-hooks-path
      - id: micro-behaviors/fs/write/file/direct::write-file-sync
    any:
      - id: micro-behaviors/fs/chmod/modify::node-chmod
      - id: objectives/command-and-control/dropper/delivery/pipe::curl-pipe-node
      - id: hook-executable-write-mode
  - id: direct-executable-git-hook-installer
    desc: Writes executable git hook
    # Executable mode is required for ordinary Git hooks and does not, by
    # itself, distinguish persistence from documented developer tooling.
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/config/git::git-hooks-path
      - id: micro-behaviors/fs/write/file/direct::write-file-sync
      - id: hook-executable-write-mode
    any:
      - id: pre-commit-hook-ref
      - id: pre-push-hook-ref
      - id: post-checkout-hook-ref
  - id: git-hooks-directory-resolver
    desc: Resolves repository Git hooks directory
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/create/shell/git::git-rev-parse-dir
      - id: micro-behaviors/fs/path/config/git::git-hooks-path
    unless:
      - id: micro-behaviors/process/interpreter/vm/
      - id: metadata/library/runtime::acquire-vscode-api

  # Persistence that rides the victim's own development workflow: the hook
  # fires on every pull, merge and branch switch, and a `git clean` or a fresh
  # `npm ci` does not touch .git/hooks. Escalating past the notable installer
  # rules above needs the launcher shape -- a background process detached from
  # the Git command -- or evidence that hooks are being written into
  # repositories the tool went looking for rather than its own.
  - id: git-hook-detached-launcher-injection
    desc: Writes a Git hook that starts a background process
    crit: hostile
    conf: 0.95
    attack: T1546
    all:
      # The launcher shape itself is a neutral capability (a shell-executor
      # test suite writes the same string); it is the write into `.git/hooks`
      # below that makes it persistence.
      - id: micro-behaviors/process/create/background::detached-background-command
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
    any:
      - id: micro-behaviors/fs/path/config/git::git-hooks-path
      - id: micro-behaviors/fs/path/config/git::git-hooks-dir-join

  - id: checkout-merge-hook-persistence
    desc: Installs post-merge and post-checkout hooks
    crit: suspicious
    conf: 0.92
    attack: T1546
    all:
      - id: post-merge-hook-ref
      - id: post-checkout-hook-ref
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/path/config/git::git-hooks-dir-join
