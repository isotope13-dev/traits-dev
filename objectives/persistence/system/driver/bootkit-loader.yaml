defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1543.003
composite_rules:
  - id: kernel-service-loader-with-bios-bootkit
    desc: Kernel service loader carries BIOS-hook bootkit
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/kernel/driver::x86-demand-driver-service-calls
      - id: micro-behaviors/os/kernel/module::zwload-embedded-kernel-driver-profile
      - id: objectives/persistence/firmware/boot/record::embedded-bios-read-hook-bootkit
