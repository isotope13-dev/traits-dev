defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1543.003,T1014
  mbc: E1014

composite_rules:
  - id: importless-kernel-process-launcher
    desc: Unsigned importless PE resolves kernel thread and process APIs
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: objectives/anti-static/pack/detect::pe-wx-section
      - id: micro-behaviors/os/kernel/routines::ps-create-system-thread
      - id: micro-behaviors/os/kernel/routines::zw-create-user-process
