# Unsigned dropper that ships embedded native driver images and installs one
# as a kernel driver: ZwLoadDriver plus the full service create/configure/start
# chain and a service ImagePath value. Legitimate installers sign their code
# and rarely bundle multiple native-subsystem images with the native loader.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003,T1014
composite_rules:
  # Variant without three embedded images: an unsigned user-mode loader
  # that first enables token privileges, then creates and starts a
  # service while also naming the native ZwLoadDriver path. Signed
  # vendor installers and known admin tools are excluded; an unsigned
  # binary taking both the service and native routes to kernel code
  # execution is a driver dropper.
  - id: zwload-privileged-unsigned-service-driver-load
    desc: Unsigned privileged ZwLoadDriver service load
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/kernel/module::zwload-driver-api-reference
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
      - id: micro-behaviors/os/service/create::create-service-w-reference
      - id: micro-behaviors/os/service/start::start-service
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/tool/sysadmin/

  - id: zwload-embedded-driver-service-install
    desc: Unsigned ZwLoadDriver service driver install
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/kernel/module::zwload-embedded-kernel-driver-profile
      - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
      - id: micro-behaviors/os/service/host::service-imagepath-value-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
