# The loading half of the same pattern, without needing the target list: an
# unsigned program carrying a PE image in its data, creating a service whose
# ImagePath points at a driver path, loading it with ZwLoadDriver, and
# enabling debug-class privileges first. Legitimate driver installers ship
# the driver as a signed file beside a signed setup program.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003,T1014,T1134
composite_rules:
  - id: unsigned-embedded-pe-driver-service-privileged-loader
    desc: Unsigned loader with embedded PE, service and ZwLoadDriver
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/data/embedded/payload/header::dos-executable-header-in-data
      - id: micro-behaviors/os/service/host::service-imagepath-value-name
      - id: micro-behaviors/os/kernel/module::zwload-driver-api-reference
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
      - id: micro-behaviors/fs/path/system::windows-driver-image-path
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
