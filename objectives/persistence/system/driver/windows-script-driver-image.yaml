defaults:
  platforms:
  - windows
  for:
  - powershell
  - batch
  - csharp
  - go
  crit: suspicious
  conf: 0.92
  attack: T1543.003
traits:
- id: driver-image-in-programdata
  desc: Service driver image under ProgramData
  if:
    type: text
    regex: (?i)\bbinPath\s*=[^\r\n"]{0,100}[\\/%]ProgramData[\\/][^\r\n"]{0,80}\.sys\b
- id: driver-image-in-user-profile
  desc: Service driver image under a user profile
  if:
    type: text
    regex: (?i)\bbinPath\s*=[^\r\n"]{0,100}[\\/%](Users|AppData)[\\/][^\r\n"]{0,80}\.sys\b
- id: driver-image-in-temp-path
  desc: Service driver image under a temp directory
  if:
    type: text
    regex: (?i)\bbinPath\s*=[^\r\n"]{0,100}[\\/%](Temp|Public)[\\/][^\r\n"]{0,80}\.sys\b
composite_rules:
- id: driver-image-staged-outside-system-drivers
  desc: Driver image staged outside System32 drivers
  conf: 0.92
  any:
  - id: driver-image-in-programdata
  - id: driver-image-in-user-profile
  - id: driver-image-in-temp-path
- id: staged-kernel-driver-service-install
  desc: Kernel driver service uses a staged image
  conf: 0.95
  all:
  - id: driver-image-staged-outside-system-drivers
  - id: micro-behaviors/os/kernel/driver::sc-driver-service-create
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
