# An administrator-only user-mode loader that keeps several PE images inside
# its resources and carries the pieces for loading a kernel driver: the
# driver-load API, a service ImagePath value and device I/O control. The
# driver is the embedded image; the loader installs and talks to it. Cheat
# and rootkit loaders use this layout to run unsigned code in the kernel
# through a signed driver they ship.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003,T1014,T1027.009
composite_rules:
  - id: admin-loader-resource-pes-driver-install-ioctl
    desc: Admin loader with embedded PEs, driver install and IOCTL
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/resource/identity::dos-header-prefix-in-large-resource
      - id: micro-behaviors/os/kernel/module::load-driver-api-reference
      - id: micro-behaviors/os/service/host::service-imagepath-value-name
      - id: micro-behaviors/os/privilege/manifest::require-administrator
      - id: micro-behaviors/fs/file/handle::nt-device-io-control-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
