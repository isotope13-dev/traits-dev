# Login-independent reactivation through the Windows Task Scheduler: a
# minute-granularity task launches a copy of the payload staged under AppData,
# detached and windowless. Legitimate installers register durable tasks that
# point at their Program Files binaries; they do not stage hidden AppData
# copies for windowless relaunch — the conjunction has no legitimate use.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1053.005
composite_rules:
  - id: minute-task-launches-hidden-appdata-copy
    desc: Minute scheduled task launches hidden AppData copy
    crit: hostile
    conf: 0.98
    near_bytes: 6144
    all:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-minute-create-sequence
      - id: micro-behaviors/fs/path/app-data::javascript-appdata-directory-reference
      - id: micro-behaviors/fs/file/copy::js-copyfile-sync-call
      - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
