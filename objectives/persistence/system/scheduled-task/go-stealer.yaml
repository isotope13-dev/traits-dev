defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-credential-stealer-timed-task-profile
    desc: Go stealer with timed task-creation code
    crit: hostile
    conf: 0.97
    attack: T1053.005
    # Static co-occurrence profile; registration success is not asserted.
    # A module import or TimeTrigger type alone does not establish abuse.
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-login-query-with-keylogging
      - id: micro-behaviors/os/autorun/scheduled::go-taskmaster-create-task-reference
      - id: micro-behaviors/os/autorun/task-trigger::time-trigger-reference
      - id: metadata/import/package::go-taskmaster-module-reference
