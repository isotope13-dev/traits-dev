defaults:
  platforms: [windows, unix]
  attack: T1053.005

composite_rules:
  - id: source-ethereum-provider-scheduled-beacon
    desc: Ethereum provider with scheduled interpreter clues
    crit: suspicious
    conf: 0.96
    for: [source, '!objectivec', class, javascript, php, python, ruby]
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/cloudflare::ethereum-cloudflare-provider
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
    any:
      - id: micro-behaviors/process/argument/interpreter::powershell-command-options-text
      - id: micro-behaviors/process/create/exec::elixir-system-cmd
      - id: micro-behaviors/process/create/exec::ruby-spawn
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
      - id: micro-behaviors/process/create/exec::js-execfile-call

