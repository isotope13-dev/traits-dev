defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: compressed-profile-recurring-task-registration
    desc: Concealed profile with recurring task creation
    crit: hostile
    conf: 0.97
    attack: T1053.005
    all:
      - id: objectives/persistence/login/shell/config::powershell-compressed-profile-persistence
      - id: metadata/lang/source/syntax/command::powershell-recurring-task-create-literal
    any:
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-daily-trigger-option
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-idle-trigger-option
