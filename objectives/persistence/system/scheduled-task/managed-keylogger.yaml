defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Recurring activation is independent of the logon task. Required recording
  # supplies attack admission; scheduling/launch references alone are neutral.
  # This is a file-scoped code profile, not proof of task creation succeeding.
  - id: managed-keylogger-recurring-task-profile
    desc: Managed keylogger with recurring-task and self-path references
    crit: hostile
    conf: 0.96
    attack: T1053.005
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/autorun/scheduled::windows-schtasks-create
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-or-hourly-option
      - id: micro-behaviors/process/info/selfpath::managed-self-path-references
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
