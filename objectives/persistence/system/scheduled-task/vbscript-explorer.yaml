composite_rules:
- platforms:
  - windows
  for:
  - vbs
  - html
  - scripts
  - mp3
  attack: T1053.005,T1202
  mbc: F0012
  id: vbs-short-interval-user-script-task
  desc: Rapid Explorer task beside AppData script
  crit: hostile
  conf: 0.99
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/extension::vbs
  - id: micro-behaviors/process/argument/positional::quoted-path-arguments-assignment
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-progid
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-newtask-call
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-time-trigger-call
  - id: micro-behaviors/os/autorun/scheduled::task-scheduler-action-create-call
  - id: micro-behaviors/os/autorun/control::register-task-definition
  - id: micro-behaviors/os/autorun/scheduled::com-task-short-repetition
  - id: micro-behaviors/fs/path/application/executable::explorer-executable-reference
  any:
  - id: micro-behaviors/fs/path/app-data::windows-appdata-path-marker
  - id: micro-behaviors/os/env/path::appdata-path-lookup
  - id: micro-behaviors/os/env/path::env-appdata
