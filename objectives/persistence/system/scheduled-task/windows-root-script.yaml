defaults:
  for: [xml, text]
  platforms: [windows]
  attack: T1053.005

composite_rules:
  - id: recurring-system-windows-root-script
    desc: SYSTEM task repeats a script from the Windows root directory
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::task-xml-namespace-reference
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-system-principal-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-minute-interval-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-windows-root-script-command-xml
