# Managed implants often pass the utility and its arguments as separate
# ProcessStartInfo strings. Require a demonstrated DDoS implementation as
# attack context; a minute task and process API alone are ordinary scheduling.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-ddos-minute-task-persistence
    desc: DDoS implant minute-task/self-copy references
    crit: hostile
    conf: 0.97
    attack: T1053.005
    all:
      - id: objectives/impact/dos/http::managed-threaded-incomplete-post-tasking
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
      - id: micro-behaviors/process/info/selfpath::managed-self-path-references
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: metadata/binary/symbols/descriptor::dotnet-processstartinfo-name
