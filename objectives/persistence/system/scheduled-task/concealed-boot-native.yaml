defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: hostile
  conf: 0.98
  attack: T1053.005
composite_rules:
  - id: concealed-boot-task-with-amsi-tampering
    desc: Concealed boot-task registration with AMSI tampering
    all:
      - id: micro-behaviors/os/autorun/control::x64-scheduler-boot-service-account-profile
      - id: objectives/evasion/anti-av/amsi::concealed-amsi-session-local-patch
  - id: concealed-rotate-xor-boot-task-registration
    desc: Rotate-XOR concealed boot-task registration
    all:
      - id: micro-behaviors/os/autorun/control::x64-scheduler-boot-service-account-profile
      - id: micro-behaviors/os/autorun/task-trigger::rotate-xor-boot-trigger-name
      - id: objectives/anti-static/obfuscation/imports/concealment::tls-rotate-xor-api-names
