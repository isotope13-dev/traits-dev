# CROSSROAD stages an archive, registers a three-hour task, and erases its
# loader. These source variants recognize that conjunction without requiring
# its vendor, task name, endpoint, payload filename, or exact interval.
# The observations are file-local co-occurrence, not proof that the scheduled
# action is an extracted member. Keep the verdict suspicious: installers can
# also clean themselves up after registering maintenance tasks.
defaults:
  platforms: [windows]
  crit: suspicious
  conf: 0.9
  attack: T1053.005,T1070.004

composite_rules:
  - id: python-self-deleting-archive-task-loader
    desc: Self-deleting archive downloader with repeating-task command
    for: [python]
    near_bytes: 4096
    all:
      - id: objectives/evasion/self-delete/file/script::self-delete-python
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/data/archive/extract/capability::python-extractall-call
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/os/autorun/scheduled::schtasks-short-repeat-schedule
    any:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command

  - id: powershell-self-deleting-archive-task-loader
    desc: Self-deleting archive downloader with repeating-task command
    for: [powershell]
    near_bytes: 4096
    all:
      - id: objectives/evasion/self-delete/file/script::self-delete-powershell
      - id: micro-behaviors/data/archive/extract/capability::powershell-archive-extract
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-short-repeat-schedule
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-call
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call

  # The broader loader observation above is suspicious because installers can
  # remove their setup script after registering a task. This narrower profile
  # also requires a variable /TR action and a nearby Join-Path executable
  # construction. These are same-file observations, not proven variable flow.
  - id: powershell-self-deleting-archive-variable-task-loader
    desc: Self-delete, archive extraction, repeating task
    crit: hostile
    conf: 0.92
    for: [powershell]
    near_bytes: 4096
    all:
      - id: objectives/evasion/self-delete/file/script::self-delete-powershell
      - id: micro-behaviors/data/archive/extract/capability::powershell-archive-extract
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled::schtasks-short-repeat-schedule
      - id: micro-behaviors/os/autorun/control::schtasks-action-variable
      - id: micro-behaviors/fs/path/construct::powershell-join-path-executable
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-call

  - id: powershell-cmdlet-self-deleting-archive-task-loader
    desc: Self-deleting archive downloader with repeating task cmdlets
    for: [powershell]
    near_bytes: 4096
    all:
      - id: objectives/evasion/self-delete/file/script::self-delete-powershell
      - id: micro-behaviors/data/archive/extract/capability::powershell-archive-extract
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: micro-behaviors/os/autorun/scheduled::new-scheduledtaskaction
      - id: micro-behaviors/os/autorun/scheduled::scheduledtask-repeating-trigger
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-call
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call

  - id: self-deleting-archive-task-loader
    desc: Self-deleting archive downloader with repeating-task registration
    for: [python, powershell]
    any:
      - id: python-self-deleting-archive-task-loader
      - id: powershell-self-deleting-archive-task-loader
      - id: powershell-cmdlet-self-deleting-archive-task-loader
