defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # The clipboard rewrite supplies the unwanted-code context. The remaining
  # evidence describes a bound CLI argument setup and process-execution references;
  # it does not assert that task registration succeeded.
  - id: go-clipboard-clipper-repeating-task
    desc: Crypto clipper with hourly schtasks setup
    crit: hostile
    conf: 0.97
    attack: T1053.005
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::go-ethereum-clipboard-swap
      - id: micro-behaviors/process/argument/option::go-x64-schtasks-hourly-command-setup
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
      - id: micro-behaviors/process/create/subprocess::go-native-exec-command-reference
