defaults:
  platforms: [windows]
  for: [batch, powershell, python, javascript, typescript, rust, cpp, csharp]
  attack: T1053.005
  mbc: F0012

composite_rules:
  - id: scheduled-task-piped-file-interpreter
    for: [batch, powershell]
    desc: Recurring task executes file contents through cmd
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1059.003
    near_lines: 0
    all:
      - id: micro-behaviors/os/autorun/task-registration::direct-schtasks-create-command
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-or-hourly-option
      - id: micro-behaviors/os/autorun/task-action::piped-file-action

  - id: recurring-task-piped-file-command-literal
    desc: Source literal configures recurring file-to-cmd task
    crit: suspicious
    conf: 0.96
    for: [python, javascript, typescript, rust, cpp, csharp]
    near_lines: 0
    all:
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-or-hourly-option
      - id: micro-behaviors/os/autorun/task-action::piped-file-action-literal

  - id: scheduled-task-headless-conhost-runner
    desc: Recurring task command includes headless conhost
    crit: suspicious
    conf: 0.95
    for: [batch, powershell]
    near_lines: 0
    all:
      - id: micro-behaviors/os/autorun/task-registration::direct-schtasks-create-command
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-or-hourly-option
      - id: micro-behaviors/os/autorun/task-action::headless-conhost-action
