defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  # The scheduled-task cmdlet never appears in readable form: the shortcut
  # hex-decodes a stage and evaluates it, and the decoded stage registers the
  # recurring task. Task names, paths and hosts are attacker choices.
  - id: lnk-hex-staged-task-registration
    desc: LNK hex-decodes stage that registers scheduled task
    crit: hostile
    conf: 0.97
    attack: T1027,T1053.005,T1059.001
    all:
      - id: objectives/anti-static/obfuscation/document/encoded-command::lnk-powershell-hex-pair-decode-eval
      - id: objectives/anti-static/obfuscation/encoding/hex::lnk-hex-register-scheduledtask
