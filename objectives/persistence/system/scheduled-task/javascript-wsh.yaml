defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
- id: powershell-bypass-scheduled-task-persistence
  desc: WSH registers a task beside hidden PowerShell download staging
  crit: hostile
  conf: 0.98
  attack: T1053.005,T1059.001
  all:
  - id: micro-behaviors/os/autorun/task-registration::register-task-definition
  - id: micro-behaviors/os/autorun/task-config::task-scheduler-newtask-call
  - id: micro-behaviors/os/autorun/task-action::task-scheduler-action-create-call
  - id: micro-behaviors/os/security/policy::execution-policy-bypass
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
  - id: micro-behaviors/fs/write/content::create-text-file-method-name
  - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
  - id: micro-behaviors/communications/http/client/response-body::response-text
