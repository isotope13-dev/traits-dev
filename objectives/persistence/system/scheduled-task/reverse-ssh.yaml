defaults:
  platforms: [windows]
  for: [scripts, source]
  crit: hostile
  conf: 0.98
  attack: T1053.005

composite_rules:
  - id: ssh-key-backdoor-startup-task
    desc: SSH key backdoor registers startup task
    all:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-boot-trigger

  - id: local-sshd-reverse-forward-recurring-task
    desc: Recurring task setup accompanies reverse SSH access
    crit: suspicious
    conf: 0.96
    attack: T1053.005,T1572
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/task-registration::schtasks-minute-create-sequence
