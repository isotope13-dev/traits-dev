defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
- id: node-remote-powershell-scheduled-task
  desc: Node schedules a remote-eval PowerShell task
  crit: hostile
  conf: 0.95
  attack: T1053.005,T1059.001
  all:
  - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
  - id: micro-behaviors/os/autorun/control::schtasks-interpreter-action
  - id: micro-behaviors/process/argument/executable::js-powershell-name-literal
  - id: micro-behaviors/data/control-flow/dispatch/named::javascript-exec-call
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text
  - id: micro-behaviors/communications/http/client/managed::webclient-download-operation-text
