defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
- id: node-remote-powershell-scheduled-task
  desc: Node schedules a remote-eval PowerShell task
  crit: hostile
  conf: 0.95
  attack: T1053.005,T1059.001
  all:
  - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
  - id: micro-behaviors/os/autorun/control::schtasks-interpreter-action
  - id: micro-behaviors/process/argument/executable::js-powershell-name-literal
  - id: micro-behaviors/data/control-flow/dispatch/named::javascript-exec-call
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text
  - id: micro-behaviors/communications/http/client/managed::webclient-download-operation-text

# Split source literals can put the URL on the next line. Keep task creation,
# its hidden PowerShell action, the pipeline, and process launch local.
- id: node-hidden-piped-powershell-task
  desc: Hidden PowerShell task beside remote-eval pipeline
  crit: hostile
  conf: 0.98
  attack: T1053.005,T1059.001,T1105
  near_lines: 5
  all:
  - id: micro-behaviors/os/autorun/task-registration::node-exec-schtasks-create
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: micro-behaviors/os/autorun/task-action::schtasks-hidden-powershell-action
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-pipe-iex
