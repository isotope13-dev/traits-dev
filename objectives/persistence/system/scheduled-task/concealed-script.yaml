defaults:
  platforms: [windows]
  for: [scripts, source, lnk, pe, dll]
composite_rules:
  # Recurrence alone is routine. Require an action that explicitly proxies
  # PowerShell through conhost, hides its window, and hides the registered task.
  # Names, C2 endpoints, paths, and the recurrence interval are attacker choices.
  - id: hidden-repeating-conhost-powershell
    desc: Hidden recurring task proxies hidden PowerShell
    crit: hostile
    conf: 0.97
    attack: T1053.005,T1564.003
    near_lines: 10
    all:
      - id: micro-behaviors/os/autorun/control::powershell-conhost-action
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
      - id: micro-behaviors/os/autorun/scheduled::scheduledtask-repeating-trigger
      - id: micro-behaviors/os/autorun/scheduled::scheduledtask-hidden-settings
      - id: micro-behaviors/process/create/hidden::headless-hidden-powershell-invocation
