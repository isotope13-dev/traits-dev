# The task XML is not necessarily present; this proves a registration
# attempt alongside an AV-excluded bytecode loader, not a successful task,
# a particular task action, privilege level, or login trigger.
defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: excluded-marshal-loader-task-registration
    desc: AV-excluded bytecode loader registers task
    crit: hostile
    conf: 0.98
    attack: T1053.005
    all:
      - id: objectives/execution/payload/script-eval::defender-excluded-decrypted-marshal-execution
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command
