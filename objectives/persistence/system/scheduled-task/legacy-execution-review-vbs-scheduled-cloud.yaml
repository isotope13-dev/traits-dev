defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005
  mbc: B0024
composite_rules:
- id: vbs-wmi-scheduled-cloud-stager
  desc: VBScript scheduled cloud image stager
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/wmi::vbs-wmi-process-create
  - id: micro-behaviors/os/autorun/scheduled::vbs-schedule-service-create
  - id: metadata/file/profile/process/hidden::vbs-hidden-powershell-iex
  - id: micro-behaviors/communications/url/reference::cloud-storage-endpoint-alternatives
  any:
  - id: metadata/lang/source/naming/variable::vbs-appdata-stage-path
  - id: micro-behaviors/communications/url/path::short-numeric-image-object
  unless:
  - id: metadata/file/format/record-sequence::hashed-text-record
