defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # In this serialized RunPE format the field after the startup name is the
  # watchdog flag. The recovered script's flag-1 branch runs schtasks /create
  # /sc minute /mo 1 against its CommonAppData copy (except on Windows XP).
  # A numeric field alone does not establish this format or persistence.
  - id: autoit-runpe-watchdog-task-config
    desc: Masqueraded AutoIt enables recurring watchdog task
    crit: hostile
    conf: 0.97
    attack: T1053.005
    all:
      - id: objectives/execution/payload/process-inject::autoit-serialized-framework-runpe
      - id: metadata/binary/resource/identity::delimited-executable-startup-one-flag
