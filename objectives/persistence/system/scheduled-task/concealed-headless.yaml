defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll]
composite_rules:
  # Neither AppData, --headless nor policy bypass alone convicts. Require the
  # short recurrence, AppData action, headless interpreter host, hidden window
  # and executable call together. Renaming either executable retains coverage.
  - id: frequent-headless-hidden-profile-executable
    desc: Frequent AppData task runs hidden PowerShell
    crit: hostile
    conf: 0.97
    attack: T1053.005,T1564.003
    near_bytes: 512
    near_lines: 1
    all:
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
      - id: micro-behaviors/os/autorun/scheduled::schtasks-appdata-executable-command
      - id: micro-behaviors/os/autorun/control::schtasks-headless-powershell-action
      - id: micro-behaviors/process/create/hidden::headless-hidden-powershell-invocation
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
      - id: micro-behaviors/process/create/shell/command-flag::powershell-command-call-executable-path
