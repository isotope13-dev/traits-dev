# Shortcut that carves a task definition out of its own body and registers
# it with schtasks /xml: the persistence is shipped inside the .lnk.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: hostile
  attack: T1053.005,T1204.002

composite_rules:
  - id: lnk-registers-task-carved-from-itself
    desc: Shortcut registers a scheduled task from XML carved out of itself
    conf: 0.94
    all:
      - id: micro-behaviors/fs/file/seek::lnk-schtasks-create-from-xml
      - id: micro-behaviors/fs/file/seek::lnk-find-self-by-exact-length
      - id: micro-behaviors/fs/file/seek::lnk-stream-seek
