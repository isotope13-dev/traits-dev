defaults:
  platforms: [windows]
  for: [scripts, source, class]

composite_rules:
- id: repeating-encoded-powershell-download-task
  desc: Repeating task launches encoded PowerShell downloader
  crit: hostile
  conf: 0.99
  attack: T1053.005,T1059.001,T1105,T1027
  for: [scripts, source, class, java_class]
  all:
  - id: micro-behaviors/os/autorun/scheduled::schtasks-minute-creation
  - id: metadata/lang/source/syntax/command::encoded-command-line
  - id: micro-behaviors/communications/http/download/webclient::decoded-webclient-downloadstring
