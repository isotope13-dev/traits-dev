# Watchdog persistence in a task definition: hidden from the Task Scheduler
# UI, relaunching every few minutes, and forbidding hard termination so the
# user cannot stop it, all around a non-Microsoft executable.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1053.005,T1564

composite_rules:
  - id: task-xml-hidden-unkillable-repeat-exe
    desc: Hidden unkillable task relaunches exe every minutes
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-xml-root
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hidden-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-minute-interval-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hard-terminate-disabled-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-absolute-exe-command-xml
    unless:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-microsoft-location-command-xml
