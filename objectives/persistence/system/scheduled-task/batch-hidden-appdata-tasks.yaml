defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-hidden-appdata-startup-tasks
  desc: Batch plants hidden AppData boot tasks
  crit: hostile
  conf: 0.93
  attack: T1053.005,T1059.001,T1564.003
  all:
  - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
  - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction-appdata-path
  - id: micro-behaviors/os/autorun/task-action::new-scheduledtaskaction-powershell-execute
  - id: micro-behaviors/os/autorun/task-trigger::schtask-trigger-at-startup
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
  - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
