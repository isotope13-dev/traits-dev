defaults:
  platforms: [windows]
  for: [perl]

composite_rules:
  - id: perl-powershell-fetch-task
    desc: Perl task creation passes a PowerShell fetch-eval command
    crit: hostile
    conf: 0.98
    attack: T1053.005,T1059.001,T1105
    # Call facts share their invocation's start; avoid joining separate calls.
    near_bytes: 1
    all:
      - id: micro-behaviors/os/autorun/task-registration::perl-schtasks-create-call
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::perl-process-powershell-fetch
      - id: micro-behaviors/process/interpreter/eval/powershell::perl-process-pipe-eval
