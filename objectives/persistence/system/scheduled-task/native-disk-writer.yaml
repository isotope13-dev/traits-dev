defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
- id: boot-persistent-critical-disk-writer
  desc: Critical disk-writer creates SYSTEM boot task
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/impact/wipe/disk/device::critical-process-raw-disk-writer
  - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
  - id: micro-behaviors/os/autorun/task-trigger::schtasks-boot-trigger
  - id: micro-behaviors/process/create/exec::winexec
