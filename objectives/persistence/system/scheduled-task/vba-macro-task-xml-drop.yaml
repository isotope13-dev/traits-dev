# Auto-open macros that write a Task Scheduler XML definition plus a split
# "schtasks /create /xml" command line install a recurring task from a
# document open. Strings are split across Write calls, so match the tail.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml, scripts]
  attack: T1053.005,T1204.002
traits:
  - id: macro-task-xml-schema-write
    desc: Script writes task XML with exec action
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)<Exec><Command>%\w+%'
  - id: macro-split-schtasks-create-xml
    desc: Split schtasks create from XML command
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)asks\s+/create\s+/xml\s+""'
composite_rules:
  - id: vba-macro-scheduled-task-xml-persistence
    desc: Auto-open macro installs scheduled task from dropped XML
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/package/entrypoint::vba-auto-open-sub-decl
      - id: macro-task-xml-schema-write
      - id: macro-split-schtasks-create-xml
