# macOS launchd install-marker patterns. Host-keyed temporary telemetry
# markers are neutral file-write behavior and live under micro-behaviors/fs.
defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: B0046
  attack: T1547
traits:
  - id: hidden-initialized-marker-path
    desc: Hidden .initialized state marker path
    crit: suspicious
    conf: 0.92
    platforms: [macos]
    for: [macho, c]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])/\.initialized\b'
  - id: create-initialized-file-symbol
    desc: createInitializedFile helper symbol
    crit: suspicious
    conf: 0.94
    platforms: [macos]
    for: [macho, c]
    if:
      type: symbol
      substr: createInitializedFile
  - id: hidden-launchagent-plist-name
    desc: Hidden LaunchAgent plist name
    crit: suspicious
    conf: 0.92
    platforms: [macos]
    for: [macho, c]
    if:
      type: text
      exact: .launcher.plist
  - id: plist-bash-program
    desc: Embedded plist contains a bash program element
    crit: notable
    conf: 0.88
    platforms: [macos]
    for: [macho, c]
    if:
      type: text
      exact: '<string>/bin/bash</string>'
  - id: plist-bash-c-arg
    desc: Embedded bash -c plist argument
    crit: notable
    conf: 0.85
    platforms: [macos]
    for: [macho, c]
    if:
      type: text
      exact: '<string>-c</string>'
  - id: embedded-runatload-true-element
    desc: Embedded plist sets RunAtLoad to true
    crit: notable
    conf: 0.8
    platforms: [macos]
    for: [macho, c]
    # Bound to the RunAtLoad key: a bare <true/> is in every embedded
    # Info.plist and entitlements blob. Escaped \n/\t cover a plist held as
    # a C string literal.
    if:
      type: text
      regex: '<key>RunAtLoad</key>(\s|\\[nrt]){0,40}<true/>'
  - id: localbin-source
    desc: Embedded local-bin payload source
    crit: suspicious
    conf: 0.9
    platforms: [macos]
    for: [macho, c]
    if:
      type: text
      substr: 'BINARY_SRC="$HOME/.local/bin/'
composite_rules:
  - id: hidden-install-state-marker
    desc: Hidden install-state marker file
    crit: suspicious
    conf: 0.96
    platforms: [macos]
    for: [macho, c]
    all:
      - id: hidden-initialized-marker-path
      - id: create-initialized-file-symbol
  - id: hidden-bash-temp-stager
    desc: Hidden LaunchAgent bash temp stager
    crit: hostile
    conf: 0.97
    platforms: [macos]
    for: [macho]
    attack: T1543.004,T1059.004,T1105
    all:
      - id: objectives/persistence/system/launchd/location::launch-agents
      - id: objectives/persistence/system/launchd/bootstrap::embedded-plist-runatload-key
      - id: embedded-runatload-true-element
      - id: micro-behaviors/os/service/plist::plist-programarguments-key
      - id: hidden-launchagent-plist-name
      - id: plist-bash-program
      - id: plist-bash-c-arg
      - id: localbin-source
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::tmpdir-copy-binary-src
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::tmpdir-chmod-path
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::tmpdir-exec-path
    any:
      - id: micro-behaviors/os/service/control::launchctl-refresh-gui-service
      - id: micro-behaviors/os/service/control::launchctl-command
