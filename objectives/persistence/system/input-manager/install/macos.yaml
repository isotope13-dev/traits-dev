# A binary that shells out to move a bundle into /Library/InputManagers gets
# its code loaded into every Cocoa app. Requiring the shell-command import and
# the shell rm of a prior copy separates a dropper from a plugin's own
# installer package (which ships the bundle as a payload, not via system()).
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1547

composite_rules:
  - id: shell-input-manager-bundle-drop
    desc: Binary shells out to replace a bundle in InputManagers
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/bundle::input-manager-shell-install
      - id: metadata/binary/symbols/name/process::c-system-import
      - id: micro-behaviors/fs/path/binary::rm-utility-path
