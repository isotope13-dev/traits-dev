defaults:
  platforms: [linux]
  for: [elf]
  attack: T1053.003,T1543.002,T1546.004,T1564

composite_rules:
  - id: go-linux-multi-surface-persistence-manager
    desc: Go Linux persistence manager with process hiding
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/autorun/control::go-elf-multiple-autorun-surface-references
      - id: micro-behaviors/fs/path/binary::crontab-utility-path
      - id: micro-behaviors/fs/path/binary::systemctl-utility-path
      - id: micro-behaviors/os/service/config::rc-local-path-marker
      - id: objectives/command-and-control/channel/irc/go-agent::go-irc-persistence-module-cluster
      - id: objectives/command-and-control/channel/irc/go-agent::go-irc-process-hider-module
