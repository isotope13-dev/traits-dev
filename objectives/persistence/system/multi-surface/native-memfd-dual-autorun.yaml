# A native Linux binary that carries a systemd unit template and a root
# @reboot cron template (two independent autorun surfaces for one payload) and
# also copies its own image into anonymous memory and executes it from there.
# Redundant autorun plus a fileless re-execution is unusual for an installer or
# service: a package manager registers one mechanism and runs the file it
# installed. The same combination ships in a labeled suspicious sample, so this
# stays suspicious. The legs are matched in one binary, not proven to be one flow.
# A runtime that re-executes itself from a memfd (runc's cloned binary) carries
# no unit or cron template; an installer that writes a unit and a cron job
# carries no memfd execution.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1543.002,T1053.003,T1620

composite_rules:
  - id: native-dual-autorun-memfd-self-exec
    desc: Native binary with systemd and cron autorun templates and memfd self-exec
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/unit-field::native-unit-template
      - id: micro-behaviors/os/autorun/cron/entry::native-root-reboot-entry
      - id: micro-behaviors/mem/anonymous/create::memfd-create
      - id: micro-behaviors/process/replace::fexecve-import
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
