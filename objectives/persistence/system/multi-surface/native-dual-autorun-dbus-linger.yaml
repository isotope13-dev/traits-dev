# A native Linux binary that carries both a systemd unit and a root @reboot
# cron template, enables user lingering, and re-executes its own image from
# anonymous memory under a dbus-daemon identity. Redundant boot autorun,
# lingering across logout, and a fileless self-copy named like a system daemon
# is an implant's survival kit; an installer registers one mechanism and runs
# the file it installed. The legs are matched in one binary, not proven to be
# one flow. The unit template need not carry ExecStart: a misspelled or absent
# field leaves the cron entry and the memfd relaunch intact.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1543.002,T1053.003,T1036.005,T1620

composite_rules:
  - id: native-dual-autorun-dbus-masquerade-linger
    desc: Native binary with dual autorun, linger and memfd dbus masquerade
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/persistence/system/multi-surface::native-dual-autorun-memfd-self-exec
      - id: objectives/evasion/masquerade/process/title::memfd-dbus-execution-profile
      - id: micro-behaviors/os/service/configure::loginctl-enable-linger
