defaults:
  platforms: [linux, android, unix]
  for: [elf, so]
  attack: T1053.003,T1543.002

composite_rules:
  - id: native-bot-cron-systemd-hidden-tmp-persistence
    desc: Native bot persists via cron, systemd and hidden paths
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/hidden::android-hidden-local-tmp-dotfile
      - id: micro-behaviors/fs/path/config/scheduled::cron-d-path-reference
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: micro-behaviors/process/create/subprocess/reference::proc-fd-path-and-execve-symbol
      - id: objectives/impact/dos/http::maxint-post-content-length-flood
