# One artifact that installs autostart on Windows (scheduled task / Run key),
# macOS (launchd LaunchAgent), and Linux (systemd user unit) in the same file
# is a cross-platform implant claiming persistence on every host it lands on.
# Benign cross-platform daemons that do this in one file also ship the
# matching teardown, which the lifecycle-manager exception recognizes. Each OS
# leg is an `any:` group so a variant that swaps schtasks for a Run key, or
# launchctl for a bare plist write, still matches. Same-file scope required.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1547,T1053,T1543
  mbc: F0012

composite_rules:
  - id: tri-os-autostart-lifecycle-manager
    desc: Stops autostart jobs on all three OSes
    crit: exception
    conf: 0.8
    all:
      - id: micro-behaviors/os/autorun/control::js-launchctl-unload
      - id: micro-behaviors/os/autorun/control::js-systemctl-lifecycle-disable
    any:
      - id: micro-behaviors/os/autorun/control::js-schtasks-end-or-delete
      - id: micro-behaviors/os/autorun/control::js-scheduled-task-powershell-teardown
      - id: micro-behaviors/os/autorun/control::js-reg-delete-autorun

  - id: tri-os-autostart-installer
    desc: One file installs autostart on three OSes
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/os/autorun/control::windows-autostart-surface
      - id: micro-behaviors/os/service/start::macos-autostart-surface
    # A bare systemctl string is a denylist or docs mention. Require a user
    # unit enable, or a call that passes enable to systemctl.
    any:
      - id: micro-behaviors/os/service/configure::source-systemctl-user-enable
      - id: micro-behaviors/os/service/control::systemctl-enable-call-dynamic
      - id: micro-behaviors/os/service/control::systemctl-enable-quoted-argv
    needs: 1
    unless:
      # Filename-convention test guards. The harness directory ref was dropped
      # so this rule can also except an explicit enable gate; testdata paths
      # still match the component below.
      - id: "metadata/file/naming::test-directory-component"
      - id: tri-os-autostart-lifecycle-manager
      - id: well-known/app/ai/usage/prumo::documented-dashboard-autostart-module
      # Recognised AI usage-tracker packages that register a documented
      # autostart daemon (claude-usage-companion-daemon, viko-pulse, prumo,
      # token-guard, ...).
      - id: well-known/app/ai/usage/
      # Recognised AI knowledge-vault packages whose documented daemon
      # installer registers autostart on every OS (hivevault, ...).
      - id: well-known/app/ai/knowledge/
      - id: well-known/app/ai/coding-agent/codebuddy::codebuddy-headless-context
      # Recognised Omnius coding agent whose postinstall installer documents
      # its per-user daemon, opt-out env, and launchd label in-file.
      - id: well-known/app/ai/coding-agent/omnius::daemon-installer-context
      - id: metadata/package/testing/corpus::rule-test-case-detection-verdicts
      # Refuses to register until a separate enable flag is already true.
      - id: micro-behaviors/os/service/control::explicit-enable-before-service-install
