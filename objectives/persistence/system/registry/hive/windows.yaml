defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1112"
composite_rules:
- id: registry-hive-replacement
  desc: Registry hive replacement persistence
  crit: suspicious
  conf: 0.95
  scope: file
  all:
  - id: micro-behaviors/os/registry/offline-hive::registry-hive-swap-apis
  any:
  - id: micro-behaviors/os/registry/access::registry-create-key-api
  - id: micro-behaviors/os/registry/open::registry-open-key-api
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  needs: 2
  unless:
  - id: well-known/lib/native/lief::node-lief-native-addon-context
  - id: metadata/lang/compiler/systems::haskell-binary
  - id: well-known/tool/packaging/inno-setup-runtime::inno-uninstaller-runtime
  # RegistryDefrag stages a .regbk109 backup and calls RegReplaceKeyA on the
  # selected hive as part of its advertised defragmentation operation.
  - id: well-known/app/system/winutilities::winutilities-registry-defrag-identity
  # System DLLs often embed RegReplaceKey/RegSaveKey names in delay-load
  # catalogs without performing hive-replacement persistence.
  - id: metadata/signed/trust-level::microsoft-signed-system-component-context
  - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-microsoft-signed-component
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-exports-200
    - id: metadata/lang/compiler/managed/
