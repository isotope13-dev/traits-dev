defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - python
  attack: T1547.001,T1112
  mbc: F0012
composite_rules:
- id: ntuser-man-offline-persistence
  desc: Forges NTUSER.MAN mandatory profile for persist
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/offline-hive::offreg-hive-write-api-context
  - id: micro-behaviors/os/registry/offline-hive::ntuser-man-profile-path
  any:
  - id: micro-behaviors/os/registry/offline-hive::reg-load-app-key-api
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  - id: micro-behaviors/os/registry/access::python-reg-run-access
