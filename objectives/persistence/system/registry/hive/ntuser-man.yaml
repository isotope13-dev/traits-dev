# Persistence by forging a mandatory user-profile hive (NTUSER.MAN) offline.
# Combines RegLoadAppKeyW private hive load with offreg.dll writes so Run/COM
# values appear at next logon without live registry modification events.
defaults:
  platforms: [windows]
  for: [scripts, binaries, pe, dll, python]
  attack: T1547.001,T1112
  mbc: F0012

composite_rules:
  - id: offline-offreg-hive-build
    desc: Builds a registry hive offline with offreg.dll
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/offline-hive::offreg-dll-load
      - id: micro-behaviors/os/registry/offline-hive::offreg-create-key-api
      - id: micro-behaviors/os/registry/offline-hive::offreg-set-value-api
      - id: micro-behaviors/os/registry/offline-hive::offreg-save-hive-api
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-binding-crate

  - id: ntuser-man-offline-persistence
    desc: Forges NTUSER.MAN mandatory profile for persist
    crit: hostile
    conf: 0.98
    all:
      - id: offline-offreg-hive-build
      - id: micro-behaviors/os/registry/offline-hive::ntuser-man-profile-path
    any:
      - id: micro-behaviors/os/registry/offline-hive::reg-load-app-key-api
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/access::python-reg-run-access
