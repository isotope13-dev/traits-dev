defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: appinit-stack-value-hook-security-writer
    desc: "Concealed AppInit writer, hook and ACL APIs"
    crit: hostile
    conf: 0.96
    attack: T1546.010
    all:
      - id: micro-behaviors/os/registry/autostart/reference::appinit-value-stack-byte-stores
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-a
      - id: micro-behaviors/os/registry/permission::reg-set-key-security
      - id: micro-behaviors/ui/window/hook::set-windows-hook
