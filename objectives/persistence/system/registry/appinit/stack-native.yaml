defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: appinit-stack-value-hook-security-writer
    desc: Concealed AppInit writer with hook and ACL API
    crit: hostile
    conf: 0.96
    attack: T1546.010
    all:
      - id: micro-behaviors/os/registry/keys/autostart::appinit-value-stack-byte-stores
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/os/registry/access::reg-set-key-security
      - id: micro-behaviors/ui/window/hook::set-windows-hook
