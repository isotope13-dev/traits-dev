defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.85
traits: []
composite_rules:
  - id: com-hijack-user-path
    desc: COM registration in user-writable directory
    all:
      - id: micro-behaviors/os/com/registration::inprocserver32-word
      - id: micro-behaviors/os/com/registration::writable-user-path-fragment
      - id: micro-behaviors/os/com/registration::threadingmodel-word
    downgrade:
      any:
        - id: metadata/binary/metrics/structural::many-imports
        - id: metadata/binary/framework::dotnet-metadata
  - id: outofproc-com-server-registration
    desc: Out-of-proc COM server registration
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/os/com/registration::localserver32-assignment
    any:
      - id: micro-behaviors/os/com/registration::appid-word
      - id: objectives/persistence/system/registry/com-hijack::clsid-registry-path
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft
        - id: well-known/app/development/microsoft-csharp-compiler/
    unless:
      - id: well-known/lib/platform/microsoft-com-catalog::microsoft-com-catalog-context
      - id: well-known/lib/platform/microsoft-comsvcs::microsoft-comsvcs-library-context
  - id: inproc-threadingmodel-registration
    desc: COM in-proc server registration
    crit: suspicious
    conf: 0.92
    attack: T1546.015
    all:
      - id: micro-behaviors/os/com/registration::inprocserver32-word
      - id: micro-behaviors/os/com/registration::threadingmodel-word
      - id: micro-behaviors/os/com/registration::threadingmodel-both-word
      - id: micro-behaviors/os/com/registration::writable-user-path-fragment
    downgrade:
      any:
        - id: well-known/app/utility/startallback::startallback-basename
        - id: well-known/app/utility/startallback::darkmagic-basename
