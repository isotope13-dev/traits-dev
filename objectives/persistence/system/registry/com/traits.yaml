defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.85
traits: []
composite_rules:
  - id: com-hijack-user-path
    desc: COM registration in user-writable directory
    all:
      - id: micro-behaviors/os/registry/com/reference::inprocserver32-word
      - id: micro-behaviors/fs/path/app-data/platform::windows-writable-user-path-reference
      - id: micro-behaviors/os/registry/com/reference::threadingmodel-word
    unless:
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports
        - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: outofproc-com-server-registration
    desc: Out-of-proc COM server registration
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/os/com/registration::localserver32-assignment
    any:
      - id: micro-behaviors/os/registry/com/reference::appid-word
      - id: micro-behaviors/os/registry/com/reference::clsid-registry-key-path
    downgrade:
      any:
        - id: metadata/signature/verified/platform::microsoft
        - id: well-known/tool/development/toolchain/microsoft-csharp-compiler/
    unless:
      - id: well-known/lib/platform/microsoft-com-catalog::microsoft-com-catalog-context
      - id: well-known/lib/platform/microsoft-comsvcs::microsoft-comsvcs-library-context
  - id: inproc-threadingmodel-registration
    desc: COM in-proc server registration
    crit: suspicious
    conf: 0.92
    attack: T1546.015
    all:
      - id: micro-behaviors/os/registry/com/reference::inprocserver32-word
      - id: micro-behaviors/os/registry/com/reference::threadingmodel-word
      - id: micro-behaviors/os/registry/com/reference::threadingmodel-both-word
      - id: micro-behaviors/fs/path/app-data/platform::windows-writable-user-path-reference
    downgrade:
      any:
        - id: metadata/signature/verified/platform::microsoft
        - id: well-known/app/utility/startallback::startallback-basename
    unless:
      - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
