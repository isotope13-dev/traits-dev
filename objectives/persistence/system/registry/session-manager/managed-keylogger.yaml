defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-keylogger-bootexecute-references
    desc: Hook keylogger with BootExecute and registry-setter references
    crit: hostile
    conf: 0.95
    attack: T1547
    # Required recording establishes abuse context. These references do not
    # prove a bound write, a correctly typed REG_MULTI_SZ, or boot execution.
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/registry/keys/path::session-manager-key
      - id: micro-behaviors/os/registry/value-name::bootexecute-value-reference
      - id: micro-behaviors/os/registry/access::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/process/info/selfpath::managed-entry-assembly-location-references
