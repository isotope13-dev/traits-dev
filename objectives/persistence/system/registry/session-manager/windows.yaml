defaults:
  platforms: [windows]
  for: [pe]
  attack: T1112
traits:
  - id: session-manager-key
    desc: Session Manager registry key path
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: System\CurrentControlSet\Control\Session Manager
      case_insensitive: true
    unless:
      - id: "micro-behaviors/os/registry/keys/installer::advanced-inf-setup-regpath"
      - id: metadata/signed/platform::microsoft
  - id: pending-file-rename-ops
    desc: PendingFileRenameOperations value path
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: System\CurrentControlSet\Control\Session Manager\PendingFileRenameOperations
      case_insensitive: true
    unless:
      - id: "micro-behaviors/os/registry/keys/installer::advanced-inf-setup-regpath"
      - id: metadata/signed/platform::microsoft
  - id: file-rename-ops
    desc: FileRenameOperations value path
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: System\CurrentControlSet\Control\Session Manager\FileRenameOperations
      case_insensitive: true
    unless:
      - id: "micro-behaviors/os/registry/keys/installer::advanced-inf-setup-regpath"
      - id: metadata/signed/platform::microsoft
  - id: pending-file-rename-value-name
    desc: PendingFileRenameOperations value name
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: PendingFileRenameOperations
      case_insensitive: true
    unless:
      - id: "micro-behaviors/os/registry/keys/installer::advanced-inf-setup-regpath"
      - id: metadata/signed/platform::microsoft
  - id: bootexecute-registry
    desc: References BootExecute registry value only
    crit: component
    conf: 0.9
    attack: T1547
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bBootExecute\b'
composite_rules:
  - id: boot-rename-persistence
    desc: Boot-time file rename persistence
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    any:
      - id: objectives/persistence/system/registry/session-manager::pending-file-rename-ops
      - id: objectives/persistence/system/registry/session-manager::pending-file-rename-value-name
      - id: objectives/persistence/system/registry/session-manager::file-rename-ops
      - id: objectives/persistence/system/registry/session-manager::session-manager-key
    needs: 2
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx::wextract-tool
      # Genuine Adobe updater components replace locked files through Session
      # Manager renames on every update; a signer chain CN Adobe Inc. issued
      # by DigiCert is the vendor's own certificate shape.
      - id: metadata/signed/platform::adobe-inc-digicert-issued-chain
    downgrade:
      any:
        - id: objectives/command-and-control/dropper/staging/installer::inf-install-entrypoint
        - id: objectives/command-and-control/dropper/staging/installer::rundll32-inf-install
        - id: objectives/command-and-control/dropper/staging/installer::do-inf-install
  - id: bootexecute-write-persistence
    desc: BootExecute registry write persistence
    crit: suspicious
    conf: 0.95
    all:
      - id: bootexecute-registry
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    unless:
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-tool
      - id: metadata/signed/certificate/subject::glarysoft-ltd
      - id: metadata/binary/installer/sfx::wextract-tool
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft
        - id: metadata/binary/installer/family/
  - id: unsigned-microsoft-boot-rename-persistence
    desc: Unsigned Microsoft-claim PE carries boot rename persistence
    crit: hostile
    conf: 0.96
    attack: T1547
    all:
      - id: boot-rename-persistence
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/installer/family/

  # The GoogleUpdate.exe twin: commodity loaders (Amadey and related
  # families) drop as a fake Google Update component carrying "Google LLC"
  # version fields, then schedule the on-disk swap through Session Manager.
  - id: unsigned-google-boot-rename-persistence
    desc: Google-claim PE carries boot rename persistence
    crit: hostile
    conf: 0.96
    attack: T1547,T1036.005
    # The broken certificate table is the unsigned/tampered evidence here:
    # a claimed-but-truncated security directory means the vendor signature
    # was stripped or the image rebuilt.
    all:
      - id: boot-rename-persistence
      - id: metadata/binary/vendor::google-corp-versioninfo
      - id: metadata/binary/layout/checksum::cert-table-truncated
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/installer/family/

  - id: packed-disguise-boot-runonce-persistence
    desc: Packed disguise dropper with boot rename and Run key
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1112
    all:
      - id: boot-rename-persistence
      - id: micro-behaviors/os/registry/keys/autostart::run-or-runonce-key-reference
      - id: objectives/evasion/masquerade/extension-mismatch::packed-random-export-dll-disguised-as-data
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
