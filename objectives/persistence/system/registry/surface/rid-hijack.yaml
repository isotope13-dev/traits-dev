defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-sam-rid-overwrite
  desc: RID hijacking module overwrites the SAM account record
  crit: hostile
  all:
  - id: well-known/tool/offensive/powershell-empire::ridhijack-module-function
  - id: micro-behaviors/os/registry/write::powershell-registry-property-cmd
  - id: micro-behaviors/os/registry/access::registry-binary-value-type
