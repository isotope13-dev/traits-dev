# The ransom hook/form-POST profile independently establishes key recording.
# Accept it alongside the existing recorder profiles; operation legs stay required.
# Reviewed CIL changes .pdf's class and points its open command at self.
# The matcher is broader: it requires independently established keylogging,
# self-path and association-setter evidence, without a chosen class name.
# Do not infer a bound registry handle or successful HKCR write from this
# file-scoped combination. A normal document handler lacks keylog admission.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-keylogger-file-association-selfpath-references
    desc: Keylogger self-path with file-association setter references
    crit: hostile
    conf: 0.95
    attack: T1546.001
    all:
      - id: micro-behaviors/process/info/selfpath::managed-self-path-references
      - id: micro-behaviors/os/registry/association::managed-file-handler-registration-references
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post
