# IFEO reactivation is triggered by an executable launch, not user login.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1546.012
  mbc: F0012
composite_rules:
- id: ifeo-process-tool-debugger-hijack
  desc: IFEO Debugger hijacks a process tool
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/registry/keys/execution::ifeo-debugger-write-api-evidence
  any:
  - id: micro-behaviors/process/info/name::taskmgr-process
  - id: micro-behaviors/process/debug/tool-markers::process-hacker-name-reference
