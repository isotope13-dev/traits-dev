# An installer registering a document handler is the benign near miss. The
# required drive-walking executable-prefix infection admits this attack claim;
# neither an association path nor registry APIs alone establishes persistence.
# The conjunction describes file-scoped evidence, not resolved handle flow.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: prefix-infector-exefile-handler
    desc: EXE infector with handler overwrite evidence
    crit: hostile
    conf: 0.98
    attack: T1546.001
    all:
      - id: objectives/impact/infect/binary/rewrite::drive-walking-executable-prefix-infector
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-a
      - id: micro-behaviors/os/registry/open::reg-open-key-ex-a-symbol
    any:
      - id: micro-behaviors/os/registry/association/reference::lcg-exefile-open-command-key
      - id: micro-behaviors/os/registry/association/reference::exefile-open-command-key
      - id: micro-behaviors/os/registry/association/reference::xor-exefile-open-command-key
