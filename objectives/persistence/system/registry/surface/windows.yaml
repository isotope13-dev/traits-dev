# Specialized Windows system-level registry persistence surfaces.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1547
traits:
- id: lsa-auth-package-registry
  desc: LSA authentication package registry
  crit: suspicious
  conf: 0.9
  for: [scripts, binaries, csharp, powershell, c, cpp, batch, vbs]
  attack: T1547.002
  if:
    type: text
    regex: '(?i)\\Control\\Lsa\\(Authentication Packages|Security Packages|Notification Packages)\b'

- id: lsa-notification-package-source
  desc: LSA Notification Packages near control path
  crit: suspicious
  conf: 0.94
  for: [csharp, powershell, c, cpp, batch, vbs]
  attack: T1547.002
  if:
    type: text
    regex: '(?is)\\Control\\Lsa[\s\S]{0,180}Notification Packages\b'

- id: lsa-control-path
  desc: LSA registry control path
  crit: component
  conf: 0.84
  if:
    type: text
    regex: '(?i)\\Control\\Lsa\\'

- id: lsa-package-value-name
  desc: LSA package value name
  crit: component
  conf: 0.84
  if:
    type: text
    regex: '(?i)\b(Authentication Packages|Security Packages|Notification Packages)\b'

- id: print-monitor-registry
  desc: Print monitor registry persistence
  crit: suspicious
  conf: 0.88
  attack: T1547.010
  unless:
  - type: text
    substr: Disable Printer bloat
  - id: well-known/lib/platform/wine/
  if:
    type: text
    regex: '(?i)\\Control\\Print\\Monitors\\|\\Print\\Monitors\\[^\\\n]{1,80}\\Driver\b'

- id: print-processor-registry
  desc: Print processor registry persistence
  crit: suspicious
  conf: 0.88
  attack: T1547.012
  unless:
  - id: well-known/lib/platform/wine/
  if:
    type: text
    regex: '(?i)\\Control\\Print\\Environments\\[^\\\n]{1,160}\\Print Processors\\'

- id: time-provider-registry
  desc: Windows Time Provider persistence
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\\Services\\W32Time\\TimeProviders\\|\\TimeProviders\\[^\\\n]{1,80}\\DllName\b'

- id: netsh-helper-registry
  desc: Netsh helper DLL persistence
  crit: suspicious
  conf: 0.88
  attack: T1546
  if:
    type: text
    regex: '(?i)\\Microsoft\\NetSh\\|netsh\s+add\s+helper\b'

- id: winsock-provider-catalog
  desc: Winsock provider catalog persistence
  crit: notable
  conf: 0.86
  attack: T1546
  if:
    type: text
    regex: '(?i)\\WinSock2\\Parameters\\(Protocol_Catalog9|Namespace_Catalog5)\b'
  unless:
  - id: well-known/tool/sysadmin/sysinternals/

- id: network-provider-order-path
  desc: NetworkProvider order registry path
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '\NetworkProvider\Order'

- id: network-provider-service-path
  desc: NetworkProvider service registry path
  crit: component
  conf: 0.9
  if:
    type: text
    substr: '\NetworkProvider'

- id: network-provider-order-value
  desc: Network provider order value
  crit: component
  conf: 0.9
  if:
    type: text
    word: PROVIDERORDER
    case_insensitive: true

- id: network-provider-dll-value
  desc: NetworkProvider DLL path value
  crit: component
  conf: 0.9
  if:
    type: text
    word: ProviderPath
    case_insensitive: true

- id: screensaver-registry--rx-5
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '(?i)\\Control Panel\\Desktop.{0,120}SCRNSAVE\.EXE'

  count_max: 1031274
- id: screensaver-registry--rx-6
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '\\SCRNSAVE\.EXE\b'

  count_max: 1031275
- id: screensaver-registry--rx-7
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '\bSCRNSAVE\.EXE\b'

  count_max: 1031276
- id: screensaver-registry--rx-8
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    substr: ScreenSaveActive
  count_max: 1031277
- id: silentprocessexit-registry--rx-9
  desc: SilentProcessExit registry path reference
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)\\SilentProcessExit\\'

  count_max: 1031278
- id: silentprocessexit-registry--rx-10
  desc: IFEO GlobalFlag registry reference
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\\Image File Execution Options\\[^\\\n]{1,80}\\GlobalFlag\b'

  count_max: 1031279
- id: silentprocessexit-registry--rx-11
  desc: SilentProcessExit monitor value reference
  crit: component
  conf: 0.9
  if:
    type: text
    # Word boundary avoids PcaMonitorProcess and similar API catalog names.
    word: MonitorProcess
  count_max: 1031280
composite_rules:
- id: python-user-path-registry-write
  desc: Python writes user PATH registry value
  crit: notable
  conf: 0.96
  for: [python]
  all:
  - id: micro-behaviors/os/registry/keys::user-environment-path-regpath
  - id: micro-behaviors/os/registry/manipulate::winreg-setvalue

- id: network-provider-registry
  desc: NetworkProvider DLL registry persistence
  crit: suspicious
  conf: 0.9
  attack: T1556
  all:
  - id: network-provider-dll-value
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: metadata/library/win32-bindings::win32more-generated-bindings
  - id: well-known/lib/crypto/mit-krb5::source-tree-context
  - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
  any:
  - id: network-provider-order-path
  - id: network-provider-service-path
  - id: network-provider-order-value

- id: registry-write-to-windows-system-persistence
  desc: Registry write to Windows system persistence
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  unless:
  - id: well-known/app/utility/
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
  - id: well-known/tool/sysadmin/sysinternals/
  # DesktopMania manages the user's ScreenSaveActive setting as part of its
  # wallpaper/screensaver feature; that is product configuration, not covert
  # persistence.
  - id: well-known/unwanted/desktopmania::autonavigator-desktopmania-registry-key
  any:
  - id: micro-behaviors/os/registry/keys::appinit-dlls-value-name
  - id: micro-behaviors/os/registry/keys::loadappinit-policy-value
  - id: micro-behaviors/os/registry/keys::appcert-dlls-registry-path
  - id: lsa-auth-package-registry
  - id: lsa-package-value
  - id: print-monitor-registry
  - id: print-processor-registry
  - id: time-provider-registry
  - id: netsh-helper-registry
  - id: winsock-provider-catalog
  - id: screensaver-registry
  - id: silentprocessexit-registry
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/

- id: high-risk-dll-registry-persistence
  desc: High-risk DLL registry persistence
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/keys::appinit-dlls-value-name
  - id: micro-behaviors/os/registry/keys::loadappinit-policy-value
  - id: micro-behaviors/os/registry/keys::appcert-dlls-registry-path
  - id: lsa-auth-package-registry
  - id: print-monitor-registry
  - id: print-processor-registry
  - id: time-provider-registry
  - id: netsh-helper-registry
  - id: winsock-provider-catalog
- id: lsa-package-value
  desc: LSA package value name
  crit: suspicious
  conf: 0.84
  attack: T1547.002
  all:
  - id: lsa-control-path
  - id: lsa-package-value-name
  near_bytes: 128
  unless:
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/lib/runtime/electron/
- id: screensaver-registry
  desc: Screensaver executable persistence
  crit: suspicious
  conf: 0.86
  attack: T1546
  any:
  - id: screensaver-registry--rx-5
  - id: screensaver-registry--rx-6
  - id: screensaver-registry--rx-7
  - id: screensaver-registry--rx-8
- id: silentprocessexit-registry
  desc: SilentProcessExit monitor registry surface
  crit: notable
  conf: 0.9
  attack: T1546.012
  any:
  - id: silentprocessexit-registry--rx-9
  - id: silentprocessexit-registry--rx-10
  - id: silentprocessexit-registry--rx-11
  unless:
  - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
