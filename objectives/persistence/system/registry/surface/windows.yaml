# Specialized Windows system-level registry persistence surfaces.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1547
traits:
- id: lsa-notification-package-source
  desc: LSA Notification Packages near control path
  crit: suspicious
  conf: 0.94
  for: [csharp, powershell, c, cpp, batch, vbs]
  attack: T1547.002
  if:
    type: text
    regex: '(?is)\\Control\\Lsa[\s\S]{0,180}Notification Packages\b'

- id: print-monitor-registry
  desc: Print monitor registry persistence
  crit: suspicious
  conf: 0.88
  attack: T1547.010
  unless:
  - id: micro-behaviors/os/service/print::print-monitor-initialize-export
  - type: text
    substr: Disable Printer bloat
  - type: text
    substr: Standard TCP/IP Port\Ports
  - id: well-known/lib/platform/wine/
  - id: well-known/app/system/reactos::system-component
  - id: well-known/app/infrastructure/chef::chef-source-context
  if:
    type: text
    regex: '(?i)\\Control\\Print\\Monitors\\|\\Print\\Monitors\\[^\\\n]{1,80}\\Driver\b'

- id: print-processor-registry
  desc: Print processor registry persistence
  crit: suspicious
  conf: 0.88
  attack: T1547.012
  unless:
  - id: well-known/lib/platform/wine/
  if:
    type: text
    regex: '(?i)\\Control\\Print\\Environments\\[^\\\n]{1,160}\\Print Processors\\'

- id: netsh-helper-registry
  desc: Netsh helper DLL persistence
  crit: suspicious
  conf: 0.88
  attack: T1546
  if:
    type: text
    regex: '(?i)\\Microsoft\\NetSh\\|netsh\s+add\s+helper\b'

- id: winsock-provider-catalog
  desc: Winsock provider catalog persistence
  crit: notable
  conf: 0.86
  attack: T1546
  if:
    type: text
    regex: '(?i)\\WinSock2\\Parameters\\(Protocol_Catalog9|Namespace_Catalog5)\b'
  unless:
  - id: well-known/tool/sysadmin/sysinternals/

- id: network-provider-order-path
  desc: NetworkProvider order registry path
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '\NetworkProvider\Order'

- id: network-provider-service-path
  desc: NetworkProvider service registry path
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '\NetworkProvider'

- id: network-provider-order-value
  desc: Network provider order value
  crit: notable
  conf: 0.9
  if:
    type: text
    word: PROVIDERORDER
    case_insensitive: true

- id: silentprocessexit-registry--rx-9
  desc: SilentProcessExit registry path reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\\SilentProcessExit\\'

- id: silentprocessexit-registry--rx-10
  desc: IFEO GlobalFlag registry reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\\Image File Execution Options\\[^\\\n]{1,80}\\GlobalFlag\b'

- id: silentprocessexit-registry--rx-11
  desc: SilentProcessExit monitor value reference
  crit: notable
  conf: 0.9
  if:
    type: text
    # Word boundary avoids PcaMonitorProcess and similar API catalog names.
    word: MonitorProcess
composite_rules:
- id: python-user-path-registry-write
  desc: Python writes user PATH registry value
  crit: notable
  conf: 0.96
  for: [python]
  all:
  - id: micro-behaviors/os/registry/keys::user-environment-path-regpath
  - id: micro-behaviors/os/registry/manipulate::winreg-setvalue

- id: network-provider-registry
  desc: NetworkProvider registry path and value references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/keys::providerpath-value-name
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/app/system/reactos::system-component
  - id: well-known/lib/native/win32-bindings::win32more-generated-bindings
  - id: well-known/lib/crypto/mit-krb5::source-tree-context
  - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
  any:
  - id: network-provider-order-path
  - id: network-provider-service-path
  - id: network-provider-order-value
  downgrade:
    any:
    - id: well-known/tool/offensive/psbits::source-tree-member

- id: npp-order-dll-persistence
  desc: Network provider order and ProviderPath references
  crit: notable
  conf: 0.9
  all:
  - id: network-provider-order-path
  - id: micro-behaviors/os/registry/keys::providerpath-value-name
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/app/system/reactos::system-component
  - id: well-known/lib/native/win32-bindings::win32more-generated-bindings
  - id: well-known/lib/crypto/mit-krb5::source-tree-context
  - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
  - id: well-known/tool/offensive/psbits::source-tree-member

- id: npp-service-dll-persistence
  desc: Network provider service and ProviderPath references
  crit: notable
  conf: 0.9
  all:
  - id: network-provider-service-path
  - id: micro-behaviors/os/registry/keys::providerpath-value-name
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/app/system/reactos::system-component
  - id: well-known/lib/native/win32-bindings::win32more-generated-bindings
  - id: well-known/lib/crypto/mit-krb5::source-tree-context
  - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
  - id: well-known/tool/offensive/psbits::source-tree-member

- id: npp-order-value-service
  desc: PROVIDERORDER and NetworkProvider service references
  crit: notable
  conf: 0.9
  all:
  - id: network-provider-order-value
  - id: network-provider-service-path
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/app/system/reactos::system-component
  - id: well-known/lib/native/win32-bindings::win32more-generated-bindings
  - id: well-known/lib/crypto/mit-krb5::source-tree-context
  - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
  - id: well-known/tool/offensive/psbits::source-tree-member
  - id: metadata/package/tooling::dependencies-clrph-library

- id: registry-write-apis-with-system-autorun-references
  for: [pe]
  desc: Registry-write APIs and system autorun names
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  unless:
  - id: native-system-registry-product-context
  # Infection containers carry registry strings from displaced benign hosts.
  - id: objectives/impact/infect/binary/carrier::facehacker-delimited-host-carrier
  - id: well-known/app/utility/
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/sysadmin/sysinternals/
  # DesktopMania manages the user's ScreenSaveActive setting as part of its
  # wallpaper/screensaver feature; that is product configuration, not covert
  # persistence.
  - id: well-known/unwanted/desktopmania::autonavigator-desktopmania-registry-key
  any:
  - id: micro-behaviors/os/registry/keys::appinit-registry-values
  - id: micro-behaviors/os/registry/keys::lsa-package-registry-path
  - id: micro-behaviors/os/registry/keys::lsa-package-list-value-name
  - id: print-monitor-registry
  - id: print-processor-registry
  - id: micro-behaviors/os/registry/keys::time-provider-registry
  - id: netsh-helper-registry
  - id: winsock-provider-catalog
  - id: micro-behaviors/os/registry/keys::screensaver-registry-values
  - id: silentprocessexit-registry
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/

- id: high-risk-dll-registry-persistence
  desc: High-risk DLL registry persistence
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/registry/keys::appinit-dlls-value-name
  - id: micro-behaviors/os/registry/keys::loadappinit-policy-value
  - id: micro-behaviors/os/registry/keys::appcert-dlls-registry-path
  - id: micro-behaviors/os/registry/keys::lsa-package-registry-path
  - id: print-monitor-registry
  - id: print-processor-registry
  - id: micro-behaviors/os/registry/keys::time-provider-registry
  - id: netsh-helper-registry
  - id: winsock-provider-catalog
- id: silentprocessexit-registry
  desc: SilentProcessExit monitor registry surface
  crit: notable
  conf: 0.9
  attack: T1546.012
  any:
  - id: silentprocessexit-registry--rx-9
  - id: silentprocessexit-registry--rx-10
  - id: silentprocessexit-registry--rx-11
  unless:
  - id: well-known/tool/sysadmin/gflags::gflags-tool-identity

- id: masqueraded-service-host-persistence
  for: [pe]
  desc: Service-host masquerade with registry persistence
  crit: hostile
  conf: 0.97
  attack: T1036.005
  # An unsigned PE that fakes Microsoft service-host version info AND writes
  # a system registry persistence surface is an implant installing itself,
  # not a vendor tool: legitimate software carrying Microsoft's service-host
  # identity is signed.
  all:
  - id: objectives/evasion/masquerade/version-resource/service-host::unsigned-service-host-version-resource
  - id: registry-write-apis-with-system-autorun-references

- id: native-system-registry-product-context
  desc: Known system and diagnostic registry implementations
  crit: exception
  conf: 0.99
  any:
  - id: well-known/tool/reverse-engineering/dynamorio::balloon-memory-test-utility
  - id: well-known/app/system/reactos::system-component
  - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
