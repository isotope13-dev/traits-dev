# Specialized Windows system-level registry persistence surfaces.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1547
traits:
composite_rules:
- id: lsa-notification-package-source
  desc: LSA key/value references near registry writer
  crit: suspicious
  conf: 0.94
  for: [csharp, powershell, c, cpp, batch, vbs]
  attack: T1547.002
  all:
  - id: micro-behaviors/os/security/lsa::lsa-control-key-reference
  - id: micro-behaviors/os/registry/credential/reference::lsa-package-list-value-name
  any:
  - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
  - id: micro-behaviors/os/registry/value/write::registry-managed-set-value-source
  - id: micro-behaviors/os/registry/value/write::com-registry-set-value
  - id: micro-behaviors/os/registry/value/write::wscript-regwrite
  near_lines: 3

- id: python-user-path-registry-write
  desc: Python writes user PATH registry value
  crit: notable
  conf: 0.96
  for: [python]
  all:
  - id: "micro-behaviors/os/registry/environment/reference::user-environment-path-regpath"
  - id: micro-behaviors/os/registry/value/write::winreg-setvalue

- id: masqueraded-service-host-persistence
  for: [pe]
  desc: Service-host masquerade with registry persistence
  crit: hostile
  conf: 0.97
  attack: T1036.005
  # An unsigned PE that fakes Microsoft service-host version info AND writes
  # a system registry persistence surface is an implant installing itself,
  # not a vendor tool: legitimate software carrying Microsoft's service-host
  # identity is signed.
  all:
  - id: objectives/evasion/masquerade/version-resource/service-host::unsigned-service-host-version-resource
  - id: micro-behaviors/os/registry/autostart/write::system-autorun-write-api-cooccurrence
