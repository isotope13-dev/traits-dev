# Specialized Windows system-level registry persistence surfaces.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1547
traits:
- id: lsa-notification-package-source
  desc: LSA Notification Packages near control path
  crit: suspicious
  conf: 0.94
  for: [csharp, powershell, c, cpp, batch, vbs]
  attack: T1547.002
  if:
    type: text
    regex: '(?is)\\Control\\Lsa[\s\S]{0,180}Notification Packages\b'

- id: copy-hook-handlers-key-name
  desc: Shell copy-hook handlers key name
  crit: notable
  conf: 0.8
  attack: T1546
  for: [pe, dll]
  if:
    type: text
    word: CopyHookHandlers

composite_rules:
- id: python-user-path-registry-write
  desc: Python writes user PATH registry value
  crit: notable
  conf: 0.96
  for: [python]
  all:
  - id: "micro-behaviors/os/registry/keys/path::user-environment-path-regpath"
  - id: micro-behaviors/os/registry/write::winreg-setvalue

- id: masqueraded-service-host-persistence
  for: [pe]
  desc: Service-host masquerade with registry persistence
  crit: hostile
  conf: 0.97
  attack: T1036.005
  # An unsigned PE that fakes Microsoft service-host version info AND writes
  # a system registry persistence surface is an implant installing itself,
  # not a vendor tool: legitimate software carrying Microsoft's service-host
  # identity is signed.
  all:
  - id: objectives/evasion/masquerade/version-resource/service-host::unsigned-service-host-version-resource
  - id: micro-behaviors/os/registry/access::system-autorun-write-api-cooccurrence
