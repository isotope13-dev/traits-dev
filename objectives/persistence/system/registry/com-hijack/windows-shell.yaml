defaults:
  for: [pe]
  platforms: [windows]
  attack: T1546.015
traits:
  - id: shellexecutehooks-registry-path
    desc: ShellExecuteHooks registry persistence path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)Explorer\\shellexecutehooks
    unless:
      - id: metadata/signed/platform::microsoft-corporation
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: clsid-percent-s-template
    desc: Runtime CLSID format-string template
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: (?i)CLSID\\\{%s\}
    unless:
      - id: metadata/signed/platform::microsoft-corporation
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
composite_rules:
  - id: shellexecutehooks-com-hijack
    desc: ShellExecuteHooks COM hijack persistence
    crit: hostile
    conf: 0.97
    all:
      - id: shellexecutehooks-registry-path
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    any:
      - id: clsid-percent-s-template
      - id: objectives/persistence/system/registry/com-hijack::clsid-registry-path
      - id: micro-behaviors/os/com/registration::inprocserver32-word

  - id: shellexecutehooks-downloaded-payload
    desc: ShellExecuteHooks persistence with downloaded payload
    crit: hostile
    conf: 0.99
    attack: T1105,T1546.015,T1059.001
    all:
      - id: shellexecutehooks-registry-path
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
      - id: micro-behaviors/process/create/exec::shell-execute-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: explorer-shell-hijack-persistence
    desc: Explorer shell namespace hijack persistence
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/access::reg-create-key-a
      - id: micro-behaviors/fs/shell-ops::shell-icon-customization
    any:
      - id: micro-behaviors/fs/shell-ops::explorer-shell-namespace-control
      - id: micro-behaviors/os/registry/manipulate::reg-delete-key-a-symbol
      - id: micro-behaviors/ui/window/notify/message::shell-notify-icon
      - id: micro-behaviors/process/create/exec::shell-execute
      - id: micro-behaviors/process/create/exec::shell-execute-ex
    needs: 2
    unless:
      - id: well-known/lib/platform/wine/
  - id: privileged-shell-hijack-registration
    desc: Privileged Explorer shell hijack registration
    crit: suspicious
    conf: 0.95
    all:
      - id: explorer-shell-hijack-persistence
      - id: objectives/privilege-escalation/token-manipulation::dynamic-token-privilege-chain
    any:
      - id: micro-behaviors/process/create/exec::shell-execute
      - id: micro-behaviors/process/create/exec::shell-execute-ex
      - id: micro-behaviors/process/create/system::shell-execute-ex-a
