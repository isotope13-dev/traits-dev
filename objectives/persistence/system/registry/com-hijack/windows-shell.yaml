defaults:
  for: [pe]
  platforms: [windows]
  attack: T1546.015
composite_rules:
  - id: unsigned-shell-hooks-com-registration-profile
    desc: Unsigned ShellExecuteHooks COM write profile
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/com/registration::shell-hooks-registry-api-profile
      - id: micro-behaviors/os/com/registration::inprocserver32-word
      - id: micro-behaviors/os/com/registration::clsid-registry-key-path
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: shellexecutehooks-downloaded-payload
    desc: ShellExecuteHooks persistence with downloaded payload
    crit: hostile
    conf: 0.99
    attack: T1105,T1546.015,T1059.001
    all:
      - id: micro-behaviors/os/registry/keys/execution::shellexecutehooks-registry-path
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: explorer-shell-hijack-persistence
    desc: Explorer shell namespace hijack persistence
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/access::reg-create-key-a
      - id: micro-behaviors/fs/shell-ops::shell-icon-customization
    any:
      - id: micro-behaviors/fs/shell-ops::explorer-shell-namespace-control
      - id: micro-behaviors/os/registry/manipulate::reg-delete-key-a-symbol
      - id: micro-behaviors/ui/graphics/icon::shell-notify-icon
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
    needs: 2
    unless:
      - id: well-known/lib/platform/wine/
  - id: privileged-shell-hijack-registration
    desc: Privileged Explorer shell hijack registration
    crit: suspicious
    conf: 0.95
    all:
      - id: explorer-shell-hijack-persistence
      - id: micro-behaviors/os/privilege/token::token-privilege-adjustment-references
    any:
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex-a
