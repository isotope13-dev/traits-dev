defaults:
  for: [pe]
  platforms: [windows]
  attack: T1546.015
composite_rules:
  - id: shellexecutehooks-downloaded-payload
    desc: ShellExecuteHooks persistence with downloaded payload
    crit: hostile
    conf: 0.99
    attack: T1105,T1546.015,T1059.001
    all:
      - id: micro-behaviors/os/registry/autostart/reference::shellexecutehooks-registry-path
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
      - id: micro-behaviors/os/handler/open::shell-execute-a
    unless:
      - id: metadata/installer/product/

  - id: explorer-shell-hijack-persistence
    desc: Explorer shell namespace hijack persistence
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/create::reg-create-key-a
      - id: micro-behaviors/ui/graphics/icon::shell-icon-customization
    any:
      - id: micro-behaviors/os/application/shell-namespace::explorer-shell-namespace-control
      - id: micro-behaviors/os/registry/delete::reg-delete-key-a-symbol
      - id: micro-behaviors/ui/graphics/icon::shell-notify-icon
      - id: micro-behaviors/os/handler/open::shell-execute
      - id: micro-behaviors/os/handler/open::shell-execute-ex
    needs: 2
  - id: privileged-shell-hijack-registration
    desc: Privileged Explorer shell hijack registration
    crit: suspicious
    conf: 0.95
    all:
      - id: explorer-shell-hijack-persistence
      - id: micro-behaviors/os/privilege/token/adjust::token-privilege-adjustment-references
    any:
      - id: micro-behaviors/os/handler/open::shell-execute
      - id: micro-behaviors/os/handler/open::shell-execute-ex
      - id: metadata/binary/symbols/name/process::shell-execute-ex-a
