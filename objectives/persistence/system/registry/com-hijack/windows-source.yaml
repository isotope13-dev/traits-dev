defaults:
  for:
    - c
    - cpp
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: inprocserver32-rot13
    desc: ROT13-encoded InprocServer32 path
    crit: suspicious
    conf: 0.97
    attack: T1546.015
    for:
      - c
      - cpp
    if:
      type: text
      substr: VacebpFreire32
  - id: clsid-registry-path-rot13
    desc: ROT13-encoded CLSID registry path
    crit: suspicious
    conf: 0.95
    for:
      - c
      - cpp
    if:
      type: text
      word: PYFVQ
composite_rules:
  - id: clsid-inprocserver32-write-chain
    for: [pe]
    desc: CLSID InprocServer32 ProxyStub chain
    crit: suspicious
    conf: 0.95
    attack: T1546.015
    all:
      - id: micro-behaviors/os/com/registration::clsid-registry-key-path
      - id: micro-behaviors/os/com/registration::clsid-inprocserver32-key-path
      - id: objectives/command-and-control/dropper/staging/native/payload::proxystubclsid32-registry-fragment
  - id: active-setup-com-hijack-persistence
    for: [pe]
    desc: Active Setup MigHost COM hijack
    crit: hostile
    conf: 0.98
    attack: T1547.014
    all:
      - id: clsid-inprocserver32-write-chain
      - id: micro-behaviors/os/registry/access::active-setup-fragment
      - id: well-known/app/system/windows-migration::mighost-command-template
