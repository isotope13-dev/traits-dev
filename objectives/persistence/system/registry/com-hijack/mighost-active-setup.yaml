# Existing Active Setup COM-hijack evidence with MigHost references.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: mighost-active-setup-com-hijack
  desc: MigHost clues with Active Setup COM hijack
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/persistence/system/registry/com-hijack::active-setup-com-hijack-persistence
  - id: well-known/app/system/microsoft/migration::mighost-load-dll-server-log
  - id: well-known/app/system/microsoft/migration::mighost-volatile-registry-log
  any:
  - id: micro-behaviors/os/com/interface::clsid-from-string
  - id: micro-behaviors/os/registry/read::registry-read-api-chain
  - id: micro-behaviors/os/registry/autostart/reference::active-setup-key
  attack: T1547.001,T1546.015
