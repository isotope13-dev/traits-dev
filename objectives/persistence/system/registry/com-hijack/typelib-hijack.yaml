defaults:
  platforms: [windows]
  attack: T1546.015
  crit: suspicious
  conf: 0.95
  for: [scripts, binaries]
traits:
  - id: typelib-zipline-marker-1
    desc: ZipLine marker in scriptlet (1)
    if:
      type: text
      substr: "Udate_Srv.sct"
  - id: typelib-executable-path
    desc: Executable path in TypeLib redirection
    crit: notable
    if:
      type: text
      regex: '(?i)TypeLib[^\r\n]{0,120}[a-z]:\\[^\r\n]{0,100}\.(sct|dll|ocx)\b'
    unless:
      - type: text
        substr: "C:\\Project\\YourLibName.dll"
      - type: basename
        regex: \.(md|mdx)$
composite_rules:
  - id: typelib-hijack
    desc: Persistence via TypeLib registry hijacking
    all:
      - id: micro-behaviors/os/com/class-factory::web-browser-control-clsid
      - id: micro-behaviors/os/registry/keys/execution::typelib-registry-path
  - id: typelib-hijack-zipline
    desc: Persistence via TypeLib hijacking (ZipLine)
    crit: hostile
    all:
      - id: typelib-hijack
      - id: typelib-zipline-marker-1
  - id: typelib-redirection-generic
    desc: Generic TypeLib redirection to file
    crit: suspicious
    all:
      - id: micro-behaviors/os/registry/keys/execution::typelib-registry-path
      - id: typelib-executable-path
