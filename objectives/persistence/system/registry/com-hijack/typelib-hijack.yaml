defaults:
  platforms: [windows]
  attack: T1546.015
  crit: suspicious
  conf: 0.95
  for: [scripts, binaries]
traits:
  - id: typelib-zipline-marker-1
    desc: ZipLine marker in scriptlet (1)
    if:
      type: text
      substr: "Udate_Srv.sct"
  - id: typelib-executable-path
    desc: Executable path in TypeLib redirection
    crit: notable
    if:
      type: text
      regex: '(?i)TypeLib[^\r\n]{0,120}[a-z]:\\[^\r\n]{0,100}\.(sct|dll|ocx)\b'
    unless:
      - type: text
        substr: "C:\\Project\\YourLibName.dll"
      - type: basename
        regex: \.(md|mdx)$
composite_rules:
  - id: typelib-hijack-zipline
    desc: Persistence via TypeLib hijacking (ZipLine)
    crit: hostile
    all:
      - id: micro-behaviors/os/registry/com/reference::browser-clsid-typelib-path
      - id: typelib-zipline-marker-1
  - id: typelib-scriptlet-hijack
    desc: TypeLib scriptlet redirection with registry setter
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/com/reference::typelib-registry-path
      - id: micro-behaviors/os/com/automation::scriptlet-element-or-path-reference
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    any:
      - id: objectives/persistence/system/registry/com-hijack::python-typelib-script-moniker-write
      - id: objectives/persistence/system/registry/com-hijack::python-typelib-script-moniker-setvalueex
      - id: micro-behaviors/data/property/write::powershell-provider-property-command-text
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: typelib-redirection-generic
    desc: Generic TypeLib redirection to file
    crit: suspicious
    all:
      - id: micro-behaviors/os/registry/com/reference::typelib-registry-path
      - id: typelib-executable-path
