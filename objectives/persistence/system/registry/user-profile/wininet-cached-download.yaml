defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: wininet-cached-download-run-key-clues
    desc: WinInet PHP and cached download APIs with Run key write clues
    crit: suspicious
    conf: 0.93
    attack: T1071.001,T1105,T1547.001
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url-php-endpoint-reference
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-cache-str
    unless:
      - id: metadata/signed/platform/
      - id: metadata/file/profile/installer/product/catalog/
