defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: encoded-invocation-registry-write
    desc: Registry write alongside encoded shell invocation
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/registry/value/write::powershell-registry-property-write
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/process/create/shell/interpreter::powershell-process-call
      - id: metadata/lang/source/syntax/argument::powershell-encodedcommand-or-ec-option
