defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1112,T1027
  mbc: B0024,B0032

composite_rules:
  - id: rc4-obfuscated-hkcu-stage
    desc: Obfuscated RC4 JScript stages a payload through HKCU
    crit: hostile
    conf: 0.99
    attack: T1112,T1027,T1059.007
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: objectives/persistence/system/registry/com-hijack::current-user-hive-marker
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: objectives/anti-static/obfuscation/code-metrics/line-shape::js-packed-numeric-xor-blob
      - id: micro-behaviors/data/string/conversion::tostring-token
