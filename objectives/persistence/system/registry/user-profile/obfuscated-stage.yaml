defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1112,T1027
  mbc: B0024,B0032

composite_rules:
  - id: rc4-obfuscated-hkcu-stage
    desc: Obfuscated RC4 JScript stages a payload through HKCU
    crit: hostile
    conf: 0.99
    attack: T1112,T1027,T1059.007
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::js-rc4-implementation
      - id: micro-behaviors/os/registry/hive/reference::hkcu-hive
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
      - id: micro-behaviors/data/bitwise/xor/expression::digit-dense-long-line-xor-expression
      - id: micro-behaviors/data/string/conversion::tostring-token
