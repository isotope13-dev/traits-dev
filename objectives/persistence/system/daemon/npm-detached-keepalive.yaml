# An npm package whose install hook launches a silent detached unref'd Node
# child and includes an empty setInterval() keepalive loop persists a headless
# Node daemon process after npm install finishes.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript, typescript]
  attack: T1195.002,T1543

composite_rules:
  - id: npm-install-keepalive-daemon-worker
    desc: npm install hook starts silent detached keepalive daemon
    crit: hostile
    conf: 0.96
    scope: package
    all:
      - id: objectives/supply-chain/trojanized/package/install-hook::npm-install-hook-silent-detached-child
      - id: micro-behaviors/time/schedule/interval::js-empty-interval-keepalive
