defaults:
  platforms: [linux]
  for: [elf]
  attack: T1543

composite_rules:
  # A self-path lookup, read/write xattr pair, and advisory lock form the
  # install-marker/single-instance mechanism. Encryption and a generated
  # ExecStart unit distinguish the implant shape from backup/indexing tools.
  - id: encrypted-xattr-marked-daemon-install
    desc: Encrypted daemon marks and locks its installed executable
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::native-chacha-runtime-string-table
      - id: micro-behaviors/fs/link/symlink::readlink
      - id: micro-behaviors/fs/attributes/xattr::setxattr-func
      - id: micro-behaviors/fs/attributes/xattr::xattr-get-getxattr
      - id: micro-behaviors/fs/lock/flock::flock-fn
      - id: micro-behaviors/os/service/config::exec-start-text
