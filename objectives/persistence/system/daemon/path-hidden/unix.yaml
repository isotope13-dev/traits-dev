defaults:
  platforms: [unix]
  for: [shell, scripts, binaries, elf]
  attack: "T1543"
traits:
- id: rc-local-hidden-system-bin--rx-2
  desc: rc.local path marker
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: etc/rc.local
- id: rc-local-hidden-system-bin--rx-3
  desc: local init script path marker
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: d/local.sh
# Each variant below anchors on `/usr/`. The previous `(usr/)?(s?bin|...)`
# made the `usr/` optional, so `bin` matched as an interior path component and
# any relative build path ending in `bin/.something` counted as a write to
# /usr/bin -- apptainer's tools/install-unprivileged.sh (`cat >utils/bin/.wrapper`,
# and the same under libexec/apptainer/bin) and ncbi-blast's install.sh.in
# both did. A leading token-boundary character class would have been the more
# faithful fix, but `.{0,40}` in front of one explodes the lazy DFA (cleave's
# `regex-cost` reports it), so this requires the /usr prefix instead. The cost
# is bare /bin/.x and /sbin/.x, which are symlinks into /usr on every current
# distro; /usr/bin, /usr/sbin and /usr/local/bin all still match.
- id: reboot-hidden-system-bin-cron
  desc: Reboot cron hidden system binary
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '@reboot.{0,120}/usr/(local/)?s?bin/\.[A-Za-z0-9][A-Za-z0-9_-]*'
- id: write-hidden-system-bin--rx-5
  desc: "Matches 'usr/local/bin'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(cp|mv).{0,120}/usr/(local/)?s?bin/\.[A-Za-z0-9][A-Za-z0-9_-]*'
- id: write-hidden-system-bin--rx-6
  desc: "Matches 'usr/local/bin'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(install|dd).{0,120}/usr/(local/)?s?bin/\.[A-Za-z0-9][A-Za-z0-9_-]*'
- id: write-hidden-system-bin--rx-7
  desc: "Matches 'usr/local/bin'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(tee|cat).{0,40}/usr/(local/)?s?bin/\.[A-Za-z0-9][A-Za-z0-9_-]*'
- id: write-hidden-system-bin--rx-8
  desc: "Matches 'usr/local/bin'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(printf|echo).{0,120}/usr/(local/)?s?bin/\.[A-Za-z0-9][A-Za-z0-9_-]*'
composite_rules:
- id: hidden-system-daemon-persistence
  for: [elf, shell, python, javascript, ruby, php, lua, perl, applescript]
  desc: Hidden system binary persistence
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/evasion/file-hiding/path-system::hidden-system-bin-reference
  any:
  - id: rc-local-hidden-system-bin
  - id: reboot-hidden-system-bin-cron
  - id: write-hidden-system-bin
- id: rc-local-hidden-system-bin
  for: [elf, shell, python, javascript, ruby, php, lua, perl, applescript]
  desc: rc.local hidden system binary
  crit: suspicious
  conf: 0.92
  all:
  - id: objectives/evasion/file-hiding/path-system::hidden-system-bin-reference
  any:
  - id: rc-local-hidden-system-bin--rx-2
  - id: rc-local-hidden-system-bin--rx-3
  near_bytes: 256
- id: write-hidden-system-bin
  desc: Writes hidden system binary
  crit: suspicious
  conf: 0.9
  any:
  - id: write-hidden-system-bin--rx-5
  - id: write-hidden-system-bin--rx-6
  - id: write-hidden-system-bin--rx-7
  - id: write-hidden-system-bin--rx-8
  unless:
  - id: metadata/package/testing/presence/harness::perl-test-file
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  downgrade:
    any:
      - id: metadata/build/package/recipe::gentoo-ebuild-recipe
