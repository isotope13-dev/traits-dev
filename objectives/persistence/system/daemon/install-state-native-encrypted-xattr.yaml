defaults:
  platforms: [linux]
  for: [elf]
  attack: T1543

composite_rules:
  # A self-path lookup, read/write xattr pair, and advisory lock form the
  # install-marker/single-instance mechanism. In the analyzed family the
  # xattr lands on an unrelated always-present system file (disguised as a
  # security.selinux label), not on the installed binary; the description
  # therefore does not claim the xattr target. Encryption and a generated
  # ExecStart unit distinguish the implant shape from backup/indexing tools.
  - id: encrypted-xattr-marked-daemon-install
    desc: Encrypted daemon marks install state and locks its executable
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::compact-opaque-chacha-rodata-profile
      - id: micro-behaviors/fs/link::readlink
      - id: micro-behaviors/fs/attributes/xattr::setxattr-func
      - id: micro-behaviors/fs/attributes/xattr::xattr-get-getxattr
      - id: micro-behaviors/fs/lock::flock-fn
      - id: micro-behaviors/os/service/unit-field::exec-start-text
