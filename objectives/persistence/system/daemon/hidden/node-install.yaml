# An install hook that copies a script into the consumer's tree and launches
# it detached. The hook-file rules under supply-chain convict the planting;
# this states the persistence -- a detached child that outlives the install
# and survives in the victim's own project directory is a daemon the victim
# never asked for, launched by a package manager rather than a service
# manager.
#
# Worked example: the @tushar-br editing-pack installer, whose hook copies a
# launcher into the consumer tree and spawns it detached with stdio ignored.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, zip, tar, package.json, archives]
  attack: T1543,T1195.002

composite_rules:
  - id: install-hook-detached-daemon-child
    desc: Install hook launches detached daemon in consumer tree
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: objectives/supply-chain/install-hook/scripts/hook-file::install-hook-detached-child-launch
      - id: micro-behaviors/process/create/spawn::detached-true
