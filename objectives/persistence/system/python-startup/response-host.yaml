defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: startup-hook-response-host-code-loader
    desc: Startup hook executes response-selected code
    crit: hostile
    conf: 0.99
    attack: T1546,T1102.001,T1059.006
    all:
      - id: objectives/command-and-control/channel/deaddrop/url::python-response-host-code-exec
    any:
      - id: micro-behaviors/process/interpreter/python::sitecustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
