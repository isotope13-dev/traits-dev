# Python imports these conventional hooks when a fresh interpreter starts.
# Reuse the shell verdict so ordinary startup networking stays notable.
defaults:
  for: [python]
  platforms: [unix]

composite_rules:
  - id: connected-python-socket-shell
    desc: Python connects socket to shell standard streams
    crit: component
    any:
      - id: objectives/command-and-control/reverse-shell/fd-redirect::inline-python-reverse-shell
      - id: objectives/command-and-control/reverse-shell/fd-redirect::python-connected-socket-subprocess-shell

  - id: startup-hook-socket-shell
    desc: Python startup hook contains a socket reverse shell
    crit: hostile
    conf: 0.99
    attack: T1546,T1059.006
    all:
      - id: connected-python-socket-shell
    any:
      - id: micro-behaviors/process/interpreter/python::sitecustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
