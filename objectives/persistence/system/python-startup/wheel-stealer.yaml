# Archive correlation: an executable startup surface and a credential stealer
# ship together. This does not assert resolution of the imported module.
composite_rules:
  - id: wheel-pth-with-credential-stealer
    desc: Wheel ships .pth hook and credential stealer
    crit: hostile
    conf: 0.96
    platforms: [unix, windows]
    for: [whl, python]
    scope: archive
    attack: T1546,T1195.002
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: objectives/exfiltration/stealer::encoded-multi-developer-secret-exfil
