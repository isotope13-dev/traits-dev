defaults:
  platforms: [unix, windows]
  crit: hostile
  conf: 0.96

composite_rules:
  # Archive correlation proves the hook and stealer ship together.
  - id: wheel-pth-with-credential-stealer
    desc: Wheel ships .pth hook and credential stealer
    for: [whl, python]
    scope: archive
    attack: T1546.018,T1195.002
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
    any:
      - id: objectives/exfiltration/stealer/credential/developer::encoded-multi-developer-secret-exfil
      - id: objectives/exfiltration/stealer/credential/environment/current-process::python-env-sweep-concealed-upload
      - id: objectives/exfiltration/stealer/credential/environment/other-process::python-proc-secrets-encoded-upload
      - id: objectives/exfiltration/stealer/configuration/environment/process::python-proc-environ-requests-post
      - id: objectives/exfiltration/stealer/credential/value/payload::python-credential-http-upload

  - id: customize-hook-with-credential-stealer
    desc: Python customize hook contains credential stealer
    for: [python]
    scope: leaf
    attack: T1546.018
    all:
      - id: objectives/persistence/login/python-startup::python-startup-customize-hook
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    any:
      - id: objectives/exfiltration/stealer/credential/developer::encoded-multi-developer-secret-exfil
      - id: objectives/exfiltration/stealer/credential/environment/current-process::python-env-sweep-concealed-upload
      - id: objectives/exfiltration/stealer/credential/environment/other-process::python-proc-secrets-encoded-upload
      - id: objectives/exfiltration/stealer/credential/value/payload::python-credential-http-upload
