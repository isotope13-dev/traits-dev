composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  attack: T1546,T1195.002
  mbc: E1546
  id: shipped-pth-executes-encoded-payload
  desc: Shipped .pth runs an encoded payload
  crit: hostile
  conf: 0.97
  # The vendor's own install notice (datatailr) runs a module from its
  # distribution through the same encoded hook. Demote one step, keep it reportable.
  downgrade:
    scope: archive
    any:
    - id: well-known/app/data/datatailr::install-notice-context
  all:
  - id: micro-behaviors/process/interpreter/python::pth-startup-import
  - id: micro-behaviors/data/decode/base64/call::b64decode-call
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
