# The interpreter-mandated hook name is a real activation surface. Process
# detachment alone is a capability; remote-code polling establishes the abuse.
defaults:
  platforms: [linux, macos]
  for: [python]

composite_rules:
  - id: startup-hook-threadpool-code-daemon
    desc: Startup hook launches thread-pool code daemon
    crit: hostile
    conf: 0.99
    attack: T1546,T1059.006
    all:
      - id: objectives/command-and-control/remote-command/http-poll::python-threadpool-http-exec-daemon
    any:
      - id: micro-behaviors/process/interpreter/python::sitecustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::python-site-hook-name-compare

  - id: startup-hook-remote-code-daemon
    desc: Python startup hook launches remote-code polling daemon
    crit: hostile
    conf: 0.99
    attack: T1546,T1059.006
    all:
      - id: objectives/command-and-control/remote-command/http-poll::python-polled-compiled-code-daemon
    any:
      - id: micro-behaviors/process/interpreter/python::sitecustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::python-site-hook-name-compare

  - id: startup-hook-file
    desc: Python startup hook file with exec
    crit: suspicious
    conf: 0.93
    platforms: [unix, windows]
    size_max: 131072
    attack: T1546
    all:
    - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    any:
    - id: micro-behaviors/process/interpreter/python::sitecustomize-startup-hook
    - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
    unless:
    - id: well-known/tool/development/testing/
    - id: well-known/tool/development/debug/

  - id: startup-hook-helper-code-daemon
    desc: Startup hook runs HTTP helper code daemon
    crit: hostile
    conf: 0.99
    attack: T1546,T1059.006
    all:
      - id: objectives/command-and-control/remote-command/http-poll::python-detached-helper-exec-poll
    any:
      - id: micro-behaviors/process/interpreter/python::sitecustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::python-site-hook-name-compare
