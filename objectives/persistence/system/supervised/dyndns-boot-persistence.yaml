# Boot persistence installed alongside a dynamic-DNS callback host.
#
# Registering a launch agent with `RunAtLoad`, or enabling a user systemd unit,
# is how a program arranges to start without being asked. Plenty of legitimate
# software does exactly that -- an updater, an agent, a sync daemon -- and the
# persistence traits alone say nothing about intent.
#
# What supplies the intent is where the persisted program points. A
# `duckdns`/`no-ip`/`ddns`/`hopto` hostname is free, registered in minutes, and
# repointable at will; vendors ship against domains they own, because a support
# contract requires an address that outlives a free-tier account. Software that
# arranges to run at every boot *and* phones a dynamic-DNS host has chosen
# infrastructure that only makes sense if the operator expects to move.
#
# Both facts sit in the same installer script, so this stays at file scope --
# persistence established by one component and an unrelated callback string
# elsewhere in a package is not the same claim.
#
# A pinned external HTTP IP is the same choice without a DNS name. Legitimate
# installers resolve a domain they own; a numeric public address is how the
# operator stays up when the name is taken down. That callback is weaker than
# a free dynamic-DNS suffix on its own, so the IP composite does not treat a
# bare `schtasks /create` as enough — that co-occurrence stays the scheduled
# task clue. It still requires the launchd `RunAtLoad` plist or the user
# systemd enable that the dynamic-DNS composite already uses.
#
# Worked example: an installer whose `postinstall` writes a launchd
# `RunAtLoad` plist, runs `systemctl --user enable`, and reports to either a
# `duckdns` host or a literal external HTTP IP.
defaults:
  crit: hostile
  conf: 0.94
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1543,T1071.004
  mbc: B0030

composite_rules:
  - id: boot-persistence-with-dyndns-callback
    desc: Boot persistence paired with dynamic DNS host
    all:
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname
    any:
      - id: micro-behaviors/os/service/launchagent::node-launchd-runatload-plist
      - id: micro-behaviors/os/service/config::systemctl-user-enable

  - id: boot-persistence-with-raw-ip-callback
    desc: Boot persistence paired with raw HTTP IP
    attack: T1543,T1071.001
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
    any:
      - id: micro-behaviors/os/service/launchagent::node-launchd-runatload-plist
      - id: micro-behaviors/os/service/config::systemctl-user-enable
