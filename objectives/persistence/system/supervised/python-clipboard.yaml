defaults:
  platforms: [windows, macos]
  for: [python]
  attack: T1115,T1565.001

composite_rules:
  - id: persistent-python-clipboard-crypto-clipper
    desc: Python cryptocurrency clipboard clipper installs login persistence
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::python-clipboard-crypto-clipper
    any:
      - id: objectives/persistence/login/registry/run-key::python-winreg-run-key-persistence
      - id: objectives/persistence/system/launchd/source::source-launchd-user-persistence
