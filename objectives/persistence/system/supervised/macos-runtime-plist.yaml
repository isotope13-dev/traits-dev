# LaunchAgent persistence assembled at run time rather than shipped as a plist
# file. The program builds an NSDictionary of the launchd keys and writes it to
# ~/Library/LaunchAgents/<label>.plist, so the `<key>RunAtLoad</key>` XML the
# sibling rules in this directory look for never appears anywhere in the sample
# -- only the bare key names do, as ordinary string constants.
#
# Building a LaunchAgent this way is a normal thing for an installer or an
# auto-updater to do, so the assembly composite stays suspicious. It becomes
# hostile only when the agent is pointed at a payload the program also went to
# the trouble of hiding.
defaults:
  platforms: [macos]
  attack: T1543.001
  conf: 0.9

traits:
  - id: runatload-plist-key-literal
    desc: RunAtLoad plist key literal
    crit: component
    for: [macho, dylib, scripts]
    if:
      type: text
      word: RunAtLoad
  - id: programarguments-plist-key-literal
    desc: ProgramArguments plist key literal
    crit: component
    for: [macho, dylib, scripts]
    if:
      type: text
      word: ProgramArguments

composite_rules:
  - id: runtime-assembled-launchagent
    desc: Assembles a LaunchAgent plist at runtime
    crit: suspicious
    conf: 0.92
    for: [macho, dylib]
    all:
      - id: runatload-plist-key-literal
      - id: programarguments-plist-key-literal
      - id: micro-behaviors/os/service/config::launchagents-path
    unless:
      - id: well-known/app/data/curatorbin::baobab-launchagent-template-context

  - id: hidden-payload-launchagent
    desc: LaunchAgent persists a hidden app bundle
    crit: hostile
    conf: 0.97
    for: [macho, dylib]
    all:
      - id: runtime-assembled-launchagent
      - id: objectives/evasion/file-hiding/bundle::hidden-app-in-resources-path
