defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003

composite_rules:
  - id: wordpress-concealed-memory-restoration
    desc: Hidden WordPress plugin recreates executable files alongside shared-memory reads
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/eval/source::php-shared-memory-file-recreation-inclusion
      - id: objectives/evasion/file-hiding/plugin::wordpress-plugin-admin-list-removal
      - id: micro-behaviors/process/hook/event::wordpress-early-plugins-loaded-hook

  - id: wordpress-concealed-option-restoration
    desc: Concealed plugin decodes compressed option data and recreates loadable files
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/evasion/file-hiding/plugin::wordpress-plugin-admin-list-removal
      - id: micro-behaviors/data/compression::php-base64-wrapped-decompression
      - id: micro-behaviors/fs/write/file/full::php-missing-file-write
      - id: micro-behaviors/process/interpreter/eval/source::php-variable-file-load
      - id: micro-behaviors/process/hook/event::wordpress-early-plugins-loaded-hook
    any:
      - id: micro-behaviors/data/db/access::php-get-option
      - id: micro-behaviors/data/db/access::php-direct-option-value-query
