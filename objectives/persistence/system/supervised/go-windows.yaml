defaults:
  platforms: [windows]
  for: [go]
  attack: T1543.003,T1547.001,T1053.005

# A watchdog that reasserts several independent persistence surfaces is a
# technique-level signal. It does not depend on a malware-family name or on
# the particular service/task labels chosen by an operator.
composite_rules:
  - id: go-reasserted-persistence-surfaces
    desc: Go watchdog reasserts service, Run key, and scheduled-task persistence
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/control::go-sc-create-command
      - id: micro-behaviors/os/autorun/scheduled::go-schtasks-create-command
      - id: micro-behaviors/os/registry/manipulate::go-registry-set-string-value-call
      - id: micro-behaviors/os/registry/keys::go-currentversion-run
      - id: micro-behaviors/fs/file/stat::go-os-stat-missing-check
    near_bytes: 4096
