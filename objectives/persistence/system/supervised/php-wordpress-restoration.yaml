defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003

composite_rules:
  # A hook alone is ordinary plugin behavior. The file recreation, encoded
  # reconstruction and PHP data handler add a recovery mechanism to an
  # independently established request-driven command shell. This is bounded
  # co-occurrence, not an interprocedural callback or payload-value proof.
  - id: wordpress-masked-webshell-file-restoration
    desc: WordPress masked webshell file restoration
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/hook/event::wordpress-init-hook
      - id: micro-behaviors/fs/write/file/full::php-missing-file-write
      - id: micro-behaviors/data/decode/base64::php-base64-decode-call
      - id: micro-behaviors/data/encoding/xor::php-cyclic-xor-string-reconstruction
      - id: objectives/command-and-control/backdoor/webshell/config::htaccess-command-webshell-handler
