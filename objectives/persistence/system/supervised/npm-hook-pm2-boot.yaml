# An npm install hook runs a script that puts one of the package's own files
# under the PM2 process manager, saves the process list and generates the
# boot-startup unit, so the bundled script survives reboots of the developer
# machine. Packages document `pm2 start` for users; they do not register
# themselves as a boot service from an install hook.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript]
  attack: T1543,T1195.002

traits:
  - id: pm2-start-script-command-text
    desc: PM2 start command for a script file
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '["''`]pm2\s+start\s+[\w./-]{1,80}\.(c|m)?js\b'
  - id: pm2-startup-command-text
    desc: PM2 boot-startup command text
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '["''`]pm2\s+startup\b'

composite_rules:
  - id: install-hook-pm2-boot-persistence
    desc: Install hook registers a bundled script at boot
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::node-install-hook-local-script
      - id: pm2-start-script-command-text
      - id: pm2-startup-command-text
