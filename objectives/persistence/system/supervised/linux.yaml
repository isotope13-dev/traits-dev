# Name-independent systemd persistence. This is separate from the C-specific
# service family: compiled Go and Rust installers expose the same unit fields.
defaults:
  platforms: [linux, unix]
  for: [elf, c, cpp, rust]
  attack: T1543.002

traits:
  - id: bencher-runner-service-name
    desc: Bencher Runner service name
    crit: notable
    conf: 0.95
    platforms: [unix]
    for: [rust]
    if:
      type: text
      substr: Bencher Runner
  - id: bencher-runner-service-id
    desc: Bencher runner service identifier
    crit: notable
    conf: 0.95
    platforms: [unix]
    for: [rust]
    if:
      type: text
      substr: bencher-runner

composite_rules:
  - id: c-generic-systemd-unit-persistence
    desc: Linux artifact defines restarting systemd unit
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
    unless:
      - id: bencher-runner-service-name
      - id: bencher-runner-service-id
      - id: metadata/file/catalog/service::deployment-helper-context
      - id: metadata/package/testing/
