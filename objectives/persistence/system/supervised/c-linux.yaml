defaults:
  platforms: [unix]
  for: [c, elf]
  attack: T1543.002

traits:
  - id: c-system-health-service-unit
    desc: C system health service unit
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: /etc/systemd/system/system-health-monitor.service

  - id: c-systemctl-health-enable
    desc: C enables health service
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: systemctl enable system-health-monitor.service

composite_rules:
  - id: c-linux-systemd-persistence
    desc: C Linux systemd persistence
    crit: hostile
    conf: 0.98
    all:
      - id: c-system-health-service-unit
    any:
      - id: c-systemctl-health-enable
      - id: micro-behaviors/os/service/restart-policy::restart-always-text

  # Redundant autostart is the tell. An installer normally picks one mechanism;
  # an implant writes a unit, rc.local, and profile.d so that removing any one
  # still leaves the box infected. Requiring the write capability keeps path
  # constants in documentation and headers out.
  - id: c-multi-surface-boot-persistence
    desc: C implant writes three boot-start surfaces
    crit: hostile
    conf: 0.97
    attack: T1543.002,T1053.003,T1037.004
    all:
      - id: micro-behaviors/fs/file/write/direct::c-fopen-overwrite-mode
    any:
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: objectives/persistence/system/init/boot::etc-rc-local
      - id: micro-behaviors/process/interpreter/shell::system-profiled-path
    needs: 3
    near_bytes: 1200
