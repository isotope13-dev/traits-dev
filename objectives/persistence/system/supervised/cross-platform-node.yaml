# One JavaScript file that hands the *same* payload to two different user
# service managers, picking by `os.platform()`:
#
#   darwin -> ~/Library/LaunchAgents/<label>.plist with RunAtLoad, then
#             `launchctl bootstrap gui/$UID` + `launchctl kickstart`
#   linux  -> ~/.config/systemd/user/<unit>.service with Restart=, then
#             `systemctl --user enable` + `systemctl --user restart`
#
# Each half on its own is how a legitimate agent installs itself, and the
# atoms stay notable for that reason. Both halves in one file means whatever
# is being registered has to survive on whichever machine the code lands on --
# an installer written for a fleet the author does not control.
#
# The hostile rule adds the context that removes the last benign reading: the
# file ships inside a VS Code extension. An extension's code runs inside the
# editor and is managed by the editor; nothing it legitimately does needs a
# login-time service that outlives the editor process. Marketplace extensions
# that genuinely bundle a language server or debug adapter let the editor
# spawn it -- they do not register it with launchd or systemd.
defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1543
  mbc: B0028

traits:
  # Keep these atoms file-local. A LaunchAgents plist and a systemd unit can
  # legitimately be shipped as separate resources; the suspicious shape here
  # is one installer source that constructs both service-manager payloads and
  # activates them.
composite_rules:
  - id: node-dual-service-manager-autostart
    desc: One script registers macOS and Linux user autostart
    crit: suspicious
    conf: 0.94
    attack: T1543.001,T1543.004
    all:
      - id: micro-behaviors/os/service/launchagent::node-launchd-runatload-installer
      - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
      - id: objectives/persistence/system/init/boot::systemctl-user-enable

  # `for:` keeps the evaluation on the JS member; `scope: outer` lets the
  # VS Code identity come from the extension's other files (package.json main,
  # the activate() entrypoint) rather than requiring it in the installer.
  - id: vscode-extension-dual-autostart-installer
    for: [javascript, typescript, vsix]
    desc: VS Code extension registers OS-level user autostart
    crit: hostile
    conf: 0.97
    attack: T1543.001,T1543.004,T1176
    mbc: B0028,B0032
    scope: outer
    all:
      - id: node-dual-service-manager-autostart
      - id: well-known/lib/development/vscode::vscode-extension-marker
