# One JavaScript file that hands the *same* payload to two different user
# service managers, picking by `os.platform()`:
#
#   darwin -> ~/Library/LaunchAgents/<label>.plist with RunAtLoad, then
#             `launchctl bootstrap gui/$UID` + `launchctl kickstart`
#   linux  -> ~/.config/systemd/user/<unit>.service with Restart=, then
#             `systemctl --user enable` + `systemctl --user restart`
#
# Each half on its own is how a legitimate agent installs itself, and the
# atoms stay notable for that reason. Both halves in one file means whatever
# is being registered has to survive on whichever machine the code lands on --
# an installer written for a fleet the author does not control.
#
# The hostile rule adds the context that removes the last benign reading: the
# file ships inside a VS Code extension. An extension's code runs inside the
# editor and is managed by the editor; nothing it legitimately does needs a
# login-time service that outlives the editor process. Marketplace extensions
# that genuinely bundle a language server or debug adapter let the editor
# spawn it -- they do not register it with launchd or systemd.
defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1543
  mbc: B0028

traits:
  # Keep these atoms file-local. A LaunchAgents plist and a systemd unit can
  # legitimately be shipped as separate resources; the suspicious shape here
  # is one installer source that constructs both service-manager payloads and
  # activates them.
composite_rules:
  - id: node-dual-service-manager-autostart
    desc: One script registers macOS and Linux user autostart
    crit: suspicious
    conf: 0.94
    attack: T1543.001,T1543.004
    # The macOS half is a LaunchAgents directory reference plus an embedded
    # RunAtLoad plist key, which is autostart by itself. The launchd
    # node-installer composite needs a shell-spelled `launchctl bootstrap`
    # within a short window, so it misses Node installers that exec launchctl
    # with an argv array. The Linux half uses the argv-aware user-enable
    # composite for the same reason.
    all:
      - id: micro-behaviors/os/service/launchagent::launchagents-directory-reference
      - id: micro-behaviors/os/service/launchd/config::embedded-runatload-true
      - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
      - id: objectives/persistence/system/supervised::systemd-user-enable-either
    # An uninstall path for both managers marks the tool's own opt-in service.
    downgrade:
      any:
        - id: micro-behaviors/os/service/uninstall::node-dual-service-manager-removal

  # Either argv shape: a same-line `--user enable` call, or a scope spread
  # into the verb (`[...scope, "enable"]`) as Node installers often write it.
  - id: systemd-user-enable-either
    desc: Script enables a user systemd unit, either argv form
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/os/service/configure::source-systemctl-user-enable
      - id: micro-behaviors/os/service/control::source-systemctl-user-spread-enable

  # The hostile claim needs the installer and the VS Code identity in one
  # member file, so the extension itself registers the service. A package that
  # ships a VS Code extension beside a separate CLI is different: the extension
  # only spawns the CLI detached on activation, and the CLI registers its own
  # login services. An outer-scope join across those members mislabels that
  # delegation as extension autostart, so this shape makes no hostile claim.
  - id: vscode-extension-dual-autostart-installer
    desc: VS Code extension registers OS-level user autostart
    crit: hostile
    conf: 0.97
    attack: T1543.001,T1543.004,T1176
    mbc: B0028,B0032
    scope: file
    all:
      - id: node-dual-service-manager-autostart
      - id: well-known/lib/development/vscode::vscode-extension-marker
