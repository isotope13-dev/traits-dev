defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1546
  mbc: F0007

composite_rules:
  - id: wordpress-option-backed-self-restoration
    desc: Restores current plugin source from WordPress options at early startup
    crit: hostile
    conf: 0.99
    near_bytes: 2200
    all:
      - id: micro-behaviors/process/hook/event::wordpress-early-plugins-loaded-hook
      - id: micro-behaviors/data/db/access::php-get-option
      - id: objectives/anti-analysis/self-modify/runtime::php-current-file-overwrite
      - id: micro-behaviors/fs/chmod/modify::php-self-file-read-only
