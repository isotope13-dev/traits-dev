defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1105,T1543

traits:
  - id: remote-agent-upgrade-message
    desc: Server message dispatches agent upgrade
    # Remote worker agents routinely accept upgrade requests; the detached
    # reinstall composite below pairs it with the self-update script.
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'case\s+["'']upgrade_agent["'']\s*:[\s\S]{0,100}handleUpgradeAgent\s*\('

  - id: npm-agent-upgrade-command
    desc: Upgrade script reinstalls npm package
    # A vendor-run self-update reinstalls its own package by name. Neutral on
    # its own: the update source is the registry, not a server-supplied URL.
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\$NPM["'']?\s+install\s+(-g\s+)?["'']?\$PKG'

composite_rules:
  - id: remote-agent-upgrade-persistence
    for: [javascript, npm]
    desc: Server-triggered detached agent self-update
    # Server-commanded self-update by a documented agent (for example the open
    # source @yeaft/webchat-agent) reinstalls the package from the npm registry
    # and restarts the user service. That is software update, not persistence
    # or a payload: nothing here names a server-supplied artifact. Kept at
    # notable so a diff shows the remote update channel.
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: remote-agent-upgrade-message
      - id: npm-agent-upgrade-command
      - id: micro-behaviors/process/interpreter/shell::spawn-bash
    any:
      - id: micro-behaviors/os/service/control::javascript-systemctl-user-service-command
      - id: micro-behaviors/os/service/control::javascript-launchctl-service-command
