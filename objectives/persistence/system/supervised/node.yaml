defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: pm2-startup-command
    desc: PM2 boot-startup configuration command
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(run2|spawnSync)\s*\(\s*pm2\s*,\s*\[\s*["'']startup["'']\s*\]'
  - id: pm2-autonomous-node-start
    desc: Starts PM2 autonomous agent process
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(run2|spawnSync)\s*\(\s*pm2\s*,\s*\[\s*["'']start["''][\s\S]{0,320}AGENT_HUB_AUTONODE_PM2'
  - id: forever-spawn
    desc: Uses forever process manager
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: forever\s+start|spawn\(.{0,220}forever
  - id: nodemon-spawn
    desc: Uses nodemon process manager
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: spawn\(.{0,220}nodemon
