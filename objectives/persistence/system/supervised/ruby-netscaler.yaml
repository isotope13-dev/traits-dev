defaults:
  platforms: [netscaler, appliance, unix]
  for: [ruby]
  attack: T1543.002

traits:


  # Enabling then starting a unit is how every Ruby admin tool installs a
  # service (YaST's VirtConfig enables virtqemud/virtlogd this way); it is a
  # persistence capability, not evidence of intent on its own.
  - id: ruby-systemctl-enable-start
    desc: Enables and starts systemd service
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'systemctl enable[\s\S]{0,160}systemctl start'
    unless:
      - id: objectives/privilege-escalation/modify-service::vagrant-plugins-marker
      - type: text
        substr: va_gov_socks
      - id: metadata/lang/source/syntax/member::machine-communicate-member-reference
      # Commands inside a Vagrant shell provisioner run in the guest VM.
      - id: metadata/build/ecosystem::vagrant-shell-provisioner-block
      - id: metadata/path/directory::test-spec-source-file-component
