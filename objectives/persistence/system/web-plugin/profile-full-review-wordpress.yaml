defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: php-write-near-wp-mu-plugin-path
    desc: WordPress plugin path and PHP write clues
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/application/webapp::wp-mu-plugin-path
      - id: micro-behaviors/fs/write/file/full/unspecified::php-file-put-contents
    near_bytes: 640
    unless:
      - id: metadata/path/software::rudel-source-tree
