# A WordPress cron event whose hook body evaluates PHP source. The scheduled
# hook gives the code durable reactivation; the eval shows what it runs.
# Scheduling alone is routine plugin behavior, and eval alone is common in
# libraries, so the claim requires both within a few lines.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1053.003

composite_rules:
  - id: php-wp-cron-eval-hook
    desc: WordPress cron hook evaluates PHP source
    crit: hostile
    conf: 0.95
    near_lines: 10
    all:
      - id: micro-behaviors/time/schedule/wordpress::wp-schedule-event
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
