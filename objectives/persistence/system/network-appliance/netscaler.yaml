defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]
  attack: T1053

traits:
  - id: netscaler-startupscript-directive
    desc: NetScaler startupScript directive
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: add ns startupScript

  - id: netscaler-flash-config-path
    desc: NetScaler flash config path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '/flash/(ns_?config(/|$)|ns\.conf([./]|$))'

  - id: netscaler-rc-nsf-path
    desc: NetScaler rc.nsf path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: /nsconfig/rc.nsf

  - id: netscaler-rc-nsf-interpreter
    desc: NetScaler rc.nsf interpreter
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/sysadmin/munin/
    if:
      type: text
      regex: '/bin/(perl|sh|bash)\s+[^\n]{0,80}/nsconfig/rc\.nsf\b'

  - id: netscaler-nsroot-cron-path
    desc: NetScaler nsroot cron path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /var/spool/cron/crontabs/nsroot

  - id: netscaler-hidden-agent-path
    desc: NetScaler hidden agent path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/tmp/\.(netscaler_update|netscaler_health|ns-health)'

  - id: netscaler-rc-netscaler-path
    desc: NetScaler rc.netscaler path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: /nsconfig/rc.netscaler

  - id: netscaler-rc-netscaler-append
    desc: Appends to NetScaler startup script
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '>>\s*["'']?/nsconfig/rc\.netscaler\b'

composite_rules:
  - id: netscaler-rc-netscaler-persistence
    desc: NetScaler rc.netscaler persistence
    crit: hostile
    conf: 0.98
    attack: T1037.004
    all:
      - id: netscaler-rc-netscaler-path
      - id: netscaler-rc-netscaler-append

  - id: netscaler-rc-nsf-persistence
    desc: NetScaler rc.nsf persistence
    crit: hostile
    conf: 0.98
    all:
      - id: netscaler-rc-nsf-path
      - id: netscaler-rc-nsf-interpreter


  - id: netscaler-nsroot-cron-persistence
    desc: NetScaler nsroot cron persistence
    crit: hostile
    conf: 0.98
    all:
      - id: netscaler-nsroot-cron-path
    any:
      - id: netscaler-hidden-agent-path
      - id: micro-behaviors/fs/path/secret-config::netscaler-nsconfig-path
