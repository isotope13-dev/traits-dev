defaults:
  platforms: [openwrt, unix]
  for: [lua]
  attack: T1053.003

composite_rules:
  - id: lua-hex-root-crontab-stage
    desc: Lua hex root crontab stage
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/encode/payload::large-hex-string-literal
      - id: micro-behaviors/fs/path/config/scheduled::hex-encoded-root-crontab
    any:
      - id: metadata/lang/source/literal/hex::hex-encoded-wget
      - id: micro-behaviors/fs/path/application/interpreter::hex-encoded-sh
      - id: micro-behaviors/metaprogramming/generation/function::lua-dynamic-load
    needs: 2
