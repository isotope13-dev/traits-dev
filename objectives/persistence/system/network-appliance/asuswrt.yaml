# JFFS user hooks are ASUSWRT-Merlin, not OpenWrt rc.common.
# https://github.com/RMerl/asuswrt-merlin.ng/wiki/User-scripts
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1037.004
traits:
  - id: asuswrt-enable-jffs-scripts
    desc: Enables ASUSWRT JFFS scripts
    crit: notable
    conf: 0.95
    platforms: [unix]
    if:
      type: text
      regex: '(?i)\bnvram\s+set\s+jffs2_scripts=["'']?1(["'']|\s|;|$)'

  - id: asuswrt-wan-start-script-write
    desc: Writes ASUSWRT WAN startup script
    crit: notable
    conf: 0.96
    platforms: [unix]
    if:
      type: text
      regex: '(?i)(printf|echo|cat)\b[^\n]{0,100}/jffs/scripts/wan-start'

composite_rules:
  - id: asuswrt-enable-jffs-wan-script
    desc: Enables and writes an ASUSWRT WAN startup script
    crit: suspicious
    conf: 0.98
    all:
      - id: asuswrt-enable-jffs-scripts
      - id: asuswrt-wan-start-script-write
    unless:
      - id: asuswrt-wan-start-downloader
  - id: asuswrt-wan-start-downloader
    desc: Installs an ASUSWRT WAN startup downloader and shell launch
    crit: hostile
    conf: 0.98
    near_lines: 1
    all:
      - id: asuswrt-wan-start-script-write
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-flag-script
      - id: metadata/lang/source/syntax/command/launch::shell-exec-script-path
