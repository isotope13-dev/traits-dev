# Unit 42, PEERSTITCH, Figure 6: auto-script traversal installs an Apache
# DNS-01 interpreter hook. Renewal mode and interpreter configuration alone
# have legitimate uses; the exploited write supplies the attack context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json]
  attack: T1505

composite_rules:
  - id: acme-dns-challenge-interpreter
    desc: Auto-script traversal with ACME interpreter hook
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/autorun/control::apache-md-dns01-interpreter-handler
    any:
      - id: objectives/privilege-escalation/exploit/vulnerabilities/appliance::fortios-auto-script-path-traversal
      - id: objectives/privilege-escalation/exploit/vulnerabilities/appliance::fortios-auto-script-audit-traversal

  - id: acme-renewal-hook-persistence
    desc: Auto-script exploit installs renewing DNS-01 hook
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: acme-dns-challenge-interpreter
      - id: micro-behaviors/crypto/certificate/usage::apache-md-always-renew-mode
      # Merely naming a DNS handler does not select it: HTTP validation may
      # otherwise be used. Require the DNS-01 selection and configured CA.
      - id: micro-behaviors/crypto/certificate/usage::apache-md-dns01-challenge-selection
      - id: micro-behaviors/crypto/certificate/usage::apache-md-certificate-authority-url
