# Timed reboot/wipe implants drop an init.d boot script and a temp
# marker, then print a countdown before reboot.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1547.011,T1529

traits:
  - id: initd-boot-d-script
    desc: Stages an init.d boot.d start script
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/etc/init\.d/boot\.d/S[0-9]{2}'
  - id: tmp-cyneox-marker
    desc: Stages a /tmp cyneox reboot marker
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: /tmp/xcyneoex
  - id: cyneox-is-here-banner
    desc: Cyneox-is-here reboot status banner
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: cyneox is here

composite_rules:
  - id: boot-d-tmp-reboot-implant
    desc: boot.d script with a /tmp marker
    crit: hostile
    conf: 0.97
    all:
      - id: initd-boot-d-script
      - id: tmp-cyneox-marker
  - id: boot-d-here-banner
    desc: boot.d script with here banner
    crit: hostile
    conf: 0.96
    all:
      - id: initd-boot-d-script
      - id: cyneox-is-here-banner
  - id: tmp-marker-here-banner
    desc: /tmp marker with here banner
    crit: hostile
    conf: 0.95
    all:
      - id: tmp-cyneox-marker
      - id: cyneox-is-here-banner
