defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1547
traits:
  - id: reboot-replacement-marker
    desc: Legacy reboot replacement marker
    crit: notable
    conf: 0.72
    if:
      type: text
      exact: Rename\File%d

composite_rules:
  - id: wininit-reboot-file-replacement
    desc: Reboot-time file replacement via WININIT
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/config/system::wininit-file-replacement-config
      - id: micro-behaviors/fs/file/move::move-file-ex
      - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
    any:
      - id: reboot-replacement-marker
      - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"
  - id: wininit-runonce-launch-persistence
    desc: WININIT and RunOnce launch persistence
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/config/system::wininit-file-replacement-config
      - id: micro-behaviors/fs/file/move::move-file-ex
      - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
      - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"
      - id: metadata/binary/symbols/name/process::winexec
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
    downgrade:
      any:
        - id: metadata/signature/verified/platform::microsoft
        - id: metadata/installer/product/
