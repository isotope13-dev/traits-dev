defaults:
  platforms: [unix]
  crit: notable
  attack: T1037
  for: [shell]
traits:
  - id: sysv-runlevel-start-name
    desc: SysV runlevel start script name
    crit: notable
    conf: 0.95
    attack: T1037.004
    if:
      type: path
      basename: true
      regex: '^S[0-9]{2}[A-Za-z0-9._+-]{1,64}$'
  - id: chkconfig-all-runlevels
    desc: Init runs in all runlevels
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '#\s*chkconfig:\s*-?(0?123456|[0-6]{5,})\s+[0-9]+\s+[0-9]+'
  - id: chkconfig-early-start
    desc: Early SysV init start priority
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '#\s*chkconfig:\s*[-0-9]+\s+0[0-9]\s+[0-9]+'
    unless:
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  # `source-selinux-config` relocated to micro-behaviors/os/security/selinux as
  # `source-selinux-config` — the matcher only detects that a shell sources a
  # file under /etc/selinux/, which is how every SELinux-aware script on the
  # system learns SELINUXTYPE. It is neither init persistence nor T1562.001:
  # impairing SELinux is a *write* (`setenforce 0`, `SELINUX=disabled`), already
  # covered by objectives/impact/degrade/mac and evasion/anti-av/platform/selinux.
  - id: process-group-kill
    desc: Kills entire process group
    crit: suspicious
    conf: 0.9
    attack: T1489
    if:
      type: text
      regex: \bkill\b\s+(-9|-SIGKILL|-KILL)\s+-\$?\{?[a-zA-Z_][a-zA-Z0-9_]*\}?
    not:
      - substr: kill -9 -$pid
  - id: kernel-module-load-dynamic
    desc: Init dynamically selects module
    crit: component
    conf: 0.8
    attack: T1547.006
    if:
      type: text
      regex: \bmodprobe\s+\$[A-Za-z_][A-Za-z0-9_]*
    unless:
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-shell-tooling
      - id: well-known/app/utility/ventoy/
    not:
      - regex: \bmodprobe\s+\$[A-Za-z_][A-Za-z0-9_]*FSTYPE\b
      - regex: \bmodprobe\s+\$driver\b
  - id: kernel-module-load-path
    desc: Init insmods module from path
    crit: component
    conf: 0.75
    attack: T1547.006
    if:
      type: text
      regex: \binsmod\s+([/$"]|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?/)
    not:
      - regex: \binsmod\s+/ventoy/drivers/\$\{?[A-Za-z_][A-Za-z0-9_]*\}?\.ko\b
  - id: kernel-module-load-ko
    desc: Init insmods explicit ko file
    crit: component
    conf: 0.75
    attack: T1547.006
    if:
      type: text
      regex: \binsmod\s+[^ \n]{1,80}\.ko\b
    not:
      - regex: \binsmod\s+/ventoy/drivers/\$\{?[A-Za-z_][A-Za-z0-9_]*\}?\.ko\b
  # `device-node-create` relocated to micro-behaviors/fs/device/mknod as
  # `mknod-char-device-shell` — a bare shell `mknod ... c N` is a neutral
  # capability (tar test-fixture generators use it), not init persistence.
  # The init-context intent is supplied by the chkconfig-header leg of the
  # init-kernel-device-manipulation composite below.
  - id: source-nonstandard-init-helper
    desc: Sources non-standard init helper
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: \.\s+/etc/init\.d/(modules|status)|source\s+/etc/init\.d/(modules|status)
  - id: root-binary-quoted-path
    desc: Quoted binary path under /root
    crit: notable
    conf: 0.82
    attack: T1543
    if:
      type: text
      regex: '"/root/[^"\n]{1,120}"'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: root-binary-launcher
    desc: Launch helper used with /root binary
    crit: notable
    conf: 0.82
    attack: T1543
    if:
      type: text
      regex: '(?i)\b(exec|daemon|runuser\s+-c|su\s+-c)\s+["'']?/root/'
  - id: start-stop-daemon-root-exec
    desc: start-stop-daemon launches binary from /root
    crit: suspicious
    conf: 0.9
    attack: T1543
    if:
      type: text
      regex: 'start-stop-daemon\s+--start[^\n]{0,80}--exec\s+"/root/'
  - id: root-binary-envvar
    desc: PROGNAME or DAEMON points to /root binary
    crit: suspicious
    conf: 0.9
    attack: T1543
    if:
      type: text
      regex: '(PROGNAME|DAEMON)="/root/'
  - id: processname-mismatch-lib
    desc: processname references library-like name
    crit: suspicious
    conf: 0.85
    attack: T1036
    if:
      type: text
      regex: '#\s*processname:\s*lib[a-z_]+[._][aso]'
  # Boot-script wiring for a staged payload: appending into /etc/rc.local or
  # writing a script under /etc/init.d is ordinary provisioner work alone;
  # next to raw-IP payload staging and an armed copy it is reboot persistence
  # for the fetched bot (composite below).
  - id: rc-local-append
    desc: Appends a command line into /etc/rc.local
    conf: 0.9
    if:
      type: text
      regex: '>{1,2}\s*/etc/rc\.local\b'
  - id: initd-script-write
    desc: Writes a script under /etc/init.d
    conf: 0.9
    if:
      type: text
      regex: '(>{1,2}|tee\s+)/etc/init\.d/[A-Za-z0-9._-]{1,64}\b'

composite_rules:
  - id: init-script-selinux-bypass
    desc: Init script with SELinux bypass
    crit: suspicious
    conf: 0.9
    attack: T1562.001
    all:
      - id: micro-behaviors/os/service/config::sysv-chkconfig-header
      - id: micro-behaviors/os/security/selinux::setsebool-command
  - id: aggressive-init-persistence
    desc: SysV init script starts in all runlevels with early priority
    crit: notable
    conf: 0.9
    attack: T1037.004
    all:
      - id: chkconfig-all-runlevels
      - id: chkconfig-early-start
  - id: init-process-group-killer
    desc: Init script with process group kill
    crit: suspicious
    conf: 0.9
    attack: T1489
    all:
      - id: micro-behaviors/os/service/config::sysv-chkconfig-header
      - id: process-group-kill
  - id: init-process-hunter
    desc: Init script with process hunting
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/config::sysv-chkconfig-header
      - id: micro-behaviors/process/enumerate/shell::ps-grep-filter
      - id: micro-behaviors/fs/proc/cmdline::process-var-cmdline
      - id: process-group-kill
  - id: init-aggressive-process-control
    desc: Init script aggressive process mgmt
    crit: hostile
    conf: 0.9
    all:
      - id: chkconfig-all-runlevels
      - id: micro-behaviors/process/enumerate/shell::pgrep-cmd
      - id: micro-behaviors/process/enumerate/shell::ps-grep-filter
      - id: process-group-kill
  - id: init-kernel-device-manipulation
    desc: Init with kernel/device manipulation
    crit: hostile
    conf: 0.85
    attack: T1547.006
    all:
      - id: micro-behaviors/os/service/config::sysv-chkconfig-header
      - id: objectives/persistence/system/init/script::kernel-module-load-dup
      - id: micro-behaviors/fs/device/mknod::mknod-char-device-shell
  # Notable, not suspicious. A bare `any:` over three component-level ways to
  # spell "load a module", and loading a module from an init or setup script is
  # what those scripts are for: grub's etc/grub.d/00_header and
  # grub-mkconfig_lib, lxc-checkconfig, s390-tools' znetconf and Keycloak's CI
  # workflow all do it. The two `not:` regexes below (uvesafb, vboxguest) were
  # already chasing individual benign modules one at a time, which is the tell.
  # The hostile `init-backdoor-pattern` still pairs this with a non-standard
  # init helper and a chkconfig header.
  - id: kernel-module-load-dup
    desc: Init loads kernel module
    crit: notable
    conf: 0.8
    attack: T1547.006
    unless:
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-shell-tooling
      - id: well-known/app/utility/ventoy/
    any:
      - id: kernel-module-load-dynamic
      - id: kernel-module-load-path
      - id: kernel-module-load-ko
    not:
      - regex: \bmodprobe\s+uvesafb\b
      - regex: \bmodprobe\s+vbox(guest|sf)\b
  - id: init-backdoor-pattern
    desc: Init with backdoor characteristics
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/config::sysv-chkconfig-header
      - id: source-nonstandard-init-helper
    any:
      - id: start-stop-daemon-root-exec
      - id: root-binary-envvar
      - id: binary-from-root-dir
  - id: binary-from-root-dir
    desc: Runs binary from /root
    crit: suspicious
    conf: 0.9
    attack: T1543
    near_lines: 3
    unless:
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: metadata/package/files/included::install-uninstall-shell-basename
      - id: metadata/build/docker::dockerfile-basename
      - id: metadata/build/docker::cloud-hypervisor-integration-workloads
      - id: metadata/package/testing/presence/harness::test-directory
      - id: "metadata/file/naming::shell-scripts-dir-context"
    all:
      - id: root-binary-quoted-path
    any:
      - id: root-binary-launcher
      - id: root-binary-envvar
      - id: start-stop-daemon-root-exec
  - id: runlevel-hidden-payload-launcher
    desc: SysV init launches hidden system payload
    crit: suspicious
    conf: 0.95
    attack: T1037.004
    all:
      - id: sysv-runlevel-start-name
      - id: micro-behaviors/fs/path/system::hidden-system-bin-reference
  - id: init-deceptive-service
    desc: Deceptive init service masquerade
    crit: hostile
    conf: 0.9
    attack: T1036
    all:
      - id: micro-behaviors/os/service/config::sysv-chkconfig-header
      - id: chkconfig-all-runlevels
      - id: processname-mismatch-lib
  # Boot-script persistence for a fetched payload: raw-IP staging plus an
  # armed copy wired into rc.local or /etc/init.d so the bot survives reboot.
  - id: fetched-payload-boot-script-persistence
    desc: Staged payload wired into rc.local or init scripts
    crit: hostile
    conf: 0.97
    attack: T1037.004,T1547.006
    # Small droppers spread staging and boot-wiring across their whole body;
    # a 250-line window covers them without matching long provisioners where
    # the legs drift apart.
    near_lines: 250
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-endpoint
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
    any:
      - id: rc-local-append
      - id: initd-script-write
