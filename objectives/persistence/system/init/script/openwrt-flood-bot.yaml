defaults:
  platforms: [linux]
  for: [elf]
  attack: T1037
composite_rules:
  - id: flood-bot-openwrt-init-persistence
    desc: Flood bot embeds OpenWrt init and hidden background paths
    crit: hostile
    conf: 0.98
    # Init configuration is neutral; attack tasking supplies unwanted context.
    # The template and hidden path co-occur, without binding the placeholders.
    all:
      - id: micro-behaviors/os/service/configure::openwrt-init-hidden-background-paths
      - id: objectives/impact/dos/attack/flood::start-flood-dispatcher-usage
      - id: objectives/impact/dos/attack/flood::start-flood-mode-name-cluster
