# Zip-slip persistence: an archive whose member name uses a `../` run to escape
# the extraction root and land in a boot or init-service directory. A vulnerable
# extractor writes the member there, and the system runs it as root at the next
# boot -- the same primitive as the binary-hijack sibling under
# execution/exploit/archive-traversal, but aimed at a startup directory rather
# than an existing executable, so it survives update cycles rather than firing
# once. The member traits this builds on live beside the web-content and
# system-program escapes in metadata/package/files/archive-member.
#
# No test-directory guard: a member that escapes its extraction root onto
# /etc/init.d has no benign reading regardless of where the archive is stored,
# and the fixtures guard would otherwise suppress it under any testdata path.
defaults:
  platforms: [unix]
  for: [zip, tar]
  attack: T1037.004

composite_rules:
  - id: parent-path-init-service-target
    desc: Archive traversal targets boot or init-service scripts
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/archive::path-traversal-members
      - id: metadata/package/files/archive-member::archive-parent-path-init-service-member
