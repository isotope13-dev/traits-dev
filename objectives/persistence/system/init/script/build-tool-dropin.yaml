# Startup directory and launch templates are neutral observations. Require
# independent implant behavior before inferring unwanted persistence.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf]
  attack: T1546

composite_rules:
  # A file placed into a startup-script directory that pulls its body from the
  # network. Either half alone is ordinary; together they are a controller
  # backdoor that survives restarts and re-arms itself from the operator's
  # server on every boot.
  - id: startup-script-dropin-remote-stage
    desc: Drops a startup script that stages remotely
    crit: hostile
    conf: 0.95
    attack: T1546,T1105
    near_lines: 8
    all:
      - id: micro-behaviors/fs/path/config/autorun::build-tool-startup-script-file
    any:
      - id: micro-behaviors/communications/http/client/response-body::groovy-url-body-read
      - id: objectives/command-and-control/infrastructure/ci-abuse::groovy-curl-pipe-shell
      - id: objectives/command-and-control/infrastructure/ci-abuse::groovy-wget-pipe-shell
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
  # The drop-in path and the launch payload are separate strings in a
  # compiled dropper (the path is chosen, then the script body is written);
  # a native binary carrying both installs a background-shell launcher into
  # a build-tool startup directory and survives every restart of it.
  - id: startup-script-dropin-shell-launch
    desc: Rival-killer startup path and shell launcher
    crit: hostile
    conf: 0.95
    attack: T1546,T1059
    for: [elf]
    platforms: [unix]
    all:
      - id: objectives/impact/degrade/rival-bot/competitor::static-elf-rival-miner-proc-bot
      - id: micro-behaviors/os/syscall/raw::mips-o32-write-syscall
      - id: micro-behaviors/fs/path/config/autorun::build-tool-startup-script-directory
      - id: micro-behaviors/process/create/shell/command-string::groovy-init-shell-launch-template
