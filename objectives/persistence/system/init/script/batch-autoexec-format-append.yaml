defaults:
  platforms: [windows]
  for: [batch]
  attack: T1561.002

composite_rules:
  - id: batch-appends-drive-format-to-boot-script
    desc: Batch appends drive format to boot script
    crit: hostile
    conf: 0.95
    size_max: 4096
    near_lines: 3
    all:
      - id: micro-behaviors/fs/volume/admin::batch-format-drive
      - id: micro-behaviors/fs/path/config/boot::legacy-boot-config
      - id: micro-behaviors/fs/write/file/redirect::echo-append-batch-script-text
