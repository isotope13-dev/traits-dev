defaults:
  crit: hostile
  conf: 0.98
  platforms: [unix, appliance]
  for: [scripts, binaries, source]
  attack: "T1105,T1059.004,T1222.002"
  mbc: B0024


composite_rules:
  - id: startup-write-executable-background-clues
    for: [shell, python, javascript, c]
    desc: Startup file write, executable permissions and background execution clues
    all:
      - id: "metadata/lang/source/syntax/command/options::file-command-system-path-syntax"
      - id: micro-behaviors/fs/write/system-paths::system-startup-file-write
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
    any:
      - id: micro-behaviors/process/daemonize/background::background-tmp-execution
      - id: micro-behaviors/process/daemonize/background::sh-background-subshell
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
