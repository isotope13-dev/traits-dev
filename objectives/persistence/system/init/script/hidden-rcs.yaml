defaults:
  platforms: [unix]
  for: [shell]
  attack: T1037.004
composite_rules:
  - id: hidden-payload-rcs-persistence
    desc: Copies and arms hidden payload for rcS script launch
    crit: hostile
    conf: 0.97
    near_lines: 1
    all:
      - id: micro-behaviors/fs/write/file/startup::hidden-command-rcs-append
      - id: micro-behaviors/fs/file/copy/source-destination::cp-nonconfig-hidden-dotfile
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
