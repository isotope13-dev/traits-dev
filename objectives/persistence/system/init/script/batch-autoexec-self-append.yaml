defaults:
  platforms: [windows]
  for: [batch]
  attack: T1547.014

composite_rules:
  - id: batch-self-appended-to-autoexec-boot
    desc: Batch appends itself to AUTOEXEC.BAT
    crit: hostile
    conf: 0.93
    size_max: 4096
    all:
      - id: micro-behaviors/fs/write/file/redirect::batch-type-self-append-autoexec
      - id: micro-behaviors/fs/read/self::batch-own-script-source-input
