defaults:
  platforms: [windows]
  for: [batch]
  attack: T1547.014

composite_rules:
  - id: batch-self-appended-to-autoexec-boot
    desc: Batch appends itself to AUTOEXEC.BAT
    crit: hostile
    conf: 0.93
    size_max: 4096
    all:
      - id: micro-behaviors/fs/write/file/redirect::batch-type-self-append-autoexec
      - id: micro-behaviors/fs/read/self::batch-own-script-source-input
  - id: batch-copy-self-hooks-autoexec
    desc: Copies itself and hooks AUTOEXEC.BAT
    crit: hostile
    conf: 0.96
    size_max: 4096
    all:
      - id: micro-behaviors/fs/read/self::batch-own-script-source-input
      - id: micro-behaviors/fs/file/copy::windows-copy-command
      - id: micro-behaviors/fs/write/file/redirect::batch-echo-call-autoexec
  - id: batch-hidden-autoexec-call-hook
    desc: Hidden batch hooks AUTOEXEC.BAT
    crit: hostile
    conf: 0.95
    size_max: 4096
    all:
      - id: micro-behaviors/os/console/control::batch-ctty-null-device
      - id: micro-behaviors/fs/write/file/redirect::batch-echo-call-autoexec
      - id: micro-behaviors/fs/read/self::batch-own-script-source-input
  - id: batch-overwrites-autoexec-startup
    desc: Batch overwrites AUTOEXEC.BAT startup script
    crit: hostile
    conf: 0.95
    size_max: 4096
    all:
      - id: micro-behaviors/fs/write/file/redirect::batch-redirect-into-autoexec
      - id: micro-behaviors/fs/path/config/boot::legacy-boot-config
