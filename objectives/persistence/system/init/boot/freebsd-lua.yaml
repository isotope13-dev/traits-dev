defaults:
  platforms: [freebsd, unix]
  for: [lua]
  attack: T1037.004

traits:
  - id: lua-constructs-rcd-path
    desc: Lua constructs an rc.d service path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '"/etc/rc\.d/"\s*\.\.\s*\w+'

  - id: lua-enables-rc-service
    desc: Lua enables a service with sysrc
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'os\.execute\(["'']sysrc\s+["'']\s*\.\.\s*\w+\s*\.\.\s*[''"]_enable="YES"'

  - id: lua-rc-starts-script-from-variable
    desc: Service command launches a staged Lua script
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'command="/usr/local/bin/lua ["'']\s*\.\.\s*\w+'

  - id: lua-curl-hidden-temp-output
    desc: Lua invokes curl with hidden temp output
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'os\.execute\(["'']curl[^\r\n]{1,130}\s-o\s+/tmp/\.[\w.-]+'

composite_rules:
  - id: lua-freebsd-rcd-hidden-beacon
    desc: Lua installs a FreeBSD startup service and performs a hidden HTTP fetch
    crit: hostile
    conf: 0.98
    all:
      - id: lua-constructs-rcd-path
      - id: lua-enables-rc-service
      - id: lua-rc-starts-script-from-variable
      - id: lua-curl-hidden-temp-output
      - id: micro-behaviors/fs/write/file/handle/call::lua-open-write-mode
