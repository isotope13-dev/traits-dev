defaults:
  platforms: [windows]
  for: [pe]
  attack: T1037.004

traits:
  - id: netbsd-rcd-script
    desc: NetBSD rc.d script in Windows PE
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/etc/rc\.subr[\s\S]{0,260}rcvar='
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context

  - id: netbsd-rcd-path
    desc: NetBSD rc.d path in a Windows PE
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: /etc/rc.d/
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context

composite_rules:
  - id: netbsd-rcd-persistence
    desc: NetBSD rc.d persistence in Windows PE
    crit: hostile
    conf: 0.98
    all:
      - id: netbsd-rcd-script
      - id: netbsd-rcd-path
    unless:
      - id: metadata/lang/compiler/systems::go-pe-binary-context
