defaults:
  platforms: [appliance, unix]
  for: [c, cpp, objc, elf]
  attack: T1037

traits:
  - id: vxworks-taskspawn-malicious-task
    desc: VxWorks taskSpawn task
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'taskSpawn\("?(mal|backdoor|payload|agent)[A-Za-z0-9_]*'

  - id: native-hidden-init-script
    desc: Native hidden init script
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/etc/init\.d/S[0-9]{2}[A-Za-z0-9_-]+[\s\S]{0,260}/tmp/\.[A-Za-z0-9_-]+'

  - id: native-hidden-monitor-path
    desc: Native hidden monitor path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/tmp/\.(sysmon|cache_update)'


  - id: native-hidden-agent-execstart
    desc: Native hidden agent ExecStart
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'ExecStart=/tmp/\.[A-Za-z0-9_-]+'

composite_rules:
  # All three: the boot hook is every VxWorks app's entry point and write()
  # is every program's, so as alternatives beside write() this convicted any
  # application that wrote a file. The task name is the implant evidence.
  - id: vxworks-boot-task-persistence
    desc: VxWorks boot task persistence
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/lifecycle/runtime-init::vxworks-usrappinit-hook
      - id: vxworks-taskspawn-malicious-task
      - id: micro-behaviors/fs/write/file/descriptor::write

  - id: native-hidden-init-persistence
    desc: Native hidden init persistence
    crit: suspicious
    conf: 0.98
    all:
      - id: native-hidden-init-script
      - id: micro-behaviors/fs/write/file/descriptor::write

  - id: native-hidden-monitor-init
    desc: Native hidden monitor init
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/config::s-number-init-script-path
      - id: native-hidden-monitor-path

