defaults:
  for:
    - elf
    - shell
    - python
    - javascript
    - typescript
    - go
    - c
    - cpp
    - php
  attack: T1547.013
  crit: suspicious
  platforms:
    - linux
traits:
  - id: local-share-systemd-user
    desc: .local/share/systemd/user directory
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: .local/share/systemd/user
  - id: systemctl-user-enable
    desc: systemctl --user enable
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '\bsystemctl\b[^\r\n]{0,30}\s--user\s+enable\b'
    unless:
      - id: well-known/tool/detection/security-scanner/
      # AI-agent observability tools install their own telemetry collector daemon.
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/app/development/calvyn-code
      - id: well-known/app/infrastructure/pvetui::pvetui-workflow-test-script
  - id: etc-rc-local
    desc: References /etc/rc.local boot path
    crit: component
    conf: 0.8
    attack: T1037.004
    for: [c, cpp, elf, go, javascript, lua, php, python, shell, typescript]
    if:
      type: text
      substr: /etc/rc.local
    unless:
      - type: text
        substr: PERSISTENCE_PATHS
      # Standard headers and vendored runtimes commonly document this path;
      # the bare reference is not persistence behavior in those files.
      - type: path
        regex: '(?i)(^|[\\/])(include|libc|libcxx|libtsan)[\\/]'
  - id: etc-rc-d-rc-local
    desc: References /etc/rc.d/rc.local boot path
    crit: component
    conf: 0.8
    attack: T1037.004
    if:
      type: text
      substr: /etc/rc.d/rc.local
    unless:
      - type: text
        substr: PERSISTENCE_PATHS
  - id: go-main-autostart-handler
    desc: Go binary auto-start handler
    crit: suspicious
    conf: 0.98
    for: [elf]
    if:
      type: text
      exact: main.AutoStart
  - id: openrc-init-script-header
    desc: OpenRC init script header
    crit: notable
    conf: 0.85
    attack: T1037.004
    for: [shell]
    if:
      type: text
      substr: "#!/sbin/openrc-run"
  - id: update-rc-d-cmd
    desc: update-rc.d command
    crit: notable
    conf: 0.7
    attack: T1037.004
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: update-rc.d
    unless:
      - id: well-known/app/network/dropbear::source-tree
  - id: chkconfig-cmd
    desc: chkconfig command (persistence context)
    crit: suspicious
    conf: 0.7
    attack: T1037.004
    # A native chkconfig utility contains its own usage text, including
    # "chkconfig --add".  That is not an init-script installation action.
    # Keep this intent atom on shell command syntax, where it describes an
    # actual persistence operation rather than embedded help text.
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?(/sbin/)?chkconfig\s+--add\b'
    unless:
      - id: metadata/build/package/
      - id: metadata/build/package-builder::package-builder-maintainer-script
      - id: well-known/dual-use/tunnel/shadowsocks-libev::shadowsocks-libev-source
      - id: metadata/package/files/system-package::os-package-manager-tool
      - id: well-known/app/infrastructure/walinuxagent::source-tree
      - id: well-known/lib/data/redis::redis-source-tree
      - id: well-known/lib/development/modernc-ccorpus2::package-context
      - id: well-known/lib/development/modernc-ccorpus2::source-archive-path
  - id: initd-path-before-install-action
    desc: init.d path before install action
    # Package and image builders routinely enable services after installing
    # them; the init-script composite supplies the persistence context.
    crit: notable
    conf: 0.85
    attack: T1037.004
    if:
      type: text
      regex: /etc/init\.d/[^\s"'`|;]{1,96}.{0,40}\b(install|enable|disable)\b
    unless:
      - id: well-known/app/infrastructure/walinuxagent::source-tree
      - id: well-known/app/finance/tollgate::source-tree
      - id: well-known/app/finance/tollgate::official-source-context
  - id: install-action-before-initd-path
    desc: Install action before init.d path
    crit: notable
    conf: 0.85
    attack: T1037.004
    unless:
      - id: objectives/persistence/system/init/boot/
      - id: well-known/app/network/dropbear::source-tree
    if:
      type: text
      regex: \b(install|enable|disable)\b.{0,40}/etc/init\.d/[^\s"'`|;]{1,96}
  - id: write-action-before-initd-path
    desc: Write action before init.d path
    crit: suspicious
    conf: 0.85
    attack: T1037.004
    unless:
      - id: metadata/build/docker::dockerfile-basename
      - id: objectives/persistence/system/init/boot/
      - id: metadata/build/package/
    if:
      type: text
      regex: \b(copy|write|chmod|chown)\b.{0,40}/etc/init\.d/[^\s"'`|;]{1,96}
composite_rules:
  - id: linux-user-systemd
    desc: User-level systemd service persistence
    conf: 0.85
    crit: notable
    attack: T1543.002
    for: [elf, shell, python]
    any:
      - id: micro-behaviors/os/service/config::systemd-user-service-directory-path
      - id: local-share-systemd-user
      - id: systemctl-user-enable
  - id: linux-rc-local
    desc: rc.local boot path reference
    conf: 0.9
    crit: component
    attack: T1037.004
    any:
      - id: etc-rc-local
      - id: etc-rc-d-rc-local
  - id: c-rc-local-self-persistence
    desc: C appends its own executable path to rc.local
    crit: suspicious
    conf: 0.97
    attack: T1037.004
    for: [c, cpp]
    all:
      - id: linux-rc-local
      - id: micro-behaviors/fs/file/write/append::c-fopen-append-mode
      - id: micro-behaviors/process/info/selfpath::check-argv-0
    # Variable-mediated writes put the rc.local literal, argv[0] path
    # construction, and append-mode fopen in neighboring statements rather
    # than one expression. Proximity keeps unrelated append logic out.
    near_lines: 50
  - id: hidden-rc-local-downloader-persistence
    desc: Hidden rc.local downloader persistence
    crit: hostile
    conf: 0.99
    attack: T1037.004,T1105,T1564.001
    for: [elf]
    all:
      - id: etc-rc-local
      - id: micro-behaviors/communications/http/download/fallback::multi-client-download-fallback
      - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
  - id: hidden-multi-surface-init-persistence
    desc: Hidden multi-surface Linux init persistence templates
    crit: hostile
    conf: 0.99
    attack: T1036.004,T1037.004,T1543.003,T1564.001
    for: [elf]
    all:
      - id: etc-rc-local
      - id: micro-behaviors/os/service/config::init-script-path
      - id: micro-behaviors/fs/file/copy::copy-to-executable-directory
      - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
    near_bytes: 2048
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
  - id: linux-init-script
    desc: SysV init script with installation or enablement action
    conf: 0.85
    crit: suspicious
    attack: T1037.004
    unless:
      - id: well-known/app/network/openssh/
      - id: well-known/app/network/frr::frr-init-script-context
      - id: well-known/dual-use/tunnel/tailscale::tailscale-init-script-context
      - id: well-known/app/system/raspi-config::raspi-config-persistence-context
      - id: well-known/app/infrastructure/solr::solr-init-script-context
      - id: well-known/lib/data/redis::redis-source-tree
      - id: well-known/lib/development/modernc-ccorpus2::package-context
      - id: well-known/lib/development/modernc-ccorpus2::source-archive-path
    all:
      - id: micro-behaviors/os/service/config::sysv-init-script-header
    any:
      - id: update-rc-d-cmd
      - id: chkconfig-cmd
      - id: initd-path-before-install-action
      - id: install-action-before-initd-path
      - id: write-action-before-initd-path
  - id: linux-init-iot-bot-persistence
    desc: Linux init persists IoT bot
    conf: 0.98
    crit: hostile
    attack: T1037.004
    for: [elf, shell]
    all:
      - id: linux-init-script
      - id: objectives/command-and-control/botnet/iot::huawei-upnp-encoded-download-exec
  - id: shell-multi-surface-payload-persistence
    desc: Shell installs downloaded payload across init surfaces
    crit: hostile
    conf: 0.99
    attack: "T1053.003,T1037.004,T1543.003,T1105"
    mbc: B0030
    for: [shell]
    all:
      - id: objectives/command-and-control/dropper/delivery/download-execute::raw-ip-multiarch-shell-payload
      - id: micro-behaviors/os/autorun/scheduled::crontab-echo-pipe
      - id: micro-behaviors/os/service/config::init-script-path
      - id: micro-behaviors/os/service/config::systemd-etc-directory-path

  - id: multi-method-elf-persistence-templates
    desc: ELF embeds cron, systemd, and init persistence templates
    crit: hostile
    conf: 0.98
    attack: T1053.003,T1543.002,T1037.004
    for: [elf]
    all:
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: micro-behaviors/os/service/config::init-script-path
      - id: micro-behaviors/os/service/config::sysv-init-script-header
      - id: micro-behaviors/os/autorun/scheduled::crontab-echo-pipe
  - id: debhelper-installinit-maintainer-block
    desc: Debhelper init maintainer block
    crit: notable
    conf: 0.95
    all:
      - id: metadata/build/package/maintainer-scripts::debhelper-dh-installinit-marker
      - id: metadata/build/package/maintainer-scripts::debhelper-auto-section-end
  - id: linux-multiple-persistence-mechanisms
    desc: Multiple Linux persistence mechanisms (XDG + Systemd)
    crit: suspicious
    conf: 0.98
    attack: "T1547.013, T1543.002"
    unless:
      - id: well-known/app/utility/shrike/
      - id: well-known/app/storage/ubuntu-release-upgrader::ubuntu-release-upgrader-font-restore-context
      - id: micro-behaviors/os/service/config::systemd-xdg-fallback-branch
      - id: micro-behaviors/os/autorun/login-items::gtk-desktop-autostart-installer-context
    all:
      - id: objectives/persistence/login/xdg::xdg-persistence
      - id: linux-user-systemd
  - id: go-bot-rc-local-autostart
    desc: Go flood bot combines auto-start logic with rc.local persistence
    crit: hostile
    conf: 0.99
    attack: T1037.004,T1498.001
    for: [elf]
    all:
      - id: go-main-autostart-handler
      - id: objectives/persistence/system/init/boot::etc-rc-d-rc-local
      - id: objectives/impact/dos/attack/botnet::go-multivector-flood-methods
