defaults:
  platforms: [linux]
  for: [scripts, source]
  attack: T1037.004,T1548.003

composite_rules:
  - id: beyondtrust-passwordless-root-boot-hook
    desc: Boot hook with passwordless sudo template
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/system-paths::beyondtrust-post-boot-script-redirect
      - id: objectives/privilege-escalation/elevation-control/sudo::beyondtrust-passwordless-template-rebuild
    near_bytes: 1024
