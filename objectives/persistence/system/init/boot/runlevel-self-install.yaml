# A program that writes itself into the boot sequence by name and number.
#
# The init.d traits beside this one are each a single campaign's literal path
# -- /etc/init.d/solaris_agent_svc, /etc/init.d/ns-system-health,
# /etc/init.d/S99miner. Every one of them catches exactly one sample and
# nothing that comes after it.
#
# What does not change between campaigns is the naming convention. A file
# called `S10cyneox` under a runlevel directory is not a service definition,
# it is a position in the boot order: `S` for start, `10` for when. A compiled
# program carrying that string is arranging to be run at boot, whatever it
# decides to call itself -- vxheaven's Trojan.Linux.Reboot.a writes
# /etc/init.d/boot.d/S10cyneox and scored nothing.
#
# The honest neighbours are the tools whose job this is: insserv, update-rc.d,
# chkconfig and the package managers that call them. They are named
# specifically rather than by directory, because a guard broad enough to
# exclude "init tooling" also excludes anything that mentions it.
defaults:
  platforms: [unix]
  for: [binaries, scripts, c, cpp, go, rust]
  attack: T1037.004
  mbc: F0012

traits:
  - id: sysv-runlevel-start-script-path
    desc: Names a runlevel start-script position
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/etc/(init\.d/[\w.-]{0,16}|rc[0-9S]\.d)/S[0-9]{2}[A-Za-z]'

composite_rules:
  # Installing the boot entry and then restarting the machine is the pair that
  # separates persistence from packaging: an installer leaves the reboot to
  # the administrator, because the administrator is the one running it.
  - id: boot-sequence-install-and-reboot
    desc: Installs a boot script and reboots the host
    crit: hostile
    conf: 0.94
    attack: T1037.004,T1529
    all:
      - id: sysv-runlevel-start-script-path
    any:
      - id: micro-behaviors/os/event/shutdown::unix-reboot-api
      - id: micro-behaviors/os/event/shutdown::unix-reboot-import
