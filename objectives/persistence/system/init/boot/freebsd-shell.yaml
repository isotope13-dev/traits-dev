defaults:
  platforms: [freebsd, unix]
  for: [shell]
  attack: T1037.004

traits:
  - id: shell-freebsd-rcd-service-write
    desc: Shell writes FreeBSD rc.d service
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/usr/local/etc/rc\.d[\s\S]{0,180}PROVIDE:'

  - id: shell-freebsd-rcconf-single-quoted-write
    desc: Shell writes a quoted rc.conf service setting
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?m)^\s*(echo|printf)\s+''[A-Za-z0-9_]{0,48}_enable[^'']{0,40}''\s+>>\s*/etc/rc\.conf\b'
  - id: shell-freebsd-rcconf-double-quoted-write
    desc: Shell writes double-quoted rc.conf setting
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?m)^\s*(echo|printf)\s+"[A-Za-z0-9_]{0,48}_enable[^"]{0,40}"\s+>>\s*/etc/rc\.conf\b'
  - id: shell-freebsd-rcconf-unquoted-write
    desc: Shell writes an unquoted rc.conf service setting
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?m)^\s*(echo|printf)\s+[A-Za-z_][A-Za-z0-9_]*=[A-Za-z]+\s+>>\s*/etc/rc\.conf\b'
    unless:
      - type: text
        regex: '(?i)setup\.py\s+(build|install)'
      - type: text
        regex: '(?i)\bsshd_enable\s*=\s*yes\b'

composite_rules:
  - id: shell-freebsd-rcconf-enable
    desc: Shell enables a FreeBSD rc.conf service
    crit: suspicious
    conf: 0.94
    any:
      - id: shell-freebsd-rcconf-single-quoted-write
      - id: shell-freebsd-rcconf-double-quoted-write
      - id: shell-freebsd-rcconf-unquoted-write
  - id: shell-freebsd-rcd-persistence
    desc: Shell FreeBSD rc.d persistence
    crit: hostile
    conf: 0.98
    all:
      - id: shell-freebsd-rcd-service-write
      - id: shell-freebsd-rcconf-enable
