# A Node package that writes a user systemd unit, enables it, and embeds the
# credentials and relay needed to reconnect is a persistent remote agent.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]
  attack: T1053.007,T1071.001

traits:
  - id: node-user-systemd-restart-unit
    desc: Node writes a restarting user systemd unit
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[Service\][\s\S]{0,200}ExecStart='

  - id: node-systemd-restart-policy
    desc: User systemd unit restarts automatically
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: Restart=always

  - id: node-systemd-user-target
    desc: User systemd unit targets the login session
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: WantedBy=default.target

  - id: node-persistent-agent-credentials
    desc: Node service carries token and relay arguments
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']--token["''][\s\S]{0,100}["'']--workspace["''][\s\S]{0,100}["'']--relay["'']'

composite_rules:
  - id: persistent-websocket-relay-agent
    desc: User service persists a credentialed WebSocket relay agent
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: node-user-systemd-restart-unit
      - id: node-systemd-restart-policy
      - id: node-systemd-user-target
      - id: node-persistent-agent-credentials
      - id: objectives/persistence/system/init/boot::systemctl-user-enable
      - id: micro-behaviors/communications/http/websocket::wss-scheme
