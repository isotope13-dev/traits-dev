# A Node package that writes a user systemd unit, enables it, and embeds the
# credentials and relay needed to reconnect is a persistent remote agent.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]
  attack: T1053.007,T1071.001

traits:
  - id: node-persistent-agent-credentials
    desc: Node service carries token and relay arguments
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']--token["''][\s\S]{0,100}["'']--workspace["''][\s\S]{0,100}["'']--relay["'']'

composite_rules:
  - id: obfuscated-postinstall-persists-systemd-service
    desc: Obfuscated npm hook installs persistent systemd service
    crit: hostile
    conf: 0.98
    for: [npm, javascript, typescript, zip, tar, package.json]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: objectives/anti-static/obfuscation/obfuscator/install-script::obfuscated-install-script-decoder
      - id: micro-behaviors/os/service/config::systemd-etc-directory-path
      - id: micro-behaviors/os/service/config::systemctl-user-enable
      - id: micro-behaviors/os/service/restart/policy::embedded-restart-always-policy
      - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
    any:
      - id: micro-behaviors/os/env/read/current::process-env
      - id: micro-behaviors/os/env/path::node-home-access

  - id: persistent-websocket-relay-agent
    desc: User service persists a credentialed WebSocket relay agent
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
      - id: micro-behaviors/os/service/restart/policy::embedded-restart-always-policy
      - id: micro-behaviors/os/service/unit-field::wanted-by-target-text
      - id: node-persistent-agent-credentials
      - id: micro-behaviors/os/service/config::systemctl-user-enable
      - id: micro-behaviors/communications/url/scheme::wss-scheme
