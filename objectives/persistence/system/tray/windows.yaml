# Unsigned mixed-mode DLL that owns a tray icon and can ShellExecute
# a helper. Adware such as Neoreklami/Mikey stays resident this way.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036,T1059.001

composite_rules:
  - id: unsigned-mixed-mode-tray-helper
    desc: Unsigned mixed-mode tray helper
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::msvc-clr-dllmain-diagnostic
      - id: micro-behaviors/ui/window/notify/message::shell-notify-icon
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
