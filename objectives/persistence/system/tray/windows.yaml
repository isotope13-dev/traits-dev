# Unsigned mixed-mode DLL that owns a tray icon and can ShellExecute
# a helper. Adware such as Neoreklami/Mikey stays resident this way.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: unsigned-mixed-mode-tray-helper
    desc: Unsigned mixed-mode tray helper
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::msvc-clr-dllmain-diagnostic
      - id: micro-behaviors/ui/window/notify/message::shell-notify-icon
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      # The stock AutoIt interpreter contains tray and ShellExecute support;
      # those imports do not describe the embedded script's behavior.
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
    downgrade:
      any:
        - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
