# Persistence inside SaaS tenants: ServiceNow scheduled jobs.
#
# ServiceNow scheduled jobs (sysauto_script records) run Glide script on a
# configured interval, entirely within the SaaS layer with no on-disk
# artifact. Creating one via Glide script is the ServiceNow equivalent of
# installing a cron job: legitimate for admin automation, but also the
# persistence mechanism for SaaS-hosted implants such as SnowFall (MDSec,
# "When it Snows it Pours", 2026 — a job created as "AppStoreMonitor"
# running every 10 minutes).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data, python]
  attack: T1053

traits:
  - id: servicenow-scheduled-job-create
    desc: Creates ServiceNow scheduled job record
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'new\s+GlideRecord\s*\(\s*[''"]sysauto_script[''"]\s*\)'

  - id: servicenow-script-include-write
    desc: Writes ServiceNow script include record
    crit: notable
    conf: 0.9
    attack: T1505.003
    if:
      type: text
      # Tenant server-side JavaScript objects (sys_script_include),
      # written as a quoted table name or through the table REST API.
      regex: '([''"]sys_script_include[''"]|table/sys_script_include)'

  - id: servicenow-scheduled-job-periodic
    desc: ServiceNow scheduled job set to periodic run
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\brun_type\s*=\s*[''"]periodically[''"]'

composite_rules:
  - id: servicenow-scheduled-job-persistence
    desc: ServiceNow scheduled job persistence via Glide script
    crit: suspicious
    conf: 0.93
    all:
      - id: servicenow-scheduled-job-create
      - id: servicenow-scheduled-job-periodic
    near_bytes: 600
