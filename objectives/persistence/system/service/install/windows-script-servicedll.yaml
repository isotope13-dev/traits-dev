# Windows svchost ServiceDll persistence. The neutral command observations live
# under micro-behaviors/os/service; hostile intent comes from the paired loader
# chain, not from an ordinary service registration in isolation.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1543.003
  mbc: B0011.003

composite_rules:
  - id: svchost-servicedll-registration
    desc: Shared svchost ServiceDll registration
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/control::sc-shared-svchost-service-create
      - id: micro-behaviors/os/service/host::reg-add-servicedll-command
      - id: micro-behaviors/os/service/host::reg-add-registerservice-entrypoint
    any:
      - id: micro-behaviors/os/service/host::reg-add-servicedll-system32-target
      - id: micro-behaviors/os/service/control::sc-local-system-auto-start
    near_lines: 4

  - id: svchost-servicedll-loader-persistence
    desc: Shared svchost loader with SYSTEM task
    crit: hostile
    conf: 0.99
    all:
      - id: svchost-servicedll-registration
      - id: objectives/persistence/login/scheduled-task/path::schtasks-system-user-writable-path
    near_lines: 12
