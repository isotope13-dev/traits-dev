# Batch/cmd svchost ServiceDll registry hijack — registers a shared service
# whose DLL lives under System32 but is attacker-supplied (OctLurk-class).
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1543.003
  mbc: B0011.003

traits:
  - id: batch-reg-add-servicedll
    desc: Batch reg add sets ServiceDll parameter
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)reg\s+add\s+[^\r\n]{0,220}/v\s+ServiceDll'

  - id: batch-sc-create-svchost-share
    desc: Batch sc create shared svchost service
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)sc\s+create\s+\S+[^\r\n]{0,220}svchost\.exe\s+-k\s+\S+[^\r\n]{0,80}type=\s*share'

  - id: batch-reg-add-servicemain-register
    desc: Batch reg add sets RegisterService ServiceMain
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)reg\s+add\s+[^\r\n]{0,220}/v\s+ServiceMain[^\r\n]{0,120}RegisterService'

composite_rules:
  - id: batch-svchost-servicedll-persistence
    desc: Batch svchost ServiceDll registry persistence
    crit: hostile
    conf: 0.97
    all:
      - id: batch-sc-create-svchost-share
      - id: batch-reg-add-servicedll
    any:
      - id: batch-reg-add-servicemain-register
      - id: micro-behaviors/os/service/control::sc-local-system-auto-start
