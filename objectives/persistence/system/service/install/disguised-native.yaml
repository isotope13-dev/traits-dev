defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003

composite_rules:
  - id: disguised-system-subdirectory-service
    desc: Disguised autorun command; service creation APIs
    crit: hostile
    conf: 0.96
    all:
      # Distinguish modified execution layout from an inert signature corpus.
      - id: metadata/binary/section/header::pe-entry-in-reloc-section
      - id: objectives/evasion/masquerade/process/path::system-process-subdirectory-autorun-command
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
      - id: micro-behaviors/os/service/start::start-service
