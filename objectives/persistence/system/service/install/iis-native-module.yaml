# IIS native module persistence (T1505.004). Legitimate modules are usually
# signed; unsigned DLLs that hook the request pipeline and speak HTTP are not.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1505.004

composite_rules:
  - id: iis-native-module-winhttp-backdoor
    desc: Unsigned IIS native module fetches over WinHTTP
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/plugin::registermodule-name
      - id: micro-behaviors/communications/http/server/module::iis-native-module-pipeline-diagnostic
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
