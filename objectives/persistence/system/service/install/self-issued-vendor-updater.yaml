# A self-issued certificate claiming a recognized software vendor is not a
# trusted publisher. Pair the claim with both system-service and logon
# persistence surfaces before treating the updater behavior as hostile.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: self-issued-vendor-updater-service-and-logon-persistence
    desc: Self-issued vendor updater installs service and logon persistence
    crit: hostile
    conf: 0.98
    attack: T1543.003,T1547.001
    all:
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
      - id: micro-behaviors/os/service/create::create-service-w-reference
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/fs/path/application/state::programdata-directory-path
    any:
      - id: metadata/signature/verified/signer::google-llc
      - id: metadata/signature/unverified/signer::google-llc
      - id: metadata/signature/self-signed/signer::google-llc
      - id: metadata/signature/invalid/tampered/signer::google-llc
      - id: metadata/signature/invalid/bad-signature/signer::google-llc
      - id: metadata/signature/verified/subject::google-llc
      - id: metadata/signature/unverified/subject::google-llc
      - id: metadata/signature/self-signed/subject::google-llc
      - id: metadata/signature/invalid/tampered/subject::google-llc
      - id: metadata/signature/invalid/bad-signature/subject::google-llc
