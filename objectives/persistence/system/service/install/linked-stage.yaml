defaults:
  for: [systemd]
  platforms: [linux]
composite_rules:
  - id: unit-restarting-hidden-remote-stage
    desc: Boot unit restarts hidden remote stage
    crit: hostile
    conf: 0.98
    attack: T1543.002
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::literal-hidden-download-background-exec
      - id: micro-behaviors/os/service/restart-policy::restart-always
      - id: micro-behaviors/os/service/unit-field::install-wanted-by-exists
