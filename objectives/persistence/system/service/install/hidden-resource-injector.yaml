defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

composite_rules:
  # A separate installation branch from replacing an existing ServiceDLL.
  # The reviewed code copies its module, hides the destination, and registers
  # that path as an auto-start executable service. Require the DLL thread
  # handoff and resource-loader context to distinguish ordinary installers.
  # Configuration may select another branch and a missing resource can stop
  # payload activation; the finding describes code, not runtime success.
  - id: hidden-resource-injector-auto-service
    desc: Hidden DLL injector auto-start service code
    crit: hostile
    conf: 0.98
    attack: T1543.003
    all:
      - id: micro-behaviors/os/service/create::x86-auto-own-process-service-call-layout
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/fs/attributes/flags::x86-set-hidden-system-attributes
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
      - id: micro-behaviors/process/inject/dll::x86-remote-dll-export-thread
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
