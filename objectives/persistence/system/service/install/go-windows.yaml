defaults:
  platforms: [windows]
  for: [go]
  attack: T1543.003

traits:
  - id: go-temp-service-payload-path
    desc: Go temp service payload path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'filepath\.Join\(.{0,80}"TEMP".{0,80}"payload\.exe"'

  - id: go-service-registration-helper
    desc: Controls Windows service lifecycle
    crit: notable
    conf: 0.92
    for: [pe]
    if:
      type: text
      regex: 'main\.(silentRegisterService|ensureServiceRunning|serviceStart)\b'

  - id: go-tap-driver-install-helper
    desc: Installs TAP network driver
    crit: notable
    conf: 0.93
    for: [pe]
    if:
      type: text
      exact: main.installTapDrivers

  - id: go-softether-server-setup
    desc: Sets up SoftEther server component
    crit: suspicious
    conf: 0.94
    for: [pe]
    if:
      type: text
      exact: main.ensureServerPresentAndStart

composite_rules:
  - id: go-service-autostart-install
    desc: Go installs auto-start service
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/create::go-service-install-control
      - id: micro-behaviors/os/service/configure::go-service-auto-start-constant
    any:
      - id: go-temp-service-payload-path
      - id: micro-behaviors/fs/write/file/full::go-os-writefile

  - id: go-service-reconfigure-persistence
    desc: Go reconfigures service persistence
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/configure::go-service-reconfigure-control
      - id: micro-behaviors/os/service/configure::go-service-auto-start-constant
    any:
      - id: go-temp-service-payload-path
      - id: micro-behaviors/fs/path/system::system32-substr

  - id: go-remote-vpn-service-installer
    desc: SoftEther service staging with admin
    crit: hostile
    conf: 0.99
    for: [pe]
    all:
      - id: go-service-registration-helper
      - id: go-tap-driver-install-helper
      - id: go-softether-server-setup
      - id: metadata/build/manifest::admin-manifest

  - id: go-obfuscated-c2-service-agent
    desc: Garble-obfuscated Windows service agent with network tasking
    crit: hostile
    conf: 0.98
    for: [pe]
    attack: "T1543.003,T1071.001,T1059.003"
    # stdin-pipe/stdout-pipe (micro-behaviors/process/create/shell/lang) are
    # deliberately `for: [go]` only -- the sibling ssh-go.yaml composites
    # that need Pe coverage for the same "os/exec process piping" concept
    # use go-os-exec-pclntab (a compiled-binary pclntab text scan covering
    # any os/exec.Cmd method, including StdinPipe/StdoutPipe) instead of
    # widening those source-only atoms.
    all:
      - id: micro-behaviors/os/service/create::service-create-open-import-pair
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-port-binary
      - id: objectives/anti-static/obfuscation/obfuscator/garble::garble-random-packages
      - id: micro-behaviors/process/create/spawn::go-os-exec-package-reference
      - id: micro-behaviors/process/fd/stdio::go-binary-combined-output-reference
