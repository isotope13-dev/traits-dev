# Kernel driver service registered against an image staged outside the system
# drivers directory.
#
# The driver-image counterpart of the sibling windows-script-binpath.yaml. A
# driver that a vendor installs lands in %SystemRoot%\System32\drivers, put
# there by an INF or an installer running as SYSTEM. A `.sys` handed to
# `sc create ... type= kernel` out of ProgramData, a user profile folder or a
# temp directory was dropped there by whoever is now asking the kernel to load
# it — the staging half of bring-your-own-vulnerable-driver.
#
# Each atom carries the binPath assignment, the staging directory and the
# `.sys` extension in one pattern, so the path is provably the service image
# rather than an unrelated mention of ProgramData elsewhere in the script.
# Conviction needs the registration verb as well, which the composite adds.
#
# ATT&CK: T1543.003 (Windows Service), T1068 (Exploitation for Privilege
# Escalation)
defaults:
  platforms: [windows]
  for: [powershell, batch, csharp, go]
  crit: suspicious
  conf: 0.92
  attack: T1543.003
  mbc: B0011.003

traits:
  - id: driver-image-in-programdata
    desc: Service driver image under ProgramData
    if:
      type: text
      regex: '(?i)\bbinPath\s*=[^\r\n"]{0,100}[\\/%]ProgramData[\\/][^\r\n"]{0,80}\.sys\b'

  - id: driver-image-in-user-profile
    desc: Service driver image under a user profile
    if:
      type: text
      regex: '(?i)\bbinPath\s*=[^\r\n"]{0,100}[\\/%](Users|AppData)[\\/][^\r\n"]{0,80}\.sys\b'

  - id: driver-image-in-temp-path
    desc: Service driver image under a temp directory
    if:
      type: text
      regex: '(?i)\bbinPath\s*=[^\r\n"]{0,100}[\\/%](Temp|Public)[\\/][^\r\n"]{0,80}\.sys\b'

composite_rules:
  - id: driver-image-staged-outside-system-drivers
    desc: Driver image staged outside System32 drivers
    crit: suspicious
    conf: 0.92
    any:
      - id: driver-image-in-programdata
      - id: driver-image-in-user-profile
      - id: driver-image-in-temp-path

  - id: staged-kernel-driver-service-install
    desc: Kernel driver service uses a staged image
    crit: suspicious
    conf: 0.95
    all:
      - id: driver-image-staged-outside-system-drivers
      - id: micro-behaviors/os/service/control::sc-kernel-driver-service-create
    unless:
      - id: metadata/package/testing/presence/harness/
