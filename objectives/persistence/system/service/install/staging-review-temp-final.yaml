defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: overlay-service-create-dispatch-profile
  desc: Overlay, file IO and service creation APIs
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-imports
  - id: metadata/binary/layout/overlay::has-overlay
  - id: micro-behaviors/os/service/create::create-service
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  any:
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/file/profile/installer/product/catalog/
    - id: well-known/tool/sysadmin/sandboxie/
