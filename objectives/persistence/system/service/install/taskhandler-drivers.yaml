# Persistence that stages a sideload host under C:\Drivers and registers a
# TaskHandler service and/or ONSTART scheduled task pointing at that path.
defaults:
  platforms: [windows]
  for: [python, c, cpp, batch, powershell, go, javascript, text]
  attack: T1543.003,T1547.001
  mbc: B0011.003

traits:
  - id: drivers-root-staging-path
    desc: Staging path under C:\Drivers
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)C:\\{1,2}Drivers\\{1,2}'

  - id: taskhandler-sc-create
    desc: sc.exe creates TaskHandler service
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\s+TaskHandler\b'

  - id: taskhandler-schtasks-create
    desc: schtasks creates TaskHandler task
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)schtasks(\.exe)?[\s\S]{0,80}/create[\s\S]{0,80}/tn\s+"?TaskHandler\b'

composite_rules:
  - id: drivers-taskhandler-service
    desc: TaskHandler service from Drivers staging
    crit: hostile
    conf: 0.97
    near_bytes: 800
    all:
      - id: drivers-root-staging-path
      - id: taskhandler-sc-create

  - id: drivers-taskhandler-schtask
    desc: TaskHandler task from Drivers staging
    crit: hostile
    conf: 0.97
    near_bytes: 800
    all:
      - id: drivers-root-staging-path
      - id: taskhandler-schtasks-create
