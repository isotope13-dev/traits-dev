# Windows Service Persistence
# Detects tactics used to maintain persistence via Windows Services
# ATT&CK: T1543.003 (Create or Modify System Process: Windows Service)
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1543.003"
  mbc: "B0011.003" # Persistence::Service
composite_rules:
- id: windows-service-persistence
  desc: Service DLL with installation or registry evidence
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/service/export::win-service-export
  - id: micro-behaviors/os/service/control::create-service
  any:
  - id: micro-behaviors/os/service/control::start-service
  - id: micro-behaviors/os/service/host::service-dll-value-name
  - id: micro-behaviors/os/service/host::service-parameters-registry-path
- id: unsigned-reloc-decoder-service-host
  desc: Unsigned service host carries x64 decoder in RWX .reloc
  crit: hostile
  conf: 0.99
  attack: T1027.002,T1140,T1543.003
  all:
  - id: objectives/anti-static/obfuscation/payload/section::x64-unrolled-dword-decoder-stub
  - id: micro-behaviors/os/service/control::create-service
  - id: micro-behaviors/os/service/control::service-control-dispatch
  - id: objectives/anti-static/pack/section-anomaly::reloc-rwx-payload-section
  - id: metadata/binary/layout::pe-no-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: suspicious-packed-service
  desc: Highly suspicious packed Windows Service
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/export::win-service-export
  - id: metadata/binary/metrics/structural::pe-code-entropy-78
- id: service-install-and-start
  desc: Installs and starts Windows service
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager-import
  - id: micro-behaviors/os/service/control::create-service
  - id: micro-behaviors/os/service/control::start-service
  # The discriminating leg has to be evidence that the service's *image path* is
  # being written or steered. `self-read-file-import-chain` was not that: it is
  # satisfied by GetModuleFileName + CreateFile + ReadFile, which every
  # self-registering service EXE built on the stock ATL/MFC CServiceModule
  # skeleton imports. With it in the list the rule collapsed to "OpenSCManager +
  # CreateService + StartService", i.e. every service installer ever shipped.
  # ChangeServiceConfig is the fourth way to steer that path, and the one a
  # native implant reaches for: it rewrites lpBinaryPathName (and the start
  # type) through the SCM handle it already holds, leaving no registry write
  # and no `sc config` command line for the other three legs to see. A plain
  # installer registers its service once with CreateService and never
  # reconfigures it, so pairing the reconfigure with a create/start in the same
  # binary keeps this as discriminating as the registry-writing spellings.
  any:
  - id: service-key-template
  - id: objectives/privilege-escalation/modify-service::service-imagepath-reg
  - id: objectives/privilege-escalation/modify-service::sc-config-binpath
  - id: micro-behaviors/os/service/control::change-service-config
  unless:
  # A recognized application can legitimately install and reconfigure its own
  # service; stronger payload-delivery composites consume this signal when the
  # service lifecycle is actually part of hostile staging.
  - id: well-known/app/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: metadata/library/pywin32/
# A service that installs itself and then pulls its real payload over HTTP is
# a dropper with a boot-survival guarantee, not an installer: a legitimate
# installer downloads first and registers the finished product, it does not
# ship a service whose job is to fetch code at runtime. The download leg is the
# runtime-resolved WinHTTP flow rather than a URL string, so it holds up
# against implants that keep their endpoint encrypted until use.
- id: self-installing-service-fetches-payload
  desc: Self-installing service fetches remote payload
  crit: hostile
  conf: 0.95
  attack: T1543.003,T1105
  all:
  - id: service-install-and-start
  - id: objectives/command-and-control/dropper/delivery/download-execute::dynamic-winhttp-downloader
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: masqueraded-netsvcs-service-registry-clone
  desc: Unsigned Microsoft-claim PE clones a LocalSystem service into netsvcs
  crit: hostile
  conf: 0.99
  attack: T1543.003,T1036.005
  all:
  - id: objectives/evasion/masquerade/trust::unsigned-pe-microsoft-version-claim
  - id: micro-behaviors/os/registry/keys::system-services-registry-path
  - id: micro-behaviors/os/registry/manipulate::sh-copy-key-a
  - id: micro-behaviors/os/service/host::service-imagepath-value-name
  - id: micro-behaviors/os/service/host::svchost-netsvcs-group-name
  - id: micro-behaviors/os/privilege/check::localsystem-account-name
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: packed-com-hijack-service-self-install
  desc: Packed COM-hijack service with self-install
  crit: hostile
  conf: 0.99
  attack: "T1546.015,T1543.003,T1060"
  all:
  - id: objectives/persistence/system/registry/com-hijack::shellexecutehooks-com-hijack
  - id: service-install-and-start
  - id: objectives/persistence/login/registry/run-key::pe-registry-self-install
  - id: objectives/anti-static/obfuscation/payload/self-read::pe-overlay-self-extractor
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: service-admin-recognized-context
  desc: Recognized installer or vendor service component context
  crit: exception
  conf: 0.99
  any:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/binary/vendor/
  - id: well-known/app/system/iobit::iobit-malware-fighter-component-context
  - id: well-known/app/system/iobit::advanced-systemcare-component-context
  - id: metadata/signed/platform/
  - id: metadata/signed/developer
- id: service-admin-import-lifecycle
  desc: Service admin imports with lifecycle control
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/control::service-admin-import-cluster
  - id: micro-behaviors/os/service/host::service-config-change
  any:
  - id: micro-behaviors/os/service/control::delete-service
  - id: micro-behaviors/os/service/control::query-service-status
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/spawn::create-process-a
  downgrade:
    any:
    - id: service-admin-recognized-context
  unless:
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/plugin::known-nsis-plugin-basename
  - id: well-known/dual-use/tunnel/clash-verge/
- id: nativeaot-service-admin-dll
  desc: NativeAOT DLL with service administration
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/lang/compiler/aot::system-private-corelib
  - id: metadata/lang/compiler/aot::managed-executable-section
  - id: metadata/binary/metrics/pe-details::pe-dll-characteristics
  - id: micro-behaviors/os/service/control::service-admin-import-cluster
  any:
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::low-entropy-overlay-inflation
  - id: metadata/binary/layout::pe-checksum-mismatch
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  - id: micro-behaviors/fs/volume/admin::delete-volume-mount-point-w
  needs: 2
  downgrade:
    any:
    - id: metadata/binary/installer/family/
    - id: metadata/signed/platform/
- id: service-self-copy-install
  desc: Copies binary then installs service
  crit: suspicious
  conf: 0.95
  all:
  - id: service-install-and-start
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/fs/directory/mkdir::create-directory-a
  any:
  - id: micro-behaviors/fs/path/check::get-module-filename
  - id: micro-behaviors/os/service/control::service-control-dispatch
  downgrade:
    any:
    - id: metadata/binary/installer/family/
    - id: well-known/tool/sysadmin/sandboxie/
  unless:
  - id: well-known/app/utility/ventoy/
- id: service-copy-install-chain
  desc: Copies binary then installs service
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/control::create-service
  - id: micro-behaviors/fs/file/copy::copyfile-a
  any:
  - id: micro-behaviors/os/service/control::start-service
  - id: micro-behaviors/os/service/control::service-control-dispatch
  - id: micro-behaviors/fs/path/check::get-module-filename
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/app/utility/ventoy/
  downgrade:
    any:
    - id: metadata/package/versioning::pe-version-resource
    - id: metadata/signed/developer
- id: random-root-service-self-copy
  desc: Copies to random root path and installs service
  crit: hostile
  conf: 0.98
  all:
  - id: service-copy-install-chain
  - id: micro-behaviors/fs/path/location::hash-subdir-executable-in-root
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
- id: service-reconfigure-and-start
  desc: Reconfigures existing service for persistence
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/control::open-service
  - id: micro-behaviors/os/service/control::change-service-config
  - id: micro-behaviors/os/service/control::start-service
  any:
  - id: service-key-template
  - id: objectives/privilege-escalation/modify-service::service-imagepath-reg
  - id: objectives/privilege-escalation/modify-service::sc-config-binpath
  downgrade:
    any:
    - id: metadata/signed/developer
    - id: metadata/lang/compiler/systems/
  unless:
  - id: metadata/binary/vendor::bitdefender-product-marker
  - id: metadata/binary/framework/
- id: offline-files-service-reconfigure
  desc: Reconfigures Offline Files service
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/service/control::reconfigure-and-start-service
  - id: micro-behaviors/os/service/control::cscservice-name
  unless:
  - id: metadata/binary/vendor::glarysoft-ltd
- id: service-install-dispatch-chain
  desc: Installs service and dispatches
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/control::create-service
  - id: micro-behaviors/os/service/control::service-control-dispatch
  # Same reason as service-install-and-start: a self-read import chain is not
  # image-path manipulation, and pairing it with the dispatcher leg matched
  # every EXE that both registers and implements its own service.
  any:
  - id: service-key-template
  - id: objectives/privilege-escalation/modify-service::service-imagepath-reg
  - id: objectives/privilege-escalation/modify-service::sc-config-binpath
  downgrade:
    any:
    - id: metadata/binary/framework/
    - id: metadata/package/manifest/compat::virtualbox-platform-component
  unless:
  - id: metadata/signed/developer::brave-software
  - id: well-known/app/storage/syncback/
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-rootkit-revealer
- id: service-dll-registry-persistence
  desc: Persists DLL through Windows service
  crit: suspicious
  conf: 0.94
  all:
  - id: service-registry-key-fragment
  - id: micro-behaviors/os/registry/access::service-dll-value
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  any:
  - id: micro-behaviors/os/service/control::create-service
  - id: micro-behaviors/os/service/control::service-control-dispatch
  - id: micro-behaviors/os/service/control::start-service
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/metrics/threshold::many-exports-100
- id: service-dll-drop-persistence
  desc: Drops DLL and persists via Windows service
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/os/service/control::open-sc-manager
  - id: micro-behaviors/os/service/control::create-service
  - id: micro-behaviors/os/service/control::service-control-dispatch
  - id: micro-behaviors/os/service/host::service-dll-value-name
  - id: micro-behaviors/fs/file/write/direct::write-file
  any:
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  - id: micro-behaviors/os/service/host::system32-service-dll-target
  downgrade:
    any:
    - id: metadata/binary/installer/family/
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor/
- id: unsigned-service-dll-drop-with-rwx-section
  desc: Unsigned service DLL drop with custom RWX section
  crit: hostile
  conf: 0.99
  all:
  - id: service-dll-drop-persistence
  - id: metadata/binary/section/metrics::htext-rwx-section
  - id: metadata/binary/layout::pe-no-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: unsigned-crypter-service-reconfigure-start
  desc: Unsigned crypter shell reconfigures and starts a service
  # Service reconfiguration alone is ordinary installer work; a junk-padded
  # custom RWX crypt section supplying the context turns the pair into a
  # packed loader pivoting through an existing Windows service.
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/service/control::reconfigure-and-start-service
  - id: objectives/anti-static/pack/section-anomaly::custom-rwx-crypt-section-encrypted-blob
  - id: metadata/binary/layout::pe-no-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
