defaults:
  for: [pe]
  platforms: [windows]
  attack: T1543.003
composite_rules:
  - id: windir-self-copy-service-force-kill
    desc: Self-copy/service APIs and stack-built taskkill
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
      - id: micro-behaviors/fs/path/check::get-module-filename
      - id: micro-behaviors/fs/file/copy/call::copyfile-a
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/process/terminate/command::x86-stack-taskkill-force-image
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/native/pywin32::pywin32-binding-module
