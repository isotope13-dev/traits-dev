defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
composite_rules:
  - id: token-bypass-encoded-auto-service-installer
    desc: Token-bypass loader builds auto-start service script
    crit: hostile
    conf: 0.98
    attack: T1543.003
    all:
      - id: micro-behaviors/os/service/create::x86-encoded-auto-service-script-format
