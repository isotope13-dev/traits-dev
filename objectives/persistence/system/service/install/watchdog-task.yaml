# Self-healing service persistence: a LocalSystem auto-start service whose
# security descriptor is rewritten and which a minute-interval scheduled
# task restarts. Each leg alone is an admin capability; descriptor lockdown
# plus a 1-minute SYSTEM watchdog is the removal-resistance pattern, so all
# three are required.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1543.003

composite_rules:
  - id: watchdog-guarded-localsystem-service
    desc: Locked LocalSystem service guarded by minute watchdog task
    crit: hostile
    conf: 0.96
    attack: T1543.003,T1053.005
    all:
      - id: micro-behaviors/os/service/create::sc-local-system-auto-start
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
      - id: micro-behaviors/os/security/descriptor::powershell-sc-write-service-descriptor
    any:
      - id: micro-behaviors/os/autorun/task-principal::schtasks-system-runas
      - id: micro-behaviors/os/service/create::sc-create-start-sequence
