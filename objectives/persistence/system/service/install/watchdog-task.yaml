# Self-healing service persistence: a LocalSystem auto-start service whose
# security descriptor denies access and which a minute-interval SYSTEM task
# accompanies with a service-start action. Ordinary service creation, ACL
# grants, and monitoring tasks do not establish removal resistance; require
# the deny ACE, restart action, short schedule, and SYSTEM task principal.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1543.003

composite_rules:
  - id: watchdog-guarded-localsystem-service
    desc: Service access denial beside SYSTEM minute restart task
    crit: hostile
    conf: 0.96
    attack: T1543.003,T1053.005
    all:
      - id: micro-behaviors/os/service/create::sc-local-system-auto-start
      - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
      - id: micro-behaviors/os/security/descriptor::sc-sdset-deny-ace-admin-or-user
      - id: micro-behaviors/os/autorun/task-principal::schtasks-system-runas
      - id: micro-behaviors/os/autorun/task-action::schtasks-service-start-action
