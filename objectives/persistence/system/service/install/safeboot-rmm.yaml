defaults:
  platforms: [windows]
  for: [binaries, scripts, source, data, text]
  attack: "T1543.003"

traits:
  - id: safeboot-service-registration
    desc: SafeBoot Minimal or Network service registration
    crit: notable
    conf: 0.96
    # Registers a named service under the Minimal or Network SafeBoot key so it
    # starts when the host boots into Safe Mode, where third-party AV/EDR
    # services do not run. Both hives are abused for safe-mode persistence.
    unless:
      - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites
      - id: metadata/signed/leaf::malwarebytes-inc
    if:
      type: text
      regex: 'SafeBoot[\\/]+(Minimal|Network)[\\/]+[^''"\r\n]{3,80}'

  # Explicit AnyDesk allow-list under SafeBoot\Network (Akira Safe Mode case).
  - id: safeboot-network-anydesk-key
    desc: AnyDesk registered under SafeBoot Network
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)SafeBoot[\\/]+Network[\\/]+AnyDesk\b'

  - id: remote-access-service-name
    desc: Remote Access Service name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Remote Access Service
  - id: rmm-service-config-file
    desc: RMM service config file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(serviceconfig\.xml|simplegateway\.service)'

composite_rules:
  - id: rmm-safeboot-service-persistence
    desc: RMM service registered to start in Safe Mode
    # Remote-support products legitimately expose this for recovery sessions,
    # so the behavior is high-risk operational context rather than proof of an
    # attack. Campaign-specific corroboration below can still make it hostile.
    crit: suspicious
    conf: 0.98
    all:
      - id: safeboot-service-registration
    any:
      - id: remote-access-service-name
      - id: rmm-service-config-file
      - id: safeboot-network-anydesk-key
      # The incident used AnyDesk rather than a custom service name. Keep the
      # RMM identity directory here so the same SafeBoot abuse generalizes to
      # other remote-support agents already covered by that directory.
      - id: well-known/dual-use/remote-admin/rmm/
  - id: campaign-screenconnect-safeboot-service-persistence
    desc: Campaign-signed ScreenConnect runner installs a SafeBoot-capable Windows service
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/registry/keys::safeboot-network-base-regpath
      - id: micro-behaviors/os/service/control::service-admin-import-cluster
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-dotnet-service-runner-pdb
      - id: objectives/evasion/masquerade/cert::stephen-whang-cpa-authenticode-subject
