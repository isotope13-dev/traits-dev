defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003,T1036.004
composite_rules:
  - id: meshagent-browser-disguised-service
    desc: MeshAgent service configuration impersonates Microsoft Edge
    crit: hostile
    conf: 0.99
    # The supported claim is installation configuration, not observed runtime
    # success. The agent consumes these settings in its service installer.
    all:
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-upstream-marker
      - id: micro-behaviors/os/service/configure::meshagent-edge-service-name-setting
      - id: micro-behaviors/os/service/configure::meshagent-edge-display-name-setting
      - id: micro-behaviors/os/service/dispatch::start-service-dispatcher
