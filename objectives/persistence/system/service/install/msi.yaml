defaults:
  attack: "T1543.003"
  platforms: [windows]
  # Prefer pe/dll: ServiceExe* / ServiceInstall table names often surface in
  # nested installer custom-action binaries. MSI containers themselves are
  # Unknown and cannot host broad for:[all] text matchers under the filetype cap.
  for: [pe, dll]
traits:
  - id: msi-serviceinstall-table
    desc: MSI ServiceInstall table present
    crit: suspicious
    conf: 0.94
    if:
      type: text
      exact: ServiceInstall
  - id: msi-service-wrapper-binaries
    desc: MSI embeds service wrapper binaries
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: "ServiceExe(With|Without)Service"
composite_rules:
  - id: msi-service-installer-custom-action
    desc: MSI installs service via custom action
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/installer/database::msi-installer-database-title
      - id: msi-serviceinstall-table
      - id: msi-service-wrapper-binaries
      - id: metadata/binary/installer/database::embedded-managed-custom-action
      - id: micro-behaviors/process/create/exec::wix-ca-quietexec
