defaults:
  attack: "T1543.003"
  platforms: [windows]
  # ServiceExe* names surface in nested installer custom-action binaries.
  for: [pe, dll]
traits:
  - id: msi-service-wrapper-binaries
    desc: MSI embeds service wrapper binaries
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: "ServiceExe(With|Without)Service"
composite_rules:
  - id: msi-service-installer-custom-action
    # msi-installation-database-title, msi-serviceinstall-table, and
    # embedded-managed-custom-action are all `for: [oledoc]`/`[oledoc, msi]`
    # container-level facts (the MSI database), not facts on the embedded
    # service-wrapper PE member itself. scope: outer is the same mechanism
    # well-known/dual-use/remote-admin/screenconnect/msi.yaml already uses to
    # pair msi-service-wrapper-binaries (a PE-member fact) with
    # msi-serviceinstall-table (a container fact); as there, `for:` must
    # cover both the member type and the outer container type.
    for: [dll, oledoc, msi]
    scope: outer
    desc: MSI installs service via custom action
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: micro-behaviors/os/service/source::msi-serviceinstall-table
      - id: msi-service-wrapper-binaries
      - id: metadata/binary/installer/database::embedded-managed-custom-action
      - id: micro-behaviors/process/create/installer::wix-ca-quietexec
