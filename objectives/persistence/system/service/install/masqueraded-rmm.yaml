  for: [msi]
  attack: T1543.003,T1053.005,T1219

composite_rules:
  - id: viewer-lure-rmm-service-and-logon-task
    desc: Viewer-lure RMM installs service and logon task
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/masquerade/file/lure::viewer-named-rmm-agent-installer
