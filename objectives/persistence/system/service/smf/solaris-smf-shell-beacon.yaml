defaults:
  for: [c, objective_c]
  platforms: [unix]
  attack: T1543,T1041

traits:
  - id: smf-shell-network-service-hijack
    desc: SMF service changed to network shell
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule smf_shell_network_service_hijack {
          strings:
            $config = "svccfg -s "
            $setprop = "setprop "
            $refresh = "svcadm refresh "
            $enable = "svcadm enable "
            $shell = "/bin/sh -c "
            $netcat = " | nc "
            $beacon = "POST /beacon HTTP/1.1"
          condition:
            all of them
        }
