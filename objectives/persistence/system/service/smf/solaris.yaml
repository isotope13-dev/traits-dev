defaults:
  platforms: [solaris, unix]
  for: [shell, javascript, typescript, swift, go, objc, perl, ruby, elf]
  attack: T1543

traits:
  - id: solaris-smf-manifest-path
    desc: Writes Solaris SMF manifest path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*(cp|mv|install)\b.{0,160}\s/var/svc/manifest/.{1,120}\s*$'
    unless:
      - id: well-known/app/utility/sudo::source-tree
      - id: well-known/app/system/omnios-kayak::kayak-installer-context
      - id: well-known/dual-use/remote-admin/realvnc::realvnc-setup-utility

  - id: solaris-go-elf-modify-service-func
    desc: Solaris Go ELF modify service function
    crit: suspicious
    conf: 0.88
    for: [elf]
    if:
      type: text
      substr: main.modifyService

composite_rules:
  - id: solaris-smf-persistence
    desc: Solaris SMF persistence
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/app/utility/sudo::source-tree
      - id: well-known/app/system/omnios-kayak::kayak-installer-context
      - id: well-known/dual-use/remote-admin/realvnc::realvnc-setup-utility
    all:
      - id: solaris-smf-manifest-path
    any:
      - id: micro-behaviors/os/service/smf::solaris-smf-definition-import
      - id: micro-behaviors/os/service/smf::root-method-credential
      - id: micro-behaviors/os/service/smf::service-bundle-declaration

  - id: solaris-smf-service-import
    for: [elf, shell, go]
    desc: Solaris SMF service import
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/app/infrastructure/pm2::pm2-startup-api-path
      - id: well-known/app/utility/sudo::source-tree
      - id: well-known/app/system/omnios-kayak::kayak-installer-context
      - id: well-known/dual-use/remote-admin/realvnc::realvnc-setup-utility
      # `svccfg import` beside a service bundle is how a Solaris package
      # installs its service, which is why sudo, pm2, kayak and realvnc are
      # already carved out above. OpenSSH's contrib/solaris/buildpkg.sh is the
      # same recipe for sshd.
      - id: well-known/app/network/openssh::source-tree-path
      - id: well-known/app/network/openssh::portable-dev-list-address
      - id: well-known/app/network/openssh::solaris-package-init-variable
    all:
      - id: micro-behaviors/os/service/smf::solaris-smf-definition-import
    any:
      - id: micro-behaviors/os/service/smf::service-bundle-declaration
      - id: micro-behaviors/os/service/smf::solaris-smf-enable
      - id: solaris-go-elf-modify-service-func

  - id: solaris-smf-service-modify
    for: [elf, shell, go]
    desc: Solaris SMF service modify
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/app/system/omnios-kayak::kayak-installer-context
      - id: well-known/dual-use/remote-admin/realvnc::realvnc-setup-utility
    all:
      - id: micro-behaviors/os/service/smf::solaris-smf-fmri-reference
      - id: micro-behaviors/os/service/smf::solaris-smf-set-property
    any:
      - id: micro-behaviors/os/service/smf::solaris-smf-refresh
      - id: micro-behaviors/os/service/smf::solaris-smf-enable
