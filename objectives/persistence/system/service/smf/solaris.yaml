defaults:
  platforms: [solaris, unix]
  for: [shell, javascript, typescript, swift, go, objc, perl, ruby, elf]
  attack: T1543

traits:
  - id: solaris-smf-manifest-path
    desc: Writes Solaris SMF manifest path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*(cp|mv|install)\b.{0,160}\s/var/svc/manifest/.{1,120}\s*$'
    unless:
      - id: well-known/app/sudo::source-tree
      - id: metadata/package/quality/recognized-contexts-extra::kayak-installer-context

  - id: solaris-smf-service-bundle
    desc: Solaris SMF service bundle
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: <service_bundle type='manifest'
    unless:
      - id: well-known/app/sudo::source-tree
      - id: metadata/package/quality/recognized-contexts-extra::kayak-installer-context

  - id: solaris-smf-service-bundle-dq
    desc: Solaris SMF service bundle
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: <service_bundle type="manifest"
    unless:
      - id: well-known/app/sudo::source-tree
      - id: metadata/package/quality/recognized-contexts-extra::kayak-installer-context

  - id: solaris-smf-root-method
    desc: Solaris SMF root method
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: method_credential user='root'
    unless:
      - id: metadata/package/quality/recognized-contexts-extra::kayak-installer-context

  - id: solaris-go-elf-modify-service-func
    desc: Solaris Go ELF modify service function
    crit: suspicious
    conf: 0.88
    for: [elf]
    if:
      type: text
      substr: main.modifyService

composite_rules:
  - id: solaris-smf-persistence
    desc: Solaris SMF persistence
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/app/sudo::source-tree
      - id: metadata/package/quality/recognized-contexts-extra::kayak-installer-context
    all:
      - id: solaris-smf-manifest-path
    any:
      - id: micro-behaviors/os/service/config::solaris-smf-definition-import
      - id: solaris-smf-root-method
      - id: solaris-smf-service-bundle-dq

  - id: solaris-smf-service-import
    desc: Solaris SMF service import
    crit: hostile
    conf: 0.98
    unless:
      - id: well-known/app/pm2::pm2-startup-api-path
      - id: well-known/app/sudo::source-tree
      - id: metadata/package/quality/recognized-contexts-extra::kayak-installer-context
    all:
      - id: micro-behaviors/os/service/config::solaris-smf-definition-import
    any:
      - id: solaris-smf-service-bundle
      - id: solaris-smf-service-bundle-dq
      - id: micro-behaviors/os/service/config::solaris-smf-enable
      - id: solaris-go-elf-modify-service-func

  - id: solaris-smf-service-modify
    desc: Solaris SMF service modify
    crit: hostile
    conf: 0.98
    unless:
      - id: metadata/package/quality/recognized-contexts-extra::kayak-installer-context
    all:
      - id: micro-behaviors/os/service/config::solaris-smf-fmri-reference
      - id: micro-behaviors/os/service/config::solaris-smf-set-property
    any:
      - id: micro-behaviors/os/service/config::solaris-smf-refresh
      - id: micro-behaviors/os/service/config::solaris-smf-enable
