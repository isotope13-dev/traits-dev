defaults:
  platforms:
  - unix
  for:
  - python
composite_rules:
- id: python-user-unit-secret-access
  desc: User systemd unit beside secret-access code
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/service/config::python-user-systemd-unit
  any:
  - id: objectives/credential-access/cloud/container::packaged-python-cloud-kube-secret-harvest
  - id: objectives/credential-access/cloud/container::python-secret-tar-archive
  - id: micro-behaviors/os/container/orchestration::python-kubectl-structured-secret-read
  - id: objectives/credential-access/cloud/container::python-secretsmanager-access
