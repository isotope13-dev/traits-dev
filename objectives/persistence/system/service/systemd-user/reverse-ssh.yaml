defaults:
  platforms: [linux]
  for: [scripts, source, systemd-service]

composite_rules:
  - id: systemd-user-service-setup
    desc: User systemd service setup
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/config::systemd-user-service-directory-path
    any:
      - id: micro-behaviors/os/service/control::systemctl-enable-command
      - id: micro-behaviors/os/service/control::systemctl-enable-on-line
      - id: micro-behaviors/os/service/configure::source-systemctl-user-enable

  - id: ssh-key-backdoor-systemd-user-service
    desc: SSH key backdoor installs a user systemd service
    crit: hostile
    conf: 0.99
    attack: T1098.004,T1543.002,T1572
    all:
      - id: systemd-user-service-setup
    any:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-local-sshd-reverse-forward

  - id: local-sshd-reverse-forward-systemd-user-service
    desc: User systemd service setup accompanies reverse SSH access
    crit: suspicious
    conf: 0.96
    attack: T1543.002,T1572
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
      - id: systemd-user-service-setup

  - id: user-service-reverse-ssh-tunnel-persistence
    desc: Persistent user systemd service maintains reverse SSH tunnel
    crit: hostile
    conf: 0.98
    attack: T1543.002,T1572
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: micro-behaviors/os/service/restart/policy::restart-always
      - id: systemd-user-service-setup
