defaults:
  platforms: [unix]
  for: [python]
  attack: "T1552.001, T1041"
  mbc: E1552

composite_rules:
- id: python-pth-secret-harvest-user-persistence
  desc: Python .pth cloud/Kubernetes harvest with user systemd persistence
  crit: hostile
  conf: 0.99
  attack: T1546.004,T1552.001,T1543.002,T1611
  all:
  - id: micro-behaviors/process/interpreter/python::pth-startup-import
  - id: objectives/credential-access/env/secrets/filtered-access::python-bulk-secret-env-harvest
  - id: micro-behaviors/os/container/runtime::serviceaccount-token-api-references
  - id: micro-behaviors/os/service/config::python-user-systemd-unit
