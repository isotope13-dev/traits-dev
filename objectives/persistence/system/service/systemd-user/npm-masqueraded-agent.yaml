defaults:
  for: [javascript]
  platforms: [linux]
  attack: T1543.002,T1036

traits:
  - id: npm-agent-utils-postinstall
    desc: Postinstall runs agent utility
    crit: notable
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '^node[[:space:]]+(\./)?utils[.]js([[:space:]]|$)'
  - id: node-agent-microsoft-stem
    desc: Uses Microsoft-themed service name
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'var UNIT_STEM = "MicrosoftSystem64"'
  - id: node-agent-payload-name
    desc: Names bundled agent payload
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'var PAYLOAD_FILENAME = "payload.js"'
  - id: node-agent-copy-payload
    desc: Copies bundled agent to user data
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'fs.writeFileSync(targetJsPath, content)'
  - id: node-agent-read-payload
    desc: Reads bundled agent payload
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'fs.readFileSync(sourcePayloadPath)'
  - id: node-agent-systemd-exec
    desc: User service runs copied agent
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'ExecStart=${escPath(nodeExe)} ${escPath(jsPath)} --agent'
  - id: node-agent-systemd-enable
    desc: Enables user service for agent
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'spawnSync("systemctl", ["--user", "enable", `${UNIT_STEM}.service`]'
  - id: node-agent-run-linux-setup
    desc: Installs copied agent on Linux
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'setupLinux(targetJsPath, installDir)'

composite_rules:
  - id: node-masqueraded-user-service-agent
    desc: Copies agent into disguised user service
    crit: suspicious
    conf: 0.98
    scope: file
    all:
      - id: node-agent-microsoft-stem
      - id: node-agent-payload-name
      - id: node-agent-copy-payload
      - id: node-agent-read-payload
      - id: node-agent-systemd-exec
      - id: node-agent-systemd-enable
      - id: node-agent-run-linux-setup
  - id: npm-install-masqueraded-user-service-agent
    desc: Install deploys disguised agent service
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-masqueraded-user-service-agent
      - id: npm-agent-utils-postinstall
      - id: metadata/package/files/included::javascript-payload-basename
