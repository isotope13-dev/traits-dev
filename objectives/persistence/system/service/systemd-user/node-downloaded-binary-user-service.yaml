# Node code that downloads an executable to a hidden home directory, runs
# it detached at once, and also enrolls it as a restarting user systemd
# service gives that unsigned download both immediate execution and
# survival across logout and reboot. Vendor installers that set up a user
# service ship or verify their binary; they do not combine a hidden
# staging directory, a detached first run and a respawn policy for an
# arbitrary fetch. Hosts, service names and the launcher used to start
# the binary are not legs.
defaults:
  platforms: [linux]
  for: [javascript, typescript]
  attack: T1543.002,T1105
  mbc: B0028

composite_rules:
  - id: node-downloaded-binary-user-service
    desc: Downloaded binary run detached and kept as user service
    crit: hostile
    conf: 0.96
    near_bytes: 4096
    all:
      - id: objectives/execution/payload/file-exec/download/native::node-fetch-writefile-chmod-detached-spawn
      - id: objectives/persistence/system/service/systemd-user::systemd-user-service-setup
    any:
      - id: micro-behaviors/os/service/restart/policy::restart-always
      - id: micro-behaviors/os/service/restart/policy::restart-on-failure
      - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
