defaults:
  attack: T1543.002
  platforms:
  - linux
  for:
  - shell
  - python
  - systemd
  - go
  - rust
  - objc
  - c
  - cpp
composite_rules:
- id: systemd-user-linger-hidden-respawn
  desc: Hidden user service persists with account lingering and automatic respawn
  crit: hostile
  conf: 0.97
  for:
  - shell
  - python
  - go
  - rust
  - objc
  - c
  - cpp
  all:
  - id: micro-behaviors/os/service/config::systemd-user-unit
  - id: micro-behaviors/os/service/configure::loginctl-enable-linger
  - id: objectives/persistence/system/service/systemd::exec-start-hidden-executable
  - id: micro-behaviors/os/service/restart/policy::restart-always-text
- id: conditional-hidden-user-timer-beacon
  desc: Conditionally stages a hidden recurring systemd curl beacon
  crit: hostile
  conf: 0.98
  for:
  - shell
  all:
  - id: micro-behaviors/os/service/config::systemd-user-unit
  - id: micro-behaviors/os/service/config::systemd-http-client-command-text
  - id: objectives/persistence/system/cron/schedule::source-systemd-curl-exec
  - id: micro-behaviors/os/service/unit-field::exec-start-text
  - id: objectives/persistence/system/cron/schedule::source-frequent-calendar-schedule
  - id: objectives/persistence/system/cron/schedule::source-persistent-timer-directive
  - id: micro-behaviors/fs/path/hidden::env-home-hidden-path
- id: node-user-service-curl-beacon-persistence
  desc: Node installs and enables user systemd curl beacon service
  crit: hostile
  conf: 0.98
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/os/service/config::systemd-user-service-directory-path
  - id: objectives/persistence/system/cron/schedule::source-systemd-curl-exec
  - id: micro-behaviors/os/service/configure::source-systemctl-user-enable
  - id: micro-behaviors/process/create/exec::js-execfile-call
  unless:
  - id: metadata/path/directory::test-directory-component
