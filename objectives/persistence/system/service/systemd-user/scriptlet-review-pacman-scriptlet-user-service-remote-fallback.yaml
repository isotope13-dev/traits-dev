defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pacman-scriptlet-user-service-remote-fallback
    desc: Pacman scriptlet enables user service and detached fetch
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1543.002,T1105
    near_lines: 40
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-lifecycle-hook-fn
      - id: micro-behaviors/os/service/config::systemctl-user-enable
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
      - id: micro-behaviors/process/daemonize/detach::nohup-command
    unless:
      - id: metadata/package/testing/presence/path::pkgbuild-test-fixture-path

