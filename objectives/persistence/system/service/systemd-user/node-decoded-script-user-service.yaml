# A package lifecycle script accepts a Base64 payload, writes it as an
# executable script, and enrolls it as an always-restarting user service.
# The supplied payload is opaque, but the installer itself establishes
# persistence for arbitrary code under the user's account.
defaults:
  platforms: [linux]
  for: [javascript, typescript]
  attack: T1543.002,T1059.006
  mbc: B0028

composite_rules:
  - id: node-decoded-script-user-service
    desc: Base64 script persists as restarting user service
    crit: hostile
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: objectives/persistence/system/service/systemd-user::systemd-user-service-setup
      - id: micro-behaviors/os/service/restart/policy::embedded-restart-always-policy
      - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
