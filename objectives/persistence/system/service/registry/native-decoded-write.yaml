defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-decoded-schedule-registry-install
    desc: Replaces decoded Schedule service ImagePath
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_decoded_schedule_registry_install {
         strings:
          $setup = { 6A 02 68 ?? ?? ?? ?? 68 ?? ?? ?? ?? 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 59 50 68 02 00 00 80 E8 ?? ?? ?? ?? }
          $writer = { 55 8B EC 51 51 8D 45 F8 50 FF 75 0C FF 75 08 FF 15 ?? ?? ?? ?? FF 75 14 E8 ?? ?? ?? ?? 59 89 45 FC FF 75 FC FF 75 14 FF 75 18 6A 00 FF 75 10 FF 75 F8 FF 15 ?? ?? ?? ?? }
          $decoder = { 55 8B EC 51 C7 45 FC 00 00 00 00 EB 09 8B 45 FC 83 C0 01 89 45 FC 8B 4D 08 51 E8 ?? ?? ?? ?? 83 C4 04 39 45 FC 73 16 8B 55 08 03 55 FC 0F BE 02 83 F0 02 8B 4D 08 03 4D FC 88 01 EB D0 8B 45 08 8B E5 5D C3 }
          $key = "SYSTEM\\CurrentControlSet\\Services\\Schedule" xor(2)
          $value = "ImagePath\x00"
          $lookup = { 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 83 C4 04 50 A1 ?? ?? ?? ?? 50 FF 15 ?? ?? ?? ?? A3 ?? ?? ?? ?? }
          $regresolve = { 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 83 C4 04 50 A1 ?? ?? ?? ?? 50 FF 15 ?? ?? ?? ?? A3 ?? ?? ?? ?? }
          $getproc = "GetProcAddress" xor(2)
          $regapi = "RegSetValueExA" xor(2)
         condition:
          for any idx_lookup in (1..#lookup) : (
          for any idx_regresolve in (1..#regresolve) : (
          for any idx_setup in (1..#setup) : (
          for any idx_writer in (1..#writer) : (
          pe.machine == pe.MACHINE_I386 and
          all of them and
          for any s in pe.sections : (s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and @setup[idx_setup] >= s.raw_data_offset and @setup[idx_setup]+!setup[idx_setup] <= s.raw_data_offset+s.raw_data_size) and
          for any s in pe.sections : (s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and @writer[idx_writer] >= s.raw_data_offset and @writer[idx_writer]+!writer[idx_writer] <= s.raw_data_offset+s.raw_data_size) and
          $key at pe.rva_to_offset(uint32(@setup[idx_setup]+13)-pe.image_base) and
          for any s in (0..pe.number_of_sections-1) : (
           pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
           @setup[idx_setup] >= pe.sections[s].raw_data_offset and @setup[idx_setup]+!setup[idx_setup] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
           $decoder at pe.rva_to_offset(pe.sections[s].virtual_address+@setup[idx_setup]-pe.sections[s].raw_data_offset+22+int32(@setup[idx_setup]+18)) and
           $writer at pe.rva_to_offset(pe.sections[s].virtual_address+@setup[idx_setup]-pe.sections[s].raw_data_offset+34+int32(@setup[idx_setup]+30))
         ) and
          $value at pe.rva_to_offset(uint32(@setup[idx_setup]+8)-pe.image_base) and
          for any s in pe.sections : (s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and @lookup[idx_lookup] >= s.raw_data_offset and @lookup[idx_lookup]+!lookup[idx_lookup] <= s.raw_data_offset+s.raw_data_size) and
          uint32(@lookup[idx_lookup]+22) == pe.image_base+pe.import_rva("KERNEL32.dll","GetProcAddress") and
          $getproc at pe.rva_to_offset(uint32(@lookup[idx_lookup]+1)-pe.image_base) and
          $regapi at pe.rva_to_offset(uint32(@regresolve[idx_regresolve]+1)-pe.image_base) and
          uint32(@regresolve[idx_regresolve]+22) == uint32(@lookup[idx_lookup]+27) and
          uint32(@regresolve[idx_regresolve]+27) == uint32(@writer[idx_writer]+52) and
          for any s in (0..pe.number_of_sections-1) : (@regresolve[idx_regresolve] >= pe.sections[s].raw_data_offset and @regresolve[idx_regresolve]+!regresolve[idx_regresolve] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and $decoder at pe.rva_to_offset(pe.sections[s].virtual_address+@regresolve[idx_regresolve]-pe.sections[s].raw_data_offset+10+int32(@regresolve[idx_regresolve]+6)) and $decoder at pe.rva_to_offset(pe.sections[s].virtual_address+@lookup[idx_lookup]-pe.sections[s].raw_data_offset+10+int32(@lookup[idx_lookup]+6)))
          )
          )
          )
          )
        }
composite_rules:
  - id: native-rootkit-schedule-imagepath-persistence
    desc: Concealed agent replaces Schedule ImagePath
    crit: hostile
    conf: 0.99
    all:
      - id: x86-decoded-schedule-registry-install
      - id: objectives/evasion/kernel-hide/rootkit::native-driver-process-object-concealment
