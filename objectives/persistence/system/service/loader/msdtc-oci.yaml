defaults:
  for: [pe]
  platforms: [windows]
  attack: T1574.001,T1543.003

composite_rules:
  # OCI and MSDTC are the existing Windows load surface, rather than names
  # chosen for a dropped payload. Header restoration excludes an ordinary
  # Oracle/MSDTC configuration utility. The traced writer restores MZ and
  # writes the DLL into System32 before restarting MSDTC.
  - id: mz-stager-msdtc-oci-service-replacement
    desc: MZ-restoring stager configures MSDTC with OCI DLL
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/embedded/payload/header::restore-dos-magic-byte-stores-x86
      - id: micro-behaviors/fs/path/library::oci-dll-reference
      - id: micro-behaviors/os/service/configure::sc-msdtc-local-system-account
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/process/create/spawn::create-process-w
