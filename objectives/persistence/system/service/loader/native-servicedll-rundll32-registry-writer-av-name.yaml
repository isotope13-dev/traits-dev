defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003,T1218.011
composite_rules:
  - id: native-servicedll-rundll32-launcher-with-registry-writes-and-av-product-name
    desc: Native ServiceDll rundll32 launcher naming 360
    crit: hostile
    conf: 0.82
    all:
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: micro-behaviors/os/service/export::win-service-export
      - id: metadata/lang/source/syntax/command/invocation::rundll32-command-syntax-reference
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/os/security/product::qihoo-360-safe-term
