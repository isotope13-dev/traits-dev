# Sendori/RadPlayer adware persists via the RadPlayerV1 Windows service; an
# elevated helper starts and controls that named service through the SCM.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003
  mbc: F0015

composite_rules:
  - id: radplayer-v1-scm-service-control
    desc: SCM start/control of RadPlayerV1 service
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/unwanted/sendori::radplayer-v1-service-name
      - id: micro-behaviors/os/service/control::open-sc-manager-import
      - id: micro-behaviors/os/service/control::start-service
      - id: micro-behaviors/os/service/control::control-service
