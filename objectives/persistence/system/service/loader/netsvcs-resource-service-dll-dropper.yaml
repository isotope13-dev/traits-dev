# Gh0st-style service installers carry the payload DLL in their own
# resources, register it as a ServiceDll hosted under an svchost netsvcs
# group and start it. A signed installer can do the same for a legitimate
# service, so signed binaries are excluded.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003
composite_rules:
  - id: netsvcs-resource-service-dll-dropper
    desc: Resource payload installed as svchost netsvcs ServiceDll
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/host::svchost-netsvcs-group-name
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    unless:
      - id: metadata/signed/platform/
  # Variant installers skip the canonical Find/Load/Lock/Sizeof chain (no
  # FindResource/LockResource imports) yet still carry the payload PE in
  # their own resources, drop it with timestomped writes, and register it
  # as a ServiceDll under an svchost netsvcs group. Same persistence claim
  # through embedded bytes plus file-timestamp manipulation instead.
  - id: netsvcs-embedded-pe-service-file-dropper
    desc: Embedded PE dropped and installed as svchost netsvcs service
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/service/host::svchost-netsvcs-group-name
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: micro-behaviors/os/service/create::create-service
      - id: metadata/binary/resource/identity::dos-header-prefix-in-resource
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/fs/file/timestamp::set-file-time
    unless:
      - id: metadata/signed/platform/
