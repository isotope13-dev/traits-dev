# Gh0st-style service installers carry the payload DLL in their own
# resources, register it as a ServiceDll hosted under an svchost netsvcs
# group and start it. A signed installer can do the same for a legitimate
# service, so signed binaries are excluded.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003
composite_rules:
  - id: netsvcs-resource-service-dll-dropper
    desc: Resource payload installed as svchost netsvcs ServiceDll
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/host::svchost-netsvcs-group-name
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    unless:
      - id: metadata/signed/platform/
