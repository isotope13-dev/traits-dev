defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: mew-entry-section
    desc: PE entry point in MEW packer section
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.entry_section
      exact: MEW

  - id: active-setup-installed-components
    desc: Active Setup Installed Components key
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: SOFTWARE\Microsoft\Active Setup\Installed Components

  - id: create-remote-thread-str
    desc: CreateRemoteThread API name in PE
    crit: notable
    conf: 0.90
    if:
      type: text
      exact: CreateRemoteThread

composite_rules:
  - id: mew-packed-lanmanserver-active-setup-injector
    desc: MEW-packed LanmanServer ServiceDLL and Active Setup injector
    crit: hostile
    conf: 0.98
    attack: T1543.003,T1547.014,T1055.001
    all:
      - id: mew-entry-section
      - id: micro-behaviors/os/registry/service/reference::lanmanserver-parameters-regpath
      - id: micro-behaviors/os/registry/value-name::service-dll-value
      - id: active-setup-installed-components
      - id: create-remote-thread-str
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
