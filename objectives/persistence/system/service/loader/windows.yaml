# A service DLL that reads and dynamically resolves a worker is a loader
# capability.  The unsigned service/export combination is intentionally narrow:
# normal service clients and signed service hosts do not match it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1543.003,T1129

composite_rules:
  - id: unsigned-service-dll-worker-loader
    desc: Unsigned service DLL reads and loads worker
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/service/control::exported-register-service-entrypoint
      - id: micro-behaviors/os/service/control::register-service-handler
      - id: micro-behaviors/os/service/control::set-service-status
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/fs/file/read::read-file
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-w

