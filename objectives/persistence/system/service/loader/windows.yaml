# A service DLL that reads and dynamically resolves a worker is a loader
# capability.  The unsigned service/export combination is intentionally narrow:
# normal service clients and signed service hosts do not match it.
defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll]
  attack: T1543.003,T1129

composite_rules:
  - id: unsigned-service-dll-worker-loader
    desc: Unsigned service DLL reads and loads worker
    conf: 0.98
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/os/service/dispatch::exported-register-service-entrypoint
      - id: micro-behaviors/os/service/dispatch::register-service-handler
      - id: micro-behaviors/os/service/dispatch::set-service-status
      - id: micro-behaviors/process/create/thread::create-thread
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-w

  # Service DLL that both hosts as a Windows service and speaks Microsoft Graph
  # OneDrive path-style content APIs with OAuth refresh — persistence plus
  # cloud dead-drop channel, not a signed vendor sync client.
  - id: unsigned-graph-onedrive-service-implant
    desc: Unsigned Graph OneDrive service implant
    conf: 0.97
    attack: T1102.002,T1071.001
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/os/service/export::win-service-export
      - id: micro-behaviors/os/service/dispatch::register-service-handler
      - id: micro-behaviors/communications/http/oauth::microsoft-graph
      - id: micro-behaviors/communications/http/oauth::microsoft-login
      - id: micro-behaviors/communications/http/oauth::oauth-refresh-grant-type
      - id: micro-behaviors/communications/http/services/microsoft::graph-drive-file-content
    unless:
      - id: metadata/signed/platform/

  - id: hidden-rdp-servicedll-hijack
    desc: Hijacks TermService and UmRdpService ServiceDll for hidden RDP
    crit: hostile
    conf: 0.99
    for: [c, cpp, csharp, go, rust, pe, dll]
    attack: T1543.003,T1563.002
    all:
      - id: micro-behaviors/os/service/remote::termservice-umrdpservice-pair
      - id: micro-behaviors/os/registry/keys/service::system-services-registry-path
      - id: micro-behaviors/fs/path/system::programdata-library-path
    any:
      - id: micro-behaviors/os/service/host::servicedll-registry-value-source
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: micro-behaviors/os/service/remote::termsrv-concurrent-patch-markers
    needs: 2
