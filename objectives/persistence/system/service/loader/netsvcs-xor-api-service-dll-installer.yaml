# A service installer that registers a DLL under an svchost netsvcs group
# is normal for Windows components. One that also hides CreateProcess and
# VirtualAlloc behind an XOR-encoded name table, so none of the loader APIs
# appear in its import list, is a backdoor installer (the Redosdru and
# Gh0st lineage): the service host later loads the hidden payload.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003,T1027,T1569.002
composite_rules:
  - id: netsvcs-service-dll-installer-with-xor-api-names
    desc: netsvcs ServiceDll installer with XOR-hidden APIs
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/os/service/host::svchost-netsvcs-group-name
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/dylib/lookup::encoded-createprocess-name
      - id: micro-behaviors/dylib/lookup::encoded-virtualalloc-name
    unless:
      - id: metadata/signed/platform/
