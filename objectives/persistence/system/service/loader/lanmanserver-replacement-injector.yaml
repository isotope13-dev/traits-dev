defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  size_min: 4096
  size_max: 1048576

composite_rules:
  # At the reviewed code's two calls, the same LanmanServer ServiceDLL value
  # is deleted then replaced with REG_EXPAND_SZ data. The neutral write atom
  # binds the calls and value-name pointers; the other legs add hijack context.
  # No chosen payload filename or family banner gates the objective. Damaged
  # resources may prevent installation; this finding identifies surviving code.
  - id: lanmanserver-servicedll-replacement-injector
    desc: LanmanServer DLL replacement and injection code
    crit: hostile
    conf: 0.98
    attack: T1543.003,T1055.001
    all:
      - id: micro-behaviors/process/inject/dll::resource-dll-injector-service-registry-api-profile
      - id: micro-behaviors/os/registry/manipulate::reg-delete-value-a-symbol
      - id: micro-behaviors/os/registry/write::x86-servicedll-delete-replace-128
