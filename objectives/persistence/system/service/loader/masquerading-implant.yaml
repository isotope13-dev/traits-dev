defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: masquerading-implant-service-dll-registration
    desc: Masquerading autorun implant with service-DLL registry APIs
    crit: hostile
    conf: 0.97
    attack: T1543.003
    all:
      - id: objectives/evasion/masquerade/process/path::svchost-lookalike-autorun-copy
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: micro-behaviors/os/service/host::svchost-k-service-group
      - id: micro-behaviors/os/registry/keys/service::system-services-registry-path
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
