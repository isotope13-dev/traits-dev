defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: lanmanserver-resource-injection-hijack
  desc: LanmanServer hijack with DLL-injection APIs
  crit: hostile
  conf: 0.99
  attack: T1543.003,T1574.001,T1055.001
  all:
  - id: "micro-behaviors/os/registry/keys/service::lanmanserver-parameters-regpath"
  - id: micro-behaviors/os/registry/access::service-dll-value
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/process/inject/dll::remote-loadlibrary-api-profile
  - id: micro-behaviors/fs/write/file/handle::write-file
