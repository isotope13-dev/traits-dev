defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003,T1574.001,T1055.001

composite_rules:
# This is a static code/API profile, not proof of an installed service or a
# usable payload. Resource-erased and code-erased descendants retain it.
- id: lanmanserver-resource-injection-hijack
  desc: LanmanServer write APIs and resource DLL-injector code
  crit: hostile
  conf: 0.99
  all:
  - id: "micro-behaviors/os/registry/keys/service::lanmanserver-parameters-regpath"
  - id: micro-behaviors/os/registry/access::service-dll-value
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/process/inject/dll::x86-remote-dll-export-thread
  - id: micro-behaviors/fs/write/file/handle::write-file

- id: lanmanserver-servicedll-remote-injection
  desc: LanmanServer write APIs and remote DLL thread handoff
  crit: hostile
  conf: 0.99
  all:
  - id: "micro-behaviors/os/registry/keys/service::lanmanserver-parameters-regpath"
  - id: micro-behaviors/os/registry/access::service-dll-value
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
  - id: micro-behaviors/process/inject/dll::x86-remote-dll-export-thread
  # Strict subset of lanmanserver-resource-injection-hijack above: when the
  # fuller registry-write plus drop-chain profile fires, this adds nothing.
  unless:
  - id: lanmanserver-resource-injection-hijack
