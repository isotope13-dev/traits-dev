---
defaults:
  platforms:
  - windows
  - unix
  for:
  - shell
  - batch
  - powershell
  - python
  - javascript
  - go
  crit: notable
  conf: 0.86
composite_rules:
- id: tunnel-run-as-external-service
  desc: Tunnel command and service registration clues
  crit: suspicious
  conf: 0.93
  for:
  - scripts
  - systemd-service
  platforms:
  - windows
  - linux
  all:
  - id: micro-behaviors/communications/proxy/tunnel::tunnel-run-token-command
  any:
  - id: micro-behaviors/os/service/config::powershell-binary-service-command
  - id: micro-behaviors/os/service/create::sc-create-command
  - id: micro-behaviors/os/service/unit-field::exec-start-text
  - id: well-known/dual-use/tunnel/cloudflared::cloudflared-systemd-service
- id: persistent-tunnel-service
  desc: Tunnel service configuration clues
  crit: suspicious
  conf: 0.94
  for:
  - scripts
  - systemd-service
  platforms:
  - windows
  - linux
  any:
  - id: objectives/persistence/system/service/tunnel::tunnel-run-as-external-service
  - id: micro-behaviors/os/service/create::tunnel-connector-service-install-token
  - id: objectives/persistence/system/service/tunnel::renamed-tunnel-connector-service-install
- id: renamed-tunnel-connector-service-install
  desc: Token-shaped text and service registration clues
  crit: suspicious
  conf: 0.93
  for:
  - scripts
  - systemd-service
  platforms:
  - windows
  - linux
  all:
  - id: metadata/lang/encoding/base64::cloudflare-tunnel-token-credential
  any:
  - id: micro-behaviors/os/service/create::tunnel-connector-service-install-token
  - id: micro-behaviors/os/service/create::sc-create-command
  - id: micro-behaviors/os/service/config::powershell-binary-service-command
  - id: micro-behaviors/os/service/unit-field::exec-start-text
  - id: well-known/dual-use/tunnel/cloudflared::cloudflared-systemd-service
