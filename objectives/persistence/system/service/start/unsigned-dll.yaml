# Unsigned mixed-mode DLL that can start a Windows service while
# packing a high-entropy .data blob. Helper-service adware uses this
# combination; signed service hosts do not.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1543.003

composite_rules:
  - id: unsigned-mixed-mode-service-start
    desc: Unsigned mixed-mode service starter
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/compiler/managed::msvc-clr-dllmain-diagnostic
      - id: micro-behaviors/os/service/control::start-service
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/anomaly/signing::small-high-entropy-data-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
