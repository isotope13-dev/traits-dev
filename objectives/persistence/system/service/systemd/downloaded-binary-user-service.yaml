# A shell script that fetches a raw executable, marks it executable, and
# enrolls it as an auto-restarting user-level systemd service. Package
# managers install services from signed packages; a script that turns an
# arbitrary download into a respawning user service is installing an agent
# that survives logout, reboot, and being killed.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1543.002,T1105
  mbc: B0028

composite_rules:
  - id: shell-downloaded-binary-user-service
    desc: Installs a downloaded binary as a respawning user service
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/config::systemd-user-unit
      - id: micro-behaviors/os/service/control::systemctl-enable-command
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/download/wget::wget-output-file

  # The executable comes from a free app-hosting platform rather than a
  # vendor's release infrastructure: a disposable host that anyone can stand
  # up in minutes, serving an unsigned binary that becomes a persistent
  # service.
  - id: shell-managed-host-binary-user-service
    desc: Persists a binary fetched from app hosting as a user service
    crit: hostile
    conf: 0.95
    all:
      - id: shell-downloaded-binary-user-service
    any:
      - id: micro-behaviors/communications/http/services/cloud::managed-cloud-host
      - id: micro-behaviors/communications/http/services/file-hosting/
