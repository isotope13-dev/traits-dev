defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: package-worm-immutable-systemd-units
    desc: Package worm enables and protects systemd units
    crit: hostile
    conf: 0.98
    attack: T1543.002,T1222.002
    all:
      - id: micro-behaviors/fs/attributes/chattr::systemd-unit-set-immutable
      - id: micro-behaviors/os/service/control::systemctl-enable-command
      - id: micro-behaviors/os/service/config::embedded-systemd-unit
    any:
      - id: objectives/supply-chain/hidden-payload/worm::aur-install-script-poisoning-push
      - id: objectives/supply-chain/hidden-payload/worm::npm-credential-fanout-hook-propagation
