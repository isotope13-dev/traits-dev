# Redundant multi-supervisor persistence deployed by native botnet implants.
# The binary embeds installation templates across systemd, cron, and init/rc
# services to survive reboots regardless of which service manager is active.
defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1543.002,T1053.003,T1037.004
  mbc: B0012

composite_rules:
  - id: native-multi-supervisor-boot-persistence
    desc: Multi-supervisor boot persistence installation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: micro-behaviors/os/service/config::init-script-path
      - id: micro-behaviors/os/service/restart/policy::restart-always-text
      - id: micro-behaviors/os/service/unit-field::wanted-by-multi-user-text
    any:
      - id: micro-behaviors/os/autorun/cron/entry::native-root-reboot-entry
      - id: micro-behaviors/os/autorun/cron/entry::crontab-at-reboot
      - id: micro-behaviors/fs/path/config/scheduled::cron-d-path-reference
