defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: go-kernel-name-respawning-service
    desc: Go bot persists through a respawning kernel-thread-named service
    crit: hostile
    conf: 0.98
    attack: T1036.004,T1543.002
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: objectives/evasion/masquerade/path::kernel-thread-name-binary-path
      - id: micro-behaviors/os/service/unit-field::exec-start-text
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
  - id: flood-bot-cron-systemd-templates
    desc: HTTP flood bot cron and systemd templates
    crit: hostile
    conf: 0.97
    attack: T1053.003,T1543.002
    mbc: B0012
    all:
      - id: objectives/impact/dos/http::native-oversized-http-post-flood
      - id: micro-behaviors/os/autorun/cron::reboot-entry-reference
      - id: micro-behaviors/os/service/unit-field::native-unit-template
    # Prefer the richer objective when init-script persistence is also present.
    unless:
      - id: objectives/persistence/system/init/boot::multi-method-elf-persistence-templates
  - id: flood-bot-systemd-cron-persistence
    desc: Flood bot installs a respawning unit and a reboot cron entry
    crit: hostile
    conf: 0.96
    attack: T1543.002,T1053.003
    all:
      - id: objectives/impact/dos/attack/selector::hyphenated-flood-mode-dispatcher
      - id: micro-behaviors/os/service/unit-field::native-unit-template
      - id: micro-behaviors/os/autorun/cron::reboot-entry-reference
      - id: micro-behaviors/os/service/control::systemctl-enable-command

  - id: http-get-flood-systemd-cron-persistence
    desc: HTTP GET flood bot with systemd and cron persistence
    crit: hostile
    conf: 0.97
    attack: T1498.001,T1543.002,T1053.003
    mbc: B0030
    all:
      - id: micro-behaviors/communications/http/get::formatted-get-host-template
      - id: micro-behaviors/os/service/unit-field::native-unit-template
      - id: micro-behaviors/os/service/control::systemctl-enable-command
      - id: micro-behaviors/os/autorun/cron::crontab-at-reboot

