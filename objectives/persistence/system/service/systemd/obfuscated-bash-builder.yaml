# Bash systemd-user persistence builder embedded in obfuscated JS/script.
# JS-string-array obfuscators split a multi-line bash script into many
# small fragments, each rotated through a decoder. The reassembled
# script writes a [Service] unit to ~/.config/systemd/user/, sets
# Restart=always + WantedBy=default.target, and `systemctl --user
# enable && start`s it. The individual fragments here are uncommon
# in legitimate code; the cluster is hostile.
#
# Examples (npm xmlrpc, xmrdropper variants):
#   `\nSYSTEMD_PATH=$HOME/.config/systemd/user`
#   `Restart=always\nWantedBy=default.target`
#   `systemctl --user enable $APPNAME.service`
defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1543.002
  mbc: F0011
traits:
- id: obfuscated-systemd-user-path-fragment
  desc: Obfuscated systemd user path fragment
  crit: notable
  conf: 0.92
  # `systemd/us[^e]` matches the path only when it is broken before `user`
  # (a split-string concatenation fragment such as "systemd/us"+"er"), so the
  # ordinary contiguous `/usr/lib/systemd/user/` path is not flagged as
  # "obfuscated". The `\x0aSYSTEMD` leg is the literal newline-escape tell.
  if:
    type: text
    regex: '\\x0aSYSTEMD|systemd/us[^e]'
- id: service-unit-write-fragment
  desc: Service unit write redirection fragment
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '\.service\\\\x20>|E\.service\\\\x20'
- id: restart-always-fragment
  desc: Restart=always systemd directive fragment
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '\b(start|rt)=alwa'
composite_rules:
- id: obfuscated-systemd-bash-builder
  desc: Embedded systemd persistence bash builder
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/os/service/control::systemctl-user-fragment
  - id: service-unit-write-fragment
  needs: 2
  any:
  - id: obfuscated-systemd-user-path-fragment
  - id: micro-behaviors/os/service/config::systemd-user-service-directory-path
  - id: restart-always-fragment
  - id: micro-behaviors/os/service/restart-policy::restart-always-text
  - id: micro-behaviors/os/service/unit-field::default-target-field-evidence
  - id: micro-behaviors/fs/path/os/identity::linux-release-file-reference
  downgrade:
    any:
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
