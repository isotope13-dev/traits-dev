  for:
  - elf
  all:
  - id: micro-behaviors/os/service/unit-field::native-unit-template
  - id: objectives/impact/dos/http::native-oversized-http-post-flood
  any:
  - id: objectives/lateral-movement/exploit/network-device/upnp::huawei-upnp-encoded-download-exec
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-downloader-pattern
  - id: objectives/persistence/system/init/boot::linux-init-script
  - id: metadata/file/extension/architecture::multi-arch-bot-suffix-cluster
  - id: objectives/evasion/masquerade/process/system-name::daemon-helper-name-masquerade
  - id: micro-behaviors/fs/path/device/special::multi-watchdog-device-cluster
