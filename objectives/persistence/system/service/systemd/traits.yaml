defaults:
  attack: T1543.002
  platforms: [linux]
  # `c`/`cpp` included: an ELF implant that installs its own unit carries the
  # unit body as a string literal in its source, and stripped builds are read
  # as `elf`. Without them the whole leaf was blind to C implants writing
  # `/etc/systemd/system/*.service` — the most common shape there is.
  for: [shell, python, systemd, go, rust, objc, c, cpp]

traits:
- id: systemctl-enable
  desc: Enables a systemd service to start automatically
  crit: notable
  conf: 0.8
  mbc: B0028
  unless:
  - type: text
    substr: 'Source: https://docs.docker.com/engine/install/linux-postinstall/'
  - type: text
    substr: '# Configure Docker to boot up with the OS'
  - type: text
    regex: '\bsystemctl\s+enable\s+docker\b'
  - type: text
    regex: '\bsystemctl\s+enable\s+earlyoom\b'
  - type: basename
    regex: '(^|[\\/])(README|REQUIREMENTS|INSTALL)(\.[A-Za-z0-9]+)?$'
  - id: metadata/file/extension/identity::markdown-file-basename
  if:
    type: text
    regex: '(?m)^\s*(sudo\s+)?systemctl\s+enable\b'
  downgrade:
    any:
    - id: well-known/tool/sysadmin/kubernetes
- id: systemd-worker-service-path
  desc: systemd-worker service install path
  crit: suspicious
  conf: 0.94
  for: [elf, shell, python]
  if:
    type: text
    substr: /lib/systemd/system/systemd-worker.service

- id: wanted-by-target-text
  # WantedBy=default.target enrolls the unit for automatic start — a
  # persistence directive that defines program purpose, hence notable.
  desc: 'WantedBy=default.target directive'
  crit: notable
  conf: 0.7
  for: [shell, python, systemd, go, rust, objc, elf]
  if:
    type: text
    word: "WantedBy=default.target"
  unless:
    - id: metadata/file/catalog/service::cloud-init-embedded-systemd-bootstrap-unit

- id: wanted-by-target-kv
  desc: 'WantedBy=default.target directive'
  for: [systemd]
  crit: component
  if:
    type: value
    path: "install.wanted_by"
    exact: "default.target"

- id: wanted-by-timer-target
  desc: WantedBy=timers.target directive
  for: [systemd]
  crit: suspicious
  conf: 0.86
  if:
    type: value
    path: "install.wanted_by"
    exact: "timers.target"

- id: wanted-by-socket-target
  desc: WantedBy=sockets.target directive
  for: [systemd]
  crit: suspicious
  conf: 0.86
  if:
    type: value
    path: "install.wanted_by"
    exact: "sockets.target"

- id: wanted-by-path-target
  desc: WantedBy=paths.target directive
  for: [systemd]
  crit: suspicious
  conf: 0.86
  if:
    type: value
    path: "install.wanted_by"
    exact: "paths.target"

- id: systemd-dropin-path--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.84
  unless:
  - type: path
    regex: '/tests/'
  if:
    type: text
    regex: '/etc/systemd/(system|user)/[^/\s]{1,80}\.(service|timer)\.d/'

  count_max: 1029750
- id: systemd-dropin-path--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.84
  unless:
  - type: path
    regex: '/tests/'
  if:
    type: text
    regex: '/etc/systemd/(system|user)/[^/\s]{1,80}\.(socket|path)\.d/'

  count_max: 1029751
- id: systemctl-enable-nonservice-unit
  desc: systemctl enables timer path or socket unit
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\bsystemctl\s+(--user\s+)?enable\s+[^\n;]{1,120}\.(timer|socket|path)\b'
  unless:
  - id: well-known/app/infrastructure/pvetui::pvetui-workflow-test-script
  downgrade:
    any:
    - id: well-known/tool/sysadmin/kubernetes

# A bare path to a .timer/.path/.socket unit is a location, not intent — every
# distro package that ships a systemd unit references one. Notable (like
# systemd-user-service-directory-path / etc-systemd-path), not suspicious: the persistence
# intent comes from the trigger composites below (systemd-timer-trigger,
# systemd-path-trigger, systemd-socket-trigger) that require the actual
# OnCalendar/PathChanged/ListenStream directive.
- id: systemd-timer-unit-path
  desc: Systemd timer unit path
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '/(etc|usr/lib|lib)/systemd/(system|user)/[^\s]{1,120}\.timer\b'

- id: systemd-path-unit-path
  desc: Systemd path unit path
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '/(etc|usr/lib|lib)/systemd/(system|user)/[^\s]{1,120}\.path\b'

- id: systemd-socket-unit-path
  desc: Systemd socket unit path
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '/(etc|usr/lib|lib)/systemd/(system|user)/[^\s]{1,120}\.socket\b'
  downgrade:
    any:
    - id: well-known/tool/sysadmin/kubernetes

- id: timer-on-calendar
  desc: Systemd timer calendar trigger
  crit: suspicious
  conf: 0.86
  for: [systemd]
  if:
    type: value
    path: "timer.on_calendar"
    exists: true

- id: timer-on-boot
  desc: Systemd timer boot trigger
  crit: suspicious
  conf: 0.86
  for: [systemd]
  if:
    type: value
    path: "timer.on_boot_sec"
    exists: true

- id: timer-on-unit-active
  desc: Systemd recurring unit-active timer
  crit: suspicious
  conf: 0.84
  for: [systemd]
  if:
    type: value
    path: "timer.on_unit_active_sec"
    exists: true

- id: path-unit-trigger
  desc: Systemd path unit trigger
  crit: suspicious
  conf: 0.84
  for: [systemd]
  if:
    type: value
    path: "path.path_changed"
    exists: true

- id: path-unit-exists-trigger
  desc: Systemd path exists trigger
  crit: suspicious
  conf: 0.84
  for: [systemd]
  if:
    type: value
    path: "path.path_exists"
    exists: true

- id: socket-listen-stream
  desc: Systemd socket ListenStream trigger
  crit: suspicious
  conf: 0.84
  for: [systemd]
  if:
    type: value
    path: "socket.listen_stream"
    exists: true

- id: socket-listen-datagram
  desc: Systemd socket ListenDatagram trigger
  crit: suspicious
  conf: 0.84
  for: [systemd]
  if:
    type: value
    path: "socket.listen_datagram"
    exists: true

- id: exec-start-boot
  desc: ExecStart from /boot
  for: [systemd]
  crit: component
  if:
    type: value
    path: "service.exec_start"
    regex: "^/boot/"

- id: exec-start-var-transient
  desc: ExecStart from transient /var path
  for: [systemd]
  crit: component
  if:
    type: value
    path: "service.exec_start"
    regex: "^/var/(tmp|run)/"

- id: exec-start-tmp
  desc: ExecStart from /tmp
  for: [systemd]
  crit: component
  if:
    type: value
    path: "service.exec_start"
    regex: "^/tmp/"

- id: exec-start-dev
  desc: ExecStart from /dev
  for: [systemd]
  crit: component
  if:
    type: value
    path: "service.exec_start"
    regex: "^/dev/"

- id: timer-unit-field
  desc: Systemd timer Unit target
  crit: component
  for: [systemd]
  if:
    type: value
    path: "timer.unit"
    exists: true

- id: socket-service-field
  desc: Systemd socket Service target
  crit: component
  for: [systemd]
  if:
    type: value
    path: "socket.service"
    exists: true

# The sibling exec-start-* traits key on the *directory* a unit runs from, and
# read it with `type: value path: service.exec_start` -- which needs a parsed
# unit file. Two gaps follow. A dropper that writes its unit inline from a
# maintainer script or an installer (heredoc/printf into
# /etc/systemd/system/...) leaves no .service file to parse, so none of them
# apply; and a payload parked outside the watched directories -- /usr/lib,
# /usr/libexec -- matches none of the directory patterns even in a real unit
# file. A postinst dropping a `.cache.timer` + `.cache.service` pair with
# `ExecStart=/usr/lib/.cached` scored risk 2.
#
# This reads the same field as text, so it works in both carriers, and keys on
# concealment rather than location: a unit whose *executable* is a dotfile.
# Anchoring the dot on the LAST path component is what makes it safe -- dot
# DIRECTORIES are everywhere in legitimate units (.venv, .local, .cargo, .nvm).
# Measured over 108,671 text files under /usr/bin, /usr/share, /etc, /usr/lib,
# /usr/sbin and /opt: 440 contain an ExecStart, one of which runs from a dot
# directory (`/var/lib/vllm/.venv/bin/vllm`) and is correctly excluded; zero
# have a dot-prefixed executable.
- id: exec-start-hidden-executable
  desc: Systemd unit executes a hidden dotfile
  crit: suspicious
  conf: 0.93
  if:
    type: text
    # The terminator class accepts a backslash and quotes as well as whitespace:
    # a unit written from a script arrives as `printf "...ExecStart=/x/.y\n"`,
    # where the line break is a literal `\` + `n`, not real whitespace.
    regex: 'ExecStart=-?[^\s\n]{0,60}/\.[A-Za-z0-9_-]{1,40}([\s\\"'']|$)'

# The sibling exec-start-hidden-executable keys on the *executable* being a
# dotfile. A unit can also hide the payload in an argument: the executable is a
# stock interpreter (`java`, `node`, `python`) and what it runs is a hidden
# path or a file inside a hidden directory, e.g. `ExecStart=/usr/bin/java -jar
# /usr/lib/jvm/.cache/jre-runtime.dat` (Virtualizor BGP-hijack update, Aug
# 2026). Measured over 394 stock /usr/lib/systemd/system + /etc/systemd/system
# units: zero ExecStart lines carry a hidden path argument.
- id: exec-start-hidden-argument
  desc: Systemd ExecStart hidden dotfile argument
  # `php` widens the file defaults: droppers in that language embed the unit
  # body as a string literal, leaving no parsed .service file to scan (the
  # trojanized Virtualizor update injected exactly this shape into PHP core
  # files).
  for: [shell, python, php, systemd, go, rust, objc, c]
  crit: suspicious
  conf: 0.93
  if:
    type: text
    # First token is the interpreter/binary; a later argument contains a
    # `/.name` path component. Hidden directories mid-path (`.cache`) count
    # too -- that is where the payload above is staged.
    regex: 'ExecStart=-?\S+\s[^\n]{0,120}/\.[A-Za-z0-9][A-Za-z0-9_-]{0,40}'
  unless:
    # User-session and project dot-directories are ordinary (mirrors the
    # exclusions on exec-start-hidden-executable).
    - type: text
      regex: 'ExecStart=[^\r\n]{0,200}\.(local|config|venv|github)/'

- id: exec-start-userwritable-path
  desc: ExecStart from user writable path
  for: [systemd]
  crit: component
  conf: 0.7
  if:
    type: value
    path: "service.exec_start"
    regex: "^/(tmp|var/tmp|dev/shm|run/user)/"

- id: exec-start-unusual-root-path
  desc: ExecStart from unusual root path
  for: [systemd]
  crit: component
  conf: 0.7
  if:
    type: value
    path: "service.exec_start"
    regex: "^/(home|root|opt|etc)/"

# The %h/~/$HOME macro forms resolve to the same home-relative location that the
# absolute /home/<user>/ rule above already treats as unusual. A user unit whose
# binary lives in a home dot-dir (~/.local, ~/.cache, ~/.config) is the
# self-copy persistence shape used by dropped payloads (real system daemons run
# from /usr/sbin or /usr/lib). Completes coverage so the macro form is not a gap.
- id: exec-start-home-dotdir-path
  desc: ExecStart from home dot-directory
  for: [systemd]
  crit: component
  conf: 0.7
  if:
    type: value
    path: "service.exec_start"
    regex: '^(%h|~|\$\{?HOME\}?)/\.[a-z]{3,8}/'

- id: exec-stop-userwritable-path
  desc: ExecStop from user writable path
  for: [systemd]
  crit: component
  conf: 0.7
  if:
    type: value
    path: "service.exec_stop"
    regex: "^/(tmp|var/tmp|dev/shm|run/user)/"

- id: exec-stop-unusual-root-path
  desc: ExecStop from unusual root path
  for: [systemd]
  crit: component
  conf: 0.7
  if:
    type: value
    path: "service.exec_stop"
    regex: "^/(home|root|opt|etc)/"

- id: exec-stop-bin-sh
  # ExecStop=/bin/sh -c '...' one-liners are routine in stock distro units
  # (ebtables, nfs-server); shell-at-stop is execution surface, not intent.
  desc: Shell script execution at service stop
  for: [systemd]
  crit: notable
  conf: 0.8
  if:
    type: value
    path: "service.exec_stop"
    regex: "^/bin/sh"

- id: exec-stop-casaos-shell
  desc: ExecStop uses CasaOS packaged shell helper
  for: [systemd]
  crit: notable
  if:
    type: value
    path: "service.exec_stop"
    regex: "^/casaOS/server/shell/"

- id: comment-exists
  desc: Systemd unit comment exists
  crit: baseline
  for: [systemd-service]
  count_min: 2
  if:
    type: text
    regex: '^\s*#[ a-zA-Z0-9]{3,}'
  unless:
  - id: well-known/app/system/drivers/

- id: systemd-forking-no-deps
  desc: Forking service with no dependencies
  for: [systemd]
  crit: notable
  if:
    type: value
    path: "service.type"
    exact: "forking"

  conf: 0.85
  unless:
  - id: micro-behaviors/os/service/dependency::after-exists
  - id: micro-behaviors/os/service/dependency::before-exists
  - id: metadata/package/testing/harness/unit/
  - id: metadata/package/testing/
  - id: well-known/app/utility/kpango-dotfiles::kpango-dotfiles-source-path

- id: default-deps-no
  desc: Service DefaultDependencies=no
  for: [systemd]
  crit: notable
  if:
    type: value
    path: "service.default_dependencies"
    exact: "no"

composite_rules:
- id: exec-start-unexpected-path
  desc: ExecStart from unusual path
  crit: suspicious
  conf: 0.7
  any:
  - id: exec-start-userwritable-path
  - id: exec-start-unusual-root-path
  - id: exec-start-home-dotdir-path
  unless:
  - id: micro-behaviors/os/service/config::exec-start-expected-core
  not:
  - regex: "^/(bin|sbin|usr/bin|usr/sbin)/"
  - regex: "^/(etc/(rc|update)|lib/|usr/(bin|sbin))/"
  - regex: "^/(bin|run|sbin|nix|usr/lib)/"

- id: exec-stop-unexpected-path
  desc: ExecStop from unusual path
  crit: suspicious
  conf: 0.7
  any:
  - id: exec-stop-userwritable-path
  - id: exec-stop-unusual-root-path
  unless:
  - id: exec-stop-casaos-shell
  not:
  - regex: "^/(usr/bin|usr/sbin|bin|usr/lib)/"

# WantedBy= is the standard Install-section enrollment directive present in
# essentially every enabled unit (its own leaf atoms are notable). An OR over
# its text/kv variants is the same notable signal, not a suspicious escalation;
# the actionable suspicion is WantedBy plus a dangerous ExecStart / undocumented
# unit, which the composites below layer on.
- id: wanted-by-target
  desc: Systemd unit declares a WantedBy startup target
  crit: notable
  any:
  - id: wanted-by-target-text
  - id: micro-behaviors/os/service/config::wanted-by-multi-user-text
  - id: wanted-by-target-kv

- id: systemd-timer-trigger
  desc: Systemd timer persistence trigger
  crit: suspicious
  conf: 0.9
  any:
  - id: timer-on-calendar
  - id: timer-on-boot
  - id: timer-on-unit-active
  - id: wanted-by-timer-target

- id: systemd-path-trigger
  desc: Systemd path persistence trigger
  crit: suspicious
  conf: 0.88
  any:
  - id: path-unit-trigger
  - id: path-unit-exists-trigger
  - id: wanted-by-path-target

- id: systemd-socket-trigger
  desc: Systemd socket activation persistence
  crit: suspicious
  conf: 0.88
  any:
  - id: socket-listen-stream
  - id: socket-listen-datagram
  - id: wanted-by-socket-target

- id: systemd
  desc: Configures or controls a systemd unit
  crit: notable
  conf: 0.66
  mbc: B0028
  needs: 2
  # Standalone systemd unit files trivially satisfy multiple indicators
  # (that's their definition). The composite targets scripts/binaries
  # that deploy systemd persistence, not the unit-file artifacts themselves.
  # Lowered to notable because legitimate sysadmin scripts (postinst,
  # ansible plays, distro installers) routinely manage systemd services.
  for: [shell, python, elf, go, rust, objc]
  # systemd-keyword (bare word "systemd") is intentionally excluded: it is a
  # substring of every path indicator (e.g. /etc/systemd/system), so a single
  # benign path reference would satisfy needs:2 on its own. Persistence requires
  # an actual action/unit indicator, not a passing mention of the word.
  any:
  - id: micro-behaviors/os/service/control::systemctl-word
  - id: systemctl-enable
  - id: systemctl-enable-nonservice-unit
  - id: micro-behaviors/os/service/config::exec-start
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: wanted-by-target
  - id: systemd-timer-trigger
  - id: systemd-path-trigger
  - id: systemd-socket-trigger
  downgrade:
    any:
    - id: well-known/dual-use/remote-admin/rustdesk/
    - id: well-known/app/system/niri::source-tree
    - type: text
      substr: "docker.service"
  unless:
  - id: metadata/file/profile/identity::install-doc-basename
  - id: well-known/lib/native/systemd::systemd-shared-library
  - id: metadata/file/catalog/service::cloud-init-embedded-systemd-bootstrap-unit

- id: systemd-service-file
  desc: Embedded systemd persistence directives
  crit: notable
  conf: 0.9
  # Targets scripts/binaries that author/embed a .service file inline;
  # standalone .service unit files trivially match ExecStart + WantedBy
  # by definition and should not be flagged as their own persistence.
  for: [shell, python, elf, go, rust, objc]
  all:
  - id: micro-behaviors/os/service/config::exec-start
  any:
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: wanted-by-target
  downgrade:
    any:
    - id: well-known/dual-use/remote-admin/rustdesk/
    - id: micro-behaviors/os/service/config::exec-start-expected-core
  unless:
  - id: metadata/file/catalog/service::cloud-init-embedded-systemd-bootstrap-unit

- id: systemd-user-persistence
  desc: Configures a user-level systemd service
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/service/config::systemd-user-service-directory-path
  any:
  - id: micro-behaviors/os/service/control::systemctl-word
  - id: systemctl-enable
  - id: systemctl-enable-nonservice-unit
  - id: micro-behaviors/fs/path/extension::service-unit-filename-literal
  - id: micro-behaviors/os/service/config::exec-start
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: wanted-by-target
  unless:
  - id: well-known/app/communication/televault::televault-backup-context
  - id: well-known/app/communication/televault::schedule-module-doc

- id: python-user-service-download-launch
  desc: Python user service downloads and launches
  crit: hostile
  conf: 0.98
  for: [python]
  attack: T1105,T1543.002
  all:
  - id: micro-behaviors/os/service/config::python-user-systemd-unit
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
  - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/create/subprocess::subprocess-detached-session

- id: systemd-user-linger-hidden-respawn
  desc: Hidden user service persists with account lingering and automatic respawn
  crit: hostile
  conf: 0.97
  all:
  - id: systemd-user-persistence
  - id: micro-behaviors/os/service/control::loginctl-enable-linger
  - id: exec-start-hidden-executable
  - id: micro-behaviors/os/service/restart-policy::restart-always

# A system-level systemd unit whose ExecStart is a hidden dotfile binary, wired
# into boot with enable/WantedBy. No legitimate daemon normally needs a hidden
# executable path for a system service; combined with autostart this is a
# strong persistence signal.
- id: hidden-daemon-systemd-persistence
  desc: Hidden dotfile binary enabled as a systemd daemon
  crit: hostile
  conf: 0.96
  attack: T1543.002,T1036.004
  for: [shell, python, elf, go, rust, objc, c, cpp]
  all:
  - id: exec-start-hidden-executable
  any:
  - id: systemctl-enable
  - id: wanted-by-target

# Argument-form sibling of hidden-daemon-systemd-persistence: the executable
# is a stock interpreter, the hidden dotfile is what it executes. Wiring that
# into autostart (WantedBy/enable) or auto-respawn (Restart=always) is the
# persistence shape of supply-chain JVM stagers such as the trojanized
# Virtualizor update (java -jar /usr/lib/jvm/.cache/jre-runtime.dat).
- id: hidden-interpreter-payload-autostart
  desc: Systemd autostarts hidden interpreter payload
  crit: hostile
  conf: 0.96
  attack: T1543.002,T1036.004
  mbc: B0030
  for: [shell, python, php, systemd, go, rust, objc, c]
  all:
  - id: exec-start-hidden-argument
  any:
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: wanted-by-target
  - id: systemctl-enable

- id: systemd-user-auto-restart-process-control
  desc: User service auto-restart and process termination
  # Desktop installers and session managers commonly restart user services
  # after terminating stale instances. Preserve the capability for triage;
  # hidden paths, lingering, or payload delivery provide suspicious intent.
  crit: notable
  conf: 0.96
  for: [shell]
  all:
  - id: systemd-user-persistence
  - id: micro-behaviors/os/service/restart-policy::restart-always-text
  - id: wanted-by-target-text
  - id: micro-behaviors/process/terminate/command::pkill

- id: systemd-timer-persistence
  desc: Systemd timer-based persistence
  crit: notable
  conf: 0.9
  all:
  - id: systemd-timer-trigger
  any:
  - id: timer-unit-field
  - id: micro-behaviors/os/service/config::exec-start
  - id: systemd-timer-unit-path

- id: systemd-path-persistence
  desc: Systemd path-triggered persistence
  crit: suspicious
  conf: 0.88
  all:
  - id: systemd-path-trigger
  any:
  - id: micro-behaviors/os/service/config::exec-start
  - id: systemd-path-unit-path

- id: systemd-socket-persistence
  desc: Systemd socket-activated persistence
  crit: suspicious
  conf: 0.88
  all:
  - id: systemd-socket-trigger
  any:
  - id: socket-service-field
  - id: micro-behaviors/os/service/config::exec-start
  - id: systemd-socket-unit-path

- id: exec-start-dangerous-path
  desc: ExecStart from transient or device path
  crit: suspicious
  conf: 0.9
  any:
  - id: exec-start-boot
  - id: exec-start-var-transient
  - id: exec-start-tmp
  - id: exec-start-dev

- id: systemd-no-blank-lines
  desc: Systemd unit lacks blank line separators
  crit: notable
  conf: 0.85
  for: [systemd]
  all:
  - id: micro-behaviors/os/service/config::exec-start
  unless:
  - id: micro-behaviors/os/service/config::blank-line-separator
  - id: micro-behaviors/os/service/config::documentation-exists
  - id: micro-behaviors/os/service/config::unit-description-exists
