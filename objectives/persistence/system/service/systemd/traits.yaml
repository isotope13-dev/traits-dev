defaults:
  attack: T1543.002
  platforms:
  - linux
  for:
  - shell
  - python
  - systemd
  - go
  - rust
  - objc
  - c
  - cpp
traits:
- id: systemd-worker-service-path
  desc: Matches '/etc/systemd/'
  crit: suspicious
  conf: 0.94
  for:
  - elf
  - shell
  - python
  if:
    type: text
    substr: /lib/systemd/system/systemd-worker.service
- id: wanted-by-timer-target
  desc: WantedBy=timers.target directive
  for:
  - systemd
  crit: notable
  conf: 0.86
  if:
    type: value
    path: install.wanted_by
    exact: timers.target
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: wanted-by-socket-target
  desc: WantedBy=sockets.target directive
  for:
  - systemd
  crit: notable
  conf: 0.86
  if:
    type: value
    path: install.wanted_by
    exact: sockets.target
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: wanted-by-path-target
  desc: WantedBy=paths.target directive
  for:
  - systemd
  crit: notable
  conf: 0.86
  if:
    type: value
    path: install.wanted_by
    exact: paths.target
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: systemctl-enable-nonservice-unit
  desc: systemctl enables timer path or socket unit
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \bsystemctl\s+(--user\s+)?enable\s+[^\n;]{1,120}\.(timer|socket|path)\b
  unless:
  - id: well-known/app/infrastructure/pvetui::pvetui-workflow-test-script
  downgrade:
    any:
    - id: well-known/tool/sysadmin/kubernetes
- id: timer-on-calendar
  desc: Systemd timer calendar trigger
  crit: notable
  conf: 0.86
  for:
  - systemd
  if:
    type: value
    path: timer.on_calendar
    exists: true
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: timer-on-boot
  desc: Systemd timer boot trigger
  crit: notable
  conf: 0.86
  for:
  - systemd
  if:
    type: value
    path: timer.on_boot_sec
    exists: true
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: timer-on-unit-active
  desc: Systemd recurring unit-active timer
  crit: notable
  conf: 0.84
  for:
  - systemd
  if:
    type: value
    path: timer.on_unit_active_sec
    exists: true
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: path-unit-trigger
  desc: Systemd path unit trigger
  crit: notable
  conf: 0.84
  for:
  - systemd
  if:
    type: value
    path: path.path_changed
    exists: true
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: path-unit-exists-trigger
  desc: Systemd path exists trigger
  crit: notable
  conf: 0.84
  for:
  - systemd
  if:
    type: value
    path: path.path_exists
    exists: true
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: socket-listen-stream
  desc: Systemd socket ListenStream trigger
  crit: notable
  conf: 0.84
  for:
  - systemd
  if:
    type: value
    path: socket.listen_stream
    exists: true
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: socket-listen-datagram
  desc: Systemd socket ListenDatagram trigger
  crit: notable
  conf: 0.84
  for:
  - systemd
  if:
    type: value
    path: socket.listen_datagram
    exists: true
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: exec-start-boot
  desc: ExecStart from /boot
  for:
  - systemd
  crit: notable
  if:
    type: value
    path: service.exec_start
    regex: ^/boot/
- id: timer-unit-field
  desc: Systemd timer Unit target
  crit: notable
  for:
  - systemd
  if:
    type: value
    path: timer.unit
    exists: true
- id: socket-service-field
  desc: Systemd socket Service target
  crit: notable
  for:
  - systemd
  if:
    type: value
    path: socket.service
    exists: true
- id: exec-start-hidden-executable
  desc: Systemd unit executes a hidden dotfile
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: ExecStart=-?[^\s\n]{0,60}/\.[A-Za-z0-9_-]{1,40}([\s\\"']|$)
- id: exec-start-hidden-argument
  desc: Systemd interpreter argument names a hidden file
  for:
  - shell
  - python
  - php
  - systemd
  - go
  - rust
  - objc
  - c
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: 'ExecStart=-?\S*/(java|python3?|node|php|perl|ruby|ba?sh)\b[^\n]{1,80}/\.[\w.-]+(\s|$)'
  unless:
  - type: text
    regex: ExecStart=[^\r\n]{0,200}\.(local|config|venv|github)/
  - type: text
    regex: ExecStart=[^\r\n]{0,200}\.(rbenv|rvm)/
  - type: text
    regex: ExecStart=[^\r\n]{0,200}\.ruby-version\b
  - type: text
    substr: node_modules/.bin/
  - id: metadata/package/tooling::proxmoxve-community-scripts
  - id: metadata/package/tooling::boxcutter-source-tree
  - id: well-known/tool/offensive/pwn/
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
- id: exec-start-home-dotdir-path
  desc: ExecStart from home dot-directory
  for:
  - systemd
  crit: component
  conf: 0.7
  if:
    type: value
    path: service.exec_start
    regex: ^(%h|~|\$\{?HOME\}?)/\.[a-z]{3,8}/
  unless:
  - type: value
    path: service.exec_start
    regex: ^(%h|~|\$\{?HOME\}?)/\.local/bin/
  - type: value
    path: service.exec_start
    regex: ^(%h|~|\$\{?HOME\}?)/\.cargo/bin/
  - type: value
    path: service.exec_start
    regex: ^(%h|~|\$\{?HOME\}?)/\.local/share/
  - type: value
    path: service.exec_start
    regex: ^(%h|~|\$\{?HOME\}?)/\.bun/bin/
  - type: value
    path: service.exec_start
    regex: ^(%h|~|\$\{?HOME\}?)/\.claude/
- id: exec-stop-userwritable-path
  desc: ExecStop from user writable path
  for:
  - systemd
  crit: notable
  conf: 0.7
  if:
    type: value
    path: service.exec_stop
    regex: ^/(tmp|var/tmp|dev/shm|run/user)/
- id: exec-stop-unusual-root-path
  desc: ExecStop from unusual root path
  for:
  - systemd
  crit: notable
  conf: 0.7
  if:
    type: value
    path: service.exec_stop
    regex: ^/(home|root|etc)/
- id: exec-stop-bin-sh
  desc: Shell script execution at service stop
  for:
  - systemd
  crit: notable
  conf: 0.8
  if:
    type: value
    path: service.exec_stop
    regex: ^/bin/sh
- id: exec-stop-casaos-shell
  desc: ExecStop uses CasaOS packaged shell helper
  for:
  - systemd
  crit: notable
  if:
    type: value
    path: service.exec_stop
    regex: ^/casaOS/server/shell/
- id: systemd-forking-no-deps
  desc: Forking service with no dependencies
  for:
  - systemd
  crit: notable
  if:
    type: value
    path: service.type
    exact: forking
  conf: 0.85
  unless:
  - id: micro-behaviors/os/service/dependency::after-exists
  - id: micro-behaviors/os/service/dependency::before-exists
  - id: metadata/package/testing/
  - id: well-known/app/utility/kpango-dotfiles::kpango-dotfiles-source-path
  - id: "metadata/file/naming::test-directory-component"
composite_rules:
- id: exec-start-unexpected-path
  desc: ExecStart from unusual path
  crit: suspicious
  conf: 0.7
  any:
  - id: micro-behaviors/os/service/configure::unit-exec-start-userwritable-path
  - id: micro-behaviors/os/service/unit-field::exec-start-home-root-etc-path
  - id: exec-start-home-dotdir-path
  unless:
  - id: micro-behaviors/os/service/configure::unit-exec-start-dangerous-path
  - id: metadata/file/policy/config/services::packaged-unit-template-path
  - id: "metadata/file/policy/config/services::unit-exec-start-system-path"
  - id: home-app-working-directory-unit
  - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
  not:
  - regex: ^/(bin|sbin|usr/bin|usr/sbin)/
  - regex: ^/(etc/(rc|update[a-z0-9._-]*|kubernetes|kubeedge)|lib/|usr/(bin|sbin))/
  - regex: ^/(bin|run|sbin|nix|usr/lib)/
- id: home-app-working-directory-unit
  desc: Home app with declared working directory
  crit: exception
  conf: 0.9
  for:
  - systemd
  all:
  - id: micro-behaviors/os/service/unit-field::working-directory-home
  any:
  - id: micro-behaviors/os/service/unit-field::exec-start-home-app
  - id: micro-behaviors/os/service/unit-field::exec-start-home-version-manager
- id: exec-stop-unexpected-path
  desc: ExecStop from unusual path
  crit: suspicious
  conf: 0.7
  any:
  - id: exec-stop-userwritable-path
  - id: exec-stop-unusual-root-path
  unless:
  - id: exec-stop-casaos-shell
  - id: home-app-working-directory-unit
  not:
  - regex: ^/(usr/bin|usr/sbin|bin|usr/lib)/
- id: systemd-timer-trigger
  desc: Systemd timer persistence trigger
  crit: notable
  conf: 0.9
  any:
  - id: timer-on-calendar
  - id: timer-on-boot
  - id: timer-on-unit-active
  - id: wanted-by-timer-target
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: systemd-path-trigger
  desc: Systemd path persistence trigger
  crit: notable
  conf: 0.88
  any:
  - id: path-unit-trigger
  - id: path-unit-exists-trigger
  - id: wanted-by-path-target
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: systemd-socket-trigger
  desc: Systemd socket activation persistence
  crit: notable
  conf: 0.88
  any:
  - id: socket-listen-stream
  - id: socket-listen-datagram
  - id: wanted-by-socket-target
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: python-user-service-download-launch
  desc: Python user service downloads and launches
  crit: hostile
  conf: 0.98
  for:
  - python
  attack: T1105,T1543.002
  all:
  - id: micro-behaviors/os/service/config::python-user-systemd-unit
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
  - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
- id: systemd-user-linger-hidden-respawn
  desc: Hidden user service persists with account lingering and automatic respawn
  crit: hostile
  conf: 0.97
  for:
  - shell
  - python
  - go
  - rust
  - objc
  - c
  - cpp
  all:
  - id: micro-behaviors/os/service/config::systemd-user-unit
  - id: micro-behaviors/os/service/configure::loginctl-enable-linger
  - id: exec-start-hidden-executable
  - id: micro-behaviors/os/service/restart-policy::restart-always-text
- id: hidden-daemon-systemd-persistence
  desc: Hidden dotfile binary enabled as a systemd daemon
  crit: hostile
  conf: 0.96
  attack: T1543.002,T1036.004
  for:
  - shell
  - python
  - rust
  - c
  - go
  - objectivec
  all:
  - id: exec-start-hidden-executable
  any:
  - id: micro-behaviors/os/service/control::systemctl-enable-command
  - id: micro-behaviors/os/service/unit-field::wanted-by-target
- id: hidden-interpreter-payload-autostart
  desc: Systemd autostarts hidden interpreter payload
  crit: hostile
  conf: 0.96
  attack: T1543.002,T1036.004
  mbc: B0030
  for:
  - shell
  - python
  - php
  - systemd
  - go
  - rust
  - objc
  - c
  all:
  - id: exec-start-hidden-argument
  any:
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: micro-behaviors/os/service/unit-field::wanted-by-target
  - id: micro-behaviors/os/service/control::systemctl-enable-command
  unless:
  - id: metadata/package/tooling::proxmoxve-community-scripts
- id: systemd-user-auto-restart-process-control
  desc: User service auto-restart and process termination
  crit: notable
  conf: 0.96
  for:
  - shell
  all:
  - id: micro-behaviors/os/service/config::systemd-user-unit
  - id: micro-behaviors/os/service/restart-policy::restart-always-text
  - id: micro-behaviors/os/service/unit-field::wanted-by-target-text
  - id: micro-behaviors/process/terminate/command::pkill
- id: systemd-timer-persistence
  desc: Systemd timer-based persistence
  crit: notable
  conf: 0.9
  all:
  - id: systemd-timer-trigger
  any:
  - id: timer-unit-field
  - id: micro-behaviors/os/service/unit-field::exec-start
  - id: micro-behaviors/fs/path/config/system::systemd-timer-unit-path
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: systemd-path-persistence
  desc: Systemd path-triggered persistence
  crit: notable
  conf: 0.88
  all:
  - id: systemd-path-trigger
  any:
  - id: micro-behaviors/os/service/unit-field::exec-start
  - id: micro-behaviors/fs/path/config/system::systemd-path-unit-path
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: systemd-socket-persistence
  desc: Systemd socket-activated persistence
  crit: notable
  conf: 0.88
  all:
  - id: systemd-socket-trigger
  any:
  - id: socket-service-field
  - id: micro-behaviors/os/service/unit-field::exec-start
  - id: micro-behaviors/fs/path/config/system::systemd-socket-unit-path
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: systemd-suspicious-service-file
  desc: Minimal or unusual systemd service structure
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/os/service/configure::unit-exec-start-dangerous-path
  - id: systemd-forking-no-deps
- id: hidden-temp-systemd-persistence
  desc: Hidden temp payload systemd persistence
  crit: hostile
  conf: 0.98
  for:
  - elf
  - shell
  all:
  - id: systemd-worker-service-path
  - id: micro-behaviors/os/service/control::systemctl-word
  any:
  - id: micro-behaviors/fs/path/temp::tmp-hidden-file
  - id: objectives/evasion/file-hiding/dotfile-create::hidden-staging-file
  - id: micro-behaviors/fs/chmod/executable/mode
  needs: 2
- id: systemd-dropin-path
  desc: Systemd service drop-in path
  crit: notable
  conf: 0.84
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: well-known/app/network/openssh/
  - id: well-known/app/system/omarchy::source-tree
  any:
  - id: micro-behaviors/os/service/config::systemd-service-timer-dropin-path
  - id: micro-behaviors/os/service/config::systemd-socket-path-dropin-path
- id: native-arm-systemd-respawn-implant
  desc: Native ARM implant authors a self-respawning systemd unit
  crit: hostile
  conf: 0.99
  mbc: B0030
  for:
  - elf
  all:
  - id: micro-behaviors/os/service/unit-field::native-unit-template
  - id: metadata/arch/iot::arm
  - id: micro-behaviors/fs/proc/exe::process-self-exe-path
  - id: micro-behaviors/os/service/restart-policy::restart-always-text
- id: native-arm-systemd-shell-staging-implant
  desc: Native ARM implant combines systemd persistence with shell staging
  crit: hostile
  conf: 0.99
  attack: T1543.002,T1059.004,T1074.001
  mbc: B0030
  for:
  - elf
  all:
  - id: micro-behaviors/os/service/unit-field::native-unit-template
  - id: metadata/arch/iot::arm
  - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
  any:
  - id: micro-behaviors/fs/path/temp::native-transient-staging-directory
  - id: micro-behaviors/fs/path/temp::android-local-tmp-path
- id: native-mips-shell-persistence
  desc: Self-locating MIPS shell implant with systemd persistence
