- id: native-unit-authoring
  # A compiled binary that embeds the directives of a systemd unit as plain
  # strings (ExecStart plus an autostart/auto-respawn directive) is writing a
  # unit file at runtime to persist itself — notable persistence program
  # purpose. The structured `.service` composites above cover parsed unit files;
  # this targets the binary that authors one.
  desc: Native binary authors a systemd persistence unit
  crit: notable
  conf: 0.8
  for: [elf]
  all:
  - id: micro-behaviors/os/service/config::exec-start
  any:
  - id: micro-behaviors/os/service/restart-policy::restart-always-text
  - id: wanted-by-target-text
