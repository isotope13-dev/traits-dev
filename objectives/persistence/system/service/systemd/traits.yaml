  for:
  - elf
  all:
  - id: micro-behaviors/os/service/unit-field::native-unit-template
  - id: micro-behaviors/fs/proc/exe::process-self-exe-path
  - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
  - id: metadata/arch/iot::mips
- id: native-arm-source-query-persistence
  desc: Native ARM bot persists with encoded Source-query flooding
  crit: hostile
  conf: 0.99
  attack: T1543.002,T1498.001,T1059.004
  mbc: B0030
  for:
  - elf
  all:
  - id: micro-behaviors/os/service/unit-field::native-unit-template
  - id: objectives/impact/dos/attack/botnet::xor29-source-engine-query-payload
  - id: metadata/arch/iot::arm
  - id: micro-behaviors/fs/proc/exe::process-self-exe-path
- id: native-systemd-persistent-stealer
