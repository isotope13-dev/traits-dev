defaults:
  platforms: [linux]
  for: [elf]
  attack: T1543.002
  mbc: F0012

composite_rules:
  - id: encrypted-native-systemd-self-persistence
    desc: Encrypted ELF installs itself through a generated systemd unit
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::compact-opaque-sigma-rodata-profile
      - id: micro-behaviors/os/service/unit-field::exec-start-text
      - id: micro-behaviors/fs/link::readlink
      - id: micro-behaviors/fs/attributes/xattr::setxattr-func
      - id: micro-behaviors/fs/attributes/xattr::xattr-get-getxattr
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol
