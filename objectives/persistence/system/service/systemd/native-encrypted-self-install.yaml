defaults:
  platforms: [linux]
  for: [elf]
  attack: T1543.002
  mbc: F0012

composite_rules:
  - id: encrypted-native-systemd-self-persistence
    desc: Encrypted ELF installs itself through a generated systemd unit
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::native-chacha-runtime-string-table
      - id: micro-behaviors/os/service/config::exec-start-text
      - id: micro-behaviors/fs/link/symlink::readlink
      - id: micro-behaviors/fs/attributes/xattr::setxattr-func
      - id: micro-behaviors/fs/attributes/xattr::xattr-get-getxattr
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/fs/chmod/modify::syscall-chmod
