defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: cron-concealing-implant-systemd-unit
    desc: Cron-concealing implant embeds systemd relaunch unit and path
    crit: hostile
    conf: 0.98
    attack: T1543.002
    all:
      - id: objectives/evasion/hijack-execution-flow/wrapper::crontab-concealment-and-removal-resistance
      - id: micro-behaviors/os/service/unit-field::native-unit-template
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
