# A "guard": a oneshot unit whose ExecStart is `systemctl start <other>`,
# fired by a timer every few minutes. Restart=always already survives
# crashes; the guard exists to undo an administrator's `systemctl stop`.
defaults:
  platforms: [linux]
  for: [shell, go, python]
  attack: T1543.002
composite_rules:
  - id: systemd-guard-timer-revives-service
    desc: Timer-driven unit re-starts another service
    crit: suspicious
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/os/service/config::unit-execstart-starts-other-unit
      - id: micro-behaviors/os/service/config::on-unit-active-timer-text
    any:
      - id: micro-behaviors/os/service/restart/policy::restart-always-text
      - id: micro-behaviors/os/service/configure::systemctl-enable-trigger-unit
