# One script installing the same implant three independent ways -- an
# always-restarting systemd unit, a root shell-rc relaunch watchdog, and a
# root SSH key -- so removing any one leaves the operator's access intact.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1543.002,T1546.004,T1098.004
composite_rules:
  - id: multi-vector-root-persistence-installer
    desc: Installs systemd, rc and SSH-key persistence
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/config::embedded-systemd-unit
      - id: micro-behaviors/os/service/restart/policy::restart-always-text
      - id: objectives/persistence/login/shell/profile::root-rc-relaunch-watchdog
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-shell-write
