defaults:
  platforms: [linux]
  for: [go]
composite_rules:
  - id: encoded-systemd-restarting-unit
    desc: Concealed shell installs an always-restarting systemd unit
    crit: suspicious
    attack: T1543.002
    all:
      - id: micro-behaviors/os/service/config::encoded-systemd-unit-write
      - id: micro-behaviors/os/service/restart/policy::encoded-restart-always-policy
