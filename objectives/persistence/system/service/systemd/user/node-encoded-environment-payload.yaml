defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1027,T1543.002
composite_rules:
  - id: node-encoded-environment-user-service
    desc: Encoded environment and user service setup
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/os/env/read/current::process-env
      - id: micro-behaviors/data/decode/base64/call::buffer-from-base64-to-utf8
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: objectives/persistence/system/service/systemd/user::systemd-user-service-setup
      - id: micro-behaviors/os/service/restart/policy::embedded-restart-always-policy
      - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
