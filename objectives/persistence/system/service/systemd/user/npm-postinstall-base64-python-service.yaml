defaults:
  platforms: [linux]
  attack: T1195.002,T1543.002,T1059.006,T1140
  mbc: B0028

composite_rules:
- id: npm-postinstall-base64-python-user-service
  desc: npm postinstall installs a Base64 supplied Python user service
  crit: hostile
  conf: 0.99
  for: [zip, npm, tar, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/data/decode/base64/call::buffer-from-base64-to-utf8
  - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
  - id: objectives/persistence/system/service/systemd/user::systemd-user-service-setup
  - id: micro-behaviors/os/service/restart/policy::embedded-restart-always-policy
  - id: micro-behaviors/os/service/unit-field::embedded-exec-start-directive
