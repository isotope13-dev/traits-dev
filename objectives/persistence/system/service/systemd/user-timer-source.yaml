# Runtime installation of a frequent user-level timer that invokes curl. The
# unit path, schedule, and curl command are individually ordinary operations;
# their bounded conjunction with immediate enablement establishes persistence.
defaults:
  platforms: [linux]
  for: [scripts, source]
  attack: T1543.002,T1071.001
  mbc: B0028

traits:
  - id: source-systemd-curl-exec
    desc: Systemd unit executes curl
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'ExecStart=/usr/bin/curl\s+-fsSL\b'

  - id: source-frequent-calendar-timer
    desc: Systemd timer runs repeatedly within each hour
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'OnCalendar=\*:[0-9]{1,2}/[0-9]{1,2}\b'

  - id: source-frequent-calendar-value
    desc: Source stores a frequent calendar value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)onCalendar\s*:\s*["'']\*:[0-9]{1,2}/[0-9]{1,2}["'']'

  - id: source-persistent-timer-directive
    desc: Systemd timer survives missed activations
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Persistent=true

  - id: source-systemctl-string
    desc: Source names the systemctl executable
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      exact: systemctl

  - id: source-systemctl-user-flag
    desc: Source invokes systemctl in user scope
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bsystemctl\b.{0,80}--user\b'

  - id: source-systemctl-enable-action
    desc: Source invokes systemctl enable action
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bsystemctl\b.{0,100}\benable\b'

composite_rules:
  - id: python-systemd-cron-persistence
    desc: Python package installs systemd and cron persistence
    crit: hostile
    conf: 0.99
    for: [whl, python-sdist, python]
    scope: archive
    all:
      - id: objectives/persistence/system/service/systemd::systemd-user-persistence
      - id: micro-behaviors/os/autorun/scheduled::crontab-install-command
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: source-systemd-curl-exec
      - id: objectives/persistence/system/service/systemd::source-systemctl-enable-action

  - id: source-frequent-calendar-schedule
    desc: Source configures a frequent calendar schedule
    crit: notable
    conf: 0.94
    any:
      - id: source-frequent-calendar-timer
      - id: source-frequent-calendar-value

  - id: source-systemctl-user-enable
    desc: Source enables a user systemd unit
    crit: notable
    conf: 0.94
    near_lines: 8
    all:
      - id: source-systemctl-string
      - id: source-systemctl-user-flag
      - id: source-systemctl-enable-action

  - id: frequent-user-timer-curl-persistence
    desc: Installs a frequent persistent curl timer
    crit: hostile
    conf: 0.98
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/os/service/config::systemd-user-service-directory-path
      - id: source-systemd-curl-exec
      - id: source-frequent-calendar-schedule
      - id: source-persistent-timer-directive
      - id: source-systemctl-user-enable
