defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: rival-killer-systemd-persistence
    desc: Rival-process killer embeds systemd startup installation
    crit: hostile
    conf: 0.99
    attack: T1543.002
    all:
      - id: objectives/impact/degrade/rival-bot/competitor::native-blacklist-rival-killer
      - id: micro-behaviors/os/service/unit-field::native-unit-template
      - id: micro-behaviors/os/service/control::systemctl-enable-command
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
