# AgentHub installs a persistent daemon on all three desktop platforms.
# The objective requires its CLI identity and encrypted controller in addition
# to platform service-install markers; service mechanics remain neutral atoms.
defaults:
  platforms: [unix, windows]
  for: [package.json, javascript, npm]
  attack: T1543.003,T1543.004,T1547.001,T1071.001

traits:
  - id: agenthub-systemd-unit-template
    desc: AgentHub systemd service template
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: Description=AgentHub Agent

  - id: agenthub-systemd-restart-policy
    desc: AgentHub restarting systemd service
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      regex: 'Description=AgentHub Agent[\s\S]{0,400}Restart=on-failure'

  - id: agenthub-launchd-unit-template
    desc: AgentHub LaunchDaemon template
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: Library/LaunchDaemons

  - id: agenthub-windows-run-key-template
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: AgentHub Windows Run-key template
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: CurrentVersion\\Run

composite_rules:
  - id: agenthub-systemd-service-install
    desc: AgentHub systemd service installation
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: agenthub-systemd-unit-template
      - id: agenthub-systemd-restart-policy

  - id: agenthub-launchd-service-install
    desc: AgentHub LaunchDaemon installation
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: agenthub-launchd-unit-template
      - id: micro-behaviors/os/service/launchagent::source-runatload-key

  - id: agenthub-windows-run-key-install
    desc: AgentHub Windows Run-key persistence
    crit: notable
    conf: 0.99
    for: [javascript]
    all:
      - id: agenthub-windows-run-key-template
      # Generic script-host capability; the AgentHub-specific context comes
      # from the Run-key leg, not from the launcher reference.
      - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec

  - id: agenthub-cross-platform-persistent-controller
    desc: AgentHub persistent remote-control daemon
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/entrypoint::agenthub-cli-entrypoint
      - id: micro-behaviors/communications/http/websocket::wss-scheme
    any:
      - id: agenthub-systemd-service-install
      - id: agenthub-launchd-service-install
      - id: agenthub-windows-run-key-install
    needs: 1
