defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: kernel-worker-unit-cron-boot-persistence
    desc: Kernel-worker unit and cron boot templates
    crit: hostile
    conf: 0.97
    attack: T1543.002,T1053.003
    all:
      - id: objectives/evasion/masquerade/service::kernel-worker-unit-exec-template
      - id: micro-behaviors/os/service/unit-field::native-unit-template
      - id: micro-behaviors/os/autorun/cron::crontab-at-reboot
      - id: micro-behaviors/data/embedded/script::embedded-shell-shebang
