# Native ELF persistence through both a systemd unit template and a
# piped crontab install, disguised as a kernel worker thread. Either
# mechanism alone appears in legitimate installers; the cluster with a
# bracketed kworker process title is hostile.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1543.002,T1053.003,T1036.005
composite_rules:
  - id: elf-unit-crontab-kworker-persistence
    desc: Native ELF persists via systemd unit and crontab as a kworker thread
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/unit-field::native-unit-template
      - id: micro-behaviors/os/autorun/cron::shell-stdin-install
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
