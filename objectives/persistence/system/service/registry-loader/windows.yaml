# A service-backed loader can keep an encrypted payload or configuration in
# the registry and let the service host recover it at runtime.  The composite
# intentionally uses capability families instead of product, actor, or value
# names so it also covers native and future-language implementations.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, rust, go]
  attack: T1543.003,T1112,T1027
  mbc: B0011.003

composite_rules:
  - id: service-registration-capability
    desc: Windows service registration capability
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/service/config::powershell-binary-service-command
      - id: micro-behaviors/os/service/control::create-service
      - id: micro-behaviors/os/service/control::sc-create-command
      - id: micro-behaviors/os/service/control::sc-remote-create-command

  - id: encrypted-payload-capability
    desc: Encrypted payload capability
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/crypto/library/hybrid::rijndael-managed
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-aes-cbc
      - id: micro-behaviors/crypto/symmetric/aes/script::powershell-aes-gcm-decrypt
      - id: micro-behaviors/crypto/symmetric/aes/library::go-cbc-decrypter-string
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-decrypt-flow

  - id: encrypted-registry-service-loader
    desc: Service combines registry payload storage with encryption
    crit: suspicious
    conf: 0.95
    all:
      - id: service-registration-capability
      - id: encrypted-payload-capability
    any:
      - id: micro-behaviors/os/registry/write/property::powershell-registry-property-write
      - id: micro-behaviors/os/registry/access::registry-set-value-api
      - id: micro-behaviors/os/registry/manipulate::rust-winreg-write
    near_bytes: 2048
