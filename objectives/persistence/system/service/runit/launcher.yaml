# Inserting an executable remount into a service launcher crosses the mount's
# execution restriction. It is suspicious even when performed by an installer;
# neither a service path nor an ordinary runit edit alone establishes abuse.
defaults:
  platforms: [unix]
  for: [scripts, source, binaries]

composite_rules:
  - id: launcher-executable-remount-edit
    desc: Runit launcher edit inserts executable remount
    crit: suspicious
    conf: 0.96
    attack: T1543
    near_lines: 1
    all:
      - id: micro-behaviors/os/service/configure::sed-inplace-runit-launcher
      - id: micro-behaviors/fs/volume/mount::remount-executable-flag
