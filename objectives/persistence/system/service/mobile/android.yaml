defaults:
  platforms: [android]
  # Standalone decompiled AndroidManifest.xml leaves carry the same
  # permission and component declarations as APK/ZIP containers.
  for: [apk, zip, xml]

composite_rules:
  - id: android-adware-two-process-watchdog
    desc: Two-process watchdog preserves unlock-triggered adware
    crit: hostile
    conf: 0.99
    attack: T1624.001
    for: [apk, zip, dex]
    all:
      - id: micro-behaviors/os/service/daemon::android-two-process-daemon-client
      - id: objectives/impact/ui/manipulation/ad-fraud::android-unlock-triggered-interstitial-adware

  # Native IoT bots can be carried in an APK and kept alive through Android's
  # boot and persisted-job mechanisms. Require the credential-driven self-copy
  # runner in the same APK so ordinary native apps with a background service
  # remain persistence observations only.
  - id: android-persistent-iot-native-bot
    desc: Android app persists a credential-driven native bot
    crit: hostile
    conf: 0.99
    attack: T1110.001,T1570,T1624.001
    for: [android_apk, zip, elf, dex, xml]
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::iot-credential-self-copy-chmod-execute-bot
      - id: micro-behaviors/os/message/intent::android-boot-completed-reference
      - id: micro-behaviors/os/service/daemon::android-job-service
      - id: micro-behaviors/time/schedule/interval::android-persisted-job-schedule

  - id: android-shell-raw-ip-service-loader
    desc: Android shell installs and starts raw-IP APK service
    crit: hostile
    conf: 0.99
    attack: "T1105, T1543.003, T1059.004"
    platforms: [unix, android]
    for: [shell]
    near_lines: 20
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
      - id: micro-behaviors/os/package-manager/sideload::android-shell-package-install
      - id: micro-behaviors/os/package-manager/sideload::android-shell-enable-package
      - id: micro-behaviors/os/service/start::android-start-service-command
      - id: micro-behaviors/fs/delete/directory::shell-recursive-delete
  - id: android-device-admin-accessibility
    desc: Android device admin accessibility control
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
    any:
      - id: micro-behaviors/os/privilege/manifest::device-admin-policy-resource
      - id: micro-behaviors/os/privilege/manifest::device-admin-receiver-class
      - id: micro-behaviors/os/privilege/manifest::add-device-admin-action

  - id: android-accessibility-autostart-coercion
    desc: Android accessibility autostart coercion
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-request-layout
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-miui-accessibility-layout
      - id: micro-behaviors/os/privilege/check::android-oppo-battery-settings-layout

  - id: android-boot-jobservice-persistence
    desc: Android boot JobService persistence
    crit: suspicious
    conf: 0.94
    for: [apk, zip, xml, dex]
    all:
      - id: micro-behaviors/os/service/daemon::android-job-service
      - id: micro-behaviors/os/service/daemon::android-background-service-names
    any:
      - id: micro-behaviors/os/message/intent::android-boot-completed-reference
      - id: micro-behaviors/os/privilege/manifest::package-usage-stats

  - id: android-boot-foreground-battery-persistence
    desc: Android boot foreground battery persistence
    crit: suspicious
    conf: 0.96
    for: [apk, zip, xml, dex]
    all:
      - id: micro-behaviors/os/message/intent::android-boot-completed-reference
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
      - id: metadata/permission/management::android-ignore-battery-optimizations-permission-reference
    any:
      - id: micro-behaviors/time/schedule/interval::android-alarm-manager-reference
      - id: micro-behaviors/time/schedule/interval::android-scheduled-pending-intent
      - id: objectives/command-and-control/dropper/staged-loader::cleartext-traffic-enabled

  - id: android-tasker-boot-foreground-persistence
    for: [android_apk, xml]
    desc: Android Tasker boot foreground persistence
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: metadata/build/framework::tasker-exported-apk
      - id: metadata/permission/activation::android-boot-completed-permission-reference
      - id: metadata/permission/activation::android-foreground-service-permission-reference

  - id: android-fox-boot-heartbeat-persistence
    desc: Android Fox boot service heartbeat persistence
    crit: hostile
    conf: 0.95
    for: [apk, zip, xml, dex]
    all:
      - id: micro-behaviors/os/service/daemon::android-fox-component-names
      - id: micro-behaviors/os/service/daemon::android-fox-start-persistence
      - id: micro-behaviors/os/service/daemon::android-job-service
      - id: micro-behaviors/time/schedule/interval::android-scheduled-pending-intent

  # Permission-only install+boot composites need a packaged APK/ZIP; a
  # standalone decompiled manifest lacks the installer MIME / silent-install
  # evidence that would justify hostile on xml alone.
  - id: android-install-boot-foreground-loader
    desc: Android install boot foreground loader
    crit: hostile
    conf: 0.96
    attack: "T1631, T1624.001"
    for: [android_apk, xml, java, kotlin, tar]
    all:
      - id: metadata/permission/management::android-install-packages-permission-reference
      - id: metadata/permission/activation::android-boot-completed-permission-reference
      - id: metadata/permission/activation::android-foreground-service-permission-reference
      # Same reasoning as android-install-boot-loader below: the three `all:`
      # legs are permission declarations, and FOREGROUND_SERVICE is held by any
      # app with a persistent notification, so the third adds no evidence the
      # first two lacked. The `for: [apk, zip]` gate the note above relies on
      # does not hold at archive scope -- Telegram's source tarball matched on
      # its AndroidManifest.xml. Require the app to drive the installer.
      - id: micro-behaviors/os/package-manager/sideload::package-installer-driven
    unless:
      - id: well-known/tool/development/mobile/termux/

  # Both `all:` legs are manifest *permission declarations*, and a hostile
  # verdict cannot rest on two of those: an app that ships its own updates
  # holds REQUEST_INSTALL_PACKAGES, and one that restores notifications after a
  # reboot holds RECEIVE_BOOT_COMPLETED. Telegram for Android declares both, in
  # its release and debug manifests. The third leg requires the app to actually
  # drive the installer, which is the part a dropper cannot do without.
  - id: android-install-boot-loader
    desc: Android install boot loader
    crit: hostile
    conf: 0.95
    attack: "T1631, T1624.001"
    for: [android_apk, xml, java, kotlin, tar]
    all:
      - id: metadata/permission/management::android-install-packages-permission-reference
      - id: metadata/permission/activation::android-boot-completed-permission-reference
      - id: micro-behaviors/os/package-manager/sideload::package-installer-driven
    unless:
      - id: well-known/tool/development/mobile/termux/

  - id: android-install-boot-wakelock
    desc: Android install boot wakelock persistence
    crit: hostile
    conf: 0.96
    attack: "T1631, T1624.001"
    all:
      - id: metadata/permission/manifest::android-install-permission-boot-foreground
      - id: objectives/command-and-control/dropper/staged-loader::wake-lock-permission

  - id: android-fox-workmanager-persistence
    desc: Android Fox WorkManager persistence
    crit: hostile
    conf: 0.95
    for: [apk, zip, xml, dex]
    all:
      - id: micro-behaviors/os/service/daemon::android-fox-component-names
      - id: micro-behaviors/os/service/daemon::android-job-service
      - id: micro-behaviors/time/schedule/interval::android-scheduled-pending-intent

  - id: android-fox-icon-suppression
    desc: Fox persistence hides its launcher component
    crit: hostile
    conf: 0.95
    for: [apk, zip, xml, dex]
    all:
      - id: micro-behaviors/os/service/daemon::android-fox-component-names
      - id: objectives/evasion/process/hidden/launcher::android-set-component-enabled-setting-reference
      - id: micro-behaviors/os/service/daemon::android-job-service

  - id: android-source-battery-exemption-control
    for: [android_apk, java, kotlin, package.json, xml]
    desc: Android source battery exemption control
    crit: suspicious
    conf: 0.94
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    scope: archive
    all:
      - id: metadata/permission/management::android-ignore-battery-optimizations-permission-reference
      - id: micro-behaviors/os/privilege/check::android-battery-optimization-status
      - id: micro-behaviors/os/privilege/check::android-request-ignore-battery-action
    unless:
      - id: well-known/lib/ui/react-native-noti-sdk::archive-notification-context
      - id: well-known/lib/ui/react-native-noti-sdk/
      - id: well-known/tool/development/mobile/termux/
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-battery-context
      - id: well-known/app/media/spotiflyer::spotiflyer-source-package

  # An ADB-shell daemon can survive removal of its user-facing app, reinstall
  # the staged APK with all runtime permissions, and restore its Accessibility
  # binding directly through secure settings. The base mechanism is suspicious
  # because device-management and test tooling can hold comparable authority;
  # a remotely tasked self-enrolled Wireless ADB shell makes it an attack.
  - id: android-wireless-adb-self-restoring-app
    desc: Remote ADB reinstall with Accessibility setup
    crit: hostile
    conf: 0.999
    for: [java, kotlin, apk, zip, dex]
    attack: T1548,T1631,T1624.001
    all:
      - id: objectives/command-and-control/remote-command/control/adb::android-wireless-adb-c2-shell
      - id: micro-behaviors/os/package-manager/sideload::android-reinstall-accessibility-configuration
