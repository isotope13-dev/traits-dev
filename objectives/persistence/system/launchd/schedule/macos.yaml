# Timing keys: StartInterval, StartCalendarInterval, ThrottleInterval.
defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: throttle-interval
    desc: ThrottleInterval key (min time between spawns)
    crit: baseline
    conf: 0.5
    if:
      type: value
      path: ThrottleInterval
  - id: start-interval
    desc: StartInterval key (scheduled execution)
    crit: baseline
    conf: 0.8
    attack: T1053.003
    if:
      type: value
      path: StartInterval
  - id: start-calendar-interval
    desc: "StartCalendarInterval key"
    crit: baseline
    conf: 0.8
    attack: T1053.003
    if:
      type: value
      path: StartCalendarInterval
composite_rules:
  - id: launchd-scheduled-user-dotdir-python
    desc: Scheduled LaunchAgent runs Python from user dot directory
    crit: suspicious
    conf: 0.92
    attack: T1543.004,T1053.003
    all:
      - id: objectives/persistence/system/launchd/bootstrap::run-at-load
      - id: start-interval
    any:
      - id: objectives/persistence/system/launchd/interpreter::progargs-user-dotdir-python-script
      - id: objectives/persistence/system/launchd/interpreter::progargs-user-dotdir-python-arg
