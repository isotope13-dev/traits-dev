defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: progargs-app-bundle-binary
    desc: Launches an app-bundle executable
    crit: notable
    conf: 0.9
    if:
      type: value
      path: ProgramArguments[*]
      regex: '^((/bin/)?wait4path\s+\S+\s+&&\s+exec\s+)?/[^;&|`$]*\.app/Contents/MacOS/[\w. -]+$'
  # An inline launcher whose final statement execs a fixed absolute-path
  # binary (read a secret from a root-only env file, then `exec
  # /usr/local/bin/agent`): launchd still supervises the real program.
  - id: progargs-inline-exec-absolute-binary
    desc: Inline launcher execs a fixed binary
    crit: notable
    conf: 0.85
    if:
      type: value
      path: ProgramArguments[*]
      regex: ';\s*exec\s+/[\w./-]+\s*$'
  # `sh -c 'sysctl -w kern.maxfiles=…'` raises a kernel ceiling. The command
  # is one sysctl write, not an interpreter payload.
  - id: progargs-sysctl-kernel-write
    desc: Sets a kernel sysctl at launch
    crit: notable
    conf: 0.9
    if:
      type: value
      path: ProgramArguments[*]
      regex: '^sysctl\s+-w\s+kern\.\w+=\d+(\s+kern\.\w+=\d+){0,4}$'
  - id: launchd-plist-template-placeholder
    desc: Launchd plist label has template placeholder
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: '\{[A-Z][A-Z_]{2,20}\}'
  - id: progargs-remote-pipe-shell
    desc: Launchd runs remote pipe-to-shell command
    crit: suspicious
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    if:
      type: value
      path: ProgramArguments[*]
      regex: '(?i)\b(curl|wget)\b.{4,240}https?://.{4,240}\|\s*(/(usr/)?bin/)?((ba|z)?sh|osascript)\b'
composite_rules:
  - id: launchd-recurring-remote-pipe-shell
    desc: Launchd repeatedly fetches code into a shell
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    all:
      - id: progargs-remote-pipe-shell
    any:
      - id: micro-behaviors/os/service/plist::keep-alive
      - id: micro-behaviors/os/service/plist::start-interval
  - id: launchd-osascript-remote-pipe
    desc: LaunchAgent osascript runs a remote pipe stage
    crit: hostile
    conf: 0.99
    attack: T1059.002,T1105,T1543.004
    all:
      - id: micro-behaviors/os/service/configure::launchd-osascript-program
      - id: progargs-remote-pipe-shell
    any:
      - id: micro-behaviors/os/service/configure::launchd-run-at-load
      - id: micro-behaviors/os/service/plist::keep-alive
