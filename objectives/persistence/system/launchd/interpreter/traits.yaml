defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: abandon-process-group
    desc: AbandonProcessGroup key
    crit: notable
    conf: 0.76
    if:
      type: value
      path: AbandonProcessGroup
  - id: progargs-shell-interpreter
    desc: ProgramArguments shell interpreter
    crit: component
    conf: 0.82
    attack: T1059.004
    if:
      type: value
      path: ProgramArguments[0]
      regex: ^/(bin|usr/bin)/(ba)?sh$|^/bin/zsh$
  # A ProgramArguments entry that is a bare absolute path into an app bundle's
  # MacOS/ executables dir (no inline script body, no shell metacharacters):
  # `sh -c /Applications/Foo.app/Contents/MacOS/bar` is a launcher wrapper, not
  # inline-interpreter execution. Named (not inline) so it is collected at the
  # leaf plist and can downgrade the composite even when it rolls up to an
  # enclosing archive.
  - id: progargs-app-bundle-binary
    desc: Launches an app-bundle executable
    crit: notable
    conf: 0.9
    if:
      type: value
      path: ProgramArguments[*]
      regex: '^/[^;&|`$]*\.app/Contents/MacOS/[\w. -]+$'
  - id: progargs-python-interpreter
    desc: ProgramArguments Python interpreter
    crit: component
    conf: 0.78
    attack: T1059.006
    if:
      type: value
      path: ProgramArguments[0]
      regex: ^(/usr/bin|/usr/local/bin|/opt/homebrew/bin)/python[0-9.]*$
  - id: progargs-ruby-interpreter
    desc: ProgramArguments Ruby interpreter
    crit: component
    conf: 0.78
    attack: T1059.004
    if:
      type: value
      path: ProgramArguments[0]
      exact: /usr/bin/ruby
  - id: progargs-perl-interpreter
    desc: ProgramArguments Perl interpreter
    crit: component
    conf: 0.78
    attack: T1059.006
    if:
      type: value
      path: ProgramArguments[0]
      exact: /usr/bin/perl
  - id: progargs-osascript-interpreter
    desc: ProgramArguments osascript interpreter
    crit: component
    conf: 0.78
    attack: T1059.002
    if:
      type: value
      path: ProgramArguments[0]
      exact: /usr/bin/osascript
  - id: progargs-inline-flag
    desc: ProgramArguments inline execution flag
    crit: component
    conf: 0.82
    attack: T1059
    if:
      type: value
      path: ProgramArguments[*]
      regex: ^-(c|e)$
  - id: progargs-remote-pipe-shell
    desc: Launchd runs remote pipe-to-shell command
    crit: suspicious
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    if:
      type: value
      path: ProgramArguments[*]
      regex: '(?i)\b(curl|wget)\b.{4,240}https?://.{4,240}\|\s*(/(usr/)?bin/)?((ba|z)?sh|osascript)\b'
composite_rules:
  - id: progargs-script-interpreter
    desc: ProgramArguments script interpreter
    crit: component
    conf: 0.78
    attack: T1059
    any:
      - id: progargs-python-interpreter
      - id: progargs-ruby-interpreter
      - id: progargs-perl-interpreter
      - id: progargs-osascript-interpreter
  - id: launchd-inline-interpreter
    desc: Launchd inline interpreter execution
    crit: suspicious
    conf: 0.88
    attack: T1059,T1543.004
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
    all:
      - id: progargs-inline-flag
    any:
      - id: progargs-shell-interpreter
      - id: progargs-script-interpreter
    # `sh -c /Applications/Foo.app/Contents/MacOS/bar` is a launcher wrapper
    # around a bundled executable, not inline-interpreter execution (T1059).
    # Still worth noting (sh wrapper around a service), so downgrade to notable
    # rather than drop. Referenced by name so it resolves at the leaf plist.
    downgrade:
      any:
        - id: progargs-app-bundle-binary
        - id: well-known/app/utility/kpango-dotfiles::kpango-dotfiles-source-path
        - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: launchd-abandon-inline-interpreter
    desc: Launchd abandons inline interpreter
    crit: suspicious
    conf: 0.86
    attack: T1059,T1543.004
    all:
      - id: abandon-process-group
      - id: launchd-inline-interpreter
  - id: launchd-recurring-remote-pipe-shell
    desc: Launchd repeatedly fetches code into a shell
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    all:
      - id: progargs-remote-pipe-shell
    any:
      - id: objectives/persistence/system/launchd/core::keep-alive
      - id: objectives/persistence/system/launchd/core::start-interval
  - id: launchd-osascript-remote-pipe
    desc: LaunchAgent osascript runs a remote pipe stage
    crit: hostile
    conf: 0.99
    attack: T1059.002,T1105,T1543.004
    all:
      - id: progargs-osascript-interpreter
      - id: progargs-remote-pipe-shell
    any:
      - id: objectives/persistence/system/launchd/core::run-at-load
      - id: objectives/persistence/system/launchd/core::keep-alive
