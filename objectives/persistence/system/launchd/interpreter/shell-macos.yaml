defaults:
  platforms: [unix]
  for: [shell]
  attack: T1543.004

composite_rules:
  # Emitting a launchd plist and handing it to `launchctl load` is the
  # documented way to install a macOS background service, so every vendor
  # `.command`/`install.sh` does it (backup agents, VPN clients, MDM,
  # container and dev tooling, time-tracking agents). Treat the plain
  # install/enable pair as the persistence surface it is; reserve hostile
  # for an install that also hides where the payload lives or whose service
  # it claims to be.
  - id: shell-macos-launchd-service-install
    desc: Shell writes a launchd plist and loads it
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/service/config::shell-launchd-plist-write
      - id: micro-behaviors/os/service/control::shell-launchctl-load

  - id: shell-macos-covert-launchd-persistence
    desc: Shell installs launchd persistence for a hidden or misattributed program
    crit: hostile
    conf: 0.97
    all:
      - id: shell-macos-launchd-service-install
    any:
      - id: objectives/persistence/system/launchd/location::shell-launchd-program-temp-path
      - id: objectives/persistence/system/launchd/location::shell-launchd-program-shared-path
      - id: objectives/persistence/system/launchd/location::shell-launchd-program-hidden-path
      - id: objectives/persistence/system/launchd/masquerade::shell-launchd-apple-label
    needs: 1

  - id: shell-macos-obfuscated-launchagent-persistence
    desc: Obfuscated shell installs LaunchAgent persistence
    crit: hostile
    conf: 0.99
    attack: T1543.004,T1027,T1059.002
    mbc: B0032
    all:
      - id: micro-behaviors/os/service/config::shell-launchagent-plist-write
      - id: micro-behaviors/data/encode/payload::shell-base64-payload-literal
      - id: micro-behaviors/data/decode/base64::base64-d-cmd
    any:
      - id: micro-behaviors/process/create/script/osascript::osascript-exec
      - id: micro-behaviors/process/create/script/osascript::pipe-osascript

  - id: shell-launchagent-exit-trap-rearm
    desc: Shell exit trap pairs with LaunchAgent rearming
    crit: hostile
    conf: 0.98
    near_bytes: 400
    all:
      - id: micro-behaviors/process/exit/handler::shell-exit-trap
      - id: micro-behaviors/os/service/control::launchctl-enable-disable-command
      - id: micro-behaviors/os/service/control::launchctl-bootstrap-subcommand
      - id: micro-behaviors/os/service/control::launchctl-kickstart-command

  - id: shell-launchagent-recurring-remote-pipe
    desc: LaunchAgent repeatedly fetches code into a shell
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    near_bytes: 900
    all:
      - id: micro-behaviors/os/service/config::shell-launchagent-plist-write
      - id: micro-behaviors/os/service/config::shell-launchd-start-interval
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: shell-launchd-vm-aware-daemon-bundle
    desc: Shell installs launchd persistence for VM-aware daemon payload
    crit: hostile
    conf: 0.97
    platforms: [macos]
    for: [archives]
    scope: archive
    all:
      - id: micro-behaviors/os/service/control::launchctl-load-plist
      - id: objectives/anti-analysis/emulator-detect/hardware::qemu-string
    any:
      - id: objectives/anti-analysis/emulator-detect/hardware::vm-hardware
      - id: micro-behaviors/communications/socket/listen/
      - id: micro-behaviors/communications/socket/connect/
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
