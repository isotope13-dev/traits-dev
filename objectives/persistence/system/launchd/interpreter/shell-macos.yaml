defaults:
  platforms: [unix]
  for: [shell]
  attack: T1543.004

composite_rules:
  # Repeatedly fetching shell code at startup is a durable remote loader.
  # Require the plist write and activation in the same source file; a
  # command shown in a comment or an unused helper in a sibling cannot fire it.
  - id: node-launchagent-recurring-remote-pipe
    desc: Node installs recurring LaunchAgent beside download-to-shell command
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004,T1543.004
    platforms: [macos]
    for: [javascript]
    scope: file
    near_lines: 32
    all:
      - id: micro-behaviors/os/service/launchagent::source-launchagent-remote-shell-autorun
      - id: micro-behaviors/os/service/launchagent::source-startinterval-key
      - id: micro-behaviors/fs/write/file/full/call::write-file-sync
      - id: micro-behaviors/os/service/start::source-launchagent-load-via-node

  # Emitting a launchd plist and handing it to `launchctl load` is the
  # documented way to install a macOS background service, so every vendor
  # `.command`/`install.sh` does it (backup agents, VPN clients, MDM,
  # container and dev tooling, time-tracking agents). Treat the plain
  # install/enable pair as the persistence surface it is; reserve hostile
  # for an install that also hides where the payload lives or whose service
  # it claims to be.
  - id: shell-macos-covert-launchd-persistence
    desc: Shell installs launchd persistence for a hidden or misattributed program
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/launchagent::shell-macos-launchd-service-install
    any:
      - id: objectives/persistence/system/launchd/location::shell-launchd-program-temp-path
      - id: objectives/persistence/system/launchd/location::shell-launchd-program-shared-path
      - id: objectives/persistence/system/launchd/masquerade::shell-launchd-apple-label
    needs: 1

  - id: shell-macos-obfuscated-launchagent-persistence
    desc: Obfuscated shell installs LaunchAgent persistence
    crit: hostile
    conf: 0.99
    attack: T1543.004,T1027,T1059.002
    mbc: B0032
    all:
      - id: micro-behaviors/os/service/launchagent::shell-launchagent-plist-write
      - id: micro-behaviors/data/encode/payload::shell-encoded-payload-evidence
      - id: micro-behaviors/data/decode/command::base64-decode-command
    any:
      - id: micro-behaviors/process/deploy/interpreter-command::osascript-exec
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::pipe-osascript

  - id: shell-launchagent-exit-trap-rearm
    desc: Shell exit trap pairs with LaunchAgent rearming
    crit: hostile
    conf: 0.98
    near_bytes: 400
    all:
      - id: micro-behaviors/process/exit/handler::shell-exit-trap
      - id: micro-behaviors/os/service/configure::launchctl-enable-disable-command
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-subcommand
      - id: micro-behaviors/os/service/start::launchctl-kickstart-command

  - id: shell-launchagent-recurring-remote-pipe
    desc: LaunchAgent repeatedly fetches code into a shell
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    near_bytes: 900
    all:
      - id: micro-behaviors/os/service/launchagent::shell-launchagent-plist-write
      - id: micro-behaviors/os/service/launchagent::shell-launchd-start-interval
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text

  - id: shell-launchd-vm-aware-daemon-bundle
    desc: Shell installs launchd persistence for VM-aware daemon payload
    crit: hostile
    conf: 0.97
    platforms: [macos, windows, linux]
    for: [binaries, '!dex', scripts, '!jcl', dmg, pkg, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/service/start::launchctl-load-plist
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-string
    any:
      - id: micro-behaviors/os/virtualization/hypervisor::vm-hardware
      - id: micro-behaviors/communications/socket/listen/
      - id: micro-behaviors/communications/socket/create::java-serversocket-create
      - id: micro-behaviors/communications/socket/accept::accept-go
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/accept::accept64-sym
      - id: micro-behaviors/communications/socket/accept::accept-func
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/communications/socket/accept::accept-call-source
      - id: micro-behaviors/communications/socket/connect/
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
