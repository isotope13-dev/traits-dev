# A LaunchAgent write is the durable result; encoded content and osascript are
# supporting context. The matcher does not claim that an HTTP response is the
# staged payload.
defaults:
  platforms: [macos]
  for: [shell]
  attack: T1027,T1105,T1059.002,T1543.004
  mbc: B0032,B0024
composite_rules:
  - id: macos-encoded-launchagent-payload-stager
    desc: Encoded macOS LaunchAgent stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/service/launchagent::shell-launchagent-plist-write
      - id: micro-behaviors/process/create/script/osascript::osascript-exec
      - id: micro-behaviors/data/encode/payload::shell-base64-payload-literal
      - id: micro-behaviors/data/decode/base64::base64-decode-command
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
