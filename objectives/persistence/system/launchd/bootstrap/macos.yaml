# How the job starts and stays running: RunAtLoad, KeepAlive.
defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: run-at-load
    desc: RunAtLoad key (start service at load)
    crit: baseline
    conf: 0.8
    attack: T1543.004
    if:
      type: value
      path: RunAtLoad
  - id: keep-alive
    desc: "KeepAlive key"
    crit: notable
    conf: 0.8
    attack: T1543.004
    if:
      type: value
      path: KeepAlive
  - id: embedded-plist-runatload
    desc: Embedded RunAtLoad enabled value
    crit: notable
    conf: 0.8
    for:
      - javascript
      - macho
    if:
      type: text
      regex: '<key>RunAtLoad</key>\s*<true\s*/>'
  - id: embedded-plist-runatload-key
    desc: Embedded RunAtLoad plist key in native strings
    crit: notable
    conf: 0.8
    for:
      - c
      - macho
    if:
      type: text
      exact: '<key>RunAtLoad</key>'
  - id: embedded-plist-keepalive
    desc: Embedded KeepAlive plist key in source
    crit: notable
    conf: 0.8
    for:
      - javascript
      - macho
    if:
      type: text
      substr: <key>KeepAlive</key>
composite_rules:
  - id: persistent-public-pty-command-agent
    desc: LaunchAgent persists a remote command agent with a public PTY
    crit: hostile
    conf: 0.99
    for: [javascript]
    scope: file
    attack: "T1053.004,T1059.007,T1071.001"
    all:
      - id: objectives/persistence/system/launchd/interpreter::launchd-js-runatload-installer
      - id: objectives/command-and-control/backdoor/daemon::public-pty-command-agent
  - id: launchd-persistent-unusual
    desc: Persistent Launchd item (KeepAlive) launching from unusual location
    crit: component
    conf: 0.8
    all:
      - id: keep-alive
      - id: objectives/persistence/system/launchd/location::program-unusual-location
  - id: native-launchagent-persistence
    desc: Native macOS agent embeds and writes a persistent LaunchAgent plist
    crit: hostile
    conf: 0.98
    attack: T1543.004
    for: [macho]
    all:
      - id: objectives/persistence/system/launchd/location::launch-agents
      - id: objectives/persistence/system/launchd/submit::native-launchagent-plist-template
      - id: objectives/persistence/system/launchd/submit::native-launchagent-write-marker
      - id: micro-behaviors/communications/ip/literal::external-ipv4-port-macho
      - id: objectives/command-and-control/backdoor/dispatch/websocket::websocket-shell-stream-marker
    unless:
      - id: metadata/signed/platform::apple
      - id: well-known/app/
      - id: well-known/lib/
  - id: native-launchagent-c2-persistence
    desc: Unsigned native agent combines LaunchAgent persistence with external C2
    crit: hostile
    conf: 0.99
    attack: T1543.004,T1071.001,T1105
    for: [macho]
    all:
      - id: micro-behaviors/os/service/launchagent::launchagents-path
      - id: micro-behaviors/os/service/plist::plist-programarguments-key
      - id: embedded-plist-keepalive
      - id: objectives/persistence/system/launchd/submit::native-launchagent-write-marker
      - id: micro-behaviors/communications/ip/literal::external-ipv4-port-macho
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers
    unless:
      - id: metadata/signed/platform::apple
      - id: well-known/app/
      - id: well-known/tool/
