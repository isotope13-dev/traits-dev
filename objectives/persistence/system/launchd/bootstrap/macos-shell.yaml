defaults:
  platforms: [macos]
  for: [shell]
  attack: T1543.004,T1036.005

composite_rules:
  - id: shell-launchagent-bootstrap-masquerade
    desc: Bootstraps a masqueraded user LaunchAgent
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-command
      - id: objectives/evasion/masquerade/binary::launchagents-fake-apple
    near_lines: 3

  # A root launchd wrapper that polls /dev/console and repeatedly relays a
  # hidden Apple-named payload into the interactive user's GUI session. This
  # captures both launchctl-asuser and sudo-u spellings used by macOS stealers
  # without depending on a campaign filename or account name.
  - id: hidden-console-user-payload-watchdog
    desc: Hidden Apple-style payload relaunches in console-user session
    crit: hostile
    conf: 0.98
    attack: T1543.004,T1033,T1036.005
    near_bytes: 1200
    all:
      - id: micro-behaviors/os/service/user-session::console-user-session-exec
      - id: micro-behaviors/data/control-flow/loop::shell-infinite-loop
      - id: objectives/evasion/masquerade/binary::app-support-hidden-apple
