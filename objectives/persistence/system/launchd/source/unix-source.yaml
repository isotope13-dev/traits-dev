defaults:
  platforms: [unix]
  for: [go, kotlin, php, ruby, rust, javascript, python]
  attack: T1543.004

traits:
  - id: source-launchagent-node-marker
    desc: LaunchAgent Node executable marker
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)ProgramArguments[\s\S]{0,100}process\.execPath'
  - id: source-launchagent-load-via-node
    desc: Node.js loads a LaunchAgent with launchctl
    crit: notable
    conf: 0.97
    platforms: [macos]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)(execFileSync|spawnSync|execFile)\s*\(\s*["'']launchctl["''][\s\S]{0,160}["'']load["'']'

composite_rules:
  - id: macos-launchagent-install-surface
    desc: Writes or registers a user LaunchAgent
    crit: notable
    conf: 0.92
    platforms: [macos]
    all:
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
    any:
      - id: micro-behaviors/os/service/control::launchctl-bootstrap-subcommand
      - id: micro-behaviors/os/service/control::launchctl-bootstrap-gui
      - id: micro-behaviors/os/service/control::python-launchctl-argv
      - id: micro-behaviors/os/service/config::shell-launchagent-plist-write
      - id: micro-behaviors/os/service/config::shell-launchd-plist-write
      - id: micro-behaviors/os/service/launchagent::plistbuddy-start-interval-edit
      - id: micro-behaviors/fs/write/file/direct::python-pathlib-write-text

  - id: macos-launchagent-recurring-config
    desc: Configures a user LaunchAgent to start or remain running
    crit: notable
    conf: 0.92
    platforms: [macos]
    all:
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
    any:
      - id: micro-behaviors/os/service/config::launchagent-run-at-load
      - id: micro-behaviors/os/service/launchagent::launchagent-keepalive-key
      - id: objectives/persistence/system/launchd/core::start-interval
      - id: objectives/persistence/system/launchd/core::keep-alive

  - id: source-launchd-user-persistence
    desc: Source loads user LaunchAgent
    # User LaunchAgents are a persistence mechanism but are also routinely
    # installed by legitimate desktop applications and daemon managers.
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/control::launchctl-load-command
    any:
      - id: micro-behaviors/os/service/config::source-launchagents-join
      - id: micro-behaviors/os/service/config::source-launchagents-plist
    needs: 1
    unless:
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: well-known/tool/sysadmin/alpine-packages::alpine-homebrew-package
      - id: well-known/lib/runtime/crate-package/
      - id: well-known/lib/runtime/running-process::runpm-launchd-backend
      - id: well-known/app/storage/spacedrive/
      - id: well-known/app/ai/pixcode::benign-runtime-context
      - id: well-known/app/ai/pixcode::benign-archive-context
      - id: well-known/app/ai/pixcode::daemon-manager-source
      - id: well-known/app/ai/pixcode::archive-member-context
  - id: launchd-agent-persistence-with-claude-config
    desc: LaunchAgent persistence paired with Claude Code configuration writes
    # This combination is security-relevant but has a documented legitimate
    # use in AI proxy software that installs a user service and points the
    # client at its local endpoint. Keep it suspicious outside a recognized
    # package context rather than treating the capability combination as an
    # attack with no legitimate use.
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/service/control::launchctl-load-command
      - id: micro-behaviors/os/service/config::source-launchagents-join
      - id: micro-behaviors/os/service/config::source-runatload-key
      - id: micro-behaviors/fs/path/application/config::claude-config-directory
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync-call
    unless:
      - id: well-known/app/ai/neurolink::benign-archive-context
      - id: well-known/app/ai/neurolink::proxy-launchd-context
      - id: well-known/app/ai/agentgem::benign-archive-context
      - id: well-known/app/ai/agentgem::warm-service-label
  - id: source-launchagent-node-program
    desc: LaunchAgent plist starts a Node.js program
    # A user LaunchAgent that starts Node is a persistence capability, not
    # attacker intent by itself. Keep the generic observation notable; the
    # network-backdoor composite below supplies the hostile context.
    crit: notable
    conf: 0.96
    platforms: [macos]
    for: [javascript, typescript]
    near_lines: 30
    all:
      - id: micro-behaviors/os/service/config::source-launchagents-join
      - id: micro-behaviors/os/service/plist::plist-programarguments-key
      - id: source-launchagent-node-marker
  - id: launchagent-node-network-backdoor
    desc: Node.js network backdoor persists as a macOS LaunchAgent
    crit: hostile
    conf: 0.99
    attack: T1543.004,T1059.007,T1071.001
    platforms: [macos]
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: micro-behaviors/os/service/config::source-launchagents-join
      - id: source-launchagent-node-program
      - id: source-launchagent-load-via-node
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: source-ssh-backdoor-launchd-persistence
    desc: SSH backdoor paired with launchd enablement
    crit: hostile
    conf: 0.99
    attack: "T1098.004,T1543.004"
    all:
      - id: objectives/persistence/login/ssh/backdoor::js-authorized-key-literal-backdoor
      - id: micro-behaviors/os/service/control::launchctl-load-command
      - id: objectives/persistence/system/surface/paths::remote-login-enabled
  - id: disguised-recurring-launchd-persistence
    desc: Disguised recurring LaunchAgent persistence
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/control::launchctl-load-command
      - id: micro-behaviors/os/service/config::source-launchagents-join
      - id: micro-behaviors/os/service/config::source-runatload-key
      - id: micro-behaviors/os/service/config::source-startinterval-key
      - id: objectives/evasion/masquerade/binary::apple-helper-name
