defaults:
  platforms: [unix]
  for: [go, kotlin, php, ruby, rust, javascript, python]
  attack: T1543.004

traits:
  - id: source-launchagent-node-marker
    desc: LaunchAgent Node executable marker
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)ProgramArguments[\s\S]{0,100}process\.execPath'
  - id: source-launchagent-load-via-node
    desc: Node.js loads a LaunchAgent with launchctl
    crit: notable
    conf: 0.97
    platforms: [macos]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)(execFileSync|spawnSync|execFile)\s*\(\s*["'']launchctl["''][\s\S]{0,160}["'']load["'']'

  # remote-login-enabled (objectives/persistence/system/surface/paths/macos)
  # is deliberately `for: [shell]` only -- non-shell sources can embed the
  # command string as test/hook data without running it. This composite
  # already pairs it with an actual SSH key install and a launchctl load
  # call, so a Node-scoped copy of the same text pattern (the same
  # per-language duplication already used for
  # applescript-remote-login-enabled in objectives/command-and-control/
  # backdoor/dispatch/local/macos.yaml) is used here instead of widening the
  # shared shell-only atom.
  - id: js-remote-login-enabled
    desc: Remote Login service enabled (Node)
    crit: suspicious
    conf: 0.84
    attack: T1021.004
    platforms: [macos]
    for: [javascript]
    if:
      type: text
      regex: 'systemsetup\s+-setremotelogin\s+on|com\.apple\.access_ssh'

composite_rules:
  - id: macos-launchagent-install-surface
    for: [python, javascript, ruby, php]
    desc: Writes or registers a user LaunchAgent
    crit: notable
    conf: 0.92
    platforms: [macos]
    all:
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
    any:
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-subcommand
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-gui
      - id: micro-behaviors/os/service/control::python-launchctl-argv
      - id: micro-behaviors/os/service/launchagent::shell-launchagent-plist-write
      - id: micro-behaviors/os/service/launchagent::shell-launchd-plist-write
      - id: micro-behaviors/os/service/launchagent::plistbuddy-start-interval-edit
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text

  - id: macos-launchagent-recurring-config
    for: [python, javascript, ruby, php]
    desc: Configures a user LaunchAgent to start or remain running
    crit: notable
    conf: 0.92
    platforms: [macos]
    all:
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
    any:
      - id: micro-behaviors/os/service/launchagent::launchagent-run-at-load
      - id: micro-behaviors/os/service/launchagent::launchagent-keepalive-key
      - id: objectives/persistence/system/launchd/schedule::start-interval
      - id: objectives/persistence/system/launchd/bootstrap::keep-alive

  - id: source-launchd-user-persistence
    desc: Source loads user LaunchAgent
    # User LaunchAgents are a persistence mechanism but are also routinely
    # installed by legitimate desktop applications and daemon managers.
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/start::launchctl-load-command
    any:
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/launchagent::source-launchagents-plist
    needs: 1
    unless:
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-homebrew-package
      - id: well-known/lib/runtime/compiled/crate-package/
      - id: well-known/lib/runtime/compiled/running-process::runpm-launchd-backend
      - id: well-known/app/storage/spacedrive/
      - id: well-known/app/ai/coding-agent/pixcode::benign-runtime-context
      - id: well-known/app/ai/coding-agent/pixcode::benign-archive-context
      - id: well-known/app/ai/coding-agent/pixcode::daemon-manager-source
      - id: well-known/app/ai/coding-agent/pixcode::archive-member-context
  - id: launchd-agent-persistence-with-claude-config
    for: [javascript]
    desc: LaunchAgent persistence paired with Claude Code configuration writes
    # This combination is security-relevant but has a documented legitimate
    # use in AI proxy software that installs a user service and points the
    # client at its local endpoint. Keep it suspicious outside a recognized
    # package context rather than treating the capability combination as an
    # attack with no legitimate use.
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
    unless:
      - id: well-known/app/ai/gateway/neurolink::benign-archive-context
      - id: well-known/app/ai/gateway/neurolink::proxy-launchd-context
      - id: well-known/app/ai/coding-agent/agentgem::benign-archive-context
      - id: well-known/app/ai/coding-agent/agentgem::warm-service-label
  - id: source-launchagent-node-program
    desc: LaunchAgent plist starts a Node.js program
    # A user LaunchAgent that starts Node is a persistence capability, not
    # attacker intent by itself. Keep the generic observation notable; the
    # network-backdoor composite below supplies the hostile context.
    crit: notable
    conf: 0.96
    platforms: [macos]
    for: [javascript, typescript]
    near_lines: 30
    all:
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/plist::plist-programarguments-key
      - id: source-launchagent-node-marker
  - id: launchagent-node-network-backdoor
    desc: Node.js network backdoor persists as a macOS LaunchAgent
    crit: hostile
    conf: 0.99
    attack: T1543.004,T1059.007,T1071.001
    platforms: [macos]
    for: [javascript, typescript]
    scope: leaf
    all:
      - id: source-launchagent-node-program
      - id: source-launchagent-load-via-node
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: source-ssh-backdoor-launchd-persistence
    desc: SSH backdoor paired with launchd enablement
    crit: hostile
    conf: 0.99
    attack: "T1098.004,T1543.004"
    # js-authorized-key-literal-backdoor is javascript/typescript-only; the
    # file default's go/kotlin/php/ruby/rust/python spread doesn't apply here.
    for: [javascript]
    all:
      - id: objectives/persistence/login/ssh/backdoor::js-authorized-key-literal-backdoor
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: js-remote-login-enabled
  - id: disguised-recurring-launchd-persistence
    for: [python, javascript, ruby, php]
    desc: Disguised recurring LaunchAgent persistence
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::source-startinterval-key
      - id: objectives/evasion/masquerade/identity/service::apple-helper-namespace

  - id: disguised-launchd-with-cron-fallback
    desc: Fake Apple launchd service with cron fallback
    # Self-protection and focus tools can deliberately use this combination;
    # it warrants review, but does not establish an attack by itself.
    crit: suspicious
    conf: 0.96
    attack: T1036.005,T1543.004,T1053.003
    platforms: [macos]
    for: [python]
    all:
      - id: objectives/evasion/masquerade/identity/service::apple-helper-namespace
      - id: micro-behaviors/os/service/control::python-launchctl-argv
      - id: micro-behaviors/os/autorun/scheduled::crontab-install-command

  - id: source-launchagent-remote-shell-persistence
    desc: Source installs a LaunchAgent that fetches shell code
    # A package source file that embeds a LaunchAgent, enables it with
    # launchctl, and makes that agent fetch code into a shell is a persistence
    # chain. Keep the legs close so ordinary documentation or unrelated service
    # helpers do not combine into a hostile match.
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    platforms: [macos]
    for: [source, '!go', applescript, javascript, lua, perl, php, python, ruby, shell]
    near_lines: 32
    all:
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/start::launchctl-load-command-text
      - id: micro-behaviors/process/create/shell/pipeline::source-curl-pipe-shell
    any:
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/launchagent::source-launchagents-literal

  - id: go-launchagent-remote-shell-persistence
    desc: Go source installs a LaunchAgent that fetches shell code
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    platforms: [macos]
    for: [go]
    near_lines: 28
    all:
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/start::go-launchctl-load-command
      - id: micro-behaviors/fs/write/file/full::go-writes-download-shell-pipeline
    any:
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/service/launchagent::source-launchagents-literal

  - id: jvm-launchagent-remote-shell-persistence
    desc: JVM installs a LaunchAgent that fetches shell code
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1543.004
    platforms: [macos]
    for: [class, java_class]
    all:
      - id: micro-behaviors/os/service/launchagent::jvm-launchagents-string
      - id: micro-behaviors/os/service/launchagent::jvm-runatload-enabled-string
      - id: micro-behaviors/os/service/launchagent::jvm-startinterval-string
      - id: micro-behaviors/os/service/start::jvm-launchctl-string
      - id: micro-behaviors/process/create/shell/pipeline::jvm-curl-pipe-shell-string
