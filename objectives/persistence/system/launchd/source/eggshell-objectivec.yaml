defaults:
  for: [objectivec]
  platforms: [macos]
  crit: component
  conf: 0.96
  attack: T1543.001

traits:
  - id: objectivec-hidden-launchagent-plist
    desc: Objective-C dotfile LaunchAgent plist
    crit: notable
    if:
      type: text
      regex: 'Library/LaunchAgents/\.[A-Za-z0-9._-]{1,40}\.plist'

  - id: objectivec-launchagent-dev-tcp-command
    desc: Objective-C LaunchAgent program arguments
    crit: notable
    if:
      type: text
      word: ProgramArguments

  - id: objectivec-loads-hidden-launchagent
    desc: Objective-C loads a dotfile LaunchAgent
    crit: notable
    if:
      type: text
      regex: 'launchctl\s+load\s+~/Library/LaunchAgents/\.'

composite_rules:
  - id: objectivec-reverse-shell-launchagent-persistence
    desc: Hidden LaunchAgent persists a reverse shell
    crit: hostile
    conf: 0.999
    all:
      - id: objectivec-hidden-launchagent-plist
      - id: objectivec-launchagent-dev-tcp-command
      - id: objectivec-loads-hidden-launchagent
      - id: objectives/command-and-control/reverse-shell/dup::objectivec-formatted-dev-tcp-reverse-shell
