defaults:
  platforms: [macos]
  for: [plist]
  attack: T1543.004

composite_rules:
  - id: launchd-keylogger-at-startup
    desc: Launchd starts a named keylogger when the job is loaded
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/configure::launchd-program-keylogger
      - id: micro-behaviors/os/service/configure::launchd-run-at-load
  - id: launchd-keylogger-keep-alive
    desc: Launchd keeps a named keylogger running
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/configure::launchd-program-keylogger
      - id: micro-behaviors/os/service/configure::keep-alive
