# Where the plist lives and where its Program/ProgramArguments point.
defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: launch-agents
    desc: LaunchAgents directory (user-level services)
    crit: notable
    conf: 0.7
    attack: T1543.004
    for: [plist, shell, applescript, javascript, macho]
    if:
      type: text
      substr: LaunchAgents
    downgrade:
      any:
        - id: metadata/signed/platform::apple
    unless:
      - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: plist-extension
    desc: .plist file extension (property list)
    crit: notable
    conf: 0.6
    attack: T1543.004
    if:
      type: text
      regex: Launch(Agents|Daemons)/.{1,96}\.plist
  - id: program-tmp
    desc: Program in /tmp/
    crit: notable
    conf: 0.8
    if:
      type: value
      path: Program
      regex: ^/(tmp|var/tmp|private/tmp)/
  - id: args-tmp
    desc: ProgramArguments[0] in /tmp/
    crit: notable
    conf: 0.8
    if:
      type: value
      path: ProgramArguments[0]
      regex: ^/(tmp|var/tmp|private/tmp)/
  - id: program-shared
    desc: Program in /Users/Shared/
    crit: notable
    conf: 0.7
    if:
      type: value
      path: Program
      regex: ^/Users/Shared/
  - id: args-shared
    desc: ProgramArguments[0] in /Users/Shared/
    crit: notable
    conf: 0.7
    if:
      type: value
      path: ProgramArguments[0]
      regex: ^/Users/Shared/
  - id: program-hidden
    desc: Hidden Program executable
    crit: notable
    conf: 0.7
    if:
      type: value
      path: Program
      regex: /\.[^/]{1,120}$
  - id: args-hidden
    desc: Hidden ProgramArguments[0] executable
    crit: notable
    conf: 0.7
    if:
      type: value
      path: ProgramArguments[0]
      regex: /\.[^/]{1,120}$
  - id: progargs-user-dotdir
    desc: ProgramArguments[0] under user dot directory
    crit: notable
    conf: 0.82
    if:
      type: value
      path: ProgramArguments[0]
      regex: ^/Users/[^/]{1,80}/\.[^/]{1,80}/
  - id: program-user-dotdir
    desc: Program under user dot directory
    crit: notable
    conf: 0.82
    if:
      type: value
      path: Program
      regex: ^/Users/[^/]{1,80}/\.[^/]{1,80}/
  - id: program-system
    desc: LaunchAgent Program in /System/
    crit: notable
    if:
      type: value
      path: Program
      regex: '^/System/'
  - id: program-usr
    desc: LaunchAgent Program in /usr/
    crit: notable
    if:
      type: value
      path: Program
      regex: '^/usr/'
  - id: progargs-system
    desc: LaunchAgent ProgramArguments[0] in /System/
    crit: notable
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^/System/'
  - id: progargs-usr
    desc: LaunchAgent ProgramArguments[0] in /usr/
    crit: notable
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^/usr/'
  - id: program-zoom
    desc: LaunchAgent Program is Zoom app
    crit: notable
    if:
      type: value
      path: Program
      regex: '^/Applications/zoom\.us\.app/'
  - id: progargs-zoom
    desc: LaunchAgent ProgramArguments[0] is Zoom app
    crit: notable
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^/Applications/zoom\.us\.app/'
  - id: program-google
    desc: LaunchAgent Program is Google app
    crit: notable
    if:
      type: value
      path: Program
      regex: '^(/Library/Google/|/Applications/Google)'
  - id: progargs-google
    desc: LaunchAgent ProgramArguments[0] is Google app
    crit: notable
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^(/Library/Google/|/Applications/Google)'
  - id: program-microsoft
    desc: LaunchAgent Program is Microsoft app
    crit: notable
    if:
      type: value
      path: Program
      regex: '^(/Library/Application Support/Microsoft/|/Applications/Microsoft)'
  - id: progargs-microsoft
    desc: "LaunchAgent ProgramArguments[0] is MS app"
    crit: notable
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^(/Library/Application Support/Microsoft/|/Applications/Microsoft)'
  - id: program-adobe
    desc: LaunchAgent Program is Adobe app
    crit: notable
    if:
      type: value
      path: Program
      regex: '^(/Library/Application Support/Adobe/|/Applications/Adobe)'
  - id: progargs-adobe
    desc: LaunchAgent ProgramArguments[0] is Adobe app
    crit: notable
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^(/Library/Application Support/Adobe/|/Applications/Adobe)'
  - id: program-oracle-java
    desc: LaunchAgent Program is Oracle Java plugin
    crit: notable
    if:
      type: value
      path: Program
      regex: '^/Library/Internet Plug-Ins/JavaAppletPlugin\.plugin/'
  - id: progargs-oracle-java
    desc: 'progargs oracle java'
    crit: notable
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^/Library/Internet Plug-Ins/JavaAppletPlugin\.plugin/'
composite_rules:
  - id: launchd
    desc: macOS launchd persistence (2+ indicators)
    crit: component
    conf: 0.66
    attack: T1543.004
    for: [plist, shell, applescript, python, javascript, macho]
    needs: 2
    any:
      - id: launch-agents
      - id: micro-behaviors/os/service/launchagent::launchdaemons-path
      - id: micro-behaviors/os/service/control::launchctl-command
      - id: plist-extension
      - id: objectives/persistence/system/launchd/bootstrap/
      - id: objectives/persistence/system/launchd/schedule::throttle-interval
      - id: objectives/persistence/system/launchd/schedule::start-interval
      - id: objectives/persistence/system/launchd/schedule::start-calendar-interval
      - id: objectives/persistence/system/launchd/output::stdout-path
      - id: objectives/persistence/system/launchd/output::stderr-path
      - id: objectives/persistence/system/launchd/event/
      - id: objectives/persistence/system/launchd/env::env-vars-dup
      - id: objectives/persistence/system/launchd/socket/
      # Five keys from the same leaf; name the directory rather than each one.
      - id: objectives/persistence/system/launchd/binary/
      - id: objectives/persistence/system/launchd/env::working-directory
      - id: micro-behaviors/os/service/plist::plist-programarguments-key
      - id: objectives/persistence/system/launchd/interpreter::embedded-plist-shell
      - id: objectives/persistence/system/launchd/interpreter::embedded-plist-zsh-programargs
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: program-unusual-location
    desc: Launchd Program/ProgramArguments in unusual location
    crit: notable
    conf: 0.7
    any:
      - id: program-tmp
      - id: args-tmp
      - id: program-shared
      - id: args-shared
      - id: program-hidden
      - id: args-hidden
      - id: progargs-user-dotdir
      - id: program-user-dotdir
  - id: launchd-user-dotdir
    desc: Launchd program in user dot directory
    crit: notable
    conf: 0.86
    any:
      - id: progargs-user-dotdir
      - id: program-user-dotdir
