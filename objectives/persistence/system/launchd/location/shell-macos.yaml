# Shell-script spelling of the launchd program-location checks in
# core/macos.yaml (which read a standalone .plist through value paths).
# Installer scripts emit the plist as a heredoc, so the ProgramArguments
# target is only visible as script text. A vendor installer points launchd at
# /Applications or /Library; a dropper points it at a stash it can write to
# without a package receipt.
defaults:
  platforms: [macos]
  for: [shell]
  attack: T1543.004
  mbc: B0028
  crit: suspicious
  conf: 0.9

traits:
  - id: shell-launchd-program-temp-path
    desc: Shell launchd plist targets temp path
    if:
      type: text
      regex: '(?s)<key>Program.{0,90}<string>/(private/)?(tmp|var/tmp)/'

  - id: shell-launchd-program-shared-path
    desc: Shell launchd plist targets /Users/Shared
    conf: 0.86
    if:
      type: text
      regex: '(?s)<key>Program.{0,90}<string>/Users/Shared/'

  - id: shell-launchd-program-hidden-path
    desc: Shell launchd plist targets hidden path
    conf: 0.86
    if:
      type: text
      regex: '(?s)<key>Program.{0,90}<string>[^<]{0,80}/\.[A-Za-z0-9_]'
