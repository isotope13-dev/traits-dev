# EnvironmentVariables and WorkingDirectory.
defaults:
  crit: baseline
  conf: 0.8
  platforms: [macos]
  for: [plist]
traits:
  - id: env-vars-dup
    desc: EnvironmentVariables key
    if:
      type: value
      path: EnvironmentVariables
  - id: working-directory
    desc: WorkingDirectory key
    if:
      type: value
      path: WorkingDirectory
