defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: suspicious-label
    desc: Masqueraded LaunchDaemon label
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "Label"
      regex: '(?i)com\.(google\.webkit\.service|apple\.cli)'
  - id: accountsd-helper-label
    desc: Masqueraded accountsd helper label
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "Label"
      exact: com.apple.accountsd.helper
  - id: apple-helper-label
    desc: Apple-style helper label
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "Label"
      regex: 'com\.apple\.[a-z0-9.-]{2,30}\.(helper|service|agent|daemon)'
    unless:
      - id: well-known/tool/development/darling/
  # Crash-reporter impersonation: stealers name a root LaunchDaemon
  # com.apple.ReportCrash.agent_<token> while pointing ProgramArguments at a
  # non-Apple binary under /tmp. The numeric suffix is builder-generated.
  - id: reportcrash-agent-label
    desc: ReportCrash agent LaunchDaemon label
    crit: suspicious
    conf: 0.96
    attack: T1036.005,T1543.004
    for: [plist, shell, scripts]
    if:
      type: text
      regex: 'com\.apple\.ReportCrash\.agent_[0-9]{4,16}'
  # Shell-script spelling: installer scripts emit the plist as a heredoc, so
  # the label is only visible as script text. A third-party installer that
  # labels its own daemon com.apple.* is impersonating an Apple service.
  - id: shell-launchd-apple-label
    desc: Shell launchd plist claims com.apple label
    crit: suspicious
    conf: 0.9
    for: [shell]
    attack: T1036.005
    if:
      type: text
      regex: '<key>Label</key>\s{0,40}<string>com\.apple\.'
  - id: native-launchd-label-key
    desc: Native code embeds launchd Label key
    crit: component
    conf: 0.96
    for: [macho]
    attack: T1543.004
    if:
      type: text
      exact: <key>Label</key>
  - id: native-apple-namespace-string
    desc: Native plist string uses Apple namespace
    crit: component
    conf: 0.96
    for: [macho]
    attack: T1036.005
    if:
      type: text
      regex: '^<string>com\.apple\.[a-z0-9.-]{2,50}</string>$'
  - id: accountsd-program-path
    desc: 'AccountsHelper in hidden app Support dir'
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: "ProgramArguments[*]"
      substr: /Library/Application Support/.com.apple.accountsd/AccountsHelper
  - id: hidden-apple-appsupport-path
    desc: Hidden Apple Application Support path
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "ProgramArguments[*]"
      regex: /Application Support/\.com\.apple\.[a-z0-9.-]{2,40}/

  - id: wide-sudo-s
    desc: UTF-16 sudo -S privileged pipe
    crit: notable
    conf: 0.92
    for: [applescript]
    if:
      type: hex
      pattern: "00 73 00 75 00 64 00 6F 00 20 00 2D 00 53 00 20"

  - id: wide-launchdaemons-dir
    desc: UTF-16 LaunchDaemons path fragment
    crit: notable
    conf: 0.9
    for: [applescript]
    if:
      type: hex
      pattern: "00 4C 00 61 00 75 00 6E 00 63 00 68 00 44 00 61 00 65 00 6D 00 6F 00 6E 00 73"

  - id: wide-hidden-accountsd-path
    desc: UTF-16 hidden apple.accountsd path
    crit: suspicious
    conf: 0.95
    attack: T1036.005
    for: [applescript]
    if:
      type: hex
      pattern: "00 61 00 70 00 70 00 6C 00 65 00 2E 00 61 00 63 00 63 00 6F 00 75 00 6E 00 74 00 73 00 64"

  - id: wide-dscl-authonly
    desc: UTF-16 dscl authonly password check
    crit: suspicious
    conf: 0.93
    attack: T1110.001
    for: [applescript]
    if:
      type: hex
      pattern: "00 64 00 73 00 63 00 6C 00 20 00 2E 00 20 00 61 00 75 00 74 00 68 00 6F 00 6E 00 6C 00 79"
composite_rules:
  - id: native-forged-apple-launchagent
    desc: Native implant persists as forged Apple LaunchAgent
    crit: hostile
    conf: 0.98
    attack: T1543.004,T1036.005
    for: [macho]
    all:
      - id: native-launchd-label-key
      - id: native-apple-namespace-string
      - id: objectives/persistence/system/launchd/core::embedded-plist-runatload-key
      - id: objectives/persistence/system/launchd/core::embedded-plist-programarguments
      - id: objectives/persistence/system/launchd/core::embedded-plist-keepalive
      - id: micro-behaviors/os/service/config::launchagents-path
    unless:
      - id: metadata/signed/platform::apple
  - id: sapphire-sleet-persistence
    desc: Sapphire Sleet persistence via LaunchDaemon
    crit: hostile
    attack: T1543.004
    all:
      - id: suspicious-label
      - id: objectives/persistence/system/launchd/location::program-user-writable-location
  - id: accountsd-helper-persistence
    desc: Masqueraded accountsd LaunchDaemon persistence
    crit: hostile
    attack: T1543.004
    all:
      - id: accountsd-helper-label
      - id: accountsd-program-path
  - id: hidden-apple-helper-persistence
    desc: Hidden Apple helper LaunchDaemon persistence
    crit: hostile
    attack: T1543.004
    all:
      - id: apple-helper-label
      - id: hidden-apple-appsupport-path
  - id: reportcrash-agent-tmp-persistence
    desc: ReportCrash agent LaunchDaemon runs /tmp binary
    crit: hostile
    conf: 0.98
    attack: T1543.004,T1036.005
    for: [plist, shell, scripts]
    all:
      - id: reportcrash-agent-label
    any:
      - id: objectives/persistence/system/launchd/location::shell-launchd-program-temp-path
      - id: objectives/command-and-control/dropper/staging/encrypted::tmp-apple-devtools-masquerade-path
      - id: objectives/persistence/system/launchd/location::program-user-writable-location

  - id: compiled-scpt-accountsd-launchd
    desc: Compiled AppleScript hidden accountsd LaunchDaemon
    crit: hostile
    conf: 0.97
    attack: T1543.004,T1036.005
    for: [applescript]
    all:
      - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
      - id: wide-sudo-s
      - id: wide-launchdaemons-dir
      - id: wide-hidden-accountsd-path
      - id: wide-dscl-authonly
