defaults:
  for: [applescript]
  platforms: [macos]
  attack: T1543.004,T1036.005,T1027
composite_rules:
  # A compiled variant can conceal commands using arithmetic while leaving
  # launchd configuration and the hidden Apple-style install root recoverable.
  # These required roles establish the installer pattern without relying on
  # a chosen service label, payload name, endpoint or a resolved dynamic argv.
  - id: scpt-concealed-apple-daemon-installer
    desc: Concealed Apple-style daemon with sudo input
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::scpt-arithmetic-character-decoders
      - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
      - id: micro-behaviors/communications/http/curl::curl-cmd
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password
      - id: micro-behaviors/os/service/control::launchctl-command
      - id: micro-behaviors/fs/path/config/autorun::launchdaemons-path
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::launchagent-keepalive-key
      - id: objectives/evasion/masquerade/binary/cache::app-support-hidden-apple

  # The concealed password-query profile adds context; a plist,
  # sudo or arithmetic string handling alone also occurs in administration.
  - id: scpt-concealed-sudo-keepalive-password-profile
    desc: Concealed launchd and password-dialog profile
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/control::launchctl-command
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::launchagent-keepalive-key
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password
      - id: objectives/anti-static/obfuscation/string/conceal::scpt-concealed-password-keychain-query
