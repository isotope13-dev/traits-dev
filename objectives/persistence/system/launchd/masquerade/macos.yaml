# Labels and program paths borrowed from known vendors.
defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: fake-apple-label
    desc: Launchd Label uses com.apple namespace
    crit: notable
    conf: 0.85
    if:
      type: value
      path: Label
      regex: ^com\.apple\.[A-Z][A-Za-z]+
      not:
        - substr: com.apple.HIToolbox
        - substr: com.apple.WebKit
        - substr: com.apple.CoreFoundation
        - substr: com.apple.Foundation
        - substr: com.apple.Security
        - substr: com.apple.CFNetwork
        - substr: com.apple.CoreServices
        - substr: com.apple.CoreData
        - substr: com.apple.AppKit
        - substr: com.apple.ReportCrash
        - substr: com.apple.ServiceManagement
        - substr: com.apple.UIKit
        - substr: com.apple.decmpfs
        - substr: com.apple.ResourceFork
        - substr: com.apple.WindowShadowDensity
    unless:
      - id: metadata/signed/anchor-apple
      - id: metadata/signed/platform::apple
    downgrade:
      any:
        - id: metadata/import/framework::system-framework
  - id: fake-homebrew-label
    desc: Fake homebrew identifier (com.homebrew)
    crit: notable
    conf: 0.9
    for:
      - macho
      - c
    if:
      type: text
      substr: com.homebrew
  - id: label-apple
    desc: Launchd Label starting with com.apple
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: ^com\.apple\.
  - id: label-zoom
    desc: Launchd Label starting with com.zoom
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: ^com\.zoom\.
  - id: label-google
    desc: Launchd Label starting with com.google
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: ^com\.google\.
  - id: label-finder-helper
    desc: Launchd Label mimics Finder helper
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: ^com\.finder\.(helper|agent|service|daemon)$
  - id: label-microsoft
    desc: Launchd Label starting with com.microsoft
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: ^com\.microsoft\.
  - id: label-adobe
    desc: Launchd Label starting with com.adobe
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: ^com\.adobe\.
  - id: label-oracle
    desc: Launchd Label starting with com.oracle
    crit: notable
    conf: 0.9
    if:
      type: value
      path: Label
      regex: ^com\.oracle\.
composite_rules:
  - id: launchd-app-trojan
    desc: Launchd persistence with app bundle hijacking
    crit: hostile
    conf: 0.95
    attack: T1543.004
    for:
      - c
      - macho
    all:
      - id: objectives/persistence/system/launchd/location::launchd
      - id: objectives/lateral-movement/trojanize/app::app-bundle-hijack
      - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: launchd-masquerading-apple
    desc: Apple-labeled Launchd item launching from unusual location
    crit: hostile
    conf: 0.9
    all:
      - id: label-apple
      - id: objectives/persistence/system/launchd/location::program-unusual-location
    unless:
      - id: objectives/persistence/system/launchd/location::program-system
      - id: objectives/persistence/system/launchd/location::program-usr
      - id: objectives/persistence/system/launchd/location::progargs-system
      - id: objectives/persistence/system/launchd/location::progargs-usr
  - id: launchd-masquerading-zoom
    desc: Zoom-labeled Launchd item launching from unusual location
    crit: hostile
    conf: 0.9
    all:
      - id: label-zoom
      - id: objectives/persistence/system/launchd/location::program-unusual-location
    unless:
      - id: objectives/persistence/system/launchd/location::program-zoom
      - id: objectives/persistence/system/launchd/location::progargs-zoom
  - id: launchd-masquerading-google
    desc: Google-labeled Launchd item launching from unusual location
    crit: hostile
    conf: 0.9
    all:
      - id: label-google
      - id: objectives/persistence/system/launchd/location::program-unusual-location
    unless:
      - id: objectives/persistence/system/launchd/location::program-google
      - id: objectives/persistence/system/launchd/location::progargs-google
  - id: launchd-googleupdate-appsupport
    desc: GoogleUpdate Launchd masquerade
    crit: hostile
    conf: 0.95
    attack: T1543.004,T1036.005
    all:
      - id: label-google
      - id: objectives/evasion/masquerade/binary::app-support-google-update
    any:
      - id: objectives/persistence/system/launchd/bootstrap::run-at-load
      - id: objectives/persistence/system/launchd/bootstrap::keep-alive
      - id: objectives/persistence/system/launchd/location::launch-agents
      - id: micro-behaviors/os/service/launchagent::launchdaemons-path
  - id: launchd-finder-helper-hidden
    desc: Finder helper Launchd masquerade
    crit: hostile
    conf: 0.95
    attack: T1543.004,T1036.005
    all:
      - id: label-finder-helper
    any:
      - id: objectives/persistence/system/launchd/location::program-hidden
      - id: objectives/persistence/system/launchd/location::args-hidden
      - id: micro-behaviors/os/service/launchagent::launchdaemons-path
  - id: launchd-masquerading-microsoft
    desc: Microsoft-labeled Launchd item launching from unusual location
    crit: hostile
    conf: 0.9
    all:
      - id: label-microsoft
      - id: objectives/persistence/system/launchd/location::program-unusual-location
    unless:
      - id: objectives/persistence/system/launchd/location::program-microsoft
      - id: objectives/persistence/system/launchd/location::progargs-microsoft
  - id: launchd-masquerading-adobe
    desc: Adobe-labeled Launchd item launching from unusual location
    crit: hostile
    conf: 0.9
    all:
      - id: label-adobe
      - id: objectives/persistence/system/launchd/location::program-unusual-location
    unless:
      - id: objectives/persistence/system/launchd/location::program-adobe
      - id: objectives/persistence/system/launchd/location::progargs-adobe
  - id: launchd-masquerading-oracle
    desc: Oracle-labeled Launchd item launching from unusual location
    crit: hostile
    conf: 0.9
    all:
      - id: label-oracle
      - id: objectives/persistence/system/launchd/location::program-unusual-location
    unless:
      - id: objectives/persistence/system/launchd/location::program-oracle-java
      - id: objectives/persistence/system/launchd/location::progargs-oracle-java
