defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1543.004

composite_rules:
  # A local service installer can use launchctl and KeepAlive. The hidden
  # Apple-named payload, remote retrieval, quarantine removal and password
  # replay distinguish the installer chain here. These are file-level facts,
  # not a claim that the engine resolved the dynamic shell arguments.
  - id: downloaded-daemon
    desc: Downloaded payload with masqueraded LaunchDaemon persistence
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/fs/attributes/xattr::xattr-recursive-quarantine-remove
      - id: micro-behaviors/os/service/control::launchctl-command
      - id: micro-behaviors/os/service/launchagent::launchdaemons-path
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/launchagent::launchagent-keepalive-key
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password
      - id: objectives/evasion/masquerade/binary::app-support-hidden-apple
      - id: objectives/evasion/masquerade/binary::launchagents-fake-apple
