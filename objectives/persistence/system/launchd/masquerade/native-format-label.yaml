# A native implant may format the launchd label at run time so no complete
# com.apple service name exists on disk.  Requiring both launchd locations and
# the plist assembly behavior avoids treating an ordinary printf format as
# persistence.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1543.001,T1543.004,T1036.005

traits:
  - id: formatted-apple-plist-label
    desc: Plist template formats a com.apple launchd label
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: <string>com.apple.%s</string>

composite_rules:
  - id: formatted-apple-launchd-persistence
    desc: Installs launchd persistence under a formatted Apple label
    crit: hostile
    conf: 0.99
    all:
      - id: formatted-apple-plist-label
      - id: objectives/persistence/system/supervised::runtime-assembled-launchagent
      - id: micro-behaviors/os/service/config::launchdaemons-path
    unless:
      - id: metadata/signed/platform::apple
