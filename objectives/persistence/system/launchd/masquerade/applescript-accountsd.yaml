defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

traits:
- id: accounts-helper-path
  desc: Masqueraded AccountsHelper implant path
  crit: suspicious
  conf: 0.95
  attack: T1036.005
  if:
    type: text
    substr: /Library/Application Support/.com.apple.accountsd/AccountsHelper
- id: accounts-helper-split-path
  desc: Split AccountsHelper implant path
  crit: suspicious
  conf: 0.9
  attack: T1036.005
  if:
    type: text
    regex: '\.com\.apple\.accountsd[\s\S]{0,160}AccountsHelper'
- id: accountsd-helper-label-text
  desc: Masqueraded accountsd helper label
  crit: suspicious
  conf: 0.95
  attack: T1036.005
  if:
    type: text
    substr: com.apple.accountsd.helper

composite_rules:
- id: accountsd-helper-persistence-script
  desc: Masqueraded accountsd LaunchDaemon persistence
  crit: hostile
  conf: 0.98
  attack: T1543.004
  all:
  - id: accountsd-helper-label-text
  - id: objectives/persistence/system/launchd/submit::sudo-pipe-launchdaemon
  any:
  - id: accounts-helper-path
  - id: accounts-helper-split-path
