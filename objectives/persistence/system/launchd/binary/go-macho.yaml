defaults:
  platforms: [unix]
  for: [macho]
  attack: T1543.004

traits:
  - id: go-macho-update-agent-plist
    desc: Go Mach-O update agent plist
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: com.apple.update.agent.plist

composite_rules:
  - id: go-macho-launchd-persistence
    desc: Go Mach-O launchd persistence
    crit: hostile
    conf: 0.98
    all:
      - id: go-macho-update-agent-plist
      - id: micro-behaviors/os/service/control::launchctl-command
