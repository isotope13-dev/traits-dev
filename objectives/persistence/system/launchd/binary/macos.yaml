# ProcessType, spawn type, resource limits and bundle association.
defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: process-type
    desc: ProcessType key (Background, App, etc.)
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: ProcessType
  - id: associated-bundles
    desc: AssociatedBundleIdentifiers key
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: AssociatedBundleIdentifiers
  - id: spawn-type
    desc: POSIXSpawnType key
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: POSIXSpawnType
  - id: soft-resource-limits
    desc: SoftResourceLimits key
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: SoftResourceLimits
  - id: hard-resource-limits
    desc: HardResourceLimits key
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: HardResourceLimits
