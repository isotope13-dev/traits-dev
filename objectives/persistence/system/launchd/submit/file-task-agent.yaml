defaults:
  platforms:
  - macos
  for:
  - macho
composite_rules:
- id: file-task-agent-shell-persistence
  desc: File-tasking backdoor with shell-profile persistence
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/command-and-control/backdoor/rat/remote-agent::macos-go-rat-json-tasking
  - id: micro-behaviors/fs/path/config/shell::zshrc-filename
  - id: micro-behaviors/os/service/control::launchctl-submit-command
  - id: micro-behaviors/os/service/launchagent::interactive-zsh-plist
  - id: micro-behaviors/os/service/launchagent::launchagents-directory-reference
  attack: T1543.001,T1546.004
- id: mcp-launchctl-submit-detached-install
  desc: MCP server uses launchctl submit for install
  crit: hostile
  conf: 0.99
  platforms: [unix]
  for: [scripts, source, json, yaml, markdown, text]
  attack: T1543.001,T1059.004
  all:
  - id: micro-behaviors/communications/mcp::mcp-client-config-key
  - id: micro-behaviors/os/service/control::launchctl-submit-args-command
  - id: micro-behaviors/os/service/control::launchctl-submit-shell-args
  - id: micro-behaviors/os/package-manager/reference-install::tmp-staged-package-install-command
