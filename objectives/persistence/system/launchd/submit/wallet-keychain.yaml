# This combination establishes malicious launchd persistence alongside
# credential-store targeting and wallet-app replacement. It requires no send
# operation, so it belongs here rather than under file exfiltration. The rule
# does not identify a malware family or prove that Keychain bytes were read.
defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: wallet-keychain-phish-launchdaemon
    desc: Wallet replacement and Keychain phish with LaunchDaemon
    crit: hostile
    conf: 0.99
    attack: T1543.004,T1056.002,T1195.002
    all:
      - id: objectives/credential-access/keychain/theft::keychain-db-validated-prompt
      - id: micro-behaviors/fs/path/wallet::multi-desktop-wallet-targets
      - id: wallet-launch-at-load
      - id: objectives/supply-chain/trojanized/app/wallet::wallet-app-download-replacement
