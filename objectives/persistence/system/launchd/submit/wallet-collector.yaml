defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: wallet-launch-at-load
    desc: Wallet collector includes launchd persistence
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/app-data/browser::browser-wallet-storage-references
      - id: micro-behaviors/os/service/launchd/config::embedded-runatload-true
      - id: phished-password-system-launchdaemon

