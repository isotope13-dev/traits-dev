defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  attack: T1005
  mbc: B0028

traits:
- id: sudo-pipe-launchdaemon
  desc: Piped sudo LaunchDaemon installation
  crit: suspicious
  conf: 0.95
  attack: T1543.004
  unless:
  - id: well-known/tool/offensive/xalgorix::xalgorix-authored-pentest-skill
  - id: well-known/tool/offensive/xalgorix::xalgorix-authored-skill
  if:
    type: text
    regex: sudo\s+-S\s+(cp|chown|launchctl).{0,120}LaunchDaemons
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/cleave::cleave-traits-package-identity
    # A Go test-support helper installing a LaunchDaemon into a throwaway VM
    # over SSH pipes the VM's fixed password to sudo; the string is test setup.
    - id: metadata/package/testing/harness/unit::go-testing-tb-parameter
