defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

traits:
- id: sudo-pipe-launchdaemon
  desc: Piped sudo LaunchDaemon installation
  crit: suspicious
  conf: 0.95
  attack: T1543.004
  if:
    type: text
    regex: sudo\s+-S\s+(cp|chown|launchctl).{0,120}LaunchDaemons
  unless:
  - id: well-known/dual-use/tunnel/tailscale::tailscale-source-token
  - type: path
    dirname: true
    regex: '(^|[\\/])tstest([\\/]|$)'
