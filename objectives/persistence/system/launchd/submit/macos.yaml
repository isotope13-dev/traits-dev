# Creating and installing the job: plist templates, write markers, installers.
defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: native-launchagent-plist-template
    desc: Native LaunchAgent plist template
    crit: notable
    conf: 0.94
    for: [macho]
    if:
      type: text
      regex: '<key>ProgramArguments</key>[\s\S]{0,240}<key>KeepAlive</key>'
  - id: native-launchagent-write-marker
    desc: Native LaunchAgent write marker
    crit: suspicious
    conf: 0.92
    for: [macho]
    if:
      type: text
      regex: '(?i)Cannot write plist:'
  - id: build-plist-symbol
    desc: build_plist helper symbol
    crit: notable
    conf: 0.82
    for:
      - c
      - macho
    if:
      type: symbol
      exact: build_plist
  - id: construct-plist-path-symbol
    desc: construct_plist_path helper symbol
    crit: notable
    conf: 0.8
    for:
      - c
      - macho
    if:
      type: symbol
      exact: construct_plist_path
  - id: install-daemon-symbol
    desc: install_daemon routine symbol
    crit: notable
    conf: 0.9
    for:
      - c
      - macho
    if:
      type: symbol
      exact: install_daemon
composite_rules:
  - id: launchd-dropper
    desc: Launchd persistence installer via system commands
    crit: hostile
    conf: 0.9
    attack: T1543.004
    for:
      - macho
    all:
      - id: objectives/persistence/system/launchd/location::launch-agents
      - id: micro-behaviors/os/service/control::launchctl-command
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: objectives/evasion/fileless/memory::exec-function
  - id: embedded-launchdaemon-installer
    desc: Embedded LaunchDaemon install routine
    crit: component
    conf: 0.91
    for:
      - c
      - macho
    any:
      - id: build-plist-symbol
      - id: construct-plist-path-symbol
      - id: install-daemon-symbol
    needs: 2
  - id: launchd-admin-daemon-installer
    desc: LaunchDaemon install with admin rights
    crit: hostile
    conf: 0.96
    for:
      - c
      - macho
    all:
      - id: embedded-launchdaemon-installer
      - id: objectives/privilege-escalation/elevation-control/prompt-escalation::auth-rights-request
    any:
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/hardware/input/event::macos-cgevent-tap-create
      - id: micro-behaviors/communications/socket/connect::connect
  - id: npm-launchagent-installer
    desc: npm install hook drops persistent LaunchAgent
    crit: hostile
    conf: 0.97
    attack: T1543.004
    for:
      - javascript
    all:
      - id: objectives/persistence/system/launchd/location::launch-agents
      - id: objectives/persistence/system/launchd/bootstrap::embedded-plist-runatload
      - id: objectives/persistence/system/launchd/bootstrap::embedded-plist-keepalive
      - id: micro-behaviors/fs/write/file/full::js-file-write
      - id: metadata/package/files/included::install-js-basename
    any:
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/fs/chmod/executable/mode
      - id: micro-behaviors/os/service/control::launchctl-command
