# Sockets, MachServices and the inetd compatibility keys.
defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: mach-services
    desc: MachServices key (XPC service registration)
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: MachServices
  - id: sockets
    desc: Sockets key (network socket activation)
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: Sockets
  - id: service-ipc
    desc: Launchd ServiceIPC configuration key
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: ServiceIPC
  - id: sock-service-name
    desc: "SockServiceName key"
    crit: baseline
    conf: 0.8
    attack: T1543.004
    if:
      type: value
      path: SockServiceName
  - id: inetd-compat
    desc: inetdCompatibility key (socket handoff)
    crit: baseline
    conf: 0.8
    attack: T1543.004
    if:
      type: value
      path: inetdCompatibility
  - id: embedded-sock-service
    desc: Embedded SockServiceName plist key
    crit: notable
    conf: 0.8
    for:
      - c
      - macho
    if:
      type: text
      substr: SockServiceName
composite_rules:
  - id: launchd-bind-shell
    desc: Launchd socket-activated bind shell
    crit: component
    conf: 0.9
    attack: T1543.004
    all:
      - id: sock-service-name
      - id: inetd-compat
    any:
      - id: objectives/persistence/system/launchd/interpreter::shell-program
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
  - id: embedded-plist-bind-shell
    desc: Embedded plist bind-shell template in binary
    crit: component
    conf: 0.85
    attack: T1543.004
    for:
      - c
      - macho
    all:
      - id: objectives/persistence/system/launchd/interpreter::embedded-plist-shell-sh
      - id: embedded-sock-service
  - id: launchd-embedded-bind-shell
    desc: Embedded plist bind-shell dropped to LaunchAgents
    crit: hostile
    conf: 0.95
    attack: T1543.004
    for:
      - c
      - macho
    all:
      - id: embedded-plist-bind-shell
      - id: objectives/persistence/system/launchd/location::launch-agents
      - id: micro-behaviors/process/create/shell/spawn::system-fn
