# StandardOutPath / StandardErrorPath and where they point.
defaults:
  platforms: [macos]
  for: [plist]
traits:
  - id: stdout-path
    desc: StandardOutPath key (log redirection)
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: StandardOutPath
  - id: stderr-path
    desc: StandardErrorPath key (log redirection)
    crit: baseline
    conf: 0.8
    if:
      type: value
      path: StandardErrorPath
  - id: stdout-tmp
    desc: StandardOutPath in /tmp/
    crit: notable
    conf: 0.8
    if:
      type: value
      path: StandardOutPath
      regex: ^/(tmp|var/tmp|private/tmp)/
    unless:
      - type: value
        path: WorkingDirectory
        regex: ^/Applications/[^/]{1,120}\.app/Contents/(MacOS|Library)(/|$)
  - id: stderr-tmp
    desc: StandardErrorPath in /tmp/
    crit: notable
    conf: 0.8
    if:
      type: value
      path: StandardErrorPath
      regex: ^/(tmp|var/tmp|private/tmp)/
    unless:
      - type: value
        path: WorkingDirectory
        regex: ^/Applications/[^/]{1,120}\.app/Contents/(MacOS|Library)(/|$)
composite_rules:
  - id: output-suspicious-location
    desc: Launchd StandardOutPath/StandardErrorPath in unusual location
    crit: component
    conf: 0.8
    any:
      - id: stdout-tmp
      - id: stderr-tmp
  - id: launchd-user-dotdir-temp-output
    desc: LaunchAgent from user dot directory logs to temp
    crit: suspicious
    conf: 0.9
    attack: T1543.004
    all:
      - id: objectives/persistence/system/launchd/location::launchd-user-dotdir
      - id: output-suspicious-location
    any:
      - id: objectives/persistence/system/launchd/bootstrap::run-at-load
      - id: objectives/persistence/system/launchd/bootstrap::keep-alive
      - id: objectives/persistence/system/launchd/schedule::start-interval
      - id: objectives/persistence/system/launchd/schedule::start-calendar-interval
