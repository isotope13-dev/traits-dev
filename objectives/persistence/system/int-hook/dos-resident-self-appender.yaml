defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
composite_rules:
  - id: dos-resident-exec-directory-infector
    desc: Resident EXEC and directory infection hooks
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/hook/interrupt::dos-installs-dos-video-vector-pair
      - id: objectives/impact/infect/binary/dos/append::dos-si-self-append-host-entry
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
      - id: micro-behaviors/fs/search/command::dos-int21-find-first
