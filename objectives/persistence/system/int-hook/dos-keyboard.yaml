defaults:
  platforms: [windows, unix]
  for: [dos_com]
composite_rules:
  - id: dos-resident-keyboard-sabotage
    desc: Resident keyboard hook corrupts user input
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int09-vector-get-then-set
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int21
      - id: objectives/impact/ui/manipulation/input::dos-keystroke-corruption-message-cycle
