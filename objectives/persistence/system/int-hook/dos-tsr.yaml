# Memory-resident DOS infectors shrink the memory control block and the
# BIOS-reported conventional memory, copy themselves to the top of memory,
# hook INT 21h, and answer a magic-constant installation check so only one
# copy stays resident. The shrink pair and the magic handshake together are
# the TSR install: neither occurs in ordinary DOS programs.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
composite_rules:
  - id: dos-resident-int21-hook-trace-guard
    desc: Resident INT 21 hook booby-traps INT 01
    crit: hostile
    conf: 0.93
    size_max: 4096
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-vector-get-then-set
      - id: micro-behaviors/os/msdos/interrupt::dos-int01-handler-first-word-patch
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int27
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int21
      - id: micro-behaviors/os/msdos/interrupt::dos-int27-after-dl-adjust
    needs: 1

  - id: dos-resident-int21-exec-hook
    desc: Resident INT 21h handler intercepts EXEC
    crit: hostile
    conf: 0.96
    size_max: 4096
    attack: T1546.012
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-vector-get-then-set
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int27
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int21
      - id: micro-behaviors/os/msdos/interrupt::dos-int27-after-dl-adjust
    needs: 1

  - id: dos-resident-int13-disk-read-hook
    desc: Resident INT 13h hook alters disk reads
    crit: hostile
    conf: 0.96
    size_max: 4096
    attack: T1546.012
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-int13-vector-get-then-set
      - id: micro-behaviors/os/msdos/interrupt::dos-int13-read-buffer-sabotage
    any:
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int27
      - id: micro-behaviors/os/msdos/interrupt::dos-tsr-keep-int21
      - id: micro-behaviors/os/msdos/interrupt::dos-int27-after-dl-adjust
    needs: 1

