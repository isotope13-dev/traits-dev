# Memory-resident DOS infectors shrink the memory control block and the
# BIOS-reported conventional memory, copy themselves to the top of memory,
# hook INT 21h, and answer a magic-constant installation check so only one
# copy stays resident. The shrink pair and the magic handshake together are
# the TSR install: neither occurs in ordinary DOS programs.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
traits:
  - id: dos-tsr-memory-shrink-pair
    desc: DOS TSR shrinks memory blocks
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "81 6D 03 ?? ?? [0-8] 81 6D 12 ?? ??"
  - id: dos-int21-residency-magic
    desc: DOS installation check over INT 21
    crit: suspicious
    conf: 0.92
    if:
      type: hex
      pattern: "B8 FF 51 CD 21 3D 51 FF"
composite_rules:
  - id: dos-tsr-int21-residency
    desc: TSR installs with residency protocol
    crit: hostile
    conf: 0.95
    all:
      - id: dos-tsr-memory-shrink-pair
      - id: dos-int21-residency-magic
