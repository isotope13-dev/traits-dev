# Decoder range and XOR key must agree with every required operation.
defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-xor-system-owned-dual-hook
  desc: XOR-hidden DOS resident forges system ownership
  crit: hostile
  conf: 0.98
  if:
    type: yara
    source: |
      rule dos_xor_system_owned_dual_hook {
        strings:
          $dec = { BB ?? ?? EB 08 EA 2E 80 37 ?? F9 43 FC E2 F7 }
          $owner = "\x26\xc7\x06\x01\x00\x08\x00\xb8\x21\x35\xcd\x21" xor(0-255)
          $set21 = "\xb8\x21\x25\x1f\xcd\x21\xba" xor(0-255)
          $set13 = "\xb8\x13\x25\xcd\x21" xor(0-255)
        condition:
          uint8(0) == 0xe9 and
          for any d in (1..#dec) : (
            ((3+uint16(1)) % 65536) <= @dec[d] and
            ((3+uint16(1)) % 65536)+32 >= @dec[d] and
            uint16(@dec[d]+1) == ((@dec[d]+15+256) % 65536) and
            ((uint16(@dec[d]-6) == 0xb966 and uint32(@dec[d]-4) > 0 and @dec[d]+15+uint32(@dec[d]-4) <= filesize+1) or
             (uint8(@dec[d]-3) == 0xb9 and uint16(@dec[d]-2) > 0 and @dec[d]+15+uint16(@dec[d]-2) <= filesize+1)) and
            @owner >= @dec[d]+15 and @owner+!owner <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @owner+!owner <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @owner+!owner <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@owner) ^ 38) == uint8(@dec[d]+9) and
            @set21 >= @dec[d]+15 and @set21+!set21 <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @set21+!set21 <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @set21+!set21 <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@set21) ^ 184) == uint8(@dec[d]+9) and
            @set13 >= @dec[d]+15 and @set13+!set13 <= filesize and
            ((uint16(@dec[d]-6) == 0xb966 and @set13+!set13 <= @dec[d]+15+uint32(@dec[d]-4)) or
             (uint8(@dec[d]-3) == 0xb9 and @set13+!set13 <= @dec[d]+15+uint16(@dec[d]-2))) and
            (uint8(@set13) ^ 184) == uint8(@dec[d]+9) and
            @set21 > @owner and @set21-@owner < 128 and @set13 > @set21 and @set13-@set21 < 16
          )
      }
