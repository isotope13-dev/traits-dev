defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
composite_rules:
- id: dos-system-owned-resident-host-appender
  desc: System-owned resident DOS hook alters hosts
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/write/file/handle::dos-encrypted-body-append-header-redirect
  - id: micro-behaviors/os/msdos/memory::dos-allocate-system-owned-copy-block
  - id: micro-behaviors/os/msdos/interrupt::dos-ivt-int21-swap
