# Persistence by planting an unpacked extension in a developer's editor.
#
# VS Code (and every fork that reuses its layout) loads any directory under
# the per-user extensions folder at launch -- no marketplace round trip, no
# signature, no prompt. An extension that declares a startup activation event
# and whose entry point spawns a detached child therefore re-launches an
# implant every time the victim opens their editor, and it survives reboots,
# profile resets and payload deletion elsewhere on disk. The Mirage Kitten
# NodeRabbit variants ship this as the `persist:vscode` command, writing a
# directory named after "GitHub Copilot Helper" so it reads as tooling in the
# extensions list.
#
# Legitimate installers do write here, which is why the install composite
# stays suspicious: the escalation to hostile needs the startup activation
# plus a detached, output-suppressed child process -- a combination an
# extension that actually contributes editor functionality has no reason to
# have.
#
# ATT&CK: T1546 (Event Triggered Execution), T1176 (Software Extensions)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1546
  mbc: F0012
traits:
  - id: startup-activation-event-write
    desc: Writes a startup activation event declaration
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)activationEvents[\s\S]{0,120}(onStartupFinished|["'']\*["''])'

  - id: extension-main-entry-write
    desc: Writes an extension manifest main entry
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)["'']main["'']\s*:\s*["'']\.?/?(extension|index)\.js["'']'

composite_rules:
  - id: unpacked-editor-extension-install
    desc: Plants an unpacked extension in the editor
    crit: suspicious
    conf: 0.9
    attack: T1176
    all:
      - id: micro-behaviors/fs/path/config/app::editor-user-extensions-dir
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
    any:
      - id: startup-activation-event-write
      - id: extension-main-entry-write

  - id: editor-extension-startup-launcher
    desc: Planted extension launches a hidden child at startup
    crit: hostile
    conf: 0.95
    attack: T1546,T1176
    all:
      - id: unpacked-editor-extension-install
      - id: startup-activation-event-write
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
