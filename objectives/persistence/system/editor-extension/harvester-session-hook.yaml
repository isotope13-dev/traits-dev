defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
composite_rules:
- id: credential-harvester-session-command-hooks
  desc: Credential harvester builds recurring agent command hooks
  crit: hostile
  conf: 0.97
  attack: T1546
  all:
  - id: micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-config-key
  - id: micro-behaviors/communications/mcp::mcp-server-command-args-fields
  - id: metadata/lang/source/syntax/call/arguments::serialized-agent-command-hook
  any:
  - id: objectives/credential-access/credential-manager/secret-storage::obfuscated-multi-source-credential-harvester
  - id: objectives/credential-access/memory::github-runner-process-memory-secret-dump
