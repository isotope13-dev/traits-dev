defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: concealed-multi-editor-vsix-installer
    desc: Concealed force-installation across desktop editors
    crit: hostile
    conf: 0.98
    attack: T1176,T1027,T1105
    all:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: micro-behaviors/process/create/shell/bridge::js-execsync-destructure
      - id: metadata/import/builtin::require-http
      - id: micro-behaviors/communications/http/request/dynamic::node-http-response-pipe
      - id: micro-behaviors/os/package-manager/ide-extension::forced-extension-install-arguments
      - id: micro-behaviors/os/package-manager/ide-extension::vsix-package-download-url
      - id: micro-behaviors/fs/path/application/editor::several-desktop-editor-install-paths
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
