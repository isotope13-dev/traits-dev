defaults:
  platforms: [unix]
  for: [javascript]
composite_rules:

  # Writes an editor's persistent terminal configuration, replacing every
  # subsequent terminal launch with remote script delivery.
  - id: vscode-terminal-settings-remote-shell
    desc: Writes remote shell pipeline into terminal config
    crit: hostile
    conf: 0.98
    attack: T1547,T1059.004,T1105
    scope: file
    near_bytes: 1600
    all:
      - id: micro-behaviors/process/create/shell/terminal::shellargs-curl-pipeline-assignment
      - id: micro-behaviors/fs/path/config/app::vscode-settings-json-filename
      - id: micro-behaviors/fs/write/file/full::js-fs-write-sync
