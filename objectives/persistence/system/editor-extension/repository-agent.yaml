defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1546
composite_rules:
  - id: obfuscated-repository-agent-config-writes
    desc: Obfuscated daemon commits editor configuration
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/config/app::editor-agent-config-path-cluster
      - id: micro-behaviors/process/create/spawn::daemon-guarded-detached-child
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
      - id: micro-behaviors/communications/http/services/github::github-graphql-create-commit-on-branch
      - id: micro-behaviors/fs/write/file/target::agent-config-path-near-write
