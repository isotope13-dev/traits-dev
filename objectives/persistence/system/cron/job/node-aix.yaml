defaults:
  platforms: [aix, unix]
  for: [javascript, typescript]
  attack: T1053.003
traits:
  - id: node-crontab-pipe-install
    desc: Node rewrites user crontab from standard input
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/app/ai/coding-agent/omnius::bundled-runtime-context
      - id: metadata/package/documentation/source-documentation::documentation-dir-path
      - id: well-known/lib/runtime/bun::bun-types-package-context
    if:
      type: text
      regex: 'crontab -l[\s\S]{0,240}\|\s*crontab -'
    not:
      # Filtering an entry out is uninstall cleanup, not persistence install.
      - regex: '\bgrep\s+-v\b'
  - id: node-hidden-ksh-cron-entry
    desc: Node cron entry runs hidden ksh script
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\* \* \* \* \* /bin/ksh \$\{[A-Za-z0-9_]+\}'
composite_rules:
  - id: aix-node-hidden-cron-persistence
    desc: AIX Node hidden cron persistence
    crit: hostile
    conf: 0.96
    all:
      - id: node-crontab-pipe-install
      - id: node-hidden-ksh-cron-entry
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
