defaults:
  platforms:
  - linux
  - openwrt
  for:
  - scripts
  - source
composite_rules:
- id: cron-persistent-kernel-thread-impostor
  desc: Cron writer impersonates Linux kernel thread
  crit: suspicious
  conf: 0.99
  attack: T1053.003,T1036.004
  near_lines: 20
  all:
  - id: micro-behaviors/fs/path/config/system::var-spool-cron-path
  - id: micro-behaviors/os/autorun/cron::recurring-minute-cron-command-literal
  - id: micro-behaviors/fs/write/file
  any:
  - id: objectives/evasion/masquerade/process/rename::prctl-bracketed-kworker-name
  - id: objectives/evasion/masquerade/process/rename::setproctitle-bracketed-kernel-thread-name
  - id: objectives/evasion/masquerade/process/title::process-title-linux-kernel-thread
