defaults:
  platforms: [openwrt, unix]
  for: [perl]
  attack: T1053.003

traits:
  - id: perl-cron-payload-variable
    desc: Perl cron payload variable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: "$cron_payload"

  # openwrt-root-crontab-path (objectives/persistence/system/network-
  # appliance/openwrt.yaml) inherits that file's default
  # `for: [c, cpp, elf, php, shell, javascript, typescript, lua, python,
  # pyc]`, which has no perl entry (each OpenWrt language gets its own
  # composite file; this is the perl one). Local copy of the same plain
  # text substring for this file's type.
  - id: perl-openwrt-root-crontab-path
    desc: OpenWrt root crontab path (Perl)
    crit: notable
    # Slightly below the compiled/script original's 0.9: Perl commonly
    # builds this path by concatenation (`$dir . "/root"`), so a bare
    # substring hit here is marginally less certain to be the literal path.
    conf: 0.86
    if:
      type: text
      substr: /etc/crontabs/root

composite_rules:
  - id: perl-openwrt-root-cron-persistence
    desc: Perl OpenWrt root cron persistence
    crit: hostile
    conf: 0.97
    all:
      - id: perl-openwrt-root-crontab-path
      - id: micro-behaviors/os/autorun/cron::crontab-wildcard-entry
    any:
      - id: micro-behaviors/process/interpreter/shell::bin-sh
      - id: perl-cron-payload-variable
    needs: 1
