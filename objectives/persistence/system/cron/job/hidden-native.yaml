defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.98
traits:
  - id: root-reboot-hidden-tmp-command
    desc: Root reboot cron runs hidden temporary file
    crit: suspicious
    if:
      type: text
      regex: '^@reboot[ \t]+root[ \t]+/tmp/\.[A-Za-z0-9_-]{2,32}$'
      section: .rodata
composite_rules:
  - id: native-root-reboot-hidden-stage
    desc: Hidden temporary root boot command and writer
    crit: hostile
    attack: T1053.003
    all:
      - id: root-reboot-hidden-tmp-command
      - id: micro-behaviors/fs/path/config/system::cron-d-path-reference
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/fs/write/file/descriptor::static-write-symbol-text
