defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.98
composite_rules:
  - id: native-root-reboot-hidden-stage
    desc: Credential stager with hidden root reboot writer
    crit: hostile
    attack: T1053.003
    all:
      # A hidden boot command and self-copy APIs also occur in installers.
      # Require the credential-spreading execution stager for admission.
      - id: objectives/lateral-movement/brute-force/iot-creds::iot-credential-http-exec-stager
      - id: micro-behaviors/os/autorun/cron::root-reboot-hidden-tmp-command
      - id: micro-behaviors/fs/path/config/system::cron-d-path-reference
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
    any:
      - id: micro-behaviors/fs/write/file/descriptor::static-write-symbol-text
      - id: micro-behaviors/fs/write/file/descriptor::arm-libc-write-syscall-forwarder

  # The trigger and hidden launch are bound in one command literal. The
  # external downloader and launch primitives corroborate its payload role.
  - id: embedded-reboot-hidden-payload-relaunch
    desc: Embedded reboot job downloads and repeatedly relaunches a hidden payload
    crit: hostile
    conf: 0.98
    attack: T1053.003,T1105,T1564.001
    all:
      - id: micro-behaviors/os/autorun/cron::reboot-hidden-file-relaunch-command
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/process/create/local-exec::embedded-download-chmod-execute-chain
      - id: micro-behaviors/process/create/shell/command-mode::hidden-local-relaunch-loop
