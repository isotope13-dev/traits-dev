defaults:
  platforms: [unix]
  for: [scripts, source, binaries]
  attack: T1053.003

traits: []

composite_rules:
  - id: user-cache-cron-self-copy-persistence
    desc: Self-copying daemon impostor is relaunched from a user cache by cron
    crit: hostile
    conf: 0.99
    attack: T1053.003,T1036.005,T1564.001
    near_bytes: 1200
    all:
      - id: micro-behaviors/fs/file/copy/
      - id: micro-behaviors/fs/path/config/system::var-spool-cron-path
      - id: objectives/evasion/masquerade/binary::user-cache-system-daemon-path
    any:
      - id: micro-behaviors/os/autorun/scheduled::recurring-minute-cron-command-literal
      - id: micro-behaviors/os/autorun/scheduled::source-cron-schedule-entry
      - id: micro-behaviors/os/autorun/scheduled::crontab-wildcard-entry
