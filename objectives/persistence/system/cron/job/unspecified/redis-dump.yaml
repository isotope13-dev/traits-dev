# Redis persistence abuse redirects RDB output into root's cron spool.
# Ordinary Redis saves and ordinary cron entries cannot satisfy this rule.
defaults:
  platforms: [linux]
  for: [elf, c, cpp]
  conf: 0.98
  attack: T1053.003
traits:
  - id: redis-cron-spool-redirection
    desc: Redis dump redirected into cron spool
    crit: suspicious
    if:
      type: text
      regex: '\bCONFIG SET dir /var/spool/cron(/crontabs)?\b'
  - id: redis-root-crontab-filename
    desc: Redis dump filename targets root crontab
    crit: suspicious
    if:
      type: text
      regex: '\bCONFIG SET dbfilename root\b'
  - id: redis-recurring-shell-download-value
    desc: Redis SET embeds recurring shell-download cron
    crit: suspicious
    if:
      type: text
      regex: 'SET \w+ .{0,24}\*/\d+ \* \* \* \* wget[^\r]{0,180};sh '
composite_rules:
  - id: redis-root-cron-payload-dump
    desc: Redis root-cron dump with shell payload
    crit: hostile
    all:
      - id: redis-cron-spool-redirection
      - id: redis-root-crontab-filename
      - id: redis-recurring-shell-download-value
      - id: micro-behaviors/data/db/redis::redis-save-command
