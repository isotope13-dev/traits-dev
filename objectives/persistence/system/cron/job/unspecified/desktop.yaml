defaults:
  platforms: [linux]
  for: [desktop-entry]
  attack: T1053.003

composite_rules:
  - id: desktop-entry-downloaded-cron-agent
    desc: Desktop Entry schedules downloaded executable
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::desktop-entry-native-download-execute
    any:
      - id: micro-behaviors/os/autorun/cron/unspecified::desktop-exec-crontab-rewrite
      - id: micro-behaviors/os/autorun/cron/unspecified::desktop-exec-reboot-crontab-file
