defaults:
  platforms: [unix]
  for: [lua]
  attack: T1053.003
composite_rules:
  - id: lua-crontab-persistence
    desc: Lua script installs a cron job for persistence
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/source/naming/function/system::lua-os-execute-symbol
      - id: micro-behaviors/time/schedule/keywords::cron-keyword
      - id: micro-behaviors/fs/path/config/scheduled::openwrt-root-crontab-path
    unless:
      - id: well-known/tool/sysadmin/openwrt/passwall/
