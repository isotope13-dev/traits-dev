defaults:
  platforms: [unix]
  for: [php]
composite_rules:
  - id: php-file-write-and-cron-reference
    desc: PHP file write and cron references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/write/file/handle/unspecified::php-file-write
      - id: micro-behaviors/os/autorun/cron/unspecified::php-cron-path-or-command
