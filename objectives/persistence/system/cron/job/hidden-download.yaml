defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: hidden-temp-download-cron-relaunch
    desc: Cron installs a downloader that launches hidden temp executables
    crit: hostile
    conf: 0.99
    attack: T1053.003,T1105,T1564.001
    all:
      - id: micro-behaviors/os/autorun/cron::crontab-echo-pipe
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-tmp-executable
      - id: micro-behaviors/communications/http/download/shell::fetch-output-to-literal
      - id: micro-behaviors/process/create/local-exec::chmod-exec-literal-local
