defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: native-self-path-reboot-registration
    desc: Native self-path with emitted reboot cron registration
    crit: suspicious
    conf: 0.94
    attack: T1053.003
    all:
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/os/autorun/cron/entry::echo-reboot
      - id: micro-behaviors/os/autorun/cron/modify::binary-crontab-stdin-command
    near_bytes: 256
