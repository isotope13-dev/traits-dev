defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: encrypted-shell-bot-root-reboot-cron
    desc: Shell-command bot embeds root reboot cron job
    crit: hostile
    conf: 0.98
    attack: T1053.003
    all:
      - id: objectives/command-and-control/remote-command/tasking::go-encrypted-shell-command-results
      - id: micro-behaviors/os/autorun/cron::native-root-reboot-entry
      - id: micro-behaviors/os/service/config::native-cron-directory-path
