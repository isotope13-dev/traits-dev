defaults:
  platforms: [unix]
  for: [shell]
  attack: T1053.003,T1027

traits:
  - id: shell-cron-command-literal-fragment
    desc: Shell assigns a cron command fragment
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: "=['\"]cron(tab)?[ .]?['\"]"
  - id: shell-reboot-literal-fragment
    desc: Shell assigns a reboot schedule fragment
    crit: component
    if:
      type: text
      regex: "=['\"]@reb(oot)?[ \t]?['\"]"

composite_rules:
  - id: shell-fragmented-cron-reboot-persistence
    desc: Shell rebuilds and evaluates a concealed reboot schedule
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/string/concat::shell-concealed-command-fragment-eval
      - id: shell-cron-command-literal-fragment
      - id: shell-reboot-literal-fragment
