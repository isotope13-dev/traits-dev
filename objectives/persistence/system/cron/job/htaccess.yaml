defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1053.003

composite_rules:
  # The cron string contains the overwrite, and stdin installation is also
  # required. No operator-selected basename, account, address or language gate.
  - id: cron-restores-permissive-htaccess
    desc: Cron install beside open htaccess rewrite
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/cron::shell-stdin-install
      - id: micro-behaviors/communications/http/server/authz::htaccess-universal-grant-command-string
      - id: micro-behaviors/os/autorun/cron::cron-scheduled-command-literal
    near_lines: 2
