defaults:
  platforms: [linux]
  for: [elf]
  attack: T1053.003
composite_rules:
  - id: telnet-stager-reboot-cron-persistence
    desc: Telnet credential implant embeds reboot cron and hidden staging paths
    crit: hostile
    conf: 0.98
    # Cron installation alone is legitimate. The independently established
    # credential implant supplies the unauthorized-payload context. These
    # observations share a binary; this rule does not bind the formatted path.
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-shell-stager
      - id: micro-behaviors/os/autorun/cron::printf-reboot-command-template
      - id: micro-behaviors/os/autorun/cron::shell-stdin-install
      - id: micro-behaviors/fs/path/system::hidden-var-usr-dotfile-path
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path

  # Rival-miner termination supplies the unauthorized implant context.
  # Cron fragments alone are legitimate administration.
  - id: rival-killer-crontab-persistence
    desc: Rival-killer crontab installation commands
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/degrade/rival-bot/competitor::static-elf-rival-miner-proc-bot
      - id: micro-behaviors/os/autorun/cron::shell-stdin-install
      - id: micro-behaviors/os/autorun/cron::crontab-option
