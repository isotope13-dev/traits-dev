defaults:
  platforms: [linux]
  for: [elf]
  attack: T1053.003
composite_rules:
  - id: telnet-stager-reboot-cron-persistence
    desc: Telnet credential implant embeds reboot cron and hidden staging paths
    crit: hostile
    conf: 0.98
    # Cron installation alone is legitimate. The independently established
    # credential implant supplies the unauthorized-payload context. These
    # observations share a binary; this rule does not bind the formatted path.
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-shell-stager
      - id: micro-behaviors/os/autorun/cron::printf-reboot-command-template
      - id: micro-behaviors/os/autorun/cron::shell-stdin-install
      - id: micro-behaviors/fs/path/system::hidden-var-usr-dotfile-path
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path

  - id: mips-elf-crontab-watchdog-persistence
    desc: Static MIPS ELF embeds crontab install and watchdog paths
    crit: hostile
    conf: 0.98
    attack: T1053.003,T1106,T1498
    arch: [mips]
    all:
      - id: micro-behaviors/fs/path/device/special::watchdog-device
      - id: micro-behaviors/os/autorun/cron::shell-stdin-install
      - id: micro-behaviors/os/autorun/cron::crontab-option
      - id: micro-behaviors/os/syscall/raw::mips-direct-syscall-instruction
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
      - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty
    any:
      - id: micro-behaviors/os/signal/dispatch::kill-command-signal-option
      - id: micro-behaviors/communications/http/download/curl::wget-path
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/sysadmin/unix-benign/
      - id: "metadata/file/naming::test-directory-component"
