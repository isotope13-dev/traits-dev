defaults:
  platforms: [unix]
  for: [javascript, typescript]

composite_rules:
  # Credential collection supplies the attack context; a routine scheduled
  # curl health check or a standalone bootstrap pipeline does not qualify.
  - id: node-credential-sweep-remote-shell-cron
    desc: Credential sweeper installs remote-shell cron job
    crit: hostile
    conf: 0.99
    attack: T1053.003,T1059.004,T1105
    all:
      - id: objectives/credential-access/files/config::developer-credential-sweep
      - id: micro-behaviors/os/autorun/cron::node-crontab-input-pipeline
      - id: micro-behaviors/os/autorun/cron::cron-curl-shell-entry
