defaults:
  platforms: [linux]
  for: [elf]
  attack: T1053.003
  mbc: B0028

traits:
  - id: vision-rc-local-setup-symbol
    desc: Vision rc.local setup routine symbol
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: main.hRpCwZt
      section: .gopclntab
  - id: vision-cron-setup-symbol
    desc: Vision cron setup routine symbol
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: main.bNkXqVm
      section: .gopclntab

composite_rules:
  - id: vision-startup-persistence-checks
    desc: Vision dual startup persistence checks
    crit: suspicious
    conf: 0.99
    all:
      - id: vision-rc-local-setup-symbol
      - id: vision-cron-setup-symbol
