defaults:
  platforms: [unix]
  for: [shell]
  attack: T1053.003
composite_rules:
  - id: generated-pid-watchdog-cron
    desc: Cron installs a generated PID watchdog
    crit: suspicious
    conf: 0.97
    near_lines: 24
    all:
      - id: micro-behaviors/process/lifecycle/supervise::generated-pid-watchdog-script
      - id: micro-behaviors/os/autorun/cron/entry::every-minute-cron-schedule
      - id: micro-behaviors/os/autorun/cron/modify::crontab-file-install
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::shell-chmod-owner-executable
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/fs/chmod/executable/mode::shell-owner-executable-numeric-mode
  - id: remote-response-shell-job
    desc: Cron pipes a remote response into a shell
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shell-pipes-downloaded-script
      - id: micro-behaviors/os/autorun/cron/entry::schedule-command-prefix
    near_lines: 0
