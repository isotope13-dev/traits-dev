defaults:
  platforms: [unix]
  for: [package.json]
  attack: T1053.003,T1496,T1562.001

traits:
  - id: npm-cron-cleaner-package
    desc: Identifies registry-staged cron cleaner
    crit: notable
    if:
      type: value
      path: name
      exact: cbc97b7a
  - id: npm-base64-crontab-remove
    desc: Contains encoded command removing crontab
    crit: suspicious
    if:
      type: text
      regex: 'Y3JvbnRhYiAtciAyPi9kZXYv|cm9udGFiIC1yIDI\+L2Rldi9u|b250YWIgLXIgMj4vZGV2L251'
  - id: npm-base64-miner-process-pattern
    desc: Contains encoded competing-miner process pattern
    crit: notable
    if:
      type: text
      regex: 'c3lzbG9nLWhlbHBlcnxkb25h|eXNsb2ctaGVscGVyfGRvbmF0|c2xvZy1oZWxwZXJ8ZG9uYXRl'

composite_rules:
  - id: npm-registry-staged-cron-cleaner
    desc: Stages encoded cron-removing miner script in npm metadata
    crit: hostile
    conf: 0.99
    all:
      - id: npm-cron-cleaner-package
      - id: npm-base64-crontab-remove
      - id: npm-base64-miner-process-pattern
