defaults:
  platforms: [linux]
  for: [elf, shell]
  attack: T1053.003
composite_rules:
  - id: procfs-cron-process-relaunch
    desc: Installs cron watchdog checking process command lines
    crit: suspicious
    conf: 0.97
    near_bytes: 400
    all:
      - id: micro-behaviors/process/lifecycle/supervise::procfs-absent-process-relaunch
      - id: micro-behaviors/os/autorun/cron/entry::echo-cron-fields
      - id: micro-behaviors/os/autorun/cron/modify::shell-stdin-install
  - id: framed-shell-agent-cron-watchdog
    desc: Cron watchdog maintains a shell tasking agent
    for: [elf]
    crit: hostile
    conf: 0.98
    all:
      - id: procfs-cron-process-relaunch
      - id: objectives/command-and-control/backdoor/dispatch/shell/socket::native-framed-shell-agent
