defaults:
  platforms: [unix]
  for: [shell]
  attack: T1053.003
traits:
  - id: hidden-process-relaunch-guard
    desc: Checks hidden process before relaunch
    crit: notable
    if:
      type: text
      regex: 'pgrep[ \t]+-f[ \t]+[''"]\.[^''"\r\n]{1,40}[''"][^\r\n]{0,60}\|\|'
composite_rules:
  - id: cron-hidden-detached-watchdog
    desc: Installs cron watchdog for hidden detached executable
    crit: hostile
    conf: 0.98
    near_lines: 6
    all:
      - id: hidden-process-relaunch-guard
      - id: micro-behaviors/os/autorun/cron/entry::crontab-wildcard-entry
      - id: micro-behaviors/os/autorun/cron/modify::shell-stdin-install
      - id: micro-behaviors/process/daemonize/detach::setsid-hidden-command
      - id: micro-behaviors/process/daemonize/detach::detached-background-command
