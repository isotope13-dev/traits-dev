# The emitted command, cron-shaped literal and stdin installation must be
# on the same pipeline line. No inference is made from a daemon name alone.
defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: logging-daemon-miner-cron-install
    desc: Cron pipeline installs a daemon-named mining entry
    crit: suspicious
    conf: 0.95
    attack: T1053.003
    near_lines: 0
    all:
      - id: objectives/evasion/masquerade/process/miner::emitted-logging-daemon-mining-command
      - id: micro-behaviors/os/autorun/cron/entry::cron-scheduled-command-literal
      - id: micro-behaviors/os/autorun/cron/modify::shell-crontab-stdin-call
