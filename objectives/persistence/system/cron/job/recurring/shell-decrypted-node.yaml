# A shell script that decrypts a program with an inline node one-liner and
# then installs a recurring crontab entry: the scheduled job is the decrypted
# payload, so persistence is established for code the image never shipped in
# clear. The hidden-path leg keeps build scripts that merely decrypt secrets
# and separately manage cron out of scope.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1053.003,T1140

composite_rules:
  - id: shell-cron-decrypted-node-payload
    desc: Shell installs recurring cron job beside inline-node payload decryption
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::shell-inline-node-decipher
      - id: micro-behaviors/os/autorun/cron/unspecified::crontab-append-pipeline
      - id: micro-behaviors/os/autorun/cron/entry::cron-scheduled-command-literal
    any:
      - id: micro-behaviors/fs/path/hidden::home-hidden-dotdir-ref
      - id: micro-behaviors/fs/path/system/directory::usr-data-dir-hidden-entry
