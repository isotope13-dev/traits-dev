defaults:
  platforms: [linux, macos, unix]
  for: [scripts, source]

composite_rules:
  - id: recurring-crontab-pipeline
    desc: Pipeline appends or modifies recurring crontab
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/os/autorun/cron/unspecified::crontab-append-pipeline
      - id: micro-behaviors/os/autorun/cron/modify::node-crontab-input-pipeline

  - id: ssh-key-backdoor-recurring-crontab
    desc: SSH key backdoor installs recurring crontab
    crit: hostile
    conf: 0.98
    attack: T1098.004,T1053.003,T1572
    all:
      - id: recurring-crontab-pipeline
    any:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-local-sshd-reverse-forward

  - id: local-sshd-reverse-forward-recurring-crontab
    desc: Recurring crontab setup accompanies reverse SSH access
    crit: suspicious
    conf: 0.96
    attack: T1053.003,T1572
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
      - id: recurring-crontab-pipeline

  - id: recurring-crontab-reverse-ssh-tunnel
    desc: Recurring crontab maintains reverse SSH tunnel
    crit: hostile
    conf: 0.97
    attack: T1053.003,T1572
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-loopback-service
      - id: recurring-crontab-pipeline
      - id: micro-behaviors/os/autorun/cron/unspecified::echo-cron-fields
