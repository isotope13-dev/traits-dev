defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: concealed-crontab-recurring-relaunch
    desc: Concealed removal-resistant crontab with recurring launch entries
    crit: hostile
    conf: 0.98
    attack: T1053.003
    all:
      - id: objectives/evasion/hijack-execution-flow/wrapper::crontab-concealment-and-removal-resistance
      - id: micro-behaviors/os/autorun/cron::crontab-at-reboot
      - id: micro-behaviors/os/autorun/cron::crontab-wildcard-entry
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
