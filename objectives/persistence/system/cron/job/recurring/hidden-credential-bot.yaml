defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: hidden-credential-cron-init-templates
    desc: Hidden-credential bot has recurring cron and init templates
    crit: hostile
    conf: 0.98
    attack: T1053.003,T1037.004
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::xor-encoded-iot-credential-table
      - id: micro-behaviors/os/autorun/cron/entry::native-recurring-cron-prefix
      - id: micro-behaviors/fs/path/config/scheduled::root-crontab-spool-path
      - id: micro-behaviors/os/service/config::native-hidden-init-script-path
      - id: micro-behaviors/os/service/config::etc-rc-local
