# A recurring cron job that runs a script from a dot-named directory, installed
# by a crontab pipeline, is a relaunch mechanism that hides its program from a
# casual listing. Dot directories hold ordinary user configuration too, so the
# pair is suspicious; the hostile conviction comes from the tunnel composites.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1053.003

composite_rules:
  - id: recurring-cron-dotfile-pipeline
    desc: Pipeline installs recurring cron job for dotfile script
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/autorun/cron/entry::recurring-cron-dotfile-script-command
      - id: recurring-crontab-pipeline
