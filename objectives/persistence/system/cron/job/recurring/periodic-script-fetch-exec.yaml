# Script that installs a file under /etc/cron.{hourly,daily,weekly,monthly}
# whose body pipes a remote download into a shell: the periodic runner then
# re-fetches and executes attacker-controlled code on every cycle.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1053.003,T1105
  mbc: B0030

composite_rules:
  - id: periodic-cron-script-remote-exec-install
    desc: Periodic cron script runs remote code
    crit: hostile
    conf: 0.96
    near_lines: 12
    all:
      - id: micro-behaviors/fs/write/file/redirect::shell-periodic-cron-redirect-write
    any:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-command-line
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shell-pipes-downloaded-script
