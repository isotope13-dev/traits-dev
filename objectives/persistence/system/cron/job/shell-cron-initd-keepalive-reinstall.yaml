# A shell script that writes a keepalive script, adds it to the crontab through
# a pipeline or the OpenWrt root crontab, and also drops an init.d startup hook
# gives a downloaded payload three independent ways back after reboot or kill.
defaults:
  platforms: [unix]
  for: [shell, scripts]
  attack: T1053.003,T1037.004
composite_rules:
  - id: shell-cron-and-initd-keepalive-persistence
    desc: Shell adds cron entry and init.d hook for keepalive
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/os/autorun/cron::crontab-append-pipeline
      - id: micro-behaviors/fs/path/config/system::openwrt-root-crontab-path
      - id: micro-behaviors/fs/write/system-paths::startup-init-file-redirect
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
