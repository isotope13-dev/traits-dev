# The literal must be an argument to the command actually writing cron.d.
# A cron-shaped string beside an inventory or removal command is insufficient.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1053.003,T1564.001
traits:
  - id: root-hidden-temp-cron-dropin
    desc: Installs root cron for hidden temporary file
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((redirected_statement
          body: (command name: (command_name) @emit argument: (_) @job)
          redirect: (file_redirect [">" ">>"] destination: (_) @destination))
          (#match? @emit "^(echo|printf)$")
          (#match? @destination "^[\"']?/etc/cron\\.d/[^/\\s\"']+[\"']?$")
          (#match? @job "^[\"']([0-9*/,-]+[ \\t]+){5}root[ \\t]+/(var/)?tmp/\\.[^\\s\"']+"))
