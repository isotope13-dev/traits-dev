defaults:
  platforms: [unix, appliance]
  for: [javascript, typescript]
  attack: T1053.003

traits:
  - id: node-root-cron-self-entry
    desc: Node root cron self entry
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '/var/spool/cron/crontabs/root[\s\S]{0,240}__filename'

composite_rules:
  - id: node-cron-spool-persistence
    desc: Node writes recurring cron spool entry
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/config/system::var-spool-cron-path
      - id: micro-behaviors/os/autorun/cron::recurring-minute-cron-command-literal
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call

  - id: node-root-cron-persistence
    desc: Node root cron persistence
    crit: hostile
    conf: 0.98
    all:
      - id: node-root-cron-self-entry
      - id: micro-behaviors/fs/write/file/full::write-file-sync
