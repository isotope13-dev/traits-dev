defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1053.003

# `openclaw-cron-add` moved to well-known/app/ai/coding-agent/openclaw::cron-add-command.
# Its matcher only recognizes a named product's scheduling surface, which is
# a software identity, not persistence intent -- and at `crit: suspicious` it
# reported OpenClaw's own dist/cron.js, the code that implements the feature.
# The intent still comes from the composite below, which pairs that identity
# with a remote-task instruction and a neutral no-delivery option.
composite_rules:
  - id: autonomous-remote-task-cron-persistence
    desc: Installs recurring autonomous remote task cron persistence
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/remote-command/tasking::agent-task-tool-chain-instruction
      - id: well-known/app/ai/coding-agent/openclaw::cron-add-command
      - id: micro-behaviors/process/argument/option::no-deliver-option
    near_bytes: 2500
    unless:
      # Grix uses OpenClaw's isolated, no-delivery cron facility for its
      # documented six-hour self-update check.
      - id: well-known/app/utility/grix::grix-auto-update-check
