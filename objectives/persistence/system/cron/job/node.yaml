defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1053.003

traits:
  - id: node-cron-remote-curl
    desc: Node cron entry downloads remote URL
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\*/[0-9]{1,2}\s+\*\s+\*\s+\*\s+\*[^\n]{0,180}\b(curl|wget)\b\s+[^\n]{0,80}https?://'
  - id: autonomous-task-message
    desc: Autonomous agent task-pool worker-loop message
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\w+_list_tasks\b[\s\S]{0,600}\w+_submit_deliverable\b'
  # `openclaw-cron-add` moved to well-known/app/ai/coding-agent/openclaw::cron-add-command.
  # Its matcher only recognizes a named product's scheduling surface, which is
  # a software identity, not persistence intent -- and at `crit: suspicious` it
  # reported OpenClaw's own dist/cron.js, the code that implements the feature.
  # The intent still comes from the composite below, which pairs that trait
  # with the autonomous task-pool message and the flag here.
  - id: cron-no-deliver-flag
    desc: Cron invocation suppresses normal delivery
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: --no-deliver

composite_rules:
  - id: node-remote-download-cron
    desc: Node installs recurring remote-download cron persistence
    crit: hostile
    conf: 0.99
    all:
      - id: node-crontab-pipe-install
      - id: node-cron-remote-curl
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
  - id: node-cron-node-launch-persistence
    desc: Node installs cron persistence for a launched Node process
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/persistence/system/cron/job::node-crontab-pipe-install
      - id: micro-behaviors/process/create/script/file::spawn-node-process
  - id: autonomous-remote-task-cron-persistence
    desc: Installs recurring autonomous remote task cron persistence
    crit: hostile
    conf: 0.99
    all:
      - id: autonomous-task-message
      - id: well-known/app/ai/coding-agent/openclaw::cron-add-command
      - id: cron-no-deliver-flag
    unless:
      # Grix uses OpenClaw's isolated, no-delivery cron facility for its
      # documented six-hour self-update check.
      - id: well-known/app/utility/grix::grix-auto-update-check
