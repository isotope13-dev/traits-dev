defaults:
  attack: T1053.003
  mbc: B0028
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: etc-cron-path
    desc: /etc/cron system cron path
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: \b/etc/cron(/|$)
    unless:
      - id: metadata/file/format/
      - id: metadata/file/catalog/identity/
      - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
      - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
  - id: elf-root-cron-network-script-install
    desc: ELF installs root cron network script
    crit: suspicious
    conf: 0.99
    for: [elf]
    platforms: [linux]
    if:
      type: yara
      source: |
        rule elf_root_cron_network_script_install {
          strings:
            $cron = /\*\/[1-9][0-9]?\s+\*\s+\*\s+\*\s+\*\s+root\s+\/[^\s'\"]{1,160}\/cron\.hourly\//
            $append = />>\s*\/etc\/crontab/
            $interfaces = /#!\/bin\/sh[\x00-\xff]{0,1200}\/proc\/net\/dev[\x00-\xff]{0,500}ifconfig/
            $library_copy = /cp\s+\/lib\/[A-Za-z0-9_.-]+\.so\s+\/lib\/[A-Za-z0-9_.-]+\.so\.[0-9]+/
          condition:
            all of them
        }
composite_rules:
  - id: cron
    desc: Reference to a system cron configuration path
    crit: notable
    conf: 0.66
    any:
      - id: etc-cron-path
      - id: micro-behaviors/fs/path/config/system::var-spool-cron-path
      - id: micro-behaviors/fs/path/config/system::cron-d-path-reference
    unless:
      # Unit tests name the operations under test; the file is a recognized test fixture.
      - id: metadata/package/testing/
      # BusyBox ships the crond implementation and its canonical spool paths;
      # their presence describes the applet, not installation of a cron job.
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
      - id: well-known/app/development/reg-devshell::developer-shell-application
      - id: "metadata/file/naming::test-directory-component"
  - id: periodic-cron-remote-shell-persistence
    desc: Periodic cron executes remote shell payload
    crit: hostile
    conf: 0.99
    attack: T1053.003,T1105,T1059.004
    platforms: [unix]
    near_bytes: 320
    all:
      - id: micro-behaviors/fs/path/config/system::cron-periodic-directory-path
      - id: micro-behaviors/fs/write/file/redirect::shell-periodic-cron-redirect-write
      - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
  - id: cron-source-query-ddos-bot
    desc: Cron reboot persistence with Source-query DDoS payload
    crit: hostile
    conf: 0.98
    attack: T1053.003,T1498.001
    mbc: B0030
    for: [elf]
    platforms: [linux, android]
    all:
      - id: micro-behaviors/os/autorun/cron::reboot-entry-reference
      - id: objectives/impact/dos/attack/flood::bypass-mode-name-cluster
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
    any:
      - id: micro-behaviors/os/autorun/cron::xor-decoded-root-reboot-entry
      - id: micro-behaviors/os/service/unit-field::native-unit-template
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      # The hidden root boot command plus writer is a more specific report
      # of this same cron mechanism; report flooding independently.
      - id: objectives/persistence/system/cron/job::native-root-reboot-hidden-stage
  - id: cron-preload-rootkit-persistence
    desc: Cron persists LD_PRELOAD rootkit
    crit: hostile
    conf: 0.98
    for: [elf, shell]
    all:
      - id: cron
      - id: objectives/evasion/hijack-execution-flow/preload::ld-preload-rootkit-persistence
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
