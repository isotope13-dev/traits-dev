defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1053.003,T1564.001

traits:
  # A complete recurring job loops over hidden files and re-installs cron.
  # Literal matching also sees commands embedded in non-shell launchers.
  - id: recurring-hidden-crontab-restore
    desc: Cron restores hidden crontab candidates
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      regex: '\* \* \* \* for \w+ in /.{0,240}/\..{0,240}\bcrontab +"?\$'
