defaults:
  for: [c, objective_c]
  platforms: [unix]
  attack: T1053.003,T1622

traits:
  - id: native-self-exec-cron-anti-debug-beacon
    desc: Cron persistence with debugger check and beacon
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_self_exec_cron_anti_debug_beacon {
          strings:
            $exe = "readlink(\"/proc/self/exe\""
            $cron = "crontab "
            $debug = "TracerPid:"
            $network = /connect[ \t]*\(/
            $send = /send[ \t]*\(/
          condition:
            all of them
        }
