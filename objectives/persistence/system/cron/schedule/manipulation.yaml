defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1053.003
traits:
  - id: base64-decode-command-pipe
    desc: Pipes base64 decode into a command
    crit: suspicious
    conf: 0.93
    for: [ruby]
    unless:
      - id: well-known/lib/ai/pyaigis::pyaigis-context
    if:
      type: text
      regex: '\|\s*base64\s+-d\s*\|'
composite_rules:
  - id: cron-base64-decode-exec
    desc: Cron installs a base64-decoded command
    crit: hostile
    conf: 0.96
    for: [ruby]
    near_lines: 8
    all:
      - id: base64-decode-command-pipe
      - id: micro-behaviors/os/autorun/cron::crontab-echo-pipe
  - id: cron-curl-pipe-shell-install
    desc: Cron installs a curl-to-shell command
    crit: hostile
    conf: 0.96
    for:
    - ruby
    - shell
    - python
    - perl
    near_lines: 8
    all:
    - id: micro-behaviors/os/autorun/cron::crontab-echo-pipe
    - id: micro-behaviors/os/autorun/cron::cron-curl-shell-entry
    unless:
    - id: well-known/tool/detection/agent-glovebox::archive-context
    - id: metadata/package/testing/corpus::inert-scanner-attack-corpus
  - id: cron-remote-watchdog-persistence
    desc: Filtered cron persistence with remote watchdog and process killing
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: micro-behaviors/os/autorun/cron::crontab-filtered-removal
      - id: micro-behaviors/os/autorun/cron::shell-crontab-entry-pipeline
      - id: micro-behaviors/communications/http/download/curl::curl-output-staging-path
      - id: micro-behaviors/process/terminate/command::pkill
