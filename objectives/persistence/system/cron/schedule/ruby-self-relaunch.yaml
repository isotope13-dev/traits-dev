# A Ruby script builds a command that reruns itself, installs crontab
# entries from a file with `crontab <file>`, and sends output to a hidden
# temp file.
defaults:
  for: [ruby]
  platforms: [unix]
  attack: T1053.003

composite_rules:
  - id: ruby-hidden-self-relaunch-cron-install
    desc: Installs cron job rerunning itself silently
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/cron/unspecified::crontab-file-install
      - id: micro-behaviors/fs/path/self::ruby-self-relaunch-command-string
    any:
      - id: micro-behaviors/fs/path/hidden::var-tmp-hidden
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-path

  # Appends a line rerunning this script straight into the cron spool.
  - id: ruby-cron-spool-self-relaunch-append
    desc: Appends self-relaunch line to cron spool
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/scheduled::var-spool-cron-path
      - id: micro-behaviors/fs/path/self::ruby-self-relaunch-command-string
    any:
      - id: micro-behaviors/fs/file/io-mode::ruby-write-append-mode
      - id: micro-behaviors/fs/file/io-mode::ruby-file-open-append-text
