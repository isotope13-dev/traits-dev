defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1053.003
traits:
  # Native droppers can embed their cron installer as a shell string.
  - id: embedded-root-cron-schedule
    desc: Embedded root cron schedule for hourly script
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\*/[0-9]+\s+\*\s+\*\s+\*\s+\*\s+root\s+/etc/cron\.hourly/'

  - id: cron-pidof-remote-restart
    desc: "Cron restarts proc with remote host argument"
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: "pidof -s %s.{0,80}then %s [0-9]{1,3}(\\.[0-9]{1,3}){3}"
  - id: cron-hidden-tmp-entry
    desc: Cron launches hidden tmp payload
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: \*/[0-9]{1,2} \* \* \* \* /tmp/\.
    unless:
    - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
    - id: micro-behaviors/metaprogramming/generation/source::configured-payload-generator
composite_rules:
  - id: embedded-root-cron-hourly-script-reinstall
    desc: Embedded command installs recurring root cron job
    crit: hostile
    conf: 0.97
    for: [elf]
    near_bytes: 700
    all:
      - id: micro-behaviors/fs/write/file/shell::sed-inplace-edit-command
      - id: embedded-root-cron-schedule
      - id: micro-behaviors/fs/path/config/scheduled::config-crontab

  - id: cron-encoded-remote-execution
    desc: Cron installs encoded remote shell payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/autorun/cron::cron-text-near-base64-decode
      - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec
  - id: cron-with-hidden
    desc: Cron with hidden file paths
    crit: suspicious
    near_lines: 20
    all:
    - id: micro-behaviors/os/autorun/cron::cron-reference-clues
    - id: cron-hidden-tmp-entry
    unless:
    - id: well-known/app/infrastructure/ansible::ansible-python-package-path
    - id: well-known/lib/ai/inspect-evals::eval-corpus-context
    - id: well-known/tool/detection/chkrootkit::source-tree
    - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
    - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
    - id: micro-behaviors/metaprogramming/generation/source::configured-payload-generator
  - id: system-cron-hidden-payload-stage
    desc: System cron drop-in fetches and arms a hidden payload
    crit: hostile
    conf: 0.98
    attack: T1053.003,T1105,T1222.002
    near_lines: 20
    all:
      - id: micro-behaviors/fs/path/config/scheduled::cron-d-path-reference
      - id: micro-behaviors/os/autorun/cron::source-cron-schedule-entry
      - id: micro-behaviors/os/autorun/cron::cron-download-command-reference
      - id: micro-behaviors/fs/path/hidden::tmp-hidden-file
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/ci/
      - id: metadata/path/directory::test-directory-component
  - id: cron-implant-redundant-root-access
    desc: Cron implant accompanies SSH-key and sudoers root backdoors
    crit: hostile
    conf: 0.99
    attack: T1053.003,T1098.004,T1548.003
    all:
      - id: system-cron-hidden-payload-stage
      - id: objectives/persistence/login/ssh/backdoor::hardcoded-root-authorized-key
      - id: micro-behaviors/fs/config/sudo::installs-unrestricted-sudoers-dropin
  - id: cron-hidden
    desc: Hidden or obfuscated cron entries
    crit: suspicious
    conf: 0.8
    any:
      - id: micro-behaviors/os/autorun/cron::cron-text-near-base64-decode
      - id: cron-with-hidden
    unless:
      - id: well-known/app/utility/cmdchamp/
  - id: cron-remote-payload-persistence
    desc: Cron self-restart persistence for remote payload
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/autorun/cron::cron-download-command-reference
      - id: cron-pidof-remote-restart
    any:
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: micro-behaviors/communications/url/host/oob-http::curl-wget-ipv4-url
  - id: hidden-cron-self-restart-persistence
    desc: Hidden cron persistence with self-restarting payload
    crit: hostile
    conf: 0.98
    mbc: B0030
    platforms: [linux]
    for: [elf]
    all:
      - id: cron-with-hidden
      - id: micro-behaviors/os/autorun/cron::crontab-option
      - id: micro-behaviors/fs/path/config/scheduled::var-spool-cron-path
      - id: micro-behaviors/os/service/config::systemd-keyword
