defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1053,T1505
  mbc: F0012
composite_rules:
  - id: php-wp-cron-hook-evals-decoded-code
    desc: WP-Cron hook evals Base64 code supplied at runtime
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/time/schedule/wordpress::wp-schedule-event
      - id: micro-behaviors/data/decode/base64/call::php-base64-decode-call
      - id: micro-behaviors/process/interpreter/eval/constructed::php-eval-function-wrapped-source
    near_bytes: 1600
