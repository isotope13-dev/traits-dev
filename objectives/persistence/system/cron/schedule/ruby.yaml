defaults:
  for: [ruby]
  platforms: [unix]
  attack: T1053.003

traits:
  - id: ruby-minute-download-shell-entry
    desc: Ruby cron entry downloads shell commands
    crit: suspicious
    conf: 0.98
    if:
      type: string_literal
      regex: '^\s*(\* +){5}(curl|wget)\s+[^\n|]{0,200}https?://[^\n|]+\|\s*(ba)?sh\b'

  - id: ruby-bound-recurring-shell-installer
    desc: Ruby binds remote shell cron installer
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (body_statement
          (assignment left: (identifier) @entry right: (string) @schedule)
          (unless consequence: (then
            (assignment left: (identifier) @command right: (string
              (interpolation (identifier) @entry_use)) @installer)
            (subshell (interpolation (identifier) @command_use))))
          (#eq? @entry @entry_use) (#eq? @command @command_use)
          (#match? @schedule "[*] [*] [*] [*] [*] curl[^\\n]*https?://[^\\n]*[|] *bash")
          (#match? @installer "^\"echo .* [|] *crontab -\"$")) @install

composite_rules:
  - id: ruby-recurring-remote-shell-install
    desc: Ruby installs recurring remote shell commands
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-bound-recurring-shell-installer
      - id: micro-behaviors/os/autorun/cron::shell-stdin-install
