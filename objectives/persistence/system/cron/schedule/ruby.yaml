defaults:
  for: [ruby]
  platforms: [unix]
  attack: T1053.003

traits:
  - id: ruby-minute-download-shell-entry
    desc: Ruby cron entry downloads shell commands
    crit: suspicious
    conf: 0.98
    if:
      type: string_literal
      regex: '^\s*(\* +){5}(curl|wget)\s+[^\n|]{0,200}https?://[^\n|]+\|\s*(ba)?sh\b'

composite_rules:
  - id: ruby-recurring-remote-shell-install
    desc: Ruby installs recurring remote shell execution
    crit: hostile
    conf: 0.98
    near_lines: 8
    all:
      - id: ruby-minute-download-shell-entry
      - id: micro-behaviors/os/autorun/cron::crontab-echo-pipe
