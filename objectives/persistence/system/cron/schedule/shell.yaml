# Cron Persistence Detection for Shell Scripts
# Detects shell scripts that establish persistence via crontab
# ATT&CK: T1053.003 (Scheduled Task/Job: Cron)
# MBC: B0030 (Persistence)
defaults:
  platforms: [unix, android, ios]
  crit: suspicious
  attack: "T1053.003"
  mbc: "B0030"
  for: [shell]
traits:
  # === Crontab Manipulation ===
  - id: crontab-with-curl-wget
    desc: Crontab with download and execute
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Matches crontab entries containing curl/wget piped to sh/shell
      regex: 'crontab[^\r\n;]{0,50}(curl|wget)[^\r\n|]{0,50}\|\s*(sh|shell)'
  - id: direct-user-cron-spool-redirection
    desc: Shell redirects output to user cron spool
    crit: suspicious
    conf: 0.97
    if:
      type: text
      # Anchor executable shell syntax so prose and path inventories do not
      # become persistence findings.
      regex: '(?m)^[ \t]*(printf|echo)\b[^\n]{0,500}>>?[ \t]*["'']?/var/spool/cron(/crontabs)?/'
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/tooling::proxmoxve-community-scripts
  - id: direct-user-cron-spool-tee
    desc: Shell tees output into user cron spool
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?m)\btee([ \t]+-a)?[ \t]+["'']?/var/spool/cron(/crontabs)?/'
    unless:
      - id: metadata/package/testing/
composite_rules:
  # Cron persistence with remote payload (shell scripts)
  # Pattern: adds crontab entry that downloads and executes from remote URL
  # Complexity: all(4) + for(1) = 5 >= 4 ✓ HOSTILE
  - id: cron-shell-download-execute
    desc: Cron persistence with download-execute (shell)
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/cron::shell-crontab-entry-pipeline
      - id: crontab-with-curl-wget
      - id: micro-behaviors/os/autorun/cron::crontab-sed-filter
      - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec
  - id: direct-user-cron-spool-write
    desc: Shell writes directly to user cron spool
    crit: suspicious
    conf: 0.97
    any:
      - id: direct-user-cron-spool-redirection
      - id: direct-user-cron-spool-tee
  - id: shell-hidden-tmp-cron-persistence
    desc: Shell hidden tmp cron persistence
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/autorun/cron::shell-crontab-entry-pipeline
      - id: objectives/persistence/system/cron/schedule::cron-hidden-tmp-entry
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
  - id: shell-hidden-xdg-cron-persistence
    desc: Cron persists executable in hidden XDG data subdirectory
    crit: hostile
    conf: 0.98
    attack: T1053.003,T1564.001,T1222.002
    near_lines: 8
    all:
      - id: micro-behaviors/os/autorun/cron::shell-crontab-entry-pipeline
      - id: micro-behaviors/fs/path/location::xdg-data-hidden-subdir-path
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-home-executable
  - id: direct-spool-hidden-xdg-persistence
    desc: Direct cron-spool write persists hidden user payload
    crit: hostile
    conf: 0.99
    attack: T1053.003,T1564.001
    near_lines: 20
    all:
      - id: direct-user-cron-spool-write
      - id: micro-behaviors/os/autorun/cron::recurring-minute-cron-command-literal
      - id: micro-behaviors/fs/path/location::xdg-data-hidden-subdir-path
  - id: shell-hidden-base64-detached-cron-persistence
    desc: Shell installs a recurring decoded agent and launches it detached
    crit: hostile
    conf: 0.98
    attack: T1053.003,T1027,T1564.001
    all:
      - id: micro-behaviors/os/autorun/cron::shell-crontab-entry-pipeline
      - id: cron-with-base64
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
    unless:
      - id: well-known/app/utility/cmdchamp/
  - id: cron-remote-shell-persistence
    desc: Cron installs remote shell persistence
    crit: hostile
    conf: 0.99
    attack: T1053.003,T1105,T1059.004
    near_lines: 8
    all:
      - id: micro-behaviors/os/autorun/cron::shell-cron-schedule-entry
      - id: micro-behaviors/os/autorun/cron::crontab-string
      - id: micro-behaviors/os/autorun/cron::crontab-echo-pipe
      - id: micro-behaviors/os/autorun/cron::cron-entry-downloader-shell

  - id: shell-cron-pipeline-payload-persistence
    desc: Cron pipeline persists recurring armed payload
    crit: hostile
    conf: 0.98
    near_lines: 16
    all:
      - id: micro-behaviors/os/autorun/cron::recurring-minute-cron-command-literal
      - id: micro-behaviors/fs/chmod/executable/mode
    any:
      - id: micro-behaviors/os/autorun/cron::shell-crontab-entry-pipeline
      - id: direct-user-cron-spool-write
      - id: micro-behaviors/os/autorun/cron::crontab-append-pipeline
    unless:
      # Quiz answer banks grade cron one-liners as literal strings.
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: objectives/persistence/system/cron/schedule::user-confirmed-idempotent-cron-registration
      # EC2 userdata bootstrapping schedules the instance's own health checks
      # the same way attackers schedule payloads; the provisioning plumbing
      # (IMDS + cfn-signal / userdata staging) is the discriminator.
      - id: metadata/build/recognized-contexts::ec2-userdata-shell-provisioning
