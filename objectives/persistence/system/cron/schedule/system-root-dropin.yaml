# Hostile uses of a system cron drop-in that runs a command as root.
#
# Two independent convictions, each keyed on the root-user-field entry:
#  * Delivery: a path-traversal string that climbs into /etc/cron.d planting
#    the entry. No software legitimately writes a cron drop-in through
#    `../../../`; this is the Synametrics Syncrify PublicLink class and any
#    future "service tricked into writing under cron via traversal" variant.
#  * Payload: the root entry's command is a reverse shell or a pipe-to-shell
#    downloader — a root-level backdoor on every schedule boundary.
defaults:
  platforms: [unix]
  for: [shell, scripts, source, python]
  attack: T1053.003
  mbc: B0030

composite_rules:
  - id: traversal-planted-root-cron-dropin
    desc: Path traversal plants a root cron drop-in
    crit: hostile
    conf: 0.97
    attack: T1053.003,T1068,T1574
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/traversal::traversal-into-cron-d-path
      - id: micro-behaviors/os/autorun/cron::system-cron-root-user-field-entry
    unless:
      # Regression tests quote the traversal PoC and assert it is rejected.
      - id: metadata/file/naming::test-directory-component

  - id: system-cron-root-remote-shell-dropin
    desc: Root cron drop-in runs a reverse or download shell
    crit: hostile
    conf: 0.96
    attack: T1053.003,T1059.004,T1105
    near_lines: 25
    all:
      - id: micro-behaviors/os/autorun/cron::system-cron-root-user-field-entry
    any:
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-path
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-sh-text
      - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec
    unless:
      - id: metadata/package/testing/corpus::pytest-command-classifier-case-table
