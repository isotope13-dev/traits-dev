# Hostile uses of a system cron drop-in that runs a command as root.
#
# Two independent convictions, each keyed on the root-user-field entry:
#  * Delivery: a path-traversal string that climbs into /etc/cron.d planting
#    the entry. No software legitimately writes a cron drop-in through
#    `../../../`; this is the Synametrics Syncrify PublicLink class and any
#    future "service tricked into writing under cron via traversal" variant.
#  * Payload: the root entry's command is a reverse shell or a pipe-to-shell
#    downloader — a root-level backdoor on every schedule boundary.
defaults:
  platforms: [unix]
  for: [shell, scripts, source, python]
  attack: T1053.003
  mbc: B0030

composite_rules:
  - id: traversal-planted-root-cron-dropin
    desc: Path traversal plants a root cron drop-in
    crit: hostile
    conf: 0.97
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/traversal::traversal-into-cron-d-path
      - id: micro-behaviors/os/autorun/cron::system-cron-root-user-field-entry
    unless:
      # Require actual harness content; a collector's testdata directory is
      # not evidence that a planted cron payload is a regression test.
      - id: metadata/package/testing/presence/harness::python-test-file-content
      - id: metadata/package/testing/presence/harness::go-test-main
      - id: rust-archive-traversal-test-fixture
      - id: well-known/tool/offensive/claude-bughunter::claude-bughunter-skill-context

  - id: system-cron-root-remote-shell-dropin
    desc: Root cron launches remote shell
    crit: hostile
    conf: 0.96
    attack: T1053.003,T1059.004,T1105
    # All legs must be on the cron command's line. A wider file-level window
    # joined a legitimate root maintenance cron entry to unrelated curl | bash
    # installer commands elsewhere in setup scripts.
    near_lines: 0
    all:
      - id: micro-behaviors/os/autorun/cron::system-cron-root-user-field-entry
    any:
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-path
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-sh-text
      - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec
    unless:
      - id: metadata/package/testing/corpus::pytest-command-classifier-case-table
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component

  # A Rust regression test may deliberately build a rejected archive whose
  # member path and content resemble a planted cron drop-in. Require the test
  # harness plus archive writer and the matching dangerous fixture before
  # treating that co-occurrence as inert test input.
  - id: rust-archive-traversal-test-fixture
    desc: Rust test constructs an archive with a root cron traversal fixture
    crit: exception
    conf: 0.98
    for: [rust]
    platforms: [unix, windows]
    all:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: micro-behaviors/fs/path/traversal::traversal-into-cron-d-path
      - id: micro-behaviors/os/autorun/cron::system-cron-root-user-field-entry
      - id: metadata/package/testing/harness/unit::rust-test-builds-archive-entry
