defaults:
  platforms:
    - unix
    - android
    - ios
  crit: suspicious
  attack: T1053.003
  mbc: B0030
  for: [scripts, binaries]
composite_rules:
  - id: elf-cron-scheduled
    desc: ELF with cron scheduling
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/autorun/scheduled::crontab-string
      - id: micro-behaviors/os/autorun/scheduled::crontab-schedule-format
  - id: cron-tempfile-installer
    desc: Cron persistence via temp-file install (C-code pattern)
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/autorun/scheduled::crontab-string
      - id: micro-behaviors/os/autorun/scheduled::crontab-file-install
    any:
      - id: micro-behaviors/os/autorun/scheduled::crontab-wildcard-entry
      - id: micro-behaviors/os/autorun/scheduled::crontab-schedule-format
      - id: micro-behaviors/process/create/shell/spawn::system-fn
