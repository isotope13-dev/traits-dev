defaults:
  conf: 0.9
  platforms:
    - unix
    - android
    - ios
  crit: suspicious
  attack: T1053.003
  mbc: B0030
  for: [scripts, binaries]
composite_rules:
  - id: elf-cron-scheduled
    for: [shell, python, ruby, perl]
    desc: ELF with cron scheduling
    crit: suspicious
    all:
      - id: micro-behaviors/os/autorun/cron::crontab-string
      - id: micro-behaviors/os/autorun/cron::crontab-schedule-format
