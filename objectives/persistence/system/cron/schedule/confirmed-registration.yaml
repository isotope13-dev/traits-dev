# A setup wizard that asks before it schedules, and replaces its own earlier
# entry instead of stacking another: `read -p` for consent, then
# `crontab -l | grep -v <own script> > tmp; crontab tmp`. A persistence
# implant does not ask the victim, so the pair marks an installer registering
# its documented poller, not a payload arming itself.
defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: user-confirmed-idempotent-cron-registration
    desc: Prompted installer rewrites its own cron entry
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/ui/dialog/prompt::shell-read-prompt-input
      - id: micro-behaviors/os/autorun/cron::crontab-list-filtered-to-file
