defaults:
  platforms: [openwrt]
  for: [scripts, source, elf, pyc, -perl]

composite_rules:
  - id: openwrt-root-cron-hidden-tmp-payload
    desc: OpenWrt root crontab schedules a hidden tmp payload
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/system::openwrt-root-crontab-path
      # Enabling a normal init.d service does not establish concealment.
      - id: objectives/persistence/system/cron/schedule::cron-hidden-tmp-entry
    attack: T1053.003
    near_lines: 10
    unless:
      - id: well-known/tool/sysadmin/openwrt/passwall/

