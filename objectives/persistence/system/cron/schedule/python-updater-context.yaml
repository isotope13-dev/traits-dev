defaults:
  platforms: [unix]
  for: [python, pyc]
composite_rules:
  - id: python-user-managed-updater-scheduler
    desc: User-managed daily updater scheduler context
    crit: exception
    conf: 0.96
    all:
      - id: objectives/persistence/system/cron/job::python-daily-updater-schedule-message
    any:
      - id: metadata/lang/source/syntax/declaration::python-cancel-scheduled-definition
      - id: objectives/persistence/system/cron/job::python-pyc-cancel-scheduled-update
