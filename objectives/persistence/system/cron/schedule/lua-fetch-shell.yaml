defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
composite_rules:
  - id: "lua-covert-scheduled-fetch-shell"
    desc: "Lua schedules a shell fetch alongside security-service disabling"
    crit: "hostile"
    conf: 0.97
    all:
      - id: "micro-behaviors/os/autorun/cron/unspecified::lua-crontab-pipeline-command"
      - id: "micro-behaviors/os/autorun/cron/unspecified::lua-recurring-fetch-shell-command"
      - id: "micro-behaviors/os/autorun/cron/unspecified::lua-fetch-shell-pipe-fragment"
      - id: "objectives/evasion/security-bypass/disable-service::lua-disables-auditing-and-tpm"
