# The dynamic PoC keeps its target, schedule and command in separate arguments.
# Do not pretend these separate facts prove a literal root-user job or data flow.
defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1053.003

composite_rules:
  - id: binary-traversal-upload-cron-schedule
    desc: Binary traversal upload with cron schedule
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/post::binary-post-parent-path-cooccurrence
      - id: micro-behaviors/fs/path/config/system::cron-d-path-reference
      - id: micro-behaviors/os/autorun/cron::cron-schedule-fields-literal
