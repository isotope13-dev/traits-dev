defaults:
  platforms: [windows]
  for: [scripts, source]
  attack: T1546
composite_rules:
- id: postinstall-url-protocol-handler
  desc: npm install registers URL protocol handler
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/registry/association::url-protocol-handler-registration
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  any:
  - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
  - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
