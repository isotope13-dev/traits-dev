defaults:
  platforms: [windows]
  for: [scripts, source]
  attack: T1546
composite_rules:
  - id: url-protocol-handler-registration
    for: [scripts, '!applescript', '!jcl', '!shell', c, csharp, go, rust]
    desc: Windows URL protocol handler registration
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/registry/manipulate::hkcu-software-classes-path
      - id: micro-behaviors/os/registry/manipulate::url-protocol-registry-value
      - id: micro-behaviors/os/registry/manipulate::shell-open-command-key
  - id: postinstall-url-protocol-handler
    desc: npm install registers URL protocol handler
    crit: suspicious
    conf: 0.9
    all:
      - id: url-protocol-handler-registration
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-postinstall
    any:
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec
  - id: run-key-explorer-custom-uri-handler
    desc: Explorer Run key invokes custom URI handler
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1546
    near_lines: 10
    all:
      - id: url-protocol-handler-registration
      - id: objectives/persistence/login/registry/autostart::currentversion-run-key-path
      - id: micro-behaviors/process/create/shellexec::explorer-custom-uri-launch
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
