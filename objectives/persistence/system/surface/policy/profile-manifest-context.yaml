# Apple configuration-profile editors (iMazing Profile Editor, ProfileManifests)
# ship one schema plist per payload type. Each describes a payload's keys
# (`pfm_domain`, `pfm_subkeys`) and names the payload domains that a managed
# login-items, PPPC, certificate or loginwindow-script payload would carry --
# the schema documents the payload, it deploys none. The app's code-seal
# plist (metadata/binary/signing::coderesources-plist) lists those same manifest
# filenames as hash-table keys.
defaults:
  platforms: [macos]
  for: [plist, xml]
  crit: notable
  conf: 0.95

traits:
  - id: profile-manifest-schema-key
    desc: Profile payload manifest schema key
    if:
      type: text
      regex: '<key>pfm_(domain|subkeys)</key>'

