defaults:
  crit: suspicious
  platforms: [macos]
  for: [scripts, binaries]
  attack: T1547
traits:
- id: managed-login-items-payload
  desc: Managed Login Items payload
  crit: suspicious
  conf: 0.88
  for: [plist, xml]
  if:
    type: text
    regex: 'com\.apple\.servicemanagement|Managed Login Items'
  exempt:
    unverified-signature-suppressor: Cites code-signature bundle structure, not a signer.
  unless:
  - id: metadata/file/format/apple-configuration-profile::profile-manifest-schema-key
  - id: metadata/signature/resource::coderesources-plist
- id: declarative-background-task
  desc: Declarative managed background task
  crit: suspicious
  conf: 0.84
  for: [plist, xml]
  if:
    type: text
    regex: 'Declarative Device Management|Managed background task|backgroundtaskmanagementagent'
  exempt:
    unverified-signature-suppressor: Cites code-signature bundle structure, not a signer.
  unless:
  - id: metadata/file/format/apple-configuration-profile::profile-manifest-schema-key
  - id: metadata/signature/resource::coderesources-plist
- id: mdm-pppc-payload
  desc: MDM PPPC payload
  crit: suspicious
  conf: 0.88
  for: [plist, xml]
  if:
    type: text
    regex: 'PrivacyPreferencesPolicyControl|com\.apple\.TCC\.configuration-profile-policy'
  exempt:
    unverified-signature-suppressor: Cites code-signature bundle structure, not a signer.
  unless:
  - id: metadata/file/format/apple-configuration-profile::profile-manifest-schema-key
  - id: metadata/signature/resource::coderesources-plist
  - id: well-known/tool/detection/google-santa::source-tree
- id: mdm-certificate-payload
  desc: MDM certificate payload
  crit: notable
  conf: 0.82
  for: [plist, xml]
  if:
    type: text
    regex: 'com\.apple\.security\.root|PayloadType.{0,80}com\.apple\.security'
