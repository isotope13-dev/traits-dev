# macOS persistence surfaces inspired by the macOS Persistence Cheatsheet.
# Atoms here are objective-level because each names a durable persistence
# location, policy surface, or registration mechanism.
defaults:
  platforms: [macos]
  for: [scripts, binaries]
  attack: T1547
traits:
- id: btm-store
  desc: Background task store or inspection command
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: 'BackgroundItems-v[0-9]+\.btm|sfltool\s+dumpbtm'
- id: privileged-helper-tools-install
  desc: Installs into macOS privileged helper directory
  crit: suspicious
  conf: 0.9
  attack: T1543.004
  if:
    type: text
    regex: '(?im)^[ \t]*(cp|install|mv|ditto)\b[^\n]{0,100}/Library/PrivilegedHelperTools'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: well-known/app/system/ukelele::ukelele-release-member
  - type: text
    substr: '"/Library/PreferencePanes"'
  - id: well-known/tool/sysadmin/opencore::opencore-nvram-launchd-helper
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
- id: remote-login-enabled
  desc: Remote Login command or access group reference
  crit: notable
  conf: 0.84
  attack: T1021.004
  # Restrict the command-string detector to command-oriented files. Python
  # hook/test sources commonly embed this command as data without enabling
  # Remote Login; those sources need a structured process-call rule instead.
  # The systemsetup alternative must sit at a shell command boundary. A
  # quoted instruction ("`sudo systemsetup -setremotelogin on` — done by a
  # person") names the command without running it.
  for: [shell]
  if:
    type: text
    regex: '(\n|[;&|])\s*(sudo\s+)?systemsetup\s+-setremotelogin\s+on|com\.apple\.access_ssh'
- id: atrun-command
  desc: Invokes the macOS atrun scheduler service
  crit: notable
  conf: 0.86
  attack: T1053
  if:
    type: text
    regex: '(?i)(^|[;&|])\s*(/usr/sbin/)?atrun(\s|$)'
- id: at-schedule-command
  desc: Schedules a command with macOS at
  crit: suspicious
  conf: 0.86
  # `at HH:MM` is shell command syntax; timestamps in prose or markdown
  # are not scheduler invocations.
  for: [shell]
  attack: T1053
  if:
    type: text
    regex: '(^|[;&|])\s*at\s+[0-9]{1,2}:[0-9]{2}\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - type: basename
    regex: '(?i)\.md$'
- id: periodic-job-path--rx-7
  desc: Writes into an /etc/periodic schedule directory
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\b(cp|mv|install|mkdir|touch|tee|cat|ln)\b.{0,60}/etc/periodic/(daily|weekly|monthly)'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: periodic-job-path--rx-8
  desc: Writes to /usr/libexec/periodic
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?i)\b(cp|mv|install|mkdir|touch|tee|cat|ln)\b.{0,40}/usr/libexec/periodic'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: calendar-alert-script-fragment
  desc: Calendar alert script marker
  crit: notable
  conf: 0.84
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - type: basename
    regex: '.{0,50}[-_.]tests?\.(c|m)?[jt]sx?(\.snap)?$'
  if:
    type: text
    regex: 'Calendar[/ ].{0,40}(Alert|Script)'
- id: system-extension-persistence--activation-api
  desc: macOS system extension activation API
  crit: notable
  conf: 0.88
  if:
    type: text
    # The type name alone is a comment or a delegate signature. Persistence
    # is the activation request constructor.
    substr: activationRequestForExtension
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/lang/scripted::dts-declaration-file
- id: application-startup-script--rx-16
  desc: 'Matches ''Contents/Resources/Scripts/(sh scpt'''
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: 'Contents/Resources/Scripts/[^\s]{1,120}\.(sh|scpt|js|py)'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: app-preference-trigger
  desc: App preference trigger persistence
  crit: suspicious
  conf: 0.82
  if:
    type: text
    # Stay inside one string. .{0,120} glued a windowserver plist read to the
    # next string-table entry escapePath, and Path matched that suffix.
    regex: 'Preferences/[A-Za-z0-9_.-]+\.plist[^\r\n'']{0,80}\b(Script|Path|Command|Executable)\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: launchservices-handler--rx-18
  desc: 'Matches ''CFBundleDocumentTypes'''
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: CFBundleDocumentTypes
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: launchservices-handler--rx-19
  desc: 'Matches ''LSHandlers'''
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: LSHandlers
  unless:
  - type: text
    substr: LSHandlerRoleAll
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: installer-package-script
  desc: installer package script hook
  crit: notable
  conf: 0.86
  attack: T1546.016
  # macOS Installer (.pkg) flat-package layout runs `Scripts/preinstall` and
  # `Scripts/postinstall` as root at install time (T1546.016). Anchor on that
  # path form: a bare `postinstall` word also matches the npm package.json
  # lifecycle key, an unrelated mechanism already covered by
  # supply-chain/install-hook.
  if:
    type: text
    regex: 'Scripts/(preinstall|postinstall)'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: folder-action-script
  desc: Folder Action script or dispatcher reference
  crit: notable
  conf: 0.88
  attack: T1546
  if:
    type: text
    regex: 'Folder Action Scripts|FolderActionsDispatcher|com\.apple\.FolderActions'
  unless:
  # Apple Finder / system services manage Folder Actions; references in
  # platform binaries are the host surface, not attacker persistence.
  - id: metadata/signature/verified/platform::apple
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: automator-service-workflow
  desc: References Automator workflow bundle
  crit: notable
  conf: 0.84
  if:
    type: text
    # Require an installed Services workflow path. A bare Automator SDK
    # identifier (for example kAutomatorWorkflowsFolderType) is not a
    # persistence surface.
    regex: '(/Users/[^/\s]{1,80}/Library/Services|/Library/Services)/[^\s]{1,120}\.workflow\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: mail-applescript-rule
  desc: Mail AppleScript rule
  crit: suspicious
  conf: 0.88
  attack: T1546
  if:
    type: text
    regex: 'SyncedRules\.plist|RulesActiveState\.plist|Apply AppleScript'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: dyld-lsenvironment-injection
  desc: Plist LSEnvironment injects DYLD library
  crit: suspicious
  conf: 0.9
  attack: T1574.006
  for: [plist]
  if:
    type: value
    path: LSEnvironment.DYLD_INSERT_LIBRARIES
    exists: true
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: well-known/lib/native/onetbb::source-context
  - id: well-known/tool/development/ci/rules-apple::rules-apple-xctestrun-context
- id: startupitems-path
  desc: StartupItems legacy persistence
  crit: suspicious
  conf: 0.88
  attack: T1037.005
  if:
    type: text
    regex: '(?i)\b(cp|install|ln|mv)\s+.{0,50}Library/StartupItems'

composite_rules:
- id: macos-persistence-surface
  desc: macOS persistence surface
  crit: notable
  conf: 0.84
  any:
  - id: btm-store
  - id: smappservice-api
  - id: privileged-helper-tools-install
  - id: micro-behaviors/fs/path/application/plugin::security-agent-plugins-path
  - id: micro-behaviors/os/user/modify::macos-hidden-account-flag
  - id: remote-login-enabled
  - id: micro-behaviors/fs/path/config/scheduled::bsd-at-job-spool-path
  - id: atrun-command
  - id: at-schedule-command
  - id: periodic-job-path
  - id: micro-behaviors/fs/path/config/autorun::emond-rule-path
  - id: calendar-alert-script
  - id: system-extension-persistence
  - id: micro-behaviors/fs/path/extension::user-kext-path-reference
  - id: objectives/persistence/system/surface/extension
  - id: application-startup-script
  - id: app-preference-trigger
  - id: launchservices-handler
  - id: installer-package-script
  - id: folder-action-script
  - id: automator-service-workflow
  - id: mail-applescript-rule
  - id: startupitems-path
  - id: micro-behaviors/fs/path/config/system::macos-rc-script-path
  - id: metadata/file/format/structured::configuration-profile
  - id: objectives/persistence/system/surface/policy::managed-login-items-payload
  - id: objectives/persistence/system/surface/policy::declarative-background-task
  downgrade:
    any:
    - id: metadata/signature/verified/developer/
- id: non-apple-high-value-persistence
  desc: Non-Apple high-value persistence
  crit: suspicious
  conf: 0.88
  any:
  - id: privileged-helper-tools-install
  - id: system-extension-persistence
  - id: dyld-lsenvironment-injection
  - id: objectives/persistence/system/surface/policy::mdm-pppc-payload
  # Developer-ID signed hosts install helpers and extensions through
  # these same surfaces as their intended function; keep them notable
  # (as in macos-persistence-surface) rather than suspicious.
  downgrade:
    any:
    - id: metadata/signature/verified/developer/
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/signature/verified/platform::apple
  - id: well-known/app/system/ukelele::ukelele-release-member
  - id: well-known/tool/detection/google-santa::source-tree
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
- id: applescript-persistence
  desc: AppleScript alongside macOS autorun management
  crit: notable
  conf: 0.9
  all:
  - id: macos-persistence-surface
  any:
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-dup
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-exec
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-jxa
  - id: micro-behaviors/process/deploy/interpreter-stdin/input::osascript-stdin
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-do-shell-script-var
  - id: micro-behaviors/process/create/shell/command-string::sysoexec-string
  - id: micro-behaviors/os/module/load/path::sysoload-string
  - id: micro-behaviors/time/sleep/interval::sysodela-string
  - id: micro-behaviors/os/application/target/system::ref-terminal
  - id: micro-behaviors/fs/path/application/interpreter::osascript-binary-ref
  - id: micro-behaviors/process/create/shell/command-string::do-shell-script-binary
  - id: micro-behaviors/fs/delete/command::do-shell-rm-binary
  - id: micro-behaviors/process/create/shell/command-string::applescript-set-domain
  - id: metadata/lang/source/syntax/declaration::applescript-on-handler-binary
  - id: micro-behaviors/process/deploy/interpreter-stdin/input::pipe-osascript
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-shell
  - id: micro-behaviors/os/application/target/system::osascript-settings-reference
  - id: micro-behaviors/process/interpreter/scripting::osascript-title
  - id: micro-behaviors/process/interpreter/scripting::osascript-upper
  - id: micro-behaviors/process/interpreter/scripting::osascript-keyword
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-reference-and-execsync
  - id: micro-behaviors/process/interpreter/scripting::node-applescript
  - id: micro-behaviors/process/daemonize/devnull::background-shell-launch
  - id: micro-behaviors/process/create/shell/command-string::do-shell-script-web-text
  - id: objectives/execution/staging/transfer::osascript-curl-command-substitution
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-e-echo-cmdsubst
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-e-base64-decode
  - id: well-known/lib/platform/apple-foundation::nsapplescript-class-reference
  - id: metadata/binary/symbols/name/function::objc-execute-return-error-selector
  - id: micro-behaviors/process/interpreter/scripting::nsapplescript-in-process-exec
  - id: well-known/lib/platform/applescript-node::require-applescript-single
  - id: well-known/lib/platform/applescript-node::require-applescript-double
  - id: well-known/lib/platform/node-osascript::node-osascript-library
  - id: well-known/lib/platform/run-applescript::run-applescript-library
  - id: micro-behaviors/process/interpreter/scripting::node-applescript-library-reference
  - id: micro-behaviors/os/application/automation::applescript-automation-evidence
  - id: mail-applescript-rule
  - id: folder-action-script
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: objectives/supply-chain/trojanized/app/debug-probe/
  - id: micro-behaviors/os/sysinfo/platform/browser::launchservices-default-browser-read
  - id: well-known/app/productivity/password-store::applescript-example-helper
- id: calendar-alert-script
  desc: Calendar alert script hook
  crit: suspicious
  conf: 0.88
  all:
  - id: calendar-alert-script-fragment
  - id: micro-behaviors/os/application/target/productivity::apple-calendar-bundle-id
  near_bytes: 200
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: objectives/supply-chain/trojanized/app/debug-probe/
- id: smappservice-api
  desc: ServiceManagement login item API
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/autorun/login-items::smappservice-import
  - id: micro-behaviors/os/autorun/login-items::sm-login-item-set-enabled-call
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: periodic-job-path
  desc: periodic job persistence path
  crit: notable
  conf: 0.88
  attack: T1053
  any:
  - id: periodic-job-path--rx-7
  - id: periodic-job-path--rx-8
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: system-extension-persistence
  desc: System Extension persistence
  crit: suspicious
  conf: 0.88
  any:
  - id: system-extension-persistence--activation-api
  # The activation API is the intended install path for a system extension:
  # a Developer-ID or platform-signed host still needs the sysext
  # entitlement and user approval in System Settings. Signed hosts keep
  # the notable activation-API observation without the suspicious
  # persistence reading; unsigned or ad-hoc activation stays suspicious.
  downgrade:
    any:
    - id: metadata/signature/verified/developer/
  unless:
  - id: metadata/file/extension/identity::declaration-file-extension
  - id: metadata/lang/upstream::macos-framework-symbol-bind
- id: application-startup-script
  desc: Application startup script persistence
  crit: notable
  conf: 0.82
  any:
  - id: application-startup-script--rx-16
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: launchservices-handler
  desc: LaunchServices handler registration
  crit: notable
  conf: 0.86
  attack: T1546
  for: [plist]
  any:
  - id: metadata/lang/source/naming/setting::ios-url-types-config
  - id: launchservices-handler--rx-18
  - id: launchservices-handler--rx-19
  - id: micro-behaviors/data/config/schema::launchservices-url-scheme-key
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: objectives/supply-chain/trojanized/app/debug-probe/
  - id: micro-behaviors/os/sysinfo/platform/browser::launchservices-default-browser-read
- id: macos-root-kext-remote-login
  desc: Enables root kext and remote login
  crit: hostile
  conf: 0.97
  for: [zip, dmg, shell, macho]
  scope: archive
  all:
  - id: objectives/discovery/account/enum::dsenableroot
  - id: micro-behaviors/fs/path/extension::user-kext-path-reference
  - id: remote-login-enabled
