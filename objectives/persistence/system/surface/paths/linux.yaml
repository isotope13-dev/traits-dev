# Linux persistence surfaces that are not specific to cron, systemd services,
# SysV init, XDG autostart, or SSH authorized_keys.
defaults:
  platforms: [linux]
  for: [scripts, binaries]
  attack: T1547
traits:
- id: sysv-runlevel-start-link-path
  desc: References a SysV runlevel startup-link path
  crit: notable
  conf: 0.94
  attack: T1037.004
  for: [c, cpp, elf, shell, python, javascript, go, rust]
  if:
    type: string_literal
    regex: '^/etc/rc(%[diu]|[2-5])\.d/S[0-9]{2}[A-Za-z0-9._+-]{1,64}$'

- id: polkit-rules-path
  desc: Polkit rules persistence path
  crit: notable
  conf: 0.86
  attack: T1548
  if:
    type: text
    regex: '/(etc|usr/share)/polkit-1/rules\.d/[^\s"]{1,120}\.rules([\s")''>;,]|$)'

- id: polkit-add-rule
  desc: Polkit addRule policy hook
  crit: notable
  conf: 0.88
  attack: T1548
  if:
    type: text
    substr: polkit.addRule

- id: dbus-exec-directive
  desc: D-Bus service Exec directive
  crit: notable
  conf: 0.82
  attack: T1546
  if:
    type: text
    regex: '^\s*Exec=/[^\n]{1,200}'

- id: supervisor-config-path
  desc: Supervisor service configuration path
  crit: notable
  conf: 0.84
  attack: T1543
  if:
    type: text
    regex: '/etc/(supervisor/conf\.d|supervisord\.d)/[^\s]{1,120}\.conf\b'
  unless:
    # AI-agent observability tools run their telemetry collector under supervisord.
  - id: well-known/tool/detection/ai-guardrail/

- id: openrc-service-path
  desc: OpenRC service enablement
  crit: notable
  conf: 0.84
  attack: T1037.004
  if:
    type: text
    regex: '\brc-update\s+add\s+[A-Za-z0-9_.@-]{1,80}\b'
  unless:
    - id: objectives/privilege-escalation/modify-service::vagrant-plugins-marker
    - id: well-known/tool/sysadmin/virtualization::lima-virtualization-tool
    - type: basename
      regex: '^limactl(\.exe)?$'

composite_rules:
- id: pam-config-persistence
  for: [scripts, '!batch', '!jcl', '!powershell', '!vbs', elf, macho]
  desc: PAM configuration persistence
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/app/utility/sudo::source-tree
  - id: metadata/package/tooling::distrobox-source-tree
  # ntfy embeds its optional pam_exec.so integration guide as rendered HTML.
  - id: well-known/app/communication/ntfy::ntfy-binary
  - id: well-known/app/security/gaze/
  all:
  - id: micro-behaviors/os/pam/auth::pam-config-write
  any:
  - id: micro-behaviors/os/pam/auth::pam-optional-control

- id: polkit-rule-persistence
  desc: Polkit JavaScript rule persistence
  crit: notable
  conf: 0.9
  all:
  - id: polkit-rules-path
  - id: polkit-add-rule

- id: dbus-activation-persistence
  desc: D-Bus activation persistence
  crit: suspicious
  conf: 0.86
  all:
  - id: micro-behaviors/fs/path/config/system::dbus-service-path
  - id: dbus-exec-directive
  unless:
  # Test harnesses install temporary activation services to exercise clients;
  # those services are not installed by the shipped package.
  - id: "metadata/file/naming::test-directory-component"

- id: linux-supervisor-persistence
  desc: Linux supervisor-managed persistence
  crit: notable
  conf: 0.86
  any:
  - id: supervisor-config-path
  - id: micro-behaviors/process/daemonize/service-path::runit-service-path
  - id: micro-behaviors/process/daemonize/service-path::s6-service-run-path
  - id: openrc-service-path
- id: managed-stacked-linux-persistence
  desc: Tagged stacked Linux persistence
  crit: hostile
  conf: 0.98
  all:
  - id: managed-persistence-marker
  - id: micro-behaviors/os/service/config::linux-startup-loader-reference-cluster
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::linux-persistence-threat-scanner
- id: managed-persistence-marker
  desc: Managed persistence artifact marker
  crit: component
  conf: 0.84
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: well-known/lib/web/stacksjs/stx::stacksjs-stx-framework-context
  any:
  - id: micro-behaviors/os/autorun/keyword::installed-service-cron-phrase
  - id: micro-behaviors/os/autorun/keyword::installed-init-autostart-phrase
  - id: micro-behaviors/os/autorun/keyword::persistence-service-cron-phrase
  - id: micro-behaviors/os/autorun/keyword::persistence-init-autostart-phrase
  - id: micro-behaviors/os/autorun/keyword::service-cron-installed-phrase
  - id: micro-behaviors/os/autorun/keyword::init-autostart-installed-phrase
  - id: micro-behaviors/os/autorun/keyword::service-cron-persistence-phrase
  - id: micro-behaviors/os/autorun/keyword::init-autostart-persistence-phrase

- id: shell-udev-remote-loader
  desc: Udev rule launches a downloaded program
  crit: hostile
  conf: 0.99
  for: [shell]
  all:
  - id: micro-behaviors/fs/path/config/system::udev-rules-file-path
  - id: micro-behaviors/os/service/config::udev-run-helper-field
  - id: micro-behaviors/communications/http/download/curl::curl-output-redirect
  - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
