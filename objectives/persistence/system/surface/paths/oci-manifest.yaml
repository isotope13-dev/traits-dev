defaults:
  for: [json]
  platforms: [linux]

traits:
  - id: registry-config-preload-traversal
    desc: Config digest targets loader preload
    crit: notable
    if:
      type: value
      path: config.digest
      regex: '^(\.\./){2,}etc/ld\.so\.preload$'

  - id: registry-layer-preload-traversal
    desc: Layer digest targets loader preload
    crit: notable
    if:
      type: value
      path: layers[*].digest
      regex: '^(\.\./){2,}etc/ld\.so\.preload$'

composite_rules:
  - id: registry-manifest-preload-target
    desc: Registry traversal targets loader preload
    ref: https://www.wiz.io/blog/probllama-ollama-vulnerability-cve-2024-37032
    crit: hostile
    attack: T1574.006
    all:
      - id: objectives/execution/exploit/path-traversal::oci-manifest-digest-traversal
    any:
      - id: registry-config-preload-traversal
      - id: registry-layer-preload-traversal
