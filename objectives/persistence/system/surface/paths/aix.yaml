# Both legs are PHP-specific (the write leg is the PHP file API), so the rules
# only target PHP.
#
# near_bytes is what makes these persistence rather than coincidence: a PHP
# webshell's "read a system file" menu lists /etc/inittab and /etc/rc.local
# alongside /etc/fstab and /etc/crontab, and separately writes files elsewhere
# in the same script (b374k does exactly this). Persistence means the write
# targets that path, so the two pieces of evidence must sit together.
defaults:
  platforms: [aix]
  for: [php]
  attack: T1543
composite_rules:
  - id: aix-inittab-persistence
    desc: AIX persistence via /etc/inittab
    crit: hostile
    conf: 0.95
    near_bytes: 200
    all:
      - id: micro-behaviors/fs/path/config/system::etc-inittab
      - id: micro-behaviors/fs/file/write/direct::php-file-write
  - id: unix-rclocal-persistence
    desc: Unix persistence via /etc/rc.local
    crit: hostile
    conf: 0.95
    platforms: [unix]
    near_bytes: 200
    all:
      - id: micro-behaviors/fs/path/config/system::etc-rc-local
      - id: micro-behaviors/fs/file/write/direct::php-file-write
