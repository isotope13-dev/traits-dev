defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: system-preload-directory-concealment
    desc: Registers directory concealment system preload
    crit: hostile
    conf: 0.97
    attack: T1574.006
    # The write alone is neutral. The suppression leg already requires a
    # shared-library build beside the loader configuration write.
    all:
      - id: objectives/evasion/file-hiding/query-filter::built-readdir-name-suppression
    any:
      - id: micro-behaviors/fs/write/system-paths::system-preload-tee-write
      - id: micro-behaviors/fs/write/system-paths::sudo-system-preload-tee-write
