# Linux modprobe persistence hooks.
defaults:
  platforms: [linux]
  attack: T1547.006
  for: [text]

composite_rules:
  - id: modprobe-install-hook
    desc: modprobe install command hook
    crit: suspicious
    conf: 0.86
    all:
      - id: micro-behaviors/os/kernel/module::modprobe-config-path
      - id: micro-behaviors/os/kernel/module::modprobe-install-command-line
    any:
      - id: micro-behaviors/os/kernel/module::modprobe-ignore-install-flag
      - id: micro-behaviors/os/kernel/module::modprobe-shell-metachar
    unless:
      - id: metadata/package/files/system-package::container-runtime-binary
      # Self-delegation to modprobe is the documented aliasing mechanism,
      # not a persistence diversion to a foreign binary.
      - id: modprobe-install-self-delegation
  - id: modprobe-install-self-delegation
    desc: modprobe.d install delegates to modprobe itself
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/os/kernel/module::modprobe-install-command-line
      - id: micro-behaviors/os/kernel/module::modprobe-install-modprobe-target
