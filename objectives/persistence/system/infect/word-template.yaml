# Installing a macro into Word's global template (NORMAL.DOT) is the classic
# Word 6/95 macro-virus persistence: Word loads NORMAL.DOT at every startup,
# so an autoOpen macro copied into it reactivates without the original
# document. The evidence here is the document's own macro code addressing the
# auto-run macro through the global container (`"Global:autoOpen"`) next to a
# NORMAL.DOT reference — template-management plumbing no ordinary document
# carries.
defaults:
  for: [oledoc]
  platforms: [windows]
  attack: T1137

composite_rules:
  - id: vba-word-template-macro-injection
    desc: Injects macro into Word template
    crit: hostile
    conf: 0.97
    attack: T1137.001
    for: [oledoc, ooxml, vbs, html, text]
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::vba-template-project-reference
      - id: objectives/evasion/anti-av/document::vba-disable-virus-protection
    any:
      - id: micro-behaviors/metaprogramming/generation::vba-codemodule-insert-lines
      - id: micro-behaviors/metaprogramming/generation::vba-codemodule-add-source

  - id: wordbasic-autoopen-global-template-install
    desc: WordBasic autoOpen installed into NORMAL.DOT
    crit: hostile
    conf: 0.96
    near_bytes: 900
    all:
      - id: micro-behaviors/process/create/macro/office::global-qualified-macro-path
      - id: micro-behaviors/process/create/macro/office::wordbasic-normal-dot-ref
    any:
      - id: micro-behaviors/process/create/macro/office::wordbasic-autoopen
      - id: micro-behaviors/process/create/macro/office::colon-qualified-auto-run-macro-path

  - id: wordbasic-template-command-infector
    desc: WordBasic template infector command hooks
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/macro/office::wordbasic-command-hook
      - id: micro-behaviors/process/create/macro/office::wordbasic-template-ref

  - id: wordbasic-global-command-hook-install
    desc: WordBasic command hook installed into global template
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/macro/office::wordbasic-command-hook
      - id: micro-behaviors/process/create/macro/office::global-qualified-macro-path


