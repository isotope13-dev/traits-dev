defaults:
  for: [oledoc, ole]
  platforms: [windows]
  attack: T1137
  mbc: B0022

composite_rules:
  - id: oledoc-cross-office-template-infector
    desc: OLE document infects Office templates
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/macro/compressed-vba::raw-vba-powerpoint-template-reference
      - id: micro-behaviors/process/create/macro/compressed-vba::raw-vba-excel-startup-path

  - id: powerpoint-template-slidemaster-infector
    desc: PowerPoint macro infects template
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/macro/compressed-vba::raw-vba-powerpoint-template-reference
      - id: micro-behaviors/process/create/macro/compressed-vba::raw-vba-powerpoint-slidemaster-shapes

