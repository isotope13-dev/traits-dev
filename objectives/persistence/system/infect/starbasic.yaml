# A Basic module rebinding an application-wide GlobalEventBroadcaster event to
# a macro that lives in a document. The binding is stored in the suite's own
# configuration, so after the infected document is closed every later
# document event in OpenOffice/LibreOffice still dispatches to macro code
# carried by a document -- the activation hook of StarOffice macro viruses.
defaults:
  for: [xml]
  platforms: [windows, unix]
  attack: T1546
  mbc: B0022

composite_rules:
  - id: starbasic-global-event-to-document-macro
    desc: Binds suite-wide event to a document macro
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/office/macro::starbasic-module-xml-root
      - id: micro-behaviors/os/application/hook/registration::starbasic-global-event-rebind
      - id: micro-behaviors/os/application/hook/registration::starbasic-document-macro-script-url
