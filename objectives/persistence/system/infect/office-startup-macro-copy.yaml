# Office reloads everything in its startup folder and global templates on
# every launch. A macro that copies its own module or workbook there keeps
# running without the original document.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  attack: T1137.001

composite_rules:
  # Add-in installers also copy modules into the Startup folder, so the
  # copy must come with macro-virus behavior: protection switched off or a
  # built-in file command hijacked.
  - id: vba-module-copy-into-startup-or-template
    desc: Copies its macro module into global templates
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/metaprogramming/generation/transform::vba-organizer-copy-project-item
      - id: micro-behaviors/fs/path/autostart::office-global-macro-location
    any:
      - id: objectives/evasion/anti-av/document::vba-disable-virus-protection
      - id: micro-behaviors/os/application/hook/event::vba-word-file-command-procedure

  - id: excel-startup-copy-protection-off
    desc: Copies workbook to XLStart with protection off
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/autostart::office-startup-folder-reference
      - id: micro-behaviors/data/document/spreadsheet::vba-workbook-save-copy-as
      - id: objectives/evasion/anti-av/document::vba-disable-virus-protection

  - id: excel-startup-copy-with-sheet-hook
    desc: Saves workbook to startup, hooks sheets
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/autostart::office-startup-folder-reference
      - id: micro-behaviors/os/application/hook/event::excel-onsheetactivate-macro-hook
    any:
      - id: micro-behaviors/fs/write/file/target::vb-saveas-filename-statement
      - id: micro-behaviors/data/document/spreadsheet::vba-named-workbook-saveas-path
      - id: micro-behaviors/data/document/spreadsheet::vba-workbook-save-copy-as
