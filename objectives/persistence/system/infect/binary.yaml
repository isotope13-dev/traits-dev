# Parasitic PE file infectors (such as Win32.Sality) mark .text and .reloc RWX,
# make .rdata writable, and strip the relocation directory while storing an
# encrypted payload in a large high-entropy .reloc section.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1554,T1027

composite_rules:
  - id: stripped-reloc-rwx-parasitic-pe-infector
    desc: Parasitic PE infector stores RWX payload in stripped .reloc with writable .rdata
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: metadata/binary/section/reloc::relocs-stripped-flag
      - id: metadata/binary/section/permission::two-or-more-wx-sections
      - id: metadata/binary/section/permission::writable-rdata
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
