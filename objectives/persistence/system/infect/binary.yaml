# Parasitic PE file infectors (such as Win32.Sality) mark .text and .reloc RWX,
# strip the relocation directory while storing an encrypted payload in .reloc,
# and walk logical drives preserving infected host timestamps via SetFileTime.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1554,T1070.006,T1027

composite_rules:
  - id: stripped-reloc-rwx-drive-walk-pe-infector
    desc: Parasitic PE infector stores RWX payload in stripped .reloc and walks drives
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: metadata/binary/section/reloc::relocs-stripped-flag
      - id: metadata/binary/section/permission::two-or-more-wx-sections
      - id: micro-behaviors/fs/enumerate/drives::logical-drive-type-enumeration
      - id: micro-behaviors/fs/file/timestamp::set-file-time-with-walk-and-self-path
