defaults:
  for: [shell]
  platforms: [linux]
traits:
  - id: purge-branch-hidden-callback-launch
    desc: Purge branch launches hidden callback script
    crit: hostile
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (_) @condition
          (redirected_statement
            body: (command name: (command_name) @writer argument: (raw_string) @payload)
            redirect: (file_redirect ">" destination: (_) @written))
          (redirected_statement
            body: (command name: (command_name) @launcher argument: (_) @launched)))
          (#match? @condition "\\$1.*[=].*purge")
          (#eq? @writer "printf")
          (#eq? @launcher "nohup")
          (#eq? @written @launched)
          (#match? @written "^/var/lib/[^/]+/\\.[^/]+$")
          (#match? @payload "^'#!/bin/sh\\\\nwhile true; do curl\\s+-[fsSL]+\\s+https?://[^ ]+ >?/dev/null")
          (#match? @payload "sleep [0-9]+; done"))
composite_rules:
  - id: purge-hook-leaves-hidden-callback
    desc: Purge hook leaves a hidden detached callback
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/path/installation::debian-control-hook-path
      - id: metadata/build/package/maintainer-scripts::debian-postrm-script-path
      - id: purge-branch-hidden-callback-launch
