# Android persistence through the platform's own install machinery:
# (1) a boot receiver that silently reinstalls a payload staged in the
# read-only OEM partition, so uninstalling the /data copy only lasts until
# reboot; (2) self-installation into a */priv-app/ directory behind a
# read-write remount, with a freshly minted privapp-permissions allowlist,
# so the copy survives as a privileged system app. Package names, staged
# filenames, and the partition chosen vary; the platform paths do not.
defaults:
  platforms: [android, unix]
  attack: T1547

composite_rules:
  - id: android-boot-reinstall-oem-payload
    desc: Reinstalls OEM-partition payload on every boot
    crit: hostile
    conf: 0.98
    for: [java, kotlin]
    scope: file
    all:
      - id: micro-behaviors/os/message/intent::android-boot-completed-source-reference
      - id: micro-behaviors/os/package-manager/sideload::android-oem-staged-apk-path
      - id: micro-behaviors/os/package-manager/sideload::android-programmatic-apk-install

  - id: android-privileged-system-self-install
    desc: Self-installs as privileged system app
    crit: hostile
    conf: 0.98
    for: [scripts, source]
    scope: file
    all:
      - id: micro-behaviors/fs/volume/mount::remount-writable
      - id: micro-behaviors/os/package-manager/sideload::android-privapp-path-reference
      - id: micro-behaviors/os/package-manager/sideload::android-privapp-permissions-file-reference
      - id: micro-behaviors/os/package-manager/sideload::android-privileged-permission-grant
