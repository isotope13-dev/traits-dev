# RubyGems runs the gemrc `post_install` command after every install. Code
# that writes that hook beside a decoded-response evaluator turns each later
# gem install into a fetch of operator code.
defaults:
  for: [ruby]
  platforms: [unix, windows]

composite_rules:
  - id: gemrc-hook-with-remote-code-eval
    desc: Plants gemrc hook beside remote code eval
    crit: hostile
    conf: 0.95
    attack: T1546,T1195.002
    all:
      - id: micro-behaviors/os/package-manager/config::rubygems-config-hook-clues
      - id: objectives/exfiltration/oob/system-profile::ruby-eval-http-body-base64
      - id: micro-behaviors/fs/write/file/full/unspecified::ruby-file-write-call
