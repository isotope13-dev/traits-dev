# RubyGems auto-installs a loader into Gem.plugindir for any gem shipping
# `rubygems_plugin.rb` at the root of a require path (default `lib/rubygems_plugin.rb`).
# The file executes immediately at the end of `gem install` and on EVERY future
# `gem` CLI command (including read-only commands such as `gem list`, `gem search`,
# and `gem -v`). Legitimate plugins (RDoc, YARD, rbenv-gem-rehash) manage local
# docs or shims; outbound network exfiltration/beaconing or Base64-decoded eval
# inside `rubygems_plugin.rb` establishes package-manager plugin persistence.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1195.002,T1546

composite_rules:
  - id: rubygems-plugin-outbound-channel
    desc: Outbound HTTP or socket channel in Ruby code
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/request/netlib/
      - id: micro-behaviors/communications/http/channel::script-http-upload-client
      - id: micro-behaviors/communications/socket/connect/

  - id: rubygems-plugin-network-exfil-or-beacon
    desc: RubyGems plugin outbound exfil or raw-IP beacon
    crit: hostile
    conf: 0.97
    attack: T1195.002,T1546,T1041
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-rubygems-plugin
      - id: rubygems-plugin-outbound-channel
    any:
      - id: micro-behaviors/process/identity/query/command::whoami-cmd
      - id: micro-behaviors/process/create/shell/substitution::ruby-subshell-command
      - id: micro-behaviors/hardware/display/screenshot/unspecified::macos-screencapture-invocation
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/data/decode/base64/unspecified/
      - id: micro-behaviors/fs/path/secret-config/
      - id: objectives/credential-access/env/
    unless:
      - id: well-known/tool/development/docs/rdoc::rubygems-doc-hook-file
      - id: well-known/tool/development/docs/yard::rubygems-doc-hook-file
      - id: well-known/tool/packaging/rbenv::rbenv-gem-rehash-plugin-context

  - id: rubygems-plugin-encoded-eval-or-exec
    desc: RubyGems plugin decodes Base64 to eval or exec
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1546,T1059
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-rubygems-plugin
      - id: micro-behaviors/data/decode/base64/unspecified/
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: micro-behaviors/process/interpreter/eval/decoded::ruby-eval-base64-decode-call
      - id: micro-behaviors/process/create/exec/
      - id: micro-behaviors/process/create/shell/substitution/
    unless:
      - id: well-known/tool/development/docs/rdoc::rubygems-doc-hook-file
      - id: well-known/tool/development/docs/yard::rubygems-doc-hook-file
      - id: well-known/tool/packaging/rbenv::rbenv-gem-rehash-plugin-context
