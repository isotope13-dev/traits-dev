defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027,T1140,T1546
  mbc: B0024

composite_rules:
  - id: node-decrypted-plugin-sideload
    desc: Decrypts payload to /tmp and installs CLI plugin
    crit: suspicious
    conf: 0.96
    near_lines: 15
    all:
      - id: micro-behaviors/fs/write/file/stage::node-write-decrypted-temp-file
      - id: micro-behaviors/os/package-manager/sideload::node-spawn-plugin-add-temp-path
    unless:
      - id: metadata/path/directory::test-directory-component
