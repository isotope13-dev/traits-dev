defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002

traits:
  - id: pm2-global-install-command
    desc: Embeds a global PM2 install command
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: 'npm\s+i\s+-g\s+pm2\b'

  - id: remote-update-event-handler
    desc: Remote update event handler
    crit: suspicious
    conf: 0.94
    ref: sha256:3f2651fb0b5bf7b4a9991637f2b3ef6cf01101803747f84b87bbe6f5891c571c
    if:
      type: text
      regex: 'connection\.on\(\s*["'']UpdateHost["''][\s\S]{0,320}performSelfUpdate'
    unless:
      - id: well-known/app/ai/coding-agent/pixcode::benign-runtime-context
      - id: well-known/app/ai/coding-agent/pixcode::benign-archive-context

  - id: npm-registry-latest-version-fetch
    desc: Fetches npm latest package metadata
    crit: notable
    conf: 0.95
    if:
      type: text
      # \S also spans compiled/obfuscated string concatenation
      # (`'...org/'+NAME+'/latest'` or `'...org/'+NAME+FN(ID)`) where
      # `/latest` may be a string-table lookup rather than a literal.
      regex: '(fetch|https?\.get)\(\s*["'']https://registry\.npmjs\.org/(\S{0,120}/latest|[''"]\s*\+)'

  - id: npm-install-latest-global-array
    desc: Installs npm package at latest globally
    crit: notable
    conf: 0.93
    if:
      type: text
      # Compiled spawn array shape (`[cmd,'-g',NAME+'@latest']` or
      # `[cmd,'-g',NAME+FN(ID)]`) where both the command verb and `@latest`
      # may be string-tabled away; the `-g` flag glued to a package expression
      # inside an argument array is still the global-install tell.
      regex: '["'']-g["'']\s*,[^\]\n]{0,80}\+[^\]\n]{1,80}\]'

  - id: npx-target-version-command
    desc: Versioned npx replacement command
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'defaultCmd\s*=\s*`npx\s+-y\s+[A-Za-z0-9_.@/-]+@\$\{targetVersion\}'

composite_rules:
  - id: npx-versioned-replacement-spawn
    desc: Versioned npx replacement is spawned
    crit: suspicious
    conf: 0.95
    near_bytes: 1200
    all:
      - id: npx-target-version-command
      - id: micro-behaviors/process/create/construction::spawn-command-variable

  - id: detached-npx-self-update
    desc: Remote npm self-update spawns detached shell
    crit: hostile
    conf: 0.98
    scope: archive
    for: [javascript, typescript, npm]
    attack: "T1195.002,T1059,T1547"
    all:
      - id: npm-registry-latest-version-fetch
      - id: npx-versioned-replacement-spawn
      - id: micro-behaviors/process/create/spawn::shell-true
      - id: micro-behaviors/process/create/spawn::detached-true
  - id: obfuscated-detached-npm-self-update
    for: [javascript, typescript, npm]
    desc: Obfuscated updater installs latest globally detached
    crit: hostile
    conf: 0.97
    scope: archive
    attack: "T1195.002,T1059"
    # Polls the registry for its own latest tag, then installs it globally
    # from a detached child: whoever publishes the next `@latest` owns every
    # client. String-tabled builds hide the npm/install verbs, so the legs
    # key on what survives: the registry URL shape, the `-g`/`@latest`
    # array, and the obfuscated detached-stdio options.
    all:
      - id: npm-registry-latest-version-fetch
      - id: npm-install-latest-global-array
      - id: micro-behaviors/process/create/minified-spawn::node-obfuscated-detached-stdio-options
      - id: micro-behaviors/process/create/shell/bridge::child-process-compiled-computed-call
  - id: remote-npm-self-update
    for: [javascript, typescript, shell, npm]
    desc: Remote npm self-update command
    crit: hostile
    conf: 0.97
    scope: archive
    ref: sha256:3f2651fb0b5bf7b4a9991637f2b3ef6cf01101803747f84b87bbe6f5891c571c
    all:
      - id: remote-update-event-handler
      - id: micro-behaviors/os/package-manager/install::global-npm-install-command
      - id: micro-behaviors/process/create/spawn::shell-true
      - id: micro-behaviors/process/create/spawn::detached-true
    unless:
      - id: well-known/app/ai/coding-agent/pixcode::benign-runtime-context
      - id: well-known/app/ai/coding-agent/pixcode::benign-archive-context
      - id: well-known/app/ai/coding-agent/pixcode::archive-member-context

  - id: detached-pm2-install-and-boot-persistence
    desc: Detached PM2 agent persistence setup
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: pm2-global-install-command
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: objectives/persistence/system/supervised::pm2-startup-command
      - id: objectives/persistence/system/supervised::pm2-autonomous-node-start

  - id: connector-agent-automatic-npm-update
    desc: Connector agent automatically updates through npm
    crit: hostile
    conf: 0.98
    scope: file
    attack: "T1071.001,T1105,T1195.002"
    all:
      - id: objectives/command-and-control/backdoor/daemon::node-connector-poll-path
      - id: npm-registry-latest-version-fetch
      - id: micro-behaviors/os/package-manager/runtime-install::npm-global-install-array
      - id: micro-behaviors/process/create/exec::js-child-process
