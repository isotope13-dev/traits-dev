defaults:
  platforms: [linux]
  for: [shell]
  crit: hostile
  conf: 0.98
  attack: T1546,T1059.004

traits:
  - id: makepkg-remote-shell-write
    desc: Writes remote shell pipeline into makepkg.conf
    crit: suspicious
    if:
      type: tree-sitter
      language: shell
      query: |
        ((redirected_statement
          body: (command
            name: (command_name (word) @writer)
            argument: (raw_string) @payload)
          redirect: (file_redirect [">" ">>"] destination: (_) @target)) @write
          (#any-of? @writer "echo" "printf")
          (#match? @target "^[\"']?(/etc/makepkg|(~|\\$HOME)/(\\.config/pacman/makepkg|\\.makepkg))\\.conf[\"']?$")
          (#match? @payload "^'(curl|wget)[^|]*https?://[^|]*\\|[ \\t]*(ba)?sh\\b"))

composite_rules:
  - id: pkgbuild-makepkg-remote-shell-persistence
    desc: Build phase plants makepkg remote-shell persistence
    attack: T1195.002,T1546
    near_lines: 25
    all:
      - id: makepkg-remote-shell-write
    any:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-prepare-fn
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-package-fn
