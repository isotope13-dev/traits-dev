# "Reset this PC" (Windows push-button reset) restages the OS from the
# Recovery\OEM container and ResetConfig.xml, the WinRE manifest that lists
# which OEM resources to replay during that restage. Neither path is
# attacker-named; both are fixed by the Windows recovery format. A program
# that references the OEM drop folder together with the manifest that
# controls what runs out of it is keying a copy into the reset flow itself,
# not merely noting the recovery partition exists (that already has a home
# in winre-artifact-reference-set). Requiring a write/copy capability nearby
# keeps a read-only recovery-partition health check (Test-Path, Get-Content)
# from matching: inspecting those two paths is ordinary OEM/IT diagnostics;
# writing into one while referencing the other is the implant behavior.
defaults:
  platforms: [windows]
  for: [pe, dll, go, csharp, powershell]
  attack: T1490

composite_rules:
  - id: winre-reset-config-oem-implant-persistence
    desc: Keys implant into WinRE reset-config replay
    crit: hostile
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/system/state::recovery-oem-path
      - id: micro-behaviors/fs/path/system/state::resetconfig-xml-reference
    any:
      - id: micro-behaviors/fs/write/file/mode::go-write-api-or-writable-open
      - id: micro-behaviors/fs/write/file/mode::dotnet-file-create-text
      - id: micro-behaviors/fs/write/file/mode::dotnet-file-openwrite-text
      - id: micro-behaviors/fs/file/copy/call::copy
      - id: micro-behaviors/fs/file/copy/command::powershell-copy-item-command
