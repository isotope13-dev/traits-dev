defaults:
  platforms: [windows]
  for: [scripts, source, text, data]
  attack: T1505.001

composite_rules:
  - id: sqlserver-ddl-trigger-command-backdoor
    desc: SQL Server server-level DDL trigger executes xp_cmdshell commands
    crit: hostile
    conf: 0.99
    near_bytes: 3000
    all:
      - id: micro-behaviors/data/db/schema/stored-code::sqlserver-server-ddl-trigger
      - id: micro-behaviors/process/create/shell/database::sqlserver-xp-windows-command
      - id: micro-behaviors/os/group/membership::net-privileged-group-add
