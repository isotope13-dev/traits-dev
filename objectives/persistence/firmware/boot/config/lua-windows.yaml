defaults:
  platforms: [windows]
  for: [lua]
  attack: T1542.001

traits:
  - id: lua-bcdedit-osloader-create
    desc: Lua bcdedit osloader create
    crit: suspicious
    conf: 0.93
    if:
      type: literal
      substr: 'bcdedit /create'

  - id: lua-bcdedit-addfirst
    desc: Lua boot entry addfirst
    crit: suspicious
    conf: 0.93
    if:
      type: literal
      substr: '/addfirst'

  # source-set-firmware-env-var and wmi-set-nvram-variable
  # (micro-behaviors/os/kernel/routines) are `for: [python]` only and have no
  # other consumer in the tree -- these Lua-scoped copies use the same
  # literal-name matching go-set-firmware-env-var (the Go equivalent in that
  # same file) uses instead of a symbol/call match, since Lua FFI references
  # the Windows API name as a literal string rather than a native call site.
  - id: lua-set-firmware-env-var
    desc: Lua resolves UEFI variable setter
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '(?i)^SetFirmwareEnvironmentVariable[AW]?$'
  - id: lua-set-nvram-variable
    desc: Lua resolves WMI NVRAM variable setter
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '(?i)^SetNVRAMVariable$'

composite_rules:
  - id: lua-uefi-variable-persistence
    desc: Lua UEFI variable persistence
    crit: hostile
    conf: 0.98
    all:
      - id: lua-set-firmware-env-var
      - id: lua-set-nvram-variable
      - id: lua-bcdedit-osloader-create
    any:
      - id: lua-bcdedit-addfirst
