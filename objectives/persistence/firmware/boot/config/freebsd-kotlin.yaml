defaults:
  platforms: [freebsd, unix]
  for: [kotlin, class, jar]
  attack: T1542

traits:
  - id: kotlin-freebsd-loader-config-source
    desc: Kotlin FreeBSD loader config strings
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: text
      # /boot/config-* is a normal Linux kernel RPM artifact; FreeBSD loader
      # persistence is identified by its loader.conf/device.hints paths.
      regex: '/boot/(loader\.conf|device\.hints)'
    unless:
      # Release notes and changelogs misdetected as Kotlin quote loader
      # variables without being Kotlin or JVM code.
      - id: metadata/file/extension/identity::json-txt-md-basename

  - id: kotlin-autoboot-delay-string
    desc: Kotlin autoboot_delay string
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: text
      substr: autoboot_delay
    unless:
      # Release notes and changelogs misdetected as Kotlin quote loader
      # variables without being Kotlin or JVM code.
      - id: metadata/file/extension/identity::json-txt-md-basename

  - id: kotlin-loader-logo-string
    desc: Kotlin loader_logo string
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: text
      substr: loader_logo
    unless:
      # Release notes and changelogs misdetected as Kotlin quote loader
      # variables without being Kotlin or JVM code.
      - id: metadata/file/extension/identity::json-txt-md-basename

  - id: kotlin-boot-serial-string
    desc: Kotlin boot_serial string
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: text
      substr: boot_serial
    unless:
      # Release notes and changelogs misdetected as Kotlin quote loader
      # variables without being Kotlin or JVM code.
      - id: metadata/file/extension/identity::json-txt-md-basename

  - id: kotlin-custom-service-enable-bytecode
    desc: Kotlin bytecode custom service enable
    crit: suspicious
    conf: 0.94
    for: [class]
    if:
      type: text
      substr: custom_service_enable

  - id: kotlin-nvram-boot-args
    desc: Kotlin sets NVRAM boot args
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: text
      substr: 'set boot-args "-v debug=0x10"'
    unless:
      # Release notes and changelogs misdetected as Kotlin quote loader
      # variables without being Kotlin or JVM code.
      - id: metadata/file/extension/identity::json-txt-md-basename

composite_rules:
  - id: kotlin-freebsd-firmware-persistence
    desc: Kotlin FreeBSD firmware persistence
    for: [kotlin, class, jar, shell]
    crit: hostile
    conf: 0.98
    all:
      - id: kotlin-freebsd-loader-config-source
      - id: kotlin-autoboot-delay-string
      - id: kotlin-loader-logo-string
    any:
      - id: kotlin-boot-serial-string
      - id: kotlin-nvram-boot-args
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-path-reference

  - id: kotlin-bytecode-firmware-persistence
    desc: Kotlin bytecode firmware persistence
    crit: hostile
    conf: 0.98
    for: [class, jar]
    all:
      - id: kotlin-custom-service-enable-bytecode
      - id: kotlin-autoboot-delay-string
      - id: kotlin-nvram-boot-args
