defaults:
  platforms: [solaris, unix]
  for: [go, elf]
  attack: T1542.001

traits:
  - id: go-solaris-firmware-persist-func
    desc: Go Solaris firmware persist function
    crit: suspicious
    conf: 0.9
    for: [elf]
    if:
      type: text
      substr: main.firmwarePersistence

  - id: go-solaris-etc-system-path
    desc: Go Solaris /etc/system path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(^|/)/etc/system($|/)'
    unless:
      - id: well-known/tool/sysadmin/kubernetes/minikube
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/harness/unit::go-test
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-docker-machine-binary



