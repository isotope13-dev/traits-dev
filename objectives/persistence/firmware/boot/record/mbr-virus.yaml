defaults:
  platforms: [unix, windows, macos]
composite_rules:
  # These alternatives are text observations shared by ordinary boot tools.
  - id: boot-sector-access-source
    desc: Boot sector or partition table access in source
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/disk/partition::boot-block-read
      - id: micro-behaviors/fs/disk/partition::mbr-mod-asm
    unless:
      # r_fs.dll is radare2 filesystem plugin set: parsing MBR/partition tables is what a forensic FS parser does.
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
      - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
  # Low-level references are not proof of a boot-sector virus.
  - id: boot-sector-virus-lowlevel-source
    desc: Low-level boot and interrupt text indicators
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/msdos/interrupt::int13-disk-sector-io
      - id: metadata/binary/instruction/operand::x86-ds-413-address-text
      - id: objectives/persistence/system/int-hook::ivt-direct-write-asm
