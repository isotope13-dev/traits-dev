# A BIOS disk-read hook rewriting loaded boot code transfers execution to
# its relocated payload. Ordinary MBR parsers and driver installers do not
# contain both the IVT replacement and the read-buffer CALL FAR patch.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1542.003

composite_rules:
  - id: embedded-bios-read-hook-bootkit
    desc: BIOS disk hook patches loaded boot code to call payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/msdos/interrupt::embedded-int13-vector-replacement
      - id: micro-behaviors/mem/write/arbitrary::embedded-bios-buffer-far-call-patch
    near_bytes: 512
  # The byte pair above is the payload. A second conviction is the installer
  # that writes that image, registers its ImagePath, enables a driver-load
  # privilege, and starts the kernel service. The loader strings sit far from
  # the real-mode blob, so this composite is file-scoped rather than nearby.
  - id: int13-bootkit-loaded-as-kernel-driver
    desc: INT 13h bootkit loaded as a kernel driver
    crit: hostile
    conf: 0.98
    attack: T1542.003,T1543.003
    all:
      - id: embedded-bios-read-hook-bootkit
      - id: micro-behaviors/os/kernel/module::zwload-driver-api-reference
      - id: micro-behaviors/os/service/host::service-imagepath-value-name
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name-beyond-debug
