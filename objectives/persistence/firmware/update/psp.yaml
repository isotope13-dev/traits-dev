defaults:
  platforms: [unix, windows]
  for: [static-lib, text, pe]
  attack: T1542.001

traits:
  - id: psp-flash-volume
    desc: Names a PSP flash volume
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(lflash0:|flashfat[0-9]+:|flash[0-9]+:/)'

  - id: psp-kernel-prx
    desc: Names a PSP kernel module
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(loadcore|loadexec|sysmem|init)\.prx\b'

composite_rules:
  - id: psp-flash-kernel-modules
    desc: PSP flash names kernel modules
    crit: hostile
    conf: 0.94
    all:
      - id: psp-flash-volume
      - id: psp-kernel-prx
