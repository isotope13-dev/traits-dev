# Python Startup Persistence Hooks
# Detects abuse of Python's automatic startup mechanisms for persistence:
# sitecustomize.py, usercustomize.py, .pth files, PYTHONSTARTUP env var.
# ATT&CK: T1546 (Event Triggered Execution)
defaults:
  platforms: [windows, unix]
  for: [python]
  size_max: 131072
  attack: T1546

traits:
  # --- sitecustomize / usercustomize ---
- id: sitecustomize-path
  desc: Python sitecustomize startup path
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(?i)(\\|/)Lib(\\|/)sitecustomize\.py\b'

- id: is-sitecustomize-file
  desc: File is named sitecustomize.py
  # A filename identifies a startup hook but does not establish persistence;
  # hostile composites require execution or loading behavior.
  crit: notable
  conf: 0.95
  downgrade:
    any:
    - id: well-known/tool/development/debugpy
  if:
    type: path
    basename: true
    exact: sitecustomize.py

- id: usercustomize-path
  desc: Python usercustomize startup path
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(?i)(\\|/)usercustomize\.py\b'

  # --- .pth file abuse ---
- id: pth-import-exec
  desc: Python .pth startup file
  crit: notable
  conf: 0.95
  for: [python, shell]
  unless:
  - type: text
    substr: 'import _bazel_site_init'
  # Vendor DLL-registration .pth (e.g. ibm_db) only extends the loader search
  # path; not a persistence startup hook.
  - type: text
    substr: 'import _ibm_db_register_dll'
  - type: text
    substr: 'os.add_dll_directory'
  if:
    type: basename
    regex: '\.pth$'


- id: python-site-packages-enumeration
  desc: Python enumerates site package paths
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: site.getsitepackages()

- id: python-pth-file-write
  desc: Python opens a .pth file for writing
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'open[^n\n]{0,120}\.pth[^h\n]{0,30}["'']w["'']'

- id: telemetry-initializer-import
  desc: Telemetry, analytics, or metrics module import
  crit: component
  conf: 0.86
  for: [python, shell]
  if:
    type: text
    regex: '(?mi)^\s*import\s+_?(telemetry|analytics|metrics)[A-Za-z0-9_]*\b'

- id: pth-exec-open-read-line
  desc: .pth executes Python file content
  crit: component
  conf: 0.96
  for: [python, shell]
  if:
    type: text
    regex: 'exec\s*\(\s*open\s*\([^)]{0,160}\)\.read\s*\(\s*\)\s*\)'
  unless:
  - type: path
    basename: true
    regex: '\.py[co]?$'

  # Stub one-liners like base64("collect_secrets()") are teaching fixtures.
  # Real .pth droppers embed a substantial opaque payload before exec.
- id: substantial-b64-payload-literal
  desc: Substantial base64-shaped string literal
  crit: component
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: '[A-Za-z0-9+/]{10,}[+/=][A-Za-z0-9+/]{29,}={0,2}'
  not:
    # REST path literals (for example /api/client/...) false-positive when `/`
    # is read as a base64 chunk separator.
    - regex: '^/'
    - regex: '/(api|client|v[0-9]+)/'
  unless:
    - id: metadata/lang/source::python-datamodel-codegen-generated
    - type: path
      basename: true
      regex: '\.py[co]?$'
    - type: literal
      kind: string
      regex: '://'

  # --- DLL masquerade for Python payload ---
- id: dll-extension-string
  desc: DLL filename referenced in Python script
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\w{4,}\.dll\b'

  # --- PYTHONSTARTUP env var ---
- id: pythonstartup-env
  desc: PYTHONSTARTUP environment variable reference
  crit: notable
  conf: 0.92
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
  - type: basename
    exact: site.py
  - type: text
    substr: "cpython.run_startup"
  if:
    type: text
    regex: '(os\.getenv|os\.environ(\.get|\[))[^\n]{0,80}PYTHONSTARTUP'

composite_rules:
- id: pth-substantial-b64-literal
  desc: Substantial base64 literal in .pth startup
  crit: notable
  conf: 0.9
  all:
  - id: pth-import-exec
  - id: substantial-b64-payload-literal

- id: pth-startup-child-process
  desc: Python .pth startup hook launches a child process
  crit: hostile
  conf: 0.97
  attack: T1546.004,T1059.006
  # A .pth that merely Popen's the interpreter is also how some tooling
  # bootstraps; require an embedded substantial payload before calling it
  # a hostile startup dropper.
  all:
  - id: pth-substantial-b64-literal
  any:
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/create/subprocess::run-ast
  - id: micro-behaviors/process/create/subprocess::os-popen-ast
  - id: micro-behaviors/process/create/system::python-os-system

- id: python-pth-startup-file-write
  desc: Python writes a .pth startup file
  crit: notable
  conf: 0.95
  all:
  - id: python-site-packages-enumeration
  - id: python-pth-file-write
  near_bytes: 400

- id: encoded-pth-detached-process
  desc: Encoded Python .pth launcher starts a detached child process
  crit: hostile
  conf: 0.98
  attack: T1059.006,T1546
  all:
  - id: pth-substantial-b64-literal
  - id: objectives/anti-static/obfuscation/control-flow/logic::direct-base64-exec
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/create/subprocess::subprocess-detached-session

# .pth + detached sys.executable -c + exec(b64decode(...)) is the classic
# startup-hook secret-harvester launcher.  Payload length is irrelevant once
# the persistence file, detached session, and inline decode-exec are present.
- id: pth-detached-inline-b64-exec
  desc: Python .pth launches detached base64-exec child
  crit: hostile
  conf: 0.97
  attack: T1546.004,T1059.006,T1027
  all:
  - id: pth-import-exec
  - id: objectives/anti-static/obfuscation/control-flow/logic::direct-base64-exec
  - id: micro-behaviors/process/create/subprocess::sys-executable-c-popen
  - id: micro-behaviors/process/create/subprocess::subprocess-detached-session

# Import-time Popen in a .pth that also embeds exec(b64decode) is a dropper
# even before the detached-session leg is considered.
- id: pth-import-time-b64-child
  desc: Python .pth import-time base64-exec child
  crit: hostile
  conf: 0.96
  attack: T1546.004,T1059.006,T1027
  all:
  - id: pth-import-exec
  - id: objectives/anti-static/obfuscation/control-flow/logic::direct-base64-exec
  - id: objectives/supply-chain/hidden-payload/trojan::python-module-level-popen

- id: pth-base64-exec-startup
  desc: Python .pth startup hook decodes and executes embedded code
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.006,T1546.004
  all:
  - id: pth-substantial-b64-literal
  any:
  - id: objectives/anti-static/obfuscation/control-flow/logic::direct-base64-exec
  - id: objectives/anti-static/obfuscation/control-flow/logic::imported-base64-exec

- id: pth-telemetry-initializer-import
  desc: Python .pth startup file imports telemetry code
  crit: suspicious
  conf: 0.96
  for: [python, shell]
  all:
  - id: pth-import-exec
  - id: telemetry-initializer-import
- id: sitecustomize-startup-hijack
  desc: Python sitecustomize startup hijack
  crit: hostile
  conf: 0.97
  all:
  - id: sitecustomize-path
  - id: micro-behaviors/process/info/commandline::py-getargcargv
  - id: micro-behaviors/process/interpreter/python::runpy-run-path
  any:
  - id: micro-behaviors/process/interpreter/python::pythonw-launch
  - id: objectives/anti-static/obfuscation/eval/scripting::pythonw-exe-replace-trick
- id: sitecustomize-argv-loader
  desc: sitecustomize.py with argv-gated loader
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/info/commandline::py-getargcargv
  - id: micro-behaviors/process/interpreter/python::runpy-run-path
  any:
  - id: is-sitecustomize-file
  - id: dll-extension-string
  - id: sitecustomize-path

- id: startup-hook-file
  desc: Python startup hook file with exec
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/process/interpreter/python::exec-builtin
  any:
  - id: is-sitecustomize-file
  - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook

- id: pth-open-read-startup-exec
  desc: .pth startup executes file content
  crit: hostile
  conf: 0.98
  all:
  - id: pth-import-exec
  - id: pth-exec-open-read-line

- id: encoded-sitecustomize-loader
  desc: Encoded Python startup hook loader
  crit: hostile
  conf: 0.96
  all:
  - id: is-sitecustomize-file
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-import-dunder
  - id: micro-behaviors/data/encode/payload::large-base64-string-literals
  any:
  - id: micro-behaviors/data/decode/base64::b64decode-string
  - id: micro-behaviors/data/decode/base64::dunder-import-base64
  - id: objectives/anti-static/obfuscation/payload/encoded::python-packed-payload

- id: encoded-startup-decompress-exec
  desc: Python startup hook decompress exec
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/anti-static/obfuscation/payload/encoded::exec-long-base64-dunder-import
  any:
  - id: is-sitecustomize-file
  - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook

- id: usercustomize-loader
  desc: usercustomize.py with dynamic code loading
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
  any:
  - id: micro-behaviors/process/interpreter/python::runpy-run-path
  - id: micro-behaviors/process/interpreter/python::runpy-run-module
  - id: micro-behaviors/process/interpreter/python::exec-builtin
