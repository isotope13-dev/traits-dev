defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-download-run-key-execute
    desc: Downloads and runs script with Run key
    crit: hostile
    conf: 0.99
    attack: T1105,T1547.001,T1059.006
    if:
      type: tree-sitter
      query: |
        ((module
          (function_definition name: (identifier) @persist
            parameters: (parameters (identifier) @name (identifier) @target)
            body: (block
              (expression_statement (assignment left: (identifier) @key right: (call
                function: (attribute object: (identifier) @winreg1 attribute: (identifier) @openkey)
                arguments: (argument_list (attribute) (string) @regpath))))
              (expression_statement (call function: (attribute object: (identifier) @winreg2 attribute: (identifier) @setvalue)
                arguments: (argument_list (identifier) @key2 (identifier) @name2 (integer) (attribute) (identifier) @target2)))))
          (expression_statement (assignment left: (identifier) @urlvar right: (string) @url))
          (expression_statement (assignment left: (identifier) @response right: (call
            function: (attribute object: (identifier) @requests attribute: (identifier) @get)
            arguments: (argument_list (identifier) @urlarg))))
          (expression_statement (assignment left: (identifier) @path right: (call
            function: (attribute object: (attribute object: (identifier) @os1 attribute: (identifier) @pathmod1) attribute: (identifier) @join)
            arguments: (argument_list (call function: (attribute object: (attribute object: (identifier) @os2 attribute: (identifier) @pathmod2) attribute: (identifier) @expand)
              arguments: (argument_list (string) @home)) (string) @file))))
          (with_statement (with_clause (with_item value: (as_pattern
            (call function: (identifier) @open arguments: (argument_list (identifier) @path2 (string) @mode))
            alias: (as_pattern_target (identifier) @handle))))
            body: (block (expression_statement (call function: (attribute object: (identifier) @handle2 attribute: (identifier) @write)
              arguments: (argument_list (attribute object: (identifier) @response2 attribute: (identifier) @text))))))
          (expression_statement (call function: (identifier) @persist2 arguments: (argument_list (string) (identifier) @path3)))
          (expression_statement (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @run)
            arguments: (argument_list (list (string) @python (identifier) @path4)))))
          (#eq? @winreg1 "winreg") (#eq? @winreg2 "winreg") (#eq? @openkey "OpenKey") (#eq? @setvalue "SetValueEx")
          (#eq? @key @key2) (#eq? @name @name2) (#eq? @target @target2) (#match? @regpath "CurrentVersion")
          (#match? @regpath "Run") (#eq? @urlvar @urlarg) (#match? @url "https?://")
          (#eq? @requests "requests") (#eq? @get "get") (#eq? @os1 "os") (#eq? @os2 "os")
          (#eq? @pathmod1 "path") (#eq? @pathmod2 "path") (#eq? @join "join") (#eq? @expand "expanduser")
          (#match? @home "~") (#match? @file "[.]py") (#eq? @open "open") (#match? @mode "w")
          (#eq? @response @response2) (#eq? @text "text") (#eq? @write "write") (#eq? @handle @handle2)
          (#eq? @persist @persist2) (#eq? @path @path2) (#eq? @path @path3) (#eq? @path @path4)
          (#eq? @subprocess "subprocess") (#eq? @run "run") (#match? @python "python"))
