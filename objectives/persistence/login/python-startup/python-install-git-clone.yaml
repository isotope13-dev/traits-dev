defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-install-clone-move-startup-script
    desc: Install clones and moves script to Startup
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1547.001
    if:
      type: tree-sitter
      query: |
        ((module
          (class_definition name: (identifier) @hook superclasses: (argument_list (identifier) @install)
            body: (block (function_definition name: (identifier) @run body: (block
              (expression_statement (assignment left: (identifier) @repo right: (string) @repopath))
              (expression_statement (assignment left: (identifier) @giturl right: (string) @url))
              (expression_statement (call function: (attribute object: (call
                function: (attribute object: (identifier) @git attribute: (identifier) @gitclass)
                arguments: (argument_list (identifier) @repo2)) attribute: (identifier) @clone)
                arguments: (argument_list (identifier) @giturl2)))
              (expression_statement (assignment left: (identifier) @source right: (string) @srcdir))
              (expression_statement (assignment left: (identifier) @dest right: (string) @dstdir))
              (expression_statement (assignment left: (identifier) @srcpath right: (call
                function: (attribute object: (attribute object: (identifier) @os1 attribute: (identifier) @pathmod1) attribute: (identifier) @join1)
                arguments: (argument_list (identifier) @source2 (string) @file1))))
              (expression_statement (assignment left: (identifier) @dstpath right: (call
                function: (attribute object: (attribute object: (identifier) @os2 attribute: (identifier) @pathmod2) attribute: (identifier) @join2)
                arguments: (argument_list (identifier) @dest2 (string) @file2))))
              (expression_statement (call function: (attribute object: (identifier) @os3 attribute: (identifier) @rename)
                arguments: (argument_list (identifier) @srcpath2 (identifier) @dstpath2)))))))
          (expression_statement (call function: (identifier) @setup
            arguments: (argument_list (keyword_argument name: (identifier) @cmdclass
              value: (dictionary (pair key: (string) @installkey value: (identifier) @registered)))))))
          (#eq? @install "install") (#eq? @run "run") (#eq? @hook @registered) (#eq? @setup "setup")
          (#eq? @cmdclass "cmdclass") (#match? @installkey "^.install.$")
          (#eq? @git "git") (#eq? @gitclass "Git") (#eq? @clone "clone") (#eq? @repo @repo2) (#eq? @giturl @giturl2)
          (#match? @url "https?://") (#match? @repopath "(?i)Startup.*boot") (#match? @srcdir "(?i)Startup.*boot")
          (#match? @dstdir "(?i)Programs.*Startup") (#eq? @os1 "os") (#eq? @os2 "os") (#eq? @os3 "os")
          (#eq? @pathmod1 "path") (#eq? @pathmod2 "path") (#eq? @join1 "join") (#eq? @join2 "join")
          (#eq? @source @source2) (#eq? @dest @dest2) (#eq? @file1 @file2) (#match? @file1 "[.]py")
          (#eq? @rename "rename") (#eq? @srcpath @srcpath2) (#eq? @dstpath @dstpath2))
