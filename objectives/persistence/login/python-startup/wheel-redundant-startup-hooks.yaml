# A published wheel that installs every one of Python's automatic startup
# surfaces at once: a site-packages .pth import line, sitecustomize.py, and
# usercustomize.py, each driving a module-level call at interpreter start.
# One mechanism is occasionally legitimate (editable installs, coverage);
# all three together give redundant activation so the code still runs after
# one surface is cleaned up or excluded, and no legitimate publisher needs
# them simultaneously. The payload's own objective is judged elsewhere.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  crit: suspicious
  conf: 0.95
  attack: T1546.004,T1546
  mbc: E1546

composite_rules:
  - id: wheel-redundant-startup-hook-install
    desc: Wheel installs pth, sitecustomize and usercustomize startup hooks
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/process/interpreter/python::sitecustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    unless:
      - id: metadata/package/testing/
