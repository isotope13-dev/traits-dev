# Archive-level .pth, sitecustomize and usercustomize markers can indicate
# redundant startup activation. The module-level call is also archive-scoped;
# the rule does not establish which hook reaches it.
defaults:
  platforms: [unix, windows]
  for: [whl, python]
  crit: suspicious
  conf: 0.95
  attack: T1546.004,T1546
  mbc: E1546

composite_rules:
  - id: wheel-redundant-startup-hook-install
    desc: Wheel has multiple Python startup-hook markers
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
    any:
      - id: metadata/package/files/wheel-sdist::wheel-sitecustomize-startup-member
      - id: micro-behaviors/process/interpreter/python::sitecustomize-startup-hook
      - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
