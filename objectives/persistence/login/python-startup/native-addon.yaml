defaults:
  platforms: [macos]
  for: [macho]
  attack: T1546.004

composite_rules:
  # The suffix is reconstructed in machine code, while the decoded status
  # strings establish both the destination family and the attempted write.
  - id: native-python-pth-implant
    desc: Native code plants an obfuscated Python .pth startup file
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/extension::xor-5a-pth-suffix-construction
      - id: micro-behaviors/fs/directory/readdir/native::xor-decoded-site-packages-enumeration
      - id: metadata/lang/natural/phrasing::xor-decoded-write-failure-status
