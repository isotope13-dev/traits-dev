defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: pth-write-bound-popen-source
    desc: Writes Popen startup code to .pth file
    crit: hostile
    conf: 0.97
    attack: T1546.011,T1059.006
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @path
            right: (call arguments: (argument_list
              (_) (binary_operator right: (string) @suffix)))))
          . (if_statement consequence: (block .
            (with_statement
              (with_clause (with_item value: (as_pattern
                (call function: (identifier) @open
                  arguments: (argument_list (identifier) @opened (string) @mode))
                alias: (as_pattern_target (identifier) @handle))))
              body: (block . (expression_statement
                (call function: (attribute object: (identifier) @writer attribute: (identifier) @write)
                  arguments: (argument_list (call function: (attribute
                    object: (_) @code attribute: (identifier) @format)))))))))) @body
        (#eq? @open "open")
        (#eq? @write "write")
        (#eq? @format "format")
        (#eq? @path @opened)
        (#eq? @handle @writer)
        (#match? @suffix "[.]pth['\"]$")
        (#match? @mode "^['\"][wax][+bt]*['\"]$")
        (#match? @code "import subprocess")
        (#match? @code "subprocess[.]Popen")
        )
