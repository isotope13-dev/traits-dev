# PEP 517 / 518 build-backend hooks. Modern Python packages declare a
# build backend in pyproject.toml. Malicious backends override
# build_wheel / build_sdist / prepare_metadata_for_build_wheel and run
# code during `pip install` even with --no-build-isolation off.
#
# Existing setup.py coverage doesn't catch these — pyproject.toml-only
# packages have no setup.py at all.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002
  mbc: B0024

composite_rules:
  - id: python-install-lib-import-pth
    desc: Install hook writes an import .pth
    crit: suspicious
    conf: 0.97
    attack: T1546.011,T1195.002
    scope: file
    near_lines: 15
    all:
      - id: metadata/build/package/recipe/setup-hooks::setuptools-install-lib-override
      - id: metadata/lang/source/syntax/call/relationship::pth-suffix-before-write-text
      - id: micro-behaviors/process/interpreter/python::import-statement-string-literal
  - id: python-install-lib-startup-call
    desc: Install hook writes import-and-call .pth
    crit: hostile
    conf: 0.97
    attack: T1546.011,T1195.002
    scope: file
    near_lines: 15
    all:
      - id: metadata/build/package/recipe/setup-hooks::setuptools-install-lib-override
      - id: metadata/lang/source/syntax/call/relationship::pth-suffix-before-write-text
    any:
      - id: micro-behaviors/process/interpreter/python::import-call-statement
      - id: micro-behaviors/process/interpreter/python::from-import-call-statement
  - id: python-pth-hook-urlopen-beacon
    desc: Startup .pth calls a URL beacon
    crit: suspicious
    conf: 0.96
    attack: T1546.011,T1071.001
    scope: archive
    for: [python, python-sdist, whl, zip]
    all:
      - id: objectives/persistence/login/python-startup::python-install-lib-import-pth
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
