defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.99

composite_rules:
  - id: python-startup-http-exec-poll
    desc: Python startup hook contains HTTP exec loop
    attack: T1546,T1071.001,T1059.006
    all:
      - id: objectives/command-and-control/remote-command/http-poll::python-http-response-exec-poll
    any:
      - id: objectives/persistence/login/python-startup::is-sitecustomize-file
      - id: micro-behaviors/process/interpreter/python::usercustomize-startup-hook
