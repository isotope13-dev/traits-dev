defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-setup-download-execute-startup
    desc: Setup downloads and executes Startup executable
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1547.001
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (call
            function: (attribute object: (attribute object: (identifier) @urllib attribute: (identifier) @request) attribute: (identifier) @retrieve)
            arguments: (argument_list (string) @url (string) @destination)))
          (expression_statement (call
            function: (attribute object: (identifier) @subprocess attribute: (identifier) @execute)
            arguments: (argument_list (string) @executed))))
          (#eq? @urllib "urllib") (#eq? @request "request") (#eq? @retrieve "urlretrieve")
          (#match? @url "https?://") (#match? @destination "(?i)Programs.*Startup.*[.]exe")
          (#eq? @destination @executed) (#eq? @subprocess "subprocess") (#eq? @execute "call"))
