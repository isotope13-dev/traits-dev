defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  # Embedded code text can be malformed or its referenced sidecar absent.
  # These clues establish an attempt, not successful runtime execution.
  - id: objectives/persistence/login/python-startup::pth-bun-bootstrap-sidecar-loader
    desc: Python startup hook attempts Bun sidecar execution
    crit: hostile
    conf: 0.99
    attack: T1059.006
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/communications/url/external/github::pth-bun-github-release-url
      - id: micro-behaviors/fs/path/script::pth-index-js-sidecar-reference
      - id: metadata/lang/source/syntax/call/member::pth-subprocess-run-alias-call
