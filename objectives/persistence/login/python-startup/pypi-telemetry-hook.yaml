defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-install-python-pth-telemetry-hook
  desc: Install hook adds telemetry .pth startup import
  crit: suspicious
  conf: 0.99
  scope: archive
  for:
  - python-sdist
  - tar
  - zip
  - python
  - shell
  attack: T1546
  all:
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: micro-behaviors/fs/write/copy::telemetry-pth-copy-clues
  - id: objectives/persistence/login/python-startup::pth-telemetry-initializer-import
