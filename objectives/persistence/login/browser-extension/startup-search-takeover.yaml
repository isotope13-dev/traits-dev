# A manifest that takes the startup pages, the homepage and the default
# search engine at once, with a non-mainstream search host. An alternative
# engine needs only the search slot; also seizing what opens at every browser
# launch makes the extension's host the persistent entry point of the browser.
# Branded start-page products (e.g. disclosed homepage+search bundles) do the
# same openly, so the trio alone stays suspicious. It becomes hostile when the
# provider identity is a template placeholder (keyword.<host> / name.<host>):
# a generated hijacker kit, not a product naming itself.
defaults:
  platforms: [windows, unix]
  attack: T1176
  for: [crx, xpi, zip, json, chrome-manifest]

composite_rules:
  - id: startup-homepage-default-search-takeover
    desc: Extension seizes startup pages, homepage and default search
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-startup-pages-override
      - id: metadata/permission/manifest::chrome-homepage-override
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::extension-custom-search-endpoint

  - id: startup-search-takeover-placeholder-provider
    desc: Startup, homepage and default search seized by placeholder-named provider
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-startup-pages-override
      - id: metadata/permission/manifest::chrome-homepage-override
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::extension-custom-search-endpoint
    any:
      - id: metadata/permission/manifest::search-provider-placeholder-keyword
      - id: metadata/permission/manifest::search-provider-placeholder-name
