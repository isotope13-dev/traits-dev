defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-chromium-preference-integrity-forgery
    desc: Native Chromium preference-MAC forgery machinery
    crit: hostile
    conf: 0.98
    attack: T1176,T1562.001
    all:
      # Browser implementations and preference-repair tools can carry these
      # constants legitimately. Credential export supplies the abuse context.
      - id: objectives/exfiltration/stealer/credential/value/password::native-browser-password-upload-agent
      - id: micro-behaviors/crypto/hash/hmac::native-chromium-preference-mac-seed
      - id: micro-behaviors/data/config/browser-preference::native-chromium-super-mac-fields
      - id: micro-behaviors/data/config/browser-preference::chromium-secure-prefs-encrypted-hash
      - id: micro-behaviors/fs/write/file/handle::write-file
