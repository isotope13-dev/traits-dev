# Browser management used as persistence: the browser is told, through
# machine-wide policy, to install an extension the user cannot remove.
#
# SYS010 (Bitdefender Labs) enrolls Chrome into an attacker-run admin console
# through CloudManagementEnrollmentToken, writes a Firefox ExtensionSettings
# policy that force-installs an add-on from an attacker URL while turning off
# Developer Tools, and the extensions then read webmail and cookies.
defaults:
  platforms: [windows]
  attack: T1176
  mbc: F0012

composite_rules:
  - id: chrome-cloud-management-token-write
    desc: Script writes a Chrome cloud management enrollment token
    crit: suspicious
    conf: 0.88
    for: [powershell, batch, vbs, javascript, python, php, csharp]
    near_lines: 6
    all:
      - id: micro-behaviors/os/registry/policy/reference::chrome-cloud-management-token
    any:
      - id: micro-behaviors/os/registry/value/write::reg-exe-add-command
      - id: micro-behaviors/os/registry/value/write::powershell-registry-property-write
      - id: micro-behaviors/data/property/write::powershell-set-item-property-call

  - id: firefox-forced-addon-devtools-lockout
    desc: Firefox policy force-installs a remote add-on and disables DevTools
    crit: hostile
    conf: 0.9
    for: [batch, powershell, vbs, javascript, python, php, reg, json]
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/registry/policy/reference::firefox-remote-force-install-policy
      - id: micro-behaviors/os/registry/policy/reference::firefox-disable-developer-tools

  - id: multi-browser-management-takeover
    desc: Script enrolls Chrome and force-installs a Firefox add-on remotely
    crit: hostile
    conf: 0.9
    for: [batch, powershell, vbs, javascript, python, php]
    all:
      - id: chrome-cloud-management-token-write
      - id: micro-behaviors/os/registry/policy/reference::firefox-remote-force-install-policy
