defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1176
  conf: 0.9
traits:
- id: extension-all-urls-permissions
  desc: Extension requests all URLs
  crit: notable
  count_min: 2
  if:
    type: hex
    pattern: 3C 00 61 00 6C 00 6C 00 5F 00 75 00 72 00 6C 00 73 00 3E 00
    section: text
- id: extension-host-access-dnr
  desc: Extension DNR host access
  crit: notable
  conf: 0.92
  if:
    type: hex
    pattern: 64 00 65 00 63 00 6C 00 61 00 72 00 61 00 74 00 69 00 76 00 65 00 4E 00 65 00 74 00 52 00
      65 00 71 00 75 00 65 00 73 00 74 00 57 00 69 00 74 00 68 00 48 00 6F 00 73 00 74 00 41 00 63 00
      63 00 65 00 73 00 73 00
    section: text
- id: extension-clipboard-read
  desc: Extension clipboard read
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: 63 00 6C 00 69 00 70 00 62 00 6F 00 61 00 72 00 64 00 52 00 65 00 61 00 64 00
    section: text
- id: chromium-from-webstore-false
  desc: Chromium extension not webstore
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: 22 00 66 00 72 00 6F 00 6D 00 5F 00 77 00 65 00 62 00 73 00 74 00 6F 00 72 00 65 00 22 00
      3A 00 20 00 66 00 61 00 6C 00 73 00 65 00
    section: text
- id: chromium-extension-location-external
  desc: Chromium extension external location
  crit: notable
  conf: 0.86
  if:
    type: hex
    pattern: 22 00 6C 00 6F 00 63 00 61 00 74 00 69 00 6F 00 6E 00 22 00 3A 00 20 00 34 00
    section: text
- id: chromium-extension-installer-symbols--installbaseextension
  desc: Chromium extension (InstallBaseExtension)
  crit: notable
  conf: 0.95
  if:
    type: text
    word: InstallBaseExtension
- id: chromium-extension-installer-symbols--addextensiontoprefs
  desc: Chromium extension (AddExtensionToPrefs)
  crit: notable
  conf: 0.95
  if:
    type: text
    word: AddExtensionToPrefs
- id: chromium-extension-installer-symbols--extensionunpacker
  desc: Chromium extension installer (ExtensionUnpacker)
  crit: notable
  conf: 0.95
  if:
    type: text
    word: ExtensionUnpacker
- id: source-extension-native-messaging-permission
  desc: Extension manifest native messaging permission
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '["''](permissions|optional_permissions)["'']\s*:\s*\[[^]]{0,80}["'']nativeMessaging["'']'
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
- id: source-extension-cookies-permission
  desc: Extension manifest cookies permission
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '["''](permissions|optional_permissions)["'']\s*:\s*\[[^]]{0,80}["'']cookies["'']'
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
- id: source-extension-all-sites-permission
  desc: Extension manifest all-sites permission
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '["''](permissions|optional_permissions)["'']\s*:\s*\[[^]]{0,80}["'']<all_urls>["'']'
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
- id: source-chrome-profile-path
  desc: Source references a Chrome profile
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)Chrome[/\\]Default
- id: source-secure-preferences-name
  desc: Source names Secure Preferences
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: Secure[[:space:]]+Preferences
- id: chromium-encrypted-hash-removal-call
  desc: Calls encrypted hash removal helper
  crit: suspicious
  conf: 0.97
  attack: T1562.001,T1176
  for:
  - scripts
  - source
  if:
    type: text
    regex: (?i)\b(remove|clear|reset)_?encrypted_?hash(es)?\s*\(
- id: chromium-native-messaging-host-value
  desc: Native Messaging key names host manifest
  crit: notable
  conf: 0.95
  for:
  - scripts
  - source
  - data
  - pe
  - dll
  - elf
  unless:
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
  if:
    type: text
    regex: (?i)NativeMessagingHosts[\s\S]{0,160}\.(exe|json)\b
composite_rules:
- id: chromium-secure-prefs-encrypted-hash-removal
  desc: Removes Chromium encrypted hash integrity
  crit: suspicious
  conf: 0.97
  attack: T1562.001,T1176
  for:
  - scripts
  - source
  all:
  - id: micro-behaviors/data/config/browser-preference::chromium-secure-prefs-encrypted-hash
  any:
  - id: chromium-encrypted-hash-removal-call
  - id: micro-behaviors/data/manipulation::recursive-named-key-removal-function
  near_bytes: 8192
- id: chromium-secure-prefs-hmac-tamper
  desc: Recalculates Chromium preference MACs with a user SID
  crit: hostile
  conf: 0.99
  attack: T1176,T1562.001
  for:
  - data
  - source
  - '!objectivec'
  - batch
  - javascript
  - lua
  - pe
  - perl
  - php
  - powershell
  - python
  - ruby
  - vbs
  all:
  - id: micro-behaviors/data/config/browser-preference::chromium-profile-secure-preferences-path
  - id: micro-behaviors/data/config/browser-preference::chromium-secure-prefs-mac-fields
  - id: micro-behaviors/crypto/hash/hmac::hmac-user-sid-seed
- id: chromium-secure-prefs-mac-seed-tamper
  desc: Embeds Chromium preference-MAC seed to forge Secure Preferences
  crit: hostile
  conf: 0.99
  attack: T1176,T1562.001
  for:
  - python
  - javascript
  - rust
  - c
  - go
  - csharp
  - powershell
  all:
  - id: micro-behaviors/crypto/hash/hmac::chromium-preference-mac-seed
  - id: micro-behaviors/data/config/browser-preference::chromium-secure-prefs-mac-fields
  - id: micro-behaviors/data/config/browser-preference::chromium-profile-secure-preferences-path
- id: chromium-secure-prefs-integrity-reset
  desc: Resets Chromium Secure Preferences integrity state
  crit: hostile
  conf: 0.98
  attack: T1176,T1562.001
  for:
  - source
  - '!objectivec'
  - batch
  - javascript
  - lua
  - perl
  - php
  - powershell
  - python
  - ruby
  - vbs
  all:
  - id: micro-behaviors/data/config/browser-preference::chromium-profile-secure-preferences-path
  - id: micro-behaviors/data/config/browser-preference::chromium-secure-prefs-mac-fields
  - id: chromium-secure-prefs-encrypted-hash-removal
- id: chromium-native-messaging-host-registration
  desc: Chromium Native Messaging Host registry persistence
  crit: suspicious
  conf: 0.98
  attack: T1112,T1176
  for:
  - data
  - source
  - '!objectivec'
  - batch
  - javascript
  - lua
  - pe
  - perl
  - php
  - powershell
  - python
  - ruby
  - vbs
