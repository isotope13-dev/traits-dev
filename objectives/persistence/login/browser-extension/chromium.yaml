defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1176
  conf: 0.9
traits:
- id: extension-all-urls-permissions
  desc: Extension requests all URLs
  crit: component
  count_min: 2
  if:
    type: hex
    pattern: "3C 00 61 00 6C 00 6C 00 5F 00 75 00 72 00 6C 00 73 00 3E 00"
    section: text
- id: extension-host-access-dnr
  desc: Extension DNR host access
  crit: component
  conf: 0.92
  if:
    type: hex
    pattern: "64 00 65 00 63 00 6C 00 61 00 72 00 61 00 74 00 69 00 76 00 65 00 4E 00 65 00 74 00 52 00 65 00 71 00 75 00 65 00 73 00 74 00 57 00 69 00 74 00 68 00 48 00 6F 00 73 00 74 00 41 00 63 00 63 00 65 00 73 00 73 00"
    section: text
- id: extension-clipboard-read
  desc: Extension clipboard read
  crit: component
  conf: 0.9
  if:
    type: hex
    pattern: "63 00 6C 00 69 00 70 00 62 00 6F 00 61 00 72 00 64 00 52 00 65 00 61 00 64 00"
    section: text
- id: chromium-from-webstore-false
  desc: Chromium extension not webstore
  crit: component
  conf: 0.9
  if:
    type: hex
    pattern: "22 00 66 00 72 00 6F 00 6D 00 5F 00 77 00 65 00 62 00 73 00 74 00 6F 00 72 00 65 00 22 00 3A 00 20 00 66 00 61 00 6C 00 73 00 65 00"
    section: text
- id: chromium-extension-location-external
  desc: Chromium extension external location
  crit: component
  conf: 0.86
  if:
    type: hex
    pattern: "22 00 6C 00 6F 00 63 00 61 00 74 00 69 00 6F 00 6E 00 22 00 3A 00 20 00 34 00"
    section: text
- id: chromium-extension-installer-symbols--installbaseextension
  desc: Chromium extension (InstallBaseExtension)
  crit: component
  conf: 0.95
  if:
    type: text
    word: InstallBaseExtension
- id: chromium-extension-installer-symbols--addextensiontoprefs
  desc: Chromium extension (AddExtensionToPrefs)
  crit: component
  conf: 0.95
  if:
    type: text
    word: AddExtensionToPrefs
- id: chromium-extension-installer-symbols--extensionunpacker
  desc: Chromium extension installer (ExtensionUnpacker)
  crit: component
  conf: 0.95
  if:
    type: text
    word: ExtensionUnpacker
- id: source-extension-native-messaging-permission
  desc: Extension manifest native messaging permission
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [javascript, typescript]
  if:
    type: text
    regex: '["''](permissions|optional_permissions)["'']\s*:\s*\[[^]]{0,80}["'']nativeMessaging["'']'
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
- id: source-extension-cookies-permission
  desc: Extension manifest cookies permission
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [javascript, typescript]
  if:
    type: text
    regex: '["''](permissions|optional_permissions)["'']\s*:\s*\[[^]]{0,80}["'']cookies["'']'
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
- id: source-extension-all-sites-permission
  desc: Extension manifest all-sites permission
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [javascript, typescript]
  if:
    type: text
    regex: '["''](permissions|optional_permissions)["'']\s*:\s*\[[^]]{0,80}["'']<all_urls>["'']'
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
- id: source-chrome-profile-path
  desc: Source references a Chrome profile
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)Chrome[/\\]Default'
- id: source-secure-preferences-name
  desc: Source names Secure Preferences
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [javascript, typescript]
  if:
    type: text
    regex: 'Secure[[:space:]]+Preferences'
- id: source-secure-preferences-mac-field
  desc: Source names a preferences MAC field
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)super[_-]mac|encrypted[_-]hash'
- id: chromium-secure-prefs-hash-reset
  desc: Resets encrypted preference hash
  crit: suspicious
  conf: 0.97
  attack: T1562.001,T1176
  for: [scripts, source, data, pe, dll, elf]
  if:
    type: text
    regex: '(?i)\b(remove_encrypted_hash|clear_encrypted_hash|reset_encrypted_hash)\s*\('
- id: chromium-native-messaging-host-value
  desc: Native Messaging key names executable
  crit: notable
  conf: 0.95
  for: [scripts, source, data, pe, dll, elf]
  if:
    type: text
    regex: '(?i)NativeMessagingHosts[\s\S]{0,120}\.exe\b'
- id: chromium-native-messaging-browser-launch
  desc: Chromium browser launch action
  crit: notable
  conf: 0.9
  for: [scripts, source, data, pe, dll, elf]
  if:
    type: text
    regex: '(?i)\b(start|CreateProcessW|CreateProcessA)\b[^\r\n]{0,80}\b(chrome|msedge)\.exe\b'
composite_rules:
- id: chromium-secure-prefs-hmac-tamper
  desc: Recalculates Chromium preference MACs with a user SID
  crit: hostile
  conf: 0.99
  attack: T1176,T1562.001
  for: [scripts, source, binaries, data]
  all:
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-profile-secure-preferences-path
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-secure-prefs-mac-fields
  - id: micro-behaviors/crypto/hash/hmac::hmac-user-sid-seed

- id: chromium-secure-prefs-mac-seed-tamper
  desc: Embeds Chromium preference-MAC seed to forge Secure Preferences
  crit: hostile
  conf: 0.99
  attack: T1176,T1562.001
  for: [scripts, source, binaries, data]
  # The static Chromium MAC seed exists only to recompute protection.macs.
  # Combined with Secure Preferences path references it is offline profile
  # forgery, not a general HMAC utility.
  all:
  - id: micro-behaviors/crypto/hash/hmac::chromium-preference-mac-seed
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-secure-preferences-file
  any:
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-secure-prefs-mac-fields
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-developer-mode-pref-path
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-profile-secure-preferences-name

- id: chromium-secure-prefs-integrity-reset
  desc: Resets Chromium Secure Preferences integrity state
  crit: hostile
  conf: 0.98
  attack: T1176,T1562.001
  for: [scripts, source, binaries, data]
  all:
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-profile-secure-preferences-path
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-secure-prefs-mac-fields
  - id: chromium-secure-prefs-hash-reset

- id: chromium-native-messaging-host-registration
  desc: Chromium Native Messaging Host registry persistence
  crit: suspicious
  conf: 0.98
  attack: T1112,T1176
  for: [scripts, source, binaries, data]
  all:
  - id: micro-behaviors/os/registry/keys::chromium-native-messaging-hosts-subkey
  - id: chromium-native-messaging-host-value
  any:
  - id: micro-behaviors/os/registry/access::registry-set-value-source
  - id: micro-behaviors/os/registry/access::reg-create-key-ex-w
  - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
  - id: micro-behaviors/os/registry/write/property::powershell-registry-property-write

- id: chromium-browser-native-messaging-child
  desc: Browser Native Messaging child process launch
  crit: suspicious
  conf: 0.96
  attack: T1059,T1559
  for: [scripts, source, binaries, data]
  all:
  - id: micro-behaviors/communications/ipc/named-pipe::chromium-native-messaging-pipe
  - id: chromium-native-messaging-browser-launch
  near_bytes: 512

- id: chromium-secure-prefs-developer-mode-tamper
  desc: Rewrites Secure Preferences for dev mode
  crit: hostile
  conf: 0.97
  attack: T1176,T1562.001
  for: [scripts, source, binaries, data]
  # Developer mode is what lets an unpacked directory load as an extension.
  # Chromium stores it as a MAC-protected pref, so code that writes the pref
  # *and* handles the MAC fields is defeating the integrity check rather than
  # asking the browser to change a setting.
  all:
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-profile-secure-preferences-path
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-developer-mode-pref-path
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-secure-prefs-mac-fields

- id: chromium-iwa-profile-sideload
  desc: Registers a self-signed Isolated Web App
  crit: suspicious
  conf: 0.95
  for: [scripts, source, binaries, data]
  # Supported IWA deployment goes through enterprise policy. Writing the
  # profile's IWA directory and the key-distribution component instead
  # registers a self-signed bundle as if it were trusted.
  all:
  - id: micro-behaviors/fs/path/application/browser::iwa-key-distribution-component
  any:
  - id: micro-behaviors/fs/path/application/browser::iwa-profile-directory
  - id: micro-behaviors/fs/path/application/browser::signed-web-bundle-file

- id: chromium-iwa-direct-sockets-proxy
  desc: Isolated Web App proxies via Direct Sockets
  crit: hostile
  conf: 0.96
  attack: T1090,T1176
  for: [scripts, source, binaries, data]
  # Direct Sockets is reachable only from an IWA. A listening raw socket in
  # that context speaking SOCKS is a pivot into the host's network, not a
  # feature a web app has any other reason to implement.
  all:
  - id: micro-behaviors/communications/socket/listen::direct-sockets-tcp-server
  - id: micro-behaviors/communications/url/scheme::isolated-app-origin-scheme
  - id: micro-behaviors/communications/proxy/socks::socks5-proto

- id: native-messaging-host-staging-executable
  desc: Native host manifest names a staged binary
  crit: suspicious
  conf: 0.94
  attack: T1176,T1559
  for: [json, scripts, source, data]
  # A host manifest is a grant to launch a named binary from the browser.
  # Legitimate hosts ship beside their application; one staged under a user's
  # Downloads directory, ProgramData, or Users\Public is an implant being
  # wired into the browser.
  all:
  - id: micro-behaviors/communications/ipc/native-host::native-messaging-host-manifest
  any:
  - id: micro-behaviors/fs/path/location::programdata-executable-path
  - id: micro-behaviors/fs/path/location::users-public-executable-path
  - id: micro-behaviors/fs/path/location::json-win-downloads-executable-path

# Vendor-looking native-messaging identities (com.microsoft.*) paired with a
# staged Downloads/Public host binary are sandbox-escape implants masquerading
# as browser components — not sideloaded first-party helpers.
- id: vendor-masquerade-staged-native-messaging-host
  desc: Vendor-prefixed native host staged outside apps
  crit: suspicious
  conf: 0.97
  attack: T1036.005,T1176,T1559
  for: [json, scripts, source, data]
  all:
  - id: metadata/vendor/string::microsoft-reverse-dns-identifier
  - id: native-messaging-host-staging-executable

- id: chromium-isolated-web-app-socks-pivot
  desc: Chromium isolated web app launch paired with SOCKS5 proxying
  crit: suspicious
  conf: 0.95
  attack: T1090,T1176
  for: [scripts, source, binaries, data]
  all:
  - id: micro-behaviors/process/create/flags::chromium-isolated-web-app-renderer-flag
  - id: micro-behaviors/process/create/flags::chromium-isolated-web-app-id-flag
  - id: micro-behaviors/communications/proxy/socks::socks5-proto

- id: source-broad-extension-permissions
  desc: Source embeds a broad browser extension permission set
  crit: suspicious
  conf: 0.96
  platforms: [unix]
  for: [javascript, typescript]
  near_lines: 20
  all:
  - id: micro-behaviors/process/attach/webextension::chrome-debugger-api
  - id: source-extension-native-messaging-permission
  - id: source-extension-cookies-permission
  - id: source-extension-all-sites-permission
- id: source-secure-preferences-extension-persistence
  desc: Node patches Chromium Secure Preferences for a broad-permission extension
  crit: hostile
  conf: 0.99
  attack: T1176,T1555.003
  platforms: [unix]
  for: [javascript, typescript]
  scope: leaf
  all:
  - id: source-chrome-profile-path
  - id: source-secure-preferences-name
  - id: source-secure-preferences-mac-field
  - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
  - id: source-broad-extension-permissions
- id: chromium-extension-installer-symbols
  desc: Chromium extension installer symbols
  crit: component
  conf: 0.95
  any:
  - id: chromium-extension-installer-symbols--installbaseextension
  - id: chromium-extension-installer-symbols--addextensiontoprefs
  - id: chromium-extension-installer-symbols--extensionunpacker
- id: high-risk-extension-permissions
  desc: High-risk extension permissions
  crit: suspicious
  conf: 0.93
  all:
  - id: extension-all-urls-permissions
  any:
  - id: extension-host-access-dnr
  - id: extension-clipboard-read
- id: chromium-local-extension-prefs
  desc: Chromium local extension prefs
  crit: component
  conf: 0.9
  all:
  - id: chromium-from-webstore-false
  - id: chromium-extension-location-external
- id: chromium-local-extension-install
  desc: Local Chromium extension installation
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-profile-extension-files
  - id: chromium-extension-installer-symbols
  any:
  - id: chromium-local-extension-prefs
  - id: high-risk-extension-permissions
# Chromium keeps three separate pieces of state whose only purpose is to stop a
# side-loaded extension from silently sticking: the sideload wipeout list (the
# browser disables externally-installed extensions it did not see installed),
# the enable-time warning, and the record of extensions the user is known to
# have disabled. Chromium writes all three; nothing outside Chromium has a
# reason to know their names, and code that spells out more than one of them is
# manipulating the anti-sideload machinery rather than configuring a browser.
#
# Requiring two of the three keeps a single incidental reference -- a
# preference dumper, a Chromium-derived product -- below the bar, and the
# `unless:` stands the rule down inside browser source trees, where the names
# legitimately appear as constants.
- id: chromium-sideload-protection-defeat
  desc: Defeats Chromium side-load extension protections
  crit: hostile
  conf: 0.96
  attack: T1176,T1562.001
  for: [scripts, source, binaries, data]
  any:
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-sideload-wipeout-exemption
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-enable-warning-suppression
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-known-disabled-extensions
  needs: 2
  unless:
  - id: well-known/app/browser/
  - id: well-known/unwanted/amonetize::aminsis-plugin-library-context

# Enterprise policy installs an extension the user cannot remove, and
# `gpupdate /force` makes it take effect immediately instead of at the next
# policy refresh. Management tooling writes the same key, which is why this is
# suspicious and not hostile on its own -- what it is not is something an
# application installer has any business doing to the user's browser.
- id: chrome-policy-forced-extension-install
  desc: Force-installs a Chrome extension via policy
  crit: suspicious
  conf: 0.95
  attack: T1176,T1112
  for: [scripts, source, binaries, data]
  all:
  - id: micro-behaviors/os/registry/keys::chrome-extension-force-install-policy-key
  any:
  - id: micro-behaviors/os/registry/keys::chrome-extension-whitelist-policy-key
  - id: micro-behaviors/os/security/policy::gpupdate-force
  - id: micro-behaviors/os/security/policy::gpupdate-executable-reference
  unless:
  - id: well-known/app/browser/
  - id: well-known/unwanted/amonetize::aminsis-plugin-library-context

- id: chromium-secure-prefs-extension-persistence
  desc: Forced Chromium extension persistence
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/fs/path/sensitive/browser::chromium-secure-prefs-mac-fields
  - id: chromium-local-extension-install
  any:
  - id: high-risk-extension-permissions
  - id: micro-behaviors/communications/http/client/managed::downloaddata
  - id: objectives/evasion/self-delete/file/batch::batch-ping-delay-delete
  needs: 2
