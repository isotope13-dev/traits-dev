# The worker re-installs a hardcoded proxy on every browser start. The
# proxy setting survives restarts without the user re-enabling anything,
# keeping traffic flowing through the operator's host. A hardcoded proxy
# on its own is a known notable shape (single-purpose proxy helpers), so
# the startup re-apply raises it to suspicious, not hostile.
defaults:
  platforms: [unix, windows]
  attack: T1176,T1090

composite_rules:
  - id: startup-hardcoded-proxy-reapply
    desc: Hardcoded browser proxy re-applied on every browser startup
    crit: suspicious
    conf: 0.84
    scope: leaf
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-literal-single-host
