defaults:
  platforms:
    - windows
  for:
    - powershell
  attack: T1176

composite_rules:
  - id: powershell-forced-extension-with-policy-key
    desc: PowerShell forces remote browser extension via policy key
    crit: hostile
    conf: 0.96
    all:
      - id: powershell-force-installed-extension-policy
      - id: micro-behaviors/os/registry/policy/reference::chrome-extension-force-install-policy-key
