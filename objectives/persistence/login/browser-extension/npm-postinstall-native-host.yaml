# Browser trust edit performed by a package install hook.
#
# A Chromium native-messaging host manifest tells the browser which local
# executable an extension may launch, for every profile on the machine. A
# postinstall hook that writes that manifest runs with no user step and
# outlives the package. Installers that register a native helper legitimately
# do the same, so the composite stays suspicious. It requires the install
# hook and the manifest writer in one package archive, so an unrelated
# postinstall or a stray JavaScript mention does not qualify.
# ATT&CK: T1176 (browser extensions), T1195.002 (supply chain software)
defaults:
  platforms: [windows, unix]
  attack: T1176

composite_rules:
  - id: npm-postinstall-registers-native-host-manifest
    desc: npm postinstall writes a native messaging host manifest
    crit: suspicious
    conf: 0.9
    scope: archive
    for: [npm, tar, package.json, javascript, typescript]
    attack: "T1176,T1195.002"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/communications/ipc/native-host::native-messaging-host-js-manifest
