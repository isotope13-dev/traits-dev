defaults:
  platforms: [unix]
  for: [python]
  attack: T1195.002,T1547.004,T1496
  mbc: E1547

composite_rules:
- id: python-install-hook-obfuscated-profile-append
  desc: Obfuscated setup hook appends decoded content to a shell profile
  crit: hostile
  conf: 0.98
  scope: file
  all:
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
  - id: micro-behaviors/data/string/conversion::python-join-chr-generator
  - id: micro-behaviors/data/string/conversion::python-chr-call
  - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
