defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-password-ssh-authorized-key-command"
    desc: "Lua SSH command appends an authorized key"
    crit: "suspicious"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      exact: "string.format"
      arg:
        index: 0
        kind: "string"
        regex: "sshpass -p.{1,180}echo.{1,60}>>\\s*~?/\\.ssh/authorized_keys"
composite_rules:
  - id: "lua-credential-loop-installs-ssh-key"
    desc: "Lua cycles SSH passwords and constructs remote authorized-key installation"
    crit: "hostile"
    conf: 0.97
    all:
      - id: "lua-password-ssh-authorized-key-command"
      - id: "objectives/lateral-movement/brute-force/raw-ssh::lua-password-ssh-loop"
