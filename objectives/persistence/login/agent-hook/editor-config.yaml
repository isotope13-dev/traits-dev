defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059

traits:
  - id: editor-hooks-json-reference
    desc: References editor hooks configuration
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: hooks.json

  - id: editor-hook-type-field
    desc: References hookType configuration field
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: .hookType

composite_rules:
  - id: editor-hooks-with-script-content-write
    desc: Script content writes alongside editor hooks
    crit: suspicious
    conf: 0.95
    all:
      - id: editor-hooks-json-reference
      - id: editor-hook-type-field
      - id: micro-behaviors/fs/write/file/full/bytes::script-content-replaced-then-written
      - id: well-known/lib/development/vscode::require-vscode
