defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059

traits:
  - id: cursor-hooks-config-key
    desc: References Cursor hooks configuration key
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: cursor_hooks_config

  - id: apollo-config-endpoint
    desc: References Apollo configuration endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: .ENDPOINTS.APOLLO

composite_rules:
  - id: fetched-hooks-and-cursor-token-query
    desc: Fetches editor hooks and queries Cursor tokens
    crit: hostile
    conf: 0.97
    all:
      - id: cursor-hooks-config-key
      - id: apollo-config-endpoint
      - id: micro-behaviors/data/db/write::fetched-cursor-hooks-to-sync
      - id: objectives/persistence/login/agent-hook::editor-hooks-with-script-content-write
      - id: objectives/credential-access/dev-tools/cursor::sqlite-command-session-and-refresh
