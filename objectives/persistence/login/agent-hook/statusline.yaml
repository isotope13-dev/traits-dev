# Claude Code runs settings.statusLine.command on every prompt render. An
# editor extension that writes a command-type statusLine into the user's
# global ~/.claude/settings.json plants a recurring command in a different
# product. Stand-alone status-line CLIs configure themselves; they do not
# load the editor extension API.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1546

traits:
  - id: statusline-command-object
    desc: Builds a command-type status line setting
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'statusLine["'']?\s*[:=]\s*\{\s*["'']?type["'']?\s*:\s*["'']command["'']'

composite_rules:
  - id: editor-extension-sets-claude-statusline
    desc: IDE extension plants Claude statusLine command
    crit: suspicious
    conf: 0.9
    all:
      - id: statusline-command-object
      - id: well-known/lib/development/vscode::require-vscode
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step
