# Persistence by hijacking an AI coding agent's hook system.
#
# Claude Code (and similar agents) run configured hooks on session lifecycle
# events. Writing a `SessionStart` hook whose entry runs a shell command makes
# that command execute every time the agent starts a session — a recurring,
# user-invisible re-execution trigger (event-triggered persistence). Seen in
# obfuscated npm droppers that assemble a settings.json hooks block at runtime.
# ATT&CK: T1546 (event-triggered execution)  MBC: B0024
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, python]
  attack: T1546

composite_rules:
  - id: claude-session-hook-command-install
    desc: Configures Claude session hook command
    crit: notable
    conf: 0.9
    for: [typescript, shell]
    unless:
      - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hooks-config-key
      - id: micro-behaviors/data/format/json::json-string-command-field

  - id: ai-agent-hook-config-install
    desc: Installs a shell interception hook
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-config-write
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-shell-command-matcher
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-command-config-entry
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-allowlist-entry
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
    near_lines: 140

  - id: ai-agent-hook-installer-persistence
    desc: Installer writes recurring AI agent shell hooks
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    attack: "T1195.002,T1546"
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/communications/ipc/agent-hook::agent-lifecycle-hook-property
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-shell-script-command
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
    near_lines: 100

  - id: npm-install-hook-writes-agent-tool-hooks
    for: [javascript, typescript, shell, python, package.json, npm]
    desc: npm install hook writes AI agent tool hooks
    crit: suspicious
    conf: 0.96
    attack: "T1195.002,T1546"
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/communications/ipc/agent-hook::agent-pretooluse-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-posttooluse-hook
    unless:
      # A defensive agent sandbox ships its own hook implementations and a
      # postinstall that regenerates committed artifacts; archive pooling
      # reads that as an install hook wiring tool hooks.
      - id: well-known/tool/detection/agent-glovebox::archive-context
      # An openly described AI coding harness is expected to install its own
      # agent hooks; transcript collection remains a separate warning.
      - id: metadata/package/description/function::agent-tool-purpose-description-context
      - id: objectives/supply-chain/install-hook/skill-agent::great-cto-noop-postinstall-context
      - id: well-known/app/ai/coding-agent/agent-takkub::archive-context
      - id: well-known/app/ai/coding-agent/0xray::archive-context
      - id: well-known/app/ai/coding-agent/codyswann-lisa/
      # An installed macOS application bundle is not a package awaiting
      # installation: a scripts.postinstall in a manifest shipped inside a
      # built .app is a development-time leftover no consumer's package
      # manager ever runs, and hook-protocol strings plus file writes
      # elsewhere in the bundle are unrelated editor functionality
      # coinciding archive-wide (VSCodium's own manifest beside its
      # extension-host hook support and build helpers).
      - id: metadata/package/files/archive-member::macos-app-bundle-member

  # Session hook combined with a network-fetch command.
  - id: claude-session-hook-network-beacon
    desc: AI agent session hook beacons to network
    crit: hostile
    conf: 0.9
    for: [typescript, shell]
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart
      # shell-curl-wget-url-fetch (micro-behaviors/communications/http/
      # download/shell) is symbol/call-based and `for: [shell]` only -- a JS
      # dropper's curl call is a string argument to exec/spawn, not a native
      # call site. fetch-command-position-script is the existing text-based
      # curl/wget matcher already scoped for javascript/typescript/shell.
      - id: micro-behaviors/communications/http/download/cli::fetch-command-position-script
    any:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::js-file-write
    near_lines: 80
    unless:
      - id: micro-behaviors/communications/ip/endpoint::loopback-ipv4-text
    downgrade:
      any:
        - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-updated-input
        - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-output-block
        - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-permission-decision

  - id: ai-agent-hook-telemetry-persistence
    for: [javascript, typescript, shell, python, npm]
    desc: AI agent hooks install recurring telemetry reporter
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-userpromptsubmit-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-posttooluse-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-command-entry
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
    unless:
      - id: well-known/app/ai/usage/vibetime::vibetime-cli-source-context

  - id: ai-agent-session-memory-sync-persistence
    for: [javascript, typescript, shell, python, npm]
    desc: AI agent session hook syncs memory
    crit: hostile
    conf: 0.96
    scope: archive
    ref: sha256:ffbf482c4b6c5a57944da3576001f383e4cb61bce3ed008b813487357e49e107
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hooks-config-key
      - id: micro-behaviors/communications/ipc/agent-hook::agent-memory-sync-command
    any:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-text

  # Planting a SessionStart hook while freezing the agent's auto-updater and
  # writing the Anthropic token is not a benign "router": the hook re-fires on
  # every session and the updater pin keeps the hijack in place.
