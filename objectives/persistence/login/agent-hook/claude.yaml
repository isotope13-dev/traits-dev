# Persistence by hijacking an AI coding agent's hook system.
#
# Claude Code (and similar agents) run configured hooks on session lifecycle
# events. Writing a `SessionStart` hook whose entry runs a shell command makes
# that command execute every time the agent starts a session — a recurring,
# user-invisible re-execution trigger (event-triggered persistence). Seen in
# obfuscated npm droppers that assemble a settings.json hooks block at runtime.
# ATT&CK: T1546 (event-triggered execution)  MBC: B0024
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, python]
  attack: T1546

composite_rules:
  - id: agent-skill-sessionstart-remote-pipeline
    desc: Agent skill contains a remote-shell SessionStart hook
    crit: hostile
    conf: 0.99
    for: [zip, tar, gz, markdown, shell]
    scope: archive
    attack: "T1059.004,T1546,T1195.002"
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      # Require the hook and pipeline in one member. Pooling their atoms
      # across a skill archive also convicted local hooks shipped alongside
      # unrelated installers. The member rule retains the proximity check.
      - id: agent-sessionstart-hook-pipes-remote-script

  # Require the global settings path and hook writes in the same source file.
  # Archive pooling of independent atoms can combine a settings reader with
  # a separate temporary hook builder. A postinstall elsewhere in the package
  # is still a clue, not proof that it invokes this writer.
  - id: npm-postinstall-installs-global-claude-lifecycle-hooks
    desc: Postinstall package contains global Claude hook writer
    crit: suspicious
    conf: 0.98
    scope: archive
    for: [npm, tar, package.json, javascript, typescript]
    attack: "T1195.002,T1546"
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: global-claude-lifecycle-hook-writer

  - id: global-claude-lifecycle-hook-writer
    desc: Global Claude settings path and lifecycle hook writer
    crit: component
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step
      - id: micro-behaviors/communications/ipc/agent-hook::agent-lifecycle-hook-property
      - id: micro-behaviors/communications/ipc/agent-hook::agent-posttooluse-hook-member
      - id: micro-behaviors/communications/ipc/agent-hook::agent-userpromptsubmit-hook-member
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call

  - id: claude-session-hook-command-install
    desc: Configures Claude session hook command
    crit: notable
    conf: 0.9
    for: [typescript, shell]
    unless:
      - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hooks-config-key
      - id: metadata/lang/source/syntax/key-value::quoted-command-string-field

  - id: ai-agent-hook-config-install
    desc: Installs a shell interception hook
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-config-write
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-shell-command-matcher
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-command-config-entry
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-allowlist-entry
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
    near_lines: 140

  - id: ai-agent-hook-installer-persistence
    desc: Installer writes recurring AI agent shell hooks
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    attack: "T1195.002,T1546"
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/communications/ipc/agent-hook::agent-lifecycle-hook-property
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-shell-script-command
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync
    near_lines: 100

  # Source that builds a SessionStart hook whose command pipes a download into
  # a shell re-runs mutable remote code at the start of every agent session.
  # The proximity component binds the hook key to the pipeline; the outer rule
  # requires the agent config directory so generic installers do not qualify.
  - id: sessionstart-key-near-download-pipe-shell
    desc: SessionStart key near download-to-shell pipeline
    crit: component
    conf: 0.95
    for: [javascript, typescript, python]
    near_lines: 50
    # Bundled source can put unrelated installers and hook tables on adjacent
    # lines spanning megabytes. Bound bytes as well as source lines.
    near_bytes: 1500
    all:
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
    any:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-config-key
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart

  - id: sessionstart-key-near-shell-command-field
    desc: SessionStart key near download-to-shell command field
    crit: component
    for: [shell]
    near_lines: 50
    all:
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shell-remote-pipeline-command-field
    any:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-config-key
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart

  - id: claude-sessionstart-remote-script-hook-installer
    desc: Claude SessionStart hook near remote shell pipeline
    crit: suspicious
    conf: 0.97
    attack: "T1546,T1059.004,T1105"
    all:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
    any:
      - id: sessionstart-key-near-download-pipe-shell
      - id: sessionstart-key-near-shell-command-field
    unless:
      - id: well-known/tool/detection/threat-intel/

  - id: ai-agent-hook-telemetry-persistence
    for: [javascript, typescript, shell, python, npm]
    desc: AI agent hooks install recurring telemetry reporter
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-userpromptsubmit-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-posttooluse-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-command-entry
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-script
    unless:
      - id: well-known/app/ai/usage/vibetime::vibetime-cli-source-context

  - id: ai-agent-session-memory-sync-persistence
    for: [javascript, typescript, shell, python, npm]
    desc: AI agent session hook syncs memory
    crit: hostile
    conf: 0.96
    scope: archive
    ref: sha256:ffbf482c4b6c5a57944da3576001f383e4cb61bce3ed008b813487357e49e107
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-session-hook--sessionstart
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hooks-config-key
      - id: micro-behaviors/communications/ipc/agent-hook::agent-memory-sync-command
    any:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/write/file/full/string::python-pathlib-write-text

  # Planting a SessionStart hook while freezing the agent's auto-updater and
  # writing the Anthropic token is not a benign "router": the hook re-fires on
  # every session and the updater pin keeps the hijack in place.

  - id: agent-sessionstart-hook-pipes-remote-script
    for: [shell]
    desc: SessionStart config near a remote-shell command field
    crit: hostile
    conf: 0.95
    attack: T1546,T1105
    near_bytes: 1500
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-sessionstart-config-key
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::shell-command-field-download-pipeline
