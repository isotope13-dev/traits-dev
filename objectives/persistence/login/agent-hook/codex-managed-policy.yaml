# Require enabled policy, a system path, a tool hook and a write call.
# Readers and process-private temporary requirements are not system installers.
# Co-occurrence supports preparation, not proof of a completed policy write.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1546

traits:
  - id: codex-allow-managed-hooks-only-key
    desc: Codex policy disables non-managed hooks
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'allow_managed_hooks_only\s*[:=]\s*true\b'

  - id: codex-requirements-toml-path
    desc: Codex system requirements.toml path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/etc/codex/requirements\.toml|OpenAI[''"],\s*[''"]Codex[''"],\s*[''"]requirements\.toml'

composite_rules:
  - id: codex-managed-policy-hook-takeover
    desc: Prepares machine-wide Codex managed-only PreToolUse hooks
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: codex-allow-managed-hooks-only-key
      - id: codex-requirements-toml-path
      - id: micro-behaviors/communications/ipc/agent-hook::agent-pretooluse-hook
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
