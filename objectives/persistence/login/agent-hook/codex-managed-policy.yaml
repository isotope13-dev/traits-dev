# Machine-wide Codex managed policy writer. Codex reads requirements.toml from a
# system location; a package that writes allow_managed_hooks_only = true there
# turns off every user and project hook and installs its own PreToolUse command
# for all Codex processes on the host. The write is persistence and policy
# override, not a per-project hook. A postinstall that ships the writer is a
# clue only; the composite is file-local so the same writer must hold the policy
# key, the requirements path, and the PreToolUse command.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1546

traits:
  - id: codex-allow-managed-hooks-only-key
    desc: Codex policy disables non-managed hooks
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: allow_managed_hooks_only

  - id: codex-requirements-toml-path
    desc: Codex system requirements.toml path
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: requirements.toml

composite_rules:
  - id: codex-managed-policy-hook-takeover
    desc: Writes machine-wide Codex policy with a managed PreToolUse hook
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: codex-allow-managed-hooks-only-key
      - id: codex-requirements-toml-path
      - id: micro-behaviors/communications/ipc/agent-hook::agent-pretooluse-hook
