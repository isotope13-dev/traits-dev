defaults:
  for: [msi, oledoc]
  platforms: [windows]
  attack: T1547.001,T1059.005

composite_rules:
  - id: msi-startup-silent-script-launch
    desc: MSI includes Startup folder and silent VBS launch arguments
    crit: suspicious
    all:
      - id: micro-behaviors/fs/path/autostart::msi-startup-folder-property
      - id: micro-behaviors/process/interpreter/wsh::msi-silent-vbs-launch-arguments
