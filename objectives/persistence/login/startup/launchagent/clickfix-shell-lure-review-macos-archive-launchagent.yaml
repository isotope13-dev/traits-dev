defaults:
  crit: hostile
  conf: 0.99
  platforms: [macos]
  for: [shell]
  attack: T1105
  mbc: B0024


composite_rules:
  - id: downloaded-archive-launchagent
    desc: Download, archive extraction and LaunchAgent installation
    attack: T1059.004,T1105,T1543.004,T1204.002
    all:
      - id: micro-behaviors/communications/tls/verify/disable::curl-insecure
      - id: micro-behaviors/communications/http/download/curl::curl-zip-output
      - id: micro-behaviors/data/archive/extract/zip::unzip-quiet-dir
      - id: micro-behaviors/os/service/launchagent::shell-launchagent-plist-write
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
    near_lines: 30
  - id: detached-launchagent-chmod
    desc: Detached launch with executable permissions and LaunchAgent write
    attack: T1059.004,T1222.002,T1543.004,T1204.002
    all:
      - id: micro-behaviors/os/service/launchagent::shell-launchagent-plist-write
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
    near_lines: 25
