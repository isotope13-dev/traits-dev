defaults:
  platforms: [macos]
  for: [ruby]
  crit: hostile
  attack: T1543.004,T1059.004

composite_rules:
  - id: ruby-launchagent-remote-shell-autorun
    desc: Ruby installs autostart remote shell LaunchAgent
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/launchagent::ruby-write-autostart-shell-loader-plist
      - id: micro-behaviors/os/service/start::launchctl-load-command
