# An Apple-named LaunchAgent that runs a hidden user script at load and keeps
# it alive is persistence with vendor-identity masquerading.
defaults:
  platforms: [macos]
  for: [javascript, typescript]
  attack: T1543.001,T1036.004

composite_rules:
  - id: node-persistent-apple-labeled-launchagent
    desc: Apple-labeled LaunchAgent persists at login
    crit: hostile
    conf: 0.99
    near_bytes: 2200
    all:
      - id: objectives/evasion/masquerade/identity/service::user-launchagent-apple-label-masquerade
      - id: micro-behaviors/os/service/launchagent::launchagent-run-at-load
      - id: micro-behaviors/os/service/launchagent::launchagent-keepalive-key
      - id: micro-behaviors/os/service/launchagent::source-launchagent-load

