defaults:
  platforms: [macos]
  for: [python]
composite_rules:
  - id: python-apple-label-remote-shell-autorun
    desc: Apple-labeled login agent runs remote shell
    crit: hostile
    conf: 0.98
    attack: T1543.001,T1036.004
    all:
      - id: objectives/evasion/masquerade/identity/service::user-launchagent-apple-label-masquerade
      - id: micro-behaviors/os/service/launchagent::python-written-launchagent-load-flow
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key
      - id: metadata/lang/source/syntax/argument::plist-shell-c-string-curl-pipe-shell
  - id: python-written-apple-label-raw-ip-shell-autorun
    desc: Writes Apple-labeled raw-IP shell login agent
    crit: hostile
    conf: 0.98
    attack: T1543.001,T1036.004,T1105
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/service/launchagent::python-written-autostart-remote-shell-agent
      - id: micro-behaviors/os/service/launchd/config::launchd-label-apple-namespace
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
