defaults:
  platforms: [macos]
  for: [python]
composite_rules:
  - id: python-apple-label-remote-shell-autorun
    desc: Apple-labeled login agent runs remote shell
    crit: hostile
    conf: 0.98
    attack: T1543.001,T1036.004
    all:
      - id: objectives/evasion/masquerade/identity/service::user-launchagent-apple-label-masquerade
      - id: micro-behaviors/os/service/launchagent::python-written-launchagent-load-flow
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/process/create/shell/command-string::plist-shell-c-string-curl-pipe-shell
