defaults:
  platforms: [macos]
  for: [rust]

composite_rules:
  - id: rust-installed-remote-shell-agent
    desc: Rust installs recurring remote-shell loader LaunchAgent
    crit: hostile
    conf: 0.98
    attack: T1543.001,T1105,T1059.004
    near_lines: 32
    all:
      - id: micro-behaviors/os/service/launchagent::rust-write-remote-shell-agent
      - id: micro-behaviors/os/service/launchagent::source-launchagent-remote-shell-autorun
      - id: micro-behaviors/os/service/launchagent::source-startinterval-key
