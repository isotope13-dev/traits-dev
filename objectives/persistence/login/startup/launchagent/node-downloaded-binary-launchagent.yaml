# Node code that streams a download into a hidden home directory, strips
# every extended attribute from it (removing the quarantine flag that
# would trigger Gatekeeper), and loads a RunAtLoad LaunchAgent for it
# installs that unsigned download as login persistence while bypassing
# the check meant to vet it. Legitimate updaters ship a signed, notarized
# agent and have no reason to clear its attributes. Hosts, labels and
# whether the agent starts the binary directly or through a launcher
# script are not legs.
defaults:
  platforms: [macos]
  for: [javascript, typescript]
  attack: T1543.001,T1105,T1553.001
  mbc: B0028

composite_rules:
  - id: node-downloaded-binary-quarantine-stripped-launchagent
    desc: Quarantine-stripped download persisted as LaunchAgent
    crit: hostile
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/download/handler::node-https-get-write-stream-pipe
      - id: micro-behaviors/fs/path/hidden::node-homedir-hidden-entry
      - id: micro-behaviors/os/service/launchagent::launchagent-run-at-load
      - id: micro-behaviors/os/service/launchagent::source-launchagent-load
    any:
      - id: micro-behaviors/fs/attributes/xattr::node-xattr-clear-argv
      - id: micro-behaviors/fs/attributes/xattr::node-quarantine-attribute-delete
      - id: micro-behaviors/fs/attributes/xattr::node-xattr-clear
