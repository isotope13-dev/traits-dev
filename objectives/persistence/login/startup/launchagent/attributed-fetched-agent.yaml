# Pay-per-install macOS adware droppers (Adload/Bundlore-style pkg hooks and
# .command loaders) read the installer's own download-origin metadata to
# credit an affiliate, fetch an agent that the package does not ship, then
# synthesize and load an autostart LaunchAgent for it. Legitimate updaters ship
# a signed agent and plist in the payload. The hostile rule additionally
# requires a hardware identifier, the per-device key these installers beacon.
# Names, hosts, intervals and package paths are deliberately not legs.
defaults:
  platforms: [macos]
  for: [shell]

composite_rules:
  - id: affiliate-tracked-fetched-launchagent
    desc: Affiliate-tracked script installs fetched LaunchAgent
    crit: suspicious
    conf: 0.95
    attack: T1543.001,T1105
    all:
      - id: micro-behaviors/fs/attributes/xattr::shell-read-download-origin
      - id: micro-behaviors/communications/url/query/tracking::shell-extract-affiliate-url-param
      - id: micro-behaviors/communications/http/download/cli/curl-wget::fetch-output-option-script
      - id: micro-behaviors/os/service/launchagent::plist-tool-builds-autostart-launchagent
    any:
      - id: micro-behaviors/os/service/start::shell-launchctl-load
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-command

  - id: fingerprinted-affiliate-agent-dropper
    desc: Fingerprinting PPI dropper persists fetched agent
    crit: hostile
    conf: 0.96
    attack: T1543.001,T1105,T1082
    all:
      - id: affiliate-tracked-fetched-launchagent
    any:
      - id: micro-behaviors/os/sysinfo/machine-id::shell-hardware-serial-query
      - id: micro-behaviors/os/sysinfo/machine-id::shell-ioreg-serial-query
      - id: micro-behaviors/os/sysinfo/machine-id::macos-ioreg-platform-expert-query
