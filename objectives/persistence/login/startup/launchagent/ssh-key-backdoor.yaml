defaults:
  platforms: [macos]
  for: [scripts, source]
  attack: T1098.004,T1543.001

composite_rules:
  # LaunchAgents reactivate in user sessions. SSH service enablement can fail
  # independently of planting the key and installing the agent.
  - id: ssh-key-backdoor-launchagent
    desc: SSH key backdoor installs a LaunchAgent
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
