defaults:
  platforms: [macos]
  for: [scripts, source]

composite_rules:
  - id: ssh-key-backdoor-launchagent
    desc: SSH key backdoor installs a login LaunchAgent
    crit: hostile
    conf: 0.99
    attack: T1098.004,T1543.001
    # Service enablement is independent of writing the key and login job.
    # As with the Startup-folder rule, a planted key plus a forward of the
    # local sshd is the access mechanism; host-key bypass is incidental.
    any:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-local-sshd-reverse-forward
    all:
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key

  # Reverse SSH at login is dual use; no family marker or host-key bypass is
  # required. Key planting and other attack context remain separate findings.
  - id: local-sshd-reverse-forward-launchagent
    desc: LaunchAgent setup accompanies reverse SSH access
    crit: suspicious
    conf: 0.96
    attack: T1543.001,T1572
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key
