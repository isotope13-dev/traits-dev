defaults:
  platforms: [macos]
  for: [scripts, source]

composite_rules:
  - id: ssh-key-backdoor-launchagent
    desc: SSH key backdoor installs a login LaunchAgent
    crit: hostile
    conf: 0.99
    attack: T1098.004,T1543.001
    # Service enablement is independent of writing the key and login job.
    all:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
      - id: micro-behaviors/os/service/launchd/config::source-runatload-key
