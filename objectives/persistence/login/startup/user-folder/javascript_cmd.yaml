defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: js-startup-persistence-cmd
    description: JavaScript writes a command launcher into the Windows Startup folder
    all:
    - id: micro-behaviors/fs/path/autostart::windows-startup-directory
    - id: micro-behaviors/fs/write/file/full::write-file-async
    - id: micro-behaviors/fs/path/extension::cmd-dup
    near_bytes: 2048
    crit: suspicious
    for:
    - javascript
    - typescript
    conf: 0.95
  # The Startup write plus the WMI Win32_Process launch of the planted batch
  # is login persistence with concealed execution: the dropper survives the
  # reboot and the launcher run never appears as a wscript child. Writing a
  # batch into Startup is a capability; binding it to the WMI process-create
  # call is the hostile implant shape.
  - id: js-startup-batch-wmi-launch
    description: JavaScript plants a Startup batch and launches it through WMI
    all:
    - id: micro-behaviors/fs/path/autostart::wsh-special-folders-startup
    - id: micro-behaviors/fs/write/content::create-batch-from-bound-path
    - id: micro-behaviors/os/wmi/query::win32-process-query
    crit: hostile
    for:
    - javascript
    conf: 0.94
    attack: T1547.001,T1047
