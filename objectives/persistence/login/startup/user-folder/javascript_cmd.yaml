defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: js-startup-persistence-cmd
    description: JavaScript writes a command launcher into the Windows Startup folder
    # Autostart is a real persistence capability, but is also an explicit
    # service-install feature in legitimate applications.
    criticality: notable
    all:
      - id: objectives/persistence/login/startup/folder::win-startup-path
      - id: micro-behaviors/fs/write/file/direct::write-file-async
      - id: micro-behaviors/fs/path/extension::cmd-dup
    near_bytes: 2048
