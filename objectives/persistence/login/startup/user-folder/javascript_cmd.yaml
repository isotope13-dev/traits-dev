defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: js-startup-persistence-cmd
    description: JavaScript writes a command launcher into the Windows Startup folder
    all:
    - id: micro-behaviors/fs/path/autostart::windows-startup-directory
    - id: micro-behaviors/fs/write/file/full::write-file-async
    - id: micro-behaviors/fs/path/extension::cmd-dup
    near_bytes: 2048
    crit: suspicious
    for:
    - javascript
    - typescript
    conf: 0.95
  # Require a Startup-derived creation path, a written download/eval cradle,
  # hidden PowerShell options and an actual WMI process-create call. These
  # operation relationships replace the old unbound names/API co-occurrence.
  - id: js-startup-batch-wmi-launch
    description: Startup file creation with hidden remote eval and WMI launch
    all:
    - id: micro-behaviors/fs/write/content::create-text-file-in-startup
    - id: micro-behaviors/fs/write/content::create-batch-from-bound-path
    - id: micro-behaviors/fs/write/content::text-file-write-powershell-cradle
    - id: micro-behaviors/process/create/exec::js-wmi-process-create
    - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
    crit: hostile
    for:
    - javascript
    conf: 0.94
    attack: T1547.001,T1047
