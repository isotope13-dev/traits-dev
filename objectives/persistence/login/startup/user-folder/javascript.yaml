# Windows Startup Persistence - JavaScript
# Composed objectives for JS startup persistence
defaults:
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: js-win-startup-persistence
    desc: Windows Startup folder persistence via JavaScript
    crit: hostile
    conf: 0.95
    attack: T1547.001
    all:
      - id: objectives/persistence/login/startup/folder::win-startup-path
      - id: micro-behaviors/fs/write/file/direct::write-file-async
    # Keep the path and write operation in one call site.  A bundled
    # application commonly writes unrelated settings files elsewhere in the
    # same module, which is not Startup-folder persistence.
    near_bytes: 2048

  - id: js-encoded-startup-persistence
    desc: Encoded Startup persistence via JavaScript
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1027,T1195.002
    all:
      - id: micro-behaviors/data/encode/char-code::encoded-windows-startup-path
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync-call
      - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
