# Windows Startup Persistence - JavaScript
# Composed objectives for JS startup persistence
defaults:
  crit: hostile
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: js-startup-vbs-launcher-written-synchronously
    desc: JavaScript writes a hidden VBS launcher into the Startup folder
    conf: 0.99
    attack: T1547.001,T1059.005
    all:
      - id: micro-behaviors/fs/path/autostart::javascript-startup-path-component-list
      - id: micro-behaviors/fs/write/file/full/unspecified::node-write-file-sync-join-path
      - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
      - id: micro-behaviors/data/control-flow/dispatch/run::js-vbs-hidden-window-run
      - id: micro-behaviors/process/config/window::wsh-run-hidden-flags

  - id: js-win-startup-persistence
    desc: Windows Startup folder persistence via JavaScript
    conf: 0.95
    attack: T1547.001
    all:
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-async
    # Keep the path and write operation in one call site.  A bundled
    # application commonly writes unrelated settings files elsewhere in the
    # same module, which is not Startup-folder persistence.
    near_bytes: 2048

  - id: js-encoded-startup-persistence
    desc: Encoded Startup persistence via JavaScript
    conf: 0.98
    attack: T1547.001,T1027,T1195.002
    all:
      - id: micro-behaviors/data/encode/char-code::encoded-windows-startup-path
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/data/control-flow/module-exec::async-iife-invoke
