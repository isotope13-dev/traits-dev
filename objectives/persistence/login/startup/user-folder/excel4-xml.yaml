# An Excel 4.0 macrosheet that opens a file under the user's Startup folder
# and writes lines into it: whatever it writes runs at the next logon.
defaults:
  for: [xml]
  platforms: [windows]
  attack: T1547.001
  mbc: B0011

composite_rules:
  - id: excel4-writes-file-into-startup-folder
    desc: XLM macro writes a file into Startup
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/document/office/macro::excel4-macrosheet-xml-root
      - id: micro-behaviors/fs/write/file/full/string::excel4-fopen-fwriteln-text-file
      - id: micro-behaviors/fs/path/autostart::excel4-startup-folder-segment
