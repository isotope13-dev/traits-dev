defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001,T1059.001
  mbc: F0012

composite_rules:
  - id: native-powershell-bypass-startup-shortcut
    desc: Unsigned PE creates Startup shortcut via bypassed PowerShell
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/fs/file/create::shortcut-create-method
      - id: micro-behaviors/fs/file/create::shortcut-target-path
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: metadata/signature/absent::unsigned
