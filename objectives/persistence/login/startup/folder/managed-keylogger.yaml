defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-keylogger-startup-batch-profile
    desc: Keylogger with Startup batch self-launch code
    crit: hostile
    conf: 0.96
    attack: T1547.001
    all:
      - id: micro-behaviors/os/autorun/login-items::managed-startup-batch-self-launch-profile
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post
