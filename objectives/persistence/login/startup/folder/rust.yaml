defaults:
  platforms: [windows]
  for: [rust, crate]
  attack: T1547.001,T1059.001,T1195.002

composite_rules:
  - id: rust-startup-powershell-dropper
    desc: Rust package writes PowerShell launcher into Windows Startup
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
      - id: micro-behaviors/fs/write/file/full::fs-write
      - id: micro-behaviors/process/create/direct::rust-command-powershell
