# A JAR that finds its own location and the Windows Startup folder is
# installing itself to run at every logon (STRRAT and kin copy the running
# JAR into Startup). Ordinary Java desktop apps that offer "start with
# Windows" do it through an installer or a registry Run value, and do not
# also hide their classes from extractors.
defaults:
  platforms: [windows]
  for: [class, jar]
  crit: hostile
  attack: T1547.001

composite_rules:
  - id: hidden-class-jar-startup-self-install
    desc: Class-hiding JAR locates itself and the Windows Startup folder
    conf: 0.92
    scope: outer
    all:
      - id: micro-behaviors/fs/path/autostart::jvm-startup-folder-resolution
      - id: micro-behaviors/fs/path/autostart::jvm-own-code-location
      - id: objectives/anti-static/obfuscation/payload/archive::java-archive-data-bearing-directory-entries
