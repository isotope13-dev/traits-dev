defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: python-startup-compressed-pickle-execution
    desc: Startup script executes a compressed pickle
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1059.006
    all:
      - id: micro-behaviors/fs/write/file/target::python-bound-startup-script-write
      - id: micro-behaviors/fs/write/file/stream::python-writes-compressed-pickle-loader
