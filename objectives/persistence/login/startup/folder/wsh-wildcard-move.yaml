# Moving or copying every file of a folder (`*.*`) into the Start Menu
# Startup folder makes each of them run at the next logon. Installers place
# one named shortcut there; nothing legitimate empties a folder into it.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1547.001

traits:
  - id: wsh-wildcard-files-into-startup
    desc: Script moves all files into Startup folder
    crit: hostile
    conf: 0.94
    if:
      type: text
      regex: '(?i)(Move|Copy)File\s*\(?\s*"[^"]{0,60}\*\.\*"\s*,\s*"[^"]{0,80}Programs\\StartUp'
