defaults:
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: ssh-key-backdoor-startup-copy
    desc: SSH key backdoor copies a login Startup script
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1098.004
    all:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: micro-behaviors/os/autorun/login-items::js-joined-startup-script-copy
