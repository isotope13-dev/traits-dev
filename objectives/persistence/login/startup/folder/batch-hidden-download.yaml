defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
- id: batch-decoy-hidden-startup-download
  desc: Hidden PDF-decoy launcher downloads startup script
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/launch::batch-starts-pdf-url
  - id: micro-behaviors/fs/write/file/startup::curl-output-startup-batch
  - id: objectives/evasion/process/hidden/execution::batch-powershell-hidden-self-relaunch
