defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1547.001
composite_rules:
  # Numeric text decoding co-occurs with a VBS write and Startup resolution.
  # The matcher does not establish the content of the VBS or a relaunch.
  - id: ps-numeric-text-startup-vbs-write
    desc: Numeric text decoding with Startup VBS write
    crit: hostile
    conf: 0.97
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/write/file/full::powershell-vbs-text-file-write
      - id: micro-behaviors/fs/path/autostart::powershell-startup-csidl-number
      - id: objectives/anti-static/obfuscation/string/numeric::powershell-numeric-bytearray-text
