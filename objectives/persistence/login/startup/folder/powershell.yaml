defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1547.001
composite_rules:
  # PowerShell RunPE droppers persist by writing an obfuscated (numeric-array)
  # VBS shim into the Startup folder (resolved by CSIDL number so no
  # "Startup" string appears); the shim re-runs the dropper hidden.
  - id: ps-startup-vbs-relaunch-dropper
    desc: PowerShell persists obfuscated VBS shim in Startup folder
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/file/full::write-all-text
      - id: objectives/persistence/login/startup/shortcut::powershell-startup-csidl-number
      - id: objectives/anti-static/obfuscation/string/concat::ps-numeric-chararray
