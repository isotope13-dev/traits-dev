defaults:
  platforms: [windows]
  for: [python, zip]
  attack: T1547.001,T1059.006,T1195.002

composite_rules:
  - id: python-install-hook-startup-payload-launch
    desc: Install hook stages and launches Startup payload
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: objectives/evasion/masquerade/identity/move::startup-folder-access
      - id: micro-behaviors/fs/file/rename::os-rename
      - id: micro-behaviors/os/handler/open::os-startfile-call
    near_bytes: 12000

  - id: python-install-hook-downloads-startup-payload
    desc: Install hook drops and launches Startup payload
    crit: hostile
    conf: 0.99
    attack: T1105,T1547.001,T1059.006,T1195.002
    scope: file
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: objectives/persistence/login/startup/folder::python-startup-folder-parts
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
