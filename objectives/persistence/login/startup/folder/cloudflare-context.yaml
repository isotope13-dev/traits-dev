defaults:
  platforms:
  - unix
  - windows
  for: [batch]
  attack: T1547.001
composite_rules:
- id: startup-script-cloudflare-iwr-profile
  desc: Startup script with Cloudflare and IWR clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/command-and-control/infrastructure/domain/tunnel::cloudflare-tunnel
  - id: objectives/persistence/login/startup/folder::batch-echo-startup-script
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-powershell-iwr-alias
- id: startup-script-cloudflare-profile
  desc: Startup script with Cloudflare tunnel clues
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/command-and-control/infrastructure/domain/tunnel::cloudflare-tunnel
  - id: objectives/persistence/login/startup/folder::batch-echo-startup-script
  any:
  - id: micro-behaviors/communications/http/download/curl::batch-curl-call
  - id: micro-behaviors/communications/http/download/cli::curl-command-call
  - id: objectives/persistence/login/startup/folder::batch-echo-startup-via-var
