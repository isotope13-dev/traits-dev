# The structured stream name is normalized to forward slashes by filefacts.
# Traversal, autostart location and runnable extension must name ONE stream.
# Droppers re-traverse inside the Start Menu (`Startup/../Startup/`,
# `Programs/../Programs/Startup/`) to dodge literal path matches, so the
# final `Startup/<file>` segment is anchored at the end of the stream path
# rather than after a single `Start Menu/Programs/` prefix. Executables
# (.exe/.scr/.lnk) land in the same autostart folder and are covered too.
defaults:
  platforms: [windows]
  for: [rar]
traits:
  - id: rar-ads-traversal-startup-drop
    desc: RAR stream traversal drops into Startup
    crit: hostile
    conf: 0.98
    attack: T1547.001
    if:
      type: value
      path: "rar.ntfs_streams[*].stream"
      regex: '(?i)^\.\./.{0,300}/Startup/[^/]+\.(bat|cmd|vb[se]|jse?|wsf|hta|ps1|exe|scr|lnk)$'
