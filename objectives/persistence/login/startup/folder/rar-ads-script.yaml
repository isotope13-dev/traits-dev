# The structured stream name is normalized to forward slashes by filefacts.
# Traversal, autostart location and script extension must name ONE stream.
defaults:
  platforms: [windows]
  for: [rar]
traits:
  - id: rar-ads-traversal-startup-script
    desc: RAR stream traversal targets a Startup script
    crit: hostile
    conf: 0.98
    attack: T1547.001
    if:
      type: value
      path: "rar.ntfs_streams[*].stream"
      regex: '(?i)(^|/)\.\./.*Start Menu/Programs/Startup/[^/]+\.(bat|cmd|vbs|hta)$'
