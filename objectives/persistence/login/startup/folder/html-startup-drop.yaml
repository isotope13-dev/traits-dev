# HTML exploit pages that anchor execution to the Windows Startup folder.
# One shape drives WScript.Shell from the page and points it at Startup
# (SpecialFolders lookups as well as Start Menu paths, HTA carriers
# included); the other shape pulls a remote executable straight into
# Startup. Either shape turns a page view into logon persistence.
defaults:
  for: [html]
  platforms: [windows]
  attack: "T1547.001"

composite_rules:
  - id: html-wscript-startup-launch
    desc: WScript shell launch anchored to Startup folder
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/exec::wsh-progid-near-run
    any:
      - id: micro-behaviors/fs/path/location::wsh-startup-folder-lookup
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
      - id: micro-behaviors/fs/path/autostart::startup-hta-path-text
    needs: 1
    unless:
      - id: well-known/app/ai/coding-agent/
  - id: html-remote-executable-startup-staging
    desc: Remote executable staged into Startup folder
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/autostart::startup-executable-path
      - id: micro-behaviors/communications/http/url/path::http-executable-url-reference
    unless:
      - id: well-known/app/ai/coding-agent/
