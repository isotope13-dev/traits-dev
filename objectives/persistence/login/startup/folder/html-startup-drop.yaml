defaults:
  for:
    - html
  platforms:
    - windows
  attack: T1547.001
  crit: hostile
  conf: 0.95
traits:
  - id: setconf-log-directive
    desc: Control-port SETCONF Log rewrite sequence
    crit: suspicious
    if:
      type: text
      regex: '(?is)SETCONF\s+Log=[\s\S]{0,140}SAVECONF[\s\S]{0,60}SIGNAL\s+RELOAD'
composite_rules:
  - id: html-wscript-startup-launch
    desc: WScript shell launch anchored to Startup folder
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run
    any:
      - id: micro-behaviors/fs/path/autostart::wsh-special-folders-startup
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
      - id: micro-behaviors/fs/path/autostart::startup-hta-path-text
    needs: 1
  - id: html-remote-executable-startup-staging
    desc: Remote executable staged into Startup folder
    all:
      - id: micro-behaviors/fs/path/autostart::startup-executable-path
      - id: micro-behaviors/communications/url/resource-path/file::http-executable-url-reference
  - id: html-controlport-startup-log-drop
    desc: Form submits control-port log path to Startup
    all:
      - id: setconf-log-directive
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
      - id: micro-behaviors/ui/window/form-input::document-named-form-submit
      - id: micro-behaviors/ui/window/visibility::hidden-frame-attribute-run
