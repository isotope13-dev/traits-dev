defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1547.001"
traits:
  - id: startup-folder-drop
    desc: SpecialFolder.Startup persistence
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "SpecialFolder.Startup"
    unless:
      - type: text
        substr: "AutoStartup"
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/signed/developer

composite_rules:
  - id: csharp-self-copy-startup-persistence
    desc: C# copies its executable into the Windows Startup folder
    crit: hostile
    conf: 0.98
    all:
      - id: startup-folder-drop
      - id: micro-behaviors/fs/file/copy::file-copy-source
      - id: micro-behaviors/fs/file/copy::current-process-path
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/detection/
