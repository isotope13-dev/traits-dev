defaults:
  platforms: [windows]
  for: [html]
  attack: T1547.001
composite_rules:
  - id: java-scriptlet-startup-homepage-hta
    desc: Java bridge stages homepage-changing HTA for login
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/activex/browser-control::java-scriptlet-homepage-document-write
      - id: micro-behaviors/fs/path/autostart::startup-hta-path-text
  - id: java-scriptlet-startup-hta-persistence
    desc: Java bridge installs command HTA for login activation
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/activex/browser-control::java-scriptlet-command-document-write
      - id: micro-behaviors/fs/path/autostart::startup-hta-path-text
