# Batch loaders that copy themselves into Startup, then elevate msiexec
# against a ProgramData MSI via hidden PowerShell/VBS — reusable for
# fake-update SFX second stages beyond any one KB*.msi name.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1547.001,T1218.007,T1059.001

composite_rules:
  - id: batch-startup-elevated-programdata-msi
    desc: Startup batch elevates msiexec on ProgramData MSI
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/persistence/login/startup/folder::batch-startup-var-assignment
      - id: objectives/persistence/login/self-install/script::batch-self-copy
      - id: objectives/command-and-control/dropper/delivery/download-execute::msiexec-programdata-msi
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
