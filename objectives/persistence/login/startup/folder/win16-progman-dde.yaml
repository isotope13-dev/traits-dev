defaults:
  for: [ne]
  platforms: [windows]
traits:
  - id: win16-progman-dde-topic
    desc: References Win16 Progman DDE topic
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "Progman|progman"
  - id: progman-create-startup-group
    desc: Creates Windows Startup group via DDE
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: '[CreateGroup("Startup")]'
  - id: progman-add-item-cmd
    desc: Adds item to Program Manager group
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '[AddItem('
composite_rules:
  - id: win16-progman-startup-persistence
    desc: Win16 binary adds itself to Startup group via Progman DDE
    crit: hostile
    conf: 0.98
    attack: T1547.001
    all:
      - id: win16-progman-dde-topic
      - id: progman-create-startup-group
      - id: progman-add-item-cmd
