defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-http-download-startup
    desc: Node HTTP download and Startup folder
    crit: hostile
    conf: 0.95
    attack: T1547.001
    mbc: F0004
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
