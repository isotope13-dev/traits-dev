defaults:
  platforms: [windows]
  for: [javascript, typescript, batch]
  attack: T1547.001,T1098.004,T1572

composite_rules:
  - id: ssh-key-backdoor-startup-script
    desc: SSH key backdoor installs Startup script
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
    any:
      - id: micro-behaviors/os/autorun/login-items::js-joined-startup-script-copy
      - id: micro-behaviors/os/autorun/login-items::batch-copy-startup-reference
