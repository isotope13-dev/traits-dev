defaults:
  platforms: [windows]
  for: [javascript, typescript, batch]
  attack: T1547.001,T1098.004,T1572

composite_rules:
  - id: startup-script-install-method
    desc: Startup script installation method
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/os/autorun/login-items::js-joined-startup-script-copy
      - id: micro-behaviors/os/autorun/login-items::batch-copy-startup-reference
      - id: micro-behaviors/os/autorun/login-items::js-writes-batch-to-startup-folder

  - id: ssh-key-backdoor-startup-script
    desc: SSH key backdoor installs Startup script
    crit: hostile
    conf: 0.98
    all:
      - id: startup-script-install-method
    any:
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-reverse-ssh-access
      - id: objectives/command-and-control/channel/tunnel/reverse-ssh::authorized-key-local-sshd-reverse-forward

  - id: startup-script-reverse-ssh-tunnel-persistence
    desc: Startup script maintains persistent reverse SSH tunnel
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1572
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-retry-loop
      - id: startup-script-install-method
    any:
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command

  - id: local-sshd-reverse-forward-startup-script
    desc: Startup script setup accompanies reverse SSH access
    crit: suspicious
    conf: 0.96
    attack: T1547.001,T1572
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
      - id: startup-script-install-method
