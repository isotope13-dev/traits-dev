defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: defender-excluded-hidden-startup-script
    desc: Defender-excluded hidden launcher installs Startup script
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1562.001
    all:
      - id: micro-behaviors/os/autorun/login-items::js-joined-startup-script-copy
      - id: micro-behaviors/process/create/shell/script-host::js-vbs-hidden-window-run
      - id: objectives/evasion/anti-av/platform/defender::javascript-defender-exclusion
