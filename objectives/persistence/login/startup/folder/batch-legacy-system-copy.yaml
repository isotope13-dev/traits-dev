defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-replaces-legacy-startup-executable
    desc: Deletes an executable in legacy Startup
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^[ \t]*@?(del|erase)\b[^\r\n]{0,90}\\startm~\d\\programs\\startup\\\w+\.exe'

  - id: batch-system-exe-copy
    desc: Copies an executable from Windows System
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?im)^[ \t]*@?copy[ \t]+"?[a-z]:\\windows\\system(32)?\\[\w.-]+\.exe\b'

  - id: batch-copies-legacy-startup-executable
    desc: Copies an executable into legacy Startup
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^[ \t]*@?copy\b[^\r\n]{0,100}\\startm~\d\\programs\\startup\\\w+\.exe'

composite_rules:
  - id: batch-overwrites-legacy-startup-executable
    desc: Replaces a Startup executable with a copy from the Windows System folder
    crit: hostile
    conf: 0.97
    attack: T1547.001,T1036
    all:
      - id: batch-replaces-legacy-startup-executable
      - id: batch-system-exe-copy
      - id: batch-copies-legacy-startup-executable
    near_lines: 3
