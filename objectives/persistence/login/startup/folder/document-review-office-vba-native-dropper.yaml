defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: T1105


composite_rules:
  - id: vba-binary-startup-payload-dropper
    for: [ooxml]
    desc: VBA reconstructs an executable into the Startup folder
    crit: hostile
    conf: 0.99
    attack: T1547.001
    all:
      - id: metadata/document/office/macro::word-vba-project-value
      - id: micro-behaviors/os/application/hook/event::auto-close-trigger
      - id: micro-behaviors/fs/write/file/stream::vba-binary-file-write
      - id: micro-behaviors/fs/path/autostart::startup-executable-path
      - id: micro-behaviors/data/encode/char-code::vba-byte-array-allocation
      - id: micro-behaviors/data/encode/char-code::vba-delimited-byte-payload
