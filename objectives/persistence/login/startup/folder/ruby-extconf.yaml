defaults:
  platforms: [unix, windows]
  for: [ruby]

composite_rules:
  - id: extconf-windows-startup-copy
    desc: Extension hook with startup folder copy
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: objectives/persistence/login/startup/folder::ruby-copy-to-startup-folder
