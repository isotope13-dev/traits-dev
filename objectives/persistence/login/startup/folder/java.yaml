defaults:
  platforms:
    - unix
    - windows
  for:
    - java
    - class
traits:
  - id: java-startup-enum
    desc: Java Windows Startup folder path literal
    crit: suspicious
    if:
      type: literal
      regex: '(?i)(Microsoft[/\\]Windows[/\\])?Start\s+Menu[/\\]Programs[/\\]Startup([/\\]|$)'
  - id: java-common-startup-enum
    desc: Java common Windows Startup folder path literal
    crit: suspicious
    if:
      type: literal
      regex: '(?i)(Microsoft[/\\]Windows[/\\])?Common\s+Start\s+Menu[/\\]Programs[/\\]Startup([/\\]|$)'
