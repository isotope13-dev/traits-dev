defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: hidden-startup-downloader-document-decoy
    desc: Hidden decoy downloader writes Startup script
    crit: hostile
    conf: 0.97
    attack: T1547.001,T1105,T1204.002
    all:
      - id: batch-startup-script-redirect-block
      - id: objectives/evasion/process/hidden/execution::batch-powershell-hidden-self-relaunch
      - id: micro-behaviors/communications/http/download/curl::batch-curl-output-flag
      - id: micro-behaviors/os/handler/open::batch-start-local-document
      - id: objectives/discovery/host/security::batch-tasklist-antivirus-inventory
      - id: micro-behaviors/process/deploy/interpreter-command::batch-python-pyd-main-input
