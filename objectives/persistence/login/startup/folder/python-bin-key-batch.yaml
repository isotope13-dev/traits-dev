defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: batch-python-bin-key-startup-profile
  desc: Python bin/key launch near Startup write
  crit: suspicious
  conf: 0.98
  attack: T1547.001
  all:
  - id: micro-behaviors/process/interpreter/python::python-script-from-batch
  - id: micro-behaviors/process/interpreter/python::python-bin-input-arg
  - id: micro-behaviors/process/argument/file::text-key-file-option
  - id: objectives/persistence/login/startup/folder::batch-echo-startup-script
  any:
  - id: micro-behaviors/fs/path/app-data::localappdata-short-subdir
  - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-powershell-iwr-alias
  - id: micro-behaviors/process/interpreter/python::python-embed-zip-name
  needs: 1
