defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: scriptlet-startup-drive-wiper
    desc: Scriptlet writer stages a Startup HTA drive wiper
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/autostart::spanish-startup-hta-path
      - id: micro-behaviors/fs/write/content::document-write-call-cooccurrence
      - id: objectives/impact/wipe/disk/format::activex-unattended-drive-wiper

  - id: scriptlet-startup-hta-shell-persistence
    desc: Scriptlet writes shell-bearing Startup HTA
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1203
    all:
      - id: micro-behaviors/os/com/automation::wsh-shell-clsid
      - id: "metadata/lang/source/syntax/assignment::object-startup-hta-path-assignment"
      - id: "metadata/lang/source/syntax/assignment::object-doc-property-assignment"
      - id: metadata/lang/source/syntax/call/relationship::doc-assignment-before-write-call
    any:
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
      - id: micro-behaviors/process/create/shell/script-host::command-com-c-command-text
