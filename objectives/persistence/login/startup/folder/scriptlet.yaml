defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: scriptlet-startup-drive-wiper
    desc: Scriptlet writer stages a Startup HTA drive wiper
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/fs/path/autostart::spanish-startup-hta-path
      - id: micro-behaviors/fs/write/content::document-write-call-cooccurrence
      - id: objectives/impact/wipe/disk/format::activex-unattended-drive-wiper
