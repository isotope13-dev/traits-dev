# A displayed source listing can carry a complete offensive implementation.
# Require the installation roles, not attacker-selected payload/shortcut names.
defaults:
  platforms: [windows]
  for: [html]

composite_rules:
  - id: html-twitter-persistent-command-backdoor
    desc: Embedded Twitter bot installs Startup shortcut
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1105,T1059.001
    near_bytes: 60000
    all:
      - id: objectives/command-and-control/remote-command/dispatch/social-media::html-twitter-remote-command-backdoor
      - id: micro-behaviors/fs/path/autostart::windows-startup-directory
      - id: micro-behaviors/fs/file/create::shortcut-save
      - id: micro-behaviors/fs/file/create::shortcut-target-path
