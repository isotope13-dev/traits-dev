defaults:
  crit: hostile
  conf: 0.98
  platforms: [windows]
  attack: T1547.001
  for: [rar]

traits:
  - id: rar-ads-traversal-startup-shortcut
    desc: RAR stream traversal targets a Startup shortcut
    if:
      type: value
      path: "rar.ntfs_streams[*].stream"
      regex: '(?i)(^|/)\.\./.*Start Menu/Programs/Startup/[^/]+\.lnk$'
