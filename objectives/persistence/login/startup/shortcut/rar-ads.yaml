defaults:
  platforms: [windows]
  attack: T1547.009

composite_rules:
  - id: rar-ads-traversal-startup-shortcut
    desc: RAR ADS traversal drops Startup shortcut
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/magic/identity::rar-v5
      - id: micro-behaviors/data/archive/rar::ads-parent-traversal
      - id: micro-behaviors/data/archive/rar::startup-member-path
      - id: micro-behaviors/data/archive/rar::lnk-member-extension

  - id: rar-ads-traversal-startup-script
    desc: RAR ADS traversal drops Startup script
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/magic/identity::rar-v5
      # `repeated-ads-parent-traversal` only counts `..\` runs and never looks
      # for the `:` that makes the member name a stream, so on its own this
      # rule asserted ADS abuse while matching any RAR carrying deep relative
      # paths next to a Startup-named folder and a script. Require the
      # stream-marked traversal as well, the way the shortcut rule above
      # already does, so the name matches what is actually checked.
      - id: micro-behaviors/data/archive/rar::ads-parent-traversal
      - id: micro-behaviors/data/archive/rar::repeated-ads-parent-traversal
      - id: micro-behaviors/data/archive/rar::startup-member-path
    any:
      - id: micro-behaviors/data/archive/rar::wsh-script-member-extension
      - id: micro-behaviors/data/archive/rar::shell-script-member-extension
      # HTA is the payload of choice for this technique -- it runs under
      # mshta with no interpreter prompt -- but it was absent from the
      # script list, so an .hta dropped into Startup by an archive traversal
      # matched none of the alternatives.
      - id: micro-behaviors/data/archive/rar::hta-member-extension
