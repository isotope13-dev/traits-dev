defaults:
  platforms: [windows]
  attack: T1547.009

composite_rules:
  - id: rar-ads-traversal-startup-shortcut
    desc: RAR ADS traversal drops Startup shortcut
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/magic/identity::rar-v5
      - id: micro-behaviors/data/archive/rar/member::ads-parent-traversal
      - id: micro-behaviors/data/archive/rar/member::startup-member-path
      - id: micro-behaviors/data/archive/rar/member::lnk-member-extension

  - id: rar-ads-traversal-startup-script
    desc: RAR ADS traversal drops Startup script
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/magic/identity::rar-v5
      - id: micro-behaviors/data/archive/rar/member::repeated-ads-parent-traversal
      - id: micro-behaviors/data/archive/rar/member::startup-member-path
      - id: micro-behaviors/data/archive/member/
