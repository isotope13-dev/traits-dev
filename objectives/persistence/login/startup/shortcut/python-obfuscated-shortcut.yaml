defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-browser-extension-dropper
  desc: Setup injects obfuscated browser shortcut arguments
  crit: hostile
  conf: 0.95
  attack: T1547.009
  all:
  - id: metadata/build/pip::root-setup-py
  - id: objectives/execution/autoinstall/pip::main-call-content
  - id: objectives/persistence/login/startup/shortcut::windows-shortcut-obfuscated-argument-inject
  - id: objectives/anti-static/obfuscation/eval/scripting/reflection::advanced-python-obfuscation
