defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1547.001
composite_rules:
  - id: powershell-bypass-startup-shortcut-persistence
    desc: WSH Startup shortcut plus remote fetch and hidden PowerShell bypass
    crit: hostile
    conf: 0.98
    attack: T1547.009,T1059.001
    all:
      - id: micro-behaviors/os/autorun/login-items::startup-shortcut-creation
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/os/security/policy::execution-policy-bypass
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
      - id: micro-behaviors/communications/http/client/response-body::response-text

  - id: obfuscated-jscript-startup-shortcut-persistence
    desc: Obfuscated JScript creates Startup shortcut for PowerShell stager
    crit: hostile
    conf: 0.97
    attack: T1547.001, T1547.009, T1059.001
    mbc: F0012
    all:
      - id: micro-behaviors/os/autorun/login-items::startup-shortcut-creation
      - id: micro-behaviors/os/autorun/keyword::startup-keyword
      - id: micro-behaviors/process/argument/option::escaped-noprofile-policy-bypass-fragment
      - id: micro-behaviors/process/argument/option::escaped-file-argument-fragment
      - id: micro-behaviors/os/com/automation::activex-constructor-call
    any:
      - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
      - id: metadata/lang/javascript-features::pipe-delimited-digit-literal
