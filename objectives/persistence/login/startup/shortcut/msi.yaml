defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1547.001

composite_rules:
  - id: encrypted-startup-shortcut-persistence
    desc: Encrypted MSI persists via Startup shortcut
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/persistence/login/startup/folder::msi-wsh-specialfolders-startup
      - id: micro-behaviors/data/archive/extract/password::msi-dual-sevenzip-passworded-overwrite-extraction
      - id: metadata/package/files/msi-content::msi-securityhealth-shortcut-name
      - id: micro-behaviors/process/create/hidden::msi-wscript-shell-run
