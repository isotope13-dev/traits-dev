defaults:
  platforms: [windows]
  for: [powershell, text]

composite_rules:
  - id: fragmented-xor-loader-startup-shortcut
    desc: Concealed XOR loader with Startup shortcut and file-handler key
    crit: hostile
    conf: 0.98
    attack: T1547.009
    all:
      - id: objectives/execution/payload/module-load/transformed::powershell-fragmented-file-xor-loader
      - id: micro-behaviors/fs/path/autostart::powershell-fragmented-startup-folder
      - id: micro-behaviors/fs/file/create::shortcut-save
      - id: micro-behaviors/os/registry/association/reference::qualified-shell-open-command-key
