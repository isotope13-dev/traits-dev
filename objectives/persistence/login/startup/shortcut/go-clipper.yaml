defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # Go builds the Startup path from separate components before formatting the
  # PowerShell CreateShortcut/TargetPath/Save body. This is a co-occurrence
  # signature for that installer, not a claim about every shortcut API user.
  - id: go-clipboard-clipper-startup-shortcut-code
    desc: Clipper includes Startup shortcut routine
    crit: suspicious
    conf: 0.97
    attack: T1547.001
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::go-ethereum-clipboard-swap
      - id: micro-behaviors/fs/path/autostart::go-x64-startup-path-component-array
      - id: micro-behaviors/fs/file/create::shortcut-save
      - id: micro-behaviors/fs/file/create::shortcut-target-path
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
