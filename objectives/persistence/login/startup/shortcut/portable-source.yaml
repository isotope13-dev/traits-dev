defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
  attack: T1547.001,T1105

traits:
  - id: jvm-shortcut-create-token
    desc: JVM string invokes shortcut creation
    crit: notable
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)CreateShortcut\($'

  - id: jvm-startup-lnk-path
    desc: JVM string names a Startup LNK path
    crit: notable
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)Start Menu[\\/]+Programs[\\/]+Startup[\\/]+.{1,120}\.lnk'

  - id: jvm-cmd-exe-string
    desc: JVM string names cmd.exe
    crit: notable
    conf: 0.97
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(^|[^A-Za-z0-9_])cmd\.exe($|[^A-Za-z0-9_])'

  - id: jvm-curl-script-url
    desc: JVM string downloads a script with curl
    crit: notable
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)curl\s+-fsSL\s+https?://.{1,120}\.(cmd|bat|scr)\b'

composite_rules:
  - id: startup-shortcut-remote-command-dropper
    desc: Startup shortcut downloads and runs remote command
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/autostart::windows-startup-reference
      - id: micro-behaviors/os/wsh/file::shortcut-creates-lnk
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
    any:
      - id: micro-behaviors/communications/http/download/curl::source-curl-script-url
      - id: micro-behaviors/communications/http/download/curl::curl-fail-silent-url-reference

  - id: jvm-startup-shortcut-remote-command
    desc: JVM creates remote-command Startup shortcut
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    scope: leaf
    all:
      - id: jvm-shortcut-create-token
      - id: jvm-startup-lnk-path
      - id: jvm-cmd-exe-string
      - id: jvm-curl-script-url
