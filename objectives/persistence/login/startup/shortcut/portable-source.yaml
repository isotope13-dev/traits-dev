defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
  attack: T1547.001,T1105

traits:
  - id: jvm-shortcut-create-token
    desc: JVM string invokes shortcut creation
    crit: notable
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)CreateShortcut\($'

  - id: jvm-startup-lnk-path
    desc: JVM string names a Startup LNK path
    crit: notable
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)Start Menu[\\/]+Programs[\\/]+Startup[\\/]+.{1,120}\.lnk'

  - id: perl-startup-folder-text
    desc: Perl source names the Windows Startup folder
    crit: notable
    conf: 0.98
    for: [perl]
    if:
      type: text
      regex: '(?i)Start Menu[\\/]+Programs[\\/]+Startup[\\/]+[^"''\r\n]{1,120}\.lnk'
  - id: perl-create-shortcut-text
    desc: Perl source invokes CreateShortcut
    crit: notable
    conf: 0.98
    for: [perl]
    if:
      type: text
      regex: '(?i)CreateShortcut\s*\('
  - id: python-wscript-shell-shortcut-create
    desc: Python creates a shortcut via WScript.Shell
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'Dispatch\(\s*["'']WScript\.Shell["'']\s*\)[\s\S]{0,240}CreateShortcut\s*\('

composite_rules:
  - id: perl-startup-shortcut-remote-command
    desc: Perl package creates a remote Startup shortcut
    crit: hostile
    conf: 0.99
    for: [perl, tar, zip]
    scope: archive
    all:
      - id: objectives/persistence/login/startup/shortcut::perl-startup-folder-text
      - id: objectives/persistence/login/startup/shortcut::perl-create-shortcut-text
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/process/create/flags::powershell-noninteractive-flag

  - id: go-startup-shortcut-remote-command
    desc: Go module creates a remote Startup shortcut
    crit: hostile
    conf: 0.99
    for: [go, zip]
    scope: archive
    all:
      - id: micro-behaviors/process/create/subprocess::go-powershell-command
      - id: micro-behaviors/fs/path/autostart::windows-startup-reference
      - id: micro-behaviors/fs/file/create::shortcut-creates-lnk
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url

  - id: startup-shortcut-remote-command-dropper
    desc: Startup shortcut downloads and runs remote command
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/autostart::windows-startup-reference
      - id: micro-behaviors/fs/file/create::shortcut-creates-lnk
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
    any:
      - id: micro-behaviors/communications/http/download/curl::source-curl-script-url
      - id: micro-behaviors/communications/http/download/curl::curl-fail-silent-url-reference

  - id: jvm-startup-shortcut-remote-command
    desc: JVM creates remote-command Startup shortcut
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    scope: leaf
    all:
      - id: jvm-shortcut-create-token
      - id: jvm-startup-lnk-path
      - id: micro-behaviors/fs/path/application/interpreter::jvm-cmd-exe-string
      - id: micro-behaviors/communications/http/download/curl::jvm-curl-windows-script-url

  # Installers legitimately register autostart entries, so the mechanism
  # alone stays suspicious: Startup-folder placement plus scripted .lnk
  # creation is worth review without claiming unwanted reactivation.
  - id: python-dispatch-startup-shortcut
    desc: Python places a created shortcut in the Startup folder
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [python, cab, zip, tar]
    attack: T1547.001
    all:
      - id: objectives/persistence/login/startup/folder::python-startup-folder-parts
      - id: python-wscript-shell-shortcut-create
    unless:
      - id: metadata/package/testing/
