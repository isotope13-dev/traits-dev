defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1547.009

traits:
  - id: powershell-enumerate-lnk-filter
    desc: Enumerates Windows shortcut (.lnk) files
    crit: notable
    conf: 0.93
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bGet-ChildItem\b[^\r\n]{0,64}\*\.lnk\b'

composite_rules:
  - id: powershell-startup-existing-lnk-hijack
    desc: Rewrites existing Startup folder shortcut target
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/autostart::powershell-startup-special-folder
      - id: powershell-enumerate-lnk-filter
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/fs/file/create::shortcut-target-path
