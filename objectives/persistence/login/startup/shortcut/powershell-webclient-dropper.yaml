# A PowerShell dropper that fetches a payload, plants a .lnk in the Startup
# folder pointing at it, and launches it with a hidden window. Each leg is a
# capability on its own; together they are the whole persistence+stealth chain
# of a fake "installer" -- the payload survives reboot via the shortcut and
# runs unseen. Distinct from the existing downloaded-startup-launcher rule,
# which keys on the Set-Content / special-folder shape rather than a WebClient
# fetch plus a CreateShortcut into the Start Menu Startup path.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1547.001,T1105,T1564.003
  mbc: B0030,F0012

composite_rules:
  - id: powershell-webclient-startup-shortcut-dropper
    desc: WebClient dropper plants a hidden Startup shortcut
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/wsh/file::shortcut-save
      - id: objectives/persistence/login/startup/folder::win-startup-path
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
    any:
      - id: micro-behaviors/communications/http/client/webclient::system-net-webclient
      - id: micro-behaviors/communications/http/client/webclient::net-webclient-object
    unless:
      - id: metadata/signed/platform/
