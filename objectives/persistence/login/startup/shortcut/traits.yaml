defaults:
  platforms: [windows]
composite_rules:
- id: html-startup-shortcut-downloader
  desc: HTML persists a script-host downloader at startup
  crit: hostile
  conf: 0.98
  for: [html]
  attack: T1547.001,T1105,T1059.005
  mbc: F0012,B0030
  all:
  - id: micro-behaviors/os/autorun/login-items::shortcut-creation-startup-reference
  - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
  - id: micro-behaviors/fs/path/application/executable::windows-script-host-executable-reference
- id: vbs-hidden-startup-shortcut-persistence
  desc: VBScript hides executable through Startup shortcut
  crit: hostile
  conf: 0.98
  for: [vbs]
  attack: T1547.009,T1564.001
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/fs/path/location::wsh-startup-folder-lookup
  - id: micro-behaviors/fs/file/create::create-shortcut
  - id: micro-behaviors/fs/file/create::shortcut-target-path
  - id: micro-behaviors/fs/file/create::shortcut-save
  - id: micro-behaviors/fs/file/attributes::attrib-hidden
- id: github-runner-defender-startup-backdoor
  desc: Defender-disabled GitHub runner persists at startup
  crit: hostile
  conf: 0.99
  for: [powershell]
  attack: T1059.001,T1547.001,T1562.001
  all:
  - id: well-known/tool/sysadmin/github-runner::windows-registration
  - id: well-known/tool/sysadmin/github-runner::windows-run-script
  - id: micro-behaviors/fs/path/autostart::powershell-startup-special-folder
  - id: objectives/evasion/anti-av/platform/defender::defender-multi-feature-disable
  unless:
  - id: well-known/app/ai/media/comfy-test::generated-vm-template

- id: script-base32-startup-dropper
  desc: Script decodes a Base32 payload into a Startup-folder command file
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  attack: T1140,T1547.001
  near_lines: 35
  all:
  - id: micro-behaviors/fs/path/autostart::powershell-startup-special-folder
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-in-script
  - id: micro-behaviors/data/decode/base32::dotnet-base32-decoder-in-script
  - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
