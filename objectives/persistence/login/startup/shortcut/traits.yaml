defaults:
  platforms: [windows]
traits:
- id: powershell-startup-special-folder
  desc: PowerShell resolves Startup special folder
  crit: notable
  conf: 0.9
  for: [powershell]
  if:
    type: text
    regex: '(?i)GetFolderPath\(\s*["'']Startup["'']\s*\)|Environment\+SpecialFolder\]::Startup'
composite_rules:
- id: ps-startup-indicators
  desc: Helper for startup shortcut indicators
  crit: component
  any:
  - id: powershell-startup-special-folder
  - id: objectives/persistence/login/startup/registry::windows-startup-folder
  - id: micro-behaviors/fs/path/location::wsh-startup-folder-lookup
- id: startup-shortcut-persistence
  desc: "Persists payload via Startup folder shortcut"
  crit: suspicious
  conf: 0.95
  for: [powershell, javascript, go]
  all:
  - id: micro-behaviors/os/wsh/file::shortcut-creation
  - id: micro-behaviors/os/com/object::wscript-shell-literal
  - id: objectives/persistence/login/startup/shortcut::ps-startup-indicators
  any:
  - id: micro-behaviors/os/wsh/file::shortcut-target-path
  - id: micro-behaviors/os/wsh/file::shortcut-save
- id: vbs-hidden-startup-shortcut-persistence
  desc: VBScript hides executable through Startup shortcut
  crit: hostile
  conf: 0.98
  for: [vbs]
  attack: T1547.009,T1564.001
  all:
  - id: micro-behaviors/os/com/object::wscript-shell-literal
  - id: micro-behaviors/fs/path/location::wsh-startup-folder-lookup
  - id: micro-behaviors/os/wsh/file::create-shortcut
  - id: micro-behaviors/os/wsh/file::shortcut-target-path
  - id: micro-behaviors/os/wsh/file::shortcut-save
  - id: micro-behaviors/fs/file/attributes::attrib-hidden
- id: github-runner-defender-startup-backdoor
  desc: Defender-disabled GitHub runner persists at startup
  crit: hostile
  conf: 0.99
  for: [powershell]
  attack: T1059.001,T1547.001,T1562.001
  all:
  - id: well-known/tool/sysadmin/github-runner::windows-registration
  - id: well-known/tool/sysadmin/github-runner::windows-run-script
  - id: objectives/persistence/login/startup/shortcut::powershell-startup-special-folder
  - id: objectives/evasion/anti-av/platform/defender::defender-multi-feature-disable
  unless:
  - id: well-known/app/ai/media/comfy-test::generated-vm-template
