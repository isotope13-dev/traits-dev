defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-embedded-hidden-startup-shortcut
  desc: Hidden PowerShell LNK extracts an embedded Startup shortcut
  crit: hostile
  conf: 0.98
  attack: T1547.009,T1027.009
  all:
  - id: micro-behaviors/fs/path/autostart::lnk-startup-shortcut-path
  - id: micro-behaviors/fs/file/seek::lnk-stream-seek
  - id: micro-behaviors/fs/write/file/full::lnk-writeallbytes
  - id: micro-behaviors/data/embedded/payload/header::lnk-appended-second-header
  - id: micro-behaviors/process/create/shortcut::lnk-hidden-window-flag
  - id: metadata/lang/source/naming/action/token::lnk-invoke-expression-reference
