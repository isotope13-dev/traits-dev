defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1547.001

traits:
composite_rules:
- id: dotnet-startup-shortcut-persistence
  for: [pe]
  desc: .NET Startup shortcut persistence
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/fs/file/create::shortcut-create-method
  - id: shortcut-target-fields
  - id: micro-behaviors/fs/path/extension::lnk-extension-reference
  any:
  - id: micro-behaviors/os/autorun/keyword::dotnet-startup-persistence-config-token
  - id: micro-behaviors/os/registry/keys/installer::hidden-startup-registry-accessors
  - id: micro-behaviors/os/registry/keys/installer::dotnet-install-key-name-accessor
  unless:
  - id: metadata/binary/installer/
  - id: metadata/signed/platform/
- id: shortcut-target-fields
  desc: Shortcut target fields
  crit: component
  conf: 0.8
  any:
  - id: micro-behaviors/os/com/shortcut::targetpath-name-repeated
  - id: micro-behaviors/os/com/shortcut::workingdirectory-name-repeated
