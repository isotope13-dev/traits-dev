defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1547.001

traits: []
composite_rules:
  - id: dotnet-startup-shortcut-persistence
    for: [pe]
    desc: .NET Startup shortcut persistence
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/fs/file/create::shortcut-create-method
      - id: shortcut-target-fields
      - id: micro-behaviors/fs/path/extension::lnk-extension-reference
    any:
      - id: micro-behaviors/os/autorun/keyword::dotnet-startup-persistence-config-token
      - id: micro-behaviors/os/registry/software/reference::hidden-startup-registry-accessors
      - id: micro-behaviors/os/registry/software/reference::dotnet-install-key-name-accessor
  - id: shortcut-target-fields
    desc: Shortcut target fields
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/process/config/target::targetpath-name-repeated
      - id: micro-behaviors/process/config/target::workingdirectory-name-repeated
  - id: managed-temp-wsh-self-shortcut-script
    for: [pe]
    desc: Managed PE writes and launches temp WSH self-shortcut script
    crit: suspicious
    conf: 0.93
    attack: T1547.009,T1059.005
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/fs/file/create::shortcut-create-method
      - id: micro-behaviors/fs/file/create::shortcut-target-path
      - id: micro-behaviors/fs/path/extension::lnk-extension-reference
      - id: micro-behaviors/process/info/selfpath::managed-self-path-references
      - id: micro-behaviors/fs/path/temp::dotnet-gettemppath-token
      - id: micro-behaviors/fs/write/file/full/string::dotnet-writealltext-token
      - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start-call
    unless:
      - id: metadata/installer/product/
