# Startup registration is legitimate in installers. Unusual numeric-host
# acquisition adds suspicious context, without establishing payload identity
# or proving that the downloaded bytes are the shortcut target.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: decimal-download-startup-shortcut-profile
    desc: Decimal-host download near saved Startup shortcut
    crit: suspicious
    conf: 0.95
    attack: T1547.001
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/ip/literal::powershell-decimal-host-download
      - id: micro-behaviors/os/autorun/login-items::shortcut-creation-startup-reference
      - id: micro-behaviors/fs/file/create::shortcut-save
