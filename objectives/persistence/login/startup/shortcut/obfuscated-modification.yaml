defaults:
  platforms: [unix, windows]
composite_rules:
  - id: obfuscated-shortcut-hijacker
    desc: Obfuscated shortcut modification
    mbc: E1014
    attack: T1547.009
    crit: hostile
    conf: 1.0
    all:
      - id: objectives/anti-static/obfuscation/eval/scripting/reflection::dynamic-builder-or-state-obfuscation
    any:
      - id: objectives/persistence/login/startup/shortcut::windows-shortcut-walk-argument-inject
      - id: objectives/persistence/login/startup/shortcut::windows-shortcut-walk-modify
