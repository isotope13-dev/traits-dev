# Go Windows Startup Persistence with System Shutdown
# Detects pattern where malware establishes startup persistence AND executes system shutdown
# This is a highly suspicious combination indicating destructive malware with persistence hooks
defaults:
  mbc: F0004
  platforms: [windows]
  for: [go]
  attack: "T1547.001"
composite_rules:
  # A visible per-user autostart file is common application behavior. More
  # alarming intent requires another leg, such as the shutdown chain below.
  - id: creates-startup-file
    desc: Creates a file in the Windows Startup folder
    crit: notable
    conf: 0.95
    all:
      - id: objectives/persistence/login/startup/registry::windows-startup-folder
      - id: micro-behaviors/fs/file/create::go-create-startup-shortcut
  # Startup persistence + system shutdown (complete destructive chain)
  - id: startup-shutdown-chain
    desc: Creates Windows Startup persistence before an immediate shutdown
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/persistence/login/startup/registry::windows-startup-folder
      - id: micro-behaviors/fs/file/create::go-create-startup-shortcut
      - id: objectives/impact/system/shutdown::shutdown-immediate-reboot
