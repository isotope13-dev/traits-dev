# Go source constructs a Windows Startup file. Shutdown command
# construction alone does not prove execution or destructive intent.
defaults:
  mbc: F0004
  platforms: [windows]
  for: [go]
  attack: "T1547.001"
composite_rules:
  # A visible per-user autostart file is common application behavior. More
  # alarming intent requires another leg, such as the shutdown chain below.
  - id: creates-startup-file
    desc: Creates a file in the Windows Startup folder
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/autostart::windows-startup-reference
      - id: micro-behaviors/fs/file/create::go-create-startup-shortcut
