defaults:
  for: [ne]
  platforms: [windows]
traits:
  - id: vb3-chr-windows-section
    desc: Builds windows INI section via VB3 Chr$
    crit: component
    conf: 0.95
    if:
      type: hex
      pattern: "34 38 (77|57) 00 C9 74 BB 11 [0-2] 34 38 (69|49) 00 C9 74 BB 11 DF 40 34 38 (6E|4E) 00 C9 74 BB 11 DF 40 34 38 (64|44) 00 C9 74 BB 11 DF 40 34 38 (6F|4F) 00 C9 74 BB 11 DF 40 34 38 (77|57) 00 C9 74 BB 11 DF 40 34 38 (73|53) 00 C9 74 BB 11 DF 40"
  - id: vb3-chr-run-key
    desc: Builds run INI key via VB3 Chr$
    crit: component
    conf: 0.95
    if:
      type: hex
      pattern: "34 38 (72|52) 00 C9 74 BB 11 [0-2] 34 38 (75|55) 00 C9 74 BB 11 DF 40 34 38 (6E|4E) 00 C9 74 BB 11 DF 40"
composite_rules:
  - id: vb3-obfuscated-winini-run-write
    desc: Obfuscated VB3 binary writes win.ini run persistence
    crit: hostile
    conf: 0.98
    attack: T1547.001
    all:
      - id: micro-behaviors/fs/config/system::win16-write-profile-text
      - id: objectives/anti-static/obfuscation/string/concat::vb3-pcode-chr-concat
      - id: vb3-chr-windows-section
      - id: vb3-chr-run-key
