# Win16 win.ini `load=` startup entry. The Windows 3.x shell starts the program
# named by load= at logon, as it does for run=. Setup tools also write load=
# for tray helpers, so the write alone stays suspicious. The WritePrivateProfile
# API, the win.ini file name, and the bare Load key must all appear together.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1547.001

traits:
  - id: win16-ini-load-key-text
    desc: Win16 binary names the win.ini Load key
    crit: component
    conf: 0.8
    if:
      type: text
      exact: Load

composite_rules:
  - id: win16-ini-load-exe-write
    desc: Win16 program writes win.ini load startup entry
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/config/system::win16-write-private-profile
      - id: micro-behaviors/fs/path/config/system::windows-win-ini-reference
      - id: win16-ini-load-key-text
