# Login persistence through the legacy win.ini startup entry.
#
# Writing the client executable into win.ini `[windows] run=` relaunches it
# at every login with no registry Run key for startup monitors to catch.
# Armed from the mIRC start handler and paired with an exit-handler relaunch,
# the client survives both reboots and close attempts -- a watchdog, not an
# autostart preference.
defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1547.001
composite_rules:
  - id: mirc-winini-run-persistence
    desc: mIRC persists via win.ini run entry with exit watchdog
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/config/system::winini-run-entry-write
      - id: objectives/command-and-control/channel/irc/client::mirc-script-event-start
      - id: micro-behaviors/process/create/self-respawn::mirc-exit-relaunch
