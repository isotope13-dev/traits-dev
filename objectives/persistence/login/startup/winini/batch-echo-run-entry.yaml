# Legacy win.ini `[windows] run=` persistence written from a batch file. The
# batch echoes a run= line into a scratch file, prepends the real win.ini and
# types the result back over it, so the script launches at every login.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1547.001
traits:
  - id: batch-echo-winini-run-entry
    desc: Batch echoes a win.ini run entry
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*echo[ \t]+run[ \t]*=[ \t]*\S{1,120}\.(js|vbs|exe|bat|scr|pif|com)\b'
  - id: batch-redirect-into-winini
    desc: Batch redirects output into win.ini
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(type|echo)\b[^\r\n]{0,80}>{1,2}[ \t]*[a-z:\\.%0-9]{0,30}win\.ini\b'
composite_rules:
  - id: batch-winini-run-script-persistence
    desc: Batch plants a win.ini run entry for a dropped script
    crit: hostile
    conf: 0.93
    near_lines: 14
    all:
      - id: batch-echo-winini-run-entry
      - id: batch-redirect-into-winini
