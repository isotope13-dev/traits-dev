# Win16 win.ini run entry that is paired with a Windows system-directory
# executable literal. A Win16 program that writes a run= entry and names an
# .exe under \windows\system is installing that executable for logon start.
# The run-write composite is shared with win16-pcode-run.yaml. The literal alone
# is common in installers, so the composite stays suspicious and the family
# rule carries the hostile verdict.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1547.001

traits:
  - id: win16-system-exe-literal
    desc: Win16 binary names a system-directory executable
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      regex: '^[a-z]:\\windows\\system\\[a-z0-9_]{1,30}\.exe$'

composite_rules:
  - id: win16-profile-run-system-exe
    desc: Win16 run entry write names a system-directory executable
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/persistence/login/startup/winini::win16-profile-run-write
      - id: win16-system-exe-literal
