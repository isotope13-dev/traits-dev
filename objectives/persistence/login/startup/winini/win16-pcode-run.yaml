defaults:
  for: [ne]
  platforms: [windows]
traits:
  - id: win16-windows-section-text
    desc: References INI WINDOWS section
    crit: component
    conf: 0.8
    if:
      type: raw
      regex: '\x00WINDOWS\x00'
      case_insensitive: true
  - id: win16-run-key-text
    desc: References INI run key
    crit: component
    conf: 0.8
    if:
      type: raw
      regex: '\x00run\x00'
      case_insensitive: true
composite_rules:
  - id: win16-pcode-winini-run-write
    desc: Win16 binary writes win.ini run entry
    crit: suspicious
    conf: 0.95
    attack: T1547.001
    all:
      - id: micro-behaviors/fs/path/config/system::windows-win-ini-reference
      - id: micro-behaviors/fs/config/system::win16-write-private-profile
      - id: win16-windows-section-text
      - id: win16-run-key-text

  # WriteProfileString always writes win.ini, so this form has no file-name
  # leg. The composite above requires the file name that only the private
  # profile API carries.
  - id: win16-profile-run-write
    desc: Win16 binary writes win.ini run entry via WriteProfileString
    crit: suspicious
    conf: 0.92
    attack: T1547.001
    all:
      - id: micro-behaviors/fs/config/system::win16-write-profile-text
      - id: win16-windows-section-text
      - id: win16-run-key-text
