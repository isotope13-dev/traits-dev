defaults:
  platforms: [unix, windows]
  for: [ruby]

composite_rules:
  - id: extconf-windows-run-key
    desc: Extension hook with Windows Run key
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/os/autorun/login-items::ruby-run-key-command-registration
