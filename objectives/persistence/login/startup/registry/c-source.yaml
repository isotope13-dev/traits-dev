# Windows Registry Run key persistence - C/C++ source
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1547.001
composite_rules:
  - id: hklm-hkcu-pair
    desc: Both HKLM and HKCU registry hives
    crit: component
    conf: 0.85
    all:
      - id: micro-behaviors/os/registry/hive/reference::hklm-registry-hive-source
      - id: micro-behaviors/os/registry/hive/reference::hkcu-registry-hive-source
  - id: registry-run-persistence-source
    desc: Registry Run key persistence in source
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-source
      - id: micro-behaviors/os/registry/open::reg-open-key-ex-source
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
    unless:
      - id: micro-behaviors/os/registry/monitor::reg-notify-change-key-value-source
  - id: self-install-persistence
    desc: Self-copy and registry persistence
    crit: suspicious
    conf: 0.94
    all:
      - id: registry-run-persistence-source
      - id: micro-behaviors/os/sysinfo/directories::copy-to-sysdir-source
      - id: hklm-hkcu-pair
