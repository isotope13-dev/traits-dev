# Windows Registry Run key persistence - C/C++ source
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1547.001
traits:
  - id: c-startup-helper-prototype
    desc: Startup helper prototype takes a char pointer
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\w{0,30}Startup\w{0,20}\s{0,4}\(\s{0,4}(const\s{1,2})?(char|TCHAR|LPSTR)\s{0,2}\*'
  - id: c-registry-string-helper-prototype
    desc: Registry helper prototype takes HKEY and string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'HKEY\s{1,3}\w{1,20}\s{0,2},\s{0,2}char\s{0,2}\*'
  - id: backdoor-startup-identifier
    desc: Identifier names a backdoor startup routine
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)backdoor\w{0,30}startup'
composite_rules:
  - id: hklm-hkcu-pair
    desc: Both HKLM and HKCU registry hives
    crit: component
    conf: 0.85
    all:
      - id: micro-behaviors/os/registry/hive/reference::hklm-registry-hive-source
      - id: micro-behaviors/os/registry/hive/reference::hkcu-registry-hive-source
  - id: registry-run-persistence-source
    desc: Registry Run key persistence in source
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-source
      - id: micro-behaviors/os/registry/open::reg-open-key-ex-source
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
    unless:
      - id: micro-behaviors/os/registry/monitor::reg-notify-change-key-value-source
  - id: self-install-persistence
    desc: Self-copy and registry persistence
    crit: suspicious
    conf: 0.94
    all:
      - id: registry-run-persistence-source
      - id: micro-behaviors/os/sysinfo/directories::copy-to-sysdir-source
      - id: hklm-hkcu-pair
  # Startup helpers that take a string path or command line, next to the
  # registry string-writer prototypes they are built on. Benign installers can
  # share this shape, so the generic pair stays suspicious.
  - id: startup-registry-helper-source
    desc: C source declares startup and registry string helpers
    crit: suspicious
    conf: 0.92
    near_lines: 12
    all:
      - id: c-startup-helper-prototype
      - id: c-registry-string-helper-prototype
  # The backdoor identifier is the attack-intent leg. The helper shape around
  # it is what makes the declaration a startup persistence interface.
  - id: backdoor-startup-registry-helper-source
    desc: C header declares a backdoor startup registry helper
    crit: hostile
    conf: 0.94
    near_lines: 12
    all:
      - id: backdoor-startup-identifier
      - id: c-startup-helper-prototype
      - id: c-registry-string-helper-prototype
