defaults:
  crit: suspicious
  platforms: [windows]
  for: [c]
  attack: T1547.001
traits:
  - id: currentversion-run-path-source
    desc: CurrentVersion Run registry path
    conf: 0.92
    if:
      type: text
      exact: 'szRegAutoPath           db      "SOFTWARE\Microsoft\Windows\CurrentVersion\Run",0'
  - id: run-key-value-write-source
    desc: Run key value write
    conf: 0.93
    if:
      type: text
      exact: "invoke  RegSetValueEx, hkHandle, offset szBglAutoKey, 0, REG_SZ, offset szSysDirFileName, eax"
  - id: run-key-create-source
    desc: Run key creation
    conf: 0.9
    if:
      type: text
      exact: "invoke  RegCreateKey, HKEY_CURRENT_USER, offset szRegAutoPath, addr hkHandle"
composite_rules:
  - id: registry-run-key-source
    desc: Registry Run key persistence
    conf: 0.96
    all:
      - id: currentversion-run-path-source
      - id: run-key-value-write-source
    any:
      - id: run-key-create-source

  # Generic C/C++ spelling: the CurrentVersion Run path paired with a
  # RegSetValueEx call. The MASM-only composite above misses this form.
  - id: run-key-persistence-source
    desc: Run key persistence in native source
    conf: 0.95
    for: [c, cpp]
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/access::registry-set-value-source
    near_bytes: 1200

  # Redundant persistence: a Run key value plus an auto-start service that is
  # also started immediately. Legitimate installers use one mechanism through
  # an installer framework; wiring both by hand in a single native source is
  # a backdoor persistence pattern.
  - id: run-key-service-dual-persistence
    desc: Persists via Run key and auto-start service
    crit: hostile
    conf: 0.94
    for: [c, cpp]
    all:
      - id: run-key-persistence-source
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/os/service/configure::service-auto-start-setting
