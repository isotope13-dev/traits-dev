defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-run-key-mutation-members
    desc: Run-key path with managed mutation references
    crit: suspicious
    conf: 0.91
    attack: T1547.001
    # The PE metadata does not bind the SetValue receiver to this path. Keep
    # the description at co-occurrence; source review establishes this sample's
    # startup routine, which its configuration currently disables.
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/write::dotnet-registry-key-write
