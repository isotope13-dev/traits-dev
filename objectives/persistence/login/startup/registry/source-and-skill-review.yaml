composite_rules:
- id: regsvr32-dllinstall-run-key-persistence
  platforms:
  - windows
  conf: 0.98
  for:
  - batch
  desc: Run-key write with regsvr32 DllInstall invocation
  crit: hostile
  attack: T1218.010,T1547.001
  all:
  - id: objectives/execution/lolbin/regsvr32::regsvr32-dllinstall-proxy-exec
  - id: micro-behaviors/os/registry/write::batch-reg-add-run-key-direct
