defaults:
  for:
    - pe
  platforms:
    - windows
  attack: T1547.001
traits:
  - id: windows-error-reporting-value
    desc: WindowsErrorReporting Run value
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: WindowsErrorReporting
      section: .rdata
composite_rules:
  - id: windows-error-reporting-run-key
    desc: WindowsErrorReporting Run key persistence
    crit: suspicious
    conf: 0.96
    all:
      - id: windows-error-reporting-value
    any:
      - id: micro-behaviors/os/registry/keys::software-run-key-reference
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
