# A pkg-packed Node.js executable that registers itself under the
# UserInitMprLogonScript value runs on every logon without a Run key. With
# a Gist dead-drop for its server address, the autostart belongs to a bot.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1037.001,T1102.001
composite_rules:
  - id: pkg-node-logon-script-gist-bot
    desc: pkg Node bot autostarts via logon script value
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: micro-behaviors/os/registry/keys/autostart::userinit-mpr-logon-script-value
      - id: micro-behaviors/communications/http/url/github::gist-githubusercontent-raw-binary-url
    unless:
      - id: metadata/signed/platform/
