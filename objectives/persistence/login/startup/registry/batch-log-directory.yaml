defaults:
  for: [batch]
  platforms: [windows]
  crit: suspicious
  attack: T1547.001
traits:
  - id: batch-run-key-log-directory-executable
    desc: Run key persists executable from logs directory
    ref: https://businessinsights.bitdefender.com/eggstreme-malware-revises-architecture-infrastructure
    # Join key and data fragments only within the same REG ADD command.
    if:
      type: yara
      source: |
        rule batch_run_key_log_directory_executable {
          strings:
            $command = /(^|[\r\n&|])[ \t@(]*reg(\.exe)?[ \t]+add[ \t]+[^\r\n&|]{1,600}/ nocase
            $head = /(^|[\r\n&|])[ \t@(]*reg(\.exe)?[ \t]+add[ \t]+/ nocase
            $hive = /"?(HKCU|HKLM|HKEY_CURRENT_USER|HKEY_LOCAL_MACHINE)\\/ nocase
            $key = /Software\\Microsoft\\Windows\\CurrentVersion\\Run"?[ \t]/ nocase
            $data = /[ \t]\/d[ \t]+"?%(LOCALAPPDATA|APPDATA)%\\[^"\r\n&|]{1,180}\\logs/ nocase
            $exe = /\\[^"\\\r\n&|]{1,80}\.exe("|[ \t\r\n]|$)/ nocase
          condition:
            for any c in (1..#command) : (
              for any p in (1..#head) : (
                @head[p] == @command[c] and
                for any h in (1..#hive) : (
                  @hive[h] == @head[p] + !head[p] and
                  for any k in (1..#key) : (
                    @key[k] == @hive[h] + !hive[h] and
                    for any d in (1..#data) : (
                      @data[d] >= @key[k] + !key[k] - 1 and
                      for any e in (1..#exe) : (
                        @exe[e] == @data[d] + !data[d] and
                        @exe[e] + !exe[e] <= @command[c] + !command[c] + 1
                      )
                    )
                  )
                )
              )
            )
        }
