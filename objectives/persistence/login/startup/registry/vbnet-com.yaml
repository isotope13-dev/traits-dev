# These traits are named for VB.NET, but VB.NET source is identified as
# `vbs`; without it here they only ever matched the C# spelling.
defaults:
  platforms: [windows]
  for: [csharp, vbs]
  attack: "T1547.001"
traits:
  - id: interaction-createobject
    desc: VB.NET COM object creation
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: "Interaction.CreateObject("
  - id: late-bound-regwrite
    desc: Late-bound registry write call
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: '"regwrite"'
      case_insensitive: true
  - id: vbnet-filecopy
    desc: VB.NET FileSystem.FileCopy operation
    crit: suspicious
    conf: 0.80
    if:
      type: text
      substr: "FileSystem.FileCopy"
  - id: specialfolder-appdata
    desc: SpecialFolder.ApplicationData path
    crit: notable
    conf: 0.80
    if:
      type: text
      substr: "SpecialFolder.ApplicationData"
composite_rules:
  - id: com-registry-persistence
    desc: COM interop registry persistence
    crit: suspicious
    conf: 0.92
    all:
      - id: late-bound-regwrite
    any:
      - id: micro-behaviors/os/com/automation::wscript-shell-createobject
      - id: interaction-createobject
  - id: appdata-self-copy
    desc: Self-copy to AppData directory
    crit: suspicious
    conf: 0.90
    all:
      - id: specialfolder-appdata
    any:
      - id: vbnet-filecopy
      - id: micro-behaviors/fs/read/self::executable-path-self-reference
