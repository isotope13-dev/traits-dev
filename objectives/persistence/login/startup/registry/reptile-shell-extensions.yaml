defaults:
  attack: T1547.001
  platforms:
    - windows
  for:
    - c
    - cpp
traits:
  - id: shell-extensions-key
    desc: Shell Extensions registry path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: 'SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Shell Extensions'
  - id: meltme-value
    desc: MeltMe registry state value
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      exact: MeltMe
  # The bare word `Record` is one of the Reptile loader's state value names,
  # but as a string literal it is ordinary vocabulary (Groonga's mruby
  # bindings name a class "Record"). It only means something beside the
  # Shell Extensions key in the composite below, so it is a fragment.
  - id: record-string-literal
    desc: String literal is exactly Record
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: Record
  - id: installed-time-value
    desc: Installed Time state value
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      exact: Installed Time
composite_rules:
  - id: shell-extensions-state-persistence
    desc: Shell Extensions stateful persistence
    crit: suspicious
    conf: 0.97
    all:
      - id: shell-extensions-key
    needs: 2
    any:
      - id: meltme-value
      - id: record-string-literal
      - id: installed-time-value
