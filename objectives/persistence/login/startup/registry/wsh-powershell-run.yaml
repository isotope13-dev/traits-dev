defaults:
  attack: T1547.001
  platforms:
    - windows
  for:
    - javascript
    - vbs

traits:
  # WSH scripts call WScript.Shell.RegWrite to create Run values. The call and
  # the Run key path are often built on separate lines, so the two are paired
  # by proximity in the composite below rather than in one regex.
  - id: wsh-regwrite-call
    desc: WSH script calls RegWrite
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\.RegWrite\s*\('

  - id: wsh-run-key-path
    desc: WSH script references a Run key path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'CurrentVersion\\+Run\b'

composite_rules:
  # A WSH script that writes a Run value and hides a PowerShell launch within
  # a few lines persists a hidden PowerShell payload at logon. Installers that
  # add a Run value do not also spell out a hidden, policy-bypassing
  # PowerShell command next to it.
  - id: wsh-powershell-run-key-persistence
    desc: WSH script persists hidden PowerShell via Run key
    crit: hostile
    conf: 0.97
    attack: T1547.001,T1059.007
    mbc: F0008
    near_lines: 12
    all:
      - id: wsh-regwrite-call
      - id: wsh-run-key-path
      - id: objectives/execution/interpreter/script/wsh::powershell-bypass-hidden
