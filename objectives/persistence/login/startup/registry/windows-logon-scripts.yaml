defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1037.001
traits:
- id: logon-script-registry--rx-1
  desc: UserInitMprLogonScript registry value name
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)UserInitMprLogonScript'

- id: logon-script-registry--rx-2
  desc: "Matches '\\Group Policy\\Scripts\\Logon'"
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: \Group Policy\Scripts\Logon
- id: logon-script-registry--rx-3
  desc: "Matches '\\Scripts\\Logon'"
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: \Scripts\Logon
- id: logon-script-registry--rx-4
  desc: "Matches '\\Policies\\System\\Scripts'"
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: \Policies\System\Scripts
composite_rules:
- id: logon-script-registry-write
  for: [pe]
  desc: Windows logon script registry write
  crit: hostile
  conf: 0.9
  all:
  - id: logon-script-registry
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  downgrade:
    any:
    - id: metadata/signed/platform/
  unless:
  - id: well-known/app/utility/windows-gp-script::gpscript-system-context
  - id: metadata/binary/vendor::microsoft-signed-system-component-context
- id: logon-script-registry
  desc: References Windows logon-script registry paths
  crit: suspicious
  conf: 0.86
  any:
  - id: logon-script-registry--rx-1
  - id: logon-script-registry--rx-2
  - id: logon-script-registry--rx-3
  - id: logon-script-registry--rx-4
  unless:
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-tool
  - id: well-known/app/utility/windows-gp-script::gpscript-system-context
  - id: metadata/binary/vendor::microsoft-signed-system-component-context
