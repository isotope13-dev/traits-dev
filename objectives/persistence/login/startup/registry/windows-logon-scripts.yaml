defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1037.001
traits:
composite_rules:
- id: logon-script-registry-write
  for: [pe]
  desc: Windows logon script registry write
  crit: hostile
  conf: 0.9
  all:
  - id: micro-behaviors/os/autorun/login-items::windows-logon-script-reference
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  downgrade:
    any:
    - id: metadata/signed/platform/
  unless:
  - id: well-known/app/utility/windows-gp-script::gpscript-system-context
  - id: metadata/binary/vendor::microsoft-signed-system-component-context
- id: powershell-userinit-mpr-pythonw-payload
  for: [powershell]
  desc: UserInitMprLogonScript registers pythonw payload
  crit: hostile
  conf: 0.96
  attack: T1037.001,T1105,T1059.006
  all:
  - id: micro-behaviors/os/registry/keys::userinit-mpr-logon-script-value
  - id: micro-behaviors/process/interpreter/python::pythonw-launch
  - id: micro-behaviors/communications/http/client/webclient::webclient-download-file
- id: powershell-sp-registry-pythonw-webclient-payload
  for: [powershell]
  desc: sp alias persists fetched pythonw script command
  crit: hostile
  conf: 0.95
  attack: T1547.001,T1105,T1059.006
  all:
  - id: micro-behaviors/os/registry/write::powershell-sp-registry-string-write
  - id: micro-behaviors/process/interpreter/python::pythonw-launch
  - id: micro-behaviors/communications/http/client/webclient::webclient-download-file