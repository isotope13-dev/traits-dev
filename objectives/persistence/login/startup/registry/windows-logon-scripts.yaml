defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1037.001
traits:
composite_rules:

- id: native-userinit-mpr-logon-script
  for: [c, cpp]
  desc: Native source sets UserInitMprLogonScript
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/registry/keys/autostart::userinit-mpr-logon-script-value
  - id: micro-behaviors/os/registry/access::registry-set-value-source
  near_bytes: 800
- id: powershell-userinit-mpr-pythonw-payload
  for: [powershell]
  desc: UserInitMprLogonScript registers pythonw payload
  crit: hostile
  conf: 0.96
  attack: T1037.001,T1105,T1059.006
  all:
  - id: "micro-behaviors/os/registry/keys/autostart::userinit-mpr-logon-script-value"
  - id: micro-behaviors/fs/path/basename::pythonw-executable-reference
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
- id: powershell-sp-registry-pythonw-webclient-payload
  for: [powershell]
  desc: sp alias persists fetched pythonw script command
  crit: hostile
  conf: 0.95
  attack: T1547.001,T1105,T1059.006
  all:
  - id: micro-behaviors/data/property/write::powershell-provider-string-property-alias
  - id: micro-behaviors/fs/path/basename::pythonw-executable-reference
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
