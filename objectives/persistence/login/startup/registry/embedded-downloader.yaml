defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.99
  attack: T1547.001,T1059.001

composite_rules:
  - id: dotnet-run-key-elevating-downloader
    desc: Run key persists an elevating downloader
    crit: hostile
    all:
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/process/create/start-process::powershell-loop-retries-elevation
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
