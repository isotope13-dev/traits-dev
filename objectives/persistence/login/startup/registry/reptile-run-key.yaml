defaults:
  attack: "T1547.001"
  for: [c, cpp]
  platforms: [windows]
# The Run key path atom used to live here as reptile-run-key-path, a generic
# CurrentVersion\Run matcher wearing a family name. It duplicated the canonical
# micro-behaviors/os/registry/keys::currentversion-run atom, so the composite
# below references that atom directly.
traits:
  - id: reptile-run-value
    desc: Reptile Run value name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'runkey.{0,48}"virus"'
composite_rules:
  - id: reptile-run-key-persistence
    desc: Reptile registry Run persistence
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: reptile-run-value
