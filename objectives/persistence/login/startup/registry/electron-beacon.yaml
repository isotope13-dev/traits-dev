defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1547.001,T1071.001

composite_rules:
  # Electron's documented auto-launch API is ordinary on its own. Paired with a
  # delayed endless loop that reports the computer and user name, the app keeps
  # itself running at every logon in order to beacon.
  - id: electron-autostart-host-beacon-loop
    desc: Electron autostart with host-identity beacon loop
    crit: hostile
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/autorun/login-items::electron-open-at-login-setting
      - id: objectives/command-and-control/backdoor/tasking/json-http::js-beacon-host-identity-array
      - id: objectives/command-and-control/backdoor/tasking/json-http::js-sleep-poll-loop
