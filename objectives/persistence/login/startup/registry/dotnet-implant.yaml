defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001,T1071.001

composite_rules:
  - id: managed-ssl-tcp-registry-persistence-backdoor
    desc: Unsigned managed SSL TCP implant persists via registry
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/communications/socket/create::dotnet-tcpclient-channel
      - id: micro-behaviors/communications/socket/ssl::dotnet-sslstream-type
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-create-subkey-member
    any:
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-delete-value-member
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
