defaults:
  attack: T1547.001
  crit: suspicious
  for:
  - pe
  - oledoc
  - powershell
  - batch
  - csharp
  - python
  - go
  platforms:
  - windows
traits:
- id: hklm-run
  desc: References HKLM Run path only
  crit: component
  conf: 0.6
  if:
    type: text
    regex: HKLM.{0,50}\\Run(\\|$|["'\s])
  unless:
  - id: well-known/tool/detection/malware-config-parser
  - id: metadata/package/vendor::bitdefender-ctc-module
  - id: metadata/file/profile/source-indications/

- id: script-style-run-value
  desc: Script-like Run value name
  crit: component
  conf: 0.78
  if:
    type: text
    regex: (?i)\b[a-z]{4,}[_-]script\d{2,}\b
- id: run-key-wscript-vbs-launcher
  desc: Run key launches WScript VBS
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?is)CurrentVersion\\Run.{0,120}wscript\.exe.{0,220}\.vbs
  unless:
  - id: well-known/app/infrastructure/
- id: windows-powershell-registry
  desc: Modifies registry for persistence via PowerShell
  conf: 0.9
  crit: suspicious
  if:
    type: trait
    id: micro-behaviors/os/autorun/login-items::run-key-write-ps
- id: reg-add-user-shell-folders
  desc: Reg add targets User Shell Folders key
  crit: notable
  conf: 0.95
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\breg(\.exe)?\s+add\s+[^\r\n]{0,70}Explorer\\User Shell Folders'
- id: reg-startup-value-definition
  desc: Registry Startup value declaration
  crit: notable
  conf: 0.95
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)/v\s+Startup\s+/t\s+REG_SZ\s+/d\b'
- id: game-service-run-value-prefix
  desc: Game service Run value prefix
  crit: notable
  conf: 0.94
  if:
    type: text
    word: ServizioGioco_
- id: network-module-run-value-prefix
  desc: Network module Run value prefix
  crit: notable
  conf: 0.94
  if:
    type: text
    word: ModuloRete_
- id: italian-run-key-success
  desc: Italian Run key success text
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: aggiunto all'avvio
composite_rules:
- id: run-key-persistence-with-recovery-disable
  desc: Run-key persistence paired with disabling Windows recovery
  crit: hostile
  conf: 0.98
  attack: T1547.001,T1490
  for: [pe]
  all:
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: micro-behaviors/os/recovery::reagentc-disable-winre
- id: temp-wscript-run-key-persistence
  desc: Run key persists a VBScript from TEMP
  crit: hostile
  conf: 0.99
  attack: T1059.005,T1547.001
  for: [batch, powershell]
  near_lines: 8
  all:
  - id: run-key-wscript-vbs-launcher
  - id: micro-behaviors/process/create/shell/script-host::temp-script-host-path
# A Run key whose payload sits directly on a drive root (C:\x.exe) is staging,
# not installation: legitimate software persists from Program Files, AppData
# or a managed location, never a bare root executable. The near_lines bind
# keeps a distant root-path mention (an uninstaller log line, a comment) from
# joining an unrelated Run write.
- id: run-key-root-drive-executable
  desc: Run key persists drive-root executable
  crit: hostile
  conf: 0.96
  for: [batch]
  near_lines: 8
  all:
  - id: micro-behaviors/os/registry/write::batch-reg-add-run-key-direct
  - id: micro-behaviors/fs/path/drive-root::drive-root-executable-path

- id: windows-run-key-script-launcher
  desc: Run key persists script launcher
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/keys/autostart::run-key-path-reference
  - id: run-key-wscript-vbs-launcher
  - id: hklm-run
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
  any:
  - id: script-style-run-value
  downgrade:
    any:
    - id: metadata/package/completeness/
- id: windows-registry-windows-run-value
  for: [pe]
  desc: Writes Run value in Windows key
  conf: 0.9
  crit: suspicious
  all:
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-windows-load-run-path"
  - id: "micro-behaviors/os/registry/keys/autostart::windows-run-key-path"
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
- id: service-persistence-dropper-loader
  desc: Service persistence paired with dropper loader
  crit: hostile
  conf: 0.96
  for: [pe]
  all:
  - id: micro-behaviors/os/service/create::sc-create-command
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-temp-write-api-cluster
  - id: objectives/evasion/security-bypass/policy/execution::bypass-execution-policy
  any:
  - id: metadata/build/manifest::pe-requires-admin
  - id: objectives/command-and-control/beacon/network/http::direct-http-c2-binary-ip
  - id: micro-behaviors/os/virtualization/hypervisor::vm-vendor-hardware-references
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/
- id: user-shell-folders-startup-redirection
  desc: Explorer Startup folder redirected for persistence
  crit: hostile
  conf: 0.98
  for: [pe, dll]
  all:
    - id: reg-add-user-shell-folders
    - id: reg-startup-value-definition
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
    - id: metadata/signed/platform/
- id: pe-startup-folder-registry-persistence
  for: [pe]
  desc: Startup folder persistence with registry fingerprinting
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/persistence/login/startup/folder::startup-folder-shell-path-composition-chain
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  any:
  - id: micro-behaviors/process/sync/mutex::guid-mutex
  - id: micro-behaviors/process/info/current::get-module-filename
  - id: micro-behaviors/process/create/spawn::create-process-w
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor::is-microsoft-named
    - id: metadata/binary/symbols/count::many-imports
    - id: micro-behaviors/os/service/config/
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/lang/compiler/native/
    - id: metadata/binary/debug::pe-dwarf-debug-section
# Named for what the legs actually prove. `copyfile-a` is only one of three
# interchangeable `any:` options and `needs: 2` is satisfied without it by
# GetSystemDirectory plus GetModuleFileName, so the previous
- id: pe-game-service-run-key-persistence
  desc: Game service Run key persistence
  crit: suspicious
  conf: 0.96
  for: [pe]
  all:
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  any:
  - id: game-service-run-value-prefix
  - id: network-module-run-value-prefix
  - id: italian-run-key-success
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
- id: vb6-run-key-self-install
  desc: VB6 self-copy Run key persistence
  crit: hostile
  conf: 0.96
  for: [pe]
  all:
  - id: metadata/binary/framework::vb6-application-framework
  - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  - id: micro-behaviors/fs/file/copy::vb6-rtcfilecopy
  - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory-string
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
