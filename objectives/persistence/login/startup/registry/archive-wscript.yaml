defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: archive-wscript-runkey-profile
    desc: TEMP script-host Run-key persistence near archive download and extraction
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105,T1547.001
    for: [batch, powershell]
    near_lines: 8
    all:
      - id: objectives/execution/staging/http::archive-download-temp-script-host-clues
      - id: objectives/persistence/login/startup/registry::temp-wscript-run-key-persistence
