defaults:
  platforms: [windows]
  for: [c, cpp, python]
  attack: T1037.001

traits:
  - id: native-userinit-mpr-value-write
    desc: Writes UserInitMprLogonScript logon activation
    for: [c, cpp]
    crit: suspicious
    conf: 0.96
    if:
      # Wide C string arguments are opaque to the call-argument projection.
      # The call node excludes examples appearing only in strings/comments.
      type: tree-sitter
      kind: call
      regex: 'RegSetValueEx[AW]?\s*\([^,]{1,64},\s*L?"(?i:UserInitMprLogonScript)"'
  - id: winreg-userinit-mpr-value-write
    desc: winreg sets UserInitMprLogonScript activation
    for: [python]
    crit: suspicious
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetValueEx$'
      arg:
        index: 1
        kind: string
        regex: '(?i)^UserInitMprLogonScript$'

