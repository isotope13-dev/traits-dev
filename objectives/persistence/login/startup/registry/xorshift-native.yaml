defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  - id: keystream-run-key-self-copy
    desc: Encoded Run-key prefix with self-copy and registry APIs
    crit: suspicious
    conf: 0.96
    attack: T1547.001,T1027
    all:
      - id: micro-behaviors/os/registry/keys/autostart::x86-xorshift-run-key-prefix
      - id: micro-behaviors/fs/file/copy/call::copyfile-module-path-api-pair
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/os/registry/access::reg-open-key-ex-a-symbol
