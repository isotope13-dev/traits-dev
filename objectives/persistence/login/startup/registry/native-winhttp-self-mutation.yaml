# An unauthenticated remote stage paired with machine startup registration
# and deliberate self-image mutation is a hostile persistence pattern.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001,T1105

composite_rules:
  - id: unauthenticated-winhttp-self-mutating-run-key
    desc: Bare-IP WinHTTP downloader self-mutates and registers machine startup
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/communications/tls/verify/disable::x86-winhttp-ignore-certificate-errors
      - id: micro-behaviors/os/autorun/login-items::native-standby-self-mutation-run-key
