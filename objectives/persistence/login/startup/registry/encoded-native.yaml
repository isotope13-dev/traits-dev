defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001

traits:
  - id: encoded-currentversion-run-path
    desc: XOR-obfuscated Windows Run key path
    crit: suspicious
    conf: 0.97
    if:
      type: encoded
      encoding: xor
      regex: '(?i)\\Microsoft\\Windows\\CurrentVersion\\Run(\\|$)'

  - id: encoded-run-key-install-status
    desc: XOR-obfuscated Run key install status
    crit: suspicious
    conf: 0.97
    if:
      type: encoded
      encoding: xor
      regex: '(?i)\b(Run key registered|installing persistence|Run key is primary|Run key open FAIL)\b'

composite_rules:
  - id: obfuscated-kernel-callback-rundll32-persistence
    desc: Obfuscated callback driver stages Rundll32 persistence
    crit: hostile
    conf: 0.995
    attack: T1547.001,T1218.011,T1027
    all:
      - id: micro-behaviors/os/kernel/module::native-kernel-api-context
      - id: micro-behaviors/os/kernel/callback::process-lifecycle-callback
      - id: micro-behaviors/os/registry/hive::create-registry-key
      - id: micro-behaviors/os/registry/hive::set-registry-value
      - id: micro-behaviors/process/create/shell/script-host::rundll32-dll-unregister-command
      - id: micro-behaviors/data/encode/custom::x86-stack-table-in-place-decoder
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/security/
  - id: encoded-run-key-persistence
    desc: Encoded Run key persistence setup
    crit: hostile
    conf: 0.99
    all:
      - id: encoded-currentversion-run-path
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    any:
      - id: encoded-run-key-install-status
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/


  - id: encoded-run-key-pipe-shell-backdoor
    desc: XOR Run key with pipe shell and self-delete
    crit: hostile
    conf: 0.95
    all:
      - id: encoded-currentversion-run-path
      - id: micro-behaviors/process/interpreter/shell::encoded-cmd-exe-reference
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
