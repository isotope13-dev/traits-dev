# PE resource droppers that also plant HKCU/HKLM ...\CurrentVersion\Run.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001,T1027.009
  mbc: F0012

composite_rules:
  - id: rsrc-temp-shellexec-run-key
    desc: Resource temp dropper persists via Run key
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::reg-create-key-ex-a
    any:
      - id: metadata/binary/resource::oversized-rsrc
      - id: metadata/binary/metrics/size::multi-megabyte-pe-negligible-code
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/framework/
      - id: well-known/app/system/iobit::iobit-signed-component-context
