# A line appended to an interactive shell startup file that backgrounds an
# executable under the user Library. Package managers source a snippet from
# .zshrc; they do not detach a Library binary, with output discarded, on
# every new shell. That is a repair hook re-installing persistence.
defaults:
  platforms: [macos]
  for: [shell]
  attack: T1546.004

traits:
  - id: library-exec-background-discarded
    desc: Backgrounds a Library path with output discarded
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Library/(Application Support|LaunchAgents)/[^\n]{0,180}>\s*/dev/null\s+2>&1\s*&'

composite_rules:
  - id: shell-rc-library-background-hook
    desc: Shell startup backgrounds a Library executable
    crit: suspicious
    conf: 0.93
    near_lines: 20
    all:
      - id: zshrc-operation
      - id: library-exec-background-discarded
