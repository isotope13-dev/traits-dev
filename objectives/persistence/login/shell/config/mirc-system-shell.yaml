defaults:
  platforms: [windows]
  for: [mirc]
composite_rules:
  - id: mirc-startup-system-shell-persistence
    desc: mIRC startup adds itself to system shell
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/irc/handler::mirc-script-event-start
      - id: micro-behaviors/fs/config/system::mirc-write-system-ini-boot-shell
      - id: micro-behaviors/fs/config/system::mirc-explorer-client-shell-value
