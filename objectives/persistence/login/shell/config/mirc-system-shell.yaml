defaults:
  platforms: [windows]
  for: [mirc]
composite_rules:
  - id: mirc-startup-system-shell-persistence
    desc: mIRC startup adds itself to system shell
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/irc/handler::mirc-script-event-start
      - id: micro-behaviors/fs/config/system::mirc-write-system-ini-boot-shell
      - id: micro-behaviors/fs/config/system::mirc-explorer-client-shell-value
  # Bot scripts that keep the shell write in an `autorun` alias called from
  # both the start and exit handlers sit too far from the start event for the
  # proximity rule above. An mIRC script that writes itself in as the system
  # shell and relaunches on exit is persistence and a watchdog in one.
  - id: mirc-autorun-shell-persistence-relaunch
    desc: mIRC sets itself as system shell and relaunches on exit
    crit: hostile
    conf: 0.96
    attack: T1547
    all:
      - id: micro-behaviors/fs/config/system::mirc-write-system-ini-boot-shell
      - id: micro-behaviors/fs/config/system::mirc-explorer-client-shell-value
      - id: well-known/app/communication/mirc::mirc-exit-relaunch
