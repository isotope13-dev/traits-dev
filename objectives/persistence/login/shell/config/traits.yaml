defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
traits:
- id: shell-login
  desc: .bash_login shell configuration file
  crit: notable
  conf: 0.75
  attack: T1546.004
  if:
    type: string_literal
    substr: .bash_login
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-logout
  desc: .bash_logout shell configuration file
  crit: suspicious
  conf: 0.85
  attack: T1546.004
  if:
    type: string_literal
    substr: .bash_logout
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: profile-source-operation
  desc: Sources a .profile shell configuration file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\b(source|\.)\s+(~|[$]HOME|\.?/)?\.profile\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: profile-redirect-operation
  desc: Redirects content to a .profile file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: text
    regex: '(?i)>>?\s*(~|[$]HOME|\.?/)?\.profile\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: profile-read-command
  desc: Reads a .profile shell configuration file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\bcat\s+(~|[$]HOME|\.?/)?\.profile\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: profile-write-command
  desc: Changes a .profile shell configuration file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\b(touch|chmod)\s+(~|[$]HOME|\.?/)?\.profile\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: profile-copy-command
  desc: Copy-style command targets a .profile file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\b(cp|mv)\s+[^\r\n]{1,80}\s+(~|[$]HOME|\.?/)?\.profile\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: profile-remove-command
  desc: Removal-style command targets a .profile file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\b(rm|sed)\s+[^\r\n]{1,80}\s+(~|[$]HOME|\.?/)?\.profile\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/build/autotools::autoconf-generated-script
- id: zshrc-operation
  desc: References .zshrc modification or sourcing
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)(>>?|source|touch|chmod|cp|mv|sed|perl)[^\r\n]{0,80}\.zshrc\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: well-known/app/infrastructure/nvidia-nvcf::developer-setup-script
  - id: well-known/app/ai/gateway/opencode-router
  - id: well-known/tool/development/bridge-cli::install-script-header
  - type: text
    substr: "Add it by appending this line to your shell profile"
  - type: text
    substr: "Add this to your shell config"
  - type: text
    substr: .zshrc.d/
  - type: text
    regex: 'export PATH="\$INSTALL_DIR'
  downgrade:
    any:
    - id: micro-behaviors/dylib/library/family/
- id: zprofile
  desc: .zprofile shell configuration file
  crit: notable
  conf: 0.7
  attack: T1546.004
  if:
    type: string_literal
    substr: .zprofile
  downgrade:
    any:
    - id: micro-behaviors/dylib/library/family/
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: well-known/tool/development/bridge-cli::install-script-header
  - type: text
    regex: 'export PATH="\$INSTALL_DIR'
- id: zlogin-redirect
  desc: Redirects content to .zlogin
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)(>>?|\btee\b)[^\r\n]{0,80}\.zlogin'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: zlogin-copy-command
  desc: Copies or removes a .zlogin file
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\b(cp|mv|rm)\b[^\r\n]{0,64}\.zlogin'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: zlogin-permission-command
  desc: Changes .zlogin file permissions
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\b(touch|chmod|install)\b[^\r\n]{0,64}\.zlogin'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: zlogin-edit-command
  desc: Edits a .zlogin file with sed
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\bsed\b[^\r\n]{0,64}\.zlogin'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: zlogout
  desc: .zlogout shell configuration file
  crit: suspicious
  conf: 0.85
  attack: T1546.004
  if:
    type: string_literal
    substr: .zlogout
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hardcoded-profile
  desc: Hardcoded path to .profile file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: string_literal
    regex: /[\w./]{0,32}/\.profile
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hardcoded-bashrc
  desc: Hardcoded path to .bashrc file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: string_literal
    regex: /[\w./]{0,32}/\.bashrc
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hardcoded-zshrc
  desc: References a command that writes to .zshrc
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: text
    regex: '(?i)(>>?|tee)[^\r\n]{0,80}\.zshrc|\.zshrc[^\r\n]{0,80}(>>?|tee)'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  # A shell startup file is itself configuration; this rule is for a
  # program that modifies the startup target.
  - type: basename
    exact: .zshrc
- id: hex-profile
  desc: Hex-escaped .profile path
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2F\x2E\x70\x72\x6F\x66\x69\x6C\x65
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-bashrc
  desc: Hex-escaped .bashrc path
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2F\x2E\x62\x61\x73\x68\x72\x63
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-zshrc
  desc: Hex-escaped .zshrc path
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2F\x2E\x7A\x73\x68\x72\x63
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-bash-profile
  desc: Hex-escaped .bash_profile path
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2F\x2E\x62\x61\x73\x68\x5F\x70\x72\x6F\x66\x69\x6C\x65
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-nohup-perl
  desc: Hex-escaped nohup perl command
  crit: suspicious
  conf: 0.98
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x6E\x6F\x68\x75\x70\x20\x70\x65\x72\x6C
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hidden-system-pl
  desc: Hidden .system.pl payload path
  crit: suspicious
  conf: 0.97
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2E\x73\x79\x73\x74\x65\x6D\x2E\x70\x6C
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: posixly-correct
  desc: POSIXLY_CORRECT environment variable
  crit: notable
  conf: 0.3
  if:
    type: string_literal
    substr: POSIXLY_CORRECT
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: cshrc-file
  desc: C shell startup file reference
  crit: notable
  conf: 1.0
  if:
    type: string_literal
    substr: .cshrc
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: tcsh-keyword
  desc: tcsh keyword (shell name)
  crit: notable
  conf: 1.0
  if:
    type: string_literal
    word: tcsh
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
# The three branches below are the per-shell halves of the `shell-rc-target-text`
# alternation. Each names one shell family's startup files, so an analyst reading a
# diff can tell WHICH rc file a package started referencing. They were previously
# `--rx-1/2/3` described as "Regex component marker", which named neither the shell
# nor the file and read identically for all three -- every dotfile installer,
# postinst, devcontainer bootstrap and CI script that mentions a startup file
# surfaced that placeholder in JSON, the web UI and version diffs. Each stays
# `component`: a bare path mention is not by itself a write to that file; the
# persistence reading comes from the composites that pair `shell-rc-target-text`
# with a fetch/eval or installer leg.
# (The stray `count_max: 10278xx` sentinels dropped with this rewrite were splitter
# artefacts ~1e6 -- unreachable, so removing them changes no match.)
- id: bash-rc-path-text
  desc: References a .bashrc or .bash_profile path
  crit: component
  conf: 0.82
  if:
    type: text
    regex: \.(bashrc|bash_profile)\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: sh-login-profile-path-text
  desc: References a .bash_login or .profile path
  crit: component
  conf: 0.82
  if:
    type: text
    regex: \.(bash_login|profile)\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: zsh-rc-path-text
  desc: References a .zshrc or .zprofile path
  crit: component
  conf: 0.82
  if:
    type: text
    regex: \.(zshrc|zprofile)\b
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: apm-runtime-path-update
  desc: APM runtime PATH setup marker
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: "Added by APM runtime setup"
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-env-file-source-line
  desc: Shell env source line
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(source|\.)\s+["'']?\$[A-Za-z_][A-Za-z0-9_]*\/env'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-profile-source-append
  desc: Appends sourced command to shell profile
  crit: notable
  conf: 0.94
  attack: T1546.004
  if:
    type: text
    regex: 'source[^\n>]{0,120}>>[^\n]{0,40}\.(bash_profile|zprofile|zshrc|profile)\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
composite_rules:
- id: zlogin
  desc: Modifies a .zlogin shell configuration file
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  any:
  - id: zlogin-redirect
  - id: zlogin-copy-command
  - id: zlogin-permission-command
  - id: zlogin-edit-command
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: profile
  desc: .profile shell configuration file operation
  crit: notable
  conf: 0.9
  attack: T1546.004
  any:
  - id: profile-source-operation
  - id: profile-redirect-operation
  - id: profile-read-command
  - id: profile-write-command
  - id: profile-copy-command
  - id: profile-remove-command
- id: shell-files
  desc: Bash shell configuration files
  crit: notable
  conf: 0.7
  attack: T1546.004
  any:
  - id: shell-login
  - id: profile
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: multi-file-access
  desc: Multiple shell config files accessed
  crit: notable
  conf: 0.9
  attack: T1546.004
  needs: 3
  any:
  - id: shell-login
  - id: profile
  - id: micro-behaviors/fs/path/config/shell::bash-profile-filename
  - id: micro-behaviors/fs/path/config/shell::bashrc-filename
  - id: zshrc-operation
  - id: zprofile
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: posixly-correct
  - id: cshrc-file
  - id: tcsh-keyword
  - id: apm-runtime-path-update
  - id: objectives/persistence/login/shell/config/
  - id: metadata/package/testing/presence/harness::shell-crate-test-path
- id: shell-rc-remote-bootstrap
  desc: Shell profile modification after remote bootstrap
  crit: notable
  conf: 0.94
  attack: T1546.004
  near_lines: 40
  all:
  - id: shell-rc-target-text
  any:
  - id: objectives/command-and-control/dropper/execution/eval::fetch-eval
  - id: objectives/command-and-control/dropper/execution/eval::process-substitution
  - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
# The id says elf, the description says "Binary", but the file default is
# `for: [shell]`, so this could only ever fire on a SHELL SCRIPT — the one
# format where naming ~/.bashrc is unremarkable. byobu-janitor.in, whose job is
# tidying byobu's own snippet out of the user's rc files, scored shell-profile
# persistence on it. Declare the format the name and description claim: an ELF
# that embeds rc paths is a compiled implant writing shell persistence, which is
# the real signal. Script-based rc persistence stays covered by the composites
# above, which correctly require a fetch-eval or curl-pipe-exec leg too.
- id: elf-hardcoded
  desc: Binary with hardcoded shell config
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [binaries]
  any:
  - id: hardcoded-profile
  - id: hardcoded-bashrc
  - id: hardcoded-zshrc
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-multi-file-access
  desc: Multiple hex-escaped shell rc files
  crit: suspicious
  conf: 0.98
  attack: T1546.004
  for: [perl]
  needs: 3
  any:
  - id: hex-profile
  - id: hex-bashrc
  - id: hex-zshrc
  - id: hex-bash-profile
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: perl-shell-rc-persistence
  desc: Perl shell rc persistence chain
  crit: hostile
  conf: 0.99
  attack: T1546.004
  for: [perl]
  all:
  - id: hex-nohup-perl
  - id: hidden-system-pl
  - id: hex-multi-file-access
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: perl-shell-rc-c2-persistence
  desc: Perl shell rc persistence with HTTP C2 bootstrap
  crit: hostile
  conf: 0.98
  attack: T1546.004
  for: [perl]
  all:
  - id: perl-shell-rc-persistence
  - id: micro-behaviors/communications/http/lib/lwp::perl-lwp-useragent
  any:
  - id: objectives/command-and-control/infrastructure/ip::port-number-constant
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-rc-target-text
  desc: Shell RC file path reference
  crit: component
  conf: 0.82
  any:
  - id: bash-rc-path-text
  - id: sh-login-profile-path-text
  - id: zsh-rc-path-text
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-profile-env-installer-setup
  desc: Installer shell env setup
  crit: notable
  conf: 0.9
  all:
  - id: shell-env-file-source-line
  any:
  - id: shell-login
  - id: profile
  - id: micro-behaviors/fs/path/config/shell::bash-profile-filename
  - id: micro-behaviors/fs/path/config/shell::bashrc-filename
  - id: zshrc-operation
  - id: zprofile
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
