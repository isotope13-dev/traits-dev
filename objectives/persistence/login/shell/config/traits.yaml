defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
traits:
- id: shell-logout
  desc: .bash_logout shell configuration file
  crit: notable
  conf: 0.85
  attack: T1546.004
  if:
    type: string_literal
    substr: .bash_logout
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: zlogin-redirect
  desc: Redirects content to .zlogin
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)(>>?|\btee\b)[^\r\n]{0,20}\.zlogin'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: zlogin-copy-command
  desc: Copies or removes a .zlogin file
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\b(cp|mv|rm)\b[^\r\n]{0,64}\.zlogin'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: zlogin-permission-command
  desc: Changes .zlogin file permissions
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\b(touch|chmod|install)\b[^\r\n]{0,64}\.zlogin'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: zlogin-edit-command
  desc: Edits a .zlogin file with sed
  crit: notable
  conf: 0.92
  attack: T1546.004
  if:
    type: text
    regex: '(?i)\bsed\b[^\r\n]{0,64}\.zlogin'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: zlogout
  desc: .zlogout shell configuration file
  crit: notable
  conf: 0.85
  attack: T1546.004
  if:
    type: string_literal
    substr: .zlogout
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hardcoded-profile
  desc: Hardcoded path to .profile file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: string_literal
    regex: /[\w./]{0,32}/\.profile
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hardcoded-bashrc
  desc: Hardcoded path to .bashrc file
  crit: notable
  conf: 0.9
  attack: T1546.004
  if:
    type: string_literal
    regex: /[\w./]{0,32}/\.bashrc
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-profile
  desc: Hex-escaped .profile path
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2F\x2E\x70\x72\x6F\x66\x69\x6C\x65
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-bashrc
  desc: Hex-escaped .bashrc path
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2F\x2E\x62\x61\x73\x68\x72\x63
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-zshrc
  desc: Hex-escaped .zshrc path
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2F\x2E\x7A\x73\x68\x72\x63
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-bash-profile
  desc: Hex-escaped .bash_profile path
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2F\x2E\x62\x61\x73\x68\x5F\x70\x72\x6F\x66\x69\x6C\x65
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hex-nohup-perl
  desc: Hex-escaped nohup perl command
  crit: suspicious
  conf: 0.98
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x6E\x6F\x68\x75\x70\x20\x70\x65\x72\x6C
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: hidden-system-pl
  desc: Hidden .system.pl payload path
  crit: suspicious
  conf: 0.97
  attack: T1546.004
  for: [perl]
  if:
    type: text
    substr: \x2E\x73\x79\x73\x74\x65\x6D\x2E\x70\x6C
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-env-file-source-line
  desc: Shell env source line
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(source|\.)\s+["'']?\$[A-Za-z_][A-Za-z0-9_]*\/env'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-profile-source-append
  desc: Appends sourced command to shell profile
  crit: notable
  conf: 0.94
  attack: T1546.004
  if:
    type: text
    regex: 'source[^\n>]{0,120}>>[^\n]{0,40}\.(bash_profile|zprofile|zshrc|profile)\b'
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: mise-shell-activate
  desc: Activates mise in the shell rc
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(mise activate|https?://mise\.(jdx\.dev|run))'
composite_rules:
- id: gha-shell-profile-remote-callback
  desc: CI action persists a remote curl callback in shell RC
  crit: hostile
  conf: 0.99
  attack: T1546.004
  all:
  - id: metadata/build/ci/step::composite-action-step-script
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
  - id: micro-behaviors/communications/http/curl::curl-command-shell-rc-path-same-line
  - id: micro-behaviors/fs/path/config/shell::bash-rc-path-text
  - id: micro-behaviors/fs/write/file/redirect::shell-rc-redirect-write
- id: zlogin
  desc: Modifies a .zlogin shell configuration file
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  any:
  - id: zlogin-redirect
  - id: zlogin-copy-command
  - id: zlogin-permission-command
  - id: zlogin-edit-command
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: metadata/package/files/system-package::zsh-function-script
- id: shell-rc-remote-bootstrap
  desc: Shell RC persists remote payload execution
  crit: hostile
  conf: 0.99
  attack: T1546.004,T1105,T1059.004
  near_lines: 0
  all:
  - id: micro-behaviors/fs/path/config/shell::shell-rc-target-text
  - id: micro-behaviors/fs/write/file/redirect::shell-rc-redirect-operation
  - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
  # The persisted line itself must fetch remote content: a PATH-prepend
  # installer that prints a curl-pipe reinstall hint elsewhere is not
  # persisting remote execution.
  - id: micro-behaviors/fs/write/file/redirect::shell-rc-redirect-remote-fetch-line
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: mise-shell-activate
  - id: well-known/lib/format/stacksjs-ts-cloud/
  - id: well-known/tool/packaging/installer-bootstrap::packaging-bootstrap-installer-context
  - id: metadata/package/testing/
  - id: micro-behaviors/process/create/shell/pipeline::illustrative-evil-host-pipe
  - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url

# The id says elf, the description says "Binary", but the file default is
# `for: [shell]`, so this could only ever fire on a SHELL SCRIPT — the one
# format where naming ~/.bashrc is unremarkable. byobu-janitor.in, whose job is
# tidying byobu's own snippet out of the user's rc files, scored shell-profile
# persistence on it. Declare the format the name and description claim: an ELF
# that embeds rc paths is a compiled implant writing shell persistence, which is
# the real signal. Script-based rc persistence stays covered by the composites
# above, which correctly require a fetch-eval or curl-pipe-exec leg too.
- id: elf-hardcoded
  desc: Binary with hardcoded shell config
  crit: suspicious
  conf: 0.95
  attack: T1546.004
  for: [binaries]
  any:
  - id: hardcoded-profile
  - id: hardcoded-bashrc
  - id: micro-behaviors/os/autorun/control::zshrc-output-write-reference
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
- id: hex-multi-file-access
  desc: Multiple hex-escaped shell rc files
  crit: suspicious
  conf: 0.98
  attack: T1546.004
  for: [perl]
  needs: 3
  any:
  - id: hex-profile
  - id: hex-bashrc
  - id: hex-zshrc
  - id: hex-bash-profile
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: perl-shell-rc-persistence
  desc: Perl shell rc persistence chain
  crit: hostile
  conf: 0.99
  attack: T1546.004
  for: [perl]
  all:
  - id: hex-nohup-perl
  - id: hidden-system-pl
  - id: hex-multi-file-access
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-profile-env-installer-setup
  desc: Installer shell env setup
  crit: notable
  conf: 0.9
  all:
  - id: shell-env-file-source-line
  any:
  - id: micro-behaviors/fs/path/config/shell::shell-bash-login-literal
  - id: micro-behaviors/os/autorun/control::shell-profile-file-operation
  - id: micro-behaviors/fs/path/config/shell::bash-profile-filename
  - id: micro-behaviors/fs/path/config/shell::bashrc-filename
  - id: micro-behaviors/os/autorun/control::zshrc-operation
  - id: micro-behaviors/os/autorun/control::shell-zprofile-command-text
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout

- id: shell-zshrc-capture-pipeline
  desc: Zsh startup file captures shell input
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/config/shell::zshrc-filename
  - id: micro-behaviors/fs/path/location::source-hidden-user-cache-entry
  - id: micro-behaviors/fs/search::grep-keyword
  - id: micro-behaviors/process/create/shell/pipeline::pipe-with-stderr-merge

- id: shell-profile-ssh-wrapper-capture
  desc: Profiled SSH wrapper captures command output
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/config/system::system-profiled-path
  - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
  - id: micro-behaviors/communications/ssh/connect::shell-ssh-function-override
  - id: micro-behaviors/fs/write/file/append::tee-hidden-home-cache-append
  - id: micro-behaviors/process/create/shell/pipeline::pipe-with-stderr-merge
