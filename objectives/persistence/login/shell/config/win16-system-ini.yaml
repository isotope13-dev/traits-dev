defaults:
  for: [ne]
  platforms: [windows]
traits:
  - id: win16-boot-section-text
    desc: References INI boot section
    crit: component
    conf: 0.8
    if:
      type: raw
      regex: '\x00boot\x00'
      case_insensitive: true
  - id: win16-shell-key-text
    desc: References INI shell key
    crit: component
    conf: 0.8
    if:
      type: raw
      regex: '\x00shell\x00'
      case_insensitive: true
composite_rules:
  - id: win16-system-ini-boot-shell-write
    desc: Win16 binary writes system.ini boot shell
    crit: suspicious
    conf: 0.95
    attack: T1546.008
    all:
      - id: micro-behaviors/fs/path/config/system::windows-system-ini-reference
      - id: micro-behaviors/fs/config/system::win16-write-private-profile
      - id: win16-boot-section-text
      - id: win16-shell-key-text
  - id: win16-dual-ini-shell-persistence
    desc: Win16 binary hijacks system.ini shell and win.ini run
    crit: hostile
    conf: 0.97
    attack: T1547.001
    all:
      - id: win16-system-ini-boot-shell-write
      - id: objectives/persistence/login/startup/winini::win16-pcode-winini-run-write
      - id: objectives/impact/infect/virus/parasitic::win16-ne-exit-windows-text
