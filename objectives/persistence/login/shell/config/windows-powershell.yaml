defaults:
  platforms: [windows, unix, netbsd]
  for: [powershell]
  attack: T1546.013
composite_rules:
  - id: powershell-profile-base64-persistence
    desc: PowerShell profile base64 persistence
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/configuration::powershell-profile-write
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
    unless:
      - id: well-known/tool/sysadmin/chocolatey::official-profile-provisioner
    any:
      - id: micro-behaviors/process/interpreter/eval/decoded::base64-powershell-eval-command
  - id: powershell-profile-dynamic-exec-persistence
    desc: PowerShell profile dynamic exec persistence
    crit: suspicious
    conf: 0.94
    ref: sha256:c0b1dd711360b1389cb8e44f2e984d971ba6d3ab8c59da42eb8b12bdc1b4189a
    all:
      - id: micro-behaviors/fs/write/configuration::powershell-profile-write
    unless:
      - id: well-known/tool/sysadmin/chocolatey::official-profile-provisioner
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
