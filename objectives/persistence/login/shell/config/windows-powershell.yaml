defaults:
  platforms: [windows, unix, netbsd]
  for: [powershell]
  attack: T1546.013
composite_rules:
- id: powershell-profile-write
  desc: PowerShell profile write persistence
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/write/file/direct::powershell-profile-write
  unless:
  - id: well-known/tool/sysadmin/kubernetes

- id: powershell-profile-base64-persistence
  desc: PowerShell profile base64 persistence
  crit: hostile
  conf: 0.98
  all:
  - id: powershell-profile-write
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  any:
  - id: objectives/execution/interpreter/eval/invoke::encoded-iex
- id: powershell-profile-dynamic-exec-persistence
  desc: PowerShell profile dynamic exec persistence
  crit: suspicious
  conf: 0.94
  ref: sha256:c0b1dd711360b1389cb8e44f2e984d971ba6d3ab8c59da42eb8b12bdc1b4189a
  all:
  - id: powershell-profile-write
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
