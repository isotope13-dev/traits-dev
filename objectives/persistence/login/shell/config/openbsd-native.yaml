defaults:
  platforms: [openbsd, bsd, unix]
  for: [cpp, elf]
  attack: T1546.004

composite_rules:
  - id: openbsd-native-login-shell-beacon
    desc: OpenBSD native login shell beacon
    crit: hostile
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/endpoints::login-endpoint-path
      - id: micro-behaviors/fs/path/config/shell::cshrc-filename
    unless:
      - id: well-known/app/replicated-kots::replicated-kots-binary
