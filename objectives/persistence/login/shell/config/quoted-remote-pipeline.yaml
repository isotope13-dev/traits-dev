defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1546.004

composite_rules:
  # Require the printed pipeline, downloader and startup destination on the
  # same physical line. A PATH append plus an unrelated install hint is not
  # remote-code persistence. AppleScript can concatenate the quoted RC path.
  - id: quoted-download-pipeline-startup-append
    desc: Appends quoted download pipeline to shell startup
    crit: suspicious
    conf: 0.95
    near_lines: 0
    all:
      - id: micro-behaviors/fs/write/file/redirect::printed-download-pipeline-append
      - id: micro-behaviors/fs/write/file/redirect::source-shell-startup-append-target
    unless:
      - id: micro-behaviors/process/create/shell/pipeline::illustrative-evil-host-pipe

  - id: password-phishing-remote-pipeline-startup
    desc: Password phish with remote shell persistence
    crit: hostile
    conf: 0.97
    platforms: [macos]
    for: [applescript, shell]
    all:
      - id: quoted-download-pipeline-startup-append
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
