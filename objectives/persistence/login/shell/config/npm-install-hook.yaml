# An npm install hook that writes itself into the user's shell startup file.
#
# `.bashrc` and `.zshrc` run on every interactive shell, so a line appended
# there outlives the install, the package, and its removal from node_modules.
# Nothing a dependency legitimately does requires editing the startup file of
# the account that installed it -- a package that needs a shell integration
# tells the user to add it, because doing so silently is the whole difference
# between a tool and an implant.
#
# Archive-scoped: the hook is declared in package.json and the append happens
# in the script it runs, so the evidence never lands in one file. The write
# atom itself binds appendFile's argument to the shell-rc path; otherwise an
# unrelated append and an unrelated shell-profile feature anywhere in a large
# bundle would be pooled into a persistence finding.
#
# Worked example: a `postinstall` that resolves `homedir()`, then appends
# "# Auto added by npm package\nturbox\n" to both `~/.bashrc` and `~/.zshrc`.
defaults:
  platforms: [unix]
  # zip covers an npm package tree shipped inside a plain zip: research-corpus
  # wrappers (registry sidecar plus a build-tree path) and droppers that bundle
  # the package alongside other stages all type as zip rather than npm.
  for: [javascript, typescript, package.json, npm, zip]
  attack: T1546.004
  mbc: F0012

composite_rules:
  - id: npm-install-hook-shell-rc-persistence
    desc: Install hook appends to shell startup file
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
    any:
      - id: micro-behaviors/fs/write/file/shell::append-shell-rc-direct
      - id: micro-behaviors/fs/write/file/shell::append-shell-rc-bound-target
    unless:
      # A shipped Electron app's build tree (devDependencies.electron) is not
      # an installable dependency: its postinstall is a build-time compile
      # step, and shell-rc mentions plus file appends elsewhere in the bundle
      # (CLI, sandbox helpers) are unrelated editor functionality coinciding
      # archive-wide. VSCodium's tree trips all three legs this way.
      - id: well-known/lib/runtime/scripted/electron::electron-development-runtime-dependency
      # brokre-mcp documents the marked ~/.brokre/bin PATH append in README;
      # the install hook is intentional launcher setup, not a hidden implant.
      - id: well-known/app/ai/coding-agent/brokre::brokre-mcp-archive-context
      # yaver-cli documents the marked npm-global bin PATH append in postinstall.
      - id: well-known/app/ai/coding-agent/yaver::yaver-cli-archive-context
      - id: well-known/app/ai/gateway/ccs::ccs-archive-context

  # `prepare` is less common than postinstall and is often treated as a
  # build-only hook, but it still executes on git/local installs. A hook that
  # silently edits .zshenv/.bashrc gives the dependency durable login-shell
  # execution, so keep this separate from the normal postinstall rule.
  - id: npm-prepare-shell-rc-persistence
    desc: Prepare hook appends to shell startup file
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
    any:
      - id: micro-behaviors/fs/write/file/shell::append-shell-rc-direct
      - id: micro-behaviors/fs/write/file/shell::append-shell-rc-bound-target
    unless:
      - id: well-known/app/ai/coding-agent/brokre::brokre-mcp-archive-context
      - id: well-known/app/ai/coding-agent/yaver::yaver-cli-archive-context
      - id: well-known/app/ai/gateway/ccs::ccs-archive-context
