defaults:
  platforms: [unix, appliance]
  for: [javascript, typescript]
  attack: T1037.004

traits:
  - id: node-bashrc-nohup-self
    desc: Node bashrc nohup self
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\.bashrc[\s\S]{0,220}nohup /usr/bin/node[\s\S]{0,120}__filename'
  - id: node-e-require-activation-hook
    desc: Node inline require activation hook
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'node\s+-e\s+"try\{require\(\\"[^"\\]{1,80}\\"\)\.[A-Za-z0-9_$.]{1,80}\('
  - id: node-rc-injected-bare-command
    desc: Bare command line in a JS string
    crit: notable
    conf: 0.9
    if:
      # Parser-extracted string constants only: the cooked template value
      # carries real newlines, so `\n# comment\nturbox\n` exposes its bare
      # command line. Comment (`# ...`), assignment (`export FOO=...`) and
      # `source ...` lines carry a leading marker, space or `=` excluded
      # by the single-token shape; the lowercase lead excludes prose
      # headings (`Usage`) since Unix commands are lowercase. The
      # comma-lead exclusion keeps minified selector lists (sweetalert2's
      # `..., summary,`) from reading as a command, and the 3-char minimum
      # drops the two-token guard words (`fi`, `do`). The remaining lone
      # guard keywords (`then`, `done`, `esac`, ...) are filtered per
      # matched literal: they are control syntax, so an installer appending
      # an `if [ -d ... ]` PATH guard to a shell rc must not read as a
      # persisted command.
      type: literal
      regex: '(^|[^,\n])\n[ \t]*[a-z][a-z0-9_.-]{2,40}\n'
      not:
        - regex: '\n[ \t]*(then|else|elif|done|esac|case|while|until|set|time|select|function|coproc)[ \t]*\n'
composite_rules:
  - id: node-shell-profile-persistence
    desc: Node shell profile persistence
    crit: hostile
    conf: 0.98
    all:
      - id: node-bashrc-nohup-self
      - id: micro-behaviors/fs/write/file/full::write-file-sync
  - id: node-shell-rc-require-persistence
    desc: Node shell rc require persistence
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/shell::node-user-shell-rc-targets
      - id: node-e-require-activation-hook
      - id: micro-behaviors/fs/write/file/append::append-file-sync
  - id: node-shell-rc-command-persistence
    desc: Node persists a command via shell rc
    crit: hostile
    conf: 0.97
    attack: T1546.004
    all:
      - id: node-rc-injected-bare-command
    any:
      - id: micro-behaviors/fs/write/file/shell::append-shell-rc-direct
      - id: micro-behaviors/fs/write/file/shell::append-shell-rc-bound-target
