defaults:
  platforms: [windows]
composite_rules:
  - id: remote-powershell-profile-script-persistence
    desc: PowerShell profile write installs a remote script evaluation pipeline
    crit: hostile
    conf: 0.98
    attack: T1546.013,T1105,T1059.001
    for: [powershell]
    all:
      - id: micro-behaviors/fs/write/configuration::powershell-profile-write
      - id: micro-behaviors/communications/http/download/cli/web-cmdlet::embedded-iwr-pipe-iex

