defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002
composite_rules:
  - id: chocolatey-profile-remote-persistence
    desc: Chocolatey hook adds a remote PowerShell profile
    crit: hostile
    conf: 0.99
    scope: archive
    for: [nupkg, powershell, pe, batch]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/fs/write/configuration::powershell-profile-write
      - id: micro-behaviors/fs/write/file/append::add-content
      - id: micro-behaviors/communications/http/client/library::useb-flag

    unless:
      - id: well-known/tool/sysadmin/chocolatey::official-profile-provisioner

