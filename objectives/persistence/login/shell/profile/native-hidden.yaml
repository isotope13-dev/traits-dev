# Dotfiles are normally skipped by profile.d/*.sh. This is an attempted
# login hook, not proof of successful reactivation. The path and chmod alone
# also occur in installers; require the independently admitted bot stager.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1546.004

traits:
  - id: profiled-interactive-shell-wrapper-exec
    desc: Shell script wraps and executes user shell
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'exec\s+/[^\n]{1,40}\.sh[^\n]{0,35}\$\{?SHELL[^\n]{0,25}-[li]'

composite_rules:
  - id: hidden-profiled-bot-launcher
    desc: Bot stager carries a hidden profile.d startup script
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/config/shell::hidden-profiled-script-path
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: objectives/execution/payload/file-exec/command/fetch::raw-ip-multi-client-download-execute

  - id: profiled-interactive-shell-hijack
    desc: ELF binary embeds profile.d script hijacking user login shell
    crit: hostile
    conf: 0.98
    attack: T1546.004,T1574
    all:
      - id: micro-behaviors/fs/path/config/shell::system-profiled-path
      - id: profiled-interactive-shell-wrapper-exec
