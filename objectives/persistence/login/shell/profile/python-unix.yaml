defaults:
  platforms: [unix, appliance]
  for: [python, pyc]
  attack: T1037

traits:
  - id: python-appends-path-to-login-profile
    desc: Python appends PATH to login profile
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'open\(rc_file,\s*["'']a["'']\)[\s\S]{0,220}\.write\(export_line\)'

  - id: python-pam-login-hook
    desc: Python PAM login hook
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: pam_exec.so expose_authtok

composite_rules:
  - id: python-login-profile-persistence
    desc: Python login profile persistence
    crit: hostile
    conf: 0.98
    all:
    - id: micro-behaviors/fs/path/config/shell::python-login-profile-targets
    any:
    - id: python-pam-login-hook
    - id: objectives/persistence/system/cron/job::python-crontab-beacon-callback
    - id: micro-behaviors/data/parse/vocabulary::python-profile-backdoor-script
  - id: python-pyc-login-persistence
    desc: Python bytecode login persistence
    crit: hostile
    conf: 0.98
    for:
    - pyc
    all:
    - id: micro-behaviors/data/parse/vocabulary::python-profile-backdoor-script
    any:
    - id: python-pam-login-hook
    - id: objectives/persistence/system/cron/job::python-pyc-self-cron-entry
