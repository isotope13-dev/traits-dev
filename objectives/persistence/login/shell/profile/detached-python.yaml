defaults:
  platforms: [unix]
  for: [go, shell]
composite_rules:
  - id: root-rc-detached-python
    desc: Embeds detached Python in root shell startup
    crit: suspicious
    attack: T1546.004
    # Separate short evidence survives decoded Go string chunk boundaries.
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/write/file/startup::quoted-background-root-rc-append
      - id: micro-behaviors/process/daemonize/detach::detached-python-launch-text
