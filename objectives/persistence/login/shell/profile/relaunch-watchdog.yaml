# `(pgrep -f X) || (setsid X &)` appended to root's shell rc: every root
# login silently revives the implant if it was killed.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1546.004
composite_rules:
  - id: root-rc-relaunch-watchdog
    desc: Root shell rc revives a detached process
    crit: suspicious
    conf: 0.92
    near_lines: 3
    all:
      - id: micro-behaviors/fs/write/file/redirect::shell-root-rc-redirect-write
      - id: micro-behaviors/process/daemonize/detach::relaunch-unless-running
