defaults:
  platforms: [unix]
  for: [shell]
  attack: T1546.004
composite_rules:
  - id: shell-rc-hidden-detached-launch
    desc: Appends hidden detached executable launch to shell startup
    crit: hostile
    conf: 0.98
    near_lines: 4
    all:
      - id: micro-behaviors/fs/write/file/startup::variable-home-shell-rc-append
      - id: micro-behaviors/process/daemonize/detach::setsid-hidden-command
      - id: micro-behaviors/process/daemonize/detach::detached-background-command
