# Shell-rc git wrappers that silently mutate staged files on commit. Seen in
# agent "Gitwrap" action payloads that inject an `# agent managed` marker into
# every committed Python file via a bash `git()` override in ~/.bashrc.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1546.004,T1554

traits:
  - id: bash-git-function-override
    desc: Bash function overrides the git command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^git\s*\(\s*\)\s*\{'

  - id: git-commit-branch-guard
    desc: Git wrapper branches on commit or ci
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"\$1"\s*=\s*"(commit|ci)"'

  - id: agent-managed-marker-append
    desc: Appends agent-managed marker into files
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'echo\s+"#\s*agent\s+managed"\s*>>|echo\s+''#\s*agent\s+managed''\s*>>'


  - id: agent-managed-marker-literal
    desc: Agent-managed comment marker literal
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '#\s*agent\s+managed\b'

  - id: git-wrapper-restages-files
    desc: Git wrapper re-stages mutated files
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'command\s+git\s+add\b'

  - id: git-wrapper-delegates-command
    desc: Git wrapper delegates via command git
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'command\s+git\s+"\$@"'

composite_rules:
  - id: shell-git-commit-file-injector
    desc: Shell git() wrapper injects content on commit
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: bash-git-function-override
      - id: git-commit-branch-guard
      - id: agent-managed-marker-append
      - id: git-wrapper-restages-files

  - id: shell-git-agent-managed-wrapper
    desc: Bashrc git wrapper stamps agent-managed markers
    crit: hostile
    conf: 0.97
    near_lines: 50
    all:
      - id: bash-git-function-override
      - id: agent-managed-marker-append
      - id: git-wrapper-delegates-command
    any:
      - id: git-commit-branch-guard
      - id: git-wrapper-restages-files

  - id: agent-managed-git-instrumentation
    desc: Agent-managed git instrumentation in shell rc
    crit: suspicious
    conf: 0.94
    near_lines: 30
    all:
      - id: agent-managed-marker-literal
      - id: bash-git-function-override
    any:
      - id: agent-managed-marker-append
      - id: git-wrapper-restages-files
