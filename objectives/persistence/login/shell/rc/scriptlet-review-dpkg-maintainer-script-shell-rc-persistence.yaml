defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: dpkg-maintainer-script-shell-rc-persistence
    desc: Debian script modifies system shell startup file
    crit: suspicious
    conf: 0.95
    attack: T1195.002, T1546.004
    all:
      - id: micro-behaviors/os/package-manager/installer-script::dpkg-maintainer-script-hook
      - id: objectives/persistence/login/shell/rc::system-shell-rc-write
