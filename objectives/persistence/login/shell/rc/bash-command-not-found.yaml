defaults:
  for: [python]
  platforms: [unix]

traits:
  - id: python-bashrc-append
    desc: Opens Bash startup file for append
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '\.open$'
      receiver:
        from:
          value: '(^|/)\.bashrc$'
      arg: {index: 0, exact: a}

  - id: python-writes-bash-missing-command-hook
    desc: Writes Bash missing command handler
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        from:
          value: '(?m)^\s*command_not_found_handle\s*\(\s*\)\s*\{'

composite_rules:
  - id: python-appends-bash-missing-command-hook
    desc: Adds a missing command handler to Bash startup
    crit: suspicious
    near_lines: 4
    all:
      - id: python-bashrc-append
      - id: python-writes-bash-missing-command-hook
