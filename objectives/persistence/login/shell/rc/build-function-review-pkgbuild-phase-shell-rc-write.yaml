defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002
composite_rules:
  - id: pkgbuild-phase-shell-rc-write
    # build()/prepare() runs as the developer, so writing into the builder's own
    # shell rc or authorized_keys backdoors the build host / CI runner itself.
    desc: PKGBUILD phase writes a shell startup file
    crit: suspicious
    conf: 0.92
    near_lines: 25
    all:
      - id: micro-behaviors/fs/write/file/redirect::shell-rc-redirect-write
    any:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-prepare-fn
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-package-fn
    unless:
      - id: metadata/package/testing/presence/path::pkgbuild-test-fixture-path
