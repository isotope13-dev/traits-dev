defaults:
  crit: suspicious
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: source-bashrc
    desc: Sources bash startup configuration file
    conf: 0.7
    if:
      type: string_literal
      regex: source\s+\.bashrc
  - id: source-shell-profile
    desc: source .bash_profile
    conf: 0.7
    if:
      type: string_literal
      regex: source\s+\.bash_profile
  - id: source-profile
    desc: source .profile
    conf: 0.7
    if:
      type: string_literal
      regex: source\s+\.profile
  - id: source-zshrc
    desc: Sources zsh startup configuration file
    conf: 0.7
    if:
      type: string_literal
      regex: source\s+\.zshrc
composite_rules:
  - id: js-source-profile
    desc: Sources shell profile files to
    conf: 0.85
    attack: T1546.004
    any:
      - id: source-bashrc
      - id: source-shell-profile
      - id: source-profile
      - id: source-zshrc
