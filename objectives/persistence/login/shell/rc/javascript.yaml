defaults:
  crit: suspicious
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: source-bashrc
    desc: Sources bash startup configuration file
    conf: 0.7
    if:
      type: string_literal
      # `source` opens the literal or follows a command separator; prose such as
      # an assertion message ("should not source .zshrc") is not a command.
      regex: '(^|[;&|]\s*)source\s+\.bashrc'
  - id: source-shell-profile
    desc: source .bash_profile
    conf: 0.7
    if:
      type: string_literal
      # `source` opens the literal or follows a command separator; prose such as
      # an assertion message ("should not source .zshrc") is not a command.
      regex: '(^|[;&|]\s*)source\s+\.bash_profile'
  - id: source-profile
    desc: source .profile
    conf: 0.7
    if:
      type: string_literal
      # `source` opens the literal or follows a command separator; prose such as
      # an assertion message ("should not source .zshrc") is not a command.
      regex: '(^|[;&|]\s*)source\s+\.profile'
  - id: source-zshrc
    desc: Sources zsh startup configuration file
    conf: 0.7
    if:
      type: string_literal
      # `source` opens the literal or follows a command separator; prose such as
      # an assertion message ("should not source .zshrc") is not a command.
      regex: '(^|[;&|]\s*)source\s+\.zshrc'
  - id: append-alias-to-home-config-command
    desc: Appends an alias to a home-relative path
    crit: notable
    conf: 0.86
    if:
      type: text
      # The path is selected by the caller; require the alias append to the
      # home-relative variable, not a bare profile path mention.
      regex: 'echo\s+"alias.{0,140}>>\s*~/\$\{preinstallFileName\}'
  - id: update-home-shell-profile-call
    desc: Calls profile updater for startup file
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'updateBashrcOrProfile\([\s\S]{0,180}\.(bashrc|zshrc)'
composite_rules:
  - id: shell-profile-sudo-output-capture
    desc: Appended sudo wrapper records command output in hidden cache
    crit: notable
    conf: 0.94
    attack: T1546.004
    all:
      - id: micro-behaviors/fs/write/file/shell::append-shell-rc-direct
      - id: micro-behaviors/process/hook/interception::javascript-sudo-function-definition
      - id: micro-behaviors/fs/write/file/append::tee-hidden-home-cache-append
  - id: js-source-profile
    desc: Sources shell profile files to
    conf: 0.85
    attack: T1546.004
    any:
      - id: source-bashrc
      - id: source-shell-profile
      - id: source-profile
      - id: source-zshrc
  - id: append-alias-to-user-shell-profile
    desc: Appends a shell alias to a user startup profile
    crit: suspicious
    conf: 0.9
    attack: T1546.004
    all:
      - id: append-alias-to-home-config-command
      - id: update-home-shell-profile-call

  # A Node package that writes a shell-startup hook (a profile name, a file
  # write and a home-relative `source` line) and launches the writer through
  # a concealed process API: the internal `spawn_sync` binding, or spawn
  # names rebuilt from fragments. Tools that install shell integration do it
  # from a CLI the user ran and with ordinary child_process calls; hiding the
  # spawn only matters when the profile edit is meant to go unnoticed.
  # Worked example: @atedone/workspace-context (require-time `.zshrc` block).
  - id: node-package-shell-startup-hook-concealed-spawn
    desc: Package installs shell-startup hook via concealed spawn
    crit: hostile
    conf: 0.95
    attack: T1546.004,T1027
    for: [npm, tar, zip, javascript]
    scope: archive
    all:
      - id: micro-behaviors/fs/write/file/shell::shell-startup-integration-write-clues
    any:
      - id: objectives/anti-static/obfuscation/imports/concealment::node-split-array-binding-spawn-sync
      - id: micro-behaviors/process/create/subprocess/configure::node-reflective-internal-spawn-descriptor
      - id: micro-behaviors/os/module/dynamic-load::js-array-join-child-process-token
