# A Ruby script appends a line that relaunches itself to an interactive
# shell startup file, so every new shell restarts it.
defaults:
  for: [ruby]
  platforms: [unix]
  attack: T1546.004

composite_rules:
  - id: ruby-shell-rc-self-relaunch-append
    desc: Appends self-relaunch to shell startup file
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/config/shell::ruby-shell-rc-path-literal
      - id: micro-behaviors/fs/path/self::ruby-self-relaunch-command-string
    any:
      - id: micro-behaviors/fs/file/io-mode::ruby-write-append-mode
      - id: micro-behaviors/fs/file/io-mode::ruby-file-open-append-text
