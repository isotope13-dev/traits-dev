defaults:
  platforms: [macos]
  for: [pkg]
composite_rules:
- id: macpkg-zshrc-remote-shell-clues
  desc: Installer adds download shell helper to zshrc
  crit: hostile
  conf: 0.99
  scope: archive
  for: [source, applescript, html, javascript, lua, markdown, perl, php, pkg, python, ruby, shell]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/fs/path/config/shell::zshrc-filename
    - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
    - id: micro-behaviors/fs/write/file/shell::shell-rc-append-redirect

