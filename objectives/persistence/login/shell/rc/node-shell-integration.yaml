defaults:
  platforms: [unix, macos, linux]
  for: [javascript, typescript, npm, tar]
  attack: T1546.004

composite_rules:
  - id: node-evasive-spawn-sync-shell-profile-persistence
    desc: Node uses concealed spawn_sync while writing a user shell startup file
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::node-split-array-binding-spawn-sync
      - id: micro-behaviors/fs/path/config/shell::shell-profile-home-path
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
