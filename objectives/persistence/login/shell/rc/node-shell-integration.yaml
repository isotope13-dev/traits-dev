defaults:
  platforms: [unix, macos, linux]
  for: [javascript, typescript, npm, tar]
  attack: T1546.004

composite_rules:
  - id: node-evasive-spawn-sync-shell-profile-persistence
    desc: Node uses evasive spawn_sync binding to inject .bashrc/.zshrc shell hook
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::node-split-array-binding-spawn-sync
      - id: micro-behaviors/os/module/dynamic-load::js-shell-profile-zshrc-bashrc-selector
