defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1547.015
traits:
  # === Legacy LoginHook persistence ===
- id: loginhook-key
  desc: Legacy macOS LoginHook preference key
  crit: component
  conf: 0.8
  attack: T1037.002
  for: [macho, c, shell, scripts, plist]
  if:
    type: text
    word: LoginHook
- id: tal-relaunch-key
  desc: 'TALAppsToRelaunchAtLogin plist key'
  crit: suspicious
  conf: 0.9
  for: [macho, c, plist, shell, scripts]
  if:
    type: text
    substr: TALAppsToRelaunchAtLogin
  downgrade:
    any:
    - id: metadata/signed/platform::apple
  unless:
    - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
- id: loginwindow-byhost-path
  desc: com.apple.loginwindow ByHost plist path
  crit: suspicious
  conf: 0.8
  for: [macho, c, shell, scripts]
  if:
    type: text
    regex: com\.apple\.loginwindow\.[A-F0-9-]{36}\.plist
- id: loginwindow-byhost-dir
  desc: com.apple.loginwindow ByHost preference path
  crit: suspicious
  conf: 0.7
  for: [macho, c, shell, scripts]
  if:
    type: text
    regex: 'Library/Preferences/ByHost[/\\]com\.apple\.loginwindow([._/\\]|$)'
  unless:
  - id: metadata/file/profile/identity::generated-attack-map-context
  - id: well-known/app/development/homebrew::source-tree
  - id: well-known/app/development/homebrew::source-tree-macos
  - id: well-known/app/ai/media/comfy-desktop::comfy-reset-mac-path
- id: cfprefsd-flush
  desc: killall cfprefsd (flush preferences cache)
  crit: suspicious
  conf: 0.85
  attack: T1647
  for: [macho, c, shell, scripts]
  if:
    type: text
    regex: killall\s+cfprefsd
  downgrade:
    any:
    - id: metadata/signed/anchor-apple
- id: tal-background-state
  desc: BackgroundState key in TAL entry
  crit: component
  conf: 0.7
  for: [macho, c, plist]
  if:
    type: text
    substr: BackgroundState

composite_rules:
- id: loginhook-persistence
  desc: Legacy macOS LoginHook persistence
  crit: suspicious
  conf: 0.92
  attack: T1037.002
  for: [macho, c, shell, scripts, plist]
  all:
  - id: loginhook-key
  - id: micro-behaviors/os/autorun/login-items::loginwindow-preference-domain
  unless:
  - id: metadata/file/profile/identity::generated-attack-map-context
- id: tal-persistence
  desc: TAL loginwindow restore-state persistence
  crit: suspicious
  conf: 0.9
  all:
  - id: tal-relaunch-key
  any:
  - id: loginwindow-byhost-path
  - id: loginwindow-byhost-dir
  - id: cfprefsd-flush
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: tal-installer-binary
  desc: Binary that installs TAL persistence (C/Mach-O installer)
  crit: suspicious
  conf: 0.92
  for: [macho, c]
  all:
  - id: tal-relaunch-key
  - id: cfprefsd-flush
  any:
  - id: loginwindow-byhost-dir
  - id: micro-behaviors/os/sysinfo/machine-id::macos-ioreg-platform-expert-query
  - id: tal-background-state
  downgrade:
    any:
    - id: metadata/signed/platform::apple
