defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1547.015
traits:
  # === Legacy LoginHook persistence ===
- id: loginhook-key
  desc: Legacy macOS LoginHook preference key
  crit: notable
  conf: 0.8
  attack: T1037.002
  for: [macho, c, shell, scripts, plist]
  if:
    type: text
    word: LoginHook
- id: loginwindow-byhost-path
  desc: com.apple.loginwindow ByHost plist path
  crit: suspicious
  conf: 0.8
  for: [macho, c, shell, scripts]
  if:
    type: text
    regex: com\.apple\.loginwindow\.[A-F0-9-]{36}\.plist
- id: loginwindow-byhost-dir
  desc: com.apple.loginwindow ByHost preference path
  crit: notable
  conf: 0.7
  for: [macho, c, shell, scripts]
  if:
    type: text
    regex: '(?m)^[ \t]*[^#\r\n]{0,80}Library/Preferences/ByHost[/\\]com\.apple\.loginwindow([._/\\]|$)'
- id: tal-background-state
  desc: BackgroundState key in TAL entry
  crit: notable
  conf: 0.7
  for: [macho, c, plist]
  if:
    type: text
    substr: BackgroundState

composite_rules:
- id: loginitems-insertion
  desc: Adds an application to the current user's macOS Login Items
  crit: notable
  conf: 0.93
  for: [macho, dylib]
  any:
  - id: micro-behaviors/os/autorun/login-items::lssharedfilelist-insert-item
  - id: micro-behaviors/os/autorun/login-items::sm-login-item-set-enabled-call
- id: loginhook-persistence
  desc: Legacy macOS LoginHook persistence
  crit: suspicious
  conf: 0.92
  attack: T1037.002
  for: [macho, c, shell, scripts, plist]
  all:
  - id: loginhook-key
  - id: micro-behaviors/os/autorun/login-items::loginwindow-preference-domain
  exempt:
    unverified-signature-suppressor: Cites code-signature bundle structure, not a signer.
  unless:
  # Profile-editor schema plists name the loginwindow payload, they do not set it.
  - id: metadata/file/format/apple-configuration-profile::profile-manifest-schema-key
  - id: metadata/signature/resource::coderesources-plist
- id: tal-persistence
  desc: TAL loginwindow restore-state persistence
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  all:
  - id: micro-behaviors/os/autorun/login-items::tal-relaunch-key-reference
  any:
  - id: loginwindow-byhost-path
  - id: loginwindow-byhost-dir
  - id: micro-behaviors/process/terminate/command::macos-cfprefsd-killall
  downgrade:
    any:
    - id: metadata/signature/verified/platform::apple
- id: tal-installer-binary
  desc: Binary that installs TAL persistence (C/Mach-O installer)
  crit: suspicious
  conf: 0.92
  for: [macho, c]
  unless:
  - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  all:
  - id: micro-behaviors/os/autorun/login-items::tal-relaunch-key-reference
  - id: micro-behaviors/process/terminate/command::macos-cfprefsd-killall
  any:
  - id: loginwindow-byhost-dir
  - id: micro-behaviors/os/sysinfo/machine-id::macos-ioreg-platform-expert-query
  - id: tal-background-state
  downgrade:
    any:
    - id: metadata/signature/verified/platform::apple
- id: applescript-login-item-persistence
  desc: AppleScript creates macOS Login Item
  crit: suspicious
  conf: 0.95
  for: [scripts, source, text]
  all:
  - id: micro-behaviors/os/application/target/system::system-events-title
  - id: micro-behaviors/os/autorun/login-items::applescript-make-login-item
