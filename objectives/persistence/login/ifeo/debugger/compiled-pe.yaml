# Compiled-image form of the IFEO Debugger hijack. A native or managed image
# stores the key path and the value name as separate strings, so the pair is
# bound by proximity rather than one pattern; the accessibility-tool targets
# the source-shape rules in this leaf require are one variant. Pointing the
# Debugger value at a process-management tool (Task Manager, Process Hacker)
# both redirects that tool to the attacker's binary on launch and blinds the
# user it was aimed at.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1546.012
  mbc: F0012
traits:
- id: debugger-value-name-token
  desc: Bare Debugger value-name token
  crit: component
  conf: 0.9
  if:
    type: text
    word: Debugger
composite_rules:
- id: ifeo-key-debugger-proximity
  desc: Debugger value name near IFEO key path
  crit: notable
  conf: 0.92
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/registry/keys/execution::ifeo-key-reference
  - id: debugger-value-name-token
- id: ifeo-process-tool-debugger-hijack
  desc: IFEO Debugger hijacks a process tool
  crit: hostile
  conf: 0.95
  all:
  - id: ifeo-key-debugger-proximity
  any:
  - id: micro-behaviors/process/info/name::taskmgr-process
  - id: micro-behaviors/process/debug/tool-markers::process-hacker-name-reference
