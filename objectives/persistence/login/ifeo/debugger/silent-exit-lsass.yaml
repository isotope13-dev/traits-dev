# Enabling FLG_MONITOR_SILENT_PROCESS_EXIT (GlobalFlag 0x200) under LSASS's
# Image File Execution Options subkey prepares LSASS for WER memory dumping.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source, reg]
  attack: T1546.012,T1003.001
  mbc: F0012

composite_rules:
  - id: ifeo-lsass-silent-exit-monitoring
    desc: Enables IFEO SilentProcessExit monitoring flag (0x200) on LSASS
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/process/write::ifeo-silent-exit-flag-write
    any:
      - id: micro-behaviors/process/info/name::lsass-executable-reference
      - id: micro-behaviors/process/info/name::lsass-target-token
    unless:
      - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
      - id: metadata/file/format/log::windows-event-csv-records
