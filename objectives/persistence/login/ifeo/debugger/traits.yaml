# Image File Execution Options debugger hijack.
#
# Setting `Debugger` under an executable's IFEO key makes Windows launch that
# program instead, with the original's command line. Pointed at an
# accessibility tool -- sethc.exe, utilman.exe, osk.exe -- it runs before
# anyone logs in: five presses of Shift at the lock screen, or Windows+U,
# and the debugger runs as SYSTEM. Over RDP it works from the login screen.
#
# This is registry work, so the language is incidental. The rules were
# written from a Go sample and scoped to Go and PE; the same three lines are
# far more often a PowerShell `New-ItemProperty` or a batch `reg add`.
defaults:
  for: [go, pe, powershell, batch, vbs, csharp, python]
  mbc: F0012
  attack: T1546.012
  platforms:
    - windows
traits:
  - id: ifeo-registry-path
    desc: IFEO registry path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: Image File Execution Options|IFEO
  - id: ifeo-full-path
    desc: Full IFEO registry key path
    crit: component
    conf: 0.95
    if:
      type: text
      regex: SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options
  - id: ifeo-debugger-value
    desc: IFEO Debugger registry value
    crit: component
    conf: 0.9
    if:
      type: text
      word: Debugger
  - id: ifeo-magnify
    desc: IFEO hijack of magnify.exe
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: IFEO.{0,50}magnify\.exe|magnify\.exe.{0,30}Debugger
  - id: ifeo-sethc
    desc: IFEO hijack of sethc.exe (sticky keys)
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: IFEO.{0,50}sethc\.exe|sethc\.exe.{0,30}Debugger
  - id: ifeo-utilman
    desc: IFEO hijack of utilman.exe
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: IFEO.{0,50}utilman\.exe|utilman\.exe.{0,30}Debugger
  - id: ifeo-osk
    desc: IFEO hijack of osk.exe (on-screen keyboard)
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: IFEO.{0,50}osk\.exe|osk\.exe.{0,30}Debugger
  - id: ifeo-narrator
    desc: IFEO hijack of narrator.exe
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: IFEO.{0,50}narrator\.exe|narrator\.exe.{0,30}Debugger
composite_rules:
  - id: ifeo-accessibility-target
    desc: IFEO accessibility tool target
    crit: suspicious
    conf: 0.9
    any:
      - id: ifeo-magnify
      - id: ifeo-sethc
      - id: ifeo-utilman
      - id: ifeo-osk
      - id: ifeo-narrator
  - id: ifeo-persistence
    desc: IFEO debugger persistence
    crit: hostile
    conf: 0.95
    all:
      - id: ifeo-full-path
      - id: ifeo-debugger-value
      - id: ifeo-accessibility-target
  - id: accessibility-backdoor
    desc: Accessibility feature backdoor
    crit: suspicious
    conf: 0.9
    all:
      - id: ifeo-registry-path
      - id: ifeo-accessibility-target
