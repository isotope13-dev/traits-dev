# Rewrites the Winlogon Userinit value so that logon also starts a script
# through wscript/cscript. Userinit holds userinit.exe; appending a script
# host command runs the script in every user session before the desktop.
defaults:
  platforms: [windows]
  for: [vbs, html, javascript]
  attack: T1547.004

traits:
  - id: wsh-userinit-script-host-append
    desc: Adds a script host to Winlogon Userinit
    crit: hostile
    conf: 0.95
    if:
      type: text
      regex: '(?is)RegWrite\s*\(?\s*"HK[^"]{0,70}\\Winlogon\\Userinit"\s*,.{0,160}\b[wc]script(\.exe)?\b'
