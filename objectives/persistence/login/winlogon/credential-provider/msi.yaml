defaults:
  for: [msi, oledoc]
  platforms: [windows]
  attack: T1547.004
  mbc: F0012

traits:
  - id: msi-credential-provider-registry
    desc: MSI credential provider registry
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Software\Microsoft\Windows\CurrentVersion\Authentication\Credential Providers\
  - id: msi-credential-provider-inproc
    desc: MSI credential provider DLL
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: InprocServer32.{0,80}CredentialProvider.{0,24}\.dll
  - id: msi-lsa-authentication-package
    desc: MSI LSA authentication package
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: SYSTEM\CurrentControlSet\Control\LsaAuthentication Packages

composite_rules:
  - id: msi-credential-provider-persistence
    desc: MSI installs credential provider
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: msi-credential-provider-registry
      - id: msi-credential-provider-inproc
  - id: msi-logon-provider-auth-package
    desc: MSI installs logon auth package
    crit: suspicious
    conf: 0.99
    all:
      - id: msi-credential-provider-persistence
      - id: msi-lsa-authentication-package

  - id: screenconnect-malware-relay-auth-package-persistence
    desc: ScreenConnect auth package targets reported malware relay
    crit: hostile
    conf: 0.99
    attack: T1547.004,T1219,T1071.001
    scope: outer
    all:
      - id: msi-logon-provider-auth-package
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      - id: objectives/command-and-control/infrastructure/domain/known::adminrolling-live-screenconnect-relay
