defaults:
  mbc: F0012
  attack: T1547.004
  platforms:
    - windows
  for:
    - go
    - pe
    - dll
traits:
  # Path-only evidence lives in micro-behaviors/os/registry/keys::winlogon-registry-path.
  # Persistence intent requires Userinit/Shell (and usually registry writes) in the
  # composites below — do not re-assert the bare path as an objectives atom.
  - id: encoded-userinit-value
    desc: Encoded Userinit executable value
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 8vAC8fb99vO9AucCnw==
  - id: encoded-winlogon-path
    desc: Encoded Winlogon registry path
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 0Nzl09Te0eLL2vYA8fzw/AXzy9T2/QP89PC/3dPL4PLx8QL989UC8fD2/P3L1Pb9+/wE/P2f
composite_rules:
  - id: winlogon-notify-persistence
    for: [pe]
    desc: Writes the Winlogon Notify persistence subkey
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/registry/keys::winlogon-notify-subkey
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-microsoft-signed-component
      # Process Explorer enumerates and can remove Winlogon autoruns; its
      # registry-write imports do not mean it installs a Notify package.
      - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
      # SIW inventories every autorun location, Winlogon Notify included, and
      # carries generic registry-write imports for its own settings. The other
      # Winlogon rules in this file already carve it out.
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/system/reactos::system-component
  - id: encoded-winlogon-userinit-persistence
    for: [pe]
    desc: Encoded Winlogon Userinit persistence
    crit: hostile
    conf: 0.98
    all:
      - id: encoded-winlogon-path
      - id: encoded-userinit-value
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    any:
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::base64-arithmetic-xor-decoder
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
