defaults:
  mbc: F0012
  attack: T1547.004
  platforms:
    - windows
  for:
    - go
    - pe
    - dll
traits:
  # Path-only evidence lives in micro-behaviors/os/registry/keys::winlogon-registry-path.
  # Persistence intent requires Userinit/Shell (and usually registry writes) in the
  # composites below — do not re-assert the bare path as an objectives atom.
  - id: userinit-value
    desc: Winlogon Userinit value reference
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: \bUser[Ii]nit\b|\\userinit\.exe,
    downgrade:
    unless:
      - id: well-known/tool/sysadmin/sysinternals/
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/security/itop-vpn::benign-context
  - id: encoded-userinit-value
    desc: Encoded Userinit executable value
    crit: component
    conf: 0.98
    if:
      type: text
      exact: 8vAC8fb99vO9AucCnw==
  - id: encoded-winlogon-path
    desc: Encoded Winlogon registry path
    crit: component
    conf: 0.98
    if:
      type: text
      exact: 0Nzl09Te0eLL2vYA8fzw/AXzy9T2/QP89PC/3dPL4PLx8QL989UC8fD2/P3L1Pb9+/wE/P2f
  - id: shell-value
    desc: Winlogon Shell value reference
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: Winlogon.{0,50}Shell
    downgrade:
    unless:
      - id: well-known/tool/sysadmin/sysinternals/
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/app/utility/siw::siw-family-identity
  - id: notify-value
    desc: Winlogon Notify subkey
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: Winlogon.{0,30}Notify
    unless:
      - id: well-known/app/productivity/comfort-software::comfort-clipboard-family
      - id: well-known/lib/platform/microsoft-catsrv::microsoft-catsrvut-library-context
      - id: well-known/lib/platform/microsoft-comsvcs::microsoft-comsvcs-library-context
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
        - id: metadata/binary/vendor::microsoft-corp-marker-rdata
        - id: metadata/signed/platform/
composite_rules:
  - id: winlogon-access
    desc: Winlogon registry access
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/registry/keys::winlogon-registry-path
    any:
      - id: userinit-value
      - id: shell-value
    downgrade:
      any:
        - id: micro-behaviors/os/registry/access::reg-notify-change-key-value
        - id: micro-behaviors/os/registry/access/
        - id: metadata/binary/metrics/structural::many-imports
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
  - id: winlogon-userinit-persistence
    desc: Winlogon Userinit persistence
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/keys::winlogon-registry-path
      - id: userinit-value
    any:
      - id: objectives/persistence/login/startup/registry::reg-set-value-ex-source
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
      - id: micro-behaviors/os/registry/manipulate::go-registry-set-string-value-call
      - id: objectives/persistence/login/registry/run-key::masquerade-name
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/security/itop-vpn::benign-context
  - id: encoded-winlogon-userinit-persistence
    desc: Encoded Winlogon Userinit persistence
    crit: hostile
    conf: 0.98
    all:
      - id: encoded-winlogon-path
      - id: encoded-userinit-value
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    any:
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::base64-arithmetic-xor-decoder
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-a
