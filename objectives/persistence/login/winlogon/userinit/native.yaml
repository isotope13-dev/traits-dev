# A native PE that writes under the Winlogon key and can force the reboot that
# makes the write take effect.
#
# `HKLM\...\Winlogon`'s `Userinit`, `Shell` and `Notify` values name what runs
# when a user logs in, before anything the user chose. Creating a key there is
# not something an application does after installation; the ones that
# legitimately do it are installers, and they are signed.
#
# The restart leg is what distinguishes a persistence write from a
# configuration read. Winlogon entries apply at the next logon, so a program
# that writes one and also carries `ExitWindowsEx` has arranged for that logon
# to happen now — the sequence an implant uses to take effect before the
# session it compromised ends.
#
# The go.yaml and rust.yaml siblings match the value *names* in source and Go
# binaries. This one works from the imported API surface, which is all a
# packed, stripped native image leaves behind.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.004
  mbc: E1547.004

composite_rules:
  - id: native-winlogon-key-write-with-restart
    desc: Writes a Winlogon key and can force a restart
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/registry/keys::winlogon-registry-path
      - id: micro-behaviors/os/registry/access::registry-create-key-api
      - id: micro-behaviors/ui/window/manage/control::exit-windows-ex
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/sysinternals/
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      # Startup managers are the other program class that carries all three
      # legs: they show the user what Winlogon runs at logon, offer to change
      # it, and reboot to apply. IObit's Driver Booster is one -- its 8 MB
      # main image holds the Winlogon key path and the Userinit/Shell value
      # names for its startup list, RegCreateKeyExW for its own settings, and
      # ExitWindowsEx for the post-driver-install restart, with no evidence
      # tying the three together. Keyed on the code-signing certificate.
      - id: well-known/app/system/iobit::iobit-signer
      # SIW is the same class of program: its startup/autologon report lists
      # the whole Winlogon value set (`System`, `Shell`, `Notify`, `Userinit`,
      # `Taskman`) for the operator, it creates keys for its own settings, and
      # its Tools menu can restart the machine. Three unrelated features, no
      # evidence linking them.
      - id: well-known/app/utility/siw::siw-family-identity
