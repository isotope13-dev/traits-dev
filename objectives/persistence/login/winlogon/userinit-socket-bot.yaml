defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: socket-command-bot-userinit-persistence
    desc: Socket command bot installs comma-joined Userinit paths
    crit: hostile
    conf: 0.99
    attack: T1547.004
    all:
      - id: micro-behaviors/os/registry/manipulate::native-userinit-comma-joined-write
      - id: objectives/command-and-control/remote-command/dispatch/command::framed-socket-tasking-download-exec
