defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1564.002,T1547.004

traits:
  - id: specialaccounts-zero-value
    desc: SpecialAccounts UserList value set to zero
    crit: notable
    conf: 0.95
    if:
      type: text
      # REG_DWORD zero is commonly emitted as 0, 00, or a hexadecimal zero.
      # Bind the value to UserList and its /d data argument.
      regex: '(?i)SpecialAccounts[\\/]+UserList[^\r\n]{0,240}/d[ \t]+["'']?(0+|0x0+)["'']?([ \t]|$)'

composite_rules:
  - id: winlogon-specialaccounts-hidden-user
    desc: SpecialAccounts hides user from logon screen
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/policy/reference::winlogon-special-accounts-user-list
      - id: objectives/persistence/login/winlogon::specialaccounts-zero-value
    any:
      - id: micro-behaviors/os/registry/value/write::reg-exe-add-command
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/process/argument/interpreter::shell-command-spawn-cmd
