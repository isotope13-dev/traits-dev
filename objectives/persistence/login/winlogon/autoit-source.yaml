defaults:
  platforms:
  - windows
  for:
  - text
  attack: T1547.004
traits:
- id: autoit-append-winlogon-shell
  desc: AutoIt appends Winlogon Shell command
  crit: suspicious
  conf: 0.98
  if:
    type: text
    case_insensitive: true
    regex: \bRegWrite\b.{0,160}\\Winlogon".{0,8}"Shell".{0,20}"Explorer\.exe (" *&|\w)
composite_rules:
- id: autoit-propagating-winlogon-shell
  desc: Self-propagating AutoIt appends Winlogon login payload
  crit: hostile
  conf: 0.99
  all:
  - id: autoit-append-winlogon-shell
  - id: objectives/lateral-movement/usb-worm/drive-infector::autoit-removable-drive-spreader
