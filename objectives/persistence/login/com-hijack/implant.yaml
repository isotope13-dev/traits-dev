# The payload side of a per-user COM hijack: a DLL that exports the COM
# server pair so it can be registered under HKCU\Software\Classes\CLSID\...\
# InprocServer32, but whose class factory serves no class, and which keeps
# every API, path and registry name encrypted until runtime. Any process
# that instantiates the hijacked CLSID loads it and runs its DllMain.
defaults:
  platforms: [windows]
  for: [dll]
  attack: T1546.015,T1027.013

composite_rules:
  - id: fake-com-server-encrypted-strings
    desc: Fake COM server DLL hides its strings
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/symbols/exports::com-export-pair
      - id: micro-behaviors/os/com/class-factory::dllgetclassobject-always-unavailable-x64
      - id: micro-behaviors/data/embedded/payload/encrypted::length-prefixed-base64-string-table
