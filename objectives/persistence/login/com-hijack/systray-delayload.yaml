# A non-Microsoft module that re-registers the Windows system-tray CLSID to
# itself and also adds the ShellServiceObjectDelayLoad autostart entry is
# loaded by explorer.exe at every logon. A genuine stobject.dll is verified
# Microsoft and does not write this pair from a third-party module.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1546.015

composite_rules:
  - id: systray-clsid-delayload-hijack
    desc: ATL script hijacks system-tray CLSID and autostart DelayLoad
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/registry/autostart/reference::shellservice-delayload-atl-script
      - id: micro-behaviors/os/registry/autostart/reference::systray-stobject-clsid-literal
      - id: micro-behaviors/os/registry/com/reference::inprocserver32-word
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: well-known/app/system/reactos::system-component
