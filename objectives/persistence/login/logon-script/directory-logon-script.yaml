# Logon-script backdoor via the directory. The attacker drops a payload into
# the domain-writable SYSVOL/NETLOGON scripts share and points a user object's
# scriptPath attribute at it, so the script runs as that user at next logon
# (persistence and lateral movement, T1037.003). Each leg alone is ordinary
# administration; their co-occurrence in one artifact is the abuse. Both the
# share path and the scriptPath write generalize across bloodyAD, PowerShell
# AD cmdlets, raw ldapmodify/LDIF, and any drop destination or payload name.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1037.003

composite_rules:
  - id: sysvol-logon-script-backdoor
    desc: Sets scriptPath to a SYSVOL logon script
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/security/directory-service::scriptpath-attribute-write
    any:
      - id: micro-behaviors/network/share::sysvol-scripts-share-path
      - id: micro-behaviors/network/share::netlogon-share-path
    near_lines: 40
