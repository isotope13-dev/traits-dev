defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [pe, powershell, batch, vbs, javascript]
traits:
  - id: autolauncher-tracking
    desc: "Contains autolauncher tracking file string"
    if:
      type: text
      substr: "autolauncher_tracking.txt"
  - id: system-autolauncher
    desc: "Contains SystemAutoLauncher persistence string"
    if:
      type: text
      substr: "SystemAutoLauncher"
  - id: autolauncher-log
    desc: "Contains autolauncher log file string"
    if:
      type: text
      substr: "autolauncher_log.txt"
  - id: hidden-autolauncher
    desc: "Contains HiddenAutoLauncher evasion string"
    if:
      type: text
      substr: "HiddenAutoLauncher"
