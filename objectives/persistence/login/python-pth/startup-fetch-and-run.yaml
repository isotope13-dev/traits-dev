# A .pth line runs in every interpreter on the host, before any user code.
# When that line downloads something and imports subprocess, every Python
# start becomes a download-and-execute trigger. Payloads hide the body in an
# exec() string and rebuild the URL from fragments, so these legs read the
# text of the hook rather than its parsed calls. Legitimate startup hooks
# (virtualenv, editable installs, coverage, pywin32, distutils-precedence)
# import a module by name; none fetches over the network or spawns processes.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1546,T1105,T1059.006
  mbc: E1546

composite_rules:
  - id: pth-startup-download-and-run
    desc: .pth startup hook downloads and runs program
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: metadata/import/python/subprocess
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/communications/http/lib/urllib::urllib-import-alias-urlopen
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-alias-urlopen
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
