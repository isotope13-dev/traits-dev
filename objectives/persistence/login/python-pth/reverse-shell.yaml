defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1546,T1059.006

composite_rules:
  - id: pth-startup-reverse-shell
    desc: Python .pth startup executes reverse shell
    crit: hostile
    conf: 0.99
    # .pth files execute one import-prefixed line at a time. A shell command
    # on a separate line is ignored by site.py, even if it is valid Python.
    near_lines: 0
    all:
      - id: objectives/persistence/login/python-startup::pth-import-exec
      - id: objectives/command-and-control/reverse-shell/
