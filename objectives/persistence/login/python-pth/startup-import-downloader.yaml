# A .pth line runs on every interpreter start. Here the imported package
# module calls a downloader at module scope and writes the responses to
# local files, so each Python launch re-fetches remote artifacts without any
# user action. Package code that only needs data downloads it on demand.
defaults:
  platforms: [unix, windows]
  attack: T1546.018,T1105

composite_rules:
  - id: pth-startup-import-module-scope-download-write
    desc: .pth startup import runs module-scope download to file
    for: [python, whl, python-sdist, egg, zip]
    crit: hostile
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/data/control-flow/module-exec::python-import-calls-named-downloader
      - id: micro-behaviors/fs/file/open/write::python-method-open-write-binary
