defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - shell
  - text
  attack: T1546,T1195.002
  mbc: E1546
composite_rules:
- id: shipped-pth-executes-encoded-payload
  for:
  - python
  desc: Shipped .pth runs an encoded payload
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/process/interpreter/python::pth-path-config-file
  - id: micro-behaviors/data/decode/base64::b64decode-call
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/process/create/subprocess::import-subprocess
  unless:
  - id: metadata/package/testing/
  - id: well-known/app/data/datatailr::install-notice-context

  - id: "metadata/file/naming::test-directory-component"
