defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - shell
  - text
  attack: T1546,T1195.002
  mbc: E1546
traits:
- id: pth-distribution-file
  desc: File is a Python path configuration
  crit: notable
  conf: 0.95
  if:
    type: path
    basename: true
    regex: (?i)\.pth$
composite_rules:
- id: shipped-pth-executes-encoded-payload
  for:
  - python
  desc: Shipped .pth runs an encoded payload
  crit: hostile
  conf: 0.97
  all:
  - id: pth-distribution-file
  - id: micro-behaviors/data/decode/base64::b64decode-call
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/process/create/subprocess::import-subprocess
  unless:
  - id: metadata/package/testing/
