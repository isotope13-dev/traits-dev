defaults:
  platforms: [unix, windows]
composite_rules:
  - id: import-downloader-and-cloud-bucket
    desc: Import-time downloader and cloud bucket references
    for: [python]
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/data/control-flow/module-exec::python-import-calls-named-downloader
      - id: well-known/app/storage/alibaba-oss::oss-bucket-host-cn-ap
      - id: micro-behaviors/fs/path/location::python-cache-path-home
  - id: pth-and-import-downloader-cloud-bucket
    desc: Startup hook and downloader in archive
    for: [python, whl, python-sdist, egg, zip]
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: import-downloader-and-cloud-bucket
