defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - shell
traits:
- id: pth-file-write
  desc: Writing to a Python .pth file (persistence)
  crit: suspicious
  conf: 0.9
  mbc: E1546
  attack: T1546
  if:
    type: string_literal
    regex: /site-packages/[\w\.-]+\.pth|system\.pth
    not:
    - regex: 'distutils-precedence\.pth'
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
composite_rules:
- id: encoded-pth-startup-loader
  for:
  - python
  desc: Encoded Python pth startup loader
  crit: hostile
  conf: 0.98
  mbc: B0024
  all:
  - id: pth-file-write
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
