defaults:
  for: [go]
  platforms: [windows]
  attack: T1547.001
  mbc: F0012
traits:
  - id: startup-copy-plant-routine
    desc: Go routine plants randomized startup copies
    crit: component
    conf: 0.98
    for: [pe]
    if:
      type: hex
      pattern: 6D 61 69 6E 2E 70 6C 61 6E 74 5F 73 74 61 72 74 5F 75 70
      section: rdata

composite_rules:
  - id: randomized-registry-persistence-go
    desc: Randomized registry persistence in Go
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/encode/hex::go-hex-encode-string
      - id: micro-behaviors/os/registry/manipulate::go-registry-set-string-value-call
      - id: micro-behaviors/os/registry/access::go-registry-create-key
      - id: micro-behaviors/os/registry/keys::go-currentversion-run

  - id: randomized-self-copy-run-key-persistence
    desc: Go program plants mutated copies and registers them for logon
    crit: hostile
    conf: 0.995
    for: [pe]
    all:
      - id: startup-copy-plant-routine
      - id: objectives/impact/infect/binary/rewrite::go-self-image-mutation-routine
      - id: micro-behaviors/os/registry/keys::currentversion-run
