defaults:
  for: [go]
  platforms: [windows]
  attack: T1547.001
  mbc: F0012
composite_rules:
  - id: randomized-registry-persistence-go
    desc: Randomized registry persistence in Go
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/encode/hex::go-hex-encode-string
      - id: micro-behaviors/os/registry/manipulate::go-registry-set-string-value-call
      - id: micro-behaviors/os/registry/access::go-registry-create-key
      - id: "micro-behaviors/os/registry/keys/autostart::windows-run-key-path"

  - id: randomized-self-copy-run-key-persistence
    desc: Go program plants mutated copies and registers them for logon
    crit: hostile
    conf: 0.995
    for: [pe]
    all:
      - id: metadata/binary/symbols/name/qualified::startup-copy-plant-routine
      - id: metadata/binary/symbols/name/qualified::go-self-image-mutation-routine
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
