defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: active-setup-7zip-embedded-pe-profile
  desc: Active Setup and 7-Zip keys with embedded PE references
  crit: suspicious
  conf: 0.994
  all:
  - id: micro-behaviors/os/registry/autostart/reference::active-setup-ie-clsid
  - id: well-known/tool/sysadmin/7zip/installer::7zip-shell-extension-clsid
  - id: metadata/binary/layout/embedded::pe-embedded
  any:
  - id: metadata/binary/layout/ratio::overlay-dominates-third
  - id: well-known/tool/sysadmin/7zip/utility::sevenzip-product-label-reference
  - id: metadata/build/manifest::require-administrator
  - id: metadata/signature/verified/platform::microsoft
  needs: 2
