defaults:
  platforms: [windows]
  for: [data]

traits:
  - id: x86-stubpath-expand-string-write-raw
    desc: x86 REG_EXPAND_SZ registry write sequence
    crit: component
    conf: 0.95
    if:
      type: hex
      pattern: '6A 02 6A 00 68 [4] (50|51|52|53|55|56|57) FF 15 ?? ?? ?? ??'

  - id: x86-clear-tag-two-call-sequence-raw
    desc: x86 buffer clear and dual indirect call
    crit: component
    conf: 0.96
    if:
      type: hex
      pattern: 'B9 08 00 00 00 8B FA F3 AB 8D 8C 24 ?? ?? ?? ?? C6 02 ?? 51 FF 15 ?? ?? ?? ?? 83 C4 ?? 8B F0 BF 01 00 00 00 56 57 55 53 FF 15 ?? ?? ?? ??'

  - id: unparsed-pe-stubpath-value
    desc: StubPath registry value in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      word: stubpath

  - id: unparsed-pe-reg-create-key-a
    desc: RegCreateKeyA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: RegCreateKeyA

  - id: unparsed-pe-get-module-filename-a
    desc: GetModuleFileNameA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: GetModuleFileNameA

  - id: unparsed-pe-create-process-a
    desc: CreateProcessA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: CreateProcessA

composite_rules:
  - id: unparsed-pe-active-setup-write-profile
    desc: Unparsed PE Active Setup StubPath write profile
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/header/malformed::overlapping-dos-pe-header
      - id: micro-behaviors/os/registry/autostart/reference::active-setup-key
      - id: x86-stubpath-expand-string-write-raw
      - id: unparsed-pe-stubpath-value
      - id: unparsed-pe-reg-create-key-a

  - id: unparsed-pe-active-setup-self-copy
    desc: Unparsed PE self-copy and launch sequence
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/header/malformed::overlapping-dos-pe-header
      - id: x86-clear-tag-two-call-sequence-raw
      - id: unparsed-pe-get-module-filename-a
      - id: unparsed-pe-create-process-a

  - id: unparsed-pe-active-setup-dll-injector
    desc: Unparsed PE Active Setup self-copy and DLL injector
    crit: hostile
    conf: 0.97
    attack: T1547.014
    all:
      - id: unparsed-pe-active-setup-write-profile
      - id: unparsed-pe-active-setup-self-copy
      - id: micro-behaviors/process/inject/dll::x86-resolved-export-thread-handoff-raw
