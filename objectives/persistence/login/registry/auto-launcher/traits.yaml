defaults:
  platforms:
    - linux
    - macos
    - windows
    - unix
    - android
    - ios
  for: [scripts, binaries]
composite_rules:
  - id: malicious-auto-launcher-indicators
    crit: suspicious
    desc: Indicators of malicious auto-launcher
    any:
      - id: objectives/persistence/login/keywords/autolauncher/
  - id: hidden-auto-launcher
    for: [elf, macho, pe, class, pyc, beam, wasm, shell, batch, python, javascript, ruby, php, lua, perl, powershell, applescript, vbs, staticlib]
    crit: hostile
    desc: Malicious auto-launcher with double-extension evasion
    all:
      - id: objectives/persistence/login/registry/auto-launcher::malicious-auto-launcher-indicators
      - id: objectives/evasion/masquerade/keywords/spoof::double-extension-svchost
