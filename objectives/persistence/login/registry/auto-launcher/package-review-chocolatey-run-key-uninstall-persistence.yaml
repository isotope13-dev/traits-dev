defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002
composite_rules:
  - id: chocolatey-run-key-uninstall-persistence
    desc: Chocolatey hook creates Run-key persistence
    crit: hostile
    conf: 0.99
    scope: archive
    for: [source, '!objectivec', batch, beam, class, javascript, lua, nupkg, ole, pe, perl, php, powershell, pyc, python, ruby, static-lib, vbs, wasm]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/registry/value/write::reg-exe-add-command
      - id: micro-behaviors/process/argument/file::powershell-script-file-option-string

