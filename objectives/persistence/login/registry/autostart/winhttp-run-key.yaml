defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001,T1105
  mbc: F0012

composite_rules:
  - id: unsigned-winhttp-run-key-hidden-downloader
    desc: Unsigned PE references WinHTTP and Run-key writes and launches windowless
    crit: notable
    conf: 0.96
    attack: none
    mbc: none
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: micro-behaviors/os/registry/autostart/write::run-path-write-api-references
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/process/config/window::x64-createprocess-no-window
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/communications/url/resource-path/archive::executable-remote-archive-url
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass
    unless:
      - id: metadata/installer/product/
