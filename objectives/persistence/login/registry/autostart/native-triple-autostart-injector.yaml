# Autostart surfaces coexist with remote-thread injection APIs. These may be
# configuration alternatives; the matcher does not prove three registrations.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001,T1547.014,T1055
composite_rules:
  - id: native-active-setup-policies-run-autostart-injector
    desc: Active Setup, Policies Run and Run keys plus injection
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/registry/write::active-setup-write-api-cluster
      - id: micro-behaviors/os/registry/keys/autostart::policies-explorer-run-key-path
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/process/inject/remote-thread::remote-allocation-write-thread-api-references
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
