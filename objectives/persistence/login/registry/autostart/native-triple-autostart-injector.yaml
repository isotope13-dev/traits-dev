# One native program that registers itself in Active Setup, the Policies
# Explorer Run key and the plain Run key, while carrying the APIs to allocate
# and write memory in another process and start a thread there. Three
# independent autostart hooks are redundancy for survival; the remote-thread
# set is the delivery. Installers use one hook, not three plus injection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001,T1547.014,T1055
composite_rules:
  - id: native-active-setup-policies-run-autostart-injector
    desc: Active Setup, Policies Run and Run keys plus injection
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/registry/write::active-setup-write-api-cluster
      - id: micro-behaviors/os/registry/keys/autostart::policies-explorer-run-key-path
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/process/inject/runtime/call::remote-allocation-write-thread-api-references
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
