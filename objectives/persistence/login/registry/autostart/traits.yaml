defaults:
  for: [python, javascript, vbs, powershell, pe, c, cpp]
  crit: notable
  conf: 0.7
  platforms:
    - windows
traits:
  - id: winlogon-shell-key
    desc: Registry Winlogon Shell key
    if:
      type: text
      regex: (?i)\\Winlogon\\Shell\b
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
  - id: userinit-key
    desc: Registry Userinit key
    if:
      type: text
      regex: (?i)\\Winlogon\\Userinit\b
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/app/utility/siw::siw-family-identity
  - id: powershell-appdata-exe-target
    desc: PowerShell builds an AppData executable path
    crit: notable
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$TargetPath\s*=\s*Join-Path\s+\$env:APPDATA.{1,160}\.exe'
  - id: quoted-exe-double-dash-arg
    desc: Quoted executable with double-dash arg
    crit: notable
    conf: 0.88
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)\.exe"\s+--[A-Z0-9]{2,12}'
  - id: short-camel-on-run-value-token
    desc: Short CamelCase token adjacent to Run key
    crit: notable
    conf: 0.78
    for: [pe, dll]
    if:
      type: text
      # Case-sensitive on purpose: under (?i) the CamelCase token degraded to
      # any word ending in "on" -- `CurrentVersion` itself, `Option`,
      # `Version` -- so every PE naming the Run key matched.
      regex: '(\\(Run|RUN|run)|CurrentVersion).{0,96}\b[A-Z][A-Za-z0-9]{2,8}On\b'
    unless:
      - id: well-known/app/browser/internet-explorer::internet-explorer-executable
      - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
  - id: batch-reg-add-run
    desc: Batch reg add Run
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      substr: '%rgs%g add'
  - id: batch-run-key-var-assignment
    desc: Batch assigns Run key variable
    crit: suspicious
    conf: 0.96
    attack: T1547.001
    for: [batch]
    if:
      type: text
      regex: '(?i)set\s+[A-Za-z0-9_]{3,}\s*=\s*HK[CLU]M\\.{0,50}\\CurrentVersion\\Run'
  - id: batch-reg-add-var-run-key
    desc: Batch reg.exe adds variable-backed key
    crit: component
    conf: 0.9
    attack: T1547.001
    for: [batch]
    if:
      type: text
      regex: '(?i)\breg\s+add\s+"?%[A-Za-z0-9_]{3,}%"?'
  - id: batch-reg-data-self-path
    desc: Batch stores self path in registry
    crit: notable
    conf: 0.94
    attack: T1547.001
    for: [batch]
    if:
      type: text
      # `\"` pairs are allowed inside the /d value: quoting a self path with
      # spaces for a Run key is written `/d "\"%~f0\""`, and the escaped
      # quote must not end the match window.
      regex: '(?i)\breg(\.exe)?\s+add\b.{0,160}\s/d\s+["'']?(\\.|[^"\n]){0,80}%(~[a-z]*)?0\b'
  - id: batch-run-key-fragment
    desc: Batch Run key fragment
    crit: component
    conf: 0.9
    for: [batch]
    if:
      type: text
      substr: '\R%u%n'
  - id: batch-public-windowssec-path
    desc: Batch Public WindowsSec path
    crit: notable
    conf: 0.92
    for: [batch]
    if:
      type: text
      substr: WindowsSec
  - id: batch-ntoskrnl-masquerade
    desc: Batch ntoskrnl masquerade
    crit: notable
    conf: 0.92
    for: [batch]
    if:
      type: text
      substr: 'ntoskrnl%eA%'
  - id: batch-encoded-run-write
    desc: Encoded PowerShell Run-key write
    crit: suspicious
    conf: 0.97
    for: [batch]
    if:
      type: encoded
      encoding: base64
      substr: Set-ItemProperty
  - id: batch-encoded-user-profile-drop
    desc: Encoded per-user persistence directory
    crit: notable
    conf: 0.94
    for: [batch]
    if:
      type: encoded
      encoding: base64
      substr: LocalApplicationData
  - id: batch-encoded-self-copy
    desc: Encoded self-copy into persistence directory
    crit: suspicious
    conf: 0.95
    for: [batch]
    if:
      type: encoded
      encoding: base64
      substr: Copy-Item
  - id: batch-encoded-hidden-vbs-launcher
    desc: Encoded hidden WScript persistence launcher
    crit: suspicious
    conf: 0.96
    for: [batch]
    if:
      type: encoded
      encoding: base64
      substr: 'CreateObject("WScript.Shell")'
  - id: run-key-persistence-status
    desc: Native Run-key persistence status message
    crit: notable
    conf: 0.92
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)\bpersisted\s+via\s+run\s+key\s*\('
composite_rules:
  - id: unsigned-native-run-key-persistence-status
    desc: Unsigned PE reports Run-key persistence
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1112
    for: [pe, dll]
    all:
      - id: run-key-persistence-status
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: metadata/binary/symbols/name/process::c-system-import
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
  - id: embedded-run-key-execution-impact-carrier
    for: [pe]
    desc: Run-key PE carrier with embedded payload and impact/injection APIs
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1027.009
    all:
      - id: objectives/persistence/login/registry/autostart::run-key-persistence-api-block
      - id: metadata/binary/layout/ratio::many-pe-embedded
    any:
      - id: micro-behaviors/os/syscall/invoke::ntdll-hard-error-api-profile
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
    needs: 1
    unless:
      - id: metadata/installer/product/

  - id: malformed-embedded-pe-run-key-persistence
    for: [pe]
    desc: Malformed PE carrier with Run and RunOnce persistence
    crit: hostile
    conf: 0.99
    attack: T1547.001
    all:
      - id: objectives/persistence/login/registry/autostart::run-key-persistence-api-block
      - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
    unless:
      - id: metadata/installer/product/

  # The Run key path, the New-ItemProperty call and the written value are three
  # separate reads: a script may name the Run key in a string it never writes
  # to, or write a preference through a path variable that holds some other
  # key. Requiring the written value to be an executable path is what makes
  # this an autostart entry rather than either half on its own.
  - id: powershell-run-path-variable-write
    desc: PowerShell writes an executable into a variable-backed Run key
    crit: suspicious
    conf: 0.96
    for: [powershell]
    near_lines: 20
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/data/property/write::powershell-new-itemproperty-variable-path
      - id: micro-behaviors/os/registry/value/write::registry-powershell-executable
    unless:
      - id: metadata/build/ci/github-actions::workflow-definition-path
  - id: common-persistence-keys
    desc: References one or more Windows autostart registry paths
    crit: component
    any:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"
      - id: "micro-behaviors/os/registry/autostart/reference::runservices-key-path"
      - id: winlogon-shell-key
      - id: userinit-key
    unless:
      - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
  - id: quoted-programdata-exe-run-command
    desc: Quoted ProgramData executable Run command
    crit: component
    conf: 0.9
    for: [pe, dll]
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/path/application/state::quoted-programdata-prefix
      - id: quoted-exe-double-dash-arg
  - id: run-key-near-candidate-value-name
    desc: Run key with nearby candidate value name
    crit: notable
    conf: 0.82
    for: [pe, dll]
    near_bytes: 384
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: short-camel-on-run-value-token
    any:
      - id: quoted-exe-double-dash-arg
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  - id: programdata-run-key-command
    desc: ProgramData executable persisted through Run key
    crit: suspicious
    conf: 0.92
    for: [pe, dll]
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: quoted-programdata-exe-run-command
      - id: metadata/signature/absent::unsigned
    unless:
      - id: metadata/installer/product/

  - id: iexpress-autoit-registry-persistence
    for: [pe]
    desc: IExpress AutoIt payload writes registry persistence
    crit: hostile
    conf: 0.99
    attack: "T1027.009,T1547.001"
    mbc: F0003
    all:
      - id: micro-behaviors/process/interpreter/autoit::iexpress-autoit-script-payload
      - id: metadata/lang/compiled::autoit-script-resource-entry
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  - id: encoded-run-key-persistence
    desc: Encoded Run key persistence
    crit: suspicious
    conf: 0.98
    for: [pe]
    all:
      - id: micro-behaviors/os/registry/autostart/reference::encoded-run-key-path
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::base64-arithmetic-xor-decoder
  - id: batch-public-windowssec-run-key
    desc: Batch Public WindowsSec Run key
    crit: suspicious
    conf: 0.96
    for: [batch]
    all:
      - id: batch-reg-add-run
      - id: batch-run-key-fragment
      - id: batch-public-windowssec-path
      - id: batch-ntoskrnl-masquerade
  - id: batch-direct-run-key-self-persistence
    desc: Batch persists itself directly through a Run key
    crit: suspicious
    conf: 0.96
    for: [batch]
    all:
      - id: micro-behaviors/os/registry/autostart/write::batch-reg-add-run-key-direct
      - id: batch-reg-data-self-path
  - id: batch-var-run-key-self-persistence
    desc: Batch persists itself through a variable-backed Run key
    crit: suspicious
    conf: 0.96
    for: [batch]
    all:
      - id: batch-run-key-var-assignment
      - id: batch-reg-add-var-run-key
      - id: batch-reg-data-self-path
  - id: batch-hidden-programdata-powershell-run-key
    desc: Run key launches a hidden self-extracted PowerShell stage
    crit: hostile
    conf: 0.99
    for: [batch]
    attack: "T1059.001,T1140,T1547.001"
    all:
      - id: micro-behaviors/os/registry/autostart/write::batch-reg-add-run-key-direct
      - id: micro-behaviors/fs/path/application/state::programdata-directory-path
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: metadata/lang/source/syntax/command/launch::powershell-file-flag
      - id: objectives/execution/payload/file-exec/command/batch::self-extracting-gzip-powershell-stage
  - id: batch-hidden-powershell-run-key-persistence
    desc: Run key launches a hidden policy-bypassed PowerShell script
    crit: hostile
    conf: 0.99
    for: [batch]
    attack: "T1059.001,T1547.001,T1564.003"
    all:
      - id: micro-behaviors/os/registry/autostart/write::batch-reg-add-run-key-direct
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
      - id: metadata/lang/source/syntax/command/launch::powershell-file-flag
  - id: batch-encoded-user-run-persistence
    desc: Batch drops hidden per-user Run-key persistence
    crit: hostile
    conf: 0.99
    for: [batch]
    attack: "T1547.001"
    all:
      - id: batch-encoded-run-write
      - id: batch-encoded-user-profile-drop
      - id: batch-encoded-self-copy
      - id: batch-encoded-hidden-vbs-launcher
  - id: powershell-appdata-run-key-payload
    desc: PowerShell drops, persists, and starts an AppData executable
    crit: hostile
    conf: 0.99
    for: [powershell]
    attack: T1547.001
    all:
      - id: powershell-run-path-variable-write
      - id: powershell-appdata-exe-target
      - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
      - id: micro-behaviors/process/create/cmdlet::start-process-call
  - id: scrambled-upx-run-key-dropper
    desc: Tampered UPX binary persists through a Run key and spawns a process
    crit: hostile
    conf: 0.99
    for: [pe]
    attack: T1027.002,T1547.001,T1106
    all:
      - id: metadata/binary/layout/stub::upx-sections-without-early-magic
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: metadata/binary/symbols/name/process::create-process-w
  - id: self-mutating-cleartext-updater-run-persistence
    desc: Self-mutating Run-key updater fetches over unauthenticated HTTP
    crit: hostile
    conf: 0.96
    for: [pe]
    attack: T1547.001,T1105
    all:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-stack-bare-ip-http-clues
    unless:
      - id: metadata/installer/product/
