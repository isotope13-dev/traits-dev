defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: browser-password-upload-agent-run-key
    desc: Password-uploading agent with Run-key write APIs
    crit: hostile
    conf: 0.97
    attack: T1547.001
    all:
      - id: objectives/exfiltration/stealer/credential/value/password::native-browser-password-upload-agent
      - id: micro-behaviors/os/registry/keys/autostart::ansi-run-key-path
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
