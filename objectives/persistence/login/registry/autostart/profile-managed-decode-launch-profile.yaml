# A static API co-occurrence profile; no payload-to-file data flow is required.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: managed-run-key-decode-launch-api-profile
    desc: .NET Run-key path with decode/launch APIs
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor-text
      - id: micro-behaviors/data/codec::gzipstream-dotnet
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
