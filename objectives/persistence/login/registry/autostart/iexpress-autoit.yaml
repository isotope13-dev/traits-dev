defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: iexpress-autoit-persistence-dropper
    desc: IExpress AutoIt payload with Run-key persistence
    crit: hostile
    conf: 0.99
    attack: "T1027.009,T1547.001,T1547.009"
    mbc: "B0030,F0003"
    all:
      - id: objectives/command-and-control/dropper/file-exec/spawn::iexpress-autoit-script-payload
      - id: metadata/binary/installer/sfx::wextract-tool
      - id: metadata/lang/compiled::autoit-script-resource-entry
      - id: micro-behaviors/os/registry/keys::currentversion-run-key-path
      - id: objectives/persistence/system/registry/session-manager::boot-rename-persistence
    unless:
      - id: metadata/signed/platform/
