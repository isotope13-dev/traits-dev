defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: iexpress-autoit-persistence-dropper
    desc: IExpress AutoIt payload with Run-key persistence
    crit: hostile
    conf: 0.99
    attack: "T1027.009,T1547.001,T1547.009"
    mbc: "B0030,F0003"
    all:
      - id: micro-behaviors/process/interpreter/autoit::iexpress-autoit-script-payload
      - id: well-known/tool/packaging/iexpress::wextract-tool
      - id: metadata/lang/compiled::autoit-script-resource-entry
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: micro-behaviors/os/registry/session-manager/write::session-manager-rename-registry-api-profile
