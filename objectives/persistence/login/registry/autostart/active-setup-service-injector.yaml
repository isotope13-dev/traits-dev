defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.014
composite_rules:
- id: active-setup-service-dll-injector
  desc: Active Setup write APIs and DLL-injector self-copy code
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/persistence/system/service/loader::lanmanserver-resource-injection-hijack
  - id: micro-behaviors/os/registry/write::active-setup-stubpath-write-api-cluster
  # The Active Setup branch copies and patches its image through CRT I/O;
  # CopyFile imports elsewhere do not evidence that implementation.
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-crt-file-io
  - id: micro-behaviors/fs/write/file/handle::write--fwrite
  - id: metadata/binary/instruction/sequence::x86-clear-tag-two-call-sequence
- id: flood-implant-active-setup-persistence
  desc: Flood implant with Active Setup write APIs
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/os/registry/write::active-setup-stubpath-write-api-cluster
  - id: objectives/impact/dos/attack/flood::native-raw-udp-burst-flood
  any:
  - id: micro-behaviors/process/create/exec::winexec
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
  - id: micro-behaviors/communications/http/client/wininet::internet-open-url
  - id: micro-behaviors/fs/delete/file/command::windows-cmd-ping-file-delete
  - id: micro-behaviors/fs/delete/file/command::embedded-ping-delay-delete
  needs: 1
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
