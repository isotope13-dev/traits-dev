defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001
composite_rules:
- id: persistence-with-shellcode-loader
  desc: Run key persistence combined with shellcode loader
  crit: hostile
  conf: 0.95
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
  - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
  any:
  - id: micro-behaviors/os/api-resolution/manual::peb-pe-walk-memory-protection-clues-x64
  - id: micro-behaviors/mem/alloc/heap::peb-executable-heap-api-clues
  - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-walk-hash-resolver-x64
  unless:
  - id: metadata/installer/product/
  - id: metadata/binary/symbols/count::many-imports-50
