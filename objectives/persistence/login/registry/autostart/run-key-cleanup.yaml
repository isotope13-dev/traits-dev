defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001
composite_rules:
- id: persistence-with-shellcode-loader
  desc: Run key persistence combined with shellcode loader
  crit: hostile
  conf: 0.95
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
  any:
  - id: metadata/file/profile/process/injection::concealed-shellcode-loader-x64
  - id: metadata/file/profile/process/injection::executable-heap-shellcode-loader
  - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-walk-hash-resolver-x64
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/symbols/count::many-imports-50
