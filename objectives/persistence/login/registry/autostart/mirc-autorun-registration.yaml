defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1112
composite_rules:
  - id: mirc-executable-autorun-registration
    for: [mirc, lua, data]
    desc: mIRC registers an executable for autorun
    crit: notable
    any:
      - id: objectives/persistence/login/registry/autostart::mirc-regwrite-run-client-path
      - id: metadata/file/profile/registry/autostart::mirc-staged-client-run-import
      - id: metadata/file/profile/registry/autostart::mirc-staged-executable-run-import
