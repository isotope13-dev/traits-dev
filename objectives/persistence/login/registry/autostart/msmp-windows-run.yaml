defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: msmp-state-loader-windows-run-persistence
    desc: MSMP network loader writes logon Run value
    crit: hostile
    conf: 0.98
    attack: T1547.001
    all:
      - id: metadata/binary/instruction::x86-msmp-state-magic-compare
      - id: micro-behaviors/data/arithmetic::x86-byte-complement-512
      - id: micro-behaviors/os/registry/write::x86-windows-logon-run-value-write
      - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
      - id: micro-behaviors/fs/delete/file/command::retry-delete-batch-template
