defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: msmp-state-loader-windows-run-persistence
    desc: MSMP network loader writes logon autostart value
    crit: hostile
    conf: 0.98
    attack: T1547.001
    all:
      - id: metadata/binary/instruction/sequence/unspecified::x86-msmp-state-magic-compare
      - id: micro-behaviors/data/bitwise/complement::x86-byte-complement-512
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-lifecycle
      - id: micro-behaviors/fs/delete/file/command::retry-delete-batch-template
    any:
      - id: micro-behaviors/os/registry/autostart/write::x86-windows-logon-run-value-write
      - id: micro-behaviors/os/registry/value-name::traykey-value-name
