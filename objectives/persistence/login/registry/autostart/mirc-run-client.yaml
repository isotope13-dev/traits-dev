defaults:
  platforms: [windows]
  for: [mirc, lua, text, data]
  crit: notable
traits:
  - id: mirc-regwrite-run-client-path
    desc: mIRC Run-key write uses client executable path
    conf: 0.99
    if:
      type: text
      regex: '(?i)\$RegWrite\(HK[LC]M\\[^,\r\n]{1,90}\\Run\\[^,]{1,40},[^\r\n]{0,30}\$mircexe'

  # mIRC cannot call RegWrite itself, so the script writes a VBScript that
  # does it on the next run. `write Windll.vbs src.RegWrite keySP, updateSP`
  # is that dropper; the Run path it writes is matched by the micro-behavior.
  - id: mirc-vbs-regwrite-dropper
    desc: mIRC writes VBS script calling RegWrite
    crit: notable
    conf: 0.92
    for: [mirc]
    if:
      type: text
      regex: '(?i)\bwrite\s+[^\r\n]{0,12}\.vbs\s+\w+\.RegWrite\b'

composite_rules:
  - id: mirc-vbs-run-key-dropper
    desc: mIRC drops a VBS script that writes a Run key
    crit: notable
    conf: 0.93
    for: [mirc]
    near_lines: 1
    all:
      - id: mirc-vbs-regwrite-dropper
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
