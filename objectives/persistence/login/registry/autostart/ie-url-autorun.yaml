defaults:
  platforms:
  - windows
  for:
  - html
  - vbs
  - javascript
  - batch
  - powershell
  crit: notable
  conf: 0.98
traits:
- id: regwrite-browser-run-url
  desc: RegWrite autoruns IE with an HTTP URL
  if:
    type: text
    regex: (?i)RegWrite.{0,160}\\Run\\[^"]{1,60}"\s*,\s*"IEXPLORE\.EXE https?://
