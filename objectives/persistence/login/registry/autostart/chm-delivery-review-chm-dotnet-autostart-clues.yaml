defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-dotnet-autostart-clues
  desc: CHM .NET text and Run-key write clues
  crit: hostile
  conf: 0.99
  scope: archive
  for: [chm, html, javascript]
  attack: T1059.007,T1547.001,T1105
  all:
    - id: metadata/lang/source/naming/resource::dotnet-frombase64transform-text
    - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet-text
    - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
    - id: micro-behaviors/os/registry/value/write::wscript-regwrite
  any:
    - id: metadata/document/chm::chm-has-objinst
    - id: metadata/document/chm::chm-no-html-entries
  unless:
    - id: metadata/document/chm::chm-data-basename

