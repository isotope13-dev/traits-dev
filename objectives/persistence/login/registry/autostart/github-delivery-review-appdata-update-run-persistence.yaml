defaults:
  for: [pe]
  platforms: [windows]
  attack: T1547.001

composite_rules:
- id: appdata-update-run-persistence
  desc: APPDATA Update.exe Run persistence cluster
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
  - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
  - id: micro-behaviors/os/env/path::appdata-path-lookup
  - id: micro-behaviors/fs/path/executable::update-exe-string
  any:
  - id: micro-behaviors/fs/file/copy/call::copyfile-w
  - id: micro-behaviors/fs/path/check::get-module-filename
  unless:
  - id: objectives/discovery/host/system
  - id: metadata/binary/layout/strings::high-string-count-pe
  - id: well-known/app/system/iobit::iobit-component-context
