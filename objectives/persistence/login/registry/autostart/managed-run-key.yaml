# A .NET assembly that writes the Windows CurrentVersion\Run autostart key
# alongside a cmd.exe /c shell command. The Run key leg requires a registry
# write (managed setter or native API) so that tool signature tables and
# documentation that merely quote the key path do not establish persistence.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-run-key-command-persistence
    desc: .NET assembly writes Run key and runs a cmd.exe /c command
    crit: suspicious
    conf: 0.85
    attack: T1547.001
    scope: file
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/os/registry/autostart/write::run-path-write-api-references
      - id: micro-behaviors/process/create/shell/command-mode
