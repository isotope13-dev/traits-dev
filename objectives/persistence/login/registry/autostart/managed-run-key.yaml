# A .NET assembly that references the Windows CurrentVersion\Run autostart key
# alongside registry write APIs and a cmd.exe /c shell command.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-run-key-command-persistence
    desc: .NET assembly pairs Run key reference with shell command
    crit: suspicious
    conf: 0.85
    attack: T1547.001
    scope: file
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/os/registry/autostart/reference
      - id: micro-behaviors/process/create/shell/command-mode
