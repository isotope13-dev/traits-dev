defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: raw-ip-winhttp-runkey-staging-clues
    desc: Raw-IP WinHTTP and Run-key staging clues
    crit: hostile
    conf: 0.97
    attack: "T1105,T1547.001"
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-download-context
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-port-binary
      - id: micro-behaviors/os/registry/autostart/write::run-key-file-operation-api-profile
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/os/handler/open::shell-execute-api-text
    unless:
      - id: metadata/binary/resource/identity::pe-version-resource
