# Run-key persistence that anchors an executable under ProgramData while the
# binary hides its API references behind XOR decoding. Installers and updaters
# legitimately self-start from ProgramData, so the concealment (or self-delete)
# corroboration is required before this is an attack claim rather than a
# deployment preference.
defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: masqueraded-programdata-run-persistence
    desc: XOR-hidden APIs persist a ProgramData executable via Run key
    crit: hostile
    conf: 0.96
    attack: T1547.001,T1036.005
    all:
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/fs/path/system::programdata-directory-path
    any:
      - id: objectives/anti-static/obfuscation/decoders::xor-encoded-api-table
      - id: micro-behaviors/fs/delete/file/command::retry-delete-batch-template
