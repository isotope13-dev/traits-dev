# Registry change monitoring that guards an autorun entry. Watching a key is
# ordinary (micro-behaviors/os/registry/callback); persistence protection is
# a watch on the Run key paired with code that writes it back.
defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1547.001"
composite_rules:
  - id: active-persistence-protection
    desc: Watches the Run key and rewrites registry values
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/callback::regnotify-change-key-value-pinvoke
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
    any:
      - id: micro-behaviors/os/registry/write::registry-managed-set-value-source
      - id: micro-behaviors/os/registry/write::csharp-open-key-set-value
