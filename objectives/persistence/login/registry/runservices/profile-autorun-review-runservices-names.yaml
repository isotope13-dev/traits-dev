defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: runservices-system-name-api-references
    desc: RunServices names and registry write APIs
    crit: notable
    conf: 0.98
    for: [pe]
    all:
      - id: micro-behaviors/os/application/target/browser::iexplore-exe-name
      - id: well-known/app/system/microsoft/core-utilities::internat-name
      - id: "micro-behaviors/os/registry/autostart/reference::runservices-key-path"
      - id: micro-behaviors/os/registry/value/write::registry-write-api-chain
      - id: micro-behaviors/fs/path/check::get-module-filename
    any:
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
    needs: 1
