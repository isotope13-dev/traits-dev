defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1547.001,T1059.001
composite_rules:
  - id: msi-run-key-hidden-encoded-clues
    desc: MSI Run key and hidden encoded shell clues
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/registry/autostart/reference::msi-currentversion-run-text
      - id: objectives/execution/interpreter/powershell::msi-wsh-hidden-encoded-clues
  - id: msi-run-key-encoded-bypass-clues
    desc: MSI Run key and encoded bypass clues
    crit: suspicious
    conf: 0.995
    all:
      - id: micro-behaviors/os/registry/autostart/reference::msi-currentversion-run-text
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
      - id: micro-behaviors/process/argument/interpreter::msi-encoded-command-option-text
