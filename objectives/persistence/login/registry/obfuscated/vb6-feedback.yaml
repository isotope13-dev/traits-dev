defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: vb6-concealed-runkey-and-task-installation
    desc: VB6 conceals Run-key and scheduled-task installation commands
    crit: hostile
    conf: 0.98
    attack: T1547.001,T1053.005,T1027
    all:
      - id: objectives/anti-static/obfuscation/string/encoding::vb6-feedback-triplet-string-decoder
      - id: micro-behaviors/os/registry/keys/autostart::feedback-coded-currentversion-run
      - id: micro-behaviors/os/autorun/scheduled::feedback-coded-schtasks-create
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
