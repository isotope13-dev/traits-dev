defaults:
  crit: hostile
  attack: "T1547.001"
  # A VBA macro (as opposed to a standalone VBScript file) lives inside an
  # Office document, so its file type is Oledoc, not Vbs. currentversion-run
  # (micro-behaviors/os/registry/keys) only reaches document types via
  # oledoc (its own comment: "oledoc covers MSI/OLE installer databases");
  # ooxml is left out, so this stays oledoc-only too.
  for: [oledoc]
  platforms: [windows]
traits:
  # regwrite-call (micro-behaviors/os/registry/manipulate/vba.yaml) is
  # `for: [vbs]` only despite matching the same `.RegWrite` VBA call this
  # file's macros make -- it targets standalone .vbs files, not a macro
  # embedded in an Office document. wscript-regwrite
  # (micro-behaviors/os/registry/write/wsh/script.yaml) is the equivalent
  # text matcher but is `for: [vbs, javascript, html]`, also missing
  # oledoc/ooxml. Local copy scoped for this file's macro document types.
  - id: vba-macro-regwrite-call
    desc: VBA macro RegWrite registry modification
    crit: notable
    conf: 0.88
    attack: T1112
    if:
      type: text
      regex: '\.\s*RegWrite\b'
      case_insensitive: true
composite_rules:
  - id: vba-registry-run-persistence
    desc: VBA macro installs Run key persistence
    conf: 0.98
    all:
      - id: vba-macro-regwrite-call
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/process/create/macro/office::autoopen-entrypoint
  - id: vba-autoclose-persistence
    desc: VBA auto-close installs persistence
    conf: 0.97
    all:
      - id: vba-macro-regwrite-call
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/process/create/macro/autoexec::auto-close-trigger
