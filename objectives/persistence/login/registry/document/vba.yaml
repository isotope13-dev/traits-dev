defaults:
  crit: hostile
  attack: "T1547.001"
  # A VBA macro (as opposed to a standalone VBScript file) lives inside an
  # Office document, so its file type is Oledoc, not Vbs. currentversion-run
  # (micro-behaviors/os/registry/autostart/reference) only reaches document types via
  # oledoc (its own comment: "oledoc covers MSI/OLE installer databases");
  # ooxml is left out, so this stays oledoc-only too.
  for: [oledoc]
  platforms: [windows]
traits:
  # The standalone VBS RegWrite literal observation does not establish a
  # macro call and does not cover Office documents. This matcher covers the
  # call text in OLE document content.
  - id: vba-macro-regwrite-call
    desc: VBA macro RegWrite registry modification
    crit: notable
    conf: 0.88
    attack: T1112
    if:
      type: text
      regex: '\.\s*RegWrite\b'
      case_insensitive: true
composite_rules:
  - id: vba-registry-run-persistence
    desc: VBA macro installs Run key persistence
    conf: 0.98
    all:
      - id: vba-macro-regwrite-call
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/application/hook/event::autoopen-entrypoint
  - id: vba-autoclose-persistence
    desc: VBA auto-close installs persistence
    conf: 0.97
    all:
      - id: vba-macro-regwrite-call
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
      - id: micro-behaviors/os/application/hook/event::auto-close-trigger
