defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1137
traits:
- id: office-versioned-addin-key-path
  desc: Office versioned add-in key path
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '(?i)\\Microsoft\\Office\\[0-9.]+\\(Word|Excel|PowerPoint|Outlook)\\Addins\\'
- id: outlook-form-region-registry
  desc: Outlook form-region registry path
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '(?i)\\Outlook\\FormRegions\\|\\Office\\Outlook\\FormRegions\\'

composite_rules:
- id: office-addin-registry-write
  for: [pe]
  desc: Office add-in registry write
  crit: suspicious
  conf: 0.88
  all:
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  any:
  - id: office-addin-registry
  - id: outlook-form-region-registry
  downgrade:
    any:
    - id: metadata/signed/platform/
- id: office-addin-registry
  desc: Office add-in registry path
  crit: component
  conf: 0.84
  any:
  - id: office-versioned-addin-key-path
  - id: micro-behaviors/os/registry/keys/product::office-addin-key-path
  - id: micro-behaviors/os/registry/keys/product::outlook-addin-key-path
  unless:
  - id: metadata/signed/platform::microsoft
  - id: well-known/dual-use/remote-admin/teamviewer::teamviewer-office-addin-context
