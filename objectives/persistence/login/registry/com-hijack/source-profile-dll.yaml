# Per-user COM hijack across source and scripting languages (including FFI callers)
# where HKCU\Software\Classes\CLSID\{...}\InprocServer32 is pointed at a DLL in AppData.
defaults:
  platforms: [windows]
  for: [source, scripts]
  attack: T1546.015

composite_rules:
  - id: inprocserver32-appdata-dll-write
    desc: Writes CLSID InprocServer32 for AppData DLL
    crit: suspicious
    conf: 0.95
    near_bytes: 1500
    all:
      - id: micro-behaviors/os/registry/com/reference::clsid-guid-near-inprocserver32
      - id: micro-behaviors/fs/path/app-data/platform::assembled-appdata-dll-path
      - id: micro-behaviors/os/registry/write::registry-value-write

  - id: source-hkcu-inprocserver32-profile-dll-hijack
    desc: Per-user CLSID InprocServer32 AppData DLL hijack
    crit: hostile
    conf: 0.98
    all:
      - id: inprocserver32-appdata-dll-write
    any:
      - id: micro-behaviors/os/registry/hive/reference::hkcu-hive
      - id: micro-behaviors/os/registry/hive/reference::hkcu-registry-hive-source
