defaults:
  crit: suspicious
  for: [batch, powershell, vbs]
  platforms: [windows]
  attack: T1546.015

traits:
  - id: reg-add-clsid-script
    desc: reg add writes CLSID script path
    conf: 0.93
    unless:
      - type: text
        substr: Show More Options Context Menu
      - type: text
        substr: restore classic context menu
      - type: text
        substr: System.IsPinnedToNameSpaceTree
      - type: basename
        exact: showMoreOptions.bat
    if:
      type: text
      regex: '(?i)reg\s+add.{0,80}\\Software\\Classes\\CLSID\\\{[0-9A-F-]{36}\}'
  - id: rundll32-inprocserver32-value
    desc: InProcServer32 value set to rundll32
    conf: 0.96
    if:
      type: text
      regex: '(?i)InProcServer32.{0,80}rundll32\.exe'
composite_rules:
  - id: script-clsid-rundll32-com-hijack
    desc: Script registers rundll32 as COM server
    conf: 0.97
    all:
      - id: reg-add-clsid-script
      - id: micro-behaviors/os/registry/com/reference::inprocserver32-word
      - id: rundll32-inprocserver32-value
    any:
      - id: micro-behaviors/os/com/registration::com-apartment-threading-model
