defaults:
  for: [pe]
  platforms: [windows]
  attack: T1546.015

traits:
  - id: ssodl-enum-helper-marker
    desc: SSODL enum helper marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: EnumSSODL - Begin

  - id: ssodl-hklm-report-marker
    desc: SSODL HKLM report marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: '- HKLM\..\ShellServiceObjectDelayLoad:'

  - id: shellserviceobjectdelayload-key
    desc: ShellServiceObjectDelayLoad registry path
    # The path names a persistence surface but also appears in legitimate
    # configuration and inspection tools; registry writes make it hostile in
    # shellservice-com-hijack below.
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: Software\Microsoft\Windows\CurrentVersion\ShellServiceObjectDelayLoad
    unless:
      - id: ssodl-enum-helper-marker
      - id: ssodl-hklm-report-marker

  - id: web-event-logger-name
    desc: Web Event Logger autoload name
    # Family/composite support only: a display name alone is not persistence.
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: Web Event Logger

  - id: clsid-guid-string
    desc: Embedded CLSID persistence GUID
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: '{79FEACFF-FFCE-815E-A900-316290B5B738}'

composite_rules:
  - id: shellservice-com-hijack
    desc: Shell service COM hijack persistence
    crit: hostile
    conf: 0.97
    all:
      - id: shellserviceobjectdelayload-key
      - id: micro-behaviors/os/com/registration::clsid-inprocserver32-key-path
      - id: micro-behaviors/os/registry/manipulate::reg-create-key-ex-a
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
    any:
      - id: web-event-logger-name
      - id: clsid-guid-string
