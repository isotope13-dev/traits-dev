defaults:
  for: [pe]
  platforms: [windows]
  attack: T1546.015

traits:
  - id: ssodl-enum-helper-marker
    desc: SSODL enum helper marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: EnumSSODL - Begin

  - id: ssodl-hklm-report-marker
    desc: SSODL HKLM report marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: '- HKLM\..\ShellServiceObjectDelayLoad:'

composite_rules:
  - id: ie-desktop-icon-clsid-hijack
    desc: IE desktop icon CLSID command hijack
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/com/registration::ie-desktop-icon-clsid-command
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
