defaults:
  platforms: [windows]
  for: [python]
  attack: T1546.015

traits:
  - id: python-user-inproc-registration-command
    desc: Per-user COM server registration command
    crit: notable
    if:
      type: literal
      case_insensitive: true
      regex: 'reg\s+add.{0,90}HKCU\\Software\\Classes\\CLSID\\.{1,60}\\InProcServer32'

composite_rules:
  - id: python-headless-com-run-persistence
    desc: Python combines per-user COM registration with hidden Run-key staging
    crit: hostile
    conf: 0.98
    attack: T1546.015,T1547.001,T1564.003
    all:
      - id: python-user-inproc-registration-command
      - id: micro-behaviors/os/registry/autostart/write::reg-add-hive-run-key-command
      - id: micro-behaviors/process/create/hidden::conhost-headless
      - id: micro-behaviors/process/config/launch::python-create-no-window-use
