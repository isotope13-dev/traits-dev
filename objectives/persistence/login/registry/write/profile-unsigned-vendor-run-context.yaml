defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-microsoft-run-key-apis
    desc: Unsigned Microsoft-claim PE with Run-key APIs
    crit: notable
    conf: 0.96
    all:
      - id: metadata/signature/absent::unsigned-pe-microsoft-version-fields
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
    # A Run-key string and a claimed vendor do not establish a writer.
    any:
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-text
      - id: metadata/binary/symbols/name/registry/encoded::xor-registry-value-write-api
