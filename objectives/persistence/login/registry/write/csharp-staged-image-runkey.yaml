defaults:
  for: [csharp]
  platforms: [windows]

traits:
  - id: csharp-downloaded-hex-image-runkey-launch
    desc: Registers and launches decoded payload
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1105
    if:
      type: yara
      source: |
        rule csharp_downloaded_hex_image_runkey_launch {
          strings:
            $download = "client.DownloadData(endpoint + \"second\")"
            $decode = "Convert.FromHexString(encoded)"
            $write = "File.WriteAllBytes(target, payload)"
            $runkey = "Software\\Microsoft\\Windows\\CurrentVersion\\Run"
            $set = ".SetValue(\"AgentCache\", target)"
            $start = "Process.Start(target)"
          condition:
            all of them and @download < @decode and @decode < @write and
            @write < @runkey and @runkey < @set and @set < @start
        }
