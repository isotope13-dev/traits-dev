# Batch script downloads a payload via curl and adds a CurrentVersion Run key for persistence.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1105,T1547.001
  crit: hostile

composite_rules:
  - id: batch-curl-runkey-persistence
    desc: Batch curls payload and writes Run key
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/curl::batch-curl-download-to-temp
      - id: micro-behaviors/os/registry/autostart/write::batch-reg-add-run-key-direct
    any:
      - id: micro-behaviors/process/create/path-execution::start-executable-command
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/fs/delete/file/self::batch-self-delete
