# A DLL that registers itself under a Run key as a rundll32 command line and
# also carries the remote-thread injection set (process snapshot,
# VirtualAllocEx, WriteProcessMemory, CreateRemoteThread) relaunches at every
# logon and moves into another process. Havex's TmProvider.dll (2014) wrote
# `rundll32 <path>, RunDllEntry` and injected into explorer.exe.
defaults:
  platforms: [windows]
  for: [dll]
composite_rules:
  - id: rundll32-run-key-dll-with-remote-thread-injection
    desc: DLL rundll32 Run key and remote-thread injection
    crit: hostile
    conf: 0.95
    size_max: 8388608
    attack: T1547.001,T1218.011,T1055.001
    all:
      - id: micro-behaviors/fs/path/host-process::rundll32-command-prefix
      - id: micro-behaviors/os/registry/autostart/reference::utf16-currentversion-run-key
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
    any:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
