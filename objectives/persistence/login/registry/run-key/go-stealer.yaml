defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-credential-stealer-run-key-write-profile
    desc: Go stealer with Run-key setter code
    crit: hostile
    conf: 0.96
    attack: T1547.001
    # These are co-occurring binary references, not a source-level handle join.
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-login-query-with-keylogging
      - id: micro-behaviors/os/registry/keys/autostart::ansi-run-key-path
      - id: micro-behaviors/os/registry/manipulate::go-registry-string-value-writer-reference
