defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1547.001

composite_rules:
  - id: single-request-hidden-run-key-controller
    desc: Single-request controller forwards hidden Run-key command
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/remote-command/dispatch::deno-posts-command-tasking
      - id: objectives/command-and-control/remote-command/dispatch::deno-forwarded-hidden-run-key-command
      - id: metadata/lang/source/syntax/call/relationship::single-fetch-call
      - id: micro-behaviors/os/registry/write::reg-add-run-command
      - id: micro-behaviors/process/create/hidden::conhost-headless
  - id: http-command-tasker-hidden-run-key
    desc: HTTP command tasker defines headless console Run-key persistence
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/command-and-control/remote-command/dispatch::deno-posts-command-tasking
      - id: micro-behaviors/os/registry/write::reg-add-run-command
      - id: micro-behaviors/process/create/hidden::conhost-headless
