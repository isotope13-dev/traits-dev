defaults:
  platforms:
  - windows
  for:
  - batch
  crit: hostile

composite_rules:
- id: batch-dropbox-download-run-key
  desc: Batch Dropbox download and Run-key write
  conf: 0.97
  attack: T1105,T1547.001
  all:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/os/registry/autostart/write::batch-reg-add-run-key-direct
  any:
  - id: well-known/app/storage/dropbox::dropboxusercontent-executable-url
  - id: well-known/app/storage/dropbox::dropbox-share-executable-url
  - id: well-known/app/storage/dropbox::dropbox-direct-executable-url
