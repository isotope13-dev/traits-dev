defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
  attack: T1547.001

traits:
  # Perl heredocs are retained as plain source text rather than a normalized
  # registry value, so keep this narrow fallback for the canonical Run path.
  - id: perl-currentversion-run-text
    desc: Perl source names the CurrentVersion Run key
    crit: notable
    conf: 0.98
    for: [perl]
    if:
      type: text
      regex: '(?i)HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run'

composite_rules:
  - id: run-key-script-beacon-persistence
    desc: Run key persists a staged network script
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
    any:
      - id: objectives/command-and-control/dropper/standalone::node-exe
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/exec::cmd-exe-reference

  - id: run-key-node-beacon-persistence
    desc: Run key launches periodic Node beacon
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
      - id: objectives/command-and-control/dropper/standalone::node-exe
    # Go raw strings are covered by a separate atom because the generic
    # source matcher normalizes backslashes differently for that parser.
    any:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/keys::go-currentversion-run

  - id: perl-run-key-node-beacon
    desc: Perl package writes a Node beacon to the Windows Run key
    crit: hostile
    conf: 0.99
    for: [perl]
    scope: archive
    all:
      - id: objectives/persistence/login/registry/run-key::perl-currentversion-run-text
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
      - id: objectives/command-and-control/dropper/standalone::node-exe
      - id: micro-behaviors/process/create/system::system-process-call

  - id: elixir-run-key-node-beacon
    desc: Elixir package writes a Node Run-key beacon
    crit: hostile
    conf: 0.99
    for: [elixir]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
      - id: objectives/command-and-control/dropper/standalone::node-exe
      - id: micro-behaviors/process/create/system::elixir-system-cmd

  - id: kotlin-run-key-node-beacon
    desc: Kotlin package writes a Node Run-key beacon
    crit: hostile
    conf: 0.99
    for: [kotlin]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
      - id: objectives/command-and-control/dropper/standalone::node-exe
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-source

  - id: typescript-run-key-node-beacon
    desc: TypeScript package writes a Node beacon to the Windows Run key
    crit: hostile
    conf: 0.99
    for: [typescript]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
      - id: objectives/command-and-control/dropper/standalone::node-exe
      - id: micro-behaviors/process/create/system::js-execfile-call

  - id: csharp-run-key-node-beacon
    desc: C# package writes a Node Run-key beacon
    crit: hostile
    conf: 0.99
    for: [csharp]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/keys::registry-setvalue-executable
      - id: objectives/persistence/login/startup/registry::software-run-key
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
      - id: objectives/command-and-control/dropper/standalone::node-exe

  - id: go-run-key-node-beacon
    desc: Go package writes a Node Run-key beacon
    crit: hostile
    conf: 0.99
    for: [go]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/keys::go-currentversion-run
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
      - id: objectives/command-and-control/dropper/standalone::node-exe

  - id: rust-run-key-node-beacon
    desc: Rust package writes a Node beacon to the Windows Run key
    crit: hostile
    conf: 0.99
    for: [rust, archives]
    scope: archive
    attack: T1547.001,T1071.001,T1195.002
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::rust-winreg-write
      - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
      - id: objectives/command-and-control/dropper/standalone::node-exe

  - id: python-run-key-http-beacon-persistence
    desc: Run key launches periodic Python beacon
    crit: hostile
    conf: 0.99
    for: [python]
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::winreg-setvalue
      - id: micro-behaviors/process/interpreter/python::pythonw-launch
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
      - id: micro-behaviors/time/sleep/interval::python-sleep-1s-plus-arg
