defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
  attack: T1547.001

composite_rules:
  - id: run-key-node-beacon-persistence
    desc: Run key launches periodic Node beacon
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference
    # Go raw strings are covered by a separate atom because the generic
    # source matcher normalizes backslashes differently for that parser.
    any:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: "micro-behaviors/os/registry/keys/autostart::windows-run-key-path"

  - id: perl-run-key-node-beacon
    desc: Perl package writes a Node beacon to the Windows Run key
    crit: hostile
    conf: 0.99
    for: [perl, tar]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/keys/autostart::perl-currentversion-run-text
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference
      - id: micro-behaviors/process/create/system::system-process-call
    any:
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/os/registry/access::perl-registry-key-write
  - id: elixir-run-key-node-beacon
    desc: Elixir package writes a Node Run-key beacon
    crit: hostile
    conf: 0.99
    for: [elixir, tar]
    scope: archive
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference
      - id: micro-behaviors/process/create/system::elixir-system-cmd

  - id: kotlin-run-key-node-beacon
    desc: Kotlin package writes a Node Run-key beacon
    crit: hostile
    conf: 0.99
    for: [kotlin, jar]
    scope: archive
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-source

  - id: typescript-run-key-node-beacon
    desc: TypeScript package writes a Node beacon to the Windows Run key
    crit: hostile
    conf: 0.99
    for: [typescript, npm]
    scope: archive
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference
      - id: micro-behaviors/process/create/system::js-execfile-call

  - id: csharp-run-key-node-beacon
    desc: C# package writes a Node Run-key beacon
    crit: hostile
    conf: 0.99
    for: [csharp, nupkg]
    scope: archive
    all:
      - id: micro-behaviors/os/registry/write::registry-setvalue-executable
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference

  - id: go-run-key-node-beacon
    desc: Go package writes a Node Run-key beacon
    crit: hostile
    conf: 0.99
    for: [go, zip]
    scope: archive
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::windows-run-key-path"
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference

  - id: rust-run-key-node-beacon
    desc: Rust package writes a Node beacon to the Windows Run key
    crit: hostile
    conf: 0.99
    for: [rust, crate]
    scope: archive
    attack: T1547.001,T1071.001,T1195.002
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/manipulate::rust-winreg-write
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference

  - id: python-run-key-http-beacon-persistence
    desc: Run key launches periodic Python beacon
    crit: hostile
    conf: 0.99
    for: [python]
    near_bytes: 4096
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/manipulate::winreg-setvalue
      - id: micro-behaviors/process/interpreter/python::pythonw-launch
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
      - id: micro-behaviors/time/sleep/interval::python-sleep-1s-plus-arg

  - id: swift-run-key-node-beacon
    desc: Swift writes a periodic Node beacon to the Run key
    crit: hostile
    conf: 0.99
    for: [swift]
    all:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/communications/http/request/client::embedded-node-https-get-with-timeout
      - id: micro-behaviors/fs/path/application/executable::node-executable-name-reference
      - id: micro-behaviors/process/create/direct::swift-source-process-run
