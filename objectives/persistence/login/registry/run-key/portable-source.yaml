defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
  attack: T1547.001

composite_rules:
  - id: run-key-script-beacon-persistence
    desc: Run key persists a staged network script
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
    any:
      - id: objectives/command-and-control/dropper/standalone::node-exe
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
