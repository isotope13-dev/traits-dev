defaults:
  platforms: [windows]
  for: [python, whl, zip]
composite_rules:
  - id: python-rc4-agent-registry-autostart
    desc: RC4 browser agent writes registry autostart
    crit: hostile
    conf: 0.97
    scope: archive
    attack: T1547.001
    all:
      - id: objectives/command-and-control/backdoor/tasking/http::python-rc4-http-browser-shell-agent
      - id: micro-behaviors/os/registry/access::winreg-openkey
      - id: micro-behaviors/os/registry/write::winreg-setvalue
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
