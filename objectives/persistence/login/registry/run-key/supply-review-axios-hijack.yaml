defaults:
  platforms:
    - windows
    - linux
    - macos
  size_max: 5000000

composite_rules:
  - id: ps1-bat-hidden-persist
    desc: PS1 BAT drop hidden with registry persistence
    crit: hostile
    conf: 0.97
    attack: T1547.001
    for:
      - powershell
    all:
      - id: objectives/persistence/login/registry/launch::microsoftupdate-and-run-key-reference
      - id: micro-behaviors/fs/path/script::bat-in-system-dir
      - id: objectives/evasion/masquerade/binary/carrier::bat-hidden-filesystem-attr
