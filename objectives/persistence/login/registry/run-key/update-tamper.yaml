defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: update-tamper-proxy-hklm-run-autostart
    desc: Update tamper proxy persists through HKLM Run
    crit: hostile
    conf: 0.99
    attack: T1547.001
    all:
      - id: objectives/evasion/anti-av/verification::eset-update-signature-suppression-proxy
      - id: micro-behaviors/os/autorun/login-items::hklm-run-set-diagnostic
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
    # The hash-rotating autostart composite restates this persistence for the
    # same program; step down when it fires so one behavior is not convicted twice.
    downgrade:
      any:
        - id: hash-rotating-port-seizing-proxy-autostart
