defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # The command-record protocol establishes the unauthorized client role;
  # a Run-key path and registry-write import alone would also fit installers.
  - id: command-record-client-run-key
    desc: HTTP command-record client with Run-key write APIs
    crit: hostile
    conf: 0.97
    attack: T1547.001
    all:
      - id: objectives/command-and-control/channel/http/beacon::mpress-mac-command-client
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/process/create/exec::create-process-a
