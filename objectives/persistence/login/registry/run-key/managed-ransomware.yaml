defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # A compiled ransomware stream-overwrite routine plus its own executable
  # path, Run/RunOnce paths, and RegistryKey setter references indicates
  # autorun registration. This is a static API profile, not proof of a write
  # succeeding; it does not assert which value name or executable was used.
  - id: managed-ransomware-autorun-registration
    desc: Managed ransomware carries Run-key registration API profile
    crit: hostile
    conf: 0.96
    attack: T1547.001
    all:
      - id: objectives/impact/ransom/encrypt/bulk-encryption::managed-ransom-stream-replacement
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/os/registry/value/write::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/process/info/selfpath::managed-executable-path-getter
