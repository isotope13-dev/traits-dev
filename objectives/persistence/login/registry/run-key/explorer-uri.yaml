defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
composite_rules:
- id: run-key-explorer-uri-pathless-com
  desc: Explorer URI logon with pathless COM handler
  crit: hostile
  conf: 0.99
  attack: T1547.001,T1218.011
  near_lines: 10
  all:
  - id: explorer-uri-run-value
  - id: micro-behaviors/os/registry/association::open-command-rundll32-sta
  - id: micro-behaviors/process/create/shell/script-host::rundll32-sta-clsid-activation
  - id: micro-behaviors/os/registry/association::url-protocol-handler-registration
traits:
- id: explorer-uri-run-value
  desc: Run-key command data launches an Explorer URI
  crit: suspicious
  conf: 0.98
  attack: T1547.001
  if:
    type: text
    regex: (?i)\\+CurrentVersion\\+Run\b[^\r\n]{0,64}/d\s+"+explorer\.exe\s+"*\w+://
