defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-syscall-clipper-run-key-writer
    desc: Go clipboard hijacker with Run-key writer
    crit: hostile
    conf: 0.97
    attack: T1547.001
    # A static co-occurrence profile; no claim of a registry handle join.
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::go-syscall-crypto-clipboard-replacer
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
      - id: micro-behaviors/os/registry/manipulate::go-registry-set-string-value-call
