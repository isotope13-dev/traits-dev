defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001
  crit: notable

traits:
  - id: persistence-copy-status
    desc: Persistence copy installation message
    if:
      type: text
      substr: Installed persistence copy at

  - id: registry-persistence-status
    desc: Registry persistence enabled message
    if:
      type: text
      substr: Persistence enabled (Windows Registry)

composite_rules:
  - id: polling-agent-run-key-persistence
    desc: Polling shell agent includes Run-key persistence installation
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/remote-command/http-poll::native-polling-shell-agent
      - id: persistence-copy-status
      - id: registry-persistence-status
      - id: micro-behaviors/os/registry/autostart/reference::ansi-run-key-path
