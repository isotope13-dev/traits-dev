defaults:
  platforms: [windows]
  for: [binaries, scripts, source, reg]
composite_rules:
  - id: machine-run-key-hidden-bypass-script-stager
    desc: Run-key mutation with concealed PowerShell staging clues
    crit: hostile
    conf: 0.97
    attack: T1547,T1059.001,T1564.003
    all:
      - id: micro-behaviors/os/registry/autostart/write::reg-add-hive-run-key-command
      - id: objectives/persistence/system/registry/surface::machine-hive-key-prefix
      - id: micro-behaviors/os/registry/process/write::registry-mutation-surface
      - id: objectives/persistence/system/registry/surface::user-writable-staging-surface
    any:
      - id: objectives/evasion/security-bypass/policy/execution::batch-concealed-policy-override-call
      - id: objectives/evasion/security-bypass/policy/execution::pe-concealed-policy-override-profile
      - id: micro-behaviors/process/argument/visibility::powershell-bypass-file-hidden-flags
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: metadata/build/msbuild::msbuild-exec-task-text
