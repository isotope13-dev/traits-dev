defaults:
  platforms: [windows]
  for: [c, cpp, python]
  attack: T1547.001

composite_rules:
  - id: default-user-hive-run-key-modification
    desc: Default User hive load, Run key, and value write
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/offline-hive::default-user-hive-load
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
    any:
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-source
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
      - id: micro-behaviors/os/registry/write::winreg-setvalue
