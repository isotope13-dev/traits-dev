defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # The recorder supplies the surveillance context. Run-key and SetValue
  # references alone also occur in ordinary application installers. This
  # profile does not bind the setter to this key or prove a successful write.
  - id: managed-hook-keylogger-run-key-references
    desc: Hook keylogger with Run-key, location and setter references
    crit: hostile
    conf: 0.93
    attack: T1547.001
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/access::dotnet-registrykey-setvalue-references
      - id: metadata/binary/symbols/name/token::location-getter-name
