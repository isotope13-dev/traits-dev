defaults:
  platforms: [windows]
  for: [pe]
  attack: T1071.001,T1105


composite_rules:
  - id: unsigned-ip-winhttp-self-updater
    desc: Unsigned IP updater and Run-key clues
    crit: hostile
    conf: 0.97
    attack: T1105,T1547.001
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-stack-bare-ip-http-clues
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: micro-behaviors/os/autorun/login-items::hklm-run-set-diagnostic
      - id: micro-behaviors/os/handler/open::shell-execute-api-text
