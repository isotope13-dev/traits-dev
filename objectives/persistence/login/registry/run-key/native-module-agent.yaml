defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # The module agent's installer invokes its Run-key helper with operation
  # 0x66 and its own image path; the same helper also supports query/delete.
  # This static profile asserts writer support, not installation success.
  - id: concealed-module-agent-run-key-writer
    desc: Module-command implant with Run-key writer references
    crit: hostile
    conf: 0.98
    attack: T1547.001
    all:
      - id: objectives/command-and-control/remote-command/dispatch/code-load::concealed-native-module-upload-dispatch
      - id: micro-behaviors/os/registry/keys/autostart::ansi-run-key-path
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/process/info/current::get-module-filename-ansi
