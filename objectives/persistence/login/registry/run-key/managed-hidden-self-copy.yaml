defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: managed-concealed-name-self-copy-run-key
  desc: Concealed executable self-copy with Run-key registration
  crit: hostile
  conf: 0.98
  attack: T1547.001,T1036,T1564.001
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: objectives/evasion/masquerade/naming::zero-width-spliced-executable-name
  - id: micro-behaviors/os/registry/manipulate::managed-run-path-write-api-references
  - id: micro-behaviors/process/info/selfpath::managed-executable-path-getter
  - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
  - id: metadata/binary/symbols/name/token::setattributes-member-name
  - id: metadata/binary/instruction/operand::cil-chained-call-local-and-two
