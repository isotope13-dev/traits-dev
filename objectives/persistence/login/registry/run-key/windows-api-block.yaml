defaults:
  for: [pe]
  platforms: [windows]
  attack: T1547.001
traits:
- id: currentversion-run-key-literal
  desc: CurrentVersion Run key literal
  crit: component
  conf: 0.94
  if:
    type: text
    substr: SOFTWARE\Microsoft\Windows\CurrentVersion\Run
    case_insensitive: true
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
  - id: well-known/app/enterprise/athoc::athocafrc-legacy-module-context

- id: run-key-registry-api-block
  desc: Run key registry API block
  crit: component
  conf: 0.95
  if:
    type: text
    regex: '(?i)\b(RegCreateKeyExA|RegCreateKeyA|RegSetValueExA)\b'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
  - id: well-known/app/enterprise/athoc::athocafrc-legacy-module-context

composite_rules:
- id: run-key-persistence-api-block
  desc: Registry Run key persistence API block
  crit: suspicious
  conf: 0.94
  all:
  - id: currentversion-run-key-literal
  - id: run-key-registry-api-block
  any:
  - id: objectives/persistence/login/registry/autostart::run-key
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
  - id: well-known/app/enterprise/athoc::athocafrc-legacy-module-context
