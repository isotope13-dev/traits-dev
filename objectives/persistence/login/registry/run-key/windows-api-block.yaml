defaults:
  for: [pe]
  platforms: [windows]
  attack: T1547.001

composite_rules:
- id: run-key-persistence-api-block
  desc: Registry Run key persistence API block
  crit: notable
  conf: 0.94
  all:
  - id: objectives/persistence/login/registry/autostart::currentversion-run-key-path
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  any:
  - id: objectives/persistence/login/registry/autostart::run-key
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
  - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
  - id: well-known/app/enterprise/athoc::athocafrc-legacy-module-context
  - id: well-known/app/network/juniper-setup-client::juniper-setup-client-identity
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/app/utility/siw::siw-family-identity
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
