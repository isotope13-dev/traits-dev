defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1547.001
traits:
  - id: currentversion-run-escaped-tail
    desc: Escaped CurrentVersion Run key tail
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'ersion\x5cRun'
composite_rules:
  - id: obfuscated-jscript-run-key-stager
    desc: Obfuscated JScript persists a hidden PowerShell stager in the Run key
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.007,T1547.001,T1112
    mbc: B0032,F0012,C0036
    all:
      - id: micro-behaviors/os/registry/write::regwrite-name-token
      - id: currentversion-run-escaped-tail
      - id: objectives/execution/interpreter/script/wsh::powershell-bypass-hidden
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-obfuscated
  - id: obfuscated-jscript-regwrite-run-persistence
    desc: Obfuscated JScript writes PowerShell stager to Run key
    crit: hostile
    conf: 0.97
    attack: T1547.001, T1112, T1059.001
    mbc: F0012, C0036
    all:
      - id: micro-behaviors/os/registry/write::regwrite-name-token
      - id: currentversion-run-escaped-tail
      - id: objectives/command-and-control/dropper/staging/encoded/script::token-array-powershell-nop-ep-bypass-escaped
      - id: objectives/command-and-control/dropper/staging/encoded/script::token-array-powershell-file-escaped
      - id: micro-behaviors/os/com/automation::activex-constructor-call
    any:
      - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
