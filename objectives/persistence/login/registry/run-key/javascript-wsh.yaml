defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1547.001
composite_rules:
  - id: obfuscated-jscript-run-key-stager
    desc: Obfuscated JScript persists a hidden PowerShell stager in the Run key
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.001,T1059.007,T1547.001,T1112
    mbc: B0032,F0012,C0036
    all:
      - id: micro-behaviors/os/registry/write::regwrite-name-token
      - id: micro-behaviors/os/registry/keys/autostart::js-currentversion-run-escaped-tail
      - id: objectives/execution/interpreter/script/wsh::powershell-bypass-hidden
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-obfuscated
  - id: obfuscated-jscript-regwrite-run-persistence
    desc: Obfuscated JScript writes PowerShell stager to Run key
    crit: hostile
    conf: 0.97
    attack: T1547.001, T1112, T1059.001
    mbc: F0012, C0036
    all:
      - id: micro-behaviors/os/registry/keys/autostart::js-currentversion-run-escaped-tail
      - id: objectives/command-and-control/dropper/staging/encoded/script::token-array-powershell-nop-ep-bypass-escaped
      - id: objectives/command-and-control/dropper/staging/encoded/script::token-array-powershell-file-escaped
      - id: micro-behaviors/os/com/automation::activex-constructor-call
    any:
      - id: micro-behaviors/os/registry/write::regwrite-name-token
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
      - id: objectives/anti-static/obfuscation/syntax::js-while-switch-state-machine
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
    needs: 1
  # Node self-persistence through a generated WSH shim: the script writes a
  # launcher that re-runs it with a hidden window, then registers that shim
  # with `reg add` under a Run key. auto-launch style packages register the
  # app binary directly; a hidden-window script shim hides the relaunch.
  - id: node-hidden-wsh-launcher-run-key
    desc: Node writes hidden WSH launcher to Run key
    crit: suspicious
    conf: 0.93
    attack: T1547.001,T1564.003
    all:
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
    any:
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text
