# A registry writer, Run-key path, and displaced Windows monitor co-occur.
# No claim of arbitrary data flow from the embedded path to the value writer.
defaults:
  platforms: [windows]
  for: [scripts, source]

composite_rules:
  - id: relocated-parental-monitor-run-key-writer
    desc: Run-key writer beside relocated parental monitor
    crit: suspicious
    conf: 0.95
    attack: T1547.001
    near_bytes: 2048
    all:
      - id: objectives/evasion/masquerade/path::appdata-parental-monitor-path
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
    any:
      - id: micro-behaviors/os/registry/write::batch-reg-add-run-key-direct
      - id: micro-behaviors/os/autorun/login-items::run-key-write-ps
      - id: micro-behaviors/os/registry/write::winreg-setvalue
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/os/registry/write::registry-setvalue-executable
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
