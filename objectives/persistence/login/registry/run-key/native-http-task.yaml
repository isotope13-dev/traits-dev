defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001
composite_rules:
  - id: http-inbox-agent-run-key-self-copy
    desc: HTTP shell agent with Run-key self-copy APIs
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/remote-command/tasking::http-file-inbox-shell-tasking
      - id: micro-behaviors/os/registry/manipulate::run-key-copy-own-path-api-profile
  - id: http-binary-task-rat-stack-run-key
    desc: HTTP RAT with stack Run-key write APIs
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/remote-command/tasking::native-http-binary-task-dispatch
      - id: micro-behaviors/os/registry/keys/autostart::stack-currentversion-run-key-x86
      - id: micro-behaviors/os/registry/access::reg-open-key-w
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
