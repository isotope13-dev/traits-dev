# A .reg file that plants its own command line in a Run key.
#
# `reg add ...Run` puts the whole change on a command line for anything
# reading process arguments. Shipping the same change as a registry script
# the victim imports (or that another script imports for them) reaches the
# same autostart state: a shell command executed at every logon. A default
# `@=` value running `command /c` or `cmd /c` is not a normal application
# autostart entry, which uses a named value with a quoted executable path.
defaults:
  platforms: [windows]
  for: [text, reg]
  attack: T1547.001,T1112
composite_rules:
  - id: reg-file-run-key-shell-persistence
    desc: Registry file persists shell via Run key
    crit: hostile
    conf: 0.96
    near_lines: 20
    all:
      - id: micro-behaviors/os/registry/write::regedit-header-line
      - id: micro-behaviors/os/registry/write::reg-hkey-section
      - id: micro-behaviors/os/registry/write::reg-run-key-path
      - id: micro-behaviors/os/registry/write::reg-default-shell-command
