defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: anti-analysis-websocket-agent-run-key
    desc: Concealed WebSocket agent combines persistence writer and Run key
    attack: T1547.001
    all:
      - id: objectives/command-and-control/remote-command/dispatch/eval::anti-analysis-websocket-script-agent
      - id: micro-behaviors/os/registry/manipulate::go-persistence-registry-value-write-call
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
