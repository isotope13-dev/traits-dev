defaults:
  platforms: [windows]
  for: [go]
composite_rules:
  - id: go-run-key-with-defender-blinding
    desc: Run key, reg add, and whole-drive AV exclusion
    crit: hostile
    conf: 0.99
    attack: T1547.001,T1562.001
    all:
      - id: objectives/evasion/anti-av/platform/defender::defender-whole-drive-exclusion
      - id: micro-behaviors/os/registry/manipulate::structured-reg-add-command
      - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
