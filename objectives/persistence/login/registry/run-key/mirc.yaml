defaults:
  platforms: [windows]
  for: [mirc, lua, data]
  attack: T1547.001
composite_rules:
  - id: mirc-concealed-or-reporting-run-autorun
    desc: Concealed or click-reporting IRC client autorun
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ipc/irc::mirc-script-event-start
      - id: micro-behaviors/os/registry/write::mirc-executable-autorun-registration
    any:
      - id: micro-behaviors/ui/window/visibility::mirc-dll-hide-call
      - id: micro-behaviors/communications/messaging/send::mirc-multiple-click-run-message-hooks
