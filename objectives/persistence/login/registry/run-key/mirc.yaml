defaults:
  platforms: [windows]
  for: [mirc, lua, data]
  attack: T1547.001
composite_rules:
  - id: mirc-hidden-client-run-persistence
    desc: Hidden mIRC client installs Run-key autorun
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/visibility::mirc-dll-hide-call
      - id: micro-behaviors/communications/ipc/irc::mirc-script-event-start
    any:
      - id: micro-behaviors/os/registry/write::mirc-regwrite-run-client-path
      - id: micro-behaviors/os/registry/write::mirc-staged-client-run-import
