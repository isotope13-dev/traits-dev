# A Run value named after a vendor's updater, written by a binary that is not
# that vendor's, starts the program at every logon while reading as routine
# update plumbing. Edge and OneDrive update through services and scheduled
# tasks, and Google's own Run value is "Google Update" with a space. The JAVS
# `fffmpeg.exe` implant (2024) wrote MicrosoftEdgeUpdate = its own path.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1547.001,T1036.005

traits:
  - id: vendor-updater-value-name
    desc: Vendor updater name as a value string
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|\\Run)(MicrosoftEdgeUpdate|OneDriveUpdate|GoogleUpdate)$'

composite_rules:
  - id: run-key-vendor-updater-value
    desc: Run-key path beside a vendor updater value name
    crit: notable
    conf: 0.88
    near_bytes: 128
    all:
      - id: micro-behaviors/os/registry/autostart/reference::ansi-run-key-path
      - id: vendor-updater-value-name
  - id: run-key-vendor-updater-impersonation
    desc: Writes a Run value posing as a vendor updater
    crit: hostile
    conf: 0.93
    all:
      - id: run-key-vendor-updater-value
      - id: micro-behaviors/os/registry/value/write::reg-set-value-ex-w
    unless:
      - id: metadata/signature/verified/platform::microsoft
