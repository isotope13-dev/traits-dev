defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001
composite_rules:
  - id: managed-staged-dropper-run-key-persistence
    desc: Managed dropper writes staged payload to Run key
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/os/registry/write::managed-registry-setter-token
      - id: micro-behaviors/process/create/flags::managed-temp-exe-launch-record
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
    unless:
      - id: metadata/signed/platform/
