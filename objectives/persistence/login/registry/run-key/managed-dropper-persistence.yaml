defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001
composite_rules:
  - id: managed-staged-dropper-run-key-persistence
    desc: Managed dropper writes staged payload to Run key
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/os/registry/value/write::managed-registry-setter-token
      - id: micro-behaviors/process/config/launch::managed-temp-exe-launch-record
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
