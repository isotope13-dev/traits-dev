# Trojan-Downloader persistence: an unsigned image fetches its payload over
# HTTP with dynamically resolved WinINet APIs, writes a value under a Run
# key with the registry API, and launches a process. The Run-key write goes
# through RegSetValueEx (not a silently imported .reg file, which is a
# different rule), and either the Policies Explorer Run key or the
# CurrentVersion Run key establishes the persistence target.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001
composite_rules:
  - id: dynamic-wininet-run-key-download-launch
    desc: Dynamic WinINet download with Run-key persistence and launch
    crit: hostile
    conf: 0.96
    attack: T1105,T1547.001
    all:
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/os/registry/autostart/reference::policies-explorer-run-key-path
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
    unless:
      - id: metadata/installer/product/
