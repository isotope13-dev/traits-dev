defaults:
  platforms: [windows]
  for: [go]
composite_rules:
  - id: go-self-image-read-run-key-writes
    desc: Self-image read and Run writes co-occur
    crit: suspicious
    conf: 0.95
    attack: T1547.001
    all:
      - id: micro-behaviors/fs/read/self::go-read-own-executable
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
      - id: micro-behaviors/os/registry/write::go-winreg-run-key-write-context
