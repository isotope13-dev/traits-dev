defaults:
  platforms: [windows]
  for: [class, java_class, jar]
  attack: T1547.001
composite_rules:
  - id: jvm-run-key-launches-javaw
    desc: JVM Run key launches hidden javaw
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/os/registry/keys/autostart::jvm-run-key-process-context
      - id: micro-behaviors/fs/path/basename::javaw-exe-literal
    any:
      - id: micro-behaviors/process/create/launch::java-jar-flag-literal
      - id: micro-behaviors/process/create/hidden::java-jar-launch-arg
      - id: micro-behaviors/process/info/selfpath::java-protection-domain
