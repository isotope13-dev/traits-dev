defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1547.001

composite_rules:
  # Tiny WiX OLE installers with a throwaway product subject, locked summary
  # security flag, and dense stream layout — typical of single-payload RAT
  # MSIs that persist via Registry/Run after unpack (tables invisible under
  # MSI text routing; identity+structure is the durable signal).
  - id: msi-tiny-opaque-persist-dropper
    desc: Tiny opaque WiX MSI with throwaway identity
    crit: hostile
    conf: 0.96
    attack: T1547.001,T1204.002
    size_max: 200000
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: metadata/package/files/msi::msi-ultrashort-product-subject
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: metadata/package/files/msi::ole-security-flag
      - id: metadata/package/files/msi::msi-opaque-stream-cluster
