defaults:
  platforms: [windows]
  for: [all]
  attack: T1547.001

composite_rules:
  - id: msi-run-key-masqueraded-host
    desc: MSI adds an executable to the Windows Run key
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: micro-behaviors/fs/path/installer::windows-run-key-executable-reference
